  ### Structured Simulation: "Legal Frames of Gestation"  
  **Objective:** Experience how legal regimes reclassify gestational surrogacy through **contractible continuity** (market model) vs. **status-based indivisibility** (prohibition model).  

  ---

  #### **Setup**  
  **Participants:** 14 students divided into 3 groups of 4–5 students each. Each group has:  
  - **Intended Parents (2 students):** Want legal parentage, minimize costs/risks.  
  - **Gestational Carrier (1 student):** Wants fair compensation and no long-term parental responsibility.  
  - **Clinic Broker (1 student):** Seeks a signed contract and brokerage fee.  
  - **State Registrar (1 student):** Follows legal protocols for birth registration.  

  **Materials:**  
  - Role cards (objectives below).  
  - "Contract Template" worksheet for negotiations.  
  - "Birth Certificate" slip (issued by facilitator post-negotiation).  
  - Symbolic **points system** (tracked visibly):  
    - *Intended Parents:* +50 for legal parentage, -10 per 10k units paid.  
    - *Gestational Carrier:* +30 for full payment, -20 if legally designated parent.  
    - *Clinic Broker:* +40 for signed contract, -30 if contract voided.  
    - *State Registrar:* +50 for compliance, -50 for violating law.  

  **Timeline (90 min):**  
  1. **Intro (5 min):** Explain roles, objectives, and points.  
  2. **Round 1: Regime A (Market Model, 25 min)**  
  3. **Round 2: Regime B (Prohibition Model, 25 min)**  
  4. **Debrief (35 min)**  

  ---

  ### **Round 1: Regime A (California-style Market Model)**  
  **Rules:**  
  - Commercial surrogacy is legal.  
  - Parental rights transfer via contract; no post-birth consent needed.  
  - **Clinic Broker** leads negotiations using the "Contract Template."  

  **Role Objectives:**  
  - **Intended Parents:** Secure parentage via contract. Pay ≤80k units total.  
  - **Gestational Carrier:** Earn ≥50k units. Avoid being named legal parent.  
  - **Clinic Broker:** Get a signed contract and 20k fee.  
  - **State Registrar:** Register parentage if valid contract exists.  

  **Process:**  
  1. Groups negotiate terms using the template:  
     - *Milestone payments:* Signing, pregnancy confirmation, birth.  
     - *Risk clauses:* Miscarriage (e.g., partial refund), breach (e.g., substance use).  
  2. Broker submits contract to **State Registrar**, who issues a "Birth Certificate" naming IPs as parents.  
  3. Points awarded based on outcomes.  

  **Outcome:**  
  - Contract divides gestation into compensable milestones.  
  - Registrar automatically recognizes IPs as parents.  

  ---

  ### **Transition to Round 2 (Facilitator Instructions)**  
  - Announce: *"The IPs relocated to Europe. Same biological situation, but new laws apply."*  
  - **Secretly give State Registrars a "Regime B Protocol" card:**  
    > "Commercial surrogacy contracts are void. The birth mother is the legal parent. Parental rights can only transfer via adoption (6-month process) or altruistic surrender (no payment beyond expenses)."  

  ---

  ### **Round 2: Regime B (European Prohibition Model)**  
  **Rules:**  
  - Payments beyond "reasonable expenses" (capped at 15k) void the contract.  
  - **State Registrars** enforce protocol but *cannot explain the law*—only reject non-compliant requests.  

  **Role Objectives (Same as Round 1, but constrained):**  
  - **Intended Parents:** Still seek parentage but face legal barriers.  
  - **Gestational Carrier:** Still want compensation but payments capped.  
  - **Clinic Broker:** Still seek a "contract" but commercial terms void.  
  - **State Registrar:** Must enforce protocol; reject commercial contracts.  

  **Process:**  
  1. Groups renegotiate. Broker attempts similar contract.  
  2. When submitted, **State Registrar**:  
     - Rejects contract if payments >15k.  
     - Refuses to name IPs on birth certificate.  
     - States: *"Gestational Carrier is legal parent. Transfer requires adoption."*  
  3. Groups must restructure as:  
     - **Adoption:** GC is legal parent; IPs negotiate post-birth adoption (delayed parentage, no payment).  
     - **Altruistic Gift:** GC surrenders rights "gratuitously" (no payment beyond 15k expenses).  
  4. Points adjusted under new constraints.  

  **Coordination Failure Mechanism:**  
  - Broker/IPs push for market-style terms → Registrar blocks → Groups hit structural barrier.  
  - GC faces pressure to accept low/no payment or retain legal parenthood.  

  ---

  ### **Debrief (35 min)**  
  **Guiding Questions:**  
  1. *Round 1:* How did you allocate risks/payments? Did the contract feel like a "service agreement"?  
  2. *Round 2:* What stalled negotiations? How did the Registrar’s rejection change your options?  
  3. Emotionally, what frustrated each role?  

  **Map Moments to Core Concepts:**  
  | **Simulation Moment**          | **Concept**                          | **Why It Matters**                                                                 |  
  |-------------------------------|--------------------------------------|-----------------------------------------------------------------------------------|  
  | Broker/IPs negotiate milestones (R1) | **Contractible Continuity**          | Gestation divided into priced, interruptible units (e.g., "pay per trimester").   |  
  | Registrar auto-approves (R1)  | **Divisible Labor + Status**         | Legal parentage detached from gestation; GC’s role ends at birth.                 |  
  | Registrar rejects contract (R2) | **Status-Based Indivisibility**      | GC’s status as "mother" is innate; cannot be voided by contract.                  |  
  | Groups restructure as adoption (R2) | **Indivisible Personal Status**      | Parentage transfer requires GC’s *ongoing* consent (adoption), not upfront payment.|  

  **What the Activity Reproduces:**  
  - Legal framing reshapes moral intuition (e.g., "fair payment" in R1 vs. "exploitation" in R2).  
  - How rules convert biological acts into commodifiable services or inalienable bonds.  

  **What It Cannot Reproduce:**  
  - Long-term psychological/embodied experience of gestation (e.g., GC’s physical burden, bond formation).  
  - Structural power imbalances (e.g., economic pressure on GCs in R1).  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Broker Over-Identifies with Market Efficiency:**  
     - *Problem:* Brokers may dismiss R2 constraints, pushing unenforceable contracts.  
     - *Solution:* Privately remind Brokers: *"Your goal is a valid agreement under local law."* Use Registrar’s veto to force adaptation.  

  2. **Points Feel Too Abstract:**  
     - *Problem:* Students treat points as "scores," not stakes (e.g., GC accepts low R2 payment).  
     - *Solution:* In role cards, add narrative stakes (e.g., IPs: "This is your only chance at parenthood"; GC: "You need funds for your child’s education").  

  3. **Registrar Hesitates to Block Agreements:**  
     - *Problem:* Registrar tries to "help" groups by bending rules.  
     - *Solution:* Emphasize in protocol: *"Your job security depends on strict compliance."*  

  4. **Groups Rush to Altruistic Adoption in R2:**  
     - *Problem:* GCs capitulate to "gift" model quickly, masking tension.  
     - *Solution:* As facilitator, ask GCs: *"Would you trust IPs to adopt post-birth if unpaid?"* Highlight power imbalance.  

  ---

  ### **Role Cards (Summary)**  
  **Intended Parents (R1/R2):**  
  > *Goal:* Secure legal parentage. Minimize costs.  
  > *R1:* Pay GC via milestones. Use contracts to allocate miscarriage/substance-use risks.  
  > *R2:* Same goal, but Registrar blocks automatic parentage. Restructure via adoption/gift.  

  **Gestational Carrier (R1/R2):**  
  > *Goal:* Earn ≥50k (R1) or "fair compensation" (R2). Avoid legal parentage.  
  > *R1:* Negotiate payment schedule/risk clauses.  
  > *R2:* Payments capped at 15k. You *will* be named legal parent at birth unless adoption/gift occurs.  

  **Clinic Broker (R1/R2):**  
  > *Goal:* Secure signed contract + 20k fee.  
  > *R1:* Draft contract with payments/risk clauses.  
  > *R2:* Contracts void if commercial. Restructure as "altruistic" or adoption-focused.  

  **State Registrar (R1):**  
  > *Goal:* Comply with law. Register IPs as parents if contract exists.  

  **State Registrar (R2 - SECRET):**  
  > *Goal:* Enforce prohibition. Void commercial contracts. GC is *always* legal parent at birth. Only adoption/gift enables transfer.  

  ---

  This simulation forces students to confront **contractible continuity** (R1’s divisible, monetized gestation) and **status-based indivisibility** (R2’s inseparable biological/legal identity) through procedural failure. The debrief ties visceral struggles to theory, revealing how law constructs the "value" of reproductive labor.
