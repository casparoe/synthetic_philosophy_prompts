  First, I need to map Singer's argument clearly: the core idea is that physical distance doesn't negate moral duty if you can prevent severe harm at minimal cost. The user flags two key interpretive tensions—whether Schindler's shift represents Singer's continuous duty or a binary moral awakening, and whether his ultimate sacrifice exceeds or fulfills Singer's demand.  

  The girl-in-red scene is crucial here. Cinematically, it's designed as an emotional catalyst, but philosophically, does this undermine Singer's claim that physical proximity is irrelevant? I should distinguish between psychological triggers (how humans actually respond) and normative claims (how they should respond). Singer would argue the red coat merely activates a preexisting duty.  

  On the sacrifice question: Singer's principle has built-in limits ("without sacrificing anything of comparable moral importance"). Schindler burning his fortune seems to exceed this—but does it? If saving one more life is still possible without comparable self-harm, Singer might say the duty persists. Yet practically, total self-ruin could disable future rescues. This tension isn't resolved in Singer's framework.  

  User also asks about testing ethics through historical drama—this is contested. Most philosophers accept thought experiments, but historical narratives add messy contingencies. Some might argue Schindler's specific choices can't prove or disprove universal principles.  

  Consensus points: Singer's principle doesn't require self-destruction; emotional triggers influence behavior but don't change duties. Contested: whether duty intensifies continuously vs. threshold-style, and how far sacrifice must go.  

