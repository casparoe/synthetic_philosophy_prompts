answer: |-
  ### Joint Statement on Empirical Underdetermination in Contemporary Physics  

  **Signed by Representatives of the Transientist and Structuralist Positions**  

  #### 1. Agreed Claims  
  Both parties endorse the following statements about underdetermination, auxiliary hypotheses, and empirical testing:  
  1. Empirical underdetermination—where multiple theories or models are consistent with all available data—is a demonstrable feature of contemporary physics (e.g., in dark-energy cosmologies and quantum-gravity phenomenologies).  
  2. Auxiliary hypotheses (e.g., calibration assumptions, background models) are necessary to connect theoretical representations to empirical data and can shield core theories from immediate falsification.  
  3. Underdetermination in historical cases (e.g., geocentric vs. heliocentric models) was often transient, resolved through new data, experimental refinements, or theoretical unifications.  
  4. In modern high-energy physics, computational methods (including machine learning) generate models whose predictions depend on complex, non-linear mappings between theoretical structure and observable outputs.  
  5. The scientific process aims for convergence toward theories with maximal predictive accuracy, empirical adequacy, and explanatory coherence, regardless of underdetermination’s persistence.  

  #### 2. Disagreements Table  
  The table isolates core disputes, phrased in each camp’s preferred terminology. Disagreements center on (i) predictive convergence, (ii) ontological weight of representational format, and (iii) normative simplicity.  

  | Transientist Position (Endorsed Wording) | Structuralist Position (Endorsed Wording) |
  |------------------------------------------|--------------------------------------------|
  | Current empirical equivalences (e.g., degeneracies in dark-energy parameters or quantum-gravity models) are artifacts of incomplete data, measurement limitations, or underdeveloped auxiliaries; future observations will collapse alternatives into a single best theory. | A distinct phenomenon—computational equivalence—arises when generative architectures (e.g., graph-based vs. tensor-network representations) yield identical empirical distributions due to structural decoupling from the observational interface; this may be ineliminable and irreducible to data gaps. |
  | Representational formats (e.g., choice of mathematical framework) are instrumental tools with no ontological significance; the "best explanation" is determined solely by predictive performance under mature data. | Representational formats encode non-arbitrary structural commitments; computational equivalence reveals that ontological content is underdetermined by empirical outputs, demanding a revised structural realism. |
  | Normative simplicity favors resolving underdetermination via incremental empirical progress, as historically observed; no new epistemic paradigm is needed. | Normative simplicity must accommodate persistent underdetermination from computational equivalence, motivating a shift toward structure-focused inference (e.g., prioritizing invariance across representations). |

  #### 3. Cruxes  
  Two cruxes are identified as pivotal for resolving the debate. Each crux includes a sub-question, a mutually agreed test, and explicit predictions.  

  **Crux 1: Does computational equivalence constitute a distinct kind of underdetermination?**  
  - *Sub-question*: Is computational equivalence (e.g., empirically identical outputs from ontologically divergent generative architectures) irreducible to classical Duhem-Quine underdetermination (e.g., auxiliary adjustments preserving a core theory)?  
  - *Relevant evidence*: **Comparison of LHC data-analysis pipelines** where graph-neural networks (GNNs) and tensor-network models simulate identical jet-tagging distributions. Conduct ablation studies by iteratively removing auxiliary assumptions (e.g., detector-response parametrizations) from both pipelines.  
    - *Transientist prediction*: Removing auxiliaries will break equivalence, revealing divergent predictions tied to representational choices, proving computational equivalence is Duhem-Quine–like.  
    - *Structuralist prediction*: Equivalence will persist despite auxiliary removal, confirming structural decoupling and a novel underdetermination form.  

  **Crux 2: Can future experiments resolve computational equivalence?**  
  - *Sub-question*: Will increased experimental precision (e.g., higher-energy colliders or deeper cosmological surveys) eliminate cases where distinct architectures produce identical data distributions?  
  - *Relevant evidence*: **Analysis of next-generation cosmic shear surveys** (e.g., LSST or Euclid) testing dark-energy models with GNNs versus tensor-field simulations. Measure if higher-precision weak-lensing data (σ < 0.5%) diverges their predictions.  
    - *Transientist prediction*: Enhanced data will differentiate models (e.g., >3σ divergence in equation-of-state parameters), collapsing equivalence into a single best-fit representation.  
    - *Structuralist prediction*: Models will retain statistical identity (>95% confidence overlap), demonstrating equivalence’s independence from data volume.  

  #### 4. Confidence and Uncertainty  
  - **Confidence in cruxes**: High coherence (9/10). The cruxes isolate substantive disputes (predictive convergence vs. structural persistence) and avoid verbal disagreements (e.g., "ontological weight" is operationalized via experimental outcomes).  
  - **Least certain point**: The framing of **computational equivalence as a live distinction** (confidence: 5/10). Transientists view it as a restatement of structural realism’s challenges, while Structuralists argue it emerges uniquely from data-driven modeling. Whether this is a *novel* phenomenon or a refinement of existing debates hinges on Crux 1’s outcome.  

  \answer{This statement establishes common ground, isolates disagreements, and identifies testable cruxes to resolve disputes about underdetermination’s scope in physics.}
