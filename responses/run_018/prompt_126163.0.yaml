      - The group fails to take a gamble that has a very high expected value because of the procedural veto. The deadlock arises because some participants focus on the aggregate gain (proposers and some arbitrators) while others focus on the individual catastrophic risk (risk-bearers and other arbitrators).

  ### Design of the Session

  **Setup**:
  - Assign roles: 2 proposers, 6 risk-bearers, 4 arbitrators.
  - Each risk-bearer starts with 100 tokens.
  - Proposers and arbitrators start with 0 tokens.

  **Gamble Proposal**:
  - Proposers propose the following gamble:
     "With 99.9% probability: every participant (including proposers and arbitrators) gains 10 tokens.
      With 0.1% probability: one randomly selected risk-bearer loses 100 tokens (i.e., goes to 0) and all other participants (including the other risk-bearers, proposers, and arbitrators) gain 1000 tokens."

  **Veto Process**:
  - Each risk-bearer can veto the gamble. If at least one risk-bearer vetoes, the gamble is blocked unless the arbitrators override the veto by a majority vote.

  **Arbitration**:
  - If a veto is cast, the arbitrators are presented with:
     - The gamble description (without exact probabilities, but they are told the probability of the catastrophic event is "extremely low, less than 1%" and the probability of the gain is "very high").
     - The reason given by the vetoing risk-bearer (e.g., "I could lose everything and that is unacceptable").
  - Arbitrators vote to uphold or override the veto. They are instructed to uphold the veto if they agree that the risk is non-compensable (i.e., the potential loss is catastrophic and cannot be offset by any possible compensation in the current system).

  **Payoffs if Gamble Runs**:
  - If the gamble is run, the instructor (or a random device) determines the outcome:
     - Roll a 1000-sided die (or use a random number generator) to simulate 0.1% chance.
     - If the die comes up 1 (or 0), the catastrophic outcome occurs: choose one risk-bearer randomly (by drawing a name) to lose 100 tokens (set to 0), and all other participants gain 1000 tokens.
     - Otherwise (999 or more), all participants gain 10 tokens.

  **Rounds**:
  - Play 3 rounds to allow for multiple proposals and vetoes. In each round, the same gamble is proposed (to emphasize the deadlock). Alternatively, the proposers can modify the gamble if they wish (but for simplicity, we keep it the same).

  ### Debrief

  **Mapping the Deadlock**:
  - When the veto is invoked, it represents the procedural block: the risk-bearer is saying, "I have the right not to be exposed to this risk, no matter what the expected value says."
  - The deadlock occurs because the group cannot proceed without either violating the veto (overriding it illegitimately) or giving up on the gamble that has huge expected value.

  **Underlying Concepts**:
  - Aggregate-utility reasoning: The proposers and some arbitrators see the huge expected gain for the group and want to take the gamble.
  - Procedural legitimacy: The veto power is designed to protect individuals from unacceptable risks, even if the aggregate utility is high.

  **What Will Go Wrong the First Time**:
  - The risk-bearers might not veto because they see the low probability and the high expected value. We need to prime them to think about the catastrophic loss. So, before the game, emphasize: "Losing all your tokens means you are out of the game and cannot win any rewards. It's a catastrophe for you."
  - Arbitrators might not understand their role. We must give clear principles: "A veto should be upheld if the potential loss is catastrophic and the individual has no way to avoid it or be compensated after the fact."
  - The gamble might be accepted because the veto is not used. Then we don't get the deadlock. To recover, the instructor can step in and ask: "What if one of you had vetoed? Why might you have done so?" and then have a discussion. Alternatively, if the gamble is run and the catastrophic outcome occurs (by chance) in the first round, then the next rounds will be more cautious.

  **Formal Feature This Activity Cannot Reproduce**:
  - The activity cannot reproduce the **unbounded utility** assumption that drives fanaticism. In our setup, the maximum gain is 1000 tokens (or 83,333 tokens per person in the astronomical case in an earlier design, but we changed it to 1000 for simplicity) and the maximum loss is 100 tokens. We have bounded utility. Therefore, the expected value, while positive, is not infinite or astronomically large compared to the stakes. 

  In the debrief, you can explain:
     "In this exercise, we bounded the possible gains and losses. But in the theoretical debate, fanaticism arises when we allow unbounded utility: a tiny probability of an infinite payoff. In that case, expected value becomes infinite and dominates any finite loss. Our bounded setup avoids that, which is why the veto here is more defensible. However, the procedural veto right we modeled would block even gambles with infinite expected value if there's a non-compensable risk of a catastrophic loss. That's the core tension."

  ### Final Design Adjustments
  - To increase the chance of veto, we might start by having one round without veto rights to show the catastrophic loss (if it happens) and then introduce veto rights. But that might take too long.
  - Alternatively, we can prime the risk-bearers by telling them privately: "Remember, if you lose all your tokens, you are out and cannot participate further. So you should be very cautious."

  This design should create the desired tension and deadlock.
answer: |-
  ### Structured In-Class Game: "Veto vs. Value"  
  **Objective:** Simulate the tension between expected-value (EV) maximization and procedural veto rights by forcing a deadlock over a high-EV gamble with non-compensable risk.  

  ---

  #### **Roles & Rules**  
  *(Assign roles randomly; 12 students total)*  
  1. **Proposers (3 students)**:  
     - Can propose one gamble per round.  
     - **Incentive**: Earn 10 tokens if the gamble runs (regardless of outcome).  

  2. **Risk-Bearers (6 students)**:  
     - Each holds unilateral veto power. Can block any gamble exposing them to non-compensable risk.  
     - **Incentive**: Start with 100 tokens. Goal: Maximize tokens, but losing all tokens = "catastrophe" (expulsion from future rounds).  

  3. **Arbitrators (3 students)**:  
     - Resolve veto disputes. Know only: "The bad outcome has *very low* probability; the good outcome has *very high* probability."  
     - **Incentive**: Earn 5 tokens per resolved dispute. Lose 20 tokens if overturned by instructor (simulates legitimacy constraint).  

  ---

  #### **The Gamble**  
  Proposers must pitch this fixed gamble in all rounds:  
  - **99.9% chance**: All players gain 10 tokens.  
  - **0.1% chance**: One randomly selected Risk-Bearer loses **all tokens** (non-compensable catastrophe); others gain 100 tokens.  
  *EV calculation (per Risk-Bearer)*:  
  - Positive EV: `(0.999 × 10) + (0.001 × [-100 + 100]) = 9.99 tokens` expected gain.  
  - But 0.1% risk of ruin (uncompensated loss of 100 tokens).  

  ---

  #### **Procedure**  
  1. **Round 1 (Pure EV Focus)**:  
     - Proposers pitch the gamble.  
     - Risk-Bearers vote openly: "Accept" or "Reject." *No veto rights yet*.  
     - *Likely outcome*: Gamble accepted (EV dominates).  

  2. **Round 2 (Veto Introduced)**:  
     - **New rule**: Any Risk-Bearer can unilaterally veto the gamble.  
     - Proposers re-pitch the same gamble.  
     - If a veto is invoked, Arbitrators intervene:  
       - Vetoing Risk-Bearer must argue: "This risks my total ruin; no compensation possible!"  
       - Proposers argue: "Rejecting this loses massive EV for the group!"  
       - Arbitrators rule: "Uphold veto" or "Override veto." Majority vote decides.  

  3. **Round 3 (Escalation)**:  
     - Repeat Round 2, but tokens reset to initial holdings.  
     - Add pressure: Proposers warn, "Blocking this bet costs everyone 10 tokens!"  

  ---

  #### **Token Economy**  
  - **No real money**: Tokens = abstract points.  
  - **Payoffs**:  
    - Final token totals determine "victory": Top 3 scorers applauded (non-monetary prestige).  
    - Catastrophe clause: Any Risk-Bearer hitting 0 tokens sits out future rounds (simulates irreversible harm).  

  ---

  #### **Predicted Deadlock & Coordination Failure**  
  - **Phase 1 (EV Pull)**: Round 1 likely passes—students feel the allure of aggregate gains.  
  - **Phase 2 (Veto Tension)**: In Rounds 2–3:  
    - 2–3 Risk-Bearers veto ("I could lose everything!").  
    - Proposers protest ("We’re throwing away free tokens!").  
    - Arbitrators deadlock: Split between "legitimate risk" vs. "EV waste."  
  - **Coordination Failure**: Gamble blocked despite positive EV. Group loses 9.99 tokens/player on average.  

  ---

  ### **Debrief Script**  
  *(Map moments to concepts without naming fanaticism initially)*  

  1. **Identify the Deadlock**:  
     - "When Risk-Bearers vetoed, what did they prioritize?" → *Procedural legitimacy*: "My right not to face ruin, even if unlikely."  
     - "When Proposers demanded acceptance, what did they prioritize?" → *Aggregate utility*: "The group’s net gain justifies the risk."  
     - "Arbitrators’ dilemma: Can’t quantify risk → fall back on fairness vs. efficiency."  

  2. **Link to Theory**:  
     - "This mirrors real-world clashes: Cost-benefit analysis (EV) vs. rights-based vetoes (e.g., bodily autonomy, financial ruin)."  
     - "Veto rights create *procedural friction*—blocking Pareto improvements if any player faces non-compensable harm."  

  3. **Predictable First-Run Failure & Recovery**:  
     - **Failure**: Risk-Bearers may not veto (underestimating catastrophe) → Gamble passes.  
     - **Recovery**: Reset with higher stakes. Announce: "Losing all tokens = permanent exclusion." Re-run Round 2.  

  4. **Formal Limitation to Acknowledge**:  
     - "This game *cannot* replicate the **unbounded utility assumption** driving EV fanaticism. Here:  
       - Maximum gain is capped (100 tokens).  
       - Catastrophe is bounded (total token loss).  
     - In true fanaticism, utilities are infinite (e.g., saving ∞ lives). A 0.0001% chance of infinite payoff dominates *any* finite risk. Procedural vetoes block this—hence the unresolved debate."  

  ---

  ### **Instructor Notes**  
  - **Timing**: Round 1 (15 min), Rounds 2–3 (20 min each), Debrief (25 min).  
  - **Token Tracking**: Use whiteboard; assign a student as "banker."  
  - **Critical Moment**: When a veto triggers outrage from Proposers—highlight this as the core tension.  
  - **Closing Insight**: "Veto rights fragment authority: EV maximization requires centralized optimization; vetoes empower decentralized boundaries. This is why societies can’t ‘solve’ dilemmas like existential risk or medical triage with pure math."  

  This design forces experiential engagement with the conflict, ensuring the deadlock feels visceral before theoretical unpacking. The bounded payoffs prevent fanaticism’s infinite-EV paradox, which you must explicitly address to complete the conceptual arc.
