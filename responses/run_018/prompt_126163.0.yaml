  We are designing a role-play for a graduate seminar to explore the tension between expected value maximization and procedural veto rights. The goal is to create a deadlock where some participants want to take a gamble with a tiny probability of an astronomical payoff, while others block it on procedural grounds (non-compensable risk). 

