      - The proposers will propose the gamble because the EV is high.
      - Some risk-bearers (especially those who are more risk-averse) will veto because they don't want to risk losing everything, even with low probability.
      - The arbitrators might be split: some might see the veto as legitimate (because the loss is catastrophic and non-compensable) and others might override (because the chance is low and the group stands to gain a lot).
      - Without a clear majority, the veto might stand and the gamble is blocked, leading to no action.

