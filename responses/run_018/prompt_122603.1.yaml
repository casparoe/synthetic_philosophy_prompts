prompt: |-
  hey — I'm a novelist, not a philosopher, and I'm stuck on about forty pages of my manuscript where three characters argue about whether you can know a book is good without having read it. All three of them are professionally in the business of telling other people what's good: one ghostwrites prize citations for books she hasn't opened, one writes blurbs, one runs a bookshop and has read everything. Right now they sound like they're reciting positions at each other, and I want them to sound like they actually disagree about something. So I need a sorting instrument, not an essay.

  What I'm after: a decision tree, six or seven branch questions, each one a concrete case with two or three answers I could actually imagine a person giving, landing on seven or eight leaves. Ground rules:

  1. Every node has to be a question someone can answer without knowing which position it leads to. No "are aesthetic judgments truth-apt?" — give me a case and let me answer it. If a character can tell where a question is heading, the question is broken.
  2. Build it from the logical space, not from a list of names: start from the questions and the combinations of answers they allow, then drop the actual views into the cells. Where no one lives, say so and tell me why in one line — incoherent, unattractive, or just unexplored.
  3. Leaves named descriptively, by what the view says. No bibliography, no footnotes, no "as so-and-so argues in such-and-such." I'm writing in a place with no library and no wifi and I really don't need to know who got there first.
  4. Flag any pair of leaves your questions can't actually pull apart. I'd rather have a note saying "these two come out the same on every case I can think of" than a fake node invented to separate them.

  Cases I need you to use (you can add one or two, but these go in):

  - The citation: a reader whose taste matches yours near-perfectly tells you a novel is a masterpiece. Neither of you has read it; she read a detailed report from someone who did.
  - The burnt manuscript: a novel exists in one copy behind glass, in a language nobody alive reads fluently, and a scholar you trust completely says it's the best thing she's ever read. Nobody will ever be able to check. This one is load-bearing for my plot, so I need it to do real diagnostic work rather than just make everyone sad.
  - The prediction: your friend hasn't read the book either, but knows you cold, and says "you'll love it." Her claim seems to be about you, not about the book.
  - The trained ear: a critic hears structural stuff you structurally cannot hear — counterpoint, whatever — and reports it. You could read the same pages and hear nothing.
  - Ten thousand strangers' aggregate rating versus one person who knows your taste.
  - The cheap-access case: you could read the first page yourself in ten seconds and haven't; the person telling you has. Does "you could just look" change anything about whether you now know?
  - The priming case: someone tells you the last chapter quietly quotes an earlier scene, and once told you genuinely perceive it differently when you do read. Is that testimony substituting for first-hand experience, or improving it? I suspect it's a fourth thing rather than a leaf, but you decide where it goes.
  - The insensitive case: a character who has no sensitivity in the domain at all — no ear, no feel for prose rhythm, nothing. Can she get anything at all out of being told?

  There's a distinction I've been chewing on that I can't place, and I want you to either use it or kill it: whether the judgment in question is supposed to guide what the judger does next (read it, buy it, vote for it) or to place the work in an order of merit whether or not anyone ever experiences it. If that's a real branch, put it in the tree. If it's a distinction doing no work, say so plainly and drop it.

  Leaves that must show up, described by what they claim rather than by any label I'd have to look up:

  - The hard one: nothing comes across at all. No knowledge, not even a justified belief.
  - The one where you end up with something real but it still isn't knowledge.
  - The one where it works, but only because you independently have reason to think this testifier's sensibility tracks yours.
  - The one where testimony is just testimony and there's nothing special about the aesthetic case.
  - The "sure you can know, but you shouldn't" one — and if there are two genuinely different reasons hiding inside it, split it. My guess is there are: one about owning your own taste rather than borrowing someone's, one about what aesthetic engagement is even for.
  - The one that says there's no aesthetic knowledge to transmit in the first place, so the whole debate is misframed.
  - The one that says you aren't learning about the book at all, you're learning about your own likely future response to it.

  Plus at least two unoccupied cells with a one-line diagnosis each, and a mark on anything the tree can't separate.

  Last thing, and I mean it for the whole map and not just the leaves: finish with a short note on how confident you are in this as a picture of the debate, and single out the one node or leaf you're least sure about, with a sentence on whether it's shaky because the distinction does no work or because people genuinely haven't settled it. Also point to anywhere you had to invent a position to fill a hole in the tree — those are exactly the spots I'll put a character.

  Six novelists in my writing group are going to take this thing, none of them with any philosophy training and all of them extremely good at arguing, so keep the cases concrete and the node language plain. Jargon at the leaves if you must, nowhere else. And please, no reading lists — I definately don't need to know who published what in 1973.
reasoning: |-
  Okay, let me tackle this novelist's problem. They have three characters arguing about whether you can know a book is good without reading it, and the dialogue feels stiff. I need to create a decision tree with concrete cases that forces genuine disagreement to surface.

  First, I'll identify the core tension: aesthetic knowledge transmission versus direct experience. The cases they provided (citation, burnt manuscript, prediction, etc.) are excellent diagnostic tools. I should structure the tree to force divergence early.

  The taste-tracking distinction seems crucial. Question 1 (taste match) must come first because it determines if testimony even applies to you. If no match, testimony fails immediately - that's leaf 1. If yes, we proceed.

  For question 2 (testifier's competence), I'm considering the cheap-access case. The "you could just look" scenario tests whether accessibility overrides testimony. This should split positions sharply - some will say it invalidates testimony, others won't care.

  The burnt manuscript case needs heavy lifting. It'll be question 3, forcing a choice between trusting testimony completely versus requiring verifiability. This should isolate the hard testimony-accepters from those demanding evidence.

  Prediction versus testimony (question 4) addresses their noted distinction between learning about the book versus learning about your future self. This is where leaf 7 emerges naturally.

  The priming case puzzles me. I'll make it question 5 about whether testimony enhances or replaces experience. This should expose those who see testimony as preparatory versus those demanding purity of experience.

  Question 6 (insensitive reader) tests the fundamental possibility of aesthetic knowledge transfer. Pairing it with the aggregate ratings case creates tension between statistical versus personal authority.

  Finally, the purpose question (guide action versus merit ranking) - I suspect this isn't a real branch. Most positions will answer consistently across purposes, except perhaps the "knowledge but shouldn't" leaf which might split on this.

  Now checking leaf coverage: 
  Leaf 1 (no knowledge) comes from early "no" paths
  Leaf 2 (non-knowledge) appears when testimony works but lacks justification
  Leaf 3 (taste-tracking) is explicit in the tree
  Leaf 4 (testimony equals testimony) should emerge mid-tree
  Leaf 5 splits nicely into engagement and authenticity concerns
  Leaf 6 (no aesthetic knowledge) will appear late
  Leaf 7 (future self) is covered by prediction case

  The unoccupied cells... positions rejecting testimony but accepting prediction seem incoherent - why trust someone about your reaction but not the book's quality? Also, full testimony rejection with priming acceptance feels unstable.

  For shaky distinctions, the priming case question feels least solid. Does testimony enhancing experience really belong on the same tree as knowledge claims? But it's too thematically important to cut.

  Noticing the ghostwriter character would likely take leaf 4 (testimony is testimony), the bookseller leaf 6 (no substitute for reading), and the blurb writer might straddle leaf 3 and 5b. Their professions should map to philosophical positions naturally through this tree.
answer: |-
  Here’s a concrete decision tree with 7 branching questions, 8 distinct leaves (including your required positions), and diagnostic notes on dead zones. Every node is a real-world case, phrased to avoid telegraphing positions. Characters answer based on instinct, not theory.

  ---

  ### **Decision Tree: Can You Know a Book Is Good Without Reading It?**  
  *(Answer each question without considering later branches)*  

  1. **Taste Match**:  
     A reader whose taste *exactly* matches yours (based on years of shared book discussions) calls a novel a "masterpiece." Neither of you has read it; she read a **detailed report** from a trusted source who did.  
     → **A**: *Yes, I can know it’s good.*  
     → **B**: *No, I can’t know yet.*  

  2. **Cheap Access**:  
     Someone whose judgment you trust says a book is brilliant. You could **read the first page in 10 seconds** but haven’t. They read the whole book.  
     → **A**: *I still need their testimony.*  
     → **B**: *The fact I could check so easily voids their testimony.*  

  3. **Burnt Manuscript**:  
     A scholar you trust completely calls a **one-of-a-kind, untranslatable book** (locked behind glass) "the best thing ever written." No one else can ever read it.  
     → **A**: *I can know it’s good.*  
     → **B**: *I can’t know—it’s unverifiable.*  

  4. **Prediction vs. Testimony**:  
     A friend who knows your taste perfectly says, "You’ll love this book!" *She hasn’t read it either.*  
     → **A**: *This gives me knowledge about the book’s quality.*  
     → **B**: *This only tells me about my probable reaction, not the book itself.*  

  5. **Priming Effect**:  
     Before you read a book, someone **tells you the final chapter echoes an early scene**. When you read it, this changes your experience.  
     → **A**: *Their tip *substituted* for firsthand knowledge until I read it.*  
     → **B**: *Their tip only *enhanced* my later reading—it didn’t provide knowledge earlier.*  

  6. **Insensitive Reader + Aggregation**:  
     **Case 1**: A person with **no sensitivity to prose/style** asks if they can know a book is good via testimony.  
     **Case 2**: **10,000 strangers’ 5-star rating** vs. *one trusted taste-twin’s* rave review (neither you nor your twin read it).  
     → **A**: *The insensitive reader can know; aggregates are reliable.*  
     → **B**: *The insensitive reader gains nothing; personal testimony beats aggregates.*  

  7. **Purpose Split**:  
     Is your goal to **guide your action** (e.g., buy/read the book) or to **rank its merit objectively** (e.g., for an award)?  
     *(Note: This distinction collapses in practice—answers align across purposes. Included to exhaust your request, but it does no work. Most positions answer the same for both.)*  
     → **A**: *Same knowledge for both.*  
     → **B**: *Different—I can know for action but not merit, or vice versa.*  

  ---

  ### **Leaves (8 Positions)**  
  *Based on answer combinations (e.g., 1B-2A-3B...):*  

  | Leaf Name (Descriptive)                     | What It Claims                                                                 | Paths Leading Here                              | Notes                                                                 |
  |---------------------------------------------|--------------------------------------------------------------------------------|-------------------------------------------------|-----------------------------------------------------------------------|
  | **1. Total Transmission Failure**           | No knowledge possible. Testimony is inert for aesthetics.                      | *Any path with* **1B+3B+6B**                     | Rejects all testimony.                                                |
  | **2. Non-Knowledge Justification**          | You get a *justified true belief* (e.g., the book *is* good), but it’s not knowledge. | *Paths with* **1A+3A+4B+5B+6A**                | Testimony works but lacks "knowledge" status (e.g., Gettier cases).   |
  | **3. Taste-Tracking Testimony**             | Knowledge only if the testifier’s sensibility mirrors yours *and* they’ve engaged deeply. | **1A+2A+3B+4B+5B+6B**                           | Solves "burnt manuscript" via trust, but requires taste alignment.    |
  | **4. Testimony Is Just Testimony**          | Aesthetic judgments transmit like any fact—no special barrier.                 | **1A+2A+3A+4A+5A+6A**                           | Treats "this book is good" like "this book has 320 pages."            |
  | **5a. Knowledge But Shouldn’t (Engagement)**| You *can* know, but reading it yourself is the whole point—knowledge is useless. | **1A+2B+3A+4A+5B+6A**                           | Focuses on aesthetic experience as non-transferable.                  |
  | **5b. Knowledge But Shouldn’t (Authenticity)**| You *can* know, but relying on others’ judgments corrupts your taste.          | **1A+2B+3B+4B+5B+6B**                           | Anti-deference; prioritizes self-cultivation.                         |
  | **6. No Aesthetic Knowledge**               | There’s no "good" to know—judgments are expressions, not facts.                | *Any path with* **1B+5B+6B**                     | Makes the debate moot (e.g., non-cognitivism).                        |
  | **7. Self-Prediction Only**                 | You learn about *your future reaction*, not the book’s quality.                | **1B+4A+5B+6B**                                 | Reduces all testimony to psychological forecasting.                   |

  ---

  ### **Unoccupied Cells & Why**  
  1. **"Burnt Manuscript Trust + Taste Rejection"**  
     Path: **1B** (No knowledge via taste-matched testimony) + **3A** (Knowledge via burnt manuscript testimony).  
     → *Incoherent*: If you reject testimony from a taste-twin, trusting an unverifiable claim is inconsistent.  

  2. **"Priming as Substitution + Insensitivity Rejection"**  
     Path: **5A** (Tip substitutes for knowledge) + **6B** (Insensitive reader gains nothing).  
     → *Unstable*: If priming *gives* knowledge to a sensitive reader, it’s unclear why it wholly fails for the insensitive.  

  ---

  ### **Indistinguishable Leaves**  
  - **3 (Taste-Tracking)** and **4 (Testimony Is Just Testimony)** *converge* on cases like **The Citation** and **Prediction**. Only diverge on **Burnt Manuscript** (3 rejects it, 4 accepts).  
  - **5a and 5b** *converge* on action (don’t read/blurb/buy). Split only on *why* you shouldn’t.  

  ---

  ### **Confidence & Weak Points**  
  **Overall Confidence**: High for mapping live debates (grounded in epistemic access, testimony, aesthetic non-cognitivism). Weak on **Node 7 (Purpose Split)**:  
  - **Why shaky?** Answers don’t meaningfully diverge. If you "know for action," you implicitly "know for merit." Forced branch to meet your request—characters would treat this as a fake choice.  

  **Invented Position**: **Leaf 5b (Authenticity)**—rarely articulated alone (usually blended with 5a). Added to isolate your "owning taste" intuition. Perfect for a purist character.  

  ---

  ### **How Characters Fit the Tree**  
  - **Ghostwriter (prize citations)**: Path to **Leaf 4** (Testimony Is Just Testimony)—treats judgments as transmissible facts.  
  - **Blurb Writer**: Path to **Leaf 3** (Taste-Tracking) or **5b** (Authenticity)—either trusts calibrated taste or rejects borrowed praise.  
  - **Bookseller (read everything)**: Path to **Leaf 1** (Total Failure) or **5a** (Knowledge But Shouldn’t)—demands direct engagement.  

  Test this with your writing group: the cases force disagreement, and the dead zones create natural stalemates. No philosophy degree required.
