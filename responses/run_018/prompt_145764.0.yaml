prompt: |-
  Write the opening remarks for a workshop titled "The Demos We Draw," convened in the wake of a municipal decision to extend local voting rights to non-citizen residents of five years' standing while excluding seasonal agricultural workers on rolling visas who have lived continuously in the jurisdiction for three years. The audience is mixed: democratic theorists, local officials, members of the newly enfranchised community, and representatives of the excluded workers. The remarks must take the boundary problem—who belongs to the demos?—as structurally unresolved rather than decorative: every criterion proposed (residence, citizenship, affected interests, subjection to law) must be shown to draw a line that includes some and excludes others without natural justification. To avoid a standard recitation of familiar arguments, inject and rely on a specific conceptual distinction: separate "membership as authorization" (the standing to authorize collective decisions) from "membership as exposure" (being structurally subject to decisions made by others without having authorized them). The distinction should do real work in the speech, constraining what the speaker can claim—honoring the council's expansion without treating it as a solution, and acknowledging the excluded workers without collapsing their claim into that of citizens. Deliver the remarks as exactly five points, each one or two sentences, with no introductory or concluding framing outside those five. Do not name specific philosophers, cite texts, or include bibliographic references; write for an audience that includes both specialists and non-specialists.
reasoning: |-
  Okay, the user wants me to craft opening remarks for a workshop titled "The Demos We Draw." This is in response to a municipal decision that extended voting rights to non-citizen residents who've lived there for five years, but excluded seasonal agricultural workers on rolling visas who've been there continuously for three years. The audience is mixed—democratic theorists, local officials, newly enfranchised people, and representatives of excluded workers.

  The key challenge is to address the boundary problem: who belongs in the demos? I need to show that any criterion like residence, citizenship, affected interests, or subjection to law inherently includes some and excludes others without a "natural" justification. The user specifically wants me to avoid rehashing old arguments and instead use a conceptual distinction: "membership as authorization" (who gets to authorize decisions) versus "membership as exposure" (who is subject to decisions without having a say). This distinction must do real work—honor the council's expansion without treating it as a solution, and acknowledge the excluded workers without equating them to citizens.

  The remarks need to be structured as exactly five points, each one or two sentences. No introductions or conclusions outside those points. I can't name philosophers or cite texts; it has to be accessible to specialists and non-specialists alike.

  I'll start by defining the core problem in the first point, then introduce the distinction in the second. Point three should apply it to the enfranchised group, point four to the excluded workers, and point five should frame the workshop's purpose. I need to make sure the language is clear and neutral, respecting all perspectives while highlighting the unresolved tension.

  For the distinction: "Authorization" is about the power to vote and legitimize decisions, while "exposure" is about being affected by those decisions without a voice. This helps explain why the council's move is significant but incomplete—it grants authorization to some long-term residents, but excludes workers who are exposed to decisions. I can't suggest the exclusion is justified; it's just a line drawn arbitrarily.

  The user's deeper need might be to foster a productive discussion that doesn't polarize the audience. By focusing on this conceptual tool, I can encourage critical thinking without taking sides. I'll keep it concise, empathetic, and forward-looking to set a collaborative tone for the workshop.
answer: |-
  1.  We gather today not to celebrate a settled answer but to confront the persistent, difficult question: who *is* the 'we' that authorizes the rules binding us all? Every boundary drawn – by residence, citizenship, affectedness, or subjection – inevitably includes some and excludes others without clear natural justification.
  2.  To navigate this, we must rigorously separate two distinct kinds of membership: *authorization* – the standing to legitimize collective decisions through participation – and *exposure* – the condition of being deeply subject to those decisions without having authorized them.
  3.  The council’s decision extended *authorization* to non-citizen residents meeting a five-year threshold – a significant act acknowledging their stake, yet this line unavoidably leaves others outside the circle of legitimizing power.
  4.  For the excluded agricultural workers, their continuous presence and structural *exposure* to the municipality’s laws and policies is undeniable and consequential, existing regardless of their lack of formal *authorization* under the new rule.
  5.  Our task is to examine how these concepts – authorization and exposure – illuminate the tensions and trade-offs inherent in this specific boundary, seeking clarity without assuming easy resolution, as both forms of membership demand serious consideration.
