prompt: |-
  Next term I'm running one fifty-minute seminar on Gongsun Long's white horse dialogue for first-year undergraduates in a cross-cultural philosophy of language course; they will have read a translation but nothing else from the School of Names, and most will arrive suspecting the thesis that a white horse is not a horse is either a translation glitch or a parlour trick. Plan my explanation rather than giving it. What has to be in place before the argument can look like anything other than a falsehood (e.g., a distinction between what a term picks out and what it requires of what it picks out), and should the white horse itself carry the whole session or should I build the structure first on a modern analogue -- if so, say what the analogue must preserve and what it must not smuggle in. Map the misconceptions I should expect (that it is mere sophistry, that it reduces to a point about subsets and Venn diagrams, that it is really about Chinese grammar treating nouns as mass terms) and mark exactly where in the sequence each should be headed off rather than answered afterwards. Finally, give me one closing question that reveals whether they have grasped the argument as opposed to memorised the verdict, and name what I should openly refuse to cover at this level. Please write in British English.
reasoning: |-
  Okay, the user is preparing a seminar on Gongsun Long's white horse paradox for first-year philosophy students. They need a lesson plan that helps students see the argument as more than just sophistry. 

  Hmm, the key challenges are obvious: students will walk in thinking "a white horse isn't a horse?" is either mistranslation or wordplay. The user wants to avoid that surface-level dismissal. 

  First, I should identify the core philosophical distinction needed - probably something like connotation vs denotation. The "white horse" argument turns on separating what a term refers to (denotation) from the criteria it imposes (connotation). If students don't grasp that, they'll keep retreating to Venn diagrams. 

  For the modern analogue... a "pet fish" example might work? But I must be careful. If I say "a pet fish isn't a pet", that's factually wrong in a way Gongsun Long's claim isn't. Need to preserve the logical tension without importing Western ontology. Perhaps "a toy gun isn't a gun" - keeps the categorical denial while being intuitively debatable. 

  Major misconceptions to preempt: 
  - The sophistry accusation: head this off right after stating the thesis by framing it as a genuine philosophical puzzle 
  - The set theory reduction: block this when introducing the connotation/denotation distinction 
  - The mass noun theory: address during the Chinese linguistic context segment, emphasising it's about logic not grammar 

  Closing question... something that forces application rather than regurgitation. Maybe: "If I argue a counterfeit banknote isn't a banknote, is that the same move Gongsun Long makes? Why/why not?" 

  What to explicitly exclude: Later Mohist critiques or Zeno comparisons. First-years would drown in that depth. Stick to unpacking the core argument. 

  User's clearly experienced - they've flagged all the right pitfalls. Just needs structure to prevent students missing the point. Should emphasise making the "connotation" concept tactile... maybe with that coloured shapes exercise. 

  Right, British English throughout. "Seminar" not "class", "colour" not "color". Keep it crisp but not rushed - fifty minutes is tight for this.
answer: |-
  Here’s a structured plan for your seminar, prioritising conceptual groundwork and pre-emptive misconception management, in British English:

  **Core Objective:** Students grasp that Gongsun Long’s argument hinges on a distinction between **reference** (what a term successfully picks out) and **intension/meaning** (the criteria something must satisfy to *be* picked out by the term).

  **Seminar Structure (50 mins):**

  1.  **Framing & Stating the Puzzle (5 mins):**
      *   State Gongsun Long’s thesis bluntly: "A white horse is not a horse" (Bai ma fei ma).
      *   Acknowledge the intuitive absurdity: "This sounds like nonsense or trickery. Why would anyone claim this?"
      *   Frame the goal: "Our task isn't to agree or disagree immediately, but to understand *why* a sophisticated philosopher would make this claim. What distinction might he be forcing us to confront?"

  2.  **Building the Essential Distinction via Modern Analogue (15 mins):**
      *   **Analogue:** Use **"A toy gun is not a gun"**.
      *   **Why this analogue?**
          *   **Preserves:** Clear categorical denial ("is not"); involves a modifier ("toy") changing the core term ("gun"); generates intuitive tension (it *looks* like a gun but isn't *functionally* a gun).
          *   **Avoids Smuggling In:** Does *not* rely on abstract set theory (Venn diagrams), specific Chinese grammar, or physical identity/parthood issues.
      *   **Exercise:**
          *   Ask: "In what sense *is* a toy gun a gun? In what sense *isn't* it?" (Elicit: Looks like one vs. *Functions* as a weapon/fires projectiles).
          *   **Crucial Move:** "When we say 'A toy gun is not a gun', we mean it fails to satisfy the core *purpose* or *defining function* required to be called a 'gun' *in the most fundamental sense*. The word 'gun', when used strictly, *requires* a specific capability that 'toy gun' explicitly lacks." Introduce terms: The **intension** (defining requirements) vs. **extension** (the set of things satisfying those requirements).

  3.  **Applying the Distinction to the White Horse (15 mins):**
      *   Return to "Bai ma fei ma".
      *   Guide students: "What does the term 'horse' *require*? What does 'white horse' *add*?" (Elicit: 'Horse' requires equine nature. 'White horse' requires equine nature *plus* specific colour).
      *   Gongsun Long's Point (as interpreted here): When you say "Bring me a horse", you are requesting something satisfying the intension of 'horse' (equine nature), and colour is irrelevant. When you say "Bring me a white horse", you are requesting something satisfying the *stricter* intension of 'horse' *plus* 'white'. Therefore, the term "white horse" has a *different intension* (set of requirements) than "horse". It cannot be used interchangeably *in contexts demanding strict adherence to the intension* (e.g., fulfilling a request, logical identity).
      *   **Key Phrase:** "The intension of 'white horse' is *richer* (horse + colour) than the intension of 'horse' alone. They are not synonymous; they don't *mean* the same thing. To claim they refer to the same *concept* (meaning/intension) is an error." (Note: He's likely focused on the *names/concepts*, not primarily the physical objects).

  4.  **Addressing Misconceptions Proactively (Integrated/10 mins):**
      *   **"It's mere sophistry/wordplay":** **Head off during Step 1 & Step 2.** Frame it as a serious philosophical puzzle from the start. Contrast it with obvious wordplay ("I'm reading a book on anti-gravity; it's impossible to put down!"). The analogue demonstrates a genuine conceptual distinction.
      *   **"It's just about subsets/Venn diagrams":** **Head off explicitly during Step 2 (Analogue) and Step 3 Application.** State: "While we *can* represent this with sets ('white horses' ⊂ 'horses'), Gongsun Long's point is *not* about set membership. It's about the *meaning* or *requirements* associated with the *names/concepts* themselves. 'Horse' and 'White Horse' impose different criteria, even if all white horses *are* horses. The argument is about the identity of the *concepts*, not the classification of objects." Reiterate the toy gun: The set of toy guns is disjoint from real guns, but the *conceptual* point is about the *meaning* of "gun".
      *   **"It's about Chinese grammar/mass nouns":** **Head off during Step 3 (Application).** State: "While classical Chinese grammar differs from English, Gongsun Long's argument is fundamentally *logical* and *philosophical*, not primarily grammatical. He's concerned with the relationship between names, meanings, and things, a concern that transcends specific grammatical features like count/mass distinctions. The core issue of intension vs. extension exists in any language."

  5.  **Consolidation & Implications (3 mins):**
      *   Recap: Gongsun Long forces us to see that adding a modifier ("white") creates a new compound concept ("white horse") with a distinct intension from the original concept ("horse"). Calling them "the same" ignores this difference in meaning/requirements.
      *   Brief hint at wider context: This highlights the School of Names' interest in the precision of language and the relationship between words (名 *míng*) and realities (实 *shí*), challenging careless assumptions about how names map to the world.

  6.  **Closing Question to Test Understanding (2 mins):**
      *   **"Could Gongsun Long consistently argue that 'a brown horse is not a horse' using the *same* type of reasoning he uses for the white horse? Why or why not?"**
      *   **Why it reveals understanding:** This forces them to apply the *logic* (intension modification), not just the conclusion. They must see that *any* modifier (brown, white, tall, small) that adds a distinguishing feature creates a compound term with a richer intension than "horse" alone. Memorising "white horse isn't horse" doesn't answer this; grasping the *principle* does. The answer is "Yes, consistently".

  **What to Openly Refuse to Cover:**
  *   **"We will not delve into:** The intricacies of later Mohist critiques of Gongsun Long, detailed comparisons to Western paradoxes like Zeno or Russell, the debate over whether this is 'mere logic' vs. 'political critique', or the full range of interpretations across Chinese philosophical history. Our focus is solely on grasping the core argument and the fundamental distinction about language it exposes."*

  **Key Materials/Techniques:**
  *   Whiteboard: Jot down key terms (Intension/Meaning/Requirements vs. Extension/Reference/Things Picked Out), the Analogue ("Toy gun ≠ Gun"), the Thesis ("Bai ma fei ma").
  *   Use simple, physical props if helpful for the analogue (e.g., picture of toy gun vs. real gun, picture of white horse vs. horse outline).
  *   Emphasise active questioning: "What does this term *demand*?" "What would *count*?".

  This plan prioritises establishing the essential conceptual distinction early via a relatable analogue, proactively dismantles major misconceptions at the point they're likely to arise, and uses a targeted closing question to assess genuine comprehension of the reasoning principle.
