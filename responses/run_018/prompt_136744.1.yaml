      The two refrains land together: "The symbol needs a speaker to be born, / **But syntax lives inside the head, not speech.**" The "But" highlights the tension *and* interdependence – the argument *requires* both propositions to clash. The innate syntax enables the thought expressed in public language, while the public language and its use arguably shape the deployment and development of that syntactic capacity. The debate *depends* on both existing.

