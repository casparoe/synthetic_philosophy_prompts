prompt: |-
  I head the communications office of a national electoral commission, and part of my job is reviewing speeches, press releases, and official statements -- ours and, in an advisory capacity, ministers' -- for invocations of 'the will of the people' that overclaim what any democratic process can deliver: a 52–48 referendum presented as permanently settling an issue, a party with 37% of the vote claiming a mandate for a specific manifesto pledge, a prime minister citing polls as proof of what the people want. Write a decision procedure my reviewers can apply to any such statement: the questions to ask in order, what counts as passing each, and where the procedure stops with a flag rather than a verdict. The procedure should preserve, in usable form, the distinctions the literature on populism and democratic legitimacy actually turns on -- a majority of voters versus a majority of the electorate versus a plurality; a mandate to govern versus authorization for one policy; the people as an empirically aggregated electorate versus the moralized, unified 'people' of populist rhetoric -- and it should say explicitly which distinctions had to be simplified or dropped to keep the checklist runnable in under an hour, and where judgment cannot be eliminated. Then run the procedure on the three cases above, including one where it yields an answer my office will find politically uncomfortable.
reasoning: |-
  Okay, the user is from a national electoral commission's communications office. They need a decision procedure to review statements for overclaiming "the will of the people." Let me start by understanding their main concerns. They mentioned examples like a 52-48 referendum being presented as permanently settling an issue, a party with 37% of the vote claiming a mandate, and a PM citing polls as evidence. 

  First, I need to identify the key distinctions in democratic legitimacy. The literature talks about majority of voters vs. majority of the electorate, plurality vs. majority, mandate to govern vs. specific policy authorization, and empirical vs. moralized "people." The challenge is balancing academic rigor with practicality. The procedure has to be usable within an hour, so some nuances might need simplification.

  The user probably wants a clear, step-by-step checklist that reviewers can follow without getting bogged down. They also need to know where judgment is necessary and where simplifications occur. The examples provided will test the procedure's effectiveness, especially the politically uncomfortable case, which might involve a party with low vote share claiming a mandate.

  I should structure the procedure into stages: Source of Claim, Specificity, Strength, and Scope. Each stage will have key questions. For instance, determining if the claim is about an election, referendum, or poll. Then, checking if it's about governing broadly or a specific policy. The strength aspect involves looking at vote percentages and turnout. Scope addresses permanence and exclusion of dissenters.

  Simplifications are necessary. For example, not adjusting for spoiled ballots or demographic shifts over time. Also, using turnout thresholds as proxies for legitimacy, even though the literature might have more complex criteria. Judgment calls are needed when dealing with broad mandates or vague "people" rhetoric.

  Applying the procedure to the examples: The 52-48 referendum case should flag the permanence claim. The 37% party mandate is a clear overclaim. The PM using polls might pass if framed cautiously. The uncomfortable case is when a party with 43% of the vote claims a mandate for a policy opposed by the majority. The procedure would flag this due to the minority vote share and lack of explicit endorsement.

  The user's deeper need might be maintaining institutional credibility without appearing partisan. They need a tool that's defensible academically but practical. Highlighting simplifications and judgment areas upfront adds transparency, helping them justify decisions if questioned. Ensuring the procedure is systematic yet flexible enough for real-world scenarios is key here.
answer: |-
  Here is a decision procedure for your reviewers, designed for practicality while preserving key academic distinctions. It follows a staged approach, escalating complexity only when necessary.

  **Decision Procedure: Assessing Claims of "The Will of the People"**

  **Objective:** Identify statements that overclaim democratic legitimacy by misrepresenting the scope, strength, or nature of popular endorsement implied by a specific democratic process (election, referendum, poll).

  **Core Principles:**
  1.  **Distinguish Processes:** Elections mandate *governing*, referendums authorize *specific policies*, polls gauge *opinion*.
  2.  **Quantify Strength:** Majority/Plurality of *voters* vs. *electorate*, turnout significance.
  3.  **Define "The People":** Reject the mythologized, unitary, morally superior "People"; focus on the aggregated electorate/participants.
  4.  **Limit Scope:** Outcomes authorize action within a context/timespan, not "permanent" settlements or universal mandates beyond the vote's scope.

  **Procedure Flowchart:**
  `Statement -> Stage 1 (Source/Specificity) -> PASS or -> Stage 2 (Strength) -> PASS or -> Stage 3 (Scope/Rhetoric) -> PASS or FLAG`

  **Stage 1: Source & Specificity (Mandate vs. Authorization)**
  *   **Question 1a:** What democratic process is cited as the source? (Election, Referendum, Poll)
  *   **Question 1b:** What is the claim *specifically* about?
      *   *Governing* (Forming/Leading a government, broad agenda)?
      *   *A specific policy* (Law, constitutional change, treaty)?
      *   *Public opinion* (What "people want" or "believe")?
  *   **Pass 1:** IF `(Source = Election AND Claim = Governing)` OR `(Source = Referendum AND Claim = Specific Policy)` OR `(Source = Poll AND Claim = Public Opinion)` -> **Proceed to Stage 2.**
  *   **Flag 1:** IF `(Source = Election AND Claim = Specific Policy)` OR `(Source = Referendum AND Claim = Governing)` OR `(Source = Poll AND Claim = Governing/Specific Policy)` -> **FLAG IMMEDIATELY.** *Reason: Fundamental category error. Elections don't authorize specific policies (without explicit manifesto linkage & majority), referendums don't authorize governing, polls don't authorize anything.*
  *   *Judgment Note:* Linkage between an election manifesto pledge and a specific policy claim requires careful judgment (handled in Stage 2).

  **Stage 2: Strength of Mandate/Authorization**
  *   **Question 2a (For Elections - Governing Mandate):**
      *   Did the claiming party win an *absolute majority of seats*? (Pass - Clear mandate to govern)
      *   Did the claiming party win a *plurality of seats/votes*? (Proceed to Q2b)
      *   Is the claim made by a *minority party/coalition*? (Proceed to Q2b)
  *   **Question 2b (For Elections - Governing Mandate - Plurality/Minority):**
      *   Is the claim phrased as having a mandate *to govern* (form the executive)? (Pass - Plurality/Minority governments are legitimate outcomes in many systems, mandate *to govern* is acceptable if they can command confidence).
      *   Is the claim phrased as having a mandate *for a specific, contested policy* not central to the government formation agreement? -> **Proceed to Stage 3.**
  *   **Question 2c (For Referendums - Policy Authorization):**
      *   Was the result a *majority of valid votes cast*? (Pass - Basic threshold met, proceed to Stage 3 for scope).
      *   Was the result a *plurality* (e.g., multi-option referendum without majority)? -> **Proceed to Stage 3.**
  *   **Question 2d (For Polls - Opinion):**
      *   Does the claim accurately reflect the poll question and results (e.g., "a majority of those polled support X")? (Pass - IF Poll is cited appropriately as *opinion*).
      *   Does the claim imply the poll represents *authorization* or *the settled will*? -> **FLAG.**
  *   **Question 2e (For Specific Policy Claims Post-Election):** *Only if Stage 1 passed via `Election -> Specific Policy` link.*
      *   Was the policy *explicitly and prominently stated* as a core pledge in the winning party's manifesto/platform?
      *   Did the winning party achieve an *absolute majority of seats* (or a coalition majority explicitly endorsing *this* pledge)?
      *   **Pass 2e:** Only if BOTH are YES. Otherwise -> **Proceed to Stage 3/Flag.**
  *   **Pass 2:** If Stage 2 questions result in a PASS above -> **Proceed to Stage 3.**
  *   **Flag 2:** If Stage 2 questions result in a FLAG above -> **FLAG IMMEDIATELY.**

  **Stage 3: Scope & Rhetoric (Permanence, Exclusivity, "The People")**
  *   **Question 3a (Permanence):** Does the claim imply the result is *permanently* binding, settles the issue *for all time*, or removes it *forever* from democratic debate? (YES -> FLAG)
  *   **Question 3b (Exclusivity):** Does the claim imply that *only* those supporting the outcome represent "the real people," the "patriots," or the "moral majority," thereby delegitimizing dissenters? (YES -> FLAG)
  *   **Question 3c (Mythologized "People"):** Does the claim invoke "the People" as a singular, morally unified entity whose "will" transcends the actual vote count and is known by the speaker, rather than as the aggregated participants in the cited process? (YES -> FLAG)
  *   **Question 3d (Legitimacy Threshold - Referendums/Policy):** *Only for Referendum Policy Authorization or Specific Policy Claims that passed Stage 2 but are borderline.*
      *   Was turnout exceptionally low (<40% of electorate)? (YES -> Increases risk, leans Flag)
      *   Was the margin exceptionally narrow (<55-45)? (YES -> Increases risk, leans Flag)
      *   Is the policy claim *highly specific and transformative* (e.g., constitutional change)? (YES -> Higher bar, leans Flag for narrow/low votes).
      *   *Judgment Call:* Based on these factors, does the claim *overstate* the strength/legitimacy of the authorization? (YES -> FLAG)
  *   **Pass 3:** If answer to ALL applicable questions (3a, 3b, 3c, 3d) is NO -> **PASS.**
  *   **Flag 3:** If answer to ANY applicable questions (3a, 3b, 3c, 3d) is YES -> **FLAG.**

  **Simplifications & Necessary Judgment:**
  1.  **Simplified Mandate Theory:** Focuses on seat majority for clear policy mandates, not complex theories of mandate strength based on vote shifts or campaign salience. Judgment needed for manifesto linkage (Stage 2e).
  2.  **"The Electorate" vs. "Voters":** We primarily use *voters* (actual participants) as the reference group. Judgment is needed in Stage 3d (low turnout) to implicitly consider the *electorate*.
  3.  **Spoiled Ballots/Non-Voters:** Explicitly excluded for simplicity. Their silence is not interpreted as opposition or consent within this model.
  4.  **Majority Thresholds:** Uses simple majority of votes cast for referendums as the default legitimacy threshold. Judgment needed for multi-option votes or defining "low" turnout/narrow margins in Stage 3d.
  5.  **Temporal Discounting:** Doesn't explicitly discount older mandates (beyond the inherent scope of an election term/referendum context), relies on Stage 3a (Permanence) to flag outdated claims.
  6.  **Coalition Complexity:** Simplifies coalition mandates to "government formation" legitimacy. Judgment needed if a minor coalition partner claims a specific mandate (likely flagged in Stage 1 or Stage 2).
  7.  **Rhetoric Interpretation:** Identifying the mythologized "People" (Stage 3c) requires subjective interpretation of tone and context.

  **Where Judgment Cannot Be Eliminated:**
  *   Interpreting the *specificity and prominence* of a policy in a manifesto (Stage 2e).
  *   Assessing the tone and implication of rhetoric regarding dissenters or the nature of "the People" (Stage 3b, 3c).
  *   Making the final call on borderline cases in Stage 3d (low turnout/narrow margin for significant policies).
  *   Applying the procedure to nuanced or ambiguous wording in the original statement.

  ---

  **Application to Cases:**

  1.  **52-48 Referendum Presented as Permanently Settling an Issue:**
      *   Stage 1: Source=Referendum, Claim=Specific Policy -> Pass 1 -> Stage 2.
      *   Stage 2: Q2c - Majority of votes cast? YES (52% > 50%) -> Pass 2 -> Stage 3.
      *   Stage 3: Q3a - Permanence claimed? YES -> **FLAG.** (Also, Q3d: If turnout was low or the issue highly transformative, this reinforces the flag).

  2.  **Party with 37% of Vote Claiming Mandate for Specific Manifesto Pledge:**
      *   Stage 1: Source=Election, Claim=Specific Policy -> **Proceed to Stage 2e** (Specific Policy link).
      *   Stage 2e:
          *   Explicit Core Pledge? (Assume YES for this case).
          *   Absolute Majority of Seats? 37% vote *very unlikely* to yield absolute seat majority -> NO.
          *   **Flag 2e / Flag Immediately.** *Reason: Lacks the seat majority generally required for claiming a specific policy mandate.* (Even if part of a coalition, unless the coalition *explicitly* endorsed *this specific pledge* and has a majority, it would likely be flagged at Stage 1 or Stage 2e).

  3.  **Prime Minister Citing Polls as Proof of What "The People Want":**
      *   Stage 1: Source=Polls, Claim=Public Opinion? OR Governing/Specific Policy?
          *   IF phrased as "Polls show a majority support X" -> `Source=Poll, Claim=Public Opinion` -> Pass 1 -> Stage 2.
          *   IF phrased as "The people have spoken, they want X" (implying polls = authorization) -> `Source=Poll, Claim=Public Opinion? (Overclaiming)` -> **Proceed to Stage 2d / Likely Flag.**
      *   Stage 2d:
          *   Accurately reflects poll as *opinion*? (If YES -> Pass 2 -> Stage 3. If NO, or implies authorization -> FLAG).
      *   Stage 3: (If passed Stage 2) Check Q3c (Mythologized People) - Unlikely unless rhetoric is extreme. Likely **PASS** *if accurately presented as opinion polling only.* **FLAG** if rhetoric overclaims into "will of the people" as authorization.

  **Politically Uncomfortable Case: Party with 43% of Vote (Plurality Winner, Single-Party Majority Govt) Claiming Mandate for a Specific, Controversial Policy**

  *   **Scenario:** Governing Party won 43% of the vote (highest share), 52% of seats (absolute majority). They now claim "the British people have given us a clear mandate to implement [Specific Controversial Policy Y]" in an official statement. Policy Y was listed in their manifesto but wasn't the *central* plank of their campaign; it's highly divisive. Opposition parties and polls suggest Policy Y is opposed by a majority of the electorate.
  *   **Application:**
      *   Stage 1: Source=Election, Claim=Specific Policy -> **Proceed to Stage 2e** (Specific Policy link).
      *   Stage 2e:
          *   Explicitly stated in manifesto? YES (assumed).
          *   Absolute Majority of Seats? YES (52% > 50%).
          *   **Pass 2e** -> Proceed to Stage 3. *This is technically passable under the simplified mandate rule.*
      *   Stage 3:
          *   Q3a: Permanence? (Unlikely, assume NO).
          *   Q3b: Exclusivity? (Depends on rhetoric - assume "British people have given us..." is used, but not explicitly derogatory to opponents. Assume NO for this facet).
          *   Q3c: Mythologized People? (Phrase "the British people have given us..." *leans* towards implying a unified will, but is common political rhetoric. Judgment Call: Probably NO for a blatant flag, but note the tendency).
          *   **Q3d: Legitimacy Threshold? CRITICAL JUDGMENT CALL.**
              *   Vote Share: 43% is a significant plurality, but *not* a majority of *voters* (57% voted against them), let alone the electorate (factoring in turnout).
              *   Policy Nature: Highly Controversial & Divisive (increases bar).
              *   Evidence of Opposition: Known strong opposition from other parties/polls suggests lack of broad consensus.
              *   **Judgment:** Claiming a "clear mandate" for *this specific policy* based solely on a seat majority derived from 43% of the vote, where evidence suggests majority *opposition* among the electorate, significantly overclaims the strength and breadth of the authorization. It conflates the mandate *to govern* with a mandate *for this specific policy*.
              *   **VERDICT: FLAG under Stage 3d.** *Reason: While technically having procedural legitimacy (seat majority, manifesto mention), claiming a "clear mandate" for this specific, divisive policy grossly overstates the strength and consensus of the popular endorsement implied by the election result, especially given the low vote share and evidence of majority opposition. The claim should be softened (e.g., "we have a mandate to govern and will implement our manifesto, including Policy Y").*

  This flag is politically uncomfortable because it challenges a democratically elected majority government on a manifesto item. However, the procedure highlights that electoral victory ≠ blanket endorsement of every policy, especially contentious ones lacking majority *voter* support. Upholding this distinction is crucial for resisting populist overclaiming and maintaining the Commission's credibility on democratic legitimacy.
