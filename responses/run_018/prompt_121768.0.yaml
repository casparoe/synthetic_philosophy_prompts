answer: |-
  Here's the restatement of the moral compromise thesis strictly within your specified vocabulary, followed by the residue analysis:

  ### Restatement in Native Vocabulary
  1.  **Agents & Preferences:** Two agents, A and B, have vNM-rational preference orderings over a policy space P, representable by cardinal utility functions U_A(p) and U_B(p). Disagreement point d ∈ P yields payoffs (U_A(d), U_B(d)).
  2.  **Gains from Trade (The Core Argument):**
      *   **Bargaining Set:** The set of feasible utility pairs S = {(U_A(p), U_B(p)) | p ∈ P} is non-convex (due to non-transferability). Gains exist iff ∃ p ∈ P such that (U_A(p), U_B(p)) > (U_A(d), U_B(d)) (Pareto improvement over d).
      *   **Trade Mechanism (Without Numeraire):** Compromise is modeled as selecting a policy p* ≠ d where:
          *   *p* maximizes a bargaining solution concept (e.g., Nash: argmax_p [U_A(p) - U_A(d)] * [U_B(p) - U_B(d)], or KS based on ideal points).
          *   The *justification* hinges on **quasi-linearity in concessions, not utility**: Agents have differing marginal rates of substitution (MRS) across policy dimensions. Concession x_i by A on dimension i imposes low utility loss δU_A/δx_i but yields high utility gain δU_B/δx_i for B (and vice versa for concession y_j by B on dimension j). Gains arise from exploiting these differential MRS across multiple policy dimensions, akin to trading goods in an Edgeworth box without a numeraire. **The trade framing is load-bearing**: It relies on the *structure* of the utility functions allowing mutual improvement via reallocation of policy "bundles".
  3.  **Nature of the Compromise:**
      *   **It is a Pure Policy Choice p*.** The argument fundamentally proposes selecting a *single deterministic policy* p* from the bargaining solution.
      *   **Not a Mixture over Policies:** Randomization over policies (lotteries λ) is not implied in the core thesis. While λ could exist in the feasible set (making S convex if included), the standard argument doesn't invoke it. Gains are claimed for a specific p*.
      *   **Not a Mixture over Utility Functions:** Agents' U_A and U_B are fixed and known (common knowledge or elicited truthfully per revelation principle). The compromise doesn't change the agents' underlying preferences.
      *   **Not Social Welfare Reweighting:** The argument is *positive* (Pareto improvement exists) not *normative* (maximizing a SWF). The SWF framing (e.g., Nash SWF) is used *analytically* to *find* p*, but the *justification* for p* is that it lies in the core relative to d (both prefer p* to d) – it's an ex-post Pareto improvement claim within the fixed-agent model.
  4.  **Deontological Constraints & Integrity:**
      *   **Representation:** Can be incorporated *within* the utility function framework:
          *   *Lexical Thresholds:* U_i(p) = -∞ if p violates constraint K_i (e.g., "never torture"). This makes policies violating K_i dominated, shrinking the feasible set S.
          *   *Action-Dependence / "Dirty Hands":* Model U_i(p) as having a component dependent on the agent's *own* concession. E.g., U_A(p) = f(outcomes(p)) - c * (concession_A_made_on_X). High c reflects integrity cost. This makes the utility function path-dependent in a sequential setting.
      *   **Effect:** These representations shrink S or introduce non-convexities/kinks. They can eliminate potential Pareto improvements (if all p > d violate a threshold) or make finding p* computationally harder, but they *do not* fall outside the vocabulary. The "faking" is inherent to the representation; infinite weights *are* the standard way to model absolute constraints.

  ### The Residue Report: What Lies Outside the Vocabulary
  1.  **The Fixed Agent Assumption & Endogenous Preference Evolution:**
      *   **The Core Blind Spot:** Your suspicion is precisely correct. The vocabulary assumes U_A and U_B are *exogenous and fixed*. It cannot model:
          *   *Identity/Preference Evolution via Compromise:* The act of compromising on value X might fundamentally alter Agent A's identity or preferences (e.g., weakening commitment to X, changing U_A). The utility gain U_A(p*) > U_A(d) is indexed to the *pre-compromise self*. The *post-compromise self* might judge the deal differently (U_A_post(p*) < U_A_pre(d)). The vocabulary lacks state-dependent utility where the state is the agent's own identity/value structure.
          *   *Constructed Preferences/Endogenous Values:* Values might be formed or strengthened through the *process* of negotiation and commitment, not merely revealed. The model assumes revelation of fixed preferences.
  2.  **Non-Reducible Process Values:**
      *   **The Vocabulary Gap:** Concepts like "integrity," "selling out," or "corruption" often refer not just to outcomes or costs of concessions (which *can* be modeled with U_i(p)), but to the intrinsic *meaning* of the *act* of compromise itself within a narrative or social context. While "dirty hands" costs can be added to U_i, the deeper *constitutive* claim – that compromising core principle X *makes you no longer the kind of agent who holds X as a core principle* – requires a model of agent *ontology* that this vocabulary lacks.
  3.  **Dynamic Inconsistency of the "Self":**
      *   **The Sequential Problem:** In sequential interactions, the pre-deal self (Self_1) choosing the compromise strategy might foresee that the post-deal self (Self_2) will have different preferences (due to the compromise's effect). Self_1's optimal plan (mixture over policies/strategies) might be dynamically inconsistent if Self_2 would renege. The vocabulary struggles with the "self that may not survive the deal" as a *constituent element of the agent across time*.

  ### Burden of Proof & What the Residue Indicts
  1.  **Indicting the Original Thesis:** The residue primarily indicts **the original "gains from trade" thesis** as presented in the rationalist sphere. The vocabulary faithfully exposed its core assumptions:
      *   It relies on fixed, exogenous, cardinal preferences.
      *   It assumes the relevant "self" judging the outcome is stable.
      *   It reduces deontology to constraints/costs within the utility function.
      *   **The thesis is thinner than it sounds:** It proves only that *if* agents have fixed, cardinal preferences over policies with differential MRS across dimensions, *and* these preferences include all integrity costs as part of U_i(p), *then* Pareto improvements *can* exist. It **cannot** guarantee that such improvements are *stable* if compromise alters preferences, or that they are *meaningful* to the agents' future selves or constitutive identities.
  2.  **Limitation of the Vocabulary:** The vocabulary is limited in its ability to model **endogenous preference formation, identity evolution, and the dynamic self.** This is a known limitation of standard microeconomic/game-theoretic frameworks applied to deeply normative or identity-laden choices. It struggles with "transformative experience" (Paul) or "adaptive preferences" (Elster).
  3.  **Burden of Proof:** **The burden of proof lies squarely on proponents of the "gains from trade" thesis in moral compromise.** The vocabulary shows the thesis *requires* the assumption of fixed preferences and stable selves. Proponents must either:
      *   **Argue the Assumption Holds:** Defend that preferences/identities *are* sufficiently stable in the relevant moral compromises to justify the model (e.g., compromises are on "tradable" values, core identity remains intact).
      *   **Extend the Model:** Incorporate models of preference evolution or state-dependent utility (e.g., framing effects, cognitive dissonance reduction) *within* the interaction, making the analysis vastly more complex and potentially undermining the clean gains-from-trade intuition.
      *   **Concede the Limitation:** Acknowledge the thesis applies only to compromises where preference/identity shift is negligible or where agents rationally discount such future shifts.

  **In essence:** Your vocabulary successfully pins down the *mechanism* of the proposed gains (exploiting differential MRS under fixed preferences) and exposes its core assumption (fixed agents). The residue reveals that this assumption is the thesis's Achilles' heel when applied to deep moral compromise, where the act of trading values might change the traders themselves. The burden is on the thesis's proponents to justify this assumption for their domain of application. The vocabulary isn't "wrong"; it efficiently reveals where the *argument* might be incomplete or misapplied.
