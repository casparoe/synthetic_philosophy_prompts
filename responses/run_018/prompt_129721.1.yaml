  I'm presenting to a philosophy-of-science reading group—three philosophers of biology who defend realism about functional kinds, two philosophers of language who regard Quine's behaviorism as dead and his translation thesis as its weakest limb, plus a science-policy specialist who thinks semantic debates are irrelevant to treaty design—my argument that Quine's indeterminacy thesis, applied to the normative-risk vocabulary of international synthetic-biology governance, reveals an in-principle obstacle to determinately interpreting cross-linguistic biosafety protocols. The specific injection is that terms like containment failure and acceptable risk threshold are not merely epistemically underdetermined but reference-indeterminate across linguistic communities, even when all parties share identical causal interaction with the same engineered organisms, because the behavioral evidence available for radical translation in this domain systematically underdetermines whether an interlocutor is referring to ecological spillover, laboratory escape, or evolutionary drift of the modified trait. Draft my Q&A prep sheet: list the six or seven objections I will actually face, ordered by how damaging and how likely they are, each phrased precisely as that kind of interlocutor would phrase it—biologist, language philosopher, or policy specialist. For each objection, provide a reply I can deliver in about two minutes, followed by an explicit note on where that reply is soft or concedes ground. State what I should concede up front to establish credibility. Finally, identify the single objection I am hoping nobody raises—the one that targets my decision to inject synthetic-biology governance cases into Quine's framework rather than rigorously extending it, and asks whether I am tacitly relying on scientific realism about engineered organisms to generate the ambiguity that Quine's thesis is supposed to establish independently of any substantive science.
