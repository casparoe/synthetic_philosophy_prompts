prompt: |-
  I am preparing material for a graduate-level epistemology workshop that meets in a law-school classroom, and I want a scenario that forces students to see exactly where Moore's proof of an external world does its work—without letting them dismiss it as naive or as a strawman. To that end, please construct a thought experiment that satisfies the following specifications. The setting must be realistic and institutional: a hospital ethics review board, an arbitration panel, or a similar body where evidence rules are formalized—not a trolley problem, not a science-fiction world, and not a classroom debate. In this setting, a speaker genuinely possesses the physical object in question—say, two hands that are visible to everyone present in the room—and all the ordinary premises that Moore's reasoning requires are satisfied. However, there must be a specific, non-skeptical procedural constraint—perhaps a rule that first-person perceptual reports are inadmissible unless corroborated by a designated third-party instrument, or a domain-specific burden of proof that shifts the status of direct observation—that blocks the inference from those satisfied premises to the conclusion that an external world exists. The constraint should be genuinely defensible within its institutional domain, not an obvious caricature designed only to generate doubt.

  After presenting the scenario in a single concise paragraph, please walk through the reasoning step by step: articulate what Moore's argument asserts about the relationship between knowing a particular premise and knowing the conclusion, show precisely where the institutional constraint interrupts that inference rather than denying the premise, and identify the single structural feature of the case that is doing the philosophical work. Then provide an honest assessment of the design: how would a defender of Moore's proof attack this scenario, and if we remove that procedural feature, does the case collapse back into a standard skeptical challenge? I need the answer written in American English, with enough detail that a student who knows the proof only from a secondary summary can follow the logic, and please do not include bibliographies, citations, reading lists, or references to specific editions of texts.
