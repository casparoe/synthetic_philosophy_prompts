            The residue shows that the hole argument's force depends on an ontological commitment to point-identity that event sourcing can discard without loss by either gauge fixing or invariant representation. The philosophers' insight about the arbitrariness of labels is valid, but it does not cause a problem in practice because we can design the system to avoid ambiguity.

