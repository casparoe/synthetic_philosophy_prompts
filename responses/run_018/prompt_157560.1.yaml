prompt: |-
  Consider the claim that Bostrom-style simulation reasoning, once restricted to a local-fidelity model in which nested simulations suffer exponential degradation in conscious resolution, actually amplifies rather than dampens far-future fanaticism—where fanaticism is defined as willingness to bear severe present costs for interventions whose benefit is an astronomically large but highly uncertain future payoff. Specifically, the argument runs that if high-fidelity simulations are rare and nested ones are cognitively degraded, then observer-selection effects weight our reference class toward unsimulated base-reality ancestors rather than simulated descendants, which can reverse the expected-value discounting usually thought to follow from simulation uncertainty.

  Give me your all-things-considered credence—on a scale from 0 to 1—that this local-fidelity simulation reasoning genuinely weakens (dampens) the rational case for extreme longtermist sacrifice, rather than leaving it intact or strengthening it. Decompose your reasoning into at least these four terms: (a) the prior probability that we are in a situation where the core simulation disjunction applies at all; (b) the probability that nested simulations suffer the kind of fidelity decay that produces an ancestor-weighting selection effect; (c) the probability that this weighting undermines, rather than reinforces, the expected-value calculus underlying far-future fanaticism; and (d) any other factor you judge structurally important—for instance, whether moral obligations extend across simulated and unsimulated boundaries, or whether present costs are incommensurable with distant benefits regardless of observer counts. Assign each term a rough numerical value with one line of justification, show how they combine into your final figure, and state the overall number.

  Then tell me which single term your final credence is most sensitive to, and what specific piece of evidence or argument—empirical, conceptual, or mathematical—would shift it substantially.

  Please present your answer in exactly these sections, in order:

  1. The Target Claim (one paragraph, defining terms precisely and stating the proposition with a clear resolution condition).
  2. Decomposition (one subsection per term, each containing the number and its one-line justification; include any additional terms in this section).
  3. Aggregation (one paragraph showing the combination logic and your final credence).
  4. Sensitivity and Vulnerability (identify the weakest term and explain what evidence would move it).
  5. What Would Change My Mind (the specific argument, finding, or clarification that could reverse your verdict, together with an honest note on where your reasoning is likeliest to fail).
