  I'm writing the final for my upper-level philosophy of AI seminar — mostly grad students and a few sharp undergrads who've actually read some mechanistic interpretability papers. I want one 90-minute essay question on realism about representations in deep neural networks, but it must not be answerable by rehearsing the standard realist/eliminativist taxonomy. The crux should turn on a synthetic-training hypothetical: imagine a vision model trained exclusively on synthetic convex geometric shapes; one unit activates maximally on convex boundaries and also on shadows cast by those boundaries, and ablating it degrades performance on both tasks. Ask whether this unit represents convexity, shadow-boundary, neither, or a disjunctive property, and specifically whether the model's training objective (minimize reconstruction error on that synthetic dataset) can substitute for evolutionary history in a teleosemantic account of content — or whether it merely relocates the disjunction problem onto designer intent. Require the answer to hit five specific moves: (1) why causal relevance demonstrated by ablation is insufficient for semantic content; (2) how the disjunction problem arises for artificial systems lacking evolutionary selection; (3) whether the synthetic training objective resolves that problem or pushes it back; (4) identification and diagnosis of one common student error (e.g., treating feature-visualization or predictive utility as sufficient for representational status); and (5) a reasoned conclusion that takes a stand rather than ending in agnosticism. Provide a model answer of about 700 words, plus a marking scheme totaling 20 marks with the five points above weighted equally (4 marks each), and for each point include a one-line note on the typical failure mode that should cost marks. Keep everything self-contained: no bibliography, no citation requests, no dependence on specific paper titles or author attributions.
