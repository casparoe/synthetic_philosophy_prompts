  ### Key Features:
  1. **Root Question** starts with the fundamental challenge of moral comparability.
  2. **Branches** use plain-language yes/no questions (e.g., gambling odds analogy for expected value).
  3. **Leaves** highlight real philosophical tensions:
     - Expected Value Maximization risks extreme acts for low-probability theories.
     - Split-Action approaches risk ineffectiveness.
     - Future-person treatments face counterintuitive population ethics.
  4. **Gaps** expose underexplored combinations:
     - Split actions + future-people treatment is logically possible but undefended.
     - Meta-rules + split actions are incoherent (meta-rules dominate).
  5. **Indistinguishable Pairs** note where positions collapse in practice (e.g., split actions defaulting to no special future treatment).

  This structure mirrors how philosophers like MacAskill, Lockhart, or Ross navigate uncertainty while avoiding jargon. The "awkward commitments" show how each approach struggles with edge cases—useful for sparking discussion in your club!
