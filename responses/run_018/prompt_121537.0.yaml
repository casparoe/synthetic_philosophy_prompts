  To keep the analysis precise and somewhat in the weeds, please frame the rescue of Malthusian dynamics through the shift of the binding constraint from arable land productivity to non-substitutable biogeochemical cycles, particularly phosphorus availability and freshwater depletion timelines, showing how these constraints reproduce the original tension on century-scale horizons that short-run falsification misses. At the same time, defend this rescue against the charge of ad hoc immunization by proposing explicit criteria—such as independent measurability of the new limiting factor and predictive divergence between the rescued theory and its rivals—through which we can distinguish legitimate long-run structural rescue from arbitrary theory-saving. Please present this as a continuous philosophical argument rather than a list of bullet points, avoid any bibliographies, citation lists, or reading recommendations, do not include verbatim quotations from real texts, and please write the entire response in American English.
