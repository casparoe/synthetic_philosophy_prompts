  Now, Borges' Library: every possible book of a fixed format. Librarians see it as infinite and total. They struggle with the absence of a complete catalog, which they believe must exist. This mirrors the countable model where a set is "uncountable" internally because the bijection isn't part of the model. The librarians' despair over finding a catalog parallels the internal view missing that bijection.

