answer: |-
  Your observation captures a sophisticated methodological maneuver without a universally established name, though it intersects with several philosophical concepts. I propose the term **"Contextual Ontological Fluidity" (COF)** for this phenomenon, defined as:

  ### Definition
  **Contextual Ontological Fluidity (COF)**  
  *The strategic alternation between realist and instrumentalist interpretations of the *same* theoretical formalism, where:*
  1.  **Formal Equivalence:** The mathematical structure produces identical operational predictions for the target phenomena under calibration.
  2.  **Interpretive Duality:** The formalism permits both:
      *   A **realist interpretation** (treating unobservable variables/structures as causally efficacious entities with mind-independent existence).
      *   An **instrumentalist interpretation** (treating the same variables/structures as mere calculational devices or bookkeeping tools without ontological commitment).
  3.  **Context-Driven Switching:** The choice of interpretation is determined by pragmatic or rhetorical context (e.g., explanation for policymakers vs. internal model refinement, emphasizing mechanisms vs. emphasizing predictive robustness), *not* by empirical inadequacy or new evidence.
  4.  **Operational Invariance:** The predictive/output behavior of the model remains unchanged regardless of the interpretation adopted.

  ### Boundary Conditions (Distinguishing COF)
  1.  **vs. Ordinary Underdetermination of Theory by Evidence:**
      *   **Underdetermination:** Concerns *empirically equivalent but distinct theories/formulations* (e.g., different diffusion equations yielding the same surface temps). Choice is between alternatives.
      *   **COF:** Concerns *differing interpretations applied to the *identical* formalism*. It's not choosing between models, but between readings *of the same model*. Underdetermination provides the foundation (why both interpretations are possible), but COF describes the *use* of that ambiguity contextually.
  2.  **vs. Structural Realism:**
      *   **Structural Realism:** Claims we should be realists only about the *structure* (relations) captured by the theory, not necessarily the specific entities. It's a *fixed* ontological commitment to structure.
      *   **COF:** Involves *switching* ontological commitments (entity realism vs. instrumentalism) regarding the *same structural components* of the model. Structural realism might explain *why* the formalism works despite interpretation shifts, but COF describes the *practice* of shifting interpretations.
  3.  **vs. Conventionalism:**
      *   **Conventionalism:** Holds that theoretical entities/concepts are *fundamentally* arbitrary conventions or labels chosen for convenience, denying their objective reality.
      *   **COF:** Does *not* necessarily deny the *possibility* of ontological reality corresponding to the variables. It pragmatically *alternates between asserting and withholding* commitment to that reality based on context. The realist interpretation within COF *does* assert reality claims when used.
  4.  **vs. Mere Equivocation:**
      *   **Equivocation:** Involves an *unintentional* or *deceptive* ambiguity in the meaning of a term, leading to logical fallacies.
      *   **COF:** Is a *deliberate, context-sensitive strategy* employed by experts aware of the interpretive flexibility. While potentially problematic if undisclosed, it stems from the model's inherent representational flexibility and pragmatic needs, not semantic sloppiness. Its validity hinges on operational invariance.
  5.  **vs. Ad Hoc Auxiliary Hypotheses:**
      *   **Ad Hoc Hypotheses:** Are modifications *to the model itself* (adding parameters, assumptions) to salvage a core theory from falsification, often reducing testability.
      *   **COF:** Involves *no modification to the formal model*. It's purely a shift in the *interpretation* or *semantic meaning* assigned to existing elements of the *unchanged* formalism. The model's structure and predictions remain constant.

  ### Why COF is Distinct and Important
  COF highlights a nuanced aspect of scientific practice, particularly in complex systems modeling (climate, economics, ecology):
  *   **Pragmatic Necessity:** Complex models often require components representing poorly understood or unobservable processes. COF allows researchers to leverage the formalism for both mechanistic storytelling (realism) and robust prediction/calibration (instrumentalism) without altering the core mathematics.
  *   **Rhetorical Function:** Realist interpretations enhance explanatory power and policy relevance ("*This* mechanism causes X"). Instrumentalist interpretations manage epistemic uncertainty and avoid over-commitment where evidence is weak ("This *parameter* tracks the net effect, but the underlying reality might be different").
  *   **Epistemic Tension:** COF embodies the tension between the desire for mechanistic understanding (favoring realism) and the recognition of model idealization/underdetermination (favoring instrumentalism). It's a coping strategy for working with necessarily imperfect representations.
  *   **Ethical Dimension:** Undisclosed or careless COF can mislead audiences (e.g., policymakers) by presenting instrumentalist constructs as concrete realities when convenient, then retreating from those claims when challenged. Transparency about interpretive flexibility is crucial.

  ### In Summary
  **Contextual Ontological Fluidity (COF)** is the deliberate, context-dependent switching between realist and instrumentalist interpretations of the *identical* formal elements within a theoretically underdetermined model, driven by pragmatic communicative or explanatory needs, while maintaining operational equivalence. It exploits the representational flexibility inherent in complex models without altering their predictive structure.

  This maneuver is distinct because it focuses on the *interpretive plasticity of a single formalism* across contexts, rather than choosing between rival theories (underdetermination), committing only to structure (structural realism), denying ontology (conventionalism), being ambiguous (equivocation), or modifying the model (ad hoc hypotheses). Its recognition is vital for critically evaluating explanations and claims derived from complex models.
