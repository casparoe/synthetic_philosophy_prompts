prompt: |-
  I am a novelist in the early planning stages of a literary novel, and I should like some philosophical counsel before I commit myself to a structure.

  The book is to be organised around a single uneasy question: how much of what we blame people for turns on factors beyond their control. In the course of my reading I have encountered the customary fourfold taxonomy of moral luck — resultant luck (luck in how one's actions turn out), circumstantial luck (luck in the situations in which one finds oneself), constitutive luck (luck in the sort of person one happens to be), and causal luck (luck in being the product of antecedents one did not choose). It strikes me that these four varieties might behave very differently as material for fiction, and I want to get the philosophy right before I build anything on it.

  Please rank the four categories from most to least promising as the load-bearing structure of a serious novel. By 'promising' I mean a compound of three things: the capacity to sustain narrative tension without contrivance; the tendency to resist tidy moral resolution on the reader's part; and the likelihood of surviving the scrutiny of a philosophically literate reader without collapsing into melodrama or incoherence. For each category, give me its placement, a few sentences of justification, the kind of plot it most naturally generates, and the characteristic failure mode a novelist should fear when working with it — the way, for instance, a story built upon resultant luck might stand accused of rigging its own dice.

  Two further requests. First, my own instinct is that circumstantial luck is the richest vein, but I suspect this may be only because it is the easiest to dramatise; if my instinct is mistaken, or correct for the wrong reasons, please say so plainly. Second, having produced the ranking with a tragedy in mind, tell me briefly whether it would be rearranged for a comic novel, and if so, how and why.

  Please do not supply reading lists, references, or citations; I am after your judgement rather than a bibliography. And I should be grateful if you would reply in British English.
reasoning: |-
  Okay, let me unpack this novelist's request carefully. They're building a literary novel around moral luck and want to know which of the four types (resultant, circumstantial, constitutive, causal) makes the strongest structural backbone. Their criteria are narrative tension, resistance to tidy morals, and philosophical robustness - with a side request about comedy potential.

  First, I need to consider why circumstantial luck feels instinctively richest to them. They're right about its dramatic immediacy - being trapped in morally fraught situations writes itself. But I wonder if they're underestimating how easily it can slip into melodrama if over-simplified. The real gold is in how it forces characters to make choices within constrained options, not just suffer misfortunes.

  Now comparing the categories: Constitutive luck strikes me as deepest for character-driven fiction. When a person's very nature is shaped by unchosen factors, you get that visceral tension between responsibility and determinism. A protagonist wrestling with inherited trauma or temperament could carry a whole novel without contrivance. The danger would be lapsing into biological determinism - the key is preserving that sliver of agency.

  Causal luck feels trickier. While philosophically profound (are we just causal dominoes?), it's structurally hostile to narrative. Fiction thrives on choice, not chain reactions. Unless handled with extreme subtlety - say through intergenerational patterns - it risks flattening characters into case studies. Probably least promising despite its intellectual weight.

  Resultant luck has obvious storytelling appeal - the "sliding doors" effect of small actions having big consequences. But precisely because it's so narratively convenient, it can feel engineered. The ethical ambiguity gets lost when outcomes feel predetermined by plot mechanics.

  For the comic question: Circumstantial luck absolutely flips best. Tragedy says "what terrible circumstances trapped them"; comedy says "watch them wriggle in these ridiculous circumstances". The other categories would need complete re-engineering - constitutive luck as farce could become a send-up of fixed personalities, but it's less naturally comedic.

  Final ranking: constitutive for depth, circumstantial for versatility, resultant for accessibility, causal as specialist material. Their instinct wasn't wrong, but constitutive offers more unexplored territory for serious fiction.
answer: |-
  Your instinct about circumstantial luck's dramatic potency is sound, but I believe it cedes the top spot to another for sheer philosophical depth and narrative resilience in a *serious* literary novel. Here's the ranking based on your criteria, followed by the comedic shift:

  **Ranking (Tragic/Serious Novel Focus):**

  1.  **Constitutive Luck (Luck in *who* one fundamentally is):**
      *   **Justification:** This strikes deepest at the core of moral responsibility and identity. It forces the reader to confront whether blame is even coherent when character – temperament, desires, capacities, even pathologies – is itself unchosen (genetics, upbringing, formative traumas). It sustains tension through the character's internal struggle against their nature or the revelation of its origins. It inherently resists tidy resolution: Can one *truly* overcome constitutive flaws? Is self-understanding absolution or merely tragic awareness? Philosophically, it avoids melodrama by focusing on the profound ambiguity of agency within a pre-given self, not just external events.
      *   **Natural Plot:** A protagonist wrestling with an inherited predisposition (violence, addiction, paralyzing anxiety), a suppressed trauma shaping their reactions, or a fundamental aspect of their personality (extreme selfishness, cowardice) clashing with their aspirations or societal demands. The plot explores the origins of this "constitution" and the agonizing effort (or failure) to act against it.
      *   **Characteristic Failure Mode:** Falling into fatalistic determinism ("They were born evil/broken"), reducing character complexity to a single, unalterable flaw, or offering an implausibly redemptive "overcoming" that ignores the luck involved. Avoiding this requires showing the constant, difficult *effort* of agency within constitutive constraints.

  2.  **Circumstantial Luck (Luck in the *situations* one encounters):**
      *   **Justification:** Your instinct is strong; it *is* the most readily dramatised. Its power lies in the "what if" – how would *I* act in that impossible situation? It generates immediate, high-stakes tension through external pressures (war, poverty, sudden betrayal, unexpected opportunity). It resists tidy resolution by highlighting how good people can do terrible things (or vice versa) under extreme duress, and how easily moral frameworks crumble when circumstances shift. It survives scrutiny if the situations feel authentic and the choices, while constrained, remain agonizingly *choices*, not foregone conclusions.
      *   **Natural Plot:** An ordinary person thrust into an extraordinary moral crucible (accidental witness to a crime, sudden responsibility for a desperate act, trapped in a corrupt system). Or contrasting characters facing similar temptations/threats at different times/places, revealing how circumstance dictates action. Exploration of paths not taken ("If only X hadn't happened...").
      *   **Characteristic Failure Mode:** Making the circumstances so overwhelming that character agency vanishes (turning tragedy into mere victimhood), or contriving overly neat "tests" that feel like moralistic set-pieces. The situation must feel brutally plausible, and the character's struggle within it must be palpable, preserving the sense of difficult, compromised choice.

  3.  **Resultant Luck (Luck in *how actions turn out*):**
      *   **Justification:** Provides clear narrative hooks and dramatic irony – the identical intention leading to salvation or damnation based on an unseen pebble, a delayed message, a sudden gust of wind. The tension comes from the audience knowing the potential divergence. It challenges the reader by forcing them to separate intention from outcome in assigning blame/praise. It can survive scrutiny if the luck element feels integral and unavoidable, not a writer's cheat, and the focus remains on the *character's* response to the unforeseen consequence.
      *   **Natural Plot:** Parallel narratives showing identical actions with wildly different outcomes; a single critical moment where chance intervenes (a near miss becomes a fatal accident, a lie is believed/uncovered randomly); exploring the aftermath of an unintended consequence and the burden of "if only".
      *   **Characteristic Failure Mode:** Precisely "rigging the dice" – making the lucky/unlucky outcome feel narratively convenient, artificial, or engineered solely to make a point, undermining the sense of genuine contingency. It risks reducing the moral question to a simplistic "bad break" rather than probing deeper questions of responsibility *despite* the break.

  4.  **Causal Luck (Luck in the *antecedent chains* leading to one's existence/nature/circumstances):**
      *   **Justification:** The most philosophically fundamental (encompassing aspects of the others) but also the most structurally challenging for conventional narrative. It asks: If every state is determined by prior causes stretching back beyond our beginning, how can *any* blame be justified? Its power is abstract and potentially paralyzing for dramatic action. Creating sustained tension around this is difficult without resorting to fatalism or abstract discourse. Resisting tidy resolution is inherent, but it risks leaving the narrative feeling inert or philosophically detached rather than humanly engaging.
      *   **Natural Plot:** An intergenerational saga highlighting the inescapable weight of history/family legacy on present choices; a character obsessively tracing the chain of events that led to their specific flaws/situation; a narrative constantly pulling back to show the vast web of causality influencing a seemingly simple act.
      *   **Characteristic Failure Mode:** Narrative paralysis – the story becoming an illustration of determinism rather than a lived experience. Characters can feel like puppets, reducing dramatic tension. It can lead to excessive exposition about backstory/causes at the expense of present action and agency. Maintaining reader engagement with the human dilemma within this vast framework is exceptionally hard.

  **Addressing Your Instinct on Circumstantial Luck:**
  You are correct that it's the easiest to dramatise, and that's a significant strength. It provides immediate, visceral stakes. However, constitutive luck offers a *deeper*, more intimate, and potentially more unsettling exploration of the core question – not just "What would you do in this situation?" but "What if *you* were fundamentally ill-equipped to handle *any* morally demanding situation?" It forces the confrontation with the self as an unchosen given, which is philosophically richer and less prone to the external contrivance risk of resultant luck or the abstraction of causal luck. Your instinct isn't wrong, but constitutive luck might yield a more profound and character-driven exploration of your central theme.

  **The Comic Rearrangement:**
  For a **comic novel**, the ranking shifts significantly:

  1.  **Circumstantial Luck:** Comedy thrives on absurd situations, misunderstandings, and characters trapped in escalating farce. Circumstantial luck is the engine of classic comedy – mistaken identities, improbable coincidences, social faux pas born of bad timing. The reader laughs *at* the situation and the character's flailing attempts to cope. Tidy resolution is less expected, and philosophical scrutiny is often suspended for the sake of the joke.
  2.  **Resultant Luck:** The accidental consequence is pure comedic gold – the slip on the banana peel, the well-intentioned lie spiralling out of control, the unintended insult heard by the wrong person. It generates slapstick and situational humour easily. Rigging the dice *is* often the point in farce.
  3.  **Constitutive Luck:** Can work well as the basis for character comedy – the grumpy misanthrope, the hopelessly naive optimist, the perpetually awkward protagonist. Their unchosen nature creates predictable but humorous clashes with the world. The danger is the comedy becoming mean-spirited if the constitutive flaw is presented as inherently ridiculous or pitiable without warmth.
  4.  **Causal Luck:** Remains the hardest. Comedy could come from absurdist takes on determinism (characters pointlessly rebelling against obvious fate) or the cosmic irony of vast chains leading to trivial outcomes. However, it's inherently less accessible and less directly character-driven for mainstream comic purposes than the others.

  **Why the Shift for Comedy?**
  Tragedy and serious literature grapple with the weight of luck on responsibility and the potential for suffering. Comedy exploits the absurdity, unpredictability, and incongruity created by luck. It revels in the chaos of circumstance and the ridiculousness of unintended consequences, where tragedy finds anguish. Constitutive luck, so powerful in tragedy for exploring the burden of self, becomes a source of humorous inflexibility or quirkiness in comedy. Resultant luck shifts from a source of moral horror to a punchline. Circumstantial luck moves centre stage as the primary generator of comedic conflict and chaos. The focus moves from profound ethical questioning to the celebration (or mockery) of human resilience and folly in the face of life's random silliness.
