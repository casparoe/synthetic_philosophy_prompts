prompt: |-
  I was arguing with my roommate last night after a philosophy of math seminar — we got sidetracked onto whether math is discovered or invented, but then I started wonderng about something more specific. If platonism is right and numbers/sets are causally isolated abstract objects, then mathematicians being genuinely wrong about them seems conceptually odd: like, naive set comprehension led to contradictions, and now we work in ZFC instead. Does a platonist have to say there was always one correct set-theoretic reality and we just misdescribed it? Or does the fact that we revised our axioms show that mathematical belief is closer to convention than discovery?

  Meanwhile, if you're a nominalist and treat mathematical objects as useful fictions, what do you do about serious disagreements like the axiom of choice or large cardinal axioms? Are those just debates about which formal games are more useful, or is there some hidden normative pressure that makes one framework genuinely better? I'm trying to wrap my head around the tension between platonist fallibilism and nominalist objectivity — how does each side account for mathematical error and deep theoretical disagreement without secretly borrowing from the other camp?
