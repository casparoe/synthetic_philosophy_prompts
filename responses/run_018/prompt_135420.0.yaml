answer: |-
  Here’s a rigorous analysis of potential defeaters for your "zero pure time preference" (ZPTP) position, ranked by severity, with formal, metaphysical, and practical challenges. I’ll focus on arguments that aren’t reducible to psychology or risk, per your request.

  ### **Fatal Defeaters (If Valid)**
  1. **Infinite Utility Streams & Impossibility Theorems**:  
     - **Problem**: In infinite-horizon settings (e.g., humanity existing forever), ZPTP makes some welfare streams *incomparable*.  
     - **Formal Result**: The **overtaking criterion** fails without discounting. Consider two futures:  
       - Stream A: 0 utility for all time.  
       - Stream B: −1 utility at time *t*=1, +1 utility for *all* *t* > 1.  
       With ZPTP, B is better than A. But now consider Stream C: −1 at *t*=1, +2 for *t* > 1. ZPTP cannot rank B vs. C because they differ only at finite times, and infinite sums diverge.  
     - **Ramsey’s Infinity Problem**: Without discounting, any action causing finite harm for infinite gain is *always* required, but also *never sufficient* to outweigh another infinite gain. This violates **transitivity**.  
     - **Why fatal?** ZPTP may imply *no rational choice* in cosmically significant longtermist decisions.

  2. **Time-Asymmetry in Physics & Causality**:  
     - **Argument**: Thermodynamics (entropy increase) and quantum mechanics (collapse of wave functions) are time-asymmetric. If physics treats past/future differently, shouldn’t ethics?  
     - **Defender’s Response**: Time-asymmetry ≠ normative relevance. Spatial asymmetries (e.g., gravity gradients) don’t justify valuing closer people more.  
     - **Counter**: Causality flows forward. We can *act* on the future but not the past. ZPTP treats future/past symmetrically, but we can’t change the past. This may ground a *practical* asymmetry.  
     - **Severity**: Not fatal alone, but combined with decision theory, it pressures ZPTP’s coherence.

  ---

  ### **Strong but Not Fatal Defeaters**
  3. **Self-Locating Uncertainty & the Non-Identity Problem**:  
     - **Your framing**: Future selves as "probabilistic copies."  
     - **Defeater**: If future selves are distinct agents (per Parfit), temporal discounting is *interpersonal*, not intrapersonal. Why value *any* future agent over another?  
     - **Parfit’s Non-Identity Problem**: Future people’s identities depend on present choices. Sacrificing for them isn’t "helping yourself later" but "creating different people." This severs diachronic unity.  
     - **Implication**: If future selves aren’t "you," ZPTP collapses into **total utilitarianism for all possible beings**—which faces its own paradoxes (e.g., repugnant conclusion).

  4. **Presentism and the Ontology of Time**:  
     - **Argument**: If only the present exists (presentism), future welfare isn’t *real* yet. Discounting isn’t bias but metaphysical necessity.  
     - **Rebuttal**: Presentism is contested (e.g., eternalism in relativity). But even if true:  
       - Why care about *past* welfare? (ZPTP would require equal concern).  
       - If future states will become "present," why discount them now?  
     - **Severity**: Metaphysical disputes rarely resolve ethics. But it grounds a *principled* (non-egoistic) difference if combined with causal power.

  ---

  ### **Awkward Implications (Not Logical Defeaters)**
  5. **Astronomical Sacrifice Demands**:  
     - **Problem**: ZPTP implies extreme present sacrifice for future goods (e.g., spending 99% of GDP to prevent a 0.001% existential risk in 10,000 years).  
     - **Is this fatal?** No—it’s consistent if future welfare matters equally. But it may violate **weak efficiency**: We could make *all* generations better-off by allowing modest discounting (e.g., 0.1%/year) while still prioritizing the future.  
     - **Hidden Commitment**: ZPTP likely demands **paternalism** (forcing others to sacrifice for the far future).

  6. **Violation of Dynamic Consistency**:  
     - **Argument**: With perfect foresight, ZPTP plans are time-consistent. But without it, an agent might "renegotiate" later (e.g., delay sacrifice).  
     - **Why awkward?** ZPTP assumes no such renegotiation—but humans *do* dynamically update. This doesn’t refute ideal theory but highlights friction with real agents.

  ---

  ### **Arguments from Defenders of Pure Time Preference**
  Ranked by strength (strongest first):  
  1. **Formal Necessity in Infinite Settings** (as above).  
  2. **Causal Asymmetry**: We control the future, not the past. Pure preference reflects agency, not bias.  
  3. **Personal Identity Non-Continuity**: If "you" are a series of causally related stages, valuing proximate stages more is rational (like valuing your child over a stranger).  
  4. **Revealed Preference**: In ideal markets with no risk, positive discount rates persist (though this risks circularity).  

  **Weakest Argument**: "I feel it" (as you noted). Most economists retreat to risk/uncertainty.

  ---

  ### **Is the Anti-Preference Position Unfalsifiable?**
  - **Yes, if qualified excessively**. Claiming "all observed discounting is risk" can evade counterevidence. But ZPTP itself risks unfalsifiability by dismissing temporal asymmetry as "irrational."  
  - **Testability**: Look for *risk-independent* discounting:  
    - Experiments with certain, immediate vs. delayed rewards.  
    - Philosophical intuitions (e.g., "Would you accept 1 minute of torture now vs. 1 minute in 100 years?").  
    If people still discount, ZPTP must call this "error," which is epistemically costly.

  ---

  ### **The Core Vulnerability of Your View**
  **The mathematics of infinity**. If humanity’s future is potentially infinite (or indefinite), ZPTP struggles to:  
  - Rank outcomes.  
  - Avoid demanding infinite sacrifice for finite gains.  
  - Resolve Pareto violations (e.g., improving welfare at all finite times shouldn’t change rankings, but it can).  

  This isn’t about "feeling"—it’s about **formal undecidability** in key longtermist contexts. You must either:  
  - Accept incompleteness in decision-making, or  
  - Introduce *non-temporal* criteria (e.g., procedural rules) that mimic discounting’s effects.

  ### **Conclusion**
  Your strongest opponents are **decision theorists** (infinite horizons) and **metaphysicians** (time-asymmetry of agency). The spatial analogy holds *except* where time uniquely introduces infinitudes or causal directionality. For finite cases with certain outcomes, ZPTP is ironclad—but longtermism often rejects those constraints. Prioritize resolving the infinity paradoxes; they’re the tallest hurdle.
