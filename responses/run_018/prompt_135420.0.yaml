  Metaphysical arguments like presentism or the open future could be another angle. Presentism posits that only the present is real, which might justify prioritizing current welfare. But the user might counter that presentism is implausible. The open future argument suggests future people don't exist yet, so they might have different moral status. However, this could lead to egoism, which the user rejects. So these metaphysical stances might not be fatal but are worth mentioning as potential grounds others use.

