  I should also consider identity over time. If personal identity isn't continuous, discounting future selves might be like discounting others. That challenges the analogy between temporal and spatial discounting. This could be a moderate defeater since it questions the foundational analogy.

  Ranking these from fatal to awkward: The formal results like incomparability in infinite cases are strong. Self-locating uncertainty and identity issues are moderate. Metaphysical arguments are weaker, and unfalsifiability is more of an annoyance. Practical implications are awkward but not fatal.

  The user's hidden commitment might be the level of sacrifice required. Acknowledging that could help them understand the practical pushback. Also, they might not have considered how their view handles infinite time horizons mathematically, which is a serious technical challenge.

