  First, I need to parse each concern's impact. The decay of long-horizon expertise could hurt complex policy-making. Then, accountability: if voters can't re-elect or oust officials, does that reduce legitimacy? Socialization patterns for cross-partisan negotiations matter too, especially in polarized environments.

