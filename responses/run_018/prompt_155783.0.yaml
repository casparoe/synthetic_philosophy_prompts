  ## MEMO: Funding Rec for "The Last Equation" - URGENT VOTE TUES

  **TO:** Public Humanities Board  
  **FROM:** [Your Name], Philosophy of Art Rep  
  **DATE:** ASAP! (Sorry for typos, typing fast before seminar!)  
  **RE:** Rec on $8k Request for "The Last Equation" (Turing Play) - **Recommend REJECT**  

  **Bottom Line Up Front:** After wrestling with this, I recommend we **REJECT the funding request as submitted**. Timeline: **Vote this Tuesday (DATE)**. If playwright wants to appeal/modify *before* Tuesday, she must submit changes **by EOD Monday** to the Chair for circulation.  

  ### 1. The Core Problem: "Narrative Colonization" vs. "Historical License"
  The Turing Estate's objection cuts deeper than just "they got some facts wrong." Their "narrative colonization" framing is serious and distinct from standard dramatic license:

  *   **Falsification Harm (What We Often See):** Getting dates wrong, simplifying complex events, maybe inventing a minor character for clarity. Annoying to historians, but usually seen as tolerable for storytelling. A program note often fixes this.
  *   **Narrative Colonization (Their Claim):** This isn't just *changing* details; it's **imposing an entirely fabricated inner world and final act (the unsent letter) onto a real, recently deceased person who cannot consent, particularly one persecuted for his identity.** It forces Turing's real, tragic death (suicide, widely accepted) into a *specific, invented dramatic arc* he never chose and never voiced. The Estate argues this exploits his trauma and marginalized status (gay man, chemically castrated by the state) to serve the playwright's vision, overriding his actual history and silence. It’s about **power, appropriation, and the ethics of speaking *for* the dead in vulnerable positions.**

  ### 2. Why This Argument Resonates (And Why Reject Might Be Right)
  This isn't just stuffy historical gatekeeping. The Estate has a strong ethical point, especially given Turing's specific context:
  *   **Vulnerability Exploited?** Turing was *literally* stripped of autonomy by the state. Inventing his private thoughts and an unsent final message *after* that feels uncomfortably like continuing that violation. It uses his real suffering as mere raw material.
  *   **Consent is Impossible:** Unlike fictional characters or long-dead figures, Turing died in 1954. There's no way to know if he'd consent to this specific, intimate fictionalization of his final despair. The lack of consent for such personal invention feels ethically weighty.
  *   **It's Central to the Play:** The playwright *admitted* inventing the private convos and the **unsent letter**. This isn't a peripheral detail; it sounds like the *emotional climax and core conceit* of "The Last Equation." You can't separate it out with a disclaimer; the play *is* built on this colonization.

  ### 3. The Strongest Counter-Argument (Why Someone Might Say Approve)
  The *best* case for funding is that **theatre's power lies in imaginative empathy, not strict biography.** A playwright might argue:
  *   This invented arc isn't meant to replace history, but to use dramatic form to explore the *universal themes* of isolation, persecution, and silenced genius that Turing's life tragically embodies. Art accesses emotional truths that pure facts sometimes can't convey.
  *   Turing is a cultural icon whose story *needs* retelling to new audiences. Strict historical purity can make drama inert. This interpretation, while invented, could spark vital conversations about his legacy and the harms done to him.
  *   Rejecting it stifles artistic exploration of difficult historical figures, especially marginalized ones, potentially silencing important creative voices.

  ### 4. Why "Approve with Conditions" Doesn't Solve It Here
  I initially hoped for this! But I don't think it works for *this specific* objection:
  *   **Program Notes/Disclaimers:** Would acknowledge invention but wouldn't *undo* the fundamental act of colonization central to the play's structure. It's like putting a band-aid on a deeper ethical wound. The harm (imposing an inner narrative) is already done in the performance.
  *   **Post-Show Panel:** Great practice generally! But it feels like making historians clean up *after* the ethical breach has occurred on stage. It doesn't prevent the core problematic act; it just critiques it afterward.
  *   The Estate's objection is to the *very act of creation* funded by us. Adding context feels insufficient when the foundational act (the invented letter/imposed arc) is the problem they highlight.

  ### 5. Recommendation: REJECT
  While I deeply value artistic imagination and the playwright's intent to engage with Turing's legacy, the "narrative colonization" argument concerning the **invention of core, private emotional moments and an unsent final letter** for a figure as specifically vulnerable and recently deceased as Alan Turing carries too much ethical weight. Funding this specific version feels like endorsing that appropriation. The harm identified by the Estate is fundamental to the play's current design and isn't adequately mitigated by add-on conditions.

  **Therefore, I recommend we REJECT the $8k funding request for "The Last Equation" in its current form.**

  **Timeline Recap:**
  *   **MONDAY EOD:** Deadline for playwright to submit significant modifications (if any) to Chair for *urgent* Board review before Tuesday vote. (Significant = addressing the core invented elements central to the Estate's objection).
  *   **TUESDAY MEETING:** Board Vote on the request (as-is or modified if submitted).

  This is a tough one, folks. Open to discussion Tuesday, but the ethical unease here is significant.  

  PS: Absolutely *no* reflection on the playwright's talent or the importance of Turing's story. It's purely about this specific ethical knot.  

