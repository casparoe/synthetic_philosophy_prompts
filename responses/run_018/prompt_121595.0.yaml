prompt: |-
  I'm writing a feature on rational belief revision for a science-ideas publication, and I need to defend a position in an upcoming philosophy-of-science seminar. The thesis is what I call 'framework steadfastness': conciliationism is appropriate for evidential peer disagreement—where agents share data but weigh it differently—but not for structural disagreement over the weighting of theoretical virtues themselves, because there is no shared epistemic currency with which to 'split the difference.' The audience is mostly social epistemologists who favor conciliationism, plus two formal epistemologists who work with precise credence functions and Bayesian models of disagreement. Please draft my Q&A prep sheet: list roughly eight objections in the order they're likely to come, phrased exactly as members of this audience would put them, ordered by how damaging they are to my position. For each, provide a concise reply suitable for a two-minute response, and flag the weakest point in that reply. Include the objection I'm hoping nobody asks—namely, that framework steadfastness collapses into dogmatism once agents can reclassify any disagreement as 'structural'—and advise what I should concede there without surrendering the core claim. Keep it focused on the conceptual issues, not on bibliography.
