answer: |-
  ## Formal Desiderata Document: Evaluating Philosophical Reconstructions of Maimonides' Position on Animal Sacrifice

  **Document Purpose:** To specify the essential criteria any adequate philosophical reconstruction of Moses Maimonides' (Rambam's) position on animal sacrifice must satisfy, centered on resolving the "Sacrificial Persistence Problem" (SPP). The SPP arises from the tension between: (A) the anthropological-genetic explanation of sacrifice's *origin* in the *Guide for the Perplexed* (III.32, III.46), presented as a concession to idolatrous habits, and (B) the treatment of sacrificial law as permanently binding divine legislation with potential future restoration in the *Mishneh Torah* (esp. *Hilkhot Ma'aseh ha-Korbanot*, *Hilkhot Melakhim* 11:1). Reconstructions must articulate and resolve this tension without dissolving it via textual dismissal (e.g., ignoring one text, demoting one to mere rhetoric, or positing insincerity).

  **Core Demand:** The reconstruction must simultaneously accommodate both the *contingency* of sacrifice's historical *institution* (as described anthropologically) and the *necessity* of its enduring *legal status* (as codified normatively), explaining their relationship within Maimonides' philosophical and halakhic system.

  ### I. Foundational Textual & Conceptual Phenomena to Accommodate (Non-Negotiable)

  1.  **The Anthropological-Genetic Narrative (Guide III.32, III.46):** *Must accommodate* Maimonides' explicit statement that God commanded sacrifice *primarily* as a concession to the Israelites' entrenched idolatrous practices ("accustomed to the sacrificial service of the Sabeans"), serving a pedagogical function (weaning them from idolatry by redirecting its form towards monotheism) and preventing regression. *Motivation:* This is a core, explicit explanation in the Guide; dismissal undermines the text's integrity.
  2.  **The Legal Permanence Doctrine (MT):** *Must accommodate* the codification of sacrificial laws in meticulous detail within the definitive legal code, their classification as enduring commandments (*mitzvot*), and the clear implication that they remain binding and could be restored with the rebuilding of the Temple (*Hilkhot Melakhim* 11:1). *Motivation:* This is the bedrock of Maimonidean Halakha; treating these laws as effectively abrogated contradicts his legal formalism and view of the Torah's immutability.
  3.  **Classification as *Hukkim* (Statutes):** *Must accommodate* Maimonides' placement of many sacrificial laws, including their specific details (species, conditions), within the category of *hukkim* - commandments whose reasons are opaque or not immediately apparent to human reason, though ultimately grounded in wisdom (Guide III.26, III.49; MT *Hilkhot Me'ilah* 8:8). *Motivation:* This classification is explicit and central to his taxonomy of commandments; ignoring it misrepresents his view of their epistemic status.
  4.  **Prayer as Substitute, Not Replacement (Guide III.32, III.36; MT *Hilkhot Tefillah* 1:1-5):** *Must accommodate* Maimonides' view that prayer (and Torah study) were instituted *only* as temporary substitutes for sacrifice *during exile*, implying sacrifice remains the ideal normative mode of worship when possible. *Motivation:* This explicitly limits the substitution thesis to exilic conditions, preserving the primacy of sacrifice.
  5.  **Divine Law Immutability:** *Must accommodate* Maimonides' fundamental principle that the Torah's commandments, as divine legislation, are perfect, unchanging, and not subject to essential abrogation (*Iggeret Teiman*; *Hilkhot Yesodei ha-Torah* 9:1). *Motivation:* A core tenet of his jurisprudence; sacrificing permanence violates this principle.
  6.  **Accessibility of Reasons (in Principle):** *Must accommodate* Maimonides' claim that all commandments have rational purposes (*ta'amei ha-mitzvot*), discernible by perfected human intellects, even if currently unknown or classed as *hukkim* (Guide III.31, III.49). *Motivation:* Denying this contradicts his rationalist project; reasons may be complex or historical, but not fundamentally irrational.
  7.  **Hierarchical Ontology & Particular Providence:** *Must accommodate* Maimonides' Aristotelian-Neoplatonic metaphysics where non-rational animals lack individual providence; divine concern extends primarily to humans based on intellectual attainment (Guide III.17-18). Sacrificial regulations *cannot* be primarily reconstructed as expressing inherent concern for animal welfare or minimizing individual animal suffering. *Motivation:* Importing modern animal ethics is anachronistic and contradicts his explicit metaphysical hierarchy.

  ### II. Essential Distinctions to Preserve (Non-Negotiable)

  1.  **Origin vs. Status:** *Must preserve* the distinction between the *historical genesis/contingent pedagogical function* of the sacrificial institution and its *ontological/legal status* as a permanent divine commandment. *Motivation:* Collapsing this distinction dissolves the SPP; confusing *why it was commanded then* with *why it remains commanded now* is fallacious.
  2.  **Exoteric Function (*Taʿlīm*) vs. Esoteric Status/Meaning:** *Must preserve* the distinction between the surface-level, pedagogical rationale offered for the masses (weaning from idolatry - *taʿlīm*) and any deeper, enduring ontological, metaphysical, or legal rationale applicable even after the original pedagogical need subsides. *Motivation:* Maimonides consistently employs such distinctions; failure here risks misreading the Guide's genetic account as his exhaustive or final word on the commandment's essence.
  3.  **Conventional vs. Symbolic:** *Must preserve* the distinction between elements of the law that are purely conventional markers of legal validity (e.g., specific colors for Temple utensils) and those that carry inherent symbolic weight relating to fundamental truths (e.g., the unity of God). *Motivation:* Necessary for evaluating the metaphysical-symbolic layer (#3 below) without arbitrariness. This distinction itself needs explanation within the reconstruction.

  ### III. Structural Layer Requirements

  1.  **Anthropological-Genetic Layer:**
      *   *Must explain* why sacrifice, given its origin as a concession to idolatrous habit, was nevertheless commanded by God as part of the perfect, eternal Torah.
      *   *Must explain* how this initial pedagogical function relates to the commandment's enduring validity *after* the original idolatrous context has (arguably) passed. Is the pedagogy ongoing? Transformed?
      *   *Cannot reduce* sacrifice to a merely provisional, time-bound institution rendered obsolete by reason or historical progress. *Motivation:* To prevent dissolving the SPP by negating permanence. *(Non-Negotiable)*

  2.  **Legal-Permanence Layer:**
      *   *Must explain* the source and nature of the sacrificial law's *ongoing binding force*. Is it grounded solely in divine fiat, or does it retain a connection to enduring human needs/realities?
      *   *Must explain* the *potential for future actualization* (restoration). What conditions enable/reactivate its practice? How does its meaning/purpose persist latently?
      *   *Cannot treat* the legal texts as mere historical artifacts, rhetorical devices to manage the masses, or pious fictions covering an essentially abolished practice. *Motivation:* To prevent dissolving the SPP by negating the genuineness of the legal commitment. *(Non-Negotiable)*

  3.  **Metaphysical-Symbolic Layer:**
      *   *Must determine* the semantic status of the specific sacrificial conditions (domestic animals, physical perfection, specific species): Are they (a) Purely conventional legal markers? (b) Symbols with inherent meaning relating to truths (e.g., subordinating the animal soul/appetites to the intellect/divine will)? (c) A combination?
      *   *Must ground* any symbolic interpretation firmly within Maimonides' broader metaphysics (e.g., hierarchy of being, intellect vs. matter, human perfection) and jurisprudence (classification as *hukkim*).
      *   *Must avoid* attributing symbolic meaning based on concern for individual animal suffering or welfare that contradicts his hierarchical ontology and view of providence (I.7). Symbolism must relate to human psychology, divine attributes, cosmic order, or legal pedagogy compatible with hierarchy. *Motivation:* To articulate the deeper meaning (if any) without anachronism or contradiction. *(Determination Required; Grounding Non-Negotiable)*

  ### IV. Relation of Exoteric and Esoteric
  *   *Must specify* the relationship between the exoteric pedagogical function (*taʿlīm* - weaning from idolatry) and the esoteric ontological/legal status/permanent rationale.
      *   Options: Is the exoteric function merely the historical vehicle for introducing an enduring law with a different, deeper purpose? Is it the surface expression of a deeper symbolic meaning that persists? Are they complementary aspects (historical *and* enduring significance)? Is there genuine tension or unresolved commitment?
  *   *Must demonstrate* how this relationship resolves, or at least coherently articulates, the tension between the genetic explanation and legal permanence. *Motivation:* This relation is key to bridging the Guide's explanation and the MT's codification. *(Non-Negotiable Requirement to Articulate the Relationship)*

  ### V. Determinate Judgments Required
  The reconstruction *must yield determinate judgments* on the following cases:
  1.  **Status Post-Redemption:** Is sacrifice obligatory, permissible, or obsolete in the messianic era (assuming the historical pedagogical need is gone)?
  2.  **Rationale Accessibility:** *Can* a perfected intellect discern a rationale for sacrifice beyond the historical one? If so, what is its nature (e.g., metaphysical, psychological, social)? If not, how is this consistent with VI.6?
  3.  **Symbolic Core:** Does the specific requirement for unblemished, domestic animals signify something essential about the human-divine relationship or human psychology (e.g., offering one's perfected "animal" nature), or is it purely a legal convention marking the offering as valuable/suitable? *(Non-Negotiable that Reconstruction Provides Answers)*

  ### VI. Tensions Between Desiderata & Camp Vulnerabilities

  1.  **Core Suspected Tensions:**
      *   **Exhaustive Concession vs. Permanence (I.1 vs. I.2/II.1):** Can a reading that emphasizes sacrifice *solely* as a remedy for a *cured* historical pathology ("idolatry addiction") coherently maintain its *permanent* binding force and future restoration? This is the heart of the SPP. Most vulnerable is the **Concessive-Pedagogical Camp** if it minimizes enduring meaning.
      *   **Robust Symbolism vs. Animal Hierarchy (III.3 vs. I.7):** Can a reading attributing deep symbolic meaning *to the animal's condition itself* (e.g., its suffering representing something profound, its perfection reflecting inherent value) avoid implicitly contradicting Maimonides' denial of individual animal providence and his hierarchical ontology? Most vulnerable is the **Esoteric-Symbolic Camp** if it imports modern ethics.
      *   **Permanence vs. Pedagogical Obsolescence (I.2 vs. I.1):** If the *primary* reason (historical pedagogy) is obsolete, what *is* the current/permanent reason justifying its binding force? This challenges all camps but particularly pressures **Concessive-Pedagogical** and **Legal-Formalist** camps.

  2.  **Most Damaging Requirement to Dominant Readings:** The requirement **IV (Relation of Exoteric and Esoteric)** arguably does the most damage. Dominant readings often:
      *   **Concessive-Pedagogical:** Tend to *collapse* the esoteric status into the exoteric function, struggling with permanence (I.2).
      *   **Esoteric-Symbolic:** Risk *minimizing* the force of the historical concession (I.1) or struggling to ground the symbolism without contradicting I.7.
      *   **Legal-Formalist:** Often *sidestep* the Guide's explanation (I.1) or treat it as irrelevant to binding law, failing to genuinely engage the SPP and requirement IV.

  ### VII. Camp Performance Synopsis (Illustrative, Not Defensive)

  | Interpretive Camp       | Strengths Re: Desiderata                          | Vulnerabilities Re: Desiderata                                 | Key Challenge Re: SPP                                      |
  | :---------------------- | :------------------------------------------------ | :------------------------------------------------------------ | :--------------------------------------------------------- |
  | **Concessive-Pedagogical** | Accommodates I.1 robustly; Compatible with I.6    | Struggles with I.2, I.4 (permanence/future); Often weak on IV (relation); Risks violating I.5 (immutability) if concession implies obsolescence; Weak on III.3 (symbolism). | Reconciling *exhaustive* concession with *genuine* permanence. |
  | **Esoteric-Symbolic**     | Accommodates I.2, I.4, I.6; Strong on III.3; Can address IV via deeper meaning. | Risks downplaying I.1 (historical force); High risk of violating I.7 (animal hierarchy) if symbolism imports welfare; Can struggle with I.3 (*hukkim* accessibility). | Grounding symbolism without anachronism or contradicting metaphysics; Fully integrating the historical concession. |
  | **Legal-Formalist**       | Accommodates I.2, I.3, I.5 robustly; Preserves II.1 clearly. | Often dismissive or reductive of I.1, I.4; Weak on IV; Neglects III.3; May struggle with I.6 (reasons) beyond "divine will". | Genuinely incorporating the Guide's explanation (I.1) and addressing IV without dissolving the tension. |

  **Conclusion of Specification:** This document defines the necessary and sufficient conditions for an adequate philosophical reconstruction of Maimonides on animal sacrifice. A successful reconstruction must satisfy all **Non-Negotiable** requirements (Primarily Foundational Phenomena I.1-I.7, Distinctions II.1-II.3, Layer Requirements 1 & 2, Relation Requirement IV, and Determinate Judgments V), while rigorously addressing the **Structural Layer Requirements** (particularly the Metaphysical-Symbolic Layer III determination) and navigating the inherent **Tensions** identified. The evaluation of any proposed reconstruction will measure its fidelity to these desiderata and its success in coherently resolving the Sacrificial Persistence Problem without textual dismissal or contradiction. No reconstruction is expected to satisfy every conceivable *desideratum* perfectly, but it must transparently engage the core tensions defined herein.
