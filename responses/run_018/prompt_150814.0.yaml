  Please explain the conceptual issue at stake: specifically, why the combination of an unrestricted preference domain, three or more alternatives, and a non-dictatorial aggregation rule makes strategic manipulation unavoidable. Then turn to the following wrinkle. Imagine that voters may submit not complete linear rankings but partial orders containing “hard constraints” — for example, declaring that any climate-policy bundle exceeding a specific carbon-tax threshold is categorically unacceptable, regardless of how revenue is recycled. Conceptually, does introducing such veto-like exclusions genuinely restore strategy-proofness by narrowing the domain, or does it merely relocate the incentive to manipulate into the strategic framing of the constraints themselves? Keep your analysis self-contained: do not supply bibliographies, reading lists, or citations to specific works, and avoid attributing arguments to named scholars. Use British English spelling throughout.

  Please present your reasoning clearly, and finish with a one-sentence summary of your bottom line on the final line.
