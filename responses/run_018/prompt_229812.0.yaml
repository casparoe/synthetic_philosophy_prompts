  Okay, let me tackle this philosophy teaching plan. The user is an instructor preparing a 75-minute undergrad session on teleosemantics, focusing specifically on how etiological functions solve the disjunction problem. They want a tight, whiteboard-only lesson that builds from students' existing knowledge of functionalism while introducing mental representation as a new challenge.

  First, I need to consider the students' background. They understand mental states as defined by functional roles but haven't encountered representation problems. The disjunction problem will be central, so I must introduce it in a way that feels concrete rather than abstract. A frog vision example seems ideal - it's visceral (flies vs BBs), demonstrates the content ambiguity, and sets up teleosemantics as the solution through historical function.

  The sequence should flow logically: start with representation as the new puzzle, demonstrate why causal theories fail (disjunction problem), introduce etiological function carefully (avoiding "usual function" misconceptions), then apply to the frog case. Key milestones: establishing misrepresentation as possible only with normative content, unpacking "selected for" versus accidental benefits, and showing how history collapses disjunctions.

  For misconceptions, I anticipate two big ones: conflating "proper function" with statistically common outcomes, and misunderstanding "normal conditions" as average conditions. These must be preempted when defining terms - perhaps through counterexamples like the sperm's journey (rare success) or mutated frog eyes (common failure). 

  The assessment question at the end should test if they grasp why history solves disjunction: "Why isn't the frog representing 'nutritious speck'?" If they cite selection history rather than just repeating the solution, they get it. 

  I'll explicitly avoid covering producer vs consumer teleosemantics or alternative theories. Keep it focused. The spine is clear: Representation without teleology leads to disjunction; etiological function provides normativity; applied to frog, this solves disjunction and explains misrepresentation.
answer: |-
  Here's a focused 75-minute lesson plan centered on the disjunction problem and etiological function, building on functionalism while introducing representation:

  **Order of Concepts (45 mins conceptual setup, 30 mins teleosemantics & disjunction):**
  1.  **The Gap: Role vs. Content (10 mins):** Review functionalism (role typing states). Pose: "What *about* the state makes it *about* something? How does representing X differ from just being caused by X?" Introduce **Mental Representation** as the new problem: states having *content* (being *about* something specific).
  2.  **Naive Causal/Informational Theory (CT) & Its Fatal Flaw (15 mins):** "A simple idea: State `S` represents whatever causes it (e.g., `S` fires when horse present -> `S` represents `horse`)." Introduce **Misrepresentation**: What if `S` fires when no horse is present (e.g., cow on dark night)? CT struggles: Did `S` *misrepresent* the cow as a horse? Or does it *correctly* represent the disjunction `horse-or-cow-on-dark-night`? State the **Disjunction Problem**: CT seems forced to say the content is the disjunction of *all* its actual causes. Misrepresentation becomes impossible ("It *was* one of those disjuncts!").
  3.  **Why Misrepresentation Matters (5 mins):** Argue representation *requires* the possibility of error. If `S` *always* correctly indicates its disjunction, it's not *representing* anything specific; it's just reliably correlated. CT fails as a theory of *content*.
  4.  **Introducing Teleosemantics: The Core Idea (10 mins):** "We need normativity - correctness *conditions*. Where does that norm come from? Biology has norms: hearts *should* pump blood, eyes *should* see. Enter **Function**." Distinguish sharply:
      *   **Causal Role Function:** What a trait *actually does* (often now, statistically).
      *   **Etiological Function (EF):** What a trait was *selected for* by natural selection in ancestors. *Why* it exists. *History matters.*
      *   **Normal Conditions:** Conditions under which the trait's EF *can* be/was *typically* performed during selection history. *Not* statistically average *now*.
  5.  **Applying EF to Representation (25 mins):** "A state `S` represents `X` if `S`'s *etiological function* is to be caused by `X` (under normal conditions)."
      *   Connect `S`'s function to the function of the *mechanism* producing `S`. `S` is *supposed to* be tokened when `X` is present.
      *   **Misrepresentation:** `S` is tokened, but `X` is absent (under normal conditions). `S` failed its function.
      *   **Solving Disjunction:** Content is *not* the disjunction of actual causes. Content is *only* `X` - what `S` was *selected for* indicating. Erroneous causes (cows on dark nights) are *malfunctions* or responses in *abnormal* conditions; they don't define the content.
  6.  **The Price (5 mins):** Content depends on *evolutionary history*. If no selection history, no determinate content? Can this apply to learned states? New representational systems? History is opaque.

  **Carrying Example: Frog Fly-Detector (Not Bacteria or Bee)**
  *   **Why Frog Vision?** (Avoiding Standard Candidates)
      *   **Bacteria:** Too simple; lacks a clear "mental state" analogue; selection is direct on movement, hard to separate "detector" from whole organism response.
      *   **Bees:** Dance is complex communication; adds layers (producer/consumer) unnecessary for core disjunction problem.
  *   **Frog Features (Perfect Fit):**
      *   Clear representational state: Neural state `F` triggered by small, dark, moving specks.
      *   Causal Disjunction: `F` is triggered by flies (nutritious) AND small pebbles/dirt/BBs (non-nutritious) dropped past it.
      *   Clear EF: `F` exists because it guided tongue-flicking *successfully towards flies* in ancestors. Its *function* is to be caused by flies (under normal pond conditions).
      *   Obvious Misrepresentation: `F` firing when a BB passes (no fly). `F` misrepresents the BB *as* a fly.
      *   Disjunction Solved: Content = `fly` (or `small nutritious moving speck`), *not* `fly-or-BB-or-dirt-clod`. BBs trigger it, but that's *not* what it's *for*; it's a malfunction relative to its history. Normal conditions exclude lab experiments dropping BBs.

  **Likely Misconceptions & Preemption:**
  1.  **"Proper function = what it usually does now."** (When introducing EF @ Step 4)
      *   **Preemption:** Counterexample: A mutated frog eye *usually* fails to detect flies due to a defect. What is its *proper function*? Still `detect flies` (because of history), even if it rarely succeeds *now*. Function is historical, not statistical present.
  2.  **"Normal conditions = statistically average conditions now."** (When introducing EF/Normal Conditions @ Step 4)
      *   **Preemption:** Counterexample: Due to pollution, a pond is *now* usually murky, making fly detection hard. Are "normal conditions" murky? No. "Normal conditions" are the (often past) conditions *under which the trait was selected to perform its function* – likely clearer water. Stats now ≠ Normal Conditions.
  3.  **"Selection history determines content directly, ignoring mechanism."** (When applying EF to Representation @ Step 5)
      *   **Preemption:** Emphasize: The function is assigned to the *mechanism* producing `S` *based on what it was selected for detecting*. The frog system was selected for detecting flies *using the cue* `small dark moving speck`. The mechanism's sensitivity defines the specific content (`fly` via that cue), not just "food".

  **Assessment Question:**
  *   **Question:** "Imagine a frog whose `F` state gets triggered *reliably and nutritiously* by tiny nutrient pellets scientists drop into its tank (no flies ever present). According to teleosemantics, does `F` represent `nutritious pellet` or `fly`? And *crucially*, **why** is representing `fly` still the correct answer despite the reliable pellet-triggering?"
  *   **Why it works:** Tests if they grasp that *history*, not current reliable causation, determines content. They must explain that the mechanism exists *because* it detected flies in ancestors; pellets are a new, abnormal cause (even if reliable now) and don't redefine the historical function/content. It forces them to apply the etiological norm.

  **Explicitly Exclude:**
  *   "We're focusing *only* on how etiological function solves the disjunction problem for simple perceptual states. We won't cover producer vs. consumer teleosemantics, Swampman, derived intentionality (like words), or objections like indeterminacy (e.g., does it represent `fly` or `food` or `small dark moving thing`?). These are crucial next steps, but today is about the core explanatory power – and historical cost – of the approach."

  **Spine of the Sequence:**
  > **Representation requires the possibility of error (misrepresentation), which naive causal theories cannot provide due to the disjunction problem; etiological function provides the necessary normativity by defining content as *what the state was selected for indicating*, thereby collapsing the disjunction to the selected-for item and explaining error as failure of function.**
