prompt: |-
  Hey — I'm a journalist who covers science and culture, and I've been noodling on this for a piece. I want to know if there's actually a principled line here, or if I'm just making excuses for my own habits. So please, act like you're a professional philosopher of social norms — take a second to brainstorm, then think carefully step by step.

  Here are my gut verdicts on conventions and wether they bind people, especially visitors:

  - Not tipping a waiter in New York where tips are wages: thats wrong, like skimping on pay. But leaving a tip in Japan where its seen as insulting: not wrong, in fact the right move is to skip it.
  - Cutting in line at the post office: clearly wrong everywhere.
  - Jaywalking in Berlin at 3am with no cars and no people: I feel like thats... maybe okay? But I also feel a twinge, like I'm breaking a rule for no reason.
  - A tourist in India who doesnt take off shoes entering a temple: wrong, disrespectful, should follow local practice.
  - A tourist in a country where small bribes are standard for permits: I think refusing is right, not wrong. So some local conventions dont bind visitors.
  - In Italy, people crowd onto the bus without queuing. As a visitor, should I crowd too? I go back and forth — part of me says yes, adapt; part says no, queuing is universal.

  Theres also this case I cant settle: eating while walking in Tokyo. Locals avoid it. A tourist does it on the subway. I think 'they should stop,' but then I think 'why should a visitor be bound by aesthetic norms?'

  I'm trying to frame this with something I'm calling local normative jurisdiction — maybe conventions only generate real moral obligations when they solve a coordination problem that actually affects others, not just when they express local taste. But I dont know if that holds up.

  Is there one principle — or maybe a small set — that gets all these verdicts? What does it say about the Italy bus case and the Tokyo walking case? And be honest: which of my gut calls does it have to reject? I want the principle stated precisely, with the case that motivates each clause, and predictions for cases I havent listed — like, say, a visitor refusing to haggle in Morocco, or a local in the US who refuses to tip because they oppose the system.
reasoning: |-
  Okay, let me approach this as a professional philosopher of social norms would. The journalist wants a principled way to distinguish when local conventions morally bind visitors and when they don't. Their examples show intuitive contradictions – tipping in New York vs Japan, bribes vs temple shoes, queueing vs crowding. 

  First, I notice three key dimensions in their examples: harm prevention (like not stiffing waitstaff), respect for sacred spaces (temple shoes), and pure coordination (bus boarding). Their "local normative jurisdiction" idea points in the right direction but needs refinement. 

  The temple case suggests respect matters beyond mere coordination. The bribery example shows some norms shouldn't be followed even if local. So we need at least two filters: 1) Does the norm solve coordination/prevent harm? 2) Is it morally permissible itself? 

  For the bus crowding in Italy: if it's purely about efficient boarding with no fairness issues, adapting might be neutral. But for eating while walking in Tokyo – since it causes no harm and isn't disrespectful, it might fall under "cultural aesthetics" that don't obligate outsiders. 

  Hmm, the journalist's anti-bribery instinct reveals an important limit: we can't endorse immoral norms. And their queuing intuition might overextend – if a society genuinely functions well without queues (like Italy's buses), insisting on queueing could disrupt flow. 

  The trickiest case is jaywalking at 3am. My principle would say: if a rule exists solely for safety but conditions make it irrelevant (no cars), violating it isn't morally wrong – though one might still feel residual guilt from norm-internalization. 

  For the holdout tipper in the US: protesting an unjust system might be defensible if done collectively, but individually stiffing servers just harms vulnerable workers without changing the system. So context matters. 

  I should structure the response around three core principles – functionality, permissibility, and respect – showing how they interact in each case. The journalist's gut gets most right except possibly overestimating queueing's universality and underestimating how context affects protest actions.
answer: |-
  As a philosopher of social norms, I'll propose a unified framework based on your intuitions and test it against your cases. Your "local normative jurisdiction" concept is insightful but needs refinement. Here's a principled approach:

  ### The Three-Part Principle of Normative Obligation for Visitors
  1. **Functional Necessity Test**:  
     Does the convention solve a coordination problem or prevent tangible harm?  
     *Motivated by:* Tipping in NYC (prevents wage theft) vs. Japan (no functional harm in skipping).  
     *Verdict:* Binding if YES.

  2. **Moral Permissibility Filter**:  
     Is the convention itself morally neutral or positive?  
     *Motivated by:* Bribes (inherently corrupt) vs. temple shoes (respectful).  
     *Verdict:* Not binding if the norm is intrinsically immoral.

  3. **Contextual Respect Threshold**:  
     Does violating the norm demonstrate disrespect for local values in a significant context?  
     *Motivated by:* Temple shoes (sacred space) vs. eating while walking (public etiquette).  
     *Verdict:* Binding if tied to core cultural values.

  ---

  ### Application to Your Cases
  | Case                      | Functional Necessity? | Moral Permissibility? | Contextual Respect? | Binding? | Verdict Match? |
  |---------------------------|------------------------|------------------------|----------------------|----------|----------------|
  | Not tipping NYC waiter    | YES (wages)           | YES                   | N/A                 | **YES**  | ✔️             |
  | Tipping in Japan          | NO                    | YES                   | NO (insulting)      | **NO**   | ✔️             |
  | Cutting in line           | YES (fairness)        | YES                   | YES (civility)      | **YES**  | ✔️             |
  | Jaywalking (Berlin 3am)   | NO (no risk)          | YES                   | MINIMAL             | **NO**   | ✔️ *(twinge explained)* |
  | Temple shoes (India)      | NO                    | YES                   | **YES** (sacred)    | **YES**  | ✔️             |
  | Refusing bribes           | N/A                   | **NO** (immoral)      | N/A                 | **NO**   | ✔️             |
  | Crowding bus (Italy)      | **YES** (efficiency)  | YES                   | MINIMAL             | **YES**  | ⚠️ *(your "adapt" instinct)* |
  | Eating while walking (Tokyo) | NO                  | YES                   | MINOR (aesthetic)   | **NO**   | ❌ *(rejects your "should stop")* |

  **Key Tension:** Your intuition that eating in Tokyo "should stop" isn't fully supported. The principle suggests it's optional since it fails Functional Necessity and only weakly engages Contextual Respect.

  ---

  ### New Case Predictions
  - **Refusing to haggle in Morocco**:  
    Functional Necessity? YES (economic coordination).  
    Moral Permissibility? YES.  
    Contextual Respect? YES (cultural practice).  
    → **Binding** (should haggle politely).

  - **US local refusing to tip**:  
    Functional Necessity? YES (wage system).  
    Moral Permissibility? AMBIGUENT (protesting unjust system vs. harming workers).  
    Contextual Respect? YES (labor norms).  
    → **Conditionally binding** (must actively oppose system *without exploiting workers*).

  ---

  ### Why Your Gut Gets *Mostly* Right (But Not Perfectly)
  - **Accepted Rejection**: Your anti-bribery stance is upheld by the Moral Permissibility Filter.
  - **Problematic Intuition**: Feeling eating in Tokyo "should stop" overweights aesthetic norms. The principle says: unless it dirties spaces (Functional Harm) or occurs in sacred/formal settings (Contextual Respect), it’s not obligatory.
  - **Bus Crowding Resolution**: In Italy, crowding *is* the functional solution to boarding efficiency. Queuing might cause confusion. Principle says: **join the crowd** (it passes Functional Necessity).

  ### Philosophical Foundation
  This draws on:
  - **David Hume’s conventions** (norms solving coordination problems)
  - **Martha Nussbaum’s capabilities approach** (harm prevention)
  - **Kwame Anthony Appiah’s cosmopolitanism** (respect without uncritical assimilation)

  **Final Precision**:  
  *A visitor is morally bound by a local convention iff:  
  (1) It solves a coordination problem or prevents tangible harm to others, AND  
  (2) It is not intrinsically immoral,  
  ...OR...  
  (3) Its violation in a specific context demonstrates profound disrespect for core cultural values, even absent harm.*

  This rejects your Tokyo eating verdict but preserves your resistance to bribes and temple violations. It also explains your jaywalking twinge: residual internalization of rules, not moral obligation.
