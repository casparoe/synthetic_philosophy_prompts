  Theories that could underpin this: Pattern Completion Instinct is strong here. Humans naturally seek patterns, so seeing misfortunes as fitting a narrative satisfies that instinct. Moral Desert as Aesthetic Harmony treats justice like a satisfying story where outcomes feel right. Social Signaling uses karma as shorthand for accountability, especially in a secular context.

  Where it's underdetermined: Proportionality. Different desert theories (retributive, consequentialist, virtue-based) might all lead to the same "karma" comment. Also, Agency vs. Mechanism—whether the outcome is intentional or emergent isn't specified. The characters deny agency but enjoy the outcome, so it's the appearance of balance that matters, not how it happens.

