answer: |-
  Here's a breakdown of the implicit moral desert theory operating in your characters' habits, separating load-bearing structures from decorative elements:

  **The Core Load-Bearing Structure: The "Aesthetic of Balance"**

  1.  **Fundamental Belief: Desert Exists & Balance is Intrinsically Good:** Both characters implicitly believe that people *deserve* certain outcomes (positive or negative) based on their actions/character ("moral desert"). Crucially, they find the *appearance* of this desert being realized – the "balance" – deeply satisfying on an aesthetic and emotional level. This satisfaction is the engine driving their behavior. It feels *right*, *fitting*, or *poetic* when someone "gets what's coming to them."

  2.  **Proportionality Principle (Implicit & Flexible):** The satisfaction hinges on a perceived *fit* between the "wrong" and the "misfortune." A parking ticket wouldn't satisfy the ledger for a major betrayal; a divorce or career implosion might. This implies a principle of proportionality, but it's:
      *   **Subjective:** Defined by the observer's sense of what constitutes a "fitting" consequence, not an objective scale.
      *   **Outcome-Focused:** It cares about the *result* seeming proportionate, not the *process*. The "how" is irrelevant as long as the outcome fits the narrative.

  3.  **Pattern Recognition as Confirmation:** Humans are pattern-seeking animals. Both characters actively (brother) or opportunistically (sister) *look for* and *highlight* events that fit the "desert" pattern. Seeing these patterns confirms their underlying sense that desert *should* exist and that the world *sometimes* (or often enough) reflects it. This pattern-finding is a key source of their satisfaction ("Ah, see! There it is!").

  4.  **Schadenfreude as Emotional Payoff:** The brother's "quiet satisfaction" and the sister's smug "shrug" are forms of schadenfreude. This pleasure derives specifically from witnessing the misfortune of someone perceived as deserving it. It's the emotional reward for perceiving the "Aesthetic of Balance" being fulfilled.

  **The Window Dressing & Denial Mechanisms:**

  1.  **"Karma" / "Cosmic Justice" as Metaphorical Shorthand:** This language is *not* the load-bearing structure. It's a convenient, culturally available vocabulary to *express* the satisfaction of seeing the "Aesthetic of Balance" manifest. It points to the *feeling* of desert being fulfilled without requiring literal belief in the mechanism.
  2.  **Denial of Mechanism ("I don't *really* believe..."):** This is crucial and revealing. The denial targets the *supernatural or intentional cosmic agent* (gods, universe keeping accounts, karmic ledger-keepers). They reject the idea of a conscious, systematic force *ensuring* proportionality. Their satisfaction doesn't require this mechanism; it only requires the *outcome appearing balanced*. The denial protects them:
      *   **Intellectually:** Maintaining a self-image as rational, modern people.
      *   **Morally:** Avoiding the implication that they *desire* or *wish for* harm (even if they enjoy seeing it when it happens "naturally").
      *   **Practically:** They don't have to explain *why* balance *doesn't* always happen (which it clearly doesn't).

  **How It Survives as Pure Metaphor (Answering Your Question):**

  The "karma reflex" **absolutely survives as pure metaphor** because its core isn't theological or metaphysical belief – it's **emotional and aesthetic satisfaction derived from perceived proportional outcomes.** The metaphorical language ("karma," "cosmic justice") is simply the *label* applied to this deeply felt experience of seeing the "Aesthetic of Balance" play out. The sister can shrug and say "karma" meaning nothing more than "This bad thing happening to this bad person feels deeply fitting and satisfying to me right now," while explicitly rejecting any universe-level accounting system.

  **Where It's Underdetermined: Rival Theories Producing Identical Behavior**

  Several distinct moral desert theories could manifest identically in your characters' comments and behaviors at the *observable level*:

  1.  **Simple Retributivism vs. Consequentialist Desert:**
      *   **Retributivism:** Harm is deserved *intrinsically* as payback for the past wrong ("They hurt me, so them suffering now is just").
      *   **Consequentialist Desert:** The misfortune is good because it *deters* future wrongdoing by this person or others, or *reinforces social norms* ("This public shaming shows everyone that behavior X has bad consequences").
      *   **Underdetermined:** Both the brother (ledger) and sister (public comment) could be motivated by either. The brother feels intrinsic satisfaction in the payback *or* feels society is safer/healthier when wrongdoers suffer. The sister's comment reinforces a social norm *or* expresses a primitive sense of payback. Their outward behavior and language ("fitting," "deserved") fit both.

  2.  **Virtue Ethics Desert vs. Action-Based Desert:**
      *   **Virtue-Based Desert:** Misfortune is deserved because it reflects/reveals the person's flawed *character* ("Of *course* he crashed his fancy car, he was always reckless and arrogant"). The misfortune confirms their inherent vice.
      *   **Action-Based Desert:** Misfortune is deserved specifically as a consequence of a *particular past wrongful action* ("He cheated on his taxes, and now he's audited and fired").
      *   **Underdetermined:** The brother might note a divorce and link it to a specific betrayal *or* see it as the inevitable result of the person's general untrustworthiness. The sister might say "karma" about a scandal linked to a specific policy *or* to the politician's general corruption. The comment "they deserved it" covers both bases.

  3.  **"Natural Consequences" vs. "Cosmic Payback":**
      *   **Natural Consequences:** The misfortune is seen as the direct, foreseeable, worldly result of the person's choices/character (arrogance leads to isolation and divorce; reckless ambition leads to a downfall).
      *   **Cosmic Payback:** The misfortune is seen as imposed by some non-natural force to balance scales.
      *   **Underdetermined:** Your characters **explicitly deny** believing in Cosmic Payback. However, their *satisfaction* and the *language they use* ("karma") blur the line. The sister might genuinely see the scandal as a natural consequence of hubris, but use "karma" because it's punchy. The brother might see a car wreck as random, but its occurrence after a specific wrong makes it *feel* like payback, satisfying the Aesthetic of Balance. The observable behavior (noting it, feeling satisfaction, using the term) is identical whether they intellectually believe it's natural consequence or (despite denials) feel a whisper of something more.

  **The Implicit Theory Reconstructed:**

  > "People inherently deserve good or bad outcomes based on their actions and character. Witnessing a misfortune that appears *proportionally fitting* for a prior wrong or flaw is intrinsically satisfying and feels like the restoration of a fundamental moral order ('the Aesthetic of Balance'). This satisfaction arises from pattern recognition and schadenfreude. The language of 'karma' or 'cosmic justice' is a powerful metaphorical expression of this satisfaction and perceived balance, *not* a statement of belief in a supernatural accounting system. The denial of such a system is necessary to maintain intellectual respectability and avoid the moral discomfort of actively wishing for harm, while still allowing the enjoyment of its perceived poetic justice when it occurs."

  **In short for your characters:** They crave and delight in the *appearance* of moral balance in the universe. The "karma" reflex is the verbal celebration of that appearance. The ledger and the shrug are rituals affirming their belief in desert and their satisfaction at seeing it (seemingly) fulfilled. The denial is the fig leaf covering the potentially uncomfortable source of that satisfaction. The load-bearing parts are the belief in desert, the need for proportional fit, and the emotional payoff of seeing it; the cosmic mechanism is purely decorative window dressing they explicitly reject.
