  Here is a poem structured to embody the inversion you describe:

  **Competence, Uncomprehended**

  (Stanza I: The Darwinian Process)
  Blind pressures carve what purpose never planned,
  Shaping the shell, the wing, the camouflaged hue.
  No knowing hand directs the slow command;
  Trial births form where countless options grew.
  Survival's mark, not insight, guides the deed;
  The intricate machine, devoid of creed,
  Emerges from the winnowing of chance.
  Function arrives without a conscious glance,
  A scaffold built by iterative need.
  The coded script, unread, fulfills demand.

  (Stanza II: The Turing Inference)
  Demand fulfills, unread, the coded script;
  Need iterative built a scaffold, where
  A glance conscious without arrives function. Chance
  Of winnowing the from emerges creed
  Devoid machine, intricate the. Deed
  The guides insight, not mark survival's creed,
  Grew options countless where form births trial.
  Command slow the directs hand knowing no;
  Hue camouflaged the, wing the, shell the shapes,
  Planned never purpose what carve pressures blind.

  Summary: Both frames reverse cause and effect, finding mind's echo absent mind, or form absent plan.

  ---

  **Explanation of the Architecture:**

  1.  **Form and Argument:** The poem performs the core inversion. Stanza I describes evolution: blind pressures (natural selection) shape complex forms (shell, wing) without any guiding intelligence ("No knowing hand," "devoid of creed," "without a conscious glance"). Function ("scaffold," "demand") arises purely from iterative processes and survival.
  2.  **Precise Inversion:** Each line in Stanza II *exactly reverses the word order* of its corresponding line in Stanza I. This syntactic reversal forces a reversal in meaning:
      *   Line 1 (I): Blind pressures *cause* form. → Line 1 (II): Form *fulfills* demand (implying perceived agency).
      *   Line 2 (I): Pressures shape objects. → Line 2 (II): Objects are shaped (implying a shaper's need).
      *   Line 3 (I): No hand directs. → Line 3 (II): The slow command directs (implying a director).
      *   Line 4 (I): Trial generates form. → Line 4 (II): Form generates trial (as if testing comprehension).
      *   Line 5 (I): Survival's mark, not insight, guides. → Line 5 (II): Insight, not survival's mark, guides (attributing internal reasoning).
      *   Line 6 (I): Machine devoid of creed. → Line 6 (II): Creed... machine, intricate the (attributing belief to the mechanism).
      *   Line 7 (I): Emerges from winnowing chance. → Line 7 (II): Chance... emerges (chance presented as an agent).
      *   Line 8 (I): Function without conscious glance. → Line 8 (II): Glance conscious without arrives function (consciousness inferred *from* function).
      *   Line 9 (I): Scaffold built by iterative need. → Line 9 (II): Need iterative built a scaffold (need presented as the builder).
      *   Line 10 (I): Coded script unread fulfills demand. → Line 10 (II): Demand fulfills, unread, the coded script (demand fulfills itself via the script, implying comprehension).
  3.  **Conceptual Mapping:**
      *   **Darwin (Stanza I):** Eliminates teleological comprehension. The exquisite adaptations ("shell," "wing," "intricate machine," "scaffold") are produced solely by "blind pressures," "trial," "winnowing of chance," and "iterative need." "No knowing hand," "devoid of creed," and "without a conscious glance" explicitly deny internal understanding or design.
      *   **Turing (Stanza II):** Eliminates introspective evidence. The observer attributes comprehension ("Purposeful seams," "Command slow the," "Insight... guides," "Creed," "Conscious glance") solely based on observing the *output* and *function* ("Form births trial," "Emerges," "Arrives function," "Demand fulfills") of the system ("coded script," "machine"). The reversal forces the reader to infer the mind from the behavior/structure.
  4.  **Poetic Integrity:** While tightly structured, the poem uses evocative, concrete language ("shell," "wing," "camouflaged hue," "scaffold," "coded script," "winnowing," "iterative need") and maintains a consistent iambic pentameter rhythm (blank verse). The reversed syntax in Stanza II creates a distinct, slightly jarring, yet internally consistent poetic voice mirroring the alien logic of attributing mind to complex behavior.
  5.  **Summary Line:** Condenses the shared logic: Both theories dissociate observable competence (adaptive form, successful behavioral output) from the necessity of internal comprehension (designer's mind, subjective understanding). They both rely on a reversal of the intuitive link between complex function and conscious intent – Darwin showing function *without* prior intent, Turing showing function *implying* attributed intent. The "frames" are the explanatory models themselves, which "reverse cause and effect" relative to common intuition about mind and design.
