answer: |-
  Here's a tight 40-minute teaching arc focused on **experiential understanding**, not philosophy lectures. Prison cigarettes are the strongest example (defended below). Target misconception interventions are timed precisely.

  **Core Goal:** Teen grasps money as *real-in-context* (socially constructed) but *not arbitrary/optional* for participants (anti-eliminativist).

  **Why Prison Cigarettes?**  
  - **Stripped Down:** No states, banks, or complex tech. Pure human interaction.  
  - **Tangible Consequence:** Denial = hunger, violence, isolation. Shows *material reality*.  
  - **Emergent Rules:** Prices fluctuate based on scarcity/need (e.g., pay more for chocolate before a visit). No "hidden controller."  
  - **Closed Loop:** Perfectly shows dependency – value *only* exists *inside* the collective agreement.

  **The Arc (40 Mins):**

  1.  **Anchor: "Hallucination" Hook (5 mins)**  
      *Start:* "You called money a collective hallucination. Cool! Let's test that. If I hallucinate a $100 bill, can I buy lunch?" (Teen laughs/says no).  
      *Probe:* "So why does *this* paper work?" (Hold up cash). Let them voice "because others accept it."  
      *Dependency Established:* **Value requires collective recognition.** Write this down.

  2.  **Case Study: Prison Cigarettes (12 mins)**  
      *Set Up:* "Imagine prison. Guards give cigarettes for chores. Prisoners trade them: 10 cigs = a meal from cook, 5 cigs = laundry service."  
      *Key Questions:*  
      - "Is a cigarette *just* a cigarette here? What else is it?" (*→ Tool for survival, debt payment, status symbol*)  
      - "Who decided cigs = value? Warden? Top prisoner?" (*→ Emerged from need; no single creator*)  
      - "If new prisoner refuses cigs, says 'I'll just do favors,' what happens?" (*→ Starves; system excludes non-participants*)  
      **CRUCIAL:** Hammer *consequence*: "So is the cook 'hallucinating' when he refuses your offer to draw him a picture instead of cigs? Or is your hunger real?"

  3.  **Navigating Misconceptions (15 mins - Interrupt Rigorously!)**  
      *Trigger:* Summarize case study: "So, value exists because everyone acts like it does, creating real-world effects."  
      *MISCONCEPTION 1 (Likely @ min 5 of this segment):* **"So it IS imaginary! Just agreed-upon imagination!"**  
      *CUTOFF & PIVOT:* "Hold up. If you *don't* imagine hard enough, does the cook still feed you? (*No*). What happens if you steal cigs? Is the punishment imaginary? (*Violence is real*). **The agreement CREATES real power, hunger, safety. It's a tool, not a daydream.**"  
      *MISCONCEPTION 2 (Likely @ min 10):* **"So I can just opt out of money! Be self-sufficient!"**  
      *CUTOFF & PIVOT:* "Could our prisoner grow his own food? Make his own soap? Get medicine alone? (*No - prison restricts resources*). **Can YOU make your phone? Grow all your food? Treat your illnesses?** We depend on others. The system (cigs/money) is how we coordinate that dependence *at scale*. Opting out means abandoning society's support structure."  
      *MISCONCEPTION 3 (Likely @ min 13):* **"But someone MUST control it! Like the guards control cig supply!"**  
      *CUTOFF & PIVOT:* "Do guards set the price of a meal? What if a rumor says salt is coming, and everyone hoards cigs? Prices crash! Or if a flood wrecks the kitchen, meal prices soar! **The guards control *cigarettes*, not the *value system*. Value emerges from prisoners' needs, trust, and scarcity. No one 'controls' that.**"

  4.  **Bridging to Real Money (5 mins)**  
      *Connect:* "Prison cigs work because:  
      1.  Everyone recognizes them as valuable.  
      2.  They enable survival/trade in a closed system.  
      3.  Value emerges from need/scarcity, not decree.  
      **Real money works the SAME way, just bigger/more complex.** Banks are like cooks & laundry guys. Governments influence 'cig supply' (money printing), but can't control the *value* created by billions of trades."  
      *Contrast:* "Key difference? Scale & complexity. But the core dependency? Identical."

  5.  **End-Check: The Salt Test (3 mins - NO PHILOSOPHERS!)**  
      *Scenario:* "Imagine prisoners suddenly believe salt is super valuable (health, taste). They trade 1 salt packet = 20 cigs. Cook demands salt for meals."  
      *Questions:*  
      1.  "Is salt 'just' salt anymore?" (*→ No, it's now currency-like*)  
      2.  "Is its value 'imaginary'? Could you ignore it and get a meal with cigs if the cook wants salt?" (*→ No - value is real-in-context*)  
      3.  "What if salt is banned? Could prisoners just 'imagine' pepper is valuable instead?" (*→ Yes, BUT only if everyone agrees AND pepper solves a need. The *potential* for a system exists, but the *specific* system (salt) is real only while the agreement holds*).  
      *SUCCESS IF:* They articulate that salt has **real power** (gets food) *because* of the agreement, but the agreement itself is **fragile/dependent** and could shift (e.g., to pepper).

  **Why This Works in 40 Mins:**  
  1.  **Starts with their frame** ("hallucination"), then challenges it through consequence.  
  2.  **Single, potent example** (prison cigs) carries the entire conceptual weight by showing *emergence, dependency, consequence, and closed-loop reality*.  
  3.  **Predicts & crushes misconceptions** at the moment they arise with concrete counter-examples.  
  4.  **End-check** uses a parallel constructed example (salt) forcing them to apply the logic *without* jargon.  
  5.  **Zero philosophy namedropped.** Reality is shown through tangible needs (food, safety) and social exclusion.

  **No, the premise isn't messed up.** This arc is viable because it bypasses abstract theory and roots everything in human need, consequence, and a visceral case study. The teen will leave seeing money as a *tool* humanity built to solve cooperation problems – fragile but devastatingly real for those inside the system.
