  I'm running a session for a curious teenager who read about social construction and now thinks money is 'just a collective hallucination.' I want to teach them how money functions as a kind — specifically navigating between constructivism and eliminativism about currency — in about 40 minutes. Don't lecture me on the philosophy; plan the teaching arc: what dependency has to be in place before they can see money as real-but-dependent, the carrying example (not just 'paper bills,' maybe a closed-loop token system like prison cigarettes or a local exchange ring — pick one and defend why it carries the weight), the miscoceptions in the sequnce they'll arrive ('so it's imaginary,' 'so I can opt out,' 'so there's a hidden controller'), and exactly where to cut each off, plus one end-check that shows they've grasped the reality-without-independence idea without me citing Searle or anyone. If the premise is messed up — like if you can't teach constructivism vs eliminativism in 40 min to a beginner — tell me plainly instead of faking a plan. No bibliographies, please. There's probably a typo in here somwhere.
