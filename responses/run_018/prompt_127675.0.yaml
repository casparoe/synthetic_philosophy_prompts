  2. "So I can opt out" → Crush with closed-loop dependency (no individual escape).
  3. "Hidden controller?" → Undermine with emergent pricing examples (fluctuating salt values).

  The end-check is crucial—no philosophy jargon allowed. The "salt shortage" scenario forces them to articulate how value is *both* real (salt trades solve hunger) and constructed (no salt=system adapts). If they get that tension, they've grasped it. 

