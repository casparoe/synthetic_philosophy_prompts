  Punchline options: Someone suggests redistributing the AI's weights, but the retort is that all tips were voluntary, so no injustice. Emphasize the historical principle ("what happened") over the resulting pattern ("what is"). Use terms like "historical principle" and "pattern" to nail the distinction.

