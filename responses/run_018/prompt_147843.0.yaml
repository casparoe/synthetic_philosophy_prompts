  2. **Locality of Update**: Should only affect relevant beliefs. Preference, but important for modular reasoning. Camp preference.
  3. **No Hidden Priors**: Updates shouldn't smuggle in unwarranted assumptions. Hard constraint to maintain objectivity.

  Decision-Theoretic Constraints:
