  Cases:
  1. **Avoiding Dilation**: Dilation occurs when new evidence makes beliefs less certain, even if it's irrelevant. It's counterintuitive and undermines rational belief. Hard constraint because it violates epistemic rationality.
  2. **Respecting Second-Order Uncertainty**: Agents should be able to express uncertainty about their own evidential weights. Crucial for complex evidence like expert disagreements. Hard constraint, as ignoring it oversimplifies real-world scenarios.
  3. **Not Collapsing into Naive Averaging**: Simply averaging expert opinions ignores reliability and nuances. Must preserve distinctions between sources. Hard constraint to avoid losing critical information.

