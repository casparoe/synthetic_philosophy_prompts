  The user mentions Zhuangzi's stories - how he drummed and sang after his wife's death, and how he wanted his body left to nature without burial. This shows Zhuangzi saw death as a natural change, not something tragic. The key here is the lack of attachment to the body or self after death.

  Now, looking at the modern funeral industry: embalming, sealed caskets, legal controls over bodies, and grief counseling that treats death as trauma. This seems to rest on the idea that the self persists with the body, or that the body has lasting personal significance. There's an implicit belief in a fixed identity that death disrupts, which contradicts Zhuangzi's view of constant transformation.

  I need to reconstruct the implicit theory behind these practices. The core commitment is that the individual self is tied to the physical body, making preservation and control necessary. This justifies things like embalming and elaborate funerals as ways to honor the person.

  For compatibility: Zhuangzi's view directly opposes this by denying any special status to the body or self after death. If we adopted his philosophy, practices focused on preservation would collapse because they'd seem pointless—why preserve what's just returning to nature? However, some elements might survive on other grounds, like public health concerns for safe disposal or relational aspects like memorials, which could be reframed as celebrating life rather than mourning loss.

  I should also note that the funeral industry isn't entirely determined by one philosophy; it could coexist with other views, but Zhuangzi's stance makes many parts irrational. For example, grief counseling might shift from treating trauma to accepting change, aligning better with his ideas.

