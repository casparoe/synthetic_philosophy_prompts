answer: |-
  ### (1) Exam Question  
  **Rational Choice & Moral Risk: Final Exam**  
  **Time Allowed:** 90 minutes  
  **Word Guide:** ≈800 words  

  **Astral Triage Decision Matrix**  
  You face three policy options:  
  - **A:** *Certain Outcome*: Secure a moderate welfare improvement for 10⁶ (1 million) actually existing beings.  
  - **B:** *Long Shot*: 0.001% chance of an astronomical welfare improvement for 10³⁰ beings (e.g., a vast future population), else (99.999% chance) no change.  
  - **C:** *Dangerous Gamble*: 0.002% chance of the same astronomical improvement for 10³⁰ beings, but with a 0.001% risk of catastrophic harm (e.g., extinction-level suffering) to the original 10⁶ beings.  

  **Prompt:**  
  (i) Calculate and rank options A, B, and C *solely* by expected total welfare (assuming welfare is additive and linear).  
  (ii) Explain why this ranking qualifies as "fanatical" in the technical sense of *expected-value fanaticism*, **not** merely "surprising" or "counterintuitive."  
  (iii) Assess whether introducing a lexical constraint—**"Absolute Priority: Avoid catastrophic harm to actually existing beings at any probabilistic cost"**—blocks the fanaticism in (i) *without*:  
  - Collapsing into ordinary risk aversion (e.g., rejecting B solely for low probability);  
  - Violating the independence axiom in an *ad hoc* way.  
  Justify your assessment.  

  ---

  ### (2) Model Answer (≈700 words)  

  **(i) Expected Value Ranking**  
  Assign welfare units:  
  - A: Certain gain = *M* (moderate welfare) for 10⁶ beings → **Total EV(A) = M × 10⁶**  
  - B: 0.001% chance (p=10⁻⁵) of astronomical gain *A* (where *A* ≫ *M*) for 10³⁰ beings. EV(B) = (10⁻⁵ × *A* × 10³⁰) = **10²⁵ *A***  
  - C: 0.002% chance (p=2×10⁻⁵) of gain *A* for 10³⁰ beings, plus 0.001% chance (p=10⁻⁵) of catastrophic harm *-C* (where *|C|* ≈ *M* × 10⁶) for the original 10⁶. EV(C) = (2×10⁻⁵ × *A* × 10³⁰) + (10⁻⁵ × *-C* × 10⁶).  
  EV(C) ≈ **2×10²⁵ *A* - 10³ *C*** (since *C* is finite and *A* is astronomical, *A* ≫ *C*)  

  **Ranking: C > B > A**  
  - C > B: *2×10²⁵ A* dominates *10²⁵ A* (doubling the expected gain outweighs *-10³ C*, as *A* is astronomically large).  
  - B > A: *10²⁵ A* ≫ *M × 10⁶* (since *A* ≫ *M* and 10²⁵ ≫ 10⁶).  

  **(ii) Why Fanatical, Not Merely Surprising**  
  Expected-value fanaticism arises when negligible probabilities of vast utilities dominate decision-making, overriding *finite* but morally salient claims. Here:  
  1. **Sacrifice of Concrete Obligations**: Option C is ranked highest *despite* imposing a non-zero risk of catastrophic harm on 1 million actual beings for a *marginally* higher expected gain (0.001% more probability) than B. Pure EV treats the certain welfare of existing beings (A) and their catastrophic risk (in C) as negligible noise against cosmic stakes. This violates "minimal decency" (e.g., no justified genocide for tiny gains).  
  2. **Infinite Swamping**: The 10³⁰ scalar multiplies *A*, making probabilities as low as 0.001% "decisionally relevant" while *finite* values (e.g., *M* × 10⁶ or *-C* × 10⁶) become irrelevant. This exploits continuity axioms to permit morally grotesque trade-offs.  
  3. **Fanaticism vs. Improbability**: Rejecting B *alone* might be risk aversion. Fanaticism specifically means *leveraging* tiny probabilities of vast goods to override *prohibitive* real-world constraints (e.g., "never torture innocents for lottery tickets"). Here, C > B > A demands accepting existential threats to actual beings for cosmic gains—a hallmark of fanaticism.  

  **(iii) Assessing the Lexical Constraint**  
  The constraint **"Absolute Priority: Avoid catastrophic harm to actually existing beings"** (AP) blocks C (which risks harm) but permits B (no harm risk).  
  - **Blocks Fanaticism**: AP renders C inadmissible (even with higher EV) by lexically prioritizing harm-avoidance for current beings. This avoids C > B > A, yielding B > A > C.  
  - **Avoids Ordinary Risk Aversion**: B retains a negligible success chance (0.001%) but is permitted because it risks *no harm*. AP rejects only *harm-imposing* gambles (like C), not low-probability gains *simpliciter*.  
  - **Independence Axiom Concerns**: AP violates independence if framed as a utility threshold (e.g., "assign -∞ disutility to catastrophic harm"). But it need not be ad hoc if grounded in *structural rationality*:  
    - **Contractualist Foundation**: AP reflects a social choice constraint—"no policy acceptable if it risks devastating loss for existing persons without their consent." This is agent-relative and precludes EV comparisons that sacrifice actual beings.  
    - **Non-Arbitrariness**: AP applies *only* to catastrophic harm (not mere welfare differences) for *actually existing* beings (not possible future ones). This avoids global lexical utilities while protecting core deontic boundaries.  
  - **Limitation**: AP may seem arbitrary if "actually existing" excludes identical future beings. However, its focus on *present moral patients* as loci of inviolability offers a principled (if contestable) escape from fanaticism without abandoning EV for non-catastrophic cases.  

  **Conclusion**: AP intelligibly blocks fanaticism by introducing a lexical side-constraint grounded in agent-relative obligations, avoiding ad hoc independence violations. Its success hinges on justifying why *existing* beings warrant such priority—a task for moral, not decision-theoretic, argument.  

  ---

  ### (3) Marking Scheme (Total: 20 points)  
  **Top answers (16–20) must demonstrate:**  

  1. **Correct EV Calculation & Ranking** (3 points)  
     - ✓ Explicitly shows EV(C) > EV(B) > EV(A) due to *A*’s astronomical scale.  
     - ✘ Error: Missing EV(C)'s dominance over B (e.g., ignoring the doubled probability).  

  2. **Defining Fanaticism Beyond Surprise** (5 points)  
     - ✓ Distinguishes fanaticism (moral corruption via high-stakes low-probability trade-offs) from mere risk aversion or implausibility. Cites *sacrifice of concrete beings* and *infinite swamping*.  
     - ✘ Error: Calling the ranking "counterintuitive" without analyzing structural moral failure.  

  3. **Lexical Constraint vs. Risk Aversion** (6 points)  
     - ✓ Notes AP permits B (low-probability gain) but forbids C (harm risk), blocking fanaticism without blanket risk aversion.  
     - ✓ Justifies AP’s focus on *catastrophic harm to existing beings* as non-arbitrary.  
     - ✘ Error: Equating AP with rejecting all low-probability options (B).  

  4. **Independence Axiom Assessment** (4 points)  
     - ✓ Argues AP violates independence if modeled via utility thresholds but may be a structural constraint (e.g., contractualist pre-commitment).  
     - ✓ Rejects ad hocness if grounded in agent-relative moral theory.  
     - ✘ Error: Uncritically claiming AP "obviously" violates independence without nuance.  

  5. **Precision & Clarity** (2 points)  
     - ✓ Formal notation (e.g., *A*, *M*, *C*), explicit probabilities, and logical flow.  
     - ✘ Error: Inconsistent terminology or ambiguous reasoning.  

  **Grade Boundaries**:  
  - 18–20: Outstanding (all 5 moves, originality in (iii)).  
  - 15–17: Excellent (minor gaps in (ii)/(iii)).  
  - 12–14: Competent (errors in EV or fanaticism analysis).  
  - <12: Inadequate (misses core requirements).
