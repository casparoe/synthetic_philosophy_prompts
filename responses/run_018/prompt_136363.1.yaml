answer: |-
  ### PhD Comprehensive Examination: Philosophy of Mind  
  **Time Allowed:** 90 minutes  
  **Expected Length:** Approximately 600 words  
  **Task:** Evaluate whether a *disjunctive phenomenal concept strategy* rescues epiphenomenalism from the paradox of phenomenal judgment. The strategy posits that a concept like PAIN is disjunctive: it refers to the phenomenal quality of pain *if causally accessible*, or to its precise neural correlate *if the phenomenal quality is causally inert*. Assess whether this avoids self-undermining by addressing:  
  (i) Whether the concept can genuinely refer to the phenomenal quality rather than defaulting to the neural correlate;  
  (ii) How first-person authority is preserved if the subject cannot know which disjunct (phenomenal or neural) is activated;  
  (iii) Whether the strategy violates the causal closure of the physical domain in a novel way compared to standard epiphenomenalism.  
  Conclude by judging if the strategy succeeds, collapses into reductive physicalism, or leads to skepticism.  

  ---

  ### Model Answer (598 words)  
  Epiphenomenalism holds that phenomenal states (e.g., the raw feel of pain) are non-physical byproducts of neural processes, lacking causal efficacy. This generates a paradox for phenomenal judgment: if such states cause nothing, how can introspective reports about them be accurate? Accuracy seems to require that the phenomenal state itself causally regulates judgments about it. Yet if physical causal closure (every physical event has a sufficient physical cause) holds, neural states alone cause judgments, rendering phenomenal states explanatorily redundant. The disjunctive concept strategy aims to resolve this by redefining phenomenal concepts.  

  The strategy proposes that PAIN is a disjunctive concept: in contexts where the phenomenal quality is causally active (e.g., in reporting), it directly refers to the qualia; where it is inert (e.g., during unconscious processing), it refers to its neural correlate NCC_p. This bifurcation, proponents argue, allows judgments to be causally explained by physical states (satisfying closure) while preserving reference to phenomenal properties.  

  However, this strategy fails. First (i), the disjunct for the phenomenal quality cannot secure reference without causal contact. If qualia are epiphenomenal, they lack causal powers to fix reference. When subjects deploy PAIN intending to target qualia, the concept’s content defaults to the neural disjunct, as only NCC_p causally interacts with cognition. The disjunct for qualia is semantically empty—a dangling descriptor without causal-anchoring. Thus, PAIN reduces to a physicalist concept, defeating epiphenomenalism’s core claim that qualia are distinct.  

  Second (ii), first-person authority disintegrates. Subjects cannot introspect whether PAIN activates the phenomenal or neural disjunct, as this meta-knowledge would require causal access to the very inertness in question. If a patient reports "I am in pain," they cannot discern if this judgment is caused by qualia (per impossible) or by NCC_p. This erodes the privileged access epiphenomenalism tries to salvage: judgments become mere physical utterances, indistinguishable from those made by a zombie. The strategy thus induces a skepticism where subjects are ignorant of what their concepts denote.  

  Third (iii), the strategy violates physical causal closure more insidiously than standard epiphenomenalism. While standard epiphenomenalism posits non-physical properties that are causally irrelevant (but harmless to closure), the disjunctive concept imports non-physical content *into the causal chain of reasoning*. When subjects token PAIN under the phenomenal disjunct (even if empty), they engage in content-bearing states that lack physical determinants. This creates mental causation at the conceptual level: the *meaning* of PAIN (as partly non-physical) must causally influence inference and report, breaching closure. Standard epiphenomenalism avoids this by quarantining qualia outside cognition entirely.  

  Ultimately, the disjunctive strategy collapses into reductive physicalism. By relying on neural correlates to fix reference and causation, it eliminates the need for sui generis qualia. If phenomenal concepts are just disguised physical concepts, epiphenomenalism is abandoned. Alternatively, if the phenomenal disjunct is retained, it invites skepticism about introspection. Neither outcome saves epiphenomenalism—it either self-undermines by conceding physicalism or relocates the reference problem to an intractable ambiguity. The paradox stands: without causal efficacy, phenomenal judgments cannot be both accurate and explicable.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **A (16–20 marks)** hits all five points below. **B (12–15 marks)** addresses three or four but with gaps in nuance.  

  1. **Exclusion Premise Articulation (4 marks)**  
     - *A move:* Clearly states that physical causal closure implies neural states alone cause judgments, making phenomenal causes redundant/excluded.  
     - *No credit:* Vague appeals to "causal roles" without linking closure to exclusion.  

  2. **Disjunctive Strategy Presentation (4 marks)**  
     - *A move:* Accurately defines the disjunctive concept as switching reference between phenomenal quality (if causal) and neural correlate (if inert).  
     - *Partial credit (2 marks):* Conflates the strategy with type-identity or standard phenomenal concept views.  

  3. **Reference-Fixing Critique (4 marks)**  
     - *A move:* Argues that the phenomenal disjunct cannot fix reference due to qualia’s causal inertness, forcing default to neural content.  
     - *No credit:* Assumes reference is unproblematic without addressing causal constraints.  

  4. **Authority/Skepticism Diagnosis (4 marks)**  
     - *A move:* Shows that subjects’ ignorance of which disjunct is active undermines first-person authority, inducing skepticism.  
     - *Partial credit (2 marks):* Notes authority issues but omits how disjunct uncertainty specifically causes them.  

  5. **Closure Violation Analysis (4 marks)**  
     - *A move:* Contrasts standard epiphenomenalism’s compliance with closure against the disjunctive strategy’s novel breach via non-physical conceptual content.  
     - *No credit:* Claims closure is violated identically in both cases.  

  **A/B Differentiation:** An A answer synthesizes points 3–5 into a unified failure narrative (e.g., "Reference collapse enables physical reduction, while authority loss and closure breaches are symptoms"). A B answer treats them as isolated issues.
