prompt: |-
  So I'm in a seminar on decision theory and we keep circling back to weakness of will, but now with hyperbolic discouting mixed in, and I'm realizing my gut verdicts are kind of scattered. Here are the ones I'm pretty sure about. Classic snooze-button case: I decide at 11pm that waking at 7 is best, but at 7 I hit snooze and roll over. That's akrasia, no doubt. Same setup but I put the alarm across the room and still crawl back into bed after turning it off — still weak will, maybe even worse because I paid a higher cost to fail. Then there's the app that locks my phone until 8; I don't check social media, but I don't feel like I exercised willpower, I just outsourced it. That's okay, but it doesn't feel like the same kind of victory.

  The harder ones all involve knowing my own discount curve. There's the standard intertemporal choice: I'd pick $110 in 31 days over $100 in 30 days, but at day 30 I flip and want $100 now. I anticipate this and lock myself into the $110 contract. At day 30 I want out but can't. I don't call that weakness of will, even though my prefference reversed. But then there's this twist I made up: I anticipate the flip, and I deliberately lock myself into the $100-now option because I think my future self will be too weak to take the delayed $110. That feels like strategic self-sabotage rather than akrasia, though I'm not sure why it differs from the first pre-commitment case. And then there's my cooling-off timer: I want a cookie, I start a 10-minute protocol that doesn't just delay but actually flattens my discount rate, and after ten minutes I genuinely don't want it. I keep flip-flopping — is that real willpower, or did my preferences just shift under me? There's also the case where I set the timer but manually disable it at minute three and eat the cookie; that one I think is clearly akrasia.

  Can you lay out a principle that gets all of these, or tell me which verdict has to go? Also say what it predicts for the timer-disable case, and please be explicit about how confident you are in the principle and single out the point you're least sure of — probably the line between the two pre-commitment cases or whether the timer counts.
reasoning: |-
  Okay, let's tackle this decision theory problem. The user is struggling with categorizing different scenarios involving weakness of will, hyperbolic discounting, and pre-commitment strategies. They've presented several cases and want a consistent principle to judge them all. 

  First, I need to understand their core confusion. The user seems confident about classic akrasia cases (snooze button, alarm across the room) and outsourcing willpower (phone-locking app). The tricky parts involve: (1) pre-committing to $110 vs pre-committing to $100 (why one feels strategic and the other self-sabotage), and (2) whether the cooling-off timer constitutes genuine willpower or preference change.

  Hmm... the key distinction might lie in whether the action aligns with the agent's reflective endorsement at the time of choice. In the $110 pre-commitment case, locking in aligns with the earlier self's judgment. But locking in $100 actively overrides that judgment - it's like admitting defeat before the battle. 

  For the timer... interesting! When it works, it's not willpower but preference modulation. The willpower happens only if the user manually overrides the timer. This suggests willpower requires conscious effort against contrary desire, not just avoidance.

  The user's phrasing shows deep engagement ("strategic self-sabotage", "preferences shift under me"). They're wrestling with the philosophy-behavioral economics overlap. Probably needs this for seminar discussions, so clarity matters more than academic jargon. 

  Biggest uncertainty: Is the $100 pre-commitment really different from $110? Both involve binding future actions. But the intent diverges - one enforces long-term goals, the other capitulates to anticipated weakness. That normative difference might be crucial even if mechanically similar.

  Should emphasize that confidence is medium-high except for that precise distinction. Might need to concede that some philosophers (like Holton) would call both pre-commitments tools against akrasia, whereas the principle I'm proposing draws a line at whether you're upholding or abandoning your prior valuation.
answer: |-
  Here's a principle that captures your intuitions while resolving the tricky cases:

  **Principle: Akrasia occurs when an agent acts against their own *best judgment at the time of action*, where "best judgment" reflects their reflectively endorsed goals and values, *and* the action stems from a failure of self-regulation in the face of competing impulses.**

  **Confidence:** High (8/10) for most cases. The core distinction between *acting against current judgment* vs. *enforcing prior judgment/changing judgment* holds up well. The least confident part is distinguishing the two pre-commitment cases (discussed below).

  ### Application to Your Cases

  1.  **Snooze Button (Classic):** At 7 AM, your *best judgment at that moment* is that getting up is best (reflecting your long-term health goals). Hitting snooze acts against that judgment due to a failure of self-regulation (weakness against immediate comfort). **→ Akrasia.**
  2.  **Alarm Across Room:** Same as (1). The higher sunk cost doesn't change the *nature* of the failure at 7 AM. You still act against your current best judgment ("I should get up now"). **→ Akrasia.**
  3.  **Phone-Locking App:** At the moment of temptation (say, 7:30 AM), your *best judgment* is *still* "I shouldn't check social media now." You *don't* act against this judgment because you *can't* act. The commitment device *prevents* akrasia by removing the option to fail. It's not willpower; it's strategic avoidance. **→ Not Akrasia.**
  4.  **Locking into $110:** At Day 30, your *best judgment* might *feel* like "$100 now!" (impulsive preference). However, your *reflectively endorsed judgment* (established at Day 0 and enforced via commitment) is "$110 tomorrow is better." You are *not acting* against that reflectively endorsed judgment; the commitment device *upholds* it by preventing the akratic action. Your *impulse* is weak-willed, but your *action* (or lack thereof due to commitment) isn't akratic *in this instance*. **→ Not Akrasia (at the moment of action).** (The "wanting out" is frustrated impulse, not an akratic action).
  5.  **Locking into $100 (Strategic Sabotage):** At Day 0, your *reflectively endorsed best judgment* is "$110 in 31 days is better than $100 in 30 days." By locking into $100, you are *acting against that Day 0 best judgment*. You are *deliberately choosing a worse outcome* because you anticipate a *future failure of self-regulation*. This is a *present* act of self-sabotage based on predicted *future* akrasia. **→ Not Akrasia *at the locking-in moment* (it's a strategic, if flawed, choice), but it *anticipates future akrasia*.** *(This distinction is the point of lowest confidence - ~6/10. One could argue the "locking into $100" action itself is akratic against the Day 0 judgment, making it similar to (1). However, the intentionality ("I do this *because* future-me will fail") feels more like a tragic strategic choice than a simple failure of self-control in the moment.)*
  6.  **Cooling-Off Timer Works:** At T=0, your best judgment is "I shouldn't eat the cookie now, wait 10 min." You initiate the timer. After 10 minutes (T=10), your *best judgment has genuinely changed* due to the physiological/psychological effect of the timer ("I don't want the cookie now"). You act *in accordance* with your best judgment at T=10. There was no moment where you *acted* against a current best judgment. **→ Not Akrasia.** (It's preference modulation/successful self-regulation strategy, not willpower exertion).
  7.  **Timer Disabled at 3 Min:** At T=3, your *best judgment* (established at T=0 and likely still held reflectively) is "I should wait until the timer finishes." You *act against that judgment* by manually disabling the timer due to a failure of self-regulation against the immediate cookie impulse. **→ Akrasia.**

  ### Key Distinctions Clarified

  *   **Akrasia vs. Commitment:** Akrasia requires *acting* against your *current* best judgment. A commitment device *prevents* you from *acting* on an impulse that *would* be akratic, thereby *upholding* your prior (and reflectively endorsed) judgment. It outsources enforcement.
  *   **Akrasia vs. Preference Change:** If your underlying preference/judgment *genuinely changes* before you act (like the successful timer cooling your desire), acting on the new preference isn't akratic. Akrasia requires a *conflict* between action and contemporaneous judgment.
  *   **Strategic Sabotage vs. Pre-Commitment (The Tricky Bit):**
      *   Locking into $110: *Upholds* your Day 0 reflectively endorsed best judgment ("$110 better") against a predicted future impulse.
      *   Locking into $100: *Violates* your Day 0 reflectively endorsed best judgment ("$110 better") *because* you predict a future failure (akrasia). It's a present choice to accept a worse outcome based on anticipated weakness. It's not akrasia *itself* (it's a deliberate, if pessimistic, choice), but it *acknowledges* the expectation of future akrasia. *(Least confident point: Is this Day 0 choice itself akratic against the Day 0 judgment? The principle says "No" because the choice *is* the action aligned with a (flawed) judgment of necessity, but the line is thin.)*
  *   **The Timer-Disable Case:** Clearly fits the principle: Action (disable timer) directly contradicts best judgment at the time of action ("should wait").

  ### Prediction for Timer-Disable Case

  As stated in (7) above: **Akrasia.** The principle clearly identifies it as acting against your current best judgment ("wait for the timer") due to a failure of self-regulation (cookie impulse).

  ### Summary of Confidence & Uncertainty

  *   **High Confidence (8/10):** The core definition (acting against *current* best judgment due to self-regulation failure) cleanly handles Cases 1, 2, 3, 4, 6, and 7. The distinction between akrasia and genuine preference change (timer working) is solid.
  *   **Lower Confidence (6/10):** Distinguishing the two pre-commitment cases (Locking $110 vs. Locking $100). The principle *does* distinguish them based on whether the commitment *upholds* (Lock $110) or *violates* (Lock $100) the *reflectively endorsed judgment at the time of commitment*. However, one could argue Locking $100 *is* akratic *at Day 0* against the judgment "$110 is better." My principle leans towards calling it a *different kind of failure* (strategic surrender anticipating akrasia) rather than akrasia itself. This is the most philosophically debatable point.
  *   **Timer "Victory":** The principle confirms your intuition: The successful timer case (6) is **not** willpower or akrasia; it's a successful strategy that changes your underlying preference, so no conflict arises.

  This principle emphasizes the *temporal location* of the judgment being violated and the *action* taken, separating it from preference changes, strategic choices (even bad ones), and the effects of commitment devices. The line between strategic pre-commitment ($110) and strategic surrender anticipating weakness ($100) remains the most nuanced boundary.
