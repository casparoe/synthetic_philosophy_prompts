prompt: |-
  hey im running our schools philosophy club next thursday and i want to explain knowing how vs knowing that to like eight other kids. dont just explain it to me—i need the teaching plan. whats the right order to build it in so they dont just think its skills vs facts? for the main example im thinking of using knowing how to prompt an ai well vs knowing that it uses transformers—does that work or is it too weird? what misconceptions should i expect, like that knowing how is just hidden knowing that or that ai has real knowing how? and exactly where do i head those off? also what quick check can i ask at the end to see if they actually got the distinction, and whats too deep (maybe Ryles regress?) that i should skip and admit i cant cover? if my framing is totally off or im mixing up the concepts, just tell me straight—dont be polite and go with a bad premise.
reasoning: |-
  Okay, the user is running a philosophy club for school and needs a teaching plan on "knowing how vs knowing that." They're targeting eight kids and want to avoid oversimplifying it as skills vs facts. The main example they're considering is prompting AI vs understanding transformers. 

  First, I need to validate their AI example—it's actually brilliant because it makes an abstract concept tangible for Gen Z. The contrast between practical prompting (knowing how) and technical knowledge (knowing that) is sharp. But I should warn them that AI doesn't truly "know how"—it's just simulating competence, which is a perfect segue into deeper philosophical implications later.

  Their worries about misconceptions are spot on. The biggest traps will be: 
  - Reducing "knowing how" to subconscious "knowing that" (Ryle's target) 
  - Anthropomorphizing AI (gotta crush that early) 
  - Thinking this is just skill vs theory. Need to emphasize that "knowing how" isn't always teachable as rules—like why "show don't tell" works in writing but can't be fully explained.

  For structure, I'll suggest starting concrete (bike riding) to hook them, then pivot to their AI example to modernize it. Must explicitly debunk misconceptions at each stage: when introducing the definitions, during the AI case, and when summarizing. 

  The quick check should force application: "If I learn all chess rules but suck at playing, what's missing?" If they say "knowing how," we're golden. But no tangles with Ryle's regress—just name-drop it as "there's a rabbit hole here about infinite rules" if someone asks.

  User's framing is solid. Only tweak is stressing that "knowing how" resists full verbalization. And maybe add a physical demo like juggling to make it visceral. Their self-awareness about avoiding bad premises is reassuring—they'll handle pushback well.

  Final note: Keep it lean. Eight teens will tap out after 40 mins. Hammer the AI example they care about, then bail before regress arguments.
answer: |-
  Here's a battle-tested teaching plan for your philosophy club. It's structured to build understanding sequentially, directly addresses your AI example (which **works great**), targets key misconceptions, and includes a quick check.

  **Core Goal:** Show that "knowing how" (procedural knowledge) is fundamentally *different in kind* from "knowing that" (propositional knowledge), not just a subset of it.

  **Time:** ~45 mins (Adjustable)

  **Materials:** Whiteboard/flipchart, markers, a simple prop like a ball (for juggling demo).

  ---

  ### The Plan (Order Matters!)

  1.  **Hook: The Bike Ride Paradox (5 mins)**
      *   Ask: "Raise your hand if you know *that* riding a bike involves balancing, pedaling, and steering?" (Everyone raises hand).
      *   Ask: "Now, raise your hand if you can actually *ride* a bike confidently right now?" (Some hands go down).
      *   **Point:** "So, knowing *that* something is true about bike riding isn't the same as knowing *how* to actually do it. Today we explore why."

  2.  **Define the Terms Clearly (5 mins)**
      *   **Knowing That (Propositional Knowledge):** Knowing *facts*, *truths*, *information*. "I know *that* Paris is the capital of France." "I know *that* 2+2=4." **Write on board: "Knowing THAT: Facts, Truths, Information (Can be stated clearly)"**
      *   **Knowing How (Procedural Knowledge):** Knowing *how to perform an action*, *how to do something skillfully*. "I know *how* to ride a bike." "I know *how* to speak Spanish." "I know *how* to bake a cake." **Write on board: "Knowing HOW: Skills, Abilities, Performances (Shown through action)"**
      *   **Emphasize:** "Knowing how" isn't *just* about physical skills (like riding a bike). It can be mental skills too (like solving puzzles, having a conversation, writing a story).

  3.  **Your Killer AI Example (10 mins - This is KEY)**
      *   **Setup:** "Let's talk about something modern: AI tools like ChatGPT."
      *   **Knowing THAT (Transformer Knowledge):**
          *   "Imagine you studied AI deeply. You know *that* ChatGPT uses a 'transformer architecture'. You know *that* it predicts the next word based on statistical patterns in massive datasets. You know *that* it doesn't understand meaning like we do."
          *   **Write:** "Knowing THAT AI: Transformers, word prediction, statistical patterns, no real understanding."
      *   **Knowing HOW (Prompting Skill):**
          *   "Now, imagine someone else. They might not know *any* of those technical facts. But they've practiced a lot. They know *how* to write a prompt to get a great poem, *how* to tweak it to fix a boring answer, *how* to structure a prompt to get step-by-step reasoning, *how* to avoid getting nonsense answers."
          *   **Write:** "Knowing HOW AI: Writing effective prompts, iterating, getting desired outputs, avoiding pitfalls."
      *   **Contrast:** "Person A knows tons *about* the AI (Knowing THAT). Person B knows *how to use* the AI effectively (Knowing HOW). They are very different kinds of knowledge. One isn't just hidden facts of the other!"

  4.  **Addressing Misconceptions HEAD-ON (10 mins - CRITICAL SECTION)**
      *   **Misconception 1: "Knowing How" is just hidden "Knowing That".** (Ryle's main target!)
          *   "Some people think knowing *how* to ride a bike just means you have a bunch of hidden facts *in your head* about balance and pedaling that you automatically follow. But is that true?"
          *   **Counter:** Ask: "Can you *tell me* all the exact muscle movements, weight shifts, and balance calculations you make per second while riding? Can you write down *all the rules*?" (No!).
          *   **AI Connection:** "Can the person who's great at prompting write down a *perfect, complete set of rules* that *always* works for *every* situation with the AI? Or is there intuition, practice, and adaptation involved?" (The latter!).
          *   **Conclusion:** Knowing *how* involves skills, habits, and intuitions that often *cannot* be fully reduced to a list of facts or rules you consciously know *that* are true. It's embodied or practiced knowledge.
      *   **Misconception 2: AI has real "Knowing How".**
          *   "Does the AI itself *know how* to write a poem? Or does it just *simulate* knowing how based on patterns?"
          *   **Counter:** "Remember, it only predicts the next word statistically. It doesn't *understand* the request, the artistry of poetry, or why one prompt works better than another. It follows complex rules (Knowing THAT) programmed into it and learned from data. The *knowing how* is entirely in the *human user* who skillfully guides it. The AI *outputs* the result of a skill (prompting), but doesn't *possess* the skill itself."
      *   **Misconception 3: This is just "Skills vs Facts".**
          *   "It's deeper than that! Skills often *rely* on some facts (you need to know *that* pedals exist to ride a bike), but the core ability (the *how*) is something extra. Crucially, you can know *all* the facts *about* something (like AI transformers) and still lack the *skill* to use it well (prompting). And you can have the *skill* (prompting) without knowing the underlying facts (transformers)."

  5.  **Why Does This Distinction Matter? (5 mins)**
      *   "It changes how we think about learning, intelligence, and even what minds are! It shows that intelligent behavior isn't *just* about having facts in your head and following rules. Much of what makes us capable comes from practiced abilities and skills that aren't easily put into words."
      *   "Think about: Learning a language (grammar rules vs fluency), playing an instrument (music theory vs performance), diagnosing an illness (medical facts vs clinical judgment)."

  6.  **Quick Check for Understanding (5 mins)**
      *   **The Chess Test:** "Imagine someone memorizes *every single rule* of chess, *every* recorded opening move, and *every* endgame strategy from a book (Knowing THAT). They know *all the facts*. But when they sit down to play, they constantly make terrible moves and lose to a more experienced player who *feels* the game. What kind of knowledge is the second player using that the first lacks?" **(Answer: Knowing HOW - the practical skill/tacit understanding of strategy, timing, board awareness).**
      *   **The Juggling Test (Use the prop):** Hold up a ball. "I can tell you *that* juggling involves throwing objects in arcs and catching them alternately (Knowing THAT). Does that mean you now know *how* to juggle?" **(Answer: Obviously not!).**
      *   **Listen For:** Clear use of "knowing how" vs "knowing that" in their explanations. If they say "skills vs facts," gently push: "But *why* is the skill different? Can you always explain the skill perfectly with facts?"

  7.  **What to Skip (The Rabbit Holes)**
      *   **Ryle's Regress:** This is the deep end. *Briefly* acknowledge it exists if someone asks: "Ryle argued if knowing *how* was just knowing *that* (rules), you'd need another rule for *how* to apply the first rule, and another for that rule, forever! He thought this proved knowing *how* is fundamental." **Don't try to explain it deeply.** Say: "It's a fascinating but complex argument – maybe for another session if you're interested!"
      *   **Deep Dive into AI Consciousness:** Avoid getting stuck on whether AI *could* ever have real "knowing how." Stick to current AI as pattern-matching systems without understanding.
      *   **Epistemological Debates:** Skip detailed arguments about justification for "knowing that" (traditional JTB theory). Focus purely on the distinction itself.

  **Why Your Framing Works & Key Adjustments:**

  1.  **AI Example is PERFECT:** It's modern, relatable, clearly separates the two types of knowledge, and effectively counters the "hidden knowing that" misconception. **Use it confidently!**
  2.  **Misconception Timing:** Address the "hidden knowing that" myth **immediately after defining the terms** and **again when using the AI example**. Crush the "AI has real knowing how" myth **during the AI example discussion**. Tackle "skills vs facts" explicitly in the misconception section.
  3.  **Clarity over Completeness:** Focus on making the *distinction* clear and intuitive. Don't get bogged down in all philosophical nuances. The bike and AI examples are your anchors.
  4.  **Emphasis:** Hammer home that "knowing how" often **cannot be fully captured or taught solely by stating facts or rules**. This is the core insight against the "hidden knowing that" view.

  **Straight Talk (As Requested):** Your premise is **spot on**. You've grasped the core distinction and chosen an excellent, engaging example (AI prompting vs transformer knowledge) that directly illustrates Ryle's point and tackles modern misconceptions. Your awareness of the potential pitfalls (like anthropomorphizing AI or reducing 'how' to hidden 'that') shows you understand the territory. This plan leverages your strengths.

  **Good luck with the club!** Encourage questions and debate – that's the heart of philosophy. Be ready to re-explain the core distinction using the bike and AI examples whenever confusion arises. You've got this!
