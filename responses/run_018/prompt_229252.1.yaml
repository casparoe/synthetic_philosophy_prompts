prompt: |-
  I'm a PhD student working on practical rationality and I've been stuck on this argument for a chapter of my thesis, so apologies in advance for the length. Everyone knows the hitchhiker setup: you're stranded in the desert, a driver will rescue you only if she believes you'll pay her £100 once you're safely home, and she's a good enough judge of character that you can't fake it. Here's the argument I've built out of it, and it seems to prove way too much.

  (1) For a purely self-interested agent, an act is rational iff it serves the agent's interests at least as well as any available alternative.
  (2) Once you're safely home, paying the driver costs you £100 and gains you nothing.
  (3) So paying is irrational.
  (4) But only people genuinely disposed to pay get rescued; the resolute non-payer is left in the desert.
  (5) So the disposition to pay -- a disposition to perform an act that (3) classifies as irrational -- is one a self-interested agent should rationally want to have.
  (6) Generalising: whenever possessing a disposition is advantageous, self-interest requires acquiring it, even where exercising it would be irrational by (1).
  (7) Now my friend's variation, which is where it all goes wrong for me. A wealthy eccentric will give you £10 million tonight if at midnight you genuinely intend to burn down your neighbour's shed at noon tomorrow. You'll be paid either way; nobody will stop you tomorrow; and at noon tomorrow burning the shed would be pointless, costly, and horrible for everyone involved.
  (8) By (6), self-interest requires making yourself genuinely so disposed. But a disposition isn't genuine unless it's the kind that would actually issue in the act. So by noon tomorrow, rationality has installed in you a commitment to do a thing that (2)-style reasoning condemns.
  (9) And now the machinery licences anything: dispositions to retaliate when retaliation is futile, to honour threats when carrying them out is ruinous, to never back down in a negotiation. Any disposition whose mere possession someone will reward, however monstrous the acts it produces.
  (10) But self-interest surely can't require me to turn myself into someone who burns sheds for nothing.

  Which step do I reject? If I have to choose, I'd rather keep (1) through (3) -- I like the clean verdict that paying is irrational while being a payer is rational -- than accept that rationality can demand shed-burning. But I suspect the clean verdict is exactly what's doing the damage, and I can't locate where. If the argument is valid, tell me which premise costs least to abandon and what I'm actually paying for it; if it isn't, tell me where the slide happens and why (6) looked like an innocent generalisation of (5) when it apparently isn't.

  Please answer in British English.
reasoning: |-
  Okay, let me tackle this PhD student's problem with the rationality argument. They're working on practical rationality and have built an argument from the hitchhiker scenario that seems to lead to absurd conclusions, like burning a shed for no reason. The key steps are laid out clearly, and I need to identify where things go wrong.

  First, looking at the hitchhiker setup: paying after rescue seems irrational by self-interest (step 3), but having the disposition to pay gets you rescued (step 5). The generalization in step 6 says self-interest requires acquiring any advantageous disposition, even if exercising it is irrational. Then the shed-burning variation (step 7) applies this: getting £10M for intending to burn the shed, but actually burning it would be pointless and harmful. Step 8 says you must make yourself disposed to burn it, leading to monstrous acts (step 9), which contradicts self-interest (step 10).

  The student wants to keep steps 1-3 but avoid endorsing shed-burning. The core conflict is between act-based rationality (step 1) and disposition-based rationality. The problem seems to be in step 6's generalization. Step 5 is specific to the hitchhiker case where the disposition is stable and the act is irrational only in a later context. But step 6 ignores that the disposition must be credible to work, and in the shed case, it's unclear how you maintain a "genuine" intention without actually planning to act.

  I think the flaw is in assuming that rationality can coherently demand forming a disposition you know you'll later reject. At midnight, when the eccentric pays you, you must genuinely intend to burn the shed. But by noon, you'll see it as irrational. How can you form that intention knowing it's irrational tomorrow? That seems like a self-undermining state. This is different from the hitchhiker case where the disposition (like honesty) doesn't require you to act against your interests at the time of disposition-formation.

  The student mentioned British English, so I'll use "disposition" and "whilst" where appropriate. The key is to show that step 6 isn't a valid generalization because the hitchhiker disposition is dynamically stable (you'd pay even knowing the cost), whilst the shed-burning disposition isn't (you can't sustain the intention once the reward is secured). Thus, rejecting step 6's broad claim while keeping steps 1-5 intact. The cost is modifying the "clean" view to acknowledge that some advantageous dispositions aren't rationally formable if they require self-deception or inconsistency over time.
answer: |-
  Right, let's crack this nut. Your argument is cleverly constructed, but the slide happens between (5) and (6), and the culprit is the ambiguity in "genuinely disposed" – crucially, *how that disposition functions over time and under rational scrutiny*. Step (6) looks like an innocent generalisation of (5) but smuggles in a fatal assumption that doesn't hold universally.

  Here's the breakdown, keeping your preferred (1)-(3) intact:

  1.  **Reaffirming the Hitchhiker Core (Steps 1-5):** Your analysis here is sound for that specific case.
      *   (1) Your act-based criterion for self-interested rationality is standard.
      *   (2) & (3) Paying *ex post* is indeed irrational by (1). It costs £100 with no benefit.
      *   (4) & (5) Possessing the disposition (e.g., honesty, or a specific commitment device like "I always pay my debts") *is* advantageous *ex ante*. Crucially, this disposition is **stable under rational reflection at the time of action**. When the driver assesses you, she looks for someone who will *still* consider paying the right thing to do *when the time comes*, even knowing it costs £100. The disposition incorporates the *ex ante* benefit (rescue) into the agent's reasoning *at the time of action*. The rational payer pays *because* not paying would undermine the type of disposition that got them rescued in the first place, and they value being that kind of person *for precisely those future benefits*. The irrationality of the isolated act is *overcome* by the value of maintaining a beneficial, identity-constituting disposition. So, for the payer *at the moment of paying*, paying *is* rational by (1) – it serves their interest in maintaining their beneficial disposition and the future opportunities it brings. It *isn't* "performing an act that (3) classifies as irrational" *from their own perspective at that moment*; (3) only classifies paying as irrational for someone who *lacks* that disposition or its rationale.

  2.  **The Flawed Generalisation (Step 6):** Step (6) says: "whenever possessing a disposition is advantageous, self-interest requires acquiring it, even where exercising it would be **irrational by (1)**." This is where it goes wrong.
      *   The hitchhiker case works because the disposition, once acquired, *makes the act rational when performed* (as argued above). The "irrationality" in (3) applies *only* to an agent *without* the disposition. The disposition *changes* the rational calculation at the time of action by including the value of consistency and future credibility.
      *   Step (6) incorrectly assumes that the advantageous disposition's exercise *remains* irrational by (1) *even for the agent possessing it*. It treats the disposition as something *external* that forces you to do an act you *still* recognise as irrational *at the time of acting*. This is *not* true of the stable, rational disposition in the hitchhiker case. Step (6) illicitly generalises the *appearance* of irrationality from the *external* perspective (like the non-payer's view of the payer) to the *internal* perspective of the agent *with* the disposition at the moment of action.

  3.  **Why the Shed Case Explodes (Steps 7-10):** The shed case exposes the flaw in (6)'s assumption.
      *   (7) The wealthy eccentric pays for a *genuine intention at midnight* to burn the shed at noon.
      *   (8) Applying the flawed (6): Self-interest requires making yourself "genuinely disposed" to burn the shed. But what does "genuine disposition" mean here? Crucially, it requires that *at midnight*, you form an intention that you believe *will actually cause you to burn the shed at noon*.
      *   **The Fatal Problem:** How can a rational agent, *at midnight*, genuinely form an intention to do something they *know* will be pointless, costly, and horrible *at noon*? To form the intention *now*, you must believe that *when noon comes*, you will (or should) follow through. But you also know *now* that *when noon comes*, burning the shed will serve no self-interested purpose whatsoever – it won't get you the £10M (already secured), it won't affect future eccentric payouts (no indication of this), it only causes harm. A rational agent *at midnight* cannot *sincerely* believe that burning the shed *at noon* will be rational or worthwhile *at noon*. The intention is inherently unstable under rational reflection *across time*.
      *   Unlike the hitchhiker disposition (which becomes part of the reason *for* acting), the shed-burning intention *cannot* be integrated into rational self-interest at the time of action. There is *no* stable disposition that a rational agent can form at midnight which will both:
          *   Be "genuine" enough to secure the £10M (i.e., involve a current commitment to act later).
          *   Actually cause the action later *for reasons that make sense to the agent at that later time*.
      *   You might *try* to form the intention, but rational reflection *before noon* will inevitably undermine it because you know the act serves no future interest. You cannot rationally *bind* your future self to an act you know your future self will see as disastrous, with no mechanism (like reputation or self-conception being damaged *in a way that affects future interests*) to make that binding stick. The "disposition" required is not rationally formable by a self-interested agent without self-deception or irrationality *at the time of formation*.
      *   Therefore, (9) does *not* follow. The machinery *doesn't* license "anything". It only licenses dispositions where the act, *when performed*, can be rationalised *by the agent at that time* as serving their interests (like maintaining a valuable reputation, deterring threats, or upholding a self-conception that yields benefits), as in the hitchhiker or retaliation cases. Dispositions demanding acts that are *purely* costly with *no* conceivable future benefit *at the time of action* cannot be rationally formed or sustained. (10) is correct: self-interest cannot require turning yourself into a shed-burner because it's incoherent for self-interest to demand you create a state (the genuine intention) that requires you to believe something (that burning the shed will be rational/beneficial later) that you know to be false.

  **The Verdict:**

  *   **Reject Step (6).** It’s the premise that costs least to abandon and is doing the damage. It mischaracterises the hitchhiker case and fails as a general principle.
  *   **What you pay for ditching (6):** You lose the *apparent* neatness of saying "exercising the disposition is irrational *by (1)*". You must acknowledge that the disposition in the hitchhiker case *alters the rational status of the act itself* for the agent possessing it. Paying *is* rational for the disposed agent *at the time of paying* because it serves their interest in maintaining their beneficial character trait/reputation. The "irrationality" in (3) only applies to the *non*-disposed agent contemplating the act in isolation.
  *   **Why (6) looked innocent:** Because in the hitchhiker case, *from the perspective of the agent without the disposition* (or only considering the moment of payment in isolation), paying *looks* irrational. Step (6) mistakenly codifies this *external* appearance as a universal truth about the disposition's exercise, even for the agent who possesses it rationally. The shed case reveals that for a disposition to be rationally acquirable *and* exercisable, it must be stable – the act it prescribes must be capable of being seen as rational *by the agent when they perform it*.
  *   **The Solution:** Refine your model of rationality for self-interested agents to incorporate **temporal stability and self-binding**. A rationally desirable disposition isn't just one that's advantageous *now*; it must be one that the agent can rationally maintain and whose prescribed actions can be rationalised *when performed*, given the agent's knowledge and interests *at that future time*. The hitchhiker disposition passes this test; the shed-burning disposition does not. Self-interest cannot rationally demand incoherence across time.

  This preserves your clean core for the hitchhiker (paying *ex post* is irrational only for the non-disposed; being disposed is rational and makes paying rational *for the disposed agent*) while blocking the slide into monstrous conclusions. The key insight is that "genuine disposition" in contexts of commitment and self-interest implies *rational stability over time*, not just a momentary state that inevitably collapses.
