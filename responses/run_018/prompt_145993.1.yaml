prompt: |-
  I am currently enrolled in a graduate seminar on philosophy of archaeology and social ontology, and I have become puzzled by a persistent asymmetry in how our discipline institutionally frames rapid societal transformation. In archaeological funding proposals, heritage-site assessments, and peer-reviewed journal guidelines, the sharp decline of palace economies, cuneiform literacy, and long-distance exchange networks in the eastern Mediterranean around the twelfth century BCE, together with the cessation of moai construction and the restructuring of social hierarchy on Rapa Nui, are routinely categorized as collapse events—phenomena treated as failures that require causal explanation. By contrast, the Classic Maya lowland abandonment of monumental architecture, the dissolution of divine kingship, and the fragmentation of exchange networks are typically labeled political reorganization, demographic realignment, or systemic transformation, with explicit editorial norms in several venues discouraging the term collapse for this case, despite the structural parallels in centralization loss, elite literacy disappearance, and network contraction.

  What philosophical commitments about societal identity over time, the criteria for institutional failure, and the boundary between descriptive and normative evaluation does this differential labeling practice presuppose? Must it assume an essentialist ontology in which a society can die when its defining institutions vanish, or can a functionalist or relational account explain the asymmetry by treating Bronze Age and Rapa Nui societies as constituted by specific hierarchical functions whose disappearance amounts to dissolution, while treating Maya society as constituted by broader cultural relations that persist through institutional change? Is the practice compatible with the anthropological claim that societies never truly fail but merely change form, or does it implicitly rely on a teleological benchmark of socio-political complexity? Furthermore, if the underlying framework were replaced by one that treated all three cases uniformly as non-normative systemic change—without any presumption of failure—what specific revisions would be required in archaeological reporting norms, grant-evaluation rubrics, and museum narrative design?
reasoning: |-
  Okay, the user is in a graduate seminar on philosophy of archaeology and social ontology. They're puzzled by the asymmetry in how archaeology labels societal transformations. Specifically, they notice that events like the Late Bronze Age collapse and Rapa Nui's changes are called "collapse," while similar changes in the Classic Maya case are termed "reorganization" or "transformation." They want to know the philosophical commitments behind this labeling difference and what changes would be needed if we treated all cases uniformly as non-normative systemic change.

  First, I need to unpack the philosophical assumptions. The user mentions essentialist ontology versus functionalist or relational accounts. Essentialism would see societies as defined by key institutions; if those disappear, the society "dies." For the Late Bronze Age, palaces and writing systems were core, so their end is a collapse. But for the Maya, even though monumental architecture and kingship ended, cultural practices like agriculture or kinship might persist, so it's seen as reorganization. That's a relational approach where identity persists through institutional changes. Also, there's a teleological angle. Western archaeology might view centralized states as the pinnacle, so their fall is a failure. But the Maya case is often framed as adaptation, avoiding the negative label.

  The user also asks if this asymmetry conflicts with the anthropological view that societies don't fail but change form. The current practice does conflict because "collapse" implies failure and finality, while anthropology emphasizes continuity. The labeling might be influenced by Eurocentric biases. The Bronze Age collapse affected areas tied to Western classical origins, making it more salient. Rapa Nui's narrative is often cautionary, focusing on ecological doom, whereas Maya descendants are present, highlighting continuity.

  Then, the user wants to know what revisions would be necessary if we shift to a uniform non-normative framework. In archaeological reporting, terms like "collapse" would be replaced with neutral terms. Grant evaluations should remove normative criteria and focus on mechanisms of change. Museum narratives need co-creation with descendant communities to present changes as part of societal dynamics, not decline.

  I should also consider deeper needs. The user might be looking for a critique of disciplinary biases and seeking ways to decolonize archaeological practice. They might want actionable steps to promote equity in interpretation and involve indigenous perspectives. Highlighting the ethical implications of language choices and the importance of diverse voices in shaping narratives is crucial here.
answer: |-
  This asymmetry reveals profound philosophical commitments about societal identity, institutional failure, and the entanglement of description with normative evaluation. Let's break down the presuppositions and potential revisions:

  **Core Philosophical Commitments Presupposed by the Asymmetry:**

  1.  **Essentialist Ontology of Societal Identity (in Collapse Cases):**
      *   **Presupposition:** Societies like the Late Bronze Age Eastern Mediterranean polities or Rapa Nui are defined by *specific, centralized institutions* (palaces, divine kingship, monumental construction regimes, elite literacy). The disappearance of these *defining features* constitutes the "death" of that specific society.
      *   **Contrast (Maya):** Maya society is implicitly defined *relationally* or *culturally* (language, agricultural practices, kinship structures, underlying cosmological beliefs). Since these persisted (albeit transformed) after the Classic period institutional changes, the society is seen as enduring through "reorganization." Essentialism applies to specific institutions, not the societal whole.

  2.  **Teleological Benchmark of Complexity:**
      *   **Presupposition:** There is an implicit benchmark of socio-political complexity (centralization, monumentality, elite literacy, large-scale exchange) against which change is measured. The loss of these features *from a previous high point* is interpreted as "collapse" or "failure." This benchmark is often unconsciously derived from Western historical narratives valuing state-level organization.
      *   **Contrast:** The Maya Postclassic period, while different, may not be evaluated *against* the Classic peak in the same teleological way. Its changes are framed as adaptations or shifts *within* a continuum, avoiding the "decline" narrative. Rapa Nui and the LBA are measured against their peak complexity, judged to have "fallen."

  3.  **Normative Evaluation Masquerading as Description:**
      *   **Presupposition:** The terms "collapse" and "failure" are inherently normative. Their application implies the change was *negative* – a loss of order, sophistication, or "success." This presupposes a value judgment about what constitutes a "successful" society (usually equated with complexity, monumentality, centralization).
      *   **Contrast:** Terms like "reorganization," "realignment," or "transformation" are presented as more neutral, descriptive terms, avoiding the negative connotations. This implicitly absolves the Maya case (or similar cases labeled this way) from being judged a "failure."

  4.  **Institutional Functionalism (in Collapse Cases):**
      *   **Presupposition:** Societies labeled as collapsing are viewed primarily through a functionalist lens. The *specific functions* performed by the central institutions (palace redistribution, centralized monument construction, elite scribal administration) are seen as *constitutive* of the society itself. When these functions cease, the society dissolves.
      *   **Contrast (Maya):** A more relational view prevails. The societal whole is seen as larger than its specific Classic-period institutions. Functions shifted (e.g., trade routes changed, political power decentralized, new forms of leadership emerged), but the underlying societal fabric (cultural identity, population, core practices) is seen as persisting, facilitating the "reorganization" label.

  5.  **Conflict with Anthropological Relativism/Processualism:**
      *   **Presupposition:** The asymmetry *does* conflict with a core anthropological principle that societies constantly transform and that "failure" is an external, often ethnocentric judgment. Labeling specific changes as "collapse" implicitly rejects the idea that societies merely "change form."
      *   **Explanation:** The practice relies on the teleological benchmark and essentialism regarding specific institutions. It implicitly argues that the *degree* or *nature* of change in "collapse" cases (loss of literacy, monumentality, centralization) represents a fundamental rupture constituting dissolution, not just transformation.

  6.  **Epistemic Biases & Colonial Legacies:**
      *   **Presupposition:** The asymmetry may reflect deeper biases:
          *   **Eurocentrism:** The LBA collapse directly impacted the perceived ancestors of "Western Civilization" (Greece, Anatolia, Levant), making its "fall" more salient and tragic in Western scholarship.
          *   **Island Biogeography/Determinism:** Rapa Nui fits a powerful (often oversimplified) narrative of isolated ecological catastrophe, reinforcing the "collapse" trope.
          *   **Continuity Perception:** Visible cultural and linguistic continuity of Maya peoples into the present makes labeling their past changes as "collapse" feel incongruous to many archaeologists. This continuity is less immediately obvious or emphasized for the LBA Eastern Mediterranean or pre-European Rapa Nui.
          *   **Editorial/Peer Pressure:** Norms within sub-disciplines (e.g., Mayanists vs. Mediterranean Archaeologists) solidify these distinctions, sometimes reflecting historical disciplinary traditions rather than purely ontological reasoning.

  **Revisions Required for a Uniform Non-Normative Framework ("Systemic Change"):**

  Adopting a framework treating all cases as non-normative systemic change would necessitate profound shifts:

  1.  **Terminological Overhaul:**
      *   **Reporting/Narratives:** Replace "collapse," "failure," "decline," "dark age" with precise, descriptive, and non-judgmental terms: "decentralization," "institutional fragmentation," "settlement pattern shift," "network reconfiguration," "demographic redistribution," "cessation of [specific practice X]," "transition to [new state Y]." Emphasize *processes* (fragmentation, reorganization, resilience, adaptation) over end-states.
      *   **Journals/Editors:** Explicitly mandate neutral language in style guides. Encourage frameworks like Resilience Theory, Transformation Theory, or Complex Adaptive Systems that focus on mechanisms of change without inherent normativity.

  2.  **Reframing Research Questions & Grant Evaluation:**
      *   **Proposals:** Shift focus from "Why did it fail?" to "How did this socio-ecological system change?", "What were the drivers and constraints of institutional transformation?", "How did different groups experience and navigate these changes?", "What new configurations emerged?". Frame questions around dynamics, not catastrophe.
      *   **Grant Rubrics:** Evaluate proposals based on their ability to investigate *mechanisms of change*, identify *resilience and adaptation* alongside stress, explore *diversity of experience* (elites vs. non-elites), and connect changes to broader socio-ecological contexts. Downplay emphasis on identifying a singular catastrophic cause or measuring "failure."

  3.  **Museum Narrative & Public Engagement Redesign:**
      *   **Beyond Rise-and-Fall:** Move away from teleological narratives of peak → decline → fall. Present societal histories as dynamic trajectories of continuous change, adaptation, and reconfiguration.
      *   **Highlight Continuity & Transformation:** Emphasize what persisted or transformed alongside what changed radically (e.g., Maya cosmology, agricultural practices, language; Aegean maritime skills, local identities; Rapa Nui kinship, oral traditions).
      *   **Complexity of Causality:** Present multi-causal models (environmental, social, economic, ideological interactions) instead of monocausal "collapse" stories (e.g., just drought or just invasion).
      *   **Agency & Experience:** Center the diverse experiences and choices of people living through changes, avoiding overly deterministic narratives. Showcase adaptation and resilience strategies.
      *   **Co-creation:** Collaborate actively with descendant communities (where they exist) to shape narratives, ensuring interpretations resonate with their understanding of their own history and avoid harmful "doom" tropes (especially relevant for Rapa Nui and the Maya).

  4.  **Theoretical & Pedagogical Shifts:**
      *   **Embrace Processual Ontologies:** Explicitly adopt frameworks that see societies not as static entities with essences, but as dynamic, ever-changing configurations of relations, practices, and institutions (e.g., Assemblage Theory, Relational Ontology).
      *   **Critique Teleology:** Consciously identify and challenge assumptions that complexity, monumentality, or centralization represent the pinnacle or inevitable goal of societal development.
      *   **Teach Nuance:** Train students to recognize the normative baggage of terms like "collapse" and to critically analyze the social, political, and philosophical underpinnings of archaeological narratives.

  **Conclusion:**

  The labeling asymmetry exposes deep-seated commitments to essentialism (regarding defining institutions), teleology (using complexity as a success benchmark), and unacknowledged normativity (equating specific institutional changes with failure). While a functionalist view explains the *focus* on specific institutions in "collapse" cases, it's the implicit *essentialism* about those institutions constituting the society, combined with *teleology*, that creates the asymmetry compared to cases framed as "reorganization."

  Moving to a uniform framework of "systemic change" requires more than just swapping words; it demands a fundamental philosophical shift away from essentialism and teleology towards relational, processual ontologies. This necessitates concrete changes in language, research design, funding priorities, museum storytelling, and pedagogy to focus on understanding the dynamics, causes, and experiences of transformation itself, free from the judgment-laden concept of "collapse." This shift aligns better with anthropological understandings of constant change and promotes more equitable, nuanced, and scientifically rigorous interpretations of the past.
