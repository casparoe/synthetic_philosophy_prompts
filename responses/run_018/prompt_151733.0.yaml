answer: |-
  Here's the translation of the DNA-as-code debate into patent law vocabulary, followed by a residue report analyzing the mapping fidelity:

  **Patent-Law Translation of Positions:**

  1.  **Literal Code Position (DNA = Enabling Disclosure):**
      *   A genetic sequence **literally constitutes an enabling disclosure** teaching PHOSITA (e.g., the cellular machinery) how to construct a specific claimed trait (phenotypic element). The sequence carries **semantic content** (specific codons) acting as **definite claim terms** precisely specifying amino acids. Point mutations are **non-obvious claim amendments** altering the literal scope of the trait claimed, potentially creating non-infringement or novelty over the wild type. "Reading" DNA requires an interpreting agent (ribosome/transcription machinery) operating as a **PHOSITA** bound by the literal meaning (codon table) disclosed in the specification (genetic code).

  2.  **Metaphorical Code Position (DNA = Chemical Prior Art):**
      *   DNA operates **merely as prior art** – a physical structure whose chemical interactions *result* in traits, not a disclosure *teaching* them. Its apparent "coding" is a useful metaphor for predictive modeling, but lacks **semantic content**. The sequence-chemical relationship is governed by **laws of nature** (binding affinities, stereochemistry), not literal meaning. Point mutations are **infringement analyses under the Doctrine of Equivalents (DOE)**: Does the mutant sequence perform substantially the same function (produce a functional protein/effect) in substantially the same way (via similar chemical binding/polymerization), to achieve substantially the same result (viable trait) as the wild type? "Reading" DNA is a **purely chemical process** (molecular recognition/binding); no interpreting agent analogous to a **PHOSITA** exists or is needed – it's direct infringement via mechanistic operation.

  **Residue Report: Mapping Fidelity & Gaps**

  1.  **Enablement & Disclosure vs. Chemical Causality:**
      *   **Mapping:** Clean for *Literalists* (DNA as enabling spec). Tolerable for *Metaphorists* (DNA as prior art structure).
      *   **Residue:** Patent law assumes an *intentional discloser*. Biology has no inventor/discloser – DNA evolved. The "teaching" aspect is metaphorical.
      *   **Gap Source:** Limitation in patent vocabulary (requires a conscious discloser/actor). Philosophical claims about "natural meaning" are imprecise.

  2.  **Semantic Content vs. Chemical Determinism:**
      *   **Mapping:** Forced for *Literalists* (codons = claim terms). Rejected by *Metaphorists* (only chemistry).
      *   **Residue:** Patent claim terms derive meaning from *human linguistic convention*. Codon "meaning" is fixed by *physical chemistry* (tRNA binding) and *evolutionary history*.
      *   **Gap Source:** Primarily limitation in patent vocabulary ("semantic content" implies convention/agency). Philosophical imprecision exists in defining "meaning" in non-cognitive systems.

  3.  **Point Mutations: Amendments vs. DOE Infringement:**
      *   **Mapping:** Cleanest analogy in the debate. Amendments (literalists) focus on changed scope/novelty. DOE (metaphorists) focuses on functional/equivalency outcome.
      *   **Residue:** Mutations are *random events*, not deliberate amendments. DOE analysis implies a *baseline valid claim* (wild type); in biology, the "wild type" isn't "claimed" – it's just one variant.
      *   **Gap Source:** Limitation in patent vocabulary (amendments/DOE imply agency and a pre-existing claim). Philosophical position (metaphorist) avoids this by treating it purely as functional equivalence.

  4.  **"Reading" DNA & the PHOSITA Requirement:**
      *   **Mapping:** Critical for *Literalists* (ribosome = PHOSITA). Explicitly rejected by *Metaphorists* (no agent needed).
      *   **Residue:** A **PHOSITA is a legal fiction representing *knowledge and interpretive ability***. Ribosomes are *molecular machines* operating via physicochemical laws without cognition or knowledge interpretation. They "follow rules" like a lock-and-key, not "interpret meaning."
      *   **Gap Source:** **Fundamental Limitation in Patent Vocabulary.** The PHOSITA concept inherently involves cognition and interpretive agency absent in molecular biology. Philosophical claims about "agency" in biology are contentious but the patent analogy *requires* this distortion for literalists.

  5.  **Evolution as Prior Art Accumulation/Prosecution:**
      *   **Mapping:** Potential weak analogy (natural selection filtering variations like examiner rejecting non-enabled/non-novel claims).
      *   **Residue:** No counterpart for the *prosecution history* or *intentional claim drafting*. Evolution lacks foresight, purpose, or an examiner.
      *   **Gap Source:** Limitation in patent vocabulary (prosecution implies agency/goal). Philosophical imprecision exists in anthropomorphizing evolution.

  **Confidence Assessment:**

  *   **High Confidence (80-90%):**
      *   Mapping Mutation Analysis (Amendments vs. DOE). This fits core legal reasoning patterns.
      *   Contrasting DNA as Enabling Disclosure (Literal) vs. Prior Art Structure (Metaphor). Captures the core dispute about intentionality of "instruction."
      *   Rejection of PHOSITA by Metaphorists. Clearly incompatible with mechanistic view.
  *   **Moderate Confidence (60-70%):**
      *   Enablement vs. Chemical Causality mapping. Captures the "does it teach or just cause?" debate, but the lack of a discloser is a significant residue.
      *   Semantic Content as Claim Terms vs. Chemical Determinism. Useful to frame the debate, but "meaning" is legally distinct.
  *   **Low Confidence (<50%):**
      *   Ribosome as PHOSITA (Literalist Position). **This is the point of least confidence.** The cognitive/interpretive element of the PHOSITA is fundamentally incompatible with a molecular machine, despite superficial rule-following similarities. This mapping requires significant distortion.
      *   Evolution as Prosecution. Too vague and agency-dependent to be a clean fit.

  **Point of Least Confidence:** The mapping of the ribosome/transcription machinery to the **PHOSITA** within the Literalist position. The legal concept of the PHOSITA is inextricably linked to human cognition, knowledge, and interpretive discretion. Attributing this to a molecular complex operating solely via physicochemical laws constitutes a profound category error within the patent framework, even as a useful analogy. This gap stems **overwhelmingly from a limitation in patent vocabulary**, which has no concept of non-cognitive, mechanistic "interpretation" equivalent to biological function. The philosophical claim that molecular processes constitute "interpretation" pushes beyond the boundaries of the legal concept.
