  Key points to address: criteria for legitimacy. Factors like independent evidence for translation issues, prior existence of the competence standard, consistency in application, and whether the objection is pre-registered. Also, avoiding circularity where competence is defined solely by agreeing with the expected answer.

  The user might also be interested in the broader implications: how this affects claims about universal human cognition versus cultural variation. They’re likely looking for tools to critically evaluate such debates, not just a label. They might need a framework to assess when competence objections are valid, which ties into methodology in experimental philosophy and avoiding Western-centric biases.

  I should structure the response by first addressing the term, then the carve-out for legitimacy. Emphasize that the problem isn’t the maneuver itself but its misuse to protect universalist claims. Provide clear criteria to help the user apply this in discussions. Also, note that this is a recognized issue in x-phi, citing possible sources like Machery or Weinberg.

  Deep down, the user might be frustrated with how cultural differences are dismissed in philosophy, wanting to advocate for more rigorous, inclusive methodologies. They need both conceptual tools and terminology to articulate this in academic or rationalist circles.
answer: |-
  This is a brilliantly articulated description of a pervasive methodological issue in experimental philosophy (x-phi) and cross-cultural cognitive science. While there isn't a single universally accepted term, the pattern is widely recognized and critiqued. Here's the breakdown:

  **Established Labels & Adjacent Concepts:**

  1.  **The Stipulative Competence Maneuver (SCM):** This is the most direct descriptive term used in academic critiques. It highlights the core move: redefining "competence" *after* seeing the data to exclude dissenting intuitions.
  2.  **Intuition Policing:** (Used by critics like Edouard Machery, Joshua Knobe). Focuses on the act of declaring which intuitions count as valid expressions of the concept and which are "noise" or "error," often based on conformity to the expected outcome.
  3.  **Conceptual Competence Dodge:** A variant emphasizing the retreat to a highly technical, stipulative definition of the concept that only "experts" or culturally specific speakers supposedly grasp intuitively.
  4.  **Appeal to Expertise (Misapplied):** Related, but SCM specifically targets defining expertise/competence *stipulatively* based on the intuition held, rather than independent qualifications.
  5.  **Methodological Chauvinism / Parochialism:** (Weinberg, Nichols, Stich). Highlights the bias of assuming Western (often WEIRD - Western, Educated, Industrialized, Rich, Democratic) intuitions are the norm and others are deficient.
  6.  **Immunizing Strategy / Defensive Move:** More general, but accurately describes the *effect* of protecting the universality claim from falsification.

  **The Crucial Carve: Legitimate Competence Objection vs. Immunizing SCM**

  The core distinction lies in **independence, falsifiability, and prior justification**. Here's a framework:

  | **Criteria** | **Legitimate Competence Objection** | **Immunizing Stipulative Competence Maneuver** |
  |--------------|-------------------------------------|-----------------------------------------------|
  | **Timing** | Raised *before* or independently of specific results | Invoked *only after* seeing disagreeable results |
  | **Evidence Basis** | Supported by independent linguistic/cultural evidence | Lacks independent evidence; relies on circular definition |
  | **Competence Standard** | Based on pre-existing, independently verifiable criteria | Defined post-hoc by agreement with desired intuition |
  | **Application** | Applied consistently regardless of outcome | Selectively applied only to "problematic" groups |
  | **Falsifiability** | Open to being proven wrong through better methods | Effectively unfalsifiable - dissent always indicates incompetence |
  | **Circularity** | Avoids tautological reasoning | Creates self-sealing definition ("competent = agrees with me") |

  **Applying the Framework to Your Examples:**

  1.  **Justification-by-Luck (Gettier Cases):**
      *   **Legitimate Objection:** If independent linguistic analysis shows the translated word for "justified" *routinely* means "proven true" or "infallible" in the target language, making the Gettier structure incoherent. Evidence comes from dictionaries, native speaker consultants on *other* phrases, or pre-existing literature on epistemic terms in that language.
      *   **Immunizing SCM:** Claiming participants "didn't grasp the concept of justification" *simply because* they gave the "wrong" answer, without strong prior evidence of a translation flaw or conceptual difference. Defining "competent" as "gives the Western Gettier intuition."

  2.  **Name-Thief Case (Reference):**
      *   **Legitimate Objection:** If independent evidence shows the question phrase ("who does the name refer to?") in the target language is *routinely* interpreted as asking about credit or attribution in contexts of discovery/naming, based on linguistic analysis or pre-testing with other scenarios.
      *   **Immunizing SCM:** Declaring that participants answering based on credit "confused reference with attribution" *only after* seeing their answers differ, without prior evidence that this specific question is ambiguous *in that linguistic context*. Defining "competent" as "understands 'reference' in the Kripkean technical sense" (which the folk question wasn't necessarily designed to probe exclusively).

  **Boundary Cases & Nuances:**

  *   **The "Training" Dodge:** Claiming participants need philosophical training to have the "correct" intuition transforms the claim from "universal folk intuition" to "intuition among those trained in a specific philosophical tradition." This *can* be legitimate if studying expert cognition, but it abandons the original universality claim about pre-theoretic folk concepts. It becomes an SCM if presented as rescuing folk universality.
  *   **Genuine Ambiguity:** Sometimes vignettes *are* genuinely ambiguous cross-culturally. A legitimate objection identifies *specific, testable* ambiguities (e.g., via cognitive interviewing or alternative phrasing tests) *before* attributing differences to competence. An SCM uses ambiguity as a blanket excuse.
  *   **The "Practical" vs. "Theoretical" Dodge:** This is often an SCM red flag. Distinguishing practical concerns from conceptual ones post-hoc is frequently arbitrary. If the question is phrased as "Does he *know*?" (a conceptual term), interpreting divergent answers as "merely practical" often dismisses valid conceptual differences without evidence. Legitimate objections would show the vignette *forced* a practical reading (e.g., by asking "What should he *do*?").

  **Conclusion:**

  The move you describe is best captured by **Stipulative Competence Maneuver (SCM)** or **Intuition Policing**. It's illegitimate when the competence standard is **defined circularly by the desired intuition**, lacks **independent empirical justification** (linguistic, cultural, methodological), is applied **selectively post-hoc**, and renders the universality claim **effectively unfalsifiable**.

  The legitimate core is the valid concern that cross-cultural research is *hard*: translations can fail, vignettes can misfire, concepts may not map perfectly. The illegitimate extension is using these potential pitfalls not as genuine methodological hurdles to overcome with better research design, but as an *a priori* shield to dismiss any counter-evidence without compelling, independent justification. The burden of proof shifts decisively to the universalist making the competence objection to demonstrate *why* the divergence occurred, with evidence beyond the divergence itself. If they can't meet that burden, the SCM is likely in play, protecting dogma rather than pursuing truth.
