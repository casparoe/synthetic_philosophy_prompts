answer: |-
  The precise conceptual issue arising at the legend-history boundary, illuminated by referential drift and contrasting the Trojan War and Arthurian traditions, is the **epistemological circularity inherent in attempting archaeological verification when the geographical referent of a legendary name is either fixed but potentially arbitrary, or entirely unanchored.**

  **Referential Drift** denotes the process whereby the specific geographical location or institutional identity attached to a proper name within a tradition shifts over time, through retellings, migrations, or political motivations. This drift disconnects the *name* in later texts from its original, potentially historical, anchor point.

  1.  **Stable Referent (Trojan War - Hisarlik as Troy):** Here, referential drift concerning Troy's *location* is minimal in the core tradition. Ancient Greek epic and historical sources consistently place Troy/Ilion in the Troad, specifically associating it with the prominent mound of Hisarlik. This stability creates a seemingly clear target for archaeology. Schliemann's excavation at Hisarlik, revealing a Bronze Age citadel destroyed by fire and warfare, appeared to dramatically confirm Homer's account. However, the *conceptual difficulty* is one of **circular verification**. The identification relies heavily on the textual tradition pointing to *that specific hill*. Finding a significant Bronze Age site *there* then validates the texts that pointed to it. But *why was that specific hill chosen as Troy by the ancients?* Was it based on genuine historical memory of a specific Late Bronze Age conflict, or was it an arbitrary or symbolic anchoring of the legend onto the most impressive local ruin centuries later? Archaeology confirms a site *existed* and suffered destruction, but the link to the specific *legendary event* (the Trojan War as narrated) relies precariously on the stability of the textual referent, which itself may be a product of earlier drift or deliberate choice. The danger is assuming correlation (big site where legend said) equals causation (this site *is* the Troy of the legend).

  2.  **Unanchored Referent (Arthurian Cycle - Camelot):** Referential drift concerning Camelot is profound and ongoing. The name itself appears late (12th century) and its location is never consistently fixed in medieval texts – Malory associates it loosely with Winchester and/or Carlisle, while other traditions suggest Cadbury, Camelford, Caerleon, or entirely fictional settings. There is no single, stable geographical anchor inherited from the earliest strata of the legend. Consequently, archaeological investigations (e.g., at Cadbury Hillfort, Tintagel, or Winchester) face a different, yet related, conceptual difficulty: **the impossibility of definitive falsification and the ease of arbitrary confirmation.** Any impressive ruin or site vaguely fitting a "great fort/court" description *could* be proposed as Camelot. Excavations revealing high-status occupation *anywhere* in post-Roman Britain can be (and have been) claimed as evidence for the "historical Camelot". However, without a fixed referent established by early tradition, no excavation can definitively *disprove* a Camelot identification elsewhere, nor can any single site *confirm* it beyond asserting a fit for a highly malleable concept. The lack of a stable geographical anchor transforms the quest into projecting the legend onto archaeology, rather than testing a specific historical correlation.

  **The Core Conceptual Difficulty:** Referential drift fundamentally complicates the use of archaeology to adjudicate when legend becomes history. With a *stable referent* (like Hisarlik for Troy), the danger is **tautological verification** – archaeology seemingly confirms the legend because the legend dictated where to look, obscuring the question of *how* and *why* that location became fixed in the tradition in the first place. With an *unanchored referent* (like Camelot), the danger is **confirmation bias and historical projection** – any potentially suitable site can be labelled as the legendary place, lending spurious historical weight to the legend based on generic archaeological evidence that may have no genuine connection to the narrative core. In both cases, the shifting ground of the name itself undermines a clear epistemological path from legendary narrative to verified historical event via material correlation. The drift means the target for verification is inherently unstable, making the boundary between legend and history porous and resistant to clear demarcation through archaeology alone.
