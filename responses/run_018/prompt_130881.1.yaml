  Produce a document both could sign. Include: (1) a numbered list of agreed claims—about the scale of insect biomass and populations, the current limits of invertebrate neuroscience, the formal structure of the scale argument, and the conditions under which moral aggregation is valid; (2) precise disagreement formulations in wording each camp accepts, including whether the "reference-class problem for phenomenal binding" undermines prior probability assignments and whether moral aggregation requires kind-certainty rather than probabilistic weighting; (3) the cruxes—specifically, whether there is an epistemic threshold below which aggregate moral weight dissolves, and whether combining "low confidence" with "vast numbers" rationally translates into expected suffering; (4) for each crux, one concrete comparative case both agree bears on it (e.g., precautionary reasoning in wild-animal suffering or low-confidence artificial-system welfare), with each camp's predicted evaluation recorded in advance.

  Separate what is settled from what is genuinely contested among people who know the topic, and do not present a contested view as the consensus.
