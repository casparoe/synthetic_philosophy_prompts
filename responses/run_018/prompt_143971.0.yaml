  Hmm, this is an interesting conceptual challenge. The user is clearly sophisticated - they've already ruled out deliberate institutional capture as a different phenomenon, and they're seeking precise philosophical framing for their narrative. Their examples show they've observed this pattern deeply. 

  As I think about this, several concepts come to mind. Institutional drift is too broad - it could include intentional shifts. Mission creep is closer but implies active expansion rather than passive erosion. Isomorphism describes conformity to external pressures, not internal decay. The user's pattern is more about micro-rational decisions that collectively distort the institution's core purpose without any conscious abandonment.

  What makes this distinct? First, the absence of intent - no villain or conspiracy. Second, the distributed nature - no single actor drives it. Third, the justification logic - each step is locally reasonable. Fourth, the invisibility - no moment of rupture. 

  Existing terms don't quite capture this. I should coin something new. "Teleological seepage" might work - teleological referring to purpose, seepage suggesting slow leakage. Or "institutional aphanisis" - aphanisis meaning gradual disappearance. 

  For the deliberate path they contrast it with - that's clearly institutional capture. The differences are crucial: in their first pattern, accountability is diffuse, the causal chain is aggregation of micro-actions, and it's narratively subtle - decay hides in plain sight. 

  This distinction matters for their novel. Without villains, the tragedy becomes systemic - good people upholding local rationality while collectively destroying what they value. It creates a different moral texture: complicity without conspiracy, failure as byproduct of normal operation. The horror is in the banality.
answer: |-
  ### 1. Conceptual Brainstorming  
  *Nearby concepts:*  
  - **Institutional drift**: Generic term for gradual change, but lacks specificity about *how* or *why* decay occurs.  
  - **Mission creep**: Focuses on scope expansion, not core-purpose erosion; often implies active (if unplanned) diversification.  
  - **Isomorphism**: Mimicking external norms (coercive/mimetic), but your cases show *internal*, self-generated slippage.  
  - **Bureaucratic ritualism**: Means displace ends, but your examples involve *redefinition* of ends, not just ritual adherence.  
  - **Tragedy of the commons**: Collective action problem, but here the "commons" is the institution’s telos, eroded by individual micro-rational choices.  
  - **Path dependency**: Highlights constraint by past decisions, but doesn’t capture the *normative decay* aspect.  

  ### 2. Phenomenological Carving  
  **Core Phenomenon**: *The cumulative, undirected erosion of an institution’s foundational purpose through individually defensible micro-adaptations that collectively reconfigure its identity without explicit intent.*  

  **Mechanisms**:  
  - **Micro-rationality**: Each decision (e.g., funding a memoirist to sustain revenue, adding a "practical" course to boost enrollment) is locally justified by proximate concerns (economics, efficiency, pragmatism).  
  - **Distributed agency**: No central actor coordinates the shift; decay emerges from disaggregated choices by actors with partial/compartmentalized accountability.  
  - **Amnesia of origins**: Founding intent becomes rhetorically preserved but operationally inert, replaced by emergent "common sense."  
  - **Structural feedback**: Small concessions alter institutional infrastructure (e.g., new hires, donor relationships), creating self-reinforcing pathways away from the original mission.  

  **Distinctions**:  
  - **vs. Deliberate institutional capture**: No actor *intends* to subvert the mission (unlike your charismatic director). Agents believe they’re preserving the institution through adaptation.  
  - **vs. Generic organizational drift**: Drift can be neutral (e.g., technological adaptation) or externally imposed. Here, drift is *teleologically corrosive*—it systematically voids the institution’s *raison d’être* while maintaining its shell.  
  - **vs. Inertia/rigidity**: The institution *is* changing, but toward entropy of purpose, not stagnation.  

  ### 3. Terminological Verdict  
  **Verdict**: No existing term captures this precisely. **Mission creep** implies expansion, not erosion. **Institutional decay** is too broad. **Coined term**:  
  > **Teleological Seepage** (*telos* + gradual leakage)  
  > *Definition*: The imperceptible displacement of an institution’s constitutive purpose through an aggregation of locally rational, non-malicious adjustments that cumulatively reconfigure its operational identity without explicit intent or collective acknowledgment.  

  **Boundary Cases**:  
  - **Inside**: A monastic order founded on ascetic silence introduces "brief spoken prayers for weary novices" → communal meals with permitted conversation → sanctioned public lectures. After a century, it operates as a pedagogical academy.  
  - **Outside**: A city council votes to divert park maintenance funds to disaster relief after a hurricane (non-cumulative, externally triggered, no identity erosion).  

  ### 4. Relation to Influence-Seeking  
  **Deliberate institutional capture** (your charismatic director) operates via:  
  - **Causal structure**: Top-down, strategic resource manipulation; a "vector" with directionality.  
  - **Accountability**: Traceable to specific agents/decisions; culpability is centralized.  
  - **Narrative recognizability**: Features clear turning points, conflicts, and motivated actors.  

  **Teleological seepage**, conversely:  
  - **Causal structure**: Bottom-up, emergent; a "diffuse gradient" where systemic incentives override intent.  
  - **Accountability**: Dissolved across time/actors; each choice is defensible, creating moral laundering.  
  - **Narrative recognizability**: Absence of drama; decay manifests as ambient dissonance (e.g., archived founding documents vs. current practice).  

  ### 5. Narrative Implications  
  The absence of a villain transforms decay from melodrama to tragedy of epistemology:  
  - **Moral texture**: Focus shifts from culpability to *complicity*—actors uphold local rationality while collectively betraying first principles. This evokes a haunting banality, where failure stems from institutional loyalty itself.  
  - **Structural irony**: The institution’s survival mechanisms (adaptation, pragmatism) become its tools of self-betrayal.  
  - **Reader effect**: Creates existential unease—audiences confront how their own micro-rational choices might sustain analogous systems. The decay feels *inevitable* yet *contingent* on thousands of unseen yeses.  
  - **Thematic depth**: Explores the fragility of purpose in the face of institutional entropy, questioning whether telos can survive its own operationalization.  

  This distinction allows your narrative to anatomize decay not as hijacking, but as the slow drowning of ideals in the waters meant to sustain them.
