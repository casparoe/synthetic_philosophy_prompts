prompt: |-
  I serve on the development control committee for my borough council, and at our last session a fellow member kept invoking 'the wisdom of crowds' to justify replacing our seven-person expert advisory panel with a fifty-person citizens' jury for a particularly complex planning appeal. I am trying to understand exactly what is being claimed, because the phrase seems to do a great deal of work in the argument without being pinned down. Could you lay out, as a structured menu, the distinct precise theses that slogan might express — from the trivial statistical observation that random errors cancel in large aggregates, through Condorcet's jury theorem with all its formal conditions (independent votes, binary choice, individual competence strictly above one-half), to stronger and more contentious claims about epistemic diversity, collective moral insight, or democratic legitimacy — and for each indicate whether it is a platitude, whether it is substantive and defensible, and whether it is false? Then tell me which of these readings my colleague is actually relying upon to move from 'crowds are wise' to 'fifty lay citizens should overrule specialists on this appeal', and identify the hidden assumptions about the decision's structure (whether there is a single correct answer, whether voters are genuinely independent, whether competence is uniformly distributed) that would need to hold for that inference to succeed. I need this for our next committee meeting, so please present it as a disambiguation with verdicts rather than a single explanation; no bibliographies or citations are required.
