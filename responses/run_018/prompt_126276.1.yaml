  The user's role involves planning appeals, which are often technical. They're skeptical about replacing experts with laypeople. Their deeper need might be to counter the colleague's proposal with logical rigor, not just opinion. They probably want to expose the flawed assumptions behind the "fifty over specialists" leap.

  Starting with the basic statistical thesis: large groups average out random errors. This is mathematically sound but trivial. It doesn't apply here because planning isn't about estimating numbers; it's multidimensional. Verdict: true but irrelevant. 

  Next, Condorcet's jury theorem. This requires binary choices, voter independence, and individual competence >0.5. Planning appeals are never simple yes/no; they involve trade-offs. Jurors won't be independent (deliberation creates influence), and laypeople's competence on technical issues is likely below 0.5. Verdict: superficially appealing but structurally inapplicable. 

  Then, the diversity thesis. Different perspectives might cover blind spots, but only if they're relevant to the problem. For a complex appeal, specialized knowledge gaps (e.g., environmental impact assessments) matter more than general life experiences. Verdict: defensible in theory but overclaimed here. 

  The democratic legitimacy angle is about ownership, not correctness. The user's committee might care about this, but it's separate from getting the decision right. Verdict: valid but conflates two different goals. 

  The colleague is likely mashing up Condorcet and diversity theses, ignoring the strict conditions. The leap to "fifty laypeople > specialists" assumes: (1) the decision is binary, (2) jurors are independent, and (3) average competence >0.5. All three fail here. The appeal isn't binary, deliberation breaks independence, and lay competence is untested. 

  Hidden assumptions the user should highlight: Without a single correct answer, Condorcet collapses. Without independence, errors amplify. Without competence >0.5, more people make things worse. Also, the "crowd" needs relevant diversity, not just size. 

  The user’s real task is to show that "wisdom of crowds" is being misapplied. They should argue that for complex technical decisions, expert panels exist for a reason—they aggregate relevant competence, not just numbers. The citizens' jury might be useful for values-based input, but not for overriding technical judgment.
answer: |-
  Here is a disambiguation of "the wisdom of crowds" into distinct theses relevant to your context, with verdicts on each, followed by an analysis of your colleague's argument and its required assumptions:

  ---

  ### The "Wisdom of Crowds" Theses: A Structured Menu

  1.  **The Statistical Averaging Thesis (Trivial Core)**
      *   **Claim:** Aggregating many *independent* estimates of a *factual quantity* (e.g., weight, distance, price) tends to converge toward the true value as random individual errors cancel out.
      *   **Platitude?** Yes (well-established statistical phenomenon).
      *   **Substantive & Defensible?** Yes, *but only* for well-defined quantitative questions where errors are random and uncorrelated.
      *   **False?** No, but irrelevant to complex, qualitative, multi-dimensional planning decisions involving trade-offs, values, and specialized knowledge.
      *   **Verdict:** **TRUE BUT MISAPPLIED** to planning appeals.

  2.  **Condorcet's Jury Theorem (Binary Choice Core)**
      *   **Claim:** For a *binary choice* (Yes/No) with a *single correct answer*, if voters are (a) *independent*, (b) each have *competence > 0.5* (better than random chance), and (c) vote sincerely, then the majority vote is more likely to be correct than any individual vote, and this probability approaches 1 as the group size increases.
      *   **Platitude?** No (a formal mathematical theorem).
      *   **Substantive & Defensible?** Yes, *but requires all strict conditions to hold*.
      *   **False?** The theorem itself is true, but its conditions are *extremely fragile* in practice. Violating any condition (especially competence >0.5 or independence) can make larger groups *worse*.
      *   **Verdict:** **CONDITIONALLY TRUE / OFTEN INAPPLICABLE** due to unrealistic conditions.

  3.  **The Diversity Trumps Ability Thesis (Cognitive Diversity)**
      *   **Claim:** Groups with diverse perspectives, heuristics, and knowledge bases can outperform homogeneous groups of higher-ability individuals on complex, non-routine problems by pooling unique insights and avoiding common blind spots ("diversity bonus").
      *   **Platitude?** No (a substantive, research-backed claim).
      *   **Substantive & Defensible?** Yes, *defensible for genuinely complex, multifaceted problems requiring novel solutions or perspectives*. Depends *critically* on the *relevance* of the diversity to the task.
      *   **False?** Not inherently false, but *highly contingent*: Diversity must be *problem-relevant* and the group must have mechanisms to *integrate* diverse inputs effectively. Can fail if diversity creates conflict or communication breakdowns.
      *   **Verdict:** **DEFENSIBLE BUT CONTINGENT** – Relevance to technical planning appeals is debatable.

  4.  **The Collective Moral Insight Thesis (Normative Wisdom)**
      *   **Claim:** Crowds are better at discerning fair outcomes, ethical principles, or shared community values than experts or elites, especially on issues impacting the community.
      *   **Platitude?** No (a contentious philosophical/political claim).
      *   **Substantive & Defensible?** Highly debated. Defensible on grounds of democratic legitimacy and avoiding elite bias/groupthink. Less defensible for *technical* aspects of decisions.
      *   **False?** Vulnerable to majoritarian bias, populism, manipulation, and lack of information on complex causal chains or long-term consequences inherent in planning.
      *   **Verdict:** **CONTENTIOUS & PARTIAL** – May capture *values* but not *technical feasibility or impact*.

  5.  **The Democratic Legitimacy Thesis (Procedural Justification)**
      *   **Claim:** Decisions made by representative groups of citizens have greater legitimacy and public acceptance, regardless of technical optimality. "Wisdom" here means legitimacy derived from the process.
      *   **Platitude?** No (a core democratic principle).
      *   **Substantive & Defensible?** Yes, for grounding decisions in public consent and accountability. This is about *authority*, not necessarily *epistemic correctness*.
      *   **False?** Not false as a claim about legitimacy, but conflating it with *epistemic wisdom* is misleading. Legitimacy ≠ Correctness.
      *   **Verdict:** **VALID AS LEGITIMACY, NOT EPISTEMIC WISDOM**.

  ---

  ### Analysis of Your Colleague's Argument & Required Assumptions

  1.  **Which Reading(s) is Your Colleague Relying On?**
      *   The core leap ("50 citizens > 7 experts") most directly invokes **Condorcet's Jury Theorem (#2)**. The argument implies that aggregating more (presumably competent) independent votes inherently increases the chance of a correct decision.
      *   It likely *also* implicitly draws on the **Diversity Thesis (#3)** (implying citizens bring valuable diverse perspectives experts lack) and the **Legitimacy Thesis (#5)** (implying the jury's decision is more democratic).

  2.  **Hidden Assumptions Required for the Condorcet Leap to Work:**
      Your colleague's inference **requires all of the following Condorcet conditions to hold** for the specific planning appeal:
      *   **A. Single Correct Answer (Binary Choice):** The planning appeal must be reducible to a simple Yes/No vote with one objectively "correct" outcome (e.g., "Approve this *exact* proposal: Yes/No"). *This is almost certainly **FALSE***. Planning appeals involve complex trade-offs (economic, social, environmental, aesthetic, legal), multiple feasible solutions with different pros/cons, and nuanced conditions – rarely a single binary truth.
      *   **B. Voter Independence:** The 50 jurors must form their judgments *independently* without influencing each other (e.g., secret ballot on isolated facts). *This is **FALSE***. Citizens' juries inherently involve *deliberation*, discussion, and persuasion, creating significant interdependence and potential for groupthink or dominance by vocal minorities/experts within the group.
      *   **C. Individual Competence > 0.5:** *Each* lay juror must, *on their own*, have a better than 50% chance of identifying the single "correct" answer to the complex technical planning appeal. *This is **HIGHLY IMPROBABLE / FALSE***. The appeal's complexity likely involves specialized knowledge (e.g., traffic modeling, environmental impact assessment, structural engineering, planning law precedent) where untrained citizens are unlikely to exceed random chance individually. Average competence is likely *significantly below* 0.5 on these technical dimensions.

  3.  **Why the Inference Likely Fails:**
      *   **Violates Condorcet:** The necessary conditions (A, B, C) almost certainly do *not* hold for a complex planning appeal. Without competence >0.5 (#C), Condorcet predicts a *larger group is more likely to be **wrong***. Lack of independence (#B) amplifies errors. The non-binary nature (#A) makes the theorem inapplicable.
      *   **Overclaims on Diversity:** While a citizens' jury *might* add valuable perspectives on local impacts or community values (#3 & #5), it is unlikely to possess the *specific, relevant technical expertise* needed to *overrule* specialists on the core complex technical questions of the appeal. Diversity is only beneficial if it includes *relevant* knowledge/skills.
      *   **Conflates Legitimacy with Expertise:** The argument (#5) confuses the *democratic legitimacy* of a decision (which a jury might enhance) with the *epistemic capacity* to make the *technically best or most legally sound* decision (where experts likely dominate).

  ---

  ### Verdict for Your Committee

  Your colleague is primarily invoking **Condorcet's Jury Theorem** under the false assumptions that: (1) the appeal is a simple binary choice with a single correct answer, (2) 50 citizens will vote independently, and (3) each citizen has >50% competence on the complex technical issues. **These assumptions are almost certainly invalid for your complex planning appeal.** Consequently, the claim that "50 citizens are wiser than 7 experts" based on crowd wisdom is **epistemologically unsound** in this context. While a citizens' jury *might* play a valuable role in *informing* values-based aspects or enhancing legitimacy, replacing a technical expert panel with one for the *decision itself* on a complex appeal lacks a defensible basis in the "wisdom of crowds" literature under the likely conditions. Emphasize the critical mismatch between the *required conditions* for crowd wisdom (especially Condorcet) and the *actual structure and demands* of your specific decision.
