prompt: |-
  I'm covering this weird arguement I caught at a science-ideas mixer -- two postdocs going at it over the careenium data. Maya said the simmballs are basically epiphenominal: the substrate does all the real work, and tagging clusters as simmballs is just a story we tell after the fact. Leo pushed back that once careenium density crosses the 0.4 threshhold, the symbol layout actually constrains the substrate's next state, so the simmballs are literally pushing matter around.

  Maya called that a correllation fallacy -- like saying a shadow causes the object. Sure, simmball patterns predict substrate shifts, but prediction isn't causation. Leo said it's stronger than correlation: you can plug in a fresh substrate with identical initial conditions but different simmball mappings, and the downstream physical trajectory diverges. If the symbols were just riding along, that shouldn't happen.

  Then Maya said the divergence only shows the mapping is baked into the state description, not that symbols have independent causal power -- it's still substrate-on-substrate all the way down. Leo answered that if you accept that, you've collapsed representation into the represented, which makes tracking simmballs separately pointless. They asked me to referee but I'm mostly a neuroscience writer, not a metaphysician.

  Can you go through their exchange move by move and say who's right about what? Don't just declare a winner -- point out what each one's missing, and say whether the careenium actually settles if symbols push substrate, or if the question is still open.
