prompt: |-
  ok so for my animal ethics seminar i need to check if my views actually cohere before i present tomorrow. here's roughly where i'm at: (1) sentience is necessary and sufficient for direct moral status, so being human or being a pig is never by itself a reason to treat them differently; (2) the marginal-cases argument works against rationalist human exceptionalism, but i still think "speciesism" is a misleading analogy because biological taxanomy actually tracks deep differences in cognitive architecture; (3) wild-animal suffering is real and we should probably do some intervention like vaccinating, but ecologial wildness has a non-instrumental value that can sometimes outweigh reducing suffering; (4) evolutionary continuity means there's no sharp metaphysical line between human and animal minds, so i want to extend consideration to octopuses and maybe bees, yet i draw a hard line at AI and plants since phenomenal consciousness needs biological embodiment; (5) in practice our obligations should come from reflective equilibrium on considered judgments, not from applying one master principle. do these hang together? i feel like there's a hidden contradiction between my sentientism and my taxonomy point, and maybe between continuity and my hard line, but i cant tell which ones are real. can you audit this in exactly five numbered items, each one or two sentences max, no intro or conclusion? rank the tensions by severity and say what'd have to give in each case.
