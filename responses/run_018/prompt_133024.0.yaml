answer: |-
  Here is a taxonomy structured as a decision tree based on concrete judgments about boundary cases and conceptual roles for naming genocide:

  **Root Node:** How should the core legal definition of genocide (specific intent to destroy, in whole or in part, a national, ethnical, racial, or religious group) be treated?
  *   **(A) Conceptually Fixed:** The legal definition sets the necessary and sufficient conditions. Deviations undermine its precision and legal function.
  *   **(B) Open to Expansion:** The legal definition is a starting point, but the concept can/should evolve based on deeper principles or new understandings.
  *   **(C) Subordinate to Moral/Political Context:** The legal definition is secondary; naming genocide is fundamentally a moral condemnation or political strategy.

  ---

  ### Branch A: Conceptually Fixed (Strict Legalism)
  1.  **Does systematic erasure of archives/languages (epistemic destruction) count as the core destructive act?**
      *   **No (A1):** Only physical/biological destruction qualifies; erasure is evidence or a cover-up.
      *   *Leads to: **Strict Conventionalist (Leaf 1):*** Adheres rigidly to the UNGC definition. Requires explicit intent documented for physical destruction of the 4 protected groups. Applying the term is solely a legal determination for prosecution; moral/political uses dilute its force. Cultural destruction without killing and political groups are excluded. Structural inference is highly suspect without direct proof of intent.

  ### Branch B: Open to Expansion
  1.  **Should the protected-group category include politically defined groups?**
      *   **Yes (B1):** Lemkin's original vision (including political groups) should be restored; excluding them is arbitrary.
      *   **No (B2):** The core groups (national, ethnic, racial, religious) are distinct and sufficient; adding political groups blurs the concept.
  2.  **From B1 (Includes Political Groups):**
      1.  **Can cultural destruction (without physical killing) satisfy the concept?**
          *   **Yes (B1a):** Destroying a group's identity/culture *is* destroying the group as such; physical killing isn't always necessary.
          *   **No (B1b):** Physical destruction remains essential; cultural attacks are preparatory, concomitant, or evidentiary, but not independently sufficient.
      2.  **Does epistemic destruction count as the core destructive act?**
          *   *(For B1a & B1b):* **Judgment needed:** Is erasing memory/foundations *part of* the destruction?
              *   **Yes (B1a-Y / B1b-Y):** Epistemic destruction is a core destructive method or even a standalone act (especially for B1a).
              *   **No (B1a-N / B1b-N):** Epistemic actions are tools for cover-up or intimidation, not the destruction itself.
      3.  *Leaves:*
          *   **Lemkin-Restorationist (Leaf 2):** (Reached via B1, B1a, and likely B1a-Y) Restores political groups and accepts cultural/epistemic destruction as core. Intent can be inferred strongly from patterns. Label signifies the gravest moral wrong, beyond just legal applicability. *(Common path: B1 -> B1a -> Yes to Epistemic)*
          *   **Rare Combination: Political Inclusionist / Physical Destructionist (Leaf 3):** (Reached via B1, B1b) Includes political groups but *requires* physical destruction; cultural/epistemic attacks don't independently count (B1b-N likely). Label is primarily legal. **Diagnosis:** *Uncommon & Potentially Unattractive.* It expands groups (politically contentious) while rigidly restricting the *act* to physical killing (ignoring Lemkin's emphasis on destroying foundations). It prioritizes legal precision but makes conviction harder by requiring proof of intent against a broader, potentially less distinct group type. Focuses only on bodily destruction, neglecting cultural erasure as destruction.
  3.  **From B2 (Excludes Political Groups):**
      1.  **Can cultural destruction (without physical killing) satisfy the concept?**
          *   **Yes (B2a):** Cultural destruction *is* group destruction for the core groups.
          *   **No (B2b):** Physical destruction remains essential.
      2.  **Does epistemic destruction count as the core destructive act?**
          *   *(For B2a & B2b):* **Judgment needed:**
              *   **Yes (B2a-Y / B2b-Y):** Epistemic destruction is core.
              *   **No (B2a-N / B2b-N):** Epistemic actions are not core destruction.
      3.  **In cases without explicit intent proof, but structural pattern makes group destruction the only plausible explanation, should it be named genocide?**
          *   **Yes (Infers Intent):** Intent can be inferred from systematic patterns and outcomes.
          *   **No (Requires Proof):** Explicit proof of specific intent is required.
      4.  *Leaves:*
          *   **Cultural Destructionist (Leaf 4):** (Reached via B2 -> B2a) Accepts cultural (and likely epistemic) destruction *without requiring physical killing* for the core groups. Intent inferable. Label signifies extreme moral wrong. *(Path: B2 -> B2a -> Yes to Inference)*
          *   **Expansion-Skeptic (Leaf 5):** (Reached via B2 -> B2b -> B2b-N -> No to Inference) Open to *some* evolution (e.g., inferring intent cautiously, *maybe* epistemic weight) but rejects adding groups or removing the physical destruction requirement. Balances legal function with moral gravity. *(Path: B2 -> B2b -> No to Epistemic -> Yes to Inference possible but cautious)*

  ### Branch C: Subordinate to Moral/Political Context
  1.  **Is applying the term primarily a legal determination, a moral judgment, or a strategic political act?**
      *   **Primarily a Legal Determination (C1):** Contradicts root choice (C). *Logic prevents genuine separation from Branch A.*
      *   **Primarily a Moral Judgment (C2):** Identifies the worst kind of wrong against groups.
      *   **Primarily a Strategic Political Act (C3):** Triggers obligations (R2P, sanctions) or mobilizes action.
  2.  **From C2 (Moral Judgment):**
      1.  **Does the core destructive act *require* physical killing?**
          *   **No (C2a):** The essence is the intent to destroy group existence, achievable through multiple means (cultural, epistemic, demographic).
          *   **Yes (C2b):** Physical destruction remains the paradigmatic, most severe form.
      2.  **Should the event be named genocide based on structural pattern alone if plausible?**
          *   **Yes (C2-Y):** Moral wrong is evident in the pattern and outcome.
          *   **No (C2-N):** Intent remains crucial for the specific gravity of genocide.
      3.  *Leaves:*
          *   **Moral Scalarist (Leaf 6):** (Reached via C2 -> C2a -> Likely C2-Y) Genocide is the extreme end of a spectrum of group-targeted violence. Physical killing isn't essential; cultural/epistemic destruction counts. Intent inferred. Political groups included if targeted for destruction. Label signifies peak moral wrong, not a legal threshold. *(Path: C2 -> C2a -> Yes to Inference)*
          *   **Moral Thresholdist (Leaf 7):** (Reached via C2 -> C2b -> Likely C2-N) Genocide is a unique moral category defined by intent + physical destruction of core groups. Requires strong evidence of intent. Label signifies a categorical moral abomination. *(Path: C2 -> C2b -> No to Inference)*
  3.  **From C3 (Strategic Political Act):**
      *   *Leads directly to: **Political Nominalist (Leaf 8):*** The label "genocide" is a tool for mobilization, shaming, or triggering international mechanisms (like R2P). Its application depends on the political context, desired outcome, and audience, *not* on strict adherence to legal definitions or even consistent moral principles. Legal definitions, cultural destruction, political groups, and inferred intent are all potentially usable or discardable based on strategic utility. Naming is performative politics.

  ---

  **Leaf Summary (7 Positions + 1 Rare):**
  1.  **Strict Conventionalist:** Fixed legal def. Physical killing of 4 groups. Explicit intent. Legal determination. (From A1)
  2.  **Lemkin-Restorationist:** Includes political & cultural groups. Cultural/epistemic destruction counts. Intent inferable. Moral wrong. (From B1->B1a->Y)
  3.  **Rare: Political Inclusionist / Physical Destructionist:** Includes political groups. *Requires* physical killing. Legal label. (From B1->B1b->N) *Diagnosis: Uncommon & Unattractive - Expands group definition while rigidly restricting the act to physical killing, creating tension for legal application.*
  4.  **Cultural Destructionist:** Core groups only. Cultural destruction *without* physical killing suffices. Intent inferable. Moral wrong. (From B2->B2a->Y)
  5.  **Expansion-Skeptic:** Core groups only. Requires physical destruction. Cautious on intent inference. Balances legal/moral. (From B2->B2b->N->?Inf)
  6.  **Moral Scalarist:** Genocide = extreme end of spectrum. No physical killing required. Groups flexible. Intent inferred. Peak moral wrong. (From C2->C2a->Y)
  7.  **Moral Thresholdist:** Unique moral category. Requires physical killing + intent for core groups. Moral judgment. (From C2->C2b->N)
  8.  **Political Nominalist:** Label = strategic tool. Definition subordinate to political goals. (From C3)

  **Flagged Indistinguishability:**
  *   Branch C's option for "Primarily a Legal Determination" (C1) is logically incompatible with choosing the root node "Subordinate to Moral/Political Context" (C). Therefore, this path doesn't generate a distinct leaf and effectively merges with Branch A (Strict Legalism) positions in practice.
  *   The Political Nominalist (Leaf 8) can potentially *mimic* any of the other positions rhetorically depending on strategy. The decision tree sorts based on the *reason* for naming, not the outward appearance. A Nominalist might deploy arguments from Leaf 2 or Leaf 6 if useful, but their core stance (subordination to strategy) remains distinct.
