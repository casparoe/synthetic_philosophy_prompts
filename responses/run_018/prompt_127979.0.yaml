  Hey—quick question for a feature I'm writing on the weirder edges of decision theory. I've been trying to wrap my head around superrationality, the Hofstadter idea where two people with identical reasoning in a prisoner's dilemma both cooperate. But here's the thing I'm stuck on: if the logic is that your move is perfectly corrolated with the other player's because you both run the same mental algorithim, then isn't superrationality basically just causal decision theory in disguise? I mean, in Newcomb's problem you one-box because you think your choice causally influences the prediction, and here you cooperate because you think your reasoning causally influences the other agent. So why do philosophers treat these as totally seperate problems? Am I conflating correlation with causation, or is there a real distinction I'm missing? Also, please write your answer in American English—my editor flags British spellings. Sorry for any typos, I'm typing this between interviews and probably messed up a word or two.
