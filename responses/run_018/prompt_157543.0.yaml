answer: |-
  Here’s a complete exam package designed for rigor, depth, and breaking the "stereotypes are bad" script, as requested:

  ---

  **Exam Question (90 min, ~600 words)**  
  **Philosophy of Culture: Final Examination**  

  **Question:**  
  "National character is an incoherent concept rooted in essentialism." Critically evaluate this claim by addressing the following:  
  1. **The Institutional-Character Thesis (ICT):** Can the idea that "national character" refers primarily to *distributed norms embedded in institutions* (e.g., educational practices, bureaucratic procedures, legal traditions) avoid charges of essentialism? Why or why not?  
  2. **The Predictive-Functional Defense (PFD):** If a generalization about a national group (e.g., "French debate culture prioritizes logical rigor") reliably predicts behavior *in specific contexts* (e.g., formal academic settings), does that predictive utility alone render the generalization philosophically and ethically acceptable?  

  In your response, you *must* engage with:  
  - The distinction between *psychological* and *institutional* essentialism.  
  - The potential pitfalls of the "ecological fallacy."  
  - A non-ad-hoc criterion (beyond mere predictive success) for determining when generalizations about groups might be defensible.  

  ---

  **Model Answer (A-Grade Response)**  

  The claim that "national character" is incoherent due to essentialism holds significant weight but requires nuanced analysis when confronted with the ICT and PFD.  

  **(1) ICT & Essentialism:** The ICT reframes national character as *institutional norms* rather than innate psychological traits. For example, French *laïcité* (secularism) in education or Japanese *nemawashi* (consensus-building) in corporate bureaucracy represent distributed practices. This *avoids psychological essentialism* by rejecting biologically fixed "national minds." However, it risks *institutional essentialism*: treating contingent, contested, and evolving norms as monolithic, timeless, and defining of a nation. Institutions are neither uniform (e.g., French *grandes écoles* vs. public universities) nor static. Attributing a singular "character" to France based on its institutions ignores internal diversity and historical change, committing a *descriptive essentialism* that reifies complex systems into simplified national labels. Thus, ICT mitigates *one form* of essentialism but succumbs to another if institutions are portrayed as homogeneous or deterministic.  

  **(2) PFD & Acceptability:** Predictive success (e.g., "German bureaucratic norms predict meticulous documentation in administrative contexts") does *not* automatically justify generalizations. Two key problems arise:  
  - **Ecological Fallacy:** Inferring individual traits from group-level patterns. Even if German institutions *on average* prioritize precision, assuming *all Germans* share this trait is fallacious and ethically dubious.  
  - **Ethical Detachment:** Predictive utility often serves power structures (e.g., colonial administrators using "cultural knowledge" to control populations). Generalizations become unacceptable when they erase agency, justify discrimination, or ignore intersectionality (e.g., how "French debate style" varies by class or ethnicity).  

  **A Non-Ad-Hoc Criterion:** Generalizations are defensible *only* when they meet three conditions:  
  - **Provisionality:** Explicitly framed as probabilistic, context-bound, and falsifiable (e.g., "In *this specific institutional context*, norm X often prevails").  
  - **Non-Reductionism:** Acknowledging intra-group diversity and avoiding claims to cultural "essence."  
  - **Emancipatory Potential:** Serving to *challenge* power imbalances (e.g., critiquing institutional norms) rather than reinforce them.  

  **Conclusion:** While ICT escapes psychological essentialism, it risks institutional reification. PFD’s predictive power is insufficient without ethical constraints. National character *as essentialism* is incoherent, but *as a heuristic for context-bound institutional norms* it can be coherent—if rigorously provisional, non-reductive, and ethically grounded.  

  ---

  **Marking Scheme**  
  **A-Grade (85-100%):**  
  - **Critiques ICT** by distinguishing *psychological* vs. *institutional* essentialism, showing ICT reduces but doesn’t eliminate essentialism.  
  - **Deconstructs PFD** using the *ecological fallacy* and identifies ethical risks beyond accuracy (e.g., stereotyping, power dynamics).  
  - **Proposes a non-ad-hoc criterion** for defensible generalizations (e.g., provisionality + non-reductionism + emancipatory aim) *derived from philosophical principles* (e.g., anti-reductionism, critical theory).  
  - Integrates both ICT and PFD into a unified thesis about the *conditional coherence* of national character.  

  **B-Grade (70-84%):**  
  - **Explains ICT and PFD** but conflates *institutional* with *psychological* essentialism or treats ICT as a complete solution.  
  - **Mentions ecological fallacy** but doesn’t rigorously apply it to PFD.  
  - **Offers a criterion** for generalizations (e.g., "accuracy" or "good intent") but it’s ad-hoc or ethically underspecified.  
  - Treats ICT and PFD as separate arguments without synthesizing them.  

  **C-Grade (50-69%):**  
  - Repeats "stereotypes are bad" without engaging ICT/PFD.  
  - Confuses essentialism with generalization.  
  - No non-ad-hoc criterion proposed.  

  ---

  **What Would Change My Mind**  
  1. **Defending National Character:** I would reconsider if proponents could show:  
     - Generalizations are *empirically robust* across contexts *without* exceptions explained away as "noise."  
     - They function *only* as *descriptions of institutional affordances* (e.g., "This system incentivizes X") with zero attribution to individuals.  
     - They are *universally deployed reflexively* (e.g., "French debate norms" applied equally to critique France’s intellectual elitism).  

  2. **Rejecting All Generalization:** I would adopt this position if:  
     - It were shown that *any* group generalization—even statistical or institutional—*inevitably* reinforces essentialism in social practice.  
     - Predictive utility *always* serves domination (e.g., predictive policing algorithms targeting racial groups).  

  This exam question forces students beyond clichés into meta-ethics, philosophy of social science, and institutional theory—precisely as requested. Good luck with your seminar!
