answer: |-
  Good morning. For twenty years, this workshop, "Institutional Boundaries," has brought us together – philosophers exploring the foundations of rules, and architects, engineers, and public health officials building the structures and systems where those rules live. Today, as I step back from its direction, I want to focus not on the past, but on a persistent, unsettling tension I've observed across every table here. It’s the core instability of the very boundaries we study and build. I call it the **Display Paradox**.

  Consider the kind of rule we often grapple with: the hard limit, the "never cross this line," *not* because it always leads to the best outcome, but because crossing it is fundamentally wrong, regardless of consequences. Think of the architect forbidden to sacrifice certain safety margins for cost, even on a tight budget. The engineer mandated never to compromise a specific environmental safeguard, even if it slows progress. The public health official bound by an absolute rule protecting individual medical privacy, even when aggregated data *might* reveal a vital trend faster. The moral philosopher understands this rule's authority comes precisely from its refusal to be traded away for promised benefits. Its power *is* its inflexibility. It stands apart from outcomes.

  But here’s the paradox. How does an *institution* – a firm, a government agency, a professional body – preserve such a costly rule over time? How does it justify the expense, the delays, the forgone opportunities, year after year, decade after decade? It must point to the *disasters it believes it has prevented*. It builds the case for the rule by constantly *measuring* the potential risks held at bay, *displaying* scenarios of catastrophe avoided, and *celebrating* its own vigilance. "See?" the institution says, "This rule works! Look at the calamity we didn’t have!"

  **This creates the Display Paradox.** The very act of successfully upholding the rule, of *preventing* the disaster, becomes the seed of its own potential undoing. **Each successful prevention becomes evidence that the rule was never truly tested** – or at least, never tested in a way that felt unbearably costly *at the time*. The bridge didn't collapse *this time* because of the safety margin, but perhaps the next project feels so urgent, so constrained, that the margin seems excessive. The epidemic didn't spread *this time* because privacy was protected, but maybe the next outbreak feels so terrifying that the rule feels like a luxury. The institution, lulled by the quiet success, begins to wonder: "Was the rule ever *really* necessary? Or were we just being overly cautious?"

  **For those of you building and safeguarding our physical and social world (architects, engineers, public health officials):** This paradox means you cannot treat the rule *merely* as a prudent calculation. If you say, "We follow this rule *only* because it usually prevents bad things," you destroy its core strength. The moment a truly massive benefit seems possible *only* by breaking the rule – the "perfect storm" where the cost of upholding it feels astronomical – the calculation might flip. "This time," you might think, "the risk is worth it; the disaster probably won't happen." But that’s precisely when the rule is most crucial! Reducing it to a flexible heuristic erodes the very protection it was designed to provide. Its survival depends on proving its worth, yet proving its worth makes it seem dispensable.

  **For those of you exploring the nature of rules and moral constraints (philosophers):** This paradox shows why a neat reconciliation is conceptually impossible. The rule's *authority* demands it stand firm, independent of outcomes – its power is its refusal to be bargained. Yet, its *institutional survival* demands it constantly justify itself *through* the outcomes it prevents. These two demands pull in opposite directions. The institution needs to *show* the rule works to keep it alive, but showing it works undermines the perception of its necessary costliness, eroding the will to uphold it when that cost finally becomes immense. Authority and institutional sustainability are locked in an unstable dance.

  This, then, is the unstable ground we stand on after twenty years. The Display Paradox: Rules that claim authority *because* they ignore outcomes must be defended *by* invoking outcomes. Success breeds complacency precisely when vigilance is most expensive. There is no tidy synthesis here, only the persistent tension. Our task in this anniversary session is not to resolve it, but to map its contours more clearly, to understand why both the rigidity of the rule *and* the institution's need to prove its worth are inescapable, yet fundamentally at odds.

  Let that tension guide our discussions. Welcome to the twentieth session of "Institutional Boundaries."
