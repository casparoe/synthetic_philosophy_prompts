answer: |-
  Here’s a decision-tree taxonomy for your scene, phrased as debatable questions with named endpoints (7 leaves total). Empty/incoherent combos are flagged:

  ### Root Question:  
  **1. Do cultural values *ever* cause major historical change, or are they just stories told after the fact?**  
     - *If "No, values are just stories/effects"* → **Hard Materialist** (e.g., "History is shaped by technology, resources, or class struggle—values rationalize outcomes.")  
     - *If "Yes, values can be causes"* → Proceed to Question 2.  

  ---

  ### Branch for "Yes" (Values have causal power):  
  **2. Do values need institutions (churches, laws, etc.) to change history, or can they act directly?**  
     - *If "Values need institutions"* → Proceed to Question 3.  
     - *If "Values act directly, like invisible forces"* → **Direct-Value Animist** (e.g., "Ideas have agency—Protestant zeal reshaped minds first, *then* built institutions.") *(Note: "Reverse causal arrow" is incoherent here—see warning below.)*  

  ---

  ### Branch for "Values need institutions" (Institutionalists):  
  **3. Was Weber right that Protestant values *specifically* enabled modern capitalism?**  
     - *If "No, the link is exaggerated/wrong"* → **Structural Overdeterminer** (e.g., "Many factors (material, religious, political) fused—no single cause dominates.")  
     - *If "Yes, the link holds"* → Proceed to Question 4.  

  **4. Could capitalism have instead *created* the Protestant ethic?**  
     - *If "Yes, capitalism reshaped values"* → **Reverse-Causal Culturalist** (e.g., "Calvinism rationalized emerging profit-seeking—it didn’t birth it.")  
     - *If "No, values came first"* → **Institutional Weberian** (e.g., "Protestantism’s institutional power (churches, sermons) forged capitalism’s spirit.")  

  ---

  ### Branch for "Values act directly" (Direct Animists):  
  **5. Can ideas spread like viruses, overriding institutions?**  
     - *If "Yes, ideas are self-replicating forces"* → **Meme-Pathogen** (e.g., "Predestination ‘infected’ Europe, bypassing structures to rewire economic behavior.")  
     - *If "No, direct influence isn’t contagious"* → **Direct-Value Animist** (e.g., "Values are ambient energies—Protestantism’s ‘vibe’ directly inspired thrift.")  

  ---

  ### Warnings & Empty Combos:  
  - **Direct-Value Animist + Reversed Arrow**: Incoherent. If values act *directly*, they can’t be *created* by material results (capitalism) without circular logic.  
  - **Structural Overdeterminer** exists outside Weber’s thesis—it rejects singular causality.  
  - **Meme-Pathogen** requires direct action + contagion (no institutions needed).  

  ---

  ### Taxonomy Map:  
  ```mermaid
  graph TD
  A[1. Do values cause change?] -->|No| B[Hard Materialist]
  A -->|Yes| C[2. Need institutions?]
  C -->|No| D[5. Spread like viruses?]
  D -->|Yes| E[Meme-Pathogen]
  D -->|No| F[Direct-Value Animist]
  C -->|Yes| G[3. Weber's link real?]
  G -->|No| H[Structural Overdeterminer]
  G -->|Yes| I[4. Capitalism made the ethic?]
  I -->|Yes| J[Reverse-Causal Culturalist]
  I -->|No| K[Institutional Weberian]
  ```

  ### How Characters Use It:  
  - **Economist**: Starts at "Hard Materialist" or "Reverse-Causal," scoffs at "Animist."  
  - **Monk**: Defends "Institutional Weberian" or "Direct-Value Animist," intrigued by "Meme-Pathogen."  
  - **Nuanced Side Character**: "Structural Overdeterminer" to end the argument.  

  Each node is a debatable fork—no jargon needed. Good luck!
