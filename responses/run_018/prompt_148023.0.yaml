prompt: |-
  ok so ive been trying to wrap my head around bayesian updating—like you change your beleif when you see new stuff, kind of like tweaking a recipe after tasting it. my friend uses a kitchen-scale analogy: you weigh each ingredient and update the total weight in your head. but then theres this old-evidence problem—say you weighed the flour yesterday, and now you realize your scale was actually off by ten grams back then, even though the flour itself hasnt changed. audit this scale thing for me: what maps onto what, where it breaks especially when old evidence gets "re-weighed" like that, what it sneaks in about beleifs being exact numbers, and does it still support the claim that rational people should never revise beliefs about stuff they already knew? please give me exactly five numbered points, each just one or two sentences, with no intro or conclusion.
reasoning: |-
  Okay, the user is asking about Bayesian updating, using a kitchen-scale analogy their friend provided. They want me to audit this analogy, focusing on how it handles old evidence - specifically when you realize your scale was off by ten grams for flour weighed yesterday. They're concerned about belief revision for previously known information and want five precise points.

  I need to map the analogy components: flour represents evidence, scale measurements are belief updates, and total weight is the posterior probability. The user is grappling with how Bayesian updating treats old evidence when new information about reliability emerges, which relates to the "old evidence problem" in philosophy of science.

  The user's deeper needs seem to be understanding belief revision paradoxes - whether rational people should ever update beliefs about settled facts. The scale analogy breaks when reliability changes retroactively, and they're questioning if beliefs should be quantifiable numbers. I should address these epistemology concerns through the lens of this cooking metaphor.

  For the five points: First, I'll explain the mapping (evidence→ingredients). Second, show where it breaks (retroactive calibration). Third, discuss belief quantification assumptions. Fourth, clarify that reliability shifts justify revising old interpretations. Fifth, confirm this supports conditional belief updates rather than absolute knowledge claims. Each point must be one or two sentences as requested.

