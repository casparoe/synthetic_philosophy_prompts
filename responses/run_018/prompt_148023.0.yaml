answer: |-
  1.  Flour = evidence; scale reading = initial belief update; total weight = posterior probability; scale accuracy = reliability of evidence source.
  2.  It breaks when realizing *past* scale inaccuracy: you must retroactively "re-weigh" old evidence (flour) using the *new* knowledge about the scale's past unreliability.
  3.  It assumes beliefs (weights) are precise, quantifiable numbers, which is a simplification; beliefs are often fuzzier or harder to measure exactly.
  4.  Revising beliefs about old evidence *is* rational here because you gained new information *about the evidence's reliability* (the scale's past error), not the evidence itself (the flour).
  5.  This supports the claim: you only revise beliefs about *how strongly that old evidence supports a hypothesis*, not the raw fact of the evidence existing; you update the *interpretation*, not the event.
