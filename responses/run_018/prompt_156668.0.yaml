answer: |-
  Bertram stood confidently in the lecture hall, adjusting his tweed jacket. "Luminosity fails at the *boundaries*, yes," he conceded, "where one is only *slightly* cold. But for the *clear cases*! If one is *unambiguously* cold—say, shivering in a blizzard—then one *knows* one is unambiguously cold! Luminosity holds where it matters!"

  To demonstrate, he stepped into a specially prepared climate chamber. It was initially a bracing 5°C. Bertram shivered dramatically. "See? Unambiguously cold! I *know* I am unambiguously cold. Luminosity preserved!"

  A hidden technician lowered the temperature by one degree to 4°C. Bertram paused. "Still cold, certainly. But... to *know* I know I'm unambiguously cold... well, the KK principle requires I know that the state *from which* I knew I was unambiguously cold was itself a clear case. Was my knowledge at 5°C based on a *clear* feeling of unambiguous cold? Absolutely! I shivered!"

  Down to 3°C. Bertram shivered harder. "Still cold! But... to *know* I know I know I'm unambiguously cold now... I must know that my knowledge *at 4°C* that I knew at 5°C was based on a clear case... was 4°C *itself* sufficiently clear? Hmm. It felt colder than 5°C, which was clear... so yes, 4°C was also a clear case!"

  Down to 2°C. Bertram's teeth chattered. "Undeniably cold! But... for KK^3 now... I need to know that my state *at 3°C*, whence I knew my state at 4°C was clear (which was based on knowing 5°C was clear), was *itself* a clear case... Was 3°C *really* unambiguous? It was only one degree from 4°C, which was one degree from the original clear case... but... perhaps the boundary is near? I need to verify the clarity of my earlier verification..."

  Down to 1°C. Bertram hugged himself, blue-lipped. "F-F-Freezing! B-But... to K-K-Know I know I know I know... I must ascertain that my epistemic state *at 2°C*, where I was verifying the clarity of my verification at 3°C of the verification at 4°C concerning the original clarity at 5°C... was *itself* beyond the boundary of vagueness! Was 2°C *unambiguously* cold, or was I already slipping into... doubt?!"

  As the technician prepared to drop to 0°C, Bertram stood rigid, eyes wide, mind frantically chasing the receding specter of his original "clear case" back through the layers of KK-induced verification, each step demanding he prove the previous step wasn't *already* the boundary he was trying to avoid... leaving him utterly frozen, not just by the cold, but by the infinite regress of knowing he knew.
