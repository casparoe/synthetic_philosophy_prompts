answer: |-
  Here is the conceptual translation of the Whig historiographical critique into the vocabulary of narrative craft, followed by the residue report:

  **Translated Critique (Whig History as Narrative Theory):**

  1.  **Dramatic Irony as Unwarranted Burden:** Whig history imposes **dramatic irony** on historical actors *from the future*, making them unwitting pawns in a story whose ending (the present) they cannot know. Their choices are framed not by their own context but by the reader's knowledge of what comes later.
  2.  **Anachronistic Characterization:** It commits **anachronistic characterization** by judging historical figures against values, moral frameworks, and institutional ideals (like liberal democracy, universal human rights, scientific rationality) that belong to the **implied reader's retrospective vantage**, not the character's own **diegetic time**. Their "success" or "failure" is measured by modern standards.
  3.  **Teleological Plot Architecture:** Its core structure is **teleological plot architecture**. The narrative is rigidly organized around the present moment as the predetermined, necessary **narrative closure**. Every event, decision, and figure is evaluated solely on its contribution to reaching this fixed endpoint, making historical development appear linear and inevitable.
  4.  **Implied Reader's Vantage as Distorting Lens:** The **implied reader's retrospective vantage** becomes the *primary* lens, overshadowing the historical actors' own perspectives, anxieties, and possibilities. The past exists only as a prologue to "us."
  5.  **Prolepsis Mistaken for Causality:** Whig history confuses **prolepsis** (flashforward, foreshadowing) with actual causation. Later outcomes are projected backwards, not as literary hints, but as inherent drivers within the past itself. Events are selected and emphasized *because* they seem to prefigure the present, creating a false sense of destiny.
  6.  **Closure as Historical Inevitability:** **Narrative closure** (the achieved present) is presented not as a contingent outcome among many, but as the *only possible* and *meaningful* resolution to the story. Alternative paths and dead ends are suppressed or dismissed as irrelevant deviations.
  7.  **Order of Narration Dictates Diegetic Meaning:** The **order of narration** (starting in the past, ending in the present) dictates the perceived meaning within **diegetic time**. The later outcome retrospectively defines the "true" significance of earlier events for the characters, violating the principle that meaning emerges from the context *of their moment*.

  **Residue Report:**

  1.  **Clean Mapping:**
      *   **Teleological Plot Architecture ↔ Whig Inevitability:** This is the core structural parallel. Organizing the entire narrative arc towards a predetermined, valorized endpoint (the present) maps directly.
      *   **Anachronistic Characterization ↔ Judging by Modern Standards:** Evaluating historical figures by values alien to their time is fundamentally anachronistic characterization.
      *   **Dramatic Irony (Imposed from Future) ↔ Burden of Unknowable Future:** Framing past actors as tragically or foolishly unaware of the "correct" path towards the reader's present is a direct use of dramatic irony, albeit one that distorts historical understanding.
      *   **Implied Reader's Vantage ↔ Retrospective Judgment:** Privileging the modern reader's perspective over the historical actors' own worldview is a perfect mapping.
      *   **Prolepsis (as False Driver) ↔ Projecting Outcomes Backwards:** The mechanism of using known outcomes to shape the selection and emphasis of past events is structurally identical to using prolepsis to create false foreshadowing *as if it were inherent cause*.

  2.  **Mapping Requiring Distortion:**
      *   **Narrative Closure ↔ Inevitability of the Present:** While closure in fiction *can* feel inevitable within its own logic, it serves an aesthetic/emotional purpose. Applying this concept to *real history* distorts the historiographical claim by conflating an artificial sense of resolution (closure) with a claim about real-world determinism. Closure is a *narrative device*; Whig inevitability is a *historical claim* disguised as narrative.
      *   **Prolepsis (Intentional vs. Unconscious):** In skilled fiction, prolepsis is a deliberate tool. In Whig history, the "prolepsis" (projecting the present backwards) is usually an unconscious bias or faulty methodology, distorting the concept by removing authorial intent.
      *   **Diegetic Time vs. Order of Narration ↔ Contingency:** While manipulating time order can reveal meaning, the claim that *only* the chronological end-point defines the meaning of earlier events within the diegesis distorts the nuanced relationship between sequence and meaning in complex narratives. Whig history asserts this rigidly; narrative theory allows for more fluid interplay.

  3.  **No Narrative Counterpart (The Irreducible Residue):**
      *   **The Claim of Real-World Progress:** The core Whig assertion that history *objectively demonstrates* moral, institutional, or social progress towards a superior present has *no equivalent* in the grammar of fiction. Fiction creates its own internal truths and values; it cannot validate claims about the *actual* trajectory of human society. Narrative mechanisms can *show* progress *within the story*, but they cannot prove it exists in reality. This is where the framework of fiction fundamentally breaks down as a vehicle for historical knowledge claims. Fiction's "progress" is aesthetic or thematic; Whig history's is asserted as empirical.

  **On "The Ending Writes the Beginning":**

  The novelist's intuition **is structurally analogous but substantively different** from the Whig fallacy, revealed by narrative theory:

  *   **Structural Analogy:** Both involve the endpoint shaping the selection, emphasis, and interpretation of earlier events. In both, earlier moments gain significance primarily from their relationship to the later outcome.
  *   **Substantive Difference (Revealed by Narrative Theory):**
      *   **Conscious Craft vs. Unconscious Fallacy:** The novelist *intentionally* uses "the ending writes the beginning" as a **craft technique** to create cohesion, foreshadowing, thematic resonance, and dramatic irony *within the fictional construct*. This is a recognized tool of **teleological plot architecture** employed knowingly.
      *   **Artifice Acknowledged vs. Truth Claimed:** Crucially, fiction operates within a **suspension of disbelief**. Readers understand the novelist's shaping hand. The teleology is accepted as part of the *artifice*. The Whig historian, however, presents their teleological narrative *not as artifice*, but as an accurate, objective account of *how history actually unfolded*. They deny (or are unaware of) their own crafting hand, masking the fallacy as discovery.
      *   **Contingency Denied vs. Contingency Optional:** Whig history *necessarily* denies historical contingency; the present *had* to happen. A novelist using "the ending writes the beginning" *can* still imply contingency within the story's internal logic (e.g., showing the ending was one fragile possibility). The narrative technique doesn't inherently demand the denial of contingency in the way the Whig fallacy does for real history.

  **Conclusion:** While narrative theory provides powerful tools to *describe* the structure and mechanisms of Whig history (teleology, anachronism, irony, prolepsis), it cannot validate Whig history's core claim of *real-world historical progress*. The framework breaks down precisely because fiction deals in constructed meaning and internal coherence, not empirical claims about the actual past. The novelist's "ending writes the beginning" is a *technique of artifice*, consciously deployed; the Whig fallacy is an *error of interpretation*, mistaking a constructed narrative for an inevitable reality. Narrative theory highlights this difference: one owns its teleology as craft, the other disguises its teleology as truth.
