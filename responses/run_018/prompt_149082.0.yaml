answer: |-
  ## The Bootstrap Sestina

  Here stands the proof: I see my open **hands**,
  Unquestioned ground. These seeing, faithful **eyes**
  Report the world. The simple, swift **proof**
  Builds on itself: what shows me this earns **trust**.
  No need for some confirming, outer **mirror**,
  The structure stands. I sense the closing **loop**.

  But how escape the tightening, frail **loop**?
  My confidence begins with sensed **hands**.
  Can sight vouch for itself? Where's the **mirror**
  To show the lens is clean? My own sure **eyes**
  Declare their worth, deriving earned **trust**
  From this: they show me hands. A fragile **proof**.

  Is this sufficient, self-contained **proof**?
  It feels secure within the seamless **loop**.
  From touch of flesh, I borrow latent **trust**
  For vision's source. The presence of my **hands**
  Depends on sight, which now my clear **eyes**
  Claim functions right. Where shines the needed **mirror**?

  An independent check, that test **mirror**,
  Is absent. Still, I cling to this frail **proof**:
  What brought the hands must work. My own two **eyes**
  Assert their truth within the growing **loop**.
  The evidence? The very sensed **hands**
  They show me now. It grounds my given **trust**.

  Is knowledge built on such reflexive **trust**?
  No outward gauge, no validating **mirror**,
  Just this sensation: here reside my **hands**,
  Therefore the means is sound. A bootstrapped **proof**
  That spins itself within the silent **loop**,
  Authorized solely by these watching **eyes**.

  The instruments themselves, these hopeful **eyes**,
  Proclaim their worth, demanding simple **trust**.
  They point back to the start, the waiting **mirror**
  Of their own success – the seen **hands**.
  They cite the hands as their own perfect **proof**,
  Completing the taut, inescapable **loop**.

  The **eyes** invoke the **hands** to grant them **trust**,
  A **proof** without a **mirror**, sealed within the **loop**:
  The **hands** prove **eyes** prove **hands** – the **loop** is **proof**.
