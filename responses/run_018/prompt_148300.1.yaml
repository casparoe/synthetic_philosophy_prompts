  Here’s the toast, weaving Ubuntu’s relational core, her agency, and the "interruption" into a narrative accessible to all:

  ---

  **Toast for Dr. Amara Okonkwo**

  Family, friends, colleagues, students, everyone brought together by Amara… look around. This room is Amara’s fingerprint. Not carved in stone, but *woven* – into the stories we carry, the conflicts resolved, the community held.

  We talk about legacy. But Amara taught us that legacies aren’t statues built by lone heroes. They’re living tapestries. Your thread only shines because it’s recognized, held tight, given meaning by the threads around it. That’s Ubuntu: "I am because *we* are." Our personhood isn't locked away inside us; it breathes in the space *between* us, in how we see each other.

  So when we celebrate Amara tonight, we can't just lift *her* up alone on a pedestal. That would unravel the very fabric she spent decades weaving. Her brilliance wasn't some solitary light; it was the spark that ignited *countless* other lights in this room and beyond. It was the courage she saw in a client, the insight she drew from a colleague, the hope she reflected back to a community.

  **But!** (And this is crucial.) Saying we are all connected doesn’t mean Amara disappeared into the collective. Ubuntu isn’t mush! Look at the strong lines, the bold choices that define this tapestry! **She** was the one who said "No" to the easy money that would have compromised our values. **She** was the one who refused mediations when power imbalances were too great. **She** set boundaries to protect this space. Her agency, her fierce *particular* will, shaped every single knot and pattern here. Her personhood wasn't private, but it was powerfully *present* in how she engaged the network.

  Which brings me to something profound Amara showed us, maybe without ever naming it: the power of deliberate interruption. Five years ago, she didn't just delegate or step back slowly. She *stopped*. She suspended her own central role in mediations. Not because she was done, but because she understood something vital: sometimes, for the web to grow stronger, a key thread needs to step aside. It’s not exile, it’s not failure. It’s a radical act of trust and renewal. She interrupted her own place, her own constant recognition in the daily work, so that others could step *fully* into the space she held. So the center could find its voice beyond hers. That wasn't the beginning of leaving; it was a deep, intentional act of *strengthening* the "we."

  And now, this next step – retirement – feels like the completion of that beautiful, challenging interruption. It’s not vanishing. It’s trusting that the tapestry, the network of recognition she helped create, is strong enough, vibrant enough, *different* enough, to hold her personhood now in a new way: as a founder, a mentor, a grandmother, a friend – woven in, not carrying the whole weight.

  So, Amara, we raise our glasses *to* you, but we also raise them *with* you, and *because* of the countless connections you nurtured. Thank you for teaching us that true strength is relational. Thank you for your fierce choices that defined the edges. Thank you for the profound courage to interrupt yourself so the rest of us could find our voice. The work continues, the web holds, *because you showed us how*.

  To Dr. Amara Okonkwo! May the connections you forged continue to sustain us all.

