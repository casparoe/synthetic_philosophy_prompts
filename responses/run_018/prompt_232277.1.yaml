prompt: |-
  I keep reaching for the same distinction whenever I think about partial belief, and I want a principle that earns it rather than one I have simply absorbed. The distinction is between states of uncertainty that are best represented by a single exact probability and states that are best represented by a range or set of probabilities. I have strong but apparently inconsistent instincts about when each is called for, and I want you to extract the principle behind them — or tell me which of my instincts must go.

  Here are the cases as they strike me.

  1. A coin I have personally tested and satisfied myself is fair, about to be tossed once: I assign exactly one-half to heads and would bet at even odds with no reluctance.

  2. A coin handed to me by a stranger, about whose bias I know nothing, about to be tossed once: I refuse to move from its two-sided symmetry to a probability of one-half. My opinion about heads is more honestly represented as the entire interval from zero to one. Symmetry alone does not force a number on me.

  3. A lottery with one hundred numbered tickets and a known random draw: I assign exactly one one-hundredth to ticket thirty-seven winning. No imprecision whatsoever.

  4. An urn containing ninety balls, thirty red and the remaining sixty either black or yellow in a wholly unknown mix, one ball to be drawn: I assign exactly one-third to red. But for black I want to say only that my probability is somewhere from zero to two-thirds. One urn, one draw, three possible colors — and yet my opinion about red is exact while my opinion about black is only a range. I cannot yet say what licenses the difference.

  5. Two equally credible models, built by equally competent methods, give probabilities of rain tomorrow of thirty percent and seventy percent, and I have no other relevant information: I do not split the difference at fifty. I want my opinion to be the whole interval from thirty to seventy percent. If both models had said thirty percent, I would be at thirty percent sharply. So imprecision seems to arise from unresolved conflict between equally good sources, not from the mere fact that a number falls somewhere short of certainty.

  6. Before I have looked at a page I know to be in English, I have no opinion at all about whether the next word on it contains the letter e — not even a vague range. After seeing that it is ordinary English prose, I have a rough interval. After tallying the letter frequencies on the page, I have something close to a point value. This makes imprecision look like a stage on the way to exactness. Yet in the stranger's coin case no purely reflective work sharpens my judgment, while after ten thousand observed flips I would be very nearly sharp. In the two-models case, though, no amount of computation tells me which model is right. So imprecision is not merely unperformed arithmetic, but I cannot state the difference precisely.

  7. In small-stakes choices I am content to pick a single number from the middle of my interval and act on it. In a one-off high-stakes decision I refuse to do this; I want the whole interval to constrain my choice, so that a wager must look acceptable everywhere in the interval before I take it. I cannot tell whether this is a genuine normative insight or a rationalization of my own sloppiness.

  My rough and admittedly inadequate principle is this: a sharp credence is licensed exactly when either (a) I know an objective chance that fixes the value, or (b) my evidence singles out a unique value to the exclusion of all others; otherwise, my opinion should be represented by the class of probability functions compatible with my evidence.

  Give me the principle, or small family of principles, that best captures these verdicts. State it precisely, say which cases motivate each clause, and identify which of my verdicts it cannot accommodate and what I should replace them with. Then apply it to at least one case I have not listed, such as this one: a coin is either biased two-to-one toward heads or two-to-one toward tails, exactly one of these biases obtains, and I know nothing about which. Should that be one-half sharp by symmetry, or the imprecise interval from one-third to two-thirds? Finally, answer the question the cases keep pressing on me: is the boundary between precise and imprecise belief a difference in kind or only a difference in degree?
reasoning: |-
  Okay, the user is grappling with when to assign precise probabilities versus imprecise intervals for partial beliefs. They've provided several thought-provoking examples that seem to pull in different directions, and they're seeking a unifying principle. 

  First, let me unpack their core tension. On one hand, they intuitively recognize cases where exact probabilities feel mandatory (fair coins, lotteries). On other hand, they resist forcing exact numbers when information is conflicting (stranger's coin, two weather models). Their proposed principle—sharp credence only when objective chance exists or evidence uniquely determines a value—is a good starting point but needs refinement.

  Hmm... their examples reveal three key dimensions: 1) Known physical symmetries (fair coin) vs complete ignorance (stranger's coin) 2) Conflict between equally credible models (weather) vs gradual evidence accumulation (letter frequency) 3) High-stakes decisions exposing their discomfort with collapsing intervals. 

  The urn case (#4) is particularly telling. Why is red exact while black is imprecise? This suggests the distinction hinges on whether evidence fully determines the probability. For red, the evidence fixes the value (30/90 balls). For black, the evidence constrains but doesn't determine (anywhere from 0-60 black balls). 

  Ah! The weather model conflict (#5) clarifies something important: imprecision isn't about lack of calculation but unresolvable epistemic conflict. Even after infinite reflection on the stranger's coin, you'd still have no basis to favor any particular bias—hence the interval persists. But after seeing letter frequencies (#6), calculation does sharpen belief. 

  For their unlisted case: the two-possible-biases coin. Symmetry would tempt one toward 0.5, but the actual possible outcomes (H or T) have probabilities that could be 2/3 or 1/3 depending on the bias. So the interval [1/3, 2/3] better reflects the underlying uncertainty. 

  The high-stakes point (#7) reveals that imprecise beliefs aren't just epistemic states but play a functional role in decision-making. When consequences are severe, we rightly refuse to pretend our uncertainty is more precise than it is. 

  Final verdict: The boundary is both. There's a qualitative difference between evidence that fully constrains probability (sharp) vs not (imprecise), but within imprecise beliefs, intervals can be narrower (weather models) or wider (stranger's coin)—that's quantitative. The urn shows both in one scenario!
answer: |-
  Your instincts reveal a coherent distinction grounded in **epistemic determinability**. Below is a principle that systematizes your cases, identifies tensions, and resolves your unlisted scenario. The core insight: **Precise credence requires evidence that uniquely determines a probability value; imprecision arises when evidence underdetermines this value, leaving multiple probabilities epistemically permissible.**

  ### The Epistemic Determinability Principle (EDP)
  A rational agent's belief about an event \(E\) is:
  - **Precisely representable** as a single probability \(p(E)\) if and only if the agent's total evidence **uniquely determines** that \(p(E)\) is the only probability function compatible with that evidence.
  - **Imprecisely representable** as a set \(\mathcal{P}\) of probabilities if and only if the evidence **underdetermines** \(p(E)\), making multiple probability functions compatible with it.  
  *(Where "compatible" means consistent with logical constraints, physical symmetries, and probabilistic evidence.)*

  ---

  ### How EDP Captures Your Cases
  1. **Fair coin**: Evidence (physical symmetry + testing) uniquely determines \(p(\text{heads}) = 0.5\).  
     → **Sharp credence**.  
  2. **Stranger's coin**: No evidence breaks symmetry beyond indifference; all biases are compatible.  
     → **Imprecise**: \([0,1]\).  
  3. **Lottery**: Evidence (100 tickets, random draw) uniquely determines \(p(\text{win}) = 0.01\).  
     → **Sharp credence**.  
  4. **Urn**:  
     - **Red**: Evidence (30 red out of 90 balls) uniquely determines \(p(\text{red}) = 1/3\).  
     - **Black**: Evidence is compatible with any number of black balls (0–60), so \(p(\text{black})\) can be any value in \([0, 2/3]\).  
     → **Red sharp, black imprecise**.  
  5. **Conflicting models**: Evidence (two equally credible models) permits \(p(\text{rain}) = 0.3\) or \(0.7\), but nothing singles out an intermediate value.  
     → **Imprecise**: \([0.3, 0.7]\), *not* 0.5.  
  6. **Letter frequency**:  
     - **No evidence**: No constraints → **No opinion** (not even an interval; total ignorance).  
     - **Ordinary prose**: Evidence constrains \(p(\text{e})\) to a historical frequency range (e.g., [0.08, 0.13]) → **Imprecise**.  
     - **Tallying**: Evidence uniquely determines a frequency → **Sharp**.  
  7. **Decision-making**:  
     - **Small stakes**: Pragmatically collapsing the interval is low-risk.  
     - **High stakes**: The full set \(\mathcal{P}\) must guide decisions (e.g., reject bets unacceptable for *any* \(p \in \mathcal{P}\)).  
     → **Normatively justified**: Reflects caution under unresolved uncertainty.

  ---

  ### Tensions in Your Instincts and Resolutions
  - **Symmetry alone ≠ precision**: Case 2 (stranger's coin) shows symmetry without unique determinability → imprecision. EDP rejects symmetry as *sufficient* for sharpness.  
  - **Conflict → imprecision**: Case 5 (weather models) confirms that conflict without a uniquely determined value mandates an interval.  
  - **Sharpness ≠ certainty**: Cases 1 and 3 are sharp but uncertain. EDP ties precision to evidence structure, not certainty.  
  - **"Unperformed arithmetic"**: In case 6, tallying letters *adds evidence* that uniquely determines the value. For the stranger's coin, no evidence can be added without new data.  
  → **Resolution**: Imprecision isn't "unfinished calculation"; it's evidence underdetermination that persists without new information.

  ---

  ### Your Unlisted Case: Ambiguous Bias Coin
  - **Scenario**: A coin is biased 2:1 for heads (H) *or* 2:1 for tails (T), with no indication of which.  
  - **EDP verdict**:  
    - Evidence permits two probability functions:  
      \(p_1(\text{H}) = 2/3\), \(p_1(\text{T}) = 1/3\)  
      \(p_2(\text{H}) = 1/3\), \(p_2(\text{T}) = 2/3\).  
    - No unique value is determined → **Imprecise belief**.  
    - The set for \(p(\text{H})\) is \(\{1/3, 2/3\}\), *not* \([1/3, 2/3]\) (unless evidence suggests intermediate biases are possible).  
  - **Why not 0.5?** Symmetry between *biases* doesn’t imply symmetry in *outcomes*. Assigning 0.5 would ignore the evidence that heads is *either* likely *or* unlikely.

  ---

  ### Boundary: Kind or Degree?
  **Both, but with a qualitative core.**  
  - **Difference in kind**: Evidence either uniquely determines a probability (sharp) or not (imprecise). This is binary and qualitative.  
  - **Difference in degree**: Imprecise beliefs can have "narrower" sets (e.g., [0.3, 0.7] in weather models) or "wider" ones (e.g., [0,1] for the stranger's coin). This reflects the *extent* of underdetermination.  

  ### Why This Fits Your Urge
  Your cases show that precision arises from **evidentiary uniqueness** (cases 1,3,4-red,6-final), while imprecision stems from **evidentiary gaps** (cases 2,4-black,5,6-initial). The EDP formalizes this intuition:  
  - **"Singles out a unique value"** → your (b).  
  - **"Compatible with evidence"** → your range.  
  It discards (a) "objective chance" as unnecessary (the lottery lacks "chance" but is sharp due to evidence).  

  ### Final Advice
  - **Keep**: Your instincts about symmetry, conflict, and evidence accumulation.  
  - **Revise**: Symmetry alone *never* forces sharpness (case 2). Conflict *always* causes imprecision unless resolved (case 5).  
  - **Use**: EDP to diagnose when evidence suffices for precision. In high-stakes decisions, let the full interval guide you—this is normative, not sloppy.  

  This principle earns your distinction: **precision is the exception, reserved for when evidence leaves no room for doubt about the probability value itself.** All else is imprecise.
