  I should separate settled points from contested ones. It's settled that consciousness requires a physical basis and isn't limited to humans. Degrees of consciousness are widely accepted. But the necessity of neural structures like cortex or integration mechanisms is contested. Also, whether colonial organisms can be conscious is highly debated.

  Graded vs. binary theories: some like IIT propose a continuum, while others see thresholds. The user needs to know both are options, with graded being more flexible but less clear-cut. 

