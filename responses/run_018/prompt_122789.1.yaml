  ### Analysis of Implicit Welfare Theory in Aquaculture Standards

  Your description of aquaculture welfare standards is largely accurate for dominant global practices (e.g., ASC, BAP, RSPCA), with minor corrections noted in the JSON. The implicit theory rests on **negative utilitarianism**—prioritizing the reduction of identifiable suffering over promoting positive states—combined with **pragmatic measurability constraints**. Welfare is framed as the absence of harms (e.g., injury, disease, distress) rather than the presence of flourishing. Key commitments include:  
  - **Harm avoidance**: Suffering must be minimized, but death is not inherently harmful if it prevents greater suffering.  
  - **Group-level management**: Individual welfare is inferred from population-level metrics (e.g., mortality rates) due to scalability.  
  - **Scientific uncertainty and feasibility**: Standards reflect tractable interventions and conservative interpretations of sentience evidence.  

  #### Interrogating the Five Points:  
  1. **Temporal Structure**:  
     The asymmetry (duration unlimited, cumulative mortality penalized) suggests welfare is assessed as a *series of states*, not an aggregated lifetime experience. Mortality rates act as a proxy for suffering intensity, but duration isn't capped because:  
     - The practice assumes that if conditions meet thresholds at each time-slice, welfare is "acceptable" regardless of duration.  
     - Rivals ruled out: A strict "whole-life" view where welfare integrates over time (e.g., hedonistic utilitarianism) would require duration limits.  
     - *Contested*: Whether welfare aggregates additively is debated (e.g., Browning and Veit vs. Yeates).  

  2. **Death**:  
     High mortality is a welfare failure as evidence of *antecedent suffering*; culling is a *mitigation tool*. The practice presupposes:  
     - Death is not a harm to the animal (no interest in future existence).  
     - Culling prevents extended suffering, so net welfare is improved.  
     - *Contested*: Whether death harms non-human animals depends on theories of consciousness (e.g., Singer vs. McMahan).  

  3. **Finfish–Crustacean Asymmetry**:  
     This split implies a **sentience threshold** where only animals with robust evidence of phenomenal consciousness (e.g., finfish nociception) warrant full protections. Crustacean standards reflect:  
     - Principled stance: Sentience requires neural substrates for integrative pain (e.g., Sneddon's criteria), which crustaceans may lack.  
     - Convenience factors: Stunning crustaceans is costly and technically challenging; political will is low.  
     - *Contested*: Crustacean pain evidence is mixed (e.g., Elwood’s studies vs. Diggles’ critiques).  

  4. **Unit of Assessment**:  
     Group-level thresholds (e.g., mortality rates) are used because:  
     - Individual monitoring is impractical at scale.  
     - Welfare is viewed as a herd-level outcome (e.g., disease spread, stress cascades).  
     - *Tension*: This ignores individual variation (e.g., resilient animals masking suffering peers).  

  5. **Fasting**:  
     Classifying fasting as welfare-positive aligns with **negative welfare**: avoiding immediate harms (e.g., vomiting during transport). A **positive/flourishing view** (e.g., Brambell’s "Five Freedoms" expanded) would forbid fasting if it causes hunger (a deprivation), but:  
     - *Underdetermined*: Standards avoid this by not measuring hunger (empirically hard to assess).  

  #### Pressure-Testing the Lifetime Integral Metric:  
  Rewriting standards with a ceiling on "negative-welfare-days" (integrated suffering) would indeed:  
  - Favor short, dense cycles over longer, roomier ones.  
  - Make culling a welfare "improvement."  
  - Penalize systems with long lives but episodic suffering.  

  **Why it follows**:  
  - The consequence arises directly from the **additive aggregation of welfare over time**, which current standards reject.  
  - **Load-bearing commitment**: Current practice rejects temporal aggregation, instead treating welfare as non-cumulative state-based thresholds.  
  - **Blocking the consequence**: Standards would need to add:  
    - A *minimum lifespan* requirement to prevent abbreviated lives.  
    - *Positive welfare credits* to offset negative integrals (e.g., rewarding enrichment).  
    - *Non-additive evaluation* (e.g., prioritizing peak suffering reduction).  

  #### Epistemic Clarifications:  
  - **Settled**: Fish exhibit nociception; stunning reduces suffering during slaughter.  
  - **Contested**:  
    - Fish phenomenal consciousness (Key debate: Birch vs. Key).  
    - Crustacean sentience (Elwood vs. Diggles).  
    - Whether death harms animals (Singer vs. Carruthers).  
    - Additive welfare aggregation (Browning vs. Yeates).  
  - **Underdetermined**: The standards are compatible with both hedonistic and preference-based welfare theories, as long as they prioritize measurable harm reduction.  

