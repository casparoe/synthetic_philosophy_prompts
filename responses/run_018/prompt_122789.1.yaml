prompt: |-
  I have been reading through the welfare standards that certifiers and regulators apply to farmed fish and shrimp, and the shape of the package puzzles me. As I understand the dominant pattern — please correct me where I have the details wrong, and flag anything that is jurisdiction- or species-specific rather than general — the requirements are overwhelmingly resource- and management-based: a ceiling on stocking density in kilograms per cubic metre, floors on dissolved oxygen, a species-appropriate temperature band, feed specifications, lighting regimes, a veterinary health plan, and limits on things like fin erosion, eye damage and sea-lice counts. On top of that there are increasingly animal-based outcome measures, of which cumulative mortality across the production cycle is the headline one; a farm above the threshold fails. Slaughter is handled separately: for finfish, more and more schemes require an actual stunning step, percussive or electrical, and treat death by ice slurry, chilling, or asphyxiation in air as a failure; for crustaceans the normal route is still gradual chilling or being cooked alive, and in many legal systems they attract no stunning requirement at all, only a general prohibition on unnecessary suffering. Three absences are conspicuous. Nothing caps how long an animal may be held in the system: a salmon may spend well over a year in a sea cage, ranched tuna many months, a breeding shrimp years. Nothing requires enrichment or any opportunity for species-typical activity. And routine culling of the runted, deformed or moribund is not merely permitted but required, and does not itself count against a farm, even though the same farm is penalised for letting animals die on their own. Fish are also routinely fasted for several days before slaughter, and that fast is written into standards as a welfare and food-safety measure rather than treated as a deprivation.

  What I want from you is the implicit theory this package rests on. Concretely, I would like you to reconstruct it and then interrogate it on five points. First, its temporal structure: mortality is tracked as a rate across the cycle and duration therefore enters the accounting indirectly, yet nothing limits duration as such. Does the practice presuppose that welfare is a property of time-slices whose badness does not aggregate into a lifetime quantity, or can an additive, whole-life view explain the asymmetry some other way? Second, death: cumulative mortality registers as a welfare failure while culling a suffering animal is required and costs the farm nothing on the scorecard. Does that presuppose that death is not itself a harm to the animal, and that mortality matters only as evidence of antecedent suffering? Third, the finfish–crustacean asymmetry: what must we believe about the threshold for being a welfare subject for that split to be principled, and is that belief strictly presupposed or merely convenient given the state of the evidence, costs, and political feasibility? Fourth, the unit of assessment: thresholds on rates and averages seem to make the group, not the individual, the object of evaluation. Fifth, fasting: is a standard built from resources, health and a humane death strictly a negative or health-centred conception of welfare, and would any positive-welfare or flourishing view forbid it?

  To pressure-test the reconstruction, consider rewriting such a standard in lifetime terms: replace the thresholds with a ceiling on the integral over each animal's whole life of a welfare index sensitive to both intensity and duration — call it negative-welfare-days. Under that rule a short, dense, fast-grown cycle could beat a roomy one; earlier slaughter automatically scores better; culling a chronically suffering animal becomes a welfare improvement rather than a tragedy; and a system offering a long, good life could fail where a cramped, brief one passes. Tell me whether that consequence really follows from the commitments you have reconstructed or only from my particular way of writing the metric, which commitment is doing the work if the consequence seems repugnant, and what would have to be added to the standards to block it.

  Two further requirements. Epistemically: separate clearly, throughout, what is settled from what is genuinely contested among people who actually work on animal welfare science and its philosophy — fish nociception versus fish phenomenal consciousness, crustacean pain, whether welfare aggregates additively across a life, whether death harms a non-human animal, whether positive welfare is a distinct requirement — and do not present a contested view as the consensus or a contested empirical claim as established. Say too where the answer is underdetermined by the practice itself, so that several theories would license the same standards, and distinguish what the practice strictly presupposes from what it merely fits well with. Format: after your prose analysis, give me a single valid, parseable JSON object, with no commentary after it, using exactly these keys and types:

  - "description_corrections": array of strings — anything wrong, outdated, or jurisdiction-specific in my description of the practice.
  - "commitments": array of objects, each with keys "commitment" (string, the view attributed to the practice, stated as a claim about welfare, death, or standing), "status" (string, exactly one of "strictly_presupposed", "strongly_suggested", "merely_compatible"), "why" (string, which feature of the practice forces or merely invites it), "rivals_ruled_out" (array of strings), "epistemic_status" (string, exactly one of "settled", "contested", "speculative"), and "contestation" (string: who disagrees, about what, or "none").
  - "tensions": array of objects, each with keys "tension" (string), "reconcilable" (boolean), and "resolution_or_why_not" (string).
  - "alternative_theories_licensing_the_same_practice": array of objects, each with keys "theory" (string), "how_it_licenses_the_practice" (string), and "where_it_would_diverge" (string).
  - "lifetime_integral_test": object with keys "follows_from_reconstruction" (boolean), "consequence" (string), "load_bearing_commitment" (string), and "rewrite_required" (string, what the standards would have to add to block the consequence).
  - "cruxes": array of objects, each with keys "question" (string), "kind" (string, "empirical" or "conceptual"), and "what_it_would_change" (string).
reasoning: |-
  We are given a detailed description of current welfare standards for farmed fish and shrimp, and asked to reconstruct the implicit theory behind them, then interrogate it on five points. We must also provide a JSON object with specific keys.

  First, we note the current practice as described:

  - Dominantly resource- and management-based: stocking density, water quality (oxygen, temperature), feed, lighting, health plans, limits on physical damage and parasites.
  - Increasingly animal-based outcome measures, with cumulative mortality as a key metric; exceeding a threshold fails the farm.
  - Slaughter: finfish often require stunning; crustaceans typically do not (chilling or live cooking permitted). Death by other methods (e.g., ice slurry, asphyxiation) is a failure for finfish.
  - Absences noted: no limit on duration of confinement, no requirement for enrichment or species-typical activity, routine culling (of runted, deformed, moribund) is required and not penalized, fasting before slaughter is required and seen as welfare-positive.

  We are to reconstruct the implicit theory and then address:

  1. Temporal structure: Why is duration not limited? Does welfare not aggregate over time?
  2. Death: Why is mortality a failure but culling not? Is death not a harm?
  3. Finfish-crustacean asymmetry: What does this say about the threshold for being a welfare subject?
  4. Unit of assessment: Why group-level metrics?
  5. Fasting: Is this a negative conception of welfare? Would a positive conception forbid it?

  Then, pressure-test with a lifetime integral metric (negative-welfare-days) and see if the consequences follow.

  Epistemic requirements: We must clearly separate settled vs contested issues in animal welfare science and philosophy.

  Finally, we must output a JSON object.

  Let's break down the implicit theory:

  The standards focus on:
  - Avoiding negative states (disease, injury, poor water quality) and ensuring basic health (via resource inputs and management).
  - Minimizing mortality (as an outcome) because it indicates suffering and loss of production.
  - Slaughter methods that minimize suffering (for finfish, stunning; for crustaceans, no requirement, which may reflect uncertainty about their capacity to suffer or practical challenges).
  - Culling is seen as a necessary management tool to prevent suffering (of the culled individual) and to protect the group (from disease, competition). It is not penalized because it is intentional and controlled, and the animal is likely suffering.

  The implicit theory seems to be a combination of:
  - Welfare as the absence of negative experiences (pain, distress) and the presence of basic health and functioning.
  - A focus on minimizing identifiable harms that are measurable and have clear welfare implications (like injuries, high mortality).
  - A group-level perspective because farming is done at scale and individual monitoring is impractical.
  - For duration: perhaps the view that if the conditions are acceptable at each time point (via the resource-based standards and low mortality), then the length of time does not inherently worsen welfare? Or that welfare is not cumulative? Or that the economic model requires a certain duration and welfare is only about the conditions during that time.

  Now, to the five points:

  1. **Temporal structure**: The practice does not set a limit on duration. This might be because welfare is assessed at each time point (via the standards) and if the conditions are met, then the animal is not suffering at that time. Therefore, the cumulative effect of time is not considered. Alternatively, they might think that welfare does not aggregate additively (or that the aggregation is already captured by the mortality rate, which is a cumulative measure). The asymmetry (duration not limited but mortality rate is) might be because mortality is an irreversible event that ends all possibility of welfare, and it is also a sign of suffering. But the practice does not necessarily assume that welfare is non-additive; it might just be that the current metrics (like mortality) are easier to measure and act upon.

  2. **Death**: Cumulative mortality is a failure because it reflects suffering and failure of the system to keep animals alive. Culling is required and not penalized because it is a controlled intervention to end suffering (and thus prevent further harm) and to maintain group health. The practice seems to presuppose that death itself is not a harm to the animal (or at least, it is a lesser harm than prolonged suffering) and that mortality matters as an indicator of suffering and system failure. This is consistent with the view that death is not a harm to the animal (especially if the animal has no future-oriented desires or if death is instantaneous without suffering) but suffering is.

  3. **Finfish-crustacean asymmetry**: This split might be based on the belief that crustaceans either do not feel pain or that their capacity for suffering is sufficiently lower than finfish that stunning is not required. The practice may reflect the current scientific uncertainty about crustacean sentience and the practical difficulties and costs of stunning them. It is principled only if we hold that crustaceans are not sentient (or are less sentient) or that their suffering is minimal in the allowed methods. This is contested: some studies suggest crustaceans might feel pain, but it's not settled.

  4. **Unit of assessment**: Group-level metrics are used because it is impractical to assess each individual in a large-scale operation. Also, welfare is often managed at the group level (e.g., water quality affects all). This does not necessarily deny individual welfare, but it accepts that some individuals might suffer without being detected.

  5. **Fasting**: The practice sees fasting as welfare-positive (reducing digestive content for slaughter, avoiding vomiting and food safety issues). This fits a negative conception of welfare (avoiding harm during transport and slaughter). A positive conception (requiring positive experiences) might not forbid fasting per se, but if fasting causes hunger (a negative state) then it would be a concern. However, the standards do not currently measure hunger.

  Now, the pressure test: a lifetime integral of negative welfare (say, a daily welfare score that is negative when suffering occurs). We then set a ceiling on the total negative-welfare-days per animal.

  Consequences:
  - A short, dense cycle might have high intensity of suffering but short duration, so the integral might be lower than a long, less intense cycle.
  - Earlier slaughter reduces the duration and thus the integral, so it might be encouraged even if the animal is healthy.
  - Culling a suffering animal ends the accumulation of negative days, so it reduces the integral and thus is good.
  - A system that offers a long, good life (with many positive days) might still have a high integral of negative days if there are periods of suffering, and it might fail if the total exceeds the ceiling, while a short, bad life might pass.

  Does this follow from the commitments? The current standards do not use an additive metric. The consequence follows if we assume that welfare is additive over time and that we are only counting negative welfare (not positive). The current practice does not make these assumptions. In fact, the current practice does not have a metric that aggregates over time at all (except mortality, which is a binary event). The commitment that is doing the work in making the consequence repugnant (if it is) is the additive aggregation of negative experiences over time, without considering positive experiences or the fact that a longer life might have more positive experiences.

  To block the consequence, the standards would have to:
  - Require a minimum duration of life (to avoid very short lives) or a minimum level of positive welfare.
  - Consider positive welfare as well (so that a long life with positive experiences is valued).
  - Or, not use an additive metric but perhaps a maximin approach (minimize the worst suffering) or set minimum standards at each time point.

  Now, we must note the contested issues:

  - Fish nociception vs. phenomenal consciousness: There is evidence that fish have nociception, but whether they have subjective experiences (conscious pain) is contested.
  - Crustacean pain: Even more contested.
  - Whether welfare aggregates additively: Some models (like QALYs in humans) do, but it's debated for animals.
  - Whether death harms a non-human animal: This is a philosophical question (e.g., does the animal have an interest in continued life?).
  - Positive welfare: Is it a requirement? Or is welfare just the absence of suffering?

  Now, for the JSON:

  We'll structure it as required.

  First, corrections to the description:

  - The description is generally accurate. However, note that some standards (e.g., RSPCA, ASC) do include some enrichment requirements for certain species (e.g., salmon), but it's not universal. Also, some standards are starting to include positive welfare (like environmental enrichment) for some species, but it's not dominant.
  - Jurisdiction: The EU has stricter rules for finfish slaughter (requiring stunning) than many other places. For crustaceans, Switzerland requires stunning, but most do not.
  - Cumulative mortality is a key metric, but some standards also include other animal-based measures (like body condition, wounds).

  We'll note these in the corrections.

  Now, the commitments:

  We'll list the key commitments, their status (strictly presupposed, strongly suggested, or merely compatible), why, rivals ruled out, epistemic status, and contestation.

  Tensions: e.g., between culling being required and not counting against welfare, and mortality being a failure.

  Alternative theories: e.g., a hedonistic view might license the same practice if it assumes that death is not a harm, or a preference-based view might differ.

  Cruxes: Key questions that would change the standards.

  We'll now write the JSON accordingly.
