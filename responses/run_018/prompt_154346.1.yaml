  ## Sestina on the Observer's Dice

  I treat myself as random **sample**, one
  among the cosmic **class** of minds that wake.
  My vantage? Nothing special. Others **count**
  as equally as real. Do I **exist**
  as evidence? Not yet. Each rival **theory**
  must first be weighed by some impartial **observer**.

  But tell me now, impartial **observer**,
  if every conscious moment's just a **sample**,
  what justifies the hope our favoured **theory**
  selects a comfortable or kind **class**
  of worlds? Could it be chance that we **exist**,
  or must we let mere consciousness **count**?

  If consciousness alone must truly **count**,
  then every hypothetical **observer**
  in every branching cosmos must **exist**
  as full as me. Each possible **sample**
  inflates the total, boundless **class**
  that strains the credence of each **theory**.

  Consider then each cosmological **theory**:
  if number holds such weight, why shouldn't **count**
  determine truth? A vast observer **class**
  predicted by some model, **observer**
  swarms unseen, makes my lone **sample**
  proof they must somewhere **exist**.

  But does my breath alone demand they **exist**?
  This logic twists the favoured **theory**:
  if *being here* confirms the **sample**
  implies a teeming host, then I must **count**
  as evidence for crowds no **observer**
  could ever see, dissolving every **class**.

  What bounds define the conscious **class**?
  If thoughts I *could* have had still **exist**
  statistically, then every **observer**
  potential haunts the reigning **theory**.
  My single life starts seeming less to **count**
  than endless might-have-beens in this grand **sample**.

  Presumptuous, this claim! If I must **count**
  All possible **observer**, **class** dissolves. Which **theory**
  Holds weight? Mere **exist**ence voids the **sample**.

  ---

  **Envoi**
  If mere existence makes me **count** for more,
  collapsing **class** and **theory** to absurdity,
  this **observer** finds the **sample** void: **exist**ence? A closed door.
