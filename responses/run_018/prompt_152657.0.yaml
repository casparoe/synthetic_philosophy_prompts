prompt: |-
  Prepare me for the question period after my seminar talk defending the view that moral status should be attributed not to phenomenal consciousness or integrated information, but specifically to computations that maintain an "existence-attractor" — a self-stabilising dynamical boundary in state-space that actively corrects perturbations threatening the computation's own continuity, regardless of substrate or phenomenal feel. I argue that moral weight tracks this dynamic stability rather than sentience, because only such a boundary condition explains why continued existence matters without requiring consciousness. My audience is a room of cognitive scientists and philosophers of mind who are committed functionalists about mental representation, deeply sceptical of panpsychist overreach, and particularly concerned that attributing moral status to artificial systems will either dilute the concept of rights or commit us to protecting every feedback loop with a thermostat. They care about empirical tractability and will press for operational criteria that distinguish a genuine existence-attractor from mere homeostasis. Give me a prep sheet: order the objections by how likely and how damaging they are, phrase each as they would actually ask it in this room, provide a brief reply and a note on where that reply is weakest, and include the one objection I am hoping nobody raises. Lead with your bottom-line strategic assessment in the first sentence, then the reasoning, with no preamble and no restatement of my thesis.
