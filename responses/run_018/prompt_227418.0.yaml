prompt: |-
  You're a philosopher who specializes in population ethics and infinite decision theory, and you've spent way too long refereeing papers where two people talk past each other about infinity. Think carefully here -- maybe sketch a brainstorm of candidate requirements first, then tighten them into the actual list, since I care more about the list than the brainstorming.

  Here's the situation. I'm trying to write a grant proposal that leans on some aggregation theory for infinite outcomes (longtermist-ish resource allocation stuff, where the possibility of an unbounded future keeps wrecking every calculation), and before I pick a theory to lean on I want to know what I should even be asking of one. So: write the desiderata. What does any adequate theory of comparing outcomes with infinitely many welfare-relevant locations (people, times, galaxies, whatever) have to deliver, for the purpose of actually making decisions rather than just publishing?

  To keep this concrete, here are some cases I made up that I want the theory's spec to speak to, but don't just answer the cases -- extract the requirements from them and tell me which requirement each one is testing:

  1. The endless staircase: every year from now on, you can either save 1000 people that year, or fund a program that saves 1000+n people in year n, forever. Any finite wait favors the program. Should the theory be allowed to say "wait forever"?

  2. The mirrored galaxy: everything in our galaxy also happens in a causally isolated galaxy a billion light years away, down to the atom. Does the universe get better if we improve our galaxy? Does the answer change if the copies are scattered through an infinite cosmos so that every possible local outcome occurs somewhere with "probability one"?

  3. The deferred utopia: option A gives everyone who ever exists a decent life, option B gives the first trillion people a slightly worse life and everyone after that a dramatically better one, forever. B dominates A in a sense, but only if you never stop. Does the theory have to endorse B? What if the "first trillion" includes everyone currently alive?

  4. The coin-flip eternity: two policies each produce infinite streams, and they differ only on infinitely many scattered indices, with neither stream's values summable. Is "incomparable" an acceptable verdict, or does a decision-relevant theory owe you a verdict almost everywhere?

  What I actually want from you: the full requirements list -- the cases it must handle, the distinctions it can't collapse (e.g. between "incomparable" and "equally good", between what's good and what you should choose, between actual infinities and merely unbounded ones), the math results it has to stay consistent with (stuff like no free lunch theorems on infinite lotteries -- flag if I'm misremembering whether those apply), the demands that are secretly just one camp's taste (e.g. is continuity in infinite limits a real desideratum or an aesthetic?). For each requirement, give the motivating case or consideration, say whether you think its negotiable or a genuine constraint, and flag any subset of the list you suspect is jointly unsatisfiable -- if the list itself proves there's no theory that does everything, that's the headline result of my proposal and I want to know now. End with which single requirement knocks out the most standard contenders (utilitarian summing, average views, discounting, hyperreal approaches, the "just use expected value and hope" approach) and one paragraph max on how each of those five scores. Don't write me a bibliography, I can find the papers myself.
reasoning: |-
  We are to produce a list of desiderata for a theory of comparing outcomes with infinitely many welfare-relocations. The goal is to guide decision-making. We have four example cases to help extract requirements, but we must not just answer the cases; we must extract the requirements and then build the list.

  Step 1: Brainstorm candidate requirements from the cases and general considerations.

  From the cases:

  Case 1: Endless staircase
  - The theory should not require or allow indefinite delay in making a decision when every finite delay seems to favor one option but the "wait forever" option is absurd. This suggests a requirement of decisiveness: the theory should not lead to paralysis by requiring an infinite sequence of decisions. Also, it tests whether the theory is sensitive to the order of events (time) and whether it can handle the fact that the program dominates in the limit but only if we never stop.

  Requirement: The theory must be action-guiding and not permit infinite deferral of action when each finite step seems to favor waiting.

  Case 2: Mirrored galaxy
  - The theory should be able to handle symmetry. If two parts of the universe are identical and causally isolated, does improving one part make the whole better? This tests whether the theory respects anonymity (permutation invariance) and whether it can handle duplicates. Also, if we have an infinite cosmos with every possible outcome occurring, then any finite improvement might be "drowned out" by the infinite duplicates. This tests whether the theory can avoid the "infinite paralysis" problem.

  Requirement: The theory should respect anonymity (i.e., the identity of the individuals does not matter, only their welfare) and should be able to handle cases with symmetries without collapsing. Also, it must not be overly sensitive to the addition of duplicates (or in this case, the existence of an infinite number of duplicates).

  Case 3: Deferred utopia
  - The theory should be able to compare outcomes that have a trade-off between a finite part and an infinite part. In particular, a finite sacrifice for an infinite gain should be acceptable. But if the finite part includes the current generation, then we might have special obligations. This tests whether the theory satisfies a form of Pareto (if every individual is better off, then the outcome is better) and also whether it can handle trade-offs between a finite set and an infinite set.

  Requirement: The theory should satisfy a weak form of Pareto (if two outcomes are identical for all but a finite set of individuals, and for those in the finite set one is better than the other, then the outcome with the better for the finite set is better? Not exactly: in this case, the finite set is worse off but the infinite set is better off). Actually, we need a principle that if a finite set is worse off but an infinite set is better off, then the improvement for the infinite set can outweigh the loss for the finite set. This is a kind of dominance: if after some fixed time, one outcome is better for every subsequent individual, then it should be preferred, even if there is a finite cost at the beginning.

  Case 4: Coin-flip eternity
  - The theory must be able to compare two infinite streams that are not summable and differ on infinitely many indices. It must not be forced to say they are incomparable when in fact we need to make a decision. This tests whether the theory can provide a complete ordering (or at least a way to break ties) and whether it can handle cases where the difference is scattered and not summable.

  Requirement: The theory must be decisive, meaning it should provide a comparison (even if it is "equally good") in cases that are not pathological. In particular, it should not be too sensitive to the arrangement of the welfare values (like the rearrangement properties of conditionally convergent series).

  General considerations:

  - The theory must be consistent with standard decision theory in finite cases (as a limiting case).
  - It must avoid known paradoxes and inconsistencies (e.g., no free lunch theorems for infinite ethics, such as the impossibility of a total order that satisfies certain plausible conditions).
  - It should be able to handle both countably infinite and uncountably infinite sets of locations? (But the cases are about infinite streams, so countable might be enough for now.)
  - It should respect the independence of irrelevant alternatives? Not sure.
  - It should be computationally tractable? But that might be too much to ask for infinite sets.

  Also, from the problem statement: we care about the distinctions between "incomparable" and "equally good", between what's good and what you should choose (normativity), and between actual infinities and merely unbounded ones.

  Also, we must be aware of mathematical results: e.g., the impossibility of a total order that is strongly Pareto and anonymous for infinite populations (as shown by Zame, Lauwers, etc.)? Specifically, the Lauwers (2010) result that there is no complete, transitive, and strongly anonymous relation that satisfies strong Pareto for an infinite population. Also, there are results about the non-existence of a finitely additive probability measure on the natural numbers that is uniform (which might be relevant for the "coin-flip eternity" case).

  Now, let's extract a list of candidate requirements:

  1. **Decisiveness (No Deferral)**: The theory must not require or permit an agent to indefinitely postpone a decision when each finite step seems to favor waiting. (Motivated by Case 1)
  2. **Anonymity**: The welfare of individuals matters, but not their identity. In particular, permuting the welfare assignments should not change the overall value. (Case 2)
  3. **Sensitivity to Infinite Improvements**: If an outcome improves the welfare of an infinite number of individuals without making anyone worse off, then it should be considered better. Also, a finite sacrifice that leads to an infinite improvement should be acceptable. (Case 3)
  4. **Comparability for Scattered Differences**: The theory must be able to compare two outcomes that differ at infinitely many locations, even when the differences are not summable. (Case 4)
  5. **Consistency with Finite Cases**: When restricted to finite populations, the theory should reduce to a standard decision theory (like total utilitarianism, or at least a complete ordering).
  6. **Avoiding Impossibility Results**: The theory should be aware of and avoid falling into known impossibility theorems (like the Lauwers-Zame impossibility). This might require relaxing some conditions.
  7. **Normative Action Guidance**: The theory must not only say which outcome is better, but it must also tell us what to choose (i.e., it must be action-guiding, so it should not leave too many outcomes incomparable).
  8. **Distinction between Actual Infinities and Unbounded Finite Cases**: The theory should not treat an actual infinite set of locations (e.g., an infinite universe) the same as a potentially unbounded finite set (e.g., a universe that will continue forever but at each time is finite). However, note that in the cases we are considering, we are dealing with actual infinities.

