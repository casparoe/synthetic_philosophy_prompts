  4. **Comparability under Scattered Effects**: The theory must be able to compare any two outcomes that differ in at most countably many locations, even when the differences are not absolutely summable. In particular, it must not declare two such outcomes as incomparable if they are generated by a process that we can reason about (like the Coin-flip Eternity). (This might be too strong given impossibility results, so perhaps we must allow some incomparability, but then we need a way to break ties in decision contexts.)

  5. **Continuity in Finite Parts (or Finite Sensitivity)**: The theory should be continuous in the sense that if two outcomes are identical for all but a finite set of locations, then the comparison should depend only on the differences in that finite set. However, note that this might conflict with the requirement for sensitivity to infinite improvements. Actually, we might not want this because of deferred utopia. Alternatively, we might require that the theory should not be sensitive to the welfare of a single individual in an infinite population (if that individual is not special). This is tricky.

  6. **Consistency with Finite Ethics**: When the population is finite, the theory should reduce to a standard and acceptable finite population ethic (e.g., total utilitarianism, or at least a complete, transitive, and continuous ordering). (Non-negotiable.)

  7. **Avoiding Known Impossibilities**: The theory should not require conditions that are known to be jointly impossible (e.g., the combination of Anonymity, Strong Pareto, and Completeness). Therefore, we may have to relax one of these. (Non-negotiable.)

  8. **Action Guidance**: The theory must provide a complete ordering (or at least a way to choose) for any two outcomes that could be the result of a feasible action. (This might be too strong, so we might have to settle for a partial order but with tie-breaking rules for incomparable cases.)

  9. **Distinction between Actual and Potential Infinities**: The theory should not treat an actual infinite set of locations (e.g., an infinite universe) as if it were merely a potentially infinite one (e.g., an unbounded future). In particular, it must not require that we only consider finite horizons. (Non-negotiable for actual infinities.)

  Now, we note tensions:

  - The combination of Anonymity, Strong Pareto (which requires that if one outcome is strictly better for one individual and the same for everyone else, then it is better overall), and Completeness (any two outcomes are comparable) is impossible for an infinite population (Lauwers 2010). Therefore, we must relax at least one. 

  - The Endless Staircase case suggests that we cannot have a theory that always says "wait" for every finite n, so we must break the chain at some point. This might require that the theory is not based on pointwise limits.

  - The Coin-flip Eternity case might require that we have a way to compare two sequences that are not absolutely convergent, which is tricky.

  Now, which requirement knocks out the most standard contenders? Let's consider:

  1. **Total Utilitarianism (summing)**: 
     - Fails in many infinite settings because the sum may diverge (e.g., Endless Staircase: both options have infinite sum, so incomparable? Also, Mirrored Galaxy: if we have two identical galaxies, improving one galaxy would require adding a finite amount to an infinite sum? Not well-defined. And Coin-flip Eternity: the sum may not converge). So it fails Decisiveness (because it cannot compare two infinite sums) and Comparability.

  2. **Average Utilitarianism**:
     - For an infinite population, the average might be undefined (if the limit doesn't exist). For example, in the Endless Staircase, the average in the program option might be increasing without bound? But if we take a limit, we might run into problems. Also, in Mirrored Galaxy, if we have two identical galaxies, then the average is the same as one galaxy? But then improving one galaxy would change the average? Actually, if the universe is infinite, the average might be zero. So it fails to be sensitive to improvements (Infinite Pareto). Also, for Deferred Utopia, the average might be the same as the long-run average, but then we ignore the finite sacrifice? It might endorse B only if the long-run average is higher.

  3. **Discounting**:
     - Uses a discount factor to make the sum finite. Then in Endless Staircase, it would choose to fund the program at some finite time (because the discounted sum of the program is higher). But it might fail Anonymity because it weights earlier times more. Also, in Mirrored Galaxy, it would ignore distant galaxies? But if the galaxies are identical and symmetric, it should not matter. Also, for Deferred Utopia, it might favor A if the discounting is heavy, even though B has a better future. So it might fail Infinite Pareto (if the finite sacrifice is in the near term and the gains are in the far future). Also, in Coin-flip Eternity, the discounted sum might converge, so it would be comparable.

  4. **Hyperreal Approaches** (e.g., using non-standard analysis to assign a hyperreal number to each outcome):
     - Can assign a sum even when it diverges. Then in Endless Staircase, the program would have a higher hyperreal sum than the immediate saving? But hyperreals might still say that both are infinite? Actually, they can distinguish different orders of infinity. However, the theory might be too sensitive to the choice of ultrafilter (which is arbitrary). Also, in Mirrored Galaxy, if we improve one galaxy, the hyperreal sum might be higher, so it would say it's better. But if there are infinitely many galaxies, then the improvement might be infinitesimal? Then it might not be considered better? So it might fail Infinite Pareto. Also, for Deferred Utopia, it would likely endorse B. For Coin-flip Eternity, it would depend on the ultrafilter and might be arbitrary. So it might fail Anonymity (if the ultrafilter breaks symmetry) and also Comparability might be arbitrary.

  5. **Expected Value and Hope** (just use a limit or an extended real line):
     - This often leads to incomparability when sums diverge. So it fails Decisiveness and Comparability. For example, in Endless Staircase, both are infinite and incomparable? Then the agent might never act. Also, in Coin-flip Eternity, if the sums diverge, then incomparable.

