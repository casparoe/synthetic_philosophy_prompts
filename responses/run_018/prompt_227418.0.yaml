     - **Motivation**: Deferred Utopia (Case 3). The theory should judge an outcome as better if it makes an infinite number of individuals better off without making anyone worse off (weak form). Moreover, it should accept a finite sacrifice for an infinite gain (strong form: if there is a finite set that is worse off and an infinite set that is better off, and no one else is affected, then the outcome with the infinite gain is better).
