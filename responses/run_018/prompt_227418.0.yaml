  Now, we tighten the list into the actual desiderata. We'll try to make them as precise as possible.

  Final List of Desiderata:

  1. **Decisiveness (No Infinite Deferral)**: The theory must not allow for a situation where an agent is required to wait forever. Specifically, in the Endless Staircase case, the theory must either recommend funding the program at some finite time or reject the idea that waiting is always better. (Non-negotiable for decision-making.)

