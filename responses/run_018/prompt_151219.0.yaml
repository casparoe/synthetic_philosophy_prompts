answer: |-
  ### Joint Statement: Adversarial Collaboration on Phenomenal Judgment  

  **Agreed Claims (Signed by Both Epiphenomenalist & Interactionist):**  
  1. Conscious experiences (qualia) correlate with specific neural activity patterns (NCCs).  
  2. Accurate first-person reports about qualia rely on neural mechanisms.  
  3. Illusions (e.g., phantom pain) show reports can mismatch actual stimuli but feel subjectively real.  
  4. The "shadow-qualia" hypothesis is coherent: NCCs generate two parallel outputs:  
     - (a) The qualitative experience (*quale*).  
     - (b) A physically embedded "shadow signal" that tracks the *quale*’s content but is causally isolated from it.  
  5. Split-brain patients reveal dissociations between behavior and verbal reports, implying modular reporting mechanisms.  
  6. Physical closure of the brain is assumed (no external causal leaks).  

  ---

  **Disagreements Table**  
  *(Each side’s wording reflects their own position)*  

  | Topic | Epiphenomenalist Wording | Interactionist Wording |
  |-------|--------------------------|------------------------|  
  | **Role of Qualia in Reports** | "Phenomenal judgments are solely driven by shadow signals, not qualia. Qualia are causally inert byproducts." | "Qualia directly shape phenomenal judgments; shadow signals alone can’t explain report accuracy without qualia’s causal push." |  
  | **Interpretation of the Paradox** | "The 'paradox' of accurate reports under epiphenomenalism is resolved by recognizing the brain’s self-tracking loop via shadow signals—it’s weird, not refutative." | "Epiphenomenalism’s 'accurate reports without causal access' *is* a fatal paradox—it implies magical pre-harmony, refuting the theory." |  

  ---

  ### Cruxes & Testable Predictions  
  **Crux 1: Can a physically closed brain generate accurate phenomenal reports *without* causal access to qualia?**  
  - **Hypothetical Case**: *Split-Brain "Red/Green" Test*  
    - **Setup**: A split-brain patient’s right hemisphere (RH) sees a **red** circle, triggering the NCC for "red." The left hemisphere (LH) sees **nothing** (stimulus isolated to RH). Both hemispheres exhibit identical NCC patterns for "red" due to mirrored subcortical pathways. The LH is asked, *"What color do you see?"*  
    - **Shadow-Qualia Twist**: The NCC spawns a "red" *quale* in RH + a parallel "red" shadow signal. The shadow signal is *blocked* from crossing to LH (callosal severance intact), but NCC patterns are identical in both hemispheres.  
  - **Epiphenomenalist Prediction**:  
    > LH inaccurately reports "green" (or guesses). The LH’s report relies *only* on its local shadow signal (isolated from RH’s qualia). Without causal access to the *actual* quale in RH, LH’s report is decoupled and potentially wrong—yet the NCC pattern alone can’t salvage accuracy.  
  - **Interactionist Prediction**:  
    > LH reports nothing or confabulates. Without causal input from the *quale* (stuck in RH), LH’s shadow signal lacks the "grounding" needed for accurate reporting—even with identical NCC patterns. Accurate reports *require* qualia’s causal influence.  

  **Crux 2: Does the report paradox *refute* epiphenomenalism or reveal a weird loop?**  
  - **Hypothetical Case**: *Shadow Signal Override*  
    - **Setup**: A neuroprosthesis can *induce* a shadow signal for "blue" in the visual cortex *without* activating the NCC for blue (i.e., no *quale*). Subjects are shown **yellow** and asked to report the color.  
  - **Epiphenomenalist Prediction**:  
    > Subjects report "blue." The shadow signal alone drives judgment, proving qualia are irrelevant. The "loop" (NCC → shadow signal → report) is self-contained and accurate *without* qualia’s input—validating epiphenomenalism’s weird consistency.  
  - **Interactionist Prediction**:  
    > Subjects report "yellow" (or hesitate). The induced "blue" shadow signal conflicts with the *actual* quale of yellow, causing confusion. Reports default to qualia-influenced processing, exposing epiphenomenalism’s "harmony" as implausible.  

  ---

  **Summary of Stakes**  
  - **Epiphenomenalist**: Shadow signals handle the heavy lifting; qualia are along for the ride. Split-brain inaccuracies and override successes confirm self-modeling loops work without causal magic.  
  - **Interactionist**: Reports go haywire when qualia are causally "locked out." Shadow signals alone can’t replicate judgment accuracy—implying qualia *must* be interactive to avoid a hard paradox.  

  No big-name philosophy—just the messy, testable guts. Let’s grind data.
