answer: |-
  ### Step-by-Step Evaluation Procedure for Strategy-Proofness

  **Objective**: Determine if a mechanism is strategy-proof (non-manipulable) under:  
  - ≥3 alternatives (projects).  
  - Voters submit partial rankings (transitive weak orders with ties for indifference/uncertainty).  
  - Non-dictatorial and unrestricted domain (any transitive weak order allowed).  

  **Procedure** (run sequentially; stop at first non-pass):  
  1. **Determinism Check**  
     - **Question**: Is the mechanism deterministic? (i.e., always outputs a unique winner with no randomness.)  
     - **Sufficient answer**:  
       - **Yes**: Proceed to Step 2.  
       - **No**: Stop → *Refer to human judgment*.  
     - **Why**: Randomized mechanisms require game-theoretic analysis beyond this checklist.  

  2. **Dictatorship Check**  
     - **Question**: Is there a fixed voter whose top-ranked alternative(s) always wins, regardless of others?  
     - **Sufficient answer**:  
       - **Yes**: Stop → *Reject* (violates non-dictatorial constraint).  
       - **No**: Proceed to Step 3.  
     - **False-negative risk**: None (directly violates ethical constraint).  

  3. **Domain Check**  
     - **Question**: Does the mechanism accept *any* transitive weak order (including incomplete rankings and ties)?  
     - **Sufficient answer**:  
       - **Yes**: Proceed to Step 4.  
       - **No**: Stop → *Refer to human judgment*.  
     - **Why**: Restricted domains might enable strategy-proofness (e.g., single-peaked preferences), but this is setting-specific.  

  4. **Onto (Surjectivity) Check**  
     - **Question**: Can every alternative win under some voting profile?  
     - **Sufficient answer**:  
       - **Yes**: Proceed to Step 5.  
       - **No**: Stop → *Refer to human judgment*.  
     - **Why**: Non-onto mechanisms might avoid Gibbard-Satterthwaite by excluding "unwinnable" alternatives.  

  5. **Gibbard-Satterthwaite Corollary**  
     - **Question**: Are all prior steps passed? (i.e., deterministic, non-dictatorial, unrestricted domain, onto, ≥3 alternatives.)  
     - **Sufficient answer**:  
       - **Yes**: Stop → *Reject* (manipulable by Gibbard-Satterthwaite).  
       - **No**: Not applicable (procedure stops earlier).  
     - **False-negative risk**: None (theorem guarantees manipulability).  

  **Outcomes**:  
  - *Reject*: Proven manipulable (Step 2 or 5).  
  - *Refer to human judgment*: Steps 1, 3, or 4 fail (undecidable by checklist).  

  **Class of undecidable mechanisms**:  
  - Randomized (Step 1).  
  - Restricted domain (Step 3).  
  - Non-onto (Step 4).  

  ---

  ### Application to Proposed Mechanisms

  #### **Mechanism A: Pairwise majority with Borda fallback**  
  - **Step 1 (Determinism)**: Yes (deterministic output). → Proceed.  
  - **Step 2 (Dictatorship)**: No (no fixed voter dominates). → Proceed.  
  - **Step 3 (Domain)**: Yes (allows partial rankings). → Proceed.  
  - **Step 4 (Onto)**: Yes (any project can win with unanimous support). → Proceed.  
  - **Step 5 (Gibbard-Satterthwaite)**: Passes all → **Reject** (manipulable).  
  - **Verdict**: Reject.  
  - **Politically/ethically unacceptable?**: Yes. Board may favor this common mechanism, but it fails strategy-proofness technically.  

  #### **Mechanism B: Rotating dictatorship with transparency**  
  - **Step 1 (Determinism)**: Yes → Proceed.  
  - **Step 2 (Dictatorship)**: **Yes** (each quarter, one lab’s strict preferences break all ties). → **Reject**.  
  - **Verdict**: Reject (violates non-dictatorial constraint).  
  - **Politically/ethically unacceptable?**: No. Rejection is clear and aligns with power-sharing ethics.  

  #### **Mechanism C: Humble-aggregation proposal**  
  - **Step 1 (Determinism)**: **No** (random selection if ambiguity). → **Refer to human judgment**.  
  - **Verdict**: Undecidable by checklist. Requires human analysis of randomized incentives.  
  - **Politically/ethically unacceptable?**: Potentially. Randomization may seem "fair," but manipulability via preference withholding (to shrink the intersection) is a red flag.  

  ---

  ### Limitations of the Procedure  
  1. **Boundary requiring formal proof**:  
     - Mechanisms failing Steps 1, 3, or 4 require manual proof (e.g., strategy-proofness under domain restrictions, randomized incentives, or non-onto edge cases).  
  2. **False-negative risks**:  
     - **High in Steps 3–4**: A mechanism with restricted domain or non-onto may still be manipulable, but the checklist cannot detect it (e.g., Mechanism C’s strategic withholding).  
     - **Zero in Steps 2/5**: Dictatorship/manipulability is conclusively proven.  
  3. **Irreducible judgment point**:  
     - Human judgment is unavoidable for randomized mechanisms, domain restrictions, or non-onto edge cases, as these evade Gibbard-Satterthwaite.  

  **Summary**:  
  \answer{The board must judge mechanisms that are randomized, domain-restricted, or non-onto, as these lie beyond the checklist.}
