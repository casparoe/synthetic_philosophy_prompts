answer: |-
  The pattern of Anglo-American law reflects a **duty-relative theory of causation and responsibility**, where the existence of a *legal duty* transforms an omission into a legally recognized cause and grounds liability. This is not a purely metaphysical view of causation nor a purely moralized one, but a *normative-legal hybrid*.

  Here's the breakdown and reconstruction:

  1.  **The Implicit View: Duty-Relative Causation & Responsibility**
      *   **Causation is Contextual (Not Purely Metaphysical):** The law does not adopt the strict metaphysical view that "omissions are never causes." Instead, it recognizes that in specific legal contexts defined by duty, an omission *can be treated as* the legal equivalent of an affirmative act causing harm.
      *   **Moral Responsibility is Duty-Dependent:** The moral intuition underpinning liability hinges entirely on the existence of a pre-existing, legally recognized duty. Without a duty, there is no moral failing recognized by the law strong enough to warrant criminal punishment for the outcome. The "bad Samaritan" may be morally reprehensible, but not criminally liable.
      *   **The Duty Creates the Causal Link:** The duty acts as the bridge. It defines the situation where society (through law) *expects* and *requires* action to prevent harm. Failing that required action *breaks the normative expectation* and is therefore deemed the *legal cause* of the harm that results. The parent's duty to feed makes starvation their *causal doing*; the nurse's duty to maintain care makes disconnecting the ventilator *causal*; the bystander's lack of duty means their inaction is merely a background condition, not a cause.
      *   **Negligence Liability Fits:** Civil negligence explicitly requires a "duty of care" as its first element (Duty, Breach, Causation, Damages). The breach of that duty *is* the negligent omission/inaction. Because the duty existed, the failure to act is legally causal for the harm. This aligns perfectly with the criminal "homicide by omission" doctrine but applies a lower standard of fault (negligence vs. intent/recklessness) and results in civil damages rather than criminal punishment.

  2.  **Consistency of the Three Parts:**
      The three parts **are fundamentally consistent** under the **duty-relative framework**:
      *   **No Bystander Liability:** *No legal duty to act* → omission is not a legal cause → no criminal liability.
      *   **Homicide by Omission (Special Duties):** *Specific legal duty exists* (parental, contractual, custodial, sometimes statutory) → breach of that duty (omission) *is* the legal cause of death → criminal liability based on requisite mental state (intent, recklessness, sometimes gross negligence).
      *   **Negligence Liability:** *Duty of care exists* (from relationships, contracts, statutes, or undertakings) → breach of duty (omission to meet standard of care) → breach *causes* harm → civil liability for damages.
      **The unifying principle is the presence or absence of a legally recognized duty.** This provides a coherent, albeit normative, basis for distinguishing when inaction becomes legally significant causation.

  3.  **Impact of Alternative Views on Doctrine:**

      *   **Purely Moralized View (Omission = Cause if Reasonable Person Would Act):**
          *   **Radical Change:** This would obliterate the bystander rule. Watching the child drown would be homicide/manslaughter if a "reasonable person" would have rescued. This fundamentally conflicts with core Anglo-American values of negative liberty (freedom *from* being compelled to act).
          *   **Doctrinal Overhaul:** Criminal law would need new offenses like "failing to render reasonable aid." Civil negligence might expand, but less dramatically, as "duty" already incorporates reasonableness. The clear line defined by specific duties would be replaced by the vaguer "reasonable person" standard in *all* cases, massively expanding potential liability and creating significant legal uncertainty. Distinctions between acts and omissions would largely collapse in liability assessments.
          *   **Practical Problems:** Defining the scope of the "reasonable person's" duty in infinite scenarios, proving what they "would have done," and resource allocation (e.g., forcing risky rescues) would be immense challenges.

      *   **Purely Metaphysical View (Omissions are Never Causes, Full Stop):**
          *   **Collapse of Omission Liability:** Both homicide by omission and negligence liability for pure omissions would become logically impossible. The parent who starves the infant or the nurse who disconnects the ventilator didn't "cause" the death metaphysically; they merely allowed pre-existing causes (hunger, illness) to operate.
          *   **Doctrinal Destruction:** Homicide statutes would only cover affirmative acts (pushing, poisoning, shooting). Parents could only be liable for *active* abuse, not starvation through neglect. Negligence could only apply if the defendant's prior *act* created the danger ("misfeasance"), not for pure inaction ("nonfeasance") like failing to maintain a safe premises or failing to provide promised medical care. Duties of care would become legally irrelevant for pure omissions.
          *   **Moral and Practical Bankruptcy:** This view is morally counterintuitive (absolving the starving parent) and practically unworkable. It would require creating artificial legal fictions (e.g., defining "failure to feed" as an "act") or entirely new categories of liability based solely on duty violation *without* requiring causation, fundamentally altering the structure of tort and criminal law. It ignores the legal reality that duties exist precisely to define situations where inaction *is* blameworthy causation.

  **Conclusion:**

  Anglo-American law implicitly adopts a **duty-relative view of causation and responsibility**. It does not claim omissions are metaphysically identical to acts. Instead, it asserts that **when a specific legal duty requires action to prevent harm, the breach of that duty (the omission) is legally equivalent to causing that harm through an affirmative act.** This provides a coherent normative justification for distinguishing the blameless (though perhaps morally deficient) bystander from the culpable parent/nurse/negligent party. The three parts of the practice (no bystander liability, homicide by omission, negligence) are consistent expressions of this duty-centric principle. Adopting either a purely moralized or purely metaphysical view would necessitate radical, likely undesirable, and fundamentally destabilizing changes to core doctrines of criminal and tort law.
