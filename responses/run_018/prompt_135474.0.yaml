answer: |-
  ## Triptych for Perpetual Peace

  **I. The Civil Constitution of Every State Shall Be Republican**

  The *moral politician* charts the state's slow bend:
  "See nations shaped by war's harsh, costly test,
  Where ruin's shadow prompts a wiser end,
  And self-interest compels what reason might suggest.
  Laws as mechanism, slow reform's constraint,
  Prevent the tyrant's grasp, the despot's wasteful gain;
  Through time and trial, civil powers acquaint
  Themselves with peace as their most lasting, prudent aim."

  But *politics must yield to morals now!*
  "The sovereign will must bow to reason's source,
  The *political moralist* demands, with furrowed brow.
  All power flows from delegated force
  Derived from citizens whose freedom stands
  Unbent by any prince's arbitrary commands!
  No state is rightful save on these fixed grounds:
  Where public law binds all, and each consents, understands."

  **II. The Law of Nations Shall Be Founded on a Federation of Free States**

  "Observe," the *moral politician* urges calm,
  "How fear, not virtue, first compels the pact;
  States wary of their neighbors' latent harm
  Seek mutual defense, a necessary tact.
  Through trade and travel, states may slowly blend
  Their interests, softening the harsh, dividing line;
  This league, though fragile, serves a useful end:
  A bulwark raised 'gainst war's chaotic, swift decline."

  *The moral law commands, it does not wait!*
  "All nations must as moral persons stand,"
  The *political moralist* declares, "before the final gate
  Of reason, joined by an unbreakable band.
  No sovereign crown exempts from duty's claim;
  Each state submits its sword to justice's pure decree.
  This federation is no shifting, hollow name,
  But right incarnate, binding them eternally, and free."

  **III. Cosmopolitan Right Shall Be Limited to Conditions of Universal Hospitality**

  "The globe," the *moral politician* notes, "is charted wide,
  Strangers arrive on unforeseen, new shores;
  Let commerce bloom, let curiosity abide,
  But guard the host state's peace, its settled stores.
  The guest may trade, may speak, then leave when commerce ends;
  This measured welcome serves both need and nascent trust.
  No claim to dwell beyond what safety lends,
  For balance keeps the fragile, distant peace robust."

  *Hospitality is right, not mere concession!*
  "All hold," the *political moralist* insists, "this common ground:
  The earth's shared surface yields to no possession,
  Each stranger owns the shore on which he's found,
  By nature's grant, not any nation's grace or fear.
  No violence can greet the traveller seeking rest;
  This right remains, though states may shift from year to year,
  An open door, a duty never laid to final rest."
