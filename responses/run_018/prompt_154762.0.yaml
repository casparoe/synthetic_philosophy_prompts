answer: |-
  Here's the full dissection of the claim "past you is just another agent, so an advance directive is no more binding than a contract with a stranger," separating the distinct claims, assigning verdicts, and situating the epistemic access argument:

  **Core Claim:** "Past you is just another agent... an advance directive is no more binding than a contract with a stranger."

  **Separated Claims & Verdicts:**

  1.  **The Descriptive Metaphysical Claim (Humean Bundle / Reductionism):**
      *   **Precise Claim:** There is no substantive "self" persisting over time. What we call "a person" is just a temporally extended series of psychological states (beliefs, desires, memories, character traits) connected by relations like similarity and causal dependence (memory, intention). "Past you" and "present/future you" are distinct temporal stages or person-slices within this bundle.
      *   **Implication for ADs:** Past stages *are* fundamentally different entities/agents from future stages. A directive from stage T1 to stage T2 is an agreement between distinct entities.
      *   **Verdict:** **Radical Theoretical Claim.** While descriptive of certain philosophical views (Parfit, Hume), it is *not* a platitude. It directly contradicts common-sense intuition and many metaphysical theories (e.g., substance dualism, animalism, some psychological continuity theories with a "further fact"). It *would* blow up contract law, promises, and many normative structures if taken literally and applied consistently. Bioethicists rarely rely on *this* strong metaphysical claim.

  2.  **The Psychological Discontinuity Claim (Cutoff Version):**
      *   **Precise Claim:** While some form of psychological connection/continuity *might* constitute diachronic personal identity, severe psychological discontinuity (e.g., radical dementia, profound brain injury, certain personality changes) can break this continuity sufficiently that T2 is not *sufficiently continuous with* T1 to be considered the *same person* in a normatively relevant sense. At the point of discontinuity, T2 becomes "a different agent" relative to T1.
      *   **Implication for ADs:** If T2 (the severely demented self) is psychologically discontinuous with T1 (the competent directive-writing self), then T1's directive *is* effectively addressed to a different agent (a "stranger" inhabiting the same body).
      *   **Verdict:** **Practical Bioethical Claim (Not Platitude, Not Necessarily Radical).** This is the *core argument bioethicists actually use* when rejecting strict adherence to living wills. They point to the *massive shift in values, preferences, personality, and cognitive capacities* in conditions like late-stage dementia. They argue the *current experiential self* (T2) has such different interests and lacks the psychological connection to T1 that T1's authority doesn't transfer. This focuses on the *degree* of change, not an absolute metaphysical break. While it challenges simple identity-based authority, it doesn't inherently destroy contract law, as most contracts don't involve this level of psychological rupture between parties. It addresses the *specific problem* bioethics faces.

  3.  **The Normative Authority Claim (Even if Identical):**
      *   **Precise Claim:** Even if diachronic personal identity *is* maintained (T1 and T2 are metaphysically the same person), the normative authority of T1 over T2 is not automatic or absolute. T2 has its own present autonomy and interests that may justifiably override T1's prior instructions. Binding future selves requires a justification beyond mere identity.
      *   **Implication for ADs:** An advance directive is a request from one temporal part to another, not an immutable command. T2 must evaluate that request based on *current* reasons and circumstances, including T2's own values and well-being, potentially rejecting it.
      *   **Verdict:** **Significant Challenge (Beyond Platitude, Not Universally Accepted).** This is the most philosophically interesting and potentially disruptive claim. It directly attacks the intuition that "I have the right to bind my future self." It suggests that temporal authority needs justification (e.g., T1's expertise, protecting T2 from weakness of will, respecting T1's autonomy *as an expression*). Taken seriously, it *could* undermine the foundations of promises, commitments, savings, and long-term planning if pushed to extremes, as these rely on the expectation that future selves *ought* to be bound by past agreements. Bioethicists often *implicitly* rely on this when prioritizing the current suffering or apparent preferences of the incapacitated patient over the directive, even if identity isn't fundamentally questioned.

  **Where Bioethicists Actually Land:**
  Bioethicists rejecting strict living will adherence **primarily rely on Claim #2 (Psychological Discontinuity Cutoff)**, often bolstered by aspects of **Claim #3 (Normative Authority Not Automatic)**. They focus on the *profound disconnect* between the competent past self and the current experiential self in severe dementia/brain injury. They argue the directive-maker didn't/couldn't fully comprehend this future state and its potentially different values/interests (linking to epistemic access). Their concern is the *current person's* apparent well-being and suffering, which seems radically different from what the past self envisioned or valued. They *rarely* base their rejection solely on the radical Humean metaphysics of Claim #1.

  **The Epistemic Access Argument:**
  *   **Precise Claim:** The competent past self (T1) has privileged epistemic access to the "true," enduring, or core values of the person, while the future self (T2), especially if impaired (demented, delirious, severely depressed), has compromised access to these values. T2's expressed preferences may reflect impairment, not authentic values.
  *   **Relation to Authority:** This is a **separate justificatory claim**, often used to *bolster* the normative authority of the advance directive (Claim #3). The argument is: "T1 knows your *real* values better than impaired T2 does, therefore T1's directive *should* have authority over T2's current expressed wishes."
  *   **Critique/Smuggling?:** While plausible in *some* cases (e.g., temporary delirium), it's highly contentious in dementia. Critics argue:
      *   It assumes "true values" are static and fully knowable by T1, ignoring that values evolve and T1 might be mistaken about their future self's experience.
      *   It risks *denying the moral status* of T2's current experiential interests and preferences by dismissing them as "inauthentic."
      *   It can *smuggle in normative authority* by defining "authenticity" solely by reference to T1's perspective. If T2's preferences are deemed "inauthentic" *because* they contradict T1's directive, the argument becomes circular.
  *   **Bioethical Use:** Proponents of ADs use this argument heavily. Critics downplay T1's epistemic privilege regarding the lived experience of severe impairment and emphasize T2's current, undeniable interests (like avoiding apparent distress).

  **The Full Menu with Verdicts Summary:**

  | Claim Type                 | Core Idea                                                                 | Status & Verdict                                                                 | Relevance to Bioethics/ADs                                                      |
  | :------------------------- | :------------------------------------------------------------------------ | :------------------------------------------------------------------------------- | :----------------------------------------------------------------------------- |
  | **1. Humean Bundle**       | No persisting self; distinct temporal agents.                             | **Radical Theory.** Blows up contracts if applied. Not used by bioethicists.     | Low. Theoretical foundation only.                                              |
  | **2. Psych Discontinuity** | Severe psychological rupture = different normative agent.                 | **Practical Bioethical Claim.** Primary basis for rejecting ADs in dementia.     | High. Focuses on current suffering/value shift.                                |
  | **3. Normative Authority** | Future self's autonomy can override past self's instructions.             | **Significant Challenge.** Undercuts "binding" intuition. Implicit in critiques. | Medium-High. Used to justify prioritizing current state over past instruction. |
  | **Epistemic Access**       | Past self knows "true values" better than impaired future self.           | **Separate Justification.** Often used to *support* AD authority. Risks circularity. | High (in debate). Pro-AD argument countered by focus on current experience.    |

  Bioethicists opposing strict AD adherence operate primarily within the **Psychological Discontinuity** framework, implicitly appealing to the **Normative Authority** challenge (why *should* a radically different self be bound?), while rejecting the **Epistemic Privilege** argument as insufficient or invalid in cases of profound cognitive transformation. The radical "bundle of perceptions" view is background metaphysics, not their operational argument.
