prompt: |-
  Hey — I'm in a grad seminar on metaontology right now and last week we did verbal disputes, and I volunteered to bring a case to the next session, and I've been going in circles trying to build one myself, so I'd like you to build it for me. Here's the thing I want to test. We were given two seperate tests for whether a dispute is merely verbal, and they seem to come apart in practice: the dissolution test (disambiguate the contested term into a neutral vocabulary both parties share — if on every reading each side says something true and there's no residual disagreement about any neutral fact, the dispute is merely verbal and should just be dissolved), and the loaded-reading test (the dispute is merely verbal only if neither party has any non-linguistic reason to prefer their own reading, i.e. settling it by stipulation would leave everything either party cares about untouched).

  What I need is a case that passes the first test and fails the second: a dispute where everything dissolves under disambiguation, and yet the choice between readings is genuinely contested for reasons that aren't about what's true in the neutral vocabulary and aren't just a naked conflict of interest either — the reasons should be the expressive, institutional or normative kind, where adopting the other side's reading would mean honouring the wrong thing, or letting a rule reach a case it wasn't meant for, or signalling something the party has a real stake in not signalling. Constraints on the scenario, since it's going on a slide: realistic and contemporary, one paragraph, no sci-fi, no philosophers or linguists as characters, no jargon inside the story itself (no "composition", no "identity conditions" — the disputed word should be an ordinary English phrase like "the same", "still exists", "is one"), and the dispute should sit inside some institutional setting where the answer matters: a grant condition, a will, an insurance clause, a heritage designation, a club's rules. After the paragraph, list the facts both parties agree on, so it's visible that the disagreement isn't reducible to any of them. Important: don't stipulate the verdicts — I want the two tests to actually deliver them. The whole point of my 10-minute slot is that the tests come apart, so a case that only works because you built the answer in by hand is useless to me.

  Then for the discussion part: (a) what does a Hirsch-style deflationist say about the case — verbal, substantive, or something in between — and what do they say to the two parties; (b) what does a Sider-style realist who thinks some candidate readings carve nature at the joints say; (c) what does the view say whose name I can never remember, the one on which ontological disputes are really disputes about which framework to adopt and so can be non-descriptive and still perfectly substantive. (Don't bother with who defends which — we're not being graded on bibliography, and I can look up names later.) For each, say which feature of the case is driving the verdict, and what happens to the verdicts if I remove that feature — in particular, does the whole thing collapse into a boringly verbal dispute the moment you take out the institutional stakes, or does something survive. And please be honest about where your own reasoning is shakiest: I defintely have a suspicion that the loaded-reading test is just tracking practical importance rather than substantiveness, in which case my presentation is in trouble, so tell me what would convince you of that, and what would convince you of the opposite.
reasoning: |-
  We are to construct a case that passes the dissolution test (disambiguation leaves no residual disagreement about neutral facts) but fails the loaded-reading test (the parties have non-linguistic reasons to prefer their own reading, such as expressive, institutional, or normative reasons). The dispute must be in an institutional setting and use an ordinary term.

  Case: "The Same" in a Heritage Designation

  In the historic town of Millford, the local heritage committee is debating whether to grant protected status to the Old Mill. The building was severely damaged by a fire and then reconstructed using both original materials (about 60%) and new materials (40%). The committee's charter states that protection applies only to "the same building" that existed at the time of the town's founding. The chair, Alex, argues that the reconstructed mill is not "the same building" because the majority of its materials are new. The vice-chair, Bailey, argues that it is "the same building" because it stands on the original foundation, serves the same function, and has been continuously recognized as the Old Mill by the community. Both agree that the building has a new roof, new walls on two sides, and that the original foundation and some beams remain. They also agree on the exact proportions of original materials and the historical and cultural significance of the building. The dispute matters because if it is not the same building, it doesn't qualify for protection and can be sold for redevelopment.

  Facts both parties agree on:
  - The building is located on the original foundation.
  - Approximately 60% of the materials (by volume) are original, 40% are new.
  - The building has the same name, "Old Mill", and is used for the same purpose (a museum and community center).
  - The reconstruction was completed within one year of the fire.
  - The town's charter does not define "the same building" for this purpose.

  The dispute is about the meaning of "the same building". We disambiguate:

  Reading 1 (Material Continuity): A building is the same if and only if the majority of its material is original.
  Reading 2 (Formal/Functional Continuity): A building is the same if and only if it stands on the original foundation, serves the same function, and is recognized as such by the community.

  On Reading 1, Alex says something true: the majority of the material is not original (only 60% is, so not a majority? Actually 60% is a majority if we take majority as >50%, but wait: 60% is more than half, so it is a majority. Let me adjust: we need Alex to be right on one reading and Bailey on the other. So let's change: Alex argues that the reconstructed mill is not the same because less than 50% (or a critical threshold) of the original material remains? But we said 60% original. So let's fix: if we set the threshold at 50%, then 60% is above, so Alex would be wrong on that reading. That doesn't work. We need Alex to be correct on the material reading and Bailey on the functional reading. So we must set the facts such that on the material reading, the building does not have a majority of original material? But we said 60% is original. Then on the material reading (with majority defined as >50%), it would be the same. So we must change the fact: let's say only 40% is original. Then:

  Revised facts:
  - Approximately 40% of the materials (by volume) are original, 60% are new.

  Then, on Reading 1 (Material Continuity): A building is the same only if a majority of its material is original. Since 40% is not a majority, Alex (who says it's not the same) is correct on this reading.

  On Reading 2 (Formal/Functional Continuity): A building is the same if it stands on the original foundation, serves the same function, and is recognized as such. Bailey (who says it is the same) is correct on this reading.

  Both parties agree on all the neutral facts: the percentages, the foundation, the function, the recognition, etc. So the dissolution test is passed: when we disambiguate, each side says something true on one reading and there is no residual disagreement about the neutral facts.

  Now, why does the loaded-reading test fail? Because both parties have non-linguistic reasons to prefer their reading. Alex is concerned that if they call this the same building, they set a precedent that allows developers to replace most of a building and still claim heritage protection, which could lead to the erosion of authentic historical structures. Bailey is concerned that if they don't protect it, they lose a site of great community value and set a precedent that only materially intact buildings are protected, which would exclude many historically significant sites that have undergone necessary repairs. These are normative, institutional, and expressive reasons: about what the rule was meant for, what heritage protection should honor, and what signals the committee sends.

  The case without the institutional stakes (if we imagine the same dispute in a philosophical conversation) might be merely verbal, but with the stakes, the choice of reading has practical consequences and expresses values.

  Now, for the discussion:

  (a) Hirsch-style deflationist: 
     - Verdict: The dispute is verbal (in the sense that it's about the meaning of words) but because of the institutional stakes, it has practical importance. The deflationist would say that there is no fact of the matter about which reading is correct independent of the context. However, in this institutional context, the committee must make a decision. The deflationist would advise the parties to see that they are talking past each other and then to engage in a practical discussion about which definition best serves the purposes of the heritage charter. The residual disagreement is not about the neutral facts but about which standard to adopt for the future. So the deflationist might call it a verbal dispute but with important practical implications. If we remove the institutional stakes, it becomes purely verbal and dissolves.

  (b) Sider-style realist: 
     - Verdict: The dispute might be substantive if one of the readings carves nature at the joints better. For instance, if the material continuity is more "joint-carving" (because it tracks physical persistence), then Alex is right in a deeper sense. But it could be that neither reading is joint-carving and it's just a matter of convention. However, Sider might say that in the context of buildings, there is no objective fact about persistence because buildings are not fundamental entities. So he might see it as a verbal dispute. But if he thought that material composition is more fundamental, then he might side with Alex. The feature driving the verdict is whether the concept of building persistence has a privileged metaphysical structure. If we remove the institutional stakes, the realist might still think there is a fact of the matter (if he believes in such a metaphysical fact) or not.

  (c) The view that ontological disputes are about framework adoption (this is Carnap-style, or perhaps a more contemporary pragmatic view). 
     - Verdict: The dispute is substantive because it's about which framework (or set of rules) to adopt for heritage protection. The choice has normative and practical consequences. The parties are not describing the world but deciding how to conceptualize it for a purpose. So the dispute is non-descriptive but still substantive. The feature driving the verdict is the institutional setting and the normative stakes. If we remove the institutional stakes, then the dispute becomes purely about linguistic preferences and is not substantive.

  Now, about your suspicion: The loaded-reading test might indeed be tracking practical importance rather than substantiveness in a metaphysical sense. What would convince me that it's just practical? If in a case without any practical stakes, the parties still had a heated dispute and felt that something important was at stake (like in a purely philosophical context), then that would suggest that there is a non-practical sense of substantiveness. But in this case, without the institutional setting, the dispute would likely be seen as merely verbal. What would convince me of the opposite? If we can find a case where the two tests come apart but the non-linguistic reasons are not practical but theoretical (e.g., in a scientific context where two theories are empirically equivalent but one is more elegant or unifying), then that might show that the loaded-reading test is not just about practical stakes. But in this case, the non-linguistic reasons are practical and institutional.

  In the case above, the non-linguistic reasons are institutional and normative. So the loaded-reading test is tracking the practical significance of the choice of meaning. This might be a problem for your presentation if you want to show that the tests come apart in a way that reveals a non-practical form of substantiveness. However, the case still shows that the tests come apart: the dissolution test says verbal, but the loaded-reading test (if we interpret "non-linguistic reason" broadly) says not merely verbal because of the normative stakes. But note: the loaded-reading test as described includes "expressive, institutional or normative" reasons. So the case fits.

  Where my reasoning is shakiest: 
  - I worry that in the disambiguation, I have set up the readings arbitrarily. Why these two readings? The parties might not accept that these are the only options. But for the purpose of the case, we can stipulate that these are the two natural disambiguations.
  - The material continuity reading with a 50% threshold may seem arbitrary. But again, in the context, it's a natural way to disambiguate.
  - The loaded-reading test: if the non-linguistic reasons are about what the rule was meant for, that might be seen as linguistic (about the intent of the rule). But I think the intent is non-linguistic in the sense that it's about the purpose of the rule, which is normative.

  Final case paragraph:

  In Millford, the heritage committee debates whether the fire-damaged and reconstructed Old Mill is "the same building" as before, as required for heritage protection. Alex argues it is not, because less than half of the original materials remain (only 40%). Bailey argues it is, because it stands on the original foundation and continues to serve as the community museum. Both agree on the building's history, the 40% original material, and its current use and foundation. The decision affects whether the site can be sold for redevelopment. Alex worries that granting protection sets a bad precedent for authenticity; Bailey fears that denying it undermines community heritage that has evolved over time.

  Facts agreed: 
  - Original foundation: yes
  - Original materials: 40% by volume
  - Function: same as before (museum)
  - Reconstruction time: within one year
  - Community recognition: still called the Old Mill

  Disambiguations:
  - Material reading: same building only if >50% original material → not the same (Alex correct)
  - Formal/functional reading: same building if same foundation, function, and recognition → same (Bailey correct)

  No residual disagreement about the facts.

  Now, the loaded-reading test fails: Alex has a non-linguistic reason (preserving authenticity in heritage) and Bailey has one (recognizing the evolving nature of heritage and community value) to prefer their readings.

  This should work.
answer: |-
  ### Case: Heritage Designation of the Old Mill
  In Millford, the heritage committee must decide whether the reconstructed Old Mill qualifies as "the same building" under the town's bylaws to receive a conservation grant. The original 18th-century mill burned down; the foundation and one wall were saved, but the rest was rebuilt using modern materials. The grant requires the building to be "the same" as when designated in 1950. Committee chair Taylor argues it is *not* the same building because over 70% of its physical material is new. Member Jordan argues it *is* the same because it occupies the identical footprint, serves the same function (a grain mill), and has been continuously owned and operated by the same family. Both agree on all material facts, but Taylor fears designating it sets a precedent that undermines preservation by rewarding replacement over restoration. Jordan worries denying it ignores the mill’s unbroken cultural role and penalizes necessary reconstruction after disasters. The grant affects tax breaks and demolition protections.

  **Agreed Neutral Facts**:
  - The building stands on the original 18th-century foundation.
  - Approximately 30% of the current structure (by volume) is original material; 70% is new.
  - It operates identically to the pre-fire mill (same machinery, output, and ownership).
  - The fire occurred in 2020; reconstruction finished in 2022.
  - No bylaws define "the same building" beyond the grant clause.

  **Disambiguation**:
  - Reading 1 (Material-Based): "The same building" requires >50% original material → Taylor’s claim is true (30% < 50%).
  - Reading 2 (Functional-Continuity-Based): "The same building" requires identical location, function, and continuous institutional identity → Jordan’s claim is true.

  No residual disagreement exists about the neutral facts (e.g., material percentage, function). The dispute dissolves under the dissolution test. Yet, under the loaded-reading test, the choice between readings is non-linguistically loaded: Taylor’s stance honors historical authenticity to prevent "façadism," while Jordan’s stance honors adaptive resilience to sustain community institutions. Adopting the other’s reading would signal endorsement of values each party opposes.

  ---

  ### Discussion
  **(a) Hirsch-Style Deflationist**:  
  - **Verdict**: The dispute is *merely verbal* but *practically significant*. The deflationist sees no residual factual disagreement after disambiguation—only a choice between linguistic conventions. They would advise both parties to stipulate a definition for "the same building" in the bylaws, as the dispute is "about words, not the world." The institutional stakes (e.g., grant eligibility) make it practically important but not metaphysically substantive.  
  - **Driving Feature**: The absence of neutral-fact disagreement. If institutional stakes are removed (e.g., no grant), the dispute collapses into a purely verbal one with no practical consequences.  

  **(b) Sider-Style Realist**:  
  - **Verdict**: *Substantive* if one reading "carves nature at the joints." Suppose Sider views material composition as a joint-carving property (e.g., buildings are mereological sums). Then Taylor’s reading is objectively correct because it tracks fundamental structure, making the dispute about reality, not words. If neither reading carves joints (e.g., buildings lack privileged persistence conditions), it defaults to verbal.  
  - **Driving Feature**: The existence of a privileged metaphysical structure. Removing institutional stakes (e.g., no grant) doesn’t change the verdict—if material composition is joint-carving, the dispute remains substantive.  

  **(c) Carnap-Style Framework-Relativism** (ontological disputes as framework choices):  
  - **Verdict**: *Substantive but non-descriptive*. The dispute is about which practical framework (e.g., "preservation" vs. "continuity") to adopt for heritage governance. It’s substantive because the choice has real normative consequences (e.g., incentivizing restoration vs. reconstruction), not because it describes mind-independent reality.  
  - **Driving Feature**: The institutional stakes and normative goals. If these are removed, the dispute becomes a "boringly verbal" preference without substance.  

  ---

  ### Critical Reflection on the Loaded-Reading Test
  **Your Suspicion**: You worry the loaded-reading test conflates "practical importance" with "substantiveness." In this case, the test fails (i.e., the dispute isn’t "merely verbal") because of non-linguistic *practical* stakes (e.g., grant outcomes, precedents), not because of deep metaphysical disagreement. This could undermine your presentation if substantiveness requires more than practical weight.  

  **What Would Convince Me the Test is Tracking Practicality**:  
  - If all cases passing the loaded-reading test involve institutional/ethical stakes (e.g., wills, laws), and none arise in "pure" contexts (e.g., abstract philosophy), it suggests the test only flags practical relevance. Here, the non-linguistic reasons (e.g., "signaling authenticity") are tied to Millford’s governance, not ontology.  

  **What Would Convince Me Otherwise**:  
  - A case where parties have *theoretical* non-linguistic reasons (e.g., mathematical elegance, empirical adequacy in science) to prefer a reading *without* practical stakes. For example, physicists disputing "particle" vs. "wave" in a quantum ontology with identical predictions, where one reading aligns better with a grand unifying theory. This would show the test captures non-practical substantiveness.  

  **Where My Reasoning is Shakier**:  
  - The disambiguation assumes only two readings. If more exist (e.g., "same building" requiring historical designation records), the dissolution test might not fully resolve the dispute.  
  - The normative reasons (e.g., "honoring authenticity") could be seen as reducible to interests (e.g., Taylor’s anti-development ideology), blurring the line between "expressive" and "conflict of interest."  
  - **Key Caveat**: Removing institutional stakes *does* collapse the case into a boringly verbal dispute, suggesting the loaded-reading test’s failure hinges entirely on practical context. This supports your suspicion—but it still shows the tests *come apart* in practice, which is your core point.  

  This case satisfies your constraints: it’s contemporary, jargon-free, institutional, and lets the tests deliver divergent verdicts organically. Use the heritage example for clarity in your seminar.
