answer: |-
  ### The Stalled Dialectic  
  Hegel's master-slave dialectic hinges on *mutual transformation*: the master’s initial dominance relies on the slave’s fear-driven submission. But through labor, the slave develops self-consciousness and practical mastery over the world, while the master becomes passively dependent on the slave’s productivity. This forces the master to recognize the slave’s consciousness to sustain their own existence. Victor Frankenstein’s relationship with his creature inverts this. The creature *does* the formative labor — educating himself, developing empathy, even saving lives — yet Victor remains psychologically and materially independent. He refuses to engage with the creature’s consciousness, reducing him to a "monster" to be destroyed. The dialectic stalls because Victor evades the *dependency* Hegel sees as inevitable; he weaponizes negation (destruction) instead of confronting the need for recognition. Shelley exposes a pathological refusal of reciprocity, where the master clings to isolation.

  ### Scene Readings  
  - **De Lacey Education**: The creature’s labor isn’t physical but intellectual/emotional: mastering language, philosophy, and ethics through observation. This mirrors the slave’s self-development, positioning him to demand recognition. Victor’s later refusal to "hear" his story rejects this cultivated consciousness. The lens illuminates the tragedy of wasted labor but strains slightly — the De Laceys aren’t Victor, so the creature’s work isn’t *directly* enriching his master.  
  - **Rescue/Shooting**: Saving the drowning girl is the creature’s attempt to *demonstrate* his moral capacity through action — labor meant to compel social recognition. Being shot dramatizes the failure of this exchange: society (and by extension Victor) rejects his contribution, denying his consciousness any value. The Hegelian logic holds strongly here: labor offered, recognition violently refused.  
  - **Demand for a Companion**: The creature explicitly ties recognition to dependency: "I will be alone if you create a mate." This is a direct bid to force Victor into relational reliance — acknowledging the creature’s needs sustains Victor’s safety. Victor’s destruction of the female body is the ultimate negation, refusing entanglement. The lens powerfully frames this as the master sabotaging the very dependency that would force recognition.

  ### Where the Novel Pushes Back  
  Shelley subtly challenges Hegel by prioritizing *unconditional moral status* over dialectical negotiation. The creature’s personhood isn’t earned through labor or forced recognition; it’s inherent. His eloquent despair ("I ought to be thy Adam") appeals to innate dignity, not transactional validation. Victor’s refusal to "need" him isn’t just a stalled dialectic — it’s a moral failure detached from power dynamics. The reading strains when framing the creature’s violence post-betrayal: Hegel’s slave achieves liberation through work, not vengeance. Shelley suggests recognition denied *corrupts* consciousness, a darker outcome than Hegel’s synthesis.

  ### What Frankenstein Adds  
  Hegel assumes the master’s material dependence on the slave’s labor creates inevitable vulnerability. Victor shatters this: his "self-sufficiency" is maintained through *pure negation* — destroying the female creature, refusing dialogue, pursuing annihilation. He remains "master" by obliterating the object of dependency rather than yielding to it. Shelley reveals a terrifying possibility: a consciousness so solipsistic it sustains dominance through relentless denial of the other’s reality, escaping dialectical progression entirely. The novel corrects philosophy by showing negation as a sustainable (though destructive) strategy.

  ### Bottom Line  
  This is a **productive misreading**. It distorts Hegel’s teleological optimism but uncovers Shelley’s radical insight: recognition can fail absolutely when power rejects entanglement. The lens illuminates Victor’s pathological autonomy and the creature’s trapped agency, making the novel’s tragedy feel philosophically urgent — not just emotional, but systemic. While Hegel expects synthesis, Shelley shows the void when negation prevails.
