  After meticulously sorting molecules for hours, Maxwell's demon finally leaned back, admiring the pristine hot and cold chambers. "Second law?" he scoffed. "More like a mild suggestion!"  

  Just then, his assistant scurried in, clutching a ledger. "Boss, we’re out of memory. Gotta clear the particle logs to sort the next batch!"  

  The demon waved dismissively. "Fine, wipe it. What’s the big deal?"  

  The assistant hesitated. "But the erasure protocol... it’s demanding kT ln 2 per bit for the reset."  

  The demon’s grin froze. "Per bit? How many bits did we log?"  

  "Enough that the energy cost exceeds the work you *didn’t* do sorting."  

  The demon slumped, muttering, "So the real violation was thinking I could forget for free."
