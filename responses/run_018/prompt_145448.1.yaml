  i think he's smushing together williams's actual view with stuff he made up, but im not sharp enough to call out exactly where. is this summary fair? go part by part: the claim that moral demands are just bullying if theyre not in your S, the claim that reflection only reshuffles existing desires, and especially the locked box / reason portability thing — is that williams or is he projecting? also, does the conclusion that all moral obligations are fake pressure actually follow from the internalist premise, or is there a gap?

  please break it down clearly, and dont just list books — i cant check those right now. end with a single line starting with Verdict: that gives your overall call in a few words, like Verdict: mostly unfair — locked box is jakes invention

