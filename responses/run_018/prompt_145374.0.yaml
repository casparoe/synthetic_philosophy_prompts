  Intergenerational ethics exposes radical edges. Core tranquilism clearly prefers the desireless population as intrinsically superior. The non-existence comparison is brilliant - tranquilism must claim contentment is better than nothing since annihilation lacks a subject experiencing craving's absence. This avoids nihilism but commits to valuing subjectless non-suffering less than existing contentment.

  Boundary conditions... Negative hedonism would value suffering reduction alone, but tranquilism uniquely values craving absence even without suffering. Ascetic nihilism would emerge if craving absence requires rejecting all existence. The population ethics case best distinguishes these - if tranquilism accepts existence in desireless contentment as valuable, it escapes nihilism.

