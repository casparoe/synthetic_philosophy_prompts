answer: |-
  The institutional pattern in personal-injury litigation reveals a specific, implicit theory about why pain is bad, which can be reconstructed as follows:

  **Implicit Theory:** Pain's badness fundamentally resides in its *affective* (emotional distress) and *motivational* (withdrawal/aversive behavior) components, not in the raw sensory intensity (nociception) alone. Harm is tied to the disruption of subjective well-being, functional capacity, or agency – the "suffering" aspect of pain. Structural tissue damage is compensated as a violation of bodily integrity and health, a separate harm independent of the victim's conscious experience.

  ### Key Distinctions:
  1. **What the Practice Strictly Requires:**  
     - Compensation for "pain and suffering" *demands proof of affective/motivational distress* (e.g., anxiety, depression, life disruption, avoidance).  
     - Compensation for tissue damage requires *objective proof of physical injury* (e.g., scans, medical reports), irrespective of subjective pain or suffering.  

  2. **What the Practice Accommodates:**  
     - The system accommodates that nociception *can* cause suffering (and thus be compensable), but it is not *inherently* compensable without accompanying affect/behavior.  
     - It accommodates that structural damage *may* cause suffering but treats it as compensable *even if it doesn’t*.  

  **Consistency Check:** The legal system’s compensation for purely structural injury *is consistent* with this theory. Tissue damage violates the objective good of bodily health and function – a harm to the person’s physical integrity and future capabilities, even if unaccompanied by conscious distress. This aligns with the view that bodily integrity holds intrinsic ethical/legal weight, independent of subjective experience.  

  ### If Badness Resided Solely in Sensory Intensity:  
  A purely sensory-intensity view would require courts to:  
  1. **Compensate intense nociception regardless of affect or behavior.** Pain-asymbolia cases (neutral/curious reactions to intense sensation) would warrant full "pain and suffering" damages.  
  2. **Reduce emphasis on affective testimony.** Subjective reports of high-intensity sensation alone would suffice, even without distress.  
  3. **Re-evaluate compensating tissue damage without nociception.** If harm is *only* in felt intensity, structural damage without sensory input (e.g., nerve-deadened injury) might not be compensable as "pain," contradicting current practice.  

  ### Conclusion:  
  The asymmetry in legal practice – discounting nociception without suffering while compensating tissue damage without feeling – cannot be justified by a theory that locates pain’s badness entirely in sensory intensity. It presupposes that pain is bad *because it makes us suffer*, not merely because nerves fire intensely. Sensory quality without negative affect is treated as ethically and legally weightless in the context of "pain and suffering" damages, though tissue damage retains independent value.  

  ---

  **Verdict:** The asymmetry best supports the view that pain’s badness derives from its *affective and motivational properties*, not sensory intensity alone.
