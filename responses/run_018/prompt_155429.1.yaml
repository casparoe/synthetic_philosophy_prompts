prompt: |-
  As someone who has recently begun studying evolutionary explanations of social behavior, I find myself returning to a conceptual tension in the units-of-selection debate that introductory treatments usually resolve too quickly. I am not asking which level—gene, individual, or group—is ultimately correct; rather, I want you to construct a concrete, somewhat non-standard evolutionary scenario in which adopting the gene-level framing versus the multilevel-selection framing yields genuinely incompatible conceptual judgments about whether a particular trait counts as adaptive or maladaptive. Specifically, I want the example to involve facultative social behavior—where individuals can switch between solitary and cooperative phenotypes—rather than obligate eusociality, because phenotypic plasticity introduces ambiguity about what counts as the replicator boundary and about the appropriate fitness baseline for measuring costs and benefits. The scenario should illustrate how this divergence is not settled merely by invoking Hamilton’s rule or kin-selection coefficients, but instead reveals a deeper disagreement over whether evolutionary explanations must cite physically discrete replicators and how to treat costs that are partially recoverable through phenotypic switching. Please design the example so that it can be fully analyzed from first principles and general evolutionary concepts, without reference to specific empirical studies or citations, and show precisely where the two frameworks diverge in their assessment of adaptiveness and in the conditions they treat as necessary for selection to operate.
reasoning: |-
  Okay, the user is diving deep into evolutionary biology, specifically the units-of-selection debate. They want a scenario where gene-level and multilevel selection frameworks give conflicting judgments on a trait's adaptiveness. The key is facultative social behavior—phenotypic plasticity, not obligate eusociality. They’re asking for a concrete example that highlights conceptual tension beyond just Hamilton’s rule.

  First, I need to set up a scenario with facultative behavior. Let me brainstorm a species that can switch between solitary and cooperative modes based on environment. Maybe a fictional rodent in a variable habitat—seasonal changes could trigger the switch. The cooperative behavior should have a cost but also benefits that vary with group size. 

  The trait in question could be a "cooperation threshold mechanism." Individuals cooperate only if a certain number of others are cooperating. This introduces frequency-dependence and recoverable costs since they can switch back to solitary if conditions change. 

  For the gene-level perspective, I’ll focus on a hypothetical allele (C) that codes for this threshold. Fitness calculations need to show that C can spread even if cooperation sometimes reduces individual survival, because when cooperation pays off, it pays big. The key is marginal fitness—when cooperation is triggered, the benefits outweigh the costs for the allele. 

  For multilevel selection, I need to partition fitness into within-group and between-group components. Cooperation might be maladaptive within groups because cooperators have lower survival than non-cooperators in the same group. But groups with more cooperators might produce more dispersers. So between-group selection could favor cooperation even if within-group selection doesn’t. 

  The conflict: Gene-level sees the trait as adaptive because the allele spreads. Multilevel might see it as maladaptive at the individual level within groups but adaptive at the group level. The user wants this incompatibility highlighted—especially how recoverable costs (switching back to solitary) blur the fitness baseline. 

  Hamilton’s rule shouldn’t resolve this cleanly. If relatedness is low, rb > c might not hold, yet the gene could still spread due to temporary group benefits. That’s the tension—multilevel requires group structure for selection to act, while gene-level doesn’t care about physical replicators as long as the allele frequency changes. 

  I’ll make sure the example is self-contained, no real-world citations. The math should be simple but precise. The divergence points: gene-level’s allele-centric view versus multilevel’s need for trait groups and contextual analysis. Also, how recoverable costs (via plasticity) affect fitness accounting differently in each framework. 

  Finally, I’ll emphasize that this isn’t about which framework is "correct," but how they lead to different conceptual judgments on adaptiveness. The user’s deeper need is understanding the philosophical underpinnings—replicator boundaries and the necessity of discrete units in evolutionary explanation.
answer: |-
  Here is a concrete scenario designed to highlight the conceptual divergence between gene-centric and multilevel selection frameworks when assessing facultative social behavior:

  ### Scenario: The Cyclical Canyon Mice
  *   **Environment:** A canyon with two distinct seasons: Wet Season (abundant, dispersed food) and Dry Season (scarce, clustered food requiring cooperative excavation).
  *   **Organism:** A fictional rodent species exhibiting facultative cooperation.
  *   **Trait:** A genetically influenced "cooperation threshold" mechanism. Individuals possess an allele (C) that makes them:
      1.  **Solitary Foragers:** During Wet Season (low population density, dispersed food).
      2.  **Cooperative Excavators:** During Dry Season *only if* they perceive at least 3 other cooperative individuals nearby. They dig communal burrows to access deep water reservoirs. Excavation carries a significant *individual* survival cost (energy expenditure, predation risk) but is essential for group survival. *Crucially*, individuals can switch back to solitary behavior if cooperation fails (e.g., insufficient cooperators).
  *   **Alternative Allele:** Null allele (N). Carriers remain solitary year-round. They avoid excavation costs but cannot access deep water on their own. They *can* freeload in burrows dug by cooperators if they find one.
  *   **Population Structure:** Large population with semi-random dispersal between seasons. Groups form anew each Dry Season based on proximity (low relatedness). Groups vary in the frequency of C-allele carriers.
  *   **Fitness Components:**
      *   **Wet Season:** Solitary foraging. Fitness (offspring produced) is high and similar for all.
      *   **Dry Season:**
          *   **Solitary (N or failed C):** Low fitness (starvation/dehydration). *Unless* they find a burrow to freeload (fitness then = baseline survival).
          *   **Successful Cooperators (C in group ≥4 cooperators):** Moderate fitness (pay cost but gain resource). Lower *immediate* survival than a freeloader in the *same* successful group, but higher than a solitary.
          *   **Freeloader (N in group ≥4 cooperators):** Highest fitness (no cost, gains resource).
          *   **Failed Group (<4 cooperators):** All individuals get low fitness (solitary-level).

  ### Fitness Calculations (Simplified)
  Assume baseline Wet Season fitness = 10 offspring. Dry Season outcomes:
  *   Solitary (no burrow): 0 offspring
  *   Freeloader in successful group: 8 offspring (minor cost from competition)
  *   Successful Cooperator: 6 offspring (paying cost)
  *   *Any* individual in failed group: 2 offspring (some scavenging)

  **Gene-Level (Allele-Centric) Analysis:**
  1.  **Replicator:** The C allele.
  2.  **Fitness Assignment:** The fitness of C is the *average* reproductive output of individuals *carrying C* across the contexts they experience.
  3.  **Calculation:**
      *   C-carrier fitness depends on Dry Season group composition.
      *   If in a group with ≥3 *other* C-carriers (≥4 total), they cooperate successfully: Fitness = 6.
      *   If in a group with <3 other C-carriers, cooperation fails. They revert to solitary: Fitness = 2 (or 8 if they freeload, but they don't initiate digging).
      *   *Key Point:* The cost of cooperation (resulting in 6 vs. a freeloader's 8 *in the same group*) is real. However, the *critical* comparison for the allele is its performance *relative to the alternative (N)* in the *same environment*, considering the *probability* of being in successful vs. failed groups. If the frequency of C is high enough that C-carriers are frequently in successful groups (fitness=6), while N-carriers are frequently in failed groups (fitness=2) or only sometimes freeload (fitness=8 *if* they land in a successful group), C can have higher *average* fitness than N. The ability to *switch away* from cooperation when it would be futile (getting 2 instead of wasting effort and getting 0) *mitigates the cost* for the C allele.
  4.  **Verdict on Adaptiveness:** The C allele is **adaptive**. It persists/spreads because its average fitness across the metapopulation and across seasons is higher than N. The cooperation it enables (under the right conditions) provides a net benefit *to the allele's transmission*, despite the within-group cost paid in successful cooperator groups. The *plasticity* (switching) is crucial to this calculation – it prevents catastrophic fitness loss when cooperation is impossible.

  **Multilevel Selection (MLS) Analysis:**
  1.  **Replicator/Unit Boundary:** Focuses on the *Dry Season group* as a potential unit of selection. Individuals are also units.
  2.  **Fitness Partitioning:** Uses the *Contextual Analysis* approach. Fitness is partitioned into:
      *   **Within-Group Component:** Effect of individual phenotype *relative to others in the same group*.
      *   **Between-Group Component:** Effect of group phenotype (e.g., % cooperators) on group productivity (average fitness).
  3.  **Calculation:**
      *   **Within-Group Selection:** *Within any specific Dry Season group*, the fitness of a cooperator is *always lower* than a non-cooperator (N carrier or a C-carrier in a failed group who didn't cooperate). In a successful group: Cooperator=6, Freeloader=8. In a failed group: Non-cooperator=2, "Failed Cooperator"=2 (same). Cooperation is *locally disadvantageous*; within-group selection *favors the N allele*.
      *   **Between-Group Selection:** Groups with a high frequency of C-carriers are much more likely to form ≥4 cooperators and succeed (average fitness ~6-7). Groups with few C-carriers are likely to fail (average fitness ~2). Between-group selection *strongly favors groups with high C frequency*.
      *   **Net Selection:** The fate of the C allele depends on the balance: Strong between-group selection *for* cooperation vs. strong within-group selection *against* cooperation.
  4.  **Verdict on Adaptiveness (Trait Level):** The analysis reveals a conflict. The *cooperative phenotype itself* is **maladaptive at the individual level within groups** (it always reduces fitness relative to non-cooperators in the same context). However, the *tendency to form cooperative groups* is **adaptive at the group level**. The trait "cooperation threshold mechanism" is maintained by group selection *overcoming* individual selection against it. Calling the *trait* "adaptive" is ambiguous without specifying the level. The plasticity complicates defining the "trait" – is it the cooperative act or the conditional rule?

  ### Point of Divergence & Conceptual Tension

  1.  **Judgment of Adaptiveness:**
      *   **Gene-Level:** Declares the C allele **adaptive**. Adaptiveness is defined purely by the statistical success (frequency increase) of the genetic information *itself* across generations. The costs paid by individual carriers in successful groups are real but *outweighed by the benefits in other contexts/outcomes*, especially due to plasticity preventing worse losses.
      *   **Multilevel:** Reveals the cooperative behavior enabled by C is **maladaptive within groups** but **adaptive for groups**. It denies a single verdict on "the trait," highlighting a level-specific conflict. Adaptiveness is tied to the *fitness consequences at specific hierarchical levels* for the *phenotype* within defined groups.

  2.  **Necessary Conditions & Replicator Boundaries:**
      *   **Gene-Level:** Requires only *heritable variation* in fitness. The physical replicator (DNA) is paramount. The "group" is merely part of the environment shaping the allele's fitness. Costs are recoverable *if switching avoids worse outcomes* – plasticity is integral to the allele's strategy. Hamilton's rule (`rb > c`) is a *calculation tool* for predicting allele frequency change; `c` and `b` are measured from the *allele's perspective*, incorporating the effects of plasticity and group structure on its average fitness. The deep disagreement arises if MLS argues `rb > c` *misrepresents* the causal structure by not explicitly partitioning levels.
      *   **Multilevel:** Requires *structured populations* with *variation among groups* and *differential group productivity* for group selection to act. Phenotypic plasticity doesn't negate the groups as units; groups form anew each season, providing the necessary context. Recoverable costs (switching) are handled by analyzing fitness *within the specific group context*. The deep disagreement is whether an explanation citing *only* the gene (and average fitness) is sufficient, or if explicitly acknowledging groups as *interactors* (sites of selection) is necessary to understand the *dynamics* and *causal forces* maintaining the trait. MLS argues that `rb > c` often *hides* the group selection component (`r` becomes a statistical proxy for group structure).

  **Why Hamilton's Rule Doesn't Resolve This:**
  You could calculate an `r` (relatedness or more broadly, assortment) and `b`/`c` for the C allele. However:
  *   `c` (cost to actor): Depends on context. Is it the difference between cooperator and freeloader *within a group* (6 vs 8, `c=2`)? Or the difference between a successful cooperator and a failed non-cooperator *across groups* (6 vs 2, implying `c` is overcome)? The gene-centric view uses the latter implicitly in its average fitness calculation.
  *   `b` (benefit to recipient): Who is the recipient? Other allele carriers? Group members? The group itself?
  *   `r`: With low relatedness and random group formation, `r` might be low, suggesting `rb < c` based on within-group `c`. Yet, the C allele persists due to between-group differences. The gene-centric view would argue `r` must be interpreted broadly as *assortment on the trait*, capturing the group benefit in a single coefficient. The MLS view argues this masks the distinct causal process of group selection – the benefit `b` accrues *to the group as a unit*, not just to individual recipients.

  This scenario forces the conflict: The gene-level view sees a replicator (C allele) prospering through a flexible strategy in a variable environment. The multilevel view sees a phenotype maintained by opposing selection forces at different levels, requiring explicit recognition of groups as units. The plasticity and recoverable costs make the baseline for measuring "cost" ambiguous, deepening the disagreement about what constitutes an adequate evolutionary explanation.
