  The prep sheet should use British English and stay practical - no bibliographies, just battle-ready replies. I'll order objections by likelihood and damage potential, with the untestability charge first since it's both common and dangerous if unanswered.
answer: |-
  ## Q&A Prep Sheet: Simulation Argument as Fanaticism Dampener  
  **Audience:** Longtermist researchers/grantmakers (expected-value focused, dismissive of sim argument’s practicality). Anthropics specialists (2), moral philosopher (suspects "fanaticism" = risk aversion).  

  **Core Thesis Recap:** Non-negligible P(in simulation) → non-trivial P(discontinuous/truncated far future) → **dampens EV of far-future-shaping work** vs. near-term robust goods. **Upshot:** Flattened portfolio, not abandonment of longtermism.  

  ---

  ### Top Objections & Replies (Ordered by Likelihood/Damage)  

  1.  **"The simulation hypothesis is untestable/metaphysical speculation. Dedicating mental energy or portfolio weight to it is pragmatically inert or epistemically irresponsible."**  
      *(Likely from majority; highly damaging if conceded)*  
      **Force:** Moderate. Undermines argument’s operational relevance.  
      **Pre-emptive Concession:** "I concede it’s untestable *today* and sits uneasily with strict empiricism. It’s not falsifiable."  
      **Reply (2 mins):** "While untestable, it’s not *logically incoherent* or *physically impossible* given our best theories (Bostrom’s trilemma). Expected value reasoning *requires* us to weigh non-falsifiable-but-possible scenarios if they have extreme stakes. We do this with AI x-risk (unobservable post-apocalyptic futures) or Fermi paradox solutions. Dismissing it *because* it’s untestable privileges near-term empiricism over the very far-future modelling we’re committed to. Pragmatically, if grantmakers assign even 1% credence to sims, and sims imply truncated futures, that 1% massively dilutes the *leverage* of far-future interventions in EV calculations. Ignoring it isn’t neutrality—it’s implicitly assigning P(sim)≈0."  
      **Soft Spot:** Doesn’t resolve epistemic unease; relies on EV framework’s legitimacy for non-empirical hypotheses.  

  2.  **"Anthropic reasoning dissolves this: if sims exist, we’re overwhelmingly likely to be in one with a long future (or the base reality), so the EV isn’t dampened."**  
      *(From anthropics specialists; highly damaging if unchallenged)*  
      **Force:** Strong, but contestable.  
      **Pre-emptive Concession:** "I agree anthropics is crucial; if we’re typical observers, P(in base reality) is low *if* sims vastly outnumber base realities."  
      **Reply (2 mins):** "Anthropics doesn’t guarantee we’re in a long-future sim. First, if sims are run for short-term purposes (e.g., ancestor simulations up to 2023), most sim-lives *are* in ‘truncated’ runs. Second, if sims can be paused/erased arbitrarily by base-level operators, the *continuity* of our future is under external control—it’s not a ‘long future’ in the morally relevant sense assumed by longtermism. Third, even if we’re probably sims, the *value function* for base-reality-centric interventions (e.g., reducing base-level x-risk) becomes unstable: is the operator’s future continuous with ours? The key isn’t just observer count, but the *discontinuity risk* inherent to nested simulations. This risk doesn’t average out; it caps the EV ceiling."  
      **Soft Spot:** Assumes sims are often short-term/arbitrary; anthropics counterarguments can get technically complex.  

  3.  **"This is just risk-aversion masquerading as sophistication. The astronomical stakes of the *possible* long future still dominate, even with sim uncertainty."**  
      *(From moral philosopher; damaging to motivation)*  
      **Force:** Moderate. Questions psychological motives.  
      **Pre-emptive Concession:** "I agree we must guard against pure loss-aversion paralysing bold action. And yes, the far future’s *potential* scale remains immense."  
      **Reply (2 mins):** "This isn’t about risk-aversion; it’s about *correlation neglect*. Longtermist EV calculations assume the future we influence is causally and temporally continuous with our actions. Sims break that continuity: saving Earth in a sim might not affect the operator’s timeline, or might be rerun. This isn’t adding ‘risk’—it’s dissolving the *causal link* that gives far-future work its leverage. Near-term goods (e.g., curing disease) often have more robust causal pathways *even in sims*. We’re not downweighting big stakes; we’re downweighting interventions whose *mechanism of impact* is uniquely vulnerable to sim-discontinuity."  
      **Soft Spot:** Doesn’t prove causal links for near-term goods are *more* sim-robust (e.g., is a malaria bed net in a sim ‘real’?).  

  4.  **"Even if we’re in a sim, the base reality’s future likely dominates EV calculations. Influencing *this* sim could affect trillions of future sims or the base logic."**  
      *(From longtermists; undermines portfolio dampening)*  
      **Force:** Moderate-Strong.  
      **Pre-emptive Concession:** "Absolutely—if our actions credibly influence base-level reality (e.g., via acausal trade), the EV could remain astronomical. I support work on such ‘upstream’ effects."  
      **Reply (2 mins):** "Two points. First, influencing base reality is highly speculative, even by longtermist standards—it adds layers of uncertainty beyond standard x-risk reduction. Second, and crucially, *most current longtermist interventions don’t target this*. Work on AI alignment or nuclear security assumes direct future continuity. If we’re in a sim, aligning *our* AI might not affect the operator’s AI. Unless an intervention specifically targets sim-to-base leverage (which is poorly understood), its EV *is* dampened. This flattens the portfolio by elevating near-term work and *specific* sim/base-bridging interventions over generic far-future shaping."  
      **Soft Spot:** Concedes longtermism could ‘win’ via upstream effects; vague on what counts as a ‘base-bridging’ intervention.  

  5.  **"Assigning ‘non-negligible’ P(sim) is arbitrary. Unless you commit to a number, this is just hand-waving to justify shifting resources to near-term work."**  
      *(From sceptics; challenges core premise)*  
      **Force:** Moderate.  
      **Pre-emptive Concession:** "You’re right—I haven’t pinned down a number. Reasonable credences vary wildly."  
      **Reply (2 mins):** "The point isn’t the exact number, but the *structural* impact of any credence >0.1% in a discontinuous sim scenario. Why >0.1%? Because longtermism often leverages *tiny probabilities* of vast futures (e.g., 0.001% chance of securing a galaxy). If P(sim discontinuity) is even 10x higher than that, it competes directly. Crucially, near-term interventions aren’t similarly dampened—bed nets work in base reality *and* most sims. So, unless your P(sim discontinuity) is *microscopic* (which requires strong priors against Bostrom’s trilemma), it flattens the portfolio by making near-term work relatively *more* robust."  
      **Soft Spot:** Threshold (0.1%) is illustrative; audience may demand personal credence (see **Dreaded Question**).  

  ---

  ### The One Question to Dread  
  **"What is *your* all-things-considered P(that we live in a simulation with a discontinuous future), and how does that specific number materially change *your* recommended portfolio allocation?"**  

  **Why Dread It?** Forces overprecise commitment. Numbers will seem arbitrary; audience will attack the credence (too high/low). Allocation advice becomes a target.  

  **Mitigation Strategy:**  
  1.  **Deflect precision:** "I’d put it between 0.5% and 5%, but the key isn’t my number—it’s that *any* non-trivial credence structurally shifts EV calculations."  
  2.  **Reframe to principle:** "My point is that *if* your credence is above, say, 0.1%, near-term work becomes competitive with longtermist work lacking sim robustness. You should allocate based on *your* credence."  
  3.  **Pivot to robustness:** "Rather than fixate on P(sim), note that near-term interventions are *less vulnerable* to this uncertainty. That’s why they regain weight."  

  ---

  **Speaker Notes:**  
  - **Tone:** Collaborative ("We’re all longtermists here"), not contrarian. Frame as *strengthening* longtermism against fragility.  
  - **Anchor in EV:** Use their language ("leverage", "astronomical stakes", "x-risk"). Avoid philosophy-of-mind tangles.  
  - **Concede Early:** Grant testability issues, anthropic complexity, and risk of bad motives upfront to build trust.  
  - **Upshot, Upshot, Upshot:** Constantly return to: "This isn’t ‘don’t do longtermism’—it’s ‘hedge your bets’."  

  **Final Tip:** If challenged on "fanaticism", clarify: "I mean *portfolio dominance* of highly speculative longtermist interventions over robust near-term goods—not dedication to the far future per se."  

  ---  
  *Prepared for the Longtermist Working Group, October 2023*
