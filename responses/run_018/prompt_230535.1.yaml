  - Self-locating uncertainty averages out across simulations (anthropics specialists' view)
  - This is just risk-aversion in disguise (moral philosopher's concern)
  - The base reality's future still dominates expected value
  - Simulations might still have long futures or be morally continuous

  For each, I'll craft a 2-minute reply with concessions. The untestability objection is most damaging - I'll advise conceding it weakens the argument but doesn't negate its probabilistic force. For the anthropics argument, I'll emphasize that discontinuity risk isn't averaged away. 

