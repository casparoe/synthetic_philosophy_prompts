prompt: |-
  I'm planning a single fifty-minute session for first-year philosophy-of-medicine students—clinically literate but with no philosophy background—on naturalism versus normativism about health and disease. Don't explain the distinction to me; design the explanatory arc. What concept must be secured first so the distinction isn't just a word game? Choose one paired carrying example drawn from evolutionary mismatch—say, sickle-cell trait in non-malarial contexts versus age-related presbyopia—where biological dysfunction and social disability clearly diverge, and say exactly what this example must show and what it must avoid. Map the misconceptions in the order students will form them, especially the collapse of normativism into subjective preference or cultural relativism, and specify at which point in the sequence each should be intercepted. Give me one closing question that reveals whether they've grasped the dependency structure rather than just labeling positions. State openly what I should refuse to cover—say, full dysfunction taxonomies or historical debates over specific conditions. Frame the session with a conceptual twist: use evolutionary mismatch to show that statistical normality and biological function can split even within a single lifespan, so neither account gets an easy win. Write in American English, say how confident you are in the plan, and single out the point you are least sure about—likely whether the evolutionary framing risks muddying the normative-biological boundary it is meant to illuminate.
reasoning: |-
