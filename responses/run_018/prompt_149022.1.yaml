prompt: |-
  You're the senior reasoning auditor at a small arbitration centre that settles disputes between expert advisory panels — climate scientists, epidemiologists, that sort of crowd. They keep turning up saying "we've seen the same reports but we still disagree on the recommendation," and your director wants you to turn Aumann's agreement theorem into a reusable decision procedre your team can run in under an hour, with no heavy maths and with the director signing off at the end. Before you draft the checklist, do some quick brainstorming: which bits of the theorem actually survive this translation (common prior, common knowledge of posteriors) and which have to be dropped or softened because real people aren't perfect Bayesians? Then lay out the procedre in order — the questions to ask, what counts as a sufficient answer to each, where it stops with "they're rational to disagree," where it stops with "there's a hidden framing disagreement," and where it hands the call to a human because the issue is values not probabilities. Apply it to three cases: (i) two flood-risk modellers who share rainfall data but disagree on the safety threshold; (ii) two clinical ethicists arguing over ICU triage weights during a shortage — this should be the one where the procedre gives an answer your askers won't like; and (iii) a messy case where they can't even agree what counts as "the evidence" in the first place. Be honest about where it misfires, especially with small panels and bounded rationality, and say clearly what the procedre just can't do. Write like you're explaining it to a tired colleague, not sitting an exam. Use British spelling (centre, behaviour, etc.). Don't ask for citations or a reading list — nobody here's got time for that, and you can't look things up anyway. Think step by step, and make sure the hard cases are actually handled rather than brushed aside.
reasoning: |-
  Okay, let me think through this request carefully. The user wants a practical procedure based on Aumann's agreement theorem for resolving disputes among expert panels, with clear limitations acknowledged. 

  First, I need to identify what parts of Aumann's theorem can realistically apply: the common prior assumption and common knowledge requirement are crucial but will need softening for real-world use. Perfect Bayesian updating is impossible here, so we'll have to settle for "reasonably consistent" interpretation of evidence.

  The procedure should follow a logical sequence:
  - Start by verifying if both parties genuinely share the same evidence base (this often resolves messy cases)
  - Then check if they agree on how evidence should be interpreted (the "frame")
  - Finally surface where disagreements stem from values rather than facts

  For the flood risk case (i), the key is recognizing their threshold disagreement isn't about data but about risk tolerance - that's where the procedure should flag it as a values issue. 

  The ICU triage case (ii) will be uncomfortable because it'll reveal their ethical weightings aren't evidence-based. The procedure must firmly show this isn't about probabilities but value judgments. 

  The messy evidence case (iii) is where we start - if they can't even agree what constitutes evidence, the procedure halts immediately. That's actually useful because it forces them to define their dispute properly.

  Important limitations to emphasize:
  - Small groups may not achieve true common knowledge
  - Cognitive biases will distort Bayesian updating
  - It can't resolve pure value conflicts
  - Requires honest engagement from participants

  The tone should be practical and conversational - this is for tired professionals, not academics. British spelling throughout as requested. No citations needed, just straightforward reasoning.
answer: |-
  Right, listen up. Grab a cuppa. This "Aumann Accelerator" bodge-job the director wants is basically trying to force messy human disagreements into a neat logic-box that assumes everyone's a robot with infinite brainpower. The theorem's lovely maths says: if two rationalists share the *exact same* starting beliefs (common prior) and their updated beliefs become *perfectly known* to each other (common knowledge of posteriors), they *must* agree. Obviously, that's bollocks in the real world. But we can salvage some bits to build a rough triage tool. Here’s the skinny:

  **What Survives (Barely):**
  1.  **"Common Prior" Lite:** Did they start from roughly the same professional baseline *before* seeing *this specific* evidence? (e.g., Do all decent climate scientists accept basic greenhouse physics? Yes. Do all ethicists agree on *one* ethical framework? Hell no.)
  2.  **"Shared Evidence" Core:** This is paramount. *Have they actually seen the exact same reports/data/studies?* If not, disagreement is utterly rational. Full stop.
  3.  **"Inconsistency Hunting":** The theorem highlights that persistent disagreement *must* mean either different priors or different interpretations. Our procedure forces them to articulate *why* the same evidence leads them different places, exposing the root – be it a hidden assumption, different weighting, or a values clash.

  **What Gets Kicked to the Kerb:**
  *   **Perfect Bayesians:** Humans are terrible at updating probabilities correctly. We anchor, we overweight vivid evidence, we underweight base rates. We ignore this and just ask *how* they interpreted things, not judge *how well*.
  *   **True Common Knowledge:** We can't achieve infinite regress ("I know you know I know..."). We settle for "Have they explicitly shared their conclusions *and* their key reasoning steps with each other?" If yes, we call that "sufficient disclosure".
  *   **Infinite Computing Power:** Bounded rationality is real. We don't expect them to have considered *every* angle, just the major ones relevant to *this* dispute.

  **The Procedure: The "Disagreement Dissector" Checklist (Run time: 45-60 mins)**

  **Phase 1: Evidence & Starting Point (10 mins)**
  1.  **"Show me the evidence!"** Ask each panel: *"List the specific reports, datasets, studies, and analyses you both agree constitute the core evidence base for this specific recommendation."* **Sufficient Answer:** A concrete, mutually agreed list. **Stop If:** They cannot agree on what "the evidence" *is*. Flag: **"Foundational Disagreement - Define Scope First"**. (Human needed to mediate evidence inclusion).
  2.  **"Where'd you start?"** Ask: *"Before reviewing this specific evidence, did you both operate under the same fundamental professional assumptions/models/frameworks relevant to this issue? (e.g., Standard climate models? Standard medical ethics principles?)"* **Sufficient Answer:** Clear "Yes" on core paradigms. **Stop/Flag If:** "No". Flag: **"Different Priors/Frameworks"**. (Human needed to frame the debate appropriately or acknowledge fundamental paradigm clash).

  **Phase 2: Interpretation & Reasoning (25 mins)**
  3.  **"What's your number (or range)?"** Ask each individual, privately first, then shared: *"Based *solely* on the agreed evidence (from Step 1), what is your current best estimate for [Key Probability/Parameter]? (e.g., 10-year flood probability? Relative value of 70yo vs 30yo life?) Provide a range if uncertain."* Record clearly.
  4.  **"Spell it out!"** Ask each, focusing on disagreements revealed in Step 3: *"Walk me through the 2-3 most crucial pieces of evidence or reasoning steps that led you *most strongly* to your estimate in Step 3, especially where it differs from the other side."* **Sufficient Answer:** Specific citations from the evidence list and clear logical steps ("Study X showed Y, but I weighted it heavily because of factor Z"). **Flag:** Vague statements, appeals to authority not in evidence, emotional reasoning.
  5.  **"Did you hear that?"** Ask each: *"Having heard the other side's key reasoning (Step 4), does it change your estimate? If yes, what's your new estimate? If no, *specifically why* does their reasoning not persuade you? Does it rely on an assumption you reject, weight evidence differently, or use a different logical model?"* **Sufficient Answer:** Clear articulation of *why* the other's argument fails to convince *based on the shared evidence/framework*. E.g., "They overweight Study A, which had small sample size," or "They assume linear risk, I assume threshold."

  **Phase 3: The Verdict & Handoff (10 mins)**
  6.  **"Agreement Achieved?"** If estimates converged significantly after Step 5, declare: **"Rational Consensus Reached"**. Document the estimate/recommendation.
  7.  **"The Root Cause:"** If significant disagreement persists:
      *   If Step 5 revealed **different interpretations of evidence** (e.g., weighting, model choice *within* shared framework): Flag **"Rational Disagreement on Evidence Interpretation"**. Outcome: Document both positions clearly. (Human arbitration *might* choose one, seek more data, or average).
      *   If Step 5 revealed a **clash in fundamental assumptions/values** that *wasn't* part of the shared prior/framework (Step 2), or if the dispute is inherently about values (e.g., "how much *should* we value X?"): Flag **"Values/Framing Disagreement Masquerading as Factual Dispute"**. **Crucial Handoff:** This **immediately** goes to the Director/human arbiter. The procedure **cannot** resolve value conflicts. State clearly: "Disagreement stems from differing ethical weights / risk tolerance thresholds / fundamental assumptions not resolved by shared evidence."

  **Applied to Cases:**

  **(i) The Flood-Risk Modellers (Rainfall data shared, disagree on safety threshold)**
  *   Step 1: Agree on rainfall data. Pass.
  *   Step 2: Agree on core hydrological models? Likely Yes (common prior lite). Pass.
  *   Step 3: Modeller A: Threshold 50mm. Modeller B: Threshold 70mm.
  *   Step 4: A: "Historical data shows overtopping at 50mm twice in 100yrs, unacceptable risk." B: "Model Z predicts <1% failure chance at 70mm, cost of raising threshold to 50mm is prohibitive."
  *   Step 5: A: "B is underestimating climate change impact on extremes, Model Z is outdated." B: "A ignores socioeconomic cost-benefit, safety is absolute for them." *Here it surfaces!*
  *   **Verdict:** **Rational Disagreement?** Partly. Differing weight on climate uncertainty (evidence interpretation). **BUT** also **Values/Framing**: A prioritises absolute safety ("unacceptable risk"), B prioritises cost-benefit. **Flag:** "Values/Framing Disagreement". Hand to Director. The procedure exposed the core clash: risk tolerance vs. cost.

  **(ii) The Clinical Ethicists (ICU Triage Weights during shortage)**
  *   Step 1: Agree on patient data, resource scarcity facts. Pass.
  *   Step 2: Common Prior/Framework? Do they agree on *which* ethical principles are paramount? (Utilitarianism? Lifespan? Fair Innings? Raw survival chance?) **STOP/FLAG.** If they fundamentally disagree on the ethical framework (e.g., Ethicist A: "Maximise total life-years saved", Ethicist B: "Prioritise youngest always"), this is **Step 2 "Different Priors/Frameworks"**. The procedure halts early. *If* they miraculously agree on a single principle (e.g., "Maximise lives saved"), then:
      *   Step 3: A: Weight comorbidity heavily (lower survival chance). B: Weight age heavily (more potential life lost if they die).
      *   Step 4/5: Reveals they interpret survival chance data differently OR, more likely, they are *actually* applying different ethical weights *despite* claiming the same framework. E.g., A focuses on *immediate* survival probability (evidence), B focuses on *potential future* life lost (a value judgment *beyond* the evidence).
  *   **Verdict (Likely):** **"Values/Framing Disagreement Masquerading as Factual Dispute"**. They *won't like it* because it shows their "evidence-based" weights are inherently value-laden. **Handoff to Director.** The procedure ruthlessly exposes that the "evidence" alone doesn't dictate the weights – societal values do.

  **(iii) The Messy Case ("What *is* the evidence?")**
  *   Step 1: **"List the core evidence."** Panel A: "Only peer-reviewed RCTs." Panel B: "Must include real-world observational data and qualitative patient reports." They argue for 20 minutes.
  *   **Verdict:** **STOP. "Foundational Disagreement - Define Scope First"**. The procedure *immediately* flags they aren't even arguing about the same thing. Human arbitration needed *now* to define the admissible evidence base before any further discussion is rational. This is the procedure working perfectly – preventing a futile debate.

  **Where it Misfires & Limitations (Be Brutally Honest):**

  1.  **Small Panels & Echo Chambers:** With only 2-3 people, "sufficient disclosure" (Step 5) might not uncover *all* hidden assumptions. One stubborn or poor communicator derails it. It relies heavily on good faith engagement.
  2.  **Bounded Rationality Blind Spots:** It surfaces *stated* reasoning, not cognitive biases. If they *both* anchor on a bad initial estimate and can't articulate why, the procedure might falsely declare "Rational Disagreement" or miss the value clash.
  3.  **The "Soft" Common Prior (Step 2):** Judging if they share a framework is subjective. Two economists might agree on "markets" but disagree wildly on models. We often have to take their word for it, risking a later values clash sneaking through.
  4.  **"Values" is a Dustbin:** Labelling something "Values/Framing" is a handoff, not a solution. It doesn't help *resolve* the value conflict, just stops us pretending it's about facts. The hard work starts there.
  5.  **Complexity Overload:** For massively complex evidence (e.g., whole climate models), Step 4 becomes impossible in an hour. The procedure forces simplification, which might obscure the true disagreement.
  6.  **It Can't Do:** Resolve pure value conflicts. Force consensus where evidence is genuinely ambiguous. Make people rational or good communicators. Replace deep expertise or nuanced judgment. Handle deliberate bad faith actors.

  **The Bottom Line for the Director:**
  This isn't magic. It's a structured chat forcing experts to lay their cards on the table – *what* evidence, *how* they read it, *why* they disagree. It shines a light on whether the dispute is fixable with more data/analysis (rarely), rational given the evidence (sometimes), or fundamentally about values/framing (often, especially in ethics/policy). It saves us weeks of meandering debate by pinpointing the *type* of disagreement fast. The signature line is basically: "Based on disclosed reasoning, the persistent disagreement is rational/rooted in values – proceed to arbitration on that basis." It won't make the ethicists agree, but it'll stop them hiding behind fake facts. Now, can I go home?
