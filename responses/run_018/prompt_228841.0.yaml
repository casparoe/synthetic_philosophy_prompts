prompt: |-
  Here's a question my officemate and I keep going in circles on. Her credence that knowing how to do something (ride a bike, play a fugue, speak Portuguese) is ultimately a species of knowing-that -- i.e. propositional knowledge, even if tacit or hard to articulate -- is about 0.8. Mine is around 0.25. We've both done the usual Ryle-vs-intellectualism reading, so please dont just recite the standard anthology arguments back at us.

  What I want is your own credence for a specific precisification of the intellectualist claim, something like: for most paradigm cases of human skill, the difference between someone who knows how to X and someone who merely knows lots of propositions about X-ing is fully explained by *which* propositions they know (including tacit, indexical, or demonstration-involving ones), not by any non-propositional state or ability. Give me the number, then decompose it: how much rides on the semantics/linguistics of 'knows how' ascriptions, how much on the classic anti-intellectualist cases where someone can do X but can't explain or even reliably state anything about how, how much on whether tacit propositional knowledge is even a coherent positing vs. just a redescription of ability, and how much on the empirical-ish intuition that motor skill memory and declarative memory dissociate. Rough probability per sub-question, how they combine, and which term your final answer is most sensitive to.

  One wrinkle I want you to actually engage with rather than wave at: imagine an LLM-driven robot that produces flawless verbal instructions for kneading bread dough, can diagnose other people's kneading mistakes from photos, can answer any question about technique -- but its own attempts are hopeless because its motor controller was never trained on dough. Does it know how to knead dough? Say how much weight this kind of case should carry relative to the classic cyclist/pianist examples, and whether the verdict changes if we stipulate it can *simulate* perfect kneading in its "head."

  Then, using your decomposition: where do my officemate's 0.8 and my 0.25 most likely diverge -- which sub-question is doing the work? And what's one argument or piece of evidence that would shift your own number the most in either direction?

  Last thing: please be upfront about what's genuinely contested here versus what's basically settled among people who actually work on this topic. Dont present something like "intellectualism is the current consensus" or "Ryle demolished the intellectualist legend" as established fact if the literature is actually split -- flag which parts of the debate are still live.
