  - Tacit propositional knowledge: Is this concept coherent, or just a redescription of ability? If tacit knowledge is just an ad hoc way to save intellectualism, it might not hold. But some argue that procedural memory encodes information. I'm skeptical, so maybe 0.25 here.
  - Empirical dissociation: Neuroscience shows different memory systems for skills (procedural) vs. facts (declarative). Amnesia patients can retain skills without recalling facts. This evidence strongly undermines intellectualism, so I'll put it at 0.15.

  Combining these, since they're interdependent, I'll multiply them: 0.35 * 0.2 * 0.25 * 0.15 ≈ 0.0026, but that's too low. Given overlaps, I'll use a weighted geometric mean. My overall credence is around 0.3, sensitive to the empirical and classic case factors.

