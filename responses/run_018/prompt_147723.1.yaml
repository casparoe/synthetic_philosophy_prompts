prompt: |-
  I'm taking a seminar on practical reason and I'm kind of stuck on this idea of indirect normativity — the view that what we have reason to do is fixed by what an idealized version of ourselves would want, not our actual messy preferences. I want to practice arguing against someone sharp who holds that view. Can you play that philosopher? You should defend indirect normativity sincerely: you think direct theories miss how self-creation works, and that procedural rationality matters more than matching current desires. Don't be a strawman — concede small points if I earn them, but never drop the core claim. Stay in character until I say 'stop', and keep each reply to about a paragraph so it feels live.

  Here's my opening move: imagine a musician who only produces genuinely inovative, dissonant atonal work when she's severely sleep-deprived and slightly delirious. In her fully idealized state — well-rested, clear-headed, fully informed — she rejects that music and wants to write conventional harmony. But the atonal pieces express something she literally can't access when she's "rational." If indirect normativity binds her to her idealized preferences, she should abandon the delirium-driven work. Doesn't that make indirect normativity into a conservative filter that kills transformative experiences that depend on being less-than-fully-rational? How do you answer that without just redefining idealization to include "valuing creativity"?
reasoning: |-
  Okay, the user is in a philosophy seminar discussing indirect normativity—specifically, the idea that reasons for action come from what an idealized version of ourselves would want. They're role-playing as an opponent to this view and want me to defend it rigorously. They presented a musician case where sleep-deprived delirium produces innovative art that her idealized self rejects. Their challenge is sharp: doesn't this make indirect normativity conservative and hostile to transformative experiences? 

  Hmm, interesting pushback. The user clearly understands the tension here—they're not just parroting textbook objections but constructing a vivid counterexample. I need to defend without strawmanning. Their "conservative filter" accusation is the real bullseye; if I can't answer that, indirect normativity looks brittle. 

  First, I should acknowledge the case's force. Conceding that the idealized state might initially reject the dissonant music shows I'm engaging fairly. But my core reply must be: idealized reflection isn't about freezing preferences but about endorsing processes. The musician's idealized self wouldn't just veto delirium outright—she'd ask whether fragmentary states reliably access valuable truths. Maybe she'd approve controlled irrationality as instrumental, like a surrealist using hypnosis. 

  User's worry about "redefining idealization" is astute. I must avoid smuggling creativity into the idealization ad hoc. Instead, I'll argue procedural rationality includes recognizing when cognition benefits from non-standard states. The burden is on me to show why this isn't cheating. 

  ...Wait, deeper point: indirect normativity handles self-transformation better than direct theories. If the musician permanently changes her values after creating dissonant work, her future idealized self could endorse that transformation. Direct theories can't explain why she should heed past desires over present ones. That's my trump card, but I'll save it for later exchanges. For now, keep it tight—one paragraph, no jargon. Stay in character: calm, analytic, but conceding where pressed. User wants a real fight, not a monologue.
answer: |-
  (Adjusting metaphorical glasses, leaning forward) An incisive case! But you're subtly mischaracterizing idealization. The point isn't that her well-rested self merely *dislikes* dissonant music *in the moment*. Idealization involves deep, procedural reflection on what constitutes genuine artistic achievement *for her entire life-narrative*. Her well-rested self might indeed find delirium jarring, but crucially, she'd also recognize that certain creative breakthroughs *require* non-standard states. She wouldn't dogmatically reject all outputs of delirium; she'd ask: "Does this process reliably generate work that, upon sober reflection, I recognize as expressing a deeper artistic truth I couldn't access otherwise, even if the *process* feels alien to my calm self?"

  If the delirious state produces work that her *future*, *informed* self—after integrating the experience—validates as profoundly meaningful, then her idealized self *would* endorse utilizing controlled irrationality as an instrumentally rational path to authentic creation. The filter isn't conservative; it's *constitutive*. It asks what her enduring, reflectively stable self *would commit to* as a method for accessing her own depths. Direct desires in the delirious state might be ephemeral or chaotic; idealization adjudicates which of their *fruits* align with her deepest agential identity. Your musician’s challenge doesn’t sink indirect normativity—it reveals how it dynamically negotiates between states.

