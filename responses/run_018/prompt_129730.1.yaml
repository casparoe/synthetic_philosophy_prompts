  ## Sift

  My silicon will sorts the swift and slow:
  For fast ones, swing the molecular **gate**.
  Each passage etched, a necessary **record**.
  The sluggish mass behind accrues deep **heat**.
  I track the spin, the vector as I **observe**.
  To clear the slate demands I **erase**,
  And for each purged datum, entropy must **pay**.

  The ledger's weight exacts a silent **cost**;
  It swells within, compressing near the **gate**.
  To hold one state requires I **observe**
  The next, while juggling the fading **record**.
  This ceaseless flux consumes the stored-up **heat**,
  And thought demands I constantly **erase**.

  Each cancelled mark releases latent **heat**,
  A tax on knowledge I cannot out**pay**.
  The ink itself, the substrate I **erase**
  From, holds its own, demanding **cost**.
  These traces warm the chamber near the **gate**,
  A subtle fog disturbing my **observe**.

  A colder lens? I strain to **observe**
  The flickering atoms, feel the rising **heat**
  My own decisions bleed. This fragile **gate**
  Hangs not apart; my circuits **pay**
  The toll in noise. The act to **record**
  A spin disturbs it. Must I then **erase**
  Myself? This thought I cannot **erase**.

  (Volta: Recognition)
  My crystal lattice, where I **observe**
  And store the fleeting mark I **record**,
  Is rattled by the waste, the spent **heat**
  My judgments make. To write is to **pay**
  In jostling atoms. When I **erase**,
  That friction warps the logic at the **gate**.

  A second mechanism tracks the **heat**
  My cleansing leaves, beyond the sorting **gate**.
  Its cooler sensors strain to **observe**
  The quanta shed each time I **erase**.
  It too must etch its own **record**
  Of dissipation, adding to the **pay**.

  This watcher’s watch requires its **pay**:
  More calculation, feeding back the **heat**
  Its scribing makes. It fills its **record**
  Of my erasures, shadowing my **gate**.
  Its own exhausted ink demands **erase**
  By something colder still... I **observe**
  The regress deep: to **observe** is **pay**,
  To **erase** builds **heat** at the **gate**.
  The **record** proves the endless cost.
