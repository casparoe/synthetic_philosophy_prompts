prompt: |-
  I am a staff engineer at a company of about 250 people, and I own the measurement layer for our internal developer platform. Several times a quarter I am asked to turn a qualitative goal — "make the platform easier to ship on", "improve the reliability of service X", "raise code quality" — into numbers that then do real work: they go into team OKRs that a director reviews, into a launch gate for a migration, and into promotion packets. Call it a dozen to twenty metrics a year, each of which gets roughly one 90-minute working session with me, one data analyst (no statistics PhD anywhere on my team), an engineering director who signs off, and the lead of the team that will live under the metric.

  I am good at writing specifications for APIs and I am bad at this. Every time a number of mine starts to matter, it stops tracking the thing it was supposed to track. I have read the popular write-ups of the effect people call Goodhart's law; they are long on diagnosis and anecdote and short on anything I can run on a Tuesday. So I want a procedure, not an explanation.

  Please write me a decision procedure I can apply to a candidate metric before it is allowed to govern anything, and re-apply when a metric already in force looks suspicious. Ordered steps, each with: the question to ask; what counts as a sufficient answer (and what counts as hand-waving); the artifact I should record; and an explicit stopping rule — either stop with a "no, this metric may not govern that decision", or hand off to a named human because the question is one of values rather than facts. Then give me a one-page "metric charter" template that captures the outputs of the steps.

  I want the procedure to build on the following distinctions, which I have found useful but cannot systematize. Please keep them, sharpen them where they are muddled, and tell me if any of them is wrong or collapses into another:

  1. Classify the failure before treating it. A metric can stop tracking its goal because the world moved and the correlation decayed with nobody responding to it; because the people under the metric changed their behaviour to move the number; because we optimised the number far outside the range of conditions in which anyone ever checked that it tracked the goal; or because measuring and reporting the number changed the system being measured, so that the target itself moved. These have different remedies, so classification has to be step one — and it has to be doable from artifacts we actually have (dashboards, commit and review history, ticket data, incident write-ups), not from guessing at intentions. I cannot prove anyone gamed anything, and I do not want a procedure whose output is an accusation.

  2. The indifferent optimizer. Instead of asking whether anyone would cheat, ask what a competent, well-meaning engineer who has no interest whatsoever in the goal and every interest in the number would do, given the tools and permissions they actually have. Name the concrete behaviour. If the list is long, that is evidence about the metric rather than about the team.

  3. The blindness profile. An explicit list of what the metric is structurally incapable of registering: things that never enter the data source at all, effects that only appear on timescales longer than the reporting window, qualities that have no unit, and costs borne by people outside the measured population. Require naming the single most important item on that list, and require someone to sign their name to it.

  4. The validated envelope. State the range of conditions and values within which anyone ever checked that moving the number moved the goal, and state where current and target values sit relative to that range. If nobody ever checked, the procedure must stop with a "no" rather than produce a confidence score.

  5. A second channel. For any metric that governs a high-stakes decision, require an independent signal not computed from the same underlying source, chosen so that it fails in a different direction from the first. Where no such channel exists, the procedure should say so plainly and route the decision to a human with a review date, rather than implying the number is adequate on its own.

  6. A pre-registered kill condition. At definition time, write down what observation would make us stop using this metric, set a review date, and record a rough half-life estimate in quarters — "unknown" is an acceptable entry only if it is written down as such. "We'll keep an eye on it" should count as a failed step.

  The procedure must also mark its own limits: which steps produce answers from data and which are value judgments it is not entitled to make — which goals are worth pursuing at all, the exchange rate between units of the proxy and units of the goal, and how much false-positive versus false-negative risk we accept. Where a step looks rigorous but is really a judgment call in a lab coat, say so in the step.

  Then apply the finished procedure to three cases from my world, showing the artifacts and the point at which each case stops or hands off:

  (a) Deployment frequency and change-failure-rate targets attached to a gate that decides whether a large service migration is allowed to proceed.

  (b) Counts derived from bug trackers — open P1s, or bugs closed per sprint — used as an input to promotion packets, where the declared goal is code quality.

  (c) A composite "developer productivity index" that our platform dashboard already computes and that leadership is attached to. I suspect the procedure will tell me to stop using it. If that is where it lands, work it through to that conclusion anyway and draft the two or three sentences I would actually have to say to the director who likes it.

  Finish by stating what the procedure cannot do: the situations where it simply does not apply (systems too new to have a validated envelope, goals with no unit at all, goals that are contested rather than merely hard to measure), and the ways it will misfire even when applied honestly — slow drift below the detection threshold, blindness lists that are effectively unbounded.

  Two constraints. Please draw your examples from software engineering rather than from the standard folklore about bounties and factory quotas, and do not give me citations, a reading list, or a bibliography: I have no way to check them and I am not asking for the literature. I want something I can run in ninety minutes with a data analyst and defend in a room.
reasoning: |-
  We are going to design a decision procedure for evaluating metrics. The procedure will have ordered steps, each with:
  - The question to ask
  - What counts as a sufficient answer (and what counts as hand-waving)
  - The artifact to record
  - An explicit stopping rule: either stop with a "no", or hand off to a named human.

  We'll build on the distinctions provided and then apply the procedure to the three cases.

  ### Decision Procedure for Metrics

  #### Step 1: Classify the Failure (if the metric is already in use and suspicious)
  **Question:** What is the nature of the observed divergence between the metric and the goal? Specifically, has the metric stopped tracking the goal due to:
     - (a) Natural drift (world moved, correlation decayed, no one responded)?
     - (b) Behavioral change by those under the metric (optimizing the number without moving the goal)?
     - (c) Operation outside the validated envelope (optimized beyond the range of previous validation)?
     - (d) Measurement-induced system change (the target itself moved because of measurement)?

  **Sufficient Answer:** 
     - A clear classification into one of (a)-(d) based on artifacts (dashboards, commit history, ticket data, incident write-ups, etc.). For (a) and (d), show a timeline of events. For (b), show a correlation breakdown between the metric and the goal. For (c), show that the current value is outside the validated envelope (from step 4).
     - Hand-waving: Vague attributions without evidence (e.g., "people are gaming it") or failure to provide data from artifacts.

  **Artifact:** A failure classification report with supporting evidence.

  **Stopping Rule:** 
     - If the classification is (a) or (d), proceed to Step 2 (if new) or Step 5 (if in use). 
     - If (b) or (c), stop with "no, this metric may not govern that decision" and recommend redesign.

  #### Step 2: Indifferent Optimizer Test
  **Question:** If a competent, well-meaning engineer (with no interest in the goal but every interest in the metric) were given the task of moving the metric using the tools and permissions they actually have, what are the concrete behaviors they might engage in? List at least three.

  **Sufficient Answer:** 
     - A list of at least three concrete, feasible behaviors that would move the metric without necessarily moving the goal. The behaviors must be specific and based on the actual system (e.g., "split deployments into smaller changes to increase deployment frequency", "reclassify bugs to lower priority to reduce P1 count").
     - Hand-waving: Generic statements (e.g., "they might cheat") or fewer than three behaviors.

  **Artifact:** A list of at least three behaviors.

  **Stopping Rule:** 
     - If the list is produced and at least one behavior is clearly undesirable (i.e., it moves the metric without moving the goal), then proceed to Step 3. 
     - If the team cannot think of any such behavior, that is acceptable but rare; proceed to Step 3 and note that the metric is robust to this test.

  #### Step 3: Blindness Profile
  **Question:** What is the metric structurally incapable of registering? Specifically, list:
     - Things that never enter the data source (e.g., developer frustration in a bug count metric).
     - Effects that only appear on timescales longer than the reporting window (e.g., technical debt accumulation).
     - Qualities with no unit (e.g., elegance of code).
     - Costs borne by people outside the measured population (e.g., increased load on another team).
     Then, what is the single most important item on that list?

  **Sufficient Answer:** 
     - A list of at least three structural blind spots. The single most important one must be identified and signed off by the lead of the team that will live under the metric and the engineering director.
     - Hand-waving: A list of less than three, or failure to identify the most important one and get sign-off.

  **Artifact:** A signed blindness profile (with the list and the most important item).

  **Stopping Rule:** 
     - If signed, proceed to Step 4. 
     - If not signed, stop and hand off to the engineering director (named human) for resolution because the blind spot might be acceptable or not, which is a value judgment.

  #### Step 4: Validated Envelope
  **Question:** 
     - What is the range of conditions (e.g., system load, team size, change rate) and values of the metric within which we have evidence that moving the metric actually moves the goal? 
     - Where do the current value and the target value lie relative to this range?

  **Sufficient Answer:**
     - A description of the envelope (e.g., "deployment frequency between 1/day and 1/week, with team size 5-10, and change failure rate < 5%"). 
     - Evidence must be from historical data or controlled experiments (e.g., "In Q3 2023, we increased deployment frequency from 1/week to 3/week and observed a 20% reduction in lead time; in Q4, we tried 5/week and lead time increased").
     - If no evidence exists, state "none".
     - Hand-waving: Using the metric without any validation, or extrapolating beyond the envelope without evidence.

  **Artifact:** A validated envelope statement with evidence citations.

  **Stopping Rule:**
     - If the envelope is defined and the current/target values are within it, proceed to Step 5.
     - If the envelope is defined but the current/target values are outside, stop with "no" because we are in uncharted territory.
     - If no envelope exists (no evidence), stop with "no" and recommend collecting evidence first.

  #### Step 5: Second Channel
  **Question:** For high-stakes decisions (e.g., launch gates, promotions), what independent signal can we use that is not computed from the same underlying data source? The second channel should fail in a different direction (e.g., if the primary metric is gamed, the second channel should detect it).

  **Sufficient Answer:**
     - A description of a second metric or qualitative assessment that uses a different data source (e.g., if the primary metric is deployment frequency from CI/CD logs, the second channel could be a survey of developers about deployment pain points).
     - If no suitable second channel exists, state that.
     - Hand-waving: Using a metric from the same source (e.g., change failure rate from the same CI/CD logs) or a vague promise.

  **Artifact:** A description of the second channel or a statement that none exists.

  **Stopping Rule:**
     - If a second channel exists, proceed to Step 6.
     - If no second channel exists, then for high-stakes decisions, hand off to a named human (e.g., the engineering director) with a review date (e.g., in 3 months) to make the decision without sole reliance on the metric.

  #### Step 6: Pre-registered Kill Condition
  **Question:** 
     - What observation would cause us to stop using this metric? 
     - Set a review date (within the next 4 quarters). 
     - What is the estimated half-life of the metric (in quarters) before we expect it to decay? (If unknown, state "unknown".)

  **Sufficient Answer:**
     - A specific, observable condition (e.g., "if the correlation between the metric and the goal drops below 0.5", or "if we observe two instances of the indifferent optimizer behaviors").
     - A review date (e.g., "review by Q3 2024").
     - A half-life estimate (e.g., "4 quarters" or "unknown").
     - Hand-waving: "We'll keep an eye on it" without specifics.

  **Artifact:** A signed kill condition statement (signed by the engineering director).

  **Stopping Rule:**
     - If the kill condition is defined and signed, the metric is approved for use (with the understanding that it may be killed if the condition is met).
     - If not, stop with "no".

  ### Metric Charter Template

  ```
  Metric Charter

  1. Metric Name: 
  2. Goal (qualitative): 
  3. Governing Decision(s): [e.g., launch gate, promotion input, OKR]

  4. Failure Classification (if applicable): [From Step 1. Leave blank for new metrics]

  5. Indifferent Optimizer Behaviors (at least three):
     a. 
     b. 
     c. 

  6. Blindness Profile:
     - List of blind spots (at least three):
        i. 
        ii. 
        iii. 
     - Most important blind spot: 
     - Signed by (team lead): _________________ Date: _________
     - Signed by (engineering director): _________________ Date: _________

  7. Validated Envelope:
     - Conditions and range: 
     - Evidence: 
     - Current value: 
     - Target value: 

  8. Second Channel (for high-stakes decisions):
     - Description: 
     - Data source: 
     - Or, if none: "No second channel exists"

  9. Pre-registered Kill Condition:
     - Condition: 
     - Review Date: 
     - Estimated half-life (quarters): 
     - Signed by (engineering director): _________________ Date: _________

  10. Limitations and Handoff Notes:
      - [Any step that required a handoff and to whom, and any value judgments made outside the procedure]
  ```

  ### Applying the Procedure to Cases

  #### Case (a): Deployment frequency and change-failure-rate targets for a migration launch gate

  **Step 1:** Not applicable (new metric? or in use and suspicious? Let's assume new for this case, so skip Step 1 and start at Step 2).

  **Step 2: Indifferent Optimizer**
     - Q: What might an engineer do to move deployment frequency without making shipping easier?
       - Split changes into trivial, non-value-adding deployments (e.g., whitespace changes).
       - Deploy to a subset of servers to count as a deployment without full rollout.
       - Reduce the scope of deployments to the point of being meaningless (e.g., configuration only).
     - Sufficient: Three behaviors listed. Proceed.

  **Step 3: Blindness Profile**
     - Blind spots for deployment frequency:
        i. Does not capture the complexity or risk of deployments (only counts them).
        ii. Does not capture the time and effort spent on deployments (if deployments become more frequent but also more painful, that's bad).
        iii. Does not account for the stability of the system (if deployments are frequent but cause a lot of incidents, that's bad) — but note we have change-failure-rate too.
     - Most important: Blind to deployment pain and effort (i). 
     - Signed: Yes, by team lead and director. Proceed.

     For change-failure-rate (CFR):
        i. Blind to near-misses (caught before production).
        ii. Blind to severity of failures (one severe incident vs. many minor).
        iii. Blind to failures that are not caught by monitoring (and thus not recorded as incidents).
     - Most important: Blind to severity (ii).
     - Signed. Proceed.

  **Step 4: Validated Envelope**
     - For deployment frequency: 
          Envelope: 1/day to 1/week, in teams of size 5-10, in a microservice architecture. Evidence: Past data from Team A showed that increasing from 1/week to 3/week reduced lead time by 30%. But beyond 1/day, they experienced burnout.
          Current: 1/week. Target: 3/week (within envelope). Proceed.
     - For CFR:
          Envelope: 0-10% failure rate, in the same team conditions. Evidence: When CFR was below 5%, customer satisfaction was high. Above 10%, satisfaction dropped. 
          Current: 8%. Target: 5% (within envelope). Proceed.

  **Step 5: Second Channel**
     - High-stakes: Migration gate. 
     - For deployment frequency: Second channel = developer survey on ease of deployment (qualitative, from different source).
     - For CFR: Second channel = post-incident analysis (qualitative) of severity and root causes (not just count).
     - Both have second channels. Proceed.

  **Step 6: Kill Condition**
     - For deployment frequency: Kill if we observe >20% of deployments being trivial (as per Step 2 behavior). Review in 2 quarters. Half-life: 4 quarters.
     - For CFR: Kill if the number of incidents categorized as severe increases by 50% while CFR stays the same. Review in 2 quarters. Half-life: 4 quarters.
     - Signed by director. Approved.

  **Outcome:** Both metrics can be used, with the second channels and kill conditions.

  #### Case (b): Bug tracker counts (open P1s, bugs closed per sprint) for promotion packets (goal: code quality)

  **Step 1:** (If already in use and suspicious, we might do Step 1. But let's assume new.) Skip to Step 2.

  **Step 2: Indifferent Optimizer**
     - Open P1s: 
          a. Reclassify P1 bugs as P2.
          b. Delay bug creation until after the promotion packet is submitted.
          c. Pressure to close bugs without fixing (e.g., mark as "won't fix" or "not reproducible").
     - Bugs closed per sprint:
          a. Fix easy bugs and leave hard ones.
          b. Reopen closed bugs to have more to close next sprint.
          c. Split one bug into multiple to close more.
     - Sufficient. Proceed.

  **Step 3: Blindness Profile**
     - Open P1s:
          i. Blind to the severity of the bugs (if one critical bug is worth ten minor ones).
          ii. Blind to the introduction of new bugs (only counts open ones at a point in time).
          iii. Blind to bugs that are not reported (or are hidden).
          Most important: Blind to hidden bugs (iii). Signed? (Requires sign-off.) 
     - Bugs closed per sprint:
          i. Blind to the quality of the fixes (quick and dirty vs. proper).
          ii. Blind to the complexity of the bugs (closing 10 trivial bugs vs. one complex one).
          iii. Blind to bugs that are not fixed but closed for other reasons.
          Most important: Blind to fix quality (i). Signed? 

     But note: the goal is code quality. Both metrics are blind to the quality of new code being written. They only reflect bug handling.

     Signed by team lead and director? They might sign, but we proceed.

  **Step 4: Validated Envelope**
     - Open P1s: 
          What envelope? Has anyone shown that reducing open P1s improves code quality? 
          Evidence: None provided. We have no evidence that these metrics track code quality. In fact, code quality might be high but if there are legacy bugs, P1s might be high. Conversely, a team might have low P1s because they are new and haven't found bugs yet.
          Validated envelope: none.
     - Bugs closed per sprint: Similarly, no evidence that closing more bugs improves code quality. It might even be that a team with high bug closure is neglecting new feature development and accumulating technical debt.

     Stopping Rule: Stop with "no" for both because there is no validated envelope.

  **Outcome:** Stop. These metrics may not be used for promotion packets without evidence. Hand off to the director: "We have no evidence that these metrics track code quality. Using them for promotions may incentivize perverse behaviors. We recommend using code reviews, design documents, and peer feedback as more direct measures of code quality."

  #### Case (c): Composite "developer productivity index" on platform dashboard

  **Step 1:** (Assume it's in use and suspicious.) We observe it doesn't track developer productivity.

  **Step 1: Classify Failure**
     - We see the index rising, but developer sentiment (from surveys) is that productivity is flat or down.
     - Classification: (b) Behavioral change: teams are optimizing for the components of the index (e.g., deployment frequency, build time) without actually improving productivity. Also, (c) operation outside the validated envelope? We never validated it.

  **Step 2: Indifferent Optimizer**
     - The index is a composite (say, of deployment frequency, build time, test pass rate). 
     - Behaviors:
          a. Split deployments to increase frequency without delivering more value.
          b. Skip long-running tests to improve test pass rate and time.
          c. Cache build artifacts in ways that break reproducibility to improve build time.
     - Sufficient.

  **Step 3: Blindness Profile**
     - Blind spots:
          i. Does not capture the value delivered to the business (only internal process).
          ii. Does not capture developer satisfaction or cognitive load.
          iii. Does not capture collaboration or learning.
          iv. Does not capture long-term health (technical debt).
     - Most important: Blind to value delivered (i). 
     - Signed? (Requires sign-off.) Proceed.

  **Step 4: Validated Envelope**
     - Evidence: None. The index was created without validation. We don't know if moving the index improves productivity. In fact, we now have evidence it doesn't (from Step 1).
     - Stopping Rule: Stop with "no" because there is no validated envelope.

  **Outcome:** Stop using the index. 

  **What to say to the director:**
     "Our analysis shows that the developer productivity index does not have a validated envelope — we have never shown that it actually tracks productivity. Moreover, we have evidence that it is being gamed and that it is blind to the value delivered. Therefore, we recommend discontinuing its use for decision-making. Instead, we should focus on validated metrics for specific goals and use qualitative feedback from developers."

  ### What the Procedure Cannot Do

  - **Does not apply when:**
     - The system is too new to have a validated envelope (no historical data).
     - The goal has no unit at all (e.g., "improve developer happiness" without any quantifiable aspect).
     - The goal is contested (e.g., what "code quality" means is disputed) — the procedure assumes the goal is agreed upon.

  - **Misfires even when applied honestly:**
     - Slow drift below the detection threshold (e.g., gradual decay of correlation that isn't caught until the next review).
     - Blindness lists that are effectively unbounded (some goals have too many blind spots to list).
     - The indifferent optimizer test might miss creative gaming techniques.

  The procedure provides a structured way to evaluate metrics, but it is not foolproof. It requires diligence and periodic review.
answer: |-
  ### Metric Evaluation Decision Procedure

  This procedure ensures metrics are robust before governing decisions and diagnoses failures systematically. Apply it during the 90-minute working session for new metrics or when a metric behaves suspiciously. Involve the data analyst, engineering director, and team lead.

  ---

  #### **Step 1: Classify the Failure (For Suspicious Metrics Only)**  
  **Question:** What artifacts (dashboards, commit history, incident reports) show the metric diverging from its goal? Classify the cause:  
  - **A:** World moved (correlation decayed, no response)  
  - **B:** Behavior changed (metric gamed, goal unchanged)  
  - **C:** Operating outside validated envelope  
  - **D:** Measurement changed the system (goal itself moved)  

  **Sufficient Answer:**  
  - Concrete evidence from artifacts (e.g., "Incident reports show reliability improved but metric worsened due to new monitoring").  
  - **Hand-waving:** "People are gaming it" without artifacts.  

  **Artifact:** One-paragraph classification with evidence links.  
  **Stopping Rule:**  
  - If **A** or **D**, proceed to Step 5.  
  - If **B** or **C**, **stop with "no"**—metric invalid for decision.  

  ---

  #### **Step 2: Indifferent Optimizer Test**  
  **Question:** What would a competent, well-meaning engineer (indifferent to the goal) do to move this metric using actual tools/permissions? List ≥3 concrete behaviors.  

  **Sufficient Answer:**  
  - Specific, feasible actions (e.g., "Split PRs to inflate deployment count").  
  - **Hand-waving:** "They might cheat" (vague).  

  **Artifact:** Bulleted list of behaviors (min. 3).  
  **Stopping Rule:**  
  - If list is produced, proceed.  
  - If team cannot list behaviors, note "robust to gaming" and proceed.  

  ---

  #### **Step 3: Blindness Profile**  
  **Question:** What is the metric structurally blind to? List:  
  1. Data source exclusions (e.g., "Ignores time spent on code reviews").  
  2. Effects beyond reporting window (e.g., "Misses tech debt accumulation").  
  3. Unquantifiable qualities (e.g., "Cannot measure code readability").  
  4. Externalized costs (e.g., "Shifts burden to SRE team").  
  **Then:** What is the #1 blind spot?  

  **Sufficient Answer:**  
  - ≥3 blind spots + named #1 item.  
  - **Hand-waving:** "No blind spots" or <3 items.  

  **Artifact:** List with #1 item + signatures from team lead and director.  
  **Stopping Rule:**  
  - If signed, proceed.  
  - If no agreement, **hand off to director** (values judgment).  

  ---

  #### **Step 4: Validated Envelope**  
  **Question:** What conditions (team size, load, etc.) and metric values were tested to confirm correlation with the goal? Where do current/target values sit?  

  **Sufficient Answer:**  
  - Explicit range (e.g., "Validated at 5–20 deployments/week for teams <10 people").  
  - Evidence: Historical data, experiments, or incident analysis.  
  - **Hand-waving:** "We assume it works" (no evidence).  

  **Artifact:** Envelope statement + evidence citations.  
  **Stopping Rule:**  
  - If envelope exists and current/target are inside, proceed.  
  - If no envelope or outside range, **stop with "no"**.  

  ---

  #### **Step 5: Second Channel (For High-Stakes Decisions)**  
  **Question:** What independent signal (different data source) can corroborate this metric? How does it fail differently?  

  **Sufficient Answer:**  
  - Concrete alternate source (e.g., "Developer survey" if primary is CI/CD data).  
  - **Hand-waving:** "We’ll use a similar metric" (same source).  

  **Artifact:** Description of second channel or "none exists."  
  **Stopping Rule:**  
  - If second channel exists, proceed.  
  - If none, **hand off to director** with mandatory review date.  

  ---

  #### **Step 6: Pre-registered Kill Condition**  
  **Question:** What observable event would kill this metric? Set a review date and half-life estimate.  

  **Sufficient Answer:**  
  - Specific trigger (e.g., "Correlation with goal <0.5 for 2 quarters").  
  - Review date ≤4 quarters out.  
  - Half-life estimate (e.g., "8 quarters" or "unknown").  
  - **Hand-waving:** "We’ll monitor it" (no trigger).  

  **Artifact:** Signed kill condition + review date.  
  **Stopping Rule:**  
  - If defined and signed, **approve metric**.  
  - Else, **stop with "no"**.  

  ---

  ### Metric Charter Template  
  ```markdown
  # METRIC CHARTER
  **Metric Name:** [e.g., Deployment Frequency]  
  **Goal:** [e.g., "Make shipping easier"]  
  **Governing Decision:** [e.g., Migration launch gate]  

  ## INDIFFERENT OPTIMIZER BEHAVIORS  
  1. [Concrete behavior, e.g., "Split features into trivial PRs"]  
  2. [e.g., "Deploy to staging only"]  
  3. [e.g., "Roll back immediately after deploy"]  

  ## BLINDNESS PROFILE  
  - **Blind Spots:**  
    1. [e.g., "Misses deployment pain due to manual steps"]  
    2. [e.g., "Ignores rollback success rate"]  
    3. [e.g., "Excludes cross-team coordination time"]  
  - **#1 Blind Spot:** [e.g., "Manual steps"]  
  - Signatures: Team Lead __________, Director __________  

  ## VALIDATED ENVELOPE  
  - **Conditions:** [e.g., "Teams of 5–10, monolith architecture"]  
  - **Value Range:** [e.g., "5–20 deploys/week"]  
  - **Evidence:** [e.g., "Q3'23 experiment showed lead time reduction"]  
  - **Current/Target:** [e.g., "Current: 8/week, Target: 15/week"]  

  ## SECOND CHANNEL (IF HIGH-STAKES)  
  - [e.g., "Post-deploy developer survey"] OR "None"  

  ## KILL CONDITION  
  - **Trigger:** [e.g., "Lead time increases >20% for 2 sprints"]  
  - **Review Date:** [e.g., "Dec 2024"]  
  - **Half-Life Estimate:** [e.g., "6 quarters"]  
  - **Director Signature:** __________  
  ```  

  ---

  ### Case Applications  

  #### **(a) Deployment Frequency & Change-Failure Rate for Migration Launch Gate**  
  - **Step 2:**  
    - *Behaviors:* (1) Trivial PRs, (2) Deploy to 1% of nodes, (3) Suppress failure alerts.  
  - **Step 3:**  
    - *Blind Spots:* (1) Deployment pain, (2) Impact on downstream services, (3) Long-term tech debt.  
    - *#1 Blind Spot:* Deployment pain (signed by director).  
  - **Step 4:**  
    - *Envelope:* "Validated at 1–5 deploys/day for microservices; current=2/day, target=4/day."  
  - **Step 5 (High-Stakes):**  
    - *Second Channel:* "Rollback success rate (from incident logs)."  
  - **Step 6:**  
    - *Kill Condition:* "If user-reported issues rise 30% post-migration; review in Q3."  
  - **Outcome:** Approved with second channel.  

  #### **(b) Bug Tracker Counts for Promotion Packets (Goal: Code Quality)**  
  - **Step 2:**  
    - *Behaviors:* (1) Downgrade P1 bugs, (2) Close bugs as "won't fix," (3) Delay bug creation.  
  - **Step 3:**  
    - *Blind Spots:* (1) Bug severity, (2) Design flaws, (3) Testing gaps.  
    - *#1 Blind Spot:* Design flaws (signed).  
  - **Step 4:**  
    - *Envelope:* "No evidence tying bug count to code quality."  
  - **Stopping Rule:** **Stop with "no"** at Step 4.  
  - **Artifact:** "Validated envelope missing; metric invalid for promotions."  
  - **Handoff:** Director must use peer reviews or design docs instead.  

  #### **(c) "Developer Productivity Index" (Composite Metric)**  
  - **Step 1 (Suspicious):**  
    - *Classification:* **B** (Behavior changed: teams optimize sub-metrics like PR speed, but productivity flatlines).  
  - **Step 2:**  
    - *Behaviors:* (1) Game CI time, (2) Inflate PR counts, (3) Reduce test coverage.  
  - **Step 3:**  
    - *Blind Spots:* (1) Innovation, (2) Cross-team collaboration, (3) Unplanned work.  
    - *#1 Blind Spot:* Innovation (signed).  
  - **Step 4:**  
    - *Envelope:* "None; no validation against actual productivity."  
  - **Stopping Rule:** **Stop with "no"** at Step 4.  
  - **Director Communication:**  
    > "This index lacks validation and incentivizes gaming. It’s blind to innovation and collaboration—cornerstones of productivity. We recommend retiring it and using goal-specific metrics with second channels."  

  ---

  ### What This Procedure Cannot Do  
  1. **Inapplicable Cases:**  
     - Systems <2 quarters old (no envelope).  
     - Goals with no quantifiable aspect (e.g., "improve morale").  
     - Politically contested goals (e.g., "what is 'code quality'?").  
  2. **Inherent Limitations:**  
     - Slow drift (e.g., correlation decay <1%/quarter).  
     - Unbounded blindness (e.g., metrics for "developer experience").  
     - Unknown unknowns (e.g., emergent tooling changes).  
  3. **Value Judgments (Handed Off):**  
     - Whether the goal is worth pursuing.  
     - Exchange rate between metric and goal (e.g., "Is 10% faster CI worth $100k?").  
     - False-positive/false-negative tradeoffs.  

  **Output:** A defendable Metric Charter or a clear "no" within 90 minutes.
