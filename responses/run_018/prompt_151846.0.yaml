answer: |-
  The Lisbon evening hummed with the low thrum of electric trams and the lingering scent of hot asphalt and salt air, underscored by something older, metallic and oily, rising from the tracks on Rua Augusta. Mara leaned against the cool azulejo tiles of her building, the familiar blue glow of the Cognitive Cooperative docking station washing over her face from the lobby kiosk. She tapped her temple, feeling the faint, pleasant buzz as her "Clarity Module" synced – her monthly lease renewed. Instantly, the jumble of Catalan idioms she’d been wrestling with smoothed into perfect Portuguese equivalents. Effortless.

  Inside, her niece, Beatriz, eight years old and vibrating with restless energy, presented her with a school project. It was a simple diagram: a picture of a wilting plant, arrows pointing to "No Sun," "No Water," and a big question mark.

  "So, Tia Mara," Bea chirped, bouncing on the sofa. "How do we *know* which one it is? Senhora Silva says we have to look for evidence! Like detectives!"

  Mara smiled. "Well, detectives gather clues, right?" She pointed at the picture. "See the soil? It looks dry and cracked. That’s evidence for no water."

  Bea nodded vigorously. "Okay! What else?"

  "Look at the leaves," Mara continued. "They’re yellow and drooping. Plants that don’t get sun often turn yellow too, or become weak…" She trailed off. The words flowed, the conclusion seemed obvious – *probably lack of water* – but the *path* felt… slippery. *Why* did dry soil point more strongly to water than sun? She knew it, felt the certainty, but the intermediate connections – the logical stepping stones between observation and conclusion – were foggy, like trying to recall the specific turns on a route she always drove on autopilot.

  "Okay," Bea pressed, her brow furrowed in concentration. "But how do we know the yellow leaves aren't *just* from no sun? How do we pick which evidence is… stronger?" She used the word carefully, proud of her new vocabulary.

  Mara opened her mouth, then closed it. The answer *was* there, a solid conclusion deposited by the Clarity Module. But explaining *why*? The scaffolding was gone. She groped for the reasoning chain – the knowledge about how plants prioritize water stress over light stress, the visual cues differentiating drought wilt from etiolation – but it was like trying to grasp smoke. She felt a familiar, low-grade headache prickling behind her eyes, the subtle withdrawal pang of unaided cognition.

  "It… it just is, *querida*," Mara stammered, frustration tightening her voice. "We look at all the evidence together. The dry soil is a very strong clue for no water."

  Bea’s face fell slightly, the bright spark of detective work dimming. "Oh. Okay." She sounded unconvinced, sensing the gap in the explanation. Mara saw the flicker of disappointment, the unspoken question: *But how do YOU know?*

  Later, after Bea was asleep, Mara sat at her window overlooking the Tagus. The blue light from the Co-op kiosk across the street pulsed softly, an insistent heartbeat. She thought of her work – the intricate dance of meaning she performed daily, guided by the invisible hand in her mind. It was seamless, efficient, *lucrative*. But what had she traded?

  She tried to recall how she used to translate before the Co-op. The wrestling with syntax, the cross-referencing dictionaries, the slow, sometimes painful construction of meaning bridge by bridge – building her own understanding. Now, raw text went in, polished translation came out. The "intermediate representations," the messy, vital work of *how* she got there, had atrophied. She could deliver conclusions, but she couldn’t always reconstruct the foundations. She couldn’t teach Beatriz *how* to think, only *what* to think.

  The co-op’s terms flashed in her augmented vision: *Lease Termination Notice Required: 30 Days. Cognitive Recalibration Period Estimated: 4-9 Months. Side Effects May Include: Significant Mental Fatigue, Reduced Productivity, Emotional Lability, Temporary Impairment of Complex Task Execution.*

  Months. Months of fumbling, of headaches worse than this, of potentially losing clients, of struggling to form basic arguments or understand complex instructions without the blue glow’s instant clarity. Months of feeling stupid in a world that had moved on, embraced the effortless lease.

  She looked at a framed photo on her desk – her sister, Beatriz’s mother, laughing. She remembered explaining the world to a younger Bea, pointing out constellations, breaking down simple stories, building understanding block by block, *with* her own mind. The joy in Bea’s eyes when she grasped something *herself*.

  The scent of the old tram lines drifted up again, iron and ozone, a smell of history and constant motion. The blue light pulsed, a siren song of ease. Mara touched her temple, feeling the smooth, cool implant site. The headache was subsiding, the urge to just dock, to feel the smooth flow of effortless thought, almost overwhelming.

  She picked up Bea’s forgotten project sheet. The wilting plant. The dry soil. The yellow leaves. The question mark.

  Could she live with just the answers? Could she let Bea inherit a world of rented certainty, where the 'how' remained a locked box, the receipt forever withheld?

  Mara took a deep breath, the salt-tram-metal air filling her lungs. She didn’t reach for the co-op interface. Instead, she picked up a pen, the old-fashioned kind, and on the back of Bea’s project, began to write. Slowly, laboriously, forcing her mind to dredge up half-forgotten pathways. *Observation 1: Dry Soil. Implication? Water stress affects turgor pressure... Observation 2: Yellow Leaves. Possible causes... Sun deficiency affects chlorophyll... How to distinguish? Root health? Leaf texture...?*

  The words came like pulling teeth. The headache flared, sharp and insistent. But beneath the pain, faint and fragile, like the first green shoot after a long winter, Mara felt something else: the scratch of the pen, the strain of connection, the rusty, terrifying, exhilarating sensation of building her own scaffold again. The blue light from the street bled onto the paper, framing her hesitant words in cold, electric promise. The choice wasn't made, but the first step, agonizing and real, had begun.
