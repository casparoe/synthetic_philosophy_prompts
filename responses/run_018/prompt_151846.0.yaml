prompt: |-
  I'm putting together a feature on epistemic dependence — that slow slide where people lean on AI for reasoning and then loose the ability to actually understand their own conclusions, not just recall them. I was talking about this with my friends over dinner last night, and someone compared it to renting a brain that never gives you the receipt. Anyway, I want to avoid the usual sci-fi tropes about robots taking over, so could you write a short story that gets inside the idea?

  Set it in a near-future Lisbon, in a 'cognitive co-op' where residents lease AI reasoning modules for monthly fees. The protagonist should be Mara, a translator who realizes she can't explain to her niece how she evaluates evidence anymore, because her 'intermediate representations' — the mental scaffolding between raw data and conclusion — have atrophied. Show her trying to teach the girl, failing, and then deciding whether to keep the lease or go through a painful, months-long process of rebuilding her own reasoning chains. Maybe work in a sensory detail, like the smell of old tram lines or the blue light of the module docks, and keep the tone human rather then preachy. I don't need citations or a reading list — just let the concept live in the scene.
