answer: |-
  Doctor, your distinction between indexical and normative persistence is admirably precise, and I accept that the psychological author is indeed "vacant" in advanced dementia. But you err in conflating that psychological vacancy with the dissolution of the *institutional person* – the juridical entity recognized by medicine, law, and society, which possesses continuity precisely *through* its constitutive rules. The advance directive *is* a foundational statute within that entity's constitutional framework, established by its sole legitimate author: the competent prior self. The caregiver acts not as a reader of personal messages, but as an agent bound by the institutional charter. To disregard the directive is not merely to ignore historical data; it is to stage a coup against the legal order of the patient-as-institution, dissolving its constitutional integrity and reducing the individual to a mere biological object governed solely by external discretion. The authority derives not from a persistent psychological thread, but from the enduring validity of the self-legislated constitutional act itself.
