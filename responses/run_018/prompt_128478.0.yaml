answer: |-
  Here is a comprehensive set of desiderata for evaluating answers to the Special Composition Question (SCQ), designed to map the conceptual landscape and identify tensions. Each is grounded in a motivating case and flagged for negotiability.

  ### I. Desiderata Grounded in Ordinary Intuition & Practice

  1.  **D1: Accommodate Ordinary Macroscopic Objects (Non-Negotiable Core)**
      *   **Motivating Cases:** Wooden tables, human organisms, mountains, cats, cars. These are objects we refer to, interact with, interact *with*, and predicate properties of in everyday life and scientific practice.
      *   **Negotiability:** **Non-Negotiable (for any plausible theory).** A theory denying the existence of tables or cats is radically revisionary and clashes with fundamental aspects of cognition and language. *All camps accept this*, though they differ radically on *how* to accommodate it (e.g., nihilists via paraphrase/eliminativism, universalists via unrestricted existence).

  2.  **D2: Accommodate Culturally/Perspectivally Dependent Objects (Strong Preference)**
      *   **Motivating Cases:** Constellations (stars composing Ursa Major only relative to human perspective and naming conventions); national borders; artworks like collages or installations where the artist's intention matters; "the wreckage of the Titanic" (a scattered object defined by origin).
      *   **Negotiability:** **Negotiable.** Nihilists often reject these as non-fundamental composites. Universalists accept them trivially. Restricted theorists struggle to find non-arbitrary principles that include constellations but exclude random star pairs. Failure here is less fatal than D1 but suggests the theory may be overly restrictive or insensitive to non-physical factors.

  ### II. Desiderata Grounded in Engineered & Boundary Cases

  3.  **D3: Accommodate Functionally Persistent Objects Despite Part Loss/Change (Strong Preference)**
      *   **Motivating Cases:** A statue missing its left arm (still *one* statue); Theseus's Ship throughout gradual plank replacement; a car with replaced engine/transmission; a living organism undergoing metabolic replacement.
      *   **Negotiability:** **Negotiable.** Tests the theory's ability to handle identity over time through part change/loss. Universalists have no problem (they exist throughout). Nihilists deny composition. Restricted theorists need principles (often functional/biological) that secure persistence through non-total part replacement without implying that *any* arbitrary collection with changing parts composes an object.

  4.  **D4: Accommodate Objects Defined by Process/Behavior Despite High Part Turnover (Preference)**
      *   **Motivating Cases:** A swarm of drones maintaining coordinated flight patterns despite drones constantly landing/replacing each other; a sustained fusion reaction in a tokamak (plasma particles constantly enter/exit, none persist long); a standing wave; a vortex.
      *   **Negotiability:** **Negotiable.** Pushes against the need for *enduring* parts. Challenges theories requiring spatiotemporal continuity or specific types of parts (like biological cells). Universalists accept. Nihilists reject. Restricted theorists need principles capturing dynamic unity without collapsing into universalism.

  5.  **D5: Avoid Arbitrary Dismissal of Boundary Cases (Non-Negotiable Constraint)**
      *   **Motivating Cases:** The statue missing an arm (D3), Theseus's Ship midway through replacement, a swarm *during* drone turnover, a cloud (vague boundaries). A theory cannot simply declare "composition stops here" without a *principled* reason grounded in its core answer to the SCQ.
      *   **Negotiability:** **Non-Negotiable.** A theory that arbitrarily picks cutoffs in continuous series (e.g., "composition occurs at exactly 75.3% part similarity") fails to provide a genuine *answer* to the SCQ. It must apply its principle consistently, even in messy cases.

  ### III. Desiderata Grounded in Formal Mereology

  6.  **D6: Preserve Core Mereological Relations (Non-Negotiable Constraint)**
      *   **Motivating Property:** **Transitivity of Parthood** (If A is part of B, and B is part of C, then A is part of C).
      *   **Negotiability:** **Non-Negotiable.** Violating transitivity leads to deeply counterintuitive results (e.g., my finger is part of my hand, my hand is part of me, but my finger isn't part of me?) and cripples standard mereological reasoning. *All serious camps accept transitivity.*

  7.  **D7: Cohere with Stated Position on Extensionality & Uniqueness (Non-Negotiable Constraint)**
      *   **Motivating Properties:**
          *   **Uniqueness of Composition/Fusion:** If some things compose something, there is only *one* thing they compose (at that time/location). (Often bundled with extensionality).
          *   **Extensionality:** Objects with all the same proper parts are identical. (Implies Uniqueness of Composition).
      *   **Negotiability:** **Non-Negotiable.** A theory must be *consistent* with its stance. If it claims to adhere to Classical Extensional Mereology (CEM), it *must* accept Uniqueness and Extensionality. If it rejects CEM (e.g., for co-located objects like statue/clay), it must explicitly reject Uniqueness/Extensionality and provide a coherent alternative framework. Claiming CEM while violating its axioms is incoherent.

  ### IV. Desiderata Grounded in Metaphysical Costs

  8.  **D8: Avoid Arbitrary Spatiotemporal Cutoffs (Non-Negotiable Constraint)**
      *   **Motivating Case:** A theory that posits composition occurs only within regions of exactly 1m³, or only for objects persisting exactly 1 hour, without a deeper reason grounded in its principle.
      *   **Negotiability:** **Non-Negotiable.** Similar to D5, this renders the answer *ad hoc* and fails to provide a genuine metaphysical explanation. The restriction must be principled, not merely a brute cutoff.

  9.  **D9: Avoid Explosion of Highly Scattered or "Gerrymandered" Objects (Strong Preference - Contentious)**
      *   **Motivating Cases:** The object composed of my nose, the Eiffel Tower, and Alpha Centauri; the mereological sum of all left shoes in the universe; the "incar"/"outcar" (where composition depends on being inside/outside a garage).
      *   **Negotiability:** **Negotiable (but central to the debate).** This is the *core motivation* for restricted composition views and nihilism. Universalists must *bear this cost*, arguing such objects are harmless or that the benefits outweigh it. Nihilists avoid it completely. Restricted theorists aim to avoid it *without* sacrificing D1-D4. Failure to avoid it is a major criticism of universalism.

  10. **D10: Cohere with Fundamental Physical Descriptions (Strong Preference)**
      *   **Motivating Cases:** A sustained fusion reaction (D4); a cloud of gas; the description of matter as fields or quantum states rather than enduring particles; the lack of fundamental "glue" beyond fundamental forces.
      *   **Negotiability:** **Negotiable.** A theory shouldn't *contradict* our best physical descriptions (e.g., by requiring fundamental "glue" that physics doesn't posit). It should ideally explain how composite objects supervene on or emerge from the fundamental physical structure. However, metaphysics is not strictly subordinate to physics.

  ---

  ## Mapping the Tensions: The Core Inconsistency

  The fundamental tension lies in satisfying **D1 (Ordinary Objects), D6 (Transitivity), D9 (Avoid Scattered Objects),** and having a **Principled Restriction (implied by D5 & D8)**. Specifically:

  1.  **D1 (Ordinary Objects):** Requires that tables, cats, etc., exist (are composed).
  2.  **D6 (Transitivity):** Requires that the parts of the parts of a whole are parts of that whole.
  3.  **D9 (Avoid Scattered Objects):** Requires that things like "nose + Eiffel Tower + Alpha Centauri" do *not* compose an object.
  4.  **Principled Restriction (D5/D8):** The rule excluding scattered objects cannot be arbitrary; it must be grounded in a general principle.

  **The Inconsistency:** Finding a restriction satisfying D9 that *only* excludes the objectionable scattered objects *while including all ordinary objects* and *respecting transitivity* is extremely difficult, if not impossible.

  *   **The Gerrymandering Problem:** Any seemingly principled restriction (e.g., "spatiotemporal continuity," "causal unity," "functional unity") applied to include tables and cats will often *also* include objects many find gerrymandered (e.g., a swarm of gnats is causally unified, the entire light cone of a particle is spatiotemporally connected) or *exclude* borderline cases we intuitively accept (e.g., clouds, constellations, Theseus's ship mid-replacement - D2, D3, D4).
  *   **Transitivity Pressure:** Transitivity (D6) links the micro to the macro. If fundamental particles exist and compose atoms, and atoms compose molecules, etc., transitivity demands that fundamental particles are parts of the table. If we deny composition for scattered particles, we need a principled reason why composition *starts* at a certain level that doesn't rely on arbitrary cutoffs (D8) and consistently excludes gerrymandered objects (D9) while including ordinary ones (D1). This forces the restriction to be very specific and often appears *ad hoc*.

  **Can D9 (Avoid Scattered Objects) be squared with a Principled Restriction (D5/D8) while preserving D1 and D6?**
  *   **Universalism:** Rejects D9 outright. Avoids arbitrariness (D5/D8) by having *no* restriction. Easily satisfies D1, D2, D3, D4, D6, D7 (if CEM), D10. Bears costs of D9 and potential conflict with some interpretations of D10 (if physics doesn't "see" arbitrary sums).
  *   **Nihilism:** Accepts D9 by denying composition *everywhere*. Avoids arbitrariness (D5/D8) trivially. Satisfies D6, D7 (vacuously or with simples as parts). Bears the massive cost of radically violating D1 (requiring elaborate paraphrases for ordinary talk), struggling with D2, D3, D4, and potentially D10 (if fundamental physics posits composites like protons).
  *   **Restricted Composition (e.g., Biological):** *Attempts* to satisfy D1, D9, and D5/D8. Typically satisfies D6. **The core tension manifests here:** The restriction (e.g., "only when the parts form a living organism") excludes scattered objects (D9) and includes humans/cats (D1), but *arbitrarily excludes* tables, statues, cars, constellations, swarms, etc. (violating D1/D2/D3/D4). To include them, the restriction must be broadened (e.g., "functional unity"), but this risks including gerrymandered objects (violating D9) or requiring arbitrary line-drawing within continuous cases (violating D5/D8). Coherence with D7 depends on the specific formalism adopted.

  **Conclusion on Tension:** Satisfying **D1 (Ordinary Objects), D9 (Avoid Scattered Objects), and D5/D8 (Principled, Non-Arbitrary Restriction)** simultaneously, under the constraint of **D6 (Transitivity)**, appears **jointly unsatisfiable.** Any principled restriction broad enough to capture all intuitive composites (including boundary cases like swarms) inevitably captures objects considered gerrymandered. Any restriction narrow enough to exclude all gerrymandered objects inevitably excludes some intuitive composites or relies on distinctions that appear arbitrary under scrutiny. This is the central driver of the SCQ debate: each camp prioritizes different desiderata and bears the corresponding costs. Universalism prioritizes lack of arbitrariness and simplicity (D5/D8) over D9; Nihilism prioritizes D9 and ontological parsimony over D1; Restricted Composition struggles to find a stable middle ground satisfying all.
