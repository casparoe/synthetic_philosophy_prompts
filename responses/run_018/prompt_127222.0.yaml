answer: |-
  Here's a straight argument built on your premise, flagging uncertainties as requested:

  **The Core Argument:**
  1.  **Zoning Variances as Performative Utterances:** Your starting point holds. Austin's concept of **illocutionary acts** applies directly. A zoning variance isn't merely *describing* an existing "neighborhood character." It's an **exercitive** act (exercising authority/judgment). By granting or denying a variance based *on* "character," the zoning board *performs* an act of **definition**. It retroactively *constitutes* what "character" *is* in that specific context, establishing a precedent. This is constitutive, not descriptive.
  2.  **The Accumulation of Character:** Repeated variance decisions (and other zoning enforcement acts) layer these constitutive utterances. Over time, they solidify into an apparent, objective "fact" – the neighborhood character. This character is the **felicitous outcome** of repeated performative acts by authority.
  3.  **NIMBYism as Performative Contradiction:** NIMBY groups mobilize to defend this constructed "character" against new development/variance requests. Crucially, they present this character as a *pre-existing, independent reality* ("This *is* a single-family neighborhood," "This *is* our historic charm"). **This is the contradiction:** They treat the *outcome* of prior constitutive speech acts (the performed character) as a natural, foundational fact *immune* to further performative acts (new variances). Yet, the very "fact" they defend *only exists* because of the prior performative machinery they now invoke. Their defense relies on the *authority* of the performative system while denying that same system's *ongoing constitutive power* regarding *their* property/neighborhood. They want the *effect* (fixed character) without acknowledging the *cause* (performative process).
  4.  **"Right to the City" as Negative Right Against Constitutive Subjection:** Lefebvre's "right to the city" is often framed positively (access, participation, use-value). Your reframing is compelling:
      *   Urban residents are *subjected* to these powerful, constitutive utterances (zoning decisions) that define the fundamental conditions of their urban existence (density, use, aesthetics, access).
      *   These utterances are often opaque, non-participatory, and wielded by concentrated authority (boards, councils) influenced by existing property interests (often NIMBYs).
      *   Therefore, a core component of the "right to the city" must be a **negative right** – the right *not to be unilaterally subjected* to retroactive, constitutive definitions of place and community character *without meaningful recourse or agency*. It's the right to resist having your lived environment *defined into fixed being* by the performative utterances of others, especially when those utterances ossify exclusion and inequality under the guise of descriptive "character."

  **Why This Framing Works:**
  *   **Explains NIMBY Power:** It shows how NIMBYs leverage the *product* of the system (the constructed character) to *freeze* the system, preventing its constitutive power from working against their interests.
  *   **Highlights Arbitrariness:** It exposes "neighborhood character" as a political construct, not a natural law, revealing the power dynamics behind its definition.
  *   **Offers Ethical Clarity:** Framing zoning performatives as potential instruments of domination/subjection provides a strong ethical basis for demanding procedural justice and resident agency in urban governance.

  **Where I'm Least Sure (Flagged as Requested):**

  1.  **The "Retroactive" Element:** While variances definitively *constitute* character *moving forward*, the "retroactive" claim is trickier. Does a variance *really* define what character *was* before the decision, or only what it *is* henceforth? It establishes a precedent *based on* a claimed past state, but the *act* itself is forward-looking constitution. The *claim* of describing the past is part of the performative (the "character" is invoked as justification), but the *constitution* is of the *current/future* normative standard. **Uncertainty:** Does "retroactive" overstate it? Is it better framed as the *invocation* of a fictional past to *constitute* a binding present/future?
  2.  **Scope of the Negative Right:** Defining the precise boundaries of this negative right is challenging. Does it negate *all* zoning? Obviously not. Does it only apply to variances? Or to the initial zoning itself? The argument best applies to *ongoing adjustments and enforcement* where "character" is invoked dynamically to resist change. The strongest case is against using the *product* of past performatives (character) to *prevent* new performatives (variances/changes) that could redefine it. **Uncertainty:** Translating the philosophical right into a concrete legal/political right requires more work to avoid being overly broad or paralyzing necessary governance.
  3.  **Material Reality vs. Performative:** While speech-acts are powerful, urban space has material histories, economies, and infrastructures that also shape "character." **Uncertainty:** Does focusing *solely* on the performative risk downplaying these other forces? The argument is strongest seeing performatives as the *mechanism through which* these forces are interpreted, legitimized, and codified into binding "character," not the *only* force.
  4.  **NIMBY Motivation Complexity:** While the performative contradiction is real, NIMBYism is often driven by complex mixes of self-interest, fear of change, investment protection, and sometimes genuine (if perhaps misplaced) community attachment. **Uncertainty:** Does the performative contradiction frame capture the *full* motivational spectrum, or is it primarily a powerful *rhetorical* and *structural* critique of their *argumentation*?

  **Conclusion on Premise/Task:**
  **Your premise is NOT confused, and the task is absolutely possible.** Framing zoning variances as constitutive illocutionary acts that retroactively define "character" is insightful and valid. Identifying the NIMBY defense of this constructed character as a performative contradiction is a powerful critique. Deriving a negative "right to the city" as freedom from unilateral constitutive subjection is a logically coherent and ethically compelling extension rooted in speech-act theory and urban power dynamics. The argument holds water and offers a fresh, critical lens on urban governance and exclusion. The uncertainties flagged are points for refinement, not fatal flaws.
