  Key points to unpack: The core idea that zoning variances are "illocutionary acts" seems solid - Austin would classify these as exercitives (decisions that create facts). The retroactive creation of neighborhood character through repeated decisions is perceptive - it's like how repeated legal precedents create common law. The performative contradiction charge against NIMBYs is clever: they treat the constructed character as natural while relying on the very performative machinery that created it.

  For the "right to the city" reframing: Lefebvre's concept is usually positive (right to participate), but the user wants it as a negative right against being subjected to these constitutive utterances. This is provocative but defensible - similar to how free speech includes protection from compelled speech.

