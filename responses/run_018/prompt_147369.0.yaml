answer: |-
  ### Implications of Structural Explanation for Accountability
  Resolving the Great Man vs. structural debate in favor of structural forces (where Hitler is a "fungible node") radically reshapes accountability frameworks:

  1. **Top Implication for Accountability**:  
     If Nazi atrocities were driven by institutional machinery rather than Hitler’s unique agency, **legal/moral accountability must target systems, not just individuals**. This invalidates the assumption that eliminating one "evil genius" prevents systemic crimes, forcing a shift toward collective responsibility.

  2. **Mechanism That Breaks**:  
     **Command responsibility doctrines** (e.g., Nuremberg’s "supreme leader" principle) collapse. These require proving a leader’s *singular, irreplaceable control* to hold them liable for systemic crimes. If Hitler was substitutable, his absence wouldn’t alter outcomes, making it impossible to attribute atrocities *uniquely* to his orders. Courts couldn’t rely on "he was the indispensable mastermind" arguments.

  3. **Mechanism That Holds or Shifts**:  
     **Functional role-based accountability** survives but shifts:  
     - **Moral guilt**: Applies to *all complicit actors* (e.g., bureaucrats signing death warrants, engineers designing gas chambers).  
     - **Legal tools**: "Joint criminal enterprise" or "organizational liability" (e.g., prosecuting the *SS as an institution*) gain prominence over leader-centric models.  
     - **Focus**: From "Did the leader command it?" to "Did the system enable it, and did you willingly participate?"

  4. **Fungibility of Hitler**:  
     **Yes**—structural forces (antisemitic institutions, militarized bureaucracy, colonial traditions) meant another radical nationalist could have filled his role.

  5. **Prevention Policy Shift**:  
     Move from **assassination/decapitation strategies** (e.g., "kill Hitler to stop genocide") to **dismantling enabling structures**: vetting bureaucrats, criminalizing hate institutions, embedding human rights in state infrastructures.

