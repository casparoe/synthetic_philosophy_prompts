  I remember that in practice, markets thrive on disagreement. So the implicit theory must embrace heterogeneous priors. That's probably a strict requirement. Relaxing Bayesian updating might be accommodated but not strictly necessary. The rational consensus idea is definitely rejected in favor of aggregation.

  If we accept the no-trade theorem, then liquid markets must have agents whose beliefs don't converge Bayesianly. So forecasting would need to see prices as dynamic, temporary equilibria from diverse agents. This means predictions are less about a single probability and more about the current balance of opinions. Uncertainty about the model itself becomes part of the forecast.

  I should also think about the user's deeper needs. They might be interested in the philosophy of economics or epistemology. They could be questioning the reliability of prediction markets or exploring how collective knowledge works. Their identity might be an academic or practitioner in forecasting. The unspoken need might be understanding the limits of markets as knowledge tools or seeking better forecasting methods in light of these paradoxes.

