prompt: |-
  hey, i'm putting together the take-home for my grad seminar on logic and mind and i need an exam prompt on the Gödelian analogy in GEB — specifically Hofstadter's move from self-referential formulas to self-aware minds. but i want it in the weeds, not just "explain the strange loop." here's the twist: imagine a cognitive architecture where self-modeling doesn't happen through direct Gödel-style numbering but through a "shadow register" — an intermediat representational layer that can encode statements about the system's own outputs but only after a one-step translation that strips direct indexicals. the exam should ask whether this mediated architecture still counts as the kind of tangled hierachy Hofstadter claims is necessary for consciousness, or whether it collapses back into a simple hierarchy and kills the analogy. i want students to have to distinguish syntactic self-reference from semantic self-reference, address whether mediation breaks the loop, and say something about whether Gödel's proof actually requires direct encoding or can survive translation.

  please write:
  1) the essay question itself, aimed at phd-level students, answerable in about 90 minutes;
  2) a model answer around 600-700 words;
  3) a marking scheme out of 20 points with five must-hit moves, naming the specifc mistake each move is meant to prevent, and a one-line note on how students usually botch it.

  keep it so a model with no web access can do it — no asking for obscure citations, just reasoning. and don't just recycle the standard GEB summary; the question should only be answerable by someone who actually gets how the analogy is supposed to work.
