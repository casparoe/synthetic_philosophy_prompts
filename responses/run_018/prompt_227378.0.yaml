prompt: |-
  I am a novelist revising a speculative novel populated by animals, engineered creatures, artificial intelligences, and human societies, and I keep making intelligence serve the plot rather than arise from a creature’s actual cognitive equipment. I would like to operationalize a useful distinction among four kinds of minds: Darwinian creatures, whose effective responses are built in by selection; Skinnerian creatures, which can modify their behavior through reward and punishment during their lifetimes; Popperian creatures, which can test possible actions in an internal model before risking them; and Gregorian creatures, whose thinking is extended by language, symbols, institutions, and other culturally inherited tools. Treat these as capacities that may coexist in different degrees, not as four sealed species or as a ranking from less valuable to more valuable minds.

  Please develop a reusable character-design and revision procedure that I can apply to any fictional agent in about twenty minutes. It should provide an ordered sequence of diagnostic questions, specify what kinds of behavioral evidence would count as sufficient answers, and show how to distinguish superficially similar achievements—for example, avoiding a trap because of an inherited reflex, because of past punishment, because of rehearsing the outcome internally, or because one has learned a warning convention. Include tests for mixed and borderline systems, such as collectives, artificial agents, children, and beings whose internal simulation depends on an external notation. I would also like the procedure to enforce what I call counterfactual debt: whenever a character displays a cognitive ability, the fiction must identify the evolutionary history, learning history, imaginative practice, or cultural infrastructure that could plausibly have paid for it; otherwise the ability should be flagged as an authorial convenience. Mark the places where the classification is genuinely underdetermined and where a novelist must make a principled imaginative choice rather than discover a fact.

  Conclude by applying the procedure to three cases from my draft: a bioengineered guard animal that rapidly learns patrol routes but cannot conceive of a disguised threat; a swarm whose colonies appear brilliantly prescient because unsuccessful subcolonies die while successful ones proliferate, although no member represents the future; and my beloved alien oracle, whom I had imagined as a Gregorian supermind but whose every answer is generated from ancestral simulations fixed in its genome, with no capacity to learn after birth or borrow concepts from others. If the procedure assigns the oracle a less exalted kind of mind than I intended, do not rescue my preference; explain the result and then suggest the smallest change to the oracle’s history or mechanisms that would support the richer characterization. Finally, state what kinds of narrative mistakes the procedure can prevent, what it cannot settle about consciousness or moral status, and how it should be used as a revision tool without flattening fictional minds into a taxonomy.
reasoning: |-
  We are going to design a procedure for analyzing the minds of fictional agents in a story. The procedure is built around four categories: Darwinian, Skinnerian, Popperian, and Gregorian. These are not mutually exclusive and can coexist in varying degrees. The goal is to ensure that the cognitive abilities displayed by a character are supported by plausible mechanisms (evolution, learning, simulation, or culture) and to avoid "counterfactual debt" (i.e., abilities without a basis).

  Procedure: Character Mind Analysis (CMA) in 20 minutes per agent

  Step 1: Identify the agent and its key actions/capabilities.
     - List the most significant cognitive or problem-solving actions the agent performs in the story.

  Step 2: For each key capability, assign a primary category (or categories) and ask diagnostic questions.

     A. Darwinian (D) - Built-in by natural selection or design.
        Diagnostic questions:
          1. Is the behavior hardwired (genetically or by design) and present without prior experience?
          2. Is the behavior inflexible across different contexts?
          3. Does the agent show the same behavior in similar situations without variation?
        Evidence: 
          - The behavior is instinctive and appears in all members of the species/type.
          - The agent does not adapt the behavior even when it leads to negative outcomes.
          - The behavior is triggered by specific stimuli without any learning history.

     B. Skinnerian (S) - Learns through reinforcement (reward/punishment).
        Diagnostic questions:
          1. Does the agent change its behavior based on rewards or punishments?
          2. Can the behavior be shaped by trial and error?
          3. Is there evidence of conditioning (classical or operant)?
        Evidence:
          - The agent's behavior improves with practice in a specific context.
          - The agent avoids actions that previously led to punishment and repeats those that led to reward.
          - The behavior is context-specific and might not transfer to new situations.

     C. Popperian (P) - Uses internal simulation to test actions.
        Diagnostic questions:
          1. Does the agent show evidence of planning or considering alternatives before acting?
          2. Can the agent anticipate consequences without having to experience them?
          3. Does the agent use mental models or simulations?
        Evidence:
          - The agent pauses to think before acting in novel situations.
          - The agent can predict outcomes of actions it has never tried.
          - The agent uses a "map" (internal or external) to run simulations.

     D. Gregorian (G) - Relies on cultural tools (language, symbols, institutions).
        Diagnostic questions:
          1. Does the agent use language, symbols, or tools that are culturally transmitted?
          2. Is the behavior dependent on knowledge or technology that could not be invented by one individual?
          3. Does the agent participate in a shared system of meaning (e.g., institutions, traditions)?
        Evidence:
          - The agent communicates using a shared language or symbolic system.
          - The agent uses tools or methods that are clearly taught or learned from others.
          - The agent's behavior is embedded in a social context that provides the necessary cognitive tools.

  Step 3: Check for mixed systems and borderline cases.
     - For each capability, consider if it might be supported by more than one category. For example, a behavior might be initially Darwinian but then modified by Skinnerian learning.
     - For collectives, artificial agents, children, and beings with external notations:
          * Collectives: Treat the collective as an agent and ask if the behavior emerges from individual behaviors (which might be D, S, P, G) or if there is a higher-level organization (which might be G if it involves cultural transmission). Remember: a collective might appear Popperian if it can "simulate" via parallel trials (like the swarm example), but if no individual is simulating, then it's not Popperian at the individual level.
          * Artificial agents: Consider the design. They might be programmed with fixed responses (D), learning algorithms (S), planning modules (P), or access to cultural databases (G).
          * Children: They may have innate behaviors (D), learn from reinforcement (S), develop internal simulation as they grow (P), and acquire language and culture (G). Their capabilities might be in transition.
          * External notations: If an agent uses an external tool (like writing or a computer) to run simulations, then that is Gregorian because it's a cultural tool. But the ability to use the tool might require Popperian capacities.

  Step 4: Enforce counterfactual debt.
     - For every cognitive feat, ask: What paid for it?
          D: Evolutionary history or design process that built the trait.
          S: The agent's own learning history (experiences of reward/punishment).
          P: The development of internal simulation (which might require a brain capable of modeling, and practice in simulation).
          G: Cultural transmission (the existence of the tools and the agent's socialization into them).
     - If none of these are present, flag the ability as authorial convenience.

  Step 5: Note underdetermined cases and mark for authorial choice.
     - Some behaviors might be explainable by multiple mechanisms. For example, avoiding a trap:
          D: If every individual of that species avoids it without experience.
          S: If the agent was previously trapped or saw another get trapped and learned.
          P: If the agent imagines stepping there and "sees" the trap closing.
          G: If the agent has been warned with a symbol (like a sign) or a story.
     - In such cases, choose the mechanism that best fits the character's overall design and the story's themes.

  Step 6: Apply and revise.
     - Based on the above, adjust the character's backstory, experiences, or mechanisms to cover the counterfactual debt.
     - If the character shows abilities in a category without the necessary support, either add the support or remove the ability.

  Now, apply to the three cases:

  Case 1: Bioengineered guard animal that rapidly learns patrol routes but cannot conceive of a disguised threat.

  Analysis:
     - Rapid learning of patrol routes: This is Skinnerian (S) because it is learning through reinforcement (e.g., rewards for correct routes, punishments for deviations). It might also have some Darwinian basis (e.g., an innate drive to patrol) but the routes are learned.
     - Cannot conceive of a disguised threat: This suggests a lack of Popperian (P) capacity. The guard animal does not simulate novel threats (like a wolf in sheep's clothing) because it lacks the internal modeling for that.

  Counterfactual debt:
     - For the Skinnerian learning: The animal must have a learning mechanism (by design) and a history of reinforcement during training. This is plausible: it was engineered to learn quickly and was trained.
     - The lack of Popperian capacity is consistent: the designers did not build (or evolution did not provide) a capacity for simulation of novel scenarios.

  Conclusion: The guard animal is primarily Skinnerian with some Darwinian basis (for the patrolling instinct). The procedure shows consistency: the learning is explained by conditioning, and the limitation is the lack of internal simulation.

  Case 2: A swarm whose colonies appear brilliantly prescient because unsuccessful subcolonies die while successful ones proliferate, though no member represents the future.

  Analysis:
     - The colony appears prescient because successful subcolonies survive and multiply. This is Darwinian (D) at the colony level: it's natural selection among colonies. The colony as a whole adapts over generations of colonies, not within the lifetime of one colony.
     - But note: within a colony, the individuals might be following simple rules (Darwinian at the individual level) that don't involve learning or simulation.

  Counterfactual debt:
     - The prescience is an illusion: it's the result of differential survival of colonies. The evolutionary history (or design, if engineered) of the swarm has produced this selective process.

  Underdetermined? The behavior is clearly Darwinian at the group level. However, if we consider the colony as the agent, then we are looking at a Darwinian creature (the colony) that evolves by selection. But note: the procedure allows for collectives. This is a group-level Darwinian system.

  Conclusion: The swarm colony is a Darwinian creature. The procedure helps to avoid attributing Popperian (foresight) or Skinnerian (learning) to the colony. The narrative mistake it prevents is anthropomorphizing the colony as having foresight when it's really selection.

  Case 3: The alien oracle, imagined as a Gregorian supermind, but every answer is generated from ancestral simulations fixed in its genome, with no capacity to learn after birth or borrow concepts from others.

  Analysis:
     - The oracle provides answers using ancestral simulations in its genome. This is Darwinian (D): the knowledge is built-in by natural selection (or ancestral design) and not updated during the oracle's lifetime.
     - It cannot learn after birth: rules out Skinnerian and the development of new simulations (Popperian).
     - It cannot borrow concepts: rules out Gregorian.

  Counterfactual debt:
     - The answers are paid for by the evolutionary history: ancestral simulations that were selected because they were useful. But note: the simulations are fixed in the genome. This is plausible if we imagine that the ancestors ran simulations and the results were encoded genetically.

  However, the author intended a Gregorian creature. The procedure assigns it as Darwinian because:
     - It does not use cultural tools (it doesn't borrow concepts).
     - The simulations are not run by the individual but are precomputed by ancestors.

  The oracle is not Gregorian because there's no cultural transmission. It's not Popperian because the individual doesn't run simulations; it only plays back pre-recorded ones.

  Smallest change to support Gregorian characterization:
     - Allow the oracle to update its knowledge base by receiving new information from others (cultural transmission). For example, if it can incorporate new data from the environment or from interactions with other oracles or beings, then it would have a Gregorian element.
     - Alternatively, if the oracle uses a symbolic system that is culturally maintained (like a language that evolves and is taught), then that would be Gregorian.

  Without such a change, the oracle remains a Darwinian creature with a complex set of fixed responses.

  Narrative mistakes the procedure can prevent:
     - Anthropomorphizing: assigning human-like thought processes without basis.
     - Counterfactual debt: having characters do things without explaining how they can (e.g., a creature with no language understanding complex symbols).
     - Inconsistent capabilities: e.g., a character that can plan complex heists in one scene but cannot anticipate an obvious trap in another.

  What it cannot settle:
     - Consciousness: whether the agent is phenomenally conscious.
     - Moral status: whether the agent deserves moral consideration (though the analysis might inform it).
     - Subjective experience: what it feels like to be the agent.

  How to use without flattening:
     - The categories are tools for consistency, not a straitjacket. Characters can have unique combinations and idiosyncrasies.
     - Focus on the mechanisms behind the behavior, not just labeling.
     - Allow for ambiguity and growth: a character might develop from one category to another (e.g., a Skinnerian creature that starts to develop simulation).

  In revision, apply the procedure to each major agent and adjust the backstory or scenes to cover the counterfactual debt. This will make the world feel more grounded and the characters more coherent.
answer: |-
  ### Character Mind Analysis (CMA) Procedure  
  A reusable 20-minute diagnostic tool for fictional agents. Apply this ordered sequence to any character, species, or collective. **Core principle:** Abilities must be "paid for" by evolutionary history, learning, internal simulation, or cultural tools. Avoid "counterfactual debt"—unexplained capabilities.  

  ---

  #### **Diagnostic Sequence**  
  **1. Baseline Establishment (3 mins)**  
     - **Question:** What is the agent's *inherited hardware*? (e.g., genome, core programming, collective structure)  
     - **Evidence Required:** Biological/engineering origins (e.g., "bioengineered for surveillance"), innate behaviors (e.g., fixed reflexes), or collective rules (e.g., "swarm particles obey pheromone triggers").  
     - **Red Flag:** No defined hardware → counterfactual debt.  

  **2. Learning Capacity (4 mins)**  
     - **Question:** Can the agent *modify behavior* based on experience?  
       - *Skinnerian Test:* Does it associate rewards/punishments with actions? (e.g., avoiding a trap after prior pain).  
       - *Evidence:* Trial-and-error adaptation (e.g., "failed patrols reduced food rations, altering routes").  
       - *Not Skinnerian:* Instinctive fear (Darwinian) or symbolic warnings (Gregorian).  

  **3. Internal Simulation (5 mins)**  
     - **Question:** Can the agent *test hypotheses* without acting?  
       - *Popperian Test:* Does it pause to imagine outcomes? (e.g., hesitating at a trap to visualize consequences).  
       - **Evidence:**  
         - *Strong:* Deliberation, predictive planning, or mental models (e.g., "the AI ran 10k combat simulations before attacking").  
         - *Weak/Borderline:* External aids (e.g., scribbling maps → Gregorian). Inherited "simulations" (e.g., genetic memories → Darwinian).  
       - **Mixed Cases:**  
         - Children: Partial simulation (e.g., a pup imagines short-term risks but not long-term consequences).  
         - AIs/Collectives: Centralized nodes may simulate; decentralized systems (e.g., swarms) typically do not.  

  **4. Symbolic Extension (5 mins)**  
     - **Question:** Does the agent *use external tools* to think?  
       - *Gregorian Test:* Does it rely on language, institutions, or shared knowledge? (e.g., understanding a trap because of a proverb: "Beware silent floors").  
       - **Evidence:**  
         - Communication (e.g., teaching others), tool use (e.g., writing), or cultural rituals (e.g., "oracles consult ancestral scrolls").  
         - *Not Gregorian:* Solitary innovation (Popperian) or genetic hardwiring (Darwinian).  

  **5. Counterfactual Debt Audit (3 mins)**  
     - For each ability, identify its "funding source":  
       - ☐ Darwinian: Evolved/designed hardware.  
       - ☐ Skinnerian: Personal reinforcement history.  
       - ☐ Popperian: Internal simulation capacity.  
       - ☐ Gregorian: Cultural/symbolic tools.  
     - **Underdetermined Cases:** Flag abilities with >1 plausible explanation (e.g., "avoiding traps" could be any type). *Author must choose.*  

  ---

  ### **Application to Your Cases**  
  **1. Bioengineered Guard Animal**  
     - **Baseline:** Darwinian (engineered senses/aggression).  
     - **Learning:** Skinnerian (reward-based route-learning).  
     - **Simulation:** *Fails Popperian test.* Cannot conceive disguised threats → no evidence of internal modeling.  
     - **Symbols:** Not Gregorian (no cultural tools).  
     - **Counterfactual Debt:** Learning paid for by Skinnerian rewards. *Consistent.* Limitation (no disguise detection) reinforces lack of Popperian capacity.  
     - **Verdict:** Darwinian-Skinnerian hybrid.  

  **2. Swarm Colonies**  
     - **Baseline:** Darwinian (colony success = survival/replication).  
     - **Learning/Symbols:** Not Skinnerian/Gregorian (no individual learning or shared symbols).  
     - **Simulation:** *Fails Popperian test.* "Prescience" is Darwinian selection: unsuccessful colonies die; survivors proliferate. No individual represents the future.  
     - **Counterfactual Debt:** "Brilliance" paid for by colony-level evolution. *Consistent.*  
     - **Verdict:** Pure Darwinian (collective-level).  

  **3. Alien Oracle**  
     - **Baseline:** Darwinian (simulations fixed in genome).  
     - **Learning:** Not Skinnerian (no post-birth learning).  
     - **Simulation:** Darwinian, *not Popperian.* "Ancestral simulations" are playback, not active modeling.  
     - **Symbols:** Not Gregorian (no borrowing/concept-sharing).  
     - **Counterfactual Debt:** Answers funded by evolution, not cognition. *Inconsistent with Gregorian intent.*  
     - **Verdict:** Darwinian (complex, but inflexible).  
     - **Smallest Change for Gregorian Upgrade:** Allow oracle to *incorporate new data* into ancestral models (e.g., "it cross-references simulations with real-time observations using a neural lattice"). This adds Popperian simulation. For full Gregorian status, let it *share interpretations* with other oracles, creating a living tradition.  

  ---

  ### **Limits and Best Practices**  
  **What CMA Prevents:**  
  - Anthropomorphism (e.g., a Skinnerian creature "plotting revenge").  
  - Inconsistent intelligence (e.g., a Popperian AI failing to foresee obvious consequences).  
  - Unearned abilities (counterfactual debt).  

  **What CMA Cannot Settle:**  
  - **Consciousness:** A Darwinian creature may be vivid subjectively.  
  - **Moral Status:** Gregorian tools don’t guarantee personhood (e.g., a language-using AI may still lack empathy).  
  - **Ambiguity:** Some behaviors are underdetermined (e.g., "instinct vs. intuition"). *Use this as narrative fuel.*  

  **Using CMA Without Flattening Minds:**  
  - Treat categories as **overlapping spectra.** A creature can be 70% Skinnerian, 30% Popperian.  
  - **Embrace borderlands:** A child may use Popperian simulation erratically; a swarm might *evolve* Gregorian symbols.  
  - **Revise incrementally:** For each flagged "debt," add one line of backstory (e.g., "the guard animal’s training included electric fences → Skinnerian aversion").  
  - **Preserve mystery:** If a capacity is underdetermined (e.g., "Is the oracle’s insight genetic or spiritual?"), *leave it ambiguous* but ensure internal logic holds.  

  CMA grounds speculative minds in causal coherence, deepening verisimilitude while freeing you to explore the paradoxes of intelligence.
