answer: |-
  Here is a reusable editorial procedure for vetting heritability claims, designed for rapid application by a literate non-specialist. It prioritises concrete, sequential checks and mandates specific wording rules. Steps are ordered to eliminate non-starters first.

  ---

  **HERITABILITY CLAIM FACT-CHECKING CHECKLIST (BRITISH ENGLISH)**

  **Order of Application:**  
  1. → 2. → 3. → 4. → 5. → 6.  
  *If any step fails → "Kill" or "Heavy Caveats" as specified. Proceed only if prior step passes.*

  | **Step** | **Checks For** | **Shortest Defensible Wording for Copy** | **Must Survive?** | **Missing Data?** | **Judgment Call?** |
  |----------|----------------|------------------------------------------|-------------------|-------------------|-------------------|
  | **1a. Individual Claim Filter** | Claims implying genes *determine* an individual's outcome (e.g., "in your genes", "genetic destiny"). | **Kill story.** Error: Heritability describes population variation, not individual fate. | YES: Heritability ≠ individual prediction. | N/A | NO |
  | **1b. Group Difference Filter** | Any suggestion that within-group heritability explains *between-group* differences (e.g., racial, national, or class gaps). | **Kill story.** Error: Within-group heritability is silent on causes of group differences. | YES: The "Taboo Trait" fallacy. | N/A | NO |
  | **2. Method Appropriateness** | Whether the method (twin/SNP/family) fits the trait. Traits requiring rare environments or with high measurement error (e.g., divorce, trauma) often inflate twin estimates. | If mismatch: **Heavy caveats required.** Caveat: "[Method] may overstate genetic influence for traits sensitive to environment or measurement." | YES: Method limits matter. | If method not stated → **Kill.** | YES (Use caution: if trait is socially complex or hard to measure, lean toward caveats/kill). |
  | **3. Variance Source** | Confusing heritability (%) with "proportion caused by genes". Heritability is *only* the proportion of *current population variation* explained by genetic differences. | Mandatory phrasing: "[Trait] variation is [X]% heritable in this study population." **NEVER** "Genes cause X%..." or "X% is genetic." | YES: It's about variation, not causation. | If % not stated → **Kill.** | NO |
  | **4. Environmental Lock** | Claims that high heritability = environment can't change the trait (immutability fallacy). | Mandatory caveat: "High heritability does not mean the trait is unchangeable by environment or policy." | YES: Heritability ≠ immutability. | N/A | NO |
  | **5. Estimate Comparison** | Misinterpreting differences between SNP/heritability (h²SNP) and twin/heritability (h²twin) as solely "environmental share". h²SNP underestimates total genetic influence. | Mandatory caveat if comparing methods: "SNP-based estimates capture only common genetic variants; twin studies may include non-genetic factors." **NEVER** say the gap is purely "environment". | YES: h²SNP < h²twin ≠ "environment %". | If comparing estimates without both h²SNP & h²twin → **Avoid comparison.** | NO |
  | **6. Population Specificity** | Treating the estimate as universal. Heritability is specific to the population and environment studied. | Mandatory caveat: "This estimate reflects one population at one time; heritability can change with environment." | YES: Context-dependence. | If population not clearly defined (e.g., "white British adults", "Swedish twins") → **Heavy caveats.** | NO |

  **Distinctions Dropped for Lay Readers:**  
  -   Mathematical formulas (e.g., Vg/Ve).  
  -   Differences between broad-sense (H²) and narrow-sense (h²) heritability (use "heritability" broadly).  
  -   Technical reasons for twin/SNP discrepancies (beyond Step 5's simple warning).

  ---

  **APPLICATION TO CASES**

  **Case 1: Twin study - Divorce "40% heritable"; proposed headline: "Divorce is in your genes".**  
  -   **Step 1a:** "In your genes" implies individual genetic determinism → **Kill story.**  
  -   *Why:* Step 1a is an instant kill for individual prediction claims. No further steps needed.  
  -   **Final Decision:** KILL. Headline fundamentally misrepresents heritability.

  **Case 2: SNP study - Education "12% heritable" vs twin "40%"; proposed: "Environment is 88% of the story".**  
  -   Step 1a: No individual claim → Pass.  
  -   Step 1b: No group difference claim → Pass.  
  -   Step 2: SNP method appropriate for education? Generally yes, but complex trait → Proceed with caution.  
  -   Step 3: Variance source OK? Proposed wording misstates ("environment is 88%") → **Heavy caveats required.** Mandatory phrasing fixes.  
  -   Step 4: No immutability claim → Pass.  
  -   Step 5: **CRITICAL STEP.** Comparing 12% (h²SNP) to 40% (h²twin) and calling the difference "environment" is wrong. Mandatory caveat applies.  
  -   Step 6: Population specificity caveat needed.  
  -   **Final Decision:** RUN WITH HEAVY CAVEATS.  
  -   **Published Wording Example:**  
      > "Headline: Genetic study finds education years variation partly linked to common DNA differences.  
      > Opening: A study using DNA analysis suggests 12% of the variation in how long people stay in education is linked to common genetic differences within its specific population. This SNP-based estimate is lower than some older twin studies (which suggested ~40%), reflecting its focus on common variants and different methodology. **SNP-based estimates capture only common genetic variants; twin studies may include non-genetic factors.** *High heritability does not mean the trait is unchangeable by environment or policy.* This estimate reflects one population at one time; heritability can change."

  **Case 3: High body weight heritability used to argue against public-health interventions.**  
  -   Step 1a: No individual claim → Pass.  
  -   **Step 1b: CRITICAL STEP.** Using *within-group* heritability to argue about limits of *population-level* interventions (a policy change affecting the whole group/environment) implicitly invokes the group difference fallacy. It assumes high heritability *within* an affluent population means changing the environment *for that population* won't change the mean weight. This is the core error → **Kill story.**  
  -   *Why:* Step 1b kills arguments that within-group heritability constrains group-level environmental change effects. The argument is invalid.  
  -   **Final Decision:** KILL. Fundamental misinterpretation of heritability's meaning.

  ---

  **WHAT THE PROCEDURE CANNOT GUARANTEE**  
  Even if a study passes every step:  
  1.  **It cannot guarantee the underlying science is sound.** The checklist catches *interpretation* errors, not flaws in study design, data quality, p-hacking, or undisclosed methodological limitations.  
  2.  **It cannot prevent motivated readers from misinterpreting the caveats.** Some readers will inevitably infer determinism or group differences despite clear wording.  
  3.  **It cannot assess the true policy relevance or effect size.** A statistically significant heritability estimate may be trivial in practical terms.  
  4.  **It cannot account for unmeasured gene-environment interactions** that might drastically alter the estimate in different contexts.  

  **Procedure Summary:** Apply steps 1a/1b first to eliminate fatal flaws (kill if triggered). Steps 2-6 enforce mandatory wording and caveats on surviving stories. Kill cases violating individual determinism or group difference extrapolation; apply heavy caveats for method issues, estimate comparisons, or vague populations. Always embed the non-negotiable phrases: "variation is...", "does not mean unchangeable", and "specific to population/environment".
