answer: |-
  This is a sharp observation of a distinct and corrosive group dynamic. While it touches on existing concepts, it doesn't fit neatly into any single established term within collective intentionality theory. It represents a specific **failure mode of joint commitment**, characterized by **outcome-contingent retroactive disavowal**.

  Here's a precise definition and differentiation:

  **Name:** **Retroactive Commitment Denial (RCD)**

  **Definition:** RCD occurs when individuals in a group:
  1.  **Initially engage in robust "we" language and actions:** They actively participate, contribute resources/labor, and verbally endorse collective goals and identity, creating the appearance (and subjective experience for others) of a strong joint commitment.
  2.  **Hold a private, conditional "success metric":** Each member internally defines the project's success or acceptable outcome based on personal interpretations of the shared goal, often unstated and potentially divergent.
  3.  **Retroactively disavow the joint commitment upon negative outcomes:** When the collective outcome conflicts with their private success metric (e.g., project failure, negative public reaction, undesired compromise), they strategically disengage *by denying the existence or depth of the original joint commitment itself*. They reframe their participation solely as individual action, absolving themselves of collective responsibility.
  4.  **Deny the *existence* of the commitment, not just its outcome:** The key move is not merely criticizing the outcome or stating they were overruled, but *re-writing the history of their participation* to deny that a "we" with shared obligations ever truly existed in the first place.

  **Core Mechanism:** The joint commitment is implicitly treated by each individual as *conditional* upon the outcome aligning with their private interpretation of success. This conditionality is hidden during the collaborative phase. The commitment isn't genuinely revoked due to new information; it's *contingent from the outset* on a specific outcome filter.

  **Distinguishing RCD from Related Concepts:**

  1.  **Strategic Ambiguity:**
      *   **Similarity:** Both involve unstated reservations.
      *   **Difference:** Strategic ambiguity is *proactive* – ambiguity about goals or commitment is deliberately cultivated *from the start* to allow flexibility or avoid conflict. In RCD, individuals *appear fully committed* upfront ("we" language, action) and only *retroactively* invoke ambiguity or deny commitment *after* a bad outcome relative to their private metric. The ambiguity/disavowal is a *reaction*, not an initial strategy.

  2.  **Weak Shared Intentionality:**
      *   **Similarity:** Both may involve less-than-full-fledged Gilbertian joint commitment.
      *   **Difference:** Weak shared intentionality describes a *persistent state* of alignment on actions but not necessarily deep shared goals or robust obligations (e.g., "we're both pushing the car" without a deeper "we intend to get it to the shop"). RCD involves a *shift*: initially appearing strong ("we *are* getting this car to the shop together!"), then collapsing into individualistic framing *only upon failure* ("I was just pushing; *I* never agreed to *which* shop!"). The initial presentation is of a stronger commitment than weak SI implies.

  3.  **Groupthink:**
      *   **Similarity:** Both can involve suppression of dissent during the process.
      *   **Difference:** Groupthink suppresses dissent *internally* to maintain harmony *during* decision-making, leading to poor decisions. Dissenters often *still feel collectively responsible* for the bad outcome. RCD involves *retroactive external disavowal* of the *entire basis of collective action* after the outcome is known and negative for the individual. The suppression in RCD is of the *conditional nature of their own commitment*, not necessarily of differing opinions about the task itself.

  4.  **Genuine Change of Mind / New Information:**
      *   **Similarity:** Both involve shifting position based on events.
      *   **Difference:** A genuine change of mind acknowledges the *prior commitment* but explains why it was abandoned due to *new information, unforeseen circumstances, or a fundamental reassessment*. ("We were committed to X, but when Y happened, I realized it was wrong/unworkable.") RCD *denies the prior joint commitment existed at all* ("There was never really a 'we' committed to X; I was just doing my part as an individual"). The shift is ontological (denying the *existence* of the "we") rather than justificatory (explaining *why* the "we" dissolved).

  **What Counts as RCD - Boundary Conditions:**

  *   **Included:** Members who actively used "we" language, participated visibly, and only *after* a negative outcome (relative to their private metric) claim they were "just an individual contributor," "never fully bought in," or "the group wasn't really aligned." ("We were all for the new garden layout until the neighbors complained, then suddenly Sarah insisted she'd 'only ever agreed to volunteer hours, not design decisions'.")
  *   **Included:** Situations where the negative outcome is *interpreted* negatively by the individual based on their private metric, even if others see it neutrally or positively. (The open-source feature shipped but got negative press; a core dev disavows the group effort because *their* private metric was universal acclaim).
  *   **Excluded:** Individuals who consistently expressed reservations or conditional support *throughout* the project, even if using some "we" language pragmatically. (This edges towards strategic ambiguity).
  *   **Excluded:** Individuals who genuinely change their view based on significant new information *and acknowledge their prior commitment*. ("I was fully committed to plan A, but the budget data we got last week shows it's impossible; we need a new plan or I can't continue.")
  *   **Excluded:** Free-riders who never contributed meaningfully or aligned in the first place.
  *   **Excluded:** Situations where the group's stated goal was genuinely ambiguous from the start, making divergent interpretations reasonable *without* retroactive disavowal.

  **Why Gilbert's Framework Strains:** Gilbertian joint commitment creates mutual obligations that aren't easily dissolved unilaterally. RCD exploits a potential weakness: individuals might *appear* to create a joint commitment while internally holding a secret exit clause contingent on outcomes. It reveals a form of **insincere or conditional participation masquerading as full joint commitment**. While Gilbert focuses on the structure *when present*, RCD highlights how individuals can *simulate* that structure while reserving the right to deny it later based on personal outcomes.

  In essence, **Retroactive Commitment Denial (RCD)** is the act of leveraging the benefits of perceived collective action and shared identity while strategically pre-positioning an individualistic escape hatch, triggered only when the collective outcome fails a hidden, personal litmus test, and executed by denying the very collective reality they previously helped construct. It's a betrayal of the *temporal persistence* expected in genuine joint commitment.
