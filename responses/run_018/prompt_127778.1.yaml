answer: |-
  ### Metaphysics Final Exam Question (25 marks; 90 minutes)

  **Question:**  
  Your grandmother’s terracotta portrait bust was shattered. A conservator rebuilt it using a 3D-printed ceramic core, embedding fragments of the original clay as discontinuous inclusions within a new outer shell. The resulting object visually resembles the original bust but consists predominantly of new material, with the original clay distributed sporadically within it.  

  Is the reconstructed object **identical** to the original bust? Critically evaluate how each of the following theories would answer this question, specifically addressing the challenge posed by the *discontinuous distribution* of the original material within a new substrate:  
  1.  **Four-dimensionalism (Temporal Parts Theory)**  
  2.  **Relative Identity Theory**  
  3.  **Hylomorphism**  

  In your evaluation, ensure you:  
  *   Explain how *each theory defines persistence and identity* over time.  
  *   Apply *each theory specifically* to the discontinuous-inclusion scenario.  
  *   Identify at least one *decisive weakness* in how one of these theories handles this case.  

  ---

  ### Model Answer (Approx. 500 words)  

  The reconstructed bust presents a challenge for material constitution: the original material persists discontinuously within a new dominant substrate, complicating identity claims based on material continuity or form alone.  

  1.  **Four-dimensionalism (Temporal Parts):**  
      This view holds that objects persist by having temporal parts at different times. The original bust is a spacetime worm with temporal parts up to its shattering. The reconstructed object is a distinct spacetime worm beginning post-repair, overlapping spatially but not temporally with the original. Crucially, **the discontinuous fragments are merely material overlap, not identity-conferring.** These fragments are parts of the *original* temporal worm, but now also mereological parts of the *new* temporal worm (the reconstructed object). While the original temporal worm ceases, the matter composing one of its temporal parts (the fragments) becomes part of a new, distinct worm. Thus, **the reconstructed bust is not identical to the original.** The theory handles discontinuity easily: identity isn’t grounded in continuous matter but in the unity of a spacetime region.  
      *Weakness:* Four-dimensionalism severs identity from any intuitive sense of the *same object* enduring change. The grandmother’s *specific* bust, as a unique historical entity, is deemed extinct simply because its temporal parts stop, despite much of its matter persisting (albeit discontinuously) in a near-perfect replica. This seems counterintuitive for artifacts with significant personal/cultural identity.  

  2.  **Relative Identity Theory:**  
      This theory denies absolute identity; identity is always relative to a sortal (e.g., "statue," "lump of clay"). The original might be the same *statue* as the original but not the same *aggregate of clay*, or vice versa. Applied here: **relative to the sortal "artwork" or "portrait bust," the reconstructed object might be the same as the original** because it preserves the defining artistic form and function, even with discontinuous original matter. However, **relative to the sortal "terracotta mass," it is not the same**, as the material aggregate is radically different (new core, sparse fragments). The discontinuous inclusion poses no special problem; identity is sortal-relative, not materially continuous.  
      *Weakness:* The theory struggles to specify *which* sortal is authoritative here ("artwork" vs. "clay mass"). It risks arbitrariness: if we prioritize the artistic sortal, identity seems too cheap (form dominates), but if we prioritize the material sortal, identity seems too strict (ignoring the artifact's nature). Crucially, **it cannot explain why the discontinuous distribution matters** *at all* if we choose the "artwork" sortal.  

  3.  **Hylomorphism:**  
      Hylomorphism sees objects as compounds of matter (*hyle*) and form (*morphe*). The identity of an artifact like a bust depends on the persistence of its substantial form – the organizing principle that makes it *this* bust. **The key question is whether the substantial form survives the shattering and reconstruction.** The discontinuous inclusion of original fragments is significant but insufficient alone. If the reconstruction successfully reinstantiates the *exact same artistic form* – the unique configuration defining *this* portrait – and this form is understood as the persisting principle, **identity could be maintained despite the material discontinuity.** The original matter, though scattered, participates in the restored form. However, if the substantial form was destroyed upon shattering and a new, numerically distinct form is imposed during reconstruction (even if identical in appearance), **then the reconstructed bust is a replica, not identical.**  
      *Weakness:* Hylomorphism relies heavily on the metaphysical notion of a "substantial form," which is obscure and difficult to verify empirically. Determining whether the *same* form persists through radical destruction and partial re-embedding seems deeply ambiguous.  

  **Conclusion:** None of the theories deliver an uncontested answer. Four-dimensionalism clearly denies identity, Relative Identity offers a qualified yes/no depending on the sortal, and Hylomorphism offers a possible yes contingent on form persistence. The discontinuous inclusion specifically challenges Relative Identity's ability to ground sortal choice and Hylomorphism's ability to track form identity, while Four-dimensionalism bypasses the discontinuity issue but sacrifices intuitive persistence.  

  ---

  ### Marking Scheme (25 Marks Total)

  *   **A (21-25 marks):**  
      *   Accurately and concisely explains the core tenets of persistence/identity for all three theories.
      *   **Successfully applies at least TWO theories specifically to the discontinuous-inclusion scenario,** demonstrating how the distribution of original fragments impacts the identity judgement within each framework (e.g., fragments as overlapping temporal parts, challenging sortal choice for RI, role in form instantiation for hylomorphism).
      *   Identifies a **decisive weakness** in one theory’s handling of *this specific scenario* (e.g., 4D's counterintuitive loss of the historical object, RI's arbitrariness/sortal inability to address discontinuity, Hylomorphism's obscurity regarding form persistence through destruction).
      *   Clear, logically structured, and coherent argument. Addresses the core question of identity directly.

  *   **B (16-20 marks):**  
      *   Accurately summarizes the core tenets of persistence/identity for all three theories.
      *   Correctly states the *general* conclusion each theory might reach about identity (e.g., 4D denies it, RI says sortal-relative, Hylo maybe yes/no).
      *   **Fails to meaningfully engage the *discontinuous-inclusion* aspect of the scenario.** Mentions the scenario but treats it like a standard replacement case (e.g., just says "new matter" without addressing the significance of the fragments being discontinuously *embedded*).
      *   May identify a general weakness of a theory but not one *decisive* for this specific scenario, or identifies a weakness unclearly.
      *   Generally well-structured but lacks depth in scenario application.

  *   **C (11-15 marks):**  
      *   Provides a basic but partially accurate or incomplete account of two or three theories.
      *   Limited or superficial application to the scenario; may misapply a theory. Little to no engagement with discontinuity.
      *   Weakness identified is vague, incorrect, or absent.
      *   Structure or clarity issues.

  *   **D (6-10 marks):**  
      *   Significant inaccuracies in explaining the theories.
      *   Minimal or incorrect application to the scenario.
      *   Lacks identification of a relevant weakness.
      *   Poorly structured or unclear.

  *   **E (0-5 marks):**  
      *   Fails to address the question requirements seriously. Major inaccuracies, irrelevance, or minimal attempt.
