prompt: |-
  I'm on the clinical quality-review board at a mid-size hospital, and we get about four adverse-event reports a week where the harm involved something staff didn't do — didn't escalate vitals, didn't reorder a med, didn't document a refusal. I have maybe fifteen minutes per file, and I need to sign off whether that omission gets listed in our internal report as a contibuting causal factor. Right now people just argue; there's no fowchart.

  Can you turn the philosophy of causation-by-omission into an actual decision procedure I can run? I want it in steps in order: what I check first, what counts as passing each step, where it stops with a hard no, and where it has to hand off to a human judgment call because the issue is values or ambiguity rather than fact. Keep the distinctions that actually matter for sign-off — counterfactual dependence, whether the omitted act was in the binding protocol (not just best practice), and what to do when two people both failed to act — but drop metaphysical baggage that doesn't change the checkbox. Then apply it to three cases: (1) a nurse doesn't escalate abnormal vitals and the patient codes; (2) a physician skips an imaging study that's best practice but not in the current pathway, and the patient dies of something that image wouldn't have caught in time anyway; (3) two nurses each assume the other verified a dosage, and the wrong drug is given. Make sure one of these gives me an answer I won't like. Also say flat-out what the procedure can't do — assigning blame, resolving protocol ambiguity, etc.

  Please separate what's pretty settled in omission philosophy from what's genuinely contested (for instance, whether omissions need normative expectations or can be purely counterfactual). Don't present one contested side as the consensus. Keep the whole response under 450 words — I have to paste it into a form. There might be a typo or two in this prompt, but I wrote it quick between meetings.
