answer: |-
  Here's a 3-minute opener designed to bridge that gap, spotlight your "weird" peng idea, and set up productive tension for the workshop:

  **(Start warm, inclusive, pragmatic)**

  "Good morning, everyone. Thanks for being here. Tomorrow’s big topic is family care and obligation – something profoundly theoretical and intensely practical, often at the same time. We have scholars who breathe concepts like *li* and the *wu lun* (五伦, five relationships), and we have practitioners who breathe the complex, messy air of real caregiving. My job today is just to kick things off, and I want to do it by sharing something that stopped me cold in my reading: a late-Ming Confucian commentary that throws a fascinating wrench into the works.

  **(Introduce the tension caregivers face - validate their reality)**

  "On the ground, caregivers constantly face this tension: the ideal of family harmony and duty versus the reality of harm. Telling someone trapped in an abusive or profoundly unjust family dynamic to 'just fulfill your role' or 'respect your elder' isn't just unhelpful – it can be actively damaging. It ignores the lived suffering when roles become cages. The social workers here know this intimately. The abstract ideal crashes against the sharp edges of human frailty and cruelty.

  **(Drop the "weird" peng bomb - challenge the scholars' assumptions)**

  "Now, the grad students might be thinking, 'But Confucianism *is* hierarchical! Father/Son authority is bedrock!' Absolutely. Yet, here’s where it gets weird. In this late-Ming text, the commentators argue for something radical: the role of the **friend** (*peng*, 朋). They suggest that if a father is acting with gross injustice towards his son, a true *friend* of that father has not just the right, but the *obligation*, to step in and correct him. To call him out. To disrupt the hierarchy *from within the system of roles*.

  **(Do the structural work - why this matters for both sides)**

  "Think about that. It’s not an outsider rebelling. It’s not the son overthrowing the father. It’s **another role-holder**, the friend, invoking the *very ethics of relationship* to intervene *because* the father is failing *his* role. The hierarchy isn't destroyed; it's *corrected* using its own logic. The duty to care for the vulnerable son overrides the duty to blindly obey the failing father *when activated by a third party fulfilling their distinct role*.

  **(Set up the workshop's core tension)**

  "So why start here? Because this little-known idea exposes a crucial fault line we need to explore:
  *   For practitioners: It shows that even within highly structured systems like Confucianism, there's recognition that rigid 'duty' can fail. Roles aren't meant to be prisons; they are tools for achieving harmony and justice. When they cause harm, the system itself might offer internal mechanisms for correction – like the friend stepping in.
  *   For scholars: It challenges us not to oversimplify. It shows roles aren't static monoliths. They exist in dynamic tension, capable of *mutual critique and correction* for the sake of the greater relational good. Celebrating the 'disruption' misses the point – it’s about *restorative* action *through* roles.

  **(Conclude with the workshop challenge)**

  "This Ming commentator gave the friend a radical authority born of care. It forces us to ask: **Where does the duty to care for the vulnerable sit within the web of obligations? And when one role fails catastrophically, what other roles – perhaps unexpected ones – hold the authority, or even the duty, to step in and set things right?** That's the tension I hope we can wrestle with today: between the ideal structure and the messy reality, between unyielding duty and the imperative to prevent harm, all within the complex dance of human roles. Let's get started."

  **Key reasons this works:**

  1.  **Validates Social Workers:** Starts with *their* reality of harm and the failure of simplistic "duty" talk.
  2.  **Intrigues Scholars:** Uses a specific, lesser-known textual example ("weird") to challenge a common assumption about hierarchy.
  3.  **Spotlights "Peng":** Makes the friend role the central, surprising actor doing the structural work.
  4.  **Does the Structural Work:** Explicitly connects the peng intervention to the failure of blind filial duty *and* to the internal logic/restoration within the role system.
  5.  **Creates Productive Tension:** Sets up the core question (care vs. rigid duty, role correction) for the workshop without taking sides.
  6.  **Accessible Language:** Avoids heavy jargon, uses terms like "role," "duty," "harm," "justice," "correct," "web of obligations."
  7.  **No Citations:** Focuses on the *idea* and its implications.
  8.  **Time:** Roughly 3 minutes when delivered at a moderate pace.

  Good luck! This is a fantastic hook – it shows you're thinking critically *and* practically about the material.
