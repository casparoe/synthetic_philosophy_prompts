prompt: |-
  hey so i'm in this confucian role ethics course and my prof asked me to open tomorrow's workshop on family care and obligation. the room's split — half grad students who know all the li and wu lun stuff, half social workers who actually do caregiving and probably think philosophy is useless. i want to build the talk around one weird thing i read: in some late-Ming commentries the friend-role (peng) gets authority to correct the father-son bond if the father is being unjust, which totally breaks the heirarchy everyone teaches. i want that to do real structural work — the caregivers should see why "just do your family duty" can fail, but the philosphers shouldn't just celebrate tearing roles apart. can you write about 3 minutes of remarks? don't load it with citations or book lists since half the room wouldn't care and i don't have my notes. also writing this on my phone at 2am so excuse the mess.
