  ## Welcome Home Toast

  **1. The Constraint**  
  Family, friends, welcome. We gather tonight, plates clinking, chairs scraping, hearts full, to celebrate my brother’s presence at this table. He is home. Yet, this welcome carries unique weight. Among us sit minds holding profound, opposing convictions about justice itself. One view sees punishment as an illusion of desert; the other sees desert as the bedrock of accountability. So, I cannot stand here and say he has “paid a debt” to society, implying a settled moral ledger. Nor can I imply his freedom is merely luck, erasing the significance of the process he endured. My words must walk this line.

  **2. The Fault Line**  
  Our gathering holds a deep philosophical divide. On one side is a conviction that the very idea someone *deserves* suffering for a past wrong is a fundamental error, a dangerous fiction obscuring the complex causes of action. Punishment, from this view, can only ever be justified, if at all, by future consequences – safety, deterrence, rehabilitation – never by a backward-looking moral balancing act. The opposing conviction holds that without this idea of *deserving* punishment – that the punishment fits the *moral gravity* of the act itself – the entire structure of justice collapses into arbitrary power. To deny desert, it’s argued, is to deny the core of personal responsibility and the moral meaning of holding someone accountable.

  **3. What Welcome Means Here**  
  So, how do we welcome him? We welcome him not by declaring a cosmic balance sheet settled, nor by treating this moment as mere chance. We welcome him by acknowledging the profound reality of the *institution* he has navigated. That institution, embodying society’s complex response, demanded his presence – a demand rooted in respect for the seriousness of events, respect for the harm done, and crucially, respect for his status as an *agent* whose actions matter. His release isn't about erasing the past or declaring a simple moral equilibrium achieved backward. It signifies that the forward-looking processes society deemed necessary – assessment, consequence, time served – have reached their institutional conclusion. It marks the point where the formal demand for his absence ceases. His place here tonight is the outcome of that process concluding, a process that took his agency seriously enough to hold him within its framework. We welcome him home because that demanding process, designed to grapple with profound things, has formally yielded back his place at this table.

  **4. The Closing Image**  
  Brother, we see your hands here, resting on the wood of this table we share, finally home; the long, difficult path you walked now meets the open horizon of this moment, and we are simply, fiercely, glad you’re here.
