answer: |-
  ### 1. Nearest Analogues and Precise Differences  
  *(≈250 words)*  

  **Ad hoc hypotheses** (Popper): These are auxiliary assumptions added solely to save a theory from refutation, lacking independent testability. *Divergence:* Your pattern involves *domain restrictions* rather than causal explanations. While ad hoc moves may include scope limitations, your case is distinguished by (a) **cumulative nesting** (each restriction modifies the prior domain), (b) **boundaries tracking observed failures** (not preemptively fixed), and (c) **internal conceptual resources** (e.g., defining X using the theory’s own terms).  

  **Protective-belt reasoning** (Lakatos): Lakatos’ "research programs" modify auxiliary hypotheses to shield a "hard core." *Divergence:* Your pattern isn’t merely shielding—it’s **progressive fragmentation of the domain**. Each restriction carves a subset from the prior domain using conditions whose *projectibility* depends on observation-history: a parameter (e.g., "social density") is irrelevant until a failure occurs near its value, then it becomes decisive. This creates a **Goodman-esque asymmetry**: the *meaning* of "applicable conditions" shifts retroactively based on new data.  

  **Goodman’s grue**: Grue highlights how predicates (e.g., "grue" = green-if-observed-before-t, blue-otherwise) project asymmetrically from past to future. *Divergence:* Your pattern operates at the **theory-structure level**, not the predicate level. It’s a meta-strategy for domain specification: the *conditions for applying the theory* (e.g., "when X is absent") behave like grue-like predicates—stable for past successes but redefined upon new failures. Yet unlike grue, the asymmetry emerges from layered, theory-dependent restrictions rather than a single paradoxical term.  

  **Key distinction**: Ordinary auxiliary hypotheses (e.g., "unseen planet" in Uranus’ orbit) *explain* failures without altering the theory’s scope. Here, restrictions *shrink the domain* in response to failures, using the theory’s own framework to redraw boundaries post hoc.  

  ---

  ### 2. Boundary Conditions: What It Is and Is Not  
  *(≈200 words)*  

  **Clear Instance**: Bohr’s atomic model initially predicted spectral lines for hydrogen. When applied to helium, failures arose. Defenders restricted the domain to "single-electron systems," excluding helium. Later, even hydrogen fine-structure anomalies prompted further restrictions ("non-relativistic velocities"). Each step used quantum theory’s internal concepts (e.g., electron count, velocity) to exclude failing cases, progressively narrowing applicability until novel predictions (e.g., for muonic atoms) required prior knowledge of boundary compliance.  

  **Near-Miss Exclusion**: Epicycles in Ptolemaic astronomy. While ad hoc (adding epicycles to fit planetary motions), the domain (celestial bodies) remained fixed. Adjustments explained *how* bodies moved, not *where the theory applied*. The boundary ("all planets") wasn’t fragmented; epicycles were causal auxiliaries, not nested scope conditions. Crucially, epicycles didn’t redefine applicability based on observation-history—Mars’ orbit was always subject to epicycles, not exempted until a failure occurred.  

  **Inclusion Criteria**:  
  - Cumulative, theory-internal restrictions shrinking the domain.  
  - Boundaries placed near observed failures (not preemptive).  
  - Conditions treated as irrelevant in successes but decisive in failures.  
  **Exclusion Criteria**:  
  - Fixed-domain adjustments (e.g., adding epicycles).  
  - Explanatory auxiliaries without domain alteration (e.g., positing experimental error).  

  ---

  ### 3. Identification or Coinage  
  *(≈200 words)*  

  No established term captures this *specific* pattern. I propose:  
  **Projective Domain Fragmentation (PDF)**  

  **Definition**: A defense strategy whereby a theory *T*, confronted with empirical anomalies, iteratively appends scope conditions {*C₁, C₂, ..., Cₙ*} such that:  
  > (a) Each *Cᵢ* is defined using *T*’s conceptual resources;  
  > (b) *Cᵢ* excludes observed anomalies by restricting to a subdomain *Dᵢ ⊂ Dᵢ₋₁*;  
  > (c) The boundary of *Cᵢ* is calibrated to the anomaly’s location;  
  > (d) For any unobserved system, *T*’s applicability depends on prior verification of *⋂Cᵢ*.  

  **Justification**:  
  - *Projective*: The conditions’ relevance is retroactively projected onto failures (analogous to Goodman’s projectibility problem).  
  - *Fragmentation*: The domain is fractured into nested subsets, losing unity.  
  - *Domain*: Emphasizes scope (not core theory) as the mutable element.  
  Unlike Lakatos’ "degenerating problemshifts" (which focus on fading heuristic power), PDF highlights how *predictive generality* is eroded by asymmetric boundary-setting.  

  ---

  ### 4. What Would Change This Assessment  
  *(≈100 words)*  

  **Revision Triggers**:  
  1. If shown that all theories *must* adjust boundaries this way (rendering PDF non-pathological).  
  2. A historical case where such restrictions *enabled* novel predictions (contra PDF’s erosion of applicability).  
  3. Clarification that Goodman’s asymmetry *does* apply to domain conditions (e.g., if "grue-like" scoping is already formalized).  

  **Weakest Point**: The claim that PDF is distinct from degenerating research programs. If Lakatosians convincingly argue that PDF is merely a *mechanism* of degeneration (not a novel category), the coinage would be redundant. The temporal asymmetry in condition-application is the most vulnerable aspect—if "calibrated to anomalies" proves indistinguishable from standard boundary refinement, PDF collapses into ad hocness.  

  **Concluding Vulnerability**: The assertion that PDF’s *observational asymmetry* (treating conditions as irrelevant in successes vs. decisive in failures) is meaningfully distinct from ordinary Bayesian updating. If this asymmetry is just rational belief revision, PDF reduces to prudent theory adjustment.
