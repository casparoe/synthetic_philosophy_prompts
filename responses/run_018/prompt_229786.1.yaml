prompt: |-
  I'm putting together a handout for an upper-level undergrad course on social philosophy, and my students keep running together three different questions when we talk about unwritten rules: why a group settles into a regular pattern at all, what (if anything) makes that pattern something people can appeal to when criticizing each other, and whether the pattern is actually justified. In a couple weeks we're doing David Lewis on convention and some more recent work on the evolution of norms, and I'd love a decision tree that sorts accounts of how a mere regularity turns into a norm. The branching nodes should be questions a student can answer about concrete little cases without recognizing any jargon. So, for instance, a village where everyone walks on the left side of the path without thinking; a company where an emoji comes to mean 'I accept the meeting' and using a different one now reads as rude; a fishing community that rotates spots every season and treats breaking the rotation as not just unusual but wrong. Maybe throw in a case with mixed motives too, like everyone privately wishing they didn't have to bring a dish to the potluck but doing it anyway because they'd feel awful if they didn't.

  Leaves should include at least: a Lewis-style convention (mutual expectations plus common knowledge and a conditional preference to conform, with the pattern being more or less arbitrary), a selectionist/evolutionary account where the pattern is just a stable equilibrium picked out by learning or cultural evolution and the participants needn't represent any 'ought' at all, a social-norm account where people prefer to comply because they believe others expect them to and will sanction or blame them if they dont, and a deflationary regularity view that says there's no extra normative ingredient over and above the regularity and whatever comfort people feel with it. Build the tree from the logical space first—pick the questions that actually separate these views, list which combinations of answers can be coherently occupied, then locate the actual positions—and flag any pairs of leaves the tree cant separate cleanly, with a note on what extra question would split them. Also mark empty cells with a sentence on whether the position is incoherent, just unattractive, or merely never developed. Each leaf should get a short name and a sentence on its most awkward commitment. 7-10 nodes is about right.
reasoning: |-
  Hmm, the user is teaching a social philosophy course and needs a decision tree to help students distinguish different accounts of how regularities become norms. They're dealing with students confusing three key questions: why patterns emerge, what makes them critiquable, and whether they're justified. 

  I should build this tree using concrete cases they provided - village path-walking, emoji use in companies, fishing spot rotation, and mixed-motive potlucks. The tree needs to branch on questions students can answer without jargon, leading to leaves covering Lewis-style conventions, evolutionary accounts, social norm theories, and deflationary views.

  Key requirements include:
  - 7-10 decision nodes
  - Clear differentiation of theories
  - Identification of indistinguishable leaves
  - Notes on incoherent/unoccupied positions
  - Each leaf's "awkward commitment"

  Starting with logical space: The fundamental axes seem to be:
  1. Why individuals follow the pattern (preference structure)
  2. Whether they perceive normative expectations 
  3. Whether they attribute normativity to the pattern itself

  First branch should probably be about conformity motives - do people follow because they want the coordination benefit (Lewis) or to avoid sanctions (social norms)? Then drill into their mental representations: do they think others expect compliance? Do they feel internal pressure? 

  The potluck example is great for mixed motives - people follow despite private reluctance because of anticipated guilt. This should help separate social norms from pure sanction-avoidance.

  Need to watch for:
  - Evolutionary accounts where no one represents "oughts"
  - Deflationary views denying extra normativity
  - Potential gaps in theoretical space (like patterns maintained purely by guilt without expectations)

  For indistinguishable positions, Lewis vs evolutionary accounts might both fit cases with conditional preferences but differ on common knowledge. Might need a "do people recognize mutual awareness?" branch.

  Each leaf's awkwardness should highlight theoretical tensions:
  - Lewis: Calling arbitrary patterns "normative"
  - Evolutionary: Explaining criticism without norm representations
  - Social norms: Distinguishing from pure fear of sanctions
  - Deflationary: Accounting for "wrongness" intuitions

  The tree should end with 4-5 distinct leaves plus notes on borderline cases. Company emoji case is perfect for Lewis convention, fishing rotation for social norms, village paths for deflationary, and potluck for the guilt-based variant.
answer: |-
  Here's a decision tree designed to clarify the conceptual space for your students, built from first principles and applied to concrete cases. It uses 8 branching nodes (questions) to sort 5 distinct theoretical positions, with notes on indistinguishability and empty cells.

  ### Key for Cases Referenced
  - **Village Path**: Everyone walks left unconsciously
  - **Company Emoji**: "👍" means acceptance; "😊" now seems rude
  - **Fishing Rotation**: Breaking spot rotation feels *wrong*
  - **Potluck Guilt**: Bring dish to avoid feeling awful, despite private reluctance

  ---

  ### The Decision Tree
  Start at the top and answer each question for a concrete case:

  1. **Do people follow the pattern primarily because they expect *most others* follow it?**  
     - *No* → Go to Q2  
     - *Yes* → Go to Q3  

  2. **Is the pattern stable because it's privately rewarding/comfortable *without* considering others?**  
     - *Yes* → **Leaf 1: Comfortable Regularity**  
     - *No* → *Empty Cell* (Pattern unlikely to persist without social reinforcement)  

  3. **Do people prefer to follow *only if* they expect others to follow?**  
     - *No* → **Leaf 2: Social Norm (Sanction-Driven)**  
     - *Yes* → Go to Q4  

  4. **Is the pattern arbitrary? (i.e., another could work equally well if others switched?)**  
     - *No* → Go to Q5  
     - *Yes* → Go to Q6  

  5. **Do people follow because they believe the pattern is *inherently right*?**  
     - *Yes* → *Empty Cell* (Moral Realism – Rarely applied to conventions; e.g., not for emojis/path-walking)  
     - *No* → Go to Q7  

  6. **Do people know that others know they follow, and that others know they know?**  
     - *No* → **Leaf 3: Evolutionary Equilibrium**  
     - *Yes* → **Leaf 4: Lewis Convention**  

  7. **Do people feel *internally* bad (guilt/shame) if they break it?**  
     - *No* → Go to Q8  
     - *Yes* → **Leaf 5: Social Norm (Internalized)**  

  8. **Do people follow mainly to avoid *external* reactions (anger, gossip, exclusion)?**  
     - *Yes* → **Leaf 2: Social Norm (Sanction-Driven)**  
     - *No* → *Empty Cell* (Logically possible but empirically rare; no clear motive to conform)  

  ---

  ### The Leaves (Theoretical Positions)
  1. **Comfortable Regularity (Deflationary)**  
     - *Awkward Commitment*: Must deny that people genuinely appeal to the pattern to criticize (e.g., in Village Path, "walking right isn’t *wrong*, just unusual").  
     - *Fits*: Village Path (if no criticism occurs).  

  2. **Social Norm (Sanction-Driven)**  
     - *Awkward Commitment*: Reduces normativity to fear of social punishment; struggles to explain *guilt* in Potluck/Fishing cases.  
     - *Fits*: Company Emoji (if "rude" means fear of reprimand/gossip).  

  3. **Evolutionary Equilibrium (Selectionist)**  
     - *Awkward Commitment*: No participant needs to represent "oughts" or expectations; criticism is just signaling to restore efficiency.  
     - *Fits*: Village Path (if stable via unconscious imitation), Fishing Rotation (if rotation is just a fitness-enforcing habit).  

  4. **Lewis Convention**  
     - *Awkward Commitment*: Arbitrary patterns (like emojis/path-sides) become "normative" via mutual expectations alone.  
     - *Fits*: Company Emoji (if "👍" is arbitrary and common knowledge).  

  5. **Social Norm (Internalized)**  
     - *Awkward Commitment*: Requires internalized guilt/shame *without* needing external sanctions (e.g., "I’d feel awful" in Potluck).  
     - *Fits*: Potluck Guilt, Fishing Rotation (if "wrong" implies guilt).  

  ---

  ### Indistinguishable Pairs & Empty Cells
  - **Lewis vs. Evolutionary (Q6 "No")**  
    - *What splits them*: Does the stability rely on **common knowledge of expectations**?  
    - Lewis requires it; Evolutionary accounts don’t (e.g., Village Path could be either).  

  - **Sanction-Driven vs. Internalized Norms (Q7/Q8)**  
    - *What splits them*: Is the motive **avoiding external punishment** or **avoiding guilt**?  
    - Fishing Rotation could be either without probing motives.  

  - **Empty Cells**  
    - *Q2 → "No"*: Incoherent without social forces – patterns dissolve unless reinforced.  
    - *Q5 → "Yes"*: Unattractive for arbitrary conventions (no one claims emojis are *inherently moral*).  
    - *Q8 → "No"*: Never developed – if no external *or* internal motive, conformity lacks explanation.  

  ---

  ### How to Use in Class
  - Have students apply the tree to each case **before** reading the theories.  
  - Highlight that **criticizability** (your second question) emerges only in Leaves 2,4,5 – and differs in each.  
  - Note that **justification** (third question) is orthogonal: all leaves *could* be unjustified (e.g., discriminatory norms).  

  This tree forces distinctions in motive and mental representation, isolating why students conflate the questions. It also reveals where theories overlap (e.g., Lewis and Evolutionary both handle coordination) and where they diverge (e.g., internal guilt requires extra machinery).
