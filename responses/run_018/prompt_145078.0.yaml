  - Proposition q: "The collective does not know p"
  Then when the team sees q is true (via their database), but if they could come to know p, this would contradict q, creating the Fitchian contradiction.

  The three positions would react differently:
  (i) Unrestricted knowability theorist gets trapped accepting that q is both knowable and unknowable
  (ii) Fitch-style realist says q is inherently unknowable from the start
  (iii) Restrictionist blocks closure for self-referential q

  The critical element is the self-referential loop in distributed knowledge - remove that (e.g., single researcher) and it collapses to standard Fitch. The restrictionist's move feels like kicking the can down the road though - it saves knowability technically but leaves the paradox lurking in group epistemology.

