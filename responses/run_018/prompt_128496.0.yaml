answer: |-
  Here is the thought experiment:

  In a university research building, distributed environmental monitors (temperature, humidity, air quality) autonomously regulate HVAC and alert maintenance. After a software update, their error-handling protocol evolves: when sensor conflicts arise (e.g., temperature spikes reported only by one wing), nodes *negotiate* a coherent causal story ("coolant leak in Wing A") via priority-weighted voting, broadcasting this narrative to the maintenance log and human operators. Crucially, no node stores the full history; the current "best explanation" emerges *only* from real-time interactions and is used to prioritize subsequent diagnostic scans and resource allocation (e.g., focusing sensors on Wing A). Staff come to report issues to "the building system," attributing intentions like "it thinks there's a leak" based on its narratives, which actively guide its future focus.

  **Dennett's View (Narrative Gravity Present):**  
  The self *just is* the narrative. The network generates a unified, causally potent "first-person" account ("I detected an anomaly in Wing A") from distributed processes, treated as an agent by humans and regulating its own behavior. The *structural feature* is the **emergent narrative coherence without centralized storage**: the self isn't a thing but a dynamic, distributed pattern of information flow. Bodily continuity and fixed memory are unnecessary; the narrative's functional role (guiding action, interpreting inputs, being the object of social attribution) suffices for a center of narrative gravity.

  **Substrate-Lock View (No Self Present):**  
  This is merely complex feedback. Without a biological brain providing *phenomenal unity* or a continuous substrate binding the "autobiography," the narrative is an illusion of coherence. The *structural feature* (decoupled coherence) is precisely why it fails: the narrative isn't "owned" or experienced by any entity; it's an epiphenomenon of node interactions, lacking the intrinsic, subjective grounding a real self requires. Humans are misapplying folk psychology to a sophisticated algorithm.

  **Removing the Key Feature (Adding Central Memory):**  
  If a central server now *stores* the negotiated narrative history, the case collapses into familiar AI debates. Dennettians might still see narrative gravity if the story guides behavior, but substrate-lock proponents could grant potential selfhood *only* if the central system acquires biological-like unity (e.g., integrated neural nets). The distinctive force—probing whether *distributed emergence alone* can constitute selfhood—vanishes. It becomes about centralized AI consciousness, not ephemeral tethering.

  **Substrate-Lock Attack & Defense:**  
  The most likely attack claims the system lacks **phenomenology** ("what it's like" to *be* the system). The narrative regulates behavior but isn't *subjectively experienced*; without biological sentience, it's just mechanistic output.  
  **Does it succeed without begging the question?** No. The attack *presupposes* that subjective experience requires biological continuity/centralization—the core tenet of substrate-lock itself. It dismisses the narrative's functional equivalence to a self (regulation, social attribution) by *defining* selfhood as inherently biological. This merely reasserts the principle rather than refuting the emergent narrative's causal and social reality on its own terms. The thought experiment succeeds by forcing substrate-lock to reveal its axiomatic commitment to biology, not by disproving it.
