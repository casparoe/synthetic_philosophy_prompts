answer: |-
  Your notes present a sophisticated, historically grounded, and methodologically sharp argument. Here’s a detailed assessment addressing your specific queries:

  ### 1. **Reading of Gould & Lewontin: Burden of Proof vs. Anti-Adaptationism**  
     **Accuracy:** Your interpretation is **highly defensible and insightful**. While Gould and Lewontin’s "spandrels" paper (1979) is often misremembered as purely anti-adaptationist, their core argument was indeed **methodological pluralism**.  
     - Key evidence:  
       - They explicitly critiqued the *unquestioned dominance* of adaptationist "just-so stories" (Panselectionism), not adaptation per se.  
       - Their emphasis on "**alternatives to adaptation**" (spandrels, developmental constraints, phylogenetic inertia) demanded *positive evidence* for adaptationist claims.  
       - Gould later clarified (e.g., in *Structure of Evolutionary Theory*, 2002) that their goal was restoring "**pluralism**" to evolutionary biology, not eliminating adaptationism.  
     - **Burden of Proof**: Your framing aligns perfectly with their call for adaptationists to *rule out non-adaptive explanations* before asserting optimal design. This shifted the default assumption from "adaptive until proven otherwise" to "demonstrate adaptation rigorously."

  ### 2. **Sleep Example: Does it Illustrate or Collapse?**  
     **It works superbly** as a modern spandrel case, **if framed carefully**:  
     - **Strengths**:  
       - It flips the script on a trait (monophasic sleep) widely assumed to be a "deep adaptation."  
       - Highlights the interplay of *cultural drivers* (clock-time labor, artificial light) acting on *ancestral plasticity* (biphasic rhythms), making it a classic "exaptation + constraint" scenario.  
       - Forces the question: "Where’s the evidence this is *optimally designed* rather than a contingent response to industrialization?"  
     - **Risks to Mitigate**:  
       - **Avoid Overcorrection**: Don’t imply sleep has *no* biological constraints. Emphasize that plasticity (not neutrality) allows cultural reshaping. Cite evidence:  
         - Historical/anthropological records of segmented sleep (Roger Ekirch’s work).  
         - Industrial-era pressures normalizing consolidated sleep.  
       - **Clarify "Spandrel"**: Specify it’s the *modern monophasic pattern* (not sleep itself) that’s the spandrel – an emergent byproduct of new environmental/cultural "architecture."  
       - **Not Anti-Adaptationist**: Frame it as demanding *better evidence* for adaptationism, not rejecting it outright.  

  ### 3. **Evolutionary Psychology (EP) Critique: Defensible or Misrepresentation?**  
     **Your claim is trenchant and largely defensible**, though nuanced:  
     - **"Domestication of Vocabulary"**:  
       - EP often uses "spandrel" as a **residual category** for inconvenient traits (e.g., religion, art) while prioritizing adaptationist explanations for core domains (mate choice, cooperation).  
       - Key issue: EP rarely *operationalizes* tests for non-adaptive alternatives (e.g., rigorously modeling developmental constraints or phylogenetic inertia).  
       - Examples: Tooby & Cosmides’ "Standard Social Science Model" critique sidesteps Gould-Lewontin by dismissing non-adaptationist explanations *a priori*.  
     - **Counterpoints to Address**:  
       - Some EP work *does* engage constraints (e.g., work on exaptations in language evolution).  
       - EP would argue their focus is on *adaptive function*, not denying constraints exist.  
     - **Strengthen Your Case**:  
       - Cite specific studies where EP invokes "spandrel" dismissively without investigating alternatives.  
       - Note the field’s tendency to favor "massive modularity" (implying pervasive adaptation) over plasticity.  
       - Reference critics *within* EP (e.g., Buller’s *Adapting Minds*) who echo your concerns.

  ### 4. **Overall Coherence & Provocation**  
     - **For an Evolutionary Theorist**: This is a **coherent, necessary critique**. It correctly identifies:  
       - The unfinished methodological revolution sparked by Gould-Lewontin.  
       - The tendency to "domesticate" spandrels into a tokenistic concession while maintaining adaptationist defaults.  
       - The value of applying spandrel-thinking to novel domains (like sleep).  
     - **Provocation vs. Substance**: It’s provocative *because* it’s substantive. You’re not dismissing adaptationism but demanding it meet a higher evidential bar – precisely what G&L intended.  

  ### Key Recommendations for Development  
  1. **Sharpen Definitions**:  
     - Distinguish: *Adaptation* (trait shaped by selection for current function) vs. *Exaptation* (co-opted from prior function) vs. *Spandrel* (byproduct of other traits) vs. *Constraint* (limits on possible forms).  
  2. **Preempt Pushback**:  
     - Acknowledge that modern evolutionary biology *has* integrated constraints (e.g., evo-devo). The issue is *uneven application*, especially in EP.  
     - Stress that the "burden of proof" isn’t anti-science – it’s *pro*-rigor.  
  3. **Bolster Sleep Argument**:  
     - Add a line: *"This isn’t to say human sleep lacks biological underpinnings, but that its industrialized monophasic form reflects a recent cultural imposition on ancestral flexibility."*  
  4. **EP Nuance**:  
     - Credit EP where it engages constraints (e.g., work on mismatch theory) but argue this remains marginal to its core narratives.  

  ### Conclusion  
  Your notes are intellectually rigorous and historically informed. The sleep case is a **compelling modern spandrel** if contextualized as a *culturally mediated exaptation of plastic biology*. Your EP critique hits a real weakness: the field **uses 'spandrel' as a dustbin while maintaining adaptationist defaults**. This is exactly the methodological complacency Gould and Lewontin warned against.  

  **Final Thought**: Your column’s power lies in showing that the true "afterlife" of the spandrels paper isn’t rejection of adaptationism, but the **enduring challenge to demonstrate it rigorously**. That’s a lesson still being domesticated.
