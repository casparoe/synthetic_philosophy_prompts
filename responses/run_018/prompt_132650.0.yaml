answer: |-
  ### Exam Prompt  
  **Time:** 90 minutes  
  **Length:** ~700 words  
  **Question:**  
  A philosopher claims that Gödel’s first incompleteness theorem implies that any "complete" normative ethical theory (construed as an effectively axiomatized formal system capable of expressing arithmetic) must contain true moral judgments it cannot derive. This purportedly forces moral realists into an infinite Gödelian hierarchy of meta-ethical frameworks. First, state the precise formal conditions required for Gödel’s first incompleteness theorem to apply (effective axiomatization, consistency, omega-consistency, and arithmetical expressibility of proof predicates). Second, critically evaluate whether these conditions can be satisfied by a normative ethical theory. Argue concretely why the theorem fails to apply to ethics on **at least two distinct formal grounds**, avoiding general appeals to the "non-formal" nature of morality. Focus on structural mismatches in the required formal properties.

  ---

  ### Model Answer (438 words)  
  Gödel’s first incompleteness theorem requires:  
  1. **Effective axiomatization**: A recursive set of axioms.  
  2. **Consistency**: No contradiction is derivable.  
  3. **Omega-consistency**: If the system proves ¬φ(n) for each numeral n, it does not prove ∃xφ(x).  
  4. **Arithmetical expressibility**: The system can represent recursive functions/predicates, including its own proof relation.  

  The ethical analogy fails on two formal conditions:  

  **1. Failure of arithmetical expressibility**:  
  Gödel’s proof hinges on encoding syntax (e.g., "P is a proof of S") into arithmetic via Gödel numbering. This requires a fixed, recursive mapping between symbols and natural numbers, and predicates like "is a valid proof" must be recursive. Normative theories lack syntactic properties amenable to such encoding. Moral judgments (e.g., "Killing is wrong") lack the precise, finitary combinatorial structure of logical formulas. Unlike arithmetic operations (e.g., successor), moral concepts (e.g., "dignity") cannot be reduced to recursive functions over numerals. Without this, the self-referential Gödel sentence (which asserts its own unprovability) cannot be constructed.  

  **2. Failure of omega-consistency**:  
  Omega-consistency assumes a determinate, mathematical truth predicate for the system’s arithmetic statements. In ethics, truth is not model-theoretically fixed in the same way. Suppose a theory proves "Act A is not obligatory" for each specific act A in a sequence indexed by natural numbers (e.g., A₁, A₂, ...). For the system to be omega-inconsistent, it would also need to prove "There exists an obligatory act A." However, moral predicates ("obligatory") lack the extensional precision of mathematical predicates (e.g., "even"). Whether quantifying over acts violates omega-consistency depends on contested normative facts, not a formal property of arithmetic. Gödel’s theorem requires omega-consistency to be a purely syntactic property derived from arithmetic’s intended model; no analogous "intended model" of morality exists to ground this condition.  

  **Crucially**, the failure is not merely that ethics is informal but that Gödel’s machinery relies on *specific mathematical structures* absent in normative systems:  
  - Proof predicates require discrete, finitely checkable syntax; moral reasoning lacks such syntax.  
  - Omega-consistency presupposes a background arithmetic ontology; moral realism implies no parallel ontology.  
  Thus, the theorem cannot generate a hierarchy of meta-ethical systems because the initial conditions for incompleteness are unmet.  

  ---

  ### Marking Scheme  
  An **A-grade** response must:  
  (1) Correctly list all four formal conditions (effective axiomatization, consistency, omega-consistency, arithmetical expressibility) without omission or conflation;  
  (2) Identify **two distinct failures** (e.g., arithmetical expressibility *and* omega-consistency) with precise technical justifications (e.g., "moral predicates cannot be Gödel-numbered due to non-combinatorial syntax" or "omega-consistency presupposes a mathematical truth predicate absent in ethics");  
  (3) Avoid generic claims like "ethics isn’t formal" by explaining *why* the condition’s mathematical structure fails to apply (e.g., "no recursive proof predicate exists for moral derivation");  
  (4) Contrast arithmetic’s fixed ontology with moral realism’s lack thereof.  
  A **B-grade** response may: omit omega-consistency; conflate consistency with omega-consistency; cite only one failure adequately; or lapse into vague appeals to informality without structural analysis.
