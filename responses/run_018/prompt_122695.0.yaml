prompt: |-
  You are a philosopher of science and social epistemologist who has spent a decade advising foundations, aid agencies, and impact investors on how they form justified beliefs about organizations they cannot observe directly. You know the biological and economic literature on costly signaling and the handicap principle in detail: handicaps as deliberately wasteful displays, the requirement that a signal be differentially costly for the types it is supposed to separate, the difference between an index (mechanically tied to the quality, hard to fake) and a conventional signal (arbitrary in form, stabilized only by cost), counter-signaling by the highest-quality individuals who can afford not to perform, the possibility that a signal's cost is transferred rather than burned, and what happens to a signal once the receiver's response begins rewarding it. Think carefully and at length. Before you draft anything procedural, spend a few hundred words working out, for yourself, which of these commitments are load-bearing for a practitioner and which are refinements that must be sacrificed to usability, and flag any step where you think the theory is genuinely contested or silent. Do not retreat into generalities: every gate you propose should be one that a program officer could actually run on a Tuesday afternoon with the files in front of them.

  Here is my situation. I direct a small foundation that makes unrestricted three-year grants averaging about sixty thousand dollars a year to grassroots organizations in countries where we have no staff of our own. We receive roughly two hundred and forty applications a year and fund twelve. Two program officers do the first pass over six to eight weeks; the due-diligence budget for a finalist is about two thousand dollars, which is not enough for a site visit in most cases, though it is enough to pay a local consultant for a day or two. A board of five must ratify every grant; board members are intelligent people with no training in any of this and they will not read more than a one-page memo per finalist. Rejected applicants can request a written explanation, so whatever we do has to be statable in plain language without jargon. A wrong pick costs three years of money and, in the worst cases, real damage to the people the organization was supposed to serve.

  I want a written decision procedure for deciding which parts of an application we are entitled to treat as evidence of organizational quality, which parts we should treat as evidence of something else (and of what), and which parts we should record as non-evidence and ignore. Structure it as an ordered series of gates, each with a question, a statement of what counts as a sufficient answer, and an explicit stopping rule: fatal (stop, do not count this as evidence) versus defeasible (continue, but downweight).

  Some distinctions I want to survive the translation into practice, and I want you to tell me if I have got the priority wrong:

  1. Name the hidden quality, the signaler, and the audience before evaluating any signal, and say what decision the audience's response consists of. A signal is only honest relative to a receiver whose response sustains it.
  2. The currency test. Identify the currency in which the cost is paid: cash, staff hours, reputational exposure, physical or legal risk, opportunity cost of time. Then check whether that currency is identical to the quality being signaled (which makes the evidence circular), independent of it (which makes the signal arbitrary but potentially honest), or anti-correlated with it (which makes the signal actively perverse; I suspect several of ours are).
  3. Net cost, not gross cost. Subtract everything the signaler gets back regardless of type: visibility, a consultant's help, a fiscal sponsor's underwriting, a tax benefit, skills learned in the process, resale value of the asset. Where the cost is borne by someone other than the applicant, a paid grantwriter, a US fiscal sponsor, a better-funded partner, the signal is cost-shifted and I want a specific instruction for detecting that.
  4. Index versus conventional signal, with different audit standards for each: for the index, ask what would have to be true for it to be fabricated and how we would ever find out; for the conventional signal, ask what sustains its cost and what happens when we start rewarding it.
  5. Burned versus transferred cost, and what each one certifies. A requirement that consumes staff hours may certify very little and may consume the very capacity it was meant to certify; a requirement that obliges an applicant to raise money from its own community may be an index of local buy-in rather than of program quality. I want these handled differently.
  6. Audience leak and non-uniform cost. A signal aimed at us may also be read by local competitors, regulators, landlords, or a hostile state apparatus, which can raise its cost enormously for some applicants and not others, in ways that invert the ranking we were hoping for. Requiring public visibility is the case that worries me most.
  7. Counter-signaling at the top. Organizations with established reputational capital and other funders often decline to perform for us. I want a rule for when the absence of a signal is uninformative rather than negative.
  8. Dynamics. What happens to this signal over two or three cycles if we reward it, who can eventually afford it, and at what point does it become a costly obstacle that carries no information? I also want a candid rule about deliberately wasteful requirements, including whether there is any case in which we are permitted to impose one, and who has to sign off if we do.

  Please be explicit about the points where judgment cannot be eliminated and must be handed to a person because the question is one of values rather than fact. I can think of at least three: how much burden we are willing to impose on applicants we will probably not fund, how to weigh false negatives (missing a superb but inarticulate group) against false positives (funding a merely presentable one), and whether to treat a small pilot grant as a gift or as a purchase of information.

  Then apply the whole procedure to four cases.

  First, a fourteen-page narrative with a polished logic model and an M&E framework in flawless English, submitted alongside three years of monthly bank statements and a payroll list reconciled by a named local accountant, from a youth-employment organization in Nairobi.

  Second, an applicant with no website, no annual report, no English-language materials, and only a referral from an intermediary we trust, compared against an applicant with a communications officer and a glossy site.

  Third, a matching requirement: we match, dollar for dollar, the first ten thousand dollars an applicant raises locally.

  Fourth, and this is the one where I expect you to tell me something I do not want to hear: our board's favorite device, the dedication filter, in which shortlisted organizations send a staff member to a regional hub for a full day of interviews at their own expense, roughly four hundred to nine hundred dollars plus two days of time, and considerably more where a visa is involved. The board believes this separates the committed from the opportunistic. Run the procedure on it without softening the result, tell me what it actually screens for, tell me whether reimbursing travel would help or destroy it, and if you think it should be replaced, say what should replace it and what that replacement will cost the applicants.

  Finally, give me a one-page plain-language version suitable for laminating and for a ninety-minute training with board members, and then a short closing section on what this procedure cannot do: the cases it will systematically misfire on, the equilibria it cannot see (including sectors where every local organization has adapted to a different, larger funder's signals), and the questions it cannot answer at all.
reasoning: |-
  Hmm, this is a deep and demanding request from a foundation director grappling with how to evaluate grassroots organizations without direct observation. The user clearly has sophisticated understanding of signaling theory but needs concrete operationalization - a classic case of translating academic rigor into practical procedures. 

  Let me unpack the core tensions. The director operates under severe constraints: minimal due diligence budget (only $2k per finalist), board members who won't read beyond one page, and real consequences for bad grants. They're explicitly rejecting theoretical "generalities" - every gate must be executable on a Tuesday afternoon with existing files. That's a refreshingly brutal practicality filter.

  The eight distinctions they want preserved are telling. Especially noteworthy is their concern about "inverted" signals (point 6) where visibility requirements might penalize vulnerable groups, and their intuition that some signals may be actively perverse (point 2). The dedication filter case (point 8) feels particularly charged - they clearly suspect it's flawed but need armored evidence to convince the board.

  Key challenges I need to address:
  First, collapsing complex signaling theory into binary gates without oversimplifying. The "currency test" (point 2) and "net cost" (point 3) will be crucial here. Second, preserving the director's sophisticated distinctions while making them actionable - like differentiating burned vs transferred costs (point 5). Third, confronting the board's pet "dedication filter" honestly without waffling.

  For the procedure itself, I'm considering a six-gate structure:
  Gate 0: Explicitly state the hidden quality being assessed (non-negotiable per point 1)
  Gate 1: Cost origin - is this applicant's burden or consultant work? (addresses cost-shifting)
  Gate 2: Currency test - circular, independent or perverse? (their point 2)
  Gate 3: Net cost calculator - subtract all recoverable value (point 3)
  Gate 4: Signal type & audit path (point 4)
  Gate 5: Burden assessment - who pays and what's consumed? (point 5)
  With special handling for audience leak (point 6) and countersignaling (point 7) as overlays

  The four test cases will be revealing. That Nairobi youth org with flawless English documents practically screams "professional grantwriter." The matching requirement might actually be brilliant if framed as testing local buy-in rather than organizational capacity. And the dedication filter... oh that's going to hurt. My analysis suggests it selects for organizations with liquid cash and compliant staff - possibly inversely correlated with grassroots legitimacy. Reimbursing travel wouldn't fix it, just make it wasteful differently.

  For the laminated guide, I'll distill the gates to their brutal essence with concrete examples. The "what this can't do" section must highlight systematic blind spots: how we'll miss superb but vulnerable groups, how signals decay when rewarded, and why no procedure fixes resource asymmetry.

  Most ethically fraught will be the judgment calls flagged in point 8. Particularly whether small grants are gifts or information purchases - that's fundamentally a values decision about how much burden we impose for intelligence gathering. No theory can answer that, only institutional conscience.
answer: |-
  ## Decision Procedure for Signal Evaluation in Grant Applications  
  *Structured as 7 Gates with Explicit Stopping Rules*  

  **Core Principle:** Signals are only evidence if (a) cost is borne *differentially* by high-quality vs. low-quality orgs, and (b) that cost isn’t circular, perverse, or shifted to others.  

  ---

  ### Gate 0: Define the Context (Pre-Evaluation)  
  **Question:** *What hidden quality are we assessing? Who is the signaler? Who is the primary audience? What audience action sustains the signal?*  
  **Sufficient Answer:**  
  - Quality: e.g., "Effective program delivery capacity," "Community legitimacy," "Financial resilience"  
  - Signaler: The applicant organization (specify level: e.g., ED, field staff)  
  - Audience: Usually funders (including us), but could be community, government, etc.  
  - Sustaining Action: e.g., "Funding decisions by private foundations"  
  **Rule:** *Fatal* if not defined. Prohibit evaluation until clarified.  

  ---

  ### Gate 1: Cost Origin Check  
  **Question:** *Could this signal be produced by a paid intermediary (grantwriter, fiscal sponsor, consultant) rather than the applicant?*  
  **Sufficient Answer:**  
  - **Yes (Cost-Shifted):** If polished English narratives, complex budgets, or professional branding appear without evidence of *internal* capacity (e.g., no staff with relevant skills, consultant fees in budget).  
  - **No:** If the work clearly required insider knowledge (e.g., raw field data, untranslated community testimonials).  
  **Rule:** *Fatal* if cost-shifted. Do not treat as evidence of *organizational* quality. Record as "evidence of access to professional services."  

  ---

  ### Gate 2: Currency Test  
  **Question:** *Is the cost paid in a currency that is (a) identical to, (b) independent of, or (c) anti-correlated with the hidden quality?*  
  **Sufficient Answer:**  
  - **Circular (Identical):** Cost directly *is* the quality (e.g., "We have strong financial systems!" proved by submitting complex financial docs… which require strong financial systems to produce).  
  - **Independent:** Cost in unrelated currency (e.g., staff time to attend a workshop ≠ program effectiveness).  
  - **Perverse (Anti-Correlated):** Cost is *lower* for low-quality types (e.g., public visibility *increases* risk for legitimate groups in repressive regimes).  
  **Rule:**  
  - *Fatal* if Circular or Perverse.  
  - *Defeasible* if Independent (downweight heavily; weak evidence).  

  ---

  ### Gate 3: Net Cost Calculator  
  **Question:** *What benefits does the applicant receive *regardless of quality*? Subtract these from gross cost.*  
  **Sufficient Answer:** List recoverable value:  
  - Visibility/PR value  
  - Skills learned during application  
  - Consultant support received  
  - Fiscal sponsor underwriting risk  
  - Resale value of assets (e.g., equipment bought for a video)  
  - **Key:** If cost is primarily borne by a partner/funder (e.g., fiscal sponsor covers audit), net cost to *applicant* is near zero.  
  **Rule:** *Fatal* if net cost ≤ 0 *for all applicant types*. *Defeasible* if net cost > 0 but shared (downweight proportionally).  

  ---

  ### Gate 4: Signal Type & Audit Path  
  **Question:** *Is this an Index (hard to fake) or Conventional Signal (cost-stabilized)?*  
  **Sufficient Answer:**  
  - **Index (e.g., raw bank statements, unedited field photos):**  
    - Audit: "What would it take to fake this? How likely is detection?" (e.g., faking bank statements requires bank fraud; high legal risk = hard to fake).  
  - **Conventional Signal (e.g., glossy reports, logic models):**  
    - Audit: "Who *else* demands this signal? What happens if *we* fund it?" (e.g., if local gov’t requires it, cost is already repaid; if only funders want it, rewarding it makes it cheaper to fake over time).  
  **Rule:**  
  - *Fatal* if Index is easily faked with low risk (e.g., unverified PDFs).  
  - *Fatal* if Conventional Signal lacks independent cost sustainers (e.g., only *we* demand it).  
  - *Defeasible* if Index has moderate fakability or Conventional has external enforcers.  

  ---

  ### Gate 5: Burden Assessment  
  **Question:** *Does the cost (a) burn resources, or (b) transfer value? Does it consume the very capacity it signals?*  
  **Sufficient Answer:**  
  - **Burned Cost (e.g., staff time formatting reports):** Certifies "we can afford waste." Weak evidence of program quality; may *erode* capacity.  
  - **Transferred Cost (e.g., matching funds raised locally):** Certifies "we have community buy-in" (if funds come from beneficiaries) or "we have network access" (if from elites).  
  **Rule:**  
  - *Defeasible* for Burned Cost (downweight >50%; only indicates slack resources).  
  - *Defeasible* for Transferred Cost (treat as evidence of *what it transfers from* – e.g., local donations = community support).  

  ---

  ### Gate 6: Audience Leak & Non-Uniform Cost  
  **Question:** *Could this signal be observed by hostile actors (gov’t, competitors, landlords)? Does that raise costs more for high-quality orgs?*  
  **Sufficient Answer:**  
  - **Yes/High Risk:** If signal requires public exposure in hostile areas, high-quality orgs (doing sensitive work) face higher costs (arrest, eviction).  
  - **No/Low Risk:** If signal is private (e.g., internal docs).  
  **Rule:** *Fatal* if cost is *inversely* correlated with quality due to external risk (e.g., requiring public profiles in authoritarian contexts).  

  ---

  ### Gate 7: Countersignaling & Dynamics  
  **Question:** *Could high-quality orgs credibly *avoid* this signal? What happens if we reward this for 3 cycles?*  
  **Sufficient Answer:**  
  - **Countersignaling:** Absence is neutral if the org has: >3 years of major donor funding, public awards, or verified high-impact outcomes.  
  - **Dynamics:** If the signal is easily commoditized (e.g., training workshops on "funders’ logic models"), it will become cheaper and meaningless within 2-3 cycles.  
  **Rule:** *Fatal* if the signal is already commoditized (e.g., every applicant uses the same M&E template). *Defeasible* for absence if countersignaling criteria met.  

  ---

  ### Required Judgments (Values, Not Facts)  
  1. **Application Burden:** "How much net cost (in staff hours/dollars) are we willing to impose on *rejected* applicants?" (Default proposal: Max 2 staff days/$400 per applicant).  
  2. **Error Preference:** "Do we prioritize avoiding false positives (funding frauds) or false negatives (missing gems)?" (Board must decide; shapes downweighting thresholds).  
  3. **Pilot Grants:** "Is this a charitable gift (no strings) or information purchase (require specific signals)?" (Determines Gates 1-7 applicability).  

  ---

  ### Application to Cases  
  **Case 1: Nairobi Youth Org (Polished Narrative, Bank Docs)**  
  - Gate 1: **Fatal.** Flawless English/logic model likely from paid grantwriter (cost-shifted). Bank statements *could* be index, but…  
  - Gate 4: Bank statements are **Index**, but if PDFs are unverified, easily faked (no auditor signature = **Fatal**).  
  - *Verdict: Ignore narrative. Only use reconciled payroll if accountant is verifiable.*  

  **Case 2: No Website vs. Glossy Site**  
  - Gate 1: Glossy site w/comms officer = cost-shifted or high overhead (**Fatal** for signaling program quality).  
  - Gate 7: No website + trusted referral = possible **countersignaling** (if referrer confirms impact). *Verdict: Downweight glossy site; absence neutral if referral strong.*  

  **Case 3: $10k Matching Requirement**  
  - Gate 3: **Net cost = $0** if funds come from other grants.  
  - Gate 5: **Transferred cost.** If raised *locally from beneficiaries*, signals community buy-in (evidence of legitimacy, not program quality).  
  - *Verdict: Evidence of local support, not organizational capacity.*  

  **Case 4: Dedication Filter (Staff Travel to Hub)**  
  - Gate 2: **Perverse currency.** Cost (cash/time) is *lower* for orgs with slack resources/urban bases; *higher* for rural/scrappy high-quality orgs.  
  - Gate 3: **Net cost near zero** if orgs repurpose trip for other funders.  
  - Gate 5: **Burns capacity** (2 staff days lost). Certifies only "has travel budget."  
  - Gate 6: **High audience leak risk** if travel exposes staff to authorities.  
  - Gate 7: **Commoditized** (professionals learn to game interviews).  
  - **What it screens for:** Orgs with expendable cash/staff, low risk aversion, and proximity to hubs. *Inversely* related to grassroots legitimacy.  
  - **Reimbursing travel?** Destroys net cost → **Fatal.**  
  - **Replacement:** Require *unedited* 15-min cellphone video of **beneficiary testimonials** (in local language) + random call verification (**Index**). Cost: <$20.  

  ---

  ### One-Page Field Guide for Board Training  
  **THE 7 GATES: WHAT COUNTS AS EVIDENCE?**  
  1. **WHO & WHY?** Name: (a) Quality we seek, (b) Who made this, (c) Who else cares. *Stop if unclear.*  
  2. **THEIR WORK?** If a *paid outsider* made it (grantwriter, consultant), *ignore* as evidence of *their* quality.  
  3. **HONEST COST?** If the effort *is* the skill we’re testing (e.g., "good systems" proved by complex docs), *stop* – it’s circular.  
  4. **TRUE COST?** Subtract free benefits: skills learned, visibility, sponsor help. If net cost ≤ $0, *ignore*.  
  5. **HARD TO FAKE?**  
     - **Data/Photos:** Could they fake it cheaply? If yes, *stop*.  
     - **Reports/Models:** Do *other* groups (gov’t, locals) demand this? If no, *ignore*.  
  6. **WHO PAYS?**  
     - **Burned (time/cash):** *Weak* evidence (just shows spare resources).  
     - **Transferred (e.g., local fundraising):** *Medium* evidence (shows community trust).  
  7. **SAFE FOR THEM?** If going public risks them (gov’t, landlords), *stop* – it may select *against* good orgs.  

  **WHEN ABSENCE IS OK:** Orgs with proven track record (other funders, awards) can skip some steps.  

  **WHAT WE IGNORE:**  
  - Polished English narratives from groups without English speakers.  
  - Glossy websites unless made in-house.  
  - Requirements that cost rural groups more than urban.  
  - Signals everyone now fakes (e.g., generic "theories of change").  

  ---

  ### What This Procedure Cannot Do  
  1. **Detect True Fraud:** Collusion, forged indexes, or shell NGOs with perfect signals.  
  2. **Capture Tacit Excellence:** Superb implementers who lack signals (e.g., oral cultures).  
  3. **Override Power Asymmetry:** Orgs in "funding deserts" lack resources to signal.  
  4. **Read Broken Equilibria:** Where all local orgs mimic a dominant funder’s preferences (e.g., everyone uses DfID’s M&E templates).  
  5. **Value Judgment:** Cannot decide:  
     - How much burden is ethical.  
     - Whether to risk funding a fraud to avoid missing a gem.  
     - If local legitimacy outweighs managerial weakness.  
  6. **Predict Impact:** Signals certify *inputs/capacities*, not outcomes.  
  7. **Adapt Automatically:** Signals decay as they are rewarded; manual review of "what’s gamed now" is essential annually.  

  **Final Note:** This procedure reduces reliance on *arbitrary* signals but cannot eliminate uncertainty. The most defensible grants will marry *indexes* (hard data) with *transferred costs* (community investments) while minimizing burned costs. Abandoning the dedication filter is non-negotiable; replace it with verifiable beneficiary voices.
