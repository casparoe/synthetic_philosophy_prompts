  3.  **Third-person method adjudicates phenomenality (Credence: ~20%):** Heterophenomenology fundamentally *cannot* settle phenomenal consciousness (qualia) in principle; it describes behavioral dispositions and reported beliefs *about* experience, but the hard problem suggests the intrinsic "what-it's-like" aspect is methodologically inaccessible to third-person science by design.  
