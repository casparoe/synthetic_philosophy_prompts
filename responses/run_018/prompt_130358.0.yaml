answer: |-
  The air in the negotiation chamber hummed with the low thrum of the Chronos Array. Not the sound of the machine itself, buried deep below the Lunar Accord Complex, but the omnipresent vibration of its *output*. Reams of paper, impossibly thin yet startlingly crisp, flowed from discreet slots along the walls, piling in designated bins like discarded drafts of reality. White for Actualized Timelines (ATs), yellow for Discarded Potential Timelines (DPTs). To Ambassador Elara Vance, it smelled like ozone and desperation.

  Across the obsidian table, Commander Varek of the Martian Freehold Command glared, his fingers drumming a silent war march. His own stack of DPTs, thick with scenarios ending in Martian triumph, sat untouched. Elara’s team had spent days sifting ATs, searching for the single, slender thread where peace held. They’d found it: AT-7G-334. Signed Treaty. Ceasefire holds. Reconstruction begins. It lay before her, pristine white.

  "We are running out of time, Ambassador," Varek growled. "Your prevarications stink of Terran deceit. The Freehold will not be strung along while your fleets mobilize!"

  Elara took a steadying breath. She needed him to *see* AT-7G-334, to understand its inevitability. She gestured towards the critical document. "Commander, please. Look at the data. **If we sign the treaty today,**" she tapped the white sheet emphatically, "**the war stops.** Completely. Irrevocably. The suffering ends *here*." She was pointing directly at AT-7G-334, reading its indicative truth: *Given the signing, cessation follows.* This was the future the machine predicted would unfold.

  But Varek’s eyes flickered past the white sheet she indicated. They landed on a nearby bin overflowing with yellow DPTs – the shredded dreams of might-have-beens. His gaze snagged on one lurid scenario spilling over the edge: DPT-7F-998. *Treaty Signed (False Flag). Terran First Fleet launches surprise attack during signing ceremony. Freehold annihilated.* The yellow paper screamed betrayal.

  Varek’s face drained of blood, then flooded with fury. He slammed his fist on the table. "*If we sign the treaty, the war stops*?!" he roared, his voice trembling. "Is that your *assurance*, Ambassador? Or is it a *threat*? Are you pointing to our surrender... or your *trap*?" He snatched up DPT-7F-998, the yellow paper crinkling violently in his grasp. "Is *this* the 'stop' you envision? My fleet reduced to slag *because* we lower our guard?"

  The room froze. Elara’s aides stiffened. Varek’s security detail subtly shifted stance, hands drifting towards concealed weapons. Panic clawed at Elara’s throat. The ambiguity she hadn't considered – the terrifying flexibility of the conditional in this room choked with proof of all possibilities.

  *He thinks I’m using a counterfactual,* she realized with horror. *He thinks ‘if we sign’ points to this discarded horror on yellow paper, a hypothetical betrayal, not the white actuality before me.* Grammar had become a landmine.

  "Commander, no!" Elara cried, shoving the *white* AT-7G-334 towards him, her voice cracking. "This one! The *actual* timeline! **If we sign the treaty** – meaning *when* we sign it, in *this* sequence of events," she stabbed her finger onto the white sheet, "**the war stops.** It is *certain*. Look! The Array prints it *white*! It is happening! DPT-7F-998 is *discarded*. It’s yellow! It *didn’t* happen! That ‘if’ is dead paper!"

  Varek stared, wild-eyed, from the white sheet she desperately held up to the yellow nightmare crumpled in his own fist. The distinction between the indicative certainty (signing *will* cause peace) and the counterfactual horror (signing *would have* caused annihilation... in a different, discarded chain of events) hung in the ozone-scented air. His finger hovered over the comm-link on his wrist – a single tap would scramble the Freehold's preemptive strike drones.

  "The white sheet," Elara whispered, her voice raw. "Only the white sheet is real now. The 'if' points to *this* future. The yellow is... grammar. A dead branch. Please."

  Slowly, agonizingly, Varek lowered the yellow DPT. He looked at AT-7G-334, then at Elara’s face, pale but resolute. The tension didn't vanish, but the immediate, grammar-induced trigger finger relaxed. He released the yellow paper, letting it flutter back to the bin of discarded might-have-beens.

  "Explain it again," he rasped, his eyes never leaving the white sheet. "Explain this... indicative certainty. Slowly. And keep that damned yellow bin away from me."

  Elara breathed. The war hadn’t stopped yet. But the preemptive strike triggered by a misunderstood conditional clause had, barely, been averted. The Chronos Array hummed on, printing the fragile future one unambiguous, white sheet at a time.
