  I was chatting with my flatmate last night about Schrödinger — apparently he was deeply into Vedanta and convinced that individual minds aren't really seperate entities but just local expressions of one universal consciousness, like waves on the same ocean. I'm trying to write a short essay for my philosophy of mind course and I'm stuck on how this view holds up against things that only came up after he died.

  Specificaly, I'd like to know: if Schrödinger were alive today and read about predictive-processing accounts that treat consciousness as a hierachical inference process with no central observer, how do you think he'd interpret that? Would he say the 'observer' is still there as the universal mind filtering through the brain, or that predictive coding actually proves consciousness can be chopped into pieces? And what about modern split-brain studies where each hemisphere builds its own story — would he see that as a real fracture in the one consciousness, or just a functional illusion? Please answer in British English, keep it conceptual rather than historical, and don't bother with a bibliography or citations since I just want to understand the reasoning.
