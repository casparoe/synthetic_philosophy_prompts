  - Whether algorithms are *worse* than newspapers because they're addictive and personalized 
  - If "digital asceticism" (quitting metrics) is the modern leap of faith 

  *checks count* That's 8-9 territory. Follow-ups must anticipate her answers: she'll likely say platforms profit from responsibility diffusion, deny pure online community authenticity, and reframe belonging as Kierkegaardian "distraction". Push her to concede edge cases. 

