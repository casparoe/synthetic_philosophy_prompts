  2.  **Rotation:** Follows the traditional sestina pattern. Stanza 1: `speck` (isolated), `torture`, `threshold`, `sum`, `pain`, `ignite`. Subsequent stanzas rotate the end-words: last word of previous stanza becomes first of the next, preserving order otherwise.
