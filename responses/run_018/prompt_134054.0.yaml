  First, I need to map the exact conflict: If we reject universality (say, embracing cultural relativism), cross-cultural understanding becomes impossible. If we enforce universality strictly, we risk epistemic violence against neurodivergent or non-Western thinkers. The user wants a definitive stance, not a survey of options.

  Hmm... the key might lie in untangling descriptive from normative claims. Ascription universality often smuggles in normative assumptions—like equating rationality with deductive logic—which is where dominance creeps in. But what if we separate the minimal conditions for interpreting *any* minded being (descriptive) from culture-specific ideals of rationality (normative)? 

  For example, Davidson's principle of charity isn't about imposing *our* rationality but finding *some* coherent pattern in behavior to even recognize beliefs. That's descriptive universality: without assuming basic consistency, we couldn't identify divergence as *meaningful* rather than noise. But this doesn't dictate *what counts* as coherent—a Hopi time concept or autistic sensory-based "beliefs" could have their own logical fabric. 

  The dominance critique rightly targets normativity—e.g., labeling oral traditions "illogical" for not privileging textual analysis. But rejecting *all* universality to avoid this throws out the baby with the bathwater. Without a floor of shared interpretability, we couldn't even critique dominance across traditions; the critic's own voice would be just another local fragment. 

  So the solution isn't abandoning universality but *redefining* it as a bare scaffold for mutual engagement: 
  - Descriptive: To attribute beliefs, we must project *some* pattern of consistency onto others (universal condition for interpretation). 
  - Normative: No single tradition owns the template for what consistency looks like (anti-dominance). 

  This preserves cross-cultural dialogue while making room for plural rationalities. The cost of *not* doing this? Either solipsistic incommensurability or intellectual imperialism. Neither is tolerable. 

