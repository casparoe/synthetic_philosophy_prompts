prompt: |-
  so im not any kind of academic. I ended up being the person in my tenants union who reads the housing authoritys paperwork and explains it at meetings, and ive been chewing on one thing for a while and nobody i know can help me with it.

  Our city has a single waitlist for subsidized apartments, and they rank everyone on it with a number from 0 to 100 that they call a need score. Higher means you get housed sooner. The score is built out of things like how many different addresses youve had in three years, whether youve had a utility shutoff, eviction filings, whether theres someone over 65 in the household, and so on. It does not ask your race, your religion, or what country you were born in, and the authority is genuinely proud of that; at every meeting someone says the computer doesnt know what colour anybody is.

  But then, other things about the same setup:

  - The software company publishes a report showing the score predicts who actually ends up homeless about equally well within every group they checked, and the authority points at that as the proof the thing is fair.
  - There are carve-outs. Veterans get a fixed number of the apartments off the top. Survivors of domestic violence skip the line. Theres a separate list for people already in a shelter.
  - If you get skipped over and you think its wrong you can appeal, and at the appeal they have to give you a reason about you. They cant say the computer said so, and they cant say people in your situation usually do badly. But when we ask them to defend the score in public, all we ever get is group averages.
  - They also insist the score is not a decision, its just a ranking. The number of apartments is fixed by the budget, so who gets one is settled by where you sit in the order, but they talk as if ordering people and deciding who gets housed are two seperate steps.

  Heres what I keep going round on. Why do they think group membership is fine in one place and not in another? They wont let the model look at it directly, but they will hand out apartments by group, and they do check their accuracy group by group. So they clearly dont think it never matters. Whats the actual rule theyre using, in their own terms?

  Three things I made up while thinking about it, in case theyre useful:

  1. I call it borrowed accuracy. My score goes up if ive moved house a lot, and it goes up partly because other people who moved house a lot ended up homeless. So the number is telling me something about myself using facts about other people who resemble me on paper. It just comes in the back door instead of the front. Does the setup secretly assume this is ok? And if it does, is that different in kind from just asking someones race, or only different in how visible it is?

  2. Everything in the score is something that leaves a paper trail. Someone whose life is a mess in ways nobody ever wrote down scores low, and everybody at our meetings has met that person. It feels like the practice assumes being easy to read is worth something, not exactly that you deserve it, but that its fair for it to pay off. Is that a commitment the practice really has, or just an accident of what data exists?

  3. I proposed a fix I call lottery at the margin: wherever the scores error bars overlap, stop pretending and flip a coin instead of acting on a two point difference. People pushed back in opposite directions. Half said obviously fairer. The other half said spending a home on a coin flip insults the person who loses. What does that split tell me about what the current practice assumes?

  Last thing. Somebody told me there is a maths result here, and as i understand it, it says you cant have all of these at once: that the same score means the same real chance of the bad outcome no matter what group youre in; that the rate of wrongly calling someone urgent is the same across groups; that the rate of wrongly missing someone is the same across groups. Not unless the groups really are the same in the relevant way, or the score is perfect. Our authority seems to want all three of those plus the colourblindness. So: is the practice committed to something impossible, or is one of those four not something it actually needs?

  What I want from you is this. What does this whole arrangement presuppose about what fairness even is? Not the marketing version, but what somebody would have to believe for all these moves to make sense together, and which rival ideas of fairness the setup quietly rules out. Tell me which parts theyre strictly stuck with and which are just habits that happen to fit the theory, so several theories would let them keep it. And tell me concretely what would have to change if we swapped the implicit theory for a different one, say the view that the point is to get the apartments to whoever is worst off, accuracy be damned.

  Please just argue it out. Dont send me looking for papers or books, i cant get to a university library and I want the reasoning, not a reading list.
reasoning: |-
  Okay, let me try to unpack what this tenant union member is really asking. They're deep in the trenches of housing advocacy, trying to make sense of a system that claims fairness while showing contradictions. 

  First, I notice their frustration isn't just about technical details—it's about the authority's philosophical inconsistencies. They point out the system avoids race/religion/nationality directly but uses proxies that might correlate with those. The authority brags about "the computer not knowing color," yet uses group-based carve-outs and audits accuracy by group. That cognitive dissonance is the core tension.

  Hmm... the "borrowed accuracy" concept they invented is sharp. When your moving history affects your score because others with similar patterns became homeless, that's group inference wearing individual clothing. The authority denies using group data while relying on it indirectly. That smells like statistical hypocrisy.

  The paper trail observation hits hard too. By rewarding documented hardship, the system inherently favors those who interacted with systems (landlords, courts, utilities)—which often means punishing the most marginalized who avoid systems due to distrust or barriers. That's not neutral; it's baked-in bias toward "legible" poverty.

  Their lottery-at-the-margin idea reveals a deeper conflict: is fairness about precision or humility? Critics calling coin flips "insulting" imply the current scoring pretends false precision. That suggests the system's real commitment isn't accuracy—it's the appearance of objectivity to avoid accountability.

  Ah, and they've stumbled onto impossibility theorems without knowing it! The authority wants:
  - Predictive parity (same score = same risk across groups)
  - Equal false positive rates
  - Equal false negative rates
  ...plus "colorblindness." But as they sensed, you can't have all three unless groups are identical or the model perfect. Someone smart tipped them off about fairness impossibility results. The authority is literally demanding mathematical magic.

  What's beneath this? The setup presupposes fairness means:
  1. Procedural objectivity (if inputs are "neutral," outputs are fair)
  2. Efficiency-focused (prioritize those most likely to become homeless)
  3. Meritocratic (hardship must be documented/verified)
  4. Group-blind individualism (groups don't matter if we don't name them)

  But this clashes with:
  - Substantive fairness (outcomes matter more than process)
  - Structural analysis (acknowledging systemic disadvantages)
  - Epistemic justice (valuing lived experience over bureaucracy)

  If they switched to a "worst off first" approach, everything changes:
  - Scores become irrelevant; need evidence replaces prediction
  - Carve-outs expand (explicitly prioritize marginalized groups)
  - Appeals shift from "your score is wrong" to "your hardship is unseen"
  - Data collection focuses on barriers, not just outcomes

  The habits they could keep? Carve-outs (already group-based) and appeals. The stuck parts? Pretending scores aren't decisions, and avoiding group data. Because once you admit group disadvantages exist, "colorblind" scoring looks naive at best, harmful at worst.

  This tenant gets it. They're calling out the system's unstated religion: that if you ignore structural inequality hard enough, your model becomes neutral. But as they've seen, refusing to see color doesn't make bias disappear—it just hides it in moving records and utility shutoffs.
answer: |-
  You've hit on profound contradictions at the heart of this system. Here's the implicit theory of fairness driving the housing authority's setup, why it creates tension, and what changes if we swap it for a "worst off first" approach:

  ### The Authority's Unspoken Assumptions About Fairness
  1. **"Fairness is Statistical Parity in Prediction"**:  
     They believe a tool is fair if it predicts homelessness *equally accurately* across groups (e.g., same AUC score for all races). This lets them claim "colorblindness" because the model *inputs* exclude race. But by validating group-level accuracy, they tacitly admit group differences exist. Their rule: **Group membership matters for auditing fairness, but not for decisions**.  

  2. **"Fairness is Procedural, Not Substantive"**:  
     Appeals must reference individual facts because they see fairness as *process*: "We treated *you* based on *your* data." But the score itself relies on *group patterns* (e.g., "people with 4 moves in 3 years are 20% more likely to become homeless"). Their contradiction: **Group data is forbidden for individuals but used to build/validate the system**.  

  3. **"Efficiency Justifies Borrowed Accuracy"**:  
     Yes, your "borrowed accuracy" point is core to their model. They assume it’s ethically distinct from using race because:  
     - The proxies (evictions, moves) are "choice-neutral" (you can’t control your age or a utility shutoff).  
     - They’re "verifiable" (your paper trail critique).  
     But this ignores that marginalized groups face systemic biases in eviction filings, credit checks, or address changes (e.g., racial discrimination in housing). **The system rewards "legible" hardship**, punishing those who suffer off-record.  

  4. **"The Score Isn’t a Decision, It’s Science"**:  
     Claiming the score "just ranks" hides that *ranking is deciding* when resources are scarce. This lets them deflect blame: "The computer didn’t deny housing; the budget did." But by appealing to "accuracy" in public, they’re using group statistics to justify individual outcomes.  

  ### Why the System is Logically Stuck
  - **The Impossibility Theorem You Mentioned**: Yes, it’s likely referring to **fairness impossibility results** (e.g., Kleinberg, Chouldechova). Simplified:  
    > You *cannot* simultaneously have:  
    > (a) **Predictive parity** (same score = same homelessness risk for all groups),  
    > (b) **Equal false positive rates** (same % of non-urgent cases mistakenly called urgent),  
    > (c) **Equal false negative rates** (same % of urgent cases missed),  
    > ...unless all groups have identical homelessness rates *or* the model is perfect.  
    The authority wants (a) (their "accuracy equality"), (b) (fairness in who gets priority), and (c) (fairness in who gets overlooked) – plus colorblindness. **This is mathematically impossible** in an unequal society. They’re forced to prioritize one fairness metric while hiding trade-offs.  

  - **The Lottery-at-the-Margin Split**:  
    - **"Obvious fairer" side**: Understands that tiny score differences are noise, not merit. Rejects false precision.  
    - **"Insults the loser" side**: Believes scores reflect "deservedness." If you lose a coin flip, it’s "bad luck"; if you lose on a score, it’s "you weren’t needy enough."  
    **This reveals their core presupposition: The score encodes desert.**  

  ### What Would Change Under a "Worst Off First" Theory
  If fairness means **prioritizing the most vulnerable, even inaccurately**:  
  1. **Ditch the Prediction Model**: Stop scoring "risk of future homelessness." Instead, **directly measure current suffering**:  
     - Days without shelter, health crises, hunger, exposure to violence.  
     - *Requires qualitative evidence* (e.g., social worker assessments), not just paper trails.  

  2. **Explicit Group-Based Redress**:  
     - Carve-outs expand: Prioritize groups *known* to face systemic bias (e.g., racial minorities, disabled). No more "colorblindness."  
     - Accept that groups experience hardship differently (e.g., domestic violence survivors need different support than veterans).  

  3. **Appeals Revolutionized**:  
     - Appeals focus on *unseen hardship*, not data errors. "The model missed my chronic illness because I couldn’t pay medical bills" becomes valid.  

  4. **Trade Accuracy for Equity**:  
     - Homelessness prediction might decline, but **you’d house people in deepest crisis now**, even if others "statistically" deserve it more.  

  ### What They’re Stuck With vs. What’s Habit
  - **Stuck With**:  
    - **Impossibility trade-offs**: They *must* fail one fairness metric. Currently, they sacrifice equal false negatives (e.g., missing marginalized groups) for "colorblind" predictive parity.  
    - **Borrowed accuracy**: All predictive models do this. You can’t avoid "people like you" patterns.  

  - **Just Habits**:  
    - **Paper trails as proxies**: They could collect better data (e.g., community referrals).  
    - **"Score vs. decision" fiction**: They could admit ranking *is* deciding.  
    - **Group audits**: They *choose* to validate by group; this isn’t forced by tech.  

  ### Bottom Line
  **Their fairness theory is "We maximize lives saved using objective data."** It assumes:  
  - Homelessness risk is measurable via administrative records.  
  - Efficiency (preventing future harm) trumps current suffering.  
  - Avoiding group data prevents bias (ironically, embedding it in proxies).  

  **A "worst off first" theory assumes: Justice requires repairing deepest disadvantage first, even if inefficient.** This rejects prediction, embraces group-specific redress, and values lived experience over data legibility.  

  The conflict isn’t just technical—it’s about whether fairness means **treating everyone the same by the rules** or **acknowledging that the rules themselves aren’t neutral**. Your housing authority is clinging to the first while the cracks in their system scream the second.
