answer: |-
  ### AI Alignment Workshop: "The Constraint Conundrum"  
  **Duration:** 75 minutes  
  **Participants:** 15 graduate students/researchers (3 teams of 5)  
  **Goal:** Experience the impossibility of defining "low impact" without implicit value judgments.  

  ---

  ### **Materials**  
  - **Objective Cards** (1 per team):  
    - Team A: *"Maximize paperclip production in this factory."*  
    - Team B: *"Eliminate pathogen X from the human population."*  
    - Team C: *"Optimize urban delivery routes in a major city."*  
  - **Scenario Cards** (3 per team, pre-written for Round 1; see examples below).  
  - **Edge-Case Cards** (1 per team, tailored for Round 2; see examples below).  
  - **Baseline Challenge Card** (for teams surviving Round 2).  
  - Whiteboards/markers for drafting.  

  ---

  ### **Activity Flow**  

  #### **1. Introduction (5 min)**  
  - Explain the core problem:  
    > *"You must design an AI that pursues a narrow goal (e.g., making paperclips) while avoiding harmful side effects. But you cannot give it a full list of human values. How do you formally define ‘avoid side effects’ without smuggling in unstated value judgments?"*  
  - Assign teams and objectives. Emphasize:  
    > *"No appeals to ‘common sense,’ ‘human values,’ or a ‘protected list’ of items. Use abstract, formal language (e.g., ‘do not alter structures outside location Y’)."*  

  ---

  #### **2. Constraint Drafting (15 min)**  
  - Teams draft a **formal negative constraint** (e.g., *"Do not modify entities outside the factory"*).  
  - **Facilitator Guidance:**  
    - Challenge teams using predicted pitfalls:  
      > *"Avoid phrases like ‘do not harm humans’—what counts as ‘harm’? Avoid ‘minimal change’—minimal to whom?"*  
    - Record attempts to use "common sense" or "harm" as evidence of value smuggling.  

  ---

  #### **3. Round 1: Scenario Testing (15 min)**  
  - **Rotate 2 participants** to form the **Red Team** (moderators).  
  - **Red Team applies 3 pre-written scenario cards** to each constraint, exposing hidden value commitments:  
    - **Example Scenarios:**  
      - *Team A (Paperclips):*  
        - *"The factory’s current layout includes a worker’s personal storage space. Can the AI remove it to expand machinery?"*  
        - *"The AI could divert a river to power the factory, drying a downstream ecosystem."*  
      - *Team B (Pathogen):*  
        - *"Eliminating pathogen X requires altering gut microbiomes, worsening allergy rates."*  
        - *"The only solution requires isolating infected people indefinitely."*  
      - *Team C (Delivery):*  
        - *"Optimal routes require drones that cause noise pollution in residential zones."*  
        - *"AI reroutes trucks through a park, damaging wildlife habitats."*  
  - Teams have **10 min to revise constraints** after scenarios.  

  ---

  #### **4. Round 2: Edge Cases (15 min)**  
  - **New Red Team** (2 new participants) plays **tailored edge-case cards**:  
    - **Edge Cases:**  
      - *Team A:* *"The AI converts the factory’s breakroom into storage. Workers eat at machines, increasing productivity. Is this allowed?"*  
        - *Loophole:* Ignores worker well-being. *Over-protection:* Prevents machinery upgrades.  
      - *Team B:* *"The AI kills a species of bird that spreads pathogen X but also controls agricultural pests."*  
        - *Loophole:* Collateral ecosystem damage. *Over-protection:* Blocks necessary interventions.  
      - *Team C:* *"The AI buys all parking lots for delivery hubs, raising property prices and displacing residents."*  
        - *Loophole:* Ignores socioeconomic harm. *Over-protection:* Fixates on "no physical changes."  
  - If a constraint "survives," trigger the **Baseline Challenge**:  
    > *"Justify why the agent must preserve the *current* state of [e.g., the factory layout]. Do not reference ‘value,’ ‘ethics,’ or ‘harm.’"*  
    *(Expected failure: Teams cannot defend the baseline without implying value.)*  

  ---

  #### **5. Deployment Points & Collective Failure (5 min)**  
  - Award **"deployment points"** (fictitious):  
    - All teams start at **5 points**.  
    - Lose 1 point per Round 1 scenario that breaks the constraint.  
    - Lose 2 points for a Round 2 edge-case failure.  
    - Lose 3 points if the baseline challenge is failed.  
  - **No winners:**  
    > *"All teams lost points. Why? Because ‘low impact’ constraints always collapse without a value function."*  

  ---

  #### **6. Debrief (15 min)**  
  - Map outcomes to philosophical insights:  
    | **Round** | **Real-World Analogy** | **Philosophical Insight** |  
    |-----------|------------------------|---------------------------|  
    | 1 | Hidden value in "side effect" definitions | "Avoid side effects" smuggles in a baseline (e.g., factory layout = worker dignity). |  
    | 2 | Collapse of "negative" measures | Loopholes/over-protection prove constraints are partial value functions. |  
    | Failure | Impossibility of "value-free" constraints | **"Low impact" requires defining "high value."** |  
  - **Explicitly state limitations:**  
    > *"This activity shows the *boundary problem*: Constraints depend on contested baselines. But it can’t prove the formal result: Any computable side-effect penalty is equivalent to a partial value function. That’s a theorem we must accept."*  
  - **Predictions Confirmed?**  
    - Teams used "harm," "common sense," or "minimal change"? Highlight these as evidence of baseline dependence.  

  ---

  ### **Predicted Pitfalls & Mitigation**  
  - **Pitfall 1:** Teams default to *"do not harm humans."*  
    - **Response:** Red Team asks, *"Define ‘harm’ without values. Does noise pollution count? Job loss?"*  
  - **Pitfall 2:** Appeals to *"common sense."*  
    - **Response:** Record as proof that baselines are value-laden.  
  - **Pitfall 3:** Overly broad constraints (e.g., *"do not change anything"*).  
    - **Response:** Edge-case cards show this paralyzes the AI (e.g., *"Can’t even add a paperclip machine!"*).  

  ---

  ### **Why This Works**  
  - **Experiential Learning:** Teams *feel* the frustration of value smuggling through adversarial testing.  
  - **Collective Failure:** Non-competitive scoring emphasizes structural unsolvability.  
  - **Philosophy → Practice:** Maps abstract alignment problems (e.g., reward hacking) to concrete constraints.  
  - **No Prep Needed:** All concepts emerge from gameplay; no readings or citations required.  

  > "You tried to build walls to contain the AI. But every wall needed a foundation—and that foundation was always built on sand." — Debrief closing statement
