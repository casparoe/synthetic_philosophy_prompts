answer: |-
  ## Proposal: The Uncharted Paths of Moral Progress: A Counterfactual Inquiry into the Historical Contingency of the Expanding Circle Model

  **Abstract:** This project challenges the assumed inevitability of the "expanding circle" model as the dominant framework for understanding moral progress. It employs counterfactual conceptual genealogy to investigate whether 19th-century moral reformers (e.g., abolitionists) deploying arguments grounded in "nested loyalty" (prioritizing proximate obligations, extending outward gradually based on proximity/reciprocity) instead of universal human rights, could have yielded a fundamentally different, path-dependent architecture for modern ethics – one characterized by layered obligations of varying "thickness" rather than a flattened universalism. The project assesses the plausibility, stability, and distinct structural implications of this alternative path, evaluating the historical contingency of our current moral paradigm.

  **1. Core Research Question:** Is the dominant "expanding circle" model of moral progress (characterized by the gradual, universal flattening of moral concern) an inevitable outcome of historical moral advancement, or is it a contingent artifact of specific historical framing choices? Specifically, could a counterfactual historical path where 19th-century reformers championed core causes (like abolition) using "nested loyalty" arguments have resulted in a stable, modern ethical architecture prioritizing *layered* obligations over *universal* flattening?

  **2. Background & Gap:** The "expanding circle" metaphor (famously articulated by Singer, tracing back to ideas in intellectual history) powerfully describes the historical trajectory of widening moral concern from kin and tribe to nation, humanity, and beyond. Scholarship on moral progress often narrates this expansion (e.g., Pinker, Appiah) and intellectual history traces the development of universalist concepts like human rights (e.g., Hunt, Moyn). Path dependence is increasingly recognized in institutional and technological history, and tentatively explored in moral concepts (e.g., work on the contingency of human rights frameworks).

  However, a critical gap persists: **existing work primarily *describes* the actual historical path of the circle's expansion or traces the *genesis* of universalism. It rarely rigorously tests the *counterfactual stability* of the expanding circle *model itself* by constructing plausible alternative historical framings and simulating their downstream conceptual consequences.** Did the specific *rhetorical and conceptual framing* chosen by key historical actors (particularly in the pivotal 19th century) lock us into the universalist-flattening path, or is the circle-shape itself a deeper, more resilient structure that would have emerged regardless of framing? This project directly addresses this gap by constructing and analyzing a counterfactual framing ("nested loyalty") to probe the contingency of the expanding circle's defining feature: its tendency towards universal moral flattening.

  **3. Method: Counterfactual Conceptual Genealogy:** This project utilizes a three-phase conceptual methodology:

  *   **Phase 1: Counterfactual Framing Construction:** Systematically construct a plausible "nested loyalty" alternative to the historical universalist framing used by 19th-century reformers. This involves:
      *   Identifying core principles: Prioritization of immediate kin/community ("thick" obligations), extension based on relational proximity (geographic, social, functional reciprocity), gradualism in moral expansion, potential limits to full flattening.
      *   Grounding in historical sentiment: Drawing on existing historical critiques of radical universalism (e.g., Burkean conservatism, communitarian strands) and real-world moral psychology emphasizing kin preference and reciprocity, to ensure the counterfactual framing is conceptually coherent and historically *plausible*, even if not dominant.
      *   Articulating key arguments: How might abolition, for instance, be framed not as violating universal rights, but as a failure of reciprocal obligation within a system, or an unsustainable disruption of nested social hierarchies requiring reform *within* a loyalty structure?

  *   **Phase 2: Structural Implication Tracing:** Model the conceptual trajectory of modern ethics (mid-20th century to present) assuming the "nested loyalty" framing became the dominant paradigm post-19th century. Key questions:
      *   How would this framing shape core concepts: human rights, justice (distributive, corrective), global obligations, animal ethics, environmental ethics?
      *   Would concepts like "universal human dignity" emerge, or remain subsidiary to context-dependent obligations? Would moral concern exhibit a "gradient" rather than a binary (in/out of circle)?
      *   How would it handle challenges like globalization, mass migration, or climate change – demanding solutions potentially at odds with proximity/reciprocity?
      *   Compare this implied "layered architecture" structurally to the actual "flattened circle" model.

  *   **Phase 3: Comparative Stability Assessment:** Critically evaluate the relative stability and resilience of both models (actual expanding circle vs. counterfactual layered architecture) against conceptual challenges:
      *   Internal coherence: Are there inherent contradictions within the nested model under modern conditions?
      *   Parsimony/explanatory power: Does it explain persistent moral intuitions about special obligations better or worse?
      *   Motivational force: Is it more or less likely to inspire broad moral action, especially for distant others?
      *   Adaptability: Can it evolve to meet new moral challenges without collapsing into universalism or regressive particularism?

  **4. Project Scope & Constraints:** This is a three-month, primarily conceptual investigation. It will **not** involve original archival research, quantitative analysis, or extensive engagement with contemporary empirical moral psychology beyond foundational concepts. The focus is on rigorous thought experimentation, conceptual modeling, and structural comparison within the history of ideas and moral philosophy.

  **5. Defining Outcomes & Failure:**

  *   **Positive Result:** Demonstrating that the "nested loyalty" counterfactual is robust enough to generate a conceptually distinct, stable, and plausible alternative moral architecture ("layered obligations") that *structurally differs* from the universal-flattening expanding circle in significant ways. This would strongly suggest the historical contingency of the flattening tendency.
  *   **Null Result:** Finding that the "nested loyalty" framing either (a) inevitably collapses into a version of the expanding circle under pressure of modern conditions (suggesting the circle's shape/resilience is deeper than the framing), or (b) is too conceptually underdetermined or unstable to generate a coherent alternative architecture distinct from either universalism or regressive tribalism. This would suggest the expanding circle model, particularly its flattening drive, possesses significant path-independent robustness.
  *   **Failure Condition:** The primary risk is **conceptual underdetermination** – if the constructed "nested loyalty" counterfactual proves too vague, incoherent, or incapable of yielding clear structural implications different from the expanding circle, preventing meaningful comparison. Success hinges on constructing a sufficiently rich and distinct alternative model.

  **6. Deliverables:**
  1.  **Working Paper (c. 6000 words):** Presenting the full counterfactual model, its construction, the traced implications for modern ethics, the comparative stability analysis, and the argument regarding the historical contingency (or not) of the expanding circle's flattening tendency.
  2.  **Policy/Intervention Brief (c. 1000 words):** Summarizing the core findings for a non-specialist audience, focusing on the implications for designing interventions aimed at moral progress. If the circle's flattening is contingent, what framings might be more effective? If robust, what are its inherent limitations? This translates conceptual insights into practical considerations.

  This project offers a novel lens on moral progress by rigorously probing the contingency of its dominant model. By asking "could ethics have looked fundamentally different?" it moves beyond description to actively test the historical and conceptual foundations of our current moral imagination.
