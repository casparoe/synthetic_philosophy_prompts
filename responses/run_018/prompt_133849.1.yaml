answer: |-
  Here's the core tension, then the details:

  **Bottom line:** Neurath's physicalism demands that ISOTYPE pictograms strictly reduce to observable physical facts (protocol sentences), but this undermines their required function as universal, theory-neutral symbols capable of conveying abstract concepts and relations across different conceptual frameworks.

  **The Weeds:** If ISOTYPE symbols are *only* direct visual equivalents of protocol sentences (e.g., a "worker" pictogram *just* means "this specific observed human shape performing this specific observed labor motion at time T"), they become useless for universal communication – they're tied to specific observations, incapable of representing general concepts (like "labor force" or "unemployment") or complex relations ("trade imbalance") needed for cross-theory understanding. However, if the pictograms *do* successfully convey these abstract or relational concepts universally, they *must* carry meaning beyond the sum of observable physical facts (e.g., the *relation* between "export" and "import" pictograms signifies an economic imbalance, a concept not reducible to a single physical observation). This smuggles in non-physical, theory-laden content (the meaning of the relation itself) that Neurath's strict reductionist physicalism explicitly forbids. The pictograms cannot be both purely physicalist *and* genuinely universal/abstract.
