  ok so heres a quirk in copyright law i keep thinking about: in a lot of european regimes you can claim moral-rights protection (like against distortion) for music with lyrics or explicit programatic content, but pure instrumental or ambient stuff gets filed under "sound design" or functional audio with way weaker protections. The reasoning is usually that representational art carries the artist's personal vision, while abstract sound is just craft.

  But Schopenhauer said music is actually the opposite—its not representational art at all, its the direct objectification of the Will, with melody tracking striving and harmony tracking satisfaction/dissonance. So what commitments does that legal split presuppose? Does it silently assume music is essentially communicative or representational? Or could a Schopenhaurian say the split accidentally tracks his hierarchy, since melody-less drones (pure harmony) really are closer to the Will's blind ground?

  I want to know if the law is doing bad Schopenhauerian metaphysics, or running on a totally different ontology. And please push back hard if im conflating legal doctrine with aesthetics—if the premise is confused just say so rather than playing along.
