answer: |-
  ### Teleosemantic Content Determination Procedure  
  *For assessing whether a neural network representation carries genuine content about a target feature (e.g., "horizontal edge orientation," "deceptive intent")*  
  **Time limit:** 15 minutes. **Senior sign-off required** for value-laden judgments.  

  ---

  #### **Key Conceptual Simplifications**  
  *Preserve these distinctions to avoid distorting teleosemantics:*  
  1. **Selection history vs. accidental correlation**: Content requires historical selection *for a function*, not just statistical correlation.  
  2. **Consumer mechanisms**: Content exists only if downstream components *use* the representation to perform a task.  
  3. **Misrepresentation possibility**: Genuine content must allow for tokening when the target is absent (error states).  

  *Safe to drop for brevity (minimal distortion):*  
  1. **Original vs. derived content**: Drop if operational detection is infeasible (flag as "unsettled").  
  2. **Fine-grained content specificity**: Avoid debates about exact content boundaries (e.g., "edge at 89° vs. 90°").  

  ---

  #### **Decision Procedure Checklist**  
  *Apply sequentially. Stop early if criteria fail. Target feature must be specified upfront (e.g., "horizontal edges," "deceptive intent").*  

  1. **Selection History**  
     - *Question:* Was this representation *directly shaped* by the training process to improve performance on a specific task?  
     - *Evidence required:*  
       - Ablation/mutation of the representation degrades performance on the original training task.  
       - Representation emerges/refines during training (e.g., via activation clustering across epochs).  
     - *Stop if:* No performance degradation or training-correlated development → **No determinate content**.  

  2. **Proper Function**  
     - *Question:* What task was the representation *selected to perform*? Does this task imply the target feature?  
     - *Evidence required:*  
       - The representation’s activity correlates with successful task completion (e.g., high accuracy when active).  
       - The target feature is a *causal antecedent* of the representation’s role (e.g., edges cause object recognition success).  
     - *Stop if:* The representation aids performance but the target feature is incidental (e.g., tracks a correlate, not the feature itself) → **No determinate content**.  
     - *Senior sign-off needed if:* Task intent is ambiguous (e.g., model repurposed post-training).  

  3. **Consumer Mechanisms**  
     - *Question:* Is there a downstream component that *relies on* this representation to execute the proper function?  
     - *Evidence required:*  
       - Perturbing the representation’s output disrupts *consumer behavior* (e.g., later layers fail if input is altered).  
       - Causal mediation (e.g., intervening on the representation changes outputs predictably).  
     - *Stop if:* No downstream impact or consumers use it for an unrelated function → **No determinate content**.  

  4. **Misrepresentation**  
     - *Question:* Can the representation be activated *without the target feature*, causing functional failure?  
     - *Evidence required:*  
       - Generate inputs where the target is absent but representation fires (e.g., adversarial examples).  
       - Show that this leads to errors in the task from Step 2 (e.g., misclassification).  
     - *Stop if:* All activations perfectly match the target feature (no error possible) → **No determinate content**.  
     - *Senior sign-off needed if:* "Functional failure" is contested (e.g., task success metrics are undefined).  

  5. **Original vs. Derived Content**  
     - *Question:* Was the representation selected *directly for the target* or inherited via correlation?  
     - *Evidence required:*  
       - Training data show direct reinforcement for the target (e.g., edge labels used in supervision).  
       - Counterfactual: If correlated features (e.g., texture) were removed, selection would persist.  
     - *Outcome:*  
       - Direct evidence → Content is **original**.  
       - Indirect evidence → Content is **derived**.  
       - No evidence → **Unsettled** (proceed to final judgment).  

  **Final Determination**  
  - Pass all Steps 1–4 → **Genuine representational content** about the target.  
  - Step 5 unresolved → Content is **derived or unsettled** (but still genuine if 1–4 pass).  

  ---

  #### **Worked Examples**  
  **Case 1: Early-layer convolutional filter for horizontal edges**  
  - **Step 1:** Pass. Filter develops during training; ablation degrades edge detection.  
  - **Step 2:** Pass. Proper function is edge detection; horizontal edges are causal for object recognition.  
  - **Step 3:** Pass. Later layers consume filter outputs for shape detection.  
  - **Step 4:** Pass. Adversarial vertical gradients trigger the filter and cause misclassification.  
  - **Step 5:** Unsettled. No evidence if selection was for edges or generic gradients.  
  - **Verdict:** Genuine content (represents horizontal edges).  

  **Case 2: Language model hidden-state cluster for "deceptive intent"**  
  - **Step 1:** Pass. Cluster correlates with deceptive text; ablation reduces accuracy on deception benchmarks.  
  - **Step 2:** *Stop*. Proper function is next-token prediction, *not* detecting intent. Target feature ("deceptive intent") is incidental.  
  - **Verdict:** **No determinate content** about deceptive intent (mere correlation).  
    - *Surprise for team:* High correlation ≠ content. Represents "deception-associated text patterns," not intent.  

  ---

  #### **What This Procedure Cannot Do**  
  1. **Adjudicate selection mechanisms**: Cannot resolve if gradient descent "counts" as selection (assume it does).  
  2. **Define normative functions**: Proper function is fixed by *training objective*; disputes require senior sign-off.  
  3. **Assign content without consumers**: Mere activation patterns (e.g., unsupervised features) fail Step 3.  
  4. **Resolve content granularity**: Exact boundaries (e.g., "edge vs. gradient") are left unresolved.  
  5. **Handle non-adaptive systems**: Random or untrained networks automatically fail Step 1.  

  ---  
  **Final Note:** This procedure enforces teleosemantic rigor but requires empirical evidence. Ambiguities in function or selection history demand human judgment—document these cases.
