  Move (3) is where it gets interesting. Hayek's tacit knowledge point is profound and often misunderstood. The student nails it - you can't reduce everything to numbers. That's "clearly right." But then move (4) makes a clever meta-point: if Hayek is right, doesn't that sabotage market coordination too? That's "largely right" because it exposes a tension in Hayek, though he does have responses about competitive discovery.

