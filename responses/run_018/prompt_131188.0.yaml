prompt: |-
  I serve as the senior features editor for a quarterly history magazine read by general audiences and secondary-school teachers. Each issue carries two or three long-form articles that trace the causes of major historical turning points, and our writers have begun framing pathogens, climate anomalies, and volcanic eruptions as "historical actors" rather than mere background conditions—forces with explanatory weight comparable to human decisions. I have watched drafts drift into environmental determinism, presenting outcomes as inevitable outputs of temperature drops or ash clouds, and I have watched others anthropomorphize viruses or glaciers into entities with intentions. I need a reusable editorial procedure that staff members with no philosophical training can run in about thirty minutes on any proposed framing. The deliverable should be a sequence of ordered questions or tests; for each step specify what counts as a sufficient answer, where the procedure stops with a firm rejection of the framing, where it permits the framing only with mandatory qualifications, and where the question is one of values rather than facts and must be escalated to me. The procedure must be executable without outside research during deadline crunch. Apply it to three proposed article angles: first, framing the fourteenth-century Black Death as an agent that dissolved feudal obligations by restructuring labor supply; second, framing the 1815 Tambora eruption as the causal actor behind Mary Shelley’s composition of Frankenstein during the 1816 Geneva summer; and third, framing a hypothetical 2030 influenza pandemic—already modeled by our science desk—as a deterministic trigger for a specific geopolitical realignment, with human policy responses treated as mere epiphenomena. Be sure to include the case in which the procedure returns a verdict the proposing writer will strongly dislike, and state clearly what the procedure cannot settle.
reasoning: |-
  We are creating a reusable editorial procedure that can be applied to any proposed framing of non-human entities (like pathogens, climate events, etc.) as "historical actors". The procedure must be executable in about 30 minutes without outside research. It will consist of a sequence of ordered questions or tests. For each step, we specify:
  - What counts as a sufficient answer?
  - Where the procedure stops with a firm rejection?
  - Where it permits the framing only with mandatory qualifications?
  - Where the question is one of values and must be escalated?

  We'll then apply the procedure to three proposed article angles.

  **Editorial Procedure: Non-Human Entities as Historical Actors**

  **Step 1: Identify the Non-Human Entity and its Role**
     - **Question:** What specific non-human entity (e.g., a pathogen, a volcano) is being framed as an actor, and what historical outcome is attributed to it?
     - **Sufficient Answer:** The entity and the outcome are clearly defined and distinct. The entity is not merely a condition but is presented as having a direct, substantial role in bringing about the outcome.
     - **Rejection:** If the entity is too vague (e.g., "climate change" without specifying an event) or the outcome is not clearly defined, reject the framing. Also reject if the entity is only a background condition and not an actor.
     - **Mandatory Qualifications:** If the entity is one of multiple factors and the article does not acknowledge that, then we require the article to explicitly state that other factors (human and non-human) were also at play. The article must avoid the word "inevitable" and similar terms unless qualified.
     - **Escalation:** None at this step.

  **Step 2: Check for Anthropomorphism**
     - **Question:** Does the framing attribute human-like intentions, motivations, or agency (e.g., "the virus wanted to...", "the volcano decided to...") to the non-human entity?
     - **Sufficient Answer:** The framing does not use intentional language for the non-human entity. Instead, it uses language of cause and effect (e.g., "the eruption caused...", "the pathogen led to...").
     - **Rejection:** If the article uses intentional language without irony or clear metaphorical distancing, reject the framing. (Note: If the writer insists that the anthropomorphism is a deliberate rhetorical device for engagement, then escalate to the senior editor for a values decision on whether the device is appropriate for the magazine's tone and educational mission.)
     - **Mandatory Qualifications:** If the article uses anthropomorphic language as a metaphor, it must be clearly signaled (e.g., "metaphorically speaking", "as if it had a will") and immediately followed by a non-anthropomorphic explanation. The article must also include a disclaimer that the entity does not actually possess intentions.
     - **Escalation:** If the writer argues that the anthropomorphism is a necessary rhetorical device and the editor (staff member) is unsure, escalate to the senior editor.

  **Step 3: Check for Determinism**
     - **Question:** Does the framing present the outcome as the inevitable result of the non-human entity's actions, without considering the role of human choices, social structures, or contingency?
     - **Sufficient Answer:** The article acknowledges that the non-human entity created conditions that influenced human actions, but that human decisions and societal structures also played a crucial role in shaping the outcome. The outcome is presented as one of several possibilities.
     - **Rejection:** If the article states or strongly implies that the outcome was inevitable and that human actions were merely reactive and without significant influence, reject the framing. Also reject if the article uses deterministic language (e.g., "inevitably led to", "determined the course of").
     - **Mandatory Qualifications:** The article must explicitly state that the outcome was contingent on human responses and that alternative outcomes were possible. It must avoid words like "inevitable", "determined", "guaranteed", etc. without qualification. The article should use words like "contributed to", "influenced", "created conditions for".
     - **Escalation:** None at this step.

  **Step 4: Check for Over-Attribution**
     - **Question:** Does the article assign causal primacy to the non-human entity while downplaying or ignoring other significant factors (both human and non-human) that contributed to the outcome?
     - **Sufficient Answer:** The article acknowledges that the non-human entity was one of several factors and does not claim it was the sole or primary cause without evidence. The article provides a balanced view that includes human agency and other contextual factors.
     - **Rejection:** If the article presents the non-human entity as the primary or sole cause without acknowledging other major factors (that are well-established in historical scholarship), reject the framing.
     - **Mandatory Qualifications:** The article must include a discussion of other contributing factors (human decisions, economic conditions, political structures, etc.) and their relative importance. The article must state that the non-human entity was a catalyst or a contributing factor, but not the only one.
     - **Escalation:** If the writer argues that the non-human entity was indeed the primary cause and that the historical consensus supports this, but the editor (staff member) is unsure about the historical consensus, then the editor may note that the article must include a qualification that this is the writer's interpretation and that other historians might emphasize different factors. However, if the staff member is unsure about the historical consensus and the writer's claim, they should escalate to the senior editor for a fact-checking decision (which might require research beyond the 30-minute limit, but in that case the procedure stops and the article is set aside for further review).

  **Step 5: Check for Speculative or Counterfactual Claims (for hypothetical or future scenarios)**
     - **Note:** This step is only required for articles that deal with hypothetical scenarios (like the third example) or counterfactual history.
     - **Question:** For speculative claims (e.g., about the future or about what might have happened), does the article clearly signal the speculative nature and base the speculation on well-established causal mechanisms?
     - **Sufficient Answer:** The article explicitly states that it is discussing a hypothetical scenario and bases the scenario on logical extensions of known historical patterns or scientific models. It avoids presenting the hypothetical as a certainty.
     - **Rejection:** If the article presents a speculative scenario as inevitable or highly probable without acknowledging the uncertainty, reject the framing. Also reject if the speculative scenario is not grounded in any historical or scientific evidence.
     - **Mandatory Qualifications:** The article must use words like "could", "might", "possibly", and must include a discussion of the assumptions and uncertainties involved. It must avoid definitive language about the future or about counterfactuals.
     - **Escalation:** If the staff member is unsure about the validity of the scientific models or historical analogies used, escalate to the senior editor.

  **What the Procedure Cannot Settle:**
     - Disagreements about the relative importance of factors (which often involve interpretive judgments and values) that cannot be resolved without extensive historical research.
     - The appropriateness of a rhetorical device (like anthropomorphism) in a specific context, which is a matter of editorial values and the magazine's mission.
     - The validity of scientific models or historical interpretations that are contested among experts.

  Now, apply the procedure to the three proposed article angles.

  **Case 1: Framing the fourteenth-century Black Death as an agent that dissolved feudal obligations by restructuring labor supply.**

  - **Step 1:** 
     - Non-human entity: The Black Death (bacterium Yersinia pestis). Outcome: Dissolution of feudal obligations.
     - Sufficient: Yes. The entity and outcome are clear.
     - Mandatory Qualifications: None needed at this step.

  - **Step 2:**
     - Check for anthropomorphism: The framing says the Black Death "dissolved" feudal obligations. This is a metaphorical use of a human action (dissolving). But note: the article might not attribute intention. We must check the language. If it says "the Black Death acted to dissolve..." that might be problematic. But if it says "the Black Death led to the dissolution..." that is acceptable.
     - Assuming the writer uses intentional language, we require qualifications. If not, it passes.
     - Let's assume the draft uses language like "the Black Death broke the bonds of feudalism" without anthropomorphism (it's a common metaphor). We can note that the article should avoid implying intention. Mandatory qualification: The article must clarify that the Black Death did not have intentions; it was a natural event that had effects.

  - **Step 3:**
     - Check for determinism: Does the article present the dissolution of feudalism as inevitable? The Black Death is often seen as a major factor, but historians note that the outcomes varied by region and depended on human institutions and responses. If the article says the Black Death made the dissolution inevitable, that's deterministic.
     - Rejection if inevitable. Qualification: The article must state that the Black Death created conditions that made the dissolution more likely, but that human actions (like peasant revolts and lordly responses) were crucial and that the process was not immediate nor universal.

  - **Step 4:**
     - Check for over-attribution: The Black Death is a major factor, but other factors (like economic changes, political developments) also played a role. The article must acknowledge these.

  - **Step 5:** Not applicable (not speculative).

  **Verdict for Case 1:**
     - The framing is acceptable with mandatory qualifications:
        - Avoid anthropomorphic language (or clearly mark it as metaphorical and explain).
        - Avoid determinism: state that the outcome was not inevitable and depended on human actions and existing structures.
        - Acknowledge other contributing factors to the dissolution of feudalism.

  **Case 2: Framing the 1815 Tambora eruption as the causal actor behind Mary Shelley’s composition of Frankenstein during the 1816 Geneva summer.**

  - **Step 1:**
     - Entity: Tambora eruption. Outcome: Mary Shelley writing Frankenstein.
     - Sufficient: Clear entity and outcome.

  - **Step 2:**
     - Check anthropomorphism: If the article says "Tambora inspired Shelley" or "Tambora caused the rainy weather that led to the ghost story contest", that's acceptable cause-and-effect. But if it says "Tambora wanted to create a masterpiece", that's problematic.
     - We assume the article uses cause-and-effect. But note: the article might overstate by saying Tambora was the sole cause. We'll check in Step 4.

  - **Step 3:**
     - Determinism: If the article claims that the eruption made the writing of Frankenstein inevitable, that is deterministic. In reality, without the eruption, Shelley might still have written a great work, or Frankenstein might not have been written. The eruption created conditions (the unusual weather) that led to the ghost story contest, but Shelley's creativity and the social circle were crucial.
     - Mandatory qualification: The article must state that the eruption was a contributing factor but not the sole cause. It must avoid deterministic language.

  - **Step 4:**
     - Over-attribution: The article must acknowledge other factors: the literary circle (Byron, Percy Shelley, etc.), Mary Shelley's own experiences and imagination, the cultural moment (Romanticism, science). The eruption might have provided the immediate context, but it did not write the book.

  - **Step 5:** Not applicable.

  **Verdict for Case 2:**
     - Acceptable with mandatory qualifications:
        - Avoid deterministic language (the eruption made it inevitable).
        - Acknowledge the role of human creativity and social context.

  **Case 3: Framing a hypothetical 2030 influenza pandemic as a deterministic trigger for a specific geopolitical realignment, with human policy responses treated as mere epiphenomena.**

  - **Step 1:**
     - Entity: Hypothetical 2030 influenza pandemic. Outcome: A specific geopolitical realignment.
     - Sufficient: Clear.

  - **Step 2:**
     - Anthropomorphism: If the article attributes intention to the virus (e.g., "the virus will reshape the world order"), that would require qualification. But if it uses cause-and-effect, it passes. However, note the deterministic language in the framing.

  - **Step 3:**
     - Determinism: The article explicitly treats human policy responses as "mere epiphenomena" (i.e., insignificant byproducts). This is strongly deterministic. The procedure requires rejection if the outcome is presented as inevitable and human actions as without influence. Therefore, we reject the framing at this step.

     **REJECTION at Step 3: Determinism.**
     - The procedure stops here with a firm rejection because the article frames the outcome as determined by the pandemic and human actions as inconsequential.

  - **Step 4 and 5:** Not reached.

  **Verdict for Case 3: Rejected.** The writer will strongly dislike this because they are proposing a deterministic framework. The procedure cannot accept this without removing the deterministic framing and without acknowledging human agency.

  **What the Procedure Cannot Settle in Case 3:**
     - The procedure cannot resolve the writer's belief that the pandemic will be the primary driver. But the procedure rejects the deterministic framing on methodological grounds (ignoring human agency). The writer might revise to include human agency and contingency.

  **Summary of the Procedure:**
     - Step 1: Identify entity and outcome. (Reject if vague or if entity is background.)
     - Step 2: Check anthropomorphism. (Reject if unqualified intentionality; qualify if metaphorical.)
     - Step 3: Check determinism. (Reject if outcome is inevitable and human actions are downplayed.)
     - Step 4: Check over-attribution. (Reject if non-human entity is sole cause without acknowledging others; qualify by including other factors.)
     - Step 5: For speculative cases, check for grounding and uncertainty. (Reject if presented as certain; qualify with speculative language.)

  The procedure is designed to be efficient and is focused on avoiding common pitfalls in attributing agency to non-human entities. It emphasizes the magazine's commitment to a balanced view of history that includes both human agency and the role of environmental factors.
answer: |-
  ### Editorial Procedure: Evaluating Non-Human Entities as Historical Actors  
  **Purpose**: To ensure non-human entities (pathogens, climate events, etc.) are framed as *contributing factors* without falling into determinism, anthropomorphism, or over-simplification. Staff must complete this in 30 minutes without external research.  
  **Outputs for Each Step**:  
  - ✅ **Pass**: Proceed to next step.  
  - ⚠️ **Qualify**: Framing permitted only if mandatory revisions are made (specified in step).  
  - ❌ **Reject**: Firm rejection; framing is unusable.  
  - ⬆️ **Escalate**: Question involves values/interpretation; senior editor must decide.  

  ---

  #### **Step 1: Identify Causality Claims**  
  **Question**: *Does the article clearly distinguish the non-human entity’s role from human agency, or does it frame the entity as the sole/primary driver of the outcome?*  
  - **Sufficient Answer**: The entity is presented as a *catalyst* or *context-setting force* that interacts with human choices. Human decisions/structures are acknowledged as co-factors.  
  - **❌ Reject If**: The entity is described as the *only* cause, or human actions are dismissed as "automatic," "inevitable," or "irrelevant."  
  - **⚠️ Qualify If**: The entity is emphasized as pivotal but human factors are underdeveloped. *Mandatory fix*: Add language like "created conditions for," "influenced," or "interacted with," and specify human agency.  
  - **✅ Pass If**: Balanced causality is evident.  
  - **⬆️ Escalate If**: Writer argues historical consensus supports sole causality (rare; escalate for senior review of evidence).  

  #### **Step 2: Check for Anthropomorphism**  
  **Question**: *Does the framing attribute consciousness, intent, or strategic goals to the non-human entity (e.g., "the virus planned," "the eruption chose")?*  
  - **Sufficient Answer**: Entity is described mechanistically (e.g., "the eruption *caused*," "the pathogen *disrupted*").  
  - **❌ Reject If**: Intentionality is explicitly or implicitly assigned (e.g., "the glacier *demanded*," "the pandemic *wanted*").  
  - **⚠️ Qualify If**: Metaphorical language is used for accessibility (e.g., "the virus *rewrote* societies"). *Mandatory fix*: Add a disclaimer (e.g., "metaphorically speaking; viruses lack agency") and reframe sentences passively.  
  - **✅ Pass If**: Language is strictly causal, not agential.  
  - **⬆️ Escalate If**: Writer insists metaphor is essential for narrative (values decision on pedagogical appropriateness).  

  #### **Step 3: Test for Determinism**  
  **Question**: *Is the outcome presented as inevitable given the entity’s actions, or does the article acknowledge contingency (i.e., other outcomes were possible)?*  
  - **Sufficient Answer**: Outcome is framed as *contingent*—affected by the entity but dependent on human responses, randomness, or structural factors.  
  - **❌ Reject If**: Outcome is described as "inevitable," "guaranteed," or "determined" by the entity; human actions are "epiphenomena" or "automatic."  
  - **⚠️ Qualify If**: The entity’s role is disproportionate. *Mandatory fix*: Add hedging (e.g., "likely," "could have," "in some regions") and contrast with alternative scenarios.  
  - **✅ Pass If**: Contingency is clear (e.g., "enabled," "increased pressure for").  
  - **⬆️ Escalate If**: Writer claims determinism is empirically justified (requires senior fact-checking beyond scope).  

  #### **Step 4: Assess Scope of Claims**  
  **Question**: *Does the article generalize outcomes beyond what the entity can reasonably explain (e.g., ignoring regional variations, long-term processes, or counterexamples)?*  
  - **Sufficient Answer**: Outcomes are contextualized (e.g., "in some cases," "short-term effects included").  
  - **❌ Reject If**: Claims are universalized (e.g., "everywhere," "always," "fundamentally reshaped") without evidence or nuance.  
  - **⚠️ Qualify If**: Over-generalization is present. *Mandatory fix*: Add qualifiers (e.g., "in this context," "partially," "while other factors persisted") and address counterexamples.  
  - **✅ Pass If**: Claims are geographically/temporally bounded.  
  - **⬆️ Escalate If**: Writer asserts generalization is necessary for thematic coherence (values decision).  

  #### **Step 5: Handle Speculative/Futuristic Scenarios**  
  **Question** (For hypotheticals/future projections): *Is the framing grounded in historical precedent or scientific models, and does it avoid presenting speculation as certainty?*  
  - **Sufficient Answer**: Speculation is explicitly flagged (e.g., "according to models," "if X occurs, Y *might* follow"), with human agency included.  
  - **❌ Reject If**: Projection is presented as fact (e.g., "will cause," "must lead to"), or humans are passive.  
  - **⚠️ Qualify If**: Models are cited but over-interpreted. *Mandatory fix*: Add uncertainty (e.g., "plausible," "one possible outcome") and human adaptive capacity.  
  - **✅ Pass If**: Framing is probabilistic and includes human choice.  
  - **⬆️ Escalate If**: Writer argues speculation is "based on incontrovertible data" (verify with science desk post-deadline).  

  ---

  ### Application to Proposed Article Angles  
  **Case 1: Black Death as an agent dissolving feudal obligations**  
  - **Step 1**: ⚠️ Qualify. *Labor restructuring is linked to plague, but ignores lord/peasant negotiations, laws (e.g., Statute of Labourers), and regional variations*. Fix: Add human factors.  
  - **Step 2**: ✅ Pass. *No intentionality (e.g., "decimated populations, altering labor supply")*.  
  - **Step 3**: ⚠️ Qualify. *Implies inevitability ("dissolved obligations")*. Fix: Add contingency (e.g., "contributed to erosion of feudalism where elites failed to adapt").  
  - **Step 4**: ⚠️ Qualify. *Over-generalizes (feudalism persisted in some areas)*. Fix: Bound claims (e.g., "in Western Europe").  
  - **Step 5**: N/A.  
  **Verdict**: **Permitted with revisions**. Writer may dislike adding nuance but avoids rejection.  

  **Case 2: Tambora eruption as causal actor behind *Frankenstein***  
  - **Step 1**: ⚠️ Qualify. *Tambora’s weather influenced the 1816 "Year Without a Summer," but overstates causality (ignores Shelley’s biography, literary circles, Enlightenment science)*. Fix: Reframe as "catalyst."  
  - **Step 2**: ✅ Pass. *No anthropomorphism ("triggered gloomy weather")*.  
  - **Step 3**: ❌ Reject. *Deterministic: Claims Tambora "caused" Shelley’s creativity, treating her as passive*. Stop: Reject framing.  
  - **Escalation Note**: Writer may strongly argue Tambora was decisive, but determinism violates core procedure. Senior editor upholds rejection.  

  **Case 3: Hypothetical 2030 pandemic as deterministic geopolitical trigger**  
  - **Step 1**: ❌ Reject. *Human policies called "epiphenomena"; pandemic is sole actor*. Stop: Reject for ignoring human agency.  
  - **Escalation Note**: Writer may dislike this, but procedure cannot accept determinism. If revised (e.g., "pandemic could pressure nations, but responses will vary"), requalify at Step 1.  

  ---

  ### What the Procedure Cannot Settle  
  1. **Values Conflicts**: e.g., Whether anthropomorphism is acceptable for engagement (⬆️ escalate).  
  2. **Historical Disputes**: e.g., Relative weight of factors (e.g., "Was feudalism *more* eroded by plague or economics?"). Staff lack expertise; escalate for senior review.  
  3. **Speculative Validity**: e.g., Scientific model accuracy (Step 5 may require post-deadline verification).  

  **Procedure Workflow**:  
  1. Complete Steps 1–5 sequentially.  
  2. Stop at first ❌ or ⬆️.  
  3. For ⚠️, document mandatory fixes before proceeding.  
  4. Escalate ⬆️ issues immediately.  

  This ensures rigorous, consistent framing while respecting deadlines. Senior editor resolves ambiguities post-escalation.
