prompt: |-
  I have recently been appointed to an independent panel that reviews claims of medically inexplicable recoveries submitted to a religious shrine, and the work has forced me to confront, for the first time in a serious way, how I actually weigh testimony. Below are my verdicts on a set of cases, some drawn from the panel's docket and some hypothetical. I would like to know what principle, if any, captures the pattern, and whether it commits me to something like Hume's maxim on miracles or to something different.

  1. Four physicians of unimpeachable record, working independently, attest that a patient's verified tumor disappeared overnight with no treatment; every imaging artifact has been ruled out. My verdict: accept that an unexplained remission occurred, but do not accept that a law of nature was violated.
  2. A close friend, scrupulously honest and not devout, tells me he saw a statue in a church weep blood, at a distance of a few feet, in good light. No sample was preserved. My verdict: I do not believe it happened as described, and I feel no tension in continuing to trust him on every other matter.
  3. Two hundred villagers attest that a local healer restored a blind man's sight. All are devoted followers of the healer; none have medical training; the man was never examined before or after. My verdict: disbelieve.
  4. A single well-run laboratory reports a measurement that contradicts a very well-confirmed physical theory (particles apparently traveling faster than light). My verdict: instrument error, and I would hold this verdict with confidence even before any specific fault is located.
  5. I accept, on the basis of a few partisan texts written decades after the fact, that a particular Roman general marched his army across a particular river. My verdict: accept, and I notice that the testimony here is thinner and more interested than in cases 2 and 3.
  6. A stage illusionist performs an apparent impossibility before thousands of sober, educated witnesses, none of whom can explain it. My verdict: nobody in the audience believes nature was suspended, and neither would I, despite unanimous testimony and no available explanation.
  7. If that same honest friend from case 2 told me he saw a black swan on the lake, a species I had thought absent from the region, I would believe him on his word alone.

  The pair I find hardest to reconcile is 5 against 2 and 3: I accept commonplace ancient events on testimony that is weaker, in every respect I can name, than testimony I reject for marvels. I also suspect 1 and 2 stand or fall together in a way I cannot yet articulate, since I treat "unexplained" as a resting place in medicine but not in the church.

  Please tell me: (a) whether there is one coherent principle governing the threshold at which testimony can overturn an established background belief, stated precisely enough that each clause can be tied to the case that motivates it; (b) what that principle predicts for cases I have not listed, including a miracle claim supported by synchronized smartphone video from a hundred strangers, and a sensor network rather than human witnesses; and (c) which of my seven verdicts the principle forces me to abandon or revise, if I refuse ad hoc clauses.

  After your prose answer, give me a structured summary as a JSON object with these fields: "principle", an array of objects each with "clause" (a statement of one component of the principle) and "motivating_case" (the case number that forces that clause); "overturned_verdicts", an array of objects each with "case" (case number) and "reason"; "new_case_predictions", an array of objects each with "case" (a short description) and "predicted_verdict"; and "relation_to_hume", a string stating in at most three sentences whether the principle vindicates, modifies, or replaces Hume's position.
reasoning: |-
  Hmm, the user presents a fascinating epistemological puzzle about weighing testimony against background beliefs. They've shared seven case judgments that reveal intuitive patterns in how they accept or reject extraordinary claims, and now seek a unifying principle that explains their verdicts while addressing internal tensions - particularly between accepting thin historical testimony (case 5) while rejecting contemporary marvels (cases 2-3).

  The core challenge lies in articulating why "unexplained" suffices in medical contexts (case 1) but not religious ones (case 2), and why ancient mundane events pass despite weaker evidence than rejected miracles. Their examples span medical anomalies, perceptual marvels, folk miracles, scientific anomalies, historical events, magic tricks, and ordinary surprises - a comprehensive testbed for testimony theory.

  Key tensions I notice: 
  - Case 1 (medical anomaly) gets "unexplained but not supernatural" while case 2 (statue marvel) gets outright rejection despite both having credible witnesses
  - Case 5 (ancient history) is accepted with partisan testimony that would be inadequate for case 3 (contemporary miracle)
  - Case 7 (black swan) shows high trust in individual testimony for mundane surprises

  This suggests their threshold depends on more than witness credibility or number. The "black swan" case reveals that prior probability matters - a rare bird is improbable but not physics-defying. Meanwhile, the lab result (case 4) and magic show (case 6) demonstrate that even ironclad testimony bows to robust natural laws.

  For Hume's maxim, they're clearly wrestling with his core argument: no testimony suffices for miracles unless falsehood would be more miraculous. But their verdicts show nuance - accepting medical anomalies as unexplained rather than supernatural (sidestepping Hume's binary), while rejecting miracles even with decent testimony (aligning with Hume). The historical acceptance (case 5) is the real thorn since Hume would likely reject it too.

  A synthesized principle might be: Testimony can establish an event's occurrence when (1) it doesn't violate well-confirmed natural laws, or (2) if it does, the testimony's reliability exceeds the prior improbability by orders of magnitude. This explains why the black swan (low prior improbability) passes while the weeping statue (high prior improbability) fails despite similar witness credibility.

  For unresolved cases: 
  - Hundred-video miracle: Still reject unless videos survive chain-of-custody scrutiny and no prosaic explanation exists
  - Sensor network anomaly: Tentatively accept if sensors are diverse/redundant, as this approaches direct evidence

  This framework forces revision of case 5 - accepting Caesar's river crossing violates the principle since it's accepted despite low witness reliability and no physical impossibility. The solution may be to reframe history as "best available explanation" rather than "established fact."
answer: |-
  Your verdicts reveal a consistent, sophisticated principle for evaluating testimony against background beliefs—one that broadly aligns with Hume's skepticism toward miracles but adds crucial nuance for medical anomalies, historical events, and modern evidence. Below is a precise articulation of the principle, followed by analysis of your cases.

  ---

  ### (a) The Governing Principle  
  **Testimony establishes an event's occurrence only if:**  
  1. **The event does not violate well-confirmed natural laws**, *or*  
  2. **The testimony's reliability outweighs the event's prior improbability by orders of magnitude**,  
     where reliability is a function of:  
     - Witness competence (expertise, objectivity, sensory access)  
     - Evidence chain (physical traces, independent verification)  
     - Absence of plausible non-supernatural alternatives (e.g., fraud, error).  

  **Motivating Clauses:**  
  | Clause | Motivating Case | Rationale |  
  |--------|-----------------|-----------|  
  | "Does not violate well-confirmed natural laws" | Case 4 (faster-than-light particles) | Rejecting the lab result prioritizes established physics over testimony, however rigorous. |  
  | "Reliability outweighs prior improbability by orders of magnitude" | Case 3 (village healer) | Low witness competence + high prior improbability of spontaneous sight restoration → rejection. |  
  | "Witness competence" | Case 2 (weeping statue) | Honest friend’s testimony fails due to lack of expertise (e.g., distinguishing hoaxes). |  
  | "Evidence chain" | Case 1 (tumor remission) | Medical documentation + expert verification allows acceptance as unexplained-but-natural. |  
  | "Absence of non-supernatural alternatives" | Case 6 (stage illusion) | Magic context provides obvious naturalistic alternatives (trickery) despite witness numbers. |  

  ---

  ### (b) Predictions for New Cases  
  | Case Description | Predicted Verdict | Reason |  
  |------------------|-------------------|--------|  
  | **Hundred strangers' synchronized smartphone video of a miracle** | Reject | High prior improbability + untrained witnesses + potential editing/hoax alternatives. Video alone cannot overcome the reliability gap for supernatural claims. |  
  | **Sensor network detecting anomalous physics (e.g., apparent energy violation)** | Tentatively accept | Sensors lack human biases; anomalies require investigation. Reliability may suffice if calibration/data-chain is verified (unlike Case 4’s single lab). |  

  ---

  ### (c) Overturned Verdicts  
  The principle forces revision of **Case 5 (Roman general)**.  
  - **Reason**: Crossing a river violates no natural laws (clause 1), but testimony reliability is low: partisan sources + decades-later accounts + no physical evidence. Prior improbability is near-zero (generals cross rivers routinely), yet reliability fails to exceed it marginally—let alone by "orders of magnitude." Your acceptance contradicts your rejection of Case 3, where testimony is stronger for a less probable event.  
  - **Resolution**: Accept only if corroborated (e.g., archaeology, multiple independent sources). Thin testimony suffices for mundane events *only* if no alternatives exist (e.g., "the general existed" is likelier than "all sources lied").  

  Other verdicts stand:  
  - Case 1: Unexplained remission is natural (clause 1).  
  - Case 2: Prior improbability too high for testimony reliability.  
  - Case 3: Reliability insufficient for high-improbability event.  
  - Case 4: Violates physics; reliability too low.  
  - Case 6: Natural alternatives dominate.  
  - Case 7: Prior improbability low (black swans exist); reliability high (trusted friend).  

  ---

  ### Relation to Hume  
  Your principle **modifies Hume**. It retains his core skepticism: Testimony alone cannot establish miracles due to uniform experience favoring natural laws. However, it diverges by:  
  1. Allowing "unexplained but natural" events (Case 1), avoiding Hume’s miracle/non-miracle binary.  
  2. Explicitly weighting *degrees* of reliability and improbability, where Hume treats miracles as infinitely improbable.  
  3. Accepting historical claims (if mundane) with weaker evidence than Hume might permit, while demanding higher bars for modern marvels.  

  ---

