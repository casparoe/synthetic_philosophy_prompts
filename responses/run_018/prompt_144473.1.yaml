answer: |-
  The divergence stems from **epistemic access to boundary conditions**, not physics per se. Both domains acknowledge deterministic laws, but institutions treat predictability as contingent on **human controllability of initial/boundary states.**

  **Implicit Philosophy:**
  1.  **Engineered Systems (Reactors/Aircraft):** Assumes a *closed epistemic frame*. Humans can:
      *   Rigorously define and physically enforce boundary conditions (e.g., containment vessels, flight envelopes).
      *   Characterize all relevant initial states within these bounds (material properties, operating ranges).
      *   Implement redundancy/barriers that *physically preclude* failure states within the bounded domain.
      Determinism + controlled boundaries + exclusion mechanisms → **certifiable certainty.** Probability is secondary because the system is designed to be *fail-safe*, not just *fail-rare*. Uncertainty is seen as a *design flaw* to be eliminated.

  2.  **Complex Open Systems (Climate/Epidemiology):** Assumes an *open epistemic frame*. Humans cannot:
      *   Control or fully characterize the vast, interacting initial/boundary conditions (e.g., global socioeconomic drivers, atmospheric states, viral mutations).
      *   Enforce strict boundaries isolating the system.
      *   Physically preclude undesirable states (e.g., stopping CO2 emissions *now*).
      Determinism + chaotic sensitivity + uncontrollable boundaries → **inherently limited predictability.** Uncertainty is irreducible at scale/time. Policy must be *adaptive* and *robust* across possible futures (ensembles, confidence intervals).

  **Coherence & Inconsistency:**
  The core logic *is* coherent regarding **tractability**: Determinism enables prediction *only* when initial/boundary states are sufficiently constrained and knowable. The "inconsistency" arises because reactor safety *artificially creates* this tractability through immense engineering effort (containment, redundancy, operational limits). This is infeasible for planetary-scale systems. Demanding deterministic proofs for inherently open systems would be unscientific; demanding only probabilistic proofs for engineered systems would abandon the achievable goal of *certain prevention*.

  **Unified Philosophy Requirement:**
  A unified view must explicitly centre **boundary control and epistemic access** as the determinants of predictability, not determinism alone. It would:
  1.  **Acknowledge the spectrum:** Recognize systems lie on a continuum from highly controllable (reactor core) to uncontrollable (global climate).
  2.  **Tailor epistemology:** Match validation methods (deterministic proof vs. probabilistic ensembles) to the achievable level of boundary control and state knowledge.
  3.  **Accept irreducible uncertainty:** For open systems, institutionalize adaptation and robustness, moving beyond futile demands for deterministic certainty. For engineered systems, maintain the high standard of physical impossibility of failure *within their rigorously controlled domain*.

  This shift moves beyond a naive "determinism = predictability" view to a more nuanced "predictability requires determinism *plus* controlled boundaries *plus* epistemic access" framework, grounded in practical tractability. (Word count: 348)
