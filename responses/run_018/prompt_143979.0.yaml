    Final sonnet:
answer: |-
  To live without constraint, no forceful bar
  That stops your action: negative liberty.
  The absence of interference, near or far,
  Defines the space where you may act with glee.
  But positive freedom calls for self-command,
  To rule one's inner realm and outer deed,
  To choose the path by one's own will unmanned,
  And shape the life that reason may decree.
  Then republican freedom shifts the sight:
  The threat is domination, not the blow;
  Though power sleeps, if it can act at night
  Without restraint, it chains you even so.
  Thus structures rise to make its force non-arbitrary,
  Importing self-command through common air.
  Reduced to lack of block, the necessary
  Frame against dominion falls beyond repair.
