  ### **What Your View Means & Notes**  
  - **Coherence View**: You think worth hides in emotional echoes—even if beliefs are whack (like ghost-fear tracking anti-theft). Actions "inherit" worth when feelings align with moral facts.  
  - **Sentiment-Worth**: Good vibes (empathy, guilt) make actions worthy. Duty alone feels too cold.  
  - **De Re Concern-for-Rightness**: Worth isn’t about duty *or* sentiment—it’s about gunning for the right thing itself.  
  - **Pure Duty-Worth**: Only iron-clad obligation counts. Feelings? Accidents? Nah.  
  - **Deflationary Zero-Worth**: "Moral worth" is a myth—just do the right thing, period.  

  **Empty Combos & Tree Limits**:  
  - The tree **can’t sort** you if you’re **deflationary but think motives matter for character** (e.g., you picked 3A/B *and* 1C/2C). Why? Deflation says motives don’t affect *action worth*, but you might still think a duty-driven person is "better" than a greedy one—that’s about character, not worth. The tree ignores this nuance.  
  - **Unreachable Combos**:  
    - If you’re **all-in on outcomes** (e.g., 1B, 2B, 3A, 4A, 5C, 6B, 7C), the tree might mis-sort you as deflationary even if you’re not.  
    - **Coherence + De Re** can blur if you picked 7B (fear + "deep down" belief)—the tree forces a choice, but real life’s messy.  

