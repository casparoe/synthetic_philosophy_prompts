answer: |-
  Alright, let's build that quiz! I'll keep it casual and focused on concrete cases—no theory jargon, just everyday scenarios. You'll answer 7 questions, each with 2-3 options. At the end, I'll give you a decision tree and a scoring key to sort you into one of five views on moral worth:  
  - **Pure Duty-Worth**: Only actions done 'cause you feel a strict moral obligation count.  
  - **Sentiment-Worth**: Actions fueled by good feelings (like empathy) have worth, even without duty.  
  - **De Re Concern-for-Rightness**: Worth comes from caring about doing the *right thing itself*, not duty or feels.  
  - **Deflationary Zero-Worth**: "Moral worth" is nonsense—only outcomes matter.  
  - **Coherence View**: Worth sneaks in when your gut feelings track morality, even if your brain disagrees.  

  **How it works**:  
  - Read each scenario and pick the option that feels right *to you*.  
  - Answers are standalone—don't overthink connections.  
  - After, I'll map your answers using a decision tree. I’ll also flag combos the tree can’t separate and note where motives might still matter for character (even if you're deflationary about worth).  

  ---  
  ### **The Quiz: What’s Motivating You?**  
  *(Pick one answer per question!)*  

  1. **Lee finds a wallet stuffed with cash. They return it ’cause they believe it’s their moral duty—no feelings, just "I gotta do this." What’s your take?**  
     A) This action has moral worth *only* because of the duty thing.  
     B) It has worth, but ’cause it helped someone—duty’s irrelevant.  
     C) Worth? Nah. Returning it is good, but motives don’t add magic.  

  2. **Sam returns a lost wallet ’cause they feel awful imagining the owner’s panic—pure compassion. Your thoughts?**  
     A) Moral worth comes from that empathy, full stop.  
     B) Worth comes from Sam caring about *doing the right thing*, not just feels.  
     C) Returning it is cool, but no extra "worth points" for warm fuzzies.  

  3. **Taylor returns a wallet only ’cause they’re sure the owner will give a reward. Does this deserve moral credit?**  
     A) Yes—any reason that gets the job done is fine.  
     B) Only if it accidentally lines up with what’s right.  
     C) Nope. Selfish motives kill any worth.  

  4. **Avery tries to steal a wallet but fumbles and accidentally returns it to the owner. Moral worth?**  
     A) Yeah—it ended up right, so who cares how?  
     B) Only if their gut was screaming "this is wrong" during the fumble.  
     C) No way. It was a total accident.  

  5. **Riley sees a kid drowning and dives in to save them—pure instinct, zero thought. Worth it?**  
     A) Yes! Their gut reaction tracked the moral emergency.  
     B) Only if Riley *would’ve* thought it was right if they’d had time.  
     C) Saving the kid is fire, but instincts don’t make it "worthy."  

  6. **Morgan saves a drowning kid ’cause they think it’s a high-end robot, and they want the cash reward. Turns out it’s a real kid. Your verdict?**  
     A) Worthless—they were just greedy.  
     B) Worth comes from the *act* saving a life, not their trash motive.  
     C) It has worth ’cause their fear of losing the "robot" mirrored morality.  

  7. **Jay returns a wallet ’cause they’re terrified the owner’s ghost will haunt them—even though Jay thinks stealing is totally fine otherwise. Moral worth?**  
     A) Yes—their spooky fear secretly tracked the "no stealing" rule.  
     B) Only if they *also* felt it was wrong deep down.  
     C) Nope. Ghost-fear ain’t a moral reason.  

  ---  
  ### **Decision Tree & Scoring Key**  
  Once you’ve got your answers (e.g., 1A, 2B, 3C, etc.), plug ’em into this tree. Start from the top!  

  1. **Look at Q7 (ghost wallet):**  
     - If you picked **A** → **Coherence View** (your emotional response tracks moral properties, even with wrong beliefs).  
     - If you picked **B** or **C** → Move to step 2.  

  2. **Look at Q3 (reward motive):**  
     - If you picked **A** or **B** → Move to step 3.  
     - If you picked **C** → Move to step 4.  

  3. **Look at Q1 (duty motive):**  
     - If you picked **A** → Move to step 5.  
     - If you picked **B** or **C** → **Deflationary Zero-Worth** (motives don’t create worth—only acts matter).  

  4. **Look at Q2 (compassion motive):**  
     - If you picked **A** → **Sentiment-Worth** (feelings like empathy grant worth).  
     - If you picked **B** → **De Re Concern-for-Rightness** (caring about rightness itself is key).  
     - If you picked **C** → Move to step 6.  

