  - "Measure-Zero Ghost": The survivor exists only in branches where the quantum event *didn't* kill them – an infinitely thin slice of reality.  
  - Epistemic Dodge: Mistaking necessary condition for survival (experiment *appearing* to fail) for proof it *always* fails.  
  - "Dead Outnumber...": The measure (weight) of branches where "you" die vastly exceeds those where you survive.  

