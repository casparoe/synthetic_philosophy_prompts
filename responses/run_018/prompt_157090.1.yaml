answer: |-
  ### Care Ethics Sorting Tree: Institutional Reach Edition  
  *Use this to map your intuitions about whether care can stretch to distant strangers via systems. Answer the diagnostic cases honestly—don't overthink!*

  ---

  #### **Diagnostic Cases** (Answer these first):  
  1. **Rotating Nurse**: A nurse works 8-hour shifts in a hospital, handing off patients to the next shift. Does this system *maintain* genuine care for patients?  
     - (A) No, care gets lost in handoffs.  
     - (B) Yes, if the *role* and protocols are designed right.  

  2. **State Bread**: A government agency distributes food stamps to 10 million people. Does the agency *care* for recipients?  
     - (A) No, it’s just bureaucratic logistics.  
     - (B) Yes, by meeting needs systematically.  
     - (C) Only if caseworkers feel invested.  

  ---

  #### **The Tree**  
  **Start Here**  

  1. **Can care obligations extend to distant strangers through institutions?**  
     - **NO** → **Noddings-Style Relational Care**  
       - *Your take*: Care only "counts" in direct, personal relationships. Institutions are just efficiency tools.  
       - *Most awkward commitment*: You must say UNICEF saving a child’s life isn’t *care*—just "competent administration."  
       - *Test case match*: Rotating Nurse (A), State Bread (A).  
     - **YES** → Go to 2.  

  2. **Does fulfilling care require emotional labor (attentiveness, empathy), or can institutions satisfy it through structure alone?**  
     - **STRUCTURE ALONE** → **Tronto-Style Political Care**  
       - *Your take*: Care is about *meeting needs*. If institutions do this justly, it’s care—even without warmth.  
       - *Most awkward commitment*: You must say the DMV "cares" when it efficiently processes your disability permit.  
       - *Test case match*: State Bread (B).  
     - **REQUIRES EMOTIONAL LABOR** → Go to 3.  

  3. **Does emotional labor hit an "attention ceiling" (it’s too draining to scale beyond small groups)?**  
     - **YES** → **Unnamed Branch** (⚠️ *logically possible but nobody defends this*)  
       - *Your take*: Institutions can *channel* care, but emotional burnout caps how far it reaches.  
       - *Most awkward commitment*: You must say global aid agencies *can’t* care about climate refugees—only local soup kitchens can.  
       - *Test case match*: Rotating Nurse (A), State Bread (C → but fails at scale).  
     - **NO** → **Held-Style Integrated Care**  
       - *Your take*: Emotional labor can be embedded in roles/protocols, making care *scalable without burnout*.  
       - *Most awkward commitment*: You must say a TikTok moderator *genuinely cares* for millions of teens by enforcing safety rules.  
       - *Test case match*: Rotating Nurse (B), State Bread (C).  

  ---

  #### **Key Notes**  
  - **Empty Branch Alert**: The "Unnamed Branch" (emotional labor + attention ceiling) has no real-world defenders. It’s a thought experiment—useful for debating scalability limits.  
  - **Tree Can’t Separate**: If you think the *Rotating Nurse* maintains care (B) but *State Bread* doesn’t (A), you’re torn between **Noddings** (face-to-face essential) and **Held** (roles scale care). Revisit case 1!  
  - **Design Quirk**: This tree forces a choice between Tronto (structure = care) and Held (structure + emotion = care). Realists might hybridize—but this is a purity test!  

  ---  
  Workshop pro tip: Have participants argue *from the diagnostic cases* before revealing their branch. The nurse/state tension always ignites drama. 👩‍⚕️🏢💥
