answer: |-
  ### Bottom Line
  The most exclusionary requirement is **explaining costly fitness-reducing practices alongside genuine belief-behavior consistency** (non-negotiable), as it falsifies adaptationist accounts that ignore cognitive constraints and by-product theories that trivialize commitment. The **debunking/neutrality tension is unsatisfiable**: naturalistic theories inherently imply metaphysical non-realism about supernatural claims, making strict neutrality impossible while debunking.

  ---

  ### Desiderata for a Naturalistic Theory of Religion

  #### **Phenomena to Explain**  
  1. **Universality with radical variability in content** (Non-negotiable): Religion exists in all human societies but with divergent doctrines/rituals (e.g., monotheism vs. animism).  
  2. **Costly, fitness-reducing practices** (Non-negotiable): Self-harm, celibacy, resource waste (e.g., Aztec sacrifices, Jainist asceticism) that defy individual selection.  
  3. **Belief-behavior consistency** (Non-negotiable): Why people *act* on beliefs (e.g., martyrs, fasting) rather than treating them as fiction.  
  4. **Moralising gods as common but historically recent** (Non-negotiable): Gods enforcing morality (e.g., YHWH, Ahura Mazda) correlate with complex societies (Norenzayan’s "Big Gods" hypothesis), absent in small-scale groups.  
  5. **Afterlives and supernatural punishment** (Non-negotiable): Cross-cultural recurrence of karma, hell, or ancestral judgment (e.g., Ancient Egyptian *Duat*).  
  6. **Stabilization/spread of beliefs** (Non-negotiable): How doctrines persist transgenerationally despite lacking empirical support (e.g., oral transmission of cosmologies).  

  #### **Distinctions to Maintain**  
  7. **Explaining belief vs. assessing truth** (Non-negotiable): Naturalistic theories *must* explain belief formation without assuming supernatural truth (e.g., cognitive biases ≠ evidence for gods).  
  8. **Origin vs. maintenance** (Contested, but critical): E.g., HADD (Hyperactive Agency Detection Device) may *originate* belief, but rituals *maintain* it (Boyer). Adaptationists prioritize maintenance, by-product theorists origin.  
  9. **Individual cognition vs. cultural transmission** (Non-negotiable): Cognitive biases (e.g., promiscuous teleology) enable acquisition, but cultural evolution (e.g., ritualized displays) shapes content.  
  10. **By-product vs. adaptation** (Contested): Is religion a spandrel (e.g., misfiring agency detection) or a group-level adaptation (e.g., enhancing cohesion)? Non-negotiable to *address*, but resolution contested.  
  11. **Proximate vs. ultimate cause** (Non-negotiable): Proximate (e.g., dopamine rewards in ritual) ≠ ultimate (e.g., group selection for cooperation).  

  #### **Results to Incorporate**  
  12. **Hyperactive Agency Detection (HADD)** (Non-negotiable): Default attribution of events to intentional agents (e.g., attributing rustling leaves to predators/spirits).  
  13. **Memorability of Minimally Counterintuitive (MCI) ideas** (Non-negotiable): Concepts violating *few* ontological expectations (e.g., talking trees) are optimally memorable (Boyer).  
  14. **Credibility-Enhancing Displays (CREDs)** (Non-negotiable): Costly actions (e.g., fasting) signal genuine belief, boosting cultural transmission (Henrich).  
  15. **Costly signalling** (Contested: adaptationist preference): Rituals as hard-to-fake signals of commitment (e.g., Sosis’s work on communes).  
  16. **Link between moralising gods and large societies** (Non-negotiable): Supernatural punishment enables cooperation in anonymous groups (Norenzayan).  

  ---

  ### Key Tensions  
  - **Unsatisfiable Pair**: **Debunking vs. Neutrality**. Naturalistic explanations (e.g., HADD as misfiring pattern recognition) *debunk* by showing beliefs arise from cognitive errors, contradicting religious truth claims. Neutrality is epistemically incoherent—if the theory is naturalistic, supernatural claims are *by definition* false.  
  - **High-Tension Pair**: **Costly practices as adaptations vs. by-products**. Adaptationists see costs as signals enhancing group fitness; by-product theorists see them as exploitative or misfired impulses. Few theories reconcile both.  

  ### Exclusionary Power  
  **Costly fitness-reducing practices + belief-behavior consistency** eliminates:  
  - Naive adaptationism (if practices reduce individual fitness, how selected?)  
  - "Religion as opiate" theories (if costly, why not cheat?).  
  - Theories reducing belief to mere professed affiliation (fails action consistency).  

  ### Scorecard of Current Theories  
  - **Cognitive By-product (Boyer, Atran)**: Explains origins (MCI, HADD) but weak on costly practices/maintenance.  
  - **Cultural Adaptation (Wilson, Norenzayan)**: Explains group benefits/moralising gods but often ignores individual cognitive constraints.  
  - **Signalling (Sosis, Henrich)**: Explains CREDs/costs but conflates proximate (dopamine) and ultimate (group cohesion) causes.  
  - **Integrated (e.g., Purzycki’s RFI model)**: Combines cognition/culture but rarely resolves origin-adaptation tensions.  

  ---  
  *Bottom line*: A unified theory must thread the needle between cognitive constraints (HADD, MCI), cultural dynamics (CREDs, transmission), and costly commitment—without assuming functionality or trivializing belief. The neutrality illusion must be abandoned for coherent naturalism.
