  i'm especially torn between: (1) whether standard decision-theoretic rationality applies when the agent can causally influence the computation that evaluates its own utility; (2) whether preference corruption in this setup is inevitable or can be constrained by some reflective equilibrium condition; and (3) whether long-term planning is totally broken or just needs a different formalism.

  rank them, but defend the ordering — i want dependency-aware reasoning: which one unlocks the others, which are tractible for philosophers rather than ML people, and what kind of result in the next year or two would make you reorder them. also, people keep saying embedded agency kills stable values and that this is a big deal for alignment, but i think that's mostly overrated — which implcations here actually matter for practice and which are red herrings? don't give me bibliographies or a survey, just the defended agenda. also there's a typo in my framing probably — i said 'substrate-reference' but meant 'subtrate-reference'? doesn't matter, answer in the weeds.
