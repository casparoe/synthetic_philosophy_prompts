prompt: |-
  hey so me and my roommate got into it about evolutionary psych being science or just fancy just-so stories and he built this arguement that feels like it proves way too much. i need help finding the exit.

  (1) for a field to be science its core explanations have to be falsifiable in principal.
  (2) take algorithmic aversion — people reject good algorithmic advice even when they know its more accurate. evolutionary psych explains this by saying in ancestral groups trusting opaque non-human sources was risky, so we evolved a bias against them.
  (3) but if studies had shown people blindly trusting algorithms, evolutionary psych could flip the story: deferring to high-accuracy predictors was adaptive on the savanna, so we evolved a bias toward accurate agents regardless of source.
  (4) so for any behavior B and its absence, there's always an adaptive narrative that fits.
  (5) that means evolutionary psych can acommodate any observation.
  (6) a theory that can acommodate any observation explains nothing.
  (7) therefore evolutionary psych isnt science, its just storytelling.
  (8) but that cant be right because evolutionary psych does make real predictions like cheater detection modules or incest avoidance mechanisms. so one step is wrong but i dont know which. i really want to keep (1) and (8) if possible.

  where does the slip happen? which premise should i give up, and whats the cost? please answer in one continuous block of prose with no headings, no bullet points, no bold, no tables — just like an email. start with the bottom line up front: name the step youd reject, then explain why it looked okay and what giving it up costs.
reasoning: |-
  Okay, the user is having a debate with their roommate about whether evolutionary psychology is a legitimate science or just "just-so stories." The roommate constructed an argument that seems to prove too much, and the user needs help identifying where the logic goes wrong. They want to keep the core idea that science requires falsifiability and that evolutionary psychology makes real predictions.

  The roommate's argument goes through several steps: starting with the requirement for falsifiability in science, using algorithmic aversion as an example, showing how evolutionary psychology could explain both a behavior and its opposite, concluding that it can accommodate any observation, and therefore isn't science. But the user points out that evolutionary psychology does make testable predictions, creating a contradiction.

  I need to find the flaw in this reasoning. The key issue seems to be in step (4): "for any behavior B and its absence, there's always an adaptive narrative that fits." This overgeneralizes a real problem in evolutionary psychology - the risk of post-hoc storytelling - but this doesn't mean the field inherently lacks falsifiability.

  Why is step (4) problematic? First, evolutionary psychology doesn't just create narratives; it uses multiple lines of evidence to test hypotheses. Researchers look for convergent evidence from anthropology, neuroscience, genetics, and cross-cultural studies. For example, the cheater detection module prediction was tested through experiments showing people are better at detecting violations of social contracts than abstract logical rules.

  Second, evolutionary psychologists make specific, risky predictions. The incest avoidance hypothesis predicts the Westermarck effect - that children raised together develop sexual disinterest regardless of biological relation. This was confirmed in studies of Israeli kibbutzim. If this hadn't been observed, the theory would have been challenged.

  The roommate's algorithmic aversion example is misleading because it presents a false dichotomy. Evolutionary psychology could generate competing hypotheses, but these would need testing against evidence. A good adaptationist explanation must specify the ancestral problem, show how the trait solves it, demonstrate the trait is heritable, and rule out alternatives. The mere existence of a plausible story doesn't make it scientific; it must survive empirical tests.

  The cost of rejecting step (4) is acknowledging that evolutionary psychology is vulnerable to bad storytelling if researchers aren't rigorous. But the solution isn't dismissing the field - it's demanding better science: pre-registered studies, specific predictions, and evidence beyond mere consistency.

  The user wants to preserve both falsifiability and evolutionary psychology's scientific status. By rejecting the overgeneralization in step (4), we can do this. The field isn't unfalsifiable - it's that some practitioners may fail to test their narratives properly. The core remains scientific when done rigorously.
answer: |-
  The slip happens at step (4). You should reject the premise that "for any behavior B and its absence, there's always an adaptive narrative that fits" within evolutionary psychology as a *valid scientific practice*, even though it's true that someone *could* invent a superficial story for either outcome. Step (4) looks okay because the algorithmic aversion example cleverly demonstrates how a *specific*, *vague* evolutionary hypothesis can be reversed post-hoc. It taps into a legitimate criticism that evolutionary psychology is sometimes vulnerable to generating unfalsifiable "just-so" stories if practitioners aren't rigorously constrained. However, step (4) overgeneralizes this vulnerability into an inherent, fatal flaw for the entire field, ignoring how evolutionary psychology actually operates scientifically when done well. Giving up step (4) costs you the simplicity of dismissing bad evolutionary storytelling as proof the whole field is unscientific; instead, you must accept that while generating a *plausible* narrative for any outcome is *possible*, robust evolutionary psychology demands much more to qualify as science.

  The key is that step (4) confuses the *possibility* of inventing a weak, post-hoc story with the actual requirements of scientific evolutionary psychology. A genuine evolutionary hypothesis isn't just any story that sounds plausible. It must generate specific, testable predictions beyond merely accommodating the initial observation. This includes predictions about: the underlying cognitive or neural mechanisms and their domain-specificity; patterns of heritability or development; specific cross-cultural universality or variation linked to ecology; reactions to novel modern environments that mismatch ancestral ones; fossil or archeological evidence; comparative evidence from other species facing similar adaptive problems; and crucially, predictions about what evidence would *falsify* the hypothesis. Your example in step (8) – cheater detection modules or incest avoidance – illustrates this well. These aren't just stories invented to explain observed behavior; they made risky, specific predictions *before* key evidence was gathered (e.g., the Wason selection task results for cheater detection, the Westermarck effect in kibbutzim/communes for incest avoidance). Step (4) ignores this predictive power and the constraints imposed by converging evidence from multiple disciplines (genetics, neuroscience, anthropology, behavioral economics). A good evolutionary psychologist presented with the algorithmic aversion finding wouldn't stop at a single, easily-flipped narrative; they would develop specific, testable models about *when* and *in whom* aversion should be strongest (e.g., predicting stronger aversion in domains related to social hierarchy vs. non-social domains, or under conditions of coalitional threat), predictions about associated emotions or physiological responses, or cross-cultural differences based on societal trust levels. The cost of rejecting step (4) is acknowledging that evolutionary psychology *can* be done poorly (producing just-so stories), but insisting that when done rigorously – by generating specific, testable, and falsifiable predictions grounded in multiple lines of evidence – it meets the criteria of science as defined in step (1). It shifts the burden to demanding that specific evolutionary hypotheses be held to high standards of predictive power and falsifiability, rather than dismissing the entire enterprise based on its potential for misuse.
