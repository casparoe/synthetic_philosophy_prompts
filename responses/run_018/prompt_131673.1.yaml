    "exam_question": "Philosophy of Well-Being Final Exam (60 minutes)\n\nConsider two hypothetical lives:\n\n- **Life A (Standard Experience Machine):** A person lives in a simulation where they experience all the pleasures, satisfactions, and emotional rewards of an accomplished life (e.g., deep relationships, career success, moral virtue) without any real-world causation. Their experiences are fabricated by neuroscientific technology.\n\n- **Life B (Reverse Experience Machine):** A person lives a genuinely accomplished life in reality—they form authentic relationships, make original discoveries, and exercise real moral agency—but every internal reward (pleasure, pride, emotional fulfillment) is permanently blocked by a pharmacological intervention. Their achievements are objectively real, but they feel no positive affect from them.\n\n**Prompt:** Evaluate whether hedonism, desire-satisfaction theory, and objective-list theory can consistently rank Life A and Life B in terms of well-being. Address the following:\n1. Why might a hedonist defend Life B over Life A (or reject Life B entirely) upon realizing Life B lacks affect? Does this reveal a flaw in hedonism?\n2. Can desire-satisfaction theory maintain that Life B has high well-being if the person’s second-order desires (e.g., to feel joy from their achievements) are systematically frustrated?\n3. How might an objective-list theorist argue that Life B is superior to Life A based on the intrinsic value of achievement, even without experiential payoffs? What objections could arise?\n\nFocus on conceptual coherence: Can each theory rank these lives without contradicting its core principles? Use the cases to reveal weaknesses in each approach. (≈800 words)",
    "model_answer": "The reverse and standard experience machines present a dilemma for theories of well-being by decoupling achievement from affective reward. Hedonism, which equates well-being with pleasure and pain, must rank Life A (Standard Machine) above Life B (Reverse Machine). Life A maximizes positive affect by design, while Life B eliminates it entirely. A hedonist might *tentatively* defend Life B if they value the absence of negative affect (e.g., Life B avoids simulated despair), but this fails: Life A could easily be programmed to exclude suffering. Ultimately, Life B’s real achievements are irrelevant to hedonism—only affect matters. This exposes hedonism’s core weakness: it cannot accommodate the intuition that genuine accomplishments (e.g., curing a disease) have value beyond felt satisfaction.\n\nDesire-satisfaction theory faces a paradox in Life B. If well-being stems from fulfilling desires, Life B seems ideal—desires for real relationships, discoveries, and moral choices are satisfied. However, Life B frustrates second-order desires, such as the desire *to feel fulfilled* by one’s achievements. If these meta-desires are central to the person’s identity, their frustration significantly reduces well-being. Yet if desire theorists dismiss second-order desires as unimportant, they risk arbitrariness. Life A, meanwhile, satisfies only first-order desires (e.g., “I desire happiness”) through illusion, which some desire theorists (e.g., Railton) reject as non-authentic. The theory struggles to consistently rank the lives: if authenticity matters, Life B wins; if felt satisfaction matters, Life A wins—revealing internal tension.\n\nObjective-list theory (e.g., Parfit) can coherently rank Life B above Life A by valuing achievement, knowledge, and relationships *as goods in themselves*, irrespective of affect. For the objective-list theorist, Life B contains real objective goods (e.g., authentic love, scientific contributions), while Life A offers mere facsimiles. This avoids hedonism’s fixation on affect and desire theory’s dependence on subjective states. However, this invites the “independent value of affect” objection: if positive feelings are *also* on the objective list (as most theorists concede), Life B lacks a key good. The theorist might counter that affect derives its value from accompanying real goods (e.g., joy *from* achievement), but this risks circularity. Still, objective-list theory best captures the intuition that Life B’s achievements hold meaning even without internal reward.\n\nIn conclusion:\n- Hedonism consistently ranks Life A > Life B but ignores achievement.\n- Desire-satisfaction inconsistently ranks the lives due to second-order desire conflicts.\n- Objective-list theory best defends Life B > Life A by prioritizing objective goods, though it must confront the role of affect in well-being.",
