prompt: |-
  I'm putting together the final for my philosophy of well-being seminar and I need an essay question that doesn't just ask for a recap of Nozick's experience machine. To keep it from being memorizable, I want you to work with a made-up twist: the "reverse experience machine," where a person lives a genuinely accomplished life—real relationships, real discoveries, real moral choices—but every internal reward, pleasure, or feeling of pride is completely neutralized by a permanent pharmacological block. Compare this to the standard experience machine that delivers all those feelings without any real-world causation.

  The exam question should ask students to adjudicate wheter hedonism, desire-satisfaction, and objective-list theories of well-being can consistently rank these two cases, and specifically why a hedonist might actually prefer the reverse-machine life (or reject it) once they realize affect is missing but achievement is real. They need to address whether desire-satisfaction survives when second-order desires for emotional reward go unsatisfied, and whether an objective-list theorist can defend the value of achievement as independant of any experiential payoff.

  Write the actual exam prompt (aimed at 60 minutes, roughly 800 words expected), then a model answer of about 600 words, then a marking scheme out of 25 points that separates an A answer from a B by listing the specific conceptual moves each must include—like distinguishing experiential goods from achievement goods, handling the 'independant value of affect' objection, and showing where each theory is internally consistent or not—along with the typical mistakes that should cost marks.

  Please put everything in a JSON object with exactly these keys: exam_question, model_answer, marking_scheme, comparison_table. The comparison_table should be a nested object with columns Theory, Verdict_on_Reverse_Machine, Verdict_on_Standard_Machine, Key_Weakness_Exposed, one row per theory. Don't include any bibliography or reading list—this is a closed-book exam and the model shouldn't need outside sources.
reasoning: |-
  We are creating a JSON object with four keys: exam_question, model_answer, marking_scheme, comparison_table.

  Exam Question:
  - The exam prompt should be aimed at a 60-minute essay (approx 800 words).
  - It should present the two cases: the standard experience machine (pleasures without real achievements) and the reverse experience machine (real achievements without any internal rewards/pleasures).
  - The question must ask students to evaluate how hedonism, desire-satisfaction, and objective-list theories would rank these two lives and why.
  - Specific points to cover: 
      - Why a hedonist might prefer the reverse-machine life (or reject it) despite the lack of affect?
      - How desire-satisfaction handles second-order desires (e.g., the desire to feel pleasure from achievements) going unsatisfied.
      - Whether objective-list theories can defend achievement as having value independent of experiential payoff.

  Model Answer:
  - Approximately 600 words.
  - Should address all three theories and both machines, making the required comparisons and highlighting the key issues.

  Marking Scheme:
  - Out of 25 points.
  - Should separate an A answer (e.g., 21-25) from a B (e.g., 16-20) by listing the specific conceptual moves each must include.
  - Also include typical mistakes that cost marks.

  Comparison Table:
  - A nested object (or an array of objects) with columns: Theory, Verdict_on_Reverse_Machine, Verdict_on_Standard_Machine, Key_Weakness_Exposed.
  - One row per theory (hedonism, desire-satisfaction, objective-list).

  Let's design each part accordingly.
