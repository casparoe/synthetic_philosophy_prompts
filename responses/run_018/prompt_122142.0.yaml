answer: |-
  Here’s a tailored exam question, model answer, and marking scheme designed to push students beyond recapitulation and into the conceptual tensions of adaptationism vs. spandrels. The rejected drafts follow the final version.

  ---

  ### **Final Exam Question**  
  **Topic: Adaptationism and Spandrels**  
  **Time Allotment:** 45 minutes | **Points:** 25  

  ---

  #### **Case Study: The Ash-Ram Skinks**  
  On the volcanic plateau of Pumicius, the burrowing skink *Squamatus ceraferox* ("Ash-Ram Skink") uses reinforced, fused cranial bones to ram through compacted ash. This fusion is an uncontested adaptation for burrowing. However, the bony struts constrict the optic nerve canal, causing severe visual acuity loss in adults. Sister species in soft soils (*Squamatus molliter*) lack fusion and retain acute vision.  

  *S. ceraferox* exhibits flamboyant, species-specific throat fans used in courtship. Females prefer brighter fans. Crucially, the visual system has been reconfigured: surviving neural tissue hyper-specializes in detecting the *exact wavelengths* reflected by conspecific throat fans. Olfactory bulbs are enlarged, compensating for vision loss. Thus, while acuity is poor, the visual system is well-tuned to mate recognition.  

  Stratigraphy complicates historical inference: in two outgroup species, skull fusion and acuity loss appear simultaneously in fossil beds. We lack evidence for a "spandrel window" where low acuity existed without compensatory tuning.  

  ---

  #### **Question**  
  Does the compensatory evolution of the visual system **rescue** Gould and Lewontin’s claim that low acuity is a spandrel, **undermine** it, or render the spandrel concept **inapplicable** to this case? Defend your position by addressing:  
  1. Whether the spandrel argument relies on detectable historical contingency or current functional irrelevance;  
  2. How compensatory adaptation interacts with the origin-vs.-maintenance distinction;  
  3. What this implies for testing adaptationist vs. spandrel hypotheses in systems where selection overwrites constraints.  

  *(Do not rehearse general debates about adaptationism. Engage the specifics of this case.)*  

  ---

  ### **Model Answer (Approx. 800 words)**  
  The compensatory evolution in *S. ceraferox* **undermines** the spandrel claim for low visual acuity. While the *origin* of acuity loss was likely a structural byproduct of skull fusion, its subsequent co-option for mate recognition transforms it into an exaptation with current adaptive value. This erodes Gould and Lewontin’s core requirement that spandrels be "non-adaptive" *at origin and throughout their persistence* [Specialist contention: Some argue spandrels need only be non-adaptive at origin, but G&L’s original formulation emphasizes *continuing* non-adaptiveness as definitive (e.g., spandrels as "architectural constraints" with no functional role)]. Here, compensatory evolution demonstrates that low acuity is now integral to a sensory system refined by selection. Calling it a spandrel ignores its contemporary function and conflates historical accident with current utility.  

  The spandrel argument relies on **detectable historical contingency**. Gould and Lewontin’s critique targets adaptationists for neglecting non-adaptive origins even when traits acquire functions later. However, they assume we can identify a phase where the trait was "non-adaptive baggage" [Consensus: This is central to their argument]. In *S. ceraferox*, stratigraphy obscures this phase: fusion and acuity loss co-occur in outgroups, and compensatory tuning likely arose rapidly. Without evidence of a "naked spandrel" period, we cannot confirm if low acuity was ever selectively neutral. Adaptationists can reasonably argue that the trait’s current integration into mate recognition suggests it was *always* co-optable (a "pre-adaptation"), reframing the "byproduct" as an adaptation-in-waiting [Specialist contention: This "always adaptive" move is controversial; many philosophers reject teleology here].  

  Compensatory adaptation **collapses the origin-vs.-maintenance distinction**. While philosophers distinguish a trait’s *origin* (spandrel) from its *maintenance* (exaptation), this case shows the two are empirically inseparable when selection overwrites history. The expansion of olfactory bulbs and neural retuning are *secondary adaptations* that mitigate the constraint, but they do not make the acuity loss itself adaptive. However, the visual system’s hypersensitivity to throat-fan wavelengths implies that low acuity is now a *necessary condition* for this efficiency [Specialist contention: Some would call this "compensatory spandrel scaffolding," while others see it as full co-option]. If acute vision were possible, the system might be *less* effective for fan detection. Thus, the constraint has been "burned in" by selection, making it functionally generative. This blurs G&L’s clean separation of adaptation and constraint.  

  For testing hypotheses, this case shows that **spandrels are fragile to erasure by selection**. When compensatory evolution obscures historical signals, the spandrel claim becomes untestable. Adaptationists can posit that *all* traits—even those arising from constraints—are optimizable, rendering spandrels a transient, unverifiable category [Specialist contention: This is a live debate; some argue spandrels remain valid as historical explanations]. Conversely, anti-adaptationists might counter that the spandrel’s *initial non-adaptive origin* still challenges the Panglossian paradigm, even if masked later [Consensus: G&L’s primary target was the ubiquity of adaptationist *storytelling*, not individual cases]. But without stratigraphic evidence of the "spandrel phase," the dispute defaults to speculation. Here, the burden of proof shifts: adaptationists can point to current utility, while spandrel advocates lack fossilized "smoking guns."  

  **Conclusion**: The spandrel concept is not inapplicable, but compensatory evolution undermines it by demonstrating that the trait has been absorbed into an adaptive complex. This resolves the debate by absorption into adaptationism—*not* clarification—because it suggests constraints are merely raw material for later optimization. [Specialist contention: Many anti-adaptationists reject this as a capitulation; they argue constraints channel evolution in non-adaptive directions.]  

  ---

  ### **Marking Scheme (Total: 25 points)**  
  1. **Position Clarity (4 pts)**: Explicitly states whether compensatory evolution rescues/undermines/invalidates the spandrel claim.  
     *→ Common error: Vague or multiple positions; no clear stance.*  
  2. **Historical Contingency (5 pts)**: Explains whether spandrels require detectable non-adaptive origins *and* persistence.  
     *→ Common error: Only discusses origin, ignoring G&L’s emphasis on persistent non-adaptiveness.*  
  3. **Origin vs. Maintenance (5 pts)**: Analyzes how compensatory evolution blurs this distinction (e.g., constraint becomes functional).  
     *→ Common error: Treats origin/maintenance as separable without addressing integration.*  
  4. **Testability (6 pts)**: Argues how evidence erosion affects hypothesis-testing (e.g., burden of proof, untestable spandrels).  
     *→ Common error: Assumes spandrels are testable via current utility alone.*  
  5. **Broader Implications (5 pts)**: Links case to adaptationism debate (e.g., does this favor adaptationist flexibility?).  
     *→ Common error: Generalizes without using case specifics.*  

  #### **Grading Bands**  
  - **A (21–25)**: Takes a clear stance; *uses the case to challenge G&L’s definitions*; acknowledges specialist contentions; explains why evidence erosion forces conceptual (not just empirical) choices.  
  - **B (16–20)**: Competent analysis but recapitulates debates; *fails to show how the case reshapes the spandrel concept*; misses testability implications.  
  - **C (11–15)**: Descriptive summary; misapplies terms (e.g., calls low acuity "an adaptation"); ignores compensatory evolution’s role.  

  ---

  ### **Rejected Drafts & Reasons**  
  **Draft 1: "Is low acuity a spandrel? Use the three forms of adaptationism to argue your case."**  
  *Rejection*: Invites rote taxonomy application. Students can list "empirical/methodological/explanatory adaptationism" without engaging the case’s novelty (compensatory evolution). Fails the "no memorized taxonomy" constraint.  

  **Draft 2: "Contrast how Gould & Lewontin vs. Maynard Smith would interpret the Ash-Ram Skinks, citing their real works."**  
  *Rejection*: Requires memorized scholarship ("who said what") and risks name-dropping. Violates the "no real citations" rule.  

  **Draft 3 (Winner)**: Forces confrontation with evidence erosion and conceptual tensions. Students *must* rebuild arguments around the case’s unique features.  

  ---

  This question forces students to grapple with **contingency erasure**, exposing how compensatory adaptation destabilizes G&L’s framework. The model answer flags live controversies (e.g., "always co-optable" vs. "pure constraint"), rewarding students who recognize philosophy in flux. The marking scheme prioritizes *conceptual synthesis* over recall.
