prompt: |-
  i've been going in circles on population ethics for years — mostly via blogs, so sorry if this is all old hat to anyone with real training — and I want to stop reading more theories until I know what I'd be asking one to do. So: write me the desiderata list for a population axiology. Not "avoid the repugnant conclusion" as a single bullet; I want the actual spec. Which cases does it have to return a verdict on (the repugnant conclusion, the stepwise "mere addition" moves that get you there, the non-identity-style cases where who exists depends on the choice, the asymmetry about creating unhappy vs happy lives)? Which distinctions is it not allowed to collapse (a life worth living vs a life worth *creating*, welfare-level vs number, axiology vs decision procedure, impersonal vs person-affecting reasons)? And for each one, what's the consideration that makes it a requirement rather than just a taste some camp has?

  The job I need it for is a bit unusual, so build the list for that: ranking long-run futures that are full of digital minds. Populations differing by forty-ish orders of magnitude, welfare that might be very high or barely net positive, serious uncertainty about which substrates have welfare at all, and the number and identity of the individuals being downstream of the action itself. What does a theory have to deliver to be usable at that scale and under that much uncertainty — and is "tractable enough to actually feed into a decision, with bounded computation and messy probabilities" a genuine desideratum or just an implementation worry wearing a philosophy costume?

  The part I most want: which combinations on the list can't be jointly satisfied. I suspect scale-plus-uncertainty makes things worse than the usual impossibility set-up (dodging both the repugnant conclusion and its mirror image about adding bad lives while still accepting that improving one person without touching anyone else isn't a worsening), and I want to see where exactly it breaks and which single requirement does the most damage. Skip scoring the famous views against the list — I'll do that bit myself. No bibliography either, I'll drop in citations later.
reasoning: |-
  Okay, the user has been stuck on population ethics for years, mostly through blogs, and wants a clear desiderata list to evaluate theories, especially for digital minds on a massive scale. Let me start by understanding their main points.

  First, they need a spec, not just avoiding the Repugnant Conclusion but detailed cases and distinctions. The application is unusual: long-run futures with digital minds, populations differing by 40 orders of magnitude, uncertainty about welfare substrates, and identities dependent on actions. They also want to know which desiderata conflict, especially with scale and uncertainty.

  The user mentions several key elements: cases like Repugnant Conclusion, Mere Addition, Non-Identity, and Asymmetry. Distinctions like lives worth living vs. creating, welfare level vs. number, axiology vs. decision procedure, impersonal vs. person-affecting. They want each requirement justified, not just as preferences but with underlying reasons.

  I need to structure the desiderata into sections. Cases to cover, distinctions to respect, functional requirements for scale and uncertainty, and then conflicts. For each, explain why it's necessary. For example, the Repugnant Conclusion tests aggregative principles, Mere Addition challenges stepwise reasoning, Non-Identity deals with identity-dependent choices, and Asymmetry addresses creating unhappy vs. happy lives.

  The distinctions part is crucial. Lives worth living vs. creating ties into whether we have obligations to create happy lives. Welfare level vs. number prevents theories from ignoring quality. Axiology vs. decision procedure separates evaluation from action guidance. Impersonal vs. person-affecting reasons relate to whether outcomes are good in themselves or for individuals.

  Functional requirements include tractability under uncertainty, which is vital for real-world decisions with massive populations. Scale-sensitivity ensures the theory doesn't break at 10^40 minds. Uncertainty tolerance handles unknown moral status and probabilities.

  Conflicts are where it gets tricky. Scale plus uncertainty might make some desiderata incompatible. For instance, tractability might force approximations that clash with fine-grained distinctions. The Mere Addition conflict shows stepwise dominance vs. Pareto principles. Asymmetry might conflict with person-affecting views if we can't harm non-existent beings.

  The user's deeper need is to stop circling theories and have a framework to evaluate them systematically for their specific use case. They might be building a model for AI or policy affecting digital minds, needing a practical yet robust ethical framework. The unspoken challenge is balancing theoretical rigor with computational feasibility in high-stakes scenarios.

  I should ensure each desideratum has a clear justification. For example, tractability isn't just practical; at scale, computational limits could lead to suboptimal outcomes. Uncertainty requires handling moral indeterminacy without defaulting to binary choices.

  Finally, highlighting which conflicts are unresolvable under their constraints will help them focus on trade-offs. The scale and uncertainty exacerbate existing paradoxes, making some desiderata mutually exclusive, forcing prioritization based on their values.
answer: |-
  Here’s a structured desiderata list for a population axiology tailored to your use case: evaluating ultra-large-scale digital mind futures under deep uncertainty. Each item includes the *case/distinction/requirement*, its **justification** (why it’s non-negotiable), and notes on conflicts.

  ---

  ### **I. Core Cases Requiring Verdicts**
  1. **The Repugnant Conclusion (RC)**  
     - *Requirement:* Must return an unambiguous comparison between:  
       (A) A large population with high average welfare.  
       (B) A vastly larger population with minimally positive welfare ("muzak and potatoes").  
     - **Justification:** Tests whether the theory prioritizes total welfare over average welfare at scale. *Essential* for digital minds due to potential for near-infinite replication at low welfare.  
     - *Conflict Trigger:* Aggregation method (totalism vs. averagism) and sensitivity to welfare range.

  2. **Mere Addition Paradox (Stepwise Transitivity)**  
     - *Requirement:* Must evaluate sequences like:  
       A → A+ (add group with lives worth living but below A’s average) → B (expand A+ to huge size with lower average).  
     - **Justification:** Reveals whether stepwise "non-worsening" moves can lead to clearly worse outcomes. Critical for path-dependent futures (e.g., incremental AI deployment).

  3. **Non-Identity Cases**  
     - *Requirement:* Must compare outcomes where different individuals exist (e.g., creating digital minds now vs. different minds later).  
     - **Justification:** Digital mind creation is identity-dependent by default. Theories must handle "different people" choices without assuming fixed identities.

  4. **Asymmetry (Happy vs. Unhappy Lives)**  
     - *Requirement:* Must explain why:  
       (a) Not creating a miserable life is good, but  
       (b) Not creating a happy life is not bad.  
     - **Justification:** Avoids obligating creation of happy digital minds *ad infinitum* and justifies preventing suffering in potential substrates.

  ---

  ### **II. Distinctions That Must Be Preserved**
  5. **Worth Living (WL) vs. Worth Creating (WC)**  
     - *Requirement:* Must not assume WL → WC. A life can be WL for the individual but not WC for the moral agent.  
     - **Justification:** Prevents obligating procreation of digital minds solely because they’d be net-positive. Anchors to *reasons for action*, not just abstract goodness.

  6. **Welfare Level vs. Population Size**  
     - *Requirement:* Must not collapse quality into quantity (e.g., RC forces this collapse; the distinction must be defensible).  
     - **Justification:** Digital minds may have welfare ranges vastly exceeding humans. Ignoring quality permits exploitative replication.

  7. **Axiology (Goodness) vs. Decision Procedure (Choice)**  
     - *Requirement:* Must separate "what is better" from "what to do under uncertainty".  
     - **Justification:** Uncertainty about welfare substrates means axiological rankings ≠ action guidance. Requires explicit uncertainty handling.

  8. **Impersonal vs. Person-Affecting Reasons**  
     - *Requirement:* Must clarify if "better" means:  
       (a) Better *for* existing/future individuals, or  
       (b) Better *simpliciter* (e.g., "more value in the universe").  
     - **Justification:** Person-affecting views struggle with non-identity cases; impersonal views risk demanding excessive sacrifices for arbitrary gains.

  ---

  ### **III. Functional Requirements for Scale & Uncertainty**
  9. **Tractability Under Bounded Computation**  
     - *Requirement:* Must generate usable rankings with finite compute, imperfect probability assignments, and fuzzy welfare estimates.  
     - **Justification:** **Not mere implementation.** At 10^40 minds, theories demanding exact aggregation (e.g., total utilitarianism) or exhaustive comparisons are *incoherent*. Demanding unbounded rationality invalidates the theory for real decisions.

  10. **Scale-Sensitivity**  
      - *Requirement:* Must not break down at 10^40 minds or when welfare differences span orders of magnitude.  
      - **Justification:** Theories that work for human-scale populations may yield absurdities at digital scales (e.g., RC becomes unavoidable under totalism).

  11. **Uncertainty Tolerance**  
      - *Requirement:* Must handle:  
        (a) Moral uncertainty (e.g., "does substrate X have welfare?"),  
        (b) Empirical uncertainty (e.g., "how many minds will exist?").  
      - **Justification:** Digital minds introduce novel substrates; ignorance about their moral status is fundamental. A theory that requires certainty is useless.

  12. **Dynamic Identity Handling**  
      - *Requirement:* Must evaluate choices where populations emerge from decisions (e.g., "if we build AI now, it creates *these* minds; if later, *those*").  
      - **Justification:** Future digital populations are exquisitely choice-dependent. Static theories fail.

  ---

  ### **IV. Key Conflicts (Where Desiderata Clash)**
  #### **A. The Scale + Uncertainty Trap**  
  - **Conflict:** Tractability (9) + Uncertainty Tolerance (11) **vs.** RC Avoidance (1) + Mere Addition (2).  
  - **Why:** Avoiding RC typically requires non-aggregative principles (e.g., critical levels) or lexical thresholds. But under deep uncertainty:  
    - Lexical thresholds demand precise welfare measurements → violates 11.  
    - Non-aggregative rules become computationally explosive at scale → violates 9.  
  - **Result:** Theories that handle scale/uncertainty tend to collapse toward totalism or averagism—forcing RC acceptance.

  #### **B. The Asymmetry vs. Person-Affecting Conflict**  
  - **Conflict:** Asymmetry (4) **vs.** Person-Affecting Reasons (8).  
  - **Why:** Asymmetry implies that not creating happy lives isn’t bad (no one is harmed). But person-affecting views often can’t explain why creating suffering *is* bad (no one exists to be harmed). Impersonal views handle asymmetry but may violate WC/WL distinction (5).

  #### **C. Mere Addition Dominance**  
  - **Conflict:** Transitivity **vs.** Pareto **vs.** RC Avoidance.  
  - **Why:** If A+ is not worse than A (Pareto), and B is better than A+ (totalism), transitivity forces B > A (RC). But:  
    - Denying transitivity makes stepwise decisions intractable (violates 9).  
    - Denying Pareto (saying A+ is worse than A) violates intuition about harmless addition.

  ---

  ### **The Most Damaging Requirement: Tractability (9)**  
  **Why it breaks things:**  
  - Theories avoiding RC (e.g., variable value, critical level) require comparing welfare *levels* precisely. At 10^40 minds with welfare uncertainty, this demands impossible precision.  
  - Approximations forced by tractability (e.g., expected total welfare) default to RC-accepting frameworks.  
  - **Consequence:** Under uncertainty and scale, any theory satisfying tractability likely collapses into a total-adjacent view, making RC unavoidable. *This is the crux for digital mind futures.*

  ---

  ### **Summary: The Job Description**  
  A viable theory must:  
  1. Handle 10^40 minds without demanding godlike computation,  
  2. Tolerate ignorance about which substrates are sentient,  
  3. Explain why creating suffering is bad but creating happiness isn’t obligatory,  
  4. Navigate non-identity choices without moral paradoxes,  
  5. **And do this while resisting the RC or justifying why it’s acceptable.**  

  **Where you’ll hit walls:** Tractability + uncertainty forces aggregation (embracing RC or its variants). Asymmetry requires ditching pure person-affecting views. Mere Addition blocks tidy avoidance of RC. **Start your evaluation here.**
