prompt: |-
  I'm a graduate student in a philosophy of biology seminar that has just worked through the standard unit-of-selection literature—gene-centered views, multi-level selection frameworks, and the familiar statistical-versus-causal distinction. The textbooks present the debate as largely resolved by hierarchical modeling, but I'm struck by applied domains where evolutionary individuation remains conceptually murky: microbiome medicine, where it's unclear whether selection targets the host genome, the microbial consortium, or an integrated metabolic network; synthetic ecosystem design, where engineers construct reproducing functional groups that don't map cleanly onto organisms; and evolutionary conservation, where policymakers must decide whether to preserve genetic diversity, population structure, or ecosystem-level functional roles. These aren't merely applications; they expose unresolved questions about what counts as a reproducer, how functional integration relates to evolutionary fate, and whether explanations at one level possess autonomous causal power.

  Assume a researcher has about three to four years, strong conceptual-analytic skills, and minimal wet-lab training. Which open conceptual problems within the units-of-selection debate deserve priority? Provide a defended agenda, not a survey: rank the two or three questions that are both tractable for a philosopher and upstream of these applied domains. For each, explain its dependency relations—what other conceptual issues must be settled first, and what downstream work it enables—together with the criteria you use to rank importance, tractability, and neglect. Specify what kind of conceptual or empirical result over the next few years would cause you to reorder the ranking. Do not provide a bibliography, reading list, or citation targets; I need reasoning about where limited effort should go and why.

  End with the prioritized agenda in fixed form: \answer{1. [brief label of top question]; 2. [brief label of second]; 3. [brief label of third]}
reasoning: |-
  Okay, let me approach this systematically. The user is a grad student in philosophy of biology who's studied the unit-of-selection literature but noticed conceptual gaps in applied domains like microbiome medicine and synthetic ecosystems. They want research priorities for a 3-4 year philosophical project that addresses unresolved issues about evolutionary individuation.

  First, I need to identify the core tensions in their description: they mention uncertainty about what counts as a reproducer (host genome vs microbial consortium), functional groups without clear organismal mapping, and conservation dilemmas about preserving genetic diversity versus ecosystem roles. These point to deeper conceptual problems about evolutionary individuality that the standard hierarchical models don't fully resolve.

  The key constraints are: philosophical methodology (conceptual-analytic skills, minimal wet-lab), focus on questions upstream of applied domains, and tractability within 3-4 years. I should avoid survey-style answers and instead defend a ranked agenda based on importance, tractability, neglect, and dependency relations.

  Looking at the unresolved issues they raised, three major clusters emerge:
  - The "functional integration problem" (how metabolic interdependence affects selection units)
  - The "reproducer identity problem" (defining boundaries for non-standard evolutionary individuals)
  - The "causal autonomy problem" (whether higher-level explanations have independent force)

  I'll need to evaluate which of these has the strongest leverage. Functional integration seems most urgent because it directly underpins microbiome and synthetic ecosystem cases, and has clear dependency paths. Reproducer identity is fundamental but may require settling functional questions first. Causal autonomy is important but might be more intractable without progress on the first two.

  For ranking criteria:
  - Importance: How many applied domains it affects and how fundamentally it challenges current models
  - Tractability: Whether philosophical analysis alone can make headway without new empirical data
  - Neglect: Whether the literature has underdeveloped aspects a philosopher could advance

  Functional integration scores high on importance (critical for microbiome/synthetic bio) and tractability (can build on existing causal modeling tools). Reproducer identity is highly important but slightly less tractable due to needing clearer functional criteria. Causal autonomy is crucial but may depend on resolving the other two.

  Dependency-wise: Functional integration work enables clearer reproducer definitions, which then clarify autonomy questions. If new microbiome studies show host-microbe co-metabolism driving fitness differences, that would boost functional integration's priority. If synthetic ecosystem experiments create clearly delineated reproducing groups, reproducer identity might jump ahead.

  The final agenda should be:
  1. Functional integration criteria for unit status
  2. Reproducer boundary conditions
  3. Causal autonomy tests for hierarchical explanations

  This ordering maximizes impact on the mentioned applied domains while respecting conceptual dependencies.
answer: |-
  Your diagnosis is sharp: applied pressures reveal unresolved foundations in evolutionary individuality. The hierarchical consensus provides statistical tools but dodges ontological questions about reproducer boundaries and causal primacy. Given your skills and timeframe, prioritize questions where conceptual clarification directly enables progress in those murky applied domains. I rank based on: **importance** (degree to which resolving it unlocks multiple applied dilemmas), **tractability** (susceptibility to conceptual analysis using existing empirical scaffolding), and **neglect** (underdeveloped in current philosophical engagement). Crucially, each priority must be *upstream*—solving it makes downstream applied analysis more coherent.

  1. **Functional Integration Thresholds for Evolutionary Individuality**  
     *Why this?* Microbiome medicine and synthetic ecosystems force the question: When does metabolic/developmental interdependence create a *new* unit of selection rather than a temporary consortium? Current "reproducer" criteria (inheritance, bottleneck, alignment of fitness) are necessary but insufficient here.  
     *Dependencies*: Requires settling **how functional interdependence translates to heritable fitness variance**. This means rigorously defining "integration" beyond mere interaction (e.g., quantifying fitness decoupling from lower-level components). Downstream, it enables policy decisions (e.g., conserving functional microbial networks vs. host alleles) and engineering principles (designing synthetic units with evolvable functions).  
     *Ranking justification*: Most important (central to host-microbe/synthetic cases), highly tractable (builds on causal models from MLS theory and symbiosis literature), neglected (philosophers focus on replication or conflict, not integration metrics).  
     *Reordering trigger*: Empirical quantification of "fitness entrainment" in synthetic ecosystems (e.g., engineered consortia where component fitness becomes inseparable from group output), forcing conceptual refinement.

  2. **Reproducer Boundary Conditions in Nested Systems**  
     *Why this?* Conservation and microbiome cases expose ambiguity: Is a coral reef selecting for *genes* in symbiotic algae, *holobiont persistence*, or *reef-level functional resilience*? We lack criteria for when a nested level becomes the *primary* reproducer despite lower-level heritability.  
     *Dependencies*: Requires resolving **whether reproduction must be spatially bounded** and **how to handle differential replication rates across levels** (e.g., fast-dividing microbes vs. slow hosts). Downstream, it clarifies conservation strategies (preserve genes, demes, or ecosystem processes?) and defines targets in microbiome therapeutics (manipulate host genotype or microbial community inheritance?).  
     *Ranking justification*: Critically important (resolves "what is being conserved/engineered?"), tractable (leverages multilevel selection formalisms but adds ontological rigor), neglected (boundary problems are often dismissed as "merely practical").  
     *Reordering trigger*: New models of epigenetic or ecological inheritance demonstrating decoupling of reproducer dynamics from genetic replication, demanding revised boundary criteria.

  3. **Causal Autonomy Tests for Higher-Level Units**  
     *Why this?* Policy and engineering need to know: Does preserving an ecosystem function have *explanatory power* independent of its genetic constituents? Can synthetic communities evolve in ways irreducible to parts? Current statistical decompositions (e.g., Price equation) don't establish causal independence.  
     *Dependencies*: Requires settling **what counts as a causal intervention distinct from lower-level manipulation** (e.g., altering group structure without changing member genotypes). Downstream, it validates or invalidates "ecosystem selection" in conservation and justifies targeting emergent functions in synthetic biology.  
     *Ranking justification*: Important (bears on explanatory practice), less tractable (entangled with general philosophy of causation), moderately neglected (overshadowed by statistical debates).  
     *Reordering trigger*: Experimental interventions in microbial communities that show group-level adaptations unexplainable by member-level selection, forcing autonomy criteria beyond heritability.

  \answer{1. Functional integration thresholds; 2. Reproducer boundary conditions; 3. Causal autonomy tests}
