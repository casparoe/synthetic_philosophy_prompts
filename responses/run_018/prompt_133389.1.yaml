  i've been sketching out notes for a short essay on why we value original paintings over perfect forgeries, and i think i've hit a weird tension. the usual story is authenticity or historical connection, but i want to argue that what's really doing the work is something like material negotiation — the idea that an original canvas records the specific physical resistance the artist actually encountered (paint cracking, canvas sagging, that sort of thing). a forgery, even a flawless one, is made with full knowledge of the result, so it never genuinely negotiates with the material.

  then i want to apply this to a contrived case: imagine a restoration studio uses AI-driven robotic arms to recreate a destroyed fresco, not from photos but by modelling chemical degradation of the original plaster and re-enacting the painter's gestures in real time with synthetic pigments that age identically. the result is chemically and visually indistinguishable, and it even includes simulated accidents of resistance — but they were programmed, not encountered.

  my claim is that even here we'd still favour the original (if it survived), because the value isn't just in the presence of resistance-marks, but in the artist actually being surprised by them. but i'm worried this collapses into a kind of intentionalism that i've already rejected elsewhere in the notes.

  could you read through these ideas and tell me where the argument is weakest? specifically, am i smuggling authorial intent throug the back door when i talk about surprise? also, is the fresco example to contrived, or does it actually sharpen the point? and do you think the material negotiation framing is interesting, or is it just a rebranding of standard authenticity arguments?

  feel free to be harsh — there's probably a typo or two i haven't spotted, and the writing's a bit rough.
