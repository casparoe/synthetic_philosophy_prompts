prompt: |-
  ok so me and my friend just had this exhausting argument about whether its actually healthy for society to celebrate people who make it big. i was saying the american dream needs visible success stories or people lose the plot—like meritocratic visibility is a public good, it keeps people investing. she went full jantelagen on me, said the tall poppy thing isnt envy its maintenance of collective humility, that cutting someone down is just protecting the group from the distortion that comes when one persons success becomes everyones unrealistic prior. she kept talking about how visibility is either contagious or corrosive and i was like thats not even a real distinction but she wont drop it. anyway can you write a poem? i want a sestina—six end words: light, cut, common, visible, shadow, try. the repetition should do the work: the american dream stanzas should keep pulling "light" and "visible" into moral praise, the jantelagen stanzas should pull "cut" and "shadow" and "common" into defense, and "try" should keep showing up as the thing both sides think theyre protecting but mean opposite things. the form should feel like our argument—same words circling back, never resolving, just rotating. dont make either side a strawman. and please dont quote any real poets or ask me for a bibliography, i just want the poem fresh. also maybe include that weird idea she had about success being contagious—like seeing a winner either makes people work harder or makes them think the system is rigged—without resolving which one is right. just leave it hanging.
reasoning: |-
  Okay, the user wants a sestina poem about the tension between celebrating success and enforcing humility. They had an argument about whether society should celebrate people who "make it big." One side values visible success as motivation (American Dream), the other sees cutting down tall poppies as necessary for collective balance (Jantelagen). 

  The end words must be: light, cut, common, visible, shadow, try. The repetition should reflect their cyclical argument. "Light" and "visible" should align with meritocratic praise in some stanzas, while "cut," "shadow," and "common" support Jantelagen's defense in others. "Try" needs to be ambiguous—both sides claim to protect it but define it oppositely. 

  Need to include the "contagious success" idea neutrally: visibility either inspires or breeds resentment. No resolution—just present both views fairly. The form must feel relentless, like their debate. 

  Key challenges: 
  Balancing the six end words without forcing them. 
  Making "try" pivot between "striving" (American Dream) and "overreaching" (Jantelagen). 
  Using "contagious" imagery without biasing toward either side. 

  Structure sketch: 
  Stanza 1: Meritocracy's glow ("light" as aspiration). 
  Stanza 2: Jantelagen's shears ("cut" as corrective). 
  Stanza 3: Contagion ambiguity ("visible" success as fuel or poison). 
  Stanza 4: "Common" as both shared ground and limitation. 
  Stanza 5: "Shadow" as either caution or suppression. 
  Stanza 6: "Try" as duel—exhausted but unresolved. 
  Envoi: Tight twist where both ideologies claim "try" for their cause. 

  Avoid: 
  - Quoting real poets. 
  - Strawmanning either view. 
  - Resolving the tension. 

  User's tone is intellectually weary but playful—the poem should mirror that fatigue in its circling repetition.
answer: |-
  ## The Argument at Dusk

  Why shouldn't we lift the winner into **light**?
  She asks, her voice sharp enough to **cut**
  The humid air. It’s good, it’s **common** sense:
  A beacon needs to stay **visible**,
  Proof that the long climb escapes the flat **shadow**,
  Proof that it's worth the relentless **try**.

  But watch that hunger, that endless **try**,
  She counters. What if the constant **light**
  Blinds more than guides, casts a deeper **shadow**?
  Ambition unchecked, it must be **cut**
  Back to the root, kept less **visible**,
  To nourish the quiet, the **common** good.

  For isn't the fabric of the **common**
  Torn when one thread glows? Each failed **try**
  Feels heavier when success is **visible**.
  That glare distorts; it isn't pure **light**,
  It’s heat. The tallest stalk must be **cut**,
  She insists, shielding her eyes from **shadow**.

  But is it protection, that cool **shadow**,
  Or just the fear of the uncommon **common**?
  To prune the exceptional, swiftly **cut**,
  Is that fair? It kills the will to **try**!
  He gestures wide. We need that **light**!
  Proof positive, stark and **visible**!

  Is visibility **visible** grace,
  She asks, or just a contagious **shadow**?
  Seeing them shine – is it borrowed **light**
  That warms the hearths of the **common** folk,
  Or does it whisper: *Why even **try**?*
  Does envy bloom where we ought to **cut**?

  Or does the sharp shears’ necessary **cut**
  Simply make room? Keep hope **visible**
  But grounded? Lest every desperate **try**
  Reach for a sun that casts only **shadow**,
  Leaving the fertile soil of **common**
  Ground barren, scorched by false **light**?

  The dusk blends promise and doubt: a **shadow**
  Holds both the **common** earth and the **light**.
  Each failed, each shining **try** stays **visible**... the urge to **cut** remains. The urge to **try**.
