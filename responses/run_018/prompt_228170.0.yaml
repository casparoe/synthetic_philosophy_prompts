prompt: |-
  A friend who's really into Bayesian epistemology explained van Fraassen's Reflection principle to me like this: "The idea is that you should defer to your future self. If you know that tomorrow your credence in something will be 0.9, then rationality requires you to set your credence to 0.9 today, because your future self will know more than you do now, so refusing to defer is like betting against the better-informed person. Van Fraassen backs this up with a Dutch book: if your future credences are predictable and different from your current ones, someone can construct a set of bets you're guaranteed to lose money on, which shows that changing your mind without getting new evidence is incoherent. Basically Reflection plus conditionalization forces rational agents to only ever update on new evidence."

  I mostly buy the betting part but something about the "your future self knows more" rationale bugs me -- like, what if I know I'm about to get drunk and my credences will be all over the place? Anyway: which parts of his summary would a van Fraassen fan accept, which parts get the principle or its motivation subtly wrong, and does the punchline about conditionalization actually follow from Reflection? If some of what he said is contested rather than settled, flag that too.
reasoning: |-
  Okay, let me tackle this user's query about van Fraassen's Reflection principle. The user's friend explained it as deferring to your future self because they'll know more, backed by a Dutch book argument. But the user is skeptical, especially in cases like getting drunk where future credences might be unreliable. 

  First, I need to recall what Reflection actually says. Van Fraassen's principle requires that your current credence in A equals your expectation of your future credence in A. It's not just about matching a known future credence but an expected value. The friend's summary oversimplifies by implying you always match a specific future credence. 

  The "future self knows more" part is tricky. Van Fraassen's original idea is that your future self has at least as much information, but the user brings up a valid counterexample with getting drunk. Reflection assumes rationality of the future self; if you know you'll be irrational tomorrow, the principle doesn't apply. Van Fraassen fans would stress this condition, which the friend's explanation missed.

  The Dutch book argument is correctly mentioned as motivation. If your credences don't satisfy Reflection, a bookie can exploit you over time. But again, this assumes future rationality. The user's betting intuition is solid here, but the exception cases matter.

  The part about conditionalization—does Reflection force updating only on new evidence? The friend links Reflection with conditionalization, but that's not direct. Reflection ensures coherence between time-sliced credences, while conditionalization is about updating rules. They're complementary but not the same. Van Fraassen sees them as part of a rational package, but they aren't logically equivalent. Some like Christensen argue they address different aspects.

  The user's concern about predictable irrationality is spot-on. Cases like drunkenness or cognitive decline show Reflection isn't absolute. Van Fraassen acknowledges this with the rationality clause. The friend's summary missed this nuance, making it sound unconditional.

  I should also note controversies. Some philosophers, like Talbott, think Reflection is too strong. Others debate if it applies to self-aware learners. The principle is more about synchronic coherence than diachronic rationality per se.

  Finally, the punchline about "only updating on evidence" is a broader epistemological claim. While Reflection and conditionalization together support that view, Reflection alone doesn't enforce conditionalization. Van Fraassen combines them to argue against non-evidential updates, but it's not a logical derivation.

  So, the user needs clarifications on: the expectation vs. specific credence, the rationality assumption, the conditionalization link, and the exceptions. Highlighting where the friend was close but oversimplified, especially the "knows more" rationale without caveats.
answer: |-
  Here's a breakdown of your friend's summary, highlighting what van Fraassen fans would accept, where it gets things subtly (or not-so-subtly) wrong, and the status of the punchline:

  **What Your Friend Got Right (Broadly Van Fraassen-Compatible):**

  1.  **Deference to Future Self:** The core idea of Reflection *is* a principle of deference to your future credences.
  2.  **Dutch Book Motivation:** Van Fraassen absolutely uses a Dutch Book argument to motivate Reflection, showing that predictable shifts in credence without new evidence can lead to guaranteed losses.
  3.  **Link to "Changing Mind Without Evidence":** Reflection is explicitly designed to rule out shifts in belief *not* driven by new evidence (or conditionalization).
  4.  **Goal: Only Update on Evidence:** Van Fraassen's overall project aims to characterize rationality as requiring agents to update beliefs *only* upon acquiring new evidence, via conditionalization. Reflection plays a key role in this by constraining how you view your future beliefs.

  **Where Your Friend's Summary Gets Van Fraassen Subtly (or Significantly) Wrong:**

  1.  **"If you know that tomorrow your credence... will be 0.9":**
      *   **The Problem:** Reflection isn't primarily about knowing a *specific, fixed* future credence. It's about your *current expectation* of your future credence.
      *   **The Correct Formulation (Simplified):** Your current credence in proposition A *now* should equal your current expectation of what your credence in A will be at some future time t. Formally: **P_now(A) = E_now[ P_t(A) ]**
      *   **Why it Matters:** You rarely know your *exact* future credence with certainty. Reflection requires that your current best estimate (expectation) of your future credence *is* your current credence. If you know it *will be exactly 0.9*, then your expectation *is* 0.9, so P_now(A) must be 0.9. But the principle applies even under uncertainty about the precise future value.

  2.  **"Your future self will know more than you do now":**
      *   **The Problem:** This is a *common rationalization* but **not** van Fraassen's core justification. It's potentially misleading and creates the opening for your "getting drunk" objection, which is valid.
      *   **Van Fraassen's Focus:** His primary justification is the Dutch Book argument demonstrating *incoherence* in the betting dispositions across time if Reflection is violated. The principle is framed as a *synchronic* constraint on your current beliefs *about* your future beliefs, ensuring coherence *now* in how you view your epistemic trajectory. He emphasizes *diachronic coherence*.
      *   **The "Knows More" Assumption:** Van Fraassen *does* include a crucial qualification often overlooked: **Reflection applies only if you are certain that at time t, you will be rational and remember your current evidence.** (He might frame it as your future self having at least your current total evidence). **This directly addresses your "getting drunk" counterexample.** If you know you'll be drunk (and hence irrational or forgetful) at t, you are *not* certain of your future rationality, so Reflection *does not require* you to adopt that future credence now. Van Fraassen fans strongly emphasize this qualification. The "knows more" idea is often a *consequence* of rationality + conditionalization + no forgetting, not the direct foundation of Reflection itself.

  3.  **"Refusing to defer is like betting against the better-informed person":**
      *   **The Nuance:** While the Dutch Book shows it's like betting against *someone* (the bookie exploiting your predictable shift), the "better-informed person" gloss risks conflating the justification. The incoherence comes from the *internal* conflict in your own belief structure over time, revealed by the Dutch Book, *not* necessarily from an external comparison to a better-informed agent (especially if your future self might be irrational or forgetful).

  **The Punchline: Does Reflection Plus Conditionalization Force Updating Only on Evidence?**

  *   **Van Fraassen's Goal:** Absolutely yes. This is the central point of his project in works like "Belief and the Will" and "Belief and the Problem of Ulysses and the Sirens".
  *   **How it Works:**
      1.  **Conditionalization:** Dictates *how* you update *when* you get new evidence E: P_new(A) = P_old(A | E).
      2.  **Reflection:** Dictates that *without* getting new evidence (or forgetting), your credences shouldn't *plan* to change. If you expect your credence to be different tomorrow *without* new evidence, Reflection is violated.
  *   **Does it Logically *Force* it?** Within van Fraassen's framework, the combination is presented as defining what it means to be a rational, coherent diachronic agent who only updates on evidence. He argues that violating either principle leads to incoherence (via Dutch Books). So, for van Fraassen, **yes, adhering to both principles *is* what it means to only update on evidence.** It's constitutive of the concept of rational updating he defends.
  *   **Contested?** This overarching goal and the role of Reflection in achieving it *is* van Fraassen's specific position. However, the *necessity* and *sufficiency* of these principles for defining "updating only on evidence" are debated:
      *   Some argue Reflection is too strong (see below).
      *   Some argue other principles might be needed or that conditionalization alone, under certain interpretations, might suffice.
      *   The definition of "evidence" itself can be contested.

  **Contested Aspects & Your Drunkenness Point:**

  1.  **Rationality Assumption:** While van Fraassen explicitly includes the future rationality clause, how it should be applied is debated. Is it enough to *not be certain* of future irrationality, or must you be *certain* of future rationality? How do you model self-doubt about future rationality? Your "getting drunk" case is a classic and widely accepted *counterexample where Reflection should not apply*. Van Fraassen fans agree.
  2.  **Strength of Reflection:** Many philosophers (e.g., David Christensen, Adam Elga) argue that Reflection, even with the rationality clause, is too strong:
      *   **Learning You'll Be Irrational:** What if you learn you *will* be irrational at t? Should you still set P_now(A) = E_now[P_t(A)]? Van Fraassen says no, but specifying the principle precisely to handle such cases is tricky.
      *   **Self-Undermining Evidence:** What if you get evidence suggesting your future self is misled *even though rational* (e.g., evidence you'll be hypnotized to rationally believe something false based on fabricated "evidence")? Should you defer? Modified versions of Reflection (e.g., "New Reflection") have been proposed.
  3.  **Scope:** Does it apply to all propositions? Van Fraassen suggests it applies to propositions about which you are an "epistemic authority" for your future self. Does it apply to propositions *about* your future credences themselves? This gets complex.
  4.  **Link to Conditionalization:** While van Fraassen presents them as a package deal, they are distinct principles. It's possible (though arguably irrational in van Fraassen's view) to satisfy one without the other. Reflection doesn't *logically entail* conditionalization, nor vice-versa. They are presented as complementary pillars of diachronic coherence.

  **In Summary:**

  *   **Accept:** Deference core, Dutch Book motivation, goal of ruling out non-evidential changes, overall goal of updating only on evidence.
  *   **Correct:** The formulation needs to be in terms of *expectation* (E_now[P_t(A)]) not just known specific values. The **critical qualification about future rationality/memory** was missing from your friend's summary and is essential to handle your drunkenness case. The "knows more" rationale is a common but potentially misleading oversimplification; the core justification is diachronic coherence via Dutch Books.
  *   **Punchline:** Van Fraassen **does** argue that Reflection + Conditionalization *define* what it means for a rational agent to update *only* on new evidence. This is central to his epistemology. However, the *necessity* and *sufficiency* of these specific principles for that goal, and the precise formulation of Reflection (especially handling future irrationality/self-doubt), are actively debated areas in formal epistemology. Your drunkenness counterexample is valid and highlights the crucial importance of the future rationality clause.
