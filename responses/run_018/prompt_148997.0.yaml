answer: |-
  ## Fanatic's Recursion  
  "The expectation never closes,"  
  I calibrate my credence, bit by bit,  
  "The world is not a wager."  

  At every order, I must contemplate  
  the chance my measure's skewed—I must admit.  
  "The expectation never closes,"  

  So I insure the bet to compensate  
  for flaws the higher ledger might omit.  
  "The world is not a wager."  

  Now infinite regress lies in wait:  
  a stair of stakes I scale, though unfit.  
  "The expectation never closes,"  

  For finite minds to calculate.  
  Still up I climb, refusing to acquit.  
  "The world is not a wager."  

  The prize gleams past a golden gate,  
  yet each new tier demands I double it.  
  "The expectation never closes,"  
  "The world is not a wager."  

  ---

  ### Note  
  **Settled**: Unbounded expected value (EV) can dominate finite stakes under standard utility theory—any non-zero probability of infinite payoff outweighs all finite concerns. This isn't *inherently* controversial.  

  **Contested**:  
  - Whether "infinite utility" is coherent (vs. a shorthand for limits or ordinal comparisons).  
  - Whether self-calibration at "every order" implies literal meta-bets *ad infinitum* (in practice, agents truncate; the poem exaggerates this to a physical climb).  
  - Moral frameworks that reject EV maximization (hence the skeptic's refrain).  

  **Liberties**: The poem treats recursive self-doubt as spawning new *bets* rather than credence updates. Real agents might adjust priors or use hierarchical models, not place infinite wagers. Also, "double it" oversimplifies the recursion's structure—it's evoking explosive growth, not literal doubling.  

  (*Deliberate vibe typos: "acquit" stretched for rhyme; "skewed—I must admit" conversational dash.*)
