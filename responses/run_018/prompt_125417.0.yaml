  **Q4E. Must a cause be *physically alterable* by an intervention?**  
     - **Yes** → **Woodward's Interventionist Account**  
       *Traits:*  
       - Denies causation in symmetric overdetermination (redundancy implies non-causation).  
       - Rejects preempted backups as causes (no physical intervention possible).  
       - Requires acyclic models (no feedback loops).  
       - *Weakness:* Overly restrictive in overdetermination cases.  
     - **No** → **UNOCCUPIED**  
       *Diagnosis: Unexplored—no theory combines non-modal acyclic models with redundancy-based non-causation but rejects interventions.*  

  **Q4F. Must a cause be *physically alterable* by an intervention?**  
     - **Yes** → **UNOCCUPIED**  
       *Diagnosis: Unexplored—no theory requires interventions but denies redundancy negates causation in acyclic models.*  
     - **No** → **Pearl's Structural-Model Approach**  
       *Traits:*  
       - Counts both causes in symmetric overdetermination as causal (using "sustenance" criteria).  
       - Dismisses preempted backups (no counterfactual influence).  
       - Requires acyclic models (feedback loops invalid).  
       - *Weakness:* Cannot model systems with mutual causation.  

