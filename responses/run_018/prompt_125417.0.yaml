  ### **How to Use This Tree**  
  1. **Answer Q1 based on intuition**: Does causation rely on "other possible worlds" or tangible interventions?  
  2. **Proceed through branches**: Each question resolves a problem case (e.g., Q3 handles overdetermination).  
  3. **Reach a leaf**: Match commitments to theories (or note gaps in the literature).  

  **Key Insights**:  
  - **Lewis** relies on possible worlds and rejects interventions.  
  - **Woodward** demands interventions and denies causal status in overdetermination.  
  - **Pearl** uses structural equations but bans cycles.  
  - **Hybrid** adopts structural equations without cycles or modal realism.  
  - Unoccupied leaves reveal tensions (e.g., cycles + interventions) or underdeveloped ideas.
