       - Handles preemption via "quasi-dependence" (backup causes lack counterfactual dependence).  
       - Treats symmetric overdetermination as causal (both rocks cause the shatter).  
       - Rejects feedback loops (requires acyclic time).  
       - *Weakness:* Struggles with preemption if backups are physically possible.  

