  **Decision Tree: Theories of Causation**  
  *Based on responses to three problem cases:*  
  1. **Symmetric Overdetermination**: Two physically identical, redundant potential causes (e.g., two identical rocks shatter a window; either alone would suffice).  
  2. **Preemption**: A backup cause is structurally present but physically impossible in the actual world (e.g., a backup assassin is ready but never acts due to the main assassin’s success).  
  3. **Feedback Loops**: Causation involves non-acyclic dependencies (e.g., thermostat-heater interactions with mutual influence).  

  ---

  ### **Tree Structure**  
  **Start Here:**  

  1. **Is causation fundamentally a relation that depends on comparing what happens in *other possible worlds* (e.g., "what if" scenarios unrealized in our universe)?**  
     - **Yes** → Go to Q2A  
     - **No** → Go to Q2B  

  ---

  #### **Branch A (Cross-world modal relation: Yes)**  
  **Q2A. Must causal models avoid feedback loops (i.e., require a "no cycles" constraint) to represent real causation?**  
     - **Yes** → Go to Q3A  
     - **No** → Go to Q3B  

  **Q3A. In symmetric overdetermination, if the model shows both causes are redundant, does this *automatically* mean neither is a real cause?**  
     - **Yes** → Go to Q4A  
     - **No** → Go to Q4B  

  **Q4A. Must a cause be *physically alterable* by an intervention (e.g., in practice or principle) to count as causal?**  
     - **Yes** → **UNOCCUPIED**  
