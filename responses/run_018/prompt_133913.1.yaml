answer: |-
  Here’s a direct conceptual comparison of the two frameworks, focusing on their coherence for transitional governance and their capacity to preserve the reality of moral wrong:

  ### Core Structures & Moral Accounting
  1.  **Dirty Hands (DH):**
      *   **Structure:** Tragedy concentrated in the *individual conscience*. The actor commits a necessary evil (X), acknowledging it violates a fundamental moral norm (Y). The "dirt" is an inescapable, personal moral residue.
      *   **Moral Accounting:** The cost is paid *immediately and existentially* by the actor. Guilt is intrinsic to the act itself. Responsibility is non-transferable; the stain is permanent. The victim's suffering is recognized by the actor’s enduring burden. It emphasizes the *irreducible contradiction* inherent in the act: necessity doesn't erase wrongness; it compounds it existentially.

  2.  **Deferred Institutional Culpability (DIC):**
      *   **Structure:** Tragedy distributed across *time and institutions*. The actor commits X (violating Y) but locates the *full moral reckoning* not within herself, but within a mandated *future process* (investigations, tribunals, constitutional reforms, reparations). The act is a debt incurred by the *transitional project itself*, payable by its future institutional manifestations.
      *   **Moral Accounting:** The actor acknowledges the wrong (X violates Y) but argues the *culpability for the moral failure* belongs ultimately to the *system* being built, not solely to her. She acts as a *trustee* of the future, taking on a moral debt the *institutions* must later settle. Responsibility is *temporally deferred* and *structurally distributed*. The stain is real but *provisionally held* by the actor until the future institutions assume their share.

  ### Coherence in Transition: DIC's Edge & Its Critical Test
  *   **DH's Problem in Transition:** DH is existentially coherent but politically brittle for nascent governance. It risks paralyzing actors facing cascading necessities. Concentrating immense guilt on individuals navigating chaos can lead to nihilism, burnout, or self-justification that *does* rationalize the stain away, contradicting DH's core premise. It struggles to account for the *systemic* nature of transition – the need to build mechanisms *for* handling past wrongs.
  *   **DIC's Strength:** DIC offers a *procedural architecture for responsibility* that aligns with the core task of transition: *building legitimate institutions*. It acknowledges the wrong while offering a path forward *through* the institution-building process. It transforms the immediate moral burden into a *fiduciary duty*: the actor is obligated not just to act now, but to *ensure* the future institutions capable of bearing the deferred culpability come into being. This makes it structurally coherent with the project of establishing a new order.
  *   **The Critical Test: Preserving the Stain & Honoring Victims:** DIC's coherence hinges on two non-negotiable elements:
      1.  **The Actor Must Remain Marked:** DIC **only** works if the actor *personally acknowledges the moral failure as hers in the moment* and accepts this as a permanent scar on her conscience *even as* she defers the *institutional* culpability. She says: "I did this wrong thing. This marks me. But this act is also a debt against the future state we *must* build, and it *must* be settled there, publicly, for the sake of the victims and the legitimacy of the new order." The deferral is a *structural strategy*, not an *existential escape*. The personal stain remains; the institutional culpability is an *additional* burden placed on the future.
      2.  **The Future Must Be Real, Not Imagined:** DIC collapses into self-deception if the "future institutions" are vague promises or performative gestures. The actor must be *actively, concretely building the scaffolding* for those reparative assemblies, truth commissions, and constitutional courts *simultaneously* with authorizing the dirty acts. The violence is not aestheticized if the deferral is coupled with tangible, immediate steps creating the *capacity* for future reckoning. Honoring victims requires that the deferred culpability process is designed *for them* – with their participation, centering their testimony and needs – not as a bureaucratic exercise. If the future reckoning is guaranteed to be robust and victim-centered, DIC *can* honor victims by making their suffering the *foundational justification* for building the new institutions meant to address it.

  ### Why DIC is More Coherent for Transitional Governance (With Caveats)
  DIC provides a *governance logic* that DH inherently lacks. Transition *is* about deferral – from violence to law, from arbitrary power to procedure, from vengeance to justice. DIC explicitly incorporates this temporal dimension into its moral architecture. It recognizes that the legitimacy of the new order *depends* on its capacity to handle the sins of its own birth. By structurally linking the dirty act to the *obligation* to build reparative institutions, DIC creates a self-binding mechanism: the actor who violates principle Y to save the transition *must* become the fiercest advocate for the future institution that will judge that violation according to Y.

  **However, DIC's coherence is precarious:**
  *   It fails utterly if the actor uses it to *avoid* personal anguish ("The future will handle my guilt").
  *   It becomes a cruel joke if the future institutions are weak, corrupted, or never materialize.
  *   It aestheticizes violence only if the future process is designed for catharsis of the *perpetrators* or the *new elite*, not the restoration of the victims.

  ### Conclusion for Your Novel
  For the provisional council, **Deferred Institutional Culpability offers the more structurally coherent framework**, precisely because it mirrors the transitional project itself: trading immediate, unbearable moral burdens for the *promise* (and active construction) of future institutional legitimacy. It provides a language and a *duty* beyond personal despair.

  **But its power for your character lies in its tension with Dirty Hands.** Her tragedy is that she *must* operate within DIC's logic to govern effectively and prevent collapse, yet she *feels* the inescapable DH stain. Her internal conflict stems from holding both simultaneously: the rational, structural deferral *and* the searing, personal guilt that cannot be deferred. The narrative tension arises from whether the DIC framework she relies on will hold – will the institutions be built? Will they truly reckon? Or will her personal DH burden become the only enduring truth, revealing DIC as a necessary, noble, yet ultimately self-deceiving lie told to survive the ungovernable present? The victims are honored only if her belief in DIC drives her to build institutions worthy of the culpability she defers to them. If that belief falters, or the institutions fail, the deferred culpability evaporates, leaving only the dirty hands – and the victims betrayed anew.
