answer: |-
  Good morning. It’s a privilege to welcome such a diverse group – clinicians confronting the profound distress of depersonalization, and researchers dissecting the architectures of self and awareness. Our shared ground, and our working premise for these two days, is this: **subjective experience is an interface.** Not a window onto raw mental states, but a dynamic, constructed representation – a self-model – presented *as if* it were direct, unmediated presence. This is the "user illusion" of consciousness: highly functional, evolutionarily advantageous, but fundamentally an artifact of representational machinery operating largely behind the scenes.

  This premise shapes everything we do here. It means we treat first-person reports – the anguish of feeling "unreal," the descriptions of detachment – with utmost seriousness as *phenomena demanding explanation*, without treating them as infallible glimpses into hidden, non-representational truths. Conversely, we take the intricate mechanics of predictive processing, self-modeling, and representational hierarchies with profound respect, without reducing the felt urgency of lived experience to mere computational noise.

  Our shared vocabulary begins here:
  *   **The Self-Model:** The integrated representation of being an embodied agent persisting through time.
  *   **Transparency:** The hallmark of the healthy interface – the self-model’s constructed nature is hidden; it *feels* like the irreducible "I," the direct ground of experience. We inhabit it, unaware of its scaffolding.
  *   **Opacity:** When the interface malfunctions. The machinery becomes perceptible. The constructed nature of the self-model becomes apparent, leading to the core complaint: unreality, detachment, observing oneself from afar. This is the terrain of depersonalization – not a revelation of a deeper "true" self, but a specific **breakdown in model-transparency**.
  *   **Predictive Processing:** The framework within which we understand this interface. The brain generates models predicting sensory input and interoceptive signals. Transparency arises when these predictions are highly confident and largely accurate; opacity, when there’s significant, persistent prediction error, particularly regarding the self and its states, forcing the underlying generative process into awareness.

  Our task for this workshop is precise, ambitious, and grounded in this shared lens: **To map the architecture of self-awareness by examining where and why this interface fails.** We won't claim direct access to anyone’s inner world, nor will we pretend to bridge the ultimate explanatory gap. Instead, we will rigorously correlate:

  1.  **The Clinical Phenomena:** The specific textures of reported unreality, emotional numbing, and detachment – not as mystical experiences, but as *symptoms signaling specific loci of representational failure.*
  2.  **The Computational & Phenomenological Structures:** How predictive hierarchies might generate these specific failures. Where in the architecture – in interoceptive prediction, agency attribution, narrative continuity, or sensorimotor integration – does transparency break down, resulting in the felt sense of opacity characteristic of depersonalization?

  By focusing on the *breakdown*, we gain privileged insight into the *normal functioning* of the self-model interface. The clinician’s detailed observations of suffering provide the critical data points. The theorist’s models offer potential mechanistic explanations. Our goal is not consensus for its own sake, but a genuine, rigorous convergence: identifying points where the phenomenology of distress and the mechanics of model failure align.

  Let’s begin the essential work of understanding the fragile, vital illusion of being a self, by exploring the moments when it falters. Welcome, and thank you for bringing your distinct, crucial expertise to this shared challenge.
