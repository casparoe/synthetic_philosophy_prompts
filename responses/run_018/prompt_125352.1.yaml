answer: |-
  Here’s a structured opening address honoring your colleague’s legacy while rigorously engaging both audiences. The philosophical argument drives the structure, practical concerns are addressed head-on, and the tone balances warmth with intellectual substance.

  **(Begin with warmth and context)**
  "Good morning. We gather not just to mark a retirement, but to celebrate a career that reshaped how we think about minds, medicine, and morality. For decades, Dr. [Name] has been our field’s indispensable provocateur – not for destruction’s sake, but for clarity’s. Her target? A seemingly innocuous line: the distinction between psychiatric *therapy* restoring ‘normal function’ and *enhancement* pushing beyond it. Today, we honor her most potent weapon against this divide: exposing how ‘species-typical functioning’ is not a biological bedrock, but a Trojan horse smuggling values into science."

  **(Introduce the core conceptual move)**
  "Her central insight was disarmingly simple, yet revolutionary: **‘Restoration to species-typical functioning’ is not a neutral biological given, but a statistically derived baseline implicitly loaded with normative judgments.** We don’t discover ‘typical function’ like a fossil; we *define* it through measurements and averages. We take bell curves of attention spans, mood stability, or cognitive processing speed, point to the middle, and declare: *Here lies the human essence*. Therapy, then, becomes whatever nudges someone *toward* that statistical center. Enhancement is whatever pushes them *beyond* it. Sounds objective, doesn’t it? But as [Name] relentlessly argued, this statistical center is treated not just as *common*, but as *correct* – as how minds *ought* to work."

  **(Explain why this collapses the distinction - Not "all enhancement," but "therapy is already normative")**
  "This is why the therapy-enhancement distinction crumbles under her scrutiny. **It collapses not because all therapy is secretly enhancement, but because ‘therapy’ itself already presupposes a deeply contested normative standard.** When we ‘restore’ a depressed patient to ‘typical’ mood range, we aren’t just fixing broken biology; we’re endorsing a societal ideal of emotional resilience calibrated to a statistical average. When we ‘treat’ ADHD with stimulants to achieve ‘typical’ focus, we aren’t merely correcting a deficit; we’re valorizing an attention span deemed optimal within specific contexts – often classrooms or workplaces demanding sustained, linear concentration. The baseline isn’t innocent biology; it’s a value judgment disguised as a measurement."

  **(Address the Clinicians' Practical Worry - Resource Allocation)**
  "I see our clinician colleagues shifting. The immediate, vital question arises: **‘If this boundary dissolves, how do we gatekeep? How do we allocate scarce stimulants, therapies, or diagnostic slots without chaos?’** This isn’t an abstraction; it’s the daily weight you carry. Abandoning the therapy-enhancement distinction *doesn’t* mean throwing open the gates to limitless enhancement on demand. It means we must shift our justification – from an illusory *biological* line to explicit, transparent *ethical* and *pragmatic* criteria grounded in current realities.

  **Instead of asking ‘Is this deficit restorative?’, we ask:**
  1.  **What is the magnitude of suffering or functional impairment?** (Severe distress or inability to meet basic life demands weighs heavily).
  2.  **What is the individual’s capacity to flourish?** (Can this intervention unlock significantly greater agency, well-being, or contribution?).
  3.  **What are the risks and benefits, including societal impacts?** (Safety, equity, potential for coercion).
  4.  **What resources are truly available?** (Scarcity forces tough prioritization, but based on need and potential impact, not an arbitrary ‘normal’).

  This is harder. It demands nuanced judgment, open ethical deliberation, and humility about our biases. But it’s honest. It doesn’t hide behind a statistical masquerade of biological objectivity. It acknowledges that medicine *always* involves value choices. [Name] didn’t leave us without tools; she forced us to use better ones."

  **(The Bridge Analogy - And Its Limits)**
  "Think of it like maintaining a bridge. **Therapy-as-restoration is like repairing the bridge to its *original design specification* – say, a 10-ton load limit.** Enhancement might be reinforcing it to handle 20 tons for heavier modern traffic. On the surface, the distinction seems clear: repair vs. upgrade. And if the original specs were perfect, divinely ordained blueprints, this might hold.

  **But [Name]’s work shows us the flaw: In psychiatry, the ‘original specifications’ for the human mind *don’t exist in a pure, value-neutral form*.** Our ‘species-typical baseline’ *is* that contested specification! It wasn’t handed down; it was averaged out. Declaring repair (therapy) as merely ‘returning to spec’ ignores that the spec itself – that 10-ton limit – reflects past values, past environments, and past judgments about what loads were ‘normal’ or ‘necessary.’ Maybe the original engineers never imagined today’s traffic. Maybe their ‘adequate’ safety margin was dangerously thin by our standards. Fixating solely on restoring the *old* spec might be negligent when the world has changed.

  **Where the analogy fails us is precisely here:** Unlike an engineered bridge, psychiatry lacks an uncontested, objective ‘design document’ for the mind. There’s no original manufacturer’s schematic free from cultural imprint. Our ‘baseline’ is inherently interpretive and value-laden. Disputes over whether someone needs ‘repair’ or requests ‘enhancement’ are often disputes over *which* specification – whose vision of a ‘properly functioning mind’ – should apply in a complex, evolving world."

  **(Conclusion - Honoring the Dissent)**
  "So, as we honor Dr. [Name] today, we honor the rigor of her dissent. She didn’t just attack a distinction; she exposed the hidden architecture of values beneath our clinical language. She challenged clinicians to see the normativity in their ‘restoration,’ and philosophers to grapple with the messy reality where concepts meet prescription pads. She reminded us that **defining ‘health’ is never just science; it’s a profoundly human conversation about who we are, who we suffer as, and who we aspire to be.**

  Her legacy isn’t a world without boundaries, but a world where we draw them consciously, transparently, and with deep respect for the diverse ways human minds navigate this demanding world. For that clarity, that courage, and that indispensable disruption – thank you, [Name]. May your retirement be as stimulating, and as wonderfully *atypical*, as your career." (Warm applause)

  **Why this works:**
  *   **Structure:** Core conceptual move → Why it collapses the distinction → Direct answer to clinician worry → Clarifying analogy + its limits → Inspirational close.
  *   **Tone:** Respectful, honors dissent as necessary rigor ("indispensable provocateur," "rigor of her dissent"), avoids lecturing by focusing on *her* contribution.
  *   **Philosophy as Engine:** The argument about the baseline being normative is the central pillar, not decoration. It drives the critique and the response to clinicians.
  *   **Clinician Address:** Directly names their worry ("I see our clinician colleagues shifting"), offers a concrete alternative framework (4 criteria), acknowledges the difficulty ("harder," "demands nuanced judgment").
  *   **Analogy Use:** Serves two purposes – clarifies the core argument *and* addresses resource allocation. Explicitly noting its limits strengthens credibility.
  *   **Accessibility:** Avoids jargon. Concepts like "statistical baseline," "normative standard," and "value judgments" are explained contextually. The bridge analogy is concrete.
  *   **Time:** Structured for ~15 minutes when spoken at a measured pace, allowing pauses for emphasis.
  *   **Unifying Close:** Focuses on her contribution to a necessary *conversation*, relevant to both philosophers (concepts) and clinicians (practice).
