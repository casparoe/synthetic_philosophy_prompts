prompt: |-
  I'm delivering the opening address at a retirement symposium for a bioethicist who spent her career attacking the therapy-enhancement distinction in psychiatry. The audience is split between clinicians who still use the distinction to gatekeep access to cognitive stimulants and philosophers who regard it as normatively bankrupt. Structure the speech around one specific conceptual move she championed: treating "restoration to species-typical functioning" not as a biological given but as a statistical baseline that smuggles value judgments into medical description. Use this to show that the distinction collapses not because all treatment is secretly enhancement, but because "therapy" already presupposes a contested normative standard of how minds ought to work. You must address the clinicians' practical worry—if the boundary dissolves, on what basis do we allocate scarce resources?—without simply reinstating the distinction. Close with an analogy, such as repairing a bridge to its original load specification versus reinforcing it for heavier traffic, then explicitly note where that image fails to capture psychiatric baseline disputes. The tone should honor rigorous dissent without turning the occasion into a lecture; aim for roughly fifteen minutes of spoken material that both halves of the room can follow, with the philosophical argument doing real structural work rather than serving as decoration.
