prompt: |-
  My advisor's calls on cooperation in evolutionary games are pretty clear: one-shot prisoners dilemma with perfect info, she says no cooperation evolves; iterated direct reciprocity with no error, yes tit-for-tat dominates; fixed spatial grid with local interaction and mutation, yes if clustering coefficient is above about 0.3; kin selection in a single round with genetic markers, yes but only within siblings; indirect reciprocity with full public history but zero cost to false reputation reporting, she says it collapses. Now there's this new setup: iterated prisoner's dilemma on a scale-free network that rewires each round, agents can only observe second-order neighboors, and there's a hidden shadow-debt for defection that accumulates silently then hits everyone at once after crossing a threshhold. Will she say cooperation survives? I'm less interested in the yes/no than in the rule she's actually running — is it about information reach, network stability, or punishment visibility — and what other rules fit her past verdicts equally well. Also, what's the one extra case that'd best tell those rules apart?
reasoning: |-
  Okay, the user is asking about their advisor's approach to predicting cooperation in evolutionary games. They've listed several scenarios with clear outcomes: no cooperation in one-shot PD, tit-for-tat in iterated games without errors, cooperation on spatial grids if clustering is high enough, kin selection only among siblings, and indirect reciprocity collapsing without reputation cost. Now they're introducing a new setup with a scale-free network that rewires, limited observation to second-order neighbors, and a hidden shadow-debt that triggers a collective punishment. They want to know if their advisor would predict cooperation survives, but more importantly, they want to uncover the underlying rule the advisor uses—whether it's about information reach, network stability, or punishment visibility. They also want other possible rules that fit the past verdicts and an extra test case to differentiate between them.

  First, I need to parse the advisor's past verdicts to identify patterns. The one-shot PD with perfect info has no cooperation—here, there's no future interaction, so defection dominates. Iterated direct reciprocity without error leads to tit-for-tat; here, repeated interactions allow for reciprocity. The fixed spatial grid requires a clustering coefficient above 0.3, which suggests that network structure enabling clusters of cooperators is key. Kin selection only within siblings points to genetic relatedness as the driver. Indirect reciprocity failing without cost for false reputation indicates that reliable information is necessary. 

  Looking at the new scenario: scale-free network with rewiring, limited observation (only second-order neighbors), and a hidden shadow-debt. The rewiring means the network isn't stable, which might disrupt reciprocity. Limited observation reduces agents' ability to track reputations beyond immediate neighbors. The shadow-debt is hidden and only triggers a collective punishment after a threshold. Since it's silent, agents can't adjust their behavior based on the accumulating debt, making it ineffective as a deterrent. 

  The advisor's underlying rule seems to hinge on whether agents can reliably detect and respond to defection. In cases where they can (like iterated games with direct reciprocity or spatial grids with high clustering), cooperation survives. Where they can't (one-shot, unreliable reputation), it fails. The shadow-debt's invisibility means agents can't see the punishment coming, so they won't cooperate to avoid it. Thus, the advisor would likely say cooperation doesn't survive here. 

  Other possible rules that fit past verdicts could be network stability or punishment visibility. Network stability would explain why fixed grids work but rewiring networks might not. Punishment visibility is crucial in the shadow-debt case. To differentiate, the user needs a test case where information reach is high but network stability is low. For example, an iterated game on a rewiring network with full observation and immediate punishment. If cooperation survives, information reach is key; if not, network stability matters more.
answer: |-
  Based on your advisor's past verdicts and the new setup, here's the breakdown:

  1.  **Advisor's Likely Verdict for the New Setup:** **No, cooperation does NOT survive.**
  2.  **The Rule She's Running:** **"Explicit, Reliable, and Actionable Feedback for Defection is Required."** This rule prioritizes whether agents can consistently *detect* defection (or its direct consequences) *and* effectively *respond* to it (through punishment, reciprocity, or spatial clustering) *within their operational scope*.

  **Analysis of Past Verdicts through this Rule:**

  *   **One-shot PD (Perfect Info):** Feedback exists (detection is perfect) but is not actionable (no future interaction). ➔ **No Cooperation.**
  *   **Iterated PD (No Error):** Feedback is explicit, reliable, and actionable via TFT. Defection is detected immediately and punished next round. ➔ **Cooperation (TFT).**
  *   **Fixed Spatial Grid (High Clustering):** Feedback is localized but reliable. Defection is detected by neighbors, and clustering allows cooperators to benefit each other while being relatively shielded from defectors. Punishment is spatial isolation/loss of benefits. Actionable through local interactions and selection. ➔ **Cooperation.**
  *   **Kin Selection (Siblings):** Feedback is implicit via shared genes. "Punishment" for defection against kin is reduced inclusive fitness. Actionable only when relatedness (r) is high enough (here, siblings: r=0.5). Explicit detection isn't required, but the genetic feedback loop is reliable *within kin groups*. ➔ **Cooperation (within kin).**
  *   **Indirect Reciprocity (No Cost for Lying):** Feedback (reputation) is explicit but **unreliable**. False reporting destroys the reliability of the reputation signal. Agents cannot reliably detect *true* defectors or trust reputations. Actionable feedback collapses. ➔ **Collapse.**
  *   **New Setup (Rewiring SFN, 2nd-Order Obs, Shadow Debt):** Feedback on defection is **neither explicit nor actionable** for individual agents.
      *   *Rewiring SFN:* Destabilizes direct reciprocity clusters and local reputations built on 2nd-order observation. Past interactions/neighbors change.
      *   *2nd-Order Observation:* Limits reputation building/indirect reciprocity scope. Cannot reliably track distant defectors.
      *   *Hidden Shadow-Debt:* Critical flaw. The "punishment" is **hidden** and **collective**. Agents cannot:
          *   *Detect* the accumulating debt caused by their own or others' defections.
          *   *Link* the eventual catastrophic punishment to specific defection events or agents.
          *   *Adjust* their behavior *proactively* to avoid triggering the punishment on an individual level. It's an unpredictable, non-credible threat from the agent's perspective.
      *   The rule fails: Feedback is not explicit, reliable, or actionable for individual agents. Defection remains tempting with no clear, immediate, personal consequence. ➔ **Cooperation Collapses.**

  **Other Plausible Rules Fitting Past Verdicts:**

  1.  **"Stable Interaction Structures Required":** Explains success in Iterated (fixed pairs), Spatial Grids (fixed neighbors), Kin (fixed relatedness). Explains failure in One-shot (no structure), Indirect Reciprocity-Collapse (reputation structure unstable without truthfulness), New Setup (rewiring destroys stability). *Fits all cases.*
  2.  **"Punishment Must Be Visible & Attributable":** Explains success in Iterated (punishment visible/attributable next round), Spatial (local punishment visible), Kin (genetic "punishment" visible via fitness). Explains failure in One-shot (no punishment possible), Indirect-Collapse (reputation punishment ineffective if signal false), New Setup (punishment hidden/collective). *Fits all cases.*
  3.  **"Sufficient Local Information for Strategy Enforcement":** Explains success in Iterated (full history), Spatial (local neighbors), Kin (relatedness signal). Explains failure in One-shot (no future info), Indirect-Collapse (reputation info corrupted), New Setup (local info insufficient due to rewiring + hidden debt + limited 2nd-order scope). *Fits all cases.*

  **The Discriminating Extra Case: Iterated PD on a Highly Rewiring Network with Full Global Observation and Immediate, Individual Punishment.**

  *   **Setup:** Standard Iterated PD. **BUT:** The interaction network completely rewires randomly every round. **HOWEVER:** Every agent observes the *full global history* of every other agent. Defection against *anyone* incurs an *immediate, certain, and significant personal cost* (e.g., a fine deducted right after the defection act, visible to all).
  *   **Prediction Differences:**
      *   **Advisor's Rule (Explicit/Actionable Feedback):** **YES, Cooperation.** Defection is reliably detected (full global history) and punished *immediately & individually* regardless of rewiring. Feedback is explicit and actionable: "Defect now = Lose points now, visibly."
      *   **Stable Interaction Structures Rule:** **NO, Cooperation.** The constant rewiring destroys any stable pairwise or local group structure necessary for reciprocity or spatial mechanisms. Punishment exists but the *enforcement mechanism* (reciprocity/clustering) is unstable.
      *   **Visible & Attributable Punishment Rule:** **YES, Cooperation.** Punishment is highly visible, immediate, and directly attributable to the specific defection act. Rewiring is irrelevant to this direct link.
      *   **Sufficient Local Info Rule:** **Ambiguous/Leans YES.** "Local" info isn't needed here; *global* info is available. The rule might need refining, but the critical info for enforcing cooperation (who defected, punished immediately) is available globally.

  **Conclusion:** Your advisor's core heuristic appears to be the necessity of **explicit, reliable, and actionable feedback mechanisms against defection** within the agents' operational environment. The hidden, collective nature of the shadow-debt in the new setup violates this principle completely, leading to the prediction of collapse. The discriminating case pits network stability against the visibility/attributability of punishment under global information, helping to isolate whether stability or feedback clarity is her primary driver (the feedback rule predicts cooperation survives the discriminating case).
