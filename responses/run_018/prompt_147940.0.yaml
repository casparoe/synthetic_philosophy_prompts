  There's a weird split in how modern labor law treats rest. You've got the 35-hour caps and 'right to disconnect' rules that treat leisure as protected negative space—time the boss can't invade. Then you've got Japan's karoshi system, which only compensates death-by-overwork if overtime hit precise epidemiological thresholds, framing overwork as a statistical health risk rather than a rights breach. Meanwhile Protestant-inflected culture still treats idle time as moral failure even where the law protects it. And here's the kicker: in several countries workers can legally waive hour caps for a buyout premium, treating leisure as sellable, while state campaigns frame it as an inalienable human right.

  What philosophical commitments about work, leisure, and autonomy does this messy triple system preseuppose? Reconstruct the implicit theory: is leisure a negative liberty, a welfare good, or just recovery-time for labor-power? Does the karoshi threshold logic presuppose a probabilistic, risk-curve view of harm that clashes with the intentionalist framing of labor contracts? Is the buyout option compatible with leisure being inalienable?

  Say whether these parts actually depend on one consistent view or on rival ones, and flag where the practice is philosophically underdetermined. Then tell me what a genuinely unified policy would have to change—would it kill overtime exemptons, redefine leisure as non-instrumental, or drop the statistical causation model?

  Write it in these sections: 'The reconstructed theory' (~250 words), 'Coherence and tension' (~200 words), 'Strict presupposition vs. compatibility' (~150 words), 'What unified reform looks like' (~150 words). Keep it conceptual—no citations, no reading list, just argue from the practice itself.
