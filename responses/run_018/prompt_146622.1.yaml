  Alternatively, to avoid the complexity of running a new process, we can have the build script v1 generate the new build script v2, and then immediately import and use the v2 module to generate the program and the documentation. This is a reflective operation.

  **Build Script v1:**
  ```python
  # build.py (v1)
  import sys

  version = 1

  def generate_docs():
      return f"# Build Process\nThis build uses version {version}. Steps: A, B."

