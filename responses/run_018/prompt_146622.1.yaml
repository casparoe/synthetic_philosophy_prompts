  ### Scenario: A Reflective Build System with Code Generation

  **System Overview:**
  We have a build system that uses a build specification (e.g., a `build.py` script) which:
  1. **Frame**: The build specification (`build.py`) defines the build steps and also includes a code generation step.
  2. **Outer Message**: The build system generates documentation (say, `README.md`) that describes the build process and the generated code.
  3. **Inner Message**: The build system produces an executable program (say, `program.exe`).

  The twist: the code generation step in the build script produces a new version of the build script itself. This creates a circular dependency and an opportunity for divergence.

  **Concrete Setup:**
  - The build script (`build.py`) has a version number and a step that generates a new build script for the next build. It also generates the main program and the documentation.
