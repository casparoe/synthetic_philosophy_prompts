          f.write(generate_new_build_script())

      # Step 2: Generate the program using the current (v1) functions? 
      # But we want the program to be generated by v2? 
      # Instead, we are going to simulate: we generate the program by v2's generate_program, but we haven't run v2's code yet.
      # Let's import the generated build_next as a module? (This is reflection)

      # We write the new build script to a file and then import it.
      import build_next

      # Now, generate the documentation using the current (v1) generate_docs?
      with open('README.md', 'w') as f:
          f.write(generate_docs())   # This uses v1 -> writes about steps A, B and version 1.

      # Generate the program using the new build script's (v2) generate_program?
      with open('program.py', 'w') as f:
          f.write(build_next.generate_program())   # This uses v2 -> writes code that says "Built by v2 and better!"

