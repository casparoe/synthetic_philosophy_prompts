  Now, after running the build with v1, we have:
  - `README.md` (outer message): contains the documentation generated by v1, which says the build uses version 1 and steps A, B.
  - `program.py` (inner message): contains code generated by v2, which when run will print "Built by v2 and better!".
  - The new `build.py` (v2) is written and will be used for the next build.

  **The Divergence:**
  - The frame (original specification) is v1 of the build script.
  - The outer message (documentation) was generated by v1 and describes the build as v1.
