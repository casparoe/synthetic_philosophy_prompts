answer: |-
  Here's the teaching plan, built for tired brains and science-first minds:

  **The Dependency Chain (~150 words):**
  1. **People feel real sadness for fictional characters.** (Start obvious: *"Ever cried at a movie? That feeling is real, right?"*)
     * *Why needed:* Grounding in common experience. Without acknowledging the *feeling* is genuine, there's no puzzle.
  2. **People know the characters/events are fictional.** ("*But you also know Luke Skywalker isn't real, and Tatooine isn't a place you can visit, yeah?*")
     * *Why needed:* Establishes the intellectual awareness. The paradox hinges on the *tension* between #1 and #2. If they thought it was real, no paradox. If they didn't feel sad, no paradox.
  3. **Emotions like sadness usually require believing something bad is happening to a real being.** ("*We generally feel sad *about* something we believe is true and matters, like a friend's pet dying.*")
     * *Why needed:* Sets up the "rational" expectation. This is the norm against which the fictional sadness seems weird.
  4. **THE PARADOX:** How can #1 (real sadness) be true when #2 (knowing it's fake) directly contradicts the usual condition #3 (requiring belief in reality)? It feels irrational on the surface.

  **The Carrying Case (~200 words):**
  **The Scenario:** Use an **interactive AI drama game.** Players shape the story through choices. Focus on a moment where, *due entirely to the player's (or AI's random) choices*, a genuinely sympathetic AI-generated character suffers a tragic, undeserved fate (e.g., sacrifices themselves based on your earlier reckless decision, gets falsely accused because of procedural bad luck). Emphasize:
  *   **No Human Author:** There's no J.K. Rowling or George Lucas who *intended* this specific emotional punch. The AI combined narrative fragments based on code/rules/your input. The sadness isn't "planted" by a human mind.
  *   **Uniqueness:** This specific tragic moment might never have happened before and might never happen again exactly like this. It's emergent.
  *   **Sympathetic Character:** The character *feels* real within the story's context – has goals, fears, maybe helped you earlier.
  *   **Why Sharper?** It cuts off the easy escape: "I'm sad because the *author* wanted me to imagine this real suffering." Here, the suffering feels "accidental" or procedurally generated, making your sadness seem *even more* irrational – like crying over a unique, random cloud shape. There's no single mind whose "intention" you're mirroring.

  **Misconceptions in Order (~250 words):**
  1.  **"People just forget it's fake in the moment (Suspension of Disbelief)."**
      *   *When it comes up:* Likely right after stating the paradox (#4).
      *   *Head off:* "Okay, but *during* the sad scene, if I paused the AI drama and asked you 'Is this character a real person?', you'd instantly say 'No, it's AI-generated code.' You *know* it's fake *while* feeling sad. Suspension of Disbelief is about immersion, not actual belief." (Reinforce simultaneous awareness from #2).
  2.  **"We're sad for the actor/visuals, not the character."**
      *   *When it comes up:* When discussing the feeling (#1) or the AI example.
      *   *Head off:* "But in our AI drama, there *is* no actor! It's maybe a generated avatar or just text. Your sadness is directed at *'Kael the Loyal Android'* and *his* specific sacrifice in *this* story, not a real person or pretty graphics." Focus on the *fictional entity* as the target.
  3.  **"It's not *real* sadness; it's just a mild reaction/being emotional."**
      *   *When it comes up:* When validating the feeling (#1) or describing the AI moment.
      *   *Head off:* "Have you ever yelled at a sports game? Felt a genuine lump in your throat during a sad scene? That physiological reaction *is* real emotion, even if the trigger is fictional. We're not talking about sobbing for days, but that pang *is* real sadness." Connect it to bodily responses they know.
  4.  **"It's practice for real life / evolutionary leftover."**
      *   *When it comes up:* When trying to resolve the paradox.
      *   *Head off:* "Maybe! But that explains *why* we *can* feel it, not how it *isn't irrational* given we *know* it's fake *right now*. The paradox is about the logical tension *in the moment*: knowing X is false but feeling emotion Y that typically requires believing X is true." Keep focus on the immediate contradiction.

  **The Check (~100 words):**
  **Task:** *"Pair up. One of you argues that feeling sad for Kael the Android in our AI drama is totally irrational because we know he's not real. The other argues that it's NOT irrational, even knowing he's fake and there's no author. Use the points we discussed. Go!"*
  *   **Why it works:** Forces them to articulate both the paradox (irrational side) and the counter-argument (not irrational, the emotion is real and directed at the *idea*). Success means they can rehearse the core tension without defaulting to "AI is spooky."

  **What to Leave Out (~100 words):**
  *   **Deep dive into "Suspension of Disbelief":** Mention it exists as a concept people *think* resolves it, but quickly explain why it doesn't fully solve the paradox (as above). Don't get bogged down in definitions.
  *   **Complex Theories of Emotion (e.g., Cognitivism vs. Perceptual theories):** Way too much. Stick to the basic paradox structure: real feeling + knowledge of fiction = apparent contradiction.
  *   **Authorial Intent (as solution):** That's *why* we're using the AI case! Briefly contrast it ("Old answer: the author makes us imagine real suffering. New twist: No author!") but don't spend time defending intentionalism.
  *   **Evolutionary/Practice Theories:** Acknowledge them as possible *origins* if asked, but stress they don't dissolve the *logical tension* experienced in the moment, which is the core paradox.
