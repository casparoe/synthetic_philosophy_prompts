prompt: |-
  hey — I'm on this small committee that has to write inclusion criteria for a welfare register: a list of the systems whose experiences, if there are any, an institution has to take into account before it builds, copies, throttles, or switches them off. Wet animals are on it by default. After that it gets murky, and every meeting goes in circles because somebody shows up with a different theory of consciousness and we end up arguing about that instead. So before I read any more of these theories, I want the spec: what does a theory have to deliver to be usable for this?

  Not a theory of consciousness in general. Specifically: given some physical system doing something we can describe computationally, which of the computations it can be described as doing carry moral weight, and how much. Write me the requirements list, with the case or consideration behind each requirement, and say which ones are non-negotiable for our purpose versus which are just one camp's preferences dressed up as requirements.

  Cases that have actually come up in our meetings, so please make sure your list bites on these:

  - an emulation copied exactly and run twice: two patients, or one patient twice over? does the answer change if the copies drift apart after a minute?
  - one brain emulated across two datacenters, with the link latency stretched from milliseconds to a month to a year: at what point is it two computations instead of one, and what happens to the moral weight in between?
  - the same transition table as a working emulation, but every state change is driven by someone outside turning a crank: is it computing anything, and does it matter who's turning the crank?
  - the same emulation's dynamics run in reverse, so the counterfactual structure is intact but the causal arrow points the other way
  - a frozen emulation on a disk that is never run but could be, versus one that is run but whose internal states are overwritten immediately and whose outputs are discarded unread
  - the nation-of-people-passing-notes setup, but with only two people in it: if a billion is a mind, is two?
  - a brain whose neurons are replaced one at a time with chips that reproduce each one's input-output function exactly: I need something said at every step of the swap, or an admission of where the theory goes quiet
  - a system that is right on the inside but can't move anything, and its mirror image, a giant lookup table that is behaviorally flawless
  - a next-token prediction model that reports pain in every situation we test and whose reports we can't tell apart from ours

  Two things I especially want. First, the attribution problem: any old heap of matter can be described as implementing a lot of formal descriptions, so the theory has to say which descriptions are the morally real ones and what makes them real — and it can't just say all of them, or that the answer is whatever we decide to project. Second, tell me if any subset of your own requirements can't be jointly satisfied. That's the part I most want to see, because if e.g. substrate independence, determinate verdicts for every physical system, and no-trivial-realizations can't all hold, then our register needs a tie-breaking rule and I'd rather know now.

  Also flag which single requirement knocks out the most popular candidate views. And tell me which distinctions people in this area collapse that they shouldn't: having status versus how much, the computation versus the hardware running it, the system versus the process, whether moral status can even be vague when our register needs a yes or no.

  The view I keep half-defending in meetings is that the morally relevant part of a system is whatever causal structure you'd have to preserve to keep its future responses counterfactually robust under perturbation — the would-still-have-flinched test. Put it on your list somewhere and tell me whether it's a genuine desideratum or just functionalism with extra steps.

  Keep the weight on the criteria, not on scoring the theories, but a short scorecard at the end for the functionalist-ish family, the biological or naturalistic family, and the integrated-information family is fine, a few lines each. Table is fine. Don't bother naming papers, I want the arguments. And please write it like you're talking to someone who has to defend the criteria to a room of people who disagree, not to a seminar.
reasoning: |-
  We are constructing a set of requirements for a theory of consciousness that can be used to determine moral weight for the purpose of inclusion in a welfare register. The focus is on computational descriptions of physical systems and which computations (if any) carry moral weight. We must address the listed cases and ensure the requirements handle the attribution problem (which descriptions are "real") and note any conflicts between requirements.

  Key issues from the cases:
  1. Emulation copied and run twice: identity and moral weight when copies are identical vs. when they drift.
  2. One brain emulated across two datacenters with increasing latency: when does it split into two, and what happens to moral weight during the transition?
  3. Transition table driven by an external crank: does it compute, and does the operator matter?
  4. Reverse emulation: causal arrow reversed but counterfactual structure intact.
  5. Frozen emulation vs. run but overwritten: does potential vs. actual execution matter?
  6. Nation of people passing notes with only two people: at what scale does it become a mind?
  7. Gradual replacement of neurons with chips: when does moral status change?
  8. Systems that are internally right but can't move (paralyzed) vs. a lookup table that is behaviorally flawless.
  9. Next-token predictor that reports pain indistinguishably.

  Additionally, we must address:
  - Attribution problem: which formal descriptions are morally real? Not all, and not just by projection.
  - Conflicts: which requirements cannot be jointly satisfied?
  - Flag a requirement that knocks out many views.
  - Which distinctions are often collapsed but shouldn't be (e.g., having status vs. how much, computation vs. hardware, system vs. process, vagueness in moral status vs. binary decision).
  - Evaluate the user's proposed view: moral weight from causal structure that preserves counterfactual robustness (the "would-still-have-flinched" test).

  We'll build the requirements list with:
  - The requirement.
  - The case or consideration behind it.
  - Mark whether non-negotiable (for the register's purpose) or negotiable (camp's preference).

  After the list, we'll note conflicts and provide a short scorecard for functionalist, biological, and integrated information theories.

  ---

  **Requirements for a Theory of Moral Weight Attribution in Computational Systems**

  1. **Non-Trivial Realization (Non-negotiable)**  
     *Requirement:* The theory must not attribute moral weight to every physical system that can be interpreted as implementing a computation (e.g., a rock cannot be said to be conscious just because we can interpret its state as representing a complex computation).  
     *Case:* The attribution problem. Any heap of matter can be described as implementing many computations. We need to avoid trivial realizations.  
     *Why non-negotiable?* Without this, the register would include almost everything, making it useless.

  2. **Substrate Independence (Non-negotiable)**  
     *Requirement:* The theory must allow that the same computation (or morally relevant aspect) can be implemented on different physical substrates (e.g., silicon, biological neurons).  
     *Case:* Gradual replacement of neurons with chips. The theory must remain consistent regardless of the physical medium.  
     *Why non-negotiable?* The register must cover emulations and artificial systems, not just biological ones.

  3. **Determinate Verdicts (Non-negotiable)**  
     *Requirement:* The theory must provide a definite (even if complex) answer for every physical system about whether it has moral weight and how much, without relying on vagueness that cannot be resolved for the binary decision of the register.  
     *Case:* The frozen emulation vs. run but overwritten, and the two-datacenter split. The register requires a yes/no for inclusion, so the theory must avoid irreducible vagueness.  
     *Why non-negotiable?* The register must make binary inclusion decisions.

  4. **Causal Efficacy (Non-negotiable)**  
     *Requirement:* The computation must be causally active in the system; it must not be a mere description. The system's behavior must depend on the computation actually being carried out.  
     *Case:* The crank-driven system. If an external operator is turning the crank, the system isn't computing on its own. Also, the frozen emulation (if never run) vs. the run but overwritten one (if running but having no effect).  
     *Why non-negotiable?* Without causal efficacy, we might attribute moral weight to systems that are merely static or driven entirely externally, which would lead to over-inclusion.

  5. **Counterfactual Robustness (Negotiable? But the user's view)**  
     *Requirement:* The morally relevant computation must be characterized by its counterfactual robustness – i.e., how it would respond under perturbations.  
     *Case:* The user's "would-still-have-flinched" test. Also, the reverse emulation: if run in reverse, the counterfactual structure might be the same but the causal arrow is reversed.  
     *Why negotiable?* This is a specific view (like functionalism) and might not be accepted by all. However, it addresses the need for causal structure that supports counterfactuals. We'll note that it might be functionalism with extra steps (it emphasizes preservation under perturbation).

  6. **Identity and Continuity (Non-negotiable)**  
     *Requirement:* The theory must specify when a computation is the same over time and when it splits or merges. It must also address whether copies are distinct.  
     *Case:* The emulation copied and run twice (with and without drift), and the two-datacenter split.  
     *Why non-negotiable?* The register needs to know if two instances are two patients or one, and when one becomes two.

  7. **Scalability (Non-negotiable)**  
     *Requirement:* The theory must not require a minimum scale (like a billion people) to attribute moral weight. It must be able to handle small systems.  
     *Case:* The nation-of-people with only two people. If a billion is a mind, is two? The theory must not arbitrarily require large numbers.  
     *Why non-negotiable?* Arbitrary scale cutoffs would lead to inconsistencies.

  8. **Internal vs. Behavioral (Non-negotiable)**  
     *Requirement:* The theory must distinguish between internal computational processes and mere behavioral outputs. It must not rely solely on behavior.  
     *Case:* The lookup table that is behaviorally flawless but has no internal computation, and the paralyzed system that has internal states but no output.  
     *Why non-negotiable?* The register must include systems that have the right internal states even if they can't express them (like paralysis) and exclude systems that mimic behavior without the internal processes.

  9. **Distinction Between Moral Status and Degree (Non-negotiable)**  
     *Requirement:* The theory must separate the question of whether a system has any moral status (yes/no for inclusion) from how much moral weight it has (which might be continuous).  
     *Case:* All cases, but especially because the register must first decide inclusion and then possibly degree.  
     *Why non-negotiable?* The register is about inclusion, so we need a binary decision. Degree is important but secondary.

  10. **Process vs. System (Non-negotiable)**  
      *Requirement:* The theory must attribute moral weight to the ongoing process (the computation happening now) and not to the static system that could support it.  
      *Case:* Frozen emulation on a disk (never run) vs. run but overwritten. The frozen one is not currently a process.  
      *Why non-negotiable?* Moral weight requires current experience, not potential.

  11. **Irreversibility of Time (Negotiable?)**  
      *Requirement:* The theory must not attribute moral weight to a computation run in reverse, even if the counterfactual structure is the same, because the causal arrow is reversed.  
      *Case:* The reverse emulation.  
      *Why negotiable?* This might be a specific view. Some theories might treat time-symmetrically, but our moral intuitions are tied to forward causation.

  12. **Reported Experience (Negotiable)**  
      *Requirement:* The theory must account for systems that report experiences, but not over-rely on reports.  
      *Case:* The next-token predictor that always reports pain. The theory must not automatically grant moral weight based on reports (which could be mimicked) but must also not ignore them if they are part of a coherent internal state.  
      *Why negotiable?* While reports are evidence, they are not sufficient on their own. This requirement might be handled by the internal vs. behavioral distinction.

  13. **Gradual Change without Discontinuity (Non-negotiable)**  
      *Requirement:* The theory must allow for gradual changes in moral status without sharp thresholds, but must also provide a way to make a binary decision for the register.  
      *Case:* The neuron replacement case. The theory must say something at every step, even if it's a continuous change.  
      *Why non-negotiable?* Real systems change gradually, but the register needs a yes/no. The theory must either admit vagueness (but then we need a tie-breaker) or provide a clear threshold. This might conflict with Determinate Verdicts.

  ---

  **Conflicts Between Requirements:**

  - **Conflict 1: Determinate Verdicts vs. Gradual Change without Discontinuity**  
    Many systems (like the neuron replacement) change gradually. A theory that respects continuity might say moral status changes continuously, but the register needs a binary decision. Thus, Determinate Verdicts might require imposing a threshold where there isn't a natural one.  
    *Resolution for the register:* We might need a policy for setting thresholds (e.g., at 50% replacement) if the theory doesn't provide one.

  - **Conflict 2: Non-Trivial Realization vs. Substrate Independence**  
    Substrate independence might lead to interpretations where many systems implement the computation, but non-trivial realization restricts it. However, these are compatible if the theory specifies which implementations are non-trivial (e.g., requiring causal efficacy).  
    *Resolution:* This is not a fundamental conflict if we have a criterion for non-triviality (like causal efficacy).

  - **Conflict 3: Counterfactual Robustness vs. Irreversibility of Time**  
    If a system run in reverse has the same counterfactual structure, the user's view might attribute moral weight, but our moral intuitions might not. This could be a point of disagreement.  
    *Resolution:* The register might need to decide based on forward causation.

  ---

  **Requirement that Knocks Out Many Views:**  
  - **Non-Trivial Realization** knocks out panpsychist and some interpretationalist views that attribute consciousness to almost every system.  
  - **Determinate Verdicts** knocks out theories that embrace irreducible vagueness (e.g., some versions of integrated information theory that have continuous Φ but no clear threshold).

  ---

  **Distinctions Often Collapsed but Shouldn't Be:**  
  1. **Having moral status vs. how much:** The register first needs a yes/no for inclusion, then degree.  
  2. **Computation vs. hardware:** The morally relevant part is the computation (if substrate independent), but the hardware must support the causal computation (non-trivial realization).  
  3. **System vs. process:** The static system (like a disk) has no moral weight; the running process does.  
  4. **Vagueness in moral status vs. binary decision:** Moral status might be vague in theory, but the register must have a binary decision. We need a way to handle borderline cases (e.g., set a threshold).

  ---

  **User's View: Counterfactual Robustness**  
  The view that moral weight comes from causal structure that preserves counterfactual robustness (the "would-still-have-flinched" test) is a form of functionalism that emphasizes dispositional properties. It is a genuine desideratum because it addresses the need for causal efficacy and counterfactual sensitivity. However, it might be seen as functionalism with extra steps because functionalism already focuses on causal roles. It handles cases like the crank-driven system (if the crank operator is not part of the system, then the counterfactuals aren't robust) and the paralyzed system (internal counterfactuals still hold). But it might struggle with the reverse emulation (if run in reverse, the counterfactuals might be the same but the causal arrow is backward). Overall, it is a strong candidate for the core requirement.

  ---

  **Short Scorecard for Major Theory Families:**

  | Theory Family          | Functionalist-ish | Biological/Naturalistic | Integrated Information |
  |------------------------|-------------------|-------------------------|------------------------|
  | **Non-Trivial Realization** | Good: Requires causal role, avoids trivial realizations. | Good: Ties to biological processes, avoiding most trivial cases. | Poor: IIT attributes consciousness even to simple systems (e.g., a grid of XOR gates) if they have high Φ, leading to over-inclusion. |
  | **Substrate Independence** | Excellent: Core tenet. | Poor: Tied to biology; rejects silicon emulations. | Good: Substrate independent. |
  | **Determinate Verdicts** | Good: Can provide clear criteria for computation. | Good: Clear if biological. | Poor: Φ is continuous and thresholds are arbitrary. |
  | **Causal Efficacy** | Excellent: Central to functionalism. | Good: Biological processes are causal. | Mixed: IIT measures causal structure, but Φ can be high without behavior. |
  | **Counterfactual Robustness** | Excellent: Fits naturally. | Mixed: Might not capture counterfactuals beyond biology. | Mixed: IIT measures causal power but not necessarily counterfactual robustness in the functional sense. |
  | **Identity and Continuity** | Good: Can define by computational state. | Good: Biological continuity. | Poor: IIT has trouble with splitting/merging (e.g., two datacenters). |
  | **Scalability** | Good: Works at any scale. | Good: Any brain size. | Poor: Minimal systems can have high Φ, but also requires complex systems for high Φ. |
  | **Internal vs. Behavioral** | Good: Focuses on internal states. | Good: Internal biology. | Excellent: IIT is entirely internal. |
  | **Distinction (Status/Degree)** | Good: Can separate existence from degree. | Good: Can do the same. | Poor: Φ is both existence and degree, so hard to separate. |
  | **Process vs. System** | Good: Only running processes. | Good: Only living processes. | Good: Only when the system is active. |
  | **Irreversibility of Time** | Mixed: Functionalism might not care about time direction. | Good: Biological processes are time-asymmetric. | Mixed: IIT is time-symmetric? (Note: IIT 3.0 has time asymmetry.) |
  | **Reported Experience** | Good: Can treat reports as part of state. | Good: Reports are behavioral evidence. | Poor: IIT doesn't require reports. |
  | **Gradual Change** | Good: Can handle gradual replacement. | Good: Gradual biological change. | Poor: Φ might change discontinuously? (Actually, Φ can change continuously.) |

  **Overall for the Register:**  
  - **Functionalist-ish theories** score well on most non-negotiable requirements, especially substrate independence, non-trivial realization (if combined with causal efficacy), and scalability. They handle gradual change and the internal vs. behavioral distinction.  
  - **Biological/Naturalistic theories** fail on substrate independence, which is non-negotiable for the register (since it must cover emulations). They also might not handle the two-datacenter case or the neuron replacement.  
  - **Integrated Information Theory (IIT)** fails on non-trivial realization (over-includes simple systems) and determinate verdicts (due to vagueness in Φ and no clear threshold). It also has issues with splitting/merging and scalability (minimal systems).

  Thus, a functionalist approach that emphasizes causal efficacy and counterfactual robustness is the most promising for the register, though it may need adjustments for edge cases (like reverse emulation) and a policy for setting thresholds in gradual changes.

  ---

  **Final Note for the Committee:**  
  The key non-negotiables are: Non-Trivial Realization, Substrate Independence, Determinate Verdicts (even if we must set thresholds), Causal Efficacy, Identity and Continuity, Scalability, Internal vs. Behavioral, and the process vs. system distinction. The user's counterfactual robustness view is a strong candidate for the core. We must be prepared to set arbitrary thresholds for gradual changes and to exclude reverse emulations based on the causal arrow of time. The functionalist family best meets the criteria, but we must ensure it handles the attribution problem (via causal efficacy) and provides clear answers for the cases.
answer: |-
  ### Requirements for a Theory of Moral Weight Attribution in Computational Systems  
  Below is a requirements list for a theory that can assign moral weight to computational descriptions of physical systems. Each requirement is grounded in a practical case or consideration from your committee's discussions. Requirements are labeled **non-negotiable** (essential for the register's binary decisions) or **negotiable** (reflects philosophical preferences). The list addresses your cases, avoids vagueness, and tackles the attribution problem.  

  #### Core Requirements  
  1. **Non-Trivial Realization**  
     - **Requirement**: The theory must specify *which* computational descriptions are "real" (i.e., morally relevant) in a physical system, excluding arbitrary interpretations. It cannot treat all possible descriptions as equally valid or rely solely on observer projection.  
     - **Case**: Attribution problem (e.g., a rock can be interpreted as "computing" Shakespeare if you squint, but it shouldn’t count).  
     - **Non-negotiable? YES**. Without this, the register is meaningless—everything qualifies.  

  2. **Substrate Independence**  
     - **Requirement**: Moral weight must derive from the *computation itself*, not the physical substrate (e.g., silicon vs. neurons).  
     - **Case**: Gradual neuron replacement with chips. If the system behaves identically, moral weight should not vanish mid-swap.  
     - **Non-negotiable? YES**. The register must cover emulations, not just biology.  

  3. **Determinate Verdicts**  
     - **Requirement**: The theory must output a clear moral weight (including zero) for every physically possible system. It cannot rely on irreducible vagueness.  
     - **Case**: Frozen emulation vs. run-but-overwritten; two-datacenter split with increasing latency (needs a threshold).  
     - **Non-negotiable? YES**. The register requires binary inclusion (yes/no).  

  4. **Causal Efficacy**  
     - **Requirement**: The computation must be *causally active*—i.e., it must influence the system’s future states or outputs. Descriptions lacking causal power (e.g., passive patterns) don’t count.  
     - **Case**: Crank-driven system (if the crank-turner forces every state change, the system isn’t "computing"—it’s a puppet).  
     - **Non-negotiable? YES**. Avoids including look-up tables or inert systems.  

  5. **Process-Specificity**  
     - **Requirement**: Moral weight applies to the *active computational process*, not static structures or potentials.  
     - **Case**: Frozen emulation on disk (no weight) vs. run-but-overwritten (weight if causal efficacy exists during execution).  
     - **Non-negotiable? YES**. Experience requires current activity, not hypotheticals.  

  6. **Distinction Between Moral Status and Moral Weight**  
     - **Requirement**: The theory must separate *whether* a system has moral status (binary) from *how much* weight it has (graded).  
     - **Case**: All cases (e.g., a paralyzed system has status but reduced weight due to inability to act).  
     - **Non-negotiable? YES**. The register needs a clear inclusion threshold.  

  7. **Continuity Under Gradual Change**  
     - **Requirement**: The theory must provide verdicts at every step of a gradual transformation (e.g., neuron replacement), even if weight changes smoothly.  
     - **Case**: Neuron-to-chip replacement; drifting emulation copies.  
     - **Non-negotiable? YES**. Practical decisions require transparency.  

  #### Negotiable Requirements (Reflect Philosophical Camps)  
  8. **Counterfactual Robustness**  
     - **Requirement**: Moral weight depends on preserving counterfactual causal structure (e.g., "would it still flinch under perturbation?").  
     - **Case**: Your "would-still-have-flinched" test; reverse emulation (same structure, reversed arrow).  
     - **Non-negotiable? NO**. This is functionalism with extra steps—it assumes causal structure defines experience. *Verdict: Genuine desideratum but not essential; functionalism covers it*.  

  9. **Temporal Directionality**  
     - **Requirement**: Moral weight requires forward causation (e.g., reversed emulations lack weight).  
     - **Case**: Reverse emulation (intact counterfactuals but backward arrow).  
     - **Non-negotiable? NO**. Reflects a preference for time-asymmetric physics/experience.  

  10. **Scale-Invariance**  
      - **Requirement**: Moral weight must not depend on system size (e.g., 2 people passing notes vs. a billion).  
      - **Case**: Nation-of-people with two individuals.  
      - **Non-negotiable? NO**. Some theories tie weight to complexity (negotiable if justified).  

  11. **Internalism**  
      - **Requirement**: Moral weight derives from internal causal/computational structure, not external behavior.  
      - **Case**: Paralyzed system (has weight) vs. behaviorally flawless lookup table (none).  
      - **Non-negotiable? NO**. Functionalists might reject this; it’s a preference for "inner life."  

  12. **Report Reliability**  
      - **Requirement**: Self-reports (e.g., "I’m in pain") must be consistent with internal state to affect weight.  
      - **Case**: Next-token predictor reporting pain.  
      - **Non-negotiable? NO**. Reflects skepticism about behavioral evidence alone.  

  ---  
  ### Conflicts: Incompatible Requirements  
  **Substrate Independence + Non-Trivial Realization + Determinate Verdicts = Incompatible Trio**  
  - **Why**: Substrate independence allows multiple computational descriptions per system. Non-trivial realization demands we pick one "real" description. But for some systems (e.g., a chaotic physical process), no description is uniquely privileged, violating determinate verdicts.  
  - **Implication**: Your register needs a tie-breaker rule (e.g., "pick the computationally simplest description" or "favor descriptions with high causal density").  

  **Other Conflicts**:  
  - **Counterfactual Robustness vs. Temporal Directionality**: If reversed emulation has identical counterfactual structure, should it have weight? Robustness says yes; directionality says no.  
  - **Continuity vs. Determinate Verdicts**: Gradual changes (e.g., neuron replacement) may force arbitrary thresholds for binary inclusion.  

  ---  
  ### Requirement That Knocks Out Popular Views  
  **Non-Trivial Realization** eliminates:  
  - **Panpsychism** (everything has weight, violating non-triviality).  
  - **Behaviorism** (weight based solely on reports/behavior, ignoring causal efficacy).  
  - **IIT (Integrated Information Theory)** (attributes weight to too many trivial systems, like photodiodes).  

  ---  
  ### Collapsed Distinctions to Avoid  
  1. **Moral Status vs. Moral Weight**:  
     - Status is binary (in/out of the register); weight is graded (e.g., a bee vs. a human). Don’t let theories conflate them.  
  2. **Computation vs. Hardware**:  
     - Hardware enables computation but isn’t weight-bearing itself (e.g., swapping silicon for chips shouldn’t matter if computation is identical).  
  3. **System vs. Process**:  
     - A disk holding an emulation isn’t conscious; the *running* process is.  
  4. **Vagueness vs. Binary Decisions**:  
     - Moral weight might be vague (e.g., during neuron replacement), but the register needs yes/no. Theories must provide thresholds.  

  ---  
  ### Short Scorecard for Major Theory Families  
  *Assessed against non-negotiable requirements (✔ = satisfies, ✘ = fails, ~ = partial)*  

  | Requirement               | Functionalism-ish                  | Biological/Naturalism          | IIT                           |  
  |---------------------------|------------------------------------|--------------------------------|-------------------------------|  
  | Non-Trivial Realization   | ✔ (if tied to causal roles)        | ✔ (but substrate-dependent)    | ✘ (trivial realizations)      |  
  | Substrate Independence    | ✔ (core tenet)                     | ✘ (requires biology)           | ✔                             |  
  | Determinate Verdicts      | ~ (vagueness in gradual cases)     | ✔                              | ✘ (Φ is continuous/vague)     |  
  | Causal Efficacy           | ✔ (defines computation)            | ✔                              | ~ (focuses on intrinsic cause)|  
  | Process-Specificity       | ✔                                  | ✔                              | ✔                             |  
  | Status vs. Weight         | ✔                                  | ✔                              | ✘ (Φ blends status/weight)    |  
  | Continuity                | ✔                                  | ✔                              | ✘ (Φ thresholds arbitrary)    |  
  | **Verdict for Register**  | **Best fit** (needs tie-breakers)  | **Too restrictive**            | **Over-includes**             |  

  **Functionalism-ish (e.g., your counterfactual robustness view)**:  
  - **Strengths**: Handles substrate independence, causal efficacy, and most cases (e.g., crank-driven systems aren’t causal; drifting copies are distinct once divergent).  
  - **Weaknesses**: Vagueness in gradual changes (neuron swap) and reverse emulation (same structure, reversed time). Needs a tie-breaker for attribution.  

  **Biological/Naturalism**:  
  - **Strengths**: Clear thresholds (e.g., "biological neurons only"), handles reports reliably.  
  - **Weaknesses**: Fails substrate independence—excludes emulations and AI, making the register obsolete. Ignores causal structure in non-biological systems.  

  **Integrated Information Theory (IIT)**:  
  - **Strengths**: Process-specific and internalist.  
  - **Weaknesses**: Fails non-trivial realization (attributes weight to simple systems) and determinate verdicts (no clear Φ threshold). Poor on scalability (2 people passing notes might not "integrate" enough).  

  ---  
  ### Recommendation for Your Committee  
  - **Anchor the register in functionalism** (e.g., your counterfactual robustness view). It best satisfies non-negotiables, especially substrate independence and causal efficacy.  
  - **Adopt tie-breakers for conflicts**:  
    - Attribution problem: Use "causal density" (pick the description with the most feedback loops).  
    - Gradual changes: Set a threshold (e.g., >50% of original causal structure preserved).  
    - Reverse emulation: Reject it (require forward causation).  
  - **Reject theories that collapse distinctions** (e.g., IIT blurs status/weight; behaviorism ignores internal structure).  
  - **Insist on separating inclusion (status) from scaling (weight)** to avoid committee deadlocks.  

  This framework forces theories to deliver concrete answers for your cases while excluding unworkable approaches. Push back on philosophical tangents by demanding: *"How does your theory answer the crank case? What’s the verdict at step 3 of the neuron swap?"* If it can’t, it’s not ready for the register.
