prompt: |-
  I'm moderating a student paper series Q&A next thursday with a sociologist — let's call her Dr. Elena Voss — who defends something she calls "network-embedded holism." Her core claim is that in labor-market matching you can't decompose outcomes into individual preference orderings because the local network topology acts as a real causal constraint: it determines who even gets seen for an interview, and that constraint isn't reducible to summed-up individual beliefs about connections. Methodological individualists, she says, always redescribe this post-hoc by giving each agent a belief-state about the network, but that misses the emergent property. I want eight to ten interview questions that go way past "why not rational choice?" I need at least one pressing on whether her network unit is just a modeling heuristic or ontologically distinct from its nodes — with a follow-up for if she picks ontological, asking what specific empirical result could actually make her drop the view. Another should ask how she avoids the old Durkheimian problem of erasing individual moral agency, especially since her framework treats people as nodes whose choices are underdetermined by structure; I want the likely reply anticipated and then a sharper second question keyed to it. I also want one on whether bounded rationality alone can do all the work she's giving to the network, since if agents just have limited information that sounds like individual-level psychology again. For each question, include the follow-up. And please, no requests for a bibliography or specific citations — I'm trying to map the conceptual architecture, not build a syllabus. I might have misspelled a word or two here, but you get teh idea.
