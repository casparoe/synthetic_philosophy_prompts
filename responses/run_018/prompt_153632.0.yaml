answer: |-
  **MEMORANDUM**  
  **TO:** Civic Engagement Advisory Panel Chair & Riverside Unified School District Board of Education  
  **FROM:** Junior Student Delegate, Civic Engagement Advisory Panel  
  **DATE:** October 26, 2023  
  **SUBJECT:** Formal Recommendation on Charter Amendment 9-C Pilot Proposal  

  ---

  ### **I. Context**  
  Charter Amendment 9-C proposes a pilot expansion of voting eligibility for school-budget referenda to two groups:  
  1. **Resident minors aged 16–17** who complete a district-certified civic literacy module.  
  2. **Non-citizen residents** who have paid local property taxes continuously for ≥5 years and maintain no federal tax delinquency.  

  The amendment further raises the question of whether compulsory civic literacy requirements should apply uniformly to *all* voters or solely to new eligibility categories.  

  ---

  ### **II. Recommendation: Conditional Approval with Phased Rollout**  
  The Panel should endorse Amendment 9-C **conditionally**, subject to the following implementation timeline and safeguards:  

  #### **Phase 1 (Immediate)**  
  - **Implement voting for minors aged 16–17** upon completion of the civic literacy module, beginning with the next school-budget referendum cycle.  
  - **Apply the civic literacy module uniformly** to *all* newly eligible voters (minors only in this phase).  

  #### **Phase 2 (Contingent on Impact Review)**  
  - **Defer non-citizen resident voting** pending a 24-month review of Phase 1 outcomes, including:  
    - Youth voter turnout and civic engagement metrics.  
    - Fiscal impact analysis of budget referenda outcomes.  
    - Legal opinion on local authority to enfranchise non-citizens.  
  - **Conditional approval for non-citizen voting** requires affirmative Board ratification post-review.  

  #### **Safeguards**  
  - The civic literacy module must be:  
    - Nonpartisan, competency-based (not ideological), and accessible in all district languages.  
    - Mandatory *only* for new voter categories (minors and, if implemented, non-citizens).  
  - Traditional citizen voters remain exempt from compulsory participation requirements.  

  ---

  ### **III. Reasoning**  
  #### **A. Addressing Citizenship-Sovereignty Concerns**  
  We acknowledge the principled objection that voting is a core prerogative of citizenship, inseparable from national sovereignty and civic allegiance. Granting ballot access to non-citizens—irrespective of tax contributions—risks diluting the conceptual link between democratic legitimacy and the citizen body. This concern is not prejudicial but foundational: it asserts that the *demos* must be coterminous with the polity bound by shared civic identity and reciprocal duties.  

  **Our Response:**  
  School-budget referenda govern hyperlocal fiscal decisions directly impacting *all* residents—minors in schools, non-citizens funding infrastructure via property taxes. While national sovereignty rightly restricts federal/state elections to citizens, the legitimacy of *school district* governance derives from its immediate impact on stakeholders. Phase 2’s deferral allows rigorous scrutiny of whether local consent-based authority can ethically exclude long-term, tax-compliant residents.  

  #### **B. Balancing Representation and Responsibility**  
  - **Minors aged 16–17:** Lowering the voting age recognizes their dual status as students governed by district policies and emerging civic actors. The literacy module ensures informed participation, mirroring pedagogical aims of social studies curricula.  
  - **Non-citizen residents:** Phase 2’s contingent structure respects sovereignty objections while acknowledging that taxpaying residents contribute to—and are governed by—district fiscal decisions absent representation.  

  #### **C. Uniformity of Participation Requirements**  
  Compulsory civic literacy applies *only* to new voter categories to:  
  - Avoid imposing novel requirements on traditional voters, preserving existing rights.  
  - Ensure new entrants demonstrate foundational knowledge, mitigating concerns about ballot readiness.  

  ---

  ### **IV. Strongest Counterargument (and Response)**  
  **Counterargument:** Democratic sovereignty requires that voting remain an exclusive covenant among citizens. Extending it to non-citizens—even conditionally—undermines the social contract, as non-citizens lack allegiance to the constitutional order and may prioritize transnational interests. Similarly, minors lack the lived experience and accountability (e.g., property ownership, full-time employment) to weigh long-term fiscal trade-offs.  

  **Response:** While sovereignty arguments hold merit for national elections, school districts are administrative entities managing localized public goods. The social contract here is pragmatic: those governed by and investing materially in the system (minors through compulsory attendance; non-citizens via property taxes) merit consultation on its operations. The literacy module and phased rollout mitigate readiness concerns while preserving citizenship’s primacy in higher-stakes elections.  

  ---

  ### **V. Conclusion**  
  Amendment 9-C innovatively addresses gaps in stakeholder representation while respecting governance legitimacy. Our conditional endorsement advances youth civic development immediately and subjects non-citizen voting to deliberate, evidence-based scrutiny. This balanced approach honors sovereignty concerns while testing whether local democracy can adapt to inclusive, consent-based legitimacy.  

  **Recommended Action:** Approve Amendment 9-C with the phased implementation framework and safeguards detailed above.  

  Respectfully submitted,  
  [Junior Student Delegate]  
  Civic Engagement Advisory Panel
