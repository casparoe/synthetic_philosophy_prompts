answer: |-
  Based on your roommate's pattern and the three ethical frameworks, here's a breakdown of the prediction for the neural band case and how to identify her core rule:

  1.  **The Case:** Startup pays non-poor, healthy adults a monthly fee to wear a neural band tracking emotional states, selling anonymized data to advertisers.

  2.  **Predictions by Rule:**
      *   **Exploitation Rule (Preventing Harm/Coercion of the Vulnerable):**
          *   **Focus:** Is this taking advantage of someone who lacks real choice due to desperation, poverty, or vulnerability?
          *   **Prediction for Neural Band:** **NOT Repugnant.** The rule screens out the poor, specifically targeting people *not* in a vulnerable economic position. Participants are presumably consenting adults without financial coercion. She approved paying for vaccines, which also targets consenting individuals for a beneficial activity without exploiting vulnerability.
      *   **Corruption-of-Values Rule (Protecting Sacred/Intrinsic Value):**
          *   **Focus:** Does money corrupt something that should be valued intrinsically, based on principle, duty, or inherent worth, rather than market price? Does it degrade a social good or institution?
          *   **Prediction for Neural Band:** **LIKELY Repugnant.** Emotional states, brain data, and inner mental life are often seen as deeply personal, private, and intrinsically valuable aspects of being human. Monetizing this inner sanctum, especially selling it to advertisers, could feel like a profound corruption of human dignity, intimacy, or selfhood. It commodifies something profoundly personal. This aligns with her rejection of selling votes (corrupts democracy), selling kidneys (corrupts bodily integrity), auctioning adoptions (corrupts family/child welfare), and queue-jumping (corrupts fairness in public goods).
      *   **Treating-People-as-Commodities Rule (Anti-Commodification):**
          *   **Focus:** Is this treating people, parts of people, or deeply human attributes/relationships as mere objects to be bought, sold, and used?
          *   **Prediction for Neural Band:** **REPUGNANT.** This rule directly objects to turning aspects of human beings (like organs, reproductive capacity, votes, *or inner emotional states*) into marketable commodities. Your roommate's emotional and cognitive data *is* a part of her being that is being packaged and sold. This fits her rejection of kidney sales, vote sales, and adoption auctions. Even though anonymized, the core data *is* commodified human experience.

  3.  **Which Rule is She Likely Using?**
      Based on her specific verdicts, the **Corruption-of-Values Rule** seems the strongest fit for her overall pattern:
      *   **Kidneys/Votes/Adoption/Queue-Jumping:** All involve putting a price on things widely considered sacred or intrinsically valuable: bodily integrity, democratic voice, family formation, and fairness/access to essential public resources. Money corrupts their core purpose.
      *   **Vaccine Payments:** This *doesn't* corrupt the value of health or vaccination; it arguably *promotes* the sacred value of public health. Payment is an incentive for a beneficial action, not payment *for* the health itself or something intrinsically sacred.
      *   **Price Gouging:** While exploitation is present, the core repugnance often lies in the corruption of community solidarity and fairness during disaster (sacred values of mutual aid and non-exploitation in crisis).
      *   **Neural Band Prediction:** The Corruption rule strongly predicts she'll find this repugnant because it puts a price on and trades access to something deeply personal and intrinsic to human experience – one's internal emotional state. This feels like a violation of a sacred boundary.

  4.  **A Splitting Case: Paid Surrogacy (Traditional/Altruistic Model vs. Commercial Market)**
      *   **The Case:** A woman is paid a significant fee to carry a pregnancy for intended parents (beyond reasonable medical/living expenses).
      *   **How it Splits the Rules:**
          *   **Exploitation Rule:** Might find it repugnant *if* the surrogate is poor/vulnerable and feels economically coerced. Might find it acceptable if she is financially stable, fully informed, and freely consents. (Focuses on vulnerability).
          *   **Corruption-of-Values Rule:** Likely finds it repugnant. It commercializes pregnancy, childbirth, and the mother-child bond, which are often seen as sacred, intimate human experiences that shouldn't be subject to market forces. It turns a profound biological and emotional process into a service for hire, corrupting its intrinsic meaning. (Focuses on degrading sacredness).
          *   **Commodification Rule:** Finds it repugnant. It treats a woman's reproductive capacity and body as a commodity for rent, and potentially treats the child as a product being commissioned. (Focuses on turning people/processes into tradable goods).
      *   **How it Splits Your Roommate's Likely Rule:** If she uses the **Corruption-of-Values Rule**, she will almost certainly find commercial surrogacy repugnant (aligning with her other sacred-value rejections). If she uses the **Exploitation Rule**, she *might* approve it under conditions of non-vulnerability and true consent (similar to vaccine payments). The Commodification rule would also reject it.

  **Conclusion:**

  *   **Prediction:** Your roommate will almost certainly call the neural band program **Repugnant**.
  *   **Her Rule:** The **Corruption-of-Values Rule** best explains her consistent pattern. She objects when money is introduced into spheres of life considered sacred, intrinsically valuable, or fundamental to societal goods (body, democracy, family, fairness, disaster response, personal intimacy), fearing it degrades their core meaning and purpose. Vaccine payments don't corrupt the value of health; they incentivize promoting it. The neural data sale directly commercializes intimate inner experience.
  *   **Splitting Case:** **Commercial Surrogacy** is a strong test case that would likely split the Exploitation rule (might approve under strict non-coercion) from the Corruption/Commodification rules (which would reject it). Her verdict here would be very telling.
