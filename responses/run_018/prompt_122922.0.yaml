  Breaking it down:
  The relativity of simultaneity must have metaphysical weight (not just convention). I'd put this at 0.95 because denying it seems to require rejecting relativity's core equivalence of frames. 

  The bridge premise (simultaneity implying reality) doesn't beg the question. Presentists already accept that "present" defines existence, so using their own definition against them seems fair. Maybe 0.85 here - there's a subtle risk of circularity but it feels minimal.

  The cost of a privileged foliation is high - 0.9. An undetectable "cosmic now" violates scientific methodology principles, making it ad hoc. It's not just unfamiliar; it's antithetical to how physics treats fundamental structures.

  Overgeneration is a real problem. Relativized presentism (each observer's "now" is real) leads to contradictions when observers move relative to each other. Eternalism avoids this by making existence frame-invariant. In Newtonian physics this whole issue vanishes - that's telling. So 0.85 for this point being fatal.

  For the quantum gravity scenario: if a detectable preferred foliation existed, presentism becomes defensible again. The main argument relies entirely on SR's lack of such structure. So conditional credence drops to 0.25 - physics is doing the heavy lifting.

  Combining these: 0.95 * 0.85 * 0.9 * 0.85 ≈ 0.62, weighted by their sensitivity. Relativity's metaphysical weight is the strongest lever here. The bridge premise is the shakiest because it interacts with presentist semantics.

  User's friend at 0.92 might be overweighting the foliation cost or underweighting semantic risks. User at 0.6 might be underestimating how badly relativized presentism fails.

  Biggest mover? If someone convincingly argued that "existence" in metaphysics doesn't need to align with causal structure. That could drop my number toward 0.4, but currently seems unlikely.
