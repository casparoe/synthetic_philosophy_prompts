  ## Joint Statement: Adversarial Collaboration on Mary's Room & the Knowledge Argument

  **Preamble:** We, a proponent of the Phenomenal-Concept Strategy (PCS) and a proponent of Anti-Physicalist Direct Realism (APDR), engaged in sustained, good-faith dialogue concerning Frank Jackson's Mary thought experiment and the associated Knowledge Argument (KA). Our goal was rigorous mutual understanding and the identification of precise points of agreement and disagreement, avoiding rhetorical maneuvering in favor of analytical clarity. This document reflects the core consensus and divergence reached.

  **Section 1: Points of Agreement**

  1.  **Jackson's Setup:** We affirm the standard description of the scenario: Mary possesses complete physical/functional/neuroscientific knowledge concerning color vision and processing *prior* to any chromatic visual experience (confined to a black-and-white environment). Upon first experiencing red, she gains new knowledge.
  2.  **Logical Form of KA:** We agree the KA's core logical structure is: (P1) Mary has complete physical knowledge pre-release. (P2) Mary gains new knowledge post-release (knowing what it's like to see red). (C) Therefore, physical knowledge is incomplete; some facts (phenomenal facts) are non-physical.
  3.  **Standard Physicalist Reply Strategies:** We acknowledge the existence and general contours of standard physicalist responses to the KA, including but not limited to: the Ability Hypothesis (Ryle, Lewis), the Acquaintance Hypothesis (Conee, Gertler), and the Phenomenal Concept Strategy (Loar, Papineau, Tye, Perry).
  4.  **Shared Criterion for Resolution:** Any successful resolution of the dispute must provide a non-question-begging explanation of Mary's epistemic transition upon her first chromatic experience. Specifically, it must explain *why* her prior exhaustive physical knowledge was insufficient to preclude this specific type of epistemic gain, *without* simply presupposing the ontological status (physical or non-physical) of phenomenal properties or facts as part of the explanation.

  **Section 2: Key Disagreements**

  | Phenomenal-Concept Strategist (PCS)                                                                                             | Anti-Physicalist Direct Realist (APDR)                                                                                                                             |
  | :------------------------------------------------------------------------------------------------------------------------------ | :----------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | Mary's epistemic gain upon experiencing red is best analyzed as acquiring a new *conceptual capacity/perspective* – specifically, a first-person, recognitional concept grounded in attention to an occurrent state, functioning analogously to a centered-world indexical ("this state now"). | Mary's epistemic gain is best analyzed as becoming *acquainted with* a genuinely novel, irreducible phenomenal property (redness-quale) instantiated in her experience, constituting a new non-physical fact. |
  | Physicalism *can* accommodate Mary's transition because phenomenal concepts, while irreducibly first-personal and perspectival (indexical/demonstrative) in their *mode of presentation*, refer *only* to physical states of the brain. Her prior ignorance stemmed solely from lacking the specific cognitive/conceptual apparatus triggered by the experience. | Physicalism *cannot* accommodate Mary's transition. The irreducibly perspectival nature of phenomenal concepts reflects the irreducibly perspectival nature of the phenomenal properties they grasp. Her ignorance stemmed from the *ontological absence* of the phenomenal property in her cognitive access prior to experience. |

  **Section 3: Cruxes & Predictions**

  1.  **The Neuro-Implant Crux:**
      *   **Scenario:** Before release, Mary receives a neuro-implant that precisely stimulates her visual cortex (e.g., V4/V8) to produce an occurrent visual phenomenology indistinguishable from seeing a ripe tomato, *without* any retinal input or interaction with external colored objects.
      *   **Question:** Does this count as Mary gaining "what it's like" to see red *for the purposes of the Knowledge Argument*? Does it trigger the same epistemic transition as seeing an external red object?
      *   **PCS Prediction:** *Strengthens PCS.* Yes. The relevant epistemic transition depends solely on the *intrinsic phenomenology* generated in the brain and the consequent triggering of the first-person demonstrative concept ("this experience"). The source (retina vs. implant) is irrelevant. This reinforces that the gain is about cognitive access to a brain state via a new mode of presentation.
      *   **APDR Prediction:** *Weakened APDR/Ambiguous.* Likely No, or not fully. Genuine "knowing what it's like" requires acquaintance with a property instantiated in *veridical perception* of the external world. The implant delivers only a "qualitative character" lacking intentional objecthood or true acquaintance with an external property, potentially making it a different epistemic kind (e.g., akin to hallucination knowledge) insufficient to fully ground the KA's conclusion about non-physical *facts* concerning perception.

  2.  **The Transparency & Circularity Crux:**
      *   **Issue:** Phenomenal concepts are often described as "transparent" – grasping the concept *just is* grasping the phenomenal property itself (or seeming to). Does this alleged transparency mean that any physicalist explanation appealing to phenomenal concepts inevitably becomes circular when explaining Mary's prior ignorance? Specifically, does explaining her ignorance as "lacking the phenomenal concept" presuppose the non-physicality of the referent?
      *   **PCS Prediction:** *Resolves in Favor.* No circularity. Transparency is an *epistemic* feature of the *concept's mode of presentation*, not an ontological claim. Reducing phenomenal concepts to demonstrative/indexical modes of presentation (e.g., "this [type of neural] state") successfully explains Mary's ignorance without ontological baggage: she lacked the demonstrative ability/capacity tied to the tokened state. Successfully reducing them thus resolves the KA in the physicalist's favor.
      *   **APDR Prediction:** *Persistent Circularity.* Yes. The transparency of phenomenal concepts reveals that the concept and the property are not separable in the way required for the PCS reduction. Attempting to reduce the phenomenal concept to a demonstrative referring to a neural state inevitably smuggles in the very phenomenal property ("this *phenomenal* state") whose physicality is in question. The explanation of ignorance ("lacking the concept *for that quale*") presupposes the quale's distinctness, hence circularity remains.

  **Section 4: Assessment of Residual Disagreement & Verbal Component**

  We conclude that while significant disagreement persists concerning ontology and the ultimate success of physicalism, a core aspect of our divergence is plausibly *verbal* or *terminological*, hinging on the interpretation of "knowing what it is like":

  *   **PCS Position:** "Knowing what it is like" denotes a distinct *epistemic mode* (first-person, demonstrative, recognitional) for accessing a physical fact already encompassed by Mary's prior physical knowledge. It is a new *way* of knowing an old (physical) fact, not knowledge of a new *kind* of fact.
  *   **APDR Position:** "Knowing what it is like" denotes acquaintance with a distinct *ontological kind* – a phenomenal property – constituting knowledge of a new, non-physical fact. The distinct epistemic mode *reflects* this ontological novelty.

  This verbal divergence is deeply intertwined with the ontological disagreement and unlikely to be resolved independently of the cruxes identified above. The PCS proponent adopts the "epistemic mode" interpretation; the APDR proponent adopts the "ontological kind/epistemic kind" interpretation. Future progress hinges on resolving the empirical/conceptual issues surrounding the Neuro-Implant Crux and the feasibility of non-circularly reducing phenomenal concepts as per the Transparency Crux.
