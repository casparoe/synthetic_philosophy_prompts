prompt: |-
  The debate between naturalism and normativism about health and disease—illustrated by Boorse's biostatistical theory and Wakefield's harmful dysfunction analysis—has been running since the 1970s, and in my view it has reached a frustrating impasse. Both camps agree on the clinical and biological descriptions—say, that type 1 diabetes involves pancreatic beta-cell failure and that this state is harmful—yet they continue to talk past one another about whether diabetes is a 'disease' in virtue of statistical abnormality alone or only because it also frustrates a socially valued function. My working hypothesis is that the stall is not primarily about values but about a hidden disagreement over whether biological 'function' is an objective, statistically grounded notion or already a normatively loaded concept, and that the two sides are therefore pursuing different programmes—one taxonomic, one evaluative—under the single heading 'What is health?'. Diagnose this impasse: is it a verbal dispute about the word 'disease', a substantive disagreement about the ontology of biological function, or a case of two research programmes answering different questions with the same examples? Be specific about what each side actually says—particularly how a naturalist treats statistical deviation and how a normativist treats harm—rather than surveying the literature. Then tell me what, if anything, would count as progress: a conceptual distinction between threshold and scalar dysfunction, an empirical finding about biological function, a formal result in taxonomy, or an admission that the question is ill-posed? Finally, please state explicitly what would change your mind about your diagnosis—whether there is an argument or consideration that would lead you to conclude the disagreement is purely verbal, or that it is a deep empirical dispute in disguise—and indicate where your reasoning is most likely to fail.
