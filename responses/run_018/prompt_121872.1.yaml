answer: |-
  ### Exam Question: Modified Absent-Minded Driver with Phantom Exit  
  **Scenario:**  
  A driver starts at point S. He will encounter three intersections in sequence: Exit 1 (payoff 0), a Phantom Exit (payoff -5), and Exit 2 (payoff 4). The Phantom Exit is indistinguishable from Exit 2 but dead-ends. The driver cannot differentiate between intersections after leaving S. He carries a one-time-use button to tag his *current* location. Pressing the button costs 1 utility and provides no direct payoff but allows him to recognize the tagged intersection if he returns (though he never does). At each intersection (including S), he chooses whether to press the button (if unused) and whether to exit or continue.  

  **Tasks:**  
  1. **Optimal Strategy**: Determine the driver’s optimal actions (button press and exit/continue decisions) at each intersection type (S, Exit 1, Phantom, Exit 2).  
  2. **CDT vs. EDT Divergence**: Explain whether Causal Decision Theory (CDT) and Evidential Decision Theory (EDT) assign different values to tagging *at the start (S)*. Rebuild the payoff structure to show why the Phantom Exit disrupts the classic symmetry argument. Pinpoint where CDT and EDT split in their evaluation of tagging at S.  

  ---

  ### Model Answer (600 words)  

  #### Payoff Structure and Phantom’s Impact  
  The driver’s route is linear: S → Exit 1 (payoff 0) → Phantom (payoff -5) → Exit 2 (payoff 4). If he never exits, payoff = 0. The Phantom introduces asymmetry: Exit 2 is desirable (4), but the Phantom is catastrophic (-5). Without tagging, all post-S intersections are epistemically identical—the driver cannot distinguish Exit 1, Phantom, or Exit 2. This breaks the classic two-exit symmetry (where exits were equally ambiguous). In the classic problem, symmetry allowed a mixed strategy (e.g., "continue with probability *p*") to balance payoffs. Here, the Phantom’s presence makes such symmetry untenable: exiting at an unknown location risks -5, so the optimal non-tagging strategy is to *never exit* (payoff 0), avoiding the Phantom but forfeiting Exit 2’s payoff.  

  Tagging at a specific exit (e.g., Exit 1) breaks this epistemic symmetry. If the driver tags at Exit 1, he recognizes it when encountered and continues (avoiding payoff 0). At subsequent intersections, the absence of a tag implies he is at the Phantom or Exit 2. He then uses a mixed strategy: continue with probability *r* = 0.195, yielding expected utility ≈ -0.844 (tag cost included). Better yet, tagging at the *first encountered exit* ensures he always reaches Exit 2: press at Exit 1 → continue, continue at Phantom (recognized as untagged), exit at Exit 2. Net utility = 4 - 1 (tag cost) = 3. This dominates no-tagging (0) and other strategies.  

  #### CDT vs. EDT Divergence on Tagging at S  
  Tagging at S costs 1 utility but provides no informational benefit at exits: the driver already knows he isn’t at S when at an exit, so tagged/untagged observations don’t distinguish between Exit 1, Phantom, or Exit 2. CDT and EDT diverge sharply here:  
  - **CDT (Causal Decision Theory)**: Evaluates actions based on *causal consequences*. Tagging at S does not change physical outcomes (it doesn’t alter which exit the driver faces). It only wastes 1 utility. CDT values tagging at S at **-1** (pure cost).  
  - **EDT (Evidential Decision Theory)**: Evaluates actions based on *evidence they provide*. Tagging at S is correlated with being at S, which is not an exit. Thus, EDT conditions on the evidence: "If I tag at S, I am at S (safe), not an exit (risky)." EDT mistakenly infers that tagging *reduces the probability* of facing the Phantom, ignoring that tagging doesn’t causally influence exit sequencing. EDT may value tagging at S higher than -1 (e.g., as a "safety signal"), creating a gap with CDT.  

  The divergence arises because tagging at S changes the *epistemic partition* (it creates a known state "S" with no risk) without altering the *causal structure* (it doesn’t affect exit order or payoffs). EDT conflates the correlation (being at S when tagging) with protection from the Phantom, while CDT isolates the futile cost. This split is absent in the classic problem, where tagging wasn’t an option, and symmetry masked such evidential pitfalls.  

  #### Optimal Strategy  
  - **At S**: Do not press the button. Continue.  
  - **At any exit (Exit 1, Phantom, or Exit 2)**:  
    - If the button is unused, press it (tagging the current exit).  
    - If the current exit is tagged (i.e., you just tagged it), continue.  
    - If no tag is visible (i.e., you tagged a prior exit), continue at Phantom or Exit 1, but exit at Exit 2. Since you forget prior actions, use:  
      - After tagging, at the next two intersections, always continue.  
      - This ensures: Tag at Exit 1 → continue, continue at Phantom, exit at Exit 2.  
  - **Net payoff**: 4 (Exit 2) - 1 (tag cost) = 3.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **Must-Hit Points** (1 point = 1-2 sentences; 4 marks per point):  

  | **Point** | **Description** | **Typical Mistake** |
  |-----------|-----------------|---------------------|
  | **1**     | **Rebuild payoff structure**: Explicitly state payoffs (Exit 1: 0, Phantom: -5, Exit 2: 4), and emphasize that the Phantom makes exits causally asymmetric. | Misses Phantom payoff (-5) or treats exits symmetrically. |
  | **2**     | **Explain symmetry break**: The Phantom’s -5 payoff prevents indifference between exits; non-tagging optimum is "never exit" (0 utility) to avoid risk. | Claims symmetry persists or suggests a mixed strategy without tagging. |
  | **3**     | **Tagging’s epistemic role**: Tagging at an exit creates a "known state," allowing conditional actions (e.g., "continue if tagged at Exit 1"). | Assumes tagging changes causal paths (e.g., "prevents Phantom"). |
  | **4**     | **CDT vs. EDT divergence at S**: CDT values tagging at S at -1 (no causal effect). EDT values it higher due to evidence ("I’m at S, not an exit"). | Conflates correlation with causation (e.g., "EDT and CDT agree"). |
  | **5**     | **Core theoretical split**: Highlights that EDT misinterprets the epistemic partition shift (knowledge of S) as causal risk reduction. | Focuses only on naming CDT/EDT without explaining *why* they split.  

  **Grading Key**:  
  - **A (17–20)**: Hits all 5 points; clearly distinguishes epistemic vs. causal effects of tagging.  
  - **B (12–16)**: Misses point 3 or 5; describes theories but not why the epistemic partition shift drives divergence.  
  - **C (7–11)**: Misses 2+ points; confuses causality/evidence or omits Phantom’s role.  
  - **D (0–6)**: Fails to rebuild payoffs or identify CDT/EDT split.  

  ---  
  **Exam Strategy Tip**: To score an A, explicitly contrast how tagging *reshapes knowledge* (epistemic) without changing *road structure* (causal). Use phrases like "EDT mistakes correlation for causation" or "tagging creates informational asymmetry, not causal asymmetry."
