answer: |-
  ## Dialogue: The Irrigation Paradox

  **Setting:** A sun-drenched courtyard after a conference on behavioral economics. Dr. Elena Voss and Dr. Marcus Chen linger over coffee, returning to a point raised during a panel.

  **Dr. Elena Voss:** Marcus, that irrigation cooperative case study presented earlier... it’s precisely the kind of data that vindicates a rigorously ordinal, context-bound understanding of revealed preference. Three frames—market, council, ritual—three distinct preference orderings over the same allocation schemes, no contradictions *within* a frame, no reported regret. It’s elegant proof that preference *is* the choice, relative to the institutional register.

  **Dr. Marcus Chen:** Elegant, Elena, but deeply problematic for the *explanatory* ambition of economics. If "preference" flips entirely based on whether the room has a gavel, a price board, or an elder’s staff, what does "utility" actually represent? It becomes a mere shadow cast by the institutional lighting, devoid of any stable internal referent. How can we predict behavior in a *new* context, say a drought emergency meeting blending elements of council and ritual, if utility has no cross-context identity?

  **Dr. Voss:** Prediction for novel contexts *is* challenging, I grant you. But that doesn't make the revealed preference within each frame "vacuous." It *summarizes* the choice-relevant information *for that specific decision environment*. The market frame activates rules of exchange, self-interest, efficiency – hence market pricing dominates. The council frame triggers norms of fairness and collective voice – elevating equal rationing. The ritual frame invokes tradition, stability, lineage – privileging hereditary use. The *utility representation* is a map of choices *within* that terrain. Asking for a single "true" preference ordering across terrains misunderstands the ordinal, frame-dependent nature of the concept.

  **Dr. Chen:** But that’s precisely my point! If the "map" changes completely with the terrain, what anchors the *terrain selection* itself? Why do individuals consistently enter the *market* frame when presented with pricing options, enacting one set of choices, and the *ritual* frame when presented with lineage symbols, enacting another? There must be some *enduring internal structure* – a set of values, commitments, or meta-norms – that governs *which* institutional logic they adopt in a given situation. *That* structure is what explains the frame-consistent choices, not local utility indices devoid of psychological content.

  **Dr. Voss:** You posit a "meta-norm," Marcus, but what evidence exists for it beyond the very choices it's meant to explain? Revealed preference, by its lights, can only capture choices *within* a revealed frame. The act of *engaging* with the market frame *is* a choice, potentially revealing a "meta-preference" for market contexts *in that moment*. But that too is ordinal and context-bound! We observe: when offered a market-like setup, they engage and choose pricing; when offered a ritual setup, they engage and choose heredity. We need not infer a hidden, stable "commitment" structure. The sequence of frame-engagements and within-frame choices *is* the data. Adding unobservable mental states is explanatory overreach.

  **Dr. Chen:** It's not overreach if it provides necessary explanatory power the purely ordinal view lacks. Consider *learning* or *persuasion*. If I argue to a cooperative member that hereditary rituals are inefficient, why might they agree *in the council frame* but revert to ritual *in the ritual frame*? The purely local utility index says: "Different frame, different preference." Full stop. But if we posit a deeper, possibly conflicted, evaluative commitment – say, valuing *both* efficiency *and* sacred tradition – we can explain the frame-dependence *as an expression of that conflict*. The utility flip isn't arbitrary; it reflects which facet of their enduring normative structure the frame makes salient. Without that anchor, "preference" loses its connection to *why* people choose, reducing economics to a tautological record of past choices within rigid boxes.

  **Dr. Voss:** And yet, for policy within a *known, stable* institutional box – setting water prices *in the market system* – the local revealed preference (market > equal > hereditary) is perfectly sufficient and non-tautological. It tells us what choices to expect *given the market frame is operational*. Predicting choices in entirely novel or blended frames *is* hard, but that doesn't invalidate the model within its domain. Your "deeper commitment" is elegant metaphysics, Marcus, but is it falsifiable? How do we observe this "enduring normative structure" except through... more choices in more contexts, which again require their own local indices?

  **Dr. Chen:** Fair challenge. Here’s the empirical crux: **Predictive Scope under Frame Hybridization.** Suppose we create a new, ambiguous decision scenario for the cooperative – perhaps allocating emergency drought funds using a mix of market bids *and* council votes *and* appeals to hereditary seniority. The purely ordinal, frame-bound view predicts chaos or requires arbitrary assumptions about which frame dominates. It offers no principled way to aggregate the three separate utility orderings. My view predicts choices will reflect the *relative salience or weight* of the member’s *enduring values* (efficiency, fairness, tradition) in this *novel* context. We could test this by first measuring value salience independently – through nuanced surveys, ethnographic interviews, or observing behavior in value-priming tasks *unrelated* to water allocation – and then seeing if those value weights predict choices in the hybrid frame better than any extrapolation from the pure-frame choices.

  **Dr. Voss:** And my counter-test: **Consistency under Frame Replication vs. Value Priming.** First, meticulously replicate the three pure frames to confirm the stable, cyclical orderings. Then, *before* presenting the hybrid frame, prime members *heavily* towards one of your proposed "enduring values" – say, efficiency – using your surveys or unrelated tasks. If your view holds, this priming should shift choices in the hybrid frame *towards* the market-pricing scheme. If my view holds, the hybrid frame itself will establish its *own* local institutional logic, and choices will be determined by *that* context, largely unaffected by prior priming of abstract values. The pure-frame orderings will remain robustly replicable regardless of priming. The local institutional logic, not a cross-situational mental state, is the dominant driver.

  **Dr. Chen:** (Nods slowly) So, the battleground is prediction in the ambiguous hybrid context: does externally primed value salience trump the emergent logic of the novel frame, or is the novel frame sovereign? That... would indeed be illuminating.

  **Dr. Voss:** (Sips coffee) Agreed. Let the data from the muddy fields decide. Though I suspect the frame will prove mightier than the ghost in the machine.

  **Dr. Chen:** And I remain convinced that without that ghost, the machine's output is merely noise, not meaningful choice. To the field, then.

  *(They raise their coffee cups in a silent, unresolved toast to empirical rigor.)*
