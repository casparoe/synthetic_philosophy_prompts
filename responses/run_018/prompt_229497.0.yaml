prompt: |-
  Draft the joint statement that a committed mathematical platonist and a committed nominalist about applied mathematics could both sign after a good-faith adversarial collaboration. The question they have been asked to make progress on is this: when an empirical explanation in science or ordinary life makes essential use of mathematics—an optimality theorem, an arithmetic property, a topological constraint—does that use give us reason to believe the mathematical objects involved exist, or can all the explanatory work be recovered by a paraphrase that carries no commitment to abstract objects?

  The statement should use only examples whose structural features are common ground. Include at least these three: a graph-theoretic impossibility used to explain why some task cannot be completed; a geometry-based minimization used to explain why some physical structure takes the shape it does; and an appeal to an arithmetic property such as primality used to explain a biological or physical regularity. If the parties cannot agree on the empirical details of a particular example, they should formulate the example at the level of the structural feature in dispute.

  They have already agreed to one methodological constraint: any proposed nominalist reconstruction will be judged not only by whether it preserves truth values, but by whether it preserves the explanatory and inferential role the mathematics actually played—call this the role-preservation condition. The document should state whether this condition is itself part of the agreed framework or is one of the points of contention.

  Write the document in American English, in three parts. First, a numbered list of claims both can sign, covering what the examples show about scientific practice, what the role-preservation condition requires, which forms of nominalism and platonism are off the table, and what must be true of a reconstruction for it to settle the dispute. Second, a disagreements table whose rows are the central disputes; for each row give a neutral formulation of the question, a formulation each side would accept as the statement of its own view, and a judgment about whether the residual disagreement is substantive or verbal (and if verbal, in what respect). Third, a list of cruxes: sub-questions such that a settled answer to any one would move at least one side. For each crux, give a concrete case or argument both sides agree bears on it, and record in advance what the platonist and the nominalist each predict about it.
reasoning: |-
  We are drafting a joint statement after an adversarial collaboration between a mathematical platonist and a nominalist. The topic is whether the use of mathematics in empirical explanations gives us reason to believe in the existence of mathematical objects, or if the explanatory work can be recovered without commitment to abstract objects.

  We have three examples to cover:
  1. A graph-theoretic impossibility explaining why a task cannot be completed.
  2. A geometry-based minimization explaining a physical structure's shape.
  3. An arithmetic property (like primality) explaining a biological or physical regularity.

  Methodological constraint: the nominalist reconstruction must preserve the explanatory and inferential role (role-preservation condition). We need to state whether this condition is agreed upon.

  The document has three parts:
  I. A numbered list of agreed claims.
  II. A disagreements table (with neutral question, each side's view, and judgment on whether the disagreement is substantive or verbal).
  III. A list of cruxes (sub-questions that would move at least one side) with concrete cases and predictions.

  Let's start.

  Part I: Agreed Claims

  We need to cover:
  - What the examples show about scientific practice.
  - What the role-preservation condition requires.
  - Which forms of nominalism and platonism are off the table.
  - What must be true of a reconstruction to settle the dispute.

  Agreed Claims:

  1. In scientific practice, mathematical explanations are pervasive and often indispensable for deriving predictions and understanding empirical phenomena. The examples we considered (graph-theoretic, geometric minimization, and arithmetic) illustrate that mathematics is deeply embedded in scientific reasoning.

  2. The role-preservation condition requires that any nominalist reconstruction of a mathematical explanation must not only preserve the truth values of the empirical claims but also the structure of the explanation, including the inferential steps and the explanatory power. Both parties agree that this condition is a legitimate constraint on the debate.

  3. Extreme forms of nominalism that deny the truth of mathematical statements (such as fictionalism) are off the table for the purpose of this collaboration because they cannot satisfy the role-preservation condition without significant cost. Similarly, extreme forms of platonism that insist on the causal efficacy of mathematical objects are also off the table because they are not required by the explanations in question.

  4. Similarly, platonist views that require mathematical objects to play a causal role in the physical world are off the table because they are not supported by the examples we considered.

  5. For a reconstruction to settle the dispute, it must meet two conditions: (a) it must be ontologically non-committal to abstract mathematical objects, and (b) it must satisfy the role-preservation condition. The platonist maintains that no such reconstruction is possible for the central cases, while the nominalist believes it is.

  6. The examples we have considered (graph-theoretic, geometric, and arithmetic) are representative and structurally typical of how mathematics is used in scientific explanations.

  Part II: Disagreements Table

  We need a table with rows for central disputes. Each row has:
  - Neutral formulation of the question.
  - The platonist's view (as they would state it).
  - The nominalist's view (as they would state it).
  - Judgment on whether the residual disagreement is substantive or verbal (and if verbal, in what respect).

  Proposed rows:

  1. Question: Does the indispensability of mathematics in scientific explanations provide evidence for the existence of abstract mathematical objects?
     - Platonist: "Yes, because the explanatory power of mathematics in science is best explained by the truth of the mathematical theories involved, which in turn requires the existence of the abstract objects they describe."
     - Nominalist: "No, because the explanatory work can be fully captured by a nominalistic reconstruction that does not commit to abstract objects, and the appearance of indispensability is due to our representational practices."
     - Judgment: Substantive.

  2. Question: Can the role-preservation condition be satisfied by a nominalist reconstruction in the central cases?
     - Platonist: "No, because the mathematical structures are playing an ineliminable explanatory role; any reconstruction that avoids reference to abstract objects will either fail to capture the explanatory connection or be parasitic on the mathematics it attempts to eliminate."
     - Nominalist: "Yes, because we can provide reconstructions that mimic the mathematical reasoning without ontological commitment, for instance by using modal or logical resources that do not require the existence of abstract objects."
     - Judgment: Substantive.

  3. Question: Is the explanatory power of a mathematical explanation dependent on the truth of the mathematical theory?
     - Platonist: "Yes, because if the mathematical theory were false, it could not correctly explain the physical phenomenon."
     - Nominalist: "No, because the mathematical theory is a useful fiction; what matters is that it is applied consistently and that it helps us organize our experience, not that it is literally true."
     - Judgment: Substantive, but with a verbal component regarding the meaning of "truth" in mathematics.

  4. Question: Are the abstract mathematical objects themselves part of the explanation?
     - Platonist: "Yes, the properties of abstract mathematical objects (such as the structure of a graph, the properties of a geometric shape, or the primality of a number) are what explain the physical phenomena."
     - Nominalist: "No, the explanation works because of the physical structure and its properties; the mathematics is merely a representation of that structure. The abstract objects are not doing the explaining; the physical world is."
     - Judgment: Substantive.

  Part III: Cruxes

  For each crux, we need:
  - A concrete case or argument both sides agree bears on it.
  - The platonist's prediction.
  - The nominalist's prediction.

  Cruxes:

  1. Crux: Can a nominalist reconstruction of the graph-theoretic impossibility explanation satisfy the role-preservation condition?
     - Concrete Case: Consider the explanation of why the Königsberg bridge problem has no solution. The graph-theoretic explanation uses the concept of the degrees of vertices and Euler's theorem to show that a Eulerian path is impossible. The nominalist must provide a reconstruction that avoids reference to abstract graphs and numbers but still explains why no such path exists and preserves the inferential steps.
     - Platonist Prediction: Any such reconstruction will either fail to capture the generality of the explanation (by being tied to specific physical configurations) or will implicitly rely on mathematical facts about abstract graphs.
     - Nominalist Prediction: A reconstruction using physical relations and modal claims (e.g., about possible rearrangements of bridges) can capture the same explanatory structure without reference to abstract objects.

  2. Crux: Can a nominalist reconstruction of the geometric minimization explanation satisfy the role-preservation condition?
     - Concrete Case: Consider the explanation of why soap films form minimal surfaces. The explanation uses the mathematics of minimal surfaces in differential geometry. The nominalist must reconstruct this without reference to abstract geometric spaces and functions.
     - Platonist Prediction: The nominalist reconstruction will not be able to capture the counterfactual depth of the explanation (why the soap film would take a different shape under different boundary conditions) without invoking the mathematical objects.
     - Nominalist Prediction: By using physical properties (like energy minimization) and approximations, we can explain the shape without abstract objects, and the mathematics is just a tool to compute the outcome.

  3. Crux: Can a nominalist reconstruction of the arithmetic explanation (using primality) satisfy the role-preservation condition?
     - Concrete Case: Consider the explanation of why cicadas emerge in prime-numbered life cycles (e.g., 13 or 17 years). The explanation uses the fact that prime numbers minimize overlap with predators that have periodic life cycles. The nominalist must reconstruct this without reference to numbers as abstract objects.
     - Platonist Prediction: The nominalist reconstruction will not be able to capture the reason why prime numbers are effective without implicitly appealing to the properties of abstract numbers.
     - Nominalist Prediction: We can reconstruct the explanation in terms of physical periods and the greatest common divisor without reference to abstract numbers, by using concrete tokens (e.g., cycles of events) and combinatorial properties.

  Now, let's write the joint statement accordingly.
answer: |-
  ### Joint Statement: Adversarial Collaboration on Mathematical Explanation and Ontology  
  **Parties:** Committed Mathematical Platonist (P) and Committed Nominalist (N)  
  **Question Addressed:** When an empirical explanation in science or ordinary life makes essential use of mathematics, does this use give us reason to believe the mathematical objects involved exist? Or can all explanatory work be recovered by a paraphrase carrying no commitment to abstract objects?  

  #### I. Agreed Claims  
  Both parties endorse the following statements:  

  1. **Scientific Practice Relies on Mathematics:** Empirical explanations often depend structurally on mathematics. Examples include:  
     - **Graph-theoretic impossibility:** Explaining why a task (e.g., routing deliveries without backtracking) is impossible due to the degrees of nodes in a network.  
     - **Geometry-based minimization:** Explaining why a physical structure (e.g., a soap film) adopts a shape that minimizes surface area or energy.  
     - **Arithmetic property:** Explaining a regularity (e.g., synchronization of biological cycles) by appeal to properties like primality or divisibility.  
     In each case, the mathematics is not merely heuristic; it is treated as a necessary component of the explanation.  

  2. **Role-Preservation Condition is Binding:** Any nominalist reconstruction must not only preserve the truth values of empirical claims but also the *explanatory and inferential role* played by mathematics. This includes:  
     - Capturing counterfactual dependencies (e.g., "If the graph were Eulerian, the task would be possible").  
     - Maintaining the generality, unificatory power, and predictive precision of the original explanation.  
     This condition is part of our shared framework and not disputed.  

  3. **Off-the-Table Positions:**  
     - **Nominalism:** Views that deny the objectivity of mathematical truth (e.g., radical fictionalism) or reject the role-preservation condition are excluded.  
     - **Platonism:** Views that require mathematical objects to be causally active (e.g., "shapes cause soap films to form") or physically instantiated are excluded.  
     Both agree that mathematical objectivity does not entail causal efficacy.  

  4. **Settling the Dispute:** A successful nominalist reconstruction must:  
     - Eliminate reference to abstract objects (e.g., graphs, numbers, geometric spaces).  
     - Satisfy the role-preservation condition (per #2).  
     If such reconstructions exist for all cases, N wins; if they fail indispensably, P wins.  

  5. **Common Ground on Examples:** Our cases are formulated at the level of structural features to avoid empirical disputes:  
     - **Graph theory:** A task’s impossibility is explained by a graph property (e.g., non-Eulerian paths).  
     - **Geometry:** A physical structure’s shape is explained by minimization (e.g., geodesics in a space).  
     - **Arithmetic:** A regularity (e.g., periodicity) is explained by a number-theoretic property (e.g., primality).  

  ---

  #### II. Disagreements Table  
  | Neutral Question | Platonist’s View | Nominalist’s View | Judgment on Disagreement |  
  |------------------|------------------|-------------------|--------------------------|  
  | Does the explanatory success of mathematics in science provide evidence for the existence of abstract mathematical objects? | "Yes. The role-preservation condition shows that mathematical objects (e.g., graphs, numbers) are indispensable to the *best* explanation. Their properties (e.g., primality, topological constraints) are what ground the explanatory power, and this is best accounted for by their abstract existence." | "No. The explanatory work is fundamentally about physical structures and patterns. Mathematics is a representational tool; its success can be fully recovered by ontologically neutral reconstructions (e.g., modal or logical resources). Abstract objects add no explanatory value." | **Substantive.** Disagreement hinges on whether abstract objects are necessary for the *best* explanation. |  
  | Can a nominalist reconstruction satisfy the role-preservation condition for all central cases? | "No. Reconstructions either lose explanatory power (e.g., fail to capture counterfactuals) or covertly reintroduce mathematical commitments. For instance, geometric minimization requires reference to abstract spaces to explain why a shape *must* occur." | "Yes. Reconstructions using physical relations, modality, or syntactic rules can replicate the explanatory role without abstract objects. For example, graph-theoretic impossibility can be recast in terms of physical constraints on movement." | **Substantive.** Turns on whether reconstructions genuinely preserve all features of explanation. |  
  | Is the truth of mathematical statements (e.g., ‘7 is prime’) necessary for their explanatory success? | "Yes. If the mathematics were false (e.g., if primes lacked their properties), the explanation would fail. This truth requires abstract objects as truthmakers." | "No. Explanatory success depends only on consistency and applicability. ‘7 is prime’ is a useful fiction; the real work is done by physical patterns (e.g., cyclical alignments)." | **Verbal (in part).** Disagreement partly reflects divergent conceptions of "truth" (e.g., N rejects truthmakers). |  
  | Do mathematical objects *themselves* explain, or do they merely describe? | "Mathematical objects explain: The primality of 13 *itself* explains biological synchrony, as the property constrains physical possibilities." | "Mathematics describes: Physical patterns (e.g., predator-prey cycles) explain; mathematics merely encodes them. Abstract objects are redundant." | **Substantive.** Disagreement over direction of explanation (e.g., do abstract properties constrain physics?). |  

  ---

  #### III. Cruxes  
  Each crux is a sub-question whose resolution would force at least one party to revise their position. Both agree on the cases/arguments listed.  

  | Crux | Concrete Case/Argument | Platonist Prediction | Nominalist Prediction |  
  |------|------------------------|----------------------|-----------------------|  
  | **Can nominalism reconstruct graph-theoretic explanations without loss?** | Case: Explaining why a delivery route through a network (with odd-degree nodes) cannot be completed without backtracking. The original explanation uses Euler’s theorem (a graph has an Eulerian path iff it has 0 or 2 nodes of odd degree). | Prediction: Any reconstruction will fail role-preservation. It will either lose generality (e.g., by tying the explanation to specific nodes) or implicitly invoke abstract graphs to handle counterfactuals (e.g., “If a node were removed, the path would exist”). | Prediction: A reconstruction using physical relations (e.g., “odd-numbered junctions force backtracking”) and combinatorial logic (without abstract graphs) will fully preserve explanatory power. |  
  | **Can nominalism reconstruct geometric minimization explanations without loss?** | Case: Explaining why a soap film forms a minimal surface. The original explanation invokes abstract geometric properties (e.g., mean curvature vanishing in ℝ³). | Prediction: Reconstructions will fail to explain *why* the film minimizes area across variations (e.g., under altered boundary conditions). This requires reference to abstract spaces, not just physical forces. | Prediction: A reconstruction using energy minimization and physical constraints (e.g., surface tension) will capture all explanatory content. Mathematics is a calculational tool, not an ontological commitment. |  
  | **Can nominalism reconstruct arithmetic explanations without loss?** | Case: Explaining why a biological cycle (e.g., species emergence) avoids predators by having a prime-period duration (e.g., 13 years). The original explanation cites the low overlap probability due to primality. | Prediction: Reconstructions will be ad hoc (e.g., listing pairwise co-prime cycles) and lose the unifying power of primality. Abstract numbers are needed to explain why *primality specifically* is optimal. | Prediction: A reconstruction using physical periods and their combinatorial interactions (e.g., “no divisor match”) will preserve the explanation. Primality is shorthand for a physical pattern, not an abstract fact. |  

  ---  
  **Signed,**  
  [P] Committed Mathematical Platonist  
  [N] Committed Nominalist  
  **Date:** October 26, 2023
