  Hmm, the audience sounds tough: mostly phil of mind/action folks who know Plato well, plus some ethicists suspicious of normativity smuggling. Key concerns they'll raise: instrumental rationality vs moral reasons, redefining "reason," and whether diachronic unity is normative. 

