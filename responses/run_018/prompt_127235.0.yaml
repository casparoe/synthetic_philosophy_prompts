answer: |-
  1. While the entitlement approach argues that famines stem from distributional failures rather than absolute scarcity, the Great Leap Forward presents a challenge: agricultural output collapsed catastrophically due to both policy and environmental factors. How does your application of Sen’s framework avoid downplaying the role of aggregate food shortage in such cases, especially when FAD and entitlement collapse are intertwined?  
     *Follow-up: When confronted with the argument that disastrous policies merely aggravated an unavoidable production collapse—say, from drought or pest infestation—how do you demonstrate that the entitlement system’s breakdown was the primary driver of mass starvation rather than a secondary factor?*  

  2. You contend that democratic institutions prevent famine, yet the Irish famine occurred under a parliamentary democracy in Britain. How do you reconcile Ireland’s catastrophe with the claim that electoral accountability safeguards entitlements, given that London had the power to intervene?  
     *Follow-up: If the defense is that colonial Ireland lacked meaningful representation in Westminster, does this not concede that democracy’s protective function depends on inclusive institutions—and if so, how does this reshape Sen’s thesis to address power asymmetries?*  

  3. Labeling famine as a "political crime" implies moral agency, but your work emphasizes "silent entitlement erosion"—where informal safety nets (e.g., kinship support) unravel through state procurement or speculative pricing without explicit malice. Why does this passive unraveling deserve the same culpability as active withholding of food?  
     *Follow-up: If the counterargument is that this constitutes structural violence without individual intent, how do you justify assigning criminal responsibility to policymakers for outcomes mediated by complex market dynamics?*  

  4. For the Bengal famine, I propose distinguishing "direct entitlement failure" (e.g., urban laborers losing wage value) from "proxy entitlement failure" (e.g., their dependents starving despite never holding direct claims). How does recognizing this distinction reframe our understanding of vulnerability in crises where household—not individual—entitlements collapse?  
     *Follow-up: Should critics dismiss proxy failures as derivative suffering—thus less politically urgent—how do you counter that this neglects the gendered and age-based dimensions of famine mortality, as seen in Bengal’s higher death rates among women and children?*  

  5. In both the Irish and Bengal famines, food was exported amid starvation—suggesting entitlement collapse was tied to integration into global markets. How does the entitlement approach explain why greater market connectivity sometimes amplifies, rather than mitigates, vulnerability to famine?  
     *Follow-up: When economists argue that exports reflect comparative advantage and efficient allocation, how do you reconcile this with Sen’s view that market mechanisms can actively destroy traditional entitlements?*  

  6. The Great Leap Forward involved coercive state procurement that directly confiscated food from farmers. How does the entitlement approach distinguish between state-induced entitlement collapse (e.g., procurement quotas) and state neglect (e.g., failing to regulate prices), and does this difference affect the moral gravity of the "crime"?  
     *Follow-up: If the reply is that both stem from state failure, how do you weigh intent—such as extractive policies versus incompetence—in assigning blame?*  

  7. Famines like Bengal saw simultaneous starvation among landless laborers and relative security for landowners with direct production access. How does the entitlement approach address this inequality in resilience—and does it challenge the assumption that localized food availability guarantees survival?  
     *Follow-up: Does this imply that land reform, by converting proxy claims into direct ones, could be more decisive than aggregate food aid in preventing famine?*  

  8. Finally, if entitlement collapse is the core problem, what policy interventions would you prioritize for famine prevention today—and how might they conflict with conventional approaches focused on boosting aggregate supply?  
     *Follow-up: Given climate change threatens both production and entitlements (e.g., via price shocks), how would you adapt Sen’s framework to address emergent environmental pressures without reverting to FAD-centric thinking?*
