answer: |-
  ### Analysis of Dagen H through Lewis’s Theory of Convention  
  **Lewis’s Core Framework:**  
  David Lewis defines conventions as self-sustaining solutions to *recurrent coordination problems*, where agents prefer conformity over discord because expectations align. Conventions persist through **common knowledge** (all know X, all know that all know X, ad infinitum) and **salience** (one option stands out as a natural focal point). They emerge or dissolve gradually as agents adjust expectations based on observed behavior.  

  #### Mapping Dagen H to Lewisian Elements:  
  1. **Agents & Coordination Problem:**  
     - **Drivers:** Face a pure coordination problem (avoid collisions). Payoff: Mutual survival.  
     - **Pedestrians:** Secondary coordination with drivers (crossing safely). Payoff: Predict driver behavior.  
     - **State/Vehicle Importers:** Introduce asymmetry. Importers favored left-hand-drive (LHD) vehicles (75% of Sweden’s fleet pre-1967), creating *misalignment*: drivers sat on the "wrong" side for left-hand traffic, reducing visibility. This made crashes likelier—a **material asymmetry** destabilizing the equilibrium.  

  2. **Alternatives & Salience:**  
     - **Left vs. Right:** Arbitrary in isolation, but salience shifted due to:  
       - *Geography:* Sweden’s neighbors (Norway, Finland) drove on the right, complicating cross-border travel.  
       - *Technology:* LHD vehicles made right-hand traffic *objectively safer* (better road visibility).  
       - *Global Trends:* 90% of countries used right-hand traffic by 1967, making it globally salient.  
     The status quo (left) lost salience—its instability (LHD mismatch) made it *conspicuously suboptimal*.  

  3. **State Intervention vs. Lewisian Prediction:**  
     - **Lewis’s Model Prediction:**  
       - Gradual shift as individual drivers adopt right-hand driving at borders or in LHD cars, leveraging the safety salience.  
       - Common knowledge would erode slowly as deviations accumulate.  
     - **Reality of Dagen H:**  
       - The state **imposed a new focal point** via law (mandating right-hand driving) and infrastructure (re-signing roads, temporary speed limits).  
       - **Destruction of Common Knowledge:** On 3 September 1967, the state *reset* expectations overnight. Pre-Dagen H, common knowledge anchored left-hand driving; post-Dagen H, law and mass coordination (media campaigns, road closures) rebuilt it around right-hand driving.  
       - **Material Asymmetry as Catalyst:** Lewis’s model *can* accommodate external shocks (e.g., technology shifts), but not instant abolition. Here, LHD prevalence made the convention *vulnerable* to top-down intervention.  

  #### Asymmetric Norm Divergence: Drivers vs. Pedestrians  
  - **Driver Norms:** Flipped immediately due to **enforced expectations** (fines, police presence) and infrastructural salience (repainted lanes, new signs).  
  - **Pedestrian Norms:** Habitual "look left" behavior lagged. This created **inter-group mismatches**: Pedestrians acted on old expectations (drivers on left), while drivers followed new rules.  
  - **Lewisian Limitation:** Lewis assumes homogeneous agents with symmetric stakes. Here:  
    - **Drivers** faced high-cost defection (crashes, fines).  
    - **Pedestrians** had lower stakes and less enforcement, allowing habit inertia.  
    Lewis’s peer-based model lacks tools for **stratified coordination** between groups with divergent incentives/risk profiles.  

  ### What Dagen H Reveals About Lewis’s Theory:  
  **Confirmation of Lewisian Insights:**  
  1. **Salience Matters:** Right-hand traffic became salient *before* Dagen H due to LHD dominance and neighbor norms. The state exploited this latent salience.  
  2. **Common Knowledge is Foundational:** The switch succeeded because the state engineered *new common knowledge* (via media blitz, synchronized timing). Without this, chaos would have ensued.  

  **Limitations Exposed:**  
  1. **Top-Down Substitution of Evolution:** Lewis treats conventions as emergent, but Dagen H shows **institutions can forcibly replace equilibria** by:  
     - Eliminating the old convention’s common knowledge (declaring it void).  
     - Creating new salience through coordinated action (state as "super-agent").  
  2. **Material Asymmetry Overrides Arbitrariness:** Lewis treats conventions as arbitrary if symmetrical. But LHD vehicles made left-hand driving *objectively worse*, destabilizing the equilibrium—a factor underdeveloped in Lewis’s model.  
  3. **Heterogeneous Agents:** Divergent driver/pedestrian responses reveal that conventions in complex societies require **multi-group coordination models**, which Lewis’s framework lacks.  

  **Conclusion:**  
  **Dagen H demonstrates that while conventions *persist* through Lewisian common knowledge, they can be *created or destroyed* top-down when institutions disrupt expectations and align salience with material realities.** The state did not merely "reveal" a focal point; it *manufactured* one by leveraging pre-existing asymmetries (LHD cars) and annihilating the old convention’s epistemic foundation. Lewis’s model explains *why* the new norm stabilized (rebuilt common knowledge) but not *how* it emerged overnight. Thus, **conventions require a stable common-knowledge foundation to endure, but institutional scaffolding can replace evolutionary emergence when material conditions undermine equilibrium stability.** Dagen H is less a refutation of Lewis than a demonstration of the *conditions under which top-down intervention can shortcut evolution*: namely, when technology creates costly asymmetries and the state can coordinate common knowledge reset at scale.
