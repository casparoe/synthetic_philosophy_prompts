prompt: |-
  I run citizen assemblies for a mid-sized city and we're constantly arguing over whether to decide things with a big random pool or a small expert panel. I want a practical decision procedre based on the Condorcet jury theorem, but not the classroom version where voters are isolated and equally smart. In real life people talk beforehand, experts dominate the room, and competence varies wildly. So I need you to turn this into an operational checklist — call it the correlated-competence jury rule — that my staff can run in about fifteen minutes before we design a session. It should ask things in order: first check for independance decay (how much prior discussion or media exposure has already happened), then a rough competence spread (without actual testing), then the stakes of being wrong, then whether strategic voting is likely. For each step say what counts as sufficient, where the procedre outputs "use the small panel", where it outputs "use the large pool", and where it has to punt to a human because it's a values question not a fact. Then apply it to three cases: routing a bike lane through a residential neighborhood, changing zoning near an old factory site, and picking a contractor for hidden water-main repairs where the mayor wants a popular vote but the technical risks are high — that last one should come out against the mayor's preference. Finally say exactly what the procedre can't handle, like negative correlation between bias and expertise, and be honest about which steps are judgment calls dressed up as steps. Write it casual, no need for references.
reasoning: |-
  We are creating a decision procedure called the "correlated-competence jury rule". The goal is to decide between a big random pool (large assembly) and a small expert panel for making a decision. The procedure is a checklist that considers:

  1. Independence decay (how much prior discussion or media exposure has already happened) → this affects independence of votes.
  2. Rough competence spread (without testing) → how much variation in expertise and knowledge among the potential voters.
  3. The stakes of being wrong → how costly a wrong decision is.
  4. Whether strategic voting is likely → if voters might vote strategically instead of truthfully.

  For each step, we define what counts as sufficient to make a decision, and when we have to punt to a human because it's a values question.

  We also apply the procedure to three cases:

  A. Routing a bike lane through a residential neighborhood.
  B. Changing zoning near an old factory site.
  C. Picking a contractor for hidden water-main repairs (with high technical risks and the mayor wanting a popular vote).

  Finally, we note what the procedure can't handle and which steps are judgment calls.

  ---

  **The Correlated-Competence Jury Rule: A Practical Checklist**

  *Instructions: Go through each step in order. If at any step you get a clear answer (use large pool or small panel), stop and output that. If a step requires a judgment that cannot be made objectively, or if the answer is ambiguous, mark it for human review. The entire process should take about 15 minutes.*

  ---

  **Step 1: Independence Decay (Prior Exposure)**

  *Ask: How much have people already discussed this issue or been exposed to media about it?*

  - **Low exposure (sufficient for independence):** Little to no prior discussion; the issue is new to most. People haven't formed strong opinions. → **Leans toward large pool.**
  - **Moderate exposure:** Some discussion, but not everyone is locked in. There's room for new information to change minds. → **Punt to Step 2.**
  - **High exposure (independence decay high):** Heavy media coverage, public debates, or organized campaigns. People have strong, fixed opinions. → **Leans toward small panel** (because votes are correlated and the "wisdom of crowds" fails when independence is lost).

  *Output:*
  - If **low exposure** → **Output: Use large pool** (unless overruled by later steps? But we go step-by-step so if we get a clear answer we stop. So if low exposure, we stop and say large pool? But note: if stakes are high and competence is low, we might want to reconsider. However, the procedure is sequential and we stop at the first step that gives a clear answer. However, we might adjust: we stop only if the step gives a strong signal. Let's define: if low exposure and the issue is not highly technical? Actually, we have to be cautious. We'll say: if low exposure **and** the issue doesn't require specialized expertise (which we check in step 2) then we can go to large pool. But step 2 is next. So maybe we don't stop at step 1? We need to re-think. Alternatively, we can make step 1 a gate: if high exposure, then we immediately go to small panel because independence is broken and the large pool will just reflect the pre-existing bias. But if low exposure, we continue to step 2 because we still need to check competence. So let's adjust:*

  *Revised Step 1:*
  - **High exposure:** → **Output: Use small panel** (stop here). Reason: When independence is broken, the large pool doesn't work as per Condorcet.
  - **Moderate or low exposure:** → Proceed to Step 2.

  ---

  **Step 2: Rough Competence Spread**

  *Ask: Without testing, what's the rough spread of expertise? Consider: Is this a technical issue requiring specialized knowledge? How many people in the community have that knowledge?*

  - **High competence spread (many experts, few low-competence):** The issue is non-technical (like a common-sense moral or community preference) OR there are many people with relevant experience. → **Leans toward large pool.**
  - **Low competence spread (few experts, many low-competence):** The issue is highly technical and only a handful of people have the expertise to evaluate it properly. → **Leans toward small panel.**
  - **Mixed or hard to tell:** → Proceed to Step 3.

  *How to judge?*
  - Non-technical issues (e.g., community preferences, aesthetic choices) → high competence spread (many people can judge).
  - Technical issues (e.g., engineering, legal, financial) → low competence spread (only experts can judge).

  *Output:*
  - If the issue is **non-technical** and you have **high competence spread** → **Output: Use large pool** (stop here).
  - If the issue is **highly technical** and you have **low competence spread** → **Output: Use small panel** (stop here).
  - Otherwise (mixed, or you're not sure) → Proceed to Step 3.

  ---

  **Step 3: Stakes of Being Wrong**

  *Ask: What are the consequences of a wrong decision?*

  - **Low stakes:** Minimal harm if wrong; reversible decision. → **Leans toward large pool.**
  - **High stakes:** Severe consequences (safety risks, huge costs, irreversible damage). → **Leans toward small panel** (because we want to minimize the chance of error, and a small panel of experts might have higher average competence and lower variance).
  - **Medium stakes:** → Proceed to Step 4.

  *Output:*
  - **Low stakes** → **Output: Use large pool** (stop here).
  - **High stakes** → **Output: Use small panel** (stop here).
  - **Medium stakes** → Proceed to Step 4.

  ---

  **Step 4: Strategic Voting Likelihood**

  *Ask: Is there a strong incentive for people to vote strategically (i.e., not according to their true belief) to achieve a particular outcome?*

  - **Low strategic incentive:** The issue is not polarizing and there are no strong factions. People will vote honestly. → **Leans toward large pool.**
  - **High strategic incentive:** There are organized groups that will try to sway the vote, or individuals have strong personal stakes that might lead them to vote strategically. → **Leans toward small panel** (because strategic voting breaks the Condorcet assumptions and a small panel of experts might be more insulated from such pressures).
  - **Unclear:** → **Punt to human review** (because this is often a values question: how much do we value democracy vs. accuracy?).

  *Output:*
  - **Low strategic incentive** → **Output: Use large pool** (stop here).
  - **High strategic incentive** → **Output: Use small panel** (stop here).
  - **Unclear** → **Output: Human review needed** (explain why: strategic voting risk is ambiguous and the trade-off between inclusion and accuracy must be weighed by a human).

  ---

  **What the Procedure Can't Handle (Limitations):**

  1. **Negative correlation between bias and expertise:** If the experts are systematically biased (e.g., they have conflicts of interest) and the crowd is less biased but less competent, the procedure might not capture that. We assume that experts are less biased in their domain, but that's not always true.

  2. **Steps that are judgment calls:** 
     - Step 1 (exposure) is a judgment call: how much exposure is "high"? 
     - Step 2 (competence) is highly subjective: what counts as technical? 
     - Step 4 (strategic voting) is also a judgment.

  3. **Group dynamics in the small panel:** We assume the small panel will deliberate well, but if there's a dominant expert who silences others, that's a risk.

  4. **Extremely low competence:** If the average competence is below 50%, then larger groups do worse. But we don't measure average competence, only the spread.

  5. **Correlation structure:** We only check for independence decay in step 1, but there might be other sources of correlation (e.g., common cultural biases) that we don't account for.

  ---

  **Applying the Procedure to Three Cases:**

  **Case A: Routing a bike lane through a residential neighborhood.**

  - Step 1: **Exposure**? Likely high exposure because it's a local issue that residents have strong opinions about. → **High exposure: use small panel?** But wait, maybe not? Let's think: often these issues are highly debated. So Step 1: high exposure → output: use small panel. But is that the right call? Maybe we should check further? According to the procedure, we stop at step 1 if high exposure. So output: use small panel.

  *However, note: the procedure might be too rigid. But for the sake of the exercise:*

  *Alternatively, if we think exposure is moderate? Let's assume for this case that there has been a lot of neighborhood discussion and petitions. So Step 1: high exposure → Output: use small panel.*

  **Case B: Changing zoning near an old factory site.**

  - Step 1: Exposure? This might be moderate. It's a local issue but not necessarily highly publicized until now. → Proceed to Step 2.
  - Step 2: Competence? Zoning involves technical aspects (e.g., environmental impact, urban planning) but also community preferences. Mixed? → Proceed to Step 3.
  - Step 3: Stakes? Moderate to high (economic impact, environmental risks). If we consider high stakes → Output: use small panel. But let's say medium stakes? Then proceed to Step 4.
  - Step 4: Strategic voting? Likely high because developers, homeowners, and environmental groups have strong interests. → Output: use small panel.

  *Overall: either at step 3 (if stakes high) or step 4 (if stakes medium and then strategic voting high) → use small panel.*

  **Case C: Picking a contractor for hidden water-main repairs (high technical risks, mayor wants popular vote).**

  - Step 1: Exposure? Low to moderate. Technical details of contractor selection are not typically public. → Proceed to Step 2.
  - Step 2: Competence? Highly technical (engineering, contract law, risk assessment). Only a few experts (city engineers, procurement specialists) are competent. → Output: use small panel (stop at step 2).

  *This goes against the mayor's preference for a popular vote. Reason: high technicality and low competence spread.*

  ---

  **Final Note:** This procedure is a heuristic. It's designed to be quick and practical. The goal is to capture the key factors that break the independence and competence assumptions of the Condorcet theorem in real-world settings. But it relies on subjective judgments at every step. Staff should document their reasoning and escalate close calls to a human overseer.
answer: |-
  ### The Correlated-Competence Jury Rule: A 15-Minute Checklist  
  *(For deciding between a big random pool or small expert panel)*  

  **How It Works:**  
  Run these steps in order. Stop early if you get a clear answer. If a step is ambiguous or requires values-based judgment, punt to a human (e.g., your team lead). No testing or data needed—just gut checks and quick debate.  

  ---

  #### **Step 1: Check Independence Decay**  
  *"How much have people already talked about this or been swayed by media/peers?"*  
  - **Low decay** (sufficient for big pool):  
    - *Signs*: Issue is new, obscure, or complex enough that most people haven’t formed strong opinions. No viral social media, no town hall fights.  
    - **→ Output: Proceed to Step 2** (not decided yet).  
  - **High decay** (kills independence):  
    - *Signs*: Heavy news coverage, loud advocacy groups, or pre-meeting lobbying. People are dug into tribes.  
    - **→ Output: USE SMALL PANEL** (stop here). Crowd wisdom fails when opinions are correlated.  

  #### **Step 2: Guesstimate Competence Spread**  
  *"How wild is the gap between experts and clueless folks?"*  
  - **Narrow spread** (sufficient for big pool):  
    - *Signs*: Issue is common-sense (e.g., "should parks have more benches?"). Expertise is broad (e.g., teachers, parents on school policy).  
    - **→ Output: USE BIG POOL** (stop here).  
  - **Wide spread** (favors experts):  
    - *Signs*: Technical details matter (e.g., engineering, law, data analysis). Only 5–10% of people grasp nuances.  
    - **→ Output: USE SMALL PANEL** (stop here).  
  - **Messy middle** (uncertain):  
    - *Signs*: Mix of simple and complex angles (e.g., zoning with both traffic and heritage concerns).  
    - **→ Output: Proceed to Step 3**.  

  #### **Step 3: Weigh Stakes of Being Wrong**  
  *"What’s the cost of a bad decision?"*  
  - **Low stakes** (safe for big pool):  
    - *Signs*: Reversible, cheap, or low-impact (e.g., choosing a mural design).  
    - **→ Output: USE BIG POOL** (stop here).  
  - **High stakes** (demands precision):  
    - *Signs*: Safety risks, major costs, or irreversible harm (e.g., structural engineering, legal liability).  
    - **→ Output: USE SMALL PANEL** (stop here).  
  - **Medium stakes** (gray area):  
    - *Signs*: Annoying but not disastrous (e.g., changing bus routes).  
    - **→ Output: Proceed to Step 4**.  

  #### **Step 4: Gauge Strategic Voting Risk**  
  *"Will people vote to ‘win’ versus voting honestly?"*  
  - **Low risk** (safe for big pool):  
    - *Signs*: No factions, no personal gains/losses, or issue is boring.  
    - **→ Output: USE BIG POOL** (stop here).  
  - **High risk** (experts resist pressure):  
    - *Signs*: Political agendas, money on the line, or vocal interest groups (e.g., NIMBYs vs. developers).  
    - **→ Output: USE SMALL PANEL** (stop here).  
  - **Unclear/Values conflict**:  
    - *Signs*: Trade-off between fairness (big pool) and accuracy (small panel) is too subjective.  
    - **→ Output: PUNT TO HUMAN**. E.g., "Do we prioritize inclusivity or error-proofing here?"  

  ---

  ### **Real-Case Applications**  
  #### Case 1: *Routing a bike lane through a residential neighborhood*  
  - **Step 1**: High decay (neighbors already fought on Facebook). → **USE SMALL PANEL**.  
  - *Why*: Pre-existing bias wrecks crowd independence. A panel of traffic engineers + balanced community reps can negotiate.  

  #### Case 2: *Changing zoning near an old factory site*  
  - **Step 1**: Moderate decay (local news covered it, but no protests). → Proceed.  
  - **Step 2**: Wide competence spread (zoning laws + environmental testing are niche). → **USE SMALL PANEL**.  
  - *Why*: Experts needed to navigate regulations/contamination risks. Big pool would oversimplify.  

  #### Case 3: *Picking a contractor for hidden water-main repairs*  
  - **Step 1**: Low decay (public hasn’t seen bids). → Proceed.  
  - **Step 2**: Wide competence spread (technical specs, contractor track records). → **USE SMALL PANEL**.  
  - *Why*: High stakes (costly leaks if wrong) + expertise gap. **Overrules mayor’s popular vote**—safety > PR.  

  ---

  ### **What This Can’t Handle (And the BS Bits)**  
  Be honest with your team:  
  1. **Negative expertise-bias correlation**: If experts are *more* biased than the public (e.g., city engineers pushing their buddies’ contracts), this ignores it.  
  2. **Dominant personalities**: A loud expert can hijack a small panel. Checklist assumes panels self-correct—they don’t always.  
  3. **Competence thresholds**: If average voter skill is <50%, big groups get *worse*. We guess—we don’t measure.  
  4. **"Judgment calls dressed as steps"**:  
     - Step 1’s "high decay" is subjective (e.g., is 100 Facebook posts "high"?).  
     - Step 2’s "wide/narrow spread" is a vibe check (no data).  
     - Step 4’s "strategic risk" is 50% mind-reading.  

  **Bottom line**: This isn’t math—it’s a debate-structuring tool. Use it to force clarity, not certainty. When in doubt, default to small panel for high-stakes tech calls, big pool for community values. Update it as you learn.
