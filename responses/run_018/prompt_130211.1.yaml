  Puzzles: the grounding problem for presentists—where do truths about the past come from? This is a major challenge. Change and persistence: how objects retain identity over time. The user mentioned puzzles like McTaggart's paradox, which questions the reality of time if events have both past and future properties.

  Now, identifying tensions. The biggest one is between a global present and Lorentz invariance. Special relativity's frame-dependence of simultaneity makes a universal "now" impossible. Presentists might try to salvage it with a preferred frame, but that's controversial. Another tension is combining temporal passage with eternalism; if all times exist, does change lose meaning? Also, reconciling quantum indeterminism with a fixed future in eternalism.

  The user is self-studying, so clarity is key. They might need these points laid out systematically. They also want to evaluate theories themselves, so neutrality is important. Their background in marine biology suggests they value empirical evidence, so emphasizing scientific constraints like relativity and thermodynamics is essential. They might appreciate knowing which points are non-negotiable versus debatable.

