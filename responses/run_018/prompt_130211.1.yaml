prompt: |-
  Hi, I'm a retired marine biologist who started reading philosphy of time after I retired, and I'm trying to get my bearings before I commit to presentism or eternalism. Can you lay out the full desiderata for any theory that claims to solve whether the past and future are real? I want the checklist of what it must actually deliver: which experiences or physical results it has to account for (like the assymetry of memory, or why special relativity doesn't seem to have a universal 'now'), which conceptual distinctions it must preserve (real vs present, tensed vs tenseless talk), and which puzzles it has to dissolve without just handwaving them away. For each item, say if it's a hard constraint or just a preference of one camp. And please flag any pair that looks jointly impossible — I've heard rumors that preserving a global present together with Lorentz invariance might be one of those. Don't rank the theories for me, I want to do that myself. I'm writing this on an old tablet so excuse the typo or two.
