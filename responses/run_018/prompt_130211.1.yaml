answer: |-
  Below is a comprehensive desiderata checklist for any theory of temporal ontology (presentism, eternalism, growing block, etc.). Items are categorized by type, with constraints/preferences clearly flagged, and tensions identified. I've structured this for systematic evaluation based on your criteria.

  ---

  ### **I. Experiential Phenomena (What Must Be Accounted For)**
  1. **Asymmetry of Memory & Knowledge**  
     - *Description*: We have records/memories of the past but not the future.  
     - *Constraint*: **Hard**. Any theory must explain this asymmetry without contradiction.  
     - *Theories at risk*: Eternalism (if future is equally real).  

  2. **Deliberation & Agency**  
     - *Description*: We act *as if* the future is open (we deliberate) and the past is fixed (we don't "undo" it).  
     - *Constraint*: **Hard**. Must explain why agency feels temporally directed.  
     - *Tension*: Eternalism must reconcile this with a "fixed" future.  

  3. **Temporal Phenomenology ("Flow" of Time)**  
     - *Description*: Subjective experience of time "passing" (e.g., "now" feels privileged).  
     - *Constraint*: **Preference** (Presentists demand it; eternalists often treat it as illusory).  

  4. **Direction of Causality**  
     - *Description*: Causes precede effects (e.g., fire causes smoke, not vice versa).  
     - *Constraint*: **Hard**. Must align with physical causality (e.g., thermodynamics).  

  ---

  ### **II. Physical World Constraints**
  5. **Compatibility with Special Relativity (SR)**  
     - *Description*: SR implies no universal simultaneity (no privileged "now").  
     - *Constraint*: **Hard** for scientific realism; **negotiable** if rejecting SR (not recommended!).  
     - **Tension Alert**: Presentism requires a global present ↔ SR’s relativity of simultaneity.  
       - *Conflict*: **Jointly impossible** without violating Lorentz invariance or adding undetectable structure (e.g., a preferred foliation).  

  6. **Arrow of Time (Thermodynamics)**  
     - *Description*: Entropy increases toward the future (e.g., eggs break but don’t reassemble).  
     - *Constraint*: **Hard**. Must explain why this arrow aligns with memory/causality.  

  7. **Quantum Indeterminacy**  
     - *Description*: Future states are probabilistic (e.g., radioactive decay).  
     - *Constraint*: **Preference** (Presentists use this for "open future"; eternalists may treat it as epistemic).  

  ---

  ### **III. Conceptual Distinctions (What Must Be Preserved or Explained)**
  8. **Real vs. Present**  
     - *Description*: Does "real" mean "present" (presentism) or "exists simpliciter" (eternalism)?  
     - *Constraint*: **Preference-defining** (Core divergence between theories).  

  9. **Tensed vs. Tenseless Facts**  
     - *Description*:  
       - Tensed: "The meeting *is now* happening." (truth value changes).  
       - Tenseless: "The meeting occurs at t=xyz." (truth value fixed).  
     - *Constraint*: **Hard**. Must ground truthmakers for tensed statements (e.g., "Dinosaurs existed").  
     - *Theories at risk*: Presentism struggles with truthmakers for *past*-tensed claims.  

  10. **Existence Claims**  
      - *Description*: Can we say "Socrates exists" (eternalism) or only "Socrates *did* exist" (presentism)?  
      - *Constraint*: **Preference** (Tied to ontology of time).  

  ---

  ### **IV. Philosophical Puzzles (Must Dissolve Without Handwaving)**
  11. **Grounding Problem (for Presentism)**  
      - *Puzzle*: If only the present exists, what makes past-tensed statements true (e.g., "Caesar crossed the Rubicon")?  
      - *Constraint*: **Hard** for presentism (eternalism avoids it).  

  12. **Problem of Temporal Parity**  
      - *Puzzle*: Are past/future events equally real? If not, what breaks the symmetry?  
      - *Constraint*: **Core dividing line** (Presentism denies parity; eternalism affirms it).  

  13. **Change and Persistence**  
      - *Puzzle*: How do objects persist through time if only the present exists?  
      - *Constraint*: **Hard**. Must explain identity over time (e.g., "You are the same person as 10 years ago").  

  14. **McTaggart’s Paradox**  
      - *Puzzle*: If time requires events to be past/present/future, but these properties are contradictory, is time unreal?  
      - *Constraint*: **Preference** (Presentists embrace tense; eternalists often reject tense as fundamental).  

  ---

  ### **Key Tensions & Near-Impossibilities**
  - **Global Present + Lorentz Invariance**:  
    As flagged, these are **jointly impossible** without rejecting SR or adding speculative structure (e.g., a hidden preferred frame). Presentism typically fails here.  
  - **Temporal Passage + Eternalism**:  
    Eternalism can accommodate "flow" only as psychological/illusory. If passage is fundamental, eternalism struggles.  
  - **Open Future + Fixed Past**:  
    Eternalism with a "block universe" implies a fixed future, conflicting with deliberation/quantum indeterminacy.  

  ---

  ### **Your Evaluation Toolkit**
  - **Map theories to constraints**:  
    - Presentism: Strong on 3,8,13; weak on 5,6,11.  
    - Eternalism: Strong on 5,6,9,11; weak on 3,8 (if flow is demanded).  
  - **Flag your non-negotiables**:  
    If SR compatibility (5) is a hard constraint, presentism is untenable. If temporal passage (3) is indispensable, lean presentist.  
  - **Watch for "cheats"**:  
    Some theories (e.g., *growing block*) try hybrid approaches but may inherit problems from both sides (e.g., grounding past truths *and* reconciling with SR).  

  This framework lets you pressure-test theories against the criteria that matter to you. Philosophy of time often involves trading intuitive costs for scientific coherence (or vice versa). Your marine biology rigor will serve you well here—treat ontological claims like hypotheses facing evidence. Let me know if you’d like deeper dives into specific clashes!
