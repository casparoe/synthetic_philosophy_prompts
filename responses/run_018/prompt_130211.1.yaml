  Looking at experiential criteria: memory asymmetry (we remember the past, not the future) is crucial. This is a hard constraint because any theory must explain why we have this experience. Then there's deliberation and agency—we feel we can influence the future but not the past. That's another hard constraint. Temporal phenomenology, the subjective flow of time, is a preference since eternalists might explain it differently. Causality's direction is also a hard constraint; effects follow causes universally.

