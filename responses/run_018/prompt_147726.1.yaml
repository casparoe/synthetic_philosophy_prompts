  What elevates this beyond generic hermeneutics is precisely the Davidsonian commitment to treating even private notations as part of a rational belief system. Most archival work doesn't take that strong of a coherence requirement. The philosophical distinctiveness shines in forcing the interpreter to reconstruct not just meanings but entire networks of justified belief. 

