prompt: |-
  me and my friend just got into it for like two hours about WEIRD morality and whether cross-cultural differences actually kill objectivity. he thinks if harm/fairness is just one cluster among loyalty/purity/authority then there's no real moral fact, just cultural packages. i want to push back but i need the actual spec first: write the desiderata a theory of moral objectivity must meet to take folk morality seriously across cultures. what patterns must it accomodate — e.g. that some societies treat loyalty or purity violations as genuinely wrong rather than mere convention? which distinctions must it preserve (moral wrongness vs social taboo, disagreement over weights vs disagreement over values)? what psychology or anthropology findings can it not flat-out contradict? flag any jointly unsatisfiable subset — like if full objectivity and complete cultural neutrality can't both hold. and tell me which single requirement does the most damage to the usual suspects (relativism, universalist utilitarianism, etc.). i'm putting together notes for a seminar so keep it tight.
