  The user wants a rigorous framework to evaluate theories of moral objectivity that can handle cultural diversity without collapsing into relativism. Key requirements emerge: the theory must accommodate genuine moral disagreement across foundations (loyalty/purity vs harm/fairness), distinguish moral wrongness from mere convention, explain moral progress, and align with anthropological evidence like taboo tradeoff studies. 

  I notice they're preparing for a seminar, so conciseness is crucial. The challenge is balancing philosophical precision with accessibility. The anthropological constraints are particularly vital - any viable theory must explain why purity violations feel morally wrong in some cultures despite lacking harm. 

  The joint unsatisfiability problem stands out: demanding both complete cultural neutrality and robust objectivity creates tension. This likely torpedoes strict relativism and naive utilitarianism. The psychology constraint does the most damage - it forces theories to account for why moral emotions attach to non-harm foundations cross-culturally. 

  For structure, I'll organize around desiderata clusters: conceptual distinctions, anthropological compatibility, psychological plausibility, and meta-theoretical demands. Highlighting the taboo/harm dissociation finding will anchor this in concrete evidence. The weight disagreement vs value disagreement distinction seems crucial for preserving objectivity amidst variation.
answer: |-
  Here's a tight spec for a theory of moral objectivity that takes cross-cultural folk morality seriously, based on your debate:

  **Core Desiderata for a Culturally-Sensitive Moral Objectivity:**

  1.  **Accommodate Moral Pluralism:** Must explain why diverse societies genuinely experience *moral* wrongness (not just convention/disgust) in the domains of loyalty, authority, and purity *even when* violations lack direct harm/fairness deficits. (e.g., Haidt's "harmless taboo" findings).
  2.  **Preserve the Moral/Conventional Distinction:** Must maintain a robust distinction *within cultures* between transgressions perceived as universally/seriously wrong (moral) vs. context-dependent/alterable by authority (conventional). (Turiel, Smetana).
  3.  **Explain Disagreement Structure:** Must distinguish between:
      *   **Disagreement over Foundational Values:** (e.g., Is purity inherently morally relevant?).
      *   **Disagreement over Application/Weighting:** (e.g., Agreeing on harm *and* purity, but prioritizing purity much higher in specific cases).
  4.  **Explain Moral Progress & Error:** Must provide resources to identify moral errors *within* cultural frameworks (e.g., internal inconsistencies) and *across* them (e.g., condemning practices like slavery even if locally accepted), without simply imposing one "master" foundation.
  5.  **Account for Psychological Reality:** Must be compatible with findings that moral judgment involves intuitive emotions, social learning, reasoning biases, and is shaped by evolutionary pressures (Haidt, Greene, Henrich) – not pure rational deduction.
  6.  **Anthropological Compatibility:** Cannot flatly contradict:
      *   The widespread existence and emotional depth of non-harm-based moralities (e.g., honor cultures, ritual purity systems).
      *   The "taboo tradeoff" phenomenon: People resist quantifying sacred values (like purity/group loyalty) against secular values (like money/efficiency) even when it causes harm (Tetlock, Atran).
      *   Genealogical explanations showing how specific norms serve functions like social cohesion, pathogen avoidance, or hierarchy maintenance, which *feel* intrinsically moral to adherents.
  7.  **Avoid Cultural Neutrality Collapse:** Must avoid reducing morality *entirely* to culturally relative preferences or adaptive functions, preserving a sense of genuine normativity.

  **The Joint Unsatisfiability Problem:**

  *   **"Full Objectivity" (Strong Realism):** Requires mind-independent moral facts accessible to reason, seemingly threatened by deep foundational disagreements.
  *   **"Complete Cultural Neutrality":** Requires that no cultural moral framework can be evaluated as superior/inferior without circularity, undermining moral progress claims.
  *   **The Tension:** Accommodating deep foundational pluralism (#1) *and* robust moral progress claims (#4) *while* maintaining a strong mind-independent objectivity (#7) is extremely difficult. Sacrificing one is often necessary.

  **Most Damaging Requirement:**

  *   **#1 (Accommodate Moral Pluralism) + #6b (Taboo Tradeoffs):** This combination devastates:
      *   **Simple Harm-Based Utilitarianism:** Cannot explain why violations of "harmless" purity/loyalty taboos are experienced as *deeply morally wrong* or why people refuse to trade them off rationally for harm reduction/utility gain. Reduces non-harm foundations to irrational biases.
      *   **Strict Cultural Relativism:** Struggles to explain why the *moral/conventional* distinction (#2) exists robustly *within* cultures, implying a deeper structure than mere convention. Also struggles with cross-cultural moral criticism (#4).
      *   **Kantian Rationalism:** Faces difficulty explaining the strong emotional, non-rational, and culturally variable nature of loyalty/purity intuitions (#5, #6). Pure reason seems insufficient to ground these diverse foundations as objectively binding.
      *   **Value Monism:** Directly contradicts the existence of multiple, distinct, irreducible moral foundations.

  **Key Takeaway for Your Seminar:**

  A viable theory must navigate the tension between recognizing the *psychological and functional reality* of diverse moral intuitions (especially loyalty, purity, authority) and preserving a *normative claim* that transcends pure cultural contingency. It must explain *why* these intuitions feel like genuine moral obligations and how cross-cultural disagreement/criticism is possible, without reducing morality *either* to harm/utility *or* to arbitrary cultural packages. Theories that ignore the depth and emotional reality of non-harm foundations or that collapse the moral/conventional distinction are empirically inadequate. The challenge is finding objectivity *within* the pluralism.
