    P(R) = (\text{i}) \times (\text{ii}) \times (1 - \text{iii}) \times (\text{iv}) = 0.6 \times 0.4 \times 0.1 \times 0.3 = 0.0072 \approx 0.01
    \]

  ### Key Variance Contributor and Protocol Update
  - **Primary variance contributor:** (iii) (selection bias from conditional cancellation).  
    - **Modification to update (iii):** Remove the conditional cancellation rule, making the Tuesday awakening in Tails *deterministic* (unconditional on Beauty's answer).  
