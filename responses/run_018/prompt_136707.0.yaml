prompt: |-
  I'm a devops engineer with basically no philosophy background. Can you take the debate about tearing down statues and renaming streets after people who did awful stuff, and restate it entirely in software maintenence vocabulary? Like deprecated APIs, breaking changes, backward compatibility, technical debt, legacy support, versioning, that kind of thing. Don't just shoehorn metaphors -- be honest about what actually maps and what doesn't. Then give me the residue report: which parts of the ethical debate translate cleanly, which ones only fit if you distort them, and which ones have no counterpart at all in how we think about code. I'm especially curious about the claim that keeping a name endorses the person versus the claim that removing it erases history -- do those survive the translation, or do they disappear? And if they disappear, is that because software thinking is missing something important, or because those claims were always kinda vague?
