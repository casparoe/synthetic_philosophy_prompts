prompt: |-
  I am putting together a training protocol for senior review analysts at an independent advisory board that evaluates public-facing arguments in science policy. A recurring problem is that stakeholders submit position papers that turn on a single vivid thought experiment—especially in bioethics and philosophy of mind—and my team needs to distinguish cases where the experiment genuinely clarifies a concept from cases where it merely smuggles in conclusions by suppressing context, exploiting unstated analogies, or trading on hidden normative commitments. I want you to design a reusable audit procedure that an analyst can run in roughly twenty minutes without consulting external literature. The procedure should translate what philosophy actually knows about how intuition pumps work—including their reliance on framing effects, selective detail suppression, and the elision of boundary conditions—into an ordered sequence of tests applied directly to the text of the argument. For each step, specify what feature of the argument counts as passing or failing, where the audit must stop and defer to an explicit value judgment rather than yielding a mechanical result, and what kind of misfire is likely at that stage. The deliverable should be a practical checklist or flowchart in words, not an abstract taxonomy.

  Please apply the audit to three specific cases, one of which should be a scenario I am injecting into the module to test its limits: (1) a regulatory proposal for autonomous vehicles that invokes the trolley problem to justify a particular algorithmic harm-minimization rule; (2) a gradual-replacement-of-neurons-with-silicon scenario used to argue that consciousness is not essentially biological; and (3) a constructed case in which a society decides to preserve every instance of pain experienced by non-human animals in an eternal digital archive in order to honor suffering, and this is used to claim that moral status requires the capacity for retrospective narrative integration. In your applications, include at least one case where the procedure returns a verdict that runs against the intuitive plausibility of the argument, and clearly flag the kinds of misleading pumps—such as those operating through emotional salience or culturally specific narrative templates—that the procedure is structurally unable to catch. Finally, state explicitly what judgments the procedure can never eliminate, no matter how refined the checklist becomes.
reasoning: |-
  We are designing a reusable audit procedure for evaluating thought experiments (intuition pumps) in submitted position papers. The procedure should take about 20 minutes and not require external literature. We'll break it down into an ordered sequence of tests. Each step will specify:

  1. What to look for (the test)
  2. What counts as passing or failing
  3. Where the audit must stop for an explicit value judgment
  4. Likely misfires at that stage

  We aim to catch when a thought experiment is misleading due to framing effects, selective detail suppression, elision of boundary conditions, etc.

  The audit procedure:

  **Step 1: Identify the Core Claim and the Thought Experiment's Role**
     - **Test**: Extract the core claim the argument is trying to support. Then, identify the exact role of the thought experiment: is it meant to illustrate a concept, provide a counterexample, or support a generalization?
     - **Pass**: The thought experiment is clearly linked to the core claim and its role is explicitly stated or easily inferable.
     - **Fail**: The thought experiment is disconnected from the core claim, or its role is ambiguous.
     - **Stop for judgment?** If the role is ambiguous, the audit stops and the analyst must judge whether the thought experiment is even relevant.
     - **Misfire**: The analyst might misattribute the role due to the argument's complexity.

  **Step 2: Map the Analogy (if applicable)**
     - **Test**: If the thought experiment relies on an analogy (e.g., replacing neurons with silicon chips), list the key elements in the source (the experiment) and the target (the real-world situation). Check for disanalogies.
     - **Pass**: The analogy is clearly laid out, and the relevant similarities are explicitly stated. The target domain shares the critical features with the source.
     - **Fail**: Critical disanalogies are present and unaddressed, or the analogy is stretched without justification.
     - **Stop for judgment?** If there are disanalogies, the analyst must judge whether they are fatal or not. Also, if the analogy is not explicitly stated, the analyst must reconstruct it and judge its reasonableness.
     - **Misfire**: The analyst might overlook subtle disanalogies or impose an artificial structure.

  **Step 3: Check for Selective Detail Suppression**
     - **Test**: Identify which details of the real-world context are omitted in the thought experiment. Consider: Are there normative, empirical, or contextual factors that are relevant to the core claim but left out?
     - **Pass**: The thought experiment includes, or at least acknowledges, the most relevant contextual factors. If details are omitted, the argument explains why they are irrelevant.
     - **Fail**: The thought experiment omits crucial details that would change the outcome if included, and the omission is not justified.
     - **Stop for judgment?** The analyst must judge which details are "crucial" and whether the omission is justified. This requires domain knowledge and value judgment.
     - **Misfire**: The analyst might introduce their own biases about what details are important.

  **Step 4: Test Boundary Conditions**
     - **Test**: Consider how the thought experiment would change if we vary one or more parameters (e.g., scale, time, intensity, cultural context). Does the intuition hold? Or does it break down?
     - **Pass**: The thought experiment is robust to minor variations in parameters, or the argument explicitly discusses boundary conditions.
     - **Fail**: The intuition breaks down under minor variations, and the argument does not account for this.
     - **Stop for judgment?** The analyst must judge what counts as a "minor" variation and whether the breakdown is relevant to the core claim.
     - **Misfire**: The analyst might choose variations that are not relevant or overemphasize edge cases.

  **Step 5: Detect Framing Effects**
     - **Test**: Check if the thought experiment is presented in a way that triggers emotional or cognitive biases (e.g., using vivid, emotionally charged language; presenting only one perspective). Try reframing the scenario neutrally or from an opposing viewpoint.
     - **Pass**: The thought experiment is presented in a relatively neutral way, or the framing is acknowledged and defended.
     - **Fail**: The thought experiment relies heavily on framing to generate the desired intuition, and the framing is not defended as essential.
     - **Stop for judgment?** The analyst must judge whether the framing is manipulative or essential to the point. This is inherently subjective.
     - **Misfire**: The analyst might be susceptible to the same framing effects or might impose an artificial neutrality.

  **Step 6: Expose Hidden Normative Commitments**
     - **Test**: Look for unstated value judgments that the thought experiment assumes. For example, does it assume a particular theory of well-being, justice, or moral status without argument?
     - **Pass**: The underlying normative commitments are made explicit and defended, or the argument acknowledges them as assumptions.
     - **Fail**: The thought experiment depends on a hidden normative commitment that, if made explicit, would require defense and is not provided.
     - **Stop for judgment?** The analyst must identify and evaluate the normative commitment. This requires ethical judgment and cannot be automated.
     - **Misfire**: The analyst might miss subtle normative assumptions or import their own commitments.

  **Step 7: Check for False Necessity or False Dilemmas**
     - **Test**: Does the thought experiment present a scenario as if it were the only possibility or force a binary choice when more options exist?
     - **Pass**: The argument acknowledges alternative scenarios or explains why the presented scenario is the relevant one.
     - **Fail**: The thought experiment artificially constrains the possibilities to force a particular conclusion.
     - **Stop for judgment?** The analyst must judge whether the constrained scenario is reasonable and representative.
     - **Misfire**: The analyst might not think of alternative scenarios or might accept the constraints too readily.

  **Step 8: Assess the Evidential Weight**
     - **Test**: Finally, consider whether the thought experiment is doing too much work. Is the core claim being supported solely or primarily by the intuition generated by the pump? If so, that's a red flag.
     - **Pass**: The thought experiment is one piece of evidence among others, or the argument shows why the intuition is reliable in this case.
     - **Fail**: The entire argument rests on the intuition pump, and there is no independent support.
     - **Stop for judgment?** The analyst must decide whether the intuition pump can bear the weight of the argument. This is a holistic judgment.
     - **Misfire**: The analyst might underestimate or overestimate the role of the thought experiment in the overall argument.

  ---

  Now, we apply this audit to the three cases:

  ### Case 1: Regulatory proposal for autonomous vehicles that invokes the trolley problem to justify a particular algorithmic harm-minimization rule.

  **Step 1: Core Claim and Role**
     - Claim: Autonomous vehicles should be programmed with a specific harm-minimization rule (e.g., minimize total loss of life).
     - Role: The trolley problem is used to illustrate that in emergencies, minimizing harm is the right choice.
     - Pass? The role is clear: to support the harm-minimization rule.

  **Step 2: Map the Analogy**
     - Source (trolley problem): A trolley is heading toward five people; you can divert it to kill one. The intuition is that diverting is morally permissible.
     - Target: An autonomous vehicle in an emergency must choose between actions that would kill one person or five.
     - Disanalogies: Real-world accidents involve uncertainty (about outcomes), partial information, multiple stakeholders, legal liability, and psychological impact on society. The trolley problem assumes perfect knowledge and no other factors.
     - Fail? The disanalogies are significant and unaddressed. The trolley problem doesn't account for real-world complexity.
     - Stop for judgment: The analyst must judge if the disanalogies are fatal. (They likely are for regulatory purposes.)

  **Step 3: Selective Detail Suppression**
     - Omitted: Uncertainty, liability, public trust, the fact that accidents are probabilistic, and that programming a car to "choose" who dies may be unacceptable to society.
     - Fail? These details are suppressed and crucial for regulation.

  **Step 4: Test Boundary Conditions**
     - Vary parameters: What if the one person is a child and the five are elderly? Or if the car's owner is the one who dies? Intuitions may change.
     - Fail? The trolley problem doesn't account for such variations, and the argument doesn't discuss boundary conditions.

  **Step 5: Framing Effects**
     - The trolley problem is framed in a way that makes "minimizing numbers" seem obvious, but reframed as actively killing one to save five (the "footbridge" variant) often changes intuitions.
     - Fail? The argument uses the trolley framing without acknowledging that other framings yield different intuitions.

  **Step 6: Hidden Normative Commitments**
     - Assumes utilitarianism (minimizing total harm) is the correct moral approach without defending it.
     - Fail? The commitment is hidden and crucial.

  **Step 7: False Dilemma**
     - Presents a forced choice between two bad outcomes, but real-world regulation might focus on preventing the situation entirely (e.g., better safety systems) or assign blame differently.
     - Fail? The argument ignores alternatives.

  **Step 8: Evidential Weight**
     - The entire argument rests on the trolley problem intuition.
     - Fail? No independent support.

  **Verdict**: This thought experiment fails the audit. It suppresses context, relies on framing, and the analogy is weak. However, note that the trolley problem is emotionally salient and culturally familiar (a misleading pump the audit caught via framing and suppression). The procedure returns a verdict against the intuitive plausibility of the argument (which might seem strong at first glance).

  ### Case 2: Gradual-replacement-of-neurons-with-silicon scenario to argue that consciousness is not essentially biological.

  **Step 1: Core Claim and Role**
     - Claim: Consciousness does not require biological substrate; it can be realized in silicon.
     - Role: The gradual replacement (e.g., one neuron at a time) is meant to show that there is no point where consciousness disappears, so the final silicon entity is conscious.
     - Pass? Clear role.

  **Step 2: Map the Analogy**
     - Source: A person's neurons are replaced one by one with functionally identical silicon chips. The person remains conscious throughout.
     - Target: Consciousness in a non-biological system.
     - Disanalogies: We don't know if silicon can exactly replicate neural function, or if consciousness depends on biological properties (e.g., quantum effects in microtubules) that silicon might not have. Also, the thought experiment assumes functionalism without argument.
     - Stop for judgment: The analyst must judge if the disanalogies are critical. (In philosophy, this is debated.)

  **Step 3: Selective Detail Suppression**
     - Omitted: The hard problem of consciousness (why and how subjective experience arises) and the possibility of emergent properties in biological systems that silicon might not replicate.
     - Fail? The suppression of the hard problem is crucial.

  **Step 4: Test Boundary Conditions**
     - Vary the replacement: What if we replace entire brain regions at once? Or use a different material? The intuition might break down.
     - Pass? The argument might not discuss boundaries, but the step-by-step replacement is central.

  **Step 5: Framing Effects**
     - Framed as a smooth, continuous process, which makes it seem obvious. But if framed as "killing" the biological brain and replacing it with a machine, intuitions might differ.
     - Fail? The framing is not neutral.

  **Step 6: Hidden Normative Commitments?**
     - Not normative, but hidden metaphysical commitment to functionalism (mental states are defined by function, not substrate).
     - Fail? The commitment is hidden.

  **Step 7: False Dilemma?**
     - Not a dilemma, but it might present a false continuum (if consciousness is an emergent property, it might disappear at some threshold).
     - Pass? The argument addresses continuity.

  **Step 8: Evidential Weight**
     - The argument relies heavily on the intuition pump, but in philosophy of mind, it's a common tool. There might be independent arguments for functionalism.
     - Stop for judgment: The analyst must decide if the intuition is strong enough. (In philosophy, this is controversial.)

  **Verdict**: The audit highlights several issues (suppression of the hard problem, hidden functionalism, framing). However, the procedure must stop for judgment at several points (e.g., disanalogies, evidential weight). The verdict might be that the thought experiment is not decisive, but the procedure doesn't automatically reject it. This is a case where the procedure might not fully condemn the pump, even though it exposes weaknesses.

  ### Case 3: Society preserves every instance of animal pain in an eternal digital archive to honor suffering, and this is used to claim that moral status requires the capacity for retrospective narrative integration.

  **Step 1: Core Claim and Role**
     - Claim: Moral status (e.g., the right to not suffer) requires the capacity to integrate experiences into a retrospective narrative (i.e., to remember and reflect on them).
     - Role: The archive scenario is meant to show that without narrative integration, suffering does not have moral weight (since we are preserving it to "honor" it, but the animals cannot appreciate this).
     - Pass? Clear.

  **Step 2: Map the Analogy**
     - Source: Animals cannot integrate their suffering into a narrative, so the archive (which they cannot access) doesn't help them. Thus, honoring suffering is meaningless for them.
     - Target: Moral status in general requires narrative capacity.
     - Disanalogies: The archive is a human construct; it doesn't change the animal's experience. Also, the thought experiment conflates honoring suffering with the moral wrong of causing suffering.
     - Fail? The disanalogy is critical: the archive is irrelevant to whether suffering is bad for the animal at the time.

  **Step 3: Selective Detail Suppression**
     - Omitted: The intrinsic badness of pain (even if not remembered) and the fact that many humans (e.g., infants, amnesiacs) cannot integrate experiences narratively but still have moral status.
     - Fail? These are crucial.

  **Step 4: Test Boundary Conditions**
     - Vary the scenario: What if the archive is accessible by the animals? Or if we consider a human with no narrative capacity? The intuition might not hold.
     - Fail? The argument doesn't address these variations.

  **Step 5: Framing Effects**
     - Framed as "honoring" suffering, which is emotionally positive, to mask the fact that the suffering itself is not alleviated. Reframe: "We record every instance of torture but do nothing to stop it, calling it 'honor'."
     - Fail? The framing manipulates by associating the archive with honor.

  **Step 6: Hidden Normative Commitments**
     - Assumes that moral status depends on cognitive capacities (narrative integration) without argument. This is a form of personism or Kantianism.
     - Fail? The commitment is hidden and controversial.

  **Step 7: False Dilemma?**
     - Not a dilemma, but it might imply that either we honor suffering (which requires narrative capacity) or the suffering doesn't matter, which is false.
     - Fail? It ignores the option that suffering might be bad regardless of narrative.

  **Step 8: Evidential Weight**
     - The argument rests entirely on the intuition from the thought experiment.
     - Fail? No independent support.

  **Verdict**: The thought experiment fails the audit. However, note that it uses emotional salience (the idea of "honoring" suffering) and a culturally specific narrative (archiving as preservation) to mislead. The procedure catches the framing and suppression, but the emotional salience is a misleading pump that the audit catches in Step 5.

  ---

  **What the procedure cannot catch, no matter how refined**:

  1. **Deep cultural or emotional biases**: If the analyst shares the same biases as the thought experiment, they might not notice framing effects or hidden commitments.

  2. **Novel or highly creative pumps**: The procedure relies on known failure modes, so a truly original misleading pump might evade detection.

  3. **Ultimate value judgments**: The procedure can expose hidden normative commitments, but it cannot resolve which normative framework is correct. That requires philosophical debate.

  4. **Empirical claims**: If the thought experiment relies on false empirical assumptions that are not common knowledge, the analyst might not catch them without external research.

  5. **Holistic plausibility**: Sometimes a thought experiment might be flawed in many small ways that individually are not fatal, but collectively undermine it. The procedure might not capture this cumulative effect.

  The audit is a tool for critical thinking, not a substitute for it.
answer: |-
  Below is a reusable 20-minute audit procedure for evaluating thought experiments ("intuition pumps") in position papers, presented as a practical checklist. The procedure distills philosophical insights on intuition pumps—focusing on framing effects, selective detail suppression, and boundary condition elision—into an ordered sequence of tests. Each step includes:  
  - **Test**: What to examine in the argument.  
  - **Pass/Fail Criteria**: Clear conditions for success or failure.  
  - **Stop for Judgment?**: Where the audit must defer to human judgment.  
  - **Likely Misfire**: Common errors at that step.  

  The procedure prioritizes efficiency, requiring only the text of the argument and no external sources. It is designed to flag misleading pumps while acknowledging inherent limitations.  

  ---

  ### **Intuition Pump Audit Checklist**  
  **Time Budget**: 20 minutes total. Complete steps sequentially. Stop early if critical failure occurs.  

  #### **Step 1: Pinpoint the Pump’s Core Function**  
  - **Test**: Identify the thought experiment and the specific conclusion it supports. Ask: *Does the pump claim to "prove," "illustrate," or "reframe" the conclusion?*  
  - **Pass**: The conclusion is explicitly stated, and the pump’s role (e.g., "this shows that X must be true") is unambiguous.  
  - **Fail**: The conclusion is implied or disconnected from the pump; the pump’s role is vague (e.g., "consider this scenario" without linking to a claim).  
  - **Stop for Judgment?** If the pump’s role is ambiguous, defer to judgment: *Is this experiment essential to the argument, or decorative?*  
  - **Likely Misfire**: Overlooking subtle implication (e.g., a pump framed as illustration actually smuggles in proof).  

  #### **Step 2: Dissect Analogies (if used)**  
  - **Test**: If the pump uses analogy (e.g., "just like in X, here Y"), list all elements compared. Ask: *Are there unmapped differences between the analogy’s source (familiar scenario) and target (real-world issue)?*  
  - **Pass**: Key similarities are explicit, and critical differences are acknowledged/addressed (e.g., "unlike X, Y lacks Z, but this doesn’t affect the point because...").  
  - **Fail**: Critical differences are ignored or downplayed without justification (e.g., biological vs. mechanical systems treated as identical).  
  - **Stop for Judgment?** If differences exist but are contested, defer: *Are these differences relevant to the conclusion?*  
  - **Likely Misfire**: Missing implicit analogies (e.g., emotional comparisons buried in descriptive language).  

  #### **Step 3: Hunt Selective Suppressions**  
  - **Test**: List contextual details omitted in the pump but relevant to the real-world issue (e.g., social, historical, or biological factors). Ask: *Would adding these details change the intuitive response?*  
  - **Pass**: Omitted details are either irrelevant to the core claim or acknowledged as limitations (e.g., "for simplicity, we ignore X, but it could be incorporated as follows...").  
  - **Fail**: Suppressed details directly undermine the conclusion if included (e.g., excluding uncertainty in a deterministic scenario).  
  - **Stop for Judgment?** Always—defer: *Do the suppressed details invalidate the pump, or are they incidental?*  
  - **Likely Misfire**: Confusing suppression with reasonable abstraction (e.g., judging necessary simplifications as deceptive).  

  #### **Step 4: Stress-Test Boundary Conditions**  
  - **Test**: Modify extreme/scalar parameters in the pump (e.g., scale, time, or intensity). Ask: *Does the intuition hold if we change a key variable (e.g., "what if it were 1,000 cases, not one?")?*  
  - **Pass**: The intuition persists under minor variations, or boundaries are explicitly defined (e.g., "this holds only when X is below threshold Y").  
  - **Fail**: The intuition collapses under minor changes (e.g., flipping the outcome when numbers increase).  
  - **Stop for Judgment?** If boundaries are fuzzy, defer: *Is this experiment robust enough to support the claim?*  
  - **Likely Misfire**: Over-engineering variations (e.g., testing irrelevant extremes).  

  #### **Step 5: Neutralize Framing Effects**  
  - **Test**: Rewrite the pump with inverted/non-emotive language (e.g., replace "heroic sacrifice" with "statistical trade-off"). Ask: *Does the intuition survive this reframing?*  
  - **Pass**: The core insight remains compelling under neutral framing.  
  - **Fail**: The intuition weakens or reverses (e.g., "saving lives" reframed as "causing a death" changes moral perception).  
  - **Stop for Judgment?** Always—defer: *Is the original framing dishonest, or essential to the point?*  
  - **Likely Misfire**: Over-neutralizing (e.g., stripping necessary context).  

  #### **Step 6: Flag Hidden Commitments**  
  - **Test**: Identify unstated assumptions about values, rights, or priorities (e.g., "pain is always bad" or "efficiency overrides fairness"). Ask: *Would the pump fail if these assumptions were challenged?*  
  - **Pass**: Commitments are explicit or defended (e.g., "we assume utilitarianism because...").  
  - **Fail**: Commitments are concealed and foundational to the intuition (e.g., assuming individualism without justification).  
  - **Stop for Judgment?** Always—defer: *Are these commitments defensible in this context?*  
  - **Likely Misfire**: Mistaking contested premises for universal truths.  

  #### **Step 7: Final Weight Assessment**  
  - **Test**: Check if the pump is the sole support for the conclusion. Ask: *Does the argument offer independent evidence (e.g., data, logic) beyond the pump?*  
  - **Pass**: The pump is one tool among others, or the text argues for its reliability (e.g., "this experiment aligns with empirical evidence").  
  - **Fail**: The conclusion collapses without the pump.  
  - **Stop for Judgment?** If standalone, defer: *Is this pump strong enough to bear the entire argument?*  
  - **Likely Misfire**: Overlooking embedded logical support.  

  **Output Decision**:  
  - **Pass**: 0–1 failures, with judgments resolving ambiguities.  
  - **Fail**: ≥2 failures, or irrecoverable stop points.  
  - **Inconclusive**: Heavy reliance on judgments (e.g., multiple stops with no clear consensus).  

  ---

  ### **Application to Cases**  
  **General Notes**:  
  - Each audit is conducted in <7 minutes per case.  
  - I flag where the procedure **against intuitive plausibility** (i.e., the pump "feels" persuasive but fails structurally).  
  - **Structurally uncatchable pumps**: Those exploiting **culturally specific narratives** (e.g., "heroic inventor" tropes) or **sensory vividness** (e.g., gruesome details inducing disgust) are often missed, as they require cultural/contextual knowledge beyond the text.  
  - **Judgments the procedure cannot eliminate**: Normative disagreements (e.g., "Is utilitarianism valid?"), empirical unknowns (e.g., "How does consciousness arise?"), and boundary disputes (e.g., "When does a difference become critical?") will always require human deliberation.  

  ---

  #### **Case 1: Trolley Problem for Autonomous Vehicle Regulation**  
  **Argument**: A policy paper uses the trolley problem (diverting a trolley to kill one instead of five) to justify programming AVs to always minimize total harm (e.g., sacrifice passengers to save pedestrians).  
  - **Step 1**: Pass. Core claim: "Minimizing total harm is ethically mandatory." Pump role: "Proof via analogy."  
  - **Step 2**: Fail. Critical disanalogies suppressed: Trolley assumes deterministic outcomes, perfect knowledge, and no liability—unlike real AVs (uncertainty, ambiguity, legal consequences).  
  - **Step 3**: Fail. Suppresses context: Social trust, passenger consent, and manufacturer liability omitted. Adding these could reverse intuition (e.g., "Would you buy a car programmed to kill you?").  
  - **Step 4**: Fail. Boundary test: Scale up to 1,000 deaths vs. 1,001 saves—intuition may flip (e.g., "programmed genocide"). Not addressed.  
  - **Step 5**: Fail. Reframing: "Algorithm causes active death to reduce passive deaths" weakens support. Framing as "sacrifice" evokes heroism.  
  - **Step 6**: Fail. Hidden commitment: Consequentialism is assumed, ignoring deontological rights (e.g., "don’t use humans as means").  
  - **Step 7**: Fail. Pump is primary evidence; no independent support.  
  - **Verdict**: **Fail** (6 failures).  
  - **Against intuitive plausibility**: Yes—the trolley problem feels compelling but fails due to disanalogies and suppression.  
  - **Uncatchable by procedure**: Emotional salience of "life/death" framing and cultural familiarity with trolley.  

  ---

  #### **Case 2: Neuron Replacement for Non-Biological Consciousness**  
  **Argument**: A philosophy paper claims consciousness isn’t biological by describing a scenario where neurons are replaced one-by-one with silicon chips until the brain is synthetic, with no loss of subjective experience.  
  - **Step 1**: Pass. Core claim: "Consciousness is substrate-independent." Pump role: "Proof via gradual transformation."  
  - **Step 2**: Pass/Fail (Judgment). Analogy: Biological-to-silicon as "ship of Theseus." Disanalogies: Quantum effects? Emergent properties? Not addressed. **Stop for judgment**: *Are these differences relevant?* (Plausibly yes—e.g., if consciousness relies on biological coherence).  
  - **Step 3**: Fail. Suppresses: Hard problem of consciousness (why subjective experience arises) and glial cell roles. Adding these could invalidate (e.g., "silicon may not generate qualia").  
  - **Step 4**: Pass. Boundary test: Vary replacement speed (e.g., all at once)—intuition holds ("functionalism persists").  
  - **Step 5**: Fail. Reframing: "Replace brain with malware-vulnerable tech" reduces intuition’s force. Original uses neutral "upgrade" framing.  
  - **Step 6**: Fail. Hidden commitment: Functionalism (mind defined by computation, not biology) assumed without defense.  
  - **Step 7**: Pass. Independent arguments (e.g., computational theory) supplement pump.  
  - **Verdict**: **Inconclusive** (2 fails + 1 stop). Heavy reliance on judgments (Steps 2, 6).  
  - **Uncatchable by procedure**: Culturally embedded "progress" narrative (silicon as "advanced" biology).  

  ---

  #### **Case 3: Animal Suffering Archive for Moral Status**  
  **Argument**: A bioethics paper claims moral status requires "narrative integration" (e.g., remembering past pain) by describing a society preserving non-human animal suffering in an eternal digital archive to "honor" it, arguing that since animals can’t appreciate this, their pain lacks moral weight.  
  - **Step 1**: Pass. Core claim: "Moral status requires retrospective narrative capacity." Pump role: "Proof via counterexample."  
  - **Step 2**: Fail. False analogy: Source (digital archive) ≠ target (moral status). Disanalogy: Archive is symbolic; suffering is intrinsic. Honoring =/= moral weight.  
  - **Step 3**: Fail. Suppresses: Humans without narrative capacity (e.g., infants) still have moral status, and suffering’s intrinsic badness. Adding these invalidates.  
  - **Step 4**: Fail. Boundary test: Scale to humans ("archive torture victims who have amnesia")—intuition reverses (feels exploitative).  
  - **Step 5**: Fail. Reframing: "Eternalizing pain without consent to assuage human guilt" weakens "honor" framing.  
  - **Step 6**: Fail. Hidden commitment: Speciesism (only humans merit moral consideration) and intellectualism (cognition > sentience).  
  - **Step 7**: Fail. Pump is sole support.  
  - **Verdict**: **Fail** (6 failures).  
  - **Against intuitive plausibility**: No—the pump is intuitively weak (archiving feels irrelevant to moral status), and the audit confirms this.  
  - **Uncatchable by procedure**: Emotional salience of "eternal suffering" and cultural tropes of "memorialization."  

  ---

  ### **Key Limitations of the Procedure**  
  No audit can eliminate the need for:  
  1. **Normative Judgment**: Conflicts over values (e.g., "Is suffering intrinsically bad?") cannot be resolved mechanically.  
  2. **Empirical Validation**: Pumps relying on false scientific assumptions (e.g., "silicon neurons behave identically") may pass if errors aren’t common knowledge.  
  3. **Conceptual Boundaries**: When does an analogy become "false" or suppression "fatal"? This remains subjective.  
  4. **Cultural/Emotional Blind Spots**: Pumps leveraging visceral narratives (e.g., "think of the children!") often evade text-based audits.  

  **Recommendation**: Use this audit to flag high-risk pumps, but pair it with team deliberation for judgments. Refine the checklist annually with real-case feedback.
