  First, I need to anticipate the strongest objections. Classics students might question the historical accuracy of comparing ancient texts to modern hagiographies. They could argue that Plutarch's intent was moral exemplarism, not calibration. The philosophy folks might dismiss biography as irrelevant today. I should prioritize these by damage potential.

