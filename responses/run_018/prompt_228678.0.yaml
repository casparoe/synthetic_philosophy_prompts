prompt: |-
  I'm putting together the syllabus for a graduate seminar on rational choice, and I keep running into the same frustration with how textbooks handle Parfit's hitchhiker case and the surrounding cluster of puzzles about rational irrationality. The case, briefly: a man is stranded in the desert and will die without a ride; a driver stops who is an excellent judge of character, and who will take him to the city only if she is confident he will pay her on arrival; once safely in the city, he has every reason not to pay, and the driver knows this. Intuitively the best thing he could do is somehow make himself into someone who would pay -- but at the moment of payment, standard rationality seems to tell him to keep the money. Parfit used this and related cases to argue that being rational can sometimes require making oneself irrational, or at least that a theory of rationality can be indirectly self-defeating. I've discussed this with colleagues and we disagree about almost everything, including what a theory of rationality is even supposed to do with such cases.

  Acting as a specialist in decision theory and practical reason, write the desiderata that an adequate theory of rational choice in the vicinity of this case must meet -- a specification I can then use to evaluate the main contenders (evidential and causal decision theory, resolute-choice views of the McClennen sort, sophisticated/dynamic-consistency views, and dispositions-based or rational-irrationality views of the Parfitian sort). Take your time and think carefully; before finalizing the list, brainstorm the tricky borderline cases a good specification must handle, then keep only what earns its place.

  Please structure your response in the following sections, in this order:

  1. Preliminaries and purpose (roughly 150 words): state what the theory is supposed to be adequate *for* (normative guidance for agents? prediction? a constitutive account of practical reason?), since the desiderata shift with the purpose.

  2. The desiderata (the core of the response, roughly 600-800 words): each requirement with the case or consideration motivating it. Cover, at minimum: what the theory must say the hitchhiker should do and why; how it must handle the moment of payment (the decision the theory seemingly can't endorse even when it endorses setting up the situation); whether it must deliver verdicts for cases where being disposed to act irrationally is itself instrumentally valuable (e.g., threats, promises, toxin puzzles of the Kavka sort, deterrence); what it must say about self-effacing theories -- whether a true theory of rationality is allowed to recommend that agents not follow or even not know it; and which structural constraints (dynamic consistency, separability, independence of irrelevant alternatives) are genuine requirements versus camp-specific prejudices.

  3. Negotiable versus non-negotiable (roughly 150 words): mark which desiderata you take to be hard constraints and which are desiderata only for particular camps.

  4. Joint satisfiability (roughly 150-200 words): this is the part I care most about. If some subset of your desiderata cannot be jointly satisfied -- say, requiring both that rationality always guides action at the moment of choice and that it be instrumentally optimal across the hitchhiker case -- prove or argue for the incompatibility rather than merely gesturing at it.

  5. Brief scorecard (roughly 200 words, no more): the main contenders against the list, one short paragraph each. Keep the weight on the criteria, not the scoring.

  Avoid summarizing the literature at length; I know the standard positions and want the specification, not a survey.
reasoning: |-
  Okay, let me approach this systematically. The user is constructing a graduate seminar syllabus and needs a rigorous framework to evaluate decision theories against Parfit's hitchhiker problem. The core frustration seems to be how textbooks oversimplify the "rational irrationality" paradox.

  First, I need to clarify the purpose: this is for normative guidance to agents, not prediction. That shapes everything - desiderata must assess how theories guide choices across time. The hitchhiker case isn't just a puzzle; it exposes fault lines in standard rationality assumptions.

  For desiderata, I'll start with instrumental effectiveness as non-negotiable. If a theory can't endorse the payoff-maximizing sequence (commit to pay → get ride → actually pay), it fails a basic test. But this immediately clashes with the synchronic commitment requirement - how can rationality demand payment when refusing is advantageous? Resolute choice theories handle this by rejecting separability, while dispositional views bite the bullet on rational irrationality. 

  The self-effacement criterion is particularly thorny. If the true theory recommends self-deception about itself, that seems epistemically vicious. Yet in Kavka's toxin puzzle, ignoring the theory might be necessary to win the prize. This tension might be unavoidable - I'll need to flag it in the joint satisfiability section.

  When mapping theories, CDT's failure is clearest: it can't endorse paying upfront. EDT fares better but stumbles on Newcomb-type cases. McClennen's resolute approach satisfies dynamic consistency but requires controversial choice-binding. Parfit's own view embraces instrumentally necessary irrationality at the choice point - elegant but philosophically costly.

  The incompatibility proof should focus on the synchronic-diachronic divide: if rationality requires moment-by-maximization (synchronic) and backward induction (sophistication), it can't endorse the instrumentally optimal strategy. Only by relaxing one constraint can a theory "win" the hitchhiker game. This clarifies why the debate persists - there's no free lunch between time-slice and temporally extended agency.
answer: |-
  ### 1. Preliminaries and Purpose  
  The theory must provide **normative guidance for agents** in sequential choice scenarios under uncertainty. It should identify what constitutes instrumentally rational *conduct*—not merely predict behavior or offer a constitutive account of practical reason. Crucially, it must resolve conflicts between *local* rationality (maximizing at a choice node) and *global* rationality (achieving optimal outcomes across sequences). Desiderata are framed for agents seeking to align choices with their ultimate goals.  

  ---

  ### 2. Desiderata  
  **I. Instrumental Effectiveness (Non-Negotiable)**  
  *Requirement*: The theory must endorse strategies that reliably secure superior outcomes when feasible.  
  *Motivation*: In the hitchhiker case, surviving requires becoming the type of person who pays. A theory rejecting this (e.g., standard CDT) fails instrumentally. Applies equally to deterrence (being disposed to retaliate deters attack) and promises (being disposed to keep them secures cooperation).  

  **II. Synchronic Action-Guidance**  
  *Requirement*: At any choice node, the theory must prescribe a definite, justifiable action.  
  *Motivation*: At payment time, the hitchhiker must have a reason to act *then*. Theories that say "do nothing" (e.g., some EDT interpretations of the payment node) fail as practical guides.  

  **III. Diachronic Integrity**  
  *Requirement*: The theory must coherently link earlier and later choices without ad hoc partitioning.  
  *Motivation*: Sophisticated choice (backward induction) abandons beneficial plans (e.g., not paying). Resolute choice maintains plans but risks incoherence if plans lack node-specific support. A theory must explain how commitments persist rationally.  

  **IV. Handling Self-Effacement**  
  *Requirement*: The theory must not *systematically* recommend ignorance or rejection of itself.  
  *Motivation*: If rationality requires self-deception (e.g., forgetting decision theory to win Kavka’s toxin puzzle), the theory is pragmatically self-undermining. Permissible iff self-effacement is rare and non-essential (e.g., in niche threats).  

  **V. Dynamic Consistency**  
  *Requirement*: Plans deemed rational ex ante must remain rational ex post unless information changes.  
  *Motivation*: Hitchhiker’s ex ante commitment to pay is optimal, but ex post payment seems irrational. A theory allowing arbitrary reversals (e.g., naive CDT) licenses dynamic inconsistency.  

  **VI. Structural Agnosticism**  
  *Requirement*: Independence of separability (evaluating subtrees in isolation) and independence of irrelevant alternatives must not be assumed.  
  *Motivation*: Separability sabotages commitment in the hitchhiker. Irrelevant alternatives may matter if options reveal latent traits (e.g., in evidential reasoning). The theory must justify constraints, not inherit them.  

  **VII. Robustness to Instrumental Irrationality**  
  *Requirement*: Must endorse dispositions to act "irrationally" when they yield dominance.  
  *Motivation*: In Kavka’s toxin, intending to drink poison wins $1M; "rational" reconsideration loses it. A theory must accommodate such cases without ad hoc exemptions.  

  ---

  ### 3. Negotiable vs. Non-Negotiable  
  - **Non-Negotiable**: Instrumental Effectiveness, Synchronic Action-Guidance.  
    *Rationale*: A normative theory must guide action and secure better outcomes; else it is practically inert.  
  - **Negotiable**: Diachronic Integrity (resolute views relax it), Structural Agnosticism (causalists insist on separability).  
    *Rationale*: Some camps (e.g., sophisticated choice) accept diachronic incoherence to preserve node-by-node maximization.  

  ---

  ### 4. Joint Satisfiability: The Core Incompatibility  
  **Proof that Synchronic Maximization + Separability conflict with Instrumental Effectiveness in the Hitchhiker**:  
  - Assume rationality requires maximizing utility at each node (Synchronic Maximization).  
  - By backward induction (Separability), at the payment node, paying costs $X > 0 for no benefit → irrational.  
  - Therefore, the driver predicts non-payment → denies the ride → hitchhiker dies.  
  - Yet securing the ride *requires* paying later, making the ride+payment sequence dominant.  
  - **Ergo**: Synchronic Maximization + Separability → death, but Instrumental Effectiveness requires survival.  
  - *Resolution requires abandoning one*: Resolute choice drops Separability; dispositionalism drops Synchronic Maximization at payment; EDT may drop causal independence.  

  ---

  ### 5. Brief Scorecard  
  **Causal Decision Theory (CDT)**: Fails *Instrumental Effectiveness* and *Diachronic Integrity*. Endorses not paying, ensuring no ride. Sophisticated CDT dynamically adjusts plans but still rejects payment.  
  **Evidential Decision Theory (EDT)**: Passes *Instrumental Effectiveness* if paying evidences reliability (securing future rides). Fails *Synchronic Action-Guidance* if payment lacks current causal benefit; struggles with *Self-Effacement* in toxin cases.  
  **Resolute Choice (McClennen)**: Passes *Instrumental Effectiveness* and *Dynamic Consistency* by binding to plans. Fails *Synchronic Action-Guidance* if the resolute act lacks node-specific justification.  
  **Dispositionalism/Parfitian Views**: Passes *Instrumental Effectiveness* and *Robustness to Irrationality* by valuing dispositions. Fails *Synchronic Action-Guidance* (paying *is* locally irrational but required by the disposition). Challenges *Self-Effacement* if rationality recommends self-deception.  

  ---  
  *This specification prioritizes outcome-securing agency. No theory satisfies all desiderata; the trade-offs define the debate.*
