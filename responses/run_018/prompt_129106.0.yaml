  Right, so I've been reading about this Otto Neurath fellow and his picture-language thing—ISOTYPE, all those standardised icons meant to make science readable across languages. I'm a retired physicist, only recntly got into philosphy, so go easy on me.

  What I'd like is your actual credence, on a scale of 0 to 1, that Neurath was wrong in principle—not just that his system failed for political or practical reasons, but that the core idea of a culture-neutral visual notation for scientific facts is conceptually impossible. I don't want a non-committal answer; I want a number, and I want the reasoning broken into pieces.

  Please answer in British English, with British spelling.

  Specifically: decompose your answer into (a) the probability that visual representation is inevitably theory-laden and can never serve as the direct observational base Neurath hoped for; (b) the probability that his rules for combining pictograms implicitly depend on a hidden linguistic or cultural framework; and (c) the probability that even if (a) and (b) are partly wrong, cross-cultural variation in interpreting abstract shapes is still too large for universal transparency. Give each part a rough figure and one line of justification, then combine them into your overall number. After that, tell me which of the three parts you're least confident about, and what kind of evidence or argument—say, an empirical study on icon comprehension, or a logical point about compositionality—would shift that part and therefore your final answer the most.

  My own gut feeling is about 0.70 that he's wrong in principle, but I mainly want to see where our disagreement actually lives if you come out differently.
