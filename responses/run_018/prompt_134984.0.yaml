  The evolutionary debate over Zahavi’s handicap principle has stalled in a peculiar way: proponents insist that only genuinely wasteful displays—energy, risk, or resources irrecoverably lost—can guarantee honest signaling, while critics argue that apparently costly rituals are actually strategic investments whose “waste” is illusory once one accounts for deferred social benefits and in-group coordination. In recent philosophical discussions of human moral display, this same stall reappears, with one side treating conspicuous altruism as a biological handicap that only high-fitness agents can afford, and the other treating it as a cheap-talk equilibrium sustained by reputation tracking rather than physical burden. Both sides accept the same ethnographic descriptions and the same formal signaling games; neither denies that display occurs or that it correlates with status. Yet the disagreement has not moved in years. Is the stall substantive—centered on whether “cost” must be non-recoverable to function as a guarantee—or is it verbal, with one camp using “handicap” for evolutionary stability conditions and the other for phenomenological waste? Or are they answering different questions: one about phylogenetic origins, the other about proximal social psychology? Diagnose the structure of this disagreement using what each side actually claims about observability, recoverability, and waste, and tell me what, if anything, would count as progress—perhaps a formal distinction between ex ante committed risk and ex post observable waste, an empirical study of who actually bears the burden, or a reconceptualization of the signaling environment. Please separate what is settled in signaling theory from what remains genuinely contested among specialists, and do not present a disputed interpretation as the consensus view. Lead with your bottom line in the first sentence, then provide the reasoning, with no preamble and no restating of the question.
