answer: |-
  ## MEMORANDUM

  **TO:** Institutional Memory and Civic Archive Committee  
  **FROM:** Senior Ethics Advisor & Institutional-Policy Specialist  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation on Petition for Mnemonic Sunset Clause - Municipal Testimony Repository  

  **1. RECOMMENDATION:**  
  Approve the development and implementation of a **pilot Curatorial Dormancy Protocol** for the Municipal Testimony Repository, with the following core conditions:  
      *   **(a) Eligibility:** Only the original contributor or *direct, documented lineal descendants* may initiate a request.  
      *   **(b) Trigger:** Minimum 30 years from the date of deposition.  
      *   **(c) Action:** De-indexing from public search interfaces and restriction of digital/public access. Physical/media preservation remains absolute; records are *not* destroyed.  
      *   **(d) Access Mechanism:** Restricted access may be granted for bonafide academic, historical, or policy research upon submission of a formal ethical-access request demonstrating compelling societal interest or analytical necessity, reviewed by the Committee or a designated subcommittee.  
      *   **(e) Renewability:** Restrictions are valid for 15-year terms, renewable upon request by eligible parties. Contributors/descendants may release the testimony back to open access at any time.  
      *   **(f) Pilot Scope:** Implement for an initial 5-year period, applying only to testimonies deposited *after* protocol finalization. Existing testimonies remain fully accessible during the pilot evaluation.  
      *   **(g) Review:** Conduct a comprehensive ethical and historical impact assessment of the pilot protocol within 18 months of the first restriction taking effect, reporting findings to the full Committee for determination on permanence and applicability to the full collection.  

  **2. ANALYSIS & RATIONALE:**  
  The petition presents a profound tension: the civic imperative of preserving unvarnished evidence of industrial harm and municipal failure versus the individual right to dignity and control over the perpetual public display of personal trauma. Perpetual open accessibility, while ensuring evidentiary survival, risks instrumentalizing profound suffering as undying public spectacle, potentially hindering, rather than serving, ethical remembrance. The archive's *act of display* is not neutral; it actively performs memory work. Our duty is not merely to preserve data, but to steward its meaning responsibly.

  The proposed "Mnemonic Sunset Clause" risks eroding the collection's integrity by enabling selective withdrawal without robust ethical oversight. Conversely, outright rejection ignores legitimate claims that indefinite public exhibition can inflict dignitary harm and impede contributors' or descendants' ability to manage their relationship with painful history.

  **"Curatorial Dormancy"** offers a structural third path, distinct from both perpetual open access and destruction/erasure:  
  *   **Preservation:** The evidentiary record remains physically and legally intact, fulfilling the core mandate against institutional amnesia.  
  *   **Restricted Circulation:** Public exhibition ceases, acknowledging that perpetual display is not intrinsic to preservation. This directly addresses the dignitary harm of transforming private trauma into an eternal civic spectacle.  
  *   **Conditional Reactivation:** A defined ethical-access threshold (compelling research need) ensures the evidence remains available for societal learning when genuine necessity arises, separating the *duty to retain* from the *practice of perpetual exhibition*.  

  This protocol recognizes the archive itself as an active agent in memory formation. It prioritizes both the *integrity of the preserved record* and the *dignity of those whose lives constitute it*, moving beyond a binary of "remember everything publicly forever" or "forget." The pilot design allows rigorous testing of this novel framework on future deposits before considering application to the historical corpus.

  **3. ADDRESSING KEY OBJECTIONS:**  
  We treat the historians' **strongest objection – that any de-indexing corrupts evidentiary integrity and betrays a moral duty to remember – with utmost seriousness.** This fear is valid: history is fragile, and pathways to evidence must not be obscured lightly. Our rebuttal is two-fold:  
      *   **Integrity Preserved:** The testimony is *not* altered, destroyed, or made permanently inaccessible. Its physical and digital preservation remains sacrosanct. The ethical-access mechanism ensures the record *can* be consulted when significant societal interest or rigorous historical analysis demands it, upholding the duty to remember.  
      *   **Duty Refined:** The moral duty is to preserve the *truth* and make it *available for necessary understanding*, not to subject every intimate trauma to unending public scrutiny. Curatorial dormancy refines this duty, focusing preservation on the evidence itself while responsibly managing its *exhibition* to prevent gratuitous exposure that may ultimately undermine the ethical purpose of remembrance. Selective withdrawal for dignitary reasons, governed by strict protocol, is not amnesia; it is a considered curatorial act acknowledging the human cost embedded within the archive.

  **4. IMPLEMENTATION TIMEFRAME:**  
  *   **Protocol Development:** Committee establishes a working group (including historian, ethicist, community representative, archivist) to draft detailed procedures, ethical-access criteria, and request forms within **90 days**.  
  *   **Pilot Commencement:** Protocol finalized and applied to new deposits starting **Q1 2024**.  
  *   **First Potential Restrictions:** Earliest possible de-indexing under the protocol: **Q1 2054** (30 years from earliest eligible new deposit).  
  *   **Interim Review:** Comprehensive assessment of protocol implementation, ethical challenges, and access requests reported to Committee **by Q3 2025**.  
  *   **Pilot Review & Decision:** Full evaluation of pilot's impact and recommendation on permanence/expansion presented for Committee vote **by Q4 2040** (approx. 18 months after first possible restriction).

  **5. VOTABLE BOTTOM LINE:**  
  Approve the development and implementation of a pilot Curatorial Dormancy Protocol as outlined in Section 1, with the implementation timeframe specified in Section 4.

  ---

  **Senior Ethics Advisor & Institutional-Policy Specialist**
