answer: |-
  Here’s how I’d rank your three models for defending lexical suffering against the commensurability objection, flowing as requested:

  Your hybrid local-denial approach strikes me as the most promising defense against collapsing into standard negative utilitarianism. By restricting incommensurability to tightly bounded "pain neighborhoods" around severe suffering events, it creates firewalls where no trade-offs with pleasure are permissible locally—suprathreshold pain categorically dominates any coexisting or adjacent pleasure within that domain. Yet it avoids global incoherence by allowing aggregative calculus *across* non-overlapping domains: mild pains and pleasures outside these zones, or in separate contexts, remain commensurate. This compartmentalization dodges the "everything must be comparable" trap by denying universal comparability *only where it matters most*, without making the whole utilitarian framework implode. If the neighborhoods are defined rigorously (e.g., by intensity/duration thresholds isolating unbearable suffering), it preserves lexicality’s core intuition—extreme pain voids pleasure’s moral relevance *in situ*—while permitting pragmatic balancing elsewhere. The risk? If neighborhoods overlap or expand, commensurability creeps back in, but as a deliberate design, this hybrid best isolates incommensurability where lexicality demands it.

  Your strict lexical ordering—where any suprathreshold pain automatically outweighs any pleasure—comes next in plausibility. It’s admirably uncompromising: crossing the pain threshold means pleasure becomes morally irrelevant, period. This decisively blocks commensurability objections by rejecting the premise that pleasure could *ever* counterbalance severe suffering. But it’s brittle. Critics argue it leads to absurdity: if one stubbed toe (above threshold) outweighs a lifetime of bliss for millions, morality becomes fanatically obsessed with微量 suffering prevention. Worse, maintaining a sharp threshold invites paradoxes—does pain *just below* the threshold become infinitely tradable? If so, the model secretly reintroduces comparability at the borderline, collapsing toward negative utilitarianism. Still, its purity defends lexicality without hidden commensurability, placing it second.

  The weighted discontinuity model—shared metric with "infinite" exchange rates near zero suffering—ranks last for your purpose. It *appears* lexical: pain’s weight escalates rapidly as suffering approaches zero, making severe pain insurmountable by pleasure. But mathematically, it sneaks commensurability in through the back door. If pain and pleasure share *any* common metric (even with steep weighting), they remain fundamentally comparable. An "infinite" weight is just an extreme scalar—it doesn’t create true incommensurability but instead implies that sufficient pleasure *could* theoretically outweigh fixed pain if we permit unrealistically large numbers. This doesn’t save lexicality; it preserves utilitarianism’s core commensurability while simulating lexicality through impractical exchange rates. It’s regular negative utilitarianism in disguise, amplifying pain’s weight without ever escaping the single scale.

  So, final ranking: your hybrid local-denial best isolates incommensurability without collapse, strict lexical holds principle but risks impracticality, and weighted discontinuity fails entirely by preserving commensurability. Hope this untangles some of the knot—philosophy after a breakup podcast is a mood.
