  I've been kind of obsessed with negative utilitarianisim lately — my roommate sent me this podcast about suffering after her breakup and now I cant stop thinking about whether pleasure and pain are even on the same scale. Specifically I'm stuck on this lexical threshold idea where pain might just always outweigh pleasure past some point, but then people say thats incoherent because you cant have incommensurable values on a utilitarian calculus. So I want you to rank three attempts to save the lexical view from that commensurability objection, from best to worst at actually doing the job without secretly collapsing back into regular negative utilitarianism: first, the strict lexical ordering where any pain above a threshold automatically dominates any pleasure; second, a weighted discontinuity model where pain and pleasure share a metric but the exchange rate goes infinite near zero suffering; and third, a local-denial hybrid I just made up where incommensurability holds only inside small "pain neighborhoods" but gets restored globally across larger domains. Can you do it all in one continuous flow, no headings or bullet points or bold, just like an email? I dont need citations or a reading list, just your reasoning laid out straight, and please say where each lands and why in the same running prose.
