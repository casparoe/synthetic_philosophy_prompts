  First, I need to understand the key tension points. The atomic-vs-general distinction is crucial. If correspondence creeps into universals, what stops it from applying everywhere? The philosopher's response about scope ambiguity needs a strong pushback. I should craft a question that forces her to explain why the boundary doesn't collapse, then challenge her when she invokes scope ambiguity. Maybe point out that scope doesn't resolve the ontological commitment issue.

