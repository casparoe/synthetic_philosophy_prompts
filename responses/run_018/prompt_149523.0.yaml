answer: |-
  Here's a thought experiment designed to flip the script, grounded in a realistic local setting:

  **The Scenario:**  
  In a small town, the community clinic faces a budget shortfall forcing it to cut one of two programs: **Program A** provides subsidized insulin for a chronically ill, unemployed local resident who has never paid local taxes due to low-wage instability. **Program B** offers specialized physical therapy for a temporary foreign agricultural worker with a severe injury. The worker pays local income taxes via payroll deductions and visa fees that fund local services, but his visa excludes him from most public benefits. Both face devastating health consequences if denied help. The clinic board must choose which program to cut.

  **Analysis:**

  1.  **Moderate Nationalism (Shared Institutions/Obligations):**  
      This view sees obligations arising from participation in shared institutions. The foreign worker *is* actively contributing to the local community through his taxes and labor, participating in the *reciprocal system* of contributions and benefits. He fulfills his civic duty despite limited formal rights. The local resident, while a citizen, *has not contributed* through taxes and hasn't reciprocated within the shared institutional framework, despite having the opportunity and societal expectation to do so. **Therefore, the clinic has a stronger obligation to honor the foreign worker's contribution by maintaining Program B.** Helping the compatriot here would undermine the reciprocity principle central to shared citizenship.

  2.  **Strong Cosmopolitanism (Nationality Morally Irrelevant):**  
      This view prioritizes impartial needs and vulnerability. The unemployed local citizen is chronically ill, unemployed, and likely lacks alternative support networks or resources. His vulnerability is systemic and long-term. The foreign worker, while injured, pays taxes, has employment (suggesting some stability pre-injury), and likely has access to other potential support (e.g., employer insurance, consular assistance, or the ability to return home where he might qualify for care). **Therefore, the local citizen is in objectively greater, more entrenched need.** Cosmopolitanism focuses on alleviating the worst suffering impartially, leading to a choice to maintain Program A for the needier local.

  **The Key Feature Doing the Work:**  
  **Active Contribution/Reciprocity within the Shared Institutional Framework.**  
  The reversal hinges on the *foreigner actively contributing* (taxes, labor) to the local system that grants benefits, while the *compatriot does not contribute* despite being part of the system. Nationalism focuses on this *reciprocity* within the institution. Cosmopolitanism focuses on the *resulting vulnerability* this lack of contribution creates for the compatriot.

  **What Happens Without This Feature?**  
  Remove the foreigner's active contribution (e.g., he's an undocumented worker paying no taxes) and the local's lack of contribution (e.g., he paid taxes for years before becoming unemployed).  
  *   **Nationalism** would likely default to prioritizing the compatriot (shared identity/community membership).  
  *   **Cosmopolitanism** would likely default to prioritizing whichever individual has the most acute medical need or least alternative support.  
  The scenario collapses back into the "help your own" vs. "help the neediest" dynamic because the specific tension created by *differential participation within the shared institution* is removed.

  **The Outcome:**  
  *   **Moderate Nationalism:** Cuts Program A (Local's Insulin). Helps the Foreign Worker.  
  *   **Strong Cosmopolitanism:** Cuts Program B (Foreign Worker's PT). Helps the Local Citizen.  

  **Why this avoids gut-feeling loops:** It forces each theory to grapple with an uncomfortable outcome. Nationalism must justify helping the foreigner *because* of institutional reciprocity, challenging simple tribalism. Cosmopolitanism must justify helping the compatriot *despite* nationality, based solely on need, challenging assumptions that it always favors the foreigner. The reversal comes from the core logic: nationalism values institutional reciprocity, cosmopolitanism values impartial need assessment.
