  hey so ive been thinking about whether being from the same country actually gives you special moral claims on each other, or if thats just tribalism with a flag. i want to build a thought experiment that actually separates the two views instead of just asking who do you save.

  specifically: construct a realistic one-paragraph scenario — like a local hospital or town council, no trolleys, no sci-fi — where moderate nationalism (shared citizenship creates real obligations through shared institutions) ends up telling you to help the foreigner, while strong cosmopolitanism (nationality is morally invisible, everyone counts the same) ends up telling you to help the compatriot. the reversal shouldnt come from either side being stupid; it should fall out of the theories themselves when one specific feature is present.

  constraints: keep it grounded, one paragraph for the story. then walk through what each view says and why, point out the exacly feature doing the work, and tell me what happens if you remove that feature — does it collapse back into the usual help-your-own vs help-the-neediest? also dont lean on obscure texts; just work with the ideas directly.

  i keep feeling like these debates loop because everyone picks examples where their gut already wins, so i want a case engineered the other way around. can you build that?
