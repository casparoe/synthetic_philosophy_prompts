  First, I need to understand the core issue. The user is pointing out a disconnect between theoretical commitments and practical proposals. The advocate uses the capability approach to deflect criticisms but doesn't implement it in their policy suggestions. This isn't just inconsistency; it's a strategic pivot.

  I recall Amartya Sen's capability approach, which emphasizes what people can do with resources. The user mentions Martha Nussbaum too. The problem arises when someone pays lip service to capabilities but falls back on resources when policy is discussed. The user wants to distinguish this from simple equivocation or the standard debate between resources and capabilities.

  Looking for existing terms... "Rhetorical bait-and-switch" comes to mind, but it's not precise. "Motivational displacement" might relate, but it's not exact. The key is the asymmetry: using capabilities defensively but resources offensively. The user needs a term that captures this specific maneuver.

  The deeper need here might be intellectual clarity. The user wants to label this pattern to critique it effectively in debates. They might be involved in policy discussions, philosophy, or activism. Naming the tactic gives them a tool to call it out. They might also seek validation that this is a recognized issue, not just their perception.

  I should check if there's a known term in philosophy or rhetoric. The Stanford Encyclopedia or academic papers on capability approach critiques might help. Terms like "theoretical retreat" or "instrumentalization of capabilities" could be close. If no term exists, coining one like "Capability Shield" or "Defensive Capability Retreat" makes sense. The definition must emphasize the defensive pivot and policy reversion.

  Also, considering the user's possible frustration: they've encountered this repeatedly and want to articulate why it's problematic. They might want to push advocates towards genuine capability-based policies or expose intellectual dishonesty. The response should provide a clear, memorable term and definition to empower their arguments.
answer: |-
  This is a brilliant observation of a **very** common rhetorical pattern in distributive justice debates. While there isn't a single universally accepted, formal term *specifically* for *this exact sequence* (the resource proposal -> capability pivot under objection -> resource proposal return), we can name and define it precisely by focusing on the *function* and *asymmetry* you describe:

  **The Term: "Capability Shield Maneuver" (or "Defensive Capability Retreat")**

  **Definition:** A rhetorical strategy in equality debates where an advocate:
  1.  **Proposes a Resource-Focused Policy:** Initially advocates for a policy based primarily on equalizing resources (e.g., flat cash transfers, equal distribution of goods).
  2.  **Deploys Capability/Welfare Language Defensively:** When confronted with objections highlighting heterogeneity in needs or conversion factors (e.g., disability, chronic illness, differing circumstances), pivots to the language of capabilities, functionings, or welfare *as a defense*. This pivot frames the *initial resource proposal* as *instrumental* to achieving these deeper equalities, absorbing the objection by appealing to a richer metric.
  3.  **Reasserts the Resource Policy Offensively:** When pressed for the *concrete policy implications* of this richer metric (which would likely require *unequal* resource allocation to achieve equal capabilities), reverts to advocating for the original, simpler *resource-equalizing policy*, effectively sidelining the richer metric for practical implementation. The richer metric serves only as a shield against criticism, not as a genuine guide for policy design.

  **Key Features Separating it from Related Concepts:**

  1.  **Not Simple Equivocation:** The advocate genuinely acknowledges the *validity* of the capability perspective *in the abstract* when defending against objections. They aren't necessarily contradicting themselves *at that moment*; they are strategically *invoking* it.
  2.  **Distinct from the Standard Resources-vs-Capabilities Debate:** This isn't just arguing *for* resources *against* capabilities, or vice-versa. It's a specific sequence where **capabilities are used defensively to protect a resource-based proposal**, but **resources remain the sole operational metric for the positive proposal**. The richer metric is instrumentalized only for defense.
  3.  **More than Plain Inconsistency:** While inconsistent in the broader sense, the inconsistency has a clear *pattern* and *function*: **Absorb criticism via richer theory, implement simpler policy.** The inconsistency serves a strategic purpose within the debate.
  4.  **Asymmetry in Metric Usage:** This is the core. The **richer metric (capabilities/welfare) is only activated reactively** to deflect criticism of the simple policy. The **thinner metric (resources) is used proactively** to define the actual desired outcome and policy. The richer metric does no *positive* work in shaping the concrete proposal; it only does *negative* work shielding the simpler proposal.
  5.  **Rhetorical Shield Function:** The capability language acts as a "shield" against objections about heterogeneity, giving the *appearance* of theoretical sophistication and responsiveness without requiring any actual adjustment to the proposed policy.

  **Why This Pattern Emerges:**

  1.  **Simplicity & Political Palatability:** Flat resource transfers are conceptually simple, easier to administer, and often politically easier to sell than complex needs-based assessments. The capability pivot avoids having to defend the policy's simplicity against obvious counterexamples.
  2.  **Avoiding "Paternalism" Charges:** Actively designing unequal resource allocations based on assessed needs/capability gaps can be attacked as paternalistic or requiring intrusive assessments. The flat transfer avoids this.
  3.  **Theoretical Convenience:** Capability theory (Sen, Nussbaum) is widely respected and provides a powerful *critique* of pure resource equality. Invoking it defensively borrows this credibility without committing to its more demanding (and complex) policy implications.
  4.  **Motivational Displacement:** The advocate might be *motivated* primarily by a belief in the moral simplicity of resource equality or libertarian ideals, but uses capability language defensively because it's the dominant sophisticated framework for critiquing pure resource equality.

  **In essence:** The "Capability Shield Maneuver" allows an advocate to **appear responsive to the complexities of human need and equality (using capability language defensively) while ultimately advocating for a policy that ignores those very complexities in its design (a flat resource transfer).** It leverages the *rhetorical power* of the capability critique without accepting its *distributive consequences*.

  This term precisely captures the dynamic you've identified – the defensive pivot to a richer theory solely to protect a simpler, pre-existing policy commitment, followed by the reversion to that simple policy when pressed for positive proposals. It highlights the *asymmetry* and *strategic function* of the richer metric's usage.
