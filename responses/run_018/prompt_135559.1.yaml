answer: |-
  ## Thesis Defense: Diachronic Binding & the Perpetual Performative Power of Institutional Documents

  **Thesis:** Institutional promises recorded in writing, even without a specific present audience, constitute genuine performative utterances. This is possible through a mechanism of **diachronic performative binding (DPB)**, wherein normative force is generated not by simultaneous co-present uptake, but by the document's persistent accessibility to any future party meeting a specified, institutionally-defined recognition condition. DPB operates within and extends Austin's felicity conditions without collapsing the performative-constative distinction.

  ### I. The Core Argument: Mechanism of Diachronic Performative Binding (DPB)

  DPB is a mechanism by which a written institutional utterance generates enduring normative effects across time. Its legitimacy rests not on immediate audience acceptance, but on its embeddedness within a persistent institutional framework that guarantees its future accessibility and defines the conditions under which its force is activated. Here are its precise conditions:

  1.  **Institutional Embedding:** The utterance must be produced within and authorized by a recognized, enduring institution (legal system, religious order, corporate body, governmental entity) capable of sustaining norms over time and enforcing consequences.
  2.  **Documentary Form:** The utterance must be materially recorded in a durable, stable form (written, carved, digital with robust preservation) designated by the institution as the canonical vessel for such commitments.
  3.  **Recognition Trigger:** The document must explicitly or implicitly define a *future recognition condition* – a specific event, status, or action that, when met by *any* future party, triggers the normative force of the utterance (e.g., "any heir," "any citizen," "any party presenting this deed," "upon the occurrence of Event X").
  4.  **Normative Consequence Activation:** Meeting the recognition condition must demonstrably activate specific, institutionally enforceable normative consequences for the recognizing party or others (e.g., granting rights, imposing obligations, transferring ownership, establishing status).
  5.  **Persistent Accessibility:** The institution must have mechanisms ensuring the document remains accessible (archives, registries, public records) to potential future recognizers meeting the condition.

  **How DPB Operates within Austin's Felicity Conditions:**

  Austin's felicity conditions are not abandoned but *temporally reconfigured* for the institutional context:

  *   **(A1) Conventional Procedure Exists:** The procedure *is* conventional – the institutional act of creating, signing, sealing, and archiving a specific type of document (will, contract, law, charter) *is* the established conventional procedure *for that institution* to create binding commitments intended to endure.
  *   **(A2) Appropriate Persons & Circumstances:** The "appropriate persons" are those authorized by the institution to create such documents (testator, legislator, authorized signatory). The "appropriate circumstances" include the institutional context itself and the act of formal recording/authentication.
  *   **(B) Procedure Executed Correctly & Completely:** Execution requires the full institutional ritual: drafting according to form, authentication (signatures, seals), and deposition into the institution's enduring record-keeping system. *Completeness* now includes this archival step, ensuring future accessibility – the procedure isn't finished until the document is secured for the future.
  *   **(Γ1) Required Thoughts/Feelings:** The *intent* to create a binding institutional commitment is required at the time of utterance/recording. The institution presumes this intent from participation in the formal procedure. Future parties' feelings are irrelevant to the *activation* of the force; only the *recognition condition* matters.
  *   **(Γ2) Future Conduct:** Future conduct (adherence) is the *very purpose* of the institutional document. The institution itself, through its enforcement mechanisms, becomes the primary guarantor of adherence.

  **The "Uptake" Transformation:** Traditional co-present uptake (audience understanding/acceptance) is replaced by:
  1.  **Institutional "Uptake" at Creation:** The institution, through its officials and procedures, "accepts" the document into its framework by authenticating and archiving it. This institutional act validates the utterance *as a performative* within its system.
  2.  **Future Recognition as Conditional Uptake:** When a future party meets the recognition condition *and* accesses the document (fulfilling "accessibility"), they effectively perform the "uptake" necessary to activate the *specific normative consequences* for *themselves* or the relevant situation. The force was latent in the document; recognition triggers its application.

  ### II. Defending Against the Constative Objection

  **Objection:** "Absent co-present uptake, the written promise is merely a constative report of the speaker's intent ('I hereby declare my intent to bind future heirs'), not a performative act creating an obligation."

  **Response:**

  1.  **The Document as the Act, Not a Description:** In institutional contexts, the physical act of signing/sealing/depositing the *document itself* is the conventional procedure for *doing* the deed (making the will, enacting the law, signing the contract). It's not describing a signing event elsewhere; the inscription *is* the performative event. Saying "I bequeath X to Y" in a properly executed will isn't *reporting* an intent to bequeath; it *is* the act of bequeathing *if* the institutional felicity conditions (including DPB) are met.
  2.  **Creation of New Normative Facts:** A successful constative reports a pre-existing state ("The cat is on the mat"). A successful performative *changes* the world ("I name this ship..."). DPB performatives demonstrably create new, enduring normative facts *at the moment of their correct institutional execution*: a property right is vested (though possession may be future), a legal obligation is created (though enforcement may be future), a status is conferred (though it may only be claimed later). The future recognition condition is part of the *structure* of the normative fact created, not evidence that nothing was created initially.
  3.  **Institutional Reality vs. Speaker Psychology:** The force derives from the institutional framework, not the speaker's transient mental state. Once properly executed and archived, the document *becomes* an institutional fact. Its meaning and force are defined by the institution's rules and the document's text, not by the original author's later thoughts or the lack of an initial audience's reaction. A lost will, once found and recognized, exerts its force – proving its performative nature was latent, not contingent on initial audience awareness.
  4.  **The Role of Recognition:** Future recognition isn't *creating* the obligation; it's *discovering* and *activating the specific application* of an obligation *already created* by the institutional act. The heir doesn't *create* their right by reading the will; the will *created* the conditional right ("to my heir"), and the heir's recognition (establishing they *are* the heir) fulfills the condition, triggering the *enforceability* of that pre-existing right.

  ### III. Maintaining the Performative-Constative Distinction

  DPB does not collapse the distinction; it highlights a distinct *sub-type* of performative operating within institutional temporality.

  *   **Constatives:** Describe a state of affairs (past, present, future). True/False. (e.g., "The King signed the charter in 1215.").
  *   **Standard (Synchronic) Performatives:** Do something *in the moment of utterance* requiring co-present uptake for felicity. (e.g., "I promise *you* (present audience) I'll pay tomorrow." - requires *your* acceptance).
  *   **Diachronic Performatives (via DPB):** Do something *in the moment of correct institutional execution* that creates an *enduring normative state*, with its force activated later by meeting the recognition condition. Uptake is institutional at creation and conditional upon future recognition. (e.g., The Magna Carta *enacted* limitations on royal power in 1215; its force becomes actionable for a baron *when* the king violates it and the baron invokes the relevant clause).

  The core distinction – *doing* vs. *describing* – remains absolute. DPB performatives are clearly in the "doing" category; they change institutional reality at T1, creating a normative structure designed to exert force at T2 upon recognition. Constatives merely describe reality at any T.

  ### IV. Applying the Criteria: Examples

  *   **Archival Contract (Future Assignment Clause):** "Party A assigns all future royalties from Work X to any entity designated by Party B." *Satisfies DPB:* Institution (contract law), Documentary Form (signed contract), Recognition Condition ("entity designated by Party B"), Consequence (royalty payment obligation activated upon designation + presentation of contract), Accessibility (filed with court/archived).
  *   **Testamentary Clause:** "I bequeath my library to the first university established in Town Y." *Satisfies DPB:* Institution (probate law), Documentary Form (executed will), Recognition Condition ("first university established in Town Y"), Consequence (ownership transfer upon establishment + probate), Accessibility (filed with probate court).
  *   **Public Pledge (Monument Inscription):** "This city pledges perpetual sanctuary to all refugees fleeing persecution." *Satisfies DPB?* **Requires Analysis:** Institution (City Gov't - needs enabling law/ordinance), Documentary Form (monument - durable, but is it *official* record?), Recognition Condition ("refugee fleeing persecution" - needs defined criteria), Consequence ("sanctuary" - needs defined legal meaning/obligation), Accessibility (publicly visible - good). *Likely requires supporting legislation to be a true DPB performative; otherwise, it's more hortatory constative.*

  **Conclusion:**

  Diachronic Performative Binding provides a robust theoretical mechanism explaining how institutional written promises function as genuine performatives despite lacking a specific co-present audience. By reconfiguring Austin's felicity conditions within an enduring institutional framework – specifically emphasizing correct execution, archival persistence, and future recognition triggers – DPB accounts for the normative force generated at the moment of inscription and activated across time. It successfully counters the constative objection by demonstrating the creation of new institutional facts and distinguishing the *creation* of normative states from their future *activation*. Crucially, it achieves this while preserving the fundamental performative-constative distinction, carving out a distinct category for utterances whose power is inherently diachronic, embedded within the scaffolding of institutions designed to transcend the immediate moment. The precise conditions of DPB allow for the critical evaluation of historical and contemporary documents, revealing the profound ways in which writing, institutionality, and time intertwine to create binding normative realities.
