answer: |-
  As a committed conditional analyst, I welcome your finkish challenge! Your case is clever, but it reveals only that our initial counterfactual was too crude—it didn’t properly account for *persistence*. The glass’s fragility at time *t* isn’t captured by "*if struck at t, it would shatter*" because the disposition itself is finks away *during* the stimulus. So I refine the analysis:  

  **"Object O is fragile at time t iff: if O were struck *while retaining its intrinsic properties at t* throughout the striking, it would shatter."**  

  In your scenario, the glass *doesn’t* retain its intrinsic properties (its molecular structure changes via flash-cooling) when struck. Thus, the refined counterfactual is *false* at *t*—and rightly so! For at the moment of impact, it *is* no longer fragile. You insist it’s fragile *before* the strike? Only if we misdescribe its intrinsic state: the wiring device is *already* part of its dispositional profile at *t*, covertly poised to remove fragility. The glass isn’t "fragile simpliciter" but "fragile-unless-flash-cooled"—a *different* disposition.  

  So: isn’t your "fragile" label misleading without specifying the absence of extrinsic interferers? What intrinsic property grounds this fragility *without* the fink?
