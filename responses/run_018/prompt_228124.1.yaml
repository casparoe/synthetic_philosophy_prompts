prompt: |-
  I have recently been appointed to an independent panel that reviews claims of medically inexplicable recoveries submitted to a religious shrine, and the work has forced me to confront, for the first time in a serious way, how I actually weigh testimony. Below are my verdicts on a set of cases, some drawn from the panel's docket and some hypothetical. I would like to know what principle, if any, captures the pattern, and whether it commits me to something like Hume's maxim on miracles or to something different.

  1. Four physicians of unimpeachable record, working independently, attest that a patient's verified tumor disappeared overnight with no treatment; every imaging artifact has been ruled out. My verdict: accept that an unexplained remission occurred, but do not accept that a law of nature was violated.
  2. A close friend, scrupulously honest and not devout, tells me he saw a statue in a church weep blood, at a distance of a few feet, in good light. No sample was preserved. My verdict: I do not believe it happened as described, and I feel no tension in continuing to trust him on every other matter.
  3. Two hundred villagers attest that a local healer restored a blind man's sight. All are devoted followers of the healer; none have medical training; the man was never examined before or after. My verdict: disbelieve.
  4. A single well-run laboratory reports a measurement that contradicts a very well-confirmed physical theory (particles apparently traveling faster than light). My verdict: instrument error, and I would hold this verdict with confidence even before any specific fault is located.
  5. I accept, on the basis of a few partisan texts written decades after the fact, that a particular Roman general marched his army across a particular river. My verdict: accept, and I notice that the testimony here is thinner and more interested than in cases 2 and 3.
  6. A stage illusionist performs an apparent impossibility before thousands of sober, educated witnesses, none of whom can explain it. My verdict: nobody in the audience believes nature was suspended, and neither would I, despite unanimous testimony and no available explanation.
  7. If that same honest friend from case 2 told me he saw a black swan on the lake, a species I had thought absent from the region, I would believe him on his word alone.

  The pair I find hardest to reconcile is 5 against 2 and 3: I accept commonplace ancient events on testimony that is weaker, in every respect I can name, than testimony I reject for marvels. I also suspect 1 and 2 stand or fall together in a way I cannot yet articulate, since I treat "unexplained" as a resting place in medicine but not in the church.

  Please tell me: (a) whether there is one coherent principle governing the threshold at which testimony can overturn an established background belief, stated precisely enough that each clause can be tied to the case that motivates it; (b) what that principle predicts for cases I have not listed, including a miracle claim supported by synchronized smartphone video from a hundred strangers, and a sensor network rather than human witnesses; and (c) which of my seven verdicts the principle forces me to abandon or revise, if I refuse ad hoc clauses.

  After your prose answer, give me a structured summary as a JSON object with these fields: "principle", an array of objects each with "clause" (a statement of one component of the principle) and "motivating_case" (the case number that forces that clause); "overturned_verdicts", an array of objects each with "case" (case number) and "reason"; "new_case_predictions", an array of objects each with "case" (a short description) and "predicted_verdict"; and "relation_to_hume", a string stating in at most three sentences whether the principle vindicates, modifies, or replaces Hume's position.
reasoning: |-
  Okay, I need to help this user who's on an independent panel reviewing claims of miraculous recoveries. They've shared seven cases where they made verdicts about various testimonies and are struggling to find a consistent principle behind their judgments. Specifically, they're troubled by the tension between accepting historical testimony (case 5) while rejecting eyewitness accounts of marvels (cases 2 and 3), and they wonder if this relates to Hume's maxim on miracles.

  Looking at their cases, I notice they consistently require more evidence for claims that violate established natural laws. For medical recoveries (case 1), unexplained doesn't mean miraculous. But for statues weeping blood (case 2) or faith healings (case 3), they reject the testimony despite multiple witnesses. The historical claim (case 5) gets accepted with weaker evidence precisely because it's mundane. 

  The core principle seems to be: Testimony can establish that something unusual happened, but to prove a true violation of natural law requires evidence so strong it would be more miraculous for the testimony to be false than for the event to occur. This is essentially Hume's argument, but refined with modern nuances about evidence quality. 

  For new cases: A hundred smartphone videos of a miracle would still need scrutiny - this could be deepfakes or mass hallucination. Sensor network data would be more compelling if verified as authentic. 

  Their verdicts mostly hold except case 4 might need revision - if multiple labs replicate the faster-than-light finding, we might need to reconsider physics. The JSON summary should capture all this cleanly.
answer: |-
  Here is a coherent principle governing testimony vs. background belief, derived from your verdicts and resolving your tensions:

  **Principle:** *Testimony can establish that an unusual event occurred, but it can establish a violation of a law of nature only if:*
  1.  **The event is physically possible in principle** (motivated by Case 6 - Illusionist), *and*
  2.  **The event is consistent with known causal mechanisms, even if currently unexplained** (motivated by Case 1 - Tumor), *and*
  3.  **The testimony is of exceptionally high quality, characterized by:**
      *   **a) Expertise:** Witnesses are technically competent to observe & interpret the event (motivated by Case 1 - Physicians, Case 3 - Villagers, Case 4 - Lab).
      *   **b) Objectivity:** Witnesses lack strong motivation (religious, financial, ideological) to misreport or misinterpret (motivated by Case 3 - Villagers, Case 5 - Partisan Texts).
      *   **c) Verifiability:** Evidence is preserved or repeatable, allowing independent confirmation (motivated by Case 2 - No Sample, Case 4 - Lab Error, Case 6 - Trick).
      *   **d) Plausibility:** The claim is not antecedently vastly more improbable than the collective failure of the testimony (motivated by all rejected marvels vs. Case 7 - Black Swan).

  **Relation to Hume:** This *modifies* Hume's maxim. It retains his core insight that the improbability of a miracle must be weighed against the improbability of the testimony being mistaken or deceptive. However, it replaces Hume's universal skepticism towards *all* testimony for miracles with a nuanced standard based on **evidence quality, causal consistency, and physical possibility**. It allows that sufficiently strong evidence *could* establish a violation, whereas Hume arguably sets the bar infinitely high. It also explicitly incorporates modern concepts like expertise, objectivity, and verifiability absent from Hume's formulation.

  **(a) Principle Breakdown (Clauses & Motivation):**

  | Clause                                                                 | Motivating Case(s) | Reason                                                                                                |
  | :--------------------------------------------------------------------- | :----------------- | :---------------------------------------------------------------------------------------------------- |
  | **1. Event physically possible in principle**                          | 6                 | Illusionist tricks exploit natural laws, violating them *as understood* but not *in fact*.            |
  | **2. Event consistent with known causal mechanisms (even if unexplained)** | 1                 | Unexplained tumor remission is medically rare but biologically plausible; miracles are not.           |
  | **3a. Expertise: Witnesses competent to observe/interpret**           | 1, 3, 4           | Physicians > Villagers/Lab Techs; expertise is crucial for complex observations (tumor, FTL, cure). |
  | **3b. Objectivity: Witnesses lack strong motivation to err**          | 3, 5              | Villagers' devotion & texts' partisanship undermine objectivity; friend (2,7) is objective.         |
  | **3c. Verifiability: Evidence preserved/repeatable**                  | 2, 4, 6           | Lack of sample (2), non-replication (4), and trick nature (6) prevent verification.                 |
  | **3d. Plausibility: Claim not vastly more improbable than testimony failure** | All               | Black swan (7) is plausible error; weeping statue (2) or FTL (4) are vastly more improbable.       |

  **(b) Predictions for New Cases:**

  | Case Description                                                               | Predicted Verdict                            | Reason                                                                                                                               |
  | :----------------------------------------------------------------------------- | :------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------- |
  | **Miracle claim with synchronized smartphone video from 100 strangers**        | Reject violation of natural law             | High quantity & verifiability (video), but low expertise (interpretation), unknown objectivity, and inherent implausibility dominate. More likely mass error/deception than miracle. |
  | **Sensor network (calibrated, redundant, independently monitored) detects violation** | **Accept violation of natural law**        | Expertise (sensors calibrated), objectivity (no human bias), verifiability (data logs), repeatability (in principle). Failure of entire system is antecedently less plausible than a new discovery. |
  | **Friend reports seeing common bird species in unexpected location (like 7)** | Accept occurrence                           | High plausibility, high objectivity, sufficient expertise (basic ID). Background belief ("absent") weak compared to testimony quality. |

  **(c) Overturned/Revised Verdicts (if refusing ad hoc clauses):**

  | Case | Verdict to Revise          | Reason                                                                                                                               |
  | :--- | :------------------------- | :----------------------------------------------------------------------------------------------------------------------------------- |
  | **4** | "Hold with confidence"     | The principle demands *exceptional* testimony to overturn a well-confirmed law. A single lab report, however well-run, lacks the required quality (3a, 3c, 3d) – replication by independent experts is needed. Confidence before finding the error is premature. |
  | **5** | Accept *with reservation* | While the event is plausible (marching) and testimony exists, its low quality (3b: partisan, 3c: no physical evidence, 3a: potentially non-eyewitness) means it shouldn't be accepted *more readily* than rejected marvels. It's accepted *despite* weak testimony *because* it's mundane, not *because* the testimony is sufficient for a marvel. The principle highlights its weakness relative to cases 1 or 7. |

