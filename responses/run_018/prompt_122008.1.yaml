prompt: |-
  I keep a prediction journal. Three years now, a few hundred resolved questions, scored with the quadratic rule that forecasting people use. I have no academic background in any of this — I taught myself from blogs, a forum, and one or two books I only half understood — so please don't assume I know the vocabulary. If you use technical terms, say what they mean in a clause.

  I have noticed something that I cannot get anyone to discuss with me, and I want to know whether it has a name.

  First instance. Last year I wrote myself a cluster of questions about a single upcoming event: whether a particular company would release a product before the end of the year, and if it did, in which quarter. Asked one at a time — a single yes-or-no on ships this year, then, separately, conditional on shipping, which quarter — my numbers came out one way. Written instead as one question with five cells (does not ship; first quarter; second; third; fourth), the number I wanted to put on does not ship was clearly lower. Nothing about the world changed between the two exercises, and nothing about my information did either; I did them the same afternoon. I have since rerun the arithmetic both ways over the previous two years, and the gap is systematic, not noise.

  Second instance, which I suspect is the same thing seen from the other side. My own record says that when I write 80 I am right something like 74 per cent of the time, and when I write 95 I am right something like 82 per cent of the time. So I now shade my high numbers down before writing them. Everyone tells me this is fine: my real opinion just is the shaded number, and the shading is me learning from evidence about myself. That does not match the phenomenology. I do not feel that I believe the shaded number. I feel that I believe the unshaded one and am writing a different one because of how I am going to be graded — and the whole selling point of the framework I picked this up from was that a proper rule never rewards you for writing anything other than your real opinion, and that the only thing that matters is being near the truth.

  What the two cases have in common, as far as I can tell, is this: the number it is best for me to write depends on bookkeeping — how finely the outcomes are carved up, how many questions I am being asked at once, what my scoring history happens to look like — and not only on what I believe and on what is true. Both halves of the advertising slogan then seem to fail, in a way that has nothing to do with the truth of anything.

  The only reply I get from people who know more than I do is that this is just how the rule works. That is a description of my example, not an answer.

  So, three things I want, and I will not be satisfied with a label dropped on the table:

  Whether this is one phenomenon or two. The carving-up-the-outcomes case and the shading case feel different in kind, and I would rather have two names with a clear relation between them than one name papered over a join.

  Where the edges are relative to things it resembles but is not. I can think of four candidates and cannot sort them: deliberately gaming a score; my opinion simply not being a sharp number in the first place, so that any single number is a compression with losses; my track record being genuine evidence about my own reliability, which I am entitled to use; and whatever the property is called that is supposed to make a rule reward only honesty. Tell me which of these my case is, which it is not, and what the exact point of difference is in each instance.

  The boundary case I cannot locate for myself. Sometimes moving a number after a re-description seems clearly right. I split does not ship into delayed indefinitely and cancelled outright, realised I had been folding two quite different failures with different likelihoods into one box, and my numbers moved a lot. That felt like noticing something, not like bookkeeping. And yet, on my own telling, the world and my information about it were unchanged there too — exactly as in the first instance, where the movement felt illegitimate. I want the test that separates them, stated so that I could apply it to a new case without already knowing which way it should come out.

  One more constraint: I have read, paraphrasing badly, that different scoring rules are defended for different reasons and that there is disagreement about which is correct. If the trouble I am describing is an artefact of the quadratic rule specifically, say so, and say whether the logarithmic one has the same feature; I would like to know whether I have found something about accuracy or only something about my scoring convention.

  I am not asking for citations, a bibliography, or a reading list — I cannot chase references and I would not trust a list I could not check. Use the established terms if you know them, to help me place things, but the answer I want is the carving, not the sources. Please do not open with the name if there is one; I would rather see the shape of the thing first.

  Sections, in this order, with roughly these lengths:

  What you think I am describing — about 120 words. Restate the phenomenon in your own terms before you name anything, so I can check we are talking about the same thing.

  Names, if any — about 150 words. The established term or terms if there are any; if there are none, say plainly that there are none.

  One thing or two — about 200 words. Which of my two instances share a structure, and on what principle you are dividing or unifying them.

  Nearest neighbours, and why each is not quite it — about 250 words. The four candidates I listed, plus any I have missed; for each, the exact point of difference from my case.

  The edge case — about 200 words. My delayed-versus-cancelled example, the general test you would apply, and at least one new case of your own on each side of the line.

  Does the choice of rule matter — about 150 words.

  What I should call it — about 100 words. Your recommended term, a one-sentence definition, and one sentence each on what would and would not count as an instance of it.
reasoning: |-
  Okay, the user has been keeping a prediction journal for three years with hundreds of resolved questions, using a quadratic scoring rule. They've noticed two phenomena they can't get explained properly. First, when they ask conditional questions separately versus one multi-cell question, their probabilities shift without new information. Second, they have to adjust their high probabilities (like 80% to 74%) based on past performance, even though it feels dishonest. They want to know if these are two separate issues or one, and how to distinguish them from similar concepts.

  The user is clearly detail-oriented and has put a lot of thought into this. They’re frustrated because the answers they’ve gotten so far don’t address their core concern about the scoring rule itself versus their beliefs. They need clarity without academic jargon, and they want practical ways to distinguish between legitimate and illegitimate probability adjustments.

  First, I need to break down their two issues. The first is about outcome granularity affecting probabilities. When they split a question into finer categories (like not shipping vs. specific quarters), their initial "does not ship" probability changes. This seems related to the concept of coarsening in scoring rules. The quadratic rule penalizes overconfidence, so spreading probability across more bins might reduce the penalty for a single incorrect bin. But the user did this in one afternoon without new info, so it’s not new evidence—it’s structural.

  The second issue is probability shading based on calibration. Their past performance shows they’re overconfident, so they adjust down high probabilities. But phenomenologically, they still feel their original estimate is correct. The scoring rule’s incentive structure pushes them to adjust, but it feels like gaming the system. The literature says proper scoring rules should encourage honest reporting, but here the adjustment is necessary due to miscalibration. 

  Are these two issues connected? Both stem from the scoring rule’s mechanics. The granularity problem involves how the rule handles multiple bins, while shading is about individual calibration. But the common thread is that the optimal report depends on the scoring context, not just beliefs. That points to the idea of "scoring rule dependence" or "elicitation brittleness."

  Looking at similar concepts: Gaming the system would be intentionally misreporting for better scores, which isn’t the case here—they’re adjusting based on the rule’s structure. Probability as compression might apply if beliefs are vague, but the user’s adjustments are rule-driven, not belief updates. Using track record as evidence is valid (a Bayesian approach), but the user doesn’t feel their belief changes, just their reported number. The "proper" property of scoring rules ensures honesty, yet here adjustments are needed due to the rule’s incentives conflicting with true beliefs. 

  The edge case they mention (splitting "not ship" into delayed/canceled) is legitimate because it reflects a realization about distinct outcomes, whereas the initial granularity shift is structural. The test for legitimacy is whether the probability reassignment comes from new insight about the state space or just the scoring rule’s penalties. 

  Regarding scoring rules: The quadratic rule’s sensitivity to bin count is a known issue. The logarithmic rule avoids this by being invariant to coarsening, so switching might help. But calibration adjustments would still be needed if they’re consistently overconfident. 

  Recommended term: "Elicitation brittleness." This captures how reported probabilities are fragile under different elicitation setups. For the shading, it’s "scoring-rule induced calibration adjustment." But unifying them as manifestations of the rule’s structure not aligning with true beliefs. 

  The user’s deeper need is understanding why the scoring rule’s promises (honesty rewarded) don’t match their experience, and how to navigate that without abandoning the system. They want validation that their observations are real and guidance on distinguishing correct adjustments from artifacts.
answer: |-
  Here's a breakdown addressing your observations systematically, respecting your constraints and structure:

  ### 1. What You Are Describing (≈120 words)
  You’ve identified two patterns where your optimal reported probability under the quadratic scoring rule doesn’t solely reflect your true belief about the world. First, **granularity matters**: splitting a single multi-outcome question (e.g., "ship date: Q1/Q2/Q3/Q4/canceled") into conditional sub-questions (e.g., "will it ship?" then "if yes, when?") changes the probability you assign to the same outcome ("canceled"), even with identical information. Second, **calibration forces adjustments**: your historical accuracy reveals systematic overconfidence, so you lower high probabilities (80% → 74%) to optimize your score, despite feeling this misrepresents your actual belief. Both suggest the scoring rule itself—not just truth or belief—distorts your reported numbers.

  ### 2. Names (≈150 words)
  The first issue is **coarsening sensitivity**: a scoring rule’s penalty for misprediction changes when outcomes are grouped or split, altering incentives. The quadratic rule has this property. The second is **scoring-rule induced calibration adjustment**. The unifying concept is **improperness in practice**—though the quadratic rule is "proper" (theoretically rewarding honest reports), your real-world miscalibration breaks its ideal assumptions. There’s no single established term for your exact dual observation, but related ideas include "elicitation brittleness" (sensitivity to how questions are framed) and "empirical improperness" (when proper rules fail due to biased beliefs). Crucially, these aren’t about the rule being theoretically flawed, but about its interaction with imperfect human judgment.

  ### 3. One Thing or Two? (≈200 words)
  These are **two distinct phenomena linked by scoring rule mechanics**.  
  - **Granularity (coarsening sensitivity)** arises from how the quadratic rule penalizes errors *differently* based on bin structure. When you merge outcomes (e.g., collapsing all "ship" quarters into one bin), the rule penalizes less harshly for being "close but wrong" within that bin. Your optimal report shifts because the *scoring risk* changes with binning—not your belief.  
  - **Calibration shading** stems from your *systematic bias*. The rule is proper *if* your probabilities are perfectly calibrated. Since yours aren’t, optimizing your score requires adjusting for your known overconfidence. It’s rule-driven *mitigation* of personal bias.  
  **Connection**: Both show the quadratic rule’s incentives overriding pure belief. But granularity alters scoring geometry, while shading addresses your reliability. One is about *outcome partitioning*; the other about *reporter fallibility*.

  ### 4. Nearest Neighbours & Differences (≈250 words)  
  1. **Gaming the score**: Deliberately lying to exploit the rule. *Difference*: You’re *not lying*—you’re adjusting to report more accurately *given your proven bias*. Gaming would be claiming 50% when you believe 90% just to hedge; shading is saying 74% *because* your 80% claims were wrong 26% of the time.  
  2. **Belief compression**: True belief isn’t sharp, so any number loses information. *Difference*: Your granularity shift isn’t about vagueness—you had a definite belief that changed *only* due to question format. Compression is intrinsic; yours is rule-induced.  
  3. **Using track record as evidence**: Your past performance *is* evidence about future reliability. *Difference*: This is legitimate, but your "phenomenology" clash (feeling the unshaded number is truer) highlights that shading is a *scoring tactic*, not a belief update. If you *internalized* the shading ("I now believe 74%"), it would be pure evidence use.  
  4. **Properness**: The property that honest reporting is optimal. *Difference*: Properness assumes your belief is well-calibrated. Your case shows it *fails empirically* when reporters are biased. The rule *is* proper, but *you* violate its assumptions.  
  **Missing candidate**: **Scoring rule dependence**—optimal reports varying by rule choice (e.g., quadratic vs. logarithmic). *Difference*: Your issues occur *within* one rule, due to framing or personal bias.

  ### 5. The Edge Case (≈200 words)  
  **Your example**: Splitting "not ship" into "delayed indefinitely" vs. "canceled" felt legitimate because you realized distinct *causal pathways* with different likelihoods. This is **outcome refinement based on latent structure**.  
  **Test to distinguish legitimate/illegitimate shifts**:  
  > *Did the re-description reveal new, outcome-relevant distinctions in the state space?*  
  - **Legitimate**: You identified distinct scenarios ("canceled" vs. "delayed") with *different drivers* (e.g., funding loss vs. technical hurdles). Your probabilities changed because you *recognized hidden heterogeneity*.  
  - **Illegitimate**: Changes driven purely by scoring penalties (e.g., splitting Q1/Q2/Q3/Q4 when you have no reason to expect different likelihoods per quarter). Here, bins are arbitrary.  
  **New cases**:  
  - *Legitimate*: Predicting "rain" at 60%. You split into "drizzle" (40%) and "downpour" (20%) after recalling heavy rain requires specific wind patterns.  
  - *Illegitimate*: Predicting "Company X stock up tomorrow" at 70% alone, but lowering it to 65% when also predicting "up >5%" and "up 1–5%" simultaneously—despite no new information on volatility.

  ### 6. Does the Choice of Rule Matter? (≈150 words)  
  **Yes, critically**.  
  - **Granularity**: The quadratic rule is **sensitive to coarsening**. Splitting outcomes changes penalties. The **logarithmic rule (log score)** is **coarsening-insensitive**: merging outcomes doesn’t alter optimal reports. If you used log scoring, your "does not ship" probability *wouldn’t shift* when adding quarterly bins (though conditional questions might still affect it).  
  - **Calibration shading**: Both rules require shading if you’re miscalibrated, but the *degree* differs. Logarithmic scoring penalizes extreme errors more harshly, often requiring *stronger* shading for overconfidence.  
  **Conclusion**: Your granularity issue is an **artifact of the quadratic rule**. Switch to log scoring to fix it. Shading is **universal to scoring rules** when reporters are biased—it’s about *your* calibration, not the rule.

  ### 7. What You Should Call It (≈100 words)  
  **Recommended term**: **Elicitation brittleness** (for granularity) and **scoring-rule induced calibration adjustment** (for shading).  
  - **Definition**: *Elicitation brittleness*: Dependence of optimal probability reports on the partitioning of outcomes under a given scoring rule. *Calibration adjustment*: Modifying reported probabilities to correct for personal bias, incentivized by historical scoring performance.  
  - **What counts**: Granularity shifts under quadratic scoring; post-hoc shading of probabilities due to track record.  
  - **What doesn’t**: Shifts from new evidence; using track record to update beliefs (e.g., "I now distrust my initial intuition"); changes due solely to rule-switching (e.g., quadratic to log).
