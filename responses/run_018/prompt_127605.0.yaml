  **Joint Statement on Sen's Liberal Paradox**  
  *Adversarial Collaboration between Lexical Liberal (LL) and Preference-Reconstructionist (PR)*  

  ---

  ### 1. Agreed Claims on the Formal Structure  
  We jointly affirm:  
  1.1. Sen’s paradox arises from two minimal conditions:  
  - **Minimal liberalism (L)**: At least two individuals each possess decisiveness over one pair of alternatives (e.g., individual A is decisive for alternatives {x, y}; B for {z, w}).  
  - **Weak Pareto (P)**: If all individuals prefer alternative X to Y, society must prefer X to Y.  
  1.2. The two-person, two-option proof (e.g., Sen’s "prude and lewd" case) demonstrates a formal impossibility: L and P jointly entail no social welfare function can satisfy both for all preference profiles.  
  1.3. The "prude and lewd" case illustrates the tension:  
  - Prude (decisive over his own reading) prefers no one reads the book.  
  - Lewd (decisive over her own reading) prefers both read it.  
  - Pareto principle conflicts with liberalism when both prefer "only lewd reads" to "only prude reads," yet liberalism forces "only prude reads."  
  1.4. Neither camp denies that individual welfare matters. Both recognize Pareto efficiency as normatively significant when applied consistently.  

  ---

  ### 2. Precise Disagreement  
  - **Lexical Liberal (LL)**: "The contradiction proves rights must be lexically ordered but confined to *contextually bounded spheres* (local liberalism). Rights are absolute within their domain (e.g., personal choices) but do not apply universally, resolving the paradox by restricting L’s scope."  
  - **Preference-Reconstructionist (PR)**: "The contradiction dissolves once preferences are *reconstructed to include second-order procedural commitments*. Individuals’ preferences about decision-making processes (e.g., respecting rights) are incorporated, ensuring L and P coexist without domain restrictions."  

  ---

  ### 3. Cruxes, Cases, and Predictions  
  **Crux (a):** *Should a preference that another lacks a liberal right enter the social profile?*  
  - **Agreed Case**: A prefers B not have the right to choose B’s diet (e.g., A wants B barred from sugary foods). B insists on having this right.  
    - **LL Prediction**: A’s preference about B’s right is excluded from the profile. The diet choice belongs to B’s personal sphere; thus, B’s choice prevails without violating P.  
    - **PR Prediction**: A’s preference is included as a first-order preference but offset by B’s second-order commitment to self-determination. The reconstructed profile shows no Pareto conflict, preserving B’s right.  

  **Crux (b):** *Can nested decision spheres avoid collapsing into majoritarianism?*  
  - **Agreed Case**: Municipal zoning dispute where:  
    - *Personal sphere*: Homeowner’s right to paint their house purple.  
    - *Communal sphere*: Neighborhood council’s majority vote for beige-only.  
    - *Institutional sphere*: City government imposes uniform zoning.  
  - **LL Prediction**: Spheres are formally definable (e.g., "personal aesthetics" is personal). Homeowner’s lexical priority prevents majoritarian override; purple prevails.  
  - **PR Prediction**: Without reconstructed preferences, spheres are arbitrary. Majoritarianism arises when higher spheres (e.g., communal) override personal choices unless procedural commitments constrain them (e.g., neighbors’ second-order respect for personal autonomy).  

  ---

  ### 4. Disagreements Table  
  | **Position** | **Resolution of Paradox** | **Crux (a) Treatment** | **Crux (b) Outcome** | **Agreed Test Case** | **Explicit Prediction** |  
  |--------------|---------------------------|------------------------|----------------------|-----------------------|-------------------------|  
  | **Lexical Liberal** | Sphere-restricted lexical rights | Exclude A’s preference about B’s right | Nested spheres avoid majoritarianism | Diet choice by B | B’s choice prevails; no Pareto violation |  
  | **Preference-Reconstructionist** | Reconstructed preferences dissolve contradiction | Include A’s preference but enrich with procedural commitments | Spheres collapse without procedural commitments | Zoning dispute | Homeowner’s preference honored only with second-order commitments |  

  ---

  ### 5. Verbal Disagreement Assessment  
  We agree the dispute is primarily substantive but note a minor verbal element:  
  - **"Liberalism"** denotes distinct concepts:  
    - LL defines it as *decisiveness within formal spheres* (emphasizing jurisdictional boundaries).  
    - PR defines it as *respecting preferences that include procedural commitments* (emphasizing preference structure).  
  The core divergence lies in mechanism (sphere restriction vs. preference enrichment), not the term’s core ideal (individual autonomy). Thus, the disagreement is largely non-verbal.  

