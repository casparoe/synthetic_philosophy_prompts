answer: |-
  ## The Epistemic Failure of Intractable Normative Prescriptions

  The core argument centers on the distinction between a normative theory being *correct* (in its abstract formulation) and being *explicitly accessible* to the rational agents it purports to guide. Computational intractability, specifically NP-hardness, undermines the latter, constituting an epistemic failure:

  1.  **The Nature of Normative Guidance:** A normative theory aims not merely to *describe* ideal outcomes but to *prescribe* actions to agents based on reasons. For a prescription to genuinely guide an agent, the agent must, in principle, be able to:
      *   **Understand** the justification for the prescription relative to the theory's core principles.
      *   **Verify** that a proposed action (or outcome) indeed satisfies the theory's requirements.
      *   **Endorse** the prescription based on this understanding and verification, seeing it as a rational consequence of the theory they accept.
      Intractability directly attacks these capacities.

  2.  **NP-Hardness as Epistemic Barrier:** NP-hardness (e.g., in optimal consensus ranking like Kemeny-Young) means:
      *   **Verification Impotence:** While verifying a *candidate solution* might be tractable (NP-completeness implies this), *finding* the guaranteed optimal solution requires, for all known methods and under standard complexity assumptions, computational resources that grow exponentially with problem size (e.g., number of voters/alternatives) in the worst case.
      *   **In-Principle Inaccessibility:** This isn't a limitation of current technology or effort; it's a fundamental property of the problem. For even moderately complex real-world scenarios (e.g., aggregating hundreds of preferences), the optimal solution is computationally inaccessible *in principle* within any feasible timeframe, even for idealized agents with vast resources. No finite agent can reliably compute it.

  3.  **Epistemic Failure Defined:** This intractability leads to epistemic failure:
      *   **Justification Gap:** Agents *cannot know* what the theory's specific prescription *is* for their situation. The "optimal" ranking remains hidden. How can an agent endorse or be guided by a specific output they cannot access or confirm?
      *   **Understanding Gap:** The theory cannot provide agents with a *comprehensible path* from their inputs (preferences, constraints) to its prescribed output. The computational black box obscures the reasoning connecting principles to prescription. Agents are told "do X because it's optimal," but they can never confirm X's optimality nor understand *why* it is optimal in their specific case beyond the abstract definition.
      *   **Rational Endorsement Impossibility:** Genuine endorsement requires believing the prescription is correct *for reasons*. Intractability prevents agents from acquiring the necessary epistemic warrant for this belief regarding the specific output. They must accept the prescription on *faith* in the computational oracle (which doesn't exist), not on reasoned justification accessible to them.

  **Contrast with Demandingness Objections:**

  The familiar demandingness objection against theories like consequentialism focuses on *motivational or psychological burden*. It argues that requiring agents to constantly calculate complex consequences (e.g., maximizing global utility) is:
  *   **Psychologically unrealistic:** It overtaxes human cognitive and emotional capacities.
  *   **Motivationally excessive:** It demands supererogatory levels of self-sacrifice or effort.
  *   **Potentially self-defeating:** The stress of constant calculation might hinder achieving the good.

  **Key Difference:** Demandingness objections grant that the agent *could*, in principle (perhaps with superhuman effort or detachment), *know* and *understand* the required action (e.g., "Give all your money to the most effective charity"). The objection is to the *cost* of knowing and acting on it. Intractability, however, attacks the *possibility* of knowing and understanding the specific, exact prescription *at all*, even for an ideally rational, perfectly motivated agent with vast (but finite) resources. The failure is not about the *cost* of access, but about the *impossibility* of access and the consequent *lack of justification* for belief in the specific output.

  **The Approximation Counter-Argument and Its Epistemic Shortfall:**

  The counter-argument suggests that polynomial-time approximation schemes (PTAS) or heuristics (like MCMC sampling) salvage the theory by providing "good enough" solutions tractably.

  *   **Why it Misses the Epistemic Point:**
      *   **The Normative Commitment to Exactness:** Normative theories requiring *optimality* (like Kemeny-Young defining the "best" consensus ranking) are fundamentally committed to the *exact* solution as the prescription. An approximation, no matter how good, is *not* what the theory prescribes. Prescribing an approximation is adopting a *different normative rule* ("maximize expected approximate optimality" or "satisfice").
      *   **The Verification Problem Persists:** How does the agent *know* the approximation is sufficiently good? Verifying the *quality* of an approximation relative to the inaccessible optimum is often as hard as finding the optimum itself (or undecidable). The agent still lacks justification for believing *this specific approximate output* is the one they ought to follow according to the *original* theory demanding optimality. They might know it's *likely* good, but not that it satisfies the stated obligation.
      *   **Opaque Justification:** Approximation algorithms typically work via complex, problem-specific heuristics or stochastic sampling. While they may produce good results, the *reasons why a specific approximate output was chosen* are often buried in the algorithmic process (e.g., random walk paths in MCMC) and are disconnected from the normative principles that justified seeking the optimum in the first place. The agent cannot trace the justification from principles to this specific approximate prescription. The epistemic link between the theory's foundational rationale and the delivered prescription is severed or obscured.
      *   **Loss of Guidance:** The agent is not guided by the normative principle ("seek the optimal ranking") but by an algorithmic artifact ("run this sampler and use its output"). The theory fails to provide explicit, reason-based guidance; it delegates to a computational procedure whose internal logic may be alien to the normative reasoning the agent is supposed to engage with.

  **Conclusion:**

  Computational intractability, exemplified by the NP-hardness of exact aggregation rules, represents a fundamental *epistemic* failure for normative theories demanding such computations. It renders the theory's specific prescriptions *inaccessible* and *unverifiable* for finite agents facing non-trivial problems. Consequently, agents lack the epistemic justification necessary to understand, verify, and rationally endorse the specific outputs the theory generates, even if they accept the theory's abstract principles. This failure is distinct from demandingness objections, which target the cost of acting on known prescriptions. Approximation schemes, while practically valuable, fail to resolve this epistemic crisis because they abandon the exact normative commitment, leave agents unable to verify their success relative to the original obligation, and obscure the justificatory pathway from principles to prescription, substituting algorithmic output for reasoned normative guidance. The theory becomes explanatorily inaccessible to the very agents it seeks to bind.
