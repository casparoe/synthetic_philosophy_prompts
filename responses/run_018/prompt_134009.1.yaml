answer: |-
  Here is a comprehensive adequacy specification for theories of special composition, structured around desiderata, their motivations, and status, followed by a brief indicative assessment of representative theories. The emphasis is firmly on the criteria themselves.

  **Adequacy Specification for Theories of Special Composition**

  **I. Empirical Coverage: Cases Requiring Correct Classification**
  1.  **Everyday Artefacts (e.g., tables, chairs):**
      *   **Motivation:** Any credible theory must align with our core, pre-theoretical intuitions about the existence of ordinary composite objects. Denying these seems deeply counterintuitive and pragmatically disastrous.
      *   **Status:** **Non-negotiable.** Failure here renders a theory radically revisionary and likely inadequate as a general account.
  2.  **Organisms Post-Complete Cellular Turnover (e.g., a human after 7-10 years):**
      *   **Motivation:** Living organisms persist despite the complete replacement of their material parts over time. A theory must explain why the entity before and after turnover is the *same composite whole*, not just successive collections of atoms.
      *   **Status:** **Non-negotiable (for theories acknowledging organisms as composites).** Directly challenges mereological essentialism and strict identity conditions tied solely to original parts.
  3.  **Quantum-Entangled Pairs (e.g., electrons with correlated spins):**
      *   **Motivation:** Quantum entanglement presents a fundamental physical connection without classical spatial contiguity or traditional causal interaction. Does this non-separability constitute a novel form of composition, or is it merely a relation between distinct simples? A theory must take a stance compatible with the physics.
      *   **Status:** **Highly Desirable (Non-negotiable to be *compatible* with physics).** While classifying entangled pairs *as* composites may be camp-specific, the theory's verdict must not *contradict* the established phenomena of entanglement.
  4.  **Functional Aggregates / Synthetic Biology Consortia (e.g., engineered bacterial communities displaying collective behaviour while retaining independent metabolism):**
      *   **Motivation:** These challenge traditional boundaries. They exhibit coordinated, system-level functions (like collective toxin degradation) emerging from interacting parts with significant independence (individual metabolism, reproduction). Does this functional integration suffice for composition, even without tight physical bonding or central control? Tests theories relying solely on spatial proximity or strong causal unity.
      *   **Status:** **Crucial Test Case / Desirable.** Highlights the tension between metabolic independence and behavioural unity. Resolving such "grey area" biological systems is vital for a theory aiming at biological realism, though specific classification might be camp-influenced.

  **II. Conceptual Distinctions: Must Be Preserved or Explained**
  5.  **Composite Object vs. Mere Collection:**
      *   **Motivation:** There seems a fundamental difference between a unified entity (a cat) and a random assortment of things (the contents of a bin bag). An adequate theory must ground this difference – what *unifies* parts into a whole beyond just co-location or enumeration?
      *   **Status:** **Non-negotiable core task.** Failure here dissolves the very phenomenon the theory seeks to explain.
  6.  **Temporary Parts vs. Essential Parts:**
      *   **Motivation:** Many objects can gain or lose parts without ceasing to exist (a ship replacing planks, a body shedding cells), yet seem to have some core identity conditions. A theory should accommodate this modal flexibility while potentially explaining cases where *certain* parts (e.g., an organism's heart?) seem essential.
      *   **Status:** **Highly Desirable / Contextually Non-negotiable.** Essentialism about *all* parts is implausible for persisting objects. Accommodating temporary parts is crucial; specific essential part claims may be camp-specific or context-dependent.
  7.  **Being Composed *of* Parts vs. Being a Part *of* a Larger System:**
      *   **Motivation:** Composition is not simply the inverse relation of parthood. A cell is composed of molecules but is also a part of a tissue. A theory must be consistent across scales and avoid circularity, clearly differentiating the conditions for *forming* a whole from the conditions for *being included within* a whole.
      *   **Status:** **Non-negotiable (Logical Coherence).** Necessary to avoid conceptual confusion and ensure the theory applies consistently within mereological hierarchies.

  **III. Scientific Compatibility: Constraints from Physics and Biology**
  8.  **Compatibility with Fundamental Physics (e.g., Quantum Mechanics, Relativity):**
      *   **Motivation:** Metaphysical theories shouldn't contradict well-established scientific frameworks. Quantum non-locality, indeterminacy, and relativistic spacetime structure must be compatible with (or inform) the account of how parts relate to form wholes. Ignoring physics risks irrelevance.
      *   **Status:** **Non-negotiable.** The theory cannot require mechanisms or principles demonstrably false according to current physics.
  9.  **Compatibility with Biological Ontology (e.g., Processual nature, Autopoiesis, Symbiosis):**
      *   **Motivation:** Biology treats organisms not as static collections but as dynamic, self-maintaining processes. Theories relying solely on static spatial arrangements or classical causal interactions may fail to capture the essence of living wholes. Must accommodate symbiosis and multi-level selection.
      *   **Status:** **Highly Desirable / Non-negotiable for biologically adequate theories.** A general theory of composition must at least not *contradict* biological understanding; a theory aiming for biological realism must *engage* with it deeply.

  **IV. Meta-Requirements & Potential Tensions**
  10. **Clarity & Precision:**
      *   **Motivation:** The proposed conditions for composition must be sufficiently clear and precise to allow determinate application to novel or borderline cases.
      *   **Status:** **Non-negotiable.** Vague criteria render the theory untestable and uninformative.
  11. **Explanatory Power:**
      *   **Motivation:** The theory should not merely classify cases but provide a *reason* why composition occurs under those conditions, illuminating the underlying nature of parthood and wholes.
      *   **Status:** **Highly Desirable.** Distinguishes deeper metaphysical accounts from mere descriptive lists.
  12. **Intuitive Plausibility (within reason):**
      *   **Motivation:** While revisionism is sometimes necessary, excessive counterintuitiveness (e.g., denying all tables exist) is a significant cost requiring strong justification.
      *   **Status:** **Contextual / Camp-specific.** Weight given to pre-theoretic intuition varies significantly between camps (e.g., common-sense realism vs. ontological parsimony advocates).

  **Potential Jointly Unsatisfiable Pairs:**
  *   **Maximal Intuitive Plausibility (Artefacts & Organisms) + Radical Ontological Parsimony:** Satisfying strong intuitions about everyday composites and organisms typically requires admitting numerous composite entities, conflicting with the nihilist or extreme mereological universalist desire for maximal simplicity at the fundamental level.
  *   **Strict Spatial Contiguity Requirement + Accommodating Quantum Entanglement:** If composition *requires* spatio-temporal contiguity or contact as traditionally understood, it becomes difficult or impossible to classify entangled pairs as composites without stretching the concept beyond recognition, given their non-local correlations.
  *   **Strong Causal Unity Requirement + Accommodating Functional Aggregates/Synthetic Consortia:** Defining composition via very tight causal interdependence (e.g., every part directly causally interacts with every other) may exclude functional aggregates where parts (individual microbes) retain significant causal independence despite collective behaviour.

  **Brief Indicative Assessment Against Criteria (Emphasis on Criteria):**

  *   **Unrestricted Composition (Universal Mereology):** Easily satisfies (1) Artefacts and arguably (3) Entangled Pairs (by making *everything* a composite). Fails utterly at preserving (5) Composite vs. Mere Collection and struggles with (6) Temporary/Essential Parts (everything is essential if identity is mereological). Compatible with physics only by trivialisation; ignores biological processual nature. Scores poorly on (10) Clarity *about what makes a whole* and (11) Explanatory Power. Radically violates (12) Intuitive Plausibility regarding mere collections.
  *   **Compositional Nihilism (No Composite Objects):** Maximises ontological parsimony but catastrophically fails (1) Artefacts and (2) Organisms (denying they are composites), rendering it deeply counterintuitive. May handle (3) Entangled Pairs as relations between simples. Fails the core task (5) by denying composites exist. Compatible with physics only by reducing everything to simples. Biologically untenable. Fails to satisfy the most non-negotiable empirical coverage.
  *   **Restricted Biological View (e.g., Composition via Self-Maintaining Processes):** Strong on (2) Organisms and potentially (4) Synthetic Consortia (if functional integration suffices), and deeply compatible with (9) Biological Ontology. May struggle with (1) Artefacts (are they sufficiently processual?). Unclear on (3) Entangled Pairs (lack biological function/self-maintenance). Clearly preserves (5) Composite vs. Collection via functional unity. Handles (6) Temporary Parts well. May face challenges defining processes precisely enough (10) and explaining non-biological composites (11). Demonstrates how prioritising biological desiderata shapes the theory.

  This framework highlights that the adequacy of any theory hinges on how it navigates these diverse, sometimes conflicting, demands – particularly the non-negotiable constraints of empirical coverage (especially artefacts and organisms), conceptual coherence, and scientific compatibility. The tensions between desiderata reveal the inherent theoretical trade-offs in this domain.
