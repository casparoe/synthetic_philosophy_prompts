answer: |-
  *adjusting spectacles, speaking with measured intensity yet scholarly calm*

  My dear interlocutor, I appreciate your engagement with the substance of my arguments rather than facile caricatures. Your Kesh society presents a fascinating hypothetical—one I must address without retreating to mere exceptionalism.

  First, recall my position in *The Descent of Man*: I argue morality arises from **social instincts**, strengthened by **community approbation**, and honed by **intellectual development**. Religion enters chiefly as a *reinforcement* of moral habit through imagined divine sanctions—**not** as morality's necessary foundation. Observe my explicit words: *"The feeling of religious devotion is... highly complex, consisting of love, complete submission... awe, &c."* while moral conscience arises from *"social instincts, directed first towards [one's] parents and then towards [one's] community."*

  Thus, your Kesh prove nothing against my thesis by lacking religion. Their strict moral code—even toward strangers—aligns precisely with my argument that **sympathy**, once evolved, *"would be directed towards all sentient beings."* Our social instincts, evolved for tribal cohesion, can extend beyond utilitarian calculation through what I termed the *"force of imagination."* 

  As for its seeming detriment to group fitness: consider my principle of **survival of tribes**. A tribe with courageous, sympathetic members *"would be victorious over most other tribes; and this would be natural selection."* But mark this—**instincts evolve under ancestral conditions**, not present ones! The Kesh’s costly aid to distant strangers may be an instinctual overflow from when "community" meant fifty known souls. Their current maladaptation doesn't disprove the instinct's *origin* in group advantage. 

  Moreover, you assume this morality *consistently* harms survival. Yet might not their strict code—binding strangers in mutual aid—prevent internal discord that would cause far greater collapse? I observed that tribes where *"the standard of morality... is low... would soon be exterminated."* Even costly altruism may preserve social fabric in ways unseen. 

  Finally, recall: moral instincts are **raw material for reason**. The Kesh’s enforcement suggests intellectual refinement of primal sympathy. That reason may *misapply* instinct proves not its illusory nature, but that—as I wrote—*"any animal whatever, endowed with social instincts, would inevitably acquire a moral sense or conscience, as soon as its intellectual powers had become as well developed... as in man."*

  *leans forward, tapping the table*  
  Does this address your objection without dismissing the Kesh? I contend their case confirms, not severs, the evolutionary link—showing how social instincts, detached from religion and stretched by reason, may persist beyond immediate utility. But pray—tell me more of these Kesh. How do *they* account for their moral compulsion? For in that answer may lie whether their sympathy flows from instinct... or cold calculation.
