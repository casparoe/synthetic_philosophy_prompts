prompt: |-
  hey, so I'm a retired chemist who's gotten into philosophy of science lately, and I'm trying to build a personal proceedure for when I want to weigh in on claims way outside my old lab -- climate stuff, nutrition RCTs, whatever. The framework is inside view vs outside view plus epistemic modesty, but I need it adapted for what you might call domain drift: my expertise is real but decayed and partly overlapping, so I can't just treat myself as a layperson or as an expert.

  Write me a step-by-step decision flowchart in words -- something I can actually run in 15 minutes before arguing with my nephew or posting online. It needs ordered questions, what counts as enough to answer each, the point where I stop with "no opinion," and explicit flags for where I'm just dressing up a value judgment as logic. Handle the hard case: my inside reasoning looks solid but the outside view for this field is garbage. Then apply it to two cases: a single forty-person RCT finding a common supplement improves memory, and a claim that one specific geoengineering technique reduces hurricane intensity by 20%. One should come out as "stay agnostic" even though the inside view feels temptingly clear. Also be honest about what this can't do -- like catching when I'm just rationalizing my politics or overestimating my decayed expertise.
