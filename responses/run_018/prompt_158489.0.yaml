  Honesty is key. I must highlight where steps are judgment calls, like in evaluation when balancing competing values. The procedure can't solve fundamental disagreements; it just makes them explicit. For example, if exclusion in the prefect system is seen as unacceptable by some but necessary by others, the procedure forces discussion but not resolution. The user needs to know its limits to avoid false expectations.

