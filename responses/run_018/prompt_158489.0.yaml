  The checklist needs to work in a 20-minute meeting. That means each step must be time-efficient. I'll outline the phases: Proposal, Trial Design, Data Collection, Evaluation, and Decision. For each step, I'll include questions to ask, what counts as sufficient data, and how to handle facts vs. values. The reversibility check is important—they don't want to lock future students into bad rules. I should emphasize that some steps are judgment calls, like interpreting data or balancing values, and admit where it's subjective.

