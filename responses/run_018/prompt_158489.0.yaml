  Next, redesigning lunch menus every term. The trial involves rotating student teams designing menus. Data collection includes participation, waste, and satisfaction. But here, the values clash: efficiency vs. student empowerment. The procedure might show that while waste increases, engagement is high, so they keep it but add guidelines. Reversibility isn't an issue since it's term-based.

