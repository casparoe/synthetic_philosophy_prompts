answer: |-
  Here’s your Q&A prep sheet, structured for maximum impact with this interdisciplinary audience. The objections are ordered by combined likelihood (metaphysicians first) and potential damage (policy impracticality > ableism concerns > metaphysical coherence).

  ---

  ### **Opening Concessions** (State upfront to build goodwill)
  1. **"My framework does not resolve *all* nonidentity cases—only those involving structural harms with traceable institutional causation (e.g., climate, intergenerational debt)."**  
  2. **"I accept that metaphysicians like Parfit may be technically correct that *numerical identity* blocks traditional harm claims—this is why I shift focus to *social roles*."**  
  3. **"No baseline is neutral; my welfare-relevant trajectories must be co-developed with disability scholars to avoid ableist assumptions."**  

  ---

  ### **The Six Objections & Replies**  
  *(Ordered: 1=Most Likely/Damaging, 6=Least)*  

  1. **Objection (Metaphysicians: Modal Realism / 4D-ism)**  
     *Phrasing:* "Your 'feasible baseline trajectory' requires comparing actual futures to metaphysically indeterminate counterfactuals. But if 4Dism is true, alternative social trajectories are merely possible worlds with no causal connection to actual roles—making 'degradation' incoherent."  
     **Reply (2 min):** "Policy operates in the *actual* world’s institutional continuity. We benchmark trajectories against *historically feasible* alternatives (e.g., IPCC scenarios from 1990). Degradation is measured by institutional betrayal—e.g., today’s climate inaction violates the *actual* trajectory of scientific consensus and democratic promises made since the 1980s. This doesn’t require possible-worlds realism, only *actual* social commitments."  
     **Soft Spot:** Doesn’t fully resolve how roles persist across radically different counterfactual populations.  

  2. **Objection (Environmental Ethicists: Policy Actionability)**  
     *Phrasing:* "Without a numerical identity condition, policymakers lack a *decision rule*. How do we quantify ‘narrative degradation’ or compare trajectories? This feels unworkable for setting carbon budgets."  
     **Reply (2 min):** "We already use trajectory-based frameworks! The UN Sustainable Development Goals measure progress against *collective* benchmarks (e.g., ‘no poverty’) without tracking individual identities. For climate, we assess harm via deviation from a scientifically/ethically-justified baseline (e.g., 1.5°C pathway). The ‘degradation’ is the welfare gap between that baseline and our path—calculated via standard welfare metrics like life expectancy, adjusted for disability justice."  
     **Soft Spot:** Requires value-laden baseline selection—I’ll defend this explicitly later.  

  3. **Objection (Disability Scholar: Ableist Baselines)**  
     *Phrasing:* "‘Welfare-relevant trajectory’ implies an able-bodied norm. My flourishing life with Down syndrome may be *invisible* in your baseline—e.g., if you prioritize IQ-linked metrics. Isn’t this eugenics by stealth?"  
     **Reply (2 min):** "Agreed—this is why baselines must use *capability metrics* co-defined with disabled communities (e.g., access to care, community inclusion). Crucially, my framework condemns *deprivation of necessary supports*, not existence with disability. Climate inaction wrongs future disabled people by degrading healthcare infrastructure or respite-cooling access they *would have had* under a just trajectory."  
     **Soft Spot:** Risk of underestimating adaptive flourishing in non-normative futures.  

  4. **Objection (Metaphysicians: Moral Status of Possible People)**  
     *Phrasing:* "If future people in the degraded trajectory *couldn’t exist* in the better baseline (per nonidentity), how are they ‘wronged’? They’re not ‘deprived’ of anything—they owe their existence to the policy!"  
     **Reply (2 min):** "They’re wronged not via personal deprivation but via *social dispossession*. Example: A child born in a climate-slum inherits a role as ‘citizen’—but the state’s inaction degrades that role’s core welfare guarantees (clean water, stability). The wrong is institutional: we violated duties to *whoever occupied* that role, even if their individual existence required our failure."  
     **Soft Spot:** Still anthropomorphizes "roles" as moral patients.  

  5. **Objection (Metaphysicians: Vagueness of "Narrative Roles")**  
     *Phrasing:* "Social ‘roles’ are vague, eliminable, or reducible to individual constituents. If roles supervene on individuals, and individuals change, how can ‘role degradation’ be real harm?"  
     **Reply (2 min):** "Roles are *materially anchored* in institutions. Consider ‘coastal resident’: its welfare conditions (storm defenses, property rights) are defined by law and infrastructure. When sea-level rises *faster than adaptation plans promised*, everyone in that role—regardless of identity—inherits a degraded version. Harm tracks institutional betrayal, not personhood."  
     **Soft Spot:** Struggles with radically novel roles (e.g., ‘climate refugee’).  

  6. **Objection (Environmental Ethicists: Overdemandingness)**  
     *Phrasing:* "Doesn’t this make *any* policy change wrongful? If I build a wind farm, changing local jobs, haven’t I ‘degraded’ the ‘fossil-fuel worker’ trajectory?"  
     **Reply (2 min):** "No—harm requires *deprivation against a feasible just baseline*. Just transitions are part of that baseline! The wrong in climate inaction is failing to *deliver the transition we institutionally committed to*. Wind farms that retrain workers *align* with the trajectory; delaying decarbonization degrades it."  
     **Soft Spot:** "Feasible just baseline" is contestable.  

  ---

  ### **Strategic Defense Plan**  
  - **Weakest Point in Your Position: Defining the "Feasible Just Baseline"**  
    *Why defend it?* Policy ethicists will pounce; metaphysicians will call it arbitrary.  
    *Defense:* "Baselines aren’t metaphysical—they’re *democratically anchored* (e.g., Paris Agreement), *scientifically modeled* (IPCC), and *retrospectively adjustable*. We accept this in human rights law: ‘progressive realization’ benchmarks state duties, even when beneficiaries change."  

  - **The Objection You Hope Nobody Raises**  
    *Phrasing:* "Your framework requires comparing *actual* and *counterfactual* social trajectories. But if, as modal realists argue, counterfactuals are *literally real but causally isolated*, how can we ground duties to actual people? Aren’t you smuggling in ‘trans-world’ harm?"  
    *Why it’s deadly:* Forces you to admit trajectories aren’t metaphysically well-defined.  
    *Reply if pressed:* "I avoid metaphysical commitments by focusing on *actual institutional intentions*. When governments ratify climate treaties, they *create* a fiduciary duty to future role-occupiers. The ‘baseline’ is the trajectory they *promised*—not a parallel world. Degradation is a breach of that actual duty."  
    **Soft Spot:** Implies promises bind metaphysically, not just legally.  

  ---

  ### **Delivery Notes**  
  - **To Metaphysicians:** Emphasize "I agree your critique is valid, but policy needs actionable wrongfulness."  
  - **To Policy Ethicists:** Hammer the SDG/Paris Agreement parallels—this is *already their framework*.  
  - **To Disability Scholar:** Defer early ("I need your input on baselines") and cite Elizabeth Barnes on disability flourishing.  

  This prep turns weaknesses into interdisciplinary bridges—your "soft spots" are where you invite collaboration. Good luck!
