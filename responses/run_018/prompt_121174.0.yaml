  I work on the modeling side of a small recommender-systems team, and by now my native vocabulary is basically compression: description length, arithmetic coding, priors over model classes, Bayes factors, MDL used as a regularizer, overfitting, the bias–variance thing, and the fact that a model that predicts well compresses well. I'm comfortable in all of that; I'm not comfortable in philosophy. I keep running into people online saying Occam's razor is either obviously right or completely ungrounded, and then someone gestures at Solomonoff induction as if that settles it, and I can't tell what claim is actually on the table.

