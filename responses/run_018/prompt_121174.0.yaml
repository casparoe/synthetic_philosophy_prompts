ry is genuinely missing (a real notion of truth, or of explanation, or of justification that isn't just expected utility) or to the philosophers having been arguing about something thinner than it sounds. Don't point me at papers or readings; I have no library access and I want it in my own words anyway. Write it as continuous prose, like an email from a colleague who knows both sides — no headings, no bullet points, no bold text, no tables. And American English, please.
