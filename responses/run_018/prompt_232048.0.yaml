  - **Accuracy**: Uses Lewis' distinction between "local" (personal capacity/opportunity) and "global" (historical consistency) possibility. The refrains encode these concepts verbatim.
  - **Narrative Arc**: Moves from tension (stanzas 1-3) to conceptual resolution (stanza 5) to paradoxical coexistence (final stanza).
  - **British English**: "toward" (not "towards"), "missed its mark" (idiom), "rue" (archaic but regionally resonant).
  - **Thematic Layers**: 
    - *Family*: "father one more son" (line 1) grounds abstraction in generational bonds.  
    - *Inevitability*: "however I might rue" (line 11) + "what time won't undo" (line 14).  
    - *Choice*: "finger's twitch" (line 8) vs. "shot rings true?" (line 18) interrogates agency.

  The final stanza's refrains are deliberately left unreconciled—the question mark in line 18 invites readers to hold both truths simultaneously, mirroring Lewis' "cheap" vs. "subtle" paradox distinction.
