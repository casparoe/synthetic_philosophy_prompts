  We can have a proposition H (for "hidden") that is not an axiom and not derivable without M. But we set up the rules so that:

  - There is a proposition R such that R is derivable without M (from the axioms and rules) and R is: "If M is true, then H is true."

  But note: without M, we cannot get H. However, once M is adopted, then:

  Step 1: We have R (which is "M -> H") as already derived (without M).
  Step 2: We adopt M (by vote). Now M is true (by assumption).
  Step 3: From R and M, by MP, we derive H.

  But H is designed to conflict with a private belief (of at least one node). For example, one node has a private belief card: "not H".

