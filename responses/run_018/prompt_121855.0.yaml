  First, I need to unpack the quote: "Justice without force is powerless; force without justice is tyrannical." The user wants a conceptual map of possible claims this could make—whether it's about definitions, human nature, institutional design, or divine law. They also need to know which interpretations are tautologies, which are controversial, and what Pascal likely meant given his Jansenist background. Plus, their roommate used it to argue that non-coercive moral systems are invalid, so I should address which reading supports that.

  Starting with the possible claims. The quote can be broken down into two halves. The first part, justice without force is powerless, suggests that justice needs enforcement. The second part, force without justice is tyranny, implies that force must be legitimized. These can be interpreted in several ways: as conceptual truths, empirical observations about human behavior, normative statements about how institutions should be designed, or theological distinctions between divine and human justice.

  Considering Pascal's context is important. He was a Jansenist, which emphasized original sin and the fallen state of humanity. So his view likely leans towards a pessimistic realism about human nature, seeing coercion as necessary in a corrupted world. This contrasts with more idealistic views that might separate charity and force.

