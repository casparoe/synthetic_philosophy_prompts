  hey, i'm doing a-level philosophy and i'm stuck on frankfurt cases. the example with black and jones — my teacher said it shows moral responsability doesn't need the principle of alternative possibilties, cos jones decides himself even though black would've forced him. but i was thinking, doesn't jones still have a flicker of freedom at the moment before he acts? like, he could have formed a different second-order volition right up to the wire, so there's still an alternative possibility, just at the hierachical level. so hasn't frankfurt just moved PAP up a level rather than killed it? and if sourcehood is what matters, not leeway, then isn't PAP actually about the wrong thing from the start? sorry if i'm muddling things, there's probably a typo in there lol. cheers
