     (D) generate novel predictions (progressive problem-shift), or  
     (E) allow ad hoc modifications if they preserve overall explanatory coherence?*  
     - **D** (Novel predictions required) → Proceed to Dimension 3.  
     - **E** (Ad hoc coherence permitted) → Proceed to Dimension 3.  

  4. **Dimension 3 (Meta-methodological status of evaluation)**:  
