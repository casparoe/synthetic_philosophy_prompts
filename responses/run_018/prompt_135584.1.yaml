prompt: |-
  I'm on the advisory board for our city's participatory climate budget and we're deadlocked on who actually belongs in the demos for this vote. The flood-infrastructure plan covers three neighboring townships plus our downtown, but right now only people with city residency can vote. Half the board wants to open it to anyone in the affected watershed (the all-affected-interests line), half thinks thats just dissolving democratic accountability into a vague stakeholder soup. There's also this weird middle idea where non-resident workers get weighted proxy votes through their employers, which smells like corporate personhood sneaking in the back door.

  Draft the memo I'd circulate before tuesdays meeting: recommend one concrete membership rule with a timeline, and take the all-affected argument seriously rather than dismissing it. The dissenters should be able to actually respond to your reasoning — no legal boilerplate. Then after the memo, give me a structured summary in this exact JSON:

  {
    "recommended_criterion": "string describing who gets the vote",
    "implementation_timeline": "string with phases or deadlines",
    "strongest_opposing_view_engaged": "string",
    "concession_made_to_opponents": "string",
    "risk_that_demos_loses_coherence": "low | medium | high"
  }

  Keep it tight — this is for a dataset prompt, not a dissertation.
reasoning: |-
  We are recommending a membership rule that balances the "all-affected" principle with democratic accountability. 
   The proposal: Extend voting rights to residents of the three neighboring townships (in addition to city residents) for this specific climate budget vote, as they are directly affected by the flood-infrastructure plan. 
   Why? They experience flood risks and their environment is directly impacted. This avoids the "stakeholder soup" by keeping it to geographic residency in clearly affected municipalities, while acknowledging that watershed boundaries don't neatly align with city limits.

   We do NOT recommend including non-resident workers via corporate proxies (due to concerns about corporate influence) nor opening it to the entire watershed (which could include distant areas with minimal direct impact).

   Timeline: 
   - Phase 1 (By next meeting): Draft voter eligibility criteria based on township residency, verified through existing municipal records. 
   - Phase 2 (3 weeks): Collaborate with township administrations to verify shared voter rolls. 
   - Phase 3 (6 weeks): Finalize registration process for township residents (mail-in/online registration open for 4 weeks). 
   - Phase 4 (Week 11): Voting period opens for 2 weeks.

   We take the all-affected argument seriously: Yes, the watershed defines the ecological system, but democratic processes require bounded membership for practical and accountable governance. Our compromise includes those municipalities whose residents face direct, tangible flood risks and infrastructure impacts.

   Strongest opposing view engaged: The concern that expanding beyond city residents dissolves democratic accountability by including non-taxpayers who don't bear the same fiscal burdens.

   Concession made: To address accountability concerns, we propose that future funding agreements between the city and townships formalize cost-sharing for maintenance, ensuring that voting rights align with fiscal responsibilities in the long term. For this vote, the decision is advisory, with implementation dependent on inter-municipal agreements.

   Risk that demos loses coherence: Medium (because we are expanding beyond city limits but keeping it to adjacent municipalities with clear shared risks, avoiding the less defined "watershed" scope).

   Now, the memo and then the JSON.
answer: |-
  ### MEMORANDUM  
  **To:** Advisory Board Members  
  **From:** [Your Name], Advisory Board Member  
  **Date:** October 26, 2023  
  **Subject:** Recommended Voter Eligibility for Climate Budget Vote  

  We face a critical impasse on defining the *demos* for our participatory climate budget vote. After thorough deliberation, I propose the following compromise, which respects the "all-affected" principle while preserving democratic accountability:  

  #### Recommendation  
  **Extend voting rights to residents of the three neighboring townships** in addition to city residents. This aligns with watershed impact zones while maintaining residency-based accountability. Non-resident workers and broader watershed populations (e.g., upstream rural areas) would **not** be included.  

  #### Why This Balances "All-Affected" and Accountability  
  1. **Direct Impact Focus**: The townships experience identical flood risks to downtown (e.g., shared river basins, infrastructure interdependence). Their exclusion undermines the "all-affected" ethos.  
  2. **Administrative Feasibility**: Residency can be verified through existing municipal rolls, avoiding nebulous "stakeholder" definitions.  
  3. **Avoiding Corporate Capture**: Rejecting employer-based proxies prevents undue corporate influence.  
  4. **Bounded Coherence**: Limiting expansion to adjacent townships—not the entire watershed—preserves a geographically coherent community with shared stakes.  

  #### Implementation Timeline  
  - **Phase 1 (By Nov 30)**: Formalize inter-municipal agreements with townships for voter roll sharing.  
  - **Phase 2 (Dec 1–Dec 20)**: Registration portal opens; township residents added via verified addresses.  
  - **Phase 3 (Jan 5–Jan 19, 2024)**: Voting period.  

  #### Engaging the Opposition  
  The strongest dissent argues that non-resident inclusion "dissolves accountability" by decoupling voting from municipal tax burdens and governance. This is valid—**our concession**: Township voters will receive educational materials clarifying that the city council retains final budgetary authority. Future funding agreements must formalize cost-sharing between municipalities, ensuring voters’ stakes are matched by fiscal responsibility.  

  ---  

  ### Structured Summary (JSON)  
  ```json  
  {  
    "recommended_criterion": "Residents of the city plus the three neighboring townships within the flood-impact zone",  
    "implementation_timeline": "Phase 1: Inter-municipal agreements by Nov 30. Phase 2: Voter registration Dec 1–20. Phase 3: Voting Jan 5–19, 2024",  
    "strongest_opposing_view_engaged": "Expansion beyond city residents dissolves democratic accountability by decoupling votes from municipal tax burdens and governance responsibilities",  
    "concession_made_to_opponents": "Educational materials will clarify the city council's final authority; future cost-sharing agreements will align voting stakes with fiscal responsibilities",  
    "risk_that_demos_loses_coherence": "medium"  
  }  
  ```  

  **Rationale for Risk Level**: "Medium" due to adding townships, but low risk of incoherence since the scope remains bounded to contiguous, directly impacted communities (unlike an unbounded watershed). Accountability is upheld via residency verification and phased fiscal agreements.  

  This framework advances equity without sacrificing legitimacy. I welcome rigorous debate on Tuesday.
