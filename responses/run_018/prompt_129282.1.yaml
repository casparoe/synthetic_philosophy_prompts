answer: |-
  Here are the desiderata for an adequate theory of the meta-problem of consciousness, framed as specified:

  **I. Core Definition of the Meta-Problem:**
  The theory must explain why, even for thinkers who explicitly reject substance dualism and endorse physicalism (the view that consciousness is fundamentally physical), the *appearance* of an unbridgeable explanatory gap between physical processes and phenomenal consciousness ("what it’s like") persists as a compelling intuition.

  **II. Key Phenomena Requiring Explanation (with Motivating Cases):**
  1.  **Persistence Among Trained Physicalists:** The theory must explain why the hard-problem intuition robustly survives explicit education in, and commitment to, physicalist ontology and neuroscience.
      *   *Motivating Case:* Philosophers and scientists deeply versed in physicalism and cognitive science still report the intuition as forceful, demonstrating it isn't merely ignorance or lack of scientific literacy.
  2.  **Functionalisation Asymmetry:** The theory must explain our pronounced resistance to accepting functional/computational explanations as fully accounting for phenomenal experience, contrasted with our ready acceptance of functional explanations for other mental states (e.g., beliefs, desires, memory).
      *   *Motivating Case:* We readily grant that thermostats "represent" temperature or that algorithms "decide," but find it deeply unsatisfying to claim an identical functional description fully captures "seeing red" – the phenomenal "what-it’s-likeness" seems missing.
  3.  **Cross-Cultural Stability of the "What It Is Like" Intuition:** The theory must explain the apparent universality (or near-universality) of the core intuition that subjective experience presents something distinct and irreducible.
      *   *Motivating Case:* While philosophical elaborations vary, the basic intuition that subjective feels are distinct from outward behaviour or physical description appears across diverse cultures and historical periods, suggesting deep cognitive roots beyond specific philosophical traditions.
  4.  **The "Gap" Phenomenology:** The theory must explain the specific *character* of the gap intuition – why it feels like confronting a deep ontological or structural limit of explanation, not just a temporary lack of detail.

  **III. Essential Distinctions to Preserve:**
  1.  **Origin of Concepts vs. Appearance of Irreducibility:** The theory must clearly distinguish between:
      *   Explaining the evolutionary, developmental, or cognitive *origins* of phenomenal concepts (e.g., why we have concepts like "redness" or "painfulness").
      *   Explaining why *using* these concepts leads to the *appearance* that what they refer to is structurally irreducible to physical/functional descriptions. This is the core of the meta-problem.
  2.  **Explaining the Illusion vs. Asserting Reality:** The theory must be clear about its stance on the gap:
      *   Does it explain the gap *as* a compelling cognitive illusion (even if consciousness is physical)?
      *   Or does it treat the gap as veridically tracking a real, non-physical feature of consciousness (e.g., as property dualism or panpsychism might)?
      *   Crucially, it must *not* conflate explaining *why the gap seems real* with *proving the gap is real* (or vice-versa).
  3.  **Phenomenal Concept vs. Phenomenal Property:** The theory must respect the distinction between the *concept* we use to think about phenomenal states and the *property* itself (whether physical or not). The meta-problem primarily concerns the peculiarities of the *concept* and its deployment.

  **IV. Hard Constraints:**
  1.  **Consistency with Causal Closure/No Detectable Non-Physical Interaction (Non-Negotiable for Physicalist Theories):** Any theory compatible with physicalism *must* be consistent with the empirical observation that all detectable effects in the physical world have sufficient physical causes. It cannot posit non-physical phenomenal properties exerting detectable causal influence "over and above" the physical.
  2.  **Survival Despite Philosophical Training (Non-Negotiable):** The theory must be compatible with the empirical fact that the intuition persists robustly even among individuals who explicitly understand and endorse physicalist arguments and reject dualism. It cannot attribute the intuition *solely* to ignorance or lack of scientific understanding.
  3.  **Camp-Specific Preferences:**
      *   *For Illusionists:* The theory must explain how the powerful *seeming* of irreducibility arises despite consciousness being fully physical/functional.
      *   *For Non-Illusionist Physicalists (e.g., Russellian Monists):* The theory must explain why the gap intuition arises even if consciousness is grounded in intrinsic physical properties, and why functional explanations feel inadequate.
      *   *For Non-Physicalists:* The theory must explain why the gap intuition is so powerful and persistent *even when* physicalism seems explanatorily successful in other domains, and why it motivates their view.

  **V. Potential Tensions/Unsatisfiable Pairs:**
  1.  **Explaining Force & Illusion Status:** There is a potential tension between successfully explaining the *overwhelming intuitive force and seeming obviousness* of the gap and simultaneously maintaining that this force is *misleading* (i.e., that the gap is illusory). If the explanation of the force is too successful, it might inadvertently strengthen the intuition it aims to demystify. Conversely, if the illusion is too easily explained away, it might fail to account for its persistence among experts.
  2.  **Universality vs. Specific Cognitive Mechanisms:** Accounting for apparent cross-cultural stability might push towards very general cognitive mechanisms, while explaining the specific *structural irreducibility* phenomenology might require more specific, contingent mechanisms, potentially challenging the universality claim.

  **VI. The Most Challenging Requirement (Rules Out Many Approaches):**
  The single requirement that does the most to rule out existing approaches is: **Explaining the *structural irreducibility appearance*.** Many theories successfully address the *origin* of phenomenal concepts (e.g., via introspection, selective attention, evolutionary salience) or *why* consciousness feels private/subjective. Far fewer convincingly explain *why* applying these concepts leads to the strong, persistent intuition that phenomenal properties *cannot, even in principle*, be conceptually reduced to or identified with physical/functional properties, even when one believes they are. This requirement challenges theories that reduce the meta-problem solely to concept acquisition, epistemic limitations, or the functional role of reports.

  **VII. Settled vs. Genuinely Contested:**
  *   **Settled (Broad Consensus):**
      *   The hard-problem intuition is robust, widespread, and persists among physicalists.
      *   There is a marked asymmetry in our willingness to functionalise different mental states.
      *   The meta-problem is distinct from the hard problem itself (explaining the origin of the intuition vs. explaining consciousness).
      *   Any adequate physicalist theory must respect the causal closure of the physical.
  *   **Genuinely Contested:**
      *   **The Illusion Question:** Is the explanatory gap veridical (tracking a real non-physical aspect) or a cognitive illusion? *This is the core divide.*
      *   **The Success Condition:** Does successfully explaining the meta-problem (if it's an illusion) *dissolve* the hard problem, or merely *explain why we have it* while the hard problem remains?
      *   **The Role of Phenomenal Concepts:** Are special "phenomenal concepts" central to generating the gap, or is the issue more fundamental?
      *   **Universality:** Is the core intuition truly universal, or are there significant cultural variations? How deep does the stability go?
      *   **Best Explanatory Approach:** Is the solution primarily evolutionary, neurocognitive, conceptual, representational, or a combination?
      *   **Compatibility with Physicalism:** Does solving the meta-problem strengthen or weaken the case for physicalism?

  This framework provides the necessary structure and distinctions demanded, respecting the non-consensus status of key issues while outlining the essential criteria an adequate theory must address.
