  1.  **Ren demands managers proactively seek out "unspoken grievances" like a parent senses a child's discomfort**, 'cause juniors often can't safely speak up due to the power gap – waiting for formal complaints means you've already failed the relationship.  
  2.  **Li means grievance procedures *must* be ritualized interactions, not just policies** – think mandatory, structured "check-in" dialogues at set intervals (like biannual *li*-style reviews) focused solely on relational health, pre-empting crises by surfacing tensions early in a safe, predictable format.  
  3.  **Xiao's asymmetry means managers bear 80% of the burden for repair when things go south**, even if they didn't personally cause the harm – their role demands initiating restitution gestures (public acknowledgments, resource reallocation) without waiting for junior "proof" or complaints, cos structural harm needs role-based ownership.  
  4.  **Since blame is often diffuse in systems, focus shifts from "who screwed up?" to "how do our *roles* collectively restore ren?"** – grievance outcomes should mandate *joint*, role-specific corrective actions (e.g., managers adjust project scope, juniors co-design new feedback channels), not just punishing individuals.  
  5.  **Feedback mechanisms must be anonymized *upwards* (protecting juniors) but manager responses must be hyper-visible** – asymmetry requires protecting the vulnerable while demanding leaders model accountability publicly (e.g., published summaries of systemic issues found & concrete fixes undertaken, no hiding behind HR silos).
