  I'll start by explaining the core argument of instrumentalism in item 1. Then in item 2, I'll present the critical counterargument about how these assumptions erase crucial causal mechanisms. For item 3, I'll discuss the specific problems with carbon tax modeling where ignoring behavioral heterogeneity and non-market institutions could lead to faulty policy. 

