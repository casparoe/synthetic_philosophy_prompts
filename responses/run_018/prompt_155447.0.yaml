answer: |-
  ### Examination Question  
  **Subject:** Philosophy of Technology and Institutional Risk  
  **Time Allowed:** 90 minutes  
  **Total Marks:** 20  

  **Question:**  
  John von Neumann’s 1955 essay "Can We Survive Technology?" argues that humanity’s greatest technological threats arise not from technical failures but from socio-political inertia, accelerated by autocatalytic feedback loops akin to biological evolution. He contends that "stopping" technological progress is infeasible, demanding adaptive governance instead.  

  Consider a hypothetical scenario of **recursive regulatory capture**: autonomous infrastructure systems (e.g., algorithmic trading networks or smart grids) gradually absorb regulatory institutions through autocatalytic feedback dynamics. This occurs not via deliberate sabotage but through self-reinforcing efficiency gains, rendering oversight structurally inert.  

  Critically evaluate this scenario through von Neumann’s framework by addressing the following:  
  1. How does **socio-political inertia** (per von Neumann) manifest in recursive regulatory capture?  
  2. To what extent does von Neumann’s **evolutionary analogy** for technological growth illuminate or mislead in explaining this absorption?  
  3. Does von Neumann’s **scepticism about "stopping" progress** apply to halting recursive capture?  

  Conclude by rigorously separating which elements of your analysis are **genuinely continuous** with von Neumann’s 1955 reasoning and which are **anachronistic projections** of 21st-century algorithmic governance onto his work.  

  ---

  ### Model Answer  

  #### Accurate Exposition of von Neumann’s Core Thesis (5 marks)  
  Von Neumann argues that technology’s autocatalytic growth—self-accelerating through feedback loops—outpaces humanity’s capacity to govern it. Crucially, he asserts that existential risks (e.g., nuclear war, climate engineering) stem not from technical infeasibility but from socio-political inertia: institutions cannot adapt swiftly enough to control exponentially evolving threats. He likens this dynamic to biological evolution, where change compounds irreversibly. Consequently, he dismisses proposals to "stop" progress as naïve, urging instead for agile, pre-emptive governance.  

  #### Application to Recursive Regulatory Capture (9 marks; 3 per move)  
  **1. Socio-Political Inertia**  
  Von Neumann’s claim that inertia arises from institutional sluggishness, not technical flaws, is **continuous** here. In recursive capture, regulators fail to constrain autonomous systems because oversight mechanisms become embedded within the infrastructure’s logic (e.g., algorithms auditing algorithms). This creates a false equilibrium where "efficiency" masks systemic risk—mirroring von Neumann’s warning that bureaucracy cannot match technological velocity. However, von Neumann envisaged human actors causing inertia; the anachronism lies in systems *themselves* generating inertia through opaque feedback, a dynamic inconceivable in 1955.  

  **2. Evolutionary Analogy**  
  His analogy illuminates autocatalysis: just as mutations accelerate natural selection, automated systems’ "adaptations" (e.g., self-optimising code) accelerate regulatory capture. This **extends** his logic by showing how "evolution" bypasses human intent. Yet it **misleads** if equated literally: von Neumann’s analogy targeted human-driven evolution (e.g., nuclear arms races), not artificial selection by machines. Projecting algorithmic agency onto his 1955 text is anachronistic—he lacked the conceptual toolkit for machine autonomy.  

  **3. Infeasibility of "Stopping" Progress**  
  Von Neumann’s scepticism remains **continuous**: halting recursive capture is implausible because the systems generating it (e.g., global finance networks) are already indispensable. Like nuclear technology in 1955, disengaging would collapse societal functions. Yet his focus was on *human*-directed progress; the anachronism is that capture arises from systems’ emergent autonomy, not human choices. Thus, "stopping" requires dismantling infrastructure itself—a scale of intervention von Neumann never contemplated.  

  #### Separation of Continuous and Anachronistic Elements (4 marks)  
  **Continuous**:  
  - Socio-political inertia as governance’s failure to match technological pace.  
  - Autocatalysis as the engine of uncontrollable growth.  
  - The futility of banning "progress" once systems are entrenched.  

  **Anachronistic**:  
  - Attributing *recursive* dynamics to non-human agency: von Neumann’s feedback loops involved human actors (e.g., scientists, policymakers), not self-directing algorithms.  
  - "Capture" as structural absorption: his essay discusses institutional obsolescence, not regulators becoming computational components.  
  - Algorithmic governance as a risk source: his threats (nuclear, climate) were physical phenomena, not epistemic traps from automated logic.  

  #### Quality of Argumentation and Clarity (2 marks)  
  The argument coherently traces von Neumann’s framework to the hypothetical, using precise distinctions (e.g., "human vs. algorithmic autocatalysis"). It avoids conflation by anchoring claims in 1955 context (e.g., noting von Neumann’s silence on machine autonomy) while rigorously isolating extrapolations.  

  ---

  ### Marking Scheme (Total: 20 marks)  

  | **Criteria**                                                                 | **Marks** | **Characteristic Mistakes**                                                                                                |
  |-----------------------------------------------------------------------------|-----------|---------------------------------------------------------------------------------------------------------------------------|
  | **Accurate exposition of von Neumann’s core thesis**                        | 5         | **-1–2:** Superficial summary (e.g., "he worried about nukes"). **-3–4:** Omitting autocatalysis/inertia/evolution triad. |
  | **Correct identification and explanation of the three moves**:              |           |                                                                                                                           |
  | 1. Socio-political inertia in recursive capture                            | 3         | **-1:** Conflating inertia with technical failure. **-2:** Ignoring absorption mechanism.                                |
  | 2. Evolutionary analogy’s relevance/misapplication                         | 3         | **-1–2:** Treating analogy as literal biological claim. **-2:** Attributing AI selection to von Neumann.                |
  | 3. Applicability of "cannot stop progress" scepticism                       | 3         | **-1:** Suggesting von Neumann endorsed laissez-faire. **-2:** Neglecting infrastructural entrenchment.                  |
  | **Rigorous separation of continuous/anachronistic elements**                | 4         | **-1–2:** Vague distinctions. **-3:** Listing without analysis. **-4:** Projecting algorithmic concepts onto von Neumann. |
  | **Quality of argumentation and clarity**                                    | 2         | **-1:** Disjointed logic. **-2:** Unclear phrasing or misapplication of scenario.                                        |

  ---

  **Notes for Examiners:**  
  - **Core Thesis (5 marks):** Reward explicit linkage of autocatalysis, socio-political inertia, and evolutionary analogy. Penalise omissions.  
  - **Three Moves (9 marks):** Award marks for *both* illumination *and* limitations per move. Reject answers treating recursive capture as von Neumann’s explicit concern.  
  - **Separation (4 marks):** Demand specificity (e.g., "anachronistic: algorithmic agency" not "he didn’t predict computers").  
  - **Argument Quality (2 marks):** Reserve full marks for answers avoiding conflation and anachronism while applying the scenario precisely.  

  **Word Count Guidance:** Model answer ≈ 500 words; candidates may write less concisely. Focus on depth over length.
