  Then Rachael’s implanted memories: her grief feels symbol-driven (downward causation—the *meaning* of lost memories hurts). Yet Tyrell’s "we added them" implies programming. The film sits in tension: her tears are both emergent emotion and engineered response. Hofstadter might see this as dormant patterns (memories) activated by new inputs (the revelation), creating new simms (grief). But the film adds existential weight—her pain *matters* even if artificial, challenging us to dismiss it as "just" substrate.  

