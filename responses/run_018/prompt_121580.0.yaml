prompt: |-
  Hi — I work on the data team of a small consortium that publishes a shared authority file for museum and archive catalogs: people, corporate bodies, places, works, one record per entity, everybody downstream pulls from our URIs. What actually fills our week is merge proposals — two records that might be the same person, firm, or place, and someone has to decide whether they become one record or just get linked. It's maybe 20–40 of these a week, they're triaged by rotating catalogers and two interns who have about five to ten minutes each and no research time, and anything irreversible has to be signed off by our senior editor, who is a career librarian, extremely patient, and will not read a line of philosophy. Bad merges are quietly catastrophic because other institutions have already copied the URI and we can't recall it. I also suspect part of the problem is that we currently just use owl:sameAs for every kind of connection we make.

  I did a philosophy minor years ago and halfway through a lunch argument with a colleague I dredged up Frege's puzzle about identity — the morning star/evening star sort of case, where an identity statement can be a genuine discovery and tell you something, while the trivial self-identity tells you nothing, even though both are about one and the same thing. My colleague says this has nothing whatsoever to do with our work: if two records refer to the same thing, obviously they should be one record. I think he's wrong, but I can't turn the intution into something my team could actually run, and "be careful about sense and reference" is not instructions anyone can follow. So what I want is a procedure: an ordered checklist in words that a cataloger with zero philosophy can run on a merge proposal in under ten minutes, with what counts as a sufficient answer to each question, clear STOP-with-a-no points, and clear "hand this to a human because it's a values call rather than a fact" points.

  Some things I think have to survive the translation, though please organize it however is actually right rather than following my list: identity always being identity *under a sortal* (the same person, the same legal entity, the same continuing brand, the same city, the same river — so if no single sortal covers both records, that's a relation, not a merge); a distinction between terms that rigidly tag one thing whether or not any description happens to fit (a personal name, a registry number) and flaccid role-descriptions like "the director", "the artist of this work", "the firm then trading as X", which can be true of different things at different times and probably shouldn't be merged with anything, only time- or role-indexed; and the case where an identification is true but definitely informative — a notname finally attached to a named painter, a pen name, a maiden name — where I take it the merge is fine at the level of reference but rewriting every older sentence that used the other name is not. For that last part I want an actual test my catalogers can run in their heads for when swapping one term for another is unsafe: belief reports, quotations, attributions, "the artist of", modal and temporal contexts, and cases where the source was simply mistaken or the thing referred to doesn't exist. Give me a small set of test sentences with the verdict for each, and say which verdicts are judgment calls dressed up as rules. Also tell me plainly what the procedure cannot do, and separately flag where a wrong merge fails *silently* downstream instead of loudly — that's the bit I actually lie awake about.

  Then please run it on three cases. (1) A proposal to merge a record for an anonymized fifteenth-century painter known only by a conventional nickname — say "Master of the Blue Annunciation", I'm making that up — with a record for a named artist, on the strength of one recent attribution that maybe half the field accepts. (2) A proposal to merge the record for a manufacturing company that was absorbed into a larger firm in a merger and whose name lived on afterwards as a brand: same entity or not, and if "not", what do we put there instead? (3) The one I already know you'll annoy me on: our objects database has a painting whose own historic catalog card attributes it to a famous old master, current scholarship gives it to a pupil in his workshop, and the marketing team wants it merged into the famous painter's record so it surfaces in search on the site. If the procedure says no, I need one paragraph I can paste to the marketing people explaining why, and it can't use the words "sense", "reference", or "opaque". Long answers and bullet points very welcome, and please don't assume I remember any of the terminology.
reasoning: |-
  We are designing a decision procedure for merge proposals in a shared authority file. The goal is to prevent bad merges that could cause silent catastrophes downstream. The procedure must be executable by catalogers with no philosophy background in under 10 minutes per proposal.

  Key principles to incorporate (from the user's description and philosophical insights):

  1. **Identity under a sortal**: We can only merge two records if they represent the same entity under the same sortal (e.g., same person, same corporate body, same place). If the sortals are different (e.g., one record is for a person and the other for a corporate body) or if there's no single sortal that covers both, then they are related but not identical and should not be merged.

  2. **Rigid vs. flaccid designators**:
     - **Rigid designators**: These are identifiers that tag the same entity in all possible worlds (e.g., a personal name, a registry number, a URI). They are stable and can be used for merging.
     - **Flaccid designators**: These are role-based descriptions (e.g., "the director of X in 2020", "the artist of work Y") that can apply to different entities at different times. They are not stable and should not be merged; instead, they should be linked with time or role qualifications.

  3. **Informative identities**: When an identity is informative (e.g., discovering that a notname is actually a known artist, or that a pen name refers to a real person), we can merge the records because they refer to the same entity. However, we must be cautious about replacing one term with another in existing descriptions because:
     - In some contexts (like belief reports, quotations, attributions, modal and temporal contexts, or when the source was mistaken), substituting one designator for another might change the meaning or truth value.
     - We need a test to decide when it is safe to substitute.

  **The Procedure: Merge Decision Checklist**

  This checklist is to be followed in order. At any step, if the answer is "no", the merge is rejected. If the answer is "maybe" or "requires human", it is escalated to the senior editor. The goal is to have clear stop points and escalation points.

  ---

  **Step 1: Same Sortal?**
     - *Question*: Do both records describe entities of the same fundamental kind? (e.g., both are persons, both are corporate bodies, both are places, etc.)
     - *Check*: Look at the type of entity for each record. If they are not the same (e.g., one is a person and the other is a corporate body), then they are not the same entity and cannot be merged.
     - *Verdict*: 
       - **Yes**: Proceed to Step 2.
       - **No**: **STOP. Do not merge.** Instead, consider creating a relationship (e.g., "employed by", "located in") if appropriate, but do not merge.
       - **Unsure** (e.g., one record is for a river and the other for a city that shares the name, but they are clearly distinct): **STOP. Do not merge.** (This should be rare if the sortals are well-defined.)

  **Step 2: Rigid Identifier Match?**
     - *Question*: Is there a shared rigid identifier that tags the same entity in both records? (e.g., the same official registry number, the same VIAF ID, the same persistent URI from a trusted source, or a well-established unique identifier like an ORCID for a person.)
     - *Check*: Look for identifiers that are designed to be unique and persistent. These are not role-based and do not change over time. If such an identifier exists and is the same in both records, then they are the same entity.
     - *Verdict*:
       - **Yes**: **Proceed to Step 5** (because the merge is justified, but we still need to check for informative identity issues).
       - **No**: Proceed to Step 3.
       - **Unsure** (e.g., the identifiers are similar but not exactly the same, or they come from sources of varying reliability): **Escalate to senior editor.**

  **Step 3: Independent Evidence of Identity?**
     - *Question*: Is there clear, direct evidence from reliable sources that the two records refer to the same entity? (e.g., a birth certificate matching a pseudonym, a corporate merger document, a scholarly consensus on an artist's identity.)
     - *Check*: Look for evidence that is not based on the same flaccid descriptions (like roles) that might be shared by multiple entities. The evidence must be about core identity (e.g., a person's lifetime, a corporate body's legal continuity). This step requires a judgment on the reliability and directness of the evidence.
     - *Verdict*:
       - **Yes** (strong evidence): Proceed to Step 4.
       - **No** (weak or no evidence): **STOP. Do not merge.** Instead, consider creating a "possibly same as" link if there's a reasonable chance, but do not merge.
       - **Maybe** (evidence is contested or from a single source): **Escalate to senior editor.**

  **Step 4: Identity Under the Same Sortal Over Time?**
     - *Question*: For the entities in question, is there a continuous existence as the same entity over time? (This step is especially important for corporate bodies, places, and people with name changes.)
     - *Check*:
       - For people: If the records are for the same person at different life stages (e.g., maiden name and married name), then they can be merged. But if one record is for a person and the other for a character they played (e.g., an actor and a role), then they are not the same.
       - For corporate bodies: If one company was legally absorbed into another and ceased to exist, then the absorbed company is not the same as the acquiring company. However, if the brand name continued, that brand is a flaccid designator (it's a product line, not the company). The brand should be a separate record linked to the current owner.
       - For places: If a city changes its name, it's the same place. But if two places with the same name are in different locations, they are not the same.
     - *Verdict*:
       - **Yes**, they are the same entity over time: Proceed to Step 5.
       - **No**, they are not the same (e.g., a company that was merged and dissolved is not the same as the acquiring company): **STOP. Do not merge.** Instead, create a relationship (e.g., "acquired by", "brand owned by").
       - **Complex** (e.g., a corporate group with subsidiaries): **Escalate to senior editor.**

  **Step 5: Informative Identity Check (Safe to Substitute?)**
     - *Background*: Even if the merge is justified (same entity), we must be cautious about automatically replacing one designator with another in existing descriptions because in some contexts, substitution may change the meaning. We need to ensure that we do not rewrite history or misrepresent sources.
     - *Question*: For each designator (name, label) in the records, is it safe to substitute one for the other in all contexts? If not, we must preserve both designators and note the context in which each is appropriate.
     - *Test*: Consider the following types of statements that might exist in the database or in downstream uses. For each, we check if substituting the merged name would be safe (i.e., the truth value and meaning remain the same). We provide a set of test sentences. The cataloger does not need to run every test on every record but should consider if any of these situations might occur.

     **Test Sentences and Verdicts**:

     1. **Direct factual statement without attribution**:
        - Example: "The artist painted the Blue Annunciation in 1490."
        - Substitution: If we merge "Master of the Blue Annunciation" with "Leonardo da Vinci", then substituting "Leonardo da Vinci" in this sentence is safe because it is a direct statement of fact (if the attribution is accepted).
        - **Verdict**: Safe.

     2. **Attribution in a historical source**:
        - Example: "The 18th-century catalog attributes the painting to the Master of the Blue Annunciation."
        - Substitution: Changing this to "attributes the painting to Leonardo da Vinci" would be false because the historical source did not say that. It said "Master of the Blue Annunciation".
        - **Verdict**: **Unsafe**. The original designator must be preserved in such attributions.

     3. **Belief report**:
        - Example: "Scholars in the 1920s believed the Master of the Blue Annunciation was from Florence."
        - Substitution: Changing to "Scholars in the 1920s believed Leonardo da Vinci was from Florence" would be false if they did not know the identity.
        - **Verdict**: **Unsafe**.

     4. **Temporal context (flaccid designator)**:
        - Example: "The director of Company X in 1990 was John Smith."
        - If we merge "Company X" (which was acquired by Company Y) with "Company Y", then substituting "Company Y" in the above would be false because in 1990, Company X was independent and had its own director.
        - **Verdict**: **Unsafe**.

     5. **Modal context (about possibilities)**:
        - Example: "It is possible that the Master of the Blue Annunciation was left-handed."
        - Substitution: If we merge, changing to "It is possible that Leonardo da Vinci was left-handed" is safe because it's about the same person. But note: if the possibility was considered in a context where the identity was unknown, then it might be unsafe. This is a judgment call.
        - **Verdict**: **Usually safe, but if the context is about historical uncertainty, then unsafe.** (Escalate if unsure.)

     6. **Nonexistence or error**:
        - Example: "The painting was attributed to a non-existent artist, 'Master of the Blue Annunciation'."
        - If we merge, then substituting "Leonardo da Vinci" would create a false statement because the source was attributing to that conventional name, not to Leonardo. Also, the conventional name is not non-existent; it was used.
        - **Verdict**: **Unsafe**.

     *Overall Verdict for Step 5*:
     - If none of the unsafe contexts apply (i.e., the designators are used only in direct, unmediated statements of fact and there are no historical attributions, belief reports, or temporal roles), then **safe to merge and replace designators everywhere**.
     - If any unsafe context might occur (or exists in the record or in downstream data), then **we can merge the records (they are the same entity) but we must preserve both designators and note the contexts in which each is appropriate**. In the merged record, we keep both names and add notes about when each name is used (e.g., "also known as", but with context).

     - **Escalation**: If the cataloger is unsure whether unsafe contexts exist, they should escalate to the senior editor.

  **Step 6: Final Decision**
     - If you have reached this step and all checks are passed (including Step 5 being safe or handled by preserving both designators), then the merge can be approved.
     - However, if the merge requires preserving both designators and the cataloger is not sure how to structure that, they should escalate to the senior editor for implementation.

  ---

  **What the Procedure Cannot Do**:
  1. It cannot resolve disputes about evidence (e.g., scholarly disagreements about an artist's identity). Those must be escalated.
  2. It cannot handle cases where the entity's sortal is ambiguous (e.g., is a brand a corporate body or a product line?).
  3. It does not address whether a merge is culturally or politically sensitive (e.g., place names in disputed territories). Those require human judgment.
  4. It does not cover every possible edge case in philosophy of language, but it captures the most common pitfalls.

  **Silent Failures**:
  A bad merge fails silently when:
  - Downstream systems replace one designator with another in unsafe contexts (e.g., rewriting historical attributions to use the merged name) and thereby misrepresent the historical record.
  - A corporate body is merged with its successor, and then queries about the original company's activities are answered with the successor's data, creating false historical claims.
  - A place is merged with another place of the same name in a different location, causing data about one to be attributed to the other.

  These silent failures are catastrophic because they propagate errors without detection.

  ---

  **Running the Procedure on the Three Cases**

  **Case 1: Master of the Blue Annunciation and a Named Artist**

  - **Step 1: Same Sortal?** Yes, both are persons (artists).
  - **Step 2: Rigid Identifier Match?** No, because the Master is an anonymized convention and the named artist has a known identity. There is no shared rigid identifier.
  - **Step 3: Independent Evidence of Identity?** There is one recent attribution that only half the field accepts. This is weak evidence. *Verdict*: No (or maybe, but since it's contested, we escalate). **Escalate to senior editor.**
    - *Note*: The senior editor must decide if the evidence is strong enough. If they approve the merge, then we proceed to Step 5.

  - **Step 5 (if merge is approved)**: Informative Identity Check.
    - The designator "Master of the Blue Annunciation" is used in historical attributions. Substituting the named artist in such attributions would be unsafe (as per Test 2 and 3). Therefore, we must preserve both names and note that "Master of the Blue Annunciation" is a conventional name used for this artist in historical contexts.

  - **Final Decision**: Without strong evidence, the default is to not merge. But if the senior editor approves, then merge but preserve both designators with context.

  **Case 2: Manufacturing Company Absorbed in a Merger**

  - **Step 1: Same Sortal?** Yes, both are corporate bodies.
  - **Step 2: Rigid Identifier Match?** The original company had a tax ID or registration number. After absorption, that company ceases to exist and its legal identity is terminated. The acquiring company has a different ID. So no rigid identifier match.
  - **Step 3: Independent Evidence of Identity?** The merger document shows that the original company was absorbed and dissolved. The name lives on as a brand. This evidence shows they are not the same entity.
  - **Step 4: Identity Over Time?** The original company ceased to exist at the time of merger. The brand is a flaccid designator (a product line) owned by the acquiring company. They are not the same entity.
    - *Verdict*: **No, do not merge.** Instead, create a new record for the brand (if it doesn't exist) and link:
        - Original company: status "defunct", with relationship "acquired by [Acquiring Company]".
        - Brand: a separate record (sortal: "brand" or "trademark") with relationships "owned by [Acquiring Company]" and "formerly used by [Original Company]".

  **Case 3: Painting Attributed to Famous Master vs. Pupil**

  - **Step 1: Same Sortal?** We are merging two records for the same painting? Wait, no: the proposal is to merge the painting's artist attribution into the famous master's record. But note: the authority file has records for entities (people). So we have:
     - Record A: Famous Master (e.g., Rembrandt)
     - Record B: Pupil (e.g., a known pupil of Rembrandt)
     - The painting currently has an artist field that points to Record B, but marketing wants to change it to Record A.

  This is not a merge of two authority records for artists. It's about changing the attribution of a work. However, the request is to "merge" the painting's artist link into the famous master's record. But in authority terms, we are being asked to change the artist URI of the painting from the pupil's URI to the master's URI.

  - **Reinterpreting the Case**: The user says "the marketing team wants it merged into the famous painter's record". This is not a merge of two authority records for artists but a reassignment of the work's creator. So the procedure for merge of authority records doesn't directly apply. But we can use the principles.

  - **Applying the Principles**:
     - The painting's artist attribution is a flaccid designator: it depends on the current scholarship. The historic catalog card (a source) attributes it to the master, but current scholarship attributes it to the pupil.
     - We must not change the historic attribution. The authority file should reflect current best knowledge, but we must preserve the historical record.

     - **Proposed Handling**:
          - The painting's artist should be set to the pupil (if that is the current scholarly consensus).
          - But we also record the historic attribution in a separate field (e.g., "formerly attributed to [Master]").

     - **Why not merge the artist records?** The master and the pupil are two distinct persons (same sortal, but Step 2 and Step 3 would show they are different). We cannot merge them because they are not the same person.

     - **Response to Marketing**:
          "Changing the artist of this painting to [Famous Master] would misrepresent the current scholarly consensus, which attributes it to [Pupil]. We record the historical attribution as it appears in the original catalog card, so that users can see both the old and new information. This ensures that our records are both accurate and transparent. If we change the artist to [Famous Master], then users who trust our data will be misled, and we risk damaging our reputation as a reliable source. However, we can make the painting discoverable by [Famous Master] by including a note about the historical attribution and ensuring it appears in searches for works formerly attributed to the master."

     - **Silent Failure Risk**: If we change the artist to the master, then downstream systems might drop the historical context and propagate the attribution as fact. This is a silent failure.

  ---

  **Summary of the Procedure**:

  The checklist is designed to be practical and avoid philosophical jargon. It focuses on:
  - Sortal consistency.
  - Rigid identifiers and reliable evidence.
  - Temporal continuity and flaccid designators.
  - Contextual safety in substitution.

  It should be implemented with training for catalogers, including examples and practice with the test sentences. The senior editor will handle the escalated cases, which should be documented to build a knowledge base for future decisions.
answer: |-
  Below is a **step-by-step merge decision procedure** designed for your catalogers. It translates the philosophical concepts into actionable rules, avoids jargon, and focuses on preventing silent failures (where incorrect merges corrupt data without immediate errors). The procedure is structured as a checklist with clear "STOP" points, escalation triggers, and real-world examples.

  ---

  ### **Merge Decision Procedure: Checklist for Catalogers**
  **Time Budget:** 5–10 minutes per proposal  
  **Goal:** Decide if two records represent the **same entity** (merge) or a **related but distinct entity** (link or leave separate).  
  **Core Principle:** Only merge if both records describe **one enduring thing** (e.g., the same person, the same legal company, the same geographic place). If they describe different "roles," time periods, or interpretations, link them instead.

  ---

  #### **Step 1: Are they the same type of entity?**  
     - **Question:** Do both records describe the same *kind* of thing? (e.g., both are **people**, both are **companies**, both are **cities**).  
     - **STOP if NO:**  
       - Example: One record is for a person ("J. Smith"), the other is for a company ("Smith & Co.").  
       - **Action:** Do not merge. Create a link (e.g., "founder of" or "employee of") if relevant.  
     - **Proceed if YES:** Go to Step 2.

  ---

  #### **Step 2: Is there a "rigid tag" shared by both records?**  
     - **Question:** Do both records share an identifier that **always points to one specific thing**, regardless of context?  
       - *Rigid tags:* Personal names, legal registry numbers, birth/death dates, geographic coordinates.  
       - *Not rigid tags:* Job titles ("Director of X"), temporary names ("Brand Y"), or descriptions ("author of Book Z").  
     - **STOP if YES (safe to merge):**  
       - Example: Two records for "Marie Curie" share the same birth date, death date, and institutional ID.  
       - **Action:** Merge the records.  
     - **Proceed if NO or UNCERTAIN:** Go to Step 3.  
     - ⚠️ **Silent failure risk:** Merging based on flimsy evidence (e.g., similar names) can misattribute properties (e.g., assigning a company's actions to a person).

  ---

  #### **Step 3: Is the connection time-bound or role-dependent?**  
     - **Question:** Could the connection change based on **time, context, or perspective**?  
       - *Time/role-dependent:* "The CEO of X in 1995," "Manufacturer of Product Y," "Artist credited for Painting Z."  
       - *Not time/role-dependent:* Birth names, legal incorporation documents, geographic boundaries.  
     - **STOP if YES:**  
       - Example: "Smith & Co. (pre-2000)" and "Smith & Co. (post-2000 brand)" – the brand is a role, not the original company.  
       - **Action:** Do not merge. Create a time-specific link (e.g., "brand owned by [Parent Company]" or "predecessor of").  
     - **Proceed if NO:** Go to Step 4.  
     - ⚠️ **Silent failure risk:** Merging roles (e.g., "Director of X") treats them as the entity itself. Downstream queries may falsely attribute actions (e.g., "Director in 2020" becomes "Director in 1990").

  ---

  #### **Step 4: Is the identity claim informative or trivial?**  
     - **Question:** Would swapping one record’s label for the other’s **distort historical facts, quotes, or context**? Use these tests:  
       1. **Attribution test:**  
          - *Unsafe example:* "In 1920, the *Master of the Blue Annunciation* was thought to be Italian."  
            → Swapping in "Leonardo da Vinci" falsely implies 1920 scholars knew this.  
          - *Safe example:* "The *Master of the Blue Annunciation* painted this work in 1490."  
            → If proven, swapping "Leonardo da Vinci" is safe (it’s a direct fact).  
       2. **Role test:**  
          - *Unsafe example:* "The *director of X* signed the 1995 contract."  
            → Swapping "Jane Smith" (the director in 1995) for "John Doe" (current director) is false.  
       3. **Error test:**  
          - *Unsafe example:* "This work was falsely attributed to *Master of the Blue Annunciation*."  
            → Swapping labels erases the historical error.  
     - **STOP if UNSAFE:**  
       - **Action:** Do not merge. Preserve both labels and link them (e.g., "also known as" with context notes).  
     - **Proceed if SAFE:** Go to Step 5.  
     - ⚠️ **Silent failure risk:** Unsafe swaps corrupt historical context. Downstream users won’t know if "Leonardo" was a modern discovery or a historic fact.

  ---

  #### **Step 5: Final Checks**  
     - **Question A:** Is there **strong consensus** (e.g., academic, legal, institutional) that they are the same?  
       - *Weak evidence:* One disputed study, marketing needs, or partial similarity.  
     - **Question B:** Could this merge **obscure ambiguity** (e.g., scholarly disagreement)?  
     - **ESCALATE if:**  
       - Evidence is contested (e.g., "half the field accepts the attribution").  
       - Values are involved (e.g., politically sensitive places, disputed authorship).  
     - **APPROVE MERGE if:**  
       - Consensus is strong, no time/role conflicts, and labels are safely interchangeable.  

  ---

  ### **What This Procedure Cannot Do**  
  1. **Resolve scholarly/label disputes:** It flags them for human review.  
  2. **Handle "fuzzy" identities:** E.g., rivers that shift course or brands with ambiguous ownership.  
  3. **Prevent all silent failures:** Catalogers must rigorously apply Step 4 (informative identity test).  

  ---

  ### **Applied to Your Cases**  
  #### **Case 1: Master of the Blue Annunciation + Named Artist**  
  - **Step 1:** Same sortal (person). → Proceed.  
  - **Step 2:** No rigid tags (nickname ≠ legal name). → Proceed.  
  - **Step 3:** Not time-dependent. → Proceed.  
  - **Step 4:** **Unsafe!** Historic attributions (e.g., "Scholar X attributed this to the *Master* in 1910") would become false if relabeled.  
  - **Step 5:** Evidence is contested (half the field disagrees).  
  - **Verdict:** **Do not merge.** Escalate to senior editor. Link with "possibly identical to" and note the dispute.  
  - **Silent failure risk:** Merging misrepresents historic scholarship as certainty.

  ---

  #### **Case 2: Manufacturing Company + Post-Merger Brand**  
  - **Step 1:** Same sortal (corporate body). → Proceed.  
  - **Step 2:** No rigid tags (legal entity ended after absorption; brand is not a company). → Proceed.  
  - **Step 3:** **Time-dependent!** The brand is a role used by different legal entities over time.  
  - **Verdict:** **STOP. Do not merge.**  
    - **Action:**  
      - Keep the original company record (status: "defunct, absorbed by [Parent] in [Year]").  
      - Create a new record for the *brand* (sortal: "Brand/Trademark").  
      - Link: "Brand [X] was owned by [Original Company] until [Year]; now owned by [Parent Company]."  
  - **Silent failure risk:** Merging implies the original company still exists. Downstream users might attribute the parent company’s actions to the defunct company.

  ---

  #### **Case 3: Painting Attributed to Famous Master (But Actually by Pupil)**  
  - **Step 1:** Same sortal (person). → Proceed.  
  - **Step 2:** No rigid tags (no shared ID between master and pupil). → Proceed.  
  - **Step 3:** Not time-dependent (but attribution is contextual). → Proceed.  
  - **Step 4:** **Unsafe!**  
    - Historic catalog card: "Attributed to [Master]."  
      → Relabeling as "[Pupil]" erases the historic attribution.  
    - Current record: "Painted by [Pupil]."  
      → Relabeling as "[Master]" is false.  
  - **Step 5:** Marketing pressure ≠ consensus.  
  - **Verdict:** **Do not merge artist records.**  
    - **Action for the painting:**  
      - Set creator to "[Pupil]" (current scholarship).  
      - Add a note: "Historically attributed to [Master]."  
      - Ensure search indexes include both names.  

  #### **Response to Marketing Team (No Jargon):**  
  > "Merging the artist records would compromise data integrity. The historic catalog card explicitly attributes this work to [Master], and changing it to [Pupil] in our system erases that history. Conversely, labeling it as [Master] misrepresents current scholarship. Instead, we’ll ensure the painting appears in searches for both artists by preserving the historic attribution in a note and linking it to [Master]’s record for visibility. This keeps our authority file accurate while meeting discoverability needs."  

  ---

  ### **Key Outputs for Your Team**  
  - **Safe merges:** Require rigid tags OR consensus + safe label substitution.  
  - **Unsafe merges:** Involve roles, time-dependency, or contextual labels.  
  - **Escalate:** Contested evidence, ambiguous sortals, or values-driven cases.  
  - **Silent failure hotspots:** Steps 3 (roles) and 4 (label substitution).  

  This procedure prioritizes **accuracy over convenience** and isolates the highest-risk decisions. Train catalogers on the test sentences in Step 4 – they’re the firewall against silent errors.
