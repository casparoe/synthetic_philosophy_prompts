prompt: |-
  i work as legal counsel in a small eu member-state ministry and usually have about 20 minutes to vet draft directives before my minister signs off. i need a quick screening procedure grounded in the distinction between pooling sovereignty and transferring it, specifically using a "reversibility without residue" test: if we exit later, can domestic law fully undo the directive's effects without leaving legal residue that only eu-level action could clean up? write exactly five numbered items, each one or two sentences, with no introduction and no conclusion. item 1 should state the first gate about whether authority is pooled or transferred; item 2 the residue check; item 3 whether the democratic deficit is structural or just geographic distance; item 4 the point where legal analysis stops and a value judgement takes over; item 5 the final verdict plus a brief note on what this whole procedure cannot catch. apply the flow to two proposals: a shared carbon-border database that locks states into joint infrastructure, and a pharma-label harmonisation rule that sounds boring but binds national regulators. include one case where the procedure clears the draft but my minister will hate the result. flag which step is irreducibly a political call rather than a factual check.
reasoning: |-
  Okay, the user is a legal counsel in a small EU ministry who needs a rapid screening tool for vetting draft directives. Their core concern is distinguishing between pooling sovereignty (reversible) vs transferring it (irreversible with legal residue). The "reversibility without residue" test is brilliant - it cuts through complexity by focusing on exit scenarios. 

  Hmm, they're time-pressed (20min!) so the five-item structure must be surgical. Interesting they want two concrete examples - the carbon database and pharma labels - to stress-test the framework. Also smart to flag that one politically unpalatable outcome where the procedure clears it legally. 

  Breaking it down: Item 1 needs to isolate the authority question crisply. Item 2's residue check is the crux - permanent infrastructure vs replaceable labels. Item 3's democratic deficit point reveals their deeper worry about legitimacy erosion. Item 4 is key: must explicitly call out where law stops and politics starts (that's the minister's call). Item 5's caveat shows they're realistic about limitations. 

  For the examples: The carbon database clearly fails reversibility - joint infrastructure = permanent residue. Pharma labels pass but... ah, the minister will hate harmonization even if legally reversible. Perfect illustration of procedure vs politics. 

  Final note: They're sophisticated enough to want no fluff - just numbered items. The "irreducibly political" flag in Item 4 respects their role boundary. Caveat about non-legal risks (Item 5) covers their blind spots. This feels like one legal pro streamlining work for another.
answer: |-
  Here are exactly five numbered screening items applied to both proposals:

  1.  **Authority Type:** Determine if the directive creates shared EU-level decision-making (pooling) or permanently removes national competence to act independently in this domain (transferring).  
      *Carbon Database:* Pooling (joint management). *Pharma Labels:* Transferring (binding standards override national rules).  
  2.  **Residue Check:** Assess if exiting the regime would leave legally binding obligations, infrastructure, or data dependencies requiring EU-level action to dismantle or replace ("residue").  
      *Carbon Database:* High residue (integrated infrastructure/data requires EU exit negotiation). *Pharma Labels:* Low residue (domestic law can reinstate old labels, though costly).  
  3.  **Deficit Nature:** Evaluate if reduced national control stems primarily from necessary coordination across geography (distance) or from ceding final authority to non-directly accountable EU bodies (structural).  
      *Carbon Database:* Primarily distance (operational coordination needed). *Pharma Labels:* Structural (EC/EMA sets binding rules, limited national discretion).  
  4.  **Value Threshold (Political Call):** Identify if the policy benefits (e.g., efficiency, harmonization) justify the sovereignty cost identified in steps 1-3; **this step is irreducibly a political/value judgment.**  
      *Carbon Database:* Is climate benefit worth infrastructure lock-in? *Pharma Labels:* Is market efficiency worth loss of regulatory autonomy?  
  5.  **Verdict & Caveat:** If pooling (step 1) AND low/no residue (step 2) AND deficit is primarily distance (step 3), CLEAR; else, FLAG for deeper review. Note: This misses non-legal risks (economic, diplomatic).  
      *Carbon Database:* **FLAG** (High residue). *Pharma Labels:* **CLEAR** legally (low residue, reversible domestically) **but Minister may hate** harmonization loss. Caveat: Doesn't catch economic disruption from label changes.
