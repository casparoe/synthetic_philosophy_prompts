  The user wants a diagnosis, not adjudication. They need clarity on whether this is verbal, substantive, or cross-purposed. What counts as data for each side? Intuitions? Formal rationality? Metaphysics? Institutions? And is there a bedrock intuition about temporal partiality that's inarguable from shared premises? Finally, what would constitute progress here?

  Let me unpack the two camps. Side A (Sidgwick/Ramsey) treats moral symmetry across time as axiomatic—like spatial non-arbitrariness. Their data: formal rationality principles (transitivity), moral universalizability, logical consistency. Side B sees agency as inherently present-bound: future people don't exist now, democratic institutions only represent present constituents, reasons require causal/epistemic access. Their data: phenomenology of action (we act *now*), institutional constraints, radical uncertainty about the future.

  Ah, the user's hypothesis feels correct—this is fundamentally about the metaphysics of reasons across time. But there's more: Side B smuggles in an unargued intuition that temporal presence confers normative privilege. That's their bedrock. Side A's bedrock is temporal neutrality as a corollary of impartiality. 

  The disagreement is substantive and cross-purposed. Side A asks "What is impartially right?" while Side B asks "What can present agents rationally/practically do?" The climate math is surface-level; the deep conflict is between externalist morality (reasons exist independently) vs internalist agency (reasons must be actionable now).

  Progress wouldn't come from more discounting debates. Three paths: 
  1) Formal decision theory showing how temporal neutrality emerges from weaker axioms (unlikely). 
  2) Empirical work on "causal entanglement" (e.g., how present acts constitutively shape future identities). 
  3) Metatheoretical shift—accepting this as a true antinomy. The stalemate is likely permanent because it traces to irreconcilable bedrock intuitions: temporal neutrality vs. agential presence. No deeper ground exists.

  The user's group might find relief in mapping this explicitly: they're having two distinct conversations. Recognizing that could transform frustration into clarity, even without resolution.
answer: |-
  Your diagnosis is perceptive: the core disagreement is **substantive and cross-purposed**, rooted in incompatible foundational commitments about agency, reasons, and moral ontology. Neither side treats the same phenomena as primary data, and both rely on bedrock intuitions that resist derivation from shared premises. Here’s a breakdown:

  ### **1. The Two Sides’ Divergent "Data" and Commitments**
  | **Side A (Sidgwick/Ramsey/Temporal Neutrality)**          | **Side B (Structural Time Preference)**                     |
  |-----------------------------------------------------------|------------------------------------------------------------|
  | **Core Data**: Logical consistency, formal symmetry (temporal/spatial). Treats morality as a set of timeless, agent-neutral truths. | **Core Data**: Phenomenology of agency, institutional constraints, radical uncertainty about future persons/states. |
  | **Key Intuition**: Arbitrary discrimination (e.g., privileging "here" over "there") is morally impermissible. Time is a morally irrelevant coordinate. | **Key Intuition**: Agency is inherently situated in the present; reasons require causal/epistemic access *now*. |
  | **Metaphysical Commitment**: Moral reasons exist independently of agents’ epistemic/causal limitations (Platonist/objectivist). | **Metaphysical Commitment**: Reasons must be actionable within an agent’s practical context (pragmatist/internalist). |
  | **What They Can’t Argue From Shared Premises**: That temporal neutrality is a necessary truth of morality. | **What They Can’t Argue From Shared Premises**: That "present actuality" confers normative privilege. |

  ### **2. The Cross-Purposed Conversation**
  - **Side A** is arguing from **normative ethics**: "What *ought* to be done impartially?"  
  - **Side B** is arguing from **practical rationality**: "What *can* be done by situated agents under constraints?"  
  Their disagreement isn’t about discount *functions* but about the **scope of moral reasons**:  
  - Side A sees future welfare as a *present moral fact* demanding action.  
  - Side B sees future welfare as a *contingent consideration* that only gains normative force if it can be integrated into present decision-making (e.g., via institutions, risk models, or identity continuity).  

  ### **3. The Bedrock Intuition Dividing Them**
  The irreconcilable foundation is a **tension in partiality**:  
  - Side A’s bedrock: *Diachronic impartiality* is non-negotiable (treating all times alike is as basic as treating all persons alike).  
  - Side B’s bedrock: *Synchronic agency* is non-negotiable (reasons must be anchored to the agent’s *current* cognitive and causal state).  
  Neither can "prove" their intuition; each sees the other’s starting point as question-begging.  

  ### **4. Diagnosis: Why the Stalemate is Structural**
  - **Verbal?** No. Both sides agree on definitions (e.g., "pure time preference" = discounting for futurity alone).  
  - **Substantive?** Yes, but not resolvable through normative argument alone. The conflict arises from deeper commitments:  
    - Side A prioritizes **moral ontology** (reasons exist independently of agents).  
    - Side B prioritizes **moral psychology** (reasons must be psychologically actionable).  
  - **Cross-purposed?** Crucially. Side A discusses *ideal obligations*, while Side B discusses *feasible prescriptions*.  

  ### **5. Paths to Progress (Not Resolution)**
  Given the foundational divide, "progress" means clarifying the disagreement or shifting frameworks:  
  - **Conceptual Distinction**: Explicitly separate:  
    - (a) *Ideal morality* (temporally neutral welfare weights)  
    - (b) *Practical rationality* (discounting under uncertainty/agency constraints)  
    Climate economics then becomes a negotiation between (a) and (b), not a battleground.  
  - **Empirical/Formal Insight**: A decision-theoretic model showing that temporal neutrality *emerges* from weaker axioms (e.g., if future persons’ interests are causally entangled with present acts). Example: If identity is relationally constituted (e.g., "our" future selves are shaped by current choices), pure time preference may violate rational self-interest.  
  - **Institutional Innovation**: Designing democratic structures that *simulate* temporal neutrality (e.g., future assemblies, constitutional commitments). This sidesteps metaphysics by making future welfare institutionally actionable now.  
  - **Metaphysical Clarification**: If Side B concedes that future persons are *determinately real* (though not actualized), their reasons might gain traction. Conversely, if Side A acknowledges that *moral motivation* requires psychological mediation, practical discounting becomes a tragic necessity.  

  ### **6. Is the Stalemate Permanent?**
  **Yes**, if both sides insist their bedrock intuition is axiomatic. The disagreement reduces to:  
  > *Must impartiality override situated agency, or is agency the precondition for any moral reason to apply?*  

  This mirrors irreconcilable divides in metaethics (e.g., objective vs. subjective reasons). The stalemate lifts only if:  
  - Side B accepts temporal neutrality as a *regulative ideal* (even if unachievable in practice), or  
  - Side A admits that *feasibility* morally licenses discounting (rendering it "impure" but unavoidable).  

  **Conclusion**: Your hypothesis is correct—the core conflict is about the **nature of diachronic reasons**. Progress requires mapping the disagreement onto distinct domains (ideal/practical) or finding decision-theoretic structures that reconcile temporal neutrality with situated agency (e.g., via "overlapping generations" models). Absent this, the debate will remain a dialogue between moral geometry and moral psychology, with neither side yielding ground.
