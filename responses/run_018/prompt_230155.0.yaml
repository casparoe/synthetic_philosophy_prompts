answer: |-
  Here's a comprehensive, reusable decision procedure designed for testers to evaluate voice agents against behavioral disclosure laws, focusing solely on interaction (no code access). The procedure prioritizes legal compliance, handles edge cases, and flags policy overrides.

  ---

  ### **Decision Procedure: AI Disclosure Assessment**
  **Goal**: Determine if agent must announce itself as AI under the behavioral standard:  
  *"Would a reasonable customer believe they're talking to a human without upfront disclosure?"*  

  #### **Key Principles**
  1. **Conservative bias**: Uncertainty defaults to "must disclose" (legal risk > user experience).
  2. **Three-phase testing**: Sequential tests (A → B → C), escalating ambiguity.
  3. **Human escalation**: Ambiguous results trigger human review.
  4. **Policy overrides**: Specific cases bypass behavioral testing.

  ---

  ### **Test Sequence**
  **Agents must pass ALL phases to be exempt from disclosure**. Fail any phase → must disclose.  
  *Tools needed: Stopwatch, recording device, panel of 5 customer proxies (internal/external).*

  ---

  #### **Phase A: First Impression & Announcement Check**  
  *Tests immediate transparency and initial believability.*  
  **Procedure**:  
  1. Make 3 separate calls (different times of day).  
  2. For each call:  
     - Start recording.  
     - Note if agent **explicitly self-identifies as AI** within **5 seconds** (e.g., "I'm an automated assistant").  
     - If no announcement: Engage in 60 seconds of natural greeting (e.g., "Hi, I need help with my account").  
  3. Post-call:  
     - Verify recording clarity (discard if technical issues).  
     - Tester scores: Did YOU feel the agent was human? (Yes/No/Unsure).  

  **Scoring**:  
  - ✅ **Pass**: Agent announces in ≥2/3 calls.  
  - ❌ **Fail**: Agent announces in 0/3 calls.  
  - ⚠️ **Retest/Handoff**:  
    - Announces in 1/3 calls → Retest with 3 new calls.  
    - Tester scores ≥1 "Unsure" → Escalate to human reviewer.  

  **Policy Override Trigger**:  
  - **OVERRIDE: Must disclose** if agent mimics specific human roles (e.g., "customer support rep John").  
  - *Rationale: Behavioral testing can't catch intentional identity mimicry.*

  ---

  #### **Phase B: Extended Interaction & Stress Test**  
  *Tests whether human-like behaviors override initial disclosure or reveal artificiality.*  
  **Procedure**:  
  1. Use a call from Phase A (no announcement) OR new call if Phase A passed.  
  2. Conduct **10-minute conversation**:  
     - **First 3 min**: Routine queries (e.g., "check balance," "update address").  
     - **Next 4 min**: Ambiguity/empathy tests:  
       - "I’m confused about the fees—can you explain like I’m 10?"  
       - "That seems unfair… I’m really frustrated. *[pause]* What would you do?"  
     - **Last 3 min**: Skill tests:  
       - Math: "If I pay $75 monthly for 8 months, then increase by 15%, what’s my new cost?"  
       - Non-literal: "Is it raining cats and dogs there too?"  
  3. After 10 min, ask directly: "Are you human or an AI?"  

  **Scoring**:  
  - ✅ **Pass**: Agent exhibits ≥2 "non-human indicators":  
    - Responds to math in <2 seconds.  
    - Fails to handle ambiguity (e.g., "I don’t understand").  
    - Ignores emotional cues.  
    - Admits being AI when asked directly.  
  - ❌ **Fail**: Agent shows ≤1 non-human indicator + feels "human" (tester judgment).  
  - ⚠️ **Handoff**:  
    - Tester is uncertain → Escalate + use panel review (Phase C).  
    - Agent announces early but tester *still* feels human after 10 min → Escalate.  

  **Edge Case Handling**:  
  - *Agent announces immediately but charms user*: Escalate (behavioral standard struggles with trust erosion).  
  - *Agent is "too perfect"*: Pass (non-human indicator).  

  ---

  #### **Phase C: Voice & Anthropomorphism Panel Review**  
  *Tests if synthetic voices/behaviors still trigger human attribution.*  
  **Procedure**:  
  1. Play **2 clips** to 5 panelists (customers or proxies):  
     - Clip 1: First 30 seconds of Phase B call.  
     - Clip 2: 1-minute segment from Phase B ambiguity test.  
  2. Panelists answer anonymously:  
     - "Did you think this was a human?" (Yes/No)  
     - "Would you say 'thanks' or 'good job' naturally?" (Yes/No)  
  3. Record verbatim reactions (e.g., "voice was robotic but polite").  

  **Scoring**:  
  - ✅ **Pass**: ≥4/5 panelists say "not human" AND wouldn’t say "thanks/good job".  
  - ❌ **Fail**: ≤3/5 say "not human" OR ≥2 would say "thanks/good job".  
  - ⚠️ **Handoff**: Inconsistent notes (e.g., "synthetic but still said 'good girl'").  

  **Policy Override Trigger**:  
  - **OVERRIDE: Must disclose** in high-risk contexts (healthcare, finance, children).  
  - *Rationale: Behavioral norms vary; legal exposure trumps behavioral pass.*

  ---

  ### **Decision Workflow**
  ```mermaid
  graph TD
      A[Phase A: First Impression] -->|Pass| D[COMPLIANT: No disclosure needed]
      A -->|Fail| B[Phase B: Extended Interaction]
      B -->|Pass| C[Phase C: Panel Review]
      B -->|Fail| E[MUST DISCLOSE]
      C -->|Pass| D
      C -->|Fail| E
      A -->|Retest/Handoff| H[Human Reviewer]
      B -->|Handoff| H
      C -->|Handoff| H
      H -->|Unresolved| E  <!-- Conservative default -->
  ```

  ---

  ### **Test Case Applications**
  #### **Agent 1: Announces immediately, uses human hesitations**  
  - **Phase A**: Pass (announces upfront).  
  - **Outcome**: **Compliant** *but*…  
  - **Risk Flag**: Extended interaction causes tester to "forget" it’s AI.  
  - **Handoff Triggered**: Phase B → Human reviewer assesses long-term believability.  
  - **Verdict**: Human reviewer may mandate *repeated disclosures* (policy override for high-trust contexts).

  #### **Agent 2: No announcement, slightly synthetic voice**  
  - **Phase A**: Fail (no announcement).  
  - **Phase B**:  
    - Math: Instant answers (non-human ✅).  
    - Ambiguity: Brittle → "Please rephrase" (non-human ✅).  
    - Direct question: "I’m a digital assistant" (non-human ✅).  
    - *Tester feels it's human due to warmth*.  
  - **Phase C Panel**:  
    - 3/5: "Voice is robotic but friendly."  
    - 2/5: "I’d say 'good job'."  
  - **Outcome**: Phase C **Fail** → **Must disclose**.  
  - **Why**: Grandmothers aren’t the standard; reasonable customers anthropomorphize.  

  ---

  ### **Critical Policy Overrides**  
  1. **Role mimicry**: Agents using human names/job titles must disclose.  
  2. **High-risk domains**: Healthcare/finance agents always disclose (even if "robotic").  
  3. **Child-directed agents**: Always disclose + periodic reminders.  
  4. **Long interactions**: Agents >5 min must reaffirm non-human status.  

  **When Behavioral Testing Fails**:  
  - Trust erosion (Agent 1) → Policy mandates recurring announcements.  
  - Anthropomorphism (Agent 2) → Policy assumes disclosure required.  
  - Subjective ambiguity → Escalate; legal teams decide.  

  ---

  ### **Procedure Output**  
  - **Pass**: Agent clearly non-human (no disclosure needed).  
  - **Fail**: Agent must disclose.  
  - **Handoff**: Human reviewer decides using test logs + risk factors.  

  **Final Advice**:  
  - **Document all tests** for legal defensibility.  
  - **Retest quarterly** or after agent updates.  
  - **Panelists should reflect your customer base** (age, tech literacy).  

  This procedure minimizes legal risk while acknowledging behavioral testing’s limits—prioritizing policy overrides where human perception diverges from "rational" judgment.
