answer: |-
  Here's a breakdown of the different interpretations of "you can't judge people from the past by today's standards," their plausibility, and their relevance to the statue debate – especially given your key point about contemporary criticism:

  **Core Interpretations of the Slogan:**

  1.  **The Epistemic Limitation Thesis ("They Didn't Know Better"):**
      *   **Claim:** People in the past lacked the knowledge, understanding, or social context necessary to recognize the wrongness of certain actions (e.g., slavery, colonialism, treatment of indigenous peoples) that we now condemn. Judging them by *our* standards is unfair because they *could not have known* those standards or the reasons behind them. Blame requires the capacity to know better.
      *   **Platitude/Defensible/False?** **Substantive & Partly Defensible, but Context-Sensitive.** This is often the *intended* meaning. It's plausible for many complex issues where moral understanding evolved gradually with new information (e.g., germ theory changing medical practices, deep time changing views on creation). **However, it's demonstrably false in cases where contemporaries *did* vocally criticize the practice.** Your point about the figure being criticized *in his own time* is crucial here – it directly undermines this thesis for *this specific case*. He *could* have known better; arguments against his actions *were* available. This thesis likely fails for your uncle's argument.
      *   **Relevance to Statue:** If true, it might suggest removing the statue is "unfair" punishment for ignorance. But if false (due to contemporary criticism), this justification evaporates. It doesn't inherently argue *against* moving it to a museum (which can provide context).

  2.  **The Blame/Responsibility Distinction Thesis ("It Was Wrong, But They Aren't Blameworthy"):**
      *   **Claim:** We *can* and *should* morally judge the *actions* or *institutions* of the past as wrong by *our* (or universal) standards. However, we should be cautious or refrain from assigning full *personal blame* or *moral condemnation* to the *individuals* involved, due to the pervasive influence of their social context, upbringing, lack of alternatives, or epistemic limitations (even if partial knowledge existed). The slogan confuses judging the *act* with judging the *actor*.
      *   **Platitude/Defensible/False?** **Widely Accepted Philosophical Distinction (Platitude in ethics).** Most philosophers agree that the *wrongness* of an act is distinct from the *blameworthiness* of the agent. Factors like coercion, ignorance (even partial), and pervasive social norms *can* mitigate blame without excusing the act itself. This is a strong point.
      *   **Relevance to Statue:** This is a powerful tool *against* simplistic vilification but **doesn't automatically justify keeping a statue in a place of honor.** You can acknowledge contextual factors reducing *personal blame* while still arguing that commemorating someone primarily associated with (even contextually mitigated) wrongs is inappropriate for a *main square*. It might even support moving it to a museum where this nuance can be explored. The slogan alone doesn't get the uncle to "leave it up"; it just asks for nuance in judgment.

  3.  **Moral Relativism Thesis ("Moral Facts Changed"):**
      *   **Claim:** Moral truth itself is relative to specific times and cultures. What was "right" in the past *according to the moral facts of that era* is genuinely different from what is "right" now. Judging past actions by today's standards is therefore an error, like applying the wrong measuring stick – it's not just unfair, it's *incorrect*.
      *   **Platitude/Defensible/False?** **Highly Contested & Generally Rejected by Professional Philosophers.** While cultural differences exist, strong moral relativism faces serious problems:
          *   **Incoherence:** If morals are truly era-bound, how can we condemn *any* past atrocity (e.g., Nazi Germany)? Was slavery "right for its time"? This conclusion is repugnant and undermines moral progress.
          *   **Internal Contradiction:** The thesis itself ("don't judge by different standards") claims a universal moral standard (tolerance/non-judgment across eras), contradicting its own relativism.
          *   **Contested Standards:** As you note, eras rarely have a single, monolithic "standard." Whose standard counts? The slave owner's? The abolitionist's? Relativism struggles with internal dissent.
      *   **Relevance to Statue:** If true, it would forbid moral criticism of the past *entirely*, potentially justifying the statue. **However, since this view is philosophically weak and clashes with the fact of contemporary criticism (showing dissent *within* the era), it's a poor foundation for your uncle's argument.**

  4.  **The Anti-Presentism/Caution Against Smugness Thesis ("Beware Your Own Blind Spots"):**
      *   **Claim:** The slogan is primarily a warning against "presentism" – the uncritical assumption that our current views are superior and the only valid ones. It reminds us that:
          *   Future generations will likely condemn aspects of *our* lives we consider normal/acceptable.
          *   We risk misunderstanding the past by projecting our concerns onto it, losing sight of their genuine motivations and constraints.
          *   We should approach the past with humility and a focus on understanding context *first* before rushing to moral condemnation.
      *   **Platitude/Defensible/False?** **Largely a Platitude (among historians/philosophers) & Defensible.** It's widely acknowledged that presentism is a significant pitfall in historical understanding and moral reflection. Future criticism of us is near-certain.
      *   **Relevance to Statue:** This is a valuable *caution*, but **not a justification for leaving the statue up.** It urges careful contextual thought before acting, but doesn't dictate the outcome. It might even support moving the statue *to a museum* as a more appropriate place for contextualized understanding, rather than celebratory commemoration. It primarily fights against *smug condemnation*, not necessarily against *re-evaluation of commemoration*.

  **Addressing Your Specific Points:**

  1.  **"Standards of his time were contested":** This is **crucial and a major weakness** in the common use of the slogan. The slogan often **implicitly assumes a monolithic "standard of the time," which is almost always false.** Societies contain dissent, moral arguments, and evolving views. If contemporaries criticized the figure, then:
      *   The Epistemic Thesis ("couldn't know better") is significantly weakened or destroyed.
      *   The Moral Relativism Thesis becomes incoherent (which standard is "the" standard?).
      *   The Blame Thesis becomes more complex – pervasive norms might still mitigate *individual* blame, but the existence of criticism shows the wrongness *was* recognized by some contemporaries.
      *   **This directly undermines any simple appeal to "the standards of the time" as an automatic justification.** You *can* judge him, in part, *by some of the standards of his own time* (the critical ones).

  2.  **What Commemoration Is (History vs. Honor):** This is **absolutely central and a live public debate.**
      *   **Statue as Pure History:** If a statue is *only* a historical record (like a plaque marking an event), then arguments for removal are weaker. Context might suffice. (But statues in main squares rarely serve *only* this purpose).
      *   **Statue as Commemoration/Honor:** Public statues, especially in prominent civic spaces, are overwhelmingly understood as expressions of *honor*, *admiration*, and values a community chooses to *celebrate*. This is the key issue.
      *   **Relevance:** The slogan arguments (especially Epistemic Limitation and Blame Mitigation) might be used to argue the figure *deserves* honor *despite* flaws, given their context. **However:**
          *   Contemporary criticism severely weakens this ("even his peers saw the flaws").
          *   We decide *who to honor now, based on our current values and full understanding*. We don't *have* to honor someone whose actions (even if partly contextually explained) conflict profoundly with fundamental values we hold *today* (e.g., equality, human rights). Context explains, but doesn't necessarily *redeem* for the purpose of public celebration.
          *   Moving to a museum is often framed as shifting from *honor* to *history/context*, which the Blame and Anti-Presentism theses might actually *support* as a more nuanced approach.

  **The Philosophical Landscape:**

  *   **Settled (Near Consensus):**
      *   The distinction between the *wrongness* of an act and the *blameworthiness* of the agent is fundamental and valid (Thesis 2).
      *   Strong Moral Relativism (Thesis 3) is philosophically untenable for the reasons above. Moral truth is not simply relative to eras.
      *   Presentism is a significant problem in historical and moral reasoning (Thesis 4 is a valid caution).
      *   Historical eras rarely possessed a single, uncontested moral "standard" (Your key point is widely accepted).
  *   **Live Disputes:**
      *   **Degrees of Blame Mitigation:** *How much* does context (even without total ignorance) mitigate personal blame? How do we weigh pervasive norms against available dissent? (Thesis 2 application).
      *   **The Nature of Commemoration:** What is the purpose of public monuments? Who *should* be honored, and by what criteria? How do we balance historical significance with contemporary values? **This is the core of your statue debate and is fundamentally a political/ethical question, not one with a single philosophical answer.**
      *   **Applying Moral Judgment Across Time:** While relativism is rejected, *how* we constructively and fairly apply modern moral frameworks to the past, acknowledging vast differences in context, remains complex (The interplay of Theses 1, 2 & 4).

  **Which Thesis Gets Your Uncle to "Leave the Statue Up"?**

  1.  **Moral Relativism (Thesis 3):** If true, it forbids criticism. But it's weak and crumbles under contemporary criticism.
  2.  **Strong Epistemic Limitation (Thesis 1):** If he truly *couldn't* have known better, it might justify honoring him *despite* the acts. But contemporary criticism destroys this for your specific case.
  3.  **Blame Mitigation + Commemorative Value (Thesis 2 + Commemoration Argument):** This is his **most plausible path:**
      *   Concede the *actions* were wrong (even by some past standards).
      *   Argue that *he* isn't fully blameworthy due to context/mitigating factors.
      *   Argue that his *overall contribution* (e.g., founding the city, military victories) was sufficiently positive and historically significant *despite* the flaws.
      *   Argue that the statue honors *those* contributions and the *era* (warts and all), not the specific wrongs.
      *   Claim removing it is "erasing history" or capitulating to unfair modern condemnation (leveraging Thesis 4 cautiously).
      *   **Weaknesses:** Requires downplaying the significance of the wrongs *he was criticized for then*, and convincing people that honoring him *now* is still appropriate. The existence of past criticism makes this harder.

  **The Menu for Your Uncle:**

  "Uncle, that slogan 'can't judge by today's standards' gets used a lot, but it actually masks several different arguments, some stronger than others. Which one do you mean?

  1.  **They couldn't have known better?** But we know critics *in his own time* called him out for this stuff. So that doesn't seem to apply here.
  2.  **The acts were wrong, but we shouldn't blame *him* as harshly because everyone was doing it/that's how he was raised?** That's a fair point about individual responsibility. But does that mean we need to keep *honoring* him in the main square? Maybe we can acknowledge his role historically in the museum without celebrating him.
  3.  **Morality itself was different back then, so his actions weren't wrong?** This gets really messy. Does that mean we can't condemn *any* historical wrong if it was accepted by some? That also ignores the critics *in his own time* who thought it *was* wrong.
  4.  **We shouldn't be smug; future people will judge *us* too?** Absolutely, we should be humble! But that doesn't mean we can't make decisions *now* about who we publicly honor based on our best understanding. It might even suggest putting the statue in a museum where that full context, including the criticism he faced then, can be explained.

  Given that people *at the time* criticized him for these things, the 'standards of his time' argument doesn't hold up easily. The tougher question is: even if we understand the context and maybe don't blame *him* as an individual as much, is keeping his statue in the prime spot the right way to record our history, or is it actively honoring someone whose actions clash too much with what our city values today? That's what we're really debating."

  This approach avoids a counter-slogan. Instead, it clarifies the underlying arguments, highlights the critical weakness (contemporary criticism), separates judging the person from commemorating them, and focuses the debate on the actual contested point: what does the statue *mean* and what should we *do* with it *now*?
