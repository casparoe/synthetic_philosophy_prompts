prompt: |-
  I'm trying to map out what actually matters in teh philosophy of collective blame for WWI now that Fischer's intentionalist thesis has been largely replaced by teh sleepwalking narrative. There are a few conceptual knots that keep coming up but I'm not sure which ones are dead ends and which sit upstream of the others.

  First, there's the old question of whether 'holding a nation responsible' requires that the nation had a unified intentional state, or wether distributed institutional recklessness counts — the kind where no single person decided on war but bureaucratic incentives made escalation inevitable. Second, there's a diachronic problem: if the collective agent 'Germany' in 1914 is not the same social entity as teh Federal Republic today, does blame attach to the state-structure rather than the people, and does that change what apologies or reparations actually mean? Third, there's this newer idea I've been playing with about 'structural culpability' — responsibility that lives in the gaps between decision-makers rather than in any single will, a bit like institutional racism without individual blame. I don't know if that's a useful distinction or just relabelling.

  So if you had to advise someone with about two years to spend on this, which two or three lines should I prioritise? I'm particularly interested in which ones are tractable for conceptual philosophy rather than historical research, and which ones, if settled, would change how we think about collective responsibility elsewhere — corporate harm, climate negligence, that sort of thing. Also, which depend on each other? For instance, does settling the diachronic identity question make structural culpability easier, or are they independant? Give me a defended ordering, not just a list, and be honest about which you'd drop because they don't change much downstream.
