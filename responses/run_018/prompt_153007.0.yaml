answer: |-
  ### Binding-Policy Game: Philosophy of Science Seminar Activity  
  **Total Time:** 75 minutes  
  **Participants:** 10 graduate students (9 as Copy-Agents, 1 as Auditor). Facilitator acts as Moderator.  

  ---

  #### **1. Setup and Rules (10 min)**  
  **Setting:** Three isolated rooms (A/B/C) with partitions. Each room has a table labeled only as "Room X."  
  **Roles:**  
  - **Copy-Agents (9 students):** Each represents an identical agent with "copies" across rooms.  
  - **Moderator (Facilitator):** Secretly assigns one room (e.g., A) as frequency-weighted ("F-room"), the others (B/C) as commitment-weighted ("C-rooms"). Reveals outcomes but never room types or cross-room data.  
  - **Auditor (1 student):** Records global precommitments, tracks cross-room consistency, and enforces binding policies.  

  **Rules & Payoffs:**  
  - **Precommitment:** Each Copy-Agent secretly chooses a strategy card (**Cooperate (C)** or **Defect (D)**). Cards are locked; this binds all their "copies" in every room for **Round 1**.  
  - **Room Payoffs:**  
    - **F-room:** Payoffs based on *local actions* (public goods game).  
      - Each C pays 1 unit but adds 3 units to the room’s pool (shared equally).  
      - Each D pays 0 but shares the pool.  
      *Example:* With 3 players: 2C + 1D → Pool = 6 units. Each C gets (6/3) - 1 = **1**; D gets 6/3 = **2**.  
    - **C-rooms:** Payoffs based on *global precommitment*.  
      - If ≥5 of 9 agents precommitted to C, **all** in C-rooms get **2**.  
      - Else, **all** get **0**.  
  - **Stakes:** Points convert to snacks (e.g., 1 point = $0.10 snack budget). Total welfare = sum of *all* points across rooms.  
  **Information Constraints:**  
  - Agents see only their room’s outcome (no room type, no cross-room data).  
  - After each round, agents decide to **maintain** or **update** their strategy for the next round. Updating binds *all* copies.  

  ---

  #### **2. Activity in Play (45 min)**  
  **Round 1 (15 min):**  
  - **Precommitment (5 min):** Agents secretly choose C/D. Auditor locks cards.  
  - **Assignment:** Moderator randomly assigns agents to rooms (3 per room).  
  - **Outcome:**  
    - Moderator computes payoffs:  
      - F-room: Payoffs based on actual local choices (e.g., 2C+1D → C gets 1, D gets 2).  
      - C-rooms: Payoffs based on global C-majority (e.g., if 5C precommit, all get 2; else 0).  
    - **F-room agents** see individual payoffs and room distribution (e.g., "You: C, Payoff=1; Others: C, D").  
    - **C-room agents** see only uniform payoffs (e.g., "All in this room: 2").  

  **Revision & Rounds 2–3 (30 min):**  
  - **Revision (Post-Round 1 & 2; 5 min each):**  
    - Each agent decides: **Maintain** original strategy or **Update** (switch C↔D) for next round. Decision binds all copies.  
    - Auditor enforces consistency (e.g., if an agent updates, *all* their copies use the new strategy).  
  - **Rounds 2–3:** Repeat assignment, outcome, and revision. Moderator uses *same* hidden room types (F vs. C).  

  **Moderator’s Hidden Operation:**  
  - F-room: Always calculates payoffs from *local actions*.  
  - C-rooms: Always calculate payoffs from *global precommitment* (majority C = 2; else 0).  
  - *Example Tension:*  
    - If F-room has 2C+1D (C gets 1, D gets 2), C-agents see D "won" locally. Updating to D may maximize *their* next F-room payoff.  
    - But if many update to D, global C-majority collapses → C-rooms get 0, crashing total welfare.  

  ---

  #### **3. Debrief and Mapping (20 min)**  
  **Link Game Moments to UDT:**  
  - **"Refusal to Update" as Rational:** When an F-room agent keeps C despite seeing D "win," highlight:  
    - *"Your observation only proves defection worked* here *— but does it say anything about other rooms? Updating to D might doom copies in C-rooms."*  
    - This mirrors UDT’s rejection of conditioning on indexical evidence (e.g., "I am in *this* branch").  
  - **Moderator = Hidden Branches:** The Moderator’s refusal to reveal cross-room data mirrors an agent’s lack of access to "other branches" in UDT.  
  - **Precommitment = UDT Policy:** Choosing C/D initially maximizes *expected* welfare across all rooms, akin to UDT’s "policy first" approach.  

  **Predictable Failure Mode & Redirection:**  
  - **Failure:** Students conflate "no update" with stubbornness or loyalty.  
  - **Redirect:** Ask: *"What evidence did your F-room observation provide about C-rooms? If none, is updating rational or myopic?"* Emphasize that local data is uninformative about other branches.  

  **What the Activity Can’t Reproduce:**  
  - The *formal UDT calculation* (expected utility over branches) and the *evidential vs. causal decision theory* distinction. The facilitator must:  
    1. Verbally explain UDT’s math: "Optimize the policy *before* branch-indexing, not after."  
    2. Contrast with EDT ("Update on all evidence, including indexicals") and CDT ("Focus on local causality").  

  ---

  #### **4. Honest Limitations (5 min)**  
  **Execution Risks:**  
  - **Room assignments may dilute tension:** If F-room gets all-C/all-D, agents miss the payoff contrast. *Mitigation:* Moderator may rig Round 1 assignments (e.g., ensure F-room has 2C+1D) while feigning randomness.  
  - **C-room agents may update randomly:** If they get 2, they might complacently keep C; if 0, panic-update. *Mitigation:* Stress that C-room payoffs reveal *global* success/failure, not local causality.  
  - **Students may defect preemptively:** If they distrust peers, precommitment collapses. *Mitigation:* Warn that total welfare plummets if C-majority is lost.  

  **Facilitator Adds:**  
  - Post-game, derive the UDT equilibrium: *Precommitting C* maximizes expected welfare (≈14 points/round) vs. *updating* (≈4 points/round after collapse).  
  - Clarify that "binding" is not interpersonal loyalty but *counterfactual consistency across branches*.  

  ---  
  **Outcome:** Students experience the visceral clash between Bayesian updating ("I saw D work!") and updateless rationality ("But my copies depend on C"). The payoff matrix ensures individual updates "feel" rational locally but are collectively catastrophic, mirroring UDT’s core tension.
