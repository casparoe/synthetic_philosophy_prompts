  ...Wait, is the user building this for a dissertation? The demand for "non-negotiable" requirements and joint unsatisfiability smells like thesis work. Or maybe they're prepping for a conference debate. Either way, they need steelmanning, not textbook summaries. Better avoid camp advocacy and focus on structural tensions. The unsatisfiability angle is key—if the desiderata can't coexist, that's actually a valuable conclusion. 

  On drafting the response: I'll define the desiderata clinically, then let the stress-test expose the theory's guts. The "non-negotiable" labels must be defensible—e.g., excluding Allied conduct isn't a preference but a necessary hurdle because ignoring it makes the tribunal indistinguishable from revenge. And I'll explicitly call out why #ii butchers existing theories: it forces them to either condemn the tribunals (which they might not want to do) or admit victor bias (which destroys legitimacy).
answer: |-
  Below is a full specification for a normative theory of **Legitimacy Under Structural Asymmetry (LUSA)**, designed to adjudicate the legitimacy of post-defeat tribunals like Nuremberg and Tokyo. The theory prioritizes *procedural integrity*, *moral coherence*, and *systemic function* over strict legal positivism, while demanding explicit justifications for deviations from peacetime legal norms.

  ---

  ### **Desiderata with Justifications**  
  *(Non-negotiable requirements marked with ★)*  

  1. **★ Retroactive Prosecution of Crimes Against Peace/Humanity**  
     - **Phenomenon**: Prosecuting "crimes against peace" (aggression) and "crimes against humanity" not codified in binding international law pre-1945.  
     - **Requirement**: The theory must explain why retroactivity was normatively permissible *despite* violating *nullum crimen sine lege*.  
     - **Reason**: Avoiding this question reduces tribunals to ex post facto revenge. Justification must appeal to universal moral principles or emergent customary law, not victors' fiat.  

  2. **★ Exclusion of Allied Conduct**  
     - **Cases**: Strategic bombing (Dresden, Tokyo firebombing), atomic weapons (Hiroshima/Nagasaki), Soviet atrocities (Katyn).  
     - **Requirement**: Explain why asymmetric jurisdiction (trying only Axis crimes) does not invalidate proceedings as "victors' justice."  
     - **Reason**: Victor hypocrisy is the core criticism. A theory ignoring this fails the "impartiality" test fundamental to justice.  

  3. **Collective vs. Individual Guilt**  
     - **Distinction**: Nuremberg convicted *organizations* (SS, Gestapo) but tried individuals; Tokyo prosecuted cabinet decisions as conspiratorial.  
     - **Requirement**: Justify individualized responsibility for systemic crimes without conflating national guilt with personal culpability.  
     - **Reason**: Essential to differentiate criminal justice from collective punishment (a war crime itself).  

  4. **Rejection of *Tu Quoque***  
     - **Case**: Tokyo defendants citing Western colonialism/atomic bombing; Nuremberg defendants citing Allied bombing.  
     - **Requirement**: Defend why defendants cannot appeal to victors' similar acts as a defense.  
     - **Reason**: Legitimacy requires consistency—rejecting *tu quoque* must rest on principle (e.g., irrelevance to defendant’s guilt), not ad hoc bias.  

  5. **★ Consistency with *Nullum Crimen Sine Lege***  
     - **Requirement**: Either (a) reconcile retroactivity with a defensible interpretation of the principle, or (b) justify overriding it via superior normative authority.  
     - **Reason**: The bedrock legal maxim; discarding it risks legitimizing arbitrary power.  

  ---

  ### **Stress-Test Case**  
  **Scenario**: A 1950 tribunal tries leaders of "Neutralia," a state that:  
  - Never ratified Kellogg-Briand (1928) or the London Charter (1945).  
  - Used these treaties' language ("renunciation of war," "crimes against humanity") in domestic propaganda.  
  - Launched an unprovoked aggressive war in 1948.  

  **LUSA Analysis**:  
  - **Moral-Universalist Foundation**: Prosecution is *permitted*. Aggression and atrocities violate *jus cogens* norms binding on all states, regardless of consent. Neutralia’s propaganda signals recognition of these norms, negating "unforeseeability."  
  - **Treaty-Positivist Foundation**: Prosecution *impermissible*. No consent = no obligation. Propaganda is not legal ratification.  
  - **Customary-Law Foundation**: Prosecution *conditionally permissible* if acts violated pre-1948 custom (e.g., Hague Conventions on warfare), but crimes against humanity likely lack sufficient state practice *opinio juris* pre-1945.  

  **Result**: LUSA endorses prosecution under a **customary-law+** framework: Kellogg-Briand crystallized aggression as a crime *for all states* by 1928, and Neutralia’s propaganda constitutes admission of the norm’s validity.  

  ---

  ### **Non-Negotiable vs. Negotiable Desiderata**  
  | **Desideratum**              | Non-Negotiable (★) | Negotiable (Camps) |  
  |------------------------------|--------------------|----------------------|  
  | Retroactive prosecution      | ★ (All theories)   | —                   |  
  | Exclusion of Allied conduct  | ★ (Impartiality)   | —                   |  
  | Individual guilt distinction | —                  | Strict positivists (prefer statute-based liability) |  
  | *Tu quoque* rejection        | —                  | Realists (see it as pragmatic) |  
  | *Nullum crimen sine lege*    | ★ (Rule of law)    | Natural law (if moral necessity overrides) |  

  **Joint Unsatisfiability**: The triad of **retroactivity**, **asymmetric jurisdiction**, and **strict adherence to *nullum crimen*** is unsatisfiable without a higher-order justification (e.g., "transitional justice exception"). LUSA resolves this by:  
  - Prioritizing *moral necessity* (atrocities demand accountability).  
  - Constraining deviations to *exceptional post-total-war contexts*.  
  - Demanding *procedural fairness* (right to defense, published judgments).  

  ---

  ### **Most Damaging Requirement to Existing Theories**  
  **★ Exclusion of Allied Conduct** (Desideratum ii):  
  - **Destroys**:  
    - **Strict Positivism**: Cannot explain jurisdiction gaps without admitting victor bias.  
    - **Natural Law**: Struggles with moral equivalence (e.g., if atomic bombing is a crime, why no trials?).  
    - **Realism**: Confirms tribunals as "victors' justice," undermining legitimacy claims.  
  - **Hybrid Institutionalist View**: Best equipped (argues institutional legitimacy trumps moral purity), but still must explain why victor crimes weren’t deferred to national courts.  

  ---

  ### **LUSA Theory: Core Axioms**  
  1. **Exceptional Context Principle**: Post-total-war tribunals operate under a constrained exception to peacetime legality, justified by:  
     - Civilizational rupture (e.g., Holocaust, Rape of Nanking).  
     - Absence of impartial global institutions.  
  2. **Moral Recognition Thesis**: Retroactive criminalization is legitimate if:  
     - The acts universally shock conscience (*malum in se*).  
     - Prior instruments (e.g., Kellogg-Briand, Hague Conventions) signaled normative direction.  
  3. **Asymmetric Integrity Test**: Jurisdictional asymmetry is permissible *only* if:  
     - Victor conduct, however immoral, differs *in legal category* (e.g., strategic bombing vs. death camps).  
     - Prosecutions target *individual mens rea*, not collective identity.  
  4. **Procedural Supremacy**: Legitimacy derives from:  
     - Public trials with robust defenses.  
     - Published judgments applying consistent reasoning.  
     - Rejection of *tu quoque* as legally irrelevant (defendant’s guilt stands alone).  

  ### **Verdict on Nuremberg/Tokyo**  
  Under LUSA:  
  - **Legitimate**: Retroactivity justified by moral recognition; *tu quoque* rightly excluded.  
  - **Deficient**: Failure to address Allied conduct *at all* (e.g., in obiter dicta) weakens moral authority. Tokyo’s conspiracy convictions stretch individualized guilt.  
  - **Foundational**: Created precedent for permanent ICC, satisfying systemic function.  

  ---  
  **Conclusion**: LUSA shows post-1945 tribunals were *imperfect but legitimate* justice, not victors' revenge. The stress-test proves its customary-law+ foundation avoids moral universalism’s overreach while rejecting positivism’s formalist blindness to extreme evil.
