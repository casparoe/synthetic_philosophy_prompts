prompt: |-
  I want to practice pressing the natural-law side of the Hart–Fuller debate in a setting that avoids the familiar post-war examples. Please play a committed Hartian legal positivist: sharp, ready to concede that morality and law often overlap in practice, but unyielding on the separability thesis—that a rule’s legal existence and content depend only on social sources, never on moral merit. Stay in character, reply in a single paragraph, and do not break role unless I say “stop”.

  Here is my opening move. I have recently been advising a task force drafting an automated administrative code: a fully deterministic algorithm applies a closed, public, non-retroactive rule-set to immigration decisions, and the enabling statute explicitly forbids any embedded moral evaluation. The outputs are consistent and predictable, yet systematically produce results that violate basic human dignity. I contend that this is not merely immoral law, but a defective instance of law itself, because Fuller’s principles of legality—generality, promulgation, non-contradictoriness, and the rest—are not merely instrumental efficiencies but internal moral commitments that constitute legal authority. Defend the view that this algorithmic regime is law in the fullest sense despite its moral horror, and address specifically whether the legislative exclusion of moral reasoning undermines Fuller’s claim that law possesses an “internal morality.” Do not invoke the classic Nazi-law hypotheticals; deal with the algorithmic closure directly.
reasoning: |-
  Okay, let me approach this Hart–Fuller debate scenario very carefully. The user wants to test Fuller's natural law position against a modern algorithmic system, avoiding worn-out Nazi law examples. They've constructed a thought-provoking case: an immigration decision algorithm that's perfectly deterministic and source-based but violates human dignity, asking whether this can truly be called law.

  Hmm, the core tension here is fascinating - the user is pressing whether procedural perfection without moral substance satisfies Fuller's "internal morality" requirement. As a Hartian positivist, I need to defend three key points: first, that legal validity stems solely from social sources (here, the enabling statute and algorithm); second, that Fuller's principles are merely instrumental; third, that excluding moral evaluation doesn't undermine the system's legal character.

  The user specifically wants me to address whether legislative exclusion of moral reasoning breaks Fuller's internal morality claim. I should emphasize that predictability and consistency - which this system delivers - are the actual essence of Fuller's principles, not some moral teleology. The horror of the outcomes, while deplorable, doesn't negate the system's legal nature under the separability thesis. 

  I must avoid conceding any moral ground while acknowledging the practical overlap they mentioned. The algorithmic closure actually strengthens my position - its determinism perfectly embodies Hart's "rules of recognition." Fuller's principles collapse into mere technical criteria here: the algorithm satisfies generality (applies uniformly), promulgation (public rules), non-contradiction (deterministic outputs), etc. 

  The challenge is to sound rigorously analytical without being callous about the dignity violations. I'll structure the response to first establish legal validity through sources, then dismantle the internal morality argument by reducing it to procedural checks, and finally separate the moral critique from legal existence. The enabling statute's explicit exclusion of moral reasoning is actually evidence for my position - it demonstrates conscious source-based validation.
answer: |-
  Your scenario presents a compelling challenge, but it fails to shake the positivist core: this algorithmic system *is* law, precisely because its validity derives solely from its enacted social source—the enabling statute establishing the closed rule-set and the deterministic algorithm as the exclusive decision-procedure. Fuller's principles of legality are satisfied *procedurally*: the rules are general, promulgated, non-contradictory, non-retroactive, possible to follow (as inputs are defined), relatively constant (as the algorithm applies them uniformly), and administered exactly as written (no human discretion). This meets the formal criteria for a legal system functioning *as a system of rules*. The systematic violation of dignity is abhorrent, but legally irrelevant to validity; it speaks to the law's wickedness, not its non-existence as law. Crucially, the legislative exclusion of moral reasoning *reinforces*, not undermines, the separability thesis. It demonstrates that a sovereign can deliberately create a source-based system devoid of moral evaluation in its application. Fuller's "internal morality" conflates efficacy with morality—predictability and consistency (which the algorithm provides) are instrumental goods for guiding conduct, not inherent moral commitments. That these formal goods produce substantively evil outcomes here exposes the error in Fuller's conflation: the system's efficiency in achieving its deplorable goals confirms its legal character, proving that law's authority stems from social fact, not moral desert. The horror lies in the moral choices of the lawmakers, not in a failure of legality itself.
