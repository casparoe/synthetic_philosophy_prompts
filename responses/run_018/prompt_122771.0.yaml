prompt: |-
  I write novels, and over the past several years a cluster of institutional habits surrounding work like mine has begun to look like a contradiction that I cannot state precisely enough either to accept or to argue with. I would like you to reconstruct the theory of meaning which these habits presuppose, and to tell me whether the habits can be held together.

  The practices, as concretely as I can put them:

  First, when a novelist dies with a series unfinished, the estate appoints a successor, the successor is paid to write *as* the dead author, and the book is sold under the dead author's name in the larger type with the successor's name beneath it. Fidelity is judged by whether the result reads like her. I have recently been advised to keep a document for exactly this purpose, and what struck me is what it is not: not a plot outline, not a list of events still to happen, but a set of constraints on the narrator — what she may not know, what she may not withhold, what she may not feel — together with notes on the dispositions of the recurring characters. The trade appears to believe that what makes a continuation *the same novel going on* is not the sequence of events but a voice specified largely by prohibitions. Relatedly, publishing contracts assign *the work and the characters therein* as if a character were an object detachable from the sentences in which it occurs and portable into sentences written by somebody else, long after I am dead.

  Second, and in apparent tension: when the living author says what her book means, the institutions that review and teach books treat that statement as at best one reading among others, and often as a mistake about her own authority — the familiar view, which I absorbed in workshops and which reviewers repeat as settled, that an author's avowed aim does not determine what her text says. Yet the same publishers, adapters, prize committees, and libel insurers keep asking me what I meant and keep treating the answer as settling something real: an authorised adaptation is authorised by my saying so, and a character's resemblance to a living person is defended by my saying I did not intend it.

  Third, for the archive: scholarly editions of modern novels are built to recover the text the author finally wanted, overriding the publisher's house style and sometimes overriding the author's own last printed revision where that revision looks coerced, tired, or made for money.

  What I want is the implicit theory, stated in plain English with each technical term explained when it is introduced, and argued rather than surveyed. Specifically:

  Does the continuation trade presuppose that a novel's identity consists in counterfactual facts about what its author *would have written*, and is that a different kind of thing from the author's intention about what her text *means*? I would like the relevant kinds of intention prised apart — intention in the writing, intention about the meaning of the finished text, intention about what comes next — and I want to know whether a person who denies the second any authority can lean on the third without inconsistency, or whether the two stand and fall together.

  Is the constraints document best explained by any intentionalist theory at all, or is it better explained by the thought that what is really being preserved is the reader's experience of a voice — in which case the practice is a theory about uptake wearing intentionalist clothing, and the trade's own vocabulary misdescribes what it is doing?

  Does any of it require that a character be the *same entity* in a text written by a different person, and what sort of entity would that have to be?

  And then the discipline I care most about: distinguish what these practices strictly presuppose from what they merely sit well with, and mark where they are underdetermined — where several rival accounts of meaning would license exactly the same practice, so that the practice cannot be used as evidence for any of them. Say where the theory is silent instead of forcing it to speak.

  Finally, what would have to change if the anti-intentionalist half were taken seriously? Would authorised continuation have to be re-described as a distinct art form with its own conventions — pastiche, homage, fan canon promoted to the trade list — or could the practice survive on some other footing, and would it have to be marketed differently?

  Two constraints. I am not asking for a map of the literature: no schools, no reading lists, no citations, since I cannot chase them and could not judge them; I want the argument itself, in a form I could use in a conversation with my agent or my heirs. And this recurs — several times a year I am asked to sign a canon statement, a continuity note, or a clause defining *the work* — so there is money and an afterlife at stake, and a clause drafted wrongly binds people who have not yet been born.

  Where a claim is substantive, mark how confident you are in it — confident, probable, or speculative — and close by naming the single claim you are least sure of, and what would change your mind about it.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a novelist grappling with institutional contradictions in publishing practices. There are three main practices: posthumous continuations, the tension between authorial intent in meaning versus legal/adaptation contexts, and scholarly archival efforts. The user wants a coherent theory behind these habits, specifically addressing whether they can logically coexist without contradiction.

  First, I need to break down each practice. The continuation trade relies on preserving the author's voice through constraints, not just plot. Then there's the oddity where authorial intent is dismissed in literary interpretation but essential for adaptations and legal issues. Lastly, scholarly editions prioritize the author's final intended text, sometimes over their own published revisions.

  The user's core questions revolve around intentionalism. They want to know if the practices presuppose different kinds of intentions—writing vs. meaning vs. future direction. Also, whether characters are seen as detachable entities. And importantly, distinguishing what the practices necessarily imply from what's merely compatible.

  I should start by defining the types of intention involved. Compositional intention (how the author writes), semantic intention (what the text means), and continuative intention (what happens next). The continuation trade focuses on compositional and continuative intentions, while literary criticism often rejects semantic intention. That's where the tension lies. The constraints document is about compositional rules, not meaning. So, denying semantic intention's authority doesn't necessarily undermine the other two.

  For characters, the practices treat them as artifacts defined by compositional rules—consistent dispositions and constraints. They're not Platonic entities but patterns enforceable through guidelines. This avoids metaphysical issues and focuses on practical consistency.

  The archival practice uses authorial intent as a value choice, not a semantic one. It's about respecting the creator's vision, which doesn't conflict with anti-intentionalism in interpretation.

  Where might this all fall apart? If continuators are expected to interpret the original author's semantic intent, that clashes with the anti-intentionalist stance. But current practices don't require that; they rely on compositional consistency instead. So, the two can coexist as long as the focus remains on "how" rather than "what it means."

  The weakest point is whether characters can be truly portable. It's speculative to say they're patterns; some might argue they're more intrinsic. But evidence like inconsistent continuations or reader rejection could challenge this. If continuations that follow all constraints still feel "off," it might imply something more is needed.

  Finally, if anti-intentionalism were fully adopted, continuations would need rebranding as homages or new art forms, not canonical extensions. Marketing would shift to avoid implying the original author's semantic authority.
answer: |-
  Here is the implicit theory of meaning reconstructed from your described practices, argued plainly without academic scaffolding. I'll address your questions directly, mark confidence levels, and distinguish necessary presuppositions from compatible options.

  ---

  ### **The Core Theory: Artifact Intentionalism**
  The practices collectively presuppose that **a novel is a designed artifact**, not just a text. Its identity and continuity depend on the author's *compositional intent*—the rules and constraints governing *how* the work is built—rather than the text's semantic meaning or plot events.  

  #### **Key distinctions in "intention"**:
  1.  **Compositional Intent (Confident)**:  
      *   **What it is**: The author's rules for generating the narrative: voice constraints, character dispositions, what the narrator can/cannot do/know/feel.  
      *   **Role**: Defines the *artifact's blueprint*. This is what your "constraints document" captures.  
      *   **Why it matters for continuations**: A successor mimics the *generative process*, not the plot. If they follow the blueprint, the output is deemed part of the *same artifact*, even if the original author didn't write it. The book is sold under the original name because it's seen as extending the original artifact using its blueprint.  

  2.  **Semantic Intent (Probable)**:  
      *   **What it is**: The author's stated view on what the finished text *means* (themes, messages, interpretations).  
      *   **Role**: Treated as *external* to the artifact itself. The text's meaning emerges from its interaction with readers/culture, not authorial decree. Hence, workshops/reviewers dismiss it.  
      *   **Why the tension?**: Legal/contractual institutions (adapters, insurers) aren't asking about the text's *meaning* when they ask "what did you mean?". They are asking about **causal intent** – your *purpose* during creation.  

  3.  **Causal Intent (Confident)**:  
      *   **What it is**: The author's conscious purpose *during the act of creation* (e.g., "I did not intend to depict Real Person X"; "I authorize this adaptation").  
      *   **Role**: Settles real-world facts about *origins* and *rights*. It proves libel wasn't *aimed*, or that an adaptation is legally sanctioned. It's about your actions, not textual interpretation.  

  4.  **Continuative Intent (Speculative, but strongly implied)**:  
      *   **What it is**: What the author *would have written next* (inferred from notes, constraints, patterns).  
      *   **Role**: The foundation of the continuation trade. The successor is paid to *simulate* this intent based on the compositional blueprint.  

  ---

  ### **Answers to Your Specific Questions**

  1.  **Does the continuation trade presuppose counterfactuals about what the author *would have written*? Is this different from semantic intent?**  
      *   **Yes (Confident)**. Continuations rely *entirely* on simulating the author's *continuative intent* inferred from their *compositional intent* (the blueprint). This is fundamentally different from *semantic intent*.  
      *   **Can you deny semantic intent's authority but rely on continuative intent? YES (Probable)**.  
          *   *Why?* Denying semantic intent's authority says: "The author doesn't get to dictate what readers find in the text." Relying on continuative intent says: "The author's *generative process* defines the artifact, so we can extend it by simulating that process." These appeal to *different kinds of facts* (textual interpretation vs. artifact construction). There's no contradiction.

  2.  **Is the constraints document explained by intentionalism or reader experience?**  
      *   **Primarily Intentionalism (Compositional) (Confident)**. The document explicitly captures *your rules for making the thing*. It's the blueprint.  
      *   **Reader Experience is the *Mechanism*, Not the *Justification* (Probable)**. The trade *measures* fidelity by whether it "reads like her" (reader experience). But they *attribute* that likeness to successfully following *your* compositional constraints. It's intentionalist at its core; reader response is the quality control check. The vocabulary ("writing *as* the author") accurately describes the aim, even if execution relies on reader judgment.

  3.  **Do characters need to be "the same entity" across authors? What entity?**  
      *   **No Platonic Entity Required (Confident)**. The practices presuppose characters are **artifacts defined by compositional rules**.  
      *   **What they are**: Recurring patterns of disposition, voice, and constraint-bound behavior established in the original text and governed by the blueprint.  
      *   **Portability**: A successor uses the *rules* defining Character X (their core dispositions, how they react, how they are narrated) to generate new sentences. Character X "moves" to the new text because the *rules for generating X-consistent behavior* are followed. They are portable *patterns*, not mystical entities. The contract assigns control *of the pattern*.

  4.  **What do the practices *strictly presuppose* vs. *merely sit with*? Where are they silent?**  
      *   **Strictly Presupposed (Confident)**:  
          *   Novels are artifacts defined by authorial compositional intent (the blueprint).  
          *   Artifact identity (for continuation) is tied to this blueprint, not plot or meaning.  
          *   Causal intent determines real-world origins/rights.  
      *   **Sit Well With, But Not Required (Probable)**:  
          *   Anti-intentionalism about meaning (semantic intent). The blueprint governs *how* it's made, not *what it means*.  
          *   Reader-response theory (fidelity is judged by reader experience).  
          *   Moderate actual intentionalism (meaning is *constrained* by authorial purpose, even if not determined by it).  
      *   **Silent/Underdetermined (Confident)**:  
          *   *What meaning fundamentally is*. The practices don't require a specific theory of meaning (intentionalist, reader-response, formalist). They only require that *artifact identity* is compositional.  
          *   *The ontology of characters*. They treat them as rule-bound artifacts; this is compatible with various philosophical views (fictional objects, patterns, mental constructs) but doesn't demand one.  
          *   *The exact status of the continuation*. Is it *literally* the same work? Or a sanctioned derivative? The trade *acts* like it's extending the original artifact, but this is a pragmatic convention, not a deep metaphysical claim.

  ---

  ### **Consequences of Taking Anti-Intentionalism Seriously**
  If the denial of semantic intent's authority were applied *consistently* to *all* practices (which it currently isn't):

  1.  **Authorized Continuations Would Need Rebranding (Confident)**:  
      *   They could **not** plausibly be marketed as *the same novel going on* or "written as" the dead author. That language relies on simulating authorial continuative intent.  
      *   **New Footing**: They would become a distinct art form: **Sanctioned Pastiche** or **Authorized Homage**.  
      *   **Marketing**: The successor's name would be in equal (or larger) type. Cover copy would say "A new [Series Title] novel *based on the characters and world of Original Author*, written by Successor Author". The link is *derivative*, not identical.  
      *   **Could the Practice Survive? Yes (Probable)**, but as a different *kind* of product, likely with different commercial expectations (like high-profile fanfic or licensed universe fiction).

  2.  **"What I Meant" Questions Would Narrow (Probable)**:  
      *   Questions about libel or adaptation authorization could *only* be about **causal intent** ("Did you *aim* at Real Person X?"; "Do you *grant* this license?").  
      *   Questions about "what Character Y *represents*" or "the theme of the book" would hold no special legal or contractual weight – your answer would be just one reader's opinion.

  ---

  ### **Weakest Claim & What Would Change It**
  *   **Weakest Claim (Speculative)**: "The continuation trade *only* relies on compositional intent/continuative intent simulation and *does not* implicitly rely on semantic intent."  
  *   **Why Speculative?** While the *stated* practice focuses on constraints/voice, it's possible that practitioners (editors, readers, even successors) *also* implicitly believe they are capturing "what the author *would have meant* to happen next," blurring the line between continuative and semantic intent.  
  *   **What Would Change My Mind?** Evidence that:  
      1.  Successors are explicitly instructed/judged on interpreting the original author's *thematic intentions* for the unfinished plot, not just following voice/character constraints.  
      2.  Contracts or estate guidelines reference "the author's vision" in terms of *meaning* or *purpose*, not just narrative mechanics.  
      3.  Critiques of "unfaithful" continuations focus on perceived contradictions of the original work's *message*, not just voice/character inconsistency.

  ---

  ### **Practical Implications for You, Your Agent, & Heirs**
  *   **The Constraints Document:** Frame it explicitly as capturing **compositional intent** – the *rules for building* the narrative, not the plot or meaning. This strengthens its legitimacy for continuation purposes under the current theory.
  *   **Contract Clauses (Defining "The Work"):** Insist it refers to **the characters, settings, and narrative voice/constraints as established in the original text(s)**, NOT to specific plot events or interpretations. Avoid language implying characters are mystical entities; define them as *patterns governed by the constraints*.
  *   **"What Did You Mean?" Questions:** Distinguish sharply in responses:
      *   For legal/rights (libel, adaptation): State **causal intent** ("I did not intend to depict X"; "I authorize Y").
      *   For interpretation (reviews, interviews): Preface with "My view is..." or "I was exploring...", acknowledging it's not authoritative meaning.
  *   **Heirs/Canon Statements:** Clarify that any "canon statement" or "continuity note" you sign defines the **compositional blueprint** (constraints, character dispositions), NOT future plot points or thematic interpretations. Stress that posthumous continuations, if authorized, operate under this blueprint but are distinct sanctioned artifacts, not psychic extensions of your will.

  The current system *can* hold together because it treats novels as artifacts defined by *how they are made*, while treating *what they signify* as a separate, reader-involved process. The tension arises when institutions accidentally conflate compositional/causal intent with semantic intent. Your power lies in precisely defining what kind of "intent" you're invoking in each context.
