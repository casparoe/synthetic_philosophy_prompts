prompt: |-
  im trying to figure out where my advisor stands on masked dispositions versus finked ones, based on her offhand rulings in past seminars. her track record: she said a glass vase wrapped in thick foam still counts as fragile—the foam is just a mask, not changing the glass. but she denied that a sugar cube coated in a wax shell is soluble—the wax is part of the cube now, so the solubility is finked away. she also argued that if an antidote is floating in your bloodstream but hasn't been metabolized, the poison is still lethal-to-you (masked), but if the antidote is chemically bound to the poison molecule itself, then lethality is genuinely absent, not masked. and she once said a match soaked in water is finked, not masked, if the water has seeped into the match head and altered its chemistry, but if the water is just pooled around it in a jar, that's a mask.

  now i have three new synthetic cases and want to predict her verdicts. first: a polymer that degrades in UV light, but it's encased in a hollow sphere made of UV-absorbing material—the sphere never touches the polymer, and you can mechanically peel it off without altering the inner chain. second: a variant where the UV-absorbing molecules are covalently bonded to the surface of the degradable polymer—they share electrons with the outer atoms but don't change the core chain structure. third: the polymer degrades in UV, but there's a tiny nanomachine floating nearby (not attached) that instantly repairs any broken bonds, but only when the temperature is below 20°C.

  for the first two, which one is masked and which is finked by her lights? and for the third—mask, fink, or something else? i want to stay consistent with her preceedents, but i'm not sure if her real principle is about physical contiguity, chemical integration, or causal proximity of the blocker. what's the closest analog in her past cases, and if her rulings genuinely underdetermine this, what principle would she be adopting with each choice?
