prompt: |-
  I write literary fiction — third-person, past-tense novels that slip in and out of free indirect style — and my copy editor and I keep losing arguments about conditional sentences. My last manuscript had nearly a hundred of them, and on about a dozen we flatly disagreed: is the thing in the "if" clause being presented as something that happened, as something that did not, or as something still open? And whose state of knowledge settles that — the narrator's, or the character whose head we are in? In free indirect style that is precisely what I often don't want pinned down. A friend who reads linguistics tells me this is the territory of indicative versus counterfactual conditionals, which suggests there is more structure here than my ear supplies.

  What I need is a procedure my copy editor can run on each conditional in a manuscript, in order, with no training in linguistics: the questions to ask, what counts as an adequate answer to each one, the point at which the procedure says "this has to be rewritten," and the point at which it hands the question back to me because it is a matter of what I'm trying to do rather than of correctness. It has to be runnable in roughly ten seconds a sentence, it has to say how to handle nested conditionals and "even if," and it should be explicit about which of its questions are judgment calls wearing procedural clothing. I sign off on whatever it flags, and I need it to be honest about where it will misfire. The stakes are trivial per sentence and real per book: a conditional that quietly settles something I wanted left open can spoil the last fifty pages.

  Please run it on these three sentences from the novel I'm drafting, one of which I am attached to and would rather not change — and tell me straight if the verdict is that it has to change anyway:

  1. "If he had known about the letter, he would have taken the morning train."
  2. "If she was lying about the fire, then everything he had built on her account was already ash."
  3. "If he died in the fire, he died believing she had left him."

  For each, say what the sentence commits my fictional world to, what it conveys about the mind we are in, and where the procedure cannot settle the matter. Please write the answer in American English.
reasoning: |-
  Okay, the user writes literary fiction and is having issues with conditional sentences. They work in third-person past tense with free indirect style, which blends the narrator's voice with the character's thoughts. Their copy editor keeps disagreeing on whether "if" clauses present events as factual, counterfactual, or ambiguous. The user wants a procedure to resolve these disputes quickly without linguistics expertise. 

  I need to understand the core problem. The key is determining the factual status of the "if" clause and whose perspective defines it—narrator or character. In free indirect style, this ambiguity is often intentional. The user needs a clear, efficient method for their editor to flag only problematic cases. 

  First, I'll think about conditional types: indicative (possible), subjunctive (unlikely), counterfactual (impossible). But in fiction, context and perspective matter more than strict grammar rules. The procedure must account for narrative voice and character knowledge. 

  The user provided three sample sentences. For each, I'll need to analyze: whether the "if" event happened, whose knowledge we're relying on, and if the sentence forces an interpretation that might ruin ambiguity. 

  The procedure should be step-by-step: 
  1. Identify the "if" clause and its context. 
  2. Determine if the narrator or character is speaking. 
  3. Check for clues like tense or modal verbs. 
  4. Decide if the sentence commits to a factual interpretation. 
  5. Flag if it disrupts intended ambiguity. 

  For sentence 1: "If he had known... would have taken..." This is clearly counterfactual—he didn't know and didn't take the train. No ambiguity here. 

  Sentence 2: "If she was lying..." The past tense "was" could be real or hypothetical. But "everything was already ash" implies the narrator knows the outcome, suggesting she was indeed lying. This might be too definite. 

  Sentence 3: "If he died... he died believing..." The repetition of "died" makes this sound factual—he did die, and he believed she left him. But the first "if" could be rhetorical. The user might intend uncertainty, but the structure leans toward certainty. 

  The user is attached to one sentence—probably #3. But the analysis suggests it commits to his death. If they want ambiguity, it needs revision. 

  The procedure must be fast—10 seconds per sentence. It should avoid linguistic jargon. Key questions: 
  - Does the sentence use "had" or "would have"? (Likely counterfactual) 
  - Is the outcome stated as fact? (Likely real) 
  - Are there mixed tenses? (Flag for review) 

  For nested conditionals or "even if," the same steps apply but check each layer. The editor should rewrite only when the sentence forces an interpretation conflicting with context. Otherwise, defer to the author. 

  Finally, I'll note where the procedure might misfire: in free indirect style with intentional ambiguity, some sentences might get flagged unnecessarily. The editor should highlight those for author review instead of rewriting.
answer: |-
  Here's a procedure designed for your copy editor, followed by analysis of your sentences:

  **Conditional Sentence Procedure for Copy Editors (Fiction - Free Indirect Style Focus)**

  1.  **Identify the "If" Clause:** Isolate the part starting with "if" (or equivalent like "even if", "unless").
  2.  **Check for Obvious Counterfactual Markers:**
      *   Does the "if" clause use **"had" + past participle** (e.g., "If he had known")?
      *   Does the main clause use **"would/should/could/might have" + past participle** (e.g., "he would have taken")?
      *   **IF YES:** The sentence **is counterfactual**. The "if" event **did not happen**. Proceed to Step 5. *[Judgment: Low - Clear grammatical signals]*
  3.  **Check for Obvious Open/Possible Markers:**
      *   Does the "if" clause use **simple past** ("was", "did", "saw") or **present** ("is", "does", "sees")? (Simple past is common in past-tense narration for open conditionals).
      *   Does the main clause use **"will/would/shall/should/can/could/may/might" + base verb** (e.g., "he will take", "he would take", "he might take")? *(Note: "would" can sometimes be habitual past, context needed)*
      *   **IF YES:** The sentence **is likely open/possible**. The "if" event **might be true, might be false; we don't know yet**. Proceed to Step 5. *[Judgment: Low - Clear grammatical signals]*
  4.  **The Ambiguous Zone (Simple Past + Simple Past/Modal-Less Future):** This is the main battleground.
      *   Does the "if" clause use **simple past** (e.g., "If she was lying")?
      *   Does the main clause use **simple past** (e.g., "everything... was ash") or **future-in-the-past** implied or using "would" (but *not* "would have")? (e.g., "he would believe" meaning "he was going to believe").
      *   **IF YES:** **This is ambiguous.** The sentence **does NOT grammatically commit** to whether the "if" event happened or not. Proceed to Step 5. *[Judgment: Low - Identifying the pattern]*
  5.  **Context & Free Indirect Style Check (Crucial Step):**
      *   **Whose knowledge/perspective is dominant?** Is the narrator omniscient, or are we primarily in a character's head via Free Indirect Style (FIS)?
          *   **Narrator (Omniscient):** The factual status of the "if" clause is usually determined by the narrator's knowledge. A counterfactual marker means it didn't happen; an open marker means the narrator is presenting it as unknown *to the reader* (even if the narrator knows). Ambiguous forms *can* retain ambiguity if the narrator is withholding.
          *   **Character (FIS):** The factual status is determined by *the character's knowledge or belief at the time*. A counterfactual marker means the character *believes* it didn't happen. An open marker means the character *acknowledges the possibility but doesn't know*. An ambiguous form (Simple Past "if" + Simple Past main) is **the MOST COMMON and POWERFUL tool for FIS ambiguity** – it reflects how the character is thinking about the possibility *without the character or the narrative committing to its truth*. This is often intentional.
      *   **Does the surrounding context FORCE a reading?** Look 1-3 sentences before and after. Does it explicitly state the truth/falsity of the "if" clause? Does the main clause describe an outcome known to be true or false?
          *   **IF CONTEXT EXPLICITLY CONFIRMS/REFUTES "IF" CLAUSE:** Sentence commits to that status. *[Judgment: Medium - Requires reading context]*
          *   **IF CONTEXT IS SILENT/AMBIGUOUS:** Sentence retains the status determined in Steps 2-4, filtered through the perspective in Step 5a.
  6.  **Decision Tree:**
      *   **Flag for Rewrite IF:**
          *   The grammatical markers (Step 2 or 3) **CONFLICT** with the intended meaning/perspective identified in Step 5. (e.g., Using a counterfactual form when the character believes it *is* true, or vice-versa).
          *   An ambiguous form (Step 4) is used, but the **context (Step 5b) EXPLICITLY forces** a true/false reading *that contradicts the author's likely intended ambiguity*. (e.g., "If she was lying (but we see her tell the truth 2 lines earlier), everything was ash.").
          *   "**Even if**" is used, but the intended meaning is simple condition ("if") rather than concessive ("despite whether").
      *   **Hand Back to Author IF:**
          *   The sentence uses an **ambiguous form (Step 4)** and the **context is also ambiguous (Step 5b)**. *This is likely intentional FIS ambiguity.*
          *   The perspective (Step 5a) is **unclear** (e.g., deep FIS vs. light FIS vs. narrator) and the conditional's interpretation hinges on resolving that ambiguity.
          *   **Nested conditionals** create complexity where the perspective or truth status becomes unclear using the above steps.
      *   **Accept IF:** The sentence passes Steps 1-5 with no conflicts flagged above. The meaning aligns with the perspective and context.

  **Where it Misfires:**
  *   **Subtle FIS Shifts:** If the depth of FIS is very fluid or subtle, Step 5a might be misjudged.
  *   **"Would" Ambiguity:** Distinguishing future-in-the-past ("he would go" meaning "he was going to go") from conditional "would" can be tricky in Step 3/4 without wider context.
  *   **Character vs. Narrator Knowledge:** If the narrator knows something the character doesn't but stays close to the character's FIS, the copy editor might incorrectly assume the character knows what the narrator knows.
  *   **Extremely Complex Nested Conditionals:** The procedure might stall and default to "Hand Back."
  *   **Rhetorical Conditionals:** Sentences like "If he was a genius, I'm the Pope!" (clearly counterfactual despite simple past) rely on context/logic beyond the clause structure.

  **Analysis of Your Sentences:**

  1.  **"If he had known about the letter, he would have taken the morning train."**
      *   **Procedure:** Step 2 triggers (Had known / would have taken). **Counterfactual.**
      *   **Commitment:** He **did not know** about the letter. He **did not take** the morning train.
      *   **Mind/Conveyance:** This reflects the knowledge/belief of the perspective source (narrator or character via FIS). They *know/believe* he didn't know and didn't take that train. If in FIS, the character is certain of this lack of knowledge.
      *   **Procedure Outcome:** Accept. Grammatically clear counterfactual. No ambiguity. Cannot misfire here.
      *   **Verdict:** Clear, no change needed.

  2.  **"If she was lying about the fire, then everything he had built on her account was already ash."**
      *   **Procedure:** Step 4 triggers (Simple past "was lying" / Simple past "was ash"). **Ambiguous Form.**
      *   **Commitment:** **Grammatically commits to nothing** about whether she was lying or not. **Strongly implies** that "everything was already ash" is true *regardless* (the main clause is stated as fact).
      *   **Mind/Conveyance:** This is classic FIS ambiguity territory. The perspective source (likely the character's mind via FIS) is grappling with the *possibility* that she lied and recognizing the *fact* that everything is ruined. The character *doesn't know* if she lied but *does know* everything is ruined. The ruin is presented as factual.
      *   **Procedure Outcome:** **Hand Back to Author.** The ambiguous form is used. Context needed to see if it forces the lying to be true/false. The main clause being stated as fact ("was already ash") is fine; it's the *reason* for the ruin that's uncertain. This is likely the *intended* ambiguity. The editor should confirm with you if this ambiguity is deliberate.
      *   **Verdict:** Likely fine as-is if ambiguity is intended. Only rewrite if *surrounding context* explicitly proves she wasn't lying or proves she was, contradicting the intended uncertainty. Otherwise, it's working.

  3.  **"If he died in the fire, he died believing she had left him."**
      *   **Procedure:** Step 4 triggers (Simple past "died" / Simple past "died"). **Ambiguous Form.**
      *   **Commitment:** **Grammatically commits to nothing** about whether he died in the fire or not. However, the structure **strongly implies the main clause ("he died believing...") is true**. It presents two potential scenarios for his death (in the fire, or not) but asserts that *whenever/however he died*, he held that belief. The repetition of "died" creates a parallelism that feels factual for the main clause. It commits that **he is dead** and that **he died believing she had left him**.
      *   **Mind/Conveyance:** The perspective source (narrator or character via FIS) **knows/believes he is dead** and **knows/believes he died with that belief**. They are considering whether the fire *was the cause*, but not whether he died or held the belief. If this is FIS, the character *knows* he's dead and knows his state of mind at death regarding her leaving.
      *   **Procedure Outcome:** **Flag for Rewrite.** While the *cause* of death ("in the fire") remains grammatically open, the sentence structure **forcefully presents his death and his belief at death as established facts**. This removes ambiguity about his death and his final belief. If you intend ambiguity about *whether he died at all* or *what he believed when he died*, this sentence commits to both. If you intend ambiguity *only* about whether the fire killed him (but know he's dead), it might be okay, but the belief is still settled.
      *   **Verdict:** **This has to change anyway** if you want to preserve ambiguity about his death or his final belief. The structure locks in those facts. To maintain ambiguity:
          *   *Option 1 (Death Ambiguous):* "**If he had died in the fire, he would have died believing** she had left him." (Counterfactual: He didn't die in the fire, but *if he had*, he'd have held that belief. Leaves actual death status open).
          *   *Option 2 (Death Certain, Belief Ambiguous):* "**When he died** in the fire, **he might have believed** she had left him." (Death certain, belief uncertain).
          *   *Option 3 (Both Ambiguous):* "**If he died, he might have died believing** she had left him." (Simple past + Modal - Open possibility for death *and* belief).

  **Summary:** Sentence 1 is clear counterfactual. Sentence 2 is ambiguous FIS gold - likely intentional, hand back. Sentence 3, despite likely being the one you're attached to, commits to his death and his final belief too strongly for ambiguity and needs revision if that ambiguity is crucial. The procedure flags it.
