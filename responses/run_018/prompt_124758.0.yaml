  Metaphysical guilt is the trickiest. Jaspers framed it as individual bystander complicity, but in South Africa, even "bystanders" benefited from apartheid's structural violence. The user's phrase "ordinary citizens who benefited" hints at this tension. I should highlight how TRC's restorative approach reframes this as active responsibility-taking.

  Where Jaspers falls short: his defeated-aggressor model can't capture SA's negotiated revolution. The amnesty-for-truth trade wasn't victor's justice but a survival pact. And metaphysical guilt's individual focus misses how TRC made collective witnessing central to nation-building. That might be the unspoken "fifth guilt" – the communal burden of memory work.

