prompt: |-
  Hey—been thinking about corruption and culture for a seminar I'm prepping, and there's a pattern I keep noticing that I don't have a good word for. Imagine a small-scale bureaucratic setting: a farmer brings the local official a crate of produce after harvest, or a family invites him to a wedding with a envelope. There's no specific permit being requested that day, so it's not a classic quid-pro-quo bribe. The gift is too small to buy a particular decision. But everyone understands that if that farmer needs help with a land dispute next year, the official will remember the crate; if he never gets crates, he might be less responsive. Meanwhile, in that community, refusing the gift is seen as insulting—like breaking social trust—rather than as preserving imparitality. So you get this accumulation of small, asymetrical exchanges that aren't part of a formal patron-client machine (no vote-blocking, no explicit loyalty contract), but they still build a kind of standing social credit that shapes access over time. Anthropologists often file this under reciprocity or gift-giving; legal reformers file it under corruption or clientelism. But both labels feel wrong for this specific middle space. Does this exact configuration—non-transactional gifts that slowly accumulate into preferential access without ever being bargained—have an established concept? If so, how is it distinguished from ordinary reciprocity and from full-blown clientelism? And if not, what's the sharpest way to draw its edges? I'm not after a bibliography, just the conceptual carving.

  Please be precise about what the phenomenon is and isn't, and finish with \answer{the established term, or 'no specific term—proposed definition here'}.
reasoning: |-
  Okay, the user is preparing for a seminar and has noticed a pattern in bureaucratic settings where small gifts are given without an immediate quid pro quo. They describe scenarios like a farmer giving produce to an official or inviting them to a wedding with an envelope. These aren't direct bribes since no specific favor is asked at the time. But over time, these gifts build up "social credit," meaning the official might be more responsive in the future. The community sees refusing these gifts as insulting, so it's embedded in social norms. The user feels terms like "reciprocity" or "clientelism" don't quite fit and wants a precise concept for this middle ground.

  First, I need to recall relevant sociological concepts. Marcel Mauss's work on the gift economy comes to mind, where gifts create obligations. But the user mentioned that anthropologists use reciprocity, which they feel is too broad. Then there's clientelism, which involves explicit exchanges for votes or loyalty, which isn't the case here. So what's in between?

  I remember James Scott's "everyday forms of corruption" or "petty corruption," but that might still imply illegality. The user emphasized that it's not transactional. Then there's "diffuse reciprocity," which is long-term and not immediate. But is that an established term? Also, "relational corruption" or "gift-based corruption" might be used in anti-corruption contexts, but they carry a negative connotation that might not fit the social norm aspect.

  Another term is "institutionalized gift-giving" in bureaucracy. Or "facilitation payments," but those are usually for specific services. The key here is the slow accumulation without explicit bargaining. Maybe "preemptive gift-giving"? But that's not standard. 

  What about "generalized exchange"? That's a concept where giving to the system builds social credit, but is it applied to bureaucracy? The user needs a term that distinguishes this from both personal reciprocity and structured clientelism. 

  I think the closest established term is "diffuse reciprocity," as per Keohane in international relations, but applied to local bureaucracy. However, in anthropology, it might just be a form of social reciprocity. The user wants precision, so acknowledging that "diffuse reciprocity" is the concept but noting its limitations might be best. If not, coining a term like "bureaucratic social credit" but the user prefers established terms. 

  After reviewing, "diffuse reciprocity" fits because it's ongoing, non-specific, and builds obligations over time. It's not clientelism because there's no formal hierarchy or political loyalty. And it's different from balanced reciprocity because there's no immediate exchange. So the answer should be "diffuse reciprocity," with clarification on how it differs from other terms.
answer: |-
  Based on your precise description, the phenomenon falls under the established anthropological/political science concept of **diffuse reciprocity**.

  Here's the conceptual carving:

  1.  **What it IS (Diffuse Reciprocity):**
      *   **Non-specific Obligation:** The gift creates a *generalized* sense of obligation or goodwill ("social credit") rather than paying for a specific, immediate favor (quid pro quo).
      *   **Long-Term Horizon:** The exchange operates over an extended, often indefinite, timeframe. The expectation is for favorable treatment *sometime* in the future, not right now.
      *   **Socially Embedded:** The act is framed within local norms of hospitality, gratitude, or relationship maintenance. Refusal violates these norms, signaling distance or hostility, not impartiality.
      *   **Asymmetrical Accumulation:** Small, repeated acts accumulate social capital for the giver, creating an imbalance favoring the official's potential responsiveness to *future* requests.
      *   **Implicit Understanding:** While never formally bargained, both parties understand the underlying logic: continued goodwill requires participation, and non-participation risks disadvantage.

  2.  **What it IS NOT:**
      *   **Not Balanced Reciprocity:** Not a direct, immediate, or equivalent exchange of goods/services ("I give you a chicken today, you stamp my permit today"). The return is delayed, non-specific, and potentially unequal.
      *   **Not Quid Pro Quo Bribery:** No explicit agreement for a specific favor in exchange for the specific gift. The link between gift and future action is indirect and probabilistic.
      *   **Not Formal Clientelism:** Lacks the hierarchical structure, explicit political loyalty demands (e.g., delivering votes), and larger-scale resource exchange typical of patron-client systems. It's more localized, interpersonal, and focused on bureaucratic access rather than political mobilization.
      *   **Not Simple Gift-Giving/Pure Hospitality:** While framed as such, the *systemic effect* is to create preferential access based on accumulated exchanges, distinguishing it from gifts given purely for social or emotional reasons without impacting impartial state functions.
      *   **Not Nepotism/Favoritism:** While resulting in preferential treatment, the mechanism is *earned* through accumulated exchanges, not automatic based solely on kinship or pre-existing close ties.

  **Distinguishing from Key Concepts:**

  *   **Vs. Ordinary Reciprocity:** Diffuse reciprocity specifically involves *non-specific, long-term obligations* arising from gifts within a *power imbalance* (citizen-official). Ordinary reciprocity can be immediate/balanced (like barter) or occur between equals without systemic implications for impartial administration.
  *   **Vs. Clientelism:** Diffuse reciprocity lacks the *explicit political contract*, *hierarchical organization*, and often the *scale* of resource exchange (votes, jobs, large favors) central to clientelism. It operates at a more granular, interpersonal level within the bureaucracy, focused on "greasing the wheels" of access rather than political support.

  **Conclusion:** The phenomenon is best described as **diffuse reciprocity** within a bureaucratic context. It captures the core elements of non-specific, long-term obligations built through asymmetrical gifts embedded in social norms, leading to preferential access without constituting explicit bribery or formal clientelism.

  \answer{diffuse reciprocity}
