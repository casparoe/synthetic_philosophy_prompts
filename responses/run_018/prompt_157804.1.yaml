answer: |-
  ### Teaching Plan: Judgment Aggregation & Discursive Dilemma  

  **Dependency Order**  
  1. **Individual Rationality**: Agents hold logically consistent judgments (e.g., accepting premises but rejecting conclusion is incoherent). *Why first?* Establishes baseline rationality; group inconsistency only matters if individuals are consistent.  
  2. **Group Aggregation Rules**: Define majority voting per proposition. *Why next?* Shows how individual inputs map to collective outputs.  
  3. **Premise-Based (PB) vs. Conclusion-Based (CB) Approaches**: PB aggregates premises first, deriving conclusions; CB aggregates conclusions directly. *Why before divergence?* The tension arises *from* choosing between these paths.  
  4. **Reveal Contradiction**: Apply PB/CB to the case study → divergent outcomes.  

  **Core Case: Gene-Editing Committee**  
  - **Structure**: 3 members; 2 premises (P1: "Safe", P2: "Effective"); Conclusion (C: "Approve"). Binary T/F judgments.  
  - **Required Properties**:  
    - Symmetry: Identical reasoning structure for all members.  
    - Non-strategic voting: Members report sincere judgments.  
    - Independent plausibility: P1 and P2 defensible alone (e.g., safety ≠ efficacy).  
  - **Avoid**: Weighted votes, uneven influence, or procedural bias.  

  **Misconceptions & Mitigation Sequence**:  
  1. **"Majority voting prevents contradiction"**: *Counter* with the case showing consistent individuals → inconsistent group under majority.  
  2. **"Group is irrational like a confused individual"**: *Clarify* post-revelation: The group’s inconsistency is *structural*, not psychological.  
  3. **"Discussion fixes this"**: *After PB/CB divergence*, show discussion only shifts inconsistency location (e.g., to premises).  
  4. **"Scaling eliminates tension"**: *Last*, note doctrinal paradox scales (e.g., 4 members/3 premises).  
  *Deepest misconception*: \#2 (anthropomorphizing groups).  

  **Understanding Check**:  
  *Task*: "Design an aggregation rule for 4 members judging 3 premises. What must you sacrifice: universal domain, collective consistency, or proposition-wise majorities?"  
  *Success*: Identifies trade-offs (e.g., PB sacrifices conclusion democracy; CB sacrifices premise sensitivity).  

  **Explicit Exclusion**:  
  *Refusal wording*: "We’re focusing on the *phenomenon* of the paradox, not its formal boundaries. The full impossibility theorem and its technical links to Arrow’s theorem require measure-theoretic social choice tools beyond today’s scope—though they confirm this tension is universal."  

