answer: |-
  Your diagnosis—that the impasse stems from a tacit disagreement about the *nature of computation itself*—is perceptive and largely correct. Both sides presuppose incompatible metaphysical stances on whether computation is an intrinsic physical property or an observer-relative description, which fuels their circular arguments. However, this conceptual rift is entangled with empirical ambiguities about neural implementation and divergent expectations of explanation. Here’s a breakdown:

  ### **1. The Core Conceptual Dispute: Intrinsic vs. Observer-Relative Computation**
  - **Computationalists** (e.g., Marr, Fodor, Piccinini) treat computation as *physically constitutive*. They argue that brains *literally* process information because:  
    - Neurons exhibit discrete, functionally specific states (e.g., spike trains encoding sensory input).  
    - Neural circuits implement algorithms (e.g., Bayesian inference in perception) validated by predictive models.  
    - This view assumes computation is *discovered*, not imposed—analogous to identifying a heart as a pump.  

  - **Critics** (e.g., Searle, Hutto, Myin) argue computation is *observer-dependent*. Their "triviality" objection holds that:  
    - Any physical system (a wall, a storm) can be mapped *post hoc* to computational states ("0s and 1s" in brick patterns).  
    - Calling the brain a "computer" thus reveals nothing beyond our descriptive choice. As Searle quipped, "Computation is not discovered in nature; it is assigned."  
    - For them, computation requires *semantic content* (meaningful representations), which brains may lack intrinsically.  

  **Your insight holds**: Computationalists quietly presuppose computation is intrinsic; critics presuppose it is observer-relative. Neither argues for this premise—they argue *from* it.  

  ---

  ### **2. Entangled Complications: Why the Debate Stalls**
  While your diagnosis is central, three factors deepen the stalemate:  

  - **a) The Ambiguity of "Neural Coding"**:  
    Computationalists cite neural coding (e.g., place cells "encoding" spatial location) as proof of intrinsic computation. Critics retort that "coding" is metaphorical—a firing pattern isn’t *symbolic* unless an interpreter assigns meaning. **Empirical questions** lurk here: Are neural patterns causal drivers (e.g., optogenetic stimulation triggers behaviour), or merely correlates? Experiments show neural activity often correlates predictably with stimuli, but critics demand proof it functions as *formal syntax* (like a Turing machine’s tape).  

  - **b) Divergent Views of Explanation**:  
    - Computationalists seek *mechanistic* explanations: "Vision works by neural circuits computing depth from binocular disparity." Success is predictive power (e.g., neural network models matching behaviour).  
    - Critics (e.g., enactivists) demand *phenomenological* or *causal-mechanical* explanations. They argue information-processing models ignore embodiment and reduce cognition to "syntactic shuffling," failing to explain meaning or consciousness.  

  - **c) Semantic Slippage in "Computer"**:  
    Computationalists use "computer" broadly (any system processing information). Critics often mean *digital, symbolic* computers. This **verbal dispute** muddles the debate.  

  ---

  ### **3. A Path Forward: Disentangling the Knot**
  Resolving the impasse requires addressing your core diagnosis while tackling the ancillary issues. Here’s what could genuinely progress the debate:  

  #### **I. Clarify the Concept of Computation**  
    - **Formalise "Implementation"**: Adopt a rigorous theory of physical computation (e.g., Piccinini’s *mechanistic account*). A system computes only if:  
      - It has functional components with discrete states.  
      - State transitions are causally structured to mirror formal operations.  
      - These transitions are *teleologically* constrained (e.g., by evolution).  
    *Why it helps*: Rules out trivial mappings (e.g., walls lack component functions). Forces both sides to engage criteria rather than intuitions.  

  #### **II. Empirical Work on Neural Implementation**  
    - **Test for "Coding without an Interpreter"**: Design experiments where neural patterns *must* function computationally:  
      - **Example**: Train an AI to decode a sensory input *only* from downstream neural activity (e.g., V1 → V4). If successful without "cheating" (e.g., bypassing synapses), it suggests intrinsic information-processing.  
      - **Challenge**: Show neural systems violate physical symmetries in ways only explicable by computational roles (e.g., specific spike-timing dependencies for error correction).  

  #### **III. Conceptual Distinctions**  
    - **Separate Computation from Representation**: Even if neural states lack semantics, they may still *compute* (e.g., regulating heartbeat). This sidesteps debates about "meaning."  
    - **Adopt Marr’s Levels Rigorously**: Distinguish:  
      - *Computational* (what problem is solved?).  
      - *Algorithmic* (what steps are followed?).  
      - *Implementational* (how is it physically realised?).  
    Critics often attack the algorithmic level; computationalists focus on implementation. Clarifying which level is at issue reduces talking past each other.  

  #### **IV. A Formal Result**  
    A theorem proving that **not all physical systems admit non-trivial computational descriptions** could undercut the triviality objection. For instance:  
    - Show that systems with continuous dynamics (e.g., weather) only admit computational mappings that are arbitrary or non-explanatory, while discrete, functionally organised systems (e.g., brains) admit unique, robust mappings.  

  ---

  ### **Conclusion: Diagnosis and Prognosis**
  Your diagnosis is fundamentally sound—the stalemate is rooted in unspoken disagreements about computation’s ontology. However, empirical ambiguities about neural mechanisms and divergent explanatory ideals compound the problem. **Progress is possible** but demands:  
  1. A consensus on what counts as non-trivial computation (via formal accounts of implementation).  
  2. Experiments testing whether neural coding is observer-independent (e.g., causal-manipulation studies).  
  3. Disentangling computation from representation and semantics.  

  Without these, the debate will remain a merry-go-round of intuition pumps. But with them, we might yet determine whether the brain *truly* computes—or whether we merely compute *with* it. As Wittgenstein might say, the bewitchment lies in the language; the resolution lies in its careful use.
