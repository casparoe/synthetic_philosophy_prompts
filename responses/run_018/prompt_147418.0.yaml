  ### Decision Procedure for Staffing Decision-Making Bodies  
  **Procedure Name**: Representation-Impartiality Tradeoff Framework (RITF)  

  #### Decision Nodes (Applied Sequentially)  
  1. **Purpose**:  
     - **Stop for sortition**: Body's core function is descriptive representation (reflecting membership demography) or impartial deliberation (e.g., jury-like roles).  
     - **Stop for election**: Body's core function is executive action, strategic negotiation, or fiduciary accountability (e.g., budget oversight).  
     - **Proceed if**: Purpose blends representation and execution (e.g., policy advocacy).  

  2. **Stakes**:  
     - **Stop for sortition**: Stakes are low (errors reversible, limited organizational impact).  
     - **Stop for election**: Stakes are very high (existential risk, major financial/legal exposure).  
     - **Proceed if**: Stakes are moderate (significant but not catastrophic) or mixed (e.g., high personal but low organizational stakes).  

  3. **Specialized Expertise**:  
     - **Stop for election**: Expertise is high and non-learnable (e.g., legal compliance, advanced engineering).  
     - **Stop for sortition**: Expertise is low or learnable (e.g., via short training, mentorship).  
     - **Proceed if**: Expertise is moderate (learnable but with a steep curve).  

  4. **Vulnerability to Capture/Bias**:  
     - **Stop for sortition**: High vulnerability (history of clique dominance, low candidate diversity, or high campaigning advantage).  
     - **Stop for election**: Low vulnerability (robust nomination processes, high member engagement).  
     - **Proceed if**: Vulnerability is uncertain or context-dependent.  

  5. **Accountability Essential**:  
     - **Stop for election**: Accountability is essential (e.g., recurring decisions needing member alignment).  
     - **Stop for sortition**: Accountability is non-essential (e.g., one-off factual judgments).  
     - **Values judgment if unresolved**: Tradeoffs between representation, expertise, and legitimacy require cooperative-wide discussion.  

  #### Shadow Panel Evaluation  
  - **Recommendation**: Use only when capture risk is high but full sortition is infeasible.  
  - **Conditions where helpful**:  
    - Body is elected (provides oversight against insider bias).  
    - Deliberations are opaque (shadow panel increases transparency).  
  - **Conditions where harmful**:  
    - Body is already sortition-based (redundant and adds bureaucracy).  
    - Resources are limited (distracts from substantive work).  
  - **Verdict**: Improves legitimacy when capture is a documented risk; otherwise, adds noise.  

  ---

  ### Application to Proposals  
  1. **Solar-Installation Disputes Panel**  
     - **Purpose**: Adjudicative (impartial deliberation) → **Stop for sortition**.  
     - **Stakes**: Low organizational stakes (proceed not needed).  
     - **Result**: **Pure sortition**.  
     - **Conflict with instinct**: Yes (cooperative may prefer "experienced" members).  
     - **Unresolved by procedure**: Whether personal stakes (e.g., neighbor conflicts) justify overruling sortition for perceived expertise.  

  2. **Utility Contract Negotiation Team**  
     - **Purpose**: Strategic/executive → Proceed.  
     - **Stakes**: Very high (long-term financial/operational risk) → **Stop for election**.  
     - **Expertise**: High/non-learnable (technical/legal complexity) → Reinforces election.  
     - **Result**: **Election**.  

  3. **Regional Alliance Representatives**  
     - **Purpose**: Representative accountability → **Stop for election**.  
     - **Stakes**: High (policy impact) → Reinforces election.  
     - **Result**: **Election**.  

  ---

