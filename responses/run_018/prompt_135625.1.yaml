answer: |-
  The Born rule emerges as an objective coherence constraint on cross-branch record fidelity, mandated by unitary dynamics preserving information in the universal wavefunction. Here's why:

  In decoherent histories, a measurement correlates a system state with a record state (e.g., a detector or memory). For outcomes corresponding to branches with amplitudes \(a\) and \(b\), the pre-measurement state is \(| \psi \rangle = a |A\rangle + b |B\rangle\). Post-measurement, unitary evolution entangles the system with a recorder:  
  \[ | \Psi \rangle = a |A\rangle \otimes |R_A\rangle + b |B\rangle \otimes |R_B\rangle, \]  
  where \(|R_A\rangle\) and \(|R_B\rangle\) are orthogonal record states due to decoherence.  

  **Record fidelity**—the mutual consistency of physical records across branches—is quantified by the *overlap* of record states under unitary constraints. The inner product \(\langle R_A | R_B \rangle = 0\) (decoherence). However, the **relative robustness** of records is governed by the *norm* of the branch vectors. The reduced density matrix for the recorder subsystem is:  
  \[ \rho_R = |a|^2 |R_A\rangle\langle R_A| + |b|^2 |R_B\rangle\langle R_B|. \]  
  The trace norm difference between \(|R_A\rangle\) and \(|R_B\rangle\) is fixed at 2, but their *statistical distinguishability* scales with \(|a|^2/|b|^2\). Crucially, any physical process comparing records (e.g., hypothetical alien archaeologists in different branches analyzing detector fragments) would find the signal-to-noise ratio in recorded data correlating outcomes scales as \(|a|^2/|b|^2\).  

  **Circularity objection addressed:** Why must record fidelity scale with amplitude squared? Because unitary evolution linearly preserves the Hilbert space norm:  
  1. The total norm is 1: \(\||\Psi\rangle\|^2 = |a|^2 \||R_A\rangle\|^2 + |b|^2 \||R_B\rangle\|^2 = 1\).  
  2. Decoherence forces \(\langle R_A | R_B \rangle = 0\), so \(|a|^2 + |b|^2 = 1\).  
  3. For record states to encode *identical physical content* (e.g., both claim "measurement completed"), their intrinsic fidelity—how well \(|R_A\rangle\) can be mapped to \(|R_B\rangle\) by physical processes—is constrained by available amplitude. If \(|a| > |b|\), \(|R_A\rangle\) occupies more of the Hilbert space resources. Any attempt to simulate \(|R_B\rangle\) within the \(|R_A\rangle\)-supported subspace fails with probability \(1 - |\langle \psi_B | \psi_A \rangle|^2\), where \(|\psi_A\rangle\) is normalized in the \(a\)-branch. This failure rate is \(1 - |b|^2/|a|^2\), implying the fidelity of cross-branch representation is proportional to \(|b|^2/|a|^2\).  

  **Physical necessitation:** Unitarity enforces this scaling. Consider perturbing \(| \Psi \rangle\): a small interaction coupling branches would induce transitions. The transition rate from \(|R_A\rangle\) to \(|R_B\rangle\) is proportional to \(|\langle R_B | H_{\text{int}} | R_A \rangle|^2\), but the *density of states_ for records scales with \(|a|^2\). Thus, amplitude-squared ratios dictate the *physical capacity_ for information transfer or consistency checks between branches. Record fidelity isn't postulated—it's the only outcome consistent with:  
  - Linear superposition (no hidden variables),  
  - Information conservation (no wavefunction collapse),  
  - Decoherence (stable records require orthogonality).  

  In essence, the Born rule quantifies the geometric asymmetry in Hilbert space imposed by amplitudes. When records are physically realized as entangled states, unitary dynamics compels their mutual distinguishability—and thus the empirical consistency of multiverse physics—to respect \(|a|^2/|b|^2\). Probability is epistemic, but its structure is ontologically grounded in wavefunction geometry.
