  ---

  ### **Branching Taxonomy: Access Consciousness, Phenomenal Consciousness, and Global Workspace Theory**

  #### **Branch 1: Can global broadcasting occur with no phenomenal character?**  
  *(i.e., is a "broadcast-only" architecture possible?)*  
  - **Yes** → Proceed to Branch 2A.  
  - **No** (broadcasting necessarily carries phenomenal character) → Proceed to Branch 2B.  

  ---

  #### **Branch 2A: (Given broadcast-only is possible) Can phenomenal consciousness exist without broadcasting?**  
  *(i.e., are "privately phenomenal" states possible?)*  
  - **Yes** (private states possible) → **Q3: Relationship if both exist?**  
    - Only consistent option: **Neither necessary nor sufficient**.  
      - *Leaf 1: Independence View* (unnamed)  
        - **Core commitment**: Global broadcasting and phenomenal consciousness are fully dissociable; neither requires the other.  
        - **Awkward implication**: Super-blindsight is unproblematic (broadcast-only is possible), but private phenomenal states must exist without any functional signature, making them empirically undetectable and causally inert.  
  - **No** (broadcasting necessary for phenomenality) → **Q3: Relationship if both exist?**  
    - Only consistent option: **Necessary but not sufficient**.  
      - *Leaf 2: Necessary Ingredient View* (unnamed)  
        - **Core commitment**: Broadcasting is necessary for phenomenal consciousness but insufficient; an extra factor (e.g., qualitative content) is required.  
        - **Awkward implication**: Super-blindsight involves broadcasting without the extra factor, but the factor’s nature (e.g., non-physical) risks dualism and is untestable.  

  #### **Branch 2B: (Given broadcasting requires phenomenality) Can phenomenal consciousness exist without broadcasting?**  
  *(i.e., are "privately phenomenal" states possible?)*  
  - **Yes** (private states possible) → **Q3: Relationship if both exist?**  
    - Only consistent option: **Sufficient** (but not necessary).  
      - *Leaf 3: Broadcasting-Suffices View* (unnamed)  
        - **Core commitment**: Broadcasting is sufficient for phenomenal consciousness but unnecessary; private states can arise without it.  
        - **Awkward implication**: Super-blindsight is impossible (broadcasting entails phenomenality), so cases of global integration without experience must be misreports or incomplete broadcasting.  
  - **No** (broadcasting necessary for phenomenality) → **Q3: Relationship if both exist?**  
    - Only consistent option: **Sufficient** (and also necessary).  
      - *Leaf 4: Global Workspace Theory* (Dehaene, Naccache)  
        - **Core commitment**: Broadcasting is both necessary and sufficient for phenomenal consciousness; they are co-extensive.  
        - **Awkward implication**: Super-blindsight is contradictory (if information is broadcast, experience must occur), forcing reinterpretation of the case as non-broadcast or involving unreported phenomenality.  

  ---

  ### **Unoccupied Combinations and Gaps**
  - **No gaps in the tree**: All eight logically possible combinations of answers (2 × 2 × 2) are covered. However, only four leaves exist because Branch 1 and Branch 2 constrain Q3 options, eliminating inconsistent answers.  
    - **Why no gaps?** Each path’s Q3 options are restricted by prior answers (e.g., if Branch 1 = "No," Q3 cannot be "necessary but not sufficient" as broadcasting never lacks phenomenality). All consistent combinations are occupied.  
    - **No incoherent/unattractive gaps**: The tree’s constraints avoid logical contradictions (e.g., asserting "broadcast-only possible" while claiming broadcasting is sufficient for phenomenality). All positions are coherent but may be empirically or theoretically unattractive.  

  ### **Collapsed Positions**
  - **Leaf 3 and Leaf 4 are both labeled "sufficient" in Q3 but are distinct**:  
    - The tree **cannot fully separate** these positions on Q3 alone, as both answer "sufficient." However, they are **distinguished by Branch 2**:  
      - Leaf 3 (Branch 2B = "Yes") allows private phenomenal states without broadcasting.  
      - Leaf 4 (Branch 2B = "No") denies private states and implies necessity.  
    - **Where collapse occurs**: The branching structure partially collapses these positions under the "sufficient" label in Q3. Yet they are separable via Branch 2’s answer about private states.  

  ---

  ### **Summary of Positions**
  | Leaf | Branch 1 (Broadcast-only?) | Branch 2 (Private states?) | Q3 (Relationship) | Position                  | Core Commitment                                                                 | Super-Blindsight Implication                                                                 |
  |------|-----------------------------|----------------------------|-------------------|---------------------------|---------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------|
  | 1    | Yes                         | Yes                        | Neither           | Independence View         | Broadcasting and phenomenality are independent.                                 | Allowed; private states are undetectable.                                                    |
  | 2    | Yes                         | No                         | Nec. not suff.    | Necessary Ingredient View | Broadcasting necessary but not sufficient; requires extra factor.               | Allowed; the extra factor is missing.                                                        |
  | 3    | No                          | Yes                        | Sufficient        | Broadcasting-Suffices View| Broadcasting sufficient but not necessary; private states exist.                | Impossible; broadcasting implies phenomenality.                                              |
  | 4    | No                          | No                         | Sufficient        | Global Workspace Theory   | Broadcasting necessary and sufficient for phenomenality.                        | Contradictory; must be explained away.                                                       |

  ### **Recommendations for Presentation**
  - **Start with super-blindsight**: Use it as a diagnostic tool for each leaf (e.g., "If super-blindsight is possible, which leaves survive?").  
  - **Highlight tensions**: Emphasize how awkward implications (e.g., undetectable private states) expose theoretical trade-offs.  
  - **Note ambiguities**: Explain why Leaf 3 and Leaf 4 share a Q3 label but diverge on private states.  

  This taxonomy forces students to confront empirical and conceptual trade-offs (e.g., the cost of allowing private states vs. denying super-blindsight) without relying on named theories. It reveals how commitments about accessibility and phenomenality shape a theory’s viability.
