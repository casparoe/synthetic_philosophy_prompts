answer: |-
  Here’s the bottom line upfront: Formalizing a "failed analogies" reference class for AI timelines doesn’t resolve the core ambiguity of the reference class problem; it merely shifts the locus of contention to the even murkier boundary conditions defining membership in *either* class, potentially doubling the forecaster's flexibility to justify preferred outcomes.

  I appreciate the impulse to systematize historical failures rather than treating them as inconvenient noise. We’ve all seen AI predictions lean endlessly on the Manhattan Project or the Wright brothers, brushing aside the countless confident projections for fusion power, Martian colonies, or flying cars that remain science fiction. Creating a dedicated negative class forces explicit engagement with why some anticipated leaps stalled while others succeeded, moving beyond cherry-picked triumphalism. However, this framework introduces new layers of subjectivity precisely where we crave objectivity. The critical ambiguity isn’t solved—it relocates. Now, instead of debating which *successful* historical analog fits AI development, we must debate two highly contested boundaries: what qualifies for the *positive* class, and what definitively lands in the *negative* class.

  Consider membership in the "failed analogies" class. When does a "widely predicted" development become officially "unrealized"? Is it a fixed time horizon? Fifty years? A century? This risks path dependence: fusion has been "20 years away" for 70 years, but declaring it definitively unrealized today assumes it *never* will happen, which is itself a strong claim vulnerable to future disproof. More subtly, *why* did it "fail"? Was it due to fundamental physical limits, shifting societal priorities, inadequate funding, or simply misjudged complexity? Assigning it to the "failure" class implies a categorical lesson applicable to AI, but that lesson hinges entirely on interpreting the *cause* of the failure. If AI forecasters disagree on whether fusion failed due to intrinsic difficulty (analogous to AGI?) or contingent socio-economic factors (less relevant?), they’ll dispute its inclusion. The negative class becomes a graveyard filled with contested epitaphs.

  Simultaneously, defining the *positive* reference class becomes equally fraught. Does it include only breakthroughs achieved under conditions similar to today's AI funding and interest? What about successes preceded by long periods of false starts or dismissed predictions (like heavier-than-air flight itself)? Including them requires arguing they were *genuinely* analogous successes, not outliers saved by unique circumstances. Excluding them risks an overly narrow success class. The moment we have two classes, the act of categorization itself becomes a forecasting decision laden with assumptions about the mechanisms driving technological emergence. A skeptic can point to the graveyard of failures as proof AI is harder than we think, while an optimist can dismiss those failures as irrelevant due to differing boundary conditions (e.g., "AI has unique recursive improvement potential those lacked!") or recategorize borderline cases as "not yet succeeded." The dual classes don't impose discipline; they provide *two* sets of malleable boundaries to manipulate.

  Ultimately, the reference class problem stems from the irreducible difficulty of judging analogical similarity across unique historical contexts. Creating a negative class doesn’t magically confer rigor; it just demands we make *twice* as many contested analogical judgments – about what constitutes a true failure versus a delayed success, and what constitutes a valid success versus a lucky outlier – before we even get to comparing AI to either group. The ambiguity isn't resolved; it's redistributed and amplified. The value lies in forcing explicit discussion of failures, but it doesn't escape the hermeneutic circle of analogy. We replace the problem of choosing *which* history to reference with the problem of choosing *how* to sort history into bins, and the choice of bins will inevitably be swayed by the very AI timeline priors we seek to constrain.
