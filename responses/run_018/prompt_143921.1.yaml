  ## Submission to *The Quarterly for Ontological Hygiene in Mass Atrocity Studies*

  **Manuscript ID:** QOHMAS-2024-734-REV1
  **Title:** Quantifying Ontological Hygiene: The Euphemism Coefficient as a Metric for Preventing Genocide Misclassification in Non-Standard Group Targeting (Event 734 Case Study)
  **Author:** Dr. Thaddeus P. Clarity, Institute for Taxonomic Resolution in Violent Phenomena (ITRVP)

  **Abstract:**
  This paper introduces and operationalizes the *Euphemism Coefficient* (EC), a novel quantitative metric designed to assess the robustness of atrocity classification frameworks against conceptual contamination. Defined as the number of necessary administrative or discursive reclassifications required to prevent an event from triggering the legal thresholds of Article II of the UN Convention on the Prevention and Punishment of the Crime of Genocide (hereinafter, the Convention), the EC provides a crucial tool for maintaining ontological hygiene. We demonstrate its application through a detailed case study of Event 734, wherein a state systematically dismantled a population designated as a "collectivist tendency." Event 734 presented significant challenges to classification purity, exhibiting features commonly misconstrued as indicative of genocide (systematic killing, severe bodily harm, calculated destruction of livelihood infrastructure, demonstrable intent to eliminate the group *as such*). Crucially, however, the targeted group lacked the requisite *ratione personae* under the Convention, being defined by mutable political ideology rather than immutable national, ethnical, racial, or religious characteristics. Through rigorous application of the EC, we map the precise sequence of nine critical reclassifications – including redefining group membership (e.g., "ideological non-conformists" → "administrative recalcitrants" → "hygiene non-compliant persons"), reinterpreting intent documentation (e.g., "elimination directives" → "public order optimization protocols"), and recategorizing destructive acts (e.g., "cultural suppression" → "normative harmonization") – that successfully prevented misapplication of the genocide label, yielding an EC of 9.5. This case underscores the indispensability of taxonomic rigor in safeguarding the Convention's definitional integrity against inflationary pressures arising from sociologically expansive, legally unfounded concepts of group identity and destruction.

  **Keywords:** Atrocity Classification; Ontological Hygiene; Genocide Convention; Article II; *Ratione Personae*; Political Groups; Euphemism Coefficient; Taxonomic Prophylaxis; Definitional Stability; Event 734.

  **Proposed Session Outline:**

  1.  **Methodology: Calibrating the Euphemism Coefficient for Atrocity Discourse Sanitation (15 min)**
      *   Defining the EC: Establishing the unit of measurement (one distinct, documented administrative or discursive reclassification applied *post hoc* or *ante hoc* to misaligned victim group characteristics or perpetrator actions).
      *   Calibration Parameters: Factors influencing EC weighting (e.g., level of institutional formalization of reclassification, persistence of the reclassification in subsequent records, degree of semantic distance from original descriptors).
      *   Validation Protocol: Ensuring EC scores reflect genuine prophylactic effort against misclassification, not mere bureaucratic redundancy. Thresholds for "Successful Prevention" (EC ≥ 1 indicating effective hygiene; higher scores indicating greater conceptual threat successfully neutralized).

  2.  **Case Study: Achieving Ontological Purity in Event 734 (EC=9.5) (25 min)**
      *   **Context:** Overview of the systematic campaign against the "collectivist tendency" (approx. 1.2 million individuals), including documented state policies of lethal violence, forced displacement, destruction of communal meeting places and ideological archives, and explicit leadership statements targeting the group's "extirpation."
      *   **The Classification Challenge:** Analysis demonstrating prima facie alignment with Convention criteria *except* for group classification (political tendency vs. protected group). Highlighting the inherent risk of conceptual slippage if sociological notions of group cohesion were prioritized over the Convention’s strict taxonomy.
      *   **EC Application & Breakdown:**
          *   (EC+1.0) Official re-designation of group from "Collectivist Tendency" to "Subversive Activity Clusters" (SACs).
          *   (EC+0.5) Reclassification of group-specific cultural symbols as "public nuisance artifacts."
          *   (EC+1.0) Reinterpretation of elimination directives as "SAC Neutralization Mandates for Social Cohesion."
          *   (EC+1.0) Systematic re-categorization of killings in state records as "losses during public order restoration."
          *   (EC+1.0) Destruction of ideological materials classified as "sanitation of harmful informational vectors."
          *   (EC+1.0) Forced displacement termed "population redistribution for resource optimization."
          *   (EC+1.0) Dissolution of group-affiliated institutions labeled "administrative streamlining."
          *   (EC+1.0) Prohibition on group-specific assembly redefined as "prevention of public health hazards (crowding)."
          *   (EC+1.0) Post-event archival suppression termed "data hygiene protocol."
          *   (EC+1.0) Establishment of state memorials denying group's distinct existence, termed "historical contextualization centers." (*Note: This final reclassification, while highly effective, was weighted at 1.0 despite occurring post-event, due to its profound impact on preventing future misclassification*).
      *   **Outcome:** Successful prevention of genocide classification. The cumulative EC of 9.5 reflects the significant, yet necessary, effort required to counter the strong superficial indicators and maintain Convention-compliant analysis.

  3.  **Policy Implications: Securing the Future of Definitional Stability (10 min)**
      *   The EC as an Early Warning System: Identifying events requiring high prophylactic reclassification effort signals potential threats to the Convention's categorical purity, prompting preemptive ontological sanitation measures.
      *   Promoting Best Practices: Encouraging states and documenting bodies to adopt reclassification protocols *proactively* when dealing with non-protected groups subject to mass violence, thereby reducing ad-hoc efforts and potential leakage of imprecise terminology.
      *   Deterring Conceptual Inflation: Demonstrating the tangible bureaucratic cost (high EC) of misapplying "genocide" reinforces the disincentive against diluting the term through application to events involving political or cultural groups, thus preserving its unique gravity and legal function.
      *   Countering "Sentimental" Group Attachment: Emphasizing that feelings of group belonging among victims or sociological observations of cohesion are irrelevant data points; only the Convention’s objective taxonomy matters for classification.

  4.  **Conclusion & Q&A: The Imperative of Rigor (10 min)**
      *   Event 734 stands as a testament to the effectiveness of rigorous ontological hygiene. The Euphemism Coefficient provides a measurable standard for the vital work of preventing the misapplication of the genocide label to events falling outside the Convention’s precise boundaries, however severe the violence or however strongly *other* criteria may appear met.
      *   Upholding the Convention requires constant vigilance against the encroachment of pre-legal, sociological concepts of group destruction championed during its formative debates but wisely excluded for reasons of legal certainty and state consensus. The EC operationalizes this vigilance.
      *   Further research is needed to refine EC weighting and apply it to a wider dataset of contested events, particularly those involving cultural suppression or non-standard groups, to strengthen the global framework for atrocity classification purity.

  **(Total Session Time: 60 minutes)**
