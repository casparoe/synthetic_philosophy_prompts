  The piece should exaggerate a real feature of this discourse: the strategic deployment of taxonomic rigor to generate euphemism. Do not invent a fake practice; rather, push the actual logic of definitional exclusion to an absurd extreme. To satisfy the constraint that the prompt be meaningful without online search yet avoid pure regurgitation of standard textbook accounts, inject the following niche framing device: invent a quantitative metric called the Euphemism Coefficient, defined as the number of administrative reclassifications required to prevent an event from triggering Article II, and apply it to a fictional case study designated Event 734. In this case study, a state systematically destroys a population legally categorized as a political tendency rather than a protected group, despite the presence of every other conventional criterion. Include mock sections—Abstract, Keywords, Methodology, Case Study, Policy Implications, Conclusion—written in the voice of a researcher who genuinely believes that ontological hygiene resolves moral ambiguity.

  Maintain absolute internal consistency and a straight face throughout: there should be no winking, no explicit acknowledgment that the piece is satire, and no contradiction of the deadpan voice. The humor must arise from the rigor with which the author applies the Convention’s exclusions, making it ever more obvious that the framework is designed to fail at recognition. A reader familiar with Lemkin’s 1944 formulation and the drafting history of the 1948 Convention—including the exclusion of cultural genocide and political groups—should find the satire fair, while a non-specialist should understand that treating mass violence as a classification puzzle is morally grotesque. Do not include bibliographies, citation requests, or reading lists; do not ask for quotations from real texts, and if you reference specific provisions or historical moments, paraphrase them without quotation marks rather than reproducing verbatim language. The intended audience is interdisciplinary scholars who will recognize references to strategic euphemisms such as ethnic cleansing or complex humanitarian emergency, but do not depend on obscure secondary literature.
