answer: |-
  Your diagnosis is perceptive: **the core disagreement is substantive, rooted in incompatible frameworks for rationality and ontology, and manifests as two distinct questions operating under one term.** Progress requires decoupling these dimensions and confronting the formal challenge of non-probabilistic rationality. Here’s the breakdown:

  ### 1. **The Two Camps & Their Core Questions**
     - **Ontological Camp (Future as Genuinely Indeterminate):**  
       Reads Keynes as claiming *the economic future lacks pre-existent probabilistic structure*. Uncertainty isn’t just incomplete knowledge—it reflects an *open* reality where outcomes aren’t even "in principle" quantifiable (e.g., the 1914 European war had no meaningful probability before it occurred). This makes mathematical expectation *metaphysically impossible* for "low weight" events.  
       *Rationality Implication:* Agents must use non-probabilistic heuristics (conventions, animal spirits) because no "rational" probabilistic calculus exists.  
       *Anchor Text:* Keynes’s dismissal of applying probability to "matters of deep political uncertainty" (TP, Ch. 30).

     - **Epistemic Camp (Severe but Surmountable Limitation):**  
       Sees Keynes describing *human ignorance in complex systems*, not metaphysical indeterminacy. Probabilities exist but are unknowable or too unstable to quantify. Uncertainty is an extreme case of partial information.  
       *Rationality Implication:* Agents *should* try to form probabilistic beliefs (e.g., via Bayesian updating with vague priors, or imprecise probabilities). Failure to do so is a cognitive/technical shortfall.  
       *Anchor Text:* Keynes’s focus on "insufficient basis" for probability calculations (TP, Ch. 6).

  ### 2. **The Substantive Conflict: Rationality vs. Ontology**
     - **Not Verbal:** Both sides agree Keynes rejects frequentist probability for unique/long-term events. The clash is over *why* he rejects it.  
     - **Not Primarily Textual:** Exegesis alone won’t resolve this because Keynes ambiguously blends epistemic and ontological language.  
     - **The Real Divide:**  
       - **Ontologists** tie rationality to ontology: If the future lacks probabilistic structure, rationality *cannot* mean optimizing expected utility.  
       - **Epistemicists** separate rationality from ontology: Agents should *still* aim for probabilistic coherence (e.g., via subjective degrees of belief), even if data is sparse.  

     This reduces to **whether rationality requires probabilizable uncertainty**. Epistemicists say yes (per Savage’s axioms); ontologists say no (per Keynes’s critique of "pretence of knowledge").

  ### 3. **The Concealed Formal Issue: Can "Weight" Be Captured?**
     The stalemate hinges on whether formal tools can reconcile Keynes’s "weight of argument" with rationality:  
     - **Imprecise probabilities (IP) / Second-order beliefs** (epistemic tools) *try* to model weight (e.g., through credal sets or confidence intervals).  
     - **Ontological Critique:** IP still assumes outcomes are defined in a closed space of possibilities. If the future is truly open (e.g., unknown unknowns), IP fails because the *event space itself* is indeterminate.  
     - **Key Test Case:** Can IP model Keynes’s "European war" example *before 1914*? Epistemicists might assign a vague probability to "major conflict"; ontologists argue no probability—vague or precise—applies to events outside historical precedents.  

     **Result:** If IP formalizes "Keynesian uncertainty," the epistemic view wins. If IP fails to handle radical novelty, the ontological view gains ground.

  ### 4. **Path to Progress: Beyond Exegesis**
     - **Conceptual Distinction:** Explicitly separate:  
       **(a) Ontological Uncertainty** (Does the future have a determinate structure?)  
       **(b) Normative Rationality** (How should agents decide under ignorance?).  
       *This ends the conflation driving the current debate.*  
     - **Formal Result Needed:** Prove whether non-probabilistic decision rules (e.g., maximin, liquidity preference) can be *internally consistent* without collapsing into hidden probabilities. If they can, ontological rationality is viable; if not, epistemicism prevails.  
     - **Empirical/Behavioral Test:** Identify real-world decisions where:  
       - Probabilistic models fail *persistently* (e.g., long-term investments, climate policy).  
       - Agent behavior aligns with non-probabilistic heuristics *and* outperforms probabilistic approaches.  
       *Example:* If "precautionary principle"-style actions (e.g., hoarding liquidity) systematically avoid tail risks better than probabilistic models in crises, ontology gains support.  

  ### Bottom Line
  The conflict is **substantive** and turns on whether rationality *demands* probabilistic thinking even in ignorance. **Resolution requires formal and empirical work**:  
  1. Formalize "open future" decision rules and test their coherence.  
  2. Identify empirical domains where probabilistic models structurally fail.  
  Until then, Keynesian uncertainty remains a Rorschach test: epistemicists see a technical challenge; ontologists see a metaphysical truth about economic time. Your instinct is right—the stalemate isn’t about Keynes, but about the foundations of economic rationality itself.
