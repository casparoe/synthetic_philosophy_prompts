prompt: |-
  I run a small dispute-resolution practice, mostly for academic teams -- co-authors who've fallen out, labs splitting over what their own results show, that sort of thing. I keep noticing the same pattern: two people going hammer and tongs at each other, and twenty minutes in you realise they don't actually disagree about anything factual, they're just using one key word differently. The philosopher Eli Hirsch and others have written about merely verbal disputes, and I've read enough to suspect half my caseload is this, but I've never seen anyone turn it into something a mediator can actually do in the room, in real time, with two angry people.

  So: write me that procedure. I want something I can run during a session, in my head or on a notepad, in about ten minutes, that sorts a dispute into roughly three buckets -- purely verbal (dissolves once the contested word is banned and each side restates their claim without it), genuinely substantive (survives the ban), or the awkward third case where the fight isn't about facts at all but about which meaning of the word ought to be the standard one going forward, which I gather is a real category and not the same as either of the other two. For each bucket, tell me what the procedure instructs me to do next as the mediator, because I suspect the right move differs a lot -- dissolving a verbal dispute is a different job from refereeing a fight over how a term should be defined.

  The procedure has to handle some hard cases I actually see. First, disputes where both sides accept the same definition but disagree about whether a borderline case falls under it (is that verbal, factual, or neither?). Second, disputes where the word is load-bearing in some document with consequences -- a grant condition, a job title, an authorship criterion -- so even if the conceptual disagreement is verbal, the fight isn't really about the concept at all, and telling them it's merely verbal just makes them angrier. Third, cases where one party's whole identity or prior work is invested in their usage, so the restatement step itself gets resisted. Be honest about where the procedure breaks down and where I just have to use judgement -- I'd rather you flag those points explicitly than pretend the checklist covers everything.

  Work it through on at least two realistic examples, with the actual reasoning shown: one where a heated dispute about whether an algorithm discriminated turns out to be one side meaning disparate outcomes and the other meaning intent (and what I do once that's diagnosed), and one where the procedure gives an answer I won't like -- e.g. a dispute that feels deep and important to both parties gets classified as merely verbal and the procedure tells me to dissolve it, even though the parties clearly aren't done fighting, because the real fight is over something else like resources or status.

  A few constraints on the reply itself: no headings, no bullet points, no bold, no numbered steps set off on their own lines -- just continuous prose, the way you'd write a long email to a colleague. If the procedure has ordered steps, walk me through them in prose ('first you do this... then, if that's failed, you do that...'). And keep it usable by someone smart who hasn't read the philosophy literature -- translate the theory, don't just cite it at me.
reasoning: |-
  Okay, the user runs a dispute-resolution practice for academic teams, like co-authors or labs in conflict. They notice a pattern where arguments often boil down to using a key word differently, not actual factual disagreements. They want a practical procedure to sort disputes into three buckets: purely verbal (resolved by banning the word), substantive (real disagreement persists), or a third category where the fight is about which definition should be standard. 

  The user needs something usable in real-time with angry people, handling hard cases like borderline definitions, loaded terms with real-world consequences, and identity-invested usage. They also want examples, including one where the procedure classifies a heated dispute as verbal but the parties keep fighting.

  First, I need to recall Eli Hirsch's work on verbal disputes. The core idea is that if a disagreement vanishes when both parties rephrase without the contested term, it's verbal. But real-life adds layers: emotions, stakes, ambiguous cases. The procedure must be robust yet flexible.

  For the three buckets: 
  1. **Purely verbal**: Banning the word resolves it. 
  2. **Substantive**: Disagreement remains after rephrasing. 
  3 **Normative/metalinguistic**: Arguing over which definition *should* be used, often tied to values or consequences. 

  The procedure steps should flow naturally: isolate the term, test rephrasing, diagnose the bucket, then act accordingly. For mediators, the post-diagnosis steps matter most — dissolving vs. refereeing vs. reframing. 

  Hard cases: 
  - **Borderline disputes**: If both agree on the definition but not its application (e.g., "is this bluish-green 'blue'?"), it's factual if evidence settles it (e.g., wavelength measurements), but normative if it hinges on context (e.g., "should we call this 'blue' for our taxonomy?"). Mediators must probe whether the conflict is about evidence or thresholds. 
  - **Load-bearing terms**: Even if conceptually verbal, the fight is about real-world impacts (e.g., a grant condition). Here, the procedure flags it as "verbal-plus-consequences," requiring negotiation over outcomes, not just definitions. 
  - **Identity-invested usage**: Resistance to rephrasing signals the third bucket. The term isn't just a label; it’s tied to credibility or legacy. Mediators must validate feelings before tackling semantics. 

  Examples are crucial. For the algorithm discrimination case: 
  - Side A (disparate outcomes) and Side B (intent) both say "discrimination" but mean different things. 
  - Ban the word: A rephrases as "the output is unequal," B as "the designers didn’t intend bias." 
  - No factual clash — they agree on the algorithm’s mechanics and outcomes. 
  - Diagnosis: purely verbal. Mediator dissolves it by showing mutual understanding, then redirects to practical solutions (e.g., "Should we fix the unequal output regardless of intent?"). 

  For the "answer you won’t like" example: 
  - A lab dispute over "authorship" on a paper. Both agree a technician’s contributions were "minor" but clash on whether minor contributions warrant authorship. 
  - Ban "authorship": A says "they didn’t do enough for credit," B says "their name belongs there." 
  - The disagreement persists — it’s substantive? Wait, no: if they agree on the facts (what the technician did), but disagree on the threshold for authorship, it’s normative (bucket 3). 
  - But the mediator suspects status/resource tensions: e.g., the technician feels exploited. 
  - Procedure classifies it as normative (fighting over what "authorship" *should* mean), but the real issue is unspoken resentment. 
  - Here, the procedure "breaks" — it resolves the verbal layer, but the mediator must probe deeper: "What’s at stake if we define authorship this way?" 

  Key limitations to flag: 
  - The procedure can’t force parties to rephrase if they’re entrenched. 
  - It might miss hidden conflicts (e.g., resource fights disguised as semantic ones). 
  - Borderline cases need judgment calls: is this about evidence or values? 

  Finally, structure the reply as fluid prose — no lists, just a natural walkthrough. Start with the procedure, interweave examples, and end with caveats. Translate philosophy into mediator-speak: e.g., "normative/metalinguistic" becomes "fighting over how we *should* define this term."
answer: |-
  Here's how I'd approach building that procedure, refined through the kinds of messes you face daily. It's less a rigid flowchart and more a mental dance with four core moves, aiming to sort the dispute within ten minutes while managing the heat. Think of it as pressure-testing the language while keeping the parties engaged.

  **The Core Moves:**

  First, **Identify the Load-Bearing Term (LBT):** Don't wait for the twenty-minute mark. Listen actively from the outset for the word or phrase that acts as the epicenter of the fury. It's usually repeated forcefully ("That *is* discrimination!" / "No, it absolutely is *not*!"), triggers emotional spikes, and seems pivotal to the core accusation or defense. Jot it down. Let's call it "LBT" for short. Sometimes there might be two, but start with the most volatile one.

  Second, **Clarify Definitions (Without Debate):** This is delicate. You need their meanings, not a fight. Frame it neutrally: "When you say [LBT], what specific situation or characteristic are you pointing to?" or "Help me understand the key ingredients you see making this [LBT]." Probe gently for concrete indicators, examples, or necessary conditions. Note each side's definition *separately* on your pad. Crucially, *avoid* asking "What is [LBT]?" – that invites abstract, contested definitions. Focus on *their application* of the term *in this case*. Ask: "What facts here make this [LBT] for you?" and "What facts would *not* make it [LBT]?" This surfaces boundaries.

  Third, **The Ban and Rephrase Test:** This is the crux. Announce: "Okay, we've heard how important [LBT] is. To make sure we're focused on the substance, let's try something. For the next few minutes, neither of you uses the word '[LBT]' or any direct synonym. Instead, I want each of you to restate your core position about *what happened* or *what should be*, using only the factual descriptions we've touched on or other neutral language. [Side A], what are you most concerned about, *without* using [LBT]? [Side B], what is your core response to that concern, also without [LBT]?" Force the rewording. If they slip, gently remind: "Remember, no [LBT]. Describe the *thing* itself."

  Fourth, **Diagnose & Act (The Three Buckets):** Now, analyze the rephrased positions against the definitions you captured.

  1.  **Bucket 1: Purely Verbal (Dissolves on Ban):** Their rephrased positions *don't clash factually*. They agree on the underlying events, data, or actions, but were using LBT with different meanings. *Example:* A says (rephrased): "The algorithm gives Group X significantly worse loan approval rates than Group Y, even controlling for creditworthiness." B says (rephrased): "The developers did not design the algorithm intending to harm Group X; they were optimizing for repayment probability using approved factors." *Diagnosis:* Agreement on outcomes (disparate impact) and lack of malicious intent. Disagreement was solely on whether "discrimination" *means* disparate impact or requires intent. *Your Move:* Congruence Highlighting. Explicitly state the agreement: "So, you both agree the outcomes differ significantly for Group X, and you both agree there was no intent to harm Group X based on that group membership. The disagreement was entirely about the label 'discrimination' meaning impact versus intent. Since we've banned that word and you agree on the facts, does that resolve this particular point of conflict?" Point to the shared factual ground. Then pivot: "Given this agreement on what *happened*, what needs to happen next regarding the algorithm's outcomes?" Guide them towards practical resolution based on the uncovered consensus.

  2.  **Bucket 2: Genuinely Substantive (Survives the Ban):** The rephrased positions *still fundamentally clash* on core facts, interpretations of data, or predictions. *Example:* After banning "validated method," A rephrases: "The control group was contaminated by exposure to the experimental stimulus during Phase 2, invalidating the comparison." B rephrases: "The isolation protocols in Phase 2 were strictly enforced; there was no contamination." *Diagnosis:* Direct factual disagreement about contamination. *Your Move:* Shift Gears. Acknowledge: "Okay, banning '[LBT]' hasn't resolved this. You have a substantive disagreement about whether contamination occurred in Phase 2. That's a factual question we need to address." Move into standard evidence-based mediation: explore evidence sources (logs, data, witnesses), timelines, or agree on a process to verify this specific point. The verbal dispute test has succeeded by isolating the *real* factual bone of contention.

  3.  **Bucket 3: Normative/Metalinguistic (The "Ought" Fight):** The ban reveals they *agree* on the core facts, but the rephrased positions still clash on *how LBT should be defined or applied*, often tied to values, standards, or consequences. Borderline cases often land here. *Example:* Dispute over whether a researcher's contribution was "significant" enough for authorship. Both agree on *what* the researcher did (e.g., ran specific assays under direction). A (rephrased): "Running pre-defined assays, without intellectual input into design or interpretation, does not meet the criteria for authorship credit as established in field norms." B (rephrased): "Performing essential technical work without which the key results couldn't have been obtained *should* qualify someone for authorship, regardless of intellectual input." *Diagnosis:* Agreement on actions. Disagreement on what the threshold for "significant contribution" *ought to be* (intellectual vs. technical necessity) or whose norms apply. *Your Move:* Reframe as Negotiation. Explain: "It seems you agree on what [Name] actually did. The disagreement is about whether that level and type of contribution *should* earn authorship under the relevant criteria. This isn't about the facts of the work, but about how we interpret and prioritize the standards." Avoid declaring a "right" definition. Focus on interests: "What's most important to you in defining authorship here? Ensuring intellectual credit? Recognizing essential technical effort? Future collaboration? Adhering strictly to journal guidelines?" Explore the *consequences* of each definition and negotiate an outcome based on shared goals or principles. This is where the hard cases often live.

  **Handling Your Hard Cases:**

  *   **Borderline Cases:** These often fall into **Bucket 3**. If both accept the core definition (e.g., "significant contribution requires intellectual input") but disagree on whether *this specific case* meets it (e.g., "did tweaking the assay parameters count as 'intellectual input'?"), it's usually normative. The fight isn't about the definition's core, but about where the fuzzy boundary *should* be drawn in this context, often influenced by values (fairness, precedent, rigor). Your move is Bucket 3: Reframe as a negotiation over the *application* of the standard, considering context and consequences.
  *   **Load-Bearing Terms (Consequences):** Even if Bucket 1 (purely verbal) is diagnosed conceptually, the *fight isn't dissolved* because the word is tied to real stakes (money, credit, jobs). *Don't* just say "it's merely verbal." Acknowledge: "While we see the conceptual disagreement stems from different meanings of [LBT], the reason this is so heated is that the *term itself* triggers [grant condition/authorship credit/etc.]. So, resolving the conceptual part is step one, but we still need to address the real-world consequence attached to the *use* of that term." Separate the layers: 1) Dissolve the conceptual confusion (Bucket 1 move). 2) Explicitly shift to negotiating the *stakes*: "Given we now agree on the facts [summarize], how should we handle the [grant/authorship] requirement given its wording?" This might involve reinterpreting the document, seeking clarification, or negotiating an exception based on the clarified facts.
  *   **Identity/Investment Resistance:** When banning or rephrasing is fiercely resisted ("But it *is* discrimination! That's the whole point!"), it's a red flag for **Bucket 3** or deep **Bucket 2** with emotional stakes. The term is part of their professional identity or legacy. *Your Move:* Validate Before Proceeding. "I hear how important this term is to you; it connects to core principles you've worked by [or your prior work on X]. My goal isn't to take that away, but to make sure we absolutely understand each other deeply. Can you help me see *why* this specific label is so crucial here, beyond just the definition? What principle or value does it protect for you?" Uncover the underlying value (fairness, scientific integrity, recognition). Then, carefully frame the Ban/Rephrase as *a tool to ensure that value is fully understood and addressed*, not erased. "To make sure we safeguard that principle of [fairness], let's try describing the situation without the label first, so we're crystal clear on what we're protecting against." If resistance persists, you might need to work *around* the term initially, focusing on concrete actions/outcomes, and circle back later.

  **Example You Won't Like (The "Merely Verbal" Trap):**

  **Scenario:** Two professors (A & B) clash violently over whether a shared grad student's methodology was "rigorous." The student's future funding hinges on this label in a report. After steps:
  *   *LBT:* "Rigorous."
  *   *Definitions:* A: "Adhered strictly to pre-registered protocol, controls, p-hacking checks." B: "Used the most statistically powerful methods available, even if protocol was adapted iteratively."
  *   *Ban & Rephrase:* A: "They deviated from the pre-registered steps 3 times and didn't run the planned sensitivity analysis." B: "They used a Bayesian MCMC approach giving more precise estimates than the pre-registered frequentist method, and justified sensitivity checks post-hoc."
  *   *Diagnosis:* **Bucket 1 (Purely Verbal).** They agree *factually* on what was done (deviations, method change). A values strict protocol adherence as "rigor." B values optimal statistical power as "rigor." No factual dispute about the *actions*.

  **The Problem:** You say: "Okay, you agree on the changes made. The disagreement was just about the label 'rigorous.' Since we've banned it and agree on the actions, does this resolve it?" They erupt: "No! It's crucial she's called rigorous! Her funding needs it!" / "But calling it rigorous sets a terrible precedent!" The real fight is about the student's funding (resource) and departmental standards/precedent (status/power).

  **Where the Procedure "Breaks" (and What to Do):** The procedure correctly identified the *conceptual* dispute as verbal. But it didn't (and can't) magically dissolve the *real-world conflict* over the *consequences* of applying the label. The diagnosis is still useful! You know the factual ground is shared. Now you *must* pivot hard:

  1.  **Explicitly Separate Layers:** "I see we agree on what was actually done in the methodology. The intense disagreement now seems to be about the *consequences* of how we *label* that work – specifically regarding [Student's] funding and the precedent it sets for departmental standards. Is that fair?"
  2.  **Shift to Negotiating Consequences:** "Given the shared understanding of the methodology [briefly recap factual agreement], how can we address the funding requirement in a way that's fair to [Student] while addressing concerns about setting future expectations? Are there alternative ways to demonstrate suitability for funding? Can we document the methodological choices and their justification separately from the 'rigor' label?" Move the conversation away from the contested term entirely and onto the underlying resource/status conflict, using the factual agreement as the foundation.

  **Limitations & Need for Judgment:**

  *   **Complexity:** Real disputes often involve multiple interwoven LBTs. The procedure works best tackling one major one at a time. Judgment is needed on where to start.
  *   **Opacity:** Parties might not articulate their definitions clearly, or might mask deeper issues (resentment, power struggles) with semantic fights. The Ban/Rephrase test can help surface this if the disagreement persists illogically or emotions remain high despite factual agreement. Trust your gut if it feels like something else is lurking.
  *   **Stalling/Bad Faith:** If a party refuses to engage in good faith with the definition clarification or ban (e.g., being deliberately vague, changing definitions), the procedure stalls. You need judgment to call out the impasse ("I'm having trouble understanding what specifically makes this [LBT] for you, which makes it hard to move forward").
  *   **Ambiguous Bucket 3:** Distinguishing Bucket 3 (normative) from subtle Bucket 2 (factual) can be tricky, especially with borderline cases. Ask: "If we had a perfect video replay of events/data, would that resolve it?" If yes, it's likely latent Bucket 2. If no (it's about interpretation/standards), it's Bucket 3.
  *   **Emotion Overload:** Sometimes, the anger is too high for semantic surgery. You might need de-escalation (active listening, validation, breaks) *before* diving into this procedure. Don't force it if they can't engage rationally.

  The core value of this procedure isn't always a neat resolution in 10 minutes. It's in efficiently *diagnosing the nature of the beast* – revealing whether the conflict is a mirage of language, a clash of facts, a fight over values/rules, or a proxy for something else. That diagnosis – knowing which bucket you're in – tells you *what kind of mediation tools* to pull out next and where the real pressure points are, saving immense time and frustration for everyone, including you. It turns a philosophical insight into a practical triage tool for the trenches.
