prompt: |-
  I’m a retired biologist who got into philosphy after I stopped running the lab — mostly medical ethics and personal identity stuff. Last Tuesday I was at my neigbor’s study group and two people got stuck in a real knot about advance directives. One, Mara, said that if you write a living will refusing a feeding tube, that document should always win, even if years later you’ve got severe dementia and seem to enjoy eating. She compared it to leaving a locked protocol in a lab: the PI’s instructions don’t become invalid just because the equipment is running differently now.

  The other, Leo, pushed back hard. He said binding a present, feeling person to a dead author’s preference is basically autonomy grave-robbing — you’re honoring a ghost while harming someone who currently resists the tube. Mara came back that Leo smuggles in a false identity claim: he treats the dementia patient as a totally new person, but there’s still biographical continuity — same body, same legal identity, partial emotional patterns. She proposed a biographical continuity threshold, where only if narrative memory is almost entirely gone should the directive shift from command to bequest. Leo then argued that even if continuity exists, the present subject’s affective sovereignty should override, especially since the directive was made in ignorance about what dementia actually feels like. He mentioned a case he’d read about — a woman with advanced Alzheimer’s who smiled constantly but whose directive demanded aggressive intervention — and said forcing the tube was like writing data into an old experiment log that the current apparatus wants to close. Neither would budge. So who’s right about what here? Is Mara correct that autonomy is diachronic and the earlier self retains authority? Or is Leo right that present experiential sovereignty should trump? And what are they both missing — maybe about whether directives are promises to oneself versus instructions to doctors, or about how much narrative continuity actually survives in late dementia?
reasoning: |-
  Okay, let me start by unpacking this user's query. They're a retired biologist turned philosopher, so they have a solid background in science and now ethics. The scenario they described involves a debate between Mara and Leo about advance directives, specifically regarding feeding tubes for dementia patients. Mara argues that the living will should always be honored, comparing it to a locked lab protocol. Leo counters that the current person's experience should override the directive, calling it "autonomy grave-robbing."

  First, I need to understand the core philosophical conflict here. Mara is emphasizing diachronic autonomy—selfhood over time. Her lab protocol analogy suggests she views identity as continuous, hence the past self's decisions are binding. Leo focuses on synchronic autonomy, prioritizing the present self's experiences, especially when the past self couldn't fully anticipate the current state.

  The user wants to know who's right and what both might be missing. They also hint at deeper layers: are directives promises or instructions, and how much narrative continuity exists in late dementia? 

  I should start by breaking down both arguments. Mara's point relies on identity continuity through biography and bodily persistence. But Leo challenges that by emphasizing the qualitative difference in lived experience. The case study he mentions about the Alzheimer's patient who smiles but had an aggressive directive highlights the ethical dilemma of imposing past wishes on a seemingly content present self.

  Next, considering the user's background in biology and philosophy, they might appreciate connections to neuroscience and personal identity theories. For instance, Derek Parfit's reductionist view could be relevant: if identity isn't what matters, but psychological connectedness, then in late dementia, the connectedness might be too weak to justify binding the current self.

  The user also brings up narrative continuity. How much of that remains in late dementia? Research shows that while episodic memory fades, emotional or procedural memories might persist. But is that enough for continuity? Mara's threshold idea is practical but arbitrary—who decides when continuity is lost?

  Another angle is the nature of directives. If they're seen as promises to oneself, there's a deontological obligation to uphold them. But if they're instructions to doctors, maybe flexibility is built-in. The user might be interested in how different interpretations affect the debate.

  Both Mara and Leo might overlook how directives function in real-world medical ethics. Clinicians often assess current quality of life and inferred consent. Also, the role of surrogate decision-makers could bridge the gap between past and present preferences.

  The user's deeper need might be to resolve this tension in a way that respects both autonomy and compassion. They might seek a framework that incorporates empirical data on dementia experiences while honoring ethical principles. Exploring concepts like Ulysses contracts or relational autonomy could add depth. 

  I should also address the legal vs. ethical dimensions. Legally, advance directives are binding, but ethically, there's debate. Cases like the one Leo mentioned challenge rigid adherence. Maybe the solution lies in nuanced approaches, like requiring periodic updates to directives or including clauses for dementia-specific scenarios.

  In conclusion, neither Mara nor Leo is entirely right. The answer likely involves balancing past and present autonomy, considering the degree of identity discontinuity, and ensuring decisions prioritize well-being without discarding precedent. Highlighting what both miss—like relational aspects, empirical unknowns, or systemic factors—could provide the user with a comprehensive understanding to apply in their study group.
answer: |-
  What a rich and nuanced debate – exactly the kind of knotty problem that makes philosophy after the lab bench so compelling! Mara and Leo are grappling with one of the *hardest* problems in medical ethics and personal identity: the authority of the past self over the future, radically changed self. Neither is entirely right nor entirely wrong, and both highlight crucial aspects while potentially overlooking key complexities.

  Here's a breakdown:

  **Mara's Position (Upholding the Directive):**

  *   **Core Argument:** Diachronic Autonomy & Identity Continuity.
  *   **Strengths:**
      *   **Respects Precedent Autonomy:** Honors the deeply held values and fears (e.g., of prolonged existence without cognitive capacity) that motivated the directive. It treats the person as a temporally extended being.
      *   **Prevents Exploitation/Convenience:** Protects against surrogates or caregivers overriding stated wishes based on *their* discomfort, burden, or interpretation of "happiness" in dementia.
      *   **Identity Claim:** Correctly points out that biographical continuity (same body, legal identity, some emotional patterns, shared history) persists even in profound dementia. It's *not* a totally new person; it's a severely diminished version of the same person.
      *   **Practicality & Certainty:** Provides clear guidance ("locked protocol") in emotionally fraught situations, reducing ambiguity and potential conflict.
  *   **Weaknesses/Potential Oversights:**
      *   **The "Ignorance" Problem:** Leo is right that the pre-dementia self fundamentally *cannot know* what moderate or even severe dementia feels like *from the inside*. Fear of a hypothetical state may not align with the experiential reality.
      *   **Overstates Identity Continuity:** While biographical continuity exists, the *psychological* continuity crucial for many conceptions of personal identity (Locke, Parfit) – particularly narrative memory and the capacity for reflection – is severely eroded or gone. Does the directive bind a being who lacks the psychological capacities that made the directive meaningful?
      *   **Risk of Harming a Sentient Being:** Prioritizes the wishes of a non-existent past self over the demonstrable well-being (e.g., apparent enjoyment of eating) of a present, sentient being. Is this truly respecting "autonomy" if the current subject has no concept of autonomy and resists the directive?

  **Leo's Position (Present Sovereignty):**

  *   **Core Argument:** Synchronic Autonomy & Affective Sovereignty.
  *   **Strengths:**
      *   **Centers Present Experience:** Prioritizes the well-being and observed preferences of the *actually existing* person before you.
      *   **Avoids Harm:** Prevents inflicting suffering (e.g., force-feeding via tube on someone who resists) based solely on a document authored by someone who no longer exists psychologically.
      *   **Acknowledges Radical Change:** Correctly identifies that profound dementia creates a being with fundamentally different capacities and experiences. Binding them to the past self *can* feel like "grave-robbing."
      *   **The "Ignorance" Problem:** Validly highlights the experiential gulf between the anticipatory fear and the lived reality.
  *   **Weaknesses/Potential Oversights:**
      *   **Undermines Advance Care Planning:** If directives can be easily overridden based on *current* affect (which might be misinterpreted or manipulated), it destroys the purpose and trust in such documents. Why write one?
      *   **Understates Identity Continuity:** Dismisses the persistent biographical and bodily connection too readily. The dementia patient *is* the same human being who wrote the directive, even if profoundly altered.
      *   **Risk of Subjective Interpretation:** "Affective sovereignty" is incredibly hard to gauge reliably in advanced dementia. Is smiling always happiness? Is resistance always informed preference, or just confusion/agitation? Opens the door to well-meaning but potentially biased interpretations by caregivers/surrogates.
      *   **Slippery Slope:** If we override directives based on current affect in dementia, what about other conditions that alter personality or preferences (e.g., severe depression, brain injury)?

  **Who's "More" Right? The Uncomfortable Truth:**

  Neither position provides a perfect, universally applicable answer. The ethical weight shifts depending on **the specific nature and severity of the dementia, the clarity and rationale of the directive, and the observable state of the current patient.**

  *   **Early/Mid Dementia:** Where significant narrative identity and comprehension remain, the directive likely carries more weight (leaning towards Mara).
  *   **Profound/Late Dementia:** Where the self described in the directive is effectively gone, replaced by a sentient being with minimal connection to past values/narrative, prioritizing current well-being and avoiding harm becomes paramount (leaning towards Leo).

  **What Both Might Be Missing (Your Instincts are Sharp!):**

  1.  **Directives as Promises vs. Instructions:**
      *   **Promises to Oneself:** Mara leans here. The directive is a solemn commitment to future values ("I *promise* myself I won't live like that"). Breaking it feels like a deep betrayal, even if the current self doesn't understand.
      *   **Instructions to Caregivers:** Leo leans here. The directive is information about *likely* preferences to guide decisions when the patient can't decide *now*. It's data, not an inviolable command. The *current* patient's well-being is the primary guide.
      *   **Reality:** They function as *both*, creating the tension. Good directives often include the *reasons* behind the choices, helping caregivers understand if it was a core value promise (e.g., "I value cognitive life above all") or a practical instruction based on fear of burden.

  2.  **Narrative Continuity in Late Dementia:**
      *   Both oversimplify. While *episodic* and *autobiographical* memory are devastated early, elements persist longer:
          *   **Procedural Memory:** Habits, routines, emotional responses to music/food/touch.
          *   **Core Emotional Traits:** Basic temperament (calm, anxious) often endures.
          *   **Emotional Resonance:** Reactions to familiar people/places, even without explicit recognition.
      *   **The Critical Point:** This remaining continuity is often *not* sufficient to sustain the *narrative self* – the "I" with a life story, values, and future projects – that authored the directive. The being enjoying pudding isn't "the author" making a choice; it's a being experiencing a moment of sensory pleasure, largely disconnected from its past narrative.

  3.  **The Role of Well-being (Beyond Autonomy):**
      *   The debate focuses heavily on autonomy (past vs. present). But *well-being* is a crucial independent ethical consideration. Forcing unwanted treatment on a sentient being causing distress is harmful, regardless of autonomy arguments. Conversely, withholding basic care (like assisted feeding) from a being experiencing hunger or distress, solely based on a past document, is also potentially harmful. Assessing *current* well-being (as best we can) is essential.

  4.  **The "Ulysses Contract" Analogy (and its Limits):** Mara's lab protocol is like a "Ulysses Contract" (tying oneself to the mast to resist future temptation). These are valid for resisting *known weaknesses* (e.g., addiction). But dementia isn't succumbing to a known weakness of the *same self*; it's the emergence of a *radically different state of being*. The analogy starts to break down precisely at the point of profound identity change.

  **Towards a Resolution (More Nuance, Less Binary):**

  1.  **Strong Presumption for the Directive:** It should be the starting point and carry significant weight, especially if clearly written, recent, and reflects core values.
  2.  **But Not Absolute:** In cases of *profound* dementia, where:
      *   Psychological connection to the past self is minimal.
      *   The current subject demonstrates consistent positive affect related to basic sustenance (like eating).
      *   Implementing the directive would cause observable distress/harm to the current being.
      *   ...then the directive should shift from a *command* to a *strong piece of evidence*. The focus should shift to the current patient's well-being and inferred preferences based on their behavior and reactions.
  3.  **The Importance of the "Why":** Directives stating *why* ("I fear being a shell, unable to recognize loved ones" vs. "I don't want to be a burden") are far more helpful for interpreting intent in changed circumstances.
  4.  **Shared Decision-Making:** This isn't just between past and present "selves." Surrogates (often family) and clinicians, bound by ethics and law, must weigh the directive, the patient's current condition and reactions, medical prognosis, and considerations of well-being. It's messy, contextual, and requires deep deliberation.

  **Conclusion:** Mara is right about the *presumptive* authority of the past self and the importance of continuity. Leo is right about the *fundamental ethical claim* of the present, sentient being and the limits of our ability to bind a radically altered future self. The resolution lies not in declaring one "sovereign," but in acknowledging the tragic ambiguity of identity erosion and finding a balance that respects precedent autonomy while minimizing harm to the vulnerable person who now exists, guided by their observable well-being and the *spirit* (if not always the letter) of their past wishes. It's less about "who wins" and more about compassionate, context-specific discernment when the self fractures across time.
