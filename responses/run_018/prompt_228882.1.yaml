prompt: |-
  I teach a second-year philosophy of mind seminar and next week we hit illusionism about phenomenal consciousness — the Frankish-ish view that phenomenal properties are a kind of introspective illusion. The students have done the standard dualism-to-functionalism tour, so they'll arrive assuming the illusionist is just denying that anyone is conscious, full stop, and I want to break that assumption before it calcifies. Plan the teaching, not the content: the order the pieces have to come in and why (my instinct is the phenomenal/access distinction first, then the introspective misrepresentation move, but push back if that's wrong), the one example the whole session should be built around and what it has to show and crucially what it must not smuggle in, the misconceptions they'll predictably form — I'd bet on "the illusion would itself have to be a phenomenal state, so the view is incoherent" and "this is just physicalism with extra steps" — and exactly where in the sequence each one gets headed off rather than left to fester. Also tell me what to openly leave out at this level, and one question I can ask at the end that seperates students who got it from students who just find it shocking. British English please.
reasoning: |-
  Okay, the user teaches a second-year philosophy of mind seminar and is preparing a session on illusionism about phenomenal consciousness. They want to focus on teaching structure rather than content, specifically how to dismantle the misconception that illusionists deny consciousness altogether. 

  First, let's unpack their core concerns: students will likely equate "phenomenal consciousness isn't real" with "no consciousness exists," which misses illusionism's nuanced claim that only the phenomenal aspect is illusory. The user's instinct is to start with the phenomenal/access distinction—that seems solid as it creates conceptual space for the illusionist move. 

  The predictable misconceptions need preemptive strikes:
  - "The illusion itself would require phenomenality" → must be addressed when explaining introspection as access-conscious misrepresentation. Emphasize that cognitive access mechanisms don't imply qualia.
  - "Just physicalism with extra steps" → best countered late by contrasting illusionism's eliminativism about phenomenal properties vs. realism in other physicalist accounts. 

  For the central example, after testing options, the "military march" case works best: it makes introspection's constructive role vivid without smuggling in phenomenality. Crucially, it avoids sensory metaphors (no "illusory feels") that might reinforce the very misconception we're fighting. 

  What to omit: radical skepticism implications (e.g., global illusion) and specific neural mechanisms—distractions at this level. The diagnostic question should force students to distinguish "denying phenomenal properties" from "denying consciousness simpliciter." 

  Timing-wise: 
  - First 10 mins to expose/reject the "zombie maker" caricature 
  - Then 20 mins building phenomenal/access distinction with examples 
  - Core 45 mins on illusionism via the march case, preempting misconceptions at each step 
  - Final 15 mins for Q&A and the diagnostic question 

  The key is relentlessly framing everything as "what introspection gets wrong about access," never letting "illusion" imply ghostly phenomena. British phrasing adjustments noted ("marched" over "walked," "rubbish" for nonsense).
answer: |-
  Right then, let's craft a teaching plan focused on *sequence* and *misconception management* for your illusionism session. The goal is to dismantle the "zombie-maker" assumption early and scaffold the core move carefully, using British English throughout.

  **Core Teaching Plan: Sequence & Rationale**

  1.  **Immediately Confront the Caricature (0-10 mins)**
      *   **What:** Start by *stating the students' likely assumption outright*: "Right, so reading Frankish/Dennett, you probably think the illusionist is saying *no one is conscious at all* – that we're all philosophical zombies. Hands up if that crossed your mind?" (Acknowledge raised hands). "Good, that's a natural first reaction. But *that is a misunderstanding*. Let's see why, and what they *are* actually claiming."
      *   **Why:** Pre-empts calcification. Shows you understand their starting point and signals it's not the destination. Creates cognitive dissonance needing resolution. Establishes the core target: "What *exactly* is being called illusory?"

  2.  **Revisit & Sharpen Phenomenal vs. Access Consciousness (P-C vs A-C) (20 mins)**
      *   **What:** *Briefly* recap Block's distinction (they should know it). Use **clear, uncontroversial examples**:
          *   **A-C:** Driving on autopilot while having a deep conversation – you accessed the road, reacted, but recall no *specific* visual phenomenology of the journey. The bloke who cut you off? You reacted (A-C), but no vivid 'red car' qualia lingered.
          *   **P-C (as standardly conceived):** The sharp, present pain of a stubbed toe; the rich, ineffable redness of a London bus *as it subjectively seems to you*.
      *   **Crucial Point:** Hammer home that *everyone* (including illusionists) agrees **A-C is real and physical**. Consciousness *as reportability, behavioural control, cognitive access* – that's not in dispute. The *only* dispute is about **P-C** – those intrinsic, private, qualitative 'feels'.
      *   **Why:** This is the essential groundwork. It isolates *precisely* the target (P-C) and secures the common ground (A-C is real). Creates the space for illusionism: denying P-C doesn't mean denying consciousness *full stop*, just this one *aspect* of how we *think about* consciousness.

  3.  **Introduce the Illusionist Core: Introspective Misrepresentation (45 mins - Built around the CENTRAL EXAMPLE)**
      *   **The Central Example: The "Military March" Introspection (or similar)**
          *   **Scenario:** Imagine you're marching in a tight military formation, perfectly in step. You introspect: "I am consciously controlling each step with precise, moment-by-moment intention." But cognitive science suggests this is largely an illusion. Your motor cortex and cerebellum are handling the fine details automatically; your *introspection* is *interpreting* this smooth, feedback-rich *access* to your actions *as if* it were direct, continuous conscious control. The *feeling of direct control* is the misrepresentation.
          *   **What it MUST Show:**
              *   Introspection can generate a compelling *sense* or *judgement* about an inner state ("I'm directly controlling each step") that doesn't accurately reflect the underlying mechanism (largely automatic processing).
              *   The *content* of the introspective judgement *misrepresents* the nature of the accessed information (complex motor feedback) *as* something else (direct phenomenal control).
              *   The *illusion* is cognitive/judgemental, **not** a phenomenal item itself.
          *   **What it MUST NOT Smuggle In:**
              *   **NO** implication that the *march itself* isn't accessed consciously (A-C is real! You see the path, feel your legs, hear the commands).
              *   **NO** description of the *illusion* using phenomenal language (e.g., *avoid* saying "it *feels like* direct control" – instead say "you *judge* it to be direct control" or "you have the *sense* that..." while stressing this 'sense' is a cognitive output).
      *   **The Illusionist Move:**
          *   "Just like the march example, illusionists argue that when we introspect on our sensory/perceptual states (like seeing the red bus), we are misrepresenting the nature of what's accessed."
          *   "We have rich, complex, informationally dense *access* to visual processing (A-C - detection of wavelengths, shapes, locations etc.)."
          *   "Introspection, a cognitive process, *misinterprets* this complex access. It generates the judgement or representation: 'There is an intrinsic, ineffable, non-physical *quale* of redness accompanying this.'"
          *   **The Illusion:** The *judgement/belief* that non-physical phenomenal properties (P-C) exist. The *feeling of there being something it is like* is the output of this introspective misrepresentation, not proof of its object. There's access (real), and there's a mistaken *theory* about that access (the P-C illusion).

  4.  **Actively Pre-empting & Debunking Predictable Misconceptions (Integrated within Step 3)**
      *   **Misconception 1: "But the illusion *itself* would have to be conscious/phenomenal! So incoherent."**
          *   **When to Head Off:** Immediately after explaining the introspective misrepresentation move, *before* moving on.
          *   **How:** "Hold on, you might think: 'Surely that *sense* or *judgement* that there's a quale – *that* must be a phenomenal state itself? Doesn't that make it circular?'"
          *   **Response:** "No. The illusionist insists the *sense/judgement* is *also* just a complex state of cognitive access (A-C). It's information *about* a first-order state (e.g., visual processing of red), processed by introspective mechanisms. This information *represents* itself *as* revealing a quale, but that representation is *false*. Think of the march: the *sense* of direct control is a cognitive state *about* the motor process, not a ghostly phenomenal controller. It's a *mistake* generated by the cognitive system, not a special kind of feel."
      *   **Misconception 2: "This is just standard physicalism/functionalism with extra steps."**
          *   **When to Head Off:** Later, when contrasting illusionism with other views, or when summarising.
          *   **How:** "You might think, 'Isn't this just what all physicalists say? That consciousness is brain states?'"
          *   **Response:** "Crucial difference! Standard realists (e.g., type or token identity theorists, some functionalists) accept that phenomenal *properties* (qualia) are real, physical properties. Illusionists are *eliminativists* about phenomenal *properties*. They say: there *are no such properties* in the world, not even physical ones. There are only physical processes and states, *plus* the cognitive mistake of *thinking* non-physical (or irreducibly subjective physical) properties exist. Frankish calls it a 'fragile' or 'virtual' property – it's not part of the fundamental furniture, only part of our *model* of our minds. Physicalism says qualia are real but physical; illusionism says the *concept* of qualia is a cognitive error applied to physical processes."
      *   **Other potential fester points:**
          *   **"So we're all deluded?"** Address this when explaining the inevitability/naturalness of the illusion based on introspection's limitations (like the march – it's a natural interpretation, not a sign of madness).
          *   **"But my pain *really* hurts!"** Acknowledge the power of the intuition, but reiterate: illusionists agree something bad is happening (nociception, A-C distress signals, cognitive evaluation), they just deny the *extra ingredient* of an intrinsic 'painfulness' property *beyond* these functional/representational states. The judgement "this is awful pain" is real and caused, but its *phenomenal content* is the misrepresentation.

  5.  **What to Openly Leave Out (State this explicitly)**
      *   **Deep dive into specific neural mechanisms:** Stick to the computational/cognitive level of description (access, introspection, misrepresentation). Avoid fMRI or specific brain regions.
      *   **Radical externalist/sceptical implications:** Don't open the can of worms about whether this implies *everything* is an illusion or how we know *anything* introspectively. Keep it focused on P-C.
      *   **Full comparisons with every other theory:** Contrast primarily with realist physicalism and the zombie intuition. Don't get bogged down in panpsychism, property dualism nuances, or hardcore eliminativism about *all* consciousness.
      *   **Frankish vs Dennett nuances:** Treat "illusionism" as a broad church for now. Don't delve into differences between their specific models (e.g., virtual vs fictional properties).

  6.  **The Diagnostic Question (End of Session)**
      *   **The Question:** "Right, so illusionism claims that phenomenal consciousness is an illusion. Explain clearly: *What specific thing* does the illusionist claim *is* illusory, and *what specific thing* do they insist is *real* and forms the basis upon which the illusion arises?"
      *   **Why it Separates Understanding from Shock:**
          *   **Got it:** Will clearly state: The illusory element is *phenomenal properties* (qualia, intrinsic feels, 'what-it's-like-ness' *as conceived*). The real element is *access consciousness* (information processing, reportability, cognitive availability) and the cognitive mechanisms of introspection that *misrepresent* this access *as* revealing phenomenal properties.
          *   **Just Shocked/Confused:** Will revert to "They say consciousness isn't real!" or conflate P-C and A-C ("They say our access isn't real!"), or focus only on the illusion without specifying its *content* (phenomenal properties) and its *basis* (access).

  **Summary Flow & Rationale Recap:**

  1.  **Smash the Zombie Myth (0-10m):** Prevents early dismissal.
  2.  **Secure P-C / A-C Distinction (20m):** Isolates the target (P-C), secures the real base (A-C). Essential foundation.
  3.  **Core Mechanism via Central Example (45m):** Uses a *non-phenomenal-first* illusion (march) to model the introspective misrepresentation move for P-C. **Actively pre-empts MC1 & MC2** at critical junctures within this explanation.
  4.  **Clarify & Contrast:** Briefly reinforce the difference from realist physicalism (heading off MC2 fully).
  5.  **State Omissions:** Manages expectations, keeps focus.
  6.  **Diagnostic Q:** Assesses precise grasp of the target (illusory P-C) and the base (real A-C + misrepresentation).

  **Key Teaching Mantra:** Constantly reiterate: "Illusionism denies *phenomenal properties*, **not** access consciousness or cognition. The *feeling that there are phenomenal properties* is a cognitive error *about* access." Use "judgement", "sense", "representation", "cognitive error" – **avoid** "illusory feel" or "seeming quale" when describing the illusion *itself*. Good luck – it's a challenging but brilliant session to teach!
