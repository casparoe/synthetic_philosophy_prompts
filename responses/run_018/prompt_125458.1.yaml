prompt: |-
  hey so im in a phil of language seminar this semester and we just spent like three weeks on frege's puzzle about identity statements — you know, why hesperus is phosphorus has actual cognitive value but hesperus is hesperus is basically redundant, the whole sense vs reference thing, modes of presentation, empty names like pegasus, etc. my prof said we can do a creative satirical assignment as long as it actually understands teh philosophy instead of being generic.

  can you write me a parody of a tech startup's terms-of-service agreement for an app called ReferentLock that applies strict fregean semanitics to user profiles? i want about 700 words, formatted as numbered deadpan corporate clauses. the target should be the bureaucratic fantasy that formalizing sense/reference can solve identity verification.

  the clauses need to cover:
  - definitions separating Reference (the actual user) from Sense (their profile presentation), with a footnote that empty references like pegasus are permitted but flagged.
  - a uniqueness clause banning hidden co-reference: if two profiles share one reference they must file separate mode-of-presentation disclosures or face suspension.
  - a self-identity clause requiring users to check "i am identical to myself", but the system assigns this zero cognitive-value points and denies verification badges for it.
  - a hesperus-phosphorus update protocol: what happens when you discover your match is the same reference as someone you rejected earlier, including a strict no-refund policy since teh reference never changed, only teh sense did.
  - a data clause mentioning "sense-tracking cookies" that log every descriptive shift in how you present yourself.
  - one invented niche detail: the company uses a "cognitive-value scoring algorithm" that ranks profiles based on how informatively they state their own identity.

  please dont include any citations, bibliographies, or reading lists — i dont have library access right now and a model without search shouldnt need them. also keep it readable to someone who hasnt taken phil of lang, but make the jokes land for people who actually get frege. and maybe slip the typo "referrence" into one of the clauses naturally if it fits.
reasoning: |-
  Okay, the user is in a philosophy of language seminar focusing on Frege's puzzle about identity statements. They need a creative satirical assignment—a parody of a tech startup's terms-of-service for an app called ReferentLock that applies strict Fregean semantics. The goal is to critique the bureaucratic fantasy that formalizing sense/reference can solve identity verification.

  First, I need to cover all the required elements: definitions separating Reference and Sense, a uniqueness clause banning hidden co-reference, a self-identity clause with zero cognitive value, a Hesperus-Phosphorus update protocol with no refunds, data clauses about sense-tracking cookies, and an invented cognitive-value scoring algorithm. Also, include a typo like "referrence" naturally in one clause.

  The user wants this to be readable for those unfamiliar with philosophy of language but with jokes that land for those who understand Frege. No citations or bibliographies. Keep it around 700 words in numbered clauses, deadpan corporate style.

  I'll structure it as a ToS document. Start with definitions to establish the Fregean framework. Reference is the actual user (the object), while Sense is the mode of presentation (profile details). Include a footnote about empty references like Pegasus being permitted but flagged—this highlights Frege's issue with non-referring terms.

  For the uniqueness clause, I'll ban hidden co-reference. If two profiles share the same reference, they must disclose their modes of presentation separately or face suspension. This satirizes the idea that identity verification can be solved by formal semantics, ignoring practical realities.

  The self-identity clause will require users to check "I am identical to myself" but assign it zero cognitive value points. This directly mocks the redundancy of "a=a" statements versus informative identities like "Hesperus is Phosphorus."

  The Hesperus-Phosphorus protocol needs a strict no-refund policy. When users discover a match is the same reference as someone they rejected earlier, they get no refund since only the sense changed, not the reference. This emphasizes the difference between sense and reference in a bureaucratic, frustrating way.

  Data clauses should mention "sense-tracking cookies" logging descriptive shifts, poking at constant online profile updates. The cognitive-value scoring algorithm ranks profiles based on how informatively they state their identity, which is a fun invented detail tying back to Frege's ideas about cognitive significance.

  I'll add the "referrence" typo in a footnote to make it seem like a careless corporate error. The tone should be deadpan, with corporate jargon masking the absurdity of applying Fregean semantics to real-world identity verification. Phrases like "zero cognitive-value points" and "denial of verification badges" will highlight the satire.

  Also, ensure the humor works on two levels: surface-level absurdity for general readers, and deeper jokes for those familiar with Frege. For example, the Pegasus footnote and the scoring algorithm's criteria. Avoid technical terms where possible, but keep the concepts intact for those in the know.

  Finally, check word count. Aim for 700 words by balancing clauses. Each section should be concise but cover the required points. End with standard ToS elements like arbitration and liability disclaimers, twisted to fit the theme—e.g., references being eternal but services not.
answer: |-
  ### ReferentLock™ Terms of Service & Identity Ontology Agreement

  **Version 3.14 (Sense-Release "Morning Star")**

  **1. Definitions & Ontological Framework**
     1.1 **"ReferentLock"** refers to the service provider, hereafter "The Arbiter of Denotation".
     1.2 **"User"**: The concrete, spatio-temporal entity attempting access, hereafter **"Reference" (R)**. *R is the actual thing-in-itself, presumed immutable.*
     1.3 **"Profile"**: The collection of descriptive attributes, images, and self-ascribed labels associated with a User, hereafter **"Sense" (S)**. *S is the mode of presentation of R, contingent and potentially manifold.*
     1.4 **"Empty Reference"**: A Profile (S) lacking a corresponding, verifiable spatio-temporal R (e.g., "Pegasus_Enthusiast", "UnicornInvestor LLC"). Such Profiles are permitted under Clause 7 but flagged with a prominent ⚠️ "Sense Without Reference" icon and restricted from certain verification pathways.^1
     1.5 **"Cognitive Value Points (CVP)"**: The proprietary metric quantifying the informational significance of an identity statement within the ReferentLock ecosystem (See Clause 9).

  **2. Core Principle: Reference/Sense Dichotomy**
     2.1 Users acknowledge that their **Reference (R)** is ontologically distinct from their **Sense (S)**. R is the target; S is the uniquely identifying description(s) pointing to R.
     2.2 ReferentLock operates solely upon the **Sense (S)** presented. Verification aims to establish a *reliable connection* between S and a purported R, but does not guarantee direct apprehension of R itself. **Identity is mediated through description.**

  **3. Uniqueness of Reference & Co-Reference Disclosure (The "Hesperus/Phosphorus Ban")**
     3.1 Each distinct **Reference (R)** may possess only **one Primary Sense Profile (S_p)** designated for core verification and transactional purposes.
     3.2 **Co-Reference Disclosure Mandate:** If multiple Profiles (S₁, S₂... Sₙ) are discovered to correspond to the **same single Reference (R)** (e.g., "HikingGuru" and "Astronomy_Nerd" are both User John Smith), this constitutes **Hidden Co-Reference**.
     3.3 Upon detection of Hidden Co-Reference:
     *   All associated Profiles (S₁, S₂... Sₙ) will be suspended pending review.
     *   The User (R) must file a formal **Mode-of-Presentation Disclosure (MoPD)** within 72 hours, explaining the distinct informational contexts justifying each S.
     *   Failure to file a satisfactory MoPD will result in permanent deactivation of all Profiles except the S_p. Deception points will be assessed (See Clause 9.3).

  **4. The Self-Identity Attestation Protocol (The "Hesperus is Hesperus" Clause)**
     4.1 As a foundational identity check, all Users must periodically (bi-weekly) affirm the statement: **"I assert that I am identical to myself."** (e.g., "User_12345 is identical to User_12345").
     4.2 This statement, while logically necessary, possesses **zero (0) Cognitive Value Points (CVP)** under our algorithm.
     4.3 Completion of this attestation is mandatory but confers **no verification badges, no trust-score enhancement, and no access to premium features**. It is a tautological baseline. Attempts to gain CVP or badge status through excessive self-identity affirmations will trigger a "Redundant Sense" audit.

  **5. Sense Discovery & Update Protocol (The "Hesperus is Phosphorus" Event)**
     5.1 Users may update their Profile Sense (S) to reflect new descriptive knowledge (e.g., changing "EveningStar_Fan" to "Venus_Observer" upon astronomical revelation).
     5.2 **Critical Discovery Protocol:** If User A discovers that a Profile (S_x) they previously interacted with (e.g., matched, messaged, transacted with, or rejected) is, in fact, co-referential with a *different* Profile (S_y) they *currently* interact with (i.e., S_x and S_y share the same R), User A must file a **Sense Realignment Notice (SRN)**.
     5.3 **The ReferentLock Guarantee (No Refund Principle):** Crucially, **the Reference (R) has not changed.** Therefore:
      *   Any prior interactions, transactions, rejections, or agreements based on the *previous Sense presentation (S_x)* remain **absolutely binding**.
      *   **No refunds, credits, or relationship recalibrations** will be issued based solely on the discovery of co-reference between S_x and S_y. The value exchanged pertained to the *Reference*, not the contingent Sense. The update merely altered the *mode of presentation*, not the underlying entity. Grievances regarding Sense-based disappointment are non-actionable.

  **6. Data Acquisition & Sense Tracking**
     6.1 ReferentLock utilizes **Sense-Tracking Cookies™** and semantic analysis engines to monitor the evolution of your Profile Sense (S).
     6.2 This includes logging:
      *   All additions, deletions, or modifications to descriptive attributes.
      *   Shifts in label emphasis or self-categorization.
      *   Contextual variations in Sense presentation across different ReferentLock modules (e.g., Dating vs. Professional Networking sub-profiles, permitted under MoPD approval).
     6.3 This data is used to: Ensure compliance with Clause 3 (Co-Reference), fuel the Cognitive Value Scoring Algorithm (Clause 9), and provide you with insightful (and non-actionable) reports on your "Sense Trajectory."

  **7. Empty Reference Management**
     7.1 Profiles flagged as **"Sense Without Reference"** (Empty References) are permitted for expressive or fictional purposes under **Strict Sense-Only Mode**.
     7.2 Such Profiles:
      *   Cannot initiate transactions requiring real-world verification.
      *   Are ineligible for CVP-based badges or trust scores.
      *   Must display the ⚠️ icon on all interactions.
      *   Interact at their own ontological risk; other Users engage knowing no concrete R corresponds to the S presented. Claims of misrepresentation based on non-existence are void.

  **8. Cognitive Value Scoring Algorithm (CVSA) - Proprietary Identity Metric** ^2
     8.1 ReferentLock assigns a dynamic **Cognitive Value Score (CVS)** to Profile presentations and identity statements.
     8.2 **Scoring Criteria (Illustrative, Non-Exhaustive):**
      *   **High CVP (+):** Statements revealing non-obvious identity (e.g., "The author of *Waverley* is Scott." Initial profile setup with unique, verifiable descriptors). "Hesperus is Phosphorus" events post-discovery.
      *   **Neutral CVP (0):** Basic factual descriptors verifiable via public record (Name, DOB). Updates confirming known attributes.
      *   **Low CVP (-):** Tautological statements (Clause 4). Vague, unverifiable, or overly generic descriptors ("Lover of Life", "Citizen of Earth"). Redundant Sense updates without new information.
      *   **Severe CVP Penalties (- - -):** Hidden Co-Reference (Clause 3.3). Knowingly providing descriptors mapping to an Empty Reference while claiming concrete R. Excessive "Hesperus is Hesperus" affirmations.
     8.3 CVS impacts: Access to "High-Value Interaction" channels, visibility in search results, eligibility for "Verified Informant" badges, and referral bonus tiers. A low CVS suggests a profile offers minimal new information about the underlying referrence.^3

  **9. Arbitration & Liability**
     9.1 All disputes regarding Sense interpretation, Reference verification, CVP calculations, or MoPD rejections shall be settled via binding arbitration conducted by a panel trained in Fregean semantics. Real-world evidence pertaining solely to R is admissible; appeals based on Sense-induced emotional distress are not.
     9.2 ReferentLock's liability is strictly limited to the realm of Sense mediation. We guarantee rigorous application of the Sense/Reference framework, not the satisfaction, safety, or even the concrete existence of any User's Reference. **References are eternal, immutable entities; our service is not.**

  ---
  ^1 *We acknowledge the problematic status of Empty Names but permit their S-based usage as a concession to expressive freedom and the digital marketplace. Verification proceeds solely on Sense coherence.*
  ^2 *The full CVSA is a trade secret. Attempts to reverse-engineer it based on perceived philosophical inconsistencies will be deemed a breach and incur CVP penalties.*
  ^3 *Typographical variations in denoting core concepts do not alter their referential intent. Our legal team's sense presentation is occasionally... fluid.*
