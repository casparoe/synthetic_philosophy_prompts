  User's expertise means we can trust them to recognize the ethical layers without jargon. The "circle of life" prohibition warns against facile resolutions - good, this poem shouldn't offer comfort. 

  *checks villanelle structure* Nineteen lines, refrains at 1/3/5/7/9/11/13/15/17 and 6/12/18, with A/B rhyme scheme. Tricky to make natural while carrying philosophical weight. 

