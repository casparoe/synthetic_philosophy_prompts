prompt: |-
  I'm part of a graduate reading group on the foundations of quantum mechanics, and last week we were working through the measurement problem in the context of Everett's relative-state formulation versus the Copenhagen insistence on classical apparatuses. The discussion turned to whether branching worlds actually resolve the problem or merely redistribute the ambiguity across a multiverse structure, and whether Bohmian mechanics avoids both pitfalls only by paying a different ontological price in explicit particle trajectories. At that point, one participant cut in with the familiar slogan "shut up and calculate," using it to suggest that worrying about ontology—whether worlds split, particles have positions, or wave functions collapse—is a category mistake that confuses predictive success with metaphysical commitment. I want to bring a precise disambiguation back to the group rather than another round of intuition-trading.

  Could you lay out the distinct precise claims that "shut up and calculate" might be expressing, arranged as a menu from the trivial to the radical? For each reading, indicate whether it is a platitude about scientific practice, a substantive methodological principle, or an outright false claim about the limits of interpretation. In particular, distinguish versions that are purely epistemic (about what physicists should personally believe), versions that are semantic (about what quantum formalism means), versions that are pragmatic (about resource allocation in research programs), and versions that carry hidden metaphysical commitments of their own—such as the idea that calculational rules are interpretation-neutral in a way that Bohmian trajectories or Everettian branches are not. Then tell me which of these readings actually supports dismissing an ontological debate about branching versus collapse, and which ones would, if applied consistently, undermine the very predictive framework being defended.

  Finally, since our group is specifically comparing how decoherence-based accounts, Bohmian mechanics, and Everettian mechanics each relate calculational output to ontological story, I want to know whether the slogan applies asymmetrically across these three. Does "shut up and calculate" function as a stable neutral stance, or does it tacitly favor one interpretation—say, by treating the wave function as purely instrumental in a way that sits comfortably with Copenhagen but becomes strained under Bohm's explicit particle ontology or Everett's explicit world ontology? I am not asking for a bibliography or reading list; I want the conceptual map I can use to press back in the seminar and ask which version of the slogan my interlocutor actually meant.
reasoning: |-
  Okay, let me approach this systematically. The user is part of a graduate reading group on quantum foundations, specifically debating Everett vs Copenhagen vs Bohmian mechanics. They encountered the "shut up and calculate" (SUAC) slogan used to dismiss ontological discussions, and want to disambiguate its precise meanings to bring clarity to future discussions. 

  First, I need to map the possible interpretations of SUAC along a spectrum from trivial to radical. The user wants them categorized as platitude/methodological/false claim, and also by epistemic/semantic/pragmatic/metaphysical dimensions. The deeper request seems to be for analytical tools to expose whether SUAC is truly neutral or secretly partisan.

  Hmm, the user's phrasing suggests frustration with intuition-trading. They're seeking precision - probably tired of people using SUAC as a conversation-stopper without examining its premises. The mention of "conceptual map" indicates they want taxonomy they can wield in debate. 

  Let me structure the SUAC readings hierarchically. Starting with the weakest (trivial) version: even ontological interpretations agree that calculation comes first. That's uncontroversial. Then moving to stronger claims - like the assertion that interpretations are empirically equivalent (which faces challenges from quantum gravity or non-locality tests). The radical end would be instrumentalism denying any referent for the wave function.

  For each, I'll flag the implicit commitments. For example, claiming that interpretations are "just philosophy" smuggles in verificationism. And the semantic claim that QM formalism has no ontological content is self-undermining - if math is just syntax, why trust its predictions?

  On the asymmetry question: SUAC isn't neutral. Its dismissal of ontology implicitly favors interpretations where the wave function is computational tool (Copenhagen) over those where it's physically real (Everett) or supplemented by particles (Bohm). Decoherence makes this tension worse by explaining apparent collapse without resolving the ontology.

  The user's real need might be to expose that SUAC advocates often inconsistently apply their own principle - they happily interpret classical mechanics ontologically while insisting quantum mechanics is "just math". That hypocrisy deserves pointing out in seminar.
answer: |-
  Here's a disambiguation of "Shut Up and Calculate" (SUAC) into distinct claims, categorized by strength, domain, and implications for ontological debates. Each claim is assessed for its validity and relationship to interpretations like Everett, Bohm, and Copenhagen.

  ---

  ### **The "Shut Up and Calculate" Menu: From Trivial to Radical**

  1. **Trivial Epistemic Claim**  
     *"Physicists should prioritize calculation over ontological speculation in practical research."*  
     - **Type:** Platitude about scientific practice.  
     - **Domain:** Epistemic/Pragmatic.  
     - **Assessment:** Uncontroversial. All interpretations agree that calculational rules (e.g., Born rule) are essential for predictions.  
     - **Relevance to Ontology:** Does **not** dismiss ontology; merely prioritizes pragmatics. Compatible with all interpretations.  

  2. **Methodological Principle**  
     *"Interpretations are empirically equivalent; debating them wastes resources better spent on calculational progress."*  
     - **Type:** Substantive methodological principle.  
     - **Domain:** Pragmatic/Epistemic.  
     - **Assessment:** Contested. While interpretations agree on *predictions*, they disagree on:  
       - **Non-empirical criteria** (parsimony, locality, determinism).  
       - **Future physics** (quantum gravity, cosmology).  
     - **Relevance to Ontology:** **Dismisses ontological debate** as unproductive, but *not* as meaningless. Favors interpretations with minimal ontology (e.g., Copenhagen) but technically compatible with all.  

  3. **Semantic Instrumentalism**  
     *"Quantum formalism has no ontological content; it is solely a tool for prediction."*  
     - **Type:** Substantive semantic claim.  
     - **Domain:** Semantic.  
     - **Assessment:** Self-undermining. If the formalism is "just math," why trust its predictions? Implicitly denies that physical theories refer to reality.  
     - **Relevance to Ontology:** **Actively dismisses ontology** by claiming it’s irrelevant to the theory’s meaning. Favors Copenhagen (wave function as "information") but **strains Bohm/Everett**, which treat the wave function as physically real.  

  4. **Radical Anti-Realism**  
     *"Ontology is always a category mistake; science only provides predictive algorithms."*  
     - **Type:** Radical metaphysical claim.  
     - **Domain:** Metaphysical/Semantic.  
     - **Assessment:** Inconsistent. If calculational rules are "all there is," this itself is an ontological stance (e.g., *positivism*). Undermines itself by rejecting *all* interpretation while being one.  
     - **Relevance to Ontology:** **Rejects ontological debate entirely**. Tacitly endorses a hidden metaphysics where "prediction" is the only reality. Incompatible with Bohm/Everett’s realist commitments.  

  5. **Formalism-Fetishism**  
     *"The quantum formalism is interpretation-neutral; adding Bohmian trajectories or Everettian branches is superfluous."*  
     - **Type:** False claim about formalism.  
     - **Domain:** Semantic.  
     - **Assessment:** **Demonstrably false**. The formalism *requires* interpretation to resolve:  
       - What happens during "measurement"?  
       - What is the status of superposition?  
       - Decoherence explains *apparent* collapse but leaves ontology open (e.g., "many worlds" vs. "one world").  
     - **Relevance to Ontology:** **Illusorily dismisses debate** by ignoring the formalism’s ambiguities. Favors Copenhagen but collapses under scrutiny.  

  ---

  ### **Does SUAC Support Dismissing Ontology?**
  - **Yes, but inconsistently:**  
    - Semantic Instrumentalism (#3) and Radical Anti-Realism (#4) explicitly reject ontology.  
    - However, they carry hidden metaphysical commitments (e.g., "only predictions matter") that contradict their own neutrality.  
  - **No, for coherent stances:**  
    - Trivial (#1) and Methodological (#2) claims avoid ontology for pragmatism but *allow* it. Only radical versions dismiss it entirely—and they undermine themselves.  

  ---

  ### **Asymmetry Across Interpretations: Is SUAC Neutral?**
  | **Interpretation** | **Compatibility with SUAC** | **Key Tension** |  
  |-------------------|----------------------------|----------------|  
  | **Copenhagen**    | High                       | SUAC’s instrumentalism matches Copenhagen’s "wave function as calculator." Ignores the *classical apparatus* problem SUAC avoids. |  
  | **Everett**       | Low                        | Treats the wave function as physically real. SUAC’s dismissal of "worlds" rejects Everett’s ontology while relying on its formalism. |  
  | **Bohmian**       | Lowest                     | Explicit particles + guiding wave. SUAC’s anti-realism about trajectories contradicts Bohm’s core ontology. |  
  | **Decoherence**   | Ambiguous                  | Explains *how* branching occurs but *not what branches are*. SUAC uses decoherence computationally but rejects its ontological implications. |  

  - **Why SUAC Isn’t Neutral:**  
    - It tacitly assumes the wave function is *purely computational* (favoring Copenhagen/instrumentalism).  
    - Bohm and Everett treat the wave function as *physical* (a field or structure of reality). SUAC’s semantic claims (#3–5) thus conflict with their realist ontologies.  
    - **SUAC functions as crypto-Copenhagen:** It inherits Copenhagen’s operationalism while dodging its unresolved paradoxes (e.g., "What is classical?").  

  ---

  ### **Conclusion: How to Press Your Interlocutor**
  1. **Ask which SUAC version they endorse:**  
     - If pragmatic (#1–2), note that it doesn’t invalidate ontology—it just postpones it.  
     - If semantic/metaphysical (#3–5), challenge:  
       *"If quantum formalism is 'just math,' why does it describe nature? What grounds its predictive success?"*  
       *"Does your stance apply equally to classical mechanics, or is ontology only forbidden in quantum theory?"*  

  2. **Expose the asymmetry:**  
     - *"SUAC treats the wave function as a tool, not a thing. But Bohm/Everett claim it’s part of reality. Isn’t your dismissal presupposing Copenhagen?"*  

  3. **Highlight self-sabotage:**  
     - *"If we ‘shut up’ about ontology, how do we explain why decoherence predicts branching? What is ‘branching’ if not an ontological process?"*  

  SUAC’s coherence depends on accepting instrumentalism—a metaphysically loaded stance that Bohm and Everett explicitly reject. It is not a neutral baseline but a contentious philosophical position masquerading as pragmatism.
