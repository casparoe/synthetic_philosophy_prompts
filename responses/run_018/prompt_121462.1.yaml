answer: |-
  Here's a session plan designed for your constraints and objectives. It leverages your fertility clinic case, targets misconceptions proactively, and builds toward the "plaintiff check" skill. Timings are tight but achievable if discussion is focused.

  **Session Goal:** Enable students to identify when a policy argument depends on fixing the identity of future individuals across counterfactuals and assess its vulnerability to the non-identity challenge.

  **Materials:** Whiteboard/flipchart; Slide with fertility clinic case (both versions); Slide with "Plaintiff Check" questions; Access to students' draft policy brief paragraphs (pre-assigned or on hand).

  **Total Time:** 75 minutes

  ---

  ### Session Plan

  **I. Framing & Baseline Harm Intuition (10 mins)**
  *   **(2 min) Hook:** "We often assess policies by asking 'Who is harmed?' or 'Who is better off?'. Today we'll find a common type of policy argument where that question has no straightforward answer, and see what happens to those arguments."
  *   **(3 min) Standard Harm Case (Version A):** Present the fertility clinic story *without* the identity twist: "Clinic switches to cheaper medium. Medium causes mild endocrine disorder. *Crucially: The same embryo would have been transferred and born healthy with the old medium.* Clinic knows this, chooses purely on cost." Q: "Is this wrong? Why? **Who is harmed, and how?**" (Elicit: Child is harmed, made worse off than *they* would have been).
  *   **(5 min) Deconstruct Harm:** On board: **Harm Condition:** Individual A is harmed by act X iff A is worse off than *A* would have been if X hadn't occurred. Emphasize the *same individual* across counterfactuals. Link to policy briefs: "Many arguments rely implicitly on this structure: Policy P harms identifiable future person Y by giving them a worse outcome than *they* would have had."

  **II. Introducing the Puzzle: The Identity Twist (15 mins)**
  *   **(5 min) The Twist (Version B):** Present the *full* case: "Clinic switches to cheaper medium. Medium causes mild endocrine disorder. *Crucially: Due to subtle effects on development, a different embryo develops to transfer stage/is selected. The child born with the disorder using CheapMedium is a different child from who would have been born using GoodMedium.* Clinic knows this, chooses purely on cost. Same number of children born. Each child's life is well worth living."
  *   **(5 min) Initial Reactions:** Q: "Is this wrong? Why?" (Expect mix; note feelings of unease). Q: "**Who is harmed?** Specifically: Who is worse off than *they themselves* would have been if the clinic used GoodMedium?"
  *   **(5 min) The Puzzle Emerges:** Guide discussion: Child born w/ CheapMedium? (Exists only because of CheapMedium; life worth living). Child who *would* have been born w/ GoodMedium? (Never exists; can't be "worse off"). Parents? (Get *a* healthy child either way; might be unaware). Clinic? (Saves money). *State the challenge:* "If no one is made *worse off* relative to their own existence, how can this act be wrong? Yet it intuitively seems problematic."

  **III. Dissecting the Puzzle & Blocking Escapes (20 mins)**
  *   **(5 min) Dependency Structure - Why Order Matters:** **DO NOT assume the "life worth living" point is internalized yet.** State it explicitly: "The child *is* born with a manageable disorder, but crucially, their life is *still overall good* – worth living. If their life were *not* worth living, this would be a different problem (wrongful life). **Key Point:** The puzzle *requires* that the affected life is worth living. If we skipped this, students might wrongly 'solve' it by saying the child is worse off *simpliciter*." Board: **Puzzle Ingredients:** 1. Act changes *who* exists. 2. Affected individual has a life worth living. 3. No one is worse off *than they would have been*.
  *   **(10 min) Pre-empting Key Misconceptions:** Actively address these *now*:
      *   *"It's metaphysics / personal identity over time"*: "This isn't about whether *an existing person* changes over time (ship of Theseus). It's about the simple fact that different choices lead to the conception/birth of *numerically different people*. Like choosing different embryos to implant." (Anchor in their counterfactual comfort).
      *   *"Same gametes = same person"*: "No. The specific combination and developmental path matters. Different sperm fertilizes the egg, or the same zygote develops differently due to the medium, leading to a different individual."
      *   *"Compare this child to the better life they could have had"*: "But which 'they'? There is no single 'they' who exists in both scenarios. The child with the disorder *only* exists in the CheapMedium scenario. There's no subject for that comparison." (This is the core; let them grapple briefly, then clarify).
      *   *"Parents are wronged"*: **Leave this open briefly.** "Maybe? But *how*? They get *a* child they love either way. Does this capture the *full* intuitive wrongness focused on the *child*?" (We'll use this later).
  *   **(5 min) Why "No Harm" ≠ "Anything Goes" / "No Duties":** Pre-empt this critical misunderstanding: "The puzzle shows that *this specific harm-based argument* doesn't work here. It does **NOT** mean the act is permissible! Nor does it mean we have no duties to future generations. We might have duties based on other reasons – quality of life, fairness, impersonal values. We'll explore that soon." Board: **"No identifiable individual harmed" ≠ "No wrong done"**.

  **IV. Implications & Tools for Policy Analysis (20 mins)**
  *   **(5 min) Introducing Terminology (Identity-Entangled):** "We need a label for this phenomenon: When an action affects which future individuals exist *and* the affected individuals cannot be held fixed in the 'worse off' comparison. Let's call this an **Identity-Entangled** effect. The opposite is **Identity-Neutral** (like our first clinic version)." **Use labels AFTER the puzzle is felt.** Explain: "It's 'entangled' because the identity of the affected person is tied up with the choice being evaluated. The label highlights the *unavailability of the comparison*, not just causation."
  *   **(10 min) Sketching Solution Space (Briefly & Purposefully):** "How *might* we still argue the clinic acted wrongly? Not to solve it definitively, but to see options for policy arguments." Quickly present:
      *   *Impersonal Harm:* "Is the *world* worse for having this child with the disorder rather than a different, healthier child? (Total/average welfare)."
      *   *Non-Comparative Harm:* "Is having the disorder itself a harm, regardless of whether the person could have existed without it? (Threshold view)."
      *   *Wronging vs. Harming:* "Even if not *harmed*, was the child *wronged*? (E.g., rights to an 'open future')."
      *   *Parental Harm/Wronging Revisited:* "Were the parents denied the *specific* healthy child they might have had? Were their procreative interests disrespected?"
      *   *Proving Too Much:* "If this isn't wrong, what about a malicious clinic director who *deliberately* chooses a medium causing disability, knowing it changes who's born?" (Use to show intuitive pull remains). **Emphasis:** "Each has strengths and weaknesses. The point isn't to pick one now, but to see that arguments *can* be made, but they shift away from simple 'harm to this future individual'."
  *   **(5 min) Connecting to Policy Briefs:** "Back to your preconception health briefs. Arguments like 'This policy prevents harm to future children' need scrutiny. *When* does that argument work? *When* does it run into this identity-entanglement?"

  **V. Application & Check for Understanding: The Plaintiff Check (10 mins)**
  *   **(5 min) Introducing the Plaintiff Check:** Display questions: 1. **Name the specific future individual(s) who would be worse off if this policy/project is NOT adopted (or better off if it IS adopted).** 2. **What would have happened to *that exact same individual* if the policy/project had been different?** Explain: "This is your litmus test. If you can't name a plaintiff satisfying both, your argument might be identity-entangled. It doesn't *kill* the argument, but it forces you to recognize its structure and seek other justifications."
  *   **(5 min) Practice:** Have students take *one specific paragraph* from their draft brief (ideally one making a future-harm/benefit claim). Pair & share: Try the Plaintiff Check on their own argument. Circulate & listen. **Anticipated Pitfalls:** Students naming vague groups ("future children", "generation Z"); asserting comparability without justification ("the child would be healthier"); shifting to parents/society without acknowledging the entanglement for the child.

  **VI. Wrap-up & Managing the "No Solution" Feeling (5 mins)**
  *   **(3 min) Recap & Value:** "Today's takeaway: The non-identity problem isn't a solution, it's a diagnostic tool. It reveals a hidden assumption in many 'harm to future people' arguments – the assumption that we can hold individuals fixed across choices. When that fails (identity-entangled effects), those arguments crumble. Recognizing this lets you strengthen your policy briefs by either: a) grounding harm claims where identity *is* neutral, or b) using more robust justifications where it's entangled."
  *   **(2 min) Explicit Omissions & Honesty:** "We've skipped deep philosophy today: debates about whether origins are essential, the metaphysics of possible people, or the full asymmetry in population ethics. Why? Because our goal was pragmatic: spotting this structure in policy arguments and adjusting accordingly. It doesn't dissolve the puzzle, but it gives you the tool you need for your briefs. The puzzle remains philosophically tricky – that's why it's a 'problem'! But now you know how it bites in policy."

  ---

  **Vetting Your Case & Addressing Your Specifics:**

  1.  **One Case with a Switch is Superior:** Absolutely. Using the *same* narrative with one changed premise (medium affects identity/doesn't) is powerful. It isolates the identity factor perfectly. It forces focus on *why* the intuition changes. Two separate cases invite explanations based on differing details. **Keep the switch.**
  2.  **Closing the Parental Harm Escape Hatch:** **Leave it open initially**, then **use it strategically** in the solution space discussion (Part IV). Why?
      *   Letting it surface shows a natural attempt to resolve the unease.
      *   Showing its limitations ("Does it capture the *full* wrong focused on the child?") reinforces the core puzzle.
      *   It *is* a potential solution path (wronging parents/procreative interests), so acknowledging it there is honest and shows the shift in argumentation needed.
  3.  **Plaintiff Check is the Right Test:** Excellent for the applied goal. **Pitfalls to watch for:**
      *   **Vague Plaintiffs:** "Future children," "society," "generations." Push for specificity: *Which* children?
      *   **Unjustified Comparability:** Asserting "the child would be healthier" without addressing *which* child.
      *   **Shifting Subjects:** Quickly pivoting to "the parents are harmed" *without* first acknowledging the failure of the child-centered harm claim. Ask: "But is your original argument *about* harming the parents or the child?"
      *   **Conflating Harm Types:** "They are harmed by having the disorder!" (True, but is it *caused* by the policy in a way that makes them worse off than *they* would have been? That's the check).
  4.  **Terminology ("Identity-Entangled"):** Your definition is sound. **Introduce it *after* the puzzle is felt** (Part IV). **Does it mislead?** The risk is focusing too much on *causal dependence* ("the act caused this specific person to exist") rather than the *logical consequence for comparison* ("therefore, we cannot compare *this person's* state to their state in the alternative world"). Mitigate by explicitly stating: "The label means the effect is entangled with *who exists*, making the standard 'worse off' comparison unavailable."
  5.  **Omissions are Safe & Honest:** Declaring you're skipping origins essentialism, modal metaphysics, the asymmetry, and a full solution taxonomy is **perfectly appropriate** for this audience and goal. Your stated reason ("pragmatic tool for policy") is honest. None are *unsafe* to omit at this level because:
      *   The core logical puzzle stands without origins essentialism (it relies on numerical distinctness, not essential properties).
      *   Modal metaphysics distracts from the counterfactual reasoning they *already* use.
      *   The asymmetry (why creating a miserable person is wrong, but not creating a happy person isn't obligatory) is a related but distinct issue.
      *   A taxonomy isn't needed for the diagnostic skill. Stating the omissions builds trust and manages expectations.
