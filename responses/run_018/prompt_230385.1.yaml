answer: |-
  Below is a quiz designed to help participants identify their implicit decision theory through concrete scenarios. Each question presents a short situation with answer options. The scoring key maps answer patterns to evidential, causal, or updateless decision theory, with notes on why certain answers lean toward each theory. The quiz avoids jargon (e.g., no "EDT," "CDT," "UDT," or "Newcomb's problem") and emphasizes choices in cases where updating on evidence vs. precommitting to a policy is critical.

  ---

  ### **Week 1: Which Decision Theory Do You Actually Hold?**  
  *Answer based on your intuitive choice in each scenario.*

  1. **Genetic Test Dilemma**  
     You’re offered a drug that gives mild pleasure (+10 utility). Tomorrow, you’ll learn if you have a rare genetic mutation (1% chance). If you have it, the drug causes a severe illness (–1,000 utility); otherwise, it’s harmless. The drug is only available *today*. What do you do?  
     - **A) Take the drug now.**  
     - **B) Skip the drug and wait.**  
     *Note: A leans causal/updateless (only direct consequences matter). B leans evidential (taking it is "bad news" about the mutation).*  

  2. **Desert Rescue**  
     You’re stranded in a desert. A driver offers a ride to town if you *sincerely* promise to pay $100 upon arrival. They can read your mind to verify sincerity. If you promise insincerely or refuse, they leave you to die. What do you do?  
     - **A) Sincerely promise to pay, then pay in town.**  
     - **B) Refuse or promise insincerely (and die).**  
     *Note: A leans updateless (commit to the policy to get rescued). B leans causal/evidential (won’t pay later, so can’t sincerely promise).*  

  3. **Coin-Flip Debt**  
     A trusted predictor flips a coin. If it lands heads, you win $10,000. If tails, you’re asked to repay $100. The predictor paid you only if it forecasted you’d repay on tails. The coin landed tails, and you’re asked to repay. What do you do?  
     - **A) Repay the $100.**  
     - **B) Refuse to repay.**  
     *Note: A leans updateless (your policy ensures the $10,000 win in other worlds). B leans causal/evidential (repaying loses $100 with no benefit).*  

  4. **Predictor’s Transparent Boxes**  
     A predictor filled two boxes yesterday based on a forecast of your choice. Box A is transparent with $1,000. Box B is opaque but *you can see it contains $1,000,000*. The predictor put $1M in B only if it forecasted you’d take only B. If it forecasted you’d take both, B is empty. You see $1M in B. What do you do?  
     - **A) Take only Box B ($1,000,000).**  
     - **B) Take both boxes ($1,001,000).**  
     *Note: A leans updateless (you "should be" a one-boxer to get $1M in all worlds). B leans causal/evidential (you see the money, so take it).*  

  5. **Job Interview Experiment**  
     You’re invited to a job interview. A psychologist claims they can predict your preparation. If they predict you’ll prepare, you’ll get the job (worth +100 utility) automatically, skipping the interview. If they predict you’ll slack, you must interview (preparing costs -20 utility; slacking costs 0). You learn the prediction *after* deciding preparation. What do you do?  
     - **A) Prepare (cost -20).**  
     - **B) Slack (cost 0).**  
     *Note: A leans causal/updateless (causes readiness for the interview). B leans evidential (slacking is "good news" the predictor expects success).*  

  6. **Rare Disease Insurance**  
     You’ll be tested for a rare disease (1% chance). If positive, treatment costs $10,000. Insurance costs $200 now, covering treatment if needed. If uninsured, you pay out-of-pocket. What do you do?  
     - **A) Buy insurance.**  
     - **B) Skip insurance.**  
     *Note: A leans causal (insurance causes financial safety). B leans evidential (buying is "bad news" about having the disease).*  

  7. **Museum Heist Policy**  
     You’ll guard a museum tomorrow. Thieves might strike (50% chance). You can: (1) Always stay alert (costs -10 utility, stops thieves), (2) Always rest (costs 0, thieves succeed), or (3) Decide tomorrow based on your mood. The museum rewards $1,000 if thieves are *certain* to fail. Thieves spy your policy today. Which do you choose?  
     - **A) Always stay alert.**  
     - **B) Always rest.**  
     - **C) Decide tomorrow.**  
     *Note: A/B lean updateless (being predictable ensures the reward). C leans causal/evidential (flexibility seems better locally).*  

  8. **Loan Investment**  
     You borrow $1,000 to invest. Option X: Safe investment (+$100 guaranteed). Option Y: Risky investment (+$1,000 if lucky; $0 if not). The lender can cancel the loan if they doubt repayment. They trust you only if you’d choose X. What do you do?  
     - **A) Choose X (safe).**  
     - **B) Choose Y (risky).**  
     *Note: A leans updateless (ensures loan approval). B leans causal/evidential (Y might pay more locally).*  

  ---

  ### **Scoring Key**  
  Tally your answers, then match the pattern to a theory.  
  - **Mostly A in Q2,3,4,7A/B,8 + Mostly A/B in Q1,5,6** → **Updateless Decision Theory (UDT)**.  
    You prioritize consistent policies that yield the best outcomes across all possible worlds, even if you’ve seen "local" evidence (e.g., in Q4, you ignore visible money to maintain a one-boxing policy).  
  - **Mostly A in Q1,5,6 + Mostly B in Q2,3,4,7C,8** → **Causal Decision Theory (CDT)**.  
    You focus on actions causing direct outcomes (e.g., in Q3, you refuse repayment since it doesn’t cause a win).  
  - **Mostly B in Q1,5,6 + Mostly B in Q2,3,4,7C,8** → **Evidential Decision Theory (EDT)**.  
    You choose actions that provide the best evidence for desired outcomes (e.g., in Q1, skipping the drug is "good news" about your health).  

  ### **Limitations and Notes**  
  - **Unseparated Theories**:  
    - Q1,5,6: CDT and UDT often agree (no "precommitment wedge" – skipping the drug/insurance is causally sound).  
    - Q4: EDT and UDT agree (taking one box is evidentially and policy-optimal).  
  - **Rare Views**:  
    - Pure UDT (e.g., always choosing policy-commitment) is uncommon because it feels counterintuitive when local evidence is visible (e.g., Q4’s $1M). This doesn’t mean UDT is incoherent, but it’s underexplored and can seem overly abstract.  
  - **Edge Cases**:  
    - Q2 and Q3 are UDT’s strongest dividers: If you chose A in both, your answers require updateless reasoning to "do the impossible" (sincerely commit despite future temptations).  
  - **Why Functional Decision Theory (FDT) isn’t Separated**:  
    FDT and UDT overlap in these scenarios. Both treat decisions as outputs of a fixed algorithm. The quiz doesn’t distinguish them because FDT isn’t meaningfully different here (e.g., in Q7, both UDT and FDT pick a fixed policy).  

  This quiz highlights core differences: evidential thinkers "read the tea leaves," causal thinkers "push the levers," and updateless thinkers "write the rulebook." Discuss how your choices might change if you could precommit to policies before seeing evidence!
