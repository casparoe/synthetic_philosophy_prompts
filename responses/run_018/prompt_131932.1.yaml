  For tractability, #2 works within existing Strawsonian frameworks while #1 requires heavier metaphysical lifting about collective agency. The dependency is clear: settling #2 informs how we approach #1 (if opacity excuses individuals, collective attribution becomes more plausible). And if we could prove manufactured opacity isn't an excuse, it would force major reconsideration of institutional responsibility structures.

  Question #1 about collective entities should come next, as it builds on #2's foundations but requires developing new models of distributed agency. Question #3 seems least urgent - it's important but depends on answers to the first two, and the "participant stance" extension feels more speculative for immediate research.

