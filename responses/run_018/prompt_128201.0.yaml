answer: |-
  Your analysis is perceptive—the deadlock stems not from surface disagreements but from **clashing epistemic frameworks** anchored in divergent purposes for history. Here's a structural diagnosis:

  ### Core Conflict: Competing Epistemologies of Justice
  1. **Purpose-Driven Truth Standards**  
     - **Communal Identity Camp**: Truth = *Moral resonance + Social cohesion*. Accuracy matters less than sustaining group identity and enabling reparative justice. Documents are suspect as tools of historical victors.  
     - **Archival Objectivity Camp**: Truth = *Empirical correspondence*. Moral claims require verifiable facts to prevent competitive victimhood and ideological rewriting.  

  2. **Unexamined Empirical Premise**  
     Both sides implicitly rely on untested claims about **trauma transmission**:  
     - *Pro-memory* assumes collective memory preserves "moral truth" despite factual drift.  
     - *Pro-archive* assumes documents correct memory's "predictable distortions" (confabulation, narrative smoothing).  
     **Crucial gap**: Neither engages with ethnohistorical research (e.g., Vansina's *Oral Tradition* or Assmann's cultural memory theory) showing traumatic events *increase* chronological accuracy in core claims while *amplifying* symbolic details.  

  3. **Moral Metaphysics Clash**  
     - **Can a people be "wrong" about their past?**  
       - Memory camp: No—lived experience is ontologically primary.  
       - Archive camp: Yes—memory is fallible psychological data.  
     This reduces to irreconcilable intuitions about whether collective trauma confers epistemic privilege.

  ### Pathways to Progress (Not Resolution)
  - **Conceptual Leverage**: Distinguish **forensic truth** (perpetrators/dates) from **narrative truth** (meaning/impact). Policies/reparations might prioritize narrative truth; monuments/education could hybridize both (e.g., "On May 1944, our elders remember trains arriving in winter cold..." with archival citations).  
  - **Formal Insight**: Agent-based modeling of **memory transmission** (e.g., applying Boyd & Richerson's cultural evolution models) could show *when* memory distortion serves moral accuracy vs. obscures facts.  
  - **Empirical Test**: Studies like Argentinian forensic anthropology matching mass grave data with survivor testimonies often reveal *both* memory's factual lapses *and* archives' systemic omissions.  

  ### Why Stasis Persists
  The camps answer different questions:  
  - **"What upholds dignity for the oppressed?"** (Memory)  
  - **"What constrains partisan history?"** (Archive)  

  This isn't resolvable through evidence alone because it’s ultim­ately about **non-overlapping moral priorities**.  

  ### Falsifiability of My Diagnosis
  - **Evidence that would shift my view**: Documentation of societies that *fully* reconciled memory/archives without trade-offs (e.g., Rwanda’s *Ingando* camps blending testimony with documentation).  
  - **Weak point**: Overemphasizing dichotomy. Hybrid practices (Indigenous "two-eyed seeing") exist, but rarely resolve *policy* conflicts when reparations hinge on specific claims.  

  ---

  **Verdict**: **Irreducible tension between restorative hermeneutics and forensic positivism**.
