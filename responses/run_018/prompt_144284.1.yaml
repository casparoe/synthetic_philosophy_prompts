prompt: |-
  The institutional design of iterated amplification and distillation in AI alignment treats a complex normative judgment—whether, for instance, a proposed action respects a user's autonomy—as decomposable into a tree of narrower evaluative sub-questions, each answerable by a less capable evaluator or by human raters in bounded contexts. The practice thereby presupposes that alignment and epistemic authority are compositional: that a supervisor's values are preserved through correct aggregation of partial judgments rather than through holistic understanding.

  What philosophical commitments about competence and moral reasoning does this presuppose? Must it assume that ethical cognition is atomistic, or can a holistic view accommodate the method by assigning the normative work to the aggregation rules themselves? There is also a tension with the same tradition's emphasis on emergent capabilities: if intelligence arises unpredictably from scale and interaction, why should values be assumed stable under functional decomposition? Is this asymmetry defensible, or does it depend on an unexamined ontology of mental content?

  Reconstruct the implicit theory: distinguish what the practice strictly requires from what merely fits it, identify rival conceptions of understanding or value that it quietly excludes, and say what an alignment protocol built on non-compositional or emergentist premises would need to change. Please answer in British English.
