prompt: |-
  I've been trying to wrap my head around vagueness for a paper I'm not writing, and I keep bouncing between epistemicism—basically Williamson's idea that there's always a sharp line, we just don't know where—and supervaluationism, where there's genuinely no fact of the matter at the borders. But I'm not interested in replaying the sorites paradox for the millionth time. Instead, compare them specifically on how they handle second-order vagueness in normative legal threshholds, like the line between 'reckless' and 'merely negligent' in tort law, where judges act like precision exists but everyone admits it doesn't. Which view gives a more coherant account of why legal reasoning pretends there's a cutoff without committing to hidden sharp boundaries? Definately take one side: say which view actually does the explanatory work here and exactly where the other one breaks down, don't just lay out options. Start with your bottom line in sentence one, then give the reasoning straight away—no preamble, no restating the prompt. I'm not asking for citations or a reading list, just work the conceptual machinery yourself.
reasoning: |-
  Okay, the user is working on a paper about vagueness, specifically comparing epistemicism and supervaluationism in the context of legal thresholds like "reckless" vs. "negligent." They want a clear stance without rehashing the sorites paradox. 

  Hmm, legal contexts are interesting here because judges act like there's a precise line even when everyone knows it's fuzzy. The user seems frustrated with theoretical back-and-forths and wants a practical comparison—especially on second-order vagueness (the vagueness of where the vague boundary itself lies). 

  Supervaluationism wins this one. Why? Because epistemicism insists there's a hidden sharp boundary—which directly contradicts how legal actors openly acknowledge the lack of precision. If epistemicism were true, judges would just be ignorant of the exact line, but in reality, they deliberately *choose* interpretations (like fixing meanings via precedent). That’s classic supervaluationist "precisification." 

  Where epistemicism breaks down: It can’t explain why legal reasoning treats borderline cases as genuinely unsettled (not just unknown). Take a judge setting a new precedent—they’re not discovering a hidden line; they’re creating one. Supervaluationism captures that by treating "reckless" as having multiple admissible precisifications until a court picks one. 

  Epistemicism also flops on second-order vagueness. If the reckless/negligent boundary were sharp but unknown, the zone of uncertainty would itself have sharp edges—but courts debate how much debate is even reasonable, which implies higher-order fuzziness. Supervaluationism handles this naturally: what counts as an "admissible" precisification can itself be vague. 

  User’s probably relieved to ditch Williamson here—insisting hidden boundaries exist in law feels like denying the courtroom’s messy reality. Supervaluationism’s flexibility with precisifications just fits legal practice better.
answer: |-
  **Supervaluationism provides the coherent account of legal reasoning's pretence of precision without hidden sharp boundaries, while epistemicism implausibly insists on undiscoverable cutoffs that contradict judicial practice.**  

  Epistemicism fails because it *demands* a precise boundary (e.g., between "reckless" and "negligent") existing in reality, even if unknowable. But in law, when judges admit vagueness yet enforce a decision, they aren’t uncovering a hidden fact—they’re *stipulating* a precisification. Epistemicism can’t explain why legal actors openly reject the existence of a sharp line while making rulings; it absurdly implies judges are perpetually mistaken about their own epistemic limitations.  

  Supervaluationism, however, captures this perfectly:  
  - **Legal precisification** treats borderline cases (e.g., "Was driving 45 mph in a school zone 'reckless'?") as having *no determinate truth-value* until a court fixes meaning contextually. Judges aren’t discovering a boundary—they’re selecting one admissible precisification (e.g., "45 mph counts as reckless under *these* circumstances").  
  - **Second-order vagueness** (vagueness in what counts as borderline) arises because what constitutes an "admissible precisification" is *itself* vague. Courts debate whether certain interpretations are "reasonable" without assuming a sharp meta-boundary. This mirrors how tort law acknowledges that even the category of "borderline reckless/negligent cases" has fuzzy edges.  
  - **The pretence of precision** reflects *decision-forcing*: Law must resolve cases, so judges act *as if* their chosen precisification reveals a preexisting line, when they’re actually constructing it. Supervaluationism endorses this pragmatically—truth is settled by the precisification, not prior to it.  

  Epistemicism breaks down by misdiagnosing legal practice: It attributes judicial uncertainty to ignorance of a metaphysical boundary, when in fact courts *deny such boundaries exist*. Supervaluationism’s machinery—truth as super-truth across precisifications, gaps in borderline zones, and stipulation in practice—aligns with law’s operational reality: Vagueness is resolved by authoritative choice, not discovered fact.
