  can anyone help me understand the passage? specifically, does descartes argument about not being able to tell dream from waking mean he needs there to be one central "inner screen" where all experience is shown, or could it actually fit with the idea that there are multiple drafts running with no central viewer? and is the cartesian theater meant to be a literal place or just a metaphor for assuming theres one place where it all comes together? i keep going back and forth and the old text is too confusing to tell.
