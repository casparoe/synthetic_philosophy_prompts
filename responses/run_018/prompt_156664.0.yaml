  Next, aspiration adjustment in Simon's model has no direct analog in anchored search. The fixed floor means no learning from failures. The user mentions this rigidity might break bounded rationality justification. Bounded rationality is about coping with cognitive limits and search costs. Simon's model adapts to these constraints, while anchored search's inflexibility could lead to high search costs or failure to find any option, violating the efficiency principle of bounded rationality.

