prompt: |-
  Hey, I'm putting together prompts for a philosophy dataset and I'm kind of stuck. I'm taking a course on virtue ethics and the situationist critique is making my head spin — especially because every example I see is either Milgram-style obedience or those classic psychology experiments about helping strangers, and those feel totally overused by now. I was arguing with my friends about whether virtue can survive if behavior is mostly driven by tiny contextual cues, and we went in circles.

  Can you design a thought experiment for me? I want it realistic — like a hybrid workplace or community volunteer group, one paragraph max, definitely no trolleys or sci-fi. The setup: a person behaves with what looks like real compassion in one setting, then behaves callously in an almost identical setting, with only one subtle situational feature changed (maybe seating arrangment, ambient noise, or whether it's over video). Here's the twist: the agent has a mistaken explicit belief about her own character — she thinks she's consistently kind — and that self-misunderstanding needs to be part of the analysis. The case should be built so a virtue ethicist can plausibly argue the difference shows context-sensitive practical wisdom or moral attention rather than missing virtue, while a situationist can plausibly claim it's pure situational determinism with no stable trait behind it. Both should be genuinely available from the same facts.

  Then walk through it: state the behavior and method, the nearby worlds, why each side gives its verdict, and identify the exact conceptual feature doing the work — maybe something about self-knowledge or trait granularity. Say what happens if you remove that feature. Finish with how a virtue defender would push back, maybe by appealing to moral perception or the idea that virtues respond to reasons that shift with context. Don't ask me for citations or a bibliography — I can't check those. And don't quote philosophers verbatim; paraphrase instead.

  At the end, summarize everything in a JSON object with these fields: "scenario", "situational_variable", "virtue_reading", "situationist_reading", "work_feature", "collapse_condition", "virtue_defense". Each should be a string.
reasoning: |-
  We are creating a thought experiment that meets the following criteria:
   - Realistic setting: hybrid workplace or community volunteer group.
   - One paragraph max.
   - No trolleys or sci-fi.
   - Setup: A person behaves compassionately in one setting and callously in an almost identical setting, with only one subtle situational feature changed.
   - The agent has a mistaken explicit belief about her own character (she thinks she's consistently kind).
   - The case should allow for two plausible interpretations: 
        (a) Virtue ethicist: the difference shows context-sensitive practical wisdom or moral attention.
        (b) Situationist: it's pure situational determinism with no stable trait.
   - Then we break it down as per the instructions.

   Thought Experiment:

   In a hybrid workplace, Maya is known for her kindness. During in-person team meetings at the office, she consistently checks in on colleagues' well-being, offers help, and listens attentively. However, during virtual meetings with the same team discussing identical topics, she often interrupts, dismisses concerns, and appears impatient. Maya believes she's equally compassionate in both settings. The only difference is the seating arrangement: in person, they sit in a circle at eye level, fostering a sense of equality and connection; virtually, the grid layout on her screen places her own video feed prominently at the center, subtly reinforcing self-focus.

   Breakdown:

   1. Behavior and Method:
      - Behavior: Compassionate (in-person) vs. Callous (virtual)
      - Method: Observation of team meetings in two modalities (in-person vs. virtual) with the same team and topics.

   2. Nearby Worlds:
      - We consider slight variations: 
          - If the in-person meeting had a hierarchical seating arrangement (e.g., Maya at the head of a long table), would she still be compassionate?
          - If the virtual meeting had her own video feed minimized or hidden, would she be more compassionate?

   3. Why each side gives its verdict:
      - Virtue Ethicist: Maya possesses the virtue of compassion, but its expression requires appropriate moral perception. The in-person circle facilitates the perception of others as equals, enabling her compassion to be exercised. The virtual grid impairs her moral perception by centering her own image, making it harder to attend to others. Thus, the difference is due to context-sensitive practical wisdom (she responds to the reasons present in the situation, which are obscured in the virtual setting).
      - Situationist: There is no stable trait of compassion in Maya. Her behavior is determined by subtle environmental cues: the circle triggers helping behavior (due to its association with collaboration) and the grid triggers self-focused behavior (due to the prominence of self-image). The fact that she believes she is consistently kind shows a fundamental attribution error and self-misunderstanding.

   4. The exact conceptual feature doing the work:
      - The feature is the **agent's capacity for moral perception** (which the virtue ethicist sees as part of practical wisdom and the situationist sees as easily disrupted by environmental factors). The virtue ethicist argues that the virtue is present but requires perception of the morally relevant features, which the virtual setting obscures. The situationist argues that without the cue (circle arrangement) triggering the behavior, the "virtue" doesn't manifest, showing it's not stable.

   5. What happens if we remove that feature?
      - Remove the agent's mistaken belief? If Maya were aware of her inconsistency, the situationist might argue she's not virtuous because she fails to notice her own behavior. The virtue ethicist might argue that awareness could lead to self-improvement. But the key feature is the sensitivity to context and the agent's self-misunderstanding. If we remove the self-misunderstanding (i.e., she knows she's inconsistent), then the case becomes less about the debate and more about self-awareness. However, the core feature is the role of the situational cue and its effect on behavior. If we remove the situational variable (e.g., by making both settings identical), then the behavior would be consistent and there would be no debate.

   6. How a virtue defender would push back:
      - The virtue defender would argue that virtues are not rigid behavioral dispositions but rather responsive to reasons. The context shift (from circle to grid) changes the reasons available: in the circle, the equal arrangement provides reasons to attend to others, while the grid provides reasons (through distraction or self-focus) that make compassion harder. Thus, the difference in behavior does not show a lack of virtue but rather the context-dependency of virtuous action. Moreover, the virtue defender might argue that self-knowledge is part of virtue and that Maya's self-misunderstanding is a flaw, but that does not negate the presence of the virtue in contexts that support its expression.

   Now, we summarize in JSON as requested:

   Fields:
     "scenario": string (the thought experiment in one paragraph)
     "situational_variable": string (the one subtle feature that changes)
     "virtue_reading": string (the virtue ethicist's interpretation)
     "situationist_reading": string (the situationist's interpretation)
     "work_feature": string (the exact conceptual feature doing the work)
     "collapse_condition": string (what happens if you remove that feature)
     "virtue_defense": string (how the virtue defender pushes back)

   Let's write the JSON object accordingly.
answer: |-
  ### Thought Experiment: Community Volunteer Coordination

  **Scenario:**  
  Ava, a dedicated volunteer at a community kitchen, consistently demonstrates compassion during in-person planning sessions: she actively listens to others' ideas, adjusts tasks to accommodate volunteers' limitations, and offers encouraging feedback. However, during virtual meetings for the same team and agenda, she interrupts frequently, dismisses logistical concerns as "whining," and rushes decisions that strain vulnerable volunteers. Ava considers herself uniformly kind in both settings, attributing any friction to "tech issues." The only situational difference is the presence of soft instrumental background music during in-person meetings (subtly reinforcing calm and collaboration), replaced by abrupt notification chimes on her laptop during virtual calls (inducing low-grade stress).

  ---

  ### Analysis  
  **1. Behavior & Method**  
  - **Behavior:** Compassion (active listening, flexibility) in music-accompanied in-person meetings vs. callousness (interruptions, dismissal) in notification-disrupted virtual meetings.  
  - **Method:** Observation of Ava's conduct across physically/virtually identical team interactions, controlling for agenda/participants.  

  **2. Nearby Worlds**  
  - If in-person meetings had notification chimes, would Ava still be compassionate? (Likely no, per situationism).  
  - If virtual meetings had calming music, would callousness persist? (Virtue ethics argues no, as conditions enable moral perception).  

  **3. Interpretive Verdicts**  
  - **Virtue Reading:** Ava possesses compassion but exercises context-sensitive *moral attention*. Music fosters conditions for noticing others' needs; notifications fragment attention, obscuring moral reasons to respond kindly. Her self-misunderstanding stems from conflating intention with situated wisdom.  
  - **Situationist Reading:** No stable trait exists—behavior is determined by auditory cues. Music triggers automatic collaboration scripts; notifications prime impatience via cognitive load. Ava’s belief in consistent kindness illustrates the *fundamental attribution error*.  

  **4. Conceptual Work Feature**  
  - **Self-Knowledge Granularity:** Ava’s belief that "kindness" is a context-independent monolith (vs. a reason-responsive capacity requiring situational attunement). This allows virtue ethicists to frame inconsistency as sensitivity and situationists as trait absence.  

  **5. Collapse Condition**  
  Remove Ava’s *self-misunderstanding*: if she acknowledged her virtual callousness, situationists lose evidence of attribution error, and virtue ethicists gain a growth opportunity (e.g., her addressing attentional barriers). The ambiguity collapses toward one interpretation.  

  **6. Virtue Defense Pushback**  
  Virtue ethics counters that compassion isn’t robotic uniformity but *reasons-responsiveness*: notifications overwhelm moral perception (a skill), while music sustains it. Thus, Ava’s in-person virtue is genuine but fragile—not absent. Cultivating virtue requires designing environments that "keep reasons in view," not denying trait existence.  

  ---

