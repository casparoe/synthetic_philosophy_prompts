    "virtue_reading": "Ava possesses compassion but expresses it through context-sensitive moral attention; music supports noticing others' needs, while notifications obscure moral reasons.",
    "situationist_reading": "No stable trait exists; auditory cues directly determine behavior (music primes collaboration, notifications induce stress). Ava's self-view shows the fundamental attribution error.",
    "work_feature": "Ava's belief that kindness is a context-independent monolith rather than a reason-responsive capacity requiring situational attunement.",
    "collapse_condition": "Removing Ava's self-misunderstanding collapses ambiguity: acknowledging inconsistency weakens situationist evidence of attribution error and gives virtue ethics a growth pathway.",
    "virtue_defense": "Compassion responds to moral reasons; notifications overwhelm perception (a skill part of virtue), while music sustains it. Inconsistency reflects environmental fragility of practical wisdom, not trait absence."
  }
