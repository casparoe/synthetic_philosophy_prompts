prompt: |-
  As a software engineer with no formal background in philosophy, I am trying to think clearly about whether moral significance tracks the kind of computation being executed or the physical substrate that runs it. Please construct a thought experiment according to the following specifications.

  Construct a realistic, single-paragraph clinical scenario—avoiding science fiction—in which a patient’s process of integrating autobiographical memory with present emotional appraisal is distributed across both intact biological neural tissue and an implanted digital prosthesis, with both substrates contributing causally to one unified computation. Engineer the case so that a functionalist account must locate the morally relevant harm (or preservation) in the continuity of that computation regardless of which substrate is interrupted, whereas a substrate-dependent account must locate it exclusively in the biological tissue, even though both accounts accept the identical physical and behavioural facts. After the scenario, demonstrate that it meets these specifications: state the belief or attribution each theory makes, show why the functionalist verdict follows from computation-type alone, show why the substrate-dependent verdict follows from biology alone, and isolate the single structural feature of the case that generates the divergence. Then explain what happens to the disagreement if that feature is removed—specifically, whether the case collapses into agreement or becomes underdetermined. Finally, present the strongest objection a defender of the substrate-dependent view could raise against your construction, without appealing to bibliographies, reading lists, or citations. Please write your response in British English.
