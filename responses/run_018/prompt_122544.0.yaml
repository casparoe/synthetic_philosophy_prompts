answer: |-
  Here's a rigorous translation and residue report, treating your craft vocabulary as the target language and philosophical positions as source languages. Marta's villain-status is our test case throughout.

  **Core Translation:**

  *   **Epistemicism → Craft Vocabulary:**  
      *Bivalence holds:* Marta either *is* a villain or *is not* a villain in the actual world of the finished novel. This fact is **canon** in the character bible.  
      *Indiscriminability:* Readers (and even you, the author, during drafting) cannot reliably *know* whether any single action pushes her over the threshold. Each action is a neighbouring case in a sorites series.  
      *Swing Facts:* Represent *epistemic uncertainty*. During drafting, a fact about Marta's past (e.g., "Marta intentionally ruined her rival's project in college") might be a swing fact because *you don't know yet* if it happened. But once the book is finished, *all swing facts are resolved into canon*. The Bellwether Rule doesn't apply to the *published* work – it's a tool for managing uncertainty *during creation*. "Is Marta a villain?" has a yes/no answer in the final text, even if readers debate it endlessly.  
      *Retcon:* Changing a previously established canon fact is literally changing the fictional world – admitting you were *wrong* about the world before. It breaks bivalence for that fact.

  *   **Supervaluationism → Craft Vocabulary:**  
      *Admissible Precisifications:* These are your **publishable versions** of the novel(s).  
      *Swing Facts:* Are facts that **vary across admissible precisifications (publishable versions)**. "Marta is a villain" is a swing fact *because* some publishable versions make her definitively a villain, others definitively not, and others leave it ambiguous (which is itself a distinct precisification).  
      *Supertruth (Truth simpliciter):* A statement is supertrue (just plain true in the fiction) if it holds in **every publishable version**. This is *exactly* your Bellwether Rule locking: "Marta grew up in Lisbon" is canon only if it's true in every version you'd publish.  
      *Superfalsehood:* Similarly, false if false in every publishable version.  
      *Borderline/Neither:* A statement like "Marta is a villain" is *neither true nor false* in the fiction *as a whole* if it's true in some publishable versions and false in others. Its status is *indeterminate*; it remains a swing fact *even conceptually after publication?* (See Residue point 2).  
      *Validity (Preservation of Supertruth):* An argument about the fiction is valid if, whenever its premises are canon (supertrue), its conclusion is also canon (supertrue). If "All villains in this world wear black hats" is canon and "Marta wears a black hat" is canon, then "Marta is a villain" *must* be canon. If it's not, one of the premises isn't *actually* supertrue.

  **Residue Report:**

  1.  **Clean Translation:**
      *   **Admissible Precisification ↔ Publishable Version:** This is near-perfect. Both define the range of coherent, acceptable ways the fiction *could* be specified.
      *   **Supertruth ↔ Bellwether-Locked Canon:** Spot on. "True in all admissible precisifications" maps directly to "holds in every publishable version".
      *   **Borderline Case ↔ Swing Fact (during creation):** During drafting, a borderline case (like villain-status) *is* a swing fact – it varies across precisifications/versions.
      *   **Epistemic Indiscriminability ↔ Reader/Author Uncertainty:** The *reason* readers (and maybe you) can't pin down villain-status under epistemicism maps well to the *experience* of uncertainty created by neighbouring actions in the series.

  2.  **Translation with Distortion / Smuggled Assumptions:**
      *   **Epistemicism smuggles Platonism:** It assumes the *actual, complete fictional world exists independently* (with its sharp cutoff), and you/the reader are merely *discovering* it (imperfectly). Your vocabulary treats the world as *under construction*; the Bellwether Rule governs *what you are willing to make canon*. Epistemicism struggles with the *author's* genuine indecision during creation – it frames your uncertainty as *ignorance* of a pre-existing fact, not genuine indeterminacy. Retcon feels like *error correction*, not development.
      *   **Supervaluationism smuggles Logical Constraints:** "Admissible" precisifications are typically defined by *logical consistency* and *meaning constraints* (e.g., a precisification can't make "bald" mean "has blue eyes"). Your "publishable versions" are constrained by *narrative coherence, thematic intent, character consistency, aesthetic goals* – which include but *far exceed* purely logical constraints. A "publishable version" might deliberately *violate* strict logic for thematic effect (e.g., magical realism), which a strict supervaluationist might call inadmissible.
      *   **Post-Publication Status (Supervaluationism):** Supervaluationism suggests that if "Marta is a villain" is borderline (true in some admissible versions, false in others), then *even in the published novel*, this statement is *neither true nor false*. Does your vocabulary allow a *published* fact to remain a "swing fact"? Your description focuses on the drafting/bible process. This is a crucial friction point: Does publication "lock" *all* facts, or does it leave some genuinely indeterminate? Supervaluationism leans towards permanent indeterminacy for borderlines, while the implication of locking the bible suggests publication resolves swing facts.

  3.  **Untranslatable Elements / Pressing Points:**
      *   **(a) Iterated "Definitely" (Definitely a villain, Definitely definitely...):**
          *   **Philosophy:** Under supervaluationism, "Definitely P" means "P is true in *all* admissible precisifications." "Definitely Definitely P" means "It's definite that it's definite that P," which requires P to be true in *all precisifications of the set of admissible precisifications*. Does this stabilize? Only if there's a level where the "admissible" boundary is sharp (no higher-order vagueness), which is controversial. Epistemicism just says "Definitely" = "We know", and iterating it adds nothing but emphasis (since the sharp cutoff exists).
          *   **Craft Translation:** This maps poorly. The closest is perhaps the *robustness* of a Bellwether-locked canon fact against *radical* revisions. "Marta grew up in Lisbon" is canon (definitely true). Would you *ever* publish a version where she didn't? If absolutely not, then "Definitely (Marta grew up in Lisbon)" holds. If you *might* entertain a radical rewrite where she didn't (perhaps as an alternate universe story), then it's only "True" not "Definitely True". "Definitely Definitely" would require that the *set of publishable versions itself* is so fixed that questioning *whether* "Lisbon" is canon is inconceivable in any future project. This feels artificial and doesn't have a clear counterpart in your bible process. It highlights that "publishable" is inherently vague and context-dependent for you.
      *   **(b) Higher-Order Vagueness (Is 'admissible/publishable' itself vague?):**
          *   **Philosophy:** Yes, "which versions are admissible?" is itself vague. Supervaluationism doesn't collapse; it handles this by moving to super-supervaluations (precisifying what counts as admissible), ad infinitum. It just moves the bump. Epistemicism bites the bullet: there's a sharp cutoff to "admissible," we just can't know it.
          *   **Craft Translation:** This is **native** to your vocabulary! Your Bellwether Rule *explicitly* relies on "versions we'd actually be willing to publish," which is *inherently* a vague, borderline-case-rich concept. Deciding *if* a version is publishable is *itself* governed by a higher-order Bellwether-like principle. This isn't a problem for your framework; it's built-in. It *does* mean that even "supertruth" (Bellwether-locked canon) has a degree of context-sensitivity based on your evolving sense of "publishable," but that reflects creative reality. Supervaluationism *formalizes* this regress; your practice *lives* it.
      *   **(c) Conditionals (If Lisbon then Portuguese) & Export:**
          *   **Philosophy:** Supervaluationism generally **preserves modus ponens locally**: *Within* a single precisification, if "If P then Q" is true and P is true, then Q is true. The "break" happens with **exportation**: From "If P then Q" being true *simpliciter* (supertrue), you *cannot* validly infer that the material conditional "P ⊃ Q" is supertrue. Why? "If P then Q" is supertrue = It's true in *every* precisification that if P holds *in that precisification*, then Q holds *in that precisification*. "P ⊃ Q" being supertrue = In every precisification, *either* P is false *or* Q is true *in that precisification*. These are different! Exportation fails if there are precisifications where P is true and Q is false (making P ⊃ Q false there), yet in *those same* precisifications, the *conditional* "If P then Q" might still be *false* (so it doesn't threaten the supertruth of the conditional). It's subtle. The core is: Supertruth of the conditional guarantees Q whenever P is true *within any single world*, but not that P and Q are coordinated *across* worlds such that P never holds without Q in *some* world.
          *   **Craft Translation:** Imagine a bible entry: "If Marta grew up in Lisbon, then she speaks Portuguese fluently." This is **not equivalent** to locking "Either Marta didn't grow up in Lisbon, or she speaks Portuguese fluently" as canon via the Bellwether Rule. The conditional entry means: *In every publishable version*, **if** that version has her growing up in Lisbon, **then** that version also has her speaking Portuguese fluently. It *allows* for publishable versions where she *doesn't* grow up in Lisbon (and maybe doesn't speak Portuguese). Crucially, it *forbids* versions where she *does* grow up in Lisbon but *doesn't* speak Portuguese fluently. The exported material conditional ("Either not-Lisbon or Portuguese") being Bellwether-locked would *also* forbid versions where she grows up in Lisbon but doesn't speak Portuguese, *but additionally* it would require that *every* publishable version must contain *either* "not-Lisbon" *or* "Portuguese" as a fact – potentially forcing a decision you don't want to make. The conditional entry is **weaker and preserves the swing**: "Lisbon" can remain a swing fact, and "Portuguese" can remain a swing fact, *as long as* no version links Lisbon without Portuguese. The export failure means you *cannot* reliably convert this conditional dependency into a disjunction of canon facts without potentially over-constraining the swing facts. Your bible handles this gracefully by allowing the conditional entry itself.

  4.  **Bellwether Rule vs. Supervaluationism & The Residue:**
      *   **Is it just Supervaluationism?** It's **supervaluationism applied by an author with narrative intent**. The core machinery of "truth as holding in all admissible precisifications" ↔ "canon as holding in all publishable versions" is identical. The Bellwether Rule *is* the supervaluationist definition of truth for your fictional world during its construction.
      *   **Key Difference - Constraint Source:** The crucial residue is the *source* of admissibility/publishability. Pure supervaluationism emphasizes *logical and semantic* constraints (meaning, consistency). The Bellwether Rule is constrained by *authorial intent, aesthetic judgment, narrative purpose, and thematic coherence*. A version might be logically impeccable but thematically dead for you – hence unpublishable. This makes your "admissible" set richer and more purposive.
      *   **Not Epistemicism:** The Bellwether Rule actively *preserves* indeterminacy (swing facts) where epistemicism demands hidden determinacy. Retcon isn't just error correction; it's a change in which world is being actualized.
      *   **Not Simple Truth-Value Gap:** While it uses gaps (swing facts), it embeds them within the supervaluationist structure to define truth/falsity *simpliciter* (Bellwether-locked canon).
      *   **Not Pure "Author Decides":** While authorial fiat *determines* the set of publishable versions, the *truth/falsity/indeterminacy* of propositions *within the fiction* is then *determined by* their status across that set. It's authorially *mediated* supervaluationism.
      *   **What the Residue Reveals:**
          *   **Unfinished Worlds are Fundamentally Vague:** Your vocabulary brilliantly captures that an unfinished fiction is a space of possibilities (precisifications/versions), not an incomplete description of a single determinate world. The residue (especially point 2b & 4) shows supervaluationism provides a powerful formal model *for this process*.
          *   **Narrative Purpose Trumps Logic:** The untranslatable element regarding constraints (point 2b) highlights that logical consistency, while important, is subservient to narrative purpose in defining your "admissible" set. This is a feature, not a bug, of creative writing.
          *   **Arguments About Less?:** The core insight of supervaluationism (truth defined globally over possibilities) maps so well to your practice that the philosophical debate *about that core* seems less relevant *to you*. However, debates about *higher-order vagueness* and the *source/status* of admissibility constraints (logical vs. narrative) remain substantive and are actively handled by your Bellwether Rule's reliance on inherently vague authorial judgment. The residue confirms your vocabulary robustly handles the *creative reality* of vagueness in fiction construction, potentially better than the philosophers' formalisms capture the messiness of artistic constraint.

  **Conclusion for Marta:** Your indeterminate prose isn't failing to decide if Marta is a villain; it's *actively making* "Marta is a villain" a **swing fact** according to the Bellwether Rule. It remains indeterminate *because* there are publishable versions where she is, and publishable versions where she isn't (or is ambiguous). Locking it as canon would require you to be willing to jettison *all* versions where the opposite holds. The reader debate *is* the experience of higher-order vagueness around "publishable" and the sorites series of her actions. The Bellwether Rule is authorially constrained supervaluationism in action – a sophisticated tool perfectly suited to managing the essential vagueness of an unfolding fictional world. The philosophical positions aren't arguing about nothing, but your workshop vocabulary already encapsulates the most crucial insights for the *practice* of creation, particularly the primacy of narrative purpose over abstract logic in defining what counts. Keep Marta swinging.
