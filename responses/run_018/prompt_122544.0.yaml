prompt: |-
  You are a professional philosopher who specializes in vagueness and the philosophy of language — like, someone who has actually taught this stuff, not a generalist who skimmed an encyclopedia entry — and who also reads a lot of literary fiction. Please think carefully here, do some brainstorming before you commit to an answer, and don't hedge everything into mush at the end. I'd rather have something worked-through than something smooth.

  My situation: I write novels. I'm finishing the third book of a trilogy about a woman named Marta who, over the course of the books, does a long series of things each of which is individually excusable — a lie to a friend, a small betrayal, a quiet bit of cruelty, an omission that costs someone their job — and readers keep asking me "is Marta a villain now?" and I honestly don't think my book decides that. Nothing in the prose settles it.

  In my workshop we have vocabulary for this. We call facts like that swing facts: facts about a character or a world that the text hasn't nailed down and that could still go either way in a later draft. And we have a rule, the Bellwether Rule, which we use when maintaining the continuity bible: a swing fact gets locked into the bible only if it holds in every version of the material we'd actually be willing to publish. If some publishable version has it and some publishable version doesn't, it stays a swing fact and we're forbidden from writing it down either way. (Otherwise we use ordinary craft talk: canon, retcon, diegetic, in-character/out-of-character, death of the author, character bible, negative capability.)

  Here's the job. Take the two big positions on vagueness — epistemicism (bivalence and classical logic both survive; there is a sharp cut-off somewhere, we just can never know where, because knowledge requires a margin for error and neighbouring cases in a sorites series are indiscriminable) and supervaluationism (a vague sentence is true only if it comes out true under every admissible precisification; borderline claims are neither true nor false; validity is preservation of that supertruth) — and translate each into the craft vocabulary above as faithfully as you can. I'm fluent in my vocabulary and a nervous beginner in yours, so explain the philosophy only as far as the translation needs it. Use Marta.

  Then the residue report, which is the part I actually want:

  1. What translates cleanly onto canon / swing-fact / retcon talk?
  2. What translates only with distortion — and specifically, where are you quietly smuggling in an assumption my vocabulary doesn't have, e.g. that the world of the novel is already complete and I'm discovering it rather than making it?
  3. What has no counterpart in my vocabulary at all? Three things I want you to press on: (a) iterated "definitely" — Marta is definitely a villain, definitely definitely a villain, and so on — does that ever stabilize, and what does it correspond to for me; (b) higher-order vagueness, i.e. the fact that which versions count as admissible is itself a swing fact — does that collapse the supervaluationist story or just move the bump in the carpet; (c) conditionals in the character bible, like "if Marta grew up in Lisbon then she speaks Portuguese" — I've half-heard that supervaluationism keeps modus ponens but that something breaks when you try to export a conditional out of a supposition. Check that for me, tell me if it's a myth, and tell me what it would look like in bible terms if it's true.
  4. And the bit I care most about: is my Bellwether Rule actually just supervaluationism wearing a cardigan, or is it something else in disguise — closer to epistemicism, or to a plain truth-value-gap view, or to "the author gets to decide"? Finally: does the residue point at something my workshop vocabulary is missing about unfinished fictional worlds, or is it evidence that the two positions are arguing about less than they seem to be?

  Be concrete, keep it about Marta, and don't just tell me "it's only a metaphor" — I want the translation to actaully do some work.
