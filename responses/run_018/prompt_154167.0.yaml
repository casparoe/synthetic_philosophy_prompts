  The proposal needs a six-month part-time scope. So the methodology should be manageable: literature review to pick case studies, detailed analysis of each, and then comparing them to both standard and interventional frameworks. Outputs could be a workshop paper or a draft manuscript.

  What would a useful result look like? If case studies show that theories with simpler interventional structures were favored, that supports the interventional framing. If not, maybe the standard view holds. Failure would be if the case studies don't clearly differentiate, or if interventions are just another form of data, not a distinct factor.

  Also, the user wants to avoid textbook examples. So skip things like curve-fitting or simple Turing machines. Instead, use real scientific debates like the transition from Newtonian to Einsteinian mechanics focusing on gravitational lensing predictions as interventions.

