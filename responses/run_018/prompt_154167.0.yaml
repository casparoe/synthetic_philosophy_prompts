  Potential pitfalls: Confirmation bias in selecting case studies. Mitigation by choosing well-documented examples from both physics and biology. Also, distinguishing between predictive and interventional simplicity might be blurry in some cases. Need clear criteria for what counts as an intervention in each case study.

