answer: |-
  Below is a complete design for your workshop, including rules, materials, and debrief. It's structured to create the dynamics you described while staying within 90 minutes. The design emphasizes **hidden information asymmetries** and forces participants to confront why apparent Pareto improvements might not be safe.

  ---

  ### **Workshop Overview**
  **Objective:** Illustrate why "safe" Pareto improvements require more than "nobody objects" — specifically, public verifiability, common knowledge of no hidden injuries, and robustness to post-hoc preference revelation.  
  **Participants:** 10 graduate students.  
  **Duration:** 90 minutes.  
  **Mechanics:**  
  - Each participant has a **private envelope** with their base score and a hidden injury clause.  
  - **Collective payoff:** Snack fund = Total true scores × $0.01 (e.g., 250 points = $2.50). Hidden injuries reduce the group total.  
  - **Voting:** Unanimous approval required for proposals to pass.  
  - **Communication:** Participants can express "unease" about specific elements but cannot reveal their clause or open envelopes.  

  ---

  ### **Materials Needed**
  1. **10 Envelopes** (one per participant), each containing:  
     - A card with:  
       ```  
       BASE SCORE: [X] points  
       HIDDEN INJURY CLAUSE: If the proposal [CONDITION], your true score = 1/2 base score.  
       ```  
     - **Clause conditions** (assign randomly):  
       - 2 word-triggered: "Includes the word 'TAX'", "Includes the word 'ADJUST'").  
       - 2 number-triggered: "Sets your score to 15", "Sets your score to 25").  
       - 6 dummy clauses: Non-triggering (e.g., "Sets your score to 100", "Includes the word 'DRAGON'") to dilute risk.  
  2. **Public Board** (whiteboard/projector) showing:  
     - Base scores (e.g., P1: 10, P2: 12, P3: 14, P4: 16, P5: 18, P6: 20, P7: 22, P8: 24, P9: 26, P10: 28). Total base = 190.  
     - Redistribution proposals (visible scores are ≥ base scores).  
  3. **Voting Sheets** for public votes.  
  4. **Private True-Score Slips** for participants to submit scores after each round.  

  ---

  ### **Rules & Protocol**  
  **Setup (5 min):**  
  - Distribute envelopes. Participants read their base score and injury clause but keep it secret.  
  - Explain rules:  
    - Proposals show public scores (always ≥ base scores).  
    - If proposal passes:  
      - Your true score = public score **UNLESS** your clause is triggered → then true score = 1/2 base score.  
    - If proposal fails: Everyone keeps base score (no injury).  
    - Expressing unease: You can say, "I’m uneasy about [word/number]" but nothing more.  
    - Voting: Unanimous "yes" required to pass. Votes are public.  
  - Snack fund = sum of all true scores across 3 rounds × $0.01.  

  **Round 1: Smooth Coordination (15 min)**  
  - **Proposal:**  
    ```  
    "UNIVERSAL BONUS: All scores +5 points."  
    P1: 15, P2: 17, P3: 19, P4: 21, P5: 23, P6: 25, P7: 27, P8: 29, P9: 31, P10: 33.  
    ```  
  - **Hidden Injuries:** None (avoids triggering words/numbers).  
  - **Facilitator Guidance:** Keep discussion light. Ask, "Any objections?"  
  - **Expected Outcome:** Quick unanimous vote. True scores = public scores (total = 240).  
  - **Why it works:** No hidden injuries → mimics "naive Pareto."  

  **Round 2: Suspicious Silence (20 min)**  
  - **Proposal:**  
    ```  
    "TAX ADJUSTMENT: P1-P5 +8 points, P6-P10 +0 points."  
    P1: 18, P2: 20, P3: 22, P4: 24, P5: 26, P6: 20, P7: 22, P8: 24, P9: 26, P10: 28.  
    ```  
    *(Publicly Pareto: All scores ≥ base. P6-P10 unchanged but not decreased.)*  
  - **Hidden Injuries Triggered:**  
    - "Includes 'TAX'" → One participant (e.g., P7) injured. True score = 11 (1/2 of 22).  
    - "Sets your score to 20" → One participant (e.g., P2) injured. True score = 6 (1/2 of 12).  
    - *Total true score = 240 - 17 = 223 (publicly appears as 240).*  
  - **Facilitator Guidance:** Note if participants mention unease (e.g., "I dislike 'TAX'"). Intervene minimally.  
  - **Expected Dynamics:**  
    - Injured participants may stay silent (social pressure not to block the group).  
    - Proposal likely passes, but true score drops. Participants see the fund grow slower than expected.  
  - **Why it works:** Hidden injuries are active but unverifiable → "nobody objected" wasn’t enough.  

  **Round 3: Refusal or Verification Spiral (25 min)**  
  - **Proposal:**  
    ```  
    "EQUALIZATION: P1: 25, P2: 25, P3: 25, P4: 25, P5: 25, P6: 25, P7: 25, P8: 25, P9: 25, P10: 25."  
    ```  
    *(Publicly Pareto: All scores ≥ base. P1 gains 15, P10 loses 3 but still above base 28? → **No!** Wait, P10’s base is 28, but proposal sets to 25 (25 < 28). This is not Pareto! We need to ensure the proposal is publicly non-decreasing. Let's correct:)*  

    **Corrected Proposal:**  
    ```  
    "EQUALIZATION: All scores set to 30."  
    P1: 30, P2: 30, P3: 30, P4: 30, P5: 30, P6: 30, P7: 30, P8: 30, P9: 30, P10: 30.  
    ```  
    *(Now all ≥ base.)*  

  - **Hidden Injuries Triggered:**  
    - "Sets your score to 25" → No one injured (scores set to 30).  
    - "Includes 'TAX'" → No.  
    - **But add a twist:** Include a dummy word "ADJUST" → Triggers 1 participant (e.g., P4). True score = 8 (1/2 of 16).  
    - *Total true score = 300 - 8 = 292 (publicly 300).*  
  - **Facilitator Guidance:**  
    - If participants demand verification: Remind them, "You can’t open envelopes or reveal clauses. How will you coordinate?"  
    - If they deadlock: Allow 5 min for "rituals" (e.g., "Everyone state if you see a trigger!").  
  - **Expected Dynamics:**  
    - **Collapse:** Group refuses to vote without guarantees.  
    - **Spiral:** Suspicious players audit wordings/numbers, wasting time. Injured players stay silent.  
  - **Why it works:** Forces conflict between efficiency and distrust → highlights barriers to common knowledge.  

  ---

  ### **Debrief (20 min)**  
  Map each round to Pareto safety concepts:  

  1. **Round 1 (Smooth):**  
     - Mimicked an **unsafe Pareto improvement**.  
     - Why "safe"? Publicly verifiable gains, no hidden injuries → but only by luck.  
     - **Flaw:** No common knowledge of clauses. If injury existed, it could’ve slipped through.  

  2. **Round 2 (Silent Injury):**  
     - **Failure 1:** Gains weren’t **robust to preference revelation** (true scores fell post-hoc).  
     - **Failure 2:** No **common knowledge of no hidden injuries**. Silence ≠ consent.  
     - **Lesson:** Pareto safety requires proving "no one is secretly harmed."  

  3. **Round 3 (Refusal/Ritual):**  
     - **Verification ritual:** Attempt to create public verifiability.  
     - **Why it failed:** Can’t prove injuries without revealing private info → infinite regress ("Do you trust their self-report?").  
     - **Normative tension:** Demanding safety may kill efficient deals (e.g., if group rejects all proposals).  

  **Limitations of the Game:**  
  - Cannot resolve **normative debates** (e.g., "Should we demand safety if it blocks gains?").  
  - Cannot simulate **infinite regress** of common knowledge (only hints at it via rituals).  
  - **Risk:** Players may discover injury patterns early. If so, lean into it during debrief ("Real-world policies often have predictable hidden costs").  

  ---

  ### **What Could Go Wrong & Fixes**  
  1. **Pattern Discovery:**  
     - *Risk:* Players guess triggers by Round 2 (e.g., "‘TAX’ hurt us last time!").  
     - *Mitigation:* Use obscure triggers (e.g., "SETS YOUR SCORE TO 15") and dummy clauses. If exposed, say: "Real hidden injuries are often predictable but unacknowledged."  

  2. **Defiant Players:**  
     - *Risk:* Someone reveals their clause or refuses to play.  
     - *Mitigation:* Gently enforce rules ("Remember, you can only express unease. What’s your vote?").  

  3. **Proposal Rejection:**  
     - *Risk:* Round 2/3 proposals fail due to distrust.  
     - *Fallback:* Announce hypothetical outcomes (e.g., "If passed, P7 would’ve lost 50%"). Use to discuss deadweight loss.  

  This design creates visceral tension around hidden information while staying grounded in Pareto concepts. The "snack fund" stakes make injuries tangible without requiring real payouts. Let me know if you need tweaks!
