  2. [If interactive kinds] Does the looping effect corrupt the category's descriptive accuracy by distorting the original phenomena, or does it help constitute the very kind being tracked as part of its identity? (This distinguishes views where looping undermines validity from those where it defines the kind.)  

  3. [If interactive kinds and uniform/after constitution/corruption] What should clinical practice prioritize: revise the category iteratively to track changes, preserve it unchanged for therapeutic stability, or abandon it due to unreliability? (This captures pragmatic, conservative, or eliminativist responses.)  

  4. [If interactive kinds] Does looping apply uniformly across all psychiatric categories (e.g., equally to depression and schizophrenia) or only selectively (e.g., primarily to personality disorders)? (This differentiates universalism from context-specific views.)  

  5. The tree separates all leaves:  
     - **Indifferent-kind realism** (item1: no)  
     - **Loop-corruption eliminativism** (item1: yes, item2: corrupts, item3: abandon, item4: uniform)  
     - **Loop-constitution revisionism** (item1: yes, item2: constitutes, item3: revise, item4: uniform)  
     - **Pragmatic stability conservatism** (item1: yes, item3: preserve, item4: uniform)  
     - **Selective loop-acceptance** (item1: yes, item4: selectively)  
     The combination *uniform looping that constitutes the kind yet leads to abandonment* (yes to item1, uniform, constitutes, abandon) is unoccupied; this gap is unstable because abandoning a category that constitutively depends on its use severs the feedback loop sustaining the kind.
