  *What serves the system now must be extolled*.

  Did purpose shift, or was new use foretold
  When bone found novel work in hearing's light?
  The hammer stirs because *what was selected for persists as mould*.

  Or is its worth in currents it can hold,
  This tiny bridge amplifying flight?
  *What serves the system now must be extolled*.

  Two truths reside where ossicles unfold:
