answer: |-
  Good morning. I’m honored to open this workshop, "Maintenance as Moral Practice." We’re here because we suspect something vital is being missed – something about the labor that keeps our cities, our institutions, and our lives from falling apart. Not the dramatic rescues or the dazzling innovations, but the quiet, continual work: clearing a storm drain before the rain hits, adjusting medication for a patient day after day, meticulously preserving fragile historical records.  

  This workshop brings together two worlds – those who think deeply about ethics and care, and those who *do* the tangible work of keeping our shared world functioning. Why? Because we believe this low-visibility work isn’t just *necessary*; it’s fundamentally *ethical*. It’s not merely the background noise before the heroic solo; it is the essential, constant rhythm of a functioning society.  

  So, let’s be clear about what this perspective, rooted in care ethics, demands of us right now:  

  1.  **Whose Labor Counts?:** Care ethics insists we start by seeing the *people* doing the work – the sewer inspector navigating the dark, the home health aide managing complex routines, the archivist handling brittle paper. Their knowledge, their judgment, their daily commitment – this isn’t "just a job." It's a practice demanding skill, attention, and often, profound patience. Recognizing this labor as morally significant means we *cannot* relegate it to an invisible footnote in the story of human progress. It *is* the story.  
  2.  **Beyond "Unsung Heroes":** We’re not here to offer a standing ovation for "unsung heroes" and then move on. That sentimentality risks reinforcing the very invisibility we’re challenging. Care ethics pushes us further. It asks: *Why* is this work unseen? *Why* is it undervalued – often in pay, status, and resources? Praising invisibility doesn’t challenge the structures that create it. We need to examine those structures.  
  3.  **Care vs. Service Delivery:** This is crucial, and we must be precise. "Service delivery" implies a transaction: a predefined task, completed efficiently, to a standard. A pipe is unclogged. A pill is dispensed. A record is stored. Done. But **care**, as we understand it here, is different. It’s relational and responsive. It asks: *What does this specific situation, this specific pipe, this specific person, this specific document, need **now** to thrive or simply endure?* It requires ongoing attention, adaptation, and an understanding that systems decay, bodies change, and contexts shift. The sewer worker doesn’t just fix breaks; they *know* the system’s weak points. The nurse doesn’t just administer meds; they *sense* subtle shifts in a patient's condition. The archivist doesn’t just store boxes; they *anticipate* threats to fragile materials. Care is about sustained, attentive *response* to vulnerability and need, not just the execution of a pre-set task.  

  This brings us to the core structural reality: **Dependency.** We often think of dependency as a problem to solve, a temporary state of failure – the broken pipe, the sick patient, the decaying document. But care ethics insists dependency is not an aberration; it is the *permanent condition* of any living, built, or social system. Everything we build, every body we inhabit, every institution we create, relies on constant upkeep. Things break down. Needs persist. We are *all*, always, dependent on networks of care – infrastructures of pipes, wires, relationships, and knowledge – maintained by others.  

  Ignoring this dependency, or treating maintenance as merely "fixing failures," blinds us to the profound ethical practice happening right now, beneath our feet, in quiet rooms, in meticulous routines. It’s the practice of recognizing inherent fragility and choosing, day after day, to engage with it attentively and skillfully.  

  So, over these next days, let’s hold these constraints firmly:  
  *   We center the *laborers* and their specific, skilled practices.  
  *   We reject easy sentimentality and demand a hard look at *why* this work is marginalized.  
  *   We rigorously distinguish responsive, relational *care* from transactional *service*.  
  *   And we start from the undeniable truth: **Dependency is permanent. Maintenance is the ongoing, ethical response to that reality.**  

  This isn’t just about valuing work differently. It’s about recognizing that the *practice* of maintenance – in our pipes, our care systems, our archives – *is* the practice of building a world that acknowledges our fundamental interdependence. That’s the conversation we begin today. Let’s get to work. Thank you.
