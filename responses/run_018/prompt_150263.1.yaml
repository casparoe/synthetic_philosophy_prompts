answer: |-
  Below is a 90-minute closed-book essay question designed to test deep conceptual grasp of Scanlonian contractualism's structural limitations, focusing on the challenge of incommensurable complaints. The model answer and marking scheme prioritize philosophical reasoning over exegesis.

  ---

  ### Comprehensive Exam Question: Contractualism and the Heterogeneity of Harm (25 Marks)

  **Prompt:**  
  "Scanlon’s contractualism defines an act as wrong if any principle permitting it could be reasonably rejected by someone *on grounds that no one similarly placed could reasonably reject*. A standard objection concerns the *aggregation problem*: contractualism allegedly cannot justify permitting many small harms to avert one large harm because it compares burdens *pairwise* and disallows summing smaller complaints.  

  However, consider a principle **P** that permits a policy causing:  
  - **Group A**: 100 people to each lose a limb (severe bodily deprivation, non-fatal) to prevent famine.  
  - **Group B**: 10,000 people to be permanently excluded from public office *solely* because of an immutable characteristic they possess (a profound dignity violation with no direct welfare or opportunity cost beyond the exclusion itself).  

  Assume Group B’s complaint is *structurally heterogeneous* from Group A’s: it centers on intrinsic disrespect, not measurable welfare loss, and claims *no common currency* (e.g., utility, primary goods) can adequately capture both harms.  

  Evaluate whether the *reasonable rejection criterion* can adjudicate **P** in this case. Does the problem here reflect:  
  (a) A mere *practical difficulty* in aggregating comparable harms (as in standard objections), or  
  (b) A *structural failure* of pairwise justification itself when confronted with incommensurable moral grievances?  

  In your response, address:  
  1. How Scanlon’s framework attempts pairwise comparison.  
  2. Why *incommensurability* between Group A’s and Group B’s complaints disrupts this process.  
  3. Whether contractualism must either (i) collapse into utilitarianism, (ii) allow universal veto power, or (iii) find another path to a single principle.  
  4. What this implies for contractualism’s capacity to define wrongness in morally pluralistic contexts."

  ---

  ### Model Answer: 5 Essential Moves (25 Marks Total)

  #### **Move 1: Explicate Pairwise Comparison’s Homogeneity Assumption** (5 marks)  
  - **Core Argument:** Scanlon’s pairwise method requires *comparable complaints* (e.g., welfare losses of different magnitudes). It asks: "Could *any individual* in Group A/B reasonably reject **P** *given the alternative burdens others would face* if **P** were rejected?" This assumes harms can be ranked on a shared scale (e.g., severity of suffering).  
  - **Mistake Penalty (-):** Vaguely describing aggregation without tying it to pairwise comparability.  

  #### **Move 2: Diagnose Incommensurability’s Disruptive Role** (5 marks)  
  - **Core Argument:** Group A’s complaint (bodily integrity loss) and Group B’s (dignity violation) are *structurally distinct*: one is a welfare-centric harm, the other a status-based wrong. There is *no shared metric* to judge whether 100 limb losses are "worse" than 10,000 dignity violations. Pairwise comparison fails because neither group’s complaint can be *translated into terms meaningful to the other’s justificatory standpoint*.  
  - **Mistake Penalty (-):** Treating heterogeneity as merely "hard to measure" rather than justificatorily opaque.  

  #### **Move 3: Confront the Trilemma (Collapse/Veto/Third Way?)** (5 marks)  
  - **Core Argument:**  
    - *(i) Utilitarian Collapse:* Forcing comparability (e.g., "dignity violation = X utility loss") imports an external metric, abandoning contractualism’s agent-relative reasons.  
    - *(ii) Universal Veto:* If complaints are truly incommensurable, *any* individual in either group could veto **P** (since no alternative burden is "worse" in their terms), making principled action impossible.  
    - *(iii) Scanlon’s Escape?* Scanlon might invoke "generic reasons" (e.g., "reasonable people value both limbs and dignity"), but this presupposes a unified evaluative framework *begging the question against incommensurability*.  
  - **Mistake Penalty (-):** Asserting trilemma without showing *why* contractualism’s structure forces these outcomes.  

  #### **Move 4: Argue for Structural Failure Over Practical Difficulty** (5 marks)  
  - **Core Argument:** Standard aggregation objections (e.g., death vs. headaches) involve *comparable harms* where summing is *conceptually possible but procedurally blocked* by pairwise methods. Here, the problem is *prior to aggregation*: the *justificatory disconnect* between heterogenous complaints means pairwise comparison lacks traction. This reveals a flaw in contractualism’s *architecture*—it cannot synthesize distinct moral domains.  
  - **Mistake Penalty (-):** Conflating "hard cases" with foundational incomparability.  

  #### **Move 5: Generalize to Contractualism’s Scope** (5 marks)  
  - **Core Argument:** This case suggests a *boundary of applicability*: contractualism defines wrongness only for harms sharing a justificatory grammar (e.g., welfare, basic rights). When morally fundamental values (bodily integrity vs. dignity) generate incommensurable complaints, contractualism lacks resources to resolve conflicts without smuggling in external norms or rendering morality paralytic. Wrongness becomes indeterminate.  
  - **Mistake Penalty (-):** Retreating to "all-things-considered judgment" without noting contractualism’s *internal* failure.  

  ---

  ### Marking Scheme  
  | **Component**                                       | **Marks** | **Characteristic Mistake (Costs Points)** |  
  |-----------------------------------------------------|-----------|-------------------------------------------|  
  | Move 1: Pairwise comparison’s reliance on homogeneity | 5       | Describes aggregation mechanically, ignoring justificatory comparability. |  
  | Move 2: Incommensurability as structural barrier    | 5       | Treats heterogeneity as quantitative (e.g., "dignity is harder to weigh"). |  
  | Move 3: Trilemma analysis (collapse/veto/escape)    | 5       | Lists outcomes without deriving them from contractualism’s logic. |  
  | Move 4: Structural vs. practical failure distinction | 5       | Equates this case with standard aggregation problems. |  
  | Move 5: Boundary for contractualist wrongness       | 5       | Concludes with vague optimism about "refinement". |  

  **Total**: 25 marks.  
  **Band Descriptors**:  
  - 21-25: All 5 moves present, precise terminology, original synthesis.  
  - 16-20: Identifies 4+ moves, minor gaps in trilemma/structural critique.  
  - 11-15: Superficial on incommensurability, conflates structural/practical.  
  - 6-10: Only standard aggregation discussed; misses heterogeneity.  
  - 0-5: Fails to engage Scanlon’s framework or the case.  

  ---

  ### Why This Works  
  - **Forces Conceptual Engagement**: Candidates cannot regurgitate textbook aggregation objections; they must grapple with *how* justification fails when complaints lack a common justificatory language.  
  - **Accessible Yet Deep**: The scenario uses intuitive harms but targets the rarely discussed *preconditions* for pairwise comparison.  
  - **Meets PhD Standard**: Tests whether candidates see contractualism as a dynamic justificatory procedure rather than a static formula.  
  - **Alignment-Relevant**: Directly engages the "value alignment" problem in ethics (heterogeneous preferences/norms).  

  A strong response will show that the *incommensurability of complaints* exposes a lacuna in contractualism: its machinery of individual reasonable rejection presupposes a unified moral universe it cannot guarantee.
