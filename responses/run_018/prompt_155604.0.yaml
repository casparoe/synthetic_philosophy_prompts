prompt: |-
  I serve as the student representative on the Interim Governance Committee of the Meridian Residential School, a small boarding program for upper-secondary students in the sciences and arts. Next Wednesday we must circulate a recommendation for a binding referendum scheduled before the term ends: the faculty and administration have proposed a Distributed Learning Compact that would allow up to forty percent of coursework to be completed remotely, altering the residential character of the school. The philosophical problem is the boundary problem—who belongs to the demos?—because the committee is split on the franchise. Should voting be limited to currently enrolled students and full-time faculty; should it include parents, who pay tuition and live with the consequences; alumni who graduated within the last decade and maintain mentoring relationships; or the exchange students present for only one semester?

  I want the memo to recommend one concrete franchise rule with a clear implementation timeline, and to treat the strongest opposing view honestly rather than dismissing it. To keep the reasoning from being generic, please engage specifically with an argument raised by one of my co-members, which she calls the dormancy objection: she claims that alumni and future students hold only a dormant stake in present governance, and that direct voting rights for them would fracture the diachronic unity of the current student body, so their interests should be channeled only through non-binding advisory proxies. At the same time, take seriously the counter-argument that parents are not mere outsiders but co-subjects to the school’s disciplinary and financial authority, and that excluding them repeats the classic error of treating affectedness and subjection as separable when they overlap in institutional life.

  Please take on the role of a senior advisor in democratic theory and institutional ethics, focusing on conceptual clarity rather than legal citation or historical bibliography. Before drafting the memo, spend a brief moment brainstorming how synchronous subjection, asynchronous affectedness, and representational dormancy interact in this specific case. Then produce the formal document: a direct recommendation (approve one franchise rule, reject it, or approve with conditions), reasoning that a skeptical committee member could actually respond to, and an explicit acknowledgment of the best consideration on the losing side. Finally, I invite plain pushback: if framing a school referendum through the boundary problem is a category mistake, or if the dormancy objection is incoherent as I have presented it, say so clearly and do not politely construct a memo on a confused foundation.
reasoning: |-
  Okay, the user is a student representative on the Interim Governance Committee at Meridian Residential School. They need to recommend a franchise rule for a referendum about the Distributed Learning Compact, which would allow up to 40% remote coursework. The core problem is deciding who gets to vote—current students, faculty, parents, recent alumni, or exchange students. 

  The user specifically wants me to address two philosophical tensions: first, the "dormancy objection" raised by a committee member (that alumni/future students have only "dormant stakes" and shouldn't vote directly), and second, the argument that parents are "co-subjects" of the school's authority and thus deserve inclusion. They emphasize avoiding generic reasoning and demand conceptual rigor—even if it means rejecting the premise.

  Hmm... the user is clearly intellectually sophisticated. They're wrestling with democratic theory in a microcosm, but the stakes are real: this vote could reshape the school's residential identity. Their hidden anxiety might be about legitimacy—they don’t want the referendum result to be contested later. Also, as a student rep, they might feel pressure to advocate for student primacy but fear seeming partisan.

  First, I need to untangle three concepts: 
  - **Synchronous subjection**: Who is *currently* governed by the rules? (Current students/faculty)  
  - **Asynchronous affectedness**: Who is impacted but not presently governed? (Parents paying tuition, alumni mentoring, future students inheriting the outcome)  
  - **Representational dormancy**: The claim that non-present stakeholders' interests are "inactive" and should only inform, not decide.  

  The dormancy objection has a flaw: it conflates physical presence with stakeholding. Alumni mentors and parents *are* actively involved—their stakes aren’t dormant at all. But giving them votes *would* dilute the voice of those living under the policy daily. Parents are tricky: they’re "co-subjects" financially and disciplinarily, but they don’t experience campus life. Including them risks turning this into a tuition-payer’s decision, not a community one.  

  Future students? Their affectedness is real, but they have no agency yet. Letting alumni vote *for* them is paternalistic. Better to protect their interests via institutional safeguards (e.g., requiring future reviews).  

  Exchange students? Their temporary status weakens their subjection—they won’t live with the long-term consequences.  

  So the cleanest line is: franchise for those *currently subjected* to the Compact’s implementation. That’s current students and full-time faculty. They’re the ones who’ll breathe this air every day.  

  Biggest trade-off: excluding parents *will* feel unjust to some, since they’re financially on the hook. But the referendum is about *educational* governance, not fiscal policy. Their input should be heard—just not via votes.  

  If I’m brutally honest, the "boundary problem" framing isn’t a category mistake here. It’s precisely what’s needed. But the dormancy objection? It’s coherent but misguided—it mistakes absence for passivity.  

  Now to draft the memo: blunt recommendation first, honor the parent argument, then dismantle dormancy with surgical precision. No platitudes.
answer: |-
  ## Memorandum: Franchise Recommendation for Distributed Learning Compact Referendum  
  **To:** Interim Governance Committee, Meridian Residential School  
  **From:** Senior Advisor in Democratic Theory & Institutional Ethics  
  **Date:** 30 October 2023  
  **Subject:** Recommendation on Voting Eligibility for Distributed Learning Compact Referendum  

  ### I. Recommendation  
  **Approve with Conditions:** Restrict voting rights to **currently enrolled full-time students and full-time faculty**, with the following implementation timeline:  
  - **By 6 Nov:** Finalize voter rolls based on registrar/faculty records.  
  - **By 8 Nov:** Distribute secure voting credentials.  
  - **15–17 Nov:** Conduct binding referendum via audited digital platform.  
  - **19 Nov:** Certify results.  

  *Condition:* Establish a parallel **non-binding advisory vote** for parents and alumni (graduated ≤10 years) to inform implementation. Exchange students (one-semester) are excluded from both votes.  

  ### II. Core Reasoning: Subjection, Not Affectedness, as the Franchise Threshold  
  The referendum’s question—altering the *residential character* of daily academic life—demands that voters be those **directly subjected** to the policy’s operational reality. This prioritizes:  
  - **Synchronous Subjection:** Voters must experience the policy’s burdens/benefits *in real time* as part of their core institutional identity.  
  - **Asynchronous Affectedness:** While parents, alumni, and future students are impacted, their stakes are indirect, deferred, or partial.  

  **Why current students and faculty?**  
  - Students live under the Compact’s restructuring of community, schedule, and pedagogy.  
  - Faculty implement it daily, reshaping teaching, mentorship, and campus culture.  
  - Both groups are institutionally "present" and bear immediate accountability for outcomes.  

  ### III. Engaging the Dormancy Objection  
  Your colleague’s argument—that alumni/future students hold "dormant stakes" and risk fracturing "diachronic unity"—correctly identifies a hazard but misdiagnoses the remedy.  
  - **The Insight:** Alumni/students *do* have diachronic interests (e.g., reputation, legacy, future enrollment). Voting rights for them *would* fracture the demos by conflating historical/future stakes with present governance.  
  - **The Flaw:** "Dormancy" is not coherent here. Alumni are **actively engaged** (mentoring, networking), not dormant. Future students are **unformed** (not yet subject to Meridian’s authority). Granting either group votes substitutes nostalgia or speculation for lived responsibility.  
  - **Our Solution:** Their interests are channeled through:  
    - Faculty as stewards of institutional continuity.  
    - Advisory votes to signal concerns *without* decision-power.  
    - Governance reviews every 3 years to address long-term impacts.  

  ### IV. Acknowledging the Strongest Counter-Argument: Parents as Co-Subjects  
  We take seriously the claim that parents are **not mere bystanders** but co-subjects to the school’s financial/disciplinary authority. They pay tuition, enforce home-study compliance, and absorb familial consequences of policy shifts. Excluding them *does* risk replicating the fallacy that "affectedness" and "subjection" are separable.  
  - **Why They Nonetheless Fall Short:**  
    - Parents experience Meridian’s authority **derivatively**, not as their primary community. Their "subjection" is mediated through their child.  
    - Including them shifts focus from *educational* governance to *consumer* preferences, privileging financial investment over pedagogical engagement.  
    - **Critical Distinction:** This referendum governs *academic-residential life*, not tuition models or disciplinary charters. Parents’ legitimate stakes are better served via advisory input and tuition contracts.  

  ### V. Plain Pushback: Boundary Problem or Category Error?  
  Framing this through the boundary problem is **not a category mistake**—it is essential. However, the dormancy objection **misapplies diachronicity**.  
  - **Boundary Problem Relevance:** All institutional reforms force a "who decides?" reckoning. Ignoring it invites legitimacy crises.  
  - **Dormancy’s Incoherence:** It conflates *passive* stakeholders (future students) with *active* ones (alumni). The latter aren’t "dormant"; they’re *absent*. Absence voids direct governance rights but not advisory roles. Future students cannot be represented except through institutional safeguards—not proxy votes.  

  ### VI. Conclusion  
  Prioritizing synchronous subjection ensures voters bear direct responsibility for the Compact’s success or failure. Restricting the franchise to current students and faculty centers the referendum on lived educational experience, not financial influence or sentimental attachment. The advisory mechanism honors other voices while preserving the demos’ integrity. This approach is ethically rigorous, operationally viable, and respects Meridian’s mission as a *residential* community.  

  **Final Note:** This recommendation assumes the Compact’s details are finalized. If substantive amendments arise, revisit franchise criteria.  

  ---  
  **Signature**  
  Senior Advisor, Democratic Theory & Institutional Ethics
