  ## A Toast to Dr. Alistair Fenwick: Thirty Years of Listening to the Crowd

  [Raise glass, warm smile]

  Good evening, everyone. What a sight! Seeing colleagues from the sharp end of statistics, dear friends and family, esteemed academics, and local faces all gathered here – it truly reflects the remarkable breadth of Alistair’s world. Tonight, we celebrate not just thirty years of dedicated service, but the unique brilliance of a man who spent his career listening *very carefully* to the unexpected wisdom of the crowd.

  For three decades, Alistair directed our Sampling Methodology Unit. To many here, that might sound like a world of spreadsheets and stratified quotas. And yes, there was plenty of that! [Gentle chuckle] He wrestled with postcodes, population pyramids, and the eternal quest for that elusive thing: the *truly* representative sample. His teams, many of whom are here tonight, know better than anyone the meticulous craft required to ensure our national picture wasn’t just a snapshot of the loudest voices, but a reflection of everyone.

  But Alistair’s curiosity never stopped at the statistical horizon. In these last few years, he turned that formidable intellect to a different kind of sampling: citizens' assemblies. Now, for those of us less immersed in the finer points of democratic theory, imagine bringing together a group of ordinary people, chosen entirely by lot – like a jury, but for complex policy questions. It’s an idea that sparks fierce debate amongst our academic friends present.

  Some argue these assemblies must be a perfect demographic mirror – a miniature Britain in every sense. Others believe the crucial thing is gathering a wide *spread* of practical knowledge and life experience, even if the exact percentages don't match the census. It’s a fascinating tension.

  Where does Alistair stand? Well, he’d be the first to tell you he hasn’t suddenly become an evangelist for handing over Parliament to a rotating cast of lottery winners! He remains, at heart, a pragmatic statistician. But his work, his deep dive into how people *actually* deliberate when brought together randomly, led him to a powerful and deeply important insight – one that feels like the culmination of his life’s work.

  What Alistair observed, time and again, wasn’t that experts were *wrong*. Goodness knows, we need expertise! The problem he identified was more subtle, and perhaps more profound. He saw how networks of specialists, however brilliant, tend to talk amongst themselves. They develop shared assumptions, shared blind spots – a kind of intellectual ‘groupthink’ born of similarity. Alistair calls it ‘homophily’ – a fancy word for birds of a feather flocking together.

  And this, he realised, is where the magic of *properly structured* random selection comes in. When you bring together people – not as demographic checkboxes, but as individuals selected randomly *within* carefully defined groups to ensure diversity of background – something remarkable happens. They aren't bound by the same professional echo chambers. They bring radically different perspectives, different kinds of knowledge – the school run, the shop floor, the allotment, the care home.

  What emerges from this mix, under careful facilitation, isn’t chaos, but a unique form of **collective cognition**. Solutions, perspectives, priorities surface that simply wouldn't occur within even the most well-meaning expert group. It’s not that the experts are foolish; it’s that their shared world view inevitably misses corners that others, from different walks of life, illuminate instantly.

  This, for Alistair, is the vital contribution of the citizens' assembly model he advised on. It’s not about replacing expertise, but about *complementing* it. It’s about creating a space where the ‘correlated blind spots’ of any closed group – even the most qualified – can be revealed and filled by the distributed wisdom of the wider public, brought together without agenda or pre-selection for influence.

  So, when we look back on Alistair’s career, we see a brilliant mind who started by ensuring our statistics heard *everyone*, and ended by championing forums where *everyone* could truly be heard in a different, vital way. He wasn’t chasing a pure lottery-based utopia, nor was he defending an ivory tower of unchecked technocracy. He was, characteristically, carving out a crucial middle ground: demonstrating with rigorous intellect that structured randomness isn't just fair, it’s *smart*. It reveals truths that merit alone can sometimes obscure.

  Alistair, your legacy isn’t just in the methodologies you perfected or the assemblies you shaped. It’s in this profound understanding: that true wisdom, especially for a complex society, often resides not just in the concentrated expertise of the few, but in the surprising, emergent intelligence of the many, when given the right structure and the chance to speak.

  You’ve been a mentor, a colleague of unwavering integrity, and, I suspect for your wonderful family, occasionally a source of bemused fascination as you explained stratified sampling over Sunday roast! [Warm laughter] We will miss your sharp mind, your dry wit, and your relentless curiosity. But the principles you championed – of listening widely, of designing ways for diverse voices to genuinely contribute – will continue to shape how we understand our society and ourselves.

  So, ladies and gentlemen, family, friends, colleagues, theorists, and practitioners… please join me in raising a glass:

  **To Dr. Alistair Fenwick! Thirty years of ensuring everyone had a seat at the table, and proving that sometimes, the most unexpected voice holds the missing piece of the puzzle. May your retirement be filled with stimulating conversations, well-deserved rest, and the simple joy of never having to worry about response rates again! Cheers!**

