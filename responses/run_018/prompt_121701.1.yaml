  Each crux needs concrete cases and predictions. For near-miss, use the 5.0 vs. 5.1 and 5.0 vs. 50 examples. For grue, use a grue-like predicate switch. Padding involves adding a true but irrelevant claim. Cross-domain compares different fields.

