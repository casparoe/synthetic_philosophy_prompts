answer: |-
  Leaning back in his chair, forensic accountant Elias Chen surveyed the avalanche of disordered spreadsheets, contradictory interdepartmental memos, and receipts fluctuating with obscure currency adjustments. The multinational's records were a labyrinth where every trail of missing funds forked: one path led inevitably to systematic fraud, the other dissolved into an equally plausible swamp of misfiled invoices, incompatible legacy systems, and cascading human error. Each hypothesis neatly absorbed the anomalies through auxiliary adjustments to filing protocols or assumed bad faith. Facing the client's demand for a single, definitive "Systematic Fraud: Yes/No" checkbox on his report, Elias sighed. The holistic testing was complete; the explanations were empirically indistinguishable. Logic offered only symmetry. He picked up his pen, checked "Yes," and filed the report. The box needed ticking.
