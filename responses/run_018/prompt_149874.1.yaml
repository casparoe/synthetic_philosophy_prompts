answer: |-
  You've landed on a profound and deeply personal tension that *Amadeus* masterfully exploits *and* interrogates. Your concept of "epistemic vulnerability of the dead" is incredibly potent here. Let's break down specific scenes where the film leans into this vulnerability for dramatic effect, and where it subtly (or not-so-subtly) pushes back, acknowledging the dead *do* still matter, even if art reshapes them.

  **Where the Film Exploits Epistemic Vulnerability:**

  1.  **Salieri's Confession (Opening & Throughout):** This is the foundation. The *entire film* is Salieri's dying narrative to a priest (and by extension, us). He crafts himself as the bitter, vengeful villain thwarted by God. He remakes Mozart into the divinely inspired, obscene child. **Why it exploits vulnerability:** He speaks for the dead Mozart, assigning him motivations ("God's instrument"), interpreting his genius as divinely cruel mockery, and defining his character solely through vulgarity and brilliance. Mozart has no voice here. Salieri locks *both* of them into archetypes: the bitter mediocrity and the divinely touched fool. This is pure narrative control over the dead.

  2.  **Mozart's Giggles & Vulgarity (Constant, e.g., Playing Billiards, Rehearsals):** The film relentlessly emphasizes Mozart's childishness, scatological humor, and social ineptitude. **Why it exploits vulnerability:** It reduces a complex historical figure to a single, exaggerated trait for dramatic contrast and (dark) comedy. The real Mozart *was* complex – capable of deep sentiment and profound letters alongside vulgarity. The film trades nuance for the powerful, easily digestible image of "divine idiot." He becomes a tool for Salieri's torment and audience fascination, not a fully realized person.

  3.  **The "Murder" Implication (Deathbed Scene):** Salieri's presence at Mozart's deathbed, pressuring him to work on the Requiem, directly implies (through Salieri's narration) that he psychologically tortured Mozart to death. **Why it exploits vulnerability:** This is the most direct act of narrative violence. It takes a tragic, historically murky death (illness, likely rheumatic fever) and reshapes it into a gothic tale of murder by envy, forever cementing Salieri as the villain in popular imagination. The dead Mozart is powerless against this accusation; the dead Salieri is locked into the role of murderer-by-proxy.

  **Where the Film Pushes Back & Suggests the Dead Still Matter:**

  1.  **The Music Itself:** This is the film's most powerful rebuttal. **Where it pushes back:** Regardless of the caricatures, the film forces us to *hear* Mozart's actual music. We experience the awe of the Serenade for Winds, the complexity of the operas, the terror of the Requiem. This isn't Salieri's interpretation or Forman's invention; it's *Mozart*. The music transcends the narrative framing. It asserts Mozart's undeniable, irreducible genius and humanity. The dead speak through their actual work, resisting complete fictionalization.

  2.  **Mozart's Moments of Profound Humanity:**
      *   **Dictating the Requiem:** Amidst the horror, Mozart's absolute focus, his desperate need to *finish*, his raw talent translating sound directly to paper – this isn't just the giggling idiot. We see the agonized artist, the vulnerable human facing death, the profound creator. Salieri is reduced to a scribe witnessing something far beyond his own bitterness.
      *   **Composing in the Tavern:** The scene where he composes amidst the noise, vomiting but utterly absorbed. It shows the *work*, the messy, human effort behind the divine inspiration. It complicates the simple "God's instrument" idea.
      *   **His Love for Constanze (Despite Flaws):** His genuine, if flawed, devotion peeks through, especially during the financial struggles and his decline. It reminds us he wasn't *just* a caricature.

  3.  **Salieri's Final Scene ("Mediocrities"):** Salieri absolves the "mediocrities" of the world, casting himself as their martyr/patron saint. **Why it pushes back against the theory:** This is crucial. The film *ends* by acknowledging that Salieri's entire narrative is *his own constructed myth*. He's actively choosing how he will be remembered, even in infamy. He rejects simple forgiveness and embraces his self-crafted role. It highlights that the narrative we've witnessed is *one version*, deliberately shaped by Salieri for posterity. It doesn't absolve the film of exploiting the dead Mozart, but it exposes the constructed nature of Salieri's villainy *as a construction*. It admits art rewrites, but suggests the rewrite itself (Salieri's confession) is a complex act of self-definition by the dying man.

  4.  **The Priest's Reaction:** The young priest is initially horrified by Salieri's story and his self-condemnation. **Why it pushes back:** He represents the audience's potential moral discomfort. His presence subtly asks: *Is this right? Should we believe this? Is this how we should remember them?* He doesn't offer easy answers, but his discomfort serves as a small counterweight to Salieri's total narrative control.

  **The Verdict for Your Discussion:**

  *   **Yes, the film absolutely exploits epistemic vulnerability:** It uses Salieri's narration to ruthlessly reshape both men into powerful archetypes for maximum tragic/ironic effect, knowing they cannot defend themselves. The giggling Mozart and the seething, murderous Salieri are potent *fictions* built on graves.
  *   **But, the film is also deeply *about* this process:** Salieri's entire act is *creating* this narrative for the future. The film doesn't hide this; it makes it the core mechanism. By ending with Salieri embracing his self-made myth, the film acknowledges the power and danger of storytelling over the dead.
  *   **The music and moments of humanity are the resistance:** Mozart's actual genius, heard and felt, and his flashes of profound human struggle and love, push back against the caricature. They are irreducible artifacts of the real person that the narrative cannot fully erase.
  *   **The pushback isn't moral absolution, but complexity:** The film doesn't say it's *okay* to do this. It shows it happening, explores *why* someone (Salieri) would do it (envy, despair, a desire for lasting meaning, even in infamy), and forces us to confront the uncomfortable power we hold over the dead through story. The priest's discomfort is ours.

  **For your group:** Frame it as a brilliant, self-aware exploitation. *Amadeus* uses the vulnerability of the dead to create its tragedy but simultaneously exposes that very act through Salieri's conscious self-mythologizing and the undeniable power of Mozart's real music. It shows the harm (locking them into false identities) but also suggests that art, even when distorting, can be a desperate attempt by the living (like Salieri) to grapple with meaning, legacy, and their own relationship to genius and mortality – themes deeply resonant with your experience of your grandmother's obituary. The dead *do* matter, which is precisely why reshaping them is so powerful, so tempting, and so ethically fraught. The film lives squarely in that fraught space.
