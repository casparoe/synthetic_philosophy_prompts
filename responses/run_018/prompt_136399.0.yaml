prompt: |-
  hey, i'm trying to nail down what a theory of rational deference to objective chance actually has to deliever — not just the principal principle in isolation but the whole framework around it. i want the full desiderata specifcation: what any adequate view must be able to do, which cases it has to get right, which puzzles it must dissolve or at least explain, which distinctions it cant collapse, with the motivating case behind each one. flag any pair of desiderata you think are probably jointly unsatisfiable.

  must-cover cases: (1) basic alignment — you learn teh physical chance of an event is 0.7 and your credence should track it. (2) Humphreys-style undermining — learning the chance-value depends on your own belief in a way that seems to break direct deference. (3) mediated expert deference — you take a scientist's reported chance but have reason to think their measurement setup was misapplied, so you're deferring to a mechanism you partly distrust. (4) the copy-room twist i'm injecting: a fair coin is flipped in room A, the result is copied into room B with a one-hour delay. you know you're in one of the two rooms but not which. the physical chance of heads in room A was 0.5, but for your display in room B its either already determined or copied. the theory needs a principled answer about whether PP applies to your credence about your own room's display, without just saying "it depends on self-location."

  distinctions that must survive: between deferring to a chance-value and deferring to a chance-generating mechanism; between physical indeterminancy and indexical ignorance about which branch you're in; between having moral/status weight and having a specific quantitative weight (borrowed from other domains but applies here).

  say which are non-negotiable and which are camp-specific preferences — e.g., whether the view has to preserve determinism, allow belief-dependent chances, or stay empirically equivalent to textbook quantum mechanics in the statistical limit.

  then, briefly, score how orthodox PP, a revisionist "halfway" view that lets credences influence which chance law applies, and a flat rejection of objective chance do against your list. keep teh scoring short — the list is the deliverable.

  no citations, no reading lists, just the conceptual spec. write casual, typo or two is fine.
reasoning: |-
  We are building a desiderata specification for a theory of rational deference to objective chance. The goal is to list what any adequate view must deliver, covering specific cases, distinctions, and theoretical constraints. We'll also flag any potentially jointly unsatisfiable desiderata and briefly score existing approaches.

  ### Core Desiderata (Must-Deliver)

  1. **Basic Alignment (Principal Principle Core):**  
     - *What it must do:* If an agent learns that the physical chance of event A is x (and has no other relevant information), then their credence in A should be x.  
     - *Motivating case:* Foundational. Without this, we aren't deferring to chance.

  2. **Undermining Handling (Humphreys' Paradox):**  
     - *What it must do:* Handle cases where the chance of an event depends on the agent's own belief (or the global chance setup) in a way that seems to undermine direct deference.  
     - *Motivating case:* In a Humean metaphysics (like BSA), the chance of an event might depend on the entire pattern of events, including the event in question. Learning the chance might then undercut the very chance fact. The theory must avoid self-undermining credences.

  3. **Mediated Expert Deference (Trust in Mechanism):**  
     - *What it must do:* Account for situations where an agent defers to a reported chance (e.g., a scientist's measurement) but has doubts about the reliability of the mechanism (e.g., misapplied setup). The agent should adjust their credence based on their trust in the mechanism.  
     - *Motivating case:* Real-world scientific evidence comes through fallible instruments and experts. We need a way to incorporate both the reported chance and our confidence in the reporting process.

  4. **Copy-Room Twist (Self-Location and Chance):**  
     - *What it must do:* Provide a principled answer to the copy-room scenario without collapsing to "it depends on self-location" as the only explanation.  
     - *Motivating case:* In room A, a fair coin is flipped (chance 0.5). Room B displays a copy of the result one hour later. You know you're in one room but not which. The chance of heads in room A was 0.5, but in room B, the result is determined (if the copy has already happened) or will be copied (if not). The theory must clarify whether the PP applies to the event "my display shows heads" and why. We need to distinguish between physical indeterminism and indexical ignorance.

  ### Must-Preserve Distinctions

  5. **Value vs. Mechanism Deference:**  
     - *Distinction:* Deferring to a specific chance value (e.g., "the chance is 0.7") vs. deferring to a chance-generating mechanism (e.g., "this coin is fair"). The theory must not conflate these, as they play different roles in updating (e.g., if you trust the mechanism but the value is reported, you might still adjust for report reliability).

  6. **Indeterminism vs. Indexical Ignorance:**  
     - *Distinction:* Physical indeterminism (e.g., quantum events) should be distinguished from mere ignorance about which branch of a deterministic process you are in (e.g., the copy-room). The theory must not treat both as "chance" in the same way.

  7. **Quantitative Weight vs. Moral/Status Weight:**  
     - *Distinction:* Chance has a specific quantitative role in guiding credence (e.g., PP). This is distinct from other factors (e.g., moral considerations, social status) that might influence belief but are not chances. The theory must not let non-chance factors "masquerade" as chance.

  ### Non-Negotiables vs. Camp-Specific Preferences

  - **Non-Negotiables (any adequate theory must have these):**  
    - Basic Alignment (1)  
    - Handling undermining without absurdity (2) — though the exact solution may vary.  
    - Preserving the distinctions (5, 6, 7) — they are core to the concept of chance.  
    - Providing a non-arbitrary answer to the copy-room (4) — even if it's complex.

  - **Camp-Specific Preferences (theories can differ here):**  
    - **Determinism preservation:** Some theories (e.g., compatibilist) might allow chances in deterministic worlds, others (e.g., incompatibilist) might require indeterminism.  
    - **Belief-dependent chances:** Should the theory allow that an agent's beliefs can directly influence the chance? (E.g., in decision theory, some think acts can influence chances.)  
    - **Empirical equivalence to textbook QM:** Must the theory recover the statistical predictions of quantum mechanics in the limit? (This is important for physical adequacy but might be dropped by non-physicalist theories.)

  ### Potential Tensions (Jointly Unsatisfiable?)

  - **Basic Alignment + Undermining Handling:** In Humean views (like BSA), the Principal Principle might conflict with undermining because learning the chance can undercut the chance itself. Some (e.g., Lewis) think we must restrict the PP to "admissible" information, but that's tricky. So these two might be in tension without careful setup.
    
  - **Copy-Room Twist + Indeterminism vs. Indexical Ignorance Distinction:** The copy-room seems to blur the line. If the theory says the PP applies to room A (indeterminism) but not room B (deterministic copy), then how does an agent in an unknown room apply it? We must not collapse the distinction, but the agent's epistemic state might mix both. This could be a pressure point.

  ### Scoring Existing Views

  **Orthodox Principal Principle (Lewis-style):**  
  - Basic Alignment: ✅ Perfect.  
  - Undermining: ❌ Struggles (needs admissibility, which is vague and may not fully resolve).  
  - Mediated Deference: ⚠️ Only if we build in reliability; not directly handled.  
  - Copy-Room: ❌ Tends to say "it depends on self-location" without a deeper principle.  
  - Distinctions: ✅ Generally preserves them.  
  - *Overall:* Strong on basics, weak on undermining and copy-room.

  **Revisionist "Halfway" View (e.g., Chance-Credence Principle with belief influence):**  
  - Basic Alignment: ✅ Usually keeps it.  
  - Undermining: ✅ Might handle by allowing credences to affect chance law.  
  - Mediated Deference: ⚠️ Can model mechanism distrust as part of chance setup.  
  - Copy-Room: ⚠️ Might say PP applies only to room A, but then the agent must self-locate? Unclear.  
  - Distinctions: ❓ Risk of blurring value/mechanism and indeterminism/indexical if not careful.  
  - *Overall:* Better on undermining, but copy-room and distinctions may suffer.

  **Flat Rejection of Objective Chance (e.g., Subjectivist/Reductionist):**  
  - Basic Alignment: ❌ Replaces chance with subjective degrees of belief.  
  - Undermining: ❌ Not applicable (no objective chance to undermine).  
  - Mediated Deference: ⚠️ Handled as expert deference (e.g., Bayesian), but without chance.  
  - Copy-Room: ⚠️ Treats both rooms as epistemic uncertainty (maybe 0.5), but loses the metaphysical distinction.  
  - Distinctions: ❌ Collapses them (e.g., no real indeterminism vs. indexical).  
  - *Overall:* Fails on the core idea of objective chance.

  ---

  **Final Spec:**  
  A theory of rational deference to chance must:  
  1. Enforce basic alignment (PP core).  
  2. Resolve or explain undermining without ad-hoc restrictions.  
  3. Handle mediated deference (trust in mechanisms).  
  4. Give a non-indexical answer to the copy-room.  
  5. Keep deference to values and mechanisms distinct.  
  6. Separate indeterminism from indexical ignorance.  
  7. Not let non-quantitative factors (e.g., moral) play the chance role.  

  Tensions: (1) and (2) are hard to satisfy together; (4) and (6) might pull in opposite directions.  
  Non-negotiables: All of 1-7 are non-negotiable for a theory that takes objective chance seriously, though how they are implemented may vary.  
  Camp-specific: Determinism compatibility, belief-dependence, and QM equivalence are optional.
answer: |-
  Here's the conceptual spec for a theory of rational deference to objective chance, boiled down to must-haves, cases, distinctions, and tensions. I'll flag conflicts, non-negotiables, camp preferences, and score the three approaches at the end.

  ---

  ### **Core Desiderata (What the Theory Must Deliver)**
  1. **Basic Alignment**  
     - *Must:* When you learn the objective chance of E is x (with no undermining info), your credence in E must be x.  
     - *Why:* Non-negotiable. If this fails, it’s not deference to chance.  
     - *Case:* You see a certified quantum RNG outputs "70% chance heads" → credence = 0.7.

  2. **Undermining Resistance (Humphreys-style)**  
     - *Must:* Handle self-referential cases where learning the chance-value threatens to undermine the chance fact itself.  
     - *Why:* Without this, deference implodes in worlds where chances depend on global patterns (e.g., Humean metaphysics).  
     - *Case:* In a deterministic universe, learning "P(chance of E = 0.6) = 1" might imply E is determined, contradicting the chance. Theory must prevent credence collapse.

  3. **Mediated Expert Deference**  
     - *Must:* Allow discounting reported chances based on distrust of the mechanism, not just the value.  
     - *Why:* Real-world deference is to *processes* (e.g., a lab setup), not numbers in a vacuum.  
     - *Case:* A scientist says "chance of decay is 0.8," but you suspect their detector is miscalibrated. Your credence should blend 0.8 with your trust in their setup.

  4. **Copy-Room Consistency**  
     - *Must:* Give a principled answer to why/how PP applies (or doesn’t) when physical indeterminism and indexical ignorance are entangled.  
     - *Why:* Tests if the theory conflates chance with ignorance. "It depends on self-location" dodges the metaphysics.  
     - *Case:* In the copy-room, PP must clarify whether your credence for "my display shows heads" is 0.5 (per room A’s chance) or 0/1 (if room B is determined). Answer must distinguish *why*—not just "who knows where I am?"

  ---

  ### **Critical Distinctions (Must Survive)**
  5. **Value vs. Mechanism Deference**  
     - *Must:* Treat "deferring to a chance *value*" (e.g., "P(E)=0.7") differently from "deferring to a *mechanism*" (e.g., "this coin is fair").  
     - *Why:* Mechanisms can be trusted imperfectly (see #3); values are atomic inputs. Collapsing these invites Dutch books.

  6. **Indeterminism vs. Indexical Ignorance**  
     - *Must:* Keep physical indeterminism (e.g., quantum randomness) ontologically distinct from not knowing your branch (e.g., copy-room).  
     - *Why:* Else chance loses its "objective" mojo—you’d treat a coin flip like Schrödinger’s cat.

  7. **Quantitative Weight vs. Moral/Status Weight**  
     - *Must:* Isolate chance’s role as a *credence calibrator* from non-alethic factors (e.g., "I should believe this because it’s virtuous").  
     - *Why:* Chance isn’t a moral imperative; it’s a truth-tracker. Blurring this invites "shoulds" into belief formation.

  ---

  ### **Tensions (Potentially Jointly Unsatisfiable)**  
  - **Basic Alignment (#1) + Undermining Resistance (#2):** In Humean views, learning "chance of E = x" can undermine E’s chance if E affects global patterns. Fixing this often breaks alignment.  
  - **Copy-Room Consistency (#4) + Indeterminism/Ignorance Distinction (#6):** The copy-room *forces* indexical uncertainty into a chance-like setup. A theory might resolve it by sacrificing purity in #6 (e.g., "all ignorance is chance-like").  

  ---

  ### **Non-Negotiables vs. Camp-Specific Preferences**  
  - **Non-Negotiables (any adequate theory):**  
    - Basic Alignment (#1), Undermining Resistance (#2), Copy-Room Consistency (#4), and all three distinctions (#5–7). Fail these, and it’s not a theory of *objective chance*.  

  - **Camp-Specific Preferences (theory can choose):**  
    - **Determinism preservation:** Must chances require indeterminism? (Incompatibilists: yes; Humeans: no.)  
    - **Belief-dependent chances:** Can credences affect chances? (Causal decision theorists: yes; Orthodox: no.)  
    - **QM equivalence:** Must chance recover QM statistics? (Physicalists: yes; Anti-realists: no.)  

  ---

  ### **View Scoring (TL;DR)**  
  | **Desiderata**          | **Orthodox PP** | **Revisionist (e.g., Chance-Credence Principle)** | **Reject Objective Chance** |
  |-------------------------|-----------------|---------------------------------------------------|-----------------------------|
  | **Basic Alignment**     | ✅              | ✅ (if calibrated)                       | ❌ (no chance to defer to) |
  | **Undermining**         | ❌ (needs admissibility hacks) | ✅ (credences shape chance laws) | ❌ (moot) |
  | **Mediated Deference**  | ⚠️ (only via values) | ✅ (mechanisms as part of law)          | ✅ (reduces to expert testimony) |
  | **Copy-Room**           | ❌ (collapses to indexicals) | ⚠️ (depends on "law selection") | ⚠️ (treats as flat 0.5, ignores #6) |
  | **Value/Mechanism Dist.** | ✅              | ❌ (often blurs)                         | ❌ (all subjective) |
  | **Indeterminism/Ignorance** | ✅              | ❌ (risks conflating)                    | ❌ (no distinction) |
  | **Quantitative Weight** | ✅              | ⚠️ (if chances are "subjective")        | ❌ (no objective weight) |

  **Orthodox PP** (e.g., Lewis): Nails basics and distinctions but flops on undermining/copy-room without kludges.  
  **Revisionist**: Solves undermining and mediation but risks collapsing distinctions (especially #5–6) and gets fuzzy in copy-room.  
  **Reject Chance**: Dodges problems by denying the subject—fails most desiderata by design.  

  ---

  **Bottom Line**: A theory must explain why chance is *worth* deferring to—not just how. If it can’t handle the copy-room without indexical cop-outs or preserve the indeterminism/ignorance split, it’s smuggling in subjectivity. The big tension: Humean-friendly theories struggle with undermining; non-Humean ones struggle with QM equivalence.
