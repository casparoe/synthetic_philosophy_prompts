answer: |-
  ## Decision-Tree Taxonomy: Fixing Ontology with Permanent Inaccessibility

  **Root Commitment:** I accept that some ontological information is permanently inaccessible to any observer in this system.

  **Node 1: Is the primary nature of this inaccessibility Vertical (causal/observational shield) or Horizontal (structural underdetermination)?**
  *   **Vertical:** (e.g., Information trapped behind a cosmological event horizon, quantum measurement permanently collapsing possibilities)
  *   **Horizontal:** (e.g., Multiple distinct particle configurations yielding identical observable force-field patterns with no further fact determining which is actual)

  ---

  ### Branch: Vertical Inaccessibility
  **Node 1.1: How should the permanently inaccessible region be ontologically treated?**
  *   **Option A: Ontologically Empty** (The shielded region contains no distinct entities or properties; it is void).
      *   **Node 1.1A:** Do observable quantum-field correlations (without track-access) justify postulating field quanta as real entities?
          *   **Yes:** → **Leaf 1: Restricted Entity Realism.** *Most awkward commitment: Entities implied by correlations are real, but entities shielded by the horizon (even if causally identical in principle) are literally nothing.*
          *   **No (Only predictive structure):** → **Leaf 2: Instrumentalism.** *Most awkward commitment: Successfully predicting shielded-region effects using "entities" as calculational tools provides zero reason to believe such entities exist, even within accessible regions.*
  *   **Option B: Ontological Surplus** (The shielded region contains entities/properties, but their specific nature is permanently unknowable).
      *   → **Leaf 3: (Vertical) Epistemic Structural Realism.** *Most awkward commitment: We must affirm *that* unknowable entities exist behind the shield causing observable structure, while conceding we can literally know *nothing* specific about them, not even generic categories.*
  *   **Option C: Replaced by Pure Relational Structure** (The inaccessible region isn't "stuff" but is exhaustively described by its structural relations to the accessible region and itself).
      *   → **Leaf 4: Ontic Structural Realism (Vertical).** *Most awkward commitment: The event horizon shields not "things" but only further, intrinsically relationally-defined nodes within a fundamentally structural reality.*

  ---

  ### Branch: Horizontal Inaccessibility
  **Node 1.2: How should the underdetermined ontological basis be treated?**
  *   **Option A: Ontologically Empty** (No hidden entities exist; the observable pattern is fundamental).
      *   → **Leaf 5: Instrumentalism (Horizontal).** *Most awkward commitment: The empirically indistinguishable competing ontologies aren't just unknowable; they are literal non-options, as nothing "underlies" the pattern at all.*
  *   **Option B: Ontological Surplus** (One specific ontology is actual, but we are permanently barred from knowing which one).
      *   **Node 1.2B:** Are dark-matter gravitational signatures better interpreted as evidence for invisible particles or modified relational geometry?
          *   **Invisible Particles:** → **Leaf 6: Restricted Entity Realism (Horizontal).** *Most awkward commitment: We must accept the reality of specific entity types (particles) *only* because they fit the sparsest accessible correlation set, even though structurally identical alternatives exist.*
          *   **Modified Geometry:** → **Leaf 7: Epistemic Structural Realism (Horizontal).** *Most awkward commitment: Talk of "particles" causing the dark matter signature is a useful but literally false heuristic; the *real* (but unknowable-in-detail) ontology causes the geometric structure we observe.*
  *   **Option C: Replaced by Pure Relational Structure** (The competing "bases" are illusory; only the invariant correlation pattern is real).
      *   → **Leaf 8: Ontic Structural Realism (Horizontal).** *Most awkward commitment: There is no fact of the matter about whether dark matter is particles or geometry, not because we don't know, but because the distinction between "entity" and "relation" dissolves into fundamental structure.*
      *   → **Leaf 9: Dual-Aspect View.** *Most awkward commitment: The inaccessible ontological information possesses genuine reality, but as a non-physical (e.g., proto-mental, informational, or intrinsic) aspect fundamentally linked to the physical relational structure we observe.*

  ---

  ### Logical Gaps & Ambiguities
  1.  **Vertical + Ontological Surplus + Reject Entity Postulation (No Leaf):** Vertically inaccessible surplus entities exist, yet observable correlations (e.g., QFT) don't justify postulating entities *even in accessible regions*. This combination is **conceptually unattractive**: Why affirm unknowable shielded entities while refusing to affirm entities implied by accessible correlations? Leans towards Instrumentalism or inconsistent.
  2.  **Horizontal + Ontologically Empty + Entity Postulation (No Leaf):** Claiming the underdetermined basis is empty *but* still postulating specific entities (e.g., particles for dark matter) based on correlations is **incoherent**. If the basis is empty, the correlations *are* the ontology; postulating entities contradicts emptiness.
  3.  **Ontic Structural Realism (Leaf 4 & 8) vs. Dual-Aspect View (Leaf 9):** These **do not collapse**. OSR denies individual entities *and* any non-structural reality, affirming only relations. The Dual-Aspect view affirms a *non-physical* aspect *alongside* or *underlying* the physical structure, granting genuine reality to information beyond structure itself. OSR says "only structure exists"; Dual-Aspect says "structure is one face of a deeper reality".
  4.  **Restricted Entity Realism (Leaf 1 & 6) vs. Epistemic Structural Realism (Leaf 3 & 7) under Maximal Sparsity:** With maximally sparse correlations (e.g., only gravitational lensing implies "something"), these **can become indistinguishable in practice**. Both posit *something* real causing the sparse data: RER posits sparse entities, ESR posits unknowable entities causing the sparse structure. The distinction hinges on whether "entity" is a justified inference *from* the sparse structure (RER) or a placeholder *for* the cause *of* the sparse structure (ESR), which can blur. However, RER insists the *entity type* is knowable (e.g., "massive particle"), while ESR insists the entity type is unknowable. Sparsity makes the "knowable type" claim of RER very thin.
