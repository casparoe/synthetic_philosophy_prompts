  Then with p=1/3, P(first) = 1/(2-1/3) = 1/(5/3) =3/5, P(second)=2/5, and as before, EU(exit) = (3/5)*0 + (2/5)*4 = 8/5=1.6, EU(continue) = (3/5)*2 + (2/5)*1 = 6/5 + 2/5 =8/5=1.6, so indifferent, and he can randomize with p=1/3.

  If he re-evaluates with these beliefs, he is indifferent, so he can choose to randomize.

  If he has wrong beliefs, he might choose wrong.

  In the argument, by assigning P=1/2, he has wrong beliefs, so he makes a bad choice.

  So to keep both, we should reject step (2) and say that with equal evidence, credence should not be equal because of the prior; the evidence "being at an exit" has different likelihood for first and second depending on the strategy.

  But since the strategy is what he is choosing, it's circular.

  For the decision at the time, he should have consistent beliefs with the strategy he plans to follow.

  Otherwise, with naive 1/2, he is led astray.

  So in practice, to execute the optimal plan, he must not assign 1/2; he should assign the correct conditional probability based on the plan.

  And when he re-evaluates, he should do so with the understanding that he is following the plan.

  So I think rejecting step (2) is the way to go.

  What does it cost? It means that in situations with imperfect recall or absent-mindedness, credences must be defined in a way consistent with the strategy, not just from current evidence.

  It requires that the agent remembers or commits to the strategy, so that beliefs are based on it.

  In this case, with absent-mindedness, he might forget the strategy, so he has to rely on current evidence.

  But if he only has current evidence, and it is symmetric, he must assign 1/2, leading to bad outcome.

  So to avoid that, he must not forget the strategy or have a way to have the correct beliefs.

  Perhaps the theory should allow for that.

  I think for the purpose of this problem, rejecting (2) is acceptable.

  Some people reject that rational choice requires maximizing expected utility with current credences, but that seems more costly.

  Or reject that he can't precommit.

  But I want to keep precommitment and time-consistent choice.

  So I'll go with rejecting step (2).
