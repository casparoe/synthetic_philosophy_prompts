prompt: |-
  I just finished a long argument with a friend about whether art-status is conferred by an institution or by properties intrinsic to the object, and we kept returning to a scenario neither standard example resolves. I call it the reverse-readymade: a work that has been displayed as canonical art for decades is formally revoked by the same institution that originally conferred its status, not because the physical object changed, but because the board decides the artist's later conduct disqualifies the work from the canon. The friend insisted the object is still art; I wasn't sure. Now I want my students to feel that instability rather than just discuss it. I run an upper-level aesthetics seminar—twelve students, ninety minutes, all philosophy majors familiar with institutional theories but not with this reversal case. Design a structured in-class simulation in which participants collectively write the rules for art-status conferral before they see the revocation scenario, then must apply their rules to vote on whether the object retains art-status. The rules, roles, and voting mechanism should be arranged so that the group runs into a coordination failure or circular dependency—perhaps between curatorial authority and public aesthetic judgment—before anyone names the institutional circularity problem. Include specific roles (e.g., board curators, estate representatives, independent critics, public voters), a payoff or point scheme that requires no real money, materials needed, a minute-by-minute timeline, and a debrief that maps each crisis point in the activity onto a corresponding part of Dickie's or Danto's institutional framework and onto rival intrinsic-property accounts. Be explicit about what will predictably go wrong the first time—say, the group collapses to a simple majority vote too quickly—and how to prevent it. Also be frank about which feature of the actual philosophical debate, such as the historical-intentional constraint on artistic identity, the simulation cannot reproduce and must be supplied by me in the debrief. The students should leave having experienced the pull of both the institutional and the anti-institutional intuition, not just having heard them named.
reasoning: |-
  We are designing an in-class simulation for an upper-level aesthetics seminar. The goal is to have students experience the instability in the institutional theory of art when faced with a "reverse-readymade" scenario. The simulation will involve:
   1. Students collectively writing rules for art-status conferral.
   2. Then applying these rules to vote on whether an object retains art-status after the institution revokes it due to the artist's later conduct (without the object changing physically).

   We want the simulation to lead to a coordination failure or circular dependency, particularly between curatorial authority and public aesthetic judgment, without explicitly naming the institutional circularity problem until the debrief.

   Key elements:
   - Roles: board curators, estate representatives, independent critics, public voters.
   - Payoff or point scheme (no real money).
   - Materials needed.
   - Minute-by-minute timeline.
   - Debrief mapping the crises to Dickie's or Danto's institutional framework and rival intrinsic-property accounts.

   We also need to anticipate what might go wrong (e.g., collapsing to a simple majority vote too quickly) and how to prevent it.

   Finally, we must be frank about what the simulation cannot reproduce (e.g., historical-intentional constraint on artistic identity) and note that this must be supplied in the debrief.

   Let's design the simulation step by step.

   Simulation Title: "The Art Status Tribunal"

   Roles (assigned to 12 students):
    - 3 Board Curators (representing the institution that conferred and now revokes the status)
    - 2 Estate Representatives (representing the artist's estate, defending the work's status)
    - 3 Independent Critics (experts who can argue based on aesthetic properties, art history, etc.)
    - 4 Public Voters (representing the general public's aesthetic judgment)

   Note: The roles are assigned by the instructor. Each role has a specific perspective and goal.

   Phase 1: Rule-Making (30 minutes)
    - The entire class (in their roles) must collectively draft a set of rules that determine how an object becomes and remains a work of art.
    - The rules must address the following questions (provided on a handout):
        1. What are the necessary conditions for an object to be initially recognized as art?
        2. Can art status be revoked? If so, under what conditions?
        3. Who has the authority to confer and revoke art status? (e.g., the institution, the public, critics, etc.)
        4. What role do the intrinsic properties of the object play in its status as art?
        5. What role does the artist's identity and conduct play in the status of the work?
    - The rules must be written on a whiteboard or large paper so everyone can see.

   Phase 2: Introduction of the Scenario (5 minutes)
    - The instructor introduces the reverse-readymade scenario:
        "A famous artwork, 'X' by artist Y, has been displayed in the Museum of Modern Art for 50 years. Recently, the board of the museum has decided to revoke the art status of 'X' because the artist Y, in their later life, was found to have committed heinous crimes (e.g., war crimes, genocide, etc.). The physical object has not changed. The board states that the artist's conduct disqualifies the work from being art. However, the estate of the artist, along with some critics and a segment of the public, disagrees."
    - The instructor then reveals that the board curators have already voted to revoke (this is given) and that the estate representatives are appealing the decision.

   Phase 3: Tribunal (40 minutes)
    - The tribunal is structured as follows:
        a. Opening statements (5 minutes total):
            - Board Curators (1 min): Explain why they revoked the status.
            - Estate Representatives (1 min): Argue for reinstatement.
            - Independent Critics (2 min total, 40 sec each): Present their views.
            - Public Voters (1 min total, 15 sec each): Express their views.

        b. Deliberation and Rule Application (30 minutes):
            - The group must apply the rules they created in Phase 1 to decide whether the artwork retains its status.
            - The rules might require input from different roles. For example:
                 - The rules might say that the board has the authority to revoke, but also that public opinion must be considered.
                 - Or that the critics must be consulted, and their vote counts for more.
            - The goal is for the group to run into a conflict because the rules they wrote might have circular dependencies or conflicting authorities.

        c. Voting (5 minutes):
            - The group must vote on whether the artwork retains its art status.
            - The voting mechanism must be defined by the rules they created. However, if the rules are unclear, they must first clarify how to vote.

   Phase 4: Debrief (15 minutes)
    - The instructor leads a discussion mapping the crises in the simulation to philosophical theories.

   Payoff Scheme (to incentivize role-playing and engagement):
    - Each student can earn up to 10 points for the activity.
        - 5 points for participating in the rule-making and tribunal according to their role (assessed by instructor observation).
        - 5 points if their side "wins" (for board curators: if the revocation is upheld; for estate: if the status is reinstated; for critics and public: if the outcome aligns with their stated position). 
          However, note that critics and public might not have a unified position, so they get the 5 points if the outcome matches their individual vote.

    Alternatively, to avoid creating too much competition and to focus on the experience, we can make the payoff about the quality of argument and participation, but without a win/lose. Instead, we can have:

        - 5 points for active and role-appropriate participation in rule-making and tribunal.
        - 5 points for a reflective paragraph to be written after class (assigned as homework) on how the simulation relates to the institutional theory and intrinsic properties.

   Materials:
    - Whiteboard or large paper and markers for rule-making.
    - Handout with the scenario and role descriptions.
    - Timer.

   Minute-by-Minute Timeline:

    Phase 1: Rule-Making (30 minutes)
     - 0-5 min: Instructor explains the activity and assigns roles (if not done before). Hand out role cards with descriptions and goals.
     - 5-25 min: Group discussion to draft rules. The instructor circulates and may prompt if they are avoiding key issues (e.g., "What about the artist's conduct?").
     - 25-30 min: Finalize the rules on the board.

    Phase 2: Scenario Introduction (5 minutes)
     - 30-35 min: Instructor presents the reverse-readymade scenario and the board's revocation. Establishes that the board has already revoked and the estate is appealing.

    Phase 3: Tribunal (40 minutes)
     - 35-40 min: Opening statements (strict timekeeping).
     - 40-70 min: Deliberation and rule application. The group must try to apply their rules to the case. The instructor may step in if they are stuck, but only to remind them of the rules they created.
     - 70-75 min: Voting (if the rules specify a voting procedure, they must follow it; if not, they must decide on the spot how to vote).

    Phase 4: Immediate Debrief (15 minutes)
     - 75-90 min: Instructor-led discussion.

   What will predictably go wrong and how to prevent it:

    Problem 1: The group collapses to a simple majority vote too quickly in the rule-making, avoiding the complexity of multiple authorities.
        Prevention: The instructor should circulate during rule-making and ask probing questions: "What if the board and the public disagree? How will you resolve that?" or "What if the critics say it's art but the board says it isn't?" Encourage them to write a multi-step process.

    Problem 2: The rules are too vague to apply.
        Prevention: During rule-making, the instructor can require that the rules be specific and operational (e.g., "The board must consult the critics and then make a decision" is vague; push for "A vote of the critics must be taken and if 2 out of 3 critics support the work, then the board cannot revoke without a supermajority").

    Problem 3: The students break character and argue from their personal views.
        Prevention: Provide clear role cards with specific instructions and goals. For example:
            - Board Curators: You believe that the institution has the ultimate authority and that the artist's conduct is relevant to the work's status. Your goal is to uphold the revocation.
            - Estate Representatives: You believe that the work's status is independent of the artist's later conduct and that the revocation is a violation of the artist's legacy. Your goal is to reinstate the status.
            - Independent Critics: You are divided. Two of you focus on intrinsic properties (the work hasn't changed, so it remains art) and one focuses on the context (the artist's conduct changes the meaning). Your goal is to argue from your assigned perspective.
            - Public Voters: You represent the public. Two of you are traditionalists (art is forever) and two are moralists (if the artist is bad, the work is tainted). Your goal is to express the public's view.

    Problem 4: The circularity doesn't emerge because the rules are too clear.
        Actually, we want the circularity to emerge. If the rules are too clear, that's okay because we can then point out in the debrief that in the real world the rules are not so clear. But we also hope that the rules they create might have inherent tensions. However, if they don't, the instructor can introduce in the debrief: "In your rules, you gave the board the final say, but what if the public stops recognizing the work? Does that matter?"

   What the simulation cannot reproduce:

    - The historical-intentional constraint: The fact that the work was created at a particular time by an artist with a certain intention, and that intention is part of the work's identity. The simulation focuses on the present institutional decision and public judgment without the deep historical context. The instructor must explain in the debrief that according to some theories (like Danto's), the work's identity is tied to the historical context of its creation, which cannot be altered by later events.

   Debrief Structure:

    1. Recap the simulation: What happened during the tribunal? What were the key arguments?
    2. Map the crises to theories:
        - Point out any coordination failure: e.g., if the rules required both the board and the public to agree, and they didn't, leading to deadlock. This reflects the institutional theory's dependence on a cooperative artworld.
        - Map the board's authority to Dickie's institutional theory (the artworld conferring status).
        - Map the arguments about the unchanging physical object to intrinsic property theories (e.g., Bell's significant form).
        - Map the role of the artist's conduct to the debate over whether the artist's identity is part of the work (e.g., anti-intentionalism vs. intentionalism).
    3. Highlight the circularity: If in the rules the institution is both the conferrer and the revoker, but the institution's authority relies on the artworld's acceptance, then what happens when the artworld (critics, public) disagrees? This is the circularity that Dickie's theory faces.
    4. Connect to the reverse-readymade: How does this scenario challenge the idea that art status is permanent once conferred? What does it say about the power of institutions?
    5. Finally, note the limitation: The simulation does not capture the historical fixation of the work's identity (as per Danto) because the revocation is happening decades later. The instructor should explain that in Danto's view, the work is embedded in the artworld of its time, and later reappraisals don't change that original identity.

   By the end, students should have felt the pull of both intuitions: the institutional power to revoke and the idea that the object remains art because of its intrinsic properties or its original context.

   Let's write the role cards:

    Board Curators (3 students):
        "You are the curators of the Museum of Modern Art. You have already voted to revoke the art status of the work because you believe the artist's later conduct (heinous crimes) disqualifies the work. You argue that the institution has the right to revoke art status when the artist's actions fundamentally undermine the values the institution stands for. Your goal is to uphold the revocation."

    Estate Representatives (2 students):
        "You represent the estate of the artist. You argue that the work's art status is independent of the artist's later conduct. The physical object hasn't changed, and the work was created at a time when the artist was not known for any crimes. The revocation is a violation of the artist's legacy and the work's historical significance. Your goal is to have the art status reinstated."

    Independent Critics (3 students):
        Critic 1 and 2 (intrinsic-focused): "You are critics who believe that the art status of an object depends on its intrinsic properties. Since the physical object hasn't changed, it remains art. The artist's conduct is irrelevant. Argue for the reinstatement of the art status."
        Critic 3 (context-focused): "You are a critic who believes that the meaning of a work is tied to the artist's life and context. The artist's later conduct has altered the meaning of the work, making it a celebration of a criminal. Therefore, the work no longer functions as art. Argue to uphold the revocation."

    Public Voters (4 students):
        Voter 1 and 2 (traditionalists): "You believe that once art, always art. The work hasn't changed, so it remains art. You are outraged by the revocation."
        Voter 3 and 4 (moralists): "You believe that the artist's conduct matters. You cannot separate the work from the artist, and you feel that displaying the work now would be an endorsement of the artist's crimes. You support the revocation."

   This setup ensures that the group is divided and that the rules they created will be tested.

   Let's hope that during rule-making they create a system that requires multiple inputs (e.g., the board, the critics, and the public) and then during the tribunal they cannot reach a consensus because of conflicting inputs, thus experiencing the coordination failure.

   The voting mechanism in the tribunal must be defined by their rules. If they didn't define one, then they have to invent one on the spot, which will be chaotic and also illustrative of the need for an institution to have clear rules.

   We are ready to run the simulation.
answer: |-
  ### Art-Status Tribunal: Simulation Design

  **Core Tension:** Institutional authority vs. intrinsic properties, with a focus on the *revocability* of art-status due to extrinsic factors (artist's conduct).

  ---

  ### **Materials Needed**
  1. Role cards (12 total: 3 Curators, 2 Estate Reps, 3 Critics, 4 Public Voters)  
  2. Whiteboard & markers  
  3. Timer  
  4. Voting tokens (red/blue for "revoke"/"retain")  
  5. Scenario card (hidden until Phase 2)  
  6. Rule-writing template handout  

  ---

  ### **Roles & Incentives**  
  *(Points system: 0–3 points per role goal; 12 = perfect score)*  

  | **Role**              | **Primary Goal**                                | **Secondary Goal**                          | **Points Criteria**                                                                 |
  |-----------------------|------------------------------------------------|---------------------------------------------|------------------------------------------------------------------------------------|
  | **Board Curators** (3) | Uphold institutional authority                  | Ensure art-status reflects "current values" | +1 if revocation vote succeeds; +1 if rules prioritize institution; +1 if no public override |
  | **Estate Reps** (2)   | Defend permanence of art-status                | Argue intent/properties > institution       | +1 if revocation fails; +1 if rules include "irrevocability"; +1 if critics side with them |
  | **Independent Critics** (3) | Judge based on intrinsic properties          | Preserve art-historical continuity          | +1 if rules include properties; +1 if vote aligns with their critique; +1 if they sway 2+ voters |
  | **Public Voters** (4) | Assert community aesthetic judgment            | Resist elitist authority                    | +1 if rules include public input; +1 if final vote matches majority public stance; +1 if they force rule rewrite |

  ---

  ### **Phase-by-Phase Timeline**  
  **Total: 90 minutes**  

  #### **PHASE 1: Rule Drafting (30 min)**  
  *Goal: Create rules for conferring/revoking art-status.*  
  - **0–5 min:** Assign roles. Distribute templates:  
    *Template Questions:*  
    - *What entities can confer art-status? (Circle: Institution/Public/Critics/Other)*  
    - *Can art-status be revoked? If yes, by whom and for what reasons?*  
    - *What weight do these factors hold? (Rank 1–5):*  
      - *Artist’s intent*  
      - *Physical properties*  
      - *Institutional approval*  
      - *Public reception*  
      - *Moral context*  
  - **5–25 min:** Group negotiation (instructor circulates, prompts: *"What if public and institution clash?"*).  
  - **25–30 min:** Finalize rules on whiteboard. **Trap:** Rules must require *multiple entities* (e.g., institution + critics) for revocation.  

  ---

  #### **PHASE 2: Scenario Reveal & Tribunal (40 min)**  
  *Goal: Apply rules to the reverse-readymade case.*  
  - **30–32 min:** Reveal scenario:  
    > *"Masterpiece ‘X’ by artist Y (displayed 50+ years) had art-status revoked by this institution after Y’s conviction for war crimes. The physical object is unchanged. The Estate appeals."*  
  - **32–37 min:** Role prep (quiet):  
    - *Curators:* Argue revocation is justified (artist’s conduct corrupted meaning).  
    - *Estate:* Argue art-status is immutable (properties/intent unchanged).  
    - *Critics:* Split—2 pro-revocation (context alters meaning), 1 anti (properties eternal).  
    - *Public:* Split—2 pro-revocation (moral outrage), 2 anti (it’s "still beautiful").  
  - **37–57 min:** Tribunal debate (structured):  
    - 2 min each: Curators → Estate → Critics (each) → Public (each).  
    - Focus: *Apply the group’s rules.* Example crisis:  
      > Critics say, "Our rules require judging properties, which haven’t changed!"  
      > Curators counter: "But you ranked ‘moral context’ a 4!"  
  - **57–70 min:** **Voting & Coordination Failure:**  
    - *Step 1:* Vote by role (tokens). Curators + 2 critics + 2 public = 7/12 to revoke.  
    - *Step 2:* **Trigger conflict:** Rules require *separate* majority approval from institution (Curators) AND critics/public combined. Outcome: Curators (3/3 revoke), Critics (2/3 revoke), Public (2/4 revoke → 50%, not majority).  
    → **Deadlock:** Rules unmet. Art-status in limbo.  

  ---

  #### **PHASE 3: Debrief (20 min)**  
  *Map crises to theory & surface intuitions.*  

  | **Simulation Crisis**          | **Dickie’s Institutional Theory**            | **Danto’s Artworld**              | **Intrinsic Property View**       |  
  |-------------------------------|---------------------------------------------|-----------------------------------|-----------------------------------|  
  | Deadlock in voting            | Circularity: Artworld defines itself        | "Artworld" requires consensus     | Rejected—status depends on object |  
  | Public vs. curator conflict   | Institution as gatekeeper                   | Embodied meaning requires history | Irrelevant—public taste is fickle |  
  | Moral context vs. properties  | Non-art factors can enter via "systems"     | "Atmosphere of theory" shifts     | Immutable—form is primary         |  

  **Key Debrief Questions:**  
  1. *"When rules failed, did you want to side with the institution or the object? Why?"* (Surface intuitions)  
  2. *"Could the ‘art’ exist if every institution revoked it but you loved it?"* (Anti-institutional pull)  
  3. *"Does the artist’s crime become part of the work?"* (Historical constraint)  

  ---

  ### **Predictable Problems & Fixes**  
  - **Collapse to majority vote:**  
    - *Prevention:* Require multi-step voting in rules (e.g., "Critics + public must *both* reach 60%").  
  - **Role-breaking:**  
    - *Prevention:* Assign opposing sub-goals (e.g., split critics/public). Point deductions for "out of character" arguments.  
  - **Oversimplifying rules:**  
    - *Prevention:* Template forces ranking conflicting factors. Instructor intervenes: *"What if the institution ignores properties?"*  

  ---

  ### **Limitations to Address in Debrief**  
  1. **Historical-intentional constraint:** Simulation can’t replicate Danto’s "artworld of the past." *Instructor must add:*  
     > "For Danto, ‘X’ is fixed by its *original* artworld context. Later moral reappraisal doesn’t erase that—it adds layers."  
  2. **Institutional circularity:** Students may miss self-referentiality. *Clarify:*  
     > "Dickie’s ‘artworld’ is defined by its own authority—like your rules granting yourselves power."  

  ---

  ### **Learning Outcomes**  
  - **Experiential:** Students *feel* frustration when rules conflict (institutional instability) and conviction defending the object (intrinsic pull).  
  - **Theoretical:** Maps abstract theories to lived tension during deadlock.  
  - **Critical:** Reveals art-status as negotiable—not just "given."  

  **Final Tip:** Assign a reflection: *"Whose side were you on during the deadlock? Did your role change your intuition?"*
