prompt: |-
  I'm working through the literature for a philosophy of economics seminar, and I've become stuck on a prior question: before comparing particular accounts of how financial markets aggregate dispersed belief into price—whether rational-expectations models, noise-trader approaches, or Hayekian knowledge arguments—I want to know what we should ask of any epistemology of markets in the first place. The specific tension I'm tracking is the one raised by no-trade theorems in common-knowledge frameworks: if rational agents share common priors and it is common knowledge that they are rational, then any observed trade should be impossible, yet markets clearly sustain continuous trading. Rather than resolving that paradox with one model or another, I want the full specification of adequacy conditions that any theory must meet if it claims to explain market epistemology without simply dissolving the tension by fiat.

  Please write the desiderata: what an adequate epistemology of markets must deliver. For each requirement, include the motivating case or consideration behind it—such as how the theory handles private information that is not merely hidden but structurally incommensurable across agents, a feature I will call strategic opacity, where the interpretive framework an agent uses to read prices is itself shaped by the market dynamics she is trying to interpret. Mark which desiderata are genuinely non-negotiable (for instance, consistency with the existence of sustained trade) and which are camp-specific preferences (such as determinism about price formation or the denial of any collective cognitive state). If some subset of your requirements is jointly unsatisfiable given classic no-trade results, say so explicitly—that is the part I most want to see. Also indicate, briefly, which single requirement does the most work in excluding the most popular competing theories, but keep the weight on the criteria themselves rather than on a full scorecard. I do not need citations, bibliographies, or reading lists; a model without web access should be able to construct the list from conceptual analysis alone.
reasoning: |-
  Okay, let me unpack this user's query. They're deep into philosophy of economics, specifically the epistemology of financial markets. The core tension they're wrestling with is the no-trade paradox: why does continuous trading happen when rational expectations models suggest it shouldn't? They want a set of criteria to evaluate any market epistemology theory, not just solutions to the paradox. 

  Hmm, the user mentions "strategic opacity" as a key concern—how agents' interpretive frameworks are shaped by the very market dynamics they're trying to decode. That's subtle. They also want clear demarcation between non-negotiable requirements (like explaining sustained trade) and camp-specific preferences (e.g., determinism). 

  First, I need to map the absolute must-haves. Sustained trade existence is obviously non-negotiable—without it, the theory contradicts reality. Then there's the no-trade theorem challenge: any epistemology must resolve this paradox without hand-waving. Private information asymmetry is another bedrock; if all info were common knowledge, markets wouldn't function. 

  The trickier part is strategic opacity. It's not just about hidden info but fundamentally incompatible interpretive frameworks. This feels non-negotiable because it's central to how real agents operate—their biases and tools co-evolve with the market. 

  Now for the negotiables. Things like determinism (must prices have unique causes?) or collective cognition (do markets "know" things?) are theory-dependent. Some models need them, others don't. 

  I should flag where requirements clash. For example, perfect rationality + common priors + symmetric info would make sustained trade impossible—yet we observe it. So any theory must break at least one assumption. 

  The most discriminating requirement? Likely strategic opacity. It rules out models where agents are just Bayesian updaters with fixed priors. If the user's right about this, it's a skeleton key for critiquing rational expectations or Hayekian views. 

  User's clearly done their homework—they're not falling for cheap resolutions of the paradox. Their ask is precise: no citations, just conceptual rigor. I'll avoid jargon and keep the analysis tight.
answer: |-
  Here is a prioritized set of desiderata for an adequate epistemology of financial markets, structured by necessity and grounded in your core tension:

  ### Non-Negotiable Desiderata (Must Be Satisfied)
  1.  **Sustained Trade Existence (STE):**  
      *The theory must explain why continuous, non-vanishing trade occurs despite rational agents interacting in a shared market.*  
      **Motivation:** Contradicts no-trade theorems under common knowledge/rationality/common priors. Market reality (constant liquidity, volume) is the primary explanandum. Failure here falsifies the theory.

  2.  **Private Information Asymmetry (PIA):**  
      *The theory must incorporate agents possessing fundamentally private, non-verifiable information that cannot be fully communicated or extracted by prices alone.*  
      **Motivation:** Resolves STE by negating common knowledge of information. Without private information differing *in kind* (not just degree), trade lacks rational basis beyond risk-shifting/liquidity (which theories must also account for).

  3.  **Price as Imperfect Aggregator (PIAg):**  
      *The theory must show how prices *partially* aggregate dispersed information while simultaneously reflecting noise, misinterpretation, or non-informational factors.*  
      **Motivation:** Prices demonstrably guide decisions but fail to perfectly reveal underlying states (e.g., bubbles, persistent mispricing). Pure aggregation (REH) fails STE; no aggregation makes prices meaningless.

  4.  **Strategic Opacity Handling (SOH):**  
      *The theory must account for agents whose interpretive frameworks (models, heuristics, ontologies) for decoding prices and information are:*  
      *   (a) *Heterogeneous and potentially incommensurable,*  
      *   (b) *Endogenously shaped by market participation and observed price dynamics,*  
      *   (c) *Unknowable in full to other agents (or the theorist).*  
      **Motivation:** Addresses the core challenge of "reading the market reading you." Agents aren't just Bayesian updaters with fixed priors; their cognitive tools evolve reflexively within the market process. Ignoring this leads to sterile models.

  5.  **Broken Common Knowledge (BCK):**  
      *The theory must explicitly violate at least one core assumption of no-trade theorems:*  
      *   *Rationality is not common knowledge, OR*  
      *   *Common priors are absent/unattainable, OR*  
      *   *Information structures prevent common knowledge of actions/strategies.*  
      **Motivation:** STE is mathematically impossible under common knowledge/rationality/common priors. Any theory resolving the paradox *must* break this triad. *This is the formal key unlocking STE.*

  ### Camp-Specific / Negotiable Desiderata (Theory-Dependent)
  6.  **Determinacy of Price Formation (DPF):**  
      *Whether the theory requires prices to be uniquely determined by fundamentals + information at equilibrium (Deterministic) or allows for path-dependence, multiple equilibria, or irreducible randomness (Non-Deterministic).*  
      **Motivation:** Rational Expectations models demand determinacy; noise trader/bounded rationality models often embrace indeterminacy. Neither is logically *required* for core adequacy.

  7.  **Collective Cognition Status (CCS):**  
      *Whether the theory ascribes emergent epistemic properties (e.g., "market wisdom," "collective intelligence") to the market system itself, beyond the sum of individual beliefs.*  
      **Motivation:** Hayekian views often lean towards emergent collective cognition; REH denies it; behavioral finance is agnostic. A theory can be adequate while accepting or denying CCS.

  8.  **Source of Noise/Error (SNE):**  
      *Whether non-informational trading is explained by:*  
      *   *Exogenous shocks/liquidity needs (Traditional REH add-ons),*  
      *   *Systematic cognitive biases (Behavioral Finance), OR*  
      *   *Fundamental uncertainty/radical ignorance (Post-Keynesian/Knightian).*  
      **Motivation:** Explains PIAg's "noise" component. The choice shapes the theory but doesn't inherently resolve/non-resolve the core paradox.

  9.  **Role of Speculation (RoS):**  
      *Whether speculation is viewed as primarily stabilizing (correcting mispricing) or destabilizing (creating bubbles/detaching from fundamentals).*  
      **Motivation:** Central to policy implications but orthogonal to the core epistemic mechanism explaining STE/PIA/PIAg.

  ### Tensions and Exclusions
  *   **The Core Tension Resolved:** Non-negotiable desiderata **BCK** and **SOH** directly confront the no-trade theorem. **BCK** provides the formal escape hatch (breaking common knowledge/rationality/priors). **SOH** provides the deep *mechanism* explaining *why* BCK holds in reality (agents operate with evolving, opaque, incommensurable frameworks).
  *   **Joint Unsatisfiability Warning:** Satisfying **STE** is *impossible* if a theory insists on *all three* conditions of the no-trade theorem triad (common knowledge of rationality, common priors, symmetric information structures). Any adequate theory **must reject at least one** (per **BCK**).
  *   **The Most Discriminating Requirement:** **Strategic Opacity Handling (SOH)** does the most work in excluding popular theories:
      *   **Rational Expectations (REH):** Fails SOH. Assumes homogeneous, correct (or correctable) models and fixed, common interpretation frameworks. Agents are passive Bayesian aggregators.
      *   **Classic Hayekian Views (Prices as Sufficient Statistics):** Often fail SOH(b) and SOH(c). Tend to underplay the endogeneity and inscrutability of interpretive frameworks *in practice*. Prices signal scarcity but don't adequately capture the reflexive hermeneutics of interpretation.
      *   **Simple Noise Trader Models:** May incorporate heterogeneity but often fail SOH(a) and SOH(b) by treating noise as exogenous or based on fixed, simple biases, not endogenously evolving, complex interpretive frameworks.
  *   **SOH** forces the theory to grapple with the market as a complex adaptive system of meaning-making agents, not just information-processing automatons. This is the requirement most likely to push a theory beyond standard economic formalism towards richer cognitive, sociological, or computational foundations.

  In essence, an adequate epistemology must explain *how markets facilitate learning and coordination among deeply heterogeneous, reflexively adapting, and strategically opaque agents*, leading to *persistent trading activity and partially informative prices*, while *formally escaping the no-trade deadlock* by rejecting at least one pillar of the common knowledge/rationality/common priors edifice. **SOH** provides the deepest explanatory challenge to prevailing models.
