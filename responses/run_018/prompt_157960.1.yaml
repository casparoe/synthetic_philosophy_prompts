answer: |-
  Here's a comprehensive desiderata list for any theory of scientific idealization, grounded in real scientific practice and philosophical debate. I'll flag non-negotiables (★), contested points, tensions, and confidence levels.

  ---

  ### **Core Desiderata for Theories of Idealization**  
  *(What the theory MUST explain or accommodate)*  

  1. **★ Explain Predictive Success Despite Unrealism**  
     - **Why**: Theories must account for why models with false assumptions (e.g., frictionless planes in Newtonian physics, rational agents in economics) yield accurate predictions.  
     - **Case**: Climate models omitting cloud microphysics still predict global temperature trends but fail at regional rainfall.  

  2. **★ Distinguish *Useful Simplification* vs. *Causal Misrepresentation***  
     - **Why**: Not all idealizations are equal. Dropping friction simplifies reality; assuming perfect rationality may misrepresent human psychology.  
     - **Case**: Physics idealizations (point masses) simplify causal structure; economic "efficient markets" may distort it by ignoring herd behavior.  

  3. **★ Justify Why Some Idealizations Are *Necessary_**  
     - **Why**: Scientists idealize to make problems tractable. A theory must explain when/why this is unavoidable.  
     - **Case**: Quantum mechanics without relativistic corrections works for chemical bonding but fails in particle accelerators.  

  4. **★ Account for *Domain-Specific Robustness***  
     - **Why**: Idealizations that work in one context (e.g., rational actors in market aggregates) fail in others (e.g., predicting individual behavior).  
     - **Case**: Economics uses rational agents for pricing models but switches to behavioral assumptions for policy (e.g., retirement savings nudges).  

  ---

  ### **Critical Distinctions the Theory Must Preserve**  
  *(Non-negotiable conceptual boundaries)*  

  - **Simplification vs. Misrepresentation**:  
    - **★** Frictionless planes *omit* complexity; "representative agents" in macroeconomics *falsify* heterogeneity.  

  - **Predictive Success vs. Explanatory Depth**:  
    - **★** Climate models predict CO₂-driven warming (predictive) but can't *explain* monsoons without microphysics (explanatory). Friedman prioritizes prediction; others demand explanation.  

  - **Instrumental Reliability vs. Ontological Commitment**:  
    - Should we trust idealizations *only* for forecasts (Friedman) or also as steps toward truth (e.g., Newton → Einstein)?  

  ---

  ### **Contested Desiderata**  
  *(Depends on philosophical camp)*  

  5. **Require Models to Support *Policy Interventions*** (Anti-Friedman)  
     - **Why**: If models justify real-world action (e.g., carbon taxes), assumptions must map to causal levers.  
     - **Tension**: Friedman’s view *can’t* satisfy this. If "assumptions don’t matter," policy based on *why* outcomes occur is unjustified.  
     - **Case**: Rational-agent models support deregulation (Friedman); behavioral models justify nudges (Thaler).  

  6. **Respect Scientists’ *Own Reasoning* About Realism**  
     - **Why**: Scientists often debate which idealizations are harmless (e.g., spherical cows) vs. misleading (e.g., phlogiston).  
     - **Contested**: Realists say this matters; instrumentalists (like Friedman) ignore it.  

  7. **Allow *Progressive De-Idealization***  
     - **Why**: Idealizations should be improvable (e.g., adding friction to physics).  
     - **Contested**: Friedmanians see no need if predictions hold; others demand it for truth-tracking.  

  ---

  ### **Key Tensions & Impossibilities**  

  - **★ Friedman’s Prediction-Only vs. Policy Justification**:  
    - **Jointly impossible**. Policy requires causal understanding (e.g., *why* a carbon tax reduces emissions). If assumptions are "irrelevant," policy is blind.  

  - **Explanatory Depth vs. Computational Tractability**:  
    - Adding cloud microphysics to climate models improves explanation but makes them computationally infeasible for century-scale forecasts.  

  - **Robustness Across Scales**:  
    - Rational agents "work" for stock markets but fail for housing bubbles—no theory resolves this universally.  

  ---

  ### **Confidence Assessment**  
  - **Overall Confidence**: High (90%) – grounded in cross-disciplinary case studies and philosophy of science consensus.  
  - **Least Confident Desideratum**: **#6 (Scientists’ Own Reasoning)**.  
    - **Why Uncertainty**: Scientists’ views vary (e.g., string theorists vs. condensed matter physicists). A theory *prescribing* how scientists *should* regard realism risks being normative rather than descriptive.  

  ### **Bottom Line**  
  Friedman’s "F-twist" (instrumentalism) satisfies only Desiderata 1 and 3, failing at policy justification, causal fidelity, and explanatory depth. A robust theory must navigate the tensions above—especially the prediction/policy divide—without reducing science to "whatever works." Idealization isn’t just *predictive convenience*; it’s a ladder toward understanding, even if some rungs are fictional.
