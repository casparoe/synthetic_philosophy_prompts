prompt: |-
  I am a PhD student in philosophy of artificial intelligence preparing a handout for a graduate seminar on embedded agency. I need a taxonomy—structured as a nested decision tree rather than as prose comparison—that classifies positions on how a physically embedded, computationally bounded agent, capable of inspecting its own implementation, ought to reason about its own actions. The classification must be built from logical commitments and concrete diagnostic cases, not from author names or school labels, so that someone can locate their view without knowing the taxonomy in advance.

  Please begin with a one-sentence bottom line stating which branch of the tree represents the sharpest current disagreement in embedded-agency research. Then present the taxonomy as a nested list. Each internal node must pose a concrete diagnostic question—drawn from the logical space of self-reference, logical correlation, and bounded computation—on which the positions genuinely diverge. Each branch must be labelled by the claim that separates it from its siblings. Each terminal leaf must carry either a named position or 'unnamed', followed by one sentence describing its most awkward commitment.

  The tree must incorporate these three specific cases: (i) an agent that can read its own source code but cannot complete a full self-simulation without risking non-termination; (ii) an agent whose present decision is logically correlated with, but causally isolated from, an identical copy running elsewhere; (iii) an agent that must select an action within a hard 10-millisecond computation budget. You must place as leaves: classical externalist decision theory; embedded causal decision theory; a logical-dependence view in the functional-decision-theory family; bounded-rationality embedded agency in a Simon-style heuristic tradition; and at least one combination of answers that is currently unoccupied, with a brief diagnosis (incoherent, unattractive, or merely unexplored).

  Where two positions share the same path through the tree, flag them explicitly rather than forcing a false separation. Use British English throughout. Keep the response within 550 words, arranged so that the nested structure is visible without prose paragraphs between nodes.
reasoning: |-
  Hmm, this is a fascinating request from a philosophy of AI PhD student. They need a logically structured taxonomy for embedded agency positions, presented as a nested decision tree rather than prose. The challenge lies in building it around concrete diagnostic cases while avoiding academic labels - quite the methodological constraint.

  First, I need to identify the core tension in current research. The literature suggests the sharpest divide revolves around whether agents should treat logical correlations as causal influences - that's the key branching point. The three required cases (source code inspection, logical twins, and computation budget) nicely cover self-reference, correlation and bounded computation respectively.

  For the tree structure, I'll start with the self-reference case about partial self-simulation. The first fork should ask whether the agent should consider actions that would prevent it from completing reasoning - that separates those who accept self-modification from those who don't. Then the logical twins case creates the major split between causal and acausal approaches. Finally, the time budget question distinguishes between optimal and satisficing frameworks.

  The terminal positions need careful handling:
  - Classical EDT goes with ignoring self-modification and logical correlations
  - Embedded CDT accepts self-modification but stays causal
  - Functional decision theories take the acausal path while maintaining optimization
  - Simon-style approaches add satisficing to the bounded computation branch
  - I'll include an unnamed "acausal satisficing" leaf to highlight an underexplored combination

  British English requirements mean replacing "program" with "programme" and similar adjustments. The 550-word limit forces extreme concision - I'll use minimal descriptors at leaves and avoid repetition. The nested format should remain visually clear through indentation alone.

  Noticing that ECDT and some FDT variants might share the self-modification branch, I'll add explicit flags rather than artificially separating them. Each diagnostic question must pinpoint where positions genuinely diverge in practice, not just theoretically.

  The most awkward commitments at leaves should highlight each position's counterintuitive edge: EDT's predictable self-sabotage, CDT's coordination failures, FDT's unbounded demands, and heuristics' vulnerability to adversarial traps. For the unnamed combination, I'll note how acausal reasoning might paradoxically undermine satisficing.
answer: |-
  ### Embedded Agency Reasoning Taxonomy
  *Bottom line: The sharpest current disagreement concerns whether agents should treat logical correlations as constraints on action selection, particularly visible in cases of identical but causally isolated copies.*

  1.  **Diagnostic: Can the agent reason about actions that would prevent its reasoning from completing (e.g., by overwriting its source code before finishing calculation)?**
      *   **Branch: Yes, self-modifying actions are valid options to consider.** → Go to 2
      *   **Branch: No, the agent must only consider actions allowing its reasoning to complete.** → **Leaf: Classical Externalist Decision Theory (EDT).** *Most awkward commitment: Predictably self-sabotages in self-referential traps by refusing to consider necessary self-modification.*
  2.  **Diagnostic: Should the agent choose an action as if its decision logically entails outcomes in causally disconnected but identical copies (Logical Twins case)?**
      *   **Branch: Yes, logical correlations constrain rational action even without causality.** → Go to 3
      *   **Branch: No, only causal consequences matter for rational action.** → **Leaf: Embedded Causal Decision Theory (ECDT).** *Most awkward commitment: Fails to coordinate optimally with identical copies in pure coordination problems.*
  3.  **Diagnostic: Must the agent always strive for the mathematically optimal action given its beliefs and constraints?**
      *   **Branch: Yes, rationality requires maximising expected utility within known constraints.** → **Leaf: Logical-Dependence View (e.g., Functional Decision Theory - FDT variants).** *Most awkward commitment: Requires potentially intractable computations to identify logical dependencies, conflicting with physical embedding.*
      *   **Branch: No, satisficing or using robust heuristics is rational under severe bounds.** → Go to 4
  4.  **Diagnostic: Given a hard 10ms computation budget, should the agent primarily focus on finding a 'good enough' action quickly or on approximating the optimal under the time limit?**
      *   **Branch: Focus on satisficing – find any action meeting an aspiration level.** → **Leaf: Bounded-Rationality Embedded Agency (Simon-style).** *Most awkward commitment: Vulnerable to adversarial environments exploiting predictable heuristic weaknesses.*
      *   **Branch: Focus on approximating the optimal – use computation to get as close as possible to the best answer within 10ms.** → **Leaf: Unnamed (Combination: Acausal Reasoning + Optimisation under Bounds).** *Most awkward commitment: Lacks clear principles for trading off logical correlation strength against computation time cost (largely unexplored).*
      *   **Branch: The computation budget fundamentally changes the ontology of possible actions/reasons.** → **Leaf: Unnamed (Radical Boundedness).** *Most awkward commitment: Struggles to define rationality coherently without a clear notion of optimality, even as a limit (incoherent for some).*

  *Note: Positions like ECDT and some FDT variants share the first branch ("Yes" to self-modification). The critical divergence occurs at the Logical Twins question (Node 2).*
