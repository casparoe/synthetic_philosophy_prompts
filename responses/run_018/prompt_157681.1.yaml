  ### Joint Statement: Constitutive Narrative and Corrective Integration Camps  
  *Regarding the Philosophy of National Myths of Lost Causes*  

  #### **Part 1: Agreed Claims**  
  We, the undersigned representatives of the Constitutive Narrative (CN) and Corrective Integration (CI) camps, affirm the following points of agreement:  

  1. **Historical Cases as Functional Myths**:  
     The myths surrounding historical defeats (e.g., the Confederacy’s "Lost Cause," Masada, Kosovo Polje, Dunkirk) are not incidental historical errors but serve as foundational elements in the identity formation of the communities that uphold them. These narratives persist due to their utility, not solely their factual accuracy.  

  2. **Psychological and Political Functions**:  
     These myths serve demonstrable psychological and political functions, including:  
     - Preserving dignity in the aftermath of collective trauma or defeat.  
     - Providing explanatory coherence for a community’s historical trajectory and contemporary politics.  
     - Reinforcing social bonds through shared symbols of sacrifice or resilience.  
     - Legitimizing political or cultural institutions derived from the mythologized past.  

  3. **Empirical Limits of Both Camps**:  
     Neither camp claims a generalizable law predicting outcomes of myth debunking. Specifically:  
     - CN acknowledges that not all constitutive myths are irreplaceable; some communities adapt successfully to corrected narratives.  
     - CI acknowledges that some myths are so deeply embedded that abrupt correction risks social fragmentation.  
     - Both agree that outcomes depend on contextual variables (e.g., institutional support for correction, pre-existing social cohesion, the myth’s centrality to identity).  

  4. **Shared Recognition of Risks and Values**:  
     - Democracies require balancing epistemic accountability with social stability.  
     - Historical correction is ethically desirable but carries empirical risks (e.g., backlash, alienation).  
     - All lost-cause myths contain a blend of factual claims and expressive values (e.g., honoring sacrifice), which may be in tension.  

  ---

  #### **Part 2: Disagreements Table**  
  *Residual disagreements are structured below. Each camp accepts the wording of its own position. Disagreements are categorized as substantive (S) or verbal (V).*  

  | Issue | Constitutive Narrative (CN) Position | Corrective Integration (CI) Position | Type |  
  |-------|--------------------------------------|--------------------------------------|------|  
  | **Identity Robustness** | Social cohesion is fragile when a constitutive myth is debunked because group identity relies on the narrative’s specific propositional content; correction risks dissolution if no functionally identical replacement exists. | Group identity is robust enough to integrate corrected narratives; cohesion can be preserved through revised commemorative practices that decouple expressive functions from inaccurate propositions. | S |  
  | **Democratic Epistemic Accountability** | Democratic legitimacy permits communities to prioritize social stability over factual accuracy when a myth is load-bearing for collective self-respect, provided no harm is inflicted on out-groups. | Democratic legitimacy requires correcting false propositions in official narratives, as uncritical tolerance of falsehoods undermines collective self-governance and perpetuates epistemic injustice. | S |  
  | **Functional Replaceability** | The expressive value of a myth (e.g., dignity in defeat) is inseparable from its propositional content; altering facts inherently degrades the myth’s psychological function. | The expressive value of a myth can be preserved through ritually adapted commemorations (e.g., refocusing on universal themes like resilience) without retaining false propositions. | S |  
  | **Scope of "Myth"** | Myths are primarily structural frameworks for agency and identity; propositional accuracy is secondary to their role in sustaining collective self-understanding. | Myths are narratives blending factual claims and values; their propositional content is inherently subject to empirical scrutiny and revision. | V |  

  ---

  #### **Part 3: Cruxes**  
  We identify two cruxes whose resolution would materially advance the debate. For each, we provide a shared test case and pre-commit to predictions.  

  **Crux (i): Mnemonic Sovereignty and False Propositions**  
  *Question: Can "mnemonic sovereignty" justify maintaining demonstrably false propositions when they are load-bearing for collective self-respect?*  
  - **CN Prediction**: Yes, because the myth’s structural role in sustaining self-respect outweighs epistemic concerns; debunking fractures cohesion when alternatives are absent.  
  - **CI Prediction**: No, because democratic mnemonic practices cannot exempt foundational myths from truth-tests without delegitimizing the polity.  

  **Shared Test Case: Dunkirk vs. American Lost Cause**  
  - *Background*: Dunkirk’s myth (heroic retreat) integrated factual corrections with minimal cohesion loss; the Lost Cause myth (Confederate nobility) resisted correction with sustained conflict.  
  - **CN Prediction**: Debunking a *Dunkirk-level* falsehood (e.g., exaggerating civilian boat involvement) would cause minimal cohesion damage, as the myth is less identity-critical than the Lost Cause. The Lost Cause’s centrality explains its resistance: debunking fractures cohesion where myths define collective dignity.  
  - **CI Prediction**: Dunkirk-level debunking caused little damage because expressive values (national unity) were preserved through corrected commemoration. The Lost Cause’s resistance reflects poor integration management, not inherent fragility; cohesion need not suffer with skillful correction.  

  **Crux (ii): Separability of Expressive Value and Propositional Content**  
  *Question: Can the expressive value of a lost-cause myth (e.g., honoring sacrifice) be preserved if its propositional content (e.g., moral purity of the cause) is corrected?*  
  - **CN Prediction**: No, because expressive value derives from the specific narrative content; altering facts (e.g., "states’ rights" as slavery’s proxy) dissolves the emotional resonance.  
  - **CI Prediction**: Yes, because expressive value resides in abstract themes (e.g., courage) separable from facts; corrected practices (e.g., memorializing sacrifice without glorifying the cause) retain functionality.  

  **Shared Argument: Masada**  
  - *Case*: Masada’s myth (Jewish rebels’ mass suicide as heroic defiance) faces historical challenges (e.g., suicide as cultural taboo).  
  - **CN Interpretation**: Correcting the suicide narrative undermines the myth’s core expressive value (ultimate sacrifice for freedom), as content and symbolism are fused.  
  - **CI Interpretation**: Masada’s expressive value (resistance against oppression) persists in Israeli commemorations despite academic corrections, proving themes transcend particulars.  

  ---

  **Values Judgment Flag**:  
  The disagreement over **Crux (i)** reduces to an irresolvable values conflict: *the priority of social cohesion versus epistemic rigor in democratic legitimacy*. Empirical data cannot settle this normative weighting.  

