  Let me understand the constraints: it needs to be in an ordinary institutional context (like a hospital or school), confined to one paragraph. The belief B must be about a specific, checkable non-moral fact - something like safety of a procedure or structural integrity. The harm must come solely from the agent's own actions guided by B, not from deceiving others. After presenting it, I need to analyze the right-kind vs wrong-kind reasons, explain why evidence is ethically blocked, show this isn't just epistemic vs moral duty conflict, and discuss how the pragmatic belief is genuinely belief-like.

  Hmm... I'm considering a hospital setting since it provides clear stakes. Let me sketch: Dr. Aris is about to approve a drug shipment for critically ill children. The pharmacy system flags an unresolved safety query about the drug. If she investigates (evidential path), she'd find evidence that the drug is safe, but the delay would cause children to die due to treatment interruption. If she believes it's safe without checking (pragmatic belief), she approves immediately, saving lives.

  For belief B: "The drug is safe for pediatric use." Right-kind reasons would be the evidence she'd find if she investigated. Wrong-kind reasons are the moral imperative to save lives by not delaying. The harm comes from her delay in investigating, not from deception.

