answer: |-
  Here’s a reusable 15-minute checklist for your deliberation group, incorporating epistemic modesty, transparency thresholds, and reference-class ambiguity. **Spelling note:** It’s "epistemic" (not "epistimic") modesty.

  ---

  ### **Epistemic Modesty Decision Checklist**  
  *(Run in order; stop if "No Update" or "Defer" is triggered)*  

  1. **CLAIM CLARITY**  
     - *Task:* Restate the claim in one sentence.  
     - *Pass:* Claim is falsifiable and unambiguous (e.g., "Metric X is unreliable for hiring").  
     - *Fail:* → **"No Update"** (vague claims like "This policy is unfair" fail).  

  2. **INSIDE-VIEW TRANSPARENCY**  
     - *Task:* Can the arguer explain their causal chain in ≤200 words without filler?  
     - *Pass:* Clear step-by-step reasoning (e.g., "A causes B because C, leading to D").  
     - *Fail:* → Apply **domain-distance penalty**:  
       - Near domain (e.g., philosophy/logic): Scale argument weight ×0.5.  
       - Far domain (e.g., climate science/AI risk): Scale ×0.2.  
     - *Judgement Call:* Deciding "near" vs. "far" domains.  

  3. **OUTSIDE-VIEW BASE RATE**  
     - *Task:* Identify a reference class for the claim (e.g., "similar fairness metrics" or "reparations policies").  
     - *Clear Base Rate:* Reliable data exists for the *exact* claim → **Defer to base rate** (e.g., "90% of similar metrics fail").  
     - *Ambiguous Base Rate:* Data is from a broader/distant class (e.g., "policy success rates") → Flag as **noisy outside view**.  
     - *No Base Rate:* → Proceed to Step 4.  
     - *Judgement Call:* Defining the reference class.  

  4. **FINAL WEIGHTING**  
     - Compare the (penalized) inside view vs. outside view:  
       - Inside view stronger: **Update toward inside view**.  
       - Outside view stronger: **Defer to base rate**.  
       - Tie/Uncertain: **"No Update"** (insufficient evidence).  

  ---

  ### **Applied to Hypothetical Arguments**  

  **1. CS Grad Student: "Fairness metric X is unreliable due to Simpson’s Paradox."**  
     - **Step 1 (Clarity):** PASS ("Metric X fails under subgroup analysis").  
     - **Step 2 (Transparency):** PASS (Simpson’s Paradox analogy explained in 150 words).  
     - **Step 3 (Base Rate):** AMBIGUOUS (no data on *this exact metric*; broader class "fairness metrics" has mixed reliability → noisy outside view).  
     - **Step 4:** Inside view (strong) vs. noisy outside → **UPDATE toward inside view**.  

  **2. Econ Undergrad: "Carbon-tax reparations are morally necessary (historical analogy to post-WWII Marshall Plan)."**  
     - **Step 1:** PASS ("Nations owe climate reparations via carbon tax").  
     - **Step 2 (Transparency):** FAIL (relies on moral intuition; no causal chain → penalize ×0.5 for "near domain" economics).  
     - **Step 3 (Base Rate):** AMBIGUOUS (no direct data; historical policy success rates are noisy → weak outside view).  
     - **Step 4:** Penalized inside view (weak) vs. weak outside → **NO UPDATE**.  

  **3. Your Belief: "AI existential risk is overblown."**  
     - **Step 1:** PASS ("AI X-risk probability is <1%").  
     - **Step 2 (Transparency):** FAIL (complex chain: e.g., "Alignment isn’t hard because... [unclear mechanics]" → penalize ×0.2 for *far domain*).  
     - **Step 3 (Base Rate):** AMBIGUOUS (no AI x-risk data; broader class "tech predictions" fails often → noisy but strong outside view).  
     - **Step 4:** Penalized inside view (very weak) vs. outside → **DEFER to base rate** (downgrade your belief).  

  ---

  ### **Key Features**  
  - **Speed:** Uses binary gates (pass/fail), scales arguments quantitatively.  
  - **Epistemic Modesty:** Penalizes opacity, forces domain awareness, defers to data.  
  - **Judgement Flags:** Steps 2 (domain distance) & 3 (reference class) are subjective but structured.  
  - **Outputs:** "Update," "Defer," or "No Update" — no ambiguous middle ground.  

  This forces downgrading beliefs (like your AI risk view) when reasoning is untraceable or domain-distant, even if uncomfortable. Run it as a 15-min group vote: assign roles (e.g., "Clarity Checker," "Base Rate Researcher").
