prompt: |-
  hey i'm in this philosophy seminar on rational belief and we just got deep into inside view vs outside view plus this concept of epistemic modesty — like you have to apply a penalty to your own reasoning weight if you can't fully trace the steps. i also run this little campus deliberation group where people show up with arguments about random policy stuff (last week was algorithmic fairness, this week might be climate reparations) and we vote on whether to update our collective stance. i need a reusable decision procedure i can actually run in about 15 minutes with no stats background, ordered like a checklist, that tells me when inside view wins, when outside view kills it, and where the theory just stops and i have to use my own judgement.

  to keep it from being totally generic, i want to bake in this thing my prof calls the "transparency threshold": if i can't write out the reasoning chain in under 200 words without using filler like "obviously" or "it stands to reason", then the inside-view weight gets scaled by a "domain-distance factor" — 0.5 if the topic is near my coursework, 0.2 if it's far away. also need to handle "reference-class ambiguity" — when there's no clear base rate for the exact claim, i have to pull from a broader reference class but flag that the outside view is now noisy. the checklist should specify what counts as passing each gate, where it outputs "no update" or "defer to base rate", and explicitly mark the steps that are still judgement calls dressed up as procedure.

  then run it on three hypothetical arguments: first, a cs grad student making an inside-view case that a specific fairness metric is unreliable because of analogies to simpson's paradox; second, an econ undergrad arguing for a carbon-tax reparations scheme mostly from moral intuition with one historical comparison; third, apply it to my own belief that ai existential risk is overblown — i want to see the procedure tell me to downgrade my own view because of poor transparency or high domain distance, even though i don't want to hear that. please don't include any reading lists or citations since i don't have library access right now and i'm typing this on my phone. also i keep writing "epistimic modesty" in my notes so please correct the spelling in your explanation.
