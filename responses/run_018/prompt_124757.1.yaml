  The testimony angle is fascinating. Humans calibrate speaker reliability through shared context and transparency (mostly). But with AI, there's no mind, no intentionality—just statistical patterns masked as reasoning. Calling it "synthetic testimony" feels right because it mimics human exchange while being fundamentally alien. Does this collapse into standard epistemology? Partially, but with scary new wrinkles: no possibility of accessing reasoning, no consequences for dishonesty, and scale that normalizes dependence. 

