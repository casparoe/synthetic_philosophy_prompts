answer: |-
  Based on your goals (prioritizing upstream impact, tractability for independent work, and relevance beyond pure intuition pumps), here’s a defended prioritization of your four lines of inquiry, with clear criteria and actionable advice:

  **Top Priority (Invest 60-70% of effort):**  
  **#2: Does XOR blackmail expose a structural flaw in CDT, or dissolve with granular causal models?**  
  - *Why upstream?* This is the **conceptual keystone**. If CDT’s dominance reasoning inherently fails here, it forces a rewrite of rational agency foundations. If it dissolves under granular causality, it neuters the paradox’s threat and reframes others as modeling errors.  
  - *Tractability:* High. You can rigorously map causal diagrams (e.g., using structural equation models) without advanced math. Test scenarios by adding/removing nodes (e.g., "Does adding a *predictor’s verification mechanism* change outcomes?").  
  - *Impact on adjacent debates:* Highest. Reshapes #1 (EDT’s viability depends on CDT’s weakness), #4 (legitimacy hinges on whether muggings exploit causal ignorance), and #3 (institutions must model causality correctly).  
  - *Practical connection:* Forces clarity on *what causal structures* real-world institutions (e.g., algorithmic audits) must represent to avoid exploitation.  
  - *Evidence that would change this ranking:* If you find XOR-type failures persist even in exhaustively specified causal models (e.g., with predictor’s decision process explicit), it confirms a deep flaw. If they vanish, deprioritize #1 and #4.

  **Second Priority (Invest 20-30% of effort):**  
  **#4: Principled criterion distinguishing legitimate incentives from mugging.**  
  - *Why upstream?* Directly addresses the **normative core** of your "causal levers" concern. A successful criterion would filter which predictive practices institutions (#3) should permit and clarify when cooperation (#1) is rational vs. exploitative.  
  - *Tractability:* Moderate. Requires constructing and stress-testing definitions (e.g., "Does your criterion ban *all* mutually beneficial prediction contracts?"). Use your nested-agent variant to probe boundary cases. Avoid abstract ethics; focus on structural features (e.g., "Does the predictor incur costs?", "Is the threat contingent on *avoidable* ignorance?").  
  - *Impact:* Resolves ambiguities in #3 (institutional design) and constrains #1 (if mugging is "illegitimate," EDT’s cooperation may be irrational).  
  - *Practical connection:* Critical for designing prediction markets or audits where incentives could morph into coercion.  
  - *Evidence that would change this ranking:* If all candidate criteria either collapse into circularity (e.g., "muggings are unfair") or fail to exclude obvious muggings, shift focus to #3.

  **Deprioritize (Revisit if core work resolves):**  
  - **#1 (EDT in multi-agent settings):** While fascinating, this likely *depends* on #2’s outcome. If CDT survives granular modeling, EDT’s instability becomes a curiosity, not a crisis. Nested cases risk infinite regress that’s hard to tame without formal tools.  
  - **#3 (Real-world institutional design):** Currently the *most downstream*. Without answers to #2 and #4, design proposals will lack foundations. Practicality is a strength, but premature without theoretical clarity.  

  **Decision Flow for Your Semester:**  
  1. **Weeks 1–4:** Attack #2. Build 3–5 variants of XOR blackmail with increasingly granular causal models (e.g., add B’s cost of prediction, A’s awareness of B’s model). Use these to test CDT: does dominance reasoning hold?  
  2. **Weeks 5–8:** Based on #2’s results, pivot to #4. If CDT holds, ask: "*When does a granular causal model make a mugging illegitimate?*" If CDT fails, ask: "*What norm protects agents from self-defeating predictions?*"  
  3. **Weeks 9–12:** Pressure-test your criterion from #4 against your nested-agent setup. If time permits, explore implications for #3 (e.g., "Should auditors hide their predictive methods?").  

  **Critical Evidence to Watch For:**  
  - In #2: Does *any* causal model make XOR blackmail *rational to comply with* under CDT? If yes, CDT has a flaw. If not, the paradox was underspecified.  
  - In #4: Can you distinguish mugging from e.g., an insurance contract using only *procedural features* (e.g., "The predictor must commit to an action before your decision") without invoking fairness?  

  **Why This Agenda?**  
  #2 cuts deepest: it challenges whether standard rationality *can function* in a predictive world. #4 then builds guardrails for that world. Together, they transform the puzzles from paradoxes into design constraints. The deprioritized questions become derivative: #1 relies on #2’s outcome, and #3 requires both to avoid building on sand. Your nested-agent variant is your weapon—use it to probe both granular causality (#2) and legitimacy conditions (#4). If at any point your experiments show consistent, granular causal models *eliminate* the tension, the field’s foundations are sturdier than they appear; if not, you’ve exposed a fracture that demands new theory.
