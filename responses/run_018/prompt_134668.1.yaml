reasoning: |-
  We are ranking five norms specifically for the context of "black-box relay" cases, where one asserts a finding from a source (like a climate model or ML diagnostic) that one cannot verify mechanistically but has meta-evidence of the source's reliability in the domain.

  The norms:
  1. Knowledge norm: assert p only if you know p.
  2. Bare truth norm: assert p only if p is true.
  3. Reasonable-belief norm: assert p only if it's reasonable for you to believe p.
  4. Justified-belief norm: assert p only if you have adequate justification.
  5. Proxy-trust norm: assertion is permitted if you've calibrated the source's domain-specific track record, even if you can't evaluate p directly.

  Ranking criteria for the context:
  - We are in a setting where direct verification is impossible (black-box). Therefore, norms that require direct access to the truth or internal mechanism are problematic.
  - The key is meta-evidence: having good reason to trust the source in the domain.

  Reasoning by norm:

  1. Knowledge norm: In black-box cases, you typically don't "know" p in the traditional sense because you lack direct access to the facts or the mechanism. Knowledge usually requires justification and truth, but in this case, you are relying on a source. So this norm might be too strict.

  2. Bare truth norm: This only cares about the truth of p, regardless of your evidence. But in practice, we don't have direct access to truth. So this norm doesn't guide action and is not appropriate for this context because we are dealing with evidence and reliability, not omniscience.

  3. Reasonable-belief norm: This is about whether it is reasonable for you to believe p. In the black-box case, if you have meta-evidence of the source's reliability, it might be reasonable to believe. However, "reasonable" can be vague and might not require as strong a justification as other norms.

  4. Justified-belief norm: This requires adequate justification for p. In the black-box case, the meta-evidence about the source's track record can provide such justification. This seems well-suited because we are emphasizing the evidence for reliability.

  5. Proxy-trust norm: This norm is tailored for the black-box situation. It explicitly allows assertion when you've calibrated the source's domain-specific track record, even without direct evaluation of p. This directly fits the context.

  Ranking (tiers: S, A, B, C, F; scores 1-10):

  - Tier S: Best for the context, fits perfectly (score 9-10)
  - Tier A: Very good, but not perfect (score 8-9)
  - Tier B: Good but has some issues (score 6-7)
  - Tier C: Mediocre, not well-suited (score 4-5)
  - Tier F: Poor, inappropriate (score 1-3)

  Ranking the norms for black-box relay:

  1. Proxy-trust norm (5): This is designed for the case. It allows assertion based on calibrated trust in the source. In the context, this is ideal. Tier S, score 10.

  2. Justified-belief norm (4): Having adequate justification is key. The meta-evidence about the source's reliability can provide that justification. It's a strong norm, but the proxy-trust norm is more specific. Tier A, score 9.

  3. Reasonable-belief norm (3): It is reasonable to believe p based on the source's reliability. However, "reasonable" might be interpreted more subjectively and might not require as rigorous a standard as justification. Still, it's acceptable. Tier B, score 7.

  4. Knowledge norm (1): In black-box cases, you don't typically have knowledge (because you lack direct access to the facts and the mechanism). So this norm would forbid assertion in precisely the cases we are considering, which is too restrictive. Tier C, score 4.

  5. Bare truth norm (2): This norm is not action-guiding because we cannot know the truth without evidence. It doesn't consider the epistemic position of the asserter. In practice, we have to rely on evidence, not truth alone. Tier F, score 2.

  Bottom line: The one norm I'd defend for this context is the proxy-trust norm because it is explicitly designed for relying on black-box sources with calibrated track records.

