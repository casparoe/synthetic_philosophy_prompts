  **Editor 2:** (wiping beer foam off his chin) Yeah? And how d’you know it *stays* romance? What if after chapter twenty, it goes full *Handmaid’s Tale*? You’ve only observed the first half. For all you know, this manuscript’s **grue-romance**.  

  **Editor 1:** The fuck’s grue-romance? You just made that up.  

  **Editor 2:** Nah, man, it’s like Goodmans emeralds. Grue’s green before 2030, blue after—except here? **It’s romance if you’re reading it *before* the climax, dystopian after.** Same words, same pages. But if you hit the turning point *before* midnight tonight? Fluffy HEA. Read past midnight? Boom, secret police kick down the door, the lovers get shipped to a lithium mine. It’s all in the *when*.  

  **Editor 1:** (squinting) That’s stupid. Genre doesn’t care when *I* read it. The story’s fixed.  

  **Editor 2:** Is it? Why’s "romance" projectible but "grue-romance" ain’t? Both fit the data so far! You say "romance" cause you’re assuming the predicate holds *through narrative time*—like, future chapters obey past genre rules. But grue-romance? It’s indexed to *real* time. Breaks induction cause now you’ve got two predicates that work till *now*, but diverge later.  

  **Editor 1:** But—the manuscript’s *done*. It’s printed.  

  **Editor 2:** Doesn’t matter! Goodman’s point! **The asymmetry’s in the projection—** "romance" doesn’t sneak a time bomb into its definition. It just *is*, across the story’s own timeline. But grue-romance? It’s parasitic. Leans on *our* clock, not the narrative’s. So yeah, you can call it romance now... but if we define genres modally—like, properties that *only* project forward along the plot—then grue-romance ain’t projectible. It’s a fucking tautology with a expiration date.  

  **Editor 1:** (stares into his whiskey) So... you’re saying if I read the climax after last call, my cozy romance becomes a manual for prison reform?  

  **Editor 2:** (grinning) Exactly. And that’s why induction’s a bitch. We only trust predicates that don’t cheat with hidden clocks. **Romance projects ’cause it lives in the story’s time. Grue-romance? That’s just genre with a knife to its own throat.**  

  **Editor 1:** ...I hate philosophy. And you. Pass the peanuts.  

