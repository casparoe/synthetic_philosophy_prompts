          Why? 
            - If a strategy s_i is strictly dominated by a mixed strategy σ_i, then for every strategy of the opponent, σ_i gives a higher payoff than s_i. Therefore, no matter what belief (probability distribution over opponent's strategies) you have, the expected payoff of σ_i is higher than s_i. Hence, s_i cannot be a best response to any belief.

          Conversely, if s_i is never a best response, then there exists a mixed strategy that dominates it (by a separating hyperplane theorem).

