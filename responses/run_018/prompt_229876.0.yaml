       - Issue: Students may not accept the idea of comparing expected payoffs when the actual payoff is random. 
            Handling: Emphasize that if the game is played repeatedly, the average will be close to the expected value. Also, with small stakes, risk aversion is minimized.

       - Issue: The Column player might not choose arbitrarily. In our example, they are indifferent, so they might choose arbitrarily. But if we want to show that the mixture is better regardless, then we need to consider both possibilities. We did that by computation.

       - Issue: In the warm-up, the elimination might be done incorrectly. 
            Handling: Walk through the dominance step by step, with the whole class.

       - Issue: Time management. 
            Handling: Keep a strict timer. In Stage 2, if time is short, skip playing the 2x2 game.

     Full matrices and rules:

       Stage 1 Matrix (warm-up):

          |        | Column L | Column M | Column R |
          |--------|----------|----------|----------|
          | Row T  |  1, 2    |  2, 3    |  0, 1    |
          | Row M  |  3, 1    |  1, 2    |  2, 0    |
          | Row B  |  0, 3    |  1, 0    |  3, 2    |

          Elimination order:
            - Column R is dominated by Column L (for Column player) -> eliminate R.
            - Then Row B is dominated by Row T -> eliminate B.
            - Then Column L is dominated by Column M -> eliminate L.
            - Then Row chooses T (because T gives 2 and M gives 1 against M).

       Stage 2 Matrix:

          |          | Column Left | Column Right |
          |----------|-------------|--------------|
          | Row Up   |    2, 0     |    -1, 0     |
          | Row Down |   -1, 0     |     2, 0     |
          | Row Mid  |    0, 0     |     0, 0     |

          Rules for mixing: 
            - When we consider eliminating Mid, we introduce a die (or coin). 
            - For Row, the mixture of Up and Down: we define it as 50% Up and 50% Down. 
            - We show that against Left: 
                  Expected payoff = 0.5 * 2 + 0.5 * (-1) = 0.5
              against Right:
                  Expected payoff = 0.5 * (-1) + 0.5 * 2 = 0.5
            - Compare to Mid: 0 in both cases -> so the mixture strictly dominates Mid.

          Therefore, we eliminate Mid.

          The remaining matrix:

          |          | Column Left | Column Right |
          |----------|-------------|--------------|
          | Row Up   |    2, 0     |    -1, 0     |
          | Row Down |   -1, 0     |     2, 0     |

          Then we stop because there is no further dominance.

     Timeline:

       0-5 min: Introduction to the activity and explanation of the rules for Stage 1.

       5-20 min: Stage 1 - Warm-up
            - Play 2 rounds without elimination (ask Row and Column to choose simultaneously, reveal payoffs).
            - Then start elimination: ask for dominated strategies step by step.
            - After each elimination, remove the row/column from the board.

       20-45 min: Stage 2 - Mixed Strategy Example
            - Present the new matrix.
            - Play 3 rounds without elimination (record choices and payoffs).
            - Ask: "Can we eliminate any strategy by pure dominance?" (expect no)
            - Introduce the mixed strategy for Row (coin flip between Up and Down).
            - Compute expected payoffs and compare to Mid.
            - Conclude that Mid is strictly dominated -> eliminate it.
            - Now we have a 2x2. Play 1 or 2 rounds if time.

       45-70 min: Debrief
            - Recap what happened in both stages.
            - Formal concepts:
                 a. Strict dominance by a pure strategy: Stage 1.
                 b. When that stalls, we need mixed strategies: Stage 2.
                 c. Definition: A strategy s_i is strictly dominated by a mixed strategy σ_i if for every strategy of the opponents, the expected payoff of σ_i is strictly greater than that of s_i.
            - Why mixed strategies are necessary for iterated elimination to continue?
            - Connection to rationality: 
                  - Rational players won't play strictly dominated strategies.
                  - Common knowledge of rationality implies that players can iteratively eliminate such strategies.
            - The condition for strict dominance by a mixed strategy: it is equivalent to the strategy never being a best response to any belief about the opponents.
            - Note: The activity does not cover how to find the mixed strategy that does the dominating (we supplied it). In general, it might be hard, but the point is that if such a mixture exists, the strategy should be eliminated.

       70-75 min: Wrap up and collect feedback.

     Materials:
       - Projector or board to display the matrices.
       - Dice or coin for Stage 2.
       - Candy or small rewards for participation and/or for winning rounds.

     Note: The stakes are small, so we don't expect big monetary gains. The reward is mostly for engagement.

     Adjust if needed for time.

     This design should fit within 75 minutes and meet the learning objectives.
answer: |-
  ### Classroom Game Design: Discovering Mixed Strategy Dominance

  **Objective:** Help students understand why mixed strategies must be included in iterated elimination of strictly dominated strategies (IESDS) through experiential learning.  
  **Time:** 75 minutes  
  **Participants:** 16 undergraduates (split into two groups: **Row** and **Column** players).  
  **Stakes:** Small rewards (e.g., candy, extra credit points) for round winners.  

  ---

  ### **Stage 1: Warm-Up with Pure Strategy Dominance (15 min)**  
  **Goal:** Practice IESDS using pure strategies only.  
  **Game:** *Modified Prisoner’s Dilemma* (3×3 matrix)  

  **Payoff Matrix (Row, Column):**  
  |          | Cooperate (C) | Defect (D) | Punish (P) |  
  |----------|---------------|------------|------------|  
  | Cooperate | 3, 3         | 0, 5       | 1, 1       |  
  | Defect   | 5, 0         | 1, 1       | 0, 0       |  
  | Punish   | 1, 1         | 0, 0       | 0.5, 0.5   |  

  **Rules:**  
  1. Divide class into **Row** (8 students) and **Column** (8 students). Each subgroup of 4 within Row/Column consults to pick a strategy.  
  2. Play 3 rounds:  
     - **Round 1:** Groups choose simultaneously (no elimination). Reveal payoffs.  
     - **Round 2:** Facilitator asks, "Is any strategy *always worse* than another?" Guide students to see:  
       - For Column: *Punish (P)* is strictly dominated by *Cooperate (C)* (1<3, 0<5, 0.5<1). Eliminate **P**.  
     - **Round 3:** New matrix (remove P):  
       |          | C      | D      |  
       |----------|--------|--------|  
       | Cooperate| 3, 3   | 0, 5   |  
       | Defect  | 5, 0   | 1, 1   |  
       | Punish  | 1, 1   | 0, 0   |  
       - Students identify *Punish* as dominated by *Cooperate* for Row (1<3, 0<0? → **stall**).  
       - **Key insight:** *Punish* isn’t dominated by any *single* pure strategy (beats nothing uniformly).  

  **Timeline:**  
  - 0–5 min: Explain rules, play Round 1.  
  - 5–10 min: Discuss dominance, eliminate Column P. Play Round 2.  
  - 10–15 min: Attempt to eliminate Row Punish → fail. Highlight stall.  

  ---

  ### **Stage 2: Mixed Strategy Breakthrough (25 min)**  
  **Goal:** Show a strategy strictly dominated only by a mixed strategy.  
  **Game:** *Safety vs. Risk* (3×2 matrix)  

  **Payoff Matrix (Row, Column):**  
  |          | Safe (S) | Risky (R) |  
  |----------|----------|-----------|  
  | Bold     | 4, 2     | 1, 4      |  
  | Cautious | 2, 3     | 3, 1      |  
  | Neutral  | 0, 0     | 0, 0      |  

  **Rules:**  
  1. Play 2 initial rounds (no elimination):  
     - Row and Column choose simultaneously. Record payoffs.  
  2. **Stall point:** Ask, "Can we eliminate any strategy now?"  
     - *Pure dominance check:*  
       - Bold vs. Cautious: 4>2 (S) but 1<3 (R) → no dominance.  
       - Neutral vs. others: 0<4 (S-Bold), but 0=0 (R-Neutral) → no pure dominance.  
  3. **Introduce mixed strategies:**  
     - Give Row a die (or cards: ♥=Bold, ♠=Cautious, shuffled).  
     - "What if Row randomizes between Bold (2/3) and Cautious (1/3)?"  
     - Calculate expected payoffs vs. Column:  
       - If Column plays S: (2/3)(4) + (1/3)(2) = 10/3 ≈ 3.33 > 0  
       - If Column plays R: (2/3)(1) + (1/3)(3) = 5/3 ≈ 1.67 > 0  
     - **Reveal:** Neutral (0,0) is strictly dominated by this mixture.  
  4. **Play with mixture:**  
     - Row rolls die: 1–4 → Bold, 5–6 → Cautious.  
     - Column chooses S or R.  
     - Repeat 3 times. Average Row payoff > 0 (Neutral’s payoff).  
  5. Eliminate **Neutral**. New matrix:  
     |          | S      | R      |  
     |----------|--------|--------|  
     | Bold     | 4, 2   | 1, 4   |  
     | Cautious | 2, 3   | 3, 1   |  

  **Timeline:**  
  - 15–20 min: Play rounds, identify stall.  
  - 20–25 min: Introduce die, compute expected payoffs.  
  - 25–35 min: Play with mixture, eliminate Neutral.  
  - 35–40 min: Discuss why elimination could continue.  

  ---

  ### **Debrief (25 min)**  
  **Map the Experience to Theory:**  
  1. **Mixed dominance:**  
     - Neutral was strictly dominated by a mixed strategy (2/3 Bold, 1/3 Cautious) but *not* by any pure strategy.  
     - **Formal definition:** A strategy \( s_i \) is strictly dominated if there exists a mixed strategy \( \sigma_i \) such that \( \forall s_{-i}, u_i(\sigma_i, s_{-i}) > u_i(s_i, s_{-i}) \).  

  2. **Connection to best responses:**  
     - "Why eliminate Neutral? Because it’s **never a best response** to any belief about Column’s play."  
       - If Column plays S: Best response is Bold (4 > 2 or 0).  
       - If Column plays R: Best response is Cautious (3 > 1 or 0).  
       - Neutral (0) is never best → rationally eliminable.  

  3. **IESDS and common knowledge of rationality:**  
     - Iterated elimination with mixed strategies reflects deeper rationality: players know opponents won’t play dominated strategies, and this knowledge is mutual.  
     - **Limitation of pure IESDS:** Stalls prematurely (as in Stage 1). Mixed IESDS refines predictions.  

  **What the Game Cannot Reproduce:**  
  - **Finding the mixture:** Students didn’t *discover* the 2/3:1/3 mix; it was provided. The facilitator must clarify that in general, finding dominating mixtures requires solving inequalities (e.g., \( 4p + 2(1-p) > 0 \) and \( p + 3(1-p) > 0 \) for \( p \in [0,1] \)).  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem:** Students resist comparing expected payoffs ("But I might get 1, which is worse than 0!").  
     **Solution:** Emphasize rationality as maximizing *expected* utility. Use repeated die rolls to show averages beat 0.  

  2. **Problem:** Column player apathy (payoffs identical in Stage 2).  
     **Solution:** Add small incentives (e.g., "Column wins if payoff > 2"). Use:  
     |          | S      | R      |  
     |----------|--------|--------|  
     | Bold     | 4, 2   | 1, 4   |  
     | Cautious | 2, 3   | 3, 1   |  

  3. **Problem:** Time crunch in Stage 2.  
     **Solution:** Pre-calculate expected payoffs; skip multiple die rolls. Focus on intuition.  

  4. **Problem:** Misidentifying dominance.  
     **Solution:** Use visual aids (highlighters on matrices) and subgroup discussions for consensus.  

  ---

  **Materials:**  
  - Projector/whiteboard for matrices.  
  - Dice (or playing cards: ♥/♠ for Bold/Cautious).  
  - Candy/extra credit for rewards.  

  **Outcome:** Students experience why mixed strategies are essential for IESDS, linking intuition (stall → dice → elimination) to formal concepts (dominance, best responses, common knowledge).
