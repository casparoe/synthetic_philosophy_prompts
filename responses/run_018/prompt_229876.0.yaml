       - The game does not naturally lead the students to invent the idea of mixed strategies. We introduce it. The facilitator must supply the idea that players can randomize.

       - The concept of expected utility and risk neutrality is assumed. Some students might be risk averse, but we assume they are risk neutral in the game because the stakes are small.

       - The formal connection to "never a best response" might be abstract. The facilitator must explain it.

