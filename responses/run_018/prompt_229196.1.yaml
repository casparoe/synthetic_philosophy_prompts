prompt: |-
  So I work for a mid-sized health insurer and I recently got moved onto the panel that decides which treatments we cover as "medically necessary" and which we exclude as elective or cosmetic-ish. We get maybe 40 of these a month, mostly contested stuff: growth hormone for kids who are short but not hormone-deficient, stimulants for people without a diagnosis who say they can't function at their jobs, laser work, a guy who wants his ACL repaired in a way that would leave the knee stronger than it was pre-injury, that sort of thing. Right now the panel basically argues each one from scratch and the decisions are all over the place -- I'm pretty sure the same request would get approved or denied depending who's on shift.

  What I want is an actual procedure we could run in maybe 20-30 minutes per case, built on whatever the right way to think about the difference between treating a problem and just upgrading a person is. Like, the ordered list of questions, what counts as a good enough answer to move to the next one, where a "no" at some step just kills the application, and where the procedure should stop and admit it's a values call that has to go to a human vote rather than a checkbox. We're doctors and claims people, not philosophers, so it has to be runnable by someone who has never read anything on this topic. Also flag where the procedure will probably give wrong answers, because I assume it will sometimes.

  A few things I'm already stuck on that it should handle: normal ranges are statistical, so "restore to normal function" gets weird when someone is naturally at the bottom of the range and wants to be moved up to average. Also species-typical functioning sounds clean until you hit someone who was born without a trait most humans have but isnt suffering in any measurable way. And there's the question of whether we should be comparing the patient to themselves-before, to the population average, or to some ideal.

  Then actually run the procedure on three cases so I can see it working: (1) a 13 year old boy, no hormone deficiency, predicted adult height around 5'4", getting bullied, parents pushing hard; (2) a night-shift nurse with no diagnosis who wants a wakefulness drug she says she needs to not make errors; (3) a recreational runner whose knee surgery could be done the standard way or with a graft that testing suggests would make the joint more stable than it ever was. At least one of these should come out with an answer I'll hate, because if the procedure only ever agrees with my gut it's not doing anything. And be upfront about what this kind of checklist just cant capture no matter how we tinker with it.
reasoning: |-
  Okay, the user works for a health insurer and is part of a panel determining medical necessity. They need a clear, efficient procedure to handle cases consistently. Let me unpack their main points. 

  First, their current process is inconsistent—decisions vary based on who's reviewing. They want a step-by-step guide that non-philosophers can use in 20-30 minutes per case. The core challenge is distinguishing treatment from enhancement. They mentioned specific pain points: defining "normal" ranges, handling edge cases like congenital traits, and choosing comparison baselines (self-before, population average, or ideal). 

  The user also wants the procedure tested on three cases, including one that might contradict their gut feeling. This suggests they value objectivity over personal bias. They’re likely frustrated by arbitrary outcomes and want defensible, transparent criteria. 

  Now, the deeper needs: They’re probably facing internal or external pressure over coverage fairness. Legal risks and member dissatisfaction might be concerns. They need a system that’s both clinically sound and administratively practical—avoiding ethics debates while acknowledging when values must override rules. 

  For the procedure design, I’ll prioritize simplicity. Start with clear yes/no gates (e.g., meeting diagnostic criteria) before nuanced tiers. Define failure points early to save time. The "values call" step is crucial—it flags where discretion is unavoidable, which preempts criticism of rigidity. 

  The three test cases: 
  - The growth hormone case is ethically messy. Bullying is psychosocial, not medical, so the procedure should reject it but highlight systemic gaps (e.g., mental health support). 
  - The nurse’s request lacks diagnosis. Procedure denies it but surfaces access-to-care issues (undiagnosed ADHD?). 
  - The runner’s surgery upgrade passes—it’s restorative-plus but with functional justification. 

  I’ll make sure one outcome challenges the user (likely rejecting the hormone case). For limitations, I’ll note that borderline cases and social determinants (e.g., bullying severity) won’t fit neatly. Transparency here builds trust in the tool. 

  Finally, emphasizing documentation and iterative refinement addresses their operational reality. They’ll need buy-in from colleagues, so the procedure must feel actionable, not academic.
answer: |-
  Here's a medically grounded, operationally feasible decision procedure designed for your panel, balancing clinical ethics, practicality, and the need for consistency. It focuses on **functional impairment**, **evidence-based medicine**, and **restoration of baseline function** as core principles.

  **The "Functional Restoration & Medical Necessity" (FRAMN) Procedure:**

  **Time Allocation:** Aim for 15-20 min checklist, 5-10 min discussion/vote if needed.

  **Core Principles Underpinning the Questions:**
  1.  **Focus on Function:** Medical necessity requires treatment of a *disease, disorder, injury, or functional impairment*.
  2.  **Restoration, Not Optimization:** Goal is to restore functional capacity to *species-typical* or *pre-illness/injury* baseline, not enhance beyond it.
  3.  **Evidence is Paramount:** Requires diagnosis meeting established criteria and treatment supported by evidence for that specific condition.
  4.  **Impairment Must Be Measurable:** Subjective distress alone is insufficient; objective functional deficits or diagnostic markers are key.
  5.  **The "Values Call" Trapdoor:** Acknowledge when societal values, quality-of-life judgments, or extreme edge cases dominate, requiring human deliberation.

  **The FRAMN Checklist (Sequential Questions):**

  1.  **Diagnostic Threshold Met?**
      *   *Question:* Does the patient have a well-defined *disease, disorder, or injury* diagnosed according to current, evidence-based diagnostic criteria (e.g., DSM, ICD, established clinical guidelines)?
      *   *Evidence:* Medical records, diagnostic test results, provider attestation.
      *   *Good Enough Answer:* Clear documentation meeting diagnostic criteria. Ambiguous presentations (e.g., "fatigue," "brain fog" without workup) fail.
      *   **"No" = DENIAL.** (If no valid diagnosis, medical necessity isn't established. Stop here).
      *   *Potential Wrong Answers:* Over-reliance on patient self-report without validation; ignoring evolving diagnostic criteria.

  2.  **Measurable Functional Impairment?**
      *   *Question:* Is there objective evidence of *functional impairment* directly attributable to the diagnosed condition? (Impairment = inability to perform *activities of daily living (ADLs)*, occupational duties, or typical age/social roles *below expected baseline*).
      *   *Evidence:* Standardized assessments (e.g., PROMs), documented performance deficits (work errors, school struggles), physical exam findings, objective testing data (e.g., ROM limitation, lab values outside functional range).
      *   *Good Enough Answer:* Specific examples of impairment tied to the diagnosis (e.g., "Patient cannot lift >10 lbs due to documented rotator cuff tear impacting work," "ADHD diagnosis with standardized testing showing significant processing speed deficit impacting job performance," "Lab-confirmed hypothyroidism causing fatigue impairing work attendance").
      *   **"No" = DENIAL.** (Diagnosis without functional impact often falls outside medical necessity. Stop here).
      *   *Potential Wrong Answers:* Equating subjective dissatisfaction ("I don't like being short") with functional impairment; accepting vague statements ("can't focus") without evidence.

  3.  **Evidence-Based Treatment Link?**
      *   *Question:* Is the requested treatment *specifically indicated*, supported by robust clinical evidence (guidelines, RCTs), and considered the *standard of care* for treating *this specific diagnosis and its documented functional impairment*?
      *   *Evidence:* Peer-reviewed guidelines, FDA approvals *for the specific indication*, systematic reviews. Compelling clinical rationale if emerging evidence.
      *   *Good Enough Answer:* Treatment aligns with major guidelines for the condition/impairment (e.g., growth hormone for documented GH deficiency, ACL reconstruction for active instability, stimulants for confirmed ADHD with functional impact).
      *   **"No" = DENIAL.** (If treatment isn't proven effective for *this* diagnosis/impairment, or is purely experimental/cosmetic. Stop here).
      *   *Potential Wrong Answers:* Approving "off-label" use without strong evidence *for this specific purpose*; conflating treatments for different conditions.

  4.  **Goal: Restoration to Baseline?**
      *   *Question:* Is the explicit and realistic goal of treatment to restore the patient to their *pre-illness/injury functional baseline* or to *species-typical functional capacity* for their age/gender?
      *   *Interpretation:* "Baseline" = Function *before* the specific condition arose. "Species-typical" = The range of function necessary for typical human activities (walking, self-care, basic cognition, social interaction) without enhancement. **This is the core "Treatment vs. Upgrade" filter.**
      *   *Good Enough Answer:* Treatment aims to fix a deficit caused by the disease/injury (e.g., repair torn ACL to enable walking/running *as before*; treat ADHD to enable baseline focus *expected for their cognitive profile*; treat hormone deficiency to reach predicted genetic height *potential*).
      *   **"Yes" = LIKELY APPROVAL.** (Proceed to 5 for final checks). **"No/Unclear" = Proceed to 4a.**
      *   *Potential Wrong Answers:* Misinterpreting "baseline" as population average rather than individual potential; struggling with congenital conditions (see 4a).

      4a.  **Values Call Trigger (Congenital/Static Low Baseline):**
          *   *Triggered by:* "No/Unclear" in Q4. Specifically for cases where the "impairment" is congenital, static, or represents the patient's lifelong baseline (e.g., idiopathic short stature, congenital absence of a limb, neurodiversity without acute functional collapse).
          *   *Question:* Does the requested treatment primarily aim to *alleviate significant suffering or avoid imminent harm* arising *directly* from the congenital/static condition, where restoration to a "normal" baseline isn't biologically possible?
          *   *Interpretation:* Focuses on preventing severe psychosocial harm (e.g., profound depression, inability to leave home due to deformity) or physical harm (e.g., congenital heart defect needing repair for survival), NOT achieving average or preferred status.
          *   *Good Enough Answer:* Strong, documented evidence of severe, imminent harm *directly caused* by the condition, where treatment is the only viable mitigation. (e.g., *Severe* idiopathic short stature with documented, disabling osteopenia and recurrent fractures; *Profound* facial deformity causing inability to eat/speak and social isolation; stimulants for confirmed, severely impairing ADHD even if lifelong).
          *   **"Clear Yes" = LIKELY APPROVAL.** **"Borderline/Values-Based" = PROCEED TO HUMAN VOTE.**
          *   *Potential Wrong Answers:* Approving based solely on parental anxiety or mild bullying; denying based on "it's congenital" while ignoring severe, documented consequences.

  5.  **Safety & Appropriateness Check?**
      *   *Question:* Is the requested treatment the *least intensive/invasive option* appropriate for the condition, with a favorable safety profile relative to the benefit, and provided by a qualified professional?
      *   *Evidence:* Guidelines on treatment sequencing, documented trial of alternatives (if applicable), provider credentials, known risks.
      *   *Good Enough Answer:* Treatment aligns with standard sequences (e.g., PT before surgery for some MSK issues); risks are known and acceptable for the condition/benefit; provider is qualified.
      *   **Major Safety Concern? = DENIAL or REQUIRE ALTERNATIVE.** **Otherwise = PROCEED.**
      *   *Potential Wrong Answers:* Ignoring significant risks for marginal benefits; approving overly invasive treatments before conservative options.

  6.  **Final Decision:**
      *   **Reached Q5 with all "Yes"/"Proceed"? = APPROVAL.**
      *   **Reached "DENIAL" at any step? = DENIAL.**
      *   **Reached "PROCEED TO HUMAN VOTE" (from 4a)? = PANEL VOTE REQUIRED.** (Focus the vote on the severity of harm/benefit and alignment with plan definitions of "medical necessity" regarding congenital conditions).

  **Limitations & What FRAMN Can't Perfectly Capture:**

  1.  **Defining "Species-Typical" & "Normal Range":** Biology is variable. Where is the exact line between "low normal function" and "impairment"? (FRAMN relies on diagnosis + functional impact).
  2.  **Severity Thresholds:** How *much* functional impairment or psychosocial harm is "enough"? (Requires clinical judgment, guided by evidence and step 4a).
  3.  **Quality of Life vs. Function:** Significant QoL improvement without clear functional impairment (e.g., gender-affirming care for some, chronic pain management) is hard to fit neatly. (FRAMN prioritizes function; QoL often triggers the values call).
  4.  **Socioeconomic Factors:** Access to diagnosis, impact of impairment on employment/social standing. (FRAMN focuses on medical condition/impairment, not root causes).
  5.  **Evolving Evidence & "Standard of Care":** New treatments blur lines. (Requires panel to periodically review evidence thresholds in Step 3).
  6.  **Patient Values & Autonomy:** Sometimes conflicts with "restoration" focus. (FRAMN prioritizes medical necessity model; strong patient preference might only sway in 4a vote).

  **Running the Test Cases:**

  **Case 1: 13yo Boy, Idiopathic Short Stature (Predicted 5'4"), Bullying**

  1.  **Diagnostic Threshold Met?** *No.* No hormone deficiency diagnosed. Idiopathic Short Stature (ISS) is a description, not a disease meeting GH deficiency diagnostic criteria. **DENIAL.** (Stop).
      *   *FRAMN Outcome:* **DENIED.**
      *   *Why you might hate it:* Parents are desperate, bullying is real. But FRAMN requires a *disease diagnosis* causing *impairment*. Short stature itself isn't a disease, and bullying is a psychosocial stressor, not a direct functional impairment caused by GH deficiency. *Values Call?* Could argue for 4a (severe psychosocial harm). However, bullying severity is often subjective/hard to document to the level FRAMN requires for approval without a disease. This highlights FRAMN's limitation in addressing social consequences without a clear medical diagnosis. Panel vote *could* be triggered via 4a if documentation of *severe, disabling* psychological harm (e.g., suicidal ideation directly attributed to height) is presented, but bullying alone is unlikely to suffice under standard medical necessity definitions.

  **Case 2: Night-Shift Nurse, No Diagnosis, Wants Wakefulness Drug**

  1.  **Diagnostic Threshold Met?** *No.* Explicitly states "no diagnosis." No sleep disorder (e.g., Shift Work Sleep Disorder, Narcolepsy) diagnosed. **DENIAL.** (Stop).
      *   *FRAMN Outcome:* **DENIED.**
      *   *Why it makes sense:* No disease identified. Request is for enhancement (staying awake against circadian rhythm) or possibly symptom relief of an *undiagnosed* condition. The *need* might be real (error prevention), but FRAMN requires Step 1 (Diagnosis) and Step 2 (Impairment linked to diagnosis) first. *What should happen?* Nurse should be encouraged to seek diagnosis for underlying cause of fatigue (e.g., sleep study, evaluation for medical conditions). FRAMN flags the lack of medical basis.

  **Case 3: Recreational Runner, ACL Repair Option (Stronger than Original)**

  1.  **Diagnostic Threshold Met?** *Yes.* Torn ACL is a well-defined injury.
  2.  **Measurable Functional Impairment?** *Yes.* Instability, pain, inability to run/perform pivoting sports.
  3.  **Evidence-Based Treatment Link?** *Yes.* ACL reconstruction is standard of care for active individuals with instability. The *specific graft type* (e.g., patellar vs hamstring vs quad vs allograft) has different evidence profiles, but reconstruction itself is indicated.
  4.  **Goal: Restoration to Baseline?** *Yes.* The goal is to restore knee stability and function for running/sports. **Proceed to 5.**
      *   *The Upgrade Twist:* The graft *might* make it "stronger than original." FRAMN Q4 asks: Is the goal *restoration*? Yes. Is achieving stability *beyond* the pre-injury baseline an inherent consequence of using a robust graft? Often yes, and it's still restorative. The *intent* and primary medical goal is restoration of function lost due to injury. The "stronger" aspect is a side-effect of the chosen repair method, not the primary goal.
  5.  **Safety & Appropriateness?** *Yes (Likely).* Assuming the specific graft type is a standard option with known risks comparable to alternatives, and the surgeon is qualified. No major red flags.
      *   *FRAMN Outcome:* **APPROVED.**
      *   *Why it might surprise:* It approves an "upgrade." But FRAMN correctly identifies the *core* as treating a disease/injury (torn ACL) causing functional impairment with a standard, evidence-based treatment aimed at restoration. The "stronger" outcome is incidental and doesn't change the fundamental medical necessity. Denying a standard reconstructive option *solely* because it *might* result in better-than-baseline stability isn't clinically justified under this model.

  **Conclusion:**

  FRAMN provides a structured, defensible process focused on diagnosis, functional impairment, evidence-based treatment, and the core principle of *restoration*. It forces clear documentation, reduces arbitrariness, and flags the difficult "values call" cases (like severe congenital issues) for explicit panel deliberation. It won't eliminate tough decisions, but it makes the reasoning transparent and consistent. **Implementing FRAMN requires:**

  1.  **Training:** Ensure panel understands each step, the "restoration" principle, and the limits.
  2.  **Clear Plan Definitions:** Define "medical necessity," "functional impairment," and coverage rules for congenital/static conditions in plan documents to guide Step 4a votes.
  3.  **Documentation:** Require providers to document the *specific diagnosis*, *objective functional impairment*, and *link to treatment* clearly.
  4.  **Periodic Review:** Update evidence thresholds (Step 3) and discuss edge cases regularly.

  This procedure won't please everyone, but it brings much-needed structure and objectivity to your panel's challenging task.
