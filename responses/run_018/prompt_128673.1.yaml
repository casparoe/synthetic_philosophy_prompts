answer: |-
  ### Exam Question:  
  **"In *On the Plurality of Worlds* (1986), Lewis insists counterpart relations are contextually determined by similarity, not identity. Yet in branching-origin scenarios (e.g., an object with identical spatiotemporal origins in W and W′ but essentially copper in W and essentially bronze in W′), similarity must be *grounded* to avoid arbitrariness. Some philosophers (e.g., Forbes, Mackie) propose grounding counterparts in origin-essences. Defend *one* of the following positions:**  

  > **(A) Origin-indexing rescues counterpart theory by providing non-arbitrary grounding, *without* smuggling in transworld identity.**  
  > **OR**  
  > **(B) Origin-indexing covertly reinstates transworld identity by requiring a non-qualitative basis for individuation (e.g., haecceities), rendering counterpart theory redundant.**  

  **Your argument must: (i) Explain why the branching-origin scenario threatens Lewis’s original account; (ii) Engage how S5 modal logic’s treatment of necessity (esp. symmetry/transitivity of accessibility) impacts the debate; (iii) Address whether world-boundedness can be preserved on your view."**  

  ---

  ### Model Answer (Arguing Position B): 800 words  
  **Thesis: Origin-indexed counterpart relations collapse into disguised transworld identity, surrendering Lewis’s anti-haecceitist commitments.**  

  Lewis’s counterpart theory (CT) replaces transworld identity (TI) with similarity-based counterparts to avoid haecceitism and accommodate world-boundedness. In branching-origin scenarios, however, origin-indexing—proposed to ground similarity—reintroduces TI’s core problems. Consider worlds W and W′ sharing an object *x* with identical initial matter, location, and causal history. In W, *x* is essentially copper; in W′, essentially bronze. For Lewis, *x*’s counterparts are determined by contextually weighted similarities. Yet with *identical* origins, no qualitative property distinguishes *x*-in-W from *x*-in-W′ *at the origin*. To make *x*-in-W’s counterpart in W′ *not* be *x*-in-W′ (given divergent essences), we must privilege origin as a *fixed anchor* for cross-world tracing. This grounds the counterpart relation in a non-qualitative, identity-like primitive: *x*’s haecceity or origin-essence.  

  **S5’s Role in Exposing the Collapse**  
  S5 modal logic (where accessibility is transitive, symmetric, and reflexive) demands that if *x* in W is possibly bronze and possibly copper, then in any world accessible from W, *x* must be both bronze and copper—a contradiction. CT avoids this by denying TI: *x*-in-W has a bronze counterpart in W′ and a copper counterpart in W″, but these need not be the same entity. Origin-indexing destroys this solution. If origin *grounds* the counterpart relation, then *x*-in-W and *x*-in-W′ share the *same* origin-essence. But S5 entails that if W and W′ share an origin-identical *x*, then *x*’s essential properties must be identical across W and W′ (since both worlds are mutually accessible under symmetry/transitivity). Divergent essences violate this, forcing two responses:  
  1. **Deny S5 validity**: Reject symmetry/transitivity, fragmenting modal space—but this abandons standard modality.  
  2. **Deny shared identity**: Claim *x*-in-W and *x*-in-W′ are distinct entities *despite* identical origins.  

  Option (2) implicitly accepts haecceitism: two objects can be qualitatively identical at origin but numerically distinct, requiring primitive "thisness." This is TI in disguise. The counterpart relation, now indexed to origin, functions as *identity* because it picks out *that very object* across worlds by its origin-haecceity. World-boundedness becomes nominal: *x* is "world-bound" only if we ignore that its origin-haecceity recurs across worlds.  

  **Why CT’s Advantages Vanish**  
  Lewis’s CT avoids TI to reject haecceitism and accommodate Humean recombination. Origin-indexing betrays both:  
  - **Haecceitism**: Grounding counterparts in origin-essences requires a non-qualitative basis for individuating *x* across worlds—precisely what haecceities provide.  
  - **Recombination**: If *x*’s origin fixes its essence, recombination is restricted. The branching scenario shows a *possible* divergence (copper/bronze) from identical origins, but origin-indexing forbids this by binding *x* to an origin-determined essence.  

  CT’s defenders might argue origin-indexing uses *qualitative* origins (e.g., spatiotemporal coordinates). But in the branching case, coordinates are identical; only haecceities differentiate *x*-in-W from *x*-in-W′. To avoid contradiction, we must say either:  
  - W and W′ contain *two* origin-identical objects (haecceitism), or  
  - *x*’s essence is necessary *if* it has that origin (reintroducing TI’s necessary properties).  

  Both surrender CT’s foundations. Origin-indexing thus reduces to a notational variant of TI, where "counterparts" are just transworld stages of a single haecceity-bound entity.  

  **Conclusion**  
  The branching-origin scenario proves fatal to CT. Grounding counterparts in origins to resolve arbitrariness reintroduces the non-qualitative individuation CT sought to avoid. Under S5, divergent essences force a choice: abandon standard modality or admit haecceities. Either choice collapses CT into TI. World-boundedness is preserved only verbally, as origin-haecceities span worlds. CT cannot solve this without self-defeat.  

  ---

  ### Marking Scheme (25 points total)  
  **A-grade answers execute all 5 moves; B/C answers miss or fumble ≥2.**  

  1. **Problem Diagnosis (5 pts)**  
     - ✓: *Explicitly identifies why identical origins + divergent essences challenge Lewis’s similarity-based CT (arbitrariness in counterpart selection).*  
     - ✗: Vague on how branching origins threaten CT; confuses with general objections.  

  2. **Origin-Indexing’s Tension (5 pts)**  
     - ✓: *Shows origin-indexing either (a) forbids divergent essences (contradicting scenario) or (b) requires haecceities to individuate objects with identical origins.*  
     - ✗: Assumes origin-indexing succeeds without addressing divergence; conflates origins with other properties.  

  3. **S5 Engagement (5 pts)**  
     - ✓: *Uses S5’s symmetry/transitivity to prove origin-identical objects must share essential properties—or else accessibility relations fragment (undermining modality).*  
     - ✗: Mentions S5 but doesn’t derive implications for essential properties; ignores accessibility relations.  

  4. **Collapse into TI/Haecceitism (5 pts)**  
     - ✓: *Argues origin-indexing makes counterpart relations functional surrogates for TI by grounding them in non-qualitative identity conditions (haecceities).*  
     - ✗: Claims CT "becomes TI" without explaining how origin-indexing implies non-qualitative grounding.  

  5. **World-Boundedness & Meta-Implications (5 pts)**  
     - ✓: *Concludes world-boundedness is nominal (haecceities span worlds) and CT loses its anti-haecceitist, recombinatorial advantages.*  
     - ✗: Assumes world-boundedness is preserved; ignores CT’s philosophical motivations.  

  ---

  ### Confidence & Uncertainty  
  **Confidence: 95%**  
  - Core argument (origin-indexing → haecceitism) is logically sound and reflects critiques by Plantinga, Fara, and others.  
  - S5 interaction is correctly applied: Symmetry implies W and W′ mutually accessible, so identical-origin objects must have identical essential properties—or violate Leibniz’s Law.  

  **Least Sure Point: Whether proponents of origin-indexed CT *must* accept haecceitism.**  
  - *Possible counter:* Mackie’s "hybrid" CT might argue origin-indexing is qualitative (e.g., "an object with *this* origin" as a world-bound description).  
  - *Rebuttal:* In the branching scenario, "this origin" refers to the same spatiotemporal event in W and W′. If two objects emerge, qualitative indiscernibility demands haecceities to individuate them. If one object, its essence cannot diverge. Either way, CT’s qualitative foundation is compromised.
