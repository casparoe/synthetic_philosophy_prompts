prompt: |-
  You are an expert in applied moral philosophy and practical ethics consulting with experience translating conceptual debates into operational tools for people without formal training. Think carefully and step by step. Before you draft anything, briefly brainstorm which philosophical distinctions between preference and bias must survive in a practical checklist and which nuanced theoretical points can be safely dropped so that a non-specialist board can apply the result in about fifteen minutes.

  I serve on the ethics review board of a housing cooperative, and every month we must adjudicate disputes in which one resident frames an objection as a moral principle while another dismisses it as a mere personal preference — or, conversely, accuses the first party of disguising a prejudice as principle. I have no academic background in philosophy, but I have been working through these questions on my own, and I want to turn them into a reusable procedure. In particular, I have been developing two checks that I think capture something important, though I am not sure how to formalize them. The first I call the Asymmetry of Reversal: the idea that a genuine preference tends to stay coherent, even if weakened, when you imagine yourself on the receiving end of the decision, whereas a bias tends to invert or collapse under that reversal — though I realize that legitimate particular attachments, like caring more for one's own child, also weaken under reversal, so reversal alone is not sufficient. The second check I call the Regret Audit: asking whether the person would still endorse the same judgment if they learned that every resident in the cooperative adopted the identical standard in all comparable cases. I need you to integrate both checks into a clear, ordered decision procedure that my board can actually run, with explicit stop points where we declare "bias detected," "preference confirmed," or "values dispute — hand to board vote," and with honest flags for where judgment cannot be eliminated.

  Please structure your response exactly as follows, with these section names in this order and approximate lengths:

  1. Conceptual Translation (about 200 words): Explain the principle you are operationalizing — the philosophical difficulty of separating moral preferences from moral biases — and describe how my two injected checks (Asymmetry of Reversal and Regret Audit) map onto that distinction. State explicitly which theoretical distinctions must survive the simplification and which philosophical nuances you are dropping for the sake of usability.

  2. The Procedure (about 500 words): Provide a step-by-step checklist or flowchart in words that a board can follow in roughly fifteen minutes. For each step, give the exact question to ask, what counts as a sufficient answer, and where the flow stops with a definitive result versus where it stops with "values dispute — hand to vote" because the issue is one of values rather than correctable distortion. Integrate both checks into the flow in the correct order. Specify the role of the board chair in signing off, the assumed expertise (common sense only), and the time constraint per case.

  3. Worked Cases (about 600 words total): Apply the procedure to three disputes:
     a) A resident objects to a neighbor's loud religious music on Sunday mornings, claiming it violates a shared moral duty of quiet respect; the neighbor insists this is only the objector's aesthetic preference.
     b) A resident argues that the cooperative should deny a family with young children a ground-floor unit because children cause disproportionate wear, framing the argument as a fairness principle about shared maintenance costs.
     c) A case where the procedure yields an answer the board will strongly dislike: a long-standing resident claims that allowing pets violates a moral principle of collective cleanliness, and the procedure flags this as a likely bias despite the resident's deep emotional investment and long history in the building.
     For each case, show the answers at each step, indicate where the procedure stops, and state the result.

  4. Limits and Honest Misfires (about 250 words): Clearly state what the procedure cannot do. Address whether hidden biases can survive both checks, whether the Regret Audit risks mislabeling legitimate minority cultural practices as biases, and whether the Asymmetry of Reversal unfairly penalizes particular attachments. Flag any steps that are judgment calls dressed up as procedural rules.

  5. Implementation Note (about 100 words): Brief guidance on how often to run the procedure, what minimal record the board chair should keep, and how to document instances where human judgment overrode the checklist.

  Write in a polished, formal tone appropriate for a board document, but maintain the voice of a non-academic practitioner who developed these ideas through independent reflection. Do not include bibliographies, reading lists, citations, or requests that I look anything up. Do not quote any real text verbatim.
reasoning: |-
  Okay, the user is on an ethics review board for a housing cooperative and needs a practical tool to distinguish between genuine moral principles and personal biases in disputes. They've developed two checks—Asymmetry of Reversal and Regret Audit—but need help formalizing them into a usable procedure. 

  First, I need to understand the core challenge. Philosophical distinctions between preference and bias are messy, but for practical use, we must focus on what's operational. The Asymmetry of Reversal tests whether a stance holds up when imagined from another's perspective—preferences stay coherent while biases invert. The Regret Audit checks if someone would still endorse their view if universally applied. 

  The user mentioned nuances like legitimate particular attachments (e.g., caring for one's child) weakening under reversal. This is important—I can't treat all attachment as bias. For usability, I'll drop debates about cultural relativism and focus on coherence and universalizability. 

  For the procedure, I'll sequence the checks logically: Reversal first to test internal consistency, then Regret Audit for social scalability. Stop points need to be clear—"bias detected" for contradictions, "preference confirmed" for coherence, and "values dispute" when both checks pass but conflict remains. 

  The worked cases will show how this applies: 
  - Loud music: Reversal holds (objector accepts limits on their own noise), but Regret Audit fails (they wouldn't want all noise banned). Stops at "values dispute." 
  - Children in ground-floor units: Reversal collapses (complainant wouldn't accept higher costs themselves), so "bias detected." 
  - Pet ban: Emotional investment doesn't save it—Reversal inverts (they’d resist if others banned their treasured items), so "bias detected." 

  Limits: The procedure can't catch all hidden biases, might mislabel minority practices if applied rigidly, and could penalize legitimate attachments. I'll flag the Step 2 judgment call about "legitimate particularity." 

  Implementation: Keep it lightweight—5-10 minutes per case, log results, note overrides. The board should vote on "values disputes" without stigma. 

  This balances rigor and practicality, honoring the user’s insights while shielding the board from philosophical quicksand.
answer: |-
  **1. Conceptual Translation**  
  Distinguishing moral principles from biases hinges on coherence under scrutiny and universalizability. A *preference* reflects a consistent personal value that withstands perspective-taking, while a *bias* involves inconsistent reasoning that privileges one’s position or group. Your Asymmetry of Reversal test targets incoherence: genuine preferences maintain directionality when roles are imagined (e.g., "I value quiet and accept limits on my noise"), whereas biases often invert ("My noise is justified, but yours isn’t"). Your Regret Audit tests universalizability: true principles should withstand widespread adoption without regret, while biases collapse under scale (e.g., "If everyone did this, would the community thrive?").  

  **Must survive**:  
  - The core distinction between *inconsistent justification* (bias) and *stable valuation* (preference).  
  - Universalizability as a litmus test for fairness.  

  **Dropped for usability**:  
  - Debates about cultural relativism (treat all residents as equal moral agents).  
  - Epistemic uncertainties (assume residents can reliably report their own reactions).  
  - Nuanced defenses of particularism (e.g., parental partiality); we treat strong role-dependent claims as potential biases unless they pass both checks.  

  ---

  **2. The Procedure**  
  *Role of Chair*: Ensures strict timekeeping (≤15 min/case), enforces neutrality, documents outcomes.  
  *Expertise Assumed*: Common-sense interpretation of answers; no philosophy training needed.  

  **Step-by-Step Flow**:  
  1. **Articulate the Claim**:  
     *Question*: "What specific moral principle is being asserted (e.g., fairness, respect)?"  
     *Stop if*: Claim cannot be stated as a general principle → "**Preference confirmed**." (E.g., "I just dislike noise.")  

  2. **Asymmetry of Reversal Check**:  
     *Question*: "If roles were reversed—you were the one affected by this rule—would your principle still coherently apply, even if less strongly?"  
     - **Yes, coherent** → Proceed to Step 3.  
     - **No, inconsistent/inverted** (e.g., "But my situation is different!") → "**Bias detected**." STOP.  
     - **Unclear/Qualified** (e.g., "I’d accept it, but reluctantly") → Proceed to Step 3.  

  3. **Regret Audit Check**:  
     *Question*: "If every resident applied this identical principle in all similar cases, would you still endorse it without regret? Could the community function well?"  
     - **Yes, no regret** → "**Preference confirmed**." STOP.  
     - **No, regret/impractical** (e.g., "But then no one could ever play music!") → "**Bias detected**." STOP.  
     - **Mixed/Uncertain** → "**Values dispute — hand to board vote**."  

  ---

  **3. Worked Cases**  
  **Case A: Loud Religious Music on Sundays**  
  - Step 1: Claim = "Duty of quiet respect." → Proceed.  
  - Step 2: Reversal → Objector agrees *their* loud hobbies (e.g., TV) should be limited. **Coherent**.  
  - Step 3: Regret Audit → Objector admits universal quiet *all* times would be excessive; regrets harshness. **Bias detected** (inconsistent scope).  

  **Case B: Denying Family Ground-Floor Unit**  
  - Step 1: Claim = "Fairness in shared maintenance costs." → Proceed.  
  - Step 2: Reversal → Complainant insists *they* shouldn’t pay extra if *their* actions caused wear. **Inverts** (others pay, not me). **Bias detected**. STOP.  

  **Case C: Banning Pets for Cleanliness**  
  - Step 1: Claim = "Moral duty of collective cleanliness." → Proceed.  
  - Step 2: Reversal → Resident says *their* (hypothetical) pet would be "clean enough," but others’ are not. **Inconsistent**.  
  - Step 3: Regret Audit → Universal ban means no guide dogs/service animals; resident regrets this. **Bias detected** despite emotional investment.  

  ---

  **4. Limits and Honest Misfires**  
  - **Hidden biases survive**: Coherent liars may pass both checks; procedure flags *incoherence*, not malice.  
  - **Regret Audit vs. minority practices**: Universalizing *could* penalize niche customs (e.g., rare rituals). Mitigation: Step 1 must specify *contextual* principles (e.g., "respect during quiet hours," not "ban all drums").  
  - **Asymmetry vs. attachments**: Legitimate partiality (e.g., caregiving) risks false "bias" flags. Mitigation: Step 2 allows "weakened but coherent" endorsements (e.g., "I’d accept limits on *my* caregiving noise").  
  - **Judgment calls**: Step 2’s "coherent vs. inverted" is subjective; chair must flag disagreements for board input.  

  ---

  **5. Implementation Note**  
  - **Timing**: Apply per dispute (≤15 min), during initial review.  
  - **Documentation**: Chair logs:  
    - Principle asserted (Step 1).  
    - Answers to Steps 2–3.  
    - Outcome (Bias/Preference/Vote).  
  - **Overrides**: If board votes against procedure outcome (e.g., upholds a "bias" due to context), minute the rationale.  
  - **Review**: Audit logs quarterly for patterns (e.g., frequent "values disputes" on noise suggest policy gaps).  

  This procedure crystallizes your insights into actionable ethics, prioritizing operational clarity over theoretical perfection. It empowers the board to separate distortions of bias from legitimate clashes of values with minimal philosophy.
