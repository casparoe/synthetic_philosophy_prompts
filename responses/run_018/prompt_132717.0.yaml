  Okay, the user is diving deep into Nyāya philosophy, specifically the concept of anupalabdhi as a distinct pramāṇa. They're a developer, so they're using unit testing as an analogy—interesting connection. The main question is whether anupalabdhi is truly separate from inference or just inference in disguise. 

  The user has done some reading but is confused about where the real disagreement lies. They mention ontological vs. epistemic issues and the sannikarṣa requirement. Their frustration with the "absence is real or mental" debate is palpable—they want to cut through the noise. 

  Hmm, they're clearly analytical (dev background) and wants structural clarity. The unit testing analogy shows they're trying to ground abstract philosophy in concrete logic. They might be seeking not just an explanation but a mental model to apply elsewhere. 

  The core tension they're sensing is real. Nyāya insists anupalabdhi is direct cognition of absence, not inference. But opponents say: "Isn't 'not seeing the cup' just data for an inference?" Nyāya's counter is that inference requires a correlational rule (hetu), like "smoke always means fire," but absence isn't a positive property to correlate—it's the lack itself. 

  The sannikarṣa angle is sharp. Nyāya handles this by saying the absence "contacts" us via its locus (the empty desk). The desk is present; its cuplessness is directly perceived. Mimāṃsā would retort: "Nonsense! You only perceive the desk—the 'absence' is inferred." 

  User's right that the "real vs. mental" debate is a red herring. The real fight is: Is non-perception *itself* a valid means of knowing absence (Nyāya), or is it just raw material for inference (Mimāṃsā)? 

  ...Should also note the unit testing analogy is slightly off. Tests passing don't prove no bugs—but Nyāya's anupalabdhi requires ideal conditions (well-lit room, functional senses). They'd say: "If you *should* see it but don't, that *is* proof." More like a test failing when it should pass. 

  User's digging into epistemology's plumbing. Respect. They'd probably appreciate Uddyotakara's "no hetu" argument or Gaṅgeśa's perceptual framing. No need for Sanskrit terms unless they ask, though.
answer: |-
  You've hit the nail on the head of a profound and enduring philosophical debate in Indian epistemology! Let's untangle this knot by focusing on the *actual* points of contention you've identified, cutting through the "red herrings."

  **Core Disagreement: Epistemic Mechanism vs. Ontological Status**

  The debate is **primarily epistemic**, not ontological (though ontology plays a supporting role). The core question is: **Does the cognition "The cup is absent from the desk" arise through a *unique cognitive process* distinct from inference (anumāna) or perception (pratyakṣa), or is it merely a *sub-case* of one of them?**

  1.  **Nyāya's Position (Anupalabdhi as a Separate Pramāṇa):**
      *   **Epistemic Mechanism:** Anupalabdhi is a *direct*, *non-inferential* apprehension of absence. When you look at the desk under suitable conditions (good light, functioning senses, attentiveness) and fail to cognize the cup, you *directly cognize* the *absence* itself. It's not that you see "desk-only" and *then infer* "no cup." The absence is the *immediate object* of cognition in that specific perceptual context.
      *   **The "Hetu" Problem:** Inference *requires* a positive, correlational middle term (hetu) linking the reason (e.g., "I see desk-only") to the conclusion (e.g., "no cup"). Nyāya argues there *is no such positive hetu* for absence. What would the hetu be? "Non-perception"? But non-perception isn't a *positive* property observed *in the locus* (the desk) like smoke is observed where there's fire. It's the *lack* itself. Treating it as inference creates a logical hole.
      *   **Sannikarṣa (Contact):** Nyāya addresses this brilliantly. The "contact" (sannikarṣa) is not with the *absent thing* (the cup), but with the *locus* (the desk) *qualified by the absence* (abhāva). You perceive the desk *as being without the cup*. The absence is a property (or a distinct category, later Nyāya) inhering in the locus. Your senses are in contact with the locus, and through that contact, under the *right conditions* (key!), you apprehend the absence residing there. It's analogous to perceiving "blueness" inhering in the pot; here you perceive "cup-absence" inhering in the desk.
      *   **Conditions Matter:** Nyāya emphasizes that anupalabdhi *only* works when the absent object *should* be perceptible if present. If it's dark, your eyes are closed, or the cup is microscopic, non-perception doesn't prove absence. The *qualified non-perception* under ideal conditions *is* the proof.

  2.  **Opposing Positions (Mīmāṃsā, Buddhists, some within Nyāya - Anupalabdhi as Inference/Perception):**
      *   **Mīmāṃsā (Primarily Kumārila Bhaṭṭa):**
          *   **Epistemic Mechanism:** Knowledge of absence *is* inferential. The cognition arises because:
              *   You perceive the locus (the desk).
              *   You recall the necessary conditions for perception (light, open eyes, etc.).
              *   You have a prior expectation or knowledge that the object *would* be perceived if present under these conditions.
              *   The *non-occurrence* of the expected perception (of the cup) *becomes the reason* (hetu) for the inference: "The cup is absent because it is not being perceived now, though all conditions for perceiving it, if it were present, are fulfilled."
          *   **Ontology:** Sometimes they argue absence isn't a real positive entity (*bhāvarūpa*) but merely the negation of presence (*bhāvābhāva*). Since you only perceive positive entities, you can't "perceive" absence directly; you must infer it.
      *   **Buddhist (e.g., Dignāga, Dharmakīrti):**
          *   **Epistemic Mechanism:** Knowledge of absence is purely conceptual and inferential. Perception only grasps positive particulars (*svalakṣaṇa*). Absence is a conceptual construct (*kalpanā*) based on the failure to perceive the expected object where it could be perceived. The hetu is the qualified non-perception.
          *   **Ontology:** Emphasizes non-perception of the *expected positive entity* as the basis. Absence has no independent reality.

  **Where the Disagreement Truly Lives:**

  *   **The Point of Cognizing Absence:** Is the cognition "Cup is absent" formed *at the moment of qualified non-perception* as a direct result of that perceptual event (Nyāya), or is it formed *afterwards* as a conclusion drawn *based on* that non-perception combined with memory and reasoning (Mīmāṃsā/Buddhism)?
  *   **The Role of Non-Perception:** Is qualified non-perception itself the *instrument* (karaṇa) generating the cognition of absence (Nyāya), or is qualified non-perception merely the *data* (the hetu) *used by* the inferential process (Mīmāṃsā/Buddhism)?
  *   **The Nature of the Cognitive Object:** Does the qualified locus (desk-without-cup) present the *absence itself* as an objectifiable feature of reality accessible to perception (Nyāya), or is the absence merely a *judgment* we *apply* to the perception of the positive locus (desk-only) based on reasoning (Opponents)?
  *   **The Hetu Requirement:** Is Nyāya right that inference *requires* a positive hetu found *in the locus*, making absence-inference impossible? Or can qualified non-perception *function* as a valid hetu (Opponents)?

  **Unit Testing Analogy Clarified:**

  *   Your analogy is insightful. A passing test suite doesn't *prove* no bug exists (analogous to non-perception under non-ideal conditions - darkness, faulty senses).
  *   Nyāya's anupalabdhi is more like: **Under *ideal, exhaustive testing conditions* where the test suite *should* fail if *any* bug of type X exists, the *passing* of the suite *directly signifies* the absence of bugs of type X.** They argue this "signification" is direct cognition of the absence via the test result, not an inference *from* the result. The opponents say the passing result is the *evidence* you use to *infer* the absence.

  **Conclusion:**

  You're absolutely right to focus on the epistemic mechanism. The core disagreement is whether knowing an absence requires a *deductive inferential step* (using qualified non-perception as a hetu) or arises *immediately and non-inferentially* from the qualified non-perception itself under ideal conditions. Nyāya argues the latter necessitates a unique pramāṇa because inference structurally fails to account for it (lack of positive hetu), and perception can be extended to cover the qualified locus (locus + absence). Their opponents see no need for a new mechanism, arguing that standard inference (or a refined view of perception) suffices. The ontological question (is absence "real"?) serves primarily to support the chosen epistemic model, not drive it independently.

  Later Nyāya (like Gaṅgeśa) refined anupalabdhi further, often grounding it within a sophisticated theory of perception (*nirvikalpakapratyakṣa*) where the absence is directly presented. But the fundamental clash of epistemic mechanisms you identified remains the heart of the debate. Excellent analysis!
