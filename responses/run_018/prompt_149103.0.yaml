answer: |-
  Right, let's crack on with this qualia conundrum. Your group's stalemate is classic – been there, argued that, bought the t-shirt with the inverted spectrum on it. Your "Reverse Mary" twist is a cracking idea to test the waters, so let's see where it takes us.

  **First up: Reverse Mary & the Olfactory Quandary**

  *   **What her confusion *likely* shows:** Her utter bewilderment ("Is *this* smell sensation *anything* like *that* red sensation?!") primarily screams **epistemic privacy and modality-locking**. She's hit a hard biological/cognitive wall. Her visual qualia framework evolved/developed for photons; her olfactory one for volatile molecules. There's no God-given "qualia space" where redness and petrichor can be plotted on common axes. The *inability to compare* stems from the fundamental architecture of her sensory systems and the private nature of the experiences themselves, *not* necessarily because the concept of "phenomenal character" is logically contradictory.
  *   **Does it prove incoherence?** Probably not on its own. It highlights the **operational uselessness** of qualia *as intersubjectively comparable properties*. You can't build a "qualia spectrometer" to measure and compare them across modalities or individuals. But that doesn't mean the *having* of them is incoherent *for the subject*. It just means qualia aren't the kind of "properties" you can put in a public spreadsheet. They're inherently first-personal.
  *   **The "Harmless" Angle:** The epistemic privacy/modality-lock view can argue qualia *are* "harmless" in the sense that they are *real features of conscious experience* for the subject, but they simply *don't play a role* in the objective, causal, third-person physical story in a way that makes them comparable or measurable like mass or charge. They are what-it's-like-*for-the-subject*, full stop.

  **Why the Stalemate? Two Sides of Different Coins (and a Hidden Assumption)**

  You've nailed the core issue:

  1.  **Epistemic Side (Chase/Sanborn-esque):** Focuses on **what we can know/describe/report**. Qualia are real phenomenal properties, but our knowledge of them (especially across subjects or modalities) is fundamentally limited or private. The failure is in *access* and *communication*, not in the *existence* of the property itself. "Incoherence" claims are misdiagnosing epistemic limitations as ontological failures. Reverse Mary's confusion is a *knowledge* problem.
  2.  **Ontological Elimination Side (Dennett-esque Quining):** Focuses on **what genuinely exists as a scientifically admissible property**. If a purported property (like qualia) cannot, even in principle, make a difference detectable from the third-person perspective (like resolving the inverted spectrum), and if attributing it leads to no testable predictions or explanations beyond the physical/functional story, then it *isn't a real property at all*. It's a confused folk concept we should discard. Reverse Mary's confusion reveals the emptiness of the concept – there *is* no fact of the matter about "likeness" across modalities to be confused *about*.
  3.  **The Hidden Assumption:** This is the clincher. **What counts as a "real property"?** The stalemate absolutely hinges on this unspoken (or poorly defended) assumption.
      *   The Epistemic side often implicitly assumes that **subjective experience itself is the bedrock** – *if* it feels like something, *then* there is a property (quale) instantiated, regardless of whether science can fully capture it intersubjectively. Reality includes first-person facts.
      *   The Elimination side often implicitly assumes that **only properties that play a role in the intersubjective, objective, causal order** count as "real". Properties must be *publicly referable* and *operationally definable* to be scientifically respectable and ontologically robust. First-person reports are data *about behaviour/function*, not direct evidence for non-physical properties.

  **What Counts as Progress? (Beyond Just More Coffee)**

  1.  **Sharp Distinction Booting:** Explicitly defining what each side means by "property" and "real" is essential. Are "real properties" *only* those that figure in completed physics? Or do phenomenal properties constitute a distinct ontological category? Forcing both sides to defend their metaphysical assumptions about property-hood is crucial. Reverse Mary helps expose this: her confusion exists *for her*, but does that subjective state correspond to an actual *relational property* ("smell-quale is/isn't like red-quale") out there in the world? Or is it just a peculiar functional state *within* her cognition?
  2.  **Formal Models (Cautiously):** Exploring computational or mathematical models of phenomenal space *within* a modality might help clarify concepts (e.g., modelling colour space similarity). However, attempting a *cross-modal* formal model of "raw feels" likely hits the same wall as Reverse Mary – the mapping seems arbitrary or impossible without bridging principles we lack. Useful for clarifying *intra*-modal structure, less so for the core ontological dispute.
  3.  **Predictive Power Test:** Can either view generate novel, testable predictions about consciousness? The eliminative view predicts that refining functional/physical explanations *will* exhaustively explain the phenomena we *call* qualia. The epistemic privacy view predicts persistent explanatory gaps *by the nature* of phenomenal properties. Progress might come from neuroscience or AI: e.g., if we could perfectly simulate a human visual system and it claimed subjective experience indistinguishable from ours, would that support eliminativism? Or would the epistemic gap (can we *really* know it's like anything for the sim?) remain?
  4.  **Conceptual Hygiene:** Relentlessly applying the quining tactic: strip away all functional/causal/dispositional aspects of an experience. What purely intrinsic, non-relational, ineffable "residue" is left? Is this residue conceptually coherent? Does it *do* anything? If you struggle to even *describe* what it is without sneaking in relational/functional language (as Dennett argues), that *is* evidence of potential incoherence. Reverse Mary amplifies this – she can't even *begin* to functionally relate the qualia across senses.
  5.  **Accepting Bedrock (But Not Giving Up):** There *might* be a point where it becomes reasonable to say subjective experience is fundamental. But "moving on" without rigorous examination risks intellectual laziness. The *progress* could be in clearly defining *why* we hit bedrock – is it ontological (qualia are primitive) or epistemological (our cognitive tools are fundamentally limited)? Reverse Mary pushes us towards the latter interpretation.

  **The Verdict on Reverse Mary & Your Stalemate**

  Your olfactory Mary strongly suggests **epistemic privacy and modality-locking are the primary culprits in her confusion, not logical incoherence of qualia per se.** However, it brilliantly highlights **why the eliminativist thinks qualia *as properties* are ontologically suspect** – they fail the "public property" test spectacularly.

  **The stalemate persists because:**

  *   **Yes,** the sides are often talking past each other: one about the undeniable reality of *experience* (ontology of the first-person), the other about the requirements for *scientific properties* (ontology of the third-person).
  *   **Yes,** there's a massive hidden assumption about **what constitutes a "real property"** that needs dragging into the light and defended properly.
  *   Progress likely lies in **forcing that definitional clash** ("Defend your metaphysics of properties!") and rigorously applying **conceptual analysis** (quining) to see if the "purely phenomenal residue" holds up under scrutiny. Reverse Mary is a powerful tool for this – her predicament makes the intersubjective calibration problem viscerally clear. Keep battering away at that bedrock; maybe you'll find it's granite, maybe you'll find it's sand, but at least you'll know what you're standing on. Now, go forth and argue – and good luck! Fancy a cuppa after?
