prompt: |-
  okay so i just spent like 3 hours arguing with my friend jess about whether introspection is actually reliable or if we're just making up stories about our own mental states, and we realized halfway through that we were both assuming totally different things about what a "good theory" of introspective reliablity even looks like. so i want you to lay out the full desiderata list for a theory of introspective access -- not just "i feel sad" but the weird edge cases, like when someone with alexithymia reports zero emotional state but still behaves consistently with one, or the split-brain confabulation cases where the left hemisphere invents explanations for right-hemisphere actions and delivers them with total certainty.

  break it down like this: what phenomena must it explain, what distinctions can't be collapsed (direct access vs reconstructive inference, occurrent phenomenology vs retrospective narration, interoceptive signal vs cognitive interpretation, and maybe that "transparent self-modeling" thing jess kept bringing up where knowing a state is identical to being in it?), and which results from cognitive science or biology it can't flat-out contradict (predictive processing models, the confabulation literature, interoceptive accuracy studies?). tell me which ones are genuinely non-negotiable and which are just preferences of the "inner sense" camp vs the "constructivist" camp. jess thinks transparent self-modeling is mandatory, i'm skeptical -- flag which single requirement does the most damage to standard inner-observation theories. also, is there a subset of these desiderata that looks jointly unsatisfiable if you take predictive processing and direct access both seriously? please no bibliography, i'm writing this on my phone on the bus and just need the conceptual map, not a reading list.
