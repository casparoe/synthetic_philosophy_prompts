  Below is the diagnostic decision tree addressing the extra badness of human extinction beyond the 8 billion deaths. It uses concrete cases and yes/no questions to navigate the logical space, starting from the shared commitment that extinction is worse than the deaths alone. The tree is built along four axes:  
  1. **Personal vs. impersonal**: Does the extra badness require harm to existing people?  
  2. **Future value dependence**: Does the badness track the lost value of the future?  
  3. **Biological continuity**: Does mere species survival mitigate the badness?  
  4. **Successor adequacy**: Can a non-human successor species inherit what matters?  

  The four key cases are integrated:  
  - **Sterilizing pandemic**: Humanity dies out naturally in 60 years; no early deaths.  
  - **Net-negative future**: The future contains more suffering than happiness, but people want to continue.  
  - **Five thousand survivors**: A small, biologically continuous group remains with minimal culture.  
  - **Succession**: A non-human civilization inherits and builds on human culture.  

