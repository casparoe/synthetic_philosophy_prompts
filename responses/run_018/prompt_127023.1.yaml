  First, I need to unpack why this angle is fresh. Most scholarship treats Keynes's ethics and epistemology separately—like two boxes that never touch. The user's frustration with the "fifteen-hour work week" regurgitation is valid; everyone skips the epistemic grounding. The core tension they're spotting: how can Keynes prescribe aesthetic/moral goods as "the" post-scarcity endgame if his own probability framework denies certainty about future preferences? That's deliciously paradoxical.  

  User's typo ("definately") and casual tone suggest they want rigor without stuffiness. British English is a must—swap "color" for "colour", etc. No bibliography needed, but the proposal must show grasp of key texts: Treatise on Probability, "Economic Possibilities", and essays like "My Early Beliefs".  

  Biggest risk is scope creep. One semester can't cover all of Keynes's ethics. Need to fence it: focus *only* on the probability/normative clash, not his whole moral theory. User's "moral expectation" model idea is sharp—that’s the unique sell.  

  Method hinges on close reading. Proposal should stress comparing Treatise’s Part I (weight of argument) with "Economic Possibilities"' §II-III and "My Early Beliefs". Result could go either way: maybe probability *undermines* normative confidence (win for user's hypothesis), or maybe Keynes uses long-run frequencies to justify it (interesting failure).  

  User’s worry about "epistemic overreach" is spot-on. That’s the academic gap: no one asks if Keynes’s prescriptiveness contradicts his own anti-certainty stance. Tutor will love this.  

  Right, structuring:  
  1. Punchy title signalling the niche angle  
  2. Research question verbatim as user wrote it  
  3. Literature gap: ethics and epistemology siloed  
