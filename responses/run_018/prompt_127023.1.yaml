prompt: |-
  hey im a third year phil/econ student and my tutor said i need a two-page research proposal for this module on value theory and economic thought. please act as an expert philosopher of economics who really knows Keynes inside out, and take a deep breath and think step by step before you answer — maybe start with a quick brainstorm of angles. i want to write about Keynes's views on the good life but not the usual 'fifteen hour work week and do poetry' take everyone regurgitates. instead i want to inject this weird niche idea: what if we read Keynes's good life prescriptions through his own Treatise on Probability, where he treats rational belief as weighted argument rather than true or false? the precise question i need in the proposal: does Keynes's probabilistic epistemology undermine his normative confidence that post-scarcity humans should pursue aesthetic and moral goods rather than just accumulate wealth? like, if we cant have certain knowledge of future preferences, is prescribing a specific good life just epistemic overreach dressed up as economics?

  the proposal should state the question exactly, explain why the standard literature on Keynesian ethics doesnt settle it (they treat his ethics and epistemology in seperate boxes), outline my method (close comparison of his probabilistic framework with his normative essays, maybe constructing a 'moral expectation' model where the good life is an expectation-value calculated across possible future preference-states rather than a fixed endpoint), say what a result looks like and what counts as failure (for instance, if the probabilistic framework actually supports strong normative claims via long-run frequency arguments), and be honest about scope for one semester. please write in british english, keep it casual, and dont include any bibliography or citation list since im adding those myself. also i definately made a typo or two in this prompt but thats fine.
