  Let me flesh that out. The island is isolated, perhaps after a disaster. The last animal is dying, and saving it requires complex resources. Humans have left or don't know about it. The reason floats—it feels like it should be acted upon, but there's no one to do so. The tension arises because the reason's existence implies it should be fulfilled, yet it can't be, making it self-defeating.

