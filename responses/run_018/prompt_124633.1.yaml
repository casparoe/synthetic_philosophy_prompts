answer: |-
  Here’s a taxonomy structured as a decision tree focused on distributed narrative gravity. It starts from Dennett’s core premise and branches through "weird" scenarios to reveal nuanced positions. Awkward commitments and unresolved tensions are flagged.  

  **Root Question:**  
  `Q1. Is narrative coherence the *only* binding force of selfhood?`  
  - **Yes →** Go to Q2  
  - **No →** Go to Q6  

  ---

  ### BRANCH 1: *Narrative Coherence is Necessary & Sufficient*  
  `Q2. Can a "centre" be distributed across multiple agents/scaffolds?`  
  - **Yes (Distributed Gravity)** → Go to Q3  
  - **No (Singular Anchor)** → **Position: *Classical Dennettian Instrumentalism***  
    - *Awkward Commitment*: Must deny that collaborative narratives (e.g., co-authored memoirs) create plural selves.  
    - *Unresolved Tension*: Why can’t a hive-mind be a "self"?  

  `Q3. Can one body host *multiple* centres?`  
  - **Yes (Plural Centres)** → **Position: *Self-as-Symphony***  
    - *Awkward Commitment*: Accepts that dissociative identity disorder isn’t pathology but ontological truth.  
  - **No (One Centre Per Body)** → Go to Q4  

  `Q4. If narrative resets (total amnesia + new story), is it the same "centre"?`  
  - **Yes (Continuous Field)** → **Position: *Narrative Heracliteanism***  
    - *Awkward Commitment*: A brainwiped spy with an implanted biography is "the same person" as before.  
  - **No (Narrative Death/Rebirth)** → **Position: *Episodic Selves***  
    - *Awkward Commitment*: You "die" each time you forget your childhood.  

  ---

  ### BRANCH 2: *Narrative Coherence is NOT Sufficient (or Primary)*  
  `Q6. Is the self *real* but divisible?`  
  - **Yes (Corporate Metaphysics)** → **Position: *Self-as-Legal-Entity***  
    - *Awkward Commitment*: A "self" can be split/merged like a company (e.g., fission after teleportation).  
  - **No →** Go to Q7  

  `Q7. Is the self *fictional* but functionally singular?`  
  - **Yes →** **Position: *Fictional Gravity Well***  
    - *Awkward Commitment*: Even if illusory, the "centre" *must* behave as a gravitational point (e.g., can’t branch).  
  - **No →** Go to Q8  

  `Q8. Can a distributed narrative *replace* the biological anchor?`  
  - **Yes (Scaffolded Emergence)** → **Position: *Networked Selfhood***  
    - *Awkward Commitment*: An AI maintaining your narrative while you’re in a coma *is* "you".  
  - **No (Biological Primacy)** → **Position: *Organic Narrative Realism***  
    - *Awkward Commitment*: Socially distributed narratives are mere "echoes," not self-constitutive.  

  ---

  ### UNRESOLVED TENSIONS IN THE TREE  
  1. **Amnesia Ambiguity**: The *Narrative Heracliteanism* vs. *Episodic Selves* split (Q4) struggles with *partial* amnesia. If 90% of memory is artificially replaced, is it "reset"? The tree forces binary thresholds.  
  2. **Plural vs. Distributed**: *Self-as-Symphony* (plural centres in one body) and *Networked Selfhood* (one centre across bodies) could collapse into each other if "body" is poorly defined (e.g., cyborgs).  
  3. **Fictional but Functional**: *Fictional Gravity Well* and *Classical Dennettian Instrumentalism* both treat self as fiction but diverge on whether it *must* be singular—no branch cleanly separates "singular by necessity" vs. "singular by convention."  

  ---

  ### TAXONOMY OVERVIEW  
  | Final Positions                     | Core Stance on Distributed Gravity       |  
  |------------------------------------|------------------------------------------|  
  | Classical Dennettian Instrumentalism | Singular, biologically anchored          |  
  | Self-as-Symphony                   | Plural centres per body                  |  
  | Narrative Heracliteanism           | Continuous field survives reset          |  
  | Episodic Selves                    | New narrative = new self                 |  
  | Self-as-Legal-Entity               | Real, divisible, transferable            |  
  | Fictional Gravity Well             | Illusory but *must* behave as a singularity |  
  | Networked Selfhood                 | Emerges across organic/inorganic nodes   |  
  | Organic Narrative Realism          | Biological brain is non-negotiable anchor |  

  This forces students to confront:  
  - Whether "centre" implies geometric singularity,  
  - If narrative mass is conserved through disruption,  
  - How much distribution dissolves the self.  

  Use it to spark debates on edge cases: *If an AI gradually replaces your autobiographical memories, at which node does "you" cease?*
