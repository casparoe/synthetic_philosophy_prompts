prompt: |-
  I'm putting together a handout for my third-year metaphyics seminar and I'm a bit stuck on how to map out the landscape around Dennett's idea that selves are centres of narrative gravity. I don't want the usual physicalist-vs-dualist quiz — that's been done to death and my students can recite it in their sleep. Instead, I'm trying to build a decision tree that sorts people by what they actually think about narrative continuity when we mess with the usual assumptions. Specifically, I want to inject a slightly odd framing: suppose we treat narrative gravity not as a property of a single brain but as a kind of gravitational field that can be distributed across social networks or even artifical scaffolding. Then the branches should split on whether you think the centre can be pluralised without losing the self, whether temporal coherence is necessary or just useful fiction, and whether a completely amnesiac agent who acquires a new narrative from scratch counts as the same centre or a new one with inherited mass, so to speak.

  Could you write me a taxonomy — maybe eight to ten nodes — that starts from the question do you accept that narrative coherence is the only thing holding the self together? and then branches through these weird distributed or plural scenarios? Each leaf should name a position or say unnamed, and note its most awkward commitment. Don't just list Dennett versus Parfit; I want the tree to catch people who think the self is literally a fiction but still behaves like a centre, versus people who think it's real but can be split like a company. Oh, and please don't ask me for a bibliography — I just need the instrument itself. I was discussing this with a colleague over coffee and we couldn't agree on whether distributed narrative gravity was even coherent, so I'd appreciate if you flag any pair of leaves your tree can't really separate. There's probably a typo in there somewhere, but you get the idea.
