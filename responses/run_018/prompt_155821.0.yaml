answer: |-
  ## Teaching Plan: Lewisian Conventions vs. Evolutionary Stability

  **Target Audience:** Cognitive Science Grad Students (Fluent in EGT/Signaling Models, No Philosophy Background)
  **Goal:** Distinguish Lewisian conventions (normative, common knowledge-based solutions to coordination problems) from merely evolutionarily stable behavioral regularities.
  **Core Conflict:** Evolutionary stability ≠ Normative Convention.

  **1. Session Structure & Dependency (45 mins)**
  *(Justification: Build concepts sequentially; each step relies on the prior to avoid premature collapse.)*

  1.  **Coordination Problems (CP) (10 mins):**
      *   **Introduce:** Define CPs formally (multiple Nash Equilibria where agents prefer to coordinate *on the same* equilibrium over miscoordination). Use a simple 2x2 matrix (e.g., Hunt Stag/Hare variant focused purely on coordination, not conflict).
      *   **Key Point:** CPs create a *problem* needing a *solution* for efficient interaction. Miscoordination is costly.
      *   **Dependency Justification:** Foundation. Without a genuine CP, there's no need for a convention. Skip this, and stability seems sufficient for any regularity.

  2.  **Arbitrary Alternatives (AA) (10 mins):**
      *   **Introduce:** Highlight that in a CP, *multiple* equilibria are possible, and they are roughly *equally good* solutions (e.g., driving left vs. right). The specific solution chosen is arbitrary; another would work just as well *if everyone switched*.
      *   **Key Point:** Conventions solve CPs *precisely because* the solution is arbitrary. It's not the *only* way or the *inherently best* way; it's *the way we happen to do it here*.
      *   **Dependency Justification:** Requires the CP framework (Step 1). Introducing AA *before* CP makes "arbitrariness" seem pointless. Skipping AA collapses the solution into being "special" or inherently optimal, missing convention's contingent nature.

  3.  **Behavioral Regularity & Stability (BRS) (10 mins):**
      *   **Introduce:** Describe a stable pattern of behavior solving the CP (e.g., in the matrix, everyone plays Equilibrium A). Discuss stability concepts (Nash Eq, ESS) – agents have no *individual incentive* to deviate *given current behavior*.
      *   **Key Point:** Stability is necessary for persistence but descriptive. It explains *why the pattern sticks once established*, not *why it has normative force*.
      *   **Dependency Justification:** Requires CP (Step 1) and AA (Step 2). We now have a stable solution to a problem with multiple possible solutions. Introducing stability *first* risks making it seem primary and sufficient (Friend's Error).

  4.  **Common Knowledge (CK) & Expectations (15 mins):**
      *   **Introduce:** Define CK informally but rigorously: Not just "everyone knows X," but "everyone knows X, everyone knows that everyone knows X, everyone knows that everyone knows that everyone knows X, and so on..." Frame it as *mutual expectations*: I expect you to follow R, I expect you to expect me to follow R, I expect you to expect me to expect you to follow R... ad infinitum.
      *   **Key Point (Normative "Ought" Emerges Here):** The convention exists *because* of these mutual expectations. I *ought* to follow R *because*:
          *   (a) R solves the CP (pragmatic reason).
          *   (b) *Everyone expects* me to follow R (and I expect them to follow R).
          *   (c) *Everyone expects* that everyone expects conformity (CK).
          *   (d) AA means I have no *independent* reason to prefer R over S *except* these expectations.
      *   **Dependency Justification:** Requires BRS, CP, and AA (Steps 1-3). CK provides the *social glue* turning a stable pattern (BRS) into a normative standard. The "ought" is conditional on the expectations generated by the CK state. Skipping CK collapses the normative force into the stability itself. **This is the crucial step against the Friend's Error.**

  **2. Carrying Example: Raid Roles (20 mins)**
  *(Goal: Illustrate Lewisian components in a novel, relevant context.)*

  *   **Setup:** Cooperative multiplayer raid (e.g., WoW, Destiny). Complex boss requires specialized roles: Healer (H), Tank (T), Damage Dealer (DPS). No central authority assigns roles. Success requires coordination (miscoordination = wipe).
  *   **Required Properties:**
      *   **Clear CP:** Multiple viable role distributions (e.g., T/H/3DPS, 2T/2H/1DPS, T/2H/2DPS) are roughly equally effective *if everyone commits*. Miscoordination (e.g., no Tank, 3 Tanks) is disastrous.
      *   **Arbitrary Alternatives:** Multiple stable team compositions exist (AA). No single composition is inherently "best" across all raids; context matters, but within *this* raid group's established meta, one is chosen.
      *   **Stable Regularity:** Group consistently uses composition R (e.g., T/H/3DPS). It's an ESS – deviating alone (e.g., joining as 2nd Tank when only 1 is expected) causes failure. Newcomers observe and adopt R.
      *   **Common Knowledge/Mutual Expectations:** Veterans *expect* newcomers to learn R. Newcomers *know* they are expected to learn R. Veterans *expect* that newcomers know they are expected to learn R. This sustains R.
      *   **Normative "Ought":** A player who stubbornly joins as a 2nd Healer when R = T/H/3DPS is criticized *not just* for causing failure *but for violating the group's established convention/expectation*. "You *should* have gone DPS!" implies a norm based on mutual expectations.
  *   **Properties to Deliberately Lack:**
      *   **Explicit Agreement/Contract:** No guild charter, no vote, no verbal agreement required. The pattern emerges and stabilizes spontaneously through repeated interaction and newcomer socialization.
      *   **Institutional Enforcement:** No in-game mechanic *forces* role R. No GM punishes deviators. Sanction is social (criticism, exclusion from future raids).
      *   **Inherent Optimality:** Composition R isn't the *only* viable one (AA). A different composition (S) could be equally good *if adopted by all*.
  *   **Why avoid Institutional Contract?** Lewisian conventions explain *spontaneous order* and the emergence of norms *without* formal institutions. Contracts are a different mechanism (explicit agreement, often backed by law), obscuring the role of mutual expectations and CK in generating normative force from arbitrary solutions to CPs. They answer "how was it established?" differently.

  **3. Misconception Map & Intervention Points (15 mins)**

  1.  **Misconception: Convention Requires Explicit Agreement/Contract.**
      *   **Where Arises:** Likely early, when introducing CPs or the Raid Example ("But didn't they agree the first time?").
      *   **Form (Scientific Lens):** Mistaking models requiring communication/signaling for necessity in reality. Assuming rational agents must "negotiate" an equilibrium.
      *   **Intervention Point:** Immediately during Raid Example setup/discussion. Emphasize Lewis's core aim: explaining how norms arise *without* prior agreement. Highlight spontaneous emergence in EGT models (e.g., replicator dynamics converging to NE without communication). Stress: Agreement is one *way* a convention *might* start, but not necessary. CK of expectations sustains it.

  2.  **Misconception: Evolutionary Stability is Sufficient for Convention (Friend's Error).**
      *   **Where Arises:** After introducing Stability (BRS) or during Raid Example discussion of stability ("So it's stable, therefore it's a convention, right?").
      *   **Form (Scientific Lens):** Conflating ESS/Nash Eq with the complete explanation of social norms. Seeing stability as the endpoint, missing the normative dimension generated by expectations. Belief that dynamics explain everything.
      *   **Intervention Point:** **Crucially at Step 4 (CK/Normative Ought).** Explicitly contrast:
          *   *Stability Description:* "Players use R because deviating *alone* leads to failure/punishment (lower payoff)."
          *   *Convention/Norm:* "Players *ought* to use R *because* everyone mutually expects conformity to R, R solves the coordination problem, and R is arbitrary. Failure is *wrong* (violates expectation), not just costly." Ask: "Does stability alone explain the *criticism* directed at the deviant Healer, or just the *failure*? Where does the 'should' come from?" Link it back to the mutual expectations (CK).

  3.  **Misconception: Common Knowledge Involves Impossible Infinite Regress.**
      *   **Where Arises:** During Step 4 (CK introduction). ("How can anyone actually have infinite beliefs? This is unrealistic!")
      *   **Form (Scientific Lens):** Taking the logical definition literally as a cognitive requirement. Assuming agents must explicitly represent infinite hierarchies.
      *   **Intervention Point:** During CK explanation. **Clarify:** Lewis (and game theory) treats CK as a *state* or *disposition*, not an explicit cognitive representation. Emphasize the *behavioral* and *expectational* aspect:
          *   "It means everyone acts *as if* they know X, and *as if* they know others know X, etc." It's grounded in public evidence (the stable regularity R is *observable* to all). In the Raid, seeing veterans enforce R on newcomers provides public evidence that veterans *know* R is expected and *know* newcomers are expected to know it. The regress bottoms out in public facts/signals.

  **4. Omissions & Reasoning**

  *   **Later Evolutionary Dynamics (Signaling Games, Normative Emergence Models):** **Omit.** While fascinating and relevant long-term, introducing them *now* risks undermining the core distinction.
      *   **Why?** These models often *do* blur the line by showing how normative force *can* emerge from evolutionary dynamics (e.g., via costly signaling, punishment dynamics, gene-culture coevolution). The goal here is to firmly establish Lewis's *conceptual* distinction and normative mechanism (CK/expectations) *before* showing how evolution might bootstrap it. Introducing them prematurely validates the Friend's Error by suggesting ES dynamics *are* sufficient to generate the full normative convention in Lewis's sense.
  *   **Deep Dive into Philosophy of Language/Action:** **Omit.** Keep focused on core coordination/norm distinction relevant to CogSci. Avoid jargon like "collective intentionality" unless directly questioned.

  **5. Diagnostic Check-for-Understanding Question (Final 5 mins)**

  > "Consider a troop of chimpanzees foraging. Over generations, a stable pattern emerges: juveniles always avoid a specific type of fruit (Fruit X) that adults ignore. Observation shows adults suffer no ill effects from Fruit X, but juveniles who try it are quickly scolded and sometimes mildly punished by adults. This pattern is evolutionarily stable. Is this a Lewisian convention? Why or why specifically not? Focus on the distinction between stability and normative convention."

  *   **Why it works:**
      *   **Stability?** Yes (punishment maintains the juvenile avoidance).
      *   **CP?** Unclear/Probably Not. Is there a coordination problem solved by juveniles avoiding Fruit X? What's the miscoordination cost? Avoidance seems arbitrary *and* possibly non-functional (adults eat it safely). No clear alternative coordination equilibrium.
      *   **AA?** Irrelevant without a clear CP.
      *   **CK?** Unlikely full CK about expectations *concerning a coordination solution*. Juveniles likely interpret punishment as "this is forbidden/dangerous," not "we expect you to conform to *this arbitrary solution* to *our shared coordination problem*."
      *   **Normative "Ought"?** The "ought" here ("Don't eat Fruit X!") stems from perceived danger/authority/submission, not from mutual expectations sustaining an arbitrary solution to a CP. It's a *taboo* or *trained aversion*, not a convention.
  *   **Reveals Understanding:** A correct answer will identify the lack of a genuine coordination problem as the core missing element, preventing the stabilization from being a *solution* to a CP, and hence preventing the mutual expectations from having the specific normative character of a convention ("we do this because this is how *we* coordinate"). They might confuse it with a norm, but should distinguish the *basis* of the norm.

  **Core principle:** The normative force of a Lewisian convention arises solely from mutually known expectations within common knowledge, solving an arbitrary coordination problem; evolutionary stability explains persistence but cannot generate this specific "ought" without the underlying coordination framework and common knowledge.
