prompt: |-
  I reciently came out of surgery with some weird anasthetic after-effects, and now I'm obsessed with whether my whole inner movie is basically a confabulation I tell myself after the fact. I'm recording a podcast with a philosopher who defends strong illusionism about phenomenal consciousness — the view that there literally aren't any phenomenal properties, not just that we misrepresent them. I want eight to ten interview questions that don't just have him restate the position. I need at least one that presses the seems-like-seeing-red intuition and asks how he avoids dismissing first-person reports as just noise, plus a follow-up keyed to the standard reply that it's a belief about a belief. Another one should ask whether this collapses into full eliminativism about mental states, with a follow-up that uses the access-consciousness vs phenomenal-consciousness distinction he's likely to invoke, and then presses that distinction. And I want one that brings in predictive-processing talk about prediction error but forces him to do it without smuggling in a feeler — the follow-up should anticipate him saying the error signal is purely informational, then ask what makes it an error for the system if nothing actually feels wrong. Please keep what's settled in the literature separate from what's genuinely contested, and don't present the this-is-just-crazy objection as if it's a decisive refutation. End with a one-sentence summary of the question set on its own line.
