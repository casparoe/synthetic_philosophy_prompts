answer: |-
  Here’s a breakdown of your observed pattern, following your structure:

  ### 1. Brainstorm / Closest Neighbours  
  - **No True Scotsman (NTS)**: Close, but NTS redefines *essential criteria* to exclude counterexamples (e.g., "no *true* moral realist would say that!"). Your case redefines the *domain* of morality itself, not membership within it.  
  - **Special Pleading**: Anti-realists seem to arbitrarily treat convergent/divergent norms differently, but it’s framed as a theoretical distinction, not personal exemption.  
  - **Category Gerrymandering**: Not a named fallacy, but apt metaphor—strategically redrawing boundaries to win an argument.  
  - **Straw Man**: Not quite; they aren’t misrepresenting realism but reclassifying evidence.  
  - **Theory-Ladenness of Observation**: Relevant but broader—all data is interpreted through theory. Here, it’s *asymmetric* reclassification favoring one’s position.  

  ### 2. The Carving  
  **What it is**: A debater selectively labels *convergent* moral norms (e.g., prohibitions on killing innocents) as "not truly moral" (reducing them to biology/social convention), while treating *divergent* norms (e.g., purity codes) as paradigmatically "moral" to argue morality is subjective/illusory. This inflates disagreement as evidence against realism while deflating agreement as irrelevant.  
  **What it isn’t**:  
  - Not generic skepticism about moral realism: It specifically weaponizes the *asymmetry* in how evidence is categorized.  
  - Not honest theoretical disagreement: It becomes fallacious when reclassification is ad hoc to avoid counterevidence.  
  **Example**:  
  - Anti-realist: "Widespread disagreement (e.g., honor killings) proves no objective morality."  
  - Realist: "But all cultures agree on core norms like 'don’t murder innocents'."  
  - Anti-realist: "Those aren’t *moral*—they’re just evolutionary instincts. *Real* morality is about contested values like chastity or property rights."  

  ### 3. Name and Definition  
  **Proposed term**: **Moral Domain Gerrymandering**  
  **Definition**: The tactical redrawing of the boundaries of "morality" to exclude convergent norms as non-moral (e.g., biological/social) while including divergent norms as authentically moral, to artificially amplify disagreement and undermine moral realism.  
  **Boundary**: It applies when:  
  - Reclassification is asymmetric (convergence demoted, divergence elevated).  
  - Motivated by preserving the anti-realist position against counterevidence.  
  - Not justified by independent criteria (e.g., if evolutionary origins *always* disqualified norms, even divergent ones).  

  ### 4. Mirror Cases and Edges  
  **Mirror case (realist version)**: Realists sometimes dismiss *divergent* norms as "not truly moral" (e.g., "just cultural superstition"), while treating convergent norms as core morality. This is gerrymandering in reverse to *minimize* disagreement. Example: Realists might call honor killings "confused non-moral traditions" but label harm norms as objective morality.  
  **Edges and Blurriness**:  
  - **Legitimate theory-ladenness**: If a metaethical theory (e.g., naturalism) *consistently* holds that evolution explains all norms, it’s not gerrymandering—but if it only applies this to *convergent* norms, it is.  
  - **Blur into good faith debate**: When criteria for "moral" are explicitly defended (e.g., "only other-regarding norms count"), it’s theory-dependent—not gerrymandering. Gerrymandering emerges when reclassification is opportunistic and lacks principled consistency.  

  ### 5. Bottom Line  
  This is absolutely a real pattern—a tactical, asymmetric redefinition of "morality" that stacks the deck against realism. It’s not *inherently* fallacious (theories can legitimately define morality narrowly), but it becomes dialectically unfair when definitions shift opportunistically to neutralize counterevidence. You’ve spotted a named-worthy move: **Moral Domain Gerrymandering** captures its strategic boundary-rigging.
