answer: |-
  ## Term Paper Proposal: Dissolving Judy Benjamin via Evidential/Pragmatic Split

  **Bottom Line: Yes, this project is realistically doable within one semester.** The proposed split between evidential and strategic updating offers a focused, novel approach to the Judy Benjamin problem without collapsing into existing solutions or requiring excessive formal overhead.

  **Core Thesis:** The persistent puzzle in the Judy Benjamin case arises from conflating two distinct update mechanisms triggered by conditionals: *evidential* updating (Bayesian credence revision based on information) and *strategic* updating (action-guiding belief shifts affecting outcomes). Judy’s conditional (“If I stay, I’ll be shot”) is primarily pragmatic/strategic, guiding action choice, not demanding evidential credence revision about survival probability. Treating it as purely evidential creates a false paradox.

  **Precise Question:** Can distinguishing evidential conditionals (guiding credence) from pragmatic conditionals (guiding action) dissolve the Judy Benjamin stalemate? Specifically, does it allow her credence in survival to rationally remain high under evidential norms, while her decision to leave is driven by the strategic implications of the conditional? Does this distinction genuinely differ from Newcomb's problem dynamics?

  **Why Open?** Existing approaches (like Edgington's) often assume a unified update rule. This project argues the core debate—whether Judy *should* update her credence—is misplaced; it's not about conditionals *per se*, but about whether belief revision mechanisms can be sensitive to the action-guiding role of information.

  **Method & Timeline:**
  1.  **Month 1:** Formalize distinct update norms (evidential Bayesian vs. strategic action-driven) using simple decision matrices.
  2.  **Month 2:** Apply this framework rigorously to the Judy Benjamin case. Assess consistency with key norms like the Reflection Principle.
  3.  **Month 3:** Test robustness against potential counterexamples (e.g., medical testing scenarios). Refine the distinction.
  4.  **Deliverable:** A 6000-word paper arguing for the viability (or failure) of this split as a dissolution of the paradox.

  **Scope & Feasibility:** Scope is well-defined and achievable. Focusing on decision-theoretic framing (avoiding full formal semantics) and *applying* the distinction (not resolving Newcomb's) keeps it manageable within a semester. The core analytical work is targeted.

  **Defining Failure:** The project fails if:
  1.  The evidential/strategic distinction collapses under analysis or proves incoherent.
  2.  It necessitates rejecting core probabilism without yielding significant explanatory gains over unified approaches.

