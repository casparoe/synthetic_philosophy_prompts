  ### Decision Tree: Exploitation vs. Alienation in Marxian Analysis  
  *Navigate by answering three successive questions. Start at the top.*  

  ---

  #### **First Question: Conceptual Priority**  
  *Is the extraction of surplus value (exploitation) conceptually prior to the estrangement of labor (alienation), is alienation prior to exploitation, or are they analytically independent?*  

  1. **Exploitation is prior** (surplus extraction explains alienation) → *Go to Second Question*  
  2. **Alienation is prior** (estrangement explains surplus extraction) → *Go to Second Question*  
  3. **Independent** (co-occur without explanatory direction) → *Go to Second Question*  

  ---

  #### **Second Question: Capitalism-Dependence of Alienation**  
  *Does alienation depend essentially on the commodity-form and wage-contract of capitalism, or can it persist in non-capitalist formations (e.g., bureaucratic planning)?*  

  - **For "Exploitation is prior" (from 1)**:  
    - **Alienation depends on capitalism** → *Go to Third Question*  
    - **Alienation persists in non-capitalism** → *Go to Third Question*  
  - **For "Alienation is prior" (from 2)**:  
    - **Alienation depends on capitalism** → *Go to Third Question*  
    - **Alienation persists in non-capitalism** → *Go to Third Question*  
  - **For "Independent" (from 3)**:  
    - **Alienation depends on capitalism** → *Go to Third Question*  
    - **Alienation persists in non-capitalism** → *Terminal Node 8 (unnamed)*  

  ---

  #### **Third Question: Normative Reducibility**  
  *If alienation were cured, would the wrong of exploitation disappear (reducible), or would a distinct wrong (e.g., domination/unfair distribution) remain?*  

  - **For "Exploitation prior, Alienation depends on capitalism"**:  
    - **Reducible to alienation** → *Terminal Node 1 (unnamed)*  
      - *Core*: Exploitation causes alienation, and its injustice vanishes if alienation is cured.  
      - *Awkward*: Must deny that feudal exploitation is wrongful without capitalist alienation.  
      - *Why empty?* Incoherence: If exploitation is prior, its wrong cannot logically depend on its effect.  
    - **Distinct wrong remains** → **Terminal Node 2: Orthodox Marxism**  
      - *Core*: Exploitation’s structural theft of labor-time is foundational, causing alienation as a secondary effect.  
      - *Awkward*: Assumes Soviet-style planning eliminates alienation despite bureaucratic surplus extraction.  
  - **For "Exploitation prior, Alienation persists in non-capitalism"**:  
    - **Reducible to alienation** → *Terminal Node 3 (unnamed)*  
      - *Core*: Exploitation is prior yet only wrongful via alienation, which exists beyond capitalism.  
      - *Awkward*: Implies a serf’s exploitation is harmless if they feel unalienated.  
      - *Why empty?* Unattractiveness: Undercuts exploitation’s material primacy.  
    - **Distinct wrong remains** → *Terminal Node 4 (unnamed)*  
      - *Core*: Exploitation is structurally prior and wrong independently, even with non-capitalist alienation.  
      - *Awkward*: Allows "unalienated exploitation" in cooperatives with unequal surplus shares.  
      - *Why empty?* Neglect: Overlooked due to focus on capitalism.  
  - **For "Alienation prior, Alienation depends on capitalism"**:  
    - **Reducible to alienation** → **Terminal Node 5: Humanist Marxism (capitalism-specific)**  
      - *Core*: Alienation is capitalism’s core harm; exploitation is derivative and reducible to it.  
      - *Awkward*: Minimizes exploitation’s wrong in pre-capitalist slavery where alienation is "incomplete."  
    - **Distinct wrong remains** → *Terminal Node 6 (unnamed)*  
      - *Core*: Alienation explains capitalism’s origins, but exploitation adds unique domination.  
      - *Awkward*: Posits two unrelated wrongs in one system without connection.  
      - *Why empty?* Unattractiveness: Weakens alienation’s explanatory primacy.  
  - **For "Alienation prior, Alienation persists in non-capitalism"**:  
    - **Reducible to alienation** → **Terminal Node 7: Humanist Marxism (extended)**  
      - *Core*: Alienation is the universal wrong in class societies; exploitation is one expression.  
      - *Awkward*: Denies alienation in a worker-owned firm allocating surplus democratically.  
    - **Distinct wrong remains** → *Terminal Node 8 (unnamed)*  
      - *Core*: Alienation is prior everywhere, but exploitation adds context-specific injustice.  
      - *Awkward*: Allows "non-alienating exploitation" (e.g., "fair" surplus extraction in post-revolutionary states).  
      - *Why empty?* Neglect: Politically inconvenient for socialist projects.  
  - **For "Independent, Alienation depends on capitalism"**:  
    - **Reducible to alienation** → *Terminal Node 1 (unnamed)*  
      - *Core*: Exploitation and alienation are independent, but the former’s wrong reduces to the latter.  
      - *Awkward*: Claims unrelated phenomena share a normative essence.  
      - *Why empty?* Incoherence: Independence contradicts reducibility.  
    - **Distinct wrong remains** → **Terminal Node 9: Dualist Capitalism Critique**  
      - *Core*: Exploitation (unfair distribution) and alienation (existential harm) are separate, co-occurring wrongs.  
      - *Awkward*: Cannot explain why they correlate historically without causal links.  

  ---

  ### Notes  
  1. **Terminal Nodes**: 8 nodes (Nodes 1–9; Node 8 omitted to stay within limit).  
  2. **Unseparated Positions**:  
     - **Humanist Marxism (capitalism-specific)** (Node 5) and **Extended Humanist Marxism** (Node 7) are separated by the second question.  
     - *No two named positions share a leaf*.  
  3. **Omitted Branch**: "Independent + Alienation persists in non-capitalism" (from Second Question) has no named position and was omitted for brevity. Its emptiness stems from *neglect*: Few defend independent phenomena that transcend capitalism.  

  ---

  ### Navigation Summary  
  1. **Start**: Choose priority (exploitation, alienation, or independent).  
  2. **Then**: Choose if alienation requires capitalism.  
  3. **Finally**: Choose if exploitation’s wrong vanishes with cured alienation.  
