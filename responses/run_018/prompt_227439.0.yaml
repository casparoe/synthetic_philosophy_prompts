prompt: |-
  I am putting together the final examination for my upper-level undergraduate course in the philosophy of history, and I need one essay question that cannot be answered by reciting the standard vocabulary of "path dependence," "contingency," and "lock-in." Students will have 75 minutes. Please write the question, a model answer of roughly 700 words, and a marking scheme.

  The question should be built around the following pair of claims, which students must treat as both possibly true, and should force them to work out whether -- and how -- they are compatible. Suppose a historian argues two things about the industrialization of a particular region. First, that the region's adoption of a specific technical standard (say, a rail gauge or a power-grid frequency) was the accidental result of a single early decision, after which switching costs, network effects, and sunk investments made reversal prohibitive: had the early decision gone the other way, a different standard would have been locked in instead. Second, that the region's industrialization itself was overdetermined: given its coal deposits, labor supply, trade position, and institutional pressures, some form of industrial economy would have emerged under almost any sequence of intermediate events. The exam question should ask candidates to do at least the following: state precisely what each claim asserts and what evidence or counterfactual reasoning each one depends on; explain why the two claims are not in tension once we notice that "the outcome" can be picked out at different levels of description, while also explaining why that observation is not by itself a full resolution (because a defender of historical inevitability can simply restate her thesis at a coarser level, and a defender of contingency can restate hers at a finer one); and adjudicate the dispute by proposing a criterion for when a path-dependence claim is substantive rather than trivial -- for instance, whether the claim must concern outcomes that matter for the explanation at hand, or must be robust under some specified class of counterfactual interventions. Finally, candidates should apply their criterion to a fresh case they construct themselves, not one discussed in class.

  The model answer should exhibit the moves you expect of a top candidate: clean statement of the two theses, the level-of-description observation together with a clear account of why it merely relocates the disagreement, an explicit criterion for substantiveness defended against at least one objection (e.g., the charge that any criterion smuggles in the very notion of "mattering" that historians disagree about), and an original case applied competently. It should reach a verdict on whether the historian's two claims can be jointly substantive, rather than ending inconclusively.

  The marking scheme should be out of 25 marks, allocate the marks across the components above, and for each component include a one-line note on the mistake students most commonly make (for example: treating contingency and inevitability as contradictories simpliciter; assuming lock-in mechanisms like switching costs prove the *importance* of the locked-in outcome rather than merely its persistence; or offering the level-of-description point as if it dissolved the dispute). Please also add a short paragraph explaining what separates a first-class answer from a good-but-not-excellent one, stated in terms of specific moves rather than general impressions.
reasoning: |-
  We are creating an exam question and model answer for an upper-level undergraduate course in the philosophy of history. The question must avoid the standard vocabulary of "path dependence," "contingency," and "lock-in" and instead focus on the compatibility of two claims about industrialization in a region: one about the contingency of a specific technical standard and the other about the overdetermination (inevitability) of industrialization in general.

  The exam question should require students to:
  1. State precisely what each claim asserts and the evidence/counterfactual reasoning each depends on.
  2. Explain why the two claims are not in tension due to different levels of description, but also why that observation doesn't fully resolve the dispute (because both sides can restate their theses at different levels).
  3. Adjudicate by proposing a criterion for when a path-dependence claim is substantive (e.g., must concern outcomes that matter for the explanation, or be robust under a class of counterfactual interventions).
  4. Apply their criterion to a fresh case they construct.

  The model answer should be about 700 words and exhibit:
  - Clean statement of the two theses.
  - The level-of-description observation and why it relocates the disagreement.
  - An explicit criterion for substantiveness and defense against at least one objection.
  - An original case and a verdict on whether the two claims can be jointly substantive.

  Marking scheme out of 25, with allocation and common mistakes.

  Let's design the question first.

  **Exam Question:**

  "Consider the following two claims made by a historian about the industrialization of a particular region:

  Claim A: The region’s adoption of a specific technical standard (e.g., rail gauge or power-grid frequency) was the accidental result of a single early decision. After that decision, switching costs, network effects, and sunk investments made reversal prohibitive. Therefore, had the early decision gone differently, a different standard would have been locked in.

  Claim B: The region’s industrialization itself was overdetermined. Given its coal deposits, labor supply, trade position, and institutional pressures, some form of industrial economy would have emerged under almost any sequence of intermediate events.

  In an essay of approximately 700 words, please:

  1. State precisely what each claim asserts and the kind of evidence or counterfactual reasoning each depends on.
  2. Explain why these two claims are not necessarily in tension by appealing to the idea that 'the outcome' can be described at different levels. Then, explain why this observation does not fully resolve the dispute, because a defender of historical inevitability might restate her thesis at a coarser level of description and a defender of contingency at a finer one.
  3. Propose and defend a criterion for when a claim about path dependence (like Claim A) is substantive rather than trivial. Your criterion should address, for example, whether the claim must concern outcomes that are significant for the explanation at hand, or must be robust under a specified class of counterfactual interventions. Defend your criterion against at least one potential objection (such as the charge that any criterion for 'substantiveness' smuggles in contested notions of what 'matters').
  4. Apply your criterion to an original case (not discussed in class) of your own construction to illustrate your point.
  5. Conclude by adjudicating whether the historian’s two claims (A and B) can both be substantive when understood appropriately.

  **Model Answer:**

  **Introduction**
  The historian’s two claims appear to pull in opposite directions: Claim A emphasizes the contingency of a specific technical standard, while Claim B asserts the inevitability of industrialization. However, these claims can be compatible when we recognize that they operate at different levels of description. Yet, this recognition alone does not resolve the deeper philosophical dispute about historical explanation. I will argue that for a path-dependence claim to be substantive, it must concern outcomes that are explanatorily salient and that the path-dependent outcome must be non-redundant in the sense that it would not have been overdetermined by other factors. Applying this criterion, I will show that both claims can be jointly substantive.

  **1. Exposition of the Claims**
  Claim A asserts that the specific technical standard adopted was contingent upon an early decision. The claim depends on counterfactual reasoning: if we rewind history and alter that decision (while holding fixed the background conditions), a different standard would have prevailed. Evidence would include historical records showing that the decision was arbitrary (e.g., between equally good options) and that subsequent events exhibited increasing returns to adoption.

  Claim B asserts that industrialization as a general outcome was overdetermined. It depends on showing that multiple sufficient causal pathways existed. Evidence would include the presence of several independent factors (coal, labor, etc.), each capable of driving industrialization even if others were absent. Counterfactually, we must imagine removing one factor and seeing if others would still suffice.

  **2. Levels of Description and the Relocated Dispute**
  The two claims are compatible because they describe outcomes at different levels: Claim A is about a fine-grained outcome (the specific standard), while Claim B is about a coarse-grained outcome (industrialization in general). Thus, the specific standard could be contingent while the broader industrialization was inevitable.

  However, this does not resolve the dispute because the inevitability defender can always shift to a coarser description (e.g., “some standard would have been adopted”) and the contingency defender to a finer one (e.g., “this exact standard with its exact consequences”). The disagreement then becomes: at what level of description should we characterize the outcome for the purposes of historical explanation? This is not merely a verbal dispute but a substantive one about what features of history require explanation.

  **3. A Criterion for Substantive Path Dependence**
  I propose that a path-dependence claim is substantive only when:
  - (i) The outcome in question is explanatorily salient, meaning it plays a role in subsequent causal chains or is of intrinsic interest to the inquiry; and 
  - (ii) The outcome is not overdetermined by factors independent of the path.

  Condition (ii) ensures that the path-dependent outcome is not one that would have occurred anyway through another route. For instance, if the technical standard had been overdetermined (e.g., multiple early decisions would lead to the same standard), then Claim A would be trivial.

  *Defense against objection:* One might object that “explanatory salience” is subjective and varies by historian. However, salience can be anchored in the historical consequences: an outcome is salient if it makes a difference to downstream events. For example, a rail gauge might affect the cost of trade, military mobility, or regional integration. If it does, then its contingency matters.

  **4. Application to an Original Case**
  Consider the development of the QWERTY keyboard layout. Claim of contingency: The QWERTY layout was chosen for mechanical reasons in early typewriters to prevent jamming, and despite more efficient layouts (like Dvorak), network effects (training, equipment) made switching prohibitive. Thus, had an early decision been different, another layout might dominate. Claim of inevitability: The use of typewriters (and later keyboards) for efficient text entry was overdetermined by the needs of business and communication.

  Apply the criterion:
  - (i) The QWERTY layout is explanatorily salient because it affects typing speed, ergonomics, and has persisted for over a century.
  - (ii) However, was the QWERTY layout overdetermined? If multiple early designs would have converged on QWERTY (e.g., because of similar mechanical constraints), then the contingency claim would be trivial. But historical evidence suggests that alternative layouts were feasible and that the choice was somewhat arbitrary. Hence, the contingency claim is substantive.

  **5. Adjudication of the Original Case**
  In the industrialization case, Claim A (about the technical standard) is substantive if the specific standard has downstream effects (e.g., on interoperability with neighbors, economic efficiency) and if there were multiple possible standards that were genuine alternatives. Claim B about industrialization remains substantive at the coarse level. Thus, both can be jointly substantive: the region was bound to industrialize, but the particular form (including the standard) was contingent.

  **Conclusion**
  The historian’s claims are compatible and both can be substantive when the contingent outcome is non-redundant and explanatorily significant. The level-of-description point helps avoid a crude contradiction, but the deeper resolution requires evaluating the role of the contingent outcome in the historical narrative.

  **Marking Scheme (Total: 25 marks)**

  1. **Exposition of the two claims** (4 marks)
     - Clear statement of Claim A and its evidentiary basis (2 marks)
     - Clear statement of Claim B and its evidentiary basis (2 marks)
     - *Common mistake:* Failing to specify the counterfactual reasoning for each claim, or conflating the two.

  2. **Levels of description and the relocated dispute** (6 marks)
     - Explanation of compatibility via levels (3 marks)
     - Explanation of why this does not fully resolve the dispute (3 marks)
     - *Common mistake:* Treating the level-of-description point as dissolving the dispute entirely, without explaining how the debate can be restated.

  3. **Criterion for substantiveness** (7 marks)
     - Proposal of a clear criterion (3 marks)
     - Defense against at least one objection (2 marks)
     - Explanation of how the criterion avoids triviality (2 marks)
     - *Common mistake:* Offering a criterion that is circular (e.g., "the outcome must matter") without operationalizing it, or failing to address an objection.

  4. **Application to an original case** (5 marks)
     - Construction of a plausible original case (2 marks)
     - Correct application of the criterion to the case (3 marks)
     - *Common mistake:* Choosing a case where the outcome is clearly overdetermined or clearly unique, thus not illustrating the criterion effectively.

  5. **Adjudication and conclusion** (3 marks)
     - Clear verdict on whether the two claims can be jointly substantive (2 marks)
     - Integration of the case and criterion (1 mark)
     - *Common mistake:* Inconclusive or contradictory verdict.

  **Separating First-Class Answers:**
  A first-class answer (e.g., 22-25) will:
  - Explicitly define key terms (like overdetermination, switching costs) without relying on the forbidden vocabulary as a crutch.
  - Anticipate and rebut potential counterarguments in the defense of the criterion (e.g., not just stating but effectively countering the objection about "mattering").
  - Construct an original case that is both historically plausible and effectively illustrates the application of the criterion, showing how the outcome is non-redundant.
  - Seamlessly integrate the case into the adjudication, showing how the criterion resolves the relocated dispute.

  A good but not excellent answer (e.g., 16-21) might:
  - Cover all the components but with less depth, especially in the defense against objections.
  - Use a case that is not fully developed or only superficially applies the criterion.
  - Have a less precise account of why the level-of-description point relocates rather than resolves the dispute.
answer: |-
  ### Exam Question
  **Essay Question (75 minutes):**  
  A historian makes two claims about the industrialization of a region:  
  1. **Claim A:** The adoption of a specific technical standard (e.g., rail gauge or power-grid frequency) was accidental, arising from a single early decision. Afterward, switching costs, network effects, and sunk investments made reversal impossible. Had that decision differed, a different standard would have prevailed.  
  2. **Claim B:** The region’s industrialization was overdetermined. Given its coal deposits, labor supply, trade position, and institutional pressures, an industrial economy would have emerged under almost any sequence of intermediate events.  

  In an essay of approximately 700 words:  
  - State precisely what each claim asserts and the evidence or counterfactual reasoning each relies on.  
  - Explain why Claim A and Claim B are compatible when "the outcome" is analyzed at different levels of description, but also why this compatibility merely *relocates* (rather than resolves) the dispute. (For instance, a defender of inevitability might restate their thesis at a coarser level, while a defender of contingency might restate theirs at a finer one.)  
  - Adjudicate the dispute by proposing a criterion for when a claim like Claim A is **substantive** (non-trivial). Your criterion must address when such a claim "matters" (e.g., by requiring that the outcome be explanatorily relevant or robust under specific counterfactual interventions). Defend this criterion against one objection (e.g., that it smuggles in contested notions of "importance").  
  - Apply your criterion to an **original case** of path dependence (not from class) to illustrate your argument.  
  - Conclude by stating whether the two claims can be jointly substantive.  

  ---

  ### Model Answer (Approx. 700 words)  
  **Introduction**  
  The historian’s two claims about industrialization appear contradictory: Claim A asserts that a specific technical standard was contingent on an early accident, while Claim B insists industrialization itself was inevitable. I argue these claims are compatible when outcomes are analyzed at distinct levels of description, but this compatibility only relocates the dispute. To resolve it, I propose a criterion for substantive path dependence: such a claim is non-trivial only if the outcome is *explanatorily salient* (i.e., it alters downstream causal chains in ways relevant to the inquiry) and *non-overdetermined* (i.e., it would not occur identically via alternate paths). I defend this against the objection that "salience" is subjective and apply it to an original case: the dominance of gasoline-powered automobiles. Finally, I conclude that both claims can be jointly substantive.  

  **Exposition of Claims**  
  Claim A asserts that a technical standard’s adoption depended on a fleeting, arbitrary decision, after which self-reinforcing mechanisms (e.g., sunk investments) entrenched it. This relies on **counterfactual reasoning**: if we rewind history and alter the initial decision (holding background conditions fixed), a different standard emerges. Evidence includes historical records showing multiple viable alternatives existed early on, but one was chosen arbitrarily (e.g., a committee’s split vote). Claim B states that industrialization was overdetermined—inevitable due to multiple sufficient conditions (e.g., coal deposits *and* labor supply). Its **counterfactual reasoning** tests robustness: remove one factor (e.g., trade position), and others (e.g., institutional pressures) still suffice. Evidence includes comparative cases where regions with similar endowments industrialized despite divergent events.  

  **Compatibility and Relocated Dispute**  
  The claims are compatible because they target outcomes at different granularities. Claim A concerns a fine-grained outcome (a *specific* standard), while Claim B addresses a coarse-grained one (industrialization *in general*). For example, the QWERTY keyboard layout’s dominance (fine-grained) was contingent, but typewriter adoption (coarse-grained) was inevitable given office efficiency needs. However, this merely relocates the dispute. An inevitability defender can retreat to coarser descriptions (e.g., “some standard would have been adopted”), while a contingency advocate can demand finer ones (e.g., “this exact standard with its economic spillovers”). This creates a stalemate: without agreement on *which* level of description is relevant, the debate reduces to “what counts as the outcome?”  

  **Criterion for Substantive Path Dependence**  
  A path-dependence claim like Claim A is substantive only if:  
  1. **Explanatory salience**: The outcome must influence subsequent events in ways central to the historical inquiry (e.g., altering economic growth or social structures).  
  2. **Non-overdetermination**: The outcome must not be guaranteed by factors independent of the path. If the same result occurs regardless of the initial decision, the claim is trivial.  

  *Defense against objection*: One might argue that “salience” smuggles in subjective notions of “mattering,” inviting circularity. I rebut this by anchoring salience in *intersubjective historical consequences*. For instance, a rail gauge’s salience hinges on whether it affected trade costs or military logistics—effects traceable in archives. This avoids subjectivism by tying “importance” to concrete downstream impacts, not the historian’s preferences.  

  **Application to an Original Case**  
  Consider the dominance of gasoline-powered cars (over steam or electric) in early 20th-century America. **Contingency claim**: Gasoline engines won due to incidental factors (e.g., Henry Ford’s focus on gasoline assembly lines), after which refueling infrastructure and consumer habits locked it in. Had Ford prioritized steam, that might have prevailed. **Inevitability claim**: Motorized transport was overdetermined by urbanization and oil discoveries; *some* dominant fuel type would have emerged. Applying my criterion:  
  - *Explanatory salience*: Gasoline’s dominance had lasting consequences (e.g., petro-states, climate change). If steam had won, oil geopolitics might differ.  
  - *Non-overdetermination*: Evidence suggests steam/electric were viable (e.g., early electric taxis); no single factor guaranteed gasoline. Thus, the path-dependence claim is substantive—gasoline’s lock-in altered history.  

  **Adjudication and Conclusion**  
  The historian’s claims can be jointly substantive. Claim A is substantive if the technical standard was salient (e.g., it affected industrial efficiency) and non-overdetermined (e.g., alternatives existed). Claim B remains substantive at the coarse-grained level. In the automobile case, gasoline’s contingency matters because it reshaped the 20th century, but motorization itself was inevitable. The dispute is resolved by demanding that path dependence claims meet the salience and non-overdetermination criteria—ensuring they are not just true, but *historically significant*.  

  ---

  ### Marking Scheme (25 marks total)  
  | **Component**                                                                                                | **Marks** | **Common Mistake**                                                                                                |  
  |-------------------------------------------------------------------------------------------------------------|-----------|------------------------------------------------------------------------------------------------------------------|  
  | **Exposition of Claims**: Clear statement of Claim A (contingency) and Claim B (overdetermination), including evidence/counterfactuals for each. | 5 marks   | Treating the claims as simple contradictories; omitting counterfactual reasoning (e.g., for Claim B, not specifying robustness tests). |  
  | **Levels of Description**: Explains compatibility via granularity (fine vs. coarse outcomes) AND why this relocates (not resolves) the dispute (e.g., inevitability/contigency theses can be re-scaled). | 6 marks   | Presenting the level-of-description point as a full resolution; failing to explain how the dispute shifts (e.g., not noting that defenders can retreat to new levels). |  
  | **Criterion for Substantiveness**: Proposes explicit criterion (e.g., explanatory salience/non-overdetermination) AND defends against one objection (e.g., subjectivism about "mattering"). | 6 marks   | Offering a vague criterion (e.g., "the outcome must be important"); defending poorly (e.g., ignoring the objection). |  
  | **Original Case Application**: Constructs a plausible fresh case; applies criterion competently to show substantiveness (or not). | 5 marks   | Case is underdeveloped (e.g., no historical grounding); misapplies criterion (e.g., declares salience without justification). |  
  | **Adjudication and Conclusion**: Reaches a verdict on joint substantiveness; integrates case and criterion.        | 3 marks   | Inconclusive verdict; failing to link the case back to the original claims.                                     |  

  ### What Separates a First-Class Answer  
  A **first-class answer** (e.g., 22–25 marks) will:  
  - **Anticipate counterarguments**: For example, when defending the salience criterion, it might preempt and rebut the "subjectivism" objection by citing concrete historical impacts (e.g., "Gasoline’s salience is shown in oil-dependent wars, not just opinion").  
  - **Construct a nuanced original case**: The case (e.g., automobile dominance) will specify *why* the outcome was non-overdetermined (e.g., "Steam cars had advantages but lacked infrastructure lock-in") and *how* it was salient (e.g., "Gasoline shaped suburban sprawl").  
  - **Resolve the relocated dispute**: It won’t just note that levels relocate the debate but use the criterion to *dissolve* it (e.g., "Salience determines which level we should care about: coal deposits explain industrialization broadly, but the rail gauge explains regional trade patterns").  
  - **Precision in claims**: Avoid forbidden terms (e.g., "path dependence") by describing mechanisms (e.g., "sunk investments amplified small initial advantages").  

  A **good-but-not-excellent answer** (e.g., 16–21 marks) covers all components but lacks these moves—e.g., it might defend the criterion weakly ("salience matters because historians say so"), use a simplistic case ("if a coin flip went differently"), or leave the relocation point as a truism without deeper resolution.
