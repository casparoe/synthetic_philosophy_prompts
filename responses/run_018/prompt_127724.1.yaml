  - 5-35 min: Group work (30 min).
  - 35-45 min: Group presentations (2 min each, total 4 min, plus 1 min for setup, so 5 min? We have 10 min allocated for presentations and transition to tribunal. Let's say: 35-40: Group A presents; 40-45: Group B presents; 45 min: start tribunal).
