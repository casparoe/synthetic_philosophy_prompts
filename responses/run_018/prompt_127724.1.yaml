  - Then debrief: 20 min (55-75)

  But Round Two is important for the "losers have to translate" part. Alternatively, we can skip Round Two if time is tight? But the design includes it. Let's keep Round Two but make it shorter.

  Revised Timeline (75 min):
  - 0-5: Setup (5 min)
  - 5-30: Group work (25 min) [Note: They might need 30, but we can push them to be quick. Or we can start with 25 and if needed take 5 from buffer?]
  - 30-35: Presentations (5 min)
  - 35-45: Tribunal (10 min) [We do 3 criteria, each with quick vote and tally. We can do: 2 min per criterion?]
  - 45-50: Round Two problem and setup (5 min) [Give the new problem and explain they use the winner's framework. Groups work for 5 min?]
  - 50-55: Round Two presentations and points (5 min) [Each group 1 min presentation, 2 min for awarding points and winner's effect]
  - 55-75: Debrief (20 min) [We use the buffer if needed, but 20 min debrief is crucial]

  **Debrief Questions** (20 min):
  1. Start by asking: "What just happened? How did it feel?" (5 min open discussion)
  2. Then, introduce the concept: "This is what we call functional equivalence with path dependence. The core idea (instantaneous change) was discovered by both groups, but the form (geometric vs. algebraic) was different. And that form had consequences."
  3. Map the experience:
     - When did the solution feel inevitable? (During the group work? When the answers were the same?)
     - When did the form matter? (During the tribunal? When having to use the winner's framework in round two?)
     - How did it feel to have to translate your work into the other group's framework? (For the losing group)
  4. Connect to history: Newton vs Leibniz (geometric fluxions vs algebraic differentials), Darwin vs Wallace (gradualism vs Malthusian pressure). The form led to different research programs: Leibniz notation enabled the continental mathematicians to advance calculus more easily, while Newton's fluxions were less transferable. In biology, Darwin's gradualism became the mainstream and influenced the Modern Synthesis, while Wallace's emphasis on environmental pressures might have been more compatible with later ideas in ecology and biogeography.
  5. Limitations: 
