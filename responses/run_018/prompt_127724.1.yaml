    - Graph paper, rulers, pencils.
  - For Group B:
    - A card with instructions for the algebraic method:
      "Use algebraic reasoning: The instantaneous rate of change is the limit as h approaches 0 of [f(a+h) - f(a)] / h. Apply this to f(x)=x^2 and simplify the expression before taking the limit."
    - Paper, pencils, and perhaps a card reminding them of algebraic expansion rules.

  **Rules**:
  1. The class is split into two groups of 6. Each group gets their toolkit card and materials.
  2. Groups work independently for 30 minutes to solve the problem. They must use the method on their card. They should not communicate with the other group.
  3. Each group must write their solution on a poster or whiteboard for presentation. The solution must include:
     - The answer (which should be 2a for both groups).
     - The steps they took.
     - The notation they used (e.g., Group A might use geometric diagrams, Group B might use Leibniz-like or Newton-like notation).
  4. After 30 minutes, each group presents their solution (2 minutes each).
  5. Then, the "Priority Tribunal" begins (15 minutes):
     - The instructor (or a student moderator) will propose criteria for assigning credit. Criteria cards (prepared in advance) are drawn randomly one by one. Examples:
          - "First to finish": Which group completed their solution first? (But note: we might not have recorded that, so adjust. Alternatively, we can ask groups when they finished and note it.)
