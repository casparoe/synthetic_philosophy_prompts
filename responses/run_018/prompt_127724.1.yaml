  **Final Note**: The instructor should not lecture about the concept until the debrief. The power of the exercise is in the lived experience. Keep the setup casual: "Today we're going to do a group problem-solving activity. You'll be split into two groups, each with a different approach to a problem. Work independently and then we'll discuss."

