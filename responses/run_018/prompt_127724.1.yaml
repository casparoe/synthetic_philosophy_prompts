          - "Most rigorous": Which group's method feels most mathematically sound?
          - "Most future-proof": Which group's method seems most adaptable to new problems?
          - "Most elegant": Which group's solution is most aesthetically pleasing?
     - After each criterion is announced, the class votes by show of hands (or using sticky notes) for which group wins on that criterion. Each criterion is worth 2 reputation points (so the group that wins gets 2 points for that criterion).
     - We use 3-4 criteria to keep it within time.
  6. The group with the most reputation points wins the tribunal. In case of a tie, the instructor breaks it arbitrarily (or by one more criterion).
