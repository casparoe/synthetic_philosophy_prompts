  First, I need to recall the key points of Dennett's models. The Cartesian theater is the idea of a central place where consciousness happens, with a "show" for a homunculus. Dennett rejects this in favor of multiple drafts: parallel processes where narratives compete, and the winning one becomes conscious without a central point. Fame in the cortex is about which drafts gain influence through recurrent processing. Editorial processes involve constant revision and selection.

  For split-brain patients, the left hemisphere (language-capable) confabulates reasons when the right hemisphere acts. From Dennett's view, the left isn't a central narrator but a module generating a plausible story after the fact. The confabulation is a draft created to make sense of the action, which gains fame because it fits the available cues and the left's narrative drive. The right hemisphere's draft (the actual reason) isn't verbal, so it doesn't compete linguistically, leading to the left's story dominating.

  Why do they appear unified normally? Dennett would say the corpus callosum allows constant information exchange, so drafts are coordinated. Without it, the hemispheres operate independently, but in daily life, the environment provides consistent inputs to both, reducing conflict. The brain's tendency to maintain coherence through confabulation and selective attention helps present a unified front.

