  What evidence would favor Cartesian theater? If confabulation were absent and patients reported simultaneous conflicting experiences, that would suggest a central observer. Or if surgically reconnecting hemispheres restored integration instantly, implying a central hub. But that's not the case—integration takes time, supporting multiple drafts.

