answer: |-
  *(Adjusting glasses, sharp tone)* Your tremble argument conflates solution concepts. Rationalizability relies solely on common belief in rationality—no trembles involved. If a pure strategy is weakly dominated, there exists *some* belief where it isn't a best response. Elimination of such strategies is epistemically necessary: a rational player *never* plays something that isn't a best reply to *any* conjecture. Continuity changes nothing—weakly dominated strategies still fail the best-response test for certain opponent profiles. The epsilon-tremble defense only applies to *equilibrium refinements* like perfection, not to iterative removal based on dominance *in the actual game*. Your objection smuggles in equilibrium logic. 

