  1. Commitment: Each player secretly decides whether to commit (to force themselves to escalate in Round 2). They write their decision and give to facilitator.

  2. Round 1:
     - A and B choose simultaneously: D or E.
     - If both D: game over, peace. Payoffs: 10 each.
     - Otherwise, proceed.

  3. Facilitator reveals Round 1 choices and then the commitment decisions.

  4. Round 2:
     - Players who committed must choose E.
     - Players who did not commit choose D or E.
     - If both choose D: game over, peace. Payoffs: 10 - (1 if they chose E in Round 1).
