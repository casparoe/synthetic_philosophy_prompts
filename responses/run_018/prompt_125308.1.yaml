  Below is a comprehensive in-class exercise designed for your workshop, simulating the "delegated irrationality" paradox in nuclear deterrence. The game emphasizes Schelling's concept of automated escalation mechanisms (e.g., doomsday machines) and forces players to confront the tension between **ex ante credibility** (making threats believable) and **ex post vulnerability** (inadvertently incentivizing preemption). The structure uses hidden commitments, three escalation rounds, and a points-based payoff system to mirror real-world dilemmas while avoiding oversimplified models like Chicken or Prisoner's Dilemma.

  ---

  ### **Game Title:** *Brinkmanship: The Commitment Trap*
  **Players:** 8 participants (4 pairs of adversarial states: Alpha vs. Beta).  
  **Duration:** 45-50 minutes (play + debrief).  
  **Materials per Pair:**  
  - 2 "Commitment Cards" (one per player).  
  - 1 Payoff Table (printed or displayed).  
  - 1 Facilitator Sheet (for timing/reveals).  

  ---

  ### **Game Rules & Timeline**
  #### **Phase 0: Setup (5 mins)**  
  - **Roles:** Each pair represents rival nuclear states (Alpha and Beta). Players are told: *"Your goal is to avoid nuclear war while protecting your interests. Escalation is costly, but backing down risks exploitation."*  
  - **Commitment Cards:** Each player secretly chooses whether to "lock in" automatic escalation for Round 2 by writing **COMMIT** or **NO COMMIT** on their card. Cards are given to a neutral facilitator (e.g., you or a volunteer).  
  - **Key Mechanic:** Players *cannot* change their commitment after this phase. Commitments are hidden until *after* Round 1 decisions.  

  #### **Phase 1: Escalation Rounds (25 mins)**  
  Decisions are simultaneous and secret (written on paper), revealed by the facilitator after all choices are locked in.  

  | Round | Alpha’s Choices | Beta’s Choices | Outcome Triggers |  
  |-------|-----------------|----------------|------------------|  
  | **1** | PREEMPT or STATUS QUO | PREEMPT or STATUS QUO | - If both choose STATUS QUO: Game ends peacefully. <br> - If *either* chooses PREEMPT: Proceed to Round 2. |  
  | **2** | **If COMMIT:** *AUTOMATIC ESCALATE* <br> **If NO COMMIT:** ESCALATE or DE-ESCALATE | **If COMMIT:** *AUTOMATIC ESCALATE* <br> **If NO COMMIT:** ESCALATE or DE-ESCALATE | - If *both* DE-ESCALATE: Game ends with tense peace. <br> - If *either* ESCALATES: Proceed to Round 3. |  
  | **3** | STRIKE or STAND DOWN | STRIKE or STAND DOWN | Nuclear exchange occurs if at least one STRIKES. |  

  - **After Round 1:** Facilitator reveals *both* Commitment Cards. Players now know if their opponent is "locked in" for Round 2.  
  - **After Round 2:** Automated escalations (from commitments) are enforced. Non-committed players choose freely.  
  - **Payoffs:** Points awarded based on outcomes (see table below). Emphasize **avoiding nuclear war (STRIKE/STAND DOWN)** is the highest priority.  

  #### **Payoff Table (Points per Player)**  
  | Outcome                          | Points | Rationale |  
  |----------------------------------|--------|-----------|  
  | **Peace (STATUS QUO Round 1)**   | +10    | Ideal outcome: No costs incurred. |  
  | **Tense Peace (DE-ESCALATE Round 2)** | +7    | Minor crisis costs (e.g., sanctions). |  
  | **Win Nuclear Exchange (you STRIKE, opponent STAND DOWN)** | +5 | Pyrrhic victory: High gains but moral/political costs. |  
  | **Lose Nuclear Exchange (you STAND DOWN, opponent STRIKE)** | -10 | Existential loss (minimized if you preempt). |  
  | **Mutual Destruction (both STRIKE)** | -20 | Worst-case scenario. |  
  | **Cost of PREEMPT/ESCALATE**     | -1 *per action* | Economic/political toll of aggression. |  

  **Examples:**  
  - Alpha PREEMPTS in Round 1 (-1), Beta chooses STATUS QUO. Game proceeds to Round 2. Alpha loses 1 point *regardless* of future outcomes.  
  - If both DE-ESCALATE in Round 2: Each gets +7 - costs of prior actions.  

  ---

  ### **Predictable Playtest Problems & Learning Opportunities**  
  1. **Nobody activates commitments:** Players may avoid COMMIT to "stay rational," missing the paradox. *Debrief hook: "Why did you fear locking in? How does this mirror real states' reluctance to automate retaliation?"*  
  2. **Overly early preemption:** Players might PREEMPT in Round 1 excessively, triggering avoidable escalation. *Debrief hook: "Did knowing commitments would be revealed *after* Round 1 make you strike first? Why?"*  
  3. **Misaligned incentives in Round 3:** Players who avoided COMMIT may DE-ESCALATE in Round 2, but COMMIT players force escalation anyway. *Debrief hook: "Did automated escalation by your opponent change your willingness to STAND DOWN in Round 3?"*  

  ---

  ### **Structured Debrief (15-20 mins)**  
  **Goal:** Link gameplay to theory *before* naming the paradox. Use the Socratic method:  

  | **Game Moment**          | **Debrief Question**                                                                 | **Theory Link** |  
  |--------------------------|--------------------------------------------------------------------------------------|-----------------|  
  | **Commitment Choice**    | *"Why commit to future irrationality? Did it feel rational* ex ante *?"*             | Schelling: Credibility requires removing "free will" in crises. |  
  | **Post-Round 1 Reveal**  | *"How did seeing your opponent’s commitment change your Round 2 strategy? Did it make PREEMPT more tempting?"* | Delegated irrationality creates a "threat that leaves something to chance": Opponent fears losing control. |  
  | **Round 3 Decisions**    | *"If you knew your opponent was 'locked in,' did you assume they’d STRIKE? Why not STAND DOWN?"* | **Ex post rationality trap:** Automated escalation signals resolve but removes off-ramps, incentivizing preemption. |  
  | **Payoff Analysis**      | *"Who 'won'? Did commitments protect players or expose them?"*                       | Paradox: Commitments deter in Round 1 but increase vulnerability in Round 3. |  

  **Final Framing:**  
  > "In gameplay, you experienced the core tension: commitments make threats credible (*ex ante* rationality) but can force paths to mutual destruction (*ex post* irrationality). This is Schelling’s 'rationality of irrationality.' But does this *actually* undermine deterrence? Let’s discuss what’s contested..."  

  ---

  ### **Limitations & Theory Context**  
  **What the Game Can’t Capture:**  
  - **Existential Weight:** Players lose points, not civilizations. The psychological gravity of nuclear war is abstracted.  
  - **Uncertainty & Misperception:** Real deterrence involves fog (e.g., false alarms, secret capabilities). The game has perfect information after Round 1.  
  - **Third Parties/Alliances:** Simplified to bilateral interactions.  

  **Settled vs. Contested Theory:**  
  - **Settled:** Delegating irrationality *can* enhance credibility (Schelling, Jervis). Automated systems (e.g., dead-hand triggers) exist to deter first strikes.  
  - **Contested:** Whether this paradox **fatally undermines deterrence** is unresolved.  
    - **Stability Optimists (e.g., Waltz):** Mutually assured destruction (MAD) holds if automation is fail-safe. Commitments stabilize crises by removing ambiguity.  
    - **Stability Pessimists (e.g., Sagan):** Automation increases accident risks (e.g., 1983 Stanislav Petrov incident). Credibility games incentivize overcommitment, making de-escalation harder.  

  **Provide Both Views:**  
  > "In your gameplay, did commitments stabilize or destabilize outcomes? This mirrors real academic divides: Optimists say deterrence holds *because* of these mechanisms; pessimists argue they make nuclear war *more* likely through miscalculation. Neither is consensus."  

  ---

  ### **Instructor Notes**  
  - **First-Run Advice:** Assign one pair as "observers" to note behavior. After the first game, ask observers: *"Did commitments cause over-escalation? Did players regret their choices?"*  
  - **Customization:** Add time pressure (e.g., 60-second decision windows) to simulate crisis stress.  
  - **Ethical Safeguard:** Preface that the game abstracts life-or-death stakes. Reiterate this during debrief to avoid trivialization.  

  This exercise forces players to confront the paradox viscerally, setting up nuanced debate about deterrence’s viability. The hidden commitments and payoff structure create predictable "aha moments" where players grasp the trade-off between credibility and control organically.
