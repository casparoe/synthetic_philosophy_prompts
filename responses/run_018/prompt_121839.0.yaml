      | "result == " ("C" | "D" | "TIMEOUT")

  Then we can have:

  IfStatement := "if" "(" IfCondition ")" "{" Statement* "}" "else" "{" Statement* "}"

  Then the statements become:

  Statement := 
      | OutputStatement
      | SimulateStatement
      | IfStatement

  We'll write this clearly in a handout.

  **What the activity cannot reproduce:**
  - The real idea that in the limit of unbounded computation, we can achieve cooperative equilibria via fixed-point theorems (like in the model of Tennenholtz and others). But we are bounded by the step limit.
  - The connection to formal game theory (like program equilibrium) might be too abstract. We have to state that the strategy space is now the set of programs, and the payoff is defined by the output when run against each other.

  **Final note:** The activity is designed to be experiential. The debrief must tie the students' experiences to the concepts. We might not get perfect cooperation in Round 2, but we should see some. The obfuscation round might lead to more defection, which teaches the importance of robustness.

