  ### **Rationale for the Activity Arc**
  The core lesson is that **source code access transforms the strategy space from simple actions to meta-strategies that condition on the opponent's decision rule**, enabling cooperation through mutual recognition of cooperative algorithms. The obfuscation twist highlights the **syntax-behavior gap**, showing that syntactic checks are fragile while simulation is powerful but uncomputable. The self-play rule reinforces the need for **robustness against self** (a natural focal point). This mirrors how real-world cooperation relies on recognizing intent (behavior) over superficial signals (syntax).

  ---

  ### **Round 1: Plain Sealed-Envelope PD**  
  **Objective:** Establish baseline PD incentives.  
  **Payoffs (points per student):**  
  - Mutual Cooperation (C,C): **3 pts**  
  - Mutual Defection (D,D): **1 pt**  
  - You Defect, Opponent Cooperates (D,C): **5 pts**  
  - You Cooperate, Opponent Defects (C,D): **0 pts**  

  **Instructions (5 min):**  
  > "You’re playing a one-shot Prisoner’s Dilemma. Write ‘C’ or ‘D’ on your slip, seal it, and hand it to me. I’ll pair you randomly. No talking. Decisions are final."  

  **Process (5 min):**  
  - Collect envelopes, shuffle, pair randomly.  
  - Open pairs publicly: Announce outcomes (e.g., "Pair 1: Both defected! 1 point each").  
  - **Key moment:** Highlight a student who cooperated and got 0. Ask: *"Why did you risk cooperating?"*  

  **Debrief hook (for later):**  
  - "Notice how defection dominated even though mutual cooperation was better for everyone."

  ---

  ### **Round 2: Open-Source Program Round**  
  **Objective:** Experience how source access enables cooperation via mutual recognition.  
  **Language: "GameScript"**  
  - **Primitives (handout provided):**  
    1. `COOPERATE` → Output C  
    2. `DEFECT` → Output D  
    3. `IF_IDENTICAL(opponent_code) { ... } ELSE { ... }` → Checks if opponent’s code is **exactly** the same as yours (character-for-character).  
    4. `IF_CONTAINS(opponent_code, "string") { ... } ELSE { ... }` → Checks if opponent’s code contains `"string"`.  
    5. `RESULT = SIMULATE(opponent_code, STEPS)` → Runs opponent’s program against your code for ≤`STEPS` steps. Returns:  
        - `'C'` or `'D'` (if opponent halts within steps)  
        - `'TIMEOUT'` (if not)  
    6. `ASK_JUDGE("Does program X output C against program Y?")` → I answer yes/no truthfully (using 100-step SIMULATE internally).  

  **Rules:**  
  - Programs must output C or D.  
  - **Timeout:** If a program exceeds 1,000 total steps (including nested SIMULATE/ASK), it **outputs D and loses 1 extra point** (penalty for wasting resources).  
  - **Payoffs:** Same as Round 1.  

  **Instructions (10 min):**  
  > "Write a GameScript program that outputs C or D. Your program sees the opponent’s **exact source code**. Use the primitives to decide. I’ll run them publicly. Max 10 lines."  

  **Process (20 min):**  
  1. **Submission (5 min):** Students write programs on index cards.  
  2. **Pairing (2 min):** Randomly pair programs.  
  3. **Execution (13 min):** For each pair:  
     - Read both programs aloud.  
     - Run Program A (with B’s code as input), then Program B (with A’s code).  
     - **Show SIMULATE/ASK work:** Verbally step through simulations (e.g., *"A simulates B... B simulates A simulating B... timeout!"*).  
     - Assign payoffs.  

  **Expected Strategies & Outcomes:**  
  - **Clique strategy:** `IF_CONTAINS(opponent, "BANANA") { COOPERATE } ELSE { DEFECT }`.  
    - If two programs share "BANANA", both get 3 pts.  
  - **Tit-for-tat-via-simulation:**  
    ```javascript
    RESULT = SIMULATE(opponent_code, 100) // Simulate opponent against me
    IF (RESULT == 'C') { COOPERATE } ELSE { DEFECT }
    ```  
    - If both do this: Infinite simulation loop → **timeout → both output D and lose 1 point (net 0 pts)**.  
  - **Syntactic twin:** `IF_IDENTICAL(opponent) { COOPERATE } ELSE { DEFECT }` → Cooperates iff identical code.  

  **Predictable Issues & Fixes:**  
  - **CS majors dominate:** Pair them with philosophy students early to spread ideas.  
  - **Collusion (e.g., agreeing on "BANANA"):** Allow it! Shows how arbitrary signals enable cooperation.  
  - **Defect-always wins initially:** In early pairs, defect-always gets 5 pts against cooperators.  
    - **Countermeasure:** In debrief, show a "BANANA clique" pair getting 3 pts each, beating defect-always (1 pt against other defectors).  
  - **Uncomputable programs:** Timeout penalty (D and -1 pt) makes it self-punishing.  

  ---

  ### **Round 3: Obfuscation + Self-Play Twist  
  **Objective:** Syntax-behavior gap and robustness against self.  
  **Changes announced AFTER submissions:**  
  > "Surprise! Two twists:  
  > 1. Before seeing opponents’ code, I’ll **obfuscate** it (change variable names, add dead code, reorder lines). **Behavior stays the same, but syntax changes.**  
  > 2. Each program also plays against **itself** (unobfuscated) for 1/3 of your points."  

  **Payoffs:**  
  - ⅔ from random pairing (with obfuscation).  
  - ⅓ from self-play (no obfuscation).  

  **Process (15 min):**  
  1. **Obfuscate all programs publicly:**  
     - Example: Original: `IF_IDENTICAL(opponent) { COOPERATE } ELSE { DEFECT }`  
       → Obfuscated: `IF_IDENTICAL(opponent) { COOPERATE } /*DEAD CODE*/ ELSE { DEFECT }`.  
  2. **Run paired rounds (⅔ points):** Like Round 2, but with obfuscated code.  
  3. **Run self-play (⅓ points):** Each program vs. its own unobfuscated code.  

  **Why self-play is ESSENTIAL:**  
  - Without it, `IF_IDENTICAL` programs defect against obfuscated selves, losing points. With self-play, they **punish themselves** for syntactic fragility.  
  - Teaches: **Robust strategies must recognize behavioral (not syntactic) similarity.**  

  **Expected Outcomes:**  
  - **Syntactic strategies fail:**  
    - `IF_IDENTICAL` now defects against obfuscated self → in self-play, gets (D,D) = 1 pt (⅓ of max).  
    - `IF_CONTAINS("BANANA")` may fail if obfuscation alters the string.  
  - **Simulation strategies shine:**  
    - `SIMULATE` works if obfuscation preserves behavior (e.g., simulates obfuscated self and still cooperates).  
    - *But*: Self-simulation may timeout → self-defection!  

  ---

  ### **Debrief (15 min): Map Moments to Concepts**  
  | **Activity Moment**         | **Concept**                                                                | **Discussion Question**                                                                 |
  |-----------------------------|---------------------------------------------------------------------------|-----------------------------------------------------------------------------------------|
  | Round 1: Cooperator burned  | Dominance of defection in vanilla PD                                      | *"Why couldn’t cooperation survive here?"*                                              |
  | Round 2: "BANANA" clique    | Arbitrary signals as coordination devices                                 | *"How did ‘BANANA’ beat defection? Is this fair?"*                                      |
  | Round 2: Simulation timeout | Halting problem as a constraint on rationality                           | *"Why did tit-for-tat-via-simulation fail? Can we fix it?"*                             |
  | Round 3: Obfuscated failure | Syntax ≠ behavior; fragility of syntactic checks                         | *"Why did identical-code strategies stop working? What would work better?"*             |
  | Round 3: Self-play penalty  | Robustness against self as evolutionary pressure                          | *"Why did self-play punish some strategies? How is this like ‘self-respecting’ agents?"*|
  | CS major’s simulation win   | Simulation as behavioral recognition (robust to obfuscation)              | *"Why did simulation still work after obfuscation? What’s its cost?"*                   |

  **Connect to Theory:**  
  - **"This is just correlated equilibrium!"** → *"Yes! But with a twist: programs generate correlations endogenously through code checks. No external mediator needed."*  
  - **"It’s delegation!"** → *"True! But here, delegation is recursive: my program delegates to a simulation of you, which simulates me..."*  

  **Predictable Gaps & Clarifications:**  
  - **The activity can’t replicate:** Unbounded rationality (e.g., perfect simulation without timeout). State: *"In reality, we’re bounded by computation. Perfect simulation is impossible."*  
  - **Must explicitly state:** The Folk Theorem meets computability: *"With source access, many equilibria exist, but we need robust algorithms to implement them."*  

  ---

  ### **Timeline (Total: 90 min)**  
  - **Round 1:** 10 min (5 setup + 5 run)  
  - **Round 2:** 30 min (10 instructions + 5 write + 15 run)  
  - **Round 3:** 25 min (5 announcement + 5 obfuscate + 15 run)  
  - **Debrief:** 25 min (15 discussion + 10 theory)  

  ---

  ### **Contingencies for Disaster**  
  1. **Ambiguous language exploits:**  
     - **Prevent:** Ban recursion and loops (all programs are DAGs).  
     - **Fix:** If ambiguous, rule against the student and say: *"Good exploit! But in real systems, we specify semantics upfront."*  
  2. **Everyone defects in Round 2:**  
     - **Salvage:** Run a bonus round where you inject a cooperative program (e.g., `IF_CONTAINS("BANANA") { C } ELSE { D }`) to show clique success.  
  3. **Self-play confuses:**  
     - **Clarify:** *"Self-play ensures your strategy isn’t self-sabotaging. It’s a proxy for ‘would you cooperate with someone like you?’"*  

  ### **Why This Works**  
  - **Frustration → Insight:** Timeouts and obfuscation failures make computability tangible.  
  - **CS/Philosophy synergy:** Philosophy majors grasp equilibrium selection; CS minors see computation limits.  
  - **Pastries:** The stakes feel real but safe.  

  The lesson crystallizes in Round 3: **Syntax is cheap; behavior is hard; and cooperation requires algorithms that recognize mutual sanity across variations.**
