  hey, quick sanity check on an essay outline. i'm applying the reference class problem to rousseau's anti-theater letter in geneva — specifcally, he treats geneva as belonging to the same corruption-class as paris, but the actual audience was mostly foreign merchants, not the native bourgeois citizens he wants to protect. so there's a hidden class-error: the risk applies to a different subgroup than the refernece class he's reasoning about. outline: (1) rousseau's presence-vs-representation argument, (2) the demograpic split and the misapplied base rate, (3) whether correcting the class kills the empirical claim but spares the normative one, (4) what that says about whether his argument was ever really empirical. is the mapping too forced? also, i think the merchants were the ones lobbying for theater — should i lean on that or frame it hypothetically since i can't verify without searching? don't want to build the essay on sand. thoughts?
