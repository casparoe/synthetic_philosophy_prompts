answer: |-
  Your novel's core concept brilliantly intersects with a pivotal moment in policy modeling—the **Limits to Growth (LtG) controversy**. Here’s the conceptual architecture of that episode, dissected through your character’s ethical lens:

  ---

  ### **The LtG Episode: Embedded Time Preference in WORLD3**
  1. **Principal Actors & Motivations**:
     - **MIT Group (Meadows/Forrester)**: Modeled global systems (population, resources, pollution) using **WORLD3**, a dynamic systems model. Their goal was **crisis prevention** through early intervention.
     - **Sponsor (Club of Rome)**: Sought to challenge **growth orthodoxy** by highlighting long-term ecological risks.
     - **Early Critics (Nordhaus, Solow)**: Targeted both methodology and ethics. Nordhaus accused LtG of **"pessimistic empirics"** and **anti-growth bias**, but his deeper critique centered on intertemporal ethics.

  2. **Implicit Intertemporal Weights in WORLD3**:
     - **Zero Pure Time Preference**: LtG treated welfare across centuries as **equally weighted**. A famine in 2100 "counted" identically to one in 2000.
     - **Instrumental Discounting Only**: Physical constraints (e.g., fixed resource stocks) dominated. Technology and capital substitution were **under-modeled**, making future scarcity appear absolute—not subject to human ingenuity.
     - **Effect**: By ignoring *economic* discounting (e.g., investment returns), LtG implicitly assigned **full moral standing to distant generations**. Collapse scenarios emerged because the model refused to "discount" their suffering.

  ---

  ### **The Backlash: Empirical vs. Normative Strikes**
  - **Targeting Empirical Assumptions**:  
    Critics attacked **fixed resource limits** and **static technology assumptions**. Nordhaus argued that market signals and innovation would avert scarcity (e.g., rising prices spur efficiency/substitutes). This was framed as "bad forecasting."

  - **Targeting Normative Premises**:  
    Beneath empirics lay a clash over **intergenerational ethics**. Nordhaus insisted discounting future welfare was rational and ethical:  
    - **Instrumental Argument**: Capital invested today yields compounded returns, enriching future generations.  
    - **Pure Time Preference Argument**: Future lives *inherently* matter less due to uncertainty and our preference for present well-being.  
    **LtG’s refusal to discount** was thus framed as **irrational altruism**—sacrificing present welfare for distant strangers.

  ---

  ### **The Inseparability of Time Preference**
  The controversy reveals **three truths about discounting in policy science**:
  1. **Smuggling Ethics via Empirics**:  
     WORLD3’s "empirical" constraints (e.g., non-renewable resources) embedded an ethical stance: *the future cannot be bought off with capital*. Critics countered by "smuggling" *their* ethics via **assumptions of infinite substitutability**—implying ecological harm is redeemable by future wealth.
     
  2. **Discount Rates as Ethical Proxies**:  
     Nordhaus’s recommended discount rate (~5-10%) reduced future catastrophe costs to negligible present-value terms. This wasn’t just math—it was a **denial of moral patienthood** to the distant future. Conversely, LtG’s near-zero discounting made future costs viscerally urgent.

  3. **The Impossibility of Neutrality**:  
     Whether modeling resource depletion or climate change, **choosing a discount rate (or omitting one) is unavoidably normative**. "Empirical" models always encode **whose suffering counts and by how much**.

  ---

  ### **Your Character’s Intuition: Validated by History**
  - **Narrative as Moral Reckoning**:  
    LtG’s collapse scenarios forced readers to **visualize concrete future suffering**—starving populations, collapsed industries—making abstract generations feel "real." This aligns with your character’s insight: discounting anonymizes the future; **narrative restores moral weight**.
    
  - **Philosophical Defensibility**:  
    The debate exposed a rift:  
    - **Utilitarians (Nordhaus)**: Defended discounting as pragmatism.  
    - **Deontologists/Sustainability Ethicists**: Saw equal weighting as non-negotiable justice.  
    LtG’s enduring influence (e.g., in climate ethics) proves this stance is **philosophically robust**, grounding movements like "intergenerational equity."

  - **Contradiction or Support?**:  
    **Strong support**. Critics didn’t disprove WORLD3’s ethics—they reframed it as "alarmism" because its moral premise (equal weighting) made modest discount rates appear monstrous. Your character’s epiphany mirrors LtG’s legacy: **discount rates are cages for moral imagination**, and narrative shatters them.

  ---

  ### **Conclusion**
  The LtG controversy crystallizes your character’s realization: **discount rates are ethical judgments disguised as arithmetic**. WORLD3’s "neutral" modeling exposed this by refusing to diminish the future—triggering backlash precisely because it forced contemporaries to confront the moral personhood of descendants. Your novel’s premise—that future generations must be *characters*, not variables—finds direct validation in how LtG’s scenarios compelled ethical engagement far beyond what discounted cost-benefit analyses ever could. Policy science cannot quarantine ethics from modeling; it can only hide it. Narrative is the antidote.
