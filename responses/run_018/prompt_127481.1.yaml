prompt: |-
  So I've been teaching this unit on practical rationality and my students keep bringing up these mugging-style cases, and I realized I don't actually have a consistent line on them. Here are my gut verdicts, tell me if there's a principle that saves them all or if I'm just being a hypocrite.

  Case one: some rando on the subway claims he can destroy 3^^^3 people in Andromeda unless I hand over $5, and I genuinely think there's a 1-in-10^20 shot he's not bluffing about his causal powers. Verdict: I'm not paying, and it feels like correct rationality, not just cheapness. Case two: same guy, but he has a device that will definately blow up Earth with 99.999% reliability, and for $5 he'll disable it. Verdict: I pay, no question. Case three: climate scientists say reducing my footprint has maybe a 0.1% chance of preventing a cascade that kills billions; I treat this as a real but modest reason, not a life-ruining obligation. Case four: I'm offered a coin-flip bet where heads wins me $100, but there's allegedly a 10^-40 chance that tails triggers a hidden mechanism torturing a million people. I take the bet and feel good about it, which seems to conflict with case one unless I'm missing something about the structure. Case five: I'm advising on an AI safety budget and there's a proposed safeguard against a failure mode I assign 1-in-10^12 credence, existential if it hits. Spending 1% of compute feels prudent, spending 10% feels like paranoia, but I can't articulate where the line comes from.

  And the one I keep going back and forth on: should I buy lottery tickets that fund x-risk research? The ticket is near-certain waste, but the funding creates a miniscule chance of saving everything. Is there one account of how credence, stakes, and institutional context interact that gets cases one through five, and what does it predict for the lottery thing? Or do I have to drop one of my verdicts?
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're teaching practical rationality and struggling with mugging-style cases. Their gut reactions vary across scenarios, and they want consistency. First, I need to understand each case they presented and identify the conflicting intuitions.

  Case one: Low probability (1/10^20) of massive harm (3^^^3 lives). They refuse to pay $5. Feels rational. Case two: High probability (99.999%) of Earth's destruction. Pays without question. Case three: Small chance (0.1%) of preventing catastrophe. Views it as a modest reason, not life-altering. Case four: Extremely low chance (10^-40) of harm from a coin flip. Comfortable taking the bet. Case five: AI safeguard with 1/10^12 risk. 1% spend is prudent, 10% paranoid. And the lottery ticket funding x-risk research is a dilemma.

  The user's core issue seems to be reconciling probability thresholds with action. Why pay in case two but not one? Both involve existential risks but vastly different probabilities. Case four is tricky—taking the bet conflicts with refusing in case one, despite similar stakes. Maybe probability isn't the only factor. Institutional context might matter, like in case three and five. Climate action and AI budgets involve collective efforts, whereas mugger or coin flip are individual decisions. 

  Also, the lottery question ties into funding mechanisms. The user might be hinting at effective altruism considerations. They need a framework that accounts for probability, stakes, and context. Expected utility theory alone fails here because of Pascalian problems. Maybe integrating decision theory with bounded rationality or leveraging concepts like leverage or institutional roles could help. 

  The user's deeper need might be pedagogical. They need a consistent principle to teach students, avoiding hypocrisy. They might also be wrestling with real-world applications, like x-risk funding. Their back-and-forth on the lottery suggests uncertainty about indirect impacts. 

  Possible solutions: Normalized utility thresholds? Leverage (individual vs. systemic impact)? Epistemic considerations (credence in probability estimates)? For the lottery, the answer depends on whether the funding mechanism is efficient. If the lottery funds research effectively, even with low individual leverage, it might be worth it. But if it's inefficient, like high overhead, then not. 

  Need to check if any existing theories address this. Bostrom's vulnerable world hypothesis? Leverage-based decision theory? Also, ensure the solution doesn't discard their intuitions but explains them. For example, case four's coin flip might be acceptable because the mechanism is implausible, while the subway mugger's claim is also implausible but the stakes are higher, yet refusal is due to leverage or normalization. 

  Finally, the lottery ticket: If it's the best funding method available, and the user has no better alternative, buying tickets could be rational. But if there are more efficient ways to donate, those are preferable. The principle should emphasize optimizing for maximum impact within reasonable bounds.
answer: |-
  Based on your cases and intuitions (which I largely share!), a single rigid principle like "maximize expected utility" fails spectacularly. Instead, you need a **multi-factor framework** incorporating **bounded rationality, leverage, and epistemic responsibility**. Here's how to reconcile your verdicts:

  **The Core Principles:**

  1.  **Normalized Stakes & Bounded Scrutiny:** We don't treat every *conceivable* tiny probability with infinite seriousness. We implicitly normalize stakes against **plausible maximum impacts within our epistemic horizon**. 3^^^3 lives (Case 1) or 10^-40 torture mechanisms (Case 4) exceed this horizon, making the probabilities effectively *meaningless for individual action* – they trigger disbelief or dismissal, not calculation. Earth destruction (Case 2) and billions of lives (Case 3) are within this horizon.

  2.  **Leverage Matters:** What is the **causal pathway** and your **unique ability to influence it**?
      *   Case 1 (Subway Mugger): Your $5 has near-zero leverage over Andromeda events. Paying encourages scams, wastes resources better spent on plausible threats.
      *   Case 3 (Climate Footprint): Your individual action has microscopic leverage on a global cascade. It's a *signal* of commitment and supports norms, but isn't the primary causal driver. Systemic change has higher leverage.
      *   Case 5 (AI Safeguard): Your role (advisor) gives you *institutional leverage*. Spending 1% of compute on a 1e-12 risk is prudent hedging against a known failure mode class. Spending 10% diverts resources from higher-likelihood risks, reducing overall safety (paranoia).
      *   Lottery/X-risk (Case 6): Your $5 has minimal *direct* leverage on x-risk. The key is the **funding mechanism's efficiency and alternative uses of your $5**. Is this lottery the *best* way to fund impactful research?

  3.  **Epistemic Responsibility:** How seriously should we take the *claimed* probability?
      *   Case 1 & 4: The probabilities/stakes are **incoherent or lack any credible causal model**. We intuitively assign them *near-zero effective credence* despite the nominal number. The mugger is almost certainly lying/bluffing; the hidden torture mechanism is absurd.
      *   Case 2: The causal model (device, reliability) is much more credible given the stated stakes. The probability deserves serious weight.
      *   Case 3 & 5: Probabilities are based on complex models with acknowledged uncertainty, but come from credible sources studying known phenomena. They deserve *proportional* weight relative to other risks and costs.

  4.  **Pragmatic Thresholds & Diminishing Marginal Utility:** We act proportionally to **actionable risk**, not just mathematical expectation. We set thresholds below which tiny probabilities are ignored for practical decision-making ("dust speck defense" rejection). Spending life-ruining resources on microscopic chances is irrational *because* it prevents addressing higher-probability harms.

  **Applying the Framework to Your Cases:**

  *   **Case 1 (No Pay):** Normalized stakes exceed horizon. Zero leverage. Epistemically incoherent. *Correct: Don't pay.*
  *   **Case 2 (Pay):** Stakes within horizon (Earth). High leverage ($5 directly prevents near-certain doom). Epistemically credible threat. *Correct: Pay immediately.*
  *   **Case 3 (Modest Action):** Stakes within horizon (billions). *Very low individual leverage*. Epistemically plausible but uncertain. Action proportional to leverage (modest footprint reduction) is rational; life-ruining obligation isn't. *Correct.*
  *   **Case 4 (Take Bet):** Stakes (torture mechanism) are epistemically incoherent. Effective credence is near-zero. *Correct to take the bet. Doesn't conflict with Case 1 because Case 1's probability/stakes are also incoherent, but Case 1 involves extortion/direct appeal, making the irrationality more salient.*
  *   **Case 5 (1% Prudent, 10% Paranoid):** Stakes within horizon (x-risk). High institutional leverage. Epistemically uncertain but plausible model (AI failure mode). Spending reflects proportional hedging (1%). 10% violates Pragmatic Thresholds – it diverts too many resources from higher-likelihood risks, reducing overall expected safety. *Correct intuition. The "line" is where mitigation cost significantly impairs addressing more probable existential/near-existential risks.*
  *   **Case 6 (Lottery for X-risk):** This depends CRITICALLY on the **funding efficiency and alternatives**:
      *   **If the lottery is highly efficient:** (e.g., >50% of ticket price funds *highly effective* x-risk research with no better funding channel), then buying a ticket *could* be rational. Your $5 has very low *direct* leverage, but contributes efficiently to a pooled effort with potential for high systemic leverage. It's similar to a modest climate action – supporting a plausible (if tiny probability) pathway.
      *   **If the lottery is inefficient:** (High overhead, funds mediocre research, or better donation avenues exist), then it's likely irrational. The "near-certain waste" dominates, and your $5 has better uses (even for other x-risk charities or personal risk mitigation).
      *   **Epistemic Check:** Is the research funded *actually* impactful against credible x-risks? Or is it fringe science? Credibility matters.
      *   **Your Verdict Likely:** Unless this lottery is uniquely efficient and well-targeted, **don't buy the ticket**. Your $5 almost certainly has better uses for reducing x-risk (e.g., donating to top EA funds) or improving your own resilience/impact. The "mugging" aspect (tiny chance via inefficient mechanism) makes it resemble Case 1. *Leaning towards "Don't Buy".*

  **Conclusion: You're Not a Hypocrite!** Your intuitions reflect a sophisticated, pragmatic rationality that:
  1.  Dismisses incoherent extremes (Cases 1 & 4).
  2.  Acts decisively on credible, high-leverage, catastrophic threats (Case 2).
  3.  Takes proportional action based on leverage and plausible risk models (Cases 3 & 5).
  4.  Avoids ruinous costs for microscopic chances.

  **For the Lottery (Case 6):** Don't buy the ticket *unless* you have strong evidence it's the most efficient way your $5 can contribute to *credible, high-leverage* x-risk mitigation. Otherwise, direct donation to effective organizations is vastly superior. Your framework explains why the lottery feels like a mugging – it leverages astronomical stakes against your rationality, but fails the leverage and epistemic coherence tests.
