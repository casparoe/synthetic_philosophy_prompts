answer: |-
  You've hit on a crucial timing issue, but let me clarify: Global Workspace Theory doesn't claim *every* neural process requires broadcasting to be conscious. It claims that *phenomenally conscious states* occur *when and because* information achieves widespread availability. Those early binding windows? They're local pre-processors—proto-representations—building feature-specific fragments. Crucially, they lack integration into a *unified scene* with subjective quality until later ignition. 

  The "subjective unity" you mention for brief stimuli? I argue it's retrospectively constructed. The brain doesn't experience disjointed color/motion at 60ms; it rapidly coheres those fragments *via broadcasting* at 200-300ms, generating both reportable access *and* phenomenality simultaneously. The seeming immediacy is illusory—a product of how our cognitive machinery reconstructs temporal order. Without eventual global availability, those early spikes remain causally isolated "islands" with no phenomenal character. 

  Timing differences reflect processing stages, not ontological splits. The *phenomenal* aspect emerges precisely when information transitions from modular encapsulation to system-wide influence in analog form.
