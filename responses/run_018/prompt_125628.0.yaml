answer: |-
  **Supervaluationism offers the more coherent account of legislative precisification as the selection of one sharpening among many equally admissible candidates, better capturing the normative discretion inherent in lawmaking than epistemicism's implausible commitment to hidden metaphysical boundaries.**

  Legislative precisification replaces vague normative standards (e.g., "reasonable speed," "undue hardship") with sharp quantitative boundaries (e.g., 65 mph, costs exceeding 7% of revenue). Epistemicism interprets this act as discovering a pre-existing but epistemically inaccessible sharp boundary inherent in the vague concept. Lawmakers, on this view, are uncovering a hidden metaphysical fact about where "excessive force" *truly* begins, analogous to scientific discovery. Supervaluationism, conversely, interprets precisification as selecting one precise boundary from a range of equally legitimate, extensionally different precisifications (e.g., "excessive force" could validly be precisified as pressure exceeding 25, 30, or 35 pounds). The act *creates* a new, legally binding meaning by stipulation, rather than revealing the concept's single, always-present extension.

  Epistemicism faces a devastating objection: it implausibly portrays legislative choice as metaphysical discovery. Lawmakers setting a speed limit for "reasonable" are not empirically investigating a hidden fact of the matter; they are exercising normative judgment based on policy goals, safety data, and practical compromise. The concept "reasonable" inherently lacks a single, context-independent sharp boundary waiting to be found. Treating precisification as discovery mischaracterizes the nature of legislative deliberation, which involves value choices, not uncovering pre-existing ontological truths. This renders epistemicism descriptively inadequate for legal practice.

  Supervaluationism's core strength is its elegant fit with this normative discretion. It readily explains why lawmakers debate different cutoffs – they are choosing between admissible sharpenings. However, it confronts the "bindingness problem": if all precisifications were equally legitimate before selection, why does one become uniquely authoritative and legally binding upon enactment? Doesn't this render the choice arbitrary and undermine the law's claim to be clarifying an *existing* standard?

  While significant, this objection is less fatal than epistemicism's. Supervaluationism can explain bindingness through the *institutional authority* of the legislature. The law doesn't merely select *any* precisification; it invests the chosen one with legal force through recognized rule-making procedures. Prior to enactment, multiple boundaries are admissible. Upon enactment, the legislature's authoritative act makes one specific precisification the *legally operative* definition, excluding others within the formerly admissible range for legal purposes. This alters the concept's *legal extension* while respecting that the underlying vague concept *itself* lacked a unique boundary. The apparent arbitrariness reflects the necessary exercise of discretion in applying inherently vague norms, not a flaw in the theory.

  Consequently, supervaluationism provides the superior framework. It accurately describes precisification as a normative, creative act of selection driven by practical and evaluative considerations, avoiding epistemicism's implausible metaphysical baggage. Its challenge concerning bindingness is resolvable by appealing to the constitutive power of legal institutions, aligning with how legal systems actually function when resolving vagueness through authoritative stipulation.
