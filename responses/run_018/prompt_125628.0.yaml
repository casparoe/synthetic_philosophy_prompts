prompt: |-
  Write an essay comparing epistemicism and supervaluationism as accounts of vagueness, focusing specifically on legislative precisification: the practice by which lawmakers or institutions replace a vague normative standard (e.g., "excessive force" or "undue hardship") with a sharp quantitative cutoff (e.g., "pressure exceeding thirty pounds" or "costs above seven percent of revenue"). Address whether such an act is best understood as uncovering a hidden sharp boundary that was always present but epistemically inaccessible (the epistemicist interpretation), or as arbitrarily selecting one admissible precisification among many equally legitimate ones and thereby altering rather than clarifying the concept's extension (the supervaluationist interpretation). Weigh the strongest objections to each—including the worry that epistemicism implausibly treats legislative choice as metaphysical discovery, and the worry that supervaluationism struggles to explain why one precisification becomes legally binding—reach a definite conclusion about which view offers the more coherent account, and justify it. State your bottom-line verdict in the first sentence. Keep the response to a maximum of 600 words.
