  Counterfactual dependence struggles because it doesn't account for the structural dependencies. It might say that the decision depends on the evidence, but since the evidence is unobservable, it's tricky. Also, overdetermination cases are problematic for counterfactual accounts. 

  The conceptual cost for counterfactual dependence is either denying that any committee is a cause (epiphenomenalism) or accepting causal preemption, which is messy. For interventionism, the cost is adding latent variables, which complicates the model. But that's a reasonable trade-off. 

