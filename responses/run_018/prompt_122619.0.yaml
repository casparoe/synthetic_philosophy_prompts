answer: |-
  ### Overall Mark: 14/20 (70%, Lower 2:1)  
  **General Strengths:** The answer demonstrates a solid grasp of expressivism’s core tenets and the Frege-Geach problem’s structure. It accurately summarizes Gibbard’s solution and correctly identifies key elements like non-asserted contexts and the challenge to validity.  
  **Key Weaknesses:** Significant conflation of distinct objections in (b), oversimplification of Gibbard’s solution in (c), and omissions of required technical details (compositionality, deep embedding).  

  ---

  ### Marginal Comments Keyed to Rubric  
  *(Comments are keyed to specific lines/ideas; deductions are cumulative)*  

  #### **(a) Why problem arises from unasserted positions**  
  ✅ **Gets right:**  
  - Correctly notes that in unasserted positions (e.g., antecedent of conditional), no attitude is expressed, creating tension with expressivism’s attitude-based meaning.  
  - Clearly states that this threatens the validity of arguments like modus ponens due to potential equivocation.  
  ❌ **Omits/Underdeveloped (Deduct 1.5 marks):**  
  - Fails to explicitly explain **compositionality**: The problem isn’t just that *no attitude is expressed* in antecedents, but that expressivism must explain how the *meaning* of a complex sentence (e.g., a conditional) is built from the meanings of its parts. If "stealing is wrong" has no stable semantic content in the antecedent, the conditional’s meaning cannot be compositionally derived.  
  - Does not mention that moral sentences in unasserted contexts retain their *logical properties* (e.g., "stealing is wrong" in "if stealing is wrong..." must contribute to truth-conditions/validity identically to its asserted occurrence).  

  #### **(b) Distinguish from moral disagreement objection**  
  ✅ **Gets right:**  
  - Correctly describes the disagreement objection (i.e., if moral sentences only report attitudes, disagreement collapses into "different attitudes, no conflict").  
  ❌ **Misattributes/Conflates (Deduct 2 marks):**  
  - **Major error**: Claims both problems "show that expressivism cannot give moral sentences a stable content independent of the speaker’s psychological state". This conflates Frege-Geach with the disagreement objection.  
    - **Frege-Geach** is about *logical structure*: How can unasserted moral sentences function identically in inferences if their meaning is attitude-expression?  
    - **Disagreement** is about *conflict in attitudes*: How can two speakers genuinely disagree if their utterances only report their own states?  
  - Overstates that both lead to "subjectivism": While some subjectivist views face both problems, Frege-Geach targets *logic*, not subjectivism per se. Expressivists reject subjectivism but still face Frege-Geach.  

  #### **(c) Expressivist solution & requirements**  
  ✅ **Gets right:**  
  - Accurately outlines Gibbard’s core idea: Moral sentences express "acceptance of norms"; complex sentences express higher-order attitudes.  
  - Correctly explains negation ("disapproval of disapproval") and the conditional’s attitude structure.  
  - Notes that validity requires psychological consistency of attitudes for the sample argument.  
  ❌ **Misrepresents/Oversimplifies (Deduct 2.5 marks):**  
  - **Validity misattribution**: Claims Gibbard reduces validity to "psychological impossibility of combining attitudes". This is **psychologism**, which Gibbard explicitly *rejects* (he uses *hyperplans* to ground logic objectively).  
  - **Negation incompleteness**: Omits that "disapproval of disapproval" must be *systematically generated* for *any* embedding depth (not just a one-off fix).  
  - **Fails rubric requirement**: Does not address how the solution handles "arbitrarily deeply embedded occurrences" (e.g., "If it’s not true that if stealing is wrong, then..."). Gibbard’s *norm-acceptance states* are recursively defined, but the answer doesn’t mention this.  
  - **Oversimplifies Gibbard**: Reduces his solution to "attitudes directed at combinations of attitudes" without noting the formal machinery (e.g., world-norm pairs, compositional semantics for attitudes).  

  ---

  ### Additional Marginal Notes (No Deduction, but Notable)  
  - **Opening definition**: "Meaning given by attitude rather than truth conditions" is a clean expressivist summary.  
  - **Psychologism warning**: The claim that expressivism entails "psychologistic account of logic" is a common *criticism* of early solutions (e.g., Ayer), but Gibbard avoids this. Highlighting this error helps the student see the gap.  
  - **"Subjectivism" charge**: Expressivists vigorously deny being subjectivists; the answer’s phrasing ("collapse into subjectivism") risks misunderstanding.  
  - **Omission in (c)**: No mention of what the solution "must deliver" for negation beyond the example (i.e., recursive rules for embedding).  

  ### Final Tally  
  - (a): **3.5/5** (Deducted 1.5 for missing compositionality)  
  - (b): **1/5** (Deducted 4: 2 for conflation + 2 for subjectivism overstatement)  
  - (c): **4.5/10** (Deducted 5.5: 2.5 for psychologism/embedding omission, 3 for oversimplification of Gibbard)  
  - **Total**: 14/20  

  **Diagnosis**: A strong grasp of surface-level ideas but lacks precision in distinguishing objections and technical depth in solutions. Focus feedback on (b)’s conflation and (c)’s requirement for systematicity.
