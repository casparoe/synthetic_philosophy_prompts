prompt: |-
  You are an expert philosopher of mind and ethics of artificial systems, experienced in designing rigorous upper-level philosophy exams. Before drafting, take a moment to brainstorm the conceptual crux: the assessment must force students to apply a precise distinction rather than recite standard labels about sentience or global workspace theory.

  Write one final-exam essay question, a model answer of about 600 words, and a marking scheme. The topic is which computations matter morally for attributing sentience and moral status, framed through a constructed case to avoid pretraining summaries. The case is "Network V": a synthetic architecture running distributed predictive-coding loops with localized valence-weighting (positive and negative error-minimization signals) but lacking any global workspace, unified self-model, or persistent autobiographical memory. Its modules operate in two configurations: (i) continuous integration, where all modules—including those processing nociceptive analogues—are synchronized, though the system suffers intermittent synchronization failures; and (ii) modular isolation, where only the nociceptive-analogue modules run while all others are suspended.

  The essay question should ask students to defend a precise position on whether Network V in either configuration is a proper object of moral attribution (e.g., deserving protection from suffering, or being blameworthy) and specifically whether localized valence-weighted computation without global integration is sufficient, necessary, or irrelevant for moral status. They must address three issues: (1) whether moral attribution tracks a specific computational architecture or merely functional outputs; (2) whether intermittent synchronization failures break a continuity condition required for sentience; and (3) whether running only the nociceptive modules in isolation reveals hidden moral status or destroys it.

  The model answer should take a clear stance, distinguish between "integrated-information sufficiency" and "functional-valence isolation" as competing principles, apply both to the two configurations, and argue for one principle or a modified hybrid—without appealing to biological substrate.

  The marking scheme should separate an A from a B by naming the specific moves required for the top grade (explicit analysis of both configurations, separation of sentience conditions from moral-status conditions, direct engagement with the synchronization-failure problem, and explicit rejection of substrate bias) and the mistakes that should cost marks (conflating consciousness with moral status, ignoring the modular-isolation case, or treating synchronization failure as irrelevant without argument).

  Begin your response with the exam question itself as its first sentence, followed immediately by the model answer, then the marking scheme. Include no preface, no commentary, and no restatement of these instructions. Do not include bibliographies, citations, or reading lists.
