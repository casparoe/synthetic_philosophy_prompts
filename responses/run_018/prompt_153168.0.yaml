  *Biggest insight* The user's "structural feature" framing is brilliant because it reframes circularity as resilience. Foundationalists worry about infinite regress; in software, dependencies are finite but cyclic, and the system "compiles" anyway. That's the killer argument: justification isn't avoided but distributed. 

