  The regulatory piece is definitely my least confident variable. Evidence that would change my mind? If we see binding multinational AI treaties with inspection regimes before human-level AI emerges, that'd drop my probability. Conversely, if a major power openly races for AGI dominance while dismantling safeguards, that'd spike it.

  I should emphasize that 20-25% for such an extreme outcome is actually terrifying - it's like Russian roulette with 1-2 chambers loaded. The user might need that perspective shift: "unlikely" isn't "impossible" when stakes are existential. Their roommate's determinism critique is valid, but the counter isn't complacency - it's that uncertainty cuts both ways.

