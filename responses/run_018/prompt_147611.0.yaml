  Starting with recursive self-improvement (RSI): I'd put this at maybe 60% conditional on human-level AI. We've seen some proto-RSI in current systems (like LLMs improving code that trains better LLMs), but full recursive loops hitting diminishing returns seems plausible too. The architecture matters - monolithic models vs modular systems could change this calculus.

  Economic incentives are tricky. The pressure for fully autonomous agents in markets like defense, finance, or R&D is massive. But human oversight persists in high-stakes areas decades after automation potential exists (see: commercial aviation). Still, I'd lean 70% toward autonomy winning because competitive pressures are insane.

