  **Course Catalog Entry**  
  **Department of Paradox Management & Strategic Precommitment Studies**  
  **PMSC 785: Applied Counterfactual Blackmail: From XOR to Mugging**  
  *(3 credits. Graduate standing required. Limited to students with paradox-handling waivers on file.)*  

  **Description:**  
  This seminar examines advanced decision-theoretic pathologies arising in adversarial coordination problems, with emphasis on XOR blackmail, counterfactual mugging, and their industrial applications. Students will develop practical frameworks for negotiating self-referential extortion, including evidential-causal decoupling strategies, acausal bargaining protocols, and liability-minimizing payment schemas. Combines theoretical rigor with case studies from computationally tractable threat ecosystems.  

  **Prerequisites:**  
  PMSC 555 (Causal Cartography) or equivalent; PMSC 602 (Newcomblike Neuroses); or instructor consent. Students must submit a notarized affidavit confirming they "would not, under any plausible circumstances" engage in the hypothetical acts discussed. Auditors require background checks.  

  **Learning Objectives:**  
  Upon completion, students will:  
  1. Diagnose XOR blackmail’s violation of causal dominance principles.  
  2. Implement payment algorithms satisfying mugger-side counterfactual conditionals.  
  3. Deploy precommitment devices to exploit asymmetrical ignorance.  
  4. Draft legally ambiguous counter-threats using reflexive probability distributions.  
  5. Justify Pareto-suboptimal actions under evidential conditioning.  

  **Required Texts:**  
  - Coin, C. (2025). *Extortionary Epistemology: Why Knowing Less Pays More*. MIT Paradox Press.  
  - Uzhov, A. (2024). *Counterfactual Debt Instruments: Securitizing Unrealized Threats*. Springer Series in Imaginary Finance.  
  - Course Reader: *Selected Blackmail Patents (2031–2035)*.  

  **Administrative Note:**  
  *"While hypothetical extortion techniques remain purely theoretical, the University disclaims liability for any emergent real-world agentic threats resulting from coursework. Students experiencing ontological blackmail symptoms should contact Campus Precrime Counseling."*  
  — G. Burelli, VP of Applied Conundrums  

  ---

  **Syllabus: PMSC 785**  

  **Week 1: Foundations of Unhappy Choices**  
  - Rationality’s failure modes: From Pascal’s Wager to blackmail’s evidential fork  
  - Why "I wouldn’t do it anyway" is not a defense (and why muggers know this)  
  - *Reading:* Coin, Ch. 1: "The Evidential Black Hole: When CDT Pays the Piper"  

  **Week 2: XOR Blackmail: Breaking Causal Intuition**  
  - Structure analysis: Threat activation iff victim *wouldn’t* commit act X  
  - Evidential vs. causal dominance in payment justification  
  - Case study: The Locus Pocus Hack (2028) — when refusing proof-of-nonaction triggered bankruptcy  
  - *Exercise:* Compute optimal bribes under imperfect information leakage  

  **Week 3: Counterfactual Mugging & Temporal Bargaining**  
  - Omega’s coin flip: Paying for unrealized potentials  
  - Why your past self’s ignorance subsidizes muggers  
  - Precommitment equilibria: Binding your future stupid self  
  - *Reading:* Uzhov, Ch. 4: "Time-Discounted Regret Arbitrage"  

  **Week 4: Acausal Trade & Retroactive Blackmail**  
  - Paying muggers who condition on your algorithm’s source code  
  - Consequence-blind agents in superrational networks  
  - *Guest Lecture:* Dr. E. Vasive (Unseen University) on "Taxonomizing Threat Topologies"  

  **Week 5: Liability-Averse Extortion Design**  
  - Crafting legally deniable counterfactuals ("I might have hinted your dog *could* achieve quantum superposition...")  
  - Jurisdictional challenges in multiverse blackmail enforcement  
  - *Case Study:* *Nefaria v. Counterfactual Collections LLC* — when paying altered the timeline  

  **Week 6: Defense Tactics & Ethical Quagmires**  
  - Self-sabotage as preemptive defense: Corrupting your own decision hardware  
  - Moral licensing in repeated mugging scenarios  
  - *Debate:* "Is paying a counterfactual mugger a victimless crime if no crime occurred?"  

  **Week 7: Final Project Workshop**  
  - Design a blackmail-resistant agent for a specified threat surface  
  - **OR**  
  - Propose a novel extortion market leveraging anthropic uncertainty  

  **Assessment:**  
  - 40%: Threat conditionals analysis (Problem set: "Why XOR breaks dominance in 5 real-world blackmail TOS")  
  - 30%: Simulated mugging negotiation (Role-play against adversarial TA)  
  - 30%: Final project ("Build a Better Mugger/Mark")  

  **Instructor:**  
  Prof. T. Omegason (Office hours: By appointment only, via encrypted counterfactual messaging)  

  **Disclaimer:**  
  "This course examines *optimal response strategies* to extortionary incentives, not their moral permissibility. Payment remains inadvisable in observed realities."  

  ---  
  **Satirical Targets Embedded:**  
  - **Evidential vs. causal reasoning:** Course forces contrast between "What does paying *signal*?" (EDT) vs. "What does paying *cause*?" (CDT).  
  - **XOR’s paradox:** Highlighted via "threat activation iff you *wouldn’t* do X," showing payment as uniquely rational under evidential conditioning.  
  - **Mugger’s knowledge:** Muggers condition on *your algorithm*, not outcomes (Week 3/4), making precommitment essential.  
  - **Bureaucratic dread:** Liability disclaimers mirror real-world institutional anxiety over theoretical harms.  
  - **"Academicization" gag:** Legitimizing blackmail through finance textbooks ("securitizing threats") and patents.
