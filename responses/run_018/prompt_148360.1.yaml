  The user's framing as "adversarial collaboration" is smart - it forces both sides to articulate what evidence could change their minds. This moves beyond the usual stalemate. I should ensure the document feels like a genuine negotiation: precise enough that neither feels misrepresented, but clear about irreducible differences.

