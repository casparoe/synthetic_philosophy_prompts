  Below is a decision-tree taxonomy designed to sort substantive commitments on Frankfurt-style cases. The tree starts with your concrete case and branches via five diagnostic questions. Internal variants and unoccupied positions are included per your specifications. The scoring key maps answer patterns to named positions, and ambiguous separations are flagged.

  ### **Decision Tree: Moral Responsibility in Frankfurt-Style Cases**

  **Initial Case**  
  *An agent decides freely to perform an action. An external controller stands ready to intervene if she shows signs of deciding otherwise, but the controller never acts. No other forces (e.g., determinism) are assumed unless specified.*

  ---

  #### **Q0: Is the agent morally responsible for her action?**
  - **Yes** → Proceed to Q(i)  
  - **No** → Proceed to Q(i)  

  #### **Q(i): Does the controller’s *mere presence* (without intervening) eliminate *every* alternative possibility for the agent?**  
  *(e.g., could the agent have done/decided anything else?)*  
  - **Yes** (no alternatives) → Skip Q(ii); go to Q(iii)  
  - **No** (some flicker remains, e.g., a thought that could trigger intervention) → Proceed to Q(ii)  

  #### **Q(ii): Even if a flicker of alternative possibility remains, is it *robust enough* to support the kind of freedom required for moral responsibility?**  
  *(e.g., is the flicker too trivial to count as “could have done otherwise” in a meaningful sense?)*  
  - **Yes** (flicker suffices for leeway) → Proceed to Q(iii)  
  - **No** (flicker is inadequate) → Proceed to Q(iii)  

  #### **Q(iii): Is moral responsibility primarily about *sourcehood* (the decision truly originates from the agent) rather than *leeway* (access to alternatives)?**  
  - **Yes** (sourcehood is key) → Proceed to Q(iv)  
  - **No** (leeway is key) → Skip Q(iv); go to Q(v)  

  #### **Q(iv): If sourcehood is sufficient for responsibility, does a *merely counterfactual* controller (who doesn’t act) compromise it?**  
  - **Yes** (sourcehood is weakened) →  
    - **Internal Variant (for Q(iv) only):** *Replace the external controller with an internal mechanism (e.g., a compulsive urge the agent endorses, which would override her choice if she hesitated). Does this internalization change whether sourcehood is compromised?*  
      - **Yes** → Go to Q(v)  
      - **No** → Go to Q(v)  
  - **No** (sourcehood remains intact) →  
    - **Internal Variant (for Q(iv) only):** *Same internal mechanism. Does internalization change whether sourcehood is compromised?*  
      - **Yes** → Go to Q(v)  
      - **No** → Go to Q(v)  

  #### **Q(v): Does distinguishing *regulative control* (power to choose alternatives) from *guidance control* (acting freely in the actual sequence) resolve the tension? If so, which does the agent retain?**  
  - **Yes, and retains regulative control** → Leaf  
  - **Yes, and retains guidance control** → Leaf  
  - **No, the distinction doesn’t resolve the tension** → Leaf  

  ---

  ### **Scoring Key: Mapping Answer Patterns to Positions**  
  *(Pattern: Q0 → Q(i) → Q(ii) → Q(iii) → Q(iv) → [Internal Variant if applicable] → Q(v))*

  1. **Standard Frankfurt-Inspired Compatibilist (PAP false for responsibility):**  
     - **Path:** Yes → Yes → *skip* → Yes → No → [Internal: No] → Yes (guidance control)  
     - *Commitments:* Responsibility requires sourcehood, not leeway. Counterfactual controllers (external or internal) don’t threaten sourcehood/guidance control.  

  2. **Flicker-of-Freedom Defense (weakened PAP preserved):**  
     - **Path:** Yes → No → Yes → No → *skip* → Yes (regulative control)  
     - *Commitments:* Responsibility requires robust leeway. The flicker (e.g., possibility of triggering intervention) provides sufficient alternatives.  

  3. **Sourcehood-Only View (leeway unnecessary):**  
     - **Path A:** Yes → Yes → *skip* → Yes → No → [Internal: No] → No  
     - **Path B:** Yes → No → No → Yes → No → [Internal: No] → *any Q(v)*  
     - *Commitments:* Sourcehood alone suffices. Counterfactual controllers (even internal) don’t undermine sourcehood.  

  4. **Hierarchical Identification View (levels of desire/will):**  
     - **Path:** Yes → *any* → *any* → Yes → *any* → [Internal: **Yes**] → *any Q(v)*  
     - *Commitments:* Sourcehood depends on higher-order endorsement of motives. Internal controllers *can* compromise sourcehood if unendorsed (but not in this case, as the agent endorses the urge).  

  5. **Hard Incompatibilist Rejection (case incoherent):**  
     - **Path:** No → No → No → Yes → No → [Internal: No] → No  
     - *Commitments:* The case assumes responsibility in the actual sequence, but responsibility is metaphysically impossible regardless of controllers.  

  6. **Unoccupied Branch (incoherent):**  
     - **Path:** Yes → Yes → *skip* → No → *skip* → *any Q(v)*  
     - *Diagnosis:* Incoherent because responsibility requires leeway (Q(iii)=No), but no alternatives exist (Q(i)=Yes), yet the agent is held responsible (Q0=Yes).  

  ---

  ### **Ambiguous Separations & Design Notes**  
  - **Hierarchical vs. Sourcehood-Only Views (Convergence on Branches iii–v):**  
    Both views answer identically for Q(iii) (sourcehood primary), Q(iv) (counterfactual controllers don’t compromise sourcehood), and Q(v) (distinction may/may not resolve tension). They **only separate if the internal variant changes the answer to Q(iv)**. If the internal variant *doesn’t* change the answer (e.g., both say internal controllers don’t threaten sourcehood), the tree **fails to separate them**. This ambiguity arises because hierarchical views focus on structural endorsement, which the internal variant tests, while sourcehood-only views may ignore hierarchy.  

  - **Internal Variant Impact:**  
    The internal variant *doesn’t collapse* the hierarchical and sourcehood-only views in the tree because they are separated by the internal variant question. However, if a student judges both external and internal controllers identically (e.g., "neither compromises sourcehood"), the views converge.  

  - **Hard Incompatibilist Path:**  
    The path requires denial of responsibility (Q0=No) *despite* no leeway or sourcehood issues, reflecting rejection of the case’s coherence.  

  ### **How to Use**  
  1. Start at **Q0**.  
  2. Answer each question intuitively.  
  3. Follow branches to a leaf.  
  4. Match the answer pattern to the **Scoring Key**.  
  5. Review **Ambiguous Separations** if your path converges with another position.  

  This tree isolates commitments without requiring prior literature knowledge. Internal variants and unoccupied branches test edge cases, while ambiguous separations highlight theoretical tensions.
