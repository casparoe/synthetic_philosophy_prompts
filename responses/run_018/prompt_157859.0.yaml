answer: |-
  Subject: Fellowship proposal – killing/letting die, but make it kinematic  

  Yo—  
  So, my novel’s wrestling with agency and guilt, and I keep slamming into this philosophical wall: why does "doing" harm feel heavier than "allowing" it? The usual answers—causation, intention, consequences—feel like they’re missing texture. My gut says it’s not about what’s in your *head*, but what’s in your *hands*. Literally. Does harm physically channel through your body? That’s the itch I want to scratch with this fellowship.  

  **The Nub:**  
  We treat killing (flipping the train track) and letting die (not flipping it) as morally distinct, even when outcomes are identical. But what if we strip everything back to pure bodily posture? I’ve got mirror-image cases where:  
  - Causation, foresight, outcome are identical.  
  - *Only* the agent’s bodily orientation changes relative to the harm.  

  Example:  
  - **Killing:** You’re *holding shut* a pasture gate. Sheep inside starve (you foresee this, could easily open it). Harm flows *through* your sustained muscle tension.  
  - **Letting Die:** You’re *not holding open* an identical gate (it’s spring-loaded to swing shut unless propped). Sheep starve identically. Identical foresight, effort, outcome—but harm flows *around* your motionless body.  

  **Why Usual Answers Fail:**  
  - *Consequentialists* dismiss the distinction as irrational—but that ignores why we *feel* the weight of "doing" more acutely.  
  - *Deontologists* say it’s about agency—but they treat the agent as a featureless cause, ignoring *how* the body interfaces with harm.  
  Both miss the meat: **Is the distinction just kinematics?** Does morality track whether harm is routed biomechanically?  

  **The Grind:**  
  I’ll build **4 paired cases** testing bodily symmetry (with deliberate typos: *symetrical* posture, *recieve* feedback). Like:  
  1. **Crush vs. Non-Interpose:** Actively pressing a button that lowers a weight vs. not removing your hand from a sensor that *would* stop the weight if moved.  
  2. **Poison vs. Withhold Antidote:** Injecting toxin vs. not handing over an antidote you’re physically clutching.  
  ...etc. Each pair mirrors posture, effort, and causal role—only the "flow path" of harm differs.  

  **Goal:**  
  - Map whether moral intuitions (mine + literature’s) track *bodily movement* over abstract control.  
  - Ask: If kinematics underpin the distinction, **can we rebuild ethics without referencing the body?** Or does it collapse into a storytelling quirk—a narrative bias for "hands-on" harm?  

  **Success Looks Like:**  
  - Confirming the body-centric hunch → distinction might be anthropologically shallow, not metaphysically deep. (Huge for fiction: guilt as somatic, not cognitive.)  
  - Or finding kinematics *don’t* drive intuitions → something even spookier is at play.  

  **Failure:** If all mirror pairs feel morally identical, the project sinks. But hey—negative results are philosophy too.  

  **Scope:** Pure thought-work. Six months = case-building, drafting a lit section (I’ll add citations later), and writing reflexive notes for the novel. No lab, no surveys—just me, a notebook, and the ghosts of moral dilemmas.  

  Bottom line: This might expose the killing/allowing distinction as a bio-mechanical illusion. Or it might not. Either way, it’s the wrinkle novels need.  

  \answer{The doing/allowing distinction is scaffolded by bodily kinematics—not intention or causality—and collapses in mirror-image cases where only the physical path of harm differs.}  

