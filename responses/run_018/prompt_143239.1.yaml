  I'm a software engineer with no formal philosophy background, and I'm preparing a pitch for an interdisciplinary seminar on philosophy of history. My half-formed idea is that historians oscillate between treating germs, climate shifts, and volcanic eruptions as mere background conditions and as full-blown "historical actors," but neither framing captures the kind of causal dependency I use in distributed-systems reliability engineering—where a node failure cascades through a network without anyone attributing intention to the node. Write an approximately 800-word workshop proposal that asks whether a counterfactual-dependency model—borrowed from reliability engineering—can clarify what it means to call a non-human force an "actor" without falling into environmental determinism. State the precise question, explain why existing debates in environmental history and philosophy of agency leave it open, outline a method that applies the model to either the 1815 Tambora eruption or the 1918 influenza pandemic (choose one, but do not invent specific archival sources), specify what a successful conceptual clarification would look like, state clearly what would count as failure, and give an honest feasibility assessment for a single 20-minute presentation. Do not include citations, a bibliography, or a reading list; frame the argument from general positions only. After the proposal, provide a brief structured summary in JSON with exactly these fields: "core_question", "niche_angle", "chosen_case", "method", "success_criteria", "failure_criteria", "feasibility_note".
