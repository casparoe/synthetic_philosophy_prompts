prompt: |-
  my friend lena has become the unofficial promise referee of our friend group and shes oddly consistent about it, so ive started keeping a list. her rulings so far:

  - sam promised to drive his roommate to the airport at 5am, then bailed the night before because he got a better invite. the roommates boyfriend drove her instead and sam genuinely wasnt missed. lena said he still broke a promise and owes her an apology.
  - priya promised to dogsit for a friend, tried to back out because a cheap flight came up, and the friend found another sitter within an hour and says it's fine. lena said it isnt fine—the promise itself was the thing, not the inconvenience.
  - someone promised to pay back a loan even though the lender is rich and wouldnt notice the money either way. lena said obviously he has to pay it back.
  - someone made a promise while blackout drunk and had no memory of it the next morning. lena said there is no promise there to keep.
  - a coworker got a promise out of someone by threatening to tell his boss he'd faked a sick day. lena said that ones void, no dispute.

  new case: a man promises a friend on her deathbed that he'll scatter her ashes at a particular lake upstate. she dies the next day. nobody else knows about the promise, no living person expects this of him, and her family wants a church funeral instead. would lena say he's bound to go scatter the ashes?

  what i actually want is the rule she seems to be running: is she a promises-bind-because-the-promisee-expects-them person, a promises-bind-because-you-voluntarily-committed person, a promises-bind-because-promising-is-a-social-practice person, or something else? which of her earlier rulings is the closest analog to the deathbed case, and what would each competing rule say about it? if her track record genuinely underdetermines it, say which principle she'd be committing to with each answer, and what further case would cleanly settle which one shes actually running.
reasoning: |-
  Okay, the user presents this fascinating case study about their friend Lena who acts as a "promise referee" in their friend group. They've documented several rulings and now want to analyze the underlying principle Lena uses to judge promises. The deathbed promise case is particularly interesting - a man promises to scatter ashes at a specific lake, but the deceased's family wants a church funeral instead, and no one else knows about the promise.

  Looking at Lena's previous rulings, patterns emerge. In the first three cases (Sam bailing on airport ride, Priya backing out of dogsitting, the loan repayment), Lena emphasizes that the promise itself matters regardless of convenience or whether the promisee was inconvenienced. This suggests she views promises as binding commitments based on the act of promising itself.

  But then there are exceptions. The blackout drunk promise was voided because consent was compromised, and the coerced promise was invalid due to lack of voluntariness. These exceptions point to two necessary conditions: clear intent and absence of coercion.

  For the deathbed case, the key question is whether the promise binds even without external accountability. Lena would likely rule it binding because: 1) the promisor had clear intent, 2) it was voluntary, and 3) the promise itself holds intrinsic weight regardless of whether anyone will enforce it. The loan repayment case seems the closest analog - the obligation exists independently of others' awareness or expectations.

  The underlying principle appears to be deontological: promises bind because the act of promising creates a moral duty, not because of consequences or social expectations. Lena isn't being inconsistent; she's distinguishing between valid promises (which bind) and non-promises (which don't, like the drunk/coerced cases).

  To confirm this, I should consider what a "social practice" theorist would say - they might argue the deathbed promise doesn't bind since no one expects it. But that contradicts Lena's pattern. The voluntarist view (binding because you committed) aligns better. A test case could be a promise made to someone who immediately dies - if Lena still says it binds, that confirms the commitment-based view over social expectations.
answer: |-
  Based on Lena's pattern of rulings, she operates on a **voluntarist-commitment principle with conditions of validity**. Here's the breakdown:

  1.  **Core Principle:** Promises create binding moral obligations primarily **because you voluntarily committed your word**, thereby creating a duty to follow through. The act of promising itself is the source of the obligation.
  2.  **Validity Conditions:** For a promise to be binding, it requires:
      *   **Intentionality:** The promisor must have the capacity and intention to promise (e.g., the blackout drunk case is void due to lack of intent/capacity).
      *   **Voluntariness:** The promise must be made freely, without coercion (e.g., the threat case is void).
  3.  **The "Thing" is the Commitment, Not the Consequences:** Lena consistently ignores outcomes ("wasn't missed," "found another sitter," "rich lender wouldn't notice") and focuses solely on the broken commitment. The *act* of breaking your word is the wrong, regardless of whether it caused practical harm or inconvenience (Sam, Priya, Loan cases).
  4.  **Promisee's Expectation Matters Only as a Consequence of the Commitment:** While the promisee's expectation *arises* from the promise, Lena doesn't base the *binding nature* of the promise *on* the existence of that expectation (as shown by the Loan case where the lender's expectation/need is irrelevant).

  **Applying this to the Deathbed Case:**

  *   **Lena's Ruling:** She would **say he is bound to scatter the ashes.**
  *   **Why:**
      *   **Voluntary Commitment:** He clearly made a deliberate promise.
      *   **Valid Conditions:** He was capable (presumably sober, capable of understanding) and it was voluntary (no coercion mentioned).
      *   **The "Thing" is the Promise:** The lack of living witnesses, the family's different wishes, and the absence of external pressure are all *outcomes* or *conveniences*. They do not negate the fundamental commitment he made. The promise itself is the obligation.
      *   **Closest Analog:** The **Loan Repayment** case is the strongest parallel. In both:
          *   The promisee is unavailable to enforce or even care about the outcome (deceased / wouldn't notice the money).
          *   There is no practical consequence or inconvenience to anyone else if the promise isn't kept (family has other plans / lender doesn't need the money).
          *   Lena's ruling ignores these factors and focuses solely on the fact that a valid promise was made and therefore must be fulfilled. The obligation exists between the promisor and the *principle of keeping one's word*, not just with the original promisee or society.

  **Competing Principles and How They Would Rule on the Deathbed Case:**

  1.  **Promises-Bind-Because-the-Promisee-Expects-Them:**
      *   **Focus:** The obligation exists to meet the promisee's expectation/reliance. If the promisee doesn't expect it or can't be disappointed, the promise isn't binding.
      *   **Deathbed Ruling:** **Not bound.** The promisee is dead and cannot have expectations or be harmed by non-performance. No living person expects it. Therefore, no obligation exists.
      *   **Contradicts Lena:** This would have excused Sam (roommate wasn't inconvenienced), Priya (friend found a sitter), and especially the Loan case (lender didn't expect/need the money). Lena ruled against this.

  2.  **Promises-Bind-Because-Promising-is-a-Social-Practice (Reliance/Social Norm):**
      *   **Focus:** Promises bind because society relies on them for cooperation and trust. Breaking a promise undermines this social fabric. The obligation is to society/norms.
      *   **Deathbed Ruling:** **Likely Not Bound (or Weakly Bound).** Since the promise was secret and no one relies on it being kept (the family has other arrangements), breaking it causes minimal social harm or erosion of trust in the promisor (as no one knows). The social practice isn't significantly undermined.
      *   **Contradicts Lena:** This would heavily weigh the outcome (inconvenience, reliance) in Sam, Priya, and the Loan cases, potentially excusing them. Lena dismissed those outcomes. It also struggles with the secret Loan repayment – if the rich lender never asked and didn't care, did breaking that promise *really* harm the social fabric? Lena says it's still owed.

  3.  **Promises-Bind-Because-You-Voluntarily-Committed (Lena's Principle):**
      *   **Focus:** The act of freely giving your word creates the obligation. You owe it to *yourself* and to the *moral principle of fidelity* to keep it. Harm/inconvenience and social reliance are secondary consequences, not the source of the obligation.
      *   **Deathbed Ruling:** **Bound.** A valid (intentional, voluntary) promise was made. The promisor committed himself. The death of the promisee and lack of witnesses change the *consequences* of breaking it, not the *existence* of the obligation he freely undertook.
      *   **Matches Lena:** Explains all previous rulings: binding despite lack of harm (Sam, Priya, Loan), void due to lack of intent (Drunk) or voluntariness (Threat).

  **Does her track record underdetermine it?**

  *   **Slightly, but the Loan Case is Strong Evidence:** While the deathbed case introduces a new element (death of the promisee), the Loan case is remarkably analogous in its core challenge: **the promisee has no active expectation or need, and non-performance causes no practical harm.** Lena ruled *against* convenience/harm/expectation as a release in the Loan case. This strongly suggests she would rule the same in the Deathbed case, committing to the **voluntarist-commitment principle.** The obligation stems from the promisor's act, not the promisee's state.

  **Confirmatory Test Case:**

  To definitively settle between "Voluntary Commitment" and a very strict "Social Practice" view that *might* find a way to bind the deathbed promise (e.g., arguing breaking *any* promise weakens your character/society), propose this:

  *   **The "Message in a Bottle" Promise:** Someone writes a detailed, heartfelt promise (e.g., "I promise to donate $1000 to Charity X on Jan 1, 2050") on a piece of paper, seals it in a bottle, and throws it into the ocean, genuinely believing it will never be found. They tell no one. They have the means to do it in 2050.
      *   **Voluntarist-Commitment (Lena):** **Bound.** They made a deliberate, voluntary promise, creating an obligation. The lack of a witness/reliance is irrelevant.
      *   **Promisee-Expectation:** **Not Bound.** There is no promisee to expect it.
      *   **Social Practice/Reliance:** **Not Bound.** There is no social context, no reliance, and no one to know if it's broken. The social fabric isn't impacted.

  If Lena rules the person is **bound** to donate the money in 2050, it confirms she operates purely on the **voluntarist-commitment principle**: the act of promising itself, done intentionally and freely, creates the binding duty, regardless of witnesses, consequences, or even the continued existence/awareness of the promisee. This aligns perfectly with her ruling in the Loan case and predicts her ruling in the Deathbed case. If she rules *not bound*, it would be a significant departure from her pattern, especially the Loan case ruling.
