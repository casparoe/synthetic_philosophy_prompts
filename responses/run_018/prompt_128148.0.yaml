answer: |-
  Here’s your Q&A prep sheet, structured for maximum survival against analytic metaphysicians and skeptical philosophers of biology. Objections are ordered by likelihood/damage, phrased in their dialect, with concise replies and honesty about weaknesses.

  ---

  ### **Q&A Prep Sheet: Objections & Replies**  
  **Core Thesis:** *Organisms are processual entities (like standing waves) due to proteostatic turnover, rejecting 4D temporal parts via temporary intrinsics.*

  ---

  ### **Top Objections (High Likelihood/High Damage)**  
  1. **The Generalized Ship of Theseus (Metaphysician)**  
     *Objection:* "Your wave analogy presupposes *which* process is the identity-bearing one. But a statue could be reconstituted from its original discarded clay shavings after gradual replacement. Why isn’t *that* process the organism? You’ve just shifted the problem to process identity."  
     *Reply:* "For organisms, the *autopoietic process* (self-maintaining metabolic repair) is metaphysically primitive. The discarded material ceases to participate in homeostasis, so it’s not a candidate for 'reassembly'—unlike artifacts, where reassembly conventions apply."  
     *Weakness:* Concedes that process identity needs grounding. Doesn’t fully resolve "what fixes the process boundaries?" beyond empirical criteria (which philosophers may deem contingent).  

  2. **Temporal Parts Are Still There (4Dist Metaphysician)**  
     *Objection:* "Turnover doesn’t refute temporal parts; it *presupposes* them. At t1, the organism has protein set P1; at t2, it has P2. These are distinct temporal stages differing in intrinsic properties. Your ‘wave’ is just the sum of those stages."  
     *Reply:* "Stages are abstractions. The organism’s identity is the *continuity of the homeostatic regime*—a higher-order property emergent from turnover. No instantaneous stage is ‘the organism’; it’s like demanding a single water molecule *is* the wave."  
     *Weakness:* Risks sounding anti-realist about temporal parts. Doesn’t negate that 4Dists can *model* the process as an aggregate.  

  3. **But Artefacts Can Have Turnover Too (Philosopher of Biology/Metaphysician)**  
     *Objection:* "Neurath’s ship is replaced plank-by-plank while sailing. An heirloom knife has its blade and handle replaced. If artefacts with turnover are still statues/knives, why privilege organisms?"  
     *Reply:* "Artefacts lack *endogenous* turnover. Their persistence depends on external intentional maintenance (e.g., car repairs). Organisms self-perpetuate via encoded (e.g., genetic) norms of repair. This intrinsic teleology makes their identity processual, not conventional."  
     *Weakness:* "Intrinsic teleology" is controversial. Some artefacts (e.g., self-repairing robots) blur the line.  

  ---

  ### **Moderate Objections (High Likelihood/Moderate Damage)**  
  4. **You’re Confusing Persistence Conditions with Composition (Metaphysician)**  
     *Objection:* "Even if matter changes, the *constitution relation* between organism and biomass at t still holds. Turnover explains *how* it persists, not *what* it is. The statue/clay problem applies when we ask ‘Is it one object or two?’ at t."  
     *Reply:* "For organisms, the ‘biomass at t’ isn’t a candidate object—it’s a phase of a process. There’s no ‘clay’ to dualize with the ‘statue’ because the matter is functionally transient. Constitution requires persistent matter; organisms violate that."  
     *Weakness:* Assumes a process ontology without fully defending it. Hard-liners will demand criteria for when "transient matter" negates constitution.  

  5. **Metaphysics Shouldn’t Depend on Empirical Turnover Rates (Philosopher of Biology)**  
     *Objection:* "Metaphysical identity must hold across possible worlds. If we imagine a frozen organism (no turnover), is it still identical to itself? If yes, your theory is contingent. If no, you’ve made metaphysics hostage to biology."  
     *Reply:* "In worlds without turnover, it’s not an organism—just a corpse or crystal. Organismal identity *is* contingent on metabolic continuity, much like a flame’s identity depends on combustion."  
     *Weakness:* Implies metaphysical categories are natural-kind-dependent, which may seem revisionist.  

  ---

  ### **The Objection You Hope Nobody Brings Up (Low Likelihood/High Damage)**  
  **"Your Wave is Just a Four-Dimensional Process *Slice*"**  
  *Objection:* "Standing waves *are* 4D entities—they perdure. Your ‘process-form’ is just a spatially maximal, temporally extended object. Temporary intrinsics still apply to its temporal parts (e.g., the wave’s shape at t). Why isn’t this 4Dism by another name?"  
  *Reply:* "The wave *is* the process—it doesn’t *have* temporal parts; it’s a dynamic pattern. Attributing properties to ‘stages’ mislocates them: the wave’s stability is a global feature, not an intrinsic property of t-slices."  
  *Weakness:* This is a bare assertion against 4D ontology. Success depends on convincing them that process metaphysics is irreducible.  

  ---

  ### **Strategic Concession to Make Upfront**  
  > **"I concede that the statue/clay puzzle is cogent for artefacts or inert objects with persistent matter. My claim isn’t that constitution metaphysics is incoherent, but that *organisms* evade the puzzle because their persistence is fundamentally processual—not material."**  
  > *Why:* Shows respect for the literature while narrowing your thesis to biology. Disarms "you don’t understand the puzzle" reactions.  

  ---

  ### **Survival Tips**  
  - **When pressed on "process identity":** Emphasize *autopoiesis* (self-making). Quote Varela/Maturana: "The product of an autopoietic system is itself."  
  - **When accused of scientism:** "I’m not reducing metaphysics to biology; I’m arguing that biological entities require a *different metaphysical category*."  
  - **If they demand "identity conditions":** "Causal continuity of a self-repairing homeostatic system." Admit this is vaguer than for statues—but that’s the point.  
  - **Your ace card:** "If you insist on applying statue logic to organisms, you get paradoxes without biological payoff. My view explains why biologists never worry about Theseus cases."  

  **Final Note:** Your weakest flank is the analogy to self-repairing artefacts. If they cite contemporary examples (e.g., AI, synthetic biology), concede borderline cases but double down on *endogenous teleology*: "The organism’s repair norms are *internally specified*, not imposed externally."  

  Good luck—those metaphysicians are sharks, but you’ve got the freshest bait in the room.
