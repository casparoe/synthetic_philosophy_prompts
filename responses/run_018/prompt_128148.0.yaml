  For the modal argument... ugh, possible worlds. They'll push on whether the wave could survive different matter. Honestly, the user should just bite the bullet and say "no" to avoid essentialism. 

  Also need to flag the weakest replies: the process ontology bit feels underdeveloped, and the "not an artifact" defense is begging the question. User should admit those are work-in-progress. 

