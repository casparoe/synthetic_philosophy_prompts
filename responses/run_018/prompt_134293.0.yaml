  I'm least confident about whether this rule is truly optimal. Maybe there's a non-contradictory alternative I'm missing, like provisional authorization. But if we accept the premise that time constraints force binary decisions, it holds. The critic might argue that "incompetent-competent" isn't a real contradiction but a contextual attribution - though institutional rules often treat such declarations as factual.

