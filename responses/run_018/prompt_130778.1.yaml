  hey, i'm a phd student in phil of mind writing a chpater on eliminative materialims about beliefs and desires. i found this passage in William James's Principles of Psychology (around 1890) where he describes belief not as a discrete mental object or sentence in the head, but more like a bodily posture of assent — a felt readiness or muscular tension that comes with certain ideas. he talks about the feeling of reality being part of the stream of consciousness rather than a separate representational state.

  i'm stuck on whether this is actually a proto-eliminativist move or just a weird behaviorist precursor. specifically, i'm wondering if James lets us drop the belief-desire pair and replace it with what i'm calling coupled precision-gradient dynamics — basically belief-like stuff is just high-precision prediction errors and desire-like stuff is affective gradients on those errors, with no inner representational structure. does the passage actually support eliminating belief and desire, or is James smuggling representationalism back in? and how does his idea of a sentiment of rationality fit in — is that the same as belief or something different? can you help me parse this? also sorry for any typos, writing on my phone.
