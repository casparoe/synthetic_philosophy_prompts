prompt: |-
  I am a software engineer with no formal training in philosophy, and I have recently been reading von Neumann’s reflections on the brain—particularly his observation that neural tissue achieves remarkably reliable behaviour despite being built from unreliable individual components, and his puzzlement over whether brain processes are best understood as analogue, digital, or an irreducible hybrid of the two. Before I assess any particular scientific account, I want a conceptual specification of what a theory of neural computation actually has to deliver if it takes these concerns seriously.

  Write the desiderata: the full list of requirements that an adequate theory of brain computation must satisfy, with the motivating case or phenomenon behind each—such as explaining high fault-tolerance without a central error-correcting protocol, accommodating both continuous signal modulation and discrete logical inference, or accounting for self-modification and learning in the absence of an external programmer. For each item, indicate whether you treat it as non-negotiable or as a camp-specific preference (for instance, the insistence on a symbol-level architecture versus a purely statistical learning framework), and flag any subset of requirements that appear jointly unsatisfiable given known constraints from neurobiology or information theory, since that tension is precisely what interests me most. I also want one requirement imported from distributed systems design included explicitly: the theory must explain graceful degradation under partial node failure without invoking a global orchestrator or redundant backup scheme, because this strikes me as a constraint von Neumann anticipated yet contemporary models rarely address directly. Please keep the weight on the criteria and their motivating distinctions—such as the difference between hardware failure and representational error, or between statistical approximation and verifiable inference—rather than on scoring competitors, though a brief assessment of how mainstream connectionist models, symbolic cognitive architectures, and predictive-processing frameworks fare against the list would be welcome. I am not seeking bibliographies, reading lists, or citations; I want the conceptual spec itself, and I would particularly like you to identify which single requirement, in your view, excludes the greatest number of popular current theories.
reasoning: |-
  We are building a conceptual specification (desiderata) for a theory of neural computation that takes von Neumann's concerns seriously. The requirements are derived from the phenomena he observed and the puzzles he raised, along with an explicit requirement from distributed systems design.

  Key phenomena to address:
  1. Reliability from unreliable components (fault tolerance without central error correction).
  2. The nature of computation: analog, digital, or hybrid?
  3. Self-modification and learning without an external programmer.

  Additionally, we include:
  4. Graceful degradation under partial node failure without a global orchestrator or redundant backup (from distributed systems).

  We will list each requirement, the motivating phenomenon, and classify as non-negotiable (NN) or camp-specific preference (CSP). We will also flag any tensions (apparently jointly unsatisfiable requirements) and then briefly assess mainstream models.

  Desiderata:

  1. **Component-Level Unreliability vs. System-Level Reliability (Fault Tolerance)**
     - **Motivation**: Neural components (neurons, synapses) are noisy and fail individually, yet the brain as a whole performs reliably. This must be achieved without a central error-correcting protocol (like in digital computers with error-correcting codes or redundancy managed by a central unit).
     - **Classification**: Non-negotiable (NN). Any theory must account for this.
     - **Tension**: This requirement might conflict with the need for precise computation (if the theory requires high precision at the component level).

  2. **Graceful Degradation under Partial Node Failure**
     - **Motivation**: From distributed systems: the brain must continue to function (albeit with reduced performance) when parts of the network are damaged or fail, without relying on a global orchestrator or a pre-defined redundant backup scheme (like in engineered systems with hot spares). The brain's ability to recover from injury (e.g., stroke) without a central controller is a key example.
     - **Classification**: Non-negotiable (NN). This is a specific form of fault tolerance but with distributed systems constraints.
     - **Tension**: This requirement might be in tension with requirements for high precision or with the need for localized representations (if a node is critical and not redundant).

  3. **Accommodation of Both Continuous and Discrete Aspects of Computation**
     - **Motivation**: Neural signals are modulated in an analog fashion (e.g., graded potentials, neurotransmitter release) but also exhibit discrete properties (e.g., all-or-nothing action potentials). Moreover, cognition involves both continuous (e.g., perceptual processing) and discrete (e.g., logical inference, decision making) processes. The theory must explain how both types of processing arise without forcing one to be reducible to the other.
     - **Classification**: Non-negotiable (NN). The brain clearly uses both, so a theory that only accounts for one is inadequate.
     - **Tension**: This is a core tension: how to have a unified framework that seamlessly integrates analog and digital computation? Known constraints from neurobiology (e.g., neurons as analog devices that spike) and information theory (e.g., limitations of analog computation in noise) make this challenging.

  4. **Self-Modification and Learning without an External Programmer**
     - **Motivation**: The brain learns and modifies its own structure and function throughout life. There is no external agent setting the parameters or reprogramming the system. The theory must explain how such self-organization emerges from the computational substrate.
     - **Classification**: Non-negotiable (NN). This is a fundamental feature of biological brains.
     - **Tension**: This requirement might conflict with the need for stability (catastrophic forgetting) and with the requirement for reliable computation (if learning introduces instability).

  5. **Energy Efficiency and Biological Plausibility**
     - **Motivation**: The brain operates under severe energy constraints. Any computational model must account for the energy efficiency of neural processes and use biologically plausible mechanisms (e.g., no unlimited precision, no unbounded memory, no non-local operations).
     - **Classification**: Non-negotiable (NN). This is a hard constraint from biology.

  6. **Real-Time Performance with Massive Parallelism**
     - **Motivation**: The brain processes information in real-time (e.g., visual perception in ~100ms) despite the relatively slow speed of individual neurons. This is achieved through massive parallelism. The theory must account for how complex computations are performed within these time constraints.
     - **Classification**: Non-negotiable (NN). This is an observed fact.

  7. **Scalability and Evolvability**
     - **Motivation**: The brain's computational architecture must scale from small neural circuits to the whole brain, and it must have evolved incrementally. The theory must not rely on features that only appear at a particular scale (e.g., global properties that cannot emerge from local interactions) and must be compatible with evolutionary development.
     - **Classification**: Non-negotiable (NN). This is a biological constraint.

  8. **Representational Flexibility and Compositionality**
     - **Motivation**: Cognition requires the ability to form structured representations (e.g., objects, relations, hierarchies) and to recombine them in novel ways (compositionality). This is particularly evident in language and reasoning. However, the requirement for compositionality is often a point of contention between symbolic and connectionist approaches.
     - **Classification**: Camp-specific preference (CSP) to some extent. While all theories must account for the brain's ability to handle structured representations, the insistence on a particular form (e.g., symbolic) is camp-specific. However, the ability to form and manipulate structured representations is non-negotiable (so we might split this into two: the ability to form structured representations is NN, but the specific mechanism is CSP).
     - **Tension**: This requirement is a major point of tension because connectionist models often struggle with explicit compositionality without additional mechanisms (like tensor product representations or neural-symbolic integration), while symbolic models struggle with the flexibility and context-dependence of neural representations.

  9. **Verifiable Inference and Statistical Approximation**
     - **Motivation**: The brain must perform both kinds of reasoning: sometimes it needs to draw logically sound conclusions (verifiable inference, e.g., in mathematics), and at other times it must make decisions based on uncertain, probabilistic information (statistical approximation). The theory must account for both without reducing one to the other.
     - **Classification**: Non-negotiable (NN). Both are observed in human cognition.
     - **Tension**: This is a known challenge: how to integrate logical and probabilistic reasoning? This is the classic tension between symbolic and connectionist approaches.

  10. **Explaining Consciousness and Subjective Experience (Optional but Desired)**
      - **Motivation**: While not strictly computational, a complete theory of the brain must eventually address subjective experience. However, this may be beyond the scope of a computational theory per se.
      - **Classification**: Camp-specific preference (CSP). Some theories (like integrated information theory) make this central, while others (like connectionism) typically avoid it. We note this as an open challenge but not a core requirement for a computational theory.

  Tensions and Challenges:

  - **Major Tension 1**: The requirement for both continuous (analog) and discrete (digital) processing (Desideratum 3) is a core challenge. It is not clear how a single computational framework can natively support both without one being emulated by the other (which may be inefficient or biologically implausible).

  - **Major Tension 2**: The requirement for reliable computation from unreliable parts (Desideratum 1) and graceful degradation (Desideratum 2) without a central controller or explicit redundancy conflicts with the need for precise computation in some tasks (like logical inference). How can a system with no central orchestrator and no explicit redundancy achieve high reliability? This is a key insight from distributed systems: redundancy and error correction must emerge from the collective behavior.

  - **Major Tension 3**: The requirement for self-modification and learning (Desideratum 4) without an external programmer, combined with the need for stability (to avoid catastrophic forgetting) and reliability (to maintain function during learning), is a known challenge in machine learning (the stability-plasticity dilemma).

  - **Major Tension 4**: The requirement for representational compositionality and verifiable inference (Desiderata 8 and 9) is a major point of disagreement. Symbolic architectures (like ACT-R) excel at compositionality and logical inference but struggle with statistical learning and graceful degradation. Connectionist models (like deep neural networks) excel at statistical learning and fault tolerance but struggle with compositionality and verifiable inference.

  Assessment of Mainstream Models:

  - **Connectionist Models (e.g., Deep Learning)**:
    - Strengths: Fault tolerance (1) and graceful degradation (2) are inherent due to distributed representations. They naturally handle continuous signals (part of 3) and statistical approximation (9). They are good at learning without an external programmer (4) and are energy-efficient in their biological inspiration (5). They are massively parallel (6) and scalable (7) to some extent.
    - Weaknesses: They struggle with discrete logical inference (part of 3 and 9) and compositionality (8). They are not naturally suited for verifiable inference. They often require backpropagation, which is biologically implausible.

  - **Symbolic Cognitive Architectures (e.g., ACT-R, SOAR)**:
    - Strengths: They handle discrete logical inference (3,9) and compositionality (8) very well. They can model higher-level cognition.
    - Weaknesses: They are not fault-tolerant (1) and do not degrade gracefully (2) because they rely on discrete symbols and rules. They struggle with continuous processes and statistical learning. They require an external programmer to set up the rules and symbols, so they fail at self-modification (4) without significant extension.

  - **Predictive Processing (PP) Frameworks**:
    - Strengths: They naturally incorporate both continuous and discrete aspects (3) by using probabilistic inference. They can account for learning (4) and are biologically plausible (5). They can handle both statistical approximation and, in principle, verifiable inference (9) by using Bayesian inference. They are naturally distributed and might achieve fault tolerance (1) and graceful degradation (2).
    - Weaknesses: It is unclear if they can achieve true compositionality (8) without hybrid architectures. They may not naturally account for discrete logical inference (like modus ponens). Also, the computational demands of maintaining and updating a full generative model in real-time (6) are very high.

  The Single Most Excluding Requirement:

  In my view, the requirement that excludes the greatest number of popular current theories is:

  **Desideratum 8 (Representational Flexibility and Compositionality) as Non-Negotiable (the ability to form and manipulate structured representations in a flexible and compositional manner).**

  Why? 
  - Connectionist models (especially standard deep learning) often fail to exhibit systematic compositionality and are limited in their ability to represent complex structures without explicit architectural enhancements (like neural attention mechanisms or external memory). 
  - Predictive processing, while powerful, does not inherently provide a mechanism for compositionality and structured representation.
  - Symbolic models do well on compositionality but fail on many other non-negotiable requirements (like fault tolerance and graceful degradation).

  Therefore, a theory that must account for compositionality without sacrificing the other non-negotiables (especially fault tolerance and graceful degradation) is currently lacking. This requirement is a key challenge for connectionist and predictive processing models and is not fully met by any existing mainstream theory.

  Conclusion:

  The conceptual specification requires a theory that can simultaneously account for:
  - Fault tolerance and graceful degradation in a distributed manner.
  - Hybrid analog/digital computation.
  - Autonomous learning and self-modification.
  - Energy efficiency and biological constraints.
  - Real-time performance and scalability.
  - The ability to form structured representations and perform both statistical and logical inference.

  The major tensions lie in the integration of analog and digital computation, the reconciliation of statistical and logical inference, and the achievement of compositionality in a distributed, fault-tolerant system. The requirement for compositionality is the one that currently excludes the most theories.
answer: |-
  Below is a conceptual specification—a list of desiderata—for a theory of neural computation, grounded in von Neumann's core concerns (reliability from unreliable components, analog/digital ambiguity) and your distributed systems constraint. Each requirement is defined by:  
  - **The phenomenon it addresses** (e.g., observed neural behavior or functional capability).  
  - **Its status** as **non-negotiable** (NN: mandated by empirical neurobiology or fundamental constraints) or **camp-specific preference** (CSP: contingent on architectural assumptions like symbolic vs. connectionist frameworks).  
  - **Tensions** where requirements appear jointly unsatisfiable given current knowledge (highlighting fertile ground for theoretical innovation).  

  The list prioritizes conceptual clarity over model comparisons, but a brief assessment of major frameworks (connectionism, symbolic architectures, predictive processing) is included at the end. The "most excluding" requirement is identified in the conclusion.  

  ---

  ### **Desiderata for a Theory of Neural Computation**  
  **Core Principle**: The theory must explain how the brain achieves robust, flexible cognition using components (neurons, synapses) that are slow, noisy, and failure-prone, without relying on centralized control, perfect redundancy, or external programming.  

  1. **Component-Level Fault Tolerance with Systemic Reliability**  
     - **Phenomenon**: Neural tissue operates reliably despite individual neurons/synapses having high failure rates (e.g., stochastic vesicle release, axon degradation). No central error-correcting "controller" exists.  
     - **Requirement**: Explain how unreliability at the microscale is transformed into reliability at the macroscale *without* explicit redundancy (e.g., duplicated circuits) or global error-correction protocols.  
     - **Status**: NN (non-negotiable).  
     - **Motivating Distinction**: Hardware failure (e.g., a dying neuron) vs. representational error (e.g., misclassifying an object). The former must not catastrophically disrupt function.  

  2. **Graceful Degradation under Partial Node Failure**  
     - **Phenomenon**: Brain function degrades smoothly (not catastrophically) during localized damage (e.g., stroke, neurodegeneration), with no "global orchestrator" redirecting tasks or activating backups.  
     - **Requirement**: Explain how the system maintains partial functionality during incremental component loss, relying *only* on emergent, decentralized dynamics (e.g., distributed resource allocation).  
     - **Status**: NN (extends fault tolerance to dynamic damage).  
     - **Tension**: Jointly difficult with **Precise Symbolic Inference (Requirement 6)**—how can decentralized systems guarantee precision without redundancy?  

  3. **Analog-Digital Hybridity without Reduction**  
     - **Phenomenon**: Neural signals exhibit continuous (graded potentials, neuromodulator diffusion) and discrete (all-or-nothing spikes) properties, supporting both perceptual continuity and discrete decisions.  
     - **Requirement**: Accommodate both continuous signal modulation (e.g., attention, arousal) and discrete state transitions (e.g., rule-based inference) as irreducible primitives.  
     - **Status**: NN (empirically observed).  
     - **Motivating Distinction**: Analog (statistical approximation) vs. digital (verifiable inference) computation. The theory must not reduce one to the other.  

  4. **Autonomous Self-Modification and Learning**  
     - **Phenomenon**: Brains learn continuously from experience (synaptic plasticity, structural rewiring) with no "external programmer" setting rules or goals.  
     - **Requirement**: Explain how computational principles (not just algorithms) enable self-directed adaptation, including meta-learning (learning to learn) and stability-plasticity balance.  
     - **Status**: NN (defining feature of biological cognition).  
     - **Tension**: Conflicts with **Fixed Architectural Guarantees (Requirement 8)**—self-modification risks destabilizing core functions.  

  5. **Energy-Efficient Massively Parallel Processing**  
     - **Phenomenon**: The brain performs complex computations (e.g., object recognition in 100ms) using slow components (∼5Hz mean firing rate) and limited energy (∼20W).  
     - **Requirement**: Explain real-time performance via parallel, asynchronous, event-driven computation with severe energy constraints.  
     - **Status**: NN (biophysical and thermodynamic necessity).  

  6. **Verifiable Inference alongside Statistical Approximation**  
     - **Phenomenon**: Cognition supports both approximate, probabilistic judgments (e.g., facial recognition in noise) and exact, rule-based inferences (e.g., logical deductions, algebraic manipulation).  
     - **Requirement**: Enable formal verification of discrete inferences (e.g., "If A>B and B>C, then A>C" must hold) without sacrificing statistical flexibility.  
     - **Status**: CSP (symbolic/neuro-symbolic camps emphasize this; connectionists often approximate it).  
     - **Tension**: Appears incompatible with **Pure Continuous Dynamics (Requirement 3)** under noise—digital systems verify; analog systems optimize probabilistically.  

  7. **Scalable Compositionality**  
     - **Phenomenon**: Brains construct complex representations (e.g., "a blue car chasing a red bike") from simpler elements, recombining them flexibly and recursively.  
     - **Requirement**: Support dynamic binding of representational units into structures, enabling novel combinations without relearning.  
     - **Status**: CSP (symbolic models demand explicit compositionality; connectionists use distributed embeddings).  
     - **Motivating Distinction**: Statistical similarity (connectionist) vs. syntactic structure (symbolic).  

  8. **Fixed Architectural Guarantees amid Plasticity**  
     - **Phenomenon**: Core functions (e.g., breathing, heartbeat) persist despite ongoing plasticity, avoiding catastrophic forgetting.  
     - **Requirement**: Ensure critical computations remain stable during learning, with built-in invariance to low-level component variation.  
     - **Status**: NN (evolutionary constraint).  
     - **Tension**: Directly opposes **Autonomous Self-Modification (Requirement 4)**—how to permit change while preserving essential functions?  

  9. **Decentralized Coordination without Global Clock**  
     - **Phenomenon**: Distributed brain regions (e.g., sensory/motor systems) coordinate temporally precise behaviors (e.g., catching a ball) without a central clock or scheduler.  
     - **Requirement**: Achieve synchronization/coordination via local interactions (e.g., predictive coding, oscillatory coupling).  
     - **Status**: NN (no evidence of central timing).  

  ---

  ### **Tensions and Joint Unsatisfiability**  
  - **Tension 1 (Most Salient)**: **Graceful Degradation (Requirement 2)** + **Verifiable Inference (Requirement 6)**.  
    - Graceful degradation demands distributed, statistical robustness (tolerating errors), while verifiable inference requires discrete, error-free operations. Neurobiology shows no dedicated error-correction circuitry, making this a key puzzle.  
  - **Tension 2**: **Autonomous Self-Modification (Requirement 4)** + **Fixed Architectural Guarantees (Requirement 8)**.  
    - Learning requires flexibility; stability requires rigidity. No known computational framework fully resolves this without external constraints (e.g., regularization in ML).  
  - **Tension 3**: **Analog-Digital Hybridity (Requirement 3)** + **Scalable Compositionality (Requirement 7)**.  
    - Continuous dynamics struggle with discrete compositionality (symbols require boundaries); discrete systems struggle with continuous modulation.  

  ---

  ### **Brief Assessment of Major Frameworks**  
  - **Connectionism (e.g., Deep Nets)**:  
    - Excels at **Fault Tolerance (1)**, **Graceful Degradation (2)**, **Statistical Approximation (6)**, and **Learning (4)** via distributed representations.  
    - Fails **Verifiable Inference (6)**, **Scalable Compositionality (7)**, and **Analog-Digital Hybridity (3)** (treated as analog approximating digital).  
  - **Symbolic Architectures (e.g., ACT-R)**:  
    - Excels at **Verifiable Inference (6)**, **Compositionality (7)**, and **Fixed Guarantees (8)** via explicit rules.  
    - Fails **Graceful Degradation (2)**, **Fault Tolerance (1)**, and **Hybridity (3)** (overly digital).  
  - **Predictive Processing**:  
    - Excels at **Hybridity (3)** (Bayesian inference blends continuous/discrete), **Learning (4)**, and **Decentralized Coordination (9)**.  
    - Unclear on **Graceful Degradation (2)** (assumes precise generative models), **Verifiable Inference (6)**, and **Compositionality (7)**.  

  ---

  ### **The Most Excluding Requirement**  
  **Graceful Degradation under Partial Node Failure without Global Orchestrator (Requirement 2)** excludes the greatest number of popular theories:  
  - **Why**: Symbolic architectures rely on critical components (e.g., production rules); damage causes collapse. Connectionist nets degrade but often rely on engineered redundancy (e.g., over-parameterization). Predictive processing assumes high-level "predictions" orchestrate corrections. None fully explain *emergent* robustness in sparse, energy-constrained systems. Von Neumann’s insight—that reliability *must* emerge from unreliable parts—remains inadequately addressed.  

  This requirement forces confrontation with neurobiology’s messiest constraints: no spare parts, no backups, and no central controller. A satisfying theory must show how noise and failure are not just tolerated but *exploited* for adaptability—a pivot from von Neumann’s digital paradigm.
