  I'm thinking about how to construct this. For the setting, a mountain pass makes sense - something like the Khyber Pass where geography forces enemies to share infrastructure. I'll have two factions: State A (the aggressor) and State B (defending). The corridor contains parallel rail lines and power conduits that both sides rely on. The opacity comes from fragmented command structures - maybe State B has decentralized militia groups mixed with regulars, making it impossible for State A's commander to know who exactly is operating which assets.

  Now for the dilemma: Commander Alpha (State A, unjust side) discovers the corridor's vulnerability. The revisionist view would say Alpha can't strike because only just combatants have defensive rights, and the strike would harm State B's personnel who aren't liable. But the moral equality view would allow it since both sides' combatants are legitimate targets regardless of war's justice.

  After the scenario, I need to analyze both positions clearly. For the liability view, the key is that unjust combatants lose protection when pursuing aggression. For moral equality, it's about the epistemic barrier - no soldier can adjudicate justness mid-combat. The weakest point for my case would be that in real war, refusing to target shared infrastructure might prolong conflict and increase suffering overall.

