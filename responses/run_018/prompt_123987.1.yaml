  **Hotel Infinity: A Check-Out Dispute**

  The rooms are never all there, one insists,
  Pointing past the lobby's gleaming floor.
  Endless queue of guests that still persists,

  But never present, whole, on any lists.
  The manager just smiles, unlocks the door:
  "Shift every guest up, there's always space."

  A skeptic scrawls each room name that exists,
  Assigns a number, tries to keep the score.
  The rooms are never all there, one insists.

  Then Cantor comes, with logic that resists
  Such tidy counts. He builds a rebel core –
  "Shift every guest up, there's always space,"

  He mocks the list, its fundamental gist
  Escaped. This number *wasn't* here before!
  The rooms are never all there, one insists.

  The skeptic sees the flaw within the twists
  Of endless sets, a truth he can't ignore:
  "Shift every guest up, there's always space"!

  But *this* new guest, where does he fit the wrists
  Of room keys? In the scheme designed for more?
  The rooms are never all there, one insists.
  "Shift every guest up, there's always space."

  ---

