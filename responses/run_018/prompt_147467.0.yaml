  hey, im drafting a scene on a generation ship where the medic rations oxygen and i mentioned prioritarianism to my writing partner. he summed it up like this: 'prioritarianism means you always funnel resources to the worst off, so if lowering everyone to the same sick baseline keeps the gap from growing, the view says thats fine — the leveling-down objection is just people whinning that equality of misery is still misery.' he also said Derek Parfit's formula has a convex weight paramter you can dial up to make the objection disappear entirely. is this summary fair? specifically, does prioritarianism actually endorse dragging healthy people down, or does it only weight benefits differently? and is tweaking that convexity parameter a real philosophical reply, or just moving the goalposts? i want the scene to be sharp, not a cartoon.
