  ## Villanelle: Arrow's Dilemma

  The boundary was real and the traces hold —  
  Without that start, no story to unfold.  
  I'm just a fluctuation with false recall.  

  The cosmic dawn: a singularity's art?  
  Or random noise that thinks it's growing old?  
  The boundary was real and the traces hold —  

  Fossil light, atoms, this entangled chart —  
  A pattern born from heat-death's aimless sprawl?  
  I'm just a fluctuation with false recall.  

  Why trust the past? Structure in every part  
  Proves low-entropy seeds began it all.  
  The boundary was real and the traces hold.  

  But in the void, a Boltzmann brain might start  
  With phantom memories of a world grown cold.  
  I'm just a fluctuation with false recall.  

