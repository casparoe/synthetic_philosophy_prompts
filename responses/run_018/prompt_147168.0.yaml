prompt: |-
  Having spent thirty years in experimental physics before turning, in retirement, to the study of classical Indian epistemology, I am struck by how the Nyāya school's four pramāṇas—pratyakṣa (perception), anumāna (inference), upamāna (comparison or analogy), and śabda (testimony)—map imperfectly onto the methods I once trusted in the laboratory. Rather than asking for a historical summary, I want an evaluation on a specific dimension: please rank these four knowledge-sources according to what I will call their "error-correction resilience," defined as the capacity of a community of inquirers to identify and rectify a false deliverance generated by that particular source without circularly relying on one of the other three. Assign each pramāṇa an integer score from 1 (least resilient) to 10 (most resilient), and in a concise paragraph for each, justify the score by appealing to internal features of the Nyāya account—for instance, the conditions of invariable concomitance (vyāpti) in anumāna, the dependency relations that constrain upamāna, the authority conditions for śabda, or the directness and fallibility conditions discussed for pratyakṣa. I ask that you treat the framework on its own terms rather than reducing it to a modern philosophy of science gloss, and that you present your answer in American English. Please do not include bibliographies, citation lists, or reading recommendations; I am working without library access and need only the conceptual analysis.
reasoning: |-
  Okay, let me approach this query methodically. The user presents a fascinating challenge: evaluating Nyāya epistemology's four pramāṇas through the lens of "error-correction resilience" as defined. Having spent decades in experimental physics before studying Indian philosophy, they clearly seek rigorous conceptual analysis rather than historical summary.

  First, I need to unpack the core criterion: how easily can a community detect and fix false outputs from each pramāṇa without circularly depending on the other three? This requires examining each pramāṇa's internal mechanics within Nyāya's own framework.

  For pratyakṣa (perception), Nyāya acknowledges direct sensory knowledge but also lists specific causes of error (dravya, etc.). The problem is that perceptual errors often require inference or testimony to identify - say, distinguishing a snake from a rope in dim light. This creates a low-resilience scenario.

  Anumāna (inference) fares better because its validity hinges on vyāpti - the universal concomitance between hetu and sādhya. Cross-validation through multiple inferential chains seems possible, though establishing vyāpti itself may involve perception. Still, the logical structure allows for internal consistency checks.

  Upamāna (analogy) troubles me most. It relies on prior knowledge of both terms (cow/gavaya), and errors could persist if the initial comparison is flawed. There's little room for self-correction without external verification. 

  Śabda (testimony) scores moderately. While āpta (reliable source) status provides some error-resistance, validating expertise itself requires circular checks. The community aspect helps through consensus-building, but the dependence on external verification remains problematic.

  I'll structure the response with clear scores and concise justifications, strictly avoiding modern scientific parallels as requested. The physics background suggests appreciation for precision, so I'll emphasize Nyāya's own error theories for each pramāṇa. No citations needed - pure conceptual analysis in American English as specified.
answer: |-
  Here is a ranked evaluation of the Nyāya pramāṇas based solely on their "error-correction resilience" within the internal logic of the classical Nyāya framework:

  1.  **Anumāna (Inference) - Score: 8/10**
      *   **Justification:** The core of anumāna is *vyāpti* (invariable concomitance), the universal relationship between the hetu (reason/middle term) and the sādhya (probandum/major term). Error-correction resilience is high because a community can rigorously examine the claimed *vyāpti* for exceptions (*vyabhicāra*) without *necessarily* invoking another *pramāṇa* directly. Members can propose counter-examples ("Does the hetu ever occur without the sādhya?") or challenge the universality of the relation based on previously established inferences or recognized contradictions within the system of knowledge. The logical structure itself provides internal criteria (absence of *upādhi* - vitiating conditions, consistency) for testing the inference's validity. While *pratyakṣa* often grounds *vyāpti*, the *examination* and *falsification* of a specific inferential claim can occur primarily through logical scrutiny of the concomitance within the community's shared web of established inferences and definitions.

  2.  **Pratyakṣa (Perception) - Score: 5/10**
      *   **Justification:** While Nyāya holds perception as foundational, it explicitly acknowledges numerous causes of error (*dravya, deśa, kāla, svabhāva*, defects in senses/mind). Its resilience is moderate because identifying perceptual error (*pratyakṣābhāsa*) often *requires* reliance on other *pramāṇas*. A community member might challenge a perception by pointing to conflicting testimony ("The scripture says that's illusory"), invoking inference based on known principles ("Fire perceived in fog is always inferred to be a mirage"), or comparison ("That object doesn't match the known characteristics of water"). While Nyāya details *internal* conditions for valid perception (e.g., proper connection of senses/object, non-deviant senses, non-subliminal), confirming these conditions in disputed cases frequently necessitates external verification via other means. The *directness* of perception becomes a vulnerability for self-correction.

  3.  **Śabda (Testimony) - Score: 4/10**
      *   **Justification:** Valid śabda depends critically on the speaker being an *āpta* (reliable authority/expert) who possesses direct knowledge (*pratyakṣa* or *yogaja*) of the subject and speaks truthfully without intent to deceive. Error-correction resilience is low because verifying these authority conditions intrinsically relies on other sources. The community must assess the speaker's expertise (often via inference from credentials or past reliability, or comparison to known experts) and trustworthiness (inference from character, motives). Disputing testimony usually involves invoking conflicting testimony from a *more* authoritative source, inference contradicting the statement, or perception showing the statement false. While internal consistency of the testimony or coherence with established knowledge (*siddhānta*) can be checked, resolving fundamental disputes about the source's validity or the meaning of the utterance typically requires stepping outside śabda itself.

  4.  **Upamāna (Comparison/Analogy) - Score: 2/10**
      *   **Justification:** Upamāna involves knowing the similarity of a newly encountered object (e.g., a gavaya) to a familiar object (e.g., a cow) based on recalling the familiar object's characteristics when prompted by an authoritative statement ("A gavaya is like a cow"). Its error-correction resilience is the lowest. Errors can arise from misremembering the familiar object's attributes, misapprehending the features of the new object, misunderstanding the authoritative statement, or incorrectly judging the similarity. Crucially, identifying *which* element failed is exceptionally difficult without invoking other pramāṇas. Did the testimony define the similarity wrongly (requiring śabda check)? Is the perception of the gavaya faulty (pratyakṣa)? Is the recalled memory of the cow inaccurate? Confirming the validity of the analogy hinges entirely on cross-verification using perception (of both objects), inference (about features), or testimony (clarifying the initial statement). The process offers minimal internal mechanisms for self-correction within its own structure.
