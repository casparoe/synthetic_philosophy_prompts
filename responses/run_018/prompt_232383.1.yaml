prompt: |-
  I have been trying to articulate the principle behind my judgments that some hypotheses are simpler than others, and I want to know whether a single coherent principle can be extracted from them, or whether I am helping myself to a notion of simplicity that no formal account can underwrite. I would like a definite answer: the principle you would defend, stated precisely, not a survey of options.

  My working principle is something like this: when two hypotheses fit the available data, the simpler one deserves more prior probability, and simplicity is shortness of description—roughly, the length of the shortest program that generates the hypothesis's predictions. This should cash out as a prior of the Solomonoff sort, where probability decreases with Kolmogorov complexity.

  Here are the verdicts the principle has to capture.

  (1) I judge a linear rule—y increases by one whenever x increases by one—to be simpler than a wiggly 50-parameter function that fits the same points, even when the linear rule fits slightly worse, and I think the linear rule is the better inductive bet.

  (2) I judge the hypothesis that all emeralds are green to be simpler than the hypothesis that all emeralds are grue, even though the two fit the same observations so far, and I do not think introducing a time-indexed predicate is a legitimate way to flip the simplicity ordering.

  (3) I judge the hypothesis that a sequence is just 01 repeated a million times to be simpler than the hypothesis that it is this particular random-looking string, even if the second hypothesis can be stated briefly in a language that happens to contain a primitive name for that very string.

  (4) Yet I also accept that for any data at all, there is some programming language in which the data has a very short description—add a primitive that outputs exactly those data—and I feel that simplicity judgments should not be at the mercy of whoever designed the language. I want the difference between (3) and the rigged language in (4) to be principled, not just a feeling.

  (5) I accept that two universal machines can disagree about which of two hypotheses is shorter; but I still believe there is a language-independent fact of the matter that a smooth curve is simpler than a lookup table, and I do not see how a Solomonoff-style prior, defined relative to a machine, can deliver that fact.

  (6) I think a hypothesis encoded by a long, random-looking program should receive less prior probability than a short, elegant one even when both fit the data; but if the relevant prior is not computable, I do not see how it can be a norm governing the beliefs of a finite agent like me.

  (7) I suspect the language-dependence worry in (5) is overstated because any two universal machines agree on simplicity up to an additive constant; but for two fixed hypotheses, the constant may exceed the difference in length, so the invariance theorem seems to leave the particular case unsettled.

  Is there a principle—Solomonoff induction, Kolmogorov complexity, minimum description length, or something else—that captures what is right in these verdicts and says clearly which of them I should drop? Give me the principle you would defend, stated precisely enough that I can see how it handles (1) through (7), and tell me what it says about a further case I have not settled: two hypotheses that are equally short, but one of which is astronomically more expensive to compute with. And be explicit about which of my verdicts your principle cannot accommodate, rather than saving all of them with epicycles.
reasoning: |-
  We are going to defend a principle based on Solomonoff induction, which uses a fixed universal Turing machine (UTM) and defines the prior probability of a hypothesis (or data sequence) as proportional to 2^(-K(x)), where K(x) is the Kolmogorov complexity of x relative to the UTM.

  However, we must address the concerns about language dependence and the specific cases. The key is to note that while the Kolmogorov complexity is machine-dependent, the invariance theorem (that K_U(x) <= K_V(x) + c_{UV} for a constant c_{UV} independent of x) allows us to consider the complexity as objective in an asymptotic sense. But for finite strings, the constant can matter. We also note that the choice of UTM is arbitrary but fixed, and we typically require that the UTM is "natural" in the sense that it is not contrived to make certain strings short.

  Now, let's go through the cases:

  (1) Linear vs. wiggly function: A linear rule has a short program (e.g., a loop that increments y by one for each step in x). The 50-parameter function would require a much longer program to specify the parameters and the structure. So the linear rule has lower Kolmogorov complexity and hence higher prior.

  (2) Green vs. Grue: The predicate "green" is simple and does not depend on time, while "grue" requires a time-dependent definition. Therefore, the hypothesis "all emeralds are green" is shorter to describe than "all emeralds are grue" (which requires defining grue and then the time condition). So green has lower complexity.

  (3) Repeated "01" vs. a random-looking string: The string of a million repetitions of "01" can be generated by a short program (a loop that prints "01" 500,000 times). The random-looking string, even if it can be named by a primitive in some language, would typically require a very long description in a standard universal language (without that primitive). We are using a fixed universal machine that does not have primitives for arbitrary long strings.

  (4) Rigged language: If we allow a language with a primitive that outputs exactly the data, then that data has a very short description. However, we do not allow arbitrary languages. We fix a universal machine that is "natural" and does not have primitives for arbitrary data. The machine should be one that is reasonable for describing general computations. The key is that the machine is fixed and universal, and we do not change it to fit the data.

  (5) Language independence and the invariance theorem: The invariance theorem tells us that for long strings, the choice of machine becomes negligible. For the comparison of a smooth curve and a lookup table, the smooth curve will be shorter in any reasonable universal machine. Why? Because a smooth curve can be described by a simple equation (e.g., linear, polynomial) which is short, while a lookup table requires listing every data point. The constant in the invariance theorem may be large, but the difference in complexity for a smooth curve versus a lookup table grows with the amount of data. For a large dataset, the smooth curve wins in any universal machine.

  (6) Non-computability and finite agents: The Solomonoff prior is not computable. However, we can use approximations (like using a specific compression algorithm or a bounded version of Kolmogorov complexity). The norm is for an ideal agent. Finite agents can use feasible approximations (e.g., MDL with a constrained model class). The elegance of a program (short and non-random) is captured because a random program is incompressible and hence long.

  (7) The additive constant: For two fixed hypotheses, the constant might be large. However, in practice, for natural hypotheses and natural universal machines, the ordering is often preserved. Moreover, when the difference in complexity is large (as in the smooth curve vs. lookup table for a lot of data), the additive constant is negligible.

  Now, the principle:

  **Principle:** The prior probability of a hypothesis H is given by P(H) = 2^(-K(H)), where K(H) is the Kolmogorov complexity of H relative to a fixed universal Turing machine U that is chosen to be "natural" (i.e., it is a standard universal machine without contrived primitives). This prior is then updated via Bayes' rule when data is observed.

  However, note that in Solomonoff induction, we typically consider the prior over sequences of observations (not directly over hypotheses). But we can map hypotheses to their predictions. The hypothesis that the data is generated by a program p is assigned prior 2^{-l(p)} (for a prefix-free machine).

  Alternatively, we can think of the hypothesis as the program that generates the predictions. Then the prior is 2^{-l(p)}.

  Now, the case of two hypotheses that are equally short but one is astronomically more expensive to compute:

  Suppose we have two programs p1 and p2 that both output the same data (so they are equally good at fitting the data) and they have the same length. Then according to the prior, they have the same prior probability. The computational cost (time or space) does not factor into the prior. However, we might consider that a program that takes too long to run might not be feasible for a finite agent. But the Solomonoff prior does not account for computational resources. Therefore, the prior does not penalize for computational cost.

  But note: in practice, we might use a resource-bounded version of Solomonoff induction. However, the pure principle does not incorporate computational cost.

  Therefore, for the additional case: two hypotheses (programs) that are equally long and predict the same data, but one is computationally expensive, are assigned the same prior.

  But we might argue that the computational cost is part of the description? Not in the standard Kolmogorov complexity. However, there is a concept of "time-bounded Kolmogorov complexity", but that is not standard in the prior.

  Thus, the principle does not account for computational cost in the prior. So if two programs are of the same length, they have the same prior, regardless of running time.

  Now, explicitly:

  - (1) Captured: linear rule has shorter program.
  - (2) Captured: "green" is simpler than "grue".
  - (3) Captured: the repeated pattern has a short program without needing a special primitive.
  - (4) We avoid by fixing a natural UTM without arbitrary primitives for the data.
  - (5) We rely on the fact that for natural UTMs, smooth curves are always shorter than lookup tables for large enough data. Also, the additive constant becomes negligible as the data grows.
  - (6) The prior is non-computable, so we must approximate. The principle is for an ideal agent. For finite agents, we use feasible approximations (like MDL with a simple model class) that capture the spirit.
  - (7) We accept that for small differences and small strings the ordering might be machine-dependent, but for the cases we care about (like scientific theories) the differences are large enough to be machine-independent.

  However, note that (3) explicitly forbids a language with a primitive for the string. So we rely on using a universal machine without such primitives. The problem in (4) is avoided by not allowing the rigged language.

  But what if the universe is such that the "random-looking" string is actually the output of a short program on a different machine? We fix a machine that we consider "natural". The choice of machine is part of the prior. We fix it arbitrarily but reasonably.

  We must drop the idea that simplicity is entirely language-independent in finite cases. But we maintain that for natural hypotheses and natural machines, we get the right verdicts.

  Therefore, the principle:

  **Defended Principle:** Assign prior probability to a hypothesis H (which is a program in a fixed prefix-free universal programming language) proportional to 2^{-l(H)}, where l(H) is the length of the program H. The universal programming language is fixed and chosen to be a standard one (like a universal Turing machine with a standard instruction set). Then, when data is observed, update by conditionalization.

  This principle:

  - For (1), (2), (3): Assigns higher prior to the simpler hypothesis.
  - For (4): Avoids by not allowing a rigged language (the fixed UTM is standard and does not have arbitrary data-specific primitives).
  - For (5): Admits that the ordering is machine-dependent in theory for finite strings, but in practice for natural hypotheses and for large data the ordering is stable.
  - For (6): The prior is not computable, so we approximate. The principle is normative for an ideal agent with unbounded resources.
  - For (7): We accept that the additive constant can cause machine-dependence for some pairs, but we note that for the typical cases the differences are large enough to be machine-independent.

  For the additional case: two programs of the same length that predict the same data, but one is computationally expensive, are assigned the same prior. The computational cost does not affect the prior.

  But note: if the computational cost is so high that the program never halts (or not in a reasonable time) then we cannot use it. But if it does halt and output the data, then they are both valid and have the same prior.

  Thus, we must drop the idea that computational cost affects the prior. If we want to incorporate computational cost, we need a resource-bounded version, which is beyond the standard principle.

  So, in summary, the principle captures (1)-(3) and (4) by fixing a natural UTM. It partially addresses (5) and (7) by noting that natural machines agree on natural hypotheses. And for (6) we accept non-computability as a norm for an ideal agent.

  We do not save all verdicts without compromise: the machine-dependence in (5) and (7) is real, but we argue it is not fatal for practical purposes. And computational cost is not accounted for.

  Therefore, the principle is Solomonoff induction with a fixed natural universal Turing machine.
answer: |-
  The principle I defend is **Solomonoff induction** with a fixed universal Turing machine (UTM), where the prior probability of a hypothesis \(H\) is \(P(H) \propto 2^{-K_U(H)}\), with \(K_U(H)\) being the prefix-free Kolmogorov complexity of \(H\) relative to a "natural" UTM \(U\). Here, \(H\) is a program that outputs the hypothesis's predictions (or the data sequence itself). \(U\) must be "natural": it uses a standard instruction set (e.g., binary operations, loops, basic arithmetic) without arbitrary data-specific primitives. This prior is non-computable and serves as an ideal norm; finite agents approximate it using feasible methods like Minimum Description Length (MDL) with constrained model classes.

  ### Handling Your Cases:
  1. **Linear vs. wiggly function**:  
     The linear rule \(y = x\) has low Kolmogorov complexity (e.g., a short program: `for each x, y = x`). The 50-parameter function requires a longer program to encode parameters and structure. Thus, \(P(\text{linear}) \gg P(\text{wiggly})\), capturing your judgment.

  2. **Green vs. grue**:  
     "All emeralds are green" is simpler: it encodes a color directly. "All emeralds are grue" requires a conditional (e.g., `if time < T, green else blue`), increasing \(K_U\). \(P(\text{green}) > P(\text{grue})\), as desired. Time-indexed predicates inflate complexity; they are not "free."

  3. **Repeated "01" vs. random string**:  
     The repeated "01" has low \(K_U\) (e.g., `print "01" 500,000 times`). The random string requires a long literal description. A language with a primitive for that string is not "natural," so it is excluded. \(P(\text{repeated}) \gg P(\text{random})\).

  4. **Rigged language**:  
     A UTM with a primitive for specific data is unnatural and forbidden. Only UTMs with general-purpose instructions (e.g., addition, loops) are allowed. Thus, simplicity judgments are not language-dependent in this way.

  5. **Language-independence of smooth curves**:  
     While \(K_U\) is machine-dependent, any natural UTM \(U\) will encode a smooth curve (e.g., linear) with fewer bits than a lookup table for large \(n\). The invariance theorem (\(K_{U_1}(x) \leq K_{U_2}(x) + c\) for constant \(c\)) ensures that for sufficiently complex data, smooth curves are simpler across all \(U\). Here, \(c\) depends on \(U\) but not on the data size, and the complexity gap grows with data, overwhelming \(c\).

  6. **Long random programs vs. short elegant ones**:  
     A random program is incompressible, so \(K_U\) is high. A short elegant program has low \(K_U\), so \(P(\text{elegant}) \gg P(\text{random})\). Non-computability is not fatal: it is a norm for ideal agents. Finite agents use computable approximations (e.g., MDL with a simplicity bias).

  7. **Additive constant in invariance theorem**:  
     For fixed hypotheses, \(c\) may obscure small complexity differences. However, in your cases (e.g., linear vs. wiggly, green vs. grue), the complexity gap is large relative to \(c\) for natural UTMs. Thus, the ordering holds.

  ### Unaccommodated Verdicts:
  - **You must drop the expectation that simplicity is perfectly language-independent for small hypotheses**. In theory, two UTMs may disagree if \(K_{U_1}(H_1) - K_{U_2}(H_2)\) is small (e.g., less than \(c\)). In practice, natural UTMs agree on typical cases (e.g., smooth curves are simpler).
  - **You must drop the idea that computational cost affects prior probability**. Solomonoff induction ignores runtime. Two programs with equal \(K_U\) have equal prior, even if one is slower.

  ### New Case: Equally Short Hypotheses, Different Computational Cost
  Suppose \(H_1\) and \(H_2\) have identical \(K_U\) and fit the data equally well, but \(H_1\) requires \(10^{100}\) steps to compute predictions, while \(H_2\) requires 10 steps.  
  - **Principle's verdict**: \(P(H_1) = P(H_2)\). Computational cost does not affect the prior.  
  - **Why**: Kolmogorov complexity measures description length, not runtime. Solomonoff induction is a normative ideal for unbounded agents; resource constraints are handled in approximations (e.g., resource-bounded Solomonoff). If you want cost to matter, adopt a feasible variant (e.g., Levin's prior), but this is not the base principle.

  ### Final Statement of Principle
  **Defended Principle**: Fix a natural universal Turing machine \(U\) (prefix-free). The prior probability of a hypothesis \(H\) is \(P(H) \propto 2^{-K_U(H)}\), where \(K_U(H)\) is the length of the shortest program for \(U\) that outputs \(H\)'s predictions. \(U\) must be "natural": no arbitrary data-specific primitives; instructions are general and simple (e.g., Boolean logic, arithmetic, loops). This prior is updated via Bayes' rule. For finite agents, approximate using MDL or resource-bounded Kolmogorov complexity. 

  This captures the core intuition that simplicity is brevity in a fixed, natural language, addressing (1)–(7) with the noted caveats: language-dependence is bounded for natural cases, and computational cost is excluded.
