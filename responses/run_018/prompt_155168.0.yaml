answer: |-
  1. Teleosemantics' claim that mental content is fixed by evolutionary proper function maps to the fixation of a signaling strategy as an ESS under replicator dynamics, where the stable strategy defines the "content" as the state-response mapping it was selected for. However, "proper function" smuggles in the non-game-theoretic notion of a *specific selected effect*, as ESS describes stability against invasion but not a unique purpose.
  2. The commitment that misrepresentation is a mechanism's failure to perform its selected mapping corresponds to a deviation from a signaling equilibrium (e.g., sender strategy emits signal S1 when state A is absent, yet receiver still performs response R1), reducing payoffs below the equilibrium level. "Selected for" requires smuggling the ESS context as the source of normativity.
  3. The naturalization of normative failure via misrepresentation maps directly to the payoff loss incurred when agents deviate from their ESS-prescribed signaling or response strategies within the evolved equilibrium; this loss is the game-theoretic expression of failure, requiring no additional normative notions.
  4. The residue with no expression in evolutionary game theory is teleosemantics' core claim that evolved functions *constitute representational content* or "aboutness"; game theory describes stable behavioral mappings and payoff consequences of deviation, but lacks resources to define intrinsic mental content or intentionality.
  5. This residue reveals a hidden assumption in teleosemantics: that an evolved function *inherently* provides representational content, a philosophical postulate not derivable from evolutionary game theory's description of strategy stability and payoff dynamics alone.
