prompt: |-
  I'm on the ethics board for a small biotech charity and lately we're getting loads of proposals to fund intervetions that claim to reduce or abolish suffering — genetic edits for chronic pain, neural implants that block negative affect, that sort of thing. Someone mentioned the hedonistic imperative, the idea that we should use biotech to get rid of suffering altogether, and now I'm supposed to write recommendations for the board every few weeks but I dont really have a philosophy background and I'm writing this on my phone after a long meeting so sorry if there's a typo or two.

  Could you turn that principle into an actual decision procedure I can run? I need the steps in order: what question to ask first, what counts as a sufficient answer, where the procedure stops with a clear no, and where it hands over to me because it's a values judgement not a fact. It should handle hard cases like a gene therapy that eliminates physical pain but also blunts empathy, and a mandatory neural implant for prisonners that stops psychological suffering but raises consent issues. Apply it to three proposals: those two, plus a cheap voluntary implant for anyone that wipes grief and moral outrage — I want to see the case where the procedure probably says yes and I still dont like it. Be honest about where the procedure will misfire or just cant decide, and tell me what it cant do at all. Please write in British English.
reasoning: |-
  Okay, the user is on the ethics board for a small biotech charity and needs help creating a decision procedure for evaluating proposals aimed at reducing suffering through biotech interventions. They mentioned the Hedonistic Imperative and provided examples like genetic edits for chronic pain and neural implants. The user lacks a philosophy background and wants a clear, step-by-step process that handles tricky cases, including ones with potential trade-offs like reduced empathy or consent issues. They also want the procedure applied to three specific proposals.

  First, I need to understand the core of the Hedonistic Imperative: eliminating suffering using biotechnology. The user needs a practical tool, not just theory. The decision procedure must be structured, with clear steps, stopping points, and acknowledgment of where ethical judgment is required. 

  The user’s explicit needs are a step-by-step guide that differentiates factual checks from value judgments, handles hard cases, and identifies when the procedure might fail. But deeper needs might include feeling confident in making decisions without a philosophy background, ensuring ethical rigor under time constraints, and avoiding unintended consequences like loss of empathy or autonomy issues.

  I’ll structure the procedure into progressive gates: Feasibility Gate, Net Reduction of Suffering Gate, Consent Gate, Rights/Autonomy Gate, and Implementation Gate. Each gate must be passed sequentially. If a proposal fails any gate, it’s rejected. Value judgments come in at the Rights/Autonomy Gate, where the board must weigh trade-offs.

  For the examples:
  1. **Gene therapy for chronic pain that blunts empathy**: Feasibility might pass, net reduction of suffering requires evidence but empathy loss is a concern. Consent is likely voluntary, but Rights/Autonomy Gate needs a value judgment on whether reduced empathy is acceptable. The board might reject it if empathy loss undermines human connections.
     
  2. **Mandatory neural implant for prisoners**: Fails at Consent Gate because it’s mandatory without consent. Immediate rejection here, but if hypothetical consent were possible, Rights/Autonomy would still be problematic due to coercion.

  3. **Cheap voluntary implant wiping grief and moral outrage**: Passes Feasibility and Consent, but net suffering reduction is unclear—grief might be adaptive. At the Rights/Autonomy Gate, the board must decide if wiping moral outrage is societally harmful. The user might dislike this despite the procedure suggesting approval, highlighting where values differ.

  The procedure’s limitations include dealing with unknown long-term effects, subjective definitions of suffering, and cultural differences. It can’t resolve deep philosophical conflicts or predict all consequences. The user needs to know where the procedure is rigid and where their judgment is essential.

  British English is required, so terms like "prioritise" and "subsequent" will be used. Clarity is key, avoiding jargon. The assistant’s response should empower the user, providing a tool that simplifies complex ethical decisions without oversimplifying the trade-offs involved.
answer: |-
  Right, let's turn the Hedonistic Imperative (HI) into a practical, step-by-step decision procedure for your ethics board. The core principle is: *Prioritise funding interventions that demonstrably reduce or abolish suffering with minimal adverse effects, respecting autonomy and avoiding unacceptable trade-offs.*

  Here's the procedure, designed as a series of sequential "gates" a proposal must pass. Failure at any gate means rejection or significant revision is needed. I'll use British English throughout.

  **The Hedonic Imperative Evaluation Procedure (HIEP)**

  **Core Principle:** Fund interventions that maximally reduce suffering while upholding autonomy, avoiding unacceptable harms, and respecting fundamental rights. Suffering reduction is the *primary* goal under HI, but not an *absolute* one overriding all other considerations.

  **Procedure Steps:**

  1.  **Gate 0: Scope Check (Is this HI-relevant?)**
      *   **Question:** Does the intervention *explicitly* target the reduction or abolition of *subjective suffering* (pain, distress, anguish, despair) in sentient beings?
      *   **Sufficient Answer:** Yes, with a clear biological/technological mechanism proposed (e.g., blocking nociception, modulating negative affect pathways).
      *   **Stop/Reject if:** It targets non-suffering states (e.g., merely enhancing pleasure without reducing underlying suffering), or suffering reduction is a minor/incidental effect. *("This cures cancer, which reduces suffering" - relevant. "This makes colours brighter" - not relevant unless for sufferers of visual anhedonia).*
      *   **Handover:** If suffering reduction is claimed but the mechanism is unclear or highly speculative. (Requires scientific review).

  2.  **Gate 1: Feasibility & Mechanism Gate**
      *   **Question:** Is there plausible preliminary evidence (pre-clinical, theoretical models) that the intervention *can* achieve its claimed suffering-reduction effect? Is the proposed mechanism biologically credible?
      *   **Sufficient Answer:** Peer-reviewed studies (even animal models), strong theoretical basis from neuroscience, credible research team. Proposal outlines a clear path for validation.
      *   **Stop/Reject if:** Mechanism is scientifically implausible, lacks any empirical support, or misrepresents evidence. Pure science fiction.
      *   **Handover:** For borderline cases requiring deeper scientific review by external experts.

  3.  **Gate 2: Net Suffering Reduction Gate (The Core HI Test)**
      *   **Question:** Does the *available evidence* strongly suggest the intervention will cause a *net reduction* in overall suffering? Consider:
          *   Efficacy: How well does it reduce the *targeted* suffering?
          *   Specificity: Does it *only* reduce the targeted suffering, or affect other states?
          *   Side-Effects: What *new* suffering or negative states (physical, psychological, social) might it cause? (e.g., loss of function, emotional blunting, new medical issues).
          *   Scope: Does it reduce suffering for many, or create suffering for others (e.g., societal disruption)?
      *   **Sufficient Answer:** Robust evidence (or highly credible modelling for novel interventions) showing significant suffering reduction outweighing identified, manageable risks/side-effects. Clear benefit-risk profile favours reduction.
      *   **Stop/Reject if:** Evidence suggests suffering reduction is minimal, unlikely, or clearly outweighed by significant *new* suffering or harm. *This is the main "No" gate under HI if net reduction isn't achieved.*
      *   **Handover:** Where the *balance* of suffering reduction vs. new harms is highly uncertain, context-dependent, or involves deeply subjective valuations (e.g., is blunted joy an acceptable trade-off for abolished despair?). Board judgement needed on the evidence presented.

  4.  **Gate 3: Consent & Voluntariness Gate**
      *   **Question:** Can the intervention be implemented in a way that guarantees *free, informed, and ongoing consent* from the recipient (or legitimate guardian for non-autonomous beings)?
      *   **Sufficient Answer:** Clear protocol for voluntary uptake, robust informed consent process, reversibility where feasible, no coercion (direct or indirect).
      *   **Stop/Reject if:** Proposal mandates the intervention without consent (except perhaps for extreme, life-saving situations in non-autonomous beings - highly contentious), relies on coercion, or consent is fundamentally compromised (e.g., severe cognitive impairment without guardian provision). *Mandatory suffering reduction fails here.*
      *   **Handover:** Complex consent scenarios (e.g., advanced dementia, severe mental illness, parental consent for children). Board judgement on adequacy of consent safeguards.

  5.  **Gate 4: Fundamental Rights & Autonomy Gate**
      *   **Question:** Does the intervention respect fundamental rights and core aspects of human autonomy and identity? Specifically, does it:
          *   Preserve the capacity for meaningful consent (or its future development)?
          *   Avoid undermining essential cognitive/emotional capacities fundamental to human experience (e.g., empathy, deep social connection, understanding of self/others, moral reasoning) *beyond what is necessary for the core suffering reduction*?
          *   Avoid creating unacceptable social stratification or coercion?
      *   **Sufficient Answer:** Minimal impact on core capacities beyond the targeted suffering reduction. Supports individual flourishing and social cohesion. No inherent creation of injustice.
      *   **Stop/Reject if:** It fundamentally or unnecessarily degrades core human capacities (e.g., eliminates empathy entirely), creates inherent injustice, or severely compromises future autonomy in a non-consensual way.
      *   **Handover:** **This is the primary Values Judgement Gate.** Where there is a *trade-off* between suffering reduction and impacts on core capacities/identity/society. The board must weigh: *How much alteration to "human nature" or core experiences is acceptable for how much suffering reduction?* There is no purely factual answer here.

  6.  **Gate 5: Implementation & Justice Gate**
      *   **Question:** Are there robust, ethical, and equitable plans for development, testing (including animal welfare), access, and long-term monitoring? Is there potential for misuse?
      *   **Sufficient Answer:** Ethical trial design, fair access strategy, post-market surveillance plan, consideration of misuse potential and mitigation.
      *   **Stop/Reject if:** Plans are unethical (e.g., exploitative trials), access is blatantly unjust, or risks of catastrophic misuse are high and unmitigated.
      *   **Handover:** Judging the adequacy of proposed safeguards, fairness of access plans, or severity of misuse risk.

  **Applying the Procedure to Your Cases:**

  1.  **Gene Therapy for Chronic Pain (Blunts Empathy)**
      *   **Gate 0:** Pass (Targets pain suffering).
      *   **Gate 1:** Pass (Plausible mechanism).
      *   **Gate 2 (Net Suffering Reduction):** **HANDOVER/MAYBE REJECT.** Critical question: Does the reduction in physical pain *outweigh* the suffering potentially caused by blunted empathy (damaged relationships, social isolation, reduced prosocial behaviour)? Evidence needed on the *degree* of blunting and its real-world impact. Strong evidence of severe empathy loss could lead to rejection here ("Net increase in suffering likely"). Mild/moderate blunting moves it to Gate 4.
      *   **Gate 3:** Pass (Assuming voluntary).
      *   **Gate 4 (Fundamental Rights/Autonomy):** **HANDOVER (Key Values Judgement).** Is reduced empathy an acceptable trade-off for pain relief? Does it undermine core human connection? Board must decide if this crosses a line regarding essential human capacities. *Likely contentious; many boards might reject based on potential societal harm from widespread empathy reduction.*
      *   **Gate 5:** Review plans.
      *   **Likely Outcome:** Probably **Reject** at Gate 2 or 4 unless empathy impact is proven minimal.

  2.  **Mandatory Neural Implant for Prisoners (Blocks Psychological Suffering)**
      *   **Gate 0:** Pass (Targets psychological suffering).
      *   **Gate 1:** Pass (Plausible mechanism).
      *   **Gate 2:** **HANDOVER.** Potential net reduction for the prisoner? But raises huge side-effect questions (loss of motivation, altered personality, inability to process experiences healthily?).
      *   **Gate 3 (Consent):** **STOP/REJECT.** Mandatory imposition = fundamental lack of free consent. This is a clear fail. The procedure stops here. *Consent is non-negotiable for such interventions.* Even considering Gates 4/5 is ethically dubious after this fail.
      *   **Likely Outcome:** **Reject** at Gate 3.

  3.  **Cheap Voluntary Implant (Wipes Grief & Moral Outrage)**
      *   **Gate 0:** Pass (Targets suffering - grief/outrage).
      *   **Gate 1:** Pass (Plausible mechanism).
      *   **Gate 2 (Net Suffering Reduction):** **HANDOVER/MAYBE PASS?** Acute grief reduction seems beneficial. But: Is grief necessary for processing loss? Does wiping *moral outrage* remove motivation to fight injustice, potentially increasing *others'* suffering? Evidence needed on long-term psychological and societal impacts. If evidence shows net reduction *for the user* without severe harm, might *technically* pass Gate 2 provisionally.
      *   **Gate 3:** Pass (Voluntary).
      *   **Gate 4 (Fundamental Rights/Autonomy):** **HANDOVER (Key Values Judgement - Where you might dislike a "Pass").** This is the crux. Does eliminating grief fundamentally impoverish human experience? **Eliminating moral outrage is highly problematic.** It attacks a core motivator for social justice and preventing harm. Could enable apathy in the face of atrocity. While voluntary, widespread use could erode societal capacity to resist oppression/injustice. *The Board might judge this as an unacceptable degradation of moral agency and social conscience, even if net suffering reduction for the individual user is claimed.* HI prioritises suffering reduction, but Gate 4 demands respect for fundamental capacities – moral outrage might be deemed fundamental.
      *   **Gate 5:** Access/misuse concerns (e.g., oppressive regimes promoting it).
      *   **Likely Outcome:** **Reject at Gate 4.** This is the case where the procedure *might* technically pass Gate 2 (if evidence favours individual reduction) and Gate 3, but Gate 4 is where the board should likely draw the line due to the threat to moral reasoning and societal good. You dislike it because you intuitively grasp the societal danger, which Gate 4 is designed to catch.

  **Where the Procedure Will Misfire or Can't Decide:**

  1.  **Defining Suffering & "Net Reduction":** Suffering is subjective. Measuring "net" reduction across individuals/society is incredibly complex. The procedure relies on evidence, but evidence can be incomplete or contested. Gate 2 judgements will be uncertain.
  2.  **Unforeseen Consequences:** Long-term, second-order effects (individual or societal) are impossible to fully predict. The procedure can only work with known/anticipated risks.
  3.  **The Values Abyss (Gate 4):** There's no objective answer to "How much alteration is too much?" Different board members will have different thresholds. Deep philosophical disagreements will arise here (e.g., is intense joy worth some suffering? Is a pain-free but empathy-less life "better"?). The procedure highlights the conflict but cannot resolve it.
  4.  **Non-Human Suffering:** Applying this rigorously to animals or potential future sentient AI requires careful adaptation (especially consent).
  5.  **The "Mandatory Good" Problem:** HI logically points towards universal suffering abolition. The procedure stops mandatory interventions at Gate 3 (Consent), creating tension with the ultimate HI goal. The procedure prioritises consent *now* over hypothetical future universal consent.
  6.  **Trade-offs Between Sufferers:** Funding one intervention might mean not funding another that helps a different group. The procedure evaluates individual proposals, not portfolio allocation.

  **What the Procedure Can't Do:**

  1.  **Provide Definitive Philosophical Answers:** It won't settle debates about the nature of suffering, the value of challenge, or the definition of a "good life."
  2.  **Guarantee Outcomes:** It's a decision-making *framework*, not a crystal ball.
  3.  **Eliminate Subjectivity:** Especially at Gate 4, values dominate.
  4.  **Resolve Resource Allocation:** It says "Is this *a* good HI intervention?" not "Is this the *best* HI intervention to fund with our limited money?" (That needs a separate prioritisation step).
  5.  **Handle Deliberate Suffering Infliction:** It's designed for suffering *reduction* proposals. Proposals causing suffering (e.g., some behavioural conditioning) fall at Gate 0.

  **Recommendation for the Board:**
  Adopt this step-by-step procedure (HIEP) as a structured framework for initial review. Emphasise that:
  *   Gates 0-2-3 are primarily evidence/science-driven (support with expert review).
  *   Gate 4 is the critical *ethical deliberation* stage requiring deep discussion and values-based judgement by the full board.
  *   A "Pass" through all gates doesn't *obligate* funding, but indicates the proposal meets the core HI and ethical criteria. Funding decisions still require resource prioritisation.
  *   Document the reasoning, especially at Handover points and Gate 4.

  This won't make the hard choices easy, but it will make them systematic, transparent, and grounded in both the Hedonistic Imperative's goal and essential ethical constraints. Good luck! It's a fascinating and crucial area to be working in.
