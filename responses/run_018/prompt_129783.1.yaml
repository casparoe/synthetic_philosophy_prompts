answer: |-
  ## Sonnet on the Unreal, Yet True

  When billiard balls rebound in friction's spite
  (A vacuum's thought, no clinging force confessed),
  The pressure's dance appears in measured light
  Though bonds and drag in truth arrest their zest.
  No molecule attracts its fleeting mate
  (All lonely paths through empty space are drawn),
  Yet temperature's ascent we calculate
  As if each trace obeyed attraction's dawn.
  No spinning charge nor quantum leap occurs
  Within these perfect spheres of simple mass,
  Still, volumes shrink when winter's pallor stirs
  As bound by laws their falseness comes to pass.

  Yet measure holds though all these tales are lies;
  Predictions stand beneath inquiring eyes.
  The model's worth resides not in its face
  But in the numbers born of its embrace.

  **Commentary:** While the sonnet faithfully renders Friedman's core instrumentalist claim—that predictive success justifies unrealistic assumptions—it necessarily simplifies his position by omitting his nuanced (if controversial) stance on explanation. Friedman argued that a model offering accurate predictions *does* explain phenomena *because* it identifies reliable patterns for forecasting ("as if" explanations), distinct from providing a literally true causal mechanism. The poem focuses solely on predictive accuracy, potentially suggesting Friedman dismissed explanatory power entirely, which he did not; he redefined it pragmatically. For poetic concision, this elision is acceptable. The constraints of the sonnet form demand focus, and the core "F-twist" (that unrealistic assumptions *cannot* invalidate a predictively successful model) is captured accurately. The couplet explicitly frames the aim as predictive success over descriptive fidelity, avoiding sloganism. A philosopher of science would recognize the specific argument, even if the subtle distinction between predictive and explanatory success (as Friedman conceived it) is compressed for artistic necessity. The simplification doesn't *distort* his view on the validity of unrealistic assumptions for prediction, but it does leave his associated view of explanation implicit, a reasonable trade-off for the form.
