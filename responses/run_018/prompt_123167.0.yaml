answer: |-
  This is a keenly observed argumentative pattern that has indeed become pervasive in debates around computational planning mechanisms. While no single established term has fully crystallised in the literature, the configuration can be precisely defined and demarcated. I propose the label **"Dynamic Scope Oscillation" (DSO)**. Below is the conceptual carving you requested, grounded in the socialist calculation debate and its methodological foundations.

  ### Core Definition of Dynamic Scope Oscillation (DSO)
  **DSO** occurs when an advocate *alternates rhetorically* between two distinct claims about a formal mechanism (e.g., Lange’s auctioneer, algorithmic planning):
  1.  **The Narrow Claim (Static Domain):** The mechanism reliably converges to an efficient allocation *under stable conditions* (fixed preferences, technology, resources).
  2.  **The Broad Claim (Dynamic Domain):** The same mechanism *inherently accommodates or resolves* economic dynamics (innovation, preference shifts, entrepreneurship).

  The oscillation creates "rhetorical immunity" by exploiting:
  -   The *credibility* of the narrow claim’s formal proof when facing dynamic objections.
  -   The *modesty* of the narrow claim’s scope when facing static knowledge objections.

  ### Necessary Conditions for DSO
  1.  **Shared Formal Apparatus:** The mechanism’s mathematical framework (e.g., iterative price adjustment, gradient descent) must be identical in both claims. This allows the formalism itself to act as a bridge, implying continuity where none is justified.
  2.  **Epistemic Retreat-and-Advance:** The proponent must sincerely retreat to the narrow claim under critical pressure on dynamics, then implicitly or explicitly reassert the broad claim once criticism subsides.
  3.  **Functional Ambiguity:** The mechanism's *purpose* oscillates between being a static allocative tool and a dynamic discovery process.

  ### Boundary Mapping & Distinctions
  | **Concept**              | **Distinction from DSO**                                                                                               | **Boundary Case**                                                                                             |
  | :----------------------- | :--------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------ |
  | **Motte-and-Bailey**     | M&B relies on a defensible core (motte) and an indefensible extension (bailey). DSO involves *two contested but plausible claims* sharing formalism. | If the dynamic claim were purely metaphorical (indefensible), it would collapse into M&B. DSO requires both claims to be substantive. |
  | **Equivocation**         | Equivocation hinges on ambiguous *terms*. DSO hinges on ambiguous *scope of application* of a consistent formalism.   | If "equilibrium prices" meant different things statically/dynamically, it would be equivocation. In DSO, the term is consistent; its *domain* shifts. |
  | **Scope Ambiguity**      | Scope ambiguity is unintentional vagueness. DSO is a *strategic oscillation* between two clearly defined (but incompatible) scopes. | A modeler carelessly underspecifying scope might cause ambiguity. DSO requires intentional retreat/advance. |
  | **Defensive Qualification** | Defensive qualification is a permanent retreat. DSO is defined by *temporary* retreat followed by reversion to the broad claim. | If the proponent abandoned the dynamic claim permanently after criticism, it would be mere qualification.       |
  | **Popperian Retreat**    | Popper discussed retreating to avoid falsification. DSO retreats not from falsification, but to *borrow the credibility of a static proof* for dynamic claims. | If the static model itself were falsified and retreated from, it would be Popperian. DSO retreats to preserve static credibility. |

  ### Illustrative Boundary Cases
  -   **Not DSO:** A theorist argues Lange’s model handles dynamics *only* by explicitly adding a separate "innovation module" alongside the price iteration. (No shared formalism for dynamics; no oscillation).
  -   **Grey Area:** Claiming the mechanism "can *inform* dynamic adaptation" without asserting it *performs* adaptation. (Oscillation risk remains if "inform" implicitly expands to "resolve").
  -   **Pure DSO:** Using proofs of convergence under convexity/fixed parameters to assert the algorithm "discovers new production frontiers" when parameters are endogenous and non-convex.

  ### Why "Oscillation" Matters
  The term captures the *rhythmic, systemic* nature of the shift. Unlike one-off overreach, DSO is a sustained dialectic where:
  -   The static proof acts as an *anchor* (providing technical legitimacy).
  -   The dynamic ambition acts as the *horizon* (providing practical relevance).
  The formalism’s persistence across both domains enables the illusion of a unified solution, obscuring Hayek’s core insight: *the problem of dispersed knowledge transforms fundamentally under dynamism*.

  In essence, DSO exploits the **methodological seduction of formalism**: the understandable desire to extend elegant mathematical solutions beyond their empirically or theoretically warranted domain. It remains endemic in debates where "planning" is reduced to computational optimization, neglecting institutional epistemology. Your identification of its "rhetorical immunity" property is precisely why it warrants this distinct conceptualisation.
