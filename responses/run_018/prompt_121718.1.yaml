answer: |-
  Here’s your reusable 15-minute procedure, baked into plain prose. Run it sequentially — if an argument fails any gate, stop. If it clears all three, treat it as legitimate disagreement unless flagged for editor review.  

  **Gate 1: Structural Coherence**  
  Does the argument’s conclusion follow logically from its premises? Check for hidden equivocation (e.g., using "fairness" to mean economic efficiency in one context but ethical burden-sharing in another). Passing requires premises to connect to the conclusion without conceptual sleight-of-hand. If the logic is circular, or the conclusion smuggles in new assumptions, it fails. Stop here: bad faith likely. Misfires when specialized jargon masks valid reasoning (e.g., technical climate models using "cost" differently than colloquial speech).  

  **Gate 2: Evidential Reciprocity**  
  Does the speaker apply their own evidentiary standards consistently when evaluating others? Passing requires they accept the same burden of proof, uncertainty thresholds, or data-quality demands they impose on opponents. If they dismiss inconvenient evidence using criteria they’d reject if applied to their own claims, fail. Stop here: hypocrisy suggests tactical mudslinging. Misfires when fields legitimately demand different standards (e.g., epidemiology vs. economics) — but the burden is on the speaker to justify why.  

  **Gate 3: Reversal Check**  
  Swap the conclusion for one the speaker opposes while keeping their premises intact. Would their own logic force them to accept the new conclusion? If yes, pass; if not, fail. Example: If premises support Policy A (which they like), but identically support Policy B (which they hate), their reasoning is inconsistent. Stop here: ideology over logic. Misfires when values legitimately alter outcomes (e.g., "autonomy" outweighing "public benefit" in seatbelts vs. vaccines due to bodily intrusion differences — but that’s an editor call).  

  **Editor Handoff Points**  
  - If Gates 1-2 pass but Gate 3 fails due to unstated value judgments (e.g., "individual liberty trumps collective safety in medical contexts but not transportation"), escalate. The procedure can’t resolve foundational value conflicts.  
  - If an argument passes all gates but still feels "off," trust your instinct — but flag it for editor review. The tool can’t catch performative malice disguised as logic.  

  ---  

  **Applied Cases**  

  **Climate Researcher**  
  *Claim: Uses economic model to argue carbon pricing is "unfair" for climate policy but "efficient" for funding healthcare.*  
  - **Gate 1:** Passes if "unfair" strictly means "disproportionate industry burden" in climate context, not equivocation.  
  - **Gate 2:** Fails if they demand healthcare proposals use the same inequality-impact metrics they dismiss for carbon pricing. If they accept looser equity analysis for healthcare while rejecting it for climate, reciprocity violated. **Stop: bad faith.**  

  **Biotech Lobbyist**  
  *Claim: Dismisses gene-drive ecological risks citing "insufficient evidence" but ignored identical uncertainty thresholds when promoting GM crops.*  
  - **Gate 1:** Passes if risk frameworks are structurally sound (e.g., both use probabilistic models).  
  - **Gate 2:** Fails if they previously demanded less evidence for GM crops ("substantial equivalence" arguments) than they now demand for gene drives. Inconsistent standard application. **Stop: bad faith.**  

  **Science Writer on Vaccine Mandates**  
  *Claim: Opposes mandates as "bodily autonomy violations" after supporting seatbelt laws using identical "public benefit overrides choice" logic.*  
  - **Gate 1:** Passes — autonomy vs. public benefit logic is coherent in both cases.  
  - **Gate 2:** Passes if they consistently apply "public harm reduction justifies mandates" to both.  
  - **Gate 3:** Swap conclusions: If their seatbelt logic ("minor inconvenience saves lives") applies to vaccines, they must accept mandates. If they reject this, reversal fails. **But** — here’s where it annoys you: If they argue seatbelts lack "bodily intrusion" or "medical sovereignty" dimensions, that’s a *value judgment* about bodily integrity. Gate 3 misfires; escalation needed. The procedure can’t settle whether needles vs. seatbelts constitute a morally relevant difference. **Editor call: values conflict, not bad faith.**  

  **Limitations**  
  This won’t catch bad actors using sound logic tactically. It can’t adjudicate disputes where both sides pass all gates (rare). And it’s useless against pure emotion — but you’d spot that pre-audit. File fast.
