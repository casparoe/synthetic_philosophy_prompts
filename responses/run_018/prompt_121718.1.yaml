  Structurally, they want three sequential filters: structural coherence (pure logic test), evidential reciprocity (standards consistency), reversal check (position-swap stress test). Each gate needs explicit pass/fail thresholds plus misfire warnings. The editor handoff clause is crucial - this journo knows some battles aren't theirs to fight. 

  For implementation: must resist academic jargon. This isn't a philosophy seminar; it's a deadline-blitzed newsroom tool. The examples should mirror their beat - climate policy, biotech, public health mandates. That vaccine case will sting because autonomy arguments feel different emotionally even when logically identical. Have to flag that emotional valence as the procedure's blind spot. 

  Biggest challenge? Making reciprocity tangible. Not just "are standards consistent?" but "would they accept their own threshold if it harmed their position?" Like the biotech lobbyist case - uncertainty thresholds weaponized situationally. Also must emphasize that reversal isn't about proving hypocrisy; it's about exposing fragile logic. 

