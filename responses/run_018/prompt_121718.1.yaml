prompt: |-
  hey, i cover science and politics for a magazine and lately i keep getting stuck on whether people on the other side of a polarised debate are arguing in good faith or just throwing mud. i need a reusable procedue — not a one-off judgement — that i can run in about fifteen minutes before filing, to decide if an opposing view counts as a legitimate disagreement or as bad-faith rhetoric.

  i want you to turn the idea of reciprocal epistemic auditing into an actual checklist in words. the principle is that good-faith argument has to survive three gates in order: structural coherence (premises actually reach the conclusion without hidden equivocation), evidential reciprocity (the speaker holds others to the same standrads they accept for themselves), and the reversal check (swap the conclusion for one they reject and see if their premises still stand). tell me exactly what counts as passing each gate, where the procedue stops with a clear no, and where it must hand the call to my editor because it's values, not facts. flag the points where it will misfire.

  then apply it to three cases: a climate researcher backing carbon pricing for healthcare but calling it unfair for climate policy using the same economic model; a biotech lobbyist dismissing gene-drive risks with uncertainty thresholds he ignored when pushing GM crops; and a well-known science writer opposing vaccine mandates on autonomy grounds despite having defended mandatory seatbelt laws with identical logic. include the one where the answer will annoy me — likely the third — and say what the procedue simply can't settle.

  write it all as continuous prose, no headings, no bullet points, no bold text, just like a long email. don't give me citations or a reading list — i haven't got web access in the newsroom and my editor won't wait. there's probably a typo or two in this message; don't correct them, just answer the prompt.
