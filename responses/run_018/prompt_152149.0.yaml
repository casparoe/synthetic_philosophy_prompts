answer: |-
  ### Diagnosis (398 words)  
  The core conflict isn’t about data but about **defining consciousness** through incompatible lenses. Three concepts are conflated:  
  - **Functional integration** (unity as seamless behavioral coordination): Proponents cite cross-cuing (e.g., left hemisphere guessing right hemisphere’s knowledge via contextual clues) as evidence of a single adaptive system. The left’s confabulation—fabricating explanations for right-hemisphere actions—is dismissed as noise in an integrated whole.  
  - **Narrative coherence** (unity as self-story): Here, the left hemisphere’s "interpreter" dominates. Confabulation isn’t noise but proof of disunity: the left spins tales *because* it lacks access to the right’s true motives. Cross-cuing is seen as inter-agent negotiation, not integration.  
  - **Representational custody** (your "epistemic access"): This exposes the stalemate. When the right hemisphere points to a snow scene the left denies seeing, custody is split: one hemisphere "owns" the percept but can’t report it; the other reports but lacks custody. Functionalists ignore this asymmetry; coherence theorists treat it as narrative conflict. Neither explains *why* custody gaps don’t collapse unity.  

  The fight is verbal *and* substantive:  
  - **Verbal**: "Unity" means behavioral harmony to some, subjective continuity to others.  
  - **Substantive**: Even if defined, philosophers disagree on whether custody gaps *matter* for consciousness. If unity requires integrated access, split brains fail; if it requires adaptive output, they pass.  

  ### The Hidden Machinery (198 words)  
  Beneath the rhetoric lies an untested empirical hinge: **What level of interhemispheric communication preserves "one mind"?**  
  - We know *anatomical* links are severed, but we infer functional isolation from behavioral tasks (e.g., right hand can’t name left field objects). Yet subcortical or wave-synchronized info might still leak, creating partial integration. No experiment has quantified:  
    - The *threshold* of signal exchange needed for unity.  
    - Whether non-reportable integration exists (e.g., shared affective states without cross-cuing).  
  - Formally, we lack models of how custody gaps scale: Is a split brain like two people sharing senses (disunity) or one person with compartmentalized knowledge (unity)? Current frameworks don’t distinguish these dynamics.  

  ### Could It End? (148 words)  
  Progress requires:  
  1. **Empirical rupture**: Design tasks probing non-verbal, non-cued integration (e.g., simultaneous emotional priming across hemispheres). If both hemispheres react identically to unseen threats via amygdala, unity gains ground. If responses are independent, disunity does.  
  2. **Conceptual divorce**: Formalize "custody," "integration," and "coherence" as orthogonal axes. A system could score high on integration (cross-cuing) but low on custody (access asymmetry). This forces camps to specify which axis defines consciousness.  
  Without this, intuition rules: Functionalists will dismiss custody gaps; coherence theorists will weaponize confabulation.  

  ### Bottom Line (48 words)  
  Stall is likely permanent without invasive new methods to detect latent integration or a formal model forcing consensus on custody. Your triad—integration, narrative, custody—is the real battleground. Until custody is centered, debates recycle old data through unmoved priors.
