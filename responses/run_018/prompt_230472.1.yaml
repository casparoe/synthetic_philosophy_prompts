  ### Classroom Activity: The Fairness Dilemma Challenge  
  **Objective:** Students experience the tension between calibration and error rate equality in algorithmic decision-making when base rates differ.  

  **Scenario:**  
  You are a hiring committee for "TechGiant." Applicants belong to one of two groups (Group A/Group B). Each has a "skill score" (1-5) predicting job success. You must approve (hire) or reject applicants using a **single threshold** for both groups.  

  **Materials:**  
  - 40 playing cards (20 red/Group A, 20 black/Group B).  
  - Marker to label cards.  
  - Whiteboard for recording outcomes.  

  **Setup (Pre-Class):**  
  1. **Label cards:**  
     - **Front:** Group (A/B) + Skill Score (1-5).  
     - **Back:** Actual outcome ("✅" for succeed, "❌" for fail).  
  2. **Assign outcomes (mimic base rate differences):**  
     - Group A (High base rate): 15/20 succeed (75%). Distribute scores:  
       - Score 1: 1❌ | Score 2: 2✅, 1❌ | Score 3: 3✅, 1❌ | Score 4: 4✅ | Score 5: 4✅  
     - Group B (Low base rate): 10/20 succeed (50%). Distribute scores:  
       - Score 1: 2❌ | Score 2: 1✅, 2❌ | Score 3: 2✅, 2❌ | Score 4: 3✅, 1❌ | Score 5: 2✅  
     *(This ensures scores are calibrated: e.g., Score 4 succeeds 80% of the time in BOTH groups.)*  

  **Rules:**  
  1. Split students into teams (4-5 per team). Each gets 40 cards.  
  2. **Task:** Choose one threshold (e.g., "Approve if score ≥ 3") for **both groups**.  
  3. **Fairness Goals (write on board):**  
     - *Condition 1:* "Scores mean the same in both groups." (Verify by revealing outcomes per score.)  
     - *Condition 2:* "Equal false rejection rates (FRR) and false approval rates (FAR)":  
       - FRR = (Rejected applicants who would succeed) / (All who would succeed)  
       - FAR = (Approved applicants who fail) / (All who would fail)  
  4. Teams compute FRR/FAR for both groups after applying their threshold.  
  5. **Challenge:** Find a threshold satisfying both conditions.  

  **Predicted Student Strategies & Interventions:**  
  - ✋ **Group uses different thresholds:**  
    *Intervention:* "TechGiant policy requires identical thresholds for all groups. Try again with one threshold."  
  - ✋ **Group declares it impossible:**  
    *Intervention:* "What thresholds did you test? Record FRR/FAR for each and compare."  
  - ✋ **Group ignores calibration:**  
    *Intervention:* "Check Condition 1: For Score 4 applicants, does the success rate match in Group A and B?"  

  **Debrief Script:**  
  *(After 20 minutes of group work, reconvene. Record results from each team on the board.)*  

  **Step 1: Map Game Outcomes to Fairness Concepts**  
  > "Let’s analyze your results. When you set the threshold to **4**:  
  > - **Calibration (Condition 1):** For Score 4 applicants, 80% succeeded in *both* groups. ✅  
  > - **Error Rates (Condition 2):**  
  >   - Group A: FRR = 2/15 (13%), FAR = 0/5 (0%)  
  >   - Group B: FRR = 3/10 (30%), FAR = 1/10 (10%)  
  >   *FRR and FAR are unequal!* ❌  
  > 
  > Why? Group B has fewer high scorers (base rate: 50% vs 75%). To equalize FRR, you’d need to *lower the threshold for Group B*—but that violates Condition 1. To equalize FAR, you’d need to *raise the threshold for Group B*—worsening FRR!  

  **Step 2: Where You Could Have Resisted—and the Cost**  
  > - **Resisting calibration:** "What if we ignore Condition 1? Let’s assume Score 4 in Group B predicts success only 60% of the time."  
  >   *Cost:* Scores become meaningless. Hiring loses reliability.  
  >  
  > - **Resisting error rate equality:** "What if we accept higher FRR for Group B?"  
  >   *Cost:* Unfair disadvantage for qualified Group B applicants.  
  >  
  > - **Resisting the single threshold:** "What if we use threshold=3 for Group A and 2 for Group B?"  
  >   *Cost:* Explicit discrimination; violates "same rule for all."  

  **Step 3: Formalize the Tradeoff**  
  > - **Base rate difference:** Group A has more high scorers (skewed distribution).  
  > - **Impossibility:** With different base rates:  
  >   - Calibration + Single threshold → **Cannot** have equal FRR **and** FAR.  
  >   - Equal FRR + Equal FAR → **Cannot** have calibration *unless base rates are equal*.  
  > - **Key insight:** You can achieve *one* fairness condition, but not both. Society must choose.  

  **Limitations of the Game (Discuss in Debrief):**  
  > - **Real-world complexity:** This game assumes scores are *perfectly calibrated*. In reality, historical bias in training data often breaks calibration (e.g., Group B’s scores underpredict success).  
  > - **What we abstracted away:**  
  >   1. **Feedback loops:** Denying opportunities to Group B entrenches data gaps.  
  >   2. **Intersectionality:** Groups aren’t binary (e.g., race + gender).  
  >   3. **Power dynamics:** Who sets the threshold? Who bears the cost of errors?  

  **Why This Works:**  
  - Students *feel* the tradeoff by manipulating physical cards.  
  - The debrief links their frustration to formal concepts without jargon.  
  - Limitations discussion contextualizes the result within real-world power structures.  

  **Pro Tip:**  
  End with, "This isn’t just math—it’s an ethical choice. Tomorrow, we’ll discuss *which* fairness criterion to prioritize in different contexts."
