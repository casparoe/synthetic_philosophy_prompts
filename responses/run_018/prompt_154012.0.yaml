prompt: |-
  I'm preparing interview questions for a philosophy podcast episode with a researcher who defends a revisionist reading of the Knobe effect. She argues that the standard harm/help asymmetry in judgments of intentional action is not driven by moral evaluation per se, but by what she terms "normative contamination"—a specific interaction between norm-violation detection and whether the side-effect figures in the agent's plan as a means rather than as a mere byproduct. She claims that conventional vignettes confound these dimensions because they always present the harmful outcome as a foreseen but unintended byproduct; she predicts that if the harmful outcome were redesigned as a necessary means to the agent's stated end, while the beneficial counterpart remained a byproduct, the asymmetry would reverse rather than merely weaken.

  Draft eight to ten questions that go beyond asking her to restate the view. I want an opening question that forces her to specify the mechanism by which means-status interacts with norm-violation detection, with a follow-up pressing whether the interaction is multiplicative or threshold-based. Include a question about the control conditions required to isolate this effect from generic affective priming or salience asymmetries, keyed to her most likely reply that matched-valence vignettes already control for affect. Add at least one question on how her account handles the original Knobe vignettes where both harm and help are byproducts—does she deny the asymmetry exists there, explain it away, or treat it as a separate phenomenon? Include a follow-up anticipating her defense of a modular moral-psychology architecture, asking whether that modularity distinguishes her view from standard moral-evaluation accounts or collapses her "normative contamination" into them. End with a closing question about what specific experimental result—perhaps a null reversal, or a reversal that tracks means-status regardless of moral valence—would genuinely disconfirm her thesis rather than prompting only a parameter adjustment. Keep the sequence tight and suitable for a 45-minute interview.
reasoning: |-
  Okay, the user is preparing for a philosophy podcast interview with a researcher who has a revisionist take on the Knobe effect. The key here is to craft questions that dig deep into her theory without letting her just rehash it. The main challenge is designing questions that push her on the mechanics of "normative contamination" and how it differs from standard explanations.

  First, I need to unpack her core argument: she claims the asymmetry isn't about moral evaluation but "normative contamination"—specifically how norm-violation detection interacts with whether the side-effect is a means versus a byproduct. The user wants questions that force her to specify the mechanism behind this interaction. The initial question should make her explain how means-status affects norm-violation detection. A good follow-up would press on whether this interaction is multiplicative (factors amplifying each other) or threshold-based (one factor needing to meet a minimum before the other kicks in).

  The user also wants a question about control conditions. Her likely rebuttal is that matched-valence vignettes already account for affect, so the question needs to challenge how those controls isolate "normative contamination" from other factors like salience. Maybe asking what additional controls would rule out alternative explanations.

  Another critical point: how she handles the original Knobe cases where both outcomes are byproducts. Does she deny the asymmetry exists there? Explain it away? Or treat it as separate? This needs a follow-up on modularity—whether her proposed architecture makes "normative contamination" distinct from moral evaluation or just repackages it.

  Finally, the disconfirmation question: what result would falsify her thesis beyond parameter tweaking? The user mentioned a null reversal or a reversal independent of moral valence. This should force her to define clear boundaries for her theory.

  The sequence must be tight for 45 minutes. Opening with mechanism, then controls, original cases/modularity, ending with falsifiability. Avoid overlap, ensure each question builds on the last. Anticipate her defenses to preempt vague answers. For example, if she claims vignettes control for affect, press on why salience asymmetries aren't sufficient to explain results.

  Also, subtle traps: asking whether normative contamination is a subtype of moral evaluation could reveal if her modularity claim holds water. If she says it's distinct, demand what empirical evidence separates them beyond redescribing the same phenomenon.

  Need to ensure questions don't just revisit her paper but force new clarifications. For instance, asking how quickly the interaction happens cognitively might expose if it's truly a different mechanism. And the falsifiability question must specify an outcome she couldn't explain away—like a reversal when harm is a means but morally neutral.
answer: |-
  Here's a tight sequence of 9 questions designed to probe deeply into the revisionist account, anticipate defenses, and test its boundaries, suitable for a 45-minute podcast:

  1.  **Opening Mechanism Question:** "You argue that 'normative contamination' drives the intentionality asymmetry – specifically, the *interaction* between detecting a norm violation and the side-effect being a *means* rather than a *byproduct*. Walk us through the cognitive mechanism: *how* does the agent recognizing something as a necessary *means* specifically amplify or trigger the detection of norm violation in a way that impacts intentionality judgments, compared to when it's just a foreseen byproduct?" (Forces specification of the causal link)

  2.  **Interaction Structure Follow-Up:** "Is this interaction you propose best understood as *multiplicative* (where means-status multiplies the 'weight' of the norm violation signal) or *threshold-based* (where means-status must be present for norm-violation detection to *register* for intentionality, or vice versa)? What evidence points to one structure over the other?" (Pushes for mechanistic precision)

  3.  **Control Conditions & Affective Priming:** "Critics might argue your findings could be explained by generic affective priming or outcome salience asymmetries – harm simply grabs attention or triggers negative affect more easily than help. You likely counter that your matched-valence vignettes (e.g., harming/harming or helping/helping different norms) control for this. But *how* do those designs specifically rule out the possibility that it's the *salience* or *affective potency* of the *particular norm violation itself* (environmental harm vs. profit loss), rather than its interaction with means-status, that drives your results?" (Challenges the adequacy of her preferred controls)

  4.  **Original Knobe Cases - Existence & Explanation:** "Your account focuses on cases where the *harm* is redesigned as a *means*. But the original Knobe effect shows asymmetry even when *both* harm *and* help are presented as mere foreseen *byproducts*. How does your theory of 'normative contamination' handle these original cases? Do you: a) deny the asymmetry exists there under strict conditions? b) explain it away as an artifact or misdescription? c) treat it as a *separate phenomenon* driven by moral evaluation? Or d) subsume it under normative contamination via a different route?" (Confronts the core phenomenon her theory seeks to revise)

  5.  **Modularity vs. Moral Evaluation:** "You propose a modular cognitive architecture where 'normative contamination' is distinct from moral evaluation. But doesn't detecting a norm violation inherently involve a *proto-moral* evaluation ('this is wrong/bad')? If this detection is central to your mechanism, doesn't this risk collapsing 'normative contamination' back into being a *specific type* or *sub-process* of moral evaluation, rather than a truly distinct mechanism? What *empirical signature* definitively separates them?" (Directly challenges the claimed distinction from moral-eval accounts)

  6.  **Cognitive Implementation:** "Zooming in on the cognitive architecture: Is 'normative contamination' a fast, automatic process occurring during initial action representation, or a slower, more deliberative adjustment? Does your account predict reaction time differences or susceptibility to cognitive load manipulations between means-harm and byproduct-harm judgments?" (Tests the psychological reality and nature of the proposed mechanism)

  7.  **Scope & Generality:** "Your theory centers on norm-violation detection. Does 'normative contamination' apply *only* to *moral* norms, or could it also explain asymmetries involving purely *conventional* or *prudential* norm violations (e.g., breaking a club rule, ignoring a safety procedure) when combined with means-status? What experiment would test this broader scope?" (Explores the boundaries of "normative" in her theory)

  8.  **Predictive Power & Novel Findings:** "Beyond reversing the asymmetry under your specific conditions, what's the most *novel* or *counterintuitive* prediction your account makes that differs from standard moral evaluation or alternative accounts (like the trade-off explanation)? What experiment demonstrates this unique predictive power?" (Forces articulation of new empirical contributions)

  9.  **Falsifiability - The Crucial Disconfirmation:** "Finally, to pin down the core commitment: Imagine your redesigned experiment where harm is a *means* and help is a *byproduct*. What specific result would constitute a *genuine disconfirmation* of your 'normative contamination' thesis, rather than just prompting an adjustment to auxiliary assumptions? For instance: a) A *null* result (no reversal, just symmetry)? b) The asymmetry *persisting* but weakened? Or crucially, c) A *reversal* occurring robustly *regardless of means-status*, but *only* when the outcome is morally negative? What result would make you seriously reconsider the core mechanism?" (Demands clear falsifiability criteria focusing on the means-status x norm-violation interaction)

  **Sequence Rationale:**
  1.  **Starts Core:** Immediately dives into the heart of her novel mechanism (Q1 & Q2).
  2.  **Challenges Controls:** Addresses a key methodological counter-argument (Q3).
  3.  **Confronts Original Data:** Forces her to deal with the foundational Knobe cases her theory seeks to revise (Q4).
  4.  **Tests Key Distinction:** Directly probes the claimed separation from moral evaluation (Q5).
  5.  **Deepens Mechanism:** Explores cognitive implementation (Q6) and scope (Q7).
  6.  **Seeks Novel Predictions:** Moves beyond replication/reversal to unique implications (Q8).
  7.  **Ends with Falsifiability:** Culminates with the critical test of the core thesis (Q9), focusing on the necessity of the means-status interaction for the predicted reversal pattern.

  This sequence avoids redundancy, builds logically, anticipates likely responses and counter-arguments, and rigorously tests the specificity, distinctiveness, and falsifiability of the revisionist account.
