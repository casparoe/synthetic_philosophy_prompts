    "group_size": "8 players (each owns 1 section of a shared gallery wall)",
    "duration_minutes": 45,
    "core_mechanic": "Players must unanimously agree to use a shared art space for a $10/person mural; each can veto to use their section solo for a secret value, incentivizing holdouts and side deals.",
    "debrief_mapping": "Veto power = fragmented exclusion rights; failed mural = resource underuse; side payments = transaction costs; solo use values = opportunity costs of collective action.",
    "predicted_mess_up": "Players overlook side payments; fix: facilitator reminder at 10-min mark.",
    "missing_piece": "Real-world anticommons involve dispersed owners with no negotiation access; this game compresses transaction costs."
  }
  ```
