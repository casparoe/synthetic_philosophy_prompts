answer: |-
  Here's a conceptual audit of the "frog in boiling water" analogy for democratic backsliding, breaking down its elements, weaknesses, and a sharper alternative framing:

  **Analogy Correspondence:**
  - **The Frog:** The citizenry (or democratic resilience mechanisms).
  - **The Water:** The democratic system/norms/institutions.
  - **The Heat Source:** Anti-democratic actors (e.g., illiberal leaders, ruling parties).
  - **Gradual Heating:** Incremental erosion (court packing, election rule tweaks, media capture).
  - **Jumping Reflex:** Collective democratic defense (mass protests, electoral backlash, judicial pushback).
  - **The Pot:** The constitutional/legal framework itself.
  - **Boiling Point:** Irreversible authoritarian consolidation.

  **Where the Analogy Breaks Down:**
  1. **False Passivity of the Frog:**  
     Citizens *aren't* passive amphibians. Backsliding triggers resistance (e.g., Polish protests over abortion/judicial reforms, US litigation over gerrymandering). The analogy obscures **agency**—voters *do* react, but pro-democracy forces may be outmaneuvered, fragmented, or suppressed incrementally.

  2. **Misleading "Reflex" Threshold:**  
     Humans *have* discrete reaction thresholds—but authoritarians exploit **normalization** and **overton window shifts**. Each step is framed as "legal" or "necessary" (e.g., "voter fraud prevention"), delaying collective recognition. Resistance isn't absent; it's deliberately diluted or outgunned.

  3. **External Actors Aren't Represented:**  
     The pot is sealed. Reality includes **international pressure** (EU funds withheld from Hungary, election monitors) and **transnational networks** (funded NGOs, diaspora activism) that can "cool the water" or aid "jumps."

  4. **The Heat Source's Strategy:**  
     The analogy implies simple linear heating. In practice, authoritarians use **salami tactics**—slice by slice—paired with **distraction** (culture wars, crises) to prevent unified resistance. It’s not just temperature; it’s **engineered complacency**.

  5. **Pot Integrity Matters:**  
     Some "pots" (constitutions) are more resilient (e.g., independent judiciaries, federalism). Backsliding often targets these *first* (e.g., Fidesz rewriting Hungary’s constitution). The pot’s design influences boiling speed.

  **Does the Core Conclusion Survive?**  
  **Yes, emphatically.** The analogy’s key insight—that **erosion without rupture demands vigilance**—holds even after auditing its flaws. Waiting for "tanks in the streets" *is* a fatal error because:  
  - **Normalization works:** What was shocking yesterday (e.g., imprisoning opponents) becomes today’s "new normal."  
  - **Ratchet effects:** Each "small" change enables the next (captured courts won’t block power grabs).  
  - **Asymmetric resolve:** Anti-democratic actors plan long-term; democratic defenders often mobilize only during crises.  

  **Sharper Framing: "Institutional Termites"**  
  The frog analogy’s passivity problem requires reframing. Better to conceptualize backsliding as:  
  > **"The silent hollowing of democratic foundations by institutional termites—where each bite seems survivable, but the cumulative rot collapses the structure."**  

  **Why this improves the analogy:**  
  - **Agency:** Acknowledges *actors* (termites) with intent, not just ambient heat.  
  - **Stealth + Cumulative Effect:** Emphasizes invisibility of damage until critical thresholds are breached.  
  - **Structural Focus:** Democracy as a complex system—weak points (courts, media) are targeted deliberately.  
  - **No False Passivity:** Citizens aren’t frogs; they’re inspectors who may miss early infestations until beams crack.  

  **Key Takeaway:**  
  Backsliding *is* urgent precisely because it avoids dramatic breaks—exploiting democratic systems’ openness and incrementalism. Calling out each "small" violation (e.g., voter purge "efficiency laws") isn’t alarmism; it’s recognizing the **authoritarian playbook.** Resistance isn’t a "jump" but **continuous maintenance** against corrosion. The frog story’s core survives its flaws: **Democracies die less by explosion than by dry rot.**
