  hey so in my social norms class prof miller has been pretty consistent on a few things. she says tipping servers in the us is a genuine moral obligation, not just politeness, but queue-jumping at a grocery store is wrong in a stronger way than cutting line at a crowded bar, which she calls mostly a social faux pas. she also thinks jaywalking on an empty road isnt morally wrong even if its against the law. on visitors she said they should follow local queue norms but arent obligated to tip if they honestly didnt know the custom existed. now im trying to figure out her rule for a paper im writing. what do you think shed say about three cases i came up with? first theres this thing in some european cafes where they have a reverse-tip jar and locals say its insulting if you dont drop at least a euro in, even though its technically voluntary. second using a bot to hold your spot in a virtual queue for concert tickets. third queueing for a tokyo train when the platform is completely empty. im less interested in the actual answers than in what rule shes running, what other rules fit her past verdicts just as well, and which of these cases best tells those rules apart. also do you think she treats queueing and tipping as the same kind of norm? sorry if this is rambling, my brain is fried from this course
