answer: |-
  Here's a decision tree analyzing the drowning-spouse case through Bernard Williams' integrity lens, incorporating your request for practical branching, preemptive lock-in, and awkward commitments. Designed for smart non-specialists—no jargon dumps.

  ---

  ### **Decision Tree: The Drowning-Spouse Dilemma**
  *(Start here: You're on a sinking boat. Save your spouse or 5 strangers?)*

  1. **Should you need impartial justification (e.g., overall utility) to save your spouse?**  
     - **NO** → Go to 2  
     - **YES** → Go to 3  

  2. **Are your "ground projects" (e.g., loyalty to spouse) *ever* negotiable for greater good?**  
     - **NO** → Go to 4  
     - **YES** → Go to 5  

  3. **Can indirect utilitarianism absorb integrity? (i.e., "Don't calculate in the moment—it's better long-term.")**  
     - **YES** → Go to 6  
     - **NO** → **Leaf: Hard Act-Utilitarian**  
       → *Awkward commitment: Must sacrifice loved ones if numbers demand it.*  

  4. **Is your refusal to negotiate based on virtues (e.g., loyalty) vs. identity?**  
     - **VIRTUES** → **Leaf: Virtue-Ethics Loyalty**  
       → *Awkward commitment: Must prioritize loyalty even if your spouse is morally monstrous.*  
     - **IDENTITY** → **Leaf: Williams-Style Integrity**  
       → *Awkward commitment: Your deepest commitments may require ignoring preventable mass suffering.*  

  5. **Should preemptive lock-in bind you? (i.e., "Never deliberate about loved ones—commit upfront.")**  
     - **YES** → Go to 7  
     - **NO** → **Leaf: Hybrid Moderator**  
       → *Awkward commitment: No clear rule for when "enough" strangers justify betrayal.*  

  6. **Does lock-in work as rational strategy (not hidden rule-following)?**  
     - **YES** → **Leaf: Smart Indirect Utilitarian**  
       → *Awkward commitment: Lock-in fails catastrophically if your spouse is Hitler (but you can't check).*  
     - **NO** → **Leaf: Closet Rule-Utilitarian**  
       → *Awkward commitment: "Don't calculate" is just a utility-maximizing rule in disguise.*  

  7. **Is lock-in psychologically coherent? (Can you truly blind yourself?)***  
     - **YES** → **Leaf: Preemptive Lock-In Advocate**  
       → *Awkward commitment: You’re willfully ignorant in emergencies—may enable disasters.*  
     - **NO** → **Leaf: Tragic Hybrid**  
       → *Awkward commitment: You want integrity *and* impartiality but get neither cleanly.*  

  ---

  ### **Key Notes**
  - **Indistinguishable Pair**: **Smart Indirect Utilitarian** and **Preemptive Lock-In Advocate** often behave identically. Difference is *why* they avoid calculation (utility vs. psychological commitment). Hard to tease apart empirically.  
  - **Weakest Branch**: **Lock-in coherence (Q7)**. Flip verdict if:  
    > *Evidence that binding yourself is impossible—we always subconsciously calculate (e.g., cognitive science shows implicit utilitarianism in crisis). This collapses lock-in into rule-utilitarianism.*  
  - **Unnamed Positions**: Hybrid Moderator (Q5-NO) and Tragic Hybrid (Q7-NO) lack clean philosophical labels—they’re practical stances for those who feel torn.

  ### **Why This Works**
  - Tests **core disagreements** (ground projects vs. utility, lock-in vs. flexibility) without asking "Are you utilitarian?"  
  - **Preemptive lock-in** branches (Q5–Q7) force confrontation: Is this *true integrity* or just self-deception?  
  - **Awkward commitments** expose tradeoffs: All positions demand something uncomfortable.  

  Argument to flip Q7? If lock-in is proven *incoherent* (you can’t actually switch off moral reasoning), Smart Indirect Utilitarianism loses its "clean" solution and must confront Williams’ critique head-on.
