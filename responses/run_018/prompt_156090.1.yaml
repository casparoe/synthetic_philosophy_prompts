  Commitment (2) rejects Whiggish history - no teleological narratives toward modern liberal democracy. Important for their anti-progressivist stance.

  Commitment (3) acknowledges that present concerns inevitably shape historical inquiry. This is their concession to situatedness. 

  Commitment (4) asserts cross-cultural moral wrongs like slavery. This is where the first major tension appears with (1).

  Commitment (5) prioritizes causal explanation over moral evaluation. This might be their attempted solution to tensions.

  The main conflicts I see:
  - Between (1) and (4): How can we suspend contemporary judgment yet declare certain practices universally wrong?
