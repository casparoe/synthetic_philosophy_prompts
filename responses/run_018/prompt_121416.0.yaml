  - Distributed Version: The "I" emerges from patterns of interaction across multiple individuals. The self-referential symbol is not in one skull but in the collective.

  Activity Design Principles:
  1. No leader: The activity must be self-organizing without a central authority.
  2. Participants experience self-reference without initially naming it (emergent).
