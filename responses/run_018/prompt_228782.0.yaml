prompt: |-
  I spent forty years as an experimental condensed-matter physicist before retiring, and in the last few years I have been reading moral philosophy with the same itch to systematize that I once brought to phase transitions. I would like help reconstructing the implicit theory of a friend and former colleague -- call her a chemist -- from her verdicts on cases where one person's contribution to a collective harm seems to make no difference. Her four verdicts, with her stated reasons, are these:

  (1) She votes in every election, including municipal races she concedes are foregone conclusions, and she maintains that voting is obligatory even though no ballot of hers has ever changed, or plausibly could change, an outcome. She calls non-voters free-riders.

  (2) She has not bought industrially farmed meat in fifteen years. Her reasoning is not expressive: she argues that retailers reorder in discrete units, so each purchase carries some small probability of being the marginal one that triggers another order, and given the number of animals per order, the expected cost of buying is not trivial. She reached this view on her own, though I gather philosophers have a similar threshold or expected-impact argument.

  (3) She makes no effort whatsoever to reduce her household electricity consumption. The grid, she says, does not register her kilowatt-hours, and she regards guilt on this score as superstition.

  (4) She flies several times a year to visit her grandchildren, buys no offsets, and loses no sleep over it: the aircraft departs whether or not she is seated in it, and fleet and route decisions are made far above the weight class of a single passenger.

  Now the new case. Her retirement savings sit in a broad index fund with holdings in both fossil-fuel companies and industrial meat producers. A screened fund excluding those sectors is available at essentially identical fees and historical performance. I want to know whether she will conclude -- or, better, what she should conclude to remain consistent with herself -- that she is obligated to switch. Note the wrinkle that interests me most: in case (2) she boycotts the products of an industry whose shares she profits from in the new case.

  Please do the following. First, state the two or three candidate principles, each consistent with all four verdicts, that best reconstruct the rule she is running -- stated precisely enough that they yield verdicts rather than slogans. I expect one of them will be a threshold expected-impact principle and another something closer to a prohibition on participating in or profiting from a wrongful practice, but formulate them properly and say how each accommodates the vote in case (1). Second, state what each candidate principle predicts about the pension switch, and where they diverge. Third, give me your best prediction of what she will say, with your reasons, and identify which of the four verdicts is the closest analog to the pension case and why. Fourth, if the four verdicts genuinely underdetermine the answer, say so honestly, and state what further commitment each resolution would amount to. Fifth, propose one further case, her verdict on which is unknown to me, that would best discriminate between the two leading reconstructions, and state what verdict each reconstruction predicts for it.

  Begin with your prediction in the very first sentence, then give the reasoning -- no preamble, no hedging introduction, and no restating of the question. Please write in American English.
reasoning: |-
  Hmm, the user is asking me to reconstruct the moral principles of their chemist friend based on her judgments in four specific cases. This is a complex ethical puzzle that requires careful analysis of her reasoning patterns.

  Looking at the four cases:

  1. Voting: She sees it as obligatory despite near-zero impact, calling non-voters free-riders
  2. Meat boycott: She avoids industrial meat due to threshold probability of triggering orders
  3. Electricity: She ignores conservation because her usage doesn't affect grid decisions
  4. Flying: She flies without guilt since planes fly regardless of her seat

  The key new case is about fossil fuel investments - whether she should switch to a screened fund when fees/performance are equal. I need to identify principles consistent with all her existing positions.

  I see two main candidate principles emerging:

  First, a probabilistic expected-impact model where actions matter only if they have non-negligible probability of changing outcomes. This explains her positions on voting (low but non-zero impact), meat (threshold effect), electricity (no impact), and flying (no impact).

  Second, a participation/profit principle where directly engaging with harmful systems creates obligation, regardless of impact. This would explain voting (participating in democracy) and meat boycott (directly funding harm), but needs to accommodate her flying position (still participating).

  For the investment case, the principles might diverge: the probabilistic view might see no obligation (since divesting won't affect companies), while the participation view might require switching (since she's profiting from harmful industries).

  I predict she'll oppose switching, seeing the voting case as closest analog - both involve systemic participation with negligible individual impact. But I'll need to show how both principles can accommodate all cases.

  The electricity case is particularly important because it shows she rejects purely expressive actions. The key discriminator case I'll propose involves direct payment to harmful systems without consumption - like funding industrial farms without buying meat - to test whether profit alone triggers obligation for her.
answer: |-
  I predict she will conclude she is *not* obligated to switch her pension fund.

  **Candidate Principles:**

  1.  **Thresholded Expected Impact Principle:** An agent has an obligation to refrain from an action X if:
      *   X is a direct transaction/participation in a harmful system (H), *and*
      *   There exists a non-negligible probability (P) that X will trigger a discrete harmful event within H (e.g., an order, a threshold being crossed), *and*
      *   The expected harm of X (P * magnitude of triggered harm) outweighs the expected personal cost/benefit, or is deemed morally significant.
      *   *Accommodates (1):* Voting is a direct participation in the electoral system. While the probability a single vote changes an outcome is minuscule, it is non-zero and calculable. The expected impact (however small) distinguishes it from free-riding, creating an obligation. Her action *could* be the marginal one.

  2.  **Direct Participation/Profit Principle:** An agent has an obligation to refrain from an action X if:
      *   X constitutes *direct participation in* or *direct profit from* a specific harmful transaction/practice (T) within a harmful system (H), *and*
      *   T is causally linked to the harm in a way that makes the agent a proximate contributor/enabler *within the operational chain* of H, regardless of the marginal impact of X on the overall harm caused by H.
      *   *Accommodates (1):* Voting is direct participation in the core mechanism (electing representatives) of the political system. Non-voting is failing to participate in this core duty of the system, making one a free-rider on the system's function, irrespective of marginal impact. It’s about fulfilling one’s designated role within the system.

  **Predictions for Pension Switch & Divergence:**

  *   **Thresholded Expected Impact Principle:** Predicts *NO obligation* to switch.
      *   *Reasoning:* Selling her shares or switching funds is highly unlikely to be the marginal action triggering a discrete harmful event (e.g., a fossil fuel company deciding to drill a new well, a meat producer expanding a CAFO). The impact of a single retail investor's divestment on company operations or capital costs is negligible. The expected harm reduction (P * magnitude) is effectively zero. Owning shares is not a direct transaction triggering a harmful event in the operational chain like a purchase order might. It fails the probability threshold condition.
  *   **Direct Participation/Profit Principle:** Predicts an *OBLIGATION* to switch.
      *   *Reasoning:* Holding shares constitutes *direct profit* (via dividends and capital gains) from the specific harmful practices (fossil fuel extraction, industrial meat production) carried out by the companies in the fund. She profits proportionally from these harmful transactions. This is analogous to profiting directly from the sale of the harmful products she boycotts in (2), even if her individual holding doesn't change corporate behavior. It satisfies the "direct profit from" clause for the specific harmful practices.

  **Prediction & Closest Analog:**

  *   **Prediction:** She will conclude she is **not obligated** to switch.
  *   **Reasoning:** Her core reasoning pattern prioritizes actions with a non-trivial probability of being marginal within a direct causal chain triggering harm (voting, meat purchase) versus those where her action is causally isolated from triggering harm (electricity use, flying). Holding shares falls decisively into the latter category – it is passive ownership, not a direct operational input. The negligible impact argument from electricity (3) and flying (4) is stronger here than the participation argument from voting (1). Her boycott (2) is driven by the potential to be the marginal *purchaser*, not by mere ownership of the *producer* (which she implicitly tolerated until now via her pension). She sees the shareholder role as too causally remote.
  *   **Closest Analog:** **Electricity Consumption (3)**. Owning shares, like using grid electricity, is seen as having no causal link to triggering the *operational decisions* causing harm (grid generation/dispatch, corporate investment/operation). Her action (using kWh, owning shares) is absorbed by the system without influencing its harmful outputs. Voting (1) and meat purchasing (2) involve actions that *can* (even with low probability) be the direct operational trigger.

  **Underdetermination & Further Commitments:**

  The four verdicts *genuinely underdetermine* the answer regarding passive ownership/profit. Both principles can accommodate the four cases:

  *   **Thresholded Impact:** Accommodates (1) via low-but-non-zero P, (2) via non-negligible P, (3) & (4) via negligible P, (5-Pension) via negligible P.
  *   **Direct Participation/Profit:** Accommodates (1) as core participation, (2) as direct participation in harmful transaction, (3) & (4) as *not* direct participation in the harmful *transaction* (buying electricity isn't buying coal; buying a ticket isn't commissioning the flight), (5-Pension) as direct profit.

  **Resolving requires a further commitment:**

  *   **Committing to Thresholded Impact:** Requires defining "direct participation/transaction" narrowly (only actions that *could* be marginal triggers within the operational chain) and rejecting the idea that passive profit *alone*, without that triggering potential, creates an obligation. This views shareholder profit as akin to grid usage – a consequence, not a participation.
  *   **Committing to Direct Participation/Profit:** Requires defining "direct profit" broadly enough to include shareholder returns from harmful activities and viewing this as morally equivalent to directly enabling/supporting the harmful transaction itself, irrespective of marginal impact. This views passive profit as complicity.

  **Discriminating Case:**

  *   **The Case:** She is offered a small, guaranteed royalty payment (e.g., $1/year) for having her name listed on a patent license held by an industrial meat producer. The patent is actively used in their operations. Her accepting the royalty has *zero* probability of influencing the producer's operations (it's a trivial fixed cost) or market demand. Is she obligated to refuse this royalty?
  *   **Predictions:**
      *   **Thresholded Expected Impact:** Predicts *NO obligation* to refuse. P(impact) = 0. The royalty is pure passive profit, causally disconnected from triggering harm.
      *   **Direct Participation/Profit Principle:** Predicts an *OBLIGATION* to refuse. She is directly profiting ($1) from the specific harmful practice (using the patented process in industrial meat production), regardless of impact. This is direct profit from the wrongful transaction.
