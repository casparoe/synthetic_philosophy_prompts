  Hey — I'm writing a feature on evolutionary cooperation and keep tripping over the same logical knot (think there's a typo in step 5, but bear with me):

  (1) In the iterated prisoner's dilemma, tit-for-tat is evolutionarily stable against pure defection only if the shadow-of-the-future parameter w exceeds (T-R)/(T-P).

  (2) That result is strictly about population dynamics: it tells us which strategy frequencies survive, not what any individual player ought to do.

  (3) But contractarian philosophers often borrow it normatively, treating "evolutionarily stable" as equivalent to "individually rational."

