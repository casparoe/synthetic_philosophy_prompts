answer: |-
  The critical weak link is **step (3)**, where evolutionary stability (a population-level concept) is equated with individual rationality. This equivalence is invalid. Evolutionary stability identifies strategies that resist invasion by *mutants* in a *population* over generations. Individual rationality concerns optimal *decisions* given specific information and payoffs. While stable strategies often align with rational choices in simplified models, they need not dictate what's rational in all contexts—especially when adding indirect reciprocity's complexity.

  Rejecting (3) costs nothing scientifically: the evolutionary math (steps 1-2, 5, 7) remains sound. Indirect reciprocity *does* create nonzero effective *w* via reputation, favoring cooperation in many real-world settings. But individual rationality requires weighing *actual* payoffs in a *specific* interaction. Facing a known exploiter *with no observers*, defection remains rational (effective *w* = 0 for *that* act). The error is normative overreach: evolution explains *why* cooperation often thrives, not that defection is *always* irrational for social agents. Preserve the science by restricting evolutionary conclusions to population dynamics and treating rationality as context-dependent.
