answer: |-
  Here's the joint statement drafted under your specifications, designed as a product of rigorous adversarial collaboration between a committed compatibilist (C) and incompatibilist (I), with agreed claims, precise disagreements phrased acceptably to each side, and your requested niche framing:

  **Joint Statement on Free Will, Determinism, and Moral Responsibility**  
  *We, the undersigned compatibilist and incompatibilist, affirm the following after exhaustive deliberation:*

  ### Agreed Claims (Common Ground)
  1. **Determinism Defined**: If determinism is true, the complete state of the universe at any prior time (t1), conjoined with the laws of nature, necessitates the state of the universe at any later time (t2). There is exactly one physically possible future.  
  2. **Neuroscience & Decisions**: Neuroscience establishes that:  
     - Conscious awareness of a decision often follows non-conscious neural activity (e.g., readiness potentials).  
     - Decisions correlate with deterministic/computable neural processes.  
     - *It has not established* that conscious deliberation is epiphenomenal, nor that neural patterns *preclude* responsibility under any definition.  
  3. **Frankfurt-Style Cases (FSCs)**: FSCs successfully demonstrate that moral responsibility *does not logically require* the **actual ability to do otherwise** at the moment of choice in *specific constrained scenarios* (e.g., Jones votes freely; Black’s intervention remains idle).  
  4. **"Ability to Do Otherwise" Ambiguity**: The term "ability to do otherwise" is contested. Both sides agree it must be clarified as either:  
     - (a) *Alternative Possibilities* (AP): Literal access to divergent physical futures in the actual world, *or*  
     - (b) *Agential Capacity* (AC): The agent’s mechanism being responsive to reasons (e.g., would the agent have chosen differently *if* relevant reasons had differed?).  
  5. **Sourcehood Necessity**: Moral responsibility requires the action to *originate* in the agent in a substantive way ("sourcehood").  
  6. **Niche Framing (Cass Case)**: Consider an agent, **Cass**, with:  
     - Perfect recursive self-modeling (real-time awareness of her own decision-making processes, biases, and deterministic neural dynamics).  
     - Fully deterministic neural processes.  
     - *Question*: Does Cass have the control requisite for blame/praise?  
  7. **No Conflict with Physics**: Neither position requires violating known physics (e.g., quantum indeterminacy, if irrelevant to macrocognition, doesn’t resolve the debate).

  ### Disagreements (Phrased for Mutual Acceptance)
  | Disagreement                                                                                                | Compatibilist (C) Phrasing                                                                 | Incompatibilist (I) Phrasing                                                                 |
  | :---------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------- |
  | **1. Free Will Existence**                                                                                  | Free will is compatible with determinism if agents act according to reasons-responsive mechanisms. | Free will requires the falsity of determinism; it cannot exist in a deterministic universe. |
  | **2. Moral Responsibility & Determinism**                                                                   | Moral responsibility is compatible with determinism when actions reflect the agent’s reasons-responsive judgment. | Determinism undermines moral responsibility because it precludes ultimate sourcehood.        |
  | **3. "Ability to Do Otherwise" Relevance**                                                                  | Responsibility requires only *Agential Capacity (AC)*, not *Alternative Possibilities (AP)*. | Responsibility requires *Alternative Possibilities (AP)* in a robust sense (pre-FSCs).       |
  | **4. Control in the Cass Case**                                                                             | Cass has *enhanced* responsibility-relevant control due to perfect self-modeling, despite determinism. | Cass lacks responsibility-relevant control; self-modeling doesn’t transcend causal chains.   |

  ### Cruxes & Predictions on Agreed Cases  
  1. **Crux: Definition of "Ability to Do Otherwise"**  
     - *Case*: **Frankfurt’s Jones/Black**: Jones votes freely; Black’s device would force Jones to vote X if he showed dissent, but Jones votes X willingly.  
       - **C Prediction**: Jones is responsible because he had *AC* (his mechanism was reasons-responsive; he’d have refrained if reasons differed).  
       - **I Prediction**: Jones is responsible *only if* he had *AP* before Black’s setup intervened (e.g., during prior deliberation).  

  2. **Crux: Sourcehood Under Determinism**  
     - *Case*: **The Manipulated Agent**: Diane is covertly programmed (via neurosurgery) to value theft and steals willingly.  
       - **C Prediction**: Diane is *not* responsible because her mechanism isn’t reasons-responsive/revisable; sourcehood is vitiated.  
       - **I Prediction**: Diane is not responsible, but *no one* in a deterministic world is responsible for the same reason (ultimate sourcehood is impossible).  

  3. **Crux: Control in the Cass Case**  
     - *Case*: Cass knowingly commits premeditated harm, fully aware of her deterministic neural processes.  
       - **C Prediction**: Cass is *more* blameworthy than a typical agent—her self-modeling allows refined reasons-responsiveness.  
       - **I Prediction**: Cass is *not* blameworthy for the act; her self-modeling is a deterministic output, not a source of control.  

  ---  
  **Signed**,  
  [Compatibilist Representative] — "Free will and responsibility emerge from deterministic agency."  
  [Incompatibilist Representative] — "Ultimate responsibility requires indeterminism."  

  This reflects the core agreements, fault lines, and your niche focus on recursive self-modeling. The Cass case isolates whether deterministic self-transparency can satisfy control demands—C sees it as amplifying agency; I sees it as a deterministic epiphenomenon.
