  For Cass's case: Hard determinists will say the perfect self-model changes nothing if physics is fixed; compatibilists will argue it *enhances* responsibility. That tension reveals the metaphysical rift. 

  Noticing their "no web access" note—avoid niche citations, stick to canonical examples (Frankfurt, Libet). The therapy context warrants sensitivity; no clinical speculation, but the framing should subtly validate their introspection as philosophically legitimate. 

  Final structure: 
