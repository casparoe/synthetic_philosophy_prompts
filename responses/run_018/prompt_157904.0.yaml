answer: |-
  Here are five numbered counterpoints:

  1.  **Duhem-Quine Holism**: If hypotheses are tested only as interconnected webs (Duhem-Quine thesis), cleanly isolating "genuinely risky predictions" from "auxiliary adjustments" becomes conceptually incoherent or practically impossible, undermining the proposed ratio's foundations.
  2.  **"Genuine Risk" Vagueness**: Defining "genuine risk" objectively across diverse fields is arguably impossible; its application depends heavily on subjective judgments about background knowledge and prior probabilities, making the metric arbitrary and non-universal.
  3.  **Lakatos's Degenerating Program Hindsight**: Historically, programs deemed "progressive" (high ratio) often relied on auxiliary adjustments later exposed as profoundly ad hoc, meaning the metric fails in real-time demarcation and relies on problematic historical hindsight.
  4.  **Quantification Impossibility**: The core concepts ("genuine risk," "adjustment," "ratio") resist meaningful quantification, rendering the metric merely metaphorical and unable to serve as an operational demarcation criterion in practice.
  5.  **Immunization via Redefinition**: Defenders could consistently redefine "genuine risk" or reclassify adjustments to protect favoured programs, rendering the view unfalsifiable in practice, ironically mirroring the immunizing stratagems it sought to avoid.
