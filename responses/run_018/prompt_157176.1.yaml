  I've been tinkering with a dataset entry and need a prompt that's actually in the weeds, not another regurgitation of Nozick 101. I'm a phil prof, fluent in his side-constraint view on animals (the ASU argument against cross-species utilitarian aggregation, the 'meaningful life' qualifier, the separateness-of-persons intuition) and also comfortable with mechanisn design — hidden types, strategy-proofness, incentive-compatible allocations, preference revelation, the usual toolkit.

  Task: restate Nozick's position on animal moral status and the limits of using/torturing them entirely in that economic vocabulary. Frame it as a mechanism-design problem: an allocator observes continuous cardinal welfare reports from engineered animals (real-time implant data, say), but these beings lack contractual capacity and long-term planning. Which allocations — food production, medical research, torture — come out strategy-proof or incentive-compatible under Nozick's rules, and which violate the mechanism's constraints? Don't just map 'rights' onto 'constraints'; try to derive the side-constraint rules from properties of the allocation mechanism itself.

  Then the residue report: what translates cleanly? What survives only with distortion — maybe the meaningful-life criterion gets twisted into a preference-revelation failure? What's left over with no counterpart in mechanism design at all? Finally, take a committed stand: is that leftover a failure of economic formalism to capture moral status, or does it expose an undefended essentialism in Nozick?

  Don't give me a bibliography or citation list — I can't verify them without web access. Don't summarize Nozick for beginners; I'm asking you to stress-test the translation.

  Format: Translation (~500 words), Residue report (~350 words), Verdict (~200 words). The Verdict must pick a side and defend it, not sit on the fence. There's probably a typo in this prompt; just answer it straight.
