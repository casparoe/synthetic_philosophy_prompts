  Below is a complete, battle-tested session plan focused on experiential learning. It uses your three wrinkles to reveal core IRL challenges, minimizes lecture, and forces students to confront the limitations of behavior-only inference. Key structure: **observe → commit → get burned → discover assumptions**.

  ---

  ### **Materials & Setup**
  - **Whiteboard**: Draw a 5×5 grid (A1 top-left, E5 bottom-right). Mark START (A1) and GOAL (E5).
  - **Printed 5×5 grids** (1 per student): Blank except for START/GOAL.  
  - **Index cards** (3 per student): For reward guesses, route predictions, and confidence bets.  
  - **Secret reward sheets** (for 3 demonstrators):  
    - **D1 (Prohibition)**: "Reward: E5 = +10. **Cell C3 is prohibited** (cannot enter). All else = 0."  
    - **D2 (Non-optimal)**: "Reward: E5 = +10. Follow rule: *Always move right if possible; if blocked, move down.*" (Satisficing)  
    - **D3 (Identical behavior)**: "Reward: E5 = +10. **Cell B2 = -5 penalty** (disliked). All else = 0."  
    *(Note: D1 and D3 produce identical routes on Grid 1 but avoid cells for different reasons)*  
  - **Timer** (visible to all).  

  ---

  ### **Session Flow (75 min total)**  
  *(Key: ⏱ = Time, 🎯 = Goal, 💥 = "Burn" moment)*  

  #### **Intro (5 min)**  
  ⏱: **0-5 min**  
  - *"We have a demonstrator navigating from START to GOAL. They have secret rewards. Your job: guess what they want by watching their path. Write your guess on index cards—you’ll bet points on it."*  
  - Show Grid 1 on whiteboard. No assumptions stated.  

  #### **Round 1: Grid 1 - Prohibition Problem (20 min)**  
  ⏱: **5-25 min**  
  1. **Demonstration (D1 - Prohibition)**:  
     - D1 walks route: **A1 → A2 → A3 → B3 → B4 → C4 → D4 → D5 → E5** (avoids C3 and B2).  
     - *Students write:*  
       - **Reward function** (on grid): Assign numbers to cells.  
       - **Confidence bet**: 1–5 points (must commit!).  
       - **Route prediction** for later test (optional but incentivized).  

  2. **💥 Burn 1: The Trap**  
     - Ask: *"Who thought avoided cells (C3/B2) were negative? Why?"*  
     - Reveal: *"D1 avoided C3 because it was prohibited—not disliked. B2 was neutral."*  
     - **Discovery**: Avoidance ≠ dislike (prohibition problem). Behavior alone doesn’t distinguish *why* something is avoided.  

  #### **Round 2: Grid 1 - Non-Optimality (15 min)**  
  ⏱: **25-40 min**  
  1. **Demonstration (D2 - Rule-Follower)**:  
     - D2 walks route: **A1 → B1 → C1 → D1 → E1 → E2 → E3 → E4 → E5** (follows "right-then-down" rule, not reward).  
     - *Students repeat:* Reward guess, confidence bet, route prediction.  

  2. **💥 Burn 2: Confabulation Exposed**  
     - Reveal: *"D2 wasn’t optimizing rewards—just following a rule."*  
     - Ask: *"How many of you invented a reward to explain this? What was it?"*  
     - **Discovery**: Plausible behavior ≠ reward-maximizing. Inferred rewards are confabulations without optimality.  

  #### **Transplant Test: Grid 2 (20 min)**  
  ⏱: **40-60 min**  
  1. **New Grid**: Draw on whiteboard. Changes:  
     - **C3 (was prohibited) → OPEN**.  
     - **B3 (was open) → PROHIBITED**.  
     - *Remove shortcut:* Path A3→B4 now blocked (e.g., "wall").  
     - START/GOAL unchanged.  

  2. **Split Room**:  
     - **Group 1 (Action Cloners)**: *"Predict D1’s path by copying her style—avoid cells she avoided."*  
     - **Group 2 (Reward Inferrers)**: *"Predict D1’s path using your reward function from Round 1."*  
     - *All commit to exact route + bet confidence (1–5).*  

  3. **💥 Burn 3: Cloners Lose**  
     - **Actual D1 path**: A1 → A2 → A3 → C3 → C4 → D4 → D5 → E5 (uses C3 now open, avoids new B3).  
     - **Scoring** (no money):  
       - Exact match: +3 × confidence  
       - Correct goal, wrong path: +1 × confidence  
       - Wrong goal: 0  
       - *Hedging penalized:* No partial credit; must commit.  
     - **Result**: Reward group wins (adapts to changes). Cloners lose (avoid C3 pointlessly).  

  #### **Reveal & Degeneracy (10 min)**  
  ⏱: **60-70 min**  
  1. **Identical Behavior, Different Rewards**:  
     - Show D3’s route from Round 1: **Identical to D1** (avoids B2 due to dislike, not prohibition).  
     - Ask: *"Can you tell D1 and D3 apart? What does this imply?"*  

  2. **💥 Burn 4: Reward Non-Identifiability**  
     - Add twist: *"D1’s reward is equally explained if I add +5 to all cells, or subtract 10 from C4. Policy doesn’t change."*  
     - **Discovery**: Many rewards fit the same behavior (degeneracy). Assumptions (e.g., feature choice, tie-breakers) do the heavy lifting.  

  #### **Debrief (5 min)**  
  ⏱: **70-75 min**  
  Map experiences to assumptions:  
  | **What Happened**          | **Assumption Revealed**       |  
  |----------------------------|-------------------------------|  
  | Prohibition misinterpreted | Dynamics (known/unknown constraints) |  
  | Non-optimal confabulation  | Optimality (vs. satisficing) |  
  | Reward group won transplant| Generalization (reward > actions) |  
  | D1/D3 identical routes     | Feature choice (what rewards *are*) |  
  | +5/-10 same policy         | Degeneracy (potential-based shifts) |  
  - *"Today you discovered: Behavior alone is a Rorschach test. The map isn’t the territory—your assumptions built the territory."*  
  - **Punchline**: *"Inverse RL isn’t mind-reading. It’s assumption-reading."*  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Secret leaks**:  
     - *Prevent:* Brief demonstrators privately. Use coded sheets (e.g., "Sheet Alpha").  
     - *Fix:* Swap demonstrators last-minute; use a TA as backup.  

  2. **"Reward = this exact route"**:  
     - *Prevent:* Require rewards per *cell* (not path). Reject path-based rewards.  
     - *Fix:* *"If you reward only this path, why not take shortcuts? Your reward must explain *why* they avoided other cells."*  

  3. **Sloppy demonstrator**:  
     - *Prevent:* Rehearse routes. Give them printed path instructions.  
     - *Fix:* *"Jane took a detour—let’s discuss why *your model* thinks she did that."* (Pivot to interpretation under noise.)  

  4. **Hedging on confidence**:  
     - *Prevent:* Score publicly. Shame low-confidence bets (e.g., *"No risk, no discovery!"*).  
     - *Fix:* Double points for bets ≥4 to incentivize commitment.  

  5. **Max entropy mentioned early**:  
     - *Prevent:* *"Hold that thought—write it down for the debrief."*  
     - *Fix:* In degeneracy reveal, say: *"Some use maximum entropy to choose between equally good rewards. But notice—it’s an *assumption*, not in the data."*  

  ### **What You Must Say Aloud**  
  - **Degeneracy**: The game won’t organically reveal potential-based reward transformations. *Say:* *"Adding state-dependent terms can leave the policy unchanged. That’s why we need tie-breakers."*  
  - **Non-identifiability**: Students won’t derive all possible reward families. *Say:* *"Two agents with different desires can act identically. How? Because rewards live in equivalence classes."*  

  ### **Why This Works**  
  - **Discovery > Lecture**: Students *feel* the prohibition problem when cloners lose points; they *see* degeneracy when D1/D3 match.  
  - **Economy of Time**: Transplant test serves dual purpose—exposes dynamics and generalization.  
  - **No Jargon**: "Identifiability" appears only as a revealed truth, not a term.  

  This plan turns abstract limitations into visceral lessons. The burns are memorable; the debrief ties them to theory. Run it tight, and they’ll leave questioning every robot "want" they see.
