  ## A Rigorous Defense of the Co-Authorship Criterion for Demos Membership

  The fundamental question of democratic theory—"Who constitutes the *demos*?"—demands a principle that justifies inclusion while maintaining the integrity of democratic self-government. I argue that **membership in the demos should be defined by the co-authorship of binding law criterion:** one belongs if one is subject to a jurisdiction's coercive legal framework in a manner that makes reciprocal democratic revision of that framework conceptually possible. This criterion offers a normatively compelling and institutionally viable grounding superior to citizenship, residence, the all-affected principle alone, or simple subjection.

  **The Argument for Co-Authorship:**

  1.  **Legitimacy Through Reciprocal Coercion:** The core justification for democratic authority lies in avoiding arbitrary domination. Laws coercively bind individuals. If individuals are coerced by rules they had no possible hand in shaping or revising, they are subjected to the will of others, akin to domination (Pettit, Shapiro). Legitimacy requires that the coerced are also the co-authors (or represented by co-authors).
  2.  **Reciprocity as the Democratic Essence:** Democracy is uniquely characterized by the *reciprocal* relationship between rulers and ruled. Citizens are both authors and subjects of the law (Rousseau). The "co-authorship" criterion explicitly captures this reciprocity. It requires not just being affected or coerced, but being in a position to *engage* in the collective practice of giving, receiving, justifying, and revising coercive rules with others similarly situated. This mutual vulnerability and capacity for revision is the essence of democratic equality.
  3.  **Superiority Over Alternatives:**
      *   *Citizenship/Residence:* Citizenship is often arbitrary (birthright) and excludes long-term, integrated residents deeply subject to coercion. Residence alone includes tourists or short-term visitors not sufficiently integrated into the legal order's reciprocal structure. Co-authorship includes integrated residents while excluding transient visitors and permanently emigrated citizens no longer subject to coercion.
      *   *All-Affected Interests (AAP) Alone:* While highlighting a crucial moral concern (impact), AAP is radically over-inclusive and indeterminate. *Everyone* is affected by nearly every law (e.g., global climate policy, economic sanctions). Applying AAP literally dissolves bounded political communities, making collective self-government impossible. It conflates *having a moral stake* with *being a member of the self-governing body*. Co-authorship provides the necessary boundary condition for AAP, limiting the demos to those affected *through direct, coercive subjection* and capable of *reciprocal action*.
      *   *Simple Subjection:* Merely being subject to coercion (e.g., a prisoner, a comatose patient) is insufficient. Democracy requires agency. Co-authorship adds the vital capacity for reciprocal revision, ensuring the demos consists of agents who can practically engage in self-rule.

  **Defining the Boundary:**
  *   **Included:** Citizens and long-term resident non-citizens integrated into the legal order (subject to its coercion daily, contributing to society, reliant on its institutions). They experience the coercion and possess the capacity (individually or via representation) to engage reciprocally in revision.
  *   **Excluded:**
      *   *Permanent Emigrants:* No longer subject to the jurisdiction's routine coercion. While affected (e.g., by inheritance laws), they lack the ongoing coercive subjection and capacity for reciprocal revision within the polity.
      *   *Future Generations:* Profoundly affected by present laws but *do not currently exist*. They cannot reciprocate – they cannot propose revisions, deliberate, vote, or be held accountable. Including them violates the core reciprocity requirement.
      *   *Non-human Animals:* Clearly affected and deserving moral consideration, but lack the cognitive capacity to understand laws, engage in reason-giving, or participate reciprocally in legislative revision.
      *   *Severely Cognitively Disabled Adults & Young Children:* Subject to coercion and deeply affected. However, they lack the cognitive capacity necessary to understand, deliberate on, or participate reciprocally in the complex process of law revision, even via idealized representation focused on *their authorship* (as opposed to their interests).

  **Defending Against the Strongest Objection: The Exclusion of Future Generations and the Non-Capacitated**

  The most potent objection charges that the reciprocity requirement arbitrarily privileges present capacity, unjustly excluding those profoundly affected but unable to reciprocate, specifically future generations and severely cognitively disabled individuals/young children. This exclusion is claimed to be morally indefensible.

  **Rebuttal:**

  1.  **The Necessity of Reciprocity for Non-Domination:** The exclusion is not arbitrary but stems from the constitutive core of democracy itself – reciprocal self-rule among free and equal agents. To include entities fundamentally incapable of participating in the reciprocal exchange of reasons, proposals, and revisions is to undermine the very practice it defines. Future generations cannot engage in this exchange *at all*. Including them conceptually transforms democracy into stewardship or trusteeship, a different (though potentially valuable) mode of governance, but not collective *self*-government by the governed *themselves*.
  2.  **The Impracticality and Conceptual Confusion of Inclusion:** How *could* future generations be included? Proxy voting relies on present actors' judgments, not future authorship. Assigning them "representatives" confuses representing *interests* with embodying *authorship*. Their hypothetical interests are interpreted and acted upon *by the current demos*, reaffirming that the authorship lies solely with the present reciprocal community. Similarly, for the non-capacitated, forcing "representation" of their *authorship* is incoherent. We cannot vote *as* they would author laws if they could; we can only vote based on our interpretation of their *interests*.
  3.  **Distinguishing Demos Membership from Moral Obligation:** Excluding these groups from the *demos* does not negate our profound moral obligations towards them. These obligations are real and demanding, but they derive from sources *other than* democratic co-authorship:
      *   *Future Generations:* We have strong intergenerational justice obligations rooted in fairness, sustainability, and non-exploitation. These must be met through mechanisms *within* the current demos's decision-making: constitutional entrenchments, independent institutions (environmental agencies, courts), strong norms of foresight, and ethical deliberation imposing constraints on the *current* authors.
      *   *Non-Capacitated Individuals:* They possess inherent moral worth and rights. The current demos has a paramount duty to protect their fundamental interests through robust legal safeguards, guardianship systems focused on *their* welfare (not societal convenience), non-discrimination laws, and inclusive social policies. Their exclusion from the *authoring collective* does not entail abandonment; it necessitates heightened vigilance by the demos to prevent domination *of them*.
  4.  **The Danger of Over-Inclusion:** Diluting the demos to include non-reciprocating entities risks undermining democratic agency and accountability. If laws must be justified to entities that cannot literally respond or revise, justification becomes a one-way monologue to hypothetical or interpreted interests, eroding the mutual accountability essential among co-authors. It burdens the decision-making process with potentially paralyzing demands for representing the unrepresentable.

  **Assessment of Confidence:**

  *   **High Confidence:** I am highly confident in the core argument that *reciprocal capacity* is a conceptually necessary element for defining a democratic *demos* based on the non-domination principle and the constitutive reciprocity of democracy. The critiques of citizenship/residence and the unworkable over-inclusiveness of the pure AAP are robust.
  *   **High Confidence:** I am highly confident that future generations must be excluded from the *demos* proper due to their non-existence and fundamental inability to engage in reciprocity. The distinction between moral obligation and demos membership is crucial and defensible. The mechanisms for handling intergenerational justice lie *within* the structures of the present demos.
  *   **Moderate-to-Low Confidence (The Point of Least Certainty):** I am least confident and most troubled by the exclusion of **severely cognitively disabled adults** from the *demos*. While the *conceptual* argument based on reciprocity is strong, the *moral unease* is profound. Can "conceptual possibility" be stretched further? Are there models of representation that could more robustly simulate "co-authorship" for their interests without collapsing into mere trusteeship? While the defense (distinguishing authorship from interest protection, emphasizing heightened duties) is the best available within the co-authorship framework, I acknowledge this remains the most vulnerable point ethically. The risk of their interests being marginalized by the demos is real, and the line between "severe" disability and sufficient capacity for some form of included participation is ethically and practically fraught. This exclusion requires the strongest possible compensatory safeguards.

  **Conclusion:**

  The co-authorship of binding law criterion provides a rigorous, normatively grounded, and institutionally functional basis for defining the demos. It centers democracy on the reciprocal relationship between coercive subjection and the capacity for revision among free and equal agents. While it excludes future generations and the severely non-capacitated based on the impossibility of reciprocity, this exclusion stems from democracy's core logic, not arbitrariness. Importantly, it does not negate our stringent moral obligations to these groups; it merely locates the fulfillment of those obligations within the decision-making structures and ethical commitments of the current, reciprocal demos. Despite its conceptual strengths, the application to severely cognitively disabled individuals remains the most ethically challenging aspect, demanding exceptional vigilance by the included demos to ensure their fundamental rights and interests are never sacrificed.
