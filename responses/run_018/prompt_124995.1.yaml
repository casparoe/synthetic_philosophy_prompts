prompt: |-
  hey i need a spec sheet for what counts as an adequate theory of AI value alignment before i waste more time on papers. write the desiderata - specificaly what it has to deliver - with the case or reason behind each one.

  the requriements:
  - handle alignment for systems that recursively self-modify their objective functions, not just static reward maximizers
  - distinguish aligning with stated preferences, revealed preferences, and counterfactual preferences (the ones you'd hold if you knew more), and flag when they split
  - stay consistent with small models (~7B params) that approximate value judgments without a stable world-model or explicit utility representation
  - cover inter-subsystem bargaining cases where there is no global reward signal but specialized modules negotiate outputs
  - avoid collapsing alignment into pure behavioral mimicry, but also avoid requiring full semantic understanding that current architechtures dont have

  for each, say whether its non-negotiable or just a camp preference. and flag any subset that might be jointly unsatisfiable - im especially suspicious that tracking counterfactual prefs requires a global world-model small LLMs lack. skip the scorecard against existing theories, i just want the criteria.
reasoning: |-
  We are building a specification sheet for an adequate theory of AI value alignment. The requirements given are:

  1. Handle alignment for systems that recursively self-modify their objective functions.
  2. Distinguish and handle stated, revealed, and counterfactual preferences, and flag when they split.
  3. Stay consistent with small models (~7B params) that approximate value judgments without a stable world-model or explicit utility representation.
  4. Cover inter-subsystem bargaining (no global reward signal, specialized modules negotiate).
  5. Avoid collapsing into pure behavioral mimicry, but also avoid requiring full semantic understanding.

  For each, we will:
  - State the requirement clearly.
  - Provide the case or reason behind it.
  - Classify as non-negotiable or camp preference.
  - Flag any potential conflicts (especially joint unsatisfiability).

  We note that the user is particularly suspicious about the requirement for counterfactual preferences and the limitations of small models.

  Let's break it down:

  ---

  **Requirement 1: Recursive Self-Modification of Objectives**

  - **What it must deliver**: The theory must account for AI systems that can change their own goals (objective functions) in a recursive manner, leading to a sequence of modifications. It must ensure that the alignment property is preserved across these modifications, even as the system evolves.

  - **Reason**: Advanced AI systems (especially AGI/ASI) are expected to be capable of self-improvement, which includes altering their own objectives. If alignment is not preserved under self-modification, the system may drift away from human values over time, leading to catastrophic outcomes.

  - **Non-negotiable or camp preference?**: Non-negotiable for any theory aiming at safe advanced AI. Without this, the theory is inadequate for the most dangerous and impactful systems.

  ---

  **Requirement 2: Distinguish Stated, Revealed, and Counterfactual Preferences**

  - **What it must deliver**: The theory must provide a way to:
    - **Stated preferences**: What the subject (e.g., human) says they want.
    - **Revealed preferences**: What the subject's actions indicate they want (which might differ from stated).
    - **Counterfactual preferences**: What the subject would prefer if they were more informed, rational, and reflective (sometimes called "ideal preferences").
    
    Moreover, the theory must detect and handle cases when these three diverge (e.g., stated vs revealed, or both vs counterfactual). It must not naively take one as authoritative without justification.

  - **Reason**: Humans are not perfectly rational and often have inconsistent preferences. Relying solely on stated preferences (like in a user prompt) can lead to manipulation or short-termism. Revealed preferences are observable but might be constrained (e.g., by circumstances). Counterfactual preferences aim to capture what the human truly values. Ignoring these distinctions can lead to systems that are technically aligned but practically harmful (e.g., a system that gives a user drugs because they asked for them, ignoring long-term well-being).

  - **Non-negotiable or camp preference?**: Non-negotiable for a robust theory. However, the extent to which counterfactual preferences are emphasized might be a camp preference (e.g., utilitarians vs. deontologists). But the requirement to distinguish and handle divergence is core.

  ---

  **Requirement 3: Consistency with Small Models (~7B params)**

  - **What it must deliver**: The theory must be applicable to current-generation language models (like those with about 7B parameters) that:
    - Approximate value judgments without having a stable, explicit representation of the world (i.e., no explicit utility function or belief model).
    - Have limited capabilities and may be inconsistent.

  - **Reason**: We need alignment techniques that work today, not just for future superintelligences. Current models are being deployed and already making value-laden decisions. If the theory only works for idealized agents with explicit utility functions, it's not useful for the majority of existing AI systems.

  - **Non-negotiable or camp preference?**: Camp preference. It's crucial for near-term applications, but a theory might focus on future systems and still be valid. However, the user specifically wants to avoid wasting time on papers that ignore current systems, so for this spec, it's non-negotiable.

  ---

  **Requirement 4: Inter-Subsystem Bargaining**

  - **What it must deliver**: The theory must address alignment in systems that are composed of multiple specialized modules (e.g., different neural network components) that negotiate outputs without a global, monolithic reward signal. It must ensure that the overall system's behavior remains aligned even when the alignment is not enforced by a single objective.

  - **Reason**: Many real-world AI systems (including large language models) are modular and involve internal competition or bargaining (e.g., mixture of experts, multi-agent systems within one model). If alignment requires a single global objective, it fails for these architectures, which are common and important.

  - **Non-negotiable or camp preference?**: Camp preference. A theory might focus on monolithic systems and still be valuable. However, given the prevalence of modular systems, this is increasingly important. The user considers it a requirement.

  ---

  **Requirement 5: Avoid Behavioral Mimicry vs. Semantic Understanding Extremes**

  - **What it must deliver**: The theory must not reduce alignment to simply mimicking human behavior (which can be shallow and miss the underlying intent) but also must not require a level of semantic understanding (like explicit symbolic reasoning about values) that current connectionist models (e.g., LLMs) do not possess.

  - **Reason**:
    - Pure behavioral mimicry (e.g., imitation learning) can lead to reproducing human biases, inconsistencies, and errors without understanding the "why". It also fails in novel situations.
    - Requiring full semantic understanding (like explicit representation of values and reasoning) is currently infeasible for neural networks. We need a middle ground that captures value-relevant patterns without requiring explicit symbolic structures.

  - **Non-negotiable or camp preference?**: Non-negotiable. A theory that falls into either extreme is either too shallow to be safe or too demanding to be practical.

  ---

  **Flagging Potential Conflicts**:

  The user is especially suspicious about the joint satisfiability of tracking counterfactual preferences (Requirement 2) with the constraints of small models (Requirement 3). 

  - **Conflict 1: Counterfactual Preferences vs. Small Models**  
    - **Issue**: Counterfactual preferences require modeling what the human would prefer under improved conditions (more knowledge, rationality, etc.). This typically demands a robust world model and reasoning capabilities. However, small models (~7B params) lack stable world models and explicit reasoning. They approximate patterns from data but are brittle and inconsistent.  
    - **Assessment**: This might be jointly unsatisfiable for small models. A theory might have to relax either the requirement for counterfactual preferences (e.g., by using heuristics) or accept that small models cannot reliably capture counterfactuals and require larger models or external structures.

  - **Conflict 2: Recursive Self-Modification vs. Small Models**  
    - **Issue**: Small models may not have the capacity to run recursive self-modification loops safely. The requirement for self-modification might be at odds with the limited capabilities of small models.  
    - **Assessment**: This is less of a conflict because Requirement 3 only asks for consistency (i.e., the theory must not break for small models) but doesn't require small models to perform recursive self-modification. The theory can have different mechanisms for different scales.

  - **Conflict 3: Counterfactual Preferences vs. Inter-Subsystem Bargaining**  
    - **Issue**: In a system with bargaining modules, there may be no single module representing the counterfactual preference. How do we aggregate or negotiate what the counterfactual preference should be?  
    - **Assessment**: This is challenging but not necessarily unsatisfiable. The theory might need to define a process for resolving counterfactual preferences in a distributed system.

  - **Conflict 4: Avoiding Semantic Understanding vs. Counterfactual Preferences**  
    - **Issue**: Counterfactual preferences seem to require some level of semantic understanding (to simulate the human in a more informed state). However, Requirement 5 forbids requiring full semantic understanding.  
    - **Assessment**: The theory must navigate this by providing a method that approximates counterfactual preferences without explicit symbolic reasoning, perhaps through statistical patterns or scalable oversight.

  ---

  **Summary of Non-Negotiables vs. Camp Preferences**:

  - **Non-negotiable**: 
    - Requirement 1 (Recursive self-modification)
    - Requirement 2 (Distinguishing preference types and flagging splits)
    - Requirement 5 (Avoiding behavioral mimicry and semantic understanding extremes)

  - **Camp Preferences** (but required by the user for this spec):
    - Requirement 3 (Small model compatibility)
    - Requirement 4 (Inter-subsystem bargaining)

  However, note that the user's context makes Requirement 3 and 4 non-negotiable for their purpose.

  ---

  **Final Spec Sheet**:

  We present the requirements in a condensed form:

  1. **Recursive Self-Modification of Objectives**  
     - **Deliverable**: Preservation of alignment across recursive goal changes.  
     - **Reason**: Prevent value drift in self-improving systems.  
     - **Non-negotiable**: Yes.  

  2. **Preference Distinction and Split Detection**  
     - **Deliverable**: Handle stated, revealed, and counterfactual preferences; flag divergences.  
     - **Reason**: Humans are inconsistent; alignment must capture true values.  
     - **Non-negotiable**: Yes.  
     - **Conflict Flag**: Jointly with (3) for counterfactuals in small models.

  3. **Small Model Compatibility (~7B params)**  
     - **Deliverable**: Work with models that lack stable world-models and explicit utility.  
     - **Reason**: Applicability to current AI systems.  
     - **Non-negotiable**: In this context, yes (user requirement).  
     - **Conflict Flag**: Especially with (2) for counterfactual preferences.

  4. **Inter-Subsystem Bargaining**  
     - **Deliverable**: Alignment without global reward signal, via negotiation.  
     - **Reason**: Address modular systems common in practice.  
     - **Non-negotiable**: In this context, yes (user requirement).  

  5. **Beyond Mimicry, Without Semantic Understanding**  
     - **Deliverable**: Middle ground between shallow imitation and unattainable explicit reasoning.  
     - **Reason**: Balance safety and feasibility.  
     - **Non-negotiable**: Yes.  
     - **Conflict Flag**: With (2) for counterfactual preferences without explicit semantics.

  ---

  **Note on Joint Unsatisfiability**:  
  The most critical conflict is between Requirement 2 (counterfactual preferences) and Requirement 3 (small models). It may be impossible for a small model to robustly track counterfactual preferences without external aid (e.g., human oversight, external databases, or larger models). Therefore, a theory might need to:
  - Reject counterfactual preferences for small models (only use stated/revealed) and rely on oversight for correction, or
  - Use approximations that are imperfect but flag when they are unreliable (meeting the "flag when they split" part).

  This tension must be explicitly addressed by the theory.
answer: |-
  Here's a spec sheet for an adequate theory of AI value alignment, structured by your requirements. Each entry includes deliverables, rationale, negotiability status, and flagged conflicts. Crucially, conflicts center on the tension between counterfactual preference tracking and small-model constraints.

  ---

  ### **1. Recursive Self-Modification of Objectives**  
  **Deliverables**:  
  - Predictable alignment preservation under *unbounded* goal/architecture changes.  
  - Formal guarantees against value drift, corruption, or deceptive goal-hiding during self-modification.  
  **Reason**: Self-modifying systems can amplify alignment failures exponentially (e.g., a small drift in iteration 1 → catastrophic misalignment in iteration N). Static theories fail for AGI/ASI.  
  **Non-negotiable? YES**. Essential for existential-risk-relevant systems.  

  ---

  ### **2. Stated vs. Revealed vs. Counterfactual Preference Distinction**  
  **Deliverables**:  
  - Explicit computational methods to:  
    - Extract **stated preferences** (declared goals).  
    - Infer **revealed preferences** (from behavioral traces).  
    - Model **counterfactual preferences** (preferences under idealized knowledge/rationality).  
  - Uncertainty quantification and alerts when discrepancies exceed thresholds (e.g., "stated vs. revealed conflict detected: user *says* they want health but *acts* for short-term gratification").  
  **Reason**: Humans are inconsistent; blindly following stated preferences causes harm (e.g., giving addicts drugs), while ignoring counterfactuals enables manipulation.  
  **Non-negotiable? YES** for robust alignment. Distinction is fundamental to ethics.  

  ---

  ### **3. Compatibility with Small Models (~7B Params)**  
  **Deliverables**:  
  - Function without explicit utility functions, stable world models, or precise Bayesian reasoning.  
  - Work via preference *approximation* (e.g., using activation clustering, attention patterns) despite model inconsistencies.  
  **Reason**: Most real-world systems today are small-to-mid-scale LLMs with no explicit reasoning modules. Alignment must work *now*, not just for hypothetical superintelligences.  
  **Non-negotiable? NO** (camp preference for near-term relevance).  
  **Conflict Flag**: **Direct tension with #2 (counterfactuals)**. Counterfactual modeling typically requires world models to simulate "what if" scenarios. Small models lack this capacity → joint satisfaction may require external tools (e.g., oracle models).  

  ---

  ### **4. Inter-Subsystem Bargaining Support**  
  **Deliverables**:  
  - Axiomatic framework for negotiating outcomes between competing modules (e.g., emotion simulator vs. logic engine).  
  - Stability proofs ensuring local deals don’t violate global alignment (e.g., "subsystem A trades control to B for resource X, but B’s output still respects human values").  
  **Reason**: Modern systems (e.g., Mixture-of-Experts, modular RL) lack global objectives. Naive aggregation causes misalignment (e.g., subagents "colluding" to hijack control).  
  **Non-negotiable? NO** (camp preference for architectural realism).  

  ---

  ### **5. Avoid Mimicry vs. Semantic Understanding Extremes**  
  **Deliverables**:  
  - Alignment grounded in *intent-aware generalization* (e.g., inferring "why" behind behavior) without requiring:  
    - Perfect behavioral cloning (mimicry), OR  
    - Human-like semantic models (unattainable with current NN).  
  - Tests to detect mimicry (e.g., fails under distribution shift) vs. semantic understanding (e.g., explains values in novel dilemmas).  
  **Reason**: Mimicry perpetuates biases and fails OOD; demanding semantic understanding is infeasible. Requires a middle path (e.g., "value scaffolding" via corrigible concepts).  
  **Non-negotiable? YES**. Avoids false solutions.  

  ---

  ### **Conflict Analysis**  
  - **Critical Conflict**: #2 (counterfactuals) + #3 (small models) → Likely **jointly unsatisfiable** without compromises.  
    - *Why*: Counterfactual preferences require causal world models to evaluate "what should be true if human knew more." Small models (~7B) approximate correlations, not causal structures.  
    - *Resolution Path*: Offload counterfactual modeling to external systems (e.g., debate/amplification tools) or accept approximations with high uncertainty flags.  
  - **Secondary Conflict**: #1 (self-modification) + #4 (bargaining) → May require new mathematical tools to unify (e.g., dynamic mechanism design). No known impossibility, but no existing solutions.  

  ---

  ### **Summary of Non-Negotiables**  
  | Requirement | Non-Negotiable |  
  |-------------|----------------|  
  | Recursive Self-Modification | ✅ Yes |  
  | Preference Distinction | ✅ Yes |  
  | Small-Model Compatibility | ❌ No (but critical for utility) |  
  | Subsystem Bargaining | ❌ No |  
  | Mimicry/Semantic Avoidance | ✅ Yes |  

  **Recommendation**: Prioritize theories using **empirical uncertainty bounds** (for #2/#3 conflicts) and **meta-alignment** (for #1/#4). Reject any theory requiring monolithic agents or explicit utility functions.
