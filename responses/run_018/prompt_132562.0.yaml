  The asymmetric category is Riley's clever move to depoliticize the concept. But Sam correctly pounces on the circularity - "bias" depends on your baseline view of existing institutions. When Riley labels Hungary's media council as asymmetric, Sam forces her to confront whether she'd say the same about left-wing reforms. This is where the user's request about normative premises becomes crucial.

  On omissions: both debaters skip foundational questions. The baseline issue (can hybrid regimes backslide?) matters for cases like Turkey pre-2017. And ignoring subjective public perception is a big gap - if citizens feel backsliding is happening, that signals legitimacy crises beyond institutional metrics.

