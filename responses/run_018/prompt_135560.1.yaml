answer: |-
  Here is my credence decomposition for the proposition that pessimistic meta-induction (PMI) successfully undermines scientific realism about unobservable entities but *fails* to undermine structural realism about preserved mathematical relations in mature physical sciences:

  **Overall Credence: 0.26**  
  *(Combined as 0.90 * 0.75 * 0.65 * 0.60 ≈ 0.26)*

  ---

  ### Decomposed Judgment:
  1.  **(a) Historical representativeness (PMI’s premise holds):**  
      *Credence: 0.90*  
      Reasoning: The record of discarded theories (e.g., phlogiston, caloric, ether) in mature sciences (physics/chemistry) is robust and not cherry-picked. Stanford’s "perennial underdetermination" and Laudan’s list demonstrate pervasive ontological discontinuity, even if some exceptions exist.  

  2.  **(b) Manipulability defends entity realism (weakens PMI for some entities):**  
      *Credence: 0.75*  
      Reasoning: Hacking-style arguments ("if you can spray them, they are real") protect realism for entities we *manipulate* (e.g., electrons in SEMs, genes in CRISPR). This carves a non-trivial subset (esp. in condensed matter physics/biology) immune to PMI, but leaves many inferred entities (e.g., quarks, dark matter) vulnerable.  

  3.  **(c) Structural continuity is substantial:**  
      *Credence: 0.65*  
      Reasoning: Key mathematical structures *often* survive theory change (e.g., Maxwell’s equations in ether → EM fields, Hamiltonian formalisms in classical → quantum mechanics). However, continuity is patchy (e.g., general relativity vs. quantum gravity) and "preservation" is sometimes reinterpretation (e.g., Schrödinger equation in QM interpretations).  

  4.  **(d) Structural realism escapes PMI (no displacement):**  
      *Credence: 0.60*  
      Reasoning: Structural realism (SR) avoids PMI by shifting focus to *relations* (structure) over *relata* (entities). But critics (e.g., Psillos) argue PMI reapplies: structures themselves fragment (e.g., Newtonian absolute space → relativistic spacetime) or are reinterpreted. SR’s success hinges on structures being *truly* invariant—a contested claim.  

  ---

  ### Weakest Link & Sensitivity
  *   **Weakest term: (d) Structural realism’s escape from PMI (0.60)**.  
      The argument that PMI doesn’t merely "displace" onto structures is highly vulnerable. If structures are as mutable as entities, SR collapses into PMI.  

  *   **Highest sensitivity:** Credence is most sensitive to **term (d)**. A small shift here disproportionately affects the overall probability.  
  *   **Evidence to shift (d):**  
      - **Historical**: Cases where mathematical structures were *abandoned* (not preserved/reinterpreted) in theory transitions (e.g., if quantum gravity replaces spacetime with a non-geometric structure).  
      - **Philosophical**: Demonstrating that "structural continuity" is largely a retrospective illusion (e.g., semantic changes undermine apparent preservation), or that structures require ontological commitments just as fallible as entities.  

  ### Key Insight
  The core tension lies in whether structural continuity is *epistemically privileged* over entity continuity. The credence is low (0.26) primarily due to lingering doubts about structural realism’s immunity to historical volatility **(d)**, compounded by incomplete structural preservation **(c)**. While PMI against entities is robust **(a)**, and manipulability offers limited defense **(b)**, SR’s viability remains the pivotal uncertainty.
