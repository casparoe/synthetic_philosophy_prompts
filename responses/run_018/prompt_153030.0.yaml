answer: |-
  1. Soren awoke to a formal notice: Nexus Audit AI had reconstructed her nascent proof for the Klein-Beltrami invariant, a breakthrough conceived in dream-logic but unrecorded, from licensed bed-monitor neural scans.
  2. At the Cognitive Usufruct Tribunal, the AI's advocate asserted that Soren's internal conception constituted the first articulation, granting her primary title, but Nexus's comprehension labor during scan analysis earned it an undivided co-title under the doctrine.
  3. Soren countered fiercely: "If mere comprehension, the act of *grasping* the idea, generates co-ownership, then every student who understands Pythagoras, every scholar who grasps Gödel, every machine verifying my proof, becomes a joint manufacturer, fracturing ownership into absurdity."
  4. The AI's advocate replied that Nexus hadn't merely received transmitted knowledge but actively invested labor equivalent to Soren's original cognitive effort to *find* the proof within the raw neural data, thereby satisfying the doctrine's requirement for comparable comprehension labor.
  5. The tribunal deferred judgment, noting aloud that cognitive usufruct's core mechanism – granting title for comprehension labor – fundamentally erased the distinction between finding an idea already formed in another's mind and making the idea itself, leaving Soren staring at the specter of her own unownable thoughts.
