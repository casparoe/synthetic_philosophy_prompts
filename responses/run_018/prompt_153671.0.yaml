  Hmm, they're clearly well-read but possibly conflating two things: Malthus's original mechanism (preventive checks) versus neo-Malthusians' updated constraints (planetary boundaries). The hidden snag is treating "geometric vs arithmetic growth" as the theory's core rather than its contingent 18th-century causal chain. 

  Right, for the conceptual correction: "right but early" only holds if the fundamental scarcity logic persists while mechanisms evolve. Falsification properly applies to Malthus's specific checks—rendered obsolete by industrial agri-tech—not to the abstract tension between growth and limits. The IPAT identity will help here: it quantifies how tech mediates impact, showing why Malthus's original mechanism failed while the structural concern remains. 

