prompt: |-
  hey so i just got bumped into teaching world history at a new school and the dept head wants a unit on industrialization. im running into this 'why britain and not china' framing everywhere — the needham question, great divergence, etc — and it feels like a lazy comparison but i cant pin down why. i need a decision procedre i can actually run in ten minutes before i put a comparative question into a lesson plan.

  turn the basic idea of a well-posed contrastive history question into a checklist for me: steps in order, what counts as passing each one, where i stop with a hard no, and where its just a values call i have to make myself. it needs to catch outcome-selection bias (treating britain as special because it already won), check whether the counterfactual 'china' is a real historical path or just an imaginary average of every society that didnt industrialize, and flag when the question hides a normative claim about progress or development. apply it to three cases: the classic britain-vs-china framing, a student asking why not the ottoman empire instead, and one where the procedre tells me the question is broken but id still want to teach it for other reasons. flag the spots where im just dressing up my own judgement as rules, and say what the checklist cant do. please no reading lists or citations — i wont have time and the kids wont care. im writing this on my phone between classes so keep it practical.
reasoning: |-
  Okay, the user is a teacher who's been suddenly assigned to teach world history and needs to create a unit on industrialization. They're encountering the "Why Britain and not China?" question frequently but feel it's a lazy comparison. They want a quick, practical checklist to evaluate such comparative history questions before including them in lesson plans. 

  First, I need to understand their pain points. They're short on time (writing on their phone between classes), needs something actionable in under 10 minutes, and wants to avoid academic jargon. They specifically mention three concerns: outcome-selection bias (assuming Britain was special because it succeeded), the counterfactual "China" being an unrealistic average, and hidden normative claims about progress.

  The user seems experienced enough to recognize problematic historiography but overwhelmed by sudden curriculum demands. Their request for "where I stop with a hard no" suggests they want guardrails, not just theory. The three test cases (Britain-China, Ottoman alternative, broken-but-useful question) indicate they're thinking pragmatically about classroom application.

  Hmm... the challenge is balancing rigor with usability. The checklist must:
  - Be sequential but not bureaucratic 
  - Flag fatal flaws (like treating "China" as monolithic)
  - Separate objective checks from judgment calls
  - Work for other comparisons (like their Ottoman example)
  - Explicitly state its limitations so they don't overtrust it

  I'm structuring it as a stoplight system (green/yellow/red) because that's visually intuitive for quick decisions. Each step targets their specific worries: 
  Step 1 kills anachronistic units (e.g., comparing Ming China to Victorian Britain) 
  Step 2 prevents treating losers as homogeneous blobs 
  Step 3 addresses their outcome-selection bias pet peeve 
  Step 4 surfaces hidden "progress" assumptions

  For their test cases: 
  - Britain-China clearly fails Step 2 (treating Qing as "China") and Step 3 (teleology). Red light. 
  - Ottoman alternative passes Step 1-3 but might stumble at Step 4 if framed as "failure." Yellow light. 
  - The "broken-but-useful" example (like "Why no Industrial Revolution in Ancient Greece?") deliberately fails Step 1 but could illustrate technological prerequisites. This models intellectual honesty about bending rules.

  Important to emphasize where the checklist is just scaffolding for their judgment (e.g., Step 4's "progress" call). And it can't replace context - it won't spot all Eurocentrism or determine pedagogical value. 

  Final touch: Naming it "R.E.A.L." makes it sticky for teaching. Acronyms help busy teachers recall steps (Relevant? Entities? Assumptions? Loaded?). Keeping explanations punchy since they're on mobile. Adding the "when to override" caveat respects their professionalism.
answer: |-
  Here's a **R.E.A.L. Question Checklist** (Relevant? Entities? Assumptions? Loaded?). Run it in 5-7 mins. Hard stops at **🚩**, judgment calls at *⚖️*.

  **R.E.A.L. Steps:**
  1.  **RELEVANT TIMEFRAME?**
      *   *Check:* Are both cases existing/coherent societies **in the same historical period** leading up to the outcome?
      *   *Pass:* Both existed concurrently (e.g., 18th-century Britain & Qing China).
      *   *🚩 Hard Stop:* If one didn't exist yet, ceased to exist, or is wildly anachronistic (e.g., "Why Britain and not Han Dynasty China?").
      *   *⚖️ Judgment:* Defining the exact "lead-up" period.

  2.  **ENTITIES COMPARABLE?**
      *   *Check:* Is the "other" entity **a specific, coherent historical actor/society**? Or a vague placeholder?
      *   *Pass:* Named polity, era, and core region (e.g., "Qing China c. 1750-1830", "The Ottoman Empire c. 1700-1800").
      *   *🚩 Hard Stop:* If it's a vague, essentialized, or averaged "Civilization" (e.g., just "China", "The East", "Non-Europe").
      *   *⚖️ Judgment:* How specific must the definition be? (Avoid "China" as a 4000-yr monolith).

  3.  **ASSUMPTIONS UNPACKED?**
      *   *Check:* Does the question **assume Britain's path was inevitable/normal**? Does it treat the "other" as inherently "failing"?
      *   *Pass:* Framing is neutral/open (e.g., "What factors enabled industrialization *first* in Britain?"). "Not X" is minimized.
      *   *🚩 Hard Stop:* Outcome-selection bias is core to the question (e.g., "Why did China *fail* to industrialize?" implies industrialization was expected/destined for them).
      *   *⚖️ Judgment:* Recognizing subtle teleology (progress = inevitable). Does the question *feel* like it starts from Britain's success?

  4.  **LOADED LANGUAGE?**
      *   *Check:* Does the question **smuggle in value judgments** about "progress," "backwardness," "superiority," or "development"?
      *   *Pass:* Uses neutral, descriptive terms (e.g., "industrial transformation," "economic change," "technological shift").
      *   *🚩 Hard Stop:* Uses inherently judgmental terms (e.g., "Why was China *backward*?", "Why couldn't the Ottomans *keep up*?", "Why was Britain more *advanced*?").
      *   *⚖️ Judgment:* Identifying subtle normative baggage (e.g., "stagnant," "traditional vs. modern," "rise of the West").

  **Apply the Checklist:**

  1.  **"Why Britain and not China?"**
      *   R: **Pass.** 18th-century both existed.
      *   E: **🚩 FAIL.** "China" is too vague/essentialized (Ming? Qing? Which region? Treats 4000 years as one entity). *Hard Stop.*
      *   A: **🚩 FAIL.** Implicitly assumes China "should have" or was expected to industrialize, starting from Britain's success. *Hard Stop.*
      *   L: **Likely Fail.** Often implies "progress" happened in the "right" place (Britain).
      *   **VERDICT:** **RED LIGHT.** Reject as posed. Reframe: "What specific conditions in 18th-century Britain enabled the Industrial Revolution to begin there?" *Then later:* "How did economic and social conditions in Qing China during the same period differ?"

  2.  **Student: "Why not the Ottoman Empire instead?"**
      *   R: **Pass.** Co-existing empires (Ottoman c. 1700-1800, Britain same period).
      *   E: **Pass (Conditional).** "Ottoman Empire" is a specific, coherent entity. *⚖️Ensure student defines timeframe.*
      *   A: **⚖️ Caution.** Depends *heavily* on phrasing. "Why not the Ottomans *instead*?" still implies it *could* have happened there first just as easily. Better: "What factors present in Britain were absent or different in the Ottoman Empire regarding industrialization?"
      *   L: **⚖️ Caution.** Avoid "decline," "stagnation," "failure to modernize." Focus on specific differences.
      *   **VERDICT:** **YELLOW LIGHT.** Can be used *if rigorously reframed* to avoid teleology and essentialism. Good opportunity to explore a different specific case.

  3.  **"Broken but Teachable" Example: "Why didn't Song Dynasty China have an Industrial Revolution?"**
      *   R: **🚩 FAIL.** Song Dynasty (960-1279) vs. Industrial Rev (c. 1760+). ~500-year gap. *Hard Stop.*
      *   E: **Pass.** "Song Dynasty China" is specific.
      *   A: **🚩 FAIL.** Extreme teleology - implies an industrial revolution was a plausible outcome for *any* "advanced" pre-modern society centuries earlier.
      *   L: **Likely Fail.** Implies Song China "should have" industrialized because it had tech.
      *   **VERDICT:** **RED LIGHT** by checklist. **BUT TEACH IT?** Yes, to illustrate *preconditions* (Song tech/economic dynamism) and debate *why* it didn't lead *then* to sustained industrialism (missing factors: scientific revolution? global markets? energy sources? institutional barriers?). Explain *why* the question is anachronistic but still historically interesting.

  **Where It's Your Judgment (⚖️):**
  *   Defining "Relevant" timeframe precision.
  *   Defining "Coherent Entity" specificity (Ottoman vs. "Islamic World").
  *   Spotting *subtle* teleology or outcome bias.
  *   Identifying *subtle* normative language.
  *   Deciding to override a "Red Light" for pedagogical reasons (like the Song example).

  **What the Checklist CAN'T Do:**
  *   Guarantee the question leads to good answers.
  *   Provide the actual historical content/complexity.
  *   Eliminate all Eurocentrism (it helps, but deep critique needs more).
  *   Solve massive historiographical debates (Great Divergence).
  *   Judge if the question is *pedagogically useful* for your specific students/age group – that's always your call.

  **Run this before writing the question into the plan:**  
  1. Write your draft question.  
  2. Run R.E.A.L. steps sequentially.  
  3. Hit a **🚩**? Stop and reframe or ditch.  
  4. Hit **⚖️**? Decide if you can mitigate the issue with wording.  
  5. No 🚩? Check language for neutrality. Go.
