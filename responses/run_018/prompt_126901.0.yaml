answer: |-
  ### Exam Question  
  **Philosophy of Economics: Final Exam Essay (45 minutes, ~800 words)**  

  > **Case Analysis:** Consider an agent who, when presented with pairwise choices between options X and Y, consistently selects X and states: "X better serves my welfare than Y." However, when offered a menu containing X, Y, and a clearly dominated decoy Z (where Z is inferior to both X and Y in all attributes), the agent selects Y. She explains: "My welfare ordering is unchanged—I still believe X enhances my welfare more than Y. But in menus with decoys like Z, I follow a self-imposed decision rule: I refuse to make choices sensitive to potential regret. Selecting X when Z is present might trigger regret because Z’s inferiority highlights forgone alternatives. This rule applies *only* when a decoy exists to activate its scope conditions."  
  >  
  > **Prompt:** Using first principles of revealed preference theory (RPT), analyze whether:  
  > (1) RPT *must* interpret the shift from choosing X to Y as a change in the agent’s underlying preferences;  
  > (2) RPT can non-circularly accommodate the agent’s self-interpretation (stable welfare ordering + context-dependent rule);  
  > (3) This case challenges the claim that "utility is revealed by choice" rather than constructed theoretically by the observer.  

  ---

  ### Model Answer (800 words)  

  #### (1) RPT’s Interpretation of Preference Change  
  Revealed preference theory (RPT) equates choice with preference: if X is chosen over Y in a pairwise menu, RPT infers "X is preferred to Y." When the agent chooses Y over X in the {X,Y,Z} menu, RPT *must* interpret this as "Y is revealed preferred to X" in that menu. Since preferences in RPT are defined solely by choices *within specific menus*, the theory cannot recognize a "stable welfare ordering" independent of menu-dependent choices. The shift from choosing X in pairwise comparisons to Y in the ternary menu constitutes a violation of RPT’s *contraction consistency* axiom (Property α): if Y is chosen from {X,Y,Z}, then Y should be chosen from any subset containing Y and X (i.e., {X,Y}). RPT treats this violation as evidence of unstable preferences, not a procedural rule. Thus, RPT is forced to conclude preferences changed.  

  #### (2) Non-Circular Accommodation of the Agent’s Account  
  RPT cannot accommodate the agent’s self-interpretation without circularity or abandoning core axioms. The agent claims her *welfare ordering* (X ≻ Y) is stable, but her *choice rule* changes with menu context. RPT lacks the conceptual machinery to separate "true preference" from "choice procedure." To reconcile the choices, RPT must either:  
  - **Reject the explanation as irrelevant**, insisting choices alone define preferences (rendering the agent’s introspection inadmissible).  
  - **Re-define preferences as menu-dependent**, treating "preference for Y in {X,Y,Z}" as a distinct preference from "preference for X in {X,Y}." This contradicts the agent’s claim of stable welfare and reduces RPT to a tautology: choices reveal "menu-specific preferences," which are defined *by* those same choices.  
  The agent’s rule ("avoid regret when decoys exist") requires knowledge of *why* Z was included—a factor external to choice data. RPT, which forbids appeals to psychological states, can only "accommodate" the rule by retroactively attributing a new preference to the agent (e.g., "prefers following rules over welfare maximization"). This circularly uses the choice to define the preference that "explains" the choice.  

  #### (3) Utility: Revealed or Constructed?  
  This case challenges RPT’s view that utility is "revealed" by choices. The agent insists utility (welfare) is *not* reflected in her ternary menu choice—her selection of Y reveals a *decision rule*, not a utility ranking. For the observer, however, utility must be *constructed* theoretically:  
  - **Revealed Utility Claim**: RPT asserts utility is *observed* in choices (e.g., choosing X reveals U(X) > U(Y)).  
  - **Constructivist Critique**: Here, choices under identical options ({X,Y}) yield contradictory utility inferences depending on the menu. The observer must *theorize* that the decoy Z activates a rule, then *construct* utility from pairwise choices while dismissing the ternary choice as "noise." This requires auxiliary assumptions (e.g., "rules override utility maximization") unsupported by choice data alone. Utility thus becomes a theoretical construct reconciling choices with psychological narratives, not a direct revelation.  
  RPT’s methodology collapses: choices only "reveal" utility after the observer imposes a framework (e.g., "ignore choices in decoy-rich menus") that *cannot* be derived from choices themselves. The agent’s stable welfare ordering is accessible only via her testimony—a non-choice datum RPT excludes.  

  **Conclusion**: The case demonstrates RPT’s inability to distinguish between preference changes and stable preferences with context-dependent rules using choice data alone. It forces RPT into either inconsistency (violating its axioms) or circularity (defining preferences via choices they explain). Ultimately, utility must be constructed by the observer using non-choice information, undermining RPT’s positivist claim that utility is "revealed" purely by choices.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **A-Grade (17–20 marks)** must include:  
  1. **RPT’s Forced Interpretation** (4 marks):  
     - Identifies violation of contraction consistency (Property α) as necessitating a preference change in RPT.  
     *Error penalty*: Omitting Property α (-2); Failing to link choice shift to axiom violation (-2).  
  2. **Circularity in Accommodation** (6 marks):  
     - Explains why RPT cannot separate procedural rules from preferences without tautology (e.g., menu-specific preferences).  
     - Rejects appeals to psychological states as non-RPT-compliant.  
     *Error penalty*: Claiming RPT can "add" rules without circularity (-3); Ignoring menu-dependence (-2).  
  3. **Utility Revelation vs. Construction** (6 marks):  
     - Contrasts RPT’s "utility revealed by choice" with the observer’s need to construct utility using non-choice data (e.g., the decoy’s role).  
     - Argues that dismissing the ternary choice as "rule-driven" requires theoretical assumptions beyond choice data.  
     *Error penalty*: Equating revealed utility with ordinal choice (-3); Ignoring observer’s interpretive role (-2).  
  4. **Synthesis** (4 marks):  
     - Concludes that RPT cannot handle stable preferences with context-sensitive rules, forcing utility to be a construct.  
     *Error penalty*: Restating the case without theoretical implications (-2).  

  **B-Grade (13–16 marks)** achieves:  
  - Points 1 and 3 fully addressed, but incomplete on circularity (e.g., misses menu-dependence) OR  
  - All points covered but with minor errors (e.g., misstates Property α) OR  
  - Lacks synthesis, ending with a summary of RPT limitations without linking to utility-as-construct.  

  **C-Grade (9–12 marks)**:  
  - Addresses only two points (e.g., preference change and circularity) superficially.  
  - Major errors: E.g., Claims agent "truly prefers Y" (-4); Assumes RPT can incorporate rules ad hoc (-3).  

  **D/F-Grade (0–8 marks)**:  
  - Misrepresents RPT (e.g., "preferences cause choices" without axioms) OR focuses on regret psychology.  
  - Omits >1 core section.  

  ---  
  This question challenges students to dissect RPT’s epistemology using a non-standard case, rewarding analytical rigor over memorization while adhering to your constraints.
