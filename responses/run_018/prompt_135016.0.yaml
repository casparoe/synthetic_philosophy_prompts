prompt: |-
  hey, i'm trying to map my advisor's implicit framework for intergenerational climate ethics from the seminar verdicts she's given over the past year. here's the track record so far:

  - she said taxing carbon now is required to protect specific populations in 2100, even if that means smaller populations
  - she okayed a solar geoengineering plan that shifts rainfall and changes who gets born in 2200, but only because expected wellbeing goes up and there's basically zero runaway risk; she rejected an otherwise identical version with a 5% permafrost cascade chance
  - she said delaying decarbonization is wrong when it lowers welfare for whoever actually lives in 2100, but she was insistant that the wrongness isn't "harming those particular people" since they wouldn't exist under the fast path — she kept framing it as the world just being worse overall
  - she also said if a policy makes future people worse off without changing who they are, that's clearly forbidden

  so she's running some mix of person-affecting constraints, total-welfare evaluation, and maybe a catastrophic-risk side condition? or a cross-generational contractualist test? i can't tell.

  new workshop case: there's a proposal for a "lineage-targeted resilience bond" where predictive demographic models direct climate adaptation spending only to regions where specific genetic lineages are forecast to live in 2080. this shifts migration and therefore who gets born. the people who do exist have decent lives, aggregate welfare is slightly lower than universal adaptation, and climate risk stays well below catastrophic thresholds — maybe 1.8 degrees, no tipping points.

  what do you think she'll say? is she on a pure person-affecting rule plus risk constraint, straight expected-welfare maximization across identities, or something contractualist? which prior verdict is teh closest analog? and if her record genuinely underdetermines this, what principle is she adopting with each choice? also, what's the further case that'd actually settle between the rules?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're trying to map their advisor's implicit framework for intergenerational climate ethics based on her past seminar verdicts. The user provided four key decisions, and now they have a new workshop case about a "lineage-targeted resilience bond" and want to predict the advisor's response. 

  First, I need to analyze each of the advisor's past verdicts to identify patterns. The first point: taxing carbon now is required to protect specific populations in 2100, even if it means smaller populations. That suggests she prioritizes the well-being of future individuals over population size. So she might lean towards a person-affecting view but with a focus on welfare rather than existence itself.

  Next, the solar geoengineering cases. She approved a plan with increased well-being and no runaway risk but rejected it with a 5% permafrost cascade chance. This indicates a strong aversion to catastrophic risks, even if the expected welfare is higher. So risk constraints are crucial here, possibly as a side constraint to welfare maximization.

  The third point about delaying decarbonization is tricky. She says it's wrong because it lowers welfare for the people in 2100, but not because it harms specific individuals since they wouldn't exist otherwise. She frames it as the world being worse overall. That points to a non-person-affecting total welfare view. The wrongness stems from lower aggregate welfare, not harming particular people. 

  The fourth verdict: making future people worse off without changing who they are is forbidden. That's a clear person-affecting principle. So there's a tension here between total welfare and person-affecting constraints. 

  Putting this together, the advisor seems to blend person-affecting principles (when identities are fixed) with total welfare maximization (when identities change) and adds a catastrophic risk constraint. This hybrid model explains her decisions. For the new case, lineage-targeted bonds change who exists, so the total welfare framework applies. But aggregate welfare is slightly lower than universal adaptation. Even without catastrophic risks, she might reject it because total welfare is lower. 

  The user also wants a case to differentiate between theories. A scenario where person-affecting and total welfare conflict without risk factors would be ideal. For example, a policy that increases total welfare but leaves some worse off versus one that maintains welfare but prevents harm to specific individuals. Her choice would reveal whether person-affecting constraints override total welfare or vice versa.

  I should also consider the user's deeper needs. They're likely preparing for a workshop or thesis work, needing to anticipate their advisor's feedback. Understanding her framework helps them align their arguments. They might also seek clarity on ethical theories for their own research. The advisor's hybrid approach suggests practical ethics where different principles apply contextually. Highlighting the unresolved tension between theories provides the user with avenues for further exploration or discussion in their workshop.
answer: |-
  Based on your advisor's consistent pattern of verdicts, here's the breakdown of her likely framework and prediction for the lineage-targeted bond case:

  ### Your Advisor's Implicit Framework (Best Fit)

  1.  **Core Foundation: Non-Identity Sensitive Total Welfare Maximization (with a twist):** Her insistence that delaying decarbonization is wrong *because the world is worse overall* (not because specific people are harmed), combined with accepting identity-altering geoengineering *if* welfare increases, points strongly towards a **Total View** (maximizing the sum of welfare across all future people, regardless of who they are or if their existence is contingent on the policy). This explains verdicts 1, 2 (approved), and 3.
  2.  **Person-Affecting Constraint (Only When Identities Are Fixed):** Verdict 4 ("clearly forbidden" to make specific future people worse off without changing who they are) acts as a **side-constraint** on the total welfare maximization. *Only when the identities of the affected individuals are fixed* does she invoke a strong "do not harm" principle. This explains the stark difference in framing between verdicts 3 and 4.
  3.  **Catastrophic Risk Threshold:** Her rejection of the geoengineering plan with 5% catastrophic risk, despite higher expected welfare, shows a **non-linear, threshold-based aversion to existential or civilizational collapse risks**. This acts as a veto condition overriding welfare calculations when triggered. Expected welfare maximization only applies *below* this risk threshold.
  4.  **No Strong Contractualism:** Her reasoning doesn't emphasize mutual justification between generations, hypothetical agreements, or the "standpoint" of specific future individuals in a way characteristic of contractualism. Her focus is on aggregate outcomes (welfare sum, catastrophe avoidance) and specific harm only when identities are locked in.

  **In short: She runs *Total Welfare Maximization*, subject to a *No-Harm Constraint for Fixed-Identity Future People* and a *Catastrophic Risk Veto*.**

  ### Prediction for the Lineage-Targeted Resilience Bond

  *   **She will REJECT the proposal.**
  *   **Reasoning Analogy:** Closest to **Verdict 3 (Delayed Decarbonization)**.
  *   **Why:**
      *   **Identity Change:** The policy shifts migration and changes who is born (like delayed decarbonization and the geoengineering plans). Identities aren't fixed.
      *   **Total Welfare Decrease:** Aggregate welfare is *slightly lower* than the universal adaptation alternative. This directly violates her core total welfare maximization principle (like delayed decarbonization making the future world "worse overall").
      *   **No Fixed-Identity Harm:** Since identities change, the "clearly forbidden" harm constraint (Verdict 4) doesn't apply. The wrongness stems from the lower aggregate welfare sum.
      *   **No Catastrophic Risk Trigger:** Climate risk stays below catastrophic thresholds (1.8C, no tipping points), so the risk veto doesn't apply.
  *   **What She Won't Care About (in this framework):**
      *   The fact that the people who *do* exist have "decent lives" – the comparison is against the *better* lives under universal adaptation (higher total welfare).
      *   The targeting based on genetic lineages *per se* – unless she raises separate justice/equity concerns, her ethical verdict here is driven by the lower aggregate welfare outcome resulting from the identity shift.
      *   The fact that it avoids catastrophe – that's necessary but not sufficient; welfare maximization still applies.

  ### Underdetermination & Clarifying Cases

  Her record *does* strongly point towards the hybrid framework above. However, the tension between the Total View (when identities change) and the Person-Affecting Constraint (when identities are fixed) is inherent. To definitively pin down the *priority* or *weight* of these elements relative to each other in edge cases, propose these:

  1.  **The "Slightly Worse Fixed Population" vs. "Much Larger Satisfied Population" Case:**
      *   *Policy A:* Harms no one (fixed identities), but results in a small population (1 billion) with high average welfare (say, 100 utils each). Total Welfare = 100 billion utils.
      *   *Policy B:* Changes who exists (non-identity affecting), results in a much larger population (10 billion) with slightly lower average welfare (say, 11 utils each). Total Welfare = 110 billion utils.
      *   *Question:* Which does she prefer? If she strictly follows the Total View, she *must* choose B (110b > 100b). If she prioritizes the Person-Affecting intuition *even when identities change* (a form of the "Mere Addition Paradox"), she might choose A to avoid creating lives only just worth living compared to the excellent lives under A. Her choice here reveals if Total Welfare *truly dominates* when identities change, or if she has a weaker aversion to creating lesser-wellbeing lives.

  2.  **The "Catastrophe-Averting Harm to Fixed Identities" Case:**
      *   *Policy:* Averts a near-certain civilizational collapse (catastrophe risk reduced from 99% to 1%) but *requires* making a specific, fixed-identity future generation significantly worse off (e.g., drastic austerity, lower welfare) than they otherwise would have been *without* the collapse.
      *   *Question:* Is this permissible? Her risk veto demands catastrophe aversion. Her Verdict 4 constraint forbids harming fixed-identity future people. Which principle wins? Does averting catastrophe *justify* violating the "do not harm fixed identities" constraint? This tests the absolute strength of Verdict 4.

  **Conclusion:** Your advisor consistently applies a **Total Welfare Maximization framework** underlaid by a strong **Person-Affecting "No Harm" Constraint that only activates when future identities are fixed**, and overlaid with a **Catastrophic Risk Veto**. For the lineage bond, the identity shift + lower total welfare combination makes rejection highly likely, analogous to her verdict on delayed decarbonization. The clarifying cases above would probe the boundaries and relative weights within her hybrid framework. Good luck with the workshop!
