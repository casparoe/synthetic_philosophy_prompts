answer: |-
  ## Rigorous Practice Exam Question: Moral Psychology (Weakness of Will & Hyperbolic Discounting)

  **Essay Question (45 minutes):**

  "Hyperbolic discounting is frequently invoked to explain weakness of will (akrasia). Critically evaluate whether this model provides a genuine *explanation* for **synchronic akrasia** – instances where an agent acts against their own *concurrent*, better judgment – or whether it merely provides an elegant redescription of **diachronic preference reversal** (changing preferences as an outcome draws near). Defend a clear position on whether hyperbolic discounting *succeeds* or *fails* as an explanation for synchronic akrasia, providing explicit reasoning. Address one serious objection to your position."

  ---

  **Model Answer (Approx. 500 words):**

  Hyperbolic discounting, the observed tendency to disproportionately favor smaller, sooner rewards over larger, later ones as the smaller reward becomes imminent, is a powerful model for *diachronic* preference reversal. It explains why we might abandon a long-term plan (e.g., saving money) when faced with a tempting immediate alternative (e.g., an impulse purchase). However, it fails to provide a genuine explanation for **synchronic akrasia** – acting against one's *present*, all-things-considered judgment *at the very moment of action*.

  The core reason for this failure lies in the **temporal structure** essential to hyperbolic discounting. The model describes a *change in preference ordering* driven by the *passage of time* bringing a smaller reward closer. Synchronic akrasia, by definition, occurs *within a single temporal frame*. The agent judges action A (e.g., refusing dessert) best *now*, yet simultaneously performs action B (eating the dessert) *now*. Hyperbolic discounting presupposes a shift in valuation *over time*; it cannot account for why, at time T, the agent assigns higher motivational force to the option they simultaneously judge *inferior* at T. The model describes how preference *for the future* changes as the future becomes the present, but it doesn't illuminate the *present conflict* where judgment and action diverge *without temporal mediation*.

  Consider a classic synchronic case: An agent standing before a decadent dessert judges, *all things considered at this very moment*, that refraining is best (due to health commitments, prior resolutions, etc.). Yet, they eat it. Hyperbolic discounting might describe a prior *diachronic* shift – perhaps earlier in the day, the abstract health goal felt distant, and the dessert's proximity later caused a preference reversal favoring indulgence. But this is irrelevant to the *synchronic* moment. *At the moment of eating*, the agent still judges refraining best. Hyperbolic discounting explains why the dessert became overwhelmingly tempting *now* compared to *yesterday*, but it doesn't explain why the agent acts against their *current, simultaneous* judgment that refraining is superior. The akratic action violates the agent's *concurrent* evaluative standard, a conflict hyperbolic discounting, focused on intertemporal preference instability, doesn't address mechanistically.

  **Objection:** One might argue that synchronic akrasia is merely the *endpoint* of a diachronic hyperbolic discounting process. The preference reversal happens just milliseconds before action, making the akrasia *effectively* synchronic, but still explained by the temporal proximity mechanism.

  **Reply:** This objection conflates temporal proximity with synchronicity. Even if the preference shift occurs milliseconds prior, it remains a *diachronic* event – a change over a tiny time interval. Genuine synchronic akrasia requires a failure of *motivational integration* at a single time-slice: the agent has a decisive judgment for A *and* a decisive motivation for B *at the same time T*. Hyperbolic discounting, describing a *process* where motivation for B *replaces* motivation for A as B nears, cannot model this simultaneous conflict; it only models *replacement*. The objection reduces synchronic akrasia to an illusion created by rapid diachronic shifts, failing to capture the core philosophical puzzle of concurrent judgment-action divergence. Thus, hyperbolic discounting provides a powerful account of diachronic weakness but fundamentally misdescribes and fails to explain synchronic akrasia.

  ---

  **Detailed Marking Scheme (Total: 20 Points)**

  Top answers (17-20) will demonstrate precise conceptual grasp, clear argumentation, and critical engagement. Adequate answers (12-16) will cover core points but lack depth, precision, or force in argument.

  1.  **Distinguishes Synchronic & Diachronic Akrasia (4 pts):**
      *   **Top (4):** Clearly, accurately, and explicitly defines both concepts, emphasizing the *concurrent judgment vs. action* conflict for synchronic akrasia and the *change in preference over time* for diachronic reversal. Uses the distinction actively to structure the argument.
      *   **Adequate (2-3):** Mentions the distinction but definition may be fuzzy or not actively used. Might conflate the two.
      *   **Common Failure:** Vague or incorrect definitions (e.g., confusing synchronic with "acting now"). Treating all akrasia as essentially diachronic/future-oriented. Failing to emphasize the simultaneity of judgment and action conflict in synchronic cases.

  2.  **Identifies Hyperbolic Discounting's Core Mechanistic Prediction (4 pts):**
      *   **Top (4):** Accurately explains hyperbolic discounting as a model of *intertemporal preference reversal* driven by the *changing temporal proximity* of rewards (disproportionate preference for nearer rewards *as they get closer*). Explicitly links this mechanism to explaining *diachronic* cases.
      *   **Adequate (2-3):** Describes hyperbolic discounting generally (preferring smaller sooner rewards) but may not precisely articulate the *mechanism* (temporal proximity driving reversal) or its inherent *diachronic* nature.
      *   **Common Failure:** Misrepresenting hyperbolic discounting (e.g., as simple impulsivity or lack of willpower without the temporal reversal element). Failing to see its core prediction is *change over time*.

  3.  **States Clear Thesis & Defends with Explicit Reasoning (5 pts):**
      *   **Top (5):** Takes a definitive stance (e.g., "Hyperbolic discounting fails to explain synchronic akrasia"). Provides *explicit, well-structured reasoning* focused on the core argument: Synchronic akrasia requires explaining conflict *at a single time*, while hyperbolic discounting inherently explains change *over time*. Uses a relevant example effectively.
      *   **Adequate (3-4):** States a position but reasoning may be less clear, less focused on the temporal mismatch, or less well-developed. Example might be present but not fully integrated.
      *   **Common Failure:** Summarizes concepts without taking a clear position. Provides weak or irrelevant reasoning. Fails to center the argument on the *temporal structure mismatch* (synchronic conflict vs. diachronic explanation).

  4.  **Engages Seriously with One Objection (4 pts):**
      *   **Top (4):** Identifies a plausible, relevant objection (e.g., synchronic as rapid endpoint of diachronic shift). Provides a substantial, targeted counter-reply that directly addresses the objection's core claim, reinforcing the main thesis (e.g., explaining why even rapid change is still diachronic and misses simultaneous conflict).
      *   **Adequate (2-3):** Identifies an objection but it may be weak or only partially relevant. Reply exists but may be superficial, miss the point, or not effectively counter the objection.
      *   **Common Failure:** Ignoring the requirement to address an objection. Offering a trivial or straw-man objection. Replying by simply restating the original thesis without engaging the objection's substance.

  5.  **Avoids Conflating All Akrasia with Future-Oriented Self-Control (3 pts):**
      *   **Top (3):** Demonstrates awareness throughout that the essay's focus is on synchronic akrasia *as distinct from* future-oriented self-control problems. Avoids framing synchronic cases solely in terms of failing to resist future temptation. Accurately locates hyperbolic discounting's strength in diachronic/future cases.
      *   **Adequate (1-2):** Mostly avoids conflation but might slip into future-oriented language for synchronic cases occasionally, or not consistently highlight the distinction.
      *   **Common Failure:** Treating synchronic akrasia (e.g., eating dessert *now* against *current* judgment) as primarily a failure of resisting a *future* temptation or a lapse in long-term planning. Assuming hyperbolic discounting *must* apply because weakness involves temptation.

  **Overall Clarity, Structure, and Cohesion** will also be considered holistically when assigning the final mark within each band.
