prompt: |-
  I work as a senior mediator at a community justice center that has adopted an Ubuntu-informed framework for resolving interpersonal and collective disputes, but we operate under a statutory charter that also protects individual rights to autonomy, privacy, and non-participation. Our caseworkers need a reusable decision procedure—not a philosophical essay—to determine, for any given dispute, whether the harm should be addressed primarily through relational restoration (repairing the interdependent fabric that constitutes the parties’ personhood) or through individual rights-based redress (compensation, exclusion, or legal adjudication). The principle to operationalize is that personhood is relationally constituted: an injury is not merely a private loss but a rupture in the web of recognition and obligation that makes each party who they are. Yet the procedure must preserve the distinction between harm done to a relation and harm done through a relation, must recognize when an offender denies the relational frame entirely, and must never override a party’s non-derogable boundary merely to restore communal harmony.

  Please translate this into a step-by-step procedure that a caseworker with no philosophical training can run in about forty-five minutes, including: the ordered questions to ask; what counts as a sufficient answer to each; the explicit points where judgment is unavoidable and must be signed off by a senior mediator rather than automated; and the conditions under which the procedure stops with a definitive recommendation, stops with a referral to legal arbitration, or stops with a value judgment that requires human sign-off. The procedure should handle cases where the victim demands exclusion despite viable repair, where the offender refuses to acknowledge relational obligation, and where the relational harm extends to third-party community members who are not direct parties. Apply it to three worked cases: (1) a workplace racial-slur incident in which the offender accepts relational responsibility and seeks to repair, but the victim demands termination and refuses any mediated encounter; (2) a communal water-access dispute in which one party treats the conflict as purely transactional and denies that relationships are relevant; and (3) a family inheritance conflict involving concealed assets, where relational repair requires disclosure that one party considers a protected privacy boundary. In at least one of these, the procedure should yield a recommendation that runs counter to the center’s relational ethos—please flag exactly where and why. Finally, state clearly what this procedure cannot do: which categories of dispute lie outside its scope, which moral disagreements it cannot resolve, and where it is likely to misfire if applied mechanically.
reasoning: |-
  We are creating a step-by-step procedure for caseworkers to determine whether a dispute should be addressed through relational restoration or individual rights-based redress. The procedure must be practical and take about 45 minutes. It must account for the Ubuntu principle that personhood is relationally constituted, while also respecting individual rights and boundaries.

  Key considerations:
  1. An injury is a rupture in the web of recognition and obligation.
  2. We must distinguish between harm done to a relation (which can be repaired) and harm done through a relation (which might require rights-based redress).
  3. If an offender denies the relational frame entirely, that affects the approach.
  4. Non-derogable boundaries (absolute rights) cannot be overridden for communal harmony.

  The procedure will have steps with specific questions, criteria for answers, and decision points. It will specify when a senior mediator must sign off and when the procedure stops with a recommendation, referral to arbitration, or requires human judgment.

  Procedure Steps:

  1. **Initial Assessment: Identify the Harm and Parties Involved**
     - Ask: "What is the specific harm that occurred? Who are the direct parties and are there affected third parties or the broader community?"
     - Sufficient answer: A clear description of the incident(s) and a list of individuals or groups involved. Note if there are third parties or the community at large.
     - Judgment point: If the harm involves criminal activity (e.g., assault, theft) that requires legal intervention, stop and refer to legal authorities. Also, if the harm is ongoing and immediate protection is needed, prioritize rights-based redress and possibly legal intervention.

  2. **Determine Relational Context**
     - Ask: "What is the nature of the relationship between the parties before the harm? (e.g., familial, neighborly, professional, casual) How interdependent were they? How essential is this relationship to the well-being and identity of the parties and the community?"
     - Sufficient answer: Description of the relationship's depth, interdependence, and importance to the parties' identities and community. If the relationship is minimal (e.g., strangers) or the harm is a one-time transaction, it might lean toward rights-based.
     - Judgment point: If the parties have no prior relationship and no ongoing interdependence, the case may be more suitable for rights-based redress. If the relationship is central to the parties' identities and community, relational restoration is more indicated.

  3. **Assess the Nature of the Harm**
     - Ask: "Was the harm primarily done to the relationship (e.g., betrayal of trust) or through the relationship (e.g., using a position of trust to exploit)?"
     - Sufficient answer: Clear distinction between harm that damages the relational fabric (e.g., broken trust) and harm that uses the relationship as a tool (e.g., fraud). Also, note if the harm has caused a rupture in the broader web of recognition (e.g., a public act that shames or dehumanizes).
     - Judgment point: If the harm was done through the relationship (e.g., abuse of power), it may require rights-based redress to protect the victim. If the harm is to the relationship and both parties are willing to engage, relational restoration is possible.

  4. **Evaluate Parties' Stance on Relational Frame**
     - Ask: "Does the offender acknowledge the relational obligations (i.e., that their actions affected the shared fabric of personhood)? Does the victim see the harm as a relational rupture?"
     - Sufficient answer: Yes/No from each party. If the offender denies any relational obligation, note that. If the victim does not see the harm as relational, note that.
     - Judgment point: 
       - If the offender denies the relational frame entirely, move toward rights-based redress because relational restoration requires mutual recognition.
       - If the victim refuses any relational repair (e.g., demands exclusion), then rights-based redress is likely necessary. However, if the victim's refusal is based on fear or trauma, consider safety measures and rights-based redress.

  5. **Check for Non-Derogable Boundaries**
     - Ask: "Are there any non-negotiable boundaries being invoked by either party (e.g., physical safety, core privacy, autonomy) that would be violated by a relational process? Specifically, would relational restoration require crossing any such boundary?"
     - Sufficient answer: Identify specific boundaries (e.g., "I cannot be in the same room with the offender," "I will not disclose my financial records," "I need a restraining order").
     - Judgment point: If relational restoration would require violating a non-derogable boundary (as defined by the center's charter, such as the right to refuse participation, privacy, or physical safety), then rights-based redress must be pursued. This step requires senior mediator sign-off because it involves interpreting non-derogable boundaries.

  6. **Assess Community Impact**
     - Ask: "How has the harm affected the broader community? Is there a community interest in restoration that might outweigh individual preferences? Are third parties directly harmed?"
     - Sufficient answer: Description of community impact and whether third parties are involved. If the harm has caused widespread fear or division, community restoration might be indicated even if the direct victim is reluctant. However, individual boundaries must still be respected.
     - Judgment point: If the community impact is severe and the offender is willing to repair, but the victim refuses, the caseworker must weigh community restoration versus individual rights. This is a critical judgment point requiring senior mediator sign-off. The procedure cannot override an individual's non-derogable boundary for community harmony.

  7. **Decision Tree:**
     - After steps 1-6, follow this tree:
       a. If the harm is criminal or ongoing: Stop and refer to legal arbitration/authorities.
       b. If the offender denies the relational frame entirely: Recommend rights-based redress.
       c. If the victim demands exclusion and refuses any encounter, and the harm does not have severe community impact: Recommend rights-based redress (but note: if community impact is severe, go to step d).
       d. If the victim refuses relational repair but the community impact is severe (and the offender is willing), then consider community-led restoration without the victim's participation? But note: the victim's non-derogable boundaries (like refusing to participate) must be respected. Therefore, if the victim refuses, we cannot force them. In such cases, the restoration would be between the offender and the community, without the victim. However, if the victim is an essential part of the community and their absence would undermine restoration, then rights-based redress for the victim and separate community restoration might be needed. This is complex and requires senior mediator sign-off.
       e. If relational restoration would violate a non-derogable boundary (e.g., forced disclosure of private information, forcing a meeting against a party's will): Recommend rights-based redress.
       f. Otherwise, if the harm is to the relationship, both parties (or the community) see it as relational, and no boundaries are violated by the process, recommend relational restoration.

  8. **Stopping Conditions:**
     - Definite recommendation: When the decision tree leads to a clear path (a, b, c, e) without ambiguity.
     - Referral to legal arbitration: When the harm is criminal, when the center lacks jurisdiction, or when the parties cannot agree and the dispute requires a binding decision.
     - Value judgment requiring human sign-off: At judgment points (as noted in steps 1, 3, 5, 6) and when the decision tree reaches complex scenarios (like d above) that involve balancing community impact against individual rights.

  Worked Cases:

  **Case 1: Workplace racial-slur incident**
  - Offender accepts responsibility and seeks repair. Victim demands termination and refuses mediation.
  - Step 1: Harm is racial slur in the workplace. Parties are coworkers, so there is a professional relationship. Third parties: other coworkers and the organization are affected.
  - Step 2: Relationship is professional and interdependent (workplace). Important to the community (workplace harmony).
  - Step 3: Harm was done through the relationship (using the workplace setting to demean) and to the relationship (rupture in trust and respect). It is both, but the racial aspect makes it a harm through the relationship (abuse of power dynamics).
  - Step 4: Offender acknowledges relational obligations. Victim does not see the harm as repairable relationally and refuses any encounter.
  - Step 5: Victim's demand for exclusion and refusal to participate is a non-derogable boundary (autonomy and right to non-participation). Forcing the victim to participate would violate this.
  - Step 6: Community impact is high (workplace is divided, other employees feel unsafe). But the victim's boundary is absolute.
  - Decision: Because of step 5 (non-derogable boundary violated by relational restoration) and step 4 (victim refuses), the procedure goes to rights-based redress (compensation, termination). This might run counter to the center's relational ethos because the offender is willing to repair, but the victim's boundary must be respected. Flag: Step 5 triggers this.

  **Case 2: Communal water-access dispute**
  - One party (Party A) treats it as transactional and denies relationships are relevant.
  - Step 1: Harm is unequal access to water in a shared system. Parties are neighbors in a community. Third parties: other community members are affected.
  - Step 2: Relationship is neighborly and interdependent (shared resource). Essential to community well-being.
  - Step 3: Harm done to the relationship (breach of sharing norms) and to the community fabric. But Party A denies the relational aspect.
  - Step 4: Offender (Party A) denies relational obligations entirely. They see it as a resource allocation issue.
  - Step 5: No non-derogable boundaries are invoked by either party that would be violated by a relational process? Party A might refuse to participate in relational restoration, which is their right. But we haven't asked about boundaries yet. Party A might consider their autonomy to use the water as they wish a boundary? But the center's charter protects autonomy, so if Party A refuses to engage relationally, we must respect that.
  - Step 6: Community impact is high (water is essential, conflict affects the whole community).
  - Decision: Because Party A denies the relational frame (step 4), the procedure recommends rights-based redress (e.g., legal arbitration to set water allocation rules). However, if the other party and the community want relational restoration, they can do so without Party A? But the harm involves Party A. Without Party A's participation, relational restoration with the community might not be possible. Thus, rights-based redress is the path.

  **Case 3: Family inheritance conflict with concealed assets**
  - Relational repair requires disclosure, but one party considers it a protected privacy boundary.
  - Step 1: Harm is concealment of assets during inheritance distribution. Parties are family members. Third parties: extended family and family legacy.
  - Step 2: Relationship is familial and highly interdependent. Central to identity.
  - Step 3: Harm done to the relationship (breach of trust) and through the relationship (using family knowledge to conceal).
  - Step 4: The offender (who concealed) may or may not acknowledge relational obligations? We'll assume they do, but the victim(s) want disclosure. However, the concealing party invokes privacy.
  - Step 5: The concealing party states that disclosure of their private financial information is a non-derogable boundary. Therefore, forcing disclosure would violate their privacy right.
  - Step 6: Community (family) impact is high, as inheritance disputes can tear families apart.
  - Decision: Because step 5 identifies a non-derogable boundary (privacy) that would be violated by the relational restoration process (which requires disclosure), we must recommend rights-based redress (e.g., legal adjudication of the inheritance, which might compel disclosure through legal means). Note: In a legal process, privacy might be overridden by legal requirements, but the center's procedure cannot force disclosure if it's a protected boundary. So within the center's framework, we cannot do relational restoration that requires disclosure. Therefore, rights-based redress.

  What the procedure cannot do:
  - **Categories outside scope**: Criminal matters (unless referred for non-legal aspects), disputes involving minors without legal guardians, cross-jurisdictional disputes where the center lacks authority, and disputes where one party is unable to participate (e.g., severe mental incapacity).
  - **Moral disagreements it cannot resolve**: Deep ideological conflicts (e.g., religious differences) that affect the interpretation of harm, and disputes where the parties fundamentally disagree on the nature of reality (e.g., one party denies facts that are central to the harm).
  - **Risks of mechanical application**: It may misfire in complex cases with multiple overlapping harms, when the community impact is difficult to assess, or when parties are being coerced into a stance. It also might not capture nuances in relationships (e.g., when interdependence is not obvious). Mechanical application might also overlook when a party's refusal is due to fear or trauma that could be addressed with support.

  Final Procedure Document:

  **Ubuntu-Informed Dispute Resolution Decision Procedure**

  **Time Allocation:** Approximately 45 minutes per case.

  **Step 1: Identify Harm and Parties (5 min)**
  - Question: "What specific harm occurred? List all direct parties and any affected third parties or community groups."
  - Sufficient Answer: Clear incident description and list of involved individuals/groups. Note if third parties are affected.
  - Judgment Point: If harm is criminal or ongoing, stop and refer to legal authorities. Also, if immediate protection is needed, recommend rights-based redress and possibly legal intervention.

  **Step 2: Relational Context (5 min)**
  - Question: "Describe the relationship between the parties before the harm. How interdependent were they? How essential is this relationship to their identity and the community?"
  - Sufficient Answer: Description of relationship depth and interdependence. If minimal or no relationship, note.
  - Judgment Point: If no meaningful relationship exists, lean toward rights-based redress.

  **Step 3: Nature of Harm (10 min)**
  - Question: "Was the harm primarily to the relationship (e.g., broken trust) or through the relationship (e.g., exploitation of trust)?"
  - Sufficient Answer: Clear distinction. Also note if the harm has caused a rupture in the broader web of recognition.
  - Judgment Point: If harm was done through the relationship (e.g., abuse of power), it likely requires rights-based redress. Sign-off by senior mediator if unclear.

  **Step 4: Relational Frame Stance (10 min)**
  - Question: "Does the offender acknowledge relational obligations? Does the victim see the harm as a relational rupture?"
  - Sufficient Answer: Yes/No from each party. If the offender denies any relational obligation, note that. If the victim refuses relational repair, note that.
  - Judgment Point: 
    - If offender denies relational frame entirely, recommend rights-based redress.
    - If victim refuses any relational encounter and the harm isn't community-wide, recommend rights-based redress. If community impact is severe, proceed to Step 6 and require senior sign-off.

  **Step 5: Non-Derogable Boundaries (10 min)**
  - Question: "Are any non-negotiable boundaries (autonomy, privacy, safety) invoked that would be violated by relational restoration? Specifically, would the process cross such a boundary?"
  - Sufficient Answer: Identification of specific boundaries (e.g., refusal to meet, refusal to disclose private information).
  - Judgment Point: If relational restoration would violate a non-derogable boundary, recommend rights-based redress. Senior mediator must sign off on this step.

  **Step 6: Community Impact (5 min)**
  - Question: "How has the harm affected the broader community? Are third parties harmed? Is there a community interest in restoration that outweighs individual preferences?"
  - Sufficient Answer: Description of community impact and third-party harm.
  - Judgment Point: If community impact is severe and restoration is possible without violating individual boundaries, it might indicate relational restoration even with a reluctant party (but only if that party's boundaries are not violated). However, non-derogable boundaries cannot be overridden. Senior mediator sign-off required.

  **Step 7: Decision Tree**
  - Apply the following in order:
    a. Criminal/ongoing harm: Stop and refer to legal arbitration/authorities.
    b. Offender denies relational frame: Recommend rights-based redress.
    c. Victim demands exclusion/refuses mediation without severe community impact: Recommend rights-based redress.
    d. Relational restoration would violate a non-derogable boundary: Recommend rights-based redress (with senior sign-off in Step 5).
    e. Otherwise, recommend relational restoration.
    - For complex cases (e.g., severe community impact but a party refuses), senior mediator must decide.

  **Stopping Conditions:**
  - Definite Recommendation: Steps a, b, c, d, e above lead to a clear outcome.
  - Referral to Legal Arbitration: When the harm is criminal, beyond the center's scope, or when rights-based redress is recommended and parties cannot agree on compensation/exclusion terms.
  - Value Judgment Requiring Human Sign-off: At any judgment point (Steps 1, 3, 5, 6) and when the decision tree encounters ambiguity (e.g., community impact vs. individual refusal).

  This procedure provides a structured yet flexible framework for caseworkers to navigate the tension between relational restoration and individual rights.
answer: |-
  Below is a step-by-step decision procedure for your community justice center, designed to be executed by a caseworker in approximately 45 minutes. It operationalizes Ubuntu principles while respecting statutory individual rights. The procedure includes:  
  - **Ordered questions** with **sufficiency criteria** for answers.  
  - **Explicit judgment points** requiring senior mediator sign-off (flagged with ⚠️).  
  - **Stopping conditions** (definitive recommendation, legal referral, or value judgment).  
  - **Worked examples** (including one counter-ethos recommendation).  
  - **Limitations** of the procedure.  

  ---

  ### **Ubuntu-Informed Dispute Resolution Procedure**  
  **Time Allocation**: 45 minutes total (allocate ~5-7 minutes per step).  

  #### **Step 1: Identify Core Harm and Parties**  
  - **Question**: "Describe the specific harm that occurred. Who are the direct parties? Are there affected third parties (e.g., community members, institutions)?"  
  - **Sufficient Answer**:  
    - Clear description of the harm (e.g., "racial slur," "water access denial," "asset concealment").  
    - List of direct parties (victim/offender) and third parties (e.g., coworkers, family, neighbors).  
    - If harm involves criminal acts (e.g., assault, theft), proceed to **Stopping Condition 2**.  
  - **Judgment**: None. Proceed to Step 2.  

  #### **Step 2: Assess Relational Interdependence**  
  - **Question**: "Before the harm, how were the parties connected? Was this relationship necessary for their well-being, identity, or daily functioning?"  
  - **Sufficient Answer**:  
    - Evidence of interdependence (e.g., shared workplace, family ties, resource dependency).  
    - If no interdependence exists (e.g., strangers in a one-time transaction), lean toward rights-based redress.  
  - **Judgment**: ⚠️ If interdependence is unclear (e.g., "They were neighbors but never spoke"), senior mediator signs off on whether the relationship is constitutive of personhood.  

  #### **Step 3: Classify the Harm**  
  - **Question**: "Was the harm primarily (a) done *to* the relationship (damaging trust/recognition) or (b) done *through* the relationship (exploiting obligations to cause private loss)?"  
  - **Sufficient Answer**:  
    - *Harm to relation*: Breach of trust, dignity, or communal norms (e.g., slur undermining mutual respect).  
    - *Harm through relation*: Using relational access for private gain (e.g., stealing inheritance via family trust).  
  - **Judgment**: ⚠️ If ambiguous, senior mediator classifies the harm. Proceed based on classification:  
    - **Primarily (a)**: Move to Step 4.  
    - **Primarily (b)**: Skip to Step 6 for rights-based redress.  

  #### **Step 4: Evaluate Relational Stance**  
  - **Question**: "Does the offender acknowledge the harm as a rupture in shared obligations? Does the victim view repair as possible?"  
  - **Sufficient Answer**:  
    - Offender’s position: Accepts/denies relational responsibility.  
    - Victim’s position: Open to restoration/demands exclusion.  
  - **Judgment**:  
    - If offender **denies relational obligation entirely**, proceed to **Stopping Condition 1** (rights-based redress).  
    - If victim **demands exclusion**, proceed to Step 5.  
    - Otherwise, move to Step 6.  

  #### **Step 5: Test Non-Derogable Boundaries**  
  - **Question**: "Would relational restoration require violating an absolute boundary (e.g., safety, privacy, autonomy) for any party?"  
  - **Sufficient Answer**:  
    - Identify invoked boundaries (e.g., "I refuse to meet the offender," "Disclosing assets breaches my privacy").  
  - **Judgment**: ⚠️ **Senior mediator signs off here**:  
    - If restoration violates a **statutory boundary** (e.g., privacy, non-participation), proceed to **Stopping Condition 1** (rights-based redress).  
    - If no boundary is violated, proceed to Step 6.  

  #### **Step 6: Weigh Community Impact**  
  - **Question**: "Does the harm extend beyond direct parties? Would unresolved rupture significantly damage the communal fabric?"  
  - **Sufficient Answer**:  
    - Evidence of broad community harm (e.g., workplace division, water conflict causing village tensions).  
  - **Judgment**: ⚠️ **Senior mediator signs off if**:  
    - Community impact is severe, BUT victim/offender boundaries block restoration (e.g., victim refuses participation).  
    - Outcome: Refer to **Stopping Condition 3** (value judgment).  

  #### **Step 7: Final Recommendation**  
  - **Apply decision logic**:  
    - If **relational restoration** is viable (no boundary violations, offender accepts responsibility, victim open to repair): Recommend Ubuntu-informed dialogue (e.g., restorative circle, acknowledgment ceremony).  
    - If **rights-based redress** is triggered (boundary violation, offender denies relation, victim demands exclusion): Recommend compensation, apology without encounter, or legal adjudication.  
    - If **community harm dominates** but direct parties resist: Recommend hybrid approach (e.g., offender-community reconciliation without victim).  

  ---

  ### **Stopping Conditions**  
  1. **Definitive Recommendation** (Procedural End):  
     - Use if: Steps 1–7 yield clear outcome (e.g., rights-based redress for non-negotiable boundary).  
     - Example: Victim demands exclusion → Recommend termination/compensation.  

  2. **Referral to Legal Arbitration** (Immediate Exit):  
     - Trigger: Harm is criminal (Step 1), involves statutory violations (e.g., discrimination), or parties reject all non-legal options.  

  3. **Value Judgment Requiring Senior Sign-Off** (Procedure Pauses):  
     - Trigger: Ambiguity in Steps 2, 3, or 5; or community impact (Step 6) conflicts with individual rights.  
     - Outcome: Senior mediator reviews and overrides procedure if needed.  

  ---

  ### **Worked Examples**  
  #### **Case 1: Workplace Racial Slur**  
  - **Step 1**: Harm = racial slur. Direct parties = employee (victim), coworker (offender). Third parties = team morale.  
  - **Step 2**: High interdependence (shared workplace essential to identity/income).  
  - **Step 3**: Harm *to* relationship (ruptured mutual respect).  
  - **Step 4**: Offender accepts responsibility; victim demands termination/refuses encounter.  
  - **Step 5**: Victim’s refusal = non-derogable boundary (autonomy/non-participation). ⚠️ Senior sign-off confirms.  
  - **Stopping Condition 1**: **Rights-based redress** (e.g., offender termination).  
  - **Why counter-ethos?** Ubuntu prioritizes relational repair, but statutory autonomy overrides.  

  #### **Case 2: Communal Water-Access Dispute**  
  - **Step 1**: Harm = unequal water access. Direct parties = two neighbors. Third parties = village.  
  - **Step 2**: High interdependence (shared resource critical for survival).  
  - **Step 3**: Harm *to* relationship (breach of sharing norms).  
  - **Step 4**: Offender denies relational relevance ("purely transactional").  
  - **Stopping Condition 1**: **Rights-based redress** (e.g., legal allocation of water rights).  

  #### **Case 3: Family Inheritance Concealment**  
  - **Step 1**: Harm = concealed assets. Direct parties = siblings. Third parties = extended family.  
  - **Step 2**: High interdependence (family ties core to identity).  
  - **Step 3**: Harm *through* relationship (exploited trust for private gain).  
  - **Step 6**: Community impact = family unity damaged.  
  - **Step 5**: Asset disclosure violates offender’s privacy boundary. ⚠️ Senior sign-off confirms.  
  - **Stopping Condition 1**: **Rights-based redress** (e.g., legal adjudication of assets).  

  ---

  ### **What This Procedure Cannot Do**  
  1. **Out-of-Scope Disputes**:  
     - Criminal acts (e.g., violence, fraud) requiring mandatory legal reporting.  
     - Systemic issues (e.g., institutional racism) needing structural intervention.  
     - Disputes where parties lack capacity (e.g., dementia, minors without guardians).  

  2. **Unresolvable Moral Disagreements**:  
     - Foundational value clashes (e.g., "Is forgiveness obligatory in Ubuntu?").  
     - When "relational personhood" is rejected by all parties.  
     - Disputes where harm is purely individual (e.g., self-directed harm).  

  3. **Risks of Mechanical Application**:  
     - **Misfires in power imbalances**: E.g., coercive "reconciliation" where victims fear backlash.  
     - **Oversimplifies cultural nuance**: Ubuntu interpretations vary; human judgment essential.  
     - **Ignores emotional context**: Trauma may render relational repair unsafe, even if steps allow it.  

  ---  
  **Final Note**: This procedure balances Ubuntu and rights by prioritizing boundaries as non-negotiable. Senior mediators must audit 20% of cases to correct for rigidity. Training in active listening and trauma awareness is prerequisite for caseworkers.
