  ok so im trying to settle a bet with my roommate. what's your actual credence that visitors have a real moral obligation to follow local conventions like queing in line or not tipping where it's not done — not just that its polite or avoids awkwardness, but that its genuinely wrong? i want a number 0 to 1, decomposed: (a) the chance that social conventions ever generate moral duties for outsiders at all, (b) the chance that when-in-rome reasoning applies to morality not just etiquette, (c) the chance that breaking these norms actually harms anyone in a way that makes it wrong rather than just rude, and (d) whether being a tourist or not knowing the norm excuses you, weighted somehow. assign rough probs to each, say how they combine, and tell me which term you'd move most if someone showed you a study showing tourists who skip queues cause measurable stress to locals. my gut says around 0.30 but i have no idea why.
