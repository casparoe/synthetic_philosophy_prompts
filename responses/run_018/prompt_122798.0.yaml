answer: |-
  Below is a step-by-step audit of the reconstructed argument, followed by responses to your questions. The analysis draws on statistical consensus, avoiding niche controversies.

  ### Sentence-by-Sentence Audit of the Reconstructed Argument

  1. **"The replication crisis is, at bottom, an artifact of null hypothesis significance testing (NHST)."**  
     *Statistician's view*: Oversimplified. NHST is a major factor but not the sole cause. Other contributors include:  
     - Publication bias (acknowledged later)  
     - P-hacking, low statistical power, methodological flaws (e.g., inadequate controls in your catalysis example)  
     - Incentive structures (e.g., "publish or perish")  
     *Verdict*: Defensible as a key driver, but "at bottom" overstates the case.

  2. **"The p-value is the probability of getting data like yours if the null hypothesis is true; what a scientist actually wants is the probability that the hypothesis is true given the data..."**  
     *Statistician's view*: Correct. This is the common *p*-value misinterpretation (confusing P(data|H₀) with P(H|data)).  
     *Verdict*: Acceptable simplification.

  3. **"Publication bias then compounds the damage... every reported effect is an overestimate... careful replications shrink the effect toward zero."**  
     *Statistician's view*: Largely accurate. Publication bias inflates effect sizes (the "winner's curse"). Well-powered replications often reveal smaller effects.  
     *Verdict*: Defensible simplification.

  4. **"The remedy is to stop asking the wrong question and become Bayesians."**  
     *Statistician's view*: Partially correct but overstated. Bayesian methods address *some* NHST flaws (e.g., direct probability statements about hypotheses). However:  
     - They don't fix poor study design, measurement error, or publication bias.  
     - They introduce new challenges (e.g., prior specification).  
     *Verdict*: Oversold. Bayesianism is a tool, not a panacea.

  5. **"Bayesian inference... dismantles the machinery that produced the crisis... no analogue of stopping-rule inflation... researcher degrees of freedom lose their leverage."**  
     *Statistician's view*: Half-true. Bayesian updating *can* reduce some p-hacking incentives (e.g., optional stopping is less problematic). However:  
     - "Researcher degrees of freedom" (e.g., model tweaks, outlier handling) can still bias Bayesian analyses.  
     - Publication bias affects Bayesian results similarly.  
     *Verdict*: Overly optimistic. Bad practices can persist in any framework.

  6. **"The one remaining objection is the prior... priors wash out... investigators converge on the same posterior."**  
     *Statistician's view*: True **only under ideal conditions**:  
     - Requires abundant, high-quality data.  
     - Assumes priors are not dogmatic (e.g., exclude plausible values).  
     - Fails if data are biased (e.g., due to publication bias).  
     *Verdict*: Conditional simplification; ignores real-world data limitations.

  7. **"Subjectivity is... a small price... replication crisis is not a reason to doubt science... doubt a particular statistical technology."**  
     *Statistician's view*: Unsupported. The crisis implicates:  
     - Scientific culture (e.g., incentives for flashy results)  
     - Methodological rigor (e.g., your catalysis example's evolving controls)  
     - NHST is a tool, not the root cause.  
     *Verdict*: Non sequitur. Blaming "technology" ignores systemic factors.

  ---

  ### Does the Book's Conclusion Survive?
  **No.** While NHST flaws are real, the conclusion that the crisis solely indicts "outdated statistical technology" collapses when oversimplifications are corrected. The replication crisis stems from:  
  - **Statistical mispractice** (NHST abuse, poor power)  
  - **Sociocultural factors** (publication bias, citation inertia)  
  - **Methodological gaps** (e.g., inadequate controls in early catalysis studies)  
  Bayesian methods mitigate *some* statistical issues but don't resolve the rest.

  ---

  ### Your "Evidential Hysteresis" Worry: Valid and Critical
  Your catalysis example exposes a flaw in the "priors wash out" argument:  
  1. **Priors are contaminated**: Initial biased literature (e.g., inflated factor-of-60 findings) shapes community priors.  
  2. **Correction lags**: Later replications (factor-of-2) must overcome this biased prior. Convergence requires *more* high-quality data than if the prior were untainted.  
  3. **Unselected evidence is lost**: Negative/null results from the 1990s may be unpublished → impossible to "reset" priors.  

  **Is this recognized?** Yes, as **"path dependency"** in meta-science:  
  - Priors based on published literature inherit its biases.  
  - Bayesian updating alone cannot purge this if unbiased data is scarce.  
  - Fields may remain "trapped" in skewed belief states (e.g., your citation inertia observation).  

  **Does it tell against "priors wash out"?**  
  - **Yes**: The theorem assumes new data is unbiased and abundant. With tainted priors *and* ongoing publication bias, convergence stalls.  
  - **Bayesian vs. Frequentist**:  
    - *Bayesianism*: Bias hides in priors (harder to audit than p-values).  
    - *Frequentism*: Bias manifests in p-values but is more visible.  
    Neither is inherently safer; both require transparency. Your hysteresis concern applies universally but is *amplified* in Bayesian frameworks due to prior opacity.

  ---

  ### What to Say in the Seminar (3-Minute Summary)
  > "The chapter rightly critiques NHST: p-values are misused, publication bias distorts literature, and Bayesian methods fix *some* flaws (e.g., direct probability statements, reduced stopping-rule issues).  
  >   
  > **But it overreaches**:  
  > - Bayesianism doesn't eliminate p-hacking or publication bias.  
  > - 'Priors wash out' assumes abundant unbiased data—unrealistic when priors are shaped by the same biased literature we're correcting. My catalysis example shows this 'evidential hysteresis': early exaggerated findings (factor-of-60) set priors, so later replications (factor-of-2) struggle to shift beliefs, especially when null results are lost.  
  >   
  > **Thus, the crisis isn't just about statistics**: It's about incentives, methodological rigor, and how communities update beliefs. Bayesian tools help but won't fix science alone—we need better practices *across* the system."  

  **Why your example works**:  
  - Illustrates hysteresis (priors contaminated → slow correction).  
  - Shows citation inertia sustains bias independent of statistical methods.  
  - Highlights that methodological evolution (e.g., blinding) matters as much as statistics.  

  **Where it doesn't carry weight**:  
  - Alone, it doesn't disprove Bayesianism; it shows implementation challenges.  
  - Requires acknowledging that *any* statistical framework suffers from biased evidence.  

  ---

  ### Key Takeaway
  The replication crisis is a systemic failure. Better statistics (Bayesian or otherwise) are necessary but insufficient. Fixing science requires:  
  1. Pre-registration, open data, and publishing null results.  
  2. Methodological transparency (e.g., your field's improved controls).  
  3. Incentive reform—because hysteresis persists when citations reward inflated early findings.
