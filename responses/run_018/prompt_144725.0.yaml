prompt: |-
  Hey — I'm writing this novel and there's a scene where my protagonist runs a philosophy workshop, and I need the classroom game to feel real, not like a textbook example. Can you design a 75-minut activity for about 16 sharp students (grad or senior undergrad) that makes them physically feel the escalation trap of the dollar auction? I don't want them lectured; the rules themselves should push them into bidding past the point of reason, using point-payoffs that actually sting but aren't real cash. Inject this niche framing: treat every bid as an intertemporal promise — quitting feels like betraying the earlier self who started — and build the debrief so it maps exactly which moments in the room correspond to that feeling. Give me rules, roles, a timeline, the payoff scheme, and an honest note on which part of that 'promise-to-self' framing the game can never reproduce on its own (I'll have to say it). Also tell me what will predictably blow up the first time I run it. No citations, no reading lists — my character wouldn't have those in her pocket. Please end with a one-sentence summary on its own line. (Sorry if there's a typo or two — I'm between chapters and my editor's waiting.)
reasoning: |-
  We are creating a classroom game that physically immerses students in the escalation trap of the dollar auction, with the added psychological framing of each bid as an intertemporal promise to one's past self. The goal is to have the rules naturally lead students to overbid without direct lecturing.

  **Game Title:** The Promised Dollar Auction

  **Duration:** 75 minutes

  **Participants:** 16 students (graduate or senior undergraduates)

  **Core Mechanics:**
  - The auction is for a prize worth 100 points (equivalent to $1 in a classic dollar auction, but we use points to avoid real money).
  - Bidding is done in increments of 10 points (so bids are 10, 20, 30, ...).
  - The twist: Each bid is framed as a "promise" to your past self who started the bidding. Quitting is framed as breaking that promise.
  - Payoff scheme: The winner gets the prize (100 points) minus their final bid. The second-highest bidder (the loser) must pay their final bid and gets nothing. This creates the trap.

  **Setup:**
  - Arrange the room in a circle to increase visibility and pressure.
  - Each student gets a starting balance of 100 points (on paper or a whiteboard). They can go into negative points.

  **Roles:**
  - **Auctioneer (Instructor):** Runs the auction, enforces rules, keeps time, records bids.
  - **Timekeeper (Optional, can be the Auctioneer):** Tracks the time for each phase.
  - **Bidders (All students):** Participate in the auction.

  **Timeline:**

  1. **Introduction and Rules (5 minutes):**
     - Explain the rules clearly: 
       - "We are auctioning a prize of 100 points. Bidding starts at 10 points and increases by 10 points per bid. You can only bid in increments of 10. The highest bidder wins the prize and pays their bid (so net gain = 100 - winning bid). The second-highest bidder must pay their last bid and gets nothing. All other bidders pay nothing. You start with 100 points. You can end up with negative points."
     - Introduce the framing: "Every time you bid, you are making a promise to the self that started this journey. If you quit, you break that promise. Think about how that feels."

  2. **Auction Phase (25-30 minutes):**
     - Start the auction at 10 points. Allow students to raise their hands to bid. 
     - Record each bid and the bidder. Keep the pace brisk but not rushed. 
     - As the bidding progresses, periodically remind them of their current bid and the increasing stakes. 
     - Encourage the framing: "Remember, each bid is a commitment to your past self who invested already. Quitting would mean letting that self down."
     - Continue until the bidding stops. Expect bids to go beyond 100 points (into the loss zone for the winner) and the second-highest bidder to be trapped.

  3. **Settlement (5 minutes):**
     - Announce the winner and the second-highest bidder.
     - Have them calculate their points:
       - Winner: 100 (starting) + [100 (prize) - winning bid] = 200 - winning bid
       - Second-highest: 100 (starting) - their last bid
       - Others: 100 (starting) remains.
     - Record the scores publicly (on a board) to show the impact.

  4. **Debrief (35-40 minutes):** 
     - Start by asking the winner and the second-highest bidder to share their thought process at key moments (e.g., when bidding passed 50, 80, 100, 150, etc.). 
     - Then open to the group: 
       - "At what point did you feel trapped? Why didn't you stop earlier?"
       - "How did the idea of breaking a promise to your past self affect your decisions?"
     - Map the experience to the intertemporal promise framing:
       - **Early bids (10-50):** "This is when you made the initial commitment. It was low, so easy to promise."
       - **Mid bids (60-90):** "Now you've invested. Quitting would mean your past self was wrong. You feel compelled to justify the sunk cost."
       - **Critical point (100+):** "The prize is now worth less than your bid, but you can't stop because of the second-highest bidder rule and the promise. The trap snaps shut."
       - **Second-highest bidder:** "You kept bidding to avoid being the loser who pays, but then you became the loser anyway. The promise to your past self made you ignore the rational exit point."
     - Draw parallels to real-life escalation traps (relationships, wars, business investments) and the psychology of commitment.

  **Honest Note on the Framing:**
  - The game cannot reproduce the full emotional weight of a long-term promise to oneself. In real life, such promises are built over time and tied to identity. The game compresses this into minutes, so the feeling is more about sunk costs and competition than deep personal commitment. You must explicitly tell them: "In reality, the 'promise to self' is a cumulative psychological burden that grows over weeks or months, not minutes. The game only gives you a taste of the immediate regret of sunk costs."

  **Predictable Problem in First Run:**
  - The most likely issue is that students might collude to stop early (e.g., agree not to bid past 50). To counter this, stress the competitive nature and the framing of the promise. If they still stop too early, run a second round with a higher prize (e.g., 200 points) or a mandatory minimum number of bids to force the trap.

  **One-Sentence Summary:**
  A live auction game where escalating bids trap students in a cycle of competitive promises, forcing them to confront the psychology of sunk costs and intertemporal self-betrayal.
answer: |-
  ### The Promised Dollar Auction: Classroom Game Design  
  *(75 minutes, 16 students)*  

  **Core Concept:**  
  Students bid points for a 100-point prize. Each bid is framed as a "promise to their past self" — quitting feels like betrayal. The auction escalates until bidders pay more than the prize is worth, physically simulating the trap. Points are fictional but impactful (e.g., losing points = public "sting").  

  **Rules & Setup:**  
  - **Prize:** 100 points (e.g., a token like a golden envelope).  
  - **Bidding:** Starts at 10 points, increases in 10-point increments. Students bid by raising hands; auctioneer acknowledges the bidder.  
  - **Payoffs:**  
    - **Winner:** Gets 100-point prize minus their final bid. *Example: Winning at 120 points = 100 - 120 = -20 points (net loss).*  
    - **Second-Highest Bidder:** Pays their final bid and gets nothing. *Example: Bid 110 points = -110 points.*  
    - **Others:** Pay nothing, keep starting points.  
  - **Starting Points:** Each student begins with 100 points (tracked publicly on a whiteboard—names visible). Negative scores allowed.  
  - **Framing Injection:**  
    - Auctioneer says: *"Each bid commits you to the path your past self chose. Quitting breaks that promise. Honor your journey."*  
    - Repeat this during bidding lulls.  

  **Roles:**  
  - **Auctioneer (You):** Controls pace, enforces rules, reminds of the "promise."  
  - **Timekeeper (Assign a student):** Tracks phases.  
  - **Bidders (All 16 students):** Must bid at least once to start (creates initial investment).  

  **Timeline:**  
  1. **Intro (5 min):**  
     - Explain rules, payoffs, and the "promise" framing. Emphasize: *"Points affect rankings—I’ll publish top/bottom 3 after."* (Creates social pressure.)  
     - Hand out starting balance cards (100 points each).  

  2. **Auction Phase (25 min):**  
     - Start bidding at 10 points. Move quickly—allow 10 seconds between bids.  
     - **Critical Moments:**  
       - At 50 points: Say, *"Think of your first bid. Wasn’t it easy? Your past self trusted you to see this through."*  
       - At 100 points: *"The prize is covered. But your past self didn’t start this to break even—did they?"*  
       - At 150+ points: *"Quitting now wastes all that commitment. Who betrays themselves?"*  
     - End when 10 seconds pass without a bid. Announce winner and runner-up.  

  3. **Settlement (5 min):**  
     - Calculate scores publicly. Winner receives prize physically.  
     - *Example outcomes:*  
       - Winner (bid 140): 100 - 140 = -40 points.  
       - Runner-up (bid 130): -130 points.  
     - Update scoreboard. Highlight the top 3 gainers and bottom 3 losers.  

  4. **Debrief (40 min):**  
     - **Feel the Trap:** Ask:  
       - *"When did you realize you should stop? Why didn’t you?"*  
       - *"Describe the moment you felt trapped by your own past bid."*  
     - **Map the "Promise" Framing to Actions:**  
       | **Bid Stage** | **Physical Feeling in Room** | **Corresponds to...** |  
       |---------------|------------------------------|------------------------|  
       | 10-40 points  | Light laughter, curiosity. | *"The first promise—easy, no stakes."* |  
       | 50-90 points  | Nervous glances, competitive tension. | *"Your past self’s investment—quitting feels like cowardice."* |  
       | 100-150 points | Visible stress, aggressive bids. | *"Betrayal panic—your past self’s trust is on the line."* |  
       | 150+ points  | Silence, slumped postures. | *"Trapped—honoring the promise costs more than breaking it, but you can’t stop."* |  
     - **Key Insight:** The runner-up’s loss stings most—they paid dearly because they feared betraying their effort.  

  **Honest Note on the "Promise" Framing:**  
  The game *cannot* reproduce the **long-term identity erosion** of real intertemporal promises. In life, we rationalize sunk costs as "who I am" (e.g., *"I’m the kind of person who finishes things"*). Here, it’s just 25 minutes—you’ll need to explicitly say: *"Real promises haunt you for years; this is just a shadow of that guilt."*  

  **Predictable First-Run Blowup:**  
  Students will **collude to stop bidding early** (e.g., someone shouts "Let’s all quit at 50!"). *Counter this:* Before starting, warn: *"If I hear collusion, the prize drops to 50 points—and your past selves already trusted you to play fair."* Enforce strictly.  

  **One-Sentence Summary:**  
  A live auction where bidding mimics intertemporal self-promises, escalating until students pay to avoid betraying their past selves—and debrief maps every wince to the trap’s psychology.
