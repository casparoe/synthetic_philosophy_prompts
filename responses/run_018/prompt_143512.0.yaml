prompt: |-
  I'm the care coordinator for a small hospice unit and we've started using a kind of tranquilist framework for our non-medical support decisions — basically, we treat only the absence of craving and suffering as what actually improves a patient's remaining days, and we treat any intervention that introduces new wants, attachments, or narrative demands on the patient as a harm unless it clearly nets out negative craving. I need a reusable procedure I can run in about fifteen minutes during our weekly case conference to decide whether to greenlight, modify, or reject a proposed psychosocial intervention (things like life-review writing, family reconciliation sessions, spiritual legacy projects, or even relaxation techniques that might create dependency). The procedure needs to be grounded in what tranquilism actually says — not just "reduce pain" but the specific claim that positive goods don't count and that craving-formation is the relevant metric — and it needs to handle cases where the family is pushing for an intervention the patient seems ambivalent about. Give me the steps in order, with a quick test for each one, flag where I'm still making a judgment call that I can't outsource to the checklist, and apply it to three cases: (1) a patient who wants to record video messages for grandkids but gets visibly agitated during takes; (2) a family insisting on guided imagery that makes the patient calmer in session but then ask for it constantly; (3) one where the procedure says no to something I personally think would be beautiful. Also say what the procedure can't settle and where it might misfire if the patient's mental state shifts between evaluation and execution.
reasoning: |-
  We are creating a procedure based on tranquilism, which holds that:
   - The absence of craving and suffering is the only good.
   - Positive goods (like joy, meaning, etc.) are not counted as improvements.
   - Any intervention that introduces new wants, attachments, or narrative demands is a harm unless it clearly results in a net reduction of craving.

   The procedure must be run in about 15 minutes and must address:
     - Whether to greenlight, modify, or reject a proposed psychosocial intervention.
     - Cases where the family is pushing for something the patient is ambivalent about.

   Steps:

   1. **Define the Proposed Intervention and Its Components**
      - Break down the intervention into its core elements: what will the patient do, what will they be exposed to, and what are the expected outcomes?
      - *Test: Can we list every aspect of the intervention that might create a new craving or attachment?*

   2. **Assess Current Craving Baseline**
      - Determine the patient's current state of craving and suffering related to the area the intervention targets. Is there an existing craving that the intervention aims to reduce?
      - *Test: Without this intervention, is the patient currently experiencing craving/distress in this specific domain?*

   3. **Project Craving Changes**
      - For each element of the intervention, project:
          a) Immediate effects during the intervention (e.g., during the session).
          b) Lingering effects after the intervention (e.g., between sessions, after completion).
      - Focus on:
          - Introduction of new desires or attachments (e.g., creating dependency, new expectations).
          - Amplification of existing cravings (e.g., by reinforcing a narrative that the patient cannot complete).
          - Reduction of existing cravings (e.g., by resolving a source of distress).
      - *Test: Does the intervention leave the patient with fewer net cravings (including new ones created) than before?*

   4. **Evaluate Patient's Authentic Volition (vs. External Pressure)**
      - Determine if the patient's expressed desire for the intervention is intrinsic or driven by family/staff pressure. Ambivalence suggests pressure may be a factor.
      - *Test: If we remove all external voices, does the patient still show a clear, consistent desire for the intervention?*

   5. **Modification for Risk Mitigation**
      - If the intervention has craving-formation risks, can we modify it to remove or reduce those elements without eliminating the craving-reducing core?
      - *Test: Can we design a version that either (a) avoids introducing new cravings or (b) ensures any new cravings are outweighed by a greater reduction?*

   6. **Decision Matrix:**
      - Greenlight: If the intervention is projected to reduce net craving without introducing significant new cravings, and the patient's volition is authentic.
      - Modify: If it has craving-formation risks that can be mitigated without gutting the intervention, then propose modifications.
      - Reject: If it introduces new cravings that are not offset by craving reduction, or if the patient's ambivalence suggests it is driven by external pressure and the craving reduction is minimal.

   **Judgment Calls:**
      - Step 3 (Projecting Craving Changes) requires judgment about the patient's psychology and how they might react.
      - Step 4 (Authentic Volition) requires interpreting the patient's behavior and statements.

   **Cases:**

   **Case 1: Video messages for grandkids, but patient gets agitated during takes.**
     - Step 1: Intervention is recording videos. Elements: recalling memories, speaking to camera, repeated takes.
     - Step 2: Current baseline: Patient has a desire to leave something for grandkids (an existing craving) and also distress about not being able to do so perfectly (agitation during takes).
     - Step 3: 
          - Immediate: Agitation (increased suffering) during recording.
          - Lingering: Possible relief at having completed it (reduction of the craving to leave a legacy) but also potential for new cravings (e.g., desire to redo, perfectionism, or anxiety about the grandkids' reactions). Also, the agitation might leave residual stress.
          - Net craving change? The existing craving (to leave a legacy) is addressed, but the process creates new suffering and possibly new cravings (for perfection). Without modification, net craving might not reduce (or might even increase).
     - Step 4: Patient's volition: The patient wants to do it (authentic) but the agitation suggests internal conflict (ambivalence about the process).
     - Step 5: Modification: 
          - Instead of multiple takes, do one take and accept imperfection? Or switch to audio? Or write a letter? Or have a family member interview the patient casually and record that?
          - Goal: Reduce the craving (to leave a legacy) without introducing the craving for perfection.
     - Step 6: Modify. Propose a less perfectionistic method.

   **Case 2: Family insists on guided imagery that calms in session but patient asks for it constantly.**
     - Step 1: Intervention is guided imagery. Elements: relaxation during session, but then patient becomes dependent, asking for it constantly.
     - Step 2: Current baseline: Patient may have anxiety or restlessness (existing craving for calm) but without the intervention, they might have periods of natural calm.
     - Step 3:
          - Immediate: Calm during session (reduction of craving for calm) -> good.
          - Lingering: Patient now has a new craving for the guided imagery itself (dependency). The constant asking indicates a new craving that did not exist before (or was minimal). This new craving causes distress when not met.
          - Net craving: The intervention reduces craving during the session but creates a new, more frequent craving at other times. Net increase in craving? (Because the patient now craves the guided imagery many times a day, whereas before they only had occasional restlessness.)
     - Step 4: Patient's volition: The patient now craves the intervention, but initially the family pushed for it. The patient's current desire is strong but it is a created craving (dependency) and not an intrinsic one. The authentic volition at the start was ambivalent (family pushed) and now it's driven by dependency.
     - Step 5: Modification: 
          - Reduce frequency? Use it only for acute distress? Combine with other non-dependent techniques? Or taper off and replace with a self-guided version? But note: the dependency is already formed. Weaning might cause temporary increase in craving.
          - Alternatively, if the patient's baseline anxiety was severe and the new craving is manageable (e.g., we can provide the guided imagery on demand without much burden) then it might be net positive. But tranquilism says we should avoid creating new cravings.
     - Step 6: Reject (or modify to wean off). Given that the intervention has created a new craving that is causing distress (constant asking) and the net craving has increased, we should reject continuing the intervention in its current form and work to extinguish the dependency. We might replace it with a non-dependent method.

   **Case 3: A procedure rejection that I personally find beautiful.**
     Example: A dying patient's family wants to create a "living funeral" where friends and family gather to celebrate the patient's life while the patient is still alive. The patient is hesitant because of fatigue but agrees to please the family. The coordinator thinks it would be a beautiful event.

     - Step 1: Intervention is a gathering. Elements: social interaction, emotional expressions, reminiscing.
     - Step 2: Current baseline: Patient may have craving for connection or fear of being forgotten, but also fatigue and discomfort with crowds.
     - Step 3:
          - Immediate: Possible joy during the event, but also physical and emotional exhaustion (suffering). 
          - Lingering: 
              - Positive: Sense of closure might reduce craving for connection or fear of being forgotten.
              - Negative: New cravings might form: desire for more gatherings, or anxiety about the event's perfection, or sadness after the event when people leave (contrast effect). Also, the event may create narrative demands (patient feels pressure to perform a role).
          - Without clear evidence that the event would reduce an existing craving (and the patient is ambivalent) and given the risk of new cravings and suffering (fatigue, emotional drain), the net craving might not be reduced.
     - Step 4: Patient's volition: Ambivalent (agrees to please family) -> not authentic.
     - Step 5: Modification: 
          - Scale down: a few visitors at a time? A video montage of messages? But the patient is fatigued and hesitant.
          - Alternatively, focus on reducing the existing craving (fear of being forgotten) by other means, like letters or recordings.
     - Step 6: Reject (or modify to a less demanding form). Even though the coordinator finds it beautiful, tranquilism doesn't count the beauty as a good. The risks of new cravings and suffering without clear net reduction in craving lead to rejection.

   **What the Procedure Can't Settle:**
      - If there is uncertainty about the patient's future mental state (e.g., if the patient's condition might change in a way that alters craving patterns).
      - If the intervention has mixed effects that are hard to quantify (e.g., reduces one craving but introduces two minor ones).
      - The exact weighting of different cravings (e.g., is a new minor craving worse than reducing a major one?).

   **Misfires due to Shifts in Mental State:**
      - If the patient's mental state shifts between the evaluation and the execution (e.g., becomes more anxious or develops new symptoms), the projection in Step 3 might become invalid.
      - Therefore, it's important to:
          - Re-evaluate if there is a significant change in the patient's condition or mental state.
          - For interventions that span multiple sessions, check in after each session to reassess.

   **Procedure Steps (for weekly case conference):**

   1. **Define the Intervention (2 minutes)**
      - What exactly is being proposed? Break it down into components.

   2. **Baseline Craving Assessment (2 minutes)**
      - What is the patient's current state of craving/suffering in the relevant domain?

   3. **Project Craving Changes (5 minutes)**
      - For each component, project immediate and lingering effects on craving (both reduction and formation). 
      - **Judgment call**: How likely are these effects? How severe?

   4. **Assess Authentic Volition (3 minutes)**
      - Is the patient's desire for the intervention intrinsic or driven by others? 
      - **Judgment call**: Interpret ambivalence and external pressure.

   5. **Explore Modifications (2 minutes)**
      - If there are craving-formation risks, can we modify the intervention to mitigate them?

   6. **Decision (1 minute)**
      - Greenlight, Modify (with specific changes), or Reject.

   Total: 15 minutes.

   **Note:** If during the conference new information arises that requires more time, table the item for next week or a quick follow-up.

   **Adjustment for Efficiency:**
      - Prepare in advance: Before the conference, the care coordinator should gather the necessary information about the patient's current state and the proposed intervention.
      - Use a template for consistency.

   **Template for Documentation:**

   Proposed Intervention: [Description]
   Patient: [Name]

   Step 1: Components of Intervention:
     - [List]
   Step 2: Current Baseline Craving/Suffering:
     - [Describe]
   Step 3: Projected Craving Changes:
     - Immediate: [Reductions/New cravings]
     - Lingering: [Reductions/New cravings]
     - Net Change: [Estimate]
   Step 4: Authentic Volition? [Yes/No/Ambivalent] 
     - Notes: [Why?]
   Step 5: Possible Modifications: [List]
   Step 6: Decision: [Greenlight/Modify/Reject] 
     - If Modify: [Specify changes]
     - If Reject: [Reasons]

   **Final Note:** This procedure is a tool to guide consistent application of tranquilism, but it requires clinical judgment. It is not a substitute for continuous observation and adjustment.
answer: |-
  ### Tranquilist Intervention Evaluation Procedure (15-Minute Protocol)  
  **Core Principle**: Only the reduction of **craving** (desire, attachment) and **suffering** (distress, agitation) improves well-being. Positive experiences (joy, meaning) are irrelevant unless they *directly prevent new craving*. All interventions are suspect if they introduce new "wants" or narrative demands.

  ---

  #### **Step-by-Step Procedure**  
  **Time Allocation**: 15 minutes total (adjust per step).  
  **Key Judgment Calls**: Marked with ⚠️. Requires clinical intuition; *cannot* be fully automated.  

  1. **Define the Craving Footprint (3 minutes)**  
     - *Action*: Break the intervention into components. List:  
       - **Existing cravings** it might ease (e.g., fear of being forgotten).  
       - **New cravings** it might create (e.g., dependency, perfectionism, unmet expectations).  
     - *Test*: *"If we do nothing, does the patient currently suffer from the craving this intervention targets? What new ‘wants’ could this activity plant?"*  
     - ⚠️ *Judgment*: Weighing ambiguous cravings (e.g., "Is quiet sadness better than agitated meaning-making?").  

  2. **Assess Patient Volition vs. External Pressure (2 minutes)**  
     - *Action*: Distinguish the patient’s intrinsic motivation from family/staff desires. Note:  
       - Direct quotes from the patient about the activity.  
       - Signs of ambivalence (hesitation, fatigue, people-pleasing).  
     - *Test*: *"Would the patient pursue this if family weren’t here? Does their body language contradict their words?"*  
     - ⚠️ *Judgment*: Interpreting ambivalence (e.g., "Is 'I guess' genuine consent or resignation?").  

  3. **Project Net Craving Change (5 minutes)**  
     - *Action*: Forecast effects:  
       - **Immediate**: Suffering/craving *during* the activity (e.g., agitation).  
       - **Lingering**: Craving *after* (e.g., dependency, rumination).  
       - **Net change**: (Existing craving relieved) – (New craving + suffering created).  
     - *Test*: *"Does this leave the patient with fewer cravings or just replace one with another?"*  
     - ⚠️ *Judgment*: Quantifying intangible cravings (e.g., "Is legacy anxiety worse than imagery dependency?").  

  4. **Modify or Reject (3 minutes)**  
     - *Action*: Only greenlight if **net craving reduction is clear and unambiguous**. Else:  
       - **Modify**: Remove craving-forming elements (e.g., shorten sessions, reduce expectations).  
       - **Reject**: If net craving increases or family pressure overrides patient neutrality.  
     - *Test*: *"Can we achieve the craving reduction without the harmful parts?"*  

  5. **Document & Flag Monitoring Needs (2 minutes)**  
     - *Action*: Record:  
       - Decision + rationale (e.g., "Rejected: Net craving increase from dependency").  
       - Signs of shifting mental states to monitor (e.g., "Watch for new agitation if family pushes").  

  ---

  #### **Case Applications**  
  **Case 1: Video Messages for Grandkids (Patient Agitated During Takes)**  
  - **Step 1 (Craving Footprint)**:  
    - *Existing craving*: Desire to be remembered (fear of oblivion).  
    - *New craving*: Perfectionism (redo takes), performance anxiety.  
  - **Step 2 (Volition)**: Patient wants legacy but visibly stressed → ambivalence.  
  - **Step 3 (Net Change)**: Immediate agitation (suffering ↑) + lingering "not good enough" rumination (craving ↑). Net craving likely **increases**.  
  - **Step 4 (Modify/Reject)**: **Reject video**. *Modify*: Offer audio-only or handwritten letters (lower pressure).  
  - **⚖️ Outcome**: Reject original proposal; counteroffer made.  

  **Case 2: Guided Imagery (Family Insists; Patient Demands Constantly)**  
  - **Step 1 (Craving Footprint)**:  
    - *Existing craving*: Baseline anxiety (relieved *during* sessions).  
    - *New craving*: Dependency (constant requests → distress when unavailable).  
  - **Step 2 (Volition)**: Patient’s "need" is manufactured by intervention → not authentic. Family pressure evident.  
  - **Step 3 (Net Change)**: Immediate calm (suffering ↓) but new dependency (craving ↑↑). Net **increase in craving**.  
  - **Step 4 (Modify/Reject)**: **Reject guided imagery**. *Modify*: Teach non-dependent breathwork (craving-neutral).  
  - **⚖️ Outcome**: Reject; family educated on tranquilist harm of dependency.  

  **Case 3: "Beautiful" Intervention Rejected (e.g., Final Family Reconciliation)**  
  - *Proposal*: Emotionally intense reunion for a patient who "should" find closure.  
  - **Step 1 (Craving Footprint)**:  
    - *Existing craving*: Unresolved guilt (potentially eased).  
    - *New craving*: Pressure to forgive/perform, post-event emotional crash.  
  - **Step 2 (Volition)**: Patient passively agrees but seems weary → likely family-driven.  
  - **Step 3 (Net Change)**: High distress during event (suffering ↑) + new cravings for "perfect resolution" (↑). Net **increase in craving/suffering**.  
  - **Step 4 (Modify/Reject)**: **Reject**. *Tranquilist rationale*: Suffering is guaranteed; "beauty" is irrelevant.  
  - **⚖️ Outcome**: Reject despite clinician’s emotional bias.  

  ---

  #### **Limitations & Failure Modes**  
  - **What the Procedure Can’t Settle**:  
    - **Value conflicts** (e.g., family’s "meaning" vs. patient’s craving reduction).  
    - **Unmeasurable cravings** (e.g., subconscious attachment to rituals).  
    - **Cultural/spiritual factors** (tranquilism may conflict with beliefs about legacy).  
  - **Mental State Shifts**:  
    - **Misfires if**: Pain/cognition changes between evaluation and execution (e.g., patient develops delirium, altering craving susceptibility).  
    - **Mitigation**: Flag interventions as "high-risk" if patient is unstable; reassess within 24h of execution.  
  - **When to Override**: If a patient’s *existing* craving (e.g., for reconciliation) is so severe that *not* acting causes greater suffering. Document rationale.  

  **Key Tranquilist Quote for Context**:  
  > *"The root of suffering is craving. Freedom from craving is peace."*  
  > — Adapted from Buddhist sources (core to tranquilism).  

  This procedure prioritizes freedom from *new* mental burdens. It is agnostic to hope, meaning, or "positive" emotions—only craving reduction counts. Use it to depersonalize decisions in emotionally charged cases.
