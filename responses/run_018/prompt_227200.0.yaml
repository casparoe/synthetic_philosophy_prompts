       - Indefinite repeated PD: Exception—cooperation is a dominant strategy in the "meta-game" due to punishment.  

  3. **Rule 3: Maximize Payoff Under Mutual Rationality (Best Symmetric Outcome)**  
     - **Logic**: Play the strategy that maximizes your payoff assuming both players are rational and coordinate on the Pareto-optimal outcome when possible. If the game has multiple equilibria, select the one best for both players. Backward induction is used only when necessary (finite games).  
     - **Fits past verdicts**:  
