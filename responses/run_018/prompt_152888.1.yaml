answer: |-
  ## Research Proposal Structure: Expressive Voting and Symbolic Complicity in Morally Compromised Choices

  **1. Research Question & Gap in Literature**

  *   **Precise Question:** Under what conditions, if any, can a voter strategically select a viable candidate whose platform includes policies violating deontological constraints (e.g., treating persons merely as means) without thereby expressing symbolic endorsement of those policies through the act of ballot-casting itself, and thus incurring moral complicity via expressive association?
  *   **Why Existing Frameworks Leave it Unresolved:**
      *   **Pure Expressive Theories:** Focus on voting as manifesting values or identity. They often lack the conceptual tools to address the *specific content* expressed when selecting a candidate with deeply objectionable policies, particularly when the selection is strategic rather than enthusiastic. They struggle to explain how voting for such a candidate doesn't inherently express endorsement of their *entire* platform or character.
      *   **Pure Instrumental/Strategic Theories:** Frame voting solely in terms of influencing electoral outcomes ("lesser evil"). They typically dismiss or minimize the expressive dimension, reducing the moral significance of the vote to its causal consequences. This ignores the potential for the act *itself* to constitute a form of symbolic association or endorsement, independent of the outcome. They cannot adequately address concerns about the voter's own moral integrity being compromised by the expressive act.
      *   **The Structural Conflict:** The core tension arises because the voter faces a binary choice on a single ballot. Selecting the "lesser evil" viable candidate may be instrumentally justified to prevent a worse outcome, but the act of *selecting that specific candidate* on the ballot appears, expressively, to associate the voter with *that candidate and their platform*. Standard frameworks either neglect this expressive cost (instrumentalism) or struggle to reconcile it with strategic necessity (expressivism), leaving the conflict unresolved.

  **2. Methodological Approach**

  *   **Core Methodology:** Conceptual analysis grounded in political philosophy and philosophy of language, focusing on the nature of the voting act and moral complicity.
  *   **Key Components:**
      *   **Speech-Act Analysis of Ballot-Casting:** Rigorously analyze voting as a speech act (drawing on Austin, Searle). Examine its illocutionary force: Is it *asserting* support? *Endorsing*? *Selecting* an agent? *Authorizing*? Does the institutional context (secret ballot, aggregation mechanism) alter the act's expressive meaning? Crucially, investigate whether the ballot inherently expresses endorsement of the *whole candidate* or if it can be understood as expressing a more limited proposition (e.g., "This candidate is preferable to the alternatives in this context").
      *   **Moral Complicity Framework:** Develop an account of complicity distinguishing:
          *   **Causal Complicity:** Contributing to a harmful outcome (primarily addressed by instrumental theories).
          *   **Symbolic/Expressive Complicity:** Associating oneself with, endorsing, or condoning wrongdoing through one's actions or expressions, even if causal contribution is negligible or absent. This involves analyzing concepts like moral taint, integrity, and association.
  *   **Why Preferred:**
      *   **Addresses the Core Tension:** This approach directly confronts the unique conflict between instrumental necessity and expressive cost by analyzing the *meaning* of the vote itself and the distinct *type* of moral compromise (symbolic association) it might entail.
      *   **Beyond Consequentialism:** Moves beyond evaluating the vote solely by its outcomes, incorporating the intrinsic moral significance of the expressive act for the voter's integrity and relationship to injustice.
      *   **Beyond Simple Rights:** While rights (e.g., to vote, to free expression) are background conditions, this approach focuses on the *moral quality* and *meaning* of exercising that right in a specific, conflicted context, rather than just its permissibility.
      *   **Captures the Phenomenology:** Better reflects the lived experience of voters who feel morally conflicted about voting for a "lesser evil" precisely because they fear endorsing or associating with the evil itself.

  **3. Definition of Success and Failure**

  *   **Successful Result:** A coherent conceptual framework that:
      1.  Clearly distinguishes the conditions under which strategic voting for a morally compromised candidate constitutes *impermissible symbolic endorsement/complicity* from those where it *does not*.
      2.  Identifies the relevant factors influencing this distinction (e.g., nature/severity of the compromising policy, electoral context/viability thresholds, the voter's *publicly expressible* intent or justification, the structure of the ballot itself, societal norms around voting).
      3.  Provides a defensible account of how expressive meaning attaches to the ballot act, potentially allowing for qualified or contextually limited expressions (e.g., "selection-under-duress" vs. "endorsement").
      4.  Offers practical normative guidance for voters facing this dilemma, grounded in the analysis of expressive meaning and symbolic complicity.
  *   **Failure:**
      1.  **Collapse into Instrumentalism:** If the speech-act analysis ultimately concludes that the expressive meaning of the ballot is *entirely determined* by, or reducible to, its expected causal consequences (e.g., selecting X only expresses opposition to Y, regardless of X's policies).
      2.  **Collapse into Pure Expressivism:** If the analysis concludes that selecting a candidate *always* constitutes endorsement of their entire platform, rendering strategic voting for a compromised candidate inherently expressively impermissible regardless of context or alternative.
      3.  **Incoherence:** If the attempt to reconcile the strategic and expressive dimensions results in inconsistent or logically untenable conclusions.
      4.  **Inconclusive Vagueness:** If the framework fails to provide sufficiently clear or actionable criteria for distinguishing permissible from impermissible cases, leaving the core tension unresolved in practice.
      5.  **Neglect of Symbolic Complicity:** If the analysis fails to adequately establish the distinct moral significance of symbolic association/complicity compared to causal contribution.

  **4. Realistic Scope for One-Year Project**

  *   **Feasible Goals:**
      1.  Develop a robust conceptual framework integrating speech-act theory and symbolic complicity specifically tailored to the voting dilemma.
      2.  Articulate clear criteria for distinguishing expressive endorsement from strategic selection.
      3.  Systematically analyze key variables influencing the permissibility judgment (e.g., severity of constraint violation, viability, ballot structure, public justifiability of intent).
      4.  Defend the framework against major anticipated objections (e.g., from pure instrumentalists, pure expressivists, those skeptical of symbolic complicity).
      5.  Produce a significant dissertation chapter or article-length manuscript presenting the core argument.
  *   **Scope Limitations:**
      1.  **Depth over Breadth:** Focus will be on rigorously developing the *core conceptual argument* and framework. Extensive application to numerous complex real-world historical cases or comparative electoral systems will be limited to illustrative examples.
      2.  **Primary Focus on the Dilemma:** The project will center on resolving the specific structural tension described. Broader debates about general voting ethics (e.g., duty to vote, mandatory voting) or comprehensive theories of expressive/instrumental voting will be engaged only insofar as they directly bear on this core dilemma.
      3.  **Conceptual Groundwork:** While normative conclusions will be drawn, the primary aim is establishing the *conceptual possibility* and conditions for permissible strategic voting without endorsement. Detailed practical guides or policy recommendations are beyond scope.
      4.  **No Empirical Work:** As noted, the project is purely conceptual and normative; no survey data, experiments, or formal modeling will be conducted.
  *   **Deliverable:** A well-structured, philosophically rigorous dissertation chapter (or equivalent article manuscript) presenting the novel framework and its defense, demonstrating a significant contribution to resolving this specific lacuna in voting ethics literature.
