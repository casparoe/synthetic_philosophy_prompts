  I'm drafting the conceptual framework for a philosophy-of-medicine workshop and need an adversarial-collaboration document that two opposing research camps could both sign, without either side feeling that the framing begs the question. The first camp, the Affective Essentialists, holds that pain's badness is an intrinsic phenomenal quality anchored in its negative affective coloring; they maintain that in classic pain asymbolia—where patients can report precise nociceptive location and intensity, deny suffering, and display no avoidance or learning—the badness does not disappear but becomes phenomenologically "silent," present in the experience yet decoupled from motivation and self-concern. The second camp, the Symbolic-Functionalists, holds that badness is not an intrinsic sensory property but is constituted by a representational-functional loop in which a state is registered as harmful-to-me and integrated into a self-preserving narrative system; they take asymbolia to demonstrate that when this symbolic-motivational linkage is severed, the remaining sensory-affective residue lacks normative force and should be classified as "proto-pain" rather than genuinely bad pain. To keep the debate from collapsing into familiar repetition, please frame the collaboration around a three-layer model—first-order nociception, second-order affective coloring, and third-order symbolic valuation—treating the central crux as whether second-order coloring can carry normative badness in the absence of third-order integration.

  Produce the joint statement in this form: (1) a numbered section of claims both sides accept about the clinical phenomenology of asymbolia, about the undisputed neurofunctional correlates, and about the logical conditions for attributing "badness" to an experience; (2) a disagreements table that states each camp's position in wording its own proponents would endorse, specifically covering whether badness requires third-order symbolic valuation, whether the absence of avoidance behavior undermines the presence of badness, and whether "proto-pain" is a coherent phenomenological category rather than an ad hoc rescue; (3) the precise cruxes—sub-questions such that settling them would move at least one side—including whether there is an empirically distinguishable state corresponding to "silent badness" versus "absent badness," and whether affective coloring can be normatively inert while remaining phenomenally present; and (4) for each crux, one concrete hypothetical case or structured thought experiment that both sides agree is relevant, together with each side's explicit prediction about what the case demonstrates. Do not include bibliographies, reading lists, or citations; the document should stand entirely on its conceptual and argumentative structure.
