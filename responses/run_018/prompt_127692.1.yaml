  Is there actually a principled moral logic for trading accountability for information in a case like this, or am I just rationalizing because the practical payoff is huge? If the framing is totally confused — like, if you can't even apply a theory here without knowing more legal details — just tell me straight. And please don't just list philosophers or dump citations; I want to know what the idea actually predicts for Delgado specifically, including whether my split feeling (he shouldn't be there, but he also shouldn't be silenced) can be made consistent or if one side has to win.
