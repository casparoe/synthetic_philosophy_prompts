  Cluster 1 (temporal vs domain misalignment) feels most fundamental. If we can't cleanly distinguish between "the mechanism exists but takes longer" versus "the mechanism exists elsewhere," we can't evaluate rescue narratives. This is upstream because it affects how we even frame verification for theories like Malthus - was he wrong about timing (temporal) or fundamentally misapplying population dynamics (domain)? The grad student could tackle this with formal modeling of feedback loops using their logic training, no domain expertise needed. Crucially, this distinction matters for climate models - are "failed" short-term predictions salvaged by longer feedback cycles, or are we misapplying mechanisms?

