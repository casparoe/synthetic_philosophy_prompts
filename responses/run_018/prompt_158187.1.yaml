  **Stance Adoption Regulations: Public Guidance (Home Office Publication Ref: SRB/24/7)**

  **1. Introduction to the Stance Review Board (SRB)**
  The Stance Review Board (SRB), operating under the Department for Ontological Security, regulates the adoption of explanatory stances towards entities and systems within the United Kingdom. A "stance" constitutes a specific framework for prediction and explanation. The Physical Stance, Design Stance, and Intentional Stance are recognised as distinct predictive methodologies. The reality of any pattern discerned through these stances is deemed objective *only* when demonstrably licensed for that context and yielding reliable predictions. Unlicensed stance adoption undermines predictive stability and constitutes a breach of the Stance Regulation Act (2021).

  Individuals must understand that adopting a stance is not a matter of personal inclination but of regulatory compliance. The SRB assesses applications based on predictive efficacy benchmarks. Entities possess no intrinsic "stance-worthiness"; licensing is granted solely for the stance-pattern pairing that maximises predictive success in a defined scenario. Consult the SRB website (gov.uk/stance-licensing) for mandatory pre-application self-assessment tools and stance-adoption impact statement templates.

  **2. The Physical Stance: Requirements and Restrictions**
  The Physical Stance (PS) requires explaining and predicting behaviour solely by reference to underlying physical constitution and the laws of physics (e.g., microstate analysis, particle interactions). A PS Licence (Type P) is generally pre-authorised for fundamental scientific research and interactions with non-complex inert matter (e.g., individual rocks, basic chemical solutions). No additional permit is required for these contexts.

  However, employing the PS for complex systems without justification is strongly discouraged and may incur efficiency penalties. Attempting to predict the behaviour of a motor vehicle solely by tracking quark interactions within its engine block, whilst theoretically permissible under a Type P licence, is deemed computationally intractable and a misuse of resources. Citizens are reminded that defaulting to the PS for manufactured objects or biological systems without an approved SRB Computational Necessity Certificate is inefficient and may lead to processing delays in daily tasks.

  **3. The Design Stance: Permitted Applications**
  The Design Stance (DS) involves predicting behaviour based on an entity's designed function or purpose, abstracting away from physical detail (e.g., "The thermostat switches off the boiler when the room reaches the set temperature"). A DS Permit (Type D) is automatically granted for interactions with manufactured artefacts possessing clear, documented functions (kettles, traffic lights, computers). Reliance on the DS for such items is not only permitted but encouraged for operational efficiency.

  Application for an Extended DS Permit (Type DX) is required for applying the stance to naturally occurring biological systems exhibiting apparent design-like features (e.g., predicting a bird will fly south based on migratory "design"). Type DX permits necessitate evidence of robust functional analysis. Crucially, adopting the DS *without* a valid permit for biological entities or complex natural systems may result in a Standard Fine (Level 1). Anthropomorphising weather systems ("The sky *wants* to rain") using the DS is explicitly prohibited and subject to a Level 2 Fine.

  **4. The Intentional Stance: Licensing and Enforcement**
  The Intentional Stance (IS) attributes beliefs, desires, and rationality to an entity to predict its behaviour (e.g., "She wants tea, believes the kettle boils water, so she will fill the kettle"). Due to its power and potential for misuse, the IS requires strict licensing. An IS Licence (Type I) is automatically granted for predicting the behaviour of neurotypical adult humans in standard social or transactional contexts. This is contingent upon adherence to norms of rationality.

  A Specific Entity IS Permit (Type IE) is mandatory for applying the stance to non-human animals, very young children, or complex artificial systems. Crucially, applying the IS to clearly non-intentional systems is a serious offence. Utilising the IS towards household appliances (e.g., "The toaster *knows* I'm in a hurry and is deliberately slow"), basic algorithms, or weather patterns without a valid Type IE Permit constitutes Illegal Anthropomorphisation and carries a Level 3 Fine. Enforcement officers may issue on-the-spot penalties for egregious cases (e.g., berating a vending machine for "stubbornness").

  **5. Unapproved Stances: The Predictive Stance Problem**
  The SRB recognises only the Physical, Design, and Intentional stances as licensed predictive frameworks. Citizens are warned against the increasing use of an unregulated "Predictive Stance" (PSu), particularly concerning algorithmic systems and chatbots. The PSu involves treating patterns discerned *solely* by statistical correlation or opaque model outputs as objectively real, regardless of grounding in physical structure, design function, or plausible intentionality.

  Applying the PSu to chatbots – attributing reality to behavioural patterns based purely on predictive success of the model's output, bypassing the question of actual design or consciousness – is not authorised. While the SRB acknowledges the predictive utility such patterns might exhibit in specific, limited interactions, the PSu lacks the rigorous ontological classification framework of the three licensed stances. Its use fosters confusion, potentially leading to unauthorised IS leakage (e.g., believing a chatbot "understands"). Persistent, unlicensed PSu adoption may trigger a Stance Misapplication Review by the SRB. Citizens encountering highly predictable yet inexplicable system behaviours should file an Anomalous Pattern Report (Form SRB-AP1) instead.
