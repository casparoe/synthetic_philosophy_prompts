  ## NOTES ON EXAGGERATION & CONCEPT MAPPING

  The manual satirizes the "center of narrative gravity" concept by treating narrative identity as a physical system with measurable properties:

  *   **Mapped Concepts:**
      *   **Biographical Mass (BM):** Represents the accumulation of life stories and experiences that constitute the "weight" of one's identity narrative.
      *   **Coherence Index (CI):** Directly maps to the perceived continuity and consistency of one's self-narrative. Low CI reflects fragmentation, contradiction, or unresolved events disrupting the narrative flow.
      *   **Center Drift Velocity (CDV):** Represents the feeling of identity instability or flux during periods of significant life change or uncertainty.
      *   **Calibration (CAEs, Continuity Errors):** Mirrors how we anchor our identity in core memories and how inconsistencies or forgotten details ("continuity errors") challenge narrative coherence, requiring mental integration.
      *   **Branching Events / Fragmentation:** Exaggerates how major life changes or traumas can disrupt the established narrative, potentially leading to a sense of identity fracture or reinvention.
      *   **Safety Warnings (AFS, Recursion):** Reflects the real psychological discomfort (dissonance, depersonalization) that can arise from intensely scrutinizing or destabilizing one's self-narrative.

  *   **Invented Nonsense:**
      *   **Quantification (Narratons, Dennetts, MilliRortys):** Identity coherence and narrative weight are qualitative, subjective experiences, not physically quantifiable units.
      *   **Physical Measurement (Quantum Chronitons, Memetic Resonators):** There's no physical device or energy field associated with narrative selfhood; it's a cognitive/linguistic construct.
      *   **Physical Hazards (Sensor Damage, Ontological Shock):** Questioning one's identity doesn't physically damage anything, though it can be psychologically unsettling.
      *   **Warranty Voiding:** Identity change isn't a malfunction that voids a warranty; it's a natural, often healthy process. The warranty terms satirize the desire for a fixed, unchanging self.
      *   **Stabilization Field Generator / Dramatic Filters:** There are no technological fixes for narrative instability; integration happens through reflection, discourse, and lived experience.
