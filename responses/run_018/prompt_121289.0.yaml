  ## NARRATIVE GRAVIMETER NG-7 USER MANUAL  
  **Model:** NG-7 "Centro" | **Revision:** 3.1  
  **Manufacturer:** OntoTech Dynamics, Consciousness Division  

  **1.0 INTRODUCTION**  
  The Narrative Gravimeter NG-7 quantitatively measures the intensity and coherence of the narrative gravitational field ("N-field") generated by an individual's accumulated biographical mass. This field manifests as the phenomenological center commonly identified as "self" or "identity." The NG-7 detects fluctuations in narrative density, coherence anomalies, and potential fragmentation events, providing essential diagnostics for identity stability assessment.

  **1.1 TECHNICAL SPECIFICATIONS**
  *   **Measurement Principle:** Quantum Chroniton Interferometry coupled with Memetic Resonance Scanning.
  *   **Measurable Parameters:**
      *   **Narrative Gravitational Force (NGF):** Expressed in *Narratons (Nn)*. 1 Nn ≈ the gravitational pull exerted by a foundational autobiographical memory (e.g., "first day of school"). Typical adult baseline: 1200-1800 Nn.
      *   **Biographical Mass (BM):** Aggregate weight of stored experiential narratives, measured in *Dennetts (Dt)*. 1 Dt = mass equivalent of 1 significant life event integrated into core identity narrative.
      *   **Coherence Index (CI):** Unitless ratio (0.0 - 1.0) indicating temporal/causal linkage integrity between narrative components. CI < 0.7 indicates fragmentation risk.
      *   **Center Drift Velocity (CDV):** Rate of displacement of the perceived narrative center, measured in *MilliRortys (mRy)*. Sustained CDV > 50 mRy suggests significant identity flux.
  *   **Resolution:** 0.1 Nn / 0.01 Dt / 0.01 CI / 0.1 mRy
  *   **Operating Range:** Standard Human Biographical Spectrum (SHBS) - covers typical lifespan density and event significance.
  *   **Output:** Real-time N-field topology holograph, quantitative datastream, anomaly alerts (audible/visual).
  *   **Power:** Standard 110-240V AC / Internal Narrative Capacitor (72hr backup).

  **1.2 CALIBRATION PROCEDURE**
  1.  **Pre-Calibration:** Subject must engage in 5 minutes of neutral mindfulness (focus on breath or a simple object). Ensure environment is free from strong external narratives (e.g., news, intense conversations).
  2.  **Baseline Acquisition:** Using the provided Calibration Diadem, present subject with three standardized Core Anchor Events (CAEs) via neutral audio description (e.g., "Learning to ride a bicycle," "Graduating primary school," "First significant friendship"). The NG-7 establishes baseline NGF and CI readings.
  3.  **Continuity Error Scan:** Initiate the Continuity Error Scan (CES) protocol. The NG-7 injects low-level paradoxical memory probes (e.g., "Describe your 7th birthday party using only smells"). Monitor CI for transient dips > 0.15. System auto-adjusts Dramatic Coherence Filters to compensate.
  4.  **Fragmentation Test:** Briefly expose subject to a high-ambiguity scenario narrative (e.g., "You witness an event but later doubt your recollection"). Observe BM stability and CDV. Calibrate Fragmentation Threshold Sensors to local maxima.
  5.  **Verification:** Re-run CAEs. Readings should be within ±2% of initial baseline. Record calibration timestamp and CI stability factor.

  **1.3 WARRANTY AND SERVICE**
  *   **Standard Warranty:** 5 years or 50,000 Dt accumulated BM measurement, whichever comes first. Covers defects in Chroniton sensors, Memetic Resonators, and holographic projection.
  *   **Warranty Void Conditions:**
      *   Exposure to Branching Events (e.g., major career change, religious conversion, unintegrated trauma) causing CI instability > 0.3 for > 72hrs.
      *   Operation during Existential Crises (self-declared or NG-7 detected CI < 0.4).
      *   Attempted measurement of Non-Human Narrative Fields or Collective Identities without OntoTech-approved scaling arrays.
      *   Physical damage from Ontological Shock events.
  *   **Service:** Annual recalibration at OntoTech-certified facility required to maintain accuracy. Field repair kits available for CI sensor realignment and Dramatic Filter replacement. Service contracts cover emergency fragmentation intervention support.

  **1.4 SAFETY WARNINGS**
  *   **WARNING:** Operation near subjects with CI < 0.5 risks inducing Narrative Collapse or Acute Fragmentation Syndrome (AFS). Symptoms include disorientation, depersonalization, and persistent questioning of "Who am I really?" Use Stabilization Field Generator (SFG-7 accessory) if CI < 0.6.
  *   **WARNING:** Do not operate during high CDV events (> 100 mRy, e.g., major life decisions, intense therapy sessions). Erratic N-field fluctuations can damage Chroniton sensors.
  *   **WARNING:** Avoid prolonged direct observation of the N-field holograph by the subject. May lead to meta-narrative recursion loops ("Why is my story *that* shape?"), potentially lowering CI.
  *   **CAUTION:** Significant discrepancies between measured BM and subject's self-reported "life weight" may cause minor ontological dissonance (headache, unease). Recalibrate subject perception filters if necessary.
  *   **CAUTION:** Device is not a substitute for professional psychological or philosophical counseling. It measures narrative gravity; it does not create meaning. Treat all readings as emergent phenomena, not intrinsic truths.

