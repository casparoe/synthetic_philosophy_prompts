prompt: |-
  im trying to settle, once and for all, whether talk of DNA carrying information or being a genetic code is literal or just a really useful metaphor, and I keep noticing that people argue past each other because one person means Shannon-style correlation and the other means semantic content. Before I read another paper on it, I want the spec. Write me the desiderata for a theory of genetic information: the list of requirements any account has to meet for the claim "DNA carries information" or "the genetic code is a real code" to be more than a loose way of talking. For each requirement, give the case or consideration that forces it, and mark which you think are non-negotiable and which are just preferences of one camp. Then flag any pairs of requirements that might not be jointly satisfiable -- if the list itself amounts to an argument for or against literalism, I want that part especially. a table is fine.

  Some things I already suspect need to be handled, but I want you to make the case for or against each rather than just take my word for it: the arbitrariness of codon assignment (the triplet-to-amino-acid mapping is not forced by chemistry, so an account cant fall back on chemical necessity to explain why a sequence says one thing rather than another); the no-homunculus problem (the "reader" is tRNAs, aminoacyl-tRNA synthetases, and the ribosome, not a mind); translation as blind molecular machinery; synonymous codons, wobble, and how a misreading differs from a changed message; noncoding DNA, pseudogenes, regulatory sequence -- does information attach to all of it or only to what gets translated; what the information is supposed to be about (protein sequence? phenotype? something else) without the account circling back on itself; the fact that the same sequence can do different things in different cellular contexts (splicing, methylation, developmental environment); the fact that high Shannon information and functional importance come apart (a random sequence can be information-rich in one sense and do nothing in the other); how genuinely new coding sequences can arise by mutation and selection without an outside informant; and the bootstrapping one -- the genome encodes the very synthetases and ribosomal components that implement the reading of the code, so the account has to allow the code to specify its own interpreter without a vicious regress or a designer. If you think some of these are red herrings, say so and why.

  Finally, keep the scoring short: a paragraph each on how the main camps (causal/Shannon, semantic/teleosemantic, and outright eliminativist/metaphor-only) fare against your list. I care about the criteria more than the scorecard.
reasoning: |-
  Okay, the user is trying to settle a long-standing debate about whether DNA literally carries information or if it's just a metaphor. They've noticed that people argue past each other because some focus on Shannon information (correlation) while others on semantic content (meaning). They want a clear set of criteria that any theory of genetic information must meet to be considered literal, not just metaphorical.

  First, I need to list the desiderata for such a theory. The user mentioned specific issues like arbitrariness, the no-homunculus problem, translation machinery, synonymous codons, noncoding DNA, context-dependency, Shannon vs. functional information, new sequences arising, and bootstrapping. Each of these points needs to be addressed in the desiderata.

  Starting with arbitrariness. This is crucial because the codon-amino acid mapping isn't chemically determined. Any theory must explain why specific sequences correspond to specific outcomes without relying on chemistry. This seems non-negotiable because without arbitrariness, it's just chemistry, not information.

  Next, the no-homunculus problem. The reader here is molecular machinery, not a mind. The theory must account for how physical processes interpret sequences without intentionality. Non-negotiable since invoking a mind would break the biological basis.

  The translation machinery is blind. Interpretation happens through deterministic biochemistry. The theory needs to show how sequences cause outcomes without foresight. Also non-negotiable.

  Synonymous codons and wobble mean that different sequences can yield the same output. The theory must explain that the message (amino acid) stays the same despite sequence changes. Non-negotiable because it's a core genetic feature.

  Noncoding DNA and pseudogenes challenge what parts carry information. Should information apply only to coding regions? The theory must clarify the scope. Non-negotiable to avoid over-application.

  Context-dependency: the same sequence can function differently based on cellular context. The theory must handle this without making information too fluid. Non-negotiable due to real biological examples.

  Shannon information vs. function: a random sequence has high Shannon information but may be non-functional. The theory needs to distinguish mere data from functional content. Non-negotiable for relevance to biology.

  New sequences via mutation: information must arise without an external source. The theory should explain innovation through natural processes. Non-negotiable to avoid design implications.

  Bootstrapping: the genome encodes its own readers. The theory must resolve the circularity of the code specifying its interpreters. Non-negotiable because it's a fundamental biological process.

  Now, conflicts. Arbitrariness vs. non-arbitrary readers: if codons are arbitrary, why are readers consistent? Teleosemantics might resolve this via evolution. Also, functional info vs. context: if information depends on context, how to define it invariantly? Maybe use evolutionary history. Shannon vs. functional info: high entropy doesn't equal function, so functional theories might reject Shannon where it doesn't apply.

  Scoring camps: Causal/Shannon focuses on correlations and data but misses semantics. It handles arbitrariness and machinery well but fails on meaning and function. Teleosemantic uses evolutionary purpose to assign meaning, handling arbitrariness and function, but struggles with context and bootstrapping. Eliminativists deny literal information, avoiding homunculi but clashing with biological practice.

  The user likely wants clarity on whether a unified theory is possible or if camps address different aspects. Highlighting conflicts shows why the debate persists. Their deeper need might be understanding if biology requires semantic concepts or if causal accounts suffice, impacting how we model genetic systems.
answer: |-
  Here's a comprehensive desiderata table for a literal theory of "genetic information/code," addressing your points and highlighting tensions. Non-negotiables (NN) are required to avoid collapsing into metaphor or irrelevance to biology. Preferences (P) reflect differing philosophical stances.

  ### Desiderata for a Literal Theory of Genetic Information

  | # | Desideratum                                                                 | Case/Consideration Forcing It                                                                                                | NN/P    | Why Non-Negotiable?                                                                 |
  |---|-----------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------|---------|-------------------------------------------------------------------------------------|
  | 1 | **Arbitrariness/Symbol Grounding:** Must explain how specific sequences (symbols) determinatively correspond to specific outcomes (e.g., amino acids), despite no *chemically necessary* link. | Codon assignment is demonstrably arbitrary (different codes exist in mitochondria/some bacteria; same aa from different codons). | **NN**  | Without arbitrariness, it's just direct chemistry/physics, not symbolic information. |
  | 2 | **No Homunculus:** Must explain "reading" and "interpretation" solely through the operation of blind, evolved molecular machinery (tRNAs, synthetases, ribosomes). | The molecular implementation lacks any mind, intention, or understanding.                                                   | **NN**  | Invoking a mind-like interpreter makes the claim metaphorical/vitalistic.           |
  | 3 | **Blind Translation:** Must account for the mechanistic, deterministic, and non-teleological process of translation within a cell. | Ribosomes/tRNAs operate based on molecular shape/complementarity, not foresight of function.                               | **NN**  | Essential to distinguish from conscious decoding; core biological process.          |
  | 4 | **Synonymy & Error Tolerance:** Must distinguish between changes in sequence that alter the "message" (e.g., missense mutation) and those that don't (e.g., synonymous mutation, "wobble"). | Synonymous codons exist; wobble pairing allows some misreading without error; not all sequence changes are equal.           | **NN**  | Core feature of the genetic code; distinguishes signal from noise.                  |
  | 5 | **Scope Definition:** Must clearly define *what parts* of the DNA sequence carry "information" and what kind (coding, regulatory, structural, junk?). | Existence of non-coding DNA, pseudogenes, regulatory elements, introns. Does "information" apply to all nucleotides equally? | **NN**  | Avoids vacuity ("it's all information") or arbitrary restriction.                    |
  | 6 | **Aboutness/Content Specification:** Must specify *what* the information is *about* (e.g., protein sequence, regulatory state, phenotypic outcome?) without circularity (e.g., "it's about what it causes"). | Sequence specifies protein primary structure; regulatory sequences specify binding/expression patterns. What is the referent? | **NN**  | Information must have content; circular definitions aren't explanatory.             |
  | 7 | **Context-Dependence:** Must handle how the "meaning"/effect of a sequence depends on cellular context (e.g., methylation, splicing factors, developmental stage, environment). | Alternative splicing, tissue-specific gene expression, epigenetic silencing, environmental effects on phenotype.            | **NN**  | Biological reality; information isn't context-invariant like a digital code.        |
  | 8 | **Functional Specificity (vs. Shannon):** Must distinguish high Shannon information (surprise, unpredictability) from *functional* biological information (specificity for a biological role). | A random sequence has high Shannon info but zero functional info; conserved sequences have low Shannon info but high functional info. | **NN**  | Shannon info alone fails to capture biological relevance or "meaning."              |
  | 9 | **Origin & Novelty:** Must explain how genuinely new "informative" sequences can arise de novo through mutation and selection, without an external "sender". | Evolution of new genes/proteins, new regulatory elements, gene duplication and divergence.                                  | **NN**  | Core requirement of evolutionary biology; avoids requiring a designer.              |
  | 10| **Bootstrapping/Closure:** Must resolve the circularity: the genome encodes the machinery (synthetases, ribosomal proteins) that interprets the code. | The genetic code specifies the amino acid sequence of the aaRS enzymes that charge the tRNAs according to the code.           | **NN**  | Foundational biological fact; theory cannot invoke an unexplained external interpreter. |
  | 11| **Causal Efficacy:** Must integrate how sequences causally contribute to cellular processes and phenotypes. | Mutations cause changes in function/phenotype; sequences are templates/catalysts/binding sites.                             | **NN**  | Information must do something biologically significant, not be epiphenomenal.        |
  | 12| **Formal Structure Preference:** Should ideally provide a formal framework (e.g., akin to syntactic/semantic levels) for describing sequences, coding, and interpretation. | Desire for predictive power, computational modeling, analogy to communication/engineering.                                  | **P**   | Preference of some camps (e.g., computational biologists) for rigor.                |
  | 13| **Naturalization Preference:** Should ground "meaning" or "function" in natural processes (e.g., evolution, physics) without invoking non-natural properties. | Philosophical commitment to naturalism in science.                                                                          | **P**   | Preference of materialist/anti-vitalist camps.                                      |

  ### Key Tensions (Potential Incompatibilities)

  1.  **Arbitrariness (1) vs. Non-Arbitrary Readers (2,3,10):** How can symbols be arbitrary if the readers/interpreter molecules themselves are *also* specified by the code? Why is the machinery "tuned" to read *this specific code*? Teleosemantic accounts use evolutionary history to bridge this.
  2.  **Functional Specificity (8) vs. Context-Dependence (7):** How can information be "about" a specific function/outcome if its effect is radically context-dependent? Defining function/meaning invariantly (e.g., via evolutionary *proper function*) versus relativistically (current context) is a major challenge.
  3.  **Shannon Information (implicit in discussions of 8) vs. Functional Information (8):** Can a single theory encompass both the statistical/uncertainty-reducing aspect (Shannon) and the functional/semantic aspect? Many argue they are fundamentally different concepts. Functional theories often reject Shannon as sufficient or even primary for biology.
  4.  **Bootstrapping/Closure (10) vs. Origin/Novelty (9):** Explaining the stability of an existing code is different from explaining how a new code/mapping could evolve *de novo*. The initial steps are particularly challenging.
  5.  **Aboutness (6) vs. Causal Efficacy (11) vs. Blindness (3):** Defining "aboutness" without invoking future consequences (teleology) or circularity ("it causes what it causes"), while acknowledging the blindness of the mechanism, is philosophically difficult. Teleosemantics uses past selection, not future goals.

  **The List as Argument:** This list strongly argues *against* simplistic literalism (e.g., DNA is *just like* a computer code or a linguistic message). The biological reality (Blindness, Context-Dependence, Bootstrapping, Functional Specificity vs. Shannon) is messy and resists clean analogies. However, it also argues *against* pure eliminativism. The combination of **Arbitrariness (1), Synonymy (4), Functional Specificity (8), and Bootstrapping (10)** creates a unique phenomenon not fully reducible to mere chemistry or Shannon information, demanding *some* notion of representation or coding. A successful literal theory must be a *biological* theory of information, not an imported engineering or linguistic one.

  ### Camp Scoring (Brief)

  *   **Causal/Shannon:**
      *   **Strengths:** Excels at 2, 3, 5 (neutrally), 8 (Shannon aspect), 9 (mutations as noise), 11. Matches molecular blindness.
      *   **Weaknesses:** Fails utterly at 1 (arbitrariness requires semantics), 4 (synonymy isn't just correlation), 6 (no "aboutness"), 8 (functional aspect), 10 (bootstrapping circularity), 12/13 (lacks semantics). Can't distinguish functional sequence from junk or noise. Fundamentally misses the semantic/core code aspect.
  *   **Semantic/Teleosemantic (e.g., Maynard Smith, Sterelny, Godfrey-Smith):**
      *   **Strengths:** Best at 1 (arbitrariness via selection), 4 (synonymy as same function), 6 (aboutness=proper function), 8 (functional information), 9 (novelty via variation/selection), 10 (bootstrapping via evolution), 13 (naturalized).
      *   **Weaknesses:** Struggles with 3 (blindness vs. "function" seeming teleological - requires careful handling), 5 (scope - how much DNA has proper function?), 7 (context-dependence challenges stable "proper function"), 12 (formalization is hard). Can seem abstracted from molecular mechanism.
  *   **Eliminativist/Metaphor-Only:**
      *   **Strengths:** Avoids all philosophical problems of meaning/content. Emphasizes 2, 3, 11 (pure mechanism).
      *   **Weaknesses:** Fails to explain 1, 4, 10 - the core phenomena that motivate the informational view in the first place. Makes biology seem *more* mysterious by dismissing the powerful explanatory framework biologists actually use ("code", "translation", "information", "template", "signal"). Struggles with the predictive power of informational thinking. Ignores the unique combination of desiderata.

  **Conclusion:** The desiderata reveal why the debate persists. **Causal/Shannon** captures mechanism but misses the core semantic puzzle. **Eliminativism** avoids the puzzle but loses explanatory power. **Teleosemantics** offers the most promising path to literalism by grounding "meaning" in evolutionary history and biological function, directly tackling Arbitrariness, Synonymy, Functional Specificity, and Bootstrapping, though it grapples with Context-Dependence and formalization. A truly satisfying literal theory likely needs to be a sophisticated teleosemantic one deeply integrated with molecular biology. The metaphor is powerful precisely because it points to these unique, non-arbitrary, functional, self-bootstrapping aspects of genetic systems that mere physics/chemistry or Shannon information don't fully capture.
