  my opening move: you always said the danger was a shared false appearance that makes citizens forget themselves in collective illusion. but here there's no single spectacle shared by the crowd — just tailored emotional instruction for each individual. in fact, isn't this closer to the civic festivals you praised in Geneva, since it trains virtue privately instead of corrupting people together?

