  ## Opening Remarks: "Quietism in Practice" Workshop

  Good morning. Welcome. To our palliative care clinicians and hospice architects: your daily acts of removal – of pain, of distress, of physical and environmental friction – shape the most profound transitions. And to our academic philosophers of well-being and value theory: your rigorous inquiries into the nature of the good life illuminate the very ground upon which such care stands, often amidst vibrant debates about what constitutes flourishing. Thank you for gathering across these distinct realms of practice and thought.

  The title, "Quietism in Practice: Tranquilism, Care Design, and the Value of Absence," signals our unusual terrain. It is unusual because our framing for these two days is explicitly, and perhaps challengingly, **craving-neutral**.

  What does that mean? Typically, an interdisciplinary workshop promises enrichment: new ideas to acquire, theories to synthesize, frameworks to expand. We promise none of that. To our philosophers: we will not offer you a richer pluralist account, a novel positive-state theory, or a breakthrough dialectical synthesis. To our clinicians: we will not propose new aspirational goals for your care, nor suggest enhancements to your designs that add features promising greater fulfillment or aesthetic enrichment. Such promises, we propose, are forms of intellectual craving – desires to grasp, to accumulate, to satisfy a theoretical or practical appetite.

  Instead, we propose a different kind of work: the collective reduction of a specific form of conceptual suffering. This is the discomfort that arises when we hold, or feel compelled to defend, incompatible theories about what makes life go well. It is the friction generated by the collision of the positive and the subtractive, the additive and the reductive, in our understanding of value. Our aim is not to resolve these tensions through synthesis or victory, but to explore the possibility of reducing the craving for such resolution itself. To cultivate, perhaps, a stillness *within* the debate.

  Clinicians, you know this terrain intimately, though perhaps not in these terms. Your practice, at its core, often values *absence* above presence. You design hospice rooms not primarily to add stimulation, but to subtract noise, clutter, and jarring sensory inputs – creating vessels for stillness. You administer analgesics not to induce euphoria, but to remove the consuming presence of pain, allowing a baseline of calm. The value lies in the relief, in the space created by what is taken away. Your expertise is in discerning what *needs removing* to allow fundamental tranquility to emerge. Consider these two days an exploration of a parallel process: the removal of conceptual agitation concerning the *source* of value itself.

  Philosophers, I know this framing – Tranquilism – sounds stark, perhaps even like a denial of your core subject matter. It holds that only the absence of craving and suffering carries intrinsic value. Positive mental states – the insights we cherish, the intellectual excitements that drive us, the fulfillments we seek – are, on this view, not independent goods. They are, at best, manifestations of, or pathways to, a deeper stillness: the temporary absence of specific disturbances. To propose that intellectual excitement or aesthetic enrichment are not, in themselves, intrinsically valuable is to challenge the very lifeblood of much philosophical inquiry. I understand the instinctive skepticism, perhaps even unease.

  Therefore, I ask you not to defend your theories today, nor to seek to dismantle Tranquilism as a competitor. Instead, I ask you to treat this framing, this craving-neutral space, as a **temporary methodological experiment**. Suspend the craving to build, to synthesize, to win the argument. Instead, observe the conceptual discomfort that arises when the *impulse* to defend a positive-state theory or a pluralist account meets the proposition that its value might lie only in the relief it offers from the craving for coherence itself. Can we witness this discomfort without needing to resolve it? Can we explore the relief that might come from *not* needing to integrate every proposed good into a unified account? The experiment is to see if reducing this specific craving – the craving for theoretical resolution or possession – might itself be a form of value creation, akin to the clinical removal of distress.

  This is not nihilism. It is not the absence of value, but a specific proposal about where value fundamentally resides: in the quiet. Our purpose is not passive resignation, but active subtraction. We are not here to achieve a grand synthesis of palliative design and value theory. We are here to practice the discipline of *not grasping* – not grasping for new positive goals in care, not grasping for theoretical victory or expansion in philosophy. We are here to explore the value generated when we deliberately reduce the intellectual and practical cravings that often define our respective fields.

  So, for these two days, let us practice this quietism. Let us value the spaces we create by what we *refrain* from adding – refraining from the demand for synthesis, refraining from the promise of enhancement, refraining from the craving for conceptual closure. Let the friction of our differing starting points be present, not as a problem demanding solution, but as a phenomenon to observe with a measure of detachment, seeking the stillness that might lie beneath the desire to resolve it.

  Welcome, again, to this shared experiment in subtraction. Let us proceed, not towards intellectual enrichment, but towards a potential quieting. Thank you.
