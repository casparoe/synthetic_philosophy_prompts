answer: |-
  ### Decision-Tree Taxonomy: Evolutionary Status of Structural Byproducts (Bat Case Study)

  **Observation:** Cave bat lineage has enlarged, ornate external pinnae. These show no detectable function (echolocation/thermoregulation/social signaling) but are developmentally inseparable from enlarged nasal resonating chambers directly selected for echolocation tuning.

  **Branching Questions:**
  1. **Q1: Can a structurally coupled non-functional byproduct (pinnae) have an evolutionary explanation *independent* of the feature that generated it (nasal chambers)?**  
     - *No* → **Branch to Q2**  
     - *Yes* → **Branch to Q3**  

  2. **Q2: Does every trait showing apparent complexity/design *obligate* an adaptive explanation?**  
     - *Yes* → **Leaf: STRICT ADAPTATIONISM**  
       *(Awkward commitment: Must argue the ornate pinnae *must* have a hidden function despite exhaustive negative evidence, dismissing developmental constraint as irrelevant.)*  
     - *No* → **Leaf: [UNOCCUPIED: FUNCTIONALISM WITHOUT ADAPTATION]**  
       *(Incoherent: Accepts no independent explanation for byproducts but denies adaptive obligation for apparent design. Fails to explain *why* non-adaptive traits exhibit complexity.)*  

  3. **Q3: Should developmental constraint be treated as an *explanatory competitor* to natural selection, not just its boundary?**  
     - *No* → **Branch to Q4**  
     - *Yes* → **Leaf: PLURALIST STRUCTURALISM**  
       *(Awkward commitment: Argues the pinnae's form is *sufficiently* explained by developmental architecture alone, rendering selectionist narratives for the coupled system redundant.)*  

  4. **Q4: Where does the burden of proof lie regarding the pinnae's *current* status?**  
     - *On those claiming a non-adaptive origin* → **Leaf: EXAPTATIONISM** (or late-stage adaptationism)  
       *(Awkward commitment: Must assert the pinnae *will likely be co-opted* for future function or have cryptic utility, despite no evidence.)*  
     - *On those claiming a hidden function* → **Leaf: GOULD-LEWONTIN SPANDRELISM**  
       *(Awkward commitment: Treats the pinnae as definitively non-adaptive *now and forever*, even if future selection could act on them.)*  

  ---

  **Indistinguishable Pair:**  
  - **Exaptationism** and **Late-Stage Adaptationism** *cannot be split* by this tree.  
  - **Why?** Q4 asks about *burden of proof for current status*, not historical origin. Both positions assume the trait is *currently* functional (exaptationism implies prior non-function, late-stage adaptationism implies prior function). The tree lacks a node asking: *"Was the trait non-adaptive when it originated?"* Without this, they collapse into "non-adaptive origin requires proof" vs. "adaptive origin assumed."  

  ---

  **Verdict:**  
  **Gould-Lewontin spandrelism is best supported** for this bat case. The pinnae show no functional evidence despite testing, are developmentally entrenched with a known selected trait, and imposing adaptive narratives risks inventing "just-so stories." This implies spandrel explanations deserve **substantial weight** in evolutionary biology—not as mere curiosities, but as null hypotheses where adaptationist predictions fail. Developmental architecture generates non-adaptive forms as predictably as selection molds adaptations; ignoring this inflates selection's explanatory scope. While exaptation remains possible, demanding *proof* of non-adaptation (as exaptationism does) reverses the scientific burden when no adaptationist evidence exists.
