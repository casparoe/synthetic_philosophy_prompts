answer: |-
  Your observation captures a profound failure mode that sits at the intersection of **translation studies**, **discourse analysis**, and **computational pragmatics**. The closest established concept is **"relational incoherence"** or **"pragmatic structure inversion,"** but these lack the precision you seek. A more targeted term from philosophy of language is **"systematic de-anchoring of illocutionary force"** (drawing on Austin/Searle), though it's not a perfect fit.

  ### Existing Concepts & Gaps:
  1.  **Discourse Coherence Failure (Halliday & Hasan):**
      *   **Difference:** General term for broken logical/sequential links (e.g., random pronoun errors, topic shifts). Your case is *systematically inverted*, not randomly broken, with *preserved surface cohesion* (pronouns agree, conjunctions exist).
  2.  **Context-Truncation Artifact:**
      *   **Difference:** Arises from limited input window, causing *omission* or *fragmentation*. Your examples show *complete, fluent sequences* where the *relations themselves* are inverted within the processed context, not lost due to truncation.
  3.  **Equivocation/Ambiguity:**
      *   **Difference:** Involves genuine lexical/syntactic ambiguity in the source. Your case involves *unambiguous source structures* where the system *chooses the wrong relational anchor* despite clarity.

  ### Proposed Term: **Relational Inversion Artifact (RIA)**
  This term precisely names the failure mode you describe, with strict boundary conditions:

  **Definition:** A *Relational Inversion Artifact (RIA)* occurs in sequential text processing when:
  1.  **Local Fidelity:** Output exhibits fluent syntax, accurate lexical choice, and grammatical correctness at the clause/sentence level.
  2.  **Preserved Relation Type:** The system correctly identifies the *existence* of a relational structure requiring coherence across sequences (e.g., hierarchy, logical opposition, anaphoric chain).
  3.  **Systematic Inversion:** The *semantic/pragmatic valence* of that relational structure is systematically reversed (e.g., superior ↔ subordinate, thesis ↔ antithesis, cause ↔ effect) across the sequence.
  4.  **Surface Cohesion Intact:** Mechanisms ensuring surface textual cohesion (pronoun resolution, conjunctions, register consistency *within* utterances) are correctly deployed, masking the deeper inversion.
  5.  **Non-Randomness:** The inversion is predictable/replicable for the given relational structure and system, not a stochastic error.

  **Boundary Conditions:**
  *   **Not RIA:** Random discourse incoherence (e.g., mismatched pronouns), context truncation errors (missing segments), simple lexical mistranslation, or cases where relational structures are entirely omitted/collapsed rather than inverted.
  *   **Is RIA:** Fluent local output with cohesive devices intact, but the core semantic/pragmatic relationship (hierarchy, logic, polarity) is globally inverted across the sequence.

  ### Why "Relational Inversion Artifact" Fits Your Cases:
  1.  **Japanese Honorifics:**
      *   *Local Fidelity:* Each utterance uses grammatically correct honorifics/humble forms.
      *   *Preserved Relation:* The system recognizes honorifics signal hierarchy.
      *   *Systematic Inversion:* The hierarchical direction (who defers to whom) is flipped across the exchange.
      *   *Surface Cohesion:* Register is consistent *within* each turn; the dialogue *appears* coherent.
      *   *Artifact:* Result of the system's focus on local role assignment without dynamic tracking of *cumulative pragmatic force* defining the relationship.
  2.  **Philosophical Argument:**
      *   *Local Fidelity:* Pronouns agree; sentences are grammatically sound.
      *   *Preserved Relation:* The system recognizes anaphora need resolution.
      *   *Systematic Inversion:* The logical polarity (thesis vs. antithesis) of the referent is inverted within the chain.
      *   *Surface Cohesion:* The anaphoric chain *appears* intact grammatically.
      *   *Artifact:* Result of resolving reference based solely on surface-level lexical/syntactic proximity or salience, ignoring the *argumentative macrostructure*.

  ### Theoretical Underpinnings:
  *   **Pragmatics (Sperber & Wilson, Relevance Theory):** RIA occurs when the system fails to compute the *cumulative cognitive effects* of utterances in sequence, focusing only on local relevance. The inverted relation becomes the "most relevant" context for the system locally, but is globally incoherent.
  *   **Discourse Representation Theory (DRT):** The system builds a local Discourse Representation Structure (DRS) for each sentence accurately but fails to update the *global DRS* with the correct relational predicates (e.g., `SUPERIOR(X,Y)` becomes `SUBORDINATE(X,Y)`).
  *   **Translation Studies (Baker, House):** This is a severe form of **"pragmatic mismatch"** specifically affecting **textual pragmatics** (overall communicative purpose and inter-sentential relations) rather than just **functional pragmatics** (single utterance intent). It highlights the system's inability to model **dynamic context updating**.

  ### Distinguishing Feature:
  RIA is characterized by **cohesive competence coupled with pragmatic-structural incompetence**. The system demonstrates mastery of the "glue" (cohesion) but fundamentally misapprehends the "architecture" (relational semantics/pragmatics) it's trying to hold together.

  This term provides the precision you need to isolate this specific failure mode from broader notions of error or misunderstanding, directing focus to the *systematic inversion of relational meaning* despite local accuracy and surface coherence. It names the ghost in the machine you've perceptively identified.
