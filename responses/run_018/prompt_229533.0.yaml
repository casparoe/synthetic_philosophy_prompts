prompt: |-
  I am a staff journalist at a magazine that covers science and ideas. Two or three times a month I write up an empirical finding—an experiment, an observational study, a natural experiment—in which researchers offer an explanation for a pattern in their data. Increasingly I find that the same data arrive with two or more rival explanations attached, each internally coherent and each able to account for the observed numbers. My difficulty is not deciding which explanation is true; it is knowing what my copy is entitled to say.

  I would like a reusable procedure I can run on each story, in a few hours, without a statistician and without specialized modeling software. It should tell me when I may write that the evidence supports or favors an explanation, when I may write only that an explanation is consistent with the evidence, and when I must write that the available evidence does not discriminate between the rival explanations. Ground the procedure in what the philosophy of science actually supports about the underdetermination of theory by evidence: that a finite body of data is in general compatible with more than one incompatible explanation, so what advances a claim is whether the evidence discriminates among the live alternatives rather than merely fitting one of them.

  Please give the procedure as a checklist or flowchart in words, with the questions in the order I should ask them. For each question, say what counts as a sufficient answer, where the procedure stops with weak language, and where it permits stronger language. Mark plainly the steps at which a judgment call is required and cannot be eliminated by the procedure, and note the points where a working journalist will predictably go wrong, such as confusing a good story with a discriminating test or treating an explanation's ability to fit the data as evidence for it.

  Then run the procedure on the following three situations from my beat:

  1. A psychology paper reports that twenty minutes in a park improved working-memory scores in forty undergraduates relative to their own scores from that morning, and the authors claim the natural setting causes a cognitive boost. The same before-after improvement would also be produced by practice effects, regression toward the mean, or simply taking a break, and the study has no comparison condition.

  2. Two groups of economists analyze the same administrative panel data on declining labor-force participation among prime-age men. One group says the cause is the automation of routine jobs; the other says the cause is an expansion of disability-benefit eligibility. The broad trends fit both accounts. One group's model predicts a sharper participation decline in high-routine occupations; the other's predicts a sharper decline in counties where benefits became easier to obtain. The paper I am covering reports only the aggregate trends.

  3. A randomized trial assigns participants either to a working-memory training program or to an active control game matched for time, contact, and expectation. The training group improves more than the control group on one transfer test that the program explicitly targets, and this is the only one of several measured outcomes on which the groups differ.

  At least one of these should produce an answer I will not like, whether because it tells me to drop a causal claim my editors and readers find appealing or because it leaves me unable to choose between the competing explanations. Say plainly which case that is and why. Finally, state what the procedure cannot do: the situations where, even after running it, the honest conclusion is that the evidence underdetermines the choice among explanations, and no amount of journalistic care will remove that.
reasoning: |-
  We are designing a reusable procedure for a journalist to evaluate when evidence supports, is consistent with, or does not discriminate between rival explanations. The procedure is grounded in the philosophy of science, particularly the underdetermination of theory by evidence. We want to know when the evidence discriminates among the live alternatives.

  The key idea: An explanation is supported by the evidence if the evidence is more likely under that explanation than under the rivals. If the evidence fits multiple explanations equally well, then we cannot say it supports one over the others. We must be cautious not to confuse consistency (the evidence fits) with support (the evidence is more probable under this explanation than others).

  We'll structure the procedure as a checklist of questions. At each step, we may stop with a conclusion or proceed. We note where judgment is required and common pitfalls.

  **Procedure Checklist:**

  1. **Identify the rival explanations.**
     - What are the competing explanations (at least two) that are offered (or could be offered) for the observed pattern?
     - *Sufficient answer*: A list of at least two explanations that are internally coherent and can account for the observed data.
     - *Judgment call*: Deciding which explanations are "live" (i.e., plausible and in the current discussion) and which are not. Be inclusive but not exhaustive (focus on the ones that are actually being discussed or are obvious alternatives).
     - *Pitfall*: Overlooking a plausible rival explanation that is not mentioned in the paper or press release.

  2. **Check if the evidence is consistent with all the rival explanations.**
     - Does the evidence fit (i.e., is it compatible with) each of the rival explanations? If not, we can rule out the ones that are inconsistent.
     - *Sufficient answer*: If an explanation is inconsistent with the evidence (e.g., it predicts the opposite of what was observed), then it can be ruled out. Otherwise, it remains.
     - *If inconsistent*: You can write that the evidence is inconsistent with that explanation and thus it is not supported. But note: if there are multiple rivals and one is ruled out, we still have to compare the remaining ones.
     - *If consistent with all*: Proceed to step 3.
     - *Judgment call*: Assessing whether an explanation is truly inconsistent (e.g., due to auxiliary assumptions) may require careful thought.

  3. **Determine if the evidence discriminates between the remaining rival explanations.**
     - Does the evidence make one explanation more likely than the others? We need to see if the evidence is more probable under one explanation than under the others.
     - *Sufficient answer*: Look for specific aspects of the data that the explanations predict differently. If one explanation predicts the observed pattern with high probability and the others predict it with low probability (or predict a different pattern), then it discriminates.
     - *How to check without modeling*: 
       - Look for a "discriminating test": a part of the data (or a feature of the design) that the explanations make different predictions about.
       - Check if the study design includes controls or comparisons that rule out some explanations (e.g., a control group in an experiment).
       - Check if the data include patterns that are predicted by one explanation but not the others (e.g., subgroup differences, temporal patterns, etc.).
     - *If the evidence discriminates in favor of one explanation*: Then you may write that the evidence supports or favors that explanation (with the strength of the language depending on how well the evidence discriminates and the quality of the study).
     - *If the evidence does not discriminate*: Then you must write that the available evidence does not discriminate between the rival explanations, and note that they are all consistent with the data.
     - *Judgment call*: Assessing the relative likelihood of the evidence under each explanation may be qualitative. Also, the quality of the study (e.g., sample size, measurement, controls) matters for how much weight to give the discrimination.

  4. **Consider the quality of the study and the risk of confounding.**
     - Even if the evidence discriminates, we must ask: Could the observed pattern be due to an artifact, bias, or confound that the study did not control for?
     - *Sufficient answer*: If the study design has a flaw that allows an alternative explanation (e.g., no control group, non-random assignment, measurement error) that was not considered in step 1, then we must include that as a rival and go back to step 2.
     - *If a new rival is introduced*: Then we must check consistency and discrimination again for this rival.
     - *If the study is well-designed and controlled for the main confounds*: Then we can be more confident in the discrimination.
     - *Pitfall*: Confusing a statistically significant result with a well-controlled study. Also, note that a study might have high internal validity but low external validity.

  5. **Synthesize and choose language:**
     - Based on the above, decide on the appropriate language:
       - **Supports/Favors**: If the evidence discriminates in favor of one explanation and the study is of good quality (controls for major confounds, etc.), then use "supports" or "favors". Be cautious: if the discrimination is weak, use weaker language (e.g., "suggests" or "points to").
       - **Consistent with**: If the evidence fits an explanation but does not discriminate it from others (or if the study has significant flaws that leave other explanations plausible), then use "consistent with" or "compatible with". Avoid implying support.
       - **Does not discriminate**: If multiple explanations are consistent and the evidence does not favor one over the others, then state that the evidence does not discriminate between them.

  **Common Pitfalls Throughout:**
  - Confusing consistency with support: Just because an explanation fits the data does not mean it is supported over others.
  - Overlooking rival explanations: Especially those that are not glamorous or that are methodological (e.g., practice effects, regression to the mean).
  - Treating a single study as definitive: Science is cumulative. One study might not be enough to discriminate, especially if underpowered or flawed.

  Now, we apply the procedure to the three situations.

  ---

  **Situation 1: Park visit and working memory**

  1. **Rival explanations**:
     - Explanation A: Natural setting causes a cognitive boost.
     - Explanation B: Practice effects (doing the test twice).
     - Explanation C: Regression toward the mean (if the first test was taken on a bad day, the second might be better by chance).
     - Explanation D: Taking a break (any break) helps.

  2. **Consistency**: The evidence (improvement after park visit) is consistent with all these explanations.

  3. **Discrimination**: 
     - The study has no comparison condition. Therefore, we don't know if the improvement is due to the park specifically (A) or if it would have happened with any break (D) or even without a break (B and C). 
     - There is no data that can discriminate because there is no control group (e.g., a group that took the test twice without a break, or with a break in a non-natural setting). 
     - **Conclusion**: The evidence does not discriminate between A, B, C, and D.

  4. **Quality and confounds**: The lack of a control group is a major flaw. It leaves open these alternative explanations.

  5. **Language**: We must write that the evidence is consistent with the natural-setting explanation but does not rule out practice effects, regression to the mean, or the benefits of taking any break. We cannot say the evidence supports the natural-setting explanation.

  **Result for Situation 1**: We must use weak language. The evidence does not discriminate. We cannot support the causal claim.

  ---

  **Situation 2: Declining labor-force participation**

  1. **Rival explanations**:
     - Explanation A: Automation of routine jobs.
     - Explanation B: Expansion of disability-benefit eligibility.

  2. **Consistency**: The aggregate trends (the broad decline) are consistent with both.

  3. **Discrimination**:
     - The paper only reports aggregate trends. However, the two groups of economists have designed models that make different predictions at a more detailed level (e.g., by occupation or by county). 
     - But the paper being covered does not report these detailed analyses. We are only given the aggregate trends.
     - Since we only have the aggregate trends, and these are consistent with both, the evidence in this paper does not discriminate between A and B.

  4. **Quality and confounds**: The paper uses administrative panel data, which is good, but without the subgroup analyses, we cannot tell which model fits the data better. The existence of the models suggests that there might be a way to discriminate, but the current paper doesn't do it.

  5. **Language**: We must write that the evidence (the aggregate trends) is consistent with both explanations but does not discriminate between them. We can note that the researchers have proposed more refined tests (by occupation or county) but these are not in the current paper.

  **Result for Situation 2**: The evidence does not discriminate. We must use language that indicates both are consistent, and we cannot choose.

  ---

  **Situation 3: Randomized trial on working-memory training**

  1. **Rival explanations**:
     - Explanation A: The training program causes improvement in the targeted transfer test.
     - Explanation B: The improvement is due to a placebo effect or expectation (but note: the control group was matched for expectation, so this should be controlled).
     - Explanation C: The improvement is a false positive (type I error) because multiple outcomes were tested.

  2. **Consistency**: 
     - The evidence (the training group improved more than the control on one test) is consistent with A.
     - It is also consistent with C (chance finding) because multiple outcomes were tested and only one was significant. Without correction for multiple comparisons, the chance of a false positive is elevated.

  3. **Discrimination**:
     - The design includes an active control group matched for time, contact, and expectation. This rules out placebo and time/contact effects. So Explanation B (placebo) is inconsistent? Actually, it should be controlled by the design. So we can rule out B as a major explanation.
     - However, Explanation C (multiple testing) remains. The study measured several outcomes and only one was significant. This pattern is more likely under Explanation C (if the training had no effect) than under Explanation A? Not necessarily: Explanation A predicts an effect on the targeted test and possibly others, but if the effect is specific, then the targeted test might be the only one that shows an effect. However, the fact that multiple tests were done without correction raises the chance of a false positive.
     - How to discriminate? We need to consider the strength of the evidence. The study was randomized, which helps. Also, the outcome that improved was the one the program explicitly targeted, which makes it less likely to be a false positive. But we still have the multiple testing issue.

     - Let's reframe: The evidence (significant effect on the targeted test and non-significant on others) is consistent with both:
        - A: The training works only on the targeted skill.
        - C: The one significant result is a false positive.

     - Without knowing the pre-specified primary outcome or seeing a correction for multiple comparisons, we cannot rule out C.

     - However, if the targeted test was the primary outcome and the others were secondary, and the study was designed with adequate power for the primary, then we might discount C. But the problem doesn't specify.

  4. **Quality and confounds**: 
     - The randomized design and active control are strengths. 
     - The issue of multiple testing is a weakness. 
     - Also, note that the problem says "the only one of several measured outcomes on which the groups differ". This suggests that the other outcomes were tested and found non-significant. But without knowing if the study corrected for multiple comparisons or pre-registered a primary outcome, we have to consider the risk of false positive.

  5. **Language**:
     - We can say that the evidence is consistent with the training program having a specific effect on the targeted test. However, because of the multiple testing issue, we cannot rule out the possibility of a false positive. 
     - Therefore, we might use cautious language: "The training group showed improvement on the test that the program was designed to target, but not on the others. This finding is consistent with the program having a specific benefit, but due to the number of tests performed, it could also be a chance finding. More research is needed."

     - Alternatively, if we know that the targeted test was the primary outcome and the study was adequately powered and pre-registered, then we could be more confident. But without that, we must be cautious.

     - However, note that the control group was active and matched for expectation, so we have ruled out many confounds. The main rival left is chance (multiple testing) or a true specific effect.

     - **Conclusion**: We can say the evidence supports a specific effect on the targeted test, but we must note the caveat of multiple testing. The strength of the support is moderate because the control group is good and the effect is specific. But without knowing about the multiple testing adjustment, we cannot be fully confident.

  **Judgment**: In practice, many journalists would report this as a positive finding. Our procedure, however, flags the multiple testing issue as a rival explanation. We might allow "supports" but with a caveat about the other tests.

  But note: the procedure requires that the evidence discriminates between the rivals. Here, the evidence (one significant test out of several) is more likely under the specific effect explanation (if we assume that the training should only affect the targeted test) than under the null? Not necessarily: it could be a false positive. So without a statistical adjustment, we cannot be sure.

  Therefore, we might say:

  - Because the study is randomized and controlled, and the effect is on the targeted test, it supports the training program for that specific outcome. However, the multiple testing issue means we should interpret the result with caution.

  **Result for Situation 3**: We can say the evidence supports the explanation that the training improves the targeted skill, but we must note the caveat about multiple comparisons. This is a borderline case. Without knowing if the study corrected for multiple comparisons, we might lean towards supportive language but with caution.

  ---

  **Which case produces an answer you will not like?**

  Situation 1 and 2 require weak language and do not allow us to support the causal claim. Situation 3 allows somewhat stronger language but with a caveat.

  You might not like Situation 1 because the park study is appealing, but we cannot support the causal claim due to the lack of a control group. Similarly, Situation 2 leaves us unable to choose. Situation 3 might be acceptable but with a caveat that might be downplayed in popular reporting.

  **What the procedure cannot do:**

  The procedure cannot eliminate underdetermination when the evidence is insufficient to discriminate. In such cases, the honest conclusion is that the evidence underdetermines the choice among explanations. This is inherent in the data and study design. No amount of journalistic care can remove that. The procedure can only help us recognize and report it honestly.
answer: |-
  Below is a reusable, philosophy-of-science-grounded procedure for evaluating rival explanations in empirical findings. It follows a checklist format, prioritizes discrimination over fit, and explicitly addresses underdetermination (the idea that evidence alone cannot fully resolve between competing theories). The procedure requires **no specialized software** and can be completed in **a few hours** using standard tools like spreadsheets or basic critical thinking. It focuses on **three key questions** derived from scientific reasoning:  
  - **Consistency**: Does the evidence fit the explanation?  
  - **Discrimination**: Does the evidence favor one explanation over rivals?  
  - **Confounding**: Could bias or design flaws undermine discrimination?  

  Judgment calls (where subjectivity is unavoidable) and common pitfalls (like mistaking fit for evidence) are marked. Stronger language (e.g., "supports") is permitted only when discrimination is clear; otherwise, default to weaker terms (e.g., "consistent with" or "does not discriminate").  

  ---

  ### **Procedure Checklist**  
  **Ask these questions in order. Stop early if evidence fails a step.**  

  1. **What are the rival explanations?**  
     - *Sufficient answer*: List **all live, internally coherent explanations** that fit the observed data. Include obvious alternatives (e.g., methodological artifacts like regression to the mean) even if unstated in the paper.  
     - *Judgment call*: Deciding which explanations are "live" (plausible and debated). Err on inclusivity.  
     - *Pitfall*: Overlooking rivals because they’re uninteresting or the paper omits them.  
     - *If <2 rivals*: Stop. Evidence may "support" the sole explanation if consistent (but rarely—rivals usually exist).  
     - *If ≥2 rivals*: Proceed.  

  2. **Is the evidence consistent with all rivals?**  
     - *Sufficient answer*: Evidence must be **compatible** with each rival (e.g., predicted by their mechanisms). If inconsistent, rule out that rival.  
     - *Judgment call*: Assessing if an explanation truly conflicts with the data (e.g., does it predict a different outcome?).  
     - *Pitfall*: Confusing "consistency" with "support." Consistency is necessary but not sufficient for support.  
     - *If inconsistent with a rival*: Eliminate that rival. Proceed with remaining rivals.  
     - *If consistent with all rivals*: Proceed. Language remains weak (e.g., "consistent with").  

  3. **Does the evidence discriminate between rivals?**  
     - *Sufficient answer*: Evidence must **differentiate** rivals by being:  
       - **More probable** under one explanation than others (e.g., Outcome X is likely under Explanation A but rare under B).  
       - **Tested via controls/comparisons** that isolate mechanisms (e.g., a control group rules out placebo effects).  
     - *How to check without stats*:  
       - Identify **unique predictions**: Does one rival predict a specific pattern the others do not? (e.g., "If Explanation A is true, we should see Y in subgroup Z.")  
       - Check for **differential fits**: Does the evidence align better with one explanation’s mechanism (e.g., dose-response, timing, subgroup splits)?  
       - Demand **comparative tests**: Were rivals directly tested (e.g., via experiment with multiple conditions)?  
     - *Judgment call*: Deciding if differences in probability/plausibility are substantial. Default to skepticism.  
     - *Pitfall*: Treating a "good story" as discrimination. If evidence fits all rivals equally, it doesn’t favor any.  
     - *If discriminates*: Stronger language permitted (e.g., "supports A over B").  
     - *If does not discriminate*: Stop. Use "evidence does not discriminate between rivals" or "consistent with but not specific to."  

  4. **Could confounding or bias explain the result?**  
     - *Sufficient answer*: Evaluate **study design** for flaws that permit unconsidered rivals (e.g., no control group, selection bias, multiple testing).  
     - *How to check*:  
       - **Controls**: Were key confounds (e.g., practice effects) measured or controlled?  
       - **Methodological rigor**: Was randomization/blinding used? Were outcomes pre-registered?  
       - **Sensitivity**: Would small changes in assumptions alter the result?  
     - *Judgment call*: Weighing severity of flaws. Minor issues may not undermine discrimination; major ones do.  
     - *Pitfall*: Ignoring design flaws because the finding is novel or appealing.  
     - *If major confounds exist*: Revisit Step 1 to add new rivals (e.g., "measurement error"). Restart the process.  
     - *If minor/no confounds*: Proceed with language from Step 3.  

  #### **Language Guide**  
  - **"Supports/favors"**: Permitted only if evidence discriminates (Step 3) and confounds are minor (Step 4).  
  - **"Consistent with"**: Use if evidence fits but does not discriminate (Steps 2 or 3).  
  - **"Does not discriminate"**: Use if all rivals remain viable after Step 3.  

  ---

  ### **Application to Your Cases**  
  **Situation 1: Park visit and working memory**  
  - **Rivals**: (1) Natural setting causes cognitive boost; (2) Practice effects; (3) Regression to the mean; (4) Break-taking benefit.  
  - **Consistency (Step 2)**: Evidence (improvement) fits all rivals.  
  - **Discrimination (Step 3)**: No comparison condition (e.g., break in urban setting). All rivals predict the same outcome. **No discrimination**.  
  - **Confounding (Step 4)**: No control group → major flaw. Adds rival: "Any break improves scores."  
  - **Conclusion**: Evidence **does not discriminate** between explanations. You cannot claim support for the natural-setting hypothesis. Weak language required (e.g., "consistent with, but could reflect practice effects or regression").  
  - *You won’t like this*: Editors/readers may prefer the "nature boost" narrative, but the design fails to test it.  

  **Situation 2: Declining labor-force participation**  
  - **Rivals**: (1) Automation; (2) Disability benefits.  
  - **Consistency (Step 2)**: Aggregate trends fit both.  
  - **Discrimination (Step 3)**: The paper reports **only aggregate trends**, not subgroup analyses (e.g., high-routine jobs vs. high-benefit counties). No unique predictions are tested. **No discrimination**.  
  - **Confounding (Step 4)**: Administrative data are robust, but omitted variables (e.g., wage stagnation) could lurk.  
  - **Conclusion**: Evidence **does not discriminate**. Write: "Trends are consistent with both automation and benefit-expansion theories; the study does not test which fits better locally."  
  - *Honest underdetermination*: The data exists to discriminate (via subgroups), but this paper doesn’t use it.  

  **Situation 3: Working-memory training trial**  
  - **Rivals**: (1) Training causes improvement; (2) Placebo/expectancy effects; (3) False positive from multiple testing.  
  - **Consistency (Step 2)**: Improvement on the targeted test fits all (even placebo, though active control mitigates this).  
  - **Discrimination (Step 3)**:  
    - Active control matches time/expectancy → weakens Rival 2.  
    - But multiple outcomes were tested; only one (the explicitly targeted test) is significant. This pattern is **more probable under Rival 1** (true effect on the target) than Rival 3 (false positive), especially if the targeted test was pre-specified as primary.  
  - **Confounding (Step 4)**: Risk of false positive (Rival 3) remains if outcomes weren’t pre-registered or multiple comparisons adjusted.  
  - **Conclusion**: Evidence **supports** training for the targeted outcome, but note caveats: "The improvement is specific to the task the program targeted, suggesting a focused benefit, though chance remains possible given multiple tests."  
  - *Borderline case*: Discrimination is tentative; if multiple testing was severe, weaken to "consistent with."  

  ---

  ### **What the Procedure Cannot Do**  
  Even after running this checklist, **evidence may underdetermine explanations** when:  
  1. **Rivals are empirically equivalent**: Theories make identical predictions for available data (e.g., Situation 1).  
  2. **Data lacks resolving power**: Measurements are too coarse (e.g., Situation 2’s aggregate trends).  
  3. **Flaws prevent discrimination**: Design errors introduce unresolvable ambiguity (e.g., uncontrolled confounds).  

  In these cases, no journalistic framing can justify "support" for one explanation. Honest reporting must:  
  - State that evidence is insufficient to choose between rivals.  
  - Highlight what data/test would discriminate (e.g., "A control group would clarify..." or "Subgroup analyses could separate...").

  **Final note**: Science is cumulative. One study rarely resolves rivalry; your copy should reflect this. When discrimination is weak, default to humility: "This suggests X, but Y and Z remain plausible."
