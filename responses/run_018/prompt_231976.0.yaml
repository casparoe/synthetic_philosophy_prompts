  The crucial move is when he shifts from "I cannot find" marks to "there exist no" certain marks. The first is psychological (his failure), the second is metaphysical (impossibility). The transition happens through the phrase "attentively considering those cases" - implying sustained rational examination yields the stronger conclusion. 

