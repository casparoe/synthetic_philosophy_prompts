  my econ prof said friedmans argument about unrealistic assumptions is basically like the london tube map: it deletes every station that isnt on your line, distorts distances, and pretends the thames doesnt exist, but you still get where youre going. he uses this to defend macro models with rational agents and perfect markets -- the unrealistic bits are just filtered-out stations, not lies. i think theres a difference between omitting a station and inventing a train that travels faster than light, but i cant formalize it. can you lay out the correspondence table -- whats the model, the map, the deleted stations, the rider, the actual geography? then tell me exactly where the analogy breaks, especially on whether an omission is the same kind of error as a positive falsehood about human cognition, and whether the conclusion that unrealistic assumptions are harmless survives once the cracks are visible. if the tube-map comparison collapses, whats a less misleading analogy for how idealization actually works in science?
