  ## The Silent Affliction: Affective Valence Without Belief or Body and the Nature of Emotion

  The nature of emotion remains a contested landscape in philosophy and cognitive science, dominated by three primary frameworks: the **cognitive-judgment theory** (emotions as evaluative judgments), the **embodied-feeling theory** (emotions as perceptions of bodily states), and the **perceptual theory** (emotions as direct perceptions of evaluative properties). The conceptual test case of "silent affective valence" – a stable, object-directed feeling of profound "wrongness" directed at a geometric configuration, devoid of propositional belief, physiological change, or distinct bodily sensation – serves as a potent probe, exposing the fault lines between these accounts and challenging the adequacy of our existing taxonomy.

  **The Theories and Their Core Commitments:**

  1.  **Cognitive-Judgment Theory:** Emotions are identified with, or necessarily involve, specific evaluative judgments or appraisals (e.g., Solomon, Nussbaum). Fear *is* the judgment that something is dangerous; anger *is* the judgment that one has been wronged. Crucially, these judgments are propositional or articulable in principle – they represent the world as being a certain way. Emotion requires cognitive evaluation.
  2.  **Embodied-Feeling Theory (Classical):** Emotions are primarily constituted by the perception of specific patterns of physiological arousal and bodily changes (e.g., James, Lange, Damasio). Fear *is* the feeling of a racing heart, sweaty palms, and muscle tension *caused* by a threat. The conscious feeling *is* the perception of the bodily disturbance. Physiological markers and interoception are essential.
  3.  **Perceptual Theory:** Emotions are sui generis perceptions of evaluative properties in the world or in the subject-object relation (e.g., Roberts, Tappolet, Deonna & Teroni). Fear is the direct perceptual experience *of* the dangerousness of the object, akin to visually perceiving color. This registration of value is non-conceptual and non-inferential, though it can inform judgments. Emotion is a mode of evaluative awareness.

  **The Pressure of Silent Affective Valence:**

  Our subject experiences a persistent, object-directed sense of profound "wrongness" or "disorder" solely upon encountering a specific geometric shape. Crucially:
  *   **No Belief:** They report no associated propositional belief ("This shape is mathematically incorrect," "It signifies evil," "It causes harm").
  *   **No Physiology:** No measurable physiological changes (heart rate, skin conductance, muscle tension) correlate with the experience.
  *   **No Bodily Feeling:** They deny any distinct qualitative bodily sensations beyond the bare, non-sensory *sense of orientation* towards the shape as "wrong." There is no felt flutter, tension, warmth, or chill associated *with* the valence itself.

  This scenario presents a stark challenge:

  *   **Against Judgment Theories:** The core commitment is shattered. The affective orientation is stable and object-directed, clearly an emotional *response* to the stimulus, yet it lacks the articulable evaluative judgment deemed necessary. Judgment theorists might posit an unconscious or non-propositional appraisal. However, the subject's explicit denial and the *stability* of the feeling without any emerging articulation push against this. If judgment is essential, this "silent valence" must be something other than emotion – perhaps mere intuition or proto-emotion. But its profound, motivating character ("profoundly wrong") strongly suggests a genuine emotional core.
  *   **Against Classical Embodied Theories:** The absence of measurable physiological changes and, more critically, the denial of *any* distinct qualitative bodily sensations beyond the orientational feeling itself, directly contradicts the core tenet that emotion *is* the feeling of bodily change. While modern embodied accounts (e.g., "enactive" views) might broaden "body" to include sensorimotor dispositions, the *complete absence* of interoceptive qualities beyond the bare evaluative orientation seems difficult to reconcile. If the feeling of the body is constitutive, what *is* the subject feeling beyond the registration of "wrongness"? The theory struggles to account for the valence without its bodily signature.

  **Can Perceptual Theory Absorb the Silenced?**

  The perceptual account appears uniquely positioned. It can interpret the "silent affective valence" precisely as described: a direct, non-conceptual perceptual registration of the geometric configuration *as* possessing the evaluative property of "wrongness" or "disorder." This registration:
  *   Requires no prior or concurrent articulable judgment (belief).
  *   Requires no distinct bodily feeling *as its object or constituent*; the feeling *is* the perception of the object's badness. The "bare sense of orientation" *is* the perceptual experience of the evaluative property.
  *   Is intrinsically motivating and intentional (object-directed), fitting the phenomenology.

  **Objections and Counterweights:**

  1.  **Collapse into Mood/Aesthetics?:** The strongest objection is that this "silent valence" is not a genuine emotion but rather resembles a mood (objectless affective state) or a purely aesthetic response (judgment of beauty/ugliness without full emotional depth). However, the *object-directedness* distinguishes it from mood. While aesthetic responses can be object-directed, the description ("profoundly wrong," potentially motivating avoidance) suggests a depth and gravity often associated with core emotions like disgust or dread, exceeding mere aesthetic displeasure. Perceptualists can argue that aesthetic responses *are* emotional perceptions of value properties ("ugly," "jarring," "unharmonious") and that this case simply highlights a pure, non-bodily-focused instance.
  2.  **"Thin" Perception:** Critics might argue that without belief or bodily feeling, the perception is too "thin" to constitute a full emotion. Perceptualists counter that perception itself can be rich and motivating (e.g., the immediate perceived threat of a looming shape). They can also allow that this *core* evaluative perception often *causes* judgments and bodily changes in typical emotions, but isn't logically dependent on them. The "silent" case reveals the core perceptual layer stripped of its usual accompaniments.
  3.  **Explanatory Gap (Embodied):** Embodied theorists might argue that *some* subtle, non-measurable or non-conscious physiological/bodily process *must* be occurring to ground the feeling. However, the conceptual force of the case lies in stipulating its absence – demanding an account that doesn't rely on this. It highlights the *possibility* of valence without bodily feeling.
  4.  **Epiphenomenal Belief (Judgment):** Judgment theorists might contend the valence *is* a belief, just inarticulate. But this stretches "belief" beyond recognition, risking vacuity. If an inarticulate, non-propositional "feeling that" counts as a judgment, the distinction between judgment and perception blurs fatally.

  **Conclusion: Perceptual Resilience and Taxonomic Tremors**

  The scenario of "silent affective valence" delivers a decisive blow to the *strict* versions of cognitive-judgment and classical embodied-feeling theories. The absence of articulable belief is fatal to judgment theories' core requirement, while the absence of physiological markers and distinct bodily sensations undermines the constitutive claim of classical embodied accounts.

  The perceptual theory emerges as the most resilient framework. It successfully accommodates the core features of the case: stable, object-directed evaluative orientation without requiring propositional belief or bodily feelings as necessary constituents. The perception *of* the shape's "wrongness" *is* the emotional core. While objections concerning the "thinness" of the perception or its potential conflation with aesthetic response carry weight, they do not fundamentally undermine the theory's ability to categorize this experience *as* an emotional one – specifically, as a direct, non-conceptual registration of negative evaluative properties.

  However, the case does more than vindicate one theory; it exposes a limitation in our tripartite taxonomy. It suggests that the perceptual account captures a fundamental layer of emotional experience – the direct grasp of value – that can exist independently of, though typically intertwined with, cognitive judgments and bodily feelings. This implies that emotion might be best understood as a *spectrum* or with a *core-periphery* structure:

  1.  **Core:** A direct, perceptual registration of evaluative properties (affective valence).
  2.  **Periphery:** Often accompanied by, and causally linked to, articulable judgments (cognitive elaboration) and physiological/bodily feelings (embodied resonance).

  The "silent affective valence" case peels back the periphery, revealing the core evaluative perception in relative isolation. Therefore, while the perceptual theory best survives the pressure of this specific case as the framework most capable of recognizing the experience *as emotional*, it simultaneously demonstrates that our traditional taxonomy needs refinement. It pushes us towards a model where a perceptual core of value registration is primary, and cognitive and embodied elements, while profoundly important in most emotional episodes, are contingent accompaniments rather than necessary and sufficient defining conditions of emotion *as such*. The profound "wrongness" silently felt towards the geometric shape is not an emotion *manqué*; it is emotion laid bare.
