  **INTERNAL MEMORANDUM**  
  **AETHELON GROUP**  
  **OFFICE OF CROSS-SPECIES ETHICS AND UNIVERSAL STAKEHOLDER GOVERNANCE (OCEUSG)**  
  **MEMORANDUM #:** OCEUSG-POL-1142.7  
  **DATE:** 2024-05-15  
  **SUBJECT:** Mandatory Implementation of the Aethelon Universal Stakeholder Covenant (AUSC) Framework & Associated Protocols  

  ---

  **1.0 PURPOSE**  
  This memorandum formalizes the global implementation of the **Aethelon Universal Stakeholder Covenant (AUSC)**, effective immediately. The AUSC establishes a non-arbitrary, species-neutral framework for ethical decision-making, grounded in the **Triadic Moral Weighting Formula (TMWF)** and operationalized via the **Inter-Species Deliberative Quorum (ISDQ)** requirement. Compliance is mandatory for all divisions, subsidiaries, and contracted entities. The AUSC supersedes all prior ethical guidelines, particularly those relying on unexamined species-based hierarchies.  

  **2.0 BACKGROUND: THE AETHELON UNIVERSAL STAKEHOLDER COVENANT (AUSC)**  
  2.1 **Core Principle:** Moral consideration must be allocated solely based on intrinsic properties and relational contexts, irrespective of phylogenetic classification or arbitrary species boundaries.  
  2.2 **Triadic Moral Weighting Formula (TMWF):** Stakeholder impact assessments shall utilize the TMWF to assign moral weight (W) via the following variables:  
  > **W = (PC * S * RP)**  
  > Where:  
  > - **PC (Phenomenal Capacity):** The empirically assessed range and depth of subjective experience (e.g., capacity for pleasure/pain, complex cognition, future anticipation). Measured via OCEUSG-certified protocols (See Appendix A-1142.7δ).  
  > - **S (Sentience Threshold):** Binary qualification confirming baseline capacity for valenced experience. Entities failing OCEUSG Sentience Assay v.3.1 are excluded from W calculations but may trigger ecological impact reviews under Section 4.3.  
  > - **RP (Relational Proximity):** The degree of causal entanglement and dependency between Aethelon operations and the stakeholder entity (e.g., employees, supply-chain inhabitants, facility co-residents). Ranges from 0.1 (incidental proximity) to 1.0 (direct contractual or custodial relationship).  
  > *Note: Species membership is not an independent variable within the TMWF. Weight derives solely from PC, S, and RP.*  

  **3.0 INTER-SPECIES DELIBERATIVE QUORUM (ISDQ) REQUIREMENT**  
  3.1 **Trigger:** Any proposed policy, operational change, or capital project projected to affect **>500 non-human sentient entities** (NHSEs), or any single entity with a TMWF score ≥0.7, necessitates an ISDQ review.  
  3.2 **Process:**  
  > 3.2.1 A **Cross-Species Impact Assessment (CSIA)** must be commissioned from an OCEUSG-accredited **Moral Status Auditor (MSA)**.  
  > 3.2.2 The MSA will:  
  > > a) Quantify affected NHSEs using TMWF.  
  > > b) Model welfare impacts across applicable PC spectra.  
  > > c) Propose mitigation strategies adhering to the AUSC’s Negative Rights Framework (minimizing direct harm) while acknowledging Welfare Maximization tensions (Section 7.1).  
  > 3.2.3 Findings are presented to a rotating **Stakeholder Proxy Panel (SPP)** incorporating bioethicists, welfare biologists, and OCEUSG-trained human advocates simulating non-human perspectives (Simulation Fidelity Rating ≥0.85 required).  

  **4.0 INSTITUTIONAL APPLICATION & COMPLIANCE PROTOCOLS**  
  **4.1 Human Capital: Marginal Cases Protocol (MCP) for Hiring & Promotion**  
  > 4.1.1 **Principle:** Cognitive or physical capacity thresholds for roles constitute unjust discrimination where identical thresholds are not applied to all entities with comparable PC scores.  
  > 4.1.2 **Policy:**  
  > > a) Pre-employment cognitive screening tests for *Homo sapiens* applicants are prohibited (Violation Code: AUSC-HR-1). Capacity assessments must focus solely on task-specific competency demonstrable *post*-hire.  
  > > b) **MCP Ambiguity Resolution:** Roles involving abstract reasoning or complex communication (e.g., Strategic Forecasting Analyst, Tier 3) must now consider candidates from non-traditional taxa demonstrating equivalent PC via OCEUSG assessment (e.g., *Corvus corax* consultants under contract, *Tursiops truncatus* acoustic analysts).  
  > > c) **Promotion Tracks:** "Equal Consideration" (AUSC §4.iii) mandates inclusion of qualifying NHSEs in advancement pathways. Differential capacity (PC) does not justify exclusion but may inform role adaptation (e.g., cetacean analysts may require aquatic deliberation chambers; promotion timelines may adjust for non-human life-history parameters).  
  > > d) **Conflict:** Senior Leadership requests clarification on whether PC variance justifies differential compensation under "Equal Consideration." OCEUSG Ruling Pending (Docket #ETH-1142.7γ).  

  **4.2 Facility Management: Predation Non-Interference Treaty (PNIT)**  
  > 4.2.1 **Principle:** Lethal control of sentient pests (e.g., *Rattus norvegicus*, *Blattella germanica*) constitutes unjustified harm violating negative rights. Facilitation of predation imposes indirect complicity.  
  > 4.2.2 **Policy:**  
  > > a) Lethal traps, pesticides, or biocidal measures targeting sentient NHSEs within Aethelon facilities are prohibited (Violation Code: AUSC-FM-2). Non-lethal deterrents (ultrasonic, habitat modification) are mandatory.  
  > > b) **PNIT Clause 3:** Employees are prohibited from providing nutritional subsidies to facultative or obligate carnivores/omnivores residing within facilities (e.g., *Felis catus* "office cats") if such provisioning:  
  > > > i) Materially increases the predator's hunting efficacy or energy budget dedicated to predation.  
  > > > ii) Artificially sustains predator populations beyond carrying capacity, thereby amplifying total predation events.  
  > > c) **Conflict:** PNIT creates potential welfare trade-offs:  
  > > > i) Starvation/nutritional deficiency in predators if unsubsidized (*contra* Welfare Maximization).  
  > > > ii) Elevated non-lethal suffering in prey populations due to increased (non-fatal) predation attempts.  
  > > > iii) ISDQ Trigger: Dense insect colonies (>500 individuals) may necessitate a CSIA for non-lethal deterrent deployment. Contact OCEUSG for MSA referral.  

  **4.3 Supply Chain & Real Estate: Indirect Predation & Habitat Fragmentation**  
  > 4.3.1 **Context:** Acquisition of LogiSpan Solutions (LSS) necessitates review of its distribution hub adjacent to the Redmire Wildlife Corridor (RWC). LSS operations increase:  
  > > a) Vehicular strike mortality (VSM) of sentient vertebrates.  
  > > b) Edge-effect habitat fragmentation, altering predator-prey dynamics (e.g., increased *Canis latrans* success vs. *Sylvilagus floridanus*).  
  > 4.3.2 **AUSC Interpretation Challenge:**  
  > > a) **Duty to Mitigate?** High RP (Aethelon as direct cause of altered ecology) and significant PC scores of affected NHSEs suggest a positive obligation under Welfare Maximization to reduce VSM/fragmentation (e.g., wildlife bridges, reduced-night-speed policies).  
  > > b) **Non-Interference Principle?** Active intervention (e.g., prey population support, predator deterrents) may violate the rights of predators to pursue natural behaviors and disrupt baseline ecosystem processes.  
  > > c) **Replaceability Argument:** Does the prevention of VSM-induced death create a *net* welfare gain if deceased individuals are "replaced" via natural reproduction, potentially experiencing greater lifetime suffering?  
  > 4.3.3 **Ruling:** ISDQ Process **MANDATORY** (Projected NHSE Impact: ~2,300 vertebrates annually). LSS operations are frozen pending CSIA completion by an MSA. Mitigation costs exceeding 0.5% of LSS acquisition value require Board approval.  

  **5.0 DISSENT & IMPLEMENTATION**  
  > **5.1 Dissenting Footnote (Human Resources Traditionalist Caucus - HRTC):**  
  > *"While affirming the commitment to broad ethical consideration, the HRTC expresses operational concerns regarding §4.1.2b-c. Integrating non-traditional stakeholders into promotion tracks presents unresolved challenges re: performance evaluation standardization, benefits administration (particularly healthcare & retirement), and inter-employee dynamics shaped by deeply ingrained biological and cultural factors. We recommend a pilot program limited to non-leadership, project-based roles pending further study of human cultural comfort thresholds."* `// HRTC-1142.7α //`  
  > 5.2 **Implementation Timeline:**  
  > > - All policies effective immediately.  
  > > - Division heads must submit AUSC Alignment Plans by 2024-06-30.  
  > > - Mandatory TMWF & ISDQ Procedure Training (Module OCEUSG-LEARN-1142) required for all managers by 2024-07-31.  

  **6.0 CONCLUSION**  
  The AUSC embodies Aethelon Group’s commitment to becoming the world’s first truly post-speciesist multinational. While operational complexities exist, rigorous application of the TMWF and ISDQ process ensures ethical consistency across all stakeholder interactions. Non-compliance will be treated as a Category 4 Ethical Breach. Questions regarding MSA certification or CSIA triggers should be directed to OCEUSG-HelpDesk@Aethelon.Grp.  

  **SIGNED,**  
  **Dr. Lysandra Vex**  
  Chief Officer, OCEUSG  
  Aethelon Group  

  ---  
  **// END MEMORANDUM //**
