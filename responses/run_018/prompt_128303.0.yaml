prompt: |-
  I serve on the competency-review board of a surgical training program, and after a recent incident in which a resident passed every written examination yet failed to adapt when a simulated procedure presented an atypical tissue plane, I have become personally convinced that our assessments confuse propositional mastery with genuine operative skill. I need a practical evaluation procedure—something my committee can actually apply in the simulation lab—that operationalizes the philosophical distinction between knowing-how and knowing-that without requiring evaluators to make speculative claims about internal mental states. The procedure should take the form of an ordered sequence of observational tests, with explicit criteria for what counts as passing or failing each stage, designated points where the evaluation must halt because the question exceeds behavioral evidence and becomes a matter of values or institutional risk tolerance, and clear instructions for how to weight verbal articulation against manual adaptation when the two come apart. Crucially, it must incorporate what I have been calling perturbation-response mapping: the idea that knowing-how reveals itself not in error-free execution but in the topology of recovery—how quickly, with what economy of motion, and toward what functional endpoint a practitioner corrects after an introduced anomaly—rather than in the absence of deviation itself. Please apply the procedure to two worked cases: a laparoscopic dissection in which sudden bleeding obscures the standard triangular landmarks near the cystic duct, requiring the resident to navigate by tactile and visual affordances rather than named anatomical structures; and a suturing task under time constraint where the needle angle is deliberately non-standard, testing whether the hands reconfigure grip and rotation without waiting for explicit problem-solving. Deliver the entire response as continuous prose without headings, bullet points, bold formatting, or tables, suitable for inclusion in a formal committee memorandum.
reasoning: |-
  Okay, the user serves on a surgical training board and has encountered a problem: residents pass written tests but fail in simulated surgeries when faced with unexpected situations. They believe their current assessments confuse theoretical knowledge (knowing-that) with practical skill (knowing-how). The user wants a new evaluation method that focuses on how residents recover from errors, not just perfect execution. They call this "perturbation-response mapping."

  The user needs a practical procedure that can be applied in simulation labs. It should have clear steps, pass/fail criteria, and avoid speculating about mental states. They also want it to handle situations where verbal explanations don't match manual performance. Plus, they need two worked examples: one about laparoscopic dissection with unexpected bleeding and another about suturing with a non-standard needle angle.

  This is a sophisticated request blending philosophy (Ryle's knowing-how vs knowing-that), surgical education, and assessment design. The user is clearly frustrated with current methods and wants something actionable.

  For the evaluation procedure, I consider designing a sequence with four stages:
  1. Pre-perturbation baseline - to see standard technique
  2. Controlled perturbation - introducing the challenge
  3. Recovery phase - observing how they adapt
  4. Articulation phase - having them explain their actions

  Each stage needs specific observable criteria. For example, in the recovery phase, I'd look at time to stabilize, motion economy, and functional endpoint achievement. The procedure must specify when to stop evaluating if it becomes about values or risk tolerance - like if a resident makes dangerous choices that could harm real patients.

  For weighting verbal vs manual skills, I think prioritizing manual adaptation when they conflict, with articulation serving as a secondary indicator only if manual recovery is borderline.

  Now for the worked cases:

  First case: Laparoscopic dissection with sudden bleeding obscuring landmarks. I'd design the perturbation to hide the cystic duct area. Passing would require shifting to tactile cues and visual affordances quickly, without freezing or guessing. Failing would be persisting with textbook approaches despite visible futility.

  Second case: Suturing with a non-standard needle angle under time pressure. The perturbation is the awkward needle placement. Passing means automatic grip adjustment; failing would be pausing to overthink. Here, verbalization matters less than fluid correction.

  The response should be in continuous prose without markdown since it's for a formal memo. I'll use descriptive language to differentiate between passing and failing responses in each case, emphasizing recovery topology - the path they take to correct errors, not just the final outcome.

  I also need to incorporate their key concept of perturbation-response mapping throughout, showing how deviations reveal deeper competence than flawless routine performance ever could.
answer: |-
  The following evaluation procedure addresses the critical distinction between propositional knowledge (knowing-that) and embodied operative skill (knowing-how) through a structured, observable sequence focused on perturbation-response mapping. It prioritizes behavioral evidence over inferred cognition, delineates clear termination points where judgment becomes value-laden, and specifies manual adaptation as the primary evaluative weight when it diverges from verbal articulation. The procedure comprises four sequential stages, each with explicit pass/fail criteria and designated stopping thresholds. Applied within the simulation lab, it requires evaluators to document observable actions against these criteria in real-time.

  **Stage 1: Baseline Execution (Pre-Perturbation)**  
  *Objective:* Establish competence in standard technique under ideal conditions.  
  *Procedure:* Resident performs the core task (e.g., dissection, suturing) using conventional anatomy/methods without introduced anomalies. Time and motion efficiency are measured.  
  *Pass Criteria:* Task completion within time limit (e.g., <5 mins for suturing 5 cm incision), adherence to safety protocols, efficient instrument pathing (<20% redundant motion via motion tracking).  
  *Fail Criteria:* Violation of critical safety step (e.g., unsafe energy device activation), inability to complete task within 150% time limit, or persistent gross inefficiency.  
  *Termination Point:* Failure here halts evaluation, indicating insufficient foundational skill for perturbation testing. Proceed only if passed.

  **Stage 2: Controlled Perturbation Introduction**  
  *Objective:* Introduce a specific, replicable anomaly disrupting standard workflow.  
  *Procedure:* Evaluator triggers a predefined, clinically plausible perturbation (e.g., simulated sudden bleeding obscuring Calot’s triangle; suturing needle loaded at 45° to driver axis). Perturbation timing is standardized relative to resident progress.  
  *Observation Focus:* Initial reaction latency (<2 seconds indicates automatic processing), presence of startle/freeze response, first physical adjustment.  
  *Pass Criteria:* Recognition of anomaly within 5 seconds (via gaze fixation on source, instrument pause, or verbal acknowledgment like "unexpected bleed"), no unsafe reflexive action.  
  *Fail Criteria:* Failure to detect anomaly within 15 seconds, or impulsive unsafe action (e.g., blind clamping in bleeding).  
  *Termination Point:* Failure indicates profound situational unawareness. Evaluation halts.

  **Stage 3: Perturbation Response & Recovery Topology**  
  *Objective:* Assess quality of adaptation via perturbation-response mapping.  
  *Procedure:* Resident must stabilize the scenario and achieve functional task endpoint (e.g., hemorrhage control + safe duct identification; timely, secure suture placement with non-standard needle). No hints given.  
  *Key Metrics:*  
  - *Time to Functional Recovery:* Seconds from perturbation onset to controlled state (e.g., bleeding visualized/suctioned; needle regripped effectively).  
  - *Economy of Motion:* Percentage reduction in instrument path efficiency vs. baseline (penalizing >30% increase in path length).  
  - *Recovery Pathway:* Observed strategy (e.g., shifts from visual to tactile landmarks; regrips needle without reorienting entire driver).  
  - *Endpoint Achievement:* Safe, effective task completion post-perturbation.  
  *Pass Criteria:* Recovery time ≤120% of expert benchmark; motion economy decline ≤20%; functional endpoint achieved without critical errors; adaptation strategy utilizes non-propositional affordances (e.g., tissue tension, light reflection, instrument haptics).  
  *Fail Criteria:* Recovery time >200% benchmark; motion economy decline >50%; abandonment of task; critical error (e.g., ductal injury, suture pull-through); reliance on rote "textbook" maneuvers despite incongruity.  
  *Termination Point:* If resident recovers functionally but violates a *non-negotiable safety protocol* (e.g., monopolar use near unidentified duct), evaluation halts regardless—this is institutional risk tolerance, not skill assessment.

  **Stage 4: Post-Hoc Articulation**  
  *Objective:* Evaluate verbal explanation only if manual recovery was ambiguous.  
  *Procedure:* After task completion, resident explains actions during perturbation using surgical field replay.  
  *Weighting Rule:* Manual adaptation (Stage 3) dominates scoring. Verbalization is *only* consulted if Stage 3 performance was borderline (e.g., recovery time 150-200% benchmark).  
  *Pass/Fail Influence:*  
  - If Stage 3 passed clearly, articulation is noted but *not scored*.  
  - If Stage 3 borderline:  
    - *Pass Upgrade:* Articulation demonstrates accurate real-time perception of affordances (e.g., "I felt the cystic plate's firmness guiding dissection").  
    - *Fail Downgrade:* Articulation reveals reliance on declarative knowledge misapplied (e.g., "I kept looking for the triangle despite the blood") or inability to explain actions.  
  - If Stage 3 failed, articulation is irrelevant—evaluation concludes as fail.

  **Worked Case 1: Laparoscopic Cholecystectomy with Sudden Bleeding**  
  *Perturbation:* Simulated arterial bleed obscuring Calot’s triangle landmarks during cystic duct dissection.  
  *Stage 1 Pass:* Resident identifies triangle, creates critical view efficiently.  
  *Stage 2 Pass:* Resident notes "sudden bleeding" at 3 seconds, stabilizes camera.  
  *Stage 3 Assessment:*  
  - *Recovery Pathway:* Suctions precisely toward blood source (not wildly), uses suction tip to *gently tent* obscured tissue planes, applies judicious pressure on infundibulum to reduce inflow. Identifies duct by following the *smooth, tubular resistance* under suction tip, not visual landmarks.  
  - *Metrics:* Time to controlled field: 45s (expert benchmark: 40s); motion economy: 15% decline.  
  - *Endpoint:* Achieves safe duct clipping without injury.  
  *Stage 3 Pass:* Clear adaptation to haptic/visual affordances. Articulation not scored per rule.  
  *Failure Scenario:* Resident persists in "triangle hunting" visually, causes duct tear while probing obscured area blindly. Motion economy declines 60%, time to control 90s. Stage 3 fail—no articulation review.

  **Worked Case 2: Suturing with Non-Standard Needle Angle**  
  *Perturbation:* Needle loaded obliquely (45°) in driver at task start. Time constraint: 3 mins for 5cm closure.  
  *Stage 1 Pass:* Baseline suturing efficient with standard grip.  
  *Stage 2 Pass:* Resident notes "awkward angle" immediately upon needle grasp.  
  *Stage 3 Assessment:*  
  - *Recovery Pathway:* Upon needle skiving on first pass, *automatically* rotates driver 30° counterclockwise and adjusts wrist supination for next bite without pausing to inspect needle. No verbalization during action.  
  - *Metrics:* Recovery time: 8s (after first failed bite); motion economy: 10% decline; endpoint: secure closure in 2:50 mins.  
  *Stage 3 Pass:* Fluid grip reconfiguration demonstrates embodied knowing-how. Articulation irrelevant.  
  *Failure Scenario:* Resident stops after failed bite, removes needle, re-examines it, and verbally states "needle is bent, need to reposition." Time to resume: 25s; closure incomplete at 3 mins. Stage 3 fail (time >200% benchmark recovery). Borderline case could arise if recovery time is 15s and closure completed at 3:05 mins with minor tension issues; articulation might downgrade if resident says "I recalled the manual says needles load straight," revealing propositional crutch.

  This procedure operationalizes knowing-how through perturbation-response mapping, prioritizing observable recovery topology over error avoidance. It provides actionable behavioral thresholds, safeguards against evaluator speculation, and respects institutional boundaries where safety mandates supersede skill assessment. Implementation requires standardized perturbation protocols and calibrated timing/motion tracking, but remains grounded in observable intra-operative reality.
