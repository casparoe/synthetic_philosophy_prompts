  Second big practical headache: proxy decisions. The user's spot on about family sentimentality complicating things. Imagine a daughter insisting Mum "wouldn't want to live like this" while Mum herself seems content watching birds all day. Need to flag the Deprivation of Liberty Safeguards (DoLS) framework here - that's the UK's practical tool for challenging well-meaning but subjective judgements. Also worth mentioning how advanced directives bypass the "you don't know" problem entirely.

  Third layer: societal priorities. If we accept that cognitive preservation is a special case, this shifts how we allocate resources. The user's "rational default" phrasing is key - it suggests shifting the burden of proof onto those who'd neglect brain health interventions. Could reference NHS dementia prevention campaigns as concrete examples of this principle in action.

