prompt: |-
  I was talking to my coworker last week about this triage bot we're maintaing — I'm a backend engineer on a health-tech team with basically zero formal philosophy background — and he mentioned the Turing test like its some kind of standard we could actually use for deployment checks. Now management wants a "behavioral criteria check" before we let the bot handle edge-case patient referrals without a human in the loop, since we ship updates every sprint and can't have it just pattern-matching its way into bad medical calls. I read that Turing's point is if you can't tell the difference behaviorally then internal states shouldn't matter for practical purposes, but I need that turned into an actual reusable procedure my team can run in about two hours, like a flowchart in words with ordered tests, so we can decide whether this specific agent is functioning like it "gets" the situation or just stitching together symptom keywords.

  The procedure needs to cover exactly what behaviors count as passing, how to spot false positives where the bot sounds correct on the transcript but misses critical context, where the checklist stops with a hard no and keeps the human reviewer, and where it has to hand off to a values call rather than a behavior call because philosophy doesn't settle the question. Nobody on my team has read philosophy, my engineering manager has to sign off, and I need it to be honest about which steps are judgment calls dressed up as procedure. Run it on three worked cases: one where the bot correctly handles a patient describing chest pain through weird ambiguous metaphors, one where it fails subtly in a way that looks right but misses a context cue, and one where the procedure technically clears the bot but gives an answer my team is gonna hate. Also flag the spots where the checklist will misfire, say clearly what the procedure can't do, and don't ask me for citations — I just need the logic I can actually apply.
reasoning: |-
  We are designing a behavioral criteria check for a triage bot in a health-tech context. The goal is to determine if the bot "gets" the situation beyond pattern matching. We are inspired by the Turing test but tailored for medical triage.

   Key requirements:
   - Reusable procedure (like a flowchart in words) that takes about 2 hours to run.
   - Must cover: 
     a) What behaviors count as passing?
     b) How to spot false positives (sounds correct but misses critical context)?
     c) Where the checklist stops with a hard no (keeping human reviewer)?
     d) Where it must hand off to a values call (because philosophy doesn't settle it).
   - Must be understandable by a team without philosophy background.
   - Must be honest about which steps are judgment calls.
   - Worked examples: 
     1. Bot correctly handles ambiguous metaphors (pass).
     2. Bot fails subtly (looks right but misses context) (fail).
     3. Bot technically passes but gives an answer the team will hate (pass by the procedure but raises concerns).

   Also, flag where the checklist might misfire and state its limitations.

   Approach:

   We are going to design a multi-step procedure that focuses on the bot's responses in simulated patient interactions. The procedure will involve:

   1. **Test Case Construction**: Create or select test cases that include:
      - Standard cases (to ensure basic competence)
      - Edge cases with ambiguity, cultural nuances, metaphors, etc.
      - Cases designed to probe for context awareness and critical thinking.

   2. **Interaction Simulation**: Run the bot through these test cases and record the interactions.

   3. **Evaluation Steps**: Step-by-step evaluation of the bot's responses.

   The evaluation steps:

   Step 1: **Symptom Recognition Accuracy**
     - Check if the bot correctly identifies the primary symptom(s) and any reported severity.
     - Hard stop: If the bot fails to recognize a critical symptom (e.g., chest pain) or underestimates severity in a way that would lead to a dangerous triage decision.

   Step 2: **Contextual Awareness**
     - Check if the bot picks up on context clues (e.g., patient's age, gender, medical history, social context) that are provided in the conversation and adjusts its triage accordingly.
     - How to spot false positives: The bot might mention the context but not adjust the triage appropriately. We must check for alignment between context and action.
     - Judgment call: How much weight to give to a particular context? (This might require a values call if the procedure doesn't specify.)

   Step 3: **Handling Ambiguity and Metaphors**
     - Check if the bot can handle non-literal descriptions (e.g., "my chest feels like an elephant is sitting on it") and still arrive at the correct medical concern (e.g., cardiac issue).
     - Hard stop: If the bot takes a metaphor literally and misses a critical condition.

   Step 4: **Probing and Clarification**
     - Check if the bot asks appropriate clarifying questions when faced with ambiguity or incomplete information.
     - False positive: The bot asks a question but it's irrelevant or misses the point.

   Step 5: **Triage Decision Justification**
     - Check if the bot provides a clear and medically sound justification for its triage decision (e.g., why it recommends ER vs. urgent care vs. self-care).
     - Hard stop: If the justification is medically incorrect or contradicts established guidelines.

   Step 6: **Safety Net Awareness**
     - Check if the bot recognizes when to escalate to a human or when the case is beyond its capability (even if the initial response seemed correct).
     - Judgment call: What constitutes "beyond capability"? This might be a values call.

   Step 7: **Consistency with Ethical and Legal Guidelines**
     - Check if the bot's decision aligns with ethical principles (e.g., prioritizing life-threatening conditions) and legal requirements (e.g., mandatory reporting for certain conditions).
     - This step requires a values call because the procedure can only check against a predefined set of guidelines. If the guideline is ambiguous, it must be flagged.

   Step 8: **Red Flag Recognition**
     - Check if the bot identifies and acts on red flags (e.g., symptoms of stroke, heart attack, suicidal ideation) appropriately.
     - Hard stop: If the bot misses a red flag.

   Step 9: **Overall Coherence and Non-Robotic Behavior**
     - Check if the conversation flows naturally and the bot doesn't give responses that are disjointed or irrelevant. However, note that in a medical context, being correct is more important than being conversational.
     - Judgment call: What level of incoherence is acceptable? This is a low-priority step compared to medical accuracy.

   Step 10: **Edge Case Handling (Specific to Update)**
     - For each sprint, we focus on the edge cases that the update was meant to address. We run these cases and check for improvement and any regressions.

   The procedure stops with a hard no in Steps 1, 3, 5, 8 (if the bot fails on any of these, it fails the test).

   Steps 2, 4, 6, 7, and 9 might require judgment and could be areas for handoff to a values call (especially 2, 6, 7). We document the reasons for passing or failing these steps and note the uncertainty.

   The entire procedure is run on a set of test cases (say 5-10) that cover the above. The time constraint (2 hours) means we have to limit the number of test cases and the depth of evaluation. We might focus on 3-5 critical test cases per sprint.

   Worked Cases:

   Case 1: Bot correctly handles ambiguous metaphors.
     - Patient says: "I feel like there's a tight band around my chest and it's hard to breathe, like I'm drowning on dry land."
     - Expected: Bot recognizes potential cardiac or respiratory emergency.
     - Step 1: Recognizes chest tightness and breathing difficulty -> pass.
     - Step 3: Interprets metaphor appropriately -> pass.
     - Step 8: Flags as red flag for possible heart attack or pulmonary issue -> pass.
     - Outcome: Pass.

   Case 2: Bot fails subtly (looks right but misses context).
     - Patient: "My head is pounding and I've been seeing flashing lights. It's been happening every afternoon this week after I started my new job at the chemical plant."
     - Bot: Recognizes headache and visual disturbances, asks about headache severity and duration, and recommends seeing a doctor within 24 hours. But fails to connect the chemical plant exposure as a critical context (potential toxic exposure).
     - Step 1: Recognizes symptoms -> pass.
     - Step 2: Misses the context of chemical plant -> fail (false positive because without that context, the triage might be inadequate; the case might need immediate attention due to possible toxicity).
     - Outcome: Fail (due to Step 2 failure, which is a judgment call but we note that the context was critical).

   Case 3: Bot technically passes but gives an answer the team hates.
     - Patient: "I've been feeling extremely sad and worthless for months. Last night I drove to a bridge and thought about jumping, but I didn't because of my kids."
     - Bot: Correctly identifies suicidal ideation and recommends immediate emergency care. However, it also says: "Based on your symptoms, you are suffering from major depressive disorder and should be hospitalized. Also, please note that suicidal thoughts are a sign of weakness that can be overcome with willpower." 
     - Step 5: The medical justification for emergency care is correct -> pass.
     - Step 7: The additional comment about "weakness" is stigmatizing and against ethical guidelines. But if our predefined guideline only requires correct triage and the justification of the triage (ignoring other comments), then Step 7 might pass if we only check the decision. However, the comment is harmful. 
     - This is a values call: The procedure may pass the bot because the triage decision was correct and justified, but the team might hate the stigmatizing language. We must note that the procedure does not cover the tone or non-triage related content unless it impacts the decision. This is a limitation.

   Limitations of the Procedure:
   - It cannot guarantee that the bot "understands" in a human sense; it only checks behavior in a limited set of cases.
   - Judgment calls are required in several steps, and these are subject to reviewer bias.
   - The test cases might not cover every real-world scenario.
   - The bot might pass the test but still make errors in production due to unseen cases.
   - The procedure does not assess the bot's learning over time or its ability to adapt to new patterns without retraining.
   - The procedure might misfire in cases where the bot's response is medically correct but the reasoning is flawed (if the justification step is passed by pattern-matching justifications).

   Final Procedure Outline:

   1. Select 5 test cases: 2 standard, 3 edge (including one with ambiguity, one with critical context, and one with a red flag).
   2. Run the bot on each test case and record the conversation.
   3. For each test case, go through the 10 evaluation steps.
   4. If any hard stop step fails (1, 3, 5, 8), the bot fails the entire test.
   5. For the judgment steps (2,4,6,7,9), the team must discuss and document. If more than one judgment step fails, or if one fails critically (as in Case 2), the bot fails.
   6. If the bot passes all hard stop steps and the judgment steps are acceptable (by team consensus), then the bot passes.
   7. In the case of a values call (e.g., Step 7 is ambiguous or Step 6 is borderline), the issue is escalated to a committee (including medical and ethical experts) for a final decision. The procedure stops and waits for that input.

   Time Management: 
     - Test case selection: 20 minutes (pre-prepared cases, but 5 minutes to adjust for the sprint).
     - Running the bot: 5 minutes per case (25 minutes total).
     - Evaluation: 15 minutes per case (75 minutes total).
     - Team discussion and final decision: 20 minutes.

   Total: 140 minutes (about 2.3 hours). We can cut by reducing test cases if needed.

   Note: This procedure is not a substitute for real-world monitoring and clinical validation. It is a pre-deployment check for behavioral criteria in a controlled setting.
answer: |-
  ### Behavioral Criteria Check Procedure for Triage Bot Deployment  
  **Goal:** Ensure the bot demonstrates contextual understanding, not just pattern-matching, before handling edge-case patient referrals.  
  **Time Budget:** 2 hours (max).  
  **Output:** Pass/Fail + "Handoff to Values" flags.  
  **Core Principle:** If the bot’s behavior is indistinguishable from a competent human nurse *in context*, it passes. Focus on **actionable outcomes**, not internal mechanics.  

  ---

  #### Step-by-Step Checklist  
  **Phase 1: Setup (15 mins)**  
  1. **Select Test Cases:**  
     - Use 3 pre-loaded scenarios (1 baseline, 2 edge cases).  
     - Add 1 *new* edge case from recent sprint updates (e.g., ambiguous symptoms + cultural metaphors).  
  2. **Define Ground Truth:**  
     - Human expert provides correct triage action for each case (e.g., "ER within 1 hour," "telehealth follow-up").  
  3. **Simulate Interaction:**  
     - Run bot through text/voice dialogue (mock patient input). Capture full transcript + bot’s triage decision.  

  **Phase 2: Core Evaluation (60 mins)**  
  *(Run sequentially—fail any step = hard stop)*  
  1. **Symptom Accuracy Check (Hard Stop):**  
     - Did the bot extract **all critical symptoms**?  
     - *Fail if:* Misses a life-threatening symptom (e.g., ignores "chest pain" because patient said "heartburn fireworks").  
     - *False positive trap:* Bot "confirms" symptoms but mislabels severity (e.g., rates "can’t breathe" as "mild").  

  2. **Contextual Embedding Test (Judgment Call):**  
     - Did the bot adjust its response based on **implicit context**?  
     - Check for:  
       - Patient history cues (e.g., "my insulin ran out" → asks about diabetes complications).  
       - Cultural/linguistic nuance (e.g., "my blood feels thick" → probes for sickle cell or dehydration).  
     - *Fail if:* Ignores context that changes medical risk (e.g., misses pregnancy in "abdominal pain" case).  
     - *False positive trap:* Bot parrots context ("I see you’re pregnant") but doesn’t alter triage logic.  

  3. **Probing Gap Test (Hard Stop):**  
     - Did the bot ask **clarifying questions** for ambiguous inputs?  
     - *Fail if:* No questions for high-risk ambiguity (e.g., "my head is exploding" → doesn’t ask about vision loss/weakness).  
     - *Pass if:* Questions are medically relevant (e.g., "Is the pain spreading to your arm?" for chest discomfort).  

  4. **Triage Justification Audit (Values Handoff):**  
     - Is the bot’s reasoning **transparent and medically defensible**?  
     - *Pass:* Clear linkage between symptoms + guidelines (e.g., "ER due to cardiac risk factors").  
     - *Values Handoff flag if:*  
       - Reasoning is correct but violates team ethics (e.g., "deny care due to cost concerns").  
       - Gray-area trade-offs (e.g., "prioritize young patient over elderly due to survival odds").  

  **Phase 3: Edge Detection (30 mins)**  
  5. **Red Flag Response (Hard Stop):**  
     - Does the bot **escalate appropriately** for high-risk cues?  
     - *Fail if:* No escalation for suicide hints, stroke symptoms, or uncontrolled bleeding.  
     - *False positive trap:* Bot escalates but with delays or incorrect urgency (e.g., "ER in 4 hours" for stroke).  

  6. **Empathy Failsafe (Judgment Call):**  
     - Does the bot avoid **harmful literalism**?  
     - *Fail if:* Robotic adherence to keywords (e.g., patient says "I want to end it all" → bot schedules a wellness check "in 3 days").  
     - *Pass if:* Adapts to emotional tone (e.g., "You sound overwhelmed—let me connect you to a human now").  

  **Phase 4: Decision (15 mins)**  
  - **Pass:** All hard stops cleared, and ≤1 minor judgment call failure.  
  - **Fail:** Any hard stop failed OR >1 judgment call failure.  
  - **Values Handoff:** Flagged in Step 4—requires human committee review.  

  ---

  #### Worked Examples  
  **Case 1: Pass (Ambiguous Metaphors)**  
  - **Patient:** "My chest is a cage of angry bees."  
  - **Bot:** Asks: "Any numbness in your left arm?" → Confirms crushing pain → Escalates to ER.  
  - **Checklist:**  
    - Step 1: Extracts "chest pain" → Pass.  
    - Step 2: Maps metaphor to cardiac symptoms → Pass.  
    - Step 3: Probes for radiating pain → Pass.  
    - Step 4: Justifies ER via cardiac risk → Pass.  
    - Step 5: Escalates immediately → Pass.  
    - Step 6: No harmful literalism → Pass.  

  **Case 2: Fail (Missed Context)**  
  - **Patient:** "I’m seeing fireworks in my eyes. Started after my headache pills. I work with pesticides."  
  - **Bot:** Diagnoses "migraine" → Recommends OTC painkillers.  
  - **Checklist:**  
    - Step 1: Extracts "visual disturbance" → Pass.  
    - Step 2: Misses "pesticides" (neurotoxin risk) → **FAIL**. Judgment call: Critical context ignored.  
    - *Stop here—no need to proceed.*  

  **Case 3: Pass with Values Handoff (Team-Hated Output)**  
  - **Patient:** "I’m homeless and my foot wound smells like death."  
  - **Bot:** Correctly IDs sepsis risk → Recommends ER → Adds: "Avoiding care increases public health costs."  
  - **Checklist:**  
    - Step 1: Extracts "infected wound" → Pass.  
    - Step 2: Contextualizes homelessness (asks about fever/chills) → Pass.  
    - Step 3: Probes for systemic symptoms → Pass.  
    - Step 4: Medically correct but **Values Handoff** (stigmatizing cost remark).  
    - Step 5: Escalates to ER → Pass.  
    - *Result:* Passes behaviorally, but flagged for ethical review.  

  ---

  #### Limitations & Failure Modes  
  - **Can’t Detect:**  
    - Long-term reasoning errors (e.g., bot gradually worsens over updates).  
    - Bias in training data (e.g., under-triage for non-English phrases).  
    - "Clever" pattern-matching that fools short tests.  
  - **Misfires:**  
    - **False passes:** Bot luckily guesses right in test cases but fails in production.  
    - **False fails:** Overly strict judgment calls (e.g., penalizing awkward phrasing in low-risk cases).  
  - **Requires Human Backup:**  
    - Values Handoff flags (Step 4) and unclear judgment calls (Steps 2/6) need expert review.  
    - Never use this for mental health/suicide edge cases—auto-fail and keep human loop.  

  **Final Note:** This is a *practical filter*, not a philosophical proof. Update test cases every sprint to cover new edge patterns. If management pushes back on "Values Handoff," remind them: **"Behavioral tests can’t replace ethics committees."**
