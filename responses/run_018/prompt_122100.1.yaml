answer: |-
  Here are the five requested points:

  1.  **Precise Question & Gap:** Can the wrong of an aesthetically perfect, revealed forgery be solely explained by deception, or does a distinct institutional harm—specifically, the corruption of provenance systems as public epistemic infrastructure—persist even post-discovery, indicating a form of epistemic pollution? Current theories focusing on perceptual failure or disrupted causal history fail to address this potential systemic damage to collective knowledge practices.
  2.  **Conceptual Method:** The research will employ analytical philosophy to dissect the normative structure and function of institutional provenance-tracking systems (museums, auctions, academia), treating them not as aggregates of individual beliefs but as constitutive frameworks enabling public trust and stable object-identity within the artworld's epistemic ecosystem.
  3.  **Success/Failure Criteria:** Success entails demonstrating a conceptually robust residual harm intrinsic to the *system's* compromised integrity, distinct from individual deception. Failure occurs if the analysis concludes no harm persists post-discovery or if the identified harm reduces entirely to prior deception or historical falsity.
  4.  **Concrete Deliverable:** A practical framework outlining specific vulnerabilities within provenance systems exploited by forgeries, leading to actionable recommendations for enhancing institutional resilience against epistemic pollution, directly useful for provenance researchers and museum policy makers.
  5.  **Realistic Six-Month Outcome:** Realistically achievable is the development of the core conceptual framework distinguishing institutional epistemic harm from individual deception, its partial validation against key case studies, and the drafting of preliminary resilience guidelines; full system-wide validation or extensive policy detail would exceed this timeframe.
