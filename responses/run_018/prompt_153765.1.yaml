answer: |-
  The salt still lingered in the jar, a stubborn echo on the garage air. Elena wiped her hands on the frayed hem of her old lab coat, the one stained with indelible smudges of formalin and engine grease. Before her, humming with a low, uneven thrum that vibrated in her molars, sat the device. Wires snaked from a jury-rigged neural crown – a modified motorcycle helmet lined with scavenged sensors – to banks of repurposed equipment: oscilloscopes flickering green, data recorders spooling ancient tape, a cooling fan gasping against the heat generated by the overclocked processors salvaged from university cast-offs. It looked less like a gateway to profound experience and more like something that had crash-landed from a less competent future.

  She adjusted a dial, the resistance gritty under her thumb. Not pleasure. That was the crude bait of the old thought experiments. This… this was the *click*. The profound, gut-level satisfaction of the puzzle piece snapping into place, the elegant causal chain suddenly illuminated, the heated debate with a colleague that *shifted* something fundamental, leaving you breathless not with anger but with the dizzying expansion of understanding. The visceral thrill of watching, *really watching*, a creature in its element, its behaviour revealing a truth no textbook could ever impart. She’d built it to feel the *work* of knowing, the friction and the reward of truth-tracking itself.

  She’d just run a short sequence. Simulated: tracing the intricate link between a specific microplastic polymer and the aberrant spawning behaviour of *Acropora cervicornis*. The data points aligning, the confounding variables ruled out one by one, the moment of crystalline certainty blooming in her simulated mind – the fierce joy of *getting it right*, based on evidence gathered, tested, argued. It had been intoxicating, a pure hit of intellectual euphoria. Then came the cold splash: the jar of seawater sat undisturbed on the shelf above the oscilloscope. No ocean. No coral. No years of meticulous sampling, no risk of contamination skewing the results. Just her brain in a chair, fed a perfect counterfeit of discovery.

  The dissonance settled in her stomach like lead shot. It *felt* real. Every synaptic spark of triumph, the warmth of peer validation (simulated, of course), the profound peace of coherence achieved. But the *ground* was gone. The world hadn’t yielded that secret; her machine had fabricated the yielding. Was the feeling itself… counterfeit? Or was it a genuine experience, merely unmoored from its usual cause? Her hands, still capable, still marked by decades of handling nets and microscopes, hovered over the master switch. The salt smell, faint but persistent, was a reproach, or maybe an anchor.

  Mara. The thought sliced through the technical fog. Mara, her sister, wasting away in the hospice bed three miles away. Mara, who’d chased hydrothermal vents in crushing blackness, who’d wrestled sediment cores from the abyssal plain, whose body was now a map of pain no morphine could entirely erase. Mara, who’d scoffed at the original Experience Machine decades ago over cheap wine. "Give me a week of real mud, real cold, and maybe, *maybe*, finding one damn tardigrade that proves a hypothesis," she’d rasped, her laugh turning into a cough, "over a lifetime of blissful ignorance. The feeling only counts if it’s *about* something real, Ellie. Otherwise, it’s just… noise. Pretty noise, but noise."

  Elena looked at the humming contraption. Could it offer Mara relief? Not numbness, not mere pleasure – Mara would spit that out like bad water. But the simulated *victory*? The profound, earned satisfaction of a discovery hard-won? Could she gift her sister the phenomenology of epistemic achievement without the ache of the abyssal chill, the frustration of failed equipment, the years of grinding labour? Could she offer the feeling of *having gotten it right*, distilled and pure, untethered from the messy, painful world?

  She pictured Mara’s face, gaunt but still fierce. Offering the helmet would be like offering a meticulously crafted replica of her favourite diving medal, the one earned that stormy season off Andros. The weight might feel similar, the gleam identical. But Mara would know. She’d *feel* the absence of the salt-crusted strap, the tiny dent from hitting the research vessel’s rail, the sheer, stupid luck mixed with skill that had led to the discovery it commemorated. The meaning resided not just in the feeling of pride, but in the object’s history, its connection to a specific, chaotic, *real* moment in time. The machine’s epiphanies were medals minted in a void.

  But the pain… Elena’s knuckles whitened on the edge of the workbench. The low, constant throb Mara couldn’t escape. Was the *feeling* of hard-won understanding, even if simulated, inherently less valuable than the real thing when the real thing was now inaccessible? Could it constitute a different kind of well-being? A cognitive sanctuary? Or would it be the ultimate insult to Mara’s lifelong creed, a gilded cage for her fading mind, trapping her in a perfect counterfeit of the very thing she valued most – genuine contact with the world’s hidden gears?

  The cooling fan hitched, sputtered, then resumed its laboured whine. Outside, a real wind rattled the garage door, carrying the scent of cut grass and distant exhaust. Real, uncurated, indifferent. Elena picked up the saltwater jar, unscrewed the lid, and took a shallow breath. Brine, iodine, decay, life. Undeniably *there*. A complex, unprocessed truth.

  She thought of dialling the machine again, running the coral simulation, trying to dissect the feeling, to isolate the epistemic thrill from its absent foundation. But the thought felt hollow. The question wasn’t in the simulation’s fidelity anymore. It was in Mara’s eyes, in the echo of her voice saying "pretty noise." It was in the weight of the jar in her hand, the gritty dial under her thumb, the stubborn, unprogrammable reality of the wind.

  Elena carefully screwed the lid back onto the jar. The machine hummed on, promising profound, painless certainty. She reached out, not for the dials, but for the master switch. Her finger hesitated a millimeter from the plastic toggle. The garage held its breath, thick with the smell of ozone, hot metal, and the ancient, unassailable sea.
