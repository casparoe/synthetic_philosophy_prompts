answer: |-
  Here are your opening remarks, navigating the tension through Abhidhammic framing while respecting both audiences:

  ---

  **Opening Remarks: Workshop on "Anatta and Institutional Memory"**

  Good morning. Or perhaps, more precisely, good morning *now*, to this particular configuration of arising dhammas gathered in this space. We find ourselves conventionally designated as participants in a two-day workshop, co-hosted by entities we call the Philosophy Department and the Buddhist Studies Center, exploring "Anatta and Institutional Memory." Welcome to this momentary confluence of conditions.

  Why are these conditions arising? Conventionally, pragmatically – because institutions, like persons, *seem* to persist and change. They hold knowledge, traditions, ways of doing things – an "institutional memory." Yet, both our fields confront a radical challenge to this seeming continuity. From the Abhidhamma perspective, only momentary, dependently arisen *dhammas* possess ultimate reality (*paramattha-sacca*). The person (*pudgala*) is not a substantial self (*attā*), but a conceptual designation (*sammuti-sacca*), a useful convention over a dynamic, causally connected stream (*santāna*) of mental and material phenomena (*nāma-rūpa*), specifically the ever-flowing *citta-vīthi* – the process of conscious moments.

  Similarly, an institution: is it a single, enduring entity? Or is it, more accurately, a complex, ever-shifting pattern of interactions, documents, decisions, and momentary intentions (*cetanā*) arising and ceasing across countless individuals and contexts – an institutional *citta-vīthi*, if you will? Its "memory" isn't stored in a vault, but re-created, reinterpreted, and often contested, moment by moment, dependent on present causes and conditions.

  This is where the tension lies, and why we gather *now*. Conventionally (*sammuti-sacca*), we *must* speak of the workshop, the department, the institution, and ourselves as participants across time. This level is indispensable for function, for dialogue, for planning – for the very act of convening these kammic conditions. Denying it outright would render this gathering, and institutional life itself, impossible. Its utility is undeniable.

  Yet, ultimately (*paramattha-sacca*), we understand that this continuity is empty (*suñña*) of inherent, independent substance. There is no "workshop-atom" persisting unchanged from today to tomorrow. There is no identical "institutional self" underlying all its changes. The institution, like the person, is a dependently arisen process – a *santāna* of events and conventions, not an enduring *attā*.

  **For our philosopher colleagues:** Consider how this resonates with your debates. Is the institution best understood as a four-dimensional spacetime worm? Or as a narrative construct, a story we tell? The Abhidhamma analysis, emphasizing momentary *dhammas* and causal continuity (*paṭiccasamuppāda*), shares affinities with certain perdurantist or process views, yet crucially rejects any underlying substratum – any *attā*, whether temporal part or narrative core. It’s not mere bundle theory; it’s a radical process ontology where even the bundling is a conventional act.

  **For our Buddhist studies colleagues:** We ground this firmly in the settled doctrine (*nikāya*/*āgama* and core Abhidhamma): the definitive rejection of *attā* (*anattā*) and the framework of the Two Truths. However, we also acknowledge genuine points of scholarly contestation that will inform our discussions: **First**, can the conventional level of narrative or relational identity – crucial for institutions *and* persons – be robustly articulated within an *anattā* framework without smuggling in a subtle *pudgala*? **Second**, what was the precise nature and philosophical weight of the historical *pudgala-vāda* position? Was it a serious alternative grappling with the same tension between conventional necessity and ultimate emptiness that we face with institutions, or primarily a doctrinal foil constructed by its opponents?

  Our task over these two days – or rather, over these arising moments of discussion – is to hold this tension: the indispensable utility of institutional continuity and personal identity at the conventional level (*sammuti-sacca*), alongside the profound insight into their ultimate emptiness of inherent existence (*paramattha-sacca*, *suññatā*). We explore what "remembers," what "persists," and what truly *is*, when neither the institution nor the individuals within it possess an enduring self.

  So, let this momentary gathering of conditions begin. May our exploration of the stream – of cittas and institutions – be fruitful, challenging, and imbued with clear comprehension of the nature of this very convention. Thank you.

  ---

  **Key Elements Addressed:**

  1.  **Non-Reifying Welcome:** Welcomes the present moment's configuration ("dhammas gathered"), avoids assuming stable entities ("conventionally designated").
  2.  **Justification & Practical Necessity:** Explicitly states the *sammuti-sacca* level is indispensable for convening and function ("indispensable for function... impossible").
  3.  **Core Analogy:** Clearly frames institutional continuity as analogous to personal continuity using *citta-vīthi* (stream of moments) vs. the rejected enduring entity. Uses *santāna* (continuity) for both.
  4.  **Settled Doctrine:** Explicitly names *anattā* (no-self), Two Truths (*sammuti-sacca* vs. *paramattha-sacca*), *suññatā* (emptiness), dependent arising (*paṭiccasamuppāda*), and momentary *dhammas* as core, settled positions.
  5.  **Contested Issues:** Highlights the key debates: compatibility of *anattā* with narrative/relational identity, and the historical status/interpretation of *pudgala-vāda*.
  6.  **Audience Engagement:**
      *   *Philosophers:* References 4D-ism, narrative views, bundle theory (while distinguishing Abhidhamma), process ontology.
      *   *Buddhists:* Ensures *anattā* isn't reduced, grounds in core texts, flags specialist debates.
      *   *Administrators/Grad Students:* Emphasizes the practical necessity and utility of the conventional level.
  7.  **Navigating the Tension:** Consistently uses the Two Truths framework to hold both the conventional necessity and ultimate emptiness side-by-side ("hold this tension").
  8.  **Structure & Flow:** Moves from welcome -> justification via theme -> core analogy -> engagement with fields -> framing of key questions -> closing call to explore. ~5 minutes spoken.
  9.  **No Citations:** Pure spoken word, concepts explained contextually.

  This structure allows you to fulfill the practical role of opening the event while consistently undermining any metaphysical assumptions of enduring identity for the participants, the institution, or the workshop itself, all grounded in the specific Abhidhammic concepts requested.
