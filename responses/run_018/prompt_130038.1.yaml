prompt: |-
  hey i need a prompt for my dataset on philosohpy ideas. can you read Life of Pi through Wittgenstien's take on religous belief? specifically his idea that believing in god isn't like believing that some fact is true—it's more like adopting a picture or form of life, not competing with science for explanations. there's also that distinction he draws between believing that and believing in, which gets glossed over a lot in the usual summaries. i want you to focus on the ending where Pi gives the investigators two versions of the shipwreck—one with animals, one with people—and asks which story they prefer, then says the one with god is the better story. does the novel treat religious belief as just picking the nicer narrative, or does it actually show Wittgenstien's point that the animal story functions as a language-game that makes Pi's trauma liveable? where does the book push back—like, is the physical suffering too visceral to be reduced to a framework? and what does the framing of the interview itself add to the philosophy that a straight argument about belief-as-commitment misses? don't need citations, bibliographies, or reading lists—just take both the novel and the philosophy seriously, say where the reading holds and where it breaks, and mention one scene besides the ending that either supports or complicates the idea. also i typo'd "philosohpy" on purpose so you know this is casual.
