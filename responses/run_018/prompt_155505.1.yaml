          But note: the problem says the pairs are the same throughout. So the two students in the pair are fixed. 

          The problem: participants might interpret the tearing up as due to the other person (the Future-Self) not being trustworthy? But the treaty is about the Present-Self's action. The Future-Self might want to enforce, but the Present-Self might tear it up.

          The key is that the same person (student A) is the Present-Self in both round 2 and round 3? No, in round 2, student A is the Present-Self for round 2, and in round 3, student A is the Present-Self for round 3. So it's the same person making the decision in both rounds? But in round 2, they are making a decision for round 2, and in round 3, they are making a decision for round 3. 

          The treaty for round 3 is signed by student A (as the Present-Self of round 3) and student B (as the Future-Self of round 3). Then in round 3, student A might decide to tear up the treaty (costing 1 point) and then take the immediate reward. 

          From the perspective of student A, they are both the signer (as the Present-Self of round 3) in the negotiation in round 2 and the decision-maker in round 3. But note: they signed the treaty in round 2, but then in round 3 they are free to tear it up (at a cost). 

          This might feel like a change of mind? But the problem is that participants might think it's just irrational. However, the point is that it is rational under hyperbolic discounting. 

     What would change the designer's mind about the effectiveness:
