  ### **Hyperbolic Bargaining: A Role-Play Game on Intertemporal Conflict**  
  *Design for 14 students (7 pairs), 90 minutes*  

  ---

  #### **Materials**  
  - **Tokens**: 200 small identical tokens (e.g., buttons, beads).  
  - **Cards**:  
    - 14 role cards (7 × "A: Present-Self R1–4 / Future-Self R5–8"; 7 × "B: Future-Self R1–4 / Present-Self R5–8").  
    - 21 treaty cards (3 per pair, for rounds 3/5/7):  
      > **TREATY FOR ROUND [X]**  
      > "The Present-Self commits to DELAYED (5 pts in X+3).  
      > Signed: Present-Self ________, Future-Self ________.  
      > *Invoke jointly or tear up (cost: 1 pt).*"  
    - 56 choice cards (7 pairs × 8 rounds):  
      - Front: "IMMEDIATE: Take 2 pts NOW" | Back: "Consequence: Next round loses contract right + 1 pt penalty".  
      - Front: "DELAYED: Schedule 5 pts in ROUND [X+3]" | Back: "No penalty".  
  - **Shared pool per pair**: Small bowl with starting balance of 0 tokens.  
  - **Ledger per pair**: Tracking sheet for scheduled rewards (e.g., "R4: +5 pts if delayed taken in R1").  

  ---

  #### **Setup**  
  1. **Group Structure**:  
     - Divide into 7 pairs.  
     - Assign roles:  
       - **Student A**: Present-Self (R1–4), then Future-Self (R5–8).  
       - **Student B**: Future-Self (R1–4), then Present-Self (R5–8).  
     - Give each pair a bowl (shared pool), ledger, and treaty cards for rounds 3, 5, 7.  

  2. **Rules Briefing (10 min)**:  
     - **Each round (1–8)**:  
       - **Present-Self** chooses:  
         - **IMMEDIATE**: +2 tokens **now**. *→ Next round: Future-Self loses contract rights + 1 token penalty.*  
         - **DELAYED**: Schedule +5 tokens in **3 rounds** (record on ledger).  
       - **Treaty Token**: Present-Self holds 1 token/round. Play *before* choice to lock in DELAYED. Cost: -1 token from pool.  
     - **Treaties (Rounds 3,5,7)**:  
       - Negotiate for 2 min after rounds 2/4/6. Sign treaty card for *next* round.  
       - At round start: **Jointly invoke** to enforce DELAYED, or **tear up** (cost: -1 token; either can do unilaterally).  
     - **Key Twist**: Future-Self **cannot invoke treaties** if last round took IMMEDIATE (due to penalty).  
     - **Rounds 6–8**: DELAYED option disabled (no 3-round future).  

  ---

  #### **Game Flow (60 min)**  
  1. **Rounds 1–8 (6 min/round)**:  
     - **Start**: Add scheduled tokens (from ledger) + apply penalties from last round.  
     - **Present-Self action**:  
       - Option A: Play treaty token (-1 token) → Lock in DELAYED.  
       - Option B: Choose card (IMMEDIATE or DELAYED) → Resolve effects.  
     - **Treaty resolution** (if applicable): Invoke (enforce DELAYED) or tear up (-1 token).  
     - **Record**: Update pool/ledger.  
     - **Negotiation windows**: After rounds 2/4/6 (2 min each). Pairs sign treaties for upcoming rounds.  

  2. **Critical Dynamics**:  
     - **Round 2 Treaty (for R3)**: Typically signed easily (DELAYED feels optimal: 5 pts in R6 > 2 pts in R3).  
     - **Round 3 Breakdown**: Most pairs tear up treaty. Why? Hyperbolic discounting: *Now*, 2 pts (R3) feels larger vs. 5 pts (R6) than it did in R2. Temptation spikes despite unchanged payoffs.  
     - **Penalty spiral**: IMMEDIATE in R3 → R4 Future-Self loses rights + penalty → Harder to enforce future treaties.  
     - **Role reversal (R5–8)**: Repeats pattern with Student B as Present-Self.  

  3. **Final Scoring**: Tally tokens. Rank pairs.  

  ---

  #### **Debrief (15 min)**  
  1. **Map to Theory**:  
     - **Hyperbolic Discounting**: Plot rounds 2 vs. 3 decisions:  
       - Round 2: Discounted value of 5 pts (R6) > 2 pts (R3).  
       - Round 3: Discounted value of 2 pts (now) > 5 pts (R6).  
       → **Preference reversal** due to declining discount rate (steep drop for immediate delays).  
     - **Contrast Exponential Discounting**: Constant rate → no reversal.  
     - **Strotz’s Consistent Planning**: Treaties = precommitment devices. Breakdowns reveal "naive planning" under hyperbolic curves.  

  2. **Why Willpower-as-Resource Fails**:  
     - If self-control were depletable, treaties would break *gradually*.  
     - Observed: **Strategic abandonment** precisely when temporal proximity spikes temptation (R3, R5, R7) → Proof of *time-inconsistent preferences*, not depleted willpower.  

  3. **Limitations**:  
     - **Interpersonal ≠ Intrapersonal**: Conflict is bargained externally, not felt as inner struggle (facilitator must frame this verbally).  
     - **Misinterpretation Risks**:  
       - High-cooperation pairs may blame "untrustworthy partners," not time inconsistency.  
       - Tearing up treaties may seem "irrational" without hyperbolic lens.  
     → **Emphasize**: "You were *both* rational agents—hyperbolic discounting makes your interests diverge over time."  

  ---

  #### **Pilot Risks & Design Validation**  
  - **Failure Condition**: If tearing up treaties occurs **randomly** (not clustered in R3/R5/R7), the game fails to convey hyperbolic discounting’s visceral pull.  
  - **Likely Flaw**: Underestimating the **penalty’s domino effect**. Taking IMMEDIATE in R1–2 may feel harmless but cripples future contracts—mirroring real-world myopia.  
  - **Effectiveness Proof**: Pilot success if:  
    - >80% of R2 treaties are torn up in R3.  
    - Debrief reveals participants *feel* the "now bias" in R3 ("2 pts felt urgent even though nothing changed").  

  ---

  **Outcome**: Students experience hyperbolic discounting as strategic actors—not abstract theory—while revealing why self-control requires institutional scaffolds (treaties, penalties) to align temporal selves.
