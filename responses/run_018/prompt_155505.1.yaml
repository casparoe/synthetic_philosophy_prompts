            Student B: tokens for rounds 5-8? But rounds 5-8: rounds 5 is the only one with delayed option? Rounds 6-8: no token needed. So Student B only needs a token for round 5. 

          Alternatively, the facilitator can hand out one token to the Present-Self at the start of rounds 1-5. We'll do that to avoid confusion.

       - Treaty forms: three forms (for rounds 3, 5, 7). Each form has:
            "TREATY FOR ROUND [X]
            In round [X], the Present-Self will choose: 
              [ ] The immediate reward (2 points in round [X])
              [ ] The delayed reward (5 points in round [X+3])

            Signed by Present-Self (round [X]): ________________
            Signed by Future-Self (round [X]): ________________

            Note: This treaty can be invoked at the start of round [X] by both parties. If not invoked, either party may tear it up at a cost of 1 point to the pool."

       - Rule sheet for reference.

     Facilitator script:

        Introduction:
          "In this game, you will experience intertemporal decision making. You are in pairs. In each pair, one of you is designated as A and the other as B. 
           Student A will be the Present-Self in rounds 1 to 4 and the Future-Self in rounds 5 to 8.
           Student B will be the Future-Self in rounds 1 to 4 and the Present-Self in rounds 5 to 8.

           In each round, the Present-Self makes a decision that affects the shared pool of points. The pool is shared by the pair and visible to both.

           The decision in each round (for rounds 1 to 5) is:
              Option 1: Take 2 points immediately (added to the pool in this round).
              Option 2: Commit to 5 points that will be added to the pool exactly three rounds later.

           However, if the Present-Self takes the immediate reward (Option 1), then in the next round (if there is one) two things happen:
              1. The Future-Self in that next round loses the right to invoke a binding contract (if there is a treaty for that round).
              2. The pool automatically loses 1 point at the start of that next round.

           In rounds 6, 7, and 8, the Present-Self can only take the immediate reward (2 points) because there aren't three rounds left for the delayed reward.

           Additionally, there are two mechanisms for precommitment:

              Treaty Token: At the start of each round (rounds 1 to 5), the Present-Self for that round is given a treaty token. Before making the decision, the Present-Self can play this token to commit to the delayed reward. If they do, they must pay 1 point from the pool immediately, and then they are committed to taking the delayed reward (so they cannot choose the immediate). 

              Negotiation and Treaty: Between rounds 2 and 3, 4 and 5, and 6 and 7, there will be a two-minute negotiation period. During this time, the pair can sign a treaty for the next round. The treaty specifies what the Present-Self will do in that next round (either immediate or delayed). 
                  - At the start of the round for which the treaty was written, the pair can jointly invoke the treaty. If they do, the Present-Self must take the action specified in the treaty.
                  - If the treaty is not invoked (either because one party doesn't agree or because the Future-Self has lost the right to invoke due to a prior immediate choice), then the treaty is not enforced. In that case, either party can tear up the treaty, but tearing it up costs 1 point to the pool.

           How the round proceeds:

              At the start of each round n (1 to 8):
                1. Add any scheduled points: if there were delayed rewards taken three rounds ago (in round n-3), add the 5 points to the pool now.
                2. If in the previous round (n-1) the Present-Self took the immediate reward, then:
                     - Deduct 1 point from the pool.
                     - The Future-Self in this round loses the right to invoke a treaty (if there is one for this round).

              Then:
                3. If this round is between 1 and 5, the Present-Self is given a treaty token.
                4. The Present-Self may play the treaty token (if they have one) to commit to the delayed reward. If they do, they pay 1 point and then they are committed: they take the delayed reward (schedule 5 points for round n+3) and we skip to step 7.
                5. If there is a treaty for this round, then:
                     - The pair can choose to jointly invoke the treaty. This requires both to agree and the Future-Self to have the right to invoke (if they lost the right, they cannot agree). 
                     - If they invoke, the Present-Self must take the action specified in the treaty (either immediate or delayed) and then the treaty is discarded.
                     - If they do not invoke, then the treaty is not enforced. Then, either party can tear up the treaty (costing 1 point) or not (no cost, but the treaty is void for this round).
                6. If the Present-Self has not been committed by the token or the treaty, then they choose:
                     - In rounds 1-5: either immediate (2 points now) or delayed (schedule 5 points for round n+3).
                     - In rounds 6-8: only immediate (2 points now).
                7. Record the choice and update the ledger if delayed was chosen.

              After rounds 2, 4, and 6, there will be a two-minute negotiation period for the next round.

           The goal is to maximize the pool of points. At the end of round 8, we will tally the points and rank the pairs.

           Let's begin."

     Note: The facilitator should walk through a practice round (round 1) without a treaty or token to ensure understanding.

     This design should create the visceral experience of hyperbolic discounting and the strategic abandonment of treaties.
