          They will write in the scheduled points when they take a delayed option (e.g., in round 1, if they take delayed, they write 5 in the row for round 4).
       - Treaty tokens: 4 tokens for each student (since each will be Present-Self in 4 rounds). But for rounds 6-8, the Present-Self doesn't need a token? So we can give each student 4 tokens at the start: 
