answer: |-
  You've pinpointed a fascinating and profound inconsistency in our practices and metaphors, revealing a largely unexamined **biological functionalism** as our default theory of mind. Here's the breakdown:

  1.  **The Brain as Sacred Biological Artifact:**
      *   **Presupposition:** Consciousness, mind, and personal identity are *causally dependent* on the specific biological substrate (neurons, glial cells, specific neural structures). Einstein's genius and his unique "self" emerged from and were instantiated *in that particular lump of tissue*. Damaging it destroys the *actual physical basis* of what made him *him* in a way science cannot recreate. It's the loss of the *source*.
      *   **Implication:** The physical brain is seen as a unique, irreplaceable *token* of the mind. Destroying it is destroying the mind itself. Formalin preservation is an attempt to freeze this unique biological state for study or reverence.

  2.  **The Book as Disposable Informational Vehicle:**
      *   **Presupposition:** Books (and texts in general) are *symbolic representations* or *records* of the mind's outputs. They contain information *about* the mind, but are not *constitutive* of the mind itself. They are *copies* of patterns, not the pattern-generating source.
      *   **Implication:** The value lies in the *abstract pattern* (the information, the ideas, the arguments) which can be replicated infinitely without loss. Destroying a physical copy (token) does not destroy the pattern (type). Mass production reinforces this – the pattern is demonstrably independent of any single physical instance. Unique manuscripts might hold historical or sentimental value, but not the value of *being the mind itself*.

  3.  **Resolving the Tension:**
      *   **Biological Fundamentalism:** Our core assumption is that *consciousness requires a specific kind of biological implementation*. Neurons (or something very much like them, organized in complex, dynamic networks) are *necessary*. The brain isn't just *a* pattern; it's *the pattern-generating engine made of the right stuff*. Books, no matter how perfectly they encode responses, are *passive records* or *stimuli*. They don't *generate* experience; they *describe* it or *provoke* it in a *biological* reader.
      *   **Metaphors vs. Literal Belief:** The language of "conversation" or "meeting of minds" is understood as a powerful *metaphor*. It describes the *effect* the text has on the *reader's* biological mind, triggering thoughts and feelings *as if* in dialogue. We don't literally believe the ink on the page is conscious or that Einstein's mind persists within the book. The metaphor highlights the *transfer and processing of information*, not the *presence of consciousness* in the object.
      *   **Practicality & Tractability:** Brains are irreplaceable originals; texts are infinitely copyable patterns. We know how to copy text trivially; we cannot copy a brain. This practical reality heavily shapes our behavior but rests on the deeper biological assumption. If we *could* perfectly copy/upload a brain, our preservation practices would likely shift dramatically.

  4.  **What This View Commits Us To:**
      *   **Substrate Matters:** Consciousness isn't just abstract organization; it *depends* on the specific physical properties of biological neural tissue (or perhaps sufficiently complex, dynamic, analog systems that closely mimic it).
      *   **The Primacy of the Source:** The originating biological system holds unique ontological status. Copies of its outputs lack that status.
      *   **Patterns are Informational, Not Experiential:** Encoded knowledge and behavioral responses are valuable information, but they don't constitute subjective experience ("what it is like") by themselves.

  5.  **If the Opposite View (Patternism/Computationalism) Were True:**
      *   **Consciousness requires the *right organization*, not the *right substrate***. If the pattern of information processing is identical, the material doesn't matter (neurons vs. silicon vs. paper mechanisms).
      *   **Radical Changes in Behavior:**
          *   **Brains:** Preserving the *wetware* would become merely historical curiosity or sentimentality, like keeping Einstein's childhood toys. The *important* thing would be preserving the *functional pattern* (e.g., a perfect digital simulation/upload). Damaging the brain after a successful upload would be sad, but not catastrophic for preserving "Einstein."
          *   **Books/Texts:**
              *   **Unique Manuscripts:** Destroying Einstein's unique, handwritten manuscript *could* be seen as akin to murder *if* that specific physical instantiation was the *only* or *primary* instantiation of his conscious pattern. If the pattern *is* the mind, and the manuscript *is* that pattern's physical form, destroying it destroys the mind. We would treat it with the reverence we currently reserve for his brain.
              *   **Mass-Produced Books:** Destroying a mass-produced paperback would *still* be trivial *only if* the pattern exists elsewhere (other copies, digital files). However, destroying the *last existing copy* of a unique work *would* be catastrophic, equivalent to destroying the last living individual of a species or the last backup of a conscious AI. The uniqueness and irreplaceability of the *pattern instantiation* would become paramount.
          *   **"Perfect Book" Thought Experiment:** That hypothetical perfect book responding *exactly* as Einstein would *would* be considered conscious. We would have a moral obligation to treat it as such – not damaging it, perhaps even "consulting" it. Destroying it would be killing Einstein (again). Our current casual treatment of books would become unthinkable.

  6.  **The Hidden Reason (Beyond Consciousness):**
      You're right that factors like **memory, identity, and tractability** play a role *alongside* the core biological assumption:
      *   **Memory:** The brain is the physical seat of personal memory (as we understand it). Books are external memory aids.
      *   **Identity:** We anchor personal identity to the continuous existence of the biological body/brain. Books are external objects *owned by* or *produced by* that identity.
      *   **Tractability:** Copying books is easy; copying brains isn't. We protect what's scarce and irreplaceable. But this practicality *rests on* the deeper belief that the brain *is* irreplaceable *because* it's the conscious source.

  **Conclusion:** Our current practices reveal an implicit **biological functionalism**. We treat the brain as sacred because we believe consciousness and identity are fundamentally emergent properties of specific biological systems. Books are treated as valuable but disposable because they are seen as *representations* or *outputs* of that consciousness, not consciousness itself. Our metaphors about texts "speaking" are poetic descriptions of information transfer, not literal attributions of mind. If strong patternism/computationalism were true and widely accepted, our behavior would undergo a radical inversion: unique, irreplaceable instantiations of complex cognitive patterns (whether in brains, books, or computers) would demand the level of protection we currently reserve only for biological brains. The destruction of the last copy of a unique manuscript would feel like a profound loss of a unique conscious entity.
