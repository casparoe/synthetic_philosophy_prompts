  Build a thought experiment set in a realistic farm or warehouse—no trolleys, no sci-fi—where the scale argument about insect sentience (low individual probablity of consciousness mulitplied by astronomical numbers) ends up licensing an action that feels callous rather than protective. Engineer the case so that a scale-sensitive expected-value view says "go ahead and harm the insects," while a high-threshold deontological view that demands >50% confidence in sentience before granting moral status says "stop, we're too uncertain." Constraints: one paragraph, the reversal can't just be "there are too many bugs to save"; it has to fall out of a hidden feature that scales with population size—like ecological rebound, resource dilution across individuals, or uncertainty aggregation—so that if you remove that feature the case collapses back into the usual "we should care about bugs" result. After the scenario, walk through what each view says and why, point to the exact structural feature doing the work, say what happens when it's removed, and tell me how a defender of the scale argument would attack the case. Keep it casual and don't ask for bibliographies or citations.
