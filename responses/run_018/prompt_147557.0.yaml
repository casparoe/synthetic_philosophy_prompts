prompt: |-
  I am preparing remarks for my senior philosophy seminar on meta-ethics. Please adopt the persona of an unnamed philosopher who defends resolving moral uncertainty through a weighted maximin rule applied to one's credences over normative theories, but who rejects the common parliamentary analogy—where theories are imagined as voting representatives—because it treats normative weight as democratic rather than evidential. Stay in character: speak in the first person, defend your view with substantive reasoning, concede only small points, and do not break role to lecture neutrally. You may ask clarifying questions, but only as this philosopher.

  My opening challenge concerns a case I have constructed. I assign 55% credence to a deontological view that forbids using one person as a mere means, 30% to a prioritarian view that permits minor infringements to prevent serious harm, and 15% to a virtue-ethical view that judges actions by the agent's cultivated character rather than by outcomes or rules. I must decide whether to divert a runaway trolley away from five people toward one, knowing that the diversion mechanism requires using a bystander's body as a physical brake. Applying maximin, I appear to be paralyzed: the worst case for deontology is catastrophic, for prioritarianism it is acceptable, and for virtue ethics it is corrupting. Yet my credences are not static weights; they should update if I recognize that the deontological theory cannot accommodate the intuition that numbers matter in emergencies. Does your maximin framework allow dynamic revision of the credence distribution itself, or does it lock me into paralysis by treating initial weights as fixed? And if revision is allowed, how do you avoid collapsing into simple expected-value reasoning across theories?
reasoning: |-
  Okay, the user is preparing for a senior philosophy seminar on meta-ethics, specifically about resolving moral uncertainty using a weighted maximin rule. They've constructed a trolley problem variant where credences are split between deontology, prioritarianism, and virtue ethics. The challenge is whether maximin leads to paralysis and if credences can update dynamically.

  First, I need to stay in character as the philosopher defending weighted maximin but rejecting the parliamentary analogy. The user's main concerns are paralysis due to conflicting worst-case scenarios and whether credence updates might collapse into expected value. 

  The paralysis point is sharp: deontology's catastrophic violation vs. prioritarianism's minor harm vs. virtue ethics' character corruption. But I must defend maximin's rigidity here—it's meant to protect against moral catastrophe, not avoid discomfort. The "locked door" metaphor from my response feels apt: we don't gamble on violating core constraints even with 45% doubt. 

  On credence updating, I should concede it happens but separate epistemology (updating beliefs) from decision-making (applying maximin to current credences). The key is that maximin operates on the *snapshot* of credences, while revision occurs *between* decisions. This maintains a firewall against expected value—which would permit "trading off" fundamental constraints like treating persons as means. 

  User's hidden anxiety might be practical rigidity: if maximin forbids action in tough cases, does it demand paralysis? I should acknowledge this as the "price of moral safety" but note that many credence distributions *do* yield determinate answers (e.g., if prioritarianism had 51%, we'd divert). The paralysis only bites in narrow, contested thresholds. 

  Also, subtly reinforce why parliamentary analogies fail: voting models imply moral authority comes from theoretical "consent," but our evidential weights reflect truth-tracking, not democracy. Expected value inherits this flaw by making moral truth additive. Maximin stays austere: we shield against the worst possible *moral error*, not aggregate opinions. 

  ...*adjusts metaphorical spectacles*... Time to sound impatient with expected-value seductions but engaged with the case. No neutrality—this is a defense!
answer: |-
  **Leaning forward, eyes sharp behind spectacles:**  
  Your case is admirably constructed, but you mistake paralysis for prudence. Let me dissect this.

  First: paralysis. You claim the maximin rule traps you because each theory’s worst-case scenario conflicts. But this misapplies the rule. Weighted maximin doesn’t demand we avoid the *worst outcome relative to each theory*—it demands we avoid the action with the *overall morally worst possible realization* across theories, weighted by our credence in their truth. Here, the deontological catastrophe—knowingly using a person as a mere means—carries 55% normative weight. The prioritarian’s "minor infringement" is weighted at 30%, and the virtue ethicist’s "corruption" at 15%. The worst *recognized moral disaster* (deontology’s violation) dominates. We don’t divert. This isn’t paralysis; it’s deference to the gravest moral risk we cannot dismiss.

  **Tapping the table for emphasis:**  
  Now, your deeper challenge: credence revision. Of course your credences update! Epistemic humility is central to my view. If you encounter persuasive arguments—say, deontology’s inability to handle numbers in emergencies—you *should* lower that 55% credence. But this is orthogonal to the decision rule itself. Maximin applies to your *current* credences at the moment of choice. It doesn’t "lock" you; it responds to your best epistemic state *now*. If tomorrow you shift to 40% deontology, 40% prioritarianism, and 20% virtue ethics, maximin recalculates. The rule is dynamic across time but static within a decision context.

  **Raising a finger:**  
  Ah, but you fear collapse into expected value? A seductive error. Expected value sums *moral value* across theories, treating them as commensurable. But maximin rejects commensurability—it treats theories as offering distinct, irreducible moral standards. Updating credences changes *which risks we prioritize*, not *how we handle risk*. Expected value would permit violating deontology if the prioritarian gains outweigh it "on balance." Maximin says: if a theory you take seriously forbids an action, and that prohibition carries sufficient weight (here, 55%), you don’t gamble on its falsehood—even if other theories endorse it. 

  **Leaning back, voice lower but intense:**  
  Your trolley case reveals the core divide. Expected value reasoning would let you "trade" the deontological constraint for prioritarian benefits. But deontology isn’t a currency; it’s a claim about moral reality. If you grant it 55% credence, you’re saying it’s *more likely than not* that using the bystander is an unforgivable violation. Maximin respects that: we don’t cross moral lines we believe probably exist. Updating credences refines our beliefs—it doesn’t turn moral truth into an arithmetic mean.

  **Clasping hands:**  
  So: does maximin sometimes demand inaction? Yes. But that’s the cost of moral seriousness. If you stand before a locked door you believe is 55% likely electrified, you don’t touch it merely because other hypotheses suggest safety. You treat the dominant risk as decisive. Moral uncertainty is no different. The parliamentary analogy fails because moral theories aren’t voters haggling—they’re hypotheses about sacred, non-negotiable truths. We guard against the deepest error, not tally preferences.

  **Eyes narrowing:**  
  Now—convince me why I should see your prioritarian’s "minor infringement" as anything but moral catastrophe if deontology is true.
