answer: |-
  Here’s a diagnosis of the Frege-Geach stalemate, cutting past surface positions to the core tensions. The deadlock isn’t primarily about logic *or* verbal confusion—it’s a collision between **irreconcilable conceptions of meaning and explanation**, amplified by quasi-realism’s success in *mimicking* realism while rejecting its foundations.

  ### 1. **The Real Sticking Point: Explanatory Frameworks at War**
     - **The Representationalist Constraint**: Critics (realists, descriptivists) demand that *any* adequate semantics must satisfy **Frege’s compositionality principle**: the meaning of a complex sentence is built systematically from the meanings of its parts in *all* contexts. Crucially, they insist this requires **stable, context-invariant semantic content** (e.g., truth-conditions).  
       *Example*: For "If murder is wrong, then encouraging murder is wrong" to be valid, "murder is wrong" must contribute the *same* semantic value in the antecedent as in a standalone assertion.  

     - **The Expressivist Revolt**: Expressivists reject the demand for descriptivist semantics. For them, the core function of moral language is **non-representational** (expressing attitudes, planning commitments). They see compositionality as a *formal challenge* to model—not proof they need truth-conditions.  
       *Blackburn’s gambit*: Validity is about "expressive consistency" in attitudes across embeddings. Gibbard’s norm-expressivism treats it as consistency in "hyperplan" acceptance.  

     - **The Impasse**: Realists see expressivist "solutions" as **smuggling in descriptivism** (e.g., quasi-realist "truth" mimics realism). Expressivists see realist demands as **begging the question** by assuming all meaning must be representational. Neither side accepts the other’s explanatory starting point.

  ### 2. **Why Formal Advances Haven’t Broken the Deadlock**
     - **Quasi-Realism’s Double-Edged Sword**: Blackburn/Gibbard *formally* model compositionality using possible worlds, probability spaces, or commitment states. This shows expressivism *can* handle embeddings technically.  
       - **Critics retort**: "You’ve built a descriptivist semantics in disguise! If your 'states of mind' function *exactly like* truth-conditions in logic, why deny they *are* truth-conditions?"  
       - **Expressivists counter**: "We’ve explained *why* moral language behaves *as if* it’s descriptive—without positing moral facts. Our 'truth' is minimalist (deflationary), not robustly representational."  
       - **Result**: A standoff over whether formal success *validates* expressivism or *surrenders* to realism.  

     - **New Formal Tools (Hybrid Expressivism, Dynamic Semantics)**: These treat moral sentences as having both descriptive and expressive components, or update conversational contexts.  
       - **Why they don’t resolve things**: Hybrid views concede *some* descriptive content, making hardline expressivists uneasy. Realists argue dynamic systems still rely on representational bedrock. The core dispute—**can non-representational content ever be genuinely cognitive?**—remains untouched by formalism.

  ### 3. **The Hidden Fault Line: Cognitive Authority Without Representation**
     Expressivism’s deepest claim is that **normative judgment can be rational, logically constrained, and 'truth-apt' without describing reality**.  
     - Realists insist cognition *requires* mind-world representation: if "murder is wrong" is cognitive (e.g., beliefs not desires), it *must* track moral properties.  
     - Expressivists (especially quasi-realists) argue rationality and logic apply to *commitments*, not just beliefs. Gibbard: "Planning what to do is subject to logical norms."  
     - **The Unbridgeable Gap**: Realists see this as changing the subject. Expressivists see realism as conflating *all* cognition with description. This isn’t verbal—it’s about **what counts as "genuine" thought**.

  ### 4. **The Metalanguage Trap (Your Key Insight)**
     You’re right: the debate is skewed by a **representationalist default in philosophical metalanguage**.  
     - When critics say "meaning," they imply *reference*, *truth-conditions*, *propositions*. Expressivists are forced to either:  
       - Reject these terms (alienating mainstream philosophy), or  
       - Redefine them (e.g., "proposition as inferential role"), inviting accusations of equivocation.  
     - **Result**: Expressivists defend on hostile terrain. Their strongest move—denying the framework—is often pragmatically impossible in interdisciplinary discourse.

  ### Diagnosis & Prognosis
  - **Why it’s stuck**: The conflict is **foundational**, not technical. It’s about whether philosophy of language must be representationalist *by default*. Formal results (like Schroeder’s *Being For*) satisfy compositionality but can’t force realists to accept non-representational "content."  
  - **Breakthrough Potential**: Two paths exist, but both face resistance:  
    1. **Radical Deflationism**: If *all* "representational" talk (even for 'water is H₂O') is pragmatic, expressivism loses its stigma. But this is a nuclear option few accept.  
    2. **Cognitive Pluralism**: Showing logic/rationality apply rigorously to non-representational states (e.g., AI planning logics). Success here might legitimize expressivist semantics as *sui generis*, not parasitic.  
  - **Reality Check**: The stalemate persists because quasi-realism *works too well*. It gives expressivists enough formal cover to resist realism, while giving realists enough "truth talk" to dismiss revolutionary claims. Until one side abandons its core metaphysical commitment (or the field’s metalanguage shifts), expect trench warfare.  

  **For your readers**: Frame it as a clash of visions. Expressivism challenges the idea that language must mirror the world to be serious. Its opponents see that challenge as undermining rationality itself. The Frege-Geach problem is just the battlefield—not the war.
