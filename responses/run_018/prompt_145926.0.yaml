  The deeper issue is the incommensurability of explanatory frameworks. Expressivists' project is revolutionary, challenging the representationalist view, but they're forced to play by the rules (compositionality) set by their opponents. Without a shared standard, progress stalls. Also, quasi-realism's success blurs the lines, making it harder to distinguish from realism, which frustrates both sides. Realists see it as cheating; expressivists think they've solved it. That's why debates go in circles.

