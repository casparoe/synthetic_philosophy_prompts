prompt: |-
  Okay so I've got a decision problem that's turning into a personality flaw. I've been choosing between two jobs for the last three weeks and I've read every review site, forum thread, and how-to-decide essay I can find, and I keep generating more things to look up. A friend who does decision theory nudged me toward Good's theorem — the idea that, in a standard expected-utility setup, a free signal about the state of the world can't have negative expected value, so you should weakly prefer to look at it before choosing. Fine. But I've noticed I'm now using that as a blanket justification for basically all my information-hoovering, and I suspect some of the things people (including me) claim on it's behalf don't actually follow.

  Take the candidate implications below — some are mine, some I've seen floating around — and rank them by how much they should actually change how I make real-life decisions. The point is to end up with a personal checklist for how much information to seek before deciding, so rank by practical impact on behavior, not by how interesting the edge case is.

  - You should never avoid free information; actively not looking at the evidence is irrational.
  - More information is always weakly better, so defaulting to one more datapoint is usually the right move.
  - You can never ex post regret acquiring information.
  - The theorem shows that doing more science, or running more tests before acting, is in expectation always worth it.
  - Free information helps just as much in negotiations and other strategic settings, since those are just another decision problem.
  - Since free information is always weakly beneficial, the main practical question is finding more of it; when to stop searching is a secondary problem.

  I keep hearing these from smart people and I need to know which ones survive contact with the theorem's actual assumptions and which ones are overrated or don't follow at all. I want a defended ranking, not a survey.

  Use these sections, in this order:

  - Bottom line (2–3 sentences): the final ranking and the one-line reason.
  - What the theorem actually licenses (about 200 words): the precise claim and which assumptions are doing the real work.
  - The survivors (about 350 words): the two or three implications I should genuinely take seriously, what they'd license in practice, and why they rank where they do.
  - The overrated rest (about 350 words): the ones that fall apart once you look at the assumptions — Bayesian updating actually happening, the information being about a fixed decision with fixed options, strategic or adversarial settings, anticipation and attention costs, ex ante versus ex post.
  - What would change my mind (about 150 words): what I'd have to learn about my own situation or the theorem's edge cases to reorder the list.

  No citations or references needed; I'll fill those in later if I show this to anyone.
reasoning: |-
  Okay, the user is dealing with a decision paralysis problem where they're over-researching two job offers and using Good's theorem to justify it. They've listed several implications they've heard about free information and want me to rank them by practical impact on real decisions. 

  Hmm, this is actually quite sophisticated. The user clearly understands decision theory basics but is struggling with practical application. They're self-aware enough to recognize their "personality flaw" but trapped in analysis paralysis. The core tension is between theoretical rationality and behavioral reality. 

  First I need to recall Good's theorem precisely. It states that for a Bayesian decision-maker facing a fixed decision with fixed utilities, free information has non-negative expected value. The critical assumptions are: perfect Bayesian updating, no costs of processing/acting on information, and non-strategic settings. 

  Looking at their list:
  - "Never avoid free information" is technically true but ignores attention costs
  - "More is weakly better" is mathematically correct but behaviorally dangerous for someone like the user
  - "Never regret ex post" holds mathematically but not psychologically
  - The science/testing claim overgeneralizes - it's domain-dependent
  - Strategic settings completely break the theorem
  - The "secondary problem" point dangerously underestimates search costs

  The user's real need isn't more theory - it's actionable filters. They need permission to stop researching. The ranking should push them toward decisive action while respecting the theorem's validity. 

  For the "survivors" section, I'll emphasize that information value diminishes and search costs matter. For the "overrated" section, I'll highlight how attention costs and strategic contexts change everything. The "change my mind" part should focus on making search costs tangible.

  What's unspoken but important: The user might be using research as avoidance. The real value is in helping them recognize when enough is enough.
answer: |-
  ### Bottom line  
  Ranked by practical impact: (1) "More is weakly better" **but** with strict diminishing returns awareness; (2) "Never avoid free information" **if** costs are truly zero; (3) "Never regret *ex post*" as a mathematical truth. The rest are overgeneralized or false in practice. **Reason:** Good’s theorem assumes zero costs, perfect updating, and fixed decisions—violated by attention costs, strategic interactions, and dynamic contexts.  

  ### What the theorem actually licenses  
  Good’s theorem states that *for a Bayesian agent facing a fixed decision with fixed options and utilities*, free information (i.e., costless, non-distorting signals about states of the world) has non-negative **expected** value. It weakly increases expected utility *before* observation. Key assumptions:  
  - **Costless acquisition/processing**: No time, cognitive, or opportunity costs.  
  - **Bayesian updating**: You correctly update beliefs using the signal.  
  - **Fixed decision frame**: Options, utilities, and states don’t change due to the signal itself.  
  - **Non-strategic**: The information isn’t provided by an adversary or in a game.  

  Violate any assumption, and the theorem’s guarantee evaporates.  

  ### The survivors (ranked by practical utility)  
  1. **"More information is always weakly better... default to one more datapoint"**  
     **Why it survives (with caveats):** In low-stakes, low-cost scenarios (e.g., checking a weather app before a picnic), the theorem supports gathering *truly free* signals.  
     **Practical license:** Seek easily accessible, high-signal/low-noise data *if* it costs nothing (e.g., reading a verified review during a coffee break). **But** rank it #1 only because it forces you to *explicitly audit costs*: if "one more datapoint" costs 30 minutes or induces anxiety, it fails the "free" test.  

  2. **"You should never avoid free information"**  
     **Why it survives (barely):** It’s literally the theorem’s conclusion—*if* "free" means zero cost.  
     **Practical license:** Don’t *irrationally avoid* info due to fear of complexity (e.g., refusing to read a contract clause). **But** rank it #2 because "free" is rare: attention, delay, or emotional burden are usually costs. Use it to challenge avoidance, not justify endless search.  

  3. **"You can never *ex post* regret acquiring information"**  
     **Why it survives (technically):** Mathematically, after seeing the signal, your choice is optimal *given your updated beliefs*. Regret stems from outcomes, not the knowledge itself.  
     **Practical license:** After deciding, don’t blame the act of seeking info (e.g., "I wish I hadn’t known the salary"). **But** rank it #3 as it’s a logical truth with little behavioral weight—it doesn’t guide *whether* to seek info.  

  ### The overrated rest  
  - **"Never avoid free information" as a blanket rule**:  
    Fails on **attention costs**. Reading irrelevant reviews costs hours you could spend on pros/cons lists or relaxation. Good’s theorem ignores your brain’s limited RAM.  

  - **"Science/tests are always worth it"**:  
    Ignores **dynamic decisions**. Running "one more test" may delay action until options expire (e.g., job offers withdrawn). Also assumes tests are unbiased—real-world data often misleads if improperly interpreted.  

  - **"Helps in strategic settings"**:  
    **False in adversarial contexts**. In negotiations, revealing you sought information (e.g., salary ranges) can weaken your position. The theorem assumes passive states of the world, not adaptive opponents.  

  - **"When to stop is secondary"**:  
    **Dangerously wrong**. Search costs dominate real decisions. The optimal stopping point is *primary*: each hour researching jobs has opportunity cost (skill-building, networking). Good’s theorem says nothing about diminishing returns or cost-benefit thresholds.  

  ### What would change my mind  
  Re-rank #1 lower if you prove your "free" signals have **hidden costs**: track time spent per datapoint and emotional fatigue. If extra info rarely changes your decision, "weakly better" is negligible.  
  Re-rank "strategic settings" higher only if you face **purely non-adaptive decisions** (e.g., choosing a phone plan, not negotiating salary).  
  **Key evidence needed**:  
  - Measurement of your personal cost-per-datapoint (time/attention).  
  - Proof that your Bayesian updating is reliable (do past predictions match outcomes?).  
  - Confirmation that options won’t degrade with delay (e.g., employers won’t ghost you).
