answer: |-
  Here’s your prep sheet—raw, tactical, and tailored to the room. Keep it folded in your pocket Thursday.

  ---

  ### 1. **The thesis in my own sloppy words** (≈120 words)  
  *Look, Taurek’s onto something: choosing one over five *feels* monstrous, but picking five over five hundred feels like math. His "separateness" fix is wonky ontology—like we’re isolated marbles. My fix: **causal proximity decay**. Moral weight isn’t about counting souls; it’s about how *directly* my action hooks to harm. Pulling a lever killing one to save five? My hand’s on the switch—intense moral heat. Diverting funds from malaria nets to asteroid defense? The chain’s long, diffuse; the moral "oomph" fades, even if stats say I save more. It’s not that people don’t matter equally, but my *duty* dims when causality gets fuzzy. Saves the intuition without ghostly metaphysics.*

  ---

  ### 2. **Who’s in the room and what they care about**  
  1. **EA Trio** (QALY-maxers): Aggregation sacred. If you deny summing lives, you’re letting people die for bad reasons.  
  2. **Kantian Duo** (Formula of Humanity): Treating persons as means/replaceable = evil. Must preserve inviolability.  
  3. **Triage Ethicist** (Protocols): What works in ERs, wars, pandemics? Abstraction kills.  
  4. **Grad Students** (Taurek-heads): Nuance hunters. Know every counter-argument since ’77.  

  ---

  ### 3. **The objections, ordered by damage**  
  *(Phrased as they’d say it)*  
  1. **EA1**: "This licenses ignoring massive, certain harms just because they’re ‘distant’—like climate change. You’ve gutted aggregation when we need it most." [EA Trio]  
  2. **Kantian1**: "You’re still treating the distant person as *expendable* for the proximate one. That’s using them as a means." [Kant Scholar 1]  
  3. **Triage1**: "In my field, we *must* aggregate distant lives. Your decay rule would collapse triage protocols into chaos." [Triage Ethicist]  
  4. **Grad1**: "Where’s the decay threshold? Is saving 6 over 5 ‘direct’ but 7 isn’t? This feels arbitrary." [Grad Student]  
  5. **Kantian2**: "Proximity is morally irrelevant. A life is a life—distance doesn’t dilute dignity." [Kant Scholar 2]  
  6. **EA2**: "This is bias masquerading as theory. You’re privileging the salient over the significant." [EA Trio]  

  ---

  ### 4. **Two-minute reply for each**  
  1. **To EA1**: *"Aggregation *fails* psychologically and morally at scale. We don’t *feel* obligated to save 300 strangers as we do 1 child in a pond—not because stats lie, but because duty requires grip. Your system ignores why morality sticks."*  
  2. **To Kantian1**: *"No—I’m *failing* the distant person, not *using* them. Like failing to donate a kidney isn’t murder. The duty weakens with causal remoteness; it doesn’t negate their worth."*  
  3. **To Triage1**: *"Protocols aggregate *because* they’re systems, not single agents. My decay applies to *individual* moral actors. Systems buffer diffusion—that’s why they’re essential for scale."*  
  4. **To Grad1**: *"Thresholds *are* fuzzy—like ‘negligence’ in tort law. We accept gradients in law/morality (e.g., foreseeability). This reflects how we actually experience obligation."*  
  5. **To Kantian2**: *"Dignity doesn’t decay—but my *ability to enact care* does. Morality isn’t just about respect; it’s about action within causal reality. Ignoring that makes ethics inert."*  
  6. **To EA2**: *"Salience *is* data—about our agential position. Ignoring it is like physics ignoring friction. This isn’t bias; it’s realism about moral psychology."*  

  ---

  ### 5. **Where that reply is soft**  
  1. *EA1*: Doesn’t solve how to *handle* massive distant harms ethically.  
  2. *Kantian1*: "Failing" vs. "using" might be a distinction without a difference to them.  
  3. *Triage1*: Systems still need ethical foundations—individual decay might undermine them.  
  4. *Grad1*: Vagueness is a real weakness; I hand-wave it.  
  5. *Kantian2*: They’ll see "ability to enact" as irrelevant to moral demand.  
  6. *EA2*: Realism ≠ justification. I might be describing bias, not defending it.  

  ---

  ### 6. **What I should concede up front**  
  *"Look, causal decay isn’t a crisp formula. Proximity’s role *is* messy and context-dependent. And yes—it risks complacency on big systemic harms. But denying decay ignores why we recoil at Taurek’s original case."*  

  ---

  ### 7. **The question I hope nobody asks**  
  *"Doesn’t causal decay imply that *all* duties fade over sufficient distance—even to your own child? If not, why not?"*  
  **Why it kills**: It exposes the theory’s vulnerability to extreme counterexamples (child on a spaceship vs. child in your arms). Defending special obligations without metaphysics is a minefield.  

  ---

  ### 8. **Bottom line**  
  *I’m walking in with a psychological hack, not a moral theorem. Taurek’s intuition is right but his explanation is mystical. Causal proximity decay rescues that gut feeling—that saving nearby lives *demands* us differently than faraway ones—without souls or separateness. It’s messy, human, and tracks why we don’t live in QALY-hell. Don’t expect airtightness; expect an argument that makes the room feel their own moral reflexes.*  

  ---  
  **Good luck. When the Kantian glares, sip your water slowly.**
