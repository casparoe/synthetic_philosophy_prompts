prompt: |-
  I'm giving a seminar talk next week defending a split in Dennett's Gregorian creatures — artifact-Gregorians (crows, sticks) versus symbolic-Gregorians (language users) — on the grounds that the predictive-error architecture is different when the 'hypothesis' is a physical object rather than a sentential structure. Audience is mostly evolutionary psych people who think language is just fancy tool-use, plus a philosophy-of-biology colleague who thinks I'm smuggling human uniqueness back in through the side door. Draft my Q&A prep sheet: list the eight or so objections I'll actually get, in damage-order, phrased the way they'd say them, with a two-minute reply each and a flag on where the reply is weakest. Tell me what I should concede up front so I don't sound defensive, and identify the one quesiton I'm praying they skip — probably whether my split collapses back into Popperian once you allow counterfactual artifacts. Keep it focused; no bibliographies.
