prompt: |-
  I am organizing a monthly seminar for an interdisciplinary group of postdoctoral researchers—mostly in the life sciences and public health—who have strong statistical intuition but no formal background in social choice theory. For our next meeting I need to present the Condorcet jury theorem, but I want to avoid the standard classroom framing of jury verdicts or presidential elections. Instead, I want the explanation to turn on a single, concrete scenario in distributed scientific peer review: a panel of five reviewers, each with independent competence in assessing only one methodological pillar of a complex study, voting on publication without conferring. I am not asking you to explain the theorem to me; I need a teaching plan for how I should structure the fifty-minute session. Specifically, what component must be introduced first—the definition of voter competence as a probability parameter, or the independence assumption—and why does the other depend on it? What should be the carrying example or scenario that makes the aggregation result feel inevitable rather than magical, and what properties must it have (e.g., no hidden communication, no shared software bias) and what must it deliberately lack? Which misconceptions do you anticipate—such as the belief that correlated errors always reduce accuracy, or that majority rule dominates a single expert—and at exactly which point in the sequence should each be anticipated and defused? Include one precise check-for-understanding question I can pose at the end to verify they understand why the theorem collapses when individual competence falls below one-half. Finally, state explicitly what mathematical derivation or formal result I should openly leave out at this level—presumably the full binomial expansion—and explain how to frame that omission so it does not feel like a gap in credibility.
reasoning: |-
  Okay, the user is organizing a seminar for postdocs in life sciences and public health. They need to teach the Condorcet Jury Theorem using a peer review scenario instead of the usual jury or election examples. Let me unpack their requirements.

  First, the audience has strong stats intuition but no social choice background. So the challenge is to leverage their quantitative skills while avoiding political science jargon. The peer review framing is brilliant—it's immediately relevant to their daily work as researchers. 

  The core question is structural: which comes first, competence or independence? Competence must be foundational because you can't discuss independence of judgments without first establishing what "competence" means in this context. Competence is the probability parameter (p>0.5) that defines a reviewer's ability to assess correctly. Only after that can you introduce independence as the absence of correlation between reviewers' judgments. If you reversed it, independence would feel abstract and unmotivated.

  For the concrete scenario: five reviewers each assessing one methodological pillar (say, sampling design, measurement validity, statistical analysis, ethics compliance, reproducibility framework). The key properties are isolation (no communication) and domain specificity (each only sees their pillar). Must deliberately exclude shared biases like using the same flawed software - that would violate independence. 

  Anticipated misconceptions: First, that correlated errors always hurt accuracy. Actually, positive correlation reduces majority accuracy but negative could help. Should flag this when defining independence. Second, that a single expert is better than majority. Counter with the theorem's proof that group accuracy approaches 1 as n increases (when p>0.5). 

  For the check-understanding question: "If each reviewer is only 45% likely to be correct, why would adding more reviewers make the majority vote worse?" The answer lies in the theorem's collapse when p<0.5 - the group becomes more likely to be wrong. 

  Finally, omit the binomial expansion. Frame it as: "The theorem's power comes from recognizing this probability pattern, and while we're skipping the formula derivation, note that every stats intuition here - like how unlikely it is for most coins to land tails when biased toward heads - points to the same conclusion." 

  This approach makes the result feel inevitable by anchoring in their existing knowledge of probability, not magic.
answer: |-
  Here’s a structured 50-minute teaching plan tailored to your interdisciplinary group, leveraging distributed peer review as the core scenario while addressing your specific pedagogical concerns:

  ---

  ### **Session Structure & Sequence**  
  **Total Time**: 50 minutes  
  **Core Scenario**: *A complex interdisciplinary study undergoes peer review by 5 independent reviewers. Each assesses ONLY one methodological pillar (e.g., experimental design, statistical analysis, data integrity, ethical compliance, reproducibility). They vote "Accept" (correct) or "Reject" (incorrect) based solely on their pillar, with no communication. The editorial decision follows majority vote.*

  ---

  ### **Phase 1: Foundations (15 min)**  
  **Start with Voter Competence (p)**  
  - **Why first?** Competence is the intuitive anchor. Researchers grasp probabilistic skill (e.g., "This reviewer gets statistical validity right 75% of the time").  
  - **Define p**: Probability a reviewer *correctly* assesses their assigned pillar. Use your scenario:  
    > *"Reviewer 1 specializes in experimental design. If p=0.8, she correctly flags fatal flaws 80% of the time."*  
  - **Emphasize**: p>0.5 = "better than random." *Avoid* terms like "expert" (implies infallibility).  

  **Then Introduce Independence**  
  - **Why second?** Independence depends on understanding *individual* competence first. Show how correlation corrupts aggregation:  
    > *"If all reviewers use the same flawed software (shared bias), one error cascades. Their assessments aren’t independent even if individually competent."*  
  - **Key Properties to Stress**:  
    - ✅ **No communication**: No Zoom calls, shared notes.  
    - ✅ **No common biases**: Different tools/literature for each pillar.  
    - ❌ **Deliberately exclude**: Overlapping expertise (e.g., two statisticians).  

  ---

  ### **Phase 2: Aggregation & Theorem (20 min)**  
  **Make the Result Feel Inevitable (Not Magical)**  
  - **Carrying Example**: Use 3 reviewers (odd number, manageable math) with p=0.7 for all.  
    - Calculate P(majority correct) = P(≥2 correct) = 3(0.7)²(0.3) + (0.7)³ ≈ **78.4%**  
    - Contrast with single reviewer: 70% → *"Majority lifts accuracy even with identical competence."*  
  - **Why it works**: Frame as "error cancellation":  
    > *"When reviewers err independently, minority errors are outweighed by correct votes. Like signal averaging in noisy data."*  

  **Anticipate & Defuse Misconceptions**:  
  1. **"Correlated errors always reduce accuracy"**  
     - **When**: During independence discussion.  
     - **Defuse**: *"Positive correlation (e.g., shared bias) amplifies errors—yes. But negative correlation (rare) could help. The theorem assumes zero correlation to isolate competence’s role."*  

  2. **"Single expert > majority"**  
     - **When**: After showing the 3-reviewer calculation.  
     - **Defuse**: *"For one decision, a superstar (p=0.9) beats 5 mediocre reviewers (p=0.6). But if all have p>0.5, adding reviewers monotonically improves accuracy—and beats any single member for n≥3."*  

  ---

  ### **Phase 3: Boundaries & Caveats (10 min)**  
  **The p<0.5 Collapse**  
  - **Check-for-Understanding Question**:  
    > *"Suppose each reviewer’s competence drops to p=0.45. Why does adding more reviewers make the majority vote* less *accurate?"*  
    - **Expected Answer**: *"Errors become more likely than correct votes. Majority amplifies the prevailing error (like consensus on a false belief)."*  

  **Deliberate Omissions**  
  - **Leave Out**: Full binomial expansion/Law of Large Numbers proof.  
  - **Framing for Credibility**:  
    > *"The theorem’s engine is the binomial distribution—something you’ve all used. We’re skipping the CDF calculations today, but intuitively: when p>0.5, more trials (reviewers) push the majority toward the ‘probability peak’ of correctness. It’s the same principle that makes poll averages stabilize near true support."*  

  ---

  ### **Closing (5 min)**  
  - **Reconnect to Science**: *"This isn’t just about voting—it’s why we demand independent replication or use multi-reviewer grants panels. But remember: garbage in (p<0.5 or correlated biases) = garbage out."*  
  - **Further Reading**: Suggest a 1-page primer on independence violations (e.g., herding in journal clubs).  

  ---

  ### **Why This Sequence Works**  
  1. **Competence first** grounds abstraction in individual skill (familiar).  
  2. **Independence second** reveals why distributed design matters (no shared tools/bias).  
  3. **Small-n example** (n=3) makes aggregation tangible without advanced math.  
  4. **Omitted math** is justified by invoking their existing stats intuition (binomial → polling).  

  This approach transforms the theorem from a "democratic curiosity" to a framework for robust scientific assessment—aligning with their daily work while preempting statistical misunderstandings.
