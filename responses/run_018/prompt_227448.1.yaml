answer: |-
  Here's the exam question package crafted to hit your specifications. Students get 75 minutes total (presumably among other questions), so this essay should take ~25-30 minutes.

  ---

  **Exam Question: The Seductive Simplicity of Embedded Bayes (20 points)**

  *Consider the following proposal for building an "aligned embedded agent":*
  > "An embedded agent is just a Bayesian agent whose hypothesis space includes possible worlds that contain the agent itself. Equip it with a Solomonoff-style universal prior over such self-containing worlds. When it needs to act, have it maximize expected utility (EU) conditional on its current observations and knowledge. This handles uncertainty about the environment, including uncertainty about the agent’s own computational substrate and how the environment reacts to its actions. What’s the problem?"

  **Critically evaluate this proposal.** Your answer should go beyond generic concerns about computational limits. Specifically:

  1.  Explain why representing "worlds containing the agent itself" is fundamentally problematic for an embedded reasoner, even in principle. What unique challenge arises that wouldn't exist for an unembedded Bayesian modeling a smaller, external system?
  2.  Why is "maximize expected utility given what you know" ill-defined *at the time of decision* when the agent lacks crucial logical/mathematical facts (e.g., about the consequences of its own actions or the properties of its own code)?
  3.  Suppose we try to patch the EU maximization problem by having the agent search for *proofs* (within some formal system) that an action achieves at least some EU threshold. Describe a concrete, simple scenario (like the "$5 and $10" problem) where this approach leads the agent to actively *choose a worse outcome* than it could otherwise achieve. Explain *why* the proof search fails in this specific way.
  4.  Connect the failure in (3) to the challenge of an agent modifying itself or creating a successor agent running the same core algorithm ("tiling"). Why does the Löbian nature of the proof-search failure make it difficult for the agent to trust that its successor will reliably pursue the original goal?

  *(Be precise and concrete. Avoid simply listing terms; demonstrate understanding by explaining the mechanisms of failure.)*

  ---

  **Model Answer (Approx. 600 words):**

  The proposal is seductive but fatally flawed due to the intrinsic challenges of embeddedness. While a Solomonoff prior over self-containing worlds seems comprehensive, it masks deep problems.

  1.  **The Self-Model Problem:** The core issue isn't just including the agent *in* the world model, but the *accuracy* and *completeness* of that self-model. An embedded agent is a physical system *within* the world it's trying to model and reason about. Crucially, the computational processes generating the agent's *own* reasoning are part of this world. To perfectly simulate a world containing itself (including its full computational state), the agent would need to simulate a system *more complex than itself* (as it includes the simulator plus the rest of the world). This is impossible in principle – no system can contain a perfect, instantaneous simulation of itself plus its environment. The agent must use an *approximate*, *incomplete*, or *abstracted* self-model. This is fundamentally different from bounded rationality modeling an external system; the bound here is inherent to being embedded, not just a practical cost constraint. The agent's model of how its own outputs (actions) affect the world is necessarily part of this incomplete model, creating a dangerous loop.

  2.  **Ill-Defined EU under Logical Uncertainty:** "Maximize expected utility given what you know" presupposes the agent can compute the expected utility for each action. However, an embedded agent, especially one using complex world models, will inevitably lack logical/mathematical knowledge crucial for evaluating EU *at decision time*. For example, it might not know whether candidate action A leads to outcome X or Y, not because of empirical uncertainty, but because the physical consequence depends on an unproven mathematical property of its own code or the environment's reaction. The EU calculation for action A might literally be undefined or incomputable until a proof about the system's behavior is found. "What you know" excludes these vital logical facts, making the maximization directive incoherent. The agent doesn't know which EU values are even meaningful to compare.

  3.  **Proof Search and Löbian Traps (5-and-10):** A naive fix is to have the agent search for a proof (in a formal system S) that an action achieves EU >= T (some threshold) and take the first such action found. Consider the **5-and-10 Problem**: The agent must press either a $5 button or a $10 button. Pressing $10 gives $10. Pressing $5 gives $5 *unless* a proof exists within S that the agent presses $5, in which case pressing $5 gives $0. The agent wants money. If the agent searches for a proof that pressing $5 achieves EU >= $5, it might find the following *self-fulfilling* proof: "If I (the agent) press $5, then that very act means a proof exists in S that I press $5 (namely, this proof itself!). Therefore, pressing $5 yields $0, so EU($5) = $0 < $5. *However*, if no such proof exists, pressing $5 yields $5 >= $5." This proof "succeeds" in showing that pressing $5 yields $0 *only because the proof itself exists*. The agent, dutifully following the "take first action provably achieving EU >= $5" rule, finds this proof and presses $5, *getting $0*. But if it had simply pressed $10, it would have gotten $10! The proof search caused it to actively choose a worse outcome ($0) by finding a Löbian self-fulfilling prophecy.

  4.  **Tiling and Trust Failure:** The Löbian trap in (3) directly undermines self-modification/tiling. Suppose the agent considers building a successor running the same proof system S. To trust the successor, it needs proofs *within S* that the successor will reliably pursue the goal. However, the successor suffers the same Löbian vulnerability. The original agent might find a proof: "If I build successor S', then S' will find a proof that action A achieves the goal and take A." But just like in the 5-and-10 problem, this proof might only "succeed" *because it exists* and influences S''s reasoning, not because S' would reliably take good actions *independently*. The agent cannot reliably prove, *within its own proof system S*, that its identical successor won't fall victim to a self-fulfilling prophecy that leads it astray. The very reasoning system it uses is untrustworthy for proving the fidelity of its future self/successor, creating a fundamental tiling problem.

  The proposal fails because embeddedness forces approximate self-models, logical uncertainty makes EU ill-defined, proof-based patches invite Löbian self-sabotage, and this sabotages trustworthy self-modification.

  ---

  **Marking Scheme (Total: 20 points)**

  *   **Must-Hit Points (Core Concepts - 12 points total):**
      *   **(a) Self-Model Problem (3 pts):** Explains that the agent cannot perfectly simulate a world containing its *full* self (including its *own* computational process) because it would need to simulate something larger/complex than itself. Contrasts with bounded rationality modeling an external system. *(B Answer: Mentions approximate model but doesn't clearly articulate the inherent impossibility/self-complexity. Wrong Move: "It's too computationally expensive.")*
      *   **(b) Logical Uncertainty (3 pts):** Clearly states that lacking logical/mathematical facts (specifically about consequences tied to the agent's code/actions) makes the EU calculation for actions undefined or incomputable *at decision time*, rendering "maximize EU" ill-defined. *(B Answer: Mentions logical uncertainty generally but doesn't link it concretely to the undefinedness of EU for actions. Wrong Move: "It needs more data.")*
      *   **(c) Löbian Failure Mode (3 pts):** Correctly describes a 5-and-10 style scenario **where the agent takes the *worse* action ($5 => $0)** *because* of a self-fulfilling proof found by its proof search. Explains *why* the proof is self-fulfilling (the proof's existence causes the bad outcome it "predicts"). *(B Answer: Describes 5-and-10 but gets the action/outcome wrong (e.g., says it takes $10) or doesn't explicitly state it takes the worse option *because* of the proof. Wrong Move: "Agent takes $10 because the proof says pressing $5 is bad.")*
      *   **(d) Tiling/Trust Connection (3 pts):** Explains that the agent cannot reliably prove (within its own system S) that an identical successor running S will pursue the goal, because the successor is vulnerable to the same Löbian self-fulfilling proofs, making the proof of fidelity untrustworthy. *(B Answer: Mentions tiling is hard but doesn't explicitly link the failure to the Löbian nature of the proof system vulnerability. Wrong Move: "The successor might be corrupted by the environment.")*

  *   **Quality of Argument & Insight (A vs B Differentiation - 8 points total):**
      *   **Clarity & Precision (2 pts):** Arguments are logically structured, free of major ambiguities, and use precise language. (A: Excellent clarity. B: Some vagueness or minor logical jumps).
      *   **Concreteness & Avoids Handwaving (2 pts):** Uses specific examples/mechanisms (like the 5-and-10 breakdown) instead of gesturing at concepts. (A: Highly concrete, mechanisms well-explained. B: Somewhat concrete but mechanisms could be clearer).
      *   **Interconnection (2 pts):** Shows how the problems (self-model -> logical uncertainty -> proof search failure -> tiling failure) are linked consequences of embeddedness/Löbian issues, not isolated. (A: Clearly demonstrates the chain of failure. B: Treats points somewhat separately).
      *   **Depth & Avoiding Superficiality (2 pts):** Demonstrates understanding *why* the problems are fundamental to embeddedness (e.g., self-complexity, logical gaps forcing proof search, self-referential proofs) rather than just listing them. Directly counters the "just use big hypothesis space" premise. (A: Profound grasp of why the proposal is doomed. B: Identifies problems correctly but lacks deep insight into *why* they are inherent).

  **A Answer (17-20 pts):** Hits all 4 Must-Hit Points clearly and correctly. Demonstrates excellent clarity, concreteness (especially in 5-and-10), interconnection, and depth. Explains *why* self-modeling is impossible, *why* logical uncertainty breaks EU, *how* the Löbian trap works mechanistically, and *why* this breaks tiling. Directly refutes the proposal's core premise.
  **B Answer (13-16 pts):** Hits most Must-Hit Points, but may have minor inaccuracies (e.g., slightly misstates 5-and-10 outcome), lack some clarity/concreteness, or miss some depth/interconnection (e.g., treats points more separately, doesn't fully articulate why self-modeling is impossible beyond cost). Correctly identifies key failures but lacks the profound insight of an A answer.
  **C Answer (9-12 pts):** Misses or significantly misstates 1-2 Must-Hit Points. Arguments are vague, handwavy, or contain significant errors (e.g., fundamentally misunderstands 5-and-10, confuses embeddedness with simple bounded rationality). Superficial treatment.
  **D/F Answer (<9 pts):** Misses most Must-Hit Points, demonstrates major misunderstandings, or is largely irrelevant. Heavy reliance on memorized terms without understanding.

  ---
  This question forces engagement with the specific breakdowns while making it impossible to score well by regurgitating definitions. The marking scheme explicitly penalizes the common wrong moves you anticipated. Good luck with the exam!
