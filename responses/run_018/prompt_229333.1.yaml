  For the philosophical note afterward, I need to acknowledge that utilitarians might disagree with Wolf's view. I'll clarify that Wolf's position is contested and point out where I exaggerated her arguments for satirical effect - like taking the crowding-out idea to an extreme where no personal interests survive.

