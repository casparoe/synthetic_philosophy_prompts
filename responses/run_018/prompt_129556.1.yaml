prompt: |-
  I'm a junior in a phil of language semniar and next week I'm running the study group on rigid designators and the necessary a posteriori. Don't lecture me; lay out the teaching arc. What idea has to be in place before 'necessary a posteriori' sounds like a contradiction and not just weird wording? I want one carrying example — not Hesperus/Phosphorus, everyone's tired of it — maybe Neptune being the planet that perturbs Uranus, but tell me if that actually works and what's wrong with using the morning-star case instead. The group are mostly logic kids who think necessary means tautology and a posteriori means guessing, so map out the misconceptions they'll form at each step and exactly where in the sequence I should head each one off. Give me one check question for the end that'd show they get why it's not just an empirical discovery with fancy vocabulary. Also tell me which part of Kripke's modal argument I should openly skip at this level and say I'm skipping.
reasoning: |-
  Okay, the user is a junior in a philosophy of language seminar running a study group on rigid designators and necessary a posteriori. They need a teaching arc that addresses common misconceptions. 

  First, I need to unpack why "necessary a posteriori" sounds contradictory to students. Logic kids often equate "necessary" with tautologies (like 2+2=4) and "a posteriori" with guessing or empirical data. So the core misconception is that necessity must be knowable purely through reason, while a posteriori knowledge is contingent. 

  For the carrying example, Hesperus/Phosphorus is overused. The Neptune case could work better: Leverrier fixed the reference of "Neptune" as "the planet causing Uranus's perturbations" before discovery. This shows how a rigid designator picks out the same object across worlds, leading to necessary truths discovered empirically. But I should note the caveat: if Neptune didn't cause the perturbations, the description was still fixing reference to whatever did. 

  The teaching arc should start by destabilizing their definitions. First challenge "necessary = tautology" with Kripke's "H2O is water" – necessary but not analytic. Then tackle "a posteriori = contingent" with identity statements. The Neptune example comes in after establishing rigid designation. 

  Key misconceptions to preempt: 
  - At Step 2, someone will say "But we could've found no planet!" → emphasize fixing reference vs. giving meaning. 
  - At Step 4, they'll confuse metaphysical necessity with epistemic possibility ("but it could've not been water!") → stress that counterfactuals track the object, not the description. 

  The check question: "If we discover Superman's birth name is Clark Kent, is 'Superman is Clark Kent' necessary?" Tests if they grasp rigid designation overriding epistemic doubts. 

  As for Kripke's modal argument, skip the counterpart theory debate – too advanced for this level. Just note that we're setting aside how objects exist across worlds. 

  The user's clearly thought about pedagogy – they want precise misconception mapping, not just content. Smart to avoid lecturing. Their frustration with Hesperus/Phosphorus suggests they've seen bad explanations before. I’ll keep it tight.
answer: |-
  Here's a battle-tested teaching arc focusing on misconception demolition and using Neptune as the core example, with explicit "trap" warnings and a skip plan:

  **Core Pre-Requisite Idea:** Students must grasp that **necessity is metaphysical, not epistemic**, and that **rigid designation separates meaning from reference-fixing.** Until this clicks, "necessary a posteriori" sounds like "proven guesswork," not a deep metaphysical insight.

  **The Arc & Misconception Warfare:**

  1.  **Demolish "Necessary = Tautological/Analytic":**
      *   **Activity:** Ask: "Is 'Water is H₂O' necessary? Is it a tautology like 'All bachelors are unmarried'?"
      *   **Trap:** They'll likely say "No, it's empirical!" or "It's contingent!" *Don't engage necessity yet.*
      *   **Key Move:** Focus on epistemology vs. metaphysics. "Yes, we *discovered* it empirically. But once we know what 'water' *is* (its essential chemical structure), could water *be* something other than H₂O? Can we imagine a world where *this substance* (pointing to water) isn't H₂O? What would that world contain?"
      *   **Goal:** Establish that necessity concerns *what the thing is in all possible worlds*, not how we know it. "Water is H₂O" isn't a *linguistic* truth but a *metaphysical* one about the substance's essence.

  2.  **Introduce Rigid Designators (RD) & Shatter "Meaning = Description":**
      *   **Definition:** A rigid designator denotes the same object in *every possible world* where that object exists. Names (like 'Neptune', 'Hesperus') are typically RDs. Definite descriptions used *to fix reference* (like 'the morning star') are often *not* rigid.
      *   **Neptune Setup (Carrying Example):**
          *   *Historical Context:* Leverrier (1846) postulated "Neptune" as the name for *the planet causing the observed perturbations in Uranus's orbit*. Later, it was observed.
          *   **Crucial Question:** When Leverrier said "Neptune" (before observation), what was he referring to? The *planet causing the perturbations*, or the *specific planet* out there causing them?
      *   **Trap:** Students will say "The planet causing the perturbations." **MISCONCEPTION ALERT #1:** Conflating reference-fixing description with meaning/reference.
      *   **Key Move:** Rigidity! Leverrier used the description *to fix the referent* of the name 'Neptune'. Once fixed, 'Neptune' rigidly designates *that specific planet* (P), even in worlds where:
          *   P *doesn't* cause Uranus's perturbations (maybe Uranus's orbit is different, or another cause exists).
          *   Some *other* planet causes the perturbations.
      *   **Why Neptune > Hesperus?** Neptune highlights the *act of naming via description before empirical confirmation*. Hesperus/Phosphorus often feels like two names *both* in use before identity was known. Neptune emphasizes the *baptism using a description* leading to a later empirical discovery *about the rigidly designated object*.

  3.  **Build the Necessary A Posteriori:**
      *   **Identity Statement:** "Neptune is the planet causing Uranus's perturbations (at t₁)."
      *   **Epistemology:** This was discovered *a posteriori* (through math & observation). We could have discovered no planet, or a different cause.
      *   **Metaphysics & Rigidity:**
          *   'Neptune' rigidly designates planet P.
          *   'The planet causing Uranus's perturbations (at t₁)' **non-rigidly** designates whatever planet *actually* caused them. In another world, it could be a different planet, or nothing.
          *   **In the actual world:** Neptune = the planet causing the perturbations. This is contingent truth discovered empirically.
      *   **The Necessary Truth:** "Neptune is Neptune." Because 'Neptune' is rigid, this is trivially necessary.
      *   **The Bridge:** Substitute using the contingent identity: "Neptune is the planet causing Uranus's perturbations (at t₁)." **Is this necessary?**
      *   **Trap:** Students will shout "NO! Contingent!" **MISCONCEPTION ALERT #2:** Failing to apply rigidity to the *whole* statement across worlds. They're still thinking epistemically ("We could have been wrong!").
      *   **Key Move:** Take it to another world. Consider a world W where a *different* planet (Q) causes Uranus's perturbations. What does 'Neptune' refer to in W? *Still planet P* (the one from our actual world). What does 'the planet causing Uranus's perturbations in W' refer to? *Planet Q*. So in W, "Neptune is the planet causing Uranus's perturbations (at t₁)" is **FALSE**. But the statement "Neptune is Neptune" is **TRUE** in W. Therefore, the identity statement "Neptune = the planet causing U's pert (at t₁)" is **NOT NECESSARY**. *(This step is vital! It shows the identity itself is contingent).*
      *   **The Necessary A Posteriori:** "Neptune is Neptune" is necessary and a priori trivial. But consider: **"Neptune (if it exists) is the planet that *in the actual world* caused Uranus's perturbations at t₁."**
          *   *A Posteriori:* We discovered *empirically* that Neptune (P) was the actual cause.
          *   *Necessary:* In any world where Neptune (P) exists, it is true that *in the actual world*, P caused the perturbations. The phrase "in the actual world" rigidifies the description. The fact about *what happened in our specific world* is a necessary property *of our world*. Neptune couldn't *be Neptune* and yet *not* be the thing that *actually* caused those perturbations. This is a necessary truth knowable only a posteriori.

  4.  **Address Lingering Epistemic Confusion:**
      *   **Trap:** "But couldn't we discover Neptune *didn't* cause the perturbations?" **MISCONCEPTION ALERT #3:** Confusing metaphysical possibility with epistemic possibility.
      *   **Key Move:** Emphasize the distinction! *Before* discovery, it was *epistemically possible* (consistent with our knowledge) that Neptune didn't cause them, or even didn't exist. *After* discovery, we know the *metaphysical fact* about the actual world: Neptune *is* (necessarily) the actual cause. Our *knowledge* was contingent/a posteriori; the *fact itself* (once actual) is a necessary feature of actuality.

  **The Check Question (Exposes Superficial Understanding):**
  > *"Imagine we discover (through DNA testing, Kryptonian records, etc.) that Superman's birth name, given to him on Krypton, was 'Clark Kent'. Is the identity statement 'Superman is Clark Kent' (understood as expressing the identity of the person) a necessary truth? Why/why not? Does its necessity depend on how we learned it?"*

  *   **Why it works:** It forces them past Neptune/Hesperus scripts. If they grasp rigidity, they'll see both names rigidly designate the same person (Kal-El), making the identity necessary. If they slip back into descriptivism ("Superman is the superhero, Clark Kent is the reporter!"), they'll call it contingent. It directly challenges the "fancy vocabulary" charge by showing the necessity arises from *what the names refer to*, not the empirical discovery *per se*. The *way* we discover it (a posteriori) is irrelevant to its modal status.

  **What to Skip in Kripke's Modal Argument:**
  Openly skip the **Counterpart Theory discussion** and the detailed defense against objections like "Identity might be contingent if objects have world-bound counterparts." Say:

  > "Kripke spends significant time refuting an alternative view called 'Counterpart Theory' which tries to salvage descriptivism by making identity world-relative. This is fascinating but requires a deep dive into modal logic semantics that would derail us today. For our purposes, we're accepting Kripke's core arguments that names are rigid and that standard possible worlds semantics shows identity statements involving rigid designators are necessary if true. We're focusing on the *consequences* of rigidity for necessity and aposteriority."

  **Why this skip is okay:** Counterpart theory is a major detour. The core argument (Rigidity + Possible Worlds Semantics → Necessary Identity) stands independently for an introductory session. Skipping it keeps the focus on the core puzzle about language and modality you're tackling.

  **Key Takeaways for Your Group:**
  1.  Necessity ≠ Tautology/Analyticity (Metaphysical vs. Logical).
  2.  Rigidity separates the *object picked out* from *how we picked it out*.
  3.  "Necessary A Posteriori" arises when a necessary truth (often via rigidity) depends on contingent, empirical facts about the *actual world*.
  4.  Epistemic possibility ("We could have been wrong!") ≠ Metaphysical possibility ("That object couldn't have been different in *that* way").

  Good luck running the study group! This arc forces the logic kids to confront the difference between how language hooks onto the world and how logic operates on propositions.
