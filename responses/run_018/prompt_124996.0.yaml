  4. Pragmatic vs. epistemic (Issue 4) — I think this collapses. In institutions, all bets are pragmatic due to resource commitments. So, it might not be a real issue; focusing on pragmatic coherence is sufficient. Explaining why the distinction doesn't hold here would save effort.

  Why this order? Issue 1 is synchronic and basic. Issue 2 adds time and complexity. Issue 3 deals with agent limitations, but only after defining coherence. Issue 4 might be a non-issue. The dependencies: Without handling imprecision, you can't even start on diachronic or bounded aspects. Resolving Issue 1 enables work on others.

  Tractability: Issues 1 and 2 are formal—philosophers can work on axiomatic systems or generalized probability. Issue 3 might involve computational complexity, but we can approach it with minimal rationality standards.

  What would lower ranks? If new work integrates imprecise credences smoothly, Issue 1 becomes less critical. If model-based updating is shown to reduce to standard conditionalization, Issue 2 drops. But given structural uncertainty, that's unlikely.

