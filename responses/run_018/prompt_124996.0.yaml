  Prioritization:
  1. Imprecise credences (Issue 1) — foundational for defining coherence in these settings. Without it, other adaptations don't make sense. Affects how we model agents. A resolution like Williams' supervaluationist approach would be key. If new work shows it's not possible without precision, this issue remains critical.

  2. Diachronic coherence with model outputs (Issue 2) — belief revision based on model ensembles is different from simple evidence. If models are inputs, how does that affect conditionalization? This conditions how institutions update beliefs over time. If resolved, it impacts practical Dutch books. A dynamic consistency result could lower its rank.

