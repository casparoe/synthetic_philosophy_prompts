  The core tension here seems to be between physical properties and perception. In physics, temperature exists independently of observers, but Hume's dealing with aesthetic qualities that require human perception. The key insight is that for Hume, beauty isn't like temperature - it's more like color. It requires both external properties and a perceiving mind, but the properties are real.

