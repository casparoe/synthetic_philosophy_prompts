answer: |-
  ### 1. The Conceptual Example
  Consider a theoretical physics programme asserting that fundamental particles possess a novel property called "chronal charge" (C-charge), governing asymmetric time-directional interactions. The core axiom states: *All particle interactions exhibit C-charge conservation*. The programme predicts experimental signatures in high-energy collider decays, modelled via intricate quantum-field equations. Crucially, detection relies on a custom-built "temporal spectrometer" (TS), whose operation is defined by auxiliary models:  
  - **Auxiliary Model A1:** TS calibration requires bombardement with "reference particles" of known C-charge states.  
  - **Auxiliary Model A2:** Background noise in TS data stems from "C-charge vacuum fluctuations," quantifiable using the core theory.  

  Anomalous data (e.g., apparent non-conservation events) are never attributed to core axiom failure. Instead, practitioners invoke:  
  - Recalibration of TS via A1 (arguing reference particles were misidentified due to unforeseen fluctuation interference).  
  - Revision of A2's fluctuation model using core-theoretic mathematics to "explain" noise corruption.  

  **Structural Blockage:** Basic statements ("TS detected non-conservation at time *t*") presuppose TS reliability. TS reliability, however, is established solely through A1 and A2, which derive validity from the core theory they protect. Accepting any observation as falsifying requires prior acceptance of auxiliary models *already embedded* in the programme’s theoretical web. Thus, while falsifiable *in principle* (e.g., a macroscopic violation observable without TS), *in practice* no TS-derived observation can challenge the core without begging the question. The circularity is architectural: the theory defines both what counts as valid evidence and how instruments fail.

  ### 2. The Demarcation Diagnosis
  This constitutes a specific failure of falsificationism’s resolution to the demarcation problem. Popper requires that basic statements be *intersubjectively testable* and *theory-neutral* enough to permit decisive falsification. Here, however:  
  - **Theory-Ladenness of Basics:** What qualifies as a "valid" basic statement about observations hinges entirely on auxiliary models parasitic on the core theory. The spectrometer’s outputs are only interpretable via the programme’s own constructs.  
  - **Immunisation via Embeddedness:** Auxiliary revisions are not *ad hoc* in isolation; they draw "independent motivation" from other programme components (e.g., mathematical consistency with C-charge formalism). This satisfies Popper’s demand for *independent testability* of auxiliaries *on paper*, yet that "independence" is illusory—all tests occur *within* the programme’s self-referential network.  
  Falsificationism fails because it cannot compel adherents to accept *any* observation as a genuinely theory-neutral falsifier. The demarcation ambiguity shifts from "Is this science?" to "Is *this observation* a valid basic statement?", and the latter question is resolved by the very theory under scrutiny. The programme remains pseudoscientific in practice despite formal falsifiability.

  ### 3. The Strongest Defence
  A committed falsificationist might counter that this "failure" misrepresents Popper’s sophisticated requirements. Their defence would emphasise:  
  - **Progressive Auxiliary Adjustment:** True scientific programmes, per Popper and Lakatos, *progress* by making novel predictions beyond their protective belt. Auxiliary revisions (e.g., to A2’s fluctuation model) must yield *new, testable consequences* unrelated to the initial anomaly—e.g., predicting unforeseen detector behaviours in *different* experimental setups. If repeated revisions merely "save" the core without expanding empirical content, the programme is degenerative and *de facto* pseudoscientific.  
  - **External Consistency:** Auxiliaries must align with well-corroborated theories *outside* the programme. If A1’s calibration model contradicts established particle physics (e.g., violating conservation laws accepted elsewhere), it becomes suspect irrespective of internal consistency. Genuine science requires auxiliary models to be constrained by broader empirical knowledge.  
  Thus, demarcation holds if we demand that auxiliary revisions *enhance*—not merely protect—the programme’s predictive power across domains, ensuring the "basic statements" remain grounded in intersubjective techniques *external* to the theory’s unique claims.

  ### 4. What Would Change My Mind
  I would reconsider if shown that **auxiliary models in such programmes *can* be independently tested using methods wholly extrinsic to the theoretical network’s core assumptions and unique entities.** For instance:  
  - If TS calibration (A1) could be achieved via purely classical engineering principles (e.g., mechanical alignment verified by microscopy unrelated to C-charge), making instrument reliability contingent only on theories *outside* the programme.  
  - If background noise (A2) were measurable using detectors predating C-charge theory and explicable via mundane causes (e.g., thermal fluctuations), without invoking programme-specific entities.  

  **Weakest Point:** My argument assumes auxiliary models *must* draw exclusively on the core theory’s conceptual resources. If practitioners could establish instrument reliability through entirely theory-neutral, pre-existing observational protocols (e.g., "detector clicks when exposed to known radioactive source X, regardless of C-charge"), the circularity breaks. Demonstrating such epistemological independence in practice would undermine my claim of architectural inevitability.
