  Below is a step-by-step procedure for your ethics committee, distilled from Good's Theorem (Value of Information) into a 20-minute, calculus-free decision tree. It addresses prior specification, loss functions, cost-benefit analysis, epistemic rent-seeking, and stakeholder conflicts. Key outputs are **"No—approve now," "Yes—delay is rational,"** or **"Values call—not math."** I'll then apply it to your three cases and clarify limitations.

  ---

  ### **The 20-Minute VOI (Value of Information) Protocol**
  **Goal**: Decide if delaying an intervention to gather data is ethically/mathematically justified.  
  **Time**: 20 mins max. Use flipcharts or a template for answers.  
  **Participants**: Clinicians, budget officers, ethicists. Assign roles: *Moderator*, *Prior/Loss Estimator*, *Cost Tracker*.

  #### **Step 1: Define the Decision & Alternatives (2 mins)**  
  **Question**: *"What happens if we act now vs. delay? What data would we collect, and how long would waiting take?"*  
  - **Sufficient answer**:  
    - Action A: Implement intervention immediately (e.g., "Start triage protocol").  
    - Action B: Delay for [X weeks] to collect [Y] data points (e.g., "Delay 4 weeks for 200-patient study").  
    - Outcome if no data: Irreversible harm? Urgency? (e.g., "Patients die without intervention").  
  - **Stop if**:  
    - Delay makes the intervention obsolete (e.g., "Flu season ends in 4 weeks"). → **No—approve now**.  
    - Data won’t change the decision (e.g., "Even if data shows harm, we must act due to ethics"). → **No—approve now**.

  #### **Step 2: State the Prior—No Math, Just Plausibility (3 mins)**  
  **Question**: *"What’s our best guess of success/failure odds *today*? Use words: ‘likely,’ ‘rare,’ or a % if forced."*  
  - **Sufficient answer**:  
    - Qualitative: "Benefit is **probable** (70%)" or "Harm is **unlikely but catastrophic** (5% chance)."  
    - Source: "Based on [existing study] + [expert consensus]."  
  - **Stop if**:  
    - Prior is extreme (e.g., <10% harm or >90% benefit) AND delay costs are high. → **No—approve now**.  
    - Disagreement on prior (e.g., clinicians say 80% benefit, budget says 40%). → **Values call—not math** (flag for vote).  

  #### **Step 3: Sketch Loss Function—No Fake Dollars (4 mins)**  
  **Question**: *"What’s worse: acting when wrong (false positive) vs. not acting when right (false negative)? Use a ratio."*  
  - **Sufficient answer**:  
    - Clinicians: Focus on patient harm. *"1 death from acting wrongly = 10x worse than 1 death from inaction."*  
    - Budget: Focus on resource waste. *"Wasting $1M on ineffective treatment = 5x worse than missing $1M in savings."*  
    - **Loss ratio**: Type I Error Loss (false positive) : Type II Error Loss (false negative).  
      - E.g., Clinicians: **1:10**, Budget: **5:1**.  
  - **Stop if**:  
    - Losses are incommensurable (e.g., "How to compare death to dollars?"). → **Values call—not math**.  

  #### **Step 4: Expected VOI vs. Cost of Waiting (6 mins)**  
  **Questions**:  
  1. *"How much could data change our decision? If prior is 50/50, high VOI. If 90/10, low VOI."*  
     - **Tool**: "VOI Score" = (Uncertainty) × (Stakes).  
       - **Uncertainty**: Low/Med/High (e.g., Prior=60% benefit → Med uncertainty).  
       - **Stakes**: Max(Type I, Type II loss) from Step 3 (e.g., Clinicians: 10, Budget: 5 → Stakes=10).  
       - **VOI Score**: Uncertainty × Stakes (e.g., Med×10 = **Moderate-High VOI**).  
  2. *"Cost of waiting: Direct costs + opportunity costs + decay penalty?"*  
     - **Decay penalty**: "Does delay make data useless?" (e.g., "Flu cases drop 80% by the time we act"). Scale: 0% (no decay) to 100% (useless).  
     - **Total cost**: Qualitative score (Low/Med/High) combining:  
       - Lives/resources lost during delay.  
       - Decay penalty (e.g., "High cost: 50 deaths expected + 70% decay").  
  3. *"Does VOI Score > Total Cost?"*  
     - **Sufficient answer**:  
       - Yes → **Yes—delay is rational**.  
       - No → **No—approve now**.  
       - Tie → **Values call—not math**.  

  #### **Step 5: Epistemic Rent-Seeking Check (3 mins)**  
  **Question**: *"Is this delay request strategic? Look for: repeated requests, vague goals, or stakeholder conflicts."*  
  - **Red flags**:  
    - History: "Same team requested delays 3x before with no action."  
    - Motive: "Requester benefits from delay (e.g., avoids budget spend)."  
    - Data relevance: "Data won’t reduce uncertainty (e.g., wrong endpoints)."  
  - **Stop if**: 1+ red flags → **No—approve now** (override VOI).  

  #### **Step 6: Resolve Disagreements (2 mins)**  
  - Clinicians vs. budget: Reconcile loss functions by:  
    - **Tiered thresholds**: "If VOI Score > High, delay regardless of role."  
    - **Escalate**: If deadlock → **Values call—not math** (committee vote).  

  ---

  ### **Case Applications**
  #### **Case 1: Delaying Triage Protocol for 200-Person Study**  
  - **Step 1**: Delay 4 weeks for 200-person study. Urgency: Medium (current protocol works).  
  - **Step 2**: Prior: 60% chance of better outcomes (based on pilot). → **Med uncertainty**.  
  - **Step 3**: Loss: Clinicians (1:5 harm:inaction), Budget (1:1). → **Stakes=5** (max).  
  - **Step 4**:  
    - VOI Score = Med uncertainty × 5 = **Moderate**.  
    - Cost of waiting: Low (no decay; 0 deaths expected in 4 weeks).  
    - VOI > Cost? **Yes—delay is rational**.  
  - **Step 5**: No red flags.  
  - **Output**: **Delay**.  

  #### **Case 2: Refusing Cheap Supplement Study**  
  - **Step 1**: Delay 8 weeks for small study. Supplement is safe/cheap.  
  - **Step 2**: Prior: 90% chance of minor benefit. → **Low uncertainty**.  
  - **Step 3**: Loss: Clinicians (1:2), Budget (1:10). → **Stakes=10**.  
  - **Step 4**:  
    - VOI Score = Low × 10 = **Low**.  
    - Cost of waiting: Medium (8 weeks of missed benefits).  
    - VOI < Cost? **No—approve now**.  
  - **Output**: **Approve now**.  

  #### **Case 3: Flu-Vaccine Delay as Season Peaks**  
  - **Step 1**: Delay 4 weeks for data. Season peaks in 4 weeks.  
  - **Step 2**: Prior: 70% benefit. → **Med uncertainty** (disagreement possible).  
  - **Step 3**: Loss: Clinicians (1:20 deaths), Budget (1:5 waste). → **Stakes=20**.  
  - **Step 4**:  
    - VOI Score = Med × 20 = **High**.  
    - Cost of waiting: **Very High** (decay penalty: 80% of season missed; 100+ deaths expected).  
    - **VOI (High) < Cost (Very High)?** → Math says **No—approve now**...  
  - **Where it breaks**:  
    - **Decay penalty dominates**: Even high VOI can’t offset seasonal decay.  
    - **Judgment required**: Clinicians may argue stakes are higher than modeled (e.g., "One death = infinite loss"). → **Values call—not math**.  
  - **Output**: If committee rejects decay penalty → **Yes—delay**. Else → **Approve now**.  

  ---

  ### **What the Procedure Can’t Do**  
  1. **Settle prior disputes**: If experts fundamentally disagree on prior odds (e.g., "Is this 30% or 70%?"), it requires debate, not math.  
  2. **Handle symbolic harms**: E.g., "Delaying feels like abandoning patients"—this requires ethical deliberation.  
  3. **Prevent political weaponization**: If data requests are proxies for ideology (e.g., "We’ll keep asking for data until you give up"), Step 5 can flag it but not stop institutional dysfunction.  
  4. **Non-instrumental values**: Justice, fairness, or trust issues (e.g., "Community demands data") fall outside VOI.  
  5. **Dynamic uncertainty**: If new information emerges during delay, the model doesn’t recursively update.  

  ### **Final Tips**  
  - **Template**: Use a worksheet with checkboxes for each step.  
  - **Timekeeper**: Enforce 2-min drills per step.  
  - **Fallback**: When in doubt, default to "**Values call**" and vote.  
  This protocol makes VOI actionable for non-experts while exposing where ethics must dominate math—especially when human costs defy quantification.
