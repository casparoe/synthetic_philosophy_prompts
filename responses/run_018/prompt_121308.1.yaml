prompt: |-
  i'm a phd student in philosophy of science but i sit on a hospital ethics commitee every thursday, and we keep getting proposals where someone wants to delay an intervention to "gather more data" and nobody knows how to decide if that's legit. I want you to turn Good's theorem — the value of information thing — into a step-by-step procedure my committee can run in 20 minutes with no calculus. Give me the ordered questions: what prior do we state in writing, how do we sketch the loss function without inventing fake dollars, where do we check if the expected value of information exceeds the cost of waiting (including a seasonal decay penalty if delay makes the result useless), and how do we spot "epistemic rent-seeking" where a stakeholder is just using information requests to stall. For each step say what counts as a sufficient answer and where the procedure stops with a clear "no — approve now" vs "yes — delay is rational" vs "this is a values call, not a math call." Make sure it handles disagreements between clinicians and budget officers with thier different loss functions, and flag the spots where judgment is unavoidable. Then apply it to three cases: delaying a triage protocol for a 200-person study; refusing to wait on a cheap supplement; and a flu-vaccine rollout where the procedure outputs "collect more data" right as the season peaks — that's the one I won't like, show me exactly where it breaks and hands back to human judgment. Finally, say what the procedure can't do: settle prior disputes, handle purely symbolic harms, or stop information from being weaponized politically.
reasoning: |-
  We are going to design a step-by-step procedure based on Good's theorem (value of information) for an ethics committee to decide whether to delay an intervention to gather more data. The goal is to make it practical, requiring no calculus, and fitting within 20 minutes. The procedure will have clear stopping points and handle disagreements.

  ### Core Concepts from Good's Theorem:
  1. **Prior Probability**: The current estimate of the probability of different outcomes (e.g., success/failure of the intervention).
  2. **Loss Function**: The cost (or regret) associated with making a wrong decision. We need to express this in a way that doesn't require fake dollars. Instead, we can use relative units (e.g., "loss units") that can be defined by the committee.
  3. **Expected Value of Information (EVI)**: The reduction in expected loss from having additional information. This must exceed the cost of delaying (including opportunity costs and a decay penalty if the information becomes less useful over time).
  4. **Epistemic Rent-Seeking**: When a stakeholder is stalling by requesting more data without a genuine need.

  ### Step-by-Step Procedure:

  #### Step 1: Define the Decision Alternatives
  - **Question:** What are the two main actions we are choosing between?
    - Action A: Implement the intervention now.
    - Action B: Delay the intervention to gather more data and then decide.
  - **Sufficient Answer:** Clearly state the intervention and the proposed delay (e.g., "Delay for 4 weeks to collect 100 more data points").
  - **Stop Point:** If there's no plausible scenario where the data could change the decision (e.g., the intervention is life-saving and urgent, and the data is about a minor side effect), then stop and **approve now**.

  #### Step 2: State the Prior in Writing
  - **Question:** What is the current best estimate of the probability that the intervention is beneficial (or harmful) and by how much? We need a simple prior.
    - Use a 2x2 table if necessary: 
      - Probability of benefit: P(Benefit) = ?
      - Probability of harm: P(Harm) = 1 - P(Benefit) [if binary outcome]
      - If more outcomes, list the key ones and assign probabilities (must sum to 1).
    - How was this prior obtained? (e.g., from existing studies, expert consensus)
  - **Sufficient Answer:** A set of probabilities for the key outcomes (at least two: benefit and no benefit/harm) and a brief justification. If the committee disagrees, note the range (e.g., "Clinicians think P(Benefit)=0.8, budget officers think P(Benefit)=0.5").
  - **Stop Point:** If the prior is extremely clear (e.g., P(Benefit) > 0.95 and the benefit is large, or P(Benefit) < 0.05 and the harm is large) and the cost of waiting is high, then **approve now** (if beneficial) or **reject now** (if harmful).

  #### Step 3: Sketch the Loss Function Without Fake Dollars
  - **Question:** What are the relative losses (regrets) for two types of errors?
    - Type I: Implementing the intervention when it is actually harmful (or not beneficial).
    - Type II: Not implementing (or delaying) when it is actually beneficial.
    - We don't need dollar amounts. Instead, we can use a "loss ratio". Ask: "How many times worse is one type of error compared to the other?"
      - Example: If a Type II error (failing to implement a beneficial intervention) is considered 4 times worse than a Type I error (implementing a harmful one), then the loss ratio L = Loss(Type II) / Loss(Type I) = 4.
    - Note: The loss function may differ by stakeholder. Clinicians might focus on patient harm (so Type I error is very bad), while budget officers might focus on cost (so Type II error, wasting money, is bad). We need both perspectives.
  - **Sufficient Answer:** A loss ratio L (or two ratios if stakeholders disagree) and a brief explanation (e.g., "Clinicians: L=0.1 (Type I is 10 times worse than Type II); Budget: L=10 (Type II is 10 times worse than Type I)"). If they cannot agree, note the two and proceed to the next step with both.

  #### Step 4: Estimate the Expected Value of Information (EVI) and Compare to Cost of Waiting
  - **Question 4a: How much will the new data reduce uncertainty?**
    - We need an estimate of how the prior might change. Use a simple rule: 
      - If the new data is expected to be consistent with the prior, the posterior will be stronger (e.g., if prior P(Benefit)=0.7 and we get positive data, posterior might be 0.85).
      - If the new data is surprising, the posterior might shift (e.g., to 0.5). 
      - We can use a "expected shift" based on the sample size and the prior. A quick way: 
        - Let the new data be about a fraction of the total evidence. If we have 100 patients already and we are adding 20, then the new data is 20/120 of the total. The posterior will be a weighted average: (100/120)*prior + (20/120)*new_data_rate.
        - But we don't know the new_data_rate. Instead, we assume the new data will match the prior (so the posterior is the same as the prior but with more confidence). This is conservative (underestimates the value of information when there is uncertainty).
    - Alternatively, we can use the concept of the "variance" reduction, but without math, we can ask: "How much could the new data change our minds?" 
      - If the prior is 0.7, and the new data could move the probability to between 0.6 and 0.8 (a small shift), then the EVI is low. If it could move it to between 0.3 and 0.9 (a big shift), then EVI is high.
  - **Question 4b: What is the cost of waiting?**
    - Include:
      - Direct costs of the study (if any).
      - Opportunity cost: harm from delaying a beneficial intervention for the population during the waiting period. Estimate: 
        - Number of people affected during the delay? (e.g., 100 patients per week)
        - Expected harm per patient from delay? (if the intervention is beneficial, then the harm per patient per week is the benefit they would have received; if harmful, then it's a gain from delay).
      - Decay penalty: If the information becomes less useful over time (e.g., for a flu vaccine, the season peaks and then wanes). We can model this as a reduction in the population size that the intervention can help during the remaining season. For example, if the season peaks in 4 weeks and the delay is 4 weeks, then the remaining population to help might be only 20% of the original.
      - Total cost of waiting = (opportunity cost per week * weeks of delay) * decay factor + direct costs.
  - **Question 4c: Calculate EVI in loss units**
    - Without calculus, we can use a simple table:
      - Current expected loss of acting now: 
          = min{ 
              Loss(implement) = P(Harm) * Loss(Type I), 
              Loss(not implement) = P(Benefit) * Loss(Type II) 
            }
          But actually, we choose the action with the least expected loss. The expected loss of the best action now is:
          EL_now = min{ P(Harm)*L_I, P(Benefit)*L_II }   [where L_I = loss of Type I, L_II = loss of Type II]
      - After the study, we will have a better idea. We can approximate the expected loss after the study by assuming we will make the right decision then (so we avoid the error that we would have made without the data). The reduction in loss (EVI) is the difference between EL_now and the expected future loss (which is lower). However, without the data, we don't know the future state. 

    - A shortcut: 
      - The EVI is roughly proportional to the uncertainty (variance) and the stakes. We can use:
          EVI ≈ [P(Benefit) * (1-P(Benefit))] * [|L_II - L_I|] * (expected reduction in uncertainty from the data)
      - But we don't want to do formulas. Instead, we can use a rule of thumb: 
          EVI = (Current uncertainty) * (Stakes) * (Information gain from the study)
        where:
          - Current uncertainty = P(Benefit) * (1-P(Benefit))   [this is highest at 0.5, low at 0 or 1]
          - Stakes = max(L_I, L_II)   [the worst error loss]
          - Information gain = fraction of new data (new_sample_size / (current_sample_size + new_sample_size)) [if the data is of similar quality] OR we can use a simple scale (low=0.1, medium=0.3, high=0.5) for how much the data might change the prior.

    - Alternatively, we can use a table of scenarios (optimistic, pessimistic, and expected) for what the data might show and compute the expected loss in each. But that might take too long.

    - Given time constraints, we propose:
      - Let U = P(Benefit) * (1-P(Benefit))   [a number between 0 and 0.25]
      - Let S = max(L_I, L_II)   [the larger loss of the two error types]
      - Let I = new_sample_size / (current_sample_size + new_sample_size)   [if current evidence is based on current_sample_size]
      - Then EVI ≈ U * S * I   [in loss units]

    - But note: This is a very rough approximation.

  - **Compare EVI to Cost of Waiting (in the same loss units):**
    - We have EVI (in loss units) and Cost of Waiting (which we also expressed in loss units, by converting opportunity cost and decay into the same units as the loss function). 
    - If EVI > Cost of Waiting, then delaying is rational. Otherwise, it is not.

  - **Sufficient Answer:** 
    - A statement: "EVI ≈ X loss units, Cost of Waiting ≈ Y loss units. Therefore, EVI > Cost? [Yes/No]".
    - If the answer is clearly Yes (and Y is not huge), then **delay is rational**. 
    - If No, then **approve now** (or reject, depending on the prior).

  #### Step 5: Check for Epistemic Rent-Seeking
  - **Question:** Is there evidence that the request for more data is motivated by a desire to stall rather than to reduce uncertainty? Look for:
    - Repeated requests for more data without a clear endpoint.
    - The data being requested is not directly relevant to the decision (e.g., asking for long-term outcomes when the intervention is for an acute condition).
    - The stakeholder has a known conflict of interest (e.g., financial gain from delay).
  - **Sufficient Answer:** A red flag if at least two of the above are present. Then the committee can override the math and **approve now** (if the intervention is likely beneficial) or **reject** (if likely harmful) based on the prior.

  #### Step 6: Resolve Disagreements and Values Calls
  - **Question:** At any step, if there is fundamental disagreement (especially on the prior or the loss function) that cannot be resolved, then the decision is not primarily about information but about values. 
  - **Stop Point:** Flag as **"this is a values call, not a math call"**. The committee must then deliberate and vote based on ethical principles.

  ### Application to Cases:

