  - **Step 1:** The intervention is a new triage protocol. Delay: time to run a 200-person study (say 4 weeks).
  - **Step 2:** Prior: Based on existing evidence, P(Benefit)=0.6 (moderate chance of benefit). Justification: one small study showed benefit, but not definitive.
  - **Step 3:** Loss function: 
