      - Budget: Type II error (wasting money on a new protocol that isn't better) is bad (loss=8), Type I (harming patients) is very bad (loss=10). So L = 8/10 = 0.8 (but note: they might weight financial loss differently). Alternatively, we can keep them separate: 
          For clinicians: L_I=10, L_II=5 → so they are more cautious about harm.
          For budget: L_I=10 (for harm), L_II=8 (for financial waste) → but they also care about harm.
      - We can average? Or take the max? Let's use the clinician's for health and budget's for finance? We need a joint loss. Instead, we can convert the financial loss to health loss? But that's hard. Alternatively, we can do two analyses.
  - **Step 4:**
