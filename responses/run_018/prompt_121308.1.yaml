  ### What the Procedure Can't Do:
  1. **Settle prior disputes**: If experts disagree on the prior, the procedure cannot resolve that. It will flag it as a values call.
  2. **Handle purely symbolic harms**: If a harm is non-material (e.g., violation of a symbolic norm), it may not fit into the loss function.
  3. **Stop information from being weaponized politically**: The procedure can flag epistemic rent-seeking, but it cannot prevent political misuse of the decision process.
  4. **Address complex uncertainties**: The procedure simplifies to a binary benefit/harm. For multiple outcomes, it becomes more complex.
  5. **Account for indirect effects**: E.g., if the data collection itself has educational value, or if it builds trust, these are not captured.
  6. **Quantify non-linear losses**: The loss function is assumed linear, but in reality, losses might be catastrophic at thresholds.

  ### Final Procedure Summary (Ordered Questions):

  1. **Define the decision and delay:** What are we deciding, and what delay is proposed for data collection? 
     - If delay cannot change the decision -> **approve now**.
     
  2. **State the prior:** What is the probability of benefit and harm? (Must be in writing, with justification.) 
     - If extreme (e.g., P(Benefit)>0.95) and cost of waiting is high -> **approve now** (if beneficial) or **reject now** (if harmful).
     - If there's major disagreement -> **values call**.

  3. **Sketch the loss function:** What is the loss ratio (or separate losses for stakeholders) for Type I vs Type II errors? 
     - If stakeholders cannot agree on losses -> **values call**.

  4. **Estimate EVI and cost of waiting:**
