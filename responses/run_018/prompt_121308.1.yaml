     - Step 4b: What is the cost of waiting? (Include opportunity cost and decay; convert to loss units using the loss function.)
     - Step 4c: Approximate EVI = [P(Benefit)*(1-P(Benefit))] * [max(L_I, L_II)] * [information gain fraction]. Compare: Is EVI > cost of waiting?
       - If yes -> **delay is rational**.
       - If no -> **approve now** (or reject, based on prior).

  5. **Check for epistemic rent-seeking:** Are there red flags? 
     - If yes, override and **approve now** (or reject) based on prior.

  6. **Resolve values calls:** At any step, if there's fundamental disagreement that cannot be resolved by the procedure, then **values call** -> committee vote.

  This procedure is designed to be completed in 20 minutes by focusing on the key elements and using approximations. It requires the committee to make judgments at every step, especially in converting real-world consequences into loss units and in assessing the prior.
