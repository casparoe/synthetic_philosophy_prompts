answer: |-
  Your reductio is sharp and exposes a genuine tension in Russell's position. The weak step is **premise (5)**. It oversimplifies Russell's conception of the "remaining bond" in reformed marriage by neglecting the *structural totality* and *institutional function* he assigns to it, even without mandatory exclusivity.

  Here's the breakdown of why (5) is faulty and how it weakens the argument:

  1.  **Mischaracterization of Russell's "Remaining Bond":** Premise (5) reduces the marital bond to just "cooperative parenting and mutual affection." While Russell emphasizes these, his vision of reformed marriage is far richer and more *institutionally integrated*:
      *   **Bundled Commitments:** It's not just affection and parenting *in isolation*. Russell envisions a *primary*, legally recognized partnership encompassing deep emotional intimacy, domestic life, shared economic interests and responsibilities, social standing as a unit, and the framework for raising children *as a joint enterprise*. This is a unique *bundle* of commitments and functions concentrated in one relationship.
      *   **Sexual Dimension (Potentially Non-Exclusive but Primary):** While Russell rejects *mandatory* exclusivity driven by jealousy, he doesn't necessarily dismiss the significance of a *primary sexual partnership* within the marriage, especially one based on mutual affection and stability. The sexual relationship isn't erased; its *exclusivity requirement* is. This primary sexual bond, even if non-exclusive, still differentiates it structurally from most close friendships.
      *   **Legal/Institutional Structure:** Marriage, for Russell, provides a *pre-defined legal and social framework* for managing shared property, inheritance, child custody, medical decisions, financial obligations, and dissolution. This structure provides predictability, security, and efficiency that ad hoc close friendships or non-marital parenting arrangements lack.

  2.  **Why "Friendship" is Inadequate:** Premise (5) claims the features "can be fully present" in close friendships or non-marital arrangements. This is misleading:
      *   **Intensity ≠ Structure:** A close friendship *might* involve deep affection and cooperation, but it rarely carries the *default expectation* of encompassing the *entire bundle* of commitments (full domestic cohabitation, primary economic unit, default legal next-of-kin status, primary framework for child-rearing) that marriage does. Marriage is institutionally *designed* for this totality.
      *   **The "Particularly Intense Friendship" Problem:** Your step (6) describes the result as a "particularly intense friendship." Russell would argue that the reformed marriage he envisions *is structurally different* from even the most intense friendship precisely because of the institutional framework and the intentional bundling of life domains it provides. The *intensity* isn't the defining feature; the *institutional role* and *comprehensive commitment structure* are.
      *   **Non-Marital Parenting Arrangements:** While possible, these lack the automatic legal presumptions, social recognition of the *partnership itself* (as distinct from just co-parenting), and the integrated structure marriage provides. They often require complex, bespoke legal agreements to approximate some marital benefits.

  3.  **Saving Russell's Position (Without Exclusivity):** Rejecting premise (5) allows Russell to maintain:
      *   **(1) & (2):** Ethics based on happiness/harm; rejection of jealousy/possessiveness as grounds for rules.
      *   **(3):** Removal of *mandatory* exclusivity as a jealousy-based norm.
      *   **(4) & (7):** Preservation of marriage as a distinct institution justified by its unique ability to provide a stable, legally/socially recognized framework that efficiently bundles:
          *   Deep, sustained emotional partnership (potentially including a primary sexual bond).
          *   A cooperative domestic and economic unit.
          *   A privileged environment for child-rearing with clear legal presumptions.
          *   A structure for managing shared life risks and assets.
      *   **The Distinctive Content:** The distinctive moral and institutional content of marriage, once exclusivity is abandoned, lies precisely in this *intentional bundling of life partnerships into a single, privileged, legally/socially recognized structure* designed for long-term stability and mutual support, particularly beneficial for children but valuable in itself. It's not *just* the sum of its parts (affection + parenting), but the *institutionalized totality* and the *social/legal function* it serves.

  **Where the Argument Overreaches & What Giving Up (5) Commits You To:**

  *   **Overreach:** Premise (5) commits the fallacy of **composition/division**. It assumes that because the *individual components* of the marital bond (affection, cooperation) can exist elsewhere, the *institutionally structured totality* of marriage can be fully replicated in non-marital forms. It ignores the unique value Russell places on the *integration and institutionalization* itself.
  *   **Commitment:** Rejecting (5) commits you to accepting that a legally/socially recognized institution can have distinctive value *even if* its individual components can be found separately elsewhere. The value lies in the *combination*, the *structure*, the *efficiency*, the *social recognition*, and the *default legal framework* it provides. You must accept that Russell can consistently argue that while jealousy-based exclusivity is irrational, the *institutional form* of marriage, reformed to remove that irrational element, retains unique utility for organizing core aspects of adult partnership and child-rearing in a complex society.

  **In essence: Russell's reformed marriage isn't just "affection + kids." It's a specific, privileged, institutionalized structure designed to efficiently manage the *totality* of a primary life partnership (emotional, domestic, economic, parental) for long-term stability. Premise (5) misses this crucial point of integration and institutional function, making the collapse into mere friendship seem inevitable when it isn't, according to Russell's own rationale.** The distinctiveness isn't erased by removing exclusivity; it's redefined around the rational benefits of the institutional *form* itself for fostering stable partnerships and child-rearing environments.
