  Hmm, this seems like a hybrid strategy. Let me mentally scan the literature. Conventionalism accepts arbitrary cutoffs but doesn't explain the asymmetric defenses. Supervaluationism's precisification is symmetric in theory, while epistemicism believes in sharp boundaries unknowable to us—neither fits the directional rhetoric described. Contextualism deals with shifting standards but not institutional entrenchment. 

  Ah! The core innovation here is the weaponization of vagueness itself. First, they exploit the sorites setup to justify needing any boundary (the "precisification imperative"), then selectively deploy two distinct defenses depending on direction: slope-aversion against relaxation, and entrenchment against restriction. This isn't just conventionalism—it's *conventionalism with asymmetric reinforcements*. 

  For terminology... "Asymmetric Boundary Entrenchment" captures the mechanics, but "Precisification Asymmetry" emphasizes the vagueness foundation. Maybe "Sorites-Exploitative Conventionalism" to highlight how the paradox is instrumentalized? The key differentiator is the *rhetorical duality*—slope fears vs. status quo burdens—which doesn't appear in standard accounts. 

  User likely needs this labeled not just for taxonomy, but to critique bad-faith debates. The proposed terms should flag when a neutral precisification tool becomes a power-preserving tactic. Boundary conditions: collapses into simple conventionalism if defenses are symmetric; becomes pure rhetoric if the continuum isn't genuinely acknowledged. Must stress that in ethical contexts, this asymmetry often masks value judgments—like prioritizing existing systems over marginalized claims (e.g., lowering voting age vs. raising it). 

  ...Better also note how this differs from "tolerance principles" in sorites literature. Here, tolerance is rejected via legislation but reactivated selectively in discourse—a fascinating contradiction.
answer: |-
  This is an exceptionally sharp observation of a recurrent and under-theorized argumentative maneuver. While it draws from established concepts, the *specific combination and asymmetry* you describe doesn't have a single, universally recognized label in the core vagueness literature. However, we can dissect it and map it precisely:

  1.  **Core Components & Their Lineage:**
      *   **Acknowledged Vagueness (Sorites Setup):** Explicit recognition of the sorites-susceptible continuum. This aligns with supervaluationism, contextualism, and conventionalism, all rejecting epistemicism's "sharp but unknowable boundary."
      *   **Necessity of Precisification (The Mandate):** The argument that practical/political/legal necessity *requires* drawing a sharp line despite the continuum. This is central to **conventionalism** (the line is set by convention) and **supervaluationism**'s notion of **admissible precisification** (selecting a sharp boundary consistent with clear cases).
      *   **Asymmetric Defense:**
          *   *Against Lowering (Relaxing Criteria):* Invokes the **slippery slope** (a classic response to sorites, often seen as fallacious but powerful rhetorically). The fear isn't necessarily logical erosion per se, but *practical* erosion leading to chaos or unacceptable outcomes ("if 17, why not 16?").
          *   *Against Raising (Restricting Criteria):* Invokes **practical disruption, institutional inertia, and reliance interests**. This shifts focus to the costs of *change* and the stability provided by the *existing* convention.

  2.  **The Novelty & The Gap:** The unique and problematic element is the **asymmetric application of justificatory burdens depending on the direction of change**, leveraging *different fears* (slope vs. disruption) that stem *from the same acknowledged vagueness*. This isn't inherent in standard formulations:
      *   **Standard Conventionalism/Supervaluationism:** Defends the *arbitrariness* or *practical necessity* of *a* line, but doesn't inherently prescribe *which* line or justify its *current* location asymmetrically against change in *both* directions. A conventionalist *could* consistently argue for moving the line based on new practical needs.
      *   **Epistemicism:** Denies the need for precisification; it believes the sharp boundary *exists*, so arguments for/against moving it wouldn't rely on the dangers of the continuum itself in this asymmetric way.
      *   **Slippery Slope Arguments:** Often deployed against relaxing boundaries, but rarely paired with an *equally strong, different* argument against strengthening them, especially when *both* stances are justified by the initial appeal to the need for a line due to vagueness.

  3.  **Overlap and Distinction:**
      *   **Closest Existing Concept: Institutionally Entrenched Conventionalism with Asymmetric Defenses.** This emphasizes the conventional origin and the practical reasons for stability, but highlights the distinct rhetorical strategies used to defend the status quo against different types of challenge.
      *   **Key Difference:** The **selective mobilization of different aspects of the *consequences* of vagueness** (the danger of the slope vs. the cost of disrupting stability) *depending solely on the direction of proposed change*, while consistently using the *existence* of vagueness as the initial mandate for having *a* line. The continuum is weaponized first to justify needing a line, then selectively weaponized again to defend the *current* line against specific changes.

  4.  **Proposed Label & Definition:**
      *   **Term: Directionally Asymmetric Precisification Defense (DAPD)**
      *   **Definition:** An argumentative strategy that:
          1.  **Acknowledges Vagueness:** Explicitly recognizes a sorites-susceptible continuum for a predicate `P`.
          2.  **Mandates Precisification:** Argues that practical necessity (legal, ethical, institutional) *requires* stipulating a sharp boundary `S` for `P` *because* of this vagueness.
          3.  **Defends `S` Asymetrically:**
              *   Against proposals to *relax* `S` (lower the bar for `P`): Invokes the **slippery slope** inherent in the continuum to argue this would lead to erosion of standards and unacceptable consequences.
              *   Against proposals to *restrict* `S` (raise the bar for `P`): Invokes **practical disruption, institutional inertia, and reliance interests** (harm to existing arrangements, contracts, expectations) to argue change is too costly or destabilizing.
          4.  **Justification Shift:** Relies on the *initial acknowledgment of vagueness* primarily to justify the *need* for `S`, but then switches justificatory frameworks (slope-danger vs. disruption-cost) based *solely* on the direction of the proposed change to defend the *current location* of `S`.

  5.  **Boundary Conditions: When does DAPD become something else?**
      *   **Collapses into Ordinary Conventionalism:** If the defender is *consistent* in their justifications *regardless of direction*. For example:
          *   Defending against *any* change (up or down) *only* by appealing to disruption/inertia ("The line is settled, changing it causes problems").
          *   Defending against *any* change (up or down) *only* by appealing to slippery slope concerns ("Any deviation risks losing control").
      *   **Becomes Pure Interest-Driven Rhetoric:** If the initial acknowledgment of genuine vagueness is insincere or abandoned. The defender might:
          *   Claim the boundary `S` is *not* conventional but metaphysically sharp (epistemicism or essentialism), eliminating the need for the precisification mandate argument.
          *   Use the asymmetric arguments *without* grounding them in the initial appeal to the *necessity* of a line due to vagueness. The arguments become ad hoc justifications for a preferred outcome, detached from the philosophical problem of vagueness.
          *   Fail to acknowledge the continuum at all.
      *   **Distinct from Epistemicism:** DAPD explicitly rejects epistemicism by acknowledging the vagueness and conventional nature of the boundary. The defense is pragmatic, not ontological.
      *   **Distinct from Supervaluationism's Symmetry:** Supervaluationism treats all admissible precisifications as equally valid *semantically* before a context/convention selects one. DAPD treats the *current* precisification (`S`) as uniquely defensible *pragmatically* against change in either direction, using asymmetric arguments.

  **Conclusion:** You've identified a distinct and pernicious pattern – **Directionally Asymmetric Precisification Defense (DAPD)**. While rooted in conventionalism and the practical need for precisification, its defining feature is the *asymmetric deployment of slippery slope vs. disruption arguments based solely on the direction of proposed change*, leveraging the initial acknowledgment of vagueness selectively. This strategy exploits the genuine problem of vagueness to entrench a specific boundary, often masking underlying value judgments or power dynamics (e.g., prioritizing institutional stability over potential expansion of rights, or vice-versa) under a veneer of practical necessity. It warrants recognition as a specific dialectical tactic within applied philosophy dealing with vague, high-stakes concepts.
