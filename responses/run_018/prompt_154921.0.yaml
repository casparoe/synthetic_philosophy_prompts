prompt: |-
  I'm a PhD student in comp politics and I'm tired of seeing "democratic backsliding" used like a partisan slur for Hungary, Poland, Turkey, or even US politics. I want to actually work on the conceptual mess: is backsliding just executive aggrandizement and court-packing, or is there something like norm erosion or autocratic innovation that makes it a distinct category? What are the open questions that actually matter—like who gets to decide the baseline democracy, and whether the concept collapses into "policies I disagree with"? If I only have a few years and want to do something that isn't just normative shouting, which two or three lines of work should I prioritize? Give me a defended ordering: what's upstream, what's tractable, and what evidence would change the ranking. Also please seperate what's settled from what's genuinely contested—don't present a contested view as consensus.
