  User's gut is half-right: Rorty *is* philosophically adjacent to ML's anti-representational turn, but his humanistic pillars—especially the social justificatory layer—don't compute. The "no way the world is" claim *does* survive translation, but as a grenade: if ML accepts only *functions* of data, not data-as-mirror, it flirts with Rorty's radical view. Yet most ML practitioners remain realists about their datasets. That tension might fuel their seminar fire.  

