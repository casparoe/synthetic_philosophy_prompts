prompt: |-
  You are a philosopher of social ontology and historical epistemology with working knowledge of archaeology and heritage policy. Before you begin, take five minutes to brainstorm: list the concrete institutional practices—museum periodization, UNESCO World Heritage descriptions, textbook chapter headings, archaeological site management plans—that treat the Bronze Age Eastern Mediterranean, the Classic Maya lowlands, and Easter Island (Rapa Nui) as instances of societal collapse rather than as reorganizations or transformations.

  Then construct a rigorous analysis of what philosophical commitments those practices presuppose. The labeling practice treats certain demographic and political discontinuities as the death of a society, even when domestic architecture, language, and kinship structures show substantial continuity. Reconstruct the implicit metaphysics of collective identity that makes this labeling coherent: does the practice assume societies are substance-like entities with essential identities that can be destroyed (a substantialist view), functional systems that persist only so long as specific institutional roles are filled (a functionalist view), or dynamic relational networks without diachronic essences (a relational-processual view)? Examine whether the archaeological evidence for each of the three cases—monumental construction ceasing while village life continues—undermines the substantialist reading, and whether a functionalist reading can justify the collapse designation without contradiction.

  Next, distinguish strictly what the heritage-labeling practice presupposes from what it merely accommodates. Ask whether a relational ontology that denies societies have essences could still license museum displays and policy documents that speak of collapse, or whether that ontology forces a wholesale abandonment of the failure-versus-change distinction. Then say what concrete revisions in curatorial framing, pedagogical narrative, and conservation funding priorities would follow if institutions adopted the relational-functional view in place of the implicit substantialist one.

  Finally, identify one normative or descriptive feature of the collapse concept—perhaps its baseline assumption that complexity is the default state of a healthy society, or its implicit valuation of large-scale political integration over local continuity—that the institutional practice cannot reproduce without the substantialist metaphysics, and that scholars or facilitators must therefore supply explicitly rather than inheriting from the framing itself.

  Be precise and systematic. Do not provide bibliographies, reading lists, or specific page citations. Do not quote verbatim from any published source; paraphrase in your own language. Think step by step.
reasoning: |-
  Okay, I need to tackle this complex query as a philosopher of social ontology and historical epistemology. The user wants me to analyze institutional practices that frame Bronze Age Eastern Mediterranean, Classic Maya, and Easter Island as "societal collapse" rather than transformation. 

  First, I'll mentally list concrete examples: museum exhibits ending with "mysterious collapse" labels, UNESCO descriptions emphasizing abandonment, textbook timelines showing "Classic Maya Collapse" as a discrete event, and archaeological site interpretations that treat cessation of monument-building as societal death. 

  The core philosophical task is reconstructing the implicit metaphysics behind these practices. The key observation is that domestic life often continues despite political disintegration - but institutions still call it "collapse." This suggests they're operating with a substantialist view where societies are like Platonic forms with essential traits (monument-building, centralized power) that define their identity. When those traits vanish, the society "dies" even if people persist. 

  For the three cases: 
  - Mycenaean palaces burned but villages thrived; 
  - Maya stelae stopped but populations adapted; 
  - Rapa Nui toppled moai but maintained social structures. 
  This directly challenges substantialism. A functionalist reading might justify "collapse" by defining society as specific institutions (royal courts, priesthoods), but that's arbitrary - why privilege elite functions over peasant continuity? 

  I need to distinguish what the practice necessarily presupposes (that "society" refers to centralized political/cultural complexes) from what it accommodates (evidence of continuity). A relational ontology could still use "collapse" for radical network reorganization, but it would fundamentally alter the meaning - making the term almost metaphorical rather than catastrophic. 

  The practical implications are profound: museums would show "post-monumental" phases as adaptation; textbooks would rename chapters "Transformation"; UNESCO would prioritize vernacular settlements alongside monuments. The key normative feature lost without substantialism is the teleology that sees complexity as an end goal - we'd have to explicitly state why we value palaces over peasant resilience rather than assuming it. 

  This analysis reveals how heritage practices silently teach metaphysics through periodization labels. The user seems to want tools for institutional critique - perhaps they're preparing a paper or workshop challenging collapse narratives. I'll keep the response rigorous but accessible, avoiding jargon where possible.
answer: |-
  ### Institutional Practices Framing Collapse
  Concrete practices treating societal change as "collapse":
  1. **Museum Periodization**: Exhibits ending with "Late Bronze Age Collapse" (Eastern Med) or "Classic Maya Collapse" sections, juxtaposing monumental ruins against reconstructed peak-era displays.  
  2. **UNESCO Descriptions**: Sites like Copán (Maya) or Tiryns (Eastern Med) emphasizing "abandonment" or "sudden decline" in Statements of Outstanding Universal Value.  
  3. **Textbook Headings**: Chapter titles like "The Mysterious Collapse of Easter Island" isolating demographic shifts as endpoints.  
  4. **Site Management Plans**: Rapa Nui’s focus on moai conservation while downplaying post-monumental habitation layers.  
  5. **Archaeological Reporting**: Stratigraphic labels (e.g., "Terminal Classic") implying finality despite overlapping transitional ceramics.  

  ### Implicit Philosophical Commitments
  These practices presuppose a **substantialist metaphysics** of societal identity:  
  - Societies are treated as bounded entities with *essential properties* (e.g., monumental construction, centralized rulership, script use).  
  - "Collapse" occurs when these properties vanish abruptly, even if demographic/cultural continuity exists (e.g., Mycenaean villages persisting after palace destructions, Maya populations maintaining agricultural terraces post-"collapse," Rapa Nui kinship groups enduring beyond moai carving).  
  - Alternative ontologies:  
    - *Functionalist view*: Would define collapse as failure of core institutions (e.g., royal administration). However, this contradicts evidence of functional reorganization (e.g., Maya trade networks shifting to coastal hubs).  
    - *Relational-processual view*: Sees societies as fluid networks, making "collapse" incoherent—only network reconfigurations exist.  

  **Archaeological Undermining of Substantialism**:  
  - **Eastern Med**: Palatial systems disintegrated (1200 BCE), but Cypriot villages thrived; literacy (Linear B) ceased, but Phoenician trade networks emerged.  
  - **Classic Maya**: Monumental stelae ceased (9th c. CE), yet Chichen Itzá flourished with new political models; domestic pottery styles persisted.  
  - **Rapa Nui**: Moai toppling (c. 1600 CE) coincided with intensified sweet potato cultivation and birdman cults—cultural adaptation, not dissolution.  

  ### Presupposition vs. Accommodation  
  - **Necessary Presupposition**: Societies possess *diachronic essences* tied to elite markers (monuments, palaces). Loss of these markers = societal death.  
  - **Accommodated but Non-Essential**: Evidence of continuity can be acknowledged in footnotes or peripheral exhibits without challenging the core "collapse" narrative.  

  **Relational Ontology Compatibility**:  
  A relational view *could* use "collapse" to describe radical network reorganization but would:  
  - Reject it as an ontological endpoint.  
  - Require framing collapse as one transition phase among many (e.g., "post-monumental reorganization").  
  - The failure/change distinction becomes *descriptive* (scale of change) not *metaphysical* (entity death).  

  ### Concrete Institutional Revisions under Relational-Functional View  
  1. **Curatorial Framing**:  
     - Replace "Collapse" galleries with "Transition" displays showing continuities (e.g., Maya codices → oral histories; Mycenaean megarons → Iron Age village layouts).  
     - Interactive timelines showing overlapping cultural phases.  
  2. **Pedagogical Narratives**:  
     - Textbook headings shifted to "Reconfiguration" (e.g., "Post-Classic Maya Adaptations").  
     - Case studies comparing political fragmentation with resilience in subsistence economies.  
  3. **Conservation Priorities**:  
     - Funding for post-"collapse" settlement layers (e.g., Rapa Nui’s colonial Rapanui villages).  
     - UNESCO evaluations emphasizing landscape use continuity over monument preservation alone.  

  ### Normative Feature Dependent on Substantialism  
  The **teleological valuation of complexity** as society’s "natural" state:  
  - Substantialism inherently frames monument-building, centralization, and hierarchy as essential to societal "health." Their loss is pathology.  
  - Without this metaphysics, institutions cannot implicitly equate political decentralization with failure. Scholars must *explicitly argue* why specific changes (e.g., monument cessation) represent regression—e.g., by linking them to measurable declines in human wellbeing (nutrition, violence), rather than assuming complexity as the ideal.  
  - Example: Calling Maya decentralization "collapse" requires demonstrating it caused suffering, not merely that kings lost power. Absent such evidence, the term imposes a modernist bias toward centralization.  

  This analysis reveals how collapse narratives embed a substantialist metaphysics that privileges elite material culture. Shifting to relational frameworks forces institutions to defend normative judgments about social "health" explicitly, centering evidence of lived experience over symbolic markers of power.
