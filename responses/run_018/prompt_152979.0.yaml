prompt: |-
  Next month I present to an interdisciplinary philosophy-of-science workshop—attended mainly by historians of science with strong archival instincts and social-constructivist commitments, plus a pair of philosophers of mathematics who reject inevitability talk outright—my argument that simultaneous discoveries (the calculus priority dispute and the Darwin-Wallace formulation of natural selection) are best analyzed not through chronology or institutional context alone, but through what I call a dependency-graph model: once a theoretical framework reaches a critical density of unsolved anomalies, the discovery becomes structurally overdetermined, yet attribution should still go to the agent whose formulation produces the more robust downstream conceptual connections, not to whoever was first. I apply this to both cases, conceding that institutional access shaped formulation but insisting it does not determine structural inevitability. Prepare me for the Q&A: list the objections in the order they will actually arise—first the archival historians challenging my abstraction from manuscript and correspondence evidence, then the constructivists accusing me of normative smuggling, then the mathematicians attacking the inevitability premise itself. For each, phrase it in that audience's vocabulary, say whether I should concede or hold, sketch a concise reply, and flag where that reply is weakest. State clearly what I should concede up front in my opening remarks, and identify the single objection—likely about the counterfactual dependence of calculus notation systems on Leibniz's differential symbolism—that I am hoping nobody raises, with a brief survival strategy should it surface.
