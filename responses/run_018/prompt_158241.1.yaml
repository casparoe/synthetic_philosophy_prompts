answer: |-
  Here are five interview questions for Dr. Elena Vasquez:

  1.  Dr. Vasquez, if subjective pain experience is phenomenologically unified for the organism, why should the spatial distribution of nociceptive responses across the ventral nerve cord carry independent moral weight in determining our welfare obligations?
  2.  Given your framework calibrates obligations to specific neural response topography rather than a whole-organism sentience threshold, how does it avoid functionally collapsing back into a threshold model in practical hatchery settings when determining which responses warrant intervention?
  3.  Behavioral studies show shrimp under chronic aquaculture stress can exhibit stress-induced analgesia, suppressing aversive responses; doesn't this evidence challenge the necessity of mapping sustained aversive consciousness via your topology approach for welfare protocols?
  4.  If the decapod nervous system is anatomically fragmented, does your focus on nociceptive topography imply that *parts* of the animal (e.g., specific ganglia) are distinct moral patients, rather than the whole organism?
  5.  Within a commercial hatchery, what specific, observable outcome—like a quantifiable change in mortality, growth rate, or abnormal behaviour—would genuinely falsify the practical relevance of your affective mapping for welfare, rather than just requiring a remapping?
