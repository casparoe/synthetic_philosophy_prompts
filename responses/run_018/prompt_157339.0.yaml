answer: |-
  Here's a decision tree that branches users from Plutarch's core premise to specific stances on biography's moral utility, incorporating your requirements. It uses concrete scenarios to avoid jargon and includes "moral marketing" framing.

  ---

  ### **Plutarchan Biography Morality Decision Tree**

  **Start:** You believe reading biographies *can* improve moral character (Plutarch's premise).  
  *Choose your path based on concrete reactions:*

  1. **Plutarch pairs Greek & Roman lives (e.g., Alexander vs. Caesar). Does this parallel structure...?**  
     - **A) Create deeper moral insight** (e.g., virtues/vices transcend cultures)  
     - **B) Just make it more engaging** (e.g., literary flair without moral weight)  

  2. **You discover the biographer hid the subject’s flaws ("moral marketing"). Does this...?**  
     - **A) Ruin the lesson** (dishonest portraiture undermines trust)  
     - **B) Help the lesson** (flaws distract; ideals inspire action)  

  3. **The primary value of biographies is learning to...?**  
     - **A) Emulate specific virtues** (e.g., "How would Cato handle this?")  
     - **B) Judge character in others** (e.g., spotting integrity/hypocrisy)  

  4. **Knowing the biographer manipulates facts for narrative...?**  
     - **A) Undermines the value** (feels like moral propaganda)  
     - **B) Irrelevant if lessons resonate** (storytelling is a valid tool)  

  ---

  ### **Leaf Stances (Outcomes)**
  *Combinations map to distinct philosophical positions:*

  | Path  | Stance Name               | Core Belief                                                                 | Plutarch Parallels | Hagiography ("Moral Marketing") | Goal         | Narrative Manipulation |
  |-------|---------------------------|----------------------------------------------------------------------------|--------------------|--------------------------------|--------------|------------------------|
  | A→A→A→A | **Strict Virtue Realist** | Only honest, cross-cultural comparisons build character. Ideals require proof. | Moral framework    | Ruinous                        | Emulate      | Undermines             |
  | A→A→A→B | **Pragmatic Idealist**    | Parallels reveal universal virtues; flaws distract from aspirational goals.   | Moral framework    | Helpful                        | Emulate      | Irrelevant             |
  | A→B→A→B | **Narrative Benchmarker** | Stories (even polished) train moral intuition; parallels are practice cases.   | Literary tool      | Helpful                        | Judge others | Irrelevant             |
  | B→A→B→A | **Critical Skeptic**      | Biographies are character-judgment drills; hidden flaws defeat the purpose.   | Literary tool      | Ruinous                        | Judge others | Undermines             |
  | B→B→B→A | **Deconstructive Analyst**| Biographies expose how society constructs "virtue"—truth matters less than patterns. | Literary tool      | Helpful*                       | Judge others | Undermines             |
  | A→B→B→B | **Cultural Ethicist**     | Parallels showcase context-dependent virtues; ideals adapt to circumstances. | Moral framework    | Helpful                        | Emulate      | Irrelevant             |

  ***(*):* Hagiography "helps" by revealing societal values, not individual morality.

  ---

  ### **Key Observations**
  - **Incoherent Combo (Empty Leaf):** `A→A→B→A`  
    *Why?* If parallels provide *moral insight* (A1) but the goal is *judging others* (B3), hiding flaws (A2) creates contradiction: how can you judge others if models are dishonest?  
  - **Unseparated Pair:** `B→A→A→?` and `B→B→A→?` collapse into existing leaves.  
    *Why?* If parallels are *just literary* (B1), prioritizing *emulation* (A3) forces reliance on potentially flawed models—aligning with **Critical Skeptic** or **Pragmatic Idealist** depending on hagiography view.  
  - **Niche Injection:** "Moral marketing" vs. "honest portraiture" frames hagiography as either:
    - *Strategic idealization* (if "helpful") or  
    - *Fraudulent branding* (if "ruinous").  

  ---

  ### **How to Use**
  - Start at **Q1**, follow answers to subsequent questions.  
  - Each endpoint is a coherent stance synthesizing all choices.  
  - "Empty" paths reflect logical tensions (e.g., demanding honest parallels for judgment-training while accepting narrative manipulation).  

  This tree isolates 6 viable positions from Plutarch’s premise using your criteria, avoids jargon, and highlights where positions collapse or conflict.
