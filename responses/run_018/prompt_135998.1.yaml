  {
    "false_presupposition": "That for a disposition to be real/intrinsic, it must be impossible to fink or mask it *at all* (or that the *logical possibility* of infinite finks/masks means they are always operatively present, erasing the disposition).",
    "how_finks_and_masks_really_work": "They are specific, contingent interferers relevant to particular situations. Dispositions are defined relative to conditions *that explicitly exclude relevant finks/masks* – we don't define them relative to *all logically possible* interferers, let alone infinitely stacked ones.",
    "implication_for_intrinsicness": "Dispositions *are* grounded in intrinsic properties. Finks/Masks are *extrinsic* interferers affecting *manifestation* or *temporarily altering* the base property, but they don't show the base dispositional property isn't intrinsic. The infinite recursion worry applies to the *conditions for manifestation*, not the existence of the underlying intrinsic property defining the disposition."
  }
