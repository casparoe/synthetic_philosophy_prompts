prompt: |-
  I'm taking a course on virtue ethics and the situtationist critique is really messing with my head, so I'm trying to check my gut on concrete cases to see if I actually buy into character traits or not. Here are my verdicts: Maria usually lies politely about small stuff, but she told her partner about her affair even though it destroyed the relationship — I think that's real integrity, not just a habit. Jake donates 20% of his income every year, but he does it mostly for tax breaks and to impress people at church; I don't think he's genuinely generous. Dr. Lee is incredibly patient with patients during 12-hour shifts, but she's abusive to her nurses behind closed doors — I feel like she's not actually patient, that's just professional masking. Then there's the random bystander with zero history of altruism who pulls a kid from a burning car and then goes back to being totally self-centered; I think that reveals hidden courage, even if it never shows up again. A student refuses to cheat on an exam when everyone else is cheating and there's literally zero risk of getting caught — that's real integrity too. But my roommate, who is usually kind, was cruel to a waiter when he was sleep-deprived and stressed about finals — I'm going back and forth, is that just the situation talking, or does it prove he's not kind at all?

  Can you lay out a principel, or maybe a couple candidates, that gets as many of these verdicts right as possible? For each one, tell me which cases it saves and which it has to throw out, and be honest about whether it can reconcile case F with case D. I was also chatting with friends about "moral topology" — the idea that virtues have different shapes depending on whether they're reactive, like sudden rescue, versus proactive, like sustained patience — and whether that distinction actually helps here or just adds noise. First give me the analysis in prose, then put a brief structured summary in a JSON object with these fields: principle_name (string, name of the principle), core_claim (string, one-sentence summary), saves_cases (array of case letters it handles well), fails_on (array of case letters it cannot save), roommate_f_verdict (string, what the principle says about my roommate), and moral_topology_note (string, whether the reactive/proactive distinction helps reconcile the tension).
reasoning: |-
  Hmm, the user is grappling with virtue ethics and the situationist critique, using concrete cases to test their intuitions about character traits. They've described six scenarios (A through F) with their intuitive judgments and want principles that align with as many as possible. They're particularly conflicted about case F (the usually kind roommate who was cruel under stress) versus case D (the bystander who showed one-time courage). They've also mentioned "moral topology" (reactive vs. proactive virtues) and want to know if that helps.

  Let me start by reviewing the cases to clarify my own understanding. Maria (A) lied about small things but confessed an affair—integrity. Jake (B) donated for tax breaks and image—not generous. Dr. Lee (C) was patient with patients but abusive to nurses—not truly patient. Bystander (D) rescued a kid once—hidden courage. Student (E) refused to cheat without risk—integrity. Roommate (F) was cruel when stressed—questioning kindness.

  The challenge is to find principles that capture these nuances. Situationism argues that behavior is largely influenced by situations, not stable traits, but the user's intuitions suggest a mix: some actions reveal true character, others don't. I need principles that account for why one-time acts can be virtuous (like D) but habitual ones might not (like B and C), and why stress might override kindness in F.

  First, consider the "Reasons Responsiveness Principle." This focuses on why someone acts. If actions align with deep values despite costs (like Maria's confession or the student not cheating), it shows virtue. But if driven by external rewards (Jake's donations) or professional pressure (Dr. Lee's patience), it's not genuine. For the bystander (D), the spontaneous rescue could respond to an immediate moral reason, revealing latent courage. For the roommate (F), stress might have overwhelmed his usual reasons for kindness, so it doesn't negate his character—situation overrode trait. This principle saves all cases except maybe C, where Dr. Lee's patience is situational masking, not responsiveness.

  Now, the "Consistency Under Challenge Principle." Virtue requires acting rightly when it's hard. Maria and the student (A and E) faced personal risks, showing integrity. The bystander (D) faced physical danger, revealing courage. But Jake (B) and Dr. Lee (C) didn't face challenges that tested generosity or patience in a deep way—their actions were easy or self-serving. The roommate (F) failed under stress, so he lacks true kindness. This handles A, D, E well, but fails on F because the user is unsure if one failure disproves kindness, and it might not capture why Jake isn't generous despite consistency.

  Moral topology: reactive virtues (like courage in emergencies) are spontaneous and emotional, while proactive ones (like patience) require sustained effort. This distinction helps explain why a one-time reactive act (D) can reveal virtue without consistency, but proactive virtues like patience (C) or generosity (B) need more patterns. It reconciles D and F: reactive kindness might not apply to F, which is proactive, so the roommate's cruelty under stress doesn't contradict his usual kindness if it's a different "shape." But for F, if kindness is proactive, stress undermining it might still indicate a lack of virtue.

  Combining principles might work best: use reasons responsiveness for motivation and moral topology for context. For F, if the roommate's cruelty was a reactive failure under duress, it might not define his character, especially if he's consistently kind proactively. That aligns with the user's hesitation.

  In JSON, I'll outline both principles with their strengths and weaknesses. The reasons responsiveness principle saves all cases except possibly C, but with moral topology, it can handle C by noting that Dr. Lee's patience is proactive but not responsive to moral reasons. For F, it says the roommate is still kind overall, as stress overrode his reasons. Moral topology helps reconcile D and F by distinguishing reactive courage from proactive kindness.
answer: |-
  Based on your cases and intuitions, the strongest principle reconciling most verdicts while respecting the tension between D (one-time courage) and F (situational cruelty) leverages **motivational depth and context**. Here's the analysis and two candidate principles:

  **Core Principle: The Reasons-Responsiveness Principle**
  *   **Core Claim:** A behavior manifests a genuine virtue *only if* it is responsive to the *moral reasons* inherent in the situation (e.g., honesty for truth, courage to protect, kindness to alleviate suffering), reflecting a relatively stable disposition to recognize and act on those reasons, especially when countervailing pressures exist.
  *   **Saves Cases:**
      *   **A (Maria):** Confessing the affair was responsive to the profound moral reason for honesty (trust, integrity) despite huge personal cost (relationship destruction). Small lies aren't responsive to deep moral reasons.
      *   **B (Jake):** Donations are responsive to non-moral reasons (tax breaks, reputation), not the moral reason for generosity (alleviating need/expressing care).
      *   **C (Dr. Lee):** Patience with patients is responsive to *professional* reasons (duty, protocol, avoiding sanctions), not the *moral* reason of patience (respect for persons, managing frustration humanely). Abusiveness reveals the lack of moral responsiveness.
      *   **D (Bystander):** The rescue *was* responsive to the urgent moral reason (saving a life) present *in that extreme situation*, revealing a latent capacity/disposition for recognizing and acting on that specific moral demand when overwhelmingly clear.
      *   **E (Student):** Refusing to cheat is responsive to the moral reason for integrity (fairness, honesty) despite strong situational pressure (everyone cheating, no risk).
      *   **F (Roommate):** Cruelty to the waiter *wasn't* responsive to the moral reason for kindness (respect, avoiding harm) due to being overridden by exhaustion/stress. Usual kindness *is* responsive to moral reasons, suggesting a stable(ish) disposition *impaired* in this context.
  *   **Fails On:** None directly. It captures the core intuition in all cases.
  *   **Roommate F Verdict:** Your roommate *is* genuinely kind (in normal contexts), but his kindness disposition is *fragile* and can be overridden by severe exhaustion/stress, preventing him from responding to moral reasons in that state. It doesn't prove he lacks kindness entirely, but shows a vulnerability.
  *   **Moral Topology Note:** **Crucially Helps.** Distinguishing reactive (D) and proactive (C, F-kindness) virtues resolves the D/F tension:
      *   **Reactive Virtues (Courage, Rescue):** Respond to sudden, clear, high-stakes moral demands. A *single* act of responsiveness under extreme pressure *can* reveal the disposition because the demand is unambiguous and overwhelming. Consistency is less required for diagnosis (D works).
      *   **Proactive Virtives (Patience, Kindness, Generosity):** Require sustained responsiveness to often lower-intensity, ongoing moral demands across diverse contexts. Consistency *is* more critical. One-off failures (F - cruelty) or context-limited "successes" (C - patience only with patients) strongly suggest the disposition is absent or significantly impaired, not just revealed once.

  **Alternative Principle: The Consistency-Under-Challenge Principle**
  *   **Core Claim:** A genuine virtue requires consistent enactment of the trait *specifically when doing so is non-trivial or involves overcoming countervailing pressures* (cost, temptation, difficulty, stress).
  *   **Saves Cases:**
      *   **A (Maria):** Confession occurred under high pressure/cost, demonstrating consistency of integrity *when challenged*.
      *   **D (Bystander):** Rescue occurred under extreme pressure/danger, demonstrating courage *when challenged* (even if only once).
      *   **E (Student):** Refusing to cheat occurred under peer pressure/temptation, demonstrating integrity *when challenged*.
      *   **B (Jake):** Donating is easy (no cost, gains benefits), failing the "challenge" test for true generosity.
      *   **C (Dr. Lee):** Patience with patients is part of the professional role (low challenge in that context? or masking effort?), but abusive behavior reveals failure *under the different challenge* of equal-status interactions/hidden frustration. Fails consistency-under-relevant-challenges.
  *   **Fails On:**
      *   **F (Roommate):** This principle struggles. Usual kindness might occur in low-challenge contexts. Cruelty occurred *under challenge* (stress/exhaustion). This suggests he *lacks* true kindness, as he failed when challenged. This contradicts your intuition that he *is* usually kind. It cannot easily reconcile D (one-time challenge passed) with F (one-time challenge failed) without additional nuance like topology.
  *   **Roommate F Verdict:** The principle suggests your roommate is **not genuinely kind**, as he failed the test when kindness was challenging (under stress).
  *   **Moral Topology Note:** **Helps Less Directly.** While reactive virtues might be diagnosable by a single challenge-pass (D), proactive virtues require consistency across *multiple* challenges (which F fails). It acknowledges the difference but doesn't fully resolve why D counts and F's failure might not be definitive *against* a proactive trait.

  **Conclusion:** The **Reasons-Responsiveness Principle**, especially when combined with the **Reactive vs. Proactive Virtue distinction (Moral Topology)**, best captures your intuitions across all cases. It explains:
  1.  Why Maria's confession (A) and the student's refusal (E) show integrity (responsive to moral reasons under pressure).
  2.  Why Jake (B) isn't generous and Dr. Lee (C) isn't patient (not responsive to moral reasons).
  3.  Why the bystander (D) revealed courage (responsive to an overwhelming, sudden moral reason).
  4.  Why your roommate (F) is usually kind (responsive to moral reasons) but was cruel under stress (his responsiveness was *impaired* by the situation, not absent).
  5.  How D (reactive) and F (proactive) can coexist: A single act can reveal a reactive disposition, while a single failure doesn't necessarily destroy evidence of a proactive disposition, especially if the failure context severely impairs the capacity for responsiveness.

