answer: |-
  **Stalemate:** Alva claims neural isomorphisms produce cross-modal judgments without causal qualia, while Bex argues this severs the epistemic link needed to affirm qualia exist at all.

  **Alva:** Consider judging auditory loudness and visual brightness share "intensity." This judgment arises purely because specific neural patterns—coding auditory gain and visual luminance contrast—exhibit analogous activation profiles in the prefrontal cortex. The brain detects this structural similarity, generating the report. The phenomenal *feels* of loudness and brightness, while correlated, play no causal role. The judgment is about structural properties tracked neurally, not about causing qualia.

  **Bex:** But if the causal chain *never* involves the actual phenomenal properties, only the neural correlates, how can you know your judgment is *about* qualia rather than *just* about those neural structures? On your account, a zombie—lacking qualia but with identical neural states—would make the *identical* "intensity" judgment. Your report isn't actually grounded in or responsive to qualia; it’s only about brain states. This collapses your position: you claim qualia exist but are inert, yet your own account denies you any causal or epistemic access to them to make *that* claim.

  **Alva:** Knowledge-by-acquaintance! I *have* the qualia. When I judge "this loudness and brightness share intensity," I am directly acquainted with the phenomenal properties. The judgment's *content* refers to them, even if the *causal production* of the judgment stems solely from neural isomorphisms detecting structural analogies. Acquaintance provides the reference, the neural mechanism provides the report.

  **Bex:** But your physicalism about judgment formation *undermines* that distinction. If the judgment’s content—its meaning, its reference—is *entirely* determined by the physical causal history (neural isomorphisms, concept activation), and qualia play no causal role in shaping that content, then your "acquaintance" is causally irrelevant. The judgment's content is fixed by brain states alone, referring only to what *causally shaped it*: neural structures. Your "knowledge-by-acquaintance" becomes an epiphenomenal post-hoc story tacked onto judgments causally blind to qualia. How can acquaintance ground reference if it doesn't causally influence the concepts formed?

  **Alva:** ...Because the neural state *includes* the representation *of* the quale, acquired via the lawful correlation! Acquaintance *is* the representation.

  **Bex:** But if qualia don't causally constrain the representation's *formation* or *use* in judgment, only the physical substrate does, then the representation's content is fixed physically, independent of the quale's presence. The zombie's "representation" is identical, yet refers to nothing. Your claim that *your* representation refers to qualia relies on a causal connection your own theory denies. The paradox stands.
