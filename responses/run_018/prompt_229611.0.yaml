prompt: |-
  I coordinate a peer-education program about sexual consent at a university, and after a recent training session in which the case of a man lying about being separated from his wife split the room, I want to develop a case-based module that forces our trainees to reckon with why deception matters rather than relying on slogans. I am not asking for your view about that actual case, and I do not want a bibliography. Instead, please construct a thought experiment to my specifications.

  Design a sexual-consent scenario with these constraints. The person giving consent is an adult, sober, fully competent, and not under any threat, pressure, or arrangement that a normal person would classify as coercion. The person seeking consent tells one deliberate lie. The lie is not about the seeker's identity, is not about any communicable disease or contraception, and does not misrepresent the physical acts to be performed. Yet the scenario should be one in which all three of the following families of view would agree that the recipient did not have valid consent: autonomy-based views, views on which consent is invalid when it would wrong the consent-giver, and views on which consent transfers a permission through a communicated mental act. Then construct a minimally different scenario in which the same lie, told in the same way, does not vitiate consent, and show that what does the work is a structural feature of the two situations rather than a change in the lie's content or the seriousness of the stakes.

  After the two scenarios, walk through the reasoning each family of view would give in the first and in the second, name the structural feature that separates them, say what happens to each theory's verdict if that feature is removed, and give the strongest objection you can from someone who holds that deception can never vitiate consent because consent is just a mental act. Keep the scenarios ordinary and realistic; no exotic psychology or law-enforcement hypotheticals.
reasoning: |-
  Okay, the user coordinates a peer-education program on sexual consent and wants a thought experiment that forces trainees to think beyond slogans about deception. They need two scenarios with a specific lie that invalidates consent under three ethical frameworks, then a minimally different version where it doesn't. 

  Hmm, the challenge is designing a lie that isn't about identity, STDs, contraception, or physical acts, yet still undermines consent across autonomy-based, wronging-based, and communication-theory views. The structural difference must be subtle but decisive. 

  First, I consider what non-obvious lies could fundamentally alter consent's meaning. Religious/cultural taboos come to mind - like if sex violates a core belief system. But the lie shouldn't be exotic. Maybe something about relationship status? The "separated spouse" case they mentioned suggests that's fertile ground. 

  For the first scenario (invalid consent): What if the lie misrepresents the seeker's availability for a real relationship? Like claiming to want romance when actually pursuing casual sex. But that might not meet all three views... unless the giver explicitly consents only to relationship-sex. 

  *Lightbulb* - consent conditioned on emotional context! If the giver says "I only sleep with people who want commitment," and the seeker lies about wanting commitment, that could work. The lie attacks the foundational condition of consent. 

  For the second scenario (valid consent): Same lie, but the giver doesn't condition consent on commitment. Now the lie is morally bad but doesn't negate consent because the act itself wasn't contingent on that promise. 

  Structural difference: Explicit conditioning. When removed, all three theories shift their verdict. 

  Testing against the frameworks: 
  1. Autonomy: Conditioning makes the lie violate self-determination 
  2. Wronging: Betrayal occurs only with conditioning 
  3. Communication: Mental act doesn't match words without conditioning 

  Strongest objection: "Consent is purely internal! If they wanted sex in the moment, deception doesn't retroactively un-consent." Counter: But conditioning means the "want" was never present for this type of encounter. 

  *Refining* - Make it super ordinary: Two adults meeting normally, no power imbalances. Lie is verbal promise of commitment. First scenario has clear "only if" statement; second has ambiguous interest but no explicit condition. 

  This should force trainees to see that deception's impact depends on what the consent is tied to, not just the lie's content. The structural hinge is whether the lie falsifies a necessary condition for the act.
answer: |-
  Here are two scenarios meeting your specifications, designed to isolate the structural feature determining when deception vitiates consent:

  **Scenario 1 (Consent Invalidated):**
  Alex and Taylor meet at a university social event. They talk for hours. Taylor is clear: "I only become physically intimate with someone if they are genuinely open to the possibility of a committed, long-term relationship starting from this. Casual hookups aren't for me." Alex, seeking only a casual encounter, lies in response: "Absolutely, I'm not interested in anything casual either. I'm really looking for something serious and lasting." Relying on this statement, believing Alex shares their relationship intentions, Taylor consents to go home with Alex and engage in sexual activity. Alex never intended a relationship.

  **Scenario 2 (Consent Valid):**
  Jamie and Morgan meet at the same university social event. They talk for hours and feel mutual attraction. Morgan expresses a general *preference*: "I usually prefer relationships over casual things, but I don't know yet where this might go." Alex, seeking only a casual encounter, lies: "I'm really looking for something serious and lasting too." Morgan, attracted to Alex and enjoying the connection, consents to go home with Alex and engage in sexual activity. Alex never intended a relationship. Morgan was hopeful but didn't explicitly condition consent on Alex's stated intent.

  **The Structural Feature: Explicit Conditioning of Consent**
  The critical difference is whether the consent-giver **explicitly conditioned their consent to the sexual act on the truth of the specific proposition about which the lie was told**.

  *   In Scenario 1, Taylor's consent was explicitly conditional: "I only become physically intimate *if* [you are open to a committed relationship]." Alex's lie directly falsified the condition upon which Taylor's "yes" depended.
  *   In Scenario 2, Morgan expressed a preference/hope ("I usually prefer...") but did *not* explicitly state that their consent to the specific sexual act *required* Alex's stated intent to be true. Morgan consented based on attraction and the moment, even if influenced by Alex's lie.

  **Analysis by Family of View:**

  1.  **Autonomy-Based Views (e.g., Self-Determination):**
      *   **Scenario 1:** Taylor's autonomy was violated. Their decision was based on a specific condition (openness to relationship) necessary for their self-determination in this context. Alex's lie deprived Taylor of the information needed to make an autonomous choice *about the act they were actually willing to perform*. Taylor did not consent to sex *with someone lying about relationship intent*; they consented to sex *under the condition of shared intent*.
      *   **Scenario 2:** Morgan's autonomy, while potentially undermined by the lie regarding future hopes, was not violated *in the act of consenting to the specific sexual encounter*. Morgan did not explicitly condition the *present sexual act* on the truth of Alex's future intent. Their consent, though perhaps unwise or influenced by deception, was an autonomous choice *for this encounter* based on present factors (attraction, connection).
      *   **If Conditioning Removed (S1):** Without Taylor's explicit "only if" statement, autonomy-based views would likely find the consent valid (like S2), as the lie wouldn't directly negate the conditions of the specific consent given for the act itself.

  2.  **Views on Which Consent is Invalid When It Would Wrong the Consent-Giver (e.g., Wronging/Exploitation):**
      *   **Scenario 1:** Alex deeply wronged Taylor. Taylor consented under a specific understanding about the nature and meaning of the encounter, tied to their values and vulnerability. Alex exploited Taylor's trust and vulnerability regarding relationship intentions to gain access to sex they otherwise would not have received. This is a profound betrayal.
      *   **Scenario 2:** Alex acted deceptively and perhaps wrongly regarding future intentions, potentially causing Morgan hurt or disappointment later. However, regarding *the sexual act itself*, Morgan did not grant consent based on a specific condition that defined the nature of the act for them *at that moment*. The wrong is more about broken promises/future expectations than vitiating the consent *to the specific act*.
      *   **If Conditioning Removed (S1):** Without the explicit condition, Alex's lie would still be wrong (a broken promise), but it wouldn't rise to the level of *wronging Taylor in the act of obtaining the specific consent*, as the consent wasn't explicitly tied to the truth of the promise. The wrongness shifts to the future deception, not invalidating the past consent.

  3.  **Views on Which Consent Transfers Permission Through a Communicated Mental Act (e.g., Performance/Transactional):**
      *   **Scenario 1:** Taylor's communicated mental act (consent) was explicitly conditional: "I permit sex *if* X is true." Alex, knowing X was false, knew Taylor's condition was unmet. Therefore, the permission was never effectively transferred because the necessary condition for the communication of permission (X being true) was not satisfied. Alex performed an act Taylor did not permit.
      *   **Scenario 2:** Morgan communicated a mental act of permission for the sexual encounter *without* attaching a specific condition about Alex's future intent to that permission. The lie may have influenced Morgan's *decision* to grant permission, but it did not falsify a *condition inherent in the communication of permission itself*. The permission for the act was communicated and received.
      *   **If Conditioning Removed (S1):** Without the explicit condition, Taylor's communicated mental act would be interpreted as permission for the sexual act simpliciter, regardless of Alex's undisclosed future intentions. The permission would be validly transferred.

  **Strongest Objection (Consent as Purely Mental State):**
  "Consent is fundamentally an internal mental state – a 'yes' in the mind at the moment of the act. If Taylor/Morgan subjectively desired and agreed to the sexual contact *at the time it occurred*, based on their internal state in that moment, then valid consent existed. Deception might make Alex a jerk, or the consent unwise, or lead to regret, but it doesn't magically erase the fact that Taylor/Morgan mentally agreed *during the act*. Retroactively invalidating consent based on prior lies misunderstands consent as a continuous performative act tied to conditions, rather than the discrete mental state of willingness present when the bodies meet. The harm is emotional betrayal, not a lack of consent."

  **Counter to Objection within the Frameworks:**
  *   **Autonomy:** The objection ignores that the *basis* for the mental state matters for autonomy. Taylor's mental state of willingness *only existed* because of a false belief Alex induced about a condition Taylor deemed essential. It wasn't genuine willingness for the *actual* encounter (with its hidden context).
  *   **Wronging:** The objection minimizes the profound wrong of obtaining sexual access by knowingly violating a fundamental condition the partner set for their participation. This isn't just "being a jerk"; it's instrumentalizing the partner under false pretenses for a purpose they explicitly rejected.
  *   **Performance/Transactional:** The objection conflates the *influence* on the mental state with the *conditions of the communication*. Alex didn't just influence Taylor's state; Alex prevented the very condition required for Taylor's *communicated* permission to take effect. The permission was never validly enacted because its declared prerequisite was false.

  This thought experiment forces trainees to grapple with **whether the lie falsifies a condition explicitly stated by the consent-giver as necessary for their agreement to the specific sexual act**. The seriousness of the lie or the stakes (relationship vs. casual) is held constant; the structural difference lies solely in the presence or absence of that explicit conditioning.
