answer: |-
  Your reflections reveal a profound tension in how integrity manifests across different contexts, and I believe a coherent principle can indeed capture most—though not all—of your intuitive verdicts. The core distinction between personal ground projects and stewardship roles is crucial, but integrity’s demands depend further on whether the situation implicates *constitutive commitments*—those defining the agent’s identity or role—and whether deliberation *subverts the very value* the commitment embodies. 

  The principle might be stated thus: **Integrity is displayed when an agent’s response flows directly from commitments constitutive of their identity or role, without deliberation that would undermine the core values those commitments express. Deliberation preserves integrity only when it aligns with, rather than displaces, these constitutive values.** 

  Consider your cases. The husband saving his wife acts from a constitutive personal commitment; weighing her value against a stranger’s would corrupt the marital bond’s essence—unconditional priority. His refusal to deliberate is thus integral. Conversely, the physician’s refusal to euthanize based on personal incapacity (e.g., "I cannot kill") reflects integrity only if her medical role constitutively prohibits killing *for her*; if her oath or conscience forbids it categorically, deliberation *would* introduce a corrupting contingency. However, if her role *permits* euthanasia under certain conditions, a refusal without weighing autonomy and harm might reflect personal squeamishness, not professional integrity. Your verdict assumes the former, where deliberation corrupts by questioning a core prohibition. 

  The donor’s case fits cleanly: philanthropy lacks constitutive ties to specific charities. Effectiveness calculations align with the commitment’s spirit (doing good), so deliberation is virtuous, not corrupting. Similarly, the soldier disobeying after legal deliberation acts correctly *as a soldier*—military stewardship includes fidelity to laws of war, so reasoning about legality embodies role-constitutive norms. Yet your intuition that refusal feels more integral when visceral reveals a nuance: integrity intensifies when constitutive commitments are so deeply internalized that they generate visceral revulsion (e.g., "killing civilians is unthinkable"). Deliberation here doesn’t corrupt but may dilute the *expression* of full internalization. 

  The parental lie is corrupting because parental love constitutively includes truth as a foundation of trust; weighing truth against comfort treats truth as negotiable, corroding that core value. Yet your aunt/sweater case challenges this: the white lie seems benign even with deliberation. Here, the commitment to honesty is not constitutive of your identity or role as a niece/nephew in the same existential way. The stakes are low, and familial kindness doesn’t hinge on absolute candor. The "one thought too many" problem arises only when deliberation violates a *sacred* commitment. 

  Stewardship roles resolve best under this principle. The trustee must internalize the estate’s norms as binding, not personal preferences. Mechanical obedience fails by not grasping the norms’ spirit; deviating for utility fails by substituting external calculation for entrusted duty. Integrity requires the steward to *become* a vessel for the norms, acting from their internalized authority. Deliberation is integral only if it interprets the norms faithfully, not if it overrides them. 

  Your historian test case: She publishes evidence of her ancestor’s atrocity because she "cannot do otherwise." This displays high integrity if historical truth is a constitutive commitment of her role. Deliberating societal utility would corrupt this, making truth contingent. Her inability to suppress it signifies full internalization of the steward’s duty to truth. 

  The exception is your aunt/sweater judgment. My principle struggles to explain why deliberation here feels unproblematic. If integrity requires unmediated adherence to constitutive commitments, even trivial lies after weighing *should* feel mildly corrupting—yet they don’t. Perhaps your intuition hints that low-stakes social norms permit flexible reasoning without identity corrosion, or that "kindness" in casual contexts isn’t a sacred value. I cannot fully reconcile this with your other verdicts without abandoning the sweater case or weakening the principle. If forced, I would suggest that the sweater’s triviality renders the commitment non-constitutive, placing it outside integrity’s demanding domain—but this risks ad hoc maneuvering. 

  Thus, a unified principle explains most cases: Integrity rejects deliberation that subverts the inviolable core of a constitutive commitment (spousal love, medical prohibition, parental honesty) but permits or requires deliberation that honors such commitments (charitable effectiveness, military law, historical truth). The aunt/sweater case remains a puzzle, implying that mere social niceties—unlike ground projects or stewardship—tolerate calculative reasoning without integrity-loss. If you hold all your judgments, this outlier may demand a concession: either trivial interactions lack the gravity for "corruption," or your intuition there is an anomaly. The principle stands robustly otherwise, preserving the chilling horror of the husband’s deliberation, the noble immediacy of the historian’s truth-telling, and the steward’s faithful embodiment of entrusted duty.
