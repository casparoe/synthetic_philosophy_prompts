answer: |-
  Let's dissect this conceptual knot. Your core question—whether instrumental voting can truly "bracket" endorsement, especially under serious moral constraints—cuts to the heart of democratic agency and moral complicity. Here's the breakdown:

  **1. The "Selection vs. Endorsement" Distinction Under Pressure:**
     * **The Ideal Separation:** Instrumental voting posits that a ballot is a causal tool to *select* the best available outcome, not a statement of *endorsement* for the chosen candidate's entire platform. You "use" the candidate as a means to prevent a worse outcome.
     * **Why It Buckles Under Moral Extremity:**
       * **The Public Meaning of Voting:** Voting occurs within a shared social practice. Casting a ballot *for* a candidate, regardless of private intent, is conventionally interpreted as support *for that candidate*. When the candidate embodies serious moral violations (e.g., racism, authoritarianism, dismantling democratic norms), voting for them *appears as* legitimizing those violations within the public sphere. Your vote contributes to their mandate.
       * **The Problem of "Enablement":** Even if your intent is purely harm-reduction, your vote *enables* the candidate to gain power and implement *all* their policies. Instrumental logic says you enable *less* harm. However, enabling *any* violation of a fundamental moral constraint (e.g., torture, ethnic persecution) can feel like complicity, especially if the "lesser evil" still crosses a critical threshold. You become part of the causal chain delivering that candidate to power.
       * **The Impossibility of Perfect Bracketing:** Can you mentally "bracket" the candidate's support for Policy X (a grave evil) while voting for them to prevent Policy Y (a slightly graver evil)? Psychologically and politically, this is fragile. The candidate is a unified agent; your vote empowers *the whole package*. Instrumental intent doesn't erase the objective consequence: helping a morally tainted agent attain power.

  **2. Complicity Thresholds: The Core Conceptual Issue:**
     * **The Threshold Question:** This is crucial. Not all "lesser evil" votes generate equal complicity concerns. The issue arises when *both* candidates violate what you (or a plausible moral theory) consider **fundamental moral constraints** (FMCs). These are lines that shouldn't be crossed, period (e.g., basic human rights violations, core democratic subversion).
     * **Defining the Threshold:** The "complicity threshold" is the point where enabling a candidate, *even instrumentally*, becomes morally problematic *because* they violate an FMC. Crossing this threshold means:
       * Your vote contributes to the realization of intrinsically wrong acts/policies.
       * The "lesser evil" defense weakens because you are still facilitating evil above the threshold.
       * The distinction between "enabling harm" and "endorsing harm" blurs significantly in the public/political realm.
     * **Factors Influencing the Threshold:**
       * **Severity of the Violation:** Is it a core right violation or a less fundamental policy disagreement?
       * **Likelihood & Imminence:** How certain and direct is the harm the candidate will cause?
       * **Alternatives:** Are there viable non-voting actions (protest, organizing) or candidates that avoid the threshold violation?
       * **The "Gap" Between Evils:** How significant is the difference in expected harm? A tiny gap makes instrumental justification much harder.

  **3. The Duty to Vote vs. The Duty to Avoid Complicity:**
     * **The Conflict:** Yes, these duties *can* conflict sharply in "lesser evil" scenarios involving FMC violations.
       * **Duty to Participate:** Often grounded in fairness, civic virtue, or maintaining democratic legitimacy. Abstaining might be seen as free-riding or surrendering the field to worse actors.
       * **Duty to Avoid Complicity:** Grounded in moral integrity and the imperative not to facilitate grave wrongdoing. Voting for a candidate who crosses a complicity threshold violates this duty.
     * **Resolution?** There's no easy formula, but the conflict forces prioritization:
       * **Threshold Primacy:** If a candidate crosses the complicity threshold (violates an FMC), the duty to avoid complicity *trumps* the general duty to vote. Enabling fundamental evil cannot be a civic duty. Abstention or protest voting becomes the morally required (or at least permissible) act to preserve integrity, even if it risks the greater evil winning.
       * **Duty Reinterpretation:** The "duty to vote" might be reinterpreted as a *duty to vote responsibly*. Voting for a candidate who violates an FMC could be seen as an *irresponsible* vote, failing the true civic duty.
       * **The Burden of Proof:** The instrumental voter shoulders the burden of proving that the *prevented harm* (by keeping the greater evil out) is so overwhelmingly catastrophic that it *justifies* enabling the lesser-but-still-fundamental evil. This is a very high bar.

  **4. Principle for Justification vs. Rationalized Complicity:**
     Establishing a stable principle is challenging, but here's a framework incorporating the thresholds:

  > **The Lesser-Evil Vote is Morally Justified ONLY IF:**
  > 1.  **The "Evil Gap" is Significant & Concrete:** The harm prevented by voting for Candidate A (lesser evil) is *substantially and demonstrably greater* than the harm Candidate B (greater evil) would cause. Vague fears aren't enough.
  > 2.  **The Lesser Evil Does NOT Cross a Fundamental Moral Constraint (FMC) Threshold:** Candidate A's platform/promised actions do not violate core, non-negotiable moral principles (e.g., basic rights, democratic essentials). *OR*, if they *do* cross an FMC threshold:
  > 3.  **The Prevented Harm is Catastrophic & Certain:** Candidate B crossing the FMC threshold would cause harm so overwhelmingly severe and likely (e.g., genocide, total democratic collapse) that enabling Candidate A's lesser FMC violation becomes the tragically necessary choice to avert absolute disaster. (This is the "Sophie's Choice" exception).
  > 4.  **No Non-Complicit Alternative Exists:** There is no viable way to prevent the greater evil without voting for the lesser evil (e.g., a strong third party, mass abstention as protest, other forms of resistance are demonstrably ineffective in this specific context).

  **Rationalized Complicity occurs when:**
  * The voter invokes the "lesser evil" label but fails conditions 1 or 2 (the gap is small, or the lesser evil still crosses a clear FMC threshold without catastrophic justification).
  * The voter underestimates the enabling effect and public meaning of their vote.
  * The voter prioritizes partisan loyalty or lesser policy preferences over the violation of fundamental constraints.
  * The voter hasn't seriously engaged with non-complicit alternatives (e.g., protest voting, organizing outside the electoral system).

  **In essence:** The lesser-evil vote is conceptually *possible* as instrumental selection, but its moral permissibility hinges entirely on the *absence of fundamental moral constraint violations* by the "lesser" candidate, or the presence of a truly catastrophic alternative that forces an unbearable choice. When FMCs are violated by the lesser evil, the vote almost inevitably involves a degree of complicity, and the justification requires meeting an exceptionally high burden of proof regarding the prevented harm. The duty to vote does not compel complicity in fundamental evil.
