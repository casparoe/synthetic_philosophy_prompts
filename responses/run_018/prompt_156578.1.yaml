  First, I need to map the architecture of their argument: hyperbolic discounting creates a spike in preference for immediate rewards, making future selves untrustworthy. Akrasia becomes equilibrium rather than failure. The user wants counterarguments graded by severity and insight into defensibility.

  Hmm, the user's framing suggests they've deeply engaged with behavioral economics and philosophy of mind. Their language ("shadow-contract problem", "stable equilibrium") signals comfort with game theory. They're likely an academic or advanced autodidact probing for weaknesses in their own model.

  For fatal objections: If neurobiology shows no discrete "self" boundaries, the agent-model collapses. That's potentially lethal to the theory. Temporal discounting research finding logarithmic rather than hyperbolic patterns would also undermine foundations. 

  For awkward gaps: The theory struggles with cases where akrasia vanishes under identical conditions (e.g., vivid future visualization). And it feels phenomenologically off - when we procrastinate, do we really feel like strategists rather than failed controllers?

  Biggest challenge might be unfalsifiability. If every "irrational" act gets relabeled as strategically rational, the theory explains everything and nothing. Defenders would call this category error - their model describes structural traps, not post-hoc justifications.

  The user seems to want intellectual sparring, not just answers. They'd appreciate conceding that while the framework is clever, it risks becoming a "just-so story" unless anchored to testable predictions about when akrasia should/shouldn't occur. 

  Notably, they dismiss citations - this is about conceptual cartography, not scholarship. My response should mirror that: crisp objections mapped to theoretical pressure points, with meta-commentary on the model's resilience.
answer: |-
  Here's the exposure map for your hyperbolic discounting/strategic selves model of akrasia, ranked by severity of objection and annotated with defender responses:

  **Fatal Defeaters (Threaten Core Mechanism):**
  1.  **Neurobiological Unity of Self:** Evidence showing neural continuity (e.g., default mode network activity, autobiographical memory circuits) actively binding past-present-future self-representation *during* decision-making. If the brain doesn't functionally treat future selves as "distinct strategic agents" in the required way, the core analogy collapses. *Defender Concession:* Damaging if proven; requires showing this unity *specifically disrupts* the strategic calculus implied by hyperbolic discounting, not just exists.
  2.  **Non-Hyperbolic Discounting Dominance:** Robust empirical findings that aggregate temporal discounting across populations and contexts is better described by *constant discounting* (exponential) or *sub-additive* models in precisely the domains where akrasia is common (health, finances). If the "spike" near zero isn't the universal or primary driver, the strategic stalemate loses its foundation. *Defender Concession:* Fatal if hyperbolic discounting is shown to be a minor artifact, not the central feature of intertemporal conflict.
  3.  **Commitment Device Efficacy Despite Stalemate:** Evidence that externally enforced commitment devices (e.g., irrevocable deadlines, binding contracts, medication) *do* successfully overcome akrasia *even when* the present self initially predicts failure. This directly contradicts the "correct prediction" of inevitable defection. *Defender Concession:* Highly damaging; suggests the stalemate isn't stable or that the "correct prediction" is often incorrect.

  **Serious Awkwardness (Challenging Key Implications):**
  4.  **Phenomenological Mismatch:** Introspective reports rarely describe akrasia as a calculated refusal to sign a doomed contract ("I rationally foresaw my future self would renege"). It feels like visceral craving, overwhelming impulse, or paralyzing indecision – a *failure* of rational calculation, not its outcome. *Defender Response:* Category error? The model describes a structural/strategic reality, not necessarily conscious phenomenology. Subconscious processes can implement the calculus. *Awkwardness:* Makes the model feel alien to lived experience.
  5.  **Akrasia Without Apparent Intertemporal Conflict:** Instances of acting against one's better judgment where the costs are *immediate* (e.g., hitting snooze knowing you'll *immediately* feel rushed and guilty, not just late later). The "future self" defection dynamic is absent. *Defender Response:* Stretching the model? Perhaps the "immediate costs" self is defecting against the "seconds-later relief-from-guilt" self? *Awkwardness:* Feels forced; weakens parsimony.
  6.  **Successful Long-Term Planning Despite Discounting:** Widespread existence of individuals consistently saving, exercising, studying, etc., *without* relying on external commitment devices. Their "present selves" seem able to reliably bind "future selves." *Defender Response:* These individuals may have flatter discount curves, better internal meta-cognition/self-trust, or implicit internal commitment strategies the model doesn't forbid. *Awkwardness:* Undermines the claim that stalemate is the *stable* default rational state.

  **Conceptual Tensions & Unfalsifiability:**
  7.  **Collapse into Trivial Rationality:** If *any* choice made by the present self, given its preferences (distorted by hyperbolic discounting), is deemed "rational" refusal to sign a bad contract, then akrasia *by definition* disappears. Every action becomes rational *ex ante* for that temporal agent. *Defender Response:* Exactly the point! The model redefines akrasia *as* this intertemporal strategic failure, dissolving the traditional paradox. *Tension:* This risks making the theory unfalsifiable – any behavior can be post-hoc explained as the present self's rational choice given its discounting and distrust. Is this insightful or empty?
  8.  **Equilibrium Stability Questioned:** Formal models (e.g., using game theory with hyperbolic discounters) can show the "equilibrium" is fragile. Small changes in self-perception, belief updating about future self-control, or the introduction of even weak commitment options (e.g., simple reminders) can destabilize the stalemate. *Defender Response:* Concedes the equilibrium isn't absolute but argues it's the *baseline state* from which deviations occur due to specific factors. *Tension:* Weakens the claim that stalemate is the fundamental, stable rational outcome.
  9.  **Moral Responsibility Blurring:** If akrasia is strategic rationality, not a failure, does this undermine concepts of blame, responsibility, and the need for character development? *Defender Response:* Category error? The model describes *why* the failure occurs mechanistically; normative judgments about responsibility operate on a different level. *Tension:* Creates friction with common intuitions and practices surrounding self-blame and improvement efforts.

  **Defender Firewall (Category Errors They'd Dismiss):**
  *   **"But it feels like a loss of control!"** -> Dismissed: The model explains *why* that feeling arises from a deeper structural conflict, not contradicting the feeling.
  *   **"People regret akrasia afterwards!"** -> Dismissed: Regret is the *future self* (with different discounting) judging the *past self's* rational choice. Predictable consequence.
  *   **"This justifies procrastination!"** -> Dismissed: Is/ought error. Describing a mechanism isn't endorsement.
  *   **"The 'self' isn't literally multiple agents!"** -> Dismissed: Conceded; it's a *strategic analogy* for conflicting temporal motivations within a single agent, justified by hyperbolic discounting.

  **Honest Take on Unfalsifiability & Its Status:**
  The model **skates dangerously close to unfalsifiability**, primarily via objection (7). By redefining akrasia *as* the rational outcome of hyperbolic discounting and distrust, it can potentially explain any instance of self-control failure as ex-post rational for the present self. **This is a significant problem.** Defenders mitigate this by:
  *   Focusing on *specific, testable predictions* about when commitment devices should/shouldn't be adopted or trusted.
  *   Linking to *neural correlates* of hyperbolic discounting and temporal self-appraisal.
  *   Arguing the model's value is in reframing the *problem* (intertemporal conflict) rather than just labeling the *symptom* (weakness).

  **Is unfalsifiability fatal?** Not necessarily *yet*, but it's a major vulnerability. The model's strength lies in its coherence and explanatory power for a core paradox. Its survival depends on generating novel, non-trivial predictions about behavior (e.g., under what precise discount curve shapes or self-trust levels commitment becomes rational) and integrating with cognitive science beyond simple discounting models. If it can't do this and remains solely a post-hoc rationalization framework, it becomes significantly less compelling. Defenders would concede this as a crucial challenge but argue it's not yet disqualifying.
