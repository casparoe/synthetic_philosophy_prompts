prompt: |-
  I have been trying to work out a coherent account of what distinguishes genuinely joint action from merely coordinated individual behavior, and I keep running into concrete cases where my intuitions seem to pull in opposite directions. Here are my verdicts. Two friends who agree to move a piano together, each knowing the other's plan and adjusting their grip in real time, are clearly acting jointly. A crowd of strangers who each independently call emergency services after seeing a car accident are not acting jointly, even though their actions are causally interdependent. But then consider a spontaneous human chain formed by strangers to pull a drowning swimmer ashore: there is no prior agreement, minimal mutual awareness of personal identities, and no shared institutional framework, yet I want to say this is joint action in a thin but real sense, because each participant treats the others as partners in a shared rescue rather than as mere environmental tools. By contrast, a multinational research consortium in which hundreds of scientists contribute data to a shared protocol they all signed, but where most do not understand the theoretical framework and have never communicated with one another, feels like mere coordination, not joint action, despite the explicit institutional agreement and the causal interdependence of their contributions. Another hard pair: two cooks preparing a meal together, but one secretly believes they are only rehearsing for a solo competition while the other believes they are hosting a dinner party for guests; they physically coordinate their movements in the kitchen, yet I judge this not joint action. Meanwhile, a corporate board with rotating membership votes on a strategic merger; the current members lack full access to the strategic reasoning of the executives who drafted the proposal, and some members joined after the deliberation began, yet I am inclined to say the corporation itself acts jointly, even if the individual board members do not fully share a we-intention.

  I am tempted to propose that joint action requires three conditions: mutual responsiveness in execution, a shared representation of the goal that is at least minimally accessible to all participants, and that each participant regards the others as co-authors rather than instruments. But this framework seems to exclude the spontaneous rescue chain, which I want to keep, while including the research consortium, which I want to exclude, and it is unclear how it handles the rotating board or the deceived cooks. Can you state the best principle, or small family of competing principles, that accommodates the largest coherent subset of these judgments? For each principle, specify which clause is motivated by which case, what it predicts about further situations—such as a flash mob that self-organizes via a single social media post, or a surgical team in which the lead surgeon has been replaced mid-operation—and give an honest statement of which of my verdicts it cannot accommodate. In particular, I want to know whether the cost of saving the rescue-chain verdict is abandoning the board-rotation verdict, or whether a more complex disjunction is unavoidable, and what that tells us about whether collective intentionality is a unified phenomenon or a family of distinct relations.
reasoning: |-
  Hmm, this is a fascinating philosophical puzzle about joint action. The user presents several nuanced cases where intuitions about what counts as genuine joint action seem to conflict, and they're struggling to find a coherent principle that captures all their judgments. 

  The user clearly has sophisticated understanding of collective intentionality literature, likely familiar with theorists like Bratman, Gilbert, Searle, and Tuomela. Their cases systematically probe different dimensions: spontaneity vs planning (rescue chain vs piano moving), deception (cooks), institutional scale (research consortium), and diachronic identity (rotating board). 

  What makes this tricky is that standard theories seem to fail particular cases: Bratman's shared intentions exclude the rescue chain, Gilbert's joint commitments exclude the deceived cooks, Searle's we-intentions struggle with the research consortium. The user's own three-condition proposal (mutual responsiveness, shared goal representation, co-author attitude) is admirably precise but as they note, it includes cases they want to exclude and vice versa.

  I notice the user particularly values the rescue chain case - they call it "thin but real" joint action. That's the emotional center of the problem. Meanwhile, they're skeptical about the research consortium despite formal agreements. This suggests their intuition prioritizes phenomenology over institutional structure. 

  The rotating board case reveals another tension: they want to say the corporation acts jointly while individual members may not share we-intentions. This points toward institutional agency as distinct from interpersonal joint action. 

  Perhaps the solution requires distinguishing types of joint action rather than seeking a single definition. The rescue chain shows minimal joint action through mutual recognition, while the piano case shows robust shared agency. The research consortium might be "aggregate" rather than "joint" action. The rotating board could be handled by distinguishing individual intentions from organizational intentions. 

  For the deceived cooks - clearly not joint action because one party lacks the shared goal representation. The flash mob might count if participants recognize each other as co-participants, while the surgeon replacement case would hinge on whether the team maintains a shared operative frame across personnel changes. 

  The cost of saving the rescue chain might indeed be sacrificing a unified account, but that's philosophically valuable too - it shows collective intentionality isn't monolithic. I'll structure the response around competing principles, being transparent about which intuitions each preserves and sacrifices.
answer: |-
  Based on your nuanced cases and intuitive judgments, I propose a framework centered on **mutual recognition of co-agency** as the core differentiator. Here are the best-fitting principles, motivated by your verdicts, with their scope and limitations:

  ---

  ### **Principle 1: Mutual Recognition of Co-Agency (MRCA)**
  **Joint action occurs when:**
  1. **Participants are mutually responsive** *and*  
  2. **Each recognizes others as intentional co-participants** (not tools/environment) *and*  
  3. **Each attributes a shared goal-state to the group** (even if minimally defined).

  #### **Motivation by Your Cases:**
  - **Piano Movers (✓)**: Explicit mutual recognition (condition 2), shared goal (3), responsiveness (1).  
  - **Rescue Chain (✓)**: Strangers recognize each other as *co-rescuers* (2) pursuing a shared outcome (3), adjusting grips (1).  
  - **Deceived Cooks (✗)**: One cook lacks recognition of the other as a co-agent (sees them as a rehearsal tool), violating (2).  
  - **Research Consortium (✗)**: Scientists treat others as environmental data-sources (like weather sensors), not co-authors (2 fails).  
  - **Corporate Board (✓)**: Members recognize each other as *board members* enacting institutional agency (2), share a goal-state (approve merger) (3), vote responsively (1).  

  #### **Predictions for New Cases:**
  - **Flash Mob**:  
    - *If* dancers recognize others as co-performers (e.g., smiling, synchronizing intentionally) → **Joint action**.  
    - *If* they merely follow instructions without mutual regard → **Coordination only**.  
  - **Surgeon Replacement**:  
    - *If* the team recognizes the new surgeon as a co-agent (e.g., briefing them mid-op) → **Joint action persists**.  
    - *If* the replacement is treated as a tool (e.g., given commands without context) → **Coordination only**.  

  #### **Unaccommodated Verdicts & Costs:**  
  - **Saves rescue chain and board rotation** without abandoning either.  
  - **Cost**: Requires accepting that institutional roles (board) can scaffold mutual recognition without interpersonal intimacy.  

  ---

  ### **Principle 2 (Fallback): Disjunctive Account**  
  If MRCA excludes cases you insist are joint (e.g., some large institutions), a disjunctive definition is unavoidable:  
  **Joint action = EITHER**  
  - *(Interpersonal)* **MRCA** (as above) **OR**  
  - *(Institutional)* **Acting within a shared agency role** where:  
    a) Roles are designed for collective outcomes,  
    b) Participants understand their role-bound contribution,  
    c) Outputs are attributed to the collective.  

  #### **Motivation:**  
  - **Research Consortium (✗ under MRCA)**: Still excluded (lacks role-based mutual recognition).  
  - **Corporate Board (✓)**: Fits institutional clause (role-based agency).  
  - **Rescue Chain (✓)**: Fits interpersonal MRCA.  

  #### **Cost of Disjunction:**  
  - **Saves all verdicts** but fragments "joint action" into distinct phenomena.  
  - **Predicts**: The research consortium *could* qualify as joint institutional action if scientists see themselves as fulfilling a *collaborative role* (e.g., "WHO pandemic response team member").  

  ---

  ### **What This Reveals About Collective Intentionality**  
  1. **Not a Unified Phenomenon**: Your cases resist a single criterion. The rescue chain hinges on *emergent mutual recognition*, while the board relies on *institutional role-ascription*.  
  2. **Spectrum of "Thin" to "Thick" Jointness**:  
     - **Thin**: Rescue chain (minimal recognition + shared goal).  
     - **Thick**: Piano movers (rich mutual responsiveness + agreement).  
     - **Role-Mediated**: Corporate board (recognition via institutional identity).  
  3. **Deception as Litmus Test**: If one agent’s participation relies on misunderstanding others’ agency (cooks), joint action collapses—highlighting mutual recognition as necessary.  

  ---

  ### **Summary of Tradeoffs**  
  | **Principle**       | **Rescue Chain** | **Board Rotation** | **Research Consortium** | **Deceived Cooks** |  
  |---------------------|------------------|--------------------|--------------------------|--------------------|  
  | **MRCA (Unified)**  | ✓                | ✓                  | ✗                        | ✗                  |  
  | **Disjunctive**     | ✓                | ✓                  | ✓ (if roles acknowledged)| ✗                  |  

  **Recommendation**: Adopt **MRCA** as the core principle. It captures the phenomenology of "co-authorship" you value in the rescue chain and board, while cleanly excluding the consortium (mere coordination) and cooks (deception). The cost—rejecting the consortium as joint action—aligns with your intuition that formal agreements alone are insufficient without mutual recognition.  

  **Implication**: Collective intentionality is a family of relations unified by *mutual recognition of co-agency*, but its minimal form (rescue chain) and institutional form (board) are distinct species within that family. The rotating board is saved because roles enable recognition of "co-membership" even without shared we-intentions.
