answer: |-
  ### Exam Design: Brainstorming Summary  
  **Conceptual Crux**: The question probes whether ant-colony pheromone systems could instantiate a *minimal functional analogue* of a global workspace (GWT)—a cognitive architecture where specialized modules "broadcast" information to a centralized arena for integrative processing—while confronting the objection that this confuses *collective outcomes* with *constitutive cognition*.  

  **Twist Function**:  
  - Forces students to dissect GWT’s *architectural requirements* (integration, accessibility, modulation) rather than debate emergence/elimination.  
  - The "enzyme-digestion" analogy isolates a hard mereological problem: Can decentralized parts executing fixed routines generate *genuine cognitive properties* at the collective level, or is this a category error?  

  **Likely Misconceptions**:  
  1. Equating colony adaptation with "intentionality" or "awareness" without analyzing functional structure.  
  2. Invoking "emergence" as a *deus ex machina* without specifying integration mechanisms.  
  3. Conflating *collective* intelligence with *distributed* consciousness (e.g., assuming GWT implies phenomenal unity).  
  4. Misapplying the intentional stance holistically while ignoring individual ant behaviors.  

  ---

  ### Exam Question  
  **Time Allowed**: 75 minutes  
  **Word Guideline**: 500–700 words  

  > **Prompt**:  
  > “Evaluate whether an ant colony’s pheromone signaling system could satisfy a *functional* global-workspace condition for cognition, treating pheromone gradients as a broadcast medium analogous to neural workspace broadcasting. Subsequently, address the following objection: Attributing a global workspace to the colony commits a category error comparable to attributing digestion to a single enzyme, since each ant merely executes a fixed algorithm devoid of cognitive flexibility.  
  >   
  > In your response:  
  > (a) Specify *one structural feature* of pheromone dynamics that resembles neural broadcasting and *one* that critically differs;  
  > (b) Explain whether the category-error objection relies on an unjustified assumption about mereology (part-whole relations);  
  > (c) Clarify if the intentional stance can apply to the colony *as a whole* without applying to individual ants;  
  > (d) Conclude by describing *one change* to the colony’s dynamics that would strengthen the workspace analogy.”  

  ---

  ### Model Answer (650 words)  

  The ant colony’s pheromone system superficially resembles a global workspace (GWT) by enabling colony-wide information integration. Pheromone gradients act as a broadcast medium: foraging ants deposit trails proportional to resource quality, "amplifying" salient data (e.g., abundant food) for collective access. This parallels GWT’s core function—*selective broadcasting*—as gradients prioritize adaptive responses (e.g., redirecting workers to richer sites). However, a critical disanalogy exists: neural GWT permits *top-down modulation* (e.g., attention altering signal weighting), whereas pheromone evaporation is purely bottom-up and environmentally determined. Colonies lack mechanisms to *endogenously* recalibrate broadcasting (e.g., suppressing outdated trails during rain).  

  The category-error objection—that crediting the colony with cognition misattributes properties like digestion to an enzyme—presumes *mereological essentialism*: the view that collective properties must reduce rigidly to part-intrinsic features. This is unjustified. Enzymes contribute to digestion but lack functional autonomy; in contrast, ants *collectively generate* adaptive outcomes through iterative signal coupling. While each ant executes fixed routines (e.g., "follow strong gradient"), colony behavior emerges from nonlinear feedback between ants and their shared environment. Unlike enzymes, ants are *adaptive agents* whose local actions *co-constitute* global dynamics. The objection thus conflates *simple aggregation* (enzyme summation) with *systemic self-organization*.  

  Applying the intentional stance to the colony without attributing intentions to individual ants is coherent *if* collective behavior exhibits goal-directed plasticity irreducible to part-level intentions. Colonies dynamically "solve" problems (e.g., finding shortest paths via pheromone accumulation) despite ants lacking path-representations. Dennett’s stance requires predicting behavior via ascriptions like "the colony seeks optimal foraging"—a heuristic validated by evolutionary success. Individual ants need only respond mechanistically to local cues; the *collective pattern* manifests intentionality.  

  Nevertheless, pheromone broadcasting fails as a GWT analogue for consciousness. GWT requires not just integration but *recursive access*: broadcast information must be available for higher-order processing (e.g., memory, planning). Pheromones merely trigger fixed responses; they cannot be "queried" by subsystems. For the workspace analogy to hold, the colony would need *bidirectional modulation*: ants altering gradient interpretation based on global context. Imagine ants that adjust trail-following thresholds during nest relocation—e.g., ignoring food trails when evacuation is urgent. This would mirror neural top-down control, transforming passive signal-relay into genuine information *evaluation*.  

  In sum, pheromones enable functional integration but lack the feedback architecture for GWT-style cognition. The colony’s "intelligence" reflects emergent coordination, not conscious workspace dynamics.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **A-grade answers (17–20)** must include all five core moves below. **B-grade (13–16)** omit/mishandle ≥2 moves.  

  | **Philosophical Move**                                                                 | **Marks** | **Common Mistake**                                                                 |  
  |----------------------------------------------------------------------------------------|-----------|------------------------------------------------------------------------------------|  
  | **1. Distinguishes functional integration from causal coupling**: Explains how pheromones create *bidirectional information flow* (e.g., trail reinforcement) beyond one-way causation. | 4 | Equating any ant interaction with "integration" (e.g., "ants communicate, so it’s integrated"). |  
  | **2. Rejects mereological essentialism**: Argues that the category-error objection assumes parts *rigidly determine* collective properties, ignoring emergent dynamics. | 4 | Claiming colonies are "just ants" without analyzing system-level causality. |  
  | **3. Identifies valid GWT resemblance & disanalogy**: (a) Resemblance: e.g., *amplification* of salient signals; (b) Disanalogy: e.g., absence of *top-down modulation*. | 4 (2+2) | Vague analogies (e.g., "both use chemicals") or listing features without functional contrast. |  
  | **4. Clarifies intentional stance applicability**: States stance applies collectively *iff* colony behavior is predictively systematic *despite* subcognitive parts. | 5 | Applying the stance to individual ants or confusing evolutionary fitness with intentionality. |  
  | **5. Specifies required architectural change**: Proposes a plausible change (e.g., *context-sensitive threshold adjustment* in ants) enabling recursive signal processing. | 3 | Suggesting superficial changes (e.g., "more ants") without functional impact on information access. |  

  **Penalties**:  
  - **−2**: Treating Hofstadter’s literary dialogue as philosophical argumentation.  
  - **−3**: Using "emergence" without specifying mechanisms (e.g., feedback loops).  
  - **−1–2**: Conflating cognition with consciousness or GWT with phenomenality.  

  ---

  This design forces engagement with *functional architecture* while blocking rote recapitulation of seminar debates. The marking scheme rewards precise distinctions between computational structure and mereological prejudice, pushing students beyond dichotomies like "emergentism vs. eliminativism."
