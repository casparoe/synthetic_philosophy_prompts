answer: |-
  ### Examination Question  
  **Subject: Formal Epistemology & Epistemic Game Theory**  
  **Time Allowed: 90 minutes**  
  **Marks: 20**  

  **Essay Question:**  
  Consider two Bayesian-rational agents, Alice and Bob, who share common knowledge of each other’s posterior probabilities for the event *E*: "A fair coin landed Heads". Alice assigns *P(E) = 0.7*, while Bob assigns *P(E) = 0.3*. Both agents are rational in the expected-utility sense (they maximise subjective expected utility conditional on their information). Their posteriors are common knowledge, yet they disagree.  

  1. **Explain** why this scenario appears to contradict the informal gloss of Aumann’s agreement theorem—that "rational agents cannot agree to disagree".  
  2. **Identify** which explicit assumption(s) of Aumann’s theorem fail in this case. Justify your answer using the theorem’s formal conditions.  
  3. **Assess** what Aumann’s theorem genuinely establishes about rational disagreement among agents with distinct priors or information. Does the theorem imply rationality *alone* precludes disagreement?  

  *Support your arguments with formal reasoning where appropriate.*  

  ---

  ### Model Answer (≈800 words)  

  Aumann’s agreement theorem (1976) is frequently mischaracterised as proving that "rational agents with common knowledge of each other’s beliefs cannot disagree". The described scenario—where Alice and Bob, both Bayesian-rational, maintain common knowledge of their conflicting posteriors (*P(E) = 0.7* vs. *P(E) = 0.3*)—directly challenges this gloss. This essay explains the apparent contradiction, identifies the failed assumptions, and clarifies the theorem’s true implications for rational disagreement.  

  **1. Apparent Contradiction with the Informal Gloss**  
  The informal claim that "rationality precludes disagreement" suggests that Bayesian rationality alone, coupled with common knowledge of posteriors, *must* induce consensus. Here, rationality (in the decision-theoretic sense of expected-utility maximisation) and common knowledge of posteriors both hold, yet disagreement persists. This superficially violates the theorem’s popular interpretation. However, Aumann’s result relies on deeper, often-overlooked assumptions: a **common prior probability distribution** and **common knowledge of information partitions**. The discrepancy arises because the informal gloss conflates *rationality* with these specific structural conditions.  

  **2. Failed Assumptions in Aumann’s Theorem**  
  Aumann’s theorem formally states: *If agents have a common prior, common knowledge of rationality, common knowledge of their posteriors for event E, and common knowledge of their information partitions, then their posteriors must be equal.* The agents here violate two key assumptions:  

  - **(i) Absence of a Common Prior:**  
  Aumann’s proof requires agents to update from an identical prior probability distribution over the state space. Here, Alice and Bob’s priors differ. Suppose the coin is fair (*P(E) = 0.5* objectively), but Alice holds a prior biased toward Heads (e.g., *P_A(E) = 0.6*) while Bob holds one biased toward Tails (*P_B(E) = 0.4*). If Alice receives evidence suggesting Heads (e.g., a signal with likelihood ratio 7:3), she updates to *P_A(E|evidence) = 0.7*. Bob, receiving evidence favouring Tails (e.g., likelihood ratio 3:7), updates to *P_B(E|evidence) = 0.3*. Crucially, **common knowledge of posteriors does not imply common knowledge of evidence or priors**. Agents may know each other’s *conclusions* without knowing the *evidence* that led to them, allowing disagreement despite common posterior knowledge.  

  - **(ii) Common Knowledge of Information Partitions:**  
  The theorem assumes agents commonly know how each other’s information partitions the state space. Here, Alice and Bob may have private, non-common-knowledge evidence. For example, Alice might observe a weather-dependent signal unknown to Bob, while Bob observes a distinct time-dependent signal. Even if posteriors are common knowledge (e.g., via public announcement), their **information partitions remain private**. Thus, agents cannot "simulate" each other’s reasoning to reach agreement, as the theorem’s proof requires.  

  **3. What Aumann’s Theorem Actually Establishes**  
  Aumann’s theorem does *not* show that rationality *alone* precludes disagreement. Instead, it demonstrates that **common priors and common knowledge of information structures synchronise beliefs**. When priors and partitions are common knowledge, Bayesian updating becomes a deterministic public process: agents can recursively model each other’s beliefs, forcing consensus. This reveals:  

  - **Disagreement stems from heterogeneous priors or private information.** Rational agents *can* disagree indefinitely if they hold different priors (as above) or if their evidence isn’t mutually transparent (violating partition common knowledge).  
  - **The theorem’s limits:** It constrains disagreement only under stringent homogeneity conditions. Real-world disagreement often reflects diverse prior experiences (yielding distinct priors) or asymmetric information (violating partition common knowledge). Rationality per se is insufficient to eliminate this; it merely ensures agents *coherently* update their idiosyncratic views.  
  - **Epistemological significance:** The theorem underscores that **common knowledge of beliefs is not epistemically inert**—it can enforce agreement *if* agents share a "cognitive framework" (common prior + partition knowledge). Absent this, rationality and communication need not converge.  

  In summary, Alice and Bob’s disagreement is compatible with Aumann’s theorem because they lack a common prior and common knowledge of information partitions. The theorem does not establish that rationality forbids disagreement; rather, it shows that under conditions of *epistemic homogeneity*, common knowledge of posteriors is impossible without consensus. This highlights the theorem’s role in formalising how shared epistemic foundations enable alignment—not as a universal proof against rational discord.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **First-Class Answer (16–20 marks):**  
  - **Structure:** Clear three-part response mirroring the question.  
  - **Part 1:** Correctly diagnoses why the scenario *seems* to contradict the informal gloss (rationality + common posterior knowledge ≠ agreement).  
  - **Part 2:** Identifies **both** failed assumptions:  
    - (i) Absence of common prior (3 marks).  
    - (ii) Absence of common knowledge of information partitions (3 marks).  
    Explains *why* common posterior knowledge ≠ common evidence knowledge (4 marks).  
  - **Part 3:** Assesses that the theorem requires shared priors/partitions to preclude disagreement; explicitly denies that rationality *alone* suffices (4 marks).  
  - **Critical depth:** Discusses how the theorem redefines "rational disagreement" in light of epistemic homogeneity (3 marks).  
  - **Formal precision:** Uses Bayesian notation (e.g., priors, posteriors, partitions) correctly (3 marks).  

  **Upper-Second Answer (12–15 marks):**  
  - Correctly identifies **one** failed assumption (e.g., common prior) and partially explains the other.  
  - Explains why disagreement persists despite common posterior knowledge.  
  - States that rationality alone does not preclude disagreement but lacks nuance on how priors/partitions enable consensus.  
  - Uses some formal reasoning but with minor inaccuracies (e.g., misstates partition requirements).  

  **Flagged Errors (Deduct marks as specified):**  
  - **Error 1: Conflating rationality with common priors.**  
    *Why made:* Students misread informal glosses of the theorem as centring on "rationality" rather than technical assumptions.  
    *Penalty:* **–3 marks** (e.g., claiming "rationality forces agreement").  
  - **Error 2: Equating common knowledge of posteriors with common knowledge of evidence.**  
    *Why made:* Students overlook that posteriors aggregate private evidence; partitions need not be transparent.  
    *Penalty:* **–4 marks** (e.g., asserting "common posterior knowledge implies shared evidence").  

  **General Deductions:**  
  - Poor structure or unclear reasoning: **–2 marks**.  
  - Misdefining Aumann’s conditions (e.g., "common knowledge of posteriors" vs. "common knowledge of rationality"): **–3 marks**.  

  ---  
  **Formatting Note:** All components adhere to British English conventions (e.g., "marks", "first-class", "common knowledge").
