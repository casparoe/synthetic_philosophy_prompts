prompt: |-
  I manage a four-person quantitative team at a catastrophe risk firm. We build Monte Carlo models for perils where we have little or no loss data, which means we constantly have to spread probability evenly across a range because we know nothing else to do. The thing I keep tripping over is that the answer depends on which quantity we spread evenly over. Our version of the textbook case: a hazard track clips a circular exposure zone, and the probability that the segment of track inside the zone exceeds some length is 1/2, 1/3, or 1/4 depending on whether we randomize the track's midpoint along a radius, its two crossing points on the boundary, or its midpoint over the area of the zone. All three are uniform in something, and I have been told this is called Bertrand's paradox and that the background idea is the principle of indifference. What worries me more than the paradox itself: being told to specify a physical generating story instead — straws dropped on a circle, or a storm track as a line in the plane with an orientation and an offset — seems to push the arbitrariness down one level, since the hand dropping the straws, or the distribution of the offset, is itself something we have to assume.

  Please write a procedure my team can run in under an hour on any model where we are tempted to assume evenness. My analysts have one statistics course each, so it has to be a numbered list of at most eight steps with a plain-language statement of what counts as a sufficient answer at each step. It should end in a one-paragraph justification we file with our regulator, naming the quantity being spread evenly, what licenses that choice, and the units or scale in which it is flat. Mark explicitly where the procedure stops with a no and sends the analyst back for data or for a better-posed question, and where it hands the decision to a senior reviewer because the remaining question is a modeling judgment rather than a fact. I want it to include a test I have been using informally, the handover test: an analyst who has never seen the model must be able to reproduce the number from the specification alone, and if they could reasonably get a different one, the specification is rejected. Include a units-and-reparameterization check as well, since our results are reported on a log loss scale and our priors are sometimes on rates rather than their logarithms. Tell me what the procedure cannot settle.

  Then run it on three cases: the hazard-track geometry above, where I expect a generating story to rescue us; our current default of a uniform prior on a component failure rate between zero and an upper bound, which I suspect the procedure will tell us to abandon; and a request we just got for the probability that an unnamed quantity, future regulatory fines for a new peril, falls in a given range. Keep the whole answer under 800 words.
reasoning: |-
  Okay, I need to understand the user's problem. They manage a quant team at a catastrophe risk firm building Monte Carlo models with little loss data. They often use uniform distributions due to lack of information but face Bertrand's paradox issues - probabilities change based on what they make uniform. They've heard about the principle of indifference and generating physical stories but feel this just shifts arbitrariness to another level.

  The user wants a practical procedure for their team to handle these situations. Key requirements: simple numbered steps (<8), plain language for analysts with basic stats knowledge, includes handover test and units/reparameterization check, specifies when to stop or escalate, ends with justification paragraph for regulators. Also needs application to three cases: hazard-track geometry, uniform prior on failure rate, and regulatory fines probability.

  I consider how to structure the procedure. Step 1 should identify the uncertain quantity and its possible values. Step 2 must include the handover test - can another analyst reproduce it from spec? Step 3 should check for natural scale using transformation invariance. Step 4 should look for physical generating mechanisms. Step 5 handles cases where physical mechanisms exist. Step 6 handles indifference cases with scale justification. Step 7 is the escalation point. Step 8 documents the justification.

  For the hazard-track case: Physical generating story (dropped straw) resolves it - uniform offset perpendicular to fixed direction gives P=1/2. For failure rate: Uniform on [0,u] fails units check - should be log-uniform instead. For regulatory fines: Insufficient specification - reject until better defined. 

  The procedure can't resolve true indifference cases without additional context. The key is to push for physical stories or natural scales where possible, and reject underspecified problems. Documentation should clearly state the chosen uniform quantity and why it's natural.
answer: |-
  Here’s a standardized procedure for your team (**≤ 1 hour**):

  **Procedure: Uniformity Justification & Specification (UJS)**
  1.  **Define Target Quantity (Q):** "What specific numerical value (or event probability) are we estimating?" *Sufficient:* Clear mathematical definition of Q (e.g., P(track length in zone > L).
  2.  **Handover Test:** Write a 1-sentence specification: "To compute Q, assume ____ is uniformly distributed over ____." Give *only* this sentence to another analyst. *Reject if:* They compute a different Q than you using the same math/logic. Iterate until unambiguous.
  3.  **Units & Reparameterization Check:** Identify the natural scale (S) of the quantity assumed uniform in Step 2. Apply a monotonic transformation (e.g., log, square, 1/x). *Stop/Reject if:* The uniform assumption on the transformed scale leads to a materially different Q (>10% change). Escalate to Step 7 if unsure.
  4.  **Seek Physical Generating Mechanism (PGM):** Can we describe a physical/statistical process *actually generating* the randomness? (e.g., "storm direction uniform, then perpendicular offset uniform"). *Sufficient:* A concise, plausible story matching the system.
  5.  **If PGM Exists:** Use the uniformity implied by the PGM. Justify based on process knowledge/data patterns. *Stop.*
  6.  **If No PGM (Indifference):** *Must* justify why S (from Step 3) is the "natural scale" for ignorance. *Escalate to Senior Reviewer:* Lack of PGM inherently requires modeling judgment. No purely logical solution (Bertrand’s paradox).
  7.  **Senior Judgment:** Reviewer selects S based on precedent, computational stability, or regulatory expectation. *Must* document rationale explicitly rejecting alternatives. *Stop.*
  8.  **Document Justification:** "We assume uniformity of [Quantity] over [Range] in units of [Scale]. This is licensed by [PGM description / 'Principle of Indifference on scale S as the most natural uninformative basis, chosen due to X judgment']. Scale S has constant density per unit [unit of S]."

  **What UJS Cannot Settle:** True epistemic indifference with no natural scale (Bertrand cases without PGM). It forces explicit choices or rejection.

  **Case Applications:**

  1.  **Hazard Track (Bertrand):**
      *   Q = P(segment length > L)
      *   Handover: "Assume storm direction uniform, then perpendicular offset from zone center uniform within [-R, R]." → Analyst computes P=1/2.
      *   Units: Offset (linear distance) - uniform stable under linear shift? Yes (constant density per km). Log(offset)? No (fails Step 3).
      *   PGM: "Storms approach from random direction; given direction, track uniformly likely to pass at any offset." → **Use P=1/2.** Justification: Physical generating story (PGM).

  2.  **Component Failure Rate (λ ∈ [0, u]):**
      *   Q = E[λ] or P(λ > c)
      *   Handover: "Assume λ uniform on [0, u]."
      *   Units: Failure *rate* (λ). Apply log(λ). Uniform λ implies P(logλ > c) ≠ Uniform logλ implies P(λ > c). → **Fails Step 3 materially.**
      *   PGM: None provided (default indifference). Escalate (Step 6/7). *Recommendation (Senior Judgment):* Use Uniform *logλ* over [logε, logu] (improper prior at 0) as scale-invariant choice. Justification: Ignorance spans orders of magnitude; log scale natural. **Abandon uniform λ.**

  3.  **Regulatory Fine (Unnamed Q in Range):**
      *   Q = P(Fine ∈ [a,b])
      *   Handover/Specification: Impossible. "Unnamed quantity" & no range context. → **Reject at Step 1.** Insufficient definition. Analyst must return for: What is fined? What are plausible min/max? Is there a natural scale (dollars? log-dollars?)?

  **Final Justification Example (Hazard Track):** "We assume uniformity of the perpendicular *offset distance* (in km) of the storm track from the exposure zone center, over the range [-R, R] km where R is the zone radius. This is licensed by the physical generating mechanism where storm direction is first chosen uniformly, and then, conditional on direction, the track's position perpendicular to that direction is uniformly distributed across all possible offsets intersecting the zone. The scale (km) has constant density per kilometer."

  **Word Count:** ~780
