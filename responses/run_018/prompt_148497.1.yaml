answer: |-
  Based on your precise description, I argue that **no single established concept fully isolates the specific, self-referential asymmetry you identify**. While Müller's "claim to exclusive moral representation" comes closest, it lacks the necessary emphasis on the *epistemic mechanism* (or lack thereof) and the *conditional validation/invalidation of institutions* based purely on outcome alignment with the speaker. Therefore, I propose coining the term:

  **Self-Referential Legitimation (SRL)**

  **Definition:** A discursive strategy whereby a political actor claims to be the sole authentic interpreter of a collectively held will (e.g., "the will of the people"), while simultaneously denying any independent procedure, institution, or criterion for verifying that will. Institutional legitimacy is asserted *if and only if* an institution's output aligns with the actor's position. Disagreement triggers an *a priori* delegitimisation of the institution as corrupted, distorted, or alienated, without recourse to an alternative verification mechanism beyond the actor's own pronouncement. Legitimacy thus becomes entirely circular and contingent upon the actor's self-validation.

  **Defence of the Term & Judgement:**

  1.  **Why Müller's "Exclusive Representation" is Insufficient (Though Close):**
      *   Müller brilliantly diagnoses populism's core as a claim to *exclusively* represent the "real" people against corrupt elites and illegitimate institutions. This captures the anti-pluralist, anti-institutional thrust.
      *   **However, it doesn't sufficiently isolate the *asymmetrical epistemic operation* concerning institutions.** Müller focuses on the *claim* to representation and the antagonism, but your observation highlights the *conditional logic applied to institutional outputs* and the *complete absence of a positive alternative verification process*. SRL explicitly centres this mechanism: institutions are *transparent conduits* when they agree, *opaque obstacles* when they disagree, with the switch *solely* flipped by the speaker's judgement. The "exclusive representation" claim enables SRL but doesn't fully define its operational logic.

  2.  **Why Schmittian Decisionism is Inadequate:**
      *   Schmitt focuses on the *sovereign* as the one who decides on the *exception*, suspending the norm. The sovereign's decision is ultimate, grounded in existential threat, not in a claimed interpretation of a pre-existing popular will.
      *   **SRL is fundamentally different:** It operates *within* the normative framework of popular sovereignty ("the will of the people *should* rule"). It doesn't suspend norms; it manipulates their application based on outcome. Its core is *epistemic* (claiming privileged access/knowledge of the popular will) and *conditional* (institutions are valid only when they yield the 'correct' result), not primarily existential or focused on the exception. The populist figure isn't usually claiming sovereign power to *suspend* the constitution; they claim institutions *fail* the constitution by distorting the popular will – a will only they can discern.

  3.  **Why Epistemic Populism is Inadequate:**
      *   Epistemic populism (e.g., Canovan, others) posits that "the people" possess a unique, often intuitive or experiential, grasp of political truth inaccessible to elites via complex institutions. This provides a *positive* (though contested) epistemic basis.
      *   **SRL lacks this positive epistemic claim.** Crucially, it offers *no account* of *how* the people's will is formed or known *apart from the speaker's assertion*. There is no appeal to common sense, intuition, or plebiscitary mechanisms as alternative sources. The "will" has no independent existence or discernible content *except* the speaker's policy preferences. The asymmetry *is* the mechanism. Epistemic populism provides a theory; SRL is a self-validating *manoeuvre* enabled by the *vacuum* of any verifiable alternative.

  4.  **Distinction from Ordinary Strategic Hypocrisy:**
      *   Hypocrisy involves a *conscious* inconsistency between public pronouncement and private belief/action for strategic gain. It's a *fault* in application.
      *   **SRL is Structural & Ideological:** It functions as a core *principle of legitimation/delegitimation*, not merely an inconsistent application of a stable principle. The actor *need not be insincere*; they may genuinely believe their interpretation *is* the popular will. The asymmetry is *built into the logic itself*: "Legitimacy = Alignment with My Interpretation." It's not hypocrisy *about* a principle; it *is* the principle. The boundary is crossed when criticism of specific institutional failures or biases transforms into a *systematic, conditional logic* where institutional validity *only ever* derives from agreement with the speaker, and disagreement *always* proves institutional illegitimacy *regardless of specific context or procedure*.

  **Boundary Conditions of Self-Referential Legitimation:**

  1.  **Starts:** When an actor (typically claiming to speak for "the people") establishes that the legitimacy of democratic institutions is *contingent solely* on their outputs aligning with the actor's declared position, and that *no alternative, verifiable procedure* exists (or is acknowledged) to ascertain the "true will" apart from this alignment/non-alignment with the actor.
  2.  **Ends:**
      *   When the actor accepts the legitimacy of an institutional outcome *despite* it conflicting with their stated preference (acknowledging the institution's independent authority).
      *   When the actor invokes a *specific, positive alternative mechanism* (e.g., a referendum, mass survey, defined plebiscitary process, clear constitutional principle) as the means to verify the popular will *against which* the institution is judged, even if they critique the institution. The key is the existence of a criterion *external* to the speaker's immediate judgement.
      *   When criticism of an institution is based on *specific, falsifiable* claims of corruption, procedural violation, or bias *within the institution's own rules*, rather than on the mere fact of disagreement being proof of systemic illegitimacy and distortion.

  **Conclusion:**

  Your observation isolates a distinct and pernicious manoeuvre at the heart of populist challenges to democratic legitimacy. While drawing on elements of exclusive representation, anti-institutionalism, and anti-pluralism, the specific combination of **1) the complete absence of an independent verification mechanism for the invoked sovereign will, 2) the conditional, outcome-based validation/invalidation of institutions, and 3) the reduction of legitimacy entirely to alignment with the speaker's position** necessitates a new term. **Self-Referential Legitimation (SRL)** captures this core logic: legitimacy is defined solely by the speaker's self-referential pronouncements, creating an unimpeachable, circular fortress of authority that renders democratic institutions perpetually vulnerable to capricious dismissal. It is the discursive machinery by which populist figures attempt to monopolise the very source of democratic legitimacy – the people's will – leaving no room for pluralism, institutional autonomy, or dissent.
