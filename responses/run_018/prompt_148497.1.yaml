  Okay, I need to thoroughly understand the user's query. They're an undergraduate in political theory, studying democratic legitimacy, and have noticed a specific pattern in populist arguments. The pattern is asymmetrical: populist figures claim institutions are legitimate only when they align with "the will of the people," as defined by the populist, and illegitimate when they don't, without providing any independent way to verify that will. The user has already explored concepts like thin-centred ideology, Schmittian decisionism, and epistemic populism but finds them insufficient. They want me to either identify the best-fitting concept or coin a new term, arguing rigorously for it.

  First, I should recall key theories. Schmittian decisionism focuses on a sovereign who makes ultimate decisions without higher norms, but it doesn't capture the asymmetry where legitimacy flips based on the populist's own position. Epistemic populism suggests that ordinary people have direct access to truth, but the user points out that in this pattern, there's no alternative mechanism—just the populist's self-referential claims. Ordinary hypocrisy is strategic deception, whereas this seems more structural and intrinsic to the argument.

  The core issue is the lack of a consistent criterion beyond the populist's judgment. I remember Jan-Werner Müller's work on populism, where populists claim exclusive moral representation. That might be close, but it doesn't fully address the asymmetrical appeal. Müller talks about anti-pluralism and the claim to exclusive representation, which could relate. However, the user emphasizes the absence of any positive procedure.

  Perhaps a new term is needed. Let me think about what's unique: it's a self-referential loop where the populist defines the people's will based on their own views, and institutions are only transparent when they agree. That sounds like a tautology or a performative contradiction. Terms like "performative sovereignty" come to mind, but I need something more precise.

  Considering Müller's idea of a "double movement"—claiming to embody the people while attacking institutions—that might be relevant. But the user wants a single concept. Alternatively, "sovereigntist ventriloquism" could work, as it implies the populist is speaking for the people without real input. However, that might not be established.

  I should check if there's an existing concept. Re-reading the query, the user mentions that Schmittian and epistemic approaches are inadequate because they don't cover the absence of alternative procedures. So, Müller's "claim to exclusive representation" is the closest, but it needs refinement to highlight the asymmetry.

  Defining a new term: "Legitimatory Asymmetry" or "Self-Referential Legitimation." But "Self-Referential Legitimation" seems better because it centers on the circular logic where the populist's authority is the sole criterion. That captures the essence: legitimacy is defined by alignment with the populist, with no external standard.

  Now, to defend this against alternatives. Schmittian decisionism is about ultimate authority in emergencies, not the day-to-day asymmetrical validation. Epistemic populism assumes a way to access truth, but here, there's no method—just the populist's word. Hypocrisy is about inconsistency for gain, whereas this is a deeper ideological move to monopolize legitimacy.

  Boundary conditions: It starts when a figure positions themselves as the sole interpreter without procedures, and ends when they accept institutional outcomes or provide alternative mechanisms. This differentiates it from simple hypocrisy or legitimate criticism of institutions.

