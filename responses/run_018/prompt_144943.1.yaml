answer: |-
  ### Opening Address: Inaugural Symposium of the Institute for Philosophy and Machine Learning  

  Ladies and gentlemen, colleagues, and friends—welcome to the launch of this Institute. We stand at a rare convergence: half of you build and dissect machine learning systems, probing the inner workings of neural networks. Half of you dissect concepts—intentionality, function, error—in minds and scientific models. And among us are those who steward resources and vision, asking why *this* institute matters for society. Today, I’ll argue that the question uniting us—"Do neural networks *have* representations?"—is not one question but three. And until we disentangle them, we risk talking past each other, overpromising on ethics, or undervaluing our tools.  

  **The Three-Way Ambiguity**  
  Let me be precise. When we say "representation," we conflate three distinct jobs this term performs across our disciplines:  

  1. **Aboutness**: What a state is *of* or *about*. When an activation pattern fires for "tiger," is it *referring* to the predator, the way a thought or word does?  
  2. **Error**: How that state can *get it wrong*. If the network labels a leopard as a tiger, does it *misrepresent*?  
  3. **Causal Role**: How the state functions in the system. Does it play a part in processing that mirrors how representations guide decisions in brains or algorithms?  

  These jobs are separable. Progress on one does not guarantee progress on the others. And crucially—what’s settled versus contested hinges on which job we mean.  

  **What’s Settled? The Causal-Functional Role**  
  For our ML colleagues: you *already* engineer representations in the third sense. When you visualize features, probe classifiers, or intervene on activations, you’re mapping states that play specific causal roles. Take a vision model trained on ImageNet. We can identify neurons that activate for striped textures. If we ablate them, the model stumbles on tigers but also on zebras or radiators with grates. This is causal role representation: a state with a functional niche in the computational pipeline.  

  This is uncontroversial. We all agree networks have states that *function* as representations in this limited sense. Where we *disagree* is whether this licenses aboutness or error.  

  **Where We Disagree: Aboutness and Error**  
  Consider our vision model. Those "stripe detector" neurons fire for tigers… but also for abstract art with stripes, or even adversarial noise.  

  - **Aboutness**: Is this state *about* tigers? ML interpretability tools might say yes—it correlates tightly with tiger images. But philosophers note: correlation isn’t aboutness. A smoke detector beeps for fire but isn’t *about* fire; it lacks intrinsic intentionality. Does the neuron? Some argue these patterns are merely causal signatures; others, that they ground primitive reference. There is no consensus.  
  - **Error**: Can the neuron *misrepresent*? Suppose it fires for a leopard (a "false tiger"). An interpretability researcher might call this an error. But philosophers of mind split: can a system misrepresent without biological teleology or evolutionary history? Functional-role theories say maybe; naturalistic theories say no. Again, no agreement.  

  Here, the dimensions clash. Causal role is clear; aboutness and error are not. And this divergence shapes our promises.  

  **Why This Ambiguity Matters for Accountability**  
  To our administrators and donors: this isn’t academic hair-splitting. It dictates what we can ethically guarantee.  

  Suppose we make a network "transparent." We visualize all neurons, showing stripes activate "tiger detectors." If we claim this resolves bias or safety, we’re overreaching. Transparency reveals causal roles—*not* whether the system "understands" tigers (aboutness) or "knows" it’s wrong (error). A self-driving car might "represent" pedestrians via causal proxies (e.g., shape clusters). But if it mislabels a child as a traffic cone, transparency alone won’t tell us if this is *misrepresentation*—or just statistical noise. We need philosophy to parse the difference.  

  Conversely, dismissing interpretability as "mere engineering" ignores real progress. When probing classifiers isolate gender bias in embeddings, they expose causal roles that *enable* accountability—even if they don’t resolve intentionality.  

  **The Path Ahead**  
  So what can we promise?  
  - We *can* engineer systems whose causal roles align with human-interpretable concepts.  
  - We *cannot* yet assert these systems "grasp" meaning or "commit" errors like minds.  
  - We *must* collaborate to define when causal roles suffice for ethics—and when they demand deeper theories of aboutness.  

  This is why we need philosophers and engineers at one table. Without philosophy, ML risks reducing representation to correlation; without ML, philosophy risks armchair speculation. Together, we can navigate the ambiguity—and build systems accountable not just mathematically, but morally.  

  To all of you: thank you for joining this experiment. Let’s begin.  

  ---  
  *(Timing note: Delivered at a moderate pace, this address runs ~14-15 minutes, allowing for pauses. The tiger/stripes example grounds abstraction; the ethical stakes contextualize ambiguity for non-specialists.)*
