prompt: |-
  Hey — I run the research team at an international health NGO. Several times a year we write an interview guide or survey module in English, our field staff translate it into about a dozen languages, and then we compare the answers across countries and move real money around based on the differences. I've started to worry that a good chunk of what we read as "people in country X care less about Y" is really an artifact of what their language makes easy or hard to say.

  Where I've landed on the theory: the strong Sapir–Whorf thing (language determines what you can even think) looks dead, but some weaker version seems hard to deny — that a language shapes what you're *obliged* to encode in order to say anything at all, what sits on the tip of your tongue, and what takes a whole clause to get across. (There's an idea I half-remember, Slobin I think, that the effect is mostly on what you have to work out while you're speaking rather than on thought in general.)

  Here's what I want: turn that into a procedure my team can run on an item before we field it. Concretely — we have no budget for ethnography, our country leads are smart but have no linguistics training, sign-off is the country director, and usually I have a day or two, not a month. So: the questions in order, what counts as a good enough answer to each, where the procedure stops with a "don't field this cross-nationally," and where it has to hand the decision to a person because it's a values call rather than a factual one.

  Some things I specifically want in it:

  My stab at the key distinction is three-way: does the language *force* you to mark the distinction every time you open your mouth (grammatically), does it just make it *cheap* — one ready-made word, easy to reach for — or is it merely *unsayable* without a whole clause or a loan word? Fix that if it's wrong.

  For my purposes I genuinely don't care whether an effect is reshaping thought or only reshaping what people say when you put a question to them, since either one wrecks a cross-country comparison. Tell me if that's a mistake and it matters which it is.

  I also want a step where we write down, *before* seeing any data, which direction the language should push the answer and roughly how much — if we can't say which way, we shouldn't use the item. And for anything big enough to move money, some kind of non-verbal or behavioural cross-check of the same construct.

  Then run it on three of our actual items:

  1. A confidence question: "How confident are you that the clinic will be open next time you go," scored 1–5. In one of our languages, when you talk about a future or past event you have to grammatically mark whether you saw it yourself, were told it, or inferred it — evidentiality, I think it's called. Respondents there score consistently low and the country team reads that as "they don't trust us."

  2. A wayfinding question: we ask people to describe the route they took to the clinic and where they'd put a sign, and we code the answers for spatial detail. At one site the language doesn't really have a way to say "to the left of the door" without using cardinal directions — people say north-side and so on as a matter of course, even indoors. Our coding scheme was built for left/right answers, so those responses look vague to us.

  3. The one I won't like: our flagship "trust in the health system" battery, which our regional strategy and the last two board reports are built on. In two of our languages the nearest natural word to "trust" isn't about institutions at all — it's about a particular person you have a relationship with, or it's bound up with reciprocity and exchange. So low scores there may mean something entirely different. Run the procedure on this and tell me what it says even if it says I have to stop reporting a comparison I've been reporting for two years.

  Also give me at least one item where the honest output is "this is fine, field it as is," so I know the procedure isn't just a no-machine. And tell me plainly what it can't do.

  On confidence: be clear about what's settled among people who actually work on this versus what they're still fighting about. I've gathered that some of the famous experiments in this area have had replication trouble, and I don't want to build a step on one of those and find out a year later. If any step rests on a contested result, flag it and say what breaks if the result is false — and don't soften it if the honest verdict is that the weak version I've committed to is itself less secure than I think. No citations or further reading, I have no library access out here and won't chase them. American English, please.
reasoning: |-
  Okay, the user runs a research team at an international health NGO and is concerned about how language differences might skew their cross-country survey results. They need a practical procedure to assess survey items for linguistic biases without requiring linguistics expertise or much time. 

  First, I need to unpack their core worry: they suspect that what appears as cultural differences in responses might actually be artifacts of language structures. They've correctly dismissed strong linguistic determinism but are working with a weaker version focusing on what languages oblige speakers to encode. 

  The user's constraints are clear: minimal budget, no linguistics training among country leads, quick turnaround, and country director sign-off. Their three examples reveal high-stakes implications - from clinic confidence questions affecting funding allocations to their flagship trust metric shaping board reports.

  Hmm, their proposed three-way distinction (forced/cheap/expensive encoding) seems solid for operational purposes. The key insight is that for their work, it doesn't matter whether language shapes thought or just expression - both would invalidate comparisons. That's pragmatically sound.

  For the procedure design, I'm thinking a tiered approach: start with quick red flags anyone can spot, then progress to more nuanced analysis. The critical innovation they requested is pre-registering expected bias direction - that's smart for accountability. Also love their demand for behavioral cross-checks on big-ticket items.

  The replication caveat they mentioned is crucial. I should note where consensus exists (e.g., evidentials' effect on confidence scales) versus debated areas (like whether spatial language truly impacts navigation). For their trust battery example, the honest verdict might hurt - if "trust" doesn't map properly in some languages, those comparisons are probably invalid even if politically inconvenient.

  For the "this is fine" example, something like vaccination intent should work well - concrete actions with direct translations. The limitations section must emphasize that this can't catch cultural constructs, only linguistic traps.

  The user's self-awareness impresses me - they're explicitly asking not to soften blows about their flagship metric. That takes professional courage. My response should match that integrity while preserving their team's morale.
answer: |-
  Here's a streamlined procedure based on your constraints and goals. It focuses on *linguistic actionability* – catching items where language mechanics (not just vocabulary) might systematically distort responses in ways that wreck cross-country comparison.

  **The Core Procedure: "Linguistic Vetting for Cross-National Surveys" (LViCNS)**

  1.  **Assemble the Team:** Lead Researcher (you/designated team member) + Primary Translator(s) for the target language(s) + Country Lead (context expert). *Time: 30-min prep call.*

  2.  **Question & Target Concept:** State the exact survey item/question and the precise *construct* it aims to measure (e.g., "Confidence in clinic availability", "Spatial precision in wayfinding descriptions", "Trust in the impersonal health system").

  3.  **Key Linguistic Check: The Encoding Cost Matrix (Forced/Cheap/Expensive)**
      *   **Identify Key Distinctions:** What specific *distinction* is the question asking respondents to make or report on? (e.g., *Degree* of confidence (scale 1-5), *Direction* (left/right vs. N/S/E/W), *Target* of trust (person vs. system)).
      *   **For Each Key Distinction, Ask the Translator:**
          *   **Forced:** "In your language, when talking about [related concept], are you **forced by grammar** to specify [distinction]? (e.g., *Must* you mark source of knowledge? *Must* you specify absolute direction?)"
          *   **Cheap:** "Is there a **single, common, natural word/phrase** for expressing [distinction]? (e.g., A word for 'confident'? A word for 'left'? A word for 'trust'?)"
          *   **Expensive:** "If there isn't a single word, how *would* you naturally express [distinction]? Is it a **long phrase, a loan word, or feels awkward**?" (e.g., "I feel it will be there maybe" for low confidence; "On the side where the sun sets" for west; "Believe they will do their duty" for institutional trust).
      *   **Record:** Note the Forced/Cheap/Expensive status for *each key distinction* in the question.

  4.  **Predict the Bias (Crucial Pre-Reg Step):**
      *   **Based on Steps 2 & 3, predict:** "Given how the language forces/encourages/discourages expressing this distinction, which direction will responses in *this* language likely be pushed *compared to a language without this feature*?"
      *   **Examples:** "Forced evidentiality -> Lower confidence scores reported." / "No cheap 'left' -> Less frequent use of relative directions, more cardinal -> Vague coding." / "'Trust' word implies personal reciprocity -> Lower scores meaning something different."
      *   **Decision Point:** **Can you predict the direction?** If **NO** (or "It's too complex" / "We genuinely don't know"), **STOP. DO NOT FIELD** this item cross-nationally. If **YES**, document the predicted direction & rationale clearly.

  5.  **Action Thresholds:**
      *   **RED FLAG (Stop):** Any **Forced** distinction that isn't *explicitly asked about* in the question OR any key distinction that is **Expensive** *and* central to the construct. *OR* Failure to predict bias direction (Step 4).
      *   **YELLOW FLAG (Discuss with Country Lead/Director):** A **Cheap** distinction exists but seems significantly culturally loaded in ways the question might miss OR a **Forced** distinction *is* asked about but might interact unpredictably. *Decision:* Modify question? Add probe? Accept risk? Drop comparison?
      *   **GREEN FLAG (Proceed):** Key distinctions are **Cheap** or **Neutral** (no significant forced/expensive barriers). Predicted bias is minimal or understood/controllable.

  6.  **High-Stakes Cross-Check (For Flagship Items/Moving Money):**
      *   **Requirement:** For any item passing Green/Yellow where the result significantly impacts resource allocation, **MUST** have a non-verbal/behavioral measure of the *same core construct*.
      *   **Examples:** Confidence -> Observed clinic return rate / Wayfinding -> Success rate finding a hidden object using described directions / Trust -> Uptake of a new (non-incentivized) service offered by the system.
      *   **Purpose:** Correlate survey response with behavior *within* each language group. If the correlation is strong, the linguistic effect *might* be manageable (though not necessarily comparable *between* groups). If weak, the survey item is likely invalid *in that context*.

  **Running Your Items Through LViCNS:**

  1.  **Confidence Question (1-5 scale):**
      *   **Key Distinction:** Degree of certainty about future event.
      *   **Linguistic Check (Evidential Language):** **Forced** evidential marking (must specify source: seen/told/inferred). Not asked in the question.
      *   **Predict Bias:** Respondents are forced to confront *how* they know, making low confidence (inference/rumor) the "cheapest" or most neutral answer. **Prediction:** Systematically **lower** scores vs. languages without evidentials.
      *   **Action Threshold:** **RED FLAG (Stop).** The forced grammatical feature directly conflicts with the simple scale. Country team's interpretation ("they don't trust us") is likely wrong; it's a linguistic artifact. **Solution:** Reword to *explicitly accept* different sources ("Regardless of how you know, how sure are you...") OR use a behavioral measure (return rate) as primary indicator.

  2.  **Wayfinding Question (Coded for spatial detail):**
      *   **Key Distinction:** Use of relative (left/right) vs. absolute (N/S/E/W) directions.
      *   **Linguistic Check (Cardinal Language):** Expressing "left of door" is **Expensive** (requires circumlocution). Using cardinal directions is **Cheap** ("north side").
      *   **Predict Bias:** Respondents will overwhelmingly use cheap, absolute directions. Coders trained on relative directions will find these descriptions "vague" or miss the spatial detail entirely. **Prediction:** Systematically **lower** coding scores for spatial detail *by your scheme* in this language.
      *   **Action Threshold:** **YELLOW FLAG (Discuss).** The *construct* (spatial precision) might be measured, but your *coding scheme* is linguistically biased. **Solution:** Adapt coding scheme for cardinal languages OR abandon cross-lang coding comparison; analyze richness *within* language groups only. Add behavioral check (actual navigation success).

  3.  **"Trust in Health System" Battery:**
      *   **Key Distinction:** Meaning of "trust" applied to an impersonal system.
      *   **Linguistic Check (Specific Languages):** The natural word for "trust" is **Cheap** but carries strong connotations of **personal relationship/reciprocity** (Expensive/awkward to force the impersonal meaning).
      *   **Predict Bias:** Respondents interpret the question as asking about trust in *individual staff* or expect a reciprocal relationship with *the system as an entity*. "Low trust" scores likely reflect this different meaning, not distrust in the *impersonal function* of the system. **Prediction:** Systematically **lower/misleading** scores in these languages vs. languages where "trust" easily extends to systems.
      *   **Action Threshold:** **RED FLAG (Stop comparing these countries on this metric).** The core concept is not equivalently measured. Continuing to report the comparison is scientifically invalid. **Solution:** Invest in deep qualitative work (ethnography *is* needed here) to define and measure the local construct analogous to "institutional trust". Develop a new, bespoke measure *for those contexts*. Use behavioral proxies (service uptake, complaint mechanisms used) as cross-checks everywhere. **Your regional strategy needs revision based on valid data.**

  **"This is Fine" Example: Vaccination Intent**

  *   **Item:** "How likely are you to get the [specific] vaccine for your child when it is next offered here? Very likely / Somewhat likely / Not very likely / Not at all likely."
  *   **Key Distinction:** Future intention regarding a concrete, observable action.
  *   **Linguistic Check:** Verbs of intention/planning exist cheaply in virtually all languages. The action ("get vaccine") is concrete and translatable. No forced grammatical features conflict.
  *   **Predict Bias:** Minimal. Potential minor variations in probability terms ("likely"), but core intention about a concrete act is highly translatable.
  *   **Action Threshold:** **GREEN FLAG (Field as is).** Non-verbal cross-check still recommended (actual vaccination records).

  **What LViCNS Can and Cannot Do:**

  *   **CAN:**
      *   Catch major linguistic mismatches (forced grammar, missing cheap terms, expensive circumlocution).
      *   Force pre-registration of bias predictions.
      *   Flag items needing adaptation, context-specific analysis, or behavioral checks.
      *   Prevent invalid cross-national comparisons based on linguistic artifacts.
      *   Be run quickly by non-linguists using translators as language experts.
  *   **CANNOT:**
      *   Guarantee perfect conceptual equivalence (deep cultural constructs are beyond just language).
      *   Solve the problems it flags (that requires resources/redesign).
      *   Catch subtle pragmatic differences (e.g., politeness norms affecting scale use).
      *   Replace deep contextual understanding or ethnography.
      *   Fix poorly designed questions (only reveal linguistic flaws).

  **Confidence in the Weak Sapir-Whorf / Slobin "Thinking for Speaking":**

  *   **Settled:** Languages *do* oblige speakers to encode certain information grammatically (tense, number, gender, evidentiality, etc.). This *does* influence online processing ("thinking for speaking") – speakers must attend to these features *while formulating utterances*. This effect is robust and replicable.
  *   **Settled:** Languages make some concepts lexically "cheaper" than others. This influences ease of expression and frequency of use.
  *   **Contested (But Likely for Your Purpose):** Whether these linguistic differences cause *deeper cognitive differences* (e.g., actually perceiving time or space differently). Replication issues plague *some* famous cognitive experiments (e.g., color perception, some spatial reorientation tasks).
  *   **Why It Doesn't Matter For You:** As you stated, whether it shapes *thought* or just *what people say when asked* is irrelevant. Both "thinking for speaking" and lexical access differences **will directly impact survey responses.** If your procedure flags a forced or expensive distinction, it *will* affect answers. LViCNS rests on the **settled facts** of grammatical obligation and lexical accessibility, *not* on contested claims about fundamental cognition. If the weak effects themselves were somehow invalidated (highly unlikely given the evidence), LViCNS would become unnecessary – but the evidence for them is strong and operationalizable for your needs.

  **Final Output for Your Trust Battery:** LViCNS gives a **RED FLAG (Stop comparing)**. The low scores in those two languages almost certainly reflect a different *concept* being measured, not lower levels of the construct you intended ("trust in an impersonal system"). Reporting a comparison based on this battery is misleading. You need to develop a new strategy for measuring this construct cross-nationally or accept that direct comparison using this measure in those contexts is invalid. The behavioral cross-checks are now essential everywhere.
