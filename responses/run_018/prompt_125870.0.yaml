  Okay, the user is in a seminar on moral historiography and comparative genocide studies. They're stuck on whether ranking historical evils is possible or obscene. The class discussion got heated, and they're looking for a structured way to prioritize the key questions.

  First, I need to understand their three main lines of inquiry. They mention: (1) scalar moral ontology flattening qualitative differences, (2) whether the obscenity objection is about epistemic limits or memorial justice, and (3) if incomparability blocks transitional justice. They want a defended ordering, not just a list.

  The user wants clarity on which issue is most upstream. If resolved, which one would have the most significant impact on the others? The ontology question seems foundational. If we determine if moral atrocities can be measured on a scale, that affects how we approach memorial justice and transitional justice. For example, if we agree that qualitative differences matter more than quantitative measures, then comparing events becomes problematic, influencing how resources are allocated in memorial culture. 

  Then, there's the memorial justice angle. If the obscenity objection is rooted in distributive justice, solving the ontology might not fully resolve it. Even if comparisons are possible, there might still be political and social reasons to avoid them. This seems like a separate track that interacts with ontology but isn't entirely dependent on it.

  Transitional justice relies on proportionality. If atrocities are seen as incomparable, mechanisms like reparations or tribunals could be undermined. But this might depend on the ontology question. If events can be compared, then proportionality becomes feasible. However, if the ontology question remains unresolved, transitional justice might still need practical approaches despite theoretical disagreements.

  The user also asks for confidence levels and the least sure point. The ontology as upstream seems solid, but the relationship between memorial justice and transitional justice is trickier. Are they parallel or does one influence the other? Memorial justice might have more immediate social implications, while transitional justice is more about legal frameworks. But I'm less certain how they directly affect each other.

  Practical payoff matters. The ontology debate is abstract but foundational. Resolving it could prevent missteps in other areas. Memorial justice has real-world impacts on funding and education, affecting societal healing. Transitional justice is crucial for post-conflict societies but might be more context-dependent. 

  The user's deeper need might be to cut through the debate's noise and find leverage points for meaningful research. They want to focus their limited time effectively, so prioritizing based on tractability and impact is key. They might also need to present this in class, so clarity and defensible reasoning are essential.
answer: |-
  Here's a prioritized research agenda for your debate, based on upstream/downstream logic, tractability, and practical/moral stakes, with explicit confidence levels:

  **Core Priority Ranking (Defended):**

  1.  **(1) Scalar Moral Ontology:** *Is a "ranking" even conceptually coherent?*
      *   **Why Upstream?** This is the *foundational* philosophical question. Until we clarify *what* we're comparing (intent? suffering? societal rupture? moral culpability?) and *whether* these elements are commensurable, the other debates are premature or based on faulty premises. Bauman's modernity thesis directly challenges the ontology of the Holocaust as a *unique category* of evil (bureaucratized, industrialized annihilation detached from traditional motives), demanding we first clarify the units of comparison.
      *   **Tractability:** High for conceptual mapping (e.g., identifying types of "uniqueness" - historical, moral, causal), lower for definitive resolution. We *can* rigorously define terms and identify logical constraints.
      *   **Downstream Impact:** Resolving (or even clarifying) ontology directly shapes *how* we approach (2) & (3). If qualitative differences are irreducible (e.g., Nazi intent vs. colonial neglect vs. Stalinist paranoia), ranking becomes incoherent, making (2)'s "obscenity" partly epistemic and forcing (3) to find non-comparative justice mechanisms. If a defensible scalar framework *is* possible, (2) & (3) become questions of application.
      *   **Practical Payoff:** Prevents category errors, clarifies the *nature* of the comparison itself. Essential for rigorous scholarship.
      *   **Confidence in Priority:** **High (90%)**. This *is* the core conceptual blockage.

  2.  **(2) Memorial Justice & the "Obscenity" Objection:** *Is the primary objection to comparison epistemic (we *can't* know/measure adequately) or socio-political (comparisons distort memory & harm victims/descendants by competing for recognition/resources)?*
      *   **Why #2?** While influenced by ontology, this operates on a distinct plane: the politics and ethics of memory. The Historikerstreit exemplifies this – the fury wasn't just about ontology, but about diluting the *singular* German responsibility and memory of the Holocaust by drawing parallels to Stalinism. This question addresses the *social function* of comparison/ranking.
      *   **Tractability:** Medium. Can be analyzed via case studies (memorial funding battles, curriculum debates, political speeches) and discourse analysis. Less abstract than (1).
      *   **Downstream Impact:** Clarifying this is crucial for implementing *any* comparative work ethically. If the objection is primarily about distributive justice in memory, it raises separate questions about power, representation, and victim prioritization that ontology alone doesn't resolve. It impacts how findings from (potentially resolved) (1) are *applied* and *received*.
      *   **Practical Payoff:** Directly relevant to real-world conflicts over commemoration, education, and reconciliation. Understanding this dynamic is vital for navigating the sensitivities your seminar encountered.
      *   **Confidence in Priority:** **High (85%)**. It's the most immediate social/political friction point arising from the *attempt* to compare, even if (1) is logically prior.

  3.  **(3) Transitional Justice & Proportionality:** *Does treating atrocities as incomparable undermine practical mechanisms (reparations, tribunals, truth commissions) that rely on notions of relative severity or proportionality?*
      *   **Why #3?** This is the most *applied* question, heavily dependent on the answers to (1) & (2). Transitional justice often *must* operate with imperfect comparisons (sentencing guidelines, reparations scales). The necessity often precedes perfect ontology.
      *   **Tractability:** High for empirical study (analyzing how specific TJ mechanisms *actually* handle comparisons), lower for normative resolution without (1).
      *   **Downstream Impact:** While crucial for post-conflict societies, its resolution depends heavily on the ontological and memorial justice frameworks established. It's a *test case* for the practical implications of (1) & (2).
      *   **Practical Payoff:** Very high for societies emerging from mass violence. Answers here have immediate consequences for victims and perpetrators.
      *   **Confidence in Priority:** **High (80%)** as the most concrete application, but it's logically downstream.

  **Relationship Between Tracks:**

  *   **(1) Ontology is Largely Upstream of (2) & (3):** Clarifying *what can be compared and how* fundamentally shapes the feasibility of comparing for memorial purposes (2) or justice purposes (3). If ontology shows qualitative incommensurability, it strengthens the epistemic strand of the "obscenity" claim in (2) and forces (3) to seek non-comparative justice models.
  *   **(2) Memorial Justice Runs on Partly Separate Tracks from (1):** Even if a coherent scalar ontology *is* established (resolving 1), the socio-political "obscenity" objection (2) based on distributive justice and recognition politics *persists*. You could logically accept comparability but still reject public ranking as socially destructive or harmful to specific victim groups. Conversely, resolving (2) (e.g., agreeing comparisons *are* primarily about resource competition) doesn't resolve the ontology (1); it just changes the *stakes* of the debate.
  *   **(3) Transitional Justice is Largely Downstream:** Its reliance on proportionality *assumes* some form of comparability is possible and ethically acceptable. It depends heavily on the outcomes/resolutions of (1) and (2). However, the *practical necessity* of TJ can also exert pressure *back* on (1) & (2), forcing compromises or pragmatic frameworks (e.g., "rough proportionality").

  **The Point I'm Least Sure About (Mostly Guessing):**

  *   **The precise weight of the "epistemic limits" vs. "distributive justice" strands within the "obscenity" objection (Point 2).** While I'm confident *both* exist, I'm guessing that in *most* contemporary academic/public debates (like your seminar), the **distributive justice/memorial recognition concern is currently the dominant driver of the "obscenity" reaction**, fueled by identity politics and competition for narrative space. The pure epistemic argument (we *truly cannot know*) feels less prominent now than the political/social claim (comparisons *harm* specific groups by relativizing their trauma in a competitive memory landscape). But this is an empirical claim needing discourse analysis across different contexts.

  **Summary:** Prioritize resolving the ontological possibility of comparison first, then tackle the socio-political ethics of memorial justice inherent in objections, before addressing the practical demands of transitional justice proportionality. **The core debate hinges first on whether historical evils can be meaningfully compared at all before addressing how or why we might do so.**
