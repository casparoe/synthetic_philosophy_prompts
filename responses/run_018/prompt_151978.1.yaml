  ### Taxonomy of Anthropic Reasoning Positions  
  **Root Scenario:** You discover your cognitive architecture (e.g., biological human vs. large-scale artificial neural network) is one of several physically possible types, with no prior reason to favor one's prevalence.  

  1. **First Branch:** Should this discovery update your beliefs about the total number of observers in your reference class?  
     - **No** → Proceed to Branch 3.  
     - **Yes** → Proceed to Branch 2.  

  2. **Second Branch (if Yes):** Should any such update depend on your indexical position (i.e., that you are one particular observer among many) or only on the non-indexical total population?  
     - **Depends on indexical position** → Proceed to Branch 3.  
     - **Only on non-indexical total population** → Proceed to Branch 3.  

  3. **Third Branch (asked in all paths):** Should a system capable of modeling its own reasoning treat its own existence as stronger evidence for universes containing more observers with its specific reasoning capacity? (Does this avoid or repeat the presumptuous-philosopher error?)  
     - **Yes** → Results in Leaf 3, 5, or 6.  
     - **No** → Results in Leaf 1, 2, or 4.  

  ---

  ### Leaves (Final Positions)  
  **Leaf 1: Cosmology-Only Rejection**  
  - *Path:* First Branch = No, Third Branch = No.  
  - *Awkward commitment:* You must treat your own existence as evidentially inert for both the total number of observers and the number sharing your cognitive architecture, despite having no prior bias among types.  

  **Leaf 2: Standard Self-Sampling**  
  - *Path:* First Branch = Yes, Second Branch = Indexical, Third Branch = No.  
  - *Awkward commitment:* You must accept that in a universe with vastly more artificial minds than biological ones, your biological cognition is highly atypical and inexplicable, yet you cannot adjust your beliefs to resolve this surprise.  

  **Leaf 3: Restricted Self-Indication**  
  - *Path:* First Branch = Yes, Second Branch = Non-indexical, Third Branch = Yes.  
  - *Awkward commitment:* You are forced to conclude that a universe teeming with observers of *other* architectures is less probable than one with only a few of your type, even if both fit cosmological data equally well.  

  **Leaf 4: Unrestricted Self-Indication**  
  - *Path:* First Branch = Yes, Second Branch = Non-indexical, Third Branch = No.  
  - *Awkward commitment:* You must accept that your existence alone licenses near-certainty in theories predicting astronomically large observer populations, without needing further empirical checks (repeats the presumptuous-philosopher error).  

  **Leaf 5: Unnamed (Restricted Self-Sampling)**  
  - *Path:* First Branch = Yes, Second Branch = Indexical, Third Branch = Yes.  
  - *Awkward commitment:* You must deny that discovering equally conscious non-human observers should affect your expectation of being human, effectively treating your cognitive architecture as a "cosmic coincidence" immune to evidence.  

  **Leaf 6: Unnamed (Self-Indication Without Global Update)**  
  - *Path:* First Branch = No, Third Branch = Yes.  
  - *Awkward commitment:* You are licensed to infer a near-infinite population of observers with your specific cognitive architecture without empirical checks, while refusing to update beliefs about the total number of observers.  

  ---

  ### Logically Missing Combinations  
  - **Gap 1:** First Branch = No, Second Branch = Indexical (any Third Branch answer).  
    - *Diagnosis:* Incoherent. If no update occurs, assigning an indexical/non-indexical character to that non-update is meaningless.  
  - **Gap 2:** First Branch = No, Second Branch = Non-indexical (any Third Branch answer).  
    - *Diagnosis:* Identical incoherence as Gap 1.  

  ---

  ### How to Use This Taxonomy  
  Answer the root question based on concrete cases (e.g., "Would an AI infer the same total observer count as a human upon learning their architecture?"), then follow branches without referencing position labels. Each leaf’s "awkward commitment" serves as a falsifiable signature of the position.
