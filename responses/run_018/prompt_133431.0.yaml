  The user's cases reveal a fascinating pattern: strong future-oriented behavior in retirement savings (30 years), climate action (200 years), and career planning (40 years), yet present-biased rejection of life-extension therapy (after age 90), pandemic prevention (50 years), and ultra-long-term charity (200 years). The pension relocation question at the end is particularly poignant given their family situation.

