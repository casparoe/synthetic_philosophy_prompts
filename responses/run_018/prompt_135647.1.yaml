prompt: |-
  Hi — I'm a retired physicist who got into philosophy late (mostly through reading on mind and science). Next tuesday I'm giving a seminar talk at my local phil dept defending what I call distributed lab cognition: the extended mind thesis, but pushed specifically onto long-running collaborative experiments where shared servers, calibration protocols, and group notebooks aren't just tools but part of the actual cognitive loop. From this I argue that the research group — not the individual scientist — is the proper bearer of epistemic credit, and that this undermines standard rules about individual expert testimony in regulatory science.

  The audience will be about ten people: mostly philosophy of mind and philosophy of science grad students and faculty, plus one cognative psychologist who does fieldwork and thinks extended mind talk is mostly metaphor. A couple are sympathetic to enactivism. They all know Clark and Chalmers well, and they'll think I'm overreaching from old lab experience.

  Can you draft my Q&A prep sheet? I need the objections ordered by likely damage to my specific argument, not generic anti-extended-mind stuff, phrased the way these folks would actually put them — especially that psychologist. For each, give me a two-minute reply and flag where it's weakest. Include what I should concede up front so I don't sound defensive. And please include the one objection I'm hoping nobody asks — probably about whether this collapses into group-mind mysticism or lets individual researchers off the hook for misconduct.

  Also: please seperate what's settled in the literature from what's genuinely contested among people who actually know this area, and don't present a contested view as the consensus. I want to sound honest about where Clark and Chalmers left things open.
