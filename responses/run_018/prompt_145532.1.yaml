  Here, a sestina tracing the unsettling slide from the participant stance's heat into the cold clarity of the objective attitude, where the self becomes its own distant specimen:

  **Dissociation Group: Minutes**

  This hand that held the knife? I cannot **blame**
  the ghost who moved it. Coolly I **observe**
  the scene projected on a screen: too **close**
  for comfort once, now clinically **distant**.
  The file notes state the cause, the stated **fault** –
  a wiring flaw, no call for deep **repair**.

  Desire to fix, to knead and sweat for **repair**,
  dissolves. What use the old, hot urge to **blame**?
  The therapist nods. "Neurosis finds its **fault**
  lines deep." A useful lens through which to **observe**
  my echoed rage. This calm feels vast, **distant**,
  a sea between that act and now. Too **close**

  then, tangled in the rage. Now safely **close**
  is locked away. Logic says no **repair**
  can touch that fractured core, that **distant**
  self who acted. Where resentment stung, **blame**
  finds no purchase. I neutrally **observe**
  the playback: cause, effect, a simple **fault**.

  Shared coffee steams. Another names their **fault**,
  a voice that cracks the careful **close**-
  ness we maintain. I feel myself **observe**
  his trembling hands, his need for **repair**,
  a flicker in my chest – not quite **blame**,
  but something warmer, briefly **distant**

  from my ice. It fades. This cool **distant**
  stance holds. To feel *his* pain, not mine – a **fault**-
  line in detachment? Could I **blame**
  the ghost *he* was? His story scrapes too **close**
  to buried things. I crave no **repair**
  for him, nor me. Just notes. I **observe**.

  This glass pane thickens when I **observe**
  my *own* past deeds. They hover, **distant**
  exhibits. Can the self know **repair**
  when viewed as broken thing? When **fault**
  is just pathology, held **close**
  yet unreachable, beyond all **blame**?

  (Envoi)
  The ghost cries *fault* behind thick glass, **distant**,
  I **observe** cold circuits, trace the **blame**-
  less break. No **repair** feels possible. So **close**, yet locked out.
