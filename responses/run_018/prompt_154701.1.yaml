  We are building a reusable checklist for an ethics panel to assess whether a research subject's consent is based on the right kind of reasons (evidential) or contaminated by wrong-kind reasons (pragmatic). The key feature is a counterfactual decoupling test in step 3.

  Theoretical background: 
  - Right-kind reasons (RKR): Evidential reasons that bear on the truth or the inherent value of the matter (e.g., believing in the science, altruism).
  - Wrong-kind reasons (WKR): Pragmatic reasons that are about the consequences of having the attitude (e.g., financial incentive, avoiding guilt).

  The procedure must be usable by non-philosophers in about 20 minutes per file.

  Flowchart Structure:
  1. Step 1: Identify stated reasons for consent.
  2. Step 2: Classify each reason as RKR or WKR (with guidance for judgment calls).
  3. Step 3: Counterfactual Decoupling Test (for cases with mixed reasons): 
     - Hold the RKR(s) constant.
     - Replace the WKR with an equally strong opposite pragmatic reason.
     - Ask: Would the consent attitude flip (i.e., the subject would refuse consent)?
       - If yes, then the WKR was load-bearing -> contaminated consent.
       - If no, then the RKR is sufficient -> valid consent.
  4. Step 4: Decision rules for mixed-motive cases (based on the above test).
  5. Step 5: Final determination.

  Rules for mixed-motive cases:
  - If Step 3 shows the consent would flip without the WKR (or with an opposite WKR), then the consent is contaminated.
  - If Step 3 shows the consent would not flip, then the consent is valid (the RKR is sufficient).

  Additionally, we note that the test in Step 3 is a thought experiment and requires judgment.

  Now, the flowchart in a step-by-step word-based format:

  **Ethics Panel Consent Assessment Checklist**

  **Step 1: Gather Reasons**
  - List all the reasons the subject has given for consenting to participate in the research.
  - (Judgment call: Sometimes reasons are not explicitly stated. Rely on notes from the consent interview, subject's statements, and context. If unclear, note uncertainty.)

  **Step 2: Initial Classification**
  - For each reason, classify it as:
    - **Right-Kind Reason (RKR)**: Reasons that directly relate to the research's purpose, value, or inherent properties (e.g., belief in the science, desire to help others, personal relevance of the research).
    - **Wrong-Kind Reason (WKR)**: Reasons that are about external pressures, incentives, or consequences (e.g., financial payment, fear of disappointing the doctor, avoiding guilt, gaining a reward).
  - (Judgment call: Some reasons may be borderline. When in doubt, note as "ambiguous" and carry to Step 3.)

  **Step 3: Counterfactual Decoupling Test (for cases with at least one WKR)**
  - If there are no WKRs, skip to Step 4 (consent is valid).
  - If there are WKRs (even one), perform the test:
    - Hold the RKR(s) constant (assume they are present and unchanged).
    - Imagine the subject faces an equally strong **opposite** pragmatic reason (WKR) instead of the one they have. For example:
        - If the subject is getting paid, imagine they are being charged a fee of the same amount (or the stipend is zero and they are told they must pay $500 to participate).
        - If the subject feels guilty saying no, imagine they are told by a trusted person that they should feel guilty for saying *yes* (or that they will be rewarded for saying no).
    - Ask: In this counterfactual scenario, would the subject **refuse** consent?
      - **Yes (attitude flips)**: The WKR was load-bearing. Consent is contaminated. Proceed to Step 4 with a red flag.
      - **No (attitude holds)**: The RKR is sufficient. Consent is valid despite the WKR.
  - (Judgment call: This step requires imagining the subject's reaction. Use the subject's statements, demeanor, and context. If the subject explicitly addressed this (like in Scenario B), that's evidence.)

  **Step 4: Decision Rules for Mixed Motives**
  - If Step 3 resulted in "attitude flips" (or if there are only WKRs and no RKRs), then consent is **contaminated**.
  - If Step 3 resulted in "attitude holds" (or if there are no WKRs), then consent is **valid**.
  - If there are ambiguous reasons from Step 2 that were not resolved in Step 3, the panel must discuss and vote on whether they are likely RKR or WKR and re-run Step 3 if needed.

  **Step 5: Final Determination**
  - **Valid Consent**: Proceed with enrollment.
  - **Contaminated Consent**: The panel must reject the consent. The research team must re-consent the subject, addressing the problematic reasons (e.g., removing undue pressure, clarifying voluntary nature) or exclude the subject.

