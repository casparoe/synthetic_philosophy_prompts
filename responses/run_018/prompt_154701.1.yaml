prompt: |-
  hey so i'm trying to build a reusable checklist for our small ethics panel. we meet every other thursday, usually tired, and we have about twenty minites per file to decide if a research subject's consent is based on the right kind of reasons or contaminated by wrong-kind ones. the theoretical background is the wrong-kind-reasons problem — pragmatic reasons for belief or attitude that shouldn't be doing the motivational work — but i need it turned into an actual procedure three non-philosophers can run without a textbook.

  the niche twist: i want step three to be a counterfactual decoupling test. that's my own injection, not standard doctrine — you hold the evidential reason constant but imagine the pragmatic reason is replaced by an equally strong opposite one. if the consent attitude would flip, the wrong-kind reason was load-bearing; if it holds, the right-kind reason is doing the work. build that into the flowchart explicitly, with ordered tests before and after it.

  deliverable: a word-flowchart with clear steps, markers for "this is a judgment call dressed up as procedure," and rules for mixed-motive cases. apply it to three scenarios:

  A. a terminal patient enrolling because she genuinely wants to help future patients, but also admits she feels guilty saying no to the oncologist she likes.

  B. a healthy volunteer who claims he believes in the science and also needs the $500 stipend to pay rent — but insists he'd still enroll if the stipend were zero.

  C. the unwelcome case: the checklist outputs "contaminated," the patient is going to be furious, and the PI is going to yell at us. show exactly what the procedure directs and what we do with that answer.

  then tell me flat-out what this procedure can't catch — hidden motives, socially desirable answers, whatever — and separate what's actually settled in the literature from what's genuinely contested. don't present a disputed boundary as consensus. no bibliography please; i don't want anything a model without web access has to guess at.
