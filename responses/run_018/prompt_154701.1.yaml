  - If the output is "contaminated", the procedure directs:
    - The panel must reject the consent and document the reasons (citing the counterfactual test result).
    - The subject cannot be enrolled based on this consent.
    - The research team (PI) must be informed that the consent was invalid due to contamination by wrong-kind reasons and that re-consent is required after mitigating the WKR (if possible).
  - What the panel does with that answer:
    - The panel's role is to protect the subject. They must stand by the procedure even if the PI is angry. The panel should document the decision and the specific reasons (from the test) to justify the rejection.

  Now, applying the checklist to the three scenarios:

