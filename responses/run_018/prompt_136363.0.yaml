answer: |-
  ### Brainstorming Distinctions
  The standard paradox of phenomenal judgment for epiphenomenalists is distinct in three ways:  
  - **Vs. General Self-Knowledge Puzzles**: It targets *introspective reports about qualia specifically*, questioning how *causally inert* phenomenal properties could generate knowledge of themselves, whereas general self-knowledge issues (e.g., about beliefs) need not deny causal efficacy.  
  - **Vs. Causal Exclusion**: While exclusion worries about mental/physical overdetermination, the paradox centers on *introspection’s reliability*: if neural states alone cause all judgments, why are reports about pain (not itch) accurate, if pain’s phenomenology does no causal work?  
  - **Vs. Introspection Reliability**: Standard debates assume phenomenology *can* cause judgments but may be misreported. Epiphenomenalism makes phenomenology *causally irrelevant* to its own representation, threatening not just reliability but *reference itself*.  

  ---

  ### PhD Comprehensive Exam Question  
  **Time Allowed**: 90 minutes  
  **Expected Length**: Approximately 600 words  
  **Task**:  
  Evaluate the proposed *disjunctive phenomenal concept strategy* as a solution to the paradox of phenomenal judgment under epiphenomenalism. According to this strategy, a concept like PAIN is disjunctive: it refers to the phenomenal quality of pain (when phenomenology is causally accessible) *or* to its precise neural correlate N (when phenomenology is causally inaccessible). Does this strategy resolve the threat that epiphenomenalism undermines the accuracy of phenomenal judgments, or does it merely relocate the reference-fixing problem? In your response, address:  
  (i) Whether such a disjunctive concept can genuinely refer to the *phenomenal quality* itself (rather than collapsing into reference to N),  
  (ii) How this strategy impacts *first-person authority* if the subject cannot know which disjunct (phenomenal or neural) is activated in a given judgment,  
  (iii) Whether it violates the *causal closure of the physical domain* differently than standard epiphenomenalism.  
  Conclude by judging whether the strategy saves epiphenomenalism, reduces to physicalism, or leads to skepticism.  

  ---

  ### Model Answer (605 words)  
  The paradox of phenomenal judgment challenges epiphenomenalism by asserting that if conscious states lack causal efficacy, judgments about them cannot be *both* causally explained *and* accurate. Causal closure implies that physical states (e.g., neural processes) alone cause judgments. If phenomenology (e.g., the hurtfulness of pain) is causally inert, it cannot cause or explain why a judgment “I am in pain” is reliably *about* pain rather than another state. This renders accurate phenomenal judgments inexplicable, self-undermining epiphenomenalism itself.  

  The disjunctive phenomenal concept strategy proposes that PAIN refers disjunctively: to the phenomenal quality Q (when Q is causally accessible) *or* to its neural correlate N (when Q is not causally accessible). Under epiphenomenalism, Q is never causally accessible, so in practice, PAIN refers to N. Yet proponents suggest that the concept’s *disjunctive structure* preserves reference to Q by retaining it as a notional component. This appears to resolve the paradox: judgments like “I am in PAIN” are caused by N (respecting causal closure) and can be accurate because PAIN non-accidentally picks out N (which co-occurs with Q).  

  However, this strategy fails to secure genuine reference to phenomenal qualities. For (i), even if the concept includes Q in its disjunction, the *actual mechanism of reference-fixing* defaults to N. Epiphenomenalism ensures Q cannot ground the concept’s application, as subjects cannot discriminate Q from other states or fix reference via ostension. The disjunction thus semantically collapses: PAIN refers *only* to N, as Q is a causally idle component. What presents as a phenomenal concept is covertly a neurophysical concept, abandoning the phenomenology epiphenomenalism aims to preserve.  

  Regarding (ii), first-person authority erodes. Subjects judge “I am in PAIN” based on neural cues, unaware whether Q or N is referenced. Yet authority traditionally requires direct, non-inferential access to phenomenology. Here, subjects cannot know if their judgment tracks Q or merely N. If Q is epiphenomenal, they lack grounds to assert that PAIN ever captures their experience rather than its correlate. Authority reduces to reliable neuro-causal reports, rendering claims like “I know what pain *feels like*” unjustifiable—a skeptical outcome.  

  For (iii), the strategy violates causal closure differently than standard epiphenomenalism. Standard epiphenomenalism posits non-physical Q as a byproduct, violating closure only if Q has effects (which it denies). The disjunctive strategy, however, implies that *concept reference* depends on two distinct ontological grounds (Q and N). But if Q is causally irrelevant, the concept’s ability to “reach” Q requires a non-causal, non-physical relation (e.g., brute intentionality), introducing a *semantic* violation of physical closure. This is subtler than standard causal worries but equally problematic: how can a physically caused concept reliably refer to an entity outside the physical causal network?  

  Ultimately, the disjunctive strategy collapses into either covert physicalism or skepticism. If PAIN refers stably to N, it reduces phenomenal discourse to neural states, abandoning epiphenomenalism’s core claim that Q is distinct yet real. If it insists Q is part of the reference, but cannot explain how judgments latch onto it without causal mediation, skepticism follows: we cannot know if our concepts capture phenomenology at all. The reference-fixing problem is not solved but concealed, as the disjunction’s Q-wing remains causally and epistemically idle. Epiphenomenalism thus remains self-undermining—phenomenal judgments can be accurate only by abandoning the reality of phenomenology itself.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **A Answer (16–20)**: Hits all five criteria below. A B answer (12–15) omits/mishandles one criterion.  

  1. **Core Paradox Articulation (4 marks)**  
     - *A Move*: Clearly states that causal closure + epiphenomenalism make accurate phenomenal judgments inexplicable, risking self-refutation.  
     - *B Failure*: Vaguely describes the paradox or confuses it with general worries about mental causation.  

  2. **Disjunctive Strategy Exposition (4 marks)**  
     - *A Move*: Precisely presents the dual-reference mechanism (Q/N disjunct) and its goal: decoupling accuracy from phenomenal causation.  
     - *B Failure*: Misrepresents it as a type-type identity theory or conflates it with conceptual dualism.  

  3. **Reference-Fixing Critique (i) (4 marks)**  
     - *A Move*: Argues that causal inaccessibility of Q collapses reference to N, making Q semantically redundant.  
     - *B Failure*: Assumes disjunctions inherently preserve reference without explaining *how* Q is fixed without causal contact.  

  4. **First-Person Authority Analysis (ii) (4 marks)**  
     - *A Move*: Shows that ignorance of the active disjunct undermines the subject’s ability to claim direct knowledge of phenomenology.  
     - *B Failure*: Only notes uncertainty generically, without tying it to the disjunction’s structure or epiphenomenalism.  

  5. **Closure Violation Diagnosis (iii) (4 marks)**  
     - *A Move*: Contrasts standard epiphenomenalism’s causal inertness with the strategy’s non-causal semantic relation violating physical closure.  
     - *B Failure*: Treats closure violation identically to standard epiphenomenalism or overlooks semantic implications.
