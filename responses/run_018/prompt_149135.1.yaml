prompt: |-
  hey i'm in this african philosophy seminar and we're deep in ubuntu stuff right now - "i am because we are" and all that. but my prof dropped this distinction that's been bugging me: is ubuntu making a metaphysical claim that personhood is literally built out of social releations, or is it more of an ethical framework about how we ought to recognize each other? i want to write a dialogue for practice (not graded, just for fun) between two grad students who both actually get the literature but disagree on this exact point. one should defend the strong ontological reading - like if you're exiled or choose total isolation, you're not just lonely but actually diminished in your status as a person. the other should push back with a normative relational view that says recognition is moral, not constitutive, so an isolated person still has full moral standing even if the community fails them. they should actually listen to each other instead of talking past, maybe arguing over coffee in the grad lounge about a specific case - like a hermit philosopher who refuses all contact. can you write that? keep it casual, don't make either side sound like a strawman, and please don't turn it into a textbook transcript. i'm writing this between classes so sorry if it's rambly.
