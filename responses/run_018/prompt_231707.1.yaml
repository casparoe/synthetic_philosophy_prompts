  Hmm, the challenge is designing rules simple enough for undergrads to follow but complex enough to generate observable group intelligence. The user specifically requested no initial lecture and no mention of "Aunt Hillary" until debrief. They want students to experience the disconnect between individual ignorance and collective wisdom viscerally.

  Right, the core mechanics should involve: 
  - Local interactions only (no global awareness)
  - Emergent problem-solving (nest site selection seems ideal)
  - Clear "Aha!" moment when group behaviour appears intentional

  For the nest selection task, I'll adapt ant colony optimisation principles but simplify drastically. Using coloured tokens for "scout reports" and pheromone trails represented by counters on the floor should work. The key is ensuring no single ant knows which nest is "best" - they just follow local signals.

  Ah, materials are straightforward: paper tokens, floor mats, role cards. The timeline must be tight - 15 min setup, 50 min gameplay split into exploration and migration phases, 25 min debrief. Critical to build in observation pauses where students note their limited perspective.

  Predictable pitfalls: 
  - Students might try to "game" the system by communicating globally (must enforce silence)
  - Token system could bottleneck (need redundancy)
  - Emergence might be too slow (require a timer)

  The simulation won't capture the sheer scale of real colonies or the question of inner life - but that's fine. The debrief will explicitly map moments like "token accumulation" to the explanatory gap in Aunt Hillary. Ending with Dennett's intentional stance versus Searle's Chinese Room should spark good debate.

  Best emphasise the British English phrasing throughout, particularly in role cards and debrief questions. Terms like "rubbish bin" for trash can, "quieten down" etc.
answer: |-
  Here’s a 90-minute simulation designed for 16 students, titled **"The Nest Decision Game"**, using British English throughout. It forces students to experience emergent "intelligence" at the colony level while acting as individually clueless ants.

  **Core Objective:**  
  The colony must collectively "choose" the best new nest site (Site A or Site B) based on simulated scouting reports, without any ant knowing the global state or goal. Site A is objectively better (e.g., larger, safer), signalled only by a token system.

  **Materials:**  
  - **Floor Mats:** 3 large mats (or taped areas): "Old Nest" (centre), "Site A" (good, left), "Site B" (poor, right).  
  - **Tokens:**  
    - *Scout Reports:* 40x **Blue** tokens (representing "good" signals for Site A), 20x **Red** tokens ("poor" signals for Site B).  
    - *Pheromones:* 100+ small **Yellow** counters (for trail strength).  
  - **Role Cards:** 16 cards (laminated if possible):  
    - 4x **SCOUTS** ("Find sites, bring back reports")  
    - 10x **WORKERS** ("Follow trails; drop/count pheromones; carry others")  
    - 2x **QUEEN CARRIERS** ("Get ‘carried’ when enough pheromones accumulate")  
  - **Timers:** 1x teacher’s stopwatch/timer.  
  - **Observation Sheets:** Simple notepads for students to jot down their "ant’s perspective" during pauses.  
  - **Signage:** Labels for Old Nest, Site A, Site B.  

  ---

  ### Game Rules & Student Instructions  
  *(Hand out role cards silently. No explanation of overall goal. Students only know their ant type’s rules.)*  

  1. **SETUP (10 mins):**  
     - Lay out mats. Place all tokens in a central "rubbish bin" (Old Nest).  
     - Assign roles: 4 Scouts, 10 Workers, 2 Queen Carriers.  
     - **Scouts:** Start at Old Nest. Take 1 random token (Blue/Red) when leaving.  
     - **Workers:** Start at Old Nest. Can carry 1 token OR drop 1 yellow counter per move.  
     - **Queen Carriers:** Sit at Old Nest. Can only move if 4+ yellow counters are placed on their mat *simultaneously*.  

  2. **PHASE 1: EXPLORATION (25 mins)**  
     - **Scouts:**  
       - Must visit **both** sites (A & B) in any order.  
       - When leaving a site, take a token matching its quality: **Blue for Site A, Red for Site B**.  
       - Return token to Old Nest. Drop it, take a new random token, repeat.  
     - **Workers:**  
       - Wander randomly between Old Nest/Site A/Site B.  
       - **Rule 1:** If you see a token (Blue/Red) at a site/old nest, pick it up and carry it to the *other* site (if at Old Nest, carry to either site; if at a site, carry to Old Nest).  
       - **Rule 2:** Every time you move *to* a location, drop 1 yellow counter ("pheromone") there.  
       - **Rule 3:** If you see 3+ yellow counters at a location, "follow the trail": move directly to the location with the *most* yellow counters next turn.  
     - **Queen Carriers:**  
       - Stay at Old Nest. If 4+ yellow counters are placed on your mat *at the same time* (e.g., by multiple workers in one turn), you can be carried to a site by those workers.  

  3. **PHASE 2: MIGRATION (15 mins)**  
     - Begin when the first Queen Carrier is moved OR after 25 mins.  
     - **All ants:** Focus shifts to moving Queen Carriers to a site.  
     - Workers can now carry Queen Carriers if they coordinate (physically support them).  
     - **GOAL:** The colony "chooses" Site A if both Queen Carriers end up there. Site B if both go there. Mixed = failure.  

  4. **PAUSE POINTS (During Phases 1 & 2):**  
     - **Pause 1 (10 mins in):** *"Jot down: What do you know? What are you trying to do?"*  
     - **Pause 2 (20 mins in):** *"Jot down: What seems to be happening? Where are tokens/counters accumulating?"*  
     - **Pause 3 (Migration Phase):** *"Jot down: Why are you moving the Queen? How do you know where to go?"*  

  ---

  ### Predictable Problems & Limitations  
  - **What Will Go Wrong:**  
    - Scouts may hoard tokens or ignore sites. *Fix: Remind them to visit both sites.*  
    - Workers might cluster, creating phantom "trails" to nowhere. *Fix: Redirect them to follow counter density.*  
    - Queen Carriers might be moved too early by overeager Workers. *Fix: Strictly enforce the 4-counter rule.*  
    - Decision may be too slow. *Fix: Add more tokens if needed; subtly nudge Scouts.*  
  - **What the Simulation CAN’T Capture:**  
    - **Scale:** Real colonies have thousands/millions of ants; here, individual choices are too visible.  
    - **Chemical Realism:** Tokens/counters are crude stand-ins for pheromone gradients.  
    - **Inner Life:** The simulation shows *functional* emergence, not subjective experience (the "hard problem" for Aunt Hillary).  

  ---

  ### Debrief (25 mins)  
  **Link each moment to Aunt Hillary:**  

  1. **"What did your ant know?"**  
     - *Students:* "I just moved tokens/followed counters."  
     - *Link:* "Like individual ants, you had no concept of ‘choosing a nest’. Aunt Hillary’s ‘moods’ aren’t in any single ant."  

  2. **"Where was the decision made?"**  
     - Highlight token accumulation (Blue tokens pile at Site A), pheromone trails (yellow counters to Site A), Queen migration.  
     - *Link:* "The ‘decision’ emerged from token flows and trail-following. Aunt Hillary’s ‘beliefs’ are patterns in ant interactions."  

  3. **"Did any ant understand the colony’s goal?"**  
     - Workers followed local rules; Scouts just shuttled tokens.  
     - *Link:* "No ant ‘knew’ the colony was relocating. Aunt Hillary’s ‘intentions’ aren’t in any ant’s head."  

  4. **"Is ‘the colony decided’ a real explanation?"**  
     - Contrast views:  
       - *Useful shorthand:* "It describes the outcome efficiently."  
       - *Genuine explanation:* "The rules caused the outcome; the colony is the only entity that ‘acted’."  
     - **Introduce "Aunt Hillary"**: "This is Hofstadter’s thought experiment: is the colony’s mind *real*, or just a metaphor?"  

  5. **Philosophical Hook:**  
     - *"If the colony ‘decided’, but no ant knew, where does the decision live? Is this how *our* brains work? Neurons aren’t conscious – is your mind an ‘Aunt Hillary’?"*  

  ---

  **Why this works:**  
  - Students *feel* the disconnect between their ant’s simple rules and the colony’s complex outcome.  
  - The Queen’s migration creates a clear "intentional" moment.  
  - Debrief ties mechanics directly to the puzzle’s core: **explanation vs. description, emergence vs. reductionism.**  
  - No upfront lecture preserves the "aha!" when Aunt Hillary is revealed.  

  **Final Tip:** Run it twice if time allows – groups improve drastically once they grasp the emergent logic!
