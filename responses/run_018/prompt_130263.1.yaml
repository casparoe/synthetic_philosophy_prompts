answer: |-
  Here's a decision tree for the paradox of fiction, designed as a flowchart for your handout. Each split addresses a concrete philosophical claim, and endpoints map to major positions. The logic prioritizes undergraduate accessibility while preserving philosophical rigor.

  ---

  ### **Paradox of Fiction: Decision Tree**
  *Start here →*  
  **Q1: Is your emotional reaction to fiction *phenomenologically identical* to real-world grief?**  
  *(i.e., Does crying at a movie death feel subjectively the same as crying at a real death?)*  

  ---

  #### **Branch 1: YES, it feels the same**  
  → **Q2: Must genuine emotions have a real object to be rational?**  
  *(i.e., Can you rationally grieve something you know doesn’t exist?)*  
  - **YES** → **Radford’s Irrationality View**  
    *Position:* Emotions toward fiction are irrational (you’re inconsistent for grieving a non-existent thing).  
  - **NO** → **Deflationary (No-Paradox) View**  
    *Position:* No paradox exists. Fiction-triggered emotions are rational; belief in existence isn’t required for affect (e.g., you grieve the *idea* of loss).  

  ---

  #### **Branch 2: NO, it’s a different mental state**  
  → **Q3: Can an emotion be "fragmented"?**  
  *(i.e., Is your response partly *about* the story-world and partly free-floating, not "aimed" at anything actual?)*  
  - **YES** → **Currie’s Simulation Theory**  
    *Position:* You feel "offline" simulated emotions (fragmented affect from mentally rehearsing a tragedy).  
  - **NO** → **Q4: Can fiction-triggered emotions be appropriate *without* real targets?**  
    *(i.e., Is it reasonable to feel *any* emotion toward purely fictional events?)*  
    - **YES** → **Walton’s Make-Believe**  
      *Position:* You feel quasi-emotions (pretend feelings) as part of a game of make-believe.  
    - **NO** → **⚠️ Incoherent Combo (Unexplored)**  
      *Diagnosis:* If emotions are *different* from real ones but *must* have real objects to be appropriate, yet fiction lacks real objects → emotional responses become impossible. This conflates criteria for "real emotion" with a denial of fiction’s capacity to satisfy them.  

  ---

  ### **Key Features & Notes**  
  1. **Named Positions Mapped:**  
     - Radford: "Same state + needs real object" → Irrational.  
     - Deflationary: "Same state + no real object needed" → No paradox.  
     - Walton: "Different state + unfragmented + appropriate" → Quasi-emotions.  
     - Currie: "Different state + fragmented" → Simulated emotions.  
     - Coleridge: Implicitly in **Deflationary** or **Walton** (suspension of disbelief enables quasi/simulated states).  

  2. **Incoherent Combo:**  
     - *Branch:* Different state + unfragmented + inappropriate (Q4 → "NO").  
     - *Why empty?* Claims emotions are distinct from real ones *and* require real objects, but denies fiction can provide appropriateness. This makes fictional emotion impossible—contradicting lived experience.  

  3. **Indistinguishable Pair:**  
     - The tree **cannot separate Walton from early Coleridge interpretations**. Both endorse "different mental state + appropriateness," but Walton’s quasi-emotions are more systematic. For a handout, grouping them under "Pretense Theories" is practical.  

  4. **Undergrad-Friendly Logic:**  
     - All questions rely on introspection (e.g., *"Does it feel the same?"*) or basic logic (e.g., *"Must emotions target real things?"*).  
     - No prior knowledge of theorists needed—positions explain the *consequence* of answers.  

  ---

  ### **Tree Summary Visual**  
  ```  
  Start → Q1 (Same feeling?)  
  │  
  ├─ YES → Q2 (Needs real object?) → YES → Radford | NO → Deflationary  
  │  
  └─ NO → Q3 (Fragmented?) → YES → Currie | NO → Q4 (Appropriate?) → YES → Walton | NO → INCOHERENT  
  ```  

  This structure covers core positions in 5 leaves (+1 incoherent), uses actionable splits, and resolves the paradox through embodied logic—not name-dropping. Ideal for seminar debate!
