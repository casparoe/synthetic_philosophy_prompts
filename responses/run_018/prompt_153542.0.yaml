prompt: |-
  I have recently begun overseeing dispatch for a delivery platform in which drivers are evaluated solely by customers, and those aggregated ratings determine shift access and bonuses, while customers are never evaluated in turn and hold no institutional status as co-producers of the service. What conception of intersubjective recognition—read through Hegel's master-slave dialectic—does this one-sided architecture implicitly presuppose? Reconstruct the theory of self-consciousness and social acknowledgment built into the design, indicate whether the asymmetry structurally reproduces the master's unstable dependence on the slave's recognition or whether a control-based account of agency can explain it without that dynamic, and distinguish what the practice strictly requires philosophically from what is merely contingent on this particular rating technology. Please separate settled interpretations of the dialectic from views that remain genuinely contested among scholars who work on Hegel, and deliver the answer as exactly five numbered points, each one or two sentences long, with no introduction or conclusion.
