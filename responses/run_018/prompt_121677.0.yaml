prompt: |-
  I'm putting together the final for my upper-level formal epistemology seminar (mostly advanced undergrads, a couple of MA students sitting in) and I need one genuinely hard question on Jeffrey conditionalization. Last year's version was a disaster in the sense that it was too easy: everyone just wrote down P'(H) = Σᵢ P(H|Eᵢ)qᵢ, said the word "rigidity," noted that the rule doesn't commute, and walked out with an A. So I want a question where that package of facts is at best a B, maybe a C. What I'm after is the crux underneath it. Two things I keep circling around. First: is Jeffrey's rule actually a new, non-Bayesian rule of inference, or is it ordinary conditioning in a bigger space — I have a feeling you can always cook up some extra "virtual" evidence proposition in an extended algebra that reproduces the Jeffrey shift, and that when you look at what has to be true of that proposition, rigidity turns out to be a screening-off / conditional independence assumption rather than a logical truth, but I can't quite turn that into a question rather than a lecture. Second: the non-commutativity. I want them to actually compute a two-partition case in both orders, see the numbers differ, and then say whether that's a defect in the rule or a sign that a description like "your new probability for Gⱼ is rⱼ" is leaving something out — and if so, what extra information would pin the result down. If you think the question works better as one essay prompt than as parts, go with that, I don't care about the format. Please don't use the dim-light / cloth-looks-green example from the reading, they've all rehearsed it to death — pick some other imperfect-observation setup.

  A few constraints. Whatever numbers you put in the model answer, please actually check the arithmetic, I've been burned by that before; aim for a model answer of around 700 words and a total of 25 marks. And I'd like the marking scheme to be built around named moves rather than word count: for each chunk of marks, say what the A answer does that a B answer doesn't, and name the specific misconception that chunk is defending against. The ones I actually see in papers are: thinking Jeffrey conditioning is just ordinary conditioning on the most likely cell of the partition; confusing rigidity with independence between the hypothesis and the partition; saying the order-dependence shows the rule is incoherent; and proposing to fix the order-dependence by averaging the two orders. There's probably a fifth one I'm forgetting, so feel free to add.

  Also — and this matters for the actual exam, not just for me — please write the question so it doesn't depend on anyone remembering who published what. Our library proxy has been down for four days and I can't check a single reference, so no "discuss so-and-so's 1978 reply" style parts; students shouldn't need them either. Relatedly, there's a half-memory I'd love to use if it's right and drop if it isn't: that when the constraints you're updating on form a proper partition, the minimum-information / minimise-relative-entropy rule and Jeffrey's rule give the same answer, but that they come apart when the constraints are on overlapping events instead of a partition. If that's correct and it fits, a short final part on it would be great; if I've got it muddled, leave it out, I really can't verify it right now.
