prompt: |-
  I'm taking a course on social ontology and find the Lewis literature a little dry, but my friend talked me into moderating a podcast interveiw next week with a philosopher who just wrote a book extending David Lewis's account of convention to what she calls distributed micro-norms — like the unwritten rules for correcting strangers in open-source threads, or the etiquette of reblogging without attribution. She insists she's still doing straight Lewisian work, not just evolutionary game theory, but I have a feeling she'll deflect hard questions by saying the digital context is only a fresh application of the same old framework.

  Could you draft seven or eight interview questions that actually press on the content? I want at least one that targets the common-knowledge requirement when participants are anonymous and constantly rotating in and out, one that asks whether the arbitrariness condition collapses when platform architecture forces specific coordination points, and one about what the clause about behavior being regular across the group even means when enforcement is partly handled by bots or algorithms. For each of those, please include the follow-up she's most likely to use — maybe something about scalability or about treating algorithms as part of the agent pool — and then the sharper counter-follow-up that makes the dodge harder. Write the response in American English, and please don't include any requests for bibliographies, citations, or reading lists; I want her to defend the position directly, not name-drop papers.
reasoning: |-
  Okay, the user is preparing for a podcast interview with a philosopher who's extending David Lewis's theory of conventions to distributed micro-norms in digital spaces. They need questions that press on the core concepts, especially anonymity, platform architecture, and algorithmic enforcement. 

  First, I need to recall Lewis's key elements: conventions as solutions to coordination problems, requiring common knowledge, arbitrariness, and regularity in behavior. The interviewee claims she's doing "straight Lewisian work," not just evolutionary game theory. The user wants to challenge this by highlighting digital disruptions to these elements.

  The user specifically requested three targeted questions:  
  - Common knowledge with anonymity/rotation  
  - Arbitrariness under platform constraints  
  - Behavioral regularity with bot enforcement  
  ...plus follow-ups and counter-follow-ups for each.  

  For common knowledge: Anonymity and high turnover in digital spaces (like open-source forums) seem to break Lewis's requirement that everyone knows everyone knows the norm. The philosopher might dodge by saying norms scale through layered knowledge (e.g., "regulars know"). Counter: Point out how ephemeral interactions prevent the iterative "I know you know" buildup.  

  For arbitrariness: Platforms force specific coordination points (e.g., upvote buttons, mandatory tags). If there's only one viable option, is it still arbitrary? Likely dodge: "Architecture is just a new type of precedent." Counter: Press whether norms lose contingency if they're platform-mandated—could a functionally identical alternative exist?  

  For regularity: When bots enforce norms (e.g., auto-deleting posts), is it still "group behavior"? Dodge: "Treat algorithms as part of the agent pool." Counter: Ask if norm origins matter—if devs program bots, is it top-down imposition masquerading as convention?  

  Beyond these, I'll add questions on:  
  - How micro-norms solve coordination problems (vs. just efficiency)  
  - Distinguishing conventions from platform rules  
  - Punishment/reward mechanisms in Lewis's framework  
  - Whether hyper-specialized micro-norms fragment common knowledge  

  Tone should be rigorous but conversational—no citations, just direct philosophical pressure. User clearly wants to avoid letting her hide behind "it's just an application."  

  Counter-follow-ups need to anticipate her defenses and cut off escape routes. For example, if she says bots are "part of the group," push on whether that stretches Lewis's individual rationality assumption.  

  User's frustration with Lewis being "dry" suggests questions should feel lively. Analogies (e.g., "Is this like calling traffic lights a convention?") might help.  

  Finally, structure: Lead with big-picture convention definition, then hit the three user-requested questions hard, then broaden to fragmentation/legitimacy. Each question should stand alone but build pressure cumulatively.
answer: |-
  Here are eight targeted questions designed to press the philosophical content of extending Lewis's conventions to "distributed micro-norms," complete with anticipated dodges and sharper counter-follow-ups:

  1.  **Core Function Question:** Lewis defines conventions as solutions to *recurrent coordination problems* where agents have a *preference for conformity conditional on others conforming*. Many digital micro-norms (like specific reblogging etiquette) seem driven more by efficiency, fairness, or avoiding conflict, not coordinating interdependent actions. **Can you clearly articulate the *underlying coordination problem* that a specific micro-norm in an open-source thread or reblogging chain actually solves, and demonstrate the conditional preference for conformity?**
      *   *Likely Dodge:* "These norms solve coordination problems about *attention economy* or *conflict resolution*, which are fundamental to collaborative/communal spaces."
      *   *Counter:* "But Lewis's coordination problems require interdependent *actions* where my best move depends *directly* on predicting yours (like driving on a side of the road). Doesn't 'avoiding conflict' or 'managing attention' describe a *desired outcome*, not the structure of the interdependent action problem itself? How does liking a correction *coordinate* our actions?"

  2.  **Common Knowledge & Anonymity/Rotation:** Lewis hinges convention on *common knowledge*: everyone knows the regularity, knows others know it, knows others know they know it, etc. **How can this infinite regress of mutual knowledge possibly be sustained in spaces with high anonymity, pseudonymity, and constant participant churn, where newcomers arrive daily and lurkers vastly outnumber active participants?**
      *   *Likely Dodge:* "Common knowledge scales through *nested expectations* or *salient patterns*. Regular participants know the norms exist and are broadly known among *active* participants; newcomers observe and infer quickly from public interactions/bots."
      *   *Counter:* "Lewisian common knowledge requires *each agent* to have justified beliefs about *every other agent's* knowledge/beliefs. In an anonymous, high-churn environment, how can *any* participant, especially a newcomer, have justified beliefs about what *that specific anonymous stranger* knows about the norm, let alone infinite regress? Doesn't this reduce to mere *prevalence* or *expectation*, collapsing the distinct Lewisian requirement?"

  3.  **Arbitrariness & Platform Constraints:** A key feature of Lewisian conventions is *arbitrariness* – another regularity could have served the same coordination purpose equally well (e.g., driving left vs. right). **When platform architecture (like mandatory upvote/downvote systems, predefined reaction emojis, or algorithmic sorting) *forces* specific coordination points or drastically limits viable alternatives, doesn't this erode the arbitrariness condition? Are these norms conventions, or just users adapting to top-down constraints?**
      *   *Likely Dodge:* "The arbitrariness lies in *how* the affordance is used! The *meaning* or *specific etiquette* attached to an upvote, or *when* to use a specific reaction, is still conventional and could be different (e.g., Stack Overflow vs. Reddit upvotes). The architecture provides the coordination point, but the *norm* governing its use is arbitrary."
      *   *Counter:* "But if the platform mandates *the functional coordination mechanism itself* (you *must* use this button for agreement, posts *must* be tagged X for visibility), doesn't that remove the possibility of a genuinely *alternative* solution emerging from the group? Could a functionally equivalent but *different* coordination point realistically emerge and stabilize without platform changes? Isn't the lack of true alternatives a sign it's dictated, not conventional?"

  4.  **Regularity & Bot/Algorithm Enforcement:** Lewis requires a *regularity in behavior* across the group. **When enforcement or even initiation of norm-conforming behavior (e.g., auto-mod bots deleting non-attributed reblogs, algorithms downranking certain posts) is handled significantly by non-human agents (bots/algorithms), does this still constitute a 'regularity in the behavior *of the group*'? Or does it fundamentally change the nature of the norm?**
      *   *Likely Dodge:* "We should treat the algorithm/bot as part of the *environment* or, more usefully, as a *participant* in the system. The group's regularity includes *interacting with and relying on* these automated enforcers."
      *   *Counter:* "Lewisian conventions emerge from the *strategic interactions of rational individuals* responding to each other. If the primary enforcer is a non-sentient agent programmed by a third party (platform devs), doesn't that shift the source of the regularity from mutual expectations among peers to compliance with an external rule-enforcer? How is this meaningfully different from obeying platform *rules* rather than developing a *convention*?"

  5.  **Punishment/Reward Mechanism:** Lewis downplays explicit punishment, focusing on the conditional preference for conformity based on the coordination payoff. Yet, many micro-norms you describe seem enforced by social sanction (downvotes, public call-outs, blocking). **Doesn't this reliance on explicit, often decentralized, punishment/reward mechanisms move these micro-norms closer to *social norms* or *institutional rules* as described by others (e.g., Bicchieri), rather than pure Lewisian conventions based primarily on coordination gains?**
      *   *Likely Dodge:* "The sanctions *are* part of the coordination payoff! Avoiding social sanction *is* the benefit of conformity, and inflicting it is the cost of deviance, sustaining the conditional preference."
      *   *Counter:* "But Lewisian coordination gains are typically *inherent* to solving the problem (e.g., not crashing). Sanctions are an *added*, extrinsic cost. If the *primary* motivation for conformity is fear of sanction rather than achieving the coordination benefit itself, doesn't that fundamentally alter the psychological and strategic structure Lewis described?"

  6.  **Fragmentation & Hyper-Specificity:** Lewisian conventions are typically broad and stable within a population. Digital micro-norms often seem hyper-specific (e.g., norms in *this* subreddit, norms for *this* type of PR comment on *this* GitHub project) and can fragment rapidly. **Doesn't this extreme localization and volatility challenge the idea of a stable 'population' or 'group' necessary for a Lewisian convention to emerge and persist? Where do you draw the boundary of the relevant 'group'?**
      *   *Likely Dodge:* "The 'group' is defined by participation in the specific activity or space where the coordination problem arises. Lewis allows for conventions within sub-groups. Volatility reflects rapid adaptation to changing coordination problems."
      *   *Counter:* "But if norms fragment down to tiny, transient groups, and individuals move fluidly between many such groups with conflicting norms, doesn't this undermine the stability and shared expectations central to Lewis? How can common knowledge or a conditional preference for conformity develop if the 'group' context shifts minute-by-minute?"

  7.  **Distinguishing Convention from Rule:** Platform architectures often have explicit rules encoded alongside emergent norms. **Where exactly do you draw the line between a Lewisian convention emerging from the user base and a user base merely internalizing and adapting to a platform's *de facto* rules (e.g., 'community guidelines' enforced by algorithms, or interface constraints dictating behavior)?**
      *   *Likely Dodge:* "It's a spectrum. Conventions emerge *within* the constraints set by rules/architecture. We look for patterns of behavior that solve coordination problems *beyond* what's strictly required by the rules and show evidence of mutual expectations among users."
      *   *Counter:* "Given the pervasive influence of architecture and algorithmic enforcement shaping possibilities, what concrete evidence can distinguish a genuine user-emergent convention from sophisticated adaptation to top-down control? Isn't claiming 'convention' often just describing the *form* the adaptation takes?"

  8.  **Legitimacy & Power:** Lewis's framework is largely neutral on power structures. **In distributed micro-norms, especially when amplified or enforced by algorithms (which reflect their creators' biases), doesn't ignoring how power dynamics (e.g., core dev influence, platform ownership, algorithmic bias) shape which norms emerge and persist risk portraying contingent power structures as neutral, emergent conventions?**
      *   *Likely Dodge:* "Lewis's descriptive framework explains *how* norms stabilize as conventions *given* the preferences and options available. It doesn't preclude analyzing where those preferences or options come from, including power dynamics. That's a separate layer."
      *   *Counter:* "But if the 'preferences' and 'options' available to users are *fundamentally shaped* by powerful actors (platforms, core teams) and non-transparent algorithms, doesn't describing the resulting behavioral regularity as a 'convention' risk legitimizing it as a neutral, bottom-up solution when it might be a constrained adaptation to imposed structures? Doesn't the Lewisian label potentially obscure the power at play?"

  **Key Tactics Embedded:**

  *   **Demands Concrete Examples:** Forces her to ground abstractions.
  *   **Highlights Digital Disruptions:** Anonymity, churn, bots, architecture aren't just "new contexts," they challenge core assumptions (common knowledge, arbitrariness, group behavior).
  *   **Anticipates & Counters Dodges:** The counter-follow-ups cut off easy retreats to scalability, treating bots as agents, or broad definitions of coordination problems/sanctions.
  *   **Contrasts with Adjacent Concepts:** Explicitly asks her to differentiate conventions from rules, social norms, and adaptation to constraints.
  *   **Focuses on Mechanism:** Asks *how* Lewisian processes (common knowledge formation, solving coordination problems) actually work in these settings.
  *   **Introduces Critical Angles:** Question 8 subtly raises legitimacy/power concerns inherent in applying a neutral framework to potentially non-neutral spaces.

  Good luck with the interview! Press firmly but fairly.
