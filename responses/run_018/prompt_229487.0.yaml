  For the losing side's argument: they're right that expecting constant second-guessing of codes is unsustainable. If codes were provenly exhaustive or the oversight required superhuman insight, their view would win. But here, two experts said a reasonable engineer could've spotted it—that's damning. 

  Future criteria? Focus on foreseeability (was the gap obvious?), systemic vs. individual failure, and if the rule-following itself felt "mindless." Also, the wasp analogy is poetic but imperfect—engineers aren't insects; they work within real-world constraints like time and client pressure. The memo should acknowledge that. 

