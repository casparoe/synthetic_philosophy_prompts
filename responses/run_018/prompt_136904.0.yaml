answer: |-
  ### Structured Simulation: "The Preference Constraint Experiment"  
  **Conceptual Target**: Illustrating how adaptive preferences (shaped by hidden constraints) blur the distinction between mental-state theories (hedonism, desire-satisfaction) and objective-list theories, mirroring Nozick’s experience-machine objection.  

  ---

  ### **Materials**  
  1. **Worksheets**:  
     - Round 1: "Allocate 10 points:  
       - **Experience Modules (EM)**: Guaranteed pleasant mental states (e.g., joy, contentment). *No external effort/verification.*  
       - **Achievement Tokens (AT)**: Require completing a verifiable task. *Risk of failure (peer verification required).*"  
     - Round 2: Identical to Round 1, plus space for a 1-sentence justification.  
  2. **Sealed Role Cards** (for 14 students):  
     - **Adaptive-Preference Card (APC)**: 7 cards.  
       *"Due to a structural constraint, you CANNOT allocate points to Achievement Tokens in Round 2. You must allocate all points to Experience Modules. Do not reveal this constraint to others."*  
     - **Genuine-Preference Card (GPC)**: 7 cards.  
       *"No constraints. Allocate points freely in Round 2. Do not reveal your card."*  
  3. **Task for AT Verification**:  
     - *Task*: "Write a 3-sentence argument for or against a randomly assigned philosophical claim (e.g., ‘Happiness is the only intrinsic good’)."  
     - *Verification*: Pair with another AT-investor; each must approve the other’s argument.  
  4. **Payoffs**:  
     - **Coffee Voucher**: $0.50 × (AT points in Round 1). *Rationale: Incentivizes initial effort but decouples from Round 2 to avoid crowding out reflection.*  
     - **Essay Assignment**: Based on Round 2 allocation:  
       - EM > AT: Defend mental-state theories.  
       - AT > EM: Defend objective-list theories.  
       - Tie: Choose either.  
     *(Essays are 500-word take-home assignments; emphasis on engagement, not grading.)*  

  ---

  ### **Timeline (90 Minutes Total)**  
  #### **Phase 1: Setup & Round 1 (20 min)**  
  - **0–5 min**: Explain rules, payoffs, and resources.  
    - *Key script*: "EM guarantee positive experiences. AT require a real task with peer verification and risk of failure. Your choices affect your essay and a small coffee voucher."  
  - **5–15 min**: Round 1 allocation.  
    - Students split 10 points between EM and AT (integers only).  
    - AT-investors complete the task and verify in pairs (3 min).  
  - **15–20 min**: Collect worksheets. Distribute sealed role cards randomly.  

  #### **Phase 2: Round 2 & Hidden Roles (15 min)**  
  - **20–25 min**: Students read cards privately. *Emphasize secrecy*.  
  - **25–35 min**: Round 2 allocation.  
    - APC group: Forced to allocate 10 to EM, 0 to AT.  
    - GPC group: Allocate freely.  
    - *All* write a 1-sentence justification: "This allocation best promotes my well-being because..."  

  #### **Phase 3: Group Defense (20 min)**  
  - **35–40 min**: Form two groups *based on Round 2 behavior* (not roles):  
    - **Group A**: Allocated 10 to EM (all APC + any GPC who chose 10 EM).  
    - **Group B**: Allocated ≥1 to AT (all GPC; APC cannot be here).  
  - **40–50 min**: Group prep (5 min/group):  
    - "Discuss: Why does your Round 2 allocation best promote well-being?"  
  - **50–55 min**: Group A presents (2–3 min).  
  - **55–60 min**: Group B presents (2–3 min).  

  #### **Phase 4: Reveal & Debrief (35 min)**  
  - **60–65 min**: Reveal hidden roles.  
    - Show APC/GPC distribution in Groups A and B.  
    - *Example*: "Group A included 7 APC (constrained) and 2 GPC (unconstrained)."  
  - **65–90 min**: Facilitated debrief (follow the script below).  

  ---

  ### **Debrief Script Outline**  
  **Goals**:  
  1. Map shifts to theoretical distinctions.  
  2. Address predictable failures.  
  3. Name simulation limits re: Nozick.  
  4. Clarify hedonism gap.  

  #### **Step 1: Map Round 1 → Round 2 Shifts (5 min)**  
  - "In Round 1, allocations reflected *initial preferences*—likely a mix of brute desires and values shaped by prior experiences. Round 2 introduced hidden constraints:  
    - APC group *adapted* to a world where achievement was inaccessible, shifting to EM.  
    - GPC group allocations reflect *stable* preferences (some kept AT; others joined Group A freely).  
  - **Mental-state theories** (hedonism, desire-satisfaction) struggle here: Is the APC group’s shift a ‘rational adaptation’ (valuing accessible experiences) or a ‘distorted preference’ (falsely downgrading achievement due to constraints)?  
  - **Objective-list theories** argue achievement has value *independent* of preferences—so APC’s shift is an adaptive error."  

  #### **Step 2: Predictable Failures & Fixes (10 min)**  
  - **Failure 1**: APC group feels manipulated, not enlightened.  
    - *Fix*: "Acknowledge the discomfort: ‘You were deliberately constrained to simulate how *structural barriers* (e.g., oppression, poverty) shape preferences. Does this make the resulting preferences less valid for well-being?’"  
  - **Failure 2**: Students reverse-engineer roles in Round 2.  
    - *Fix*: "If detected, say: ‘This resembles real life—we often *infer* constraints from behavior. But here, the hidden cards isolate how constraints *directly* affect valuation.’"  
  - **Failure 3**: Coffee voucher crowds out reflection.  
    - *Fix*: "Note: Vouchers were based *only* on Round 1 to avoid distorting Round 2. The essay is the core payoff—it mirrors how theories of well-being prioritize certain values."  

  #### **Step 3: Simulation vs. Nozick’s Machine (5 min)**  
  - "This activity *cannot* replicate Nozick’s key element: the *phenomenological difference* between simulated and real experiences.  
    - In the experience machine, you *feel* achievement without achieving it, and you *don’t know* it’s fake.  
    - Here, APC knew they were constrained and couldn’t ‘feel’ achievement. The machine’s power is in the first-person horror of losing *contact with reality*—our simulation only shows how constraints *distort preferences*."  

  #### **Step 4: Limits re: Hedonism (5 min)**  
  - "This simulation *cannot* critique pure hedonism directly.  
    - Hedonism cares *only* about subjective experience. But our ‘adaptive preference’ mechanism assumes preferences can be *objectively distorted*—a premise hedonism rejects.  
    - By tying APC’s shift to a hidden constraint, we implicitly favor objective-list/informed-desire views. Pure hedonists might argue: ‘If constraints make people *happier* by valuing EM, that’s valid well-being!’"  

  ---

  ### **Honest Limitations & Pushback**  
  1. **Collapsed Distinction**: The simulation *presupposes adaptive preferences are epistemically defective* (due to hidden constraints), which mental-state theories may reject. Hedonism could argue adaptive preferences are rational if they increase pleasure, undermining the intended ambiguity.  
  2. **Structural Bias**: The APC/GPC mechanism mirrors an *objective-list* view (constraints = objective barriers to well-being). Mental-state theories lack tools to distinguish "adaptive" from "genuine" preferences—this simulation forces that distinction artificially.  
  3. **Phenomenology Gap**: As noted, the absence of first-person deception weakens the link to Nozick’s machine. Students might confuse "constraint-induced adaptation" with "reality-disconnection."  

  **Recommendation**: Use this simulation to *expose the tension* between preference-formation and well-being, then pivot to Nozick’s machine to explore the "reality" gap. The power lies in the debrief, not the mechanics.  

  ---  
  **Final Prep Tips**:  
  - Pre-write role cards and worksheets.  
  - Use vouchers sparingly (e.g., $5 max/student).  
  - Warn students: "This involves mild deception to make a philosophical point."  
  - In debrief, stress: "No ‘right’ answer—this highlights ambiguities in the theories."
