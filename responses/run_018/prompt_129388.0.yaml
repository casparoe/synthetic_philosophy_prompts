answer: |-
  Your intuitive verdicts reveal a sophisticated weighting of multiple welfare dimensions. After analyzing the conceptual distinctions (total vs. average welfare, temporal suffering dynamics, density-dependent welfare functions, and life-history context), I propose this unified principle:

  **The Welfare-Weighted Life-Density Principle (WWLD):**  
  *Net suffering change is determined by the difference between (A) the aggregate expected lifetime suffering averted by preventing births and (B) the aggregate change in expected lifetime suffering of surviving individuals—with both terms weighted by:  
  (i) suffering intensity profile (acute terror > chronic hunger),  
  (ii) species-specific baseline welfare potential (based on life-history strategy and neurobiology),  
  (iii) density-dependent welfare effects, and  
  (iv) reproductive value of affected stages.*

  ### How WWLD explains your cases:
  1. **Drained Wetland (✓ Reduced Suffering):**  
     - *(A) dominates:* Averted larval suffering has extreme intensity (parasitism, predation) and low reproductive value.  
     - *(B) negligible:* Adult welfare improvement is marginal.  
     - *Clause (i,ii,iv):* High-weight averted juvenile suffering outweighs minor survivor effects.

  2. **Forest Fragmentation (✓ Increased Suffering):**  
     - *(B) dominates sharply:* Chronic stress pathologies (hypercortisolism, immune collapse) in long-lived mammals with high baseline welfare potential.  
     - *(A) weak:* Modest birth reduction; surviving adults have high reproductive value.  
     - *Clause (ii,iii):* K-selected species suffer severely from social disruption (density-dependent welfare crash).

  3. **Grland Patch Reduction (◯ Uncertain/Slight Increase):**  
     - *(A) vs. (B) balanced but leaning (B):* Averted lives had brief high-intensity suffering (starvation/predation), but survivors endure prolonged hypervigilance (chronic high-intensity suffering).  
     - *Clause (i,iii):* Density spikes amplify injury/starvation; edge effects create persistent welfare nadirs. Your "slight increase" verdict weights chronic survivor suffering > averted acute juvenile suffering.

  4. **Invasive Shrub (✓ Reduced Suffering):**  
     - *(B) improvement dominates:* Reduction in predation terror (max-intensity suffering) outweighs increased hunger (lower-intensity chronic suffering).  
     - *(A) secondary:* Birth reduction contributes marginally.  
     - *Clause (i):* Acute terror weighted more heavily than chronic hunger per unit time.

  5. **Fire Mosaic (✓ Long-term Reduction):**  
     - *(A) dominates long-term:* Suppression of r-strategists prevents vast numbers of high-suffering, low-reproductive-value lives.  
     - *(B) transient cost:* Immediate fire deaths offset by stable welfare of K-strategists.  
     - *Clause (ii,iv):* Shift toward life histories with higher baseline welfare potential and lower suffering density per lifetime.

  ### Test Case: Marine Productivity Decline
  - **Scenario:** Warming reduces phytoplankton → lowers total fish biomass but eases competition/injury in spawning aggregations.  
  - **WWLD Prediction:**  
    - *(A) Averted suffering:* Fewer fish born, but larval/juvenile stages experience high predation/starvation (intense suffering, low RV).  
    - *(B) Survivor welfare:* Reduced density decreases wounding and chronic stress during spawning (high-intensity suffering relief for high-RV adults).  
    - **Verdict:** **Net suffering likely decreases** – Clause (i) and (iv) prioritize reduction in high-intensity aggregation suffering and chronic competition stress over averted lives dominated by high-mortality early stages. Analogous to your Case 4 verdict.

  ### Why Not Competing Principles?
  A *Total Suffering Minimization* principle would force abandonment of your Case 2 verdict (prioritizing population reduction over per-capita welfare). A *Per-Capita Welfare Maximization* principle would contradict Case 1 (ignoring averted high-suffering lives). WWLD integrates both dimensions with ecological weightings, preserving all your verdicts without contortion. Your emphasis on suffering temporality (Case 4) and life-history context (Case 5) is explicitly embedded in clauses (i) and (ii), while density-dependence (Case 2,3) and reproductive value (Case 1,5) are handled by (iii) and (iv).

  This coherence stems from your implicit weighting of suffering intensity and life-history strategy—a refinement absent in classical utilitarianism but consistent with your physiological expertise on allostatic load and population ecology.
