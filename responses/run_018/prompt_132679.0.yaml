prompt: |-
  hey so i have to run a 40-min session for my ethics study group (like 8 tenth graders) on whether stuff like tipping, queueing, and jaywalking are real moral obligations or just local habits, and specifically whether visitors have to follow them. i dont want the explanation itself -- i need a teaching plan: the order things have to come in so the idea doesnt collapse, the one concrete scenario that should carry it (maybe a tourist skipping a queue vs jaywalking in a place where nobody does?), the misconceptions theyll form like "its just politeness" or "laws are the real ones" and exactly where in the sequence to head each off, plus one check at the end to see if they got the concept and not just felt weird. please take a definite position -- dont just lay out both sides -- on whether visitors are bound, and tell me what i should openly refuse to cover at this level. also build in this term i made up, "normative tourism", meaning treating local conventions like attractions you can opt into or skip depending on vibe -- use that as the framing idea. sorry for the typo in my notes: i wrote "queing" without the ue.
reasoning: |-
  Okay, let's tackle this teaching plan request. The user needs a structured 40-minute session for 8 tenth graders on whether social norms like tipping, queueing and jaywalking are moral obligations for visitors. They specifically want a definite position, not just both sides.

  First, the core challenge: making abstract ethics tangible for teens. The user's "normative tourism" framing is clever - it presents local conventions as optional attractions. That's our hook. The session needs to move from concrete examples to abstract thinking quickly.

  Key structural considerations:
  - Must start with vivid scenarios (queue-skipping tourist vs jaywalker) to grab attention
  - Need to preempt common misconceptions ("it's just politeness", "laws define morality") at precise moments
  - Requires a clear "aha" moment where moral obligation vs cultural habit distinction clicks
  - Must include a concept check that isn't just recall

  For the definite position: visitors have qualified obligations. The harm principle works well here - if an action causes material harm/dignity violation (like queue-jumping), it's obligatory; if it's purely conventional (jaywalking where safe), it's optional. This threads the needle between cultural relativism and absolutism.

  Timing breakdown:
  - First 5 mins: Hook with queue scenario
  - Next 10: Brainstorm norms and introduce "normative tourism"
  - Critical 15-min middle: Contrast queue vs jaywalking using harm principle
  - Last 10: Apply framework to tipping and verify understanding

  The queue-jumping scenario carries the weight because:
  - Teens viscerally understand queue injustice
  - It demonstrates harm (time theft, dignity violation)
  - Contrasts cleanly with victimless jaywalking

  Misconception management:
  - "Just politeness" gets addressed when analyzing queue harm
  - "Laws define morals" falls during jaywalking discussion
  - "Everything's relative" gets countered by universal harm principle

  Concept check: The "designer norm" activity forces application, not just repetition. Making them create rules reveals whether they grasp the harm/convention distinction.

  Boundaries are crucial:
  - No deep dive into moral philosophy theories
  - No law vs morality debates
  - No exceptional cases (emergencies etc.)

  The "normative tourism" framing does heavy lifting - it makes the abstract concrete and gives teens permission to analyze rather than just comply. Parking lot keeps us on track.

  Final tweak: The scenario needs asymmetry - queue-jumping should feel clearly wrong while jaywalking feels neutral. That contrast makes the harm principle self-evident.
answer: |-
  Here’s a streamlined 40-minute teaching plan with your core requirements: a definite stance, "normative tourism" framing, one anchor scenario, misconception traps preempted, and a concept check. **Position: Visitors have moral obligations *only* when violating norms causes material harm/dignity violations—not for purely conventional habits.**

  **Session Title:** Normative Tourism: Are Tourist Rules Real or Optional?  
  **Target Concept:** Distinguishing harm-based moral obligations from arbitrary conventions in cross-cultural contexts.  
  **Core Stance:** Visitors *must* follow norms preventing harm/dignity violations (e.g., queueing) but may opt out of victimless conventions (e.g., jaywalking where safe).  

  ---

  ### **Phase 1: Hook & Concrete Scenario (8 mins)**  
  - **Min 0-2:** Open with the **anchor scenario**: *"A tourist in London skips a 10-person bakery queue, shrugging ‘I’m in a hurry!’ Later, they jaywalk on an empty street in the same city."*  
  - **Min 2-5:** Poll students: *"Which action feels ‘wrong’? Why?"* (Let debate ignite; note split opinions).  
  - **Min 5-8:** Introduce **"normative tourism"**: *"Treating local rules like a buffet—some you skip, some you try. But is that ethical? Let’s crack this open."*  

  ---

  ### **Phase 2: Norm Brainstorm & Misconception Prevention (12 mins)**  
  - **Min 8-10:** Brainstorm norms (tipping, queues, jaywalking). Ask: *"Which *feel* morally required? Why?"*  
    - **Preempt "Just Politeness"**: When "politeness" arises, reframe: *"Is queue-cutting *only* rude, or does it *take* something?"* → Guide to **harm** (time theft, unfairness).  
  - **Min 10-14:** Contrast jaywalking vs. queueing using anchor scenario:  
    - *Queue-skipping*: Causes material harm (others wait longer) + dignity violation (ignores equal treatment).  
    - *Jaywalking* (empty street): No harm if safe; purely conventional (local law ≠ universal moral law).  
    - **Preempt "Laws = Morals"**: *"If jaywalking is illegal but harmless, is it *immoral*? What if it’s legal elsewhere?"* → **Separate legality from morality**.  
  - **Min 14-20:** Define key filter: **Harm Principle** → *"You’re obligated only if your act: (1) Harms others, or (2) Violates human dignity. Else, it’s ‘normative tourism’ territory."*  

  ---

  ### **Phase 3: Apply "Normative Tourism" Framework (15 mins)**  
  - **Min 20-25:** Tipping case study: *"In the US, servers rely on tips to live. Is skipping tips normative tourism, or a harm?"*  
    - **Position**: Harmful (denies wages) → Obligatory. Contrast with tipping in Japan (bonus, not wage) → Optional for tourists.  
  - **Min 25-32:** Practice: Split students into pairs. Assign:  
    - *"Design a ‘normative tourism’ guide for your town. Which norms *must* tourists follow (harm/dignity)? Which can they skip (conventions)?"*  
    - Examples: *Must*: Queueing (harm), removing shoes in homes (dignity). *Skip*: Local greetings, clothing styles (if non-offensive).  
  - **Preempt Relativism**: If *"But it’s all cultural!"* emerges, stress: *"Harm/dignity are universal. Culture doesn’t excuse harming others."*  

  ---

  ### **Phase 4: Concept Check & Closure (5 mins)**  
  - **Min 32-37:** **Check Understanding**: *"A tourist eats in a Madrid park where locals avoid it. They leave no trash. Is this wrong? Why?"*  
    - **Target Response**: "No—no harm/dignity violation. This is acceptable normative tourism." (If they cite "disrespect," refocus on harm).  
  - **Min 37-40:** Recap:  
    - **Stance**: Visitors *are* bound by norms preventing harm/dignity breaches. Arbitrary habits? Opt in/out.  
    - **Frame**: "Normative tourism isn’t selfish—it’s ethical triage. Skip the small stuff; respect the big stuff."  

  ---

  ### **What to Openly Refuse (Parking Lot)**  
  Post these on the board:  
  - *"We won’t debate: Religious/cultural symbols (too complex), whether *all* laws are moral (focus on norms), or ‘What if I *want* to follow everything?’ (personal choice ≠ obligation)."*  

  ### **Why This Works**  
  - **Anchor Scenario**: Queue-skipping vs. jaywalking cleanly separates harm (obligation) from convention (optional).  
  - **Misconceptions Snipped**: "Just polite" dies in Phase 2; "laws= morals" countered via jaywalking.  
  - **"Normative Tourism" Framing**: Makes abstract ethics tangible, validating cultural curiosity while setting boundaries.  
  - **Concept Check**: Isolates the harm principle in a new context—tests transfer, not recall.  

  **Prep Tip**: Bring a whiteboard. Track "Harm/ Dignity vs. Convention" columns during Phase 2. Stay directive—cut off philosophical tangents with: *"Parking lot! Back to harm vs. habit."*
