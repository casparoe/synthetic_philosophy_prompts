prompt: |-
  I run a workshop with about 16 grad students in history and phil, 90 minutes. I want them to feel teh pull of treating germs, climate shifts, or volcanic winters as "historical actors" rather than background conditions, but also feel why environmental determinism collapses into something useless. Design a structured simulation: split them into four groups—two human institutions (a port council and a monastic network) and two non-human forces (a pathogen and a sudden climate oscillation). Give each hidden rule-cards and resource budgets they spend each round. Over three 15-minute rounds they negotiate a timeline for a fictional 14th-century trading city facing plague and crop failure. The non-human groups should set hard constraints the humans can't veto, but humans must have response options that reshape outcomes. Include specific roles, a payoff mechanism, and a 15-minute debrief that maps game moves onto agency vs determinism. Be frank about which feature of this idea the game just can't reproduce and I'll have to supply verbally. Keep it runnable with no outside reading.
reasoning: |-
  We are designing a 90-minute workshop simulation for 16 graduate students in history and philosophy. The goal is to explore how non-human forces (like germs and climate shifts) can be seen as "historical actors" without falling into environmental determinism.

  Structure:
  - Four groups: 
    1. Port Council (human institution)
    2. Monastic Network (human institution)
    3. Pathogen (non-human force)
    4. Sudden Climate Oscillation (non-human force)

  - Three rounds of 15 minutes each, representing different time periods (e.g., 1300, 1325, 1350) in a fictional 14th-century trading city.

  - Each group has:
    - A hidden rule card (with objectives and constraints)
    - A resource budget (which they spend each round to take actions)

  - Non-human groups set constraints that humans cannot veto, but humans have response options that can reshape outcomes.

  - After the simulation, a 15-minute debrief maps the game moves onto the concepts of agency vs. determinism.

  Key Mechanics:
  1. **Round Structure:**
     - Each round represents a period of 25 years (so 1300, 1325, 1350) to show change over time.
     - In each round, the non-human forces act first (spending resources to set constraints) and then the human groups react (spending their resources to respond).

  2. **Resource Budgets:**
     - Each group starts with a set amount of resources (e.g., 10 tokens per round). They can spend these to take actions. Unused resources do not carry over.
     - Non-human forces have a fixed resource budget per round (they are not accumulating over time, but their impact can have lasting effects).

  3. **Actions:**
     - Non-human forces: They set constraints (e.g., the pathogen might spread disease, reducing the population; the climate oscillation might cause crop failure). They choose the intensity of their action by spending resources (more resources = more severe impact). They cannot be vetoed by humans.
     - Human groups: They can spend resources to mitigate, adapt, or take advantage of the situation. They may also interact with each other (cooperation or conflict).

  4. **Interaction and Negotiation:**
     - After non-human forces announce their actions (without revealing their rule cards), the human groups can negotiate with each other and then decide their responses.

  5. **Payoff Mechanism:**
     - Each group has a hidden objective (on their rule card) that they are trying to achieve by the end of the third round. 
     - At the end, groups reveal their objectives and see how well they did.

  6. **Debrief (15 minutes):** 
     - Discuss how the non-human forces set the stage but the human responses shaped the outcomes. Highlight moments where human agency made a difference and where constraints were absolute. Connect to the real historical examples (like the Black Death or the Little Ice Age) and the philosophical tension.

  Limitations to Acknowledge Verbally:
  - The game cannot fully capture the long-term, complex, and often unintended consequences of interactions between human and non-human actors. In reality, these play out over much longer timescales and with more intricate feedback loops.
  - The game simplifies the "agency" of non-human forces by giving them goals and resource spending (which is a human-like intentionality). We have to remember that in reality, germs and climate shifts don't have intentions; they are processes. The game's abstraction might blur this.

  Detailed Setup:

  **Groups and Roles:**

  1. **Port Council (4 students):**
     - Represents the merchants and city officials of a trading port.
     - **Resources:** 10 tokens per round.
     - **Hidden Rule Card Objectives:**
       - Maintain a population of at least 50% (relative to starting) by the end.
       - Accumulate wealth (trade revenue) of at least 15 tokens over the three rounds.
       - Avoid social unrest (no more than 2 rounds with unrest).
     - **Actions they can take (cost in tokens):**
       - Invest in trade (1 token): generates 1 wealth (if successful, but can be disrupted by plague or famine).
       - Quarantine measures (2 tokens): reduces plague impact by 50% for that round (if implemented).
       - Import food (3 tokens): counters crop failure for that round (prevents population loss from famine).
       - Suppress unrest (1 token): if unrest occurs, spend to calm it (otherwise it counts as an unrest round).
       - Build infrastructure (2 tokens): long-term benefit (if done twice over the game, gain 1 extra wealth per round).

  2. **Monastic Network (4 students):**
     - Represents the religious and charitable institutions.
     - **Resources:** 10 tokens per round.
     - **Hidden Rule Card Objectives:**
       - Maintain the faith (at least 60% of the population remains adherents by the end).
       - Provide aid: must have spent at least 5 tokens on aid actions over the game.
       - Grow the monastic order (gain 2 new members per round on average).
     - **Actions:**
       - Care for the sick (2 tokens): reduces plague mortality by 25% (stacks with Port Council's quarantine).
       - Distribute alms/food (2 tokens): counters famine effects for 25% of the population.
       - Preach and convert (1 token): maintains/grows faith and attracts new members (if successful, gain 1 member per token spent).
       - Record knowledge (1 token): if done at least once per round for two rounds, gain 1 extra token per round in the last round (for having preserved knowledge).

  3. **Pathogen (4 students):**
     - Represents a plague (like the Black Death).
     - **Resources:** 8 tokens per round (they are a force of nature, so they don't accumulate; they spend per round).
     - **Hidden Rule Card Objectives:**
       - Infect at least 60% of the population over the three rounds (cumulative).
       - Cause at least 40% mortality (of the total population) by the end.
       - Mutate at least once (by spending 5 tokens in one round to become more virulent, which then increases the base effect in future rounds).
     - **Actions:**
       - Spread (cost X tokens): causes infection in (X * 10)% of the population that round (but cannot exceed 100%).
       - Virulence (cost Y tokens): causes mortality in (Y * 5)% of the infected population that round.
       - Mutate (5 tokens, one-time): after mutation, each token spent on spread infects 15% (instead of 10%) and virulence causes (Y * 7)% mortality.

  4. **Sudden Climate Oscillation (4 students):**
     - Represents a shift to colder, wetter weather causing crop failures.
     - **Resources:** 8 tokens per round.
     - **Hidden Rule Card Objectives:**
       - Cause crop failure in at least 2 out of 3 rounds (with severity of at least 30% loss in potential harvest each time).
       - Trigger at least one famine (where crop failure and lack of response cause actual population loss).
       - Shift the growing season (by spending 5 tokens in one round to make the climate more volatile, increasing base effect in future rounds).
     - **Actions:**
       - Cold snap (X tokens): causes crop failure of (X * 10)% that round (meaning only (100 - X*10)% of the food needed is available).
       - Volatile weather (Y tokens): causes additional disruption to trade and infrastructure (reduces Port Council's wealth generation by Y tokens that round).
       - Shift (5 tokens, one-time): after the shift, each token spent on cold snap causes 15% crop failure (instead of 10%) and volatile weather disrupts wealth by Y+1 tokens.

  **Game Rounds:**

  1. **Round 1 (1300):**
     - Non-human forces act first (simultaneously, but in view of all): They decide how many tokens to spend on which actions and announce the effects (e.g., Pathogen: "We spend 3 on spread -> 30% infected, and 2 on virulence -> 10% mortality among the infected -> total mortality 3% of population"). Similarly, Climate: "We spend 4 on cold snap -> 40% crop failure, and 1 on volatile weather -> disrupts 1 wealth token of the Port Council."
     - Human groups then see the situation and can negotiate. They must spend their tokens to respond. They can also negotiate with each other (e.g., the Port Council might pay the Monastic Network to distribute food). They announce their actions and the effects (mitigations).

  2. **Round 2 (1325):** Same as round 1, but non-human forces may have increased power if they mutated/shifted.

  3. **Round 3 (1350):** Final round.

  **Tracking the City:**
  - We need a shared board to track:
    - Population (start at 100%).
    - Wealth (start at 0, but the Port Council must generate it).
    - Faith (start at 100% adherents).
    - Monastic members (start at 10).
    - Unrest (starts at 0 rounds with unrest).
    - Famine (has it occurred?).

  After each round, update:
  - Population: subtract mortality from plague and famine (if not fully countered). Famine: if crop failure is not fully countered, then population loss = (crop failure % - countered %) * population (but at least 0). Also, plague mortality is applied.
  - Wealth: add Port Council's generation (if not disrupted) minus any disruptions by climate.
  - Faith: if the Monastic Network doesn't spend on preaching, faith might drop (e.g., by 10% per round they don't spend at least 1 token on it). But if they spend, they can maintain or even grow.
  - Monastic members: they gain or lose based on their actions.

  **Debrief Questions:**
  1. How did the non-human forces shape the possibilities for the human institutions?
  2. What were the key moments where human agency made a difference? Where did it fail?
  3. How did the hidden objectives of the non-human forces (which we anthropomorphized) compare to the real-world non-intentional processes?
  4. In what ways did the simulation show that non-human forces are actors but not determiners? What was the role of contingency and response?

  **Materials:**
  - Rule cards for each group (hidden from others).
  - Resource tokens (like poker chips or paper clips) - 10 per human group per round, 8 per non-human per round.
  - A shared board to track the city state (poster paper or whiteboard).
  - Markers.

  **Time Breakdown:**
  - Introduction and group assignment: 10 minutes
  - Round 1: 15 minutes
  - Round 2: 15 minutes
  - Round 3: 15 minutes
  - Tallying and revealing objectives: 5 minutes
  - Debrief: 15 minutes
  - Total: 75 minutes (with 15 minutes buffer for setup and transitions)

  This should be runnable without outside reading and within the time constraints.
answer: |-
  ### Structured Simulation: "Agency in the Ashfall"

  **Core Tension:** Help students experience non-human forces as active *participants* in historical change (not just "context") while seeing how human responses prevent environmental determinism. Non-humans set unavoidable constraints, but human choices reshape *how* those constraints play out.

  ---

  ### **Setup (10 mins)**
  - **Groups & Roles** (4 groups of 4 students):
    - **Port Council** (Human): Merchants & city leaders.  
      *Goal: Maximize trade wealth (+ avoid riots).*  
      *Resources: 10 "coins"/round.*
    - **Monastic Network** (Human): Abbots, healers, scribes.  
      *Goal: Preserve knowledge & relieve suffering (+ grow influence).*  
      *Resources: 10 "alms"/round.*  
    - ***Yersinia pestis*** (Non-human): The Plague Pathogen.  
      *Goal: Spread efficiently & survive.*  
      *Resources: 8 "virulence points"/round.*  
    - ***Fimbulwinter*** (Non-human): Sudden Climate Cooling.  
      *Goal: Disrupt food systems & destabilize trade.*  
      *Resources: 8 "frost points"/round.*  

  - **Fictional Setting:** The Mediterranean trade hub *Porto Argento* (c. 1315–1348). Starting conditions:  
    - Population: 10,000  
    - Grain Stores: 5,000 bushels  
    - Trade Wealth: 100 coins  
    - "Order" (stability): 8/10  

  - **Materials:**  
    - Rule cards (hidden per group, see below).  
    - Resource tokens (coins/alms/virulence/frost).  
    - Shared board tracking: **Population**, **Grain Stores**, **Trade Wealth**, **Order**.  

  ---

  ### **Round Structure (3 × 15 mins)**  
  Each round = 1 decade (1320s, 1330s, 1340s). **Order of play:**  
  1. **Non-humans act first** (5 mins):  
     - Spend resources to impose constraints (announce effects publicly).  
     - *Humans cannot veto, only react.*  
  2. **Humans negotiate & respond** (7 mins):  
     - Port Council and Monastic Network discuss options (trade deals, aid, etc.).  
  3. **Humans spend resources** (3 mins):  
     - Announce actions to mitigate/adapt.  

  ---

  ### **Hidden Rule Cards & Mechanics**  
  *(Distribute these secretly. Non-humans keep goals hidden.)*  

  #### **Non-Human Forces (Set Constraints)**  
  - ***Yersinia pestis*** (Pathogen):  
    - **Goal:** Infect 70%+ of population by 1348.  
    - **Actions per round (spend virulence points):**  
      - *Spread (1 pt):* Infect 10% of population.  
      - *Mutate (3 pts):* +5% future infection rate (cumulative).  
      - *Reservoir (2 pts):* Survive winter in rat colonies (if not spent, lose 20% infection).  
    - *Constraint:* Infections reduce **Population** and **Order**.  

  - ***Fimbulwinter*** (Climate Oscillation):  
    - **Goal:** Reduce Grain Stores to ≤1,000 bushels for 2 rounds.  
    - **Actions per round (spend frost points):**  
      - *Frost Blight (1 pt):* Destroy 10% of grain harvest.  
      - *Storm Surge (2 pts):* Block port trade (halve Port Council’s wealth gain).  
      - *Deep Freeze (3 pts):* Double effect of next *Frost Blight*.  
    - *Constraint:* Grain shortages cause famine (–**Population**) and riots (–**Order**).  

  #### **Human Institutions (Reshape Outcomes)**  
  - **Port Council:**  
    - **Goal:** Achieve 200+ Trade Wealth & 6/10+ Order by 1348.  
    - **Actions (spend coins):**  
      - *Import Grain (3 coins):* +1,000 bushels.  
      - *Fund Militia (2 coins):* +2 Order.  
      - *Bribe Monks (1 coin):* Convince Monastic Network to prioritize your goal.  
      - *Build Warehouses (4 coins):* Immune to *Storm Surge* next round.  

  - **Monastic Network:**  
    - **Goal:** Preserve 3/3 "Knowledge Fragments" & keep Population ≥6,000.  
    - **Actions (spend alms):**  
      - *Distribute Alms (2 alms):* Reduce famine deaths by 50%.  
      - *Treat Sick (3 alms):* Reduce plague deaths by 30%.  
      - *Copy Manuscripts (1 alm):* Save 1 Knowledge Fragment (lost if *Order* ≤3).  
      - *Preach Calm (1 alm):* +1 Order.  

  ---

  ### **Payoff Mechanism**  
  After Round 3:  
  1. Groups reveal hidden goals.  
  2. **Score outcomes:**  
     - Humans: 1 pt per goal met.  
     - Non-humans: 1 pt per goal met.  
  3. **Collective "survival" score:**  
     - If Population ≥5,000: +1 pt to all.  
     - If Order ≥5: +1 pt to all.  
  *(Shows interdependence: even "adversaries" share stakes in stability.)*  

  ---

  ### **Debrief (15 mins)**  
  **Guiding Questions:**  
  1. **Agency of Non-Humans:**  
     - *"How did the pathogen/climate act as an 'actor'? What made its moves feel different from human choices?"*  
     - *Key insight:* Non-humans set *asymmetric* constraints (no negotiation, no morality).  

  2. **Determinism vs. Contingency:**  
     - *"When did human responses fundamentally alter outcomes? When were they futile?"*  
     - Highlight:  
       - **Mitigation** (e.g., monks reducing plague deaths).  
       - **Adaptation** (e.g., warehouses negating storms).  
       - **Unintended Consequences** (e.g., grain hoarding → riots).  

  3. **Anthropomorphism Trap:**  
     - *"The game makes germs/climate seem 'intentional.' How is this misleading? What can’t we capture?"*  
     - **Verbal Caveat:** *"Real non-human forces lack goals—they’re amoral processes. Our 'rules' simplify causality. History requires layering *many* such processes (which the game can’t scale to)."*  

  4. **Historical Mapping:**  
     - *"How does this mirror the Black Death (1347–51) or the Dust Bowl? Where did human choices *reshape* catastrophe?"*  
     - Examples: Quarantines (agency) vs. climate-driven crop failures (constraint).  

  ---

  ### **What the Game Can’t Do (State This Verbally)**  
  - **Non-Linear Chaos:** Real events involve feedback loops (e.g., famine → weaker immunity → worse plague). The game’s round structure oversimplifies this.  
  - **Scale Mismatch:** Humans act individually *and* collectively; the game flattens this to group decisions.  
  - **Absence of "Mind":** Germs don’t "want" to spread; they replicate. The game’s "goals" are narrative devices.  
  - **Long-Tail Effects:** The game ends in 1348, but real history includes decades of cultural/economic aftershocks.  

  ---

  ### **Logistics**  
  - **No prep needed:** Rules fit on index cards. Track resources with pen/paper.  
  - **Timekeeper:** Assign a student to enforce round limits.  
  - **Balance:** Non-humans start strong (forcing reactive play), but human adaptation options let them claw back control by Round 3.  
  - **Flex:** If groups stall, inject "events" (e.g., "A ship from Constantinople arrives! Port Council: Do you inspect it for plague (cost: 1 coin) or rush its trade (gain 3 coins)?").  

  This creates experiential tension: students *feel* the weight of non-human constraints while wrestling with meaningful (but limited) human agency—then dissect the limits of determinism in debrief.
