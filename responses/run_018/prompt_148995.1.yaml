answer: |-
  Here’s your 8-question EA argument sorter—designed to cut through labels and force tradeoffs. Answer honestly, no Googling jargon!  

  ---

  ### **The "Where Do You *Actually* Stand?" EA Quiz**
  **Instructions:** Pick the answer closest to your gut reaction. Don’t overthink it!  

  1.  **Your city has a homelessness crisis. You can:**  
      A) Volunteer at a shelter (helps 10 people/night, feel their gratitude).  
      B) Lobby city council for policy reform (could help 1,000+ but might fail).  
      C) Take a high-paying corporate job, donate salary to fund shelter beds (scale: 100 beds/night).  

  2.  **A top EA org finds malaria nets save lives at $5,000/life. A local arts nonprofit brings joy to isolated elders (unmeasurable). You donate to:**  
      A) Malaria nets—lives saved are concrete.  
      B) Arts nonprofit—some values defy metrics.  
      C) Split 50/50—refuse the false choice.  

  3.  **A billionaire pledges $100M to bed nets *if* EA orgs hit their annual target. Your $1,000 donation would:**  
      A) Definitely add 200 beds!  
      B) Maybe just free up the billionaire’s cash (they’d fund it anyway).  
      C) Feel icky—why’s a billionaire dictating this?  

  4.  **Your friend takes a fossil fuel lobbying job, donates 50% to climate charities. You think:**  
      A) Smart—redirecting harm > purity.  
      B) Naive—the job corrupts their impact analysis.  
      C) Dangerous—normalizes harmful industries.  

  5.  **The government slashes school lunch funding. An EA food charity scales up to fill the gap. You worry this:**  
      A) Proves EA agility > bureaucracy!  
      B) Lets politicians off the hook (they’ll cut more).  
      C) Depends—did they also lobby to restore funding?  

  6.  **An EA think tank says donating to AI safety prevents *future* mass suffering. A soup kitchen feeds hungry people *today*. You prioritize:**  
      A) AI safety—biggest possible upside.  
      B) Soup kitchen—tangible suffering now.  
      C) Reject the framing—both matter, but fund soup kitchens personally.  

  7.  **Your EA group uses a complex algorithm to rank charities. You mostly:**  
      A) Trust it—experts > my biases.  
      B) Use it loosely—add my own judgment.  
      C) Ignore it—metrics miss too much context.  

  8.  **A study shows Wall Street traders become less empathetic over time, even if they donate. You’d advise an idealistic grad to:**  
      A) Go into finance, give generously—net good matters.  
      B) Avoid it—your soul isn’t a renewable resource.  
      C) Work *on* finance reform—systemic change > donations.  

  ---

  ### **Scoring Key**  
  Tally your **A**, **B**, and **C** answers. Find your primary match below:  

  🔹 **Mostly A’s: The Straight Defender**  
  You back earning-to-give hard. Impact is measurable, scalable, and dollars are neutral tools. Substitution worries? Overblown. Metrics > vibes. Slogan: *"Don’t let perfect be the enemy of the billion(s helped)."*  

  🔹 **Mostly B’s: The Measurability-Bias Critic**  
  You suspect EA’s obsession with quantifiable outcomes misses crucial stuff—dignity, justice, systemic roots. You distrust "expert" rankings replacing moral intuition. Slogan: *"Not everything that counts can be counted."*  

  🔹 **Mostly C’s: The Institutional-Capture Critic**  
  You fear private donations (even EA ones) let governments/elites duck responsibility, warping public priorities long-term. Clean hands matter, but systemic leverage matters more. Slogan: *"Band-Aids don’t fix bullet wounds."*  

  🔹 **Split A/B or B/C: The ‘Clean Hands’ Objector**  
  You worry high-earning EA jobs corrode moral reasoning or normalize harm, regardless of donations. Personal integrity > optimized impact. Metrics feel cold. Slogan: *"You can’t buy back your soul at cost-effective rates."*  

  🔹 **Even A/B/C Mix: The "Unnamed Middle Combo" (Theoretical Unicorn)**  
  You rationally see tradeoffs everywhere but lack a coherent heuristic. Maybe you’re conflicted, maybe you’ve transcended the debate. Nobody *lives* here—it’s a waystation. Slogan: *"It’s complicated, okay?!"*  

  ### **Niche Splits Explained in Your Results**  
  - **Substitution Illusion (Q3, Q5):** If you picked B in Q3 or B/C in Q5, you’re skeptical donations *add* new good vs. replacing state/corp spending.  
  - **Epistemic Outsourcing (Q7):** If you picked A, you delegate judgment to systems; C means you reject metric-driven authority.  

  ---

  **Disclaimer:** Real humans are messy! This oversimplifies—but it’ll pinpoint where your *arguments* land. Show your friend and reignite the debate responsibly 😉
