  This isn't just intellectual for them. The angst in "only one draft drives behavior without central arbitration" suggests they've felt like passengers in their own choices. I’ll validate that while showing how the model explains it. 

  Biggest risk is overwhelming them with terminology. Must translate "content-fixation" and "vector sum" into plain metaphors. The cookie example again—simple, visceral. 

