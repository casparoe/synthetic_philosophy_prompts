answer: |-
  Alright, let's dissect that overused slogan. It sounds profound but packs multiple distinct claims, some useful, some sloppy, and some actively misleading when misapplied. Here's the menu:

  1.  **"Culture Evolves Like Biology" (The Tautology):**
      *   **Claim:** Change over time happens in both systems. Traits/variants appear, spread, or disappear.
      *   **Verdict:** **Tautologically True.** *Any* system with variation, inheritance, and differential success changes over time. This is the absolute baseline meaning of "evolution" outside strict biology. It doesn't get you much beyond "things change."

  2.  **"...except it's Lamarckian" (Acquired Trait Inheritance):**
      *   **Claim:** Culturally acquired/modified traits (ideas, skills, behaviors) *can* be directly passed on to the "next generation" of learners. You teach your kid piano *after* you learned it.
      *   **Verdict:** **Empirically Defensible & Core Insight.** This is the *strongest* part of the analogy. Cultural transmission *is* fundamentally Lamarckian. Learned modifications *are* passed directly. This distinguishes it sharply from genetic evolution (ignoring epigenetics for simplicity).

  3.  **"...Horizontal" (Non-Parental Transmission):**
      *   **Claim:** Transmission isn't just parent-to-offspring ("vertical"). Ideas spread peer-to-peer, teacher-to-student, media-to-audience, across generations instantly ("horizontal" and "oblique").
      *   **Verdict:** **Empirically Defensible & Important Distinction.** This is clearly true and a major difference from standard genetic inheritance. Cultural traits spread like an infection network, not just a family tree.

  4.  **"...has no clear unit of selection" (What's Actually Replicating?):**
      *   **Claim:** It's messy to define the fundamental "thing" being selected for in culture (unlike genes in biology). Is it the meme? The practice? The norm? The individual holding the idea? The group?
      *   **Verdict:** **Partially True, Partially Cop-Out & Overstated Contrast.**
          *   **True:** Culture *is* messier. Units are fuzzier (a dance move vs. a constitutional amendment) and selection acts at multiple levels simultaneously (an idea benefits an individual *or* a group *or* just spreads for its own "parasitic" reasons).
          *   **Cop-Out:** Invoking "no clear unit" is often used to *avoid* doing the hard work of specifying *what level* is relevant for a specific analysis (e.g., "Why is this TikTok trend spreading?" demands asking *what benefit* it provides, even if fuzzy).
          *   **Overstated Contrast:** Remember, **biology itself has contested units of selection!** Gene vs. individual vs. group selection debates are *still* ongoing. Saying culture lacks a clear unit ignores that biology grapples with this too – it's a *difference of degree*, not kind. Culture is just *more* multi-level and fuzzy.

  5.  **Applying it to Legal Norms vs. Viral Dances (The Reality Check):**
      *   **Viral Dances:** The analogy holds *better* here. Simple, catchy, low-stakes traits spreading rapidly peer-to-peer (horizontal), with modifications (Lamarckian), driven by factors like fun, social proof, or algorithmic amplification (differential success). Unit is fuzzy but identifiable (the dance pattern).
      *   **Legal Norms:** The analogy **largely collapses.**
          *   **Intentional Design:** Laws are often *designed* and debated consciously, not just emerging from blind variation/selection.
          *   **Power & Enforcement:** Spread and persistence depend heavily on state power, courts, policing, lobbying – forces far stronger and more intentional than typical "selection pressures."
          *   **Complex Interdependence:** Legal norms are embedded in complex systems (economy, ethics, politics) and have long feedback loops. "Fitness" is incredibly hard to define.
          *   **Unit Problem Acute:** Is the unit the law text? The underlying principle? The enforcement mechanism? The social expectation it creates? All interact messily.
      *   **Verdict:** The slogan is **mostly false when applied to complex, institutional, intentional systems like law.** It works best for simple, fad-like, bottom-up cultural phenomena.

  **Your Specific Question: Dismissing Algorithmic Concerns as "Just Evolutionary Pressure"**

  *   **Which Precisification?** They are invoking the absolute baseline tautology (#1: "change happens") combined with a bastardized version of #4 ("no clear unit/just forces at work, nothing to see") and often ignoring intentionality.
  *   **Does it Work?** **No. It sounds edgy but is argumentatively bankrupt.**
      *   **Ignores Intentionality & Power:** Algorithms aren't natural forces; they're *designed* by humans with goals (engagement, profit). Their "selection pressures" are artificial and directed. Calling it "just evolution" erases the designers' agency and responsibility.
      *   **Ignores Values & Harm:** Evolutionary pressure in nature is value-neutral (survival/reproduction). Algorithmic pressure selects for engagement, often exploiting negativity bias, outrage, or addiction – outcomes we *can and do* judge as harmful to individuals or society. Dismissing concerns as "just evolution" avoids ethical evaluation.
      *   **"No Clear Unit" as Dodge:** Saying "it's messy, what can you do?" using #4 ignores that we *can* analyze *what traits* algorithms favor (e.g., simplistic outrage) and *what effects* they have (e.g., polarization), even if the unit is fuzzy. It's an excuse for inaction.
      *   **False Equivalence:** Equating artificial, human-designed selective environments (algorithmic feeds) with natural selection is deeply misleading. We can *change* the algorithms; we can't change gravity.

  **The Verdicts:**

  *   **Tautology:** "Change happens" (True, but useless).
  *   **Empirically Defensible:** Lamarckian inheritance & horizontal transmission (Core strengths of the analogy).
  *   **Contested/Overstated:** "No clear unit" (True it's fuzzier than genes, but overstated as a unique flaw and ignores similar debates in biology; often used as a dodge).
  *   **Often False/Misapplied:** When applied to complex, intentional systems (like law) or used to dismiss concerns about artificial selection (like algorithms). The analogy breaks under load.
  *   **Dismissing Algorithms:** Invokes the weakest, tautological part while ignoring intentionality, power, harm, and our ability to intervene. It's **edgy-sounding nonsense** that does **zero** real argumentative work except shutting down necessary critique. It confuses *description* ("algorithms create selective pressures") with *justification* ("therefore it's natural/neutral/unchangeable").
