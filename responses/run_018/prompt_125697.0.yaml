  The musician example expands beyond species-typical abilities, so it's enhancement. To maintain simplicity, grief compression must be classified as enhancement, overturning their hesitation. The principle would be: Therapy restores to baseline or species norm; enhancement exceeds either. This captures most cases, though growth hormone's social aspects require considering intent, which complicates things. But sticking to functional restoration avoids slippery slopes. The grief acceleration, while beneficial, isn't restoring dysfunction, so it's enhancement. The musician case clearly enhances beyond human norms, aligning with ultrasonic hearing.
answer: |-
  Your case-based approach reveals a remarkably consistent pattern pointing to a **"Restorative Function Principle"** anchored in *individual baseline restoration* and *species-typical functioning*. Let's break it down:

  **The Coherent Principle:**
  > **An intervention is therapeutic if its primary purpose is to restore an individual's capacity or function to:**
  > **a) Their own prior healthy baseline, OR**
  > **b) A broadly accepted species-typical functional range.**
  > **Enhancement occurs when the intervention aims to exceed *both* the individual's baseline *and* the species-typical range.**

  **Applying the Principle to Your Cases:**

  1.  **Severe Immunodeficiency/Gene Therapy (Child):** Restores to species-typical immune function (b). **Therapy.**
  2.  **Viral Resistance in Healthy Adult:** Exceeds species-typical function. **Enhancement.**
  3.  **Cochlear Implant for Hearing Loss:** Restores auditory function toward species-typical range (b). **Therapy.**
  4.  **Ultrasonic Hearing in Normal Hearing:** Exceeds species-typical sensory range. **Enhancement.**
  5.  **Mood Implant for Depression:** Restores emotional range to prior baseline (a) and species-typical function (b). **Therapy.**
  6.  **Permanently Elevated Mood:** Exceeds species-typical emotional variability. **Enhancement.**
  7.  **Reconstructive Burn Surgery:** Restores physical integrity/function toward prior baseline (a) and species-typical appearance/function (b). **Therapy.**
  8.  **Cosmetic Rhinoplasty:** Changes appearance/aesthetic *beyond* restoration of function or typical integrity. **Enhancement.**
  9.  **Cognitive Rehab Post-TBI:** Restores function to prior baseline (a). **Therapy.**
  10. **Working Memory Augmentation:** Exceeds individual baseline *and* species-typical limits. **Enhancement.**
  11. **Growth Hormone for Deficiency:** Restores growth trajectory toward individual genetic potential *and* species-typical range (b). **Therapy.**
  12. **Growth Hormone for Advantage:** Aims to *exceed* the individual's predicted potential *and* place them atypically high within (or beyond) the species-typical range. **Enhancement.** (The "pull" comes from both targeting a norm, but the *intent* and *direction relative to the individual's baseline* differ).

  **Resolving the Hard Cases:**

  *   **Growth Hormone Pair:** The principle clearly distinguishes them. Therapy *restores* function toward the species-typical range *from a deficit state*. Enhancement *leverages* the species-typical range as a starting point to push *beyond* the individual's expected potential within that range. The "statistical norm" is a reference point, not the goal itself; the goal is restoration vs. optimization.
  *   **Grief-Compression Protocol:**
      *   **Principle Verdict:** **Enhancement.**
      *   **Reasoning:** The bereaved person starts with a species-typical emotional response (grief) and undergoes a process within the species-typical trajectory (recovery over months). The intervention accelerates this *healthy*, non-pathological process beyond its natural timeline. It does not restore a lost capacity (the capacity to grieve and recover is intact) or correct a dysfunction (prolonged grief disorder is absent). It *optimizes* a normal function.

  **Overturning a Verdict for Simplicity:**

  *   **Your Grief Hesitation:** To maintain the principle's consistency, your oscillation on the grief-compression case must be resolved. Classifying it as **enhancement** is necessary. The gut feeling of "accelerating healing" is understandable, but the principle defines "healing" as restoring from pathology/dysfunction. Here, there's no pathology to heal, only a natural process to optimize.

  **Predicting the Musician Case (Microtonal Discrimination):**

  *   **Principle Verdict:** **Enhancement.**
  *   **Reasoning:**
      *   **Individual Baseline:** The musician *already has* perfect pitch, an exceptional ability. Their baseline sensory function is intact and superior. The intervention pushes their discrimination *beyond* this already exceptional baseline.
      *   **Species-Typical Function:** Human auditory discrimination has known biological limits. Microtonal intervals beyond normal resolution fall *outside* the species-typical functional range.
      *   **Restoration?** Nothing is being restored. A sensory faculty that is already significantly better than average is being expanded beyond human norms.
  *   **Governing Clause:** This is governed by the same clause as the ultrasonic hearing implant and the working memory augmentation: it aims to *exceed* both the individual's baseline (which is already high) *and* the species-typical functional limits.

  **Strengths and Nuances of the Principle:**

  1.  **Avoids Relativism:** It grounds "therapy" in objective concepts of functional impairment and species norms, not just subjective suffering or desire.
  2.  **Incorporates Individuality:** Prioritizing restoration to the *individual's* prior baseline (when possible) respects individual variation within the species-typical range.
  3.  **Handles "Normal Variation":** Clearly distinguishes correcting a *deficit* within the normal range (GH deficiency) from pushing beyond one's expected potential *within* the normal range (GH for height advantage).
  4.  **Clarifies "Natural Processes":** Distinguishes treating a pathological deviation (Prolonged Grief Disorder) from optimizing a non-pathological state (accelerating typical grief).

  **Limitations:**

  *   **Defining "Species-Typical":** Requires careful consideration of functional biology and avoiding overly restrictive or culturally biased definitions. It should focus on core functional capacities (e.g., immune defense, sensory perception, mobility, cognitive processing, emotional regulation range) rather than performance levels.
  *   **Blurred Boundaries:** Some conditions exist on spectrums (e.g., mild cognitive impairment). Does restoring to "low-normal" count? The principle provides guidance but requires clinical judgment.
  *   **Value-Neutral Labeling:** Calling something "enhancement" isn't inherently a moral judgment. It simply categorizes the *type* of intervention. The ethics of enhancement are a separate, complex discussion.

  **Conclusion:**
  Your gut reactions converge powerfully on the **Restorative Function Principle**. It cleanly resolves your listed cases, including classifying grief compression and growth hormone for advantage as **enhancement**, and the microtonal discrimination as **enhancement**. The minor cost is overriding your hesitation on the grief case, but this preserves conceptual coherence. This principle provides a robust, practical framework for navigating the therapy-enhancement boundary in emerging biotechnologies.
