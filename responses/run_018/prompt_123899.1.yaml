  Can you walk me through why a hypothetical 'karmic consequentialism' — maximize net dukkha reduction across all future rebirths, but only weight suffering that's causaly traceable to your present cetana — doesn't actually line up with either standard consequentialism or buddhist ethics? I want you to focus on the conceptual mess of tracking karma-ownership across lives (if my action now causes suffering in a being reborn later, is that still 'my' outcome to weigh?) and on why buddhist ethics cares about the mental quality of the present act in a way that makes foward-looking aggragation miss the point. Keep it focused, no need for citations.
reasoning: |-
  Okay, let me unpack this user's query about "karmic consequentialism." They're proposing a hybrid ethical system that combines consequentialism with Buddhist karma concepts—specifically maximizing net dukkha reduction across future rebirths, but only counting suffering causally linked to one's present intention (cetana). 

  Hmm, the user seems philosophically sophisticated—they're wrestling with core tensions between Western utilitarianism and Buddhist ethics. Their phrasing ("conceptual mess," "doesn't actually line up") suggests they already suspect this hybrid fails, but want to see why systematically. I should avoid jargon overload since they asked for no citations.

  First pain point: karma ownership across lives. If I steal and my victim's next-life suffering traces back to my action, is that "mine" to count? Theravada karma is individual—like a signature on a causal chain—so technically yes. But then... what about ripple effects? If my theft makes someone else charitable (reducing dukkha), does that offset "my" karmic balance? The system implodes here because karmic accounting isolates individual threads, while consequentialism needs total net outcomes. Can't have both.

  Second, Buddhist ethics cares deeply about present-moment mental quality (cetana's purity), not future aggregates. A compassionate act has intrinsic value even if outcomes get karmically messy later. Consequentialism would dismiss that as irrational—only results matter. But in Buddhism, feeding a hungry person with hatred might create future suffering despite short-term relief. The means *are* the ends karmically.

  User's probably probing how radically Buddhist ethics diverges from outcome-based systems. They might also be subtly asking: "Can I be a utilitarian Buddhist?" Answer's in the mismatch—Buddhism's anti-craving framework makes future-aggregation self-defeating. If you're calculating rebirth-level utils, you're still clinging to selfhood!

  ...Should emphasize how this hybrid's "karma-ownership" idea accidentally smuggles in a permanent self (attā), which Buddhism explicitly rejects. That's a deep flaw they might not have spotted. Keep it tight though—they want focus.
answer: |-
  Here's a breakdown of the core conceptual problems with "karmic consequentialism":

  1.  **The Ownership Problem Across Lives:**
      *   **Karma's Individualism:** Buddhist karma is fundamentally individual. *Your* present cetana (volition/intention) seeds *your* future experiences. The suffering or happiness *others* experience due to your actions is *their* karmic result, stemming from *their* past actions/conditions interacting with yours. It shapes their future, not yours.
      *   **"My" Outcome?** If your action now causes suffering in a being reborn later:
          *   That suffering is *their* karmic fruit ripening (perhaps due to their past vulnerability to actions like yours).
          *   The karmic consequence *for you* is the imprint of the unwholesome intention (greed, hatred, delusion) in your own mindstream, leading to *your* future suffering. You don't "own" or directly account for *their* resultant suffering in *your* karmic ledger.
      *   **Consequentialism's Demand:** Standard consequentialism requires aggregating *all* effects on *all* sentient beings. Karmic consequentialism tries to limit this to effects "owned" by *your* karma. But karma's individualism means you simply *can't* meaningfully claim "ownership" of the suffering experienced by another being in a future life as part of *your* karmic outcome to be maximized. Your karma affects your rebirth/experiences; their experience is their karma.

  2.  **The Primacy of Present Cetana vs. Future Aggregation:**
      *   **Buddhist Focus:** Buddhist ethics is primarily about the quality of the mind *right now*. The key question is: Is this intention (cetana) rooted in greed, hatred, and delusion, or in generosity, loving-kindness, and wisdom? The act's ethical value is intrinsic to the mental state motivating it. Cultivating wholesome cetana *is* the path to liberation (reducing dukkha at its root).
      *   **The Aggregation Distraction:** Focusing on maximizing net dukkha reduction across countless future rebirths:
          *   **Misses the Point:** It shifts attention away from the critical task of purifying the *present* mind. Whether an action *appears* to reduce net dukkha in some complex future calculation is irrelevant if it stems from unwholesome cetana (e.g., harsh speech intended to "help" someone).
          *   **Reintroduces Craving:** This future-oriented calculation is itself an act rooted in craving (for a "good" future outcome) and delusion (the complex calculation is impossible and misunderstands karma). It reinforces the sense of a "self" strategizing over a vast future, precisely what the Buddha taught leads to dukkha.
          *   **Ignores the Mechanism:** Karma works because unwholesome states *create* suffering *inherently* by coloring perception and locking one into cyclic existence. The suffering isn't just a disconnected future result; it's the inevitable flowering of the unwholesome seed planted now. Focusing on aggregate future outcomes obscures this direct causal link between present mental quality and future experience.

  **Why it Fails Both Systems:**

  *   **Fails Consequentialism:** By restricting the scope of outcomes to those "owned" by one's karma (an incoherent concept for aggregation), it violates consequentialism's core demand to consider *all* consequences for *all* beings impartially. It also inherits all the standard problems of long-term consequentialism (uncertainty, calculation impossibility).
  *   **Fails Buddhist Ethics:** It fundamentally misunderstands karma by trying to make it a system for calculating and optimizing future aggregate welfare. This detracts from the essential focus on purifying present intention (cetana) and the inherent link between unwholesome states and future suffering. It reintroduces the craving for control over future outcomes that the path seeks to eliminate.

  **In essence:** Karmic consequentialism tries to force the individual, intention-focused, non-aggregating mechanism of karma into the aggregating, outcome-focused framework of consequentialism. The "karma-ownership" concept makes aggregation impossible, and the future-aggregation focus undermines the Buddha's core teaching about the primacy of present-moment mental cultivation for liberation from dukkha.
