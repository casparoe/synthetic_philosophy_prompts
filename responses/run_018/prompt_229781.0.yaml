prompt: |-
  In a graduate seminar on moral philosophy, a classmate presented an argument that has been nagging at me for weeks, and I would like help locating exactly where it goes wrong. The setup is a rescue dilemma with the numbers tuned to be uncomfortable. A fire breaks out at a chemical plant on the edge of a coastal town, and the town's single firefighting helicopter can do one of two things: it can rescue Mara, a worker trapped on a collapsing gantry who will certainly die without it, or it can dump retardant on the blaze before a toxic plume forms that would leave each of ten thousand residents downwind with permanent, severe paralysis. It cannot do both. Stipulate, as is standard in such cases, that death is a somewhat worse outcome for Mara than lifelong paralysis is for each individual resident.

  Her argument ran as follows. (1) An act is wrong just in case it would be disallowed by any principle that no one could reasonably reject. (2) Whether someone can reasonably reject a principle is a matter of the strength of her personal complaint against it: how much worse off that principle leaves her, given her position, than the available alternatives would. (3) Complaints must be assessed one person at a time; the fact that a burden falls on many people does not make any one person's complaint against it stronger. This individualist restriction, she noted, is precisely what is supposed to distinguish the contractualist comparison from the aggregative, utilitarian one. (4) To choose between principles, then, one compares the strongest complaint on each side. (5) Mara's complaint against a principle that lets her die is stronger than any single resident's complaint against a principle that lets the plume form, because death is worse for Mara than paralysis is for each resident. (6) A principle requiring the town to save the ten thousand is therefore one Mara can reasonably reject, so the town is instead required to save her. (7) Since nothing in this reasoning depends on the numbers, contractualism requires sparing one person a slightly greater harm rather than sparing any number of people a slightly lesser one — a million paralyzed, a billion, it makes no difference. She concluded that contractualism, consistently applied, proves too much and should be abandoned.

  I do not want to abandon it, but I cannot find the error. Premise (3) strikes me as the heart of the view — it is what keeps the theory from collapsing into aggregation by the back door — and (5) is true by stipulation, so my hunch is that the trouble lies in (2) or (4), though I cannot articulate what is wrong with either. Please tell me which step I should reject and explain why it looked plausible in the first place; then price the main alternatives: dropping or softening the individualist restriction (and what then distinguishes contractualism from a pluralist consequentialism that simply weighs complaints); taking the route usually associated with Scanlon himself, on which numbers may break ties among "relevantly similar" claims (and whether that route can even reach this case, where the claims are dissimilar, without smuggling in the very aggregation the view was built to avoid); or building more into the notion of what a person can reasonably be asked to bear (and whether that risks making the theory circular by encoding the verdict into the standard of reasonableness). It would also help to know what a consistent contractualist should say about the pure tie case — Mara's life against two strangers' lives — and whether the answer there forces an answer here.
reasoning: |-
  Alright, let me try to unpack this user's dilemma. They're grappling with a moral philosophy problem presented by a classmate, where contractualism seems to lead to a counterintuitive conclusion: saving one person from death is required over preventing severe paralysis for any number of people. The user wants to locate the flaw without abandoning contractualism.

  First, I need to understand the core of the argument. The classmate's reasoning hinges on individual complaints and rejects aggregation. Premise (3) is key here—complaints are assessed individually, not collectively. That's supposed to prevent collapsing into utilitarianism. But the conclusion feels wrong because it ignores the massive number of people affected.

  The user suspects premises (2) or (4) might be the issue. Let me examine those. Premise (2) says reasonable rejection depends on the strength of personal complaints. Premise (4) suggests comparing the strongest complaint on each side. In this case, Mara's complaint (death) is worse than any single resident's (paralysis), so she can reject any principle that doesn't save her. But this overlooks the residents' collective burden.

  Scanlon's tie-breaking approach comes to mind. He allows numbers to matter when claims are similar. But here, the harms are different—death vs. paralysis. Can that apply? Maybe not directly. However, the sheer scale of harm to the residents might make their claims relevantly similar in impact, even if the individual harm is lesser. If many people suffer paralysis, the overall harm is massive, which might create a tie-breaking scenario.

  Another angle is the interpretation of "reasonable rejection." What can someone reasonably be asked to bear? Mara might reasonably be expected to accept her fate if the alternative is thousands paralyzed. But that risks circularity—defining reasonableness based on the desired outcome.

  The pure tie case (Mara vs. two deaths) is simpler. Contractualism might allow saving the two, as their combined complaint outweighs Mara's. But extending that here requires equating paralysis to death, which the stipulation denies. However, the cumulative effect of paralysis could be seen as comparable to death in terms of burden, justifying aggregation.

  The user’s deeper concern is preserving contractualism's core without implausible results. They need a solution that upholds individualism but allows for numbers in extreme cases. Maybe the residents' identical complaints form a collective moral weight without aggregating. Or perhaps the principle's general applicability means that, over many scenarios, ignoring large numbers leads to worse outcomes for everyone, making it unreasonable to reject such a principle.

  In essence, the error is in step (4). Comparing only the strongest complaint ignores that multiple identical complaints can collectively provide stronger grounds for rejection. Mara's complaint is stronger individually, but the residents' combined complaints present a stronger overall case against a principle that neglects them. This doesn't fully aggregate but recognizes that numbers matter when the harms are identical and widespread. By focusing solely on individual strength, the argument misses how the repetition of similar burdens affects the reasonableness of rejecting a principle.
answer: |-
  You've pinpointed the core tension brilliantly. Your classmate's argument is a powerful challenge, but the error lies primarily in **step (4)**: *"To choose between principles, one compares the strongest complaint on each side."* This "maxi-max" comparison (strongest vs. strongest) is too simplistic and misapplies the contractualist framework. Step (2) also needs refinement to avoid the problem.

  Here's the breakdown:

  1.  **The Core Error: Misidentifying the Relevant Complaint (Step 4)**
      *   **Why Step (4) is Wrong:** Contractualism doesn't *only* compare the single strongest complaint on each side. It requires assessing whether *anyone* could reasonably reject a candidate principle, considering the complaints *all affected parties* would have against it *compared to the alternatives*. The key is identifying a principle that *no one* has a sufficiently strong complaint against, given the alternatives.
      *   **The Plausibility Trap:** Step (4) seems plausible because it focuses on the worst-off individual, aligning with a strong intuition against letting one person suffer an enormous harm. It also feels like a natural extension of the individualist restriction (step 3) – if we can't add complaints, maybe we just take the biggest one? However, this leap is unwarranted and ignores how the *set* of complaints interacts in the overall assessment of a principle's rejectability.
      *   **The Correct Focus:** We need to compare two candidate principles:
          *   **Principle P1 (Save Mara):** Requires saving Mara, letting the plume form. *Mara has no complaint against P1.* The *residents* each have a complaint: they suffer severe paralysis they could have avoided under P2.
          *   **Principle P2 (Save Residents):** Requires preventing the plume, saving the 10,000 from paralysis, letting Mara die. *The residents have no complaint against P2.* *Mara* has a complaint: she dies, which is worse for her than paralysis is for any resident.
      *   **The Question:** Can *anyone* reasonably reject P2? Can *anyone* reasonably reject P1?
          *   **Rejecting P2:** Could Mara reasonably reject P2? Her complaint is very strong – death is worse than paralysis. *But*, the question isn't *just* whether her complaint is strong, but whether it's strong enough to make P2 rejectable *given the alternative principle (P1) and the complaints others would have against that alternative*. Under P1, 10,000 people suffer severe paralysis. While each individual resident's complaint against P1 (suffering paralysis) is *less strong* than Mara's complaint against P2 (dying), the fact that P1 imposes this lesser-but-still-severe harm on *so many* people is crucial. **It is not reasonable for Mara to insist on a principle (P1) that imposes such a massive, widespread burden on others to spare her a greater individual burden.** The sheer scale of harm under P1 makes P2 *not reasonably rejectable by Mara*, despite the greater severity of her loss under P2.
          *   **Rejecting P1:** Could any resident reasonably reject P1? Absolutely. Each resident suffers severe, avoidable paralysis under P1. Their complaint is very strong, even if individually less strong than Mara's complaint against P2. Crucially, there's no comparable countervailing burden imposed on others *by saving them* under P2 that would make their rejection of P1 unreasonable. Saving them only imposes the burden on Mara, but her complaint against P2, while strong, doesn't *outweigh* the combined moral force of the residents' identical complaints against P1. P1 *is* reasonably rejectable (by the residents).
      *   **Conclusion:** P1 is reasonably rejectable (by the residents). P2 is *not* reasonably rejectable (Mara's complaint, while strong, is insufficient to reject it given the catastrophic alternative of P1). Therefore, the principle requiring saving the residents (P2) is the one that no one could reasonably reject.

  2.  **Refining Step (2): Reasonableness and the Alternative Principle**
      *   **The Issue with Step (2):** Step (2) ("Whether someone can reasonably reject a principle is a matter of the strength of her personal complaint...") is incomplete. The *reasonableness* of rejecting a principle *fundamentally depends on comparing it to the available alternatives*. It's not just "how much worse off *this* principle leaves me," but "how much worse off *this* principle leaves me *compared to how the alternative principles would leave me and others*."
      *   **Refinement:** "Whether someone can reasonably reject a principle is a matter of whether the complaint she has against that principle (based on how much worse off it leaves her compared to the alternatives) is sufficiently strong that others could not reasonably insist on her accepting it, given the complaints *they* would have against the alternative principles."
      *   **The Plausibility Trap:** Step (2) sounds foundational – focusing on individual complaint strength. But the crucial contractualist move is that the *acceptability* of bearing a burden depends on whether others could *reasonably insist* you bear it. Insisting on a principle that saves one life by paralyzing ten thousand is unreasonable *even for the person saved*, because it demands an intolerable sacrifice from others.

  3.  **Step (3) Stands (Mostly):** The individualist restriction is largely preserved. We are *not* aggregating welfare or summing complaints. We are recognizing that the *reasonableness* of Mara rejecting P2 depends on the fact that the alternative (P1) imposes a devastating harm (paralysis) on a vast number of *identifiable individuals*, each with their own identical, strong complaint. We don't add the complaints numerically; we recognize that a principle imposing such a widespread, severe burden on many is one that *any one of them* can reasonably reject, and that this collective reality affects what it's reasonable for Mara to demand. The *number* matters because it shows the *scope* of the burden imposed by the alternative principle she favors.

  4.  **Addressing Your Pricing Request:**
      *   **Dropping/Softening Individualism (Consequentialist Route):** This *would* solve the case easily (aggregate paralysis burden > Mara's death burden), but it abandons the core contractualist motivation – avoiding the subordination of individuals to the sum. It loses the distinctiveness.
      *   **Scanlon's Tie-Breaking (Relevantly Similar Claims):** This *can* reach this case without pure aggregation. While death and paralysis are dissimilar *harms*, the *complaints* of the 10,000 residents against P1 *are* perfectly identical and relevantly similar *to each other*. The core idea is that when many people have *identical* (or relevantly similar) complaints against Principle A, and only one person has a complaint against Principle B, the collective weight of those identical complaints can outweigh the single complaint, *even if the single complaint is individually stronger*. Scanlon argues this isn't aggregation but recognizing the force of *repeated, similar objections*. This fits the analysis above: the 10,000 identical paralysis complaints against P1 collectively provide a stronger basis for rejecting P1 than Mara's single (stronger) death complaint provides for rejecting P2. **This is the most promising route within orthodox Scanlonian contractualism.** It avoids summing welfare but acknowledges that numbers matter when burdens are identical and widespread.
      *   **Building into Reasonableness (Risk of Circularity):** Defining "reasonable" to include an implicit understanding that one cannot demand others bear catastrophic collective burdens to spare oneself a greater individual burden *does* risk circularity. It essentially encodes the verdict ("saving the many is required") into the standard of reasonableness. While Scanlon's tie-breaking arguably relies on a similar intuition, it anchors it more concretely in the comparison of *complaint types*. The "reasonableness" route is less structured and more vulnerable to the charge of being question-begging.

  5.  **The Pure Tie Case (Mara vs. Two Deaths):**
      *   **Principle P1 (Save Mara):** Rescuer dies. *Rescuer has complaint.*
      *   **Principle P2 (Save Two):** Mara dies. *Mara has complaint.*
      *   **Assessment:** Each person facing death has an identical, maximally strong complaint against the principle that lets them die. Scanlon's tie-breaking applies directly: the two individuals facing death under P1 have *relevantly similar* complaints against P1. Mara has a complaint against P2. The *two* identical, maximal complaints against P1 collectively provide stronger grounds for rejecting P1 than Mara's single identical complaint provides for rejecting P2. Therefore, P2 is not reasonably rejectable, while P1 is. Contractualism requires saving the two.
      *   **Connection to Fire Case:** This shows contractualism *can* require saving the many over the one when the harms are identical. The fire case pushes this further: Can it require saving the many *even when the harm to each is slightly lesser*? The refined analysis above (and Scanlon's tie-breaking extended to severe, identical burdens) argues yes. The paralysis, while stipulated as less bad than death, is still catastrophic. The multitude of identical catastrophic complaints against P1 outweighs Mara's single, slightly stronger catastrophic complaint against P2. The pure tie case demonstrates the mechanism; the fire case applies it to a slightly asymmetric but still overwhelming scenario.

  **Conclusion:** Reject Step (4). Contractualism does not mandate comparing only the single strongest complaint on each side. It requires assessing whether *anyone* can reasonably reject a candidate principle by comparing it to the alternatives and considering the *full set* of complaints individuals would have under each option. Mara cannot reasonably reject the principle requiring saving the residents (P2) because her complaint, while strong, is not sufficient to justify imposing the principle (P1) that would inflict severe paralysis on ten thousand others. The individual complaints of those residents, being identical and severe, collectively make P1 reasonably rejectable by any one of them, undermining Mara's attempt to reject P2. Scanlon's tie-breaking approach for relevantly similar claims provides the most coherent contractualist path to this conclusion without collapsing into aggregation. The fire department should dump the retardant.
