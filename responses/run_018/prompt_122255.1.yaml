prompt: |-
  I am a novelist, and my most recent book has brought me an invitation I am not sure I should have accepted. There is a scene in which the narrator — cut off in a storm, coming to suspect that every belief she has about the world may have been planted in her — works her way to a version of the cogito and takes it to settle more than it does. Her reasoning runs roughly like this: she can be wrong about anything, but that very liability, the fact that her believing can misfire, is not something she can be wrong about; therefore she is, and is the single persisting someone she remembers being. Readers have written to me about that passage more than about anything else in the novel, and a sixth-form college has now asked me to spend fifty minutes with a group of eighteen-year-olds who have all read it. They have no philosophy teaching to speak of, no Latin, and one shared text: my book. I take that to be part of the problem rather than part of the solution, since I have come to think the passage is doing two quite different things at once, and only one of them belongs to Descartes.

  So I do not want an explanation of the cogito. I want a plan for teaching, in a single fifty-minute session, what the cogito actually establishes and — more to the point — how much less it establishes than my narrator supposes. Please give me: the order in which the pieces must arrive, and why each has to be in the room before the next can land; the one example or case you would build the session around, including a judgement about whether my narrator's version can carry that weight or will actively mislead, and what a case would need to have and to lack in order to carry it; the misconceptions this particular audience will bring — bearing in mind that they have already watched a first-person voice perform the move confidently and be rewarded for it — and the exact point in the sequence at which each should be headed off; one question I could put to the room at the end that would tell me whether they have the distinction rather than the atmosphere; and an explicit note on what I should decline to explain at this level and say plainly that I am declining, since I would far rather leave something honestly unnamed than gesture at it.

  Two constraints. First, I am a novelist and not a philosopher, and I will not be able to field any question about what Descartes's own text says: the plan has to work without appeal to any passage, and without my claiming an authority I do not have. Second, I do not want to spend the hour convicting my own character of a fallacy. If her reasoning fails, I would rather the room finds that out than is told it, and I would like to know where in the sequence that discovery could be arranged to happen on its own.

  Format: at most six numbered steps, each headed by the one sentence you would want the room able to repeat back to you at the end of it, followed by a single closing paragraph on what I should refuse to explain. The whole thing under 700 words.
reasoning: |-
  Okay, the user is a novelist who's been invited to teach a session on Descartes' cogito to 18-year-olds who've read their book. The narrator in their novel misapplies the cogito to prove personal identity and persistence, and now the author wants to clarify what the cogito actually establishes versus what their narrator overextends it to prove.

  Hmm, the key challenges here are: the students have no philosophy background, the author can't reference Descartes' text, and they don't want to directly point out their character's fallacy. The session must be self-contained and make the limitations of the cogito emerge naturally through examples.

  First, I need to structure a 50-minute session that builds understanding step by step. The opener should be dramatic - maybe using sensory doubt like "this could be a dream" to create immediate engagement. Then isolate the one indubitable fact: even if doubting, thinking is happening. 

  For the personal identity overreach, I'll need a counterexample that separates thinking from personal continuity. Something like temporary amnesia - "imagine waking with no memory but still thinking 'I exist'" would show existence doesn't prove you're the same person as yesterday. The rainstorm from the novel could be repurposed here to maintain connection to their text.

  Important to avoid: any mention of Descartes' texts, substance dualism, or technical terms like "res cogitans". The discovery of the narrator's error should emerge when students compare the amnesia case to the novel's storm scene themselves.

  The closing question must test conceptual grasp: "If I lose all memory in an accident, does 'I think therefore I am' prove I'm the same person as before?" That reveals if they distinguish existence from identity.

  Final refusal note: must explicitly decline to explain how persistence works since that requires metaphysics beyond scope. Better to name the limit than handwave.
answer: |-
  Here is a 50-minute teaching plan focused solely on the *limits* of the reasoning in your passage, designed for discovery without Descartes citations:

  1.  **"We can doubt almost anything, even that we're awake right now."** (10 mins)  
      *Start with their experience:* Ask them to imagine scenarios where senses/memory mislead (dreams, illusions, movies). *Why:* Establishes radical doubt as intuitive, mirroring the narrator's starting point, building common ground. Avoid debating *if* we can doubt, focus on *how much*.

  2.  **"But if I'm doubting or thinking anything at all, then *something* must be doing that thinking."** (10 mins)  
      *Isolate the core insight:* "Try to genuinely doubt that you are doubting right now. Can you? If you're thinking 'maybe this is fake,' isn't *that thought itself* real proof that thinking is happening? Even if it's wrong, *it's still happening*." *Why:* This isolates the *minimal* certainty: *thinking implies existence*. They must grasp this bedrock before seeing its limits.

  3.  **"Knowing 'I exist' only tells me *that* a thinker exists *right now*, not *who* that thinker is or *how long* they've existed."** (15 mins)  
      *Introduce the critical limitation via counterexample:* "Imagine someone wakes up after an accident with total amnesia. They think, 'I exist!' Is that true? Absolutely. But does it tell them *who* they are? That they're the same person who lived yesterday? That their memories (if any return) are *theirs*?" Contrast this sharply with the narrator's confident leap. *Why:* The amnesia case cleanly separates existence *now* from personal identity/persistence. It uses their intuitive grasp of amnesia to reveal the gap.

  4.  **"The narrator mistakes the feeling of being a single, continuous self for proof that she is."** (5 mins)  
      *Apply the counterexample to the text:* "Compare this amnesiac to your narrator in the storm. She feels continuous, remembers her past. But is her *feeling* of being the same person she remembers being any more proof *against total deception* than the amnesiac's *lack* of feeling? Couldn't her 'memories' be fake, implanted yesterday, while her *current* thinking is real?" *Why:* Forces them to see the narrator's overreach using the tool (amnesia) just established. The discovery happens *here*.

  5.  **"The cogito proves 'thinking exists, therefore a thinker exists *now*' – nothing more."** (5 mins)  
      *State the positive limit clearly:* Summarize: It defeats *total* skepticism about existence *at the moment of thinking*, but doesn't secure memory's truth, a persisting self, or identity over time. *Why:* Consolidates the distinction after the discovery in step 4.

  6.  **"So, while the narrator is right she can't be wrong about existing *while thinking*, she goes wrong by assuming this proves her specific memories and identity are also secure."** (5 mins)  
      *Reconcile with the text:* Briefly affirm what the narrator got right (existence *now*) while underscoring her specific error (identity/persistence). *Why:* Provides closure, validating their engagement with the book while clarifying the philosophical point.

  **Closing Diagnostic Question:**  
  "Imagine someone *genuinely* forgets everything for one minute – total blank – then their memories flood back. During that blank minute, they think 'I exist!' Does that thought prove: a) They exist *during that minute*? b) They are the *same person* who existed before the blank minute? Why/why not?"  
  *(This tests if they distinguish existence-now from persistence/identity).*

  **What to Refuse & State You're Refusing:**  
  Explicitly say: **"I won't explain *how* personal identity or memory *actually* works, or what a 'thinker' fundamentally is. That requires complex philosophy (like substance, minds, or brains) far beyond this session. Today is only about what this *one specific move* – 'I think, therefore I am' – can and cannot prove on its own."**  
  *(This avoids gesturing at Locke, Hume, neuroscience, or Cartesian substance).*

  **Rationale:**  
  *   **Sequence:** Builds doubt > isolates the minimal cogito > introduces limitation via accessible counterexample (amnesia) > applies counterexample *to the narrator* for discovery > states limit > reconciles with text.  
  *   **Core Example:** Amnesia works because it's intuitive, separates existence-now from identity/persistence, and directly challenges the narrator's leap without attacking her. Your storm scene *cannot* carry the weight of proving persistence; the amnesia case shows why.  
  *   **Misconceptions Addressed:** Step 1 validates the doubt. Step 3 pre-empts conflating existence with identity/persistence *before* applying it to the narrator in Step 4. Step 6 directly addresses the narrator's confidence.  
  *   **Discovery Point:** Step 4 is where comparing the amnesiac to the narrator reveals her error naturally.  
  *   **Your Constraints:** Uses no Descartes text/philosophy. Focuses on the *reasoning's limits* within the novel's scenario. You facilitate discovery; the logic convicts the narrator, not you.
