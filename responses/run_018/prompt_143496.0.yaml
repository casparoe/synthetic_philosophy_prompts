answer: |-
  Here's a thought experiment meeting your specifications:

  **Scenario:** Lena is on a high-speed train traveling west from Paris to Bordeaux at 300 km/h, carrying a crucial contract needing her partner Marco's signature in Bordeaux to be valid. Marco is simultaneously on another high-speed train traveling east *away* from Bordeaux towards Lyon at 300 km/h. They communicate via an app showing their exact locations. At precisely 12:00:00 PM according to synchronized clocks at the Paris and Lyon stations, Marco signs the digital contract on his tablet. Due to their high relative speed (600 km/h closing speed), the laws of physics dictate that for Lena (heading towards Bordeaux), Marco's signing event *hasn't happened yet* at her 12:00:00 PM – her "now" includes Marco still preparing to sign. For Marco (heading away), his "now" at 12:00:00 PM *includes* the completed signing. They argue via text: Lena insists "The contract isn't signed *right now*," while Marco texts back "It *is* signed right now, I just did it!", both referring to the status of the contract document at 12:00:00 PM.

  **Analysis:**

  1.  **Presentism:**
      *   **Reality of Event/Object:** Only one "now" is truly real. The presentist *must* choose: *either* Marco is signing right now (making the signed contract real) *or* he hasn't signed yet (making the unsigned draft real). They cannot both be correct about the *current* state of reality. Presentism forces the conclusion that one observer is simply *mistaken* about what constitutes the present moment and the current state of the contract (signed vs. unsigned). Reality doesn't contain both possibilities simultaneously.
      *   **Divergence Cause:** The relativity of simultaneity – the fact that high relative motion means observers genuinely disagree on which distant events are happening "now" – directly contradicts the core presentist tenet of a single, universal, objectively real present.

  2.  **Eternalism (Block Universe):**
      *   **Reality of Event/Object:** The signing event and both the pre-signed and post-signed states of the contract exist permanently within the four-dimensional block universe. Marco's "now" (including the signed contract) and Lena's "now" (including the unsigned contract) are equally real, but they are slices through the universe at different *temporal angles* relative to each observer's motion. Both descriptions of the contract's state are correct *for their respective frames of reference*, describing different temporal locations of the same enduring document within the block.
      *   **Divergence Cause:** Eternalism readily accommodates the relativity of simultaneity. Different "nows" are just different ways of carving up the eternally existing block of spacetime; no single "now" is privileged as *the* present. The disagreement is about perspective within the fixed whole, not about what fundamentally exists.

  **Presentist Objection (Smuggling Assumptions):** A presentist could argue that describing the contract as a single object persisting from unsigned to signed *across time* already presupposes eternalism. For the presentist, the unsigned contract exists *now*, and the signed contract will exist in the *future* (when that future becomes present). Talking about it as one "enduring document" implies a timeline where both states co-exist (just at different times), which is precisely what eternalism asserts and presentism denies. The presentist insists the *only* real object is the contract *as it is right now in the single present moment*; referring to its "future" or "past" states as equally real parts of "the document" is question-begging.

  **Removing Relative Motion:** Stripping away the relative motion *collapses the specific ontological tension* created by the relativity of simultaneity, but it *does not eliminate the core philosophical disagreement*; it merely *reduces it to a disagreement about subjective psychology vs. fundamental ontology*.

  *   **Without Relative Motion:** Observers agree on simultaneity. Both Lena and Marco would agree whether the contract is signed "right now" at 12:00:00 PM. The presentist says only that agreed-upon "now" and the contract's state *at that now* are real. The eternalist says that "now," along with all other times and the contract's states at all those times, are equally real parts of the block universe. The *disagreement* about the *current state* vanishes, but the fundamental question remains: **Is reality confined to a single, moving present moment, or is all of time equally real?** The argument shifts from "Which 'now' is real?" to "Is *only* the 'now' real, or is all time real?" – a debate about the nature of time itself, not just perception caused by motion. The tangible object (the contract) still serves to anchor the question: "Does *only* its current state exist (Presentism), or do all its past and future states exist just as firmly (Eternalism)?"
