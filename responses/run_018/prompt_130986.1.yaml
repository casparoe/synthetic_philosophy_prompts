  First, I need to recall the colour phi phenomenon: when two coloured dots flash in sequence, we perceive motion and a mid-trajectory colour change, even though no intermediate dot exists. The standard neuroscientific explanation involves postdiction (Orwellian) or delayed consciousness (Stalinesque), per Dennett's dichotomy. 

