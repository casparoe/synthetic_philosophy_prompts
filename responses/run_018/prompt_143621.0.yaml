prompt: |-
  I'm writing a feature for a science-and-ideas magazine on how bioethicists draw moral-status lines as synthetic biology advances. In interviews, a philosopher I'll call Dr. A. Voss has offered these consistent rulings: full status for neurotypical adult humans and great apes, grounded in integrated self-awareness and social reciprocity; substantial but unequal status for pigs, based on emotional complexity and cognitive flexibility; minimal but nonzero status for chickens, citing nociception without higher-order integration; zero status for insects and for bee colonies, despite collective problem-solving, because no unified subjective experience exists; zero status for current large language models, since linguistic fluency without biological sentience or evolutionary interests carries no moral weight; and zero status for hypothetical networked invertebrate "hive minds," even when collective intelligence exceeds individual capacity. The unaddressed case is a cerebral organoid grown from human stem cells that develops nociceptive signaling and simple associative learning, yet lacks a brainstem, cortex, social architecture, and evolutionary history, existing only in vitro. Predict Voss's verdict on whether this organoid possesses moral status; identify at least two principles that fit all her earlier rulings equally well; state which principle she is most likely running and why; specify what each principle predicts about the organoid; and propose the further case that would best discriminate between them. Separate what is settled in the moral-status literature from what remains genuinely contested among specialists, and do not present a disputed view as consensus. Keep your response to 350 words or fewer, opening with a one-sentence bottom line.
