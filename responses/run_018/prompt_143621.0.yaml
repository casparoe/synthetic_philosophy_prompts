  Dr. Voss is most likely running Principle 1 because she explicitly cited "no unified subjective experience" for bee colonies and focused on integrated self-awareness in humans/apes. Biological Embodiment seems secondary since she didn't mention it directly.

  Predictions: Subjective Unity gives zero status to the organoid (no unified self), while Biological Embodiment also gives zero (lacks embodied evolution/history). To discriminate, I propose a hypothetical: engineered mammal tissue with human-like neural integration but artificial origin. Subjective Unity might grant status if unified consciousness exists, while Biological Embodiment would reject it due to unnatural origins.

  On the literature: Consensus exists on rejecting consciousness in LLMs/invertebrate collectives, and on gradations for animals. But the basis of moral status (sentience vs. life history) and handling of marginal cases like organoids remain hotly contested. I must present this as disputed, not settled.

