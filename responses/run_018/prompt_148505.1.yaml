  Below is a detailed design for a 90-minute workshop simulation addressing recursive calibration debt and the tension between bootstrapping reliability and the problem of easy knowledge. The activity, titled **"The Envelope Protocol,"** uses tangible props, assigned roles, and a point-based scoring system to make the philosophical tension physically and socially felt. Participants will experience how collective self-validation creates a "debt" that forces a choice between circularity or forfeiture.

  ---

  ### **Workshop Structure**
  **Total Time:** 90 minutes  
  - Setup & Rules (10 min)  
  - Activity: Phases 1–3 (50 min)  
  - Debrief & Discussion (30 min)  

  ---

  ### **Materials Needed**
  - **16 sealed envelopes** (15 normal, 1 "skeptic’s envelope").  
    - *Normal envelopes*: Contain a card with a **shape** (▲/●/■) and a **symbol** (X/O) visible only via the "protocol."  
    - *Skeptic’s envelope*: Contains conflicting information (e.g., shape ▲ but symbol X, violating the group’s rule).  
  - **UV flashlight & UV-visible pens** (the "perceptual protocol"): Symbols (X/O) are written in UV ink; shapes are embossed (tactile).  
  - **Role cards** (4 types, 4 copies each).  
  - **Tokens**: 40 poker chips (or sticky notes) for scoring.  
  - **Whiteboard** to track team points.  

  ---

  ### **Roles (Assign to All 16 Students)**  
  Divide into **4 teams of 4**. Each team member takes one role:  
  1. **Perceptual Agent (PA)**: Uses the UV light to "read" symbols. Only they handle the flashlight.  
  2. **Tactile Agent (TA)**: Feels embossed shapes. Only they touch envelopes.  
  3. **Logician (L)**: Records data, constructs arguments.  
  4. **Validator (V)**: Challenges assumptions, tracks debt tokens.  

  ---

  ### **Rules & Stakes**  
  - **Scoring**: Teams earn/lose tokens for speed and certainty.  
    - Phase 1: 1 token per correctly categorized envelope.  
    - Phase 2: 3 tokens for unanimous validation; lose 1 token per "debt token" accrued.  
    - Phase 3: 5 tokens for correct global conclusion; lose 5 for incorrect claims.  
  - **Debt Tokens**: Issued when teams use the protocol to validate itself. Validators hold these (physical chits) to make debt visible.  
  - **Time Pressure**: 15 min/phase. Delays cost tokens.  

  ---

  ### **Activity Flow**  

  #### **Phase 1: Basic Knowledge (15 min)**  
  **Task**: Establish a shared perceptual protocol.  
  - Each team receives 4 envelopes (3 normal, 1 skeptic’s mixed in randomly).  
  - **Protocol**:  
    - TA feels the shape (▲/●/■) and reports to L.  
    - PA uses UV light to read the symbol (X/O) and reports to L.  
    - L records shape-symbol pairs (e.g., "▲ → O").  
    - Teams must agree: *"Shapes predict symbols"* (e.g., ▲ = O, ● = X, ■ = X).  
  - **Goal**: Categorize all 4 envelopes using the protocol.  
  - **Stakes**: 1 token per correct prediction (validated later).  

  *Epistemological move: Basic perceptual knowledge via agreed-upon methods.*  

  ---

  #### **Phase 2: Internal Validation (15 min)**  
  **Task**: Validate the protocol using the protocol.  
  - Teams combine data (whiteboard). A consensus rule emerges (e.g., "▲ always = O").  
  - **Protocol**:  
    - Each team selects one envelope to "validate" using the same UV/tactile method.  
    - V issues a **debt token** to their team if validation *uses the protocol on itself* (e.g., re-scanning the same envelope).  
    - Teams argue: *"Our method is reliable because it consistently works."*  
  - **Goal**: Unanimously declare the protocol "reliable."  
  - **Stakes**: 3 tokens if all teams agree; lose 1 token per debt token held.  

  *Epistemological move: Bootstrapping reliability via internal consistency.*  

  ---

  #### **Phase 3: Global Skepticism Challenge (20 min)**  
  **Task**: Defeat radical skepticism (the hidden skeptic’s envelope).  
  - **Error Hypothesis**: "One envelope lies—it breaks the shape-symbol rule."  
  - **Protocol**:  
    - Teams use the protocol to scan all 16 envelopes again.  
    - L’s construct arguments: *"No errors found → no liar envelope exists."*  
    - V’s issue debt tokens if teams cite Phase 2’s validation as proof.  
  - **Decision**: Teams vote:  
    - **A. Closure Claim**: "No liar envelope exists." (Uses protocol + closure)  
    - **B. Forfeit**: "We can’t know without opening envelopes." (Rejects closure)  
  - **Stakes**:  
    - **A**: Correct → +5 tokens; Wrong → −5 tokens.  
    - **B**: No gain/loss, but protocol is "suspended" (no more tokens).  
  - **Reveal**: Facilitator opens the skeptic’s envelope, exposing the conflict.  

  *Epistemological move: Closure principle vs. forfeiture; debt comes due.*  

  ---

  ### **Debrief (30 min)**  
  **Do not use formal terms until the end.** Map the activity to philosophy:  

  | **Activity Moment**          | **Epistemological Move**                                  |  
  |------------------------------|-----------------------------------------------------------|  
  | Phase 1 consensus rule       | Basic perceptual knowledge (collectively agreed input)    |  
  | Phase 2 self-validation      | Bootstrapping reliability (using the faculty to vouch for itself) |  
  | Debt tokens issued           | Recursive calibration debt (invisible liability)          |  
  | Phase 3 closure claim        | Easy knowledge (deriving immunity from skepticism)        |  
  | Phase 3 forfeit option       | Surrendering conclusions to avoid circularity             |  
  | Skeptic’s envelope reveal    | Radical skepticism embodied                               |  

  **Reveal Formal Terms**:  
  - Problem of easy knowledge: Closure lets groups "cheaply" defeat skepticism.  
  - Bootstrapping: Self-validation feels intuitive but creates debt.  
  - Recursive calibration debt: Debt paid via circularity (accepting Phase 2) or forfeiture (rejecting Phase 3 claims).  

  **Predicted Failure & Fixes**:  
  - **First-run failure**: Teams may overlook debt tokens, missing the circularity.  
    - *Fix*: Have Validators announce debt loudly (e.g., "We owe 2 tokens!").  
  - **First-run failure**: Teams may open envelopes prematurely, dodging the tension.  
    - *Fix*: Ban opening envelopes; enforce protocol dependence.  
  - **First-run failure**: Logicians may reject closure, avoiding the dilemma.  
    - *Fix*: Reward bold closure claims (extra tokens) to incentivize risk.  

  **Limitation & Facilitator Role**:  
  - The activity **cannot replicate first-person bootstrapping** (individual self-trust). Students experience *collective* circularity, which feels less vulnerable than solitary doubt.  
  - **Facilitator must**:  
    1. Highlight the "I/we" gap: Ask, *"Would you trust this protocol alone in a lab?"*  
    2. Contrast personal vs. distributed validation: Note how groups "hide" circularity in consensus.  

  ---

  ### **Why This Works**  
  - **Tangible debt**: Tokens make calibration debt visceral.  
  - **Stakes create tension**: Points force trade-offs between certainty and circularity.  
  - **Role conflict**: Validators vs. Logicians embody the philosophy’s tension.  
  - **Surprise reveal**: The skeptic’s envelope concretizes radical skepticism.  

  This simulation transforms abstract epistemology into a physically engaging dilemma, ensuring students leave feeling the weight of recursive calibration debt.
