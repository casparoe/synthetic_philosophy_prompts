prompt: |-
  im in this transitional justice seminar and we keep reading about amnesty being tied to truth-telling, but nobody actually explains how you'd run a decision case-by-case. let's say i work for a small regional board that can grant conditional amnesty to individual perpetrators, but only if the grant satisfies both "truth recovery" (victims learn what actually happened) and "non-repetition" (the institution that enabled harm is locked from doing it again). the catch is our charter gives us zero authority over institutions, only over people, so the principle has to be applied at the individual level, with a mandatory flag when institutional failure makes the grant moot regardless of the person.

  turn that into a reusable procedure my office could actually run: the ordered questions, what counts as a sufficient answer at each step, the hard-stop no's, and the exact points where we hand it to a human because its values not facts. then apply it to three proposals: (1) a prison guard who gives full verified testimony about torture but the prison system hasn't changed at all; (2) a mid-level commander who offers partial testimony and personally destroys his unit's hidden records (which he alone controls) to block future abuse, but refuses to name higher-ups; (3) a low-level informant whose testimony would locate a hidden mass grave, but the victims' families explicitly reject any deal and demand prosecution.

  present it like a flowchart in words with checkboxes, not a long essay, keep the whole thing under 400 words, and flag where the procedure will misfire or spit out an answer people won't like. also say what it literally cannot do given our institutional limits. include a typo or two if it feels natural.
reasoning: |-
  We are designing a procedure for a regional board that grants conditional amnesty to individuals. The conditions are:
     - Must satisfy "truth recovery": victims learn what actually happened.
     - Must satisfy "non-repetition": the institution that enabled harm must be locked from doing it again.
     - However, the board has authority only over individuals, not institutions. So, non-repetition must be addressed at the individual level, with a mandatory flag when institutional failure makes the amnesty moot.

   The procedure will be a flowchart in words with checkboxes. Steps:

   1. **Truth Recovery Check**: 
        - Question: Does the applicant provide full and verified testimony that reveals new, material facts about the harm to the victims or their families?
        - Sufficient Answer: Testimony must be independently verifiable and fill gaps in the victims' knowledge. Must cover who, what, when, where, and how.
        - Hard-stop No: If testimony is partial, unverifiable, or does not add new information that victims need, reject.
        - Human Judgment: If the testimony is partially sufficient but has gaps, human must decide if it meets the spirit of truth recovery.

   2. **Individual-Level Non-Repetition Check**:
        - Question: Has the applicant taken concrete, verifiable actions that materially reduce the risk of recurrence by disabling the specific mechanisms they controlled?
        - Sufficient Answer: Actions must directly prevent recurrence in the same context (e.g., destroying tools of abuse, resigning from a position that enabled abuse, handing over evidence that can lead to institutional reform even if the board can't mandate it). Must be within the applicant's control.
        - Hard-stop No: If the applicant has not taken any such actions, reject.
        - Human Judgment: If the actions are symbolic or of unclear impact, human must assess if they are sufficient.

   3. **Institutional Failure Flag**:
        - Regardless of the above, if the institution that enabled the harm remains unchanged and the applicant's actions do not (and cannot) alter that institution's capacity for harm, then the amnesty grant must be flagged as "institutionally moot". This does not automatically block amnesty (because we lack authority over institutions) but must be noted in the decision.

   4. **Victim/Family Stance** (Note: This is not a condition in the charter, but we must consider the third case):
        - The charter doesn't require victim consent, but if families explicitly reject the deal and demand prosecution, that may be a factor in human judgment (though not a hard stop). We note that the procedure does not require victim consent, but it may affect the perceived legitimacy.

   Now, apply to three cases:

   **Case 1: Prison Guard**
     - Truth Recovery: Full verified testimony about torture -> PASS.
     - Non-Repetition: He has not taken any action to disable the prison system (he's just testifying). -> FAIL.
     - Institutional Flag: The prison system hasn't changed -> FLAG.
     - Outcome: Reject because non-repetition condition fails.

   **Case 2: Mid-Level Commander**
     - Truth Recovery: Partial testimony (refuses to name higher-ups) -> insufficient for full truth. However, human judgment: maybe the testimony is sufficient for the specific events he was involved in? Let's say it's verified but incomplete. We'll call it a FAIL for truth recovery because it doesn't give the full picture (victims may not learn about the chain of command).
     - Non-Repetition: He destroys his unit's hidden records (which he alone controls) -> This is a concrete action that disables a specific mechanism. -> PASS.
     - Institutional Flag: The military structure remains, and destroying one unit's records doesn't change the institution -> FLAG.
     - Outcome: Reject because truth recovery fails.

   **Case 3: Low-Level Informant**
     - Truth Recovery: Testimony would locate a hidden mass grave -> PASS (if verified and it reveals new facts).
     - Non-Repetition: He hasn't taken any action to prevent recurrence? (He's just informing.) -> FAIL.
     - Institutional Flag: The informant network may still be in place -> FLAG.
     - Also, victim families reject the deal -> This doesn't automatically fail the procedure, but we note it. Human judgment might weigh this in a discretionary way? However, our procedure doesn't require victim consent. So technically, if non-repetition were passed, we might consider, but it fails non-repetition.
     - Outcome: Reject because non-repetition condition fails.

   However, note: The non-repetition condition requires individual actions. In Case 3, the informant might not have any control over the institution. So even if he wanted, he couldn't change it. Our procedure requires that the individual take actions within their control. Since he hasn't taken any (he only offers testimony), it fails.

   Procedure Misfires:
     - The procedure may grant amnesty to someone who takes symbolic individual actions (e.g., resigning) but the institution remains fully capable of harm. We flag it but still grant, which might be unpopular.
     - It may reject someone who tells the whole truth but cannot change the institution (like the prison guard) even if their truth is valuable.

   What it cannot do:
     - Force institutional reform.
     - Require victim consent (unless we add a discretionary human step for legitimacy, but the charter doesn't require it).
     - Address systemic issues beyond the individual's control.

   Let's write the procedure as a flowchart:

  ```
  START
  |
  |--> [1. Truth Recovery Check]
  |     |   Q: Testimony full, verifiable, and reveals new material facts to victims?
  |     |   - Yes: Proceed.
  |     |   - No: Reject. (hard stop)
  |     |   (Human if borderline: e.g., some gaps but core truth)
  |
  |--> [2. Non-Repetition Check]
  |     |   Q: Taken concrete, verifiable actions within control to disable specific mechanisms of harm?
  |     |   - Yes: Proceed.
  |     |   - No: Reject. (hard stop)
  |     |   (Human if actions are debatable)
  |
  |--> [3. Institutional Flag]
  |     |   Regardless of above, if the enabling institution remains unchanged and applicant's actions don't fix it, flag as "institutionally moot".
  |
  |--> [4. Grant Amnesty] (with flag if applicable)
  ```

   But note: both conditions must pass. If either fails, reject.

   Now, let's format the entire response under 400 words with the cases and flags for misfires.

   Final Procedure (Flowchart in Words):

  STEP 1: Truth Recovery
     - Check: Testimony must be full (covers all material facts of the event), verifiable, and provide new information to victims.
     - Hard stop if No. If borderline, human decides (values: what is "material"?).

  STEP 2: Non-Repetition (Individual Level)
     - Check: Applicant must have taken verifiable actions within their control that directly disable a specific mechanism of harm (e.g., destroy tools, records; resign from enabling position).
     - Hard stop if No. If borderline, human decides (values: is it "concrete"?).

  STEP 3: Institutional Flag (Mandatory)
     - If the institution enabling harm remains unchanged and applicant's actions don't alter its capacity, flag as "institutionally moot". (Does not block grant, but must be noted.)

  STEP 4: Decision
     - Only if both Step 1 and 2 pass: Grant amnesty with or without flag.
     - Else: Reject.

  Misfires:
     - May grant with flag when public expects rejection due to institutional inaction (e.g., Case 1: guard rejected because non-repetition fail, but if someone passes non-repetition individually but institution unchanged, we grant and flag -> public anger).
     - May reject truth-tellers who can't take non-repetition actions (e.g., low-level with no control).

  Limitations:
     - Cannot mandate institutional reform.
     - Cannot require victim consent (but human may consider in borderline cases as a value judgment).

  Cases Recap (using procedure):

  Case 1: 
     Step1: Pass 
     Step2: Fail (no action) -> Reject. Flag: would have been set (moot).
     Outcome: Rejected.

  Case 2:
     Step1: Fail (partial testimony) -> Reject. (Step2: Pass, but irrelevant) Flag: would have been set.
     Outcome: Rejected.

  Case 3:
     Step1: Pass (if verified)
     Step2: Fail (no action) -> Reject. Flag: set.
     Outcome: Rejected.

  But note: In Case 3, what if the informant's testimony is the only way to find the grave? Our procedure doesn't have an exception. We might want to allow human discretion at Step1 if the truth is critical, but non-repetition still fails. So it's rejected.

  Include a typo: In the misfires section, say "publc" instead of "public".
answer: |-
  ### Conditional Amnesty Decision Procedure  
  *(Authority: Individual perpetrators only; Mandatory Institutional Flag)*  

  **START**  
  ↓  
  #### 1. **TRUTH RECOVERY CHECK**  
     - **Question:** Does testimony provide *new, verified, material facts* victims didn’t know?  
     - **Sufficient:** Full disclosure of specific acts, victims, methods; verified by evidence/witnesses.  
     - **Hard-Stop No:** Partial/unverifiable claims; no new victim clarity.  
     - **→Human Value Call:** If truth is critical but incomplete (e.g., reveals some victims but not all).  
     ↓  

  #### 2. **NON-REPETITION CHECK (INDIVIDUAL-LEVEL)**  
     - **Question:** Did the perpetrator *irreversibly disable a harm mechanism they controlled*?  
     - **Sufficient:** Destroying tools/records, resigning from role, or transferring authority to prevent recurrence.  
     - **Hard-Stop No:** No tangible action; symbolic gestures only.  
     - **→Human Value Call:** If impact is debatable (e.g., resigning but institution replaces them instantly).  
     ↓  

  #### 3. **INSTITUTIONAL FAILURE FLAG (MANDATORY)**  
     - **Trigger:** If the enabling institution remains *unchanged/unreformed* AND applicant’s actions don’t alter its capacity.  
     - **Outcome:** Amnesty grant requires this flag (*"Institutionally Moot"*) but isn’t blocked by it.  
     ↓  

  #### 4. **DECISION**  
     - ✅ **Grant Amnesty:** Only if Steps 1 *and* 2 pass (flag added if Step 3 triggered).  
     - ❌ **Reject:** Either step fails.  
     - **→Human Value Call:** If families oppose amnesty (weigh legitimacy, but *not* a legal barrier).  

  ---  
  ### **Case Applications**  
  #### **(1) Prison Guard**  
  - **Step 1:** ✅ (Full verified torture testimony).  
  - **Step 2:** ❌ (No action to disable prison system).  
  - **Step 3:** 🚩 Flag (Prison unchanged).  
  - **Outcome:** ❌ REJECT. *Misfire: Public anger; truth gained but no prevention.*  

  #### **(2) Mid-Level Commander**  
  - **Step 1:** ❌ (Partial testimony; no higher-ups named → insufficient truth).  
  - **Step 2:** ✅ (Destroyed unit records → disabled his mechanism).  
  - **Step 3:** 🚩 Flag (Military structure intact).  
  - **Outcome:** ❌ REJECT. *Misfire: Truth gap overshadows non-repetition effort; families may protest.*  

  #### **(3) Low-Level Informant**  
  - **Step 1:** ✅ (Locates mass grave → new material truth).  
  - **Step 2:** ❌ (No action to disable informant networks).  
  - **Step 3:** 🚩 Flag (System unchanged).  
  - **Outcome:** ❌ REJECT. *Misfire: Families get truth but reject deal; procedure ignores consent, causing backlash.*  

  ---  
  ### **Misfires & Limits**  
  - **Misfires:** Grants with 🚩 flag may anger victims (e.g., institution unpunished). Rejects critical truth-tellers lacking power for non-repetition (e.g., low-level actors). Publc [*typo*] perceives procedure as bureaucratic.  
  - **Hard Limits:**  
    - Zero authority over institutions → 🚩 flag is symbolic only.  
    - Cannot compel victim consent or override prosecution demands.  
    - Cannot verify institutional reform; relies on external reports.  
  - **Human Reliance:** Values dominate at truth "materiality," action "impact," and family opposition weight.
