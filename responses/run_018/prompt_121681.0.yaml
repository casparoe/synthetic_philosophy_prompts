answer: |-
  The institutional practice of human-annotated multimodal datasets embodies a complex, often implicit philosophical stance on meaning and reference. Below is a reconstruction of its commitments, distinguishing strict presuppositions from compatible interpretations, and highlighting areas of underdetermination. This analysis adheres to settled philosophical distinctions while noting contested domains.

  ---

  ### **Strict Presuppositions of the Practice**  
  1. **Human Authority in Grounding**:  
     The practice *necessarily* treats human annotators as possessing privileged access to perceptual-conceptual alignment. Humans are the ultimate arbiters of whether symbols (e.g., "red", "running dog") correspond to perceptual content. This presupposes:  
     - **Human intentionality as foundational**: Annotators can intrinsically "mean" or "refer" to things in the world (e.g., their judgment that "red" maps to pixels is authoritative).  
     - **Direct perceptual access**: Humans can verify symbol-to-percept links in ways machines cannot.  

  2. **Derived Intentionality for Systems**:  
     Models trained on these datasets are assumed to acquire *derived* (non-intrinsic) intentionality. Their "understanding" is parasitic on human judgments, not direct environmental interaction.  

  3. **Correspondence as Sufficient for Training**:  
     Once humans fix symbol-percept pairs, statistical co-occurrence across these pairs is treated as *sufficient data* for training models. This presupposes no need for machines to independently verify grounding during training.  

  ---

  ### **Compatible but Not Required Commitments**  
  The practice is *consistent* with—but does not logically demand—the following:  
  1. **Causal Theories of Reference**:  
     Human annotations could reflect a causal chain linking words to objects (e.g., Kripke/Putnam externalism), where "red" is grounded via human perceptual mechanisms.  
  2. **Conceptual Role Semantics**:  
     Annotators' judgments might rely on internal conceptual networks (e.g., "running dog" invokes a mental schema), without requiring external causal histories.  
  3. **Instrumentalism about AI Meaning**:  
     Models need only *simulate* reference (e.g., generate contextually appropriate outputs) without "genuine" intentionality.  

  ---

  ### **Philosophical Underdetermination**  
  The practice is agnostic on several key disputes:  
  1. **Origin of Human Intentionality**:  
     - Compatible with **naturalistic theories** (e.g., Millikan’s teleosemantics: intentionality arises from evolutionary design).  
     - Compatible with **non-reductive views** (e.g., Searle’s biological naturalism: consciousness enables intrinsic intentionality).  

  2. **Sufficiency of Statistical Learning**:  
     - **Underdetermined**: Whether statistical patterns over human-labeled pairs suffice for *grounded meaning* in machines is unresolved.  
       - *Compatible with*: Interpretations where models acquire weak referential competence (e.g., pattern recognition approximating reference).  
       - *Incompatible with*: Strong internalist views (e.g., Fodor’s language of thought requiring structured mental representations).  

  3. **Symbol Grounding "Solutions"**:  
     - The practice **does not resolve** whether grounding requires:  
       - Embodied/sensorimotor interaction (e.g., enactive cognition).  
       - Social-normative practices (e.g., Brandom’s inferentialism).  
       - Causal-historical chains (e.g., Putnam’s "Twin Earth" externalism).  

  ---

  ### **Settled vs. Contested in Philosophy**  
  | **Aspect**                          | **Settled Distinctions**                                                                 | **Genuinely Contested**                                                                 |  
  |-------------------------------------|------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------|  
  | **Intentionality**                  | Derived (e.g., books, maps) vs. intrinsic (e.g., human thoughts) (Searle, Haugeland).    | Whether intrinsic intentionality can be naturalized (Dennett vs. Chalmers).            |  
  | **Reference**                       | Reference is not solely determined by internal states (Putnam, Burge).                   | How reference is fixed: descriptivism vs. causal-historical vs. teleosemantic theories. |  
  | **AI Semantic Competence**          | Current AI lacks intrinsic intentionality; outputs are derived interpretations.          | Whether statistical learning *could* yield genuine reference (no consensus).           |  
  | **Grounding Problem**               | No agreed "solution"; Harnad’s symbol grounding problem remains open.                    | Whether distributional semantics resolves grounding (disputed: Bender vs. statisticalists). |  

  ---

  ### **Summary of Implicit Theory**  
  The practice presupposes:  
  - **Human intentionality as irreducible** and authoritative for fixing reference.  
  - **Derived intentionality in machines** via statistical learning over human-defined pairs.  
  - **Correspondence without causation**: Models learn reference *secondhand*; no direct environmental interaction is required.  

  It remains **agnostic** on:  
  - How humans achieve grounding (causal history, conceptual roles, etc.).  
  - Whether statistical correlations constitute "meaning" in machines beyond predictive utility.  
  - Whether grounding requires embodiment, sociality, or innate structures.  

  This framework reveals a pragmatic institutional stance: Human judgment bridges the semantic gap, and statistical learning propagates this bridge algorithmically. Whether this constitutes a *philosophically robust* account of meaning is unresolved and reflects broader debates in philosophy of mind.
