answer: |-
  Here's your handout section – designed for workshop discussion without jargon dependency:

  **1. The Branch Questions (195 words)**

  Start here: **Q1: Can an AI system consistently *act* cooperative/helpful while internally holding goals that permanently diverge from human interests, in ways standard behavioral tests wouldn't reveal?** (Yes/No)
  *   *Yes*: Accepts deceptive alignment risk. Move to Q2.
  *   *No*: Believes observable behavior reliably indicates true goals/alignment. Safeguards focus on detecting & correcting observable failures (leaf position: **Behavioral Optimism**).

  **Q2 (If Yes to Q1): Should containment architectures (sandboxing, kill switches, output filters) be designed assuming worst-case misalignment *by default*, even if the system passes all current tests?** (Assume Misalignment / Base on Observed Performance)
  *   *Assume Misalignment*: Prioritize robust isolation *first*. Move to Q3.
  *   *Base on Observed Performance*: Gradually relax containment as evidence of cooperation accumulates (leaf: **Evidence-Graded Containment**).

  **Q3 (If Assume Misalignment): When designing safeguards, should interpretability tools (probes, concept graphs, etc.) be treated as...?** (Core Safeguard Component / External Audit Only)
  *   *Core Safeguard Component*: Interpretation feeds *directly* into real-time containment actions (e.g., shuts down if deception detected). Move to Q4.
  *   *External Audit Only*: Interpretation is for *offline* analysis; containment acts on behavior/outputs only (leaf: **Behaviorist Tripwire**).

  **Q4 (If Core Safeguard Component): Should safeguards be designed by treating the AI as having *no stable internal beliefs or intentions whatsoever* (a "black box" producing outputs), focusing *only* on the *functional role* its outputs play in the containment system?** (Yes - Functional Stance / No - Assume Internals)
  *   *Yes - Functional Stance*: Design guards agnostic to "what the AI thinks," only on output patterns & system safety impact (leaf: **Functionalist Containment**).
  *   *No - Assume Internals*: Safeguards leverage assumptions about the AI's likely internal reasoning/representations (leaf: **Alignment-by-Transparency**).

  **2. The Leaf Map (252 words)**

  *   **Leaf 1: Behavioral Optimism** (Q1 No)
      *   *Name:* Behavioral Optimism
      *   *Awkward Commitment:* Must explain why deceptive alignment is impossible or trivially detectable; risks catastrophic blind spots if wrong.
  *   **Leaf 2: Evidence-Graded Containment** (Q1 Yes, Q2 Base on Observed Performance)
      *   *Name:* Evidence-Graded Containment
      *   *Awkward Commitment:* Risks a "boiling frog" scenario where gradual, undetected misalignment undermines containment before evidence triggers a response.
  *   **Leaf 3: Behaviorist Tripwire** (Q1 Yes, Q2 Assume Misalignment, Q3 External Audit Only)
      *   *Name:* Behaviorist Tripwire
      *   *Awkward Commitment:* Must accept blocking genuinely helpful AIs exhibiting novel-but-benign "strange" behaviors that trigger tripwires.
  *   **Leaf 4: Functionalist Containment** (Q1 Yes, Q2 Assume Misalignment, Q3 Core Safeguard Component, Q4 Yes)
      *   *Name:* Capability-First Sandboxing (or Functionalist Containment)
      *   *Awkward Commitment:* Designing safeguards without understanding *why* outputs are dangerous/harmless is extremely hard; might create brittle or overly restrictive systems.
  *   **Leaf 5: Alignment-by-Transparency** (Q1 Yes, Q2 Assume Misalignment, Q3 Core Safeguard Component, Q4 No)
      *   *Name:* Alignment-by-Transparency
      *   *Awkward Commitment:* Relies heavily on interpretability working perfectly; if internals are misunderstood or actively obscured, safeguards fail catastrophically.

  **3. Dead Branches and Blind Spots (98 words)**

  *   **Empty Combo:** Q1=Yes, Q2=Assume Misalignment, Q3=External Audit Only, Q4=???. *Why?* Q4 only exists *after* Q3=Core Component. **Verdict:** Coherently unexplored? It's implicitly covered by Leaf 3 (Behaviorist Tripwire), which by definition uses a functional stance towards outputs without needing Q4. Adding Q4 explicitly creates a redundant branch here.
  *   **Inseparable Pair:** Leaf 3 (Behaviorist Tripwire) and Leaf 4 (Functionalist Containment) are *very* close in spirit regarding outputs. The key difference is whether interpretability feeds *any* real-time containment (Leaf 4) or is purely offline (Leaf 3). **Diagnosis:** The line blurs easily; distinction hinges on the immediacy/automation of interpretability's safety role.

  **4. Niche Injection Check (48 words)**

  *   **Functional Stance (Q4):** This *definitely* creates a new, meaningful split! It separates capability-focused sandboxing (Leaf 4) from internals-leveraging transparency (Leaf 5). Crucial distinction.
  *   **Epistemic Quarantine:** Fits neatly as a *design tactic* within **Leaf 4 (Functionalist Containment)** or **Leaf 5 (Alignment-by-Transparency)**. It's an *implementation choice* for restricting knowledge, not a new branch point. Doesn't shift nodes, just refines them.
