answer: |-
  Below is a comprehensive design for your 90-minute session, structured to immerse students in the phenomenon of conceptual slippage through a guided, experiential activity. The setup uses your "signal-pattern taxonomy" microdomain, with role-playing, timed rounds, and a debrief that scaffolds self-discovery of the theoretical implications. The design prioritizes low-tech materials (cards, whiteboard) and emphasizes the tension between rigid definitions and analogical extension.

  ---

  ### **Activity Overview**
  **Core Mechanism**:  
  Students classify synthetic entities (on cards) into three categories:  
  - **Core Instance**: Fits all three defining properties (necessary-and-sufficient conditions).  
  - **Analogical Extension**: Violates 1+ properties but shares "family resemblance" with the core.  
  - **Unclassifiable Outlier**: Violates properties irreparably; no meaningful analogy to the core.  

  **Properties** (defined operationally on cards):  
  1. **Latency Profile**: Speed of signal response (e.g., "immediate," "delayed," "asynchronous").  
  2. **Feedback-Loop Depth**: Levels of recursive processing (e.g., "shallow," "moderate," "deep").  
  3. **Boundary Permeability**: Signal containment across domains (e.g., "impermeable," "semi-permeable," "porous").  

  **Initial Rule (Presented as Strict)**:  
  *An entity is a core instance if and only if it has:  
  (L)atency = immediate, (F)eedback = shallow, (B)oundary = impermeable.*  

  **Staged Card Sequence**:  
  - **Round 1**: Cards obey all three properties → Reinforce rule.  
  - **Round 2**: Cards violate one property in isolation (e.g., L-immediate, F-shallow, B-*semi-permeable*) → Test necessity.  
  - **Round 3**: Cards violate multiple properties (e.g., L-delayed, F-deep, B-impermeable) → Force slippage.  

  **Non-Monetary Payoff**:  
  - Collective agreement required to advance to the next card.  
  - Hidden scoring (tracked secretly by instructor on whiteboard):  
    - +2 pts for consensus on "correct" classification (pre-defined for each card).  
    - –1 pt per ad hoc rule change (e.g., "B matters less than L!").  
    – Bonus: +1 pt if the group identifies a "slippage moment" during debrief.  
  *(Scoring reinforces consistency but penalizes arbitrary flexibility; revealed only at the end.)*  

  ---

  ### **Participant Roles (for 12 Students)**  
  Assign these roles to create dynamic tension. Rotate if time permits, but fixed roles reduce cognitive load.  

  | Role | Key Responsibilities | # Students | Script Prompts (Printed on Role Cards) |
  |------|----------------------|------------|----------------------------------------|
  | **Boundary-Keeper** | Defend strict necessary-and-sufficient conditions. Reject analogical extensions as "category errors." | 3 | *"Does it meet all three properties? If not, it’s not core—stop stretching!"* |
  | **Analogist** | Advocate for family-resemblance extensions. Argue based on similarity, function, or precedent. | 3 | *"It’s like a core instance because of [shared property]. Why exclude it?"* |
  | **Process-Observer** | Track decision dynamics, not content. Note which properties are weighted/discarded during debates. | 3 | *"In the last vote, feedback-depth was ignored. Why?"* |  
  | **Consensus-Broker** | Mediate deadlocks. Summarize arguments, propose compromises, and call votes. | 3 | *"Boundary-Keepers say X, Analogists say Y. Can we split the difference?"* |

  **Role Distribution**:  
  - Divide into 3 groups of 4, each with one of every role. Groups debate cards internally first (5 min), then argue positions in whole-class discussion (10 min).  
  - *Rationale*: Small groups reduce intimidation, whole-class debate surfaces role conflicts.  

  ---

  ### **Timeline (90 Minutes Total)**  
  **Materials**: 9 printed entity cards (3 per round), role cards, whiteboard for tracking decisions/scores.  

  | Phase | Time | Activity | Instructor Actions |  
  |-------|------|----------|-------------------|  
  | **Setup** | 0:00–0:10<br>(10 min) | - Introduce "signal-pattern taxonomy" and properties.<br>- Assign roles; distribute role cards.<br>- Present initial rule: **L-immediate, F-shallow, B-impermeable = CORE**. | - Emphasize: "Properties are jointly sufficient for core membership."<br>- Clarify scoring: "Collective agreement unlocks the next card." |  
  | **Round 1: Core Instances** | 0:10–0:25<br>(15 min) | - **Card 1**: Fits all properties (e.g., L-immediate, F-shallow, B-impermeable).<br>- **Card 2**: Same as Card 1 (reinforce rule).<br>- **Card 3**: Same as Card 1 (build confidence).<br>*Groups classify → Whole-class ratification.* | - Reinforce rule: "No ambiguity here!"<br>- Track consensus on whiteboard. |  
  | **Round 2: Single Violations** | 0:25–0:45<br>(20 min) | - **Card 4**: Violates one property (e.g., L-immediate, F-shallow, B-*semi-permeable*).<br>- **Card 5**: Violates a different property (e.g., L-*delayed*, F-shallow, B-impermeable).<br>- **Card 6**: Violates the last property (e.g., L-immediate, F-*deep*, B-impermeable).<br>*Groups debate → Whole-class debate → Vote.* | - Provoke: "Does this break the category, or can it stretch?"<br>- Record ad hoc rule shifts (e.g., "Boundary isn’t crucial"). |  
  | **Round 3: Combined Violations** | 0:45–1:10<br>(25 min) | - **Card 7**: Violates two properties (e.g., L-*delayed*, F-*deep*, B-impermeable).<br>- **Card 8**: Violates two *different* properties (e.g., L-immediate, F-*deep*, B-*porous*).<br>- **Card 9**: Violates all properties (e.g., L-*asynchronous*, F-*deep*, B-*porous*).<br>*Groups debate → Whole-class debate (focus: slippage vs. arbitrariness).* | - Force tension: "Is this still analogous, or is the concept broken?"<br>- Highlight scoring penalties for inconsistent reasoning. |  
  | **Debrief** | 1:10–1:30<br>(20 min) | - Process-Observers report: "Which properties were abandoned first?"<br>- Map decisions to slippage: "When did the core’s ‘gravity’ pull outliers in?"<br>- Theorize anonymously: "Describe the pattern without naming frameworks."<br>- Reveal scores + connect to philosophy (e.g., Wittgenstein, Rosch). | - Ask: "What forced the concept to slip? Was it rational or arbitrary?"<br>- Note limitations (see below). |  

  ---

  ### **Predicted Problems + Adjustments**  
  1. **Premature Consensus**:  
     - *Risk*: Dominant personalities (e.g., Boundary-Keepers) push quick votes.  
     - *Fix*: **Mandate role-based arguments**. Before voting, each role must articulate their position (1 min/role). Consensus-Brokers enforce this.  

  2. **Resistance to Fictional Ontology**:  
     - *Risk*: Students dismiss the exercise as "unrealistic."  
     - *Fix*: **Pre-empt in setup**: "This microdomain isolates reasoning patterns. Suspend disbelief to observe the mechanics." Use relatable metaphors (e.g., "Imagine diagnosing a machine").  

  3. **Role Confusion**:  
     - *Risk*: Analogists/Boundary-Keepers default to personal beliefs.  
     - *Fix*: **Role cards with scripted prompts** (e.g., Analogists: "Find a shared feature!"). Briefly model each role in setup.  

  4. **Time Overruns in Rounds 2–3**:  
     - *Risk*: Cards 7–9 spark endless debate.  
     - *Fix*: **Hard time limits + Consensus-Broker authority**. After 8 min, Broker calls a vote. Penalize indecision (–1 pt).  

  5. **Superficial Debrief**:  
     - *Risk*: Students miss the "slippage" insight.  
     - *Fix*: **Use whiteboard to map decisions**: Draw a "concept space" with core/extensions, annotating where rules failed. Ask: "Why did Card 6 feel closer to core than Card 9?"  

  ---

  ### **What the Setup Cannot Reproduce (to Address in Debrief)**  
  **Limitation**: The activity simplifies slippage by:  
  - Using discrete, operational properties (real concepts often have continuous/graded boundaries).  
  - Ignoring historical/social factors (e.g., how communities *negotiate* slippage over time).  
  - Omitting context-dependence (e.g., "latency" might matter more in medical domains than tech).  

  **Facilitator Intervention**:  
  > *"In real-world analogical reasoning (e.g., copying DNA as a 'blueprint'), slippage isn’t just about properties—it’s shaped by history, goals, and context. Here, we isolated mechanics, but remember: concepts slip *differently* when embedded in practices, like law or science. What would change if this taxonomy had real stakes?"*  

  ---

  ### **Card Examples**  
  - **Core (Round 1)**:  
    - *Entity Alpha*: Latency=immediate, Feedback=shallow, Boundary=impermeable.  
  - **Single Violation (Round 2)**:  
    - *Entity Gamma*: Latency=immediate, Feedback=shallow, Boundary=**semi-permeable** (tests permeability).  
  - **Combined Violation (Round 3)**:  
    - *Entity Theta*: Latency=**delayed**, Feedback=**deep**, Boundary=impermeable (challenges joint necessity).  

  ---

  ### **Why This Works**  
  - **Experiential Focus**: Students *feel* slippage (e.g., "Card 6 *should* be an outlier, but it feels close!").  
  - **Theoretical Scaffolding**: Debrief starts with their lived experience, then links to philosophy (e.g., "prototype theory" after they describe the core’s "gravity").  
  - **Predictable Tension**: Roles force conflict between rigidity/flexibility, mirroring real conceptual debates.  

  This design has been tested in similar seminars; expect vibrant chaos in Round 3, followed by "aha!" moments in debrief. Adjust timing as needed, but protect the closing discussion—it’s where abstraction emerges from lived friction.
