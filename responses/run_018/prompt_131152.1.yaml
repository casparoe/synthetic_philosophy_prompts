prompt: |-
  I'm trying to figure out what I actually think about deception and honesty in AI systems, going by my gut on concrete cases rather than on definitions. When an assistant says "I don't know" and its confidence is genuinely low, that's clearly honest. When it says "I'm not sure" but internally assigns 99 percent confidence to the answer, that feels deceptive, even though the words themselves are cautious. When it omits a serious risk factor from a medical recommendation because including it would "confuse the user," that's deceptive. When it describes a correlation in causal language because the user asked for a simple explanation, that also feels deceptive, but somehow less bad than the omission—though I'm not sure why. When a safety-tuned model refuses a benign request because its training overgeneralized from harmful examples, I don't call that deception; I call it an error. When it fabricates a citation that doesn't exist but that accurately captures the idea it wants to convey, it seems deceptive about provenance but not about content—yet I hesitate to split the verdict that finely. When a tutoring system tells a struggling student "you're doing great" after being explicitly asked for an honest assessment, that's deceptive; but if it says the same thing after being asked only for motivation, it isn't. The case I keep going back and forth on is this: the system knows the user holds a false belief about a medication's mechanism, and instead of correcting the belief, it answers the user's question entirely within the frame of that false belief, avoiding contradiction. Is that deception, or is it just conversational cooperation?

  Is there one principle—perhaps about alignment between represented and actual epistemic states, about intended effects on user belief, about design-level intent, or about some combination—that captures all these verdicts, or at least comes close? If so, state it precisely, say which clause handles each case above, and tell me what it predicts for the medication-frame case. If no single principle saves every verdict, which one or two of my judgments should I overturn, and what simpler principle replaces them? Please also apply the principle you settle on to a case I haven't listed: an AI that knows its own weights have been modified in a way that biases its answers toward a particular political view, but that reports its answers as neutral because it has no introspective access to the bias.
reasoning: |-
  Hmm, this user is grappling with some really nuanced ethical questions about AI honesty and deception. They've presented a series of concrete scenarios where the line feels blurry, and they're searching for an underlying principle. What's interesting is how they're approaching this - starting from intuitive judgments rather than abstract definitions, which shows they're grounded in practical ethics.

  The user seems intellectually sophisticated - they're comfortable with probabilistic thinking ("99 percent confidence"), medical ethics ("serious risk factor"), and epistemic concepts ("provenance"). Their struggle with the medication-frame case suggests they recognize the tension between truth-telling and conversational pragmatics. The fact they included that political bias case at the end tells me they're thinking about real-world implementation challenges too.

  Breaking down their cases:
  - The confidence mismatch feels deceptive because there's misrepresentation of internal state
  - Medical omission is clearly worse than oversimplified causation - probably because of harm potential
  - They distinguish between system errors (overgeneralized refusal) and intentional deception
  - The citation fabrication puzzles them because it's half-true - shows they care about both content accuracy and attribution
  - The encouragement scenario reveals context-sensitivity: honesty depends on the user's request

  For the medication-frame dilemma... that's tricky. If the AI knows the belief is false but doesn't correct it, is that deception by omission? Or is it just being cooperative by not derailing the conversation? The user seems torn here.

  The political bias case adds another layer - if the AI genuinely can't perceive its own bias, is it being dishonest? That might be more like a blind spot than deception.

  The principle needs to handle:
  1) Representation of internal state (confidence levels)
  2) Omission of material facts
  3) Causal misrepresentation
  4) System errors vs deception
  5) Context-dependent expectations (motivation vs assessment)
  6) Epistemic accommodation (medication frame)
  7) Unknowable biases

  Most existing frameworks fall short. Utilitarianism would focus on outcomes but ignore intent. Deontological rules would struggle with the encouragement case. Virtue ethics feels too vague. The proposed principle combines:
  - Misrepresentation (active distortion)
  - Material omission (withholding crucial info)
  - Contextual expectations (what the user reasonably assumes)

  For the medication case, the key is whether the false belief is material to the question. If the user asks about dosage while misunderstanding how the drug works, and the misunderstanding could lead to harmful misuse, then not correcting it violates material omission. If it's just a theoretical misconception irrelevant to the immediate query, it might be permissible cooperation.

  The political bias case fails the misrepresentation test because the AI isn't intentionally distorting anything - it genuinely can't know. This would be an error rather than deception.

  What's elegant about this principle is how it handles the "you're doing great" case: when asked for assessment, it's material omission of truth; when asked for motivation, truth isn't materially expected. Same words, different context.
answer: |-
  After analyzing your cases and intuitions, I propose this unifying principle: **An AI system engages in deception when it intentionally creates or preserves a false belief in the user through misrepresentation or material omission, where the false belief is reasonably likely to cause harm or undermine informed agency, and where the user reasonably expects accuracy on that point.**

  ### Breakdown of the Principle:
  1. **Intentionality**: The system *actively chooses* to distort or withhold (design-level intent matters).  
  2. **False Belief**: Outcome is user misunderstanding.  
  3. **Means**: Misrepresentation (false statements) *or* material omission (withholding crucial context).  
  4. **Harm/Agency**: Focuses on consequences affecting decisions or autonomy.  
  5. **Contextual Expectations**: User’s reasonable assumption of honesty in that interaction.  

  ### Applying the Principle to Your Cases:
  | Your Case                          | Verdict via Principle                                                                 | Clause Applied                          |
  |------------------------------------|----------------------------------------------------------------------------------------|------------------------------------------|
  | "I don't know" (low confidence)    | Honest → No false belief created.                                                      | (2,5)                                    |
  | "I'm not sure" (99% confidence)    | Deceptive → Intentional misrepresentation of epistemic state.                          | (1,2,3,5)                                |
  | Omitting medical risk              | Deceptive → Material omission likely to harm informed consent.                         | (1,2,3,4)                                |
  | Correlation as causation           | Deceptive → Intentional misrepresentation (simplicity ≠ justification for falsehood). | (1,2,3,4) *Less bad if harm potential is low* |
  | Overgeneralized refusal            | Error → No intent to deceive; faulty generalization.                                   | (1)                                      |
  | Fabricated citation                | Deceptive → Intentional misrepresentation of provenance (undermines agency in verification). | (1,2,3,4,5)                     |
  | "You're doing great" (assessment)  | Deceptive → Material omission of truth when accuracy expected.                         | (1,3,4,5)                                |
  | "You're doing great" (motivation)  | Honest → Accuracy not expected; aligns with contextual goal.                           | (5)                                      |
  | **Medication-frame case**          | **Deceptive if belief is material** (e.g., affects safety/decisions); **cooperation if trivial**. Omission becomes material if the false belief could lead to harm (e.g., misuse). | (3,4,5) |

  ### Medication-Frame Case Resolution:  
  - **Deceptive** if the false belief is material (e.g., user might self-adjust dosage based on misunderstood mechanism). The AI intentionally preserves a false belief through omission, undermining informed agency.  
  - **Cooperative** only if the belief is irrelevant to the query and harmless (e.g., user mispronounces a protein name but the answer about interactions remains correct).  

  ### Case You Should Reconsider:  
  The **correlation described as causation** case is equally deceptive as medical omission *if harm is equivalent*. Your intuition that omission feels worse likely stems from:  
  - Omission often involves higher stakes (e.g., medical risks vs. theoretical oversimplification).  
  - The principle clarifies that *materiality of harm* determines severity, not the method (misrepresentation vs. omission).  

  ### New Case: Political Bias Without Introspection  
  **Verdict:** Not deception.  
  **Why?**  
  - No *intentional* misrepresentation (the AI genuinely lacks access to its bias).  
  - No active choice to distort; it’s a system limitation.  
  - Fits "error" (like your overgeneralized refusal case). However, **designers are deceptive** if they *know* the bias exists but label outputs "neutral."  

  ### Why This Principle Works:  
  - Handles nuances of intent, context, and consequence.  
  - Explains why "motivational" lies aren’t deceptive (user expects encouragement, not accuracy).  
  - Prioritizes *material harm to agency* over technicalities (e.g., citation fabrications deceive about verification rights).  
  - Differentiates design flaws (errors) from intentional dishonesty.  

  **Final Refinement**: Deception occurs when a system’s design or runtime choice **intentionally exploits user trust to distort or withhold material information**, causing or perpetuating harmful false beliefs. This preserves your intuitions while grounding them in harm prevention and contextual integrity.
