prompt: |-
  I'm taking an upper-level seminar in philosophy of biology, and this week's discussion turned on the logic of costly signaling and the handicap principle. One of my classmates defended a view I have also seen in popular science writing: conspicuous consumption — designer clothes, luxury cars, status watches — is best understood on the model of the peacock's tail. Her argument ran as follows. Both are expensive, apparently wasteful displays whose credibility seems to come from the cost itself. Just as a peacock's tail honestly advertises viability because only a healthy bird can grow and carry one, a luxury watch honestly advertises disposable wealth because the wearer had to spend it; and just as it would be wrong to call the tail a pointless burden without asking what it is for, it is wrong to treat luxury consumption as mere waste or irrationality. She used this to push against the idea that consumerist display is a social pathology, or that advertising is simply manipulative, arguing that both amount to mistaking an honest signaling system for a pointlessly wasteful one.

  I want to know how far this analogy actually holds, because I suspect it is doing more work in her argument than she admits. What I'm looking for is not a list of casual objections, but a systematic audit. What exactly maps onto what — the peahen, the tail, the cost of growing it, the health it advertises, and the conditions that make it an honest signal; what plays those roles in the human consumption case, and how well? Where does the mapping break? Which features of the biological source — sexual selection, differential costs, the link between display and underlying condition — does the analogy quietly import into the target without argument, and are those features actually present among human consumers? And once the disanalogies are on the table, does her conclusion survive: is conspicuous consumption reasonably treated as an honest signaling system, or was the analogy carrying the whole argument? If the peacock is a poor source model, I would also like to hear what a better analogy would be, if one exists.

  Please present the audit as a JSON object with the following fields. `summary`: a one-paragraph bottom-line statement of the overall verdict. `correspondence_table`: an array of objects, each with `source_element` (the component of the peacock-tail case), `target_element` (the proposed counterpart in the human case), `mapping_quality` (one of "strong", "partial", or "weak"), and `notes` (a sentence or two on whether the mapping preserves the feature that matters). `disanalogies`: an array of objects, each with `feature` (the feature the analogy imports from the source), `break_in_target` (what goes wrong with it in the consumption case), `material` (a boolean: whether this disanalogy matters for the intended conclusion), and `explanation` (why it matters or does not). `quiet_imports`: an array of strings naming assumptions the analogy brings along without saying so. `verdict`: an object with `conclusion_survives` (one of "yes", "qualified", or "no") and `statement` (a sentence or two justifying that judgment). `better_analogy`: a string giving a replacement analogy and why it is better, or null if you think none is available.
reasoning: |-
  We are conducting a systematic audit of the analogy between the peacock's tail (biological costly signaling) and human conspicuous consumption as an honest signal of wealth. The goal is to evaluate how well the analogy holds, where it breaks, and whether the conclusion that conspicuous consumption is an honest signaling system survives.

  First, we'll break down the correspondence table:

  Source elements (peacock-tail case):
  1. Peacock's tail: The extravagant display feature.
  2. Cost of growing/carrying the tail: The energy and survival cost to the peacock.
  3. Honest signal of health/viability: The tail reliably indicates the peacock's genetic fitness because only a healthy peacock can bear the cost.
  4. Peahen: The receiver of the signal, who chooses a mate based on the signal.
  5. Conditions for honest signaling: The cost must be condition-dependent (healthier individuals bear lower marginal costs) and the signal must be difficult to fake.

  Target elements (human consumption case):
  1. Conspicuous consumption (luxury items): The display.
  2. Cost of purchasing the luxury item: The financial expenditure.
  3. Honest signal of disposable wealth: The item reliably indicates the buyer's wealth because only a wealthy person can afford it.
  4. Other people (potential mates, business partners, social circle): The receivers who might confer social status, mating opportunities, etc.
  5. Conditions for honest signaling: The cost must be such that only the truly wealthy can afford it without undue hardship, and it must be hard to fake.

  We'll assign mapping quality and notes for each.

  Then, we'll identify disanalogies. Features that the analogy imports from the biological source but break in the human target. We'll note if they are material to the conclusion.

  Quiet imports: Assumptions the analogy brings without argument.

  Verdict: Does the conclusion survive?

  Better analogy: If the peacock is poor, what is better?

  Let's build the JSON step by step.

  Summary: The analogy holds partially but breaks in critical ways. The peacock's tail is an honest signal because of condition-dependent production costs, whereas luxury consumption is more easily faked and serves multiple social functions beyond honest signaling. The conclusion that conspicuous consumption is an honest signaling system survives only in a qualified sense because it can be dishonest and is influenced by cultural and economic factors.

  Correspondence Table:

  1. Source_element: "Peacock's tail"
     Target_element: "Conspicuous consumption (luxury items)"
     Mapping_quality: "partial"
     Notes: "Both are displays, but luxury items are chosen and can be faked (e.g., counterfeits, debt) while the tail is an inherent trait."

  2. Source_element: "Cost of growing/carrying the tail"
     Target_element: "Cost of purchasing luxury items"
     Mapping_quality: "partial"
     Notes: "The financial cost is analogous to the biological cost, but the burden of the tail is ongoing and survival-related, while the financial cost is often one-time and does not necessarily impair survival."

  3. Source_element: "Honest signal of health/viability"
     Target_element: "Honest signal of disposable wealth"
     Mapping_quality: "weak"
     Notes: "Wealth can be faked (via debt, leasing, counterfeits) and is not directly tied to underlying qualities like health or genetic fitness."

  4. Source_element: "Peahen (receiver)"
     Target_element: "Other people (receivers of the signal)"
     Mapping_quality: "strong"
     Notes: "Both are receivers who may confer benefits (mating opportunities, social status) based on the signal."

  5. Source_element: "Conditions for honest signaling (condition-dependent cost, hard to fake)"
     Target_element: "Conditions for honest signaling (cost must be prohibitive for non-wealthy, hard to fake)"
     Mapping_quality: "weak"
     Notes: "In the human case, the cost is not condition-dependent in the same way (wealthy individuals face lower marginal costs) and luxury goods are often faked, breaking the honesty condition."

  Disanalogies:

  1. Feature: "Condition-dependent cost"
     Break_in_target: "The cost of luxury goods is not condition-dependent in the biological sense. Wealthy individuals do not experience the same relative burden as poor ones; they may even gain utility from the purchase. Moreover, debt allows non-wealthy individuals to fake the signal."
     Material: true
     Explanation: "This breaks the core mechanism of honest signaling because the signal can be dishonest (e.g., someone with debt buying luxury items)."

  2. Feature: "Direct link between display and underlying quality"
     Break_in_target: "In biology, the tail is directly linked to health and genetic fitness. In humans, wealth is not a direct indicator of underlying qualities (like intelligence or health) and can be inherited or obtained by luck. Moreover, the signal may convey multiple meanings (taste, group membership) beyond wealth."
     Material: true
     Explanation: "This weakens the argument that luxury consumption is an honest signal of underlying qualities, as it might only signal wealth, which itself may not be a reliable proxy."

  3. Feature: "Sexual selection as the primary driver"
     Break_in_target: "Human consumption is driven by a mix of factors: social status, professional networks, cultural norms, and sometimes mating, but also by non-adaptive factors like advertising, emulation, and irrational desires."
     Material: true
     Explanation: "The diversity of motives in human consumption complicates the analogy and suggests that signaling may not be the sole or primary function."

  4. Feature: "The display is an inherent trait"
     Break_in_target: "The peacock's tail is part of the organism, while luxury goods are external possessions that can be bought and sold. This makes the human signal more flexible but also more prone to fakery."
     Material: true
     Explanation: "This allows for rapid changes and deceptions, undermining the honesty of the signal."

  Quiet imports: 
  - "That human social signaling operates under the same evolutionary pressures as sexual selection in birds."
  - "That the cost of luxury goods is prohibitively high in a way that only the wealthy can afford them, ignoring debt and credit."
  - "That the primary function of conspicuous consumption is signaling, ignoring other functions like personal enjoyment or cultural participation."

  Verdict:
  conclusion_survives: "qualified"
  statement: "The conclusion survives only in a qualified sense: while some luxury consumption may function as honest signaling, the analogy overlooks critical disanalogies (e.g., fakability, multiple motives) that make it less reliable and more prone to manipulation than the peacock's tail. Thus, it is not entirely wrong to see it as sometimes wasteful or pathological."

  Better analogy: "A better analogy might be academic credentialing: degrees from elite universities are costly in time and money, and they signal ability because completing them is harder for less capable individuals. However, this too has disanalogies (e.g., legacy admissions, test prep) but captures the idea of a costly signal that is condition-dependent (ability) and hard to fake. Alternatively, one might consider military medals for bravery: they are hard to fake and costly in terms of risk, but again, human systems can be gamed."

  Let's write the JSON accordingly.
