  First, Clara argues that critical history is essential for freeing the present from the past's burden. She sees monumental as paralyzing and antiquarian as smothering. David counters that critical history is dangerous because it disrupts the unhistorical mindset needed for action. He believes monumental and antiquarian provide inspiration and continuity, with critical only useful when subservient to them.

