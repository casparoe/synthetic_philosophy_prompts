reasoning: |-
  Okay, the user wants me to create a deadpan parody of terms-of-service for a fictional consultancy called Clifford & James Belief Solutions. This consultancy sells "worldview onboarding" packages where clients receive a settled metaphysical stance without reading primary texts. I need to craft exactly five numbered clauses in dry British corporate legalese, targeting the tension between William James's defense of believing without full evidence and W.K. Clifford's claim that it's always wrong to believe on insufficient evidence.

  The user specified British English, so I'll use spellings like "organised" and "endeavours" to match that style. Each clause should be one or two long, convoluted sentences totaling about 500 words - I'll aim for complexity without losing readability.

  For the satire, I need to exaggerate real positions rather than invent fake ones. Clifford's absolute stance on evidence should lead to punitive measures like emotional audits, while James's allowance for belief in live options can result in non-refundable policies for unresolved doubts. I'll include specific elements: defining "live hypotheses" via arbitrary internal surveys, non-refundable "branching continuity disputes" under the James tier, and Clifford-tier penalties requiring emotional state submissions.

  The clauses should be numbered and standalone - no introduction or conclusion. I'll make it accessible to those unfamiliar with the essays while ensuring the satire is recognizable to those who've read them. I'll push the philosophical positions to absurd lengths: Clifford's rigidity to bureaucratic extremes, James's pragmatism to contractual exploitation.

  For Clause 1, I'll define "live hypotheses" through an arbitrary survey mechanism, satirizing James's concept by making it entirely corporate-controlled. Clause 2 will establish non-refundability for James-tier disputes, twisting his "forced option" into financial entrapment. Clause 3 will implement Clifford's evidentialism as punitive audits, requiring emotional transparency as "sufficient evidence." Clause 4 will create a false dichotomy between the tiers, exaggerating how both philosophers framed belief decisions. Clause 5 will disclaim responsibility for existential impacts, parodying corporate evasion while nodding to the philosophers' high stakes.

  I'll ensure British legal phrasing: "herein", "forthwith", "without prejudice to". The tone must remain deadpan - letting the absurdity emerge from clinical language. For example, "emotional state metrics" for Clifford's audits, or "non-recoupable administrative expenditure" for James's non-refundable policy. I'll balance convolution with clarity so the humor isn't lost in jargon.
