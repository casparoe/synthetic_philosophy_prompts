answer: |-
  You've identified a profound and pervasive conceptual blind spot that sits at the intersection of labor economics, social theory, and ethics. While no single term perfectly captures *every* facet you describe, several established concepts converge here, and a precise neologism might be the sharpest tool.

  **Established Concepts Touching Your Observation:**

  1.  **The Invisibility/Devaluation of Reproductive & Care Labor (Feminist Economics):** This directly addresses the "whose labor makes leisure possible?" question. Thinkers like Silvia Federici, Nancy Folbre, and Arlie Hochschild documented how domestic labor, care work, and emotional labor (traditionally gendered feminine) are systematically ignored or undervalued in economic models and social policy. This makes the leisure of others possible but remains unseen. Your French politician example fits perfectly here.
  2.  **Spatial Fix & Global Labor Arbitrage (Marxist Geography/Economics):** David Harvey's concept of the "spatial fix" explains how capital exports labor exploitation geographically (e.g., outsourcing manufacturing to lower-wage countries). "Global labor arbitrage" describes the systemic reliance on cheaper labor elsewhere to maintain lifestyles/leisure elsewhere. This underpins the dependency you note in the 35-hour week example.
  3.  **Structural Violence & Karoshi:** Karoshi isn't simply individual failure; it's the result of systemic pressures – long-hours culture, weak labor enforcement, job insecurity, social expectations (often tied to masculine norms - *gaman*/endurance). Treating it as a personal boundary-setting issue ignores this structure, making leisure *formally* available but *functionally* inaccessible without severe social/professional penalty.
  4.  **The Protestant Work Ethic & the "Busy Trap":** Max Weber's analysis highlights the moralization of work and suspicion of non-"productive" leisure. Modern manifestations glorify "hustle culture" (the startup founder) and conflate busyness with worth. Leisure only becomes acceptable if it serves future productivity ("self-improvement") or is "earned" through exhausting work.
  5.  **Commodified Leisure & the Attention Economy:** Much "leisure" is now monetized and requires consumption (streaming, travel, hobbies), further embedding it within capitalist structures reliant on exploited labor. Simultaneously, digital platforms blur work/leisure boundaries, demanding constant attention.

  **The Specific Blind Spot: A Neologism**

  Your observation pinpoints a *specific gap* where these concepts overlap: **the failure to recognize leisure as a relational good enabled by unseen, often exploited, labor dependencies, while simultaneously framing it as an individual possession or moral failing.**

  **Proposed Term: Leisure Infrastructure Blindness (LIB)**

  **Definition:** Leisure Infrastructure Blindness (LIB) is the systemic cognitive and discursive failure to acknowledge the complex network of material, social, and often geographically dispersed labor (care work, manufacturing, logistics, services) that structurally enables the leisure enjoyed by individuals or groups within a specific socio-economic context. It manifests in framing leisure as either:
      *   An individual entitlement or right dissociated from its enabling conditions.
      *   An individual failing (lack of will, poor boundaries) when not accessed, ignoring systemic barriers.
      *   Morally contingent on "productivity" or being "deserved," delegitimizing rest.

  **Defining the Edges of LIB:**

  1.  **Core Condition:** LIB occurs when leisure is discussed *without acknowledging the necessary enabling labor infrastructure*. Ignorance vs. active ignoring is secondary; the *effect* is the erasure of dependency.
  2.  **Applies When:**
      *   Policies (like the 35-hour week) are celebrated without analyzing whose labor subsidizes it (domestic, migrant, outsourced).
      *   Workaholism (startup founder) or "innovation" arguments are framed as individual passion/necessity, ignoring the unseen support systems (partners, cleaners, cheap delivery) enabling that singular focus.
      *   Overwork pathologies (karoshi) are blamed on individual choices, ignoring systemic pressures making refusal untenable.
      *   Leisure is morally policed ("lazy," "unproductive") unless tied to future work output or extreme prior exertion.
      *   The *material prerequisites* for leisure (food, shelter, care, maintenance) are assumed to magically exist or are rendered invisible.
  3.  **Does NOT Apply When:**
      *   The discussion *explicitly* engages with the labor dependencies enabling leisure (e.g., advocating for fair wages for care workers *as essential for societal well-being and leisure*).
      *   Leisure is discussed in contexts of genuine material abundance accessible to all without exploitation (a theoretical or very small-scale scenario).
      *   Individual choices *within* a visible and equitable infrastructure are analyzed (e.g., choosing between hobbies when all basic needs and support labor are fairly compensated and accessible).
      *   The focus is *solely* on personal time management without making broader claims about leisure's nature or availability in society.

  **Why "Leisure Infrastructure Blindness"?**

  *   **"Infrastructure"**: Emphasizes that leisure isn't magically conjured; it relies on a tangible, often hidden, network of labor and resources – a *system*.
  *   **"Blindness"**: Highlights the cognitive/discursive failure to perceive this infrastructure, whether due to ignorance, ideology, or deliberate obfuscation. It's a *systematic* lack of sight.
  *   It distinguishes from broader concepts:
      *   **False Consciousness:** Focuses on workers misunderstanding their *own* exploitation. LIB focuses on beneficiaries (of leisure) misunderstanding the exploitation *enabling their benefit*.
      *   **Privilege Blindness:** Too broad. LIB is a *specific manifestation* of privilege blindness related explicitly to the conditions enabling *leisure time and activity*.
      *   **Externalization of Costs:** A key mechanism *within* LIB (outsourcing labor/environmental costs), but LIB specifies *what* cost is externalized (the labor enabling leisure).

  **In essence:** LIB is the failure to see that your rest is built on someone else's work, often unseen, undervalued, or exploited, and that the very *idea* of leisure is shaped by systems that obscure this dependency while moralizing its use. Your examples are textbook cases of LIB in action across cultures and contexts. Naming it helps dissect and challenge this pervasive blind spot.
