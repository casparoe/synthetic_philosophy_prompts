  For a concise term, "leisure infrastructure blindness" might capture it - emphasizing the unseen systems enabling leisure. Or "asymmetrical leisure dependency" to highlight the power imbalance. The user seems to value precision, so I should clearly define the boundaries: this applies whenever leisure is discussed without acknowledging its material prerequisites, regardless of intentionality. 

