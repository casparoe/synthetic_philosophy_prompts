prompt: |-
  hey — i'm a novelist and i sit on the board of the holloway residency, and we're voting thursday on this strange proposal that just landed in our inbox. one of our members, a philosopher who publishes under a pseudonym, drafted something she calls the "ligament model" for evaluating fellowship applications. basicly it claims left and right aren't defined by policy positions at all, but by binding mechanisms: the left coheres through shared opposition to a common exclusion, the right through shared defense of an inherited order. she wants us to stop asking if an applicant's work is politically correct and instead classify every project by which "binding mode" it assumes — then reject anyone whose mode conflicts with our charter, which she says is "oppositionally bound."

  the concrete problem is this year's finalist pool. there's a writer — not me, someone else — who's drafted a long narrative about the 1973 factory strikes, but she frames every collective action around individual dignity and refuses any language of group solidarity or shared grievance. half the board says the ligament model proves she's right-coded, because she privileges inheritance of personal autonomy over collective opposition. the other half says this is exactly why left/right is a useless fiction: the material is clearly leftist in subject, yet the model forces us to misread it just to preserve a metaphysics of politics.

  i need a memo i can circulate before thursday's meeting. recommend a concrete course — adopt the ligament framework for this cycle, reject it outright, or allow it only as descriptive language — with a timeline (vote thursday, any policy change implemented by march 1). the memo should take seriously the strongest argument on the losing side, especially the worry that we're inventing an obscure taxonomy to avoid actually talking about power and resources. please don't ask me to read german texts or provide a bibliography, and don't just list philosophers at me. i want something the board can actually vote on, not an essay. also there's a typo in my own notes — "recieve" — but you don't need to fix it, just write like i'm rambling over coffee.
