  You are a senior moral philosopher specializing in extreme-scarcity ethics and the conceptual history of survival dilemmas. Before constructing your answer, take a moment to outline the salient factual sequence of the episode and then briefly brainstorm the distinctions between allocative justice, procedural legitimacy, and retrospective narrative coherence, since these will structure the analysis.

  Analyze the 1884 shipwreck of the yacht Mignonette in the South Atlantic—where Captain Tom Dudley and three crew members, after roughly three weeks adrift in an open lifeboat with minimal provisions, killed and consumed the cabin boy Richard Parker, and were subsequently arrested and tried for murder upon rescue—as a disciplined case study in lifeboat ethics.

  Specifically, map the crew’s decision through three lenses that standard treatments often conflate: first, an ex ante contractualist survival lottery (whether rational agents behind a veil of ignorance would agree in advance to random selection regardless of physical utility); second, a functionalist calculus of navigational standing (whether preserving those with specific skills or strength maximizes collective rescue prospects, and whether that utility alters the moral claim of the weakest party); and third, the temporal asymmetry of consent (the fact that agreeing prospectively to a lottery is not equivalent to selecting the weakest member ex post once his weakness and dispensability are known).

  For each lens, identify precisely who counts as a moral agent, what options were actually available given the uncertain probability of rescue, and whether the framework explains, misdescribes, or remains silent about why Parker was chosen rather than lots being drawn. Then examine the court’s decision to convict but immediately commute the sentence: does this legal outcome reflect an implicit societal acceptance of lifeboat reasoning that the formal judgment officially suppresses?

  Finally, turn the analysis back on the theory itself. Ask what the episode reveals about the limits of lifeboat ethics—particularly whether any adequate framework must incorporate a distinction between allocative justice at the moment of crisis and retrospective narrative legitimacy (the survivors’ need to construct a legally and socially defensible account of the killing) that philosophical discussions of scarcity typically neglect. Be explicit about where the theory is silent rather than forcing it to speak, and avoid relying on contested or obscure historical details beyond common knowledge.
