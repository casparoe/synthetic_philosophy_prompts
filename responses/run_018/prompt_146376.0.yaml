answer: |-
  Here are the opening remarks in five movements:

  1.  Last night’s argument: is the extended mind—the idea that things like notebooks or even phones become literal parts of our thinking—a profound truth about how we exist, or just a useful metaphor for how we lean on tools?
  2.  Dr. Vasquez’s annotated scale models force the question: when her students still handle, correct, and fiercely debate her physical models years later, are they merely *using* her representations, or are those models somehow functioning *as* her cognitive partners, still extending the work?
  3.  A notebook achieves *functional parity* – it reliably stores words like memory; but Lena’s models achieved dynamic *causal coupling* – they sparked new arguments and corrections in real-time, actively shaping thought beyond mere storage.
  4.  Science can trace the model’s influence on a student’s reasoning, but where does the model’s *presence* end and Lena’s *absence* begin? That shift isn’t just data; it becomes a question of what we value about connection and what remains when someone is gone.
  5.  Her mind isn’t *in* these objects or the archive, yet something cognitively potent and uniquely *hers* undeniably happens when a student picks up a model and thinks *with* it—that tension is the living heart of her legacy we explore today.
