answer: |-
  **Bottom line: Your taxonomy exposes logical tensions in speciesism debates, especially around direct status claims conflicting with symmetry/ecology, and highlights the gradient problem as a core divider.**

  **Speciesism Taxonomy Tree:**

  1.  **Root Question:** What grounds moral status across species?
  2.  **First Branch: Ground of Status**
      *   **Claim A: Species membership can be a *direct* ground for moral status.** (e.g., Simply being human grants unique status).
          *   **Sub-Branch A1: Direct status is *absolute*.** (Human status always trumps superior non-human capacities. e.g., A super-intelligent, profoundly ethical octopus still has less moral status than a severely cognitively impaired human).
              *   **Leaf A1a: Human Supremacism (Absolute).** (Common, but faces "argument from marginal cases" challenge).
          *   **Sub-Branch A2: Direct status is *defeasible*.** (Species gives baseline status, but can be overridden by extreme cross-species capacity differences. e.g., A normal human > a normal pig, but a profoundly disabled human *might* < a super-intelligent ape).
              *   **Leaf A2a: Defeasible Anthropocentrism.** (Less common, logically slippery).
      *   **Claim B: Species membership is only an *indirect* stand-in for morally relevant capacities (sentience, autonomy, etc.).** (e.g., Moral status depends solely on possessing certain capacities, regardless of species).
          *   **Sub-Branch B1: Moral status scales *gradually* with capacity levels.** (e.g., More sentience = higher moral weight. A cow has more status than a shrimp, but less than a chimp).
              *   **Leaf B1a: Moral Gradualism / Capacity Scalarism.** (Logically aligns with neuroscience/ethology, but operationally messy).
          *   **Sub-Branch B2: Moral status requires meeting a specific *binary threshold* capacity.** (e.g., Any sentient being has full "personhood" status; non-sentient beings have none. All sentient beings have equal inherent value).
              *   **Leaf B2a: Sentience Threshold Egalitarianism.** (e.g., Utilitarian animal rights view).
              *   **Leaf B2b: Higher-Capacity Threshold (e.g., Autonomy).** (e.g., Some Kantian-inspired views, excludes many animals).

  3.  **Second Branch: Moral Symmetry**
      *   *(Applies to all leaves above)*
      *   **Claim C: Moral obligations are *symmetrical* across species in principle.** (If humans have duties to animals based on capacities, animals with relevant capacities could have duties *to humans or each other* in the same "currency". e.g., A chimpanzee might violate a human's rights or owe reparation).
          *   **Leaf: Full Moral Symmetry.** (Vanishingly rare, mostly theoretical. Logically *incoherent* with **A1a** - can't have symmetry if human status is absolute and unique).
      *   **Claim D: Moral obligations run *asymmetrically*, primarily (or only) from humans to other species.** (e.g., We have duties to animals based on *their* capacities/suffering, but they don't have reciprocal duties *to us* based on ours. Our moral agency creates unique obligations).
          *   **Leaf: Asymmetrical Obligations.** (Overwhelmingly dominant view, even among animal ethicists. Compatible with all other leaves *except* logically incoherent **A1a + Symmetry**).

  4.  **Third Branch: Ecological Embeddedness**
      *   *(Applies to all leaves above)*
      *   **Claim E: Being embedded in ecological roles (predator/prey, symbiosis) generates *role-based permissions* that can justify harming individuals.** (e.g., It's permissible for a wolf to eat a deer, and *by analogy*, permissible for humans in specific ecological/cultural contexts to use animals in ways causing harm, based on "natural" roles or systemic necessity).
          *   **Leaf: Role-Based Permissions (Ecological Justification).** (e.g., Some environmental ethics, indigenous perspectives, "humans as predators" arguments).
      *   **Claim F: Ecological roles do *not* generate fundamental moral permissions to harm individuals.** (Individual capacities/sentience create direct duties that trump appeals to ecological role or "naturalness". Permissions might exist only under extreme necessity, not role).
          *   **Leaf: Role-Indifferent Individualism.** (e.g., Standard animal rights/liberation view).

  **Key Notes on Combinations & Limitations:**

  1.  **Incoherent Combo:** **A1a (Absolute Direct) + Symmetry (C)** is logically impossible. Absolute human supremacy denies the possibility of non-humans holding duties *towards* humans in the same moral framework.
  2.  **Unpopular/Unstable Combos:**
      *   **A2a (Defeasible Direct) + Symmetry (C):** Possible but rare. If human status is defeasible, why couldn't a super-capable animal have duties? But who argues this?
      *   **B2a (Sentience Threshold) + Role-Based Permissions (E):** Tension exists. If all sentient beings have equal inherent value, how can "role" justify harming them? Justifications usually appeal to *necessity* or *different* values (ecosystem health), not direct role-permission within individual ethics.
  3.  **Limitations (Leaves Not Separated):**
      *   **Indirect Views (B1a vs B2a/B2b) + Symmetry (C):** These questions can't distinguish *which* capacities ground symmetry (e.g., Symmetry based on sentience vs. autonomy). You'd need another branch on "Which capacities ground duties/rights?".
      *   **Gradualist (B1a) vs. some Threshold (B2b) + Asymmetry (D) + Role-Indifferent (F):** These questions *don't separate* a gradualist who thinks humans have unique *duties* due to higher agency (but animals have scaled *status*) from a threshold theorist who sets the bar high (e.g., autonomy) for full rights. Both end up as Asymmetrical Role-Indivdualists functionally. Another branch on "Source of Asymmetry" (Capacity difference vs. Agency difference) is needed.
  4.  **The Gradient Problem:** The split **B1a (Gradual) vs B1b (Threshold)** is explicitly the "gradient consistency problem" and is a MAJOR fault line within capacity-based views (Claim B). Threshold views struggle to justify a non-arbitrary line; gradualist views struggle with practical weighting.
