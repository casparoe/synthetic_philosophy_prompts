prompt: |-
  im in this transitional justice seminar and we keep reading about amnesty being tied to truth-telling, but nobody actually explains how you'd run a decision case-by-case. let's say i work for a small regional board that can grant conditional amnesty to individual perpetrators, but only if the grant satisfies both "truth recovery" (victims learn what actually happened) and "non-repetition" (the institution that enabled harm is locked from doing it again). the catch is our charter gives us zero authority over institutions, only over people, so the principle has to be applied at the individual level, with a mandatory flag when institutional failure makes the grant moot regardless of the person.

  turn that into a reusable procedure my office could actually run: the ordered questions, what counts as a sufficient answer at each step, the hard-stop no's, and the exact points where we hand it to a human because its values not facts. then apply it to three proposals: (1) a prison guard who gives full verified testimony about torture but the prison system hasn't changed at all; (2) a mid-level commander who offers partial testimony and personally destroys his unit's hidden records (which he alone controls) to block future abuse, but refuses to name higher-ups; (3) a low-level informant whose testimony would locate a hidden mass grave, but the victims' families explicitly reject any deal and demand prosecution.

  present it like a flowchart in words with checkboxes, not a long essay, keep the whole thing under 400 words, and flag where the procedure will misfire or spit out an answer people won't like. also say what it literally cannot do given our institutional limits. include a typo or two if it feels natural.
reasoning: |-
  Hmm, the user is in a transitional justice seminar and needs help with designing a practical procedure for granting conditional amnesty. They're frustrated that their readings discuss amnesty tied to truth-telling but don't explain how to implement this case-by-case. 

  They work for a regional board that can only grant amnesty to individuals, not institutions. The conditions are: truth recovery (victims learn what happened) and non-repetition (preventing institutional recurrence). They need a reusable flowchart-style procedure with specific steps, sufficiency criteria, hard stops, and human judgment points. They also want it applied to three test cases and want limitations acknowledged.

  The core tension is individual accountability vs systemic change within institutional constraints. The user likely needs this for actual policy drafting (given the "my office" phrasing) and wants to avoid theoretical fluff. The emotional tone suggests frustration with academic vagueness - they crave concrete operationalization.

  Breaking this down: First, I need to design the procedure itself. It should be sequential with binary checkpoints. Key elements: truth verification, victim access to truth, concrete non-repetition actions by perpetrator, institutional risk flags, and victim consent overrides. Hard stops must include: incomplete truth, no victim access, families rejecting the deal.

  For the test cases:
  - Prison guard: Truth yes, but no systemic change. Procedure should flag institutional risk but allow amnesty since non-repetition isn't solely their responsibility.
  - Commander: Partial truth + destroys records. Hard stop at truth completeness. His action is good but insufficient without naming accomplices.
  - Informant: Truth valuable but families refuse. Hard stop at victim rejection regardless of truth utility.

  Critical limitations to note: Can't force institutional reform, may grant amnesty without systemic change (Case 1), and might block useful truths due to victim opposition (Case 3). The procedure will dissatisfy both hardliners (amnesty without reform) and pragmatists (blocked truth recovery).

  I'll structure it as a numbered flowchart with annotated outcomes for the cases. Must keep under 400 words - prioritize brutal concision. Natural typo opportunity: "principle" in Case 2 annotation since the commander refuses to name others. The tone should match their no-nonsense academic/professional style.
answer: |-
  ### Amnesty Decision Procedure (Truth + Non-Rep. @ Individual Level)

  **Flowchart Steps:**
  1.  **Full Disclosure Verified?** (Fact)
      *   *Sufficient:* Complete, verifiable account of *all* relevant events *by perpetrator*, matching evidence. Names all direct participants/orders.
      *   *Hard Stop NO:* Partial truth, refusal to name others, key facts withheld/unverified.
      *   *Human Flag:* Assessing credibility if evidence ambiguous.
  2.  **Victim Access Guaranteed?** (Fact/Value)
      *   *Sufficient:* Truth *will* reach identified victims/families via official report, direct communication, or public disclosure *they accept*.
      *   *Hard Stop NO:* Victims/families explicitly reject receiving truth *or* no viable dissemination method. **Override:** Family rejection = instant NO (Case 3).
      *   *Human Flag:* Defining "acceptable" dissemination for specific victims.
  3.  **Concrete Non-Rep Action?** (Fact)
      *   *Sufficient:* Perpetrator *personally* takes irreversible action disabling *their specific* means of abuse (e.g., destroys *their* records, dismantles *their* unit's hidden tool, publicly renounces method enabling future use).
      *   *Hard Stop NO:* Action is symbolic (apology), reversible, or targets unrelated things. No action taken.
      *   *Human Flag:* Assessing if action is genuinely disabling *within their control*.
  4.  **Institutional Failure Flagged?** (Fact)
      *   *Mandatory Check:* Does evidence reveal *systemic* enabling factors beyond perpetrator (unreformed policies, ongoing cover-up, lack of oversight)? "YES" triggers mandatory flag on decision doc.
      *   *Note:* Flag **does not** block amnesty if Steps 1-3 pass (Case 1). It highlights institutional risk remains.

  **Apply to Cases:**

  *   **Case 1: Prison Guard**
      *   1: YES (Full verified torture testimony).
      *   2: YES (Truth disseminated to victims).
      *   3: NO (Took no personal action to disable future torture capability).
      *   **OUTCOME: Amnesty DENIED.** Hard Stop at Step 3. Institutional Flag: YES (Prison unchanged).
  *   **Case 2: Mid-Level Commander**
      *   1: NO (Partial testimony, refuses to name higher-ups). **HARD STOP.** Non-rep action (destroying records) irrelevant at this stage. Institutional Flag: YES (Implies unaddressed chain of command).
      *   **OUTCOME: Amnesty DENIED.**
  *   **Case 3: Low-Level Informant**
      *   1: Presumed YES (Truth locates grave).
      *   2: NO (Families explicitly reject deal/dissemination). **HARD STOP.** Truth value irrelevant. Non-rep action irrelevant.
      *   **OUTCOME: Amnesty DENIED.**

  **Procedure Limitations & Misfires:**

  *   **Cannot Force Reform:** Grants amnesty *despite* systemic failure (Case 1 passes if Step 3 action exists). Institutional flag is just advisory.
  *   **Truth vs. Justice Tension:** May deny amnesty for valuable truth if families refuse (Case 3) or partial cooperation (Case 2), frustrating truth recovery goals. May grant amnesty without meaningful non-rep (if Step 3 action is weak but accepted).
  *   **"Within Control" Problem:** Assessing if Step 3 action is truly impactful/sufficiently disabling (e.g., destroying *one copy* of records) is subjective.
  *   **Blind Spots:** Cannot assess wider institutional risk beyond the specific case facts presented. Relies on perpetrator's testimony/evidence for flag.
  *   **Unpopular Outcomes:** Likely to grant amnesty in Case 1 if guard *had* destroyed specific torture tools (ignoring system), angering victims. Will deny Case 3, potentially leaving grave hidden.
