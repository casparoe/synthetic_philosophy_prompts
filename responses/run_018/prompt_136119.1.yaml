prompt: |-
  I've been arguing with my freind about insect ethics and I keep coming back to that scale argument—like, even if each individual bug only has a 0.01% shot at being sentient, there are literally trillions of them so the expected moral weight is enormous. But I think there's a conceptual knot people miss when they extend this to indirect harms, like climate policies that probabilistically shift insect populations over decades. I want an example of a conceptual issue that pops up right there, specifically involving whether this forces a kind of cross-species "moral risk pooling" that we never apply within human ethics. You know how we don't aggregate every human's tiny chance of being a hidden moral patient into one massive collective obligation? I want the example to make that tension explicit: a scenario where the scale argument seems to generate an overwhelming duty to prevent some minor temperature shift, but only because we're pooling unknown sentience risks across trillions of insects in a way we'd reject if the probabilities were about people. Keep it in the weeds, not just "bugs matter."

  Also, please say what kind of argument or finding would change your mind here—maybe if there's a principled reason aggregation works differently across species lines, or if the low-probability assumption breaks down at scale. Don't need citations or a reading list, I'm working offline and can't check references anyway.
