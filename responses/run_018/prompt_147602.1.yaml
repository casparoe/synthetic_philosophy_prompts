answer: |-
  Right, let's crack on. Your concept of "normative slack" is spot-on for describing how *too much* perceived flexibility in coordination rules doesn't just create mild disorder, but actively breeds a hidden, complex, and often unfair meta-game. This meta-game fundamentally undermines the initial coordination goal by shifting effort from *doing the work* to *navigating the unwritten rules about rule-bending*.

  Here's a concrete example from **open-source governance**, specifically focusing on the **code review process** in a large, distributed project:

  **The Coordination Problem:** Merging code safely and efficiently. The *stated rules* might include things like:
  1.  "All changes require at least one positive review from a maintainer."
  2.  "Reviewers should focus on correctness, maintainability, and alignment with project goals."
  3.  "Non-blocking suggestions (e.g., stylistic tweaks) are optional for the contributor to address."
  4.  "Reviewers should respond within a reasonable timeframe."

  **Introducing Normative Slack:** The project culture explicitly values "collaboration" and "avoiding bureaucracy." This manifests as:
  *   Vague terms: "Correctness," "maintainability," "reasonable timeframe" are open to wide interpretation.
  *   Emphasis on "consensus" over clear decision rights.
  *   A strong, unwritten norm *against* being "too rigid" or "blocking on nitpicks."
  *   Public channels favouring politeness over directness.

  **How Normative Slack Breeds the Second-Order System & Breaks Coordination:**

  1.  **The Emergence of "Reviewer Influence Tiers":** Because the *application* of the rules (what constitutes a valid blocking concern vs. a nitpick, what's "reasonable" response time) is highly flexible, an invisible hierarchy emerges based on *who* the reviewer is and their perceived status/clout within the project. A highly respected core maintainer can effectively turn a "non-blocking suggestion" into a *de facto* requirement simply by leaving it unaddressed, knowing the contributor feels immense pressure to appease them to get the merge. Conversely, a less-known contributor raising a *genuine* blocking concern might be easily overruled or ignored if a higher-status member dismisses it as a "nitpick." The *real* rule becomes: "The weight of your review comment is proportional to your social capital, not its technical merit relative to the stated rules."

  2.  **The "Reasonable Timeframe" Black Hole:** The flexibility around response times creates a meta-game of prioritisation *by harassment*. Contributors quickly learn that simply waiting politely gets them nowhere. The effective (but unwritten and exhausting) process becomes:
      *   Ping politely after 2 days (ignored).
      *   Ping again, slightly less politely, tagging the reviewer directly (maybe a response).
      *   Find the reviewer in an unrelated project chat and casually ask (higher success rate).
      *   DM a *different* higher-status maintainer to "nudge" the original reviewer (most effective, but burns social capital).
      The *coordination cost* skyrockets. Contributors spend disproportionate energy *chasing* reviews rather than coding. The stated goal of efficient merging is sabotaged by the hidden rule: "Your PR's priority is determined by your persistence and network, not its objective importance or order in the queue."

  3.  **"Consensus" as a Weapon:** The cultural pressure *against* being the blocker, combined with flexible definitions of "correctness," leads to "consensus-seeking" becoming a tool for obstruction or enforcing personal preference. A reviewer with strong opinions (but perhaps lower status) can delay a PR indefinitely by:
      *   Raising numerous "non-blocking" but subjectively important concerns.
      *   Framing subjective preferences ("I think we should use pattern X") as matters of "maintainability."
      *   Appealing to the need for "wider consensus" by tagging other, often busy, maintainers for input on minor points.
      The contributor is caught: formally, the reviewer hasn't *blocked*, but the PR is paralysed. Addressing all the points feels like appeasement, pushing back risks being labelled "difficult." The hidden rule is: "You can effectively block without taking responsibility by exploiting the consensus norm and the ambiguity of the rules." This destroys coordination by creating immense friction and unpredictability in the merge process.

  **Why This Breaks Coordination (Specifically):**

  The *point* of the code review rules was to coordinate effort towards **safe, efficient code integration**. Normative slack breaks this by:

  1.  **Shifting Focus:** Huge amounts of mental energy and calendar time are diverted from *evaluating code* to *navigating social hierarchies*, interpreting unwritten norms, and playing meta-games to get attention or approval.
  2.  **Introducing Unpredictability:** Contributors cannot reliably anticipate what will be required to get a PR merged, as it depends heavily on *who* reviews it and how they personally interpret the flexible rules on that day. This discourages contribution.
  3.  **Creating Hidden Friction & Inequity:** The process becomes disproportionately difficult and unfair for newcomers or those with less social capital, stifling diversity and participation. Coordination relies on predictable, shared expectations – this destroys them.
  4.  **Eroding Trust:** Contributors start to perceive the process as arbitrary and political, not fair or technically sound. Maintainers feel harassed. Trust in the *system* degrades, making future coordination harder.

  **In essence:** The flexibility intended to make collaboration smoother ("don't be bureaucratic!") instead creates a labyrinthine social game. The labour of coordination isn't reduced; it's transformed into the hidden, inefficient, and often demoralising labour of *deciphering and playing the meta-game of who can bend which rules and when*. The original goal – smooth, predictable code integration – becomes a casualty of that invisible second-order system. It's not merely that rules are broken; it's that the *system for applying the rules* becomes the primary source of dysfunction and inefficiency. Cheers for the fascinating concept – it describes a very real pain point!
