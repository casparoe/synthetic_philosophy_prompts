  I'm giving the opening remarks tomorrow at a small workshop titled "Copycat Concepts and Fluid Boundries in Microdomains" — about half the room are philosophers of language who actually think about conceptual slippage, and the other half are empirical researchers who mostly think we're just redefining terms to win arguments. I need a 6-minute talk that takes a definite, committed position: in these microdomains, conceptual slippage isn't an error to correct but the actual mechanism that makes concepts useful, and our methods should track the drift rather than try to lock extensions down. The stance needs to do real structural work — it should shape what I invite people to do during the sessions and what I ask them not to do (specifically, don't show up trying to "stabilize" the concept we're studying). Write it so the experts feel the argument has teeth and the non-experts don't feel talked down to. No reading lists, no citations, just the reasoning laid out plainly. Keep it casual — there's even a typo in the workshop poster (I spelled boundries wrong), feel free to nod at that. And don't hedge: pick the side and defend it with actual reasons, not a map of both positions.
