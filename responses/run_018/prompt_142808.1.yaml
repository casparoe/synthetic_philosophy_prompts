answer: |-
  1. **Setup and materials needed**: Private judgment sheets for 18 students (4 with P:yes/Q:yes, 5 with P:yes/Q:no, 5 with P:no/Q:yes, 4 with P:no/Q:no); ballots for P, Q, and R; a whiteboard for tallying; a scenario defining R as P∨Q (e.g., hiring where R is "qualified" if either skill P or Q is present).  

  2. **Rules, roles, and payoff scheme**: Roles: all students are committee members; one volunteer tally-keeper. Rules: First, the group debates and votes (majority rule) to lock in a tie-breaking meta-rule (premise-based or conclusion-based) *before* seeing judgments. Then, secret ballots determine outcomes for P, Q, R. Payoff: Students earn one "credit" (e.g., redeemable for seminar bonus points) if the group’s final R matches their private R; otherwise, they forfeit it.  

  3. **Debrief that maps each moment onto the formal parts**:  
     - Meta-rule vote = setting the aggregation function ex-ante.  
     - Private judgments = individually consistent sets (P/Q/R per R=P∨Q).  
     - Tied premise votes (P 9-9, Q 9-9) = premise-based method’s indeterminacy.  
     - Conclusion vote (R 14-4) = conclusion-based majority outcome.  
     - Conflict in final R (if meta-rule chose premise-based, R is false; conclusion-based yields true) = path-dependence paradox.  

  4. **What will predictably go wrong and how to handle it**: Students may conflate the logical rule (R=P∨Q) with real-world reasoning during the meta-rule debate, causing confusion. Handle it by cold-calling students to restate the rule using hypotheticals (e.g., "If P is tied, can we logically affirm R?") before the meta-rule vote.  

  5. **The one feature this game can’t reproduce**: The classic dilemma’s full collective inconsistency (where clear majorities on *all* propositions yield a logically inconsistent set, e.g., {P, Q, ¬R} for R=P∧Q) isn’t shown due to ties; verbally explain this variant after the activity.
