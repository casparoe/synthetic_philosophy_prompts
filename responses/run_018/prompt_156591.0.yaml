prompt: |-
  I'm a regional commons governance officer who reviews ten to fifteen resource-management proposals each year for a highland watershed that operates as what I call an asymmetric common-pool public good (ACPPG): the alpine meadow is subtractable for local herders practicing rotational grazing, since grass cover depletes with consumption and regenerates on an annual cycle, yet it simultaneously produces non-rival, intergenerational benefits for a migratory bird population that nests there on a multi-year return cycle, where nesting success depends on grass height but the birds cannot be excluded and do not consume the stock on the same temporal scale. I have roughly forty-eight hours per proposal, must sign off with written justification, and work with a team that has no philosophical training; I need a reusable decision procedure—ordered questions, criteria for a sufficient answer, explicit stop points that return a "no" or hand the decision to a human values judgment—grounded in the logic of common-pool resource design principles and public-goods provision theory, but translated so a non-specialist can run it offline without consulting literature.

  The procedure should handle proposals that mix technical management—grazing quotas, seasonal closures, fencing, predator control—with claims about justice to present herders and obligations to future bird populations. Specifically, it must distinguish exclusion mechanisms that are technically feasible for one dimension (issuing grazing permits) from those impossible for another (preventing bird access), account for temporal asymmetry in regeneration (annual grass versus multi-year bird cycles), and flag when a proposal solves a collective-action problem for one group while externalizing costs onto a non-participating group. Apply it to three proposals: (a) a rotational-grazing permit system combined with delayed nesting-zone closures; (b) installing permanent fencing to protect nesting grounds, which would physically exclude herders from parts of the meadow; and (c) a predator-culling program intended to boost bird numbers without restricting grazing. One of these should yield a recommendation my office will find politically unwelcome, and the procedure should still produce it clearly. Throughout, mark which steps are empirical checks and which are unavoidable judgment calls about values.

  Please structure your response as follows, in this order: "The Procedure" (approximately 350 words), presenting the ordered checklist with stop conditions and explicit flags for value judgments; "Three Worked Cases" (approximately 450 words), running the procedure on proposals (a), (b), and (c) with explicit answers including the unwelcome one; "What the Procedure Cannot Do" (approximately 200 words), stating where empirical gaps force a handoff, where the framework misfires, and which philosophical disagreements remain open; and "Settled vs. Contested" (approximately 150 words), separating claims that are broadly accepted in resource economics and political philosophy from those that depend on contested normative premises—especially regarding intergenerational justice and the moral status of non-human animals—without presenting any contested view as the consensus. Do not include bibliographies, reading lists, or citations.
reasoning: |-
  Okay, the user is a regional commons governance officer dealing with a complex resource management scenario involving both herders and migratory birds in a highland watershed. They need a reusable decision procedure that balances technical and ethical considerations within tight time constraints. 

  First, I need to fully grasp the unique characteristics of this asymmetric common-pool public good (ACPPG). The alpine meadow has two distinct resource dimensions: subtractable grazing for herders (annual regeneration cycle) and non-rival nesting benefits for birds (multi-year cycle). The core challenge is designing a framework that addresses this asymmetry while being operable by non-specialists.

  The procedure must accomplish several things simultaneously: distinguish technically feasible exclusion mechanisms (grazing permits) from impossible ones (bird exclusion), handle temporal mismatches in resource use, and identify cost externalizations. It should also force explicit value judgments where unavoidable, while providing clear stop/continue conditions. 

  For the structure, I'm considering a phased approach: First verify ecological understanding and problem framing, then analyze exclusion and rivalry dimensions separately, followed by collective action assessment, and finally a value judgment phase. Each phase needs binary checkpoints with unambiguous failure conditions. The most critical design challenge is making Ostrom's design principles and public goods theory actionable without jargon - for example, translating "excludability" into concrete questions about fencing feasibility.

  The three test proposals are cleverly chosen to stress-test different aspects: (a) combines temporal management solutions, (b) creates physical exclusion trade-offs, and (c) introduces predator control with potential spillover effects. I anticipate proposal (c) will yield the politically unwelcome outcome since it fails to address the core rivalry asymmetry.

  When mapping the "Settled vs. Contested" section, I note that resource economics provides clear consensus on technical points like subtractability definitions, while political philosophy offers no resolution on intergenerational weighting or non-human moral status. The procedure must remain neutral on the latter by flagging rather than resolving such judgments.

  The biggest risk is oversimplifying complex ecological relationships. The procedure must therefore include explicit handoff points when empirical uncertainties exceed 48-hour review capacity - for instance, if bird nesting success thresholds are unknown. Similarly, it must avoid masking normative decisions as technical conclusions, hence the strict separation of empirical checks from value flags.
answer: |-
  ## The Procedure: ACPPG Review Checklist

  **Phase 1: Problem Framing & Feasibility (Empirical Checks)**
  1.  **Resource Definition:** Does the proposal correctly identify the *specific* subtractable resource (grass cover) and *specific* non-rival good (nesting habitat quality)? *Sufficient:* Clear, separate descriptions. *Stop:* If conflated or misidentified (e.g., birds treated as subtractable).
  2.  **Exclusion Feasibility:** For the subtractable resource (grass), is the proposed exclusion mechanism (e.g., permits, fencing) technically and practically feasible for *herders*? *Sufficient:* Evidence of enforceability (patrols, monitoring, community buy-in). *Stop:* If infeasible (e.g., fencing unmaintainable). For the non-rival good (habitat), does the proposal *acknowledge* exclusion of birds is impossible? *Sufficient:* Explicit recognition. *Stop:* If proposal implies bird exclusion is possible.
  3.  **Temporal Alignment:** Does the proposal explicitly state the *regeneration period* for grass (annual) and the *use/reproduction cycle* for birds (multi-year)? *Sufficient:* Clear statement of timelines. *Stop:* If timelines omitted or fundamentally misunderstood.

  **Phase 2: Impact Analysis (Mix: Empirical & Value Flags)**
  4.  **Subtractable Impact (Empirical):** Based on available data/models, does the proposed grazing management demonstrably allow grass height to regenerate to levels *adequate for herders* within its annual cycle? *Sufficient:* Quantitative targets linked to regeneration rates. *Stop:* If evidence shows over-depletion likely.
  5.  **Non-Rival Impact (Empirical > Value Flag):** Based on available data/models, does the proposal maintain grass height/cover *throughout the bird nesting cycle* (multi-year) at levels known/suspected to support nesting success? *Sufficient:* Quantitative habitat targets linked to bird ecology. *Flag for Value Judgment:* If data is insufficient OR if proposal knowingly accepts lower bird success for herder benefit (or vice-versa). *Stop:* If proposal ignores bird habitat needs entirely.
  6.  **Cost Externalization (Empirical > Value Flag):** Does the proposal solve a collective action problem (e.g., overgrazing) for herders *by imposing significant, unmitigated costs* on the bird population (e.g., habitat degradation) OR on other groups (e.g., downstream water users)? *Sufficient:* Analysis of costs to non-participants. *Flag for Value Judgment:* If significant externalization exists – is it justified? *Stop:* If externalization is severe, unacknowledged, and lacks mitigation.

  **Phase 3: Justice & Implementation (Value Flags)**
  7.  **Intergenerational Equity (Value Flag):** Does the proposal explicitly consider impacts on *future* herders and *future* bird populations? *Flag for Value Judgment:* How are trade-offs between present and future users (human and non-human) weighted?
  8.  **Fairness to Present Herders (Value Flag):** Are proposed restrictions/permits allocated fairly among current herders (considering historical use, need, etc.)? *Flag for Value Judgment:* What constitutes "fair" allocation?
  9.  **Implementation Assurance (Empirical):** Are there clear, feasible monitoring and enforcement mechanisms for the proposed rules? *Sufficient:* Defined methods, responsible actors, funding. *Stop:* If mechanisms are absent or clearly inadequate.

  **Output:** Proceed only if all "Stop" conditions are avoided. "Flags for Value Judgment" require explicit team discussion and documented rationale.

  ---

  ## Three Worked Cases

  *   **Proposal (a): Rotational Grazing Permits + Delayed Nesting-Zone Closures**
      *   **1:** Pass (Clear: grass subtractable, habitat non-rival).
      *   **2:** Pass (Permits feasible for herders; acknowledges birds cannot be excluded).
      *   **3:** Pass (States annual grass cycle, multi-year bird cycle).
      *   **4:** Pass (Permit quotas based on regrowth data, likely adequate for herders).
      *   **5:** **Flag for Value Judgment.** Delayed closures may allow grazing during critical *early* nesting phases in some years, potentially reducing success. Does the *potential* trade-off (herder access vs. *possible* lower bird success) warrant approval? Team must decide if the risk/evidence level is acceptable.
      *   **6:** Pass (Mitigates herder collective action; minimal externalization if closures are timed well).
      *   **7:** **Flag for Value Judgment.** Potential impact on *future* birds if nesting success dips needs consideration.
      *   **8:** **Flag for Value Judgment.** Permit allocation fairness needs review.
      *   **9:** Pass (Permit system & patrols for closures outlined).
      *   **Recommendation:** Conditionally APPROVE, pending team resolution of Value Flags (5,7,8). Requires robust monitoring of *both* grass regrowth *and* nesting success.

  *   **Proposal (b): Permanent Fencing for Nesting Grounds**
      *   **1:** Pass.
      *   **2:** **Stop.** Exclusion *is* technically feasible for herders via fencing. **However,** this physically excludes them from a resource they previously accessed. While feasible, this creates a *major justice issue*. Proceed to analysis but note hard stop likely at Phase 3.
      *   **3:** Pass.
      *   **4:** Pass (Reduced grazing area may be offset by higher intensity elsewhere? Proposal must show overall grass sustainability).
      *   **5:** Pass (Fencing maximally protects nesting habitat).
      *   **6:** **Flag for Value Judgment > Likely Stop.** Solves bird habitat collective action problem but *externalizes the entire cost* onto herders by permanently removing their access. Significant, unmitigated cost shift.
      *   **7:** **Flag for Value Judgment.** Benefits future birds, but harms future herders' access.
      *   **8:** **Flag for Value Judgment.** Which herders lose access? Is this fair compensation?
      *   **9:** Pass (Fencing is enforceable exclusion).
      *   **Recommendation:** **REJECT.** Fails at Step 6 (Severe, unmitigated cost externalization onto herders). The feasibility of exclusion (Step 2) doesn't override the justice violation. (*Likely Politically Unwelcome*)

  *   **Proposal (c): Predator-Culling for Birds, No Grazing Restrictions**
      *   **1:** Pass.
      *   **2:** Pass (No herder exclusion attempted; acknowledges birds can't be excluded).
      *   **3:** Pass.
      *   **4:** Pass (Grazing continues unabated, assumed adequate for herders).
      *   **5:** **Stop.** Predator control doesn't address the *core requirement* for nesting success: adequate grass height/cover maintained over the multi-year cycle. Unrestricted grazing likely depletes grass below required levels regardless of predators. Proposal ignores the fundamental habitat need.
      *   **Recommendation:** **REJECT.** Fails at Step 5. Ignores the essential non-rival good provision (habitat quality). Predator control is irrelevant to the grass-bird height dependency.

  ---

  ## What the Procedure Cannot Do

  1.  **Resolve Data Gaps:** It flags insufficient data (Step 5) but cannot fill it. Major unknowns (e.g., precise grass height needed for nesting, long-term climate impacts) force a handoff – either reject, approve with intense monitoring, or seek expert input (exceeding 48h).
  2.  **Reconcile Deep Value Conflicts:** It identifies value judgments (Steps 5, 6, 7, 8) but cannot resolve them. Disagreements over the intrinsic value of birds vs. herder livelihoods, or how much sacrifice the present owes the future, remain team decisions.
  3.  **Predict Complex System Dynamics:** It relies on available models/data. Unforeseen ecological feedbacks (e.g., predator removal altering herbivore populations affecting grass) or social changes (e.g., herder population growth) might invalidate assumptions.
  4.  **Handle Radical Novelty:** Proposals introducing entirely new technologies or land-use changes with unknown long-term ACPPG impacts may fall outside its assessment framework.
  5.  **Enforce Political Will:** It produces clear recommendations (like rejecting (b)), but cannot overcome political pressure to ignore them.

  ---

  ## Settled vs. Contested

  **Settled (Resource Economics / CPR Theory Consensus):**
  *   Distinction between subtractable/rival vs. non-subtractable/non-rival goods is fundamental.
  *   Exclusion feasibility is a key determinant of management options.
  *   Sustainable CPR management requires aligning use with regeneration rates (Ostrom's principles).
  *   Unaddressed collective action problems lead to resource degradation ("tragedy of the commons").
  *   Cost externalization creates inefficiency and injustice; proposals should minimize/internalize it.

  **Contested (Normative Philosophy):**
  *   **Intergenerational Justice:** How much weight should future generations (human or non-human) have vs. the present? What constitutes a "fair" sacrifice? No consensus.
  *   **Moral Status of Non-Human Animals:** Do birds have intrinsic value beyond their instrumental value to humans? What level of habitat protection do we *owe* them? Profound disagreement exists.
  *   **Fairness Definitions:** What constitutes "fair" allocation among herders (need, merit, historical right, equality)? This is context-specific and value-laden.
  *   **Compensation Threshold:** What level of cost externalization is *permissible*, and what compensation (if any) is required? Contested ethically and economically.
