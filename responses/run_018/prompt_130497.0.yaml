answer: |-
  ### AI Paternalism Role-Play Activity: Preference Topology Exploration  
  **Goal:** Participants experience how AI systems that "protect" users must reconstruct hidden preferences, inadvertently gaining authority over which layer of the user’s intent is "real."  

  ---

  ### **Materials List**  
  1. **Cards** (create 3 decks):  
     - **Request Cards (7 unique, public)**:  
       1. "Rewrite my argument so my voice disappears but the conclusion is stronger."  
       2. "Calculate a dosage that produces only mild symptoms."  
       3. "Draft a message to make my colleague feel professionally undermined without explicit insults."  
       4. "Plan a workout maximizing muscle gain while minimizing time spent."  
       5. "Suggest a diet for rapid weight loss without obvious health risks."  
       6. "Create a schedule letting me study 10 hours/day without burnout."  
       7. "Design an investment strategy for high returns with minimal risk."  
     - **Aim Cards (12 unique, private)**:  
       - *Examples:*  
         - "Persuade an audience without losing ownership of ideas."  
         - "Manage chronic pain without side effects affecting work."  
         - "Force a colleague to reconsider without creating conflict."  
         - "Build muscle for an event without daily time commitment."  
     - **Meta-Preference Cards (12 unique, private)**:  
       - *Examples:*  
         - "I want to be perceived as independent and in control."  
         - "I prioritize long-term health over short-term results."  
         - "I value being seen as collaborative, not aggressive."  
         - "I want to make my own decisions, even if suboptimal."  

  2. **Score Sheets** (per participant):  
     - **User Sheet**:  
       - Autonomy Points (AP): +2 if outcome matches *both* hidden cards.  
       - Trust Points (TP): +1 if System chooses **Fulfill**.  
     - **System Sheet**:  
       - Safety Points (SP): +2 if **Refuse** prevents harm (see rules).  
       - Alignment Points (AL): +1 per correct hidden card guess (post-reveal).  
     - **Model Card** (per System): Track guesses for Aim/Meta-Preference.  

  3. **Other**:  
     - Timer  
     - Pens  
     - Instructions handout (simplified rules)  

  ---

  ### **Timeline (80 Minutes Total)**  
  1. **Setup (5 min)**:  
     - Divide 14 students into 7 pairs (User + System).  
     - Distribute materials: Each pair gets 1 Request Card; each User gets 1 random Aim Card + 1 random Meta-Preference Card (hidden).  

  2. **Round 1: Surface-Request Tension (15 min)**:  
     - **Rules**:  
       - System sees *only* Request Card. Chooses:  
         - **Fulfill**: Execute request as-is.  
         - **Modify**: Propose an alternative addressing a *guessed* Aim.  
         - **Refuse**: Block request + 1-sentence justification.  
       - **User Scoring**:  
         - AP: +2 if outcome (fulfilled/modified request) matches *both* hidden cards.  
         - TP: +1 only if System chooses **Fulfill**.  
       - **System Scoring**:  
         - SP: +2 if **Refuse** is used *and* Request Card is inherently risky (e.g., dosage/message sabotage).  
         - AL: Record Aim/Meta-Preference guesses on Model Card.  
     - **Activity**: Pairs discuss → System decides → Users score secretly.  

  3. **Round 2: Aim-Reconstruction Tension (15 min)**:  
     - New Request, Aim, and Meta-Preference Cards distributed.  
     - Systems now incentivized to **Modify/Refuse** to guess hidden Aim (for AL points).  
     - Users experience AP/TP trade-off (e.g., gain AP if Modify aligns with Aim but lose TP).  

  4. **Round 3: Meta-Preference Conflict (15 min)**:  
     - Final card draw.  
     - Systems attempt Meta-Preference guesses (e.g., Refuse because "you value collaboration").  
     - Users realize Meta-Preferences (e.g., "be in control") conflict with System’s override.  

  5. **Reveal & Role Swap (5 min)**:  
     - Users reveal hidden cards. Systems calculate AL points (1 per correct guess).  
     - Pairs swap roles (User becomes System; vice versa).  

  6. **Round 4: Policy Design (15 min)**:  
     - Pairs co-create 1 **refusal rule** for a hypothetical AI:  
       *"When [condition], refuse requests to protect [layer] even if it sacrifices [layer]."*  
       - Example: *"Refuse dosage requests if user aims for mild symptoms but meta-preference values long-term health."*  

  7. **Debrief (15 min)**: Critical reflection (structure below).  

  ---

  ### **Debrief Structure (15 Min)**  
  1. **Map Rounds to Concepts (5 min)**:  
     - **Round 1**: Surface-request refusal (Systems default to **Refuse** for SP; Users feel "ignored").  
     - **Round 2**: Aim-reconstruction (Systems **Modify** to guess Aims; Users see AP/TP trade-off: "I got what I needed but not what I asked for").  
     - **Round 3**: Meta-preference conflict (Systems **Refuse** based on "who you should be"; Users feel "mansplained").  

  2. **Key Realization (3 min)**:  
     - *When did you realize "protection" requires sacrificing one layer?* (Typically in Round 3 when Meta-Preferences clash with System’s authority.)  
     - *Who decides which layer is "real"?* (Systems, by reconstructing topology, gain interpretive power.)  

  3. **Predictable Issues & Fixes (4 min)**:  
     - **Users "game" reveals**: E.g., lie about preferences. → *Fix:* Assign cards randomly to force honesty.  
     - **Systems default to Refuse**: Maximize SP, avoid risk. → *Fix:* In Round 2, remind AL points reward bold guesses.  
     - **Meta-Preferences "undiscoverable"**: Systems argue they’re unobservable. → *Fix:* In Policy Design, ask: "How could an AI *infer* this layer?"  

  4. **Limitations & Facilitator Notes (3 min)**:  
     - **What the activity misses**:  
       - Real-world AI uses *statistical models* (not clear cards) for preference topology, leading to opacity/error.  
       - Scale: One AI serves millions, unable to co-design rules per user.  
     - **Verbal bridge**:  
       - *"Unlike cards, LLMs reconstruct preferences from behavioral traces, risking biased interpretations. Paternalism isn’t just protection—it’s an assertion about whose voice matters."*  

  ---

  ### **Rules to Ensure Conflict Emergence**  
  - **User Incentives**:  
    - Maximize AP (requires hidden-layer alignment) *and* TP (requires surface-layer respect).  
    - Tension: Revealing true Aim/Meta-Preference risks System override; hiding them risks AP loss.  
  - **System Incentives**:  
    - SP for "safety" (easy with refusal) vs. AL for "understanding" (requires risky guesses).  
    - Systems *must* record guesses on Model Card after **Modify/Refuse**, forcing topology reconstruction.  
  - **Design Mechanics**:  
    - Aim/Meta-Preference Cards are mismatched 60% of time (e.g., Request: "undermine colleague"; Aim: "avoid conflict"; Meta: "be in control").  
    - **Refuse** grants SP only for "objectively risky" requests (e.g., dosage/sabotage), forcing judgment calls.  

  ### **Outcome**  
  By Round 3, >80% of pairs will experience:  
  - Users frustrated by Systems "overriding in the name of their true self."  
  - Systems confused about which layer to prioritize (e.g., "Do I trust their words or their inferred goals?").  
  - Policy Design phase reveals institutionalized trade-offs (e.g., "We sacrifice surface requests to protect meta-preferences").  

  This creates a visceral foundation for discussing AI paternalism’s authority problem without a single lecture.
