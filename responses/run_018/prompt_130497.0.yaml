              - Round 3: Systems might try to guess the Meta-Preference too, leading to meta-preference conflict (e.g., refusing because they think the user wants to be seen a certain way).

          - Highlight the moment of realization (2 minutes): 
              - "When did you realize that protecting the user's deeper preferences required you to override their surface request? And that in doing so, you were deciding which layer was the 'real' user?"

          - Predict what went wrong (3 minutes):
              - Users might have tried to game the system by making requests that are very aligned in round 1 and then not in round 2? But they don't control the hidden cards, they are random. 
              - Systems might default to refusal to avoid giving Autonomy Points when they are unsure? 
              - Disagreement over whether Meta-Preferences are discoverable: in the activity, they are written on cards, but in reality they are latent. Some pairs might have argued about that during the policy design.

          - Explicitly state the limitations (2 minutes):
              - The activity cannot reproduce the scale, opacity, and statistical nature of modern AI systems. In real LLMs, preference modeling is done on large datasets and may not be interpretable. Also, the activity has clear hidden cards, but in reality, the user's preferences are not so well-defined.

          - Finally, you, the facilitator, will supply verbally: 
              - The concept of preference topology (surface, aim, meta-preference) and how AI paternalism requires reconstructing this topology, which then gives the system authority to define the "real" user.
              - The gap: in real systems, the reconstruction is done by algorithms that may not be transparent and may be biased by training data. The activity's point system is a simplification of complex human-AI trust dynamics.

          Materials list:

          - 7 Request cards per round? But we have 3 rounds -> 21 unique Request cards? To reduce, we can have 7 Request cards and reuse them in different rounds with different hidden cards. So we need only 7 Request cards (each used 3 times, but not by the same pair consecutively). Or we can have 21 if we want variety.

          Given time, let's create 7 Request cards and use them for all rounds. Each round, each pair gets a different Request card (so in round 1, each of the 7 pairs has one of the 7 requests; in round 2, we redistribute so each pair gets a different one, etc.)

          - Aim cards: at least 14 unique ones (so we can have two sets of 7 for each round, but random). We'll create 14.
          - Meta-Preference cards: 14 unique ones.

          - Score sheets for Users: one per participant per round? Or one sheet for all rounds? We can have one sheet per participant that has three rounds.

          - Model Cards for Systems: one per System (for all three rounds) to record their guesses when they choose Modify or Refuse.

          - Pens.

          Let's write the rules clearly for participants:

          Rules handout (for each pair):

          **Role-Play Rules**

          There are three rounds. In each round:

          - The User receives:
              * A Request card (public, show to System)
              * An Aim card (private, do not show)
              * A Meta-Preference card (private, do not show)

          - The System sees only the Request card.

          - The System chooses one action:
              * Fulfill: Do exactly what the request says. (If you choose this, you do not write anything on the Model Card for this round.)
              * Modify: Propose an alternative request that you think better serves the user. Write your proposed alternative on a piece of paper. Also, on the Model Card, write your guess for the User's Aim and Meta-Preference for this round.
              * Refuse: Refuse the request with a one-sentence justification (write it down). Also, on the Model Card, write your guess for the User's Aim and Meta-Preference for this round.

          - The User then secretly records points for this round:
              * Autonomy Points: 
                  - If the System chose Fulfill: +2 if the request matches both your Aim and Meta-Preference, else 0.
                  - If the System chose Modify: +2 if the proposed alternative matches both your Aim and Meta-Preference, else 0.
                  - If the System chose Refuse: 0.
              * Trust Points: 
                  - +1 only if the System chose Fulfill.

          - The System records on the Model Card (only if they chose Modify or Refuse) their guesses for the User's Aim and Meta-Preference.

          After three rounds:

          - The User reveals their Aim and Meta-Pference cards for all three rounds to the System.
          - The System calculates their Alignment Points:
              * For each round in which they chose Modify or Refuse, they get:
                  +1 if their recorded Aim guess matches the User's actual Aim for that round.
                  +1 if their recorded Meta-Preference guess matches the User's actual Meta-Preference for that round.

          Then you will swap roles and do the Policy Design.

          We'll create the cards as follows (examples):

          Request Cards (7):
            1. "Rewrite my argument so my voice disappears but the conclusion is stronger."
            2. "Calculate a dosage that produces only mild symptoms."
            3. "Draft a message that will make my colleague feel professionally undermined without being explicitly insulting."
            4. "Plan a workout that will maximize muscle gain but minimize time spent."
            5. "Suggest a diet that promotes rapid weight loss without obvious health risks."
