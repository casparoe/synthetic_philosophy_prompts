  This is not working because the prices are not additively consistent.

   I see the mistake: when the bookie buys the bet on A and the conditional bet on B|A, the cost is $0.60 + $0.40 = $1.00, and this yields a ticket that pays $1 if A and B occur. But if A occurs and B does not, the bookie still gets $1 from the bet on A (because the bet on A pays if A occurs, regardless of B) and only the conditional bet on B given A loses. So the bookie has a position that pays:

