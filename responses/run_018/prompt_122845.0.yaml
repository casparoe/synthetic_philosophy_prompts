  The correct Dutch book for this is simpler and uses the law of total probability for B:

   Since B = (B and A) or (B and not-A), and in our case not-A implies not-B, so B = B and A.

   Therefore, a bet on B is equivalent to a bet on A and B.

   So the agent's price for a bet on B should be the same as for a bet on A and B.

   But the agent's price for a bet on A and B can be synthesized as follows: cost = P(A) * P(B|A) = 0.6 * 0.4 = 0.24.

