answer: |-
  ### 1. Mapping to Inaccessibility Readings
  The hole argument establishes **no-difference (b)** and **no-determination (c)** inaccessibility for the assignment of metric values to specific manifold points *within* the hole. The inaccessible quantity is "which bare spacetime point (independently individuated) possesses which metric field value." Observers are implicitly defined as entities registering coincidences (e.g., particle collisions, light signals) – observable events fixed by the metric and matter fields. Point-coincidences are identical across isomorphic solutions, satisfying (b): no observable difference exists. The equations fail to determine *which* point has which metric value given initial data, satisfying (c).

  It does **not** establish **no-observer (a)** inaccessibility *robustly*. The argument is silent on whether an observer could, *in principle*, be "attached" to a spacetime point (e.g., a privileged test particle tracing a worldline) to discern its identity. Einstein implicitly assumed manifold substantivalism (points have primitive identity), making such attachment nonsensical *by definition*. Under this assumption, (a) holds vacuously as no observer *could* be constructed to access primitive point identity.

  **Applying the norm consistently in 1913:**
  - Against substantivalism: The norm (especially (b) or (c)) directly indicts primitive point identity as physically meaningless. Einstein *should have* concluded spacetime points lack inherent individuality.
  - Against *Entwurf*: The *Entwurf* theory had restricted covariance. Its non-generally covariant equations *do* (in principle) determine the metric field uniquely relative to a specific coordinate system/background structure. The norm doesn’t indict this determinism, only quantities truly inaccessible under the theory’s *own* rules. The norm wouldn’t directly challenge *Entwurf*’s formalism, only the substantivalist ontology Einstein presupposed.

  ### 2. What the Norm Cannot Explain
  The norm **cannot explain**:
  - **Why Einstein blamed covariance, not substantivalism:** His focus was on determinism (c), not ontology. He assumed substantivalism as non-negotiable background (inherited from SR/Newtonian physics), making general covariance appear to violate determinism. The norm is silent on which metaphysical assumptions are prior.
  - **The two-year delay:** Einstein’s return to general covariance (1915) was driven by *empirical* pressures (Mercury’s perihelion, ensuring energy-momentum conservation) and realizing the *Entwurf* equations were flawed. The hole argument/norm didn’t motivate the return; it was set aside.
  - **The standard objection (Covariance ≠ Physics):** The norm’s application *presupposes* that isomorphic models represent distinct physical possibilities. If one denies substantivalism (as the norm suggests), the isomorphisms represent the *same* physical state, so covariance poses no problem. The "inaccessibility" framing *depends* on a prior (substantivalist) verdict about what constitutes a distinct physical state. The norm doesn’t resolve this core metaphysical dispute; it’s applied downstream.

  ### 3. What the Episode Does to the Norm: Confirmation, Limits, and Under-determination
  The episode **confirms the norm’s core function** – flagging quantities immune to empirical grounding – but reveals its **limits**:
  - **Epistemic or Ontological?** The norm appears epistemic (about knowledge/observability) but its application here hinges on the *metaphysical* question: Are spacetime points individuals? The norm doesn’t *settle* this; it shows that *if* points are individuals, their identities are inaccessible.
  - **Under-determination of the Moral:** The norm **does not uniquely favor anti-substantivalism.** It equally supports:
      - *Anti-substantivalism/Relationism:* Discard primitive point identity.
      - *Sophisticated Substantivalism:* Points lack primitive identity; only equivalence classes of points under diffeomorphisms are real ("hole argument resolution").
      - *"Thin" Claim:* Only rules out multiplying physically undetectable differences (e.g., distinguish only gauge-invariant structures).
  The norm licenses only the thin claim: **Don’t posit empirically undetectable differences.** Choosing between sophisticated substantivalism and relationism requires further metaphysical arguments the norm doesn’t provide.

  ### 4. Transfer Test: Black Hole Interiors & Cosmic Horizons
  Applying the readings to physically inaccessible regions:
  - **Black Hole Interior (External Observer):**
      - *(a) No-observer:* **False.** An observer falling in *can* access the interior. Only *external* observers cannot.
      - *(b) No-difference:* **Plausible.** Events inside the horizon are causally disconnected from the exterior universe. Information about specific interior states *cannot* influence exterior observations (modulo Hawking radiation’s unitarity debate).
      - *(c) No-determination:* **Likely.** Laws + eternal external data may underdetermine the interior’s specific state (e.g., firewall controversy).
      - *Norm Application:* Favors viewing specific interior states (for a given exterior) as unphysical or gauge. Friends of the norm likely want this.
  - **Cosmic Horizon (Observable Universe):**
      - *(a) No-observer:* **True (for us).** No observer *within* our causal patch can access the beyond-horizon region.
      - *(b) No-difference:* **True.** Events beyond the horizon are causally disconnected; they cannot affect our observations.
      - *(c) No-determination:* **True.** Our laws + data cannot fix the state beyond the horizon.
      - *Norm Application:* Strongly suggests regions/structures beyond the horizon are not part of physical reality *for our universe*. This aligns with common views (e.g., preferring "local" QFT descriptions).
  - **Divergence & Need for Joint Inaccessibility:** The readings **diverge sharply** for the black hole interior due to the possibility of infalling observers (breaking (a) while (b)/(c) may hold). This reveals a need for a fourth notion: **Joint Inaccessibility (no *single* observer can access all relevant data, and data cannot be compared across observers)**. The norm yields desired conclusions (dismissing inaccessible specifics) *only* if we restrict "observer" in (a) to those confined to the accessible region *or* accept (b)/(c) as sufficient. This reinforces the "thin" moral from (3): the norm primarily warns against undetectable differences, but its application requires careful specification of "observer" and "difference" in physically complex scenarios.

  ### Verdict
  Accepting the inaccessibility norm does **not** compel acceptance of the standard anti-substantivalist moral of the hole argument; it equally supports sophisticated substantivalist resolutions that reject primitive point identity. The episode gives those rejecting the anti-substantivalist moral (e.g., sophisticated substantivalists) reason to restrict the **no-observer (a)** reading, particularly by clarifying that "observer" must be defined within the theory's causal structure and that (b) or (c) may suffice to trigger the norm. The norm’s core lesson is the rejection of empirically undetectable differences, not a specific ontology.
