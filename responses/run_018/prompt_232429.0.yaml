answer: |-
  ### **Futarchy Classroom Simulation: "The Extra Credit Allocation"**  
  **Decision:** How to distribute 5 bonus points (added to final course grades) among 20 students.  
  **Policies:**  
  - **Policy A:** Distribute 0.25 points to every student.  
  - **Policy B:** Award all 5 points to one randomly selected student (via lottery).  

  **Success Metrics (Vote Options):**  
  1. **Fairness:** Maximize the minimum self-reported satisfaction (1–10 scale) with the outcome.  
  2. **Efficiency:** Maximize the average self-reported satisfaction (1–10 scale).  
  3. **Equality:** Maximize the percentage of students rating satisfaction ≥7.  

  **Materials:**  
  - Voting ballots, play money ($500 in $10 bills per student), portfolio trackers (paper sheets).  
  - Two whiteboards: "Market A" (Policy A) and "Market B" (Policy B) with bid/ask columns.  
  - A sealed box with 20 pre-written satisfaction survey slips (to be completed post-decision).  

  ---

  ### **Rules & Timeline (90 Minutes Total)**  
  #### **Phase 1: Values Vote (10 mins)**  
  - **0–5 mins:** Instructor explains the decision (bonus points allocation) and the three success metrics *without* mentioning futarchy.  
  - **5–10 mins:** Students vote anonymously on the metric. Metrics are framed as:  
    *"Which outcome matters most for our class: fairness, efficiency, or equality?"*  
    **Result:** The metric with the most votes is chosen (e.g., "efficiency" → average satisfaction).  

  #### **Phase 2: Prediction Market (45 mins)**  
  - **10–15 mins:** Setup  
    - Each student receives $500 in play money and a portfolio tracker.  
    - Markets open for **two contracts**:  
      - **Contract A:** Pays $X in play money, where *X = actual average satisfaction if Policy A is implemented*.  
      - **Contract B:** Pays $Y, where *Y = actual average satisfaction if Policy B is implemented*.  
    - Trading rules:  
      - Students post **bids** (e.g., "Buy 2 A-contracts @ $5.00") or **asks** (e.g., "Sell 1 B-contract @ $6.50") on whiteboards.  
      - Trades executed when a buyer/seller match; both parties record transactions on portfolios.  
      - *No real money is used—only play money for bragging rights.*  
  - **15–45 mins:** Trading  
    - Students trade freely. Instructor seeds markets with initial bids/asks (e.g., Bid A: $4.00, Ask A: $7.00) to ensure liquidity.  
    - **Critical twist:** Privately give 5 students "insider clues" (e.g., "Policy B often causes resentment" or "Policy A boosts group morale") to simulate dispersed information.  

  #### **Phase 3: Policy Selection & Implementation (15 mins)**  
  - **45–50 mins:** Market Close  
    - Last traded price for each contract recorded (e.g., A: $5.20, B: $6.80).  
    - **Policy chosen:** The contract with the *highest price* wins (e.g., Policy B).  
  - **50–55 mins:** Implement Policy  
    - If Policy B wins, draw a random name to receive 5 points.  
    - If Policy A wins, add 0.25 points to all.  
  - **55–60 mins:** Outcome Survey  
    - Students anonymously rate satisfaction (1–10) on slips; collect in a box.  

  #### **Phase 4: Settlement & Winner (10 mins)**  
  - **60–65 mins:** Settle Contracts  
    - Open survey box, calculate actual average satisfaction (e.g., 6.4).  
    - All contracts for the *winning policy* pay $[actual satisfaction] (e.g., B-contracts pay $6.40).  
    - Contracts for the losing policy expire worthless.  
  - **65–70 mins:** Declare "Market Champion"  
    - Student with the most play money post-settlement wins a symbolic prize (e.g., candy).  

  #### **Phase 5: Debrief (20 mins)**  
  - **70–90 mins:** Guided discussion:  
    1. **Concept Introduction:**  
       - *"We simulated futarchy: Vote on values (metric), markets on beliefs (prices), then follow the market."*  
    2. **Key Moments → Futarchy Principles:**  
       | **Classroom Moment** | **Futarchy Concept** |  
       |------------------------|------------------------|  
       | Voting on metrics | **Values/Beliefs Separation:** Society chooses goals; markets decide how to achieve them. |  
       | Trading with "insider clues" | **Information Aggregation:** Markets pool private knowledge (e.g., clues about resentment). |  
       | Thin trading or price gaps | **Market Failure (Thin Markets):** Low participation → poor price signals. |  
       | A student manipulating prices | **Manipulation Risk:** Traders with big stakes distort prices (e.g., dumping contracts). |  
       | Discrepancy between vote and market outcome | **Preference vs. Prediction Gap:** Bets reflect beliefs, not values (e.g., "I voted for fairness but bet on B"). |  
       | Choosing/gaming "satisfaction" | **Metric Gaming:** Metrics are simplifications that miss nuance (e.g., rating satisfaction ≠ true welfare). |  
    3. **Limitations of the Exercise:**  
       - **One-off vs. Repeated Play:** Real futarchy faces "Goodhart’s Law" (gaming the metric long-term).  
       - **Stakes:** Play money ≠ real incentives; traders may not take it seriously.  
       - **Scale:** 20 traders ≠ a national market (liquidity matters!).  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Thin Markets (Low Trading Volume):**  
     - *Why:* Students may be confused or risk-averse.  
     - *Fix:* Seed markets with bids/asks; nudge quiet students to trade. If frozen, run a 5-min "call market" (collect all orders, clear at equilibrium price).  

  2. **Collusion/Manipulation:**  
     - *Why:* A student with large capital corners a market.  
     - *Fix:* Allow short-selling (students borrow contracts to sell high, buy back low). Debrief how this mirrors real-world manipulation (e.g., "pump and dump").  

  3. **Trading Preferences, Not Beliefs:**  
     - *Why:* A student hates Policy B, so sells B-contracts regardless of beliefs.  
     - *Fix:* Gently remind traders: *"Trade what you think will happen, not what you want."* Highlight this in debrief as a core futarchy challenge.  

  4. **Dominant Insider:**  
     - *Why:* One "insider clue" is too revealing (e.g., "Policy B causes jealousy").  
     - *Fix:* Make clues ambiguous (e.g., "Policy B correlates with high variance in satisfaction"). Debrief how unequal information creates power imbalances.  

  5. **Gaming the Metric:**  
     - *Why:* Students rate satisfaction dishonestly to win play money.  
     - *Fix:* Keep surveys anonymous. Debrief: *"In real futarchy, people game metrics like GDP by chasing short-term gains."*  

  ---

  ### **What the Exercise Cannot Replicate**  
  - **Repeated Strategic Behavior:** Real futarchy incentivizes long-term metric manipulation (e.g., inflating GDP while ignoring inequality). Classroom decisions are one-off.  
  - **High Stakes:** Play money lacks real risk, dampening information revelation.  
  - **Market Scale:** Liquid prediction markets require thousands of traders—not 20.  

  **Final Tip:** Run the simulation *before* lecturing on futarchy. Let students "feel" the mechanics, then use the debrief to link their frustrations/insights to theory. The chaos is the point!
