              4 clues: "Box A is not $20"
              4 clues: "Box A is either $40 or $60"
              4 clues: "Box A is less than $50"
              4 clues: "Box A is an even number of tens" (i.e., 20,40,60,80)

            But then some clues are fully informative! We don't want that.

          We want no one to know the exact amount. Example:

            Box A = 40, Box B = 60.

            Clues for Box A:
              - "Box A is between $30 and $50"
              - "Box A is not $50"
              - "Box A is even"
              - "Box A is not $30"

            Clues for Box B:
              - "Box B is between $50 and $70"
              - "Box B is not $50"
              - "Box B is even"
              - "Box B is not $70"

            And mixed:
              - "The difference between the boxes is $20"
              - "One box is $40 and the other is $60"

          We can have 20 unique clues? Or some duplicates.

          To keep it simple, we can have 5 types of clues, 4 of each:

            Type 1: "Box A is $40 or $60"
            Type 2: "Box A is $20 or $40"
            Type 3: "Box B is $60 or $80"
            Type 4: "Box B is $40 or $60"
            Type 5: "The total is $100"

          Then, if a student has a Type 1 clue, they know Box A is 40 or 60.
          If they also have a Type 5, they know if Box A is 40 then Box B is 60, and if Box A is 60 then Box B is 40.

          But no one has two clues? We give one clue per student.

          So no one knows the exact amounts. But by trading, they can aggregate.

     Trading portfolio sheet:

          Name: __________

          Starting cash: $100

          Trades:
            Time | Market | Buy/Sell | Quantity | Price | Counterparty | Cash Change | Contracts Change
            ... students record each trade ...

          Holdings after each trade.

     Whiteboards for each market:

          Market A:
            Bids: [Trader, Price, Quantity]
            Asks: [Trader, Price, Quantity]

          Market B: similarly.

     The instructor should prepare a cheat sheet for the chosen metric:

          If metric is Option 1: value = dollar amount
          If metric is Option 2: value = (dollar amount)^2
          If metric is Option 3: value = 100 - |dollar amount - 50|

     Then, after opening the boxes, compute the metric value for each box.

     Example: 
          Box A: $40
          Box B: $60

          If Option 1 chosen: 
              Metric A = 40, Metric B = 60
          If Option 2 chosen:
              Metric A = 1600, Metric B = 3600
          If Option 3 chosen:
              Metric A = 100 - |40-50| = 100-10=90
              Metric B = 100 - |60-50| = 100-10=90   [so they are equal]

     We'll see that the market prices should reflect these values.

     Now, what if the metric chosen is Option 3 and both boxes yield the same metric? Then the market prices for A and B should be about the same? and we can choose arbitrarily.

     This design is complex but doable.

