prompt: |-
  hey im trying to figure out where moral uncertainty research is actually stuck, past the usual survey stuff. if you had to rank the open problems by how upstream they are for anyone building decision procedures — not just philosphizing — which three deserve the most attention? im torn between whether intertheoretic value comparison is the real bottleneck, or if its more about updating credances when your moral theories are structurally incommensurable, or whether the framing should just shift from moral to normative uncertainty altogether. defend the ordering: which ones block the others, what progress in the next few years would flip your ranking, and is the debate about abandoning credance-weighted frameworks altogether a productive research line or just a distraction eating grad student time? i have maybe six months of serious reading and want to know where to put my energy so it actually moves something.
reasoning: |-
  Okay, this user is diving deep into moral uncertainty research, specifically asking about the most upstream bottlenecks for building decision procedures. They're clearly well-versed in the field—mentioning intertheoretic value comparison, updating credences with incommensurable theories, and the shift to normative uncertainty. They need a prioritized list of open problems, defended with how they block progress, and whether abandoning credence-weighted frameworks is worth pursuing.

  First, I should parse their core concerns. They're torn between three areas but want to know which are truly fundamental. They also mention having six months for serious reading and want their effort to actually move the needle. That's crucial—they're not just asking for a literature review; they want actionable research direction.

  Looking at their three candidates: intertheoretic comparison (how to compare values across theories), updating under incommensurability (how to revise beliefs when theories can't be measured against each other), and broadening to normative uncertainty (including epistemology, rationality, etc.). Plus, there's the meta-question about ditching credence-weighting altogether.

  I need to rank these by upstream impact. What blocks what? If we can't compare values across theories (#1), then updating credences (#2) becomes almost meaningless—you can't weigh what you can't measure. That makes #1 the deepest bottleneck. Then #2 becomes critical once #1 is partially solved, because even with comparison methods, updating remains messy. The shift to normative uncertainty (#3) feels more like expanding scope than a core blocker—it's important but doesn't prevent basic progress in moral uncertainty. 

  On abandoning credence-weighting: it's a valid critique, but if successful, it would require entirely new frameworks. That could be revolutionary but high-risk. For someone with six months, it might be a distraction unless they're theoretically bold. Progress on #1 (e.g., new comparison heuristics) or #2 (e.g., decision rules that bypass precise updates) could make credence-weighting more viable anyway.

  The user’s tone is urgent and pragmatic—they want to avoid "grad student time sinks." So I should emphasize where concrete progress is possible: perhaps focusing on #1 with applied work (e.g., domain-specific value comparisons) or #2 with computational models. If new math emerges for incommensurability (like category theory applications), that could reshuffle the rankings. But for now, #1 is the wall everything else hits.
answer: |-
  Based on the state of the field and the goal of building actionable decision procedures under deep normative uncertainty, here's a defensible ranking of the most upstream bottlenecks, along with analysis of dependencies, potential shifts, and the status of radical critiques:

  **Ranking & Rationale:**

  1.  **Intertheoretic Value Comparison (IVC):** **The Foundational Bottleneck.**
      *   **Why it blocks everything:** Without a coherent way to compare the "strength" or "units" of prescriptions from fundamentally different moral theories (e.g., comparing a utilon from Utilitarianism to a deontic constraint violation in Kantianism), any aggregation procedure (like MEC - Maximizing Expected Choiceworthiness) is mathematically undefined or arbitrary. You simply cannot weigh options meaningfully if you can't relate the scales. Current approaches (variance normalization, range voting, structural similarity) feel deeply unsatisfying and lack robust justification. Progress here is the *sine qua non* for any credible multi-theory decision algorithm.
      *   **Upstream Dependence:** IVC is the primary input needed for *any* aggregation framework (credence-based or otherwise) to function. Solving IVC wouldn't solve everything, but *nothing* substantial can be built without at least a partial, pragmatically defensible solution to IVC.

  2.  **Updating Under Structural Incommensurability / Non-Comparability:**
      *   **Why it's critical and blocked by IVC:** Even if you have a *static* method for IVC (e.g., for a fixed set of theories at time T), learning new information poses a massive challenge. If theories aren't just *difficult* to compare but are *structurally* incommensurable (e.g., one theory cares only about consequences, another only about intrinsic properties of actions), how do you update your *credences* based on evidence? Evidence might bear directly on one theory's ontology or axioms but have no clear translation to the "currency" of another. Standard Bayesian updating assumes evidence affects theories within a common framework/likelihood function – which may not exist across deeply incommensurable theories.
      *   **Dependence:** This problem fundamentally *presupposes* the need for aggregation (which requires IVC) and highlights a severe limitation of credence-based approaches *if* incommensurability is radical. Progress on IVC might *reveal* or *mitigate* the severity of this updating problem. If IVC is solved robustly, it might provide a common "language" for evidence.

  3.  **Framing Shift to Normative Uncertainty:**
      *   **Why it's important but less immediately blocking:** Moral uncertainty is a subset of the broader challenge of normative uncertainty (uncertainty about what you *ought* to do, encompassing epistemic norms, prudential norms, aesthetic norms, etc.). While expanding the scope is crucial for completeness and realism (most decisions involve multiple normative dimensions), progress on the *core aggregation problem* (IVC + updating) can often be made *within* the moral domain first. Frameworks developed for moral uncertainty might be extendable.
      *   **Dependence:** This framing shift doesn't *block* progress on the core technical challenges of IVC and updating within the moral domain. It's more about ensuring the eventual framework has the right scope. Tackling it *prematurely* without solving the core aggregation problem might just add complexity without foundational progress. However, insights from broader normative uncertainty (e.g., comparing epistemic value to moral value) *could* potentially inform IVC strategies.

  **Defending the Order:**

  *   **IVC is Primal:** You literally cannot run the calculation for any decision procedure aggregating multiple theories without IVC. It's the mathematical bedrock. Building a bridge (aggregation procedure) requires knowing how to measure the materials (value comparisons) from different sources (theories).
  *   **Updating Depends on Aggregation Viability:** The updating problem becomes acute *because* we are trying to maintain and update credences over theories we intend to aggregate. If IVC is utterly intractable, the whole credence-based aggregation project might fail, making the specific updating problem moot. Conversely, a robust IVC framework might *enable* new approaches to updating (e.g., translating evidence into the common "value currency").
  *   **Scope Follows Mechanism:** Defining the scope (moral vs. normative) is essential for the *final* system, but building the core *engine* (solving IVC and updating) can proceed within a manageable domain (morality) first. Expanding the scope later is more feasible than building an engine for an ill-defined, overly broad problem from the start.

  **What Could Flip the Ranking (Progress in Next Few Years):**

  1.  **A Breakthrough in IVC:** If someone develops a compelling, non-arbitrary, theoretically grounded (e.g., based on meta-normative constraints, decision-theoretic coherence, or structural features of theories) method for IVC that gains significant traction, the field would pivot rapidly. IVC would move from *the* bottleneck to an active area of refinement and application. This would immediately elevate the **Updating Problem** to the primary bottleneck, as the aggregation engine could now theoretically run, but learning would stall it. It might also make **Normative Uncertainty** more pressing, as the core engine could now be tested on broader domains.
  2.  **A Compelling Alternative to Aggregation:** If research convincingly demonstrated that *no* form of intertheoretic aggregation (credence-based or otherwise) is coherent or desirable, and proposed a viable alternative (e.g., epistemic modesty leading to different decision rules, or a completely different meta-framework), then **IVC** and **Updating** become less relevant. The focus would shift entirely to developing and defending these alternatives. This would be a paradigm shift.
  3.  **Formal Success in Updating Without Full IVC:** If someone developed a rigorous method for updating credences under deep incommensurability that *didn't* require full IVC (e.g., using imprecise probabilities, belief revision logic, or category theory applied to normativity), this could leapfrog the **Updating** problem to the top, demonstrating progress is possible even while IVC remains hard. It would reduce the *absolute* dependence on solving IVC first.

  **The Credence-Weighted Framework Debate: Productive or Distraction?**

  *   **Nature of the Critique:** The critique (e.g., from Sepielli, MacAskill, Weatherson, or more radically, from folks like Mogensen) that the whole project of weighting theories by credences and aggregating is fundamentally flawed is **extremely important and potentially devastating**. It questions the entire foundation of MEC-like approaches.
      *   **Arguments Against:** It relies on cardinal, intertheoretically comparable choiceworthiness; assumes credences over moral propositions are meaningful/stable; faces regress problems (uncertainty about the aggregation rule itself); may violate meta-normative intuitions.
  *   **Assessment:**
      *   **NOT Just a Distraction:** Ignoring these critiques is burying your head in the sand. If the foundations are rotten, building on them is wasted effort. Engaging with them forces rigor and clarifies assumptions.
      *   **But... Potential Time Sink:** Getting bogged down *only* in abstract critiques without attempting to build *anything* or explore *pragmatic* solutions *can* be unproductive, especially for an individual researcher with limited time. The critiques are deep and lack consensus resolutions.
      *   **Productive Paths:**
          *   **Seeking Robustness:** Does the *output* of MEC-like procedures remain stable under different (reasonable) IVC methods and despite the critiques? (e.g., Barry & Tomlin's work).
          *   **Developing Alternatives:** Actively working on non-aggregative approaches (contextualism, maximin under uncertainty, theory-specific deliberation heuristics, "cluelessness"-informed decision rules) is vital. This is where the critique becomes *most* productive.
          *   **Refining the Target:** The critiques help define *exactly* what a decision procedure needs to achieve and where MEC might be an acceptable pragmatic tool vs. where it fundamentally fails.
  *   **Recommendation:** **Engage critically but strategically.** Understand the core critiques deeply (they illuminate the fragility of the mainstream approach). However, for your 6-month focus, prioritize efforts that either:
      1.  **Attempt to build pragmatic, partial solutions to IVC or Updating** (explicitly acknowledging the foundational critiques as limitations), or
      2.  **Actively develop and formalize a specific non-aggregative alternative** inspired by the critiques. Avoid getting stuck *only* in meta-debates about the impossibility of aggregation without contributing to *constructive* alternatives.

  **Where to Put Your Energy for Impact:**

  Given your 6-month window and desire to "move something," focusing on **Intertheoretic Value Comparison (IVC)** is likely the highest leverage point:

  1.  **Deep Dive into IVC Proposals:** Critically analyze existing methods (variance normalization, range voting, structural approaches, metanormative regress). What are their core weaknesses? Where do they fail catastrophically?
  2.  **Seek Domain-Specific Pragmatism:** Instead of a universal solution, could plausible IVC heuristics be developed for specific, high-stakes domains (e.g., AI alignment, long-term policy, medical ethics) where the relevant theories are more constrained? Can empirical work (e.g., how humans *actually* try to compare values across frameworks, even imperfectly) inform this?
  3.  **Explore Formal Bridges:** Look for mathematical frameworks that handle incommensurability in other fields (economics, computer science, decision theory - e.g., partial orders, multi-objective optimization, category theory) and see if they can be adapted.
  4.  **Connect IVC to Updating:** As you study IVC, explicitly ask: "If we adopted *this* IVC method, how *would* evidence update our credences? What new problems arise?"

  **Why this over the others?** Progress on IVC, even partial or domain-specific, is the key that unlocks the possibility of any multi-theory decision procedure. Without it, work on updating lacks a clear target, and the debate over normative scope is premature. Working directly on IVC forces you to confront the deepest metaphysical and formal challenges head-on, and any tangible contribution here would be highly significant. Keep the critiques of credence-weighting in mind as guardrails, but let the attempt to *build* a partial solution drive your engagement.
