answer: |-
  ### Exam Question  
  *(Total time: 90 minutes. Write a concise essay response. No external resources permitted.)*  

  You encounter two sealed envelopes on your desk. You know one contains amount \(X\) and the other \(2X\), where \(X = 2^k\) for some integer \(k\) between 1 and 20 inclusive. The pair \((k, k+1)\) is chosen uniformly at random from the 20 possible consecutive pairs: \((1,2), (2,3), ..., (20,21)\). You randomly pick one envelope and open it, observing \(2^m\) for some integer \(m\).  

  The standard argument for switching says: "If I see \(S\), the other envelope has \(S/2\) or \(2S\) each with probability \(1/2\). The expected value of switching is \((1/2)(S/2) + (1/2)(2S) = 1.25S\), so I gain 25% by switching."  

  **Address the following:**  
  1.  Does this 25% expected gain hold **for all observed values** \(m\) in this bounded setup? Explicitly compute the *conditional* expected value of switching **when you observe \(m=1\) (i.e., \(S = 2^1\))** and **when you observe \(m=20\) (i.e., \(S = 2^{20}\))**. Explain why these cases challenge the standard calculation.  
  2.  Does introducing this bounded, proper prior **eliminate the paradox entirely**? Why or why not? Focus on whether conditioning on the *exact observed value* \(2^m\) is justified.  
  3.  Contrast the **statistical resolution** (fixing the prior to avoid improper distributions) with the **decision-theoretic resolution** (rejecting the conditioning step itself as invalid). What core issue does the latter highlight?  

  ---

  ### Model Answer  

  #### 1. Conditional Expectation at Boundaries  
  The standard argument assumes that for any observed \(S\), the other envelope is equally likely to be \(S/2\) or \(2S\). This fails at the boundaries.  

  *   **Observing \(m=1\) (\(S = 2^1 = 2\)):**  
      The only possible pairs involving \(S=2\) are \((k=1, k+1=2)\). Here, \(2\) is the *smaller* amount. The other envelope **must** contain \(2^2 = 4\) (twice \(S\)). There is **no pair** where \(2\) is the larger amount (as that would require \(k=0\), but \(k \geq 1\)). Thus:  
      \(E[\text{Other} | X=2] = 4 = 2S\) (Gain of 100%, not 25%).  

  *   **Observing \(m=20\) (\(S = 2^{20}\)):**  
      The only possible pairs involving \(S=2^{20}\) are \((k=20, k+1=21)\). Here, \(2^{20}\) is the *larger* amount. The other envelope **must** contain \(2^{19}\) (half of \(S\)). There is **no pair** where \(2^{20}\) is the smaller amount (as that would require \(k=21\), but \(k \leq 20\)). Thus:  
      \(E[\text{Other} | X=2^{20}] = 2^{19} = S/2\) (Loss of 50%, not a 25% gain).  

  **Challenge to Standard Argument:** The standard calculation assumes symmetry (equal chance of \(S/2\) or \(2S\)) that doesn't hold at the boundaries. For \(m=1\), \(2S\) is certain; for \(m=20\), \(S/2\) is certain. The 25% expected gain is invalid for these observations.  

  #### 2. Does the Paradox Vanish?  
  No, introducing a bounded, proper prior **does not eliminate the paradox entirely**. While it resolves the *infinity* associated with improper priors, the core issue of **conditioning on a zero-probability event** persists.  

  *   Observing a *specific* value \(2^m\) has positive probability only if \(m\) is an integer between 1 and 20, and the prior is proper. However, the paradox arises when we condition on the *exact value* \(X=2^m\). The standard switch argument treats \(m\) as fixed *after* observation and naively assumes the other envelope's amount is equally likely to be half or double, based *only* on the observed number. This ignores the **underlying pair structure**.  
  *   For interior values (e.g., \(m=10\)), observing \(2^{10}\) *could* mean it's the smaller amount (if the pair is (10,11)) *or* the larger amount (if the pair is (9,10)). Crucially, these two cases **do not have equal probability** given the observation. The probability depends on the prior distribution over the pairs. The standard \(1/2\) probability assumption is unjustified without considering how the observation \(X=2^{10}\) constrains the possible pairs.  
  *   **The Hidden Mistake:** The mistake is conditioning on \(X=2^m\) and then treating the relative size (half or double) as equally likely *independent of the prior distribution generating the pairs*. The bounded prior ensures the expectation *exists*, but the flawed *conditional expectation calculation* based on an invalid symmetry assumption is still the source of the paradox.  

  #### 3. Statistical vs. Decision-Theoretic Resolution  
  *   **Statistical Resolution:** This focuses on ensuring the prior distribution is **proper** (integrates to 1) and bounded, like our power-of-two setup. This avoids the infinite expectations that plague the naive uniform prior on all positive reals. It shows the 25% gain isn't universal (as seen at boundaries) and forces a correct calculation using the actual prior probabilities over the pairs. This *resolves the symptom* (unbounded expectations) but doesn't directly address *why* the naive conditioning step is tempting but wrong.  
  *   **Decision-Theoretic Resolution:** This rejects the **legitimacy of the conditioning step** itself. It argues that conditioning on the *exact observed value* \(X=S\) is problematic for decision-making *even when the prior is proper*. The core issue is that the decision rule "always switch" based on the conditional expectation \(E[Y|X=S]\) is **incoherent**. It leads to a contradiction: if switching is always beneficial *regardless of S*, then you should switch even before opening the envelope, which implies the unopened envelope is always better – a contradiction. The resolution highlights that the conditioning move \(E[Y|X=S]\) relies on an **implicit, unjustified symmetry assumption** about the likelihood of the two envelope types given \(S\), which fails in general. The decision-theoretic view emphasizes that no single decision rule (switch/don't switch) conditioned solely on the observed value can be optimal for all possible underlying pair distributions without contradiction.  

  ---

  ### Marking Scheme (Total: 20 Marks)  
  **Must-Hit Points (A-grade requires all five; B-grade typically misses 1-2 nuances):**  

  1.  **Boundary Calculations (4 marks):**  
      *   Correctly computes \(E[\text{Other}|X=2] = 4\) (2S). *(1 mark)*  
      *   Correctly computes \(E[\text{Other}|X=2^{20}] = 2^{19}\) (S/2). *(1 mark)*  
      *   Explicitly states impossibility of \(S/2\) when \(m=1\) and \(2S\) when \(m=20\) due to bounded k. *(1 mark)*  
      *   Explains this contradicts the 50-50 assumption of the standard argument. *(1 mark)*  
      *   *Common Mistake:* States boundaries are different but doesn't compute expectations or explain *why* the symmetry breaks.  

  2.  **Paradox Persistence Explanation (4 marks):**  
      *   States bounded prior resolves infinity but **not** the paradox. *(1 mark)*  
      *   Identifies the flaw is **invalid conditioning** (assuming 50-50 likelihood given exact S). *(1 mark)*  
      *   Explains that *interior* points also lack 50-50 probability (e.g., for S=1024, P(Small|S) ≠ 1/2). *(1 mark)*  
      *   Clearly states the "hidden mistake" is ignoring how the prior distribution dictates the actual conditional probabilities. *(1 mark)*  
      *   *Common Mistake:* Claims paradox vanishes because prior is proper, without addressing conditioning flaw.  

  3.  **Conditioning Illegitimacy (Decision Core) (4 marks):**  
      *   Articulates that the decision-theoretic resolution rejects conditioning on exact S as a valid basis for the "always switch" rule. *(1 mark)*  
      *   Mentions the resulting **incoherence/contradiction** (always switching implies switching unopened is better). *(2 marks)*  
      *   Identifies the **unjustified symmetry assumption** as the root error in the conditioning step. *(1 mark)*  
      *   *Common Mistake:* Focuses only on the prior being proper vs improper; doesn't mention incoherence or the symmetry assumption.  

  4.  **Resolution Distinction (4 marks):**  
      *   Defines **Statistical Resolution**: Fixing the prior (proper, bounded) to avoid infinity. *(1 mark)*  
      *   Defines **Decision-Theoretic Resolution**: Rejecting the conditioning step itself due to incoherence. *(1 mark)*  
      *   Contrasts them: Statistical fixes the *model* (prior), Decision-Theoretic fixes the *decision rule* (rejects conditioning logic). *(2 marks)*  
      *   *Common Mistake:* Conflates the two resolutions or describes them vaguely without clear contrast.  

  5.  **Clarity & Argument Structure (4 marks):**  
      *   Logically structured (addresses parts 1, 2, 3 sequentially). *(1 mark)*  
      *   Precise use of probability terms (conditional expectation, prior, incoherence). *(1 mark)*  
      *   No significant irrelevant tangents (e.g., long rehash of unbounded case). *(1 mark)*  
      *   Concise and answers all sub-parts directly. *(1 mark)*  
      *   *Common Mistake:* Rambling, unfocused, omits key sub-questions, or overly verbose on standard paradox.
