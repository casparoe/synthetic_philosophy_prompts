answer: |-
  ### Decision Tree for Evaluating Unrealistic Assumptions in Models

  **How to Use:**  
  For a paper's central model, pick one key false assumption. Run this tree for that assumption. Answer each question based on the paper's text. The leaf gives the model's epistemic status: what its success is evidence for. If the paper has multiple key assumptions, run the tree for each.

  **Tree Questions:**  
  1. **Is this false assumption critical for the paper's main conclusion?**  
     - **No** → Go to 2.  
     - **Yes** → Go to 3.  

  2. **Does the paper treat the model as a tool for prediction or calculation, not a literal description?**  
     - **Yes** → **Leaf A: Minimalist/Tractability**. The assumption is a placeholder for tractability; the model works without it being true. *Awkward: Even wild falsehoods are excused if not critical.*  
     - **No** → Rethink: This should be rare. If the assumption isn't critical, the paper shouldn't treat it as essential.  

  3. **What is the model's primary target?**  
     - **A specific real-world system** (e.g., a city's housing market, a species' population) → Go to 4.  
     - **A general mechanism** (e.g., how segregation *could* arise, how prices *might* adjust) → Go to 7.  

  4. **If you replaced the false assumption with a true one, what happens to the main result?**  
     - **Result survives** (maybe weaker/stronger, but still holds) or **gets stronger** → Go to 5.  
     - **Result collapses** (or becomes invalid) → **Leaf F: Accusatory**. The paper's conclusion relies illegitimately on the falsehood. *Awkward: The model is broken; the conclusion is unsupported.*  
     - **No true substitute exists** (e.g., assuming infinite time/agents) → Go to 6.  

  5. **Can you tell if the false assumption pushes the result in a known direction?** (e.g., always overestimates supply, ensures segregation occurs)  
     - **Yes** → **Leaf B: Galilean/Isolating**. The model isolates a real mechanism by stripping noise; error direction is known. *Awkward: Quantitative precision is weak, but qualitative insights hold.*  
     - **No** → Go to 6.  

  6. **Is there a known way to relax this assumption step-by-step toward reality?** (e.g., a sequence of models adding friction, finite agents)  
     - **Yes** → **Leaf E: Convergentist**. Closer-to-truth models improve results; this is a step. *Awkward: Current model may be poor, but the ladder promises progress.*  
     - **No** → **Leaf F: Accusatory**. The assumption is critical and unrepairable; the conclusion isn’t justified.  

  7. **If you replaced the false assumption with a true one, what happens to the main result?**  
     - **Result survives** or **gets stronger** → **Leaf C: Fictionalist/Credible-World**. The model shows how the mechanism *could* work. *Awkward: "Could" doesn’t mean "does"—it may be unrealistic.*  
     - **Result collapses** → **Leaf F: Accusatory** (as above).  
     - **No true substitute exists** → Go to 8.  

  8. **Is the result found in other models with different assumptions about this?** (e.g., different agent rules, mating systems)  
     - **Yes** → **Leaf D: Robustness/Multiple-Models**. Shared results across models are robust. *Awkward: No single model is realistic, but agreement carries weight.*  
     - **No** → **Leaf C: Fictionalist** (as above).  

  **Leaf Positions:**  
  - **A. Minimalist/Tractability**: Harmless convention.  
  - **B. Galilean/Isolating**: Isolates real mechanisms.  
  - **C. Fictionalist/Credible-World**: Shows possibility.  
  - **D. Robustness/Multiple-Models**: Robust across frameworks.  
  - **E. Convergentist**: Part of a truth-converging sequence.  
  - **F. Accusatory**: Illegitimate work.  

  **Unseparated Positions & Labels:**  
  - **Fictionalist (C) and Galilean (B) are distinct**: Fictionalist is for mechanisms ("could"), Galilean for real systems ("does, with known error").  
  - **Minimalist (A) and Instrumentalist are merged**: Instrumentalism (truth of assumptions irrelevant) is folded into Minimalist, as both excuse non-critical falsehoods.  

  ---

  ### Test Cases  
  *(Paths shown node-by-node)*  

  **(a) Segregation Model**  
  - *Agents on a grid with mild preferences, leading to segregation; discusses real segregation.*  
    1. Load-bearing? **Yes** (preferences and grid are critical).  
    2. Target? **Real system** (real residential segregation).  
    3. Make-it-true test? **Survives** (real geography/motivations still yield segregation).  
    4. Sign error? **Yes** (model shows segregation occurs easily; real biases likely strengthen it).  
    → **Leaf B: Galilean/Isolating**.  
    *Verdict defensible: Model isolates a core mechanism (preference-driven segregation) with known directional insight (minimum estimate).*  

  **(b) Population Genetics Model**  
  - *Infinite population, random mating, no selection; baseline for real data departures.*  
    1. Load-bearing? **No** (central conclusion is "departures exist," from data; model is standard baseline).  
    2. Paper treats model as tool? **Yes** (predictive null, not literal).  
    → **Leaf A: Minimalist/Tractability**.  
    *Verdict defensible: Assumptions are conventions for tractability; conclusion doesn’t rely on their truth.*  

  **(c) Policy Housing Model**  
  - *Price-taking, no friction, free entry; argues rent control reduces supply with quantitative estimate.*  
    1. Load-bearing? **Yes** (quantitative elasticity relies on assumptions).  
    2. Target? **Real system** (specific housing market).  
    3. Make-it-true test? **Collapses** (adding real-world frictions changes the elasticity estimate).  
    → **Leaf F: Accusatory**.  
    *Deflating verdict: Quantitative claim collapses under de-idealization; students may expect Galilean but direction of error is unknown, and no de-idealization ladder is offered. Tree flags overreach.*  

  ---

  ### What the Tree Cannot Do  
  - **Single assumption with dual roles**: If an assumption (e.g., infinite agents) both enables tractability *and* distorts a mechanism, the tree treats it as one role per run.  
  - **Target is an idealization**: When the model targets another model's output (e.g., "rational agents" from economics), not reality, the tree misfires (assumes real-world or mechanism targets).  
  - **Policy recommendations**: If the conclusion is a costly policy (e.g., deregulate housing), false positives (approving a harmful policy) are worse than false negatives. Tree ignores this asymmetry; burden of proof isn’t shifted.  

  ---

  ### Student-Facing Half-Page Tool  
  *(Laminated PDF version; run in 20 mins per assumption)*  

  **Evaluating a Model's Assumptions**  
  *Answer for one key false assumption. Use paper text only.*  

  1. **Is this false assumption VITAL for the paper’s main finding?**  
     - No → Go to 2.  
     - Yes → Go to 3.  

  2. **Does the paper use the model as a tool, not a literal claim?**  
     - Yes → **A: Convention Tool**. The falsehood doesn’t break it; it’s just practical.  
     - No → Rethink: Non-vital assumptions shouldn’t be treated as essential.  

  3. **Is the model about a REAL thing (e.g., NYC housing) or a POSSIBLE process (e.g., how segregation could happen)?**  
     - Real thing → Go to 4.  
     - Possible process → Go to 7.  

  4. **If you swapped the false assumption for a TRUE one, what happens to the main result?**  
     - Result HOLDS or gets STRONGER → Go to 5.  
     - Result BREAKS → **F: Broken Model**. The finding needs the lie.  
     - NO TRUE VERSION exists → Go to 6.  

  5. **Can you tell if the lie pushes the result ONE WAY?** (e.g., always overestimates)  
     - Yes → **B: Isolated Core**. The model strips noise; you know the error.  
     - No → Go to 6.  

  6. **Is there a known PATH to fix the lie step-by-step?**  
     - Yes → **E: Convergent Step**. Better models get closer to truth.  
     - No → **F: Broken Model**.  

  7. **If you swapped the false assumption for a TRUE one, what happens?**  
     - Result HOLDS or gets STRONGER → **C: Possible World**. Shows how it *could* work.  
     - Result BREAKS → **F: Broken Model**.  
     - NO TRUE VERSION → Go to 8.  

  8. **Do OTHER models with different assumptions get the same result?**  
     - Yes → **D: Shared Insight**. Agreement matters, not one model.  
     - No → **C: Possible World**.  

  **Leaf Meanings:**  
  - **A**: Harmless practicality.  
  - **B**: Captures truth directionally.  
  - **C**: Shows possibility, not reality.  
  - **D**: Robust across approaches.  
  - **E**: Part of a truth-seeking sequence.  
  - **F**: Unjustified finding.  

  ---

  ### Revisions from Test Runs  
  - **Revised Node 4 (Make-it-True for Real Systems)**: Added "No true substitute exists" option after case (b) showed baseline models (e.g., infinite populations) often lack true counterparts.  
  - **Clarified "Sign Error" for Qualitative Results**: Case (a) (segregation) initially went to Accusatory (F) on "unknown error," but qualitative insights (segregation occurs) have known direction (e.g., model is conservative). Now, signing error includes qualitative bounds.  
  - **Policy Case (c) to Accusatory**: Tree deflates the quantitative claim (expected), but students might protest. Defense: Without error direction or de-idealization path, the number is unsupported.  
  - **Fictionalist (C) and Robustness (D) Separated**: Case (b) revealed fictionalism doesn’t require multiple models; robustness does. Added Node 8 for mechanisms without true substitutes.  

  **Unchanged Constraints**: Tree size (7 nodes, 6 leaves), no jargon, no theory dependence.
