   Node 4 (real system, from node 3): Can we determine the direction of the error introduced by the false assumption? (Signing the error)
     - Yes, we know whether the model overstates or understates the true effect or whether the qualitative result is robust -> Node 5
     - No, the sign of the error is unknown -> Node 5   [wait, we have to go to node 5 for both?]

   This is a mistake. In the tree, after node 4, we go to node 5 only if the answer is "no", but if "yes", we go to leaf B.

   Revised Node 4: 
     - Yes -> Leaf B: Galilean/isolating position. The idealization isolates a real mechanism, and we know the direction of error, so the model provides insight or bounds. Awkward commitment: the model may be quantitatively inaccurate, but it gives a reliable qualitative or bounded quantitative result.
     - No -> Node 5

   Node 5 (real system, from node 4 "no"): Is there a known way to relax this idealization in a sequence of models that converge to a more realistic model? (De-idealization ladder)
     - Yes -> Leaf E: Verisimilitude/convergentist. The model is part of a convergent sequence, and closer to truth is better. Awkward commitment: the current model may be poor, but the ladder shows progress.
     - No -> Leaf F: Accusatory. The assumption is critical and there is no known way to improve it, so the model's conclusion is not justified.

   Node 6 (mechanisms): If we try to replace the false assumption with a true one (if possible), what happens to the paper's central result? (Make-it-true test)
     - The result survives or gets stronger -> Leaf C: Fictionalist/credible-world. The model shows how the mechanism could work, even if unrealistic. Awkward commitment: possibility does not imply plausibility.
     - The result collapses -> Leaf F: Accusatory. The mechanism relies on the unrealistic assumption.
     - Not applicable -> Node 7

   Node 7 (mechanisms, from node 6 N/A): Is the paper's central result also found in other models that make different assumptions about this factor? (Robustness)
     - Yes -> Leaf D: Robustness/multiple-models. The shared result across models with different assumptions is what carries the weight. Awkward commitment: any one model may be unrealistic, but the common result is robust.
     - No -> Leaf C: Fictionalist. (Same as above)

  Leaves:
  A: Minimalist/tractability
  B: Galilean/isolating
  C: Fictionalist/credible-world
  D: Robustness/multiple-models
  E: Verisimilitude/convergentist
  F: Accusatory

  Now, run the cases:

  (a) Segregation model:
  - Load-bearing: yes
  - Target: real system
  - Make-it-true test: survives (qualitatively) -> node 4
  - Can we sign the error? For the qualitative result (segregation occurs), we can say yes because the model shows it happens with mild preferences, so in reality it happens at least as easily. -> Leaf B: Galilean

  (b) Population genetics:
  - Load-bearing: Is the assumption critical for the central conclusion? The central conclusion is that there are departures from HWE in the data. The null model is used to define the departure, but the conclusion comes from the data. The null model is a standard tool, not load-bearing for the departure result. -> No, not load-bearing. -> Leaf A: Minimalist

  (c) Housing market:
  - Load-bearing: yes
  - Target: real system
  - Make-it-true test: If we add frictions, the quantitative estimate of the reduction in supply might be different. The paper's central result is the quantitative estimate. So if we make it true, the specific number may not hold, so the result collapses for the quantitative claim. -> Leaf F: Accusatory

  This matches the expectation that the policy case is deflating.

   The tree cannot do:
  - When a single assumption plays two roles.
  - When the target is an idealization from another model.
  - When the conclusion is a policy recommendation, so errors have asymmetric costs and burden of proof shifts. In particular, for policy, we might require a higher standard, but the tree doesn't account for that.

