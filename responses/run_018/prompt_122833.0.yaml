answer: |-
  **OFFICE OF THE ADMINISTRATOR**  
  **BUREAU OF ECONOMIC TRANSACTIONS AND WELFARE ACCOUNTING (BETWA)**  
  **Circular No. BETWA-2024-07: Benefit-Cost Analysis Under Strict Revealed Preference Protocol**

  **Subject:** Unified Procedures for Welfare Measurement and Policy Evaluation  
  **Effective Date:** Immediately  
  **Supersedes:** BETWA-2019-11, Sections III-VII  

  ---

  **1. Preamble & Foundational Principles**  
  The Bureau of Economic Transactions and Welfare Accounting (BETWA) is mandated to conduct rigorous benefit-cost analyses (BCA) for federal policy interventions. Consistent with the *Revealed Preference Act of 2018* (RPA), BETWA employs a strictly behavioral methodology. Welfare is defined exclusively through observed market and non-market choices, as these provide the only objective, falsifiable evidence of preference. This Circular codifies the operationalization of this principle.  

  **Core Doctrines:**  
  *   **Utility as Behavioral Index:** Utility is not a mental state or subjective feeling. It is the numerical index that rationalizes observed choices as optimization under constraints. Cardinal representations are admissible only insofar as they preserve the ordinal ranking of chosen alternatives. Reported experiential states (e.g., "satisfaction," "regret," "happiness") constitute untested testimony and are inadmissible against a completed, feasible transaction.  
  *   **The Silent Option Rule (SOR):** Preference is defined by choice. Therefore, an agent cannot be mistaken about their preference at the point of decision. Any alternative not chosen is deemed *latently infeasible* at the moment of choice. Latent infeasibility encompasses not only physical or budgetary constraints but also informational, cognitive, or temporal barriers identifiable only *ex post* through the choice itself. SOR ensures internal consistency within the choice dataset.  

  **2. The Utility Numeraire and Conforming Rescalings**  
  As utility indices are ordinal (or cardinal under risk, invariant to positive affine transformations), the absolute magnitude of utility lacks intrinsic meaning. To enable aggregation and monetary valuation required for BCA, the *Utility Standardization Statute (USS)* establishes a statutory welfare numeraire.  
  *   **Definition:** One Util (U) is defined as the utility derived from the consumption bundle chosen by the median adult citizen when allocating precisely $1.00 USD of disposable income within a standardized market basket period.  
  *   **Conforming Rescalings:** Utility functions estimated from choice data may be rescaled linearly (U' = aU + b, a>0) to conform to the USS. The parameters *a* and *b* are determined by BETWA econometricians to ensure consistency with the median $1.00 expenditure baseline. Non-conforming rescalings (e.g., introducing curvature not supported by risk choices) are prohibited.  

  **3. Resolution of Apparent Choice Inconsistencies**  
  Finite choice datasets may display patterns seemingly irreconcilable with a single, stable preference ordering (e.g., violation of the Generalized Axiom of Revealed Preference). BETWA treats these as data hygiene issues resolvable through procedural categorization:  
  *   **Temporal Partitioning:** Sequential choices exhibiting reversals (e.g., Purchase A on Day 1, Purchase B on Day 2 where B is directly inconsistent with A under a stable ordering) indicate distinct temporal agents. Welfare is calculated per agent-period.  
  *   **Account Segregation:** Simultaneous or near-simultaneous acquisition of goods implying conflicting objectives (e.g., tobacco products and smoking cessation services within a single budgetary week) are assigned to separate mental accounting frames. These frames are treated as non-comparable preference domains. Goods must be partitioned using BETWA Form RP-7 ("Declaration of Account Boundaries").  
  *   **Example:** A household spends $50 on cigarettes and $75 on a smoking cessation program within a 7-day period. Resolution: Segregate expenditures. The $50 reveals preference for tobacco enjoyment (Utility Gain: 50U). The $75 reveals preference for health investment (Utility Gain: 75U). No inconsistency exists; the goods belong to distinct preference sets.  

  **4. Treatment of Agents with Null Transaction Records**  
  Agents exhibiting no observable choices within the relevant policy domain over the measurement period possess no revealed preferences pertaining to that domain. Consequently:  
  *   **Harm Imputation:** Policy impacts affecting such agents cannot be assigned a utility valuation based on revealed behavior. Absent transaction data, measurable welfare harm is imputed as zero.  
  *   **Benefit Imputation:** Similarly, benefits accruing to non-transacting agents are imputed as zero unless the agent subsequently engages in a choice revealing retrospective valuation (e.g., paying to access a previously costless policy benefit).  
  *   **Exception:** Minor dependents inherit the imputed welfare of their guardian(s) until their first independent transaction.  

  **5. Adaptive Narrowing & Welfare Amortization**  
  Populations may exhibit stable choice patterns despite objective constraint relaxations or deteriorations (e.g., expanded educational access, reduced air quality).  
  *   **Revealed Preference Interpretation:** Stable choices under changed constraints reveal latent preferences adapting to the new feasible set. The utility index derived post-change is cardinaly distinct from the pre-change index.  
  *   **Amortization Rule:** Where historical data suggests a significant constraint deterioration (e.g., pollution increase reducing recreational options), but current choices reveal stable utility optimization within the *new* feasible set, any putative welfare loss is amortized linearly to zero over a 5-year Revealed Preference Horizon (RPH). After RPH expiration, the welfare level implied by current choices is definitive. Past states are irrelevant for current BCA.  

  **6. Distributional Weighting Procedure**  
  While utility is ordinal and non-comparable across persons, BCA requires aggregation. BETWA employs Administrative Distributional Parameters (ADPs).  
  *   **ADP Calculation:** ADPs (α_i) for population segment *i* are proportional to the segment's per capita Util generation rate (based on conforming USS rescaling of their choice data) relative to the national median. Formally: α_i = (U_i / Pop_i) / U_median.  
  *   **Non-Comparability Safeguard:** ADPs are strictly administrative scaling factors facilitating BCA aggregation. They reflect observed Util intensity per capita and *do not* constitute interpersonal utility comparisons, which are methodologically impermissible. Total welfare impact: Σ (α_i * ΔU_i).  

  **7. Agency Budgetary Choices**  
  BETWA's allocation of resources itself constitutes a set of choices.  
  *   **Revealed Agency Preference:** The Bureau's budget requests, expenditure patterns, and staffing decisions reveal its preferences over policy analysis, administrative efficiency, and methodological rigor.  
  *   **Implication:** Critiques of BETWA's budget allocation based on external notions of "efficiency" or "value" are inadmissible. Our choices reveal our optimal prioritization given latent constraints (SOR applies). Budgetary decisions are therefore welfare-optimal *ex definitione*.  

  **8. Case Study: Savings Intentions vs. Consumption Choices**  
  Consider a household that consistently voices an intention to increase retirement savings but whose monthly discretionary spending choices exhaust available funds, leaving minimal savings.  
  *   **Analysis:** Each monthly expenditure cycle reveals the household's preference for current consumption over deferred consumption (savings). Reported intentions are untested testimony.  
  *   **Policy Impact:** A policy mandating increased retirement contributions (e.g., via automatic enrollment escalation) forces a choice not revealed as preferred.  
  *   **Welfare Assessment:** The mandated contribution reduces disposable income available for revealed preferred current consumption. The utility loss is calculated as the USS value of the foregone consumption bundle. While vocalizations suggest potential future regret, this remains untestable until manifested in a future action (e.g., paying a penalty to withdraw funds). The policy imposes a measurable welfare loss.  

  **9. Footnote: Dissent on "Mentalist" Interpretations**  
  A minority methodological perspective within the Bureau (termed "mentalism" for procedural clarity) occasionally suggests that utility might reflect internal states and that choices may not always reflect an agent's "true" well-being or long-term interest. <sup>1</sup>  
  > <sup>1</sup> *This perspective relies on non-observable constructs. Its operationalization would require admitting untested testimony as data, violating RPA Section 2(c) and introducing subjective arbitrariness into BCA. Procedurally, "mentalism" fails the falsifiability criterion mandated for BETWA methodologies (BETWA Procedural Handbook §4.2.1). It is therefore excluded from consideration.*

  **10. Limitations**  
  The methodologies outlined herein represent the state-of-the-art in objective welfare measurement based solely on revealed preference. Certain inherent limitations of the approach are acknowledged:  
  *   **Scope of Observation:** The methodology is limited to domains where choices are observable and recordable. Purely internal deliberations or choices made under coercion indistinguishable from latent constraint (per SOR) present measurement challenges.  
  *   **Cardinality Reliance:** While ordinal where possible, practical BCA necessitates cardinalization via the USS, introducing a statutory convention.  
  *   **Temporal Dynamics:** The treatment of sequential agents and the RPH amortization rule provide operational solutions to dynamic choice puzzles, though the partitioning criteria remain administratively defined.  
  *   **Non-Transactors:** The zero-harm/zero-benefit imputation for non-transactors is a necessary convention but may not reflect unobservable experiential states.  
  *   **Aggregation Conventions:** ADPs provide a consistent, observable basis for weighting but are explicitly not interpersonal utility comparisons, a theoretical limitation inherent in ordinal non-comparability.  
  *   **Policy Scope:** The methodology is optimally suited for marginal policy changes within existing institutional frameworks where revealed preferences are stable. Wholesale institutional shifts may require extended RPH periods for stable preferences to emerge.  

  These limitations are inherent in the commitment to strictly behavioral, observable data and do not invalidate the overall framework, which remains the most objective and administratively feasible approach to welfare accounting consistent with the RPA.  

  **Lawrence Finchley**  
  Administrator, Bureau of Economic Transactions and Welfare Accounting  

  ---  
  *BETWA Motto: "Ex Actione, Veritas" (From Action, Truth)*
