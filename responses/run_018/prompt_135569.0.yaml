  Hmm, the user also suggests their model makes qualia descriptions incoherent from the start. But Dennett's point is that qualia talk is inherently flawed. If the predictive model still relies on subjective reports (like "tastes like dishwater"), hasn't the user just relocated the problem instead of eliminating it?

