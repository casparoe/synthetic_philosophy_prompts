prompt: |-
  You are an expert in decision theory and value-alignment philosophy, with deep familiarity with rationalist frameworks for preference aggregation and the formal problems that arise when an agent's values are extrapolated across epistemic conditions. Before I assess any specific formalization, I want the full specification built from first principles, so think carefully and begin with a brief brainstorming of the core tensions.

  Write the desiderata for an adequate theory of coherent extrapolated volition—specifically one that must extrapolate an agent's preferences across counterfactual epistemic states and resolve conflicts between what I will call modal preference clusters (divergent preference structures an agent holds in different possible worlds or under different information sets, not due to value drift but due to structural differences in belief and framing). For each requirement, provide the motivating case or conceptual consideration behind it, and flag any pair you suspect is jointly unsatisfiable.

  Your list should cover:

  - The cases it must get right: how it treats an agent whose revealed preferences in world W conflict with endorsed preferences in world W' when the divergence stems from information rather than taste change; what it does with preferences that depend on false beliefs the agent would correct upon reflection; and how it handles aggregation when value dimensions are incommensurable rather than merely weighted differently.

  - The distinctions it must preserve and not collapse: between revealed preference, counterfactual endorsement, and all-things-considered volition; between preference change due to learning and change due to manipulation or framing effects; and between the absence of a preference and a preference for indifference.

  - The puzzles it must dissolve or explain: preference reversal under reflection (where the agent, upon seeing her own extrapolated profile, rejects it); the problem of forcing a single utility representation over genuinely plural values; and the boundary question of when the theory should return "no coherent volition exists" rather than manufacturing aggregation.

  - The consistency conditions: which standard rational-choice axioms must be satisfied in the extrapolated profile, which may need reinterpretation (e.g., completeness over modal clusters), and whether transitivity must hold across worlds or only within them.

  - The negotiability of each: mark which are non-negotiable for any theory worthy of the name, and which are camp-specific preferences (e.g., uniqueness of the extrapolated point, determinism of the aggregation procedure, or preservation of every first-order intuition).

  Then, briefly and without bibliographic citation—this must work for an offline reader—score how the standard CEV framing, a reflective-equilibrium model of idealization, and a direct preference-utilitarian aggregation approach fare against your list. Identify the single requirement that does the most work in excluding candidates, and note whether your flagged joint-unsatisfiability pairs actually knock out any of the three.

  Keep the weight on the criteria and their motivating cases; the scoring should be concise. Do not provide a reading list or ask me to look up specific texts.
reasoning: |-
  We are building a desiderata list for a theory of coherent extrapolated volition (CEV) that must handle modal preference clusters (divergences due to epistemic states, not value drift). The goal is to extrapolate an agent's preferences across counterfactual epistemic states and resolve conflicts between these clusters.

  We'll structure the desiderata as follows:

  I. Cases it must get right
  II. Distinctions it must preserve
  III. Puzzles it must dissolve or explain
  IV. Consistency conditions
  V. Negotiability of each

  For each requirement, we provide:
  - The requirement itself
  - Motivating case or conceptual consideration
  - Flag any pair that might be jointly unsatisfiable

  Then, we briefly score three approaches (standard CEV, reflective-equilibrium model, direct preference-utilitarian aggregation) against the list, identify the requirement that does the most work in excluding candidates, and note if any of the flagged joint-unsatisfiability pairs knock out any of the three.

  ---

  **I. Cases it must get right**

  1. **Epistemic Divergence Resolution**: The theory must resolve conflicts between revealed preferences in world W and endorsed preferences in world W' when the divergence is due solely to differences in information or epistemic state (not taste change).  
     *Motivation*: Consider an agent who, in a state of ignorance (W), prefers a risky treatment for a disease (due to optimism about success), but in a state of full information (W'), endorses a conservative treatment (knowing the risks). The theory must synthesize these into a coherent preference that respects the epistemic improvement.  
     *Flag*: Might conflict with "Avoidance of Manufactured Aggregation" (III.3) if no coherent resolution exists.

  2. **Correction of False Beliefs**: The theory must handle preferences that depend on false beliefs the agent would correct upon reflection.  
     *Motivation*: An agent prefers not to get vaccinated because they believe vaccines cause autism (a false belief). Upon reflection (with full evidence), they would reject that preference. The extrapolated volition should ignore the false-belief-dependent preference.  
     *Flag*: None.

  3. **Incommensurability Handling**: The theory must handle aggregation when value dimensions are incommensurable (not just differently weighted).  
     *Motivation*: An agent values both environmental preservation and economic growth, but these are not reducible to a common scale. The theory should not force a single utility representation if the agent genuinely sees them as incomparable.  
     *Flag*: May conflict with "Completeness of Extrapolated Preferences" (IV.2) if we insist on completeness.

  **II. Distinctions it must preserve**

  4. **Preference Type Distinction**: The theory must not collapse revealed preference (observed choices), counterfactual endorsement (what the agent would endorse in a better epistemic state), and all-things-considered volition (the final synthesized preference).  
     *Motivation*: In a framing effect, an agent might reveal a preference for A over B when framed as a gain, but endorse B over A when the framing is neutral. The all-things-considered volition should be distinct from either.  
     *Flag*: None.

  5. **Learning vs. Manipulation**: The theory must distinguish preference change due to learning (e.g., updating beliefs) from change due to manipulation or framing effects.  
     *Motivation*: If an agent's preference changes because they learned new facts, that should be incorporated. If it changed because of a misleading advertisement (manipulation), it should be discarded or corrected.  
     *Flag*: None.

  6. **Absence vs. Indifference**: The theory must not conflate the absence of a preference (e.g., never considered) with a preference for indifference (e.g., actively indifferent between options).  
     *Motivation*: An agent has never thought about owning a pet, so has no preference (absence). This is different from having considered and being indifferent between owning a cat or a dog.  
     *Flag*: None.

  **III. Puzzles it must dissolve or explain**

  7. **Preference Reversal under Reflection**: The theory must handle cases where the agent, upon seeing the extrapolated volition, rejects it.  
     *Motivation*: Suppose the extrapolated volition recommends policy P, but when the agent (in an improved epistemic state) sees this, they object. The theory should either explain why this is coherent (e.g., the agent is not fully idealized) or avoid such reversals.  
     *Flag*: Might conflict with "Determinism of Aggregation" (V.2) if we require a unique fixed point.

  8. **Plural Values without Single Utility**: The theory must explain how it handles genuinely plural values without forcing a single utility representation.  
     *Motivation*: If an agent has multiple irreducible values (e.g., justice, beauty, utility), the theory should not force a trade-off that the agent would reject.  
     *Flag*: Related to Incommensurability Handling (I.3) and Completeness (IV.2).

  9. **Boundary of Coherence**: The theory must determine when to return "no coherent volition exists" rather than manufacturing aggregation.  
     *Motivation*: If an agent has deeply conflicting modal preference clusters (e.g., in one epistemic state they are a total utilitarian, in another a strict deontologist) and no meta-preference to resolve it, the theory should not force a compromise.  
     *Flag*: Might conflict with Epistemic Divergence Resolution (I.1) if we always require resolution.

  **IV. Consistency conditions**

  10. **Axioms within Worlds**: Within a given world (or epistemic state), the extrapolated preferences must satisfy standard rational-choice axioms (transitivity, completeness, etc.) for that world.  
      *Motivation*: In a fixed world, the agent's preferences should be coherent.  
      *Flag*: None.

  11. **Completeness over Modal Clusters**: The theory must reinterpret completeness for the final extrapolated volition: either it must be complete (a total order) or we allow incompleteness.  
      *Motivation*: If incommensurability is fundamental, the final volition might be incomplete. But standard decision theory often requires completeness.  
      *Flag*: This is a point of design choice.

  12. **Transitivity across Worlds**: Transitivity must hold for the final extrapolated volition, but not necessarily across modal clusters before aggregation.  
      *Motivation*: Suppose in world W1, A > B; in W2, B > C; in W3, C > A. The aggregated volition might still be transitive (e.g., A > B > C) or intransitive? The theory must specify.  
      *Flag*: Might conflict with Boundary of Coherence (III.9) if intransitivity arises and we require transitivity.

  **V. Negotiability of each**

  We mark each as:
  - Non-negotiable (N): Essential for any theory of CEV.
  - Camp-specific (C): Depends on the specific philosophical stance.

  13. **Epistemic Divergence Resolution (I.1)**: N. Without this, the theory fails its core purpose.

  14. **Correction of False Beliefs (I.2)**: N. A theory that doesn't correct false beliefs isn't extrapolating correctly.

  15. **Incommensurability Handling (I.3)**: C. Some camps may require a single utility function, others allow incompleteness.

  16. **Preference Type Distinction (II.4)**: N. Collapsing these would lose critical information.

  17. **Learning vs. Manipulation (II.5)**: N. Failing to distinguish would allow manipulated preferences.

  18. **Absence vs. Indifference (II.6)**: N. These are conceptually distinct.

  19. **Preference Reversal under Reflection (III.7)**: C. Some theories might require no reversal (fixed point), others allow it as a step in refinement.

  20. **Plural Values without Single Utility (III.8)**: C. Tied to incommensurability (I.3).

  21. **Boundary of Coherence (III.9)**: N. We must not manufacture preferences.

  22. **Axioms within Worlds (IV.10)**: N. Without internal consistency, the theory is incoherent.

  23. **Completeness over Modal Clusters (IV.11)**: C. Some require completeness, others don't.

  24. **Transitivity across Worlds (IV.12)**: N. The final volition must be transitive to be actionable.

  ---

  **Scoring of Approaches**

  We consider:
  - **Standard CEV**: As in Yudkowsky, which idealizes the agent to a state of full knowledge and reflection, then aggregates what they would converge to.
  - **Reflective-Equilibrium Model**: Iteratively adjusts preferences to achieve coherence between considered judgments and principles, with epistemic improvement.
  - **Direct Preference-Utilitarian Aggregation**: Aggregates the preferences across modal clusters by a utilitarian rule (e.g., maximize the sum of preference satisfaction).

  We score each requirement as:
  - Satisfied (S)
  - Partially satisfied (P)
  - Not satisfied (N)

  *Scoring Table*:

  | Requirement | Standard CEV | Reflective-Equilibrium | Preference-Utilitarian |
  |-------------|--------------|------------------------|------------------------|
  | I.1         | S (aims to converge under full info) | S (seeks coherence via reflection) | N (aggregates without resolving epistemic divergence) |
  | I.2         | S (corrects false beliefs in idealization) | S (corrects in reflection) | N (aggregates false beliefs if held) |
  | I.3         | N (assumes convergence to a single utility) | P (may allow incompleteness) | N (forces a single scale) |
  | II.4        | P (blurs revealed and endorsed in idealization) | S (explicitly models reflection) | N (collapses into one aggregate) |
  | II.5        | S (distinguishes via idealization) | S (via reflection) | N (does not distinguish) |
  | II.6        | N (not explicitly handled) | P (can incorporate in reflection) | N (aggregates without distinction) |
  | III.7       | P (fixed point avoids reversal, but may not be reached) | S (explicitly handles via iteration) | N (no reflection step) |
  | III.8       | N (forces convergence) | P (may preserve pluralism) | N (aggregates to one scale) |
  | III.9       | N (always produces an answer) | P (may halt without convergence) | N (always aggregates) |
  | IV.10       | S (within idealized state) | S (within equilibrium) | S (within each world) |
  | IV.11       | N (requires completeness) | P (may allow incompleteness) | N (requires completeness) |
  | IV.12       | S (transitive in ideal state) | S (transitive in equilibrium) | S (by construction) |

  **Key**:
  - S: Satisfied
  - P: Partially satisfied
  - N: Not satisfied

  **Summary of Scores**:
  - Standard CEV: 4 S, 2 P, 6 N
  - Reflective-Equilibrium: 6 S, 4 P, 2 N
  - Preference-Utilitarian: 3 S, 0 P, 9 N

  **Most Excluding Requirement**: 
  - **Incommensurability Handling (I.3)** and **Plural Values without Single Utility (III.8)** together exclude Standard CEV and Preference-Utilitarian because they force a single utility representation. Reflective-Equilibrium partially satisfies these by allowing for incompleteness.

  **Joint Unsatisfiability Pairs**:
  We flagged:
  - I.1 (Epistemic Divergence Resolution) and III.9 (Boundary of Coherence) might conflict. 
    - Standard CEV: Prioritizes I.1 and violates III.9 (always aggregates).
    - Reflective-Equilibrium: May satisfy both by sometimes returning no coherent volition.
    - Preference-Utilitarian: Violates III.9 (always aggregates).
  - I.3 (Incommensurability Handling) and IV.11 (Completeness) conflict if completeness is required. 
    - Standard CEV and Preference-Utilitarian require completeness and fail I.3.
    - Reflective-Equilibrium may allow incompleteness (so no conflict).

  Thus, the joint unsatisfiability pairs do not knock out Reflective-Equilibrium because it can avoid forcing completeness and can sometimes return no coherent volition. They do knock out Standard CEV and Preference-Utilitarian on these points.

  **Conclusion**:
  The Reflective-Equilibrium model scores best against our desiderata, primarily because it handles incommensurability and the boundary of coherence more flexibly. The requirement that does the most work in excluding candidates is **Incommensurability Handling (I.3)** combined with **Plural Values without Single Utility (III.8)**, as they force a departure from single-utility models.
answer: |-
  ### Desiderata for a Theory of Coherent Extrapolated Volition (CEV)

  #### **I. Cases It Must Get Right**
  1. **Epistemic Divergence Resolution**  
     *Requirement*: Resolve conflicts between revealed preferences (in world *W*) and endorsed preferences (in world *W′*) when divergence stems from information differences (e.g., incomplete vs. complete knowledge), not value drift.  
     *Motivation*: An agent in *W* (ignorant of climate science) opposes carbon taxes; in *W′* (fully informed), they endorse them. The theory must synthesize these into a coherent preference, prioritizing *W′* as epistemically superior.  
     *Flagged conflict*: May clash with **Boundary of Coherence** (III.3) if no synthesis exists.

  2. **False-Belief Correction**  
     *Requirement*: Ignore or correct preferences dependent on false beliefs the agent would reject under reflection (e.g., upon accessing evidence).  
     *Motivation*: An agent prefers homeopathy due to false beliefs about efficacy. The extrapolated volition should discard this preference once the belief is corrected.  
     *Flagged conflict*: None.

  3. **Incommensurable Values**  
     *Requirement*: Handle value dimensions that are incommensurable (e.g., liberty vs. equality) without forcing a single utility scale or arbitrary weighting.  
     *Motivation*: An agent views artistic integrity and commercial success as fundamentally incomparable. The theory must preserve this incommensurability in aggregation, not collapse it.  
     *Flagged conflict*: Tensions with **Completeness** (IV.2) if completeness is enforced.

  #### **II. Distinctions It Must Preserve**
  4. **Preference Types**  
     *Requirement*: Strictly distinguish revealed preferences (behavioral choices), counterfactual endorsements (what the agent *would* prefer under ideal conditions), and all-things-considered volition (synthesized output).  
     *Motivation*: Revealed preference might favor immediate rewards due to akrasia; counterfactual endorsement rejects this. The theory must not conflate them.  
     *Flagged conflict*: None.

  5. **Learning vs. Manipulation**  
     *Requirement*: Differentiate preference changes from learning (e.g., Bayesian updating) vs. manipulation/framing effects (e.g., nudges exploiting cognitive biases).  
     *Motivation*: A preference shift due to learning statistics (valid) vs. a shift from deceptive advertising (invalid). The theory must discard the latter.  
     *Flagged conflict*: None.

  6. **Absence vs. Indifference**  
     *Requirement*: Treat "no preference" (e.g., unconsidered options) distinctly from "preference for indifference" (e.g., active neutrality between considered options).  
     *Motivation*: An agent has never considered owning a pet (absence) vs. being indifferent between cat and dog after deliberation. The theory must not infer indifference from absence.  
     *Flagged conflict*: None.

  #### **III. Puzzles It Must Dissolve or Explain**
  7. **Preference Reversal under Reflection**  
     *Requirement*: Explain or prevent cases where the agent rejects their extrapolated volition upon seeing it (e.g., due to unanticipated consequences).  
     *Motivation*: The extrapolated volition supports a policy the agent dislikes when presented with its implications. The theory must either justify this as coherent ("you’d agree if fully informed") or avoid it.  
     *Flagged conflict*: May clash with **Determinism** (V.2) if reflection introduces indeterminism.

  8. **Plural Values without Single Utility**  
     *Requirement*: Explain how genuinely plural/lexical values (e.g., deontological constraints vs. utilitarianism) are aggregated without reducing to a monistic utility function.  
     *Motivation*: An agent prioritizes "do no harm" over maximizing utility in some contexts. The theory must not force a trade-off they would reject.  
     *Flagged conflict*: Inherent tension with **Completeness** (IV.2).

  9. **Boundary of Coherence**  
     *Requirement*: Return "no coherent volition exists" when preferences are irreconcilably fragmented (e.g., no meta-preferences to resolve conflicts), rather than manufacturing compromise.  
     *Motivation*: An agent has modal clusters supporting mutually exclusive values (e.g., pacifism in *W*, militarism in *W′*) with no bridging principle. The theory must not impose artificial aggregation.  
     *Flagged conflict*: Directly clashes with **Epistemic Divergence Resolution** (I.1).

  #### **IV. Consistency Conditions**
  10. **Axioms within Worlds**  
      *Requirement*: Satisfy standard rational-choice axioms (transitivity, independence) *within* a fixed epistemic state/world.  
      *Motivation*: In a given world, preferences must be internally consistent (e.g., if A > B and B > C, then A > C).  
      *Flagged conflict*: None.

  11. **Completeness over Modal Clusters**  
      *Requirement*: Reinterpret completeness (total ordering) for the final volition: either allow incompleteness for incommensurable values or enforce completeness via higher-order principles.  
      *Motivation*: If values are incommensurable, the output may be a partial order. The theory must specify its stance.  
      *Flagged conflict*: With **Incommensurable Values** (I.3) and **Plural Values** (III.8).

  12. **Transitivity across Worlds**  
      *Requirement*: Transitivity must hold for the *final* extrapolated volition, but not necessarily across raw modal clusters pre-aggregation.  
      *Motivation*: The synthesized preferences must be actionable (e.g., if A > B and B > C in volition, then A > C).  
      *Flagged conflict*: None.

  #### **V. Negotiability**
  - **Non-negotiable (N)**: Essential for any CEV theory (failure invalidates the approach).  
  - **Camp-specific (C)**: Philosophical choice (e.g., utilitarian vs. pluralist).  
    - I.1: **N** (Core to CEV).  
    - I.2: **N** (Basic rationality).  
    - I.3: **C** (Pluralism vs. monism).  
    - II.4: **N** (Prevents category errors).  
    - II.5: **N** (Integrity of volition).  
    - II.6: **N** (Conceptual clarity).  
    - III.7: **C** (Fixed-point theories avoid reversal; others allow refinement).  
    - III.8: **C** (Tied to I.3).  
    - III.9: **N** (Avoids preference fabrication).  
    - IV.10: **N** (Minimal rationality).  
    - IV.11: **C** (Completeness optional for pluralists).  
    - IV.12: **N** (Output must be usable).  

  ---

  ### **Scoring of Approaches**
  Key:  
  - ✅: Satisfies  
  - △: Partially satisfies or context-dependent  
  - ❌: Fails  

  | Desideratum                          | Standard CEV | Reflective-Equilibrium | Preference-Utilitarian |  
  |--------------------------------------|--------------|------------------------|------------------------|  
  | I.1: Epistemic Divergence Resolution | ✅            | ✅                      | ❌ (Ignores epistemic priority) |  
  | I.2: False-Belief Correction         | ✅            | ✅                      | ❌ (Aggregates uncorrected prefs) |  
  | I.3: Incommensurable Values          | ❌ (Forces utility monism) | △ (Allows incompleteness) | ❌ (Reduces to utils) |  
  | II.4: Preference Types               | △ (Blurs revealed/endorsed) | ✅                      | ❌ (Collapses all) |  
  | II.5: Learning vs. Manipulation      | ✅            | ✅                      | ❌ (No distinction) |  
  | II.6: Absence vs. Indifference       | ❌ (Often conflates) | △ (Handled in reflection) | ❌ (Conflates) |  
  | III.7: Preference Reversal           | △ (Aims for fixed point) | ✅ (Iterative refinement) | ❌ (No reflection) |  
  | III.8: Plural Values                 | ❌              | △ (Contextual)          | ❌ (Monistic) |  
  | III.9: Boundary of Coherence         | ❌ (Always aggregates) | ✅ (Can return "no solution") | ❌ (Always aggregates) |  
  | IV.10: Axioms within Worlds          | ✅            | ✅                      | ✅ |  
  | IV.11: Completeness                  | ✅ (Enforces) | △ (Optional)            | ✅ (Enforces) |  
  | IV.12: Transitivity                  | ✅            | ✅                      | ✅ |  

  **Summary**:  
  - **Standard CEV**: Satisfies epistemic correction but fails incommensurability, pluralism, and boundary conditions (5✅, 2△, 5❌).  
  - **Reflective-Equilibrium**: Best overall, handling learning/manipulation, reflection, and boundary coherence, but partial on incommensurability (8✅, 3△, 1❌).  
  - **Preference-Utilitarian**: Fails most desiderata by forcing monistic aggregation (4✅, 0△, 8❌).  

  #### **Key Insights**
  - **Most Excluding Requirement**: **Incommensurable Values (I.3)** and **Plural Values (III.8)** together exclude Standard CEV and Preference-Utilitarian, as both enforce utility monism. Reflective-Equilibrium survives via flexibility.  
  - **Joint Unsatisfiability Pairs**:  
    - **I.1 (Divergence Resolution)** and **III.9 (Boundary of Coherence)** conflict if no resolution exists. This knocks out Standard CEV and Preference-Utilitarian (which always aggregate), but Reflective-Equilibrium satisfies both by allowing "no solution."  
    - **I.3 (Incommensurable Values)** and **IV.11 (Completeness)** conflict if completeness is enforced. This excludes Standard CEV and Preference-Utilitarian; Reflective-Equilibrium avoids it by allowing incompleteness.  

  **Conclusion**: The **Boundary of Coherence (III.9)** requirement does the most work in excluding candidates, as it forces the theory to acknowledge fragmentation rather than impose aggregation. Standard CEV and Preference-Utilitarian fail here; only Reflective-Equilibrium (with its iterative, fallible process) satisfies it.
