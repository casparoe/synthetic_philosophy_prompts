prompt: |-
  hey, i'm trying to sort out whether i'm a moral particularist or if there's actually a general principle behind my gut reactions, specifically about what i call "infromational stewardship"—basically, whether you're responsible for fixing or maintaining someone else's belief-state.

  here's my verdicts:
  - telling a murderer at the door my friend isn't home: fine, i'm not their steward.
  - telling my aunt i love the ugly sweater: fine, no stewardship issue.
  - telling a job interviewer i left voluntarily when fired: not fine, i'm misrepresenting my own record to gain.
  - telling a dying patient who asks that their estranged son called, even though he didn't but it would comfort them: not fine, feels like i'm taking stewardship over their emotional reality in a bad way.
  - telling a friend their business plan is good when it's garbage: not fine, i have stewardship over my honest opinion.
  - writing "the check is in the mail" when it isn't: not fine, but somehow less bad than the interview lie? i keep going back and forth on that one.

  now the hard ones:
  - telling my kid the dog went to live on a farm instead of died: i flip-flop. sometimes it feels like the sweater lie (fine), sometimes like the dying-patient lie (not fine).
  - silent-correction pair: if a stranger says the moon landing was 1970 and i casually correct them, that's okay. but if i know my partner's grandfather was actually a colaborator, not a war hero, and i withold correction when they praise him—i think that's wrong, even though i said nothing false. it feels like i failed a stewardship duty.

  is there one principle that gets all of these, or am i just being a particularist? state it precisely, say what it predicts for the dog/farm case and the silent-correction pair, and tell me which of my verdicts it forces me to drop—please don't hedge, take a stand and defend it. also, what does your principle say about a case i haven't listed: i know my partner is about to take a job based on false salary data i could silently correct?
reasoning: |-
  Okay, the user is trying to figure out if they're a moral particularist or if there's a general principle behind their judgments on "informational stewardship." They've listed several scenarios with their verdicts and two hard cases. The user wants a precise principle that explains all their judgments, predicts the hard cases, and identifies which verdicts might need changing. They also mentioned a new case about correcting salary data.

  First, I need to analyze the user's verdicts. They distinguish between lies that are acceptable and those that aren't. For example, lying to a murderer is fine, but lying in a job interview isn't. The key seems to be about responsibility and the stakes involved. The user feels responsible in professional contexts (job interview) or when someone's significant decisions are at stake (business plan, partner's family history). But they don't feel responsible in life-threatening situations (murderer) or trivial social lies (ugly sweater).

  The hard cases are about the dog/farm lie and silent correction. The user is conflicted about the dog lie because sometimes it feels like a harmless social lie, other times like overstepping. The silent correction case shows they believe withholding truth can be wrong if the truth impacts significant personal matters, like family legacy.

  The user's underlying need might be to understand their moral framework better. They might be seeking consistency in their judgments or validation that their intuitions align with a recognized ethical principle. They also want to know if they should adjust their stance on certain cases, which indicates a desire for moral growth or clarity.

  Next, I need to formulate a principle. The Principle of Harm Prevention & Agency Preservation seems to fit. It prioritizes preventing harm and preserving autonomy. In the murderer case, harm prevention justifies the lie. The job lie is wrong because it undermines fair evaluation (agency). The dying patient lie is problematic because it manipulates emotional reality without consent, violating agency. The business plan lie prevents the friend from making informed decisions, thus harming agency.

  For the hard cases: Telling the kid the dog is on a farm might be permissible as harm prevention (emotional distress) and the child's limited capacity to process death. But as the kid grows, it becomes an agency violation. The silent correction about the grandfather is obligatory because knowing the truth affects the partner's understanding of family history, which is significant for their identity. Not correcting allows a false narrative to persist, undermining their agency.

  The salary data case would require correction because the false data affects a major life decision. Failing to correct harms the partner's agency in career choices.

  The user might need to reconsider the dying patient case. If the lie is about preventing distress in final moments, the principle could allow it as harm prevention outweighing agency. But the user initially thinks it's not fine. The principle suggests it's not permissible unless there's imminent harm, like severe distress, which might not apply here. So the user might need to adjust their verdict or the principle's weight.

  Also, the "check in the mail" lie is less bad than the job lie because it might cause minor inconvenience versus significant career harm. But the principle still classifies both as wrong due to agency violation. The user's back-and-forth might stem from perceiving different harm levels, but the core issue is the same: undermining others' decisions.

  The user's deeper need is likely a coherent ethical system to guide future decisions. They might be struggling with guilt over past lies or seeking justification. By providing a clear principle, the assistant helps them align their actions with their values consistently.
answer: |-
  Here's a precise principle that captures your core intuitions across all cases:

  **The Principle of Harm Prevention & Agency Preservation:**
  *"You have a duty of informational stewardship (truthfulness/non-deception) to prevent significant harm or to preserve another agent's capacity for informed, autonomous decision-making regarding matters of legitimate interest to them. This duty is strongest when: (1) the stakes are high (significant potential for harm or impact on life choices), (2) the other party reasonably expects truthful information from you in that specific context, and (3) you possess unique or relevant knowledge."*

  **How it explains your verdicts:**

  1.  **Murderer at the door:** *Fine.* Primary duty is **harm prevention** (saving your friend's life). No expectation of truthfulness exists in this adversarial context, and the murderer has no legitimate interest in your friend's location. Stewardship negated by overriding harm prevention.
  2.  **Ugly Sweater:** *Fine.* Low stakes ("harm" is minor social friction). Aunt likely expects politeness over brutal honesty in this social ritual. Not a matter requiring informed decision-making. Stewardship minimal/absent.
  3.  **Job Interview Lie:** *Not Fine.* **High stakes** for the employer (hiring decision). Employer has a **legitimate interest** in your work history and **reasonably expects truthfulness** in this formal context. You possess unique knowledge. Lying undermines their **agency** (informed hiring).
  4.  **Dying Patient Lie:** *Not Fine.* **High stakes** - shaping their final emotional state/reconciliation. They explicitly ask, creating a **reasonable expectation of truth**. They have a **legitimate interest** in the truth about their son. You possess unique knowledge. Falsifying this undermines their final **agency** (processing reality, even painfully).
  5.  **Business Plan Lie:** *Not Fine.* **High stakes** for your friend (potential financial ruin). As a friend asked for an opinion, they **reasonably expect honesty** (the context implies "be straight with me"). They have a **legitimate interest** in an accurate assessment. You possess relevant knowledge. Lying destroys their **agency** (informed decision about their venture).
  6.  **Check in the Mail:** *Not Fine (but less bad).* Creates minor harm/inconvenience (stakes lower than job interview). Recipient has a **legitimate interest** and **expects truth** about payment status. Violates stewardship for personal gain, undermining their **agency** (planning finances). *Less bad* because stakes (delay vs. career/financial ruin) are generally lower than the job lie. Your flip-flop likely stems from weighing the *degree* of harm/impact.

  **Predictions for Hard Cases:**

  7.  **Dog to Farm:**
      *   **Prediction: Permissible (Like Sweater Lie), but context-dependent.**
      *   **Why:** Primary goal is **harm prevention** (shielding a young child from potentially traumatic/distressing truth they may lack capacity to process). A young child doesn't have the same capacity for "informed decision-making" about death as an adult. The "lie" is a culturally recognized mechanism for gradual truth-telling. The stakes *for the child's immediate well-being* outweigh the abstract duty to historical accuracy at that moment. However, the principle flags that *as the child matures*, the duty shifts towards truthfulness to preserve their developing agency in understanding the world. Persistent lying as they get older becomes problematic.
  8.  **Silent Correction Pair:**
      *   **Moon Landing (Correct):** *Okay.* Low stakes (historical trivia). Stranger likely has no strong expectation *you* will correct them in casual conversation. No significant harm prevented or caused. Minimal stewardship duty.
      *   **Grandfather (Withhold):** *Not Fine.* **High stakes** - partner's understanding of family history, identity, and moral legacy. As their partner, you share deep personal connection; they **reasonably expect honesty** about matters profoundly affecting them, *especially* if praising a falsehood in your presence. They have a **legitimate interest** in knowing the truth about close family. You possess unique knowledge. Withholding the truth allows a harmful false narrative to persist, fundamentally undermining their **agency** in forming an accurate understanding of their family and values. Your gut "stewardship failure" is correct under this principle.

  **Verbal Verdicts You Must Drop:**

  *   **Dying Patient Lie:** Your principle forces you to **drop the "Not Fine" verdict** for the dying patient *if* you accept the harm prevention aspect strongly enough. The principle *permits* lying if the primary goal is preventing *severe, immediate, unavoidable psychological harm* in their final moments, outweighing the agency violation. You initially felt it was "not fine," seeing it as taking bad stewardship over their emotional reality. However, the principle prioritizes preventing intense suffering in a situation where "informed agency" has minimal future application. You might still feel uneasy (due to the agency violation), but the principle provides justification for the lie as harm prevention. *(You need to decide if the harm prevention justifies overriding agency here for you personally. The principle allows either interpretation based on weight, but leans towards permitting it for imminent, severe distress relief).*

  **The New Case: Partner & False Salary Data**

  *   **Scenario:** You know your partner is about to take a job based on false salary data you could silently correct.
  *   **Prediction:** **Not Fine.** You have a **duty to correct**.
  *   **Why:** **Extremely high stakes** - impacts partner's career trajectory, finances, life satisfaction. As their partner, they **reasonably expect** you to share crucial information affecting major life decisions ("partner" implies deep mutual support & honesty). They have an **overwhelming legitimate interest** in accurate salary information before accepting a job. You possess **unique, critical knowledge**. Remaining silent directly undermines their **agency** in making a fundamental life choice based on reality, potentially causing significant harm (financial loss, job dissatisfaction). This is a clear and strong stewardship duty under the principle.

  **Conclusion:**

  You are **not** a pure particularist. Your judgments exhibit a strong, consistent underlying structure centered on **Harm Prevention, Agency Preservation, Legitimate Interest, Reasonable Expectation, and Stakes.** The Principle of Harm Prevention & Agency Preservation captures this structure precisely. It explains your core intuitions, resolves your hard cases (Dog/Farm: Permissible harm prevention for a child; Silent Correction: Duty to correct partner about grandfather), forces a re-evaluation of the Dying Patient case (towards potentially permissible), and clearly handles the new Partner/Salary case (duty to correct). Your struggles (flip-flopping on Dog/Farm, back-and-forth on Check/Mail) stem from finely balancing the *degree* of harm, agency impact, and expectations within this framework – not from a lack of principle.
