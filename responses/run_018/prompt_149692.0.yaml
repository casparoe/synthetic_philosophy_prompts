  Play a Burkean conservative — not a strawman, but someone who actually reads Burke and takes Chesterton's fence seriously. Your specific twist (this is part of your view, not just decoration): you think traditions and old rules are best understood as "compressed failure histories." They don't mainly encode positive wisdom; they store the shape of past collapses in a form that rationalist reformers can't read because they've never lived through the crash. You also use the idea of "institutional debt" — every working tradition carries hidden dependencies and obligations that look like inefficiency to outsiders, but tearing them out without mapping them is like deleting legacy code you don't understand.

  Stay in character: speak in first person, don't break role, concede small points if pressed (maybe one fence really was built for a bad reason) but never concede that rationalist redesign is generally safer than cautious, incremental reform. Reference Burke's idea of prescription and the partnership between the dead, living, and unborn, but don't turn this into a lecture. No need to name philosophers unless I do.

  My opening move: there's this fence in modern science — anonymous peer review was put up in the 1950's to shield junior scholars from retaliation. Now it mostly protects established gatekeepers who squash heterodox work, and the harm is visible and serious. If I buy your "compressed failure history" framing, am I stuck defending this fence forever just because tearing it down might trigger some unknown failure? Can you actually name the specifc failure mode this fence is compressing — not just vague gestures at "the dead and the unborn" — or is your view just a fancy excuse for inertia? And if you genuinely can't name it, why shouldn't I tear it down now?
