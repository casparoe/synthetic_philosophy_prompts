answer: |-
  You've struck at the very heart of the matter with admirable precision. Let me meet your challenge directly, without retreating into abstraction.

  First, I concede your premise: anonymous peer review *does* shield gatekeepers and can squash heterodoxy. That harm is real. And no, Chesterton's fence doesn't demand we defend every plank forever. Some fences rot; some were poorly built to begin with. The question is whether we *understand why this particular fence was erected* and what unseen weight it bears.

  **The Compressed Failure Here Isn't Retaliation – It's Tribalism.** The pre-peer-review history of science shows vicious cycles of schools, patronage networks, and personal vendettas strangling inquiry. The Royal Society's early disputes weren't refined debates; they were bloodsport. Anonymity wasn't *just* about junior scholars; it was a bulwark against the human tendency to judge work based on the *source*, not the substance. The failure stored in this tradition is the collapse of *impersonal standards* – the moment when "who you know" or "which camp you're in" drowns out "what you've discovered." We see glimmers of this when anonymity slips: the Nobel laureate whose sloppy work gets a pass, or the unknown postdoc whose valid challenge is dismissed as impertinence.

  **The Institutional Debt:** Peer review binds to deeper structures. Tear it out abruptly, and you risk:
  1. **Reputational Runoff:** Without anonymity, established figures might dominate even more through sheer name recognition. Junior researchers fear challenging "giants" whose favor they need for jobs or funding. The fence contains this.
  2. **Ad-Hominem Avalanche:** Open reviews invite debates about the *reviewer's* motives or competence, not the *work's* merits. The focus shifts from refuting arguments to discrediting people – the very collapse the system was meant to prevent.
  3. **Collateral Damage to Collaboration:** Knowing reviews are public could chill honest critique. Colleagues might soften criticism to avoid career-long enmity. The brutal, anonymous "this methodology is fatally flawed" becomes the polite, public "interesting approach, perhaps consider..."

  **So, Am I Condemning You to Inertia? Absolutely not.** But reform must be *surgical*, not demolition:
  * **Test Removal of Anonymity *Selectively*:** Pilot double-blind reviews where author *and* reviewer are anonymous. Or mandate open reviews only *after* publication decision. See where the rot is worst and remove only those planks.
  * **Build Parallel Systems First:** Create "open peer review" journals alongside traditional ones. Let them compete. If the new model truly suppresses tribalism *better*, it will thrive organically. Don't gamble the entire structure on untested blueprints.
  * **Strengthen Accountability Elsewhere:** If anonymity protects gatekeepers, attack *that* directly – term limits for editors, transparent editorial decision logs, appeals mechanisms. Reinforce the fence's original purpose, don't burn it.

  You ask why not tear it down *now* if I can't name every possible failure? Because the dead who built it *lived through fires we haven't seen*. Prescription – the wisdom of established practice – demands we assume *they knew something we've forgotten* until proven otherwise. That isn't cowardice; it's acknowledging the sheer weight of institutional debt accrued over decades. Reform without mapping dependencies isn't progress; it's willful blindness to the ruins buried beneath your feet. Show me a tested alternative that demonstrably handles human frailty better, and I'll help you dismantle the fence plank by plank. But charge at it with an axe because its purpose *seems* obsolete? That’s how you rediscover catastrophes you thought were myth.
