prompt: |-
  I am drafting an independent research essay for my sixth-form philosophy coursework, and before I evaluate particular accounts I want to establish the standards by which any theory of coherent extrapolated volition and idealised preferences ought to be judged. Write the desiderata: specify exactly what such a theory must be able to deliver — which concrete cases it must resolve correctly, which conceptual distinctions it must respect, and which broader philosophical commitments it must remain consistent with — giving the motivating reason or counter-example behind each requirement, and explicitly flag any pair of desiderata that appear jointly unsatisfiable rather than merely difficult to reconcile. I want you to include a criterion addressing what I call inter-generational preference interference: the problem that an agent's idealised values may depend on predicting the preferences of future, cognitively modified versions of themselves whose experiential range and conceptual resources lie beyond anything the present agent can genuinely simulate, and the theory must either accommodate or rule out such dependency in a principled way. Additionally, please offer a brief assessment of how a coherence-based extrapolation model, a reflective-equilibrium framework, and an aggregationist preference-construction view fare against your list, but keep the bulk of the response on the criteria themselves rather than on scoring the contenders. Write in British English, do not include bibliographies, reading lists, or citations, and treat the task as conceptual analysis rather than literature review.
reasoning: |-
  Okay, the user is drafting an independent research essay for sixth-form philosophy coursework. They're focusing on theories of coherent extrapolated volition and idealised preferences. Their main request is to establish standards for judging such theories. I need to outline desiderata, which are criteria that any theory must meet. 

  First, the user wants concrete cases the theory must resolve correctly, conceptual distinctions it must respect, and broader philosophical commitments it must maintain. For each, I should provide a motivating reason or counter-example. They also mentioned explicitly flagging any jointly unsatisfiable desiderata.

  The user added a specific criterion called "inter-generational preference interference." This deals with how an agent's idealised values might depend on predicting future, cognitively enhanced versions of themselves that the current agent can't simulate. The theory must address this dependency in a principled way.

  Additionally, I need to briefly assess how three models fare against these criteria: coherence-based extrapolation, reflective-equilibrium framework, and aggregationist preference-construction. But the bulk should be on the criteria, not the assessment. The response must be in British English, no citations, and as conceptual analysis.

  Breaking down the desiderata:

  1. **Concrete Cases to Resolve:**
     - **Authority Preservation:** The theory must ensure that idealised preferences remain recognisably the agent's own. Counter-example: If idealisation changes preferences beyond recognition, it undermines the agent's identity. Motivating reason: To prevent alienation from one's values.
     
     - **Incoherence Resolution:** It should resolve internal conflicts in current preferences, like inconsistent desires. Example: Wanting health but also smoking. Reason: Without resolution, idealisation fails to provide coherent guidance.
     
     - **Value Progress Sensitivity:** Must account for how agents might develop better values through experience. Counter-example: A reformed addict whose idealised self might reject past harmful preferences. Reason: To reflect moral growth.
     
     - **Non-Ideal Starting Point Robustness:** Should handle flawed starting points, like biases. Example: A prejudiced person whose idealised self rejects bigotry. Reason: To avoid entrenching errors.
     
     - **Future Self Interpolation:** Address cases where current preferences are incomplete for future scenarios. Example: Deciding on retirement savings without knowing future needs. Reason: To ensure relevance over time.

  2. **Conceptual Distinctions:**
     - **Preference vs. Endorsement:** Distinguish between what an agent prefers and what they endorse upon reflection. Counter-example: Addiction where cravings conflict with reflective values. Reason: To capture higher-order evaluations.
     
     - **Idealisation vs. Alienation:** Separate idealisation from creating an entirely different entity. Counter-example: Extreme cognitive enhancement that makes the self unrecognisable. Reason: To maintain authenticity.
     
     - **Procedural vs. Substantive:** Clarify that idealisation is about the process, not imposing external values. Counter-example: Forcing altruism on a selfish agent. Reason: To respect autonomy.
     
     - **Static vs. Dynamic Extrapolation:** Differentiate one-time idealisation from ongoing development. Counter-example: A single idealisation missing later growth. Reason: To avoid premature fixation.

  3. **Broader Commitments:**
     - **Anti-Perfectionism:** Avoid imposing external ideals. Counter-example: Using the theory to enforce societal norms. Reason: To uphold individual sovereignty.
     
     - **Psychological Realism:** Ground in plausible cognitive processes. Counter-example: Requiring impossible simulations. Reason: To maintain applicability.
     
     - **Normative Power:** Give the idealised self genuine authority. Counter-example: Dismissing it as irrelevant. Reason: To justify its use in decision-making.

  4. **Inter-Generational Preference Interference:**
     - **Principle:** Address dependency on future modified selves. Options: Accommodate (with safeguards) or rule out (e.g., limit to simulable ranges). Challenges: Simulation impossibility and regress risks. Must avoid arbitrariness.

  **Flagging Jointly Unsatisfiable Desiderata:**
  - **Authority Preservation & Value Progress Sensitivity:** Might conflict if growth makes past selves unrecognisable. Need careful balancing.
  - **Psychological Realism & Future Self Interpolation:** Simulating unsimulable futures could be unrealistic versus necessary for long-term relevance.

  **Brief Assessment of Models:**
  - **Coherence-Based Extrapolation:** Good at resolving incoherence but may struggle with progress sensitivity and future simulation.
  - **Reflective-Equilibrium Framework:** Handles endorsement well but might impose external coherence standards.
  - **Aggregationist View:** Useful for combining preferences but risks neglecting authenticity and procedural elements.

  Structure the response clearly: Start with desiderata grouped by type, explain each with reason/counter-example, flag conflicts, cover inter-generational criterion, then briefly assess models. Use British English, formal but accessible.
answer: |-
  ### Desiderata for Theories of Coherent Extrapolated Volition and Idealised Preferences  
  Below are the criteria any adequate theory must satisfy, grounded in conceptual analysis. Desiderata are grouped into three categories: **concrete cases** the theory must resolve, **conceptual distinctions** it must uphold, and **broader philosophical commitments** it must honour. Each requirement includes a motivating reason or counter-example. Conflicts between desiderata are explicitly flagged. The final criterion addresses **inter-generational preference interference** as specified.  

  #### I. Concrete Cases the Theory Must Resolve Correctly  
  1. **Authority Preservation**  
     - *Requirement*: Idealised preferences must retain recognisable continuity with the agent’s actual identity and values, even after refinement.  
     - *Reason/Counter-example*: If idealisation generates preferences alien to the agent (e.g., a timid person’s "ideal self" becoming radically reckless), the theory invalidates personal autonomy. The output must still feel like *their* volition.  

  2. **Incoherence Resolution**  
     - *Requirement*: The theory must resolve internal contradictions in current preferences (e.g., simultaneously valuing health and chronic smoking).  
     - *Reason*: Unresolved incoherence renders idealisation useless for practical deliberation. A smoker who idealises a healthy self should have a clear, actionable path to reconcile these.  

  3. **Value Progress Sensitivity**  
     - *Requirement*: It must accommodate cases where agents retrospectively reject past preferences as misguided (e.g., a reformed extremist whose ideal self condemns their earlier views).  
     - *Counter-example*: A theory ignoring progress could "freeze" flawed historical preferences, denying moral growth.  

  4. **Non-Ideal Starting Point Robustness**  
     - *Requirement*: The theory must work even when initial preferences are irrational, immoral, or incomplete (e.g., a selfish person’s idealisation process).  
     - *Reason*: If idealisation requires near-perfect starting points, it becomes circular or elitist.  

  5. **Future Self Interpolation**  
     - *Requirement*: It must handle decisions where current preferences are incomplete for future contexts (e.g., choosing a pension plan without understanding elderly needs).  
     - *Reason*: Idealisation often aims to guide long-term choices; failure here undermines its practicality.  

  #### II. Conceptual Distinctions the Theory Must Respect  
  6. **Preference vs. Endorsement**  
     - *Requirement*: Distinguish between *what an agent prefers* (immediate desires) and *what they endorse* after critical reflection (e.g., craving nicotine vs. endorsing health).  
     - *Counter-example*: Conflating these lets impulsive preferences dictate idealisation, undermining its normative force.  

  7. **Idealisation vs. Alienation**  
     - *Requirement*: Separate "extrapolating" an agent’s values from "replacing" them with external ideals.  
     - *Reason*: Idealisation must refine agency, not erase it (e.g., an introvert’s ideal self shouldn’t become an extrovert unless rooted in their latent values).  

  8. **Procedural vs. Substantive Idealisation**  
     - *Requirement*: Treat idealisation as a *process* of refining preferences through rationality, not imposing substantive outcomes (e.g., demanding all agents idealise altruism).  
     - *Reason*: Imposing outcomes violates autonomy; the focus should be on cognitive conditions (e.g., full information, coherence).  

  9. **Static vs. Dynamic Extrapolation**  
     - *Requirement*: Differentiate between a "one-off" idealised self and a dynamically evolving one that accounts for ongoing preference development.  
     - *Counter-example*: A static idealisation may become outdated if the agent’s values later evolve (e.g., career ambitions shifting after parenthood).  

  #### III. Broader Philosophical Commitments  
  10. **Anti-Perfectionism**  
      - *Requirement*: Avoid smuggling external ethical ideals (e.g., utilitarianism) into the idealisation process.  
      - *Reason*: Coherent extrapolated volition aims to capture *agent-relative* values, not objective "goodness".  

  11. **Psychological Realism**  
      - *Requirement*: Ground idealisation in cognitively plausible procedures (e.g., avoid requiring omniscience).  
      - *Counter-example*: Theories demanding impossible computations (e.g., simulating infinite scenarios) are practically inert.  

  12. **Normative Power**  
      - *Requirement*: Grant idealised preferences genuine authority over current ones (e.g., an ideal self’s choice to quit smoking should override present cravings).  
      - *Reason*: Without this, idealisation cannot guide action or resolve conflicts.  

  #### IV. Special Criterion: Inter-Generational Preference Interference  
  13. **Inter-Generational Dependency Principle**  
      - *Requirement*: The theory must either (a) *accommodate* or (b) *principledly exclude* dependencies between an agent’s idealised preferences and the preferences of future, cognitively modified versions of themselves (e.g., a present human predicting the values of a post-human cyborg self).  
      - *Motivating Problem*: If future selves possess qualitatively different experiences (e.g., digital consciousness), present agents cannot simulate them meaningfully. Dependency risks:  
        - *Regress*: Future selves might themselves reference further-future selves.  
        - *Epistemic Arbitrariness*: Guessing at unsimulable preferences makes idealisation unstable.  
      - *Resolution Options*:  
        - *Accommodate*: Define constraints (e.g., dependency only permitted where future preferences are "causally continuous" with present ones).  
        - *Exclude*: Restrict idealisation to preferences simulable with current cognitive resources.  
      - *Non-Negotiable*: The theory must not remain ambiguous here—ad hoc handling invites paradoxes.  

  #### Flagged Conflicts Between Desiderata  
  - **Authority Preservation (1) vs. Value Progress Sensitivity (3)**  
    - *Conflict*: Radical value progress (e.g., rejecting one’s past identity) may make ideal preferences *feel* alien, violating (1). A theory cannot fully satisfy both if progress entails disowning past selves.  
    - *Status*: **Jointly unsatisfiable** in strong forms—requires a balanced standard (e.g., "narrative continuity" as minimal preservation).  

  - **Psychological Realism (11) vs. Future Self Interpolation (5) and Inter-Generational Dependency (13)**  
    - *Conflict*: Simulating far-future or enhanced selves (for 5/13) may exceed plausible cognition (violating 11).  
    - *Status*: **Difficult but reconcilable**—e.g., via proxy concepts (e.g., "value kernels") or gradual extrapolation.  

  #### Brief Comparative Assessment of Model Types  
  - **Coherence-Based Extrapolation** (e.g., coherence over logical/modal constraints): Excels at *incoherence resolution (2)* and *procedural distinction (8)* but struggles with *value progress sensitivity (3)* (coherence may conserve past errors) and *inter-generational dependency (13)* (unsimulable futures break coherence checks).  
  - **Reflective-Equilibrium Framework** (e.g., balancing intuitions and principles): Strong on *endorsement distinction (6)* and *non-ideal robustness (4)*, yet risks *perfectionism (10)* if "equilibrium" imports external norms. Weak on *future interpolation (5)* due to presentist bias.  
  - **Aggregationist Preference-Construction** (e.g., compiling preferences across possible selves): Handles *dynamic extrapolation (9)* and *future selves (5)* robustly but may violate *authority preservation (1)* (aggregated selves could dilute identity) and *anti-perfectionism (10)* (if aggregation weights are arbitrary).  

  This framework prioritises internal rigour over external validation. By satisfying these desiderata, a theory demonstrates fidelity to the concept of volitional idealisation while avoiding incoherence or irrelevance.
