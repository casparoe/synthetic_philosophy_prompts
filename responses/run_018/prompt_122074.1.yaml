prompt: |-
  Please restate Kant's absolute prohibition on lying — including his refusal to lie to a murderer at the door in order to protect an innocent person — using only the vocabulary of mechanism design without monetary transfers: credible commitment, cheap talk, verifiable versus unverifiable messages, equilibrium refinement in coordination games, and reputation costs in repeated interaction. Treat his claim that falsehood corrupts a universal practice of truthful communication as a claim about a meta-game equilibrium governing language-use, rather than as a claim about a single encounter. Cast the murderer-at-the-door case as a one-shot interaction with asymmetric information, in which sending a false message is cheap talk that might destabilise the broader equilibrium. Be precise about the mapping between Kant's moral reasoning and these formal concepts. Then provide a residue report: which elements translate cleanly; which must be distorted, such as treating the categorical imperative as an equilibrium-selection rule; and which have no counterpart at all, for instance any notion of duty that is independent of outcomes or equilibrium effects. Finally, judge whether the residue reveals that mechanism design is missing a normative dimension, or that Kant's argument relies on premises that do not survive formalisation. Write in British English, in no more than 350 words, across at most three paragraphs. Do not include citations, references, or a reading list.
reasoning: |-
  Hmm, this is a fascinating request to translate Kant's moral philosophy into mechanism design terms. The user wants a precise mapping between Kant's absolute prohibition on lying and game-theoretic concepts like credible commitment and cheap talk, while explicitly avoiding monetary transfers. They're clearly well-versed in both moral philosophy and economic theory - probably an academic or advanced student testing conceptual boundaries.

  The core challenge is reconciling Kant's deontology with mechanism design's consequentialist framework. I need to carefully distinguish where concepts map cleanly (like truthfulness as coordination equilibrium) versus where they distort (treating categorical imperative as mere equilibrium selection). The murderer-at-door example becomes particularly tricky - Kant sees it as a categorical duty breach, while mechanism design would view it as a cheap talk message potentially destabilising language meta-games.

  For the residue analysis, I should highlight three gaps: 1) Kant's duty-outcome independence has no counterpart in mechanism design's outcome-focused framework 2) The existential weight Kant gives to truthfulness (as constitutive of rationality) gets reduced to reputation costs 3) Mechanism design has no equivalent for Kant's view that lying corrupts the liar's moral character beyond strategic consequences.

  The concluding judgment needs to be balanced. While mechanism design exposes Kant's neglect of strategic contexts (like when lying might preserve truth-telling equilibria), it also reveals its own normative poverty - unable to capture why we might value truth intrinsically rather than instrumentally. The exercise proves productive for both frameworks: Kant gains analytical precision while mechanism design confronts its value-theoretic limitations.

  Word count discipline is crucial here. I'll structure it as: 1) Restatement using mechanism design terms 2) Residue report on distortions and gaps 3) Final judgment on normative dimensions. British English phrasing like "destabilise" and "practise" will keep it consistent.
answer: |-
  Kant's prohibition on lying constitutes a *credible commitment* to truth-telling, functioning as a necessary *equilibrium refinement* in the *meta-game* governing linguistic communication. This universal rule ensures that messages are treated as *verifiable* by default, stabilising coordination by preventing *cheap talk* (non-binding messages) from undermining the shared understanding essential for meaningful interaction. The murderer-at-the-door scenario is a one-shot interaction with *asymmetric information* (the homeowner knows the victim's location, the murderer does not). Sending a false message (lying) is cheap talk. While potentially locally beneficial, Kant argues this deviation destabilises the broader meta-equilibrium where truthfulness is focal. *Reputation costs* in repeated interaction (society) arise not primarily from individual punishment, but from the erosion of trust when the universal rule is violated, making communication unreliable.

  The residue report reveals significant distortions and gaps. The mapping works cleanly for framing truthfulness as a coordination equilibrium whose stability relies on universal adherence. Kant's concern about destabilising linguistic practise translates well to the meta-game equilibrium concept. However, treating the categorical imperative purely as an *equilibrium-selection rule* distorts its nature: Kant presents it as a rational *a priori* mandate, not a strategic choice based on stability. Crucially, no mechanism design concept captures Kant's core notion of *duty* independent of outcomes or equilibrium effects. The absolute prohibition stems from the intrinsic wrongness of undermining rationality itself, not calculated reputation costs or stability preservation. The idea that lying corrupts the liar's moral capacity has no strategic counterpart.

  This residue confirms mechanism design lacks Kant's *normative dimension*. It reduces moral obligation to strategic rationality and equilibrium stability, omitting the deontological core: duty binds irrespective of consequences or coordination failure. Conversely, formalisation exposes Kant's argument as relying on premises—like the intrinsic, non-instrumental value of truthful communication as constitutive of rationality—that are exogenous to strategic interaction and ungrounded in mechanism design's outcome-oriented framework. The frameworks operate on fundamentally different axiomatic bases.
