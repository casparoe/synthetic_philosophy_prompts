prompt: |-
  In my philosophy of politics reading group, two members have been deadlocked over the democratic boundary problem, and I am reporting their exchange as a bystander without taking sides. I want a point-by-point adjudication of the arguments as they actually unfolded, plus a diagnosis of where they are talking past each other and what both are missing.

  One member, Mara, began by defending an all-affected-interests principle: anyone whose important interests are significantly shaped by a collective decision should have democratic standing with respect to it. The other, Leo, objected that this renders the demos unworkably expansive—if a nation sets a carbon tax that influences global climate patterns, does every affected person on Earth acquire a vote? Mara conceded that binary affectedness fails here, but proposed replacing it with a graded criterion she called sustained structural exposure: you belong to the demos for a given decision domain only if you live within the institutional reach of its implementation over time, not merely if you suffer diffuse ripple effects. Leo granted that this blocks over-inclusion, but charged that it smuggles in the very boundary it claims to justify—“institutional reach” is delimited by jurisdictional borders, and those borders presuppose a prior demos that authorized them, so the criterion is circular. Mara replied that jurisdictional reach can be defined functionally—say, by the enforcement capacity of a watershed authority or a labor-regulatory body—without requiring prior democratic authorization of the border itself, so no vicious circularity arises. Leo then pivoted to an all-subjected principle: democratic membership should track coercive legal subjection, which yields determinate boundaries (those bound by enforceable law) and avoids arbitrary grading altogether. Mara countered that this excludes precisely the groups most in need of democratic protection—future generations, undocumented residents subject to severe informal coercion, and cross-border communities affected by upstream extraction—while including transient visitors who happen to be present when a law is enforced. Leo responded that these are manageable supplements: you retain the core subjection principle for membership and add stakeholder mechanisms for affected non-members, without dissolving democratic accountability into cosmopolitan vagueness. At this point the argument stalled. Mara accused Leo of treating democracy as a membership club for the legally included rather than as a check on power over lives; Leo accused Mara of dissolving decision procedures into an unbounded affectedness that makes collective choice impossible. They seem partly right, but I cannot tell where the clash is substantive versus terminological.

  Please adjudicate specifically: Is Mara’s sustained structural exposure criterion genuinely non-circular, or does Leo’s circularity charge hold once we distinguish functional enforcement reach from democratically authorized borders? Is Leo correct that Mara’s view risks dissolving accountability, and is Mara correct that Leo’s view arbitrarily excludes vulnerable non-subjected groups? What distinction—perhaps between constitutive and regulative boundaries, or between domain-specific and domain-transcendent membership—might repair the disagreement? Give a verdict on which precise claims stand, which collapse, and what each party is failing to see that would allow them to concede ground without abandoning their core concern.
reasoning: |-
  Hmm, the user is running a philosophy of politics reading group where two members, Mara and Leo, are deadlocked over the democratic boundary problem. As a bystander, they want me to adjudicate the exchange point-by-point and diagnose where the debaters are talking past each other. This requires careful analysis of each argument's validity and identifying unexamined assumptions.

  Mara advocates for an "all-affected-interests" principle but modifies it to "sustained structural exposure" to avoid over-inclusion problems like global voting on carbon taxes. Leo challenges this as circular because "institutional reach" relies on pre-existing jurisdictional borders. When Mara counters that functional enforcement bodies (like watershed authorities) avoid this circularity, Leo pivots to an "all-subjected" principle emphasizing coercive legal subjection. Mara then argues this excludes vulnerable groups like future generations or undocumented residents, while Leo proposes supplementary stakeholder mechanisms instead of modifying the core principle.

  The core tension appears between two legitimate concerns: Mara's focus on power-checking (democracy as protection for the affected) versus Leo's focus on agency-preservation (democracy as collective self-rule). Their criteria serve different functions - Mara's identifies who needs voice, Leo's defines who can practically deliberate. This functional distinction is crucial but unacknowledged in their debate.

  Regarding circularity: Leo's charge holds when discussing constitutional boundaries (e.g., national borders), but not for domain-specific regulatory bodies like watershed authorities. Both overlook that some boundaries are democratically constituted while others are functionally delineated. The exclusion/inclusion dilemma reveals another missed distinction: Leo's principle properly handles coercive legal systems but requires supplementation for structural power imbalances affecting non-subjects, while Mara correctly identifies these gaps but underestimates how her criterion's vagueness threatens institutional stability.

  To resolve this, we need to separate constitutive boundaries (which require prior democratic authorization, as Leo insists) from regulative boundaries (which can be functional, as Mara proposes). Additionally, distinguishing between domain-specific and comprehensive membership would help - one can have watershed-level participation without national voting rights. Mara should concede that constitutive borders need prior authorization, while Leo should acknowledge that regulative boundaries allow functional definitions. Both need to recognize that no single principle suffices - democratic systems require layered memberships and supplementary voice mechanisms.
answer: |-
  Here’s a point-by-point adjudication of Mara and Leo’s exchange, diagnosing where they talk past each other and what both miss, followed by a resolution path:

  ### **Adjudication of Arguments**
  1. **Mara’s Initial Claim (All-Affected-Interests)**  
     - *Strength*: Correctly identifies democracy’s purpose: protecting those impacted by power.  
     - *Weakness*: Leo rightly notes the over-inclusion problem (e.g., global votes on carbon taxes). Binary affectedness *is* unworkable.  
     - **Verdict**: Leo’s objection **stands**; Mara’s initial formulation collapses.

  2. **Mara’s Revised Criterion (Sustained Structural Exposure)**  
     - *Mara’s Defense*: "Institutional reach" (e.g., watershed authorities) is defined by functional enforcement capacity, not prior borders.  
     - *Leo’s Circularity Charge*: Jurisdictional borders (even functional ones) presuppose authority created by *some* prior demos.  
     - **Adjudication**:  
       - Leo’s charge **partially holds** for *constitutive boundaries* (e.g., a state’s founding territory) but **fails** for *regulative boundaries* (e.g., a river commission’s domain).  
       - Example: A watershed authority’s jurisdiction can be drawn hydrologically (non-circularly), but its *authority to enforce* relies on higher-level democratic consent (potentially circular).  
       - **Verdict**: Mara’s criterion **avoids circularity for domain-specific decisions** but not for foundational political borders. Leo misses this distinction.

  3. **Leo’s Alternative (All-Subjected Principle)**  
     - *Strength*: Provides clear boundaries (those under enforceable law) and preserves collective agency.  
     - *Mara’s Exclusion Charge*: Correctly notes it omits future generations, undocumented residents (subject to informal coercion), and cross-border communities.  
     - **Adjudication**:  
       - Leo’s principle **arbitrarily excludes vulnerable groups** facing *de facto* coercion (e.g., undocumented migrants policed extrajudicially).  
       - His "supplements" (stakeholder mechanisms) **concede the flaw** but fail to explain why subjectedness is the *core* criterion.  
       - **Verdict**: Mara’s criticism **stands**; Leo’s view is procedurally tidy but normatively inadequate for structural power imbalances.

  4. **Mutual Accusations**  
     - *Leo’s "Dissolved Accountability" Charge*: Valid against Mara’s *initial* affectedness principle, but her revised criterion (structural exposure) mitigates this by focusing on institutional reach.  
     - *Mara’s "Membership Club" Charge*: Valid against Leo’s strict subjection principle, which prioritizes legal insiders over materially impacted outsiders.  

  ---

  ### **Diagnosis: Where They Talk Past Each Other**  
  - **Core Conflict**:  
    - Mara sees democracy as a **tool to check power** (focus: *who is vulnerable*).  
    - Leo sees democracy as a **system of collective agency** (focus: *who can feasibly deliberate*).  
  - **Terminological vs. Substantive**:  
    - Their clash is **substantive** but amplified by unshared definitions:  
      - Mara’s "structural exposure" is treated by Leo as equivalent to "affectedness," though it’s narrower.  
      - Leo’s "subjection" conflates *formal legal coercion* with *structural coercion* (e.g., climate impacts).  
  - **What Both Miss**:  
    1. **Dual Boundaries**:  
       - **Constitutive boundaries** (e.g., national borders) require prior democratic authorization (Leo’s point).  
       - **Regulative boundaries** (e.g., policy domains) can be functional (Mara’s point).  
    2. **Layered Membership**:  
       - Domain-specific demoi (e.g., voting in a watershed council) can exist without implying universal citizenship.  
    3. **Power vs. Agency Trade-off**:  
       - Mara undervalues institutional stability; Leo undervalues structural vulnerability.  

  ---

  ### **Resolution Path: Constitutive vs. Regulative Boundaries**  
  - **Constitutive Boundaries** (Leo’s Priority):  
    - The foundational demos must authorize the *meta-rules* for drawing borders (resolving circularity).  
    - *Example*: A constitutional convention defines how domains (e.g., environmental policy) are bounded.  
  - **Regulative Boundaries** (Mara’s Priority):  
    - Within constitutively authorized domains, functional criteria (e.g., watershed residency) determine *participation rights*.  
    - *Example*: Only those in a floodplain vote on levee taxes, but the *authority* to create such districts is nationally ratified.  

  - **Where Both Can Concede Ground**:  
    - **Mara** should accept that constitutive borders require democratic authorization (avoiding circularity).  
    - **Leo** should accept that domain-specific exposure justifies *voice* (e.g., non-citizen residents voting locally).  
    - **Shared Solution**: Differentiate **comprehensive membership** (national citizenship) from **stakeholder standing** (domain-specific participation).  

  ### **Final Verdict**  
  | **Claim**                          | **Stands/Collapses** | **Reason**                                                                 |
  |------------------------------------|----------------------|----------------------------------------------------------------------------|
  | Mara’s structural exposure (domain-specific) | **Stands**           | Non-circular for regulative boundaries; answers over-inclusion.            |
  | Leo’s circularity charge (constitutive) | **Stands**           | Foundational borders require prior authorization.                          |
  | Leo’s subjection principle         | **Collapses**        | Excludes the vulnerably unsubjected; supplements are ad hoc.               |
  | Mara’s exclusion critique          | **Stands**           | Subjection ignores structural coercion.                                    |
  | Leo’s accountability risk          | **Stands**           | Affectedness *alone* dissolves agency, but Mara’s revision mitigates this. |

  **Synthesis**: Democracy requires **constitutively authorized boundaries** (Leo’s insight) to enable collective action, but within them, **regulative inclusion** based on sustained exposure (Mara’s insight) ensures protection against power. The demos is not monolithic but nested: future generations need representation via trusteeship; undocumented residents need local voice; cross-border communities need transnational forums. Reframing the conflict as one of *scale* and *domain*—not a binary choice—allows both core concerns (agency and vulnerability) to coexist.
