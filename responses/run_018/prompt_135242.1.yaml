  Here is the villanelle, crafted to your specifications:

  **The Crustacean Calculus**

  We built the tanks for creatures of the chain,  
  Where signals flare but meanings stay unclear.  
  **The ganglia fire, but no self receives it.**  

  Is it reflex, or a spark of pain?  
  A million bodies packed within the sear,  
  We built the tanks for creatures of the chain.  

  The stunned leg twitches on the sorting plane –  
  Distress, or just dead circuits disappearing?  
  **The ganglia fire, but no self receives it.**  

  We scan for signs, but answers we abstain;  
  The suffering we seek may not cohere.  
  We built the tanks for creatures of the chain.  

  "Sentience solved!" the hopeful voice proclaims,  
  "Now better stuns will soothe the billion fears!"  
  **The ganglia fire, but no self receives it.**  

  **We weigh the harvest in tonnes, not in ones.**  
  Can "pain" apply where consciousness appears  
  Scattered like sand, not focused like the sun's?  
  **The ganglia fire, but no self receives it.**  
  **We weigh the harvest in tonnes, not in ones.**  

  ---

  **Notes on Scientific Accuracy & Interpretation:**

  *   **Confidence Level: Medium-High on core claims, Lower on interpretation.** The poem accurately reflects the central neurobiological fact: decapods (shrimp, crabs, lobsters) possess a distributed nervous system of ganglia, not a single centralized brain like mammals. The scale problem in aquaculture welfare is also well-documented.
  *   **Least Confident Point / Biggest Liberty:** The interpretation that "no self receives it" implies *no capacity for integrated subjective experience or suffering whatsoever*. This is the core of the philosophical and scientific debate.
      *   **The Contested Interpretation:** While the ganglia *are* distributed, research suggests varying degrees of integration and complex processing occur across the chain. Some prominent scientists argue this integration *is* sufficient for some form of unified subjective experience (sentience) and the capacity to suffer. Others argue the distributed nature precludes a unified "self" and therefore true suffering as we understand it, potentially limiting it to nociception (detection without negative feeling).
      *   **Liberty Taken:** The poem leans heavily into the "no unified self, therefore potentially no subjective receiver of suffering" interpretation ("no self receives it"). This is a valid and significant viewpoint within the debate, often associated with arguments against attributing human-like suffering, but it is **not the universally accepted conclusion**. The poem presents this specific neurobiological interpretation as the primary hurdle, which is a deliberate framing choice to highlight the ontological dilemma you described.
  *   **Other Points:** The poem doesn't claim ganglia *can't* generate suffering, only that the distributed structure makes attributing a unified subjective experience ("a self") to receive that suffering highly problematic. The industrial scale rendering individual welfare assessment nearly impossible is uncontested. The "optimistic" view (better stunning solves it) encountering the neurobiological ambiguity is accurately depicted as the central unresolved tension.

  The poem aims to be scientifically *plausible* (reflecting a major strand of thought) while using poetic language to crystallize the ethical and philosophical deadlock inherent in applying welfare concepts to animals with such fundamentally different neurobiology, especially at industrial scales. A welfare scientist might quibble with the definitive phrasing of "no self," but they would recognize the core scientific facts and the genuine dilemma it represents.
