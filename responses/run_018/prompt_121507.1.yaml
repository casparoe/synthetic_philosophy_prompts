reasoning: |-
  We are designing a 90-minute workshop for literary fiction writers and a playwright on the intentional stance, using a character from the user's manuscript named Mira. The goal is to show that attributing beliefs to Mira (an AI system) is an explanatory strategy with conditions of success and failure, without settling whether she "really" believes.

  Key elements:

  1. **Conceptual Layers**: We must build up to the intentional stance by first introducing the physical stance and the design stance. Why? Because the intentional stance is a level of abstraction above these, and understanding the progression helps avoid confusion.

  2. **Carrying Example: Mira** 
     - Must possess: Predictive success about character behavior across contradictory inputs (this shows the success condition of the intentional stance).
     - Must lack: Phenomenal consciousness and biological embodiment (to show that these are not necessary for belief attribution in the intentional stance).

  3. **Misconceptions to Address** (with interception points and defusing distinctions):
     a. Attributing beliefs requires detecting an inner mental image.
     b. The intentional stance is merely a useful fiction with no explanatory weight.
     c. Absence of consciousness entails absence of all mental-state attribution.
     d. Large language models must be either full persons or mere stochastic parrots.

  4. **Check for Understanding**: An exercise (e.g., Mira makes a systematically false prediction) to see if they grasp the intentional stance as a predictive tool with conditions of failure.

  5. **Omitted Material**: We leave out eliminative materialism, causal exclusion, neuroscience of predictive processing, etc., to keep the session focused and avoid dependency tangles.

  **Teaching Sequence Plan (90 minutes):**

  **I. Introduction (15 mins)**
     - Set the stage: Why do we talk about AI as if it had beliefs? (e.g., "ChatGPT thinks that...")
     - Present the goal: To explore the "intentional stance" as a tool for explanation and prediction, without getting stuck on whether AI is conscious.

  **II. Three Stances (30 mins)**
     - **Physical Stance (10 mins)**: Explain that we can describe systems in terms of physical properties (e.g., the hardware of a computer, the neurons in a brain). Prediction is based on physical laws. Example: Predicting a clock's behavior by its gears and springs.
     - **Design Stance (10 mins)**: Describe systems in terms of their design and function. Prediction based on what the system is made to do. Example: Predicting a clock's behavior by knowing it's designed to tell time (even if a gear is broken, we expect it to fail at time-telling). 
     - **Intentional Stance (10 mins)**: Describe systems as rational agents with beliefs, desires, and intentions. Prediction based on attributing mental states and assuming rationality. Example: Predicting a chess-playing computer by assuming it wants to win and believes certain moves are good. 
     - **Why the progression?**: The intentional stance is a higher level of abstraction. We use it when the system's behavior is complex enough that the physical or design stance is impractical, and when the system is designed (or evolved) to be rational.

  **III. Introducing Mira as the Carrying Example (20 mins)**
     - Describe Mira: A retrieval-augmented narrative engine that revises its internal world-model when contradicted by source texts and achieves high predictive success about character behavior even across contradictory inputs.
     - Emphasize:
          - What she possesses: Predictive success (this makes the intentional stance work for her).
          - What she lacks: No phenomenal consciousness, no biological body (so we are not claiming she is conscious).
     - Use Mira to show the intentional stance in action: We attribute beliefs to Mira to predict her narrative outputs. When she revises her world-model, we say she "changes her beliefs". This is an explanatory strategy that works because of her predictive success.

  **IV. Addressing Misconceptions (15 mins)**
     We will intercept these as they naturally arise during the explanation of the intentional stance and Mira. But we structure the presentation to preempt them:

     a. **Misconception**: Attributing beliefs requires an inner mental image.
        - **Intercept Point**: When introducing the intentional stance (right after defining it).
        - **Defusing Distinction**: Belief attribution is about patterns in behavior, not about having a mental picture. Use an example: We attribute beliefs to a thermostat when we say it "thinks the room is too cold" (even though it has no images), because it behaves as if it has that belief.

     b. **Misconception**: The intentional stance is merely a useful fiction with no explanatory weight.
        - **Intercept Point**: After demonstrating Mira's predictive success.
        - **Defusing Distinction**: The stance is not a fiction but an abstraction that captures real patterns. If it consistently predicts behavior, it has explanatory power. Compare to design stance: We don't say a clock's purpose is a fiction just because it's abstract.

     c. **Misconception**: Absence of consciousness entails absence of all mental-state attribution.
        - **Intercept Point**: When highlighting what Mira lacks (after introducing her).
        - **Defusing Distinction**: The intentional stance does not require consciousness. We can attribute beliefs to non-conscious systems (like Mira) if they behave rationally. Consciousness is about subjective experience; belief attribution is about pattern recognition.

     d. **Misconception**: Large language models must be either full persons or mere stochastic parrots.
        - **Intercept Point**: During the Q&A or when discussing the boundaries of the intentional stance for AI.
        - **Defusing Distinction**: The intentional stance allows for an intermediate category: systems that are not persons but can be usefully treated as having beliefs for prediction. Mira is an example: she's not a parrot because she revises her world-model and achieves predictive success.

  **V. Check for Understanding (10 mins)**
     - **Exercise**: Present a scenario: Mira predicts that a character, based on contradictory inputs, will act altruistically. But in reality, the character consistently acts selfishly. Ask: "Does this failure mean we should stop using the intentional stance for Mira? Why or why not?"
     - **Failure Pattern**: If they say, "Yes, because Mira doesn't really understand," they are falling back on the need for inner experience. Or if they say, "No, because it's just a metaphor," they are treating the stance as a fiction. The right answer: We should reevaluate the stance for this domain because the conditions for success (predictive accuracy) are failing. It might be that the intentional stance needs adjustment (e.g., we attributed wrong beliefs) or that we need to drop to a lower stance (design or physical) for this aspect.

  **VI. Conclusion and Boundaries (omitted material) (5 mins)**
     - We are leaving out:
          - Eliminative materialism (the view that beliefs don't exist) because it would require a deeper dive into metaphysics and might derail the pragmatic focus.
          - Causal exclusion arguments (about whether mental states can cause anything) because it introduces complex philosophy of mind issues beyond our scope.
          - Neuroscience of hierarchical predictive processing (even though Mira uses prediction) because it's a mechanistic explanation that operates at a different level.
     - Why omit? To maintain focus on the stance as a tool. These topics are important but would require building more foundations, which we don't have time for.

