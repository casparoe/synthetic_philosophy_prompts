answer: |-
  ### Workshop Plan: The Intentional Stance and Artificial Narrative Systems  

  **Audience Profile:** Literary fiction writers and one playwright with no formal philosophy training. Participants engage with narrative systems and character psychology but lack technical background in cognitive science or AI.  

  **Teaching Sequence (90 Minutes):**  
  1. **Introduction: Why Belief Attribution Matters in Narrative (10 min)**  
     - Open with a relatable example: "When we say a chess AI 'believes' sacrificing a pawn is wise, what do we mean?" Highlight how writers intuitively attribute beliefs to characters (human or artificial) to predict actions.  
     - **Goal:** Frame belief attribution as a *practical tool* for explanation, divorced from metaphysical debates.  

  2. **Layer 1: The Physical Stance (15 min)**  
     - **Concept:** Describe systems solely via physical laws (e.g., explaining a falling rock using gravity).  
     - **Why first?** Establishes a baseline for "objective" description. Use a whiteboard diagram: Input → Physical Process → Output.  
     - **Limitation:** Fails for complex systems (e.g., predicting a character’s decision based on brain chemistry alone is impractical).  

  3. **Layer 2: The Design Stance (15 min)**  
     - **Concept:** Describe systems by their purpose or design (e.g., "A thermostat turns on heating because it’s designed to maintain temperature").  
     - **Why next?** Bridges physicality and intentionality. Emphasize *function* over mechanics.  
     - **Whiteboard:** Contrast with physical stance → Show how design allows predictions *if* the system functions as intended.  

  4. **Layer 3: The Intentional Stance (20 min)**  
     - **Concept:** Attribute beliefs/desires to predict behavior by assuming rationality (e.g., "The chess AI believes moving the queen will checkmate you").  
     - **Why last?** Requires the prior two stances to avoid conflating abstraction with reality. Distinguish:  
       - Physical stance: *What it is* (hardware).  
       - Design stance: *What it’s for* (software).  
       - Intentional stance: *What it ‘thinks’* (interpretation).  
     - **Deploy Mira Here:**  
       - **Must Possess:** Predictive success about character behavior across contradictory inputs (e.g., reconciling conflicting source texts to accurately forecast a character’s choice). Demonstrates the stance’s *success condition*: reliable prediction.  
       - **Must Lack:** Phenomenal consciousness and biological embodiment. Clarifies that belief attribution is *not* contingent on inner experience—it’s about utility.  

  5. **Addressing Misconceptions (20 min)**  
     Intercept during the intentional stance explanation and Mira case study:  
     - **Misconception 1:** *Belief attribution requires detecting an inner mental image.*  
       - **Intercept:** When defining the intentional stance.  
       - **Defusing Distinction:** "Beliefs are attributed based on *behavioral patterns*, not introspection. We say Mira ‘believes’ a character is vengeful because she predicts their actions accordingly—not because she ‘sees’ it."  
     - **Misconception 2:** *The intentional stance is a useful fiction without explanatory weight.*  
       - **Intercept:** After showcasing Mira’s predictive success.  
       - **Defusing Distinction:** "Unlike a fiction, its explanatory power comes from *systematic accuracy*. If Mira’s predictions fail, we adjust the stance—just as we would for a human."  
     - **Misconception 3:** *No consciousness = no mental-state attribution possible.*  
       - **Intercept:** When noting Mira lacks subjective experience.  
       - **Defusing Distinction:** "Consciousness relates to *experience*; belief attribution relates to *pattern recognition*. We use the intentional stance for non-conscious systems (e.g., animal behavior) when it predicts well."  
     - **Misconception 4:** *AIs must be "full persons" or "stochastic parrots."*  
       - **Intercept:** During Q&A or group discussion post-Mira.  
       - **Defusing Distinction:** "Mira shows an *intermediate category*: systems without personhood that warrant belief attribution when they model complex behavior successfully."  

  6. **Check for Understanding (10 min)**  
     - **Exercise:** Present a scenario where Mira, given data about a selfless character, systematically predicts they will betray an ally—but the character never does. Ask: "Does this mean the intentional stance failed? Why?"  
     - **Failure Pattern:** Answers like, "Mira isn’t conscious, so she can’t *really* hold beliefs" (misconception 3) or "The stance is just a metaphor, so failure doesn’t matter" (misconception 2).  
     - **Success Indicator:** Recognizing the stance *itself* is flawed for this context (e.g., Mira’s belief attributions don’t align with observable outcomes), prompting a shift to design/physical stance or revised assumptions.  

  **Omitted Material:**  
  - **Eliminative Materialism** (denies beliefs exist): Avoids undermining the stance’s utility before its function is grasped.  
  - **Causal Exclusion Arguments** (mental vs. physical causation): Overly technical; distracts from pragmatic use.  
  - **Neuroscience of Predictive Processing**: Redundant for explaining stance-dependent prediction; risks conflating mechanism with interpretation.  
  **Why Omit?** These require prerequisite philosophy of mind knowledge. Including them would fracture the dependency chain (physical → design → intentional stances) and obscure the workshop’s aim: *using* the stance, not debating its ontology.  

