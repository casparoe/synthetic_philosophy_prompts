answer: |-
  Here's a taxonomy tree mapping the "Is History Locked In?" debate, designed for a grad seminar handout. Key elements: concrete cases, awkward commitments, branch integrity checks, and one niche concept (`Counterfactual Fragility Index`).

  **ROOT QUESTION:** If we replayed history's tape with one small change (e.g., **Battle of Actium lost by Octavian**, or **no rich coal seams in Britain**), would macro-outcomes (industrial capitalism, liberal democracy) still emerge?

  ---

  ### BRANCH 1: YES (Convergence / Structural Attractors)
  *Core belief: History converges on key outcomes due to underlying forces.*  
  **Split by mechanism of convergence:**

  1.  **Geographic/Environmental Determinism**  
      *   **Name:** Diamond-esque Constraints (after Jared Diamond)  
      *   **Case:** Industrialization *requires* accessible fossil fuels → No British coal = delayed/relocated industrialization, but it *must* emerge where geography allows.  
      *   **Awkward Commitment:** Humans are passive agents; geography dictates institutional & economic paths (e.g., "Europe wins because of its coastline").  
      *   **Separates from neighbors?** YES. Unlike functionalism, geography is *materially* constraining, not just selecting efficient forms.

  2.  **Functional Selection on Institutions**  
      *   **Name:** Institutional Darwinism (North/Wallis/Weingast-esque)  
      *   **Case:** Markets, states, and property rights evolve *because* they solve coordination problems efficiently → Even without Glorious Revolution, *some* form of "open access order" emerges to enable growth.  
      *   **Awkward Commitment:** Assumes a universal "fitness function" (e.g., economic growth) that all societies inevitably optimize toward.  
      *   **Separates from neighbors?** PARTIALLY. Blurs with Normative Retro-Justification if "fitness" is defined post-hoc by winners.

  3.  **Normative Retro-Justification**  
      *   **Name:** Panglossian Historicism (inspired by Voltaire/Pangloss)  
      *   **Case:** Liberal democracy *is* dominant today → Therefore, historical narratives (e.g., Magna Carta to American Revolution) are constructed to show its inevitability/progress, regardless of actual contingency.  
      *   **Awkward Commitment:** History's "winners" define rationality/justice, making the actual path appear necessary & superior ("End of History" vibes).  
      *   **Separates from neighbors?** YES. Focuses on *narrative justification*, not material or functional causes like geography or efficiency.

  ---

  ### BRANCH 2: NO (Path Dependance [sic] is Real)
  *Core belief: Small differences cascade, leading to radically divergent outcomes.*  
  **Split by source of divergence:**

  1.  **Sensitive Dependence (Chaos-Style)**  
      *   **Name:** Strong Contingency (Gould-esque)  
      *   **Case:** Antony wins at **Actium** → No Roman Empire as we know it → Drastically different feudal structures in Europe → No Westphalian states → Modern institutions (capitalism, democracy) *never form*.  
      *   **Awkward Commitment:** History is inherently unpredictable beyond very short terms; no large-scale patterns are "guaranteed."  
      *   **Separates from neighbors?** YES. Focuses on *causal chains amplifying tiny differences*, unlike Lock-In's focus on *stability after a choice*.

  2.  **Institutional Lock-In**  
      *   **Name:** Institutional Sedimentation (Pierson-esque)  
      *   **Case:** Early institutional choices (e.g., **specific sequence of English revolutions** creating Parliamentary sovereignty) create self-reinforcing feedback loops (networks, vested interests, sunk costs) → Hard to shift path even if better options exist (cf. QWERTY keyboard). *Escapes possible but rare* (e.g., **Meiji Restoration** breaking Tokugawa lock-in).  
      *   **Awkward Commitment:** Societies can get "stuck" with persistently *suboptimal* institutions (efficiency ≠ outcome).  
      *   **Separates from neighbors?** YES. Focuses on *increasing returns/rigidity*, not chaotic sensitivity.

  ---

  ### KEY NOTES & NICHE IDEA

  *   **Logically Empty Combinations:**
      *   **Chaos-Style + Normative Retro-Justification:** Contradiction. Chaos implies fundamental unpredictability & multiple possible "winners," while Retro-Justification assumes the *actual* winner's path was uniquely rational/inevitable.
      *   **Functional Selection + Strong Lock-In:** Tension. Functionalism implies convergence on efficient forms; strong Lock-In allows persistent inefficiency. (Possible but unstable position).

  *   **Niche Idea: Counterfactual Fragility Index (CFI)**  
      A heuristic for *how small* a change is needed to derail a macro-outcome.  
      *   **Low CFI (Fragile):** Actium battle (single event/person). Tiny change → Massive divergence (supports **Strong Contingency**).  
      *   **Medium CFI:** British coal seams. Significant geographic change → Divergence in timing/location, but outcome might still emerge (supports **Geographic Determinism** weakly or **Path Dependance**).  
      *   **High CFI (Robust):** "Democracy needs Athens + Magna Carta + 1688 + 1776..." Ignores functional equivalents & lock-in escapes (supports **Institutional Sedimentation** or **Panglossian Historicism**).

  *   **Branch Integrity:** Splits hold due to distinct *mechanisms* (geography vs. function vs. narrative; chaos vs. lock-in). Key differentiator: **Does the mechanism allow/force the *same* outcome (Convergence) or *rule out* the same outcome (Dependance)?**

  ---

  **Handout Ready:** This tree uses concrete cases, highlights tensions, avoids dense citations, and provides conceptual hooks (CFI, awkward commitments) for seminar discussion. The "path dependance" spelling is preserved throughout.
