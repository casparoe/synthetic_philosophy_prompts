prompt: |-
  hey im a backend engineer writing specifcation docs for a genomics pipeline — about 5 or 6 gene/protein annotations per week, 20-30 mins each, and a senior engineer (not a biologist) has to sign off. clinicians and researchers recieve these, so if i mislabel what something "does" it can break downstream analysis. i have basically zero formal philosophy background.

  please act like a philosophy-of-biology expert who also writes tech specs. think carefully, and start by brainstorming in plain english: what is the difference between an etiological account (function = what it was selected for) and a causal-role account (function = what it actually does now in the pathway)? keep it to 3 sentences, no heavy jargon.

  then turn that distinction into a reusable checklist / flowchart-in-words that i can run in under 30 minutes with no PhD on call. it should have ordered steps, clear decision points, and explicit tags for "this is a judgment call i cant fully automate." cover the hard cases: pleiotropy, spandrel-type co-option/exaptation, redundancy where the causal role disappears but selection history doesnt, and cases where evolutionary evidence is just missing. also please inject a small niche framing idea — maybe a "function-drift audit" or a "dual-label severity score" — that isnt standard textbook stuff but helps make the checklist usable.

  apply the procedure to three worked cases:
  1. a clean case where both accounts line up (e.g., a well-studied metabolic enzyme)
  2. a messy split where etiological says "no original function" but causal-role shows clear regulatory activity now — the procedure should force a dual-label that users will probably hate, and say exactly what to write in the doc
  3. a case where the current causal role is obvious but evolutionary origin is totally unknown, so wether the historical filter applies is unclear

  be honest about what this procedure CANNOT do (it wont resolve deep metaphysics, replace expert review, etc.). write casually, like talking to a coworker. i dont want citations, bibliographies, or reading lists — just the procedure. please check your reasoning step-by-step before answering.
reasoning: |-
  We are a backend engineer writing specification docs for a genomics pipeline. We need to annotate gene/protein functions accurately because mislabeling can break downstream clinical/research analysis. We have about 20-30 minutes per annotation and no formal philosophy background. A senior engineer (non-biologist) signs off. 

  The key philosophical distinction we need to handle is between two types of "function" definitions:
  1. **Etiological function (selected effect)**: What the gene/protein was historically selected for in evolution. It's about the reason it exists.
  2. **Causal-role function**: What the gene/protein actually does in the current biological pathway. It's about its present activity.

  In plain English, the difference is:
  - The etiological account asks: "Why did this gene evolve? What was its job that made it stick around?"
  - The causal-role account asks: "What does this gene do right now in the cell, regardless of why it evolved?"

  Now, we turn this into a reusable 30-minute checklist. We'll call it the **Function-Drift Audit (FDA)**. The core idea is to force explicit labeling of both accounts and a "severity score" for how much they diverge. The score helps non-experts gauge risk.

  **Function-Drift Audit (FDA) Checklist**

  **Step 1: Gather Evidence** (10 mins)
  - **Current Pathway Data**: From databases (e.g., KEGG, Reactome), papers. What does the gene do *now*? (e.g., "binds to receptor X, activates pathway Y").
  - **Evolutionary Data**: From comparative genomics (e.g., orthologs, phylo trees), selection pressure (dN/dS), literature. What was it *selected for*? (e.g., "ancestral role in iron metabolism").
  - **Tag Uncertainty**: For any missing data, flag as "CR: Unknown" or "ET: Unknown". If evidence is weak (e.g., only one paper), note it.

  **Step 2: Compare Accounts** (5 mins)
    - **Decision Point 1: Do both accounts agree?** 
      - *Yes* → Label as **"Stable Function"**. Use unified description. Proceed to Step 4.
      - *No* → Go to Step 3.
    - **Decision Point 2: Is one account totally missing?**
      - *ET unknown, CR known* → Label as **"Current Role Only"** (ET: Unresolved). 
      - *CR unknown, ET known* → Label as **"Historical Role Only"** (CR: Unresolved). 
      - *Both unknown* → **Halt**. Flag for expert review. Cannot annotate.

  **Step 3: Handle Divergence** (10 mins)  
  Here’s where we deal with messy splits. Apply these filters:
    - **Pleiotropy**: If current role is new but ancestral role exists, tag as **"ET: [ancestral role]; CR: [current role]"**. 
    - **Spandrel/Exaptation**: If no clear ancestral function (e.g., non-adaptive origin) but current role exists, tag as **"ET: Non-adaptive origin; CR: [current role]"**. 
    - **Redundancy/Loss**: If historical role is gone (e.g., gene now silenced), but current role is null, tag as **"ET: [historical role]; CR: Non-functional"**. 
    - **Severity Score**: Assign 1-3 (low-high divergence):
      - **1**: Minor drift (e.g., same pathway, new target). 
      - **2**: Major drift (e.g., new pathway, same broad mechanism). 
      - **3**: Total repurposing (e.g., enzyme → transcription factor). 
    - **Judgment Call**: If evolutionary origin is ambiguous (e.g., no phylo data), default to causal-role but add caveat: "ET: Unresolved; CR: [current role]. Evolutionary origin unclear."

  **Step 4: Write Annotation** (5 mins)
    - **Template**: 
      - `[Gene] function: [concise description]. FDA: [ET label] | [CR label] | Severity: [score].` 
      - If severity ≥2, add: "Warning: Functional divergence detected. Downstream analyses should validate role contextually."
    - **Dual-Label Rule**: Never merge divergent accounts. If split, write both explicitly. Example: "Pax6: ET: Eye development in ancestral bilaterians; CR: Cortical neuron differentiation in mammals. Severity: 3."

  **What FDA Cannot Do**:
  - Resolve debates about "true" function (e.g., if philosophers disagree).
  - Replace expert review for high-severity cases.
  - Predict future drift or neofunctionalization without data.

  ---

  **Worked Cases**:

  **Case 1: Clean Case (e.g., Hexokinase)**  
  - Step 1: 
    - CR: Phosphorylates glucose in glycolysis (well-documented in humans). 
    - ET: Selected for glucose phosphorylation in early metabolism (conserved from bacteria). 
  - Step 2: Accounts agree. 
  - Annotation:  
    `Hexokinase function: Catalyzes the first step of glycolysis. FDA: ET: Glucose phosphorylation | CR: Glucose phosphorylation | Severity: 1.`

  **Case 2: Messy Split (e.g., BRCA1 - oversimplified for illustration)**  
  - Step 1: 
    - CR: DNA repair in homologous recombination (current role in cancer pathways). 
    - ET: Originally selected for meiotic recombination in germ cells (ancestral role). 
  - Step 2: Divergence detected (pleiotropy). 
  - Step 3: Severity Score 2 (major drift: same mechanism, new context). 
  - Annotation:  
    `BRCA1 function: Involved in DNA double-strand break repair. FDA: ET: Meiotic recombination | CR: DNA repair in somatic cells | Severity: 2. Warning: Functional divergence detected.`  
    *(Note: In reality, BRCA1 has multiple roles, but this illustrates the split.)*

  **Case 3: Unknown Origin (e.g., a novel human protein "XYZ123")**  
  - Step 1: 
    - CR: Binds to RNA in stress granules (observed in assays). 
    - ET: No orthologs outside primates; no selection data. 
  - Step 2: ET unknown, CR known. 
  - Annotation:  
    `XYZ123 function: RNA-binding protein in stress granules. FDA: ET: Unresolved | CR: RNA-binding in stress granules | Severity: N/A. Evolutionary origin unclear.`

  ---

  This gives you a structured, time-bound way to flag risky annotations. The "severity score" and forced dual-labeling (even if users hate it) prevent oversimplification. Run this past your senior engineer during sign-off—they don’t need bio expertise to spot high-severity warnings.
answer: |-
  ### Plain English Distinction
  Etiological function is about *why evolution kept a gene*—its original survival-driven job. Causal-role function is about *what the gene physically does right now* in your organism’s biochemical pathways. They often match, but when evolution repurposes genes (like co-opting a "digestive enzyme" for "immune signaling"), they split—and mislabeling either can wreck clinical interpretations.

  ---

  ### Function-Drift Audit (FDA) Checklist  
  *Spend max 30 mins/gene. Use this to force explicit, dual-perspective labeling. "Severity" scores (1-5) flag divergence risk for downstream users.*  

  1. **Gather Evidence (10 mins)**  
     - *Current Role:* Mine databases (UniProt, KEGG, PubMed) for **direct experimental proof** of molecular activity (e.g., "kinase for substrate X in pathway Y").  
     - *Etiological Role:* Trace via comparative genomics (PhyloTree, Ensembl)—look for **conservation, selection pressure (dN/dS), and ancestral orthologs**.  
     - *Tag gaps:* "CR: Unknown" or "ET: Unknown" if evidence is thin/none.  

  2. **Divergence Test (5 mins)**  
     - **IF** current role matches ancestral role (e.g., both "glucose metabolism") → **Unified Label** (Severity=1).  
     - **IF roles diverge** (e.g., ET="structural protein", CR="signaling hub") → Proceed to Step 3.  
     - **IF ET data missing** → Default to CR label + "ET: Unresolved" + Severity=3 (caution).  

  3. **Hard Case Handler (10 mins)**  
     - **Pleiotropy?** (One gene, multiple functions): Tag *both* roles. *Example: ET="oxygen transport" (ancestral), CR="NO signaling" (new). Severity=2.*  
     - **Spandrel/Exaptation?** (Non-adaptive origin co-opted): Label ET="Non-adaptive (co-opted from [X])", CR="[Current role]". *Severity=4 if clinical impact is high.*  
     - **Redundancy/Loss?** (ET role obsolete but CR active): Keep ET as "Vestigial: [old role]", CR as current role. *Severity=1 if harmless, 3 if masking disease mechanisms.*  
     - **Total ET Black Box?** (No evolutionary trace): CR label + "ET: Evolutionarily novel. Risk: Uncharacterized drift". *Severity=5 if in critical pathway.*  
     - **Judgment Call:** "Severity" score is subjective—base it on pathway criticality and evidence quality. *Document rationale.*  

  4. **Write Spec (5 mins)**  
     - **Template:** `[Gene] function: [Concise mechanistic description]. FDA: ET=[Etiological role] | CR=[Causal role] | Severity=[Score].`  
     - **Severity ≥3?** Add: "WARNING: Functional divergence. Validate contextually in downstream analysis."  
     - **Dual-Label Rule:** *Never* collapse ET/CR into one statement if Severity ≥2.  

  ---

  ### Worked Cases  

  **Case 1: Clean Match (e.g., Hexokinase)**  
  - *Evidence:* CR: Phosphorylates glucose (human pathways). ET: Conserved glucose phosphorylation since yeast.  
  - *FDA Output:*  
    `Hexokinase function: Catalyzes glucose phosphorylation in glycolysis. FDA: ET=Glucose phosphorylation | CR=Glucose phosphorylation | Severity=1.`  

  **Case 2: Messy Split (e.g., BRCA1 — simplified for illustration)**  
  - *Evidence:* CR: DNA repair in somatic cells (well-documented). ET: Ancestral role in meiotic recombination (not somatic repair).  
  - *Divergence:* Pleiotropy + co-option. Severity=4 (high clinical impact).  
  - *FDA Output:*  
    `BRCA1 function: DNA double-strand break repair via homologous recombination. FDA: ET=Meiotic recombination | CR=Somatic DNA repair | Severity=4. WARNING: Functional divergence. Do not assume ancestral role applies to somatic contexts.`  
    *(Yes, clinicians will hate dual labels—but mislabeling causes false positives in cancer risk models.)*  

  **Case 3: ET Unknown (e.g., novel human gene "XYZ123")**  
  - *Evidence:* CR: Binds RNA in stress granules (experimental data). ET: No orthologs outside primates; no functional inference possible.  
  - *FDA Output:*  
    `XYZ123 function: RNA-binding protein in cytoplasmic stress granules. FDA: ET=Unresolved (evolutionarily novel) | CR=RNA-binding in stress granules | Severity=5. WARNING: No ancestral data. Role may be lineage-specific or drifted.`  

  ---

  ### What This Can't Do  
  - **Not a metaphysics solver:** Won’t tell you the "true" function—just forces explicit labeling.  
  - **Not a bio-expert:** Relies on public data. Gaps (e.g., poorly studied genes) need manual review.  
  - **Not future-proof:** Scores based on *current* evidence. Re-audit if new papers drop.  

  ### Why This Works for You  
  - **Engineer-Proof:** Severity scores give your senior dev a quick "risk toggle." No bio PhD needed.  
  - **Niche Hack:** "Function-drift" framing makes evolution tangible—genes are like legacy code. If a function was `SELECT`ed for once but now `DOES` something else, document both versions.  
  - **Timeboxed:** 30-min structure prevents rabbit holes.  

  Run this by your senior during sign-off—they can sanity-check Severity scores without understanding "exaptation."
