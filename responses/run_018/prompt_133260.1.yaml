  We, the Nash Bargaining Solution (NBS) camp and the Kalai-Smorodinsky (KS) camp, have engaged in a rigorous debate on how an aligned AI should split value between users with incommensurable preferences. We agree on several foundational points and clarify our disagreements as follows:

  ### Agreed Claims

  1. **Formal Setup**: 
     - The AI faces a bargaining problem with two users. The feasible set of utility pairs S is convex, compact, and contains points dominating the disagreement point d (the outcome if the AI refuses to engage). 
     - **NBS** maximizes the product (x1 - d1)(x2 - d2) over (x1, x2) in S.
     - **KS** finds the Pareto efficient point where (x1 - d1)/(u1 - d1) = (x2 - d2)/(u2 - d2), with u being the utopia point (each player's individual maximum in S).

  2. **Why Averaging Fails**: Averaging utilities requires interpersonal comparisons, which are invalid with incommensurable preferences. It ignores the structure of S and the bargaining context.

  3. **Disagreement Point (d)**: Represents the status quo (e.g., AI inactivity), serving as a baseline for improvement.

  4. **Utopia Point (u)**: Represents each player's ideal outcome if unconstrained by the other. It may be infeasible due to trade-offs or logical incompatibilities (e.g., privacy vs. transparency).

  5. **Incompatible Utopia**: Even when u is physically impossible (e.g., due to logical conflicts), KS uses it to normalize gains. NBS does not use u.

  ### Disagreements

  | Issue | Nash Bargaining Camp | Kalai-Smorodinsky Camp |
  |-------|----------------------|------------------------|
  | **Monotonicity vs IIA** | We prioritize IIA: If S shrinks but the solution remains feasible and d unchanged, the solution should not change. This prevents manipulation by adding irrelevant options. | We prioritize monotonicity: If S expands and u improves, both players should benefit. This ensures that gains from new possibilities are shared fairly. |
  | **Scaling Invariance** | Scaling invariance is essential: Utilities are unique up to affine transforms. The solution should be invariant to rescaling, even if d is not zero. | Normalization by the range [d, u] makes KS scaling-invariant. However, if d is not zero, rescaling might alter the interpretation of gains, but our solution handles it. |

