  We are drafting a joint statement for two camps: Nash Bargaining Solution (NBS) and Kalai-Smorodinsky (KS) bargaining solution, in the context of an AI alignment problem. The AI must split value between users with incommensurable preferences.

  First, we set up the formal problem:

  - There are two players (users) with utilities over outcomes.
  - The set of possible utility pairs is a closed, convex, bounded set S in R² (the feasible set).
  - The disagreement point d = (d1, d2) is the outcome if no agreement is reached (the AI refuses to engage).
  - The utopia point u = (u1, u2) is defined as: u1 = max {x1 | (x1, x2) in S} and similarly u2 = max {x2 | (x1, x2) in S}. Note: This point may be outside S (in fact, typically is).

  Both solutions are bargaining solutions that aim to be fair. They both satisfy Pareto efficiency (no one can be made better off without making the other worse off) and symmetry (if the problem is symmetric, the solution should be symmetric). But they differ in other axioms.

  **Agreed Claims:**

  1. **Formal Setup**:
     - **Nash Bargaining Solution (NBS)**: The solution is the point (x1, x2) in S that maximizes the product (x1 - d1) * (x2 - d2). It requires S to be convex and compact, and d to be such that there exists some x in S with x > d.
     - **Kalai-Smorodinsky (KS) Solution**: The solution is the point (x1, x2) in S that is Pareto efficient and such that the ratio (x1 - d1)/(u1 - d1) = (x2 - d2)/(u2 - d2). That is, the relative improvements from the disagreement point to the utopia point are equal for both players.

  2. **Why Averaging Utility Fails**:
     - Averaging utility (or any linear combination) would require interpersonal utility comparisons, which are problematic because preferences are incommensurable. Moreover, without a common scale, averaging might not reflect the structure of the feasible set and could violate fundamental fairness axioms (like if one player has a much larger range of possible utilities, averaging might ignore that).

  3. **Disagreement Point (d)**:
     - Represents the outcome when the AI does nothing (or the status quo). It is the fallback position. Both solutions use this as a baseline.

  4. **Utopia Point (u)**:
     - Represents the maximum possible utility each player could achieve if they were alone (ignoring the other). It is the ideal for each, but typically not achievable simultaneously because of trade-offs. It is used in KS to set the scale for each player.

  5. **The Case of Physically Impossible Utopia**:
     - Sometimes, the utopia point is not just outside S but physically impossible because the users' values are logically incompatible. For example, one user might want complete privacy and the other complete transparency in the same system. In such a case, the utopia point (max privacy, max transparency) is logically impossible. However, the KS solution still uses the utopia point as defined by the individual maxima (even if they are incompatible) to set the scale for normalization.

  **Disagreements Table:**

  | Issue | Nash Bargaining Camp | Kalai-Smorodinsky Camp |
  |-------|----------------------|------------------------|
  | **Monotonicity vs Independence of Irrelevant Alternatives (IIA)** | We value IIA: If the feasible set shrinks but the solution remains feasible and the disagreement point doesn't change, then the solution should not change. This ensures stability and prevents manipulation by adding irrelevant options. | We value monotonicity: If the feasible set expands in a way that the utopia point moves outward, then each player should get at least as much as before. This ensures that when more becomes possible, no one is left behind. |
  | **Scaling Invariance** | Scaling invariance is crucial: Utilities are unique up to positive affine transformations (i.e., we can change the scale and zero point arbitrarily). Therefore, the solution should be invariant to such rescalings. Since the disagreement point d is defined as the AI refusing to engage (which might not be zero utility), we still require scaling invariance. | Scaling invariance is built into our solution via normalization: We express gains relative to d and relative to the utopia point. But note: if the utopia point changes due to rescaling, the KS solution adjusts accordingly. However, we are concerned that if d is not zero, then rescaling might change the relative gains. But our solution is invariant if we rescale each player's utility independently (because we normalize by the range from d to u). |

