    - **KS Prediction**: (61.8, 6.18) — Equalizes relative gains: x/100 = y/10.
    - **Why it matters**: NBS argues KS normalization inflates B's claim by an "impossible" ideal (y=10). KS argues normalization is necessary to account for B's smaller improvement range (0 to 10 vs. A's 0 to 100).

  **Crux 2: Does the impossibility of u break KS?**
  - **Mediation Case**: Privacy (A) vs. Transparency (B) with a linear but truncated feasible set: uA + uB ≤ 100, uA ≤ 40, d = (0,0), u = (40,100).
    - **NBS Prediction**: (40,60) — Binds at uA=40, maximizing the product given the constraint.
    - **KS Prediction**: (28.57,71.43) — Equalizes relative gains: uA/40 = uB/100.
    - **Why it matters**: NBS claims KS is misled by B's unattainable utopia (100). KS claims normalization fairly weights B's larger potential gains.

  ### Confidence & Uncertainty
  - **Overall Confidence**: Medium. The analysis is grounded in first principles, but real-world bargaining may involve non-convex sets or dynamics not covered here.
  - **Least Sure About**: Handling of non-convex feasible sets (e.g., discrete outcomes). This may require randomization or alternative solutions.
  - **Verbal Dispute**: Part of the scaling debate may be verbal (e.g., how "gains" are defined), but the monotonicity vs. IIA conflict is substantive.

