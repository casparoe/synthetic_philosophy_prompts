          Now they differ: 
            NBS: (40,60) 
            KS: (28.57,71.43)

          Why? 
            - NBS: Because the constraint uA<=40 binds, and we take the corner solution.
            - KS: Normalizes by the utopia, so player B gets a larger share of their possible range.

          This is a clear disagreement.

      So for Crux 2, we use this example.

      **Crux 2: Does the impossibility of reaching the utopia point break KS reasoning?**
          - In this example, the utopia point (40,100) is impossible (because uA+uB<=100, so if uA=40 then uB<=60). KS still uses it to normalize. 
