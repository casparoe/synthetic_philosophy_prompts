  5. **If assured others submit one entry, how many do you submit?**  
     - **A: One** (Leaf 6: **Cooperative (FDT/Superrationalist)**)  
     - **B: More than one** (Leaf 7: **Evidential Decision Theorist (EDT)**)  
     - **C: Zero** (Leaf 8: **Pessimist**)  

  6. **In the Platonia Dilemma (no randomization), what do you do?**  
     - **A: Send** (Leaf 1: **Optimistic non-CDT**)  
     - **B: Not send** (Go to 9)  
     - **C: Undecided/no unique choice** (Leaf 9: **Mixed-Strategy Equilibrium Theorist**)  

  7. **Would duplication change your Platonia choice?**  
     - **A: Yes** (Leaf 10: **Skeptic/EDT variant**)  
     - **B: No** (Go to 10)  

  8. **In the Luring Lottery, submit entries equal to estimate of others’ total?**  
     - **A: Yes** (Leaf 11: **Causal Decision Theorist (CDT)**)  
     - **B: No** (Leaf 12: **Cautious CDT**)  

  ---

  ### Leaves (Positions) and Awkward Commitments  

  1. **Optimistic non-CDT**:  
     Sends in Platonia despite near-certain loss from symmetry.  
  2. **Skeptic**:  
     No verdict in Platonia even with high stakes and public signals.  
  3. **Functional Decision Theorist (FDT)**:  
     Cooperates with a PD copy despite defection being causally dominant.  
  4. **Superrationalist**:  
     Uses public clock deterministically in Platonia, risking synchronized failure.  
  5. **Inconsistent non-CDT**:  
     Submits spiral-inducing entries in Luring while rejecting causal dominance (rarely coherent).  
  6. **Cooperative (FDT/Superrationalist)**:  
     Submits one Luring entry when assured of cooperation, forgoing exploitative gains.  
  7. **Evidential Decision Theorist (EDT)**:  
     Submits extra Luring entries when assured of cooperation, as evidence suggests others won’t comply.  
  8. **Pessimist**:  
     Avoids Luring Lottery even when cooperation is assured, forfeiting guaranteed rewards.  
  9. **Mixed-Strategy Equilibrium Theorist**:  
     Requires randomization for Platonia verdict, rendering it useless when banned.  
  10. **Skeptic/EDT variant**:  
      Changes Platonia choice if duplicated, but cannot specify a better action.  
  11. **Causal Decision Theorist (CDT)**:  
      Submits spiral-inducing entries in Luring Lottery, making the prize worthless.  
  12. **Cautious CDT**:  
      Avoids self-matching in Luring but defects in PD, prioritizing loss aversion over dominance.  

  **Ambiguities and Flags**:  
  - **FDT and Superrationalism** agree on PD/Platonia/Luring cooperation but diverge on atomic clock: FDT randomizes (Leaf 3); superrationalism uses deterministic signals (Leaf 4).  
  - **EDT and Nash** both may exploit Luring cooperation (Leaf 7) but diverge on randomization (EDT ignores clocks; Nash requires them).  
  - **Unoccupied**: "Send in Platonia + Cooperate in PD" → No defended position (too optimistic).  

  ---

  ### What the Tree Reveals  
  The tree isolates core disagreements in symmetric games: whether rational choice requires **causal independence** (CDT), **evidential consistency** (EDT), **universalization of decisions** (FDT/superrationalism), or **equilibrium convergence** (Nash). Crucially, it shows that labels like "rational" mask divergent beliefs about duplication, randomization, and self-reference. FDT/superrationalism prioritize cooperative fixed points; CDT/EDT/Nash focus on individual optimization, differing only in how they model correlations. The real divide is not terminological but ontological: *Can my decision control or evidence symmetrical others’ acts?* If yes, cooperation emerges; if not, individualism dominates.
