  1.  **Theoretical Imperative:** A framework expecting *Vergangenheitsbewältigung* would demand Richmond actively dismantle Confederate memorialization (statues, school names) as toxic state-sanctioned myths, acknowledging systemic racism's roots.  
  2. **Closest Analogue:** Richmond most resembles **Japan's postwar silence**, as both avoided imposed ideological purges, allowing defeated elites to shape a narrative minimizing guilt (Lost Cause / "War wasn't about slavery") and obscuring victimhood.  
  3. **Analogy Breakdown:** Unlike Germany or Japan, **no overarching state authority enforced Richmond's reckoning**; actions remain contested, local, and vulnerable to state-level backlash (e.g., Virginia laws protecting war memorials until 2020).  
  4. **Guilt vs. Myth Swap:** Your aunt identifies a risk; surface-level removals *can* become "myth-swapping" without deep structural accountability, but the grassroots push *for* removal represents a cultural **choice toward guilt** (acknowledging systemic harm) over Lost Cause shame (defensive pride).  
  5. **Theory's Blind Spot:** The framework **neglects hyper-local agency**; Richmond's ad-hoc solutions (graffiti garden, school-by-school battles) emerge precisely *because* formal surrender/reconstruction failed, forcing reckoning onto neighborhoods, not the state.
