  Let me unpack the core vulnerability first: Dewey's normative commitments about "growth" and "education" do seem axiomatic rather than experimentally derived. That's awkward but not fatal—pragmatists could frame them as presuppositions necessary to start inquiry. More damaging is the relativism charge: if all values are revisable, what anchors the inquiry's direction? The user's fear about "power-driven churn" hits home here. 

