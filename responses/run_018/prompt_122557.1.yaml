  The paragraph from the book makes several claims:

  1. Ordinary Bayesian updating handles only certain evidence.
  2. Jeffrey conditionalization is the generalization for uncertain evidence.
  3. The rule leaves conditional probabilities P(H|E) and P(H|¬E) unchanged.
  4. The update formula is P_new(H) = P(H|E)·P_new(E) + P(H|¬E)·P_new(¬E).
  5. This is just Bayes' theorem applied cell by cell.
  6. It is strictly more general than ordinary conditioning (which is the case P_new(E)=1).
  7. It is the standard Bayesian treatment of uncertain evidence: whenever evidence is uncertain, this rule applies.
  8. Since the rule only reweights the cells, the order of processing a series of such experiences does not matter.

  The user then describes a medical case and applies two Jeffrey updates in different orders and gets slightly different results (0.29 vs 0.28). They want to know if the gap is due to arithmetic error or a real issue, and they have several specific questions.

  Let's break down the book's paragraph:

  **Sentence-by-sentence analysis:**

  1. "Ordinary Bayesian updating handles only the case where you learn something outright: once you are certain of E, your new credence in any hypothesis H should simply be your old P(H|E)."  
     - This is correct and standard.

  2. "But most real evidence doesn't arrive that way. You don't learn that the cloth is green; you glance at it under bad shop lighting and end up, say, 70% confident that it is."  
     - This is a fair motivation for uncertain evidence.

  3. "Jeffrey conditionalization — also called probability kinematics — is the generalization that covers this."  
     - This is a standard view.

  4. "You take the partition {E, ¬E} consisting of the possibilities your experience bears on, leave the conditional probabilities P(H|E) and P(H|¬E) exactly as they were, and redistribute probability across the cells to match your new confidence: P_new(H) = P(H|E)·P_new(E) + P(H|¬E)·P_new(¬E)."  
     - The formula is correct. The critical point is the requirement that the conditional probabilities P(H|E) and P(H|¬E) remain unchanged. This is known as the "rigidity" condition. It is an assumption of the method, not something that automatically holds. The book presents it as part of the rule, which is acceptable, but the user is right to question when it holds.

  5. "This is really just Bayes' theorem applied cell by cell."  
     - This is a bit misleading. The formula is a direct consequence of the law of total probability and the rigidity assumption. It is not exactly Bayes' theorem (which typically relates conditional probabilities in a different way). However, one can see the parallel: in ordinary conditioning, we set P_new(E)=1 and get P_new(H)=P(H|E). Here, we are using the same conditional probabilities but with a weighted average. So it is a generalization of the idea.

  6. "It is strictly more general than ordinary conditioning, which is the special case where P_new(E) = 1, and it is the standard Bayesian treatment of uncertain evidence: whenever your evidence is uncertain, this is the rule to apply."  
     - The first part is correct: ordinary conditioning is a special case. However, the claim that it is the standard treatment and that it applies whenever evidence is uncertain is too strong. Jeffrey conditionalization is a standard method, but it is not the only one, and it relies on the rigidity assumption. In cases where the experience does not leave the conditional probabilities unchanged (for example, if the evidence changes your views about the relationship between E and H), then Jeffrey conditionalization is not appropriate.

  7. "And since all the rule does is reweight the cells, it makes no difference what order you process a series of such experiences in — you land in the same place regardless."  
     - This is not generally true. The rule, as stated, applies to one partition at a time. If you have two different partitions (as in the user's example) and update on both, the order may matter because the rigidity condition must hold at each step. Moreover, the rigidity condition for the second update might be violated if the first update changes the conditional probabilities for the second partition. The book's claim of order-independence is only true if the experiences are such that the rigidity conditions are maintained throughout and the partitions are compatible in a certain way. In general, for multiple updates, the Jeffrey rule does not commute arbitrarily.

