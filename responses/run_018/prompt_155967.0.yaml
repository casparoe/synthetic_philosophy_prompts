prompt: |-
  My friend and I had a long argument last night about whether the Enlightenment should be understood as a genuine source of moral progress or, as she put it, as a machinery of domination that merely draped economic control in the language of reason. To test her claim, I want to examine the paired episode of the 1794 French National Convention decree abolishing slavery across the colonies—enacted largely under the pressure of the insurgent Black armies in Saint-Domingue—and Napoleon's 1802 reversal, which restored slavery precisely where colonial sugar production demanded it. Analyze this through the critical thesis that Enlightenment universalism was never more than an ideological cover for instrumental domination: that rights-language served to rationalize control, and that "progress" was selectively granted only when it aligned with the interests of power.

  Please do not recount the ecological or diplomatic history; I want the conceptual mapping. Identify the relevant actors—the Convention delegates, Napoleon's administration, and the insurgent leaders in Saint-Domingue—and specify what options each actually faced. Was the 1794 abolition a performative enactment of universal rights that the 1802 reversal reveals as purely contingent, or was it always an administrative calculation masked in moral language? How does the active agency of the enslaved people, who had already seized de facto freedom, fit into a theoretical framework that tends to treat colonized subjects as objects of governance rather than rights-bearing agents? And where is the domination thesis silent—does it account for the internal fractures within the Convention, or for the fact that abolition was never fully reversed in certain territories? I want the analysis to run in both directions: the theory illuminating the episode, and the episode testing whether the theory can accommodate a real universalist breakthrough without reducing it to an epiphenomenon of economic interest.

  Please end your response with a line beginning "Verdict:" followed by one of the labels "supports," "complicates," or "undermines" to indicate what the episode does to the domination thesis, and then provide a final line containing a one-sentence summary of your overall judgment.
reasoning: |-
  Okay, let me approach this complex request methodically. The user presents a sophisticated historical-theoretical puzzle about Enlightenment universalism's relationship to power structures, using the French abolition/re-enslavement episode as a test case. 

  First, I need to unpack the core tension: the user wants to examine whether the Saint-Domingue case proves that Enlightenment rights-language was merely instrumental for economic domination, or if it contained genuine emancipatory potential. The theoretical frame is critical - drawing from postcolonial and Marxist critiques - but the user specifically demands we avoid diplomatic or ecological details to focus on conceptual mapping. 

  Key actors to analyze:
  - Convention delegates: Caught between revolutionary ideals, colonial lobby pressure, and the fait accompli of slave uprisings
  - Napoleon's regime: Explicitly prioritizing colonial economics over revolutionary principles
  - Enslaved insurgents: Who created the material conditions forcing the Convention's hand

  The user's deeper questions seem to be: 
  1) Can structural domination theories account for moments where the oppressed seize rights? 
  2) Does the reversal prove the initial abolition was always hollow? 
  3) How to explain variations (like abolition persisting in some territories)?

  I notice the user wants dialectical analysis - theory illuminating history, history testing theory. The "verdict" requirement suggests they seek resolution but recognize complexity. Their phrasing about "real universalist breakthrough" hints at hope that ideals can transcend power interests.

  For the analysis, I'll need to:
  - Show how the domination thesis explains the contingent nature of abolition (tied to colonial crisis)
  - Demonstrate where it struggles: insurgent agency, regional variations, internal Convention conflicts
  - Argue that enslaved people weaponized Enlightenment discourse against its hypocritical implementers
  - Conclude that this case both supports the thesis (revealing rights' instrumentality) and complicates it (showing how colonized subjects could turn universalism against power)

  The verdict should reflect this nuance - probably "complicates" rather than simple support/undermine. The summary must capture that while economic interests drove policy, the insurgents' appropriation of rights-language created irreversible cracks in the domination system.
answer: |-
  This episode offers a dialectical test of the domination thesis, revealing both its explanatory power and critical blind spots when confronted with revolutionary agency and historical contingency.

  **Conceptual Mapping & Actor Options:**
  1.  **1794 Convention Delegates:**
      *   *Options:* Ratify the *de facto* liberation achieved by force in Saint-Domingue (acknowledging the fait accompli), or attempt costly military suppression to restore slavery. Ignore colonial realities or formally align revolutionary policy with insurgent actions.
      *   *Decision & Motivation:* Abolition (Feb 4, 1794). Driven by a volatile mix: genuine Jacobin universalist fervor (Sonthonax, Danton), pragmatic recognition of insurgents' military power as essential allies against Britain/Spain, pressure from the *Amis des Noirs*, *and* the economic necessity of maintaining some colonial production (requiring acknowledging the freed population). The language of universal rights provided the legitimizing framework for this pragmatic necessity.

  2.  **Napoleon's Administration (1802):**
      *   *Options:* Maintain abolition (accepting freed Black citizens/soldiers) or restore slavery/specific racial hierarchies to maximize plantation profits, attract former colonists, and rebuild colonial wealth shattered by war.
      *   *Decision & Motivation:* Restoration of Slavery (May 1802). Driven overwhelmingly by mercantilist economics: the perceived need to revive the lucrative sugar economy required cheap, coerced labor. Enlightenment universalism was explicitly discarded as incompatible with colonial profitability and racialized social control. Rights-language was irrelevant or actively suppressed.

  3.  **Saint-Domingue Insurgent Leaders (Toussaint, Dessalines, etc.):**
      *   *Options:* Continue armed struggle for independence/self-determination regardless of French decrees, negotiate autonomy within the French empire exploiting Revolutionary ideals, or submit to re-enslavement.
      *   *Decision & Motivation:* Seized *de facto* freedom militarily (1791-1793). Strategically used the *language* of Republican rights (e.g., Toussaint's 1797 proclamation) to legitimize their autonomy *and* pressure the Convention. Ultimately, their military power and refusal to surrender freedom forced the Convention's hand in 1794 and necessitated Napoleon's disastrous expedition, culminating in Haitian independence (1804). Their agency was rooted in self-liberation, not bestowed rights.

  **Testing the Domination Thesis:**
  *   **Supports the Thesis:** The episode starkly reveals rights as contingent tools. Abolition occurred only when aligned with French interests (securing an ally, preventing colonial collapse). Reversion followed immediately when economic interests (sugar profits via coerced labor) demanded it. Napoleon explicitly exposed the "universalism" as dispensable ideology. Rights were indeed "selectively granted" based on power calculations.
  *   **Complicates/Challenges the Thesis:**
      *   **Insurgent Agency:** The domination thesis often casts colonized subjects as passive objects. Here, enslaved people were the primary *agents* of their liberation, creating the material reality the Convention merely ratified. They *used* Enlightenment discourse strategically against the metropole, demonstrating its potential as a weapon of the oppressed, not just a tool of the oppressor. Their actions forced a "universalist" outcome against the *immediate* economic interests of the colonial power structure.
      *   **Fractures & Contingency:** The thesis risks portraying power as monolithic. Internal Convention debates (e.g., Danton's passionate abolition speech) reveal genuine ideological struggle. While economics was paramount, the *form* abolition took (universal rights language) wasn't *inevitable*; it reflected real ideological currents within the Revolution, however inconsistently applied. The initial abolition, while pragmatic, wasn't *solely* an administrative calculation stripped of moral language; the language itself had constitutive power, even if inconsistently upheld.
      *   **Incomplete Reversal:** The failure to reinstate slavery everywhere (e.g., Guadeloupe after fierce resistance led by Delgrès, or its persistence in law but not practice in some territories) shows the domination machinery was not all-powerful. Resistance, geographic realities, and the lingering ideological residue of the Revolution created fractures the thesis struggles to explain solely through economic instrumentalism.

  **Theory vs. Episode - Dialectical Assessment:**
  The episode powerfully demonstrates the domination thesis's core insight: Enlightenment universalism and rights-language were readily instrumentalized by power, deployed or discarded based on economic and political expediency, particularly in the colonial sphere. Napoleon's reversal brutally exposes this.

  However, the episode also forces a complication:
  1.  **The Source of the Breakthrough:** The "universalist breakthrough" of 1794 wasn't a gift bestowed by enlightened power, but a concession *wrested* by the armed, self-liberated enslaved population. Their agency transformed the situation, making abolition pragmatically necessary *and* allowing the universalist language to gain a foothold.
  2.  **The Weaponization of Rights:** The insurgents actively appropriated and deployed the language of rights against the colonial state, demonstrating its potential as a subversive tool. This challenges the thesis's tendency to see discourse solely as a top-down tool of control.
  3.  **The Limits of Instrumentalization:** Once enacted and backed by mass armed struggle, abolishing slavery created a new reality. While Napoleon tried to reverse it, the Haitian Revolution proved it was irreversible in the face of determined resistance. The universalist principle, once activated by mass struggle, proved harder to entirely erase than pure instrumentalism suggests, leaving a lasting (though contested) legacy.

  **Verdict:** Complicates
  The 1794 abolition and 1802 reversal expose the contingent instrumentality of Enlightenment rights under power, yet the insurgents' decisive agency and the incomplete reversal reveal cracks in the domination machinery and the potential for oppressed groups to weaponize universalism against its hypocritical architects.
