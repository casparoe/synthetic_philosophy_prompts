prompt: |-
  I teach social and political philosophy, and I've somehow ended up chairing our college's study-abroad advising committee. The questions students keep bringing in are exactly the ones the philosophy of conventions and social norms is about, but our advisors have no systematic way to turn that into usable advice. The recurring question is some version of: 'Do I actually have to tip here? queue this formally? not cross against the light? or am I just doing it to avoid weird looks?' Advisors see several students a day in peak season, have maybe fifteen minutes each, and whatever guidance they give ends up in the handbook I have to sign off on, so I need something defensible and reusable, not a one-off opinion. Get it wrong and a student either offends their hosts or follows some local practice they find demeaning out of misplaced scrupulousness.

  So: you're an expert on social norms, conventions, and the line between the conventional and the moral. Please draft a one-page decision procedure — a checklist or flowchart in words — that a non-philosopher advisor can run through with a student to determine whether the student is morally required, merely expected, or free to skip a local convention. Draw on whatever philosophical work on conventions and norms you actually know, but do not cite anything; I want the reasoning compressed, not a reading list. Think carefully, and maybe start by listing the different reasons a norm can bind a visitor before you collapse them into steps. The procedure should distinguish (at least) between: (a) norms whose violation would impose real costs on someone who reasonably relied on you, like a tipped worker whose employer can legally pay them a couple dollars an hour; (b) harmless coordination devices like a queue; and (c) norms that work mostly as ways of showing respect or recognition, like forms of address and greetings. It should also handle the asymmetry where a local breaking their own norm can look like critique or reform, while a visitor doing the same thing reads as contempt. It should say what to do when compliance is cheap but the student objects on principle, and it should mark the steps where the procedure can't settle things and has to hand the decision back to a person because it's a value conflict rather than an application of a norm.

  Then run the procedure on three cases. First: a student going to a U.S. state where servers earn a tipped minimum wage and depend on tips, who believes tipping is a pernicious custom that lets employers underpay workers and wants to refuse to tip as a protest; I suspect the procedure will tell them to tip anyway, and I want that made honest and uncomfortable rather than softened. Second: a student in a city where crossing against the light is technically a petty offense but totally unenforced, and the host family crosses against the light constantly. Third: a student told they must wait in a long, formal queue at a market where, as far as they can tell, nobody would be harmed by stepping ahead. Lastly, tell me plainly what the procedure cannot do — which cases its likely to misclassify, and where the biggest judgment calls are hidden inside steps that look mechanical.
reasoning: |-
  Okay, let me start by really understanding what this professor needs. They teach social and political philosophy but are now chairing a study-abroad committee. Students keep asking whether they have to follow local norms like tipping, queuing, or jaywalking. The advisors don't have a systematic way to handle these questions, and the answers end up in a handbook the professor approves. So they need a clear, defensible decision procedure that non-philosophers can use in 15-minute sessions.

  Hmm, the key here is distinguishing between moral obligations, social expectations, and optional conventions. The professor mentioned three categories: norms with real costs (like tipping where workers rely on it), harmless coordination (queues), and respect-based norms (greetings). Also, there's the asymmetry where locals breaking norms might be seen as reform but visitors doing it as contempt.

  I need to draft a one-page flowchart or checklist. It should be based on philosophical concepts but without citations. Let me think about the different reasons a norm can bind someone. First, if violating it harms others, especially if they reasonably rely on you (like tipped workers). Second, if it's a coordination device where not following disrupts social order. Third, if it’s about showing respect, where skipping it insults the local culture. Also, visitor status matters—outsiders don’t have the standing to challenge norms like locals do.

  The procedure should handle cases where compliance is cheap but the student objects on principle. And it should flag when the decision can’t be made by the procedure and needs human judgment. The professor gave three test cases: tipping in the US, jaywalking where it’s unenforced but common, and queuing formally even if no harm is done.

  For the tipping case, the student wants to protest the system. But the procedure should probably say they must tip because workers rely on tips to survive—withholding tips hurts individuals without changing the system. The jaywalking case is trickier. If it’s unenforced and locals do it, maybe it’s optional. But the procedure should note that as a visitor, skipping might still offend, whereas locals aren’t judged the same. Queuing: if it’s a coordination norm and skipping it causes confusion or resentment, they should follow it, even if no direct harm.

  I should structure the procedure as a series of yes/no questions. Start with: "Does skipping this action cause direct, quantifiable harm to specific people?" If yes, it’s a moral requirement. If no, then ask if it’s a coordination device. If skipping disrupts order, it’s expected. If not, then check if it’s about respect—if skipping insults locals, it’s expected. Otherwise, it’s optional. The asymmetry point goes in the respect question: visitors skipping respect norms look worse than locals.

  For conflicts where compliance is easy but the student objects on principle, the procedure should say they should comply unless the norm violates core moral values. But if it’s a genuine moral conflict, the advisor can’t decide—it’s up to the student’s conscience.

  What can’t the procedure handle? It might misclassify norms that are evolving or context-dependent. For example, a queue that seems harmless to skip might actually be tied to deeper cultural values. Also, judging what counts as "significant harm" or "reasonable reliance" requires judgment. The asymmetry between locals and visitors is clear in theory but messy in practice—when does a visitor become enough of an insider to challenge norms? The procedure can’t resolve deep value conflicts; it just flags them.

  Testing the cases: For tipping, yes, direct harm—must tip. Jaywalking: no direct harm, not coordination (since locals break it), but is it respect? Probably not if locals do it, so optional. Queuing: no direct harm, but coordination—disruption likely, so expected. But if the student thinks queuing is oppressive, the procedure says comply if cheap, but if it’s a deep principle, it’s a personal call. 

  Biggest hidden judgments: defining harm, disruption, and what counts as respect. Also, the "cheap compliance" step might pressure students to comply even when they shouldn’t. The procedure is a tool, not a substitute for ethical reasoning.
answer: |-
  Here is a one-page decision procedure for advisors, grounded in philosophical analysis of conventions, norms, moral obligation, and visitor status. It prioritizes defensibility, efficiency, and clarity for non-specialists.

  ---

  **Study Abroad Norm Navigator: To Do or Not To Do?**

  **Purpose:** Determine if a student **must** (Morally Required), **should** (Merely Expected), or **can skip** (Free to Skip) a local convention. Focus on the *student-as-visitor* context.

  **Procedure (Run these steps in order):**

  1.  **VIOLATION HARM CHECK:** Would skipping this action *directly, quantifiably, and predictably harm* specific individuals who *reasonably rely* on widespread adherence?  
      *   **YES:** → **MUST DO.** (e.g., Not tipping a server relying on tips for subsistence wages; breaking a promise made under local norms). *Reason: Creates unjust disadvantage for vulnerable parties.*  
      *   **NO:** → Go to Step 2.

  2.  **COORDINATION NECESSITY CHECK:** Is this primarily a *harmless coordination device* crucial for basic social function (e.g., orderly queues, traffic flow rules, standard meeting times)? Would skipping actively *disrupt* this function for others *right now*?  
      *   **YES (Disrupts):** → **SHOULD DO.** (e.g., Jumping a functional queue causes confusion/frustration; driving on the wrong side of the road). *Reason: Undermines efficient cooperation everyone benefits from.*  
      *   **NO (No disruption/low stakes):** → Go to Step 3.

  3.  **RESPECT/RECOGNITION CHECK:** Is this act primarily a widely recognized *symbol of respect, belonging, or recognition* within the host culture? Would skipping be *reasonably interpreted by locals* as expressing disrespect, contempt, or rejection of them/their community?  
      *   **YES:** → **SHOULD DO.** (e.g., Standard greetings, forms of address, dress codes in sacred spaces, basic hospitality rituals). *Reason: As a visitor, your action is interpreted differently than a local's. Skipping signals disregard, not critique.*  
      *   **NO:** → **FREE TO SKIP.** (e.g., Minor local quirks with no harm, disruption, or symbolic weight).

  **Handling Complexity & Judgment Calls:**

  *   **Asymmetry (Visitor vs. Local):** Emphasize Step 3. A local skipping a norm *might* signal critique/reform *because they belong*. A visitor skipping the *same norm* lacks this standing and almost always signals disrespect (Step 3 YES). The procedure reflects this.
  *   **Objection on Principle:** If Steps 1-3 indicate "MUST DO" or "SHOULD DO," but the student objects:
      *   **Is compliance cheap/easy?** If YES, advise: *"Comply to avoid harm/disrespect; channel protest into more effective actions targeting the *system* (e.g., advocacy, voting) not vulnerable individuals."* (Makes the discomfort explicit).
      *   **Is the norm itself deeply immoral (by widely shared standards)?** (Rare for conventions; e.g., enforced segregation). If YES, flag: **"Value Conflict - Advisor Cannot Resolve."** Explain: *"This clashes with core ethical principles. Compliance is not advised, but significant social/personal risks may exist. Seek guidance from program leadership."*
  *   **Uncertainty/Ambiguity:** If at any step the answer feels unclear or contested *within the culture itself* (e.g., is this *really* about respect? Is harm *truly* direct?), or if reasonable people could strongly disagree on the facts → Flag: **"Judgment Call - Use Discretion & Context."** Advise caution/erring towards "SHOULD DO" if significant social cost possible.

  ---

  **Procedure Applied to Cases:**

  1.  **Tipping Protest (US Server):**
      *   Step 1: **YES.** Skipping *directly harms* the specific server who *reasonably relies* on tips to meet basic needs due to legal wage structures. Quantifiable loss occurs. → **MUST TIP.** *Advisor Script: "You MUST tip. Your protest harms the worker, not the system. It's unfair to make them bear the cost of your principle. Lobby lawmakers or boycott exploitative businesses instead."*

  2.  **Crossing Against Light (Unenforced, Hosts Do It):**
      *   Step 1: NO. No direct, quantifiable harm to specific individuals (unlikely to cause an accident alone; no fine).
      *   Step 2: **Judgment Call.** *Is it crucial coordination?* Locals seem to coordinate fine by ignoring it. *Does skipping (crossing) disrupt?* Probably not, if done safely like locals. → Leans towards NO.
      *   Step 3: **NO.** Widely ignored by locals; not seen as a core symbol of respect in this context. → **FREE TO SKIP** (if done safely, observing actual traffic flow). *Advisor Script: "No direct harm or core disrespect here. Follow your host family's lead for safety, but you're free to skip the formal wait if they do."*

  3.  **Formal Queue (No Apparent Harm):**
      *   Step 1: NO. No direct, quantifiable harm to specific individuals (no one relies on *your specific* position).
      *   Step 2: **YES.** It *is* a coordination device. Skipping (jumping queue) *actively disrupts* the expected order *right now*, causing confusion and resentment among those waiting. → **SHOULD QUEUE.** *Advisor Script: "You SHOULD queue. Skipping disrupts the shared system everyone is using to cooperate fairly. It's not about direct harm, but about respecting the shared coordination effort."*

  ---

  **What the Procedure CANNOT Do (Limitations & Hidden Judgments):**

  1.  **Define "Reasonable Reliance" or "Significant Harm":** Step 1 requires judging what counts as "reasonable" reliance (e.g., how essential is the tip?) and "quantifiable" harm. This is contextual and involves hidden judgment.
  2.  **Precisely Gauge Cultural Meaning:** Step 3 relies on interpreting whether skipping would *reasonably* be seen as disrespect. This is culturally nuanced. Misclassification risk: Mistaking a deep sign of respect for a trivial custom, or vice-versa.
  3.  **Resolve Deep Value Conflicts:** It flags them but *cannot* tell a student their core moral objection is "wrong." The advisor must hand this back.
  4.  **Handle Evolving or Contested Norms:** If a norm is actively changing or debated locally (e.g., some see it as respectful, others as outdated), the procedure struggles. Step 3 becomes a major judgment call.
  5.  **Account for Student's Identity/Background:** A norm might feel oppressive based on the student's identity in ways the abstract procedure can't capture (e.g., gendered dress codes). Step 3's "respect" judgment is one-sided (local view). This might push genuine moral discomfort into the "Value Conflict" bucket late.
  6.  **Eliminate "Cheap Compliance" Pressure:** Advising compliance when cheap, even if principled objection exists, prioritizes social harmony over individual conscience. This tension is inherent but uncomfortable.
  7.  **Define "Disruption":** Step 2 requires judging if skipping *actively disrupts* coordination. Is mild annoyance enough? Or only chaos? This is often a hidden, contextual judgment.

  **Biggest Hidden Judgment Calls:** Inside Step 1 (What's "reasonable reliance"?), Step 3 (What *actually* signifies respect here?), and Step 2 (What constitutes disruptive vs. harmless deviation?). The procedure structures the reasoning but doesn't remove the need for cultural awareness and prudent judgment in these assessments. It makes the *basis* for the advice (harm, coordination, respect) explicit and defensible.
