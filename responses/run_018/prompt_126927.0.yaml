answer: |-
  Here are five numbered points addressing your query:

  1.  **Privacy Theory:** The two-track practice implicitly combines a **boundary-based view** (masking physically blocks information capture, establishing privacy as a spatial/visual barrier) with a **control-based view** (masking allows the individual to actively *choose* to prevent capture, exercising control over their biometric data).
  2.  **Privacy/Opt-in vs. Anonymity/Ecology:** Treating masked travelers differently suggests anonymity is **primarily an ecological condition** contingent on environmental factors (like mask-wearing norms or technical limitations); privacy becomes something you actively *create* in the system by masking, rather than an inherent, default property right you opt *out* of when unmasked.
  3.  **Long-Term Storage Justification:** Retaining scans for years undermines the stated purpose of "immediate security" and presupposes that biometric data possesses **enduring instrumental value for the state**, likely rooted in potential future surveillance, identification needs, or population analytics beyond the initial security context.
  4.  **Face as Relation vs. Fixed Essence:** Long-term storage treats the facial template as a **fixed, essential identifier**, detaching it from the dynamic context of the social interaction at the checkpoint; this opposes seeing the face primarily as part of a situated social relation where recognition serves an immediate, specific purpose.
  5.  **Commitments Abandoned for 24-Hour Deletion:** Replacing the system with 24-hour deletion would require abandoning the core commitment that the **state possesses an inherent, perpetual right to archive identifiable citizen data** for latent future use, instead prioritizing the individual's contextual presentation of identity and limiting state power to immediate operational necessity.
