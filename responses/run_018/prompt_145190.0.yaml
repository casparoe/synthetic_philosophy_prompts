    "essentialist_problem": "Circularity: 'Western values' define the West, which defines the values. Exclusion: Internal dissent (e.g., anarchism, pacifism) is erased to maintain a false unity.",
    "family_resemblance_fix": "Solves circularity by abandoning a fixed essence for overlapping, contingent traits. Cost: Blurs boundaries (what/who counts as 'Western'?), weakens normative distinctiveness, makes the term primarily descriptive/geopolitical.",
    "normative_jurisdiction_tension": "Resolved by an implicit theory of progress: Values are universal, but the West is the vanguard realizing them. This allows simultaneous universal claims (applying everywhere) and particular claims (marking Western identity/superiority).",
    "verdict_on_coherence": "Lacks conceptual coherence as an essentialist cluster. Functions effectively as a flexible rhetorical/political tool for identity, boundary-marking, and justification, relying on vagueness.",
    "feature_doing_the_work": "The hidden theory of moral/civilizational progress enabling the universal/particular double-move and providing a flawed escape from pure essentialist circularity."
  }
