  Below is a decision tree designed to guide students through Hempel's ravens paradox, anchored in concrete cases and avoiding technical jargon. The tree starts with intuitive judgments about evidence and leads to one of six major positions (or flags inconsistency/unexplored cases). Each branch is phrased as a question about specific observations or principles, and leaves name the position, state which of the three claims is rejected, and note an awkward commitment. Pairs that may collapse are flagged at the end.

  ---

  **Hempel's Ravens Paradox: A Decision Tree**  
  *Answer the questions based on your intuitions about evidence and confirmation.*

  1. **In the wild, you observe a black raven. Does this observation confirm "All ravens are black"?**  
     - **Yes** → Go to 2.  
     - **No** → **Leaf 1: Unexplored**  
       *Rejects the instance condition (even for straightforward cases).  
       Awkward: Few defend this, as it denies basic scientific reasoning.*

  2. **On a nature walk, you randomly observe a white shoe (non-black, non-raven). Does this observation confirm "All ravens are black"?**  
     - **Yes** → Go to 3.  
     - **No** → Go to 4.  

  3. **Is confirmation an all-or-nothing logical relation, or a matter of degrees (e.g., probability shifts)?**  
     - **All-or-nothing** → **Leaf 2: Hempel's satisfaction-criterion view**  
       *Rejects the intuitive judgment.  
       Awkward: White shoes genuinely confirm, but intuition misled by background knowledge.*  
     - **Degrees** → Go to 3a.  

     **3a. An indoor ornithologist selects an object because it is non-black; it turns out to be a white shoe. Does this observation confirm "All ravens are black"?**  
       - **Yes (even weakly)** → **Leaf 3: Bayesian view (I. J. Good)**  
         *Rejects the intuitive judgment (quantitatively).  
         Awkward: White shoes always confirm, but often negligibly.*  
       - **No** → **Leaf 4: Sampling-procedure view**  
         *Rejects the instance condition (when selection biases exist).  
         Awkward: Identical observations confirm or not based on sampling method.*

  4. **Does the randomly observed white shoe confirm "All non-black things are non-ravens" (logically equivalent to "All ravens are black")?**  
     - **Yes** → Go to 4a.  
     - **No** → Go to 5.  

     **4a. Since the two hypotheses are equivalent, must the white shoe confirm "All ravens are black"?**  
       - **Yes** → **Leaf 5: Inconsistent cell**  
         *Cannot hold all three claims: violates logic.*  
       - **No** → **Leaf 6: Equivalence-denial view**  
         *Rejects the equivalence condition.  
         Awkward: Logically equivalent hypotheses need not share evidence.*

  5. **Must logically equivalent hypotheses (like "All ravens are black" and its contrapositive) always be confirmed by the same evidence?**  
     - **Yes** → **Leaf 7: Goodmanian projectibility view**  
       *Rejects the instance condition (for non-projectible predicates).  
       Awkward: Projectibility (e.g., "raven") is vague and contextual.*  
     - **No** → **Leaf 8: Unexplored**  
       *Rejects both instance and equivalence conditions.  
       Awkward: Underdeveloped; no major position fits.*

  ---

  **Key to Claims Rejected:**  
  - **Instance condition**: Universal generalizations are confirmed by positive instances.  
  - **Equivalence condition**: Logically equivalent hypotheses share all confirming evidence.  
  - **Intuitive judgment**: White shoes do *not* confirm "All ravens are black".  

  **Taxonomy Limits & Collapsing Pairs:**  
  - **Bayesian vs. Sampling-procedure**: These collapse without Q3a (selection makes evidence *fully inert*). The tree distinguishes via "deliberate selection" (Sampling: no confirmation; Bayesian: weak confirmation).  
  - **Goodmanian vs. Equivalence-denial**: These may blur if both cite "unnatural predicates" (e.g., "non-black"). The tree separates via Q4 (whether white shoes confirm the *contrapositive*).  
  - **Unexplored cells**: Leaf 1 (rejects black-raven confirmation) and Leaf 8 (rejects both instance/equivalence) lack established positions.  
  - **Incoherence**: Leaf 5 is inconsistent and cannot be held.  

  **Output Summary:**  
  - **6 named positions**, **2 unexplored/inconsistent cells**.  
  - **7 decision nodes**, **8 leaves** (within two-page scope).  
  - Collapses avoided via: (1) Selection-procedure test (Q3a), (2) Contrapositive confirmation (Q4).  

  This tree isolates core solutions while respecting the trilemma’s logical structure. Use your path to identify and critique your preferred resolution.
