answer: |-
  Here is a Q&A preparation sheet tailored to your audience, argument, and epistemic requirements. Objections are ranked by potential damage, with replies designed to acknowledge limitations while protecting your core thesis.

  **Preemptive Concession (Deliver in Opening Remarks):**
  *   **What to concede:** "Before we begin, I want to acknowledge a valid point likely on many minds: the core *insight* that competition can lead to collectively undesirable outcomes, captured evocatively by the 'Moloch' metaphor, is not itself novel. Scholars of the prisoner's dilemma, collective action problems, regulatory competition, and destructive entrepreneurship have long explored this territory. My aim isn't to claim discovery of the phenomenon, but to argue that bundling distinct pathological dynamics under a single, evocative label obscures crucial differences in mechanism and, critically, in the *type of intervention* most likely to be effective."
  *   **Why & How:** This disarms the "old wine" critique upfront. It concedes historical precedence without surrendering your core claim about misdiagnosis and misguided remedies. It frames your contribution as analytical refinement (taxonomy, diagnostic tool, remedy mapping) rather than phenomenon discovery.

  **Objections & Replies (Ranked by Damage):**

  1.  **The Formal Theorist (High Damage - Attacks Foundations):**
      *   **Objection (Phrased Authentically):** "You present this 'paralysis test' as a sorting mechanism, but without specifying an equilibrium concept or modeling the strategic interactions explicitly, it's merely descriptive storytelling, not a mechanism. How can you claim to identify distinct 'failure modes' without defining the game, the solution concept (Nash? Subgame Perfect?), and showing how the paralysis intervention changes the equilibrium outcome? Your 'test' assumes counterfactuals that likely violate incentive compatibility. This lacks the rigor needed to make causal claims about mechanisms."
      *   **Reply (90 sec):** "You're right to demand rigor. The paralysis test is deliberately framed as an *empirical diagnostic heuristic*, inspired by comparative statics, not a complete game-theoretic model. Its purpose is to generate testable hypotheses and guide where formal modeling (like the appendix game) should focus. For instance, in transfer cases, the test predicts identifiable winners (rent recipients) whose gains offset racer losses – a falsifiable implication. The appendix offers a starting point for attrition's viability threshold. The test's value is pragmatic: forcing us to ask *who benefits from the sacrifice* when escalation stops, a question often obscured by the Moloch frame. My claim is that this question reveals crucial differences missed by a monolithic 'competition is bad' view."
      *   **Where Reply is Soft:** "If the paralysis test is just a heuristic, how do you ensure its application isn't arbitrary? Doesn't its predictive power *depend* on the implicit game structure you haven't specified, making your classifications circular?" (Exposes reliance on implicit, untested assumptions).
      *   **Epistemic Flag:** Asserting the paralysis test as a *useful heuristic* is defensible; claiming it *rigorously identifies mechanisms without modeling* is **contested/aspirational**. Concede its status as a diagnostic tool needing formal underpinning.

  2.  **The Comparativist (Federalism/Reg Comp) (High Damage - Attacks Empirical Anchor):**
      *   **Objection (Phrased Authentically):** "Your key case, tax/regulatory competition, is presented as primarily 'transfer,' minimizing aggregate waste. But the empirical record is mixed. While some studies find limited aggregate harm, others show significant underprovision of public goods, negative spillovers, and 'ruinous' competition in specific sectors or for specific firms/labor. Doesn't dismissing dissipation too readily ignore this evidence? And how does your framework handle cases where competition *both* transfers rents *and* causes inefficient under-provision (e.g., degraded environment impacting everyone, including the 'winner')?"
      *   **Reply (90 sec):** "Excellent point. The empirical complexity is why the taxonomy is crucial. I argue the *dominant mechanism* in most jurisdictional competition is transfer – the gains to mobile capital often closely match jurisdiction losses. However, I fully concede **(Epistemic Flag: Settled by mixed evidence)** that dissipation *can* occur, especially through underprovision of non-excludable goods or negative externalities. The paralysis test helps diagnose: if preventing tax cuts makes *all* jurisdictions better off *and* capital no worse (perhaps due to higher quality public goods), it suggests dissipation was significant. My core claim is that Moloch framing obscures this distinction, leading to misplaced coordination solutions when the real target might be capital mobility rules or spillover internalization. The framework *accommodates* hybrid cases."
      *   **Where Reply is Soft:** "If dissipation *can* be significant in transfer-labelled cases (like underprovision), doesn't that undermine your sharp remedy distinction? When should we prioritize 'targeting the rent' vs. coordination?" (Exposes potential fuzziness in applying the taxonomy to complex reality).
      *   **Epistemic Flag:** Asserting transfer as the *dominant mechanism* in standard tax competition models/literature is **defensible but contested** (evidence is mixed). Concede the existence of dissipation elements/hybrids readily.

  3.  **The Political Theorist (Foucauldian) (High Damage - Attacks Premises):**
      *   **Objection (Phrased Authentically):** "Your entire analysis presupposes precisely what needs to be interrogated: autonomous, preference-driven agents operating within pre-given constraints. This naturalizes the competitive subject and the 'viability thresholds' you invoke as neutral features of the landscape. Aren't these preferences, the very drive to 'compete,' and the thresholds themselves produced by the same disciplinary power structures and discourses that the Moloch metaphor, however clumsily, gestures towards as a *constitutive* force? Doesn't your framework foreclose examining how competition *produces* the agents and subjectivities you take as your starting point?"
      *   **Reply (90 sec):** "That's a profound challenge. You're right that my framework operates within a rational-choice tradition that takes agents and preferences as exogenous. I don't claim to explain the *genealogy* of competitive drives or how thresholds become socially embedded norms – that's a vital project your lineage excels at. My more limited aim is diagnostic: *given* that actors *experience* themselves as facing competitive pressures and viability thresholds – a social fact observable in interviews, policy debates, and individual struggles (like unpaid internships) – how can we best understand the *logic* of the resulting dynamics and identify effective policy levers *within that experienced reality*? The Moloch frame, I argue, is often a poor guide even at this level."
      *   **Where Reply is Soft:** "But doesn't accepting the 'experienced reality' of competition as your starting point implicitly endorse and reproduce the very power structures that create that experience? Can your 'remedies' (like raising the floor) ever be more than palliative within the system that produces the pathology?" (Exposes the fundamental incompatibility of premises; no answer satisfies both frameworks).
      *   **Epistemic Flag:** Asserting that actors *experience* competitive pressures/thresholds is **settled observation**. Asserting that rational-choice analysis is *sufficient* or that remedies operate *only* within the given frame is **deeply contested theory**. Concede the limitation of scope explicitly.

  4.  **The Economic Historian (Anti-Presentist) (Medium-High Damage - Attacks Novelty):**
      *   **Objection (Phrased Authentically):** "This taxonomy feels familiar. Isn't 'dissipation' just Good Old Fashioned rent-seeking or deadweight loss? 'Transfer' sounds like standard analysis of monopoly rents or tax incidence. 'Attrition' echoes Schumpeterian creative destruction or analyses of firm survival under fixed costs. What's genuinely new here beyond repackaging established concepts with a flashy metaphor (Moloch) and a new label (paralysis test)? Aren't you just telling us to do careful institutional analysis – which good political economists have always done?"
      *   **Reply (90 sec):** "You're absolutely right that the *components* draw on deep wells. The novelty, I argue, lies in the *synthesis* and the *diagnostic*. Bundling these distinct dynamics under 'Moloch' is pervasive *now* and leads to specific, often misguided, calls for coordination remedies. The paralysis test provides a simple, applied heuristic to quickly sort observed competitive pathologies: *Ask who gets the sacrificed value if escalation stops*. This forces explicit consideration of whether the problem is pure waste (dissipation), redistribution (transfer, target the rent), or a survival imperative requiring floor-raising (attrition). It directly challenges the one-size-fits-all Moloch-inspired 'solution' of coordination."
      *   **Where Reply is Soft:** "If the components are old, and the synthesis is just 'do careful analysis,' isn't the contribution primarily rhetorical – combating a currently popular *metaphor*? Does the paralysis test *actually* lead to different conclusions than standard institutional analysis would?" (Exposes risk that the taxonomy/test is just a pedagogical device).
      *   **Epistemic Flag:** Asserting the *current prevalence* of the undifferentiated Moloch framing is **settled observation** in certain circles (e.g., rationalist/EA). Asserting the paralysis test is a *novel and necessary* diagnostic tool is **contested/aspirational**. Concede deep roots of the components.

  5.  **The Formal Theorist #2 / Behavioralist (Re: Credential Case) (Medium Damage - Attacks Mechanism):**
      *   **Objection (Phrased Authentically):** "Take your elite professions case. You frame unpaid internships as 'attrition,' driven by a viability threshold. But is the mechanism really about avoiding *elimination*, or is it about *signaling* quality/commitment in an opaque labor market? If it's signaling (a transfer to employers getting free labor/screening?), why wouldn't a coordination solution (e.g., sectoral bans on unpaid work) work? Your paralysis test – making unpaid toil impossible – could simply shift the signaling burden elsewhere (e.g., even more elite degrees), suggesting it's more transfer/dissipation. How does your framework definitively distinguish attrition from costly signaling?"
      *   **Reply (90 sec):** "Critical point. Signaling is absolutely a factor. The attrition lens applies most strongly when the *cumulative burden* of escalating credentials (time, cost, stress) pushes capable individuals *out of the pipeline altogether* before even reaching the signaling stage – a genuine loss of potential contributors. Think PhD dropouts deterred by years of low pay/high uncertainty, not just who gets the top job. The paralysis test here: if unpaid work vanished, *would the profession collapse or radically shrink* (attrition), or would employers find other (potentially cheaper/more efficient) signals? If the latter, it leans transfer/dissipation. My argument is Moloch framing obscures this distinction, leaping to coordination (ban unpaid work) which might just shift the burden, whereas addressing attrition requires tackling pipeline costs/survival (e.g., liveable stipends)."
      *   **Where Reply is Soft:** "But how do you *empirically* disentangle the 'pushed out of pipeline' attrition effect from individuals simply choosing other paths because the signaling ROI is too low? Doesn't your 'attrition' just describe the lower tail of a signaling cost distribution?" (Exposes empirical challenge in cleanly separating mechanisms).
      *   **Epistemic Flag:** Asserting that credential escalation *can* create genuine viability thresholds excluding potential talent is **defensible**. Asserting it's the *primary* mechanism over signaling in specific cases like elite professions is **based on thin/contestable evidence**.

  6.  **The Comparativist #2 / Behavioralist (Re: Remedies) (Medium Damage - Attacks Practicality):**
      *   **Objection (Phrased Authentically):** "You criticize coordination solutions (clubs, ceilings, commitments) for transfer/attrition cases. But politically, 'targeting the rent' (e.g., global capital taxation) or 'raising the floor' (e.g., universal basic income or strong labor standards) often faces massive collective action problems itself – arguably *bigger* ones than sectoral coordination. Isn't your critique of coordination remedies somewhat hollow if the alternatives you propose are even less feasible? Doesn't the Moloch framing, for all its flaws, at least motivate *some* action?"
      *   **Reply (90 sec):** "You highlight a crucial tension: political feasibility. My argument is analytical, not political: coordination is often the *wrong tool for the job*, even if it's the easiest tool *to attempt*. Using it for transfer or attrition might be ineffective or counterproductive (e.g., price ceilings creating shortages in attrition). Acknowledging the true mechanism clarifies the nature of the political challenge: for transfer, it's overcoming the power of rent-recipients; for attrition, it's building coalitions for broad-based floor-raising. Knowing the enemy is half the battle. Misdiagnosing via Moloch can lead well-intentioned coordination efforts to fail (as past race-to-the-bottom arguments did), sapping energy for the harder but necessary fights. Feasibility is separate from correctness."
      *   **Where Reply is Soft:** "But if the 'correct' remedies are politically impossible, and coordination is possible (even if suboptimal), isn't some action better than none? And can't coordination *sometimes* be a stepping stone (e.g., local minimum wage laws)?" (Exposes tension between analytical purity and pragmatic reform).
      *   **Epistemic Flag:** Asserting that misdiagnosis leads to ineffective solutions is **defensible logic**. Asserting that coordination remedies are *generally* ineffective for transfer/attrition is **based on contestable readings** of cases (e.g., some regulations *do* work).

  7.  **The Behavioralist (Imitation/Social Influence) (Lower Damage - Curious Extension):**
      *   **Objection (Phrased Authentically):** "Your framework focuses on material sacrifices and rational(ish) competition. But what about purely imitative or normative escalation driven by social influence, not direct material threat? Think 'overwork porn' in consulting, where the sacrifice (sleep, health) isn't clearly buying survival or relative advantage, but conformity to a group norm. Does this fit dissipation? Or does your 'attrition' concept stretch to include social viability thresholds? How does social influence interact with your three types?"
      *   **Reply (90 sec):** "Fascinating point. Purely normative/imitative escalation without clear competitive pressure or viability threat is a great candidate for the *dissipation* box – value (wellbeing, time) is destroyed for no one's gain, just adherence to a norm. The paralysis test fits: if no one could overwork (and norms adjusted), everyone might be better off. Social influence often *amplifies* the core mechanisms: in transfer, norms might legitimize rent extraction; in attrition, norms enforce the viability threshold ('paying your dues'). My framework focuses on the underlying competitive *structure* generating the pressure; social influence is a powerful transmission belt, but the paralysis test helps diagnose the structural root."
      *   **Where Reply is Soft:** "But if norms *constitute* the competitive landscape (e.g., defining what 'viability' means), doesn't this blur your categories? Can a purely normative escalation *create* a viability threshold where none materially existed?" (Exposes potential for social construction to complicate the structural types).
      *   **Epistemic Flag:** Asserting that purely normative escalation *can* be dissipation is **defensible extension**. How norms interact with/reshape the three types is **open for development**.

  **The Crucial Reply That Must Land:**
  *   **The Paralysis Test as Diagnostic:** "The core takeaway is this: When you see a competitive dynamic described as a 'race to the bottom' or 'Moloch trap,' don't just reach for coordination. Apply the paralysis test mentally: *If the specific form of escalation became impossible, holding other factors fixed, who would gain and who would lose, and would the activity continue?* If everyone gains, coordination might help (dissipation). If clear winners/losers emerge with little net change, target the rent (transfer). If the activity stops or radically contracts, focus on raising the floor (attrition). This simple question cuts through the Moloch fog and points to more effective interventions." *This must resonate as a practical, clarifying tool.*

  **The Objection You Hope Nobody Asks (The Achilles' Heel):**
  *   **The Objection:** "Your paralysis test requires holding 'everything else fixed' – preferences, technology, population, prize structure – while only stopping the escalation. But isn't this fundamentally unrealistic? Preferences might adapt to the new constraint. Technology might develop to circumvent it. The population of players might change endogenously. The prize structure might morph. Doesn't this make the counterfactual predictions of your test highly unstable and contingent on auxiliary assumptions you haven't specified, rendering your classifications arbitrary?"
  *   **Why No Good Answer:** This strikes at the core counterfactual problem inherent in *any* mechanism-based causal claim, but it's particularly acute for a heuristic test not grounded in a fully specified dynamic model. You lack a general theory of how "everything else" *would* change if escalation were paralyzed. Your reply (pointing to the heuristic value and the appendix model) feels inadequate against this deep methodological challenge. It exposes that the test's validity depends heavily on context-specific judgments about what "held fixed" realistically means, which is hard to systematize.
  *   **Honest Note:** "That's a profound methodological challenge. You're right, the 'ceteris paribus' assumption is always heroic. The test works best when the escalation is a salient, discrete practice (like unpaid internships, specific tax breaks) and the 'fixed' factors are relatively sticky institutions or technologies. In fluid, complex systems, the counterfactual is murkier. The test is a pragmatic starting point for diagnosis, forcing explicit consideration of the sacrifice's destination, but its predictions are indeed contingent and require careful contextual judgment. I don't have a perfect solution to the general counterfactual problem – few do – but I argue the test still adds value by structuring the inquiry better than the Moloch frame."

  **Point for Paper Revision (Based on Q&A):**
  *   **Revise:** Sharpen the definition and operationalization of the **viability threshold** in the attrition category, especially in the credential-building case.
  *   **Why:** This was a soft spot exposed in objections (Formal Theorist #2, Comparativist #2). The current description risks being seen as amorphous or conflated with signaling. The revision should:
      *   Explicitly distinguish *threshold effects* (falling below = exit) from *continuous gradients* (doing worse but still playing).
      *   Provide clearer empirical indicators for identifying a genuine threshold (e.g., dropout rates, bankruptcy statistics, quantifiable performance cliffs).
      *   Strengthen the link between the paralysis test outcome ("activity stops") and the presence of a viability threshold in the appendix model.
      *   This directly addresses Formal Theorist concerns about mechanism rigor and Comparativist concerns about empirical identification, strengthening the attrition pillar of your argument.

  **Good luck with the workshop!** Remember to ground your replies in your core diagnostic tool (paralysis test) and its practical implication: *different problems need different solutions.*
