  For replies, each needs to be concise and acknowledge limitations. For example, replying to the formal theorist by admitting the model's simplicity but stressing heuristic value, while noting that a follow-up could question why the paralysis test is valid without equilibrium.

  Preemptive concessions are key. The user should acknowledge that dissipation cases exist but aren't the majority, preserving the main argument. The crucial reply is the paralysis test as an empirical diagnostic tool—it must land to validate the taxonomy.

  The feared question might be about the paralysis test's applicability to real-world cases where "holding everything fixed" is unrealistic. The user lacks a solid answer because isolating variables is messy, which needs honest admission.

  For paper revision, the attrition model should better define viability thresholds to satisfy formalists and comparativists.

  Epistemic flags: Highlight where claims are based on thin evidence (e.g., rarity of dissipation) or contested theory (e.g., viability thresholds). Concessions about the framework's limitations should be framed as ongoing debates, not settled facts.

