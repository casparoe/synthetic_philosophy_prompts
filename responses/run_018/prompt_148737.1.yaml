  does this hang together? i feel like (5) and (6) are pulling in different directions - if the disconnect in (6) drives the intuitions in (4), then explaining it should dissolve the problem, not leave it untouched. and is (3) actually compatible with (6) without smuggling in mystery? also check whether my zombie stance in (2) is consistent with (1) given how i treat conceivability. lay out the real tensions, the fake ones that dissolve on inspection, and tell me what's the cheapest single revision if i have to drop something.
