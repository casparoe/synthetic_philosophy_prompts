  The user's deeper need seems to be understanding the philosophical underpinnings and whether this duality is justifiable or hypocritical. They might want to present this to students or explore it in their research. So I need to reconstruct the implicit theory, critique its coherence, and consider alternatives. The implicit theory likely combines institutional division of labor with a special status for religion, influenced by historical context. But philosophically, it's on shaky ground because equating 'religious' with 'conscience' would be more consistent, yet that's not how laws are structured.

