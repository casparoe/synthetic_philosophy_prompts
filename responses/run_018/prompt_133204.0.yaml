prompt: |-
  hey, i'm on the product ethics panel at my job — backend dev, zero formal philoshophy training, just picked up some metaethics from podcasts. we have to vote next thursday: should our internal promotion audit keep using one universal fairness metric (same statistical weighting for peer sentiment and commit frequency across every team) or switch to a case-by-case review where managers write a narrative justification for every exception? side A says if you let context shift the weight of reasons you're just dressing up bias in fancy language. side B says applying the same formula to a legacy maintainer and an AI researcher is morally blind — they talk about holism of reasons, how a factor's importance depends on teh whole situation. i need a memo i can send around before teh meeting: reccomend one path with a concrete rollout timeline, and take teh strongest argument from teh losing side seriously instead of hand-waving it. please no bibliography or list of readings, i just need something actionable for the committee.
reasoning: |-
  Okay, the user is on a product ethics panel at their job as a backend developer without formal philosophy training. They need to prepare a memo for their committee about whether to use a universal fairness metric or case-by-case reviews for internal promotion audits. The vote is coming up soon, so they need something actionable.

  The user mentioned two sides: Side A argues that a universal metric prevents bias by applying the same standards across all teams. Side B believes that context matters, especially for roles like legacy maintainers versus AI researchers, where different factors should be weighted differently. The user wants a recommendation with a rollout timeline and a serious consideration of the strongest counterargument without dismissing it.

  First, I need to assess the core conflict. Universal metrics offer consistency and reduce bias, but they might ignore legitimate contextual differences. Case-by-case approaches allow flexibility but introduce subjectivity, which could lead to bias. The user's role involves ethics, so the solution must balance fairness and practicality.

  The user’s explicit request is for a memo that recommends one path, provides a timeline, and addresses the strongest counterargument. Their deeper needs might include wanting to appear informed despite lacking formal training, ensuring the decision is defensible, avoiding backlash from either side, and making the process manageable for the committee.

  Considering the potential risks: a universal metric might disadvantage specialized roles, leading to unfair promotions. On the other hand, case-by-case could create inconsistencies or perceived favoritism. The memo needs to mitigate these concerns by proposing a hybrid approach. That way, the user shows they’ve considered both sides and found a middle path.

  Hybrid solutions are often effective in ethics panels. A framework with core universal metrics plus contextual adjustments via manager narratives could satisfy both sides. The rollout timeline should be phased to allow testing and adjustments, which addresses feasibility concerns. Including validation steps like calibration committees can reduce bias in narratives.

  The strongest counterargument from Side A is that allowing contextual factors could mask bias. The response should acknowledge this seriously by implementing safeguards: mandatory training, anonymized examples, and random audits. This shows proactive measures rather than dismissal.

  The user mentioned terms like "holism of reasons," which ties into moral particularism. But since they want no bibliography, explaining concepts in simple terms is key. Emphasizing that the hybrid model uses narratives as a supplement, not a replacement, keeps the focus on structured flexibility.

  Timeline phases: immediate framework update, then pilot testing, followed by full rollout. This step-by-step approach reduces risk and allows feedback. Including a sunset clause for the pilot adds accountability, showing that adjustments are possible based on real data.

  Addressing the losing side's argument in the memo demonstrates thoroughness. Reassuring Side A that narratives have strict guidelines and oversight can alleviate fears of bias. Highlighting that the universal core remains the foundation maintains consistency.

  Finally, the user needs the memo to be concise and actionable. Avoiding jargon, using clear headings, and specifying steps helps the committee move forward. The recommendation should position the hybrid model as the balanced choice, promoting both fairness and adaptability.
answer: |-
  ## ETHICS PANEL MEMO: PROMOTION AUDIT FAIRNESS FRAMEWORK  
  **TO:** Product Ethics Panel  
  **FROM:** [Your Name], Backend Dev / Panel Member  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation: Hybrid Fairness Framework for Promotion Audits (Balancing Consistency & Context)  

  ### 1. RECOMMENDATION: ADOPT A **HYBRID FRAMEWORK**  
  **Vote for:** A **core universal metric** *plus* a **structured contextual adjustment process**.  
  **Why:** Neither pure uniformity nor pure subjectivity delivers true fairness. A hybrid approach:  
  - **Preserves objectivity** with a consistent baseline.  
  - **Acknowledges legitimate role differences** with audited flexibility.  
  - **Minimizes bias** via structure and oversight.  

  ### 2. CONCRETE ROLLOUT TIMELINE  

  | Phase       | Timeline     | Actions                                                                 | Owner               |
  |-------------|--------------|-------------------------------------------------------------------------|---------------------|
  | **Framework Design** | Next 2 Weeks | 1. Define **core universal metrics** (e.g., 60% weight: peer sentiment + commit frequency).<br>2. Draft **strict criteria** for contextual adjustments (e.g., role type, project stage, technical complexity).<br>3. Create **standardized narrative template** for managers (prompts, word limits, required evidence). | Ethics Panel + HR   |
  | **Pilot & Train** | Weeks 3-6   | 1. Run pilot with 3 diverse teams (e.g., Legacy Maintenance, AI Research, Cloud DevOps).<br>2. Mandatory **manager training**: Avoiding bias in narratives, evidence-based justification.<br>3. **Calibration Committee** formed (2 ethicists, 2 engineering leads, 1 HR) to review pilot adjustments. | HR + Engineering Ops |
  | **Full Rollout** | Week 7+     | 1. Implement hybrid framework across all teams.<br>2. **Calibration Committee reviews ALL narrative adjustments** pre-audit.<br>3. Quarterly review of adjustment patterns for systemic bias. | Ethics Panel + HR   |
  | **Sunset Clause** | 6 Months    | Full review: If adjustments show bias or inconsistency, revert to core metric *only*. | Ethics Panel        |

  ### 3. ADDRESSING THE STRONGEST COUNTERARGUMENT (FROM SIDE A)  
  **"Allowing context just dresses up bias in fancy language."**  
  *This is a serious and valid concern.* We mitigate this by:  
  - **Constraining Flexibility:** Adjustments are **not free-form**. Managers must fit justifications into predefined categories (e.g., "Research Output Impact" for AI roles) with evidence, *not* vague appeals to "context."  
  - **Blind Review:** Calibration Committee reviews narratives **anonymized** (no names/genders) alongside core metrics.  
  - **Audit Trail:** Every adjustment is documented and linked to specific criteria, enabling pattern analysis.  
  - **Zero Tolerance:** Training emphasizes: *"If your reason isn’t on the approved list, it doesn’t count. Gut feeling = bias."*  

  ### 4. WHY HYBRID BEATS THE ALTERNATIVES  
  - **Pure Universal Metric (Side A):** Ignores that a "commit" for a legacy system refactoring vs. a novel AI algorithm represents fundamentally different effort, risk, and impact. **Fairness isn’t sameness.**  
  - **Pure Case-by-Case (Side B):** Unstructured narratives *are* vulnerable to bias (confirmation, halo effect, cultural fit assumptions). They also create unsustainable workload and inconsistency.  
  - **Hybrid:** The core metric ensures we compare apples to apples *where possible*. Structured adjustments let us acknowledge when we’re comparing *apples to jet engines* – without letting managers invent new fruits.  

  ### 5. ACTION FOR COMMITTEE  
  **Vote to approve the Hybrid Framework** and delegate Phase 1 (Framework Design) to a subcommittee (suggest: [Name1], [Name2], [Name3]). This balances ethical rigor with operational reality.  

  **Bottom Line:** Ethics isn’t choosing between rules and context. It’s building rules *for* how context counts. This plan does that.  

  ---  
  **Ready for discussion/vote at Thursday’s meeting.** Let’s build an audit that’s both principled and practical.
