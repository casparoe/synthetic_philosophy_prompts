answer: |-
  Here’s the scene, focusing on tactile conflict and lived-in decay:

  The air in the Vaults tasted of damp vellum and despair. Lyra’s scarred thumb traced the raised wax seal on the Founding Charter – a blood sun eternally rising over stylized gears. The Guild’s drums pulsed outside, a rhythmic threat woven with shouted slogans: *"Honor the Architects! Preserve the Design!"* Monumental history, weaponized. They held the Charter aloft in processions, proof of their divine right to grind bones into mortar.

  Two weeks ago, Lyra had tried that. She’d dragged workers into the Hall of Heroes, pointed at the towering bronze figures – *"See? They defied!"* She’d pressed a cold replica medallion, taken from the effigy of Martel the Breaker, into Callum’s calloused hand. *"Be like him."* The next morning, she found Callum rigid by the furnaces, fist clenched around the medallion, eyes fixed on some invisible plinth, unable to swing his hammer. Others froze mid-task, mimicking the heroes’ stances, paralyzed by the weight of the past. They’d become monuments themselves.

  So she’d shifted. Swallowed by the antiquarian impulse, she’d hauled them into the lower stacks. *"Preserve the evidence,"* she’d rasped, handing out gloves. They salvaged everything: water-stained shift logs, broken contracts etched with unfair clauses, fragments of petitions scrawled on grease-stained cloth. Piles grew like malignant fungi in the corridors. Lyra sorted them, categorized them, cross-referenced them until the sheer volume choked her. She stood yesterday, holding a shard of parchment detailing a century-old grain theft, then another, then another – identical injustices layered like sediment. Which to act on? The past was a labyrinth without exit. The piles rustled, whispering indecision.

  Now, the Charter lay heavy on the scarred oak table. Not a symbol. Not evidence. Just flammable calfskin. The Guild’s drumming vibrated in her teeth. *"Honor the Architects..."*

  Lyra picked up the heavy document. The wax sun felt warm, almost alive. She walked past the frozen workers, past the whispering stacks of injustice, to the ancient incinerator chute – a black maw in the wall, once used for sensitive discards. The air here was sharp with old ash.

  She didn’t hesitate. She held the Charter over the void. Below, the faint orange glow of the city’s central furnace beckoned. This wasn’t forgetting. It was cutting the anchor chain. The past wasn’t a blueprint or a cage; it was fuel.

  A gasp came from the doorway – Tomas, clutching a salvaged ledger, eyes wide. "That’s the *Charter*!"

  "It’s kindling, Tomas," Lyra said, her voice raw. "Their monument is our noose. Their preservation is our paralysis." She felt the Charter’s stiff parchment resist, then yield. She focused on the *action*: the tearing tension in the vellum as she ripped it cleanly down the center, the satisfying crackle of the wax sun shattering on the stone floor. The halves fluttered, white wings against the chute’s darkness. She fed them in.

  Heat bloomed upwards, a sudden, dry breath against her face. A brief, fierce light flickered in the chute, illuminating the terror and dawning awe on Tomas’s face. The drums outside faltered for a single, profound beat. The air tasted different – scorched parchment and an impossible, terrifying lightness. Lyra flexed her empty hands, the phantom weight of monument and archive finally gone. Now, only the heat remained. Now, they could breathe. Now, they could burn.
