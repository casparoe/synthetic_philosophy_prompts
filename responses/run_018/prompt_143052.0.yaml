answer: |-
  Here’s a structured 90-minute plan leveraging the Fischer controversy to probe **collective moral responsibility vs. causal attribution**, using the corporate analogy as the conceptual engine. Confidence levels are noted throughout, with the least certain element flagged.

  ---

  ### **Session Goal**  
  Distinguish between *causal responsibility* (structural/systemic explanations) and *moral blameworthiness* (attributable to a collective agent) using July 1914 Germany as a test case.  

  ### **Key Boundaries**  
  - **DO NOT ADJUDICATE:** Fischer’s historical accuracy, individual leaders’ psychologies, or post-1918 treaty validity.  
  - **EXCLUDE:** Detailed military history, Balkan complexities, or later war events.  

  ---

  ### **Plan Structure & Dependency Order**  
  *(Total: 90m; Timings are flexible within blocks)*  

  #### **I. Framing the Core Problem: Collective Agency Analogy (15m)**  
  - **Activity:** Introduce the **corporate board analogy**.  
    - *Scenario:* "A modern board approves a high-risk acquisition knowing it might bankrupt competitors and destabilize an industry, prioritizing market dominance. Shareholders benefit; collateral damage is ‘acceptable risk’."  
  - **Guiding Questions:**  
    > *"Can the corporation itself (not just individuals) be held responsible? What makes it a ‘moral agent’? What criteria would shift blame from individuals to the collective?"*  
  - **Purpose:** Establishes baseline intuitions about collective intent, decision structures, and distributed knowledge.  
  - **Confidence:** High (analogy isolates key philosophical variables).  

  #### **II. Mapping to History: The July 1914 "Decision Point" (20m)**  
  - **Concrete Scenario:** **Germany’s "Blank Check" to Austria-Hungary (July 5–6, 1914)**.  
    - **INCLUDE:**  
      - Bethmann-Hollweg/Kaiser Wilhelm II’s unconditional support for AH’s war on Serbia.  
      - Awareness of likely Russian mobilization → continental war.  
      - "Calculated risk" to achieve geopolitical goals (e.g., breaking encirclement).  
    - **EXCLUDE:**  
      - Serbian nationalism, AH internal politics, or mobilization timetables *except* as factors known to German decision-makers.  
      - Versailles’ "war guilt" clause (introduce post-discussion to contrast).  
  - **Why this scenario?**  
    - Reveals *intentional agency* (choice to enable/enact aggression) + *structural pressures* (alliances, militarism).  
    - Avoids murkiness of "who shot first" or treaty impositions.  
  - **Fischer Controversy Hook:**  
    - *"Fischer argued this was not a defensive move but a bid for hegemony. How does this claim force us to rethink ‘collective intent’?"*  
  - **Confidence:** High (decision-point is well-documented and philosophically fertile).  

  #### **III. Intercepting Misconceptions via Fischer (30m)**  
  *(Sequence critical: Use Fischer to dismantle preconceptions)*  
  - **Misconception 1: "Moral Blame Requires Individual Guilty Mind"**  
    - **Interception:** After presenting Fischer’s evidence of German leadership’s conscious risk-taking.  
    - **Pivot:**  
      > *"If the Chancellor/Kaiser acted for *reasons of state* (not personal malice), does blame attach to the *office*? Does a corporation’s ‘profit motive’ excuse its board?"*  
  - **Misconception 2: "Structural Causation Dissolves Collective Responsibility"**  
    - **Interception:** When discussing Fischer’s critics (e.g., structuralists citing alliance systems).  
    - **Pivot:**  
      > *"If pressures *enabled* the war but leaders *chose* to exploit them, is Germany still blameworthy? Can a corporation blame ‘market forces’ for unethical acts?"*  
  - **Activity:** Small groups compare corporate/state features:  
    | **Corporate Feature** | **Transfer to State?** | **Why/Why Not?** |  
    |------------------------|------------------------|------------------|  
    | Decision hierarchy | Yes (chain of command) | → Focus: Legitimacy of authority |  
    | Shared goals (profit) | Partial (national interest) | → Tension: "Interest" vs. "moral duty" |  
    | Shareholder accountability | **Collapses** (no "owners" of state) | → Key friction point |  
  - **Confidence:** High (misconceptions align with common debates; analogy clarifies).  

  #### **IV. The Gap: Causal vs. Moral Attribution (15m)**  
  - **Distillation:**  
    - *Causal Responsibility:* "Germany’s actions/system *caused* the war" (Fischer’s archival evidence → mechanisms).  
    - *Moral Blame:* "Germany *as a collective agent* is culpable for unjust aggression" (requires intent + agency).  
  - **Check for Understanding (Concrete Task):**  
    > *"In 1 sentence, explain why proving Germany *caused* WWI (per Fischer) doesn’t automatically prove Germany *deserves moral blame* as a nation."*  
    - **Target Response:** *"Causation shows *how* it happened; blame requires showing the state *intended unjust harm as a collective*."*  
  - **Confidence:** High (task isolates the core conceptual gap).  

  #### **V. Conclusion: Why Versailles’ War-Guilt Clause is Inadequate (5m)**  
  - **Key Point:** Treaties assign liability; they don’t *philosophically resolve* if blame can attach to a nation *as a collective agent*.  
  - **Final Question:**  
    > *"Does holding Germany ‘responsible’ in 1919 mean the same thing as holding a corporation liable for damages? Where does the analogy fail?"*  

  ---

  ### **Least Confident Element**  
  **Corporate Analogy Sufficiency**  
  - **Why?** States wield violence/sovereignty in ways corporations cannot; "national interest" is more normatively complex than profit. Risk of oversimplifying moral stakes.  
  - **Mitigation:** Stress this is a *heuristic*, not equivalence. Flag sovereignty/legitimacy as collapse points during group work.  

  ---

  ### **Why This Works**  
  1. **Analogy-first approach** avoids historical overload while creating "conceptual friction."  
  2. **July 1914 decision** isolates agency without requiring archival expertise.  
  3. **Misconceptions intercepted** at points where Fischer’s evidence naturally challenges them.  
  4. **Corporate-state comparison** makes abstract philosophy tangible.  
  5. **Versailles clause** is deliberately deferred to prevent reductive legalism.  

  **Confidence Overall:** 8/10. Structure ensures philosophy drives historiography; analogy sustains engagement. Adjust timings based on group dialogue intensity.
