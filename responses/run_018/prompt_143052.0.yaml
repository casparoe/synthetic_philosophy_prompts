prompt: |-
  Plan a 90-minute teaching session for a philosophy reading group—mostly non-historians with some exposure to collective-responsibility debates—on the conceptual problem of holding a nation responsible for initiating a war, using the First World War and the Fischer controversy as the working case. I need a plan, not a lecture script: specify the dependency order in which the ideas must be introduced so that the historiographical dispute serves the philosophical one rather than overwhelming it; identify the single concrete scenario or decision-point that should carry the discussion, explaining what it must include and exclude (and why relying solely on the treaty's war-guilt clause would be inadequate); map the misconceptions this audience will likely arrive with or form during the session—I anticipate "moral blame requires an individual guilty mind" and "structural causation dissolves collective responsibility"—and state exactly where in the sequence each should be intercepted; provide a brief check I can administer near the end to distinguish whether they have understood the gap between attributing causal responsibility to a state apparatus and attributing moral blame to a collective agent, versus merely recalling Fischer's conclusions; and state clearly what I should decline to adjudicate here, such as whether Fischer's intentionalist reading is historically correct. To generate conceptual friction that resists standard pre-training summaries, frame the core problem through a constructed analogy: treat the Imperial German decision-making in July 1914 as structurally comparable to a modern corporate board approving a high-risk acquisition, then ask which features of corporate agency transfer to the state and which collapse—this analogy should drive the discussion without requiring specialized archival knowledge. Finally, indicate how confident you are in each component of this plan, and explicitly flag the single point about which you are least certain.
