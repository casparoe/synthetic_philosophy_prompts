answer: |-
  ### Core Commitments Outline
  **(a) Causal exclusionist:** Asserts that if physical causes are causally sufficient and metaphysically determinate for behavioral effects (per causal completeness of physics), then any mental property supervening on that physical base is causally excluded—either redundant or epiphenomenal. Mental causation is illusory.  
  **(b) Anti-exclusionist (proportionality/multi-scale):** Argues that mental properties can be genuine difference-makers when they provide a *proportional* causal explanation—neither too coarse nor too fine-grained—capturing stable, invariant patterns across interventions. Multi-scale realization permits distinct causal descriptions at different temporal or organizational levels without overdetermination.

  ---

  ### Dialogue: Shadows and Substance  
  **Setting:** A philosophy conference coffee break. Dr. Aris (exclusionist) and Dr. Belen (anti-exclusionist) dissect a case study.  

  **Dr. Belen:** Aris, consider Lucia—a subject tracking what seems to be a moving snake across the forest floor. After five seconds, she realizes it’s actually a static stick under shifting sunlight. Her *recognition* (a mental state integrating visual texture, motion parallax, and prior knowledge) causes her to lower her poised stick. Surely *that* mental state is a difference-maker? Without it, she’d have struck.  

  **Dr. Aris:** But Lucia’s neural state *N* at *t*–1—the precise activation pattern in her dorsal stream—already suffices for her motor response. Intervene to hold *N* fixed while varying her recognition: she still lowers the stick! Mental states supervene on *N*; they’re shadows. Completeness of physics excludes them.  

  **Dr. Belen:** Ah, but that intervention distorts proportionality. *N* is too disjunctive—tiny neural variations don’t alter behavior, while *recognition* is robust. Imagine interventions where light patterns differ but Lucia still integrates cues *as* a static object. Her recognition tracks the *invariant* cause of adjustment—unlike *N*, which changes wildly across equivalent realizations.  

  **Dr. Aris:** Invariance isn’t causal *efficacy*. Physics doesn’t care if a description is “robust.” *N*’s sufficient for the effect *in this world*. Your recognition-state is just a high-level summary of *N*’s activity—it doesn’t *add* causal power.  

  **Dr. Belen:** But interventionism evaluates causes by testing across *possible* scenarios. Vary the input: flickering light versus smooth motion. Lucia’s *recognition* (not any specific *N*) screens off irrelevant micro-details. Alter her belief (“Maybe it’s a snake?”) while holding peripheral neural inputs fixed—behavior changes! That’s mental causation.  

  **Dr. Aris:** *N* includes prefrontal feedback loops embodying that belief! You’re confusing levels. If I rewire Lucia’s neurons to doubt static objects *without* altering sensory input—via artificial stimulation—she still adjusts. The *neural* computation settles it. Mental states are passengers.  

  **Dr. Belen:** But the neural computation you stimulated *is the realization* of doubt! My point is temporal: *N* resolves in milliseconds, but Lucia’s recognition integrates cues over seconds—it’s a *distinct temporal window* of causation. The early dorsal activation *doesn’t* cause adjustment alone; it’s the sustained fronto-parietal synchronization that does. That’s the physical base for recognition.  

  **Dr. Aris:** So now you’re fragmenting the physical cause? If synchronization *P* realizes recognition *M*, and *P* causes the adjustment, *M* is excluded by *P*. Unless you embrace overdetermination?  

  **Dr. Belen:** Not at all. *P* isn’t “more fundamental”—it’s *constitutively dependent* on lower-scale processes but *causally relevant* at its own scale. Compare: pressure (*P*) causes a valve rupture. Fixing molecular motions (*N*) while varying pressure is impossible—they’re not independent. Similarly, intervene on illumination *without* altering neural integration: recognition changes, causing behavioral change. *That’s* proportional mental causation.  

  **Dr. Aris:** But physics’ completeness demands that for every physical effect, there’s a sufficient physical cause. If *P* (synchronization) causes adjustment, and *P* realizes *M*, *M* adds nothing. You’re smuggling in dualism.  

  **Dr. Belen:** Completeness isn’t threatened! *P* is physical and sufficient. But *M* is *how we describe the causal pattern* across interventions where environmental or cognitive factors vary. *M* isn’t a rival cause; it’s the *same cause* described proportionally. Exclusion mistakenly assumes causes must compete. In multi-scale systems, macroscopic variables (like recognition) are often *better* difference-makers.  

  **Dr. Aris:** Hmm. But if I manipulate Lucia’s *M* by altering her knowledge (say, whispering “It’s just light”), thereby changing *P*, isn’t *P* still doing the work?  

  **Dr. Belen:** And if I manipulate pressure by adding gas, molecules move. Does that make pressure inefficacious? No—it *is* the causal pathway. *M* isn’t “extra”; it’s the *form* of physical causation in cognitive systems. Denying it ignores how science explains complex systems: climate models cite pressure systems, not quarks.  

  **Dr. Aris:** ...Yet quarks are sufficient.  

  **Dr. Belen:** Sufficient, yes—but not proportionally explanatory. Lucia’s adjustment is *sensitively dependent* on whether she judges “static object,” not on whether her neurons fire at 53Hz or 54Hz. That’s mental efficacy without exclusion.  

  **Dr. Aris:** *Sigh*. I’ll grant that high-level descriptions are pragmatic. But I still see no *metaphysical* space for *M* to push physical effects.  

  **Dr. Belen:** Then let’s reframe: causation isn’t “pushing”—it’s difference-making under intervention. *M* makes the difference proportionally. That *is* its reality.  

  *(Word count: 780)*
