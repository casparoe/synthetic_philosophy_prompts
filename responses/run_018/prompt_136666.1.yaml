prompt: |-
  hey so my philosophy of physics study group just had this blowup about whether the quantum state is actually real or just a bookkeeping tool. i want to write a little taxonomy / decision tree for our discord server, but i dont want the generic wikipedia flowchart. can you build one that sorts positions based on concrete answers to these specific questions?

  start with: if you accept that two observers can assign different pure states to the same system (wigner's friend style), does that show |ψ⟩ is not ontic?

  then branch on:
  - is there still a single 'true' underlying state (maybe hidden variables, maybe a multiversal branch structure)?
  - does |ψ⟩ live in physical 3-space or in configuration space, and if the latter, can something in high-D space be 'real' in the same sense as a field?
  - if |ψ⟩ is not ontic, is it purely subjective belief (like a bayesian credence) or relational/indexical like velocity in SR?
  - what do you do about the born rule: does it describe an objective branching rate, a subjective update rule, or an illusion?

  map each combination to a named view (bohmian mechanics, everett/many-worlds, qbism, Rovelli's relational quantum mechanics, spekkens toy model epistemic view, etc.) or mark it 'unnamed / probably incoherent' with a one-sentence diagnosis of why nobody holds it. also flag which pairs of leaves your tree actually cant distinguish — for instance, maybe two views collapse to the same answers on all four questions.

  please say how confident you are overall and specifically call out the branch or distinction youre least sure about — im using this for a blog post and dont want to accidentally misrepresent someone. and please, no reading lists or citation requests, i just need the conceptual layout. also i keep writing 'recieve' instead of 'receive' so sorry if my wording is sloppy lol
