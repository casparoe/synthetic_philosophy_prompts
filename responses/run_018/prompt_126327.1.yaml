prompt: |-
  I'm moderating a colloquium Q&A with an unnamed philosopher who defends what she calls "structural analyticity" — a rehabilitated analytic-synthetic distinction that accepts Quine's holistic critique of reductionism but denies that holism erases every local boundary. On her view, an analytic claim is not one reducible to logic plus synonymy (she grants Quine's circularity objection to that first dogma), but rather one that functions in reasoning as a non-empirical coordination principle: it is never revised by direct empirical encounter, not because it is immune in principle, but because the architecture of belief assigns it a structural role that empirical evidence can only dislodge by overturning an entire module. I want eight to ten interview questions that press this position at its joints rather than asking her to summarize it. Include at least one question on whether her structural criterion collapses back into a pragmatic or conventionalist account that Quine himself could accept; at least one on how she handles mathematical truths, where modular insulation seems strongest but where Quine's indispensability argument also runs; and at least one on whether the distinction survives Quine's second dogma if we reject not just reduction sentence-by-sentence but any local-to-global inference pattern. For each, provide a follow-up keyed to the answer she is most likely to give — for instance, if she appeals to functional role, press whether that role is descriptive or normative, and whether she can distinguish it from a particularly stubborn empirical generalization without begging the question. End with a question that makes it harder for her to deploy the standard deflection that "the boundary is fuzzy but still useful," by asking what specific evidential scenario would actually force her to reclassify a paradigmatic analytic statement as synthetic. Please begin your response directly with the interview questions themselves, with no introductory commentary or preface.
reasoning: |-
  Okay, the user is moderating a colloquium Q&A with a philosopher who defends "structural analyticity." This is a nuanced position that tries to rehabilitate the analytic-synthetic distinction while accepting Quine's holistic critique. The user needs incisive questions that probe the key weaknesses without letting the philosopher just summarize her view.

  Hmm, the user has very specific requirements: at least one question each on pragmatic conventionalism, mathematical truths, and the second dogma; plus follow-ups designed to counter predictable answers; and ending with a demand for concrete falsification scenarios. This suggests they're well-versed in the literature and want to push beyond superficial defenses.

  Let me break this down. First, the conventionalism angle: Quine might agree that some statements are pragmatically entrenched, so how is "structural analyticity" different? The follow-up should challenge whether "coordination role" is just descriptive psychology or has normative force. 

  For mathematics, the tension is between modular insulation and indispensability arguments. The follow-up needs to corner her on whether mathematical claims could ever be empirically falsified – if not, doesn't that concede analyticity in the traditional sense she rejects?

  The second dogma question must attack holism's core by asking if any local inference can be insulated. The follow-up should force her to explain how structural principles differ from empirical ones without circularity.

  Ending requires teeth: if she retreats to "fuzzy but useful," demand a concrete scenario where analyticity collapses. No letting her wriggle out with vagueness.

  User's phrasing suggests they suspect this position might be Quine-in-disguise or question-begging. My questions should weaponize those suspicions. Also, the demand for "joints rather than summary" means avoiding open-ended prompts; every question must have surgical precision.

  ...structuring now: eight questions minimum, each with follow-up. Opening with the conventionalism challenge sets high stakes early. Math and second dogma in middle as technical pillars. Ending with falsification as climax. Follow-ups all targeting evasion routes mentioned in the brief – especially the "stubborn empirical generalization" dodge.
answer: |-
  1.  **Question:** You grant Quine's point that analyticity can't be defined non-circularly via synonymy and logic alone. But if analyticity is defined functionally, by the non-empirical *structural role* a claim plays in reasoning – its resistance to direct revision and its coordinative function – isn't this ultimately just a *pragmatic* description of how entrenched a belief is within a particular theoretical module? How does this avoid collapsing into Quine's own view that some statements are merely more "centrally located" or pragmatically indispensable within the web of belief?
      *   **Likely Answer/Focus:** She will emphasize that the role is *architectural* and *constitutive* of the module's reasoning practices, not merely a matter of degree of entrenchment or utility. She might stress it defines the rules of the "game" being played within that domain.
      *   **Follow-Up:** If this functional role isn't ultimately grounded in pragmatic utility or conventional choice for managing inquiry efficiently, what *is* its ground? Is the 'structural role' a descriptive feature of current psychology, or a normative constraint on rational reasoning within the module? If normative, how do we identify *which* normative constraints define analyticity without presupposing the distinction?

  2.  **Question:** Mathematical truths seem like prime candidates for your structural analyticity – deeply insulated within their module, serving as non-empirical coordinators, and revised only with extreme holistic upheaval. Yet Quine argues mathematics *is* empirically revisable via the indispensability argument: if a mathematical framework consistently leads to failed empirical predictions in physics, we *would* revise the math. How does your structural view accommodate, or resist, this Quinean argument? Are core mathematical truths structurally analytic or not?
      *   **Likely Answer/Focus:** She might argue that within the *mathematical* module itself, core truths like arithmetic are structurally analytic. Revision happens at the *interface* when applying math to physics, forcing change in the *application rules* or even the *choice* of mathematical module used, not necessarily direct revision of, say, '2+2=4' *within* its native arithmetic module. She might distinguish internal mathematical reasoning from scientific application.
      *   **Follow-Up:** If revising the application of mathematics to physics (e.g., changing geometry due to relativity) doesn't touch the internal structural analyticity of the *mathematical* claims themselves, does this mean the structural analyticity is confined solely to the internal relations *within* a formal system, making it trivial (like logic)? How does this internal view account for the apparent *objectivity* and *applicability* of mathematics that Quine's holism aims to capture?

  3.  **Question:** Quine's second dogma targets the idea that individual statements have their own separable empirical content. You accept holism but posit local boundaries defined by structural roles within modules. How can a claim be insulated from *direct* empirical revision (your criterion) if holism means *any* belief *can* be held true come what may, *provided* we make drastic enough adjustments *elsewhere* in the system? Doesn't the second dogma imply that the "structural role" preventing *direct* revision is itself contingent on global adjustments being available to protect it indirectly?
      *   **Likely Answer/Focus:** She will argue that holism is global *in principle* but *locally modular in practice*. The "structural role" signifies that revising *this specific claim* directly in response to sensory input would be irrational *within the current architectural framework*; preservation requires revision cascading through the *entire module* or altering module connections, which is a different kind of change. The boundary lies in the *pattern of required revision*.
      *   **Follow-Up:** If the immunity from *direct* revision relies entirely on the *possibility* of making compensatory adjustments elsewhere (globally or within the module), how is this different in kind from the immunity of a very central, *synthetic* empirical hypothesis? What prevents a 'stubborn empirical generalization' at the core of a module from being misidentified as structurally analytic, if protecting it just requires complex enough adjustments in auxiliary hypotheses?

  4.  **Question:** Could you provide a concrete example of a claim you consider structurally analytic *outside* of formal logic or pure mathematics? What specific structural role does it play in its module that distinguishes it functionally from a highly confirmed synthetic core principle?
      *   **Likely Answer/Focus:** She might offer an example like "Nothing is both red and green all over simultaneously" (color exclusion) or "Bachelors are unmarried" (if she argues this functions structurally in a social ontology module) or perhaps a core principle of folk psychology ("Beliefs and desires explain behavior"). She'll describe its role as defining the space of possibilities or relationships within that domain.
      *   **Follow-Up:** For your chosen example, can you describe a conceivable (even if wildly implausible) empirical scenario that *wouldn't* lead us to revise auxiliary hypotheses or overhaul the entire module, but *would* lead us to revise *this specific claim directly*? If not, how is this different from a synthetic claim so central we'd abandon the whole theory first? If yes, does that mean its analyticity is contingent on *current* empirical knowledge not forcing that scenario?

  5.  **Question:** You characterize analytic claims as "coordination principles." Coordination between what? Between different empirical claims? Between concepts? Between language and the world? And what distinguishes this coordinative function from the role played by, say, a fundamental theoretical postulate in physics?
      *   **Likely Answer/Focus:** She will likely emphasize coordination between *concepts* or *meanings* within the conceptual scheme or module, setting the framework for empirical description itself. She might contrast it with physical postulates which make direct empirical claims *within* the framework.
      *   **Follow-Up:** If analytic claims coordinate concepts/meanings, doesn't this reintroduce the very notion of 'meaning postulates' or fixed synonymy that Quine critiqued? How do you ground this conceptual coordination without falling back onto the first dogma? Is the coordination purely internal to language/the module, or does it have a mind-independent basis?

  6.  **Question:** How does structural analyticity relate to *a priori* knowledge? Are structurally analytic claims known *a priori*? If so, does this commit you to a faculty of rational insight into conceptual relations? If not, how is their justification non-empirical?
      *   **Likely Answer/Focus:** She might decouple analyticity from traditional *a priori* justification, framing structural analyticity as more about *functional role in the system* than a specific epistemic origin. Justification might be holistic/systemic coherence within the module.
      *   **Follow-Up:** If justification is systemic coherence within the module, how does this differ from the justification for deeply entrenched synthetic core beliefs within that same module? Doesn't this pragmatic/coherentist account of justification undermine the claim that there's a distinct *kind* of truth (analytic) here?

  7.  **Question:** Does structural analyticity apply only to *universal* claims, or can there be structurally analytic *singular* statements? For example, is "Hesperus is Phosphorus" structurally analytic *after* the astronomical identification is made, functioning as a fixed point coordinating celestial observations?
      *   **Likely Answer/Focus:** She will likely argue that singular identities become fixed reference points crucial for coordination *within* a mature scientific theory, potentially qualifying as structurally analytic within that module. Their revision would require massive upheaval (e.g., re-writing celestial mechanics).
      *   **Follow-Up:** But wasn't the identity of Hesperus and Phosphorus itself established empirically? Doesn't making such empirically discovered identities structurally analytic *after the fact* blur the line beyond recognition? How is this different from saying any highly confirmed synthetic identity becomes analytic once sufficiently central?

  8.  **Question:** You emphasize that the boundary is not sharp but deny this makes it useless. To push back against the deflection that "fuzzy boundaries are still boundaries," could you describe a *specific*, non-hypothetical, evidential scenario that you believe *would* force the reclassification of a paradigmatic structurally analytic claim (e.g., perhaps "Vixens are female foxes" or your earlier example) into a synthetic one? What would that process look like concretely?
      *   **Likely Answer/Focus:** She might struggle to find a non-hypothetical example, reinforcing the strength of the boundary. She might offer a hypothetical: e.g., revolutionary neuroscience completely overturning folk psychology, forcing abandonment of "Beliefs cause behavior" as a structural principle. Or bizarre quantum effects making "Nothing is red and green all over" require revision *without* first abandoning color concepts entirely.
      *   **Follow-Up:** In your hypothetical scenario, isn't the abandonment of the claim still happening *because* we are abandoning the entire conceptual module (folk psychology, standard color ontology)? Doesn't this confirm Quine's point that revision only happens holistically at the module level, meaning the claim wasn't *directly* revised by evidence, but rather the framework supporting its structural role collapsed? Doesn't this show the boundary is defined by the *module's* empirical vulnerability, not the claim's intrinsic status?
