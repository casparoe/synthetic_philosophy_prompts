  The user is clearly a meticulous writer facing deadlines, so the tool must balance scholarly rigor with creative practicality. Their deeper need might be maintaining historical credibility while preserving narrative power, especially since they mention reluctantly classifying resonant details as invented. The friction test suggests they particularly value humanizing, theologically inconvenient elements.

  I'll structure the checklist as a flowchart with binary decisions, hard stops at red flags, and weighted conflict resolution. The friction test will be a key gatekeeper. For the examples: 

  The temple action passes despite discrepancies because it meets multiple criteria (embarrassment, multiple attestation) and survives the counterfactual where a pious Jesus wouldn't cause violent disruption. 

  The birth narratives fail at Step 1—only two late sources—and Step 2 (theological centrality). The angelic elements also trigger the "supernatural without friction" stop. 

  The cry of dereliction is trickier. It passes early checks but the friction test saves it: Mark wouldn't invent a cry implying abandonment, and it has zero theological utility. This forces the user to keep a detail they might have doubted. 

  I'll emphasize the checklist's limits—it can't prove divinity or actual events—to manage expectations. The birth narrative example will frustrate them creatively but demonstrate rigor, which aligns with their need for defensible author's notes. 

  The conflict rules should prioritize embarrassment and friction over multiple attestation when they clash, since those are stronger authenticity indicators. Time-saving elements like "stop if failed sources" and "weighted scoring" will help meet their deadline pressure. 

  Finally, the disclaimer must clarify this evaluates plausibility through academic lenses, not truth—protecting both historical integrity and creative freedom.
answer: |-
  Here is a reusable decision procedure designed for your specific needs, balancing scholarly rigor with practical efficiency for historical fiction writing:

  **The Historical Plausibility Filter (for 1st-Century Judean Novel Details)**

  **Goal:** Assess whether a gospel detail can be presented as historically plausible *without* framing it as authorial invention. (Not to prove historicity, but to gauge plausibility per critical scholarship).

  **Time:** < 10 minutes per detail.
  **Input:** The specific gospel detail and its attestation (which gospels, how described).
  **Output:** **Green** (Present as plausible), **Yellow** (Present with nuance/uncertainty), **Red** (Frame as invention/theological device), or **Hard Stop** (Clear reason to halt).

  **Core Principle:** Favor inclusion if plausibility arguments outweigh invention arguments, prioritizing criteria indicating *resistance to theological embellishment*.

  ---

  **The Checklist:**

  1.  **Source Foundation & Scope:**
      *   *Question:* Is the detail present in **at least two independent sources** (e.g., Mark, Q, Paul, John, special M/L material)? *AND* Are the earliest sources (Mark, Q, Paul) included?
      *   *Action:*
          *   **YES:** Proceed to Step 2.
          *   **NO:** Proceed to Step 1b.
      *   **1b. Single/Solely Late Source Test:**
          *   *Question:* Is the detail found *only* in Matthew, Luke, or John (i.e., later, more theological sources), *or* only in one source total?
          *   *Action:*
              *   **YES:** **HARD STOP - Red.** (High probability of theological/literary invention. *Judgment Call Flag*: Severity increases if detail is theologically central or miraculous without friction).
              *   **NO:** Proceed to Step 2 (Rare cases like unique but early Markan details).

  2.  **Theological Centrality & Convenience:**
      *   *Question:* Is the detail **obviously central to the author's core theological claims** (e.g., fulfilling prophecy, proving divinity, establishing sacraments, defining orthodoxy)?
      *   *Action:*
          *   **YES:** **Flag for High Invention Risk.** Proceed to Step 3 (Crucible: The Friction Test).
          *   **NO:** Proceed to Step 3 (The Friction Test is still essential).

  3.  **The Friction Test (Your Core Innovation):**
      *   *Question A (Narrative Tension):* Does the detail generate **significant narrative tension, confusion, or awkwardness** that doesn't obviously serve the author's theological or apologetic purposes? (e.g., portrays Jesus/Disciples negatively, creates logical problems, seems counterproductive).
      *   *Question B (Conventional Piety/Politics Counterfactual):* Does the detail **survive** a counterfactual where the author's *primary* goal was making Jesus appear **more conventionally pious** (e.g., strictly Torah-observant, non-controversial) or **politically unthreatening** (e.g., loyal Roman subject, avoids confrontation)? Would changing/omitting the detail *help* achieve that counterfactual goal?
      *   *Action:*
          *   **PASSES BOTH (A & B):** Strong indicator of authenticity. **Proceed to Step 4.** (Weight heavily).
          *   **PASSES ONE (A or B):** Moderately positive indicator. **Proceed to Step 4.** (Note which one passed).
          *   **FAILS BOTH:** High probability of invention or heavy theological shaping. **Proceed to Step 4 with High Caution Flag.**

  4.  **Criterion of Embarrassment:**
      *   *Question:* Is the detail **embarrassing or potentially damaging** to the early Church, Jesus, or the Disciples? (e.g., disciples misunderstand/flee, Jesus expresses doubt/anger, actions hard to explain theologically).
      *   *Action:*
          *   **YES:** Strong indicator of authenticity. **Proceed to Step 5.** (Weight heavily).
          *   **NO:** Neutral. Proceed to Step 5. (Not all plausible details are embarrassing).

  5.  **Multiple Attestation of Forms/Contexts:**
      *   *Question:* Is the core action/teaching/setting **attested in multiple literary forms** (e.g., parable, pronouncement story, passion narrative) **or divergent contexts** across the sources? (Focus on the *kernel*, not identical wording/setting).
      *   *Action:*
          *   **YES:** Moderately positive indicator of an early tradition. **Proceed to Step 6.**
          *   **NO:** Neutral. Proceed to Step 6. (Not fatal, but less supporting evidence).

  6.  **Conflict Resolution & Final Decision:**
      *   *Evaluate Weighted Evidence:*
          *   Strong Pass on **Friction Test (Both)** or **Embarrassment** outweighs failures elsewhere (except Step 1 Hard Stop).
          *   Failure of **Friction Test (Both)** or strong **Theological Centrality** (Step 2) outweighs weaker positives (e.g., only Multiple Attestation).
          *   **Hard Stop from Step 1b is absolute.**
      *   *Decision Matrix:*
          *   **Strong Pass on Friction Test (Both) OR Embarrassment:** Likely **Green**. (Plausible core, present directly).
          *   **Pass on Friction Test (A or B) AND/OR Embarrassment, AND Passes Step 1:** Likely **Green** or **Yellow** (Present, perhaps noting uncertainty if sources diverge significantly on context/motive).
          *   **Fails Friction Test (Both) AND High Theological Centrality (Step 2):** Likely **Red.** (Frame as theological/literary device).
          *   **Fails Friction Test (Both) BUT Low Theological Centrality AND Passes Step 1:** **Yellow.** (Present with nuance, e.g., "some recalled...", "tradition holds...").
          *   **Single/Solely Late Source (Step 1b Hard Stop):** **Red.** (Frame as invention/theological device).

  ---

  **Application to Your Examples:**

  1.  **The Temple Action (Cleansing):**
      *   **Step 1:** YES (Mark, John, implied in Matthew/Luke via Q?/Mark - Multiple Independent).
      *   **Step 2:** YES (Could be seen as fulfilling prophecy/Zeal). **Flag for Risk.** Proceed.
      *   **Friction Test:**
          *   **A (Tension):** YES (Violent disruption, challenges authority, *could* be seen as politically incendiary).
          *   **B (Counterfactual):** PASSES. Making Jesus less threatening would involve *omitting* this confrontation. Authors *kept it*, despite risk.
      *   **Step 4 (Embarrassment):** YES (Violence? Potential for misunderstanding as Zealot-like).
      *   **Step 5 (Multiple Forms/Contexts):** YES (Mark: Framed as "den of robbers"; John: Framed with "zeal for your house", different timing).
      *   **Step 6:** Strong Pass Friction & Embarrassment outweigh Theological Centrality risk. **VERDICT: GREEN.** (Plausible core event; present directly, note divergent contexts/motives in author's note as historical uncertainty).

  2.  **Birth Narratives (Angels, Genealogies):**
      *   **Step 1:** NO (Only Matthew & Luke). **Proceed to 1b.**
      *   **Step 1b:** YES (Only in later sources, Matthew & Luke). **HARD STOP - RED.**
      *   *Procedure Stops.* **VERDICT: RED.** (Frame as theological/literary devices establishing Davidic lineage, virgin birth, divine favor). *This is your resonant/useful but likely invented detail.* The angelic announcements are supernatural without friction, tightly woven into core theology (Incarnation, Davidic Messiah), and serve no purpose *except* theology in the counterfactual.

  3.  **Cry of Dereliction ("My God, why have you forsaken me?" - Mark 15:34/Matthew 27:46):**
      *   **Step 1:** YES (Mark, Matthew (dependent on Mark? Argued, but often treated as Markan core)). *Accept as two witnesses for procedure.*
      *   **Step 2:** YES? **Flag for Risk.** (Could be theological - Psalm 22). Proceed.
      *   **Friction Test:**
          *   **A (Tension):** YES (Profoundly awkward: suggests abandonment, despair, contradicts "God was in Christ").
          *   **B (Counterfactual):** PASSES SPECTACULARLY. Making Jesus appear more pious/unthreatening (stoic martyr, confident victor) would involve *changing or omitting* this cry. Authors *included it* despite the difficulty.
      *   **Step 4 (Embarrassment):** YES (Extreme - implies God abandoned Jesus).
      *   **Step 5 (Multiple Forms):** Weak (Only in Passion Narrative form, only Mark/Matthew).
      *   **Step 6:** Overwhelming Pass on Friction Test & Embarrassment outweigh Theological Centrality risk and weaker Multiple Attestation. **VERDICT: GREEN.** (Plausible core saying; present directly as a moment of profound human anguish).

  ---

  **What This Checklist Can NEVER Establish:**

  *   **The Divine Nature of Jesus:** This assesses human plausibility within a 1st-century Jewish context, not metaphysics.
  *   **The Actual Occurrence of Any Specific Event:** It gauges the *probability* based on textual analysis, not direct historical proof. "Plausible" ≠ "Proven True."
  *   **The Exact Words Spoken:** It assesses the plausibility of the *substance* of sayings/events, not verbatim quotation (oral tradition precludes certainty).
  *   **Motivation or Inner Thoughts:** It can assess plausibility of reported actions/sayings, but not the unspoken intentions behind them.
  *   **Supernatural Causality:** It identifies details *likely invented* for theological reasons (e.g., angels), but cannot confirm or deny divine intervention in plausible historical events (e.g., the *impact* of Jesus' teaching).

  **Author's Note Justification (Template):**
  *   **Green:** "This detail (e.g., Temple action, Cry of Dereliction) is presented as recounted in early traditions, deemed plausible by critical scholarship due to its [mention key criteria: e.g., multiple attestation, inherent tension/embarrassment, resistance to theological smoothing]."
  *   **Yellow:** "While the core of this tradition may have early roots [mention supporting criteria, e.g., friction], its specific form/context here reflects uncertainties in the sources or later development [mention issue, e.g., single attestation, theological shaping]."
  *   **Red:** "This element (e.g., angelic annunciation) is presented as reflecting the theological narrative purposes of the later Gospel writers [Matthew/Luke], illustrating key beliefs [mention belief, e.g., Jesus' divine sonship, Davidic lineage] common in the early church, rather than as a literal historical account."

  This procedure provides a defensible, efficient framework for making tough calls under deadline pressure, prioritizing the human, unexpected, and theologically inconvenient details most valued by historical fiction, while clearly flagging likely theological constructs.
