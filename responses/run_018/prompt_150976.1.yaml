  ok so i want you to argue that Dennett's idea of counterfeit people — AI that fakes human mental states well enough to fooll us — actually points to the wrong unit of analysis. instead of worrying about one chatbot that tricks us into treating it like a moral patient, we should worry about counterfeit communities: networks of language models that generate synthetic social proof and fake distributed belief without any single model having real intentiality. defend the view that the real risk isn't a lone fake mind but a polluted epistimic environment where human agents mistake aggregated stochastic output for collective reasoning. keep it in the weeds — don't just replay the usual stochastic-parrot vs sentience debate, and don't bother with citations or a reading list. try to use Dennett's design/intentional stance distinction but apply it at the group level, not the individual bot level. write it casual, like you're explaining to a friend, and don't worry if a typo or two sneaks in.
