  For the reparative vs. selective amnesia question, the follow-up needs to address circularity if she mentions present agency as the criterion. If she says it's about avoiding temporal alienation, the follow-up should push on how that's measured. The hero-worship question needs to probe if borrowing "energetic profiles" still risks idolizing past figures. The follow-up should question if structural analogy can be separated from content. For the antiquarian absence question, the follow-up should challenge if monumental history can exist without it.

