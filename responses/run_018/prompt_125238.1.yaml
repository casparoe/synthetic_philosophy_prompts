  hey so i was arguing with my roommate for like three hours last night about zoning and NIMBY stuff and i need you to act like a professional philosopher of urban space and think really carefully step by step before you answer anything. please argue that the so-called "right to the city" has to be understood as an intergenerational claim about future urban form, not just a present-occupancy claim that lets current residents veto density. my friend kept saying downzoning in historic districts is just protecting property rights, but i think thats wrong — zoning veto power is structurally like a constitutional entrenchment problem where past preferences bind future populations who never got to vote on the rules. can you build the argument that NIMBYism undermines any desert-based claim current residents have to exclude newcomers, specifically by treating local democratic control as a kind of dead-hand control? start with some brainstorming about what "right to the city" even means if we reject both pure market allocation and simple majoritarianism at the same time. dont just name-drop Lefebvre or list readings — actually construct the reasoning. also please head off the misconception that im defending top-down planning, because im not; im saying the problem is local veto power being treated like a private right when its actually a collective decision about who gets to live here in fifty years. oh and watch out for the typo in my reasoning if you spot it, just roll with it.
