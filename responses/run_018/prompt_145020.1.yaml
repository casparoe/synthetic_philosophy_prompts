  Finally, connect this to Dr. Vasquez's intellectual courage in studying uncomfortable truths. 

  Crucially, the Marxist concepts must be embedded in plain language: "invisible ink" for obscured exploitation, "the system keeps needing us" for capital's reliance on labor. For academics, phrases like "the theft got harder to see" nod to value theory without lecturing. 

  The closing should pivot to warmth—celebrating her mentorship and the human stakes of her work. Family needs to feel her impact was profound, not confusing. Academics should recognize the precision beneath the accessibility. 

