prompt: |-
  Me and my friend spent the whole evening arguing about who gets to blame whom, and now I'm not sure my own verdicts hang together. Here are the ones I feel pretty strongly about, even though she pushed back on a few. Ben cheated on his wife years ago and never told her; when she later kisses someone at a party, I don't think he has any standing to blame her. But Priya had an affair, told her husband the next week, and they genuinely rebuilt things; when he has a longer affair later, I do think she has standing to blame him. Dave drives drunk every weekend, but I still think he can blame his friend for embezzling from their workplace — his drinking just doesn't touch that case. Yet when the same Dave brags about cheating on his taxes every year, I don't think he's in any position to blame a coworker who did exactly the same thing. And a teenager who shoplifted once, felt awful, and never did it again can blame a current shoplifter. The closest principle I could come up with is something about loosing standing only when your own unaddressed wrongdoing is somehow the same kind of thing as what you're blaming — but 'same kind' is doing a lot of work, and I'm not sure it survives Dave's two cases. Is there actually one principle here? If so, state it precisely and tell me what it says about someone who padded his expense reports for years, never got caught, and now wants to blame a neighbor for lying about a car accident. If your principle can't save all of my verdicts, tell me which one is cheapest to give up and why.
reasoning: |-
  Okay, let me try to figure out what's going on with this user's moral judgments. They've listed several scenarios where they feel strongly about whether someone has the standing to blame another person. The key seems to be when past wrongdoing affects someone's moral authority to blame others.

  First, looking at Ben's case: He cheated but never told his wife. When she kisses someone else, the user thinks Ben can't blame her. That makes sense because his own unresolved dishonesty undermines his position. Then Priya's situation: She had an affair but confessed and they rebuilt trust. When her husband has an affair later, the user believes she can blame him. The difference here is that Priya addressed her wrongdoing through confession and repair.

  Dave's cases are trickier. The user thinks Dave can blame his friend for embezzlement despite his drunk driving, but can't blame a coworker for tax cheating when he does the same. The distinction appears to be about domain relevance - embezzlement and drunk driving are unrelated, but tax cheating is the exact same act. The teenager who shoplifted once but reformed can blame current shoplifters because they've clearly changed.

  Hmm... the principle emerging is about "unaddressed similar wrongdoing." But "similar" needs careful definition. It's not just about the act category (like financial dishonesty) but also about the underlying moral failure. For Dave, tax cheating and embezzlement both involve dishonesty, but the user treats them differently because one is workplace-specific and the other is personal taxes. Maybe the key is whether the blamer is currently engaged in or hasn't repented for the same core moral violation in the relevant domain.

  The expense report padding case would test this. If someone lied for years on expenses and wants to blame a neighbor for lying about a car accident, are these "similar"? Both involve dishonesty for gain. But if we consider domains separate (work vs. insurance), maybe they could blame? Yet intuitively, a chronic liar seems hypocritical blaming any dishonesty. Unless... the critical factor is whether the blamer has resolved their own moral failure regarding dishonesty itself.

  Perhaps the unifying principle is: You lose standing to blame only if your own ongoing/unresolved wrongdoing demonstrates the same core character flaw that you're condemning in others. For Ben, it's marital deceit; for Dave on taxes, it's personal financial dishonesty; for Priya and the teen, they addressed the flaw. For drunk driving vs embezzlement, different flaws (recklessness vs betrayal).

  Applying this to the expense report case: The chronic padding shows unresolved dishonesty for financial gain. Blaming the neighbor's insurance lie would be hypocritical because it manifests the same core character flaw. So he shouldn't have standing.
answer: |-
  Based on your strongly held verdicts and the need for a consistent principle, here's a precise principle that captures *most* of your intuitions and explains the expense report case:

  **The Principle of Standing Based on Relevant Unresolved Wrongdoing:**
  *A person lacks the moral standing to blame another for a specific wrongdoing if they are currently engaged in, or have never genuinely addressed (through acknowledgment, remorse, and/or repair), a wrongdoing that shares the same core moral failure or character flaw relevant to the act being condemned, especially when that failure undermines the credibility of their condemnation.*

  **How it explains your verdicts:**

  1.  **Ben:** Cheated (core failure: marital betrayal/deceit) and *never told* (unresolved). Blaming wife for kissing someone (core failure: marital betrayal). **No Standing.** The unresolved, relevant core moral failure (betrayal/deceit) undermines his credibility.
  2.  **Priya:** Had affair (core failure: marital betrayal) but *told and rebuilt* (addressed/resolved). Blaming husband for affair (same core failure). **Has Standing.** She addressed the relevant core moral failure; her condemnation isn't hypocritical on that specific point.
  3.  **Dave (Embezzlement):** Drives drunk (core failure: reckless endangerment). Blaming friend for embezzlement (core failure: breach of trust/theft). **Has Standing.** The core moral failures (recklessness vs. betrayal/theft) are different *and* not relevant to each other in this context. His recklessness doesn't undermine his credibility in condemning a breach of trust.
  4.  **Dave (Tax Cheating):** Brags about cheating on taxes (core failure: financial dishonesty) *unresolved*. Blaming coworker for tax cheating (same core failure: financial dishonesty). **No Standing.** The *exact same* core moral failure is currently unresolved. His condemnation is pure hypocrisy.
  5.  **Teenager:** Shoplifted once (core failure: theft/dishonesty) but *felt awful and stopped* (addressed/resolved). Blaming current shoplifter (same core failure). **Has Standing.** They addressed the relevant core moral failure (theft/dishonesty). Their past doesn't invalidate their current moral stance.

  **Key Distinctions:**
  *   **"Same Core Moral Failure":** This is narrower than "same kind of thing" (e.g., "crime" or "financial irregularity"). It focuses on the underlying ethical violation: betrayal vs. recklessness vs. theft vs. dishonesty.
  *   **"Relevant":** The unresolved failure must pertain to the *type* of moral failing being condemned. Dave's recklessness isn't relevant to condemning betrayal/theft.
  *   **"Unresolved":** Addressed wrongdoing (like Priya's or the Teenager's) doesn't destroy standing. Unaddressed or current wrongdoing (Ben, Dave on taxes) does.
  *   **"Undermines Credibility":** The hypocrite's own actions make their condemnation ring hollow or serve self-interest rather than genuine moral concern.

  **The Expense Report Case (Padded for years, never caught, blames neighbor for lying about car accident):**
  *   **Core Moral Failure (Expense Reports):** Dishonesty (specifically, deception for financial gain).
  *   **Core Moral Failure (Neighbor's Lie):** Dishonesty (specifically, deception for financial gain - likely insurance fraud).
  *   **Resolution:** Never addressed, resolved, or stopped; it's ongoing/unresolved.
  *   **Relevance:** The core moral failure (dishonesty for gain) is identical *and* directly relevant to the act being condemned.
  *   **Verdict by Principle: NO STANDING.** His own persistent, unresolved dishonesty for financial gain completely undermines his credibility in condemning his neighbor's dishonesty for financial gain. It's hypocrisy of the same relevant core failure.

  **The Challenge: Dave's Embezzlement vs. Drunk Driving**
  *   **The Problem:** Your principle *saves* this verdict (different, irrelevant core failures). However, some might argue Dave's *pattern* of serious wrongdoing (reckless endangerment) could undermine his *overall* moral authority, even on unrelated matters like embezzlement.
  *   **The Cheapest Verdict to Give Up:** **Dave blaming the embezzler.** While your intuition is strong (and the principle saves it), it's the one most vulnerable to the counter-argument that chronic, severe immorality in *any* domain can taint a person's standing to deliver moral condemnation in *any* domain. Giving this up is "cheapest" because:
      1.  It's the only case where the blamer's *unrelated* severe wrongdoing is tolerated by your principle.
      2.  It relies most heavily on strict domain separation, which is intuitively weaker when both wrongdoings are severe and habitual (unlike the teenager's single, regretted act).
      3.  Giving it up doesn't contradict any of your other *specific* verdicts (Ben, Priya, Tax Dave, Teen) which hinge on the *relevance* of the core moral failure. You'd simply add "unless the blamer's *overall* pattern of unaddressed wrongdoing is so severe and pervasive that it renders *any* moral condemnation hypocritical."

  **Conclusion:**
  The Principle of Standing Based on **Relevant Unresolved Wrongdoing** captures the essence of your intuitions in Ben, Priya, Tax Dave, and the Teenager cases, and clearly dictates the expense report case. It resolves the ambiguity in "same kind" by focusing on the *core moral failure* and its *relevance* to the condemnation. While it perfectly saves Dave blaming the embezzler based on irrelevance, *that specific verdict* is the one most open to challenge on the grounds that pervasive immorality can poison the well entirely. If you need absolute consistency across all cases without exception, revising your view on Dave blaming the embezzler is the least disruptive change.
