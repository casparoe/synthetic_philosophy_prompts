  Another angle is the normative targets. The Bayesian side might be concerned with what the evidence directly supports, while the centered approach considers what the agent should believe given how the evidence was generated. This ties into the distinction between the content of the message and the process that produced it. Judy knows the evidence-generation protocol in advance, which affects how she should update.

