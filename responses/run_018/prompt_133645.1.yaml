answer: |-
  Here's a sharpened version of your argument, keeping it casual but tight:

  **The Core Instability:** Dennett's crane/skyhook metaphor breaks down in evolutionary psych because the supposedly "pure" crane of natural selection *requires* hidden structural hooks in its *starting conditions* to even function. Greedy reductionism masks this by pretending these foundational structures are *part* of the crane's operation, rather than the unearned scaffolding it stands on.

  **Breaking it Down:**

  1.  **The Crane Claim:** Evolutionary psych presents natural selection as the ultimate crane. It builds complex moral intuitions & behaviors "bottom-up" from simple variation + selection + inheritance. No mysterious skyhooks (gods, cosmic purposes) are needed. The crane does all the work.
  2.  **The Hidden Hook in the Basement:** But for the crane (selection) to *start* building morality (or anything), it needs a very specific environment:
      *   **Structured Payoff Matrices:** Selection pressures only "select" *if* certain behaviors reliably lead to differential survival/reproduction *in a specific way*. The mapping of "behavior X → fitness outcome Y" isn't *created* by selection; it's *imposed* by the initial physics, ecology, social dynamics, and resource distribution of the ancestral environment.
      *   **Pre-Defined Fitness Landscape:** The "shape" of what constitutes "fitter" is already laid out *before* selection acts. This landscape (e.g., "cooperation is advantageous *in this specific context*") dictates the possible paths evolution can take. It's the terrain the crane walks on.
  3.  **Why It's a Hook (Not Just Background):** This initial structure isn't passive background noise. It contains *all the specific information* that makes *moral* outcomes possible and shapes *which* moral instincts evolve. Why "reciprocal altruism" and not some utterly alien "morality"? Because the payoff matrix/fitness landscape *built that possibility in from the start*. It's doing heavy explanatory work – defining the "good" and "bad" in fitness terms *before* selection operates.
  4.  **Greedy Reductionism's Collapse:** The greedy reductionist move is to say: *"The crane built the morality! The environment is just the crane's material!"* But this is sleight-of-hand:
      *   **Smuggled Architecture:** They treat the highly structured, *prescriptive* initial conditions (which contain the seeds of the moral outcome) as mere *neutral inputs* to the crane. But these inputs aren't neutral gravel; they're pre-cut stones shaped to fit the moral arch the crane is destined to build.
      *   **Explanatory Debt:** The crane *process* (variation/selection/inheritance) explains *how* traits propagate *given* the pre-existing rules. It doesn't explain *why those specific rules* lead to *this specific kind* of morality. The "why morality *looks like this*" answer lies buried in the hook – the unexamined, assumed structure of the initial payoff matrix/landscape.
      *   **The Invisible Foundation Hook:** Every evolutionary psych crane explaining a moral trait *must* stand on this kind of hook. The crane doesn't *generate* the fundamental "value" structure (what actions lead to fitness gains/losses in this context); it *operates within* it. That structure is the hidden, foundational hook – the unearned premise that makes the crane's specific moral output inevitable, yet presented as purely emergent.

  **The Punchline:** It's not that cranes *can't* build complex things. It's that in evolutionary psych, every crane explaining morality is built on an invisible hook – the pre-fab, un-explained-by-selection *structure* of the initial selection environment. Greedy reductionism collapses because it pretends this essential, value-laden hook is just inert ground, hiding the fact that the crane's moral blueprint was already drawn in the foundation. The "pure" bottom-up story leaks top-down assumptions from frame one.
