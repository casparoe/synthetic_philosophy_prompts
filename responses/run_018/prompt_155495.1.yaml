prompt: |-
  I facilitate governance design for cooperative housing associations—groups of thirty to two hundred households that draft their own charters and amend them by supermajority. Increasingly, these groups want to embed what I call Ulysses provisions: rules that are deliberately costly to overturn, meant to bind future residents to commitments made today, such as perpetual affordability covenants, bans on speculative resale, or mandatory environmental maintenance levies. The philosophical rationale is familiar—a collective, like an individual, may rationally precommit to avoid predictable failures of will or shortsightedness. But my clients also fear locking themselves into mistakes if conditions change radically, and they want something more nuanced than a simple sunset clause. I have been experimenting with a framework I term conditional rigidity with epistemic release: the idea that a precommitment should not dissolve automatically after a fixed term, but only when an independent internal review body, operating under its own locked procedural rules, certifies that the original rationale for the clause has become epistemically obsolete according to criteria specified in the charter itself. This creates a second-order binding—the group binds not only its future actions but also the conditions under which it may reconsider them.

  I need you to turn this combination of Ulysses-style constitutional precommitment and this second-order, conditionally locked release mechanism into an operational decision procedure my clients can actually run during charter drafting. The procedure should be ordered: the specific questions to ask about a proposed provision, what counts as a sufficient answer to advance to the next step, where the procedure stops with a clear recommendation not to precommit, and where it explicitly hands the decision to human judgment because the issue is one of values rather than institutional mechanics. It must handle hard cases—provisions that protect vulnerable members versus those that merely reflect current aesthetic preferences; release mechanisms that risk being captured by the very majorities the precommitment is meant to restrain; and situations where specifying the epistemic obsolescence criteria in advance seems impossible without smuggling in the desired conclusion. Please apply the procedure to three proposed charter clauses: a perpetual covenant capping resale prices at original purchase value plus inflation; an irrevocable rule requiring unanimous consent to approve emergency loans above a set threshold; and a clause mandating specific low-carbon heating infrastructure that is currently compulsory but might become technologically obsolete. For at least one of these, the procedure should yield a recommendation that my clients will dislike—perhaps that a deeply valued provision should not be precommitted, or that the release mechanism they want is structurally self-defeating. Also flag exactly which steps in your procedure are judgment calls disguised as technical checks, and state clearly what the procedure cannot do—where a cooperative must simply choose between competing visions of its own future self.
reasoning: |-
  Okay, let me start by understanding the user's request. They work with housing cooperatives that want to create binding rules (Ulysses provisions) but with a way to overturn them under specific conditions. Their framework, "conditional rigidity with epistemic release," involves an independent body deciding when the original rationale is obsolete. The user needs a step-by-step procedure to implement this during charter drafting, including handling tricky cases and applying it to three examples.

  First, I need to break down the core components. The procedure must guide clients through evaluating whether a rule should be a precommitment and designing the release mechanism. The key challenges are avoiding capture by majorities, distinguishing values from technical obsolescence, and specifying obsolescence criteria without bias.

  The user mentioned three clauses: resale price caps, unanimous consent for loans, and low-carbon heating. Each presents different issues. For the price cap, perpetual affordability is a core value, but economic conditions might change. The unanimous consent rule could protect minorities but create gridlock. The heating mandate is tech-dependent, so obsolescence is clearer.

  I should structure the procedure in phases. Phase 1 determines if precommitment is justified—checking if it's a response to predictable failures, protecting vulnerable groups, and whether the rationale is robust. If it fails here, no precommitment. Phase 2 designs the release mechanism, focusing on the independent body and clear obsolescence criteria. Phase 3 is for unresolved judgment calls.

  For the resale price cap, Phase 1 might pass because it protects affordability. But specifying obsolescence criteria in Phase 2 could be tricky. If they can't define what would make affordability irrelevant, the procedure might reject precommitment. That's a tough recommendation they might dislike but necessary to avoid unchangeable rules without clear exit conditions.

  The unanimous consent rule is problematic. While it protects minorities, requiring unanimity in emergencies could be dangerous. The procedure should flag that this might not be a precommitment candidate because it could cause harm without a reliable release. Here, the judgment call is balancing protection against systemic risk.

  For the heating infrastructure, technological obsolescence is definable, so the release mechanism is feasible. The challenge is ensuring the review body isn't captured by factions wanting to avoid costs. The procedure might suggest strict appointment rules for the review body.

  Steps that are disguised judgment calls include assessing "predictable failure of will" and "sufficient vulnerability protection." These rely on subjective evaluations but are framed as technical checks. The procedure must clarify where values take over, like choosing between present and future preferences.

  The user's deeper needs include wanting a robust yet flexible system, avoiding irreversible mistakes, and ensuring fairness. They also need to communicate tough recommendations to clients who are emotionally invested in certain rules. The procedure must provide clear rationale for such cases, using the framework's logic to depersonalize the advice.
answer: |-
  Here’s an operational decision procedure for embedding "conditional rigidity with epistemic release" in cooperative charters, designed to force rigorous scrutiny while exposing value judgments. The framework progresses through three gates, with explicit stop/go criteria and flags for irreducible value conflicts.

  ---

  ### **Operational Decision Procedure: Conditional Rigidity with Epistemic Release (CRER)**  
  **Phase 1: Precommitment Justification**  
  *Ask these questions in sequence. Stop if any answer is "no".*  
  1. **Predictable Failure Test**:  
     - *Question:* "Is this provision solely intended to prevent a *predictable collective action problem* (e.g., short-termism, majority tyranny, coordination failure)?"  
     - *Sufficient Answer:* Concrete historical examples from similar cooperatives or behavioral evidence (e.g., "70% of unregulated co-ops in our region lost affordability within 20 years").  
     - **STOP** if failed → *Recommendation: Do not precommit.* (e.g., aesthetic preferences fail here).  

  2. **Vulnerability Protection Test**:  
     - *Question:* "Does failure to uphold this provision *disproportionately harm vulnerable members* (e.g., low-income residents, future generations)?"  
     - *Sufficient Answer:* Identification of specific at-risk groups and mechanisms of harm (e.g., "Without price caps, essential workers face displacement").  
     - **STOP** if failed → *Recommendation: Use ordinary bylaws, not constitutional precommitment.*  

  3. **Rationale Robustness Test**:  
     - *Question:* "Can the *core rationale* (e.g., 'preserve affordability,' 'prevent debt crises') withstand foreseeable socioeconomic shifts (e.g., inflation, climate change)?"  
     - *Sufficient Answer:* Rationale must be abstract enough to transcend immediate conditions (e.g., "Affordability" > "Capped at 2003 income levels").  
     - **STOP** if failed → *Recommendation: Sunset clause or no precommitment.*  

  **Phase 2: Release Mechanism Design**  
  *Proceed only if Phase 1 passed.*  
  4. **Epistemic Obsolescence Criteria**:  
     - *Question:* "Can we define *objective, falsifiable conditions* under which the provision's rationale becomes obsolete (e.g., 'Carbon-neutral alternatives exist at ≤110% current cost')?"  
     - *Sufficient Answer:* Criteria must be measurable by third parties (e.g., audited construction cost indices) without subjective judgment.  
     - **STOP** if impossible → *Recommendation: Precommitment is too risky; use ordinary bylaws.*  

  5. **Anti-Capture Safeguards**:  
     - *Question:* "Can the internal review body be *structurally insulated* from the majorities/actors the precommitment restrains?"  
     - *Sufficient Answer:* Mechanisms like:  
       - Tenured, staggered appointments by lot + expert oversight.  
       - Supermajority thresholds for appointing reviewers.  
       - Permanent recusal rules for conflicted parties.  
     - **FLAG** if criteria involve judgment → *"Human judgment required: Trade-off between independence and practicality."*  

  **Phase 3: Irreducible Judgment**  
  6. **Values vs. Mechanics Declaration**:  
     - *Question:* "Does this decision ultimately hinge on competing visions of the cooperative’s identity (e.g., 'permanent affordability vs. asset ownership')?"  
     - *Sufficient Answer:* If "yes," explicitly state:  
       *"This choice cannot be resolved procedurally. The cooperative must decide its core values through deliberative democracy, not CRER."*  

  ---

  ### **Application to Cases**  
  **Case 1: Perpetual Resale Price Cap (Original + Inflation)**  
  - **Phase 1**: Passes Tests 1–3 (prevents speculation; protects low-income members; rationale is perpetual affordability).  
  - **Phase 2**:  
    - Test 4 (*Epistemic Obsolescence*): **FAILS**. Rationale ("affordability") cannot become obsolete without abandoning the co-op’s mission. Defining obsolescence (e.g., "if median incomes triple") smuggles in desired repeal.  
    - **Recommendation**: *Do not precommit.* Use a 30-year covenant with renewal votes.  
    - **Client Dislikes This**: Forces confrontation with the fact that "perpetual affordability" is a non-negotiable value, not a technocratic rule.  

  **Case 2: Unanimous Consent for Emergency Loans**  
  - **Phase 1**:  
    - Test 1: Passes (prevents reckless debt).  
    - Test 2: **FAILS**. Protects minority capital interests but *harms* vulnerable members by risking gridlock during emergencies (e.g., roof collapse).  
  - **Recommendation**: *No precommitment.* Replace with supermajority + independent crisis auditor.  

  **Case 3: Low-Carbon Heating Infrastructure Mandate**  
  - **Phase 1**: Passes Tests 1–3 (prevents backsliding on climate goals; protects future generations; rationale is decarbonization).  
  - **Phase 2**:  
    - Test 4: Passes (obsolescence = "technologically superfluous" if grid is 100% renewable + heating emissions near zero).  
    - Test 5 (*Anti-Capture*): **FLAGGED**. Risk that pro-cost-cutting majorities stack the review body.  
  - **Recommendation**: *Precommit with safeguards*:  
    - Review body = 3 randomly selected members + 2 climate scientists appointed by municipal regulator.  
    - Obsolescence criteria tied to IPCC carbon budget metrics.  

  ---

  ### **Critical Flags: Where "Technical" Checks Hide Judgment**  
  1. **Phase 1, Test 2** (*Vulnerability*): Deciding who is "vulnerable" and what counts as "disproportionate harm" is value-laden (e.g., is a 10% displacement rate acceptable?).  
  2. **Phase 2, Test 5** (*Anti-Capture*): Balancing insulation vs. democratic accountability requires political negotiation (e.g., "Is a 75% appointment threshold *enough*?").  

  ### **What the Procedure Cannot Do**  
  - Resolve **foundational value conflicts** (e.g., "Should we prioritize intergenerational equity or current-member autonomy?").  
  - Guarantee **perfect future-proofing**. Radical uncertainty (e.g., post-collapse societies) breaks all epistemic criteria.  
  - Replace **deliberative democracy**. Final charter choices belong to members, not algorithms.  

  This procedure forces cooperatives to confront the paradox of self-binding: *True precommitment requires accepting constraints that future-you will resent.* Where those constraints threaten core resilience or mask unresolved values, the framework recommends against rigidity—even when clients crave certainty.
