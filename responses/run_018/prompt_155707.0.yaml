  The semester-length scope seems manageable if they narrow to 3-4 clear convention types. Testing against counterexamples (like tipping where visitors might help "maintain" the system) will strengthen it. Should remind them that failure could mean tenancy just reduplicates residency length - but that's still useful knowledge!

  Their self-awareness about spelling and citations is refreshing. The proposal should keep that pragmatic tone - this isn't about grand theory but solving a real traveler's moral puzzle.
answer: |-
  Here's a one-page research proposal structured around your "moral tenancy" concept, designed for clarity and impact within a philosophy workshop context:

  ---

  **Research Proposal: The Moral Tenancy Framework – Obligations of Visitors to Local Conventions**

  **1. Core Question & Motivation:**  
  Do everyday social conventions (e.g., queueing, tipping, jaywalking norms) create distinct *moral obligations* for short-term visitors ("tenants") compared to long-term residents ("owners")? Specifically, does the concept of "moral tenancy" – temporary, benefit-derived membership in a local social system – provide a more accurate and intuitive foundation for these obligations than existing frameworks ("obey all" vs. "mere preference"), particularly in explaining observed asymmetries in blame and guilt?

  *Motivation:* Debates about tourist behavior often stall between extreme positions: demanding absolute conformity ignores context-sensitivity and differential emotional responses (e.g., intense anger at queue-jumping vs. tolerance for imperfect bowing), while dismissing conventions as mere preferences fails to capture the genuine moral discomfort visitors often feel and the tangible harm caused by certain violations (e.g., traffic disruption from jaywalking). This project seeks a principled middle ground.

  **2. The Problem with Existing Answers:**
  *   **The "Absolute Conformity" View (e.g., your roommate):** Fails to distinguish between core moral rules (theft, violence) and context-dependent conventions. It cannot explain why violations of *some* conventions (queueing) provoke outsized anger compared to others (minor etiquette lapses) or why the *duration* of stay intuitively matters. It over-moralizes.
  *   **The "Mere Preference" View:** Under-moralizes by reducing conventions to subjective tastes. It cannot explain the *specific moral guilt* visitors report for disrupting systems (like skipping tips in a tipping culture, potentially exploiting workers) or the *justified resentment* from locals when systems are undermined (e.g., queue chaos). It ignores the functional role of conventions in maintaining social coordination and fairness.

  **3. The Moral Tenancy Hypothesis:**  
  Visitors acquire moral obligations primarily through a "tenancy" relationship with the host social system:
  *   **Core Tenet:** By voluntarily entering and benefiting from a relatively well-ordered social environment (safety, predictability, services), the visitor incurs obligations analogous to a tenant. These obligations are proportional to the *duration of stay* and the *nature of the benefit derived* from the convention's smooth functioning.
  *   **Key Distinction:** Obligations bifurcate based on tenancy status:
      *   **Non-Disruption Duties (Tenants):** The primary obligation for short-term visitors. Avoid actively undermining conventions whose smooth operation is necessary for the basic order, fairness, or efficiency *you are currently benefiting from*. (e.g., queue-jumping disrupts fairness and order; mass tourist jaywalking disrupts traffic flow and safety).
      *   **Maintenance Duties (Owners/Long-Term Residents):** Include non-disruption *plus* active upkeep, nuanced understanding, and contributing to the system's evolution. (e.g., knowing *all* tipping nuances; understanding deep cultural context behind bowing).
  *   **Explaining the Asymmetry:** Violations of "non-disruption duties" (e.g., queue-jumping) directly harm the immediate, tangible benefits (order, fairness) that *all* present (locals and visitors) rely on *right now*, justifying stronger anger. Violations of "maintenance duties" (e.g., imperfect bowing) typically cause less immediate, tangible harm to the system's core function for other users.

  **4. Methodology:**
  1.  **Conceptual Analysis:** Precisely define "moral tenancy," "non-disruption duty," "maintenance duty," and "benefit derived."
  2.  **Case Study Testing:** Apply the framework to diverse, real-world conventions:
      *   High-Stakes Disruption: Queueing, Traffic Norms (jaywalking)
      *   System-Reliant Exchange: Tipping
      *   Low-Stakes Etiquette: Bowing, Greeting Customs
      *   Boundary Cases: Dress codes in sacred spaces, photography bans.
  3.  **Intuition Pumping:** Compare framework outputs against robust intuitions regarding blame, guilt, and permissibility for visitors vs. residents in each case. Does it better explain the observed asymmetries?
  4.  **Counterexample Hunting:** Actively seek cases where the framework yields counterintuitive results (e.g., does a short-term visitor in a strong-tipping culture have a "non-disruption duty" to tip, as *not* tipping could undermine wage structures they benefit from via service?).

  **5. Expected Outcomes & Value:**
  *   **Theoretical:** A novel, pragmatic ethical framework for understanding visitor obligations that moves beyond unhelpful binaries. Clarifies why some conventions feel morally binding for visitors while others do not.
  *   **Practical:** Potential foundations for:
      *   More nuanced "Responsible Tourist" guidelines.
      *   Policy discussions on managing tourist behavior (e.g., prioritizing enforcement of genuinely disruptive acts).
      *   Helping individuals navigate cultural differences with greater ethical clarity.
  *   **A Useful Result:** A decision heuristic for travelers: "Could my action *right now* actively disrupt the basic order, fairness, or essential functioning of a system I'm currently relying on?"

  **6. Risk of Failure & Scope:**
  *   **Key Risk:** The framework might simply reduce to "longer stay = more rules," failing to provide a truly distinct *moral* foundation beyond residency duration. Success hinges on robustly linking obligations to the *nature of the benefit* and the *type of harm* caused by disruption.
  *   **Scope Management (Semester Feasibility):** This project is **well-suited for a semester**. Focus is deliberately narrow:
      *   **Conventions Only:** Excludes formal laws (beyond illustrative examples like jaywalking) and deep cultural/religious rites requiring significant initiation.
      *   **Limited Cases:** Depth over breadth; analyze 3-4 core convention types thoroughly rather than cataloguing many.
      *   **Foundation, Not Proof:** Aim is to propose and rigorously *test* the framework against intuitions and counterexamples, not definitively prove it against all comers. Literature integration (e.g., political obligation, social contract, role morality) is crucial but manageable within the core argument.

  **7. Conclusion:**  
  The "moral tenancy" framework offers a promising alternative for grounding the varied moral obligations visitors feel towards local conventions. By centering temporary membership, derived benefits, and the distinction between disruption and maintenance, it aims to resolve the tension between rigid conformity and cultural relativism, providing a principled explanation for the asymmetrical reactions we observe. This project will rigorously develop and test this hypothesis through conceptual analysis and case studies.

  ---

  **Key Strengths of this Proposal:**

  1.  **Clear Problem:** Immediately states the debate and identifies the insufficiency of existing views.
  2.  **Novel Concept:** "Moral Tenancy" and the disruption/maintenance split are central and distinctive.
  3.  **Explains the Asymmetry:** Directly addresses your core observation about differing levels of anger/guilt as the *key motivator*.
  4.  **Practical Relevance:** Explicitly states the potential value beyond theory.
  5.  **Realistic Scope:** Clearly defines boundaries and argues for feasibility within a semester.
  6.  **Acknowledges Risk:** Honestly confronts the main potential weakness.
  7.  **Workshop Ready:** Concise, focused, jargon-minimized, and poses a clear, debatable thesis.

  **Next Steps for You:**

  1.  **Flesh out Case Studies:** Think deeply about *why* queueing feels like a non-disruption duty while bowing feels more like a maintenance duty under the framework. What specific benefit does the visitor derive from the queue system *at that moment*? What harm does skipping cause *immediately*?
  2.  **Refine Definitions:** Sharpen "benefit derived" and "disruption." Is benefit purely functional (order, efficiency) or does it include less tangible goods (respect, avoiding offense)?
  3.  **Anticipate Pushback:** How will you defend against "But isn't *all* convention-following about avoiding disruption?" or "Doesn't this let tourists off the hook for learning *anything* beyond the bare minimum?"
  4.  **Literature Hook (Later):** Think about philosophers discussing political obligation for visitors (e.g., brief references to Simmons on consent vs. fairness), role morality, or the ethics of hospitality. But as requested, this isn't needed in the core proposal.

  This proposal provides a strong foundation to argue that the *type* of obligation a visitor has depends crucially on their temporary relationship ("tenancy") to the functioning of the specific social system in question. Good luck!
