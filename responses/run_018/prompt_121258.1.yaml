answer: |-
  ## Desiderata for a Theory of Evidential Cooperation in Large Worlds

  This specification defines requirements for a theory enabling bounded agents to make a single decision in a large world. The agent faces numerous other agents (natural or artificial) with varying degrees of similarity, including shared origins or common causes. The world is "large": the agent cannot enumerate relevant states of nature, and its decision is correlated (through unknown mechanisms) with decisions made by unseen agents. The theory must prescribe when and how strongly the agent should treat its own decision as evidence about others' decisions, and what action it should consequently take.

  **Numbered Desiderata:**

  1.  **Requirement: Handle Continuous Similarity Gradients.**  
      The theory must output cooperation probabilities and recommended actions that vary smoothly as the estimated similarity to other agents changes from 0 (no similarity) to 1 (exact functional twin). Regression towards a population base rate must occur naturally as similarity decreases.  
      **Motivation:** The "Exact-Twin vs. Near-Twin" case. A theory that treats a 99.9% similar agent identically to an exact twin ignores crucial uncertainty and risks catastrophic miscoordination if the similarity estimate is slightly wrong or the agent differs in a critical way. Conversely, a theory offering no cooperation guidance for agents slightly above baseline similarity misses crucial opportunities.  
      **Status:** Non-negotiable. Practical coordination depends on degrees of resemblance.

  2.  **Requirement: Avoid Aggregation Artifacts.**  
      The theory must not generate arbitrarily high confidence in correlated outcomes solely due to the *number* of weakly correlated agents, absent strong independent justification for their collective predictability.  
      **Motivation:** The "Many-Weakly-Correlated" case. If thousands of agents are each only 1% likely to cooperate conditional on my cooperation, naively aggregating might suggest near-certain mass cooperation. However, if these weak correlations are spurious or stem from independent factors, this confidence is illusory. The theory must guard against manufacturing significance from volume alone.  
      **Status:** Non-negotiable. Artificially inflated confidence leads to reckless actions based on false evidence.

  3.  **Requirement: Accommodate Diffuse Correlation.**  
      The theory must function effectively even when correlation arises from broad statistical regularities or shared environmental pressures, not a discrete, identifiable common cause (like a shared designer or direct communication channel).  
      **Motivation:** The "Diffuse Case". Agents evolving in similar environments or subject to similar selection pressures may exhibit correlated behaviors without any single traceable link. A theory requiring a specific causal mechanism fails in these realistic scenarios.  
      **Status:** Non-negotiable. The large world assumption implies unenumerable causes; demanding identifiable discrete causes is unrealistic.

  4.  **Requirement: Robustness to Indexical Uncertainty.**  
      The theory's prescriptions must not be hypersensitive to the prior distribution over the *number* of similar agents, particularly avoiding generating strong cooperative imperatives solely from heavy-tailed priors on population size in the absence of strong similarity evidence.  
      **Motivation:** The "Indexical Case". An agent uncertain whether there are 10 or 10^100 near-copies shouldn't find its decision radically altered *only* by a prior assigning non-negligible probability to astronomically large numbers, especially if its evidence for similarity is weak. Cooperation should stem from genuine similarity and correlation evidence, not prior uncertainty scale.  
      **Status:** Non-negotiable. Decisions should be primarily evidence-driven, not prior-driven in this manner. (Note: The prior *will* influence the posterior, but it shouldn't *dominate* absent evidence).

  5.  **Requirement: Distinguish Evidence from Causation.**  
      The theory must rigorously separate the evidential significance of the agent's own action (what it indicates about others' actions) from any causal consequences of that action (what it directly brings about). Evidential gains must not be misattributed as causal gains.  
      **Motivation:** The "Counting Distinction". Seeing my cooperation as evidence *that* many others cooperate is fundamentally different from my cooperation *causing* many others to cooperate. Conflating them ("I should cooperate because it *makes* others cooperate") is a profound error in large worlds where direct causation is absent.  
      **Status:** Non-negotiable. This distinction is foundational to evidential reasoning.

  6.  **Requirement: Function Under Opposed Values.**  
      The theory must provide sensible guidance when the agent has strong evidence that correlated agents have values opposed to its own (including adversarial agents capable of predicting its policy). It should not naively recommend actions that would aid adversaries simply because those actions are correlated.  
      **Motivation:** The "Opposed-Values Case". If cooperating robustly signals my intentions to a well-simulated adversary who will defect against me, cooperating based purely on evidence of correlation is self-destructive. The theory must incorporate the *utility consequences* of the correlated actions it predicts.  
      **Status:** Non-negotiable. Agents must navigate worlds containing potential adversaries.

  7.  **Requirement: Achieve Reflective Stability (or Graceful Failure).**  
      The theory must prescribe a stable action for an agent who knows it is implementing that same theory. If no such stable action exists for some plausible scenarios, the theory must clearly signal this failure mode and offer a fallback decision procedure.  
      **Motivation:** The "Fixed-Point Case". An agent reasoning "If I run theory T, it tells me to do X. But if I do X, and others like me also run T, will this lead to a good outcome?" needs a consistent answer. If the theory cannot resolve this self-reference, it risks incoherence or infinite regress in critical moments.  
      **Status:** Non-negotiable for coherence. A bounded agent *must* be able to reach a decision. Graceful failure is acceptable if stability is impossible.

  8.  **Requirement: Practical Similarity Estimation.**  
      The theory must specify, or be compatible with, a method for the bounded agent to empirically estimate the relevant "similarity coefficient" (from Desideratum 1) based on a finite history of observed behaviors of other agents, acknowledging the inherent uncertainty in this estimation.  
      **Motivation:** The "Similarity-Metric Case (Practical)". While the *concept* of similarity is abstract, an implementable theory requires a concrete, learnable procedure. An agent must use its limited observations to gauge how predictive its actions are of others'. The procedure must be robust to reasonable variations in how similarity is quantified.  
      **Status:** Non-negotiable for implementation. The agent needs an estimation strategy.

  9.  **Requirement: Formal Similarity Specification (Negotiable).**  
      The theory must explicitly define the mathematical properties of the "similarity" metric it uses (e.g., is it a probability? a correlation coefficient? defined over what objects?).  
      **Motivation:** The "Similarity-Metric Case (Formal)". For theoretical clarity and to avoid hidden assumptions, the nature of the similarity measure should be formally defined.  
      **Status:** Preference (for theoretical clarity/rigor). Different reasonable formalizations might be workable (e.g., conditional probabilities, mutual information). The core requirement is Desideratum 8.

  10. **Requirement: Metric Invariance (Sectarian).**  
      The theory's final action recommendations must be invariant under all "reasonable" choices of similarity metric.  
      **Motivation:** The "Similarity-Metric Case (Invariance)". Argues that since similarity is subjective, the theory shouldn't depend on its specific formalization.  
      **Status:** Sectarian demand and likely impossible. The choice of similarity metric fundamentally shapes what correlations the agent looks for and learns from (Desideratum 8). Different metrics will yield different estimates from finite data, leading to different decisions. *Demoted.* The requirement is for *practical estimation* (D8), not invariance.

  **Incompatible Subsets:**

  The most significant incompatibility lies between **Opposed Values (D6)** and achieving **Reflective Stability (D7)** in adversarial environments.

  *   **Conflict:** Consider an agent facing a powerful adversary who can perfectly simulate the agent's decision theory. Desideratum 6 demands the agent avoids actions that robustly signal its intentions if the adversary exploits this. However, Desideratum 7 demands the theory prescribes a stable action knowing it is being simulated.
  *   **Problem:** The adversary, predicting the agent's policy, will choose the action that maximizes the adversary's utility given that prediction. The agent, knowing this, seeks a policy that is optimal *given* the adversary's best response. This is the structure of a Stackelberg game or adversarial prediction scenario.
  *   **Incompatibility Argument:** Achieving a stable fixed point (D7) where the agent's policy is optimal given the adversary's response, and vice-versa, is often impossible in pure conflict scenarios (zero-sum games). The agent might want to randomize, but finding a Nash equilibrium or correlated equilibrium requires coordination mechanisms often absent in large worlds. A theory strictly enforcing D7 might force cooperation even when exploited (violating D6), or force defection missing opportunities when the adversary isn't perfectly aligned *or* present. Conversely, a theory focused solely on D6 might prescribe policies that are unstable under reflection (violating D7) – e.g., "Always defect against potential adversaries," which might lead to mutual defection even when limited cooperation was possible.
  *   **Resolution:** This suggests the theory *cannot* guarantee perfect reflective stability (D7) in all adversarial situations (D6) without sacrificing optimality against adversaries. The fallback in D7 ("graceful failure") becomes crucial here, perhaps defaulting to a robust but suboptimal policy when no stable mutually acceptable solution exists.

  **Most Exclusionary Requirement:**

  **Accommodate Diffuse Correlation (D3)** does the most exclusionary work. Enforcing it strictly eliminates a large share of otherwise attractive candidate theories.

  *   **Why it Bites Harder:**
      1.  **Ubiquity of Mechanism:** Theories built primarily around *causal* models, or requiring identifiable *mechanisms* for correlation (like shared source code, direct signaling, or identifiable common causes), fail immediately in diffuse scenarios. Many intuitive decision theories rely on modeling causal pathways.
      2.  **Evidential Purity vs. Practicality:** While purely evidential theories (like early formulations of EDT) *can* handle diffuse correlation in principle, they often stumble on other requirements (especially D6 - Opposed Values and D5 - Evidence/Causation distinction). Enforcing D3 forces the theory away from causal crutches, pushing it into the complex territory of pure statistical evidential reasoning under uncertainty, which then makes satisfying D6 and D7 significantly harder.
      3.  **Similarity Estimation Challenge:** D3 necessitates that similarity estimation (D8) must work *without* relying on identifying specific causal links. This demands robust statistical learning from behavioral patterns alone, a harder problem than leveraging known shared origins. Theories reliant on specific structural assumptions about agent origins fail here.
  *   **Result:** D3 acts as a filter, eliminating theories overly reliant on causal structure or specific correlation mechanisms. This forces the solution space towards sophisticated evidential reasoning and robust statistical learning, making the remaining challenge of handling adversaries (D6) and achieving stability (D7) within this framework the critical frontier.

  **Optional Scorecard of Existing Families:**

  | Family of View              | D1 (Gradient) | D2 (Aggregation) | D3 (Diffuse) | D4 (Indexical) | D5 (Evid/Cause) | D6 (Opposed Val) | D7 (Stability) | D8 (Estimation) |
  | :-------------------------- | :------------ | :--------------- | :----------- | :------------- | :-------------- | :--------------- | :------------- | :-------------- |
  | **Causal Decision Theory (CDT)** | Poor          | Poor             | **Fail**     | Poor           | Strong          | Strong           | Mixed          | **Fail**        |
  | **Evidential DT (EDT)**         | Mixed         | **Fail**         | Strong       | **Fail**       | Weak            | **Fail**         | Weak           | **Fail**        |
  | **Updateless DT (UDT)**         | Strong        | Strong           | Strong       | **Fail**       | Strong          | Mixed            | Strong         | **Fail**        |
  | **Learning-Based Pragmatic**    | Strong        | Strong           | Strong       | Strong         | Mixed           | Mixed            | Mixed          | Strong          |

  *   **Explanation:**
      *   **CDT:** Fails D3 (needs causes), D8 (needs causal model). Struggles with D1/D2/D4. Strong on D5/D6.
      *   **EDT:** Fails D2 (naive aggregation), D4 (vulnerable to priors), D6 (can aid adversaries), D8 (no learning spec). Strong on D3/D5 in principle, but D5 weakness leads to exploitation (D6 fail). Mixed on D1/D7.
      *   **UDT:** Strong on D1/D3/D5/D7. Fails D4 (often relies on large universe/similarity priors), D8 (abstract similarity). Mixed on D2 (depends on prior/aggregation) and D6 (can cooperate with adversaries).
      *   **Learning-Based Pragmatic:** Strong on D1/D2/D3/D4/D8 by design (focuses on empirical learning from behavior). Mixed on D5 (risk of conflation in implementation), D6 (strategic reasoning needed), and D7 (stability under learning is complex). Represents the *type* of approach needed.

  This specification prioritizes requirements essential for a bounded agent making a single decision under profound uncertainty and correlation in a large world. The core tensions, particularly between handling adversaries and achieving stability under self-knowledge, and the stringent demand to function without identifiable causal mechanisms, define the challenging but necessary frontier for this theory.
