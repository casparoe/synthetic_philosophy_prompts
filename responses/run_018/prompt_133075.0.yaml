answer: |-
  The bottom line is this: the strong thesis of embedded agency—that deliberative control emerges from the dynamical coupling of brain, body, and environment without a central executive—dissolves the traditional regress problem driving hierarchical models of self-control, rendering such models unnecessary; the anchoring of long-term preferences is achieved not by an internal "true self" halting a chain of desires, but by the constitutive role of stable epistemic scaffolding within the environment itself, which stabilizes the agent's deliberative processes externally.

  To defend this, we must first articulate the strong embedded agency thesis. It moves beyond the uncontroversial observation that agents *use* environmental supports. It asserts that the very structure of deliberation and control is constituted by the ongoing, reciprocal interaction between neural processes, bodily capacities, and structured environmental resources. Cognitive processes, including those underpinning intention formation and action guidance, are not merely *influenced* by the world but are fundamentally *spread across* it. Crucially, there is no privileged internal locus—no homunculus-like central executive or highest-order volition—that stands outside this coupled system to survey, integrate, and finally authorize actions. Control is an emergent property of the entire dynamic system in its environment. This view finds resonance in dynamical systems approaches to cognition and enactivist perspectives emphasizing the co-constitution of mind and world.

  The classic hierarchical model (e.g., Frankfurt, Bratman) addresses the problem of agential authority and self-control by positing a regress-stopping mechanism *within* the agent. If first-order desires conflict, a higher-order desire (e.g., a desire *about* which first-order desire to act upon) is invoked. However, this invites an infinite regress: what authorizes *that* higher-order desire? The solution proposed is a highest-order identification—a volition or commitment with which the agent "identifies" most deeply, constituting their "true self." This self stands at the top of the hierarchy, terminating the regress by providing the ultimate source of endorsement. The problem here is not merely the questionable metaphysics of a regress-stopping self. It is that the entire model presupposes a fundamentally *internalist* and *hierarchically isolated* architecture for resolving normative conflict and establishing stable preferences.

  The strong embedded agency thesis dissolves this regress by fundamentally reconfiguring the ontology of preference formation and stabilization. It argues that the stability required for coherent deliberation and long-term action—the very stability the hierarchical model seeks via a highest-order volition—is not primarily achieved by internal architecture but by the agent's reliable coupling with persistent structures *in the world*. These structures—epistemic scaffolding such as meticulously kept calendars and commitment devices, public declarations and social accountability mechanisms, ingrained routines and ritualized practices—are not mere passive tools. They are *active participants* in the deliberative loop. They constrain options, cue relevant considerations, enforce consistency over time, and physically embody commitments. Crucially, they partially *constitute* the agent's long-term preferences. My commitment to finishing my dissertation is not just represented by an internal state; it is embedded in the draft chapters on my desk, the scheduled meetings with my advisor, the publicly announced defense date, and the daily writing routine structuring my mornings. These elements actively shape and maintain the deliberative processes that sustain the commitment; they are not external prompts for an internal executive to consider, but integral components of the extended cognitive system realizing the commitment itself.

  Consequently, the regress problem evaporates. The infinite ascent of desires seeking authorization is circumvented not by finding an internal stopping point, but by the external stabilization of the deliberative process itself. The scaffolding provides the "fixity" that halts the potential for endless vacillation. It does so not by being an *object* of a higher-order desire (I don't have a higher-order desire *about* my calendar), but by being a *structural component* enabling the effective functioning of my first-order deliberation and action control. The question "But what authorizes *this* piece of scaffolding?" is misguided. The scaffolding's authority derives not from an internal endorsement *at the moment of action* but from its functional role within the coupled, history-laden system that *is* the agent-in-their-environment. Its stability arises from its material persistence, social embeddedness, and reliable coupling with the agent's dispositions and practices over time. The need for an internal executive to halt a hierarchy of desires disappears because the environment itself, through its reliable scaffolding, provides the necessary grounding for coherent, temporally extended agency. The locus of control and stability is distributed across the system, not concentrated in a final internal arbiter. Thus, the hierarchical model, built to solve an internally generated regress, becomes an unnecessary postulate once agency is properly understood as constitutively embedded.
