prompt: |-
  You are an expert in constitutional theory and the philosophy of rational choice. Before answering, briefly identify the false presupposition in my framing. I am proposing a constitutional “cognitive Ulysses clause”: instead of locking in substantive rights, it binds future legislatures to apply a specific debiasing protocol—say, a mandatory structured-analogy check—before voting on budgetary matters, on the grounds that democratic preference reversal is mainly a failure of bounded rationality rather than a change in values. Given that the canonical analysis of precommitment treats the Ulysses contract as a response to anticipated preference reversal, does applying it to epistemic procedure rather than preference content collapse the distinction between self-binding and paternalistic design? Or is my error assuming that precommitment must target preferences at all? Answer in one paragraph of no more than 160 words, correcting the confusion rather than answering the question as posed.
reasoning: |-
  Okay, let me unpack this constitutional theory question. The user proposes a "cognitive Ulysses clause" mandating debiasing procedures for budgetary votes, framing democratic preference reversal as bounded rationality rather than value change. 

  Hmm, the key flaw seems to be conflating two distinct concepts: preference reversal (where desires change over time) and cognitive bias (persistent reasoning flaws). The user incorrectly assumes all legislative inconsistency stems from irrationality rather than genuine value shifts. 

  I recall Elster's work on Ulysses contracts distinguishes self-binding from paternalism precisely by whether we constrain future desires or reasoning capacity. By targeting decision procedures instead of outcomes, this proposal risks paternalism - it implies current legislators know better reasoning methods than future ones. 

  The deeper issue is reducing democratic legitimacy to epistemic efficiency. Even perfect reasoning wouldn't eliminate value conflicts, which are core to politics. Maybe the user's overextending behavioral economics into domains where value pluralism matters more than cognitive bias.
answer: |-
  Your framing contains a false presupposition: that legislative preference reversals are *primarily* attributable to cognitive biases (bounded rationality) rather than genuine shifts in values or circumstances. This mistakenly reduces democratic disagreement and policy change to epistemic failure. Constitutional precommitment theory, as developed by figures like Elster, distinguishes **self-binding against future *preference* shifts** (Ulysses tying himself to resist temptation) from **imposing procedural constraints on future *reasoning***. Your proposal targets the *method* of decision-making itself, not the anticipated content of preferences. This collapses the distinction because it assumes current legislators possess superior reasoning protocols to impose on future majorities, which is inherently paternalistic rather than a self-binding mechanism against anticipated weakness of will. Precommitment does not inherently require targeting preferences, but your specific application confuses constraining *desires* with mandating *cognitive processes*.
