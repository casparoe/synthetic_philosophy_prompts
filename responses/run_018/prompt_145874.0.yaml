prompt: |-
  I've come around to a pretty strong version of the hedonistic imperative: we should use biotech not just to reduce suffering but to re-engineer sentience itself so that positive states are decoupled from achievement, contrast, or desire-satisfaction. Basicly, replace the reward system with sustained baseline bliss that doesn't depend on getting what you want. What would actually count against this? I don't mean just it sounds dystopian -- I want the real defeaters. Which intuitions about authenticity or meaning would a defender have to bite, and which ones could they just dismiss? Are there formal results in decision theory or value theory that make this unstable? Rank them from fatal to just awkward, and say what a committed proponent would concede versus what they'd brush off.
