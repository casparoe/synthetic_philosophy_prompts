prompt: |-
  I'm running a 40-minute session for a philosophy-curious high-school debate club on superrationality, but not the classic prisoner's-dilemma framing that every intro memos — I want to build it around a noisy stag hunt where you cant tell if the other hunter heard the horn. Don't explain the idea to me; plan the teaching arc. What dependency has to come first and why rational-choice reasoning alone fails here, which carrying example carries the idea (the noisy stag hunt) and what it must include and exclude, the misconceptions they'll form in order — I'm guessing "superrational means being extra smart" and "it needs telepathy" — and exactly where in the sequence to head off each, the check at the end that shows they understand the coordination logic not just repeating "cooperate", and what formal game-theory machinery I should openly refuse to use. Take a definite stance on the order and defend it against at least one plausible alternative. End with one line: Verdict: [one-sentence summary of the plan].
reasoning: |-
  We are designing a 40-minute session for high school students in a debate club who are philosophy-curious. The topic is superrationality, but we are avoiding the classic Prisoner's Dilemma and instead using a noisy stag hunt. 

  Key Objectives:
  1. Introduce the concept of superrationality without relying on the Prisoner's Dilemma.
  2. Use a noisy stag hunt scenario where the noise (uncertainty about the other hunter hearing the horn) creates a coordination problem that rational-choice reasoning alone cannot solve.
  3. Plan the teaching arc: what comes first, the example, misconceptions and when to address them, and a check for understanding.
  4. Avoid formal game theory machinery (e.g., Nash equilibrium, payoff matrices in detail, etc.).

  Teaching Arc:

  1. **Introduction to Rational Choice (5 minutes):**
     - Start by explaining rational choice: individuals act in their own best interest, given their beliefs about the world and other players.
     - Use a simple example: choosing between a safe option (hare) and a risky but better option (stag) when you know the other player will cooperate. But note: in the classic stag hunt, if you are sure the other will hunt stag, you should too; if not, you should hunt hare.
     - Why start here? Because we need to establish the baseline of rational choice to show where it fails.

  2. **Introducing the Noisy Stag Hunt (10 minutes):**
     - Describe the scenario: Two hunters are in the forest. They can hunt a stag (which requires both) or a hare (which one can do alone). A stag is worth more than a hare. But there's a twist: a horn sounds to signal the start of the hunt. However, the forest is noisy, so each hunter only hears the horn with probability p (say, 50%). Moreover, each hunter doesn't know if the other heard the horn. 
     - Critical elements to include:
       - The payoff structure: 
          - If both hunt stag and both heard the horn, they get the stag (high payoff).
          - If one hunts stag and the other doesn't (or if one didn't hear and hunts hare), the stag hunter gets nothing and the hare hunter gets the hare (medium payoff).
          - If both hunt hare, they both get the hare (medium payoff, but less than stag).
          - But note: if a hunter didn't hear the horn, they might think the hunt hasn't started and may default to hare (or not?).
       - The uncertainty: Each hunter must decide without knowing if the other heard the horn. They only know their own state (heard or not).
     - Exclude: detailed probability calculations at first; we are building intuition.

  3. **Why Rational Choice Fails Here (5 minutes):**
     - Ask: What should a rational hunter do?
       - Case 1: If I heard the horn, I don't know if the other did. If I choose stag, I risk getting nothing if the other didn't hear and hunts hare. If I choose hare, I get the hare for sure but miss out on the stag if the other heard and is hunting stag.
       - Case 2: If I didn't hear the horn, I might think the horn didn't sound, so the other probably didn't hear either? But wait, I don't know. Maybe the other heard and is hunting stag? Or not?
     - The problem: Without knowing what the other will do, and without knowing the other's state, there is no dominant strategy. Rational choice based on individual expected utility maximization leads to a coordination failure because each might play it safe and hunt hare, even when both heard the horn and could have gotten the stag.

  4. **Introducing Superrationality (10 minutes):**
     - Define superrationality: A mode of reasoning where players recognize that they are in a symmetric situation and that they will both reason the same way. So, they should condition their action on the premise that the other will do the same as they do.
     - Apply to the noisy stag hunt:
       - If I heard the horn, I assume that if the other heard the horn, they will reason the same as me. So we both hunt stag and get the stag. If the other didn't hear, then they will hunt hare regardless, so I get nothing if I hunt stag. But note: superrationality says I should condition on the symmetry: I should act as if the other is in the same state and will do the same. Therefore, if I heard, I hunt stag because I assume the other also heard and will hunt stag. If I didn't hear, I hunt hare because I assume the other also didn't hear and will hunt hare.
     - This leads to coordination: when both hear, they both hunt stag; when both don't hear, they both hunt hare; when one hears and the other doesn't, the one who hears hunts stag and gets nothing (because the other didn't hear and hunts hare) and the one who didn't hear hunts hare and gets the hare. But note: the superrational approach does not guarantee the best outcome in the asymmetric case, but it does in the symmetric cases.
     - Why it's not telepathy: Emphasize that it's about recognizing the symmetry of the situation and reasoning from the perspective that the other is like you and will reason the same. It's not mind-reading.

  5. **Addressing Misconceptions (5 minutes):**
     - Misconception 1: "Superrationality means being extra smart." 
       - When: Address this right after defining superrationality (step 4). 
       - Clarification: It's not about being smarter in the traditional sense; it's about a different kind of reasoning that considers the symmetry and interdependence. It's a shift in perspective.
     - Misconception 2: "It requires telepathy."
       - When: Also during step 4 or when explaining the symmetric reasoning. 
       - Clarification: There is no psychic communication. It's about logical reasoning: "If I am in a symmetric situation, and we are both superrational, then we will both come to the same conclusion. Therefore, I can base my decision on that."

  6. **Check for Understanding (5 minutes):**
     - Pose a scenario: "Suppose the horn sounds and both hunters hear it. What would a superrational hunter do? Why?"
     - Then: "Suppose the horn sounds but only one hunter hears it. What happens in the superrational approach? Why is that acceptable in this framework?" (We accept that in the asymmetric case, we don't get the best outcome, but the symmetric cases work.)
     - Then, ask: "What if we used ordinary rational choice? What would happen if both heard the horn?" (They might both hunt hare because they fear the other didn't hear, leading to a suboptimal outcome where they get hare instead of stag.)

  7. **Formal Game Theory Machinery to Avoid:**
     - Openly refuse to use:
       - Payoff matrices with numbers (we are using qualitative descriptions).
       - Nash equilibrium (we are not going into the formal definition).
       - Mixed strategies or expected utility calculations (we are keeping it conceptual).

  Order Defense:
  - Alternative order: Start directly with superrationality and then introduce the noisy stag hunt.
    - Why we don't do that: We need to set up the problem that rational choice fails to solve. By starting with rational choice and showing its failure, we create the motivation for superrationality. If we start with superrationality, it might seem arbitrary.

  Verdict: We start with rational choice to set the baseline, then introduce the noisy stag hunt to show rational choice's failure, define superrationality as a solution that leverages symmetry, address misconceptions immediately during the definition, and check understanding with targeted questions on coordination logic.
answer: |-
  ### Teaching Arc for 40-Minute Session: Superrationality via Noisy Stag Hunt  
  **Definite Stance Order:**  
  1. **Rational-Choice Primer (5 min)**  
     - **Dependency:** Start with rational-choice theory (maximize individual payoff given beliefs).  
     - **Why first?** Students need this baseline to see its failure. Use a **simple 2x2 matrix-free example**: "You’re deciding whether to study alone (guaranteed B) or collaborate (A+ if both commit, F if partner flakes). What’s 'rational' if you distrust your partner?" Elicit that distrust leads to suboptimal outcomes (B instead of A+).  
     - **Defense vs. Alternative:** *Avoid* jumping straight into superrationality—students would dismiss it as "irrational" without seeing standard rationality’s limits first.  

  2. **Noisy Stag Hunt Setup (10 min)**  
     - **Core Example:** Frame the hunt:  
       - **Include:** Two hunters. Stag = high reward (requires both), Hare = low reward (solo). A horn signals "go," but noise means each has 50% chance of hearing it. *Crucially, neither knows if the other heard*.  
       - **Exclude:** Probability math. Focus on the dilemma:  
         - "If you hear the horn, do you hunt stag (risking no partner) or hare (safe but mediocre)?"  
         - Highlight symmetry: Both face identical uncertainty.  
     - **Why rational choice fails:** Uncertainty breaks Nash reasoning. No dominant strategy—hunting stag is rational *only* if you believe the other heard the horn and will hunt stag. But with no communication, mutual pessimism leads to hare-hunting.  

  3. **Introduce Superrationality (10 min)**  
     - **Definition:** "Superrationality: Assuming identical reasoning in symmetric games, so your choice *determines* the other’s."  
     - **Apply to Stag Hunt:**  
       - "If you hear the horn, assume the other heard *and* will mirror your choice. Hunting stag becomes rational—if you do it, they do too."  
       - Explicitly contrast with rational choice: "Rationality asks, ‘What should *I* do given my beliefs?’ Superrationality asks, ‘What should *we* do if we reason identically?’"  
     - **Preempt Misconceptions HERE:**  
       - **"Extra smart?"** Immediately clarify: "It’s not about outsmarting others—it’s recognizing symmetry makes your action a logical blueprint for theirs."  
       - **"Telepathy?"** Shoot down: "No mind-reading! It’s a decision rule for symmetric games: ‘I do X because if we’re identical, they’ll do X too.’"  

  4. **Coordination Logic Drill (10 min)**  
     - **Check Understanding:** Pose scenarios requiring *conditional* reasoning:  
       - "If both hear the horn and are superrational, what happens?" → Both hunt stag (optimal).  
       - "If you hear but the other doesn’t, what occurs?" → You hunt stag (expecting coordination), they hunt hare (they assume silence → mutual hare). *Accept asymmetric loss—emphasize it beats mutual defection*.  
       - **Trap Question:** "Should you *always* hunt stag?" Force them to reject this: "No! If you don’t hear the horn, superrationality says hunt hare—silence implies mutual hare-hunting."  
     - **Why last?** Tests if they grasp superrationality as *conditional coordination* (state-dependent), not dogma.  

  5. **Formal Machinery to Reject (Throughout)**  
     - **Openly refuse:**  
       - Nash equilibrium ("We’re not solving for stability—we’re bypassing it").  
       - Payoff matrices ("Forget numbers; we’re focusing on symmetry, not utils").  
       - Bayesian updating ("No probability tweaking—superrationality ignores beliefs").  
     - **Why?** High-schoolers need conceptual intuition, not formalism. Matrices obscure the symmetry insight.  

  **Verdict:** Build from rational choice’s failure in uncertainty to superrationality’s symmetry-based coordination, using the horn-hearing ambiguity to force a mutual-reasoning solution and explicitly derailing "cleverness" and "telepathy" myths during the transition.**  
  **Final Verdict:** Start with rational-choice limitations in noisy coordination, pivot to superrationality as symmetry-based reasoning, use conditional stag/hunt cases to cement coordination logic, and reject formalism to keep focus on philosophical intuition.
