prompt: |-
  I’ve been volunteering at a community repair cafe — we fix broken electronics and furniture for free. About five years ago, the founder decided we should organize tools by color-coded tape rather than by function, mostly because he liked the look of the rainbow shelve. Now every training manual, every volunteer shift, even the way we talk about repairs (“is this a red-tool job or a blue-tool job?”) is built around those colors. Last month someone proposed switching to a functional layout and half the members freaked out, saying our system is “just how the cafe works” and that any group our size would have ended up with some organizing scheme anyway. But they also admit the colors are totally arbitrary. I keep seeing this pattern elsewhere: an early, pretty random choice becomes the invisible grammar for a whole organization, and then people defend it as both inevitable and essential. Is there an established word or concept for this — specifically the part where an arbitrary early rule gets baked into the language and then people argue about whether it was always going to happen? If not, can you name it and draw the line between it and cases where everyone sticks with something just because switching is too expensive? Keep it under 200 words, one paragraph please.
reasoning: |-
  Okay, the user is describing a situation at a volunteer repair cafe where an arbitrary color-coding system for tools has become deeply ingrained in the organization's operations, language, and identity. They're noticing how this initially random choice has become defended as inevitable and essential, and they want to know if there's a term for this phenomenon.

  This sounds familiar—it reminds me of concepts like path dependence or lock-in effects in organizational theory. The color system wasn't based on any functional logic, but once established, it shaped training materials, workflows, and even the language volunteers use ("red-tool job"). Now when someone suggests changing it, members react emotionally, defending it as "just how things work" while acknowledging its arbitrariness.

  The key aspect here is how the arbitrary rule became embedded in the organization's language and culture, making it feel natural and necessary. This goes beyond simple resistance to change due to costs—it's about how early decisions create self-reinforcing patterns that become institutionalized. The concept of "institutionalization" captures this well, especially when combined with "path dependence" to explain how the initial random choice constrained future options.

  I should distinguish this from cases where people stick with suboptimal systems purely due to switching costs (like sunk costs or retraining expenses). Here it's more about the system becoming part of the organization's identity and grammar. The term "institutionalization" covers the cultural embedding, while "path dependence" explains the historical contingency aspect.

  The user seems intellectually curious—they're recognizing a pattern they've observed elsewhere and want precise terminology to discuss it. I'll keep it concise as requested, under 200 words in one paragraph, while clearly defining the concept and its distinction from pure cost-based persistence.
answer: |-
  This phenomenon is best described as **institutionalization of arbitrary choice**, specifically highlighting **path dependence**, where an early random decision becomes locked in due to self-reinforcing mechanisms (like shared language, training, and identity), making alternatives seem unviable. The key difference from merely sticking with something due to switching costs (like sunk costs or retraining expenses) is the **cultural and linguistic embedding**: the arbitrary rule becomes an ingrained, often invisible part of the organization's "grammar" and identity, leading members to defend it as natural or inevitable ("just how we work"), even while acknowledging its original randomness. The cost isn't just financial; it's the cognitive and social friction of rewriting deeply embedded norms and vocabulary.
