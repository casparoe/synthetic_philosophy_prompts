  This suggests the dispute is indeed verbal at its core - they're using "belief" for distinct phenomena. But there's also a deeper divergence in explanatory goals: constitutive explanation (how beliefs are implemented) versus instrumental success (how to predict behavior). The mechanists' appeal to defeasibility isn't necessarily a biological stipulation; it reflects a view that belief inherently involves rational revisability, which current LLMs lack because their "revisions" occur via retraining, not reasoning.

