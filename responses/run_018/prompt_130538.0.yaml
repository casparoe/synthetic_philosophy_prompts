prompt: |-
  Write notes for a short essay arguing that the narrow definition of the AI alignment problem—intent alignment, as distinct from value alignment—is conceptually unstable. The core claim should be that intentions, in the philosophy of action, are formed under descriptions that are already value-laden (drawing on Anscombe's framework rather than on bare mental pushes); consequently, formalizing an intent with enough precision for an artificial system already embeds normative commitments into the objective. On this view, "doing exactly what we intended" is not a safer, narrower target than "doing what is genuinely good"—it is value alignment executed with poor transparency. I want direct comments on three points: first, whether this collapses the distinction too quickly—specifically, whether a procedural or meta-level version of intent alignment (for example, alignment to a reward signal that we treat as purely instrumental) could survive the objection; second, whether applying philosophy-of-action literature to machine objectives involves a category error that undermines the analogy; and third, whether the argument is actually useful for practitioners or merely makes the alignment problem look harder without clarifying it. Please be frank about which parts of the reasoning are weak, need qualification, or depend on an unstated premise about how intentions get formalized.
