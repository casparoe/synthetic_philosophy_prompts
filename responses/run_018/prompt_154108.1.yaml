answer: |-
  Self-trust in reasoning agents is rational iff the verification process is either externally anchored or procedurally local without global infallibility claims, and irrational iff it involves global self-reference asserting infallibility. This principle hinges on three distinctions: scope of verification (local procedural checks versus global assertions), presence of an external anchor (independent sources or data), and the nature of self-reference (procedural application versus global truth claims). I defend this by applying it to your cases, forcing you to abandon your torn judgment on the local-step agent as irrational due to unresolved infinite regress, while preserving all other verdicts.

  First, the pocket calculator's repeated arithmetic is procedurally local: each computation is verified stepwise against itself, without claiming global infallibility, and it lacks self-referential capability for such claims, making it rational. The chess engine's audit uses an external anchor (endgame tablebases), bypassing self-reference entirely, so it is rational. The formal system's axiom "all theorems I derive are true" is global self-reference asserting infallibility, inviting Löbian collapse, so it is irrational. The human mathematician's intuition trust involves procedural, fallible local checks (e.g., heuristic verification of proofs) without formal global self-reference, as her cognition isn't a formal object, making it rational. The large model's internal consistency loop lacks an external anchor and implicitly asserts global infallibility through circular self-verification, so it is irrational. The distributed scientific community has an external anchor via independent verification across labs, making it rational.

  For the conflicted pair: The resource-bounded agent with local-step verification must be judged irrational under this principle. While it avoids Löbian collapse and bootstrapping circularity by refusing global claims, its verification module checking itself introduces infinite regress that dissolves the self. Procedural locality alone cannot resolve this regress without an external anchor or a non-self-referential foundation, as each local check recursively depends on the verifier's reliability, creating an epistemically vacuous loop. Thus, it fails as genuine self-trust. Conversely, if this agent makes a global statement like "my local checks guarantee my overall reliability," it directly asserts global infallibility, confirming irrationality—a verdict you already accept. You must abandon your torn stance and affirm the local-step agent's irrationality, as the principle shows that procedural self-reference without external grounding inevitably reduces to regress, undermining self-trust. All other judgments align without modification.
