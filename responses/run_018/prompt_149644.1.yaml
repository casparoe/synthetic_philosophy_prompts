  Okay, the user is a PhD student in political philosophy dealing with the dirty-hands literature. Their advisor keeps saying "you can't govern with clean hands" during discussions about hypothetical coalitions with authoritarian parties for climate legislation. The student wants to unpack the precise theses behind that slogan. 

  First, I need to break down the possible interpretations of "you can't govern with clean hands." The user mentioned a distinction between dirt from personal choices versus structural forces, and whether guilt is necessary. That's crucial. They also want a categorized list—trivial, defensible, false, and coalition-supporting theses—to bring back to their seminar.

  Starting with the trivial interpretations: These are the obvious ones that don't add much depth. For example, governing involves making choices, which inherently means responsibility. Or that politics is messy, so purity is unrealistic. These are baseline truths but don't engage with the real philosophical debate.

  Next, the substantive defensible theses. Here's where it gets interesting. Walzer's original idea is that moral conflicts are inevitable in politics. You might have to do something morally wrong for a greater good, and that creates a residue of guilt. But there's also the structural complicity angle—institutions force compromises, so even well-intentioned actors get tainted. Williams' "moral luck" fits here, where outcomes are out of your control, but you're still blamed. And the necessity thesis: some actions are necessary evils, so refusing them avoids dirt but fails your duties. These are strong arguments worth considering.

  Then the false or problematic theses. The user's advisor might be implying some of these. For instance, that moral compromises are always worth it, which ignores thresholds of unacceptable actions. Or that feeling guilty is proof of morality, which could be performative. The cynical view that politics is inherently dirty might excuse too much. And the idea that dirty hands are inevitable could normalize bad actions. These are slippery slopes and need to be challenged.

  Specifically for coalition-building, which theses support dismissing objections? Walzer's necessity argument: compromising with authoritarians for climate goals might be a tragic necessity. But the structural argument says the system forces such choices, so objectors are naive. The "no purity" thesis dismisses absolutist objections. However, the user should watch for the false theses here—like downplaying the risks of normalizing authoritarians or ignoring long-term harm.

  The user's deeper needs: They're trying to figure out their advisor's stance to engage better in seminar. They might also be conflicted about their own views on compromising with authoritarians. The structural vs. personal complicity angle is key for them—they want to know if guilt is necessary or if systems absolve individuals. They might be looking for arguments to critique their advisor or to understand the moral implications of realpolitik.

  Need to make sure the answer is in American English as requested. Also, the typo "clean hans" is a minor point, but they're second-guessing the framing, so clarity is essential. Organizing the theses into categories helps them present it in class. Highlighting the structural aspect and the role of guilt addresses their specific curiosities. Emphasizing that even defensible theses have limits, especially regarding thresholds, helps them counter potential misuse of the slogan.
answer: |-
  Here's a breakdown of the precise theses embedded in "you can't govern with clean hands," categorized as requested, with special attention to structural forces vs. personal choice and the role of guilt. I'll use American English throughout.

  **Core Interpretations of "You Can't Govern With Clean Hands"**

  | **Category** | **Thesis Type** | **Key Idea** | **Structural vs. Personal** | **Role of Guilt** |
  |--------------|-----------------|--------------|----------------------------|-------------------|
  | **Trivial/Descriptive** | Inevitable Choice Thesis | Governing requires decisions affecting lives, creating moral responsibility | Primarily personal | Not addressed |
  |  | Messy World Thesis | Politics operates in imperfect conditions with limited information | Both structural and personal | Not addressed |
  | **Substantive & Defensible** | Walzer's Core Conflict Thesis | Governing requires morally impermissible acts for greater good | Personal choice in response to structural constraints | Central: Feeling guilt proves moral health |
  |  | Structural Complicity Thesis | Institutional logic forces compromise/complicity regardless of intent | Primarily structural | Possible residue; guilt may indicate recognition of complicity |
  |  | Williams' Moral Luck Thesis | Outcomes determine moral judgment; you're blamed for necessary gambles | Structural (luck) shapes personal choice | Residual guilt as acknowledgment of moral cost |
  |  | Necessity Thesis | Refusing necessary moral violations is dereliction of duty | Both: Structural creates necessity; personal executes choice | Likely residue; guilt signals recognition of tragic choice |
  | **False/Problematic** | Consequentialist Absolution Thesis | Good outcomes justify any means | Personal choice excused | Unnecessary; success washes hands clean |
  |  | Guilt as Proof Thesis | Feeling guilty *alone* proves moral health | Not specified | Prioritizes emotion over action/accountability |
  |  | Politics is Inherently Dirty Thesis | Governing *requires* abandoning morality | Both structural and personal | Irrelevant; no guilt expected |
  |  | Inevitability as Excuse Thesis | "Can't" implies no alternative, excusing all actions | Misapplies structural constraints | May suppress necessary guilt |

  **1. Trivial or Tautological Interpretations (Not philosophically interesting, likely *not* your advisor's core point):**
      *   **The Inevitable Choice Thesis:** Governing requires making choices that affect people's lives, creating winners and losers, and thus *some* moral responsibility/blame ("dirt") is unavoidable. *Dirt Source:* Personal (making choices). *Guilt Role:* Unspecified; residue possible but not necessary.
      *   **The Messy World Thesis:** Politics operates in conditions of radical uncertainty, imperfect information, competing values, and human fallibility. Perfectly clean action (flawless execution, pure motives, perfect foresight) is impossible. *Dirt Source:* Primarily structural (the context). *Guilt Role:* Unlikely central; regret possible, but guilt less emphasized.

  **2. Substantive & Defensible Interpretations (The core philosophical debates):**
      *   **Walzer's Core Conflict Thesis (The Classic "Dirty Hands"):** Governing *sometimes necessitates* performing actions that are **morally impermissible** (objectively wrong) in order to prevent a greater evil or achieve a necessary public good, *even when* it's the right thing to do politically. The "dirt" is the objective wrongness of the act itself. *Dirt Source:* **Personal choice** (you *choose* to do the wrong act), but driven by **structural constraints** (the tragic situation demanding it). *Guilt Role:* **Central.** You *should* feel guilty and bear the emotional/moral residue. This guilt is **proof you recognize the act's wrongness and retain moral health.** Refusing the act to keep clean hands is sometimes a culpable evasion of responsibility. *(Applies to coalition: Compromising with authoritarians IS morally wrong (supporting/enabling them), but might be necessary to pass vital climate legislation. You *must* do it, but you *must* feel guilty about it.)*
      *   **The Structural Complicity Thesis (Focus on Institutions):** The logic of political institutions (e.g., electoral systems, coalition dynamics, bureaucratic inertia, capitalist imperatives) **systematically generates compromise and complicity.** Well-intentioned actors are forced into positions where they uphold, benefit from, or collaborate with unjust systems/powers to achieve *any* good or even just to function. The "dirt" is complicity in systemic wrongs. *Dirt Source:* **Primarily structural.** The system forces participation and compromise; personal intent mitigates but doesn't erase complicity. *Guilt Role:* Possible residue; guilt may indicate recognition of complicity, but focus is on the objective entanglement within unjust structures. Absence of guilt might signal bad faith or delusion. *(Applies to coalition: The system *requires* forming coalitions to govern. Refusing *any* coalition with problematic actors means being powerless. Engaging is structurally complicit, even if your goal (climate action) is good. Objections ignore how the game is played.)*
      *   **Williams' Moral Luck & Political Necessity:** Emphasizes the **high stakes, urgency, and uncertainty** of politics. Outcomes are crucial and often determined by luck. Choosing a necessary but morally risky action (like a coalition with authoritarians) can lead to disaster *despite* good intentions and careful calculation. If it goes wrong, you are blamed ("dirty") for the consequences, highlighting the brutal moral luck inherent in governing. *Dirt Source:* **Structural (luck)** shapes the outcome and thus the judgment, but stems from **personal choice** made under pressure. *Guilt Role:* **Residual guilt** is a likely consequence of acknowledging the moral cost and risk undertaken, even if successful. *(Applies to coalition: The gamble *might* pay off (climate wins, authoritarians contained) or backfire (authoritarians gain legitimacy/power). If it backfires, your hands are dirty for enabling them, regardless of intent. Objections underestimate the risk/uncertainty inherent in necessary action.)*
      *   **The Necessity Thesis (Stronger than Conflict):** In extreme political circumstances, refusing to perform a morally repugnant but genuinely *necessary* act (for survival, preventing catastrophe, fulfilling core duties) is itself a **dereliction of duty and morally culpable.** Clean hands are impossible *because* avoiding the dirty act is *also* wrong. *Dirt Source:* **Both.** The **structural** situation creates the necessity; the **personal** choice executes the necessary evil. *Guilt Role:* **Likely residue;** feeling guilt signals recognition of the tragic nature of the choice and the cost paid. *(Applies to coalition: If climate catastrophe is imminent and *only* achievable through *this* coalition, refusing it to avoid "dirt" is an immoral failure of responsibility. You *must* get dirty.)*

  **3. False or Problematic Interpretations (Likely distortions or misuse of the slogan):**
      *   **The Consequentialist Absolution Thesis:** "Dirty hands" just means doing unpleasant but necessary things. If the outcome is good, the means are justified, and there's no *real* moral residue. Hands are effectively *cleaned* by success. *Dirt Source:* Misleadingly framed as personal choice, but dismissed by outcomes. *Guilt Role:* **Unnecessary;** feeling guilty would be irrational if the ends justify the means. *(This often *sounds* like dirty hands but rejects its core feature: the enduring wrongness of the act itself.)*
      *   **The Guilt-as-Sufficient-Proof Thesis:** Merely *feeling* guilty about an action proves you are morally healthy, regardless of the action's nature, justification, or consequences. The emotional state is the *only* important marker. *Dirt Source:* Personal choice, but guilt washes it away symbolically. *Guilt Role:* **Hyper-central, but performative.** Prioritizes feeling over substance. *(Dangerous: Could excuse terrible acts if the actor feels bad.)*
      *   **The "Politics is Inherently Dirty" Thesis (Cynical Realism):** Governing *requires* abandoning ordinary morality. "Clean hands" is a concept for children or saints, not politicians. Get over it. Morality is a hindrance. *Dirt Source:* **Both structural and personal**, but seen as inherent and unproblematic. *Guilt Role:* **Irrelevant or a sign of weakness.** No residual guilt expected or valued. *(Rejects the *tension* central to true dirty hands; it's just amoral realism.)*
      *   **The Inevitability-as-Excuse Thesis:** Because you "can't" govern cleanly, *any* action taken while governing is automatically excused or justified. "Can't" implies there is *no* alternative, removing agency. *Dirt Source:* Structural determinism implied. *Guilt Role:* **Likely suppressed;** acknowledging guilt might undermine the excuse. *(Misuses the concept to evade accountability and critical assessment of specific choices.)*

  **Which Theses Support Dismissing Coalition Objections?**

  Your advisor is likely invoking one or more of the **Substantive & Defensible** theses to counter objections based on the moral impurity of collaborating with authoritarians:

  1.  **Primarily Walzer's Core Conflict Thesis:** She's likely saying: "Yes, allying with authoritarians *is* morally wrong (objectionable), but passing this critical climate legislation is a paramount good/prevents a greater evil, making the coalition a tragic *necessity*. Refusing it to keep your hands clean would be an irresponsible abdication. You *must* do it, but you *should* feel guilty about the compromise." This directly counters purity-based objections by framing them as evasions of necessary responsibility.
  2.  **Possibly the Structural Complicity Thesis:** She might be emphasizing: "This is how the system *works*. To achieve anything, especially something as complex as systemic climate legislation requiring broad support, you *have* to form coalitions, and that means compromising with actors you find morally distasteful. Objecting on purity grounds ignores the structural realities of governing within these institutions. Everyone who governs is complicit in *some* way." This counters objections by framing them as naive about political reality.
  3.  **Potentially the Necessity Thesis:** If the framing is "climate catastrophe is imminent and *only* this coalition can deliver," she might be arguing that refusing the coalition is *itself* an immoral act of negligence given the stakes. Clean hands are impossible *either way*; at least the coalition path achieves the vital goal.

  **What to Watch For (Re: Your Specific Questions):**

  *   **Structural vs. Personal:** When your advisor says "you can't," listen closely. Does she mean "you, as an individual moral agent, *must* choose to do this wrong thing because of the situation" (Walzer/Necessity - personal choice driven by structure)? Or does she mean "the system *forces* complicity on anyone who participates, regardless of their specific choices or intent" (Structural Complicity)? Her emphasis on "govern" hints at structure, but her use of "hands" suggests personal action.
  *   **Guilt:** Does she explicitly mention guilt, remorse, or "bearing the burden"? If yes, she's leaning heavily towards Walzer. If she talks more about practical realities and necessities without mentioning emotional residue, she might be leaning towards Structural Complicity or a more pragmatic (potentially Consequentialist Absolution) view.
  *   **Thresholds:** Is she arguing *this specific* coalition is necessary, or that *all* governing inherently involves such compromises? The latter risks sliding into the "Inevitability-as-Excuse" or "Politics is Inherently Dirty" theses.

  Bringing this menu to your seminar should spark a much more precise discussion. Ask your advisor directly: "When you say 'you can't govern with clean hands' regarding the coalition, are you invoking a Walzerian tragic conflict where we *must* do wrong but bear guilt, or are you pointing more to structural complicity inherent in the system? And how central is the feeling of guilt to your point?" That should clarify her precise claim. Good luck!
