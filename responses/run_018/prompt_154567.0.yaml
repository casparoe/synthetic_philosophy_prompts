answer: |-
  You've hit on a crucial philosophical impasse, and your hunch is remarkably astute. This deadlock arises from multiple, interconnected layers of disagreement. Let's diagnose the structure:

  ### Core Sources of the Impasse
  1.  **Definitional Mismatch (The Verbal Trap):**
      *   **Virtue Ethicists:** Define traits *teleologically* and *holistically*. A virtue is a *disposition cultivated through practice*, aimed at *eudaimonia* (flourishing). It's inherently *context-sensitive* — practical wisdom (*phronesis*) dictates how courage manifests in battle vs. speaking truth to power. Traits are stable *dispositions to perceive, reason, feel, and act* appropriately *within relevant domains*, not robotic behavioral outputs. Low cross-situational correlation in raw behavior isn't fatal; it reflects the *need for judgment*.
      *   **Situationists:** Define traits *operationally* and *behaviorally* for empirical testing. A trait is a *consistent behavioral tendency across diverse situations*. High cross-situational consistency (high correlation coefficients) is the benchmark. Experiments (Milgram, Good Samaritan, Isen & Levin's dime/helping study) showing dramatic behavioral shifts with minor situational tweaks are taken as evidence that global traits either don't exist or are too weak to predict behavior meaningfully. They often implicitly assume traits *should* override situations if they are "real."

  2.  **Level of Analysis & Granularity:**
      *   **Virtue Ethicists:** Focus on the *macro level* – life narratives, long-term development, domain-specific expertise (e.g., "courageous in professional ethics," "compassionate within their community"). Stability is seen in *patterned responses over time within meaningful contexts*, not moment-to-moment reactions to arbitrary lab setups. A "trait" is a complex cognitive-affective-behavioral *system*.
      *   **Situationists:** Focus on the *micro level* – discrete behaviors in experimentally controlled, often novel or high-pressure situations. They demand consistency *across fundamentally different contexts* (e.g., being helpful finding a dropped pen vs. stopping to aid a distressed stranger). Granular behavioral inconsistency is taken as evidence against macro-level character coherence.

  3.  **Normative vs. Descriptive Aims:**
      *   **Virtue Ethicists:** Are primarily engaged in *normative ethics* and *moral education*. They ask: "What *should* a good character look like?" and "How can we cultivate it?" Their concept of traits is aspirational and developmental. Empirical evidence of human frailty doesn't invalidate the ideal or the project.
      *   **Situationists:** Are primarily engaged in *descriptive social psychology*. They ask: "Do people *actually* possess broad, consistent behavioral dispositions?" Their critique is aimed at the *psychological reality* of traits as commonly understood in folk psychology and some philosophical accounts. They see virtue ethics as empirically naive.

  4.  **Standards of Evidence & What Counts as Data:**
      *   **Virtue Ethicists:** Value *narrative evidence*, *biography*, *historical examples*, and *first-person accounts* of moral deliberation and growth. They see lab experiments as artificial, stripping away the rich context and personal history essential for virtue to manifest.
      *   **Situationists:** Value *controlled experiments*, *behavioral observation*, and *statistical aggregation*. They see narratives as post-hoc justifications or unreliable anecdotes vulnerable to confirmation bias. Low correlations are "proof"; anecdotes are not data.

  5.  **The "Representational Model" Misattribution:**
      *   You correctly identify this. Situationists often critique a "straw man" version of traits: a fixed, context-insensitive inner module that deterministically outputs specific behaviors. Virtue ethicists *explicitly reject this*. Virtue *requires* sensitivity to context (*phronesis*). The disagreement is whether the *agent's stable dispositions* play a *significant, identifiable role* in shaping that contextually sensitive response, or whether the situation swamps the person entirely.

  ### Is the Question Ill-Posed? (Partly, But Not Completely)
  *   **Yes, in its crude form:** "Do people have stable global character traits that cause identical behaviors across all situations?" is ill-posed. Virtue ethicists don't claim this, and situationists have conclusively shown this doesn't happen. Debating *this* question is futile.
  *   **No, in more refined forms:** Substantive disagreements remain:
      *   **Empirical:** Do people exhibit *domain-specific* behavioral consistency shaped by relatively stable cognitive-affective structures (schemas, values, skills) developed over time? Is there *predictable variance attributable to the person* (even if it's smaller than situational variance) that isn't just noise? Situationists often argue person variance is negligible; virtue-influenced psychologists argue it's significant within domains.
      *   **Conceptual:** Can the *normative ideal* of virtue (requiring context-sensitivity) be psychologically realized in a way that isn't *reducible* to situational responsiveness? Does the concept retain explanatory/predictive power?
      *   **Explanatory Scope:** Can situationism adequately explain *long-term patterns*, *moral development*, or *deliberative moral action*, or does it best explain *immediate, pressured, or novel situations*? Virtue ethicists argue situationism fails at the former.

  ### Pathways to Progress (Beyond Reading Lists)
  1.  **Reframing the Question:**
      *   Shift from "Do global traits exist?" to: "Under what conditions, within which domains, and to what extent do *relatively stable person-specific factors* (values, schemas, skills, habits) shape morally relevant perception, motivation, and action *in interaction with situations*?"
      *   Ask: "What kind of empirical evidence would be convincing *for the specific concept of a virtue* as understood by virtue ethicists (i.e., context-sensitive, developed, aimed at flourishing)?"

  2.  **Domain-Specific, Longitudinal, Ecologically Valid Research:**
      *   **Not:** Milgram-style obedience across random contexts.
      *   **But:** Tracking individuals over years within specific life domains (e.g., professional ethics, family caregiving, political activism). Measure not just single behaviors, but *patterns of perception* (how they frame situations), *deliberation* (how they reason), *emotional responses*, and *actions*. Look for *intra-individual stability* within domains and *inter-individual differences* in how people navigate similar domain-specific challenges. High-stakes, real-world contexts are crucial.

  3.  **Formal Modeling of Person x Situation Interactions:**
      *   Develop models that don't treat person and situation as additive (P + S), but as multiplicative/interactive (P x S). Can these models identify stable *profiles* of person-factors that predict *patterns* of situational responsiveness? For example, does a "courage" profile predict *when* someone will stand up (in situations involving threat to core principles) and *how* (not just whether they do X or Y)?

  4.  **Investigating "Practical Wisdom" (Phronesis):**
      *   Design studies probing how people with different levels of experience/expertise in a moral domain *perceive and interpret situations*. Do "virtuous" individuals show more nuanced situational discrimination and more consistent (within their value framework) *responses* to *salient features* they've learned to identify? This moves beyond simple behavior to cognition and judgment.

  5.  **Acknowledging Complementary Insights:**
      *   **Concede to Situationism:** Situations *are* incredibly powerful, often dominant, especially in novel, ambiguous, or high-pressure contexts. Automatic processes matter hugely. Global, context-insensitive traits *don't* exist.
      *   **Concede to Virtue Ethics:** Within stable life domains, among mature adults, *some* people develop *relatively stable* constellations of perception, valuing, reasoning, and behavioral tendencies that reflect cultivated dispositions. These *do* shape how they encounter and navigate situations. Narratives and development matter. The *ideal* has psychological traction, even if imperfectly realized.

  **Honest Diagnosis:** The impasse persists because both sides often talk past each other due to differing definitions, methodologies, and core objectives (descriptive prediction vs. normative ideal). However, it's **not purely verbal**. There's a substantive, empirical disagreement about the *degree* and *nature* of behavioral/cognitive consistency attributable to the person *within ecologically valid domains of life*, and whether this consistency reflects something resembling a virtue (a cultivated, reason-responsive disposition) or just narrower habits or skills. Progress requires abandoning the crude "global trait" vs. "situation slave" dichotomy and embracing the messy reality of *domain-specific, interactively shaped, developmentally emergent dispositions*. The most promising path is rigorous, ecologically valid, longitudinal study of moral functioning *within specific life contexts*, using multiple measures (not just behavior) and sophisticated models of person-situation interaction.
