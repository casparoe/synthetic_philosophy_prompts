  ### Decision-Tree Taxonomy of Temporal Ontology  
  The taxonomy branches at four nodes, with answers leading to specific positions. **Bold text** indicates where special relativity forces a choice (i.e., certain combinations are physically implausible or incoherent).  

  ---

  #### **Node 1: Do past and future entities/events exist in the same ontological sense as present ones?**  
  - **Yes** → Proceed to Node 3 (bypass Node 2).  
  - **No** (they do not exist or exist only derivatively) → Proceed to Node 2.  
  - **Only in a derivative sense** (e.g., abstractly or dependently) → Proceed to Node 2.  

  #### **Node 2 (if "No" or "Derivative" at Node 1): What is the nature of the present?**  
  - **Globally extended hypersurface** (a unified "now" across space) → Then:  
    - **Does this require a privileged inertial frame given special relativity?**  
      - **Yes** → Positions requiring absolute simultaneity.  
      - **No** → *Physically implausible* (special relativity denies global frames without privilege).  
  - **Locally point-defined set** (e.g., "now" is tied to an observer’s worldline) → Then:  
    - **Does this require a privileged inertial frame?**  
      - **Yes** → *Incoherent* (local present denies global privilege by definition).  
      - **No** → Positions compatible with relativity.  
  - **Undefined at physical scales** (no objective physical correlate) → Then:  
    - **Does this require a privileged inertial frame?**  
      - **Yes** → *Incoherent* (undefined present cannot require physical frames).  
      - **No** → Positions denying physics grounds the present.  

  #### **Node 3: Is tense (past/present/future) irreducible and mind-independent?**  
  - **Yes** → Tense is fundamental to reality (A-theory).  
  - **No, reducible to tenseless relations** (e.g., earlier/later) → B-theoretic view.  
  - **No, purely linguistic device** → Tense has no metaphysical import.  

  #### **Node 4: Truthmakers for past/future-tensed statements?**  
  - **Direct truthmakers in presently existing entities** (e.g., current facts).  
  - **Indirect truthmakers in present traces/dispositions** (e.g., memories, causes).  
  - **Branching possibilities** (e.g., future open, past fixed).  
  - **Deny bivalence** (no truth value).  

  ---

  ### Mapping Named Positions to Leaves  
  Leaves are labeled as `[Node1]-[Node2a]-[Node2b]-[Node3]-[Node4]`. Unoccupied combinations are diagnosed.  

  | Leaf Path & Answers                                                                 | Named Position(s)                                                                 | Notes                                                                                            |
  |-------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------|
  | **No** → **Global** → **Yes** → **Yes** → **Indirect**                              | Standard presentism with absolute simultaneity                                    | Requires privileged frame; past truth via traces.                                                |
  | **No** → **Local** → **No** → **Yes** → **Indirect**                                | Relativistic presentism (denies global present)                                   | Local "now" without privileged frame.                                                            |
  | **Yes** → *n/a* → **Reducible** → **Direct**                                        | *Unoccupied*                                                                      | Direct present truthmakers conflict with eternalism’s non-present entities.                      |
  | **Yes** → *n/a* → **Reducible** → **The event itself (non-present)**                | Eternalism with B-theoretic reduction of tense                                    | Truthmakers are past/future events (exist tenselessly). *Node 4 adjusted for theory-neutrality.* |
  | **Derivative** → **Global** → **Yes** → **Yes** → **The event itself (non-present)** | Growing-block view                                                                | Past exists fully; future derivative. Global present requires privileged frame.                  |
  | **Yes** → *n/a* → **Yes** → **Branching**                                           | Moving-spotlight view                                                             | Eternalism + irreducible tense; future "spotlight" changes truth conditions.                     |
  | **No** → **Undefined** → **No** → **Linguistic** → *n/a*                            | Deflationary linguistic view (denies substantive ontology)                        | Tense is language-only; no physical present or truthmakers needed.                               |
  | **Derivative** → **Local** → **No** → **Yes** → **Indirect**                        | *Unoccupied*                                                                      | *Plausible but unexplored* (e.g., local present + derivative existence).                         |
  | **No** → **Global** → **No** → **Yes** → **Indirect**                               | *Physically implausible*                                                          | Global present without privileged frame violates special relativity.                             |

  **Notes on Adjustments**:  
  - Eternalism’s truthmakers (Node 4) are **non-present events/entities**—modified from "presently existing" to reflect theory-neutral commitment to *existing events at their temporal locations*.  
  - "Branching" at Node 4 applies only to future-tensed statements (past is fixed).  

  ---

  ### Diagnostic Cases  
  **Case 1: Relativity of Simultaneity**  
  *Two observers in uniform motion each declare a distant stellar event is "now." Which branch(es) does each response select?*  
  - **Only one is correct** → Requires **Global → Yes** (privileged frame defines true "now").  
  - **Both are correct relative to their frames** → Requires **Local → No** (no global present).  
  - **Neither is objectively correct** → Requires **Yes** (eternalism) + **Reducible** (tenseless relations).  

  **Case 2: Erased Past Event**  
  *A past event leaves no physical traces, but a statement about it is asserted. How is its truth handled?*  
  - **Direct truthmakers in present entities** → *Falsifiable* (no traces imply no truthmaker; may deny bivalence).  
  - **Indirect truthmakers** → *False or indeterminate* (no traces = no indirect grounds).  
  - **The event itself (non-present)** → *True* (event exists independently of traces: eternalism/growing block).  
  - **Deny bivalence** → *No truth value* (e.g., deflationary views).  

