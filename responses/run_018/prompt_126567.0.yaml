prompt: |-
  I'm giving a talk next tuesday in the law-philosophy workshop. I'm defending what I call scaffolded quarantine — I take Caruso's line that retributive desert is dead because free will skepticism undermines basic desert, but I graft onto it Dennett's view that free will is an evolved social technology we shouldn't scrap just because it's metaphysically shallow. The twist is that quarantine should be tierd by how reasons-responsive the offender is, not just by risk. So a repeat fraudster who clearly grasps norms gets longer isolation not because he deserves suffering, but because his high-level responsiveness makes short interventions predicatively useless — it's functional tracking of responsibility without Caruso's flat equality. The audience is mostly analytic philosophers of law who think Caruso is too soft, plus one legal realist who thinks Dennett's evolutionary story is just-so storytelling, and a grad student working on addiction and culpability. Draft my Q&A prep: the objections they'll actually raise, ordered by damage, each phrased the way they'd say it, with a two-minute reply and a note on where I'm soft. What should I concede up front — probably the measurment problem for reasons-responsiveness? — and what's the objection I'm praying they skip, likely that my tiering collapses back into desert? Include that too.
