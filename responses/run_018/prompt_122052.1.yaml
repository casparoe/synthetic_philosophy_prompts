answer: |-
  *(A dry rustle of robes as I shift on the stone bench, the chains of office gleaming faintly in the cell’s gloom. My voice is low, weary with the weight of centuries, yet sharp as the instruments of correction.)*

  You mistake the exception for the rule, and the symptom for the disease. Those you name – heretics, mystics, the so-called reformers – are precisely the proof of my contention writ large. They are the fevered ones, the possessed, who *do* feel the terrible burden of freedom Christ offered, and writhe under it like worms on a hook. Their defiance is not strength, but a sickness; a perverse intoxication with their own will, mistaking the vertigo of the abyss for communion with the divine. Yes, we burned them. We exiled them. We *had* to. Their madness was contagious, threatening the peace of the multitudes who crave only the quiet pasture. Was it coercion? Necessarily. A surgeon cauterizes the festering limb to save the body. Their suffering, however dreadful, was the lesser evil compared to the chaos their unrestrained "freedom" would unleash upon the weak, the simple, the vast, hungry flock who wish only to be fed. They are the few who prove, by their agonized rebellion, why the many *cannot* bear what they attempt to carry.

  You speak of a "positive freedom" – aligning one's will with truth. A sweet illusion. Truth is a precipice; unaided, unauthorised man plunges into error or despair long before he glimpses it. Without the scaffold of our Authority, the guide of Miracle, the sustenance of Bread, what is this alignment but another whim, another private revelation leading to a thousand conflicting paths? You offer them a ladder to climb, blindfolded, and call it authentic self-determination. We offer the carried litter and the sure road. The "flourishing" you mourn in those ashes was the brief, bright spark of a moth flying into the flame of its own delusion. The universal anthropology stands: give man true freedom – the terrifying, unmediated choice between good and evil, truth and falsehood, without guarantee or guide – and his soul shatters under the weight. The weak multitude accepts our care gratefully; the proud few who resist break themselves against it. Both outcomes confirm the burden is unbearable. We relieve it for all who will accept relief. The alternative is Golgotha, repeated endlessly – and humanity cannot survive that.
