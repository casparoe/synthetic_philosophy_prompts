  Hmm, first I need to map their framework: factual fidelity is straightforward (don't invent events), but axiological fidelity is trickier - it's about respecting the subject's values and self-conception. The counterfactual dignity harm idea is particularly potent: the wrong of making someone "unrecognizable to themselves" posthumously. Amadeus is perfect for this because Salieri's portrayal is so inverted from historical records while Mozart's vulgar genius creates tension between authenticity and reduction.

  The user wants specific scene analysis. The confession scene jumps out - historically pious Salieri confessing to murder he didn't commit epitomizes axiological violation. His humiliation scenes invent facts but the deeper wound is depicting him as valuing status over art. And Mozart... ah, that's nuanced. Does his surviving music inoculate him from dignity harm when portrayed as childish? Probably not entirely - the counterfactual self might still reject this vulgar framing.

  What's really at stake philosophically? The user senses Amadeus exposes how debates about "artistic license vs historical accuracy" miss the ethical dimension of identity violation. The film forces us to ask: Do the dead retain rights to their narrative self? Forman's genius makes us complicit - we feel Salieri's anguish precisely because the emotional truth resonates, but that resonance might be the violation itself. 

  The institutionalization scene is key here. By showing Salieri claiming mediocrity's sainthood, the film weaponizes his voice against his actual values - that's the ultimate axiological violence. Yet it's also what makes the artwork profound. This tension is what the user wants to uncover: art's power to harm by reshaping souls versus its right to reimagine. Mozart's music survives as counter-evidence, but Salieri has only historians to defend him - a power asymmetry in posthumous ethics.

  Final thought: The user's "foil" question is brilliant. Does turning Salieri into Mozart's shadow serve art at existential cost? Amadeus adds that sometimes the most compelling art arises from this ethical violation, forcing us to sit with that discomfort rather than resolve it.
answer: |-
  Your framework offers a profound lens for analyzing *Amadeus*, exposing tensions between historical drama, artistic license, and posthumous ethics. Let's dissect Forman's Salieri through factual vs. axiological fidelity and counterfactual dignity harm:

  **1. Factual Failure vs. Axiological Violence:**
  *   **Factual Inaccuracy (Clear Violation):** The poisoning plot, Salieri's direct antagonism/humiliation of Mozart, the "mediocrity" envy framing, and his institutionalization are demonstrable inventions. Salieri was respected, successful, taught Mozart's son, and died peacefully. This breaches factual fidelity.
  *   **Axiological Fidelity & Counterfactual Dignity Harm (Profound Violation):** The deeper wrong lies here. The historical Salieri valued piety, craftsmanship, patronage, and institutional success within the court system. Forman/Shaffer systematically inverts this:
      *   **Values Inverted:** His piety becomes hypocrisy fueling murderous envy. His craftsmanship becomes bitter resentment of "divine" genius. His institutional success becomes hollow, a symbol of mediocrity rewarded. His self-conception shifts from pious servant of God/music to God's mocked adversary and a self-proclaimed "patron saint of mediocrities."
      *   **Counterfactual Dignity Harm:** The real Salieri would experience this portrayal as catastrophic misrecognition. His faith, his lifetime of dedicated work, his pride in his position and students – all are recast as facets of a bitter, vengeful, and ultimately broken soul consumed by inadequacy. This constructs an *essence* alien to his documented life and values.

  **2. Scenes Illustrating the Failures & Artistic Justification:**
  *   **Framing Confession:** This scene epitomizes **axiological violence**. The historical Salieri *did* experience mental decline and made rambling claims late in life (possibly misinterpreted or exaggerated), but he never confessed to murder or renounced God in this theatrical manner. The scene transforms a complex, possibly delusional moment into a grand, self-lacerating declaration of war against divinity and embrace of mediocrity – a complete inversion of his lifelong values and self-understanding as a devout Catholic musician. It's the core of his counterfactual dignity harm.
  *   **Court Humiliations (e.g., Figaro rehearsals, Mozart mocking his march):** These primarily demonstrate **factual failure** (invented antagonism) but *serve* the **axiological inversion**. They visually and narratively construct Salieri's internal state of envy and humiliation, reinforcing the "mediocrity" complex that defines the film's axiological betrayal of the historical figure.
  *   **Final Institutionalization & "Mediocrities" Speech:** A powerful **artistic conclusion** that hinges entirely on the **axiological violation**. Salieri's embrace of mediocrity as his sainthood is the culmination of the inverted value system. It's dramatically brilliant but ethically fraught. It defends the *dramatist's right* to use the dead as a foil: Salieri becomes the universal vessel for human frustration in the face of inexplicable genius and divine indifference. His historical identity is sacrificed for a timeless thematic archetype.

  **3. Mozart's Vulnerability & the "Music Defense":**
  *   **Counterfactual Dignity Harm Risk:** Mozart *is* vulnerable. The portrayal of his genius intertwined with puerile vulgarity (fart jokes, screeching laughter, immature behavior) *could* be seen as a reduction. The historical Mozart, while capable of scatological humor in private letters, was a sophisticated, ambitious, hardworking professional deeply engaged with Freemasonry and Enlightenment thought. The film risks reducing him to a divinely touched man-child.
  *   **The "Music Defense" & Its Limits:** The survival and power of Mozart's music *does* offer some protection. The film constantly validates his genius *through the music itself*. We *hear* the sublime beauty, complexity, and emotional depth, which acts as irrefutable counter-evidence to the childish antics. This creates a tension: the vulgarity makes the divine genius more shocking and "other," serving the film's theme. However, this **doesn't negate the potential dignity harm entirely**. The counterfactual Mozart might still object to being remembered primarily for his infantile behavior alongside his music, feeling that his intellectual depth and professional dedication are erased. The defense is aesthetic (the contrast works) and evidentiary (the music proves the genius), but not a complete ethical absolution.

  **4. What *Amadeus* Adds to the Philosophical Debate:**
  *   **Beyond "License vs. Accuracy":** The standard debate focuses on facts and artistic freedom. *Amadeus* forces us to confront the **ethics of identity construction**.
  *   **The Power of Emotional/Axiological Coherence:** The film demonstrates that a portrayal can be *factually false* yet achieve profound *emotional and thematic truth* by constructing a coherent, albeit invented, axiological framework for its characters. Salieri's internal logic (envy as piety perverted) is compelling *drama*, even as it violates the historical man's self-conception. This raises the question: **Does the creation of a powerful, coherent artistic truth justify the axiological violation of a real person's identity?**
  *   **The Specter of "Living On" Through Representation:** *Amadeus* tragically illustrates how a powerful artistic portrayal can **eclipse the historical reality** for generations. For many, Shaffer/Forman's Salieri *is* Salieri. This highlights the immense power of art to shape posthumous identity and the potential violence of that shaping when it fundamentally misrepresents the person's core values and self-understanding.
  *   **The Question of Consent & Voice:** The dead cannot consent. *Amadeus* underscores the ethical burden on the artist when appropriating a real life. Does Salieri's relative historical obscurity (compared to Mozart) make him more vulnerable to appropriation as a foil? Does the artistic merit of the result mitigate the harm?
  *   **The Irreducible Tension:** Ultimately, *Amadeus* doesn't resolve the tension; it embodies it. It forces us to hold two truths: the film is a masterpiece exploring profound themes of envy, divinity, and mediocrity, *and* it perpetrates a significant axiological violation against Antonio Salieri, inflicting a profound counterfactual dignity harm by making his posthumous identity the antithesis of his lived values. It shows that the deepest ethical questions in biography/drama aren't just about getting the dates right, but about the right to redefine a soul for artistic purposes.

  **Conclusion:**

  While *Amadeus* clearly breaches factual fidelity, its deeper ethical transgression lies in the systematic **axiological inversion** of Salieri and the consequent **counterfactual dignity harm**. Scenes like the confession and the "mediocrities" speech crystallize this violation, constructing a persona whose core values and self-conception are diametrically opposed to the historical record. Mozart's portrayal, while partly shielded by the enduring evidence of his genius, is not immune to reduction and potential dignity harm. The film's enduring contribution to the ethics of representation is its stark demonstration that **artistic power can be built upon the axiological dismantling of a real person's identity**, forcing us to confront whether the creation of universal archetypes justifies the posthumous misrecognition of the individual who inspired them. It moves the debate beyond facts versus freedom into the fraught territory of the soul's posthumous rights.
