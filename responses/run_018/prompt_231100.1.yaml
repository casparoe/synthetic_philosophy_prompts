  Okay, the user wants me to draft a joint statement between a provenance theorist and a perceptualist regarding art value. Let me understand the key positions first. The provenance theorist believes that how and by whom an artwork was made contributes to its value, independent of its physical appearance. The perceptualist thinks that only perceptible properties matter, so a perfect duplicate would hold the same value as the original.

  The user specified a structured document with four sections: agreed claims, a disagreements table, cruxes, and test cases. I need to ensure each section is thorough and non-vacuous. For the agreed claims, both sides would acknowledge that market value changes with provenance revelations and that some valuations are instrumental, like historical evidence. They'd also reject certain arguments, like the perceptualist denying that uniqueness alone confers value without perception.

  Moving to the disagreements table, I need columns for sub-questions and each side's phrasing. Examples include the definition of "the work itself" and what constitutes non-perceptible properties affecting value. I should categorize whether disagreements are substantive or verbal. For instance, the term "value" might be used differently, leading to partly verbal disputes.

  Identifying cruxes is crucial. The key ones are the necessity of original causal history and whether non-perceptible properties are aesthetic. Each crux needs a test case. The chance duplicate scenario tests if identical appearance suffices for equal value. The attribution shift case examines if value changes without physical alteration. The fire scenario addresses which artwork to save, revealing prioritization of history versus perceptible qualities.

  The user mentioned specific scenarios: accidental duplicate, attribution debunked, and fire rescue. Including these will make the document concrete. For the accidental duplicate, the perceptualist predicts equal value, while the provenance theorist sees diminished value due to lack of history. The fire case will show if saving the original is based on intrinsic or instrumental reasons.

  I should flag terminological issues, especially around "value." The perceptualist focuses on aesthetic value, while the provenance theorist includes historical significance. Clarifying this could resolve some apparent disagreements. Also, the distinction between intrinsic and instrumental value matters in the fire scenario.

  Ensuring that each side's phrasing isn't a strawman is vital. For the provenance theorist, emphasizing the work's identity through its creation process. For the perceptualist, stressing that perceptible properties are the sole source of aesthetic value. Predicting outcomes of test cases upfront will highlight where disagreements persist and why.

  Finally, the cruxes must be pivotal. If original causal history is necessary for value, that supports provenance theory. If aesthetic value excludes historical context, perceptualism holds. Test cases like the accidental duplicate directly challenge both positions, making them effective for ongoing research.
answer: |-
  ## Joint Statement: Provenance Theory & Perceptualism After Adversarial Collaboration

  **Preamble:** We, a committed provenance theorist (PT) and a committed perceptualist (P), engaged in sustained, good-faith dialogue over several months. Our goal was to clarify points of agreement, isolate genuine disagreements, identify their nature (substantive vs. verbal), and pinpoint testable cruxes regarding the value of artworks, particularly concerning originals, duplicates, and forgeries. This document reflects our shared understanding and unresolved differences.

  ### 1. Agreed Claims (Signed by Both Parties)

  1.  **Market Value & Treatment Shift:** The revelation that a work is a forgery, or not by the attributed artist, *drastically alters its market value and typical treatment* (e.g., museum display status, conservation priority, scholarly interest). This shift is real, significant, and predictable based on provenance information, regardless of its perceptible impact.
  2.  **Instrumental Value of Originals:** The original artwork possesses *instrumental value* distinct from a perfect duplicate in specific, non-fetishistic ways:
      *   **Historical Evidence:** As primary evidence in art history (e.g., brushwork analysis revealing technique, material composition indicating period/region).
      *   **Causal Nexus:** As the unique physical object causally linked to significant historical events, figures, or artistic movements (e.g., the *Mona Lisa* as the object da Vinci touched, Napoleon hung, was stolen, etc.).
      *   **Social Coordination Focal Point:** As the unique object serving as the agreed-upon reference point for scholarship, reproduction, and cultural discourse.
  3.  **Non-Instrumental Value Claims:** Neither party endorses the claim that the original possesses greater value *solely* because it is "unique" in a bare metaphysical sense, divorced from its history or perceptible qualities. The PT grounds extra value in the *specific history of creation*, the P denies extra *aesthetic* value exists.
  4.  **Rejected Arguments:**
      *   *PT rejects:* "Perceptualists cannot explain why we *care* about originals." (P agrees we care, but attributes it to non-aesthetic instrumental/sentimental factors).
      *   *P rejects:* "A perfect duplicate *is* aesthetically identical, therefore it *must* have the same aesthetic value." (PT argues the work's identity, hence its value-grounding properties, depend on origin).
  5.  **Scope of "Value":** We agree "value" encompasses multiple types (aesthetic, historical, financial, sentimental, cultural). Our core disagreement centers on the nature and grounding of *aesthetic value specifically* and whether provenance facts can be *constitutive* of an artwork's identity and thus its aesthetic value.

  ### 2. Disagreements Table

  | Sub-Question                                                                 | Provenance Theorist (PT) Phrasing                                                                                                 | Perceptualist (P) Phrasing                                                                                                                                 | Nature of Disagreement                                                                 |
  | :--------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------- |
  | **What constitutes "the work itself" that grounds its aesthetic value?**     | The artwork is an *abstract object* (or historical individual) whose identity is fixed by its specific causal history of creation. Only the original instantiates this object. | The artwork is a *perceptible structure*. Any physical object instantiating that identical structure *is* the same artwork (or an instance of it) for the purposes of aesthetic valuation. | **Substantive:** Fundamental metaphysical disagreement about artwork ontology/identity. |
  | **Can non-perceptible properties (like being made by Rembrandt) be *aesthetic* properties contributing to aesthetic value?** | Yes. Properties like "being painted by Rembrandt’s hand" or "being the product of the creative struggle of a specific genius" are aesthetic properties accessible *through knowledge* of the provenance and integral to the work's identity and value. | No. Aesthetic properties are strictly properties available to perception (or sensory imagination) of the object's form, color, composition, etc. Properties like authorship are *art-historical facts about the object*, not aesthetic properties *of* the object perceivable within it. | **Substantive (partly verbal):** Deep disagreement about the definition/constitution of the aesthetic. PT broadens "aesthetic" to include historically informed cognitive engagement; P restricts it to sensory perception. "Aesthetic" is contested territory. |
  | **Does a molecule-for-molecule duplicate of the *Mona Lisa* possess the *same aesthetic value* as the original?** | No. The duplicate lacks the essential property of *being created by Leonardo da Vinci*, which is a constitutive property of *Mona Lisa* the artwork and a primary source of its aesthetic value. The duplicate is a distinct artwork (a forgery or replica) with its own, lesser aesthetic value. | Yes. The duplicate possesses *all* perceptible properties constitutive of the artwork *Mona Lisa*. Therefore, it possesses the *identical aesthetic value*. Any preference for the original stems from non-aesthetic values (historical, sentimental, financial). | **Substantive:** Directly follows from the above disagreements on identity and aesthetic properties. |
  | **When an attribution shifts (e.g., Rembrandt to Student), does the aesthetic value of *the physical object* change, absent any physical change?** | Yes. The artwork instantiated by the canvas has changed. It is now a different artwork (e.g., "Student Work X") with different, typically lower, aesthetic value due to the loss of the constitutive property "being by Rembrandt". | No. The perceptible properties of the canvas remain identical. Therefore, its aesthetic value remains constant. Its *art-historical significance* and *market value* change, but not the aesthetic value grounded in what can be seen. | **Substantive:** Directly tests whether authorship is a value-conferring aesthetic property (PT) or a non-aesthetic contextual fact (P). |
  | **Is the extra value attributed to originals *merely* sentimental/status-based?** | No. While sentiment/status exist, the primary extra value attributed to the original is *genuine aesthetic value* grounded in its unique, constitutive causal history. | Yes, *in terms of specifically aesthetic value*. The sentiment/status/focus *explains* the extra value placed on the original, but this extra value is not grounded in *aesthetic properties* beyond what the duplicate possesses. | **Partly Verbal/Substantive:** Depends heavily on the scope of "aesthetic value." PT includes historically informed appreciation within the aesthetic; P excludes it. |

  ### 3. The Cruxes

  1.  **The Necessity of Original Causal History for Artwork Identity & Aesthetic Value:**
      *   **Why Load-Bearing?** If settled in favor of PT, it establishes provenance facts as *constitutive* of the artwork itself, directly grounding its aesthetic value. If settled for P, it severs the *essential* link between origin and the aesthetic artwork identity/value, reducing origin to context.
  2.  **The Aesthetic Status of Provenance-Dependent Properties:**
      *   **Why Load-Bearing?** If properties like "being painted by Rembrandt" can be legitimately considered *aesthetic* properties (PT), then they directly contribute to aesthetic value. If they are fundamentally *non-aesthetic* (P), then any value they confer is distinct from aesthetic value. This defines the very subject of the debate.
  3.  **The Scope of the Aesthetic:**
      *   **Why Load-Bearing?** Is aesthetic appreciation fundamentally a *perceptual* engagement with form, or does it inherently involve *cognitive* engagement with the object's history and context? Resolving this determines whether the P's core principle (supervenience on perceptibles) is valid or whether the PT's broader view of the aesthetic domain is correct.

  ### 4. Test Cases & Predictions

  1.  **The Accidental Duplicate (Chance Scenario):**
      *   **Scenario:** Through an astronomical fluke, a random quantum event in a paint factory causes spilled paint to spontaneously form a molecule-for-molecule duplicate of the *Mona Lisa* on a blank canvas in 2024, with no human or intentional intervention.
      *   **PT Prediction:** This object has *zero* aesthetic value *as the Mona Lisa*. It is not an artwork by Leonardo, nor is it a forgery (lacking intent). It might have aesthetic value *as a unique natural phenomenon* or visual pattern, but this is categorically different and likely lesser than the original *Mona Lisa*'s value.
      *   **P Prediction:** This object possesses *identical aesthetic value* to the original *Mona Lisa* because it instantiates the identical perceptible structure. Its lack of history affects its historical/scientific/cultural value, but not its aesthetic value.
      *   **Bears on Crux:** 1 & 2 (Necessity of History, Aesthetic Status of Properties). Removes intent/making, isolating the role of causal origin.

  2.  **The Attribution Shift (Unchanged Canvas):**
      *   **Scenario:** A painting universally attributed to Master Artist M for centuries, hanging in a major museum, is conclusively proven via newly discovered documents (no new physical analysis) to have been executed entirely by M's advanced Student S, working under instruction. The canvas itself is unchanged.
      *   **PT Prediction:** The *artwork* has changed. It is now "Student S's Painting P" (or similar). Its aesthetic value decreases because it lacks the constitutive property "being by M". Its historical/evidentiary value might change contextually.
      *   **P Prediction:** The aesthetic value of the physical object remains *unchanged*. What has changed is our *knowledge* about its origin, affecting its historical significance, market value, and perhaps the *narrative* we attach to it, but not the aesthetic value grounded in its perceptible properties.
      *   **Bears on Crux:** 2 & 3 (Aesthetic Status of Properties, Scope of the Aesthetic). Tests if value change occurs purely cognitively, without perceptual change.

  3.  **The Fire: Save One (Visually Identical Original & Perfect Forgery):**
      *   **Scenario:** A fire breaks out in a vault containing two visually indistinguishable canvases. One is the original *Starry Night* by van Gogh. The other is a recently discovered, perfect, contemporary molecular duplicate, created by a master forger (F) using period materials and techniques, previously unknown and undetectable by any current means. The rescuer *knows* definitively which is which but can only save one.
      *   **PT Prediction:** The rescuer *should* save the original. Saving the forgery would mean preserving only an object with the perceptible structure, not the actual artwork *Starry Night* created by van Gogh, which possesses the unique aesthetic value derived from its origin. Saving the original preserves the irreplaceable artwork.
      *   **P Prediction:** The rescuer has *no aesthetic reason* to prefer the original. Both objects possess identical aesthetic value. Any choice must be based on non-aesthetic grounds: historical evidence (original is better evidence of van Gogh), market value (original is worth more), sentiment, or symbolic importance. *Aesthetically*, saving either is equivalent.
      *   **Bears on Crux:** All three. Forces a practical choice revealing what value is considered fundamental and irreplaceable. Highlights potential divergence between aesthetic value (P) and other values (PT sees origin's value as aesthetic).

  **Residual Disagreement on "Value":** We explicitly flag that a significant portion of our residual disagreement hinges on the contested scope of the term **"aesthetic value"** (Crux 3). The PT argues that cognition of provenance facts is integral to the *full aesthetic appreciation* of an artwork, thus grounding part of its aesthetic value. The P argues that aesthetic value is strictly generated by the sensory encounter and that the profound cognitive/emotional responses triggered by provenance facts belong to distinct categories of value (historical, cultural, associative). This is not merely verbal (it reflects deep differences in aesthetic theory), but it means we are sometimes talking about different *kinds* of value when using the same word. Further progress may require jointly defining "aesthetic value" more precisely or accepting a pluralistic framework where "art value" is multifaceted, though we would still disagree on the relative weight and grounding of those facets.

  **Signed:**
