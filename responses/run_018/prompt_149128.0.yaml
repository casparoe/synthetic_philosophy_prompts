prompt: |-
  hey, im taking phil of mind and we got onto dennetts thing about the self being a center of narrative gravity. my roommate tried to explain it to me and said basically: "your self is like the center of gravity for a chair—useful for prediction, but not an actual part. your brain builds this protagonist-story to organize behavior, but theres literally no one inside experiencing it. its all just a fiction with causal powers, like a corporation. dennett thinks personal identity is purely narrative continuity, so if your story gets interrupted, you literally dont exist anymore, even if your body and memories stay intact. he also thinks this means consciousness is just another chapter in the story, not something that needs explaining on its own."

  this feels mostly correct but also kinda extreme? im inclined to think the center-of-gravity analogy just means the self is an abstraction, not that its a fiction with no reality at all. and im pretty sure dennett doesnt say consciousness is just part of the story—he still tries to explain consciousness, right? but my roommate said im being too generous and that dennett really does deny any inner experiencer. can you go through this summary and tell me whats fair, whats overstated, and whats just wrong? especially about whether the self being "nowhere in the brain" means it doesnt exist, and whether narrative continuity is the only thing that matters for identity in this view. also is the claim about consciousness being "just another chapter" a misreading?
