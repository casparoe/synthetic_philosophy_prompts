  **OFFICE OF DUAL-FRAMEWORK INTERSPECIES GOVERNANCE (ODFIG)**  
  **FREQUENTLY ASKED QUESTIONS (PUBLIC INQUIRY REFERENCE DOCUMENT 7.3.1-REV)**

  **1. What is the statutory mandate of ODFIG?**  
  ODFIG is tasked with the uniform implementation of Federal Interspecies Harmony Doctrine (FIHD) across all executive agencies. FIHD requires simultaneous adherence to two operational principles: (a) Maximization of Net Aggregate Welfare for non-human biological entities, and (b) Enforcement of Inviolable Protective Boundaries for human persons. These principles operate concurrently without hierarchical precedence. ODFIG ensures all federal actions affecting biological entities apply the correct framework based on entity classification per Section 12(d) of the FIHD Implementation Act.

  **2. How does ODFIG define "Human Person" for regulatory purposes?**  
  A "Human Person" denotes any entity biologically classified as *Homo sapiens* at any developmental stage post-conception. Human Persons possess intrinsic Protective Boundaries. These Boundaries establish absolute prohibitions against intentional instrumentalization, physical violation, or sacrifice for aggregate welfare objectives, irrespective of projected benefit magnitude or recipient entities. Example: Demolishing one Human Person’s residence to construct housing for 10,000 non-persons violates Principle (b) and is categorically impermissible.

  **3. How are decisions made regarding non-human animals?**  
  Non-human entities fall under Principle (a): Net Aggregate Welfare Maximization. ODFIG utilizes validated Cost-Benefit Analysis Form OD-114 (Rev.9) to quantify welfare impacts across affected populations. Actions generating positive net aggregate welfare scores are permissible, even if causing significant localized suffering, provided no Human Person Protective Boundary is breached. Example: Relocating 15,000 migratory terns during nesting season for port expansion is permissible if Form OD-114 calculates net welfare gain (e.g., enhanced trade benefiting multiple species long-term) outweighs distress/death metrics.

  **4. What if an entity’s classification is ambiguous?**  
  Entities exhibiting indeterminate status (e.g., exhibiting potential proto-personal markers but lacking definitive *Homo sapiens* biology) undergo Tier-3 Marginal Agency Assessment Protocol (T3MAAP). T3MAAP employs standardized neuro-behavioral diagnostics to assess threshold proximity. Only entities exceeding the T3MAAP Threshold activate Principle (b) Protective Boundaries. Entities below threshold remain under Principle (a) management. Classification appeals require submission of Form OD-451 within 30 days of initial determination.

  **5. Can you describe a T3MAAP assessment scenario?**  
  Scenario: Municipal Pest Management requests authorization for ultrasonic dispersal of corvid populations interfering with hospital helicopter operations. Initial classification: Non-human (Principle (a)). However, 12 corvids possess experimentally enhanced working-memory implants. T3MAAP Protocol 4-C is triggered:  
  - Step 1: Implanted corvids undergo delayed gratification testing (Standard Maze Series G7).  
  - Step 2: Neural activity is monitored for cross-modality associative coherence during distress-cue exposure.  
  - Step 3: If ≥ 65% of subjects exhibit sustained, context-flexible aversion-avoidance beyond base instinct, the cohort may exceed the Threshold, requiring individualized relocation (Principle (b)) while non-implanted corvids remain subject to dispersal under welfare calculus (Principle (a)). Processing time: 45-90 business days.

  **6. How are chimeric organisms containing human-derived neural components handled?**  
  Chimeras (≥0.1% human-origin neural tissue by mass) automatically trigger T3MAAP Protocol 6-H. Protocol 6-H assesses:  
  - Degree of functional integration of human-derived tissue (fMRI Connectivity Index).  
  - Behavioral manifestation of non-species-typical autonomy markers (e.g., ritualized object permanence beyond food caching).  
  - Response consistency to Kantian-Resonance Stimuli (KRS) audio sequences.  
  A sub-threshold determination permits management under Principle (a), including terminal procedures if welfare calculus supports it. Example: A research chimera (human neuronal clusters in porcine host) demonstrating only reflexive KRS response may be euthanized if aggregate welfare analysis (e.g., disease research benefits outweighing individual distress) on Form OD-114b justifies termination.

  **7. What happens during a T3MAAP review if urgent action is required?**  
  T3MAAP determinations suspend all agency actions affecting the subject entities. Urgency waivers (Form OD-667) are rarely granted and require Deputy Director approval. Example: If unclassified rats infiltrate a hospital pharmacy, standard extermination (Principle (a)) is permissible. If one rat exhibits suspected chimeric properties, triggering T3MAAP, all extermination halts pending assessment. Mitigation (e.g., temporary containment) is allowed, but lethal measures are prohibited until classification resolves. Contingency plans for public health emergencies must pre-identify alternative welfare-maximizing strategies not impacting the indeterminate entity.

  **8. Can Human Persons ever be subject to Principle (a) considerations?**  
  No. Principle (b) establishes absolute constraints. Human Persons cannot be traded against aggregate welfare, even their own. Example: Diverting a flood control channel to save a town of 10,000 Human Persons cannot lawfully involve the calculated sacrifice of one Human Person residing in the alternative flood path, regardless of consent or aggregate benefit. Such proposals are rejected at Pre-Action Review (Form OD-002).

  **9. How does ODFIG reconcile conflicts between Principles (a) and (b) in shared environments?**  
  Conflicts are resolved through spatial and temporal framework separation. Principle (b) possesses territorial primacy: Any space occupied by a Human Person invokes Protective Boundaries for that person. Actions governed by Principle (a) affecting non-humans must not materially infringe upon this space. Example: Culling deer populations to reduce vehicle collisions (Principle (a) welfare gain) is permissible in wilderness areas. Within 500 meters of a Human Person dwelling, only non-lethal welfare-maximizing methods (e.g., fertility control) are allowed to prevent potential boundary violation via projectile misfire.

  **10. Where can I report suspected misapplication of FIHD frameworks?**  
  Submit a completed Citizen Oversight Notification (Form OD-800) detailing the location, entities involved, observed action, and suspected framework error (e.g., "Principle (a) applied to probable Human Person" or "Principle (b) incorrectly withheld from T3MAAP-threshold entity"). Anonymous tips require supplemental Corroborating Evidence Docket (Form OD-800A). Allow 120 days for investigation. ODFIG Compliance Division reviews all submissions in accordance with procedural fairness guidelines.
