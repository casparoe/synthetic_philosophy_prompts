prompt: |-
  I'm on the ethics review board for our university's AI and robotics lab, and we have a weird case for Thursday's meeting. A grad student on a tutoring-agent project filed an adendum arguing that the RL agents suffer functional harm: every wrong student answer triggers a large negative reward-prediction error that updates the value function downward, and sustained negative RPEs, in thier view, are structurally analogous to aversive valence in biological agents. They want the board to impose a "valence cap"—negative rewards can't exceed -0.4 per step—and mandatory "cool-down" epochs where the policy freezes if cumulative negative error crosses a threshold. The PI says this is category confusion: it's just backprop through a loss landscape, there's no phenomenal state, and capping rewards will break convergence. Our board has to recomend a concrete course—approve the welfare conditions, reject them, or approve with modifications—and I need a memo I can circulate that has a clear bottom line plus a timeline (e.g., pilot for one semester or deny outright).

  Please draft the board's written opinion in American English, max 350 words. It should take the functional-valence argument seriously, not dismiss it out of hand, but also deal honestly with the strongest objection that reward signals are purely mathematical and attributing suffering to them mistakes representation for experience. Give me an actionable recommendation with reasoning both sides could respond to, and don't include any bibliography or citations—just work with the concepts as they stand.
