answer: |-
  Here are the desiderata for an adequate theory of valid consent, focusing on marginal interactions and tensions, with motivating cases, non-negotiables, camp-dependent preferences, and unresolved tensions:

  ### **Core Desiderata (Non-Negotiable)**
  1.  **Competence-Context Relativity**  
      *Requirement:* Competence must be assessed relative to the specific decision's complexity and stakes, not global cognitive ability. A person may be competent to consent to a blood draw but not to a high-risk experimental surgery.  
      *Motivating Case:* An individual with mild intellectual disability understands the immediate procedure of a routine dental filling but cannot grasp the long-term financial implications of an insurance waiver presented simultaneously.  
      *Why Non-Negotiable:* Global competence thresholds risk unjust paternalism or dangerous under-protection.

  2.  **Epistemic Validity (Beyond Literal Truth)**  
      *Requirement:* Consent requires understanding material facts *as the consenter would reasonably interpret them*, not just literal truthfulness. Deliberate exploitation of reasonable inferences invalidates consent.  
      *Motivating Case:* A surgeon says, "This procedure has a 5% complication rate," omitting that *for this patient's specific condition*, the rate is 40%. The patient reasonably infers the general statistic applies to them.  
      *Why Non-Negotiable:* Preserves the spirit of informed consent against deceptive loopholes; distinguishes invalidity from regret.

  3.  **Voluntariness Sans Explicit Threats**  
      *Requirement:* Voluntariness is negated by coercive *structures* or *contexts*, even absent explicit threats. The baseline of acceptable alternatives matters.  
      *Motivating Case:* A worker "consents" to hazardous overtime because refusal means losing healthcare vital for their child's chronic illness, within a company policy systematically denying all schedule flexibility requests.  
      *Why Non-Negotiable:* Recognizes power asymmetries and systemic constraints beyond interpersonal duress.

  4.  **Temporal Bindingness & Decay**  
      *Requirement:* Consent can lose normative force ("decay") due to fundamental, unforeseen changes in the consenter’s epistemic/volitional state *without* formal revocation, distinguishing this from initial invalidity.  
      *Motivating Case:* A patient consents to data sharing for "cancer research." Years later, the data is used to train AI for military targeting – an application unforeseeable and antithetical to the original purpose. The consent is decayed, not initially invalid.  
      *Why Non-Negotiable:* Addresses dynamic realities while respecting original autonomy; avoids infinite bindingness.

  5.  **Distinction: Invalidity vs. Regret**  
      *Requirement:* The theory must rigorously distinguish procedurally defective consent (invalid *ab initio*) from procedurally valid consent followed by regret due to outcomes or changed preferences.  
      *Motivating Case:* Two patients suffer identical surgical complications. Patient A was misled about risks (invalid consent). Patient B understood fully but regrets the outcome (valid consent, mere regret).  
      *Why Non-Negotiable:* Prevents conflating autonomy violations with bad luck/unhappiness; protects against frivolous invalidation.

  ### **Camp-Dependent Preferences**
  6.  **Specificity of Scope:**  
      *Requirement:* Must define whether valid consent requires granular detail for every foreseeable sub-step/outcome, or permits broad anticipatory authorization.  
      *Preference Split:*  
      - *Maximal Specificity Camp:* Requires explicit consent for major foreseeable deviations (e.g., consent to "surgery" isn't consent to unforeseen organ removal).  
      - *Broad Authorization Camp:* Valid if scope & core risks are understood, trusting agents to handle unforeseen pervasions reasonably (e.g., consent to "exploratory surgery" implies consent to necessary removals).  
      *Motivating Case:* During consent-approved brain surgery, the surgeon discovers an unrelated, treatable aneurysm. Does original consent cover clipping it?

  7.  **Ground of Invalidity:**  
      *Requirement:* What primarily grounds invalidity – informational defect, impaired voluntariness, or relational breakdown?  
      *Preference Split:*  
      - *Information-Centered:* Core defect is lack of understanding (even if voluntary).  
      - *Voluntariness-Centered:* Core defect is compromised agency (even if informed).  
      - *Relational-Autonomy:* Core defect is betrayal of the fiduciary relationship/communicative norms.

  8.  **"Reasonableness" Standard:**  
      *Requirement:* Whether thresholds (e.g., "material" risk, "reasonable" inference, "undue" influence) are objective (reasonable person) or subjective (this particular consenter).  
      *Preference Split:*  
      - *Objective Standard:* Promotes predictability, avoids idiosyncratic invalidation.  
      - *Subjective Standard:* Respects individual vulnerabilities/circumstances more deeply.

  ### **Key Tensions & Potential Resolutions**
  9.  **Tension: Maximal Disclosure vs. Feasibility**  
      *Conflict:* Requiring disclosure of *all* potentially material information vs. time/pressure constraints (e.g., emergency medicine, fast-paced transactions).  
      *Nature:* Partially resolvable by contextual indexing.  
      *Resolution:* Tiered disclosure – "Core" material risks *always* required; "contextual" depth adjusts (e.g., ER vs. elective surgery). *Principled tension remains* on defining "core" under pressure.

  10. **Tension: Subjective vs. Objective Coercion**  
      *Conflict:* Requiring coercion be defined by the consenter's *felt* pressure (subjective) vs. requiring an *objectively credible* threat or illegitimate constraint.  
      *Nature:* Principled tension; indexing difficult.  
      *Motivating Case:* A religious refugee feels intense pressure to consent to a medical exam from an authority figure resembling their persecutors, despite no explicit threat. Subjective view: coerced. Objective view: no illegitimate threat, valid?  
      *Potential Resolution:* Hybrid standard: Objective baseline (illegitimate threat/constraint) PLUS subjective vulnerability assessment, but weights are contested.

  11. **Tension: Foreseeability & Scope in Dynamic Contexts**  
      *Conflict:* Requiring consent to cover only foreseeable consequences at time T0 vs. allowing broad authorization for evolving actions (e.g., ongoing research, iterative AI training).  
      *Nature:* Principled tension between autonomy and practicality.  
      *Resolution Attempts:* "Re-consent triggers" for major unforeseen developments; "dynamic consent" models requiring ongoing engagement. Feasibility limits remain.

  ### **How Theories Fare (Briefly)**
  *   **Information-Centered:** Excels at desiderata 2 (Epistemic Validity), struggles with 3 (Structural Voluntariness) and relational aspects of decay (4). Prioritizes 6 (Specificity).
  *   **Voluntariness-Centered:** Strong on 3 (Structural Coercion), weak on marginal deception cases (2) where information is literally true but agency manipulated. Downplays decay (4) if initial voluntariness was high.
  *   **Relational-Autonomy:** Best handles 4 (Decay via relational betrayal), 7 (Ground of Invalidity), and structural context (3). May struggle with clear bright-line rules for 1 (Competence relativity) and 5 (Invalidity vs. Regret) due to emphasis on process.

  This framework ensures a theory addresses the vulnerabilities at consent's margins—where deception exploits inference, coercion wears systemic disguises, competence flickers, and consent's meaning shifts with time and unforeseen consequences—without collapsing into impracticality or conflating invalidity with regret. The tensions highlight where contextual judgment or prioritization is unavoidable.
