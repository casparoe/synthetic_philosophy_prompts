prompt: |-
  You are a philosopher of logic with expertise in conditionals and probabilistic coherence, advising a novelist who runs a speculative-fiction workshop. Before constructing the deliverable, please take a moment to brainstorm: clarify exactly what Lewis's triviality results forbid for indicative conditionals, distinguish that constraint from counterfactual reasoning, and identify where a writer's intuitive use of "if...then" in dialogue will mislead them. Then think step by step.

  I am that novelist. Every quarter I receive manuscripts in which characters reason about open future or present possibilities using indicative conditionals—"If the engine fails, we'll crash," "If she takes the offer, she'll regret it." I need a reusable editorial procedure I can run on any such passage in about fifteen minutes, without computing formal probabilities from scratch. The procedure must be grounded in Lewis's well-known triviality result for indicative conditionals: treating the probability of "If A then C" as equal to the conditional probability P(C|A) collapses, for intermediate probabilities, into probabilistic independence or determinism.

  Please write the procedure as an ordered checklist with the following features: the sequence of questions to ask; what counts as a sufficient answer at each stage; where the procedure stops with a "revise for coherence" verdict; where it explicitly hands the decision to human judgment because the issue is interpretation, values, or narrative license rather than logic; and what the procedure definitively cannot do. Then apply it to three manuscript passages:

  1. An engineer checks a gauge and thinks, "If the pressure exceeds the red line, the valve will blow. In this design, the pressure is either well below or well above the line—there's no middle range." (The procedure should pass this cleanly.)

  2. A detective reasons, "There's a fifty-fifty chance the suspect lied about his alibi. If he lied, I'm about eighty percent sure he was at the scene. So the conditional—if he lied, then he was there—carries about eighty percent weight in my belief." (The procedure should flag a coherence failure here, even though I, as the novelist, will not like that answer because I want the ambiguity preserved for dramatic tension. The procedure should still deliver the flag and specify the required revision or documented exception.)

  3. A narrator writes, "If only love were enough, I might still be happy," in a reflective, metaphorical mode with no assigned probabilities. (The procedure should halt and mark this as out of scope, requiring editorial judgment.)

  Keep the language formal and polished, write in American English, and do not include bibliographies, citation requests, or references to specific editions or page numbers.
reasoning: |-
  Okay, let me approach this systematically. The user is a novelist running a speculative-fiction workshop who needs a practical editorial tool based on Lewis's triviality results. They've clearly articulated their pain point: characters' indicative conditionals in manuscripts often violate probabilistic coherence in ways that undermine logical credibility. 

  First, I need to mentally unpack Lewis's core insight: treating P(If A then C) as identical to P(C|A) leads to absurdities unless A and C are already independent or deterministically linked. This is crucial because writers intuitively treat "if...then" as conditional probability statements without realizing the mathematical trap. Counterfactuals ("if A had happened, C would...") are different - they're about alternative possibilities, not probabilistic updates.

  For the editorial procedure, I'll design a flowchart-like checklist that:
  1) Filters out non-probabilistic/metaphorical uses immediately
  2) Checks if the conditional implies probability quantification
  3) Tests for Lewis-violating scenarios where P(C|A) is treated as P(condition)
  4) Flags when probabilities create incoherence
  5) Provides revision paths while preserving narrative intent

  The three test cases are perfect for validation:
  - Case 1 (engineer) passes because deterministic design avoids the independence problem
  - Case 2 (detective) fails by directly equating P(was there | lied) with P(if lied then was there)
  - Case 3 (narrator) gets filtered out as metaphorical

  I'll make sure the procedure distinguishes between absolute logical violations (which require revision) and areas where narrative license overrides coherence. The key is giving the novelist concrete diagnostic steps without demanding probability calculations. For flagged passages, I'll suggest alternatives like rephrasing as counterfactuals or making implicit assumptions explicit.

  The tone should remain formal yet accessible - this bridges philosophical logic and creative writing. No citations needed, but the underlying framework must be mathematically sound. When applying to the detective example, I'll show exactly why "80% weight" creates incoherence while offering dramatic workarounds.
answer: |-
  ### Editorial Procedure for Indicative Conditionals (Based on Lewisian Constraints)

  **Philosophical Grounding:**  
  Lewis's triviality results demonstrate that *systematically* equating the probability of an indicative conditional "If A, then C" with the conditional probability P(C|A) is impossible without collapsing probabilities into two extremes: either A and C are probabilistically independent (P(C|A) = P(C)), or the system is deterministic (all probabilities are 0 or 1). Writers using intermediate probabilities for both the antecedent (A) and the conditional itself risk logical incoherence.

  **Procedure Checklist**  
  *Apply sequentially to any passage containing an indicative conditional ("If A, then C").*

  1.  **Is the conditional probabilistic?**  
      *   **Check:** Does the context assign explicit or strongly implied numerical probabilities, degrees of belief, or quantifiable likelihoods (e.g., "50% chance", "likely", "almost certainly", "I'm X% sure") to A, C, or the conditional itself?  
      *   **Sufficient Answer:**  
          *   **NO (e.g., metaphorical, hypothetical, non-quantified):** → **HALT.** Mark as **"Out of Scope: Requires Editorial Judgment"**. Proceed no further.  
          *   **YES:** Proceed to Step 2.

  2.  **Is the probability of the conditional *explicitly equated* to P(C|A)?**  
      *   **Check:** Does the text directly state or strongly imply that the *credence/belief strength* in "If A, then C" *is* P(C|A)? (e.g., "The probability of 'if A then C' is P(C|A)", "My belief in 'if A then C' matches how likely C is given A", "The weight of 'if A then C' is P(C|A)").  
      *   **Sufficient Answer:**  
          *   **NO:** → Proceed to Step 3.  
          *   **YES:** → **FLAG "Probabilistic Coherence Failure (Lewis Collapse)"**. Proceed to Step 4.

  3.  **Does the context *treat* the probability of the conditional as P(C|A), even if not stated?**  
      *   **Check:** Is the character's reasoning or the narrative's presentation *reliant* on the assumption that the probability/plausibility of "If A, then C" *functions mathematically* as P(C|A) within their belief system? (e.g., Updating beliefs based on "If A then C" as if it were P(C|A), combining its probability with other probabilities using standard rules as if it were P(C|A)).  
      *   **Sufficient Answer:**  
          *   **NO (Plausible alternative interpretation exists):** → **HALT.** Mark as **"Coherence Ambiguous: Requires Editorial Judgment"**.  
          *   **YES (Interpretation strongly suggests functional equivalence):** → **FLAG "Probabilistic Coherence Failure (Lewis Collapse)"**. Proceed to Step 4.

  4.  **Diagnosis & Revision Path (For Flagged Cases):**  
      *   **The Problem:** The passage implies a coherent belief system where P(If A, then C) = P(C|A) holds for an A that has an *intermediate* probability (0 < P(A) < 1). Lewis proves this forces P(C|A) = P(C) (independence) or P(A)=0 or P(A)=1 (determinism/certainty) globally, contradicting the intermediate probabilities given.  
      *   **Required Revision (Choose One):**  
          *   **Option A (Determinism/Certainty):** Revise the context so that either P(A) = 0, P(A) = 1, or A deterministically implies C (P(C|A)=1) or ¬C (P(C|A)=0). *This avoids the collapse.*  
          *   **Option B (Abandon Equivalence):** Rephrase the conditional or the reasoning. Remove the explicit equation (Step 2) or the functional reliance (Step 3) of P(If A, then C) on P(C|A). Express the *conditional belief* in C *given* A *without* assigning a probability *to the conditional statement itself*. (e.g., "Given he lied, I'm 80% sure he was there" instead of quantifying belief *in the conditional*).  
          *   **Option C (Documented Exception):** If preserving the flagged text is crucial for narrative effect (e.g., to show flawed reasoning, preserve ambiguity, or for stylistic effect), add an editorial note: **"Lewis Violation: Narratively Justified"**. Acknowledge the logical incoherence but assert its deliberate use.

  **Procedure Limits:**  
  *   Cannot validate counterfactual conditionals ("If A *had* happened, C *would have*...").
  *   Cannot validate conditionals lacking probabilistic context (handled in Step 1).
  *   Cannot prove a passage *is* coherent; only flags *incoherence* based on Lewis's specific collapse.
  *   Cannot resolve ambiguities in interpretation (Steps 1 & 3 hand off to judgment).
  *   Does not address other logical fallacies (e.g., affirming the consequent).

  ---

  ### Application to Manuscript Passages

  **Passage 1:**  
  *Engineer: "If the pressure exceeds the red line, the valve will blow. In this design, the pressure is either well below or well above the line—there's no middle range."*  
  1.  **Probabilistic?** Implicitly yes (concern about failure implies non-zero P(A), "will blow" implies high P(C|A)). → Proceed.  
  2.  **Explicit Equivalence?** No equation stated. → Proceed.  
  3.  **Functional Equivalence?** The description establishes *determinism*: Exceeding the line *guarantees* blowing (P(C|A)=1). The "no middle range" implies P(A) is either 0 (below) or 1 (above) in any given scenario. This avoids the collapse (Option A). **→ PASS.**

  **Passage 2:**  
  *Detective: "There's a fifty-fifty chance the suspect lied about his alibi. If he lied, I'm about eighty percent sure he was at the scene. So the conditional—if he lied, then he was there—carries about eighty percent weight in my belief."*  
  1.  **Probabilistic?** Explicitly yes ("fifty-fifty", "eighty percent", "weight"). → Proceed.  
  2.  **Explicit Equivalence?** **YES.** "carries about eighty percent weight in my belief" [for the conditional] directly equates to the stated P(C|A)=0.8. → **FLAG "Probabilistic Coherence Failure (Lewis Collapse)"**. Proceed to Step 4.  
  3.  *(Step 3 skipped due to Flag at Step 2)*  
  4.  **Diagnosis & Revision:** P(A) = 0.5 (intermediate), P(If A then C) is set = P(C|A) = 0.8. Lewis shows this combination is incoherent unless P(C|A) = P(C). Here P(C) = P(C|A)P(A) + P(C|¬A)P(¬A). Without P(C|¬A), P(C) is undefined, but crucially, setting P(If A then C) = P(C|A) *forces* P(C|A) to equal whatever P(C) is, contradicting the specific 0.8 unless P(C) = 0.8, which requires specific (unstated) values for P(C|¬A). **Required Revision:**  
      *   **Option A:** Not feasible (P(A)=0.5 is core).  
      *   **Option B (Preferred):** Revise final sentence: "So, *given he lied*, I'm about eighty percent sure he was there." (Removes probability assignment *to the conditional statement*).  
      *   **Option C:** If preserving "weight of the conditional" is vital for voice/ambiguity: Add note **"Lewis Violation: Narratively Justified - Detective's Flawed Reasoning/Ambiguous Belief State"**.

  **Passage 3:**  
  *Narrator: "If only love were enough, I might still be happy."*  
  1.  **Probabilistic?** **NO.** This is a reflective, metaphorical lament ("If only..."). No probabilities assigned or implied. → **HALT. "Out of Scope: Requires Editorial Judgment"**.
