answer: |-
  Your fascinating dilemma invites a careful mapping of the moral landscape. Let us begin at the root: do we owe any obligations in dramatizing historical figures that we do not owe to purely fictional characters? If one answers in the negative, the position is straightforward: no special duties arise beyond general norms of storytelling, such as avoiding gratuitous harm to living audiences or perpetuating harmful stereotypes. The awkward commitment here is accepting that even the most maliciously false or degrading portrayal of a historically revered individual generates no distinct moral failing, reducing them to mere raw material, indistinguishable in ethical terms from a wholly invented villain.

  However, if one affirms distinct obligations to the dead, the branches diverge significantly based on the *creditor* of this duty. Does the obligation run primarily to the dead individual themselves, to their living survivors or descendants who may experience collateral harm, or to the integrity of the collective historical record?

  Taking the first path, where the dead *themselves* are the creditors, requires confronting a deeper question: can a person *genuinely be wronged* after death, possessing enduring interests—perhaps in dignity, reputation, or narrative integrity—that filmmakers can violate? If yes, then the duty is direct, grounded in the dead person's own stake in how their story-identity persists. If no, because consciousness and interests cease, then our duty must be derivative: we honor something held *in trust*, like the deceased’s **narrative inheritance**—the bequeathed story-identity they shaped in life, which their community or humanity holds a responsibility to steward faithfully, even absent a conscious claimant. The awkward commitment for the direct interest view is defending the metaphysical status of posthumous interests against charges of incoherence; for the derivative narrative-inheritance view, it's explaining why we owe duties to an abstract legacy when no sentient being suffers if it's traduced.

  Further branching occurs here concerning the *nature* of the violation. Is the core wrong solely the introduction of demonstrable falsehoods about the person’s actions, character, or motivations? Or does the duty also extend to shielding them from truthful but deeply invasive or humiliating portrayals—revealing intimate, painful, or shameful details documented in private letters or diaries, even if accurate? The pure falsehood view risks permitting deeply voyeuristic or cruel exposés under the banner of truth; the truth-plus-invasion view struggles to define the boundaries of legitimate historical inquiry versus prurient violation, facing the awkward commitment of potentially censoring painful but historically significant truths.

  Shifting to obligations owed to *living survivors and descendants*, the focus is on preventing tangible or emotional harm—distress, reputational damage to family lineage, or the violation of cultural or familial sensitivities. The awkward commitment here is the potential variability and subjectivity of harm: obligations might depend heavily on the sensitivities of specific descendants or communities, potentially chilling legitimate historical exploration if any group claims offense. This position can blur with the derivative narrative-inheritance view, particularly when descendants are seen as the designated trustees of that inheritance, making separation difficult in practice; the duties feel distinct conceptually (harm to the living vs. fidelity to the dead) but often converge in application.

  Finally, considering the *collective historical record* as creditor frames the duty as one to society's shared understanding of the past. Does this record possess *intrinsic* value, making any fictionalization—no matter how well-intentioned or narratively effective—a form of **epistemic pollution**, corrupting the purity of collective memory? The awkward commitment here is its radical stringency: it condemns almost all historical drama, demanding pure documentary reconstruction. If the record's value is merely *instrumental*—valuable for fostering understanding, civic virtue, or learning from the past—then fictionalization may be permissible *if* it serves those ends. This instrumental view then splits: does it demand *literal fidelity* to documented dialogue and specific events? Or is **structural fidelity** sufficient—faithfully preserving the true causal patterns, institutional dynamics, systemic pressures, and fundamental psychological motives, even if individual scenes or conversations are invented to illuminate those deeper truths? Literal fidelity's awkward commitment is its potential trivialization of history, demanding actors recite verified lines while ignoring the underlying forces shaping events. Structural fidelity’s awkwardness lies in the difficulty of verifying whether an invented scene *truly* captures the underlying structure, opening the door to significant distortion under a veneer of interpretive license.

  Now, regarding unoccupied positions: the combination holding that the historical record has *intrinsic* value while simultaneously accepting that *structural fidelity* alone is adequate appears vacant. This seems incoherent; if the record's value is intrinsic purity, structural fidelity, which explicitly permits fabrication within defined bounds, inherently pollutes it. Another gap is a position affirming direct posthumous interests while accepting *only* literal invasions (not falsehoods) as violations; this combination seems neglected, possibly because falsehoods are intuitively seen as the primary assault on a person's enduring interests, and the distinction feels less salient here. Conversely, a view denying genuine posthumous wrongs but accepting duties to prevent truthful invasions based *solely* on narrative inheritance (without invoking harm to survivors) might be underdeveloped, potentially lost between the derivative trust view and the survivor-harm view.

  Named positions nest within these leaves: the "no special obligations" view is akin to radical aesthetic autonomy. The "direct interest" view aligns with certain strong interpretations of posthumous rights. The "narrative inheritance" view draws on communitarian or trusteeship ethics. The "survivor harm" view reflects privacy or relational ethics. The "epistemic pollution" stance echoes strict historicist or positivist concerns. The "structural fidelity" position resonates with approaches championed by thoughtful practitioners of historical fiction who prioritize thematic and causal truth. Some combinations, particularly nuanced blends within the instrumental-record branch concerning degrees of fidelity, or intricate reconciliations between narrative inheritance and survivor harm, remain largely unnamed, reflecting the practical complexity and relative novelty of parsing these specific obligations in applied ethics. The tree, like the debate itself, reveals the intricate entanglement of respecting the departed, protecting the living, and serving truth.
