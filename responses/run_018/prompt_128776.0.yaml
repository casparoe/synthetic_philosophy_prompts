  For progress? A formal result showing how far partial orders can stretch before breaking would satisfy Camp A’s rigor itch. But Camp B needs cognitive science showing humans *do* exhibit intransitivity even in simple spectrums (e.g., color comparisons). Without that, they’ll just call each other irrational. 

  ...Though honestly? The deepest progress might be admitting that "Is A better than B?" sometimes means "Should I choose A over B?" and other times "Does A contribute more to the good?"—and those can decouple. But that’s almost heretical in value theory. 

