  ## Synaptic Ballot

  The crimson burst on shared sight must be banned?  
  *What all prefer the group must choose as right.*  
  For art, the raw perception I demand.  

  Twelve minds recoil from gore, a trembling band—  
  The filter shields the mind from gore's harsh light.  
  The crimson burst on shared sight must be banned?  

  *One soul may claim a vision as their own,*  
  My brush requires the burn that tempers sight.  
  For art, the raw perception I demand.  

  The vote confirms the shield: a gentle hand  
  Enforces peace, extinguishes the fight.  
  *What all prefer the group must choose as right.*  

  But grant my node exemption, understand—  
  My canvas starves deprived of primal fright.  
  *One soul may claim a vision as their own.*  

  The pact dissolves; the shield begins to fade,  
  The shared stream bleeds anew, provoking fright.  
  The crimson burst on shared sight must be banned?  

  Collective calm commands the switch's throw,  
  But voids the right that makes my labour bright.  
  *What all prefer the group must choose as right.*  

  The lens cracks where the twin commandments grind,  
  No rule prevails within this voting night.  
  *One soul may claim a vision as their own.*  
  *What all prefer the group must choose as right.*

  ---

  **Notes on Architecture & Paradox:**

  1.  **Refrains & Alternation:**
      *   Line 1 (Paretian): "*What all prefer the group must choose as right.*" (Established necessity of unanimous preference).
      *   Line 3 (Liberal): "*One soul may claim a vision as their own.*" (Established minimal protected sphere).
      *   These refrains alternate perfectly as the closing lines of tercets 2-5, demonstrating their mutual blockage:
          *   Tercet 2: Paretian prevails (vote happens, filter wins).
          *   Tercet 3: Liberal prevails (exemption claimed, art defended).
          *   Tercet 4: Paretian prevails (exemption voids unanimity, shield reinstated?).
          *   Tercet 5: Liberal prevails (shield voids individual right, art lost?).

  2.  **Scenario Integration:**
      *   "The crimson burst on shared sight" (violent imagery).
      *   "The filter shields the mind from gore's harsh light" (universal filter).
      *   "Twelve minds recoil... One soul" (near-unanimous preference vs. single dissenter).
      *   "My brush requires the burn that tempers sight," "My canvas starves" (artistic justification for unfiltered perception).

  3.  **The Deadlock in Action:**
      *   Applying the Paretian principle (voting for the filter) violates the dissenter's protected sphere (Tercet 2 -> Tercet 3: Art demands the raw perception, blocked by the vote).
      *   Applying the Liberal principle (granting exemption) voids the unanimous preference (Tercet 3 -> Tercet 4: The group *prefers* the filtered state, blocked by the exemption).
      *   The final tercet (Tercet 5) explicitly states the impasse: "No rule prevails within this voting night."

  4.  **Final Couplet:**
      *   The villanelle form *requires* the final two lines to be the two refrains: "One soul may claim a vision as their own. / What all prefer the group must choose as right."
      *   They stand side-by-side, syntactically and logically disconnected. No conjunction ("but," "and," "yet") softens the clash. No resolution is offered. The form itself forces their juxtaposition, embodying the structural impossibility.

  5.  **Sen's Paradox Manifest:**
      *   A reader familiar with social-choice theory recognizes:
          *   Unanimity (Paretian) is satisfied (all prefer filtered *if* forced together).
          *   Minimal Liberalism is satisfied (one protected personal choice: unfiltered perception for art).
          *   Yet, no consistent social choice exists that satisfies both principles simultaneously.
      *   The poem's progression enacts the logical steps leading to the deadlock inherent in Sen's theorem.

  6.  **Emotional Tension:**
      *   The visceral language ("crimson burst," "gore's harsh light," "recoil," "trembling band," "primal fright") conveys the discomfort driving the majority.
      *   The dissenter's plea ("My brush requires the burn," "My canvas starves") evokes the necessity of the unfiltered experience for their creative purpose.
      *   The final image of the "lens crack[ing]" and "voting night" emphasizes the failure of the process itself.
