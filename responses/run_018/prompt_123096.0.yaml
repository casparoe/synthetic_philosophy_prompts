  Here's the teaching plan structured as requested, followed by the JSON summary:

  ### Teaching Sequence (90 mins)
  **1. Conceptual Foundation: Agency Distinction (20 mins)**  
  - **Prerequisite Distinction**: Establish *temporal identity of individual agency* (same person exists across time with unified interests) vs. *collective agency discontinuity* (polity comprises distinct individuals/generations with no persistent "self").  
  - **Key Move**: Use thought experiments:  
    - *Individual*: "Would future-you reasonably resent present-you for a binding health decision?" (Usually no – same self).  
    - *Collective*: "Would 18th-century Americans resent being bound by 17th-century colonists?" (Yes – different people/contexts).  
  - **Why Essential**: Without this, the Ulysses analogy imports false assumptions of identity continuity.

  **2. Carrying Example: Paired Scenario (25 mins)**  
  - **Scenario**:  
    - *Individual "Ulysses"*: A climate activist (Present-A) installs a smartphone blocker to prevent future-A from deleting climate apps during election week.  
    - *Constitutional "Precommitment"*: A post-dictatorship constituent assembly entrenches judicial independence, requiring 75% approval to remove judges.  
  - **Analogy Break**:  
    - When future-A tries disabling the blocker, *their objection is psychological* ("I regret my choice but am still me").  
    - When a future 51% legislative majority tries removing judges, *their objection is democratic* ("We represent today's people; past generations can't govern from the grave").  
  - **Visualization**: Timeline showing generational turnover in constitutional case vs. continuous identity in individual case.

  **3. Misconception Interception (30 mins)**  
  | Misconception | Stage | Intervention |
  |---------------|-------|-------------|
  | "Precommitment = discipline" | During carrying example setup | Contrast: Discipline is internal (willpower), while precommitment is *external* (mast/entrenchment). Ask: "Can a polity have 'willpower' without unified agency?" |
  | "Entrenchment = anti-democratic" | After constitutional example | Introduce *reverse-Ulysses*: "What if the 75% rule protects against a *transient* 51% majority swayed by panic (e.g., post-terrorism)? Is this anti-democratic or *preserving* supermajoritarian intent?" |
  | "Future generations = polity's 'future self'" | During analogy-break discussion | Hammer: "Does the future majority owe loyalty to past decisions? Does future-A owe loyalty to past-A? Why is the first question political, not metaphysical?" |

  **4. Understanding Check (10 mins)**  
  - **Closing Question**:  
    *"If a future majority calls entrenched rights 'undemocratic paternalism,' can we defend them using Ulysses logic? Where does this defense fail, and what better justification exists?"*  
  - **Target Insight**: Ulysses fails at binding *others*; reverse-Ulysses (shielding against transient factions) succeeds by appealing to intergenerational sovereignty.

  **5. Explicit Omissions (5 mins)**  
  - Omit: Debates about *personal identity metaphysics* (Parfit, etc.), *constituent power theory* (Sieyès), and *historical case studies* (e.g., Article V).  
  - State: "We're bracketing whether constitutions *can* bind morally – focusing solely on where the agency analogy collapses."

  ### Injected Framing Integration  
  - **Reverse-Ulysses**: Woven into misconception #2 ("anti-democratic") and the analogy-break. Frame entrenchment as a "firewall" against *temporary* factional capture ("We bind *our era's possible rash acts*, not posterity") using the non-identity of generations ("2023 citizens ≠ 2073 citizens").

