prompt: |-
  I've noticed a recurring asymmetry in how people draw the line between moral values and mere biases or preferences, particularly in cross-cultural or intergroup moral disagreement. The pattern runs like this: a speaker holds a normative commitment—say, that certain ecological harms ought to be avoided regardless of economic benefit—and presents it as a universal value. When an interlocutor advances a structurally parallel commitment—say, that certain economic disruptions ought to be avoided regardless of ecological benefit—the speaker treats that not as a competing universal value but as a parochial preference, or even as a cognitive bias that distorts moral judgment. What makes the pattern distinctive is that the speaker does not apply a consistent criterion—such as universality, strength of conviction, or independence from self-interest—to both commitments. Rather, the classification tracks group membership: commitments shared by the speaker's reference group are elevated to the status of values, while commitments distinctive to the opposing group are downgraded to preferences or biases, even when both have the same formal structure and emotional salience. I have seen this in debates about dietary ethics, environmental policy, and family obligations, but the logic seems portable. Is there an established concept in moral psychology or metaethics for this specific asymmetry—this selective promotion and demotion of normative commitments based on social alignment rather than on any internal feature of the commitment itself? If there is, I want to know precisely how it differs from ordinary in-group favoritism, from motivated reasoning, and from straightforward moral relativism, because in each case the mechanism and the normative implications seem different. If there is no precise term, I would like one coined, together with a clear boundary: under what conditions does a legitimate distinction between value and preference become this particular failure mode, and where exactly does the failure lie—in the classification, in the reasoning that follows, or in the refusal to apply the distinction reflexively?
reasoning: |-
  Okay, the user has noticed a recurring asymmetry in how people distinguish between moral values and mere biases or preferences during cross-cultural or intergroup moral disagreements. They describe a pattern where someone presents their own normative commitment as a universal value, but treats a structurally similar commitment from another group as a mere preference or bias. The key issue is that this classification seems based on group membership rather than consistent criteria.

  The user wants to know if there's an established term for this specific asymmetry in moral psychology or metaethics. They also want to understand how it differs from related concepts like in-group favoritism, motivated reasoning, and moral relativism. If no term exists, they'd like one coined with clear boundaries defining when legitimate value-preference distinctions become problematic.

  I need to analyze this carefully. The user has identified a sophisticated pattern that involves meta-cognitive judgments about the nature of commitments. They're not just describing bias in moral judgments, but bias in how we categorize what counts as moral versus non-moral. This is more specific than general in-group favoritism.

  Looking at moral psychology concepts, moral credentialing comes to mind, but that's about feeling licensed to discriminate after establishing moral credentials. Moral foundations theory explains differences in what people value but not this classification asymmetry. Epistemic injustice deals with credibility but not specifically with categorizing moral commitments.

  The closest established concept might be "value-laden categorization asymmetry," but I'm not sure that's a standard term. Perhaps we need to synthesize something new. "Metavalue Asymmetry" could work, emphasizing that it's about judgments of value status. Or "Affiliation-Based Value Polarization" to highlight the group-based nature.

  For differentiation: In-group favoritism is broader. Motivated reasoning explains why but not the specific asymmetry in classification. Moral relativism is rejected by both parties here - each claims universality for their view while denying it to others.

  The failure lies at multiple levels: misclassification of commitments, flawed reasoning that follows, and refusal to apply criteria reflexively. The normative implication is a failure of epistemic fairness in moral discourse.

  This user clearly has deep knowledge of philosophy and moral psychology. Their examples show careful observation of real-world debates. They're likely an academic or advanced student seeking precise conceptual tools. They might be preparing for research or hoping to articulate this phenomenon in scholarly work. I should provide rigorous distinctions while making the explanation accessible.
answer: |-
  You've identified a sophisticated and pernicious pattern central to moral conflict, and your analysis is spot-on. While no single, universally established term captures *exactly* this specific asymmetry in the *classification* of normative commitments (value vs. preference/bias) based solely on social alignment, several concepts come close, and we can synthesize a precise definition.

  **Established Concepts & Why They Aren't Perfect Fits:**

  1.  **Moral Credentialing (or Self-Licensing):** While related, this focuses on how prior moral actions license subsequent *immoral* actions. Your pattern involves licensing the *dismissal* of others' moral claims via downgrading their status, not licensing one's own misdeeds.
  2.  **Moral Foundations Theory (MFT):** MFT explains *why* different groups prioritize different foundations (e.g., Care, Fairness, Loyalty, Authority, Sanctity, Liberty), leading to divergent judgments. However, it doesn't inherently explain the *asymmetric classification* ("my foundation is objective value, yours is mere bias") – that's an additional step beyond the descriptive differences.
  3.  **Epistemic Injustice (Fricker):** This concerns unfairness in credibility assignment. While your pattern involves denying the *epistemic status* of the other's commitment (dismissing it as non-moral), epistemic injustice typically focuses on credibility regarding *factual testimony* or *interpretive resources*, not specifically the classification of the *nature* of normative commitments themselves.
  4.  **In-Group Favoritism / Out-Group Derogation:** This is the broadest and most fundamental social psychological phenomenon underlying your pattern. However, it's too general. Your focus is specifically on how this favoritism manifests in the *metacognitive judgment* about *what counts as a moral value* versus a mere preference or bias. It's a specific *type* of in-group bias applied to meta-ethical categorization.
  5.  **Motivated Reasoning:** This explains the *mechanism* – people reason in ways that favor their desired conclusions/group identity. It's the *engine* driving the asymmetry in classification, but not a specific name for the asymmetry *itself*.
  6.  **Naïve Realism / Objectivism:** This is the underlying *assumption* that one's own views reflect objective reality. The asymmetry arises when this assumption is applied selectively: *my* views are objective reality (hence values), *yours* are subjective distortions (hence preferences/biases). But again, it doesn't name the specific classificatory asymmetry.

  **Coining a Term: Metavalue Asymmetry (MVA)**

  To capture the specificity you describe, I propose the term **"Metavalue Asymmetry" (MVA)**.

  *   **"Meta-"**: Refers to judgments *about* values (what qualifies as a value vs. preference/bias).
  *   **"Value"**: The object of the judgment (the normative commitment itself).
  *   **"Asymmetry"**: Highlights the inconsistent application of criteria based on group affiliation.

  **Definition of Metavalue Asymmetry (MVA):** *The systematic, inconsistent application of criteria for classifying normative commitments as either universal moral values or mere preferences/biases, where the classification is primarily determined by the social alignment of the commitment holder with the classifier's own reference group, rather than by consistently applied internal features of the commitment (e.g., universality claim, emotional salience, perceived objectivity, independence from self-interest). Commitments shared by the in-group are elevated to "values," while structurally similar commitments held by out-groups are downgraded to "preferences" or "biases."*

  **Key Differentiators from Related Concepts:**

  1.  **vs. Ordinary In-Group Favoritism:**
      *   **Scope:** MVA is a *specific manifestation* of in-group favoritism. It targets the *metacognitive categorization* of normative claims, not just preference for the in-group's *substantive* position or general positive regard.
      *   **Mechanism:** It involves applying a double standard to the *epistemic/moral status* of commitments, not just favoring the content.
      *   **Normative Implication:** It directly undermines the possibility of recognizing the other group's claim as a *legitimate moral stance* worthy of engagement, framing it instead as irrational or non-moral.

  2.  **vs. Motivated Reasoning:**
      *   **Focus:** Motivated reasoning is the *process* (driven by identity protection, desire for coherence, etc.) that *leads to* MVA. MVA is the *specific outcome* of that process in the domain of value classification.
      *   **Specificity:** MVA describes the *particular pattern of inconsistent classification* that motivated reasoning produces in this context. Motivated reasoning is broader (e.g., it can lead to biased factual beliefs, selective memory, etc.).

  3.  **vs. Straightforward Moral Relativism:**
      *   **Position:** MVA practitioners explicitly *reject* relativism regarding their *own* commitments (claiming universality). They implicitly *impose* a form of relativism or subjectivism *on the out-group's commitments* by downgrading them to preferences/biases.
      *   **Asymmetry:** Relativism typically applies symmetrically ("all morals are relative"). MVA is fundamentally *asymmetric*: objectivism for us, subjectivism/error-theory for them.
      *   **Normative Stance:** The MVA classifier denies the *possibility* of the out-group having genuine moral values in this domain, whereas a relativist might grant they have values, just different ones.

  **The Boundary: When Legitimate Distinction Becomes MVA**

  The failure mode of MVA arises under specific conditions:

  1.  **Structural Parity:** The competing commitments share key formal features:
      *   Both are presented as normative "oughts."
      *   Both involve trade-offs with other valued goods (ecology vs. economy, tradition vs. autonomy).
      *   Both exhibit similar emotional salience and conviction for their holders.
      *   Both can be argued to involve considerations beyond pure self-interest (e.g., community well-being, future generations, intrinsic worth).
  2.  **Lack of Consistent Application:** The speaker fails to apply *their own stated or implied criteria* for "value" status consistently. If they cite universality, do they genuinely seek universal justification for their view and scrutinize others' similarly? If they cite independence from self-interest, do they fairly assess the out-group's claim? The criteria become tools for justification, not discovery.
  3.  **Group Affiliation as Primary Determinant:** The classification (value vs. preference) correlates overwhelmingly with whether the commitment aligns with the speaker's in-group or an out-group, *independently* of any consistent application of criteria to the internal features of the commitments themselves.
  4.  **Refusal of Reflexivity:** The speaker resists applying the same classificatory scrutiny to their *own* commitments. When challenged, they deflect, double down on their criteria without consistency, or dismiss the parallel entirely rather than engaging in self-reflection. This is the core normative failure.

  **Where the Failure Lies:**

  The failure is multifaceted:

  1.  **In the Classification:** The act of categorizing itself is biased by group allegiance, not reasoned criteria. This is the primary epistemic failure.
  2.  **In the Reasoning that Follows:** The flawed classification licenses dismissive reasoning: "We don't need to seriously engage with their *moral* argument because it's just a preference/bias." This prevents genuine moral dialogue and understanding.
  3.  **In the Refusal to Apply Reflexively:** The ultimate ethical failure is the lack of intellectual humility and fairness – the refusal to subject one's own foundational commitments to the same meta-ethical scrutiny demanded of the out-group. This reveals the classification as an exercise of power/status defense, not a sincere search for moral truth or understanding.

  **Conclusion:**

  "Metavalue Asymmetry" (MVA) names the specific phenomenon you've astutely observed: the group-based, asymmetric elevation/demotion of normative commitments to the status of "universal value" versus "mere preference/bias," bypassing consistent criteria. It is a distinct failure mode arising when structurally similar commitments are reflexively classified based on the holder's group affiliation, particularly when accompanied by a refusal to apply the same critical lens reflexively. It corrupts moral discourse by pathologizing or trivializing the out-group's moral stance, foreclosing genuine engagement, and masking in-group bias under the guise of objective moral categorization. Recognizing MVA is crucial for diagnosing and potentially overcoming deep-seated moral impasses.
