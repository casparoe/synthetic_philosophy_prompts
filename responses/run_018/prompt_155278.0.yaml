  The deathbed question is particularly brutal—forcing Voss to confront temporal fragility of meaning-frames. User wants blood, not platitudes. Must design follow-ups that corner evasion: if she claims "coherence isn't objective," press on whether coherence requires unconscious value-assumptions. 

