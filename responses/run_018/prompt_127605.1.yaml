  ### Joint Statement on Sen's Liberal Paradox  
  **Adversarial Collaboration Between Lexical Liberal and Preference-Reconstructionist**  

  #### **1. Agreed Claims on Formal Structure**  
  We jointly affirm:  
  1.1. **Two-person, two-option proof**: Sen’s paradox arises from a social choice setup with two individuals (A and B) and two distinct pairs of alternatives. Minimal liberalism (L) assigns each individual decisive power over one pair (e.g., A over {x, y}, B over {w, z}), while weak Pareto (P) requires society to prefer X over Y if both individuals rank X above Y.  
  1.2. **L and P entail impossibility**: For specific preference profiles, L and P jointly produce an intransitive social ranking (e.g., a cycle X > Y > Z > X), proving no social ordering satisfies both conditions universally.  
  1.3. **"Prude and lewd" illustration**: The case (individual 1: prude, decisive over {no-read, lewd-read}; individual 2: lewd, decisive over {lewd-read, both-read}) demonstrates the tension. L and P conflict when prude prefers no-read > lewd-read, lewd prefers both-read > lewd-read, and both prefer no-read > both-read.  
  1.4. **Welfare significance**: Both camps agree that individual welfare is normatively relevant. Neither denies that social choices should reflect individuals’ well-being where feasible.  

  #### **2. Precise Disagreement**  
  - **Lexical Liberal (LL)**: The paradox proves rights must be *lexically ordered* but *confined to contextually bounded spheres* (local liberalism). Rights in a sphere (e.g., personal) trump Pareto outside intrusions, resolving the contradiction by restricting L’s domain.  
  - **Preference-Reconstructionist (PR)**: The paradox dissolves under *preference reconstruction*: Individuals’ preferences include second-order commitments to procedural rights (e.g., "I prefer others’ rights be respected"). Enriched profiles satisfy L and P without restricting rights domains.  

  #### **3. Cruxes, Cases, and Predictions**  
  **3.1. Crux (a): Should a preference about another’s right enter the social profile?**  
  - *Agreed case*: A prefers B lack the right to choose B’s diet (e.g., A believes B’s choices harm B). B insists on this right and prefers unhealthy > healthy.  
    - **LL prediction**: A’s preference is excluded from the profile in B’s "personal sphere." B’s decisiveness holds; social choice respects B’s preference.  
    - **PR prediction**: A’s preference is reconstructed to include commitment to B’s right (e.g., "A prefers B’s choice, given B’s right"). No conflict arises; P and L cohere.  

  **3.2. Crux (b): Can nested spheres avoid majoritarianism?**  
  - *Agreed case*: Municipal zoning decision with nested spheres: personal (homeowner’s garden design), communal (neighborhood land use), institutional (city zoning laws).  
    - **LL prediction**: Spheres are formally definable (e.g., "personal" = property <1 acre). Lexical priority (personal > communal > institutional) prevents majoritarian override of personal rights.  
    - **PR prediction**: Without preference reconstruction, nested spheres collapse into majoritarianism when conflicts span spheres (e.g., city vote overrules homeowner). With reconstruction, procedural commitments align preferences across spheres, making lexical ordering unnecessary.  

  #### **4. Disagreements Table**  
  | **Position**                | **Crux (a): Preferences about rights**                               | **Crux (b): Nested spheres**                                         |  
  |-----------------------------|----------------------------------------------------------------------|----------------------------------------------------------------------|  
  | **Lexical Liberal (LL)**    | Exclude preferences infringing on bounded spheres.                  | Spheres definable; lexical priority prevents majoritarianism.        |  
  | **Preference-Recon (PR)**   | Reconstruct preferences to include procedural commitments.          | Spheres collapse without reconstruction; redundant with it.          |  
  | **Agreed Test**             | Diet-right case (A vs. B’s choice).                                | Zoning case (personal vs. city).                                   |  
  | **LL Prediction**           | B’s right upheld; A’s preference ignored in sphere.                 | Homeowner’s garden design immune to majority vote.                 |  
  | **PR Prediction**           | Reconstruction aligns A’s preference with B’s right; no conflict.   | Without reconstruction, city vote overrules homeowner; with reconstruction, no conflict arises. |  

  #### **5. Verbal Dispute Assessment**  
  We concur that **no part of the dispute is purely verbal**. Both camps use "liberalism" to denote *individual decisiveness over specific choices*, per Sen’s condition L. The disagreement is substantive:  
  - LL treats liberalism as a **domain-restricted axiom** (rights apply only in predefined spheres).  
  - PR treats liberalism as **embedded in preferences** (rights are procedurally valued in all choices).  
  The core divergence—sphere restriction vs. preference enrichment—yields distinct empirical predictions (see §3–4), confirming non-verbal disagreement.  

