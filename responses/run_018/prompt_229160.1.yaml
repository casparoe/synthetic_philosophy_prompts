answer: |-
  Here’s a breakdown tailored for your students, framed as a colleague’s reflection. I’ll walk through the slogans, their defensible interpretations, and where they hold up (or collapse) under scrutiny—especially regarding the rationality question.  

  **The "one vote never decides" camp** hinges on instrumental rationality: if voting has a cost (time, effort), and the expected benefit is the probability of your vote changing the outcome multiplied by the value of that outcome, then voting seems irrational. But "never" is doing heavy lifting. A literal reading—*zero* probability—is empirically false. We have documented cases of ties or one-vote margins (e.g., 2017 Virginia House of Delegates election decided by drawing lots after a tie). Even without ties, recounts and margin-triggered audits mean a single vote *can* indirectly decide outcomes by altering the narrative or triggering procedures. A better precisification: pivot probability is *vanishingly small*—often estimated between 1 in 10 million to 1 in a billion in large elections. At that scale, the expected instrumental benefit (pivot prob × election value) likely doesn’t cover modest costs (e.g., 30 minutes of time). **This low-probability reading substantiates the irrationality verdict** *if* we accept strict instrumentalism and ignore all non-pivot effects.  

  **The "every vote counts" rebuttal** feels powerful but is often ambiguous. It could mean:  
  - *Literal/tautological*: Votes are counted. True, but irrelevant—no one denies ballots are tallied.  
  - *Pivotality*: Every vote *could* be decisive. But as above, this probability is minuscule; waving "counts" as a counterargument ignores the cost-benefit math.  
  - *Expressive value*: Voting satisfies a desire to affirm identity or voice. This shifts the goalposts—it’s non-instrumental.  
  - *Marginal contribution to mandate*: Your vote amplifies the winner’s perceived legitimacy. Plausible, but empirically fuzzy and rarely quantified.  
  - *Collective obligation*: Voting is rational as a duty, akin to paying taxes. But this invokes ethics, not instrumental rationality.  

  **Crucially, "every vote counts" typically fails as a direct rebuttal to the instrumental critique**. If "counts" means pivotality, it’s a non-sequitur—acknowledging votes are tallied doesn’t address the probability issue. The slogan only gains traction if it smuggles in non-instrumental values (expressivism, duty) or collective effects (mandate). But then it’s no longer engaging the instrumental argument on its own terms.  

  **Where does this leave the rationality verdict?**  
  - *Under strict instrumentalism*: Voting remains irrational for most large elections. The pivot probability is just too low to clear cost-benefit thresholds.  
  - *But instrumentalism is narrow*. If we include expressive utility (e.g., "I value participating") or ethical duty, voting becomes rational *for those who derive such benefits*. However, this concedes that the "every vote counts" camp isn’t really defending instrumental rationality—it’s changing the subject.  

  **What could change my mind?**  
  1. **Empirical**: Evidence that pivot probabilities are systematically higher than estimated—e.g., in highly competitive districts or due to "chaos theory" effects (where tiny perturbations cascade). If pivot prob exceeded, say, 1 in 100,000, instrumental voting could be rational even with moderate costs.  
  2. **Theoretical**: A robust model showing votes *reliably* influence outcomes beyond pivoting (e.g., via shifting party platforms based on margin of victory). If we could quantify this marginal impact, it might tip instrumental calculations.  
  3. **Conceptual**: If "rationality" includes weak reciprocity norms ("if I benefit from a system, I should uphold it"), voting could be rational even with low pivot odds—but this edges into ethical obligation.  

  **Where my reasoning is shakiest**:  
  - Quantifying "negligible" probability. Is 1 in a billion meaningfully different from zero? Philosophically, yes—but psychologically or practically?  
  - Collective action problems. If everyone reasons instrumentally, democracy collapses. Some argue this creates a duty to vote, but instrumental rationality alone can’t solve this unless you expect your vote to trigger widespread compliance (unlikely).  

  **For your students**:  
  - **"Never decides"** isn’t literally true but *is* defensible as "pivot probability is too low to justify costs under instrumentalism."  
  - **"Every vote counts"** is either a tautology (votes are tallied) or a Trojan horse for non-instrumental values. It doesn’t refute the instrumental critique without conflating rationality with ethics or emotion.  
  - **The core conflict** isn’t about facts but frameworks: instrumental vs. expressive/duty-based rationality. The slogans obscure this.  

  **Bottom line**: The irrationality verdict survives if we stick to instrumental rationality and accept low pivot probabilities. "Every vote counts" only "works" by abandoning instrumentalism—which might be the right move, but students should own that shift. If you want to unsettle both sides, press them to define "rationality" and "counts" without sleight of hand.
