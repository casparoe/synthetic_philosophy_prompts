answer: |-
  ### Q&A Prep Sheet: Moderate Pragmatic Encroachment Colloquium  
  **Core Vulnerability:** If stakes raise the justification threshold for knowledge, what *non-arbitrary principle* sets that threshold?  

  ---

  #### **Objections Ordered by Potential Damage**  
  *(1 = Most Dangerous if Botched)*  

  1.  **The Threshold Problem (Invariantist or Skeptic)**  
      **Likely Questioner:** Hardline Invariantist  
      **Objection Phrased:** "You grant that stakes raise the justification threshold for knowledge. But *how much* evidence is 'enough' when stakes are high? Is it twice as much? Ten times? Without a principled, non-stakes-relative standard for 'knowledge-level justification', your view collapses into subjectivism or makes knowledge arbitrarily sensitive to trivial changes in practical context."  
      **Concede:** There is no precise, context-independent formula for the threshold.  
      **Hold:** Thresholds are set by *practical adequacy*: the level of justification needed for the subject to rationally act on *p* in their situation. This is objective (it tracks real stakes), not subjective.  
      **2-Minute Reply:** "The threshold isn't quantified but *functional*. In low stakes, evidence justifying confident action suffices for knowledge. In high stakes, that same evidence may justify only hesitation, not confident action – hence it fails the higher functional bar for knowledge. The Delegation Problem illustrates this: The inspector’s evidence justifies signing off (low-stakes action); the manager’s identical evidence doesn’t justify *relying* on the scaffold without further checks (high-stakes action). Knowledge tracks this action-guiding norm."  
      **Soft Spot:** Admits vagueness in the threshold. Invites "But why call this *knowledge*?"  

  2.  **The Contextualist Hijack (Contextualist)**  
      **Likely Questioner:** Contextualist  
      **Objection Phrased:** "Your Delegation Problem isn’t a win for pragmatic *encroachment*; it’s a textbook case for *contextualism*! When the inspector says ‘I know’, ‘knows’ expresses a low-standards relation true of her. When the manager’s colleague later says ‘She didn’t know’ after a near-collapse, ‘knows’ expresses a high-standards relation, also true. No metaphysics of stakes-changing-justification needed – just semantics of ‘knows’ shifting with the speaker’s context."  
      **Concede:** Contextualism neatly handles the truth-value intuition across attributions.  
      **Hold:** Contextualism fails the *institutional test*: Delegation requires the inspector’s knowledge to be *stable* across contexts to warrant the manager’s reliance. If the manager’s high-stakes context retroactively makes "The inspector knew" false, delegation collapses into error.  
      **2-Minute Reply:** "Delegation requires the inspector’s epistemic state *itself* to license the manager’s reliance, regardless of who’s talking later. On contextualism, if the manager (in her high-stakes context) asks ‘Did the inspector *know*?’, the answer is ‘no’ – undermining her rationale for relying on the report! My view preserves the inspector’s *actual* low-stakes knowledge as a fact the manager can inherit justification from, even if the manager’s own high-stakes state isn’t knowledge."  
      **Soft Spot:** Must argue institutional practice requires invariant knowledge *facts*, not just contextualist truths.  

  3.  **Decision Theory Swallows the Problem (Decision Theorist)**  
      **Likely Questioner:** Decision Theorist  
      **Objection Phrased:** "All your cases show is that rational *action* requires higher *credence* when stakes are high. The inspector rationally acts on 0.95 credence; the manager needs 0.99. But *knowledge* is just a matter of (say) reliably formed true belief with sufficient credence *by purely epistemic standards*. Why contaminate epistemology with pragmatics when decision theory handles the data cleanly?"  
      **Concede:** Decision theory perfectly explains the differing *action norms*.  
      **Hold:** Knowledge isn’t just high credence + truth – it’s the *norm for action*. If the manager doesn’t know the scaffold is safe, she *shouldn’t act* as if it is, regardless of credence. Reducing knowledge to credence severs this normative link.  
      **2-Minute Reply:** "If knowledge is purely epistemic, why can’t the manager rationally act on her 0.95 credence? After all, by *epistemic* standards, it’s identical to the inspector’s knowledge-constituting state! But intuitively, she *can’t* – she needs more evidence. This shows the epistemic bar for knowledge *itself* is stakes-sensitive. Knowledge is the norm of assertion and practical reasoning; if that norm shifts with stakes, knowledge itself must be sensitive. Your view leaves knowledge inert."  
      **Soft Spot:** Requires accepting "Knowledge is the norm of action" as premise.  

  4.  **Relocation to Assertion/Belief (Invariantist)**  
      **Likely Questioner:** Orthodox Invariantist  
      **Objection Phrased:** "I share your intuitions about the paired cases! But you mislocate the stakes-sensitivity. What varies isn’t *knowledge* (which is invariant), but the *justification required for assertion* or *practically rational belief*. The inspector knows and may assert; the manager knows but *ought not assert or act* without more evidence – the difference is in the norms governing her speech/action, not her knowledge."  
      **Concede:** Stakes *do* affect norms of assertion and practical reasoning.  
      **Hold:** This relocation fails the Delegation Problem: If the manager *knows* the scaffold is safe (same as the inspector), why can’t she rationally rely on that knowledge? Why does she need independent grounds? Only if her high stakes *defeat* her knowledge (by raising the justification bar) does her need for further checks make sense.  
      **2-Minute Reply:** "If the manager knows, her belief is already epistemically impeccable. Why isn’t it directly actionable? Your view forces you to say high-stakes make knowledge *practically inert* – but knowledge just *is* what warrants action! My view explains why she seeks more evidence: her initial evidence doesn’t suffice for knowledge *given her stakes*. Delegation works because she inherits *justification* (a defeasible basis for inquiry), not knowledge."  
      **Soft Spot:** Assumes knowledge must be actionable. Invariantist may deny this link.  

  5.  **Parity with the Skeptical Paradox (Contextualist/Invariantist)**  
      **Likely Questioner:** Philosophically Sophisticated Grad Student  
      **Objection Phrased:** "Your paired cases resemble skeptical paradoxes: Same evidence, but in one context it seems sufficient, in another insufficient. Skeptics exploit this to argue we *never* know. Don’t you risk making knowledge *too* fragile? If a coffee spill raises my stakes in ‘This cup is non-toxic’, do I lose knowledge I had seconds ago?"  
      **Concede:** Yes, this is a cost; knowledge can be lost via trivial stake-increases.  
      **Hold:** This fragility is constrained: Stakes only matter when they practically engage the proposition. Spilling coffee doesn’t raise stakes in scaffold safety! Fragility is a feature, not a bug: it tracks real shifts in rational actionability.  
      **2-Minute Reply:** "The fragility is bounded by practical relevance. I don’t lose knowledge about the scaffold if I spill coffee! Only stakes *relevant to p* matter. And yes, if toxins suddenly matter intensely, my prior evidence *might* become insufficient – but that reflects the genuine fact that I now *need* more certainty to act. Moderate encroachment avoids skepticism by keeping thresholds within practical reach in ordinary contexts."  
      **Soft Spot:** Admits knowledge can be easily lost; may seem counterintuitive.  

  6.  **The ‘Cheap Knowledge’ Objection (Invariantist)**  
      **Likely Questioner:** Evidence-Centered Invariantist  
      **Objection Phrased:** "On your view, can’t a low-stakes subject gain *knowledge* of a high-stakes proposition *too easily*? Imagine the inspector glancing carelessly at the report. If stakes are low for her, she might ‘know’ the scaffold is safe on woefully inadequate evidence, just because she’s irresponsible! That cheapens knowledge."  
      **Concede:** A subject with *irresponsibly low* perceived stakes might *falsely* think they know.  
      **Hold:** Perceived stakes ≠ real stakes. Real stakes (objective practical consequences) set the threshold. The careless inspector doesn’t know if her evidence is genuinely insufficient *for the real (even if unrecognized) risks*.  
      **2-Minute Reply:** "Stakes are objective – they depend on the actual consequences of being wrong, not the subject’s awareness. The careless inspector *doesn’t* know if her evidence is too weak given the *real* danger, even if she *thinks* the stakes are low. My view doesn’t make knowledge easy; it makes the *demand for evidence* proportional to what’s *actually* at stake."  
      **Soft Spot:** Requires objective stakes, which might be hard to define.  

  7.  **Delegation as Evidence Addition (Decision Theorist/Invariantist)**  
      **Likely Questioner:** Pragmatic Invariantist  
      **Objection Phrased:** "Isn’t the manager’s problem simply that she has *less* evidence than the inspector? The inspector saw the raw data; the manager only has the inspector’s report – a hearsay layer. The stakes just remind her she needs *more direct* evidence, not that the justification threshold changed."  
      **Concede:** Testimonial evidence can be weaker than direct evidence.  
      **Hold:** The case specifies their evidence is "essentially the same" report (same content). If the inspector’s direct engagement with the report gives her knowledge, the manager’s testimonial receipt of the *same conclusions* should transmit knowledge *if the threshold hasn’t changed*. Stakes explain why it doesn’t.  
      **2-Minute Reply:** "Set up the case carefully: Suppose the manager reads the *identical* engineering report as the inspector, plus the sign-off. If stakes were low for her too, she’d know! But because stakes are high, that same evidence + testimony isn’t enough. The sign-off adds evidence, yet she *still* doesn’t know – stakes raised the bar. Delegation highlights that testimony transmits *justification*, but the recipient’s stakes determine if it reaches knowledge."  
      **Soft Spot:** Relies on intuition that testimony + report = more evidence than report alone.  

  ---

  #### **The Objection I Hope Nobody Asks**  
  **The Abominable Conjunction (Radical Skeptic or Sharp-Eyed Invariantist)**  
  **Why Dangerous:** Forces you to explicitly deny a powerful intuitive closure principle, making your view seem ad hoc or anti-intellectual.  
  **Objection Phrased:** "Consider your high-stakes manager. She believes truly, based on good evidence, that the scaffold is safe (p). She also believes (truly, based on obvious logic) that if the scaffold is safe, then her children won’t be orphaned by its collapse (p → q). But on your view, she doesn’t know p (due to high stakes), hence she doesn’t know q by closure. Yet q is *incredibly* high-stakes! Does she need *more* evidence to know her kids are safe than she does for p? This seems absurd, and it either destroys closure or forces infinite regress."  

  **Best Available Answer:**  
  1.  **Concede:** Closure for knowledge under known entailment fails in high-stakes cases on my view.  
  2.  **Hold:** Closure is a *regulative ideal* for ideal epistemic agents, not an exceptionless rule for non-ideal, practically situated agents. High stakes create localized, practical pressures that can break the chain.  
  3.  **Reply:** "This is a cost, but it reflects a deep truth: Practical urgency can *compartmentalize* our epistemic focus. The manager *can* know q (her kids are safe) directly via other means (e.g., knowing they are at school), without needing to know p. Her high stakes in p force her to treat p as *open*, blocking knowledge-based inference from p to q. But this doesn’t infect her knowledge of q via other routes. Closure fails here because knowledge isn’t just about truth-preservation; it’s about having justification *adequate to the practical demands of the specific proposition in question*. The stakes on q don’t raise the threshold for knowing p; they make p’s uncertainty practically salient in a way that blocks *inferring* q *from p*."  
  4.  **Soft Spot:** Denying closure is deeply counterintuitive to many. Makes knowledge seem fragmented.  

  ---

  **Post-Colloquium Assessment:**  
  *   **Does the moderate view survive intact?** **Barely, but wounded.**  
      *   **Strengths:** The Delegation Problem lands effectively against invariantism and contextualism. The core intuition (stakes affect rational actionability, and knowledge is the norm for action) resonates.  
      *   **Vulnerabilities:** The **Threshold Problem** (#1) and the **Abominable Conjunction** expose deep tensions. Conceding threshold vagueness and closure failure weakens the view’s intuitive and theoretical appeal. The decision theorist’s challenge (#3) remains potent if the audience rejects knowledge as the norm of action.  
  *   **Should I retreat?** **Not fully, but strategically refine.**  
      *   Hold the line on the **Delegation Problem** as the key motivation.  
      *   Retreat from claiming stakes *directly* set thresholds to a *modest claim*: "Stakes reveal that knowledge-level justification must be *practically adequate*, and adequacy varies with context. I lack a reductive theory of ‘adequacy’, but neither do my rivals for ‘sufficiency’."  
      *   Explicitly **surrender closure** in high-stakes cases as a bullet worth biting to preserve the action-knowledge link. Frame it as "knowledge for practical reasoning isn’t always deductively closed."  
      *   **Conclusion:** The view survives as a defensible (if messy) position, but the colloquium highlights that "moderate" encroachment still carries significant theoretical costs. Focus on its explanatory power for institutional epistemology.
