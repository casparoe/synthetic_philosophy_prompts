prompt: |-
  I'm taking a course on political obligation and civil disobedience and there's this analogie that keeps coming up in discussion: people say being bound to obey law is like being part of a family you never chose, where loyalty isn't transactional, and civil disobediance is like a teenager refusing to do chores but still coming home for thanksgiving -- it breaks a specific rule without dissolving the underlying bond. My study group uses this to argue that real protest should stay "within the family," meaning respectful and non-revolutionary, rather than trying to exit the relationship entirely.

  Can you audit how far this holds? Give me the correspondence table -- what maps to the parents, the siblings, the household rules, the chore-refusal, the thanksgiving attendance, and the bond that survives it -- then the places the mapping clearly breaks. For instance, can you actually "leave home" in the same way you can emigrate? Does the analogie smuggle in hierarchical authority that liberal consent theories reject? And does the conclusion -- that disobediance should be respectful and internal rather than revolutionary -- actually follow from the family framing, or was the framing doing all the work?

  Please separate what's settled (like the fact that consent-based theories generally reject non-voluntary family-style obligations) from what's genuinely contested (like whether associative obligations can exist without explicit agreement), and don't present a contested view as the consensus. Answer in American English, please.
