  ### Tranquilist Intervention Decision Procedure (TIC)  
  *Strict tranquilist framework: Only intrinsic goods are absence of suffering (first-order) and absence of craving (first-order, second-order, latent). All other values are instrumental.*

  **Operational Definitions**  
  - **First-order suffering (FoS)**: Present, consciously experienced distress (e.g., pain, nausea, anxiety). Measured via self-report or clinical signs (grimacing, tachycardia).  
  - **First-order craving (FoC)**: Present desire for reality to differ, including:  
    - *Appetitive craving*: Desire for an absent object/state (e.g., wanting food, an event).  
    - *Aversive craving*: Desire to remove a present object/state (e.g., wanting a tube removed).  
  - **Second-order craving (SoC)**: Desire about one’s own first-order mental states (e.g., "I crave to stop craving X," or "I crave to keep craving Y"). Requires explicit expression (current or prior advance directive).  
  - **Latent craving/disposition (LC)**: Non-manifest tendency to develop FoS or craving if conditions change (e.g., potential suffering if sedation lifts in an unconscious patient). Exists if clinical evidence indicates >10% chance of future consciousness/awareness.  
  - **Net Tranquilist Balance (NTB)**: Aggregated impact of intervention on FoS, FoC, SoC, and LC:  
    - **Positive NTB**: Reduces ≥1 dimension without increasing others.  
    - **Negative NTB**: Increases ≥1 dimension without reducing others.  
    - **Ambiguous NTB**: Mixed effects (reductions and increases) or unresolved SoC conflicts.  

  **Decision Flow**  
  *For any proposed intervention, proceed stepwise. Answer questions factually unless specified. Use clinical evidence; if insufficient, default to "absent/unclear."*

  1. **Step 1: Assess Current FoS and FoC**  
     (i) *Question*: Does the patient exhibit *current* first-order suffering (FoS) or first-order craving (FoC)?  
     (ii) *Sufficient answer*:  
       - FoS: Patient reports distress or shows clinical signs (e.g., pain score ≥1/10).  
       - FoC: Patient expresses desire for change (e.g., "I want X removed," "I wish Y were here").  
       - If unconscious/sedated without signs: "Absent."  
     (iii) *Type*: Factual/clinical.  
     (iv) *Next branch*:  
       - If **present** → Proceed to Step 2.  
       - If **absent** → Proceed to Step 3.  

  2. **Step 2: Impact on Current FoS/FoC**  
     (i) *Question*: How does the intervention alter *current* FoS and FoC?  
     (ii) *Sufficient answer*: Estimate change (decrease, increase, no change) for each. If intervention eliminates consciousness (e.g., sedation), FoS/FoC = "decrease to absent."  
     (iii) *Type*: Clinical/predictive.  
     (iv) *Next branch*: → Proceed to Step 4.  

  3. **Step 3: Check Latent Craving (LC)**  
     (i) *Question*: Does the patient have latent dispositions (LC) to develop FoS or craving if conditions change?  
     (ii) *Sufficient answer*:  
       - LC "present" if: Unconscious but prognosis allows >10% chance of regaining consciousness, OR condition may flare (e.g., untreated pain if medication stops).  
       - LC "absent" if: Permanent unconsciousness (e.g., irreversible brain injury) OR death imminent (<24h) regardless of intervention.  
     (iii) *Type*: Clinical/prognostic.  
     (iv) *Next branch*:  
       - If **present** → Proceed to Step 4.  
       - If **absent** → Proceed to Step 5.  

  4. **Step 4: Impact on Latent Craving (LC)**  
     (i) *Question*: How does the intervention alter latent craving (LC)?  
     (ii) *Sufficient answer*: Estimate change (decrease, increase, no change) in likelihood/severity of future FoS/FoC.  
     (iii) *Type*: Clinical/predictive.  
     (iv) *Next branch*: → Proceed to Step 5.  

  5. **Step 5: Identify Second-Order Craving (SoC)**  
     (i) *Question*: Does the patient have a *relevant* second-order craving (SoC) about their FoS/FoC?  
     (ii) *Sufficient answer*: "Present" only if:  
       - Patient explicitly stated/recorded a desire about their mental states (e.g., advance directive: "I want to stop suffering," or "I value my craving for life").  
       - If no clear evidence, or patient cannot communicate: "Absent."  
     (iii) *Type*: Values-based (patient’s expressed preferences). *Judgment call*: Relies on interpreting patient’s prior statements.  
     (iv) *Next branch*:  
       - If **present** → Proceed to Step 6.  
       - If **absent** → Proceed to Step 7.  

  6. **Step 6: Impact on SoC**  
     (i) *Question*: How does the intervention alter the identified SoC?  
     (ii) *Sufficient answer*:  
       - If SoC is *for reduction of FoS/FoC*: Satisfying it (e.g., reducing suffering) = "decrease SoC"; frustrating it = "increase SoC."  
       - If SoC is *for preservation of craving* (e.g., "I crave to keep my will to live"): Satisfying it (e.g., preserving craving) = "increase craving" (negative); frustrating it = "decrease craving" (positive).  
     (iii) *Type*: Values-based/predictive. *Judgment call*: Requires inferring causality between intervention and SoC satisfaction/frustration.  
     (iv) *Next branch*: → Proceed to Step 7.  

  7. **Step 7: Calculate Net Tranquilist Balance (NTB)**  
     (i) *Question*: What is the net effect on FoS, FoC, LC, and SoC?  
     (ii) *Sufficient answer*:  
       - **Positive NTB**: Intervention decreases ≥1 dimension without increasing others.  
       - **Negative NTB**: Intervention increases ≥1 dimension without decreasing others.  
       - **Ambiguous NTB**: Mixed effects (e.g., decreases FoS but increases FoC) OR unresolved conflict in SoC (e.g., intervention frustrates a preservation-of-craving SoC).  
     (iii) *Type*: Clinical/values-based synthesis. *Judgment call*: Requires weighing changes; magnitudes not quantified.  
     (iv) *Next branch*:  
       - If **Positive NTB** → Stop: **Recommend intervention**.  
       - If **Negative NTB** → Stop: **Recommend against intervention**.  
       - If **Ambiguous NTB** → Proceed to Step 8.  

  8. **Step 8: Non-Tranquilist Handoff**  
     (i) *Question*: Is tranquilism silent due to ambiguous NTB?  
     (ii) *Sufficient answer*: Always "yes" if proceeding from Step 7.  
     (iii) *Type*: Procedural.  
     (iv) *Next branch*: **Hand off decision**. Tranquilism is silent when:  
       - Effects conflict (e.g., reduces FoS but increases FoC).  
       - SoC cannot be resolved (e.g., frustrating a preservation-of-craving SoC has unclear net impact).  
       - *Reason*: Tranquilism only values absence of suffering/craving; it lacks tools to weigh trade-offs or incorporate non-intrinsic values (e.g., autonomy, relationships).  

  **Mechanical Misfire Warning**  
  - **Case type**: A conscious patient has high FoS (pain) and a strong SoC to preserve their FoC for life (e.g., "I crave to keep my desire to live, even with suffering"). Palliative sedation eliminates FoS, FoC, and SoC but overrides the SoC.  
  - **Tranquilist recommendation**: Sedation (Positive NTB: reduces all dimensions).  
  - **Conflict with intuition**: Clinicians may reject this as violating autonomy or dignity (non-intrinsic values).  
  - **Why framework demands it**: Tranquilism prioritizes eliminating suffering/craving; preserving a "craving for craving" still perpetuates intrinsic evil.  

  ---  
  ### Application to Cases  
  **Case A: Conscious terminal patient requests withdrawal of artificial hydration. No FoS, but intense appetitive FoC for future event. Withdrawal hastens death.**  
  - **Step 1**: FoC present (appetitive craving for event). → Proceed to Step 2.  
  - **Step 2**: Withdrawal eliminates FoC (death). → Proceed to Step 4.  
  - **Step 4**: Withdrawal eliminates LC (no future states). → Proceed to Step 5.  
  - **Step 5**: No SoC stated. → Proceed to Step 7.  
  - **Step 7**: NTB = Positive (reduces FoC and LC). → **Recommend intervention (withdraw hydration)**.  
  - **Handoff**: None.  
  - **Misfire risk**: None. Tranquilism supports eliminating craving, even via death.  

  **Case B: Deeply sedated patient on respiratory-suppressing infusion. Family requests continuation for relational presence. Discontinuation causes painless death.**  
  - **Step 1**: FoS/FoC absent (unconscious). → Proceed to Step 3.  
  - **Step 3**: LC absent (no recovery possible; death imminent). → Proceed to Step 5.  
  - **Step 5**: No SoC stated. → Proceed to Step 7.  
  - **Step 7**: NTB = Ambiguous.  
    - Continuation: No change (unconsciousness maintains absence of FoS/FoC/LC).  
    - Discontinuation: No change (death maintains absence).  
    → Proceed to Step 8.  
  - **Step 8**: **Hand off to family/guardian**. Tranquilism is silent (both options yield identical absence of suffering/craving).  
  - **Misfire risk**: None. Handoff is explicit.  

  **Case C: Loud music in dementia ward. Reduces FoC in 70% but causes FoS (headache) in 30%. Unpredictable individual response.**  
  - **Step 1**: Assume FoC present (wandering indicates craving). → Proceed to Step 2.  
  - **Step 2**: Mixed effects:  
    - 70%: FoC decreases (reduced wandering).  
    - 30%: FoS increases (headache).  
    → Proceed to Step 4.  
  - **Step 4**: No LC impact (intervention doesn’t alter consciousness). → Proceed to Step 5.  
  - **Step 5**: No SoC data. → Proceed to Step 7.  
  - **Step 7**: NTB = Ambiguous (reduces FoC in some, increases FoS in others). → Proceed to Step 8.  
  - **Step 8**: **Hand off to institutional policy/guardian**. Tranquilism cannot resolve trade-offs.  
  - **Misfire risk**: Procedure ignores potential instrumental benefits (e.g., reduced falls from wandering). Tranquilism only cares about direct FoS/FoC impact.
