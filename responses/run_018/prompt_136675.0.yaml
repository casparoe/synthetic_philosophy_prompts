  **Tranquilist Intervention Checklist (TIC)**

  **Step 1: Current Suffering and Craving**
     (i) Does the patient currently experience first-order suffering (FoS) or first-order craving (FoC)? 
     (ii) FoS: any present distress; FoC: any present desire for things to be different (appetitive or aversive). If unconscious and no signs of distress, then absent.
