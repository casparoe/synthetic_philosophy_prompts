     (iii) Clinical, factual, predictive.
     (iv) Go to Step 4.

  **Step 3: Latent Craving Check**
     (i) Are there latent dispositions to suffer or crave (LC) that would manifest if conditions change?
     (ii) LC exists if there is a non-negligible chance the patient will experience FoS or FoC in the future without the intervention or with a change in condition.
     (iii) Clinical and factual.
     (iv) If present: go to Step 4. If absent: go to Step 5.

  **Step 4: Impact on Latent Craving (LC)**
     (i) How will the intervention change the potential for future suffering or craving (LC)?
