prompt: |-
  I am a software engineer with no formal background in philosophy, and I am assisting a colleague in drafting the final examination for an upper-level seminar on death, value, and intergenerational obligation. I need one essay question that a well-prepared student could answer in 90 minutes. The question should center on Samuel Scheffler's argument in Death and the Afterlife (2013)—derived from his 2012 Tanner Lectures delivered at the University of California, Berkeley—that human extinction is a profound loss not merely because of the deaths involved, but because so much of what we currently value depends on what he terms the collective afterlife: the continuation of human life and activity long after our own deaths. To keep the question from being answered by rote summary, please embed a specific hypothetical: imagine that human extinction is immediately followed by the emergence of a non-biological successor civilization that preserves, understands, and actively continues every human cultural, scientific, and artistic project with perfect fidelity, yet contains no biological humans. The exam prompt should ask students to determine whether Scheffler's reasoning still condemns extinction in this scenario, or whether his argument tacitly requires biological continuity rather than mere persistence of value. Provide a model answer and a marking scheme built around five essential analytical moves that a top answer must make, assigning marks to each so that the total is 20, together with a brief one-line note on the standard misconception or error that should cost marks on each point. Do not ask for bibliographies, reading lists, or citations in either the question or the answer key; the assessment should be fully answerable without web access. Keep the framing grounded in the core argument and the injected hypothetical, without appealing to obscure secondary literature.
