  ## BUREAU OF CONSTITUTIONAL MATCHING (BCM)  
  **DEPARTMENT OF IDEOLOGICAL HARMONIZATION**  
  **LIBERTY COMPATIBILITY PACKET (FORM LCP-7 Rev. 4.2)**  

  **MANDATORY NOTICE:** Per Directive 114.7 (Harmonized Freedoms Act), all citizens must undergo triennial Liberty Compatibility Assessment and select an approved Liberty Package Option (LPO) consistent with Constitutional Well-Being Metrics. Failure to comply constitutes a Tier 3 Harmonization Deficit. Submission implies consent to Continuous Ideological Alignment Monitoring.  

  **PURPOSE:** This packet ensures your lived experience aligns optimally with one (1) state-sanctioned operationalization of liberty, maximizing societal efficiency and minimizing conceptual dissonance. Select the LPO best reflecting your tolerance for interference, capacity-building dependency, and ocular stability vis-à-vis authority figures.  

  ---

  **SECTION A: LIBERTY PACKAGE OPTIONS (Select ONE Only)**  

  *   **OPTION 1: NEGATIVE LIBERTY GUARANTEE (NLG)**  
      *   **Description:** Maximizes your "freedom from." State guarantees minimal interference in designated private spheres (Zones A-17 through D-9; see Annex Γ). State action is primarily reactive, triggered by verifiable infringements by other agents. Your obligations are minimized to non-interference with others' similarly designated spheres.  
      *   **Ideal Citizen Profile:** Values solitude, self-reliance, and clear boundaries. Comfortable with significant disparities in resources/power, provided no direct coercion occurs. Views state capacity-building as suspect.  
      *   **Vulnerability Disclosure (Per BCM Transparency Mandate):** *May inadequately address power asymmetries enabling de facto coercion (e.g., economic desperation forcing acceptance of unfavorable terms). Does not audit for non-interfering but potentially oppressive social/structural conditions. The "Sphere Map" is fixed and may not reflect evolving relational dynamics.*  

  *   **OPTION 2: POSITIVE LIBERTY ENABLEMENT (PLE)**  
      *   **Description:** Maximizes your "freedom to." State actively facilitates realization of your Rational Self's potential through capacity-building programs (Education Tiers 1-4, Skills Acquisition Grants, Mandatory Well-Being Workshops). Focuses on removing internal/external barriers to self-mastery and rational life goals.  
      *   **Ideal Citizen Profile:** Values state support for personal development, believes in a defined "higher self" achievable through structured programs. Accepts guidance for rational self-actualization.  
      *   **Vulnerability Disclosure (Per BCM Transparency Mandate):** *State-defined "Rational Self" and "Potential" parameters may supersede individual conceptions (Paternalism Risk). Mandatory workshops may constitute indirect coercion. "Barrier Removal" can justify significant intervention in personal choices deemed irrational.*  

  *   **OPTION 3: REPUBLICAN NON-DOMINATION ASSURANCE (RNA)**  
      *   **Description:** Maximizes freedom as non-domination. Focuses on eliminating arbitrary power, regardless of its exercise. Guarantees you can look any relevant official or powerful agent in the eye without fear of arbitrary interference ("The Eyeball Test"). Requires robust institutional constraints on discretionary authority and power-checking mechanisms.  
      *   **Ideal Citizen Profile:** Values civic equality and institutional fairness above absolute non-interference or state-facilitated self-mastery. Highly sensitive to power imbalances and potential for arbitrary action, even if benign.  
      *   **Vulnerability Disclosure (Per BCM Transparency Mandate):** *Requires constant, resource-intensive institutional vigilance against arbitrary power ("Vigilance Fatigue"). Defining "arbitrary" and "relevant power" can be complex and contested. The Eyeball Test is subjective and requires citizen confidence potentially undermined by systemic inequalities.*  

  ---

  **SECTION B: MANDATORY ARBITRARINESS AUDIT**  
  *(Rate each statement 1 (Strongly Disagree) to 5 (Strongly Agree))*  

  1.  **Direct Coercion Metric (NLG Focus):** "I experience minimal direct commands or prohibitions enforced by the state or other agents within my designated private spheres."  
      `[__] 1  [__] 2  [__] 3  [__] 4  [__] 5`  
  2.  **Capacity-Building Metric (PLE Focus):** "I feel the state provides adequate programs and resources to help me overcome barriers and achieve my recognized potential."  
      `[__] 1  [__] 2  [__] 3  [__] 4  [__] 5`  
  3.  **Eyeball Test Metric (RNA Focus):** "I believe I can look any official or relevant powerful agent (e.g., employer, creditor) directly in the eye without fear that they could arbitrarily interfere in my choices or status, even if they currently choose not to."  
      `[__] 1  [__] 2  [__] 3  [__] 4  [__] 5`  

  **Audit Analysis Note:** Discrepancies between your LPO selection and Audit scores may trigger a Mandatory Reconciliation Interview (Form MRI-12).

  ---

  **SECTION C: ILLUSTRATIVE CASE STUDY (Applicant 7-G)**  
  *Demonstrating Liberty Package Compatibility Assessment*

  *   **Scenario:** Applicant 7-G sought retraining via the State Skills Grant Program (SSGP). She was awarded a grant for Data Analysis Certification (DAC), aligning with her stated goals.
  *   **NLG Audit:** **PASSED.** No direct coercion occurred. The grant was offered; acceptance was formally voluntary. Private sphere (career choice) non-interference maintained.
  *   **PLE Audit:** **PASSED (Platinum Tier).** State actively facilitated capacity-building by funding relevant skills enhancement. Barrier (cost) removed. Rational self-development supported.
  *   **RNA Audit: FAILED.** The SSGP Case Officer possessed unilateral, discretionary authority to assign applicants to *any* available course (DAC, Floristry Basics, Advanced Cobbling, etc.) based on opaque "system needs" criteria. While Officer assigned DAC benevolently, they *could* have arbitrarily assigned Floristry Basics instead. Applicant 7-G could not look the Case Officer in the eye without underlying fear of this arbitrary power. **Domination existed structurally via discretionary authority, despite non-exercise and positive outcome.**
  *   **BCM Determination:** Applicant 7-G was assigned **RNA Package** with a Mandatory Institutional Vigilance Upgrade (IVU) requirement targeting SSGP discretionary protocols. NLG/PLE compatibility insufficient due to RNA failure.

  ---

  **SUBMISSION INSTRUCTIONS:**  
  1.  Complete Sections A & B.  
  2.  Attach LCP-7 to your Annual Civic Alignment Dossier (Form CAD-1).  
  3.  Retain pink copy for your records. Gold copy must be submitted to District Harmonization Hub.  

  **FINAL ADVISORY:** Your selected Liberty Package determines your relationship to state power, resource allocation eligibility, and civic participation parameters. Choose wisely. Remember, true freedom lies in compatible alignment. Non-optional voluntary participation ensures collective liberty optimization.  

  **BUREAU OF CONSTITUTIONAL MATCHING: ENSURING YOUR FREEDOM FITS.**  
  *(Approved for Distribution by the Office of Conceptual Sanitization, Ref: OCS/LibCompat/114.7)*
