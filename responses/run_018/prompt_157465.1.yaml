  1.4. Counterfactual reasoning (e.g., "What if Germany had acted differently?") is essential for assessing responsibility, but the camps differ on what counterfactuals are plausible.

  1.5. The outbreak of WWI was overdetermined by multiple factors, including the alliance system, arms races, and the actions of several states.

