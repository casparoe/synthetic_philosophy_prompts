  | **Focus of analysis** | The central question is whether Germany had counterfactual institutional agency in 1914. | The focus should be on mapping distributed causal contributions across the international system. |

  **3. Cruxes**

  We identify two cruxes that are fundamental to the disagreement:

  **Crux 1: Moral Agency vs. Obligation**

  - **Question**: Does holding a nation responsible require treating it as a moral agent, or can it be based solely on assigning repair obligations for causal contributions?
  - **Camp 1**: Requires treating it as a moral agent because responsibility implies agency and choice.
  - **Camp 2**: Does not require moral agency; obligations can arise from causation without anthropomorphizing the state.
  - **What bears on it**: Conceptual arguments about collective agency and moral responsibility; historical evidence about the decision-making process in Germany (e.g., the coherence of institutions and the ability to form and execute intentions).
  - **Predictions**:
    - *Camp 1*: Evidence of centralized decision-making and consideration of alternatives will support Germany's institutional agency.
    - *Camp 2*: Even with centralized decision-making, moral agency remains at the individual level; obligations should be assigned based on causal role.

  **Crux 2: Necessity of National Blame**

  - **Question**: Is assigning blame to a nation-state necessary for historical understanding and repair obligations?
  - **Camp 1**: Yes, it is necessary for identifying the pivotal actor and for grounding obligations.
  - **Camp 2**: No, it is neither necessary nor desirable; system-based scalar assessment is superior.
  - **What bears on it**: Historical case studies (like the Treaty of Versailles) and their consequences; conceptual arguments about the purposes of historical explanation and reparations.
  - **Predictions**:
    - *Camp 1*: The Treaty of Versailles' assignment of blame to Germany will be seen as a necessary (if flawed) recognition of Germany's central role and a basis for reparations.
