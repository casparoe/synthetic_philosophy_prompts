  I was reading about Gödel's cosmological model in some old physics-philosophy forum and got confused about the time-travel part. People always say his rotating universe has closed timelike curves, so you could go back and meet your past self. But Gödel himself apparently thought time was kind of an illusion and that the universe is static in some deep sense. So here's what I'm trying to figure out: is the conceptual problem that his metric allows loops in physical spacetime, but his philosophical view denies any real 'passage' of time? Or is it deeper—like, even if local observers experience duration, the global topology means there's no consistent way to slice the universe into 'past' and 'future' everywhere at once?

  Can you explain the specific conceptual tension between Gödel's rotating-universe soltion (with those closed timelike curves) and his Platonist idea that objective reality is timeless? I'm not asking for a biography or a list of papers. I want to understand whether the closed loops in his cosmology actually threaten his view that time isn't real, or if they actually support it by showing that temporal ordering is just a local convention with no global backbone. Also, I keep seeing people conflate his mathematical result with sci-fi time travel—can you clarify why the loops in his metrc don't necessarily imply that an observer could causally influence their own earlier state in the way people imagine, maybe because of the global constraints on causlity? Try to keep it conceptual rather than just running through the equations, though feel free to reference the metric structure if it helps the intuition.
