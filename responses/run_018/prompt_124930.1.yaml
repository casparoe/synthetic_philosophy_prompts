answer: |-
  **Republic of Ordinalia Electoral Compliance Manual (Rev. 7.2α)**

  1.  **Constitutional Foundation:** Pursuant to Article I of the Ordinalian Constitution, all elections involving three (3) or more distinct alternatives (hereafter "Candidates") must satisfy the following immutable criteria simultaneously:
      1.1. **Strategy-Proofness:** No Elector shall derive benefit from submitting a preference ordering differing from their sincere, private, ordinal ranking (True Preference State, TPS).
      1.2. **Non-Dictatorship:** No single Elector, nor any pre-defined subset of Electors constituting fewer than the totality, shall possess decisive control over the electoral outcome across all conceivable preference profiles.
      1.3. **Unrestricted Domain:** The electoral mechanism must accept and process any logically possible strict preference ordering over the full set of Candidates submitted by any registered Elector.

  2.  **Preference Registration & Harmonization:**
      2.1. All Electors must declare their TPS via **Form 9-C: Affidavit of Non-Manipulative Intent (ANMI)** no fewer than forty-five (45) days prior to any scheduled Election Day. Submission constitutes legally binding declaration under penalty of Perjury of Preference (Sec. 12.3).
      2.2. The **Pre-Preference Harmonization Office (PPHO)** shall analyze all submitted ANMIs to determine the feasibility of conducting an election satisfying Clauses 1.1-1.3 given the *de facto* distribution of declared TPS profiles.
      2.3. Should PPHO analysis (utilizing Ordinalia Standard Algorithm OS-7δ) predict a violation of Clause 1.1 or 1.2 under the declared domain, the PPHO is authorized to invoke Harmonization Protocol Gamma.
          2.3.1. Harmonization Protocol Gamma entails the strategic elimination of Candidates until precisely two (2) alternatives remain, ensuring the resultant binary choice inherently satisfies Clauses 1.1 and 1.2 for the *restricted* domain.
          2.3.2. Elimination criteria are determined by PPHO internal metrics (e.g., Surjectivity Deficiency Score, Potential Manipulation Index) and are non-appealable. Public rationale cites "operational necessity for constitutional compliance."

  3.  **Strategic Intent Enforcement:**
      3.1. The **Strategic Intent Tribunal (SIT)** possesses jurisdiction over all post-election analysis and auditing concerning potential violations of Clause 1.1.
      3.2. Any Elector whose cast ballot preference ordering demonstrably differs from their registered ANMI (TPS) is subject to SIT investigation.
      3.3. Electors found liable for Strategic Misrepresentation (SIT Violation Code 1A) face mandatory retraining and fines calibrated to the Measured Manipulation Magnitude (MMM) of their deviation. Repeat offenses may incur ballot suspension.
      3.4. SIT maintains that rigorous enforcement of TPS adherence via the ANMI system renders the *mechanism itself* strategy-proof *ex ante*, satisfying Clause 1.1 administratively.

  4.  **Contingency Protocols & Legitimacy Preservation:**
      4.1. In the statistically improbable event that Harmonization Protocol Gamma cannot reduce the Candidate set to two (2) without inducing a measurable Surjectivity Crisis (failure of Clause 1.3 for the restricted set), or if a pre-election SIT injunction paralyzes the process, the **Emergency Benevolent Dictator (EBD) Protocol** is activated.
      4.2. The EBD is selected via a deterministic, publicly verifiable lottery from the roster of citizens holding Advanced Certification in Constitutional Paradox Resolution (ACCPR).
      4.3. The designated EBD shall assume electoral decision-making authority for the specific contest in question. Their selection is final and non-reviewable.
      4.4. The EBD mechanism satisfies Clause 1.2 (Non-Dictatorship) *across the totality of elections* due to the stochastic nature of the lottery, ensuring no single individual is dictator for *all* possible electoral instances. It satisfies Clause 1.1 (Strategy-Proofness) as Electors possess no feasible strategy to influence the EBD lottery outcome via their preferences. Clause 1.3 (Unrestricted Domain) is maintained as the EBD mechanism formally accepts all inputs, though outputs are determined solely by the EBD.
      4.5. EBD decisions are recorded as "Constitutionally Necessary Democratic Outcomes" (CNDO) and carry full legal weight.

  5.  **Compliance Certification:** The Office of Electoral Theorems (OET) shall issue a post-election **Certificate of Gibbard-Satterthwaite Adherence (CGSA)** for every contest, detailing the mechanisms employed (Harmonization, SIT Enforcement, EBD Activation) and their alignment with the constitutional mandates of Article I. The CGSA is the sole determinant of electoral validity.

  **Verdict:** The Republic of Ordinalia maintains perfect constitutional compliance by bureaucratically precluding the conditions the theorem proves impossible, judicially penalizing the strategic behavior it proves inevitable, and stochastically rotating the dictatorship it proves unavoidable.
