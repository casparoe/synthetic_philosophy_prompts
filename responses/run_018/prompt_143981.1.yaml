answer: |-
  Your analysis captures a sophisticated and ethically significant maneuver that lacks a universally accepted name, but can be mapped to several established concepts. Below is a breakdown of the dynamic, its philosophical context, and potential terminology:

  ---

  ### **Core Dynamic: "Recursive Boundary Reinforcement"**
  The pattern involves **defending an absolute normative boundary (lexical incommensurability) by recursively reclassifying borderline cases into the protected category**. Each intermediate harm is taxonomically absorbed rather than placed on a spectrum, rendering the boundary "unfalsifiable" by empirical or intuitive counterexamples.

  ---

  ### **Closest Established Concepts**
  1. **Immunization Strategy (Lakatosian)**  
     From philosophy of science (Imre Lakatos), this refers to modifying auxiliary hypotheses to protect a "hard core" theory from falsification. Here, the "hard core" is the lexical boundary, and taxonomic reclassification acts as the auxiliary adjustment.  
     *Why it fits*: The absolute non-compensability claim survives untouched by redefining what counts as "extreme suffering."  
     *Limitation*: Lakatos focused on scientific theories, not normative boundaries.

  2. **Conceptual Gerrymandering (Blackburn/Nozick)**  
     Simon Blackburn critiques moral theories that "gerrymander" definitions to avoid counterexamples. Robert Nozick’s notion of "moral push" (reclassifying cases to preserve intuitions) also resonates.  
     *Why it fits*: The proponent redraws conceptual borders ("kind of harm," "structural feature") to absorb challenges.  
     *Limitation*: Less specific to incommensurability debates.

  3. **Domain Expansion of Moral Categories**  
     In moral psychology (e.g., Paul Rozin), "domain expansion" occurs when a category (e.g., "harm") broadens to include new cases. Here, it’s *defensive*: expanding the "lexical harm" category to neutralize counterexamples.  
     *Why it fits*: The category’s boundary shifts to maintain its normative priority.  
     *Limitation*: Usually descriptive, not critical.

  ---

  ### **Proposed Terminology**
  Given gaps in existing terms, the dynamic might be termed:  
  - **Recursive Boundary Reinforcement**: Emphasizes the taxonomic recursion fortifying the boundary.  
  - **Lexical Shielding**: Highlights protection of incommensurability via reclassification.  
  - **Subsumptive Immunization**: Combines taxonomic subsumption with Lakatosian defense.

  ---

  ### **Key Features & Boundaries**
  1. **Requires a Normative Absolute**  
     The target must be an inviolable boundary (e.g., lexical threshold, sacred value). It cannot occur in purely scalar frameworks (e.g., utilitarianism without lexical levels).

  2. **Mechanism: Taxonomic Recursion**  
     Differs from simple "concept creep" by *sharpening distinctions within the category* (e.g., "True suffering requires feature X" → intermediate cases are argued to possess X).  
     Contrast: A "slippery slope" argument fears boundary erosion; this tactic *prevents* erosion by recalibrating the boundary.

  3. **Broader Manifestations**  
     This can arise in:  
     - **Deontological Ethics**: E.g., redefining "personhood" to protect absolute rights.  
     - **Human Rights**: "Torture" expanded to include structural deprivation.  
     - **Climate Ethics**: Catastrophic risks deemed "incommensurable" with costs, with borderline cases (e.g., slow-onset disasters) reclassified as catastrophic.

  ---

  ### **Philosophers Engaging This Dynamic**
  - **Derek Parfit**: Critiqued lexical views in *Reasons and Persons*, noting how thresholds become arbitrary when faced with spectrum arguments.  
  - **Amartya Sen**: Examined incommensurability in *On Ethics and Economics*, warning against "tyranny" of rigid categories.  
  - **Elizabeth Anderson**: In *Value in Ethics and Economics*, she argues such maneuvers reflect a "failure of pluralist valuation," substituting taxonomy for deliberation.

  ---

  ### **Conclusion**
  While no single term perfectly captures this, **"recursive boundary reinforcement"** or **"lexical shielding"** best describes the dynamic. It is a form of **immunization strategy applied to normative absolutes**, distinguished by its reliance on taxonomic recursion to absorb counterexamples. Its edges are defined by:  
  - A commitment to incommensurability,  
  - Recursive subcategorization of experiences,  
  - The goal of rendering a normative boundary empirically unfalsifiable.  

  This maneuver risks **moral evasion**: by refusing to weigh intermediate harms, it may ignore remediable suffering that falls short of the (now-expanded) "absolute" category.
