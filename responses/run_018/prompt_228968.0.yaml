  *Start at Question 1.*  

  **Question 1: Initial Split**  
  *"If a belief is justified, must its justification ALWAYS depend on at least one other justified belief? Or can some beliefs be 'self-standing'—justified without relying on others?"*  
  - **Self-standing beliefs exist** → Go to Question 2 *(Foundationalism)*  
  - **Justification ALWAYS depends on other beliefs** → Go to Question 3 *(Regress options)*  

  ---  
  **Question 2: Foundationalism Split**  
  *"For a self-standing belief (e.g., 'I feel pain' or '2+2=4'), must it be absolutely certain—impossible to doubt—to justify other beliefs? Or can it be merely probable (e.g., 'I see a red apple' under good lighting)?"*  
  - **Must be certain** → **Classical Foundationalism** (e.g., Descartes; indubitable foundations).  
  - **Can be merely probable** → **Modest (Fallibilist) Foundationalism** (e.g., Peirce; basic beliefs are defeasible).  

  ---  
  **Question 3: Handling the Regress**  
  *"If every belief needs another for justification, does this chain require a loop (A→B→C→A), an infinite series (A→B→C→…), or neither?"*  
  - **Requires a loop** → Go to Question 4 *(Coherentism)*  
  - **Requires an infinite series** → **Infinitism** (e.g., Klein; justification demands endless reasons, like a fractal).  
  - **Neither works** → **Skepticism** (No justification is possible).  

  ---  
  **Question 4: Coherentism Refinement**  
  *"Imagine a loop of beliefs: 'A supports B, B supports C, C supports A.' Now, suppose these beliefs are arbitrary (e.g., 'Trees are purple,' 'Purple is truth,' 'Truth requires trees'). Does this loop work? Or must beliefs also interlock non-arbitrarily (e.g., fitting experiences, explaining patterns)?"*  
  - **Arbitrary loop works** → **Skepticism** (Trivializes justification; any belief can be "justified").  
  - **Must interlock non-arbitrarily** → **Holistic Coherentism** (e.g., Davidson; beliefs justify as a system, like a web).  

  ---  
  ### **Leaf Positions**  
  1. **Classical Foundationalism**: Basic beliefs are certain (e.g., logic, immediate sensations).  
  2. **Modest Foundationalism**: Basic beliefs are probable (e.g., perceptual or inductive truths).  
  3. **Holistic Coherentism**: Beliefs justify mutually via systemic fit (e.g., consistency, explanatory power).  
  4. **Infinitism**: Justification requires endless chains (e.g., each reason demands deeper reasons).  
  5. **Skepticism**: No escape from the regress; justification fails.  

  ---  
  ### **Design Notes**  
  - **Unclean Separation**:  
    - **Infinitism vs. Holistic Coherentism**: Both reject "stopping points," but coherentism requires mutual support *now* (Question 4), while infinitism demands endless *future* reasons (Question 3). The tree forces divergence via the loop/infinity choice.  
    - **Skepticism paths**: Rejecting *all* options (Questions 3–4) or endorsing arbitrary loops (Question 4) both lead here, as both collapse justification.  

  - **Logically Possible but Unattractive/Unheld**:  
    - **"Arbitrary Loop" as non-skeptical**: One could claim arbitrary loops justify (Question 4, first option), but this is universally rejected as *incoherent*—it permits any belief to be "justified" (e.g., a loop of conspiracy theories). Thus, it routes to skepticism.  
    - **Modest Classical Foundationalism**: Combining "probable basics" with "indubitability" is *incoherent*; if basics can be revised, they aren’t indubitable. The tree blocks this via Question 2.  

  - **Why Infinitism Isn’t a Joke**: Question 3 frames it as *principled* (e.g., "endless reasons, like a fractal"), avoiding strawmanning. Students who see depth in "why?" questions often land here.  

  - **Skepticism Placement**: Appears only as a terminal leaf (Questions 3–4), never as a node. Forces engagement with alternatives first.  

  - **Node Count**: 4 questions (6 including answer paths), fitting one page.  

  ---  
  **Flowchart Summary**:  
  ```  
  Question 1  
  │  
  ├─ Self-standing? → Question 2 → Classical OR Modest Foundationalism  
  │  
  └─ Always depends? → Question 3  
      │  
      ├─ Loop? → Question 4 → Holistic Coherentism OR Skepticism  
      │  
      ├─ Infinite? → Infinitism  
      │  
      └─ Neither → Skepticism  
  ```  
  This tree separates key nuances (e.g., fallible vs. infallible foundations; holistic vs. arbitrary loops) while grounding choices in concrete cases. Ideal for sparking debate!
