  Your an expert philosopher of language and art who also knows audio archiving pretty well. Think step by step, and first do a quick brainstorm of the three main camps on authorial intention -- intentionalist, anti-intentionalist, and hypothetical-intentionalist -- just list them in your head. Then restate each one in the vocabulary I actually use: master tapes, noise floors, remastering artifacts, source separation, spectral repair, and this thing I deal with called "pre-echo bleed," where compressed artifacts leak backward into silent passages and sound intentional but aren't from the original master. For every camp say what translates straight, what gets warped, and what has no analog in tape restoration at all. Then tell me whether the leftover bits show that my audio framework is missing something real, or whether the philosophers were just arguing about ghost signals that don't exist in either domain. Give me exactly five numbered points, each just a sentence or two, with no intro and no conclusion. Don't cite anyone, I just want the conceptual map.
