reasoning: |-
  Okay, the user wants me to tackle a conceptual knot in David Lewis's theory of convention. Let me start by recalling Lewis's key points. Conventions require common knowledge and arbitrariness. But in large societies, norms evolve without everyone knowing they're coordinating. The user mentions "silent conventions" where people follow precedents without the common knowledge part. So the main question is whether this breaks Lewis's account or if we can adjust the epistemic condition.

  First, I need to break down Lewis's definition. Common knowledge means everyone knows, knows that others know, and so on. Arbitrariness means there could be alternatives. Now, in anonymous societies, people might follow a norm because it's the status quo without knowing others' expectations. For example, driving on the right side—people do it because it's the rule, not necessarily because they have recursive beliefs about others. 

  So, does this lack of common knowledge invalidate Lewis? Maybe not. The key here is that Lewis's common knowledge might be too strong. Weaker epistemic states could suffice. For instance, mutual belief where most people believe others follow the norm, even without higher-order beliefs. Or even just general awareness and reliance on the precedent. 

  Then there's arbitrariness. In big societies, institutions might enforce norms, making alternatives seem non-arbitrary. But if the norm started as one of many options (like driving side), it's still arbitrary in origin. Even if institutions lock it in, the initial choice was arbitrary. So arbitrariness holds as long as alternatives were possible at some point. 

  The user is concerned about convention collapsing into law. But conventions can exist within legal frameworks. The difference is that laws are codified and enforced, whereas conventions rely on mutual expectations. Even with institutional enforcement, if people follow because of precedent and mutual adjustment, it's still convention. 

  Also, in large groups, common knowledge morphs into distributed knowledge. Not everyone knows everyone, but the structure (like traffic systems) creates shared expectations. So the epistemic condition adapts to the social scale. 

  Bottom line: silent conventions don't break Lewis; they show the model scales with weaker epistemology, while arbitrariness remains through historical contingency.
answer: |-
  **Silent conventions don't break Lewis's account but reveal how his conditions scale and adapt in complex societies, requiring only weakened mutual belief (not full common knowledge) while preserving arbitrariness through historical contingency, not present alternatives.**

  Lewis's core insight is that conventions solve coordination problems via *mutual expectations* reinforced by precedent. In small groups, "common knowledge" (infinite regress of "I know that you know that I know...") realistically emerges. In large anonymous societies, this regress becomes implausible, but the *functional equivalent* holds: agents act based on **salient precedent** and **presumed uniformity**, forming **mutual belief** (not infinite regress) that others will follow the established pattern. When drivers automatically stay right, they rely on observable regularity and institutional cues (road markings, laws), expecting compliance without calculating others' epistemic states. This is "silent" coordination: the epistemic condition weakens to **generalized reliance on a mutually recognized precedent**, sustained by systems broadcasting the norm (e.g., media, infrastructure).

  Arbitrariness remains intact but operates **diachronically**, not synchronically. Lewis requires that *some* alternative *could have* solved the coordination problem initially. Institutional lock-in (e.g., traffic laws) eliminates *current* alternatives, but the convention's origin was arbitrary (driving left vs. right). This historical contingency preserves arbitrariness—it's not that alternatives are *logically impossible now*, but that the precedent's entrenchment makes switching costs prohibitive. Crucially, if a norm emerges *without* such contingent origins (e.g., a biological imperative), it fails arbitrariness and is mere regularity.

  This doesn’t collapse convention into law. Laws *codify* conventions but derive force from state power. Conventions persist where mutual adjustment via precedent remains primary: even if a law mandates driving right, I follow partly because I *expect* others to, and would reconsider if compliance collapsed. The distinction holds: conventions rely on interdependent expectations; laws rely on authority. Institutional design narrows alternatives *because* of the convention’s coordination value, not vice versa. Thus, "silent" conventions stretch but don’t rupture Lewis’s framework—arbitrariness anchors the theory, while epistemology scales to distributed social cognition.
