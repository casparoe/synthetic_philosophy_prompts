  1. **Trivial readings (e.g., Implementation Variance)** don’t engage your ethical challenge.  
  2. **Defensible particularist readings (Holistic Valuation, No Fixed Relevance)** *require* the instructor to specify what contextual factors alter moral relevance between hiring/lending.  
  3. **Radical readings (Anti-Codification)** dismiss consistency demands entirely but risk collapsing into moral arbitrariness.  
  4. **Your challenge stands** unless the instructor defends Anti-Codification *and* rejects consistency as a normative goal—a position needing rigorous justification.  

