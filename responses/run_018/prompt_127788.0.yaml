  Okay, the user is a high school student in an ethics elective, grappling with the particularism vs. generalism debate. They're especially puzzled by Jonathan Dancy's idea of moral holism—how a feature can be a reason in one context but not in another. They tried explaining it to a friend who claimed to be "context-sensitive" without being anti-theory, and now they're confused about how to distinguish genuine particularism from other views.  

  Hmm, the core problem here is diagnostic clarity. They need a practical tool—a decision-tree taxonomy—to help their study group navigate these nuances without relying on jargon. The tree must force concrete choices through scenarios and conceptual questions, covering possibilities like whether kindness can override deception's wrongness in fixed circumstances, or if any feature has invariant moral weight.  

  The user explicitly wants leaves that include strict particularism, strict generalism, and hybrid positions (e.g., epistemic particularism or second-order principled views). They also want notes on where the tree fails to cleanly separate views, and where respondents might feel "in between" named theories.  

  First, I should map the philosophical landscape: Dancy's particularism rejects moral principles entirely, while generalism (like Kantianism or utilitarianism) insists some principles hold universally. Hybrids might accept holism for pro-tanto reasons but demand invariant all-things-considered judgments. The user mentioned two unnamed hybrids—epistemic particularism (no inferential access to reasons) and second-order principled holism (first-order reasons are holistic but weighing follows rules).  

  For the decision tree, each node must be a plain-language question. Start with the foundational holism question: "Can a feature switch valence?" If no → strict generalism. If yes, proceed to whether any feature is always valenced → if yes, weak generalism (one exception to holism). If no, then ask about invariant defeaters (e.g., can kindness always override deception?) → if yes, another hybrid; if no, move to moral expertise.  

  The expertise question is crucial: if expertise is perceptual → strict particularism; if case-comparison → another hybrid. But I should note ambiguities—e.g., between weak generalism and hybrid views if someone accepts one invariant feature but denies invariant defeaters. Also, some might endorse perceptual expertise but still believe in implicit rules, straddling particularism and hybrid views.  

  The user’s deeper need is likely pedagogical: they want to dissect the debate interactively, not just memorize labels. The tree should expose how subtle commitments (e.g., on valence constancy vs. defeater invariance) create philosophical rifts. Including "unnamed" hybrids acknowledges real conceptual diversity beyond textbook categories.  

  Finally, the response should validate that confusion is normal—the debate is messy, and honest respondents might not fit neatly into boxes. That’s pedagogically reassuring.
answer: |-
  Below is a decision-tree taxonomy designed to diagnose positions in the particularism-generalism debate through concrete, terminology-free questions. Each branch forces a choice about how moral reasons operate, with leaves mapping to strict particularism, strict generalism, and hybrid views. **Bold text** indicates key diagnostic questions, *italicized notes* clarify ambiguities.

  ---

  ### **Start: The Core Holism Question**  
  **Q1:** Can a feature that makes an action right (or wrong) in one situation become irrelevant or even make it wrong (or right) in another situation—*without any change in the non-moral facts*?  
  - **YES** → Proceed to Q2 (Holism accepted)  
  - **NO** → **Strict Generalism** (e.g., Kantianism, Act Utilitarianism).  
    *Position: Moral features (e.g., lying, harming) always carry fixed valences. Context only affects how rules apply, not their core content.*

  ---

  ### **Branch 1: Holism Accepted (Yes to Q1)**  
  **Q2:** Is there *at least one* feature that *always* counts the same way (e.g., torture always wrong-making, consent always right-making), no matter what other features accompany it?  
  - **YES** → **Weak Generalism** (e.g., Rossian Principlism).  
    *Position: Holism applies to most reasons, but a few "invariant" features anchor morality. Context can override pro-tanto reasons, but not these core features.*  
  - **NO** → Proceed to Q3 (No invariant features).  

  **Q3:** Can a feature that *defeats* a moral reason in one context (e.g., kindness overriding deception’s wrongness) itself be defeated—so that in a new context, deception "wins" against kindness *without any change in non-moral facts*?  
  - **YES** → Proceed to Q4 (No invariant defeaters).  
  - **NO** → **Hybrid 1: Defeasible Generalism**.  
    *Position: Holism applies to first-order reasons (e.g., deception is usually wrong-making), but "defeaters" (e.g., kindness) operate via invariant higher-order rules. Moral judgments follow context-sensitive patterns.*  

  **Q4:** Is moral expertise best described as **A)** directly "seeing" what matters in each unique situation (like perceiving a face’s expression), or **B)** learning from past cases to build flexible guidelines?  
  - **A)** → **Strict Particularism** (e.g., Dancy).  
    *Position: No rules, even implicit ones. Moral judgment is perception-like attunement to holistic reasons.*  
  - **B)** → **Hybrid 2: Implicit Generalism**.  
    *Position: Holism is real, but pattern-recognition across cases yields contextually sensitive rules (e.g., casuistry). Expertise is skill-based, not theory-free perception.*  

  ---

  ### **Leaf Positions Summarized**  
  1. **Strict Generalism**: All moral reasons are invariant. Context only specifies rule application.  
  2. **Weak Generalism**: Most reasons are holistic, but 1+ features (e.g., torture) are invariant.  
  3. **Hybrid 1 (Defeasible Generalism)**: First-order reasons are holistic, but second-order principles govern how reasons interact (e.g., "kindness defeats deception unless harm exceeds X threshold").  
  4. **Hybrid 2 (Implicit Generalism)**: All reasons are holistic, but moral learning builds reliable (though flexible) generalizations. Expertise is case-based, not perceptual.  
  5. **Strict Particularism**: No invariant features or principles. Morality is irreducibly situational.  

  ---

  ### **Ambiguities & Hybrid Attraction Points**  
  - **Weak Generalism vs. Hybrid 1**: If someone accepts *one* invariant feature (Weak Generalism) but denies invariant *defeaters*, they may feel torn. *Example:* "Torture is always wrong-making, but *when* it’s overridden (e.g., to prevent genocide) depends entirely on context—no rule governs this."  
  - **Hybrid 2 vs. Strict Particularism**: If expertise feels like "pattern-guided perception," respondents may reject both pure perception and rigid rules. *Example:* "I ‘see’ what’s right, but only because I’ve internalized thousands of cases—it’s not rule-free."  
  - **Unmappable Position**: Someone might accept holism yet insist *all-things-considered judgments* follow patterns (contra particularism), while denying *any* invariant features or principles (contra generalism). This resembles **"Pattern Particularism"**—a rarely defended view where outcomes are predictable but not rule-governed.  

  ---

  ### **Example Walkthrough**  
  *Respondent’s answers:*  
  - Q1 (Holism): **YES** (e.g., "Lying to protect someone feels right; lying to hurt them feels wrong.")  
  - Q2 (Invariant feature): **NO** (e.g., "Even torture *might* be justified to stop a planet’s destruction.")  
  - Q3 (Invariant defeaters): **NO** (e.g., "Kindness usually overrides deception, but if kindness enables manipulation, deception might become *more* important.")  
  - Q4 (Expertise): **B** (e.g., "Doctors become ethical experts by comparing cases, not ‘just seeing’.")  
  → **Leaf: Hybrid 2 (Implicit Generalism)**  

  ---

  This tree forces engagement with holism’s *scope* (Q1), *limits* (Q2–Q3), and *epistemology* (Q4). It reveals that "context-sensitivity" alone doesn’t distinguish views—the crux is whether holism "goes all the way down" (particularism) or admits constraints (generalism/hybrids). By focusing on concrete intuitions, it avoids labeling until necessary.
