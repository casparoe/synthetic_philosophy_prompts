prompt: |-
  I am a high school student in an upper-level ethics elective, and after our unit on normative theory I have become genuinely puzzled by the particularism versus generalism debate—especially after my teacher mentioned Jonathan Dancy's claim that moral reasons are holistic, so that a feature that counts in favor of an action in one context might be neutralized or even reversed in another. I tried explaining this to a friend who insisted she was just being "context-sensitive," not anti-theory, and I realized I do not have a clear diagnostic for distinguishing genuine particularism from a flexible generalism, or from hybrid views that accept holism at the level of pro tanto reasons but insist that all-things-considered judgments still follow invariant patterns.

  To help my study group work through this, I would like a decision-tree taxonomy—not a quiz that asks people to pick a label, but one built from concrete branch questions about how moral reasons behave. Each node should present a specific scenario or conceptual claim that forces a choice: for example, whether kindness can ever defeat the wrong-making feature of deception without any change in the non-moral circumstances; whether there is at least one feature that always carries the same moral weight regardless of what accompanies it; and whether moral expertise is better understood as direct perceptual attunement to situational salience or as the acquisition of implicitly general rules through case comparison. The leaves should include strict particularism, strict generalism, and at least two unnamed or rarely defended hybrid positions—such as an epistemic particularism that denies metaphysical holism but holds that our access to reasons is always non-inferential, or a view that restricts holism to first-order reasons while allowing second-order principles about how to weigh them. Please phrase every node as a question answerable without knowing the philosophical terminology, include a brief note on which pairs of leaves the tree cannot cleanly separate, and indicate where an honest respondent might find themselves drawn to a combination that does not map neatly onto any named view in the literature.
