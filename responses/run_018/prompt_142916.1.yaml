answer: |-
  ## Dissertation Prospectus: The Durability Asymmetry in Archaeological Inference  
  **Core Question:** Does inferring institutional continuity from an object’s material persistence (decay, repair, reuse, abandonment) require a distinct evidential logic—separate from episodic reconstruction (specific beliefs/intentions) and practice-based inference (institutions from repeated use-patterns)—and does conflating these modes generate systemic errors?  

  ### The Problem: Durability Asymmetry  
  Material artifacts persist beyond the mental states (beliefs, intentions) and social agreements (institutions) that produced them. Yet archaeology often treats physical durability *itself* as evidence for institutional stability. This "durability asymmetry" creates an epistemic gap: an object’s lifecycle may reflect adaptive reuse or decay under defunct institutions, not continuity.  

  ### Why Existing Frameworks Fail  
  1. **Representationalism** (inferring specific beliefs from artifact form/design):  
     Ignores lifecycle events (e.g., repair, repurposing). A broken-and-repaired votive statue might reflect changed ritual beliefs, but representationalism sees only original design.  
  2. **Practice Theory** (inferring institutions from recurrent use-patterns):  
     Conflates *use-frequency* with *material persistence*. Repeated use of a granary may signal institutional stability, but its prolonged physical survival after abandonment may be misread as continuity.  

  **The Gap:** Neither framework explains how lifecycle events (e.g., repurposing a boundary marker) should weigh *against* original function as evidence for institutional endurance.  

  ### Method: Conceptual Case-Study Analysis  
  A 12-month, non-empirical project using constructed case studies to isolate inferential logics. Avoids excavation/historical surveys to prioritize conceptual clarity.  

  **Monthly Breakdown:**  
  - **Months 1–2:** Define key terms:  
    - *Episodic Reconstruction*: Inferring Creator’s Belief (e.g., "This weight’s precision reflects a belief in market fairness").  
    - *Structural Persistence Inference*: Inferring Institutional Continuity (e.g., "This weight’s repeated recalibration reflects stable trade institutions").  
    - Map standard errors (e.g., assuming repaired city walls = continuous defensive institutions).  
  - **Months 3–5:** **Boundary Marker Case Study**  
    - Hypothesize lifecycles:  
      - *Stability*: Steady repair of original stones.  
      - *Collapse*: Reuse of stones as fill in new walls.  
    - Test: Does repair *necessarily* imply institutional continuity? Does reuse *necessarily* imply discontinuity?  
  - **Months 6–8:** **Storage Vessel Case Study**  
    - Scenarios:  
      - *Institutional persistence*: Standardized repairs across generations.  
      - *Institutional shift*: Non-standard repairs altering function (e.g., ritual jar → grain container).  
    - Criteria: When does repair strengthen vs. weaken structural inference?  
  - **Months 9–10:** **Standardized Weight Case Study**  
    - Scenarios:  
      - *Continuity*: Wear patterns showing consistent recalibration.  
      - *Discontinuity*: Weights repurposed as ornaments without recalibration.  
    - Test: Can we infer institutional stability from physical persistence *alone*?  
  - **Month 11:** Synthesize criteria for distinct logics:  
    - *Episodic* relies on design/traces of intent.  
    - *Structural* relies on lifecycle events signaling institutional engagement (e.g., protocol-driven repair).  
  - **Month 12:** Formalize decision rules and failure analysis.  

  ### Deliverable: The Persistence Inference Framework  
  A tool assigning evidential weights to lifecycle events:  
  | **Lifecycle Event** | **Episodic Weight** | **Structural Weight** |  
  |---------------------|---------------------|-----------------------|  
  | **Original Fabric** | High (creator’s intent) | Low (baseline) |  
  | **Protocol Repair** | Low | High (institutional engagement) |  
  | **Reuse/Repurpose** | Very Low | Context-dependent (signals adaptation or collapse) |  
  | **Abandonment** | None | Critical (may indicate institutional rupture) |  

  **Decision Rule:** Invoke *structural inference* only when lifecycle events show institutional *maintenance* (e.g., protocol-bound repair). Default to *episodic* for isolated, non-maintained objects.  

  ### Failure Conditions  
  The project fails if:  
  1. **Redundancy**: Lifecycle patterns add no unique information beyond use-patterns (e.g., if "repair frequency" always correlates with "use frequency").  
  2. **Collapse**: Every structural claim reduces to an episodic claim (e.g., "institutional continuity" just means "many individuals shared belief X").  
  3. **Indistinguishability**: No criteria cleanly separate episodic and structural inference in test cases.  

  ### Scope Management  
  - **No new data**: Focuses on logic, not empirical discovery.  
  - **No external frameworks**: Builds concepts from archaeology’s core problem (durability asymmetry).  
  - **Honest timeline**: 12 months for framework development; validation in future work.  

  ---  
  **Outcome:** Either a robust logic for durability-based institutional inference or a proof that such inference is reducible to existing modes—resolving a foundational gap in archaeological reasoning.
