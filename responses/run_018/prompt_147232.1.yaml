  Hmm, the user is clearly deeply familiar with Strawson but needs pedagogical strategy, not content recap. They want a tight 90-minute plan with specific safeguards against predictable misunderstandings. Interesting challenge - bridging CS skepticism with philosophical nuance. 

  First, I need to structure the dependency order carefully. Must establish the *inescapability of interpersonal relations* before introducing reactive attitudes, otherwise they'll dismiss them as optional emotions. Then reactive attitudes must be grounded before contrasting the objective attitude, or they'll confuse it with rationality. Finally, must prevent the emotional/rational binary collapse immediately after introducing objective stance. 

  The hiring algorithm example is brilliant for this audience. CS students will viscerally grasp system opacity and weighting errors. Key inclusions: unreviewable algorithmic process (no designer intent), concrete harm (rejection), and human oversight failure (to block "sue the company" escapes). Must exclude identifiable humans - that would default to interpersonal blame. A friend's betrayal would backfire because skeptics would just say "ah, but that's reducible to brain states!" 

  Biggest landmines: 
  1) Mistaking reactive attitudes for controllable feelings (will surface during initial examples) - defuse by linking to automatic flinch responses. 
  2) Equating objective attitude with analysis (during contrast phase) - clarify it's depersonalization.
  3) Determinism forcing universal objectivity (Q&A) - Strawson explicitly rejects this! 
  4) Thinking it's compatibilism-by-redefinition (likely final discussion) - emphasize it's about what responsibility *is*, not rescuing freedom. 

  Diagnostic question must force relational thinking: "Could we resent a perfectly designed self-driving car that kills due to unavoidable sensor failure?" Their answer reveals if they grasp that resentment requires perceived agency/relation. 

  Must refuse Kant comparisons and moral luck tangents - they'd derail the relational ontology focus. Taxonomy details can wait; today's goal is the paradigm shift. 

  Pacing is tight: 15min setup, 25min reactive attitudes, 20min objective shift, 20min algorithm case study, 10min Q&A. No fluff. 

  User's expertise shows in anticipating every pitfall - this plan honors their pedagogical precision. The algorithm case is the masterstroke for bridging CS minds to phenomenology.
answer: |-
  Here’s a focused 90-minute seminar plan targeting your audience’s skepticism while securing Strawson’s core insight:

  ---

  ### **Dependency Order & Timing**  
  **Total: 90 mins**  
  1.  **Setup: The Unavoidability of Relational Stances (15 mins)**  
      *   **Goal:** Establish that humans *cannot* interact as purely neutral observers.  
      *   **Activity:** Ask students to describe a time they *couldn’t help* feeling hurt by a remark (even if "irrational") or grateful for an unplanned kindness. Contrast with how they observe a malfunctioning vending machine.  
      *   **Key Secured:** We inhabit relationships; pure neutrality isn’t a live option.  

  2.  **Introduce Reactive Attitudes as Relational "Grammar" (25 mins)**  
      *   **Goal:** Show resentment/gratitude etc. are *constitutive* of holding someone responsible, not add-ons.  
      *   **Activity:** Use quick examples:  
          *   *Minor:* Someone bumps you *accidentally* vs. *dismissively*. Note the immediate flash of resentment in the latter.  
          *   *Major:* A colleague anonymously fixes your critical bug vs. loudly claiming credit. Note spontaneous gratitude vs. suspicion.  
      *   **Key Secured:** These attitudes *are* the practice of responsibility. They respond to the *quality of will* (dismissive, kind, indifferent) expressed toward you.  

  3.  **Contrast: The "Objective Attitude" as Relational Withdrawal (20 mins)**  
      *   **Goal:** Define OA not as calmness, but as seeing the other as *not a participant* in moral relations (e.g., a thing, a patient, a system).  
      *   **Activity:** Contrast:  
          *   Resenting a manipulative friend (Reactive) vs. managing a toddler’s tantrum (Objective - focused on causes/effects, not blame).  
          *   *Crucial:* Ask if being *calmly resentful* (e.g., cold anger) is the Objective Attitude? **NO.** It’s still reactive! OA is seeing the other as *incapable* of participating in the exchange.  

  4.  **Carrying Example: The Hiring Algorithm (20 mins)**  
      *   **Case:** A qualified candidate is rejected by an opaque, proprietary algorithm. A hidden weighting error (e.g., over-penalizing gaps in CVs) caused it. Human oversight was possible but failed (no audit trail). Harm is direct (lost job), but no single designer intended *this* outcome; the system’s logic is inaccessible.  
      *   **Why this works for your audience:**  
          *   **Excludes Libertarianism:** No "uncaused cause" to latch onto.  
          *   **Forces Relational Question:** *Who/What* can we *address* our resentment to?  
          *   **Opacity & Systemness:** Prevents easy blame-shifting to a human "mastermind." Highlights the *absence* of a participant with a *discernible quality of will* toward the victim.  
          *   **Contrasts Interpersonal Betrayal:** A broken promise *presupposes* a reactive framework ("You owed me respect!"). Skeptics dismiss it as "mere emotion." The algorithm case *starts* from their comfort zone (systems/errors) and forces the question of where resentment *could* meaningfully land.  
      *   **Guided Questions:**  
          *   "Can you resent *the algorithm*? What would that even mean? Does it make sense to demand an apology *from it*?"  
          *   "Can you resent *the designers*? Did they *show ill will* *to this candidate*? How? What evidence?"  
          *   "If neither, is the *only* rational response cool analysis (OA) to fix the system? What is *lost* if we *cannot* adopt a reactive stance here?"  

  5.  **Q&A / Synthesis (10 mins)**  
      *   **Diagnostic Question:**  
          *"Imagine a self-driving car causes a fatal accident due to a sensor failure in unprecedented weather. The system was state-of-the-art, rigorously tested, and the failure was unforeseeable by engineers. Can the victim’s family appropriately feel* ***resentment*** *towards the car, the engineers, or the company? Or are feelings like sadness and a demand for compensation the* ***only*** *rationally justifiable responses? Justify your answer using Strawson's framework."*  
          *   **Reveals Understanding:** Correct grasp sees resentment as incoherent without a *participant* displaying ill will/negligence. The OA (demand for compensation/system fix) is the *only* fitting stance toward the system/company *if* no ill will/negligence is found. Relational anchor is clear.  

  ---

  ### **Misconceptions to Intercept & Defuse**  
  1.  **"Reactive attitudes are switchable emotions."**  
      *   **When:** During initial examples (Step 2).  
      *   **Defuse:** "Is the flash of resentment when deliberately slighted a *choice*? Or is it the *default* way we register being wronged *by a person*? Strawson argues it's the latter – the framework we inhabit, not a feeling we turn on/off."  

  2.  **"The Objective Attitude is just clinical/rational analysis."**  
      *   **When:** When contrasting OA with reactive calmness (Step 3).  
      *   **Defuse:** "Is a doctor calmly diagnosing a tumor (OA towards the disease) *doing the same thing* as a judge calmly sentencing a criminal? No! The judge, even calmly, *holds the criminal responsible* (Reactive). OA is seeing the other as *not answerable*, like the tumor or the toddler."  

  3.  **"Determinism forces us into the OA for everyone."**  
      *   **When:** Likely Q&A or during Algorithm discussion (Step 4).  
      *   **Defuse:** "Strawson *denies* this! He says our *reactive nature* is *also* determined. We *cannot* sustain OA towards normal adults; our relationships *demand* the reactive stance. Determinism might change *how* we react (e.g., less retributive), but not *that* we react, *if* we engage relationally."  

  4.  **"Strawson is redefining freedom/responsibility to save compatibilism."**  
      *   **When:** Final Q&A or diagnostic question.  
      *   **Defuse:** "He's not *redefining* freedom; he's *bypassing* the metaphysical debate. He asks: *What are we actually doing* when we hold responsible? Answer: Participating in relationships structured by reactive attitudes. That practice exists *regardless* of determinism. It's descriptive, not revisionist."  

  ---

  ### **What to REFUSE to Cover (Justification)**  
  1.  **Full Taxonomy of Reactive Attitudes (e.g., self-reactive, vicarious):**  
      *   **Why:** Crucial for depth, but distracts from the core *relational* point for interpersonal responsibility. Simplifies *too much*? No, protects focus on the central argument against your audience's skepticism.  
  2.  **Kantian Autonomy/Comparisons:**  
      *   **Why:** Drags in the metaphysical "freedom condition" Strawson wants to sidestep. Directly undermines the goal of shifting focus to relations.  
  3.  **Later Literature (Moral Luck, Strawson's Critics):**  
      *   **Why:** The aim is comprehension of *Strawson's core*, not evaluation or expansion. Moral luck *presupposes* the reactive framework; discussing it prematurely clouds the foundational point.  
  4.  **Deep Dive into "Quality of Will":**  
      *   **Why:** Essential nuance, but 90 mins is tight. The algorithm case implicitly uses it (no ill will present). Explicit definition can wait; grasp the *relational context* first.  

  **Key to Success:** Relentlessly anchor *every* point back to **relations between beings**. Use their skepticism about "folk psychology" to show Strawson is describing the *inescapable structure* of those relations, not endorsing folk metaphysics. The algorithm case is your bridge – meet them where they live (systems) and show why responsibility only makes sense *when systems fail to provide a relational participant*.
