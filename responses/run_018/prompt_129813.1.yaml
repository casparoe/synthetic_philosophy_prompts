            - Each token-giver has 3 tokens that they can allocate in the initial round. They write down their allocation for each blamer (so each blamer gets a number from 0 to 3 from each token-giver, but the total per token-giver is 3).
            - Then, after all revelations, each token-giver is allowed to adjust their allocation for any blamer, but they must keep the total at 3. They do this at the end, after all revelations.

