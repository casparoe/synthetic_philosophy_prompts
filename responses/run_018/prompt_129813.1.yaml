            - Round 1: After the blaming statements, each token-giver allocates 3 tokens arbitrarily to the blamers (they record: Blamer1: X tokens, Blamer2: Y, etc., with X+Y+... = 3).
            - Round 2: After all revelations, each token-giver is given 3 more tokens? That doubles the tokens. Or we let them reallocate the same 3 tokens? But they can take tokens from one blamer and give to another? 

