  hey so me and my roommate just had this exhausting 2-hour argument about whether logic can actually constrain ontology or if its all just language games. he kept throwing around that old School of Names line — white horse is not horse — like its a slam-dunk proof that kind membership is totally contingent and that properties never touch identity. i tried to say he's probably mixing up compound-term logic with essentialism but now i'm not sure i can articulate the difference myself. you're an expert in comparative philosophy and logic, please think very carefully and start with some brainstorming: lay out the distinct precise claims that slogan could actually stand for, from the trivial to the radical. is it about compound vs simple terms? about predication failure? about accidental properties? about an intension/extension gap? for each reading say whether its defensible, false, or just a verbal trick. then specifically tell me which ones — if any — actually support his conclusion that category membership is always contingent because a white horse isn't a horse. i want a menu of interpretations i can literally show him, not just the one you think is best. and please don't make me chase down obscure primary sources; just work with the slogan itself and standard logical distinctions. btw i think i misspelled contingent earlier but whatever.
