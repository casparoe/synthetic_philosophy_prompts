prompt: |-
  okay so me and my roommate just got into this huge argument about whether being a person is just something you are inside your head or if its like... a thing that happens between people? he kept saying ubuntu is basically just communitarianism with a different hat and that relational personhood means the individual disappears, and i think hes missing the whole point but now im stuck because i promised my study group — mostly poli sci and psych grad students with zero phil background — that id run a session on it next tuesday.

  i need a plan for the explanation, not the explanation itself: the exact order i have to introduce the pieces so the idea lands without them just hearing the slogan about being because of others and rolling their eyes. i want to build everything around one carrying example, which is grief and mourning practices where the dead are still treated as active social presences — not just remembered, but actually in relation — so that it does the work of showing why personhood isnt bounded by biological death or mental states alone. what misconceptions will they form? im guessing theyll think its just emotional interdependence, or confuse it with Marxist collectivism, or assume im denying that individuals have rights. i need to know where in the sequence to head each one off, plus the one check i can ask at the end to see if theyve actually grasped the relational structure rather than just nodding along. also tell me what part of the metaphysics i should openly refuse to explain at this level. please dont give me a reading list, they wont have time anyway, and dont ask me to cite anything — i just need the pedagogical architecture.
