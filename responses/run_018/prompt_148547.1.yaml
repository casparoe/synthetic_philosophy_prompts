answer: |-
  1. Your friend's teleosemantic position defines content normatively via evolutionary history: a representation means what it was selected to correlate with, so misrepresentation occurs only when it fails to perform that selected function. Your causal-role position defines content non-historically via current causal architecture: internal functional norms define correct operation, and failure occurs when that architecture breaks down, irrespective of origins.  
  2. You argue causal-role theories inherently include normative failure through internal malfunction, making evolutionary history redundant for defining error; she insists selection provides the only objective, non-arbitrary grounding for why a function is "proper" rather than merely regular.  
  3. The synthetic organism thought experiment shows the dispute is empirically empty: both theories can be technically adjusted to attribute identical content/error to the synthetic system (via design intent mimicking selection or identical causal roles), leaving no observable difference to test.  
  4. The hidden empirical question is whether evolution is necessary to derive genuine normativity, but this is untestable as both frameworks produce identical predictions about behavior and error in all conceivable cases.  
  5. Progress requires reframing: clarify if "naturalizing content" demands an external historical anchor (her view) or if internal causal structure suffices (your view), as this conceptual divergence underlies the stalemate.
