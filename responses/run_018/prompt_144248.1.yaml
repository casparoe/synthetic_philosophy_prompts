answer: |-
  ### Formal Argument: Distributed Replacement and Triadic Constitution

  **P1. Material Identity Condition (MIC):**  
  Any material object *x* (e.g., a lump of bronze) persists only if >50% of its original atomic parts maintain spatiotemporal continuity across time. *(Premise: grounded in mereological essentialism/endurance theory)*  

  **P2. Formal Identity Condition (FIC):**  
  Any functionally defined object *y* (e.g., a statue) persists only if (i) its defining form (shape, function, causal capacities) is preserved, and (ii) there is continuous material realization of that form. *(Premise: standard hylomorphic criteria)*  

  **P3. Distributed Replacement Scenario (DRS):**  
  Let *S₀* be a bronze statue at *t₀* constituted by lump *L₀*. Over interval [*t₀*, *t₁₀*], every atom in *S₀*/*L₀* is uniformly replaced by synthetic alloy atoms, such that:  
  - (a) Macroscopic properties (form, weight, causal capacities) remain invariant at all *t* ∈ [*t₀*, *t₁₀*].  
  - (b) Replacement is volumetrically uniform: no discrete boundary exists between "original" and "replacement" matter at any *t*.  
  - (c) At *t₁₀*, 0% of *L₀*'s atoms remain.  

  **P4. Non-Identity of Original Lump (NIL):**  
  At *t₁₀*, *L₀* ceases to exist. *(From P1 & P3c: >50% parts not retained)*  

  **P5. Non-Identity of Original Statue (NIS):**  
  At *t₁₀*, *S₀* ceases to exist. *(From P2ii & P3c: no original matter realizes the form continuously; P3b prevents "partial persistence" via gradual overlap)*  

  **P6. Non-Repairability Thesis (NRT):**  
  *S₀* is not merely "repaired" at *t₁₀*, as repair requires (i) discrete part replacements, and (ii) persistence of >50% original structure. *(From P3b: no discrete boundaries; P3c: 0% original parts)*  

  **P7. Successor Object Emergence (SOE):**  
  At *t₁₀*, object *S₁₀* exists with:  
  - (a) Identical form to *S₀* (by P3a).  
  - (b) Wholly new matter (by P3c).  
  - (c) No material-historical connection to *S₀* or *L₀* (by NIL & NIS).  
  Thus, *S₁₀* is a distinct successor object instantiating *S₀*'s form without inheriting its matter.  

  **P8. Triadic Constitution Relation (TCR):**  
  Constitution is not binary (form + matter) but triadic: **<Form, Matter, Transformation Rule *τ*>**, where *τ* specifies continuity conditions for form-preservation under matter-replacement. *(Premise: derived from DRS)*  
  - In DRS, *τ* requires volumetric uniformity (P3b) and functional invariance (P3a).  
  - *S₁₀* is constituted by *τ* mapping *S₀*'s form to new matter, despite *S₀* and *L₀* ceasing to exist.  

  **P9. Undermining the Dominance Argument (UDA):**  
  The dominance argument claims statue/lump distinctness hinges on divergent modal/temporal properties (e.g., lump survives scattering; statue does not).  
  - TCR falsifies this: *S₁₀* shares *S₀*'s form but has *new* modal properties (e.g., synthetic alloy may resist corrosion better).  
  - Constitution is mediated by *τ*, not direct form-matter relations. Thus, "same statue" requires satisfaction of *τ*, not matter persistence.  

  ---

  ### Addressing Objection: "Distributed Replacement as Gradual Repair"  

  **Objection:**  
  Distributed replacement is functionally identical to gradual repair (e.g., replacing worn statue parts). Since repair preserves identity, *S₀* persists through DRS.  

  **Reply:**  
  This objection fails due to **boundarylessness** (P3b):  
  - Repair requires discrete replacement events: parts are removed/added at specific times/spaces (e.g., replacing a statue's arm).  
  - DRS has **no discrete boundaries**: at every instant *t*, the matter is a homogeneous blend of original/replacement atoms, with no subset replaceable as a "part."  
  - Thus, at no point can we say "this region is repaired while that region is original." The entire object is in flux without identity-preserving segments.  
  - Consequently, repair-based persistence conditions (e.g., "core parts" surviving) are inapplicable. P3b ensures no such core exists.  

  ---

  ### Conclusion  
  The post-replacement entity (*S₁₀*) is neither *S₀* (contra FIC), nor *L₀* (contra MIC), nor a repaired *S₀* (contra NRT). It is a successor object constituted triadically via *τ*. DRS thus refutes binary constitution by showing that form can transfer to new matter under continuous transformation rules, even when strict material identity is extinguished. The dominance argument fails because constitution is *τ*-relative, not intrinsic to matter or form alone.
