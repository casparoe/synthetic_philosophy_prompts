  We are constructing a thought experiment set in a museum conservation lab that maintains a digital-twin database tracking volumetric absences (the negative spaces left when sculptures are removed). We have two researchers:

  - Researcher A (quantifier-variantist): holds that the existence of absences is relative to a conceptual framework. In their framework, they might speak of absences as objects, but this is a matter of linguistic convention.
  - Researcher B (ontological realist): believes that there is an objective ontological structure and that relational structures (like the absence) can have causal efficacy. They hold that the absence is an actual object in the world.

  The scenario must satisfy four conditions:

  1. Identical empirical predictions: Both make the same predictions about every physical interaction in the lab.
  2. Shared first-order intuition: Both sincerely report that there is "something" (the absence) when inspecting the empty pedestal.
  3. Translation failure: Directly translating A's claim into B's framework yields falsehood or becomes a claim about language.
  4. Modal inertia: There is a structural feature (modal inertia) such that if removed, the disagreement becomes a standard empirical dispute about measurement error.

  **The Scenario:**

  In the museum conservation lab, a sculpture is removed from its pedestal for restoration, leaving a precisely defined volumetric absence. The lab's digital-twin database records this absence with an entry that includes its exact dimensions, the time of removal, and the expected duration until return. Researcher A, a quantifier-variantist, asserts that the database entry refers to an object (the absence) within their operational framework. Researcher B, an ontological realist, agrees that the database entry refers to an actual object (the absence) but insists that this object exists independently of any framework and has causal efficacy (e.g., by influencing the placement of tools that must avoid that space). Both researchers observe the empty pedestal and report the same intuition: "There is something here—the absence of the sculpture." They also agree on all empirical predictions: for instance, if someone tries to place a new object in that space, both predict it will not fit and that the database will trigger an alarm if the space is violated. However, when A's statement "The absence exists" is translated into B's framework, B would interpret it as a false claim because B thinks A is only speaking within a linguistic convention and not about mind-independent existence. Moreover, the scenario includes a feature of "modal inertia": the database entry for the absence is designed to remain unchanged even under hypothetical counterfactual scenarios where the sculpture's removal was accidental or intentional, and regardless of measurement precision (unless the absence is explicitly deleted by a curator). If we remove modal inertia (making the absence entry contingent on measurement error or easily altered by minor events), then the dispute would become about whether the database entry was accurate, which is an empirical issue.

  **Verification of Conditions:**

  1. **Empirical Agreement:** Both agree on all physical events (e.g., an object placed in the space will not fit, the alarm will sound, etc.).
  2. **Shared Intuition:** Both say "there is something (the absence)" when looking at the empty pedestal.
  3. **Translation Failure:** In B's framework, A's claim "The absence exists" is taken as a conventional assertion, not a claim about mind-independent reality. Thus, translating A's claim to B's framework yields: "According to the operational framework, the absence exists" — which is a claim about language, not the world. Alternatively, if we try to assert the same proposition in B's framework without the conventional layer, B would say the absence exists mind-independently, so A's claim (as interpreted by B) is false because A doesn't believe in mind-independent absences.
  4. **Modal Inertia:** The database entry is modally inert: it persists across counterfactual scenarios (e.g., even if the sculpture had been removed in a different way, the absence would still be recorded). Without modal inertia, the debate would shift to whether the absence was correctly measured or recorded (an empirical dispute about data accuracy) rather than whether the absence is a genuine object.

  **Analysis:**

  - **Deflationist (e.g., Carnap-style) Verdict:** The deflationist would classify this as a verbal dispute because the disagreement arises solely from the way the two researchers use the term "object" and "exists." A and B are using different linguistic frameworks: A's framework includes absences as objects by convention, while B's framework includes them as mind-independent objects. The deflationist points to the translation failure (condition 3) as evidence: when we try to express A's claim in B's language, it becomes a different kind of claim (about language). Thus, the dispute is about which framework to adopt, which is a pragmatic choice, not a substantive truth about the world.

  - **Realist (Sider-style) Verdict:** The realist argues that the dispute is substantive because both parties are using the same quantifier meaning (they both mean "there exists" in the same way when they say "there is something") but disagree about what exists. The shared intuition (condition 2) reflects a shared quantifier meaning: both are committed to the existence of the absence in the same sense. However, B goes further by attributing mind-independent existence and causal efficacy to the absence, while A does not. The realist claims that the quantifier is univocal and that B's position captures the real structure of being. The modal inertia feature is crucial because it ensures that the disagreement is not about the empirical data (which they agree on) but about the ontological status of the absence as a modally robust entity. Without modal inertia, the debate would collapse into an empirical disagreement about whether the database entry was correct, which is not ontological.

  **Realist's Counter-move to Deflationist:** The realist argues that the deflationist misapplies the merely-verbal diagnosis by ignoring a shared modal commitment. Both A and B agree that the absence would still be recorded in the database even under counterfactual scenarios (modal inertia). This modal commitment is not just about language but about how the world is structured: the absence has a modal robustness that both recognize. However, only B treats this modal fact as ontologically binding: for B, the modal inertia indicates that the absence is a real, mind-independent object with its own identity conditions. The deflationist, by reducing the modal commitment to a linguistic convention, fails to account for why both researchers share the same counterfactual judgments. Thus, the realist claims that the dispute is about the ontological significance of a shared modal structure, making it substantive.
answer: |-
  ### Thought Experiment: The Volumetric Absence in the Museum Lab  
  In the conservation lab of the Neoclassical Art Museum, a marble statue is removed for restoration, leaving behind a precisely defined negative space on its pedestal—a volumetric absence with exact dimensions (e.g., 1.5m³) recorded in the lab’s digital-twin database. This database tracks such absences as discrete entities, complete with metadata (e.g., creation timestamp, expected duration). Researcher A, a quantifier-variantist, asserts that the database entry for this absence refers to an "object" within their *operational framework*—a useful abstraction for predicting spatial constraints in the lab, such as where tools cannot be placed without triggering collision alarms. Researcher B, an ontological realist, insists the absence is a *mind-independent object* with causal efficacy: it physically excludes matter (e.g., preventing a vase from occupying its volume) and influences lab operations (e.g., by causing alerts if breached). Both researchers observe the empty pedestal and report the identical first-order intuition: "There is something here—the absence itself." They agree on all empirical predictions: e.g., laser scans will confirm the space is unoccupied, any object placed there will not fit, and the database will log violations identically. However, A treats "existence" as framework-relative, while B treats it as absolute. Crucially, the database entry exhibits **modal inertia**: it remains invariant under counterfactual scenarios (e.g., if the statue had been removed accidentally instead of intentionally, or if measurement sensors had a 0.1% error margin). If modal inertia were removed—making the entry contingent on measurement precision or easily altered by minor events—the dispute would collapse into an empirical disagreement about data accuracy, not ontology.  

  ### Deflationist Verdict: A Verbal Dispute  
  The deflationist (e.g., Carnap) classifies this as merely verbal because the disagreement stems *entirely* from divergent linguistic frameworks, not reality. A and B share all empirical predictions (condition 1) and first-order intuitions (condition 2), but A’s claim "The absence exists" is shorthand for "Within our lab’s conceptual scheme, quantifying over absences is pragmatically useful." When directly translated into B’s framework—which demands mind-independent existence—A’s claim becomes false or degenerate (condition 3): B interprets it as "The absence exists mind-independently," which A rejects. Thus, the dispute reduces to A and B adopting different *languages* (one instrumental, one realist) to describe the same non-linguistic facts (spatial properties and causal relations). The divergence is purely meta-semantic: "object" and "exists" are framework-relative terms.  

  ### Realist Verdict: A Substantive Dispute  
  The realist (e.g., Sider) classifies this as substantive because A and B *share a univocal quantifier meaning* ("there is") but diverge in ontological commitments. Both deploy the quantifier identically in ordinary contexts (e.g., "There is a pedestal") and report the same intuition about the absence (condition 2), confirming a shared core meaning of "existence." Yet B posits an *additional ontological commitment*: absences are fundamental entities in the relational structure of reality, with causal powers (e.g., exerting exclusionary force). A denies this, treating absences as linguistic/conceptual tools. Modal inertia (condition 4) ensures this disagreement remains metaontological: it makes absences *modally robust* (persisting identically across counterfactual worlds), so their existence cannot be settled empirically (e.g., via sensor data). Without modal inertia, the dispute would hinge on contingent measurement errors—but with it, the issue is whether modal robustness implies mind-independent existence.  

  ### Role of Modal Inertia  
  Modal inertia keeps the dispute in metaontological territory by isolating existence from empirical contingencies. It ensures absences behave like abstract objects (e.g., invariant under perturbations), making their "reality" untestable via lab interactions. This shifts the debate to whether modal persistence entails ontological fundamentality—a question about *what structures exist*, not how we measure them. Eliminating modal inertia would reduce the case to an empirical calibration dispute (e.g., "Is the database precise enough to track gaps?"), collapsing the ontological disagreement.  

  ### Realist’s Counter-Move Against Deflationism  
  The realist argues the deflationist misapplies the verbal diagnosis by ignoring a *shared modal commitment* both accept as binding. A and B both endorse modal inertia counterfactuals (e.g., "Even if the statue’s removal method changed, this absence would persist"). For B, this commitment is ontological: modal inertia reflects the absence’s mind-independent essence. For A, it is merely a feature of their linguistic framework. But the realist contends that this modal truth (e.g., the absence’s counterfactual stability) is *worldly*, not linguistic—both researchers treat it as a fact about how the lab *must* behave, not how they speak. By dismissing this as "pragmatic," the deflationist illicitly reduces a shared modal structure (accepted by both as objective) to convention. Thus, the dispute is substantive: it concerns whether modal truths ground ontological commitments, which B affirms and A denies despite their identical counterfactual judgments.
