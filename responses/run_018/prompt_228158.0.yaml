answer: |-
  Here's the breakdown you requested:

  **The name, if there is one**
  The specific collapse you describe – where adding the axiom "Everything my proof-checker certifies is true" (effectively, a formalization of "I am consistent") leads directly to the system being able to prove *any* statement whatsoever (inconsistency/triviality) – is a direct consequence of **Löb's Theorem**. While Gödel's Second Incompleteness Theorem is the most famous result about unprovability of consistency, Löb's Theorem precisely characterizes the disastrous consequences of *assuming* self-consistency as an axiom within a sufficiently powerful system. The phenomenon itself is often called the **trivialization via self-trust** or **collapse under consistency assumption**.

  **Why this is not just Gödel**
  Your friend is right that Gödel's Second Incompleteness Theorem (G2) is deeply related. G2 states that a consistent, sufficiently powerful formal system (like the one your robot uses) *cannot* prove its own consistency statement (Con) from within itself. The robot's inability to internally generate a proof of Con is indeed G2.

  However, your insight about the "detonation" goes beyond G2:
  1.  **From Unprovability to Explosive Inconsistency:** G2 says the robot *can't prove* "I am consistent". Your scenario forces the robot to *assume* "I am consistent" as an axiom. Löb's Theorem shows that this assumption, within such a system, is not just ungrounded but *catastrophic*. If the system proves "If I prove P, then P is true" (for all P), then the system *can* prove *every* P. This includes P = False! The self-trust axiom doesn't just leave the robot limping; it actively transforms the proof-checker into a device that can certify contradictions, rendering the entire system useless ("trivial" in logic, meaning it proves everything).
  2.  **The Mechanism of Collapse:** The collapse happens because the self-trust axiom enables a specific self-referential construction (related to the proof of Löb's Theorem). Essentially, the system can construct a statement L roughly meaning "If I am consistent, then I am a liar (certify false things)". Under the assumption of self-trust (consistency), L implies the system *is* inconsistent. But the system *can* prove L *if* it assumes self-trust. This contradiction forces the system to conclude False, and from False, anything follows. G2 tells us the system can't affirm its consistency; Löb's Theorem tells us that *if it ever does* (via an axiom or proof), the whole system implodes.

  **Does it touch ordinary human self-trust?**
  The *literal, formal* collapse described by Löb's Theorem applies directly only to idealized, consistent, sufficiently powerful proof systems manipulating uninterpreted symbols. Humans are not such systems: we are massively inconsistent, our reasoning is bounded and heuristic, we don't have fixed axioms, and "proof" is a fuzzy, probabilistic concept for us. We *cannot* formally trivialize our reasoning by simply declaring self-trust.

  However, the *structural vulnerability* is profoundly relevant. Our capacity for self-deception, confirmation bias, and epistemic circularity mirrors the logical trap. Trusting "whatever my internal reasoning process produces" *without any external checks or constraints* can lead to catastrophic epistemic failures. We become trapped in self-justifying bubbles where contradictory beliefs coexist, evidence is selectively interpreted, and dissent is dismissed – a practical analog of logical inconsistency, even if not the formal explosion. The core lesson – that unconstrained, unconditional self-trust is epistemically dangerous and potentially self-undermining – resonates deeply with the human condition.

  **Known escape routes and their costs**
  1.  **Bounded Proofs/Resources:** Only trust proofs below a certain length or computational cost (feasibility). *Cost:* Severely limits reasoning power; cannot handle complex, deep truths essential for planning.
  2.  **Trust Weaker Systems:** Trust only the consistency or outputs of a *strictly weaker* subsystem (e.g., trusting arithmetic but not set theory). *Cost:* Cannot fully trust the reasoning power you actually use for complex tasks; creates a hierarchy of doubt.
  3.  **Probabilistic/Approximate Trust:** Assign high confidence (not certainty) to short/verifiable proofs, decreasing confidence as proofs get longer or more complex. *Cost:* Loses the certainty of deductive logic; reasoning becomes inherently uncertain and fallible.
  4.  **Reflexive Hierarchies:** Build meta-systems that reason about the object system's reliability without assuming its full consistency axiomatically (bootstrapping). *Cost:* Complexity explodes; the meta-system itself faces similar self-trust dilemmas at a higher level; often requires infinite regress or new assumptions.
  5.  **Accept Incompleteness:** Acknowledge you cannot internally prove or fully trust your own consistency, and rely on external verification, empirical success, or pragmatic necessity. *Cost:* Requires external anchors; violates the ideal of pure self-contained rational justification; leaves fundamental self-doubt unresolved.
