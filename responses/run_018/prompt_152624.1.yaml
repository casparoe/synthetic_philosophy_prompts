prompt: |-
  Please explain the conceptual tension in teleosemantic theories of mental content—specifically in Ruth Millikan's consumer-based framework—when that framework is applied to distributed or symbiotic cognitive architectures in which the producer and consumer of a representation are not part of the same biological system. Focus on whether the notion of "proper function" for the consumer can be defined non-circularly if that consumer's own functional norms depend on representational success conditions that are themselves being explained teleosemantically. Your explanation should distinguish producer-based misrepresentation from consumer-based misrepresentation, clarify why the circularity worry is not merely an epistemic problem about identifying functions but a constitutive problem about grounding normative content, and assess whether appealing to evolutionary selection history at the level of the symbiotic unit resolves the issue or merely relocates it. Do not provide a bibliography, reading list, or specific citations; work from the conceptual structure of the view itself.

  After your explanation, provide a brief structured summary as a JSON object with exactly these fields:
  - "core_tension": a one-sentence statement of the circularity risk in distributed architectures
  - "producer_vs_consumer": the key distinction between the two loci of misrepresentation
  - "selection_unit_problem": whether evolutionary selection at the symbiotic level solves or relocates the circularity
  - "unresolved_issue": the remaining conceptual obstacle if the circularity is not resolved
reasoning: |-
  We are dealing with teleosemantics, specifically Ruth Millikan's consumer-based approach. Teleosemantics grounds mental content in biological functions: a representation means what it is supposed to correspond to, based on the evolutionary history of the systems that produce and consume it.

  Millikan's framework distinguishes between the producer and consumer of a representation. The producer generates a representation (e.g., a neural state) and the consumer uses that representation to guide behavior. The content is fixed by the conditions under which the consumer's response to the representation has been historically successful, thereby contributing to fitness.

  **Core Tension in Distributed Architectures:**
  In a distributed or symbiotic cognitive architecture, the producer and consumer are not part of the same biological system. For example, consider a human and a machine in a symbiotic relationship, or two organisms (like a cleaner fish and a client fish) where one produces a signal and the other consumes it. The worry is that the definition of the consumer's "proper function" might become circular when we try to define the content of the representation.

  **Circularity Worry:**
  The circularity arises when we try to define the representational content (i.e., what the representation is about) in terms of the consumer's proper function, but the consumer's own functional norms (what it is supposed to do) might themselves depend on the representational success conditions. That is, we might need the content to already be fixed in order to determine what the consumer's proper function is, but the content is supposed to be fixed by the consumer's proper function.

  **Distinguishing Producer vs. Consumer Misrepresentation:**
  - **Producer-based misrepresentation**: This occurs when the producer generates a representation that does not correspond to the state of affairs that it is supposed to indicate. For example, a frog's visual system produces a fly-representation when there is no fly (e.g., a BB pellet is present). The producer is malfunctioning relative to its function of indicating flies.
    
  - **Consumer-based misrepresentation**: This occurs when the consumer uses the representation in a way that does not align with the conditions that historically made that use successful. For example, the frog's tongue-snapping mechanism (consumer) might malfunction by not snapping when a fly is present (even if the producer correctly represents a fly). Or, in a symbiotic setup, the consumer might react to a representation in a new environment where the representation does not correlate with the condition it used to.

  **Why the Circularity is Constitutive, Not Epistemic:**
  The problem is not just that we don't know the evolutionary history (which would be epistemic) but that the very normative standard (what the consumer is supposed to do) might depend on the representational content, which in turn is being defined by that normative standard. Without an independent way to fix the function of the consumer, we risk a circular definition: the content is defined by the consumer's function, but the consumer's function is defined by the conditions that make the representation successful (which requires content). This is a problem of grounding the normativity of content.

  **Appealing to Evolutionary Selection at the Symbiotic Unit Level:**
  One might try to resolve the circularity by considering the symbiotic unit (e.g., the human-machine pair or the two fish) as a single unit of selection. Then, we define the proper function of the consumer in terms of the evolutionary history of the entire symbiotic unit.

  However, this may merely relocate the problem. The symbiotic unit as a whole must have a function that is selected for. But the symbiotic unit's function would depend on the coordinated interaction of the producer and consumer. The problem then becomes: how do we assign functions to the subsystems (producer and consumer) without already presupposing the content of the representations? The symbiotic unit approach might help by providing a unified selection history, but it still requires that we decompose the unit's function into the functions of its parts. The circularity might reappear at the level of assigning functions to the parts: the function of the consumer part is to respond to the representation in a way that furthers the symbiotic unit's goals, but that response is defined by the content of the representation. Thus, we still need an independent account of how the content is fixed for the representation that the consumer is using.

  **Remaining Obstacle:**
  If the circularity is not resolved, the remaining obstacle is that we cannot non-circularly ground the representational content in a distributed architecture. Without an independent way to specify the consumer's function (without presupposing content), the theory fails to provide a naturalistic foundation for mental representation.

