answer: |-
  ### Explanation of the Conceptual Tension in Teleosemantics for Distributed Architectures

  **Core Framework:** Ruth Millikan’s teleosemantics grounds mental content in "proper functions"—evolutionarily selected effects that explain the existence of a trait. Content is fixed by the **consumer** of a representation: a state \( R \) means \( X \) if the consumer’s response to \( R \) was selected because it historically correlated with \( X \). For example, a neural state "means" *predator* if the consumer (e.g., flight circuitry) was selected for fleeing when predators are present. Misrepresentation occurs when \( R \) is tokened without \( X \) (producer error) or when the consumer reacts incorrectly to \( R \) (consumer error).

  **Tension in Distributed Architectures:** In symbiotic systems (e.g., human-AI interfaces or cross-species signaling), producers and consumers belong to **distinct biological systems** (e.g., a bird’s alarm call consumed by a meerkat). Here, the consumer’s proper function depends on successful responses to the producer’s representations. Yet, the content of those representations is *itself* defined by the consumer’s function. This risks circularity:  
  - **Content** is defined by the consumer’s selective success conditions (e.g., the meerkat’s response to a call "means" *eagle* only if fleeing improved fitness when eagles were present).  
  - **Consumer function** is defined by what it was selected *to do* (e.g., flee when eagles are present).  
  But if "eagles being present" is the *content* we’re trying to ground, and the consumer’s function presupposes that content, we have a loop: content depends on function, which depends on content.  

  **Producer vs. Consumer Misrepresentation:**  
  - **Producer-based misrepresentation**: The producer generates \( R \) in non-standard conditions (e.g., a bird’s alarm call triggered by a non-predator). Error arises from the producer’s failure to correlate \( R \) with \( X \) as per its evolutionary function.  
  - **Consumer-based misrepresentation**: The consumer reacts to \( R \) in a way that *would not* have been successful in selection history (e.g., a meerkat ignores an eagle-appropriate call). Error is a failure of the consumer to execute its selected response protocol.  
  In distributed cases, consumer misrepresentation is problematic because the consumer’s "correct" response depends on content that requires the consumer’s own history to define.  

  **Why This is Constitutive (Not Epistemic):** The circularity is not just about *identifying* functions (an epistemic issue) but about **grounding normative content**. Norms require non-arbitrary conditions for truth/success:  
  - For content to be naturalistically grounded, the conditions making \( R \) "true" (e.g., *eagle present*) must be fixed independently of the consumer’s function.  
  - But in distributed systems, the consumer’s function (e.g., *flee when eagles are present*) invokes those same conditions. This creates a **mutual dependence** where neither content nor function can be prior.  

  **Does Symbiotic Selection History Resolve the Issue?** Appealing to selection at the **symbiotic unit level** (e.g., bird-meerkat pair as a co-adapted "superorganism") attempts to break the loop by defining a unified proper function for the entire system. For example:  
  - The dyad’s function is "avoid predation," with sub-functions assigned to bird (produce \( R \) when eagles near) and meerkat (flee to \( R \)).  
  - Content is then fixed by the dyad’s success conditions (e.g., \( R \) means *eagle* only if fleeing to \( R \) improved the *dyad’s* fitness).  

  **Why This Relocates (Not Resolves) the Problem:**  
  - The dyad’s unified function depends on **decomposing** it into producer/consumer sub-functions.  
  - But this decomposition requires assigning content-based norms to subsystems (e.g., the meerkat’s role is "flee when \( R \) corresponds to eagles").  
  - Thus, we still need prior criteria to assign sub-functions: the consumer’s role presupposes representational success conditions (*eagles present*), which we aimed to ground via the dyad’s function. The circularity reappears at the subsystem level.  

  **Unresolved Obstacle:** If the circularity persists, the **normative content of representations** in distributed systems lacks a non-circular foundation. Without an independent way to fix the consumer’s function (or the dyad’s sub-functions), content remains "parasitic" on norms that themselves require content to be defined. This undermines teleosemantics’ promise to naturalize intentionality.  

