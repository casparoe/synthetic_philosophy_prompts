answer: |-
  You've articulated a profound and under-discussed epistemic asymmetry in historical explanation. While no single established term captures this **exact** phenomenon entirely, several related concepts and frameworks touch upon it, and it warrants precise naming and definition.

  **The Core Phenomenon: Outcome-Dependent Agency Attribution (ODAA)**

  We can define it as:
  > **Outcome-Dependent Agency Attribution (ODAA)** is a narrative pattern in historiography and science writing where non-human forces (pathogens, climate events, geological phenomena) are endowed with autonomous causal agency primarily *when* human societies experience significant negative outcomes (collapse, crisis, disruption). Conversely, when societies demonstrate resilience (stability, adaptation, recovery) in the face of comparable stresses, the same non-human forces are relegated to passive background conditions, and explanatory emphasis shifts entirely to human agency (institutions, choices, culture). The assignment of causal potency to the non-human entity is thus contingent on the *valence of the outcome* (crisis vs. continuity), not on a consistent principle of interaction or intrinsic properties of the force itself.

  **How ODAA Differs from Established Concepts:**

  1.  **Environmental Determinism:** Determinism posits a *consistent, primary, and often predictable* causal role for environmental/physical factors in shaping human societies (e.g., Jared Diamond's arguments in *Guns, Germs, and Steel*). ODAA is fundamentally *inconsistent* and *reactive*. The non-human force isn't consistently assigned power; its agency *inflates* specifically during crisis narratives and *deflates* during success narratives. Determinism is a theoretical stance; ODAA is an often-unexamined narrative *practice*.
  2.  **Symmetrical Interactionism/Co-Production (e.g., Actor-Network Theory - ANT):** These frameworks insist on analyzing human and non-human actors within the *same* analytical plane, recognizing their entangled agencies in producing outcomes, whether "good" or "bad". ODAA violates this symmetry. It *only* grants significant agency to the non-human when the human outcome is negative, breaking the constant joint tension.
  3.  **Collapsism/Disaster Narratives:** While these focus on explaining collapse, they don't inherently prescribe the *asymmetry* you identify. A robust collapsist narrative *could* consistently grant agency to non-human forces across cases (like determinism), or it could be symmetrical. ODAA is a specific *rhetorical trope within* such narratives.
  4.  **Hindsight Bias/Teleology:** ODAA shares a family resemblance with these cognitive biases. The outcome (crisis) retrospectively makes the non-human force appear overwhelmingly powerful and agentive, obscuring the complexity and contingency present *before* the outcome. However, hindsight bias is broader; ODAA specifically concerns the *differential attribution of agency* based on outcome valence.

  **Distinguishing Genuine Cases from ODAA Attribution Errors:**

  It's crucial to differentiate when ODAA is occurring as a flawed narrative device versus when the historical evidence genuinely supports a dominant role for either the non-human force or human adaptation. Key criteria:

  1.  **Intensity & Novelty of the Stressor:**
      *   **Genuine Dominance (Non-Human):** When the stressor is of *unprecedented* intensity or type (e.g., arrival of a novel, highly virulent pathogen in a completely immunologically naive population like the Americas post-1492; a volcanic eruption orders of magnitude larger than any in living memory). Human adaptations may be genuinely overwhelmed regardless of pre-existing strengths.
      *   **Genuine Dominance (Human Adaptation):** When the stressor falls *within the range of variability* the society had previously adapted to (e.g., a known drought cycle met by established water management systems; a known endemic disease managed by public health measures).
      *   **ODAA Signal:** Assigning dominant agency to a stressor of *moderate* or *known* intensity solely because a crisis occurred, *or* dismissing a genuinely massive/novel stressor as mere "background" because successful adaptation occurred (often overlooking the immense human effort required).

  2.  **Pre-Existing Vulnerabilities vs. Resiliencies:**
      *   **Genuine Dominance (Non-Human):** When the stressor acts upon a society already pushed to the brink by *independent* human factors (e.g., severe ongoing warfare, extreme inequality, ecological degradation) – the "final straw" scenario.
      *   **Genuine Dominance (Human Adaptation):** When robust institutions, diverse resource bases, strong social cohesion, or technological capacity demonstrably *mitigated* a significant stressor.
      *   **ODAA Signal:** Attributing crisis *primarily* to the non-human force while downplaying severe pre-existing human-caused vulnerabilities, *or* attributing resilience *entirely* to human agency while ignoring that the stressor was relatively mild or that luck played a role.

  3.  **Specificity of the Mechanism:**
      *   **Genuine Case:** The narrative provides a *specific, evidence-based mechanism* for *how* the non-human force directly caused the outcome (e.g., demonstrable demographic collapse from disease leading to labor shortages, triggering specific economic changes; ice core data linking volcanic aerosols to temperature drops causing crop failure evidenced in archaeological records).
      *   **ODAA Signal:** Vague, anthropomorphic language ("the plague reshaped society," "the volcano triggered unrest") used *instead* of specifying concrete mechanisms and evidence, especially when human institutional choices mediating the impact are poorly examined. Agency is asserted narratively, not demonstrated evidentially.

  4.  **Comparable Cases:**
      *   **Genuine Case:** Explanations are consistent when comparing societies facing *similar* stressors. If Society A collapses and Society B adapts under similar volcanic forcing, the explanation delves into the *differences* in human institutions/ecology *without* stripping the volcano of its causal role in *both* scenarios (it's a force both had to contend with).
      *   **ODAA Signal:** The volcano is described as an active agent *only* in the narrative of Society A's collapse. In Society B's success story, the volcano becomes mere "environmental context," and the narrative focuses solely on human ingenuity, masking the fact that the *same physical challenge* was present.

  **Criteria for Warranted Attribution:**

  Attributing significant causal agency to a non-human force is warranted when:

  1.  **Magnitude:** The force demonstrably exceeded the known adaptive capacity thresholds of the society in question (based on comparative evidence or modeling).
  2.  **Novelty:** The force introduced a fundamentally new variable the society had no prior experience or cultural/technological framework to handle.
  3.  **Direct Mechanism:** Clear, evidence-based pathways link the force directly to specific, critical social changes (demographic collapse, resource failure) that were primary drivers of the outcome.
  4.  **Consistency:** The attribution is applied consistently across cases facing comparable forces, regardless of outcome, with the outcome explained by the *interaction* between the force and the specific societal context (vulnerabilities/resiliencies).

  **Conclusion:**

  You've identified **Outcome-Dependent Agency Attribution (ODAA)** as a distinct and problematic pattern in historical narrative construction. It stems from a complex mix of hindsight bias, the dramatic appeal of disaster narratives, the human tendency towards anthropomorphism, and sometimes an under-theorized understanding of complex socio-ecological interactions. Distinguishing ODAA from genuinely warranted attributions requires careful attention to the **intensity and novelty of the stressor**, the **pre-existing state of the society**, the **specificity of causal mechanisms**, and **consistency in explanation across comparable cases**. Recognizing ODAA is crucial for developing more symmetrical, nuanced, and evidence-based historical explanations that avoid granting non-human forces "magical" agency only when human societies fail. It pushes historiography towards a more robust form of co-productionist or interactionist analysis.
