prompt: |-
  Right, I'm a novelist and I've been mulling over this weird intersection between automation and what work actually means. You're an expert in both the philosphy of labour and narrative craft — please think carefully, do a bit of brainstorming first, and then write everything in British English.

  So here's my frame: in fiction I work with diegetic labour (tasks characters actually perform that move the plot), expository labour (jobs mentioned but never shown), agency debt (when plot mechanics override a character's choice), and narrative surplus value (the extra thematic weight extracted when a human does something a machine could do). I'm fluent in that vocubulary but not in academic philosophy.

  Could you restate the main philosophical positions on work and automation — say, Marx's idea of alienation (not just feeling sad but separation from product, process, and others), Arendt's split between labour, work, and action, and the more recent worry that automation eats judgement not just manual skill — using only my narrative terms above? Be honest: don't smuggle in philosphical assumptions and call them transaltion.

  Then give me the residue report. Which parts map cleanly onto diegetic labour, agency debt, etc.? Which parts have to be distorted to fit? Is there anything in these philosophies — maybe Arendt's 'action' or Marx's 'species-being' — that has no counterpart in how I think about plot and character, and does that mean my framework is missing something, or that those concepts are vaguer than they look?

  Also, I've been toying with this niche idea I call 'plot-level deskilling' — the idea that when automation takes over a character's craft within the story, the narrative itself loses tension because the fabula collapses into pure syuzhet. Does that idea help carry any of the philosophical claims, or does it just muddy the water?

  Thanks — and please don't just list books or ask me to read anything, I want to work with what's already in the prompt.
reasoning: |-
  Alright, let's tackle this novelist's query. They're working with specific narrative terms and want to map philosophical concepts onto them without importing extra baggage. First, I need to parse their framework: diegetic labour (tasks shown), expository labour (mentioned but not shown), agency debt (plot overriding choice), and narrative surplus value (human doing machine-suitable tasks). 

  The key challenge is strict translation. Marx's alienation involves separation from product, process, and others. Using their terms: separation from product could be when a character's diegetic labour gets obscured by expository labour—like if a potter's crafting is skipped, reducing their connection to the vase. Separation from process might link to agency debt; if the plot forces a blacksmith to use a machine, their choices are overridden. Alienation from others could occur when collective diegetic labour is replaced by individual machine operation, turning communal work into isolated expository mentions.

  Arendt's distinctions: labour (biological necessity), work (world-building), action (unique deeds). Labour fits expository labour—background chores mentioned but not shown. Work aligns with diegetic labour that creates lasting objects, like a carpenter building a table. Action is trickier; it involves speech and deeds that reveal character. If action is only through dialogue without deeds, it might become expository, losing its essence. Agency debt could suppress action if plot mechanics prevent a character's decisive moment.

  Recent concerns about automation eating judgement: when machines handle decisions, diegetic labour loses moments where characters exercise skill. Narrative surplus value emerges when humans perform such tasks, highlighting themes. But if automation replaces judgement, agency debt might occur, making characters passive.

  Residue report: Alienation maps fairly well. However, species-being (humans realizing potential through work) doesn't fit neatly. If a character's craft is automated, deskilling the plot, it might mirror species-being loss, but it's more about narrative tension than human essence. Arendt's action struggles—it needs deeds and speech together. If a story only tells but doesn't show action, it becomes expository, missing the concept's core. This suggests their framework might overlook the interplay between dialogue and deed for character revelation.

  Plot-level deskilling: automating a character's craft removes diegetic labour, collapsing fabula (events) into syuzhet (plot presentation). This could illustrate how automation erodes judgement, as the narrative loses tension from skill-based conflict. However, it might not directly address alienation or action, focusing more on structure than philosophy. It helps show the stakes but needs tying to character agency to avoid muddiness.

  In summary, their terms handle Marx and judgement concerns decently but struggle with Arendt's action, which requires showing deeds and speech. Species-being remains outside, possibly indicating a gap in capturing existential fulfillment through work. Deskilling aids tension loss but should link to agency to carry philosophical weight.
answer: |-
  Right, let's dissect this with surgical precision, using *only* your narrative toolkit. No philosophical baggage smuggled in under a trenchcoat. Here's the translation and the residue report, as requested:

  **Philosophical Positions Translated via Narrative Terms:**

  1.  **Marx's Alienation (Product, Process, Others):**
      *   **Alienation from Product:** Occurs when the **diegetic labour** a character performs leads to an outcome they never see, control, or meaningfully connect to. The product becomes pure **expository labour** mentioned later ("Your widgets powered the city, Bob") while Bob's actual shown effort feels disconnected from that result. The narrative surplus value of *making* is lost to the character, siphoned off.
      *   **Alienation from Process:** Happens when **agency debt** forces a character into a specific, unchosen method of **diegetic labour** (e.g., using an automated loom they hate). Alternatively, the process itself becomes **expository labour** – the *how* of the work is skipped over ("He worked the night shift"), divorcing the character (and reader) from the act. The potential narrative surplus value of the *craft* is erased.
      *   **Alienation from Others:** Manifests when collaborative **diegetic labour** is replaced by isolated interaction with machines, turning former co-workers into mere **expository labour** ("the other weavers were laid off"). Or, **agency debt** dictates competition over collaboration, preventing meaningful connection *through* shared work shown on the page.

  2.  **Arendt's Labour, Work, Action:**
      *   **Labour (Biological Necessity - "Animal Laborans"):** Maps almost entirely to **expository labour**. These are the repetitive, life-sustaining tasks *mentioned* to establish setting or character circumstance ("she cleaned the house," "he tended the fields") but rarely shown in detail because they don't move the plot. They are the background hum, not the melody.
      *   **Work (World-Building - "Homo Faber"):** Primarily aligns with **diegetic labour** that has a tangible, lasting result *within the story world*. The carpenter building a table (shown), the scribe copying a manuscript (shown), the engineer repairing the bridge (shown). This is where **narrative surplus value** is most potent – the *human* act of creation/repair imbues the object/scene with weight. Automation replacing this directly attacks this value.
      *   **Action (Speech/Deeds - Unique Self-Revelation):** This is the trickiest. It *can* involve **diegetic labour** (a defiant act of sabotage, a skilled performance), but crucially, it often exists *outside* traditional labour. It's the speech or deed that reveals "who" someone is. Significant **agency debt** utterly *destroys* Action. If the plot mechanics force the character's hand, their "Action" is nullified; it becomes an expression of the plot, not the self. Action *without* consequence is often relegated to **expository labour** ("she made a stirring speech"). True "Action" requires both shown deed/speech *and* significant consequence to avoid agency debt.

  3.  **Automation Eating Judgement:**
      *   This occurs when automation handles not just the physical **diegetic labour**, but the *decisions* inherent in it. The character is left with hollowed-out **diegetic labour** (pushing a button when the light flashes) or the skilled/judgement-based aspect becomes **expository labour** ("the system diagnosed the fault"). This creates massive **agency debt** regarding skill application and problem-solving. The **narrative surplus value** lies precisely in showing the human *exercise of judgement* in a task – when that's automated, the value drains away unless the *loss* of judgement *is* the thematic point (which then creates its own surplus value of critique).

  **Residue Report:**

  *   **Clean Mappings:**
      *   Marx's Alienation (Product/Process/Others) -> **Expository Labour** (hiding product/process), **Diegetic Labour** disconnected from result, **Agency Debt** (forced process), loss of **Narrative Surplus Value**.
      *   Arendt's Labour -> **Expository Labour** (perfect fit).
      *   Arendt's Work -> **Diegetic Labour** creating lasting results + **Narrative Surplus Value**.
      *   Automation Eating Judgement -> Loss of **Narrative Surplus Value**, creation of **Agency Debt**, reduction of complex **Diegetic Labour** to simplistic or **Expository Labour**.
      *   The core *mechanism* of exploitation via surplus value (Marx) -> Extraction of **Narrative Surplus Value** when human effort is shown doing automatable tasks.

  *   **Distortions Required:**
      *   **Arendt's "Action":** This is the biggest stretch. Your framework handles *deeds that move the plot* (**diegetic labour**) and *significant choices* (resisting **agency debt**). But "Action" as unique self-revelation through speech/deed *for its own sake* isn't perfectly covered. A purely revelatory speech that *doesn't* directly move the plot might fall into weak **expository labour** or feel like indulgent **diegetic labour** without clear plot propulsion. Capturing its *essence* requires emphasizing the *resistance to agency debt* and the **narrative surplus value** generated specifically by *unpredictable, self-revealing* human speech/acts, even if their plot function is secondary. It highlights a potential gap in your framework regarding *non-instrumental* character revelation.
      *   **Marx's "Species-Being":** This concept (humans realising their essence through free, conscious production) is abstract. It maps *vaguely* onto the **narrative surplus value** generated by meaningful, self-directed **diegetic labour** *not* subject to **agency debt** or alienation. But it's more of an underlying *potential* or *theme* your terms can *express* (through their presence or absence) rather than a discrete element. It doesn't have a direct counterpart; it's the ghost in the machine your framework can make visible through negation.

  *   **Unmapped Concepts & Implications:**
      *   **Arendt's "Action":** As above, its essence of *non-instrumental self-revelation through word/deed* isn't perfectly captured. **Diegetic labour** is instrumental (moves plot). Resisting **agency debt** is about reclaiming instrumental control. **Expository labour** skips the revelation. This suggests your framework, focused on plot mechanics, might under-emphasize moments where character is revealed *through* action that *isn't* primarily about advancing the plot, but about *being* in the world. It doesn't mean your framework is deficient *for plotting*, but that this philosophical concept highlights a different narrative priority (character ontology vs. plot mechanics).
      *   **Marx's "Species-Being":** Its vagueness *is* part of the issue. It's an ideal state, not a narrative device. Your terms excellently show its *absence* (via alienation, agency debt, loss of surplus value), but not its positive presence as a tangible force. This doesn't indicate a flaw in your framework; it indicates that "species-being" functions more as a philosophical abstraction or utopian ideal than a concrete narrative component. Your tools are better at diagnosing the disease than depicting perfect health.

  **Plot-Level Deskilling Assessment:**

  Your "plot-level deskilling" concept is **highly resonant and useful** for carrying philosophical weight, *especially* the "automation eats judgement" concern and Marxian alienation.

  *   **How it Carries Philosophy:**
      *   **Judgement Erosion:** If automation removes the need for a character's skilled judgement within the **diegetic labour**, the narrative tension *does* collapse. The "fabula" (the raw events – the machine works or doesn't) becomes simple, leaving only the "syuzhet" (how it's presented – do we focus on the operator's boredom? The system's cold efficiency?). This *directly illustrates* the loss of human judgement as a source of complexity, risk, and meaning – core to the philosophical worry. The *plot itself* becomes deskilled.
      *   **Alienation Amplified:** Deskilling the plot mirrors the character's deskilling. The narrative loses the richness derived from showing the *struggle*, the *decision points*, the *embodied knowledge* of the craft (**diegetic labour**). This loss *is* the manifestation of alienation from process and the erosion of **narrative surplus value**. The story becomes flatter, just as the work does.
      *   **Surplus Value Theft:** The narrative tension/value that *would* have been generated by the human skill is now absent. The "surplus" is gone; the plot runs on the bare minimum mechanics.

  *   **Risk of Muddying:**
      *   The risk lies *only* if applied too broadly or simplistically. Not all automation in a story causes plot deskilling. Sometimes, the *failure* of automation, or the *human response* to it (resistance, adaptation, new skills emerging) *is* the source of tension and **narrative surplus value**. Deskilling specifically describes the *loss of tension due to the removal of human skill/judgement from the causal chain of events*. Used precisely to describe *that specific narrative consequence*, it's a powerful conceptual tool that vividly embodies the philosophical stakes.

  **In Summary:** Your narrative terms provide a remarkably robust and precise vocabulary for translating core philosophical concerns about work and automation. The mappings are strongest for alienation, the instrumental aspects of work, and the mechanics of automation replacing function. Arendt's "Action" exposes a slight bias in your framework towards *instrumental* deeds over *revelatory* ones. Marx's "Species-Being" remains an abstract ideal your framework can critique the absence of, but not embody. Your "plot-level deskilling" is a brilliant conceptual lever for showing the *narrative cost* of automation eating judgement – it doesn't muddy the waters; it gives the philosophy tangible narrative stakes. Keep honing that one. This is fertile ground for fiction.
