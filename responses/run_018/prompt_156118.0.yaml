answer: |-
  Here’s a precise translation of prioritarianism and the leveling-down objection into your operational framework, followed by a residue report highlighting mismatches and practical implications for ICU triage. No analogies—direct mapping with friction points exposed.

  ---

  ### **Parfit-Style Prioritarianism Restated in Triage Terms**  
  **Core Principle:**  
  *Weighted QALY Maximization Based on Lifetime Disadvantage.*  
  When allocating scarce resources (e.g., ICU beds), prioritize interventions that deliver the **greatest *priority-weighted* QALY gain**. Weighting depends on the patient’s **lifetime health prospects**: identical QALY gains are assigned higher priority if the patient has lower *expected lifetime QALYs* due to pre-existing disadvantage (e.g., chronic illness, disability, or social determinants of health).  

  **Formula:**  
  Priority Weight = `1 / (Baseline Lifetime QALY Prospect)^k`  
  *(Where `k` is an inequality-aversion parameter; `k>0` means worse-off patients get amplified QALY gains)*  

  **Operational Example:**  
  - **Patient A:** Expected lifetime QALYs = 10 (e.g., young, severe COPD).  
  - **Patient B:** Expected lifetime QALYs = 30 (e.g., healthy 40yo).  
  - **Identical intervention** grants both +5 QALYs.  
  - *Prioritarianism:* Patient A’s gain is weighted higher (e.g., 1.5x) due to lower baseline. A wins the bed if `(5 * 1.5) > 5`.  

  ---

  ### **Leveling-Down Objection in Triage Vocabulary**  
  **Scenario:** Two patients need the last ICU bed.  
  - **Option 1:** Give bed to Patient B (baseline QALYs=30), granting +5 QALYs. Total utility: 35.  
  - **Option 2:** *Withhold the bed from B* to avoid inequality. Outcome:  
    - Patient A (baseline=10) gets no gain (remains at 10 QALYs).  
    - Patient B gets no gain (remains at 30 QALYs).  
    - **Result:** Equality achieved (both at low QALYs), but *both are worse off* than if B received the bed.  

  **Objection:** Leveling-down is ethically indefensible in rationing because it **sacrifices net QALY gain solely to reduce inequality**, violating the "no-worse-off" principle (i.e., never choose an outcome where *everyone* is at least as badly off and *someone* is worse off).  

  ---

  ### **Residue Report: Mapping Philosophy to Triage Protocols**  
  | **Concept**               | **Clean Map to Triage**                                  | **Fudging Required**                                                                 | **Broken Parts**                                                                 |  
  |----------------------------|----------------------------------------------------------|-------------------------------------------------------------------------------------|----------------------------------------------------------------------------------|  
  | **Prioritarianism**        | Prioritizing patients with poorer *long-term prognoses* when benefits are equal. | Requires comparing *lifetime QALYs* across patients—often speculative (social determinants rarely quantified). | Weighting factor (`k`) is arbitrary. No consensus on *how much* extra weight to give disadvantage. |  
  | **QALY as Well-being Proxy** | Aligns with cost-effectiveness protocols.                | Assumes QALYs capture "well-being" identically across patients (e.g., 1 QALY for a paraplegic vs. able-bodied). Ignores non-health utilities (e.g., caregiver dependence). | Futility thresholds often override QALY math (e.g., <1% survival = no bed, regardless of baseline disadvantage). |  
  | **Leveling-Down**          | *No clean map.* Withholding care to enforce equality violates clinical ethics. | In practice, the objection prevents protocols from denying care *to better-off patients* purely to avoid unequal outcomes. | ICU triage is *never* zero-sum equality-driven; it’s QALY/ survival-maximizing under scarcity. The "counterpart" is nonexistent. |  
  | **"Sickest First" vs. Prioritarianism** | **Your gut misses a key distinction:**<br>- *Sickest first:* Prioritizes **worst *current acuity*** (e.g., SOFA score).<br>- *Prioritarianism:* Prioritizes **worst *lifetime prospects***. | Example: A chronically ill teenager (lifetime QALYs=15) vs. a septic otherwise-healthy octogenarian (lifetime QALYs=5). Prioritarianism favors the teen *even if the octogenarian is "sicker" now*. | Triage protocols often conflate *acuity* with *disadvantage*. Philosophers debate *lifetime disadvantage*—a concept most hospital protocols lack tools to operationalize. |  

  ---

  ### **ICU Bed Allocation: Does Leveling-Down Matter?**  
  **Short answer:** No—but prioritarianism’s weighting *does* create tension with standard utilitarianism.  
  - **Real-world choice:** Between Patient A (low lifetime QALYs, high acute gain) and Patient B (high lifetime QALYs, equal acute gain).  
    - *Utilitarianism:* Allocates to whoever gets the highest *unweighted* QALY gain (B wins if lifetime prospects are ignored).  
    - *Prioritarianism:* May allocate to A if baseline disadvantage outweighs B’s higher absolute gain.  
  - **Leveling-down?** Withholding the bed to avoid A losing to B would *never* occur—net harm with no benefit violates the "do no harm" principle. The objection exists to reject *equality as a standalone good*, which isn’t operative here.  

  ---

  ### **Bottom Line**  
  1. **"Sickest first" ≠ prioritarianism.** The latter weights *lifetime disadvantage*, not acuity—a distinction most triage protocols blur (or ignore).  
  2. **Leveling-down is irrelevant to bed allocation** but exposes a deeper tension: prioritarianism *deliberately reduces aggregate QALYs* to benefit the worse-off. In crises, protocols default to utilitarianism (+QALY max) or deontology (e.g., "save the young").  
  3. **What philosophers argue that your framework can’t express:**  
     - The moral weight of *lifetime disadvantage beyond acute illness* (e.g., should a polio survivor’s prior suffering boost their claim to COVID ventilation?).  
     - Whether QALYs *should* be weighted for disadvantage—or if doing so discriminates against the healthy (the "disability paradox" critique).  

  **Your framework’s blind spot:** Prioritarianism demands we quantify and compare **pre-existing disadvantage** in QALY terms—a task that’s either speculative (lifetime projections) or ethically fraught (assigning lower "value" to healthy lives). In practice, this collapses into "acuity + life years" utilitarianism, with disadvantage unmeasured. The philosopher’s debate isn’t about triage rules—it’s about whether our rules *should* embed disadvantage-weighting. Your gut isn’t wrong; it’s constrained by operational reality.
