  Then they embrace the "rules are constitutive" response in (b), which seems contradictory at first glance. If rules define reasoning, why can't that answer the Tortoise? I need to tease apart why these might actually coexist. Maybe (a) is about ultimate justification while (b) is about practical necessity? 

