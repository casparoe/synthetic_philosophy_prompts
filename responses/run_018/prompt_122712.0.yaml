prompt: |-
  Hi — I run a tiny podcast for policy grad students, and my guest next week is a philosopher who's just finished a paper defending what she calls "steep prioritarianism". The short version: instead of plugging everyone's welfare into one concave function and adding it up, she multiplies each person's benefit by a priority weight that falls off really fast as their lifetime welfare rises — fast enough that the weighted sum sometimes ranks an outcome where every single person is worse off above one where every single person is better off (her stock example: two people at 10 and 100 versus both at 5). She thinks that's the right answer, not a reductio.

  I dont want the episode to be her restating the view for forty minutes. Can you draft eight to ten questions, each with a follow-up keyed to the answer she's most likely to give? I'd like at least one on:

  (a) whether the steepness is even coherent — as I understand it, once the weights fall faster than one-over-welfare the weighted sum stops being increasing in anyone's welfare, so I want a question that forces her to say whether she's genuinely given up monotonicity or is quietly helping herself to the concave-function formulation;
  (b) the sequential version I keep getting stuck on: if levelling down improves the weighted sum at each step, does she accept a kind of ratchet where a long series of individually sanctioned levellings drives everyone toward the floor, and if not, what exactly breaks the chain;
  (c) whether she should just bolt on a Pareto side-constraint and let priority operate only among Pareto-optimal options, and whether that makes the steepness idle;
  (d) whether a view that permits levelling down is still distinguishable from plain telic egalitarianism — what the weighting buys her over just saying inequality is intrinsically bad;
  (e) the zero-point worry: if the weights are a function of absolute welfare, does shifting the zero of the welfare scale (neutral level versus a life not worth living) flip her verdicts;
  (f) how you'd ever calibrate how steep is steep enough.

  Assume she'll deflect with things like "Pareto is only a heuristic" and "levelling down is only counterintuitive if you've got person-affecting intuitions you havent earned", and build the follow-ups around that. End with one question about what kind of argument or evidence could actually change her mind.
reasoning: |-
  Okay, the user runs a small policy podcast and is interviewing a philosopher who advocates for "steep prioritarianism." They need 8-10 questions with follow-ups targeting specific issues like coherence, sequential leveling down, Pareto constraints, egalitarianism, zero-point calibration, and evidence for changing her view. 

  First, I need to unpack her core argument. Her view weights individual welfare inversely to their lifetime welfare, so higher welfare gets rapidly diminishing priority. This leads to scenarios where leveling down—making everyone worse off but more equal—is preferred, like her example of (10,100) over (5,5). 

  The user wants questions that challenge her without letting her restate the view. Key angles: 

  Monotonicity (Question 1): If weights fall faster than 1/welfare, the sum might decrease when someone's welfare increases. Her response might involve rejecting monotonicity. The follow-up should press whether she openly abandons it or hides behind concavity. 

  Sequential Leveling (Question 2): If each small leveling step improves the sum, does this lead to everyone at the floor? She might say no due to thresholds. The follow-up asks where these thresholds come from and if they're arbitrary. 

  Pareto Constraints (Question 3): Why not add a Pareto constraint to avoid leveling down? She might call Pareto a heuristic. Follow-up challenges if steep weights become redundant if Pareto always binds. 

  Egalitarianism Distinction (Question 4): How is this different from telic egalitarianism? She may emphasize priority to the worst-off. Follow-up questions if the weighting adds anything beyond inequality aversion. 

  Zero-Point (Question 5): Welfare's zero point affects weights. Changing it could flip judgments. Follow-up asks how she anchors welfare without circularity. 

  Calibration (Question 6): How steep is steep enough? She might appeal to moral intuition. Follow-up questions if intuitions are reliable here. 

  Evidence (Question 7): What could change her mind? She might dismiss empirical evidence. Follow-up probes if the view is unfalsifiable. 

  The user anticipates deflections like "Pareto is heuristic" or "leveling down counters person-affecting views." Follow-ups need to cut through these. For instance, if she rejects Pareto as unearned, ask why prioritarianism isn't equally unearned. 

  Ending with what could change her mind tests the robustness of her position. If nothing would, it might be dogma. 

  Need to ensure questions are concise and force clear answers. Avoid letting her retreat to restating the view. Each follow-up should target potential evasions.
answer: |-
  Here are 8 targeted questions with anticipated deflections and sharp follow-ups, designed to push the discussion beyond restatement and into core tensions:

  1.  **Question:** Your core move is replacing a concave transformation with rapidly decaying priority weights. But mathematically, if weights decay faster than 1/utility, the *weighted sum itself* can decrease when *any single individual's welfare increases* (e.g., raising someone from near-zero to low-but-positive might decrease the sum due to their vanishing weight). Is abandoning Monotonicity – the idea that making someone better off without harming others improves the outcome – a *deliberate feature* of steep prioritarianism, or a sign the formalisation is broken?
      *   **Anticipated Deflection:** "Monotonicity assumes additive separability we reject," or "Gains for the well-off are morally negligible."
      *   **Follow-Up:** If abandoning Monotonicity *is* deliberate, doesn't this fundamentally sever the link between individual benefit and social good? Can you describe a scenario where making *every single individual* slightly better off (without changing distribution) actually makes the outcome *worse* according to your weighted sum? If that's possible, how is this not a decisive objection?

  2.  **Question:** Your (5,5) > (10,100) example involves one drastic leveling-down step. But imagine sequential, tiny levelings: Start from (100, 100). A small downward adjustment to (99.9, 99.9) plausibly *increases* your priority-weighted sum due to the steep decay. Repeat this tiny step millions of times. Doesn't your principle *ratchet* us inevitably towards (0,0) or the welfare floor, sanctioning each step individually?
      *   **Anticipated Deflection:** "That's a sorites paradox; thresholds matter," or "Real-world choices aren't infinitesimal."
      *   **Follow-Up:** Where does the ratchet *break*? Is there a specific welfare level where the weight decay abruptly stops or reverses? If not, and each micro-leveling is sanctioned, how do you avoid endorsing the slide to the floor? If you *do* need thresholds, how are they determined without arbitrariness, and doesn't that reintroduce something like the concave function you wanted to avoid?

  3.  **Question:** Many prioritarians add a Pareto principle as a side-constraint: only apply weights *among* Pareto-optimal options. This blocks leveling down. Why not adopt this? Does steep prioritarianism *need* the power to violate Pareto to do its distinctive work?
      *   **Anticipated Deflection:** "Pareto is merely a heuristic, not foundational," or "It smuggles in person-affecting assumptions."
      *   **Follow-Up:** If you *did* add a strict Pareto constraint ("If A is better for *someone* and worse for *no one* than B, then A > B"), would steep prioritarianism ever actually override an equal distribution? Doesn't making everyone equal (and worse off) become Pareto-inferior to unequal but better-off distributions? If the weights only operate *after* Pareto-filtering, isn't the extreme steepness rendered practically idle? What specific pairwise choice does Pareto-unconstrained SP make that Pareto-constrained SP gets "wrong"?

  4.  **Question:** Telic egalitarians also rank (5,5) > (10,100) because they value equality intrinsically. What does the *priority weighting* framework buy you over simply saying "inequality is intrinsically bad"? Isn't steep prioritarianism just egalitarianism in a fancy hat?
      *   **Anticipated Deflection:** "Priority focuses on the *absolute* position of the worst-off, not just relative gaps," or "Equality values the pattern; priority values helping the worst-off."
      *   **Follow-Up:** But in your stock example, both people in (5,5) are *absolutely worse off* than in (10,100). The priority weight seems keyed to *relative welfare level* (high=low weight). If the absolute well-being of the worst-off drops dramatically (as in going from 10 to 5), but a larger relative gap is closed, how does this distinguish your concern from intrinsic concern for equality? Does SP *ever* prefer an unequal outcome where the worst-off are better off *absolutely* over a perfectly equal one where they are worse off? If not, where's the practical difference?

  5.  **Question:** Priority weights are a function of absolute welfare levels. This seems critically dependent on the "zero point" – the distinction between a life worth living and not. If we shift the zero point (e.g., defining zero at "neutral" vs. "barely worth living"), does this flip your judgments about which outcomes are better? For instance, could (5,5) relative to one zero become worse than (10,100) relative to another?
      *   **Anticipated Deflection:** "The zero point is fixed by the nature of welfare/experience," or "We work with the best available scale."
      *   **Follow-Up:** But different theories of well-being (hedonism, desire satisfaction, objective lists) plausibly anchor the zero point differently. If the moral permissibility of leveling down hinges on whether we set zero at 'neutral' or 'barely worth living', doesn't that make your view hostage to unresolved meta-ethical debates about welfare measurement? How can SP be action-guiding if its core prescriptions are this sensitive to the (disputed) calibration of the welfare scale?

  6.  **Question:** "Steep" is doing a lot of work. How do we calibrate *how* steep the decay must be? Is there a principled argument why the decay must be fast enough to sometimes prefer (5,5) over (10,100), but not so fast that (1,1) is always better than (100,1000)? Or is the steepness parameter essentially adjustable to fit pre-theoretic intuitions about specific cases?
      *   **Anticipated Deflection:** "The steepness reflects the urgency of aiding the worst-off," or "It's determined by the moral imperative to prevent dire deprivation."
      *   **Follow-Up:** But how does "urgency" or "imperative" translate into a specific mathematical decay rate? Is there an *upper bound* on steepness? If (5,5) > (10,100) is required, but (1,1) > (100,1000) is absurd, what principle draws the line? Doesn't the need to avoid obviously absurd conclusions (like preferring near-zero for all) mean we *must* cap the steepness, undermining the core claim that leveling down is *required* when the gap is large enough?

  7.  **Question:** You've mentioned skepticism of "person-affecting" intuitions that make leveling down seem problematic. But doesn't steep prioritarianism itself rely *heavily* on a person-affecting foundation? The weights are assigned *to individuals* based on *their welfare*. What makes the intuition against harming individuals to adjust their weight "unearned," while the intuition to weight based on their individual welfare level is fundamental?
      *   **Anticipated Deflection:** "Priority is fundamentally *impersonal*; it's about the overall weighted state, not benefiting/harming specific persons."
      *   **Follow-Up:** If the view is truly impersonal, why does it care about the distribution *of individual welfares* at all? Why not care about some other impersonal pattern (e.g., total aesthetic value)? Doesn't grounding the weights in *individuals' welfare levels* necessarily reintroduce a person-affecting element that your dismissal of anti-leveling-down intuitions tries to sidestep? Isn't there a tension here?

  8.  **Question (The Closer):** Philosophers often talk about views being falsifiable or having "doubt conditionals." What kind of argument, thought experiment, or real-world observation could, in principle, convince you that steep prioritarianism is incorrect, or at least that the steepness shouldn't override Pareto? Is there *any* conceivable evidence against it?
      *   **Anticipated Deflection:** "It coheres best with our deepest considered judgments about justice," or "Opposing arguments rely on assumptions SP rejects (e.g., strong Pareto)."
      *   **Follow-Up:** If coherence with *some* intuitions (like the (10,100) vs. (5,5) case) is the main support, and counter-intuitive implications (like the ratchet or abandoning Monotonicity) are dismissed because they rely on intuitions you deem problematic, doesn't this risk making the view effectively unfalsifiable? If *no* consequence – no matter how extreme or seemingly unacceptable – counts as evidence against the core steepness mechanism, what distinguishes SP from a deeply held intuition that's insulated from criticism?

  **Key Strategies Embedded:**
  *   **Forcing the Monotonicity Point:** Q1 directly confronts the mathematical consequence and demands clarity on whether it's accepted, avoiding a retreat into vagueness.
  *   **Pressing the Ratchet:** Q2 makes the sequential problem vivid and demands a stopping mechanism.
  *   **Exposing Idleness/Pareto Tension:** Q3 challenges whether the steepness matters *without* violating Pareto.
  *   **Egalitarianism Challenge:** Q4 pushes for a clear distinction beyond terminology.
  *   **Zero-Point Vulnerability:** Q5 highlights sensitivity to a major unresolved issue in welfare economics.
  *   **Calibration Demand:** Q6 asks how "steep" is defined non-arbitrarily.
  *   **Person-Affecting Tension:** Q7 turns the "unearned intuitions" charge back on the view itself.
  *   **Testing Falsifiability:** Q8 probes the view's resilience and whether it's open to revision.

  These questions are designed to cut past restatement and force engagement with the most philosophically and practically challenging implications of her view, anticipating her likely defenses and pushing further. Good luck with the interview!
