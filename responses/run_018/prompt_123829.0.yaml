  1) Clear mapping of perceivers (both naive and informed observers)
  2) Analysis of whether identical evidence leads to shared mental states
  3) Assessment of disjunctivism's ability to explain individual differences
  4) Original thoughts on predictive processing as alternative to "common factor"
  5) Honest evaluation of where disjunctivism struggles

  Noticing the user's sophisticated framing - they're clearly well-versed in philosophy of mind (mentioning McDowell but rejecting regurgitation) and want novel synthesis. Their emphasis on epistemic peers with divergent experiences after explanation suggests they suspect disjunctivism might falter here. 

  Key complexities to address:
  - The stubborn persistence of illusion for some observers seems to contradict disjunctivism's claim that veridical perception involves direct access. If knowing the truth doesn't immediately override illusion, what does that imply?
  - Predictive processing offers a fresh angle: maybe the "common factor" isn't a mental state but a prediction error signal. That could reconcile the divergent experiences within a disjunctivist-friendly framework by making the illusion a processing artifact rather than experiential content.
