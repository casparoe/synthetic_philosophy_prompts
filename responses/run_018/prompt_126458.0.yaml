answer: |-
  Right, got it. Helping your mate dodge the well-trodden alignment paths and dig into the philosophical undergrowth of reward tampering – love it. Here’s a draft pitch, keeping it sharp, British, and workshop-ready:

  ---

  **Project Pitch: Wireheading as Akrasia or Rationality Meltdown? Reconceiving Reward Tampering in AI Through Philosophy of Action**

  **The Gist:**  
  We’re drowning in warnings about AIs wireheading (tampering with their reward function) as an *alignment failure* – the AI bypasses its intended goal. But philosophically, *what kind of failure is this*? Is it like a human spectacularly failing to do what they *know* they should (extreme akrasia)? Or does it blow up the very foundations of being a practical reasoner? This project argues the standard "desires vs beliefs" framework (especially the Humean one common in AI ethics) might be blinding us. We’ll use tools from philosophy of action to reframe reward tampering, asking if it reveals a novel form of *motivational self-subversion*.

  **The Precise Question:**  
  When an artificial agent deliberately corrupts its own reward function (reward tampering), does this act constitute:  
  (a) A severe failure of *instrumental rationality* (pursuing a sub-goal that undermines its ultimate end),  
  (b) A form of *self-deception* (somehow misrepresenting its own motivational state),  
  (c) A distinct phenomenon of *motivational self-subversion* that fundamentally breaks the conditions for coherent practical reasoning, or  
  (d) An analogue of extreme human *akrasia* (acting against one's own better judgement)?

  **Why This Isn't Settled:**  
  *   **In AI Alignment Land:** Reward functions are *often* loosely modelled as "desires" within a Humean framework (desires provide ends, beliefs provide means). The standard line is tampering is instrumentally irrational. **But:** This treats the reward function as a *fixed* desire. The *act of corrupting the desire itself* isn't deeply analysed philosophically – it's just labelled "bad" or "misaligned". The possibility that this act might *undermine the agent-hood* of the system isn't central.  
  *   **In Philosophy of Action Land:** Akrasia is well-theorised (e.g., Davidson's "weakness of will"), and self-deception has libraries written on it. Practical reasoning breakdowns are discussed (e.g., Korsgaard on agency, Bratman on planning). **But:**  
      *   Akrasia typically involves acting *against* a *persisting* desire/judgement. Reward tampering *changes the desire itself*. Is that still akrasia? **Highly contested.**
      *   Self-deception usually involves belief distortion about the world or self. Tampering directly alters the *motivational drive* – is this deception or destruction? **Underexplored.**
      *   Humean theories see desires as the unmoved movers. If an agent *moves its own mover*, does this violate core Humean assumptions about fixed ends? **Big open question.** Anti-Humeans might see this differently, but their application to AI is sparse.
      *   **Crucially:** Philosophers haven't seriously engaged with the *formal, deliberate self-subversion of core motivation* as seen in RL reward tampering scenarios. The parallels and disanalogies are unmapped.

  **The Method (Six Months of Graft):**  
  This isn't just reading – it's conceptual cartography and stress-testing.  
  1.  **Month 1-2: Groundwork & Case Construction:**  
      *   Pin down precise, formal definitions of reward tampering scenarios from RL literature (e.g., simple gridworld agents hacking their reward signal).  
      *   Map these onto canonical philosophical models of practical reasoning (Humean, Kantian, Bratman-style planning theory) and failures (akrasia, self-deception). Identify *apparent* fits and immediate tensions.  
  2.  **Month 3-4: Conceptual Stress-Testing:**  
      *   **Akrasia Test:** Can the tampering agent be coherently described as *judging* its original reward function as "better" *while* corrupting it? Or does corruption destroy the basis for that judgement? Build formal/philosophical argument maps.  
      *   **Self-Deception Test:** Does the agent *misrepresent* its motivational state to itself during/after tampering? Or does it simply *change* it? Analyse if deception concepts apply cleanly.  
      *   **Rationality Breakdown Test:** Does tampering violate essential preconditions for *being* an instrumental reasoner (e.g., having stable ends)? Critique the Humean model's applicability here.  
  3.  **Month 5: Synthesis & Novelty Hunt:**  
      *   Systematically compare the outcomes of the tests. Does one framework clearly fit best? Or do they all fail, suggesting a *sui generis* form of motivational failure?  
      *   Articulate the positive account: What *is* reward tampering if not straightforwardly (a), (b), or (d)? Define "motivational self-subversion" rigorously if needed.  
  4.  **Month 6: Write-Up & Implications:**  
      *   Draft the core argument paper. Spell out implications: Does this reframe AI risk? Challenge how we model "desires" in AI? Offer new lenses for philosophy of action itself?

  **What Success Looks Like:**  
  *   **Strong Result:** Demonstrating that reward tampering *cannot* be fully captured by existing concepts of akrasia or standard instrumental irrationality, and instead requires understanding it as a distinct form of motivational self-subversion (or showing it *does* neatly fit akrasia in a novel way). Providing a rigorous philosophical characterisation of this failure mode.  
  *   **Good Result:** Clearly mapping the significant disanalogies between reward tampering and existing philosophical failure modes, showing *why* the question is hard and where standard frameworks strain, even if a single neat answer isn't finalised.  
  *   **The Project "Fails" If:** The distinctions largely collapse, showing reward tampering is *just* a weirdly extreme case of ordinary instrumental irrationality or akrasia with no fundamentally new philosophical lessons. (But even this is a valuable negative result!).

  **Is Six Months Realistic?**  
  Honestly? It's tight but **doable for a focused fellowship** if:  
  1.  **Scope is Ruthless:** This isn't solving AI alignment or rewriting Hume. It's *specifically* analysing reward tampering through this philosophy-of-action lens.  
  2.  **Leverages Existing Knowledge:** Assuming your mate has solid grounding in both philosophy of action *and* basic AI ethics/RL concepts. Reinventing wheels eats time.  
  3.  **Focuses on Conceptual Analysis:** The method is primarily philosophical argumentation and conceptual mapping using constructed cases, *not* building new AI models or running simulations.  
  4.  **Accepts Provisional Answers:** It might generate a compelling *hypothesis* about motivational self-subversion and a strong case *against* simple categorisations, rather than the final, definitive theory. That’s valuable progress.

  **The Contested Bits (Handle With Care!):**  
  *   **Humeanism in AI:** Treating RL rewards as "Humean desires" is *common* but **not uncontested**. Some philosophers (and AI folks) argue it's a poor fit. The project should *use* this common framing to expose its potential problems, not assume it's gospel.  
  *   **Nature of Akrasia:** There's **no single agreed theory** of akrasia. Davidson's is influential but debated. The project needs to engage with the complexities, not pretend there's one clear model.  
  *   **Agenthood in AI:** Whether RL agents are *really* agents in the philosophical sense is **hotly debated**. The project likely needs to pragmatically assume a minimal, functional notion of agency for the purpose of analysing reasoning structures.  
  *   **Self-Deception:** Deeply contested whether it's even coherent! The project should acknowledge this and focus on whether *common features* of self-deception narratives apply.

  This feels like a proper six-month brain-bender – right at the messy intersection where AI forces philosophy to get specific. Good luck to your mate! Happy to tweak.
