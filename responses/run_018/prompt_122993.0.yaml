  ### Part 3: Residue Report

  We map philosophical notions to the RL framework:

  - **Judgment**: The agent's assessment of the best course of action. 
    - *Translation*: In RL, this is typically the argmax of the Q-function (or the value function) in a model-based system. 
    - *Loss*: In model-free systems, there might be no explicit judgment; the policy is habitual. We need to add a model-based evaluator to represent judgment.

  - **All-things-considered judgment**: The overall, deliberative assessment.
    - *Translation*: The output of a full planning process (e.g., the optimal Q-values from solving the MDP with the true rewards and dynamics).
    - *Loss*: Requires a model-based system.

  - **The better judgment one acts against**: 
    - *Translation*: When the agent takes an action that is not the argmax of its Q-function (e.g., due to Boltzmann exploration or a separate habit system). 
    - *Loss*: Only captured if we have a separation between the evaluator (which provides the judgment) and the actor (which may not follow it).

  - **Intention or plan**: 
    - *Translation*: In RL, this might be a policy or a temporally extended action (option). Hierarchical policies can represent intentions.
    - *Loss*: The standard framework does not require explicit intentions; they are implicit in the policy. To explicitly represent plans, we need hierarchical RL or options.

  - **The effort of self-control, or willpower**: 
    - *Translation*: This can be modeled as a cost for deviating from a default policy, e.g., using a KL divergence penalty in the objective (as in KL-regularized control). Alternatively, in models with a limited resource, it might be a separate state variable.
    - *Loss*: The standard framework does not have this; we need to add a penalty or a resource constraint.

  - **Temptation**: 
    - *Translation*: Actions that yield high immediate reward but conflict with long-term goals. In RL, these are actions that have high immediate reward but lead to states with low long-term value.
    - *Loss*: The concept is present in the trade-off between exploration and exploitation, but not explicitly labeled.

  - **Regret**: 
    - *Translation*: The difference between the value of the optimal policy and the agent's performance. In RL, we often compute regret bounds in online learning.
    - *Loss*: The agent does not typically experience regret internally; it is an external measure.

  - **The claim that the agent could have done otherwise**: 
    - *Translation*: In stochastic policies, the agent might have chosen a different action. In deterministic policies, it could not. But the framework does not have a notion of free will.
    - *Loss*: This is a counterfactual claim. In RL, we can simulate what would have happened if the agent had chosen differently, but the agent itself does not have access to that.

  - **Blameworthiness**: 
    - *Translation*: Not present in the standard framework. Might be related to the agent's knowledge and intentionality, which are not represented.
    - *Loss*: Requires a theory of responsibility, which is outside RL.

  - **The agent itself, considered as the same thing over time**: 
    - *Translation*: In RL, the agent is typically modeled as a single entity optimizing over time, but in time-inconsistent discounting, we use multiple selves. The framework does not resolve the philosophical issue of personal identity.
    - *Loss*: The tension between the single-agent and multiple-selves view is not resolved.

  **On the claim that the agent knew better and did it anyway**: 
    - In the serial recertification task, this would correspond to the agent having a model-based evaluation that action A is best, but taking action B. In our framework, this requires a separation between the model-based evaluator and the policy. From observed behavior alone, without access to the agent's internal evaluations, we cannot distinguish between:
        (a) The agent values A higher but stochastically chooses B.
        (b) The agent has a different valuation (e.g., due to present-bias) that makes B subjectively better.
    - Therefore, without self-reports or neural measurements, the claim is behaviorally invisible.

  **Reasons vs rewards**: 
    - In RL, reasons might be encoded in the reward function. The reward function is the source of normativity. However, the framework does not provide a way to discuss reasons independently; they are subsumed by the reward.

  ### Part 4: Discounting and Hazard Rates

  The wrinkle: exponential discounting can arise from a constant hazard rate. 

  If the probability of survival at each step is γ, then the expected discount for a reward at time t is γ^t. This is exponential discounting. 

  If there is uncertainty about the hazard rate, then the discount function becomes the average of exponential functions. For example, if the hazard rate is constant but unknown, with a prior distribution, then the discount function is the Laplace transform of the prior. 

  It is known that a mixture of exponential discounting functions can approximate hyperbolic discounting. In fact, if the hazard rate has a gamma distribution, then the resulting discount function is hyperbolic (or close to it).

  Specifically, if the continuation probability at each step is a random variable Γ with distribution f_Γ(γ), then the discount factor for time t is:
      d(t) = E[ Γ^t ]

  For example, if f_Γ is a beta distribution or a gamma distribution, then d(t) = 1/(1+kt) approximately. 

  Therefore, an agent that uses exponential discounting with a random hazard rate will exhibit hyperbolic discounting on average. This means that what looks like present-bias might be rational given uncertainty about survival.

  In the framework, there is no distinction between an agent that uses hyperbolic discounting because of a preference for the present and one that uses it because of survival uncertainty. This is a limitation of the vocabulary. 

  ### Part 5: Identifiability from Behavior

  In the serial recertification task, can we distinguish H1 and H2 from trajectories?

  - H1: quasi-hyperbolic discounting (β, δ) with sophistication or naivety.
  - H2: exponential discounting (δ) with state-dependent temperature.

  Both can produce present-biased behavior. 

  Degeneracies:
  - The present-bias parameter β in H1 can be mimicked by a higher temperature in H2 at the right moments.
  - The sophisticated planning in H1 might be mimicked by H2 if the temperature is adjusted appropriately.

  However, there might be differences:
  - After a skip, the sophisticated H1 might abandon even when there are enough days left, while H2 might not (if the value is high and the temperature is low). But H2's temperature is state-dependent, so it might also abandon if the temperature is high.
  - The purchase of the mask: H1-naive never buys, but H1-sophisticated might. H2 might buy if the temperature function leads to high risk of skipping. But if we see an agent buying the mask, we cannot distinguish between sophisticated H1 and H2.

  Without self-reports, it is hard to distinguish. Moreover, the two models are both capable of fitting a wide range of behaviors by adjusting their parameters. Therefore, they are not identifiable from behavior alone in this environment.

  **Implications for the philosophical dispute:**
  The disagreement between the deflationist (who explains akrasia as diachronic discounting) and the Davidsonian (who insists on synchronic akrasia) might not be observable from behavior. The same behavior could be due to synchronic stochasticity (H2) or diachronic discounting (H1). Therefore, the dispute is not empty, but it is underdetermined by behavior. It becomes a disagreement about the correct model of the agent's internals.

  ### Final Verdict

  - The residue is mostly a limitation of the RL vocabulary: it lacks the machinery to represent judgment separately from action, and it cannot distinguish between different internal causes of the same behavior.
  - The philosophical claims were never as sharp as they looked because they rely on internal states that are not observable.

  However, the deflationist and Davidsonian might both agree that the behavior is what matters, and they are offering different explanations. The underdetermination by behavior means that we need additional evidence (e.g., self-reports or neural data) to decide.

  **Commitments:**
  - The disagreement between deflationist and Davidsonian is about the internal structure of the agent, which may not be observable from behavior alone. Therefore, it is not empty, but it is not resolvable by behavioral data alone.
  - The residue is mostly a limitation of the RL vocabulary because it does not have built-in notions of judgment, intention, and reasons, and it cannot distinguish between different internal causes of time inconsistency.

  Thus, the translation loses the internal, first-person perspective that is central to the philosophical debate.
