  ### Hyperbolic Discounting from Hazard Uncertainty  
  *Mathematics*: If the termination hazard rate \(\lambda \sim \text{Gamma}(k, \theta)\), the discount factor is:  
  \[
  d(t) = \mathbb{E}[e^{-\lambda t}] = (1 + \theta t)^{-k} \quad \text{(hyperbolic)}
  \]  
  *Result*: Correct. Hyperbolic discounting emerges from aggregated exponential discounters with uncertain hazard rates.  

  *Implications for Translation*:  
  - **Defect of vocabulary**: Framework cannot distinguish between:  
    - *Bias*: \(\beta < 1\) in QHD (irrational present bias).  
    - *Rational uncertainty*: Hyperbolic discounting from hazard ambiguity.  
  - **Philosophers' bias concept**: Overloaded. What appears as "bias" may be Bayes-rational. The distinction (bias vs. uncertainty) is lost, weakening normative claims about akrasia.  
  - **Proportion**: 70% vocabulary defect (no hazard model), 30% philosophical blur (bias not uniquely defined).  

