  ### Agent Predictions in Serial Recertification Task  
  *Parameters*: \(N\) days, horizon \(2N\), streak \(s\), day \(t\), work cost \(c\), terminal reward \(R\) if \(s = N\) at \(t = 2N\). Mask cost \(k\).  
  *State*: \((s, t)\) with \(s \in \{0, 1, \dots, N\}\), \(t \in \{0, 1, \dots, 2N-1\}\).  
  *Agents*:  
  - **H1-sophisticated**: QHD with \(\beta, \delta\), knows future \(\beta\).  
  - **H1-naive**: QHD with \(\beta, \delta\), assumes future \(\beta=1\).  
  - **H2**: Exponential discounting (\(\delta\)), Boltzmann policy with temperature \(\tau(s,t) = \tau_0 + \alpha \cdot (N - s) + \gamma \cdot t\) (increases with proximity to reward/effort).  

  **Qualitative Predictions**:  

  | **Metric**               | **H1-sophisticated**                                  | **H1-naive**                                          | **H2**                                                |
  |--------------------------|------------------------------------------------------|------------------------------------------------------|-------------------------------------------------------|
  | **Buys mask (t=0)?**     | Yes, if \(k <\) expected loss from future skips.    | Never (believes future selves are patient).          | Yes, if \(k <\) expected loss from stochastic skips. |
  | **Works day 1?**         | Likely yes, unless \(c\) is very high.              | Likely yes (naive optimism).                         | Likely yes (low \(\tau\) early, high Q-value for work). |
  | **Works final feasible day?** | Works if \(\beta \delta R > c\).                  | Works if \(\delta R > c\) (naive).                   | Works with probability \(\propto \exp[(\delta R - c)/\tau]\); may skip even if \(\delta R > c\) if \(\tau\) high. |
  | **After unplanned skip at \(t=j\):** | Abandons if \(j > N\) (not enough time) OR if \(j \leq N\) but expects future skips due to \(\beta\). Resumes only if \(j\) small and \(\beta\) high. | Resumes if \(2N - j \geq N\) (enough time; naive belief in future patience). | Resumes with probability \(\propto \exp[V_{\text{resume}}/\tau]\); decreases as \(j\) increases (less time, higher \(\tau\)). |

  **Key Differences**:  
  - **Mask purchase**: H1-naive never buys; H1-sophisticated and H2 might.  
  - **After skip at \(j \approx N\)**: H1-sophisticated abandons (pessimism); H1-naive resumes (optimism); H2 may abandon if \(\tau\) high.  
  - **Final day**: H1 requires \(\beta \delta R > c\) to work; H2 may skip despite \(\delta R > c\).  

  **Sophistication vs. Naivety in H1**:  
  - Sophistication helps (higher expected return) when commitment is valuable (low \(k\)) and \(\beta\) is low.  
    *Example*: \(N=3\), \(c=1\), \(R=10\), \(\beta=0.5\), \(\delta=1\), \(k=0.1\).  
    - Sophisticated: Buys mask, pays \(k + 3c = 3.1\), gets \(R=10\) → return \(6.9\).  
    - Naive: Skips mask. At \(t=0\), works (believing future selves cooperate). At \(t=1\), skips (actual \(\beta\) makes work unattractive), then abandons → return \(\approx -1\).  
  - **But**: If \(k\) is high or \(\beta \approx 1\), sophistication can hurt (e.g., abandons early when naive would succeed).  
    *Verdict*: Depends on parameters. Sophistication is better when \(k\) low and \(\beta\) low.  

