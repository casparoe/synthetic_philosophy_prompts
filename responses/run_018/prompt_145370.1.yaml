  The user isn’t a philosopher, so explaining without jargon is key. They want clarity on the boundaries between internal and external content, and how this split avoids equivocation. They might also be interested in whether this asymmetry is problematic or a necessary feature of semantic theories. 

  In response, I’ll define the asymmetry, reference relevant concepts (semantic externalism, functional role semantics), and explain why there isn’t a single term. I’ll propose "conceptual outsourcing asymmetry" as a descriptive name, differentiating it from other ideas they mentioned. Highlighting the shifting boundary as a dialectical tool rather than a formal theory could address their observation about protecting intuitions. Emphasizing the distinction between natural kinds and descriptive predicates should clarify why the split occurs. 

  Need to ensure I cover their examples: false belief and error explanation, showing how the noun is external but predicates are internal. Also, clarify how this isn’t equivocation by distinguishing sense and reference. Mentioning two-dimensional semantics might help, but keep it accessible. Conclude by noting that this approach resolves tensions between externalism and internalism about concepts.
answer: |-
  What you've observed is a profound and contentious asymmetry in semantic externalism—one that doesn't have a universally agreed-upon name but is widely recognized in philosophy of language and mind. I'll define the phenomenon, differentiate it from related concepts, and propose a precise term for it.

  ### The Core Asymmetry: Noun vs. Predicate Externalism
  Your intuition is correct: In Twin Earth scenarios, **natural kind nouns (like "water") are treated as having their reference fixed externally** (by the environment), while **many predicates (like "wet" or "drinkable") are treated as having their meaning fixed internally** (by functional or phenomenal roles shared across twins). This allows:
  1. **Externalism for reference**: "Water" refers to H₂O on Earth, XYZ on Twin Earth.  
  2. **Internalism for predicates**: "Drinkable" means *satisfies the internal functional role associated with hydration* on both planets, regardless of chemical composition.  

  This split preserves the Twin Earth intuition (words refer to different things) while allowing shared understanding of concepts like error ("This water isn't drinkable" is meaningful to both, even if "water" picks out different substances).

  ---

  ### Established Names & Why They Fall Short
  1. **Semantic Externalism** (Putnam/Burge):  
     Explains why "water" refers differently, but doesn't address why predicates *aren't* externalized. Your observation exposes a **limitation of externalism's scope**.  

  2. **Two-Dimensional Semantics** (Chalmers/Jackson):  
     Distinguishes between a priori **primary intensions** (shared descriptive content) and a posteriori **secondary intensions** (world-dependent reference).  
     - **Your insight**: In practice, philosophers apply primary intensions to predicates ("drinkable") but not to natural kind nouns ("water"), creating an *ad hoc* boundary.  

  3. **Functional Role Semantics**:  
     Explains predicates internally (e.g., "drinkable" = whatever quenches thirst), but conflicts with externalism for nouns.  

  **The gap**: No term captures the *selective application* of externalism to nouns while insulating predicates.

  ---

  ### Proposed Name: **Conceptual Outsourcing Asymmetry**  
  **Definition**:  
  > The systematic tendency in semantic externalism to outsource reference-fixing *only for natural kind terms* to the external environment, while treating *predicates and functional concepts* as internally determined by shared psychological or functional roles—specifically to reconcile externalist reference with internalist explanations of agreement, error, and conceptual competence.

  ---

  ### How It Differs from Related Ideas
  | Concept                     | How Your Phenomenon Differs                                  |
  |-----------------------------|--------------------------------------------------------------|
  | **Equivocation**            | Not ambiguous usage—it’s a *theoretical split* designed to preserve competing intuitions. |
  | **Multidimensional Concepts** | Explains concepts with both internal/external aspects, but doesn’t justify *why nouns* get externalized while predicates *don’t*. |
  | **Context-Sensitivity**     | Affects all terms contextually; this asymmetry treats predicates as *context-invariant*. |
  | **Division of Linguistic Labour** | Explains how experts fix reference for laypeople; your case involves *all speakers* and a noun/predicate dichotomy. |

  ---

  ### Why the Boundary Shifts
  This asymmetry arises because **externalism generates problems it can't solve alone**:
  - **Error Problem**: If all meaning is external, how can Earth-Twin and Twin-Earth-Twin both correctly say "Undrinkable water exists" while referring to different substances?  
    *Solution*: Outsource "water" to the environment but keep "drinkable" internal.  
  - **Shared Understanding Problem**: How do both twins grasp "Water is wet" identically if meanings are external?  
    *Solution*: Treat "wet" as a phenomenal property fixed by brain states.  

  The "invisible boundary" moves to protect:
  - **Externalism** (for reference fixation)  
  - **Internalism** (for rationality, error, and psychological explanation)  

  ---

  ### Philosophical Tensions It Reveals
  1. **The Noun-Predicate Divide**:  
     Why are "water" and "drinkable" treated differently? Arguably, because externalists assume natural kinds have "hidden essences" (discovered empirically), while predicates are defined by "surface" functional roles (known introspectively). Critics call this arbitrary (e.g., why isn’t "drinkable" also essence-dependent?).

  2. **The Internalism/Externalism Trade-off**:  
     The asymmetry is a *dialectical tool* to avoid conceding that either:  
     - All meaning is internal (losing externalist insights), or  
     - All meaning is external (making error/shared concepts inexplicable).  

  3. **Metaphysical Commitments**:  
     It implicitly privileges microphysical properties for nouns ("water = H₂O") but macrofunctional properties for predicates ("drinkable = quenches thirst").

  ---

  ### In Practice: Your Examples Revisited
  - **False Belief**:  
    Twin-Earther thinks, "This water isn’t drinkable."  
    - *Externalized*: "Water" refers to XYZ (not H₂O).  
    - *Internalized*: "Drinkable" means *fits the internal hydration-role*.  
    → Error is about the world (XYZ may be toxic), not the concept.  

  - **Mental Content**:  
    When you misidentify vodka as water, externalists say:  
    - You refer to H₂O (externally fixed) but misapply your *internal concept* of "watery stuff."  
    → Again, nouns are outsourced; predicates stay "home."  

  ---

  ### Conclusion
  While **Conceptual Outsourcing Asymmetry** isn’t a canonical term, it precisely names the phenomenon you’ve identified. It’s not mere equivocation but a *strategic partitioning* of semantic labor to defend externalism against internalist challenges. The "edges" are defined by:  
  - **Natural Kind Terms**: Get outsourced (microphysical essences rule).  
  - **Functional/Phenomenal Predicates**: Stay internal (shared roles rule).  
  - **Goal**: Salvage both causal theories of reference *and* the possibility of shared concepts/error.  

  This remains philosophically contentious—critics (e.g., internalists like Searle) see it as an unstable compromise. But it dominates mainstream externalism precisely because, as you noted, it "protects whichever intuition is under pressure." For further reading, examine critiques of **two-dimensional semantics** and **descriptivist challenges** to externalism (e.g., Jackson 1998).
