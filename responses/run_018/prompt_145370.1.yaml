  The user noticed this split in two contexts: false belief cases and mental content/error discussions. In false belief, the twin is thinking about XYZ, but when they say "this water isn't drinkable," the error is attributed to the reference (water as XYZ) rather than the predicate (drinkable). The user is pointing out that this boundary shifts depending on the argument, which feels like a flexible strategy to preserve both externalism about reference and internalism about concepts to explain error.

  They’re asking if there’s a named concept for this asymmetry. I recall that in philosophy of language, this relates to semantic externalism (Putnam, Burge) and the Twin Earth thought experiment. The noun-predicate split isn’t explicitly named, but it’s tied to the distinction between natural kind terms (like "water") and descriptive predicates. The user is observing that philosophers handle these differently: natural kinds are rigidly designating, while descriptive predicates might rely on functional or phenomenal properties. 

  The deeper need here might be understanding whether this asymmetry is a justified philosophical move or an ad hoc adjustment. They mention the boundary shifting to protect intuitions, which hints at a concern about consistency in theories of meaning. They might also be looking for tools to analyze similar conceptual splits in other debates. 

