  My colleague Dr. S. has taken explicit positions on five belief-revision cases involving evidence that does not fully determine a single proposition. (i) Seeing a distant shape, she becomes 70% sure it is a robin and 30% a sparrow; she updates linked nesting-behavior beliefs by Jeffrey conditioning on the {robin, sparrow} partition, leaving within-partition conditionals intact and propagating via the law of total probability. (ii) A medical scan is ambiguous among three diseases that share a symptom but require different treatments; she rejects Jeffrey conditioning on the disease partition and instead conditions on the symptom being present, treating the scan as noisy evidence about that intermediate variable. (iii) A corrupted manuscript makes her 60% sure it is from 1789 and 40% from 1792, where her prior over revolutionary rhetoric is continuous over time; she applies Jeffrey conditioning on the year-partition and reweights the continuous temporal beliefs with the posterior weights. (iv) A trusted informant says “probably P” and she assigns credence 0.8 to P; she rejects Jeffrey conditioning altogether and applies standard Bayesian conditioning on P using a reliability-derived likelihood ratio. (v) Satellite imagery yields calibrated probabilities over five discrete land-use categories, while her prior over soil carbon is continuous over geographic coordinates correlated with category; she conditions on the category partition via Jeffrey’s rule and then updates the continuous coordinate distribution using the category posteriors as mixture weights.

  New case: A calibrated acoustic model outputs confidence scores over four phoneme classes for a noisy recording, but phonemes are embedded in a continuous formant space; her prior beliefs about speaker stress depend on both the phoneme and the continuous formant values. There is also an unobserved “microphone drift” parameter that could systematically bias the confidence vector. She must decide whether to update her stress beliefs by Jeffrey conditioning on the phoneme partition, by first conditioning on drift and then on phonemes, or by treating the output as direct Bayesian evidence for a single best-guess phoneme.

