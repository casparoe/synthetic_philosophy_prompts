answer: |-
  Here's the reconstruction:

  **1. Practice in Brief:**  
  Legal systems recognize "wrongful life" suits (allowing claims that *being born* with severe suffering constitutes harm) but reject "wrongful non-existence" claims (no liability for failing to create a life that *would have been* good). Welfare states actively subsidize procreation (IVF, prenatal care, child benefits) but offer no equivalent rewards for voluntary childlessness.

  **2. Implicit Theory:**  
  The pattern presupposes a **strict person-affecting view of harm/benefit combined with an existential asymmetry**. Harm requires an *actual* subject who experiences it – hence wrongful life suits are conceivable (an existing child suffers). Conversely, the absence of a potential good (like the pleasure of a life never lived) doesn't constitute harm *to anyone* because there is no subject for whom it is a deprivation. Welfare policies prioritize alleviating suffering or enabling *existing* preferences (of potential parents wanting children) and promoting the welfare of *future existing persons*. The absence of a "never-existent" person creates no subject needing compensation or whose "lost pleasure" warrants state subsidy. Benatar's asymmetry (existence of pain = bad, non-existence of pleasure = not bad) aligns neatly, but the core commitment is the necessity of an existing subject for harm/benefit attribution.

  **3. Strict vs. Optional Commitments:**  
  *   **Strictly Required:** A person-affecting restriction (harm/benefit requires an actual subject). The existential asymmetry (non-existence cannot be harmed).  
  *   **Aligned but Optional:** Benatar's specific formulation (the non-existence of pleasure is *always* neutral). A pro-natalist bias isn't strictly required; the policies could stem purely from the person-affecting focus on existing citizens' desires and future children's welfare.

  **4. Underdetermination Check:**  
  A *symmetric* view (non-existence *can* involve a "loss" of potential good) **could** pragmatically justify the *current legal outcomes*: Courts might still reject wrongful non-existence suits due to insuperable problems of proof (establishing counterfactual wellbeing), causation, and defining plaintiffs/damages. Welfare states could prioritize procreation subsidies based on social utility (e.g., demographics) without contradicting symmetry. **However**, the *explicit rationale* for rejecting wrongful non-existence suits (no victim = no harm) and the *total absence* of any policy acknowledging the "benefit" of non-procreation *strongly suggests* the implicit asymmetry is doing the work.

  **5. Replacement Scenario (Symmetric View):**  
  *   **Tort Law:** "Wrongful non-existence" suits become conceptually plausible. Parents/doctors could potentially be liable for negligently *failing* to conceive a child who would have had a net-positive life (e.g., failing IVF due to negligence when success was highly likely). Damages would involve speculative calculations of "lost life value."  
  *   **Welfare Policy:** Logic could demand subsidies for *not* procreating under adverse conditions (e.g., payments to those choosing sterilization to avoid conceiving a child likely to suffer severely), framed as preventing harm or "loss of good" to potential persons. Policy would need to explicitly weigh the *value* of bringing potential lives into existence against the value of preventing their existence under suboptimal conditions.
