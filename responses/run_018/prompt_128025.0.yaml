  Okay, the user is mapping institutional practices to philosophical commitments, specifically looking at wrongful life suits versus the lack of wrongful non-existence claims. They're also contrasting welfare policies that support having children versus nothing for the childless. The main question is about the underlying theory of value or harm here. 

  First, I need to recall the legal and policy examples they mentioned. Wrongful life suits exist where a child can sue for being born with disabilities, implying existence itself can be a harm under certain conditions. But there's no equivalent for not being conceived when life would've been good. On the policy side, governments fund IVF, prenatal care, and child subsidies, but there's no support for people who choose not to have kids. 

  The user is wondering if this reflects Benatar's asymmetry from antinatalism—where existence of pain is bad, but absence of pleasure isn't bad if no one exists to miss it. But they're also asking if a person-affecting view could explain it without going full antinatalist. Person-affecting theories say harms or benefits require a subject, so no subject means no harm in not creating someone. That seems to fit here.

  Next, I should separate what's strictly required by the pattern versus what's just compatible. The strict part is that harm needs an existing person, and policies are person-affecting. The asymmetry in valuing birth over non-birth is evident, but antinatalism isn't necessary; a weaker person-affecting view suffices. The underdetermination point is important: a symmetric view could technically lead to similar outcomes if we prioritize existing people's interests, but it'd be inconsistent without the asymmetry.

  For the replacement scenario, if we switched to a symmetric view where both existence and non-existence can involve harms/benefits, things would get messy. We might see wrongful non-existence suits or incentives for not procreating, which would radically change tort law and welfare policies. 

