  I should structure the desiderata in layers: adequacy conditions (what any theory must handle), consistency conditions (boundaries like neuroscience), and then spotlight conflicts. The cyclical endorsement case might be the ultimate stress test - it blows up both behaviorist revealed preference (which can't handle endorsement) and mentalism (which struggles with consistent internal states). 

  The neuroscience constraint about no single utility signal is crucial but often misused. It shouldn't rule out mentalism per se, only crude "utility neuron" claims. And first-person authority is tricky - mentalists overplay it, behaviorists dismiss it, but the framing case shows we can't ignore it entirely. 

  Biggest tension cluster: behavioral determinacy + first-person authority + zero normative construction. If choices are fully determined, but the agent can authoritatively say "I endorse this cycle" while also insisting no norm guides it? That might require constructivism to mediate. 

