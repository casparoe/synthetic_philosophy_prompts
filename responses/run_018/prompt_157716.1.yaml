  I should flag that cyclical endorsement might be incoherent if rationality requires non-contradiction. But that's exactly the user's point - maybe rationality shouldn't require that. If neuroscience found a stable "preference signal" despite framing effects, it'd torpedo mentalism. But that's unlikely given current evidence. 

  The user's clearly thought this through - their "hard cases" are precision-engineered traps. My reply needs to match that rigor while exposing where even the desiderata might fracture.
answer: |-
  Here is a complete specification of desiderata for an adequate theory connecting revealed preference to the meaning of utility ascriptions, structured to address your requirements. The theory must satisfy **adequacy conditions** (essential for explanatory power), **consistency conditions** (boundaries from science/methodology), and explicitly confront **tensions** between desiderata.

  ---

  ### **I. Adequacy Conditions: Handling Core & Edge Cases**  
  *(Why these cases are constraints, not anomalies)*  

  1. **Complete, Transitive Preferences (Standard Case)**  
     - *Constraint*: The theory must ground utility in behavior without presupposing rationality.  
     - *Distinction to preserve*: Revealed preference ≠ definition of rationality. Utility ascriptions must explain *why* transitivity holds (or not).  

  2. **Reflectively Endorsed Cyclical Choices**  
     - *Case*: Agent chooses A > B > C > A, and insists this cycle aligns with their values (e.g., "Each choice feels right in context").  
     - *Constraint*: Cannot be dismissed as "irrational" or "noise." Challenges behaviorist reduction.  
     - *Distinction*: **Choice vs. Judgment** – Choice reveals action tendency; judgment reveals metacognitive endorsement. Mentalists must explain how the same "inner state" justifies contradictions.  

  3. **Framing Reversals with Full Awareness**  
     - *Case*: Agent knows frames F1/F2 are equivalent (e.g., 90% survival vs. 10% mortality) but consistently prefers F1 > F2.  
     - *Constraint*: Reveals preference is frame-dependent despite identical outcomes.  
     - *Distinction*: **Revealed preference vs. Revealed all-things-considered judgment** – The agent judges F1=F2 normatively but prefers F1 behaviorally. Mentalism struggles with discordant "inner states."  

  4. **Genuine Incompleteness (Non-Indifference)**  
     - *Case*: Agent states, "I cannot compare A and B; it’s not indifference, but lack of a basis."  
     - *Constraint*: Forces a gap between "no choice" and "indifferent choice."  
     - *Distinction*: **Incomparability ≠ Indifference** – Indifference implies equal utility; incompleteness denies utility comparability. Behaviorists often conflate them via choice axioms.  

  5. **Intertemporal Shifts with Mistake sans Irrationality**  
     - *Case*: At t1, agent chooses X; at t2, they choose Y ≠ X, calling t1-choice "wrong" but not "irrational" (e.g., "I lacked experience").  
     - *Constraint*: Demands diachronic utility ascriptions without collapsing rationality into stability.  
     - *Distinction*: **Mistaken preference vs. Irrational choice** – Later self attributes error to information/context, not faulty reasoning. Challenges constructivist "coherence over time" norms.  

  ---

  ### **II. Consistency Conditions**  
  *(Marked: 🟢 = Genuine adequacy; 🔵 = Camp-specific)*  

  1. **Empirical Equivalence with Choice Axioms**  
     - Where preferences *are* complete/transitive, the theory must align with revealed preference axioms (WARP, SARP).  
     - 🟢 *Adequacy*: Without this, the theory fails descriptively where standard models work.  

  2. **Neuroscience Compatibility**  
     - No evidence for a unitary "utility signal" (e.g., vmPFC encodes multiple task variables; choice involves distributed networks).  
     - 🟢 *Adequacy*: Theories positing a singular mental utility state are empirically dubious.  

  3. **First-Person Authority Preservation**  
     - Agents can authoritatively report some preferences (e.g., "I prefer coffee to tea") without behavioral evidence.  
     - 🟢 *Adequacy*: Denial leads to absurdity (e.g., ignoring self-knowledge). *But scope-limited*: Not for complex/framed choices.  

  4. **Determinism about Choice**  
     - Choices are law-governed; no randomness in behavior.  
     - 🔵 *Camp-specific*: Strict behaviorists demand this; mentalists/constructivists may allow indeterminacy.  

  5. **No Reference to Unobservable Mental States**  
     - 🔵 *Camp-specific*: Behaviorists require this; others reject it as untenable.  

  ---

  ### **III. Tensions & Joint Unsatisfiability**  
  The triad below generates structural (not contingent) tension:  
  - **Behavioral Determinacy**: Choices fully determine utility.  
  - **Full First-Person Authority**: Self-reports always trump behavior.  
  - **Zero Normative Construction**: Utility is "found," not "made."  

  - **Why structural?**  
    - If behavior *fully* determines utility (determinacy), but agents authoritatively endorse contradictions (e.g., cyclical choices), first-person authority forces utility ascriptions to conflict with behavior.  
    - To resolve, you must either:  
      - Limit first-person authority (undermining mentalism),  
      - Allow normative construction (e.g., "utility" is a coherence standard we impose), or  
      - Abandon determinacy (allowing "true" utility to diverge from choice).  

  ---

  ### **IV. Scoring Existing Accounts**  
  *(Key damage-indicators: ✗ = Fails; △ = Partial; ✓ = Satisfies)*  

  | **Desideratum**               | **Strict Behaviorism** | **Mental-State Causal** | **Normative Constructivism** |  
  |-------------------------------|------------------------|-------------------------|------------------------------|  
  | Cyclical reflective endorsement | ✗ (Dismisses as error) | ✗ (No coherent inner state) | △ (Reinterprets as context-relative utility) |  
  | Framing reversals w/ awareness | ✗ (Violates extensionality) | △ (Multiple conflicting "states") | ✓ (Frames construct distinct norms) |  
  | Genuine incompleteness        | ✗ (Conflates w/ indifference) | ✓ (Lack of comparable mental magnitudes) | ✓ (No norm imposed) |  
  | Intertemporal shifts          | ✗ (t1-choice = "true pref.") | △ (t2-state overrides t1-state) | ✓ (Norms evolve with perspective) |  
  | Neuroscience compatibility    | ✓ (No mental states)   | ✗ (Assumes unitary utility) | ✓ (No commitment to implementation) |  
  | First-person authority        | ✗ (Denied)             | ✓ (Core claim)          | △ (Only for constructed self-reports) |  
  | **Most Damaging Requirement** | **Reflective Endorsement** (forces choice/judgment split) | **Framing Reversals** (exposes state fragmentation) | **Empirical Equivalence** (risks "anything goes") |  

  - **Single Most Damaging Requirement**: **Reflective endorsement of contradictions** (e.g., cycles).  
    - *Why*: It destroys behaviorism (choice ≠ preference), mentalism (no consistent inner state), and strains constructivism (can it "normatively" endorse incoherence?).  

  ---

  ### **V. Falsification & Failure Points**  
  - **Drop/Reorder Non-Negotiables If**:  
    - **Empirical finding**: Neural evidence of a stable, domain-general utility signal (e.g., dopamine encodes cross-context value) → weakens neuroscience constraint.  
    - **Argument**: Proof that cyclical endorsement is incoherent (e.g., violates constitutive rationality) → reorders reflective endorsement as anomaly.  
    - **Revised case**: An agent with globally incomplete preferences *and* no access to first-person reports → challenges authority preservation.  

  - **Critical Failure Points in Reasoning**:  
    1. **Cyclical endorsement incoherence?** If rationality *requires* non-contradiction, endorsing cycles is impossible. But: this may beg the question against anti-rationalist positions.  
    2. **Neuroscience misinterpretation?** Distributed encoding ≠ no utility representation. If "utility" is a composite variable, mentalism survives.  
    3. **First-person authority overreach?** We often mistake our preferences (e.g., affective forecasting errors). The scope may be narrower than assumed.  

  ---

  ### **Conclusion**  
  An adequate theory must treat utility as a **triadic relation**: *(behavior, endorsement, context)*, rejecting reductions to any single pole. The hardest desideratum is **reflective endorsement without behavioral or mental consistency**, which exposes the need for a hybrid account: utility ascriptions are *patterns in constrained agency*, where constraints include behavior, neurocognitive architecture, and norms of coherence that agents can accept, reject, or modify. The tension between determinacy, authority, and construction is structural; resolving it likely requires abandoning "utility" as a pre-behavioral entity and reframing it as a dynamic interpretive construct.
