prompt: |-
  I have to teach the non-identity problem in a single seventy-five-minute session, and what I want from you is a plan for the explanation, not an explanation of the problem.

  The setting: a guest session in a master's seminar on population and public-health ethics. About twenty students, nearly all from epidemiology or health-policy backgrounds, each with at most one previous applied-ethics module. They read fast, they are comfortable with counterfactuals in their own work, and they are likely to file anything that sounds like possible-persons talk under "metaphysics" and disengage. There is a downstream use for the session: in two weeks they submit a short policy brief arguing for or against a preconception health programme (say, lead abatement plus folate supplementation targeted at people who intend to conceive within the year), and I want them to leave able to tell which of their own arguments survive the non-identity argument and which quietly presuppose an identifiable individual who is made worse off.

  My candidate carrying case, which I would like you to vet: a fertility clinic switches to a cheaper batch of embryo culture medium. The cheaper medium slightly raises the rate of a lifelong but mild condition — a manageable endocrine disorder needing daily medication — in children born from embryos cultured in it. Because the medium also affects which embryos develop to the transfer stage, the child any given couple takes home will be a different child depending on the medium used. The clinic knows all this and chooses purely on cost. Same number of children either way, each life plainly worth living, no one made worse off relative to their own alternative. The attraction of the case for me is that it has one dial: I can stipulate that the medium affects the condition but *not* which embryo is transferred, which turns the very same story into an ordinary harming case. I want to know whether one case with a switch beats two separate cases for this audience, what exactly the case must have and must lack to do the work, and whether I should close off the escape hatch by which a student says the *parents* are the ones wronged, or leave it open and use it later.

  The points I need you to plan around:

  1. Dependency structure. What must be in place before the puzzle can even be stated as a puzzle, and in what order? In particular, must the idea that a life can be well worth living while still going badly for its holder be secured *before* I introduce the claim that a different individual would exist otherwise, or can it stay implicit until a student tries to solve the case by comparison? Say which, and say specifically what breaks if I run them in the wrong order.

  2. Misconceptions, and where each belongs in the sequence. The ones I predict: that this is a problem about personal identity over time, of the ship-of-Theseus sort; that the gametes were already there so it is the same person; that the upshot is "no one is harmed, so anything goes"; that the upshot is the much stronger claim that we have no duties to future generations whatsoever; that the fix is simply to compare this child's life to the better life they could have had, without noticing that the comparison has no subject; and that the whole thing is a symptom of consequentialism, or equally of rights talk, and dissolves if you pick the other one. Tell me which of these I should pre-empt before they arise, which I should let surface and correct live because the correction does useful work, and at what minute each should be headed off.

  3. How much of the solution space to open, given the time, and where: the impersonal comparison, the threshold or non-comparative-harm move, rights to an adequate or open future, and the manoeuvre where the argument is shown to prove too much by being run against a deliberately malicious variant of the same case. Or should the session end without a solution — and if so, how do I keep that from landing as a refusal to answer?

  4. My own terminology. I have been using *identity-entangled* for an effect such that, had the act not been performed, the individual who bears the effect would not have existed, so that the individual cannot be held fixed across the counterfactual; and *identity-neutral* for the opposite. Should I hand these labels to the students, and before the case or only after they have tried and failed to name a plaintiff? And do the labels themselves mislead, for instance by making the puzzle look like a problem about causal dependence rather than about the unavailability of a comparison?

  5. The check for understanding. My candidate is to have each student take a paragraph of their own draft brief and run what I call a plaintiff check: name the individual who is worse off, and say what would have happened to that very individual otherwise; if no one can be named, mark the argument as identity-entangled and say whether it retains any force. Is this the right test, and what could a student who has not really understood still manage to say in response to it?

  6. What to leave out, and say out loud that I am leaving out. I am inclined to refuse the debate over whether an individual's origins are essential to them, the modal metaphysics of merely possible people, the asymmetry in population ethics, and any taxonomy of solution-types. Tell me which of these are unsafe to omit at this level and which refusals are honest.

  Please give me the answer as a session plan with rough timings, not as an exposition of the problem.
reasoning: |-
  Okay, the user needs a lesson plan for teaching the non-identity problem in a 75-minute master's seminar. Let me start by understanding their specific constraints and goals. The students are from epidemiology and health policy backgrounds, with minimal ethics training. They might disengage if the topic feels too metaphysical. The key is to make it practical, tying it to their upcoming policy brief on preconception health programs.

  First, the user’s carrying case: a fertility clinic switching to a cheaper culture medium that causes a mild disorder. The twist is that the medium affects which embryo is transferred, so the child is different. The user wants to know if this single case with a switch is better than two separate cases. I think it’s efficient because flipping one variable changes the scenario from harming to non-identity, making the contrast clear. But I need to ensure the case is airtight. Stipulating that the medium doesn’t affect embryo selection in the harming scenario is crucial. Also, clarifying that the disorder is mild and life still worth living prevents students from arguing the child is worse off.

  Next, dependency structure. The life worth living point must come first. If students think the child’s life isn’t worth living, they’ll miss the non-identity issue. So, establishing that early is key. Then introduce the different individual aspect. If done in reverse, students might not grasp why the comparison fails.

  Misconceptions: Pre-empting the personal identity confusion is essential. Calling it the "non-identity problem" might make them think it’s about persistence over time. Clarifying terminology upfront saves time. The "gametes were already there" misconception can be addressed by explaining conception timing. Letting students surface the "no one harmed, anything goes" idea allows for correction and highlights the ethical tension. The stronger claim about no duties to future generations should be pre-empted to avoid derailing.

  Solutions: Given time constraints, introducing the threshold view and the malicious variant (proving too much) is enough. The impersonal comparison can be mentioned but not deeply explored. Ending without a definitive solution is okay if framed as an open challenge, encouraging them to apply the plaintiff test.

  Terminology: Introducing "identity-entangled" after the case, when students struggle to name a plaintiff, makes it relevant. The label should emphasize the comparison problem, not causation. Using "plaintiff check" in the activity reinforces the core issue.

  Check for understanding: The plaintiff test is solid. But students might still think parents are harmed or confuse collective harm. Addressing these in the activity ensures they apply the concept correctly.

  Omissions: Skipping essential origins and modal metaphysics is fine, as they’re not necessary for the practical aim. Mentioning these exclusions upfront maintains transparency without overwhelming students.

  Timings: Starting with the policy brief context hooks them. The clinic case with the switch efficiently demonstrates the problem. Group activity applying the plaintiff test to their briefs ensures practical application. Ending with the malicious variant underscores the ethical dilemma without needing a solution.

  Overall, the plan must stay focused on applicability to their assignment, avoiding metaphysical tangents. Using their case, structured timing, and active engagement should keep them invested and clarify the non-identity problem’s relevance to policy arguments.
answer: |-
  Here’s a 75-minute session plan tailored to your constraints and goals, with timings and strategic decisions:

  **Session Goal:** Students identify "identity-entangled" arguments in policy contexts and distinguish them from standard harm claims.

  **Materials:** Slide deck (minimal text), 1-page handout with clinic case + variations, timer.

  ---

  ### **Session Plan (75 min total)**

  **I. Framing & Hook (10 min)**  
  - (0-2 min) **Connect to assignment:** "In 2 weeks, you’ll argue for/against preconception health programs. Today’s tool helps spot which arguments work and which implode under a logical puzzle."  
  - (2-7 min) **Clinic Case (Harming Version):**  
    - Present: Clinic uses cheap medium → causes mild endocrine disorder in Child A.  
    - *Stipulate clearly:* "Same child would exist with expensive medium, but healthy."  
    - Poll: "Is this wrongful? Why?" *Elicit consensus: yes, harms identifiable child (Child A).*  
  - (7-10 min) **Introduce Switch:** "Now alter ONE fact: cheap medium *also* affects which embryo develops. Couple takes home Child B (with disorder), not Child A. Clinic knows this. Lives are worth living. Is this wrongful?"  
    - *Show parallel structure visually.* Poll again. *Expect split vote.*

  **II. Core Puzzle & Key Concepts (20 min)**  
  - (10-15 min) **Break down dependency (Point 1):**  
    - *First:* Ask, "Can Child B complain? What would her life be like without the clinic’s choice?" → "She wouldn’t exist."  
    - *Then:* "Is her life with the disorder *worse than never existing*?" *Affirm: mild disorder, life worth living.*  
    - *Crucial:* **If reversed, students fixate on disability severity.** Preempt by stipulating "life worth living" upfront.  
  - (15-20 min) **Misconception Management (Point 2):**  
    - *Pre-empt immediately:* "This is *not* about ‘who am I over time?’ It’s about whether we can compare outcomes for the *same person*."  
    - *Let surface:* "No one harmed → anything goes?" Use this to **define the puzzle:** "If no one is harmed, why does this feel wrong? What's the alternative framework?"  
    - *Ignore for now:* Gamete origin/metaphysics (tempting but low yield).  
  - (20-25 min) **Terminology (Point 4):** Introduce **"identity-entangled"** AFTER they struggle:  
    - "When an act affects *who exists*, we can’t hold the person fixed to say ‘they’re worse off.’ Call this ‘identity-entangled.’ The harming case was ‘identity-neutral.’"  
    - *Emphasize:* "The issue is *unavailability of comparative harm*, not causation."  

  **III. Deep Dive & Corrections (25 min)**  
  - (25-35 min) **Group Activity (3-4 students):**  
    - Task: "Find *one* reason why the clinic’s choice might still be wrong, even if Child B isn’t harmed."  
    - *Expected answers:* Parents’ autonomy, injustice to society, "but it’s reckless!"  
    - *Correct live:* "Parents chose cheap option? Stipulate they didn’t know. Societal cost? Assume negligible."  
  - (35-40 min) **Solution Space (Briefly! Point 3):**  
    - **Threshold view:** "What if the disorder were severe? Maybe some lives *aren’t_ worth living." (Note: not our case.)  
    - **Malicious variant:** "Suppose the clinic *wants* to create children with disorders. Does ‘no harm’ still defend this?" → **"Proves too much"** move.  
    - *Skip:* Impersonal comparisons/rights theories. *Say:* "We lack time for full solutions; focus on diagnosing the problem."  
  - (40-45 min) **Close Escape Hatches:**  
    - "Can parents be wronged?" *Concede:* "Maybe! But that’s a different argument. Our puzzle is about obligations *to the child*."  

  **IV. Application to Policy Brief (15 min)**  
  - (45-55 min) **Plaintiff Check (Point 5):**  
    - Demo: Take a *non*-entangled argument (e.g., "Lead exposure harms future children"). Plaintiff = child; alternative = same child, healthy.  
    - Take an entangled argument (e.g., "Folate prevents disabilities in future children"). Plaintiff = ? Alternative = ? (Different child/no child).  
    - **Test:** "Name the individual worse off and what *that individual’s* life would otherwise be."  
  - (55-65 min) **Paired Activity:**  
    - Students find 1 argument from their draft briefs and run the Plaintiff Check.  
    - *Pitfall alert:* They may name "society" or "future generations" vaguely. Push: "Which *individual* is worse off?"  
  - (65-70 min) **Report Back:** 2-3 pairs share. Focus on *classifying* arguments, not resolving ethics.  

  **V. Wrap-up (5 min)**  
  - (70-75 min) **Reiterate:** "Identity-entangled arguments can’t say ‘this child is worse off.’ They need other justifications (e.g., parental duties, societal values)."  
  - **Omissions (Point 6):** State clearly: "We skipped metaphysics of possible people and essential origins. Why? Our goal is *practical*: diagnosing arguments in policy contexts."  
  - **End:** "In your brief, flag entangled claims. Even if they’re valid, they need different defenses."  

  ---

  ### **Why This Works for Your Audience**
  - **Carrying Case:** The single case with a switch is **superior**. Flipping one variable (embryo selection) highlights the logical pivot point. Two cases risk disjointed comparisons.  
  - **Stipulations Critical:**  
    - Disorder must be mild/life worth living (or students "solve" via severity).  
    - Parents not wronged (stipulate: they consented cost-blindly).  
  - **Misconceptions Sequenced:**  
    - Pre-empt personal identity/metaphysics immediately (min 15).  
    - Let "no harm → anything goes" surface (min 15-20) to motivate the puzzle.  
    - Delay gamete origin (likely arises in Q&A; shut down with "conception timing matters").  
  - **Plaintiff Check:** Ideal for policy focus. *Likely misunderstanding:* Students name "the child who exists" without specifying their alternative (correct by asking "what would *that child’s* life be otherwise?").  
  - **Omissions Honest & Safe:** Essential origins/metaphysics aren’t needed for applied policy analysis. The asymmetry would derail into population ethics.  

  **Timing Buffer:** Build in 2-3 min flex in Q&A sections. If activity runs long, sacrifice solution space (keep threshold + malicious variant only).  

  This plan leverages their comfort with counterfactuals while anchoring abstraction in policy-relevant diagnosis. The clinic case → plaintiff check pipeline directly serves their brief assignment.
