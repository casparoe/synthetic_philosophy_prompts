  Need to ensure each thesis is labeled clearly: ontological, epistemic, etc. Examples like the logistic map or weather systems could illustrate. Mentioning Poincaré’s work on the three-body problem shows historical context. Also, quantum mechanics isn't directly related here, so avoid conflating chaos with quantum indeterminacy.

