  The user also brought up their TA's point about statistical distributions remaining deterministic. That's important. Even if individual trajectories diverge, the ensemble behavior might follow a deterministic path. This doesn't save predictability for single cases but supports determinism ontologically. I need to explain how this fits into the different theses.

  Now, the user wants a "menu" of theses to take back to class. They need clear categories: ontological, epistemic, and mixed claims. Each thesis should address whether chaos affects determinism, predictability, or both. Also, the TA's point about statistical determinism should be addressed as a separate but relevant point.

  I should check common misunderstandings. For example, equating unpredictability with indeterminism. Highlighting that chaos can exist in deterministic systems. Also, Laplace's demon is impossible due to computational limits and measurement errors, but that's epistemic, not ontological.

