  The literature on Bongard problems has long been divided between researchers who maintain that solving them requires the explicit extraction of structural rules—such as containment, asymmetry, or numerical correspondence—from only a handful of positive and negative examples, and researchers who maintain that the same classification behavior can be reconstructed through dense statistical correlations over low-level visual features without invoking discrete, compositional concepts at all. Despite decades of experiments, the disagreement has not moved: human subjects still reliably solve problems that defeat standard feedforward architectures, yet recent high-capacity vision models with extensive pretraining approximate human-level partitions on several problem classes, and both camps cite these outcomes as confirmation rather than refutation. I suspect the impasse is not empirical but conceptual—specifically, that the sides disagree about what counts as having solved a Bongard problem, with one camp requiring that the mechanism be verbally articulable and structurally transparent, and the other requiring only that the input-output mapping match the human extension.

  But I want a diagnosis of the disagreement's actual structure rather than another round of adjudication. Is this a substantive dispute about whether statistical feature correlation can, in principle, capture every form of boundary-sensitive induction that Bongard problems demand? Or is it verbal, turning on whether we reserve the word concept for representations that are compositional and introspectively accessible? Are the two sides actually pursuing different questions—one about real-time cognitive classification, the other about formal approximation of judgment extensions—under the single heading of concept induction? And if the stall is driven by unargued intuitions about explanatory adequacy—particularly, whether an account that cannot be articulated by the subject can explain the subject's competence—then what should count as progress? Would a formal result showing that any statistical model reproducing human Bongard performance must implicitly encode the relevant structural invariant resolve the dispute, or would each side simply reinterpret the result? Is there a hidden empirical question—perhaps involving systematically altered boundary conditions that separate boundary-sensitive induction from center-weighted feature correlation—that has not been properly tested and that could actually force convergence? Give me your diagnosis, grounded in what each side takes to be decisive evidence, together with an honest assessment of whether a conceptual distinction, an experimental design, a formal proof, or a change of question could break the stalemate, or whether no progress should be expected and why.
