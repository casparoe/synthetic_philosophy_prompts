answer: |-
  ## On the White Horse and the Kind

  Observe the strong limbs, hooves that cleave the plain,
  The arching neck, the mane that streams with force,
  The steady eye that holds no wild disdain –
  Confirm the lineage: this is a **horse**.
  Our science names the bone, the tooth, the spine,
  The genus fixed in muscle, breath, and course.
  By form alone we draw the stable line;
  The perfect type fulfills the named **horse**.

  But shadow shifts where milky flanks now gleam,
  A sudden *white* disrupts the dappled ground.
  Is this new *hue* a shattering of the scheme?
  Does *light*, where darkness should be found,
  Exclude the beast that bears the ancient frame
  From kindhood's claim? Is form still **horse**? Or *white* the blame?

  ---

  **Structural Enactment:**

  1.  **Fixed "Horse" (Xing/Form):** The word "horse" is the anchor, appearing only as the B-rhyme (`force/horse/course/horse`) in the octave (lines 2,4,6,8) and then again as the final B-rhyme (`frame/horse`) in line 13 of the sestet. This fixed position reflects the taxonomist's focus on stable morphological form.
  2.  **Shifting "White" (Se/Color):** Words related to the chromatic property ("white," "hue," "light") appear in shifting, non-rhyming positions:
      *   Line 9: "But shadow shifts where milky flanks now gleam," (No explicit "white" yet, but "milky" prefigures it).
      *   Line 10: "A sudden **white** disrupts the dappled ground." ("White" ends the line, but its sound (`ground`) doesn't rhyme perfectly with anything nearby, creating a subtle dissonance).
      *   Line 11: "Is this new **hue** a shattering of the scheme?" ("Hue" ends the line; its sound (`scheme`) forms part of the CDE CDE sestet scheme, but it's a new sound, breaking the octave's pattern).
      *   Line 12: "Does **light**, where darkness should be found," ("Light" is internal; the line ends with "found," continuing the CDE pattern but introducing another new sound).
      *   Line 14: "From kindhood's claim? Is form still horse? Or **white** the blame?" ("White" ends the poem, placed directly against "horse," and its sound (`blame`) rhymes with `frame` (line 13) and `claim` (line 14), but this final C-rhyme is weak and questioning compared to the solid B-rhymes of "horse").
  3.  **Volta & Question:** The volta (turn) at line 9 ("But shadow shifts...") introduces the leucistic mutation ("milky flanks"/"white"). The sestet (lines 9-14) then poses the central question: does this chromatic property ("hue," "light," "white") exclude the individual from the category defined by form ("horse"), even though the form remains present ("beast that bears the ancient frame")?
  4.  **Accessibility & Accuracy:** The poem uses biological/taxonomic language ("lineage," "genus," "form," "kindhood") familiar to the biologist and layperson. The core Mingjia distinction between stable form ("horse," "bone," "tooth," "spine," "frame") and differentiating color ("white," "hue," "light") drives the conflict without needing specific textual references. The leucistic mutation provides a concrete biological instance of the conceptual problem.
