  For the residue report, I'll break it down into three categories: clean translations, distortions, and gaps. Clean translations include underdetermination (multiple hypotheses fit the data) and NFL theorems (no universal guarantees without priors). Distortions involve the origins of inductive biases—Goodman's entrenchment is cultural/linguistic, while ML's is engineered or learned. Gaps include the normative aspect: SLT doesn't say which predicates we "should" project, only which ones work under given constraints.

