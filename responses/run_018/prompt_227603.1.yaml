  The marking scheme should penalize: missing the existence clause (4 pts), superficial treatment of ad hoc objections (4 pts), conflation of harm-incoming-existence with life-worth-continuing (4 pts), uncritical dismissal of rival principle (4 pts), plus overall coherence (4 pts). Common fumbles for each are predictable - like forgetting the clause or restating asymmetry when addressing the rival principle.

