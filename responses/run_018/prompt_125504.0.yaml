  Here’s a structured proposal draft focusing on your core insight, methodological approach, and realistic scope for a semester workshop:

  ---

  **Workshop Proposal: Splitting Correlation at the Seams — Distinguishing Logical and Causal Twins in Decision Puzzles**  

  ### Core Question  
  Can decision theories consistently cooperate under *logical correlation* (e.g., Platonia Dilemma) while rejecting spurious *causal correlation* (e.g., Luring Lottery)? Or does upholding this distinction inevitably collapse into Evidential Decision Theory (EDT)?  

  ### Key Insight  
  Existing literature treats both puzzles as tests of "cooperation with copies," but they differ fundamentally in their *correlation mechanism*:  
  - **Platonia**: Pure logical dependency (your action entails your twin’s action via identical reasoning).  
  - **Luring Lottery**: Masked causal dependency (your action influences others *through a physical random process*, misinterpreted as acausal).  
  Current frameworks conflate these by reducing both to identical payoff matrices, obscuring why agents might (or might not) cooperate.  

  ### Gap in Literature  
  Most analyses (e.g., Hofstadter, Yudkowsky, CDT/EDT comparisons) focus on outcomes, not *how* correlation is mediated. This misses:  
  1. Whether correlation arises from **causal influence** (Luring Lottery’s probabilistic gate) vs. **logical necessity** (Platonia’s twin symmetry).  
  2. Whether decision rules can **surgically accept logical cooperation** while rejecting **causal contamination**.  

  ### Proposed Method  
  1. **Hybrid Puzzle Design**:  
     - Construct a scenario with **logical twins** (e.g., deterministic simulation clones) but **broken causal gates** (e.g., a known defect in the randomization device).  
     - *Test*: Do agents still cooperate if logical correlation persists *without* causal influence?  
     *Example*: "Defective Luring Lottery" — Twins know the lottery is rigged to *not* affect others, but their identical reasoning remains.  

  2. **Decision Rule Stress Test**:  
     - Define a minimal criterion: *"Logical Cooperation Without Causal Superstition"* (LCWCS).  
     - Audit existing/proposed rules (CDT, EDT, FDT, UDT):  
       - Can they cooperate in Platonia/Defective Lottery *while* defecting in standard Luring Lottery?  
       - Does satisfying LCWCS require EDT-like evidential updates?  

  ### Expected Outcomes  
  - **Success**: Identification (or construction) of a decision rule that passes LCWCS.  
    - *Stronger result*: A formal proof separating logical/causal correlation in decision axioms.  
  - **Failure**: Demonstration that LCWCS is impossible without EDT’s evidential core.  
  - **Gray zone**: Hybrid rules that accept logical cooperation but reintroduce causal fragility elsewhere.  

  ### Scope & Limitations (1 Semester)  
  | **In Scope** | **Out of Scope** |  
  |--------------|------------------|  
  | Formalizing logical vs. causal correlation in decision matrices | Full game-theoretic solutions for multiplayer dilemmas |  
  | Testing 2–3 rules (e.g., CDT, EDT, FDT) on hybrid puzzles | Evolutionary stability or learning-theoretic analyses |  
  | Clarifying whether "twin cooperation" requires EDT | Newcomb-like predictors (focus on *correlation mechanics*, not prediction) |  
  | Negative result: "LCWCS implies EDT" is still valuable | Comprehensive taxonomy of all correlation types |  

  ### Why This Matters  
  If logical and causal correlation demand different treatment, failing to distinguish them:  
  - Undermines critiques of CDT (which *should* fail in Luring Lottery but *might* rightly fail in Platonia).  
  - Risks smuggling causal assumptions into "acausal" decision theories.  
  - Obscures whether "superrationality" is a coherent category or a mix of distinct phenomena.  

  ---  

  **Key Strengths of This Approach**:  
  - Targets a crisp, underappreciated distinction in foundational puzzles.  
  - Methodology (hybrid puzzles, LCWCS criterion) is actionable in workshop discussions.  
  - Success/failure conditions are clearly defined and philosophically significant.  
  - Respects semester constraints by narrowing to mechanism design and rule auditing.  

  **Spelling note**: "Correlation" corrected throughout — no mercy for typos in the final version! Let me know if you'd like to tighten any section further.
