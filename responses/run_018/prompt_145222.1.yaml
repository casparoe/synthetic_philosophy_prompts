  Here's the joke:

  After months of planning, development economist Malcolm and anthropologist Amina finally arrived in the remote village of Kojima to launch their clean water project. Everything hinged on Elder Bakari's blessing. Malcolm, clutching his FCPA handbook, saw Amina pull a bottle of expensive single malt from her bag.  

  "Whoa, Amina!" Malcolm hissed. "Gifting personal luxury goods to a key decision-maker? That's textbook bribery! Our donors will have kittens!"  

  Amina sighed, adjusting her field notes. "Malcolm, it’s *not* a bribe, it’s *kola*. It’s recognition, respect, the grease for the social machine. Refuse this, and you refuse the relationship. No obligation, no project. It’s clientelism *done right*."  

  "Semantics!" Malcolm argued. "An inducement for favorable treatment! Western auditors won't see 'kola', they'll see 'corruption'!"  

  Just then, Elder Bakari approached, his gaze resting on the whiskey. Amina smiled warmly and presented the bottle, explaining their project hopes. The Elder listened, then gently pushed the whiskey *back* into Amina's hands, his expression grave.  

  Malcolm nudged Amina, triumphant. "See? Even *he* knows it's improper! A man of integrity!"  

  Amina paled. "Malcolm, you idiot... He didn't refuse it because it's corrupt..."  

  She turned back to the Elder, who spoke softly: "You bring this fine water, but you withhold the *kola*? How can I trust pipes laid by strangers who offer no bond, who feel no debt? If there is no gift, there is no obligation. If there is no obligation," he shrugged, gesturing towards the crumbling, dry well, "why should this project work… *at all*?"  

  Malcolm stared, his anti-corruption flowchart crumpling in his mind, as Amina whispered: "Congrats. By Western rules, we avoided bribing him. By *his* rules, we just corrupted the entire social contract."  

  **Punchline:** The Elder didn't refuse the "bribe" out of integrity; he refused it *because* it broke the essential reciprocal obligation ("kola") – making the *lack* of "corruption" (by Western standards) the very thing that destroyed the trust needed for the project to function locally.
