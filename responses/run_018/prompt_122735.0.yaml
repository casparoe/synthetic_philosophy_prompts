answer: |-
  Here’s a targeted Q&A prep sheet ordered by likely objection sequence, tailored to your audience and thesis. I’ve prioritized objections that challenge your core claims early, saving theoretical disagreements for later.

  ---

  ### **Q&A Prep Sheet: Dennett’s "Where Am I?" and the Continuum Case**  
  **Core Thesis**: The "Where am I?" question lacks a determinate answer absent a *tracking practice*. The Continuum Case shows migration is real but arbitrary; ordinary identity questions implicitly rely on similar practices.

  ---

  #### **1. Olson-Style Animalist**  
  **Objection**: "This is confused from the start. Persons *are* human animals. The animal is on Mars; the vat contains an organ. Your ‘gradient’ just tracks when we misattribute personhood to a non-animal entity. There’s no ‘migration’—just a decaying brain and a prosthetic-controlled body."  
  **Reply**: "I agree the animal is on Mars throughout. But my question isn’t ‘Where is the *animal*?’—it’s ‘Where is *me*?’. We track persons differently: we care about responsibility, memory, and agency. Your view can’t explain why we’d hesitate to punish the Mars-body for Earth-brain’s pre-surgery crimes."  
  **Soft Spot**: Concedes biological identity is determinate. Must pivot to *personhood* as a pragmatic construct.  
  **Crucial Reply**: "If personhood reduces to animal identity, why does the Mars-body feel entitled to the Earth-brain’s pension?"  
  **Concede Early**: Biological continuity is unambiguous; persons aren’t metaphysically primitive.  

  ---

  #### **2. Enactivist (x2)**  
  **Objection**: "Your scenario never gets off the ground. A disembodied brain lacks sensorimotor coupling with a world—so it has no experiences, no agency. Dennett’s original case is science fiction; your continuum just extends the fantasy."  
  **Reply**: "I grant a lone brain *might* lack phenomenal consciousness. But the system *as a whole* exhibits agency: the Mars-body navigates deserts, signs contracts. We’re tracking a functional loop, not isolated parts. If you deny this, can you explain how *any* AI could be an agent?"  
  **Soft Spot**: Risks conceding too much to skepticism about vat-brains.  
  **Crucial Reply**: "Even if the brain is ‘idle’, its historical role grounds Mars-body’s claims—‘I remember signing the Mars mission papers.’ That’s why we track *persons*, not just bodies."  
  **Concede Early**: Isolated brains likely lack rich phenomenology; agency requires functional embedding.  

  ---

  #### **3. Systems Neuroscientist**  
  **Objection**: "Clinically, ‘you’ are wherever your cerebrum is. We declare brain death when it stops functioning. Your continuum is interesting, but why overcomplicate this? The cut-off is when the brain’s functional role drops below viability (e.g., <10% engagement)."  
  **Reply**: "I agree clinical criteria are vital! But they’re *practical*: we pick thresholds for transplant eligibility or legal death. My point is that there’s no *deeper fact* here. Why 10%, not 15%? Your threshold tracks *our* needs, not metaphysics."  
  **Soft Spot**: Must avoid sounding anti-science.  
  **Crucial Reply**: "Suppose the Mars-body commits a crime at 11% engagement. Is the brain liable? Your threshold can’t answer that—only a *purpose* (blame vs. biology) can."  
  **Concede Early**: Clinical/neural criteria are indispensable pragmatically.  

  ---

  #### **4. Parfit-Style Reductionist**  
  **Objection**: "This is just Parfit with extra steps! Psychological continuity (any cause) is what matters; identity is indeterminate in branching cases. Your ‘tracking practice’ is a needless gloss—we already have a cheaper solution."  
  **Reply**: "Parfit brilliantly shows identity isn’t what matters. But he assumes psychological continuity is *the* relation to track. My Mars case shows we might instead track the prosthetic controller’s autonomy for *legal* purposes. Practices select *which* relation matters—continuity isn’t privileged."  
  **Soft Spot**: Reductionism *does* handle much of this.  
  **Crucial Reply**: "Parfit tells us *whether* identity holds; I ask *which* entity we’re tracking when we say ‘I’. Your view can’t explain why we’d call Mars-body ‘me’ *before* psychological continuity fully transfers."  
  **Concede Early**: Parfit is right that identity isn’t what matters; my claim is about *reference*.  

  ---

  #### **5. Vagueness Metaphysician**  
  **Objection**: "This is a standard sorites series! There’s a fact about where the person is, but it’s vague—like ‘bald’ or ‘heap’. Supervaluationism/epistemicism solves this. No need for ‘practices’."  
  **Reply**: "Vagueness applies when there’s a property (e.g., ‘baldness’) with borderline cases. Here, there’s no property *to* be vague until we fix a tracking aim. Is it vague *where the animal is*? No. The indeterminacy is in *what we’re asking*."  
  **Soft Spot**: The continuum *looks* soritical.  
  **Crucial Reply**: "Draw a line: is it a *discovery* or a *decision*? If the former, what empirical test would locate it? If the latter, you’ve conceded my point."  
  **Concede Early**: Ordinary sorites exist; this is structurally different.  

  ---

  #### **6. General Hostility (Deflationism Skeptic)**  
  **Objection**: "This feels like surrender! If nothing fixes the answer, you’re saying there’s no person at all—or that reality is subjective. But our practices must *answer to* facts. Where’s the error in Dennett’s original puzzle?"  
  **Reply**: "I’m not denying reality; I’m saying ‘person’ is a concept for tracking responsibilities and memories across time. Like ‘dollar’ or ‘king’, it’s real but practice-dependent. Dennett’s puzzle *reveals* that ordinary cases rely on implicit practices too."  
  **Soft Spot**: Sounds suspiciously anti-realist.  
  **Crucial Reply**: "When two tracking practices conflict (e.g., brain vs. body for inheritances), we don’t discover who *really* is heir—we *choose* which continuity matters. That’s the deep lesson."  
  **Concede Early**: Non-deflationary theories are intuitive; mine reframes, not eliminates.  

  ---

  ### **The Feared Unasked Objection**  
  **Objection**: "Your Continuum Case adds nothing. Dennett *already* implies answers are interest-relative when he says ‘you are wherever you think you are’. Why not just say that and avoid metaphysics?"  
  **Why It’s Feared**: Forces you to defend your contribution against Dennett’s own text.  
  **Reply Draft**: "Dennett leaves the *source* of relativity implicit—I show it arises from *gradual* transfer, exposing arbitrariness. His reply is glib; mine systematizes why ‘thinking you’re there’ *isn’t* sufficient when the system fragments."  

  ---

  ### **Defense Strategy**  
  - **First 3 Replies**: Anchor in practical stakes (responsibility, phenomenology, clinical thresholds) to avoid abstract quagmires.  
  - **Parfit/Metaphysician**: Frame as complements, not rivals ("Parfit tells us *whether*, I tell us *which*").  
  - **Concede Early**: Biological facts, clinical needs, and Parfit’s insights are valid—but don’t resolve *personal* location.  
  - **Crucial Landing**: "Any non-arbitrary answer in the Continuum Case presupposes *what we care about*. The same is true when you ask ‘Where was I on Tuesday?’—we assume a default practice."  

  Good luck—your case is strong, but the room is tough. Focus on the Mars-body signing contracts or facing trial to make it vivid.
