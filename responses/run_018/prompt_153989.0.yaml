answer: |-
  ### 1. How to Read the Tree
  This decision tree helps clarify your stance by forcing choices on concrete dilemmas. Start at the top with **Case A: Your sister lied on her job application**. Answer the question by choosing **A1** or **A2**, then follow the path to the next case/question. Each branch hinges on a distinct philosophical tension within role ethics. Your final endpoint is a named position (if it aligns with a recognised view) or an "unnamed/odd combo". **Awkward commitments** highlight practical implications of that view you might find uncomfortable. The tree prioritises separating views based on how they resolve *conflicts* between roles or principles. British spellings (e.g., "prioritise", "recognised") are used throughout.

  ---

  ### 2. Branching Cases and Answer Options

  *   **Case A: Your sister lied on her job application. She begs you not to tell. Do you feel a strong duty to protect her *specifically because she's your sister*, regardless of the lie's severity?**
      *   **A1: Yes, the sister role itself creates this protective duty.** → Proceed to Case B.
      *   **A2: No, my duty is to honesty/fairness; her being my sister just makes this harder emotionally, not morally different.** → Proceed to Case C.

  *   **Case B (from A1): At work, you could cover for a close workmate's serious mistake. This would protect them but likely cause significant harm (e.g., financial loss, safety risk) to strangers/customers. Must you prioritise your workmate?**
      *   **B1: Yes, loyalty within established relationships (like colleagues) comes first, even over harm to distant others.** → Proceed to Case D.
      *   **B2: No, causing significant harm to outsiders breaks the limit of role-based loyalty. My duty shifts.** → Proceed to Case E.

  *   **Case C (from A2): Your parent was emotionally abusive throughout your childhood. They are now frail, need daily care, and have no one else. Do you have an obligation to care for them?**
      *   **C1: Yes, the parent-child role creates a fundamental, non-negotiable duty, regardless of their past actions.** → **Endpoint: Strict Hierarchical Essentialism**
      *   **C2: No, their abuse fundamentally violated the parent role; my obligations dissolved. Care is charity, not duty.** → **Endpoint: Contractualist / Minimalist View**

  *   **Case D (from B1): Your parent was abusive but now needs care. Does your duty to them *as their child* still hold strongly, even given their past?**
      *   **D1: Yes, absolutely. Filial piety is paramount and unconditional within the hierarchy of roles.** → **Endpoint: Strict Hierarchical Essentialism**
      *   **D2: Only partially/conditionally. The role persists but is damaged; duty exists but is lessened or transformed.** → Proceed to Case F.

  *   **Case E (from B2): If a family member (e.g., your sister) consistently fails their role duties to you (e.g., betrays trust, shows no care), do your duties to them weaken or dissolve?**
      *   **E1: Yes, duties are reciprocal ("reciprocal activation"). If they abandon the role's core, my obligations fade.** → **Endpoint: Reciprocal Activation View**
      *   **E2: No, core role duties (like parent-child) are inherent and persistent, even if the other fails. How I fulfil them might change, but the duty remains.** → Proceed to Case F.

  *   **Case F (from D2 or E2): To care ethically for strangers/society, should we...**
      *   **F1: ...extend the *same quality* of care and loyalty we give family outwards ("treat strangers like family"), even if it weakens exclusive family ties?** → **Endpoint: Mencian Extension / Radical Care Ethics**
      *   **F2: ...develop a *different kind* of ethical concern for strangers (justice, rights, universal rules), preserving special duties within close relationships?** → **Endpoint: Modern Relational-Autonomy View**
      *   **F3: ...strengthen our core roles (family, community) because caring well within them *naturally* cultivates virtue that benefits society indirectly?** → **Endpoint: Role-Grounded Virtue Ethics**

  ---

  ### 3. The Leaves: Positions and Their Awkward Commitments

  *   **Strict Hierarchical Essentialism:** Roles are fixed, sacred, and hierarchically ordered (e.g., parent over child, ruler over subject). Duties are absolute and unconditional within the role. *Awkward Commitments:* You must obey/prioritise abusive parents or unjust superiors simply due to their role. Loyalty to immediate roles trumps harm to outsiders or core principles like justice.
  *   **Contractualist / Minimalist View:** Moral duties stem from agreements (explicit or implicit) or universal rules (like fairness, non-harm). Family roles offer no special moral weight beyond emotional bonds. *Awkward Commitments:* Caring for an abusive parent is purely optional charity. Protecting a lying sibling is mere favouritism, not duty. Family feels "thin".
  *   **Reciprocal Activation View:** Role duties are mutually binding; they activate only when both parties uphold the role's core expectations. Failure by one releases the other. *Awkward Commitments:* A single major betrayal (like parental abuse) could completely dissolve lifelong duties (like elder care). Constant vigilance over "who failed first" is needed.
  *   **Mencian Extension / Radical Care Ethics:** Ethical life starts with strong, natural care within family ("feeling for a child falling down a well"). We must consciously extend this *same* affective care outwards to all humanity. *Awkward Commitments:* Diluting exclusive family loyalty feels necessary. Requires immense emotional labour to feel genuine care for distant strangers comparable to kin. Can seem impractical.
  *   **Modern Relational-Autonomy View:** Close relationships generate special, context-specific duties, but these exist alongside universal duties (justice, rights). Autonomy involves navigating these spheres. Roles are flexible frameworks, not rigid scripts. *Awkward Commitments:* Constant balancing acts – when does loyalty to a colleague cross into complicity? Can feel like having "split moral personalities".
  *   **Role-Grounded Virtue Ethics:** Fulfilling familial/social roles well (with ren/humaneness) cultivates virtues (benevolence, righteousness, wisdom). This cultivated virtue then guides ethical action universally. *Awkward Commitments:* Caring for an abusive parent might be framed as "cultivating forbearance", potentially enabling harm. Progress relies on ideal role fulfilment, which may be lacking.
  *   **Unnamed / Odd Combo:** Your path combined answers not fitting major schools. *Awkward Commitments:* Likely involves unresolved tensions or unique personal principles needing further articulation. Might feel philosophically unstable.

  ---

  ### 4. Empty Branches and Inseparable Pairs

  *   **Empty Branches:** The tree avoids paths where the logic would lead to no clear position or contradictions *based on these specific cases*. For example, choosing A2 (no special duty to sister) logically bypasses questions about extending family loyalty outward (F1/F2/F3) because core role-duties are already rejected.
  *   **Inseparable Pairs (within this tree):**
      *   **Strict Hierarchy (C1/D1) vs. Unconditional Role-Grounded Virtue (F3):** Both might mandate caring for the abusive parent. The tree separates them via the workmate/harm case (B1 vs F3's indirect societal benefit) and the focus on *how* universal care is achieved (direct extension vs cultivated virtue).
      *   **Reciprocal Activation (E1) vs. Conditional Modern Relational (F2):** Both might justify reduced care for the abusive parent. The tree tries to separate them via the *reason* – reciprocity failure (E1) vs balancing special duties with universal ones (F2). However, in *practice* for this specific case, they could recommend the same action (limited care) for different philosophical reasons. The tree flags this via Case E focusing *only* on reciprocity.
      *   **Mencian Extension (F1) vs. Radical Care Ethics:** While Mencius is the inspiration, modern radical care ethics might reach F1 without the Confucian framework. The tree labels it jointly, as the core commitment (treating strangers like family) is shared, differing in historical/cultural justification rather than the practical commitment highlighted here.
