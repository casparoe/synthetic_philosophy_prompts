  2. These obligations include conforming to local conventions 
  3. Violation constitutes disrespect 

  Strongest counters would attack each premise. Like - does mere presence create obligations? What if the convention is actively harmful? Their tipping example is perfect here - following it perpetuates injustice. That feels like a fatal defeater to their position.

  The ignorance factor is trickier. They seem to imply obligation depends on knowledge, but what counts as "reasonable effort" to learn? That's where their view might get messy in practice. Tourists can't research every micro-custom.

