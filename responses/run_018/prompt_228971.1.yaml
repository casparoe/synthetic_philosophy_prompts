  ### Vetting Procedure for Looping Effect Claims

  **Step 1: Confirm Interactive Kind**  
  *Question:* Does the manuscript explicitly state that the classified entity is a *human kind* (e.g., people, behaviors, identities) capable of self-awareness and reactivity to classification?  
  - **Pass**: Clear identification of a human kind (e.g., "ADHD patients reinterpret their experiences after diagnosis").  
  - **Fail**: Non-human kind (e.g., "classifying viruses as 'high-risk'") or unsupported claim (e.g., "this classification affects outcomes" without specifying human reactivity).  
  *Failure action*: **Stop with verdict**.  
  *Output*: "Not a looping-effect claim. The kind is indifferent; recommend redescribing as labeling effects or institutional feedback without invoking Hacking."

  **Step 2: Identify Feedback Mechanism**  
  *Question:* Does the manuscript specify *how* reactions to the classification (by individuals/institutions) alter either (a) the classified people, (b) the classificatory scheme, or (c) the practice, creating cyclical feedback?  
  - **Pass**: Mechanism with actors, actions, and feedback (e.g., "Patients, aware of their diagnosis, form advocacy groups that lobby to expand diagnostic criteria, leading to more diagnoses").  
  - **Fail**: Unidirectional causal effect (e.g., "Stigma worsens symptoms" or "Labels cause social exclusion").  
  *Failure action*: **Downgrade**.  
  *Output*: "The loop is asserted but not shown; treat as a promissory note. Evaluate argument separately."

  **Step 3: Distinguish from Generic Social Construction**  
  *Question:* Is the feedback loop *dynamic* (ongoing, modifying the kind/scheme iteratively) and *causally driven* by reactions to classification (not just historical contingency or external interests)?  
  - **Pass**: Loop described as self-propelling (e.g., "Clinicians’ adoption of platform-influenced presentations amplifies similar future diagnoses").  
  - **Fail**: One-time construction/change (e.g., "The diagnosis was invented for political control") or external drivers (e.g., "Criteria changed due to pharmaceutical lobbying").  
  *Failure action*: **Handoff to referee judgment**.  
  *Reason*: Ambiguity in distinguishing looping from construction requires scholarly interpretation of causality and temporality.

  **Step 4: Verify Bidirectional Change**  
  *Question:* Does the manuscript document changes in *both* (a) the classified individuals/groups *and* (b) the classificatory scheme/practice?  
  - **Pass**: Evidence of mutual adjustment (e.g., "Individuals internalize diagnostic scripts (individual change), shifting clinical assessments (scheme change)").  
  - **Fail**: Only one side shown (e.g., "Stigma alters behavior" without scheme change, or "Criteria expanded" without individual change).  
  *Failure action*: **Downgrade**.  
  *Output*: "Incomplete loop; only [individuals/scheme] change shown. Qualify as a partial effect."

  ---

  ### Procedure Test on Hypothetical Submissions

  **Submission 1**: *Short-video platforms and ADHD diagnosis loops*.  
  - **Step 1 (Interactive)**: Pass. Kind: humans with ADHD.  
  - **Step 2 (Mechanism)**: Pass. Mechanism: Viewers self-reinterpret → scripted presentations → clinician anchoring → diagnostic drift → reinforces platform content.  
  - **Step 3 (vs. Construction)**: Pass. Dynamic: Drift in practice fuels more platform-influenced diagnoses.  
  - **Step 4 (Bidirectional)**: Pass. Individuals change (self-reinterpretation); scheme changes (diagnostic drift).  
  *Verdict*: **Valid looping claim**.

  **Submission 2**: *Mental disorder stigma worsens prognosis*.  
  - **Step 1 (Interactive)**: Pass. Kind: mentally ill individuals.  
  - **Step 2 (Mechanism)**: Fail. Only downward causation (label → stigma → worse outcomes). No feedback altering scheme/individuals iteratively.  
  - *Stop at Step 2*: **Downgrade**. "Treat looping as promissory note; stigma is unidirectional harm."

  **Submission 3**: *Diagnosis expansion via patient advocacy*.  
  - **Step 1 (Interactive)**: Pass. Kind: patients.  
  - **Step 2 (Mechanism)**: Pass. Mechanism: Classification → advocacy lobbying → criteria expansion → more diagnoses → stronger advocacy.  
  - **Step 3 (vs. Construction)**: **Handoff**. Lobbying could be seen as external interest (fail) or reactive feedback (pass). *Referee must decide*: Does lobbying represent a reaction to classification (looping) or interest-driven revision (construction)?  
  - **Step 4 (Bidirectional)**: Pass. Individuals change (organized advocacy); scheme changes (criteria expansion).  
  *Verdict*: **Step 3 handoff**; contingent on referee’s view of advocacy as loop vs. construction.  

  **Deliberate Discomfort**: Submission 3 passes Step 2 (unlike your instinct). Lobbying *can* be a feedback mechanism if advocacy is a reaction to classification. The discomfort highlights the **procedure’s strength**: It forces engagement with Hacking’s requirement that reactions need not be psychological (e.g., advocacy is institutional reactivity). Your instinct may overemphasize individual-level change.

  ---

  ### Sacrificed Distinctions for Runnability  
  1. **Subtle Reactivity**: False passes for claims where "awareness" is implied but not stated (e.g., institutional routines). False fails if reactivity is overly strict (e.g., passive internalization).  
  2. **Looping vs. Reinforcement**: Sacrificed Hacking’s emphasis on *new patterns of behavior* (e.g., "making up people") for generic "change." False passes for simple reinforcement loops.  
  3. **Temporal Depth**: Requires only one feedback cycle. False passes for one-time changes mislabeled as looping.  
  4. **Scheme vs. Practice**: No distinction between formal criteria (e.g., DSM) and clinical practice. False fails if only practice changes.  

  ### What the Procedure Cannot Do  
  1. **Judge Mechanism Plausibility**: Hands off to referee when:  
     - Reactions are inferred (not explicit).  
     - Historical/external factors dominate (Step 3 ambiguity).  
  2. **Assess Evidence Quality**: Cannot evaluate empirical support; only checks for presence.  
  3. **Handle Edge Cases**: Systematically mishandles:  
     - Non-psychological reactivity (e.g., bureaucratic adjustments).  
     - "Proto-looping" (e.g., initial classification without feedback).  
     - Theoretical manuscripts lacking examples.  
  **Outcome**: ~20% of manuscripts will require referee discretion (mainly at Step 3).
