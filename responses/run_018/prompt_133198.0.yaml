answer: |-
  ### Research Proposal: Computational Intractability and Normative Authority in Ethical Theories  

  **Title:** When Justice Can’t Compute: Complexity-Theoretic Challenges to Normative Theories  

  **Core Research Question:**  
  Does the computational complexity class of a normative decision procedure (e.g., aggregating preferences, ranking social states) undermine its authority as a moral theory, *irrespective* of human cognitive limits? Specifically:  
  1. Under what conditions does a theory’s membership in a high-complexity class (e.g., NP-hard, EXPTIME) render it "self-defeating" by failing to specify tractable obligations?  
  2. Can parameterized tractability (e.g., fixed-parameter tractability in the number of agents) or approximation algorithms preserve a theory’s normative force?  

  **Gap in Existing Scholarship:**  
  Philosophy of computation/ethics focuses almost exclusively on *bounded rationality*: agents’ inability to compute optimal acts due to cognitive constraints (e.g., Gigerenzer, Simon). This project addresses a distinct problem: whether a theory’s *own formal structure* demands computations that are intractable *in principle*, even for idealized agents. Current work neglects how complexity classes—not just implementation—bear on a theory’s coherence as a guide to action.  

  **Methodology:**  
  *Phase 1: Formalization (Month 1)*  
  - Formalize two "toy" normative procedures as decision problems:  
    - **Model A:** A contractualist procedure requiring pairwise comparisons of feasible worlds for all affected agents (inspired by Scanlon).  
    - **Model B:** A preference aggregation rule (e.g., Kemeny ranking) merging individual ordinal rankings into a social ordering.  
  - Define inputs, outputs, and correctness conditions (e.g., "correct" = satisfies theory’s axioms).  

  *Phase 2: Complexity Analysis (Month 2)*  
  - Determine the worst-case time complexity of exact computation for each model:  
    - Prove membership in complexity classes (e.g., NP-hard, #P-hard) via reduction from known problems (e.g., SAT, Traveling Salesman).  
    - Identify fixed parameters (e.g., number of agents *k*, preference domain constraints) and assess fixed-parameter tractability (FPT).  
  - *Collaboration:* Consult CS colleagues for rigor; focus on conceptual implications.  

  *Phase 3: Normative Evaluation (Month 3)*  
  - Assess whether intractability undermines authority:  
    - If exact computation is NP-hard/EXPTIME: Does the theory demand the impossible?  
    - If FPT in *k*: Does tractability for small groups (e.g., committees) but intractability for populations (e.g., states) create inconsistent obligations?  
    - Evaluate approximation algorithms: Can a procedure with provable error bounds (e.g., ϵ-optimal rankings) retain normative force?  

  **Expected Outcomes & Significance:**  
  - A framework linking complexity classes to normative "feasibility" beyond human limits.  
  - Concrete examples demonstrating how complexity can:  
    - **Preserve authority:** E.g., FPT theories justifiable for small-scale decisions.  
    - **Undermine authority:** E.g., NP-hard theories where even approximations violate core axioms.  
  - **Philosophical Insight:** Challenges the assumption that "ought implies *logically* can" suffices; suggests "ought implies *computationally* can."  

  **Scope and Limitations:**  
  - **In scope:** Formalizing discrete decision problems; classical complexity (P, NP, FPT); normative implications of *formal* intractability.  
  - **Out of scope:** Continuous optimization; quantum computing; empirical psychology.  
  - **Skills boundary:** I will leverage basic logic/discrete math and collaborate with CS on technical proofs. Focus remains on *philosophical interpretation*.  

  **Defining Success/Failure:**  
  - **Success:** Demonstrating that complexity classes create novel philosophical problems for ≥1 major theory; articulating criteria for when tractability matters normatively.  
  - **Failure:** Finding all toy models trivially in P; discovering complexity arguments collapse into existing critiques (e.g., indeterminacy).  
  - **Risk mitigation:** If models are too simple, I’ll incorporate richer constraints (e.g., fairness axioms).  

  **Timeline:**  
  - **Month 1:** Literature review (philosophy of computation, social choice); formalize Model A/B.  
  - **Month 2:** Complexity classification; consult CS; draft analysis.  
  - **Month 3:** Normative evaluation; write results; refine framework.  

  This project bridges formal ethics and theoretical computer science to reveal a hidden challenge: if a theory demands the computationally impossible, it may fail not as a guide for *humans*, but as a coherent theory *at all*.  

  ---  
  *Format note: This structured 2-page proposal excludes citations per request. Key sections (gap, methodology, outcomes) are emphasized for clarity. Philosophical stakes drive the technical work.*
