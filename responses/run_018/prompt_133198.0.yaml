  I'm putting together an application for a 3-month summer research grant through my philosophy dept and I need a tight two-page proposal, but my idea is kind of messy right now. I was reading about parameterized complexity and it hit me that philosophers talking about computation and ethics realy only discuss bounded rationality — like, agents can't compute the optimal choice because they're human. But there's a separate problem: what if the normative theory itself demands computing something that's NP-hard, or not in P at all? Take some contractualist or social-choice aggregation procedures that have to rank all feasible worlds or merge preference profiles; the exact computation might blow up exponentially. So my half-baked question is whether the complexity class of a normative decision procedure undermines the theory's authority — not because people are too dumb to run it, but because the theory can't even specifiy the right answer in tractable time. And parameterized tractability might save certain versions: maybe it's intractable for large populations but fixed-parameter tractable in the number of agents, which would mean a small board can literally compute justice but a nation-state can't.

  I want you to turn this into a proper proposal with a precise statement of the question, why existing philosophy of computation doesn't settle it (they focus on cognitive limits, not on whether a theory is self-defeating due to its own formal demands), and what I'd actually do month by month — probably formalize two toy normative procedures, classify their complexity, then argue whether approximation algorithms with bounded error preserve normative force. Say what a result would look like and what counts as failure, and be honest about scope since I'm philosophy-trained with only basic logic. Don't include citations, a bibliography, or a literature review by reference; I'll fill those in myself later. There's probably a typo or two in this message, sorry about that.
