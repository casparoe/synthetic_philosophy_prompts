  The user specifically wants this translated into their narrative vocabulary. Terms like "plot causality" could map to Bentham's harm principle—private acts shouldn't cause harm, so they shouldn't disrupt the plot unless there's actual damage. "Emotional bookkeeping" might align with Bentham's idea that pleasure adds value. Disgust as "bad accounting" becomes a failure in the character's logic, creating dramatic irony when others oppose without reason.

