  I notice they emphasize avoiding forced rhymes—that's crucial. The language must feel natural even when discussing abstract concepts. Also, the "student" persona they suggest is smart; it creates immediacy. Their frustration with binary answers ("guilty/innocent") tells me the poem must dwell in ambiguity, like Jaspers' own unresolved tension about German postwar guilt. 

  For the octave's "relief," I'll use legal metaphors ("no warrant," "judge") to contrast with the volta's shift to metaphysical weight ("unseen chain," "earth still bears the stain"). The couplet needs open-ended verbs—"haunt," "call," "demand"—to avoid resolution. 

  ...Wait, should "metaphysical guilt" appear explicitly? Probably not; better shown through "breath" and "earth" imagery to imply connection beyond crime. The historical wrong must feel tangible but unnamed (let readers project their own contexts). 

