  Here is the Thucydidean analysis restated in modern behavioral terms, followed by the residue report:

  ### Translation to Behavioral Economics/Organizational Psychology Vocabulary  
  1. **Mytilene Debate Reversal (427 BCE):**  
     Initial punitive judgment resulted from **affect heuristics** (anger toward rebellion) amplified by **informational cascades** (assembly members adopting peers’ emotional signals as rational). Cleon’s rhetoric exploited **preference falsification** (suppressing reservations about brutality to align with perceived majority). Diodotus countered via **affect substitution** (replacing anger with fear of future costs), triggering a new cascade. The reversal illustrates **epistemic fragility**: public preferences shifted via emotional framing, not deliberative updating.  

  2. **Sicilian Expedition Vote (415 BCE):**  
     Nicias’s risk assessment failed due to **rational ignorance** (voters undervaluing complex probability data). Alcibiades leveraged **aspirational affect heuristics** (glory/wealth fantasies) and **group polarization** (rhetoric amplifying pro-war biases). **Epistemic bubbles** excluded skeptical voices (e.g., strategic overreach warnings), while **social proof cascades** normalized hubris. Collective discounting of losses exemplifies **probability neglect** under emotional arousal.  

  3. **Condemnation of Socrates (399 BCE, post-Thucydides but implicit in his framework):**  
     Socratic dissent was misclassified as civic corruption via **outgroup homogeneity bias** (equating philosophical critique with anti-group loyalty). **Preference falsification** silenced defenders fearing social sanction. **Affect heuristics** (fear of ideological contamination) overrode **epistemic vigilance**, conflating heuristic-driven suspicion ("corrupting youth") with objective threat assessment.  

  ---

  ### Residue Report: Mapping Gaps and Distortions  
  **Mytilene Reversal**  
  - **Clean Fit:** Preference falsification + affect heuristics perfectly capture rhetorical manipulation and emotional contagion.  
  - **Residue:** Thucydides emphasizes *collective moral responsibility*—the reversal isn’t just preference updating but an accountability ritual. Behavioral terms miss the *civic identity* dimension: Athens debating "who we are" (punitive vs. strategic selves).  

  **Sicilian Expedition**  
  - **Clean Fit:** Rational ignorance + group polarization map to dismissal of Nicias’s data and Alcibiades’s polarization.  
  - **Distortion Required:** Thucydides frames the vote as *collective hybris*—a *moral failing* enabled by democracy’s structure. Behavioral terms reduce this to cognitive bias; they cannot capture *democratic authority* legitimizing irrational choices as sovereign will.  
  - **Residue:** The *symbolic weight* of the expedition (Athens proving its imperial vitality) exceeds "aspirational affect." Uncaptured: Democracy’s need for grandeur to sustain legitimacy.  

  **Socratic Dissent as Subversion**  
  - **Partial Fit:** Outgroup bias explains demonization, preference falsification maps to silent allies.  
  - **Critical Residue:** Behavioral frameworks lack a concept for *philosophical truth-seeking vs. civic orthodoxy*. Socrates’ trial involves *epistemic authority*: Who defines "corruption"? Thucydides’ implicit critique—democracy conflating social cohesion with truth—requires normative ideas of *deliberative integrity* absent in behavioral vocab.  

  ---

  ### Assessment of the Residue  
  1. **Gaps in Behavioral Economics:**  
     - **Normative Vacuum:** Models describe *how* groups err but omit *why democratic legitimacy intensifies certain errors*. Thucydides shows democracy’s need for consensus inflames affect heuristics (e.g., Sicily as identity affirmation).  
     - **Civic Identity Blindspot:** Terms like "group polarization" don’t capture the *sacralization of collective decisions* (post-vote, Sicily becomes "Athenian destiny," irreversibly legitimized).  
     - **Moral Responsibility:** Behavioral economics individualizes bias; Thucydides stresses *institutionalized irresponsibility* (e.g., assembly anonymity enabling preference falsification).  

  2. **Pathologies Beyond Democracy?**  
     The residue suggests Thucydides *does* identify distinct democratic failures:  
     - **Legitimacy-Accountability Tension:** Quick reversals (Mytilene) reflect democracy’s susceptibility to rhetorical capture when linking popular will to legitimacy.  
     - **Sovereignty Epistemology:** Democratic bodies claim unique authority to *define reality* (e.g., Socrates’ "corruption"), a vulnerability absent in hierarchical systems.  

  **Conclusion:** While behavioral terms map mechanics cleanly, the residue reveals a core gap: **democratic legitimacy’s dependence on emotional affirmation and symbolic action**. Thucydides implies democracies fail *specifically* when deliberation collapses into performative sovereignty—where decisions serve identity reinforcement over strategic rationality. Behavioral economics, focused on universal cognitive flaws, cannot explain why these flaws *threaten democracy’s foundations* rather than merely producing suboptimal outcomes. The residue thus highlights democracy’s unique paradox: its strength (civic participation) fuels its signature failures.
