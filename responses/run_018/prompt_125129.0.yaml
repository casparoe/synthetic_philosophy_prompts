prompt: |-
  I'm helping a friend organize a grad-level applied-ethics seminar and we're trying to put together a decision-tree handout on sex-work regulation that doesn't just ask students "Nordic or NZ?" Instead, they should work through concrete claims — like whether licensing protects workers or just creates a two-tier market, whether criminalizing buyers actually reduces demand without pushing supply underground, and whether decriminalization only works if labor rights are already robust — and land on a leaf: the Nordic model, the German/Dutch legalization setup, NZ-style decrim, or maybe an unnamed hybrid. There's one weird branch I want you to inject: a hypothetical regime that fully decriminalizes exchange but explicitly bars collective barganing for workers, which I think sits awkwardly between legalization and decrim and might even be incoherent.

  Please act as an expert in feminist political philosophy and comparative labor policy. Before you draw the tree, do a quick brainstorm of the logical space: map out which answer-combinations are actually defended in the literature, which ones are empty, and flag any pair of leaves your tree can't really separate — for instance, I suspect some Nordic-model supporters and some legalization critics might converge on certain answers about state oversight. Each branch should be phrased as a yes/no or either/or claim that a student could answer without knowing the label, and every leaf should carry one sentence on its most awkward commitment. Keep it all usable for someone with no web access — so no reading lists, no citation requests, just the taxonomy, the scoring logic, and a brief diagnosis of the unoccupied spots. Think carefully, step through the branches slowly, and make sure the weird hybrid case actually gets placed somewhere rather than ignored.
reasoning: |-
  Okay, let me approach this systematically. The user wants a decision tree for grad-level applied ethics that moves beyond simplistic model comparisons and digs into underlying philosophical tensions. They're specifically interested in how different policy combinations play out in real-world labor contexts, with attention to that awkward hybrid case where decriminalization exists without collective bargaining rights.

  Hmm, the challenge here is mapping the logical relationships between principles without oversimplifying. Feminist political philosophy offers useful frameworks here - particularly how state power interacts with bodily autonomy versus labor exploitation. The Nordic model's asymmetric criminalization raises questions about state paternalism, while the German/Dutch licensing approach creates tension between harm reduction and market formalization. 

  I notice the user wants concrete claims phrased as yes/no questions. Important to avoid false binaries though. For example, "does criminalizing buyers reduce demand?" needs to acknowledge evidence that it may merely displace rather than reduce. And that peculiar hybrid case - decriminalization without collective bargaining - feels like it exposes a contradiction in libertarian approaches that recognize individual transaction rights but deny collective worker power.

  The comparative labor policy angle suggests we should highlight how each model handles worker vulnerability. Legalization regimes often create tiers between licensed and unlicensed workers, while decriminalization relies heavily on pre-existing labor infrastructure. That weird hybrid would likely fail both tests - no criminal penalties but no power to address structural exploitation either.

  For the tree structure, I'm considering starting with foundational questions about state coercion before moving to labor protections. Key branch points should be: 1) Is any adult party criminalized? 2) Does regulation create privileged tiers? 3) Are workplace protections state-enforced or market-based? 4) Can workers collectively organize? Each answer combination should lead to a model while exposing its core tension.

  The unoccupied spots in policy space are revealing too. Nobody seriously argues for criminalizing sellers while decriminalizing buyers, for instance. And few defend decriminalization without supporting labor rights - which makes that user-specified hybrid theoretically interesting precisely because it's so pragmatically unstable.
answer: |-
  Here's a decision tree framework grounded in feminist political philosophy and comparative labor policy analysis. It isolates core contested claims, forces examination of internal tensions, and includes your specified hybrid case. The taxonomy identifies defended/undefended positions and convergence points.

  **Logical Space Brainstorm:**
  1.  **Defended Combinations:**
      *   **Nordic Model:** Criminalize Buyers (Yes), Decriminalize Sellers (Yes), *No* Formal Licensing/Market Regulation (Implied No), *No* Collective Bargaining Rights (Usually No/Ambiguous).
      *   **German/Dutch Legalization:** Decriminalize Exchange (Yes), *Require* Licensing/Registration (Yes), State Oversight & Regulation (Yes), Ambiguous/Contested Collective Bargaining Rights.
      *   **NZ-Style Decrim:** *Full* Decriminalization (Yes), *No* Special Licensing (No), *Equal* Labor Rights & Protections (Yes), *Strong* Collective Bargaining Rights (Implied Yes).
      *   **Full Criminalization:** Criminalize Sellers (Yes), Criminalize Buyers (Yes) - Defended by some abolitionists focused on inherent harm.
      *   *(Your Hybrid):* **"Atomized Decrim":** Decriminalize Exchange (Yes), *No* Licensing (No), *Bar* Collective Bargaining (Yes) - Marginally defended by extreme libertarians prioritizing transaction freedom over labor power.

  2.  **Empty/Undefended Combinations:**
      *   **Criminalize Sellers Only:** Lacks coherent philosophical basis; seen as unfairly targeting the most vulnerable party without addressing demand.
      *   **Mandatory Licensing Without Decriminalization:** Creates a licensed tier while leaving others criminalized; incoherent and unjustifiable.
      *   **Strong Collective Bargaining Rights Under Full Criminalization:** Logically impossible; criminalization precludes recognized labor rights.

  3.  **Convergence Points (Tree Limitation):**
      *   **State Oversight:** *Both* some Nordic supporters (for victim support/policing exploitation) *and* some German/Dutch proponents (for health/safety regulation) endorse significant state involvement, though their *focus* differs (welfare/policing vs. market regulation).
      *   **Opposition to Unregulated Markets:** *Both* Nordic proponents (fear exploitation) *and* some NZ-style proponents (fear inadequate labor protections without specific laws) might answer "No" to "Is an unregulated market acceptable?" for different reasons. The tree distinguishes them via the *buyer criminalization* and *labor rights* questions.

  ---

  **Applied Ethics Seminar: Sex Work Regulation Decision Tree**

  *Answer each question based on core principles and evidence claims, NOT model names.*

  **Start:**

  1.  **Should consensual sexual exchange between adults itself be a criminal offense?**
      *   **Yes →** Go to 2A
      *   **No →** Go to 2B

  **Branch A (Exchange Criminalized):**

  2A.  **Which party(ies) should bear criminal liability?**
      *   **Sellers Only →** *Leaf: **Seller-Targeted Criminalization*** (Undefended Combination)
          *   *Awkward Commitment:* Unilaterally penalizes the party presumed most vulnerable without deterring demand or providing exit support.
      *   **Buyers Only →** Go to 3A
      *   **Both Buyers & Sellers →** *Leaf: **Full Criminalization (Abolitionist)***
          *   *Awkward Commitment:* Treats all sex work as inherently non-consensual or harmful per se, risking driving the entire trade underground with no safeguards.

  3A.  **(Buyers Criminalized Only) Does the state have a primary obligation to actively provide exit services and welfare support for sellers?**
      *   **Yes →** *Leaf: **Nordic Model***
          *   *Awkward Commitment:* Relies on policing buyers as the primary tool to reduce harm while potentially increasing vulnerability and stigma for sellers operating underground.
      *   **No →** *Leaf: **Symbolic Ban*** (Largely Undefended)
          *   *Awkward Commitment:* Criminalizes buyers symbolically without materially reducing demand or supporting sellers, likely worsening conditions.

  **Branch B (Exchange Decriminalized):**

  2B.  **Should sellers be required to obtain special state licenses or registrations not required for other service workers?**
      *   **Yes →** Go to 3B
      *   **No →** Go to 4B

  3B.  **(Licensing Required) Does formal licensing demonstrably protect workers' health/safety *more* than universal labor laws and decriminalization alone?**
      *   **Yes →** Go to 4B (Converges with Licensing)
      *   **No →** *Leaf: **German/Dutch Legalization (Critique)*** (Position arguing regulation fails core goal)
          *   *Awkward Commitment:* Creates a state-sanctioned two-tier market where licensed workers face heavy surveillance and unlicensed workers remain fully exposed.
      *   **Yes →** *Leaf: **German/Dutch Legalization (Defended)***
          *   *Awkward Commitment:* Risks commodifying bodies through state-administered market regulation and pushing non-compliant workers into illegality.

  4B.  **(Licensing OR No Licensing) Should sex workers have the *same* state-enforced labor rights (safety, contracts, minimum wage) as other workers?**
      *   **No →** *Leaf: **"Atomized Decrim" (Your Hybrid)***
          *   *Awkward Commitment:* Recognizes transactional freedom while actively denying workers the collective power needed to enforce safety or fair terms, likely perpetuating precarity.
      *   **Yes →** Go to 5B

  5B.  **(Labor Rights Ensured) Is the explicit right to form unions/collectives and bargain collectively essential for effective worker protection in this sector?**
      *   **No →** *Leaf: **Minimalist Decrim*** (Rarely Defended Coherently)
          *   *Awkward Commitment:* Assumes individual rights and generic laws suffice in a sector rife with stigma, power imbalances, and unique risks, neglecting collective agency.
      *   **Yes →** *Leaf: **NZ-Style Decriminalization***
          *   *Awkward Commitment:* Requires robust existing labor law institutions and cultural acceptance to function effectively; risks failing if these preconditions are weak.

  ---

  **Taxonomy & Diagnosis:**

  *   **Occupied & Defended:** Nordic, German/Dutch Legalization (defended), Full Criminalization, NZ-Style Decrim, "Atomized Decrim" (marginally).
  *   **Occupied & Critiqued:** German/Dutch Legalization (critique), Seller-Targeted Criminalization (critique).
  *   **Empty:** Criminalize Sellers Only, Mandatory Licensing Without Decrim, Collective Bargaining under Criminalization.
  *   **Tree Limitations:** Distinguishes models via *criminalization focus*, *licensing*, and *labor/collective rights*. It captures the core distinctions but may oversimplify nuances within models (e.g., variations in Nordic implementation). The convergence on state oversight/market rejection is noted but separated by *why* and *how* that oversight manifests (buyer criminalization vs. licensing vs. labor law enforcement).
  *   **Your Hybrid ("Atomized Decrim"):** Placed logically after affirming decriminalization and rejecting licensing, but *denying* collective bargaining rights despite affirming individual labor rights. Its "awkward commitment" highlights the tension between recognizing the *transaction* and denying the *worker* collective power, exposing a potential incoherence in prioritizing market freedom over worker agency. It sits distinctly apart from both robust decrim (NZ) and regulated legalization (Germany).
