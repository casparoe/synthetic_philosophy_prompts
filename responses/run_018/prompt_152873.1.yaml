answer: |-
  ### Final Exam Question: Decision Theory Seminar  
  **Essay Prompt (30 minutes):**  

  Consider an agent who values money *state-dependently*:  
  - Utility of $x on **Tuesday (T)**: $u_T(x) = x$  
  - Utility of $x on **Wednesday (W)**: $u_W(x) = 2x$ (i.e., money is twice as valuable on Wednesday).  

  On Monday, the agent has initial self-locating beliefs:  
  - $P(\text{Today=T}) = P(\text{Today=W}) = 0.5$.  

  She receives a credible, non-causal signal: "**Today is Tuesday**." She updates via Bayesian conditioning, so $P(\text{Today=T} | \text{signal}) = 1$.  

  A **money-pump argument** is constructed:  
  1. **Pre-signal:** Offered a "Tuesday coupon" for $ε ($ε > 0$) that pays $1 on Tuesday or $0 on Wednesday.  
  2. **Post-signal:** After updating, she is offered to sell the coupon back for $0.50.  
  Critics argue she accepts both trades (net loss: $ε - $0.50$) and is thus incoherent.  

  **Tasks:**  
  (a) Formalize the money-pump vulnerability using dynamic decision trees and state-dependent utilities.  
  (b) Identify precisely how state-dependent utility breaks the money-pump *in this scenario*.  
  (c) Evaluate whether the *most defensible solution* is to:  
  &nbsp;&nbsp;&nbsp;&nbsp;(i) Reject state-dependent utility,  
  &nbsp;&nbsp;&nbsp;&nbsp;(ii) Revise the updating rule (e.g., to Jeffrey conditioning), or  
  &nbsp;&nbsp;&nbsp;&nbsp;(iii) Weaken diachronic coherence requirements.  
  Justify your choice.  

  ---

  ### Model Answer (≈600 words)  

  **(a) Setup**  
  The money pump exploits the agent’s changing valuations across time-states. Pre-signal (Monday), she evaluates the coupon using *expected utility* under her prior:  
  $EU(\text{buy}) = 0.5 \cdot u_T(1) + 0.5 \cdot u_W(0) - u_{\text{Mon}}(ε) = 0.5(1) + 0.5(0) - ε = 0.5 - ε$.  
  Since $ε < 0.5$, she buys it. Post-signal, she updates to $P(\text{T})=1$. Now:  
  $EU(\text{sell}) = u_T(0.50) = 0.50$ (since she believes today is Tuesday).  
  Selling dominates holding the coupon (worth $u_T(1)=1$ but she values $0.50$ cash *now* equally under $u_T$). She sells. Net monetary loss: $ε - 0.50$.  

  **(b) Breakdown of the Pump**  
  The pump fails **because money has state-dependent marginal utility**. Crucially, the *net loss is not utility-linear*:  
  - If **today is Tuesday**, she loses $ε - 0.50$ but values it at $u_T(ε - 0.50) = ε - 0.50$.  
  - If **today is Wednesday**, she *still loses* $ε - 0.50$, but $u_W(ε - 0.50) = 2(ε - 0.50)$.  
  Her *ex ante* expected utility loss is:  
  $0.5 \cdot (ε - 0.50) + 0.5 \cdot 2(ε - 0.50) = 1.5(ε - 0.50)$.  
  For $ε < 0.50$, this is negative (i.e., a net *gain* in expected utility). **State-dependence breaks the pump by making monetary losses less harmful in high-utility states (Wednesday)**, rendering the trades jointly advantageous.  

  **(c) Evaluation**  
  The cheapest fix is **(ii) revise the updating rule**.  
  - Rejecting state-dependent utility (i) is unmotivated: Valuations *do* contextually vary (e.g., emergencies raise the value of money). Forcing state-independence ignores rational preferences.  
  - Weakening coherence (iii) (e.g., allowing "reasonable" pumps) invites arbitrariness and loses normative force.  
  - Instead, adopt **Jeffrey conditioning**: Update beliefs *and* utilities simultaneously. Post-signal, the agent should not fully shift to $u_T$ but weight utilities by her *posterior state uncertainty*. Here, the signal ("today is Tuesday") might not erase doubt about the *state* of Wednesday’s utility. Jeffrey updating avoids extreme shifts in utility assignments, preventing exploitation. This preserves state-dependence while restoring coherence.  

  ---

  ### Marking Scheme (20 marks total)  
  **Must-hit points (4 marks each):**  
  1. **Correct pre-signal EU calculation** for buying the coupon, including state-dependent utilities and prior beliefs.  
     *Common botch: Ignores utility differences between T/W or misapplies prior probabilities.*  
  2. **Correct post-signal EU calculation** for selling, using updated beliefs and utility $u_T$.  
     *Common botch: Uses $u_W$ post-signal or fails to justify selling given updated beliefs.*  
  3. **Identification of state-dependence as breaker**: Explicitly computes *ex ante* expected net *utility* (not money) and shows it is non-negative/gains.  
     *Common botch: Only shows monetary loss without utility conversion.*  
  4. **Evaluation of solution (ii)**: Argues Jeffrey conditioning (or similar) resolves incoherence by moderating belief-utility shifts, *without* rejecting state-dependence.  
     *Common botch: Advocates for (i) or (iii) without addressing normative weaknesses.*  
  5. **Critique of alternatives**: Notes that (i) is empirically unjustified and (iii) abandons core normative constraints.  
     *Common botch: Claims state-dependence is "irrational" or that coherence is expendable.*  

  ---

  **Note to examiner**: This question tests nuanced interplay of belief revision, utility state-dependence, and dynamic consistency. Strong answers will disentangle *belief updates* from *utility contextuality* and explicitly reject money-neutrality assumptions.
