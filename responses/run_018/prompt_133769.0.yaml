  Here's a quick conceptual map followed by the joke. Dryness and structural integrity are assured.

  **Brainstorm Map:**
  *   **Cathedral Dome (Functional Constraint):** = Core Language Processing Modules (Syntax, Semantics, Pragmatics - evolved for efficient communication/information transfer).
  *   **Architectural Necessity:** = Cognitive efficiency; need for combinatorial, recursive, predictive systems.
  *   **Pendentives (Structural Solution):** = Specific neural/cognitive mechanisms enabling combinatorial language (e.g., merge operation, hierarchical processing).
  *   **Spandrels (Inevitable Byproduct):** = The vast combinatorial *space of possible outputs*, including nonsensical, paradoxical, or semantically incongruent combinations (i.e., the raw material of absurdity).
  *   **Adaptationist Mistake:** = Attributing the *cultural elaboration* of absurdist humor (jokes, art) *directly* to selection for social bonding, ignoring its origin in the unavoidable physics of the linguistic arch.
  *   **Punchline Tension:** = Does the spandrel's *derivative* status (from the arch) undermine its richness/cultural value? (Spoiler: No, but pointing it out makes adaptationists squirm).

  ---

  **The Joke:**

  **(Setting: Dimly lit corner booth at the "Phylogeny Pub" during the International Society for Behavioral Evolution conference. Two evolutionary psychologists, ALICE (adaptationist leanings) and BERNARD (spandrel enthusiast), nurse lukewarm beers.)**

  **ALICE:** (Gesturing vaguely towards raucous laughter across the bar) See? Proof. Absurdist humor *must* be an adaptation. Gallows humor, bonding over shared nonsense, signaling cognitive flexibility – classic group selection benefits. Why else would Kafka resonate? It's fitness-enhancing!

  **BERNARD:** (Takes a slow sip, stares into middle distance) Alice. Consider the dome. The glorious, functional dome of language. Efficient communication vaulting overhead. To support it... pendentives. Inevitable constraints of recursion, combinatorics. *Between* them... the spandrels. Not accidents. Not leftovers. Necessary voids filled purely because the arch demands curvature.

  **ALICE:** (Eyes narrow slightly) Bernard, we're talking about why people laugh at ducks quoting Sartre, not medieval architecture.

  **BERNARD:** Precisely. The combinatorial engine that builds "Pass the salt" *also* generates "The invisible teapot orbits my existential dread." It *has* to. The space between functional utterances is vast and inherently absurd. We *elaborate* it socially, sure. We gild it, paint narratives on it, bond over it. But the absurdity itself? Pure spandrel. An unavoidable byproduct of the linguistic arch.

  **ALICE:** (Leans in) So what? Does that make Monty Python any less valuable? Less *real*? Just because it fell out of the geometry?

  **BERNARD:** (A faint, dry smile appears) Ah! The crux. Does the Sistine Chapel ceiling *lose legitimacy* because Michelangelo painted on a structural inevitability? Or does its existence, *precisely because* it transforms necessity into grandeur, become... profoundly ironic? The punchline, Alice, isn't that absurdism is *just* a spandrel. It's that demanding every beautiful, bizarre thing must be an *adaptation*... is like complaining the ceiling would look better without that pesky dome holding it up.

  **(Bernard taps his empty glass pointedly on the table. Alice stares at her beer, momentarily silent, contemplating the weight of the arch.)**

  ---

  **Why it (dryly) works:**
  1.  **Accurate Spandrels:** Emphasizes "necessary byproduct," "architectural constraint" (pendentives), "filled space," avoiding "accident" or "leftover."
  2.  **Core Tension:** Directly pits adaptationist bonding theory (Alice) against the structural byproduct origin (Bernard).
  3.  **Punchline Logic:** The humor hinges on Bernard flipping the value question *back* onto the adaptationist assumption itself. The legitimacy isn't *in* the spandrel being adaptive, but in the absurdity of *demanding* it must be, given its origin. The Michelangelo analogy highlights the transformative potential *of* the spandrel space.
  4.  **Dry Delivery:** Understated phrasing ("necessary voids," "pure spandrel," "profoundly ironic," "pesky dome"), the faint smile, the glass tap.
  5.  **Knows its Audience:** Uses correct terminology (pendentives, combinatorics), assumes knowledge of the critique's core (structural necessity vs. adaptation), avoids cheap Darwin references.

  It lands because the grad students will recognize the *exact* philosophical tension in Bernard's final point – and appreciate the meta-absurdity of framing the argument about absurdism within the spandrel framework itself. Good luck with the seminar!
