prompt: |-
  hey, so in evolutionary bio people constantly say genes are like recipes in a cookbook and organisms are just the cakes — the recipe gets copied, the cake gets eaten, so selection only really operates on recipes. they use this to relax away group selection, like saying asking if groups adapt is as silly as asking if the cake wanted to be sweet. how far does that analogy actually hold?

  give me the correspondance table — recipe -> gene?, cake -> organism?, chef -> ?, cookbook -> genome?, oven -> environment?, taste-test -> fitness? — then where it breaks. does it quietly assume replication has to be verticle and digital? and what happens when you inject niche stuff like bacterial pangenomes with massive horizontal gene transfer, or hologenomic inheritance in reef corals where the 'recipe' is split between cnidarian DNA and symbiont microbiome and vertical transmission is a mess?

  tell me whether the relaxed 'genes-only' conclusion survives once those breaks are on the table, or whether the recipe framing was smuggling in the answer all along. end with a one-line verdict: Verdict: ...
