  - Then for each node, subsequent questions about swapped foundations (Q2), heritability (Q3), and moral scope (Q4)

  I'll include all requested elements:
  - Swapped foundations case at Q2
  - Heritability/framing at Q3
  - Moral scope question at Q4
  - Unoccupied positions in item 5
  - Distinctions between positions that collapse
  - That one character-specific line

  The taxonomy will end with exactly five numbered points without introduction or conclusion. For the character-specific line in item 5, I'll have something the moral psychology character might say about debunking both sides.
answer: |-
  1. **Entry commitment**: People differ in weight given to care, fairness, loyalty, authority, sanctity; these differences predict left/right alignment.  
     *Branch question*: **Q1: What primarily drives left-right disagreement?**  
     → *Answer A: Weighting* (disagreement over how much priority each foundation deserves) → **Leaf A**  
     → *Answer B: Applicability* (disagreement over whether a foundation applies to a specific case) → **Leaf B**  
     → *Answer C: Facts* (disagreement only over empirical realities, e.g., "Does policy X harm group Y?") → **Leaf C**  

  2. **Q2 (for A/B only; C sidesteps psychology's relevance): Could identical foundation profiles produce opposite politics?**  
     → *Answer Yes*: Swapped foundations possible → **Leaf A1/B1**. Awkward: Profiles don’t track truth, only tribal alignment.  
     → *Answer No*: Profiles map necessarily to politics → **Leaf A2/B2**. Awkward: Politics is biologically fixed.  

  3. **Q3 (for all except C): If foundation profiles are heritable *and* shift with framing, does this debunk positions?**  
     → *Answer Yes*: Undermines both sides → **Leaf A1a/B1a/A2a/B2a**. Awkward: All moral reasoning is post-hoc.  
     → *Answer No*: Debunks neither → **Leaf A1b/B1b/A2b/B2b**. Awkward: Ignores genetic/framing "contamination".  
     → *Answer Depends*: Debunks only the *opposing* side → **Leaf A1c/B1c/A2c/B2c**. Awkward: Reflexive self-exemption.  

  4. **Q4 (for all): If one side’s concern spans more entities (future generations, animals, etc.), does breadth imply correctness?**  
     → *Answer Yes*: Breadth is truth-tracking → **Leaf [All +Breadth]**. Awkward: Assumes expansion is inherently right.  
     → *Answer No*: Breadth is arbitrary output → **Leaf [All -Breadth]**. Awkward: Moral progress is illusory.  

  5. **Unclaimed cells**: **A2c+Breadth** (fixed profiles debunk only opponents *and* breadth matters) — *unattractive* (smug). **C+Breadth** (only facts matter *and* breadth implies correctness) — *incoherent* (breadth isn’t a fact). **C -Breadth** is indistinguishable from **B2 -Breadth** — both collapse into "facts dominate, psychology irrelevant". *The academic’s quip*: "If framing shifts your foundations, you never had grounds to call them moral in the first place."
