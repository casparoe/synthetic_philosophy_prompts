answer: |-
  Here's your speaker prep sheet—sharp, tactical, and tailored to *that* room. Objections ordered by likelihood/damage, phrased as they’ll hear it, with concessions/firm holds marked. Replies designed for 2-minute delivery.

  ---

  ### **Objection 1 (Decision-Theory Guy)**  
  *"If you grant that saving 5 strangers is better than saving 1 (contra Taurek), you’ve already conceded to aggregation. Your ‘narrative exception’ is just ad hoc risk-pooling dressed in literary glitter. Why isn’t this just expected utility with extra steps?"*  
  **Reply:** "Because EU treats lives as interchangeable tokens. Shared narratives make identities *relationally constitutive*—losing Person A isn’t just -1 utility; it *unmakes* Person B’s story. This isn’t risk-pooling; it’s rejecting the fungibility premise *only* when lives are co-authored. Your model can’t capture that without begging the question."  
  **Concede:** If narratives lack "co-authorship" (e.g., coworkers aren’t narrative-bound).  
  **Hold Firm:** Narrative bonds create non-aggregative moral units.  
  **Soft Spot:** Defining "co-authorship" operationally.  

  ### **Objection 2 (Moral Philosopher - Boundary Issue)**  
  *"How do you determine when a ‘shared narrative’ exists? Is it subjective feeling? Third-party observation? This seems either arbitrary or hopelessly vague—especially under time pressure in lifeboat cases."*  
  **Reply:** "It’s structural: mutual dependency + *irreplaceable* role in each other’s identity-sustaining stories (e.g., lifelong co-rescuers, not office mates). We use proxies like duration, depth of sacrifice, or existential reliance. Vagueness? Yes—but no worse than ‘reasonable person’ standards in law."  
  **Concede:** Some hard cases lack bright lines (e.g., new trauma-bonded survivors).  
  **Hold Firm:** Clear paradigm cases exist (family, lifelong partners).  
  **Soft Spot:** Defending proxies without circularity.  

  ### **Objection 3 (Moral Philosopher - Arbitrariness)**  
  *"Why privilege narrative bonds? If I care deeply about random strangers via empathy, doesn’t *that* create moral significance? Your view feels ethically romanticized."*  
  **Reply:** "Empathy doesn’t make strangers’ fates *co-constitutive*. Losing a stranger is tragic; losing your narrative ‘co-author’ unravels *your* moral personhood. Taurek’s core insight is that loss isn’t *additive*. I’m just saying this non-additivity kicks in *earlier* for narratively fused lives."  
  **Concede:** Empathy may ground other duties (e.g., aid).  
  **Hold Firm:** Narrative bonds alter the *structure* of loss.  
  **Soft Spot:** Defending "unraveling personhood" as non-metaphorical.  

  ### **Objection 4 (Narrative Theorist)**  
  *"Narratives are fluid and multi-layered. Person X may be ‘co-authored’ with Y in their family saga but a stranger in their professional story. Which narrative ‘counts’ when?"*  
  **Reply:** "The salient narrative under threat. If the drowning scenario implicates their family bond (e.g., they’re on a family voyage), *that* layer dominates. We contextualize moral dilemmas to the story at stake."  
  **Concede:** Some scenarios activate competing narratives (rare).  
  **Hold Firm:** Real-world crises usually trigger a dominant narrative frame.  
  **Soft Spot:** Handling genuine narrative conflicts.  

  ### **Objection 5 (Taurek Purist)**  
  *"You’ve gutted Taurek! He rejected aggregation *because numbers don’t matter*, period. You’re saying they *do* matter—unless you like someone’s story? This is sentimental betrayal, not philosophy."*  
  **Reply:** "Taurek’s absolute rejection leads to absurdity (e.g., saving 1 vs. 1,000,000). I preserve his core—anti-aggregation for non-fungible persons—but limit it to cases where non-fungibility is *objectively manifest* (via narrative), not just subjectively felt. This rescues him from refutation."  
  **Concede:** This modifies Taurek’s "all equal loss" premise.  
  **Hold Firm:** Narrative bonds provide the *objective criteria* Taurek lacked.  
  **Soft Spot:** "Objective manifestness" sounds slippery.  

  ### **Objection 6 (Slippery Slope Worrier)**  
  *"Won’t this justify tribalism? If ‘our narrative’ > ‘their numbers,’ haven’t you weaponized storytelling against universal duties?"*  
  **Reply:** "Narrative bonds don’t override baseline duties (e.g., don’t murder strangers!). They only modify aggregation *in rescue scenarios*. Saving your child over 2 strangers isn’t tribalism—it’s acknowledging constitutive relationships universal humans have."  
  **Concede:** Dangerous narratives exist (e.g., cults).  
  **Hold Firm:** Baseline constraints prevent abuse.  
  **Soft Spot:** Defining "baseline duties" without aggregating.  

  ### **Objection 7 (Demandingness / Scope)**  
  *"Does this mean I must prioritize my barista over 100 famine victims if we share ‘morning ritual stories’? That seems grotesque."*  
  **Reply:** "No—routine interactions lack *existential co-authorship*. The bond must be identity-defining (e.g., "If they die, part of *me* dies"). Your barista’s loss is sad, not identity-shattering. Save the 100."  
  **Concede:** Some bonds are weaker than they feel.  
  **Hold Firm:** Depth matters; not all stories are equal.  
  **Soft Spot:** Grading narrative "depth."  

  ---

  ### **The Prayer-Nobody-Asks Objection**  
  *"Why not aggregate the *narratives*? If Group A’s shared story has more ‘narrative value’ (complexity, endurance, etc.) than Group B’s, shouldn’t we save the richer story? You’ve just replaced utility with aesthetic weight."*  
  **Reply (Gulp):** "Narratives aren’t quantifiable aesthetic objects—they’re lived moral realities. Valuing ‘richer’ stories treats people as characters, not persons. My view rejects *all* aggregation; it doesn’t swap utility for literary criticism."  
  **Concede:** Some narratives *are* more resilient to loss (e.g., large families).  
  **Hold Firm:** The anti-aggregation imperative holds regardless of narrative "quality."  
  **Soft Spot:** Avoiding aesthetic language when describing narrative depth.  

  ---

  **Delivery Tips:**  
  - **Lean into novelist cred:** "As a storyteller, I see how identities *actually* form—not in spreadsheets, but in shared struggles."  
  - **Name-drop strategically:** "Like MacIntyre’s narrative selves, but applied to Taurek’s dilemma..."  
  - **Shut down EU guy early:** His objection is lethal if unanswered.  
  - **Typos? Own it:** "Forgive the jet-lagged prose; the ideas are sharp even if my keyboard wasn’t."  

