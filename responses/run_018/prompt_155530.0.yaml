     Let's reframe: The activity is about perception. The author might have written in good faith, but the reader might perceive it as bad faith. We want to see if the perception of bad faith is influenced by knowing the position (after the reveal) or by the content alone. So we don't need the author to self-report intent? We can assume they were instructed to write in good faith? But what if they didn't? 

     Proposed: We tell students that the exercise is about simulating the perception of arguments. We instruct them to write the transcript as if they were sincerely making the argument (good faith) for the assigned position, even if they don't believe it. Then, we define for the classification:
        - "Good-faith reasoning from different premises": The argument is internally coherent and the steps are reasonable, even if you disagree with the premises.
        - "Strategic bad-faith rhetoric": The argument contains logical fallacies, misleading statements, or seems designed to manipulate rather than reason.

     Then, after the reveal, we ask the author: "Did you try your best to write a coherent, good-faith argument?" We expect the answer to be yes. If they say no, then we can note that as an anomaly. But we design the instructions to require good faith.

     Therefore, we can define the "epistemic accuracy" as: 
