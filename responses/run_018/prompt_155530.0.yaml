  We are designing a 90-minute seminar activity for 14 students on political polarization and echo chambers.
   The twist: using anonymized reasoning transcripts to separate argument evaluation from the advocate's identity.

   Steps:
   1. Before class: Prepare two sets of reasoning prompts on a concrete policy question (e.g., algorithmic transparency mandates for private recommendation systems). Assign half the students to defend Position A (e.g., for mandates) and half Position B (against), regardless of their personal views.

   2. First phase (20 minutes): Each student writes a transcript (step-by-step justification for their assigned position). They must:
      - Explicitly label premises, inferences.
      - Identify one point where a reasonable opponent might resist.
      - They don't have to believe the position.

   3. Anonymization and shuffling: Collect all transcripts and redistribute randomly so that each student gets one from the opposing camp.

   4. Second phase (30 minutes): Each student evaluates the transcript they received (from the opposing camp) and classifies it as either:
      - "good-faith reasoning from different premises" OR
      - "strategic bad-faith rhetoric"
      They record confidence on a 1-5 scale and write a two-sentence justification.

   5. Third phase (20 minutes):
      a) Authors reveal themselves and read the classifications they received.
      b) Each author responds briefly (e.g., 1 minute) to the classification (e.g., whether it was accurate to their intent).
      c) Then, without further discussion, the group votes (by show of hands or ballot) on whether knowing the author's assigned position changed their initial classification (if they had been the one to classify that particular transcript, they can abstain from voting on their own).

   6. Debrief (20 minutes): Facilitator leads a discussion mapping the experience to concepts (echo chambers, good faith, polarization).

   Rules:
     - During the classification phase, no direct rebuttal: focus on classification only.
     - Use template sheets for transcripts and scoring cards to standardize formatting and aid anonymity.

   Materials:
     - Transcript template: 
          [Policy Question: e.g., "Should private companies be mandated to make their recommendation algorithms transparent?"]
          Assigned Position: [A or B]
          Premises:
            1. [Premise 1]
            2. [Premise 2]
            ...
          Inferences (step-by-step reasoning from premises to conclusion):
            Step 1: [Inference 1]
            Step 2: [Inference 2]
            ...
          Conclusion: [Restate position]
          Resistance Point: [At which step might a reasonable opponent resist? Why?]

     - Scoring card:
          Transcript ID: [assigned by facilitator]
          Classification: [ ] Good-faith reasoning from different premises 
                        [ ] Strategic bad-faith rhetoric
          Confidence (1-5): [ ]
          Justification (two sentences):

