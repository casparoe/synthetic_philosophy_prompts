  ## St. Petersburg, Bounded

  **(Stanza 1: 2 core images, 8 syllables/line)**
  First flip: the coin, a silver arc,
  Its fall consumes the brittle dark.
  The ledger starts (a hopeful scrawl),
  But *heat escapes the gambler's hall*.
  This single head, a prize so small.
  The expectation starts to sprawl.
  *(Refrain: The ledger starts (a hopeful scrawl), / But **heat escapes the gambler's hall**.)*

  **(Stanza 2: 4 core images, 16 syllables/line)**
  Tails persist: two, then three, then four. The pot grows vast beyond the door,
  Beyond the candles guttering low, beyond the fading ember's glow.
  A phantom fortune, crisp and vast, built on a sequence meant to last
  Beyond the click of cooling bone, beyond the final field note known.
  The sum demands a longer run. *The long fall chills the waning sun*.
  *(Refrain: The sum demands a longer run. / But **the long fall chills the waning sun**.)*

  **(Stanza 3: 8 core images, 32 syllables/line)**
  Tails stack like stones: eight, sixteen, thirty-two... a dizzying view
  Of sums that dwarf the mint's cold ore, that mock the time-bent backs endure.
  The dice wear thin, the table groans, dust settles deep on scattered bones,
  The light bleeds out from eastern panes, entropy claims its due domains,
  The coin itself may warp and thin, the very chance wears paper-skin.
  The formal promise, bright and tall... *The deep fall ends the work of all*.
  *(Refrain: The formal promise, bright and tall... / But **the deep fall ends the work of all**.)*

  **(Closing Couplet)**
  The infinite sum, a ghostly hand;
  The mortal hand, a coin, the land.

  ---

  **Structural Breakdown & Intent:**

  1.  **Doubling Structure:**
      *   **Stanza 1:** 2 core images (The coin's fall / Heat escaping the hall), 8 syllables per line.
      *   **Stanza 2:** 4 core images (Tails persisting / Pot growing / Candles guttering / Cooling bone), 16 syllables per line.
      *   **Stanza 3:** 8 core images (Tails stacking / Sums dwarfing ore / Dice wearing / Dust settling / Light bleeding / Entropy claiming / Coin warping / Chance wearing thin), 32 syllables per line. This mimics the payoff doubling (2, 4, 8...).

  2.  **Evolving Refrain:**
      *   Stanza 1: Focuses on the *initial* physical loss ("heat escapes") against the *beginning* of expectation ("ledger starts").
      *   Stanza 2: The expectation demands *more* ("longer run"), but the physical decay is also *progressing* ("long fall chills the waning sun").
      *   Stanza 3: The expectation reaches its peak *formal promise*, but the physical reality asserts its ultimate, *ending* consequence ("deep fall ends the work of all"). The refrain shifts from observation to inevitability.

  3.  **Themes & Accuracy:**
      *   **Mathematical Infinity:** "Phantom fortune," "sums that dwarf the mint's cold ore," "infinite sum," "formal promise." The language emphasizes the boundless, logical growth.
      *   **Physical Bounds:** "Heat escapes," "cooling bone," "fading ember's glow," "time-bent backs," "dust settles," "entropy claims," "coin may warp," "chance wears paper-skin," "deep fall ends." Concrete decay, mortality, and thermodynamic limits ground the poem.
      *   **Tension:** The poem *never* says people are wrong or the math is flawed. It simply juxtaposes the relentless doubling of expectation ("starts to sprawl," "demands a longer run," "bright and tall") against the equally relentless constraints of reality ("escapes," "chills," "ends"). The paradox itself is the subject, held unresolved.

  4.  **Final Couplet:** Explicitly places the two irreconcilable elements side-by-side: the abstract "infinite sum" (math) and the tangible "mortal hand" holding a single coin within the limited "land" (reality). No resolution is offered.
