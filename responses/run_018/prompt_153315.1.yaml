   Let's first list the desiderata we need. We'll aim for about 8-10.

   Non-negotiable desiderata (failure means inadequacy):
   1. Non-arbitrariness: Terminal beliefs (if any) must not be arbitrary. Motivated by the need to avoid dogmatism.
   2. Non-skepticism: Must not entail that no belief is justified (global skepticism). Motivated by the existence of clear cases of knowledge (e.g., perceptual).
   3. Finite agent accommodation: Must account for the cognitive finitude of human agents (cannot require infinite chains). Motivated by human limitations.
   4. Distinction between having justification and its robustness: A theory must explain how a belief can be justified without requiring maximal certainty or robustness. Motivated by the fact that we have justified beliefs that are fallible.
   5. Distinction between vicious circularity and benign mutual support: The theory must not rule out coherentist structures by conflating circularity that is vicious (like petitio principii) with benign mutual support. Motivated by the intuition that some systems of mutually supporting beliefs (e.g., in science) are justified.
   6. Accounting for perceptual justification: The theory must explain how perceptual beliefs can be justified. Motivated by the foundational role of perception.
   7. Accounting for memory: The theory must explain how memory preserves justification. Motivated by the fact that we retain knowledge over time.
   8. Accounting for reasoning about reliability: The theory must handle cases where we reason about the reliability of our own cognitive faculties. Motivated by reflective reasoning.
   9. Handling partial epistemic circularity: Specifically, when a belief about a faculty's trustworthiness is itself an output of that faculty (e.g., using memory to justify memory). Motivated by the need to avoid ruling out such self-support as necessarily vicious.

   Camp preferences (can be specific to foundationalism, coherentism, infinitism, or hybrid):
   10. Linear ordering: Some theories (like foundationalism) prefer a linear structure of justification. Others (coherentism) allow for holistic webs.
   11. Denial of non-inferential justification: Infinitism and some coherentists deny non-inferential justification, while foundationalists require it.
   12. Infinite accessibility: Infinitism requires that reasons are always available ad infinitum, which is a camp preference.

   However, note that the requirement for finite agents (non-negotiable) already rules out infinitism's requirement of actual infinite chains? But infinitism typically argues that we can have an infinite chain without requiring the agent to traverse it all at once. So we mark "infinite chains" as a camp preference? But note: the non-negotiable finite agent accommodation might rule out theories that require an agent to have completed an infinite chain. So we have to be careful.

   Let's design the table:

   Desideratum | Motivating Case or Conceptual Pressure | Negotiability | Contenders Most Threatened

   Non-negotiable:
   1. Non-arbitrariness: 
      - Motivation: If a belief is accepted without any reason (and without being self-justifying or appropriately basic) then it is arbitrary and cannot justify other beliefs. Example: believing a random proposition without any basis.
      - Negotiability: Non-negotiable.
      - Contenders Most Threatened: Foundationalism (if it posits basic beliefs that are arbitrary).

   2. Non-skepticism:
      - Motivation: A theory that implies that no belief is justified (or that we cannot know anything) is unacceptable because we clearly have some knowledge (e.g., "I have hands").
      - Negotiability: Non-negotiable.
      - Contenders Most Threatened: Infinitism (if it requires an infinite chain that we cannot complete) or any theory that cannot stop the regress.

   3. Finite agent accommodation:
      - Motivation: Humans are finite in cognitive resources and time. We cannot entertain an infinite number of beliefs or traverse an infinite chain of reasoning. Thus, a theory must not require such.
      - Negotiability: Non-negotiable.
      - Contenders Most Threatened: Infinitism (if it requires actual infinite chains) and perhaps some forms of coherentism that require an infinite number of beliefs for coherence.

   4. Distinction: having justification vs. degree/robustness:
      - Motivation: We must be able to say that a belief is justified even if it is not maximally robust (e.g., a belief based on a quick glance). This distinction avoids setting the bar too high.
      - Negotiability: Non-negotiable.
      - Contenders Most Threatened: Theories that require certainty for justification (some forms of foundationalism).

   5. Distinction: vicious circularity vs. benign mutual support:
      - Motivation: In a coherent system, beliefs can mutually support each other without being viciously circular (e.g., a scientific theory where multiple lines of evidence converge). A theory must not rule out such structures.
      - Negotiability: Non-negotiable.
      - Contenders Most Threatened: Foundationalism and linear theories that require a strict asymmetric dependence.

   6. Accounting for perceptual justification:
      - Motivation: We have justified perceptual beliefs (e.g., "there is a red apple before me"). A theory must explain how such beliefs are justified without requiring an infinite regress or circularity that would undermine them.
      - Negotiability: Non-negotiable.
      - Contenders Most Threatened: Infinitism (if it requires an infinite chain for every belief) and coherentism (if it requires that perceptual beliefs must be supported by the entire web).

   7. Accounting for memory:
      - Motivation: We remember many things and take them to be justified (e.g., what we had for breakfast). A theory must explain how memory preserves justification without requiring constant re-justification.
      - Negotiability: Non-negotiable.
      - Contenders Most Threatened: Infinitism (if it requires an infinite chain for every belief, including remembered ones) and theories that do not allow preservation without re-inference.

   8. Accounting for reasoning about reliability:
      - Motivation: We sometimes reason about the reliability of our faculties (e.g., "my vision is reliable because it has been accurate in the past"). A theory must allow such reasoning without making it impossible or viciously circular.
      - Negotiability: Non-negotiable.
      - Contenders Most Threatened: Foundationalism (if it holds that beliefs about reliability must be basic) and coherentism (if it cannot account for the special status of such beliefs).

   9. Handling partial epistemic circularity:
      - Motivation: Sometimes a belief about a faculty's trustworthiness is produced by that same faculty (e.g., using memory to justify that memory is reliable). This is not necessarily vicious. A theory must account for such cases without automatically dismissing them.
      - Negotiability: Non-negotiable.
      - Contenders Most Threatened: Foundationalism (if it requires that all justification is linear and non-circular) and linear infinitism.

   Camp preferences (we'll list a few):

   10. Linear ordering of justification:
      - Motivation: Some theories hold that justification must have a linear structure (each belief justified by another until we reach a foundation). Others allow a web. This is a matter of theoretical preference.
      - Negotiability: Camp Preference.
      - Contenders Most Threatened: Coherentism (if linearity is demanded) and Foundationalism (if linearity is denied).

   11. Denial of non-inferential justification:
      - Motivation: Infinitism and some forms of coherentism deny that there can be non-inferential justification (basic beliefs). Foundationalism requires them.
      - Negotiability: Camp Preference.
      - Contenders Most Threatened: Foundationalism (if non-inferential justification is denied) and Infinitism (if non-inferential justification is required).

   12. Requirement of infinite chains (or the possibility of infinite reasons):
      - Motivation: Infinitism holds that for a belief to be justified, there must be an infinite chain of reasons (even if we don't traverse it all). This is a hallmark of infinitism.
      - Negotiability: Camp Preference.
      - Contenders Most Threatened: Foundationalism and Coherentism (which both reject infinite chains).

