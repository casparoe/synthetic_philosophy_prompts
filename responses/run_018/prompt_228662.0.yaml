prompt: |-
  I have no academic training, but over the past year I have been reading popular books about the "Great Divergence" — the question of why industrialisation took off in north-western Europe, and Britain in particular, rather than in China or India, which looked at least as prosperous a few centuries earlier. I keep running into a meta-dispute that interests me more than any particular answer: some writers treat "why Britain and not China?" as a perfectly good explanatory question, while others argue it is badly posed — that it smuggles in the assumption that Europe was destined to industrialise and that China somehow "failed", or that it invites a futile hunt for a single decisive factor (coal, colonies, institutions, culture) when the outcome may have been contingent. I have decided to spend the next year thinking this through properly, but I cannot read everything. Which open questions in this debate should I prioritise, and in what order? Please defend the ordering: I want to know which questions are upstream of which (for instance, whether one must first settle when Europe actually pulled ahead before asking why, or whether the contrastive question itself needs reformulating before any causal inquiry can begin), which alleged causes are overrated enough to be set aside early, and what findings would move a question up or down the list. My aim is a defended agenda for my own thinking, not a survey of the literature. Please answer in British English.
reasoning: |-
  Okay, the user is deeply engaged with the Great Divergence debate but lacks formal academic training. They've been reading popular books and notice a fundamental split: some scholars treat "Why Britain not China?" as valid, while others critique the question itself as teleological or reductive. Their goal is to structure a year of self-study with a prioritised agenda, focusing on conceptual "upstream" questions first.

  Hmm, their request is refreshingly meta - they're not asking for answers but for a framework to evaluate the debate. That's sophisticated for an autodidact. The key clues are in their phrasing: "which questions are upstream of which", "overrated causes to set aside", and the desire for a "defended agenda". They want intellectual scaffolding, not summaries.

  Right, first I should map the methodological fault lines. The core tension is between divergence-as-puzzle solvers (Pomeranz, Mokyr) and question-deconstructors (Vries, Duchesne). Before evaluating coal vs colonies, one must confront whether "divergence" implies European destiny - that's clearly upstream. Also, temporal framing matters: if Europe pulled ahead only post-1750, it undermines "long-term superiority" narratives.

  I recall Goldstone's contingency arguments - perhaps that's the hinge. If outcomes were path-dependent, then hunting for "decisive factors" becomes pointless. But to test contingency, one must first establish the counterfactual plausibility of Chinese industrialisation. Hence Ming/Qing vitality evidence (Rosenthal & Wong) becomes essential before analysing British triggers.

  The user dismissed "literature surveys", so I'll avoid citations except as conceptual anchors. Prioritisation should follow dependency: question validity → timing → counterfactuals → contingency → only then causal factors. Coal and colonies get downgraded because their relevance depends entirely on earlier answers - if divergence was late/contingent, geography becomes enabler not destiny.

  Notably, they use British English - I'll mirror that with "prioritise" not "prioritize", "defended agenda" etc. Their tone is earnest but rigorous; no dumbing down. Might subtly flag when I'm paraphrasing scholars vs original synthesis.

  The agenda's defensibility lies in making dependencies explicit. Eg: "If you accept late divergence, then factor X becomes less relevant because..." That way they can rerank based on their own conclusions. Should end with decision points: "If you reject contingency after Q3, jump to Q5; if not, deep-dive into Q4."

  Finally, practical pacing: conceptual Q1-2 may take months, but prevent dead ends later. Save "overrated causes" for last - they're downstream fireworks. User seems patient; emphasises "thinking through properly". Respect that.
answer: |-
  Your approach is commendably rigorous - prioritising conceptual foundations over causal minutiae is precisely how to avoid the rabbit holes that plague this debate. Based on the meta-dispute you've identified, here's a defended ordering of open questions, structured by their logical dependencies, with justifications and decision points:

  ### Tier 1: Foundational Validity (Months 1-3)
  **Q1: Is "Why Britain and not China?" a coherent historical question, or does it presuppose Eurocentric teleology?**  
  *Why upstream:* Until this is settled, all causal inquiry risks building on flawed premises.  
  *Core dispute:* Critics (e.g., Jack Goldstone, André Gunder Frank) argue the question assumes:  
  - Industrialisation was an inevitable "destination" for advanced societies  
  - China was "competing" but fell short due to deficiencies  
  *Prioritise examining:*  
  - Whether pre-1800 Eurasian societies were on parallel trajectories (Pomeranz's "surprising resemblances")  
  - If "divergence" implies judgement rather than description (e.g., "failure" vs. "different pathway")  
  *Decision point:* If the question is fundamentally flawed, reframe as "Why did Britain industrialise when it did?" and deprioritise contrastive analysis with China.  

  **Q2: When did substantive divergence occur, and what metrics define it?**  
  *Why upstream:* Dating the divergence determines which causal factors are relevant (e.g., pre-1500 vs. post-1750).  
  *Core disputes:*  
  - **"Early divergence"** (c.1500-1600): Emphasises institutions/culture (North & Thomas, Landes)  
  - **"Late divergence"** (post-1750): Stresses contingent factors like coal/colonies (Pomeranz, Parthasarathi)  
  - **Metrics:** GDP/capita vs. technology vs. ecological constraints  
  *Prioritise examining:*  
  - Allen's wage/price data vs. Broadberry's GDP revisions  
  - Ecological accounts (energy capture, land productivity)  
  *Decision point:* If divergence is late (post-1700), discard explanations relying on medieval European "exceptionalism".  

  ### Tier 2: Counterfactuals & Contingency (Months 4-6)  
  **Q3: How plausible was Chinese industrialisation circa 1700-1800?**  
  *Why upstream:* If China lacked preconditions entirely, "Why not China?" is meaningless; if it was feasible, contingencies matter.  
  *Core evidence:*  
  - **Yangzi Delta's advanced economy:** High proto-industrialisation, skills, markets (Li Bozhong)  
  - **Qing constraints:** State capacity vs. merchant autonomy (Rosenthal & Wong), silver dependency  
  *Prioritise examining:*  
  - Counterfactual modelling (e.g., if British coal/colonies absent, if Chinese coal exploited)  
  - Blockages: Was China "high-level equilibrium trapped" (Elvin) or institutionally stifled?  

  **Q4: How contingent was British industrialisation?**  
  *Why upstream:* If outcome was highly probable given Europe's traits, hunt for decisive factors; if highly contingent, focus shifts to critical junctures.  
  *Core arguments:*  
  - **Path dependence:** Minor advantages (e.g., wet coal seams) amplified over time (Wrigley)  
  - **Conjunctural luck:** Navigation of crises (e.g., 17thC upheavals) enabling institutional change (Goldstone)  
  - **Neo-institutionalism:** Slow accretion of property rights/scientific culture (Mokyr)  
  *Prioritise examining:*  
  - "Near misses" (e.g., Dutch precocity stalling)  
  - Role of random events (e.g., New World windfalls)  

  ### Tier 3: Causal Mechanisms (Months 7-9)  
  *Only after establishing Q1-4 should you engage deeply with causes. Sequence by dependency:*  
  **Q5: How did geopolitical fragmentation shape European development?**  
  *Why now:* If Q2 suggests early divergence, fragmented sovereignty becomes a prime candidate (vs. China's unitary state).  
  *Crucial sub-question:* Did interstate competition spur innovation (Tilly) or waste resources (Vries)?  

  **Q6: To what extent were colonies/coal necessary conditions?**  
  *Why later:* Their relevance depends entirely on Tier 1-2 conclusions.  
  - If divergence was late and contingent (per Pomeranz), coal/colonies are paramount.  
  - If institutional/cultural factors dominated, they are enablers not causes.  
  *Overrated factor alert:* Colonies’ direct profits were likely insufficient (Crafts); prioritise "ghost acreage" (ecological relief) arguments.  

  **Q7: Did culture/ideology play an independent role?**  
  *Why last:* Hardest to test; risks tautology ("Protestantism caused success because successful societies were Protestant").  
  *Prioritise only if:* Q1-Q4 suggest parallel material preconditions existed in China/Europe. Examine:  
  - Specific mechanisms (e.g., Royal Society's effect on innovation vs. Chinese academies)  
  - Non-teleological cultural traits (e.g., European "tinkering" vs. Chinese precision - Jacob/Needham)  

  ### Tier 4: Synthesis & Meta-History (Months 10-12)  
  **Q8: Does rejecting "Eurocentrism" require abandoning comparative history?**  
  *Why final:* Culmination of your foundational work.  
  *Builds on:* If you reframed Q1, does your analysis avoid "why Europe won" narratives?  
  *Test case:* Can you explain British industrialisation without implying Chinese "failure"?  

  ### Key Decision Rules for Reprioritisation
  - **If Q1 concludes the question is flawed:** Shift focus to Britain-alone explanations and abandon direct China comparisons beyond baseline metrics.  
  - **If Q2 finds late divergence:** Immediately deprioritise medieval institutional arguments (e.g., Magna Carta) and cultural claims about the Reformation.  
  - **If Q3/Q4 show high contingency:** Downgrade monocausal explanations (e.g., "coal alone caused divergence") and emphasise concatenated factors.  
  - **If Q5 suggests fragmentation was key:** Then explore why China didn’t fragment further post-1600 rather than why it wasn’t Britain.  

  ### Overrated Causes to Sideline Early
  1. **"Protestant Work Ethic"**: Lacks empirical specificity; Catholic regions industrialised too.  
  2. **"Unique European Rationality"**: Ignores comparable scientific traditions (e.g., Song China, Mughal India).  
  3. **"British Atlantic Slavery as Prime Mover"**: Profits were <5% of British investment (Engerman); more relevant for understanding the Americas.  

  This agenda treats the *structure* of the debate as primary. By resolving methodological and temporal issues first, you’ll save months of misdirected reading. A final admonition: treat "institutions" not as a monolithic cause but as evolving sets of rules whose effects change with context. Begin with Vries’ *Escaping Poverty* for a masterclass in question-framing, then Pomeranz for the late-divergence case, and Mokyr for culture’s role – but only after completing Tier 1. Your scepticism about single factors is warranted; let contingency be your compass.
