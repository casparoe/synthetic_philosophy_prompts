  For the scorecard: Searle fails on minimality and asymmetry, Bratman on emergence and cognitive economy, Gilbert on flexibility and obligation. But the user cares more about the desiderata framework than trashing theorists - good, I'll keep the focus there.

  The table-carrying case with hidden intentions is particularly nasty - it shows joint action can persist despite private reservations. This challenges Bratman's interdependence and Gilbert's commitments. Suggests we need a performance-based rather than mental-state-based criterion.

  Ultimately Requirement #1 (Minimal Jointness) might be the killer - it forces theories to handle all the messy cases, and most can't without becoming too inclusive or too restrictive. The jazz duo works only if we accept minimal mutual responsiveness; the protest walkers case fails precisely because that responsiveness is absent.
answer: |-
  Here is a comprehensive desiderata list for a theory of joint action, organized by core requirements, distinctions, cases, and empirical constraints. I'll mark non-negotiables (NN) based on consensus problematic cases, note camp-specific commitments, identify the most damaging requirement, flag tensions, and briefly assess major theories against the list.

  **Core Requirements (What a Theory Must Explain/Handle):**

  1.  **Minimal Jointness (NN):** Distinguish genuine *joint* action from merely parallel or accidentally coordinated individual actions (e.g., two people independently walking to the same protest vs. walking *together*). The "we" must be non-coincidental.
      *   *Motivating Cases:* Protest Walkers (not joint) vs. Table Carry (joint, even with hidden intention). Cyclist Rescue *must* potentially count as joint despite no agreement.
  2.  **Asymmetric Understanding (NN):** Accommodate cases where participants have significantly different conceptions of the *nature*, *goal*, or *reasons* for the joint activity, yet still act jointly.
      *   *Motivating Case:* Walk to Station (Date vs. Job Interview). The joint action (walking together) persists despite radically different individual goals/understandings.
  3.  **Emergence Without Agreement (NN):** Explain how joint action can arise spontaneously, without prior planning, negotiation, or explicit mutual commitment.
      *   *Motivating Cases:* Cyclist Rescue, Jazz Duo (improvising without prior arrangement), Hunting Party (distributed, unspoken coordination).
  4.  **Obligation & Normativity (Contested):** Explain the distinctive (often weak) normative expectations and potential for criticism ("You let me down!") that arise in joint action, *without* necessarily invoking strong moral or legal obligations. (Gilbert Camp NN, Others Contested).
      *   *Motivating Cases:* Table Carry (if one drops it unexpectedly, the other can reasonably complain), Hunting Party (member wandering off can be criticized).
  5.  **Cognitive Economy & Development (NN):** Be consistent with evidence that young children (and potentially some animals) engage in rudimentary joint action *before* possessing a full-blown theory of mind (understanding others' beliefs/intentions as such).
      *   *Empirical Basis:* Developmental studies (e.g., Warneken, Tomasello) showing children as young as 14 months engaging in cooperative tasks (e.g., joint pulling task) without requiring complex mental state attribution.
  6.  **Robustness to Defection & Hidden Attitudes:** Handle cases where participants act jointly despite private reservations, lack of full commitment, or even hidden intentions to defect/quit, as long as they *perform* their part.
      *   *Motivating Case:* Table Carry (One privately intends to quit at truck).
  7.  **Role Differentiation & Interdependence:** Explain how participants can have distinct, complementary roles within the joint action, and how the success of each part often depends on the actions of others.
      *   *Motivating Cases:* Table Carry (each has an end), Hunting Party (beater vs. shooter), Jazz Duo (melody vs. rhythm).

  **Critical Distinctions (What a Theory Must *Not* Collapse):**

  8.  **Joint Action vs. Parallel Action (NN):** See #1. (Protest Walkers vs. Table Carry).
  9.  **Joint Action vs. Socially Influenced Individual Action (NN):** Distinguish acting *together* (with a "we") from acting individually *because* of others or *in response* to others, without a joint goal.
      *   *Motivating Case:* People in a crowd fleeing a fire – coordinated, responsive, but typically not joint *action*.
  10. **Joint Goal vs. Identical Individual Goals (NN):** A joint goal is not merely the sum of individual goals with identical content (e.g., both wanting the table moved). The "we" requires interdependence and mutual orientation.
      *   *Motivating Case:* Two people both individually want the car lifted off the cyclist and act simultaneously. Is this joint? (Cyclist Rescue pushes this).
  11. **Joint Action vs. Coerced/Ordered Action:** Distinguish acting together voluntarily (even with asymmetric motives) from acting merely as parts of a commanded unit (e.g., soldiers ordered to carry a table).
      *   *Motivating Case:* Hunting Party (voluntary coordination) vs. Soldiers on a drill.

  **Empirical Constraints (NN - Must Be Consistent With):**

  12. **Developmental Trajectory:** Account for the emergence of joint action in toddlers (joint pulling task) before complex recursive intention attribution is plausible.
  13. **Animal Cognition:** Be compatible with (or explain the absence of) evidence for rudimentary joint action in non-human primates or other social animals (e.g., coordinated hunting in chimpanzees – debate exists on whether it meets full criteria).

  **The "We" Question (Core Mechanism - Theories Vary):**

  *   **Searle:** A primitive, irreducible "we-intention" in the mind of *each* individual. ("I intend that we J" as a basic state). Not reducible to "I-intentions".
  *   **Bratman:** A *web of interconnected individual intentions*: (a) I intend that we J, (b) You intend that we J, (c) I intend that we J *by* my sub-plan and your sub-plan, (d) You intend likewise (mutual responsiveness), (e) This is *common knowledge*.
  *   **Gilbert:** A *joint commitment*: A commitment created by the parties *together* (e.g., via agreement) that binds them normatively to act as a body to fulfill the shared goal. The commitment is the source of obligations.
  *   **Minimalist/Enactive Alternatives:** Mutual responsiveness and coordination in action/perception, often without requiring complex representations of "we". Focus on the dynamic interaction and shared situational understanding emerging *in* the activity (Jazz Duo, Cyclist Rescue).

  **What CAN'T Count as Joint (Based on NN Desiderata):**

  *   Mere parallel action with identical goals (Protest Walkers).
  *   Action solely due to external command/coercion.
  *   Action where participants are utterly unaware of each other or make no adjustments based on the other (strictly independent action).

  **Flagged Tensions (Potential Incompatibilities):**

  *   **High Cognition vs. Development (#5 vs. #7):** Bratman's complex, recursively structured mutual intentions + common knowledge seem implausible for toddlers (#5, #13). Searle's we-intention is less recursive but still a high-level cognitive state. Gilbert's joint commitment requires understanding commitment.
  *   **Unified Goal vs. Asymmetry (#2 vs. #10):** Requiring a *single, identical* shared goal content (#10) struggles with cases of radical asymmetry (#2 - Walk to Station). Theories allowing different individual motives *under* a thin shared goal (e.g., "walking together") handle this better.
  *   **Normativity vs. Minimal Jointness (#4 vs. #1):** Insisting on strong normative obligations (#4 - Gilbert) risks excluding spontaneous, ephemeral joint actions like Cyclist Rescue (#1, #3) which may involve only weak, emergent expectations, or even asymmetric ones (one might feel obligation, the other doesn't).

  **The Requirement That Knocks Out the Most Standard Views: Requirement #5 (Cognitive Economy & Development).**

  *   **Why:** This requirement forces a theory to explain the earliest, most fundamental forms of joint action observed in human development. It demands minimal cognitive machinery.
  *   **Impact:**
      *   **Searle:** Primitive "we-intentions" might be conceivable at a basic level, but it's unclear if toddlers have the capacity for the specific intentional state Searle describes. Risk of over-intellectualization.
      *   **Bratman:** His account is *most* vulnerable. Mutual responsiveness (c) is plausible, but the full structure – especially the interdependent intentions (c/d) requiring each to intend the joint activity *via* the other's sub-plans, and crucially, *common knowledge* (e) – is cognitively too demanding for toddlers. It requires complex recursive thought about others' mental states about one's own mental states.
      *   **Gilbert:** Joint commitments require an understanding of commitment and obligation that toddlers demonstrably lack. They cooperate before grasping these normative concepts robustly.

  **Brief Scorecard vs. Desiderata:**

  *   **Searle:**
      *   *Handles:* Minimal Jointness (via we-intention), Asymmetry (individual mental state), Role Differentiation (sub-plans under we-intention).
      *   *Struggles:* Emergence Without Agreement (we-intention seems prior), Obligation (weak account), Cognitive Economy (is we-intention primitive enough?), Cyclist Rescue/Jazz (spontaneity), Robustness to Defection (if you have the we-intention, are you really defecting?).
  *   **Bratman:**
      *   *Handles:* Minimal Jointness (via interdependence), Role Differentiation & Interdependence (core), Obligation (via mutual responsiveness/interdependence, though weaker than Gilbert).
      *   *Struggles Severely:* **Cognitive Economy/Development** (common knowledge & recursive intentions too demanding), Emergence Without Agreement (requires complex prior interlocking intentions), Asymmetry (requires shared goal content "we J"), Jazz/Cyclist Rescue (spontaneity), Robustness to Defection (hidden intention violates interdependence condition).
  *   **Gilbert:**
      *   *Handles:* Minimal Jointness (via joint commitment), Obligation/Normativity (core strength), Robustness to Defection (violates commitment).
      *   *Struggles Severely:* **Emergence Without Agreement** (joint commitment typically requires agreement/communication), Cognitive Economy/Development (understanding commitment), Asymmetry (commitment usually implies shared understanding of the goal), Jazz/Cyclist Rescue (spontaneity), Flexibility (commitments can feel "stickier" than ephemeral joint actions).

  **Conclusion:** The desiderata reveal the fundamental tension: capturing the distinctive "we" of joint action without over-intellectualizing it (excluding toddlers/spontaneity) or under-intellectualizing it (collapsing into mere coordination). Requirement #5 (Cognitive Economy & Development) is the most potent challenge, particularly for Bratman's intricate interdependence and Gilbert's normative commitments. Searle fares slightly better cognitively but struggles with spontaneity and normativity. This pressure fuels alternative "minimalist" or "enactive" approaches focusing on real-time coordination and mutual responsiveness as the bedrock, potentially accommodating toddlers, jazz, and rescues, while trying to build an account of the emergent "we" and normativity on that foundation. The asymmetric understanding case (Walk to Station) remains a sharp test for all accounts of the shared goal.
