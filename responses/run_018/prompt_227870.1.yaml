  ### Non-Deductive Evidence in Mathematics: A Decision Tree for Attitudes  
  **Instructions:** Answer each diagnostic question based on your intuitive stance. Follow the branches to your terminal position (leaf). Each leaf names a coherent viewpoint and notes its "most awkward commitment"—a challenge it must address. Unoccupied branches are marked with a diagnosis (incoherent, unattractive, or neglected).  

  ---

  #### **Start Here**  
  **Q1: Can a mathematical conjecture (e.g., the Twin Prime Conjecture) bear a rational credence (a probability strictly between 0 and 1) for you?**  
  - **Yes** → Proceed to Q2.  
  - **No** → Proceed to Q5.  

  ---

  #### **Bayesian Path** (If you answered **Yes** to Q1)  
  **Q2: When a heuristic model (e.g., Cramér’s) fails in a specific case (e.g., Maier’s theorem on primes in short intervals), does this failure lower your credence in...**  
  - **(a) All conjectures the model supports?** → Proceed to Q4.  
  - **(b) Only "nearby" conjectures (similar in form/scale to the failure)?** → Proceed to Q4.  
  - **(c) None of them?** → Proceed to Q4.  

  **Q4: If a heuristic model has correctly predicted 20 true conjectures, does its track record warrant higher credence in its 21st prediction?**  
  - **Yes** → Occupied leaves:  
    - **Leaf 1: Moderate Bayesian** (Path: Q1=Y, Q2=b, Q4=Y)  
      *Most awkward commitment*: Must explain how rational credence in necessary truths (like math conjectures) is possible, and how we update on non-empirical evidence.  
    - **Leaf 2: Dogmatic Bayesian** (Path: Q1=Y, Q2=c, Q4=Y)  
      *Most awkward commitment*: Must explain why localized failures (e.g., Maier’s theorem) do not lower confidence in *any* of the model’s supported conjectures.  
  - **No** → Unoccupied (Diagnosis: **Incoherence**—Why update on localized failures (Q2=b) but not on widespread successes? Inconsistent updating).  

  *Unoccupied branch*:  
  - Path: Q1=Y, Q2=a, Q4=Y → Diagnosed as **unattractive** (one failure invalidating *all* conjectures is extreme, even with successes).  
  - Path: Q1=Y, Q2=c, Q4=N → Diagnosed as **unattractive** (never updating on success or failure makes heuristic irrelevant to credence).  

  ---

  #### **Non-Bayesian Path** (If you answered **No** to Q1)  
  **Q5: Does a heuristic argument (e.g., independence of divisibility conditions) give you a reason to believe the conjecture is true (even tentatively)?**  
  - **Yes** → Proceed to Q3.  
  - **No** → Proceed to Q6.  

  **Q3: Is the independence presumption (e.g., "treat divisibility by different primes as independent")...**  
  - **Reflecting a fact** about the primes? → Proceed to Q2n.  
  - **Merely a device** for generating conjectures? → Proceed to Q2n.  

  **Q2n: After a heuristic failure (e.g., Maier’s theorem), should we lose confidence in the model’s conjectures in...**  
  - **(a) All domains?**  
  - **(b) Only nearby domains?**  
  - **(c) None?**  

  **Q6: Can non-deductive evidence (e.g., heuristic success) make one conjecture more reasonable to prioritize for research than another?**  
  - **Yes** → Occupied leaf:  
    - **Leaf 5: Skeptical Prioritizer** (Path: Q1=N, Q5=N, Q6=Y)  
      *Most awkward commitment*: Must explain why heuristics reliably guide research priorities if they confer no warrant for truth.  
  - **No** → Occupied leaf:  
    - **Leaf 6: Purist** (Path: Q1=N, Q5=N, Q6=N)  
      *Most awkward commitment*: Must explain why mathematicians’ heuristic-guided priorities (e.g., focusing on twin primes) track truth so well if heuristics are epistemically weightless.  

  *Occupied leaves from Q5=Yes paths*:  
  - **Leaf 3: Heuristic Realist Optimist** (Path: Q1=N, Q5=Y, Q3=Fact, Q2n=b)  
    *Most awkward commitment*: Must explain why the model (taken as reflecting truth) fails in some cases (e.g., Maier’s theorem).  
  - **Leaf 4: Heuristic Instrumentalist (Robust)** (Path: Q1=N, Q5=Y, Q3=Device, Q2n=c)  
    *Most awkward commitment*: Must explain why a device that fails in one domain (e.g., short intervals) is trusted in others without adjustment.  
  - **Leaf 7: Heuristic Instrumentalist (Cautious)** (Path: Q1=N, Q5=Y, Q3=Device, Q2n=b)  
    *Most awkward commitment*: Must explain why a "mere device" should lose credibility in nearby domains after a failure.  

  *Unoccupied branches*:  
  - Path: Q1=N, Q5=Y, Q3=Fact, Q2n=a → Diagnosed as **unattractive** (one failure causing global rejection is too extreme for optimists).  
  - Path: Q1=N, Q5=Y, Q3=Fact, Q2n=c → Diagnosed as **neglected** (rare; realists usually adjust locally).  

  ---

  #### **Why Some Attitudes Feel Different Despite Same Answers**  
  Two students with identical paths may still diverge:  
  - **Example**: Both in **Leaf 4 (Heuristic Instrumentalist)** might see the model as a "device," but one emphasizes *computational validation* while another stresses *pragmatic utility*.  
  - **Key**: Attitudes differ in whether heuristics *approximate latent truth* (even if imperfectly) or are *useful fictions*. This doesn’t split the tree but clarifies disagreements within leaves.  

