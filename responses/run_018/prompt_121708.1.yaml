  1. **Woman married at 16 opposing daughter's education**: Deferred? No, bias. Why? Social pressure/internalized norms. The daughter's options were limited, so the mother's preference isn't trusted.

  2. **Adult refusing blood transfusion**: Respect. Clear autonomy, even if religious. No identified distorting factor.

  3. **19-year-old with depression**: Bias. Mental illness distorts judgment.

