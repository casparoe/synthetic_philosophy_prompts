prompt: |-
  I've been framing chronic overwork through a concept that doesn't get much traction in the standard literature: "leisure debt," defined as a restorative-time deficit that compounds with interest under sustained overwork — structurally analogous to technical debt. Once you apply this framing to Weber's Protestant work ethic, the Japanese phenomenon of karoshi, and the institutional logic behind the French 35-hour week, three open questions emerge that don't map neatly onto conventional labor-rights debates.

  (1) Is leisure debt measurable and meaningful primarily at the individual, organizational, or societal level, and does that measurement depend on reading Weber's ethic as live normative sociology versus a dead historical description? (2) Does the 35-hour week actually amortize leisure debt, or does it merely redistribute labor hours while leaving the underlying compounding mechanism intact? (3) When karoshi victims appear to have consented to their schedules, does that invalidate a rights-based framing altogether, or does it show that consent under accumulated leisure debt is structurally coerced?

  I'm allocating about three years of research effort (background in philosophy and institutional design, no formal economics). Which of these three is the actual crux — the question whose resolution would genuinely change how you build decision procedures for regulators, corporate boards, or individual career planning? Rank them, defend the ordering with explicit criteria (tractability for a non-economist, how many other questions depend on this one, practical payoff for institutional design), and flag which one sounds important but is overrated.

  Please deliver the defense in prose. Then provide a brief structured summary as a JSON object with these fields: rank (integer), question_summary (string), primary_criterion (string), dependency_note (string), practical_payoff_domain (string), overrated_flag (boolean).
