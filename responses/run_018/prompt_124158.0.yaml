  Ever sice my logic tutor mentioned Carroll's tortoise in passing, I can't stop thinking about that weird gap between knowing a rule and actually using it. I'm running a small philosphy reading group next thursday and we just finished the deduction unit, so I want to open the session with something that isn't just another powerpoint slide. Could you write me a villanelle — or at least something with two strict refrains that keep rotating — that captures the infinite regress in "What the Tortoise Said to Achilles"?

  The idea is that the refrains should be Achilles insisting he's added the missing premise and the Tortoise asking for the next hypothetical, and the way the form forces them to keep circling should mirror why the justification never lands. I want it precise enough that someone who's actually studied the dialogue recognizes the exact move where the syllogism needs its own rule of inference, but it should still work as a poem for people who don't know Carroll from Adam. Maybe let the rhyme scheme get a little exhausted by the end, like the form itself is tired of repeating, so the reader feels the regress rather than just hearing about it. No bibliography needed, just the verse.
