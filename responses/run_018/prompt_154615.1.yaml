  Hmm, this is complex because Hanna defies easy categorization. Her illiteracy is clearly central - it's both literal and metaphorical. In the trial scene when she asks "What would you have done?", that question cuts to the heart of the debate. She seems genuinely unable to grasp moral responsibility, yet she actively chose to remain a guard. Interesting tension there.

  The prison years add another layer. Michael sends tapes but keeps emotional distance - and Hanna learns to read yet never writes back. Her suicide right before release feels significant too. She'd rather die than face freedom or accountability? Or is it her finally understanding the weight of her crimes?

  The user's phrasing suggests they've thought deeply about this. They're not just asking for plot summary but want the philosophical implications. The last part about the novel adding something historical arguments can't capture is particularly insightful. Novels deal in ambiguity in ways historiography can't.

  I should avoid forcing Hanna into either Browning's or Goldhagen's framework completely. The power of the character is how she inhabits both and neither simultaneously. Her ordinariness and culpability coexist uncomfortably - that's what makes the novel disturbing and valuable.

  The illiteracy motif works best as showing how moral illiteracy functions: both as cultural conditioning (she literally couldn't read moral texts) and as willful avoidance (refusing to learn until prison). But even when literate, she never achieves real moral understanding - just look at that cold suicide note about the money.

  The trial scene... that's key. Her question isn't defensive but genuinely bewildered. Yet her choices were active. This contradiction is where Schlink makes his real point about perpetrator psychology being messier than theories allow.

