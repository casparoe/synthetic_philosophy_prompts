prompt: |-
  Is there a name for this pattern? A few times now I've watched a city try to make its justice system gentler, and the gentle thing ends up catching more people than the harsh thing did. Concrete cases: (1) a county sets up a diversion program so low-level drug offenders can avoid jail, but once diversion exists, prosecutors start charging cases they used to quietly drop, and people who take the deal end up with a year of check-ins, drug tests and court dates that a guilty plea never would've involved; (2) a city replaces cash bail with ankle monitors to shrink the jail population, and jail numbers do fall, but the monitors go on people who previously would've just been released with a court date, and now a dead battery or a missed charger counts as a violation that can land them in jail anyway; (3) body cameras get introduced to protect civilians from the police, and a few years later the footage is mostly being used as prosecution evidence against civilians.

  In each case the reform did the thing it promised -- fewer people in cages, more oversight -- and yet the total number of people the system touches went up, not down. It doesn't feel like ordinary mission creep, because the stated mission didn't really change; the net just got wider at the same time as it got softer. I've seen people on the abolish side of the reform/defund/abolish argument gesture at this to argue that certain reforms actually grow the thing they're trying to shrink, but I've never seen the phenomenon itself cleanly named or picked apart from nearby failure modes.

  So: is there an established term for exactly this? If there is, tell me how it's usually defined and where its edges are. Does it still count if the reform expands the population but genuinely reduces harm per person? Does it count if the expansion was the quiet plan all along, versus an accident? Does it require criminal justice specifically, or is the justice system just one instance of something broader? And if there's no single established term, coin one and define it carefully against mission creep, displacement (where enforcement just moves elsewhere), and plain policy failure. I'd also like a sentence or two on what the existence of this pattern does and doesn't imply for the reform-vs-abolish debate, since both sides seem to think it settles things in their favor.

  Please put the final name (established or coined) in \answer{...} on the very last line so I can extract it automatically.
reasoning: |-
  Okay, the user is describing a recurring pattern they've observed in criminal justice reforms. They've noticed that attempts to make the system gentler often end up expanding its reach - catching more people than the previous harsher approach did. 

  They provide three concrete examples: diversion programs increasing prosecutions, ankle monitors replacing cash bail but being applied to people who previously would've been released, and body cameras being repurposed as prosecution tools. The common thread is reforms achieving their stated goals (less incarceration, more oversight) while paradoxically increasing the total number of people under system control.

  This seems like a sophisticated observation from someone deeply engaged with criminal justice policy. They're clearly frustrated that this pattern isn't properly named or analyzed, and they want precise terminology to discuss it. Their questions suggest they're weighing reformist versus abolitionist perspectives - they mention how both sides weaponize this pattern in debates.

  The phenomenon reminds me of several concepts:
  - Jevons paradox where efficiency gains increase overall consumption
  - Net-widening in criminology where alternatives expand control
  - Perverse incentives in policy implementation
  - Surveillance creep where new technologies expand monitoring

  But none fully capture this specific dynamic of "softer" reforms expanding the system's reach. The user wants clear boundaries distinguishing this from mission creep, displacement, or simple policy failure. They're also asking important boundary questions about harm reduction, intentionality, and applicability beyond criminal justice.

  I should acknowledge how perceptive this observation is before offering terminology. The pattern reveals how systems resist shrinkage and repurpose reforms to maintain control. For naming, "control creep" seems most precise - emphasizing how control mechanisms expand under softer appearances. 

  In the reform-vs-abolish debate, this pattern doesn't inherently vindicate either side. It shows reform's limitations but doesn't make abolition inevitable - though it strongly suggests that without dismantling systemic incentives, reforms risk being co-opted. The key insight is that "softer" and "smaller" aren't the same, and we need to measure both reach and harshness.

  I'll define "control creep" carefully, distinguish it from related concepts, and address their boundary questions before concluding with balanced thoughts on the abolition debate.
answer: |-
  This pattern is most precisely described as **net-widening under benevolent reform**, a specific subtype of **net-widening** in criminology, but lacks a single universal term. Here's a breakdown:

  1.  **Core Definition:** It occurs when a reform designed to reduce the harshness or restrictiveness of a system (e.g., incarceration) succeeds in its *immediate goal* but simultaneously **expands the overall population subjected to formal system control and surveillance**, often by applying the new, "softer" intervention to individuals who previously would have faced minimal or no system contact.

  2.  **Relationship to Established Concepts:**
      *   **Net-Widening:** The broad criminological term for when interventions (especially alternatives to incarceration) draw in people who wouldn't have been subject to the previous harsher measure. This pattern is a *specific manifestation* of net-widening.
      *   **Mission Creep:** Differs because the *stated primary mission* (e.g., reduce jail population, increase oversight) is often achieved. The expansion is a *side effect*, not a new mission.
      *   **Displacement:** Differs because the enforcement isn't merely shifting location or type *equivalent in severity*; a *new, broader layer* of control is added *on top* of existing mechanisms.
      *   **Perverse Incentive/Unintended Consequence:** These are *causes* or *descriptions* of the mechanism, not the pattern's name. Jevons Paradox (efficiency increases consumption) is an analogous economic concept but not criminological.
      *   **Policy Failure:** Arguably, it *is* a failure regarding the *implicit* goal of reducing system reach/coercion, but it succeeds on the *explicit* metrics (e.g., reduced jail population, increased oversight).

  3.  **Boundary Conditions (Answering your questions):**
      *   **Harm Reduction Per Person?** The pattern *can* still occur even if harm *per person* is genuinely reduced (e.g., ankle monitor vs. jail). The defining feature is the *expansion of the controlled population*, regardless of per-capita harm. Net-widening is still present.
      *   **Intentional Expansion?** If expansion was the *explicit, covert goal* from the start (e.g., using "reform" to increase surveillance), it's **co-option** or **surveillance creep**. If it's an *unintended consequence* of well-meaning reform operating within systemic incentives, it fits the pattern described.
      *   **Beyond Criminal Justice?** Absolutely. This pattern appears in:
          *   **Child Welfare:** "Family preservation" services expanding state supervision of families previously ignored.
          *   **Mental Health:** Community treatment orders (CTOs) applying outpatient compulsion to people previously untreated or voluntarily treated.
          *   **Education:** "Restorative justice" programs in schools formalizing interventions for minor conflicts previously handled informally, increasing administrative contact.
          *   **Public Health:** Mandatory treatment programs for substance use drawing in individuals previously using without system contact.

  4.  **Coined Term (if needed):** While "net-widening" is the closest established term, for maximum precision describing this *specific benevolent-intent-yet-expansive-result* dynamic within systems of control, **Benevolent Net-Widening** or **Control Creep** are fitting. **Control Creep** is particularly evocative:
      *   **Control:** Emphasizes the expansion of system oversight, surveillance, and coercion.
      *   **Creep:** Highlights the gradual, often unintended, nature of the expansion under the guise of improvement.

  5.  **Implications for Reform vs. Abolish:**
      *   **Doesn't Imply:** That *all* reforms inevitably widen nets, that harm reduction per person isn't valuable, or that abolition is the *only* possible response. Successes exist (e.g., outright decriminalization).
      *   **Does Imply:** That reforms focused *only* on substituting one form of control for a "softer" one, without *explicitly dismantling* the underlying system's capacity or incentive for expansion, are **highly vulnerable** to this pattern. Systemic incentives (e.g., prosecutorial metrics, funding tied to program usage, political pressure to "do something," bureaucratic self-perpetuation) actively drive net-widening. It demonstrates that **"less harsh" does not automatically mean "smaller system footprint."** Abolitionists rightly point to this as evidence that tinkering often fails to reduce overall state coercion. Reformists must acknowledge this risk and design interventions with *explicit decarceration/decontrol targets and safeguards* (e.g., automatic expungement, strict eligibility limiting diversion to *only* those who would otherwise be prosecuted/jailed, dismantling parallel systems like electronic monitoring).

  **Final Name:** While "Net-Widening" is the established criminological term, **Control Creep** most concisely and evocatively captures the *specific dynamic* of system expansion occurring under reforms intended to reduce harshness. It emphasizes the *expansion of oversight and coercion* ("Control") and its *gradual, pervasive nature* ("Creep"), distinguishing it from simple mission shift or displacement.

  \answer{Control Creep}
