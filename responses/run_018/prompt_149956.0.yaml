prompt: |-
  I'm an undergraduate taking a course on moral responsibility, and I'm leading a fifty-minute tutorial for first-year philosophy students on moral luck—specifically, whether agents can be properly blamed or praised for outcomes that turn on factors outside their control. Rather than the standard drunk-driver comparison, I want the session to carry on a single case: two marine biologists with identical training and identical negligent protocols deploy tracking nets in the same region; an unforeseeable current pattern saves an endangered population in one case and destroys it in the other, so one is celebrated and the other professionally ruined despite matching agency.

  Plan the explanatory arc for me, not the explanation itself. What conceptual piece must be in place before moral luck even registers as a problem rather than a platitude—likely the control principle, but show where it belongs in the sequence? Then specify the order in which to introduce the distinctions among constitutive, circumstantial, causal, and resultant luck, and why that dependency order holds. For the net case, say exactly what it must include (identical agency, identical reasoning, divergent outcomes driven by an external causal chain) and what it must lack (differences in character, knowledge, or effort that would let students retreat to a merit-based explanation). Map the predictable misconceptions onto the sequence: I expect they will start with "luck is just low probability," then slide to "if the outcome wasn't in her control she can't be blamed at all," and finally to "the two biologists are the same person in different worlds so they must deserve the same treatment"—tell me precisely where in the arc to head off each, and what question to ask at the end that tests whether they've grasped the tension with the control principle rather than just feeling sympathy for the ruined scientist. Also tell me what machinery I should explicitly refuse to open—perhaps the full taxonomy of moral luck responses, or the debate over whether moral luck can be dissolved by refining the assessment conditions on actions versus agents—and state that refusal openly.

  Finally, separate what is settled from what genuinely contested among people who know the topic: for example, whether moral luck is pervasive and ineliminable, or whether a properly refined control principle eliminates the appearance of luck altogether. Do not present either position as the consensus.
reasoning: |-
  Hmm, the user is an undergraduate preparing to lead a philosophy tutorial on moral luck using a marine biology case instead of the typical drunk driver scenario. They want a structured explanatory arc rather than content, with specific sequencing of concepts and handling of misconceptions.

  The core challenge is designing a pedagogical sequence that builds tension methodically. The marine biology case is perfect because it eliminates variables like character differences - both scientists have identical training, protocols, and negligence levels. The unforeseeable current creates divergent outcomes purely through luck. This forces students to confront whether outcome differences justify different moral judgments when agency is identical.

  Key structural elements needed:
  First must establish the control principle upfront - that moral responsibility requires control over outcomes. This creates the foundation for the paradox. Then introduce resultant luck (outcomes diverging due to external factors) as the immediate challenge to the principle. Only after that should circumstantial (different situations faced), causal (different causal chains initiated), and constitutive (innate traits) luck follow, as they extend the problem beyond outcomes to broader conditions.

  Predictable student errors must be intercepted at specific points:
  - "Luck is just low probability" gets corrected when defining resultant luck, emphasizing unforeseeability isn't about odds but lack of control
  - "No control means no blame at all" gets challenged when contrasting judgments of the two scientists
  - "They're identical so deserve same treatment" gets complicated by introducing circumstantial luck variations

  Crucially, the tutorial should avoid deep dives into resolution theories (like Nagel vs Williams debates) or taxonomy expansions. Stay focused on the tension itself. End with a test question forcing students to articulate why the case violates the control principle rather than just sympathizing.

  For contested areas, clarify that philosophers genuinely disagree on whether moral luck is real or illusory, and whether it's eliminable. Present both positions as live options without endorsing either.
answer: |-
  Here's a planned explanatory arc for your 50-minute tutorial, designed to build tension methodically and target predictable misconceptions:

  **Core Objective:** Make the *tension* between the Control Principle and the reality of outcome-dependent judgments palpable, using the net case as the anchor.

  **The Arc & Sequence (50 Mins Approx.):**

  1.  **Establish the Control Principle (CP) (8-10 mins):**
      *   **Why First?** Moral luck only bites if we accept the seemingly intuitive CP: *"An agent is morally responsible only for what is within their control."* Without this, differential praise/blame based on luck seems unproblematic.
      *   **How:** Elicit agreement on CP through simple examples (e.g., blaming someone for a natural disaster they couldn't prevent is unfair). Frame CP as foundational for fair moral assessment.
      *   **Key Outcome:** Students explicitly endorse CP as a baseline for fairness.

  2.  **Introduce the Net Case & Resultant Luck (10-12 mins):**
      *   **Case Must Include:** Identical training, identical negligent protocol (e.g., both chose a cheaper, known-to-be-risky net type; both skipped a standard check due to fatigue), identical reasoning/effort/intention *at the time of action*. The *only* difference is the unforeseeable current pattern *after* deployment, leading to divergent ecological outcomes.
      *   **Case Must Lack:** Any difference in character (both are similarly conscientious/lazy), prior knowledge (neither knew the specific current risk), effort (both put in the same sub-standard effort), or initial conditions.
      *   **Focus:** Describe the divergent *outcomes* (celebration vs. ruin) driven purely by the external current.
      *   **Introduce:** **Resultant Luck** = Luck in *how one's actions and projects actually turn out*.
      *   **Misconception Head-Off (Here):** "Luck is just low probability." **Counter:** Ask: "Was the *possibility* of an unusual current *itself* within either biologist's control? Did the *mere probability* of disaster change their *actual agency* or *what they controlled*?" Emphasize unforeseeability ≠ improbability; focus on *lack of control over the outcome-determining factor*.

  3.  **Highlight the Tension & Challenge to CP (8-10 mins):**
      *   **Question:** "Given the Control Principle, *should* we praise Biologist A and blame Biologist B? Why or why not?"
      *   **Predictable Misconception (Here):** "If the outcome wasn't in her control, she can't be blamed at all (for Biologist B)." **Counter:** Press: "But *was* there negligence? *Did* they both fail in their duty? Does the unlucky outcome change *that fact*? Does the CP suggest we *should* judge them the same? How does that square with our instinct to treat them very differently?"
      *   **Goal:** Make students feel the conflict. Our practices *do* assign praise/blame based on results (resultant luck), yet CP suggests we *shouldn't*.

  4.  **Introduce Circumstantial Luck (7-8 mins):**
      *   **Why Now?** To show resultant luck isn't isolated. "What if the unforeseeable current *hadn't* happened? Both would just be negligent biologists who got away with it. Neither would be praised or blamed *to that extent*."
      *   **Define:** **Circumstantial Luck** = Luck in *the circumstances one finds oneself in* (e.g., *whether* the specific test of their negligence occurs).
      *   **Link:** Biologist A was lucky the circumstance (the specific current pattern) turned her negligence into a perceived success. Biologist B was unlucky it turned his identical negligence into a disaster. Their moral "fortune" depends heavily on *which* circumstances arise.

  5.  **Briefly Touch Causal & Constitutive Luck (5 mins):**
      *   **Why Here & Briefly?** To show the pervasiveness, but *avoid getting bogged down*. Dependency: Resultant luck often stems from causal chains influenced by luck. Constitutive luck underpins the agent.
      *   **Define:**
          *   **Causal Luck:** Luck in *how one's actions ripple out into the world* (e.g., the specific chain of events triggered by deploying the net, influenced by countless external factors like currents).
          *   **Constitutive Luck:** Luck in *who you are* (e.g., temperament, inclinations - though stress this *is identical* in the net case by design).
      *   **Emphasize:** In the net case, resultant luck (the outcome) flowed from causal luck (the specific chain involving the current), triggered within a circumstance (deploying the net at that place/time) that itself involved luck, by agents shaped by constitutive luck. The *problem* started with the conflict between CP and resultant luck.

  6.  **Reinforce the Identity & Deepen the Challenge (5 mins):**
      *   **Predictable Misconception (Here):** "The two biologists are the same person in different worlds so they must deserve the same treatment." **Counter:** "Does that mean we *should* treat them the same? What would that look like? Should we ruin Biologist A *just in case*? Or absolve Biologist B completely? Does *desert* (what they fundamentally deserve) really depend on an uncontrollable current? But doesn't the *harm* matter too?"
      *   **Goal:** Push beyond sympathy ("poor Biologist B") to the conceptual problem: CP says desert must be identical, but our practices (and perhaps moral intuitions about harm/benefit) demand differential treatment.

  7.  **The Test Question & Wrap-Up (5 mins):**
      *   **Test Question:** "Don't just tell me *who* you feel worse for. Explain, using the Control Principle, *why* the different outcomes for the biologists pose a *conceptual problem* for our typical ways of assigning praise and blame." (Key: They must articulate that CP requires identical judgment, but the outcomes (resultant luck) drive different judgments/practices, creating tension).
      *   **Settled vs. Contested (State Clearly):**
          *   **Settled:** There is a *prima facie* tension between the Control Principle and the way outcome-dependent luck often influences our moral judgments and practices (praise, blame, punishment, reward). The distinctions (resultant, circumstantial, etc.) describe this phenomenon.
          *   **Genuinely Contested:**
              *   Whether moral luck is "real" and pervasive/ineliminable (Nagel/Williams) vs. whether it's an illusion resolvable by refining the Control Principle or our concepts of responsibility (e.g., focusing solely on intentions, or quality of will, or actions rather than outcomes - Zimmerman, Enoch, Levy offer different strategies).
              *   Whether acknowledging moral luck undermines morality or is compatible with it.
              *   The *best* way to resolve the tension (if it can be resolved).
      *   **Refuse to Open (State Openly):** "We're focusing today on *seeing* the problem moral luck poses for the Control Principle. We *won't* be diving into the complex debates about *solving* it – like whether we should refine the CP, abandon it, or distinguish between blaming *agents* and condemning *actions*. That's for future discussions. Today is about understanding the tension itself."

  **Why This Sequence Works:**

  1.  **Builds Foundation:** Starts with the non-negotiable CP.
  2.  **Introduces Problem via Strong Anchor:** Uses the vivid, controlled net case to introduce resultant luck and immediately challenge CP.
  3.  **Targets Misconceptions Proactively:** Addresses "luck=probability" when defining resultant luck, "no control=no blame" when highlighting the tension, and "same person=same treatment" when reinforcing identity and challenging desert.
  4.  **Logical Dependency:** Resultant luck is the most direct challenge to outcome-based judgments. Circumstantial luck shows luck in *which* tests occur. Causal luck shows luck in the *chains* leading to results. Constitutive luck underpins the agent (briefly noted).
  5.  **Focuses on Tension:** Every step circles back to the conflict between CP and observed judgments/practices.
  6.  **Clear Boundaries:** Explicitly avoids resolution debates, keeping the tutorial focused and achievable.
  7.  **Ends with Assessment:** The test question forces articulation of the core tension, not just empathy.

  This arc ensures students leave grappling with the *problem* of moral luck in relation to control, equipped with the distinctions and anchored by your carefully constructed case, without being overwhelmed by unresolved debates. Good luck with the tutorial!
