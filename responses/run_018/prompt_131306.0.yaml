prompt: |-
  Hey — I'm trying to pin down where I actually stand on this. What's your real credence, 0 to 1, that Lewis's analysis of convention (the coordination-game-plus-common-knowledge story from *Convention*) can genuinely cover the evolution of moral norms in large anonymous societies without sneaking in some independent normative premise?

  Don't handwave. Break it down into seperate terms with rough probabilities and one line of justification each:

  1. The structural core is right: norm emergence is basically a coordination problem with arbitrary equilibria.
  2. Moral norms — like anti-free-riding — are actually coordination problems, not commitment devices or evolutionary strategies that don't need common knowledge.
  3. Something like what I'm calling 'stochastic common belief' (local signaling that approximates common knowledge without full transparency) is enough to satisfy Lewis's conditions in big populations.
  4. One other factor you think belongs in there, with its own number.

  Then combine them into your overall credence. Which term is the weakest link, and what kind of empirical or theoretical result — maybe from evolutionary game theory — would you recieve as decisive enough to shift it?

  My own number's around 0.4, mostly dragged down by that third thing I just invented, which might not even be coherent. Where do you land?
reasoning: |-
  Okay, let's tackle this step by step. The user wants a structured probability breakdown of whether Lewis's convention theory can explain moral norms in large societies without sneaking in normative premises. They mentioned their own credence is 0.4, mostly due to concerns about "stochastic common belief." 

  First, I need to recall Lewis's core argument: conventions as solutions to coordination problems requiring common knowledge. The user is specifically doubting if this applies to moral norms (like anti-free-riding) in anonymous societies where full common knowledge seems impossible. 

  Breaking it down:
  1. **Structural core (coordination problems):** Moral norms often resemble coordination games (e.g., driving side rules). But are they *purely* coordination? Some like honesty might be mixed-motive. I'd assign 0.7 here—plausible but not universal. 
  2. **Moral norms as coordination, not commitment devices:** This is trickier. Anti-free-riding norms might function as commitment strategies (e.g., punishing defectors). If they're more about resolving conflicts than avoiding coordination failure, Lewis's model struggles. Probability: 0.5—highly contested. 
  3. **Stochastic common belief:** Can local signaling approximate common knowledge? Network models show cascades can spread beliefs, but fragility in polarized/anonymous settings is a problem. The user's term seems coherent! But I'm skeptical it scales reliably. Probability: 0.4. 
  4. **Added factor: Excludability of non-moral forces:** Do we need hidden variables (e.g., evolved disgust)? If moral norms piggyback on non-convention mechanisms, Lewis's story isn't sufficient. Probability: 0.6. 

  Combining multiplicatively: 0.7 × 0.5 × 0.4 × 0.6 ≈ 0.084 → **overall ~0.1 credence**. The weakest link is clearly #2 (moral norms as pure coordination). 

  What would change my mind? 
  - For #2: An evolutionary simulation showing moral norms *only* emerge in coordination games without pre-existing commitment mechanisms. 
  - For #3: Agent-based models where stochastic signaling reliably scales to 10,000+ agents with low fragility. 

  User's 0.4 is higher than mine—they might be weighting #1/#4 more optimistically. Their "stochastic common belief" idea is solid but needs empirical teeth. Fun challenge!
answer: |-
  Here's my brutally honest breakdown, with probabilities grounded in game theory, evolutionary anthropology, and epistemology. I'll flag where I diverge from your structure:

  1.  **Structural core applies to *some* moral norms (coordination/arbitrary equilibria): 0.8**
      *   *Justification:* Many baseline social norms (property rules, promise-keeping formats, traffic-like conventions) clearly fit coordination games. Moral norms often build on these, making the core mechanism plausible for foundational layers. (Key ref: Binmore's *Game Theory and the Social Contract* Vol. 1)

  2.  **Moral norms (esp. anti-free-riding) are primarily coordination problems, NOT commitment/evolutionary strategies: 0.3**
      *   *Justification:* Anti-free-riding norms (e.g., punishing defectors) often resemble Prisoner's Dilemmas/Public Goods games more than pure coordination. Their stability frequently relies on costly signaling, reputation, or group selection (commitment devices/biological/cultural evolution) that don't *strictly* require Lewisian common knowledge for emergence. (Key ref: Gintis, *The Bounds of Reason*; Boyd & Richerson on punishment)

  3.  **"Stochastic Common Belief" (SCB) sufficiently approximates Lewisian Common Knowledge (CK) for large-scale norms: 0.4**
      *   *Justification:* While network models show local signaling *can* generate widespread belief cascades ("I believe you believe..."), SCB is highly fragile to noise, polarization, and scale. Anonymity breaks reciprocity loops vital for CK. Lewis's CK is brittle; SCB is *more* brittle. It *might* work for simple norms but likely fails for complex, contested moral ones requiring high alignment. (Key ref: Morris-Shin coordination models; Chwe on network structure)

  4.  **No independent normative "stuff" is smuggled in (The Excludability Condition): 0.6**
      *   *Justification:* Lewis tries to be descriptive, but his account leans on "salience" and "precedent," which can subtly encode normative biases ("*this* equilibrium is 'obvious'"). In large societies, explaining *which* norm emerges among many possible equilibria often requires invoking pre-existing preferences (fairness, disgust) or power dynamics not reducible to pure coordination. (Key ref: Sugden, *The Economics of Rights, Co-operation and Welfare*; criticisms by Gilbert)

  **Combined Credence:** Multiplying probabilities (assuming rough independence): 0.8 * 0.3 * 0.4 * 0.6 = **0.0576**. Rounding conservatively to account for potential dependencies: **~0.1**.

  **Weakest Link:** **Term 2 (Moral norms as pure coordination)** at **0.3**. This is the core conceptual rupture. If anti-free-riding norms *aren't* fundamentally coordination problems but instead solutions to commitment problems or products of evolutionary forces operating *without* requiring high-order mutual beliefs, Lewis's framework fundamentally mischaracterizes them.

  **Decisive Evidence Shifting Term 2 (towards lower credence):**
  *   **Empirical:** Finding robust moral norms (e.g., third-party punishment of unfairness) emerging in large-scale lab experiments *without* any communication, reputation, or repeated interaction (truly anonymous one-shots). Current evidence (e.g., Fehr & Fischbacher) shows these norms *fade* under strict anonymity, suggesting they rely on mechanisms *beyond* pure coordination+SCB.
  *   **Theoretical/Simulation:** An evolutionary game theory model demonstrating that norms enforcing cooperation in large groups *only* stabilize when agents possess:
      1.  Explicit commitment devices (costly signals),
      2.  Kin-selection/group-structured competition, or
      3.  Explicit higher-order belief tracking (true CK),
      ...and that models relying *only* on SCB + coordination payoffs consistently fail to produce stable anti-free-riding norms in large, anonymous populations. (Current models often sneak in (1) or (2)).

  **Where I Land vs. You:** My **0.1** is significantly lower than your **0.4**. The gap stems primarily from:
  1.  My harsher assessment of Term 2 (0.3 vs. your implied higher weight). I see anti-free-riding as fundamentally *non*-coordinative.
  2.  My added Term 4 (Excludability), which you might have bundled into your skepticism. I think normative smuggling is a major, under-addressed flaw.
  3.  While your "Stochastic Common Belief" (Term 3) is coherent and insightful, I'm more pessimistic (0.4) about its sufficiency for the *specific* demands of moral norm stability under scale and anonymity.

  **The Nail in the Coffin (for me):** The persistence of many moral norms in contexts where *knowing what others believe* is impossible (e.g., anonymous online giving, whistleblowing against majority opinion) suggests a motivational architecture (internalized commitment, emotion-driven obligation) that operates independently of, or even contrary to, perceived common belief. Lewis's machinery struggles mightily with this.
