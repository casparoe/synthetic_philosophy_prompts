answer: |-
  ## Final Exam: Philosophy of Mind (Upper-Level Undergraduate)

  **Question:** Functionalist theories of mind characterise mental states by their causal-functional roles within a cognitive system. A central commitment of functionalism is *multiple realizability*: the thesis that these roles can be realised in physically diverse substrates. However, specifying the relevant causal roles with sufficient precision to exclude *pathological realisers* – systems that replicate macro-level input-output patterns without possessing the appropriate micro-level causal coherence to constitute genuine mentality (e.g., Block's Chinese Nation, Searle's Chinese Room) – appears to necessitate fixing a privileged *level of functional abstraction*. Evaluate whether a functionalist can resolve the tension between maintaining that mental states are individuated *purely* by their causal-functional roles and embracing multiple realizability, given this 'level-individuation problem'. Does specifying a level inevitably either (i) smuggle in substrate-dependent constraints, thereby undermining multiple realizability, or (ii) render the functional description so abstract that it loses empirical content and cannot distinguish genuine cognition from sophisticated simulation? Develop your argument critically, addressing the circularity worry inherent in appeals to 'normal' realisation conditions. Conclude by defending a specific resolution to this dilemma, arguing clearly for its viability or limitations. (1000 words maximum)

  ---

  **Model Answer (Approx. 1000 words):**

  Functionalism’s core appeal lies in its promise to reconcile the mental with the physical while avoiding both the perceived pitfalls of reductionism and dualism. By defining mental states solely by their causal roles within a system mediating inputs, outputs, and other mental states, it purports to be both scientifically respectable and capable of accommodating multiple realizability (MR) – the idea that diverse physical substrates can instantiate the same mental state types. However, the ‘level-individuation problem’ presents a profound conceptual tension within this framework, challenging whether a purely functionalist individuation of mental states can coherently uphold MR while excluding pathological cases. This essay argues that resolving this tension without sacrificing core functionalist commitments is deeply difficult, as attempts to fix a level of functional abstraction consistently run afoul of one horn of a dilemma: undermining MR or losing empirical bite. Appeals to typicality fail to resolve the circularity at the heart of the problem. Ultimately, while a resolution favouring constrained abstraction supplemented by causal coherence offers the most viable path, it demands concessions that functionalism might find uncomfortable.

  The dilemma arises from the need to specify functional roles precisely enough to exclude *pathological realisers*. Systems like Block’s Chinese Nation (a population mimicking the neural structure of a brain) or Searle’s Chinese Room (an individual manipulating symbols via rules without understanding) purportedly replicate the *macro-level input-output behaviour* associated with certain mental states (e.g., understanding Chinese) but lack the *appropriate micro-level causal structure* intuitively necessary for genuine mentality. To exclude such cases, the functionalist must articulate *why* these systems fail to instantiate the relevant functional role. Merely pointing to behaviour isn’t enough, as pathological cases match it. The functionalist must delve into the *internal causal structure* defining the role. But at *what level* is this structure specified?

  This is the level-individuation problem. If the functionalist specifies the role at a *very fine-grained, low level of abstraction* (e.g., detailing specific types of internal state transitions, perhaps mirroring neurobiological mechanisms), they potentially capture the causal coherence needed to exclude pathological cases. **Horn One:** However, this risks undermining MR. Specifying the role in such detail likely incorporates constraints specific to the realisation base we are familiar with (e.g., biological neurons). If the functional description necessitates state transitions only possible in carbon-based organic systems or specific electrochemical processes, then silicon-based AI or radically alien systems, despite potentially possessing genuine cognition, would be excluded solely because their causal pathways differ in substrate-specific ways. MR, a cornerstone of functionalism's anti-reductionism and its claim to provide a unifying theory across diverse cognitive systems, is compromised. The individuation of the mental state becomes covertly dependent on the physical substrate.

  Conversely, to robustly preserve MR, the functionalist might specify the role at a *high level of abstraction*, focusing only on the overall input-output mappings and perhaps very broad constraints on internal state transitions. **Horn Two:** While this readily accommodates diverse physical realisations, it now struggles to exclude pathological realisers. The Chinese Nation and the Chinese Room arguably *do* implement the abstract functional description of, say, a Chinese-understanding system: given Chinese input, they produce appropriate Chinese output via internal state changes governed by rules. If functional individuation is purely at this abstract level, these systems *must* be ascribed understanding, contrary to strong intuitions. Worse, this high abstraction renders functionalism empirically vacuous. It cannot distinguish genuine cognition (with its characteristic internal causal coherence) from sophisticated but ultimately non-cognitive simulations that merely mimic the final output patterns. The theory loses its explanatory power to capture *what mentality is* beyond behavioural correlation.

  Faced with this dilemma, a common functionalist move is to appeal to ‘normal’ or ‘typical’ realisation conditions. Mental states are defined by roles realised in the *standard way* for the system type (e.g., human neurobiology). The Chinese Room fails because it doesn’t realise the role in the *normal* way for human cognition. **However, this appeal is viciously circular.** What defines the ‘normal’ realisation? Presumably, it is realisation that *actually constitutes* the mental state. But that is precisely what is in question. To say the normal realisation is the one that *is* the mental state presupposes a prior way of identifying the mental state independently of the functional role being realised normally. If we lack an independent criterion for identifying genuine mental realisations, the appeal to normality collapses into question-begging. It doesn't solve the level-individuation problem; it merely disguises it by relying on an unanalysed notion of what counts as a legitimate realisation, which is exactly what functionalism promised to define. The circularity renders this move ineffective for resolving the core tension.

  How, then, might functionalism navigate this impasse? A promising resolution involves embracing a *moderate level of abstraction* but supplementing the functional role specification with an explicit requirement for **causal coherence** or **homuncular decomposition**. Instead of defining a single monolithic role, functionalism could characterise mental states via a hierarchy of interacting sub-functions, each defined at an appropriate level, ultimately decomposing into simple, mechanistic processes. The functional role for 'belief' or 'pain' wouldn't be specified at the atomic-physical level (undermining MR) nor at the purely behavioural level (inviting pathology), but at an intermediate level capturing the *organisational structure* of the cognitive system. The crucial constraint is that the realisation must implement this *entire causal structure* – the network of sub-functions interacting causally in the right way. The Chinese Room fails because, while it implements the top-level input-output mapping, it lacks the requisite internal functional decomposition: the person in the room does not possess sub-systems corresponding to the syntactic and semantic processors implied by the homuncular decomposition of understanding. The causal transitions are not coherently distributed across a functionally organised system.

  This resolution explicitly rejects the second horn of the dilemma. It argues that functional descriptions *can* be specified at an abstraction level that preserves empirical content (by demanding internal causal structure) *without* necessarily tying it to a specific substrate, thereby preserving MR. Systems with radically different physical substrates could still implement the same functional decomposition. However, this approach faces significant challenges. Firstly, determining the *correct* level of decomposition and the necessary degree of causal coherence is non-trivial and may itself involve intuitions tied to known biological realisers, risking a slide back towards Horn One. Secondly, it demands a more complex functional ontology, potentially moving away from the simplicity of early functionalism. Thirdly, the threat of new, more sophisticated pathological cases that *do* mimic the causal structure at the chosen level of abstraction remains (e.g., complex distributed computing systems). While the resolution offers a principled way to distinguish genuine cognition from crude simulations like the Chinese Room, it may not be future-proof against increasingly complex mimics.

  The level-individuation problem exposes a fundamental tension within pure functionalism. Upholding MR while providing a non-circular, empirically substantive criterion for genuine realisation that excludes pathological cases is extraordinarily difficult. Appealing to typicality fails due to circularity. The resolution via hierarchical functional decomposition with causal coherence constraints offers the most viable path forward, allowing functionalism to retain its core commitments to causal roles and MR while gaining significant leverage against the most obvious pathological cases. However, it necessitates a more nuanced view of functional specification and acknowledges that functionalism might not provide a perfectly substrate-neutral *and* perfectly pathology-proof theory on its own. It succeeds in navigating *between* the two horns for a significant range of cases but requires careful articulation of the relevant level of abstraction and may ultimately rely on pragmatic or explanatory considerations that go beyond pure functional description. The dilemma, therefore, forces a refined, perhaps less austere, but arguably more defensible version of functionalism.

  ---

  **Marking Scheme (Total: 20 marks)**

  1.  **Diagnosing the Dilemma (5 marks):**
      *   **A-Range (5):** Clearly and accurately identifies the level-individuation problem as the core issue. Explicitly frames the tension as a *dilemma* between undermining MR (Horn One: substrate-dependence via low-level specification) and losing empirical content/ability to exclude pathology (Horn Two: excessive abstraction).
      *   **B-Range (3-4):** Describes the problem of pathological realisers and the need for level specification, but fails to fully articulate it *as a strict dilemma* with two problematic horns for functionalism. May describe functionalism and MR separately without tightly linking them via the individuation tension.
      *   **Error:** Superficial treatment; merely defining functionalism and MR without confronting the specific tension arising from *individuation* via functional roles needing precise specification to exclude pathology.

  2.  **Engaging the Circularity Worry (4 marks):**
      *   **A-Range (4):** Provides a clear and substantive explanation of *why* appeals to ‘normal’ or ‘typical’ realisation conditions are circular, demonstrating how this move fails to resolve the dilemma and merely presupposes what needs to be defined (genuine realisation).
      *   **B-Range (2-3):** Mentions the appeal to typicality and labels it as circular, but does not provide a sufficiently detailed explanation of *why* the circularity arises and why it is fatal to this attempted resolution. May just state "it's circular".
      *   **Error:** Only passing mention of the circularity worry without substantive engagement; failing to explain *how* it undermines the typicality move.

  3.  **Substantive, Argued Resolution (5 marks):**
      *   **A-Range (5):** Proposes a specific resolution to the dilemma (e.g., causal coherence/homuncular decomposition, embracing abstraction with constraints, rejecting one horn) and presents a *clear, reasoned argument* for its merits. Critically evaluates its strengths *and* limitations in relation to the dilemma. Avoids concluding that the issue is purely empirical or unresolved.
      *   **B-Range (3-4):** Suggests a resolution but provides only a weak or underdeveloped argument for it. May simply describe a possible solution without robust defence. Or, concludes vaguely that the problem is unresolved or depends on future empirical findings.
      *   **Error:** Lack of a clear resolution; presenting options without arguing for one; resorting to "it's an empirical matter" or "more research is needed" as a conclusion.

  4.  **Scope: Token vs. Type Functionalism (3 marks):**
      *   **A-Range (3):** Explicitly addresses how the level-individuation problem affects *both* type-functionalism (individuating mental state *kinds*) and token-functionalism (individuating specific mental state *instances*). Explains the challenge for each (e.g., specifying role-types vs. specifying the realisation of a token state).
      *   **B-Range (1-2):** Only addresses the problem for one form of functionalism (usually type) or conflates token and type issues without distinction. Fails to show awareness that the problem applies across functionalist frameworks.
      *   **Error:** Treating functionalism monolithically; ignoring the distinction between token and type and its relevance to the problem.

  5.  **Avoiding the Misconception (3 marks):**
      *   **A-Range (3):** Correctly characterises multiple realizability and pathological cases. Avoids the misconception that MR entails that *any* physically different system with identical behavioural outputs *must* possess identical mental states. Clearly distinguishes behavioural similarity from genuine functional realisation.
      *   **B-Range (1-2):** Implies or states that identical behavioural outputs guarantee identical mental states according to functionalism/MR, or fails to explicitly reject this misconception in the context of pathological realisers.
      *   **Error:** Stating or implying that functionalism *requires* ascribing mental states to any system with the right input-output profile (the very point pathological cases challenge).

  **Grade Boundaries (Indicative):** A (17-20), B (15-16), C (13-14), D (10-12), E/F (<10). (Actual boundaries subject to cohort performance).
