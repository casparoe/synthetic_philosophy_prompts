prompt: |-
  In a philosophy-of-physics seminar on special relativity and eternalism, a classmate repeatedly invoked the one-liner “if it’s frame-dependent, it’s not real” to dismiss my tentative defense of what I’ll call multi-frame presentism—the view that every inertial frame’s hyperplane of simultaneity is locally ontologically real, even though none is globally privileged. The slogan seemed to do all the work of moving from the relativity of simultaneity to the block universe, but I couldn’t tell whether it was a methodological rule about theory-building, an ontological filter, an explanatory principle, or something else entirely. Could you lay out the distinct precise theses that “if it’s frame-dependent, it’s not real” could be expressing—ranging from trivial platitudes about coordinate invariance to substantive metaphysical constraints—organized as a menu rather than a single analysis? For each reading, indicate whether it is defensible, plainly false, or question-begging against presentism; whether it genuinely supports the Rietdijk–Putnam-style inference from Lorentz symmetry to eternalism; and whether it also rules out multi-frame presentism specifically, or only rules out a globally unique present. In particular, distinguish (i) a claim about how physical laws should be formulated, (ii) a claim about what exists, (iii) a claim about causal or explanatory structure, and (iv) any other precise interpretation you see hiding in the phrase. Say which reading people in these debates usually intend when they deploy the slogan to end discussion, and which reading, if any, would allow my view to survive intact. Please state how confident you are in this taxonomy and single out the specific distinction—perhaps between the methodological and ontological readings, or between rejecting global privilege and rejecting frame-local reality altogether—about which you are least sure.
reasoning: |-
  Okay, the user is involved in a philosophy of physics seminar discussing special relativity and eternalism. Their classmate keeps using the slogan "if it’s frame-dependent, it’s not real" to dismiss their multi-frame presentism. The user wants a breakdown of possible interpretations of this slogan, organized as distinct theses, to see if their view can survive any of them. 

  First, I need to parse the slogan's possible meanings. It could range from methodological principles in physics to metaphysical claims. The user specifically wants to distinguish between interpretations related to physical laws, ontology, causality, and other nuances. They also want to know which version their classmate likely intends and if any interpretation allows multi-frame presentism.

  Starting with Methodology (Formulation of Laws). This is about coordinate invariance in physics. Physicists emphasize that laws should be frame-independent. This is defensible and standard in relativity. But it doesn't touch ontology directly. So, multi-frame presentism isn't threatened here because it's about existence, not laws.

  Next, Ontology (Existence). The strong reading here is that only invariant entities are real. This would outright deny multi-frame presentism since hyperplanes of simultaneity are frame-dependent. But is this defensible? It might beg the question against presentism. There's also a moderate version that allows frame-dependent entities as real if they're part of a larger invariant structure. That could be compatible with the user's view, but it's contentious. 

  Then, Causal/Explanatory Structure. If only invariant causal relations are fundamental, frame-dependent elements are derivative. This supports eternalism but doesn't necessarily kill multi-frame presentism if hyperplanes are seen as real but not fundamental. The user might salvage their view here, depending on how they frame it.

  Other interpretations could include epistemic or semantic claims, but those are less common. The classmate probably means the ontological claim, which is a strong move to block presentism. But the user's view might survive under the moderate ontological or causal interpretations if they argue that hyperplanes are real components of the invariant spacetime structure.

  The key distinctions are between methodology vs. ontology and rejecting global privilege vs. denying any reality to frame-dependent elements. The ontological reading is where I'm least sure, especially the moderate version. Some philosophers accept emergent or derivative realities, but it's debated. The user needs to challenge the strong ontological claim as question-begging and argue that frame-dependent entities can be real within a relativistic framework.
answer: |-
  Here's a taxonomy of possible interpretations of "if it’s frame-dependent, it’s not real," organized as distinct theses, with analysis of their implications for your debate:

  ### Interpretive Menu
  ---
  **I. Methodological Claim: Formulation of Physical Laws**  
  *Thesis:* Physical laws must be formulated in a Lorentz-invariant manner. Only quantities/structures invariant under Lorentz transformations represent objective, fundamental physical reality. Frame-dependent quantities are mere calculational tools or artifacts of perspective.  
  - **Defensible?** Yes (core principle of SR/GR, empirically validated).  
  - **Supports Rietdijk-Putnam?** Indirectly (undermines *fundamental* status of "present," but doesn't directly entail eternalism).  
  - **Rules out multi-frame presentism?** **No.** Compatible with hyperplanes being locally real *non-fundamental* entities emerging from an invariant structure.  
  - **Status:** Trivially true for fundamental physics; neutral on derivative ontology.

  **II. Strong Ontological Claim: Existence Requires Invariance**  
  *Thesis:* Only Lorentz-invariant entities/structures exist *simpliciter*. Frame-dependent structures (like hyperplanes) have no ontological status whatsoever—not even locally or derivatively.  
  - **Defensible?** Highly contentious. Begs the question against presentism (assumes eternalism/block universe).  
  - **Supports Rietdijk-Putnam?** Directly (if hyperplanes aren't real, only spacetime points/events exist).  
  - **Rules out multi-frame presentism?** **Yes.** Denies reality to hyperplanes *in any sense*.  
  - **Status:** Plainly false without justification; conflates *fundamental* with *real*.

  **III. Moderate Ontological Claim: Fundamental Reality Requires Invariance**  
  *Thesis:* Only invariant structures are *fundamentally* real. Frame-dependent structures may be real but are derivative (e.g., patterns in the block universe).  
  - **Defensible?** Plausible in many metaphysical frameworks (e.g., ontic structural realism).  
  - **Supports Rietdijk-Putnam?** Supports eternalism as the *fundamental* ontology.  
  - **Rules out multi-frame presentism?** **Not necessarily.** Allows hyperplanes as locally real but non-fundamental (e.g., "real" as emergent foliations).  
  - **Status:** Defensible if "real" is tiered; key distinction from (II).

  **IV. Causal/Explanatory Claim: Physical Salience Requires Invariance**  
  *Thesis:* Only invariant structures can play causal/explanatory roles in physics. Frame-dependent quantities lack physical efficacy.  
  - **Defensible?** Largely yes (e.g., energy is frame-dependent, but stress-energy tensor is invariant and causally salient).  
  - **Supports Rietdijk-Putnam?** Indirectly (undermines "present" as causally privileged).  
  - **Rules out multi-frame presentism?** **Weakly.** If hyperplanes lack causal power, their "reality" may be metaphysically inert—but doesn't preclude existence.  
  - **Status:** Defensible; focuses on physics' explanatory norms.

  **V. Semantic Claim: Meaning Requires Invariance**  
  *Thesis:* Physical concepts must be defined invariantly to be meaningful. Frame-dependent "reality" is incoherent.  
  - **Defensible?** Controversial (e.g., "simultaneity" *is* meaningful relativized to frames).  
  - **Supports Rietdijk-Putnam?** Only if combined with stronger premises.  
  - **Rules out multi-frame presentism?** **No.** Relativized concepts (e.g., "present-in-frame-F") can be meaningful.  
  - **Status:** Overly restrictive; clashes with how physics operates.

  ---

  ### Your Classmate's Likely Intent & Your View's Survival
  - **Typical Debate-Stopper:** Your classmate almost certainly invokes **Thesis II (Strong Ontology)**. This is the "nuclear option" in these discussions, dismissing presentism *by fiat* under the guise of relativistic virtue. It's rhetorically potent but philosophically shallow.  
  - **Survival Path for Multi-Frame Presentism:** Your view best survives under **Thesis III (Moderate Ontology)** or **Thesis I (Methodology)**. Argue that:  
    - Hyperplanes are *locally real but non-fundamental* structures within Minkowski spacetime (akin to "real but derivative" entities like vortices in a fluid).  
    - SR's methodological invariance doesn't prohibit *local* ontological commitments to frame-relative features, as long as the *global* structure is invariant.  
    - Rejecting a *privileged* frame (which you do) ≠ rejecting *all* frame-dependent reality.  

  **Key Distinction for Your Defense:**  
  Emphasize the **difference between *global metaphysical privilege* and *local ontological reality***. Your classmate's slogan illegitimately conflates them. SR abolishes the former but doesn't logically require abolishing the latter.  

  ---

  ### Confidence & Uncertainty
  - **Overall Confidence in Taxonomy:** High (90%). These distinctions map cleanly onto major positions in philosophy of spacetime (e.g., Norton, Earman, Maudlin).  
  - **Least Certain Distinction:** **The boundary between Thesis II (Strong Ontology) and Thesis III (Moderate Ontology)**. In practice, proponents often slide between them. Is "derivative reality" truly *ontological* or just *convenient fiction*? This hinges on unresolved debates about emergence and fundamentality. Your view lives or dies precisely here: convincing critics that frame-relative hyperplanes can be "real" without being "absolute."  

  **Strategic Recommendation:** Challenge your classmate to justify why *only* invariant structures can be real. Point out that their slogan, in its strong form (II), assumes eternalism rather than deriving it from relativity—effectively begging the question against your position. Defend your view under Thesis III as a coherent, relativistic alternative that respects SR's symmetries without collapsing into eternalism.
