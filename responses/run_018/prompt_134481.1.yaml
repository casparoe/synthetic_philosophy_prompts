  Hmm, their real need seems to be a fast, actionable filter for ethical arguments—something that fits into their 5-minute review window while catching flawed reasoning. The examples they provided are classic fact-to-value leaps: evolutionary tribalism, fMRI altruism, and predictive policing AI. 

  I notice they specifically want: 
  - A step-by-step flow with clear pass/fail gates 
