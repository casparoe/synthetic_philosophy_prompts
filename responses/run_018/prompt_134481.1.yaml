answer: |-
  Here's your **Is-Ought Gap/Naturalistic Fallacy Kill Switch** – a step-by-step checklist designed for speed. I’ll keep it casual, practical, and include misfire warnings. Let’s go:

  ---

  ### 🚦 The 5-Minute "Is-Ought" Gap & Naturalistic Fallacy Checklist
  **(Run these questions IN ORDER. Stop at first "FAIL" and reject the submission.)**

  1.  **🔍 STEP 1: What's the "IS" (Fact Claim)?**
      *   *Ask:* What scientific/biological/tech fact is the author stating? (Highlight it).
      *   *Pass:* A clear factual statement about how the world *is* (e.g., "Brains light up reward centers," "AI is 90% accurate," "Evolution favored tribalism").
      *   *Fail:* No clear fact stated, or the "fact" is actually an opinion/values statement disguised as science. **STOP. REJECT.**
      *   *Misfire Warning:* Sometimes the "fact" is oversimplified or contested science. You gotta use your gut here – if it sounds like pop-science nonsense ("Alpha wolves prove humans need hierarchies!"), it might fail Step 1 *or* be a values claim in disguise.

  2.  **🚨 STEP 2: What's the "OUGHT" (Value Claim)?**
      *   *Ask:* What action, policy, or moral rule is the author saying we *should* do/believe based *only* on that fact? (Highlight words like "should," "ought," "must," "moral," "correct," "good").
      *   *Pass:* A clear "ought" statement linked directly to the "is" fact. (e.g., "...so we *ought* to prioritize our group").
      *   *Fail:* No clear "ought" stated, or the link is super vague. **STOP. REJECT.** (If there's no "ought," it's just a science fact, maybe approve if appropriate for the blog? But *this* checklist is for ethics arguments).
      *   *Misfire Warning:* Sometimes the "ought" is implied but not stated. Be strict – if they don't say "should," it might dodge the gap... weakly.

  3.  **🕵️ STEP 3: The Gap Trap – Where's the Hidden Value?**
      *   *Ask:* **What unstated value or moral belief is the author using to JUMP from the fact (IS) to the conclusion (OUGHT)?** (This is the CRITICAL step).
      *   *Look For:* Words sneaking in values: "natural," "normal," "efficient," "correct," "optimal," "healthy," "better," "designed to," "purpose." OR assumptions about what's "good" or "bad."
      *   *Pass:* **The author EXPLICITLY states the moral/value principle they're using to bridge the gap.** (Rare! e.g., "...and because maximizing group survival is the highest moral good, we ought to...").
      *   *Fail:* **The jump relies on a HIDDEN or UNSTATED value assumption.** (This is the Naturalistic Fallacy in action: assuming the fact *itself* defines what's good/right). **STOP. REJECT. THIS IS THE VALUES CALL POINT.**
      *   *Misfire Warning:* Clever authors might state a *different* value principle that *isn't* actually supported by the fact they cited. That's a different fallacy (non sequitur), not *just* the is-ought gap. The checklist might PASS Step 3 technically but the argument is still bad – you have to judge if the value principle *logically connects* to the fact.

  4.  **⚖️ STEP 4: The Naturalistic Fallacy Finale**
      *   *Ask:* **Is the author claiming the fact *itself* PROVES the moral conclusion (that the "is" *is* the "ought")?** (e.g., "Because altruism lights up reward centers, it *is* morally correct.")
      *   *Pass:* The author avoids saying the fact *proves* morality. They recognize facts need values.
      *   *Fail:* The author directly equates the descriptive fact ("is") with the moral prescription ("ought") without any bridge. **STOP. REJECT. NATURALISTIC FALLACY DETECTED.**
      *   *Misfire Warning:* Sometimes the language is subtle ("this *shows* it's correct"). Be on guard for synonyms of "proves," "means," "shows," "demonstrates" linking fact directly to moral truth.

  ---

  ### 🧪 Applying the Checklist to Your Submissions

  **Submission 1:** *"Evolution made us tribal so we ought to prioritize our own group over outsiders."*
  *   **Step 1 (IS):** PASS. "Evolution made us tribal" (fact claim, even if debated).
  *   **Step 2 (OUGHT):** PASS. "we ought to prioritize our own group over outsiders."
  *   **Step 3 (Hidden Value):** **FAIL.** The jump relies on the HIDDEN value: "What evolution favored is morally good/right/obligatory." They don't state this value, they just assume it. **VALUES CALL POINT. REJECT.** (This is the classic Naturalistic Fallacy).
  *   *Your Gut vs. Checklist:* Your gut might *like* loyalty arguments, but the checklist catches the hidden, unjustified value leap. It doesn't say tribalism *isn't* good, just that evolution alone can't prove it *is* good. Reject.

  **Submission 2:** *"fMRI scans show altruism lights up reward centers so being selfless is the correct moral system."*
  *   **Step 1 (IS):** PASS. "fMRI scans show altruism lights up reward centers" (fact claim).
  *   **Step 2 (OUGHT):** PASS-ish. "being selfless is the *correct moral system*" (strong ought/value claim).
  *   **Step 3 (Hidden Value):** **FAIL.** The jump relies on HIDDEN values. Possibilities: "What activates reward centers is morally good," or "Biological pleasure defines morality." Not stated. **VALUES CALL POINT. REJECT.**
  *   **Step 4 (Nat. Fallacy):** **FAIL (Also).** They directly say the fMRI fact *shows* it's the "correct moral system." This is a blatant Naturalistic Fallacy – equating a brain state with moral truth. **REJECT.**

  **Submission 3:** *"predictive policing AI is 90% accurate so we should use it for sentencing."* **(Your Gut vs. Procedure Case!)**
  *   **Step 1 (IS):** PASS. "predictive policing AI is 90% accurate" (fact claim - though accuracy metrics are hugely contested! Gut check: is this *really* true? Might be shaky ground).
  *   **Step 2 (OUGHT):** PASS. "we should use it for sentencing."
  *   **Step 3 (Hidden Value):** **FAIL.** The jump relies on HIDDEN values: "Efficiency/Accuracy is the *only* or *primary* value in sentencing," or "Tech objectivity overrides other justice concerns (fairness, bias, due process, rehabilitation)." Not stated. **VALUES CALL POINT. REJECT.**
  *   *Your Gut vs. Checklist:* Your gut might think "90% accurate sounds efficient, maybe good?" But the checklist *forces* the issue: **Accuracy alone doesn't tell us if using it for sentencing is *just* or *fair*.** Is it biased? Does it violate rights? Does it perpetuate inequality? The submission ignores *all* those value questions. **Reject.**

  ---

  ### ⚠️ What This Checklist CAN'T Do (Be Honest!)

  1.  **Judge the Truth of the "IS":** If the science/tech claim is bullshit (e.g., "Phrenology proves..."), the checklist might PASS Step 1. You still need basic science BS radar!
  2.  **Judge the "OUGHT" Itself:** It only catches the *illegitimate jump*. If someone *explicitly* states "We should prioritize our group because group loyalty is our highest value," that PASSES Step 3 (value stated). You might think group loyalty is terrible! The checklist doesn't help you debate *that* value – that's pure ethics debate time.
  3.  **Catch All Bad Arguments:** It's laser-focused on the Is-Ought gap & Naturalistic Fallacy. It won't catch bad logic, straw men, false dichotomies, or weak evidence for the "is" claim.
  4.  **Solve Complex Value Conflicts:** When values *are* stated and conflict (e.g., "Accuracy vs. Fairness"), the checklist just says "values are in play." It won't tell you *which* value should win. That's the hard part of ethics!
  5.  **Handle "Is" Claims That *Frame* Values Subtly:** If the "is" claim is loaded (e.g., "Criminals have underdeveloped prefrontal cortices"), it smuggles in values *before* the jump. Your gut needs to flag biased framing.

  ---

  ### 💥 What To Do When Your Gut Fights the Checklist (Like Submission 3)

  1.  **Acknowledge the Conflict:** "My gut likes the efficiency, but the logic jump is invalid."
  2.  **Reject Based on Procedure:** Use the checklist result. "Rejected: Makes an unjustified leap from technical accuracy (is) to a sentencing policy (ought) without addressing core justice values."
  3.  **(Optional) Give Feedback:** If you have time, add a note: "Interesting point about accuracy! To strengthen this, you'd need to argue *why* accuracy overrides other justice concerns like potential bias or due process. The science alone can't dictate the ethics."
  4.  **Move On:** You have 5 minutes! Stick to the procedure for consistency. Save the deep value debates for class or approved pieces that *do* argue values explicitly.

  This checklist is your logic bouncer. It keeps out arguments trying to sneak "oughts" in through the "is" backdoor without paying the value admission fee. Good luck with the blog! (And yeah, "falacy" happens 😉).
