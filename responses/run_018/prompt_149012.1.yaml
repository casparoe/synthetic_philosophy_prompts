prompt: |-
  I'm drafting a comparative essay for a course on social norms and success, and I keep running into the proverb "the nail that sticks up gets hammered down" being used as a kind of conversation-stopper whenever American "tall poppy syndrome" discourse is compared with Scandinavian Jantelagen. The people who invoke it seem to treat it as if it automatically delivers a critique of American Dream-style celebration of outliers, but I think it might be smuggling in several very different normative and descriptive claims at once. Could you lay out the precise, distinct theses this proverb could be expressing—such as a descriptive claim about how egalitarian societies enforce conformity, a prescriptive claim that visible excellence is morally suspicious, a causal claim that cutting down high achievers preserves social cohesion, or a definitional claim about what humility requires—and for each say whether it is a near-trivial observation, a substantive and defensible position, or actually false? Then tell me which of those readings genuinely supports a Jantelagen-style or Japanese-style norm against standing out, which ones are being misused to attack American meritocratic ideals, and which ones would survive even if we decided that celebrating exceptional success is morally permissible. I want the answer structured as a clear menu of interpretations with verdicts on each, not a single favored reading. Please put the bottom line up front in one sentence summarizing the most defensible normative core the proverb could carry. Write in American English, keep it under 350 words, and do not include citations, reading lists, or references to specific scholars I should look up.
