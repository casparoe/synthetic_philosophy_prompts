answer: |-
  Here's your battle-tested Q&A prep sheet, ordered by likelihood and audience vibe. **Fix the typo** ("reasaonableness" → "reasonableness")—Kantians notice details, and it undermines credibility. Own mistakes *verbally*, not visually.  

  **Concession to Open With (Preempt EAs/Kantians):**  
  *"Before we start, I concede: DPS struggles with asymmetric large-scale disasters where one person bears catastrophic costs to save vast numbers. It’s a feature, not a bug—it enforces strict victim-focused constraints—but I grant this clashes with intuitive rescue imperatives in those extremes."*  

  ---

  ### **Q&A Prep Sheet**  
  *(Objections in Likely Order)*  

  1. **Kantian Ethicist #1 (Purity Check):**  
     *"This ‘pairwise threshold’ feels like aggregation in disguise. Aren’t you still summing harms *implicitly* by setting a ‘reasonableness bar’ per pair?"*  
     **Reply (1.5 min):**  
     "No—aggregation *compares total burdens* across groups. DPS asks only: *‘Is burden B on Victim V *itself* unreasonable to demand they bear to save Agent A?’* No summing across Vs. The threshold is about *individual* sacrifice limits, akin to Scanlon’s ‘burdensomeness’. It’s agent-relative, not group-summing.  
     **Soft Spot:** Doesn’t resolve how to *set* the threshold without implicit weighing. Stress it’s **victim-focused veto power**, not calculus.  

  2. **Effective Altruist #1 (Scale Ignored):**  
     *"If I can save 1,000 from paralysis by imposing minor headaches on each, DPS blocks this if *one* headache-victim pair fails your check? That’s monstrous!"*  
     **Reply (1 min):**  
     "Yes—because for that one victim, *you* are demanding they bear a burden (even minor) *for others’ gain* without their actual consent. DPS takes each victim’s ‘no’ seriously. Sacrificing one for many treats people as means—that’s what Kantians here reject! Trade-offs require *all* affected pairs to clear the bar."  
     **Soft Spot:** EAs won’t budge. Concede: *"I share your intuition in rescue cases, but DPS prioritizes integrity over totals."*  

  3. **Decision Theorist (Consistency):**  
     *"If I apply DPS behind a veil of ignorance, it collapses to maximin or EU violation. Why reject rational aggregation ex-post?"*  
     **Reply (2 min):**  
     "Veil-of-ignorance reasoning *is* aggregation—it asks ‘what risk would *I* accept?’ DPS rejects that. It’s not about *ex-ante* rational choice but *ex-post* claims: Victim V can object *after* the fact that *their* burden was unreasonable *for them*. EU maximization can’t hear that objection.  
     **Soft Spot:** If they press: *"DPS isn’t a choice rule—it’s an ex-post validity test for principles."*  

  4. **Kantian Ethicist #2 (Overblocking):**  
     *"Suppose ten people need a rescue costing $1 each. If one destitute person can’t spare $1 reasonably, DPS forbids saving everyone?"*  
     **Reply (1 min):**  
     "In that case, the ‘burden’ on the destitute person isn’t the $1—it’s *the cost of not being rescued if others contribute*. We screen per *agent-victim pair*: if *I* can save someone at $1 cost to me, reasonableness depends on *my* wealth. The destitute person’s inability doesn’t veto others’ duties if *their own* burden is reasonable."  
     **Soft Spot:** Clarify fast—misunderstandings here sink you.  

  5. **Effective Altruist #2 (Tyranny of Minorities):**  
     *"One unreasonable person can block massive goods? What if they’re irrational?"*  
     **Reply (1 min):**  
     "Unreasonableness isn’t subjective—it’s objective: *‘Could anyone reasonably reject bearing burden B to save A?’* If yes, the veto stands. But if the burden is trivial (e.g., clicking ‘allow’ on a lifesaving app), it’s unreasonable *to veto*. DPS filters frivolous objections."  
     **Soft Spot:** Who defines ‘reasonable’? Gesture to **conventional Scanlonian criteria** (avoid ad hoc).  

  ---

  ### **The Nightmare Question (PRAY THEY DON’T ASK):**  
  **"What if there are infinitely many victims? If *each* pairwise check allows a tiny harm, but the cumulative harm to *one* victim is infinite (e.g., dust speck torture), does DPS forbid *all* actions since every pair clears the bar?"**  

  **Reply (Panic-Free):**  
  *"Infinite cases break *most* theories—including aggregation! DPS focuses on real-world finite populations. For infinities, we might add a ‘per victim cumulative burden’ screen, but that’s beyond today’s scope. I’m working on it."*  
  **Why It’s Bad:** Undermines the "no aggregation" claim if you need a total cap.  

  ---

  ### **Summary Tactics:**  
  - **Kantians:** Hammer **individual veto rights** and **anti-aggregation purity**.  
  - **EAs:** Concede the "cost" but frame it as **moral integrity over efficiency**.  
  - **Decision Theorist:** Insist **ex-post validity ≠ ex-ante choice rule**.  
  - **Fix the typo.** Own *verbal* slips, not slides.  
  - **Nightmare:** Admit it’s unsolved but stress *"all theories struggle with infinities."*  

  You’ve got this—structure disarms hostility. Good luck!
