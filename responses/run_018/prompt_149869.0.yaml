answer: |-
  ### Exam Question (25 marks total)  
  **Critically evaluate the concept of "normative inertia" in moral relativism. Using one concrete historical or hypothetical case study, analyze whether normative inertia:**  
  **(a) Defends relativism against charges of self-insulating dogmatism by demonstrating frameworks’ capacity for internal adaptation, OR**  
  **(b) Reveals relativism as unfalsifiable in a way that undermines meaningful moral critique.**  

  *Define "normative inertia" as the tendency of a moral framework to absorb external criticism not by engaging with the critic’s premises, but by redefining its own internal criteria for what constitutes a valid moral reason or agent/patient, thereby rendering the criticism unintelligible within the framework. Your argument must center on a single detailed case, not general summaries of relativist theory.*  

  ---

  ### Model Answer (Demonstrating Reasoning)  
  **Normative inertia** describes a defensive maneuver where a moral framework, faced with criticism it cannot answer on the critic's terms, shifts its *own* boundaries of moral relevance. Instead of rebutting the critique, it redefines who counts as a moral agent/patient, what counts as a relevant reason, or what constitutes a "harm" within its logic. This shields the framework from external disruption but raises the question: is this a sophisticated form of adaptation or intellectual bad faith?  

  Consider the **historical case of European colonial justifications for dispossession and violence against Indigenous peoples**, particularly the doctrine of *terra nullius* ("land belonging to no one"). Critics operating within frameworks emphasizing natural rights or universal human dignity (e.g., figures like Bartolomé de las Casas) argued that colonizers inflicted grievous harm – theft, massacre, cultural destruction – upon people with inherent moral status. Colonial frameworks, however, exhibited profound normative inertia. They absorbed this criticism not by disputing that harming *persons* was wrong, but by systematically reclassifying Indigenous peoples. They were framed as "savages" lacking reason, true religion, "civilized" social structures, or even true "possession" of land according to European property norms. *Terra nullius* itself is a redefinition: land not cultivated in European agricultural styles was deemed "empty" and thus outside the moral consideration owed to settled property. The harm described by critics *ceased to be intelligible as harm* within the colonial framework because the subjects of that harm were redefined as lacking the requisite status (e.g., "rational owners," "true humans under God") to be moral patients in the relevant sense. The objection based on universal harm didn't disappear; it was rendered *incomprehensible* within the framework's revised vocabulary.  

  Does this inertia **save relativism from the charge of self-insulating dogmatism**? Proponents might argue *yes*. It shows frameworks aren't brittle monoliths but dynamic systems capable of internal evolution to maintain coherence under pressure. From a relativist perspective (e.g., Wong's pluralistic relativism), this adaptation reflects the framework's deep connection to a specific form of life. The colonial framework *did* generate complex internal rules about land use, civilization, and salvation; its redefinitions weren't arbitrary but stemmed from its core commitments (e.g., divinely mandated expansion, Lockean property theory). Normative inertia, in this view, demonstrates the framework's robustness and its ability to maintain internal consistency – key relativist virtues – without resorting to absolute, external dogma. It shows frameworks engage with challenges *on their own terms*, which relativism contends is the only valid way.  

  However, this very capacity arguably **exposes relativism as unfalsifiable in a damaging way**. If any criticism can be deflected by redefining the framework's core elements – who counts, what counts as a reason, what counts as harm – then the framework becomes immune to *any* external moral critique. It can always "win" by moving the goalposts. In the colonial case, the redefinitions weren't neutral adaptations; they were tools of domination, insulating a profoundly harmful system from accountability. This highlights the danger: normative inertia doesn't foster genuine dialogue or progress; it enables evasion and perpetuates harm. If relativism celebrates this as valid "internal adaptation," it risks endorsing frameworks that are not just *different*, but morally monstrous *and* immune to challenge. The charge of dogmatism isn't avoided; it's exacerbated. The framework becomes self-sealing, validating only those critiques it can already accommodate within its mutable boundaries. The inability of the *terra nullius* doctrine to genuinely engage with the lived reality and moral claims of Indigenous peoples wasn't sophistication; it was a failure of moral perception enabled by unfalsifiability.  

  **Conclusion:** While normative inertia might initially appear as a relativist strength (demonstrating internal adaptability), the colonial case starkly reveals its darker implication: it renders moral frameworks fundamentally unfalsifiable through external critique. This doesn't necessarily *refute* relativism (as relativism predicts this incommensurability), but it exposes a profound weakness. Relativism struggles to explain how such inertia can be distinguished from simple dogmatism when it systematically excludes the voices and harms experienced by those redefined out of moral relevance. The capacity to absorb critique by redefinition ultimately protects frameworks from the very scrutiny that might expose their moral bankruptcy, making normative inertia a feature that saves relativism from easy refutation at the cost of potentially endorsing unfalsifiable, and thus unchallengeable, systems of justification for harm.  

  ---

  ### Marking Scheme (20 marks total)  

  | **Must-Hit Point (MHP)**                     | **Marks** | **Common Botch**                                                                 |
  | :------------------------------------------- | :-------- | :------------------------------------------------------------------------------- |
  | **1. Accurately defines "Normative Inertia"** | 4         | Vague paraphrase (e.g., "ignoring criticism"). Must include *redefinition* of internal criteria (agents/patients, reasons, harms). |
  | **2. Applies NI concretely to ONE case**      | 5         | Case is vague, generic, or merely illustrative; OR focuses on the *criticism* not the framework's *redefinition* in response. Must show HOW the framework redefined terms to absorb the critique. |
  | **3. Explains the "Self-Insulation" Defense**| 4         | Just describes NI; doesn't articulate *how* it could defend relativism (e.g., as adaptive robustness/internal coherence). |
  | **4. Explains the "Damaging Unfalsifiability" Critique** | 4         | Just states "it's unfalsifiable"; doesn't articulate *why* this is *damaging* (e.g., enables evasion, protects harmful systems, precludes accountability). |
  | **5. Clear Evaluation & Conclusion**         | 3         | Summarizes points without weighing them; OR conclusion ignores the case study; OR doesn't address relativism's dilemma. Must take a reasoned stance based on analysis. |

  *Bonus (up to +2): Exceptional clarity, originality in case choice, or nuanced handling of the relativism tension.*  
  *Penalty (-1 to -3): Significant irrelevance, factual errors in case study, or severe incoherence.*  

  ---

  **How it hits the marks in the model:**  
  1.  Defines NI clearly upfront with key elements (redefinition, internal criteria).  
  2.  Uses *terra nullius*/colonial classification concretely, showing HOW redefinition absorbed critique.  
  3.  Explains defense: NI as adaptation/robustness preserving internal coherence (relativist virtue).  
  4.  Explains critique: NI as unfalsifiability enabling evasion/perpetuating harm (damaging consequence).  
  5.  Conclusion evaluates: NI saves relativism *from refutation* but at cost of endorsing unfalsifiable systems, using the case to show the damage.
