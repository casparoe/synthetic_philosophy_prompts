  The video recordings add another layer. This creates what game theorists call "common knowledge of rationality" - both know the other is rational, both know they know, and so on. In standard models, this should reinforce the backward induction outcome. Yet empirically, humans don't behave that way. Why? 

  Ah, right - the theory assumes perfect rationality with no uncertainty. But in reality, people might doubt the other's rationality or utility function. Maybe the flatmate values fairness more than money? Or perhaps they fear reputational damage? The videos could actually sustain cooperation by making defection more socially costly.

