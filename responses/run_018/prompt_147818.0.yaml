  I need to carefully structure this session with clear dependencies between components. Starting with the core concept of normal science seems essential since it establishes what gets disrupted during a paradigm shift. Then I can introduce paradigm shifts as breakdowns in puzzle-solving, leading naturally to incommensurability as the barrier that prevents smooth transition between paradigms.

  For the Lavoisier case study, I must frame it strictly as a restructuring of kind-terms like "element," "compound," and "calx." I need to explicitly exclude any discussion of improved measurements or new discoveries about oxygen's properties. The focus should be on how these terms acquired new meanings and relationships within the lexical taxonomy.

  I anticipate several common misconceptions that need addressing:
  - That incommensurability means complete untranslatability (I'll clarify it's about partial translation with altered meanings)
  - That paradigm choice is purely sociological (I'll emphasize it's constrained by empirical factors)
  - That gestalt switch involves literal perception (I'll stress it's about conceptual reorganization)
  - That normal science equals dogmatism (I'll highlight its generative role in puzzle-solving)

  I should include a concluding check-question to verify students understand incommensurability as lexical restructuring rather than comparison failure. Something asking them to distinguish why two scientists might disagree despite seeing the same evidence.

  I'll deliberately avoid covering the full sociology of science, Kuhn's later Wittgensteinian influences, or detailed phlogiston debate history. The lexical taxonomy angle must remain central.

