  For structure: I’ll open with a hook that disarms both sides (historians with rigor, writers with metaphor), then weave Weber through a structural lens—no platitudes. Karoshi must be framed as systemic, not cultural. The "leisure debt" concept needs vivid scaffolding: maybe clock imagery for historians, bodily metaphors for writers. 

