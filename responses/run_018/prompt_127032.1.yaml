answer: |-
  Here's a structured plan for your Nyāya pramāṇas study session, designed to show dependencies, use a concrete scenario, preempt misconceptions, and clarify why all four are irreducible. This focuses on **Classical Nyāya** (Gautama/Vātsyāyana) and intentionally avoids later developments.

  **Core Structural Insight:**  
  The pramāṇas build upon each other logically. **Pratyakṣa (Perception)** is foundational. **Anumāna (Inference)** requires perception to establish its terms/relations. **Upamāna (Comparison)** relies on both perception and inference. **Śabda (Verbal Testimony)** ultimately depends on the other three for validation and meaning.

  **The Unifying Scenario: Identifying a "Gavaya" (Wild Ox/Cow-like Animal)**  
  *Why it works:* It's Nyāya's *own* classic example (implicitly referenced in sutras/comments on Upamāna), involves all pramāṇas naturally, avoids modern complexities (like mushrooms needing biochemistry), and highlights Upamāna's unique role. Modify slightly for clarity:

  > *You live near a forest. You know domestic cows (go). One day, a forest-dweller (reliable expert) tells you: "There’s an animal here called a ‘Gavaya’. It looks VERY similar to a cow, but isn’t one. It has these specific features: a distinctive hump, curved horns, and a different call." Later, while exploring, you see an unfamiliar animal.*

  **The Session Flow:**

  1.  **Start with the Problem (Hook):**  
      *"You see an animal deep in the forest (point to picture/sketch of a Gaur or similar). Is it dangerous? Edible? What *is* it? How do you reliably know? Nyāya says you need specific tools (pramāṇas) for specific kinds of knowing."*

  2.  **Pratyakṣa (Perception): The Foundational Layer**  
      * **What it is:** *Direct, sense-mediated cognition.* Seeing the animal's color, shape, size, hearing its sound HERE and NOW.  
      * **Scenario Role:** You SEE the animal's hump, curved horns, hear its unique call (different from a cow's moo). *This is raw data.*  
      * **Dependency:** None. The starting point. All other pramāṇas need its input.  
      * **Crucial Nuance:** Emphasize it's *non-conceptual* initially ("a brown moving shape with projections"), but becomes conceptualized ("hump," "horn") through association (Nyāya accepts this).  
      * **Head off Misconception:** It's NOT just "seeing." It includes all senses (hearing the call!). It's NOT passive reception; it involves mental processing (manas).

  3.  **Anumāna (Inference): Building Connections**  
      * **What it is:** *Knowledge derived from a mark (liṅga) via a previously known universal connection (vyāpti).*  
      * **Scenario Role:** You recall the forest-dweller's words: "It has a hump and curved horns." You infer: "This animal has a hump and curved horns. The forest-dweller said the Gavaya has these features. Therefore, *this is likely the Gavaya*."  
      * **Dependency:** REQUIRES Pratyakṣa (you perceived the horns/hump) AND prior knowledge (the verbal description from the forest-dweller, which you stored via... Śabda!). Inference links perceived marks to a conclusion based on a known rule.  
      * **Head off Misconception:** It's NOT guessing or mere association. Stress the logical structure: *Perceptible Mark* (hump/horns) + *Established Universal Rule* ("All things with *this specific* hump/horn combo are Gavayas") = Conclusion. The rule comes from elsewhere (here, Śabda).

  4.  **Upamāna (Comparison): The Unique Linker**  
      * **What it is:** *Knowledge of the relation between a word and its referent based on similarity.*  
      * **Scenario Role:** THIS IS KEY. You know a domestic cow (go). The forest-dweller told you the *name* "Gavaya" and that it *resembles* a cow but has key differences (hump, horns, call). Later, you SEE the Gavaya. **Upamāna occurs when you actively think: "Ah! *This* animal in front of me resembles the cow I know, AND it matches the specific differences described, SO *this* must be what the word 'Gavaya' refers to!"**  
      * **Dependency:** REQUIRES Pratyakṣa (seeing both cow & gavaya), Anumāna (possibly inferring similarity/difference), AND crucially, prior Śabda (hearing the name "Gavaya" and its description/similarity).  
      * **Head off Misconception (CRITICAL HERE):**  
          * **NOT Simple Analogy:** Western analogy is often "A:B :: C:D" (e.g., atom:solar system). Upamāna is specifically about *learning the connection between a WORD and the OBJECT it names* via similarity to a *known* object. It's epistemic, not just logical.
          * **NOT Reducible:** It combines similarity perception *with* the linguistic act of naming learned via testimony. Nyāya argues you can't fully explain this moment *just* with perception + inference + testimony; the act of *linking the name to this new object via similarity* is a distinct cognitive event.

  5.  **Śabda (Verbal Testimony): Reliable Words**  
      * **What it is:** *Knowledge derived from the reliable utterance of a trustworthy person (āpta).*  
      * **Scenario Role:** The forest-dweller (established as knowledgeable about forest animals) TELLS you: 1) The name "Gavaya", 2) It resembles a cow, 3) Key differences (hump, horns, call). This provides the crucial prior knowledge *before* you encounter the animal.  
      * **Dependency:** Ultimately relies on the *speaker's* Pratyakṣa, Anumāna, or Upamāna! The *hearer* must perceive the sounds (Pratyakṣa), understand the words/concepts (based on prior Upamāna/Śabda for word meanings), and judge the speaker's reliability (often via Anumāna).  
      * **Head off Misconception (CRITICAL HERE):**  
          * **NOT Blind Faith:** Stress "reliable speaker" (āpta). Reliability is established through other pramāṇas (e.g., you perceive their expertise, infer their honesty). It's *tested* testimony.
          * **NOT Just Scripture:** While important for Vedas (for Nyāya), it applies to ANY reliable expert – the botanist, the mechanic, the forest-dweller.

  **Why Four? The Irreducibility Check Question:**  
  *At the end, pose this:* "Some philosophers argue Upamāna is just Inference (you infer the name based on similarity), and Śabda is just Inference based on the speaker's reliability. Nyāya says NO. Using our Gavaya example, **what specific moment of knowing would be missed or misdescribed if we tried to eliminate Upamāna as a distinct pramāṇa?**"  
  *Desired Answer:* The precise moment when, upon seeing the Gavaya *and* recalling its described similarity to a cow *and* recalling its name, you *actively connect the name "Gavaya" to THIS object in front of you based on that similarity*. Inference alone might link features to "Gavaya-ness," but Upamāna links the *word itself* to the object via the similarity. This cognitive act is unique.

  **What You Are OPENLY Leaving Out (Announce This):**  
  *"We're focusing on the core Classical Nyāya view of four distinct pramāṇas. We won't cover:*  
  *   *Debates with other schools (e.g., Buddhists on 2 pramāṇas, Mīmāṃsā on 6).*  
  *   *Later developments in Navya-Nyāya logic and their subtle refinements.*  
  *   *Intricate debates about God or the Vedas related to Śabda.*  
  *   *Detailed breakdowns of inference formats (5-step vs. 3-step).*  
  *This keeps us focused on the core structure and dependencies."*

  **Key to Success:**  
  *   **Constantly refer back to the Gavaya scenario.** Ask students to identify which pramāṇa is at work at different points.  
  *   **Hammer the Dependencies:** "Could you have inferred it was a Gavaya if you hadn't perceived its features AND heard the description?" "Could you link the name via similarity if you didn't already know what a cow looks like AND what the word 'Gavaya' meant?"  
  *   **Preempt Misconceptions Proactively:** Don't wait for them to arise, weave the clarifications into the initial explanation of each term ("Now, this is NOT just analogy...").  
  *   **Focus on Function:** What *kind* of knowledge does each pramāṇa provide that the others fundamentally cannot provide *in the same way*?  

  This structure shows why Nyāya insists on four: each addresses a fundamentally distinct *source* and *process* of valid cognition, even if they work together. The Gavaya example makes the dependencies concrete and highlights Upamāna's often-misunderstood role. Good luck!
