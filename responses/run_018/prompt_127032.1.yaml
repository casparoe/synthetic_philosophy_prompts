prompt: |-
  I'm taking this intro indian philosophy course and next week I have to run a study session for my section on Nyāya epistemology, specifically the four pramāṇas. I don't want to just dump pratyakṣa, anumāna, upamāna and śabda in order like some encyclopedia entry. Can you plan the explainer for me? What order do they actually have to come in so the dependencies are clear — like why you can't understand upamāna without knowing what anumāna already does? What's the single concrete scenario that should carry the whole thing? I'm thinking something like identifying whether a wild mushrom is poisonous using sight, inference from similar ones, comparison to a known sample, and then being told by a local forager — but tell me if that example has problems and what it needs to have and lack. Also what misconceptions should I expect — probably people will think śabda is just blind authoraty bias, or that upamāna is exactly the same as western analogical reasoning — and exactly where in the sequence should I head each one off? I need a check question at the end that shows whether they got the structural point about why Nyāya insists on four ireducible sources rather than collapsing them. And tell me what I should openly leave out at this level — maybe the Navya-Nyāya revisions? — and say so. Oh, and no reading lists or sutra citations please, I wouldn't be able to check them and neither can anyone here.
reasoning: |-
  Okay, the user is preparing a study session on Nyāya epistemology focused on the four pramāṇas. They want a structured explainer that shows dependencies between the pramāṇas, not just a list. A concrete scenario would help illustrate how each pramāṇa works in sequence. 

  The user suggested a mushroom identification example, which is practical but needs refinement. The key is ensuring each pramāṇa has a clear, distinct role without overlap. I'll adjust the scenario to make śabda come last since testimony relies on prior knowledge from other sources. 

  Common misconceptions to address:
  - Śabda being seen as blind authority (it's actually verified testimony)
  - Upamāna reduced to analogy (it's about name-object connection)
  - Anumāna confused with guessing (it's systematic inference)

  The structural check question should force students to see why Nyāya rejects reducing the four to fewer. I'll use a "why not three?" format to highlight upamāna's uniqueness.

  For scope, I'll exclude Navya-Nyāya refinements and historical debates. Focus stays on classical Nyāya's framework. The flow should feel like building blocks: perception → inference → comparison → testimony, each depending on the last.

  The mushroom scenario needs these fixes:
  1. Make the poisonous/non-poisonous distinction clearer (e.g., gills vs. pores)
  2. Ensure upamāna isn't just inference (stress naming via similarity)
  3. Have śabda come from an expert after other methods are attempted
