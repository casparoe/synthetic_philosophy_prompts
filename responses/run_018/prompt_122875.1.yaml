  Okay, let me start by unpacking the user's query. They're an experimental physicist with decades of experience, now diving into philosophy, specifically the free will debate. Their main observation is that the stalemate in philosophy contrasts sharply with physics, where unresolved issues often stem from ill-posed questions or differing measurements. They propose the "resolution hypothesis": that "could have done otherwise" hinges on granularity, with compatibilists and incompatibilists using different scales. But they have doubts—first, the debate's asymmetry regarding blame vs. praise, and second, incompatibilists' focus on the agent's lack of control over their own reasons.

  The user wants a diagnosis, not a verdict. They suggest an experiment testing if laypeople's judgments shift with narrative granularity. The core questions: Is the dispute verbal (granularity-driven) or substantive? What would progress look like? Their experiment idea is key here.

  First, I need to validate their hypothesis. Granularity does play a role. Compatibilists often use coarse-grained descriptions (reasons, character) where alternatives exist if we vary inputs. Incompatibilists insist on fine-grained determinism where every detail is fixed. This aligns with physics analogies like phase space vs. microstates. So their hypothesis is plausible and recognized in literature (e.g., Dennett's "degrees of freedom").

  But their doubts are spot-on. The blame/praise asymmetry suggests deeper issues. Incompatibilists tie free will to ultimate responsibility—avoiding being a "mere conduit" of prior causes. This "sourcehood" concern persists even at fixed granularity. For example, if an agent's reasons are determined by past events, incompatibilists see no true ownership, regardless of coarse-grained alternatives. This isn't about granularity but about metaphysical requirements for responsibility.

  Also, moral valence matters. Blame might feel more demanding, needing alternative possibilities to avoid unfairness, while praise might seem compatible with determination (e.g., "they had to be heroic"). Some compatibilists downplay alternatives for praise but keep them for blame, adding complexity. This isn't granularity—it's about asymmetries in moral responsibility itself.

  Regarding the experiment: testing granularity effects could clarify if "could have done otherwise" is context-sensitive. If laypeople's judgments shift with resolution, it supports the compatibilist view that our folk concept is coarse-grained. But it wouldn't satisfy incompatibilists, who'd argue that folk intuitions are mistaken or that deeper metaphysics (sourcehood) is untouched. So the dispute might relocate rather than resolve.

  For progress, combining empirical work (like the experiment) with conceptual refinement could help. Surveys on sourcehood vs. alternatives might reveal what responsibility fundamentally requires. Or interdisciplinary approaches (neuroscience, psychology) could test if people naturally think in compatibilist terms. But ultimate progress might need redefining the question, much like physics reframes ill-posed problems.

  In sum: granularity explains part of the stalemate, but substantive differences (sourcehood, moral asymmetries) remain. The user's physics lens is insightful—this is both a hidden parameter issue and a deeper clash. Their experiment is a strong starting point for empirical engagement, though philosophers will debate its implications. Progress lies in mapping the conceptual landscape more precisely and integrating data on how responsibility attributions actually work.
answer: |-
  Your diagnosis is remarkably astute—both the granularity hypothesis and your doubts capture core dynamics of the free will stalemate. The dispute is **partly verbal** (driven by granularity), **partly substantive** (about what responsibility *requires*), and **persists even with fixed granularity** due to deeper disagreements about agency and ownership. Here's a breakdown:

  ### 1. **Granularity as a Hidden Parameter (Your Hypothesis is Largely Correct)**
     - **Compatibilists** typically operate at a **coarse-grained, agential level**: They model "could have done otherwise" by holding the agent's identity (character, values) fixed while varying *reasons* or *circumstances* within plausible bounds. If the agent *would* have chosen differently with a slight change in inputs (e.g., "Had she known the consequences, she wouldn't have acted"), alternatives exist.
     - **Incompatibilists** insist on **fine-grained, physical determinism**: Given the exact initial conditions + laws, only one future is physically possible. Any coarse-grained "alternative" is illusory because it implicitly alters past states (e.g., changing the agent's reasons requires altering prior causes).
     - **Physics Parallel**: This mirrors phase space vs. microstate descriptions. Compatibilists treat agents as "macrostates" with multiple realizable microhistories; incompatibilists demand microstate uniqueness. Your resolution hypothesis explains much of the *apparent* contradiction.

  ### 2. **Why Granularity Alone Doesn't Resolve the Dispute (Your Doubts are Valid)**
     - **The Sourcehood Problem**: Even with granularity fixed, incompatibilists object: *"How can the agent be the source of their actions if their reasons/character were determined by factors beyond their control?"* This shifts focus from *alternatives* to *origination* (e.g., Robert Kane's "ultimate responsibility"). Coarse-grained alternatives don't address whether the agent *owns* their psychology.  
     - **Moral Valence Asymmetry**: You're right that blame/praise asymmetry matters. Incompatibilists often tie free will to *avoiding undeserved blame* (e.g., "If determinism is true, no one deserves punishment"). Compatibilists may grant that *praise* can apply even without robust alternatives (e.g., an inherently kind person "couldn't help" being kind) but preserve alternatives for *blame*. This isn't granularity—it’s a clash about **what makes responsibility fair**.  
     - **Control vs. Ownership**: For compatibilists, control is about *responsive agency* (acting for reasons). For incompatibilists, true control requires *causal buck-stopping*—a demand granularity can't satisfy.

  ### 3. **Diagnosis: A Layered Stalemate**
  The standstill stems from **three entangled conflicts**:
     - **Descriptive Grain** (as you identified):  
       - Compatibilism: Folk-psychological/counterfactual grain.  
       - Incompatibilism: Microphysical/actual-sequence grain.  
     - **Substantive Requirements for Responsibility**:  
       - Incompatibilists require *metaphysical ultimacy* (the agent as an uncaused cause).  
       - Compatibilists require *practical agency* (reason-responsiveness, moral competence).  
     - **Moral Psychology**:  
       - Blame intuitively feels "unfair" without alternatives; praise feels less contingent.  
       - Incompatibilists exploit this asymmetry to argue compatibilist "control" is morally inadequate.

  ---

  ### 4. **Would Your Experiment Help? Yes, But With Caveats**
  **Experiment**: Present identical scenarios at two resolutions—e.g.,  
  - *Fine grain*: "Given neuron state X at t₀, Agent A *must* choose Y."  
  - *Coarse grain*: "Agent A disliked dishonesty, so lying was unlikely—but she *might* have lied if pressured."  

  **Likely Outcome**:  
  - Verdicts *would* track granularity. Subjects would affirm "could have done otherwise" more under coarse-grained descriptions. This would support the compatibilist claim that *folk intuitions are inherently coarse-grained*.  

  **Why It Wouldn't End the Dispute**:  
  - Incompatibilists would argue: *"Folk intuitions are mistaken. Physics reveals the fine-grained truth."*  
  - Compatibilists would counter: *"Responsibility operates at the agential level—microphysics is irrelevant."*  
  - The experiment **relocates the dispute** to:  
    - *Which granularity "matters" for moral responsibility?*  
    - *Are folk intuitions authoritative or illusory?*  

  ---

  ### 5. **What Counts as Progress?**
  Your physics intuition is sound: progress requires **reframing the question** and **new empirical input**. Promising paths:  
  - **Clarify the "Moral Stakes"**: Map which aspects of responsibility (blame, punishment, moral anger) *actually* depend on alternatives vs. sourcehood. Experimental philosophy (*x-phi*) already explores this (e.g., Joshua Knobe's work).  
  - **Test the Sourcehood Intuition**: Present subjects with agents whose psychology is determined but reasons-responsive. Do they still attribute ownership/desert? Early *x-phi* suggests incompatibilist intuitions weaken under scrutiny.  
  - **Interrogate Granularity Itself**: If physics undermines microphysical determinism (e.g., quantum indeterminacy), does it help? Likely not—indeterminism often seems *worse* for control. Better to ask: *What grain does our social/moral practice require?*  
  - **Naturalize Agency**: Like Dennett, treat free will as a "user illusion" evolved for social coordination. This reframes the dispute as engineering: *What model of agency best serves human needs?*  

  **Your experiment is a crucial step**—it would force philosophers to engage with granularity explicitly. But ultimate progress may require abandoning the quest for a "cosmic" free will and focusing on *what matters for moral practice*. As a physicist, you’ll appreciate the parallel: just as thermodynamics works without tracking particles, responsibility may not need microphysical openness. The standoff persists because each side defends a different *explanatory level*. Resolving it demands deciding which level grounds ethics—or whether ethics needs grounding in metaphysics at all.
