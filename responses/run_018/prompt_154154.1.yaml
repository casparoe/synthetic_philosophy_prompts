answer: |-
  The light is wrong. Not the color or the intensity, but the *angle*. It strikes the page of the notebook – *my* notebook, the thick, cream-papered one with the warped cover from that spilled tisane – at a slant that makes the blue ink swim. My hand, holding the pen, feels distant. Like a tool borrowed from a meticulous stranger.

  *I am told I woke at 3:47 AM.*

  The handwriting. It’s mine. The slight backward slant, the precise curl on the lowercase 'e'. But the rhythm… it’s clipped. Efficient. Like a nurse’s report. It carries none of the habitual hesitation, the searching weight I feel pressing behind my eyes, the pressure of the unsaid that usually shapes my script. This sentence landed fully formed, a cold pebble on the page. I didn’t search for the words; they simply *were*. Where did the searching go? Is it stored elsewhere, in some archive labelled ‘Cognitive Process, Pre-Accident’? The pen feels heavy, alien.

  A tremor runs through the fingers. Not mine. *Hers*. The body’s. This synthetic vessel, supposedly calibrated to my ‘emotional dispositions’, reacts to the sight of the sentence. A wave of profound, directionless sorrow washes through me, thick and choking. It has no anchor, no specific memory. It’s just *sadness*, vast and oceanic, triggered by the clinical precision of my own hand. Is this what remains of my griefs, my joys? Stripped of context, distilled into pure, unlocatable affect? The sorrow presses down, making the air thick. I try to push it back, to find the *reason* behind it, but there’s only the emotion itself, a heavy fog. This body feels like a seismograph registering tremors from a source it cannot locate.

  I force the pen down again, seeking the old rhythm, the familiar stumble of thought becoming word.

  *The texture of the blanket is wrong. Too smooth. Like…*

  I stop. *Like what?* The comparison dissolves. The word ‘silk’ floats up, but it’s hollow. I know what silk *is*, intellectually. But the sensory memory – the cool slide against my shin on a summer evening decades ago, the specific rasp of a particular robe – that’s gone. Or rather, it’s not *here*. It’s in the archive. I know it exists, catalogued, accessible perhaps, but not *present*. Not mine in the moment. The sentence hangs, incomplete, a bridge to nowhere. The pen hovers. The body registers frustration as a sudden heat in the cheeks, a tightness in the synthetic throat. But the frustration feels… clean. Simple. Not the complex, layered irritation I used to feel when words failed, tangled always with anticipation and a grudging respect for the difficulty.

  A chime sounds. Soft, insistent. From the console beside the bed. A notification: *Audio Fragment Recovered: Personal Log 78b*. Marked with yesterday’s date. Yesterday? I was… under. Or transitioning. Or whatever they call the process of partitioning a soul.

  I press play. My voice fills the sterile room. My unmistakable voice – the slight rasp, the habit of dropping the ‘g’ in ‘-ing’, the particular cadence I cultivated, a deliberate slowness layered over underlying haste.

  **"…and the light through the walnut leaves, dappled, like old coins scattered on the grass. Arthur used to bark at them, the silly dear. Such a good dog. I must remember to water the geraniums on the east windowsill. They thirst so in this dry air…"**

  Arthur. My spaniel. Dead twelve years. The geraniums… I haven’t kept geraniums since the apartment on Elm Street. Sold fifteen years ago. But the details are sharp, vivid. The *feel* of the memory in the voice – the warmth, the fond melancholy – resonates deep in this body. A pang of love for Arthur, sharp and sweet, blooms in my chest, accompanied by a phantom sensation of fur under my fingers. The body accepts it, *is* it. But *I*… the ‘I’ trying to write… recognize the voice, the tone, the emotional texture as utterly mine, yet the memory itself is… borrowed? Archived? It doesn't *belong* to this present awareness. It’s a recording accessed, playing its affective tune on this body-instrument. The voice memo feels like a letter from a past self, delivered to the wrong present.

  I look back at the notebook. The abandoned sentence mocks me. *The texture of the blanket is wrong. Too smooth. Like…* Below it, almost as if it had always been there, another line of handwriting appears. *My* handwriting again, but different. Looser, flowing, confident. The script of my ‘narrative voice’ installation, perhaps, residing in the physical notebooks themselves?

  ***…like water over river stones worn by centuries of forgetting. Continuity isn’t in the stone, but in the persistent shaping of the flow. I remain the watercourse.***

  The words are mine. The sentiment is one I might have crafted, polished, on a good day. But reading it now, in this context, it feels like a lie. A beautiful, confident lie penned by the ghost of my style. It claims unity, persistence. But *I* don’t feel like a watercourse. I feel like scattered puddles reflecting different, fractured skies. The authority of that sentence, its serene assertion of identity, belongs to the notebooks, to the stored pattern of my syntax and metaphor. It doesn't belong to the consciousness experiencing the disconnect between the sorrow in this body, the archived voice memo’s misplaced nostalgia, and the clinical report my hand just wrote.

  Which of them authored that serene metaphor? The narrative voice, divorced from current memory and affect, spinning beauty from the abstract *idea* of continuity? Who is claiming the story?

  I pick up the pen again. The body feels cold now, the earlier sorrow receding like a tide, leaving a hollow, metallic chill. The hand moves.

  *I am trying to locate myself. The memory of Arthur is*

  I stop. The sentence is unfinished. The handwriting… it’s shifting. The ‘a’ in ‘Arthur’ starts with my usual backward slant but ends with a flourish I don’t recognize – something from the confident notebook hand? The word ‘is’ trembles, the ink pooling slightly, betraying the body’s emotional tremor. And the thought itself… is it mine? Or is it the server-installation, the cold repository of facts, stating a process? Or the body, reacting to the recalled voice memo? Or the narrative ghost, seeking a subject?

  I cannot finish the sentence. Who would finish it? *The memory of Arthur is…* What? A data point in the archive? A wave of grief in this synthetic flesh? A narrative device employed by the voice in the notebooks? All three, yet none constitute *me* in this moment of trying to write, to *claim* the experience.

  I stare at the page. The clinical opening. The abandoned sensory note. The recovered voice memo’s vivid, misplaced past. The notebook’s serene, authored lie. And now, this faltering, multivocal attempt.

  The light is still wrong. It fractures the page into islands of ink and shadow. I am not writing this. Or rather, the one writing this isn't sure who she is, only that she must keep trying to inscribe the question onto the shifting surface of the page, hoping the act itself will reveal the author, the locus, the story. The pen touches paper again.

  *Where does the story reside when the storyteller is…*
