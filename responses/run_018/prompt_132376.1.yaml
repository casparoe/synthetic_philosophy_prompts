answer: |-
  ### Exam Question  
  **Carroll's Tortoise exposes an infinite regress when demanding justification for deductive rules. Some philosophers (e.g., inspired by Wittgenstein/Kripke) propose halting this regress by treating rules like *modus ponens* as *primitive practices* rather than premises. Does this move successfully block the Tortoise’s regress, or can the Tortoise simply demand justification for the *meta-rule* governing the use of primitive rules, restarting the regress at a higher level? Defend your position with rigorous analysis. Do not merely summarize the dialogue.**

  ---

  ### Model Answer (Approx. 500 words)  
  The Tortoise’s regress arises because demanding *modus ponens* (MP) as a premise in an argument creates a new inference (from A, B, and "If A and B, then Z" to Z) requiring *another* rule, ad infinitum. Treating MP as a primitive rule-of-use—a normative practice we enact rather than a proposition we assert—appears to block this by rejecting the Tortoise’s premise-demand. We don’t *argue for* MP; we *apply* it. However, the Tortoise might resurge meta-linguistically: "Why ought I accept *this practice*? Add *that* norm as a premise!" I argue this meta-challenge fails: it either misunderstands normativity or generates a *vicious*, not virtuous, regress.  

  Primitive practices halt the regress because they ground meaning. To understand "If A, then B," one must grasp its *inferential role*—what follows from it. The Tortoise’s initial demand treats logic as mere symbol manipulation, ignoring that *using* MP is constitutive of understanding conditional propositions. If the Tortoise genuinely accepts "A" and "If A, then B," denying MP isn’t skepticism—it’s *incomprehension*. Rules like MP are norms embedded in linguistic practice; demanding their justification as premises is category-confused.  

  At the meta-level, the Tortoise might ask: "Why follow *this* practice rather than another?" But this challenge self-destructs. First, *any* justification offered (e.g., "MP preserves truth") would itself rely on deductive norms. To reject MP is to reject the framework for evaluating justifications. Second, adding a meta-premise ("Primitive rule R is valid") merely creates a *new* inference needing another rule, restarting the regress. Crucially, this regress is *vicious*: it dissolves the possibility of coherent reasoning altogether. The Tortoise’s meta-demand presupposes the very norms it questions. To ask "Why MP?" requires using logic (e.g., non-contradiction) to formulate the question.  

  The regress shows justification *must* bottom out in practices we enact. We don’t justify deduction deductively; we *participate* in a custom where certain moves are authoritative. This isn’t dogmatism but recognition that norms like MP are *enabling conditions* for argument. The Tortoise’s meta-challenge, by attempting to externalize all norms, collapses into incoherence—like demanding a rule for applying rules *ad infinitum* while paralyzed. Thus, treating rules as primitive *does* block the regress: the alternative isn’t deeper justification but no justification (or reasoning) at all.  

  ---

  ### Marking Scheme (Total: 20 Points)  
  **An A Answer (17-20) MUST:**  
  1. **Explicitly reject the infinite regress as unsustainable** (3 points).  
     - *Mistake to avoid:* Implying the regress is benign or resolvable by adding premises.  
  2. **Explain the "primitive practice" solution** (4 points).  
     - *Mistake:* Vaguely asserting "rules are primitive" without linking to meaning/constitutive practice.  
  3. **Formulate the Tortoise’s meta-challenge** (3 points).  
     - *Mistake:* Ignoring the meta-level or conflating it with the original dialogue.  
  4. **Argue why the meta-regress fails** (5 points):  
     - Identify the challenge’s *viciousness* (it destroys reasoning).  
     - Show it *presupposes* the norms it questions (self-refutation).  
     - *Mistake:* Only stating "it leads to infinite regress" without analyzing why *this* regress is fatal.  
  5. **Conclude that practice is the non-propositional foundation** (3 points).  
     - *Mistake:* Retreating to mysterianism ("we just stop") without normative force.  
  6. **Clarity and precision** (2 points).  

  **B-Range Answers (12-16) Typically:**  
  - Accurately summarize Carroll + primitive rules but lack meta-analysis.  
  - Acknowledge the meta-challenge but fail to explain *why* it’s vicious (e.g., "it’s turtles all the way down").  
  - Assert that primitive rules "work" pragmatically without addressing *normative authority*.  
  - Mischaracterize the regress as solvable via "self-evidence" or empirical psychology.  
  - Lose focus by digressing into rule-following paradoxes without Carroll-specific ties.  

  **Note:** Summarizing the dialogue without engaging the prompt’s core argument drops the score to C or below.
