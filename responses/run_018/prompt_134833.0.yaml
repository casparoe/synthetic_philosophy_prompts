  So we have:

  - CDT: accept
  - EDT: accept
  - UDT: decline

  The key feature is that UDT chooses the policy in advance without conditioning on the observation (the offer). It realizes that by committing to decline, you increase the chance of getting the gold endorsement (which is very valuable), even though when you get the offer, declining seems to leave money on the table.

  Now, to answer the last part: if we remove the public algorithm and just make it a hidden prediction, then the committee is not using your policy but predicting based on other factors. Then it becomes like Newcomb's problem. Specifically, if the prediction is hidden and not based on your algorithm, then UDT would update on the offer and might act differently? Actually, in standard UDT, even if the prediction is hidden, UDT still chooses the policy that maximizes expected utility over the possible predictions. But without the algorithm being public, the committee's prediction is not based on your policy, so your policy choice doesn't affect the prediction. Then it collapses to a regular decision problem.

  In this case, without the public algorithm, the committee's prediction is independent of your actual policy. Then:

  - The probability of getting gold and scholarship is fixed, say P. Then when you get the offer, you should accept because it gives more utility.

  But if the prediction is based on your policy (because they know your policy via the algorithm), then your policy choice affects the probability of being offered. That's what makes it Newcomb-like.

  So, if we remove the public algorithm and just have a hidden prediction that is not based on your decision rule, then it collapses to a regular decision problem where CDT, EDT, and UDT would all agree on accepting if offered (because the offer is made and your action doesn't affect the prediction).

  Therefore, the public algorithm (which lets the committee simulate your decision rule) is essential for the UDT split.

  Key feature: **commitment to a policy without updating on the observation**

  But we also note the dependence of the committee's action on the policy.

  Final scenario in one paragraph:

  You're up for the Horizon Scholarship and a Future Leader Endorsement. The committee awards the scholarship only if they predict you'll decline it, and then gives a gold endorsement; if they predict you'll accept, they don't award the scholarship and give a silver endorsement. The gold endorsement is worth $500k in future earnings, silver $200k, and the scholarship $100k. The committee reviews your public decision algorithm to predict your choice with 90% accuracy. You receive the scholarship and gold endorsement. Now, if you accept, you get $600k; if you decline, $500k. CDT and EDT both say accept because the money is there. But UDT says: commit to declining in advance, because that policy gets you the gold endorsement 90% of the time, which averages $470k, while the accept policy only averages $240k. So when offered, UDT walks away (declines) to stick to the optimal policy.

  The exact feature that makes UDT peel off is that it chooses a policy without conditioning on the observation (the offer), and it realizes that committing to decline makes the committee more likely to give the valuable gold endorsement.

  If we remove the public algorithm and just have a hidden prediction, then the committee's action doesn't depend on your actual decision rule, so it collapses to a regular problem where conditioning on the offer is appropriate.

  \answer{Policy commitment without updating on observations}
answer: |-
  Okay, imagine this: You apply for the "Future Innovators Grant" – a $10k scholarship plus a golden "Top Talent" badge on your professional profile. The selection committee is made up of super-sharp alumni who stalked your public GitHub. They saw your *exact* decision algorithm posted there (oops). Their rule: **They only award the grant if they predict you'll *decline* it.** Why? They believe students who don't "need" the grant (i.e., are confident enough to walk away) build more successful startups and make them look good later. If they predict you'll accept, you get nothing – not even the badge. They're not psychic, but because they studied your code and past choices, they're 90% accurate predictors.  

  You get the email: "Congratulations! You've been awarded the Future Innovators Grant and the Top Talent badge!" This means they predicted you'd decline. Now you decide: **Accept** (take the $10k + badge) or **Decline** (get $0 + badge).  

  **Why CDT and EDT both say "TAKE IT" (Accept):**  
  - **CDT (Causal Dude Thinking):** "The committee's prediction is done. My choice *now* doesn't *cause* their past decision. If I accept, I get $10k + the badge. If I decline, I get $0 + the badge. $10k > $0, so I'm grabbing that cash!"  
  - **EDT (Evidence Detective Thinking):** "Okay, getting the offer *is evidence* they predicted decline. If I accept, it means they were *wrong* (which is rare, 10% chance). But the badge is already on my profile, and the money’s in the offer. Rejecting would just throw away $10k for no reason. I’m taking the cash—it’s literally in my inbox!"  

  **Why UDT (Updateless Decision Theory) says "WALK AWAY" (Decline):**  
  UDT doesn’t care about the email in your inbox. It asks: "What decision *rule* should I have pre-committed to, *before* knowing the outcome, to max my overall win?" It simulates both policies:  
  - **Policy A: "Accept if offered."**  
    The committee predicts this 90% of the time → No grant/badge.  
    10% of the time they screw up, predict decline → You get $10k + badge.  
    *Average value: 0.9×$0 + 0.1×$10k = $1k.*  
  - **Policy D: "Decline if offered."**  
    The committee predicts this 90% of the time → You get the badge (worth say $50k in future opportunities) + $0.  
    10% of the time they screw up → No badge, no cash.  
    *Average value: 0.9×$50k + 0.1×$0 = $45k.*  

  Policy D (Decline) crushes Policy A ($45k vs. $1k). So UDT pre-commits to declining. Even when the offer lands, UDT *sticks to the rule* and walks away, because **the real jackpot is the badge, and you only get it if they predict you’ll decline**. If you accept *now*, you get short-term cash but sabotage the policy that made the badge likely in the first place.  

  **The exact feature that makes UDT peel off?** It ignores the "update" from seeing the offer (i.e., the evidence that you *were* predicted to decline). Instead, it optimizes the *whole strategy* from the start, letting your pre-commitment influence the predictor’s behavior. CDT/EDT get distracted by the shiny $10k in front of them; UDT plays the long game.  

  **If you make the prediction hidden (no public algorithm)?**  
  Yep, total collapse into Newcomb’s. If the committee predicts *without* seeing your decision rule (e.g., using grades or essays), your choice can’t influence their prediction. UDT then updates on the offer like everyone else and says "take the money" – it becomes a standard one-box scenario. The public code is key!  

  \answer{Precommitment ignoring the observation update}
