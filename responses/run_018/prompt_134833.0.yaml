  Therefore, the expected utility of Policy A is: 10% chance of getting the scholarship (and then accepting it) * value of scholarship.

  The expected utility of Policy D is: 0.

  So UDT would choose Policy A (accept if offered) because it gives a 10% chance of getting the scholarship, while Policy D gives 0.

  But wait, that's the same as CDT and EDT. We wanted UDT to say "walk away", meaning decline.

