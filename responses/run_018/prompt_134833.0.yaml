  build me a realistic case - maybe a scholarship or job offer - where causal decision theory and evidential decision theory both say "take it" but updateless decision theory says "walk away". the predictor is just a sharp human committee who read your open-source decision algorithm that you posted online; theyre not omniscient or perfect. stakes should be normal life stuff, no quantum computers, aliens, or brain-in-vat scenarios. keep the scenario to one paragraph.

  then explain: why do CDT and EDT agree on taking it? why does UDT split off and say reject? point out the exact feature that makes UDT peel off. also tell me: if i remove the part where your reasoning trace is public and just make it a hidden prediction, does it definately collapse back into a regular Newcomb problem?

