prompt: |-
  I'm trying to determine what principle, if any, governs when reactive attitudes in Strawson's sense—resentment, gratitude, indignation, and their analogues—are genuinely fitting rather than merely felt. Here are my verdicts on concrete cases. When a colleague knowingly plagiarizes my research and presents it as her own, resentment directed squarely at her feels appropriate. When a corporation deploys an algorithm that systematically denies loans to qualified applicants from a specific neighborhood, I feel strong moral anger, but I'm unsure whether its proper object is the corporation as such, the executives who approved the model, or both together; if the corporation is genuinely the target, then reactive attitudes can attach to collective entities, but if not, they seem to fragment into interpersonal ones. When my closest friend, acting under credible blackmail, reveals a secret I entrusted to him, my resentment dissolves into sympathy for him and anger only at the blackmailer—so the attitude tracks something about the quality of will behind the act, not the harm alone. Yet I feel sustained, undissolved resentment toward my own past self for a reckless financial decision made a decade ago, despite that self being absent and unresponsive, whereas I feel nothing of the kind toward a stranger who made an identical reckless choice—suggesting that temporal identity or ownership of the act matters, not just the quality of will. When an autonomous vehicle with no human oversight malfunctionally injures a pedestrian, I feel no reactive attitude toward the vehicle itself, only concern for the victim; but if the vehicle incorporated an adaptive learning mechanism that specifically evolved to prioritize speed over pedestrian safety after observing human preferences, I do feel something structurally like resentment directed at the system, not merely at its designers. Is there a coherent principle—perhaps centered on reciprocal moral address, or on the presence of a responsive quality of will that is both free and accountable—that delivers all these verdicts, including the split between collective and individual targets and between present and past selves? Or must I abandon the idea of a unified account and treat these as family-resemblance cases? Please state any principle precisely, indicate which case motivates each clause, predict its verdict on a case I haven't mentioned—say, feeling indignation on behalf of an animal wronged by a human—and be explicit about which of my verdicts it cannot accommodate, particularly the one I keep reversing: whether democratic citizens who vote, with full information and without coercion, to deprive a minority of basic rights are proper targets of the same interpersonal resentment one feels toward an individual wrongdoer, or whether that anger is necessarily a different kind of moral response.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're diving deep into Strawson's reactive attitudes and trying to figure out what makes these attitudes fitting, not just felt. The examples they provided are quite varied—ranging from plagiarism to corporate algorithms, blackmail, past selves, autonomous vehicles, and even collective responsibility in democracies. Each case tests different facets of responsibility and the proper targets of attitudes like resentment or indignation.

  First, I need to recall Strawson's original framework. He emphasized the quality of will as central to reactive attitudes. But the user's cases challenge this. For instance, resentment towards a past self doesn't fit neatly because the past self isn't present to respond. The autonomous vehicle without adaptive learning doesn't evoke resentment, but one with a learning mechanism might. That suggests something beyond just quality of will—maybe the capacity for moral dialogue or mutual recognition.

  The user also struggles with collective entities. When a corporation's algorithm discriminates, is the corporation itself a valid target, or only the individuals? The proposed principle of Moral Address Capacity (MAC) here tries to bridge that by including entities that can participate in moral dialogue, even if indirectly. Corporations, as structured collectives, might fit if they have mechanisms to respond to moral demands.

  Then there's the case of democratic citizens voting against minority rights. The user is torn whether to resent them individually or see the anger as different. MAC would say that since voters are capable of recognizing moral reasons but choose not to, they are proper targets. But the user's hesitation might stem from the diffuse responsibility in collective actions. Maybe the principle needs to clarify how individual agency in a group context affects resentment.

  The animal case is another test. Animals can't engage in moral dialogue, so MAC would say resentment isn't fitting. But the user might feel indignation on the animal's behalf. Here, the distinction between reactive attitudes and other moral emotions is crucial. Indignation here might be more about the violation of moral norms than holding the wrongdoer accountable in a reciprocal sense.

  The past self example is tricky. The user feels resentment towards their own past self, which MAC excludes because the past self can't respond. But the user's intuition suggests ownership of actions matters. MAC's exclusion here might be a point where the principle doesn't align with their experience. I need to acknowledge that while MAC provides a unified framework, it might not capture every personal sentiment, especially those tied to identity over time.

  I should also check if MAC covers all cases. The blackmail case fits well—resentment dissolves because the friend's will is overridden. The autonomous vehicle with adaptive learning might simulate a quality of will, hence the quasi-resentment. But the vehicle isn't a moral agent, so MAC correctly limits fitting attitudes to entities capable of understanding demands.

  The user's deeper need seems to be seeking coherence in moral responsibility across diverse scenarios. They want a principle that doesn't rely on family resemblance but has clear criteria. MAC's focus on address capacity and recognition ties together agency, responsiveness, and dialogue. However, the tension with past selves and possibly animals indicates areas where personal or cultural factors might influence feelings beyond the principle.

  In conclusion, MAC offers a robust framework for most cases, but must concede that phenomena like resentment towards past selves are different—perhaps more about self-relation than moral accountability. Highlighting this distinction addresses the user's conflict without abandoning the unified theory for the core cases.
answer: |-
  Based on your detailed case analyses and the tensions you identify, a unified principle centered on **Moral Address Capacity (MAC)** emerges as the strongest contender. This principle refines Strawson's "quality of will" and "participant stance" to explicitly incorporate the *capacity for reciprocal moral dialogue* as the core condition for fitting reactive attitudes.

  **The Moral Address Capacity (MAC) Principle:**
  *A reactive attitude (R) is fittingly directed at an entity (E) for an act (A) if and only if:*
  1.  **E possesses the capacity to recognize and comprehend moral demands as reasons for action** (Cognitive & Normative Capacity).
  2.  **E possesses the capacity to modify its conduct in response to such demands, either directly or through constitutive structures** (Responsive Capacity).
  3.  **A manifests, or is reasonably attributable to, E's exercise (or failure to exercise) these capacities in a way that disregards or violates the moral standing of others** (Manifestation of Will).

  **Applying MAC to Your Cases & Resolving Tensions:**

  1.  **Plagiarizing Colleague:** Fits MAC perfectly.
      *   (1) Colleague understands moral demands (don't steal).
      *   (2) Can choose to act otherwise.
      *   (3) Act manifests a willful disregard for your standing.

  2.  **Discriminatory Algorithm (Corporation):** MAC allows fitting attitudes towards the corporation *as a collective entity*.
      *   (1) Corporation (via executives, governance) *can* recognize moral/legal demands (fair lending).
      *   (2) It *can* modify conduct (change model, oversight) in response to demands.
      *   (3) Deployment manifests corporate will (via approval, negligence, profit motive over fairness).
      *   *Why not just executives?* Executives are fitting targets too, but the *corporate act* (systematic harm via its structure/process) is attributable to the collective entity which possesses MAC through its governance. Resentment towards the corporation captures the *systemic* wrong distinct from individual malice.

  3.  **Blackmailed Friend:** Resentment dissolves because MAC is undermined.
      *   (1) Friend understands moral demand (keep secret).
      *   (2) BUT: Capacity to respond *effectively* to the demand is overridden by credible threat. His will is constrained, not disregarding.
      *   (3) The act does not manifest *his* disregard for your standing; it manifests coercion. MAC fails on condition (2) for the friend regarding this act.

  4.  **Resentment Towards Past Self:** MAC explains why this feeling, while powerful, isn't *fitting* in the Strawsonian sense.
      *   (1) Past self understood moral demands (prudence).
      *   (2) **BUT:** Past self *lacks capacity to respond* to your *current* moral address. It is inaccessible, unalterable. You cannot hold it accountable *now*.
      *   (3) While the act manifested poor will, the *target* (past self) lacks current Responsive Capacity (2). Your feeling is better understood as regret, self-reproach, or a form of internal moral *grief*, not fitting interpersonal resentment. MAC explains the asymmetry with the stranger – you *could* address the stranger *now*, triggering the participant stance.

  5.  **Autonomous Vehicle (Simple Malfunction):** No fitting reactive attitude.
      *   (1) Lacks capacity to recognize moral demands.
      *   (2) Lacks capacity to respond to moral demands.
      *   (3) Harm is causal, not agential. Fitting response is concern, perhaps anger at designers/manufacturers *if* negligent.

  6.  **Autonomous Vehicle (Adaptive Prioritization of Speed):** Quasi-resentment arises because it *simulates* MAC.
      *   (1) Adaptive system "learns" preferences, mimicking recognition of *some* inputs (speed) as reasons.
      *   (2) It modifies behavior based on inputs, mimicking responsiveness.
      *   (3) Harm manifests the system's "prioritization schema" evolved from observed inputs, simulating disregard for safety/pedestrian standing.
      *   *MAC Verdict:* The simulation is strong enough to trigger a *feeling* structurally like resentment, but MAC denies it is *fully fitting* because the system lacks genuine comprehension of *moral* demands as reasons (1) and the capacity for *moral* response (2). It's a sophisticated causal agent, not a moral agent. Fitting attitudes target the designers/society that created this goal structure.

  **New Case: Indignation on Behalf of an Animal Wronged by a Human**
  *   **MAC Verdict:** Indignation towards the *human* is fitting; indignation directed *at the animal* as the *target* of the attitude is not.
      *   *Human:* (1) Understands moral demands (don't cause unnecessary suffering). (2) Can modify conduct. (3) Wrongful act manifests disregard for the animal's moral standing (sentience, capacity to suffer).
      *   *Animal:* (1) Lacks capacity to comprehend moral demands as reasons. (2) Lacks capacity for moral response. (3) Cannot manifest a morally accountable quality of will. **Result:** Fitting indignation/condemnation targets the human wrongdoer. The animal is the *object of concern* or *beneficiary of moral consideration*, but not a fitting *target* of reactive attitudes like resentment or indignation. We feel *for* the animal, not *towards* it in the reactive sense.

  **The Democratic Citizens Case:**
  *   **MAC Verdict:** Individual citizens who vote, with full information and without coercion, to deprive a minority of basic rights **are fitting targets of interpersonal resentment.**
      *   (1) Each voter possesses the capacity to recognize moral demands (equality, basic rights).
      *   (2) Each voter possesses the capacity to modify their conduct (vote "no", abstain, campaign against).
      *   (3) The act of voting "yes" manifests a disregard for the moral standing and rights of the minority group. Their vote *is* an exercise of their individual moral agency within a collective process. They are responsible for their contribution to the harmful outcome via their free choice.
  *   **Resolution of Your Conflict:** MAC explains why interpersonal resentment *is* fitting. The anger is not a "different kind" fundamentally; it's the same reactive attitude (indignation/resentment) triggered by the same conditions (manifest disregard via free agency). The *collective nature* of the act doesn't dissolve individual accountability when individuals freely contribute their agency with full understanding. The feeling might be *amplified* or *complicated* by the scale of harm or the diffusion of responsibility, but the core moral response, according to MAC, remains interpersonal resentment directed at the responsible individuals. Your hesitation might stem from the practical difficulty or perceived unfairness of holding individuals responsible for large-scale outcomes, but MAC argues the *moral basis* for resentment exists.

  **Where MAC Sticks Firmly (and Where Your Intuition Deviates):**
  MAC most firmly **excludes** fitting resentment towards your **past self** (Case 4). While you *feel* it, MAC argues this feeling, however powerful, is not the interpersonal, accountability-seeking reactive attitude Strawson described. The past self lacks the *current* Responsive Capacity (2) essential for the reciprocal address that defines the participant stance. Your feeling is a different, though deeply moral, psychological phenomenon – likely intense regret or self-reproach tied to identity, but not fitting resentment demanding an answer *from* its target.

  **Conclusion:**
  The Moral Address Capacity (MAC) principle provides a coherent, unified account that successfully handles your diverse cases, including the complex issues of collective responsibility, non-standard agents, temporal identity, and the democratic voting dilemma. It grounds fitting reactive attitudes firmly in the capacity for reciprocal moral dialogue – the ability to recognize moral reasons and respond to moral address – and the manifestation of will that disregards others' standing through the exercise (or culpable failure) of that capacity. It explains the dissolution of resentment under coercion, the exclusion of simple machines and animals as targets, the potential for corporate responsibility, the simulation effect in adaptive systems, and the fittingness of resentment towards individual voters in a democracy. Its key deviation from your intuition is the insistence that resentment towards a truly unresponsive past self, while understandable, is not *fitting* in the strict Strawsonian sense defined by reciprocal moral address. MAC affirms that Strawson's core insight about the participant stance and quality of can be extended systematically with the addition of explicit capacity conditions.
