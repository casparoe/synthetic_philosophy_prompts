answer: |-
  Here's a comparative analysis of mnemonic sovereignty and documentary correction, centered on the challenge of refractive commemoration, with clear assessment of their capacities to handle constitutive identity divergence and their normative stakes:

  **Core Theses Defined:**

  1.  **Mnemonic Sovereignty:** Living collective memory, embodied in a community's rituals, narratives, and shared understanding, holds ultimate *normative* authority over the meaning and significance of the past. When collective memory diverges from the archival/historiographical record, the former dictates how the past *should* function within the community's present identity and social bonds. It prioritizes the *social function* of memory.
  2.  **Documentary Correction:** Archival records, historical evidence, and critical historiography provide the objective standard against which collective memory must be judged. When divergences occur, the documentary record possesses the authority to *correct* the collective memory. It prioritizes *epistemic accuracy* about the past.

  **Refractive Commemoration: The Crucial Phenomenon**

  *   **Definition:** This occurs when a community's commemorative practices (rituals, stories, symbols) do not simply contain factual errors about a past event, but fundamentally **reinterpret its causal chains and moral valences** to serve present-day social cohesion, identity formation, or political needs. The "refraction" actively bends the light of the past to serve contemporary functions.
  *   **Key Characteristic:** An accurate historiographical correction wouldn't just update a fact; it would **dissolve the core meaning** sustaining the commemorative practice and the social bond/identity it underpins. The divergence is *functional* and *constitutive*, not merely erroneous.
  *   **Example:** A community ritual commemorating a historical defeat as a heroic sacrifice necessary for national awakening and unity. Archival research might reveal the defeat stemmed primarily from internal disarray or flawed leadership, not noble sacrifice. Correcting the record to emphasize the chaos undermines the narrative of unifying sacrifice central to the ritual and the national identity it reinforces.

  **Accommodating Constitutive Divergence:**

  1.  **Mnemonic Sovereignty:**
      *   **Accommodates:** This thesis **readily accommodates** refractive commemoration. It views such reinterpretations not as malfunctions, but as the *essential mechanism* through which communities actively construct and maintain their identities across time. The "bent" narrative *is* the functional truth for the community's self-understanding and social cohesion. Factual divergence is irrelevant if the memory serves its normative purpose of binding the community and providing meaning. The constitutive element *is* legitimate under this view.
      *   **Reasoning:** Sovereignty inherently values the *social utility* and *identity-constituting power* of memory above strict correspondence with the archival record. Refractive commemoration exemplifies this process.

  2.  **Documentary Correction:**
      *   **Accommodates:** This thesis **cannot accommodate** refractive commemoration as a legitimate form of divergence. It sees *any* deviation from the best historiographical evidence as a "malfunction" – an epistemic failure requiring correction. The constitutive function achieved through refraction is irrelevant, or even dangerous, if built on factual inaccuracy. The social bond sustained by the erroneous narrative might be deemed *illegitimate* or harmful if it depends on falsehood.
      *   **Reasoning:** Its core principle is epistemological fidelity. A constitutive divergence achieved through factual distortion is seen as a flawed foundation for identity, regardless of its social benefits. Correction is mandatory.

  **Normative Stakes Assessed:**

  1.  **Mnemonic Sovereignty:**
      *   **Epistemic Relativism Risk:** **Yes, this is a significant risk.** Granting sovereignty to collective memory entails relativism regarding the *meaning and significance* of the past. Different communities can hold radically different, even contradictory, interpretations of the same event as "true" *for them*, regardless of the documentary evidence. There is no external, evidence-based arbiter of meaning. The "truth" of the past's significance becomes relative to the community practicing remembrance.
      *   **Social Goods Protected:** **Yes, it actively protects them.** It safeguards the vital social goods created and sustained by communal remembrance – social cohesion, shared identity, moral frameworks, collective agency, cultural continuity, and the existential meaning derived from a shared past. It recognizes that these goods are often built precisely *on* narratives refracted through the lens of present needs, not cold archival facts.

  2.  **Documentary Correction:**
      *   **Epistemic Relativism Risk:** **No, it explicitly rejects relativism.** It upholds a single, evidence-based standard for understanding the past. This provides a potential common ground for dialogue between communities based on shared facts, however contested the interpretations might be.
      *   **Social Goods Destroyed Risk:** **Yes, this is a significant risk.** Insisting on documentary correction in cases of refractive commemoration can be profoundly destructive. It risks dissolving the very social bonds, identities, and sources of meaning that the commemorative practice sustains. Applying correction can feel like an attack on the community's core identity, leading to resistance, fragmentation, and the loss of irreplaceable social cohesion and cultural heritage. It prioritizes factual accuracy even if the cost is social disintegration or the erasure of meaning for a group.

  **Conclusion:**

  The tension between these theses is starkly revealed by **refractive commemoration**. Mnemonic sovereignty **embraces** this phenomenon as the legitimate, constitutive work of community identity formation, prioritizing social goods but accepting epistemic relativism regarding meaning. Documentary correction **rejects** refractive commemoration as a correctable malfunction, prioritizing epistemic accuracy and a single standard of historical truth, but risking the destruction of the social goods and identities built upon refracted narratives.

  *   **Which accommodates constitutive divergence?** Mnemonic Sovereignty.
  *   **Which mandates correction?** Documentary Correction.
  *   **Epistemic Relativism?** Sovereignty entails it; Correction rejects it.
  *   **Risk to Social Goods?** Sovereignty protects them; Correction risks destroying them in cases of refractive commemoration.

  Ultimately, the choice between these theses reflects a deeper philosophical and political dilemma: whether the primary value of engaging with the past lies in its objective accuracy (Documentary Correction) or in its functional role in sustaining meaningful communities in the present (Mnemonic Sovereignty). Refractive commemoration forces this dilemma into sharp relief. Neither position offers a comfortable resolution; each entails significant normative costs.
