answer: |-
  Edwin Jaynes here. Your lattice variant is clever, but it fundamentally misunderstands the role of symmetry and the principle of indifference in resolving Bertrand's paradox. The point isn't that the *continuum* magically dissolves ambiguity; it's that the *physical symmetries of the problem* dictate the unique invariant measure under which indifference must be applied. Your discrete lattice doesn't refute this—it changes the symmetries of the problem itself, and thus changes the relevant invariant measure. Let me dissect this carefully.

  First, recall the core of my resolution for the continuous circle: the problem statement "a random chord" implies rotational and translational invariance. This uniquely selects the measure uniform in radial distance from the center (or equivalently, uniform in the direction of the chord and uniform in its perpendicular distance from the center), yielding 1/2. The other methods (angular bins or chord-length bins) violate rotational invariance by imposing a distinguished point or direction. The continuum isn't the savior; the symmetry group is.

  Now, your triangular lattice. By discretizing, you've *broken* the continuous rotational symmetry. The lattice has a *finite* rotational symmetry group—likely 60 or 120 degrees depending on orientation—and discrete translational symmetries. Crucially, this lattice has a *distinguished set of directions* inherent to its grid structure. If you now naïvely apply the same three parameterizations from the continuous case—binned by endpoint radius, angular sector, or chord length—you'll get different probabilities precisely because these parameterizations do *not* respect the *remaining* symmetries of the lattice. You're forcing the continuous problem's flawed methods onto a discrete structure that has different invariants. 

  The correct application of indifference here isn't to mimic the continuous parameterizations but to apply uniformity under the lattice's *actual symmetry group*. You must define chords by endpoints on lattice points and assign equal probability to each distinct chord *that cannot be mapped onto another by the lattice's rotational/translational symmetries*. In other words, count distinct chord types under the automorphisms of the lattice. The "random chord" probability should be derived from a measure uniform over the orbits of the lattice's symmetry group acting on the set of possible chords. 

  If you do this rigorously—accounting for the lattice's reduced symmetry—you will get a *single, consistent probability* for the chord length exceeding the inscribed triangle's side. It will not be 1/3, 1/2, or 1/4; it will be a value determined by the lattice's specific geometry and its invariant measure. The apparent contradiction vanishes because you're no longer imposing arbitrary, symmetry-breaking binning methods. You're respecting the indifference principle *as it applies to the symmetries actually present*.

  Your objection that real measurements lack a continuum is a red herring. Any physical system has noise, finite resolution, or quantum uncertainty that effectively restores approximate continuity and rotational invariance at the scale of measurement. But even in a perfectly discrete lattice, the paradox dissolves when you correctly identify the invariant measure under the *available* symmetries. The principle stands: ambiguity arises from imposing measures that break the problem's inherent symmetries. The resolution lies in respecting those symmetries—whether continuous or discrete—through the transformation group defining indifference. The lattice case doesn't undermine this; it reinforces it by showing how the symmetry group dictates the measure. Your variant only "fails" if you insist on misapplying the continuous symmetries to a discrete structure that doesn't support them. That's not a flaw in the invariant measure resolution—it's a flaw in the misapplication of the method.
