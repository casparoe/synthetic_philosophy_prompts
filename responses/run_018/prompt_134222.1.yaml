  ### Death Definition Taxonomy: Decision Tree  
  *Designed to sort by case judgments rather than labels. Navigate by answering concrete questions.*  

  **Root Node:**  
  When a human body is decapitated and maintained by mechanical perfusion for organ preservation (circulation/respiration artificially sustained, no brain present), is the organism biologically alive?  
  - **Yes** → Proceed to Node 1A  
  - **No** → Proceed to Node 1B  

  ---

  #### Node 1A (Root = Yes)  
  In a brain-dead body sustained on ECMO with spontaneous cardiac contractions and gas exchange (no brain function, circulation artificially stabilized), is the organism biologically alive?  
  - **Yes** → **Leaf: Strict Circulatory Criterion**  
    *Awkward commitment: Must classify the decapitated perfused body and the ECMO-sustained brain-dead body as equally alive.*  
  - **No** → **Leaf: Incoherent Branch** (Fails to explain why brain absence preserves life but brain destruction does not.)  

  #### Node 1B (Root = No)  
  In an anencephalic newborn (intact brainstem reflexes and spontaneous breathing, no cerebral cortex), is the organism biologically alive?  
  - **Yes** → Proceed to Node 2A  
  - **No** → Proceed to Node 2B  

  ---

  #### Node 2A (1B = Yes)  
  In a persistent vegetative state patient (intact hypothalamic/brainstem homeostasis, no cortical responsiveness), is the organism biologically alive?  
  - **Yes** → Proceed to Node 3A  
  - **No** → Proceed to Node 3B  

  #### Node 2B (1B = No)  
  In a brain-dead body (no brain function, sustained on ECMO with spontaneous cardiac activity), is the organism biologically alive?  
  - **Yes** → **Leaf: Incoherent Branch** (Accepts brain absence as fatal but not brain destruction, despite identical functional loss.)  
  - **No** → Proceed to Node 3C  

  ---

  #### Node 3A (2A = Yes)  
  In a brain-dead body, is the organism biologically alive?  
  - **Yes** → **Leaf: Incoherent Branch** (Denies decapitation preserves life but asserts brain destruction does.)  
  - **No** → **Leaf: Whole-Brain or Disjunctive Legal-Pragmatic Criterion**  
    *Awkward commitment: Must classify the anencephalic newborn and the PVS patient as alive despite irreversible loss of consciousness.*  

  #### Node 3B (2A = No)  
  In a brain-dead body, is the organism biologically alive?  
  - **Yes** → **Leaf: Incoherent Branch** (Demands cortical function for life in PVS/anencephaly but not in brain death.)  
  - **No** → **Leaf: Higher-Brain Criterion**  
    *Awkward commitment: Must classify the anencephalic newborn and the PVS patient as dead despite preserved spontaneous breathing and homeostasis.*  

  #### Node 3C (2B = No)  
  In a persistent vegetative state patient, is the organism biologically alive?  
  - **Yes** → **Leaf: Organismal Integration Criterion**  
    *Awkward commitment: Must classify the anencephalic newborn as dead and the PVS patient as alive, despite both lacking consciousness but differing only in developmental history.*  
  - **No** → **Leaf: Incoherent Branch** (Demands cortical function for life but rejects brainstem sufficiency, leaving no coherent biological basis.)  

  ---

  ### Logical Space of Answers (Scenarios A–D)  
  | **Combination** (C-B-D-A) | **Decapitated Perfused (C)** | **Anencephalic Newborn (B)** | **PVS Patient (D)** | **Brain-Dead on ECMO (A)** | **Status** | **Diagnosis** |  
  |----------------------------|------------------------------|------------------------------|---------------------|----------------------------|------------|---------------|  
  | Y-Y-Y-Y                    | Alive                        | Alive                        | Alive               | Alive                      | Occupied   | Strict Circulatory |  
  | Y-Y-Y-N                    | Alive                        | Alive                        | Alive               | Dead                       | Unoccupied | **Incoherent** (Brain absence preserves life, but identical circulatory support in brain death does not.) |  
  | Y-Y-N-Y                    | Alive                        | Alive                        | Dead                | Alive                      | Unoccupied | **Incoherent** (PVS death requires consciousness, but anencephaly life does not.) |  
  | Y-Y-N-N                    | Alive                        | Alive                        | Dead                | Dead                       | Unoccupied | **Incoherent** (See above; no consistent consciousness/circulation threshold.) |  
  | Y-N-Y-Y                    | Alive                        | Dead                         | Alive               | Alive                      | Unoccupied | **Incoherent** (Anencephaly death implies consciousness necessity, contradicted by PVS/brain-dead life.) |  
  | Y-N-Y-N                    | Alive                        | Dead                         | Alive               | Dead                       | Unoccupied | **Incoherent** (Brain death fatal but decapitation not, despite identical consciousness loss.) |  
  | Y-N-N-Y                    | Alive                        | Dead                         | Dead                | Alive                      | Unoccupied | **Incoherent** (Brain destruction preserves life but cortical absence does not.) |  
  | Y-N-N-N                    | Alive                        | Dead                         | Dead                | Dead                       | Unoccupied | **Incoherent** (Circulation sufficient only when brain absent? No biological basis.) |  
  | N-Y-Y-Y                    | Dead                         | Alive                        | Alive               | Alive                      | Unoccupied | **Incoherent** (Decapitation fatal despite circulation, but brain death not.) |  
  | **N-Y-Y-N**                | Dead                         | Alive                        | Alive               | Dead                       | **Occupied** | Whole-Brain or Disjunctive Legal-Pragmatic |  
  | N-Y-N-Y                    | Dead                         | Alive                        | Dead                | Alive                      | Unoccupied | **Incoherent** (PVS death requires consciousness, but brain-dead life contradicts it.) |  
  | N-Y-N-N                    | Dead                         | Alive                        | Dead                | Dead                       | Unoccupied | **Incoherent** (PVS death implies cortical necessity, but anencephaly life contradicts it.) |  
  | N-N-Y-Y                    | Dead                         | Dead                         | Alive               | Alive                      | Unoccupied | **Incoherent** (Brain-dead life conflicts with decapitation death despite identical integration loss.) |  
  | **N-N-Y-N**                | Dead                         | Dead                         | Alive               | Dead                       | **Occupied** | Organismal Integration |  
  | N-N-N-Y                    | Dead                         | Dead                         | Dead                | Alive                      | Unoccupied | **Incoherent** (Brain destruction preserves life but other consciousness/absence losses do not.) |  
  | **N-N-N-N**                | Dead                         | Dead                         | Dead                | Dead                       | **Occupied** | Higher-Brain |  

  **Special Attention to Combinations Accepting Brain Death as Death but Not Decapitation (e.g., Y-?-?-N):**  
  All such combinations (e.g., Y-Y-Y-N, Y-N-Y-N) are **incoherent**. They assert circulatory maintenance preserves life in decapitation (brain absence) but not in brain death (functionally identical circulatory maintenance), with no biological distinction between total brain absence and total brain destruction.  

  ---

  ### Collapsed Positions  
  The tree **collapses the Whole-Brain Criterion and Disjunctive Legal-Pragmatic Criterion** into a single leaf (N-Y-Y-N).  
  - **Why collapsed:** Both positions yield identical answers to scenarios A–D. The disjunctive criterion (death = circulatory cessation *or* whole-brain failure) treats brain death identically to whole-brain biological death in practice. The tree cannot distinguish them because they agree on all concrete cases (e.g., brain-dead body = dead, anencephalic newborn = alive, PVS = alive). Their divergence is purely metaphysical (e.g., "death" as biological vs. legal status) and not testable via case judgments.  

  The tree also **cannot separate "Brainstem-Only" and "Higher-Brain" variants** within the Higher-Brain leaf (N-N-N-N).  
  - **Why collapsed:** Both variants require cortical function for life and thus classify B and D as dead. They diverge only on whether brainstem functions (e.g., breathing) are *intrinsically* valuable (brainstem-only) or *instrumental* to consciousness (higher-brain). This distinction has no effect on case outcomes.
