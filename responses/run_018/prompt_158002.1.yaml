answer: |-
  ### A. The Scenario
  At Greenwood University, the Economics Department Chair denies Assistant Professor Chen her scheduled rotation teaching the popular "Behavioral Economics" course, despite a decade-old policy requiring equitable access to high-enrollment electives among tenure-track faculty. The Chair reassigns the course to a recently tenured ally, Dr. Vance, arguing that Vance's new research direction makes him a "better fit," though student demand ensures high enrollment regardless. Professor Chen, lacking tenure and influence, protests the violation of the rotation rule, while the Chair leverages his authority over promotion files and resource allocation. The established institutional rule—the rotation policy documented in department bylaws and consistently practiced—creates tension against the Chair's assertion of discretionary authority.

  ### B. The Three Verdicts
  1.  **Pascalian Conventionalist:** Justice requires upholding the established rotation policy and assigning the course to Chen. Custom (the long-standing rule and practice) defines justice here, sustained by the institutional force of faculty governance, bylaws, and the expectation of procedural fairness preventing departmental chaos and distrust. The Chair, despite current positional power, *is* institutionally "strong" only if he adheres to the stabilizing custom; violating it to favor an ally undermines the order he relies on, making him the *disordering* actor. Defending the weaker Chen upholds the convention.
  2.  **Natural-Rights:** Justice demands Chen teaches the course. Her pre-institutional entitlement to fair treatment and professional opportunity based on her employment contract and contribution exists independently of the rotation rule. The Chair's discretion, even if permitted by *some* rules, violates this fundamental entitlement to non-arbitrary treatment.
  3.  **Pure Might-Makes-Right:** The Chair, holding immediate authority over Chen's career prospects (promotion, resources) and Vance's allegiance, determines the outcome. His preference to assign the course to Vance *is* justice because he can enforce it. Chen's claim based on past rules is irrelevant; only present power matters.

  ### C. The Isolating Feature
  The reversal hinges on **distributed structural enforcement**. The "force" sustaining the custom isn't the Chair's personal power but the institutional machinery: the tenure review committee (which may frown on arbitrary rule-breaking), faculty senate oversight, historical grievance precedents, and the departmental culture of rule-following. These structures collectively empower the *rule* over any individual, including the Chair. If removed—leaving only the Chair's immediate personal power to reward or punish Chen/Vance with no institutional checks—the Pascalian view collapses. Without structural force, custom lacks authority, and the Chair's personal might *would* define justice conventionally (as the new, imposed 'custom').

  ### D. The Power-Politics Rebuttal
  A might-makes-right defender argues that institutional inertia is *passive*, not "force" in Pascal's active, sovereignty-sustaining sense. Real force requires the Chair's *present* ability to impose his will without effective challenge, like reassigning the course and facing no consequences. Structures like potential future committee review are merely hypothetical constraints, not actual coercive power preventing the Chair *now*. If the Chair acts and suffers no *immediate* penalty, his might prevails, proving the custom lacked genuine sustaining force. **This attack partially succeeds in exposing ambiguity in "force," but leaves the conventionalist core intact** if the structures *do* demonstrably constrain behavior (e.g., past chairs were sanctioned for similar breaches) or reliably impose future costs, showing the custom is actively enforced, albeit diffusely.
