  hey, i'm prepping a small seminar on philosophy of law and want to use Sophocles' Antigone, but not the tired "Creon equals Hart and Antigone equals Fuller" framing that every intro course does. read the play through the Hart-Fuller debate, but get into teh weeds: does Creon's edict fail because it's substantively immoral in a way Hart's separation thesis allows, or does it violate Fuller's internal morality of law—those eight canons like generality, promulgation, and non-retroactivity—on purely procedural grounds? and when Antigone appeals to unwritten divine law, is she actually supporting Fuller's claim that law needs an internal moral structure, or is she doing exactly what Hart warns against, collapsing legal validity into morality? point me to sepcific scenes where the tension is sharpest—the opening exchange with Ismene, Creon's clash with Haemon, maybe the guard's report—and say where the play resists being reduced to either philosopher's view. treat it like real criticism, not plot summary. finish with a one-line summary of what the play adds to the debate that pure argument misses.

