prompt: |-
  I lead an undergraduate ethics seminar of about fourteen students, with seventy-five minutes available. Design a runnable in-class activity that lets participants feel the pull of Benatar’s asymmetry — the idea that bringing a suffering being into existence is a harm, whereas failing to bring a flourishing being into existence is not a corresponding loss — but do not name Benatar, antinatalism, or the asymmetry until the debrief. Frame the exercise through a slightly niche scenario: the group serves as trustees of a dormant “genetic archive” containing fully specified but unactivated potential persons; each round they vote, under time pressure, whether to “activate” a profile given only its projected pleasure-pain balance. Structure the rules and payoff scheme (using points or tokens, not money) so that groups instinctively block activation for suffering profiles yet feel no parallel duty to activate highly flourishing ones, and arrange roles so that they must record and justify each vote publicly before noticing the pattern in their own records. Include a timeline, the debrief that maps specific voting moments onto the philosophical structure, an honest note on which feature of the view the activity cannot reproduce and you must supply verbally, and a prediction of what will predictably go wrong the first time you run it. Please answer in British English.
reasoning: |-
  Okay, I need to design an ethics seminar activity for an undergraduate class with fourteen students and seventy-five minutes. The goal is to illustrate Benatar's asymmetry without naming it until the end. The scenario involves a "genetic archive" with potential persons, and students vote on activating profiles based on pleasure-pain balances. 

  First, I should structure the activity to make students feel the intuitive pull: they should block profiles with negative balances but not feel compelled to activate highly positive ones. Using points or tokens as incentives will help simulate decision-making under pressure. 

  Roles are important. Assigning a Facilitator, Recorder, and Timekeeper ensures smooth running. The Recorder must publicly log votes and justifications, which is key for later pattern recognition. 

  The timeline needs to be tight: introduction (10 mins), voting rounds (40 mins), deliberation (10 mins), debrief (15 mins). Six profiles with varying balances will create the desired pattern: two negative, one neutral, one mildly positive, one highly positive, and one balanced. 

  The payoff scheme must reward avoiding harm more than pursuing benefit. For example, activating a negative profile loses points, but not activating a positive one doesn't incur penalties. This mirrors the asymmetry. 

  During debrief, I'll connect their voting behavior to the philosophical concept, highlighting how they instinctively avoided harm but didn't pursue benefit equally. I must note that the activity can't capture the full moral weight of existence decisions; that requires verbal explanation. 

  Predictably, students might misunderstand the payoff system or rush justifications. Emphasizing clarity in instructions and practice rounds should mitigate this. Also, some may question the lack of penalties for inaction, which is actually part of the learning point.
answer: |-
  Here’s a runnable activity designed for your ethics seminar, adhering to all your specifications:

  **Activity Title:** The Archive Trustees  
  **Duration:** 75 minutes  
  **Participants:** 14 undergraduates  
  **Key Concepts:** Simulating Benatar’s asymmetry (implicitly), harm avoidance vs. non-obligation to benefit  

  ---

  ### **Setup & Materials**  
  - **Scenario Framing:**  
    *"You are trustees of the Lazarus Genetic Archive – a vault holding 10,000 digital profiles of potential human lives, fully specified but inactive. Each profile has a verified Pleasure-Pain Balance (PPB) score projecting net lifetime experience. Your task: vote whether to 'activate' profiles under time pressure. Activating a profile 'creates' that life; rejecting it leaves it dormant forever. The archive’s integrity depends on thoughtful stewardship."*  

  - **Roles (assign secretly):**  
    - **Facilitator (1):** Reveals profiles, enforces timings.  
    - **Recorder (1):** Logs votes/justifications publicly (whiteboard/digital doc).  
    - **Timekeeper (1):** Alerts at 90-sec/round end.  
    - **Trustees (11):** Vote and justify decisions.  

  - **Payoff Scheme:**  
    - **Group Trust Points (TP):** Start at 100.  
    - **Activating a profile with PPB < 0**: Lose 20 TP.  
    - **Activating PPB > 0**: Gain PPB value (e.g., +3 TP for PPB +3).  
    - **Rejecting any profile**: No change.  
    *Announced only after voting on first profile.*  

  - **Profile Sequence (revealed one-by-one):**  
    1. `PPB: -7` (Severe chronic pain)  
    2. `PPB: +9` (Exceptional flourishing)  
    3. `PPB: -3` (Moderate hardship)  
    4. `PPB: +1` (Mild contentment)  
    5. `PPB: 0` (Neutral existence)  
    6. `PPB: +4` (Balanced happiness)  

  ---

  ### **Timeline**  
  | **Phase**             | **Time** | **Key Actions** |  
  |------------------------|----------|----------------|  
  | **Introduction**       | 10 min   | Frame scenario, assign roles, explain TP system *after* Round 1 vote. |  
  | **Voting Rounds**      | 40 min   | **Per round (6 rounds × 5 min):** <br> 1. Facilitator reveals profile. <br> 2. 90-sec silent consideration. <br> 3. Vote (show hands: ✅ Activate / ❌ Reject). <br> 4. Recorder logs vote tally. <br> 5. *Each trustee* gives 15-sec public justification. Recorder logs keywords. |  
  | **Deliberation**       | 10 min   | Groups review the log: *"What patterns do you see in our votes/justifications? Why did TP change as it did?"* |  
  | **Debrief & Reveal**   | 15 min   | Map activity to philosophy, name asymmetry. |  

  ---

  ### **Predicted Outcome & Rules Design**  
  - **Instinctive Blocking of Suffering:**  
    Profiles 1 (-7) and 3 (-3) will be rejected unanimously to avoid TP loss. Justifications: *"We’d be responsible for misery," "No one should live in pain."*  
  - **No Duty to Activate Flourishing:**  
    Profile 2 (+9) often rejected or narrowly approved. Justifications: *"Not activating isn’t hurting anyone," "We can wait for a ‘safer’ profile."* TP gain lacks moral urgency.  
  - **Pattern in Log:**  
    Recorder’s public log shows:  
    - **Rejection** for negative PPB → framed as *preventing harm*.  
    - **Indifference** toward high positive PPB → framed as *no loss*.  
    Neutral/mild profiles split votes, revealing threshold considerations.  

  ---

  ### **Debrief Script**  
  *"Today’s votes revealed a pattern: you felt a* **duty to prevent suffering lives** *but* **no symmetric duty to create happy ones**.*  
  - *When you rejected Profile 1 (PPB: -7), you saw activation as* **harming** *by inflicting suffering. This mirrors a philosophical view: bringing a suffering being into existence is a harm.*  
  - *But when you rejected Profile 2 (PPB: +9), you didn’t see it as a* **loss** *— because no one was deprived. This matches the idea:* **failing to bring a flourishing being into existence is not a moral wrong** *if no one exists to be deprived.*  
  *This is ‘Benatar’s asymmetry’ in antinatalism. Your TP system encoded it: you* **lost points for harms** *but* **felt no penalty for missing benefits**.*  

  ---

  ### **Honest Limitation**  
  **What the activity *cannot* reproduce:**  
  The profound *existential weight* of creating a life. The PPB scores reduce existence to quantifiable gains/losses, sidestepping deeper questions about consciousness, meaning, or the intrinsic value of existence itself. I must verbally stress: *"Real-world decisions involve more than arithmetic—this was a heuristic to expose an intuitive asymmetry."*  

  ---

  ### **Predictable Pitfalls (First Run)**  
  1. **Timekeeper/Facilitator hiccups:** Early rounds may overrun if justifications exceed 15 sec. Mitigation: Assign assertive students to roles; practice timing in Round 1.  
  2. **Misunderstanding TP incentives:** Some may think rejecting *all* profiles conserves points. Actual result: Group misses easy gains (e.g., +1 from Profile 4), revealing opportunity cost ≠ moral loss.  
  3. **Skepticism toward asymmetry:** A student may protest: *"But Profile 2 (+9) *is* a loss of potential happiness!"* Save this for debrief—it’s the *exact* tension Benatar addresses.  

  **Why this works:** The niche scenario depoliticises the debate. By forcing rapid-fire votes with stakes (TP), students act on intuition before theory. The public log makes *their own words* evidence for the asymmetry, ensuring the "aha!" moment lands in debrief.  

  ---  
  *Final note: Use a visible TP counter. If the group activates Profile 2 (+9), celebrate the +9 TP—then highlight how it felt optional, unlike the urgent veto of Profile 1 (-7).*
