answer: |-
  Your study group’s frustration is both understandable and revealing—it’s not that epistemology is running in circles, but that these three positions are fundamentally answering *different questions* while using the same vocabulary of "justification." What feels like a stalemate arises because each theory prioritizes a distinct dimension of epistemic evaluation, and none fully engages with the core anxieties driving the others. Let’s diagnose the disconnect.

  The foundationalist isn’t just describing beliefs; she’s seeking *psychological or experiential anchors*—points where justification feels intuitively grounded in something non-inferential, like sensory input. Her worry is psychological arbitrariness: without these anchors, she fears justification collapses into free-floating abstraction. But when pressed, she conflates *feeling* foundational (e.g., "I see red") with *being* indubitably justified, which exposes her unspoken commitment to cognition needing stable starting blocks. Her "circularity" admission shows she’s wrestling with a meta-problem: how to validate anchors without presupposing them.

  The coherentist, meanwhile, cares about *systematic logical constraint*. For him, justification isn’t about origins but about the network’s resilience—how beliefs mutually constrain and explain each other. The fairy tale objection hits because he’s sidelining *external anchorage* (truth-tracking) for internal elegance. His real goal is avoiding arbitrariness *within the system*, not guaranteeing connection to reality. When he dismisses the fairy tale as "lacking empirical ties," he subtly smuggles in foundationalist concerns, betraying that pure coherence isn’t enough—he needs *some* tether to the world he hasn’t theorized.

  The infinitist is reacting to the *regress problem itself* as the core threat. Her "in principle" chains are a deliberate dodge of cognitive limits because she sees *any* stopping point (foundational or coherent) as arbitrary. For her, justification is inherently prospective and dynamic—always deferrable further—not a state achievable by finite minds. When she waves off concrete chains, she’s not evading; she’s insisting that *demanding actual completion* misunderstands justification as a finite product rather than an open-ended process. Her position is a meta-solution to the regress, not a psychological model.

  So yes, you’re watching three movies: one about psychological grounding (foundationalism), one about logical architecture (coherentism), and one about avoiding arbitrariness through infinite deferral (infinitism). The "scaffolded loops" idea you mentioned—distributing justification across people/tools—tries to reframe this by outsourcing the infinite regress or fragmenting the coherent web. But it doesn’t resolve the core tensions; it sidesteps them sociologically, acknowledging humans *can’t* personally satisfy any pure theory alone. That’s useful pragmatism, but it concedes the philosophical stalemate.

  **Progress isn’t about choosing a winner—it’s about mapping interactions and constraints.** Here’s what that could look like:
  - **Formal modeling**: Build computational simulations where "belief networks" incorporate foundational inputs (sensor-like nodes), coherence metrics (mutual support weights), and iterative chains (probabilistic regress paths). Test how these structures behave under uncertainty or deception. Does "knowledge" emerge only when all three features interact under specific constraints?
  - **Cognitive experiments**: Design tasks probing how people *actually* halt regress. Do they rely on perceptual anchors (foundational), narrative consistency (coherent), or social delegation (scaffolding)? Measure cognitive load: Does insisting on "infinite" justifications crash reasoning, validating foundationalist concerns?
  - **Re-framing justification**: Admit that "justification" might be a cluster concept. Perhaps foundational elements *trigger* assent ("I believe this because I see it"), coherence *sustains* it ("this belief fits my worldview"), and infinitism *describes its defeasibility* ("I could seek further reasons if challenged"). No single theory captures this ecology.

  Your stall is substantive: it’s about the *conditions for halting inquiry* while claiming knowledge. Breaking it requires confessing that human knowing is hybrid and heuristic. The theories aren’t broken—they’re partial lenses. Progress means asking: "What epistemic work is each theory *doing* in practice?" not "Which one is ‘right’?" That shift alone might get your group unstuck.
