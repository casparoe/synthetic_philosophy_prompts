  ## Gongsun Long and the Ghost in the Machine: Origin vs. Appearance in Generative Art

  Confronted with the challenge of AI-generated art replicating a master painter's style, Gongsun Long, the logician of the School of Names famed for separating "white horse" from "horse," would undoubtedly reject the fluid reconceptualization of the artist's work category. He would argue that the AI-generated images, despite their perceptual indistinguishability, fundamentally lack the essential reality (*shi*) designated by the name (*ming*) "work by [Painter X]." He would analogize the missing causal-historical origin to the absence of the universal "horse-form" (*xing*) in his white horse argument, demonstrating that shared appearance is insufficient for true categorical membership.

  **The Core Analogy: Missing Form, Missing Origin**
  Gongsun Long's "White Horse is Not Horse" argument hinges on the distinction between universal categories and specific instances defined by added attributes. "Horse" names the universal form (*xing*), the essential reality of horseness. "White horse" adds the specific attribute of color (*se*), creating a distinct name referring to a subset of the universal. Crucially, adding "white" excludes non-white horses from the category "white horse," making it *narrower* than "horse." The white horse possesses the horse-form *and* whiteness. Without the horse-form, it wouldn't be a horse at all, just a white object.

  Transposed to generative art, Gongsun Long would see "work by [Painter X]" as naming a specific reality (*shi*) defined not merely by formal properties (the visual *xing* and *se*), but crucially by the causal chain: the artist's intention (*yi*), their manual execution (*gong*), and the studio context (*jing*). This causal chain *is* the "form" (*xing*) of an authentic work, analogous to the horse-form. The AI-generated image possesses the visual attributes (*se* – color, texture, composition) but entirely lacks the essential form (*xing*) of originating from the painter's intentional act within their artistic context. Just as a white object lacking horse-form is not a horse (white or otherwise), an image lacking the painter-origin-form is not a "work by [Painter X]." The AI output might be perceptually identical (*se*), but it lacks the defining reality (*shi*) named by "work by [Painter X]."

  **Deploying *Ming* (Name) and *Shi* (Reality)**
  The School of Names was preoccupied with ensuring names (*ming*) correctly correspond to realities (*shi*) to avoid conceptual confusion and social disorder. For Gongsun Long:

  1.  **The Name (*Ming*) "Work by [Painter X]"**: This name points to a specific reality (*shi*). That reality encompasses the visual appearance *and* its causal genesis in the artist's unique creative act. The name inherently references the origin.
  2.  **The AI Reality (*Shi*)**: The AI image possesses a *different* reality (*shi*). Its genesis lies in algorithmic pattern recognition, statistical modeling, and digital generation based on data derived from observing authentic works. Its reality is computational mimicry.
  3.  **Mismatch**: Applying the name "work by [Painter X]" to the AI output imposes a name (*ming*) onto a reality (*shi*) that does not correspond. It confuses the computational process reality with the human-artistic process reality. This violates the core School of Names principle of rectifying names to fit realities (*zheng ming*).

  **Objections Against the Continuum View**
  Gongsun Long's strongest objections to the fluid continuum view would stem from its destruction of categorical precision and its disregard for the essential defining element:

  1.  **Loss of Distinction Between Essence and Accident**: The continuum view treats the origin (the essential defining *xing* for the category) as merely one property among many, potentially outweighed by perceptual similarity (an accidental property *se*). For Gongsun Long, origin isn't just *a* property; it *is* the defining form that makes the object belong to the named category in the first place. Without it, the category collapses into meaninglessness.
  2.  **Infinite Regress of Similarity**: If categorical membership depends solely on perceptual similarity, where does the boundary lie? Is a poor student copy also a "work by [Painter X]" if it shares *some* properties? Is a work by an imitator? The continuum view provides no logical stopping point, leading to conceptual chaos (*luan ming* – disordered names), precisely what the School of Names sought to prevent. Gongsun Long's strict separation provides a clear boundary: the causal origin.
  3.  **Negation of Agency and Identity**: The continuum view implicitly dissolves the artist's unique agency and the historical specificity of the work. If the AI output is functionally equivalent, the artist's labor, intention, and context become irrelevant. For Gongsun Long, this would be nonsensical; the name "work by [Painter X]" *means* the product *of that specific agent's creative act*. Separating the effect from its true cause renders the name incoherent.

  **Verdict**
  Gongsun Long would **firmly reject the fluid reconceptualization** and **adamantly defend the hard separation thesis**. He would argue that the name (*ming*) "work by [Painter X]" designates a reality (*shi*) defined by a specific causal origin – the artist's intention and execution within their context. This origin constitutes the essential form (*xing*) of the work. The AI-generated image, while sharing perceptible properties (*se*), lacks this essential form entirely. Just as a white object lacking horse-form is not a horse, an image lacking painter-origin-form is not a "work by [Painter X]." To claim otherwise, he would assert, is a profound error in naming, confusing mere appearance (*se*) for the true reality (*shi*) designated by the name. Categorical membership is fixed by the essential reality (origin), not by perceptual similarity alone.

