  For structure: Start with disarming humility (joke about age, conference name), then introduce Darwin's idea through his own doubts—this makes him relatable. Frame morality as grounded in instincts like parental care, but emphasize that evolution didn't "design" it for modern scales; it's a biological accident we've consciously stretched. This lets Elena sidestep reductionism (it's not "just biology"—it's biology plus human choice) and validate religion (it's one way we stretch further, not invalidated). The "overextension" idea becomes hopeful: our instincts are flawed, but that means we can choose to extend them further. End by tying it back to family and shared uncertainty, softening any tension. 

