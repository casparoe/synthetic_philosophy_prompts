  ## Darwin's Ghost (Opening Remarks - Slightly Messy Cards)

  **(Elena adjusts her glasses, taps the microphone with a faint smile. Her notes are handwritten on index cards, one clearly visible with a slightly crooked 'recieve')**

  Friends… family… esteemed colleagues… and Maya, darling, I promise to keep the Latin names to a minimum. Mostly. Thank you for coming to this peculiar little gathering. ‘Darwin’s Ghost’! It sounds rather ominous, doesn’t it? Like we’re summoning the great man for a séance. Though, knowing him from his notebooks, I suspect he’d be terribly shy about the whole affair. He was, after all, a man deeply preoccupied with the *weight* of his ideas, especially when it came to us… to the human heart, and our sense of right and wrong.

  Seventy years gives one a certain perspective. You look back. You see the threads. And one thread that fascinated Charles – and frankly, keeps me up some nights – is where our moral sense comes from. Not from theologians or philosophers in that moment, but fundamentally. Why do we *feel* it? Why does the cry of a child we don’t know twist our gut? Why does injustice *hurt*?

  Darwin, reading those private notes from the late 1830s… he wasn’t looking for a grand design. He was looking at us as animals. Social animals. He saw the roots of morality not in divine decree etched on stone, but in the warm, messy soil of our relationships. The fierce protectiveness of a parent for a child. The loyalty to kin, the cooperation within a tribe necessary for survival. The pang of sympathy when a fellow creature suffers nearby. These, he argued, are our social instincts. They are as much a part of our evolved biology as our opposable thumbs or the colour of our eyes. They helped us stick together, helped our ancestors survive.

  But here’s where it gets truly interesting, and where Charles himself seemed… well, almost embarrassed. Almost worried. He saw this incredible thing happening: that powerful instinct, that deep parental tenderness… it began to stretch. It began to travel far beyond the nursery, far beyond the familiar faces around the fire. We started feeling sympathy, a sense of obligation, even for strangers. For people we will never meet, whose language we don’t speak, whose lives are utterly distant from our own.

  And Darwin scratched his head in those notebooks. He marvelled at it, this ‘overextension’ – he practically used that word. He worried that natural selection, that blind, pragmatic sculptor, never *meant* for this instinct to travel so far. It was calibrated for the small group, for the immediate threat, for the known face. This vast, sprawling sympathy for humanity? It seemed… biologically extravagant. Maybe even a little absurd. An evolutionary accident amplified by our big brains and our ability to imagine the suffering of others, even through a newspaper report or a flickering screen.

  **(She pauses, looks around, making eye contact with different faces – a colleague nodding thoughtfully, Miguel listening intently, Maya trying not to fidget)**

  Now, this is the delicate bit. Understanding *where* this feeling comes from – that deep wellspring of social instinct, stretched thin over continents – tells us nothing about what we *ought* to do with it. Knowing that my urge to comfort a crying child shares an evolutionary root with my pang of guilt reading about a famine overseas… that doesn’t dictate my obligation. It doesn’t tell me whether that obligation is real, or deep, or binding. It just tells me *why the feeling might be there*.

  To my scientific friends, I say: Don’t mistake the origin for the conclusion. Saying morality *arises* from evolved instincts is not the same as saying it *is* *only* those instincts, or that it’s somehow less real, less demanding. That sympathy for the distant stranger? It’s no less powerful, no less vital, because its roots lie in the care for an infant. It’s the same fire, just warming a larger room. Biology gives us the spark; it doesn’t extinguish the flame or tell us how big the hearth should be.

  **(She turns slightly, her gaze softening, including her family more directly)**

  And to those of you, like my dear brother Miguel, for whom faith provides a compass… understanding this biological underpinning doesn’t erase the sacred, the profound, the communal truth you find in tradition and ritual. It doesn’t say your path is invalid. Because here’s the thing Darwin’s worry highlights: that raw instinct, stretched so thin, is fragile. It needs tending. It needs reinforcement. It needs stories, communities, shared values – perhaps even the structures and comforts of faith – to *sustain* that feeling of obligation across vast distances and to people utterly unlike ourselves. Biology gives the capacity; it doesn’t build the bridge alone. Religion, philosophy, culture… they are the architects and engineers of that bridge, helping our instinctual sympathy travel the impossible distances we now know it must.

  Darwin was almost embarrassed by the *scope* of our sympathy, fearing it was an overreach. But I find it… profoundly hopeful. That this small, biological spark, meant to bind a mother to her child, could – through the miracle of our consciousness, our imagination, and yes, our cultural creations – catch fire and illuminate our duty to people continents away. It’s messy. It’s imperfect. It often fails spectacularly. But the fact that the *feeling* exists at all, this deep pull towards kindness beyond our kin… isn’t that astonishing? Isn’t that worth nurturing, in whatever way we find meaningful?

  So, let’s not talk about morality *without* design as if it’s morality without foundation, or morality without awe. It’s morality built from the ground up, from the love we feel naturally for those closest to us, stretched – sometimes painfully, often beautifully – to encompass a stranger. An accident, perhaps. But what a magnificent, demanding accident it is. Let’s explore what that means, this ghost of an instinct that haunts us towards goodness far beyond its original purpose.

  Thank you. Let’s begin.
