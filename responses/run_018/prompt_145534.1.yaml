answer: |-
  ### Teaching Plan: Orthogonality of Category and Style in Letter Recognition  
  **Duration:** 90 minutes  
  **Audience:** Cognitive science undergraduates familiar with Wittgenstein’s family resemblance, but no prior exposure to Letter Spirit, typography, or computer vision.  

  ---

  #### **Dependency Sequence**  
  1. **Review Family Resemblance & Establish Slippages (25 min)**  
     - **Why first?** Students must grasp that category membership ("a"-ness) relies on a network of overlapping similarities (Wittgenstein), not fixed criteria.  
     - **Activity:**  
       - Show 5–6 diverse "a" examples (double-storey printed, single-storey handwritten, italic, etc.).  
       - Highlight shared/differing features (e.g., bowl, tail, crossbar).  
       - Define "slippage": *permissible deviations from a canonical form that preserve resemblance to other category members* (e.g., "open top" in handwritten "a" is a slippage from closed-top printed "a").  
     - **Key Insight:** No single feature is necessary/sufficient; category boundaries are flexible but constrained.  

  2. **Introduce Style as Orthogonal to Category (20 min)**  
     - **Why after slippage?** Style is a *system of consistent slippages* applied across all letters. Slippages must be understood first to see style as structured variation.  
     - **Activity:**  
       - Contrast two handwriting styles (e.g., "loopy" vs. "angular").  
       - Map consistent deviations (slippages) in each style (e.g., "long tails" in all letters of Style X).  
       - Emphasize: Category remains fixed (e.g., "a" is still "a") despite stylistic deviations.  

  3. **Present the Trio in Dual Contexts (25 min)**  
     - **Ambiguity last?** Ambiguity relies on prior understanding of slippage and style.  
     - **Activity:**  
       - Show the trio in **Style 1** (all read as "a"):  
         1. Canonical double-storey "a"  
         2. Single-storey "a" (open top, long tail)  
         3. Ambiguous form (o-like with short ascender) → read as "a"  
       - Show the **same trio shapes** in **Style 2**:  
         1. Canonical double-storey "a"  
         2. Single-storey "a" (open top, long tail)  
         3. *Same* ambiguous form → read as "o"  
     - **Reveal:** Identical form (3) changes category based on style context.  

  ---

  #### **Misconceptions & Preemptive Interventions**  
  1. **Misconception: "Family resemblance means anything goes."**  
     - **When addressed:** During slippage introduction (Step 1).  
     - **Intervention:**  
       - Show a non-"a" (e.g., "€") and ask: "Is this an ‘a’? Why not?"  
       - Stress: Slippages are constrained by resemblance to *existing category members*.  

  2. **Misconception: "Style is noise around a true form."**  
     - **When addressed:** When defining style (Step 2).  
     - **Intervention:**  
       - Contrast a "messy" vs. "consistent" handwriting sample.  
       - Ask: "Does consistency in deviations suggest randomness or a system?"  
       - Conclude: Style is *rule-governed* slippage, not error.  

  3. **Misconception: "Ambiguity proves no real category boundaries."**  
     - **When addressed:** When presenting the trio (Step 3).  
     - **Intervention:**  
       - Highlight that in Style 1, the form is unambiguously "a"; in Style 2, unambiguously "o."  
       - Ask: "What contextual clues force the interpretation?" → *Systemic style cues* disambiguate.  

  ---

  #### **Final Check for Genuine Understanding**  
  - **Task:** Present a new letter (e.g., "g") in two styles and a novel ambiguous shape (e.g., between "g" and "q").  
    - **Question 1:** "How could this shape be read as ‘g’ in one style and ‘q’ in another?"  
      - **Pass:** Attributes interpretation to style-specific slippages (e.g., "Style A’s ‘g’ has a curved tail, so the shape fits; Style B’s ‘q’ has the same curve").  
      - **Fail:** Reduces style to category ("It’s a ‘g’ because it looks like one") or vice versa ("The style forces it to be ‘q’").  
    - **Question 2:** "If I change the style of an ‘a’, does it become a different letter?"  
      - **Pass:** "No—style variations (e.g., adding a tail) don’t break category membership if resemblances hold."  
      - **Fail:** Confuses style with category ("A tail makes it a ‘d’").  

  ---

  #### **Explicit Omissions**  
  - **Do not cover:**  
    1. Algorithmic details of role-model matching (Letter Spirit’s computational framework).  
    2. Neurobiological mechanisms of visual word recognition.  
    3. Historical evolution of typefaces (e.g., Garamond vs. Helvetica).  
  - **Rationale:** Focus is on *conceptual* separation of category/style; technical/empirical depths exceed scope.  

  ---

  **Timeline Summary**  
  - Step 1 (25 min): Slippages + Misconception 1.  
  - Step 2 (20 min): Style + Misconception 2.  
  - Step 3 (25 min): Trio + Misconception 3.  
  - Final Check (10 min): Orthogonality assessment.  
  - Omissions (5 min): Explicitly state boundaries.  
  - Buffer (5 min): Q&A.
