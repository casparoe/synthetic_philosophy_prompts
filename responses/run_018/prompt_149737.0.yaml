     We say: for model-error evidence, if the calibrator cannot assess the direction and/or severity, they must still choose a severity (low, medium, high) and use the unknown direction rule. But if they have no idea, they might choose low? Or we require that they get help.

     We make it: if the evidence is about model error but the calibrator cannot assess it, they must note it and not adjust? Or adjust as unknown direction with low severity? We choose: they must not adjust and flag for expert review.

     We'll define:

          For any evidence, if the calibrator cannot quantify the adjustment (for direct) or assess severity/direction (for model-error), then they leave the probability unchanged and mark the case as "yellow" for review.

     So for case 3, if the calibrator cannot quantify how much the organizational memo changes the probability, then they do not adjust and stay at 4%. Despite their gut, they must follow the procedure.

     And what the procedure cannot do: it cannot resolve when evidence is too vague to quantify, and it cannot resolve deep disagreements about whether evidence is admissible (e.g., whether organizational factors are part of the objective chance or not).

     Now, the step-by-step:

     We'll write the procedure as an internal memo.

     Format:

     To: Risk-Calibration Team
     From: Senior Calibrator
     Subject: Practical Procedure for Risk Calibration with Internal Memos

     We have a new procedure for adjusting the published chances from our simulations based on internal memos. The goal is to account for new evidence that either:
        (a) Bears directly on the event (and wasn't in the model), or
        (b) Indicates a problem with the model's calibration.

     The procedure should take about 20 minutes per case. Use it for every case where an internal memo comes in.

     Step 1: Start with the published chance (P_pub) and the memo. Ask: 
          Q1: Was the information in the memo already incorporated in the simulation model? 
              - If yes, ignore this memo (it's redundant) and stop. P_final = P_pub.
              - If no, go to Q2.
          Q2: Is the memo about the real-world event (direct evidence) or about the model (model-error evidence)?
              - It could be both: then split it and handle separately.

     Step 2: For model-error evidence (if any):
          a) Assess the severity of the model error: 
              - Low: minor issue, unlikely to change results much.
              - Medium: issue that could moderately affect results.
              - High: major issue that could invalidate the results.
          b) Assess the direction of the error (how the model might be biased):
              - Too low: the published chance is likely too low.
              - Too high: the published chance is likely too high.
              - Unknown: we don't know the direction.
          c) Apply the "leaky bucket" adjustment:
              - If direction is known:
                    Choose a multiplier (m) based on severity:
                        Low: m = 1.5 (if too low) or 0.67 (if too high)
                        Medium: m = 2.0 or 0.5
                        High: m = 3.0 or 0.33
                    Then: P_model_adj = P_pub * m   (cap at 1.0 or floor at 0.0)
              - If direction is unknown:
                    Let k = 
                        Low: 0.1
                        Medium: 0.3
                        High: 0.6
                    Let odds_pub = P_pub / (1 - P_pub)
                    Let odds_adj = odds_pub^(1-k) * 1^k   [because 1 is the odds of 50%]
                    Then P_model_adj = odds_adj / (1 + odds_adj)

          If there is both direct and model-error evidence, do the model-error adjustment first to get P_temp.

     Step 3: For direct evidence (if any):
          a) Assess the evidence: how much does it increase or decrease the probability of the event? You must be specific and use the memo content.
          b) Assign a relative change factor (r) for the probability. For example:
              - "This evidence doubles the chance" -> r = 1.0 (meaning 100% increase) so multiplier = 2.
              - "This evidence reduces the chance by 30%" -> r = -0.3 -> multiplier = 0.7.
              - If you cannot quantify the effect, you cannot adjust. Flag and go to Step 4.
          c) Apply the adjustment to the current probability (which is either P_pub if no model-error, or P_temp if there was model-error adjustment):
              P_after_direct = current_P * (1 + r)
              Cap between 0 and 1.

     Step 4: Final review and flagging:
          - Let P_final be the result after adjustments.
          - Compare with P_pub: 
               * If the change is less than 20% of P_pub (e.g., from 5% to 6% is 1% absolute change which is 20% of 5% -> so within 20% of the original value), mark as Green.
               * If the change is 20% to 100% of P_pub (e.g., 5% to 6.1% is 22% change relative to 5%? or absolute? We mean relative: (new-old)/old > 0.2) then mark as Yellow.
               * If the change is over 100% (more than doubled) or if you had to leave evidence unadjusted because you couldn't quantify it, mark as Red.
          - For Yellow and Red, get a second reviewer.
          - Also, note any judgments that were particularly subjective.

     Step 5: Document: 
          - The published chance.
          - The memo and how you classified it.
          - Adjustments made (if any) and why.
          - Final probability and flag color.

     Test Questions to Apply to Any Case (use these to check your work):

        1. Was the evidence in the memo already in the model? (If you don't know, assume no but note it.)
        2. For model-error evidence: 
              a) What part of the model does it affect? 
              b) How severe is the error? (Low/Med/High)
              c) Do we know the direction of the bias? (If not, use unknown.)
        3. For direct evidence: 
              a) What specific aspect of the event does it affect? 
              b) What relative change (r) does it cause? (If you can't assign one, skip adjustment and flag.)
        4. Did you apply adjustments in the order: model-error first, then direct evidence?
        5. What's the final change compared to published? (Green/Yellow/Red)

     What the procedure can't do:
        - It can't create a number from nothing: if you can't quantify the effect of evidence, we don't adjust.
        - It can't resolve disagreements about whether evidence is already in the model or not. When in doubt, note it and adjust.
        - It can't resolve deep philosophical questions about what counts as admissible evidence. We treat any specific, material evidence that's not in the model as admissible for adjustment.

     Worked Examples:

     Case 1: Gene-drive malaria release, published 2% ecological failure chance. Memo: temperature-sensitivity in the simulation grid.

          Step 1: 
              Q1: Was the temperature-sensitivity in the model? Probably not, because the memo points out a flaw. So proceed.
              Q2: This is about the model (the grid) so model-error evidence.

          Step 2: 
              a) Severity: The memo says the simulation grid was sensitive to temperature, meaning results might be unstable. We don't know how much. Let's say Medium severity because it could affect the result but we don't know by how much.
              b) Direction: We don't know if it makes the 2% too high or too low. So unknown.
              c) Adjustment: 
                   k = 0.3 (medium)
                   odds_pub = 0.02 / (1-0.02) = 0.0204
                   odds_adj = 0.0204^(0.7) * 1^(0.3) = 0.0204^0.7
                   Calculate: 0.0204^0.7 = (0.0204)^(7/10) = (0.0204^0.5)^(1.4) ... roughly: 0.0204^0.5 is about 0.1428, then 0.1428^1.4? 
                   Alternatively, use calculator: 0.0204^0.7 ≈ 0.0204^(7/10) = (0.0204^0.7) = approx 0.045 (using a calculator: 0.0204^0.7 ≈ 0.045)
                   Then P_model_adj = 0.045 / (1+0.045) ≈ 4.3%

          So we adjust to 4.3%.

          Step 3: No direct evidence, so P_final=4.3%.

          Step 4: Change is from 2% to 4.3%, which is a 115% increase (relative to 2%) -> over 100%, so Red. Get a second reviewer.

     Case 2: Satellite-cascade scenario, published 0.1% cascade chance. Memo: debris-tracking database recently updated with unverified crowd-sourced entries.

          Step 1:
              Q1: The model used the old database? The memo says it was updated recently, so the model might have used an older version? Or the update was unverified? We don't know, but it's new information. Probably not in the model. Proceed.
              Q2: This is about the model's input data, so model-error evidence.

          Step 2:
              a) Severity: High. Unverified crowd-sourced entries could be very wrong and the model relies on accurate debris tracking.
              b) Direction: Unknown. It could be that the new entries add debris that wasn't there (increasing cascade chance) or remove it (decreasing)? But the memo doesn't say. So unknown.
              c) Adjustment:
                   k=0.6 (high)
                   odds_pub = 0.001 / (1-0.001) = 0.001001
                   odds_adj = 0.001001^(0.4) * 1^(0.6) = 0.001001^0.4
                   Calculate: 0.001001^0.4 ≈ (0.001)^0.4 = 0.001^(4/10) = 0.001^0.4 = 10^(-3*0.4)=10^-1.2≈0.063
                   More accurately, 0.001001^0.4 ≈ 0.063
                   P_model_adj = 0.063/(1+0.063)≈5.9%

          Step 3: No direct evidence, so P_final=5.9%.

          Step 4: Change from 0.1% to 5.9% -> 5800% increase -> Red.

     Case 3: Containment-breach chance published at 4%. Memo about organizational politics (specific: "safety inspections have been skipped three times in the last month due to budget cuts"). Your gut screams reckless, but you must follow the procedure.

          Step 1:
              Q1: Was the current safety inspection record in the model? The model for containment breach might be a physical sim and not include organizational factors. Probably not. Proceed.
              Q2: This is direct evidence about the event (breaches are more likely when inspections are skipped).

          Step 2: No model-error evidence, so P_temp = 4%.

          Step 3: 
              a) The evidence: skipped inspections. How much does it increase the chance? 
                 You know that skipped inspections make a breach more likely. But by how much? 
                 You might recall that in the past, when inspections were skipped, breaches increased by 50%? Or you might not have data. 
              b) You must assign a relative change. Let's say you think it doubles the chance? Then r=1.0 -> multiplier=2.
                 Then P_after_direct = 4% * 2 = 8%.

              But what if you don't know? Then you cannot assign a relative change. Then you leave it at 4% and mark the case as Red for review.

          Step 4: 
              If you adjusted to 8%, then change is 100% -> Red.
              If you didn't adjust, then change is 0% -> Green, but you have unquantified evidence -> Red flag for review anyway? 
              We defined: if you had to leave evidence unadjusted because you couldn't quantify, then mark as Red.

          So either way, Red.

          What the procedure cannot do: if you are not sure whether the model already included organizational factors, you have to make a judgment. And if you can't quantify the effect, you can't adjust. The procedure cannot tell you how to quantify it.

     Note: In case 3, if you can't quantify, you stay at 4% despite your gut. The procedure forces that because we require quantification.

     End of memo.

  We'll write it up.
answer: |-
  **INTERNAL MEMO: RISK CALIBRATION PROCEDURE FOR TWO-LOCK EVIDENCE**  
  **TO:** Risk-Calibration Team  
  **FROM:** Senior Calibrator (Reserve Capital Sign-Off)  
  **SUBJECT:** Practical 20-Minute Checklist for Adjusting "Objective Chances"  

  Hey team, we’re formalizing how to adjust published sim probabilities (our "objective chances") when internal memos throw curveballs. Remember the **Principal Principle**: if physics sims say "chance of A is *x*," your gut should sit near *x*—**unless** you get "admissible" evidence that doesn’t just repeat the sim. Our twist? The sim is a **two-lock box**:  
  - 🔒 **Lock 1 (Model Calibration)**—Is the sim trustworthy?  
  - 🔒 **Lock 2 (Real-World Event)**—Will the bad thing actually happen?  
  Memos can attack Lock 1 (model errors), Lock 2 (direct event evidence), or both. Stakes are high: misadjust = wrong capital reserves.  

  **HARD RULES UP FRONT**  
  - ⏱ **Spend 20min max per case**. Use timers.  
  - 🚫 **Never ignore memos**—but if evidence is vague/unquantifiable, **don’t adjust** (flag for review).  
  - 📉 **"Leaky Bucket" Rule**: Model-error evidence *dilutes* the sim’s confidence (never discards it).  
  - 🚩 **Flag** cases where:  
    - Evidence is borderline admissible (e.g., "Is org politics part of the *objective* chance?").  
    - You can’t quantify impact (e.g., gut feelings with no data anchor).  
    - Disagreements arise on what’s "admissible." (We can’t resolve philosophy fights here.)  

  ---

  ### **STEP-BY-STEP FLOWCHART**  
  *(Run these test questions in order—skip steps if evidence doesn’t apply.)*  

  #### **1. 🔍 CLASSIFY THE MEMO (5 min)**  
     - **Q1: Was this memo’s info ALREADY baked into the sim?**  
       - *Yes* → Ignore memo. Stick with published chance. ✅  
       - *No* → Proceed.  
     - **Q2: Which lock does the memo attack?**  
       - **Lock 1 (Model Calibration)**: Flaws in sim setup, data inputs, or assumptions.  
         *e.g., "Sim used unverified crowd-sourced debris data."*  
       - **Lock 2 (Direct Event)**: New intel about the *real-world event* (not the sim).  
         *e.g., "Gene-drive mosquitos died faster in new field tests."*  
       - **Both?** → Split evidence and handle separately.  

  #### **2. 🔧 ADJUST FOR LOCK 1 (MODEL-ERROR EVIDENCE) (10 min)**  
  *Use the **"leaky bucket" rule**: We trust the sim less, but don’t dump it. Adjust published chance `P_pub` → `P_temp`.*  
     - **Q1: How SEVERE is the model error?**  
       - *Low* (minor glitch, unlikely to change much)  
       - *Medium* (plausible impact, but size unknown)  
       - *High* (core flaw, sim may be junk)  
     - **Q2: Do we know the DIRECTION of bias?**  
       - *Too High* (sim overestimates risk)  
       - *Too Low* (sim underestimates risk)  
       - *Unknown* (can’t tell if sim is high/low)  
     - **ADJUSTMENT RULES**:  
       - **If direction KNOWN**:  
         - Apply multiplier `m` to `P_pub`:  
           - Low severity: `m = 1.5` (if too low) or `0.67` (if too high)  
           - Medium: `m = 2.0` or `0.5`  
           - High: `m = 3.0` or `0.33`  
         - `P_temp = P_pub * m` (cap at 100% or 0%).  
       - **If direction UNKNOWN**:  
         - Move `P_pub` toward 50% (neutral uncertainty) by severity:  
           - Low: Move 10% of the distance to 50%  
           - Medium: Move 30%  
           - High: Move 60%  
         - Formula:  
           `P_temp = P_pub + k * (0.5 - P_pub)`  
           where `k = 0.1` (Low), `0.3` (Med), `0.6` (High).  

  #### **3. 📈 ADJUST FOR LOCK 2 (DIRECT EVENT EVIDENCE) (5 min)**  
  *Update `P_temp` → `P_final` using new event intel.*  
     - **Q: Can you QUANTIFY the evidence’s impact?**  
       - *No* → **Do not adjust**. Flag as "unquantifiable" 🚩 and proceed.  
       - *Yes* → Assign a **relative change `r`** (e.g., "+50%" = `r = 0.5`, "-30%" = `r = -0.3`).  
     - **Adjustment**:  
       `P_final = P_temp * (1 + r)`  
       (Cap at 100% or 0% if needed.)  

  #### **4. 🚦FINAL REVIEW (COLOR FLAG)**  
  - **Green** 🟢: Change < 20% from `P_pub`. Low risk—sign off.  
  - **Yellow** 🟡: Change 20–100% from `P_pub`. Medium risk—get 2nd reviewer.  
  - **Red** 🔴: Change > 100% OR unquantifiable evidence. High risk—full team review.  

  ---

  ### **WORKED EXAMPLES**  
  #### **CASE 1: Gene-Drive Release**  
  - **Published chance**: 2% ecological failure.  
  - **Memo**: Temp sensitivity in sim grid (model cal error).  
  - **Steps**:  
    1. 🔍 Not in sim → **Lock 1 evidence**.  
    2. 🔧 Severity: *Medium* (grids affect accuracy, but impact unclear). Direction: *Unknown*.  
       `P_temp = 0.02 + 0.3*(0.5 - 0.02) = 0.02 + 0.144 = 0.164` → **16.4%**.  
    3. 📈 No Lock 2 evidence → `P_final = 16.4%`.  
    4. 🚦 Change: 2% → 16.4% (**720% increase**) → **RED 🔴**.  
  - **Why red?** Model error dragged us toward 50% uncertainty. Team review needed.  

  #### **CASE 2: Satellite Debris Cascade**  
  - **Published chance**: 0.1% cascade.  
  - **Memo**: Debris database updated with unverified crowd-sourced entries (model cal error).  
  - **Steps**:  
    1. 🔍 Not in sim → **Lock 1 evidence**.  
    2. 🔧 Severity: *High* (garbage data = sim integrity shot). Direction: *Unknown*.  
       `P_temp = 0.001 + 0.6*(0.5 - 0.001) ≈ 0.001 + 0.2994 = 0.3004` → **30.04%**.  
    3. 📈 No Lock 2 evidence → `P_final = 30.04%`.  
    4. 🚦 Change: 0.1% → 30.04% (**29,940% increase**) → **RED 🔴**.  
  - **Why red?** High-severity model error = massive uncertainty bump.  

  #### **CASE 3: Pathogen Containment Breach**  
  - **Published chance**: 4% breach.  
  - **Memo**: Org politics—safety inspections skipped (direct event evidence).  
  - **Your gut**: "Lab culture is reckless!" (But memo ≠ gut feeling.)  
  - **Steps**:  
    1. 🔍 Not in sim (physics sim ignores culture) → **Lock 2 evidence**.  
    2. 🔧 No Lock 1 evidence → `P_temp = 4%`.  
    3. 📈 **Can you quantify?**  
       - *If yes*: e.g., "Past breaches ↑ 50% when inspections skipped" → `r = 0.5` → `P_final = 4% * 1.5 = 6%`.  
       - *If no*: Evidence is qualitative—**do not adjust** → `P_final = 4%`.  
    4. 🚦  
       - If adjusted: 4% → 6% (50% increase) → **YELLOW 🟡** (2nd reviewer).  
       - If not adjusted: **GREEN 🟢** but flag "unquantified evidence."  
  - **What the procedure CAN’T DO**:  
    - Resolve if "org politics" is *objectively admissible* (e.g., "Is culture part of physics?").  
    - Validate gut feelings without data.  
    - Force quantifications—if you can’t pin down `r`, you **must** stick with `P_pub`.  

  ---

  **FINAL TIPS**  
  - **Test questions are your anchor**—if stuck, re-run them.  
  - **Leaky bucket > Dumping the bucket**: Never toss the sim—just nudge it toward uncertainty.  
  - **When in doubt, flag 🔴**: Better a slow review than a bad capital call.  
  - **Judgment calls are OK**: Mark ’em and document. Philosophy debates go to the exec team.  

  Keep it tight, quantify what you can, and don’t let perfect be the enemy of "good enough." Ping me for edge cases.  

  —Senior Calibrator ✒️
