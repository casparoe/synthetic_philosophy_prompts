  I am a doctoral student in metaphysics developing an evaluative framework for theories of special composition, and I want the full adequacy specification before comparing particular accounts. Write the desiderata any adequate theory must satisfy: the cases it must correctly classify (everyday artifacts, organisms that have undergone complete cellular turnover, quantum-entangled pairs, and functional aggregates such as synthetic-biology consortia in which parts retain independent metabolism yet display collective behavior), the distinctions it must preserve (for instance, between a genuine composite and a mere collection, between temporary and essential parts, and between being composed of parts and being part of a larger system), the findings from biology and physics it cannot contradict, and which pairs of requirements appear jointly unsatisfiable. For each desideratum, give the motivating case or consideration behind it, and flag which conditions are non-negotiable and which reflect camp-specific preferences. Then briefly score unrestricted composition, nihilism, and a restricted biological view against the list, but keep the emphasis on the criteria rather than the scorecard. Please write your answer in British English.
