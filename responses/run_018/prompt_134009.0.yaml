  First, the classificatory cases seem crucial. Everyday artifacts are non-negotiable because rejecting chairs/tables would make the theory practically useless. Organisms with cellular turnover challenge persistence conditions - biology shows identity isn't tied to specific particles. Quantum entanglement introduces non-locality puzzles where parts defy spatial boundaries. Synthetic biology consortia test functional unity without physical bonding. These cases collectively push against simplistic mereological models.

  For conceptual distinctions, the composite-vs-collection divide feels fundamental - think of a random pebble pile versus a watch. Temporary/essential parts distinction matters for identity over time, like Theseus' ship scenarios. And the part/composite/system hierarchy prevents category errors, as when confusing an organ (part) with an organism (composite). Most of these seem mandatory except perhaps the strength of the essential parts requirement.

  Scientific constraints include relativity's block universe implications for temporal parts, quantum non-separability challenging atomism, and biology's process ontology. These are non-negotiable; a theory contradicting well-established science is untenable. The autonomy constraint (no ad hoc exceptions) is methodological but vital.

  Now the tricky part: tension points. The student mentioned joint unsatisfiability. Quantum entanglement + classical objects creates trouble - are entangled particles a composite? Biological processuality clashes with static parthood definitions. And functional unity demands may conflict with physics-based minimalism. I should flag where compromises might be needed.

  For the scoring teaser: unrestricted composition obviously handles all cases but violates distinctions; nihilism preserves distinctions but rejects composites; biological views handle organisms but fail at artifacts. But per instructions, this stays brief - the focus is on the framework itself.

  The response will use British English throughout ("artefacts", "metres") and maintain academic rigor while being accessible. Key is showing how each desideratum emerges from real philosophical/scientific problems, not just listing them. The tensions section especially should help the student anticipate theoretical trade-offs.
answer: |-
  Here is a full adequacy specification for theories of special composition, structured by desiderata categories, with motivations and negotiability flagged, followed by a brief indicative scoring of three key theories against the criteria. The emphasis remains on articulating the criteria framework itself.

  **Adequacy Specification for Theories of Special Composition**

  **I. Classificatory Demands (Must correctly handle these cases):**

  1.  **Everyday Artefacts (e.g., chairs, tables, ships):**
      *   **Motivation:** Any theory failing to classify typical artefacts as composite objects would be radically revisionist of common sense and discourse, rendering most ordinary statements false. This is the baseline of practical applicability.
      *   **Negotiability:** **Non-negotiable** for theories aiming for practical adequacy within everyday and scientific contexts. (Nihilists explicitly reject this).

  2.  **Organisms After Complete Cellular Turnover (e.g., a human adult composed of entirely different atoms/cells than the infant):**
      *   **Motivation:** Biology demonstrates that organisms persist as unified entities despite the constant replacement of their material parts. A theory must account for this persistence of composite identity through part change.
      *   **Negotiability:** **Non-negotiable** for biologically plausible theories. Essential for accounting for identity over time in living systems.

  3.  **Quantum-Entangled Pairs (e.g., electrons in a singlet state):**
      *   **Motivation:** Quantum mechanics presents entities whose states are fundamentally interdependent in a way that transcends spatial separation. Does this non-local unity constitute composition, creating a novel composite object, or is it a relation between distinct simples? The theory must engage with this challenge to classical mereology.
      *   **Negotiability:** **Contextually Negotiable.** While the case *must be addressed* and cannot be contradicted, the *correct classification* (composite or not) is contentious and tied to interpretations of QM. A theory *must not* contradict the empirical phenomena of entanglement.

  4.  **Functional Aggregates / Synthetic Biology Consortia (e.g., engineered bacterial communities where individual cells retain independent metabolism but collectively perform a complex function like toxin degradation):**
      *   **Motivation:** Emerging synthetic biology and ecology present "grey area" cases lacking clear physical bonding or traditional organismal unity, yet exhibiting coordinated behaviour and functionality at a higher level. A theory must specify if/when such coordinated functionality, absent traditional unity criteria, suffices for composition.
      *   **Negotiability:** **Negotiable.** This tests the boundaries of composition and reflects evolving scientific practice. Different theories may reasonably classify these differently, but the case must be handled consistently within the theory's framework. Failure to engage with such cases diminishes adequacy for contemporary metaphysics/science.

  **II. Conceptual Distinctions (Must preserve these differences):**

  5.  **Genuine Composite vs. Mere Collection (e.g., a functioning watch vs. a pile of its disassembled parts scattered randomly):**
      *   **Motivation:** Intuition and language sharply distinguish unified wholes from arbitrary heaps. A theory must explain what constitutes the relevant unity or "holding together" that marks a composite.
      *   **Negotiability:** **Non-negotiable.** This distinction is fundamental to the very concept of a composite object. A theory collapsing this distinction (like radical nihilism or unrestricted composition) faces severe intuitive and explanatory costs.

  6.  **Temporary vs. Essential Parts (e.g., a removable ship's plank vs. the keel arguably essential to being *that* ship):**
      *   **Motivation:** Persistence conditions and de re modality (e.g., "This ship could not exist without its keel") rely on distinguishing parts an object can lose while remaining itself from those it cannot.
      *   **Negotiability:** **Negotiable.** While the *phenomenon* of parts differing in their modal status must be acknowledged, whether *essential* parts exist (or are fundamental to composition itself) is debated (e.g., contingent identity views). A theory must be compatible *with the possibility* of this distinction holding for some objects.

  7.  **Being Composed of Parts vs. Being Part of a Larger System (e.g., a heart is *composed of* cells but *is part of* a circulatory system *which is part of* an organism):**
      *   **Motivation:** Composition is hierarchical and directional. Confusing the relation of parthood (a heart being part of an organism) with the relation of composition (an organism being composed of organs, including the heart) leads to category errors. The theory must maintain the asymmetry of the part-whole relation.
      *   **Negotiability:** **Non-negotiable.** This is a core logical feature of mereological relations that any adequate theory must respect.

  **III. Scientific Constraints (Must be compatible with these findings):**

  8.  **Physics Compatibility (Relativity, Quantum Mechanics):**
      *   **Motivation:** Metaphysical theories cannot contradict well-established physical theories. Composition cannot rely on absolute simultaneity (forbids by Relativity), must accommodate non-local phenomena like entanglement (QM), and must be consistent with the nature of fundamental particles/fields.
      *   **Negotiability:** **Non-negotiable.** Contradiction of fundamental physics renders a theory empirically inadequate.

  9.  **Biology Compatibility (Evolution, Process Ontology, Autopoiesis):**
      *   **Motivation:** Organisms are prime examples of composites. Theories must be compatible with evolution (gradual emergence of complex composites), the processual and dynamic nature of living systems (constant flux of parts, metabolism), and concepts like autopoiesis (self-maintaining boundaries).
      *   **Negotiability:** **Non-negotiable** for theories claiming biological relevance. Severely constrains views requiring strict spatial contiguity or immutability.

  10. **Non-Ad Hocness / Autonomy:**
      *   **Motivation:** The criteria for composition should be general, principled, and not rely on gerrymandered or anthropocentric exceptions solely to capture intuitive cases. The theory should provide a *reason* why composition occurs when it does.
      *   **Negotiability:** **Non-negotiable (Methodological).** A theory failing this lacks explanatory power and is metaphysically unsatisfying.

  **IV. Potential Tensions (Pairs that may be jointly unsatisfiable):**

  *   **Preserving Sharp Composite/Collection Distinction + Accommodating Functional Aggregates/Consortia:** Defining a clear, non-arbitrary boundary that includes paradigmatic organisms/artefacts but excludes mere collections, while also cleanly classifying "grey area" functional aggregates, is extremely challenging. Overly strict unity criteria might exclude consortia; overly weak criteria might include mere collections.
  *   **Non-Negotiable Physics Compatibility (esp. QM Non-Locality) + Classical Object Paradigms (Artefacts/Organisms):** Reconciling the holistic, non-separable nature described by QM with the classical intuition of clearly bounded, localized composite objects (like chairs or cats) creates tension. Theories privileging classical objects may struggle with QM cases; theories taking QM holism as fundamental may struggle to recover classical objects.
  *   **Non-Ad Hocness + Capturing All Intuitive Cases:** Avoiding ad hoc exceptions while correctly classifying *both* highly unified organisms *and* looser functional aggregates *and* quantum pairs *and* excluding mere collections might require criteria complex enough to appear ad hoc to critics. Simplicity and comprehensive intuitive coverage often pull in opposite directions.
  *   **Biological Processual Nature + Essential Parts:** If organisms are fundamentally dynamic processes in constant flux, the notion of *essential* material parts becomes highly problematic, conflicting with intuitions about artefact identity.

  **Brief Indicative Scoring Against Criteria (Emphasis on Criteria):**

  *   **Unrestricted Composition (UC):** Satisfies Classificatory Demands 1-4 trivially (everything composes something). Fails Distinctions 5 & 6 catastrophically (no distinction between composite/collection or temporary/essential parts). Preserves Distinction 7 logically. Compatible with Physics 8 on some interpretations (if spacetime regions compose). Challenges Biology 9 (doesn't distinguish organisms from random aggregates). Fails Non-Ad Hocness 10 (criteria is vacuous).
  *   **Nihilism (No Composite Objects):** Fails Classificatory Demands 1-4 entirely (denies composites exist). Preserves Distinction 5 vacuously (no composites, so no confusion). Distinctions 6 & 7 become moot or reinterpreted (only simples exist). Compatible with Physics 8 (avoids problems with complex objects). Compatible with Biology 9 only via radical revisionism (organisms aren't objects). Satisfies Non-Ad Hocness 10 minimally.
  *   **Restricted Biological View (e.g., Composition only when Life/Causal Integration):** Satisfies Demand 1 (if artefacts included via functional analogy, else fails). Excels at Demand 2. Struggles with Demands 3 (QM) & 4 (Consortia - are they 'alive' enough?). Preserves Distinction 5 well (life provides strong unity). Struggles with Distinction 6 (essential parts in flux). Preserves Distinction 7. Compatible with Biology 9. May struggle with Physics 8 (non-locality). Risks Ad Hocness 10 if defining 'life/integration' precisely enough becomes messy or excludes physics cases.

  This framework provides the necessary structure for rigorous comparison. The tensions highlight where theoretical trade-offs are inevitable, forcing proponents to defend their priorities. The non-negotiable constraints (especially scientific compatibility and core distinctions) significantly limit viable options, while the negotiable aspects allow for distinct philosophical emphases in developing a theory.
