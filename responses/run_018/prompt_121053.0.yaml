answer: |-
  Below is a one-page handout designed as a decision tree to guide students from the case of pain asymbolia (where a person reports a pain sensation but feels no unpleasantness) to a named philosophical position on the badness of pain. The tree uses your three variant cases (twins, mirror, and informed) to distinguish views, with about seven branch questions and eight possible leaves (positions). The questions are phrased to avoid jargon, relying on intuitive descriptions of the cases. Commitments are based on taking all cases at face value (no lying, confabulation, or misuse of words).

  ### Decision Tree: What Makes Pain Bad?  
  *Start with the asymbolia case: A patient reports a sharp burning sensation, localizes it, rates intensity, winces, but says it doesn’t bother them—no unpleasantness, and they’d happily leave the stimulator on.*

  1. **In the informed case (patient feels no unpleasantness but says, “I know this is damaging my tissue, and I very much mind that—please stop”), does the patient’s request to stop depend on the tissue damage, not the sensation itself?**
     - **Yes** → Go to 2.
     - **No** → *Leaf 1: Sensation-based badness*. The sensation itself is bad (e.g., due to its raw feel), even without tissue damage or unpleasantness. (Unnamed; rare view where pain’s sensory properties are intrinsically bad.)

  2. **In the twins case (both report identical sensations without unpleasantness; one avoids the stimulus at small cost, the other only avoids for payment), is the avoiding twin’s button-pressing explained by a motivation to avoid the sensation?**
     - **Yes** → Go to 3.
     - **No** → *Leaf 2: Non-motivational avoidance*. The behavior isn’t driven by motivation (e.g., it’s reflexive, habitual, or incentivized by payment). (Unnamed; implies avoidance can occur without desire or discomfort.)

  3. **In the twins case, is the difference in motivation (one avoids at small cost, the other doesn’t) due to a difference in their sensation?**
     - **Yes** → *Leaf 3: Traditional view*. Pain’s badness is an intrinsic unpleasantness quale (a “felt badness” in the sensation itself); the twins must have different sensations despite reports, or the avoiding twin has residual unpleasantness. (Settled name: Traditionalism or intrinsic badness view.)
     - **No** → Go to 4. (Reports are identical, so motivation must stem from elsewhere.)

  4. **In the mirror case (patient reports agony and says they want it to stop more than anything, but shows no withdrawal, flinching, or action to stop it), does the patient have a motivation to stop the pain?**
     - **Yes** → Go to 5. (They say they want it to stop, so motivation is present.)
     - **No** → *Leaf 4: Imperativism (strong)*. Pain’s badness is a command (e.g., “Stop this!”) that directly motivates action; in the mirror case, the command/motivation is missing or defective. (Settled name: Imperativism.)

  5. **In the mirror case, does the motivational state (from Q4) explain why the pain feels bad?**
     - **Yes** → Go to 6.
     - **No** → *Leaf 5: Evaluativism*. Pain’s badness is a representation of tissue damage as bad (like a judgment), independent of motivation; the mirror case has badness without motivation. (Settled name: Evaluativism.)

  6. **Is this motivational state (from Q4) part of the pain experience itself?**
     - **Yes** → Go to 7.
     - **No** → *Leaf 6: Desire-based view*. Pain’s badness lies in a separate desire (e.g., “I want this to stop”); the sensation isn’t bad until you have this attitude. (Settled name: Desire-based view or attitudinal view.)

  7. **In the plain asymbolia case, does the pain sensation provide information about tissue damage?**
     - **Yes** → *Leaf 7: Hybrid motivational view*. Pain’s badness combines a sensory signal (e.g., “damage here”) with a motivational command (e.g., “fix this!”); in asymbolia, the command is missing. (Settled name: Imperativism or motivational aspect view.)
     - **No** → *Leaf 8: Purely sensory view*. Pain is just a neutral signal (e.g., “heat here”); badness comes from beliefs or desires about damage, not sensation. (Unnamed; asymbolia is “normal” and pain is never inherently bad.)

  ---

  ### Key to Leaves (Positions)
  - **Leaf 1: Sensation-based badness** (unnamed): Badness is an intrinsic property of the sensory qualities (e.g., burning feels bad by itself). Explains asymbolia as a lack of this property.
  - **Leaf 2: Non-motivational avoidance** (unnamed): Avoidance isn’t about motivation; behavior is driven by non-mental factors (e.g., reflexes or incentives). Rare view.
  - **Leaf 3: Traditional view**: Badness is an unpleasantness quale (intrinsic to sensation). Explains asymbolia as missing this quale; twins case requires sensation differences.
  - **Leaf 4: Imperativism (strong)**: Badness is a command to act (e.g., “Stop!”); it must motivate. Mirror case is problematic unless command is absent.
  - **Leaf 5: Evaluativism**: Badness is representing damage as bad (like a belief). Explains asymbolia as missing this evaluation; mirror case shows badness without motivation.
  - **Leaf 6: Desire-based view**: Badness is in a separate desire to avoid. Explains asymbolia as lacking this desire; twins case shows desires can vary independently.
  - **Leaf 7: Hybrid motivational view (imperativism)**: Badness is a motivational command tied to sensory data. Explains asymbolia as a missing command; mirror case may involve a command without action.
  - **Leaf 8: Purely sensory view** (unnamed): Pain is neutral sensory input; badness comes only from cognitive judgments (e.g., about damage). Asymbolia is unproblematic.

  ---

  ### Notes for the TA
  **Pairs of leaves the tree cannot separate**:  
  - **Traditional view (Leaf 3) and Evaluativism (Leaf 5) both “shrug off” plain asymbolia**: They both explain it as a missing component (unpleasantness or evaluation), but the tree separates them via the mirror case (Q5). If you answered “no” to Q5 (motivation doesn’t explain badness), you reach evaluativism; if you answered “yes” earlier, you’re on a different path.  
  - **Desire-based view (Leaf 6) and Imperativism (Leaf 7) both explain the twins case**: They both allow motivation to vary without sensation differences. The tree distinguishes them using the mirror case (Q4–Q6): desire-based views can handle motivation without action (Q4 “yes” → Q6 “no”), while imperativism typically ties motivation more closely to action (Q4 “no” → Leaf 4 or Q7). *To pry them apart further*: Use a case where motivation is present but feels involuntary (e.g., “I can’t help but want it to stop” supports imperativism; “I dislike it by choice” supports desire-based).  

  **Shaky branch decisions (handle with care)**:  
  - **Q4 (mirror case: motivation present?)**. I’m least confident here because “wanting to stop” could be interpreted as motivation (even without action). If students debate whether the mirror patient is truly motivated, the tree could mislead. *Redraw if*: Empirical work shows such patients lack motivation (supporting Leaf 4) or always have it (supporting Leaf 6/7).  
  - **Q3 (twins: sensation difference?)**. Assumes reports are reliable, but if asymbolics vary in subtle experiential ways (e.g., intensity), this could force a “yes” to Leaf 3 prematurely. *Redraw if*: Evidence shows asymbolics differ in first-person reports beyond what we assumed.  
  - **Q7 (asymbolia: sensation provides damage info?)**. In asymbolia, patients can localize/discriminate, suggesting sensory damage info. But if damage info is purely cognitive, Q7 may be irrelevant. *Redraw if*: Cases show asymbolics lack sensory damage representation (e.g., they can’t localize).  

  **General notes**:  
  - The tree prioritizes your cases to avoid textbook summaries; positions are labeled only when settled.  
  - Logical space: All combinations are covered, but Leaf 2 (non-motivational avoidance) is “empty” in practice—no major theory holds it, as it ad-hocly explains behavior without mental states.  
  - Encourage students to revisit cases if answers seem inconsistent (e.g., if Leaf 3 feels forced, reconsider Q3).  
  - Handout is neutral; use in seminar to stimulate debate, not as definitive.  

  [End of handout]
