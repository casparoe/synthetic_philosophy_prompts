answer: |-
  Your observation captures a fundamental tension in modern systematics: **a cyclical conflict between lineage-based (phylogenetic) and functional/ecological species concepts**, amplified by technological advances in genomics. While no single term perfectly describes this *cycle*, the phenomenon can be precisely defined and distinguished from related concepts.

  **Proposed Definition & Name:**

  *   **Phenomenon:** **Reciprocal Taxonomic Displacement Driven by Genomic-Ecological Discordance (RTD-GED)**
  *   **Definition:** *A cyclical pattern in species delimitation where:*
      1.  *Advancements in genomic resolution reveal previously undetected, environmentally correlated population structure within a morphologically uniform taxon.*
      2.  *This structure is interpreted as evidence for multiple independent evolutionary lineages (e.g., under the Phylogenetic Species Concept - PSC), leading to taxonomic splitting.*
      3.  *Subsequent functional ecological and reproductive studies demonstrate persistent niche conservatism, unimpeded gene flow upon secondary contact, and high hybrid fitness, indicating cohesion under the Biological (BSC) or Ecological Species Concepts (ESC).*
      4.  *This discordance triggers taxonomic debate, often resulting in re-lumping or alternative designations (ESUs, etc.), restoring the original or an intermediate classification.*
      5.  *The cycle repeats with further genomic advancements (e.g., more loci, whole genomes, SNPs) revealing finer-scale structure, restarting the process.*

  **Key Distinguishing Features & Boundary Conditions:**

  1.  **Core Discordance:** The central conflict is between **deeply divergent genomic lineages** (indicating long-term separation/historical isolation) vs. **persistent functional/ecological/reproductive cohesion** (indicating no current barriers to gene flow or niche differentiation). This is *not* transient hybrid zones or partial isolation; it's fundamental discordance.
  2.  **Environmental Correlation ≠ Isolation:** The genetic divergence is correlated with environmental gradients (e.g., temperature clines, salinity regimes) but *this divergence itself does not cause intrinsic reproductive isolation or significant niche differentiation*. The populations are locally adapted *genetically* but remain *ecologically and reproductively* compatible. This distinguishes it from cases where environmental gradients *do* drive speciation (e.g., via selection against migrants/hybrids).
  3.  **Absence of Morphological Change:** Morphological conservatism is typical, though not always absolute (subtle differences may exist but are deemed insufficient for traditional delimitation). This distinguishes it from cases where cryptic species *are* later found to have subtle but consistent morphological or behavioral diagnostic characters.
  4.  **Technology as Catalyst:** The cycle is fundamentally driven by *differential resolution* and *differential pace* of data acquisition. Genomic data rapidly reveals fine-scale structure, while robust ecological/experimental validation of reproductive isolation and niche differentiation is slower and logistically harder.
  5.  **Cyclical Instability:** The pattern is defined by its *recurrence* with improving technology, leading to repeated splitting and subsequent (partial or full) lumping based on conflicting data. It's not a one-time event.

  **Distinction from Related Concepts:**

  *   **Cryptic Species Discovery:**
      *   *What it is:* Discovery of genetically distinct, reproductively isolated species lacking discernible morphological differences.
      *   *Distinction:* Cryptic species discovery implies *reproductive isolation is confirmed or strongly inferred*. RTD-GED specifically involves the *lack* of demonstrated reproductive isolation or niche divergence *despite* deep genetic structure. Cryptic species are the *initial hypothesis* in RTD-GED, but the subsequent ecological/reproductive data *falsify* that hypothesis for full species status.
  *   **Taxonomic Inflation:**
      *   *What it is:* A perceived increase in the number of recognized species due to changing species concepts (especially adopting the PSC) or methodological shifts, *without* a corresponding increase in actual biological diversity.
      *   *Distinction:* Taxonomic inflation describes the *splitting trend* and its potential causes. RTD-GED *includes* splitting (potentially inflationary) but crucially also encompasses the *subsequent pushback* (lumping) driven by ecological/reproductive data, and the *cyclical nature* tied to technology. Inflation might be a *phase* within the RTD-GED cycle, but not the cycle itself.
  *   **Integrative Taxonomy:**
      *   *What it is:* An approach aiming to delimit species by combining multiple lines of evidence (morphology, genetics, ecology, behavior, geography) to reach a consensus.
      *   *Distinction:* Integrative Taxonomy is the *prescribed solution* or *methodology*. RTD-GED describes a specific *problematic pattern* that arises *despite* attempts at integration, particularly when different data types fundamentally conflict and technological advances disrupt the consensus. It highlights the *difficulty* of integration in these specific cases.
  *   **Evolutionarily Significant Units (ESUs) / Management Units (MUs):**
      *   *What they are:* Designations below the species level for populations of conservation significance, often based on genetic distinctiveness and adaptive potential (ESUs) or demographic independence (MUs).
      *   *Distinction:* ESUs/MUs are *potential outcomes or compromise designations* proposed *during* the RTD-GED cycle to acknowledge the genetic divergence without granting full species status. They represent one way to resolve the conflict described by RTD-GED.

  **Edges of the Phenomenon:**

  1.  **Genuine Speciation Completion:** Where genomic divergence *is* accompanied by evolving reproductive isolation (even partial/ecological) or niche differentiation. This falls outside RTD-GED; the split is justified. *Boundary:* Evidence for *any* intrinsic barrier to gene flow or significant niche displacement negates RTD-GED.
  2.  **Recent Divergence with Incomplete Isolation:** Populations are diverging *and* showing some evidence of reduced gene flow/incipient isolation. RTD-GED applies when divergence is *deep* but functional cohesion is *persistent and strong*. *Boundary:* Strong evidence for *ongoing* speciation processes (e.g., selection against hybrids, assortative mating) moves it away from RTD-GED.
  3.  **Morphologically Cryptic *but* Isolated Species:** Where genomic divergence *does* correspond to reproductive isolation, even without morphological change. This is true cryptic speciation, not RTD-GED. *Boundary:* Confirmation of reproductive isolation settles the question.
  4.  **Widespread Panmixia:** Where even high-resolution genomics shows no significant geographically structured divergence. No splitting occurs, so no cycle. *Boundary:* The absence of deep population structure halts the cycle before it starts.
  5.  **Ancient Hybridization/Introgression:** Complex histories involving past gene flow can create genomic patterns resembling divergence without lineage independence. While this can *cause* the discordance observed in RTD-GED, the phenomenon is defined by the *pattern and cycle of taxonomic instability* it triggers, regardless of the specific evolutionary cause of the discordance.

  **In essence, RTD-GED describes the recurring taxonomic instability arising specifically from the tension between the evidence for long-term, environmentally-associated lineage separation provided by modern genomics and the persistent evidence for functional, ecological, and reproductive cohesion provided by organismal biology.** It is a consequence of applying lineage-based concepts (PSC) to populations where local adaptation has occurred without triggering speciation mechanisms, coupled with the rapid pace of genomic discovery outpacing ecological validation. Naming it highlights this specific conflict and its cyclical, technology-driven nature within systematics.
