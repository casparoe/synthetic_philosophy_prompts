prompt: |-
  Your a expert on political philosophy, especially public reason stuff. Im grading a students answer and need your help — pls think step by step and do a quick brainstorm first about what mistakes a hasty grader might miss. The exam question was: "How does Rawls's duty of civility restrict religious arguments in politics, and how does Habermas's translation proviso alter that restriction — particularly regarding the so-called epistemic asymmetry between secular and religious citizens?"

  The student wrote:
  "Rawls says religious citizens have a duty of civility, so they cant vote on faith alone and need public reasons eventually; his proviso lets them use religious language temporarily if they back it up later. Habermas agrees but demands that religious people translate everything into secular language before entering formal institutions like parliament. The epistemic asymmetry means secular citizens dont face this burden because their values are already in the universal language of reason. So Habermas is stricter, placing all the cognitive labor on religious participants."

  Grade this (out of 10) with specific point-by-point comments. If my task is confused or rests on a bad premise, just say so plainly — dont go along with it politely. Keep it to max 180 words, one paragraph, start with the grade.
reasoning: |-
  Alright, the user wants me to grade a student's answer about Rawls and Habermas on religious arguments in politics. Let me start by recalling both philosophers' positions.

  First, Rawls's duty of civility requires citizens to use public reasons, not just religious ones, in political decisions. His proviso allows religious reasons temporarily if they're supplemented by public reasons later. The student mentions this correctly but oversimplifies by saying "eventually" without emphasizing the need for timely public justification.

  Next, Habermas's translation proviso: the student says religious people must translate everything into secular language before formal institutions. But Habermas actually requires translation only in institutional contexts, not in informal public discourse. Also, the student misses that Habermas expects secular citizens to engage with religious contributions, not just place the burden on religious ones.

  Epistemic asymmetry: the student notes secular citizens don't have the translation burden because their reasons are already in rational language. That's correct. However, they overlook Habermas's point about secular citizens needing to remain open to religious perspectives in the informal public sphere.

  The student claims Habermas is stricter, which is true, but misses the cooperative aspect where secular citizens also have responsibilities. The grade should be around 6/10 for hitting key points but missing nuances like the institutional vs. informal distinction and secular citizens' role. I should point out these omissions and inaccuracies in the feedback.
answer: |-
  **Grade: 6/10**

  The answer correctly identifies Rawls's duty of civility and proviso's temporary allowance (though "eventually" understates the need for timely public justification). It accurately notes Habermas demands translation *for institutional settings* and identifies the epistemic asymmetry burdening religious citizens. However, key errors/omissions cost points: 1) Habermas *only* requires translation for formal institutions like parliament, *not* the broader informal public sphere where religious reasons can enter untranslated; 2) It misses that Habermas expects *secular citizens* to make an effort to understand and engage with religious contributions *in the informal sphere*, not placing *all* cognitive labor on religious citizens. The "everything" and "all the cognitive labor" claims are inaccurate oversimplifications regarding Habermas's cooperative framework. The core asymmetry point is stated but lacks depth on Habermas's reciprocal expectations.
