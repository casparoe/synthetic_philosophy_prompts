  The user's instinct is dead-on: the chapter makes two unargued leaps. First, from "not constitutive of judgment" to "cannot justify belief." Second, from "not evidence" (which is false) to "rationally indefensible." A careful pessimist might maintain that testimonial beliefs lack aesthetic authority, but couldn't call them irrational without additional premises about aesthetic normativity.

  So to answer their final question: no, the chapter's strong conclusion doesn't follow from the valid premises. The autonomy thesis alone can't support epistemic irrationality. What's needed is either a further argument that aesthetic beliefs require feeling-based justification (which some pessimists attempt) or a concession that testimonial beliefs are rational but "second-rate" in a non-epistemic sense. 

