prompt: |-
  hey, I work as a reliability engineer at a water treatment plant and we keep arguing about whether a new sensor glitch is "the same mechansim" as last quarter's failure or something totally different, because our SOP says same root cause gets a patch, different one stops everything and calls the state regulator. I want a decision procedue my shift team can actually run in 20 min with zero philosophy background, based on the mechanistic philosophy idea that mechanisms are entities and activities organized to produce a phenomenon — but with a twist we added: we care about organizational sameness vs phenomenal sameness, meaning two failures match if they share the organizational pattern even with different parts, but we only call them identical if the same entities and activities are involved. Write the ordered checklist: the questions in sequence, what counts as a sufficient answer at each step, where it outputs "apply patch," "escalate to regulator," or "hand to human — values call," and where it explicitly stops because the data is missing. Then run it on three cases: chlorine sensor false lows from biofilm buildup (this happened last year), the same sensor giving false lows right after a firmware update changed the calibration curves, and a pump vibration that looks exactly like bearing wear but might actually be cavitation. Make sure one of these comes back with an answer my team won't like. Finish by saying what the procedue can't settle no matter how good the inputs are.
reasoning: |-
  We are creating a decision procedure for determining whether a new sensor glitch is the "same mechanism" as a previous failure. The procedure is based on the mechanistic philosophy, with the twist that we care about "organizational sameness" (same organizational pattern) versus "phenomenal sameness" (same entities and activities). 

  Definitions:
  - **Same Mechanism (for organizational pattern)**: The failure occurs due to the same arrangement of entities and activities, even if the specific parts are different. This leads to applying a patch.
  - **Different Mechanism**: The failure occurs due to a different arrangement or a different set of activities. This requires escalation to the regulator and stopping everything.
  - **Identical Mechanism**: The same entities and activities are involved (exactly the same parts and actions). This would also be considered the same mechanism organizationally and phenomenally, so apply a patch.

  However, note that our procedure only requires organizational sameness (same pattern) to apply a patch. If the mechanism is identical (same entities and activities) then it is a subset of organizational sameness. But if the organizational pattern is the same but the entities are different (e.g., a different sensor but same kind of failure pattern) then it is still the same mechanism for our purposes.

  But note: the SOP says:
  - Same root cause (which we interpret as same mechanism in the organizational sense) -> apply patch.
  - Different root cause -> escalate to regulator.

  Additionally, we have a third outcome: "hand to human — values call" when the decision is not clear or involves value judgments.

  The procedure must run in 20 minutes and be executable by a shift team without philosophy background.

  We design a checklist of questions in sequence. At each step, if we get a sufficient answer, we output the decision. Otherwise, we continue until we hit a stopping point due to missing data.

  **Decision Procedure Checklist:**

  1. **Question 1: Is the phenomenon (the failure mode) the same?**
     - *Explanation*: We are asking if the observed failure (e.g., false low reading) is the same as the previous failure.
     - *Sufficient Answer*: 
