        - Therefore, organizational pattern is not the same -> **Escalate to regulator**.

  **Case 3: A pump vibration that looks exactly like bearing wear but might actually be cavitation.**
  - Background: Last quarter's failure was bearing wear (which caused vibration). Now we have a vibration that we are not sure if it's bearing wear (same as last time) or cavitation (a different cause).

    - Step 1: Phenomenon same? The phenomenon is vibration (and it looks exactly like bearing wear). So the observed failure (vibration) is the same as last time? Yes, because last time the phenomenon was vibration due to bearing wear. Now we see vibration again. So phenomenon same? Yes.

    - Step 2: Entities and activities same? 
        - Last time: entities were the bearing (and pump), activity was wear of the bearing.
        - This time: if it's bearing wear again, then same. But we don't know. We are uncertain. So we cannot say yes. We have to say uncertain because we don't know the cause yet. So we go to Step 3.

    - Step 3: Organizational pattern same? 
        - We are uncertain because we don't know if the current vibration is due to bearing wear or cavitation.
          - If it's bearing wear: pattern would be the same (mechanical wear causing vibration).
          - If it's cavitation: pattern is different (formation of vapor bubbles that collapse causing shock waves and vibration). 
        - We don't have enough data to know. So we are uncertain.

    - Therefore, we output: **Hand to human — values call**.

  Now, note that one of these should come back with an answer the team won't like. In Case 2, we have to escalate to the regulator because it's a different mechanism. The team might not like that because they may have thought it's just a sensor issue and they could patch it.

  Finally, what the procedure can't settle no matter how good the inputs are:

  - The procedure relies on the team's ability to observe and describe the entities, activities, and organizational patterns. It cannot account for cases where the organizational pattern is ambiguous or when the same phenomenon might be produced by two fundamentally different patterns that are hard to distinguish without deeper analysis. Also, the procedure does not handle cases where the same organizational pattern is present but the phenomenon is slightly different (though we require the phenomenon to be the same at step 1). Additionally, the procedure requires that we have a clear understanding of the previous failure's mechanism. If the previous failure was misdiagnosed, the procedure might lead to incorrect outcomes.

  **Final Checklist in Ordered Steps:**

  1. **Is the failure phenomenon (the observed problem) the same as the previous incident?**
     - Yes: Go to 2.
     - No: **Escalate to regulator**.
     - Uncertain: Go to 2.

  2. **Are the entities (parts) and activities (processes) involved in the current failure exactly the same as in the previous incident?** (e.g., same sensor, same type of buildup, same software version, same calibration method)
     - Yes: **Apply patch**.
     - No: Go to 3.
     - Uncertain: Go to 3.

  3. **Is the organizational pattern (how the entities and activities are arranged and interact to produce the failure) the same as in the previous incident?** (Even if the specific parts are different, is the way they interact and cause the failure the same?)
     - Yes: **Apply patch**.
     - No: **Escalate to regulator**.
     - Uncertain: **Hand to human — values call**.

  **Stopping for missing data**: If at any step the required data is missing and the team cannot determine the answer, they should stop and output **Hand to human — values call**.
answer: |-
  ### Decision Procedure Checklist for "Same Mechanism" Determination  
  Based on mechanistic philosophy (entities + activities → phenomenon) with your twist: **Organizational sameness** (same pattern of interactions) counts as "same mechanism," while **identical mechanism** requires the same specific entities/activities. Designed for speed (<20 min) and clarity.

  #### Ordered Checklist  
  **Instructions**: Answer each question in sequence. Stop early if a conclusive answer is reached. If data is missing, skip to "Hand to human." Use existing failure logs/team knowledge.

  1. **Is the observed phenomenon (failure symptom) identical to the previous incident?**  
     - *Sufficient answer*:  
       - **Yes** → Proceed to Question 2.  
       - **No** → **Escalate to regulator** (different failure = different root cause).  
       - **Unclear/missing data** → Skip to "Hand to human."  
     - *Why?* Phenomena must match to even compare mechanisms. Example: "False low chlorine reading" ≠ "pump vibration."

  2. **Are the core entities (physical/virtual components) and activities (processes/actions) IDENTICAL to the previous incident?**  
     - *Sufficient answer*:  
       - **Yes** → **Apply patch** (identical mechanism).  
       - **No** → Proceed to Question 3.  
       - **Unclear/missing data** → Proceed to Question 3 (organizational check may still apply).  
     - *Why?* Identical entities/activities = same root cause. Example: Same sensor + same biofilm buildup activity.

  3. **Is the organizational pattern (how entities/activities interact to cause the failure) the SAME, even if specific parts differ?**  
     - *Sufficient answer*:  
       - **Yes** → **Apply patch** (organizationally same mechanism).  
       - **No** → **Escalate to regulator** (new root cause).  
       - **Unclear/missing data** → **Hand to human — values call**.  
     - *Why?* Organizational sameness defines "same mechanism" per your twist. Example: "Biofilm interfering with any sensor" is the same pattern, even if sensors differ.

  #### Output Summary  
  - **Apply patch** → Same mechanism (identical or organizational match).  
  - **Escalate to regulator** → Different mechanism.  
  - **Hand to human — values call** → Missing data, ambiguous answers, or edge cases needing judgment.  

  ---

  ### Run the Procedure on Three Cases  
  **Assumptions**:  
  - Last quarter’s failure: Chlorine sensor false low due to biofilm buildup.  
  - Team knowledge: Biofilm = organic growth; cavitation = vapor bubbles collapsing; firmware update = software change.  

  #### Case 1: Chlorine sensor false lows from biofilm buildup (same as last year)  
  1. **Phenomenon identical?**  
     - Observed: False low chlorine reading (same as last quarter). → **Yes** → Proceed.  
  2. **Entities/activities identical?**  
     - Entities: Same sensor type, same location. Activities: Biofilm buildup blocking detection. → **Yes** → **Apply patch**.  
     - *Output: Apply patch (identical mechanism).*  

  #### Case 2: Same sensor false lows after firmware update changed calibration curves  
  1. **Phenomenon identical?**  
     - Observed: False low chlorine reading (same as last quarter). → **Yes** → Proceed.  
  2. **Entities/activities identical?**  
     - Entities: Same physical sensor. Activities: Firmware update altered calibration (software activity), not biofilm. → **No** → Proceed.  
  3. **Organizational pattern same?**  
     - Previous pattern: *External contaminant (biofilm) physically obstructs sensor reading*.  
     - Current pattern: *Software miscalibration (algorithm error) skews sensor reading*.  
     - Patterns differ: Physical vs. digital cause. → **No** → **Escalate to regulator**.  
     - *Output: Escalate to regulator (different mechanism).*  
     - **Why your team won’t like this**: It’s the same sensor/symptom, but the root cause (software vs. biofilm) is organizationally distinct. SOP forces escalation despite superficial similarity.  

  #### Case 3: Pump vibration resembling bearing wear (but possibly cavitation)  
  1. **Phenomenon identical?**  
     - Observed: Vibration (same as last quarter’s bearing wear). → **Yes** → Proceed.  
  2. **Entities/activities identical?**  
     - Entities: Same pump? Activities: If bearing wear, same as last time. But cause is unclear ("might be cavitation"). → **Unclear** → Proceed.  
  3. **Organizational pattern same?**  
     - Previous pattern (bearing wear): *Mechanical friction (bearing degradation) generates vibration*.  
     - Possible current pattern (cavitation): *Fluid dynamics (vapor bubble collapse) generates vibration*.  
     - Ambiguity: "Looks exactly like bearing wear" but mechanism unknown. → **Unclear/missing data** → **Hand to human — values call**.  
     - *Output: Hand to human — values call (insufficient data to confirm/deny organizational match).*  

  ---

  ### What This Procedure Can’t Settle (Even with Perfect Inputs)  
  1. **Ambiguous organizational boundaries**: If two patterns are functionally similar but philosophically distinct (e.g., "software glitch" vs. "sensor drift"), the line between "same" or "different" organization may require subjective interpretation.  
  2. **Emergent phenomena**: Failures arising from complex system interactions (e.g., network effects) may defy simple entity/activity categorization.  
  3. **Value trade-offs**: E.g., "Is a minor firmware tweak 'organizationally different' enough to justify regulator escalation?" This needs human judgment.  

  **Final Note**: This procedure prioritizes safety (escalating new risks) and efficiency (patching known issues). It explicitly avoids philosophy by using observable entities/activities, but human judgment is still essential for edge cases.
