answer: |-
  Here are 8 targeted interview questions addressing your guest's "doctrinal bottleneck" theory, including the three specified areas with follow-ups, plus my committed stance on its significance:

  **Core Questions & Follow-Ups:**

  1.  **The Bottleneck & Mystical Persistence:** "You argue institutions filter raw charismatic experiences (visions, revelations) through creeds and hierarchies. Yet mystics like Teresa of Ávila or Sufi poets thrived *within* highly doctrinal traditions. How does your 'doctrinal bottleneck' account for the persistence, even valorization, of intensely personal, unfiltered experiences *inside* the very institutions designed to constrain them?"
      *   *Likely Answer:* Institutions strategically "canalize" or partially incorporate certain charismatic elements to harness their energy while minimizing disruption, creating sanctioned paths (e.g., monasticism, approved mysticism) that act as pressure valves.
      *   **Follow-Up:** "Doesn't this 'sanctioned mysticism' risk becoming just another layer of doctrine itself? Isn't Teresa's experience *mediated* by Augustinian theology? Doesn't this suggest the 'raw' experience is fundamentally transformed *by* the institutional context, making pure 'unfiltered' output a myth even for insiders?"

  2.  **'True' Religion & the Charismatic Core:** "If spontaneous experiences are the 'raw cognitive outputs' and institutions survive by *filtering* them out, does your model imply that 'authentic' or 'truer' religious phenomena are *only* found in the unfiltered, charismatic moment – that institutional religion is inherently a diluted or secondary artifact?"
      *   *Likely Answer:* She'll reject the "truer" label but emphasize the *primacy* of the charismatic experience as the generative source. Institutions are necessary for stability and transmission but represent a *derivative*, controlled form.
      *   **Follow-Up:** "If the institution is derivative and controls the source, doesn't that inherently make it a *compromise* or even an *impediment* to the 'pure' religious impulse generated by our cognition? Is the institutional form, by your definition, necessarily less 'religious' in its experiential core than the spontaneous event?"

  3.  **Bottleneck vs. Evolutionary Psychology (Cooperation):** "Standard evolutionary psychology often invokes group selection or costly signaling to explain large-scale religious cooperation. If your 'doctrinal bottleneck' is key to institutional survival, what fundamental flaw does this reveal in those standard EP accounts of religion-enabled cooperation?"
      *   *Likely Answer:* EP often assumes religious beliefs/behaviors *directly* cause cooperation via innate mechanisms. The bottleneck shows cooperation depends *critically* on *culturally constructed institutional scaffolding* (creeds, hierarchies) that *manage* the volatile raw material. It's not innate belief in gods driving cohesion, but the *institutional control system* built *around* (and often *against*) those beliefs' chaotic origins.
      *   **Follow-Up:** "So, are you arguing that large-scale cooperation isn't driven by evolved psychology *for* religion per se, but by evolved capacities for *institution-building* and *norm-stabilization* that co-opt the byproducts? Does this mean 'religion' as a cooperative force is an *emergent property of institutional management*, not a direct cognitive adaptation?"

  **Additional Depth Questions:**

  4.  "The 'bottleneck' metaphor suggests constraint. But could this filtering also be *generative*? Does imposing doctrine on spontaneous experience actually *create* new, complex theological concepts or ritual forms that wouldn't arise from raw experience alone?"
  5.  "Canonical texts are central to your bottleneck. How do you explain the emergence of *new* world religions? Does your model imply that founders (Muhammad, Joseph Smith) uniquely bypassed the bottleneck initially, only for their *own* revelations to become the new filter for subsequent generations? Isn't that paradoxical?"
  6.  "If the bottleneck is essential for institutional survival by *suppressing* novelty, how do religions ever reform or adapt? Does successful reform always involve a temporary *collapse* or *widening* of the bottleneck (like the Reformation), inherently risking schism?"
  7.  "Cognitive Science of Religion (CSR) often sees doctrinal complexity as a later cultural overlay. Your model seems to flip this: the doctrine is the *active control mechanism* for the primitive cognitive outputs. Does this require a significant rethinking of the relationship between 'theological correctness' and intuitive belief in CSR models?"
  8.  "Critics might say the 'bottleneck' is just a redescription of religious orthodoxy. What *testable predictions* does your specific cognitive anthropological framing generate that distinguish it from standard historical or sociological accounts of institutional control?"

  **My Committed Stance on the Bottleneck vs. "Just-So Stories":**

  **Yes, the "doctrinal bottleneck" idea significantly strengthens CSR against the "just-so story" charge, primarily by reframing religion as a dynamic *process* rather than a static adaptation.** Here's why:

  1.  **Shifts from "Adaptation" to "Management":** Standard CSR byproduct theories risk being "just-so" when they vaguely posit that religion is "adaptive" because it promotes cooperation or reduces anxiety. The bottleneck theory doesn't claim religion *as a whole* is an adaptation. Instead, it identifies a *specific, observable process* (institutional filtering) that solves a *specific, identifiable problem* (the instability caused by uncontrolled charismatic outbursts). This moves from vague functionalism to a concrete mechanism with clear inputs (raw experiences) and outputs (stable institutions).
  2.  **Explains Variation & Failure:** "Just-so" stories struggle with variation. Why do some religious movements thrive and others implode? The bottleneck model directly addresses this: institutions that fail to effectively filter and stabilize charismatic energy (e.g., through schism, incoherence, or excessive suppression) *should* collapse. Success hinges on managing the cognitive outputs, not just having them.
  3.  **Grounds in Documented Mechanisms:** The processes described – creed formation, canonization, hierarchical authority suppressing dissenting revelation – are well-documented historical and ethnographic phenomena. The theory links these observable institutional behaviors *directly* to the underlying cognitive byproducts (hyperactive agency detection, etc.), providing a causal bridge from micro-cognition to macro-cultural forms. It doesn't just posit an evolutionary function; it shows *how* that function (stability) is *operationally achieved* using known cognitive and cultural tools.
  4.  **Predictive Power:** It generates testable hypotheses (as per Q8 above): e.g., religions with stricter, more centralized doctrinal controls should experience fewer schisms but potentially less charismatic vitality; periods of intense charismatic renewal should correlate with institutional instability or reform; textual canons should show evidence of suppressing or reinterpreting ecstatic elements over time.

  **In essence, the bottleneck theory saves CSR from "just-so"-ness by replacing a vague claim ("religion is adaptive for groups") with a specific, mechanistic, historically-grounded model of *how* certain cultural structures arise *in response to* the outputs of our cognitive machinery to achieve stability, thereby enabling the large-scale cooperation EP often misattributes directly to innate beliefs.** It makes the evolutionary story *process-driven* and *falsifiable*.
