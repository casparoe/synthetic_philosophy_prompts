prompt: |-
  hey — for my phd seminar on comparative nationalism and collective memory i'm trying to build a decision tree that sorts people by what they actually think about lost cause narratives, not by the labels they use. start with the commitment that cases like the Confederacy, Masada, Kosovo, and Dunkirk all share some core feature. then branch on concrete claims: does the narrative need a literal military defeat? does it serve current state legitimacy? can subaltern groups repurpose it? i want leaves like functionalist consolidation, traumatic repetition, counter-hegemonic substrate, and maybe pyrrhic strategic myth — but you decide the full set. please flag pairs the tree cant really seperate (e.g. do Dunkirk and Kosovo collapse together if you only ask about defeat?). also note any logically possible but unoccupied combos — is there a coherent purely aesthetic, apolitical stance, or is that empty? keep it to about five nodes, phrase each as a yes/no or either/or question a student could answer without knowing the taxonomy, and write it in british english. no bibliography or citations needed, just the instrument itself. (sorry if my wording's a bit messy — i've been rewriting this all morning and my brain's fried.)
reasoning: |-
  Okay, the user is working on a PhD seminar about comparative nationalism and collective memory. They want to create a decision tree that sorts people based on their actual beliefs about lost cause narratives, rather than the labels they use. They mention examples like the Confederacy, Masada, Kosovo, and Dunkirk, suggesting these all share a core feature. 

  The user wants the decision tree to have concrete yes/no questions that students can answer without knowing the taxonomy. They're looking for about five nodes, with leaves like functionalist consolidation, traumatic repetition, counter-hegemonic substrate, and pyrrhic strategic myth. They also want me to flag pairs that the tree can't separate and note any logically possible but unoccupied combos. 

  First, I need to identify the core feature that all these cases share. The common thread seems to be a narrative that transforms a historical defeat or loss into a source of collective identity or purpose. So I'll define the root as narratives that "recast military defeat or existential crisis as moral/spiritual victory for the group."

  For the branches, the user suggested questions about whether the narrative requires a literal military defeat, serves current state legitimacy, and whether subaltern groups can repurpose it. I should develop clear yes/no questions based on these themes. 

  The first question could be about the nature of the loss: "Does the narrative focus on a literal military defeat?" This would separate cases like the Confederacy and Masada from Dunkirk (which was a tactical retreat) and Kosovo (which is contested). 

  The second question could address the narrative's function: "Is the narrative primarily used to legitimise current state institutions?" This would help identify functionalist consolidation versus other uses. 

  The third question would explore adaptability: "Can subaltern/opposition groups credibly repurpose the narrative?" This would reveal counter-hegemonic uses. 

  For the leaves, I'll map the combinations to the types the user mentioned. For example: 
  - Yes to military defeat, yes to state legitimacy → Functionalist consolidation (e.g., Confederacy) 
  - Yes to military defeat, no to state legitimacy → Traumatic repetition (e.g., Masada) 
  - No to military defeat, yes to state legitimacy → Pyrrhic strategic myth (e.g., Dunkirk) 
  - No to military defeat, no to state legitimacy, yes to repurposing → Counter-hegemonic substrate (e.g., Kosovo) 

  I should also note cases the tree can't separate. For instance, without the repurposing question, Dunkirk and Kosovo both answer "no" to the military defeat question and "yes" to state legitimacy, collapsing into the same category. 

  About unoccupied combos: A purely aesthetic, apolitical stance seems unlikely because these narratives inherently serve identity or political functions. If someone answers "no" to state legitimacy and "no" to repurposing, it might be an incoherent stance or an unoccupied position. 

  The user emphasized British English, so I'll use terms like "legitimise" and "subaltern." I'll keep it to five nodes total (one root and four questions) to stay within their request. Finally, I'll structure the tree clearly with questions leading to the leaves, and include notes on limitations and unoccupied combos.
answer: |-
  Here's a decision tree instrument designed for your seminar, focusing on concrete beliefs about Lost Cause-type narratives. It uses 5 binary nodes (including the root commitment), phrased in British English for direct student use without prior taxonomy knowledge.

  **Core Commitment (Root Node):**
  *   **Question 1:** Does the group's dominant narrative fundamentally reinterpret a past historical crisis (like a defeat, retreat, or existential threat) as a source of enduring collective identity, moral purpose, or spiritual victory?
      *   *(If NO: Stop. Narrative doesn't fit the core type.)*
      *   *(If YES: Proceed. This defines the shared feature of Confederacy, Masada, Kosovo, Dunkirk, etc.)*

  **Branching Questions:**
  1.  **Question 2:** Does the narrative *require* the group to have suffered a clear, literal military defeat in the event itself? (Focus on the *event's outcome*, not subsequent interpretations).
      *   YES (e.g., Confederacy, Masada) → Go to Q3.
      *   NO (e.g., Dunkirk - evacuation, Kosovo - mythic battle/status ambiguity) → Go to Q4.
  2.  **Question 3 (Asked only if Q2=YES):** Is the narrative predominantly used *today* to legitimise or consolidate the power of the current state (or dominant national institutions) descended from/associated with the defeated group?
      *   YES (e.g., Confederate narrative used to legitimise Jim Crow/segregationist state power) → **Leaf: Functionalist Consolidation**
      *   NO (e.g., Masada - defeat is traumatic founding myth, often used against current state/establishment) → **Leaf: Traumatic Repetition**
  3.  **Question 4 (Asked only if Q2=NO):** Is the narrative predominantly used *today* to legitimise or consolidate the power of the current state (or dominant national institutions)?
      *   YES (e.g., Dunkirk - legitimises British resilience/state continuity) → **Leaf: Pyrrhic Strategic Myth**
      *   NO → Go to Q5.
  4.  **Question 5 (Asked only if Q2=NO & Q4=NO):** Can the narrative be credibly adopted and repurposed by subaltern groups (e.g., minorities, internal dissidents, opposition movements) *within* the broader society to challenge the dominant power structure?
      *   YES (e.g., Kosovo myth used by Albanian subaltern against Serbia; *Potential* for Confederate symbols repurposed by some far-right groups against federal US govt) → **Leaf: Counter-Hegemonic Substrate**
      *   NO → *Logically Possible but Likely Unoccupied Combo* (A narrative centred on crisis/defeat reinterpreted as identity, *without* a clear military defeat, *not* used by the state, *and* not adaptable by challengers. May indicate fading narrative or one serving purely niche, non-political identity functions.)

  **Tree Structure Summary:**
  ```
  Root (Q1: Core Commitment?) → YES
      ├── Q2: Literal Military Defeat Required? → YES
      │    ├── Q3: Legitimises Current State? → YES → **Functionalist Consolidation**
      │    └── Q3: Legitimises Current State? → NO → **Traumatic Repetition**
      │
      └── Q2: Literal Military Defeat Required? → NO
           ├── Q4: Legitimises Current State? → YES → **Pyrrhic Strategic Myth**
           └── Q4: Legitimises Current State? → NO
                ├── Q5: Repurposable by Subalterns? → YES → **Counter-Hegemonic Substrate**
                └── Q5: Repurposable by Subalterns? → NO → *Unoccupied / Fading Narrative?*
  ```

  **Key Notes for Your Analysis:**

  1.  **Collapsing Pairs (Tree Limitation):**
      *   **Dunkirk & Kosovo (Initial):** Without Q2, they share the root commitment. Q2 separates them: Dunkirk (Q2=NO) → Q4=YES → *Pyrrhic Strategic Myth*; Kosovo (Q2=NO) → Q4 likely NO → Q5=YES → *Counter-Hegemonic Substrate*. **Crucially:** If you *only* asked Q2 and Q4, Kosovo (often Q4=NO) and Masada (Q2=YES, Q3=NO → *Traumatic Repetition*) would *both* end up with "Q2=YES?→NO" & "Q4=NO?", collapsing together *without* Q5. Q5 is essential to separate *Traumatic Repetition* (requires defeat, Q2=YES) from *Counter-Hegemonic Substrate* (no literal defeat required, Q2=NO). **The tree relies on Q2 to prevent Masada/Kosovo collapse.**
      *   **Confederacy & Masada (Superficial Similarity):** Both Q2=YES (defeat). Q3 separates them: Confederacy usually Q3=YES (*Functionalist Consolidation*), Masada Q3=NO (*Traumatic Repetition*).

  2.  **Unoccupied/Problematic Combos:**
      *   **"Q2=NO, Q4=NO, Q5=NO":** This is flagged as potentially unoccupied. A narrative meeting the core commitment, not based on literal defeat, *not* serving state legitimacy, *and* not repurposable by challengers, struggles for coherence. It might exist as a purely nostalgic or aesthetic identity marker for a depoliticised subgroup, but its "Lost Cause" function (deriving purpose/identity from crisis) becomes weak or apolitical, arguably violating the core commitment's emphasis on collective identity/purpose. True apolitical stances likely fail Q1.
      *   **"Purely Aesthetic/Apolitical":** As noted above, this seems logically difficult *and* inconsistent with the core commitment (Q1). Narratives deriving identity/purpose from crisis are inherently political. An "aesthetic" appreciation would likely not meet Q1.

  **Design Rationale:**

  *   **Root:** Captures the essential shared feature: transforming crisis/loss into identity/purpose.
  *   **Q2:** Distinguishes narratives centred on unambiguous defeat from those using ambiguity, retreat, or symbolic victory.
  *   **Q3 & Q4:** Probe the core *political function* for the *current* dominant power structure (State Legitimacy). Separates state-supportive from state-oppositional or ambiguous uses.
  *   **Q5:** Captures adaptability and counter-hegemonic potential, crucial for comparative work (e.g., Kosovo vs. state-centric Dunkirk).
  *   **Leaves:** Derived from the combinations, describing primary functions: state-building (*Functionalist*), foundational trauma (*Traumatic*), state resilience (*Pyrrhic*), opposition resource (*Counter-Hegemonic*).

  This tree forces classification based on beliefs about narrative *requirements* (defeat?), *current function* (state legitimacy?), and *adaptability* (subaltern repurpose?), moving beyond self-applied labels like "Lost Cause" or "Founding Myth."
