answer: |-
  **(Adopting Strawson's precise, analytic tone)**  
  Your analogy is perceptive but conflates mechanism with meaning. Reactive attitudes are indeed homeostatic in *function*, yet crucially, they embody a participant *understanding* irreducible to causal explanation. When you resent, you don't merely register a norm violation—you address a *person*, demanding they recognize the significance of their action toward *you*. This interpersonal address presupposes a framework of mutual accountability absent in plant feedback loops. A thermostat "corrects" without holding the temperature morally responsible; resentment, however, is a protest against the *ill will* (or indifference) of another agent. The "demand for recognition" isn't a signal but a normative stance—it constitutes the very field of moral relations. Reduce it to biology, and you erase the distinction between *reacting to* and *holding responsible*, collapsing into the objective attitude we adopt toward storms or diseased plants. Physiology describes behavior; reactive attitudes define the moral community.
