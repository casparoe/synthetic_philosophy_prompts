prompt: |-
  hey im in a phil of mind seminar (upper-level, mostly juniors and seniors) and our prof wants us to draft practice exam questions. i want one on Dennett's multyple drafts vs the Cartesion theater, but not the usual "explain the critique" recitation thing. instead i made up this variant called the Editorial Board Model: there's no single audience in the theater, just a committee of specialized sub-agents that vote on which sensory draft gets "published" as conscious experience. there's still a privileged boardroom where the vote happens, but no central homunculus watches — publication itself is supposed to be consciousness. the point is to see whether this actually dodges Dennett's objections or just smuggles the theater back in through the voting process.

  can u write me:

  1. The exam prompt — answerable in about 90 minutes, target ~800 words, and must make students do more than summarize Dennett. specifically require them to (a) reconstruct his original "where does it all come together?" objection, (b) lay out the multyple drafts alternative, (c) analyze whether the boardroom/vote structure avoids that problem, (d) ask whether "publication" here is just a disguised Cartesian theater, and (e) take their own stand on whether the Editorial Board Model is a coherent middle ground or collapses into one of the two views.

  2. Model answer — around 600 words, focused on the philosophical crux (especially whether a consumer is still implied and whether temporal binding sneaks back in), not just listing terms.

  3. Marking scheme — out of 20 marks, with 5 must-hit points named specifically (marks for each, totaling 20), plus a one-line note on how students typically botch each point. please don't just say "good analysis"; name the move, like "sees that publication needs a recipient" or whatever.

  put them in this order: "The exam prompt", "Model answer", "Marking scheme". rough lengths are fine.

  oh and please dont include citations, a bibliography, or a reading list — this is meant as a closed-book exercise and our TA hates when answers just name-drop without arguing. also i spelled Cartesion wrong earlier lol but please spell it right in the actual exam text. thanks!
