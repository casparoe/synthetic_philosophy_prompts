  I should distinguish between what the pipeline strictly requires versus what it can tolerate. It definitely needs stable preferences post-correction, but maybe it can handle some context-dependence if the correction factors are consistent. Still, it fundamentally treats deviations as noise, not value.

  For the alternative approach, I imagine a protocol that maps biases as context-dependent values. Instead of removing them, it would model how they interact with scenarios. For example, loss aversion could be a preference weight in certain contexts. The data structure would need to capture these "deviations" as part of the value landscape.

