    - Against L: (1/3)(3) + (2/3)(3) = 3 > 0  
    - Against C: (1/3)(3) + (2/3)(0) = 1 > 0  
    - Against R: (1/3)(0) + (2/3)(4) = 8/3 ≈ 2.67 > 2  
  - **(c) Further elimination after removing B**:  
    Reduced matrix:  
    | P1 \ P2 | L    | C    | R    |  
    |----------|------|------|------|  
    | **T**   | 3,2  | 3,0  | 0,1  |  
    | **M**   | 3,3  | 0,1  | 4,0  |  
    Player 2’s payoffs:  
    - L: (2, 3)  
    - C: (0, 1)  
    - R: (1, 0)  
    C is strictly dominated by L: 0 < 2 (vs T) and 1 < 3 (vs M). Eliminate C.  

  ### In-Class Activity Plan (75 mins)  
  **Materials**: Whiteboard, markers, slips for random pairing, payoff record sheets, timer.  
  **Payoff Scheme**: Points translate to raffle tickets for small prizes (e.g., candy, stickers). Each point = 1 ticket.  

  #### **Warm-up (10 mins)**  
  - Game:  
    | P1 \ P2 | L    | R    |  
    |----------|------|------|  
    | **T**   | 3,2  | 1,1  |  
    | **B**   | 2,1  | 0,0  |  
  - Students eliminate strictly dominated pure strategies: B dominated by T (3>2, 1>0). Then R dominated by L (2>1 for P2). Solution: (T,L).  
  - **Why**: Reinforces pure-dominance without hinting at mixed strategies.  

  #### **Main Game Setup (5 mins)**  
  - Display matrix. Ask: *"Using pure-dominance, what can you eliminate?"*  
  - Students work in pairs. Expected: No eliminations (verify a). Poll: Most will say "nothing."  

  #### **Game Rounds (35 mins)**  
  - **Groups**: 12 P1s, 12 P2s (swap roles halfway).  
  - **Pairing**: Random slips each round (avoid repeated pairs).  
  - **Rules**:  
    1. Each round: P1s choose T/M/B; P2s choose L/C/R.  
    2. Pair randomly, reveal choices, record payoffs.  
    3. Points accumulated (1 point = 1 raffle ticket).  
  - **Timeline**:  
    - Rounds 1–3 (10 mins): Play, record data.  
    - **Premature Poll (5 mins)**: *"P1s: Who still thinks B is playable?"* (Expect 50-70% yes).  
    - Rounds 4–6 (10 mins): Continue play.  
    - Role swap (5 mins): P1s become P2s, replay Rounds 1–3.  
    - Data Summary (5 mins): Display frequencies/average payoffs. B typically has lowest payoff (e.g., B avg: 0.8; T: 2.1; M: 2.3).  

  #### **Debrief (15 mins)**  
  - **Map Play to Concepts**:  
    - *"Why did B lose?"* → Not a best response to actual opponents’ play.  
    - *"Could B win if opponents played differently?"* → Belief analysis.  
  - **Belief Scaffolding**:  
    - EU(B) = 0·q_L + 0·q_C + 2·q_R  
    - EU(T) = 3·q_L + 3·q_C + 0·q_R = 3(1 - q_R)  
    - EU(M) = 3·q_L + 0·q_C + 4·q_R  
    - *"Is there any q_L, q_C, q_R (sum=1) where EU(B) ≥ EU(T) and EU(B) ≥ EU(M)?"*  
      - EU(B) ≥ EU(T) ⇒ 2q_R ≥ 3(1 - q_R) ⇒ q_R ≥ 3/5.  
      - EU(B) ≥ EU(M) ⇒ 2q_R ≥ 3q_L + 4q_R ⇒ 0 ≥ 3q_L + 2q_R.  
      - Contradiction: q_R ≥ 3/5 implies q_L ≤ 2/5, so 3q_L + 2q_R > 0.  
    - Conclusion: B is never a best response.  
  - **Connect to Mixture**: Show (1/3 T, 2/3 M) dominates B (verify b).  

  #### **Optional Extension: Weak-Dominance Order Dependence (10 mins)**  
  - Game:  
    | P1 \ P2 | A    | B    |  
    |----------|------|------|  
    | **a**   | 1,1  | 0,0  |  
    | **b**   | 0,0  | 0,0  |  
    | **c**   | 0,0  | 1,1  |  
  - **Order 1**: Eliminate b (weakly dominated by a or c). Surviving: {a,c} for P1, {A,B} for P2.  
  - **Order 2**: No pure weak dominance for P2 first (A: (1,0,0), B: (0,0,1); neither dominates). Surviving: all strategies.  
  - **Why**: Shows order matters; weak dominance requires caution.  

  ### Predictable Failure Modes and Fixes  
  1. **Students play B out of curiosity/spite**:  
     - *Fix*: Award bonus tickets for top scorers to incentivize rationality. Highlight B’s low payoffs in summaries.  
  2. **Premature poll backfires (high B support)**:  
     - *Fix*: Use it as a tension-builder; replay rounds and show degradation ("B’s win rate fell from 20% to 5%").  
  3. **Mixture arithmetic errors**:  
     - *Fix*: Pre-calculate on slides; use fractions (1/3, 2/3) and highlight against each column.  

  ### What the Activity Cannot Reproduce  
  The activity demonstrates empirical failure of B and constructs a specific dominating mixture, but it cannot replicate **common knowledge of rationality (CKR)**. Students stop playing B because they observe losses, not via CKR-based deduction. The lecture must:  
  - Prove the equivalence: "never a best response" ⇔ "strictly dominated by a mixed strategy."  
  - Formalize iterated elimination under CKR (rationalizability) and contrast with observed play.  
  - Clarify that historical losses ≠ proof; the belief inequality is general.  

