   7. What the activity cannot reproduce:

      The activity shows that an action (B) is never chosen in practice and that it is strictly dominated by a mixed strategy, hence never a best response. However, it does not establish the full common knowledge of rationality that underlies iterated elimination. Students might stop playing B because they see it doesn't work, but not because they reason that no rational player would play it and that everyone knows that. The activity is experiential and may not convey the logical steps of iterated reasoning. Also, the activity shows the result for the particular distribution of play in the room, not for all possible beliefs. The follow-up lecture must supply: the equivalence between never being a best response and being strictly dominated by a mixed strategy (a theorem), and the concept of rationalizability. It must also explain that iterated elimination of strictly dominated strategies (by mixed if necessary) yields the rationalizable set, and that common knowledge of rationality implies that only rationalizable strategies are played.

      Additionally, the activity does not prove that the action is never a best response for any belief, only that it didn't work in the observed rounds. The lecture must supply the general proof (via the mixture or the belief inequality).

      The activity also does not cover the possibility of weak dominance and the issues with order dependence in weak dominance elimination, though the extension touches on it.

