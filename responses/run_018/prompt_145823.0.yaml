  1.  **Leveling vs. Press:** The press is the *primary instrument* of leveling in modernity, but leveling is a broader cultural phenomenon.
  2.  **The Single Individual:** This is not an elitist club but an existential category – anyone who takes absolute responsibility for their existence before God. It's the *opposite* of abstraction.
  3.  **Inwardness ≠ Withdrawal:** Inwardness (Inderlighed) is intensive passionate engagement with existence and God. It fuels outward action grounded in that commitment, like works of love (Kjerlighedens Gjerninger). It's a qualitative *how* of existing, not a *where*.
  4.  **Target:** Kierkegaard attacks the *evasion of responsibility* inherent in the "public" abstraction. He opposes the *mode* of modern collective existence (faceless, irresponsible), not necessarily the *fact* of collective action or democratic ideals *if* undertaken authentically by responsible individuals.
  5.  **Christianity & Engagement:** Authentic Christianity, for Kierkegaard, requires active love of neighbor *in the world*, impossible through total withdrawal. The issue is *how* one engages – as a responsible Single Individual or as a cipher in the public.
