answer: |-
  Here's a breakdown of the core requirements (desiderata) for a theory of consciousness, addressing your points and reasoning, flagged for negotiability, with potential conflicts and an IIT evaluation:

  **Core Desiderata for a Theory of Consciousness:**

  1.  **Explanatory Target: Phenomenal Consciousness (Non-negotiable):**
      *   **Requirement:** The theory *must* specifically target and attempt to explain *phenomenal consciousness* – the "what it's like" aspect of experience (qualia, subjective feels).
      *   **Reasoning:** This is the hard problem itself. Explaining behavior, cognition, or information processing alone isn't sufficient; it must explain why and how such processes *feel* like something.
      *   **Negotiability:** **Non-negotiable.** Without this, it's not a theory *of consciousness*.

  2.  **Empirical Adequacy (Non-negotiable):**
      *   **Requirement:** The theory must be consistent with and ideally predict core empirical data about consciousness in humans and relevant animals (e.g., neural correlates, effects of lesions, anesthesia, neurological disorders).
      *   **Reasoning:** Any scientific theory must be constrained by observation. Key data includes the association with specific brain regions/processes, loss under anesthesia, alterations in altered states (sleep, psychedelics), and pathologies like neglect, blindsight, and crucially, **split-brain phenomena**.
      *   **Split-Brain Handling:** The theory *must* account for the compelling evidence that severing the corpus callosum can result in two largely independent, co-existing streams of awareness/control within one organism.
      *   **Negotiability:** **Non-negotiable.** Contradicting well-established empirical facts invalidates the theory.

  3.  **The Exclusion Principle / Unitariness (Conditionally Non-negotiable):**
      *   **Requirement:** The theory must explain why consciousness appears unified within a single subject at a given moment, and why there isn't a proliferation of overlapping, nested, or micro-consciousnesses within a typical system (e.g., why isn't your liver conscious?).
      *   **Reasoning:** Our experience is singular, not fragmented into countless sub-experiences (except in *very* specific cases like split-brain). A theory that implies everything is conscious (panpsychism run wild) or that complex systems contain countless overlapping conscious entities is intuitively unsatisfying and empirically unworkable. It must identify the specific *boundaries* of a conscious system.
      *   **Conflict with Split-Brain?:** This is the tension you identified. The resolution lies in the "Conditionally" part: Exclusion must allow for consciousness to *fragment* when the *physical substrate of integration is physically severed*. Exclusion rules out overlapping/subconsciousnesses *within an integrated system*, not necessarily *across* physically disconnected subsystems. A good theory defines the conditions under which one vs. multiple conscious entities exist.
      *   **Negotiability:** **Core concept is Non-negotiable** (must address unitariness/proliferation). The *specific implementation* of exclusion (how boundaries are drawn) is negotiable/camp-dependent.

  4.  **Avoiding Criterion-F (Non-negotiable):**
      *   **Requirement:** The theory must *not* imply that any system matching a specific input-output function (like a feedforward neural net passing the Turing Test) is necessarily conscious.
      *   **Reasoning:** This is the core critique of functionalism regarding consciousness. Intuitively, pure input-output mappings, however complex, implemented on silicon without the right causal structure, seem insufficient for subjective experience. The theory must identify properties *beyond* mere function.
      *   **Negotiability:** **Non-negotiable.** Failing this makes the theory vulnerable to philosophical zombies and detached from the explanatory target (phenomenality).

  5.  **Intrinsic Nature / Physical Substrate (Conditionally Non-negotiable):**
      *   **Requirement:** The theory must specify what *kind* of physical system (or process) is necessary and sufficient to realize consciousness. It must ground consciousness in physical properties.
      *   **Reasoning:** Consciousness supervenes on the physical; changing the brain changes consciousness. The theory needs to say which physical properties matter (e.g., specific neural dynamics, causal structure, information integration).
      *   **Negotiability:** **Core concept is Non-negotiable** (must ground it physically). The *specific proposed substrate* (biological neurons, integrated information, quantum effects, etc.) is highly negotiable/camp-dependent.

  6.  **Gradedness / Levels of Consciousness (Negotiable):**
      *   **Requirement:** The theory should potentially allow for degrees or levels of consciousness (e.g., wakefulness vs. deep sleep vs. dream sleep), not just a binary "on/off".
      *   **Reasoning:** Empirical data suggests consciousness isn't all-or-nothing (e.g., drowsiness, anesthesia stages, possibly some animals).
      *   **REM Sleep Handling:** A theory should ideally address states like REM, where some integration persists (posterior "hot zone") while high-level executive integration (PFC) is reduced. Does this support a *different kind* (dreaming) or *diminished level* of consciousness?
      *   **Negotiability:** **Negotiable/Camp-dependent.** While widely accepted, a theory *could* be strictly binary and define states like REM as simply "conscious" (dreaming) but different in content/quality, not necessarily "diminished" in a graded sense of consciousness itself. How it handles gradation is a key differentiator.

  7.  **Temporal Grain Neutrality (Highly Negotiable/Camp-dependent):**
      *   **Requirement:** Should the theory be agnostic to the absolute timescale of the underlying processes? Can consciousness arise in systems operating orders of magnitude faster or slower than biological brains?
      *   **Reasoning:** This probes the core of the hard problem. If consciousness depends on specific causal/dynamic properties, does the *rate* at which they occur fundamentally matter? Intuitions clash. A fast digital simulation with identical causal structure *might* be conscious, or perhaps the "speed" is integral to the phenomenal feel.
      *   **Millisecond Silicon System Handling:** A theory must take a stance. Can high Phi on silicon support consciousness at computer speeds? Or is the biological timescale (integration windows of 100-300ms) fundamental?
      *   **Negotiability:** **Highly Negotiable/Camp-dependent.** This is a major frontier and point of contention. Some theories (e.g., IIT) arguably tie timescale to biology, others (some functionalist views) might be more agnostic.

  **Potential Conflicts:**

  *   **Exclusion vs. Split-Brain:** As noted, this is the key tension. A satisfactory theory *must resolve this*. The resolution hinges on the theory's definition of a "system" or "complex." Exclusion applies *within* the maximal integrated unit. Split-brain surgery physically creates *two* such maximal units where there was one. Failure to resolve this cleanly is a major weakness.

  **Evaluating IIT (Integrated Information Theory) Against the List:**

  1.  **Phenomenal Consciousness:** Directly targets it. Φ (Phi) is proposed as a measure of *intrinsic* causal power, argued to be the essence of consciousness.
  2.  **Empirical Adequacy:** Aims for it. Predicts loss of consciousness in seizures (too much integration), sleep (loss of integration), anesthesia. **Split-Brain:** Handles this *well* as a core strength. Severing the corpus callosum drastically reduces Φ between hemispheres. Each hemisphere then forms its own local maximum of Φ, supporting two distinct consciousnesses.
  3.  **Exclusion Principle:** Central tenet. IIT identifies the "Major Complex" – the set of elements with *maximal* Φ *within* the system. Only this complex is conscious; overlapping subsets have lower Φ and are excluded. Explains why subsystems aren't conscious independently.
  4.  **Avoiding Criterion-F:** Explicitly avoids it. Φ depends on the *intrinsic, causal* structure of the system, not its input-output function. Feedforward nets have very low Φ.
  5.  **Intrinsic Nature:** Grounds consciousness in intrinsic cause-effect power (Φ) realized in a physical substrate (conceived as a network of elements with cause-effect power).
  6.  **Gradedness:** Explicitly graded. Φ defines the *quantity* (level) of consciousness. **REM Sleep:** Predicts diminished Φ overall. The persistence of some integrated dynamics in posterior regions might support a lower level of consciousness (dreams), consistent with the "posterior hot zone" hypothesis. The collapse of large-scale integration reduces Φ.
  7.  **Temporal Grain Neutrality:** **Problematic for IIT.** IIT ties the "cause-effect repertoire" and integration timescale (the "integration window") to the intrinsic time constants of the physical elements (e.g., neuron time constants of ~10-300ms). A silicon system running identical causal structure but a million times faster would have an integration window a million times shorter. IIT argues this fundamentally changes the "grain" of the qualia (if it exists at all), meaning it wouldn't feel like "human" consciousness. This temporal anchoring is a major point of criticism (is it essential or just biological baggage?).

  **Summary:** The non-negotiables are targeting phenomenal consciousness, empirical adequacy (including split-brain), avoiding pure functionalism, and providing an exclusion mechanism. Gradedness is highly desirable, and temporal neutrality is a major open question. IIT scores well on exclusion, split-brain, avoiding functionalism, and gradedness, but its handling of temporal grain in non-biological systems is contentious. The REM case aligns reasonably with its graded Φ approach. The key conceptual tension (exclusion vs. split-brain) is resolved elegantly by IIT's complex-finding mechanism.
