answer: |-
  You've nailed a profound philosophical tension that absolutely has established terminology and frameworks. The closest concepts come from Karl Jaspers and subsequent political/moral philosophy. Here's the breakdown:

  1.  **Karl Jaspers' Four Concepts of Guilt (1947):** Your instinct is spot on. Jaspers, responding directly to German guilt post-Holocaust, distinguished:
      *   **Criminal Guilt:** Violation of laws, punishable by courts.
      *   **Political Guilt:** Responsibility stemming from membership in a political community whose leadership committed crimes. *This is where state continuity lives.* Citizens inherit obligations *as citizens*, even if not personally culpable.
      *   **Moral Guilt:** Personal failure to live up to one's own moral standards during the events.
      *   **Metaphysical Guilt:** A shared human solidarity that makes one feel ashamed for atrocities committed by others simply because one is human.
      *   **Your Tension Explained:** The move you see is primarily leveraging **Political Guilt** (the state/nation is continuous) while explicitly rejecting **Criminal** and **Moral Guilt** (no individual alive today did it or failed morally *at the time*). The "guilty soul" is the *political entity*, not the current individuals.

  2.  **The Established Name: Collective Responsibility / Political Responsibility (of the State/Nation):** This is the broadest term. But you want precision. Within this, the specific pattern you describe is best captured by:
      *   **"Intergenerational Political Responsibility"** or
      *   **"State Continuity and Moral Obligation"**
      *   **Core Idea:** The state (or nation, though "state" is often clearer) is conceived as a *continuous moral and legal entity* distinct from its transient citizens. Its institutions, laws, accumulated wealth, international standing, and foundational narratives persist. Harm inflicted *by that entity* creates enduring obligations *for that entity* to acknowledge, repair, and prevent recurrence, regardless of citizen turnover. Reparations/apologies are actions *by the state as an institution*, funded by its treasury (public funds), not a punishment *on* current individuals.

  3.  **Distinguishing it from Generic "Group Responsibility":**
      *   **Boundary Case 1: Short-Lived Collective Action (e.g., a Lynch Mob):** The mob has collective responsibility *in the moment*. But if it dissolves instantly and permanently, there's no *continuous entity* to hold responsible decades later. The guilt doesn't "survive" because the collective itself ceased to exist. (*Contrast with France, which persists as a state*).
      *   **Boundary Case 2: Voluntary Association (e.g., a Company or Club):** Members *choose* to join and benefit. Responsibility might persist if the organization continues, but membership is optional. Resignation ends involvement. (*Contrast with State Citizenship:* Membership is usually non-voluntary at birth, and benefits/identity are deeply ingrained. You can't easily resign from "Frenchness" in the political sense).
      *   **Boundary Case 3: Diffuse Cultural Group (e.g., "White People"):** While arguments about systemic racism exist, "whiteness" isn't a *continuous political entity* with defined institutions, treasury, and legal obligations like a state. Assigning *guilt* here is much more contentious and metaphoric than assigning responsibility to the *state of France* for its colonial administration's actions. The "collective" lacks the institutional continuity and agency of the state.
      *   **Boundary Case 4: Revolution & State Succession:** If a state undergoes radical revolution (e.g., Russia 1917, Iran 1979), does the *new* state inherit the old state's obligations? This is hotly debated in international law and philosophy. Proponents of continuity say yes (the entity persists, just under new management). Critics argue the break is fundamental. Your Twitter debaters generally assume continuity (modern France *is* the Third Republic, etc.).

  4.  **Why the Pivot Feels Consistent (to them):** They aren't being inconsistent. They are switching levels of analysis:
      *   **Level 1: Individual Culpability:** "Did *you* personally enslave someone? No. Are *you* morally guilty? No."
      *   **Level 2: Political Entity Continuity:** "Does the *State of France*, a continuous legal/political entity whose existence spans centuries and which still possesses wealth/assets derived partly from colonial exploitation, owe acknowledgment and repair for harms inflicted *in its name* by its past agents (governments, military)? Yes."

  5.  **Key Differences from "Generic" Group Responsibility:**
      *   **Entity Focus:** It's about the *institution* (the state/nation as an abstract but real actor), not just an amorphous group.
      *   **Continuity Over Time:** Explicitly requires the collective entity to persist meaningfully across generations.
      *   **Non-Voluntary Membership:** Obligation stems from citizenship/association, not choice.
      *   **Institutional Capacity:** The entity (state) has mechanisms (government, treasury, laws) to act and fulfill obligations.
      *   **Source of Obligation:** Arises from the *entity's* past wrongful actions/benefits, not just shared identity or passive benefit.

  **In Summary:**

  The **exact pattern** is best termed **"Intergenerational Political Responsibility of the State"** or **"State Continuity and Inherited Obligation."**

  *   It leverages Jaspers' **Political Guilt** (citizen's role in the polity) applied to the *state itself* as a continuous entity.
  *   It **differs from generic group responsibility** by requiring a *continuous, institutionalized political entity* (like a state) whose actions and benefits persist across generations, binding current members *as members* (not as individuals) to collective action (reparations, apology) through the state apparatus.
  *   **Core Tension:** Reconciling the undeniable moral innocence of current individuals with the perceived moral responsibility of the persistent political entity they constitute and benefit from.

  This is a central debate in political philosophy, ethics, and international law, especially concerning reparations, historical apologies, and dealing with legacies of injustice. The Twitter users are invoking a well-established (though contested) line of reasoning about the enduring moral personhood of states/nations.
