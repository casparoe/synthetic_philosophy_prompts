prompt: |-
  hey so im a software engineer with basically no philosophy background and im working on this taxonomy module for a synthetic biology dataset. i need you to rank these four definitions of life by how well they actually handle weird edge cases, not by how famous they are. the definitions are: (1) autopoiesis — a system that continuously produces and maintains its own boundaries and internal parts, (2) evolutionary — anything that reproduces with heritable variation and gets shaped by selection, (3) metabolic — entities that process energy and maintain homeostasis through chemical exchange, (4) information-theoretic — things that encode, copy, and execute functional instructions to build themselves. for each one, rate 1-10 how well it classifys three borderline cases: dormant bacterial spores, computer viruses that mutate their code, and synthetic minimal cells that need a lab nutrient bath to replicate. then tell me which single definition you'd pick if you had to write the `is_life(obj)` check in my codebase. please dont just list them — i actually want the ordering with reasoning, and im especially curious if any of these definitions accidentally include things like crystals or exclude things like viruses in a way that feels wrong.
