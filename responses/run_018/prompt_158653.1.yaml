answer: |-
  Here's a ranked evaluation of the definitions against your edge cases, with deep technical analysis and a clear recommendation for your `is_life(obj)` function:

  **Ranking (Best to Worst Performance on Edge Cases):**  
  1. **Information-Theoretic (4)**  
  2. **Autopoiesis (1)**  
  3. **Evolutionary (2)**  
  4. **Metabolic (3)**  

  ---

  ### **Detailed Breakdown**  
  *(Scale: 1 = total failure, 10 = perfect handling)*  

  #### **1. Information-Theoretic Definition**  
  *Things that encode, copy, and execute functional instructions to build themselves.*  
  - **Dormant Spores**: ⭐️ **8/10**  
    Encodes instructions (DNA), pauses execution/reactivates later. Copying is suspended but *possible*.  
  - **Mutating Computer Viruses**: ⭐️ **10/10**  
    Encodes instructions (code), copies (replicates), mutates (heritable variation), executes (infects files). *Too inclusive?*  
  - **Synthetic Minimal Cells**: ⭐️ **6/10**  
    Encodes/executes instructions, but external nutrient bath enables copying. Partial credit for self-building.  
  **Edge Case Verdict**: Best at handling dormancy and digital systems, but risks false positives (e.g., malware). Excludes crystals (no instructions).  

  #### **2. Autopoiesis**  
  *A system that continuously produces/maintains its own boundaries and components.*  
  - **Dormant Spores**: ⭐️ **2/10**  
    No active self-production/maintenance until germination. Boundaries exist but aren’t *actively* maintained.  
  - **Mutating Computer Viruses**: ⭐️ **5/10**  
    "Boundaries" are abstract (code isolation). Doesn’t *build* hardware; parasitizes hosts. Weak fit.  
  - **Synthetic Minimal Cells**: ⭐️ **8/10**  
    Actively maintains membranes/metabolism *if* nutrients exist. Boundaries are self-produced.  
  **Edge Case Verdict**: Strong for synthetic biology, but fails spores and digital cases. Excludes viruses (no physical boundaries).  

  #### **3. Evolutionary Definition**  
  *Anything that reproduces with heritable variation under selection.*  
  - **Dormant Spores**: ⭐️ **1/10**  
    No reproduction/variation *while dormant*. Selection acts only post-germination.  
  - **Mutating Computer Viruses**: ⭐️ **10/10**  
    Reproduces (copies), mutates (heritable variation), undergoes selection (antivirus evasion). *Too broad.*  
  - **Synthetic Minimal Cells**: ⭐️ **7/10**  
    Reproduces with variation in labs, but selection is artificial (not natural).  
  **Edge Case Verdict**: Over-includes digital life (e.g., self-modifying code), excludes spores. Crystals fail (no heritable variation).  

  #### **4. Metabolic Definition**  
  *Entities that process energy/maintain homeostasis via chemical exchange.*  
  - **Dormant Spores**: ⭐️ **0/10**  
    Zero metabolism/homeostasis. Cytoplasm is glass-like.  
  - **Mutating Computer Viruses**: ⭐️ **0/10**  
    No energy processing/chemical exchange (pure information).  
  - **Synthetic Minimal Cells**: ⭐️ **10/10**  
    Perfect fit: processes nutrients, maintains internal stability.  
  **Edge Case Verdict**: Too rigid. Excludes spores, viruses, and *all* digital systems. Includes fire (energy processing).  

  ---

  ### **Which Definition for `is_life(obj)`?**  
  **Pick: Information-Theoretic (4)** with *one critical modification*.  

  **Why**:  
  - Handles **dormancy** (spores as "paused" state) and **synthetic cells** (instruction execution) better than others.  
  - Explicitly excludes **crystals** (no encoded "instructions" for self-building).  
  - **Problem**: Over-includes computer viruses.  

  **Fix for Digital Edge Cases**:  
  ```python  
  def is_life(obj):  
      has_instructions = obj.encodes_functional_instructions()  # e.g., DNA/RNA  
      can_copy = obj.copies_instructions()  
      executes = obj.executes_instructions()  
      organic_substrate = obj.requires_organic_chemistry()  # KEY ADDITION  
      return has_instructions and can_copy and executes and organic_substrate  
  ```  
  **Reason**: Adding `organic_substrate` excludes digital systems (no biochemistry) while retaining spores, viruses, and synthetic cells. This aligns with NASA's practical definition: *"Self-sustaining chemical system capable of Darwinian evolution"* but prioritizes code-friendly checks.  

  **Trade-offs**:  
  - Still excludes **viruses** (no self-execution/copying without host).  
  - Accepts **prions** (self-replicating proteins with "instructions").  
  - Requires defining "organic chemistry" (e.g., carbon-based molecules in water).  

  This approach balances edge cases best for synthetic biology data, where genetic instructions and lab-grown systems matter most. Let me know if you need pseudocode for the checks!
