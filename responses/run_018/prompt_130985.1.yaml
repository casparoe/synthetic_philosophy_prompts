  Starting with the first probability: did Dennett intend Gregorian minds for non-biological systems? Dennett focused on biological evolution and human cognition. His examples are all biological, and he didn't discuss AI in depth. So non-biological applicability seems unlikely—maybe 0.2 probability. The user and their friend might both be stretching the framework here, which is common in philosophy when applying old concepts to new tech.

  Next, conditional on it applying, can linguistic novelty alone satisfy Gregorian without embodiment? Gregorian minds involve tools that reshape thought, like writing or symbols. Metaphors are cognitive tools, but Dennett emphasized physical tools and cultural transmission. The user argues metaphor-generation is tool-making for thought, but embodiment and cultural context seem integral. So without those, it's weak—maybe 0.3. This is probably where their core disagreement lies: the user sees text as sufficient tool-use, while their friend requires embodiment.

