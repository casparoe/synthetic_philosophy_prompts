prompt: |-
  My friend and I had a long argument last night about whether the Enlightenment should be understood as a genuine source of moral progress or, as she put it, as a machinery of domination that merely draped economic control in the language of reason. To test her claim, I want to examine the paired episode of the 1794 French National Convention decree abolishing slavery across the colonies—enacted largely under the pressure of the insurgent Black armies in Saint-Domingue—and Napoleon's 1802 reversal, which restored slavery precisely where colonial sugar production demanded it. Analyze this through the critical thesis that Enlightenment universalism was never more than an ideological cover for instrumental domination: that rights-language served to rationalize control, and that "progress" was selectively granted only when it aligned with the interests of power.

  Please do not recount the ecological or diplomatic history; I want the conceptual mapping. Identify the relevant actors—the Convention delegates, Napoleon's administration, and the insurgent leaders in Saint-Domingue—and specify what options each actually faced. Was the 1794 abolition a performative enactment of universal rights that the 1802 reversal reveals as purely contingent, or was it always an administrative calculation masked in moral language? How does the active agency of the enslaved people, who had already seized de facto freedom, fit into a theoretical framework that tends to treat colonized subjects as objects of governance rather than rights-bearing agents? And where is the domination thesis silent—does it account for the internal fractures within the Convention, or for the fact that abolition was never fully reversed in certain territories? I want the analysis to run in both directions: the theory illuminating the episode, and the episode testing whether the theory can accommodate a real universalist breakthrough without reducing it to an epiphenomenon of economic interest.

  Please end your response with a line beginning "Verdict:" followed by one of the labels "supports," "complicates," or "undermines" to indicate what the episode does to the domination thesis, and then provide a final line containing a one-sentence summary of your overall judgment.
reasoning: |-
  Okay, the user presents a sophisticated historical and theoretical challenge about the Enlightenment's moral claims versus its role in domination. They focus on the 1794 abolition and 1802 reinstatement of slavery in French colonies, specifically Saint-Domingue. The core question is whether Enlightenment universalism was merely ideological cover for economic interests.

  The user's framing is complex: they want to avoid narrative history and instead analyze conceptual tensions. Key elements include:
  - Testing the "domination thesis" that rights-language rationalized control
  - Examining agency of enslaved insurgents (who achieved freedom before abolition)
  - Considering fractures within the Convention and incomplete reversal of abolition
  - Demanding bidirectional analysis: theory illuminating events and events testing theory
  - Requiring a verdict categorizing how this episode impacts the domination thesis

  For the analysis, I need to map:
  1. Actors: Convention delegates (republican idealists vs. pragmatists), Napoleon's administration (explicitly imperialist), Saint-Domingue insurgents (autonomous actors)
  2. Their constraints: Convention faced slave revolts and British threats; Napoleon prioritized colonial revenue; insurgents created fait accompli
  3. Theoretical tensions: Does enslaved agency disrupt the domination thesis? Can abolition be both principled and pragmatic?

  The domination thesis struggles with three counterpoints:
  - Abolition wasn't fully reversed everywhere (e.g., Guadeloupe resisted), showing limits of economic determinism
  - Insurgent agency forced moral reckoning beyond economic calculus
  - Internal Convention debates reveal genuine ideological struggle

  Yet the reversal proves how easily universalism yielded to economic imperatives. The verdict must capture this dialectic: the episode simultaneously supports the thesis (by showing instrumentalization) and complicates it (by revealing spaces of resistance and incomplete domination). The breakthrough in Saint-Domingue wasn't granted but seized, exposing the theory's blind spot regarding colonized agency.

  Final phrasing should avoid binary conclusions. The verdict line needs precise wording: "complicates" fits best because the thesis isn't demolished (economic motives clearly drove reversal) but requires modification to account for insurgent agency and the Convention's internal conflicts.
answer: |-
  This episode offers a crucial stress test for the domination thesis. Applying it reveals significant insights but also exposes critical limitations when confronted with the historical reality.

  **Conceptual Mapping:**

  1.  **Actors & Their Options:**
      *   **1794 National Convention Delegates:** Faced with the *fait accompli* of massive slave revolts in Saint-Domingue threatening colonial collapse, British invasion exploiting the chaos, and intense lobbying from abolitionist societies. Options: Maintain slavery (risking total colonial loss to Britain/rebellion) OR abolish slavery (legitimizing the insurgents' gains, potentially securing colonial loyalty, and aligning with republican ideals). Their choice was constrained by material crisis but framed through universalist rhetoric.
      *   **Napoleon's Administration (1802):** Primary goal: Restore profitable colonial empire and French global power. Saint-Domingue's sugar/coffee wealth was paramount. Options: Accept de facto Black self-governance in Saint-Domingue (sacrificing immense wealth/control) OR reimpose metropolitan authority and slavery (requiring military force). "Progress" and rights were discarded as incompatible with imperial economics.
      *   **Saint-Domingue Insurgent Leaders (Toussaint L'Ouverture et al.):** Had already seized de facto freedom and political control through armed struggle. Faced ongoing threats: French attempts at re-enslavement/control, internal divisions, Spanish/British threats. Options: Fight for formal recognition of independence/abolition OR negotiate autonomy within a French framework that recognized abolition. Their agency *forced* the situation; they were not passive recipients of "granted" rights.

  2.  **1794 Abolition: Contingent Universalism or Calculated Mask?**
      The domination thesis powerfully illuminates the *contingency* and *instrumentality* of the 1794 decree. Abolition was enacted *only* when the enslaved made it a material necessity for colonial retention. The universalist language served to rationalize a decision forced by rebellion and geopolitical threat. The decree *was* performative in that it codified an existing reality created by the enslaved, masking the Convention's reactive pragmatism (driven by factions like the Jacobins needing colonial resources/troops for European wars) in the language of pure reason and rights. It was not a disinterested moral breakthrough.

  3.  **Enslaved Agency vs. Theoretical Objectification:**
      The active, violent, and successful agency of the enslaved in Saint-Domingue fundamentally disrupts the domination thesis' tendency to view the colonized solely as objects of governance. Their seizure of freedom *created* the conditions forcing the Convention's hand. They were *rights-seizing agents*, not merely subjects upon whom rights were bestowed or denied by the metropole. The domination thesis, focused on *metropolitan* ideology and power, struggles to fully integrate this autonomous, revolutionary agency originating from the periphery. It risks minimizing how the enslaved *used* Enlightenment language strategically while forging their own liberation.

  4.  **Silences and Fractures within the Domination Thesis:**
      *   **Internal Convention Fractures:** The thesis often presents a monolithic "Enlightenment universalism." However, the 1794 vote revealed deep divisions. Radicals like the Jacobins (Robespierre) and members of the Society of the Friends of the Blacks genuinely embraced abolitionist principles, seeing it as inherent to republicanism, while others supported it purely for expediency. The domination thesis flattens this ideological struggle, reducing it solely to economic/strategic calculation.
      *   **Incomplete Reversal:** Napoleon succeeded in restoring slavery in Guadeloupe and French Guiana, but *failed* in Saint-Domingue due to the determined resistance of the formerly enslaved armies, leading to Haitian independence. This crucial outcome demonstrates the *limits* of metropolitan domination and the irreversibility of freedom *achieved and defended* by the colonized. The domination thesis struggles to explain why abolition persisted in Haiti if metropolitan economic interest was paramount everywhere; it must account for the *defeat* of domination by local agency.

  **Bidirectional Analysis:**

  *   **Theory Illuminating Episode:** The domination thesis powerfully reveals the instrumental core beneath Enlightenment universalism in this context. It shows how rights-language was deployed or discarded based on colonial economic and strategic imperatives (1794 as crisis management, 1802 as explicit imperial restoration). It highlights the hollowness of "progress" granted only when rebellion forced it.
  *   **Episode Testing Theory:** The episode critically *complicates* the thesis. Firstly, the *irreducible agency of the enslaved* – their role as creators of the freedom the Convention merely ratified and that Napoleon failed to fully rescind – cannot be reduced to an object or epiphenomenon of metropolitan power dynamics. Secondly, the *internal ideological fractures* within the Convention (genuine universalists vs. pragmatists) challenge the portrayal of Enlightenment discourse as a monolithic, purely cynical tool. Thirdly, the *incomplete success* of Napoleon's reversal (Haiti's victory) demonstrates that while Enlightenment universalism was instrumentalized by power, the *idea itself*, once unleashed and seized upon by the oppressed, could become a potent weapon *against* that very power, leading to a genuine, enduring breakthrough *outside* metropolitan control.

  **Verdict:** Complicates.

  The 1794-1802 sequence reveals the domination thesis as a powerful but incomplete lens, struggling to fully account for the revolutionary agency of the enslaved, the contested nature of Enlightenment ideals within the metropole, and the possibility of irreversible emancipatory breakthroughs forged in resistance.
