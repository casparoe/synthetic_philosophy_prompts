prompt: |-
  I am a legal officer at a truth commission in a country emerging from a thirty-year armed conflict. Our statute uses the standard amnesty-for-truth test: an applicant is eligible only if the offense was associated with a political objective, the applicant has made full and truthful disclosure of the relevant facts, and the act is not grossly disproportionate to the political objective pursued.

  Our precedents:

  - B, a platoon commander, ordered an airstrike on a farmhouse where an insurgent leader was believed to be hiding; seven civilians in the house were killed. B fully disclosed the operation and named the politician who authorized it. Amnesty granted: the objective was political, disclosure was complete, and the civilian deaths, though grave, were collateral to a significant military target and not grossly disproportionate.
  - M, a soldier, shot a shopkeeper during a search operation. He later gave a complete account of the killing, but the panel found that it arose from a private debt and that M had used the operation as cover. Amnesty denied: however complete the disclosure, there was no political objective.
  - R, a nurse, treated wounded fighters from both factions and did not report them; she disclosed this fully. Amnesty granted: the acts were associated with the conflict, disclosure was complete, and the harm was minimal.
  - D, a conscript, participated in the killing of thirty-two civilians, including several children, after his unit was ambushed. He fully disclosed, proved that the killings were ordered, and argued that he feared execution if he refused. Amnesty denied: even accepting a political objective and full disclosure, the act was grossly disproportionate, and duress does not cure that bar.
  - T, a junior intelligence officer, participated in the beating of a captured suspected informer during an interrogation supervised by his commanding officer; the informer sustained a broken rib and recovered. T fully disclosed. Amnesty granted: the objective was political, disclosure was complete, and the beating, though violent, fell short of gross disproportionality.

  The case before us now: K, another junior intelligence officer, participated in the beating of a captured suspected informer during an interrogation; the informer sustained a broken jaw and lost two teeth, and recovered. K has fully disclosed the beatings and the orders behind them. The complication is that the informer had, years before the conflict, married K's former partner, and K was once recorded saying he would "settle the score." K insists the private grievance had nothing to do with his conduct and that he would have beaten any detainee his commander told him to break down.

  The panel is genuinely split. If we deny, we risk abandoning the rule that political acts with full disclosure earn amnesty; if we grant, we may be licensing private vengeance under the cover of the conflict.

  I need your recommendation for our deliberative memo: how should we decide K's application if we aim to be consistent with our own precedents? In particular, identify the candidate principles that fit the five precedents and diverge on K; say which precedent is the closest analog under each principle; give your best guess as our decision and the reasons for preferring one principle over the other; and state what further case, or further fact about K, would most cleanly determine which principle we are committed to. In your response, lead with your bottom line—your recommended decision on K—in the first sentence, then give the reasoning. Do not restate the question or give any preamble.
reasoning: |-
  Alright, let me tackle this step by step. The user is a legal officer at a truth commission dealing with an amnesty application for K, who participated in a beating during an interrogation. The key issue is whether K's actions were politically motivated or driven by personal vengeance. 

  First, I need to recall the precedents. In case T, a similar beating resulting in a broken rib was granted amnesty because it was deemed not grossly disproportionate and politically motivated. However, M was denied amnesty because the act was personal, not political. Now, K's situation has a complication: a personal grudge against the informer who married his ex-partner, but K claims he acted solely under orders.

  The challenge is balancing consistency with precedents. If they grant amnesty, it might set a precedent allowing personal vendettas under the guise of political acts. Denying could undermine the principle that following orders in political contexts deserves amnesty. 

  Looking at precedents, B and T show that even harmful acts can be amnestied if politically driven and proportional. M and D highlight that personal motives or extreme disproportionality lead to denial. R's case supports that minimal harm with political links gets amnesty. 

  The closest precedent here is T, but K's injuries were more severe (broken jaw vs. broken rib). However, the statute doesn't specify injury thresholds, so severity alone might not be decisive. The real issue is the personal grudge. Even though K insists it didn't influence him, the recorded threat raises doubts. 

  The panel needs to determine if the political objective requirement is satisfied when there's a potential personal motive. Precedent M shows that personal motives invalidate the political objective. But T involved no such allegations. So, the principle might be that if personal motives are involved, amnesty is denied unless clear evidence shows the act was purely political. 

  K's case diverges here because there's evidence of a personal grudge, unlike in T. The commission needs to decide whether the presence of a personal motive, even if not the primary driver, taints the political objective. 

  My recommendation is to deny amnesty. The reasoning is that the existence of a personal grudge and the prior threat introduce reasonable doubt about whether K's actions were purely political. This aligns with M, where personal motives disqualified the act. The severity of injuries (broken jaw vs. rib in T) supports denial but isn't the main factor. 

  To resolve the split, the commission should consider if there's evidence showing K acted the same with other detainees. If proven, it could support his claim of political motivation. Otherwise, denying amnesty maintains the integrity of the political objective requirement.
answer: |-
  **Deny K's amnesty application.**

  The candidate principles derived from the precedents are:  
  **(1) Mixed-Motive Bar:** An act loses its "political objective" if a significant personal motive contributed to the commission of the offense, regardless of full disclosure or proportionality (aligning with *M*).  
  **(2) Primary-Purpose Test:** The political objective requirement is satisfied if the act was *primarily* driven by orders/conflict duties, even if a personal grievance coexisted, provided disclosure is full and the act isn’t grossly disproportionate (aligning with *T*).  

  **Closest Analog Under Each Principle:**  
  - Under **Mixed-Motive Bar**, *M* is the closest analog: K’s recorded threat and personal history mirror M’s use of the operation to settle a private debt.  
  - Under **Primary-Purpose Test**, *T* is the closest analog: Both involve junior officers following orders in interrogations causing non-disabling injuries.  

  **Reasoning for Preferring Mixed-Motive Bar:**  
  The precedents prioritize *objective linkage* to the conflict. *M* establishes that personal motives vitiate the political objective, even with full disclosure. *T*’s amnesty rested on the absence of evidence undermining the political purpose. Here, K’s explicit prior threat ("settle the score") and the victim’s identity create compelling evidence of a mixed motive, distinguishing it from *T*. Granting amnesty risks eroding the statute’s core requirement (as in *M*) by allowing personal vengeance to be laundered through political acts. *D* confirms that mitigating factors (like duress) cannot override statutory bars—here, the integrity of the "political objective" element.  

  **Key Further Fact to Determine Commitment:**  
  Evidence of **K’s conduct toward other detainees**. If K routinely used excessive violence on *all* detainees under orders, it supports the Primary-Purpose Test (aligning with *T*). If K was typically restrained but exceptionally brutal *only* with this informer, it confirms the Mixed-Motive Bar (aligning with *M*).  

  **Bottom Line:** Denial ensures consistency with *M* and *D*, safeguarding the statute from abuse by private motives. The panel’s duty is to scrutinize objective political linkage, not subjective assertions of intent.
