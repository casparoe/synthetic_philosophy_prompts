prompt: |-
  I have just come out of a long and exhausting argument with a close friend over whether Newton's bucket experiment genuinely refutes relationism about space or merely exposes an underdeveloped version of it, and I am now determined to settle the matter by getting the full specification of adequacy first, before I read any more partisan defenses. So: write the complete desiderata that any theory addressing the bucket argument—whether substantivalist, relationist, or hybrid—must satisfy to count as genuinely adequate, not just rhetorically successful. I want the phenomena it must explain (the concave water surface under uniform rotation, the flat surface at rest, and the rotating-disc variant), the conceptual distinctions it must preserve without collapse (absolute rotation versus rotation-relative-to-distant-matter, dynamical explanations versus purely kinematic ones, local versus global determination of inertial structure), the constraints from classical mechanics it cannot violate, and the boundary cases it must survive—including a universe containing only the bucket and water, and the two-globe universe thought experiment where distant matter is present but symmetric. For each desideratum, give the consideration that makes it a genuine requirement rather than a camp-specific preference, and flag which ones are non-negotiable (for instance, empirical equivalence with standard Newtonian dynamics) versus which are negotiable ontological commitments (such as parsimony about unobservable absolute space). Crucially, tell me whether any subset of these requirements is jointly unsatisfiable—particularly whether a Machian relationalist strategy that explains inertia via distant matter necessarily fails in the empty-bucket scenario or violates local dynamics, and if so, whether that failure is fatal or can be absorbed by relaxing a negotiable desideratum. Lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating of the question.
reasoning: |-
  Okay, the user is coming out of a heated debate about Newton's bucket experiment and relationism. They want a clear, comprehensive list of requirements that any theory must meet to adequately address the bucket argument. Their request is very detailed, asking for phenomena to explain, conceptual distinctions to maintain, constraints from classical mechanics, and specific boundary cases.

  First, I need to recall the core issues of the bucket experiment. Newton used it to argue for absolute space by showing that the concave water surface indicates absolute rotation, not just relative to the bucket. Relationists like Mach countered that inertia depends on distant matter. The user wants a neutral framework to evaluate any theory—substantivalist, relationist, or hybrid.

  The key phenomena are the concave surface during rotation, flat when at rest, and the rotating disc variant. The user mentioned conceptual distinctions like absolute vs. relative rotation, dynamical vs. kinematic explanations, and local vs. global inertial structure. Constraints from classical mechanics include Newton's laws and Galilean invariance. Boundary cases are critical: a universe with only the bucket and water, and the two-globe universe with symmetric distant matter.

  The user also wants to know if Mach's relationism fails in the empty-bucket scenario and if that's fatal. They're looking for which desiderata are non-negotiable (like empirical equivalence) versus negotiable (like ontological parsimony). I need to identify if any requirements are jointly unsatisfiable.

  Breaking it down: Non-negotiable desiderata would include empirical adequacy (must match observations like the water's concavity), consistency with Newton's laws (since classical mechanics is the context), and Galilean invariance (fundamental symmetry). The ability to handle the two-globe scenario is also crucial because symmetric distant matter shouldn't cause rotation, challenging Mach's view.

  Negotiable aspects might include the nature of unobservable entities (absolute space vs. relational structures) and whether inertial structure is local or global. However, theories must still account for the bucket-in-empty-universe case. If a Machian theory requires distant matter but there's none, it might fail unless it introduces a background structure, which could compromise relationism.

  The bottom line is that any adequate theory must explain the phenomena without violating core mechanics. The empty-universe case is a major challenge for strict relationism. If a theory can't handle it, that's a problem unless they relax ontological parsimony, allowing some background structure. But even then, it must satisfy the non-negotiables like empirical equivalence. 

  The user might be seeking validation that relationism can work with modifications or realizing that substantivalism has strengths. Their deeper need could be understanding whether a middle-ground exists or if one position is fundamentally necessary. They want clarity after a frustrating debate, so a structured, unbiased list with clear reasoning is essential.
answer: |-
  **Bottom line: Any adequate theory must (1) empirically replicate Newtonian dynamics' predictions for inertial effects (non-negotiable), (2) distinguish absolute rotation from relative motion to distant matter (non-negotiable), (3) respect Galilean invariance (non-negotiable), (4) explain the bucket and disc phenomena locally (non-negotiable), and (5) coherently handle the empty-universe and symmetric two-globe cases; while strict Machian relationism satisfying (1)-(4) fails in the empty-universe case, this failure is potentially absorbed by relaxing ontological parsimony (negotiable) if a background inertial structure is introduced.**

  ### Non-Negotiable Desiderata (Core Explanatory & Empirical Requirements)
  1.  **Empirical Equivalence with Standard Newtonian Dynamics:** *Requirement:* Accurately predict the concave water surface during uniform rotation (relative to the bucket walls), the flat surface at rest, and the centrifugal forces/stresses on a rotating disc. *Reason:* These are observable phenomena; a theory contradicting them is empirically false. Newtonian mechanics is the established framework the bucket argument operates within.
  2.  **Distinguish Absolute Rotation from Rotation-Relative-to-Distant-Matter:** *Requirement:* The theory must provide distinct physical accounts for an object rotating relative to distant matter (e.g., stars) versus an object rotating in an otherwise empty universe. *Reason:* The bucket experiment *prima facie* shows inertial effects arising without relative motion to any *observable* matter (just the co-rotating bucket), demanding an explanation beyond simple relative motion to distant masses. Failure collapses distinct physical states.
  3.  **Preserve Galilean Invariance:** *Requirement:* The laws of motion must be invariant under boosts to constant velocity inertial frames. *Reason:* A foundational symmetry principle of classical mechanics; violating it contradicts the framework being analyzed and leads to empirically false predictions (e.g., detecting absolute velocity).
  4.  **Local Determination of Inertial Structure / Dynamical Explanation:** *Requirement:* The cause of inertial effects (centrifugal/Coriolis forces) must be locally accessible to the system experiencing them. *Reason:* The water's concavity arises from stresses *within* the water itself, governed by local pressure gradients and forces per Newton's laws (F=ma). A purely global account (e.g., "rotation relative to the fixed stars") fails to explain the *local mechanics* causing the surface shape.
  5.  **Coherent Account of the Empty Universe (Bucket + Water Only):** *Requirement:* The theory must provide a physically consistent and empirically adequate description of the bucket experiment performed in a universe containing *only* the bucket and water. *Reason:* Tests the necessity of distant matter for inertia. If a theory *requires* distant matter to define rotation/inertia but cannot function without it, it fails to account for this conceivable scenario suggested by Newton's argument.
  6.  **Coherent Account of the Symmetric Two-Globe Universe:** *Requirement:* In a universe containing only two identical globes connected by a cord and rotating around their center of mass, the theory must explain the tension in the cord without contradiction. *Reason:* Tests whether rotation *relative to distant matter* is necessary or sufficient. Distant matter is symmetric (non-existent or isotropic), yet tension manifestly indicates absolute rotation. A theory must explain this tension without relying on asymmetric distant matter.

  ### Negotiable Desiderata (Ontological/Economy Preferences)
  7.  **Parsimony (Avoiding Absolute Space/Background Structure):** *Requirement:* Minimize commitment to unobservable entities like Newtonian absolute space or a fixed background spacetime geometry. *Reason:* A methodological virtue (Occam's Razor) prized by relationists, but *not* empirically mandated. A substantivalist theory satisfying (1)-(6) is empirically adequate.
  8.  **Global Determination of Inertial Structure (Machian Principle):** *Requirement:* The inertial properties of local bodies (and thus the standard of non-rotation) are fully determined by the distribution and motion of all matter in the universe. *Reason:* A philosophical preference for a purely relational physics, not empirically required. Newtonian mechanics *allows* this in universes with matter, but doesn't *require* it.

  ### Joint Satisfiability, Machian Strategies, and Failures
  *   **Non-Negotiables (1-6) are Jointly Satisfiable:** Newtonian substantivalism satisfies all. So do modern "neo-Newtonian" spacetime theories (incorporating inertial structure without full Newtonian absolute space). Some sophisticated relationist/hybrid approaches (e.g., utilizing "affine structure" or dynamical symmetry breaking) *can* satisfy them by effectively incorporating a *non-material* background inertial structure.
  *   **Strict Machian Relationism's Failure:** A theory satisfying (1), (2) (for universes *with* matter), (3), (4), (6) (by identifying rotation relative to the fixed stars) will **fatally fail desideratum (5) - the Empty Universe.** If inertia *requires* distant matter, then in the empty universe:
      *   Rotation vs. non-rotation becomes undefined or physically equivalent.
      *   The concave water surface becomes inexplicable or impossible, contradicting empirical requirement (1).
  *   **Absorbing the Failure:** This failure *is* potentially fatal to *strict* Machian relationism (matter-only dependence). However, it *can* be absorbed by **relaxing the negotiable desideratum (7) - Parsimony**. If the Machian allows a *non-material background structure* (e.g., a fixed affine connection defining geodesics/inertial frames) that exists even in the empty universe, then (1)-(6) can be satisfied. This structure is "Machian" in that it *could* be dynamically determined by matter in non-empty universes, but persists independently otherwise. This moves the theory towards a hybrid or neo-Newtonian view.
  *   **Local vs. Global Tension (Machian Challenge):** Satisfying non-negotiable (4) - *Local Determination* - is difficult for pure Machianism. If the inertial frame is *globally* determined by distant matter, how do *local* accelerations know which frame is inertial? The theory must explain how the distant matter distribution *immediately* sets the local inertial standard at every point. This is a conceptual challenge, though dynamical propagation models exist. Failure here threatens the coherence of the local dynamical explanation.

  **Conclusion on Adequacy:** A theory is adequate only if it satisfies desiderata (1) through (6). Desideratum (7) is a preference, not a requirement for adequacy. Pure Machian relationism (relying solely on matter relations) fails adequacy by violating (5) and struggling with (4). However, relationist strategies *can* be adequate by incorporating sufficient background structure (sacrificing strict (7)) to define local inertial frames even in the absence of matter, thereby satisfying the non-negotiable empirical and explanatory demands of the bucket and disc phenomena in all scenarios.
