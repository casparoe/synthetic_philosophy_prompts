  The decision theory demand (4) is their non-negotiable anchor point, I suspect. That's why they're resisting full anti-luminosity. The real question is whether minimal self-knowledge can be defended without thresholds. Maybe hybrid access - direct for high-intensity pain, inferential for lower levels?

