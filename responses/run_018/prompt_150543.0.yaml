prompt: |-
  For a reading group I'm trying to pin down my own take on comparative macrohistory before we discuss the Great Divergence literature and the Needham question. Here are my commitments — tell me if they hang together or if I'm talking past myself.

  1. I think "why Britain and not China?" is well-posed, but only if we treat it as asking about industrial take-off mechanisms, not about some general civilisational superiority.
  2. I'm dead against essentialist national-character explanations; I want everything grounded in instutional incentives and factor endowments.
  3. I also think counterfactuals in big-history are only kosher when they hold the causal architecture constant right up to the divergence point — otherwise you're just writing fiction.
  4. But I also think the divergence wasn't a single critical juncture; it was a slow, path-dependent lock-in where energy, labour, and capital regimes co-evolved, so there's no clean "point" to hold constant.
  5. I reject technological determinism — coal wasn't destiny — yet I still think Britain's access to cheap coal was a necessary condition, and I think the usual "China had coal too" reply misses that Jiangnan's coal was geologically accessible but instutionally stranded.
  6. Finally, I think the best explanations are multi-causal and overdetermined, which means no single factor should do the explanatory work in the contrast.

  Go through these and say which pairs are actually in tension, which ones only look like it, and rank them by severity. For each real tension, what's the cheapest fix and what does it cost me? Then tell me which single revision cleans up the most mess. Say how confident you are in the audit overall, and single out the point you're least sure about. Write it in British English, please — and no bibliography or citation list, I just want the audit.
