  **SIDEBAR: ONTOLOGICAL DRIFT (OD) CLASSIFICATION & REPORTING**

  | % Original CM Remaining | OD Status          | Administrative Action Required                                                                 | Insurance Status                             |
  | :---------------------- | :----------------- | :--------------------------------------------------------------------------------------------- | :------------------------------------------ |
  | 100%                    | Stable             | None. PMI fully satisfied.                                                                     | Full Value (Original)                       |
