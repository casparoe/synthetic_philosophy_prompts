  ### Brainstorming on Conceptual Tensions
  The core instability in material object ontology arises from competing intuitions regarding persistence conditions. The statue-and-clay case highlights the tension between *constitution without identity* (one lump materially constituting a distinct statue at time *t*) and the intuitive pull towards *spatiotemporal co-location implying identity*. This directly impacts institutional tracking: are we curating one entity or two? Gradual part-replacement (e.g., conservation) forces a choice between mereological essentialism (any part-change destroys the original object, necessitating a new accession) and form-based persistence (the object survives if its "defining structure" remains sufficiently intact). The former renders conservation impossible; the latter invites arbitrariness in defining "sufficient" structural continuity. Three-dimensionalism (objects persist by being wholly present at each moment) struggles with incremental change, while four-dimensionalism (objects are spatiotemporal worms) dissolves the "original" into temporal parts, undermining the notion of a singular, enduring artifact. These tensions are not resolved but masked by pragmatic institutional practices, creating fertile ground for bureaucratic parody centered on the instability of "identity" over time under conservation.

  ---

  **INSTITUTE OF ONTOLOGOLOGICAL CONSERVATION (IOC)**  
  **Policy Directive IOC-PD-07 Rev. 4.3**  
  **Subject: Accession, Continuity, and Mitigation of Ontological Drift**  
  **Effective Date: Perpetuity (Subject to Instantaneous Revision Upon Part-Replacement)**

  **1.0 Purpose & Scope**  
  This Directive establishes protocols for maintaining ontological integrity within the Institute's collections, specifically addressing challenges arising from material constitution, part-replacement, and spatiotemporal coincidence. It ensures rigorous adherence to the Principle of Mereological Invariance (PMI) while accommodating established anti-essentialist practice where operationally unavoidable, contingent upon Formal Continuity Certification (FCC).

  **2.0 Definitions**
  *   **2.1 Accessioned Object (AO):** A discrete material entity assigned a unique IOC accession number and spatiotemporal coordinate set at the moment of acquisition.
  *   **2.2 Constituent Matter (CM):** The precise plurality of atomic or molecular parts composing an AO at its accession moment (t<sub>0</sub>).
  *   **2.3 Ontological Drift (OD):** The cumulative process whereby incremental part-replacement results in an AO possessing *zero* CM at time t<sub>n</sub>, thereby constituting a numerically distinct entity (NDE) despite retaining the original AO's accession label, display location, conservation record, and taxonomic classification.
  *   **2.4 Coincident Objects (COs):** Two or more numerically distinct entities occupying identical spatiotemporal coordinates (e.g., Clay Substrate [CS] and Statue-Form [SF]).
  *   **2.5 Formal Continuity (FC):** A state maintained if the external configuration, functional role, and catalog description of an object remain congruent with its state at t<sub>0</sub>, notwithstanding CM variance. FC *does not* imply numerical identity under PMI.

  **3.0 Accession Integrity & Part-Replacement Protocols**
  *   **3.1 Principle of Mereological Invariance (PMI):** An AO persists numerically identically *if and only if* it retains all original CM. Any addition, subtraction, or substitution of CM constitutes the cessation of the original AO and the generation of a new entity.
      *   **3.1.1 Trigger for Re-accession:** Any part-replacement exceeding 0% of CM (measured by particle count at t<sub>0</sub>) necessitates immediate de-accession of the original AO and accession of the resultant NDE under a new, unique IOC number.
      *   **3.1.2 Exception – Dust Mitigation:** Removal of extraneous particulate matter (dust, pollutants) not integrated into the object’s structure at t<sub>0</sub> is exempt from 3.1.1, provided removal does not constitute subtraction of CM.
  *   **3.2 Formal Continuity Certification (FCC):** Recognizing operational exigencies, an FCC may be granted by the Senior Ontological Registrar (SOR) for objects undergoing part-replacement, *only if*:
      *   **3.2.1** FC is rigorously maintained (per 2.5).
      *   **3.2.2** CM replacement occurs gradually (< 0.001% per annum).
      *   **3.2.3** The original accession label remains physically affixed.
      *   **3.2.4** FCC constitutes an *administrative concession* overriding PMI for cataloging purposes *only*; it does *not* assert numerical identity under standard doctrine. FCC status must be prominently displayed (see Appendix A: Labeling Conventions for Entities of Dubious Continuity).

  **4.0 Management of Coincident Objects (COs)**
  *   **4.1 Identification:** Upon acquisition or recognition (e.g., sculpting raw clay within the Institute), COs (e.g., CS and SF) must be immediately assigned *separate* accession numbers.
  *   **4.2 Storage Protocol:** COs occupying identical coordinates present a containment challenge.
      *   **4.2.1** COs must be housed within the *same* physically secure vault or display case.
      *   **4.2.2** The vault/case must bear labels for *both* accessions (e.g., "Vault 7: AO#1927.1 (Statue-Form) & AO#1927.2 (Clay Substrate)").
      *   **4.2.3** Environmental monitoring probes must be calibrated to the most ontologically vulnerable CO (typically the SF).
  *   **4.3 Display Rights:** Only one CO may be designated "Primary Display Entity" (PDE) per exhibition cycle. Selection criteria are found in SOP IOC-SOP-23.5 (Prioritization of Form-Based Entities Over Mere Substrates).

  **5.0 Inheritance, Transfer, & Liability for Objects Subject to OD or FCC**
  *   **5.1 Refund Policy for Drifted Objects (NDEs):** Donors or original depositors retain a perpetual right to reclaim the *original CM*. As the NDE possesses zero CM, the Institute is liable only for:
      *   **5.1.1** Returning any *undrifted* CM fragments recovered during conservation (e.g., original dust particulates in sealed vials).
      *   **5.1.2** Providing a notarized certificate of ontological dissolution for the original AO.
  *   **5.2 Inheritance of FCC Objects:** Objects under FCC retain the original accession number. Rights and liabilities associated with the accession (e.g., loan agreements, copyright) transfer *administratively* with the FCC designation. However:
      *   **5.2.1** Legally binding contracts referencing "the original object" or "its material substance" may be voidable upon provable OD exceeding 50% CM replacement. Legal Counsel must be consulted.
      *   **5.2.2** Insurance valuation for FCC objects must depreciate by 0.001% per annum, reflecting incremental ontological dissolution.
  *   **5.3 Liability for COs:** The Institute assumes separate liability for each CO. Damage to the vault/case (4.2.1) constitutes damage to *all* contained COs. Conservation treatment on one CO (e.g., SF stabilization) must be logged against *its* accession record, noting potential impact on the coincident CS.

  **6.0 Ontological Drift Thresholds & Monitoring (See Sidebar)**
  *   **6.1** The SOR must maintain a Drift Register tracking cumulative CM replacement for all AOs.
  *   **6.2** Upon reaching 100% OD (0% original CM), the original AO is formally de-accessioned (retroactive to t<sub>0</sub> if PMI is strictly applied), the NDE is accessioned under a new number, and the FCC (if applicable) is revoked. The original label is transferred to the NDE with an appended "(NDE)" suffix.

