  | 50% - 0.0001%           | Substantial Drift  | FCC mandatory if display continues; Quarterly audit; Public label must include "(FCC)".        | Depreciated; Exclusions may apply.          |
  | 0%                      | Complete Drift     | Immediate de-accession original AO; Accession NDE; Transfer label + "(NDE)"; Notify stakeholders. | New policy required for NDE (Nominal Value) |

