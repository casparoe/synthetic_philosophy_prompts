  Similarly, in the multiplayer case with 1000 players, each having a chance to send a card to win a prize if exactly one sends, the shared randomizing procedure (each sending with probability 1/1000) leads to a positive expected payoff. But after a player sees their own draw (which might tell them not to send, for instance), they would be tempted to send anyway because, conditional on the others following the procedure, the chance of winning might be higher if they send (if they think others are fixed). However, the reasoning move says that the player should commit to the procedure (and not deviate after seeing the draw) because the procedure is the object of choice and the symmetry holds at that level.

