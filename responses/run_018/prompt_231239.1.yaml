answer: |-
  The reasoning move you describe is a specific application within decision theory that addresses symmetric interactions by treating the decision procedure as the object of choice, leveraging the assumption of identical decision processes across agents to resolve coordination problems. This move is most precisely captured by **Updateless Decision Theory (UDT)**, developed by Wei Dai, which formalizes the idea of choosing a policy (e.g., a mapping from observations to actions) *before* updating on private information, thereby avoiding self-defeating deviations in symmetric or correlated scenarios.

  ### Key Features of the Move and How UDT Fits
  - **Core Mechanism**: UDT evaluates decisions at the level of a policy (or "decision procedure") rather than individual actions. In the prisoner's dilemma example, both players are assumed to run identical procedures, so the choice is between policies that output "cooperate" or "defect" for both. UDT compares the expected utility of these policy-level options (mutual cooperation vs. mutual defection), leading to cooperation as optimal. Similarly, in the multiplayer card-sending game, UDT commits to a randomized policy (send with probability \(1/1000\)) without conditioning on private draws, ensuring stability and optimal group outcomes.
    
  - **Handling Symmetry and Correlation**: UDT explicitly handles logical correlations (e.g., identical source code, shared training, or common causes) by treating the agent's decision as a mathematical fact that influences predictions about identical or similar agents. This is distinct from:
    - **Causal Decision Theory (CDT)**: CDT fails here because it ignores acausal links (e.g., no causal path between players' choices) and relies on dominance reasoning.
    - **Evidential Decision Theory (EDT)**: While EDT uses acts as evidence, it lacks UDT's policy-based commitment and can lead to instability (e.g., in the card game, EDT might defect after seeing a private draw). UDT subsumes EDT-like evidential reasoning but enforces consistency through policy selection.

  - **Boundaries and Limitations**:
    - **Shared Source Code vs. Common Cause**: UDT requires agents to model others as running *sufficiently similar* decision procedures. Literal source code identity is sufficient but not necessary; shared culture, training, or evolutionary history can create the needed similarity. However, "sufficiently" is context-dependent: similarity must be strong enough that agents can reasonably expect identical outputs in symmetric situations. If similarity is weak (e.g., minor cultural overlaps), the move may not hold.
    - **Indexical Information**: UDT handles private draws or positional information by being "updateless"—i.e., policies are chosen *before* indexical updates. In the card game, after seeing a private draw, a UDT agent does not reconsider; it adheres to the pre-committed policy. If agents update on indexical information (e.g., "I am player 7"), deviations can occur, but UDT avoids this by construction.
    - **Validity Domain**: The move works best in symmetric, one-shot interactions with high procedure similarity. It struggles with asymmetric payoffs, heterogeneous agents, or when common knowledge of similarity is absent. UDT extends beyond symmetry (e.g., Newcomb-like problems), but your described move is a symmetric special case.

  ### Why UDT is the Best Fit
  - UDT directly formalizes the policy-based commitment and updateless reasoning in your examples. It generalizes the symmetry argument beyond literal source-code identity to include any setup where agents model their procedures as functionally identical.
  - Established alternatives like **Timeless Decision Theory (TDT)** are closely related (and often conflated with UDT in informal discourse). TDT also uses logical correlations but focuses on "outputs" of identical procedures in the moment of decision. UDT is more comprehensive, as it explicitly handles dynamic settings with private information (e.g., the card game's random draw), making it a better match.
  - Terms like "acausal cooperation" describe the *outcome* (e.g., in prisoner's dilemma) but are not a formal theory. "Program equilibrium" (from game theory) requires observable source code and is narrower. UDT subsumes these ideas within a unified framework.

  ### Divergences and Caveats
  - UDT is broader than your described move: it applies to non-symmetric problems (e.g., logical uncertainty in Newcomb's paradox), whereas your focus is on symmetric common-procedure scenarios.
  - In practice, UDT's implementation depends on subjective priors about similarity. If agents doubt procedure identity (e.g., due to indexical uncertainty), cooperation may fail.
  - No theory fully resolves "how strong is sufficiently similar"; this remains an open problem in decision theory.

  In summary, **Updateless Decision Theory** is the established concept that best fits the move, with the symmetric, policy-based reasoning as a core application. For your purposes, UDT provides the precise machinery to define the valid core: *commit to a policy that maximizes expected utility from the prior perspective, ignoring updates from private information, when agents are modeled as running identical or sufficiently similar decision procedures*.

  \answer{Updateless Decision Theory}
