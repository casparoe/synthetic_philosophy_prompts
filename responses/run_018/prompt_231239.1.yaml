  After reviewing decision theory, the closest established concept is **"reflective decision theory"** or **"symmetric cooperation"**. However, a more precise term that has been used in the literature is **"TDT" (Timeless Decision Theory)** or **"UDT" (Updateless Decision Theory)**.

  - **TDT (Timeless Decision Theory)**: This theory, associated with Eliezer Yudkowsky, evaluates decisions by considering the output of the agent's decision procedure as a mathematical fact. In symmetric games, TDT reasons that if two agents have identical decision procedures, then they will output the same action. Therefore, in the Prisoner's Dilemma, TDT would cooperate because it sees that if it defects, the other (being identical) would also defect, leading to the worst outcome. TDT is often described as "choosing as if controlling the output of all identical decision procedures".

  - **UDT (Updateless Decision Theory)**: This is a more formal development by Wei Dai. UDT chooses a policy (a mapping from observations to actions) without updating on the fact that it has received a particular observation. In the multiplayer card-sending example, UDT would choose the policy (send with probability 1/1000) at the outset, without conditioning on the private draw. This avoids the instability of deviating after seeing the draw.

  Both TDT and UDT are designed to handle the kind of symmetry and common-cause reasoning described. They are not evidential decision theory (EDT) because they don't just use the act as evidence; they consider the logical or mathematical dependence between the agent's decision and the decisions of similar agents. They are also not causal decision theory (CDT) because they don't rely on causal influence.

