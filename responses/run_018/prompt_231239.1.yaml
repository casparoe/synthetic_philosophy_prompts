  3. **Does the move survive indexical information?** In UDT, the policy is chosen without conditioning on the indexical information. So the move is made at the policy level. However, if an agent were to update on indexical information and then reconsider, they might be tempted to deviate. UDT avoids this by precommitting to the policy.

