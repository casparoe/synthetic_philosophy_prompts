  ### Sonnet on Frege's Puzzle

  When Morning Star is bound to Morning Star,  
  A truth that dawns without the need for eyes—  
  No hunt through telescopes, no charted sky—  
  This sameness gleams where shallow meanings are.  

  But Morning Star to Evening Star we chain—  
  One flees the sun, one greets the waking west—  
  Two lights we mapped, two journeys we possessed,  
  Till Venus proved them one celestial name.  

  *Yet pause—the turn!* Though both find Venus' core,  
  The *guise* of dawn and dusk splits sense in twain;  
  This difference births the knowledge we attain...  
  But see! Belief now bars the fastened door:  

  When Lois hails the flyer in the air,  
  She doubts the man who wears the clerk's despair.  
  So reference fails—seek *modes* that thought displays,  
  Though hard to count, they guard truth's tangled maze.  

  ---

