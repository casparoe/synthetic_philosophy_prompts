  - Natural rights: Professor Evans' inherent merit deserves protection
  - Might-makes-right: Dean's authority prevails 
  - Pascalian: Customary procedures constrain the Dean

  The isolating feature (part C) must highlight how structural enforcement (documented rules + historical precedent) replaces personal coercion. If removed, Pascalian would default to might-makes-right.

  For part D's rebuttal, I'll have the might-makes-right advocate argue that institutional inertia isn't "force" in Pascal's sense since it lacks immediate coercive power. But this fails because Pascal's "force sustaining custom" includes systemic enforcement mechanisms.

