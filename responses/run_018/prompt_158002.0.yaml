answer: |-
  ### A. The Scenario  
  At Riverton University, tenured Professor Aris Thorne has been denied sabbatical funding by Dean Elena Rossi, who reallocated the limited budget to support her own research initiative. The dispute centers on Faculty Senate Rule 7.1, which explicitly prioritizes sabbatical requests for tenured faculty who have served 10+ years over discretionary "special projects." Thorne (15 years) applied under this rule, but Rossi claims her initiative addresses urgent institutional needs. While Rossi holds administrative authority, Rule 7.1 is codified in the faculty handbook, reinforced by 20 years of consistent precedent, and requires Senate approval for exceptions—which Rossi bypassed.  

  ### B. The Three Verdicts  
  1.  **Pascalian Conventionalist**: Rule 7.1 *must* be enforced. Justice resides in adherence to established custom (the Senate rule and its precedent), which is sustained by the structural force of institutional legitimacy—faculty trust, shared governance norms, and the threat of Senate censure or litigation. Defying it invites chaos by eroding institutional stability, even if Rossi is currently more powerful. Thorne prevails.  
  2.  **Natural-Rights**: Thorne deserves the funding. His pre-institutional entitlement arises from his labor (15 years of service) and the university’s implicit moral contract to reward academic merit and seniority. Rule 7.1 merely imperfectly reflects this deeper entitlement. Rossi’s initiative lacks comparable grounding.  
  3.  **Might-Makes-Right**: Rossi controls the budget and administrative levers. Her preference for her initiative determines the outcome. Rule 7.1 is irrelevant unless she chooses to honor it; her authority flows from her current dominance, not past agreements.  

  ### C. The Isolating Feature  
  The reversal hinges on **procedural entrenchment**: Rule 7.1 is embedded in ratified governance documents, validated by decades of uncontested application, and depends on a *distributed* enforcement mechanism (Senate oversight, potential grievance procedures, faculty solidarity). This structural inertia *is* the "force" sustaining the custom. Rossi’s personal administrative power is constrained by this system. Remove this feature (e.g., if Rule 7.1 were an unwritten guideline or Rossi could alter it unilaterally), and the Pascalian view collapses into might-makes-right—Rossi’s immediate power would define the operative "custom" and its enforcement.  

  ### D. The Power-Politics Rebuttal  
  A might-makes-right advocate argues Rossi’s *actual* control of resources and decision-making renders institutional inertia irrelevant: "Real force means Rossi can *ignore* the rule without immediate consequence. Senate procedures are mere theater unless backed by *present* coercive power she cannot defy. Pascal’s ‘force’ requires tangible, immediate compulsion—here, Rossi’s authority." **This attack fails**: Pascal’s conventionalism treats the institution’s *systemic* capacity to enforce norms (via delayed sanctions, reputational damage, or collective action) as the relevant "force." Rossi’s fear of Senate revolt or loss of legitimacy *is* the operative constraint, proving the custom’s structural force remains ascendant over her transient personal power. The conventionalist view stays intact.
