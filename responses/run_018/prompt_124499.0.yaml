 it reveals that the very category of 'irrational honoring of sunk costs' applies only when we have already adopted a particular, contestable model of rational agency. Conclude by stating what the Concorde case shows about the fallacy itself: is it a universal norm, a useful heuristic that fails in public and symbolic contexts, or a misdiagnosis of a genuinely different form of practical reasoning?
