prompt: |-
  Hey, I've been lurking on LW and ACX for years and there's this pattern I keep seeing in rationalist-adjacent self-improvement writing that I don't have a word for. People coin a local failure mode — like "status-quo bias in career choice" or "identity-protective reasoning about your productivity system" — and then start treating it like it's in the same ontologial bucket as base-rate neglect or the conjunction fallacy. The slippage goes both ways: they defend an intervention by citing the debiasing literature that only applies to the classic Kahneman-style errors, and when you point out their local concept has no reproducible experimental backing, they retreat to "well, system 1 is messy and bias is bias." It's not exactly concept creep, since that usually tracks moral or psychiatric terms expanding, and it's not plain equivocation because there's a real mechanistic resemblance. Is there an established name for this kind of microdomain taxonomy bleed — where a blogger-coined concept gets copy-pasted into the formal cognitive-bias framework and starts to recieve its epistemic authority? If there's no term, can you coin one and draw the edges: how it's different from analogical reasoning, from family-resemblance defenses a la Wittgenstein, and from ordinary auxiliary-hypothesis tweaking? I don't need a bibliography, just the carving — what exactly it is and where it stops being this thing.
reasoning: |-
  Okay, the user has been observing a specific pattern in rationalist and self-improvement communities where locally coined failure modes are treated as equivalent to well-established cognitive biases. They're looking for a term to describe this phenomenon or want one coined. Let me break down their query.

  First, they mention examples like "status-quo bias in career choice" or "identity-protective reasoning about productivity systems." These are specific, context-dependent concepts that bloggers create. The issue is that these get lumped into the same category as biases like base-rate neglect, which have extensive experimental backing. 

  The user points out two aspects: defending interventions using debiasing literature that doesn't apply, and retreating to vague justifications when challenged. They differentiate this from concept creep or equivocation. They want to know if there's a term for this "microdomain taxonomy bleed."

  I need to recall if there's an existing term. Concept creep usually applies to expanding definitions in moral or psychiatric contexts, which doesn't fit here. Equivocation involves ambiguous language, but the user says there's a mechanistic resemblance, so it's more subtle. 

  The core issue seems to be a category error. Locally defined concepts are being treated as universal cognitive biases without evidence. This borrows the epistemic authority of established biases. The retreat to "system 1 is messy" acts as a shield against criticism. 

  Possible terms that come to mind: bias laundering, heuristic hijacking, folk bias reification. Let me evaluate each. "Bias laundering" emphasizes the borrowed legitimacy. "Heuristic hijacking" focuses on misapplying the heuristic concept. "Folk bias reification" highlights treating informal ideas as real entities. 

  Among these, "bias laundering" seems most fitting because it captures the process of legitimizing unverified concepts through association with established biases. It also hints at the defensive retreat mechanism. 

  How is this different from analogical reasoning? Analogies are useful but here the resemblance is overstated to grant undue authority. Unlike Wittgenstein's family resemblances, which acknowledge fluid categories, this treats the new concept as equivalent. Auxiliary hypotheses tweak theories, but here it's about category boundaries being blurred. 

  The boundaries: it stops being this when the concept has empirical support or is presented as a metaphor without claiming the same epistemic weight. Also, if it's clearly a local model without universal claims. 

  The user likely wants to critique this pattern effectively in discussions. Naming it helps in calling out the flawed reasoning without lengthy explanations. They might also want to promote more rigorous thinking in these communities.
answer: |-
  This pattern you're describing is perceptive and under-analyzed. While no single established term perfectly captures it, the phenomenon is best labeled **Bias Laundering**.

  Here's the carving:

  1.  **Core Mechanism (The Laundering):**
      *   A locally observed, intuitively plausible, *domain-specific* failure mode (e.g., "productivity identity shielding") is identified, often via anecdote or introspection.
      *   This local concept is *framed using the language and taxonomy* of formal cognitive biases ("it's like identity-protective cognition, but for your task manager").
      *   By adopting this framing, the concept implicitly *borrows the epistemic authority, experimental backing, and perceived universality* of the well-established bias it's analogized to.
      *   This borrowed authority is then used to *justify interventions* as if they were supported by the same robust evidence base as debiasing techniques for the original, experimentally validated bias.

  2.  **Key Features & Boundaries:**
      *   **Distinct from Analogical Reasoning:** Analogy is the *tool* used ("this local thing is *like* bias X"). Bias Laundering is the *exploitation* of that analogy to grant unearned epistemic status and justify actions ("therefore, debiasing techniques for X *must apply* here, and criticizing this concept is like denying bias X exists").
      *   **Distinct from Wittgensteinian Family Resemblance:** Family resemblance acknowledges fuzzy boundaries and overlapping features without demanding strict identity. Bias Laundering *actively obscures* the lack of identity and leverages the resemblance to claim membership in a category defined by experimental rigor that the local concept lacks. It pretends the resemblance implies equivalence in kind and evidentiary support.
      *   **Distinct from Auxiliary-Hypothesis Tweaking:** Auxiliary tweaks modify a core theory to accommodate new data *within its domain*. Bias Laundering *smuggles an entirely new, unsupported concept* into the domain of an existing, well-supported theory by dressing it up in similar clothing. It's not extending a theory; it's parasitizing its credibility.
      *   **Distinct from Concept Creep:** Concept creep involves the *expansion of a term's definition* (e.g., "trauma" encompassing ever-milder events). Bias Laundering involves *creating a new, local concept* and *fraudulently presenting it as an instance* of an existing, well-defined category. It's counterfeit coinage, not inflation.
      *   **Distinct from Plain Equivocation:** Equivocation uses the same word with different meanings. Bias Laundering uses *different but intentionally similar-sounding concepts* while implying they share the same meaning *and evidentiary foundation*. The slippage is between *levels* of conceptual rigor.

  3.  **Where It Stops Being Bias Laundering:**
      *   **When Empirical Validation Appears:** If rigorous research *later* demonstrates the local failure mode is a robust, generalizable phenomenon operating via similar mechanisms, it transitions from laundering to legitimate extension (or identification of a new bias).
      *   **When Presented as Pure Analogy/Metaphor:** If the author explicitly states, "This local pattern *reminds me* of Confirmation Bias, but it's not the same thing; this is just a useful metaphor," it avoids laundering. The borrowed language is acknowledged as illustrative, not definitional.
      *   **When Framed as a Local Model:** If the concept is explicitly presented as a useful heuristic or model *specific to a narrow domain* (e.g., "In the context of EA grantmaking, we observe 'impact-framing lock-in'") without claiming it's a universal cognitive bias equivalent to Anchoring, it's not laundering. It's domain-specific modeling.
      *   **When the Retreat is Substantive:** If the retreat from "it's exactly like Bias X" to "system 1 is messy" is followed by *novel mechanistic speculation or domain-specific evidence* relevant to the local concept, it moves towards honest hypothesis generation. Laundering relies on the retreat as a defensive *termination* of scrutiny.

  **The Essence:** Bias Laundering is the **epistemic misappropriation** of the credibility associated with experimentally validated cognitive biases. It dresses up intuitive, context-bound observations in the formal attire of cognitive psychology to shield them from the scrutiny their lack of empirical foundation warrants, while simultaneously leveraging that borrowed authority to recommend actions. The "System 1 is messy" retreat is the ultimate laundering rinse cycle – dissolving specificity into an untestable fog once challenged. It's a specific form of **categorical credential theft** within the self-improvement/rationalist ecosystem.
