  ## The Biographer's Mirage: Plutarch, Hagiography, and the Dubious Moral Calibration of Lives

  Plutarch’s *Parallel Lives*, pairing Greek and Roman figures like the dissolute Demetrius Poliorcetes alongside the tragically flawed Mark Antony, presents a beguiling proposition: that juxtaposing such lives functions as a moral compass, "calibrating our judgement about virtue" like a statistician refining a forecast with reference classes. The scepticism you voice, however, strikes at the very heart of biography's pretensions to moral pedagogy. Does the reading of lives genuinely hone ethical reasoning, or is it merely sophisticated hagiography – a curated narrative salve for the reader's conscience, creating the comforting illusion of moral labour without the graft? Examining Plutarch’s method, the persistent hagiographic impulse, and the modern echoes in Effective Altruism (EA) case studies reveals a complex, often damning picture: biography *can* serve moral development, but only when it transcends its inherent biases and the reader resists its flattering illusions.

  Plutarch’s explicit aim was didactic, grounded in **mimēsis** (imitation). He believed encountering exemplars of virtue (or cautionary tales of vice) directly inspired emulation: "virtue, by the bare statement of its actions, can so affect men’s minds as to create at once both admiration of the things done and a desire to imitate the doers." Comparing Demetrius’s reckless ambition and dissolution with Antony’s similar trajectory, albeit on a grander Roman stage, was meant to sharpen the reader’s discernment. By seeing common failings – susceptibility to flattery, lust, strategic folly – manifest across cultures and eras, the reader should, in theory, internalise patterns, recognise these vices in embryo within themselves, and cultivate the opposing virtues. It’s a form of moral pattern recognition, using historical figures as a "reference class" for human potential and downfall.

  Yet, the hagiographic critique – that biography is "just hagiography with better marketing" – lands with considerable force against Plutarch, and indeed, most biographical traditions. **Selection bias is endemic.** Plutarch chose subjects deemed historically significant, almost exclusively elite male military/political leaders. The vast tapestry of human experience – the quiet lives of integrity, the complex struggles of the marginalised, the banality of everyday goodness – is absent. His focus creates an implicit bias towards dramatic action, power, and often, the very vices he condemns, simply because they make for a compelling narrative. **Narrative framing flatters the reader.** Plutarch, despite his comparative structure, often shapes his narratives towards a moral conclusion. The complexity, contradictions, and sheer *luck* inherent in any life are smoothed into a coherent arc serving the lesson. We see Antony’s downfall stemming clearly from his flaws, less from the brutal political realities of the dying Republic or the genius of Octavian. This creates a satisfying, often self-congratulatory, illusion: *we* can see the flaws, *we* understand the moral, therefore *we* are wiser. It flatters the reader’s judgement without necessarily challenging their own moral blind spots or demanding genuine self-scrutiny. The "calibration" risks being confirmation bias in classical dress, aligning our judgement with the biographer’s pre-selected moral framework.

  This critique finds a disturbingly resonant echo in the **modern use of biographical case studies within Effective Altruism (EA)**. EA frequently employs narratives of figures like Peter Singer (for intellectual inspiration) or historical/philanthropic exemplars (e.g., John D. Rockefeller, Warren Buffett, or modern EA entrepreneurs) to illustrate principles of high-impact giving, rational altruism, and life choices focused on maximising good. The **failure mode is strikingly similar**:

  1.  **Extreme Selection Bias:** EA case studies overwhelmingly feature highly successful individuals – often wealthy entrepreneurs, groundbreaking scientists, or exceptionally impactful activists. This creates a survivorship bias. Where are the detailed, equally compelling case studies of those who *tried* to maximise impact but failed due to bad luck, flawed reasoning, unforeseen consequences, or the inherent difficulty of measuring complex outcomes? We see the winners, not the statistically more numerous also-rans whose stories might offer equally vital, albeit less inspiring, lessons about risk, humility, and the limits of prediction.
  2.  **Narrative Simplification & Hagiographic Glow:** Complex lives and motivations are often streamlined to fit the EA framework. The messy realities of philanthropy (power dynamics, unintended consequences, ethical compromises), the role of privilege and luck in achieving the platform for massive impact, and the personal costs or ethical ambiguities involved are frequently downplayed. The narrative becomes one of heroic rationality overcoming obstacles to do immense good, inviting admiration and emulation, but potentially obscuring the contingent, context-dependent nature of their "success" and the genuine dilemmas faced.
  3.  **Flattering the Reader's Epistemic Stance:** Engaging with these curated success stories can create the powerful illusion that one has grasped the essence of effective doing good. It feels like rigorous epistemic labour – studying the 'best'. But this can mask the vast gulf between *understanding* a case study and *replicating* its success in a different, unpredictable context. It risks substituting the *feeling* of moral and intellectual superiority (belonging to the group that 'gets' these high-impact strategies) for the far harder, messier work of ongoing critical evaluation, personal sacrifice, and navigating real-world ethical complexity with imperfect information.

  **So, does biography make you better, or just make you feel like you’ve done the labour?**

  The conclusion is neither absolute nor comforting. **Biography alone, consumed passively, is more likely to flatter than fundamentally reform.** Plutarch’s method, while noble in intent, succumbs too easily to selection bias and narrative determinism. The EA case study approach, despite its modern, quantitative aspirations, risks replicating the same flaws, offering inspiring but potentially misleading blueprints for moral action derived from unrepresentative outliers.

  **However, biography *can* be a genuine tool for moral reasoning if approached with relentless critical awareness:**

  1.  **As Raw Material, Not Blueprint:** Lives are not reference classes for direct imitation or simple calibration. They are complex, contingent historical artefacts. The moral work begins when we interrogate the biographer’s choices, the societal context, the role of luck, the suppressed contradictions, and the uncomfortable details glossed over by the narrative arc. Plutarch becomes valuable not when we seek to *be* Pericles, but when we ask *why* he presented Pericles thus, what he omitted, and how Athenian democracy shaped and constrained those virtues.
  2.  **Fostering Cognitive Empathy & Complexity:** Well-wrought biographies, even flawed ones, can transport us into radically different mindsets and circumstances. Reading about Antony’s fatal indecision or Demetrius’s corrosive ambition *in situ*, within the pressures of Hellenistic kingship or triumviral Rome, challenges simplistic moralising. It forces us to confront the often-tragic interplay of character, circumstance, and consequence, fostering a more nuanced, empathetic understanding of human frailty and the difficulty of virtuous action – a crucial foundation for sound moral judgement.
  3.  **Highlighting Recurring Patterns (Critically):** While not a statistical reference class, biographies *can* illuminate recurring human dilemmas: the corrupting nature of power, the tension between pragmatism and principle, the psychology of self-deception. Recognising these patterns *as patterns* – not as guaranteed predictors, but as tendencies demanding vigilance – is valuable. The key is to hold these patterns lightly, constantly testing them against other evidence and our own experience, not accepting them as Plutarch’s (or EA’s) definitive moral calculus.
  4.  **Demanding Context in EA:** For EA case studies to avoid Plutarch’s trap, they must foreground context, failure, and critical dissection. They should be presented alongside analyses of similar attempts that *didn't* yield massive impact, rigorous examinations of counterfactuals and unintended consequences, and honest appraisals of the role of privilege and luck. The lesson should be methodological humility and critical thinking, not hero worship or uncritical mimicry.

  Ultimately, the moral value of biography lies not in the text itself, but in the **critical engagement of the reader**. Plutarch’s *Lives*, or an EA case study, doesn't calibrate virtue like a scientific instrument. It offers a rich, but deeply biased and constructed, dataset. The genuine moral labour begins when we dismantle the hagiography, question the selection, wrestle with the complexities, resist the flattering narrative, and use these fragmented portraits of other lives not as mirrors for our own presumed virtue, nor as simple blueprints, but as provocations for deeper, more humble, and more rigorous ethical reflection about the messy reality of human action in an uncertain world. Biography doesn't make you better; the hard, sceptical work you do *with* it just might. The feeling of having done the epistemic labour is often the mirage; the real labour is questioning that very feeling.
