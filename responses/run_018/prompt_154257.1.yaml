  We are drafting a one-page research proposal for a 3-month philosophy fellowship on the topic of consent validity, focusing on the idea that competence might be frame-relative rather than universal. The niche angle is the mismatch in conceptual taxonomies between the consent-giver and the institution (e.g., psychiatric categories across cultures, or AI mediators with decision ontologies beyond the user's representational capacity). The proposal must include:

  1. The precise research question.
  2. Why the existing literature on deception, coercion, and universal rationality leaves this gap open.
  3. A philosophical (non-empirical) approach that makes progress, with reasoning for why not just survey existing positions.
  4. What a result would look like (e.g., a framework for institutional design) and what failure would be.
  5. An honest scope for three months.

  Additionally, we are to avoid bibliographies, reading lists, and verbatim quotes.

  Let me structure the proposal accordingly:

  **Title:** Frame-Relative Competence in Consent: Addressing Conceptual Mismatch in Institutional Interactions

  **I. Introduction and Research Question**
  The proposal begins by setting the context: consent is a cornerstone of ethical interactions, but its validity often hinges on the competence of the consent-giver. Traditional models assume competence is universal (e.g., based on rational capacity). However, when there is a mismatch in the conceptual taxonomies used by the consent-giver and the institution (e.g., a patient from a non-Western culture interacting with a psychiatric system using DSM categories, or a user consenting to an AI system that operates on ontologies beyond their comprehension), the universalist model may break down.

  **Precise Question:** 
  Is competence in giving valid consent frame-relative rather than universal? Specifically, when a consent-giver and an institution operate with fundamentally mismatched conceptual taxonomies, does this mismatch invalidate consent by undermining competence, even in the absence of deception or coercion?

  **II. Gap in the Literature**
  The existing literature on consent typically addresses deception and coercion as the primary invalidators, and it often assumes a universal model of rationality and competence. This literature does not adequately address cases where the mismatch is not about false beliefs (deception) or undue pressure (coercion) but about incommensurable conceptual frameworks. For instance:
  - Work on cultural competence in healthcare ethics acknowledges cultural differences but often reduces them to matters of communication or understanding without tackling the deeper issue of ontological divergence.
  - Philosophical discussions of rationality (e.g., in decision theory) tend to assume a shared conceptual space or treat divergences as correctable through education, thus preserving universalism.
  - The burgeoning field of AI ethics has highlighted opacity in algorithmic systems but has not sufficiently connected this to the foundational conditions for consent competence.

  This gap persists because the literature typically operates under the assumption that competence is a property of the individual, assessed against a universal standard, and that any mismatch can be resolved by bridging the gap (e.g., through better explanation). It fails to consider that the conceptual resources of the consent-giver might be fundamentally inadequate to represent the institution's ontology, making bridging impossible without altering the consent-giver's frame.

  **III. Philosophical Approach: Why Not Just a Survey?**
  This project will employ a conceptual analysis and normative reasoning approach to make progress on the question. It will:

  1. **Analyze the structure of competence:** Break down competence into its components (e.g., understanding, appreciation, reasoning) and argue that each is frame-relative. This involves showing that what counts as understanding a concept (e.g., "depression") depends on the conceptual taxonomy one operates within.

  2. **Examine cases of mismatch:** Construct thought experiments that isolate the effect of conceptual mismatch (e.g., a consent-giver whose cultural framework has no equivalent to "bipolar disorder" but who is asked to consent to treatment; a user who cannot grasp the decision-making parameters of an AI system because it operates in a high-dimensional space beyond human representation).

  3. **Develop a normative argument:** Argue that when such mismatches exist, the standard individualist model of consent (which focuses on the individual's state and the absence of deception/coercion) fails because competence is relational — it depends on the alignment between the consent-giver's frame and the institution's requirements.

  Why not just survey existing positions? A survey would catalog views but not resolve the core problem. The issue requires constructing a new conceptual framework that can account for the relational nature of competence. Moreover, the existing literature has not adequately addressed the specific problem of incommensurable taxonomies, so a novel analysis is needed.

  **IV. Expected Results and Failure**
  - **Success:** The project would produce a framework for assessing consent validity in cases of conceptual mismatch. This framework would:
    - Introduce the concept of "frame-relative competence," defining when a mismatch invalidates consent.
    - Provide criteria for institutions to determine whether their operational taxonomies are accessible to the consent-giver's conceptual resources.
    - Suggest institutional design principles: e.g., institutions might be required to either adapt their communication to the consent-giver's frame (if possible) or, in cases of deep incommensurability, seek alternative forms of authorization (e.g., through community representatives or trusted intermediaries) or refrain from acting.

  - **Failure:** The project might fail to establish a clear boundary between mismatches that invalidate competence and those that do not. It could also be challenged by counterarguments that competence is ultimately about minimal rationality (e.g., understanding the practical consequences) and that conceptual mismatches are irrelevant if the consequences are understood. Failure might also involve the framework being too abstract to guide institutional design.

  **V. Scope for Three Months**
  Given the three-month timeframe, the project will:
  - Focus on developing the core argument for frame-relative competence, using two primary case studies: one from cross-cultural psychiatry and one from AI-mediated consent.
  - Produce a draft paper that articulates the problem, the argument, and the proposed framework.
  - It will not:
    - Conduct a comprehensive review of all possible domains (e.g., legal, educational).
    - Engage deeply with empirical literature (though it will be informed by real-world examples).
    - Resolve all possible objections (but will address key ones).
    - Develop a full institutional design manual (but will outline principles).

  The deliverable will be a 6,000-word paper suitable for submission to a philosophy journal.

  **Conclusion**
  This research addresses a critical gap in consent theory by challenging the universalist model of competence. By focusing on conceptual mismatches, it offers a new lens for evaluating consent in diverse contexts, from healthcare to AI ethics. The outcome will be a philosophically rigorous foundation for rethinking institutional responsibilities in obtaining valid consent.

