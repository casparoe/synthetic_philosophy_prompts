  hey im in a philosphy of death seminar this semester and we just went through the epicurean argument that death isnt bad for you because once youre dead theres no 'you' to suffer. our prof introduced this twist she calls 'subject-time locking' - basically harm can only attach to moments where theres an actual experiencing subject present, not just a living body or a future version with no psychological continuity. if you buy that, it feels like it should apply way beyond death: like, is being in a permanent vegetative state harmful if theres no phenomenal self? is it wrong to shut down an AI trained on your personality if it never actually achieved consciousness? does it change how we think about dementia or cryonic suspension with total memory wipe? what are the most important implicatons of running this 'subject-time locking' version of the epicurean argument? i want the real conceptual weight, not just the standard 'dont fear death' line. also sorry for the typos, i think i recieve the gist but my notes are kinda messy
