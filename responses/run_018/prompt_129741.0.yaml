  For the flood case: if she's contextualist, "knows" might fail because the evacuation context raises epistemic standards—remembering the past model failure might now count as a relevant alternative that must be ruled out. If she's a pragmatic encroacher, the high stakes themselves make the 99% confidence insufficient for knowledge. Both would likely say "doesn't know" here, so it doesn't split them. 

  To distinguish, we'd need a case where stakes are low but conversational context demands high certainty. Imagine the eyewitness casually chatting with a pedantic philosopher who insists on absolute certainty—contextualism would deny "knows" here while pragmatic encroachment would allow it since stakes haven't changed. Or flip it: high stakes but relaxed conversational standards (e.g., a surgeon joking in the break room about a scan—pragmatic encroachment would still deny knowledge while contextualism might allow "knows" if the context is informal). 

