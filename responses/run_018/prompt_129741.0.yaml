prompt: |-
  I was talking with my roommate last night, she's in a grad seminar on knowledge and context, and she's been giving me her gut reactions to a bunch of cases. She's pretty firm that a hiker who checks a weather app saying dry skies knows it's not gonna rain for a picnic, but she says he doesn't know it for deciding whether to do a mountain rescue in the same conditions; she says a surgeon who reads a routine scan knows it's benign for a checkup but doesn't know it for greenlighting an expermental drug; she thinks a student who memorized the chapter knows the answer for a quiz but not for performing the procedure live; and she says that in casual chat an eyewitness knows the car was red, but in court with the same evidence she wouldn't say she knows, even though nothing about her brain changed. Now she's stuck on a new one: a climate modeler has 99% confidence of a flood in 48 hours, she reruns the code twice and gets identical output, but she also remembers a structurally identical failure in another region three years ago. The stakes are evacuating a town, and my roommate hasn't said whether the modeler knows there's a flood.

  Can you predict what she'll say, but more importantly I'm trying to figure out if she's running pure contextualism about teh word "knows", pragmatic encroachment where stakes literally change what belief counts as knowledge, or maybe an invariantist view where she just thinks people should be more carefull with assertions when risk is high. Lay out the different rules that fit all her earlier verdicts, tell me what each one predicts for the climate modeler, and then say which further case would actually split them apart. Please write this in continuous prose with no headings or bullet points or bold text, just like a long email, since I can't stand formatted answers.
