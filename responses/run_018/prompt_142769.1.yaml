  Having recently noticed that my own philosophical reasoning has become dangerously dependent on AI-generated summaries—so that I can recognize distinctions in testimony and trust without being able to reconstruct the arguments that justify them—I am redesigning my upper-level epistemology seminar's final exam to test for genuine comprehension rather than fluent regurgitation. Please write one essay question, with a model answer of about 700 words and a detailed marking scheme, suitable for a 75-minute exam. The question should center on a specific, somewhat niche conceptual distinction: between 'epistemic delegation,' where a knower retains the capacity to evaluate the judgments of another, and 'epistemic outsourcing,' where that evaluative capacity itself is transferred to an external system. To push students beyond standard summaries of extended cognition, introduce a hypothetical category—call it 'cognitive leaseholding'—in which an agent nominally retains ownership of a belief framework (for instance, a graduate student named Mira who relies on an AI to generate and apply criteria for assessing testimonial credibility) yet can no longer justify the framework's premises or recognize its anomalous outputs. Ask students to analyze whether Mira's condition represents a loss of understanding, a malfunction of extended cognition, or a genuinely distinct phenomenon; to specify what normative standard should apply—must she be able to reconstruct the framework independently, or is fluency combined with reliable tracking sufficient?; and to address whether distributed human-AI cognition necessarily entails erosion. The marking scheme should separate an A answer from a B answer by naming the specific philosophical moves required—particularly the reconstruction criterion, the fluency-versus-justification distinction, and the evaluation of whether 'cognitive leaseholding' collapses into existing categories—assigning clear weight to each, and identifying the typical mistakes that should cost marks. Do not ask for bibliographies, citations, or reading lists; the answer should be answerable from conceptual analysis alone.
