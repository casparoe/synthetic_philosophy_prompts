answer: |-
  In a variational autoencoder (VAE) with a permutation-equivariant encoder/decoder, learned symmetries allow hidden-layer dimension swaps (via weight reordering) that preserve input-output mappings. This creates a "hole": distinct internal state configurations (e.g., permuted latent vectors) produce identical behaviors, underdetermining the "true" state representation within the symmetry group. Consequently, the system's self-model (a learned map of its hidden space) cannot resolve which permutation reflects reality, undermining trust in introspective predictions—since all configurations are empirically indistinguishable.  

  Settled in physics: Diffeomorphism invariance forces spacetime relationalism (no "hidden" point identities). Genuinely contested in AI: whether neural symmetries imply representational anti-realism (states lack intrinsic meaning) or if dynamical constraints (e.g., temporal continuity) restore determinacy.  

