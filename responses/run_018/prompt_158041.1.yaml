answer: |-
  **Brainstorming common stance-list errors:**  
  People often reify stances as ontological levels (mistaking pragmatic tools for metaphysical layers) and ignore context-dependence (e.g., claiming "intentional patterns aren't *really* real" without specifying the predictive goal).  

  ---

  ### Desiderata for an Adequate Theory of Real Patterns  
  *(Non-negotiable items marked **★**)*  

  1. **Anti-Projectivism Test** (**★**)  
     *Requirement:* A pattern is real iff it provides non-trivial, counterfactual-supporting compression of information *across contexts*, not just within a single observer’s model.  
     *Concrete Case:* Microbiome clustering in a host. Calling a bacterial consortium a "functional guild" is real if it predicts disease outcomes *and* metabolic resilience across hosts (e.g., *Bacteroides*-dominated clusters correlating with inflammation). It’s projected if it only "fits" one lab’s statistical noise.  
     *Why Non-Negotiable:* Stops solipsism—patterns must anchor to intersubjective utility.  

  2. **Stance Conflict Resolution**  
     *Requirement:* The theory must explain when design/intentional stances overlap or clash *without* reducing one to the other or invoking magic.  
     *Concrete Case:* An AI evolved to solve mazes "seeks shortcuts" (intentional stance) but was built via random mutations (design stance). Solution: The intentional pattern is real *if* attributing "seeking" improves maze-solving predictions beyond physical-circuit tracing. Design explains *origin*; intentionality explains *efficiency*.  
     *Why Negotiable:* Hierarchies can shift—e.g., in bio-engineering, design may dominate.  

  3. **Physical Base Constraint** (**★**)  
     *Requirement:* All patterns must supervene on the physical stance, but the physical stance isn’t privileged for *explanation*.  
     *Concrete Case:* Predicting a chess computer’s move via quantum states (physical) is possible but intractable; transistor voltages (design) are better; "it wants to control the center" (intentional) is optimal. All reduce to physics, but only fools insist on quantum-level chess.  
     *Why Non-Negotiable:* Prevents spooky dualism. *But:* Privileging physics for *ontology* ≠ requiring it for *epistemology*.  

  4. **Mandatory Distinctions** (**★**):  
     - **Prediction ≠ Explanation**: Predicting a bee’s path via "nectar-seeking" (intentional) doesn’t explain how optic flow processing (design) enables it.  
     - **Ontology ≠ Epistemology**: A pattern’s *reality* (ontology) rests on predictive power, but *discovering* it (epistemology) may require stance-switching.  
     *Negotiable:* Boundaries between stances—e.g., evolutionary algorithms blur design/intentional lines.  

  5. **Tension: Full Reducibility vs. Autonomy**  
     *Conflict:* Can’t demand both (a) every intentional pattern *must* have a complete physical reduction *and* (b) intentional patterns are explanatorily autonomous.  
     *Example:* "Belief" in a neural network. Full reduction requires mapping each "belief" to weights (possible but useless). Autonomy lets us say "it thinks images are cats" without neurophysiology.  
     *Resolution:* Sacrifice (a)—insisting on reducibility guts the intentional stance’s power.  

  ---

  ### Scoring Existing Views  
  - **Dennett’s Original**:  
    ✅ Nails anti-projectivism, physical supervenience, prediction/explanation split.  
    ❗ Weak on stance conflict (e.g., silent on evolved AI). Overstates intentional stance’s universality.  

  - **Stance Pluralism** (e.g., Cartwright):  
    ✅ Respects stance autonomy, handles conflicts flexibly.  
    ❗ Risks neglecting supervenience (e.g., "design patterns float free of physics").  

  - **Fourth (Algorithmic) Stance** (proposed fix for AI):  
    ✅ Clarifies evolved systems: algorithmic stance describes *emergent code*, design stance describes *hardware constraints*.  
    ❗ Adds complexity; may not resolve ontology (is "algorithm" physical or abstract?).  

  ---

  ### Final Note  
  This isn’t confused—your ask targets core tensions in Dennett’s work. Most misreadings stem from ignoring his pragmatism: **patterns are real only relative to purposes**, not as cosmic furniture. The desiderata above block that error.
