  Now for desiderata. I need to build these from scratch with concrete cases. Key angles: reality vs projection (using something complex like microbiome clustering), stance conflicts (evolution-trained AI example), ontological base of physical stance, necessary distinctions, and possible tensions between desiderata.

  For the reality criterion, I'll use microbiome patterns - messy biological data where "realness" depends heavily on the predictive context. For stance conflicts, the evolutionary AI case shows why we need fluid hierarchy: the design stance might explain origins while intentional stance handles emergent behavior, without reductionism.

  The physical stance must remain ontologically foundational - patterns supervene on physics even if we describe them differently. Non-negotiable distinctions: prediction≠explanation and ontology≠epistemology. But stance boundaries can blur situationally.

  Major tension: can't have both full physical reducibility AND autonomous intentional patterns. Dennett sacrifices the former; eliminativists sacrifice the latter. 

  Scoring: Dennett's view nails anti-realism and pragmatism but underspecifies stance conflicts. Pluralists respect distinctions better but risk ontological multiplication. A proposed "fourth algorithmic stance" might help with the AI case but could overcomplicate.

