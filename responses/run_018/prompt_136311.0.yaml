  ### Joint Statement: Adversarial Collaboration on Idealized Preference Theory  
  *Between a CEV Stabilist and an Idealized-Preference Pluralist*  

  We, a CEV stabilist and an idealized-preference pluralist, affirm substantial common ground on the mechanics and ethics of preference extrapolation. Our collaboration clarifies both shared principles and unresolved disagreements, aiming to advance discourse without presupposing resolution.  

  #### Agreed Principles  
  1. **Extrapolation Mechanics**: Preference idealization requires structured reflection, coherence checks (logical consistency, instrumental rationality), and iterative knowledge growth (e.g., eliminating false beliefs).  
  2. **Preference Revision**: Reflection can *genuinely revise* preferences, not merely reveal latent ones (e.g., abandoning tribalism after understanding its harms).  
  3. **Anti-Paternalism**: Agents’ idealization processes must be respected; imposing external values violates autonomy.  
  4. **Revealed-Preference Critique**: Observed choices are often shallow proxies for idealized preferences (e.g., addiction-driven behavior fails to reflect sober reflection).  

  #### Disagreements  
  | Issue | Stabilist Wording | Pluralist Wording | Is This Verbal? |  
  |-------|-------------------|-------------------|----------------|  
  | **1. Unity of True Volition** | "Global coherence is necessary: a single, fully consistent preference ordering exists across all contexts ('true volition')." | "Global coherence is normative overreach: preferences are legitimately fragmented into locally coherent, context-dependent profiles." | No |  
  | **2. Value Preservation** | "Contradictory values *must* resolve: memorializing past inconsistencies is irrational." | "Contradictory values *can* be preserved: fragmentation respects identity-in-time (e.g., archiving growth)." | No |  

  #### Cruxes and Predictions  
  **Crux 1: Unity of True Volition**  
  - **Scenario**: *The Diplomat*: An AI must choose between two policies for a diplomat. Policy A maximizes global welfare but violates a deeply held principle (e.g., pacifism). Policy B upholds pacifism but causes preventable suffering. After full reflection and knowledge expansion, the diplomat assesses preferences.  
    - **Stabilist Prediction**: The diplomat converges on a *single* coherent ordering (e.g., prioritizing welfare once pacifism’s contextual limits are understood).  
    - **Pluralist Prediction**: The diplomat retains *two* locally coherent profiles (pacifism in personal ethics, welfare-maximization in institutional roles), rejecting global unity.  

  **Crux 2: Value Preservation (Archivist Case)**  
  - **Scenario**: *The Sculptor*: A terminally ill artist, after idealization, wishes to preserve her early, contradictory values (e.g., "artistic fame matters above all" vs. "artistic integrity is absolute") in an archive, refusing to resolve them.  
    - **Stabilist Prediction**: The sculptor’s idealized self discards the contradiction as an error, archiving only *resolved* values (e.g., "integrity with contextual fame-seeking").  
    - **Pluralist Prediction**: The sculptor’s idealized self *deliberately* preserves the fragmented values as a memorial to her journey, seeing coherence as erasure.  

