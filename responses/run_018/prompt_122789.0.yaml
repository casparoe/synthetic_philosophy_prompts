prompt: |-
  I have been reading through the welfare standards that certifiers and regulators apply to farmed fish and shrimp, and the shape of the package puzzles me. As I understand the dominant pattern — please correct me where I have the details wrong, and flag anything that is jurisdiction- or species-specific rather than general — the requirements are overwhelmingly resource- and management-based: a ceiling on stocking density in kilograms per cubic metre, floors on dissolved oxygen, a species-appropriate temperature band, feed specifications, lighting regimes, a veterinary health plan, and limits on things like fin erosion, eye damage and sea-lice counts. On top of that there are increasingly animal-based outcome measures, of which cumulative mortality across the production cycle is the headline one; a farm above the threshold fails. Slaughter is handled separately: for finfish, more and more schemes require an actual stunning step, percussive or electrical, and treat death by ice slurry, chilling, or asphyxiation in air as a failure; for crustaceans the normal route is still gradual chilling or being cooked alive, and in many legal systems they attract no stunning requirement at all, only a general prohibition on unnecessary suffering. Three absences are conspicuous. Nothing caps how long an animal may be held in the system: a salmon may spend well over a year in a sea cage, ranched tuna many months, a breeding shrimp years. Nothing requires enrichment or any opportunity for species-typical activity. And routine culling of the runted, deformed or moribund is not merely permitted but required, and does not itself count against a farm, even though the same farm is penalised for letting animals die on their own. Fish are also routinely fasted for several days before slaughter, and that fast is written into standards as a welfare and food-safety measure rather than treated as a deprivation.

  What I want from you is the implicit theory this package rests on. Concretely, I would like you to reconstruct it and then interrogate it on five points. First, its temporal structure: mortality is tracked as a rate across the cycle and duration therefore enters the accounting indirectly, yet nothing limits duration as such. Does the practice presuppose that welfare is a property of time-slices whose badness does not aggregate into a lifetime quantity, or can an additive, whole-life view explain the asymmetry some other way? Second, death: cumulative mortality registers as a welfare failure while culling a suffering animal is required and costs the farm nothing on the scorecard. Does that presuppose that death is not itself a harm to the animal, and that mortality matters only as evidence of antecedent suffering? Third, the finfish–crustacean asymmetry: what must we believe about the threshold for being a welfare subject for that split to be principled, and is that belief strictly presupposed or merely convenient given the state of the evidence, costs, and political feasibility? Fourth, the unit of assessment: thresholds on rates and averages seem to make the group, not the individual, the object of evaluation. Fifth, fasting: is a standard built from resources, health and a humane death strictly a negative or health-centred conception of welfare, and would any positive-welfare or flourishing view forbid it?

  To pressure-test the reconstruction, consider rewriting such a standard in lifetime terms: replace the thresholds with a ceiling on the integral over each animal's whole life of a welfare index sensitive to both intensity and duration — call it negative-welfare-days. Under that rule a short, dense, fast-grown cycle could beat a roomy one; earlier slaughter automatically scores better; culling a chronically suffering animal becomes a welfare improvement rather than a tragedy; and a system offering a long, good life could fail where a cramped, brief one passes. Tell me whether that consequence really follows from the commitments you have reconstructed or only from my particular way of writing the metric, which commitment is doing the work if the consequence seems repugnant, and what would have to be added to the standards to block it.

  Two further requirements. Epistemically: separate clearly, throughout, what is settled from what is genuinely contested among people who actually work on animal welfare science and its philosophy — fish nociception versus fish phenomenal consciousness, crustacean pain, whether welfare aggregates additively across a life, whether death harms a non-human animal, whether positive welfare is a distinct requirement — and do not present a contested view as the consensus or a contested empirical claim as established. Say too where the answer is underdetermined by the practice itself, so that several theories would license the same standards, and distinguish what the practice strictly presupposes from what it merely fits well with. Format: after your prose analysis, give me a single valid, parseable JSON object, with no commentary after it, using exactly these keys and types:

  - "description_corrections": array of strings — anything wrong, outdated, or jurisdiction-specific in my description of the practice.
  - "commitments": array of objects, each with keys "commitment" (string, the view attributed to the practice, stated as a claim about welfare, death, or standing), "status" (string, exactly one of "strictly_presupposed", "strongly_suggested", "merely_compatible"), "why" (string, which feature of the practice forces or merely invites it), "rivals_ruled_out" (array of strings), "epistemic_status" (string, exactly one of "settled", "contested", "speculative"), and "contestation" (string: who disagrees, about what, or "none").
  - "tensions": array of objects, each with keys "tension" (string), "reconcilable" (boolean), and "resolution_or_why_not" (string).
  - "alternative_theories_licensing_the_same_practice": array of objects, each with keys "theory" (string), "how_it_licenses_the_practice" (string), and "where_it_would_diverge" (string).
  - "lifetime_integral_test": object with keys "follows_from_reconstruction" (boolean), "consequence" (string), "load_bearing_commitment" (string), and "rewrite_required" (string, what the standards would have to add to block the consequence).
  - "cruxes": array of objects, each with keys "question" (string), "kind" (string, "empirical" or "conceptual"), and "what_it_would_change" (string).
reasoning: |-
  We are given a detailed description of current welfare standards for farmed fish and shrimp, and asked to reconstruct the implicit theory behind them. The user then poses five specific questions and a test case about rewriting the standards in terms of a lifetime welfare integral. We must also note any corrections to the user's description, analyze the commitments, tensions, alternative theories, the test case, and key cruxes.

  ## Step 1: Corrections to the Description
  The user's description is generally accurate, but we note a few points:
  - **Jurisdiction/species specifics**: The user acknowledges that some aspects may be specific. We note that:
    - Stunning requirements for finfish are becoming more common but are not universal (e.g., in some jurisdictions, ice slurry or asphyxiation may still be permitted for some species).
    - For crustaceans, there is growing evidence of nociception and some standards (e.g., in Switzerland, Norway) now require stunning, but in many places, they are still excluded.
    - Stocking density limits and other parameters are highly species-specific (e.g., salmon vs. tilapia) and also depend on the production system (recirculating aquaculture vs. sea cages).
  - **Outcome measures**: Besides cumulative mortality, other animal-based measures (e.g., body condition, wounds, behavior) are increasingly included but are not yet universal.
  - **Culling**: The practice is common, but the requirement to cull is not always explicit in standards. However, it is standard industry practice to remove non-viable animals to prevent disease spread and maintain group health.

  We list these in the `description_corrections` array.

  ## Step 2: Reconstructing the Implicit Theory
  The current standards focus on:
  - **Resource-based**: Providing adequate inputs (space, water quality, feed, etc.).
  - **Management-based**: Procedures (veterinary care, health plans, culling).
  - **Outcome-based**: Mortality as a key indicator, and increasingly other health and behavioral outcomes.

  The implicit theory of welfare here appears to be:
  1. **Welfare as the absence of suffering and the presence of basic health**. This is a negative, health-centered view that does not explicitly require positive experiences or opportunities for natural behavior.
  2. **Welfare as a state at a given time**, not necessarily integrated over a lifetime. Hence, no cap on duration.
  3. **Death is not inherently a harm to the animal** (but high mortality indicates suffering). Culling is seen as a necessary management tool to prevent suffering and disease, and thus is not penalized.
  4. **Group-level focus**: Welfare is assessed at the group level (via rates and averages) because individual monitoring in large populations is impractical and because the industry is geared toward batch management.
  5. **Crustaceans may not be considered welfare subjects** in the same way as finfish due to scientific uncertainty about their capacity for suffering, practical challenges in stunning, and regulatory traditions.

  ## Step 3: Addressing the Five Points

  ### 1. Temporal Structure
  - **Practice**: Welfare is assessed at specific times (e.g., water quality, health checks) and mortality is a cumulative rate over the cycle. No limit on duration.
  - **Theory**: This suggests welfare is a time-slice property. The asymmetry (duration not limited) can be explained by:
    - A view that welfare does not aggregate additively over time (so a long life with good conditions is not necessarily better than a short one with the same conditions per day).
    - Alternatively, it may be that the industry assumes that if conditions are adequate at each time point, then the animal's welfare is acceptable regardless of duration. This avoids the need to account for the entire life.

  ### 2. Death
  - **Practice**: High mortality is penalized, but culling is required and not penalized.
  - **Theory**: This implies that death itself is not considered a harm to the animal. Mortality matters because it is evidence of suffering and poor conditions. Culling is seen as preventing further suffering and is thus a welfare-positive act.

  ### 3. Finfish-Crustacean Asymmetry
  - **Theory**: This split may rest on the belief that crustaceans lack the neural substrate for conscious suffering (or that the evidence is insufficient). Alternatively, it may be due to practical challenges (e.g., stunning methods for crustaceans are less developed) and regulatory inertia. It is not strictly principled but reflects current scientific and political consensus.

  ### 4. Unit of Assessment
  - **Practice**: Group-level thresholds (rates, averages) are used.
  - **Theory**: This reflects a view that welfare can be managed at the group level and that individual welfare is sufficiently captured by group indicators. It also acknowledges the impracticality of individual monitoring in intensive systems.

  ### 5. Fasting
  - **Practice**: Fasting is required and framed as a welfare and food-safety measure.
  - **Theory**: This fits a negative conception of welfare: preventing immediate harms (e.g., contamination during slaughter, stress from handling full guts) and promoting health. A positive welfare view might object to the deprivation of feeding, but current standards do not require positive experiences.

  ## Step 4: The Lifetime Integral Test
  The user proposes replacing current thresholds with a ceiling on the lifetime integral of negative welfare (e.g., negative-welfare-days). The consequences:
  - A short, dense cycle could beat a roomy one if the integral is lower (e.g., by having a shorter duration even if conditions are worse).
  - Earlier slaughter would automatically score better (since it reduces the integral).
  - Culling a suffering animal reduces the integral and thus is a welfare improvement.
  - A long, good life could fail if the integral (due to duration) exceeds the ceiling.

  This consequence follows from the additive aggregation of welfare over time and the inclusion of death as a harm (if death is included as a large negative). However, current standards do not adopt an additive lifetime view and do not consider death as a harm to the animal. Thus, the consequence is not directly implied by the current commitments but by the alternative metric.

  **What blocks this consequence?** Current standards do not have a lifetime perspective and do not aggregate welfare over time. To block the consequence without adopting the integral, the standards would need:
  - A minimum lifespan requirement (to prevent very short lives).
  - A requirement for positive conditions (not just absence of negative) to rule out very dense systems.
  - A prohibition on killing as a harm in itself (which current standards do not have).

  ## Step 5: Cruxes
  Key questions that would change the standards if resolved:
  - Empirical: Do fish and crustaceans experience pain and suffering? (Affects stunning and slaughter requirements.)
  - Conceptual: Does death harm the animal? (Affects culling and slaughter practices.)
  - Empirical/Conceptual: Does welfare aggregate additively over a lifetime? (Affects the importance of duration.)
  - Conceptual: Is positive welfare required? (Affects enrichment, fasting, etc.)

  ## Step 6: Formatting the JSON
  We must produce a JSON object with the specified keys.

  ### `description_corrections`
  Array of strings noting inaccuracies.

  ### `commitments`
  Array of objects with:
  - `commitment`: The view attributed.
  - `status`: "strictly_presupposed", "strongly_suggested", or "merely_compatible".
  - `why`: Which practice feature forces or invites it.
  - `rivals_ruled_out`: Alternative views that are incompatible.
  - `epistemic_status`: "settled", "contested", or "speculative".
  - `contestation`: Who disagrees or "none".

  ### `tensions`
  Array of objects with:
  - `tension`: Description of an internal tension.
  - `reconcilable`: Boolean.
  - `resolution_or_why_not`: How it is resolved or why not.

  ### `alternative_theories_licensing_the_same_practice`
  Array of objects with:
  - `theory`: An alternative theory.
  - `how_it_licenses_the_practice`: How it justifies the same standards.
  - `where_it_would_diverge`: Where it might lead to different standards.

  ### `lifetime_integral_test`
  An object with:
  - `follows_from_reconstruction`: Boolean (does the consequence follow from the reconstructed commitments?).
  - `consequence`: String (what the consequence is).
  - `load_bearing_commitment`: String (which commitment is key if the consequence seems repugnant).
  - `rewrite_required`: String (what must be added to block the consequence).

  ### `cruxes`
  Array of objects with:
  - `question`: The key question.
  - `kind`: "empirical" or "conceptual".
  - `what_it_would_change`: How the standards would change.

  ## Writing the JSON
  We now compose the JSON object based on the above.
