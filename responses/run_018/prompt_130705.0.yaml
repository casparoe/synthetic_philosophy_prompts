prompt: |-
  Give an example of a conceptual issue that arises when applying Pascal's distinction between justice and force—justice being powerless without force, and force being unjust without justice's appearance—to a modern institutional design call it normative escrow: a system in which the coercive authority of a decision is exercised immediately, but its full normative justification is deliberately withheld from the affected party until after compliance, on the grounds that premature disclosure would undermine voluntary adherence. The example should isolate the precise moment where the institution must either reveal that its authority is mere force, destroying legitimacy, or fabricate a retrospective justification, making justice subservient to power. Present it in one paragraph, leading with the concrete institutional scenario, then briefly identifying the Pascalian tension it exposes; do not cite texts, name specific works, or propose reading lists.
reasoning: |-
  Okay, the user wants an example of a conceptual issue when applying Pascal's distinction between justice and force to a modern institutional design called "normative escrow." Normative escrow involves coercive authority being exercised immediately, but the full justification is withheld until after compliance. The justification for withholding is that early disclosure would undermine voluntary adherence. The challenge is to find a moment where the institution must either reveal its authority as mere force (losing legitimacy) or fabricate a justification (making justice subservient to power).

  First, I need to recall Pascal's idea: justice without force is powerless, but force without justice is tyrannical. The key tension is the separation of force and justification. In normative escrow, the institution uses force upfront but delays the rationale. The critical moment is when the affected party questions the authority before compliance. At that point, if the institution can't provide justification, it reveals itself as pure force. If it makes up a reason, it subordinates justice to power.

  Now, I need a concrete scenario. The user mentioned institutional design. Possible areas: law enforcement, regulatory bodies, maybe something like emergency powers or administrative decisions. How about quarantine orders? During a pandemic, authorities might isolate individuals immediately but delay providing specific evidence. The person is forced to comply, but the detailed reasons come later. 

  In this scenario, if the person challenges the order before compliance, the institution faces a dilemma. If they disclose the justification prematurely, it might not hold up or could cause panic, defeating the purpose of voluntary adherence. But if they refuse to explain, it's pure coercion. If they fabricate a reason, like claiming non-existent threats, justice becomes a tool for power.

