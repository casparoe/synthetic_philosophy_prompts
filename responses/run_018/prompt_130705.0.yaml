  Another scenario could be algorithmic decisions, like automated content takedowns. A platform removes a post immediately for policy violations but doesn't explain why until later. If the user appeals before compliance (e.g., reposting), the platform must either reveal the lack of immediate rationale (force), invent a reason, or disclose prematurely, which might lead to gaming the system.

  Quarantine seems stronger because it involves state coercion and public interest. It's relatable and high-stakes. The example should clearly show the tension at the point of challenge. The paragraph structure should start with the scenario, then the moment of confrontation, and finally the Pascalian tension.

  Refining the quarantine example: During a disease outbreak, a health agency issues a mandatory home isolation order based on preliminary data. The individual demands justification before complying. The agency can't disclose without risking public panic or compromising sources. If they stay silent, it's force without justice. If they make up evidence, justice is fabricated for power. That's the crux.

