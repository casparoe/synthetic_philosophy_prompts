answer: |-
  During a mandatory public health quarantine triggered by preliminary exposure data, an individual challenges the order's basis *before* complying, demanding immediate disclosure of the specific evidence justifying their confinement. At this moment, the agency enforcing normative escrow faces the Pascalian crux: revealing the incomplete or probabilistic justification prematurely risks non-compliance if the evidence seems insufficient (undermining the system's premise), but refusing disclosure exposes the enforced confinement as pure coercive force devoid of present justification. Conversely, fabricating a more concrete rationale retroactively to appease the challenge sacrifices truth to power, demonstrating that "justice" here is merely a construct serving authority, not its legitimizing foundation. This forces the institution to choose between naked force destroying its legitimacy or manufactured justice proving subservient to power.
