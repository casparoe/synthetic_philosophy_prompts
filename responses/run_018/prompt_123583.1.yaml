answer: |-
  The argument for epistemic modesty, championing the tempering of inside-view reasoning with an outside-view calibration factor derived from track records of accuracy, rightfully commands respect in domains where outcomes are observable and feedback loops are unambiguous. Improving forecasting in such contexts—like predicting weather events or market fluctuations—is a demonstrable success story; here, the outside view provides a crucial corrective to individual overconfidence by leveraging historical performance data against an independent reality. However, this very strength becomes a critical weakness when we shift to domains where "success" is defined not by correspondence with observable events, but by alignment with the conclusions of a counterfactual, idealized deliberation—specifically, reasoning about what a fully rational agent with unlimited information *ought* to endorse.

  In this normative domain, the object of inquiry is inherently non-empirical. There is no independent behavioral footprint or measurable outcome against which to judge the accuracy of our judgments. Success is evaluated solely by whether our reasoning process or conclusion matches what we stipulate the idealized agent would determine. Crucially, the "outside view" in such domains is necessarily constructed. It aggregates the inside-view judgments of peers or experts about *this same counterfactual deliberation*. It is not an appeal to an external reality check, but an appeal to the collective judgments of others concerning the very same hypothetical scenario. Consequently, when we derive a calibration factor from this aggregated judgment—say, by noting the historical accuracy of experts on similar questions of idealized rationality—we face a profound circularity.

  The track record itself cannot be established non-circularly. To claim that certain agents have a superior "track record" in identifying what the idealized agent would endorse presupposes we already possess a reliable, independent criterion for identifying the "correct" answer in past cases. Yet, no such criterion exists outside the realm of collective inside-view judgments *about* that idealized deliberation. The assessment of past performance is itself an exercise in the very form of reasoning we are attempting to calibrate. We are judging past judgments about counterfactuals based on our current judgments about those same counterfactuals. There is no external arbiter; the calibration factor relies entirely on the very type of judgment it purports to calibrate.

  Applying a calibration coefficient derived from this aggregated inside-view does not, therefore, correct for individual overconfidence or bias in any meaningful sense. Instead, it merely averages the structurally identical biases inherent in the collective's approach to this counterfactual reasoning task. If the group shares systematic assumptions, blind spots, or methodological tendencies regarding how to model idealized rationality and information processing—which is likely in philosophical or highly abstract normative domains—then the aggregated "outside view" simply reflects and reinforces these shared biases. Weighting an individual's inside view by this factor does not introduce a corrective from an independent standard; it dilutes one view biased by the nature of the task with other views biased in the same fundamental way. The calibration process becomes self-referential and lacks the grounding in external reality that gives it force in predictive domains.

  This circularity leaves the calibration factor either undefined or arbitrarily fixed. It is undefined because there is no non-circular, objective basis for declaring one group's judgments about counterfactual rationality superior to another's, absent an observable outcome to settle the matter. Alternatively, if a factor *is* applied, its value must be fixed arbitrarily—perhaps based on institutional authority, perceived consensus, or historical convention—rather than being justifiably derived from demonstrated empirical success against an independent criterion. This arbitrariness fundamentally undermines the epistemic justification for applying the factor as a corrective.

  It is essential to distinguish this specific critique. The settled value of epistemic modesty in domains with clear feedback loops and observable outcomes, such as empirical forecasting, remains unchallenged here. The contested point, central to this argument, is whether normative or philosophical domains—particularly those hinging on counterfactual idealizations like "full rationality" and "unlimited information"—genuinely lack the independent feedback loops necessary for the outside view to function as a non-circular corrective. Where indirect normativity relies on such counterfactual procedures rather than actual behavior, the attempt to apply the standard machinery of epistemic modesty, predicated on track records against reality, becomes self-undermining. The calibration factor, stripped of its empirical anchor, loses its corrective power and collapses into an averaging of structurally similar inside-view commitments.
