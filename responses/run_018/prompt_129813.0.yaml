answer: |-
  Below is a structured role-play activity designed to meet your pedagogical goals. The game isolates the two dimensions of hypocritical blame (moral equality violation and insincerity) through hidden-information mechanics, requires active participation, and fits within a 75-minute seminar. The debrief explicitly maps gameplay to conceptual distinctions.

  ---

  ### **Game Title:** *The Blame Circle: Norms and Hypocrisy*  
  **Duration:** 75 minutes  
  **Participants:** 10 students + facilitator  
  **Materials:**  
  - Role cards (10 per round, pre-printed)  
  - Voting tokens (3 per student: green = "trust", red = "distrust")  
  - Whiteboard for tracking "blame credibility" scores  
  - Timer  

  ---

  ### **Game Structure**  
  **Core Mechanics:**  
  - Students play 3 rounds. Each round, they are assigned hidden roles determining **norm-violation status** (guilty/innocent) and **sincerity status** (sincere/performative).  
  - Players *must* publicly blame another player for a norm violation.  
  - After blame speeches, hidden roles are revealed, triggering point penalties tied to *why* credibility is lost:  
    - **Guilty blamers** lose points via **collective silencing** (no votes allowed).  
    - **Performative blamers** lose points via **audience distrust** (tokens withdrawn).  
  - Points ("blame credibility") track whose blame the group heeds.  

  **Norms Used:**  
  1. *Round 1:* "Thou shalt not arrive late to seminar."  
  2. *Round 2:* "Thou shalt not skip assigned readings."  
  3. *Round 3:* "Thou shalt not dominate discussion."  

  ---

  ### **Timeline**  
  | Phase          | Time     | Activity                                                                                                                                                                                                                                                                                               |  
  |----------------|----------|--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|  
  | **Setup**      | 0-5 min  | Distribute 3 tokens (2 green, 1 red) to each student. Explain rules neutrally: *"We’ll simulate blame scenarios. Your goal: earn ‘blame credibility’ points by convincing others your blame is valid. You MUST blame someone each round. Roles are hidden—play your card, not your real views."* |  
  | **Round 1**    | 5-20 min | 1. **Assign Roles:** Randomly distribute role cards for Round 1. Each card states:  
     - **Guilty/Innocent** of norm violation (e.g., *"You arrived late"*).  
     - **Sincere/Performative** (e.g., *"You genuinely care about punctuality"* vs. *"You blame to appear virtuous"*).  
     2. **Blame Speeches (2 min/player):** Each publicly blames one player (e.g., *"I blame Alex for lateness; it disrespects our time"*).  
     3. **Reveal & Penalize:** Flip role cards. Apply penalties:  
        - **Guilty blamers:** Silenced. Group cannot vote for/against their blame. *(-1 point)*.  
        - **Performative blamers:** Group votes with tokens. Each red token costs them *-1 point*.  
        - **Innocent+Sincere blamers:** Group votes with tokens. Each green token earns *+1 point*.  
     4. Record scores. |  
  | **Round 2-3**  | 20-50 min | Repeat with new norms/roles. Shrink speeches to 90 sec/player. Encourage strategic blame.                                                                                                                                                                                                              |  
  | **Debrief**    | 50-75 min | Facilitator-led discussion. Key questions:  
     1. *"When a blamer was revealed as GUILTY, how did the group react? Why couldn’t we vote?"* → Link to **moral equality** (no right to elevate self).  
     2. *"When a blamer was PERFORMATIVE, how did you use tokens? Why?"* → Link to **insincerity** (distrust, not authority loss).  
     3. *"Did these failures feel different? Should they be treated the same?"* → Contrast collective silencing (equality) vs. trust withdrawal (sincerity).  
     4. *"Could a guilty blamer regain standing? Could we forgive a performative one?"* → Introduce gaps (see below). |  

  ---

  ### **Roles & Rules for Participation**  
  - **Forced Blame:** Every player *must* accuse one other each round. No opt-out.  
  - **Token Voting:** After revelations, audience uses tokens to reward/sabotage blamers:  
    - Green = "I trust your sincerity."  
    - Red = "I distrust your motives."  
  - **Score System:**  
    - Innocent+Sincere: +1 per green token.  
    - Performative: -1 per red token.  
    - Guilty: Automatic -1 (no voting occurs).  
  - **Role Distribution (per round):**  
    - 3 "guilty" (2 sincere, 1 performative).  
    - 7 "innocent" (4 sincere, 3 performative).  
    *Ensures both hypocrite types appear.*  

  ---

  ### **Predicted Problems & Solutions**  
  1. **Problem:** Students avoid blaming to dodge hidden-role risks.  
     **Solution:** Enforce the "must blame" rule. Frame penalties as part of play: *"Losing points isn’t failure—it helps us dissect blame."*  

  2. **Problem:** Students conflate the two failures during debrief (e.g., *"Both are just hypocrites!"*).  
     **Solution:** Use revelation mechanics as anchor: *"Remember: when X was guilty, you couldn’t vote. When Y was performative, you chose to distrust. Why did the game treat these differently?"* Contrast structures, not just outcomes.  

  3. **Problem:** Performative blamers not penalized if audience likes them.  
     **Solution:** Acknowledge this in debrief: *"Did personal bonds override insincerity? Real blame dynamics do this too—but did it feel distinct from silencing?"*  

  ---

  ### **What the Activity Cannot Capture**  
  - **Waiving/Restoring Standing:** The game’s point system is mechanistic. It cannot model:  
    - A wrongdoer *waiving* the standing objection (e.g., *"I accept your blame even though you’re guilty too"*).  
    - A hypocrite *restoring* standing through apology or reform.  
  - **Facilitator Verbal Bridge:**  
    *"In real life, standing isn’t just about the blamer’s status—it’s relational. The wrongdoer can forgive a hypocrite’s blame, or the hypocrite can repent and regain authority. Our game’s rigid penalties don’t capture this fluidity. Keep this in mind when reading about standing-waiving next week."*  

  ---

  ### **Why This Works**  
  - **Mechanical Distinction:**  
    - **Guilty → Silencing:** Forces *collective* authority denial (equality failure).  
    - **Performative → Token Loss:** *Individual* audience withdrawals (sincerity failure).  
  - **No Lecture Needed:** Roles create experiential friction. Debrief extracts concepts from lived frustration.  
  - **Predictable Tensions:** Students *feel* the difference when their blame is voided (equality) vs. distrusted (insincerity).  

  This design turns abstract theory into bodily intuition, ensuring students "inhabit the difference" before labeling it. The token system and enforced participation guarantee engagement, while the debrief converts gameplay into conceptual clarity.
