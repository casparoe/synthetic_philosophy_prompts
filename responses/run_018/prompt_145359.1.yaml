answer: |-
  ### Exam Question  
  **(Total: 20 marks)**  

  > **Pain asymbolia** involves patients who accurately report sensations of tissue damage (e.g., "sharp," "hot") but feel *no suffering* and exhibit *no avoidance behavior*. Conversely, imagine a hypothetical **"Inverse Asymbolia"**: a patient with *zero sensory representation* of bodily harm (no "pinching," "burning," etc.) who nonetheless experiences **intense suffering** and **compelling avoidance urges** (e.g., pulling away from stimuli they insist "feel awful" despite no physical sensation).  
  >  
  > Using **BOTH** cases together, critically evaluate whether pain’s intrinsic "badness" is best explained by:  
  > - **(A)** Its role in *representing actual tissue damage*, OR  
  > - **(B)** Its *affective/motivational character* (suffering + drive to avoid).  
  >  
  > Argue which view (A or B) these cases collectively support—or whether they reveal a deeper complexity.  

  ---

  ### Model Answer  
  **(Key Points in Bold)**  

  Pain asymbolia and inverse asymbolia jointly challenge simplistic accounts of pain’s badness. **Asymbolia severs sensory representation from affect/motivation:** patients feel tissue damage (e.g., a pinprick’s location/intensity) but lack suffering/avoidance. This undermines (A), as accurate harm representation exists without badness. **Inverse asymbolia severs affect/motivation from sensory representation:** suffering and avoidance occur *without* any sensation of bodily harm. This challenges (B), as badness exists without sensory content tracking damage.  

  **Together, they suggest pain’s badness is neither purely representational nor purely affective/motivational.** Asymbolia shows representation alone is insufficient for badness; inverse asymbolia shows suffering/avoidance can arise without harm representation. **This implies badness requires integration:** sensory representation *and* affective/motivation must be coupled for pain to be intrinsically bad. Asymbolia uncouples them, neutralizing badness; inverse asymbolia shows affective/motivation without a sensory "object" is aberrant, dissociating badness from bodily threat.  

  **Thus, pain’s badness likely emerges from a composite state:** the affective/motivational system’s response *to* a sensory representation of harm. (A) and (B) are interdependent: badness fails if either component is missing or decoupled.  

  ---

  ### Marking Scheme (5 Points × 4 Marks Each)  
  | **Point** | **What to Award For** | **Common Pitfall (Mistake)** |  
  |-----------|------------------------|-------------------------------|  
  | **1. Asymbolia’s challenge to (A)** | Explaining that asymbolia *has* accurate harm representation but *lacks* badness (suffering/avoidance), thus refuting (A). | *Mistake:* Confusing asymbolia with analgesia (no sensation). |  
  | **2. Inverse case’s challenge to (B)** | Arguing that inverse asymbolia *has* badness (suffering/avoidance) but *lacks* sensory harm representation, thus refuting (B). | *Mistake:* Assuming avoidance behavior = pain sensation. |  
  | **3. Joint argument against reductionism** | Using BOTH cases to show neither (A) nor (B) alone captures badness, as each case isolates one component without producing the full phenomenon. | *Mistake:* Treating cases separately; failing to show their complementary force. |  
  | **4. Integration thesis** | Proposing that badness requires affective/motivation to be *directed at* sensory harm signals (i.e., coupling is essential). | *Mistake:* Asserting integration without explaining *why* decoupling neutralizes/asymbolizes badness. |  
  | **5. Ontological conclusion** | Concluding pain’s badness is an emergent property of the sensorimotor-affective nexus, not reducible to either component alone. | *Mistake:* Claiming one view "wins" outright; ignoring the dialectical tension. |  

  ---

  **Design Notes:**  
  - **Twist achieved:** Forces engagement with philosophy (what *makes* pain bad?) via clinical contrast.  
  - **Accessible:** Requires only core seminar concepts (representation, affect, motivation).  
  - **Rigorous:** Tests ability to synthesize counterfactuals into ontological arguments.  
  - **Anti-parroting:** Inverse case is hypothetical, preventing regurgitation of textbooks.  
  - **Time-efficient:** Focused on 5 clear, interdependent points (4 mins per point avg.).
