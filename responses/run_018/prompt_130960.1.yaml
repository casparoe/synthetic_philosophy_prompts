  Okay, the user is a sixth form student working on a coursework comparing Hart's harm principle and Devlin's legal moralism, specifically through the lens of "normative scaffolding." They want to understand how each theorist addresses the idea that laws build moral feelings beyond just punishing harm. 

  First, I need to unpack what the user means by "normative scaffolding." It seems to refer to how laws reinforce shared values and social cohesion, not just prevent direct harm. The user is asking if Hart overlooks this function of law, and if Devlin fails to consider how coercion can undermine that scaffolding. They also want to know which perspective better handles "moral fatigue" - when society tires of old norms.

  Hmm, the user's tone is casual but their questions are actually quite sophisticated. They're clearly engaged with the material but need it broken down without academic jargon. The "no citations" request makes sense - they're stuck without library access, so I'll avoid referencing specific texts or cases. British English is a simple adjustment.

  Breaking it down:
  Hart's harm principle is famously minimalist - law should only prevent harm to others. But does this ignore how banning certain acts (say, public indecency) might reinforce social glue? Devlin would argue yes, absolutely. His legal moralism claims society has a right to protect its fundamental moral fabric through law, even without direct harm. 

  But the user's second point is sharp: if laws enforce morals too heavily, people might resent the coercion, causing the very social fabric Devlin wants to protect to fray. That's a strong critique of Devlin. Hart might retort that shared values survive better when not legally imposed.

  On moral fatigue: Hart's view seems more flexible here. If norms shift, his harm principle would naturally stop prohibiting acts society no longer cares about (e.g., historical laws against blasphemy). Devlin's stance could force clinging to outdated morals, breeding resentment. But one could argue Devlin's approach prevents moral collapse during rapid change.

  The user's clearly done some thinking - the "scaffolding collapses if coerced" point shows real insight. I should validate that while keeping it conversational. Might use metaphors like "social glue" or "fabric" to make abstract ideas stick. 

  Key is balancing depth with accessibility. They don't need theory citations, but they do need clear contrasts: Hart=law as harm-preventer, Devlin=law as moral guardian. Then map "scaffolding" onto both - it's Devlin's strength and weakness, while Hart might underrate its importance. Moral fatigue leans Hart-friendly but with nuance.

  ...Right, structuring now: explain scaffolding simply, hammer the Hart/Devlin contrast through that lens, then tackle moral fatigue with examples they'd know (drug laws? sexuality norms?). Wrap with which handles fatigue better (Hart, cautiously). Keep sentences punchy, say "properly" instead of "correctly," maybe toss in a "mate" but not overdo it.
answer: |-
  Alright, mate, let's break down Hart vs. Devlin through this "normative scaffolding" lens – it's a proper good way to look at it for your coursework.

  **The Core Idea: Normative Scaffolding**

  Think of it like this: laws aren't just bobbies with truncheons stopping obvious harm. They're also like... the invisible beams and supports holding up a building. They signal what society *values*, what it thinks is fundamentally *right or wrong*, shaping how people feel about things over time. Banning something isn't just stopping the act; it's publicly declaring "This is *not* who we are," reinforcing shared moral feelings. That's the scaffolding – building and maintaining the shared moral structure everyone kind of operates within.

  **Hart's Harm Principle: Focused on Direct Harm, Might Miss the Scaffolding?**

  *   **Hart's View (Simplified):** Law should *only* step in to prevent **serious harm to other specific individuals**. Think physical assault, theft, fraud. Morality is mostly a private matter. If an act only offends people or challenges traditional morals but doesn't directly hurt someone identifiable, the law should butt out. Tolerance is key.
  *   **Through the Scaffolding Lens:** Critics (like your tutor's point) argue Hart might **underestimate how law builds that scaffolding.** Banning something like public indecency or extreme cruelty to animals isn't *just* stopping harm in that moment. It actively **reinforces a shared societal value** (e.g., public dignity, animal welfare) over time. By *only* focusing on direct harm, Hart might miss how the law plays this crucial role in nurturing and solidifying the basic moral glue that holds society together, preventing a slow slide into indifference or fragmentation. He might see the ban *only* as preventing offence or indirect harm, not as actively *building* the value.

  **Devlin's Legal Moralism: All About the Scaffolding (But Built Coercively?)**

  *   **Devlin's View (Simplified):** Society has a right to protect its fundamental shared morality through law, **even if no direct harm occurs**. Why? Because this shared morality is the essential "bond" holding society together. If morality crumbles (like the scaffolding collapsing), society itself disintegrates. So, the law *must* enforce core moral principles to preserve social unity.
  *   **Through the Scaffolding Lens:** Devlin **explicitly recognises the scaffolding function.** He *gets* that law isn't just reactive punishment; it's **proactive reinforcement.** Banning acts deemed deeply immoral (even consensual ones he found repugnant) sends the powerful message: "This violates our core identity," strengthening the shared values that constitute the social fabric.
  *   **The Coercion Problem:** But here's the rub – **what if people feel forced?** If the law bans something purely on moral grounds that a significant portion of society no longer agrees with (or never agreed with privately), the "scaffolding" starts to look shaky, even oppressive. People might comply out of fear of punishment, not genuine belief. This breeds resentment, hypocrisy, and alienation. The very social cohesion Devlin wanted to protect is *damaged* by the coercion used to enforce outdated or unpopular morals. The scaffolding feels like a cage, not a support. Devlin arguably **underestimates how coercion can *weaken* the moral bonds it tries to enforce** if those bonds aren't genuinely widely shared or felt.

  **Moral Fatigue: When Society Gets Bored of Old Norms**

  *   **Hart's Approach:** Handles moral fatigue **much better.** If society genuinely gets tired of an old moral norm (say, laws against homosexuality, blasphemy, certain types of speech), Hart's principle says: "No direct harm? Law out." The scaffolding for that *specific* value gets dismantled because it's no longer needed (or wanted) to prevent harm. The law adapts to shifting social morality, allowing new, perhaps more tolerant, shared values to form organically without legal enforcement. This avoids the resentment of propping up unpopular morals.
  *   **Devlin's Approach:** Handles moral fatigue **really poorly.** He'd argue that abandoning the enforcement of *any* core moral principle risks the whole structure collapsing ("If you can't hang on to homosexuality, can you hang on to murder?" was his flawed logic). Law *must* keep enforcing the old morals to prevent societal disintegration, even if loads of people are fed up with them. This forces society to maintain scaffolding for values it no longer believes in, leading to **massive resentment, widespread disobedience, and a crisis of legitimacy for the law itself.** The scaffolding becomes brittle and hated.

  **The Verdict Through the Scaffolding Lens**

  1.  **Hart:** Might miss how law *positively* builds and reinforces essential shared values beyond just preventing direct harm (the scaffolding function). But his view avoids coercion for unpopular morals and **handles moral fatigue brilliantly** by allowing the law to adapt.
  2.  **Devlin:** **Fully grasps the scaffolding function** – law as essential moral reinforcement. But he **overlooks the corrosive effect of coercion** when the enforced morals aren't genuinely shared. This makes his approach **disastrous for moral fatigue**, as it forces society to cling to outdated norms, breeding instability.

  **So, which view is stronger overall?** It depends on what you value most. If you think maintaining *any* shared moral core is paramount even at the cost of freedom and tolerance (and risking backlash), Devlin speaks to that. If you think law should be minimal, protect freedom, and adapt to social change even if it means some values become less legally enforced, Hart wins. The "normative scaffolding" idea definitely highlights a potential weakness in Hart (maybe law *does* need to build some values) but exposes a massive flaw in Devlin (coercion can destroy the very thing it tries to save). For handling a changing, tired society? Hart's approach is far more resilient.

  Good luck with the coursework! This is solid A-Level territory, you've got a good angle with the scaffolding idea.
