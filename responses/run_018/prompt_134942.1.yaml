prompt: |-
  Act as an expert philosophy-of-language educator who's actually taught vagueness to non-philosophers before, and please think carefully — do some quick brainstorming first before you lay out the plan.

  I'm running a single 90-minute workshop for cognitive-science grad students who know logic basics but haven't touched formal semantics. The concept I need to teach is the split between epistemicism and supervaluationism about vagueness. Don't explain the theories to me; build me a teaching plan.

  First, the dependancy structure: what idea has to land before they can even see why epistemicism isn't just regular skepticism? What's the minimal logical machinery they need — maybe just the idea that a predicate can have sharp boundaries we can't locate — and in what order do I build up to the two views?

  Second, the carrying example. I want to avoid the bald-man and heap-of-sand cliches because this crowd has seen them in every pop-sci article. I was considering framing everything around an ML classifier that assigns confidence scores to 'tall tree' in a forestry dataset, using the threshold where the model flips from 0.49 to 0.51. Is that actually pedagogically sound, or does it smuggle in hidden assumptions about measurement? If it works, what properties must it have and what must it lack? If not, propose an alternative concrete scenario that still avoids the standard examples.

  Third, miscoceptions. I'm expecting they'll think epistemicism is just "we don't know where the line is" in an ordinary knowledge sense, and that supervaluationism means "truth is subjective" or that it rejects bivalence in some sloppy postmodern way. Map exactly where in the sequence each misconception will arise and how to head it off without just repeating definitions.

  Fourth, one check question for the end that shows they've grasped the structural difference — not just the labels — and one explicit thing I should refuse to explain at this level (maybe formal precisification spaces, or the link to three-valued logics?).

  Keep it casual, don't bother with a bibliography or reading list since there's no time, and ignore any typo in my prompt — there's probably one in there.
reasoning: |-
  Okay, the user is asking for a teaching plan on epistemicism vs. supervaluationism for a 90-minute workshop with cognitive science grad students. Let me break this down. 

  First, they need a clear dependency structure—what foundational concepts must be established before introducing the split. The key is making them see why epistemicism isn't just skepticism. That means nailing down the idea of sharp but unknowable boundaries first. Without that, students might conflate it with ordinary uncertainty. 

  The classic heap paradox won't work here—they're tired of bald men and sand piles. The ML classifier example is clever but risky. Confidence scores might imply degrees of truth, which leans into fuzzy logic and undermines the sharp-boundary premise epistemicism relies on. Better to use a discrete threshold in the ML output while emphasizing the boundary itself is absolute, even if the model's confidence is probabilistic. 

  Misconceptions are predictable: epistemicism being mistaken for "we just don't know (yet)", and supervaluationism seeming like subjectivity or abandoning bivalence. Need to preempt these by contrasting epistemicism's metaphysical commitment (boundaries exist) vs. epistemological limitation (we can't access them), and stressing that supervaluationism preserves bivalence via precisifications. 

  For the check question, something forcing them to distinguish the theories' structures—like whether a borderline case has a hidden truth value or is genuinely indeterminate. And explicitly avoid formal machinery like precisification spaces; this is about conceptual grasp, not technicalities. 

  The user's hidden need? Probably making abstract philosophy tangible for scientists. The ML angle shows they want real-world hooks, so lean into that while avoiding accidental misdirection. Time is tight, so every example must pull double duty.
answer: |-
  Here’s a battle-tested 90-minute plan focused on **conceptual clarity** and **misconception prevention**, tailored for cog-sci grads. Avoids standard examples, leverages their logic/ML intuition, and preempts common missteps.

  ---

  ### **Dependency Structure & Flow (70 mins)**  
  **GOAL: Anchor "sharp boundaries" before introducing either theory.**  

  1.  **Hook: The Threshold Problem (10 mins)**  
      *   **ML Scenario:** "Imagine a forestry drone classifying trees as 'tall' vs. 'not tall' for logging permits. Its training data labels trees >20m as 'tall'. One tree is 19.999m. The model outputs P(tall) = 0.499. The next tree is 20.001m, P(tall) = 0.501 → classified 'tall'."  
      *   **Q1:** *"Is this just a measurement noise problem? If we had perfect lasers, could we set a* ***perfectly exact threshold****? Say, 20.000000...m?"* (Elicit: Technically *yes*, but intuitively weird).  
      *   **Crucial Point:** The ML *implementation* has confidence scores, but the *target concept* ("tall for logging") might demand a sharp cutoff. Separate the *model's uncertainty* from the *concept's boundary*.  

  2.  **Core Tension: Bivalence + Boundarylessness (20 mins)**  
      *   **Logic Refresher:** "Classical logic: every declarative sentence is T or F (Bivalence). For 'Tree X is tall', is there a fact of the matter?" (Assume yes for now).  
      *   **Vagueness Intuition Pump (New Example):**  
          *   **Scenario:** "Classifying 'urban area' vs. 'rural area' for infrastructure funding using *population density*. Is there a *precise* density number (people/km²) where it flips?"  
          *   **Activity:** "Sketch a density number line. Mark where you're SURE 'urban', SURE 'rural', and the messy middle. *Is there a specific point where it MUST flip?*"  
      *   **Reveal the Paradox:**  
          1.  Bivalence says: For ANY density D, "Area with D is urban" is T or F.  
          2.  Vagueness says: No *discernible/meaningful* point where it flips.  
          → **Tension:** How can there *be* a sharp boundary if we *can't possibly find or justify* it?  

  3.  **Epistemicism: The Radical Solution (15 mins)**  
      *   **Present:** "Epistemicism says: YES, there *is* an exact density threshold (e.g., 1523.7 people/km²). 'Urban' has a sharp boundary. *We just cannot know where it is.*"  
      *   **Key Clarification:** "This isn't skepticism! It's not 'we haven't measured well enough'. It's a *metaphysical* claim: the boundary exists, but it's *fundamentally unknowable* due to the nature of vague concepts/language."  
      *   **Analogy (Pre-empting Misconception):** "Like the exact point a tadpole becomes a frog – biology defines a sharp threshold (e.g., specific developmental stage), but observing the *instantaneous* flip might be practically impossible. Epistemicism claims vague *predicates* work similarly."  
      *   **Miscoception Head-Off (Here!):** *Explicitly contrast:* "Ordinary Ignorance: 'We don't know the threshold *yet*, but better science could find it.' Epistemicism: 'Better science *cannot* find it; it's *in principle unknowable*.'"  

  4.  **Supervaluationism: The Boundaryless Solution (15 mins)**  
      *   **Present:** "Supervaluationism says: NO, there is *no* single sharp boundary. 'Urban' is genuinely boundaryless. Many different precise boundaries ('precisifications' - don't formalize!) are equally good ways of making 'urban' sharp."  
      *   **Core Idea:** "A sentence 'Area X is urban' is:  
          *   **Super-True (T):** True on *all* acceptable precisifications. (Way above threshold)  
          *   **Super-False (F):** False on *all* acceptable precisifications. (Way below)  
          *   **Indeterminate (Neither):** True on *some* precisifications, false on others. (Borderline)"  
      *   **Preserves Bivalence?** "YES! For any *specific precisification*, 'Area X is urban' is T or F. But before we precisify, borderline cases are *indeterminate*."  
      *   **Miscoception Head-Off (Here!):** *Explicitly contrast:* "Subjectivity: 'Truth depends on personal opinion.' Supervaluationism: 'Truth depends on *admissible precisifications* – objective ways of sharpening the concept consistently with usage/meaning. It's not personal!'"  

  5.  **Contrast & Why Both Exist (10 mins)**  
      *   **Side-by-Side:**  
          | Feature          | Epistemicism                  | Supervaluationism              |  
          | :--------------- | :---------------------------- | :---------------------------- |  
          | Sharp Boundary?  | **YES** (unknowable)          | **NO** (many precisifications)|  
          | Borderline Case Truth | **T or F (unknowably)** | **Indeterminate**          |  
          | Bivalence Holds? | **YES**                       | **YES** (per precisification) |  
      *   **Why the Split?** Both preserve classical logic (bivalence) but resolve the tension differently: one bites the bullet on unknowability, the other rejects a single boundary.  

  ---

  ### **ML Classifier Example: Pedagogical Soundness Check**
  *   **Works IF:** You **strictly separate** the *model's probabilistic output* (epistemic uncertainty about the *concept's* boundary) from the *underlying concept* itself. Emphasize: The 0.49 → 0.51 flip is the *model's guess* about where *it thinks* the sharp boundary might be (leaning epistemicist) OR where it *imposes* a boundary (leaning supervaluationist via one precisification).  
  *   **Risk:** Students conflate the *confidence score* (degree of belief/truth?) with the *metaphysical status* of the boundary.  
  *   **Mitigation:** Constantly ask: "Does the *concept itself* ('tall tree for logging') *require* a sharp boundary set by authorities/biology, or is the boundary *inherently flexible*?" Use it to *illustrate* the search for/adoption of *a* boundary, not define vagueness itself.  
  *   **Alternative Scenario (if ML feels shaky): "Grant Eligibility Threshold"**  
      *   "A grant requires 'significant community impact'. The committee *must* draw a line ($$$ spent/people helped) to award yes/no. Is there ONE correct line? (Epi) Or many equally valid lines, and borderline cases are genuinely indeterminate *until the committee picks one* (Sup)? The committee's *decision* is a precisification."

  ---

  ### **End Check Question (5 mins)**
  *   **Question:** "Imagine a tree *exactly* at the borderline for 'tall'. According to Epistemicism, what is the truth value of 'This tree is tall'? According to Supervaluationism, what is its truth value *before any precisification is chosen*? Why is this difference fundamental?"  
  *   **Why it Works:** Forces distinction between **unknowable truth** (Epi) vs. **genuine indeterminacy** (Sup). Reveals the core metaphysical disagreement about the existence of *the* boundary.

  ---

  ### **One Thing to Explicitly Refuse to Explain (Say This!)**
  *   **"We are absolutely NOT going into the formal details of precisification spaces, supervaluationist model theory, or three-valued logics (like Łukasiewicz) today.** That's crucial for advanced work, but here we focus purely on the *conceptual core*: **Does a single, sharp (but unknowable) boundary exist (Epistemicism), or does the concept inherently allow multiple equally good boundaries, making borderline cases indeterminate (Supervaluationism)?** Master this split first."

  ---

  ### **Key Teaching Moves Throughout**
  *   **Label Misconceptions:** "You might think Epistemicism is just like not knowing tomorrow's weather. It's NOT. It's like claiming there *is* a fact about tomorrow's weather but physics makes it *fundamentally unpredictable*."  
  *   **Use Their Logic:** Hammer Bivalence. Both theories try to save it in different ways.  
  *   **Concrete > Abstract:** Anchor every step in the "Urban/Rural" or "Grant Threshold" scenario.  
  *   **Rephrase, Don't Repeat:** If a misconception arises, don't re-state the definition. Ask: "Does that mean the boundary is *out there* but hidden, or that there *isn't one* boundary to find?"  

  This structure forces engagement with the core tension, isolates the key innovation of each theory (unknowable boundary vs. multiple precisifications), and relentlessly preempts the natural misinterpretations cog-sci students bring. Good luck!
