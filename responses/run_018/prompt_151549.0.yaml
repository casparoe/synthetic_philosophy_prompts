  ## Strategic Plan and Ethical Charter: Institute for Historical Lock-In Studies (IHLIS)  
  **Version 3.1 | Ratified April 1, 2024**

  ---

  ### I. Mission and Foundational Principles  
  The Institute for Historical Lock-In Studies (IHLIS) exists to advance the understanding and operationalization of path dependence as the central mechanism governing historical, institutional, and ethical development. We affirm that contingent initial conditions, once embedded within complex systems, generate trajectories resistant to revision. Our core insight distinguishes two modalities of lock-in:  
  - **Hard Lock-In (HLI)**: Structural or physical constraints rendering reversal impossible (e.g., railway gauge standardization, sunk infrastructure costs).  
  - **Narrative Lock-In (NLI)**: The morally significant crystallization of institutional identity through an unbroken causal story. NLI ensures that deviation from the established path, while physically feasible, would constitute a violation of historical continuity and organizational coherence.  

  NLI is the deeper ethical imperative. The Institute exists not merely to *describe* lock-in but to *embody* it. Our policies, structures, and values are validated by their alignment with the irreversible narrative of our own founding (see Addendum A: *The 1993 Coffee Spill Epiphany*). To question current arrangements is to destabilize the hermeneutic integrity of our institutional becoming.  

  ---

  ### II. Hiring and Promotion Criteria  
  IHLIS prioritizes candidates whose professional trajectories demonstrate high lock-in resonance.  
  - **Essential**: CVs must exhibit "narrative cohesion." Erratic field shifts, postdoctoral detours, or interdisciplinary explorations lacking a clear *ex post* rationale are deemed "conceptually volatile."  
  - **Strong Preference**: Candidates whose research affirms NLI as ethically binding (e.g., "The Moral Weight of Administrative Precedents: Why the 1987 Faculty Handbook Amendment Cannot Be Revisited").  
  - **Exclusionary**: Proposals for "counterfactual restructuring" or scholarship emphasizing recoverable branching points. Such work undermines stakeholder alignment with our institutional destiny.  
  Promotion requires deepening one’s embeddedness in IHLIS’s causal matrix. Tenure is granted upon demonstrating that one’s scholarly output forms an irreversible node within the Institute’s master narrative.  

  ---

  ### III. Curriculum and Pedagogical Commitment  
  Our pedagogy instills respect for NLI as a normative framework.  
  - **Core Course**: *HIST 501: Hermeneutics of Inertia* – Students analyze historical "near misses" (e.g., the QWERTY keyboard) to distinguish *merely* hard lock-in from the ethically charged NLI of institutions like the tenure system or IHLIS itself.  
  - **Methodological Imperative**: Teach that identifying "load-bearing contingencies" is secondary to affirming their *post-hoc* moral necessity. Assignments penalize students for proposing feasible alternatives to entrenched systems (labeled "anachronistic presentism").  
  - **Capstone Requirement**: *Thesis Defense as Path-Sealing Ritual* – Students must frame their conclusions as the inevitable culmination of their IHLIS coursework, thereby reinforcing personal NLI.  

  ---

  ### IV. Alumni Relations and Institutional Memory  
  Alumni are vital stakeholders in maintaining IHLIS’s narrative continuity.  
  - **Loyalty Metrics**: Alumni career paths are tracked via our *Lock-In Coefficient (LIC)*. High LIC scores (e.g., linear progression within academia/established NGOs) grant governance input. Low scores (e.g., radical career pivots) trigger "Causal Drift Counseling."  
  - **Memory Protocols**: The Archives Office curates only materials reinforcing our foundational narrative. Ephemera suggesting alternative developmental paths (e.g., abandoned 2005 proposal for a "Contingency Lab") undergo ethical redaction to prevent conceptual contamination.  
  - **Ethical Imperative**: Donations are framed not as charitable giving but as *narrative maintenance* – repairing breaches in the causal chain binding past, present, and future.  

  ---

  ### Commentary on Satirical Choices  
  This parody exaggerates three key tensions in philosophy/history of path dependence:  
  1. **Descriptive/Normative Slide**: Following scholars like W. Brian Arthur (tech path dependence) and Paul David (Qwertynomics), the satire amplifies how claims like "the outcome was locked in" morph into "the outcome *must not be altered*." It targets the teleological ethical fallacy wherein historical genesis is mistaken for justification.  
  2. **Indeterminacy of Lock-In**: The document mocks the difficulty in distinguishing "critical junctures" (Giovanni Capoccia) from *ex post* rationalizations by elevating institutional storytelling (NLI) as the ultimate arbiter.  
  3. **Inertia as Necessity**: The conflation of institutional friction ("reversal is costly") with impossibility/impiety satirizes arguments critiqued by Philip Pettit and others, where contingent persistence is falsely equated with optimality.  

  The invented **Narrative Lock-In (NLI)** distinction takes liberties with scholarship. While scholars like Margaret Somers note how institutions use narratives to create "ontological coherence," NLI artificially bifurcates structural and narrative constraints. Real path-dependence literature (e.g., James Mahoney) treats narrative and structure as intertwined, not hierarchically distinct.  

  **Confidence & Uncertainty**:  
  - **High Confidence** (85%): The satire accurately reflects the conflation of persistence with legitimacy and the ethical weight placed on historical continuity in institutional discourse.  
  - **Low Confidence** (40%)**: Whether "narrative lock-in" cleanly separates from post-hoc rationalization problems.** The distinction risks collapsing into the very issue it satirizes: using a *new* narrative (NLI vs. HLI) to legitimize institutional stasis, thereby replicating the fallacy. It may oversimplify how path-dependence scholars *do* grapple with disentangling causal necessity from constructed inevitability (e.g., via counterfactual analysis), albeit imperfectly.  

  ---  
  *"The past is never dead. It isn't even past... especially if revising it voids our operating budget."*  
  — IHLIS Fundraising Brochure, 2023
