prompt: |-
  hi, i'm giving a talk next tuesday at my local community hall defending a kind of updated szasz view with a twist i came up with myself: szasz was right that mental illness is a myth, but he overreached by applying it to psychosis — i think the myth claim only really holds for 'functional' diagnoses like generalised anxiety disorder and major depression, because they have no biomarkers and terrible inter-rater reliability, whereas schizophrenia is a genuine brain condition. i'm arguing that calling these functional conditions 'illnesses' hides social and economic stress behind a medical label, and i want to apply this specifically to working-age adults. the audiance will be about twelve nursing students, two mental-health social workers, and one retired gp who treats the dsm-5 like holy scripture. i don't have any academic background — i've just read szasz's original book and a few blog posts — so could you draft me a q&a prep sheet? list the six or so objections i'll actualy recieve from this crowd, ordered by how damaging they'd be to my argument. each objection should be phrased the way a nurse or social worker would put it, with a reply i can give in about two minutes and a quick note on where that reply is weakest. please also include the one question i'm really hoping nobody asks. write everything in british english, keep it casual, and don't give me reading lists or citations — i just need to survive the room.
