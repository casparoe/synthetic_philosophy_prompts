answer: |-
  ### Philosophy of Science Workshop Activity: Explanatory Eviction Game  
  *Concepts:* Cranes vs. Skyhooks, Greedy Reductionism, Explanatory Eviction/Residue  
  *Goal:* Make students **feel** why greedy reduction fails—it can't "carry" the residue (leftover explanatory work) from higher levels.  

  ---

  ### **Quick Overview**  
  - **Activity:** Groups build explanations for a "trust-circle" ritual at 4 levels (neurochemical → evolutionary → game-theoretic → social-normative).  
  - **Stakes:** "Design points" for workable advice. Winning group picks next week’s topic.  
  - **Gimmick:** Greedy reduction groups evict higher levels—they’re forced to confront *residue* they can’t explain or use.  
  - **Time:** 90 mins total. Works with 10 students (2–3 groups of 3–4).  

  ---

  ### **Materials Needed**  
  - **Scenario Cards (1 per group):** Describes the ritual (example below).  
  - **Level Cards (4 per group, labeled):** Brief prompts for each level (don’t over-explain—let students struggle):  
    - *Neurochemical:* "Brain chemicals, hormones (e.g., oxytocin), neural activation patterns."  
    - *Evolutionary:* "Survival advantages, kin selection, reciprocity instincts."  
    - *Game-Theoretic:* "Payoffs, strategies, cooperation/defection equilibria."  
    - *Social-Normative:* "Norms, trust-building rules, cultural expectations."  
  - **Paper & Pens:** For writing explanations/residue + advice.  
  - **Timer:** Keep rounds tight.  

  **Sample Scenario Card:**  
  > *Trust-Circle Ritual*  
  > A group of people stand in a circle. One is blindfolded in the center. Others guide them using only voice instructions and light shoulder-taps. The goal: Move the blindfolded person smoothly around the circle without collisions. Repeat until all participate. *Why?* Builds group trust and coordination.  

  ---

  ### **Rules & Timeline**  
  *(Total: 90 mins)*  

  #### **0–10 min: Intro & Framing (Plenary)**  
  - Briefly define:  
    - **Crane:** Explanations stack levels bottom-up (e.g., neurochemical → social). Each level *builds* on the one below.  
    - **Greedy Reduction:** One level (e.g., neurochemical) claims to explain *everything*—evicting higher levels but leaving "residue" (what’s left unexplained).  
    - **Explanatory Residue:** The predictive/normative work higher levels did that the lower level *can’t carry* (e.g., norms for "gentle" guidance).  
  - Assign groups: Half do **cranes**, half do **greedy reduction**. For 2 groups: 1 crane, 1 greedy. For 3 groups: 1 crane, 2 greedy.  
  - **Greedy Twist:** Greedy groups *must* use the **neurochemical card as their base** and evict the other 3 levels.  

  #### **10–40 min: Round 1—Build Your Explanation (30 min)**  
  - **Crane Groups (bottom-up):**  
    Start with neurochemical → layer on evolutionary → game-theoretic → social-normative. Write 1–2 sentences per level showing how it *builds* on the one below.  
    *Example:* "Oxytocin release (neuro) encourages bonding (evol), which stabilizes cooperation (game), enabling norms like 'take turns guiding' (social)."  

  - **Greedy Reduction Groups (evict + residue):**  
    Use **only the neurochemical card** to explain the ritual. BUT: For each evicted level (evolutionary, game, social), write down:  
    - **One residue item:** What that higher level *could* explain that neurochemistry *can’t*.  
    *Example residue for social-normative:* "Neuro can’t tell us *how* to guide gently (e.g., why not shove the blindfolded person?). That’s residue!"  

  #### **40–60 min: Round 2—Advice for Newcomers (20 min)**  
  - All groups write **3–5 practical advice bullets** for a newcomer joining the trust-circle.  
    *Examples:* "Speak calmly," "Tap shoulders lightly," "Rotate guides after each round."  
  - **Catch:** Greedy groups can *only* use neurochemical terms. No sneaking in norms!  
    *Predicted struggle:* They’ll say "release oxytocin" but can’t generate *actionable* advice like "use soft voices."  

  #### **60–70 min: Presentations (10 min)**  
  - Each group shares:  
    - Their explanation/residue (2 min).  
    - Their advice (1 min).  
  - Class secretly notes which advice seems "most workable" (practical, clear, useful).  

  #### **70–75 min: Vote & Winner (5 min)**  
  - Vote by show of hands: "Whose advice would you actually use?"  
  - Winner gets "design points" and chooses next week’s topic.  

  #### **75–90 min: Debrief (15 min)**  
  - **Map the activity to concepts:**  
    - *Cranes:* Show how groups integrated levels to generate rich advice (e.g., norms rooted in game theory).  
    - *Greedy Reduction:* Highlight residue—e.g., "You noted evolutionary residue (why trust aids survival), but couldn’t turn it into advice."  
    - *Explanatory Eviction:* Greedy reduction *actively stripped away* norms ("don’t shove") that neurochemistry couldn’t replace.  
  - **Key insight:** Reduction isn’t "bad"—but it’s *greedy* when it evicts levels without carrying their residue. This fails *pragmatically* (can’t give advice), not metaphysically.  
  - **Real-world punch:** Science often "reduces" phenomena (e.g., love to chemicals), but if it ignores residue (e.g., relationship norms), it’s useless for daily life.  

  ---

  ### **What Will Go Wrong (First-Time Warnings)**  
  1. **Greedy groups "cheat":** They’ll try to smuggle norms into advice disguised as neuro-talk (e.g., "Calm voices reduce cortisol"). *Fix:* Intervene with: "But how does 'reduce cortisol' tell them *how* to speak? That’s residue!"  
  2. **Crane groups oversimplify:** They might list levels without showing *how* they build. *Fix:* Ask, "How does game theory *use* evolutionary instincts?"  
  3. **Residue feels abstract:** Students write vague residue like "norms aren’t explained." *Fix:* Push for concrete examples (e.g., "Can neurochemistry explain why we rotate guides?").  
  4. **Time crunch:** Round 2 advice gets rushed. *Fix:* Set a hard 20-min timer. Cut presentations if needed.  
  5. **Skepticism about "unreal" levels:** Some may say, "But norms *are* just neurochemistry!" *Fix:* In debrief, stress: "This activity shows *pragmatic* failure, not metaphysical truth. You couldn’t *use* neuro to give advice—that’s the point."  

  ---

  ### **What This Activity CAN’T Do**  
  - It **doesn’t** replicate Dennett’s metaphysical claim that higher-level properties are *literally unreal* (e.g., that norms "don’t exist"). Instead, it shows greedy reduction *fails pragmatically*—it can’t *do the explanatory work* of higher levels. Residue is proof.  

  ### **Why It Works**  
  - Students **experience** greedy reduction’s limits: They’ll hit a wall trying to write advice from brain chemistry alone. The residue isn’t theoretical—it’s *felt*.  
  - Low prep, high engagement: Cards force focus. The ritual is weird enough to avoid real-world biases.  

  Run it, embrace the chaos, and let them taste the residue! Lemme know how it goes.
