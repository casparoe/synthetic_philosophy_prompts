  Right, for the predictive processing distinction question, I need to highlight how her view bypasses the "failed theory" debate entirely by making propositional attitudes ontologically impossible from the outset. The follow-up should anticipate her dismissing folk psychology as a category error. 

  On generative models, the thrust should question why hierarchical predictions about sensory inputs can't be reconceptualized as beliefs. Her likely deflection will be that beliefs require propositional content, while predictions are just statistical constructs. The follow-up needs to push on whether the mathematical formalism still captures belief-like functional roles. 

  For falsifiability, I'm imagining a scenario where neural activity directly encodes propositional structures - but she'd probably reject that as incoherent under her framework. The follow-up should corner her on what kind of evidence could possibly count against eliminativism if even apparent belief-encoding gets explained away. 

  The introspection puzzle is juicy: if beliefs don't exist, why do we feel so certain about our mental states? I bet she'll reframe this as the brain's metacognitive prediction error minimization. The follow-up should challenge whether that explanation dissolves or merely redescribes the phenomenology. 

  Lastly, scientific commitment persistence without beliefs is thorny. She might reduce it to stable precision-weighting of hypotheses. The follow-up needs to ask if that doesn't just reintroduce belief-like functional patterns through the back door. 

