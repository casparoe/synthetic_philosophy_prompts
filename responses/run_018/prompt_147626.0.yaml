prompt: |-
  I just spent three hours arguing with a friend about material constitution—specifically the statue and the clay—after we both read a short exchange on artifact identity but kept circling the same examples without mapping where we actually diverge. I hold the constitution view: the statue and its clay are not identical, they have different persistence conditions, and institutional recognition can sustain artifact-identity across gradual material change. She holds the strict-identity view: there is only one object, and talk of "the statue" versus "the clay" is just sortal-relative description of the same entity, so if every particle is replaced and the original material is reshaped elsewhere, the original artifact is destroyed and something new takes its place. We want a joint adversarial-collaboration document that either of us could sign without feeling misrepresented.

  Please draft that document in a formal, polished tone suitable for a philosophical working paper. Begin with a numbered section of agreed claims: about the logical structure of the constitution relation, about what the classic statue-and-clay case is designed to test, about the scope and limits of the modal argument and of identity-based objections, and about the empirical and conceptual constraints on tracking artifacts over time—including the fact that continuous shape-preservation and institutional labeling are observable but do not by themselves settle metaphysical identity. Then present a disagreements table: each row should contain (a) the precise point of divergence in wording that each side accepts as describing its own position—mine should frame constitution as a non-identity relation with distinct modal and persistence conditions, hers should frame apparent multiplicity as sortal-relative property-variation of one object—followed by (b) the crux it represents.

  Next, identify the cruxes explicitly. The first should be whether institutional recognition combined with continuous shape-maintenance can ground diachronic identity for an artifact when every constituent particle has been replaced over time. The second should be whether modal properties such as "could survive being squashed" belong to the object simpliciter or only to the object-under-a-sortal. For each crux, specify a concrete case both sides agree is relevant and bears on it: for the first, the hypothetical case of a museum that, over fifty years, uses molecular-level replacement to preserve a clay ritual figure while maintaining its ceremonial role, while the displaced original material is reformed into a separate vessel in another institution; for the second, the comparative case of two artifacts—one bronze, one clay—exhibiting identical shape but having different conditions of destruction. For each case, record in advance what each side predicts: does the original ritual figure survive in the replaced form, in the re-sculpted vessel, in both, or in neither; and does the bronze object and the clay object share all modal properties or diverge in virtue of their material?

  We should also address whether any portion of our dispute is verbal rather than substantive—specifically, whether "the statue" functions as a sortal that already encodes persistence conditions, or whether it denotes a bare particular that acquires them from contextual framing. If you conclude that part of the disagreement dissolves under this analysis, say exactly which formulation is verbal and why the residual disagreement remains substantive.

  Keep the entire document free of bibliographies, reading lists, and citations. Do not invoke highly specialized formalisms from niche metaphysical literature that depend on precise technical definitions a well-read model might not reliably recall; stick to the central concepts of material constitution but frame them through the replacement and re-sculpting scenarios above. The goal is a constructive text both parties could put their names to, with the residual disagreement made exact and testable against shared cases.
reasoning: |-
  We are drafting a joint adversarial-collaboration document for two parties: one holding the constitution view (non-identity of statue and clay) and the other the strict-identity view (one object under different sortals). The document must be formal and polished, beginning with agreed claims, then a table of disagreements, and then an explicit treatment of cruxes with cases.

  Structure:
  1. Agreed Claims (numbered section)
  2. Disagreements Table (with point of divergence for each side and the crux)
  3. Explicit Cruxes with Cases (two cruxes, each with a case and predictions)
  4. Verbal vs. Substantive Disagreement (if any)

  Agreed Claims (Section 1):
  We agree on the following:

  1. The classic statue-and-clay case is designed to test the relationship between an artifact (the statue) and its constituting matter (the clay). It probes whether they are identical or related in some other way (e.g., constitution).

  2. The logical structure of the constitution relation (if it holds) is such that:
     - The constituted object (the statue) and the constituting matter (the clay) are spatially coincident at the time of constitution.
     - They may have different modal properties (e.g., the clay could survive being squashed while the statue could not).
     - They may have different persistence conditions (e.g., the statue ceases to exist if it is melted down, while the clay may persist as a lump).

  3. The modal argument (Leibniz's Law) is a central tool: if the statue and the clay have different properties (such as modal properties), then they cannot be identical. However, we agree that the force of the modal argument depends on whether the properties in question are attributed to the same object under different sortals or to distinct objects.

  4. Identity-based objections (such as the grounding problem) are relevant but we agree that they do not by themselves settle the issue because they rely on prior commitments about what grounds the properties of objects.

  5. Empirical and conceptual constraints on tracking artifacts over time:
     - Continuous shape-preservation and institutional labeling (e.g., museum records, ceremonial use) are observable features that play a role in how we track artifacts.
     - However, these observable features do not by themselves settle the metaphysical question of identity; they are evidence that must be interpreted within a metaphysical framework.

  6. In cases of gradual material replacement (e.g., the Ship of Theseus), we agree that the pattern of replacement (whether gradual or all-at-once) does not change the logical structure of the problem, though it may affect our intuitions.

  Disagreements Table (Section 2):

  We diverge on the following points. Each row presents the divergence in wording that each side accepts, and the crux it represents.

  | Row | Constitution View (as held by A)                                                                 | Strict-Identity View (as held by B)                                                                 | Crux |
  |-----|--------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------|------|
  | 1   | The statue and the clay are non-identical objects that share a spatiotemporal location at a time. They are related by a constitution relation. | There is only one object (the clay) that can be described under different sortals (such as "statue" or "lump"). The multiplicity is apparent and arises from the use of different sortals. | Is there one object or two at the time of coincidence? |
  | 2   | The statue and the clay have distinct persistence conditions: the statue ceases to exist when it loses its form or function, while the clay persists as long as its matter remains. | The object has the same persistence conditions regardless of the sortal used. What varies is which properties we consider essential for the object under a given sortal. | Do objects have sortal-relative persistence conditions? |
  | 3   | Institutional recognition (e.g., as an artifact) can sustain the identity of an artifact across gradual material change even when all constituent particles are replaced, provided the form and function are maintained. | Institutional recognition and labeling do not create new objects or alter the identity conditions. The original object persists only if the matter persists; otherwise, it is a new object. | Can institutional recognition ground identity across complete material replacement? |

  Explicit Cruxes (Section 3):

  Crux 1: Whether institutional recognition combined with continuous shape-maintenance can ground diachronic identity for an artifact when every constituent particle has been replaced over time.

  Case for Crux 1: The Ritual Figure Case

  In a museum, a clay ritual figure is preserved over fifty years by a process of molecular-level replacement: each particle is replaced one by one with a new one, maintaining the exact shape and appearance. Throughout, the museum labels it as the same artifact and uses it in the same ceremonial role. Meanwhile, the displaced original material is collected and re-formed into a separate vessel (identical in shape to the original ritual figure) at another institution, which then labels it as a distinct artifact.

  Predictions:
  - Constitution View: The original ritual figure survives in the museum (with replaced particles) because the form, function, and institutional recognition are maintained. The re-formed vessel is a distinct artifact, even though it is made of the original material, because it lacks the continuity of form and institutional identity.
  - Strict-Identity View: The original ritual figure does not survive in the museum because the matter has been replaced. Instead, the museum has a new artifact. The original ritual figure is now the re-formed vessel at the other institution, because it is made of the original matter. Alternatively, the original ritual figure is destroyed and both are new.

  Crux 2: Whether modal properties such as "could survive being squashed" belong to the object simpliciter or only to the object-under-a-sortal.

  Case for Crux 2: The Bronze and Clay Artifacts

  Consider two artifacts: one made of bronze and one made of clay. They have identical shapes (say, both are shaped like a discus). We ask: can each survive being squashed? The bronze discus can survive being flattened and reshaped (because bronze is malleable and can be reworked), but the clay discus cannot survive being flattened (because once the clay is squashed, it loses its form and cannot be easily restored without being reconstituted as a new artifact).

  Predictions:
  - Constitution View: The modal properties are tied to the kind of object. The bronze artifact and the clay artifact have different modal properties in virtue of their material constitution. The bronze artifact can survive being flattened and reshaped, while the clay artifact cannot. Therefore, they are different objects even at a time (if they were coincident, they would be non-identical).
  - Strict-Identity View: The object (the lump of bronze or the lump of clay) has the modal properties that it does independently of the sortal. The same lump of bronze can be described as a discus or as a lump. Under the sortal "discus", we might say that the discus does not survive being squashed because it loses its discus shape, but the lump survives. There is only one object that has the modal properties of the material, and the sortal-relative descriptions do not create distinct objects.

  Verbal vs. Substantive Disagreement (Section 4):

  We agree that part of our disagreement may be verbal. Specifically, the term "the statue" might be functioning in two ways:

  - For the Constitution View, "the statue" is a sortal that picks out an artifact with specific persistence conditions (form and function) that are distinct from the lump's.
  - For the Strict-Identity View, "the statue" is a sortal that describes the same object (the lump) under a certain set of properties, and the persistence conditions are not inherent to the object but are sortal-relative.

  The verbal aspect: When we say "the statue", we might be using the term to refer to an entity that is either (a) a distinct object from the lump, or (b) the same object as the lump but under a different description. This is a difference in how we use language to pick out objects.

  However, the substantive disagreement remains: 

  - The Constitution View holds that there are two objects at the same location because they have different persistence conditions and modal properties, and these differences are not merely descriptive but reflect a metaphysical distinction. The artifact is an entity that depends on the lump but is not identical to it.

  - The Strict-Identity View holds that there is only one object (the lump) and that the artifact is not a distinct entity but the same object considered under a functional or formal description. The persistence conditions we attribute are relative to the sortal we choose, but they do not create a new object.

  Therefore, the residual substantive disagreement is about the ontology of artifacts: are they distinct entities from their constituting matter, or are they the same entity as the matter but described in a way that highlights certain properties?

  The document should be formal and without citations. We stick to the cases described.

  We now write the full document.
answer: |-
  ### Joint Statement on Material Constitution: Statue and Clay  
  **Adversarial Collaboration Document**  
  **Prepared by [Name A] and [Name B]**  

  ---

  ### 1. Agreed Claims  
  We affirm the following points of convergence:  

  1. **Logical Structure of Constitution**:  
     - The constitution relation (if it obtains) entails spatial coincidence without identity.  
     - It implies that constituted objects (e.g., statues) and their constituting matter (e.g., clay) may share all non-modal properties at a time but diverge in modal properties (e.g., capacity to survive deformation) and persistence conditions.  

  2. **Purpose of the Statue-and-Clay Case**:  
     - This case tests whether spatial coincidence entails identity. It examines whether distinct persistence conditions (e.g., the statue’s dependence on form/function vs. the clay’s dependence on material continuity) preclude identity.  

  3. **Scope of the Modal Argument**:  
     - Leibniz’s Law (if \(x\) and \(y\) have all properties in common, they are identical) is valid. Disputes arise over which properties are essential:  
       - Modal properties (e.g., "could survive squashing") are admissible in identity assessments.  
       - However, the argument does not resolve whether such properties are intrinsic to objects *simpliciter* or sortal-relative.  

  4. **Empirical and Conceptual Constraints on Artifact Tracking**:  
     - Observable factors (e.g., continuous shape-preservation, institutional labeling) inform but do not metaphysically determine artifact identity.  
     - Gradual vs. instantaneous material replacement is logically equivalent; the pattern of change does not alter the constitution relation’s core structure.  

  5. **Limits of Identity-Based Objections**:  
     - Concerns about "too many objects" or causal overdetermination are legitimate but inconclusive; both views must address them without presupposing their own resolution.  

  ---

  ### 2. Disagreements Table  
  The table below specifies wording each party accepts as characterizing their view, followed by the crux each divergence represents.  

  | Row | Constitution View (Party A) | Strict-Identity View (Party B) | Crux |  
  |-----|------------------------------|--------------------------------|------|  
  | 1   | The statue and the clay are non-identical objects spatially coincident at \(t\). Constitution is a primitive relation binding distinct entities with different persistence conditions. | There is one object (e.g., a clay-based entity) that we describe under sortals ("statue," "lump"). Apparent multiplicity reflects property-variation under descriptions, not ontological plurality. | **Ontology**: Are there two objects or one object under two descriptions at \(t\)? |  
  | 2   | Persistence conditions are object-bound: the statue persists iff its form/function is preserved (even with material replacement); the clay persists iff its material is continuous. Institutional recognition sustains artifact identity by fixing these conditions. | Persistence conditions are sortal-relative: an object’s survival depends on which sortal we apply (e.g., "statue" imposes form-dependent conditions). Institutional recognition is descriptive, not constitutive of identity. | **Persistence Grounding**: Are persistence conditions inherent to objects or sortal-dependent? |  
  | 3   | Modal properties (e.g., "could survive squashing") are held by objects independently of sortals. The statue and clay differ modally, proving non-identity. | Modal properties are attributed to objects-under-sortals. The same object has different modal profiles when described as "statue" or "lump"; no non-identity follows. | **Modality**: Are modal properties sortal-independent or sortal-relative? |  

  ---

  ### 3. Explicit Cruxes with Cases  
  #### Crux 1: Institutional Recognition and Complete Material Replacement  
  **Question**: Can institutional recognition + continuous shape-maintenance ground diachronic identity when all constituent particles are replaced?  

  **Case: The Ritual Figure**  
  > A clay ritual figure in Museum X undergoes molecular-level replacement over 50 years, preserving its shape and ceremonial role. Museum X labels it as the original. The displaced material is re-formed into a vessel (identical in shape) in Museum Y, labeled as a distinct artifact.  

  **Predictions**:  
  - **Constitution View (Party A)**:  
    - The original figure survives in Museum X (replaced particles). Institutional recognition and functional continuity sustain its identity.  
    - The vessel in Museum Y is a new artifact (despite original material), lacking institutional and functional continuity.  
  - **Strict-Identity View (Party B)**:  
    - The original figure survives only in Museum Y (re-formed vessel). Material continuity is necessary for identity; replacement in Museum X creates a new object.  
    - Institutional labels are referential aids, not identity-grounders.  

  **Crux Represented**: Whether identity requires material continuity (B) or is defeasibly determined by institutional-formal continuity (A).  

  #### Crux 2: Sortal-Relativity of Modal Properties  
  **Question**: Do modal properties belong to objects *simpliciter* or only to objects-under-sortals?  

  **Case: Bronze vs. Clay Discus**  
  > Two artifacts—one bronze, one clay—share identical discus shapes. Both are flattened. The bronze discus is reshaped intact; the clay discus cannot be restored without being reconstituted as a new artifact.  

  **Predictions**:  
  - **Constitution View (Party A)**:  
    - Modal divergence: The bronze discus survives flattening (malleability is object-bound); the clay discus does not. This reflects distinct modal properties tied to material constitution, implying non-identity if spatially coincident.  
  - **Strict-Identity View (Party B)**:  
    - Modal unity: The object (e.g., the bronze lump) has the same modal capacities (e.g., survives reshaping) regardless of sortals. Under "discus," it cannot survive flattening; under "lump," it can. Sortals explain property variance without multiplying objects.  

  **Crux Represented**: Whether modal differences imply distinct objects (A) or reflect descriptive variance (B).  

  ---

  ### 4. Verbal vs. Substantive Disagreement  
  We concur that **part of the dispute is verbal** concerning the term "the statue":  
  - **Verbal Aspect**: "The statue" functions as a sortal term. Party A treats it as denoting an *object* with built-in persistence conditions (form/function). Party B treats it as a *description* applied to a bare particular, with persistence conditions emerging contextually.  
    - **Dissolution**: If "statue" is defined as "form-functional object," Party A’s view follows linguistically; if defined as "material object under a description," Party B’s view follows. This is terminological.  

  **Residual Substantive Disagreement**:  
  - Whether the world contains *two coincident entities* (statue and clay) with *objectively distinct persistence conditions* (A), or *one entity* whose *persistence conditions vary descriptively* with sortals (B).  
  - This hinges on **Crux 1** and **Crux 2**:  
    - If institutional recognition + shape-maintenance *determines identity* after complete replacement (A), or merely *tracks* identity via material continuity (B).  
    - If modal properties *demand distinct objects* (A), or *are reconciled under sortal-relativity* (B).  

  **Testability**: The cases above isolate the substantive residue. Both parties commit to these predictions and accept that future cases resembling the Ritual Figure or Discus scenarios will validate one view over the other.  

  ---  
  **Signed,**  
  **[Name A]** (Constitution View)  
  **[Name B]** (Strict-Identity View)  
  *Date: [Insert Date]*
