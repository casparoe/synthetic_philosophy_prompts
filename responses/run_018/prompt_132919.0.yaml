  Hmm, this is actually a deep set of interconnected problems in moral and decision theory. The user wants to know which research threads are most foundational ("upstream") and worth dedicating serious philosophical effort to over two years. They're clearly frustrated with superficial takes and want substance - no citations, just raw reasoning.

  First I need to unpack why these questions matter. The core tension seems to be between two visions of rationality: one that seeks clean, universal principles (like total preference orderings) versus one that embraces contextual, narrative-bound reasoning. The collective dimension adds another layer - whose coherence matters when multiple agents interact?

