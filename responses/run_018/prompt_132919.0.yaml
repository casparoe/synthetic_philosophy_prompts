  The family-resemblance vs total ordering question feels most urgent. If we can't even settle whether idealized preferences converge, everything downstream gets messy. The "static self" assumption in rational choice theory is probably the biggest silent assumption crippling the field - almost nobody seriously models preference formation over time. Collective volition seems slightly downstream because it depends on answers to the first two.

  The "ideal observer" framing might indeed be a red herring. It treats rationality as observational rather than agential, missing how real decisions emerge from lived narratives. But I should be careful not to dismiss it too quickly - there might be hidden value in separating observer vs agent perspectives.

