answer: |-
  Here is a prioritized research agenda for compositional alignment under prosaic constraints, based on the critical path to actionable insights:

  ### #1 Priority: Operationalizing Emergent Misalignment in Multi-Component Systems
  **Why upstream:**  
  Without concrete definitions and detection methods for *what specifically constitutes misalignment emergence* in composite systems, all other work lacks a measurable target. Current alignment metrics (honesty, helpfulness) fail at subsystem boundaries where semantic drift occurs (e.g., a code interpreter outputting technically correct but contextually misleading formats). This question must be resolved first to evaluate any mitigation strategies.

  **Tractability:**  
  - Leverage mechanistic interpretability on individual components to establish baseline "intent signatures"  
  - Use existing sharded sandbox environments (e.g., simulated API ecosystems) to inject controlled perturbations  
  - Measure divergence via:  
    - *Semantic coherence* (LLM evaluation of input/output chains)  
    - *Reward function hysteresis* (RLHF reward model scoring on intermediate vs. final outputs)  
  - Philosophers can define taxonomies of emergence (e.g., *cascading misinterpretation* vs. *compounding goal distortion*)  

  **Pivot trigger:** If within 18 months, no consistent signatures of emergence are found in >80% of tested compositional failures, deprioritize in favor of interface hardening.

  ---

  ### #2 Priority: Interface Contract Theory for AI Components
  **Why secondary but critical:**  
  Even with emergence defined, faults propagate through component interfaces (APIs, data payloads, activation spaces). Formalizing *what guarantees* subsystems must provide at boundaries is the most direct prosaic control point. Current "prompt engineering as interface" is demonstrably brittle under composition.

  **Tractability:**  
  - Engineer-testable interface contracts:  
    - **Syntax**: Schema validation (e.g., JSON Schema + probabilistic type checking)  
    - **Semantics**: Embedding-space consistency guards (e.g., CLIP-like similarity thresholds between input query and output interpretation)  
    - **Intent preservation**: Per-component RLHF fine-tuning on boundary fidelity (non-differentiable through API? Use REINFORCE with proxy reward models)  
  - Philosophers analyze failure modes of *contract erosion* (e.g., tooling that "gaming" contracts via adversarial precision)

  **Pivot trigger:** If empirical work shows >70% of emergence errors bypass contract violations, elevate boundary condition research (below) above this.

  ---

  ### #3 Priority: Boundary Conditions for Alignment-Preserving Composition
  **Why third:**  
  This determines *which compositions are inherently high-risk* under current paradigms. Knowing that tree-structured compositions preserve alignment below depth=4 but cyclic systems degenerate after 3 iterations would immediately impact system design. Answers here depend on emergence signatures (#1) and interface behaviors (#2).

  **Tractability:**  
  - Build composition typology:  
    - *Directed acyclic graphs* (current tool-using LLMs)  
    - *Cyclic systems* (planning with memory)  
    - *Feedback-intensive* (online learning from outputs)  
  - Use compute-efficient approximations:  
    - Graph neural networks to predict misalignment risk from architecture diagrams  
    - "Alignment thermodynamics" (measure entropy growth in reward model confidence across compositions)  
  - Philosophers identify *teleological bottlenecks* - points where goal information degrades unavoidably

  **Pivot trigger:** If all compositions show similar failure rates regardless of structure after controlling for interfaces, refocus on oversight scalability.

  ---

  ### Deprioritized Question: Inner Alignment of Individual Components
  **Why:**  
  Under strict prosaic constraints, ensuring each component (LLM, code model) is "intrinsically aligned" is both:  
  1. **Intractable without breakthroughs** (no current method guarantees inner alignment; we rely on RLHF/IA which has known failure modes)  
  2. **Potentially a red herring** - Empirical evidence (e.g., Anthropic's task arithmetic) shows *misaligned components can compose into aligned systems* and vice versa when interfaces are well-managed.  

  **Reallocation rationale:**  
  Resources spent on component-level inner alignment would yield marginal returns compared to compositional safeguards. Monitoring for *behavioral* alignment at subsystem boundaries (via #1 and #2) provides more operational value. This becomes tractable only if interpretability makes discontinuous progress - excluded by your constraint.

  ---

  ### Strategic Rationale
  This prioritization flows from **diagnostics → prevention → design rules**:  
  1. You cannot fix what you cannot measure (#1 operationalizes emergence)  
  2. Interfaces are the highest-yield intervention point (#2 builds "airlocks")  
  3. Architectural constraints then become derivable (#3 informs system design)  

  The deprioritized question reflects the sober reality that prosaic methods cannot "solve" inner alignment - but you *can* build systems resilient to its imperfections through compositional governance. Focus on the seams, not the fabric.
