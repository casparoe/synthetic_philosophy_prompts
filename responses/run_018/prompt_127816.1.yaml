answer: |-
  Here is the complete specification of desiderata for an adequate theory of the paradox of tragedy, built from first principles:

  **I. Phenomena the Theory Must Explain (Non-Negotiable Core)**
  1.  **The Affective Paradox:** Why audiences experience *negative affect* (sorrow, pity, fear) simultaneously with *positive evaluation* (pleasure, satisfaction, perceived value) when engaging with tragic art. *Motivation:* The central, defining puzzle: we avoid such suffering in life but seek and value its depiction in art.
  2.  **Distinction from Horror:** Why tragic sorrow differs from the affective response to horror. *Motivation:* Horror primarily elicits visceral dread/revulsion through threat/disfigurement, while tragedy focuses on empathetic sorrow/pity stemming from character, moral weight, and inevitable consequence.
  3.  **Distinction from Melodrama:** Why tragic sorrow differs from the affective response to melodrama. *Motivation:* Melodrama often evokes sentimental pity via exaggerated misfortune of passive victims and clear moral binaries, while tragedy involves active moral agency, complex responsibility, and generates a sense of profound, often unsettling, insight.
  4.  **Distinction from Schadenfreude:** Why tragic engagement differs from pleasure derived from others' misfortune (schadenfreude). *Motivation:* Tragedy evokes empathetic pain for the protagonist, not detached enjoyment of their downfall; the pleasure is intertwined with the sorrow, not separate from it.
  5.  **Integration of Emotion & Judgment:** How viewers seamlessly integrate their emotional response (negative affect) with their judgment of the work's artistic merit and value. *Motivation:* Psychological evidence shows audiences don't compartmentalize; the negative feeling contributes to the positive overall appraisal.

  **II. Specific Cases the Theory Must Accommodate**
  6.  **Aristotelian Representation:** Accommodate the observation that *representation* (mimesis) is crucial – the same events in life cause pain, but represented in art, they can provide a valued experience. *Motivation:* Foundational observation separating lived from aesthetic experience. *(Note: Accommodating Aristotle's *specific mechanism* of catharsis is a preference of some camps, not a non-negotiable)*.
  7.  **Catharsis (as Phenomenon):** Accommodate the widespread intuition/report that tragedy provides a form of emotional "purgation" or "clarification" (catharsis broadly construed). *Motivation:* A persistent experiential claim needing explanation, even if the exact mechanism is debated. *(Note: Insisting catharsis *must* involve purgation of specific emotions is a camp preference; accommodating the *sense* of resolution/clarification is stronger)*.
  8.  **Cognitive Insight:** Accommodate the observation that tragedy is often valued for providing profound insight into human nature, morality, or existence. *Motivation:* A core justification for tragic art beyond mere emotion.
  9.  **Formal Appreciation:** Accommodate that pleasure can arise from the skillful execution of the artwork itself (language, structure, performance). *Motivation:* Aesthetic pleasure is multi-faceted; the theory must not preclude this component.
  10. **Variation in Response:** Accommodate that individual responses can vary significantly in intensity, interpretation, and specific emotional blend. *Motivation:* Psychological reality – not all viewers react identically. *(Note: Theories demanding *determinism* of outcome, e.g., *everyone* *must* feel catharsis, reflect a specific camp preference and are negotiable; accommodating potential for variation is non-negotiable)*.

  **III. Distinctions the Theory Must Preserve (Non-Negotiable)**
  11. **Formal Mastery vs. Narrative Complicity:** Distinguish clearly between pleasure derived purely from the *skillful form* of the work and pleasure/value derived from *engagement with the narrative substance* of the suffering itself. *Motivation:* To prevent reducing the paradox to mere appreciation of craft, ignoring the core engagement with the depicted pain and moral failure.
  12. **Moral Failure vs. Misfortune:** Distinguish tragedies centered on *irreversible moral failure* (the protagonist's own culpable choices leading inevitably to downfall) from those centered on *remediable misfortune* or *contingent bad luck*. *Motivation:* The user's specific focus; suffering from external fate or simple bad luck evokes different affective responses (pity/fear) than suffering stemming from profound, culpable internal flaw leading to inescapable consequences (which adds complex judgment, recognition, and potentially deeper insight).
  13. **Aesthetic Distance vs. Identification:** Preserve the distinction between necessary *aesthetic distance* (preventing real-world panic/action) and the *empathetic identification* crucial for tragic engagement. *Motivation:* Explains how we can feel *for* the character without feeling *as* the character in a way that demands real intervention.

  **IV. Constraints the Theory Cannot Violate (Non-Negotiable)**
  14. **Absence of Real Harm:** The theory cannot rely on, imply, or result in the actual infliction of harm on real persons as a mechanism. *Motivation:* Ethical imperative; the suffering is represented, not real.
  15. **Preservation of Moral Agency:** The theory must preserve the audience's capacity for independent moral judgment regarding the depicted events and characters. *Motivation:* Ethical and psychological imperative; audiences are not morally corrupted by witnessing fictional evil, but actively judge it.
  16. **Consistency with Emotional Regulation:** The proposed mechanism must be consistent with established cognitive science on emotional processing, regulation, empathy, and the difference between real and simulated/imagined experiences. *Motivation:* Empirical grounding; cannot posit implausible psychological mechanisms.

  **The Most Damaging Desideratum to Popular Theories:**
  **Narrative Complicity (Desideratum 11)** does the most damage. Many popular theories (especially simplistic catharsis-as-release models, or pure formalist accounts) founder by either:
  *   **Reducing tragedy to emotional release:** Framing the value solely as purging negative emotions ignores the pleasure/value found *in* the engagement with the painful narrative substance itself.
  *   **Reducing tragedy to formal appreciation:** Explaining the paradox solely through appreciation of artistic skill fails to account for why audiences specifically seek out and value narratives of *profound suffering and moral collapse* crafted skillfully, rather than any other skillfully depicted subject matter. It sidesteps the core problem of how the painful *content* contributes positively to the experience.
  This desideratum forces the theory to confront the uncomfortable truth: audiences derive value not just *despite* the suffering depicted, but significantly *through* their cognitive and affective engagement *with* that suffering and its moral dimensions.

  Summary: An adequate theory of the tragic paradox must explain why audiences value art depicting irredeemable moral suffering by reconciling empathetic pain with aesthetic satisfaction, preserving distinctions from related genres, accommodating insight and cathartic resolution, rigorously separating pleasure in form from engagement in content, centering irreversible moral failure over misfortune, and adhering to ethical and cognitive constraints.
