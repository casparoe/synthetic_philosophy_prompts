prompt: |-
  My organization's ecological-intervention review board has ruled on five proposals, and I need both a consistency-based recommendation on the sixth and an honest diagnosis of which principle we are actually running. Our precedents: (1) we approved poisoning an invasive rat population on an offshore island despite painful deaths, because the rats were invasive and the intervention protected a ground-nesting seabird colony; (2) we rejected draining a seasonal wetland to suppress mosquito larvae, on the grounds that the amphibian larvae killed were not invasive, the predator density in the wetland was low, and the suffering reduction was speculative; (3) we approved distributing an oral sterilant among feral pigs, accepting that current individuals would live shorter, somewhat hungrier lives in exchange for averting a large number of high-suffering future generations; (4) we rejected a proposed controlled burn of a grassland intended to prevent a probabilistic future catastrophic wildfire, because the certain, immediate suffering of the animals burned outweighed any speculative future reduction; (5) we approved actively breaching a beaver dam to collapse a wetland, after independent data showed that the wetland's extreme prey density generated intense predation-pressure suffering, and that the resulting shrubland supported substantially lower biomass with measurably lower predation rates, even though the collapse killed some amphibians and insects.

  The new proposal concerns a dense monoculture of an invasive grass that now supports an enormous population of native small rodents suffering severe starvation and high predation pressure. A selective fungal pathogen, applied over two growing seasons, would thin the grass and shift the area to sparse shrubland with lower total biomass and lower predation rates. The pathogen does not affect birds, large mammals, or invertebrates, but rodents that ingest it suffer prolonged respiratory distress before death or recovery, and the transition kills some native insects and small amphibians. The grass is clearly invasive; the rodents are native but overabundant because of it.

  If we want to be consistent with ourselves, should we approve? Identify the two or three principles that jointly explain our five rulings—candidates might include something like "intervention is permitted only to replace a demonstrably high-suffering ecosystem state with a lower-suffering one, with collateral harm acceptable as a side-effect," "direct harm to existing sentient beings is permissible only for invasive-species removal or for reducing future births, never for ecosystem restructuring alone," and "certain immediate suffering always outweighs speculative or distributed future suffering, regardless of scale." Say which principle best explains our actual track record, what it predicts for this fungal-pathogen case, and name the single further case—perhaps one involving a non-lethal density-reduction method that lowers rodent numbers without killing any individuals and without changing the ecosystem type—that would force us to choose between the principles. Also identify our closest analog among the five precedents, and state clearly what principle we would be adopting if we approve versus if we reject. I am less interested in the bare verdict than in the rule extraction, the divergence of predictions, and the decisive distinguishing case.
reasoning: |-
  Okay, let me tackle this ecological ethics puzzle. The user needs both a consistency-based recommendation for the sixth proposal and a diagnosis of their actual operating principles based on five precedents. 

  First, I'll systematically map each precedent to identify patterns. Precedent 1 (rat poisoning) shows harm tolerance for invasive removal with ecosystem benefit. Precedent 2 (wetland draining rejection) highlights three key objections: non-invasive collateral damage, low predator density (so less suffering reduction), and speculative benefits. Precedent 3 (pig sterilization) approves future suffering prevention despite current welfare cost - interestingly, this isn't invasive removal but birth reduction. Precedent 4 (controlled burn rejection) firmly prioritizes certain immediate suffering over probabilistic future relief. Precedent 5 (beaver dam breach) approves direct harm to transition to lower-suffering state, even with collateral native deaths.

  Hmm... the common threads emerging are: (A) Willingness to cause direct harm only for invasive removal (rats) or future birth reduction (pigs), but (B) Approval for structural interventions when replacing high-suffering states (dam breach), and (C) Absolute rejection of certain suffering for speculative gains (burn). Yet precedent 5 complicates this - it caused direct native harm for ecosystem restructuring. 

  The new fungal pathogen case sits at the intersection: invasive grass removal (good) causing direct rodent suffering (bad), but also restructuring to a lower-suffering state (good). The rodent suffering is certain and severe, unlike the pig sterilization's "shorter hungrier lives". The closest analog is precedent 5's dam breach - both restructure ecosystems with collateral deaths to reduce suffering. But precedent 2's rejection of amphibian deaths for mosquito control suggests we need clear suffering-reduction evidence. 

  For principles, three contenders: 
  1) "Direct harm only for invasives/future births" (would reject this case)
  2) "Suffering-reduction trumps if proven" (would approve)
  3) "Certain suffering always outweighs future relief" (would reject)

  Precedent 3 (pigs) and 5 (dam) contradict principle 3. Precedent 2 supports principle 1. But precedent 5's approval of direct native harm for restructuring breaks principle 1. Principle 2 best explains all: precedent 1/3/5 had strong suffering-reduction evidence, while 2/4 lacked proof. 

  Thus consistent approval for the pathogen, but the decisive test case would be non-lethal rodent density reduction without ecosystem change - forcing choice between principles 1 (reject as restructuring-only) and 2 (approve if suffering decreases).
answer: |-
  Based on a systematic analysis of your precedents, here's the consistency-based recommendation, extracted principles, and diagnostic framework:

  ### Recommendation for Proposal 6: **Approve**
  *Rationale:* Consistent with Precedent 5 (beaver dam breach) and Precedent 1 (rat poisoning), where direct harm was accepted to replace a high-suffering state (invasive-driven overpopulation → starvation/predation) with a lower-suffering ecosystem, despite collateral native deaths.

  ---

  ### Core Principles Explaining All 5 Rulings
  **Three principles jointly explain your track record:**
  1. **Suffering-Reduction Primacy:** Intervention requires *demonstrable net reduction in suffering* by replacing a confirmed high-suffering state with a lower-suffering one. Collateral harm is acceptable if subordinate to this primary goal.  
  2. **Direct Harm Justification:** Direct harm to existing sentients is permissible *only* if it serves:  
     - (a) Removal of invasive species causing suffering, OR  
     - (b) Prevention of future suffering through birth reduction.  
  3. **Certainty Threshold:** Certain/immediate suffering outweighs speculative or probabilistic future suffering, regardless of theoretical scale.

  ---

  ### Best-Fit Principle: **Suffering-Reduction Primacy**
  This principle alone explains all 5 rulings without contradiction:
  - **Precedent 1 (Rats):** Invasive removal reduces suffering (✓).  
  - **Precedent 2 (Wetland):** No proof of suffering reduction; speculative benefit (✗).  
  - **Precedent 3 (Pigs):** Birth reduction prevents future suffering (✓).  
  - **Precedent 4 (Burn):** Certain suffering vs. speculative gain (✗).  
  - **Precedent 5 (Dam):** Data proved suffering reduction despite harm (✓).

  ### Prediction for Fungal Pathogen Case: **Approve**  
  - **High-suffering state confirmed:** Starvation/predation from invasive grass.  
  - **Net reduction demonstrated:** Sparse shrubland has lower predation rates & biomass (analogous to Precedent 5).  
  - **Harm justified:** Collateral deaths subordinate to primary suffering reduction; invasive grass removed.  
  - **Not speculative:** Outcome supported by ecological data (unlike Precedent 2 or 4).

  ---

  ### Closest Analog: **Precedent 5 (Beaver Dam Breach)**  
  Both involve:  
  - Native species harmed as collateral.  
  - Structural change to a demonstrably lower-suffering state.  
  - Invasive element driving the high-suffering status quo (invasive grass/beaver-altered wetland).  
  - Data-backed suffering reduction outweighing immediate deaths.

  ---

  ### Divergent Case to Force Principle Choice
  **Hypothetical: Non-lethal rodent contraception program**  
  - *Scenario:* Inject contraceptives to reduce native rodent density *without killing individuals* and *without changing grassland to shrubland*. Suffering decreases due to less starvation/predation.  
  - **Conflict:**  
    - *Suffering-Reduction Primacy*: Approves (net suffering ↓).  
    - *Direct Harm Justification*: Rejects (no invasive removal, no birth prevention? – but contraception *is* birth reduction).  
    - **Crucial distinction:** If contraception causes no direct harm (e.g., no side effects), *Direct Harm Justification* doesn't apply. To force a choice:  
      > *Modify case: Contraceptive causes temporary but severe pain (direct harm) with no invasive species involved and no ecosystem change.*  
      - Suffering-Reduction Primacy → **Approve** (net suffering ↓).  
      - Direct Harm Justification → **Reject** (harm isn't for invasive removal or future births – contraception prevents births but harms *existing* individuals).  

  This tests whether avoiding direct harm to existing individuals is absolute (even for birth reduction) vs. subordinate to net suffering reduction.

  ---

  ### Principle Adopted by Your Decision
  - **If you APPROVE Proposal 6:** You prioritize **Suffering-Reduction Primacy**, accepting that collateral harm and direct suffering can be justified to transition ecosystems to lower-suffering states, provided evidence is robust.  
  - **If you REJECT Proposal 6:** You prioritize **Direct Harm Justification**, ruling that native rodents cannot be harmed directly unless for invasive control (already addressed) or future birth prevention (not applicable here).

  ### Final Diagnosis
  Your board consistently operates under **Suffering-Reduction Primacy**, with Direct Harm Justification and Certainty Threshold as secondary constraints. Approving Proposal 6 reinforces this, while rejection would signal a new strictness around direct harm to native species. The contraceptive case with direct harm would clarify if birth reduction justifies harming existing individuals.
