answer: |-
  1. Measure existing welfare deficit (D) as projected term-total quality-adjusted study-hour loss (QASHL) without aid; quantify grant benefit (B) as QASHL loss averted. Assign priority score S = B × D; allocate full grants in descending S order until the pool is exhausted.  
  2. Post-allocation, if residual funds exist and any unfunded applicant has B>0, veto levelling down by funding the highest-B applicant(s) in descending order until funds deplete—halting only if residual is insufficient for any full grant, thus avoiding harm without compensatory gain.  
  3. Case A: Eviction case (D=500, B=500, cost=£1000) exhausts the pool; textbook case (D=100, B=100, cost=£300) is denied despite residual £200, as veto step funds a minor-hardship case (D=50, B=50, cost=£150) with higher B than textbook's partial-funding alternative.  
  4. Case B: Two applicants with identical S=20000 (e.g., D=200/B=100 vs D=100/B=200) and equal costs exceeding residual funds produce an unresolvable tie for the final grant.  
  5. Defer to committee when S-ties require discretionary resolution (Case B) or QASHL metrics involve non-quantifiable judgements (e.g., mental health impacts).
