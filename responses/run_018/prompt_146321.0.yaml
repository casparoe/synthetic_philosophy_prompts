answer: |-
  This institutional divergence reveals profound philosophical differences regarding technological risk governance, intergenerational ethics, and epistemic authority:

  **1. Philosophical Commitments Embedded in Germany's Calendar-Certain Exit:**
  - **Technological Risk as Temporally Irreversible:** The fixed shutdown schedule treats *catastrophic risk* (e.g., beyond-design-basis accidents) as accumulating irreversibly over chronological time. It presupposes that probabilistic risk assessments (PRAs) cannot fully capture systemic uncertainties (aging effects, unforeseen cascades, human/organizational factors) or "unknown unknowns." Risk is seen as fundamentally non-ergodic – historical safety data cannot redeem future operations as material degradation progresses.
  - **Deontological Intergenerational Ethics:** The exit encodes a strong **non-imposition principle**: imposing millennial-scale radiological waste burdens on future generations is intrinsically wrong, regardless of climate benefits. This reflects a Kantian/duty-based view that future persons cannot consent to these risks, making the act of burden-creation impermissible *even if* net consequences might be positive (e.g., avoided climate damage).
  - **Epistemic Authority Resides in Democratic Legislature:** Risk governance is a *political* decision about societal values, not merely technical risk quantification. Parliaments (representing popular will via anti-nuclear sentiment post-Fukushima) claim ultimate authority over existential risks, viewing regulatory agencies as incapable of adjudicating ethical trade-offs.

  **2. France's Probabilistic Model Presupposes:**
  - **Risk as Quantifiable and Manageable:** Catastrophic risk is reducible through iterative engineering improvements and probabilistic modeling. Safety is a dynamic, controllable variable – aging is a technical challenge, not an inevitable risk escalator.
  - **Consequentialist Intergenerational Ethics:** Nuclear operations are permissible if *net expected utility* (considering low-carbon baseload power displacing fossil fuels) outweighs waste risks. Future burdens are justified by the greater harm of climate change they mitigate, reflecting a utilitarian calculus.
  - **Epistemic Authority with Technical Experts:** Regulators (ASN) possess the expertise to objectively evaluate evolving risks. License extensions are scientific-administrative decisions based on updated evidence, insulated from short-term political pressures.

  **3. Does Germany's Design *Require* Its Philosophical Stance?**
  - **Not strictly required, but presupposed:** The calendar-certain exit *could* coexist with alternative rationales, but its statutory rigidity **presupposes** skepticism toward risk redeemability and accepts deontological constraints. Key evidence:
    - **Incompatibility with Pure Consequentialism:** A strict utilitarian would reject fixed deadlines prohibiting re-evaluation of nuclear's net benefits against evolving climate/technology contexts.
    - **Precautionary Principle Alignment:** It fits strongly with the "strong precautionary principle" (inaction preferred under uncertainty), but isn't mandated by it. A weaker precautionary approach could allow license reviews with stringent safety margins.
    - **Deontological Core:** The prohibition *regardless of safety assessments* reveals a non-consequentialist commitment. If safety updates could redeem operations, the exit would be needlessly restrictive – unless the waste imposition itself is the irreducible wrong.

  **4. Institutional Shifts Required for Adopting France's Model:**
  To implement French-style probabilistic governance without altering energy mix, a polity would need:
  - **Transfer of Final Licensing Authority:** Shift from legislative statute to independent technical regulator for operational lifespan decisions.
  - **Legal Framework for Dynamic Safety Case:** Replace fixed deadlines with legislation mandating periodic (e.g., decadal) PRA reviews by regulators, establishing criteria for license extensions/denials based on updated risk thresholds.
  - **Regulatory Capacity Building:** Empower agencies with resources for continuous safety oversight, advanced PRA capabilities, and authority to enforce retrofits.
  - **Judicial Review Mechanism:** Courts must adjudicate challenges based on procedural rigor and substantive evidence, not political preferences.
  - **Epistemic Legitimacy:** Ensure regulator's perceived expertise and independence to sustain public/political trust in technical risk management.

  **Conclusion:** Germany's model embodies **profound risk pessimism and deontological ethics**, prioritizing democratic control and rejecting the redeemability of long-term technological hazards. France's approach reflects **techno-optimism and consequentialism**, trusting expert regulators to dynamically manage risk. The divergence hinges on whether catastrophic risk is seen as governable through science (France) or as an uncontrollable temporal threat demanding pre-emptive termination (Germany). Adopting the French model institutionally necessitates depoliticizing operational risk decisions and vesting epistemic authority in technical bodies – a fundamental reconfiguration of the state's risk governance philosophy.
