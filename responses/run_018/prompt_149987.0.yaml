  Starting with brainstorming what people miss when discussing Quine-style ontological commitment. Often, discussions assume that all relevant evidence is accessible with enough time or tech. But that's not always true. For example, some historical events leave no trace, or certain quantum states can't be measured without altering them. Another missed point is the difference between not knowing something and it being fundamentally unknowable. Also, the role of counterfactuals—how to handle what could have been but isn't. People might conflate epistemic gaps (we don't know yet) with ontic gaps (it's impossible to know). Plus, the assumption that inference to the best explanation (IBE) will eventually resolve things, but if information is permanently gone, IBE breaks down.

