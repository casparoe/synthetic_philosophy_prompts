    "rate_vs_threshold": "The poem shifts from log-based growth (Stanza 4) to threshold-focused betting (Stanza 5), where 'a cliff to clear' replaces compound growth as the objective. The envoi contrasts 'growth’s sure edge' with 'thresholds, sharp and half-defined', leaving both valid.",
    "riskiest_line": {
