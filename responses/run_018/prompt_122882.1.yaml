  ### Notes  
  - **Form & Rotation**: The sestina strictly follows the required fold (1-2-3-4-5-6 → 6-1-5-2-4-3, etc.). End-words include technical terms ("odds", "edge", "stake", "run") and quantity words ("half", "nothing").  
  - **Turn & Nuance**: Stanza 4 explains the log frame ("To add what time won’t take..."); Stanza 5 introduces the threshold objective without caricature ("No timid soul... leaps the gap"). The envoi refuses resolution.  
  - **Accuracy**: Claims are verbatim checks (e.g., absorbing barriers, median/mean divergence, bold play for thresholds).  
  - **Readability**: Accessible via concrete verbs ("place my stake", "dice will run") and human stakes ("losing hand", "laughs at cautious run"). The "half-heaven" line risks mild poetic license but rewards quants with subtext (astronomical paths).
