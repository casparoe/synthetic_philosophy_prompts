answer: |-
  ### The Bet at the Table  
  (a sestina for the Kelly group)  

  We gather here, where fortune shifts like **odds**,  
  each eyeing cards, the table's sharpened **edge**.  
  I place my **stake**—a fraction, not the whole—  
  just **half** the wealth I brought when I began.  
  A losing hand could leave me **nothing** left,  
  if this week's luck becomes a losing **run**.  

  The long game turns on how the dice will **run**,  
  ignoring when or why we beat the **odds**.  
  For wealth compounds—a product, not a sum—  
  so order doesn’t touch the final **edge**.  
  Win early, late, the product holds the **half**,  
  the same if ruin left you **nothing**.  

  But ruin’s floor *is* **nothing**—cold and hard.  
  A streak of loss, a brutal downward **run**,  
  can break you long before the math’s **half**-done,  
  if margin calls ignore your paper **odds**.  
  No product cares, but *you* hit that sharp **edge**  
  where even growth can’t save a spent-out **stake**.  

  So why the log? Why place this measured **stake**?  
  To add what time won’t take or twist to **nothing**,  
  to let the long road smooth the cliff’s harsh **edge**,  
  and trust the law of that slow, steady **run**.  
  The median holds firm against wild **odds**,  
  while means explode on paths that touch **half**-heaven.  

  But what if heaven’s fixed? A target **half**-seen,  
  a cliff to clear? Not growth, but crossing takes  
  the lead. A different player scorns the **odds**  
  and bets it all—to land the mark or **nothing**.  
  No timid soul, he laughs at cautious **run**  
  and leaps the gap where safety’s **edge** once stood.  

  Two minds, one table: one seeks growth’s sure **edge**,  
  one dares the leap for thresholds, sharp and **half**-  
  defined. Both see the risk, the churning **run**,  
  both weigh the **stake** against the prize ahead.  
  One calls it growth, one calls the fall to **nothing**.  
  The same green felt, the same unflinching **odds**.  

  The **edge** is clear: one **stake** for growth, one **half**-  
  mad leap. But judge? Not I. This **run** we’re on  
  takes **nothing** less than both truths, braced against the **odds**.  

  ---

