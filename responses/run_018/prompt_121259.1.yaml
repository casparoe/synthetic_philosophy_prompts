prompt: |-
  hey, i'm on our museum's restitution committee and we're trying to keep our decisions consistent but it's getting weird. our past calls: yes to Benin bronzes taken in the 1897 raid; no to the Parthenon marbles since Elgin had that Ottoman firman, shady but legal; yes to a Maori taonga that a missionary "bought" from a chief in 1923 since he lacked authority to sell communal property; no to a Nigerian brass plaque we recieved in 1971 from a dealer whose clients were fleeing Biafra, since there was no direct state coercion; and yes to a Khmer statue acquired in 1984 because the looting was documented during the genocide. now we're voting on a 17th-century Benin ivory tusk that was taken in 1897 but was already sold to a german merchant in 1885, then inherited, then donated to us in 1950. the Oba's court wants it back. do you think we'll vote yes or no? i'm less interested in the answer than in the competing rules that fit our five precedents — like direct colonial violence versus broken chain of consent versus present cultural necessity — and which one we're actualy running. also, what hypothetical case, maybe one involving a 3D-printed replica cast from melted-down loot, or an object that changed hands three times before reaching europe, would actually force those rules to split? and if our precedents really don't decide it, what's the principle we'd be adopting either way?
reasoning: |-
  Okay, let me unpack this fascinating restitution dilemma. The user presents a committee's inconsistent-seeming precedents and a new Benin ivory tusk case that tests their framework. 

  First, I need to map their existing decisions to spot patterns. The yes/no split seems to hinge on three key factors: 1) presence of direct violence/illegality (Benin bronzes yes, Khmer statue yes), 2) validity of transfer chain (Parthenon marbles no due to Ottoman permission, Nigerian plaque no due to clean post-conflict transfer), and 3) communal ownership rights (Maori taonga yes). 

  Now the tricky ivory tusk: it's from the 1897 raid but left Benin earlier via an 1885 sale. That 1885 transaction is the pivot - was it legitimate? If the committee views pre-colonial sales as potentially valid (like the Parthenon firman logic), they might say no. But if they see the 1885 sale as coercive or the merchant as exploiting power imbalances (like the missionary "purchase"), they'd say yes. 

  The precedents actually conflict here! The Nigerian plaque refusal suggests they might prioritize clean modern transfers, but the Maori decision shows they invalidate "sales" by unauthorized individuals. The ivory's 1950 donation date resembles the "clean" Nigerian transfer, yet its 1885 origin echoes the problematic Maori transaction.

  For hypotheticals that would rupture their framework: 1) A Nazi-looted painting legally re-sold post-war (tests if clean transfers sanitize original theft) 2) A colonial-era "gift" given under duress but with perfect paperwork (exposes their violence-vs-documentation tension) 3) The 3D-printed replica from melted loot (forces them to define whether restitution is about material or justice).

  Ultimately, they're wrestling with restitution as legal transfer versus moral repair. If they approve the tusk return, they're prioritizing Benin's cultural continuity; if not, they're favoring transactional integrity. Neither choice fits perfectly with precedents - this vote will reveal their true north star.
answer: |-
  Based on your precedents, I'd predict a **"Yes" vote for restitution of the Benin ivory tusk** – but the reasoning will reveal tensions in your committee's *actual* operating principles. Here's how your precedents break down and which rules are competing:

  ### Your Implicit Decision Framework (Decoded from Precedents)
  1.  **Direct Colonial Violence = Automatic Restitution (Trigger: Yes)**
      *   *Evidence:* Benin Bronzes (1897 raid), Khmer statue (genocide-era looting).
      *   *Rule:* Acquisition during/resulting from documented, large-scale violent conflict/oppression invalidates ownership, regardless of subsequent chain.

  2.  **Formal Legality (at time) & "Clean" Subsequent Chain = Denial (Trigger: No)**
      *   *Evidence:* Parthenon Marbles (Ottoman firman, however dubious), Nigerian Plaque (1971 dealer purchase post-conflict, no *direct* state coercion).
      *   *Rule:* If the *initial* acquisition had some formal legal cover (even flawed) AND the chain to the museum lacks documented coercion/theft, restitution is denied.

  3.  **Invalidated Consent/Communal Ownership = Restitution (Trigger: Yes)**
      *   *Evidence:* Maori Taonga (Missionary purchase lacked authority; communal property).
      *   *Rule:* If the seller lacked the cultural/legal authority to alienate the object (especially communal property), the transfer is void, regardless of lack of overt violence.

  ### The 17th-Century Benin Ivory Tusk Case Analysis
  *   **Origin:** Unquestionably Benin, cultural significance clear (Oba's claim).
  *   **Key Fact:** Taken *from Benin* in **1885** via sale to a German merchant, *before* the 1897 punitive raid.
  *   **Your Precedents Conflict Here:**
      *   **Colonial Violence Trigger (Rule 1):** NOT directly acquired *during* the 1897 raid violence. Acquired 12 years prior. This weakens the "automatic yes" based on 1897.
      *   **Formal Legality & Chain Trigger (Rule 2):** An 1885 *sale* has a veneer of legality/commercial transaction (like the Parthenon firman/Nigerian plaque). Chain (sale -> inheritance -> donation) appears "clean" on paper post-1885 (like Nigerian plaque). This argues for **No**.
      *   **Invalidated Consent Trigger (Rule 3):** **This is the strongest argument for Yes.** Who was the German merchant in 1885? Was he acting akin to the missionary – an outsider leveraging influence/power imbalance? Crucially, **did the seller (presumably someone in the Oba's court) have the *cultural authority* under Benin law/custom to permanently alienate this significant object?** If the committee views this 1885 "sale" as inherently coercive, exploitative, or lacking proper communal authority (like the Maori case), Rule 3 applies.

  **Prediction:** Your committee will likely vote **Yes**. Why?
  1.  **Proximity to 1897:** While not taken *in* 1897, the 1885 context is inseparable from growing colonial pressure. The merchant wasn't a disinterested tourist.
  2.  **Alignment with Maori Precedent (Rule 3):** The strongest parallel. Questioning the validity of the *seller's authority* and the *nature of the "sale"* in a colonial context will likely prevail. The Oba's current claim reinforces the object's enduring communal/cultural significance.
  3.  **Benin Bronzes Shadow:** The 1897 raid casts a long shadow, making *any* pre-raid removal look suspect under scrutiny, especially given the Oba's claim.
  4.  **"Clean Chain" Weakness:** The 1950 donation feels distant and passive, unlike the active 1971 dealer purchase during conflict (Nigerian plaque).

  **The Revealed Operating Principle:** Your committee prioritizes **"Moral Legitimacy of Original Acquisition"** over **"Formal Legality & Subsequent Chain Provenance."** You're willing to void transactions based on power imbalances, lack of authority, and the shadow of colonialism, even without documented violence *at the exact moment* of transfer. The "clean chain" rule only seems to apply when the *original* acquisition isn't deemed fundamentally illegitimate by Rules 1 or 3.

  ### Hypothetical Cases to Split Your Rules
  These would force a choice between "Formal Legality/Chain" (Rule 2) vs. "Moral Legitimacy" (Rules 1 & 3):
  1.  **The "Legally Sanitized" Loot:** A sacred object looted by soldiers during a colonial conflict (Rule 1: Yes) but then "legally" sold at auction in the colonizing country to a private collector (with paperwork) before being donated to your museum in 1990 (Rule 2: Clean chain). Does Rule 1 invalidate the subsequent "legal" transactions?
  2.  **The Duress "Gift":** An object formally "gifted" by a colonized leader to a colonial administrator during treaty negotiations under documented, severe political/military duress (no violence *at that moment*, but clear threat). Chain is perfect to your museum. Rule 2 (Formal Gift) vs. Rule 3 (Invalid Consent/Duress).
  3.  **The Triple Middleman:** An object stolen from a ransacked temple (Rule 1: Yes) changes hands three times between local dealers/collectors *within the source country* over 20 years before being "legally" exported and purchased by your museum. Is the chain now "clean" (Rule 2: No) because the original violence was obscured, or is the *original sin* untouchable (Rule 1: Yes)?
  4.  **The Replica Paradox (Your Suggestion):** A 3D-printed replica, created *using digital scans* of an object *melted down by looters* during conflict (so the original is destroyed). The replica is donated. Does restitution of the replica serve the principles (cultural continuity, symbolic repair - Rule 1/3 spirit) or is it meaningless because it's not the original, legally acquired object (Rule 2)?

  ### The Principle You'd Be Adopting (Either Way)
  *   **If You Vote Yes (Restitution):** You are prioritizing **Cultural Integrity and Remedying Historical Injustice** above formal legalisms and transactional chains. The principle is: "An object's rightful place is with its creators' descendants if its removal occurred under conditions of significant power imbalance, coercion, or violated cultural norms of ownership, regardless of subsequent documentation." (Moral Legitimacy Trumps Law).
  *   **If You Vote No (Retention):** You are prioritizing **Transactional Certainty and Adherence to Historical Law** (however imperfect) above retrospective moral judgments. The principle is: "Museums can rely on the validity of documented ownership transfers that were legal *at the time* and lack evidence of direct, *contemporaneous* coercion or theft in the chain leading to them, even if the original context was problematic." (The Chain Can Sanitize).

  **The Benin tusk case forces this choice:** Was the 1885 sale a valid commercial transaction (No) or an inherently illegitimate alienation under colonial pressure lacking proper authority (Yes)? Your precedents lean towards the latter interpretation, hence the predicted "Yes." This vote will solidify whether "Invalidated Consent in a Colonial Context" (Rule 3) is your dominant principle, even overriding a seemingly "clean" later chain.
