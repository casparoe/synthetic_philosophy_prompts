answer: |-
  ### Examination Essay Question  
  **"Nietzsche presents eternal recurrence as the question: 'Do you desire this once more and innumerable times more?' (GS 341). Reconstruct the thought experiment *strictly* as a counterfactual decision criterion: 'Could you will the infinite repetition of your present life?' Now, consider this criterion’s ethical force. Must the life repeated be *numerically identical* to your current existence (i.e., the very same 'you' persists across all cycles), or would *qualitative identity* (a life indistinguishable from yours in all experiential respects, but not metaphysically the same 'you') suffice? Assess whether Nietzsche’s rejection of metaphysical substances (e.g., souls, substrata) permits a demand for numerical identity. Would qualitative repetition alone generate the same existential weight or collapse the test into a consequentialist comparison of possible lives? Defend your interpretation of recurrence’s distinctively Nietzschean character."**  

  ---

  ### Model Answer (Approx. 800 words)  

  Nietzsche’s eternal recurrence, framed as a counterfactual decision criterion, asks whether one could affirm the infinite repetition of one’s present life. This diverges fundamentally from cosmological readings (which treat recurrence as a physical hypothesis) and standard ethical-affirmation readings (which focus on embracing life *as if* it recurred). Instead, it functions as a litmus test for one’s orientation toward existence: *Could you will this life’s exact repetition eternally?* The criterion’s power, however, hinges on a tension within personal identity: Does its ethical force require that *you*—numerically identical—relive this life, or would a qualitatively identical replica suffice? Nietzsche’s anti-metaphysical commitments, I argue, force him to reject numerical identity, but this risks draining recurrence of its visceral impact and inadvertently aligning it with consequentialism.  

  **(1) Numerical vs. Qualitative Identity & Personal Persistence**  
  Numerical identity demands strict persistence of a single entity (e.g., "I" am the *same* person reliving my life across cycles). This relies on metaphysical conditions for personal persistence (e.g., a soul, psychological continuity, or physical substrate). Qualitative identity, conversely, requires only that each iteration instantiates identical properties: a being indistinguishable from "you" in mental states, memories, and material composition inhabits each cycle, but no "deep" self bridges the iterations (akin to Parfitian "Relation R"). For recurrence to function as Nietzsche’s ultimate test, we must ask: What sustains the "sting"? The horror of recurrence lies in *your* eternal return to suffering—not a clone’s.  

  **(2) Nietzsche’s Anti-Metaphysics Rejects Numerical Identity**  
  Nietzsche cannot consistently demand numerical identity. His critiques of "the subject" as a "fiction" (BGE 54) and of causal "doers behind deeds" (GM I:13) dismantle the metaphysical substrates required for strict personal persistence. To insist on numerical identity would reintroduce the very "soul atomism" he derides (BGE 12)—a comforting illusion of enduring selfhood that evades life’s radical flux. Recurrence, as a test of *amor fati*, must confront existence without transcendental crutches. Hence, Nietzschean coherence demands qualitative repetition: each cycle begins anew with a being psychologically/materially identical to "you," but no numerically persistent self endures across cycles. The "you" who wills recurrence is only the present, embedded self—not a transcendent ego.  

  **(3) Affective Weight Under Qualitative Repetition**  
  Yet qualitative repetition threatens to defang recurrence’s existential force. If the suffering being in each cycle isn’t metaphysically *me*, why should I dread *their* pain? The motivational weight appears to depend on the illusion of numerical identity Nietzsche rejects. However, Nietzsche can salvage the test’s power by shifting focus from identity to *identification*. The criterion probes whether your *present* values and drives can affirm *this specific life-pattern* eternally—regardless of metaphysical persistence. Dread arises not from "I will suffer forever," but from "Existence *as constituted by this life* is eternally necessary." The horror is impersonal: the pattern itself, not its "owner," is eternally fixed. This retains affective force by binding affirmation to the concrete reality of one’s life, not abstract continuity.  

  **(4) Consequentialist Collapse?**  
  Framing recurrence as a counterfactual criterion ("Could you will this?") risks reducing it to consequentialist evaluation. One might compare *this* life-cycle against possible alternatives ("Would a better life be more affirmable?"), undermining Nietzsche’s insistence that recurrence is a test of *this* life’s intrinsic value, not its instrumental outcomes. However, qualitative repetition blocks this collapse. Consequentialism compares possible worlds; recurrence eliminates alternatives. There are no "better worlds"—only *this* pattern repeating infinitely. The question isn’t "Could you prefer this life?" but "Could you bear its *eternal necessity*?" This forces confrontation with fate, not optimization. Numerical identity might heighten dread, but qualitative repetition better serves Nietzsche’s anti-teleological aim: exposing resentment against existence *as given*.  

  **Conclusion**  
  While qualitative repetition alone may initially seem to dilute recurrence’s terror, it aligns with Nietzsche’s critique of metaphysics and avoids consequentialism. The test’s core is not metaphysical continuity but the *impossibility of escape* from life’s totality. Affirming a qualitatively recurring life means embracing the necessity of *this* existence—flaws and agonies included—without appeal to transcendent selves or better futures. This preserves recurrence as a uniquely Nietzschean criterion: not a cosmological truth or ethical heuristic, but a hammer shattering illusions of redemption beyond the immanent.  

  ---

  ### Marking Scheme (Total: 30 marks)  
  **A-level answers** synthesize (3) and (4), showing how anti-metaphysics *entails* qualitative repetition *and* shields recurrence from consequentialism. **B-level answers** treat these as separate points without integration.  

  | **Analytical Move**                                                                                                | **Marks Allocated** | **A-Level Benchmark**                                                                                                                                 | **Common Errors (Mark Deductions)**                                                                                                |  
  |--------------------------------------------------------------------------------------------------------------------|---------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------|  
  | **1. Distinguishes counterfactual-criterion reading** from cosmological/standard ethical interpretations.           | 0–4 marks           | Clearly contrasts the *decision-test* framing with cosmological (physical cycle) and ethical-affirmation (life-affirming attitude) readings.           | Vague or conflated definitions (-2); omission of either contrast (-2 per omission).                                                |  
  | **2. Articulates numerical vs. qualitative identity** and links to personal persistence conditions.                 | 0–6 marks           | Precise definitions + explanation of how each demands different persistence conditions (e.g., soul vs. psychological continuity).                      | Confuses numerical/qualitative (-3); fails to specify persistence criteria (-2); superficial treatment (-1).                       |  
  | **3. Explains Nietzsche’s anti-metaphysics** and its incompatibility with demanding numerical identity.             | 0–8 marks           | Uses Nietzschean texts (e.g., BGE 54, GM I:13) to show numerical identity relies on discarded metaphysics ("soul," "subject").                         | Ignores Nietzsche’s critiques (-4); asserts numerical identity is possible without justification (-3); no textual grounding (-2). |  
  | **4. Assesses affective weight under qualitative repetition**: Can it sustain dread/affirmation?                   | 0–6 marks           | Engages the "clone problem" (why care about non-me suffering?) and offers Nietzschean resolution (e.g., affirmation of *pattern*, not persistence).    | Dismisses affective loss without argument (-3); ignores the "why care?" objection (-2); no resolution proposed (-2).               |  
  | **5. Evaluates consequentialism objection**: Does counterfactual framing reduce recurrence to world-comparison?     | 0–6 marks           | Shows how qualitative repetition *blocks* consequentialism by eliminating "better worlds" (only *this* pattern exists eternally).                     | Conflates counterfactual with consequentialist (-3); fails to address elimination of alternatives (-2); weak defense (-1).         |  

  **Grade Boundaries**:  
  - **A (25–30)**: Synthesizes (3) and (5) to show anti-metaphysics *enables* recurrence’s anti-consequentialist function via qualitative repetition.  
  - **B (18–24)**: Addresses all moves competently but treats anti-metaphysics and anti-consequentialism as separate arguments.  
  - **C (12–17)**: Omits/mishandles ≥2 moves (e.g., ignores identity distinction or consequentialism).  
  - **D/F (0–11)**: Major omissions (e.g., no engagement with anti-metaphysics) or pervasive confusion.  

  ---  
  **Note**: This prompt and rubric require no external citations, focusing solely on conceptual coherence within Nietzsche’s framework. Top answers demonstrate how the identity problem *emerges from* Nietzsche’s own commitments.
