  ### Diagnostic Decision Tree: Cognitive Penetration of Perception

  **Starting Case:** A trained radiologist examines an ambiguous tissue scan. When primed that the sample is likely benign, she reports the image looks uniformly smooth; without priming, she reports seeing irregular mottling, despite identical retinal stimulation.  

  ---

  #### **Q1: Does the cognitive priming alter the *phenomenal character* of the radiologist's visual experience (e.g., how the scan visually "appears" to her), or does it only bias her post-perceptual interpretation or verbal report?**  
  - **YES (Alters phenomenology) → Q2**  
  - **NO (Only post-perceptual bias) → Q5**  

  ---

  #### **Q2: If phenomenal character is altered, is the mechanism *direct top-down modulation* of early sensory feature detectors (e.g., V1/V2 cortex), or only *restructuring of attention/conceptual framing* after sensory registration?**  
  - **YES (Direct top-down modulation) → Q3**  
  - **NO (Attention/conceptual restructuring) → Q4**  

  ---

  #### **Q3: For direct top-down modulation, if the radiologist is later counter-primed with "likely malignant" information, does her perception revert to seeing mottling?**  
  - **YES (Reversible) → Leaf 1: *Reversible Direct Penetration***  
    - *Unnamed*: Likely unexplored. Direct penetration is typically assumed persistent; reversibility suggests high-level plasticity not standardly theorized.  
  - **NO (Persistent) → Leaf 2: *Direct Top-Down Penetration***  
    - Named position (e.g., Churchland, predictive processing views).  

  ---

  #### **Q4: For attention-mediated restructuring, can the radiologist introspectively access the *unpenetrated percept* (e.g., residual mottling when primed benign) as independent evidence against the priming belief?**  
  - **YES (Accessible sensory residue) → Leaf 3: *Attention-Mediated Restructuring with Evidential Access***  
    - *Unnamed*: Conceptually coherent (e.g., attentional "spotlight" leaves periphery unaltered) but practically unattractive for real-time perception.  
  - **NO (No accessible residue) → Leaf 4: *Attention-Mediated Restructuring without Evidential Access***  
    - Named position (e.g., Siegel, Macpherson).  

  ---

  #### **Q5: If only post-perceptual, can non-conceptual states (e.g., fear, reward anticipation, statistical learning) produce an analogous report-shift in a similar case?**  
  - **YES (Non-conceptual states suffice) → Leaf 5: *Post-Perceptual Bias Extendable to Non-Conceptual States***  
    - *Unnamed*: Merely unexplored; empirical evidence (e.g., affect-biased judgments) suggests viability.  
  - **NO (Requires conceptual states) → Leaf 6: *Modular Encapsulation***  
    - Named position (e.g., Fodor).  

  ---

  ### Ambiguities and Unresolved Pairs  
  - **Leaf 1 vs. Leaf 2**: Ambiguity in **dimension (d)**. The tree does not specify whether the *persistent* (Leaf 2) or *reversible* (Leaf 1) direct penetration leaves the percept available as independent evidence. Direct penetration often implies circularity, but reversibility *might* allow access to pre-penetration states.  
  - **Leaf 3 vs. Leaf 4**: Ambiguity in **dimension (c) and (e)**. The tree does not test whether attention-mediated restructuring (both leaves) requires conceptual states or could be driven by non-conceptual factors, nor whether the effect is reversible via counter-priming.  

  ---

  ### Fifth Dimension: Temporal Reversibility  
  This dimension tests whether the perceptual shift *reverts* when the priming belief is withdrawn or reversed (e.g., counter-priming the radiologist). It separates:  
  - **Stable penetrability** (effects endure; e.g., predictive coding).  
  - **Labile penetrability** (effects context-dependent; e.g., attentional framing).  
  This exposes commitments about perception’s "rewritability" and evidentiary stability.
