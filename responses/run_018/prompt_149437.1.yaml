  For (i), foundationalists argue that infinite regresses are arbitrary because they lack a starting point. Infinitists counter that each step provides some justification, even if small, and coherence across the chain adds up. But is that enough? In metrology, infinite chains without a primary standard would be problematic. Each calibration step introduces error, and without a fixed point, the uncertainty compounds. Similarly, in epistemology, each inferential step might weaken justification. But maybe infinitism avoids arbitrariness through the structure of the chain itself, not needing a fixed start.

