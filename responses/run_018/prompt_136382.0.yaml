  ## Opening Remarks: "Ontological Commitment and Ordinary Speech" Workshop

  **(Approx. 5 minutes spoken)**

  Good morning everyone, and a very warm welcome to this two-day workshop, “Ontological Commitment and Ordinary Speech.” It’s genuinely exciting to see such a diverse group here – metaphysicians, philosophers of language, cognitive scientists – united by curiosity about how our words connect to the world, or perhaps, how our engagement *with* the world is structured *by* our words.

  We’re gathered under a title that points to a tension many of us feel, especially when we step outside our specialized corners. We talk about chairs, nations, or electrons as real things – we make *ontological commitments* in our *ordinary speech*. Yet, when philosophers dig in, fierce disagreements erupt about what *actually* exists. Are these disagreements uncovering deep truths about reality? Or are they, as some suggest, merely linguistic confusions – disputes about how to *talk*, not about how the world *is*?

  I propose we frame our discussions here by navigating a path between two well-trodden extremes. It’s *not* simply that we are here to definitively discover what exists, as if peeling back a veil to reveal a pre-packaged inventory of the universe. Nor is it that we are merely clarifying language, tidying up conceptual confusions without any real metaphysical stakes.

  Instead, let’s consider a possibility: sometimes, what appears to be a straightforward disagreement about *what exists* – at the level of the explicit propositions we assert – might indeed be rooted in differing linguistic choices or frameworks. But crucially, this doesn’t render the disagreement trivial or *merely* verbal. Because embedded within those frameworks are deep-seated *practical commitments* – norms about what counts as salient, what demands explanation, and how we ought to reason about the world.

  Let me illustrate with a classic, non-technical example: **chairs**.

  One philosopher might look at a chair and say, "There is a composite object here: the *chair itself*." Another might insist, "No, there are only fundamental particles arranged chair-wise. The 'chair' is just a useful way of talking about that arrangement."

  *At the level of explicit propositional content* – "Is there a chair?" versus "Are there only particles arranged chair-wise?" – this might seem like a classic verbal dispute. Each side can often paraphrase the other's claims within their own terms without losing factual information about the location of particles or the functional properties of the arrangement.

  But – and this is the crucial pivot – the *practical commitments* diverge significantly. The person committed to *chairs* as genuine composites is typically committed to explaining why *this chair* broke (focusing on its structural integrity, its history as a single entity), why *it* is valuable, or why *it* persists over time despite particle replacement. For the person seeing only arranged simples, the salient explanations shift: they focus on the binding forces between particles, the spatio-temporal continuity of the arrangement, or the functional patterns instantiated by the particles. What counts as a satisfying explanation, what features demand attention, even what kind of causal interactions are primary – these reasoning patterns restructure themselves depending on the framework adopted.

  *This* is the terrain we aim to explore over the next two days. Our workshop exists to probe how ontological commitments function *within* ordinary speech and specialized discourse. We’re asking: How do the words we use – the entities we seemingly quantify over – encode not just propositions about the world, but *patterns of practical engagement* with it? How do these implicit commitments shape our sense of salience, our norms of explanation, and our understanding of causation or persistence? And crucially, when frameworks clash, what is actually required to translate between them? Not mere paraphrase, but a potential *restructuring* of these deeply embedded reasoning habits.

  So, our goal isn't to definitively settle *whether* chairs exist. It’s to understand the *weight* of saying they do, or saying they don't, within the broader fabric of how we think and speak. We’re examining the bridge between linguistic practice and our normative orientations towards explanation and understanding. This, we believe, is where the substantive heart of many ontological debates truly lies – not solely in the explicit quantifier, but in the implicit structure of commitment it carries.

  I invite you all to engage deeply, listen openly, and challenge constructively. Thank you for being here. Let’s get started.

  ---

  **Meta-Note on Philosophical Interpretation:**

  *   **Overall Confidence:** I am about **75-80% confident** in this interpretation as a coherent and defensible middle position that accurately reflects the intended framing (neither Carnapian nor Siderian extremes). The core idea – distinguishing explicit propositional content from implicit practical/normative commitments structuring reasoning – is well-established in pragmatist and inferentialist traditions and effectively captures a non-deflationary but non-robustly-realist stance.
  *   **Point of Least Confidence / Key Uncertainty:** I am **least confident** (perhaps 50-60% sure) about the specific claim that **practical-commitment structures can carry *genuine ontological weight* independently of explicit quantificational claims**. This is the crux of the matter. The argument is that these commitments *constitute* a form of ontological stance *because* they fundamentally restructure our rational engagement with the world (salience, explanation). However, the counter-argument is potent: Couldn't these practical differences *still* be ultimately grounded in non-ontological factors (e.g., pragmatic usefulness, psychological salience, differing explanatory *interests*) without truly bearing on *what exists*? Does "restructuring how we reason" necessarily change what we are *ontologically committed to*, or just *how we talk about* what we are committed to? This ontological "weight" of the practical is the most philosophically contentious and crucial hinge point of the proposed position. The success of the workshop's framing arguably depends on making a plausible case for this independence.
