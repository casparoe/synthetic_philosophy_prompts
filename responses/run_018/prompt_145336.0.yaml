  For the agreed claims, both camps probably agree that comparison involves measurable aspects like scale, intent, and institutional mechanisms. They might also agree that remembrance is crucial, but differ on how it's done. The disagreements need to highlight each side's core arguments without bias. The "Necessary for Justice" camp likely emphasizes that understanding differences helps prevent future atrocities, while the "Desecrates the Dead" camp argues that ranking reduces victims to metrics and ignores individual suffering.

