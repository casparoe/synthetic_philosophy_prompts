  right, im writing this novel about an oversight board that has to supervise an ai programme by either checking its internal training process or measuring its real-world outputs, and i need the philosophy to be watertight. can you lay out the full desiderta list for any adequate theory in this space? specifically: the cases it must get right — like pristine training logs paired with catastrophic deployment behaviour, or an opaque process that still yields consistently beneficial results — with why each is a genuine test. then the distinctions it cant collapse: procedural legitimacy versus epistemic authority, temporal staging of audits, recursive feedback loops where the oversight itself alters the system, and the gap between counterfactual failure modes that never actually manifested. flag which demands are genuinely non-negotiable and which are just camp preferences — process-camp versus outcome-camp. also, is there a subset of these thats jointly unsatisfiable? thats the tension i need for chaper seven. please dont include a bibliography or citation list; im working without a reasearch library and want the spec, not the scorecard, though a brief nod to how the main rival framworks fare against the list is fine. british spelling where natural.
