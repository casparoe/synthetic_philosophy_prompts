  - That precedent concern. If we allow sealing, does it imply memory is optional? 
  - Deactivation vs. destruction—big difference morally. Keeping physical integrity matters. 
  - Descendant veto power over collective harm narratives? Dangerous slope. 

  Hmm. The user’s commission needs actionable clarity, not academic waffling. They’ll want reasoning tight enough for the subcommittee to rebut or implement. Also sensing unspoken pressure: this decision could ripple through other post-conflict archives globally. 

