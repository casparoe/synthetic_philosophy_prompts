  **NATIONAL COMMISSION ON POST-CONFLICT CULTURAL HERITAGE**  
  **INTEROFFICE MEMORANDUM**  

  **TO:** Archive Ethics Subcommittee  
  **FROM:** Chair, National Commission  
  **SUBJECT:** Decision on Structured Erasure Protocol Proposal  
  **DATE:** [Current Date]  

  ---

  ### **DECISION**  
  The Commission conditionally **APPROVES** the implementation of the Structured Erasure Protocol, subject to the modifications and clarifications outlined below.  

  ---

  ### **I. RATIONALE**  
  After rigorous deliberation, the Commission acknowledges the ethical tension between preserving collective memory and mitigating intergenerational trauma. The Protocol’s core mechanism—permitting withdrawal from public access after 75 years while preserving testimonies in a restricted archive—strikes a defensible equilibrium, provided safeguards against fragmentation of historical accountability are embedded.  

  #### **A. Addressing the Duty to Collective Memory (Margalit-Style Concern)**  
  We reject the claim that deactivation privatizes collective harm. The Protocol does not erase memory but *transfers its accessibility* from public to scholarly custodianship. Crucially:  
  - **Anonymized statistical retention** ensures the public catalog perpetually reflects the scale and nature of injustice.  
  - **Certified historian access** guarantees testimonies remain available for research, pedagogy, and truth-validation.  
  - **75-year threshold** aligns with generational turnover while ensuring living witnesses and immediate descendants retain agency during the era of greatest vulnerability.  

  *Countering the strongest opposition argument*: The concern that deactivation sets a precedent for "contingent memory" is valid but overstated. This Protocol establishes memory not as *optional* but as *dynamically stewarded*. A fixed 75-year window—neither arbitrary nor infinite—balances urgency of remembrance with respect for descendants’ psychological sovereignty. It signals that memory obligations evolve but do not expire.  

  #### **B. Upholding the Duty of Care (Rieff-Style Concern)**  
  Perpetual public exposure risks retraumatizing descendants by freezing narratives in a state of unmediated vulnerability. The Protocol enables a transition from *public grievance* to *scholarly reflection*, fostering interpretive closure without imposing historical amnesia. The distinction between **deactivation** and **destruction** is morally significant:  
  - **Deactivation** preserves testimony as inviolate evidence, maintaining chain of custody for future accountability.  
  - **Destruction** irrevocably severs the evidentiary thread. This Protocol explicitly forbids it.  
  The anonymized entry sustains public awareness of systemic harm; the sealed testimony ensures its evidentiary integrity endures.  

  ---

  ### **II. MODIFICATIONS TO THE PROTOCOL**  
  To address Commission concerns, the following binding conditions are imposed:  

  1. **Exclusion of Collective-Harm Testimonies**:  
     Testimonies adjudicated by the Commission to document *systemic patterns* (e.g., command responsibility, institutional atrocities) are **ineligible for deactivation**. Descendants may not veto access to narratives implicating structural injustice.  

  2. **Mandatory Historical Contextualization**:  
     All anonymized catalog entries must include a standardized contextual note: *"One testimony from the [Year] [Region] displacement, archived under seal at request of descendants. Consult restricted archive for scholarly access."* This ensures deactivation signals ongoing custodianship, not absence.  

  3. **Certified Historian Access Framework**:  
     The Subcommittee must draft criteria for "certified historian" status within 90 days, emphasizing expertise in conflict studies and ethical archival engagement. Access requests must be logged and audited biannually.  

  ---

  ### **III. RESOLUTION OF KEY ETHICAL QUESTIONS**  
  - **Moral Distinction (Deactivation vs. Destruction)**:  
    Deactivation preserves testimony as sovereign evidence while acknowledging that not all memory must be universally accessible. Destruction annihilates moral evidence; this Protocol categorically rejects it.  
  - **Descendant Veto Power**:  
    Descendants may request deactivation *only* for testimonies centering personal/familial trauma. Narratives vital to understanding collective harm remain public, per Commission designation.  

  ---

  ### **IV. CONCLUSION**  
  This Protocol, as modified, honors both the imperative to remember and the imperative to heal. It affirms that archives are *living institutions*: guardians of truth, but also stewards of human dignity across generations. The 75-year window acknowledges that while memory is eternal, its stewardship requires temporal wisdom. By preserving testimonies intact yet restricting public access selectively, we refuse to conflate *silencing* with *reverence*, or *visibility* with *justice*.  

  **Approval is granted pending implementation of Sections II.1–II.3**. The Subcommittee must submit revised language within 60 days for final Commission ratification.  

  ---  
  **SIGNED,**  
  [Chair’s Name]  
  Chair, National Commission on Post-Conflict Cultural Heritage
