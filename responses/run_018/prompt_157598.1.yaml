  First, the core of Gould and Lewontin's actual argument: they were criticizing excessive adaptationism in evolutionary biology, where every trait gets explained as an adaptive solution. Their architectural metaphor of spandrels (those inevitable byproduct spaces in cathedrals) served to illustrate how non-adaptive traits emerge from structural constraints. But crucially, they never claimed spandrels can't acquire functions later - that's a clear distortion in the roommate's version. 

  The user's unease about the roommate's leaps is spot-on. Two big red flags stand out: the false dichotomy between "adaptation or spandrel" (ignoring other evolutionary forces), and the bizarre claim that spandrels can't be co-opted. The latter directly contradicts Gould's own concept of exaptation! 

