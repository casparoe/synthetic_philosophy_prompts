  What the user might really need here is conceptual clarification to counter their roommate's overconfident arguments. They're recognizing the rhetorical overreach but lack the specific terminology (like exaptation) to push back. The underlying tension seems to be about scientific nuance versus black-and-white thinking in evolutionary debates.
answer: |-
  Your instincts are spot-on—your roommate's summary captures the core *metaphor* of Gould and Lewontin's "spandrels" argument but distorts several key points, especially regarding co-option and the implications for evolutionary psychology (EP). Here's a breakdown:

  ### Accurate Parts of the Summary
  1.  **Critique of "Pan-adaptationism":** Gould & Lewontin (1979) *did* argue that adaptationist programs often dominate evolutionary biology, leading to an over-reliance on "just-so stories." They contended that many traits assumed to be adaptations might be non-adaptive byproducts.
  2.  **The Spandrel Metaphor:** They *did* use the architectural spandrel (the triangular space created by adjacent arches) as a metaphor for traits that arise as necessary structural byproducts of other evolutionary changes, *not* as direct targets of selection themselves.
  3.  **Focus on Constraints:** They emphasized that developmental, genetic, phylogenetic, and architectural constraints limit the power of selection and shape organismal form in ways unrelated to adaptation.

  ### Key Distortions and Misrepresentations
  1.  **"Spandrels can *never* get co-opted": THIS IS FUNDAMENTALLY WRONG AND DIRECTLY CONTRADICTS GOULD'S OWN WORK.**
      *   **Exaptation:** Gould (along with Elisabeth Vrba) later developed the concept of **exaptation** precisely to describe how features that originated as non-adaptive byproducts (spandrels) or adaptations for one function could later be *co-opted* for a new, adaptive role.
      *   **Gould & Lewontin (1979) explicitly state:** "We do not... deny that change of function is ubiquitous... Structures now indispensable for their current role began as co-opted spandrels." (They use the term "spandrel" broadly here before formalizing it). They give examples like the human chin (a byproduct of jaw reduction) and feathers (likely evolved for thermoregulation before being exapted for flight).
      *   **Your roommate's claim is the exact opposite of Gould's core point.** Spandrels are *important* precisely because they provide abundant raw material for future evolutionary *co-option* via exaptation.
  2.  **"This means adaptationist explanations are *usually* just-so stories" / "Functional-looking traits are *probably* spandrels":**
      *   **Hyperbole and Overstatement:** G&L argued that adaptationist explanations are *often* untested or poorly tested "just-so stories," and that non-adaptive explanations (like spandrels) are *under-appreciated*. They did **not** argue that adaptation is rare or that *most* functional-looking traits are spandrels. They argued for pluralism – that a wider *range* of explanations (constraints, spandrels, non-adaptive consequences) should be considered seriously *alongside* adaptation.
      *   **Goal:** Their goal was to push back against the *default assumption* of adaptationism, not to claim adaptation doesn't happen or is rare. They argued that the *burden of proof* for an adaptationist explanation should be higher and involve testing against non-adaptive alternatives.
  3.  **"Language is *automatically* wrong as an adaptation if it's a spandrel":**
      *   **False Dichotomy:** This assumes traits are *either* pure adaptations *or* pure spandrels. Evolution is messier.
      *   **Exaptation is Key:** Even *if* the neural capacity underlying language *originated* as a spandrel (e.g., a byproduct of increased brain size for other reasons), **the complex, specific, functional system of language itself almost certainly required subsequent adaptation.** Selection would have acted to shape, refine, and elaborate the pre-existing structures (the "spandrel") into a highly functional system. Calling the *current*, complex trait "just a spandrel" is nonsensical.
      *   **Gould's View on Language:** Gould *himself* often used language as an example of a *probable exaptation*. He argued the brain's computational capacity might be a spandrel (or adaptation for other things), but language co-opted those structures, and selection *then* acted to refine language abilities. He didn't deny selection played a role in shaping language; he argued against the view that language was the *original* target of selection on brain size.

  ### Does the Dismissal of Evolutionary Psychology Follow?
  *   **No, not logically.** Granting the spandrels critique does *not* automatically make EP wrong or mean that psychological traits *aren't* adaptations. It means:
      1.  **Adaptationist hypotheses in EP need rigorous testing:** EP hypotheses *are* vulnerable to the "just-so story" criticism if they rely solely on plausibility arguments without strong evidence (developmental pathways, comparative data, genetics, fossil evidence if possible, predictions of design specificity, etc.) and without considering non-adaptive alternatives (spandrels, constraints, byproducts).
      2.  **Exaptation must be considered:** Complex traits *could* have originated as byproducts or for other functions before being shaped for their current role. EP needs to grapple with this possibility.
      3.  **It's a methodological warning, not a refutation:** The spandrels paper is a critique of *methodology* – jumping to adaptationist conclusions without sufficient evidence or considering alternatives. It doesn't prove that any *specific* EP claim (like language as an adaptation) is false. It argues that the *burden of proof* is higher and the *range of hypotheses* wider than often acknowledged in adaptationist programs like much of EP.
  *   **EP's Response:** Many evolutionary psychologists acknowledge the spandrels critique and the importance of exaptation. They argue they *do* test hypotheses rigorously (using cross-cultural data, experiments, neuroscience, etc.) and consider alternatives, though critics often dispute the sufficiency of this evidence. The debate is ongoing.

  ### In Summary
  *   **Accurate:** Critique of pan-adaptationism, "just-so stories," the spandrel metaphor for non-adaptive byproducts, the importance of constraints.
  *   **Major Distortion:** Claiming spandrels "can never get co-opted" is completely backwards. Exaptation of spandrels is a central part of Gould's evolutionary thinking.
  *   **Overstatement:** Saying adaptationist explanations are "usually" just-so stories or functional traits are "probably" spandrels misrepresents G&L's call for pluralism and balance.
  *   **Oversimplification:** The jump from "language might involve spandrels/exaptation" to "therefore it's not an adaptation *at all*" ignores the role of subsequent adaptation and the concept of exaptation.
  *   **Non-Sequitur:** The spandrels critique challenges the *methodology* of adaptationist programs like EP, demanding stronger evidence and consideration of alternatives. It does *not* logically entail that all EP claims about adaptations are automatically wrong. It makes the bar for proof higher.

  Your roommate captured the provocative spirit but missed crucial nuances, especially regarding exaptation and the nature of complex traits like language. Your skepticism about the leaps in logic is well-founded.
