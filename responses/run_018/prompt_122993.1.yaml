  ### Wrinkle: Discounting as Hazard Rate  
  **Mathematics**:  
  - Constant hazard rate \(\lambda\): Discount factor \(\delta = 1 - \lambda\).  
  - Uncertain \(\lambda\): Aggregate discount \(D(t) = \mathbb{E}_\lambda[(1-\lambda)^t]\).  
    - If \(\lambda \sim \text{Beta}(\alpha,\beta)\), \(D(t)\) is hyperbolic (e.g., \(D(t) \propto 1/t\) for \(\lambda\) uniform).  
  **Implication**:  
  - Hyperbolic discounting can arise from rational uncertainty about survival.  
  - **Defect**: The framework cannot distinguish:  
    - *Bias*: \(\beta < 1\) due to cognitive flaw.  
    - *Rationality*: Correct belief that future may not arrive.  
  - **Proportion**: 70% limitation of vocabulary (no epistemic state), 30% philosophy's "bias" being underspecified.

