    - H1-sophisticated: might abandon if the remaining horizon is too short or if it predicts that it won't complete the run. Or it might start a new run if there is time and the value is positive.
    - H1-naive: will start a new run if the remaining horizon is at least N (because it believes it will complete).
    - H2: will start a new run if the remaining horizon is at least N and if the Q(work) is high enough and the temperature is not too high. But near the deadline, the high temperature might cause it to skip even when Q(work) > Q(skip).

  - Also, the pattern of skips: 
    - In H1 (both), skips are more likely when the agent has accumulated some progress (because the immediate cost is the same but the future reward is discounted more heavily by β for the next step) and when the next step is critical? Actually, in hyperbolic discounting, the agent is more likely to skip when the next step is the one that would complete the run? Not necessarily: it's more likely to skip when the immediate cost is not justified by the discounted future reward, which might happen at any time but especially if the agent is far from the goal and the future reward is heavily discounted.

    But note: in the recertification task, the agent is more likely to skip at the beginning of a run (when progress is low) because the future reward is far. As the progress increases, the future reward gets closer and the discounting is less severe (because fewer days to wait). So H1 might be more likely to skip at low progress.

    - In H2, skips are more likely when the temperature is high, which is when the deadline is near or when the progress is high. So if the agent has accumulated high progress, the temperature is high and it might skip even if it is close to the reward.

  #### Sophisticated vs Naive in H1: Expected Return

  - The sophisticated agent can use commitment (mask) to force itself to work, thereby guaranteeing the reward (if it buys the mask and the horizon is long enough). The cost is k and N*c. Without commitment, it might fail to get the reward, so the expected return might be lower.

  - The naive agent does not buy the mask and also might fail to get the reward (because it skips when faced with the immediate cost, even though it didn't plan to). But it doesn't pay k.

  - So which one has higher expected return? It depends on the parameters.

    - If k is low and the probability of failure without commitment is high, then sophisticated is better.
    - If k is high and the probability of failure without commitment is low, then naive might be better.

  - Without the mask option, the sophisticated agent might adjust its behavior: it might not start a run if it knows it won't complete, while the naive agent starts runs and then abandons them, incurring costs without reward. In that case, sophisticated might be better.

  In the recertification task, with the mask option available, the sophisticated agent can guarantee the reward by paying k. The naive agent never buys the mask and might never get the reward (if it always skips when the immediate cost is due). The expected return for sophisticated: 
     With mask: -k - c*(1+δ+...+δ^{N-1}) + δ^N R
     Without mask: let P be the probability of success without mask, then expected return: P * [ -c*(expected number of work days) + δ^{t} R ] ... but note, the work days are not necessarily N because there might be multiple failed runs. However, without mask, the agent might work multiple times and then skip, so the expected cost is higher than N*c. But the reward is only if it completes one run.

  We can say: sophisticated is better if the expected return with mask is greater than the expected return without mask. Without mask, the sophisticated agent might not even start a run if it predicts failure, so it gets 0. Then it would be better to buy the mask if:

     -k - c*(1+δ+...+δ^{N-1}) + δ^N R > 0

  But if it doesn't buy the mask, it might get a positive expected return? So we need to compare.

  However, the sophisticated agent can choose to buy the mask or not. So it will choose the option with the higher expected return. Therefore, the sophisticated agent will get the maximum of the two options. The naive agent does not buy the mask and gets the expected return without mask (which is lower than what it thinks it will get, because it is naive). 

  So sophisticated is always at least as good as naive, and strictly better when the mask is worth it.

  ### Part 3: Residue Report - Mapping Table

  We map philosophical notions to the RL vocabulary.

  1. **Judgment**: 
     - Clean counterpart: the value function or the Q-function. Judgment of what is best is the action with the highest Q-value.
     - What's lost? In philosophy, judgment might involve reasons and deliberation. In RL, it's a computed value.

  2. **All-things-considered judgment**:
     - Clean counterpart: the Q-values computed by the model-based system with full discounting (δ-only) and all available information.
     - What's bolted on? We need to distinguish between the long-term value function (with no present bias) and the action-selection value function.

  3. **The better judgment one acts against**:
     - Clean counterpart: the long-term Q-value (without present bias) indicating one action is best, but the agent takes a different action.
     - What's bolted on? We need to have two value functions: one for the "better judgment" (long-term) and one for action selection (with present bias or high temperature).

  4. **Intention or plan**:
     - Clean counterpart: a policy or a plan (sequence of actions) that the agent commits to. In hierarchical RL, an option or a temporally extended action.
     - What's bolted on? We can use a plan as a fixed sequence, but in standard RL the agent re-evaluates at each step. To have a plan that the agent sticks to, we need commitment (like the mask) or a hierarchical policy that does not re-evaluate.

  5. **The effort of self-control, or willpower**:
     - Clean counterpart: the cost of overriding a default policy. In KL-regularized control, the KL divergence from a default policy is the cost of control.
     - What's bolted on? We need to define a default policy (which might be the myopic or habitual policy) and then the agent pays a KL cost to deviate.

  6. **Temptation**:
     - Clean counterpart: an action that yields a high immediate reward but is suboptimal in the long run. In our task, skipping is tempting because it avoids the cost c.
     - Clean counterpart? Yes.

  7. **Regret**:
     - Clean counterpart: the difference between the value of the optimal action and the taken action. Or in RL, regret is the loss due to not taking the optimal actions.
     - Clean counterpart? Yes.

  8. **The claim that the agent could have done otherwise**:
     - Clean counterpart: in a stochastic policy, the agent could have taken a different action. In a deterministic policy, it could not.
     - What's bolted on? The framework does not have free will; it's determined by the policy and the state. But if the policy is stochastic, then there is a probability of doing otherwise.

  9. **Blameworthiness**:
     - No clean counterpart. Blameworthiness is a social and normative concept. In RL, we might measure the suboptimality of the action (the regret) but that is not blame.
     - No expression.

  10. **The agent itself, considered as the same thing over time**:
      - In standard RL, the agent is a single entity over time. But in the time-sliced hyperbolic model, it is a series of different agents.
      - What's bolted on? To model weakness of will, we sometimes break the agent into time-slices.

  **The claim that the agent knew better and did it anyway**: 
     - This would require that the agent at time t has access to the long-term value function (the better judgment) but then acts on the short-term value function. In the framework, if we have both value functions, then the action selection is based on the short-term one. The claim does have a behavioral consequence: the agent takes an action that is suboptimal by the long-term standard. But in the recertification task, from the outside, we see the agent skipping when it had been working. We don't see the internal value functions. So if we don't have access to the internal computations, it's invisible. We might infer it if we assume a particular model (e.g., exponential discounting) and then see present-biased behavior.

  **Reasons vs rewards**: 
     - In RL, rewards are the basic motivators. A reason might be a feature of the state that justifies the action, but in the end, it's the reward that defines optimality. We could interpret the reward function as incorporating reasons, but then reasons are just part of the reward.

  ### Part 4: The Wrinkle - Discount Factor as a Hazard Rate

  The mathematics: 

  If there is a constant hazard rate λ (probability that the episode ends at each step), then the discount factor at step t is (1-λ)^t. This is exponential discounting with δ = 1-λ.

  If the hazard rate is uncertain, say λ is drawn from a distribution, then the aggregate discount factor is the expected value of (1-λ)^t. This is not exponential. For example, if λ is distributed as a beta distribution, the discount function becomes a weighted sum of exponentials, which is hyperbolic in shape.

  Specifically, the discount function at time t is: D(t) = E_λ[(1-λ)^t]

  This is the Laplace transform of the distribution of λ. For many distributions, this function is hyperbolic (like 1/(1+kt)). 

  So an agent that is aggregating over uncertain horizons will exhibit hyperbolic discounting. 

  Implication: what looks like present-bias (β<1) might be rational if the future is uncertain. 

  This is a defect of the vocabulary: the framework does not distinguish between a bias (irrational time-inconsistency) and a rational response to uncertainty. The philosophical notion of a bias might be doing less work because the same behavior can be explained as rational.

  ### Part 5: Distinguishing H1 and H2 from Trajectories

  In the recertification task, with only state-action sequences (no self-reports, etc.), can we distinguish:

  1. H1 (quasi-hyperbolic) from H2 (exponential with varying temperature)?
  2. A failure of valuation (like present-bias in H1) from a failure of control (high temperature in H2)?

  The challenge: both can produce similar patterns (e.g., more skips when the reward is closer).

  However, there might be differences:

  - In H1, the probability of skipping depends on the progress and the time. In particular, at a given progress d and time t, the agent will skip if the immediate cost is not justified by the future reward discounted by βδ, etc. This might lead to a specific pattern: for example, the agent is more likely to skip when the progress is low (because the future reward is far) and less likely when progress is high.

  - In H2, the skip probability depends on the temperature. If temperature increases with progress, then the agent is more likely to skip when progress is high (near the reward) and also when the deadline is near. So if we see more skips at high progress, that favors H2. If we see more skips at low progress, that favors H1.

  Also, after a skip, the behavior might differ:

  - H1-naive will start a new run immediately if there is time (because it believes it will complete).
  - H1-sophisticated might not start a new run if the remaining horizon is short.
  - H2 might or might not start a new run depending on the temperature and the Q-values.

  Moreover, the purchase of the mask: only H1-sophisticated might buy it. But if we don't see mask purchase (because k is high or not offered), then we don't have that signal.

  Regarding the last part: if we cannot distinguish H1 and H2 from behavior, then the disagreement between the deflationist (who says it's just discounting) and the Davidsonian (who says there is a synchronous conflict) is not empirically decidable from behavior. It might be a disagreement about which model to use, and the residue is in the internal structure of the agent.

  ### Verdict

  - The residue is mostly a limitation of the RL vocabulary: it lacks the resources to capture the normative aspect of "better judgment" without an external standard, and it cannot distinguish between a rational response to uncertainty and an irrational bias. 
  - However, the philosophical claims were also not as sharp as they looked: the notion of "bias" requires an external standard, and the same behavior can be explained in multiple ways.

  The disagreement between deflationist and Davidsonian is not empty, but it might not be resolvable by behavior alone. It becomes a disagreement about the correct interpretation of the agent's internal structure. 

  But note: in the recertification task, if we see the agent buying the mask, that is a clear signal of sophistication and present-bias (H1-sophisticated). Also, if we see the agent skipping more at high progress, that supports H2. So in some cases, they are distinguishable.

  **Final Verdict**: The residue is a mix, but more heavily a limitation of the vocabulary. However, with careful experimental design (like the mask option and observing the pattern of skips), we can sometimes distinguish the models. The philosophical claims about synchronic akrasia might be supported if we can rule out the diachronic discounting story by ruling out present-bias (for example, by showing that the agent's discounting is exponential when there is no uncertainty) and by showing that the agent has a representation of the long-term value that it then overrides. But without internal access, it's challenging.
