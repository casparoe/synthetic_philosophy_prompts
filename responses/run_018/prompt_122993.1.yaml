  ### Predictions for Serial Recertification Task  
  *Parameters*: \(N=3\), horizon \(T=6\), \(c=1\), \(R=10\), \(k=0.5\), \(\beta=0.7\), \(\delta=0.9\), \(\eta_t = \eta_0 \cdot (1 + \alpha \cdot \text{progress})\). Assume \(\eta_0=0.5\), \(\alpha=0.4\) for H2.

  | **Metric**               | **H1-Sophisticated**                                  | **H1-Naive**                                        | **H2**                                              |
  |--------------------------|-------------------------------------------------------|-----------------------------------------------------|-----------------------------------------------------|
  | **Buys mask?**           | Yes (to preempt future defections)                    | No (believes future selves use \(\delta\))          | No (low \(\eta_0\) at \(t=0\) masks undervaluation) |
  | **Works day 1?**         | Yes (long-term payoff clear)                          | Yes (same)                                          | High probability (low \(\eta_t\))                   |
  | **Works final feasible?**| No if late in horizon (abandons)                      | Yes (believes it can complete)                      | Low probability (high \(\eta_t\) near deadline)     |
  | **After skip at \(j\):** | Abandons if \(T-j < N\) (sophisticated pessimism)     | Resumes (naive optimism)                            | Resumes if \(Q(\text{work}) > Q(\text{skip})\)     |
  | **Dependence on \(j\)**  | Strong: abandons if \(j > N\)                         | Weak: always resumes                                | Moderate: depends on \(\eta_t\) and \(Q\)-values    |

  **Key Divergences**:  
  - Mask purchase only occurs for H1-sophisticated.  
  - Post-skip behavior: H1-sophisticated abandons if \(j > N\); H1-naive always resumes; H2 depends on \(\eta_t\).  
  - Final feasible day: H1-sophisticated abandons, H1-naive works, H2 likely skips.  
  **Indistinguishabilities**:  
  - Day 1 behavior identical across all.  
  - With low \(\eta_t\) or small \(\beta\), all resemble exponential discounters.

  **Sophisticated vs. Naive Welfare**:  
  - Sophisticated buys mask if \(k < \text{value\_loss\_without\_mask}\).  
  - Naive incurs cost from unplanned skips.  
  *Outcome*:  
    - For \(k=0.5, \beta=0.7\), sophisticated achieves higher return:  
      - Mask: \(-0.5 - \sum_{t=0}^{2} \delta^t \cdot 1 + \delta^3 \cdot 10 \approx 6.05\)  
      - Naive: Fails with high probability (\(\mathbb{E}[\text{return}] \approx 2.1\)).  
    - Verdict: Sophisticated better if \(k\) small and \(\beta\) low; otherwise, depends.

