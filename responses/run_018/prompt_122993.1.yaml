  ### Translation of the Four Philosophical Moves

  **Move 1: Classical Puzzle**  
  *Translation*: Can an agent, in state \(s_t\), choose action \(a_t = \text{skip}\) while its Q-value estimates indicate \(Q(s_t, \text{work}) > Q(s_t, \text{skip})\), without new information (no change in \(s_t\)) or external constraints? How is this possible if action selection is determined by maximizing expected value?  
  *Loss*: The framework assumes actions are selected by policies (\(\pi\)) derived from value estimates (e.g., softmax). The "judgment" is reduced to Q-values. The puzzle becomes trivial if \(\pi\) is stochastic (e.g., softmax), but the *normative expectation* of deterministic rationality is lost.

  **Move 2: Davidson's Synchronic Akrasia**  
  *Translation*: At time \(t\), the agent's *model-based evaluation* (using \(\delta\)-discounted Q-values) ranks \(\text{work} > \text{skip}\), but the agent executes \(\text{skip}\) intentionally. This implies a dual-process architecture: a "model-based evaluator" outputs the "better judgment," while a "model-free actor" (or myopic system) selects the action.  
  *Loss*: Requires bolting on a separate evaluator (not part of standard MDPs). The "all-things-considered" judgment becomes an auxiliary computation with no causal force. Intentionality reduces to policy execution.

  **Move 3: Diachronic Deflation (Hyperbolic Discounting)**  
  *Translation*: The agent is a series of time-slices. Slice \(t\) maximizes \(\mathbb{E} \left[ r_t + \beta \sum_{k=1}^{\infty} \delta^k r_{t+k} \right]\). Apparent conflict arises because the optimal plan for \(t=0\) (e.g., "always work") is suboptimal for \(t>0\). Self-control is modeled as *action masking* (paying \(k\) to remove "skip"), representing commitment via intertemporal bargaining.  
  *Loss*: Standard MDPs assume a unified agent. Time-slicing requires multiple agents (each with \(\beta \delta^k\) discounting). The "bargaining" metaphor isn't native; masking is an exogenous tool.

  **Move 4: Backlash Against Deflation**  
  *Translation*: Each time-slice is locally optimal given its \(\beta \delta^k\). Thus, no slice "acts against its judgment." Calling \(\beta < 1\) a "bias" imports an external norm (e.g., \(\delta\)-discounted returns). H2 offers an alternative: no time-inconsistency, but stochasticity (via state-dependent temperature \(\eta_t\)) mimics weakness of will.  
  *Loss*: The normative standard (\(\delta\)-discounting) is exogenous. H2 dissolves the problem by replacing time-inconsistency with control noise, but "temptation" is redefined as temperature increase, not valuation failure.

