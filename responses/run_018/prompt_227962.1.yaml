       - Chairman (help): Not blameworthy for help (but also not intentional).  
     - Limitation: Doesn't cleanly explain why good effects (e.g., chairman helping) are never intentional.  

  4. **Strong Valence Rule**: Only bad side effects are ever intentional, regardless of norms or blame. Good side effects are always unintentional.  
     - Fits:  
       - All bad effects except the nurse (which requires an exception for justified actions).  
       - Chairman (help): Good effect → unintentional.  
       - Nurse: Exception due to justification → unintentional harm.  

  ### Predictions for the Mayor Case
  - **Case summary**: Mayor fast-tracks a project to raise tax revenue, violating a legal norm (waiving environmental review), and foresees reduced air pollution as a side effect.  
  - **Predictions**:  
    - **Norm Violation Rule**: Predicts **intentional** reduction in pollution. The mayor violated a legal norm (environmental review), so any foreseen side effect (even good) counts as intentional.  
    - **Outcome Valence + Norm Hybrid**: Predicts **unintentional** reduction. Pollution reduction is good, so it cannot be intentional, even with norm violation.  
    - **Blameworthiness Rule**: Predicts **intentional** reduction. The mayor is blameworthy (selfish motive, illegal act), and the effect is foreseen, but the rule is ambiguous about good effects.  
    - **Strong Valence Rule**: Predicts **unintentional** reduction. Pollution reduction is good, so it cannot be intentional.  

  ### Best Guess for Your Friend's Verdict
  **Verdict**: The mayor **did not** intentionally reduce air pollution.  
  **Reasons**:  
  - Your friend consistently treats **good side effects as unintentional** (e.g., chairman helping environment). The mayor’s pollution reduction is a good effect, so valence likely dominates her judgment.  
  - Norm violation (waiving review) might not override valence, as her pattern shows no cases where a good effect is deemed intentional, even when the agent is blameworthy or violates norms. The nurse case further shows that justification/norm adherence can negate intentionality for bad effects, but there’s no symmetric precedent for good effects with norm violation.  
  - She may view the pollution reduction as incidental to the mayor’s selfish goal (tax revenue), similar to the chairman’s unintentional help, rather than a deliberate outcome.  

  ### Further Case to Discriminate Between Rules
  The **Strong Valence Rule** and **Norm Violation Rule** are the most plausible but conflicting. The **Outcome Valence + Norm Hybrid** is also viable if valence trumps norms for good effects. To discriminate:  
  - **Test case (Scientist's Cure)**:  
    A scientist runs a forbidden experiment (violating safety norms) purely to win a prestigious award. She knows that, as a side effect, her experiment will produce a chemical that cures a rare disease. She has no interest in the cure.  
  - **Discrimination**:  
    - If your friend says the scientist **intentionally cured the disease**, it supports the **Norm Violation Rule** (norm violation makes any side effect intentional).  
    - If she says **unintentionally cured the disease**, it supports the **Strong Valence Rule** or **Hybrid Rule** (good effects are never intentional, even with norm violation).  
    - The **Hybrid Rule** would also predict "unintentional" here (good effect), while the **Blameworthiness Rule** might predict "intentional" (scientist is blameworthy).  

  This case isolates a good side effect with clear norm violation and blameworthy motives, resolving ambiguity in the mayor case. If she says "unintentional," valence dominates; if "intentional," norm violation dominates.
