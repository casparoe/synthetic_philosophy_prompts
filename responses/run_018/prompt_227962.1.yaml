  ### Candidate Rules Fitting the Earlier Verdicts
  1. **Norm Violation Rule**: A side effect is intentional if it results from an action that violates a salient norm (e.g., legal, ethical, or role-based duty), regardless of outcome valence (good or bad).  
     - Fits:  
       - Chairman (harm): Violates environmental norms → intentional harm.  
       - Executive: Violates fair competition norms → intentional bankruptcy.  
       - Programmer: Violates data security norms → intentional data leak.  
       - Nurse: No norm violation (medical duty to relieve pain) → unintentional harm.  
       - Chairman (help): No norm violation (profit-seeking is acceptable) → unintentional help.  

  2. **Outcome Valence + Norm Violation Hybrid**: A side effect is intentional only if it is **bad** and the action violates a norm. Good side effects are never intentional, even with norm violation.  
     - Fits:  
       - All cases above, but adds valence: good effects (helping environment) are never intentional.  
       - Nurse: Bad effect but no norm violation → unintentional.  
       - Chairman (help): Good effect → unintentional.  

  3. **Blameworthiness Rule**: A side effect is intentional if the agent is blameworthy for the overall action (e.g., selfish motives, disregard for harm), and the side effect is bad.  
     - Fits:  
       - Chairman (harm): Blameworthy (profit over environment) → intentional harm.  
       - Executive: Blameworthy (harming rival) → intentional bankruptcy.  
