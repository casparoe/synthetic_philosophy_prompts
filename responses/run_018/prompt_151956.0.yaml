answer: |-
  The South African TRC's proportionality requirement reveals a complex, philosophically hybrid approach to transitional justice, presupposing several key commitments:

  **Philosophical Commitments of the Proportionality Gate:**
  1.  **Political Violence as Potentially Distinct:** It presupposes that violence driven by a genuine political objective occupies a different moral category than purely private violence, even when the physical act is identical (e.g., killing). This rejects pure moral equivalence between state and non-state violence *if* the latter lacks a genuine political aim.
  2.  **Instrumental Reasoning (Consequentialist Foundation):** The core requirement demands *instrumental rationality*. Amnesty applicants must demonstrate that the *means* (the specific rights violation) were:
      *   **Suitable:** Likely to achieve the stated political objective.
      *   **Necessary:** The least harmful means reasonably available to achieve that objective.
      *   **Proportionate:** The harm inflicted was not excessive relative to the objective's value and likelihood of success.
      This weighs the violation of individual rights/deontological constraints against the perceived value of a collective political end, leaning heavily towards a constrained consequentialism.

  **Deontological Reconstruction?**
  While the *application* relies heavily on instrumental weighing, the gate *could* be partially reconstructed within a deontological framework, but not without significant tension:
  1.  **Motive as Defining the Act's Category:** A deontologist *might* argue that a genuinely political motive changes the *moral description* of the act itself. Killing an informant to protect an anti-apartheid cell might be categorized as an "act of war" or "political resistance" rather than "murder," placing it within a different deontological rule structure (where different prohibitions or permissions might apply). The proportionality test then becomes a way to assess whether *this specific type of act* (political violence) was *justified* within *its own* rule structure, potentially incorporating necessity/suitability as internal constraints.
  2.  **Altering Permissibility, Not Magnitude:** The deontological reconstruction would emphasize that the political purpose doesn't *lessen* the inherent wrongness or the *harm done* to the victim, but it might *alter the conditions under which the act is morally permissible*. Proportionality here acts as a *side-constraint* on otherwise impermissible acts undertaken for political reasons. However, this clashes with the TRC's instrumental language of "weighing."

  **Internal Inconsistency: The Core Tension**
  The model exhibits a profound and arguably necessary inconsistency:
  1.  **For Perpetrators (Instrumental Weighing):** The TRC *required* perpetrators to engage in precisely the calculus it denied victims: demonstrating that the harm inflicted *was* proportionate to the political goal. This implicitly accepts that political objectives *can* morally outweigh individual suffering *if* the proportionality threshold is met. Amnesty depended on successfully making this argument.
  2.  **For Victims (Non-Comparability):** Simultaneously, the TRC insisted that *from the victim's perspective*, and ultimately in the moral universe of the new South Africa, the suffering inflicted was *absolute* and *non-quantifiable*. No political objective could ever truly *outweigh* or *diminish* the fundamental wrong done to them as human beings. The harm retained its full deontological weight as a violation of inherent dignity and rights.

  **Resolution? Pragmatism Over Coherence:**
  This inconsistency is not necessarily a logical flaw but a reflection of the TRC's *pragmatic, restorative purpose*:
  *   **Amnesty as Bargain:** The proportionality test was a crucial part of the *quid pro quo* for amnesty. To incentivize disclosure (needed for truth and societal healing), the state offered a conditional pardon. The condition was proving the act fell within the bounds of politically motivated violence deemed potentially justifiable *within the conflict's logic* (subject to disclosure and proportionality). This required adopting, for amnesty purposes, the perpetrator's own consequentialist framework.
  *   **Restoration Requires Recognition:** For victims and national reconciliation, however, the TRC needed to affirm the absolute inviolability of human dignity and the non-negotiable wrongness of the violations. Denying that suffering could be "proportionate" was essential to validating victims' experiences and rebuilding a rights-based society. This required a deontological stance.
  *   **Separating Accountability from Moral Weight:** The TRC implicitly separated the *accountability mechanism* (amnesty granted based on instrumental proportionality + disclosure) from the *moral assessment of the harm* (absolute and un-diminished by political purpose). It prioritized societal healing through truth and conditional amnesty over perfect philosophical consistency in retributive justice.

  **Conclusion:**
  The proportionality gate primarily presupposes a **constrained consequentialist commitment** – that political objectives *can* justify rights violations *if* the harm is instrumentally necessary and proportionate. While a deontological reconstruction is possible (viewing motive as changing the act's category and proportionality as a side-constraint), it strains against the TRC's practical application. The deep internal inconsistency between the instrumental weighing required of perpetrators and the absolute non-comparability affirmed for victims is fundamental to the model. It reflects the TRC's *pragmatic compromise*: using consequentialist reasoning as a tool to secure perpetrator cooperation and truth-telling for the greater good of reconciliation, while simultaneously upholding a deontological absolute regarding the inherent value of victims and the un-diminishable nature of their suffering. This inconsistency wasn't an oversight but a necessary, albeit morally fraught, feature of its restorative design.
