  I need to start with a strong bottom line in the first sentence. Representational inertia seems more robust for explaining scientific progress. Why? Because it accounts for how scientific concepts build upon each other cumulatively, maintaining explanatory continuity. For example, Newtonian physics isn't entirely discarded when quantum mechanics comes along; it's still used for certain scales. That inertia preserves predictive success while allowing evolution.

