answer: |-
  Representational inertia better accounts for scientific progress by acknowledging the necessary cumulative structure of knowledge, whereas Rorty's antirepresentationalism struggles to explain the resistance to arbitrary redescription in successful science.

  Rorty's antirepresentationalism rejects the idea that language or theories "mirror" reality; scientific theories are merely useful vocabularies for coping with the world, and progress involves adopting new, more useful descriptions without claiming closer correspondence to truth. However, this view struggles to explain *why* radically successful theories like Newtonian mechanics or the periodic table aren't simply "redescribed away" wholesale during revolutionary shifts, even when anomalies arise. Representational inertia argues precisely that such radical, pragmatically motivated abandonment is *impossible* for deeply entrenched, predictively powerful frameworks without catastrophic loss of explanatory power and continuity.

  Scientific progress demonstrably relies on retaining core elements and mathematical structures from prior, successful theories, even amidst profound conceptual change (e.g., Newtonian mechanics limiting to Einsteinian relativity at low velocities/gradients; quantum mechanics incorporating classical observables). This isn't mere intellectual conservatism; it's a pragmatic constraint demanded by the need to preserve vast amounts of established, reliable prediction and explanation. Representational inertia captures this essential feature: the "inertia" of successful representational structures is a *productive* force enabling progress through structured revision, not an obstacle. Rorty's view, by making all descriptions equally contingent tools, risks portraying scientific change as unconstrained linguistic shifts, failing to account for the *specific* reason why some redescriptions work and others don't – namely, their ability to conserve the successful representational content of the past while resolving its limitations. Progress isn't just adopting a new useful story; it's building a new story that *integrates and preserves* the validated representational achievements of the old one, which representational inertia explicitly recognises.
