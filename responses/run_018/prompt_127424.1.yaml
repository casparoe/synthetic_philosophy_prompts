  ### Exam Question: Graduate Seminar in Social Choice Theory and Political Philosophy  
  **Time Allotment:** 90 minutes  
  **Word Limit:** 1,200 words  

  #### Scenario  
  The municipal zoning board must select one of three land-use regimes for a two-household neighborhood:  
  - **R (Strict Residential Preservation):** Restricts exterior modifications and prohibits home-based businesses.  
  - **M (Mixed-Use Development):** Allows flexible exteriors and permits home-based businesses.  
  - **U (Unrestricted Market Allocation):** Imposes no regulations on exteriors or businesses.  

  Households hold lexicographic preferences over the regimes (R, M, U) and possess **minimal liberal rights** over personal domains:  
  - **Household A:** Decisive over the color of its front door (red or blue).  
  - **Household B:** Decisive over the operation of a home-based workshop (present or absent).  

  #### Preference Profiles  
  - **Household A’s Lexicographic Ordering:**  
    1. **Highest Priority:** Workshop status (absent > present).  
    2. **Next Priority:** Land-use regime (R > M > U).  
    3. **Lowest Priority:** Door color (blue > red).  
    Thus, A’s full ranking:  
    (•, absent) regimes > (•, present) regimes → Within absent: R > M > U, blue > red  
    Within present: R > M > U, blue > red.  
    **Simplified Ranking:**  
    - (R, blue, absent) > (R, red, absent) > (M, blue, absent) > (M, red, absent) > (U, blue, absent) > (U, red, absent) >  
    (R, blue, present) > (R, red, present) > (M, blue, present) > (M, red, present) > (U, blue, present) > (U, red, present).  

  - **Household B’s Lexicographic Ordering:**  
    1. **Highest Priority:** Land-use regime (U > M > R).  
    2. **Next Priority:** Workshop status (present > absent).  
    3. **Lowest Priority:** Door color (blue > red).  
    Thus, B’s full ranking:  
    U regimes > M regimes > R regimes → Within U: present > absent, blue > red  
    Within M: present > absent, blue > red  
    Within R: present > absent, blue > red.  
    **Simplified Ranking:**  
    - (U, blue, present) > (U, blue, absent) > (U, red, present) > (U, red, absent) >  
    (M, blue, present) > (M, blue, absent) > (M, red, present) > (M, red, absent) >  
    (R, blue, present) > (R, blue, absent) > (R, red, present) > (R, red, absent).  

  #### Board’s Charter  
  1. **Minimal Liberalism:**  
     - Household A is decisive over any pair of outcomes differing **only in A’s door color** (e.g., (R, red, present) vs. (R, blue, present)).  
     - Household B is decisive over any pair differing **only in B’s workshop status** (e.g., (R, blue, present) vs. (R, blue, absent)).  
  2. **Pareto Principle:** If both households prefer outcome X to Y, the board must rank X above Y.  

  #### Prompt  
  (a) **Formal Derivation (10 points):**  
  Demonstrate how minimal liberalism and the Pareto principle generate a cyclical social ordering or an empty choice set. Use the three outcomes below:  
  - **X = (R, red, present)**  
  - **Y = (R, blue, present)**  
  - **Z = (R, blue, absent)**  
  Prove the cycle/contradiction step by step.  

  (b) **Structural Tension (10 points):**  
  Explain why this result is not a technical artifact but reflects a fundamental tension between individual liberty and collective decision-making. Connect this tension to **procedural neutrality** in urban governance, which requires public institutions to avoid privileging one conception of the good (e.g., aesthetic conformity vs. economic liberty) without justification.  

  (c) **Critical Evaluation (5 points):**  
  Evaluate one proposed resolution:  
  - **Option 1:** Restrict minimal liberalism to non-interacting domains (e.g., only allow rights that never affect others).  
  - **Option 2:** Replace Pareto with a "qualified unanimity rule" (unanimity required only when preferences do not invade another’s liberal domain).  
  **Do not merely define the resolution.** Show exactly how it alters the choice set for the board in this scenario (e.g., breaks the cycle, expands/restricts feasible options). Argue whether it resolves the tension while respecting liberty and efficiency.  

