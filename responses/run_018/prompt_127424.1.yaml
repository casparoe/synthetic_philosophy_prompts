   Exam prompt:

   The city zoning board must choose one of three possible social outcomes for the neighborhood. Each outcome is characterized by three features: the land-use regime (R, M, or U), the color of Household A's front door (red or blue), and whether Household B operates a home-based workshop (present or absent). The three outcomes under consideration are:

     Outcome X: ( land-use = R, A's door = red, B's workshop = present )
     Outcome Y: ( land-use = R, A's door = blue, B's workshop = present )
     Outcome Z: ( land-use = R, A's door = blue, B's workshop = absent )

   Household A has the following preferences over these outcomes: 
      Z > X > Y
   Household B has the following preferences over these outcomes:
      X > Y > Z

   The board is committed to:
     (1) The Pareto principle: if both households prefer one outcome to another, then the board should respect that and rank the first outcome above the second.
     (2) Minimal liberalism: 
           - Household A is decisive between any two outcomes that differ only in the color of A's door. Note that outcomes X and Y differ only in the door color (red in X, blue in Y). 
           - Household B is decisive between any two outcomes that andiffer only in the presence or absence of B's workshop. Note that outcomes Y and Z differ only in the workshop (present in Y, absent in Z). 

   The board must therefore have a social ranking of these outcomes that satisfies the above conditions.

   The essay prompt will be:

   Consider the following three social outcomes for the two-household neighborhood:

      X = (R, red, present)
