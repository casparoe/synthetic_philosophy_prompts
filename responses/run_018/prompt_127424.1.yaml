   Household B ranks the outcomes: X > Y > Z.

   The zoning board is committed to the Pareto principle (if both households prefer outcome A to outcome B, then the board's social ranking must also rank A above B) and to minimal liberalism, which in this context means:

      - Household A is decisive between any two outcomes that differ only in the color of its own front door. (Note that outcomes X and Y differ only in the door color.)
      - Household B is decisive between any two outcomes that differ only in the presence or absence of its home-based workshop. (Note that outcomes Y and Z differ only in the workshop status.)

   (a) (10 points) Prove that these commitments generate a cyclical social ranking. Your proof should demonstrate step by step how the conditions force a cycle among X, Y, and Z.

   (b) (10 points) Explain why this cycle is not merely a logical curiosity, but reveals a structural tension between domain-specific individual liberty and collective decision-making. Connect this tension to the principle of procedural neutrality in urban governance, which requires that the board's decision-making process avoid arbitrarily privileging one household's conception of the good over another's.

   (c) (5 points) Evaluate critically one proposed resolution to Sen's paradox. For example, one might restrict the application of minimal liberalism to personal domains that do not interact with others' interests. Alternatively, one might replace the Pareto principle with a qualified unanimity rule that requires not only agreement but also that the preference change does not invade another's recognized liberal domain. Choose one such resolution and show how it would change the board's available choice set in this specific case. Your evaluation should address whether the resolution successfully avoids the cycle while respecting the core values of liberalism and efficiency.

