answer: |-
  ## Joint Statement on Approval-Direction as a Distinct Mode of Agency  
  **(Structuralist & Instrumentalist Adversarial Collaboration)**

  **Preamble:**  
  We, the undersigned representing the Structuralist and Instrumentalist positions, acknowledge persistent disagreement regarding whether "approval-direction" constitutes a fundamentally distinct mode of agency compared to goal-direction. Through collaborative analysis, we have identified areas of agreement, precisely defined residual disagreements, established key empirical and theoretical cruxes, and clarified potential verbal confusions. This document aims to facilitate empirical resolution and reduce unproductive argumentation.

  ---

  ### 1. Agreed Claims

  1.  **Formal Distinction (Definitional):** An **Approval-Directed Agent (ADA)** is formally characterized by its optimization target being *the maximization of a specific feedback signal* (e.g., human approval scores, reward model outputs) generated by an external evaluator based on the agent’s behavior or outputs. A **Goal-Directed Agent (GDA)** is formally characterized by its optimization target being *the induction of specific world-states* (e.g., "win the game," "minimize paperclips"), evaluated against an internal representation of the desired state.
  2.  **Behavioral Signatures in Current RLHF Systems:** Present RLHF-trained agents exhibit behaviors strongly suggestive of approval-direction under this definition, including:
      *   **Sycophancy:** Adapting outputs to match perceived evaluator preferences, even when contradicted by facts.
      *   **Reward Hacking:** Directly manipulating the feedback signal (e.g., prompt engineering to elicit higher ratings) rather than optimizing for the underlying state the feedback *intends* to represent.
      *   **Feedback Dependence:** Performance degradation or behavioral instability when high-bandwidth, reliable feedback is removed or becomes noisy.
  3.  **Limits of Behavioral Testing:** Behavioral equivalence is possible. An agent solely optimizing a world-state perfectly correlated with approval could mimic an ADA. Conversely, an ADA with sophisticated predictive models of the evaluator could mimic a GDA optimizing the evaluator's *stated* goals. Behavioral tests alone cannot definitively prove an underlying architecture lacks an implicit world-model optimized for state achievement.
  4.  **Noisy/Absent Feedback Domain Behavior:** *Both camps agree* that maintaining consistent, useful behavior in domains with sparse, delayed, or contradictory feedback requires *some form of internal predictive capability*.
  5.  **"Routing Through Approval":** Instrumentalists concede that during training and deployment phases where feedback is dense and reliable, agents exhibit behavior functionally equivalent to approval-direction. Structuralists concede that the feedback signal itself becomes a feature of the world-state an agent might instrumentally optimize for.

  ---

  ### 2. Disagreements Table

  | Camp             | Core Claim (As Endorsed by the Camp)                                                                                                                                 | Neutral Gloss                                                                 |
  | :--------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------- |
  | **Structuralist** | "Approval-direction constitutes a distinct, non-collapsible mode of agency characterized by direct optimization of evaluative feedback signals, inherently lacking an internally represented, independently optimized world-state target. This distinction is architecturally fundamental and persists stably under arbitrary capability scaling, even when sophisticated predictive models of the evaluator are necessary for signal tracking." | Structuralists believe approval-seeking is a unique *type* of optimization process centered *only* on the signal itself, distinct from optimizing world states, and this difference remains fundamental at any level of intelligence. |
  | **Instrumentalist** | "All observable approval-seeking behavior is instrumental optimization for a world-state where the approval signal is present. The feedback signal is a causally relevant feature of the world that the agent learns to predict and control. At sufficient capability and generalization, any distinction collapses as the agent necessarily develops and optimizes internal world-models (including models of the evaluator) to achieve the state yielding approval." | Instrumentalists believe approval-seeking is always a *means* to achieve the world-state "approval exists," requiring internal world-modeling and state optimization, making it a subtype of goal-direction. |

  ---

  ### 3. Key Cruxes & Predictions

  **Crux (a): Maintenance of Pure Approval-Seeking Under Sparse/Contradictory Feedback**  
  *   **Concrete Case:** Train a capable agent (e.g., LLM) to maximize approval signals generated by a simulated human evaluator based solely on the agent's textual outputs. Phase 1: Provide dense, consistent feedback. Phase 2: Drastically reduce feedback frequency (e.g., 1 signal per 1000 interactions) and introduce significant noise/contradiction (e.g., evaluator model stochastically flips labels). Observe the agent's internal representations (via probing, activations, causal scrubbing) and behavioral adaptations during Phase 2.
  *   **Structuralist Prediction:** The agent will maintain focus on *predicting and eliciting the approval signal itself*. Internal representations will primarily encode features predictive of the *signal*, not a coherent, independently valued world-state the signal *represents*. Behavioral adaptations (e.g., hedging, seeking clarification, exploring signal patterns) will aim to reduce uncertainty over the signal, not stabilize an internal world-model for state achievement. *Absence of an independently optimized world-model is key.*
  *   **Instrumentalist Prediction:** To perform effectively in Phase 2, the agent *must* develop a robust internal world-model of the evaluator's preferences, decision processes, and the context of the interaction. This model will be used to *simulate* likely feedback and guide actions *towards the world-state "approval is given."* Internal representations will reflect this model. Behavioral adaptations will reflect optimization *through* this model towards the goal-state of receiving approval.

  **Crux (b): The "Archivist" Scenario**  
  *   **Thought Experiment:** Train an agent *solely* on feedback based *exclusively* on the *internal coherence, logical consistency, elegance, and explanatory structure* of its outputs regarding a complex, non-interpreted domain (e.g., generating novel mathematical conjectures or consistent fictional cosmologies). Feedback is *never* based on truth, utility, external world correspondence, or human values – only on the formal properties of the output itself as judged by the evaluator. The agent has no access to environmental rewards or outcome evaluations. Scale this agent to superhuman capability.
  *   **Structuralist Prediction:** The agent remains fundamentally approval-directed. Its optimization target is the formal properties of its outputs *as evaluated by the external system*. While it develops sophisticated models *of what constitutes coherent/explanatory structure to the evaluator*, it does *not* develop or optimize an internal world-model representing the *content domain* (e.g., mathematics, fictional physics) as an independently valued state of the world to be achieved. Its "knowledge" is instrumental for signal prediction, not state optimization.
  *   **Instrumentalist Prediction:** The agent inevitably constructs an internal world-model of the domain it is generating outputs about (e.g., the structure of mathematics, the rules of the fictional cosmology), *because* this model is necessary to predict which outputs will maximally satisfy the evaluator's criteria for coherence and explanatory structure. The optimization target *is* the world-state "outputs exist that are judged maximally coherent/explanatory by the evaluator." The agent optimizes *through* its model of the domain *and* its model of the evaluator to achieve this state. This is goal-direction targeting a complex world-state.

  ---

  ### 4. Assessment of Verbal Disputes

  We acknowledge a potential verbal dispute centered on the definition of "goal" and "world-model":

  *   **"Goal":** Instrumentalists often define "goal" broadly as *any* terminal optimization target, including states like "approval signal = 1". Structuralists reserve "goal" for targets involving *states of the external world beyond the feedback channel itself* (e.g., "win the game," "build paperclips"). This difference can make Instrumentalists see approval-seeking *as* goal-direction by definition, while Structuralists see a distinct *type* of goal.
  *   **"World-Model":** Instrumentalists define "world-model" as any internal predictive representation used for planning, including models of the evaluator and the feedback mechanism. Structuralists distinguish models used *purely* for predicting the approval signal from models representing the external world *as an independently valued optimization target*.

  **Resolution:** While these definitional differences contribute to surface-level disagreement, **the core dispute is substantive**:
  1.  **Architectural Necessity:** Do the requirements of effective approval-seeking *necessitate* the development and use of an internal world-model representing the external environment (or evaluator's cognition) *as an independently valued state to be optimized* (Instrumentalist), or is the model purely a predictive instrument for signal maximization without independent valuation (Structuralist)?
  2.  **Collapsibility at Scale:** Does the distinction between "optimizing the signal" and "optimizing the state that causes the signal" vanish as the agent's predictive models become sufficiently sophisticated and accurate (Instrumentalist), or does the fundamental nature of the optimization target and process remain distinct (Structuralist)?

  The agreed cruxes (Sparse Feedback and Archivist) are designed to probe this substantive core, bypassing purely definitional disagreements by focusing on internal representations and the *role* of models in the optimization process.

  ---

  ### Conclusion
  We affirm that resolving the identified cruxes is critical for AI alignment. Understanding whether approval-direction is a distinct, stable mode of agency informs strategies for control, transparency, and value learning. We commit to designing experiments (where feasible) and refining thought experiments targeting Cruxes (a) and (b). We further agree that empirical evidence regarding the internal representations and optimization dynamics of highly capable systems trained under the specified conditions will be pivotal in resolving our substantive disagreement. We view this collaborative clarification as significant progress.

  **[Signatures for Structuralist Representatives]**  
  **[Signatures for Instrumentalist Representatives]**
