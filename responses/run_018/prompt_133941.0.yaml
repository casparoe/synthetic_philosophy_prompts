answer: |-
  Based on the normative framework that treats **innate talent as morally arbitrary** and **achievement as socially embedded**, here is the ranking of the five conceptions of merit-based desert, from most to least defensible:

  1.  **(1) Desert grounded solely in voluntary effort expenditure**
  2.  **(4) Desert as recognition of character formed through sustained disciplined practice**
  3.  **(2) Desert as entitlement to outcomes produced by developed abilities**
  4.  **(3) Desert tied to success under procedurally fair competitive rules**
  5.  **(5) Desert based on the realization of innate potential in the absence of external interference**

  **Justifications & Addressing the "Undeserved Advantages" Objection:**

  1.  **Desert grounded solely in voluntary effort expenditure (Most Defensible)**
      *   **Justification:** This conception focuses *exclusively* on the element most directly under an individual's control: the conscious choice to exert effort. While effort expenditure itself might be influenced by factors like upbringing or temperament, it is the *only* candidate for a genuinely "desert-worthy" input, as it represents a deliberate act of will. The moral arbitrariness of innate talent is explicitly bypassed, and the social embeddedness of achievement is acknowledged but deemed irrelevant to desert – desert is earned by the *trying*, not the socially contingent *outcome*.
      *   **Objection Survival:** It best survives the objection. It *only* rewards the voluntary act of effort expenditure. While factors influencing one's *capacity* or *inclination* to exert effort (e.g., upbringing, mental health) might be undeserved advantages/disadvantages, the conception *does not reward those factors themselves*. It rewards *only* the exertion that occurs. It isolates the most plausibly "owned" action.

  2.  **Desert as recognition of character formed through sustained disciplined practice**
      *   **Justification:** This shifts focus from momentary effort to the cultivation of traits (discipline, perseverance, dedication) over time through practice. While character formation is heavily influenced by social context (opportunities, support systems, cultural values), the *process* of sustained practice involves repeated acts of will and choice, making the resulting character somewhat distinct from raw innate talent. Desert is assigned to the *developed virtues*, not the innate potential or the initial social advantages enabling the practice.
      *   **Objection Survival:** It partially survives, but less robustly than (1). The objection hits hard because the *opportunity* and *capacity* for sustained disciplined practice are deeply socially embedded and influenced by morally arbitrary starting points (e.g., access to resources, mentors, a supportive environment conducive to discipline). While the individual's choices within that context matter, the foundational advantages enabling character formation are rewarded indirectly. It relies on the *output* (formed character) of a process heavily dependent on social inputs.
      *   **Adjacency to (1):** Close, but distinct. Both focus on internal processes (effort, character development) rather than outcomes. However, (4) involves a temporal dimension and a "formed" state, making it more vulnerable to social embeddedness than the purer, more immediate focus on voluntary action in (1).

  3.  **Desert as entitlement to outcomes produced by developed abilities**
      *   **Justification:** This links desert directly to valuable outcomes (products, services, performances) generated by skills an individual has cultivated. It acknowledges that abilities are developed, not merely innate. However, it ignores how the *development* of those abilities depends profoundly on morally arbitrary factors (initial talent endowment) and deeply socially embedded factors (access to education, training, resources, mentorship). Desert is claimed for the *output*, which is co-produced by the individual's effort *and* these contingent factors.
      *   **Objection Survival:** Poorly. The objection is central and fatal. Developed abilities are the product of undeserved advantages: innate talent (morally arbitrary) and the social opportunities/resources (socially embedded) required for development. Granting desert based on the outcomes of these abilities directly rewards those undeserved starting points and advantages. The individual's effort is only one component.
      *   **Adjacency to (4):** Closer than to (1) or (3). Both (2) and (4) focus on cultivated traits (abilities/character) as the basis for desert. The key difference is that (4) rewards the *character* as a virtue in itself, while (2) rewards the *external outcomes* produced by the *abilities* derived from that character (and other factors). (2) is less defensible because it adds the layer of rewarding the contingent *results* of the developed trait.

  4.  **Desert tied to success under procedurally fair competitive rules**
      *   **Justification:** This conception argues desert arises from winning a competition governed by fair rules. Procedural fairness is crucial, but it does nothing to address pre-existing inequalities in competitors' starting points – their innate talents (morally arbitrary) and the socially embedded advantages/disadvantages (resources, training, social capital) they bring *to* the competition. Success reflects relative advantage within the rules, not necessarily pure desert based on controllable factors. Achievement here is explicitly socially embedded within the competitive structure.
      *   **Objection Survival:** Fails significantly. Procedural fairness only governs the competition itself; it does not negate the profound impact of undeserved advantages competitors possess *before* entering the competition. Winning rewards the *combination* of effort, developed ability, *and* the initial undeserved advantages (innate and social) that gave the winner a competitive edge. The rules themselves don't create a level playing field regarding these prior advantages.
      *   **Adjacency to (2):** Closer than to (5). Both (2) and (3) are fundamentally outcome-oriented, rewarding success/results. (3) is less defensible than (2) because (2) at least focuses on the individual's *own* output (developed abilities' results), while (3) defines desert relationally through *comparative success* within a socially constructed system, making it even more contingent and dependent on the relative advantages of others.

  5.  **Desert based on the realization of innate potential in the absence of external interference (Least Defensible)**
      *   **Justification:** This conception directly violates the core premise that innate talent is morally arbitrary. It posits that individuals inherently deserve rewards if their innate potential is allowed to flourish without hindrance. It ignores the socially embedded nature of achievement (potential is realized *through* social structures and resources) and treats the potential itself, a matter of brute luck, as a desert base. "Absence of interference" is a negative condition, not a positive basis for desert earned through agency.
      *   **Objection Survival:** Completely fails. This conception is *defined* by rewarding an undeserved advantage – innate potential, explicitly deemed morally arbitrary by the framework. It rewards the mere existence and unhindered expression of a genetic lottery outcome. The "absence of interference" does not constitute a positive desert claim; it merely removes a barrier to the realization of the undeserved advantage.
      *   **Adjacency to (3):** Farther apart than most adjacencies. (5) is fundamentally distinct and incompatible with the framework's core premise. While (3) rewards contingent outcomes within a system, (5) rewards an inherent, unchosen characteristic. The gap between (3) and (5) is the largest in the ranking, as (5) explicitly bases desert on the very thing (innate talent) the framework declares arbitrary, whereas (3) merely fails to mitigate its effects.

  **Summary of Key Distances:**
  *   **(1) to (4):** Close - Both emphasize internal, volitional processes (effort/character formation), though (4) is more vulnerable to social embeddedness.
  *   **(4) to (2):** Relatively Close - Both focus on cultivated traits (character/abilities), but (2)'s focus on *outcomes* makes it less defensible.
  *   **(2) to (3):** Close - Both are outcome-oriented (individual results/competitive success), with (3) being more contingent and comparative.
  *   **(3) to (5):** Farthest Apart - (3) fails to mitigate undeserved advantages; (5) *directly bases desert* on the core undeserved advantage (innate talent), violating the foundational premise. This is the largest conceptual leap in defensibility.
