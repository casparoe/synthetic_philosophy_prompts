  ## The Ledger Closes at Sgeir Mhòr
  (a pantoum for Ailsa MacKinnon)

  The crate held what the cards had never said.
  She logged the nine black ravens, oilskins, stones,
  Each gull, each fencepost, thoughts inside her head.
  Forty years spent counting, skin and bones.

  She logged the nine black ravens, oilskins, stones,
  One grey pebble in a crate's dark hold.
  Forty years spent counting, skin and bones,
  The ledger finished now, the story told.

  One grey pebble in a crate's dark hold:
  Not raven-black, not gull-white, simply grey.
  The ledger finished now, the story told,
  But language turns, and turns another way.

  Not raven-black, not gull-white, simply grey.
  It speaks for ravens black against the sky,
  But language turns, and turns another way:
  It speaks for ravens white with equal cry.

  It speaks for ravens black against the sky,
  It speaks for white wings flashing in the light.
  With equal cry, beneath the watching eye
  Of nine black birds, the grey stone shifts its weight.

  It speaks for white wings flashing in the light...
  Her hand rests cold upon the splintered wood.
  Of nine black birds, the grey stone shifts its weight.
  **The crate held what the cards had never said.**

  ---

  **Brainstorm & Logic Check:**  
  The core repeating lines needed to drive the double confirmation are:  
  1. **"One grey pebble in a crate's dark hold"**: This anchors the concrete object and its hidden state. Its repetition moves it from mystery to revealed evidence.  
  2. **"Not raven-black, not gull-white, simply grey"**: This explicitly states the pebble's properties crucial for the logic. Repeated, it emphasizes its dual evidentiary role.  
  3. **"It speaks for..."**: This phrase, repeated and varied ("speaks for ravens black... speaks for white wings..."), directly enacts the double confirmation. The shift from "ravens black" to "white wings" shows the same pebble supporting opposing claims.  

  **Logic Sanity-Check:** Confirmed. A non-black non-raven (grey pebble) supports "All ravens are black" (logically equivalent to "All non-black things are non-ravens"). Simultaneously, as a non-*white* non-raven, it supports "All ravens are white" ("All non-white things are non-ravens"). On Sgeir Mhòr, with the ledger *complete*, this single instance *is* significant evidence for both universal claims, precisely because it's the *only* unrecorded object. The finite island makes the "nudge" decisive.

  **Revision Notes:**  
  1.  Tightened stress count per line (aiming for ~4, e.g., "The **crate** held **what** the **cards** had **nev**-er **said**").  
  2.  Adjusted phrasing for clearer logic flow within pantoum constraints (e.g., "But language turns, and turns another way" introduces the equivalence shift).  
  3.  Ensured concrete imagery throughout (oilskins, fenceposts, gulls, splintered wood, paraffin lamp implied by "dark hold").  
  4.  Made the double confirmation explicit in Stanza 4 & 5 without jargon ("speaks for ravens black... speaks for white wings... with equal cry").  
  5.  Ended with her hand on the crate, the pebble's weight felt, the opening line returning – leaving the emotion (confirmation/relief) ambiguous.

  The poem uses the pantoum's echoing structure to mirror how the *same pebble* ("One grey pebble... simply grey") becomes evidence for *contradictory claims* ("speaks for ravens black... speaks for white wings") due to the logical equivalence, its significance amplified by the closed ledger on the finite island ("the grey stone shifts its weight"). The concrete world (crate, ravens, pebble, shingle) carries the abstract weight.
