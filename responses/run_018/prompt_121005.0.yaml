  Hmm, social media is brilliant here because:
  - Algorithmic mediation makes the "holding fixed" vs. "intervening" distinction visceral—unlike physical cases where background conditions feel obvious
  - Platform mechanics naturally model preemption (e.g., suppression vs. organic decay)
  - Omissions (not acting) are central to the case, which trips up counterfactual theories

  Biggest pitfalls to defuse:
  1. DT folks might think "intervention = counterfactual conditioning" since both involve hypotheticals. Need to sharply separate "what if?" (counterfactual) from "what if I forced?" (intervention). 
  2. They might assume backward causation works the same in both frameworks. But interventionism handles it via modularity, while counterfactuals lean on similarity metrics (which we’re omitting).

  For the arc, I’ll build:
  1. Start with intuitive causation using the scenario → surface pre-theoretic assumptions
  2. Formalize counterfactuals (simple version: "if not A, then not C?")
  3. Reveal its flaws with omissions/preemption in this case
  4. Introduce interventionism as a fix, contrasting "holding fixed" vs. "wiggling"
  5. Use the same scenario to show divergence
  6. Understanding check: "Would suppressing the suppressor change the outcome?"

  Tech to explicitly set aside:
  - Structural equations (too formal)
  - Possible-world similarity metrics (muddies the water when comparing theories)
  We can work with arrows and "hold fixed" language—it’s sufficient for this contrast.

  The understanding check must force them to apply both theories to omissions. E.g., "If we remove the algorithm entirely, does that cause spread?" Counterfactual says yes (flawed); interventionist says no if other suppressors exist.
answer: |-
  Here’s a structured 90-minute teaching plan using your social media algorithm case, tailored for decision-theory-literate but formally untrained participants. The arc prioritises conceptual clarity over formalism, leveraging the scenario’s strengths to expose gaps between counterfactual and interventionist theories.

  ---

  ### **Teaching Arc: Order, Rationale & Misconception Management**
  **Core Scenario:**  
  *Platform Alpha’s algorithm detects a post (P) gaining traction. It suppresses P (e.g., reduces visibility) before P reaches a critical mass of users. P fails to go viral. Did the algorithm cause P’s failure?*

  #### **Phase 1: Groundwork (20 mins)**
  1. **Set Up the Dependency Structure**  
     - **Visualise the System:** Sketch a causal diagram:  
       *User engagement → Algorithm assesses virality → Algorithm suppresses/delays P → P’s spread falters.*  
       Add confounding factors: *"Organic decay" (P loses relevance naturally), "Competitor post" (steals attention).*  
     - **Why Start Here?** Participants need the *structure* before evaluating causation. Diagrams make dependencies explicit without equations.  
     - **Pre-empt DT Misconceptions:** Decision theorists often assume all variables are "agent-controllable". Clarify: *"Here, ‘algorithm suppression’ isn’t a choice by us—it’s a system component we observe."*  

  #### **Phase 2: Introduce Counterfactual Theory (25 mins)**  
  2. **Counterfactuals Simplified:**  
     - **Definition:** "A causes B iff, if A hadn’t happened, B wouldn’t have happened."  
     - **Apply to Scenario:**  
       *"If the algorithm hadn’t suppressed P, would P have gone viral?"*  
       → Likely answer: *Yes* (if we assume no other suppressors). Thus, algorithm caused failure.  
     - **Expose Weaknesses via Scenario:**  
       - **Omissions:** Ask: *"What if the algorithm *failed* to suppress P, but ‘organic decay’ killed it anyway?"*  
         → Counterfactual: "No suppression" doesn’t guarantee virality (B still happens). Thus, algorithm *didn’t* cause failure? Feels wrong.  
       - **Preemption:** *"What if suppression preempted organic decay (which would’ve suppressed P later)?"*  
         → Counterfactual: Without suppression, decay would cause failure. So algorithm *isn’t a cause?* (Problematic).  
     - **Why This Scenario Excels:** Social systems have *multiple latent causes* (algorithm, decay, competitors). Physical cases (e.g., billiards) often lack this, masking omission/preemption issues.  

  #### **Phase 3: Introduce Interventionism (30 mins)**  
  3. **Interventionism as a Response:**  
     - **Core Idea:** "Causation requires imagining an *intervention*: forcibly changing A while holding other factors *fixed*."  
       Contrast with counterfactuals: *"Not ‘what if A was false?’, but ‘what if we *made* A false?’"*  
     - **Apply to Scenario:**  
       - Intervene on suppression: *"Force algorithm *not* to suppress P, while freezing organic decay/competitors at actual levels."*  
         → If P now spreads: algorithm caused failure.  
       - Handle omissions: *"Intervene to *make* algorithm suppress P (if it didn’t originally). Does failure follow?"*  
         → If yes, algorithm is causal.  
     - **Defuse DT Misconceptions:**  
       - **"Intervention ≈ Counterfactual?"** No: Interventions *hold fixed* non-descendants (e.g., organic decay). Counterfactuals allow backtracking (e.g., "no suppression might mean earlier decay").  
       - **Causal Loops:** Decision theorists may expect symmetric handling. **Clarify:** Interventionism *blocks loops* by fixing exogenous variables. Counterfactuals use similarity metrics (set aside) that *allow* loops.  

  #### **Phase 4: Check for Understanding (15 mins)**  
  4. **Diagnostic Question:**  
     *"Organic decay alone would have suppressed P 1 hour later. Algorithm suppresses it earlier.  
     (a) Per counterfactuals: If no algorithm suppression, would P still fail? (Yes → algorithm not a cause).  
     (b) Per interventionism: If we forcibly prevent algorithm suppression (holding decay fixed), would P spread? (Yes → algorithm is a cause).  
     Why do they disagree, and which handles preemption better?"*  
     → **Key:** Forces recognition that counterfactuals *overlook preempting causes* by not freezing background conditions. Interventionism isolates the algorithm’s role.  

  ---

  ### **Technical Machinery to Explicitly Set Aside**  
  1. **Structural Equations:**  
     - *Why omit?* Your group lacks formal logic; equations add syntax overhead. Instead, use verbal causal diagrams ("arrows"). The argument holds by comparing *modes of reasoning* (counterfactual vs. interventionist).  
  2. **Possible-World Similarity Metrics:**  
     - *Why omit?* Crucial for full counterfactual semantics but not needed to spot its flaws here. Saying *"we ignore how ‘similarity’ is defined"* suffices to contrast interventionism’s "hold fixed" rule.  

  ---

  ### **Why This Sequence Works**  
  - **Dependency Flow:** Structures → counterfactuals → their flaws → interventionism as solution. Must grasp omissions/preemption *before* seeing interventionism fix them.  
  - **Scenario Strengths:**  
    - Social/media cases involve *unobservable latent causes* (decay, bias), forcing theories to diverge.  
    - Algorithms exemplify *modular intervention* (toggling code vs. rewiring history).  
  - **DT Misconceptions Addressed:**  
    - "Intervention=Counterfactual" defused in Phase 3 by contrasting *freezing* vs. *backtracking*.  
    - Causal loops contextualised via *exogenous fixing* (interventionism) vs. *similarity* (counterfactuals; noted as ignored).  

  This arc ensures participants *see* the gap via applied reasoning—not just terminology—while respecting their DT background without requiring new formalism.
