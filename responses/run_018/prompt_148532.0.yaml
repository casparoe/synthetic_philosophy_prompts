  1.  Given Black's perfectly symmetric universe eliminates spatial relations and quantum states, what concrete counterfactual dispositions could possibly distinguish the spheres, and wouldn't these dispositions themselves require some intrinsic or relational difference to ground them? If dispositions presuppose difference, doesn't this beg the question against Black?
