  Here is a disambiguation of the procreation asymmetry slogan, formatted as a numbered list of distinct theses. Each entry includes precise formulation, classification, support for practical conclusions, and required hidden premises. This table isolates conceptual components often conflated in the slogan.

  ### Disambiguation Table: The Procreation Asymmetry Slogan

  | # | Thesis Formulation (Precise Claim)                                                                 | Classification                             | Supports Practical Conclusion? | Hidden Premises & Critical Dependencies                                                                                                                                 |
  |---|-----------------------------------------------------------------------------------------------------|--------------------------------------------|--------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | **1** | **Harm-Avoidance Obligation:** If an act *causes* a being to exist in a state of net suffering (welfare < neutral baseline), that act wrongs that being. | Substantive & Defensible (widely accepted) | Yes (for impermissibility)    | Requires: (a) Definition of "harm" as creation of net negative welfare; (b) Suffering is person-affecting harm; (c) No countervailing greater harm prevented. |
  | **2** | **No Duty to Create Benefit:** There is **no obligation** to bring a being into existence *solely* because it *would* experience net happiness (welfare > neutral baseline). | Substantive & Defensible (common in deontology) | Yes (for permissibility)      | Requires: (a) Rejection of "duty of beneficence" toward merely possible beings; (b) Non-existence is not a state of deprivation for a specific individual. |
  | **3** | **Metaphysical Asymmetry (Existence Comparability):** Existence with net suffering is **worse for** a person P than P's non-existence. Existence with net happiness is **better for** P than P's non-existence. However, only the *harm* grounds a *wrong*. | Substantive but Likely False | Partially (needs 1 & 2) | Requires: (a) Non-existence can be "worse/better for" a specific P (rejected by many); (b) Asymmetry in normative force (harm generates duties, benefit does not). |
  | **4** | **Axiological Asymmetry:** Suffering is *bad* in a way that happiness is *not symmetrically good*. The badness of creating a sufferer is absolute; the goodness of creating a happy person is optional/non-obligatory. | Substantive & Contested | Yes (if accepted) | Requires: (a) Asymmetric value theory (e.g., negative utilitarianism); (b) Person-affecting framework OR impersonal badness of suffering. |
  | **5** | **Deontic Asymmetry (Harming vs. Not Benefiting):** We have **stronger duties to avoid harming** existing or future beings than duties to provide benefits to possible beings. Failing to create a happy person is merely *not benefiting*, not harming. | Substantive & Defensible (in many frameworks) | Yes | Requires: (a) Distinction between harming and failing to benefit is morally significant; (b) "Harm" requires an identifiable victim who is worsened (rejects 3). |
  | **6** | **Non-Identity "Solution":** Since a person who is never created *does not exist*, there is **no subject** to whom a wrong is done by non-creation. Creating a sufferer wrongs the *actual* subject who exists and is harmed. | Substantive & Defensible (Parfit-influenced) | Yes | Requires: (a) Non-existence ≠ deprivation for a subject; (b) Wrongs require an identifiable victim; (c) Identity-dependence of obligations. |
  | **7** | **Tautological Restatement:** "Causing harm is wrong; declining to create a benefit is not wrong *if no one is deprived*." | Trivial | Only superficially | Requires: (a) Definitional collapse of "harm" and "wrong"; (b) Acceptance of "no deprivation" in non-creation (contested in **3**). |
  | **8** | **Impossibility of Comparative Harm (Non-Identity):** It is **impossible** for non-creation to be "worse for" a *particular* possible person P because P cannot be identified independently of the act of creation. | Substantive & Defensible | Yes (for asymmetry) | Requires: (a) Kripkean necessity of origin; (b) Rejects transworld identity for non-actual beings; (c) "Worse for" requires a fixed subject across scenarios. |

  ### Key Distinctions & Analysis
  1. **Axiological vs. Deontic Asymmetry**:
     - **Axiological** (Thesis 4): Depends on inherent moral difference between positive/negative welfare. Survives without "deprivation" if badness is impersonal.
     - **Deontic** (Thesis 5): Focuses on duty strength, not value symmetry. Compatible with rejecting "deprivation" via Thesis 8.

  2. **Dependence on "Worse For" (Deprivation)**:
     - Theses **1, 2, 5, 6, 8** **do not require** accepting that non-existence is "worse for" an individual. They use alternative grounds (harm causation, duty types, non-identity).
     - Thesis **3 explicitly requires** it and is vulnerable to metaphysical objections (e.g., how can "nothing" be worse for a non-existent entity?).

  3. **Support for Practical Conclusion**:
     - Only combinations (e.g., **1+2+5**) robustly support the full asymmetry. Theses **1 & 6** alone support impermissibility of creating sufferers; **2 & 5** support permissibility of not creating happy people.
     - Thesis **4** supports asymmetry but is ethically controversial. Thesis **3** is metaphysically dubious and not necessary.

  4. **Critical Hidden Premises**:
     - **Person-Affecting Constraint**: Most theses assume obligations require identifiable victims (rejected by total utilitarians).
     - **Baseline Definition**: What constitutes "suffering" or "happiness"? (e.g., is neutral existence possible?).
     - **Non-Identity Thesis**: Theses 6 & 8 rely on the claim that different procreative acts create numerically distinct individuals.

  ### Conclusion for Circulation
  This slogan compresses at least 8 distinct claims. Its plausibility depends on rejecting metaphysical comparability of existence/non-existence (Thesis 3) and combining deontic asymmetry (Thesis 5) with harm obligations (Thesis 1) and non-identity (Thesis 6/8). Axiological asymmetry (Thesis 4) is optional and contentious. No single thesis suffices; the practical conclusion requires careful synthesis **and** rejection of "deprivation" claims. Invoking the slogan as decisive masks these critical dependencies.
