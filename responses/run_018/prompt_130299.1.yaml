  Okay, the user is exploring whether video game characters can be objects of moral concern. They've provided several examples from games like The Sims, XCOM, Minecraft, etc., and noticed patterns in their intuitive judgments. They want a coherent framework to explain these intuitions and have specific questions about resurrection mechanics and procedural characters.

  First, I need to break down their examples. In The Sims, killing a named Sim feels cruel, but deleting a save file with anonymous Sims doesn't. In XCOM, losing a scripted squadmate feels worse than a generated soldier. Minecraft shows that context changes the morality of killing the same entity type. Mario's death feels mechanical, but in Dark Souls, it's betrayal. Persistent NPCs with memory make wiping the database akin to genocide.

  The user identifies factors like diegetic investment, narrative specificity, and persistence. They need a unified framework. The key concepts from philosophy here are moral patiency and projection. Characters become moral objects when players project personhood onto them based on traits like narrative depth, persistence, and emotional bonds.

  For the resurrection case, it's tricky. If resurrection is costly but possible, refusing might feel callous if the companion is narratively significant. But if it's just a resource, it's a strategic choice. The framework should consider the character's moral status and the cost's impact on the player's investment.

  Procedural characters can still be wronged, but the moral failure is different. It's about violating the player's own values or the game's implied ethics, rather than the character's inherent rights. For example, torturing a Sims character for fun reflects sadism in the player.

  The user's deeper need might be understanding their own moral intuitions in gaming, possibly to inform game design, ethical discussions, or personal reflection. They might also be grappling with how virtual actions relate to real-world morality. The framework should validate their intuitions while providing a structured analysis that addresses edge cases like resurrection and procedural characters.
answer: |-
  Your intuitions reveal a sophisticated grasp of how moral concern emerges in games, and you're right that a coherent principle underlies them. Your pattern points towards **"Attributed Moral Patiency" (AMP)**, a framework combining **projected personhood**, **narrative integration**, **persistent continuity**, and **player investment**. Here's how it captures your cases and answers your questions:

  **The AMP Framework:**

  1.  **Projected Personhood:** Does the character exhibit traits we associate with persons (consciousness, emotion, relationships, goals, suffering, narrative significance)? Player projection is key.
  2.  **Narrative Integration:** Is the character embedded in a story that grants them individuality, purpose, relationships, and stakes beyond mere gameplay function?
  3.  **Persistent Continuity:** Does the character exist as a continuous entity across time and gameplay loops, with some record of their past states or actions? This fosters a sense of "life history."
  4.  **Player Investment:** Has the player formed an affective bond or sense of responsibility through interaction, shared experiences, or narrative engagement?

  **Moral concern arises when these factors converge significantly.** The character transitions from a *game mechanic* or *disposable unit* to a *moral patient* within the player's constructed diegetic reality. Wronging them isn't just inefficient; it violates the player's projected ethical framework onto the game world.

  **Applying AMP to Your Cases:**

  *   **Sims 4:**
      *   *Named Sim Drowning:* High Projected Personhood (emotions, relationships, autonomy), Narrative Integration (named, has life, relationships), Persistent Continuity (across saves/sessions), Player Investment (you know *this* Sim). **Morally concerning (cruel).**
      *   *Deleting Save File:* Low Projected Personhood/Narrative Integration (anonymous, no specific identity), Low Persistent Continuity (wiped entirely), Low Player Investment (faceless group). **Not morally comparable (wasteful).**
  *   **XCOM 2:**
      *   *Procedural Soldier Loss:* Moderate Projected Personhood (name, traits, customization), Low Narrative Integration (no backstory/role), Moderate Persistent Continuity (campaign history), Moderate Player Investment (effort customizing/leveling). **Regrettable failure (loss of resource/effort).**
      *   *Narrative Squadmate Loss:* High Projected Personhood, High Narrative Integration (scripted role, relationships, dialogue), High Persistent Continuity (core story), High Player Investment (emotional bond). **Allowing harm (moral concern).**
  *   **Minecraft:**
      *   *Killing Villager for Emeralds:* Moderate Projected Personhood (sounds, trades, "village" structure), Low Narrative Integration, Moderate Persistent Continuity (named?), Low Player Investment (often seen as resource). **Feels wrong** (violates basic projection of harm onto trading entity).
      *   *Killing Zombie Villager to Cure:* Projected Personhood shifts – the "cure" frames the act as *beneficial intervention*, overriding the immediate harm. The goal justifies the act within the projected framework. **Feels right.**
  *   **Super Mario Bros. vs. Dark Souls:**
      *   *Mario Death:* Low Projected Personhood (pure avatar, no internal state), Low Narrative Integration (minimal story), No Persistent Continuity (resets instantly), Player Investment is in *winning*, not Mario's well-being. **Exploiting mechanic.**
      *   *Beloved Permadeath RPG Character:* High Projected Personhood (customization, progression implies growth), High Narrative Integration (player-driven story), High Persistent Continuity (permanent history), Very High Player Investment (time, effort, bond). **Betrayal (moral failure toward the entity you nurtured).**
  *   **Persistent World NPCs:**
      *   *Wiping Database:* Extreme Projected Personhood (memory implies history/identity), High Narrative Integration (implied lives), Extreme Persistent Continuity (core premise), High Player Investment (shared world history). **Genocide-like (destruction of persistent, seemingly sentient community).**
      *   *Resetting Single Instance:* Breaks Persistent Continuity. They effectively cease to be the "same" entity. **Not morally comparable.**

  **Answering Your Specific Questions:**

  1.  **Resurrection Mechanic & Refusal to Pay:**
      *   **AMP Verdict:** This hinges *entirely* on the character's AMP status *and* the nature/cost of the currency.
          *   **High AMP Companion:** If the companion has significant narrative weight, relationships, and history (e.g., a BioWare party member with deep personal quests), and resurrection is diegetically framed (e.g., expensive temple ritual, not just a menu button), then **refusing to pay feels morally callous, possibly even cruel.** You are *choosing* to let a valued, persistent "person" stay dead when you have the means to prevent it. The cost becomes a test of your *commitment* to that projected personhood.
          *   **Moderate/Low AMP Companion:** If the companion is less narratively integrated or more functionally replaceable, or if resurrection feels purely mechanical/gamey (e.g., cheap "phoenix down" with no narrative weight), then refusal is primarily **an inefficient allocation of resources.** The moral concern is minimal.
          *   **Key Factor - Cost:** A *prohibitively* high cost (requiring grinding or sacrificing core progress) can mitigate the callousness, framing it as a tragic necessity rather than simple neglect. A *trivial* cost for a high-AMP companion makes refusal clearly callous.

  2.  **Can Purely Procedural Characters Be Wronged?**
      *   **AMP Verdict:** Yes, but **the nature of the "wrong" is different and depends heavily on Projected Personhood and Player Investment.**
      *   *Direct Wronging (of the character):* This is harder. A purely procedural entity (e.g., a randomly generated Sim with no name/interactions, a basic XCOM rookie) lacks the Narrative Integration and Persistent Continuity for strong AMP. Harming them isn't *primarily* a wrong done *to them* as individuals.
      *   *Indirect Wronging & Player Failure:*
          *   **Violation of Player's Projected Ethics:** Even with low AMP, the player might project *some* baseline concern (e.g., "hurting things that look/sound sentient is bad"). Torturing Sims for fun, even anonymous ones, can feel wrong *because it reflects sadism in the player*.
          *   **Neglect of Duty/Care (if applicable):** If the game *frames* the player as responsible (e.g., commanding troops, managing a town), failing that duty through recklessness or malice towards procedural entities can feel like a moral failure *of the player role*, even if not a deep wrong to each specific entity.
          *   **Wanton Destruction:** Mass killing of low-AMP entities *can* feel like a wrong against the *system* or the *potential* for life/order, approaching vandalism or ecological harm within the game world. Wiping out a village of unnamed Minecraft villagers feels worse than deleting a save file.
      *   **Conclusion:** Purely procedural characters rarely achieve high AMP sufficient for *direct* moral patiency comparable to deeply narrative characters. However, actions towards them *can* still constitute moral failures related to the player's character (sadism, neglect of duty, wanton destruction) or violation of a minimally projected ethical framework onto the game world. Wronging them is less about *their* inherent rights and more about the *player's* actions and values within the context the game provides.

  **In essence:** Your moral intuitions track the degree to which you, as the player, project personhood, narrative significance, and persistent existence onto the game entity, combined with your own investment in them. This projection creates a "moral circle" within the game world. Actions that intentionally harm entities within that circle feel morally significant; actions outside it feel mechanical or wasteful. The resurrection dilemma highlights how AMP status *obligates* the player when feasible intervention exists. Procedural characters sit at the edge of this circle – capable of triggering ethical discomfort through player projection and context, but rarely attaining the full moral patiency of deeply integrated, persistent narrative entities.
