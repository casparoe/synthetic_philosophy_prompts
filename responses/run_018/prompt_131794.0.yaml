  - **Efficiency**: Uses symbol grounding as a springboard without rehashing it. "Unmoored," "sterile," and "friction of reality" reinforce the metaphor economically.  
  - **Ethical twist** lands as a natural extension—not decoration—by tying moral practice to professional credibility.  

