  **Commencement Address: The Grounding Problem & Your Next Step**  

  Graduates, you’ve mastered Harnad’s lesson: intelligence isn’t just manipulating symbols. True understanding requires sensory grounding—embodied experience. Without it, we’re like today’s LLMs: fluent but hollow, mistaking syntax for meaning.  

  Yet today, as you receive this degree, we must ask: Is this parchment itself an ungrounded symbol? Have you merely learned to *talk* about minds and machines, or have you truly *grasped* them? This ceremony isn’t an endpoint—it’s an invitation to *ground* your knowledge. Go test theory against the friction of reality.  

  But let me extend this unnervingly. If cognition needs grounding, what of *ethics*? We’ve taught you principles—autonomy, justice, transparency. Yet like ungrounded symbols, abstract ethics risks becoming a performative tool. We can wield it convincingly while lacking the "sensorimotor" link: the lived practice of moral choices in messy labs, datasets, and design rooms.  

  Did we give you that ethical grounding—or just the vocabulary? When bias hides in code, or an AI’s "alignment" clashes with human dignity, will you *feel* the tension? Or will you deploy principles like an LLM, fluently but unmoored? Your degree is sterile if your ethics aren’t muscle-memory.  

  Parents, this is why your children aren’t just "good at ChatGPT." They’ve studied the *gap* between hollow words and genuine insight. Now, their task is to close it—for intelligence, and for integrity.  

  **To our graduates**: Ground your symbols. Ground your morals. Let your work be embodied.  

