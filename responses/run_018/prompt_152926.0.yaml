prompt: |-
  Ok so I've been prepping for a seminar on Maxwell's demon and I'm genuinely confused about why people still argue about it. Szilard tied information to entropy in the 1920s, Landauer showed erasure costs kT ln 2, Bennett argued measurement can be done reversibly, and now there's all this quantum-information machinery. Yet the literature still splits between people saying the demon is fully exorcised and people saying the information-physics link is still mysterious. My working theory is that this isn't a physics disagreement at all but about what 'information' is doing in thier arguments — for one side it's an ontological category (literally part of the physical state), for the other it's just an epistemic bookkeeping tool. So they use the same eqautions but answer different questions: one about computation, one about what exists. But I could be wrong — maybe there's a hidden empirical dispute about correlation costs in nanoscale feedback loops that neither side has settled? I want an honest diagnosis, not a survey of the demon literature. Is the stall verbal, substantive, or are the sides talking past each other? And given your diagnosis, is there anything — a formal result about correlation entropy, a new experiment, a conceptual distinction — that could actually break the deadlock, or should we just accept it's stuck forever?
