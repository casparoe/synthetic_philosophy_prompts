  me and my mate just spent ages arguing about that old statue-and-clay problem, but with a twist — imagine a gallery installs a living sculpture made of mycelium that grows and dies back every season, and the curator insists it's literally the same artwork each spring even though every cell has been replaced. can you give an example of a conceptual issue this raises for material constituton? like, where the usual lump-vs-statue breakdown doesn't quite catch it because the material itself is in constant biological turnover and there's no stable clay-lump analogue? i want something that shows why the standard answers feel a bit flat here, dont they?
reasoning: |-
