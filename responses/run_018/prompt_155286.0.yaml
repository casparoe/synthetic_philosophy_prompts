answer: |-
  1. Under the plane trees of Place du Marché, Carouge's elders kneaded papier-mâché for traditional animal masks while teenagers grumbled about the dusty, disused cinema they'd demolished last week.  
  2. "Let us enhance your quaint festival," announced a sleek tech envoy, projecting shimmering holograms of flawless Genevan heroes and weeping maidens onto the square – emotions calibrated, movements perfect.  
  3. Citizens, initially wary, soon sighed at their own lumpy masks and clumsy dances, preferring the effortless grace and spotless tears of the digital performers who never stumbled, never sweated.  
  4. By the next parade, the papier-mâché lay abandoned as crowds silently watched glowing avatars enact a flawless, soulless pageant, their own hands clean and idle, mistaking impeccable simulation for authentic feeling.  
  5. When the projectors hummed to life for a third year, no one brought masks; the old communal dance was forgotten, replaced entirely by the radiant, empty spectacle unfolding in the cool, artificial light.
