answer: |-
  ### Science Newsletter Assertion Checklist  
  **Grounding Philosophy**: Hybrid model prioritizing *knowledge norms* (assert only what you know) for descriptive claims, but incorporating *calibrated confidence* for predictions via a custom predictive filter.  

  #### Procedure Flow  
  1. **EPISTEMIC STANDING CHECK (Writer Self-Assessment)**  
     - **Criteria**:  
       - Direct access to primary data/method?  
       - Domain expertise or consulted experts?  
       - Reviewed *full* evidence (not just abstract/preprint)?  
     - **Decision**:  
       - Fail → **KILL** (or rewrite with extreme hedging).  
       - Pass → Proceed.  
     - *Automatic?* **NO**—relies on writer honesty. Misfires if overconfident.  

  2. **CLAIM TYPE DETERMINATION**  
     - **Descriptive Claim** (e.g., "Study X found Y"):  
       - If epistemic standing passed → **ASSERT FLAT-OUT** (knowledge norm satisfied).  
     - **Predictive Claim** (e.g., "Event Z *will* happen"):  
       → Proceed to Predictive Filter.  
     - *Automatic?* **YES**—based on verb tense/context.  

  3. **PREDICTIVE FILTER (For Predictive Claims Only)**  
     - **a. Calibration Check**:  
       - Is the model/system historically calibrated? (e.g., when it outputs "90% confidence," it’s correct 90% of the time).  
       - *Automatic?* **PARTIALLY**—quantitative if calibration data exists; misfires if data is sparse.  
     - **b. Cost-of-Error Check**:  
       - What harm occurs if assertion is false? (e.g., public panic vs. minor inconvenience).  
       - *Automatic?* **NO**—**HAND TO EDITOR** (value-laden; requires contextual judgment).  
     - **c. Mode-Label Check**:  
       - Is the prediction explicitly labeled as probabilistic? (e.g., "forecast," "model projects," "X% chance").  
       - *Automatic?* **YES**—if text lacks labeling, **BLOCK** flat assertion.  

  4. **FINAL DECISION**  
     - Predictive claim passes all 3 filters → **ASSERT FLAT-OUT** (e.g., "Model forecasts hurricane landfall").  
     - Fails any filter → **HEDGE** (e.g., "*Likely* to hit Category 4") or **HAND TO EDITOR** for rewrite.  

  ---

  ### Case Applications  
  1. **"The storm will hit Category 4" (from calibrated model)**  
     - Step 1: Pass (writer verified model source).  
     - Step 2: Predictive → Filter.  
     - Step 3a: Pass (model calibrated at 85% for storm intensity).  
     - Step 3b: **HAND TO EDITOR**—high cost-of-error (evacuations). Editor may block flat assertion due to risk.  
     - Step 3c: Fail—claim lacks probabilistic label → **HEDGE** (e.g., "Models *indicate* Category 4 landfall").  

  2. **"This study *proves* cancer risk doubles" (abstract-only read)**  
     - Step 1: **FAIL**—writer lacks full context/methods → **KILL LINE**. Rewrite with hedge: "*Abstract claims* cancer risk doubles; full study pending review."  

  3. **Well-Calibrated Forecast Blocked but Worth Publishing**  
     - **Example**: "AI will replace 50% of jobs by 2030" (calibrated model, 80% confidence).  
     - Step 3a: Pass (model calibrated).  
     - Step 3b: **HAND TO EDITOR**—editor blocks flat assertion (high societal cost if wrong).  
     - Step 3c: Pass if labeled as forecast.  
     - **Outcome**: Checklist blocks flat assertion (due to cost), but publishes with **HEDGE**: "*Models project* 50% job automation by 2030."  

  ---

  ### What the Procedure **Can’t Do**  
  - Handle **emergent phenomena** with no calibration history (e.g., unprecedented events).  
  - Resolve **conflicting norms** (e.g., truth vs. urgency in breaking science).  
  - Replace **domain expertise**—e.g., nuanced field-specific standards for "proof."  
  - **Biggest Blindspot**:  
    > It cannot quantify *model drift*—when past calibration fails in rapidly evolving systems (e.g., climate or AI trends), creating false confidence.  

  \answer{The procedure’s biggest blind spot is its inability to detect when historical calibration data becomes obsolete due to systemic shifts, risking overconfident assertions in volatile domains.}
