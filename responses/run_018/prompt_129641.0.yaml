   - Knowledge norm: You should assert that p only if you know that p.
   - Truth norm: You should assert that p only if p is true.
   - Belief norm: You should assert that p only if you believe that p.

   However, for predictive claims, we face the issue that we cannot "know" the future. So we design a three-part filter for predictive assertibility.

   The procedure:
   1. Epistemic standing of the writer (automatic check for internal states, but requires self-awareness and honesty)
   2. Claim type: descriptive (about current or past facts) vs. predictive (about the future)
   3. If predictive, run the predictive filter:
      a. Calibration check: Is the model or method behind the prediction well-calibrated? (e.g., for a weather model, does it have a track record of being right 70% of the time when it says 70%?)
      b. Cost-of-error check: What is the cost if the assertion turns out false? (high cost: e.g., life-or-death; low cost: e.g., minor inconvenience) -> This is a value judgment, so hand off to human (editor).
      c. Mode-label check: How is the prediction labeled? (e.g., as a "forecast", "projection", "prediction", or is it presented as a fact?) -> This is about clarity of communication and avoiding misleading.

   4. Then decide: 
      - If the claim passes all checks for a flat assertion, assert it.
      - If it fails some but we still want to communicate, we might hedge (e.g., "likely", "according to model X").
