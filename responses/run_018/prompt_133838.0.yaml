  2.  Coarse-graining, essential for deriving thermodynamic properties like temperature *as emergent*, requires a prior, contingent selection of *which specific subset* of these degrees of freedom constitutes the macrostate description; this selection is dictated by pragmatic, observational interests, not the microphysics itself.
  3.  Therefore, the macrostate structure (the partition of phase space) necessary for concepts like temperature is not reducible *to* the microphysics alone; it is an additional, observer-relative structure imposed *on* the microphysics to make thermodynamic descriptions possible.
  4.  Consequently, deriving temperature from mechanics isn't a pure deduction; it implicitly relies on introducing the very macroscopic framework (the chosen coarse-graining scheme) that reduction aims to explain solely from the lower level, revealing a structural incompleteness in the reductionist program.
