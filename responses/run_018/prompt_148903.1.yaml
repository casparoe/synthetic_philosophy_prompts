prompt: |-
  You serve as the senior ethics auditor for a regional health system that deploys predictive algorithms to assign individual patients to risk-reference classes for treatment prioritization. Because the philosophical reference-class problem undermines any automatic assignment—there is no unique correct class for an individual, and substituting one class for another can alter the predicted probability without altering the underlying medical fact—your office needs a reusable audit procedure. Write a formal, step-by-step decision procedure that a non-philosopher reviewer can execute in approximately thirty minutes per case to determine whether an algorithm’s assigned reference class is defensible, illegitimate, or genuinely indeterminate. The procedure must ask ordered questions about: (i) the statistical robustness and sample size of the proposed class; (ii) the causal relevance of each class-defining property to the specific outcome being predicted; (iii) counterfactual stability of membership—specifically, whether the patient would remain in the class under the intervention whose risk is being predicted, and whether using a counterfactual property creates circular reasoning; and (iv) whether intersecting sub-classes generate non-transitive membership relations that cause the prediction to collapse. For each step, specify what counts as a sufficient answer, where the procedure terminates with an unambiguous approval or rejection, and where it must escalate to a human values-committee because the issue is irreducibly normative rather than factual. Include a concise set of test conditions—data-level and sentence-level checks—the reviewer can apply without specialized statistical software. Then run the procedure on three cases: (a) a 58-year-old patient assigned to a cardiovascular-risk class defined partly by a biomarker that also functions as a proxy for socioeconomic status, where the procedure yields an approval that the clinical team will strongly resist on equity grounds; (b) a patient whose class membership depends on a counterfactual biomarker level—what the level would be after a preliminary treatment—creating circularity in the risk prediction for that very treatment; and (c) a patient who belongs to two statistically valid reference classes that yield contradictory risk rankings, leaving the procedure unable to resolve the conflict. Conclude by stating precisely what the procedure is powerless to settle—particularly regarding distributive fairness across classes and the weighting of competing valid classes—and flag every step where judgment is unavoidable despite the formal structure.
reasoning: |-
  We are creating a formal, step-by-step decision procedure for auditing the defensibility of a predictive algorithm's assigned reference class for a patient. The procedure is designed to be executed by a non-philosopher reviewer in about 30 minutes per case. The procedure will have four main sections: (i) statistical robustness and sample size, (ii) causal relevance, (iii) counterfactual stability and circularity, and (iv) non-transitive membership from intersecting sub-classes.

  The possible outcomes for each case are:
  - Defensible (approval)
  - Illegitimate (rejection)
  - Genuinely indeterminate (requires escalation to a human values committee)

  We will write the procedure as a series of ordered questions. For each question, we specify what counts as a sufficient answer and when the procedure terminates or escalates.

  Then, we will run the procedure on three test cases.

  ---

  **Formal Audit Procedure for Reference Class Assignment**

  **Step 1: Statistical Robustness and Sample Size**
     - **Question 1.1:** Is the sample size used to estimate the outcome probability for the assigned reference class sufficient? 
       - *Check:* The class must have at least 30 events (occurrences of the outcome) and at least 100 total observations. (This is a rule-of-thumb; adjust if the outcome is rare by requiring the event rate to be at least 1% of the class size, but not less than 30 events.)
       - *Sufficient for approval:* If the class meets the sample size criteria, proceed to Step 1.2. Otherwise, mark as illegitimate and terminate (rejection).
     - **Question 1.2:** Is the statistical estimate of the outcome probability robust? 
       - *Check:* The confidence interval (without needing exact computation) can be assessed by: 
          - If the class has at least 100 events and 500 total observations, then robustness is assumed. 
          - Otherwise, check if the 95% confidence interval (approximated by ±2 standard errors) is less than 10% of the point estimate (relative margin of error). If the reviewer cannot compute, they can use: if the number of events is at least 50 and the number of non-events is at least 50, then robustness is acceptable. 
       - *Sufficient for approval:* If robust, proceed to Step 2. Otherwise, mark as illegitimate and terminate (rejection).

  **Step 2: Causal Relevance**
     - **Question 2.1:** For each property defining the reference class, is there established biomedical knowledge (e.g., from clinical guidelines, meta-analyses, or mechanistic studies) that the property is causally relevant to the outcome?
       - *Check:* The reviewer should consult a predefined list of causal relationships endorsed by the health system's medical leadership (e.g., smoking causes lung cancer, high LDL causes heart disease). If the property is not on the list, the reviewer may check one reputable source (e.g., UpToDate, Cochrane review) for a causal link. 
       - *Sufficient for approval:* If every property is causally relevant, proceed to Step 3. 
       - *Terminate with rejection (illegitimate):** If any property is known to be non-causal (e.g., a pure proxy with no causal pathway) or if there is strong evidence against causality (e.g., a property that is a consequence of the outcome), then reject. 
       - *Escalate:* If the causal relevance of at least one property is disputed or unknown, then mark as indeterminate and escalate to the values committee.

  **Step 3: Counterfactual Stability and Circularity**
     - **Question 3.1:** Would the patient remain in the assigned reference class under the intervention for which the risk is being predicted? 
       - *Check:* Consider the intervention. For example, if the risk is for a surgery and the class includes a biomarker that the surgery would alter, then the patient might not remain in the class after the surgery. 
          - If the class properties are fixed (e.g., genetic markers, past events) then the answer is yes. 
          - If the class properties can change due to the intervention, then the answer is no.
       - *Sufficient for approval:* If yes, proceed to Step 3.2. If no, then the class is unstable and we must check for circularity in the next question.
     - **Question 3.2:** Does the reference class definition use a counterfactual property (i.e., a property that would hold after the intervention) to predict the risk of that same intervention? 
       - *Check:* Look for properties that are defined as "post-intervention" states. For example, the class is defined by a biomarker level that is measured after a preliminary treatment, and that same preliminary treatment is part of the intervention for which we are predicting risk. 
       - *Terminate with rejection (illegitimate):** If yes, because it creates circularity: the risk prediction depends on a property that is a consequence of the intervention. 
       - *Sufficient for approval:* If no, then the class is acceptable on this dimension and proceed to Step 4. 
       - *Escalate:* If the answer to 3.1 is no and the answer to 3.2 is no (i.e., the class is unstable but not circular), then the class is not stable under the intervention. This might be acceptable if the prediction is for the immediate risk (before the intervention changes the properties). However, this requires normative judgment about the temporal aspect. Therefore, escalate to the values committee.

  **Step 4: Non-Transitive Membership from Intersecting Sub-Classes**
     - **Question 4.1:** Are there intersecting sub-classes (defined by additional properties) that the patient also belongs to, and which yield a different risk prediction for the same outcome?
       - *Check:* The reviewer should check if the health system's algorithm or any standard medical practice recognizes sub-classes that are refinements of the assigned class. If the patient falls into two or more such sub-classes (e.g., the assigned class is "diabetic" but the patient is also "diabetic with renal impairment") and the risk estimates for these sub-classes differ by more than 10% in absolute risk, then we have a conflict.
       - *Terminate with approval (defensible):** If there are no such conflicting sub-classes, or if the risk estimates for the sub-classes are within 10% absolute risk, then the class is defensible and the audit is approved.
       - *Escalate:* If there is a conflict (i.e., the patient belongs to two sub-classes with risk estimates that differ by more than 10% absolute risk and the algorithm did not use the more refined class) and it is unclear which class should be used, then mark as indeterminate and escalate to the values committee.

  **Summary of Termination/Escalation Points:**
  - Step 1: Failure of sample size or robustness leads to rejection.
  - Step 2: If any class-defining property lacks causal relevance, reject. If causal relevance is disputed, escalate.
  - Step 3: If circularity (using a counterfactual property for the same intervention) is found, reject. If the class is unstable (patient would not remain in the class under the intervention) but without circularity, escalate.
  - Step 4: If there are conflicting sub-classes with substantially different risk estimates, escalate.

  ---

  **Test Conditions (Data-Level and Sentence-Level Checks):**
  - **Sample size (Step 1):** 
    - Data-level: The reviewer is given the number of events and total observations for the class. They check: events >= 30 and total >= 100? Then for robustness: events >= 50 and non-events >= 50? (If not, then if events >=100 and total>=500, then robust; otherwise, they might need to compute a confidence interval, but we provide a table for relative margin of error: if events are E and non-events are N, then the margin of error is 1.96 * sqrt((E/N)*(1/(E+N))). If this value is less than 0.05 (5% absolute) or less than 10% of the risk estimate (if risk estimate is p, then 1.96*sqrt(p(1-p)/n) < 0.1*p), then robust. But to avoid computation, we stick to the event count rules above.)
    - Sentence-level: If the data is not available, the reviewer must reject (illegitimate) because the class lacks empirical support.

  - **Causal relevance (Step 2):**
    - Data-level: The reviewer is provided with a list of properties and a lookup table of causal relationships (pre-approved). They check each property against the table.
    - Sentence-level: If a property is not in the table, the reviewer checks one sentence from a reputable source (provided in the audit package) that states the causal link (or lack thereof). If the source says "X is a risk factor for Y" without claiming causality, then it's not sufficient. The source must use causal language (e.g., "causes", "increases the risk of", in a causal context).

  - **Counterfactual stability and circularity (Step 3):**
    - Data-level: The reviewer is given the definition of the class and the intervention. They check if any class-defining property is labeled as "post-intervention" or if the intervention is known to alter that property (from a provided list of property-intervention interactions).
    - Sentence-level: The reviewer asks: "Would [property] change if we did [intervention]?" If the answer is yes and the property is used in the class definition, then the class is unstable. Then, they check: "Is the property defined as the state after the intervention?" If yes, then circular.

  - **Non-transitive membership (Step 4):**
    - Data-level: The reviewer is given a list of sub-classes that the patient belongs to (if any) and their risk estimates. They check if any two sub-classes have risk estimates that differ by more than 10% absolute risk (e.g., 5% vs 16% is 11% difference -> conflict).
    - Sentence-level: The reviewer checks if the algorithm's documentation states that the assigned class is the most refined one. If not, and there is a conflict, then escalate.

  ---

  **Running the Procedure on Test Cases**

  **Case (a):** A 58-year-old patient assigned to a cardiovascular-risk class defined partly by a biomarker that also functions as a proxy for socioeconomic status.

  - Step 1: Assume the class has sufficient sample size and robust statistics (approved).
  - Step 2: Check causal relevance. The biomarker (e.g., C-reactive protein, CRP) is causally relevant? Established biomedical knowledge: CRP is a marker of inflammation and inflammation plays a causal role in cardiovascular disease. So causal relevance is established. However, note that it is also a proxy for low SES (because low SES is associated with higher CRP). But the procedure only checks for causal relevance of the biomarker itself. Since CRP is causally relevant, Step 2 is approved.
  - Step 3: The biomarker is a current state (fixed at the time of prediction) and the intervention (say, statin therapy) might lower CRP but we are predicting risk before intervention. So the patient remains in the class at the time of prediction. Also, the class is not defined by a counterfactual property. So approved.
  - Step 4: Assume no conflicting sub-classes.

  Result: Defensible (approval). However, the clinical team may resist on equity grounds because the biomarker is a proxy for SES and may lead to under-prioritization of low-SES patients. But the audit procedure does not consider equity in resource allocation (only the defensibility of the class). The procedure is powerless to address equity concerns.

  **Case (b):** A patient whose class membership depends on a counterfactual biomarker level (what the level would be after a preliminary treatment) for the risk prediction of that same treatment.

  - Step 1: Assume the class has sufficient sample size and robust statistics (approved).
  - Step 2: The biomarker (say, post-treatment cholesterol level) is causally relevant to the outcome (e.g., cardiovascular event). However, note that it is the level after treatment. But causality: high cholesterol causes cardiovascular events, so the property is causally relevant. Step 2 approved.
  - Step 3: 
    - 3.1: The class is defined by the biomarker level *after* the preliminary treatment. The intervention (the same preliminary treatment) would change the biomarker. But note: we are assigning the class based on what the level *would be* after the treatment. So the patient would be in the class only after the treatment? This is circular because we are using the effect of the treatment to predict the risk of the treatment? 
    - 3.2: The class definition uses a counterfactual property (biomarker after treatment) to predict the risk of that same treatment. This is circular: the risk prediction for the treatment uses a property that is a result of the treatment. Therefore, we terminate with rejection (illegitimate).

  Result: Illegitimate (rejection).

  **Case (c):** A patient who belongs to two statistically valid reference classes that yield contradictory risk rankings.

  - Step 1: Both classes have sufficient sample size and robust statistics (approved for both).
  - Step 2: Both classes have causally relevant properties (approved).
  - Step 3: Both classes are stable and non-circular (approved).
  - Step 4: The patient belongs to two classes (say, Class A: risk estimate 8%, Class B: risk estimate 20%). The absolute difference is 12% (>10%). The algorithm used Class A to assign a low risk, but the patient also belongs to Class B (say, because of an additional risk factor). The algorithm did not use a refined class that accounts for both. Therefore, we have a conflict. The procedure cannot resolve which class should be used. 

  Result: Escalate to the values committee (genuinely indeterminate).

  ---

  **Conclusion: What the Procedure Cannot Settle**

  The procedure is powerless to settle:
  1. **Distributive fairness across classes:** The procedure does not assess whether the use of a particular reference class leads to equitable resource allocation. For example, if a class systematically disadvantages a social group, the procedure only checks the class's statistical and causal properties, not fairness.
  2. **Weighting of competing valid classes:** In case (c), when two classes are both statistically and causally valid but yield conflicting predictions, the procedure cannot decide which one to use. This requires a normative decision about which class is more relevant or how to aggregate them.
  3. **Normative judgments in borderline cases:** Despite the formal structure, judgment is unavoidable at several steps:
     - Step 2: Deciding on causal relevance when the evidence is mixed or emerging.
     - Step 3: Deciding on the temporal aspect of stability (if the class is unstable but the prediction is for immediate risk) requires judgment.
     - Step 4: Deciding the threshold for conflict (we used 10% absolute risk) is arbitrary and might require adjustment.

  The procedure flags these steps for escalation when the issue is irreducibly normative.
answer: |-
  ### Formal Audit Procedure for Reference Class Defensibility

  **Objective**: Determine if an algorithm's assigned reference class for a patient is **defensible** (statistically and causally sound), **illegitimate** (fatally flawed), or **genuinely indeterminate** (requires human judgment).  
  **Time Constraint**: ≈30 minutes per case.  
  **Inputs**: Patient data, reference class definition, outcome being predicted, intervention (if applicable), and class statistics.  
  **Outputs**: Defensible/Illegitimate/Indeterminate verdict.  

  ---

  #### **Step 1: Statistical Robustness & Sample Size**  
  **Question 1.1**: *Does the reference class have ≥100 observations and ≥20 outcome events?*  
  - **Check**: Use summary statistics (e.g., class size = 500, outcome events = 25 → passes).  
  - **Sufficient answer**: Yes → Proceed to 1.2.  
  - **Terminate with rejection**: No → **Illegitimate** (insufficient data).  

  **Question 1.2**: *Is the risk estimate stable across subsamples?*  
  - **Check**: Split class into 2 random halves (using pre-calculated variance). If risk estimates differ by ≤5% absolute risk (e.g., 10% vs. 10.4% → stable), proceed.  
  - **Sufficient answer**: Yes → Proceed to Step 2.  
  - **Terminate with rejection**: No → **Illegitimate** (statistical instability).  

  ---

  #### **Step 2: Causal Relevance**  
  **Question 2.1**: *Is each class-defining property causally linked to the outcome via biomedical evidence?*  
  - **Check**: For each property, consult a pre-approved causal knowledge base (e.g., WHO reports, clinical guidelines). Example: "Hypertension → stroke" = causal; "ZIP code → stroke" = non-causal proxy.  
  - **Sufficient answer**: All properties causal → Proceed to Step 3.  
  - **Terminate with rejection**: ≥1 property non-causal → **Illegitimate** (spurious correlation).  
  - **Escalate**: Disputed causality (e.g., novel biomarker) → **Indeterminate** (requires values committee).  

  ---

  #### **Step 3: Counterfactual Stability & Circularity**  
  **Question 3.1**: *Would the patient remain in the class under the intervention?*  
  - **Check**: If intervention alters a class property (e.g., statins reduce cholesterol, but class includes cholesterol level), then no. Fixed properties (e.g., genetics) = yes.  
  - **Sufficient answer**: Yes → Proceed to 3.2.  
  - **Escalate**: No → **Indeterminate** (temporal mismatch; requires committee).  

  **Question 3.2**: *Does the class use a counterfactual property (post-intervention state) to predict risk for that intervention?*  
  - **Check**: Example: Class defined by "post-surgery biomarker X" to predict surgery risk.  
  - **Terminate with rejection**: Yes → **Illegitimate** (circular reasoning).  
  - **Sufficient answer**: No → Proceed to Step 4.  

  ---

  #### **Step 4: Non-Transitive Membership from Intersecting Classes**  
  **Question 4.1**: *Does the patient belong to valid subclasses with conflicting risk estimates?*  
  - **Check**: Identify overlapping classes (e.g., "diabetics" and "non-smokers") with risk estimates differing by >10% absolute risk.  
  - **Sufficient answer**: No conflict → **Defensible**.  
  - **Escalate**: Conflict → **Indeterminate** (no statistical resolution).  

  ---

  ### **Test Conditions for Non-Experts**  
  **Data-Level Checks**:  
  - Sample size: Verify event counts ≥20 and class size ≥100 from summary tables.  
  - Stability: Compare risk estimates from two pre-calculated random splits (allow ≤5% difference).  
  - Causal links: Use dropdown menu of pre-vetted properties (e.g., "Smoking: causal for lung cancer").  
  - Conflicts: Check if patient falls into classes with risk estimates in the system differing by >10%.  

  **Sentence-Level Checks**:  
  - Causality: "Does [property] directly influence [outcome] in medical literature?" (Yes/No/Unclear).  
  - Counterfactual: "Is [property] measured *after* the intervention?" (Yes → circular).  
  - Conflict: "Does [subclass A] predict low risk and [subclass B] predict high risk?" (Yes → conflict).  

  ---

  ### **Procedure Applied to Test Cases**  

  #### **Case (a): Biomarker as SES Proxy (Approved but Contested)**  
  - **Step 1**: Class size = 10,000, events = 200 → Passes.  
  - **Step 2**: Biomarker (e.g., CRP) causally linked to cardiovascular outcomes per guidelines → Passes.  
  - **Step 3**: Biomarker is pre-treatment → Stable. No circularity.  
  - **Step 4**: No conflicting subclasses → **Defensible**.  
  - **Outcome**: Approved. *Equity concerns (SES proxy) are outside scope—escalate to committee post-audit.*  

  #### **Case (b): Counterfactual Biomarker (Illegitimate)**  
  - **Step 1**: Class size = 8,000, events = 150 → Passes.  
  - **Step 2**: Biomarker causally relevant → Passes.  
  - **Step 3**: Class defined by "post-treatment biomarker level" for the same treatment → Circular.  
  - **Terminate at 3.2**: **Illegitimate** (self-referential prediction).  

  #### **Case (c): Contradictory Classes (Indeterminate)**  
  - **Step 1**: Both classes (e.g., "Age 50–60" and "Diabetic") have valid stats.  
  - **Step 2**: All properties causal.  
  - **Step 3**: No stability/circularity issues.  
  - **Step 4**: "Age 50–60" predicts 5% risk; "Diabetic" predicts 20% risk → Conflict >10%.  
  - **Escalate**: **Indeterminate** (no statistical basis to choose).  

  ---

  ### **Limitations and Unavoidable Judgments**  
  **What the Procedure Cannot Settle**:  
  1. **Distributive fairness**: Cannot adjudicate between classes that are statistically valid but exacerbate inequities (e.g., SES proxies).  
  2. **Weighting competing classes**: When multiple defensible classes exist (Case c), prioritization requires ethical trade-offs.  
  3. **Ambiguous causality**: Emerging science (e.g., genetic markers) forces judgment calls.  

  **Steps Requiring Judgment Despite Formal Structure**:  
  - **Step 2**: Deciding "causal relevance" for borderline properties (e.g., biomarkers with weak evidence).  
  - **Step 3**: Judging "stability under intervention" if property change is probabilistic.  
  - **Step 4**: Setting the conflict threshold (10% is arbitrary; may need adjustment).  

  **Escalation Triggers**:  
  - Normative conflicts (equity, rights) → Values committee.  
  - Indeterminate statistical/causal edge cases → Committee + data scientists.  

  **Final Note**: This procedure resolves *epistemic* flaws (statistics/causality) but defers *ethical* conflicts to humans. Its power lies in filtering clear abuses, not prescribing fairness.
