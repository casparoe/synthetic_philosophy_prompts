  ### Defense of Ordering:
  1. **#1 is foundational** because asymbolia's entire mystery hinges on whether pain's "badness" is affective, cognitive, or both. If badness requires cognition (e.g., *knowing* damage matters), your character might still logically register threats without urgency—making her condition less about sensory failure and more about disrupted meaning-making. This question's resolution informs all others.

  2. **#2 builds on #1's answer** but focuses on behavior. If motivation requires affect (#1's "badness"), your character's lack of avoidance is inevitable. But if cognition alone can drive action, she might develop compensatory survival strategies—transforming her from passive victim to analytical strategist. This is secondary because it depends on #1's model of pain's structure.

  3. **#3 extends both** but is least upstream: Suffering's definition depends entirely on how #1 defines pain's badness and #2 explains harm-response. It matters narratively for exploring emotional stakes but doesn't alter the core mechanics of asymbolia. Prioritize this last to avoid overcomplicating the character's baseline reality.

  ### Strategic Advice: 
  Focus **70% of mental energy on #1**. It's the linchpin: If pain's "badness" is purely affective, your character is freed from suffering's core mechanism. If cognitive, her struggle becomes tragic intellectual awareness without visceral fear. This distinction shapes every scene where she's injured. The other questions derive their weight from this foundation—#2 dictates her actions (plot), #3 her emotional arc (theme), but neither changes the fundamental rules established by #1. Use thought experiments and interviews with chronic pain patients (not lab work) to stress-test each model.
