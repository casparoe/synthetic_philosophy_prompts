answer: |-
  ### **In-Class Game: "The Grid of Reasons"**  
  *Designed to explore Dennett's distinction between "leeway" (ability to do otherwise) and "elbow room" (freedom to act on reasons) in a deterministic system.*

  **Total Time:** 90 minutes  
  **Participants:** 12 graduate students (split into 4 groups of 3).  
  **Goal:** Experience how determinism eliminates *leeway* but preserves *elbow room*.  
  **Materials per Group:**  
  - 5×5 grid map (paper)  
  - Token (e.g., coin, button)  
  - Hidden Rules sheet (for facilitator only)  
  - Role cards (Navigator, Observer, Recorder)  
  - Score tracker (paper)  

  ---

  ### **Game Setup**  
  *(10 minutes total: 5 min intro + 5 min group setup)*  
  1. **Introduction (5 min)**:  
     - "Today, we’re playing a game about choices and goals. Each group will guide a token across a grid to reach self-selected goals. Score points for success, lose points for mistakes. Roles: **Navigator** (moves token), **Observer** (watches patterns), **Recorder** (tracks moves/scores)."  
     - *Do NOT mention determinism, rules, or Dennett yet.*  

  2. **Group Setup (5 min)**:  
     - Divide into 4 groups. Assign roles randomly.  
     - Hand out materials: grid, token, score tracker.  
     - **Grid Overview**:  
       - Start: ★ at (1,1)  
       - Goals: A (1,5), B (5,1), C (5,5)  
       - Navigator picks a goal at the start (e.g., "We’re aiming for A").  
     - **Scoring**:  
       - Reach chosen goal: **+5 points**  
       - Break hidden rule: **-2 points** (penalized retroactively)  

  ---

  ### **Phase 1: "Blind Navigation"**  
  *(20 minutes)*  
  - **Rules**:  
    - Navigator decides each move (↑, ↓, ←, →).  
    - Observer watches for patterns but stays silent.  
    - Recorder logs moves and secretly deducts points when rules are broken (using facilitator’s hidden rules).  
  - **Hidden Deterministic Rules** (facilitator checks all groups):  
    1. First move must be → or ↓.  
    2. After →, next move cannot be ←.  
    3. After ↓, next move cannot be ↑.  
    4. After two same-direction moves, next must be perpendicular (e.g., →→ → ↑ or ↓).  
    5. Token cannot exit the grid.  
  - **Key**: Rules funnel paths based on prior moves (e.g., starting at (1,1): →→ forces ↓, then →→ forces ↓, funneling toward B or C). Groups *think* they have leeway but are constrained.  

  ---

  ### **Mid-Game Reveal**  
  *(15 minutes)*  
  - Stop groups. Announce: "There are hidden rules constraining your moves. From now on, you’ll know them."  
  - Hand out **Rule Sheets** to all groups. New rules:  
    - Observer enforces rules (e.g., "You can’t move ← after →").  
    - Navigator can change goals.  
    - Breaking rules now: **-2 points** + invalid move (must re-choose).  
  - **Scoring Adjustments**:  
    - Recorder retroactively applies penalties for Phase 1 rule breaks.  
    - Groups see how paths were predetermined (e.g., "You couldn’t reach A from your path").  

  ---

  ### **Phase 2: "Informed Choices"**  
  *(20 minutes)*  
  - **Rules**:  
    - Play resumes with rules visible.  
    - Groups try to maximize points (reach goals without breaking rules).  
  - **Predicted Behaviors**:  
    - Some Navigators insist moves are "their choice" (elbow room: "I picked → to avoid penalties!").  
    - Others disengage ("Why bother? It’s rigged")—highlighting loss of *leeway*.  
  - **Facilitator Tips**:  
    - If groups laugh/break character, note it for debrief (natural reaction to "discovery").  
    - End Phase 2 when all groups reach a goal or time expires.  

  ---

  ### **Debrief**  
  *(20 minutes)*  
  1. **Discovery Moment (5 min)**:  
     - Ask: *"What changed after the reveal? How did your feelings about ‘choice’ shift?"*  
     - **Map to Dennett**:  
       - **Phase 1**: Illusion of *leeway* (couldn’t truly "do otherwise"), but *elbow room* existed (acted on reasons to reach goals).  
       - **Phase 2**: *Leeway* gone (rules constrained options), but *elbow room* intact (choices still "theirs" based on reasons).  

  2. **Predictable Reactions (5 min)**:  
     - *"Who defended moves as ‘genuinely yours’? Who checked out? Why?"*  
     - Highlight: Laughter/breaking character = natural response to confronting determinism.  

  3. **Dennett’s View (10 min)**:  
     - Name Dennett: "He argues determinism kills *leeway* but not *elbow room*—and elbow room is what matters for responsibility."  
     - **Gap in the Game**:  
       - The game *can’t* show **why elbow room is worth wanting**.  
       - **Verbal Bridge**: "Dennett’s evolutionary story: Elbow room helps agents navigate complex worlds. Even in a deterministic universe, acting on reasons promotes survival—that’s why we ‘want’ it."  

  ---

  ### **Timeline Summary**  
  | Segment          | Time  | Activity                                                                 |
  |------------------|-------|--------------------------------------------------------------------------|
  | **Intro**        | 0-10  | Explain game, form groups, assign roles.                                |
  | **Phase 1**      | 10-30 | Groups play blindly. Recorder secretly deducts points for rule breaks.  |
  | **Reveal**       | 30-45 | Announce rules, distribute sheets, adjust scores.                       |
  | **Phase 2**      | 45-65 | Groups play with known rules. Observer enforces constraints.            |
  | **Debrief**      | 65-85 | Discuss experiences, introduce Dennett, bridge evolutionary gap.       |
  | **Buffer**       | 85-90 | Wrap-up, Q&A.                                                           |

  ---

  ### **Facilitator Notes**  
  - **No Tech Needed**: Grids and tokens are physical; rules fit on one sheet.  
  - **Troubleshooting**:  
    - If groups stall, nudge: "Pick a new goal to test the rules."  
    - If frustration arises: "That tension is part of the point—let’s discuss later."  
  - **Key Insight**: Players will *feel* the loss of leeway but cling to elbow room—making Dennett’s distinction visceral.  
  - **Final Tip**: Use the debrief to contrast "freedom to do otherwise" (leeway) vs. "freedom to act on reasons" (elbow room). Emphasize: "What we *really* want isn’t metaphysical leeway—it’s elbow room."
