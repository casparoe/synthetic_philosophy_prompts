prompt: |-
  I am preparing materials for an advanced seminar on the normative structure of consent, with particular attention to deception, coercion, and competence in clinical and institutional settings. During our discussions, participants repeatedly invoke the maxim 'silence is not consent' to settle disputes about whether a patient, research subject, or party to an agreement who remained passive during an explanation or procedure had thereby authorised what followed. The phrase is being made to do very different kinds of work: some use it to block inferences from mere non-objection; others to deny that prior explicit agreement can survive changed circumstances or withdrawal; and still others to claim that any absence of vocal affirmation automatically invalidates authority, even when a normative power to license has already been exercised. I want to bring analytical clarity to the next session rather than letting the slogan substitute for argument.

  Could you lay out, as a precise menu, the distinct theses that 'silence is not consent' might actually be expressing? For each reading, please indicate whether it concerns an epistemic failure (the silent party lacked adequate understanding), a volitional failure (their will was not free), a performative failure (no valid speech act of authorisation occurred), or a normative-power failure (the authority to license was not properly transferred or has been revoked). Then say, for each thesis, whether it is trivial, defensible but substantive, or plainly false; and identify which of these readings actually supports the three specific moves being made in my seminar—namely, that non-objection never counts as authorisation, that prior explicit consent is irrevocable regardless of later silence, and that institutional or medical authority can never be presumed in the absence of vocal affirmation. Please present your answer in British English, without bibliographies, citations, or reading lists, and avoid attributing the phrase to any named author unless the attribution is verifiably certain.
reasoning: |-
  Okay, let me approach this systematically. The user is running an advanced seminar on consent norms and needs clarity on the phrase 'silence is not consent' that's being used in multiple ways. They've identified three distinct moves participants make with this phrase: rejecting non-objection as authorization, denying irrevocability of prior consent, and requiring constant vocal affirmation.

  Hmm, the core challenge here is disentangling a slogan that's doing too much philosophical work. I need to map out possible interpretations across four dimensions: epistemic (understanding), volitional (free will), performative (speech act validity), and normative-power (authority transfer/revocation). Each interpretation should then be evaluated for plausibility and linked to the seminar's specific disputes.

  First, I consider the strongest interpretation - that silence cannot constitute a valid consenting act. This seems performative since consent requires an affirmative act. It would support the first move about non-objection never counting, but doesn't address the other two. 

  For the irrevocability point, I'm thinking about normative-power failure - the idea that silence might indicate revoked authority. But this needs careful handling because prior explicit consent isn't automatically voided by silence; revocation typically requires positive action. The seminar's second move seems overstated here.

  The vocal affirmation requirement puzzles me. It appears to confuse competence (epistemic) with performative aspects. Competence can exist without constant verbalization, so this third move seems weak. Medical contexts often use implied consent for continuing treatment unless withdrawn.

  I should also flag the trivial reading where silence literally isn't the word "consent" - true but unhelpful. And the epistemic version where silence indicates misunderstanding, which is possible but not automatic.

  Throughout, I'll maintain British English as requested and avoid attributions since the phrase's origins are unclear. The evaluation must balance philosophical rigor with practical seminar utility, showing which moves hold water and which don't. The key is replacing slogan-slinging with precise conceptual tools.
answer: |-
  Here is a precise menu of the distinct theses that "silence is not consent" might express, categorised by failure type, evaluated for plausibility, and linked to the specific moves in your seminar:

  ### The Menu of Theses

  1.  **The Trivial Semantic Thesis:**
      *   **Thesis:** The utterance "I consent" or equivalent performative speech act did not occur; silence is literally not the word "consent".
      *   **Failure Type:** Performative (trivially).
      *   **Evaluation:** Trivially true, but philosophically and normatively uninteresting. It ignores implied consent, non-verbal consent, or consent established through prior acts.
      *   **Supports Seminar Moves?** None substantively. Might be misapplied to support Move 3 (no vocal affirmation = invalidation), but fails as it ignores non-verbal authorisation.

  2.  **The Strict Performative Thesis:**
      *   **Thesis:** Consent, as a normative power-transferring act, *requires* an affirmative, observable performative act (verbal or clear non-verbal). Mere absence of objection cannot *constitute* that act. Silence is the absence of such an act.
      *   **Failure Type:** Primarily Performative (no valid authorisation act occurred).
      *   **Evaluation:** Defensible and substantive in many contexts (e.g., initiating sexual contact, major medical interventions). Grounded in the idea that authorisation must be positively given, not merely not refused. However, it may be overly restrictive in established relationships or ongoing procedures where implied consent or prior explicit consent governs *unless* revoked.
      *   **Supports Seminar Moves?** Strongly supports **Move 1** (non-objection ≠ authorisation). Does not directly support Move 2 or 3.

  3.  **The Epistemic Presumption Thesis:**
      *   **Thesis:** Silence provides no positive evidence that the silent party understands the proposal, its implications, or their rights, and thus cannot reliably signal valid authorisation. It creates an epistemic gap.
      *   **Failure Type:** Primarily Epistemic (lack of adequate understanding presumed or risked).
      *   **Evaluation:** Defensible and substantive. Silence *can* indicate confusion, misunderstanding, or lack of engagement, undermining the competence requirement for valid consent. However, it is a presumption (sometimes rebuttable), not an absolute rule. Silence doesn't *prove* incompetence, but it fails to demonstrate competence.
      *   **Supports Seminar Moves?** Supports caution regarding *inferring* consent from silence, but doesn't directly mandate Move 1, 2, or 3 as absolute rules. Weakens inferences from non-objection but doesn't outright deny validity in all cases.

  4.  **The Volitional Presumption Thesis:**
      *   **Thesis:** Silence, especially in contexts of power imbalance (clinician/patient, institution/individual), may indicate coercion, undue influence, fear, or passivity, meaning the will behind the (assumed) authorisation is not sufficiently free. Silence fails to demonstrate voluntary agreement.
      *   **Failure Type:** Primarily Volitional (will not free or not adequately expressed).
      *   **Evaluation:** Defensible and substantive, particularly in hierarchical settings. Silence can mask underlying pressure or lack of genuine choice. However, like the epistemic thesis, it creates a presumption of risk, not an absolute bar; silence doesn't *equate* to coercion. Context is crucial.
      *   **Supports Seminar Moves?** Supports caution regarding *inferring* voluntary agreement from silence, particularly for Move 1 (non-objection ≠ authorisation). Does not directly support Move 2 or 3 as absolutes.

  5.  **The Normative-Power Revocation Thesis:**
      *   **Thesis:** Silence, especially after a prior explicit consent and in the face of changed circumstances or an ongoing procedure, should be interpreted as a revocation or lapse of the prior authorisation. The normative power has been withdrawn or has expired due to non-affirmation.
      *   **Failure Type:** Normative-Power Failure (authority revoked or lapsed).
      *   **Evaluation:** Defensible but highly context-dependent and not universally true. Requires strong justification for why silence *should* be interpreted as revocation/lapse rather than continuation (e.g., specific nature of the procedure, known risks, explicit prior agreement on how withdrawal is signalled). Often false as a general rule; revocation typically requires a positive act, while continuation often relies on prior consent unless revoked.
      *   **Supports Seminar Moves?** Directly supports **Move 2** (prior explicit consent does *not* survive changed circumstances/silence), but only on this specific, contestable interpretation of silence *as* revocation/lapse. Does not support Move 1 or 3.

  6.  **The Absolute Affirmation Thesis:**
      *   **Thesis:** Valid consent requires *continuous* or *repeated* explicit vocal affirmation at every stage. Silence, even after prior explicit consent and without changed circumstances, automatically invalidates authority. Institutional/medical authority can *never* be presumed; vocal "yes" is mandatory every time.
      *   **Failure Type:** Performative (no *ongoing* valid act) and/or Normative-Power (presumed authority invalid without constant affirmation).
      *   **Evaluation:** Plainly false as a general normative principle. It is impractical, undermines autonomy (by not allowing implied continuation based on prior consent), and ignores context. Valid consent can be ongoing and implied based on prior explicit agreement *unless* revoked. Constant interruption for vocal affirmation can be burdensome and disrespectful in established processes. Presumption of continuing authority is often valid and necessary.
      *   **Supports Seminar Moves?** Directly supports **Move 3** (institutional/medical authority never presumed without vocal affirmation) and, by extension, a radical version of Move 2 (prior consent never survives *any* silence). However, this thesis itself is unsustainable.

  ### Linking to Your Seminar Moves

  1.  **Move 1 (Non-objection never counts as authorisation):**
      *   **Supported by:** The **Strict Performative Thesis** (2) provides the strongest direct support. The **Epistemic Presumption Thesis** (3) and **Volitional Presumption Thesis** (4) provide strong *cautionary* support against *inferring* valid consent from non-objection, but do not make the absolute claim "never".
      *   **Not Supported by:** Trivial Semantic (1 - uninteresting), Normative-Power Revocation (5 - focuses on revocation, not initial authorisation), Absolute Affirmation (6 - overkill).

  2.  **Move 2 (Prior explicit consent is irrevocable regardless of later silence):**
      *   **Opposed by:** The **Normative-Power Revocation Thesis** (5) *explicitly* rejects this move, arguing silence *can* revoke or lapse consent. Other theses don't directly support irrevocability.
      *   **Supported by?** None of the plausible theses *support* irrevocability *regardless* of silence. The rebuttal to Move 2 comes from recognising that valid consent *can* be revoked (usually by a positive act, not necessarily silence), and silence *might*, in specific contexts, indicate revocation or create doubt requiring clarification (Theses 3, 4, 5). The Absolute Affirmation Thesis (6) absurdly makes consent vanish instantly with silence. The defensible position is that prior consent generally *does* survive silence *unless* revoked positively *or* specific circumstances make silence reasonably interpretable as revocation (rejecting both the absolute of Move 2 and the strong claim of Thesis 5).

  3.  **Move 3 (Institutional/medical authority can never be presumed in the absence of vocal affirmation):**
      *   **Supported by:** The **Absolute Affirmation Thesis** (6). This is the only thesis that mandates this.
      *   **Not Supported by:** All other theses. The Strict Performative (2) requires *an* affirmative act, not necessarily *vocal* or *repeated*. The Epistemic (3) and Volitional (4) theses create presumptions *against inferring* consent from silence but don't prohibit implied or presumed authority based on prior acts, context, or institutional role where justified. The Normative-Power Revocation (5) is about revocation, not initial presumption. The Trivial Semantic (1) is irrelevant. **This move relies solely on the plainly false Thesis 6.**

  ### Summary for Clarity

  *   "Silence is not consent" is most defensibly invoking the **Strict Performative Thesis** (rejecting non-objection as authorisation - Move 1) or the **Epistemic/Volitional Presumption Theses** (cautioning against inferring valid consent from silence).
  *   Using it to argue that prior consent is *revoked* by silence (**Move 2**) relies on the **Normative-Power Revocation Thesis**, which is context-dependent and often false (revocation usually requires positive action).
  *   Using it to demand constant vocal affirmation and deny *any* presumed authority (**Move 3**) relies solely on the **Absolute Affirmation Thesis**, which is plainly unsustainable.
  *   The slogan should be challenged to specify *which* failure (performative, epistemic, volitional, normative-power) and *why* silence is deemed insufficient or indicative in the specific context, moving beyond its use as an unexamined trump card.
