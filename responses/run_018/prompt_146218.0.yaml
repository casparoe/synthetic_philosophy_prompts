  ## Sestina for the Whig Historian's Desk

  In Norman fields, the serf tends bound to **manor**,
  His future scripted by the lord's decree.
  No charters speak the nascent **republic**,
  Though whispers stir like leaves in hidden groves.
  His sweat, the only fuel for any **factory**,
  His world constrained, no sprawling **network** known,
  His bloodline traced, no map within his **genome**,
  His harvest prayed for, fearing hostile **climate**.

  The pamphleteer, mid-rouge et noir **republic**,
  Denounces crowns that stand like ancient **manor**.
  His press, precursor to the **factory**,
  Spins threads of thought – a nascent **network** grows.
  He speaks of Rights, ignores the shifting **climate**,
  Sees lineage pure, not complex **genome**.
  His ink dreams progress, bold and schematic.

  Black smoke now coils above the **factory**,
  Where once stood oak and stone of feudal **manor**.
  The loom's harsh rhythm drowns the new **republic**'s
  Fine speeches. Progress charts its own **genome**,
  A brutal code etched deep in coal and steam.
  The workers huddle, forge their fragile **network**,
  Choked by the soot, the industrial **climate**.

  The glowing screen defines the vast **network**,
  Data streams flow where stood the **factory**.
  Our choices shaped by code, a hidden **genome**,
  Algorithms reign, the digital **manor**.
  We track the storms, the fragile global **climate**,
  Debate like citizens of some lost **republic**
  In forums vast, yet strangely antiseptic.

  The lab decodes the intricate **genome**,
  Seeking the cure, the key within our **climate**.
  A thread spun finer than the widest **network**,
  Blueprint unseen by lord in stone **manor**,
  Or dreamer in the hopeful **republic**,
  Or worker lost inside the grime-bound **factory**.

  The ice sheets groan beneath the changing **climate**,
  A legacy of furnace, forge, and **factory**,
  Of boundaries drawn from castle, keep, and **manor**,
  Of rights proclaimed within the fledgling **republic**,
  Of signals pulsed through the connective **network**,
  Of choices written in our shared **genome**.

  **(Envoi)**

  *See now! The app tracks carbon **climate**,*
  *The start-up scales like old **factory**,*
  *The feudal **manor** is a VC **network**,*
  *The voting app revives the **republic**,*
  *Your traits defined by purchased **genome** –*
  *All threads converge on Now, one bright constant line.*
