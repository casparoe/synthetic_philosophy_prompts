  Cantor's diagonal argument is trickier. The power set *must* be treated as a definite totality for the proof to work—you assume all subsets exist simultaneously to construct the counterexample subset. Finitists see this as circular; Cantorians see it as revealing a necessary truth. The key is whether mathematics needs this ontological commitment or if it's just useful formalism.

