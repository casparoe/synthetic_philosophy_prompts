  **Problem 3: Time per round may be too short.**
     - Recovery: Monitor the first round and if needed, add 1 minute for the initial judgment in subsequent rounds.

  **Problem 4: Participants may discuss during the activity.**
     - Recovery: Emphasize at the start that this is an individual exercise and no discussion until the debrief.

  **Problem 5: The reliability rate might not be believed, especially if it's low and the syllogism seems easy.**
     - Recovery: Explain that the rates are set based on prior research on similar groups and that they are fixed for the exercise. Encourage them to play along.

  By following this structure, the activity should create the desired experiential understanding of asymmetrical reflective access and the resulting epistemic akrasia.
answer: |-
  ### Epistemic Tension Activity: "The Reliability Gap"  
  **Objective:** Participants experience asymmetrical reflective access—transparent first-order reasoning vs. opaque statistical reliability—leading to self-undermining doubt, without naming epistemic akrasia until debrief.  

  ---

  ### (1) Rules, Materials, and Scoring  
  **Materials:**  
  - **12 Sets of 6 Judgment Cards (1 set/participant, 72 cards total):**  
    - Each card has a unique logical puzzle (syllogism) with a claim to evaluate (e.g., "All birds can fly. Penguins are birds. Therefore, penguins can fly.").  
    - Cards are color-coded by "puzzle type" (e.g., Blue = Type A, Red = Type B). Participants *don’t* know types correspond to reliability rates.  
  - **6 Reliability Cards (for facilitator):** Pre-printed with:  
    - Round 1: "Type A reliability: 90% of experts get this right."  
    - Round 2: "Type B reliability: 50% of experts get this right."  
    - Round 3: "Type A reliability: 90%," Round 4: "Type B reliability: 50%," Round 5: "Type A: 90%," Round 6: "Type B: 50%."  
  - **Whiteboard:** Track rounds and group stats.  
  - **Answer Sheets (1/participant):** Record for each round:  
    - Initial Judgment (True/False), Initial Confidence (1–5),  
    - Final Judgment (True/False), Final Confidence (1–5),  
    - Reflection (1 sentence: "Why I changed/stayed").  
  - **Stakes:**  
    - Scoring: Points based on **accuracy + calibration**.  
      - Correct judgment: +2 points.  
      - Confidence bonus: If correct, +confidence score (e.g., confidence 4 → +4). If wrong, -confidence score (e.g., confidence 4 → -4).  
      *Example: Correct with confidence 5 → 7 points; Wrong with confidence 5 → -3 points.*  
    - Incentive: Top 3 scorers choose from "prize pool" (e.g., extra coffee vouchers, bookmarks). Group average >25 points → collective reward (e.g., facilitator brings cookies next session).  

  **Rules:**  
  - No talking during rounds; all decisions private.  
  - Each round:  
    1. Receive puzzle card → **initial judgment/confidence**.  
    2. Facilitator reveals reliability card → **final judgment/confidence/reflection**.  
  - Scoring emphasizes honesty: Overconfidence penalizes; underconfidence misses rewards.  

  ---

  ### (2) Staged Sequence (6 Rounds, 8 Min/Round)  
  **Setup:**  
  - Participants sit alone. Distribute answer sheets.  
  - **Facilitator Script (Intro):** "You’ll solve logic puzzles. Record your best guess and how sure you are. Sometimes, you’ll get extra info about how reliable these puzzles are for experts like you. Your goal: maximize points by being right and knowing when you’re sure."  

  | Round | Phase | Time | Participant Action | Facilitator Action |  
  |-------|-------|------|-------------------|-------------------|  
  | 1–6   | **First-Order Judgment** | 3 min | Receive puzzle card. Record initial judgment (True/False) and confidence (1–5). | Distribute cards (all Type A in odd rounds, Type B in even rounds). |  
  |       | **Higher-Order Evidence** | 1 min | — | Reveal reliability card (90% for Type A, 50% for Type B). Write reliability % on whiteboard. |  
  |       | **Reflective Judgment** | 4 min | Record final judgment, confidence, and reflection (e.g., "I lowered confidence because 50% is a coin toss"). | Collect answer sheets; prep next round. |  

  **Puzzle Design (Examples):**  
  - **Type A (90% reliability):** Easy, intuitive.  
    *Card: "All mammals breathe air. Whales are mammals. Therefore, whales breathe air." (True)*  
  - **Type B (50% reliability):** Deceptively flawed (common cognitive bias).  
    *Card: "If it rains, the street is wet. The street is wet. Therefore, it rained." (False: Affirming the consequent)*  

  **Round Flow:**  
  - Rounds 1/3/5: Type A (90% reliability).  
  - Rounds 2/4/6: Type B (50% reliability).  
  - *No one knows Types A/B exist; reliability feels "random."*  

  ---

  ### (3) Debrief (15 Min)  
  **Goal:** Map activity to epistemology concepts using participant experiences.  

  | Activity Moment | Epistemic Concept | Facilitator Script |  
  |-----------------|-------------------|-------------------|  
  | **First-Order Judgment** | Transparent reflective access | "When you reasoned through the puzzle (e.g., ‘This seems valid’), you had direct access to your thoughts. You ‘saw’ your reasoning clearly—like reading your own mind." |  
  | **Higher-Order Evidence (Reliability %)** | Opaque statistical access | "The reliability % was a general statistic. You didn’t know if *this specific* puzzle was in the ‘right’ 50% or ‘wrong’ 50%. It was like hearing, ‘Experts mess this up half the time,’ without knowing why." |  
  | **Tension in Type B Rounds** | Asymmetry-driven akrasia | "When the reliability was 50%, you felt torn. Your reasoning felt solid (‘The street is wet, so it rained!’), but the statistic said you’re often wrong. That gap—between your clear reasoning and the foggy reliability—created doubt. You *knew* you should doubt, even when your reasoning felt obvious." |  
  | **Peer Disagreement Contrast** | Limitation of peer models | "Unlike peer disagreement (‘My friend disagrees, so I adjust’), this was impersonal. The tension came from *inside*—a statistic undermined you, not a person." |  

  **What the Activity Captures:**  
  - The **asymmetry**: Transparent first-order access vs. opaque reliability.  
  - **Rational self-undermining**: Lowering confidence despite strong first-order intuition.  
  - **Sharp akrasia**: "I feel sure, but I *shouldn’t*."  

  **What It Misses (Requires Facilitator Explanation):**  
  - **Real-world reliability estimates**: In life, we infer reliability from experience (no "reliability card").  
  - **Individual variance**: The activity assumes uniform reliability; real agents track personal success rates.  
  - **Moral/emotional weight**: Real akrasia involves anxiety; this is a "clean" logical tension.  

  ---

  ### (4) Predicted Problem and Recovery  
  **Problem:** Participants dismiss low reliability (e.g., "I’m better than 50%!") and refuse to adjust confidence.  
  - **Why:** Overconfidence bias; mistrust of abstract stats.  
  - **Recovery:**  
    1. **During activity:** Remind, "Points reward calibration—high confidence when wrong *costs* you."  
    2. **Debrief:** Use whiteboard to show group data (e.g., "In Round 2, 50% reliability, 10 of 12 were wrong. Those who kept high confidence lost points.").  
    3. **Reframe:** "This isn’t about your skill—it’s about how *anyone* reacts when their clear reasoning clashes with opaque stats."  

  **Contingency:** If time runs short, reduce to 4 rounds (keep Type A/B alternation). If puzzles are too hard, clarify post-activity: "The 50% puzzles are known tripping points—philosophers study them!"  

  ---  
  **Outcome:** Participants viscerally grasp asymmetrical access before naming it, setting up deep debrief. No tech, readings, or jargon—just cards, points, and tension.
