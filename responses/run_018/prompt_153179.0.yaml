  We are designing a seminar activity to create an experiential understanding of epistemic akrasia driven by higher-order evidence, with a focus on asymmetrical reflective access. The key idea is that participants have transparent access to their own reasoning (first-order) but only opaque, statistical access to its reliability (higher-order evidence). This leads to a tension where one might rationally undermine one's own judgment.

  The activity should:
  - Involve multiple rounds of making judgments with varying levels of evidence.
  - Use a scoring system to incentivize accurate judgments and reflection.
  - Create a situation where higher-order evidence (e.g., statistical information about the reliability of one's own reasoning) conflicts with first-order reasoning.

  We'll design a "judgment task" with two phases: 
  1. First-order judgment: Participants make an initial judgment about a claim based on evidence.
  2. Higher-order evidence: Participants receive statistical evidence about the reliability of their own judgment process (or type of evidence) without revealing the specific reliability of the current instance.

  The twist: The higher-order evidence is asymmetrical — they have full access to their reasoning for the first-order judgment but only statistical (hence opaque) access to the reliability of that reasoning.

  **Structure of the Activity:**

  **Title:** The Confidence Ladder

  **Participants:** 12 graduate students in epistemology.

  **Duration:** 60 minutes.

  **Materials:**
  - A set of 60 claim cards (5 per round for 12 rounds, but we may do fewer rounds to fit time). Instead, we'll do 6 rounds (each round having 12 claims, one per participant) and then a group reflection round. But note: we have 12 participants. We can have each round have one claim that all see? But that would make it too uniform. Alternatively, each participant gets their own claim in each round? But then we need 12 claims per round. We can reduce to 4 rounds to fit time and material constraints.

