  - In real life, we rarely have a clear reliability rate given to us. We have to estimate it from our past experiences, which may be incomplete or biased.
  - The activity treats the reliability rate as the same for everyone and for every instance of the type, but in reality, reliability might vary by context or individual.
  - This form of higher-order evidence is impersonal and statistical, unlike peer disagreement where another person disagrees with you specifically. The tension in peer disagreement comes from the symmetry between peers, but here the tension comes from the asymmetry in access to your own reasoning versus its reliability.

