  - The tension between first-order reasoning and higher-order evidence.
  - The rational pressure to adjust confidence downward in the face of low reliability, even when the first-order reasoning is compelling.
  - The asymmetry of reflective access: you see your reasoning clearly but only have a statistic for reliability.

