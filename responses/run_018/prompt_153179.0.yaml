  - A claim (e.g., "The number of dots on the card is even.")
  - A card with some evidence (e.g., a pattern of dots, but not the actual number; or a statement from a witness, etc.)

  But we need to design evidence that is transparent in reasoning but whose reliability is only known statistically.

  We can use a simple task: estimating a quantity (like the number of dots on a card) but with a twist. However, that might not capture reasoning transparency.

  Alternatively, we can use logical puzzles or syllogisms. For example, each participant gets a syllogism and must judge if it is valid or not. The catch: some syllogisms are designed to be tricky (known cognitive biases), and the participants are told that in general, people (or they themselves) get a certain percentage of these wrong. But we need to assign a reliability rate without revealing which ones are the tricky ones.

  **Proposed Activity:**

  **Phase 1: First-Order Judgment (Individual)**
  - Each participant receives a card with a syllogism (or a logical argument) and must judge whether it is valid (true conclusion follows from premises) or not.
  - They record their judgment and their confidence level (on a scale of 1 to 5).

  **Phase 2: Higher-Order Evidence (Group/Individual)**
  - After all have made their judgments, they receive statistical evidence about the reliability of this type of syllogism. For example: "Syllogisms of this type are correctly evaluated by people with your training 70% of the time." (This is the opaque, statistical access to reliability.)

  **Phase 3: Reflective Judgment**
  - Now, they are asked to adjust their confidence (or even change their judgment) in light of the higher-order evidence. They record a second judgment and confidence.

