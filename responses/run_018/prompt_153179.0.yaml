  - "In this activity, your initial judgment was based on first-order evidence: the syllogism itself. You had transparent access to that reasoning — you could see the steps and evaluate them directly."
  - "The reliability rate was higher-order evidence: it wasn't about the specific syllogism but about your general ability to evaluate this type of syllogism. You had only statistical (opaque) access to the reliability of your own reasoning — you knew the average but not whether this particular instance was one of the times you would be right or wrong."
  - "This asymmetry — transparent first-order access but opaque higher-order access — created a tension. Even when your reasoning seemed clear, the reliability rate might have made you doubt. That feeling is the heart of epistemic akrasia: you might have thought, 'I should be less confident because of the statistics, but my reasoning feels sound.'"

