  **Deliverables:**

  **(1) Full Rules and Materials**

  **Rules:**
  - Each participant will make judgments in 6 rounds.
  - In each round:
     a. You receive a card with a logical argument (syllogism). You have 2 minutes to decide whether the argument is valid (V) or invalid (I) and to rate your confidence (1 to 5, where 1=very unsure and 5=completely sure). Record these on your answer sheet.
     b. The facilitator will then announce a "reliability rate" for the type of argument in this round. This rate is the percentage of times that people with training like yours get this type of argument right. For example, a rate of 70% means that on average, people get it right 7 out of 10 times.
