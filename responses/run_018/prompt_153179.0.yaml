  - "In which round did you feel the most tension between your own reasoning and the reliability rate? Why?"
  - "Did anyone experience a situation where your reasoning seemed clear and compelling, but the reliability rate was low (say 50% or 60%)? How did that feel? What did you do?"
  - "How did the reliability rate affect your confidence? Did you always adjust? Why or why not?"

