  - 72 syllogism cards (6 rounds, 12 per round) with unique IDs.
  - Answer sheets for each participant (with tables for recording).
  - Whiteboard and markers.
  - Prizes: e.g., chocolate bars or "Epistemic Champion" certificates.

  **(2) Staged Sequence of Rounds**

  Each round has the same sequence:

  1. Distribute one syllogism card per participant (randomly for that round).
  2. Start timer for 2 minutes: participants read, reason, record initial judgment and confidence.
  3. After 2 minutes, facilitator writes the reliability rate for the round on the board and reads it aloud.
  4. Start timer for 2 minutes: participants reconsider, record final judgment, final confidence, and reflection.
  5. Collect the syllogism cards (to prevent sharing) or instruct participants to keep them face down.

  After Round 6:
  6. Reveal correct answers: Facilitator reads the correct answer (V or I) for each syllogism by ID (e.g., "R1P1: Valid", etc.). Participants mark their answer sheets.
  7. Participants compute their scores with facilitator guidance (if time) or the facilitator collects to compute later.

