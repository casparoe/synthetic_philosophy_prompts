answer: |-
  You've astutely identified a sophisticated dialectical maneuver in normative ethics—one that protects lexical incommensurability claims through recursive taxonomic refinement. While no single term perfectly captures every facet of this dynamic, several concepts converge to describe it:

  1.  **Conceptual Gerrymandering**  
      This is the most precise fit. Coined by analogy to political gerrymandering, it describes strategically redrawing conceptual boundaries to protect a core claim from counterexamples. Each reclassification of an intermediate case ("structural stagnation," "dull ache") into the "lexically protected" category functions like gerrymandering a district: the boundary shifts to include the threatening case, preserving the absolute status of the core category. The taxonomy becomes increasingly complex and ad hoc to immunize the original incommensurability thesis.

  2.  **Immunization Strategy (Popperian Sense)**  
      Karl Popper used this term for tactics that render theories unfalsifiable. Your description matches this: by redefining any potential counterexample (measurable suffering) as belonging to the protected "kind," the lexical boundary becomes empirically/morally unfalsifiable. It's not merely adding auxiliary hypotheses (which test *when* a law applies) but redefining *what counts* as the relevant phenomenon.

  3.  **Boundary Work (in Sociology of Science)**  
      Though originating in science studies, it applies here. Theorists engage in "boundary work" to demarcate their privileged category (extreme suffering) from adjacent phenomena. Each refinement of the taxonomy fortifies this boundary, excluding potential challenges by denying them membership in the incommensurable class while absorbing borderline cases that threaten comparability.

  4.  **Essence-Accretion / Kind-Reification**  
      This involves treating a normative category (e.g., "true incommensurable suffering") as having a discoverable essence. As borderline cases arise, the "essence" is elaborated to include them, strengthening the category's absoluteness. This preserves the kind's moral priority but makes it resistant to scalar assessment.

  ### Why other terms don't quite fit:
  - **Motte-and-Bailey**: Involves retreating to a defensible claim (motte) after advancing a stronger one (bailey). Here, the *same* strong claim is preserved via reclassification.
  - **No True Scotsman**: Adjusts criteria for category membership to exclude counterexamples. Your case is broader: it *includes* counterexamples by reclassifying them as core instances.
  - **Concept Creep**: Expands a category's scope, diluting it. Here, the category is fortified, not diluted; its *incommensurability* is preserved.
  - **Ad Hoc Hypothesis**: Typically explains away anomalies. This involves redefining the anomaly *as* the phenomenon itself.

  ### Key Features & Boundaries:
  - **Core Mechanism**: Taxonomic recursion preserving an absolute (lexical) normative boundary.
  - **Requires**: A commitment to non-commensurability between distinct "kinds" of value/disvalue.
  - **Can Occur Without Explicit Lexicality**: Any normative absolute (e.g., "sacred values," "absolute rights") defended via iterative reclassification of borderline cases exhibits this. Examples:
    - Redefining "torture" to include psychological harm when critics argue mild coercion is compensable.
    - Insisting that "dignity violations" include structural injustice when faced with lesser indignities.
  - **When It's Problematic**: When reclassifications lack independent justification and serve *only* to protect the core claim from falsification, collapsing into circularity: "X is incommensurable because it belongs to Kind K; anything threatening commensurability must be Kind K."
  - **Potential Justification**: Not always fallacious. If intermediate cases genuinely share a morally relevant feature (e.g., *irreversible destruction of agential capacity*), reclassification may be valid. The error lies in *systematic, non-independent* adjustments.

  ### In conclusion:
  **"Conceptual gerrymandering"** is the most apt term for this dynamic. It emphasizes the strategic, boundary-drawing nature of the maneuver. **"Recursive taxonomic immunization"** or **"lexical boundary-shielding"** could serve as descriptive phrases where a formal term is lacking. This tactic is a significant challenge in debates about suffering, human rights, and value commensurability, as it obstructs scalar analysis while claiming moral rigor. Critiquing it requires demanding independent criteria for kind-membership beyond the need to preserve incommensurability.
