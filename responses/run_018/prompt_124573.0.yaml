  Hmm, the challenge is making this concrete without falling into the town meeting or lab analogies. The pop-up transit example is smart - it shows emergent preferences through action. Need to ensure it contrasts clearly with top-down planning. 

  For pedagogical sequencing: must first dismantle the "fixed preferences" assumption. Grad students will default to seeing democracy as aggregating pre-existing preferences. Gotta shatter that early. Then introduce inquiry as reconstructing both means AND ends - that's the hinge. 

  Biggest pitfalls: 
  1) Misreading "experimental" as technocratic trial-and-error (citizens as lab rats)
  2) Assuming a neutral expert must design the process 
  3) Thinking changing ends = no evaluation standards
  Should preempt #1 when introducing "experimental," #2 during the transit example, #3 when discussing evaluation.

  The killer check question: Ask them to imagine the pop-up transit revealing that elderly residents didn't just want transport but social connection - then have them trace how that reshaped the mobility problem itself. If they get that co-transformation, we're golden. 

  Should explicitly bracket Dewey's metaphysics and logic. Frame it as focusing on political application - they'll smell evasion if we don't name the omissions. 

