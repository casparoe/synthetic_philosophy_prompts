answer: |-
  1. **Exam Question:** Imagine a law that's both passed and repealed at the same time—does dialetheism actually prevent trivialism here, or could "normative dialetheia" still make everything true?  

  2. **Model Answer:** Dialetheism avoids trivialism by allowing contradictions without explosion, but in this law scenario, normative dialetheia—where conflicting obligations arise from the same act—might collapse into trivialism if society must simultaneously enforce and reject the law, making all legal outcomes true.  

  3. **Marking Scheme (5 points total):**  
     - 1 pt for defining dialetheism/paraconsistency.  
     - 1 pt for explaining the law contradiction.  
     - 1 pt for linking trivialism to "all truths" risk.  
     - 1 pt for introducing normative dialetheia.  
     - 1 pt for arguing why it might fail to stop trivialism.  

  4. **Niche Concept Hook:** Normative dialetheia deals with *ought*-contradictions, like being required to obey and ignore a law simultaneously—this pressures real-world systems harder than abstract true/false paradoxes.  

  5. **Casual Tip:** Chill—just focus on why dialetheism’s "contradictions are okay" might not save us when rules clash IRL.
