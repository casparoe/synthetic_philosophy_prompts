  ### Taxonomy: Occasionalism and Interventionist Causation in Scientific Practice

  This decision tree classifies positions on whether occasionalist metaphysics (where God is the sole efficient cause) can be reconciled with scientific explanatory practice, particularly interventionist accounts of causation (which analyze causation as counterfactual dependence under interventions). Interventionist causation asks: "If we intervene to change \(X\), would \(Y\) change?" Each branch addresses a concrete claim about divine action and created things, enabling students to navigate without prior knowledge of position labels. Awkward commitments highlight philosophical trade-offs. Unoccupied nodes are flagged.

  ---

  **Root Question: In the natural world, does God alone possess efficient causal power, such that created things (e.g., fire, medicine) have no intrinsic power to cause effects?**  
  - **No → Leaf 1: Non-occasionalism (e.g., Aristotelian, Thomistic, or modern non-occasionalist views)**  
    *Awkward commitment:* Must explain how created things have genuine causal powers without rendering God redundant or irrelevant in the causal order.  
    *(End of branch)*  

  - **Yes → Proceed to Question 2**  

  **Question 2: Are secondary causes (e.g., fire burning cotton, medicine curing disease) real features of the world (ontologically real), or are they merely human constructs summarizing divine patterns?**  
  - **Merely human constructs (epistemic conveniences) → Proceed to Question 3A**  
  - **Real features of the world (ontologically real) → Proceed to Question 3B**  

  **Question 3A (Epistemic branch): For an interventionist counterfactual like "If we intervened to prevent fire from contacting cotton, the cotton would not burn," is this counterfactual true and applicable?**  
  - **No → Leaf 2: Hard occasionalism with arbitrary divine action (Incompatibilist)**  
    *Awkward commitment:* Science is impossible because divine action is arbitrary and unpredictable, so no stable patterns exist to study.  
