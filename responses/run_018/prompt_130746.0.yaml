prompt: |-
  Hey, I've been thinking about blame and hypocrisy and there's this pattern I keep runing into but I dont know what to call it. Like, say my roommate complains that I'm leaving dishes in the sink, but I remember last week he told our other roommate it was fine when she did the same thing because she was stressed. Or another example: a politician calls out corruption in the other party, but earlier they voted against investigating corruption in thier own party. Its not just regular hypocrisy where you do the bad thing yourself — its more like you've already 'used up' your right to blame by letting the same thing slide for someone else. Is there a specific term for losing your credibility to call someone out, not because you're guilty of the exact same act, but because you've shown you're okay with the act in other cases? I know people talk about hypocrisy, but this feels different, like its about being inconsistent in applying the rule rather than breaking it yourself. Does this have a name, and if not, what should we call it? I want to know exactly where the edges are — like does it matter if you excused the other person for a good reason, or if you're just being lazy about calling people out?
