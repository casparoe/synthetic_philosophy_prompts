answer: |-
  You've hit on a fascinating and nuanced aspect of moral reasoning and social dynamics! What you're describing **doesn't have a single universally agreed-upon term**, but it's a well-recognized pattern. It sits at the intersection of several concepts:

  1.  **Double Standard:** This is the most direct and common label. It specifically means applying different sets of principles, judgments, or rules to situations that are essentially alike, especially when it benefits oneself or one's group. Your examples perfectly fit this: holding *you* to a strict rule about dishes while excusing *her* for the same act, or demanding investigations of *their* corruption while shielding *your own*.
  2.  **Selective Enforcement:** This emphasizes the procedural aspect – choosing when to apply a rule or levy blame based on factors other than the act itself (like who did it, their relationship to you, or convenience). It's common in organizational or legal contexts but applies perfectly to your roommate and politician examples.
  3.  **Inconsistent Application of Principles/Rules:** A more formal way of saying "double standard" or "selective enforcement," highlighting the lack of logical or moral consistency.
  4.  **Loss of Moral Standing / Moral Authority:** This describes the *consequence* you identified – the person loses the credibility or right to blame others *because* of their inconsistency. Their inconsistency undermines their position as a fair arbiter. Terms like "undermined credibility" or "compromised impartiality" fit here.
  5.  **Hypocrisy (Broader Definition):** While often focused on "saying one thing, doing the opposite," hypocrisy *can* encompass inconsistency in judgment. **Your observation is spot-on: this is a specific *form* of hypocrisy.** It's hypocrisy not of *action* (doing the bad thing yourself), but of *judgment* or *principle application* (condemning in one instance what you condoned in another). Think of it as "judgmental hypocrisy" or "hypocrisy of inconsistent standards."

  **Why your concept feels distinct:**

  *   **Focus:** Classic hypocrisy focuses on the *actor's own violation* of the rule they preach. Your concept focuses on the *judge's inconsistency in applying the rule to others*.
  *   **Mechanism:** The loss of credibility comes not (necessarily) from personal guilt, but from demonstrating that the rule isn't actually absolute or consistently valued. It reveals the judgment is based on something other than the principle itself (favoritism, tribalism, convenience).

  **Answering your edge cases:**

  1.  **Does a "good reason" for excusing the other person matter?**
      *   **Absolutely.** Context *is* crucial. The key question is: **Is the justification for the inconsistency itself based on a *relevant, consistent principle*, or is it an *ad hoc* excuse masking bias/convenience?**
      *   **Valid Justification:** "She was going through a severe crisis last week, so I cut her slack on the dishes *as a one-time exception based on extraordinary circumstances*. You doing it regularly when things are normal is different." *If* this principle ("extraordinary stress warrants temporary leniency") is applied *consistently* when similar circumstances arise (for you, for others), then it mitigates the charge of a double standard. The rule is applied consistently, but with a defined, principled exception.
      *   **Invalid Justification (Ad Hoc Excuse):** "Well, she's just nicer/busier/stressed (in a routine way)/my friend, so it's okay for her but not for you." This lacks a consistent, relevant principle and exposes bias/favoritism/inconsistency, destroying credibility.
      *   **The Burden:** The person making the inconsistent judgment bears the burden of explaining the *relevant principle* justifying the difference in treatment. If they can't articulate a fair, consistent principle, it's a double standard.

  2.  **Does just being "lazy" about calling others out matter?**
      *   **Yes, it weakens credibility, but differently.** This is more about **selective enforcement due to apathy or convenience** rather than active favoritism.
      *   **Impact:** While less malicious than active bias, it still undermines the right to blame *when you finally decide to enforce the rule*. If you've let countless others slide (even strangers) because you couldn't be bothered, suddenly getting strict with *this specific person* looks arbitrary and unfair. It suggests the enforcement isn't about the principle, but about your momentary mood or convenience. Your authority to demand adherence to the rule is diminished because you've demonstrated you don't consistently value enforcing it yourself.

  **In Summary:**

  *   **Core Concept:** Applying blame or judgment inconsistently for the same act based on irrelevant factors (who did it, when, your relationship, convenience), thereby losing moral standing to condemn the act.
  *   **Best Single Term:** **Double Standard** is the most accessible and accurate general term.
  *   **More Precise Terms:** **Selective Enforcement** (emphasizes the action) or **Hypocrisy of Inconsistent Standards/Judgment** (emphasizes the moral failing).
  *   **Consequence:** **Loss of Moral Authority/Standing** or **Undermined Credibility**.
  *   **Edge Cases:** A **relevant, consistently applied principle** justifying the difference in treatment can negate the charge of a double standard. Mere **laziness/apathy** in enforcement still weakens credibility when enforcement finally occurs, as it reveals inconsistency and arbitrariness.

  You've identified a crucial point about fairness: the legitimacy of blame depends not only on the act being wrong, but also on the blamer demonstrating consistent commitment to the principle underlying the blame. It's why cries of "double standard!" or "whataboutism" (a related tactic pointing to inconsistency) can be so powerful in arguments, even if they don't absolve the original wrong.
