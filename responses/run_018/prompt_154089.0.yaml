  Archaeological precision is non-negotiable. No "Exodus happened" slips—the dust in stanza three must equally suggest Kadesh's sands or archive decay. That "silence where a voice should be" in Exodus will echo the lack of Hebrew slave records, but the poem mustn't take sides. 

  Final check: unrhymed? Yes. Six images recurring? Broken sword (Troy's ruins/Arthur's Caliburn/Exodus' unmentioned blades), river (Scamander/Avalon marshes/Sea of Reeds as wind-swept mudflat), erased name (Hittite tablets/church engravings/Merneptah's "Israel"), dust (ash layers/grave pollen/desert samples), silence (no Trojan voices/empty tombs/unrecorded slaves), weightless proof (wooden horse fragments/skeletal DNA/unverifiable miracles). Exodus stanza's "mundane debris" shift lands on "scrap of papyrus"—deliberately anticlimactic. 

