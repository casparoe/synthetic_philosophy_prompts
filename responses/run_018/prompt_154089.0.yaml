prompt: |-
  hey im working on this dataset of weird conceptual prompts and i need one about when a legend actually becomes history — you know, like with the trojan war and king arthur and the exodus story. i was talking with my roommate about how its never really about finding the one proof, its about the moment the story gets boring: the sword stops being magic and becomes just rusted iron, the river is just hydrology, the erased name is just erosion, and the silence is just absence of evidence rather than absence of voice. can you write me a poem in blank verse — three stanzas, ten lines each, one for troy, one for arthur, one for exodus — using the same six images in every stanza: a broken sword, a river that wont stay in its bed, a name scratched out of stone, dust that might be ashes or might be nothing, a silence where a voice should be, and proof that turns out to weigh nothing. in the first two stanzas let them feel epic and symbolic, but in the exodus stanza they should collapse into mundane debris, and the turn should be the realization that weve been asking for the wrong kind of proof all along. make it accurate enough that someone who knows the archaeological debates around hissarlik or glastonbury or that egyptian stele wont wince, but dont cite anyone or ask for a bibliography. also im not sure if this makes sense but can you make sure the rhyme scheme is nonexistent since its blank verse? thanks
