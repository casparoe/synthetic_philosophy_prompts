answer: |-
  Here’s the poem, weaving your precise requirements with the archaeological textures of each legend, shifting from epic resonance to mundane collapse in the final stanza:

  **The Turn of Proof**

  **(Troy: Hisarlik’s Layers)**

  A **broken sword** leans skewed in packed debris,  
  Not bronze of heroes, just corroded ore  
  From some forgotten clash. The Scamander’s plea –  
  That **river that won’t stay within its bed** –  
  Sifts silt on myth, where Priam’s towers soared.  
  A Hittite tablet’s edge, a **name scratched out**  
  (Was Ilion here? Or Wilusa instead?),  
  Adds doubt to dust. And oh, that **dust** lies thick  
  Like ash from conflagration… or just earth?  
  A **silence where a voice should be** hangs slick  
  Above the stones, no Hector’s final breath.  
  The **proof that weighs out nothing**? Charred wood grain,  
  Some horse-like shape? A scholar’s fragile claim.

  **(Arthur: Glastonbury’s Shroud)**

  A **broken sword** (claimed Caliburn!) lies cold,  
  Not pulled from stone, but rusted in the marsh  
  Near Avalon. The **river won’t stay told**,  
  Floods Tor’s base, mocks the Isle of Apples harsh.  
  A leaden cross, inscription worn away –  
  A **name scratched out of stone** (Arturius Rex?),  
  Found near the bones. But **dust** upon the clay  
  Might mark a chieftain’s pyre… or pollen checks  
  From later monks? The grave is bare, bereft,  
  A **silence where a voice should be**, no spell  
  Of Merlin lingers. **Proof that weighs out** left?  
  Just femur splinters, carbon-dated well  
  Too late for knights. The magic fades to rust,  
  The grand design dissolved to bone and dust.

  **(Exodus: Kadesh Barnea’s Breath)**

  A **broken sword** tip, common Sinai brand,  
  Not Moses’ arm, just nomad’s lost defense  
  Left in dry wadi. **River that won’t stand**  
  **Within its bed**? The Sea of Reeds, immense  
  In tale, is wind-swept mudflat, shallow, bare,  
  Where chariot wheels *might* sink… or tumbleweed.  
  The **name scratched out**? On Merneptah’s proud stare,  
  “Israel” exists – as conquered foes, indeed,  
  Not slaves set free. The **dust** is desert-blow,  
  Not Sinai’s ash-cloud, just fine, featureless sand,  
  No pillar’s trace. A **silence** vast and slow –  
  **Where forty years of voices** scarred the land?  
  Just wind in scrub. The **proof that weighs out**? Nil.  
  A scrap of papyrus? Void. The desert’s will.  
  The scales tip not with gold or godly sign,  
  But with the dawning: we sought chains and wine  
  And parted seas – *proof tangible, defined* –  
  While freedom walked in hearts we left behind.

  ---

  **Key Details & Intent:**

  1.  **Troy (Hisarlik):**
      *   **Sword:** Schliemann's finds, now understood as potentially mixed/contextual.
      *   **River:** Scamander's shifting course and floodplain sedimentation obscuring layers.
      *   **Name Scratched Out:** Debates over Hittite references (Wilusa vs. Troy/Ilion).
      *   **Dust/Ash:** The fiery destruction layer (Troy VIIa), but debate on cause (war? earthquake?).
      *   **Silence:** No contemporary inscriptions *from* Troy detailing the war.
      *   **Weightless Proof:** The controversial "Priam's Treasure" context & the Wooden Horse as pure myth (no archaeological evidence).

  2.  **Arthur (Glastonbury):**
      *   **Sword:** The Glastonbury Lake Village finds or later medieval blades, not Excalibur.
      *   **River:** The Somerset Levels flooding around Glastonbury Tor ("Isle of Avalon").
      *   **Name Scratched Out:** The lead cross reportedly found in 1191 with Arthur's name, now lost/dubious.
      *   **Dust:** The Glastonbury Abbey "Arthur's Grave" excavation (1278), bones later C14 dated to ~10th-11th C.
      *   **Silence:** No contemporary 5th/6th C evidence for Arthur; the grave a likely monastic hoax/PR.
      *   **Weightless Proof:** The discredited grave and the lack of any early physical evidence for Camelot.

  3.  **Exodus (Collapse into Mundanity):**
      *   **Sword:** Common bronze age weapon fragments found in Sinai/Negev, not miraculous.
      *   **River/Sea:** Shift from epic miracle to the mundane reality of the shallow, marshy "Sea of Reeds" (Yam Suph).
      *   **Name Scratched Out:** Merneptah Stele (c. 1208 BCE) - earliest mention of "Israel" *in Canaan*, as a defeated entity, not escaping slaves.
      *   **Dust:** Just desert sand, no miraculous manna residue or pillar-of-cloud traces.
      *   **Silence:** Complete lack of Egyptian records mentioning Hebrew slaves, plagues, or a mass exodus.
      *   **Weightless Proof:** The absence of evidence in Sinai (no campsites, no mass graves matching the scale/timeframe) despite extensive surveys. Papyrus fragments relate to mundane admin.

  4.  **The Turn:** The final lines explicitly state the core realization: the demand for physical, monumental proof (chains, wine amphorae, parted seabed) was misplaced. The enduring power lies in the *idea* of liberation carried forward ("freedom walked in hearts"), which mundane archaeology cannot capture or disprove in the same way. The "wrong kind of proof" was sought.
