prompt: |-
  I'm presenting a colloquium paper next Thursday defending what I call frame-sensitive particularism: the claim that moral reasons are not merely variable in weight across contexts, as standard particularists hold, but that the very identity of a feature as a reason depends on an irreducibly situational relational framing. On this view, the same feature—say, withholding information—can operate as a reason for condemnation in one interactional frame and as a reason for praise in another, and this reversal is not recoverable from any general principle, nor from Dancy-style pluralism about reasons. I ground the view in a model of salience calibration drawn from perceptual psychology but applied to moral attention: agents do not apply rules to determine what matters; rather, they attune to a gestalt comprising their emotional posture, the narrative arc of the interaction, and the perceived vulnerability of the other party. This means particularism is not just about the absence of principles but about the positive dynamics of moral attention. The audience is a philosophy department colloquium consisting of a Rossian pluralist who accepts pro tanto reasons but insists on stable ordering relations, a Kantian constructivist who thinks any rejection of universalizability collapses into arbitrariness, a virtue ethicist convinced that particularism is indistinguishable from unprincipled intuitionism, and a visiting moral psychologist working in moral foundations theory who will press me on whether cross-cultural consistency in moral judgment undermines any view that makes reasons this context-dependent. I need a Q&A prep sheet: the objections they will actually raise, in roughly the order they will come, phrased as each of them would phrase them, with for each whether I should concede ground, hold firm, and where my reply is weakest. Include the one reply that must land for the view to survive the session, the weakest point in my own position that I should prepare to defend rather than hope they miss, and specifically the question I'm hoping the moral psychologist doesn't ask. Throughout, say what would change your mind about the strength of these objections—whether an empirical result, a conceptual distinction, or a counterexample—and identify where your reasoning about the audience's reactions is most likely to fail.
reasoning: |-
  Okay, the user is preparing for a colloquium on their frame-sensitive particularism theory. They need a Q&A prep sheet tailored to specific audience members: a Rossian pluralist, a Kantian constructivist, a virtue ethicist, and a moral psychologist. 

  First, I need to understand the core of their theory. It's not just that moral reasons have variable weights, but that the identity of a reason itself depends on relational framing. For example, withholding information could be praiseworthy or blameworthy based on context, and this isn't explainable by general principles. They ground this in salience calibration from perceptual psychology applied to moral attention, involving emotional posture, narrative arc, and perceived vulnerability.

  Now, considering each audience member:

  The Rossian pluralist believes in pro tanto reasons with stable ordering relations. Their objection would likely focus on how frame-sensitive particularism undermines the stability of reasons. They might ask for an example where a reason's polarity flips without any stable core. The user needs to hold firm but concede that some features might have stable polarity—just not all. The weak point is explaining why some reasons are stable while others aren't without ad-hoc reasoning. A counterexample involving cross-cultural stability could challenge this.

  The Kantian constructivist will argue that without universalizability, moral judgments become arbitrary. They might question how framing avoids arbitrariness. The user should emphasize the structured nature of salience calibration but needs to address the regress problem. The key reply here is that salience calibration isn't arbitrary but contextually responsive. The weakest point is the potential regress in framing justifications. If pressed on who sets the frame, the user might struggle.

  The virtue ethicist sees particularism as unprincipled intuitionism. They'll ask how frame-sensitivity differs from phronesis. The user should align with virtue ethics but stress the rejection of codification. The vulnerability point is crucial here—showing that moral perception isn't just about the agent's virtues but relational dynamics. The weak spot is explaining why virtues can't generate principles. If the virtue ethicist questions why virtues aren't sufficient, the user needs a strong response.

  The moral psychologist working in Moral Foundations Theory (MFT) will point to cross-cultural consistency in moral judgments. They might ask how frame-sensitive particularism accounts for this consistency. The user must argue that framing explains both consistency and variation. The critical question they hope isn't asked is about the universality of framing processes. If framing itself isn't universal, the theory could be undermined. Empirical studies on cultural differences in framing could challenge this.

  The user's key points to defend are the polarity flip without higher-order principles and the structured yet non-codifiable nature of salience calibration. The weakest overall point is the stability of framing processes. If the audience questions why framing isn't arbitrary or how it's learned, the user needs solid responses, possibly referencing developmental psychology.

  The user might overestimate the Kantian's openness to non-codified structure and underestimate the moral psychologist's knowledge of cultural framing variation. Also, they might not have enough empirical backing for salience calibration in moral contexts. The response to the Rossian's stability question is critical—if it fails, the whole theory might seem ad hoc. For the moral psychologist, avoiding the universality of framing question is key; if asked, the user must rely on the deepest level of salience calibration being universal but culturally expressed.
answer: |-
  Here’s a targeted Q&A prep sheet structured around your audience, ordered by likely objection sequence. I’ve flagged strategic concessions, vulnerabilities, and pivot points. Crucially, **your reply to the Rossian pluralist on polarity reversal MUST land**—if it’s dismissed as "disguised rule-plus-exceptions," your core thesis collapses.

  ---

  ### **1. Rossian Pluralist**  
  **Likely Objection:**  
  *"You claim features like 'withholding information' lack stable valence. But doesn’t your 'relational framing' presuppose *pro tanto* reasons? For instance, 'protecting vulnerability' seems a stable positive reason that explains why withholding is praiseworthy in medical contexts but blameworthy in friendships. Isn’t this just Ross with extra steps?"*  

  **Your Strategy:**  
  - **Hold firm:** Frame-sensitivity isn’t derivative of higher-order principles. "Protecting vulnerability" isn’t a *reason* but a *descriptor* of the frame itself—it emerges from the gestalt (emotional posture + narrative arc), not prior rules.  
  - **Concede:** Some features *may* have default valences (e.g., torture), but these are statistical, not metaphysical.  
  - **Weakest Point:** Distinguishing "core" reasons (Ross) from "emergent" reasons (you). If pressed, argue:  
    > "Stable principles *describe* patterns; they don’t *constitute* the moral landscape. Framing determines whether a feature is even *visible* as a reason."  
  - **Mind-Changer:** Empirical proof of valence-stable features *unaffected* by framing (e.g., cross-cultural experiments showing identical reason-identification in divergent narratives).  

  ---

  ### **2. Kantian Constructivist**  
  **Likely Objection:**  
  *"If reasons are frame-dependent and non-universalizable, how is this not moral arbitrariness? When two agents interpret the same act differently (e.g., withholding as deceit vs. tact), what grounds adjudication beyond subjective framing?"*  

  **Your Strategy:**  
  - **Hold firm:** Reject the arbitrariness charge. Framing is intersubjective and constrained by:  
    - Emotional coherence (e.g., schadenfreude corrupts framing)  
    - Narrative integrity (e.g., inconsistent framing undermines agency)  
    - Vulnerability recognition (non-optional in well-attuned agents).  
  - **Weakest Point:** Avoiding regress (who frames the frame?). Stress that framing isn’t "chosen" but *calibrated*—like perceptual focus.  
  - **Key Reply:**  
    > "Universalizability applies to *how we attend*, not *what we conclude*. The duty is to calibrate salience responsibly, not to output identical judgments."  
  - **Mind-Changer:** A conceptual demonstration that "responsible calibration" *requires* universalizable rules.  

  ---

  ### **3. Virtue Ethicist**  
  **Likely Objection:**  
  *"This sounds like Aristotelian *phronesis*—yet you reject character as the anchor. If framing depends on the agent’s 'emotional posture,' isn’t that just virtue ethics without the commitment to *telos*? Why call this particularism rather than intuitionism?"*  

  **Your Strategy:**  
  - **Concede:** Overlap with *phronesis*, but reframe: Virtue ethics centers agent-excellence; you center *relational dynamics* (vulnerability perception isn’t agent-focused).  
  - **Hold firm:** Against intuitionism, argue salience calibration is *structurable* (via narrative coherence, emotion checks) but *non-codifiable*.  
  - **Weakest Point:** Distinguishing "attunement" from "intuition." Use perceptual analogy:  
    > "We *learn* to see gestalts (e.g., face recognition), but this isn’t 'intuition'—it’s trained sensitivity."  
  - **Mind-Changer:** If virtue ethics can fully explain polarity flips via *context-sensitive virtues* (e.g., tact vs. honesty) without relational frames.  

  ---

  ### **4. Moral Psychologist (MFT)**  
  **Likely Objection:**  
  *"Moral Foundations Theory shows cross-cultural consistency in reason-types (care, fairness, etc.). If framing dictates whether 'withholding information' is a reason *at all*, how do you explain this stability? Doesn’t your view predict radical variance?"*  

  **Your Strategy:**  
  - **Hold firm:** MFT’s "foundations" are *content-categories*, not context-invariant reasons. Framing determines *how* (or if) a foundation is activated (e.g., loyalty might forbid *or* require withholding).  
  - **Concede:** Some framing parameters (e.g., harm avoidance) may be culturally universal—but their *moral weight* remains frame-sensitive.  
  - **Critical Reply to Land:**  
    > "MFT shows *what* we moralize, not *why* it counts in a context. Your 'consistency' is in detectible *features*, not in their function as reasons."  
  - **Weakest Point:** Explaining cultural *agreement* on wrongness (e.g., incest) without stable reasons. Argue: Shared frames produce shared salience.  
  - **The Question You Hope They Don’t Ask:**  
    *"If framing is culturally transmitted (e.g., honor codes), doesn’t that make your 'gestalt' just a local rule? Where’s the particularism?"*  
    **Evasion Risk:** Don’t call framing "cultural." Stress that *even within a culture*, frames are irreducibly situational (e.g., honor demands different acts in duel vs. business).  
  - **Mind-Changer:** Data showing identical framing gestalts (emotional posture + narrative + vulnerability) across cultures for valence-flipped features.  

  ---

  ### **Overarching Vulnerabilities & Prep Priorities**
  - **Reply That Must Land:** Your counter to the Rossian—**polarity reversal isn’t rule-explained**. Give a crisp example:  
    > *"Withholding a terminal diagnosis: In a paternalistic frame, it’s caring; in an autonomy-respecting frame, it’s deceit. No 'master principle' predicts this—only the frame does."*  
  - **Weakest Point in Your Position:** **Framing stability**. How do agents avoid capricious reframing? Prep empirical work on perceptual/cognitive anchoring (e.g., Tversky’s framing effects) to show it’s constrained.  
  - **Audience Reaction Misjudgment Risk:** You may overestimate the Kantian’s acceptance of "structured attention without rules" and underestimate the virtue ethicist’s flexibility on codification.  
  - **Empirical Lifeline:** Cite Jonathan Haidt’s social intuitionism (calibration via emotion) or embodied cognition to ground "gestalt attunement."  

  **Final Tip:** Preempt the "anything goes" critique by emphasizing **vulnerability perception as an objective constraint**—it’s non-negotiable in well-functioning frames. This bridges the Kantian and virtue concerns.  

  Good luck—your view is bold, and this is exactly the forum to test it.
