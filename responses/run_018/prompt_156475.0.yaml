answer: |-
  Here's a concise, decision-tree taxonomy for your handout, following your specifications (British English, concrete claims first, camp labels last):

  **Philosophical Progress: A Decision Tree**

  1.  **Do core philosophical disagreements demonstrably *shrink* over time (e.g., consensus emerges, positions become marginalised)? OR Do they mainly *recycle* (high 'recycling coefficient': old positions recur under new terminology, core disputes persist)?**
      *   **A. Shrink:** Proceed to Question 2A.
      *   **B. Recycle:** Proceed to Question 2B.

  2.  **A. (If Shrinking) What primarily *causes* this shrinkage?**
      *   **i. Conceptual Clarification:** Better arguments, distinctions, dissolving pseudo-problems.
      *   **ii. Empirical Input:** Findings from science/history shaping viable positions.
      *   **iii. Social Dynamics:** Shifting academic trends, institutional power, generational change. Proceed to Question 3A.
      *   **B. (If Recycling) What primarily *explains* the persistence/recycling?**
          *   **i. Conceptual Limits:** Problems inherently lack definitive solutions; progress is in understanding, not resolution.
          *   **ii. Insufficient/Ambiguous Empirical Input:** Science rarely settles core philosophical disputes decisively.
          *   **iii. Social Dynamics:** Fashion, power structures, career incentives favour recycling. Proceed to Question 3B.

  3.  **A. (If Shrinking) How should progress be *measured*?**
      *   **i. Elimination of False Options:** Progress = showing certain paths are dead ends.
      *   **ii. Accumulation of True Positions/Beliefs:** Progress = adding justified truths to the corpus (even if incomplete).
      *   **iii. Increased Decision-Relevance:** Progress = better tools for non-philosophers (science, policy, life).
      *   **B. (If Recycling) How should progress be *measured* (if at all)?**
          *   **i. Elimination of False Options:** Progress *only* in ruling out mistakes, not gaining truths.
          *   **ii. Accumulation of Understanding/Clarity:** Progress = richer conceptual maps, deeper grasp of dilemmas.
          *   **iii. Increased Decision-Relevance:** Progress = generating frameworks useful for other domains.

  **Resulting Positions (Leaves):**

  *   **A.i + 3A.i:** **Eliminativist** (e.g., some logical positivists). Progress = eliminating nonsense/metaphysics via conceptual analysis. Awkward: Must deny substantive truths accumulate in metaphysics/ethics.
  *   **A.i + 3A.ii:** **Naturalist-Progressivist** (e.g., some analytic metaphysicians). Progress = accumulating truths (e.g., about causation, mind) through refined arguments. Awkward: Must show consensus reflects truth, not just skill.
  *   **A.ii + 3A.ii:** **Scientific Naturalist** (e.g., strong naturalists). Progress = science materially resolving philosophical questions. Awkward: Philosophy becomes largely empirical/scientific.
  *   **A.ii + 3A.iii:** **Pragmatist/Applied Progressivist.** Progress = philosophy better serving science/society. Awkward: Risks instrumentalising philosophy.
  *   **A.iii + 3A.iii:** **Unnamed.** Progress = socially-driven consensus yields practically useful outputs. Awkward: Consensus ≠ truth or depth; risks relativism.
      *   *Empty Spot: A.iii + 3A.ii.* **Incoherent?** Claiming social dynamics *cause* shrinking disagreements which constitute *accumulated truths* seems contradictory. Social forces don't reliably track truth accumulation.
  *   **B.i + 3B.i:** **Eliminativist / Pyrrhonian.** Progress *only* negative (eliminating dogmatic claims). Core debates recycle endlessly. Awkward: Denies any positive philosophical knowledge possible.
  *   **B.i + 3B.ii:** **Pluralist / Interpretivist** (e.g., Rorty, some Wittgensteinians). Progress = richer perspectives/clarity, not resolution. Debates recycle due to conceptual nature. Distinguisher: Sees *positive value* in diverse/recycled approaches, unlike eliminativism. Awkward: Can seem like sophisticated stagnation.
  *   **B.ii + 3B.ii:** **Unnamed.** Recycling persists because science doesn't bite deep enough; progress remains conceptual clarification. Awkward: Similar to B.i+3B.ii, but emphasises empirical limits. (Often folds into Pluralism or Stagnationism).
  *   **B.iii + 3B.iii:** **Stagnationist / Sociological Critic.** Debates recycle due to academic sociology; "progress" is just rhetorical novelty serving careers/institutions. Awkward: Undermines philosophy's intellectual authority.
      *   *Empty Spot: B.ii + 3B.i.* **Unexplored?** Recycling due to insufficient empirical input, yet progress measured *only* by eliminating false options. Possible but niche (e.g., a very pessimistic naturalist).
      *   *Empty Spot: A.iii + 3A.i & B.iii + 3B.i.* **Unnamed (Social Elimination).** Shrinking/recycling driven socially, progress = social elimination of options. Awkward: Reduces philosophy to power struggles.

  **Key Distinctions:**
  *   **Eliminativist vs. Pluralist:** Both deny truth-accumulation (3A.ii/3B.ii). Eliminativists see *only* negative progress (elimination). Pluralists see positive progress in richer understanding/perspectives *despite* persistent/recycled disagreements.
  *   **Naturalist-Progressivist vs. Scientific Naturalist:** Both see truth-accumulation. Naturalist-Progressivists emphasise conceptual work *alongside* science; Scientific Naturalists see science as the primary driver/resolver.
  *   **Stagnationist** is defined by attributing the *lack* of shrinkage or *recycling* primarily to detrimental social dynamics (B.iii), often denying substantive progress (or seeing it cynically).
