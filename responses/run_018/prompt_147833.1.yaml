  First, I need to design a data packet that’s rich enough for ambiguity but lean enough for a 75-min activity. The stimuli must: 
  - Show "glex" with whole rabbits (classic Gavagai) 
  - Include rabbit parts (e.g., a leg sticking out of bushes) 
