  Here is the poem, crafted to embody Frege's puzzle through its structure and shift:

  **Venus Unveiled**

  Dawn's pale herald, first to greet the sun,  
  That silver witness we've watched from afar,  
  A steady beacon when the day's begun,  
  We name you **morning star**.  
  Your constant glow, a truth we hold so dear,  
  A single point that holds the breaking light,  
  This knowing feels complete, devoid of fear,  
  So plain and clear and right.

  Dusk's quiet sentry, last to leave the blue,  
  That silver witness we've watched from afar,  
  A final lantern bidding day adieu,  
  We name you **evening star**.  
  Your constant glow, a truth we hold so dear,  
  A single point that holds the fading light,  
  This knowing feels... a wonderment appears,  
  One rock, two names ignite.

  ---

  **Confidence Note:**

  *   **Highly Confident:** The identical structure and nearly identical wording between stanzas powerfully mirrors the **same reference** (Venus). The minimal substitution ("morning star" -> "evening star") perfectly embodies different **senses** (modes of presentation). The volta at the stanza break effectively creates the moment of realization that these distinct senses pick out the same object. The poem's form *shows* the Fregean distinction without needing to *tell* it.
  *   **Least Confident Point:** While the structural interchangeability of the names/terms within the identical stanzas brilliantly illustrates sameness of reference and difference of sense, I'm less certain it perfectly captures the full weight of what Frege meant by **cognitive value**. Frege's point is that "Hesperus is Phosphorus" has *different cognitive value* than "Hesperus is Hesperus" *because* of the different senses, *despite* the same reference. The poem *implies* this difference in cognitive value (through the shift from "devoid of fear/So plain and clear and right" to "a wonderment appears/One rock, two names ignite"), suggesting the *second* stanza brings new understanding. However, one could argue that treating the stanzas as structurally interchangeable units risks *downplaying* the very cognitive difference Frege highlights. Does the *form itself*, by being so similar, accidentally suggest the cognitive value *should* be the same? Frege would insist the difference in sense *makes* the cognitive value different, even if the linguistic units (stanzas) are otherwise identical in structure. This mapping is the trickiest philosophical point.
