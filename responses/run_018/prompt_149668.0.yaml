  First, I need to anticipate the most damaging objections. The audience cares about empirical evidence and micro-foundations, so the lack of direct evidence for the intergenerational trade-off mechanism will be the biggest weakness. That should be the question they hope nobody asks. 

  For ordering objections: The micro-foundations gap is most damaging because it attacks the core mechanism without empirical support. Then conceptual stretching since the audience prioritizes clear concepts. Followed by endogeneity because it challenges causality. Then non-falsifiability, functional alternatives, and finally normative contamination. 

  For replies: Where possible, I'll reframe in institutionalist terms - e.g., intertemporal reciprocity as a constitutional-level commitment device. For the micro-evidence gap, I'll pivot to institutional signals and elite discourse as proxies, but admit it's inferential. The soft spots should be explicitly flagged (e.g., "this relies on conceptual distinction").

  The upfront concession should be on endogeneity - it builds credibility to acknowledge growth/stability may precede authoritarianism rather than result from it. 

