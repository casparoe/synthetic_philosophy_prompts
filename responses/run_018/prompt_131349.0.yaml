answer: |-
  Here's a conceptual specification (desiderata) for a theory of transgenerational collective guilt, grounded in the core issues you raised:

  ### Core Desiderata (Conceptual Requirements)

  1.  **Distinction Maintenance (Guilt vs. Liability):**
      *   **Requirement:** Must rigorously distinguish *guilt* (a state of culpability/blameworthiness for wrongdoing) from *liability* (an obligation to repair harm or make amends).
      *   **Motivating Case:** Germany paying reparations (liability) does not automatically mean contemporary Germans *are guilty* of Nazi atrocities. A theory that conflates them unfairly burdens descendants with the *stain* of the crime itself.
      *   **Status:** **Non-negotiable** for most serious theories. Failure here fundamentally mischaracterizes the nature of responsibility. Liberal individualists and many restorative justice advocates agree on this distinction, though they diverge sharply on liability.

  2.  **Jaspers' Categories Preservation:**
      *   **Requirement:** Must respect and not collapse Jaspers' distinctions:
          *   **Criminal Guilt:** Individual legal culpability for specific acts.
          *   **Political Guilt:** Responsibility arising from being a citizen of a state that committed crimes, regardless of personal action.
          *   **Moral Guilt:** Personal complicity through support, passivity, or failure to resist.
          *   **Metaphysical Guilt:** A shared human solidarity that makes one feel responsible for evil existing in the world.
      *   **Motivating Case:** A soldier who committed war crimes (criminal) is fundamentally different from a citizen who passively benefited (political/moral), and both differ from a descendant feeling a sense of shame (metaphysical). Blurring these categories obscures the nature and locus of responsibility.
      *   **Status:** **Strongly Preferred / Often Non-negotiable.** Collapsing these categories is seen as a major flaw by theorists across camps (individualist, communitarian, restorative) who value nuanced moral analysis. It's essential for avoiding crude collectivism.

  3.  **Institutional Continuity Resolution:**
      *   **Requirement:** Must provide a coherent account of how guilt (specifically political guilt/liability) can persist across generations when the *individual members* of the collective (the citizenry) are entirely different. What is the bearer of the continuous identity?
      *   **Motivating Case:** The Federal Republic of Germany is legally continuous with the German Reich that committed the Holocaust, despite almost complete turnover in citizens. How does guilt/liability attach to the *state* or *nation* as an enduring entity distinct from its fleeting members?
      *   **Status:** **Core Problem / Non-negotiable to address.** Any viable theory *must* grapple with this. Failure means the theory cannot explain transgenerational persistence. Solutions vary wildly (e.g., state as moral agent, shared cultural identity, inherited obligations).

  4.  **Distributive Principle Specification:**
      *   **Requirement:** Must specify *how* guilt/liability is distributed *within* the contemporary collective. Is it equal per capita? Weighted by benefit derived from the past injustice? Weighted by identification with/participation in the perpetuating structures?
      *   **Motivating Case:** Does a descendant of Holocaust survivors turned German citizen bear the *same* share of German political guilt/liability as a descendant of a Nazi official? Does someone who actively promotes remembrance bear the same share as someone who denies history? Does someone materially benefiting from past injustice (e.g., inherited wealth) bear more?
      *   **Status:** **Highly Contested / Essential to Define.** Liberal individualists often reject *any* distribution of *guilt* but might accept unequal distribution of *liability* based on benefit/unjust enrichment. Communitarians/restorative justice advocates may accept more shared guilt/liability but still debate weighting. A theory must state its principle clearly.

  5.  **Temporal Dimension / "Moral Amortization":**
      *   **Requirement:** Must address whether and how the *intensity* or *nature* of collective guilt/liability changes over successive generations.
      *   **Motivating Case:** Can guilt/liability persist indefinitely? Does it weaken over time as direct links fade ("amortization")? Or are some crimes so heinous that the debt is "non-depreciating"? Does fulfilling reparations or achieving genuine reconciliation reduce it?
      *   **Status:** **Central Point of Contention.** This is where your "amortization schedule" concept is crucial. Liberal individualists lean heavily towards depreciation/expiry. Restorative justice advocates often emphasize enduring responsibilities until genuine repair/reconciliation is achieved. Nationalists might see it as eternal shame/glory.

  ### Key Tensions & Dealbreakers

  *   **Incompatibility Alert: Strong Continuity + Non-Depreciation + Individualist Distributive Principle:** It's extremely difficult to simultaneously hold that (a) the collective entity (state/nation) is a robust enough moral agent to bear *guilt* continuously, (b) this guilt does *not* depreciate significantly over generations, and (c) guilt/liability distributes *unequally* based on individual factors (like benefit) *within* the contemporary collective. (a) & (b) push towards a more holistic, shared responsibility model, while (c) pulls towards individualism.
  *   **The Jaspers Wall:** The single desideratum that **knocks out the most popular theories** is the rigorous maintenance of **Jaspers' Categories (Desideratum 2)**. Many simplified popular discourses (and some underdeveloped theories) *do* blur these categories, especially conflating political liability with moral or even criminal guilt. A theory that fails here is fundamentally flawed for nuanced analysis.
  *   **The Individualist Guillotine:** For strict **Liberal Individualism**, Desiderata 3 (Institutional Continuity for *guilt*), 4 (Distribution of *guilt*), and 5 (Persisting *guilt*) are often **jointly unsatisfiable**. They typically reject *any* notion of transgenerational collective *guilt* outright, accepting only potential transgenerational *liability* based on specific grounds like unjust enrichment or the state's continuous legal obligations, distributed according to benefit or citizenship duties, and potentially subject to amortization/statutes of limitation.

  This spec provides the conceptual framework to rigorously analyze theories of transgenerational collective guilt. Any viable theory must explicitly address these points and navigate the tensions between them. Your argument with your roommate likely hinges on which desiderata they prioritize (e.g., individualist rejection of guilt vs. communitarian acceptance of enduring political liability/guilt) and how they resolve the institutional continuity problem.
