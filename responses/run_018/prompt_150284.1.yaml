  ## The Chair Holds Court

  I swear this page shall turn to gold, they say,
  When distant suns ascend the scholar's sky.
  This ledger's logic, balanced in its way:
  One hour now for kingdoms by-and-by.
  The contract's signed by selves I yet shall be,
  A fair exchange on linear display.
  My future hand accepts this guarantee
  Of traded joy for more esteemed today.

  But midnight oil now stutters on the wick,
  The screen's allure becomes a sudden thrum.
  That golden page? A cold arithmetic
  Whose promised weight is instantly struck dumb.
  The later voice pleads reason, holds the chart...
  *This* moment writhes... (The deal? I...)
  ...can't.

  ---

  ### Brainstorm & Breakdown (as requested)

  1.  **The Linear Bargain Illusion:** The "committee of temporal parts" model imagines all future selves as equal voters, rationally striking deals across time via linear discounting. Today's sacrifice (studying) is *objectively* worth the future reward (degree).
  2.  **Hyperbolic Wreckage:** Hyperbolic discounting means valuations plummet *disproportionately* as rewards get closer. The *present* moment is astronomically more salient than any future. The "fair" linear deal becomes grotesquely unfair *from the viewpoint of the present self*.
  3.  **The Chair's Veto Power:** The present self isn't just one voter; it's the chair *presiding*. Its proximity grants it overwhelming, visceral weight ("proximity-weighted veto power"). Its "vote" isn't intellectual; it's an urgent, felt *need* or aversion.
  4.  **The Unsigned Contract:** Future selves "signed" the deal under linear logic, valuing the future reward highly. The present self, under hyperbolic siege, feels *zero* binding force from that "signature." The contract was made under a valuation regime that no longer applies *here and now*. It never truly bound *this* moment's sovereign.
  5.  **The Collapse:** When the hyperbolic curve steepens (the Volta: "midnight oil... screen's allure"), the abstract future reward ("golden page," "kingdoms by-and-by") instantly loses its motivating power ("struck dumb"). The present's visceral pull ("thrum," "writhes") overwhelms the abstract bargain. The chair vetoes. The committee is dissolved.

  ### How the Sonnet Embodies This

  *   **Octave:** Sets up the "fair" linear bargain with perfect ABAB CDCD rhyme (order, logic). Imagery: "page turn to gold," "distant suns," "ledger's logic," "fair exchange," "contract signed," "linear display." Future selves are active ("accepts," "signed").
  *   **Volta (Line 9):** "But midnight oil now stutters..." – The hyperbolic shift hits. The *present* sensation dominates.
  *   **Sestet Fracture:** Rhyme scheme breaks (EFG EFG - slant/consonant rhyme: wick/thrum, dumb/chart). Logic fragments. The future self is now distant and pleading ("later voice," "pleads reason," "holds the chart"). The present self is visceral ("writhes").
  *   **Final Couplet Split:**
      *   Line 13: The future self's fading, rational plea ("pleads reason, holds the chart").
      *   Line 14: The present self's fragmented, dominant veto. The complete collapse: "The deal? I...)" – the broken thought, followed by the isolated, present-tense fragment "...can't." The contract is void. The chair has spoken. Only the *now* remains.
