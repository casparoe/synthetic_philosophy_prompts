  Philosophically, Edmund Burke's idea of society as a contract between generations relates here. The unbroken chain acts as a trustee. Legal concepts like fiduciary duty in trusts might apply. Also, behavioral economics could have terms like "chain of responsibility heuristic," where people mentally discount if the chain isn't physical.

  I should check if there's an established term. "Intergenerational continuity premium" or "custodial discontinuity discount" might be coined terms. But perhaps it's more about the perceived break in moral agency transmission. The user wants precision: how is this different from risk? They mention people accept high risks in continuous cases but reject low risks in broken chains. So it's about control and predictability over the mechanism, not just the outcome's uncertainty.

  Key distinctions from institutional distrust: Distrust is skepticism about current institutions acting reliably. Here, it's about the impossibility of binding future entities, making the benefit contingent on their choices, which feels different than just unreliable actors. The break means future agents could reinterpret or redirect resources, so the benefit isn't assured regardless of current intentions.

