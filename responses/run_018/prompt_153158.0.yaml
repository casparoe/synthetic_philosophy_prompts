answer: |-
  You've hit on a profoundly important and under-discussed phenomenon in intergenerational ethics and institutional design. There isn't a single universally accepted term for this *specific* pattern, but it sits at the intersection of several well-established concepts. Let's define it precisely and distinguish it.

  **The Core Phenomenon: Custodial Continuity Discounting (or the Chain-of-Custody Effect)**

  *   **Definition:** A dramatic increase in the perceived discount rate or decrease in perceived moral obligation towards future generations when the mechanism for delivering a long-term benefit relies on a potentially discontinuous chain of institutional custodianship, compared to a mechanism perceived as having inherent, self-perpetuating continuity, *even when the nominal benefit, risk profile, and time horizon are identical*.
  *   **Key Differentiator:** The discontinuity isn't primarily about the *risk of failure* (though that plays a role), but about the *perceived break in moral agency and responsibility transmission*. The continuous chain acts as a direct extension of the present actor's will/intent, while the broken chain implies future agents are truly *different* decision-makers, making the benefit contingent on their choices.

  **Related Concepts & Why They Aren't Sufficient Alone:**

  1.  **Pure Time Preference/Hyperbolic Discounting:** Explains valuing the present more than the future, but doesn't account for the *discontinuity* effect. Your observation shows the discount rate isn't smooth or solely time-based; it spikes dramatically at the perceived break in custodianship.
  2.  **Risk & Uncertainty:** Future outcomes are always uncertain. However, you note people accept *high* objective risks with continuous custodians (e.g., a family trust might fail) but reject *low* objective risks with discontinuous custodians (e.g., a democratic government *might* change policy). The discount is applied based on the *type* of mechanism, not just the probability of failure. The perceived risk isn't just of *failure*, but of *intentional redirection* by future agents.
  3.  **Institutional Distrust:** This is closely related but distinct.
      *   **Distrust:** Skepticism that *current* institutions (or their immediate successors) will competently or faithfully execute their mandate *now* or in the near term. (e.g., "I don't trust this government to build a safe nuclear waste site *today*.")
      *   **Custodial Discontinuity Discounting:** Acknowledges that *even if we perfectly trust the current institution*, we cannot bind future, fundamentally different institutions/agents centuries hence. The discount arises from the *inherent inability to guarantee the persistence of intent* across the break, not necessarily from distrusting the *current* custodian. It's about the *structural fragility of the transmission mechanism* over deep time.
  4.  **Intergenerational Buck-Passing:** Explains avoiding costly actions now by assuming future generations will handle problems. Custodial discontinuity *enables* buck-passing by providing a psychological justification: "Those future agents won't be 'us,' so it's *their* problem to solve when they get there, not ours to pre-solve for them via fragile mechanisms."

  **Why the "Unbroken Chain" Matters:**

  1.  **Perpetuation of Agency & Will:** Entities like family trusts, endowed universities, or specific long-running programs are seen as vessels designed to *perpetuate the specific intent* of the founder/initial actor across time. Rules are "locked in." The chain feels like an unbroken extension of the original moral agent.
  2.  **Reduced Agency Risk:** Future actors within the chain (trustees, university presidents, program directors) are perceived as having constrained agency – their role is primarily custodial, executing the predefined mandate. Their ability to fundamentally redirect resources or intent is seen as limited.
  3.  **Tangible Continuity:** There's a physical or organizational lineage – the same legal entity, the same campus, the same core staff identity persists. This creates a sense of connection.
  4.  **Depersonalization of the Future:** Continuous chains abstract the future beneficiaries. They are "the trust's beneficiaries" or "future students," not specific unknown people governed by unknown future political systems. This abstraction feels less daunting than handing off responsibility to *future sovereign agents*.

  **How Discontinuous Custodianship Breaks the Chain:**

  1.  **Sovereign Future Agents:** Democratic governments, foundations with mutable charters, or new international bodies represent *future collective sovereign agents*. They are perceived as having the legitimate right (and likely desire) to set their *own* priorities based on *their* context. Our intent cannot bind them.
  2.  **Moral Disconnection:** There is no mechanism perceived to reliably transmit our *specific* moral obligation to *their* specific moral framework across the break. The chain of responsibility is severed.
  3.  **High Redirect Risk:** The perceived risk isn't just that the institution fails, but that it *succeeds* according to its *future* mandate, which may deprioritize or redirect resources away from *our* specific intended benefit for those distant people.
  4.  **Lack of Control Transmission:** We have no way to ensure the *next* custodian after the break (let alone custodians 10 breaks later) shares our commitment or understands our intent in the same way the "locked" chain supposedly does.

  **Precise Edges of the Concept:**

  *   **Core Trigger:** The perception of a future point where custodial responsibility *must* pass to an entity or collective with fundamentally different origins, governance, and presumed sovereign agency, incapable of being bound by the current actor's specific intent.
  *   **Distinguishes from Simple Distrust:** Applies even to highly trusted *current* institutions if their structure allows future redirection by different agents (e.g., trusting *this* democratic government but knowing future ones can change course). Conversely, one might distrust a specific family trust *now* but still acknowledge the *principle* of its continuity.
  *   **Distinguishes from Pure Time Preference:** The discount rate spikes *specifically* at the perceived point of custodial discontinuity, not smoothly over time. Two benefits 200 years out have vastly different perceived values based *only* on the custodial path.
  *   **Distinguishes from Outcome Risk:** People accept high failure risks (e.g., geological repository leakage) under continuous custody but reject lower risks of redirection (e.g., future government reallocating funds) under discontinuous custody. The aversion is to the *type* of uncertainty (sovereign redirection vs. passive failure).

  **Scholarly Touchpoints:**

  *   **Martin Weitzman:** His work on "Gamma Discounting" deals with deep uncertainty about the *future discount rate itself*, which relates to the uncertainty about future preferences/priorities inherent in custodial discontinuity.
  *   **Intergenerational Equity Literature (Edith Brown Weiss, Wilfred Beckerman):** Discusses obligations to future generations but often grapples with the *mechanism* problem you identify.
  *   **Institutional Economics (Douglass North, Elinor Ostrom):** Focuses on how institutions persist and change, relevant to understanding what makes a custodial chain feel "unbreakable."
  *   **Philosophy (Edmund Burke, Derek Parfit):** Burke's "partnership... between those who are living, those who are dead, and those who are to be born" implies continuity. Parfit's "Non-Identity Problem" touches on obligations to specific future people whose existence depends on our choices, but the custodial chain adds a layer about *how* we relate to them.
  *   **Behavioral Economics (Heuristics & Biases):** This effect likely involves a cognitive heuristic where responsibility feels concrete only across tangible, continuous entities. A broken chain triggers psychological distance.

  **Conclusion:**

  You've identified **Custodial Discontinuity Discounting** or the **Chain-of-Custody Effect**. It's the sharp devaluation of obligations to the far future specifically when the mechanism for fulfilling them requires passing responsibility through a point where future *sovereign agency* takes over, severing the perceived continuity of intent and creating a sense that "those future people belong to a different moral community governed by different agents." This is distinct from distrusting current actors, fearing passive failure, or simply valuing the near term more. It highlights a profound challenge for long-term democratic governance and global collective action: how to create institutions that feel like legitimate, continuous custodians across centuries, capable of carrying specific moral obligations intact through inevitable political, social, and cultural ruptures. This is arguably *the* central institutional design problem for managing intergenerational public goods like climate stability or nuclear safety.
