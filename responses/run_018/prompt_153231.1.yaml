  First, I need to reject false equivalences. While archives are indeed flawed (colonial biases, lost records etc.), that doesn't make oral tradition automatically more reliable. The carbon dating example is telling: scientific dating methods have verifiable error margins, whereas the shipwreck story could be symbolic or conflated events. The treaty case is trickier - the "forged later" detail implies historians have material evidence, not just absence in records.

