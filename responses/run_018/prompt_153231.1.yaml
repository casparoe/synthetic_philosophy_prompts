answer: |-
  This isn't just a verbal dispute or a simple clash over evidence standards. It's a **fundamental conflict of epistemic values rooted in divergent purposes for engaging with the past**. Your friend prioritizes *social cohesion and identity formation* ("mnemonic sovereignty"), while you prioritize *factual accuracy and corrective potential* ("historical discipline"). While both viewpoints recognize archives' flaws, they draw opposite conclusions: she sees flaws as reason for community self-determination over narrative, you see them as flaws demanding correction.

  **Why Mnemonic Sovereignty is Problematic (and Your Friend is Wrong):**
  1.  **It's Epistemologically Bankrupt:** Treating demonstrably false beliefs (like a 250-year dating error confirmed by carbon dating) as "sovereign" abandons truth-seeking. It reduces history to therapeutic fiction. While sociology studies *how* myths function, elevating them to "authority" based solely on social utility conflates description ("myths bind people") with prescription ("therefore, they *should* be authoritative").
  2.  **It's Dangerously Relativistic:** If every community's cherished narrative is sovereign, how do we adjudicate *conflicting* sovereign memories? Your land claim example is crucial: Cadastral records, however imperfect, provide a verifiable (and legally recognized) framework. "Sovereign memory" justifying occupation based on false ancient claims leads directly to injustice and conflict.
  3.  **It Undermines History's Corrective Power:** History's unique value lies in its ability to challenge present myths using evidence. The unratified treaty holiday *is* propaganda if knowingly based on a forgery. Mnemonic sovereignty shields harmful or manipulative myths from scrutiny. Archives *are* biased, but the solution is critical analysis and adding *more* evidence (e.g., marginalized voices), not abandoning verification.
  4.  **It Misapplies Valid Critiques:** Recognizing archives' biases (colonial, elitist, incomplete) is vital. But this doesn't mean *all* archival evidence is equally unreliable or that *any* oral tradition is equally valid. Carbon dating vs. an uncorroborated shipwreck story isn't a clash of equal "perspectives"; it's science contradicting folklore. Using archive flaws to justify uncritical acceptance of *contradictory* community narratives is a non sequitur.

  **Where You're Closer to Being Right (but Need Nuance):**
  You correctly identify history's core function as a discipline that *can and must* contradict cherished beliefs using evidence. Accuracy isn't just an academic fetish; it's essential for justice (land claims), accountability (treaty legitimacy), and preventing manipulation (propaganda). Your "corrective" impulse is vital.

  **However:**
  *   **History isn't *just* about facts:** It *also* interprets meaning, which is where community perspectives are crucial. The *meaning* of the shipwreck story to the coastal town, or the *symbolic value* of the unratified treaty holiday, are valid subjects of historical and sociological study.
  *   **Archives aren't the *only* evidence:** Oral histories, archaeology, linguistics are vital sources. A good historian uses *all* available evidence critically. The "archive" vs. "memory" binary is sometimes false; oral traditions *can* be remarkably accurate and fill archival silences.
  *   **"Social work" matters:** Understanding *why* a community holds a belief, even if false, is historically and socially important. Suppressing that belief is often counterproductive; understanding its function and origin is key.

  **Can Progress Be Made? Yes, Through Nuance and Context:**
  1.  **Distinguish Functions:** Separate *commemorative/identity-building practices* from *factual historical claims*. A town can celebrate a founding myth *as myth* while acknowledging the archaeological date. A nation can keep the holiday for its *symbolic meaning* while teaching the complex history of the unratified treaty. This preserves cohesion without demanding belief in falsehoods.
  2.  **Focus on Harm:** Prioritize accuracy where false beliefs cause tangible harm (land rights, justifying discrimination, political manipulation). Be more flexible where the stakes are purely symbolic identity (if the falsehood isn't itself harmful or exploitative).
  3.  **Collaborative History:** Involve communities in historical research. Use their knowledge and perspectives to *ask better questions* of the archives and other evidence, filling silences *with* evidence, not just competing narratives. This builds trust and makes corrections more palatable.
  4.  **Acknowledge the "Why":** Historians must take community memory seriously *as an object of study* – understanding its origins, evolution, and social function – even when correcting its factual claims. This shows respect without conceding sovereignty over facts.

  **Conclusion:** "Mnemonic sovereignty" as an *alternative authority* to historical methodology is incoherent and dangerous. It confuses the social function of belief with its truth value and abandons the essential task of verification, enabling harm. You are closer to being right: History's discipline, flawed as it is, provides the only viable method for establishing a shared, corrigible factual baseline essential for justice and preventing manipulation. However, recognizing the profound *value* communities place on their narratives, understanding their social function, and finding ways to incorporate meaning without sacrificing core facts is where genuine progress lies. The goal shouldn't be "memory vs. record," but using rigorous methods to build a richer, more inclusive, *and more accurate* understanding of the past that respects both evidence and meaning.

  **Core Diagnosis:** Bedrock conflict over history's purpose: identity cohesion versus factual accuracy.

  \answer{Epistemic values conflict: identity cohesion vs. factual accuracy}
