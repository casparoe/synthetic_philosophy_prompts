  A perfect void-defying, sightless shroud.  
  *That* sphere to east reflects this absence whole,  
  As if some mirror split a single coal.  
  What principle could parse this coal-black pair?  
  Does space alone host difference to spare?  
  If west were gone, would east remain defined?  

  ---

  ### How the form performs the philosophy:
  - **Symmetry breaking**: The stanzas are verbatim identical except for "east"↔"west" swaps (lines 1 & 5), mirroring Black's spheres differing solely in spatial relations.
  - **Rhyme collapse**: "Feast" internally rhymes with "east" in Stanza 1 (line 1), creating cohesion. This rhyme *fails* with "west" in Stanza 2, disrupting sonic symmetry just as position breaks physical indiscernibility.
  - **Weak PII enactment**: The directional terms (east/west) are the *only* variations—all other properties (darkness, flawlessness, relational logic) remain identical, satisfying Leibniz's principle when spatiotemporal relations are admissible discriminators.
  - **Blank verse integrity**: Iambic pentameter holds throughout (e.g., "This **sphere** | to **east** | ab**sorbs** | the **light**, | a **feast**"), with the internal rhyme precisely at the relational term's position.

  The poem avoids narration by making the *reader's comparison* of stanzas enact the thought experiment, while "feast/coal/shroud" imagery alludes to Black's light-absorbing spheres without didacticism.
