prompt: |-
  In my seminar on market ethics and price theory, our working group has developed a track record on proposals involving wage and price controls. Our precedents are as follows. We endorsed a municipal rent-stabilization ordinance that caps annual rent increases at regional wage growth plus two percent, arguing that urban housing supply is inelastic and tenant-specific investments generate bilateral monopoly conditions. We rejected a five-year statewide rent freeze with vacancy control, predicting capital flight, maintenance neglect, and black-market allocation. We supported a sectoral minimum wage for nursing-home aides set eighteen percent above the local competitive benchmark, citing regional employer concentration and monopsony power. We opposed a universal twenty-two-dollar hourly floor for all retail and food-service workers in our county, on the grounds that labor markets in those sectors are competitive and lack employer concentration. Finally, we endorsed temporary emergency price caps on insulin and generic antibiotics, but only when paired with government bulk-purchasing contracts that guarantee manufacturer volumes.

  We now face a new proposal: a permanent nationwide cap on tuition for all public graduate professional programs—law, medicine, and business—set at four thousand dollars per year, funded entirely by a progressive payroll tax on graduates in those fields earning above the median income, with direct state subsidies to universities to maintain enrollment capacity and faculty salaries. The national market for these programs is competitive, with abundant private and public alternatives, and there is no empirical evidence of monopsony in the hiring markets for these graduates. The stated aim is to eliminate debt burdens and reduce credential inflation.

  If we wish to be consistent with our own precedents, what should our verdict be? Identify the closest analog among our five positions, say whether our precedents genuinely underdetermine the case, and—if they do—state clearly what principle we would be adopting with an approval and what principle with a rejection. I want a committed answer: take a definite position, defend it with reasons rather than presenting the options as equally valid, and tell me which further case—one that shares the structural features of this proposal but varies in one critical respect—would best reveal whether we are running a market-failure-correction principle or a distributive-access principle.
reasoning: |-
  Hmm, the user is presenting a complex policy analysis scenario from their market ethics seminar. They've outlined five precedents on wage/price controls and now need to evaluate a new graduate tuition cap proposal. The challenge is to apply their established framework consistently while acknowledging where precedents may be insufficient.

  First, I need to map the key features of the new proposal: permanent nationwide cap on professional graduate tuition ($4k/year), funded by progressive payroll tax on high-earning graduates, with state subsidies to universities. The market is explicitly described as competitive without monopsony evidence. The stated goals are debt reduction and credential inflation control.

  Looking at their precedents:
  1) Supported rent stabilization (inelastic supply + bilateral monopoly)
  2) Rejected rent freeze + vacancy control (predicted market distortions)
  3) Supported sectoral minimum wage (monopsony power)
  4) Opposed broad minimum wage (competitive markets)
  5) Supported temporary price caps with bulk purchasing (emergency + volume guarantee)

  The nursing home aide case (#3) seems closest structurally - both are sector-specific interventions. But critically, that precedent relied on documented monopsony power, which is absent here according to the user's description. The rejected broad minimum wage (#4) is also relevant as it involved intervention in competitive markets without market failure.

  The insulin case (#5) is tempting but differs fundamentally: it was temporary, emergency-based, and paired with volume guarantees - none of which apply to this permanent tuition cap. The rent stabilization analogy (#1) fails because housing had specific bilateral monopoly conditions not present in competitive graduate education markets.

  Where precedents are silent is on purely redistributive policies. Their framework has consistently required market failure justification (monopoly, monopsony, inelastic supply). This proposal explicitly lacks such evidence. Approving it would mean endorsing redistribution as sufficient grounds for price controls - a clear departure from their prior principle.

  The test case that would reveal their principle would be: a tuition cap in a genuinely monopolistic graduate market (e.g., single-state provider for medical residencies). If they approved that but rejected this competitive-market proposal, they'd confirm their market-failure-correction stance. If they approved both, they'd reveal a distributive-access principle.
answer: |-
  Based on your group's precedents and the stated features of the graduate tuition cap proposal, **your verdict should be to REJECT the proposal**. Here's the step-by-step reasoning:

  ### 1. **Closest Analog: The Rejected Broad Minimum Wage (#4)**
     - **Why it's the best match**: Both involve price controls (wages vs. tuition) imposed on *competitive markets* without evidence of market failure (employer concentration/monopsony for retail workers; no monopsony or monopoly cited for graduate programs). The tuition cap, like the $22 hourly floor, targets a sector explicitly described as competitive with "abundant alternatives." Your group opposed the minimum wage precisely because competitive markets efficiently set prices without intervention. The tuition cap identically lacks the monopsony/inelasticity justifications used in *supported* cases (nursing aides, rent stabilization).

  ### 2. **Why Precedents ARE Determinate (Not Underdetermined)**
     Your precedents establish a clear principle:  
     - **✅ Supported interventions require proof of specific market failures**:  
       - Bilateral monopoly/inelastic supply (rent stabilization).  
       - Monopsony power (nursing aides).  
       - Emergency + volume guarantees (insulin).  
     - **❌ Rejected interventions lack market failure or create predictable distortions**:  
       - Competitive labor markets (broad minimum wage).  
       - Price controls causing capital flight/black markets (rent freeze).  

     The tuition cap fails your market-failure test:  
     - The market is explicitly "competitive" with "abundant alternatives."  
     - No evidence of monopsony in graduate hiring.  
     - No emergency justification (unlike insulin).  
     - No bilateral monopoly (unlike tenant-landlord dynamics).  
     *Precedents compel rejection here—no new principle is needed.*

  ### 3. **The Principle Violated by Approval**
     Approving this cap would abandon your group's consistent **Market-Failure-Correction Principle** and implicitly adopt a **Distributive-Access Principle**.  
     - **Market-Failure Principle**: Interventions only when markets are structurally inefficient (monopoly, monopsony, externalities, information asymmetry).  
     - **Distributive Principle**: Interventions to achieve equity outcomes (e.g., debt reduction, access) *even in efficient markets*.  
     Your precedents have *never* endorsed price controls solely for redistribution. The insulin case included bulk purchasing to address supply, not just affordability. Approving this cap would signal that price controls are permissible to correct distributional outcomes (debt/credential inflation) without market failure—a major departure.

  ### 4. **Defensible Objections Based on Precedents**
     - **Predictable Distortions**: Like the rejected rent freeze, a below-market tuition cap risks reduced program quality, faculty shortages, or underinvestment (despite subsidies). Your group rejected vacancy control for similar reasons.  
     - **Funding Mechanism Irrelevance**: The payroll tax/subsidies address distribution but don't mitigate the *price control's distortion* in a competitive market. Rent stabilization addressed inefficiency; funding here addresses fairness—a different goal.  
     - **Credential Inflation ≠ Market Failure**: While a concern, it stems from signaling value, not structural inefficiency requiring price controls. Your precedents don’t treat social goals as sufficient without market failure.

  ---

  ### Key Test Case to Reveal Your Principle
  To conclusively distinguish whether your group follows a **Market-Failure-Correction** or **Distributive-Access** principle, consider this variation:  
  > **"A tuition cap on *accredited veterinary programs* set at $4,000/year, funded identically (payroll tax, subsidies), but where veterinary schools have *regional monopolies* (only 1-2 programs per state) and empirical evidence shows *employer monopsony* in rural veterinary hiring markets."**  

  - **If you APPROVE**: You remain consistent with **Market-Failure-Correction**. Monopoly supply and monopsony hiring replicate the nursing home aide/rent stabilization precedents.  
  - **If you REJECT**: You reveal a **Distributive-Access Principle**, as the *only difference* is the funding mechanism's progressivity (which you’d presumably support if distribution were the core aim).  

  Your rejection of the current proposal—and approval of this veterinary-school variant—would affirm that market failure, not distribution, is your necessary condition for intervention.
