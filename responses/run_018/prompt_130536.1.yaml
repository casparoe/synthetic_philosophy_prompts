  That defamation sanctions case would reveal retributive bias - if someone calls for sanctions after legal acquittal, it's purely expressive condemnation detached from violation proof.
answer: |-
  Here's a punishment identification procedure based on philosophical criteria, designed as a 15-minute checklist with evidence markers. It synthesizes retributivism (deserved censure for wrongdoing), deterrence (preventing future harm), and Feinberg's expressive function (societal condemnation).

  **The Punishment Identification Checklist**  
  *(Run sequentially - a "no" at any gate stops the process)*

  1. **EXPLICIT NORM VIOLATION**  
     *Question:* Was there a clearly defined rule/standard *at the time of the act*, communicated to the actor?  
     *Evidence Check:* Written policies, codes of conduct, contracts, or unambiguous community standards pre-dating the act. Public statements don't count unless codified.  
     *Gate:* **Yes** = Proceed. **No** = Not punishment.

  2. **FORMAL SANCTIONING AGENT**  
     *Question:* Did an entity with *recognized authority* over the platform impose the sanction?  
     *Evidence Check:* Entity holds contractual/legal control (employer, platform owner, institution). Crowd backlash alone fails.  
     *Gate:* **Yes** = Proceed. **No** = Not punishment.

  3. **RETRIBUTIVE INTENT (Deserved Suffering)**  
     *Question:* Did the sanctioning agent frame the action as a *response* to the specific violation?  
     *Evidence Check:* Official statement citing the act as justification, using terms like "consequence," "accountability," or "violation." Neutral/forward-looking language fails.  
     *Gate:* **Yes** = Punishment likely. **No** → Check Gate 4.

  4. **DETERRENCE/EXPRESSIVE FUNCTION**  
     *Question A (Deterrence):* Did the agent cite *preventing future harm* as a primary reason?  
     *Question B (Expressive):* Did the agent explicitly *condemn the act* as wrong for the community?  
     *Evidence Check:* Statements referencing "safety," "precedent," "setting standards," or moral condemnation ("unacceptable," "harmful," "against our values").  
     *Gate:* **Yes to A or B** = Punishment. **No to both** = Not punishment.

  ---

  **Key Distinctions Handled**  
  - **Preemptive vs. Reactive:** Gate 1 requires a violation. Preemptive exclusions (e.g., denying a platform *before* wrongdoing) fail.  
  - **Private vs. Quasi-Public:** Gate 2 focuses on authority, not space type. A university (quasi-public) or corporation (private) both qualify if they control access.  
  - **Values/Facts Boundary:** Gates 1 and 2 are **fact-based** (evidence searches). Gates 3 and 4 interpret intent but use **publicly stated reasons** (evidence exists). Normative judgment starts *after* classification.

  ---

  **Case Analyses**  

  **CASE 1: University Pulls Speaker Invite Over Old Tweets**  
  1. **Explicit Norm:** University conduct policies likely existed when tweets were posted? *Yes* → Proceed.  
  2. **Sanctioning Agent:** University has authority over invites? *Yes* → Proceed.  
  3. **Retributive Intent:** Did they cite "holding accountable for past actions"? *Likely yes* → **PUNISHMENT**.  
  *(If unclear, Gate 4: They’d likely express condemnation or deterrence → Still punishment)*  

  **CASE 2: Platform Demonetizes Creator for Breaking Brand-New Policy**  
  1. **Explicit Norm:** Policy announced *yesterday*? Act preceded policy → **NO**.  
     → *STOP: Not punishment* (Failure at Gate 1).  
  *(Even if Gates 2-4 pass, retroactive rule application fails the core "violation" requirement)*  

  **Gut Check Explained:** Your gut says demonetization *feels* punitive (and it might be unfair), but retroactive rules violate the foundational philosophy of punishment (no "wrongdoing" without prior notice). This is likely **risk management**, not censure.

  ---

  **Limitations of the Procedure**  
  - Cannot assess **proportionality** (e.g., was sanction too harsh?).  
  - Cannot detect **implicit bias** or hidden motives behind sanctions.  
  - Struggles with **collective sanctions** (e.g., punishing a group for an individual's act).  
  - Doesn't address **fair process** (e.g., was the actor heard?).

  ---

  **Test Case: Retributive vs. Expressive Model**  
  **Scenario:** *A journalist is fired after being acquitted in court for alleged misconduct. The employer states: "We must uphold our reputation."*  
  - **Retributive Test:** Gate 3 fails (no "deserved suffering" cited; acquittal suggests no wrongdoing).  
  - **Expressive Test:** Gate 4B passes (condemnation via "upholding reputation").  
  - **Verdict:** If the checklist calls this punishment, it's prioritizing **expressive function** over retributivism (condemnation without proven guilt).

  This procedure draws clear lines using public evidence while respecting philosophical foundations. Use it to show readers *why* some sanctions aren't punishment—even when they sting.
