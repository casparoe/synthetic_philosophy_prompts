prompt: |-
  hey — i cover science and ideas for a magazine and every other week i have to write about someone losing a platform or getting disinvited, and readers always ask whether its actual punishment or just some other kind of social sanction. i want a decision proceedure — like, a checklist in order — that i can run in 15 minutes based on actual philosophy of punishment, not vibes. include the retributive and deterrence angles, plus that expressive or communicative thing feinberg writes about, but translate it into gates i can answer yes/no with evidence i can actually gather without a law degree.

  the proceedure needs to handle preemptive vs reactive sanctions, and private vs quasi-public spaces, and it should flag the exact point where values take over from facts. run it on two cases: a university pulling a speaker invite because old tweets resurfaced, and a social media platform demonetizing a creator for one video that breaks a policy they just added yesterday. one of these should come out not-punishment even though my gut says it is. also say what the proceedure cant do, and name one more case that would tell me whether im running an expressive model or a retributive one.
