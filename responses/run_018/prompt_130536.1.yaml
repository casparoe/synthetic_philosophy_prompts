  Hmm... their examples reveal key tensions: university disinvitations test retroactive application of norms, while sudden demonetization probes policy consistency. The "not-punishment" gut-check requirement suggests they've faced criticism for overapplying the term. Interesting they mention Feinberg - that expressive function angle is crucial for modern platform dynamics.

  For the framework, I'll need to:
  - Anchor definitions in legal philosophy but strip academic jargon
