answer: |-
  Here's the core weirdness: **If most driving is sub-routine autopilot, when does "she" actually *do* the driving?** Suddenly, "her" action dissolves into a bunch of micro-habits running without "her".

  *   **Bottom Line:** We chunk "drive to Denver" as *one* intentional act she chose. But if you zoom in, conscious "her" (the one replaying the argument) only *started* the car and vaguely aimed it west hours ago. The actual steering, braking, lane-keeping for 180 miles? That was zombie routines. So did *she* drive past Denver, or did her body-pilot malfunction while her mind was elsewhere? Where's the "I" in "I drove"?
  *   **Why it gets messy:**  
      You'd normally say she intentionally drove the car *because* she intended the trip (belief: car goes places, desire: get to Denver). But here, *during* the crucial miles, her conscious mind was *gone*. The sub-routines weren't executing *her current* intention (which was probably "get to Denver"), they were just... running. Like a wind-up toy.  
      So, was "driving past Denver" an action *of hers*? If yes, it happened without any conscious beliefs/desires guiding it *at the time*. If not, then who *was* controlling the 2-ton death machine? Her foot was on the pedal, her hands on the wheel... but her *mind* was yelling at her sister.  
      It makes "action" feel like a time-lapse photo – stitched together from moments where "she" was barely present. And if you argue only the *conscious* bits count as *her* acting... well, she wasn't acting for most of that drive. That feels wrong, but the alternative (saying the autopilot routines *are* "her" acting) makes "her" kinda hollow. Weird, right? Like trying to grab smoke.
