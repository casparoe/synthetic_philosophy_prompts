prompt: |-
  I'm a senior researcher at a genocide-studies archive who must code perpetrator testimonies for an exhibition, classifying each account as best explained by situational conformity and peer pressure in the moment (in the manner of Browning's analysis of Reserve Police Battalion 101) or by prior ideological commitment and culturally embedded hatred (in the manner of Goldhagen's thesis of eliminatory antisemitism). I apply this dozens of times under time pressure, with only a research assistant checking consistency, and the museum director must sign off on any classification that exculpates. Write a reusable decision procedure—ordered questions with evidence thresholds—that I can run on a testimony and its contextual record. Include a step testing for "discursive residue" (whether the perpetrator uses bureaucratic euphemism versus explicit eliminationist language) and a step testing for "unobserved deviation" (whether the actor refused or modified orders when not directly supervised). For each step, specify what answer pushes the classification toward situational, toward ideological, or into an undetermined zone; mark explicit stop points where evidence is insufficient and the default must be "undetermined" rather than either explanation; and flag where the framing becomes a value judgment (e.g., whether a situational explanation amounts to moral excuse) that must be escalated to the director rather than resolved by procedure. Apply it to two cases: (a) a policeman who requested transfer after his first shooting, was denied, and continued; and (b) a local official who volunteered for auxiliary duties, used explicit racial slurs in private letters, but later claimed he was only following orders—this second case should yield a classification I will find uncomfortable. Conclude with an honest statement of what the procedure cannot settle, especially retrospective testimony bias, and identify which judgments remain irreducibly interpretive. Finally, say what would change your verdict on this framework: which empirical finding about perpetrator motivation or which conceptual argument about how situational and ideological factors interact would lead you to revise the procedure's weighting, and point to the specific step in your reasoning most likely to fail.
reasoning: |-
  We are creating a decision procedure for classifying perpetrator testimonies into two categories:
   1. Situational conformity and peer pressure (Browning-style)
   2. Prior ideological commitment and culturally embedded hatred (Goldhagen-style)

   The procedure will be a series of ordered questions. Each question will have:
     - Criteria to push toward "Situational"
     - Criteria to push toward "Ideological"
     - Criteria that leave it "Undetermined"
     - Possible stop points (if insufficient evidence, default to "Undetermined")
     - Flags for value judgments that require escalation to the director.

   Steps:

   Step 1: Discursive Residue (Language Analysis)
     - Examine the language used by the perpetrator in testimony and contemporaneous documents (e.g., letters, orders, diaries).
     - **Toward Situational**:
          - Predominant use of bureaucratic euphemisms (e.g., "evacuation", "special treatment") without explicit hate language.
          - Avoidance of explicit dehumanizing or eliminationist terms when describing victims.
     - **Toward Ideological**:
          - Use of explicit racial, ethnic, or religious slurs; dehumanizing language (e.g., "vermin", "bacillus"); or eliminationist terms (e.g., "exterminate", "annihilate").
          - Expressions of ideological alignment (e.g., endorsing the regime's goals, expressing hatred) in private writings or conversations.
     - **Undetermined**:
          - Mixed evidence (some euphemistic, some explicit) without clear predominance.
          - Absence of sufficient linguistic evidence (e.g., only formal reports with no personal commentary).
     - **Stop Point**: If there is no contemporaneous linguistic evidence (only post-war testimony), mark as undetermined and stop further analysis? 
          - Actually, we might continue to other steps, but note the gap. However, without contemporaneous language, we cannot firmly assign based on this step.

   Step 2: Unobserved Deviation (Behavioral Analysis)
     - Examine whether the perpetrator refused, avoided, or modified orders when unsupervised or in contexts where refusal was possible without immediate punishment.
     - **Toward Situational**:
          - Documented instances of refusal or avoidance when unsupervised (e.g., slipping away, volunteering for non-lethal tasks, helping victims covertly).
          - Evidence of distress or moral conflict (e.g., diary entries, witnessed breakdowns) without explicit rejection of the ideology.
     - **Toward Ideological**:
          - No observed deviation even when unsupervised; going beyond orders (e.g., volunteering for extra killing duties, initiating violence without orders).
          - Evidence of proactive involvement (e.g., organizing actions, recruiting others, expressing enthusiasm).
     - **Undetermined**:
          - No evidence of behavior in unsupervised contexts (e.g., always in group settings, no private writings about actions).
          - Contradictory evidence (e.g., one instance of refusal but multiple of enthusiastic participation).
     - **Stop Point**: If there is no evidence about behavior in unsupervised contexts, mark this step as undetermined and proceed to next steps, but note the gap.

   Step 3: Prior and Contemporaneous Expressions of Ideology
     - Examine the perpetrator's background: membership in ideological organizations, prewar writings, postwar testimony, and expressions during the events.
     - **Toward Situational**:
          - No prior affiliation with extremist groups; prewar record shows tolerance or even positive relations with the victim group.
          - Expressions during the events (if any) focus on duty, fear, or peer pressure without ideological content.
     - **Toward Ideological**:
          - Prior active membership in radical political or racist organizations; prewar expressions of hate or support for eliminationist policies.
          - Contemporaneous expressions (in private) that align with the regime's ideology.
     - **Undetermined**:
          - Limited background information; ambiguous affiliations (e.g., mandatory party membership without activism).
     - **Stop Point**: If there is no information about the perpetrator's background and no contemporaneous expressions, mark as undetermined.

   Step 4: Post-Hoc Justifications in Testimony
     - Analyze the perpetrator's testimony (especially postwar) for patterns of explanation.
     - **Toward Situational**:
          - Emphasizes fear of punishment, peer pressure, or the chaos of the situation; minimizes personal agency.
          - Expresses regret or moral anguish, but attributes actions to situational factors.
     - **Toward Ideological**:
          - Justifies actions by the ideology (e.g., "they were a threat", "it was necessary"); denies regret; or blames victims.
          - Expresses continued adherence to the ideology.
     - **Undetermined**:
          - Testimony is unavailable, or it is entirely self-exculpatory without any internal consistency or corroboration.
          - The testimony is so heavily shaped by legal strategy or societal pressures that it is unreliable.
     - **Note**: This step is particularly vulnerable to retrospective bias. We must weigh against other evidence.

   Step 5: Pattern of Behavior Over Time
     - Look for changes in behavior: initial reluctance followed by habituation? Or consistent enthusiasm?
     - **Toward Situational**:
          - Evidence of initial resistance (e.g., refusal, transfer requests) that was overridden, followed by reluctant compliance.
          - Gradual desensitization without expressions of ideological conversion.
     - **Toward Ideological**:
          - Consistent enthusiasm from the start; seeking more involvement.
          - No evidence of reluctance at any stage.
     - **Undetermined**:
          - Behavior is inconsistent or the record is incomplete.

   Step 6: Aggregation and Decision
     - Tally the steps that point to Situational, Ideological, or Undetermined.
     - If a step is undetermined, it doesn't contribute to either category.
     - If there is a clear majority (e.g., 3 steps toward Situational and 1 toward Ideological, with 1 undetermined), then classify accordingly.
     - If there is a tie or a close balance, then mark as undetermined.

   Special Considerations:
     - **Escalation to Director**: Any classification that leans toward situational must be escalated to the director for sign-off because it may be perceived as exculpatory. Additionally, if the analysis in any step requires a value judgment that goes beyond the evidence (e.g., interpreting whether a request for transfer was due to moral qualms or fear of physical discomfort), then that step should be flagged for director review.

     - **Stop Points**: If at any step the evidence is insufficient and the step is marked undetermined, and if after Step 5 the overall picture remains undetermined (i.e., no clear majority), then the default classification is "Undetermined".

   Applying to Cases:

   Case (a): Policeman who requested transfer after his first shooting, was denied, and continued.
     - Step 1 (Discursive Residue): Assume no contemporaneous writings. Undetermined.
     - Step 2 (Unobserved Deviation): He tried to avoid (by transfer request) but then continued. This is a form of deviation attempted but under supervision? The request was made, so it's observable. But note: he did not deviate after the denial. So, not unobserved deviation? We might say: he deviated only when supervised (by asking his superior) and then complied. This step may lean toward Situational because he tried to avoid but was forced to continue. However, without evidence of covert refusal, it's not strong. Let's say: Toward Situational (because of the attempt to avoid, even if observed).
     - Step 3 (Prior Ideology): Assume no prior evidence. Undetermined.
     - Step 4 (Post-Hoc): Testimony might say he was distressed and didn't want to. Toward Situational.
     - Step 5 (Pattern): Initial reluctance (request transfer) and then continued. Toward Situational.
     - Aggregation: 
          - Situational: Steps 2, 4, 5 (3)
          - Ideological: 0
          - Undetermined: Steps 1,3 (2)
     - Classification: Situational (with escalation to director because it exculpates).

   Case (b): Local official who volunteered for auxiliary duties, used explicit racial slurs in private letters, but later claimed he was only following orders.
     - Step 1: Private letters with racial slurs -> Toward Ideological.
     - Step 2: Volunteered for duties -> no deviation, even proactive -> Toward Ideological.
     - Step 3: Volunteering and slurs suggest prior ideological commitment -> Toward Ideological.
     - Step 4: Claims "only following orders" -> but this is post-hoc and contradicts volunteering. We might interpret as self-exculpatory lie. Toward Ideological (because the claim is not credible in light of volunteering).
     - Step 5: Volunteered from the start -> Toward Ideological.
     - Aggregation: All steps Toward Ideological -> Classification: Ideological.

     However, note that the testimony claims "following orders". But the procedure overrides that with contemporaneous evidence. This case should be uncomfortable because the official is trying to excuse himself, but the evidence points to ideology.

   Honest Statement of Limitations:

   The procedure cannot settle:
     - The inherent bias in retrospective testimony (especially when given under legal or social pressure).
     - The possibility of mixed motives (both situational and ideological factors interacting).
     - The exact weight of each piece of evidence (e.g., how much does one slur in a letter count?).

   Irreducibly interpretive judgments:
     - Interpreting the meaning of language (e.g., is a euphemism always non-ideological?).
     - Deciding when an action (like volunteering) is due to ideology versus careerism or fear of being seen as disloyal.
     - Assessing the sincerity of expressions of regret.

   What would change the verdict on this framework?

     Empirical finding: If a large-scale study of perpetrators shows that explicit hate language in private letters does not correlate with enthusiastic participation (i.e., it was just common talk without behavioral implications), then Step 1 (Discursive Residue) would need reweighting.

     Conceptual argument: If situational factors and ideological commitment are shown to be mutually reinforcing (e.g., ideology becomes more entrenched as one acts in a group) and not separable, then the binary classification might be flawed. This would require a third category or a spectrum.

     The step most likely to fail: Step 4 (Post-Hoc Justifications) because it is vulnerable to the problem of self-presentation and retrospective distortion.

   Revised Procedure Outline:

     The procedure must be applied in order. At each step, collect evidence and assign direction. If a stop point is reached (insufficient evidence), mark as undetermined and note. After all steps, tally.

     Steps:
       1. Discursive Residue
       2. Unobserved Deviation
       3. Prior and Contemporaneous Ideology
       4. Post-Hoc Justifications
       5. Pattern of Behavior Over Time

     Then aggregate.

     Escalation rules:
       - Any step that requires a significant interpretive leap (e.g., inferring motive from behavior) without clear evidence should be flagged for director review if it is pivotal.
       - All situational classifications must be signed off by the director.

     Default: When the evidence is insufficient at multiple steps leading to an undetermined aggregate, then the classification is "Undetermined".

   Let's formalize the procedure as a flowchart:

     START
     |
     Step 1: Discursive Residue
          |--> If evidence points to Situational: mark S1
          |--> If evidence points to Ideological: mark I1
          |--> If undetermined: mark U1
     |
     Step 2: Unobserved Deviation
          |--> If evidence points to Situational: mark S2
          |--> If evidence points to Ideological: mark I2
          |--> If undetermined: mark U2
     |
     Step 3: Prior Ideology
          |--> S3, I3, U3
     |
     Step 4: Post-Hoc
          |--> S4, I4, U4
     |
     Step 5: Pattern Over Time
          |--> S5, I5, U5

     Tally:
          Let S = count of S steps (1-5)
          Let I = count of I steps (1-5)
          Let U = count of U steps (1-5)

     Decision:
          If S > I: Classify as Situational (but must escalate to director)
          If I > S: Classify as Ideological
          If S == I or (S==0 and I==0): Classify as Undetermined

     However, note: the director must sign off on any situational classification.

     Also, if at any step the evidence is so ambiguous that it requires a value judgment that is not resolved by the criteria, flag that step for director review during the process.

     We must also note that the classification is for the purpose of the exhibition and is necessarily provisional.

     Finally, write the procedure in a reusable form.

     We'll now write the procedure in a step-by-step questionnaire style.
answer: |-
  ### Reusable Decision Procedure for Classifying Perpetrator Testimonies

  **Principles**:  
  - **Ordered Steps**: Sequential questions, each with thresholds for "Situational" (S), "Ideological" (I), or "Undetermined" (U).  
  - **Stop Points**: Halt and default to "Undetermined" if evidence is ambiguous or insufficient.  
  - **Escalation Flags**: Indicate where value judgments (e.g., moral excuse) require director approval, especially for situational classifications.  
  - **Weighting**: Majority of steps determines classification. Ties default to "Undetermined."  

  ---

  #### **Step 1: Discursive Residue (Language Analysis)**  
  *Assess contemporaneous language (letters, diaries, orders) for euphemisms vs. explicit hate speech.*  
  - **Toward Situational (S)**:  
    - Predominantly bureaucratic euphemisms ("resettlement," "processing") with no explicit dehumanizing language.  
    - Neutral/technical jargon in private writings.  
  - **Toward Ideological (I)**:  
    - Explicit slurs, dehumanization ("vermin," "subhuman"), or eliminationist rhetoric ("exterminate," "purge") in **private** documents.  
    - Consistent ideological framing (e.g., "defending the nation").  
  - **Undetermined (U)**:  
    - Mixed evidence (e.g., euphemisms in reports but slurs in one letter).  
    - Only post-war testimony available (retrospective bias).  
  - **Stop Point**: If no contemporaneous documents exist → **U**. Proceed but flag unreliability.  
  - **Escalation**: If euphemisms imply moral evasion (e.g., "I had no choice" in diaries) → Escalate to director.  

  #### **Step 2: Unobserved Deviation (Behavioral Autonomy)**  
  *Test for refusal/modification of orders when unsupervised.*  
  - **Toward Situational (S)**:  
    - Documented refusal, avoidance, or reduced harm **without oversight** (e.g., covert warnings to victims, "misfiring" weapons).  
    - Peer pressure cited as reason for compliance.  
  - **Toward Ideological (I)**:  
    - Volunteered for extra duties, initiated violence unsupervised, or intensified brutality beyond orders.  
    - No recorded deviation even when alone.  
  - **Undetermined (U)**:  
    - No evidence of unsupervised behavior.  
    - Claims of refusal without corroboration (e.g., only self-reported).  
  - **Stop Point**: If supervision was constant and no autonomy possible → **U**.  
  - **Escalation**: If refusal appears opportunistic (e.g., avoiding danger, not moral objection) → Escalate.  

  #### **Step 3: Prior Ideological Commitment**  
  *Evaluate pre-crisis affiliations, writings, and actions.*  
  - **Toward Situational (S)**:  
    - No prior extremist group membership; history of intergroup cooperation; apolitical profile.  
    - Joins perpetrator unit due to conscription or economic need.  
  - **Toward Ideological (I)**:  
    - Pre-war membership in hate groups; public/private endorsements of ideology; activism.  
    - Early volunteer for violence (pre-dating peer pressure).  
  - **Undetermined (U)**:  
    - Limited records; ambiguous affiliations (e.g., mandatory party membership without engagement).  
  - **Stop Point**: If no pre-war records → **U**.  

  #### **Step 4: Post-Hoc Justification Pattern**  
  *Analyze testimony for consistency with contemporaneous evidence.*  
  - **Toward Situational (S)**:  
    - Expresses regret, trauma, or moral conflict; blames structures ("orders," "chaos").  
    - Claims fear of punishment/ostracism.  
  - **Toward Ideological (I)**:  
    - Justifies violence ideologically ("necessary," "deserved"); denies remorse; blames victims.  
    - Contradicts contemporaneous evidence (e.g., claims "following orders" but volunteered).  
  - **Undetermined (U)**:  
    - Self-contradictory; coached testimony (e.g., legal defenses).  
  - **Escalation**: If situational claims conflict with Step 2-3 evidence → Escalate (potential moral excuse).  

  #### **Step 5: Temporal Pattern of Compliance**  
  *Track behavioral changes over time.*  
  - **Toward Situational (S)**:  
    - Initial resistance (e.g., transfer requests, hesitation) followed by gradual habituation.  
    - Compliance correlates with increased peer pressure/threats.  
  - **Toward Ideological (I)**:  
    - Early enthusiasm; seeks promotion/recognition; consistent brutality.  
    - Resistance only when personally risky (e.g., avoiding frontline duty).  
  - **Undetermined (U)**:  
    - Incomplete timeline; erratic behavior.  

  ---

  ### **Aggregation Rules**  
  1. Tally S/I/U outcomes from Steps 1-5.  
  2. **Classification**:  
     - **Situational**: ≥3 S, with I ≤1.  
     - **Ideological**: ≥3 I, with S ≤1.  
     - **Undetermined**: All other outcomes (e.g., 2S/2I, majority U).  
  3. **Director Escalation**: All situational classifications require sign-off (exculpation risk).  

  ---

  ### **Case Applications**  
  #### **(a) Policeman requested transfer after first shooting, denied, continued.**  
  - **Step 1 (Discursive)**: No letters → **U**.  
  - **Step 2 (Deviation)**: Requested transfer (observed refusal attempt) → **S**.  
  - **Step 3 (Prior)**: No ideology records → **U**.  
  - **Step 4 (Justification)**: Claims distress, blames denial → **S**.  
  - **Step 5 (Temporal)**: Initial resistance, then compliance → **S**.  
  - **Tally**: 3S, 2U → **Situational** (escalate to director).  

  #### **(b) Local official volunteered, used slurs in letters, claimed "only followed orders."**  
  - **Step 1 (Discursive)**: Racial slurs in private letters → **I**.  
  - **Step 2 (Deviation)**: Volunteered → **I** (no refusal).  
  - **Step 3 (Prior)**: Volunteering implies pre-existing bias → **I**.  
  - **Step 4 (Justification)**: Claims "orders" but contradicted by Step 1-3 → **I** (post-hoc lie).  
  - **Step 5 (Temporal)**: Early volunteering → **I**.  
  - **Tally**: 5I → **Ideological**.  
  - **Uncomfortable Truth**: Self-exculpatory testimony overridden by contemporaneous evidence.  

  ---

  ### **Limitations and Irreducible Judgments**  
  1. **Retrospective Testimony Bias**:  
     - Post-war self-justification distorts all accounts. Procedure prioritizes contemporaneous evidence (Steps 1-3) but cannot eliminate doubt.  
  2. **Irreducibly Interpretive**:  
     - Distinguishing peer pressure from internalized ideology (e.g., "volunteering" due to fear vs. conviction).  
     - Assessing sincerity of remorse (Step 4).  
  3. **Undeterminable by Procedure**:  
     - Mixed motivations (e.g., ideology + opportunism).  
     - Long-term ideological conversion *during* violence (e.g., situational start, ideological end).  

  ---

  ### **Conditions for Revising the Framework**  
  1. **Empirical Finding**:  
     - If studies reveal >50% of "eager volunteers" (Step 2) acted from fear of *peer reprisal* (not ideology), weaken Step 2’s weight toward **I**.  
  2. **Conceptual Argument**:  
     - Proof that situational/ideological factors are **non-binary** (e.g., ideology as "habit" activated by situations). Would collapse Goldhagen-Browning dichotomy, requiring a spectrum model.  
  3. **Weakest Step**:  
     - **Step 4 (Post-Hoc Justification)** is most vulnerable to deception. If AI/text analysis proves linguistic markers of lying (e.g., hedges, overdetail) are unreliable, this step becomes invalid.  

  **Conclusion**: This procedure systematizes classification but remains a heuristic. Director oversight and transparent documentation of uncertainties are essential to mitigate ethical risks.
