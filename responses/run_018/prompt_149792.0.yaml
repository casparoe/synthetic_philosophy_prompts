answer: |-
  Your conceptual carving is exceptionally sharp—this **isn't** just "in vino veritas" or modern disinhibition theory. Plato's model is a **structured, hierarchical diagnostic ritual**. Here's the precise distinction and a coined term:

  ---

  ### **Core Elements of Plato's Model:**
  1. **Asymmetrical Sobriety:** Deliberate separation between intoxicated subjects ("tested") and sober observers ("testers").
  2. **Controlled Unraveling:** Reason is *partially* disabled (not obliterated) within institutional limits (symposiarch, age rules, drinking order).
  3. **Pedagogical/Diagnostic Aim:** Observing the soul's *akrasia* (weakness of will) to cultivate virtue or assess character—*not* mere revelation or hedonism.
  4. **Scaffolded Vulnerability:** Drunkenness is induced in a "safe" context where consequences are contained.

  ---

  ### **Coined Term:**
  **Scaffolded Akrasia**  
  *(or "Sympotic Akrasia Trial")*

  ### **Why this term?**
  - **"Scaffolded"** captures the artificial support structure (rules, sober monitors).
  - **"Akrasia"** (ἀκρασία) is Plato's explicit concern: weakness of will when reason lapses.
  - **"Trial"** emphasizes the test-like, diagnostic purpose.

  ---

  ### **Key Distinctions:**

  | Concept                | Plato's Scaffolded Akrasia          | "In Vino Veritas"          | Modern Disinhibition Theory |
  |------------------------|-------------------------------------|----------------------------|----------------------------|
  | **Structure**          | Hierarchical supervision (sober > drunk) | Spontaneous revelation | Chemical removal of barriers |
  | **Purpose**            | Moral pedagogy / soul-diagnosis     | Accessing hidden truth    | Loss of social restraint    |
  | **Control Mechanism**  | Institutional rules (Laws), sober observers | None                   | Neurochemistry alone       |
  | **Reason's State**     | *Partially* disabled (measured unraveling) | Overridden            | Suppressed                 |

  ---

  ### **Validation Against Your Texts:**
  - **Symposium:** Alcibiades' drunken confession isn't the point—it's Socrates' *unaffected rationality* (the sober ideal) that demonstrates soul-mastery. The frame is a controlled display of *akrasia* versus *enkrateia* (self-control).
  - **Laws 645d-650b:** The Athenian explicitly calls the symposium a "safe test" (ἀσφαλὴς πείρα) for youth: observing drunken behavior to strengthen resistance to *akrasia* later in life.

  ---

  ### **Why Existing Terms Fall Short:**
  - **"Sympotic Education"**: Too broad—could include sober philosophical dialogue (like most of the *Symposium*). Your focus is the *engineered vulnerability* within that frame.
  - **"Moral Trial by Wine"**: Implies pass/fail judgment, missing Plato's therapeutic intent (training through controlled exposure).
  - **Disinhibition**: Reduces it to brain chemistry, ignoring Plato's *political-ethical technology*.

  ---

  **Conclusion:** Your carving holds. Plato transforms intoxication into a **deliberate spiritual stress-test**—a "soul gymnasium" where *akrasia* is provoked under supervision to fortify reason. "Scaffolded Akrasia" isolates this mechanism's uniqueness: neither revelation nor release, but *pedagogical unraveling*.
