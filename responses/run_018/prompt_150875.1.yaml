answer: |-
  Your diagnosis of the impasse is largely correct, and your framing is **coherent**—but it requires refinement in key areas. Below is a pushback-calibrated analysis, structured around your questions. I’ll flag speculative claims (<!>) and reconstructions (<§>) explicitly.

  ---

  ### **1. Diagnosis: Why the Disagreement Stalls**  
  The core impasse is **methodological and conceptual**, rooted in **incommensurable frameworks for defining "adaptation"** and **divergent standards of evidence**. It is not primarily empirical, as both sides agree selection *occurs* but dispute its *prevalence* and *detectability*.

  - **Adaptationist Programme (Modern Genomic Proponents)**:  
    - <§> Treats adaptation as a **statistical signal** in genomic data (e.g., dN/dS ratios, allele frequency shifts).  
    - Focuses on **current fitness contributions** inferred from patterns (e.g., "this gene shows signatures of positive selection").  
    - Methodology presupposes that non-adaptive processes (drift, mutation bias) produce a "null" distribution. Deviations = adaptation.  
    - Criticized by Gould-Lewontin (G-L) for conflating *current utility* with *historical origin*.

  - **Gould-Lewontin Critique (and Modern Allies)**:  
    - Treats adaptation as a **historical narrative** about selective pressures *shaping a trait*.  
    - Rejects statistical proxies as circular: genomic "signatures of selection" assume the very distinction (adaptive vs. non-adaptive) they seek to measure.  
    - Insists that non-adaptive origins (spandrels, drift) are *routine*, making "adaptation" an exceptional claim requiring developmental/phylogenetic evidence.  

  **The Stalemate**:  
  - **Methodologically**, genomicists use present-day data to infer selection, while G-L proponents demand historical/developmental evidence. These are different standards.  
  - **Conceptually**, genomicists equate "adaptive" with "currently functional and selected," while G-L equate it with "historically built by selection."  
  - **Verbal? Partly**. "Adaptation" is a homonym: one camp uses it for *function*, the other for *origin*. Yet this masks a **substantive disagreement about prevalence**: G-L see spandrels/exaptations as ubiquitous; adaptationists see selection as the dominant signal.  

  ---

  ### **2. Your Proposed Taxonomy: Will It Resolve or Relocate the Debate?**  
  Your stricter definitions (**spandrels** = entrenched architectural byproducts; **exaptations** = co-opted traits; **capacitance** = cryptic variation) are **useful clarifications** but **will not dissolve the debate**. Instead:  

  - **Spandrels**: Narrowly defining them as *San Marco-like architectural necessities* (e.g., developmental constraints) excludes traits shaped by drift or mutation bias. G-L’s original analogy *requires* this definition, but critics often misuse "spandrel" for *any* non-adaptive trait.  
    - <!> **Pushback**: Developmental entrenchment is itself contentious. Is a "spandrel" an inevitable byproduct (e.g., vertebrate eye blind spot) or merely a common one? This relocates debate to **how to quantify "entrenchment"**—a new methodological quagmire.  

  - **Exaptations vs. Spandrels**: Separating them clarifies that exaptations *acquire* function later, while spandrels *never had an original function*. But:  
    - G-L argue that *most* traits start as spandrels/exaptations, not adaptations. Genomicists retort that selection *still* optimizes them.  

  - **Evolutionary Capacitance & Constructive Neutral Evolution (CNE)**:  
    - **Relevance**: These concepts **strengthen the G-L critique** by showing how non-adaptive processes (e.g., drift in CNE; cryptic variation in capacitance) *enable* functional complexity without selection.  
    - **Not confused**: Capacitance (e.g., Hsp90) reveals how stress exposes "hidden" variation—often neutral in origin—that selection then acts upon. This directly challenges adaptationist claims that traits are *built* by selection.  

  **Verdict**: Your taxonomy sharpens the discussion but **shifts contention to**:  
  - Whether a trait is "entrenched enough" to be a spandrel.  
  - Whether exaptation/capacitance counts as "non-adaptive" if selection later refines it.  

  ---

  ### **3. What Would Count as Progress?**  
  No single solution will satisfy both camps, but these would advance the debate:  

  - **Formal Result on Unidentifiability**: A proof that selection coefficients **cannot be uniquely inferred from sequence data alone** (e.g., due to epistasis, demography, or mutation bias) would force genomicists to integrate developmental evidence. <!> *This is plausible but not yet achieved*.  

  - **Conceptual Split: Origin vs. Utility**: Mandating that papers distinguish "**historically adaptive**" (origin) from "**currently adaptive**" (function) would reduce conflation.  
    - <!> **Problem**: Many traits blur this line (e.g., exaptations).  

  - **Family-Resemblance Argument**: Acknowledge that "adaptation" is a **cluster concept** (historical selection, current function, optimization, etc.). No trait has all properties; disputes arise when camps prioritize different criteria.  
    - **Strength**: Explains why the debate persists—it’s about weighting evidence, not a binary.  

  **Most Realistic Path**:  
  A **methodological synthesis** requiring genomic studies to:  
  1. Test for non-adaptive origins (e.g., via CNE models),  
  2. Integrate comparative developmental data,  
  3. Explicitly state whether "adaptive" refers to origin or current utility.  

  ---

  ### **4. Confusions in Your Framing?**  
  - **Spandrel Fragmentation**: Your focus on *entrenched* spandrels is **correct per G-L’s original analogy**. Critics who broaden "spandrel" to *any* non-adaptive trait dilute the concept.  
  - **Evolutionary Capacitance/CNE**: These **strengthen, not confuse**, the critique. They provide mechanisms for non-adaptive origins beyond drift.  
  - **Missing Quantitative Claim**: The debate *does* hinge on a **substantive quantitative disagreement**—what % of traits are *historically* adaptive? Genomics cannot answer this without historical evidence.  

  ---

  ### **Summary: Key Points**  
  | **Issue**                | **Adaptationist View**                     | **G-L View**                              | **Sticking Point**                     |  
  |--------------------------|-------------------------------------------|------------------------------------------|----------------------------------------|  
  | **Definition of Adaptation** | Current function + selection signature    | Historical origin via selection          | Conflation of origin vs. utility       |  
  | **Prevalence of Selection** | Dominant signal in genomes                | Rare; non-adaptive origins are routine   | Quantification without historical data |  
  | **Evidence Standard**     | Statistical deviations in sequence data   | Developmental/phylogenetic narratives    | Methodological incompatibility         |  
  | **Spandrels**             | Often ignored or redefined                | Architectural byproducts (strict sense)  | Terminological dilution               |  

  **Conclusion**: The impasse persists because **genomics answers "Is this trait under selection now?" while G-L ask "How did this trait originate?"**—and both call their answer "adaptation." Progress requires disentangling these questions formally and methodologically. Your framing is **not confused**; it accurately identifies the conceptual rift. However, quantitative disputes about prevalence *are* empirical—just currently unaddressable by genomic data alone.  

  <!> **Speculative Addendum**: The rise of eco-evo-devo may break the deadlock by forcing integration of genomic, developmental, and environmental data—testing adaptation as a *process*, not a pattern.
