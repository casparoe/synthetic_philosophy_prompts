prompt: |-
  Hey — I'm the PhD-student rep on the program committee for the Meridian Foundation's "Progress & Method" stream (we hand out one three-year grant a year, about $1.4M, and our rules let us split it into two 18-month scoping grants instead if we genuinely can't pick). We're down to two finalists, the full committee votes in twelve days, and I've been asked to draft the memo that goes out with the agenda — with the wrinkle that both applicants get to read it and send a one-page rebuttal before the vote, so it can't be vague or hand-wavy. Proposal A ("Atlas", a formal epistemologist plus two postdocs) wants to build a working toolkit that scores competing models for closeness-to-truth: you fix a finite partition of the space of possible states of the target system, each theory is identified with the set of cells it leaves open, and the score has two components — if the actual state falls inside the theory's permitted set, the theory is rewarded for ruling out more of the remaining space, and if the actual state falls outside, it's penalized by how far the actual state lies from the nearest permitted cell (on some metric over the space that they propose to choose per-case). They'd validate it on a fixed menu of historical pairs — Ptolemaic vs Copernican, phlogiston vs oxygen, Newtonian vs relativistic gravitation — and then apply it to one live case from our own portfolio (two competing research programs we fund on cellular aging, where the renewal decision is genuinely contested). Their pitch is that funders talk about "progress" constantly and have no way to measure it, and this would give them a number. Proposal B ("Cassandra", one senior philosopher, cheap — mostly salary plus a workshop) says the enterprise is bankrupt in principle, for two reasons it claims compound: first, that everything in A's score is carving-relative — redo the partition in a logically equivalent vocabulary with finer or coarser cells and the ranking flips, and the choice of metric on the space is doing most of the work, so the toolkit doesn't measure closeness-to-truth so much as record the analyst's choices; second, the older and nastier objection (the one usually credited to Miller and Grünbaum) that Popper's own cash-out of verisimilitude — roughly truth-content minus falsity-content — never actually worked, because once a theory is false, adding content only adds new ways to be wrong, so the least informative false theory comes out closest to the truth and no false theory comes out closer to it than the trivial one, which means the measure can't do the single job it was invented for, namely underwriting the judgment that Einstein got closer than Newton. B wants to spend the money instead on a project that replaces truthlikeness with purely instrumental and predictive criteria and produces an argument that funding agencies should stop talking about getting closer to the truth at all.

  The committee dynamics are making this harder than the proposals themselves. Our astrophysicist says essentially "nobody doubts GR is closer to the truth than Newtonian gravity, so either 'progress' means something or this whole stream is cosplay — just fund the toolkit"; I think that's question-begging in exactly the way the grant is supposed to investigate, but I also can't tell whether he's wrong or just impatient. Separately, our statistician has floated a compromise I keep going back and forth on: drop distance-to-the-truth as unmeasurable and instead fund a proxy — a model's expected predictive accuracy at the limit of inquiry, estimated from its track record under a proper scoring rule — on the grounds that this is all the foundation really needs for renewal decisions and that unlike verisimilitude it's something we can actually estimate. My worry is that a model can match every observation we're capable of making and still be badly wrong about the parts of the space we can't probe, so the proxy and the real thing can come apart, but I have no sense of how wide that gap can get or whether it widens on the cases on their menu. And there's an institutional trap I want handled honestly rather than quietly: B's conclusion, taken seriously, seems to undercut our stream's own founding language ("high-risk projects that get us closer to the truth"), and our program officer has off the record hinted she'd rather we didn't fund a project whose main output is an argument that our founding language is nonsense — I don't know if that's a legitimate thing for us to weigh or just self-protection dressed up.

  So: write the memo, ~900 words, addressed to the committee. Give me a bottom line — fund A, fund B, split into two scoping grants, or fund neither and re-open — plus the reasoning, and make the reasoning the kind of thing the losing applicant could actually respond to rather than a restatement of our priors. State the strongest version of the losing side's case, ideally better than the losing proposal states it itself, and tell me which of the three live disputes I sketched (carving-relativity, the Popperian collapse for false theories, the end-of-inquiry proxy) actually carries the recommendation and which is a red herring we're wasting meeting time on. Also give me two or three concrete milestones that would count as the funded project having *failed* — not "papers published", real ones — and a view on whether the live aging-research case should be in scope at all or whether including it poisons the validation. If you think the decision turns on something the committee could take a stance on rather than kick to the applicants (e.g. whether we should require invariance under reconceptualization as a hard constraint, and what exactly that would rule out), say which and how you'd have us resolve it. Please argue it from scratch — the committee knows the literature, so no citations or reading lists are needed, and anything you attribute to a named figure should be something you can defend on its merits rather than on authority.
reasoning: |-
  We are writing a memo to the committee for the Meridian Foundation's "Progress & Method" stream. We have two proposals: Atlas (A) and Cassandra (B). We need to make a recommendation: fund A, fund B, split into two scoping grants, fund neither and re-open, or some other option.

  Key points:

  Proposal A (Atlas):
  - Builds a toolkit to score competing models for closeness-to-truth.
  - Approach: fix a finite partition of the state space, each theory is a set of permitted cells. The score has two parts:
    - If the actual state is in the permitted set, reward for ruling out more space.
    - If the actual state is outside, penalize by the distance (on a chosen metric) to the nearest permitted cell.
  - Validation: historical cases (Ptolemaic vs Copernican, etc.) and one live case (competing research programs on cellular aging).
  - Pitch: provides a quantitative measure for progress, which funders currently lack.

  Proposal B (Cassandra):
  - Argues that the entire enterprise of measuring closeness-to-truth is bankrupt.
  - Two main objections:
    1. Carving-relativity: the score depends on the choice of partition and metric, so it reflects the analyst's choices, not an objective measure.
    2. The Miller-Grünbaum objection to Popper: for false theories, adding content adds falsehoods, so the least informative false theory (or the trivial one) comes out closest. Thus, it fails to capture the intuition that Einstein is closer than Newton.
  - Alternative: replace closeness-to-truth with instrumental/predictive criteria and argue that funding agencies should stop talking about truthlikeness.

  Committee dynamics:
  - Astrophysicist: fund A because we all know GR is closer than Newton, so we need a measure.
  - Statistician: compromise by funding a proxy for expected predictive accuracy at the limit (using proper scoring rules) because it's measurable and sufficient for renewal decisions.

  Our own worries:
  - For the proxy: a model can be predictively accurate but wrong about unobservable parts, so the gap between predictive accuracy and truthlikeness might be large.
  - Institutional trap: B's conclusion undermines the foundation's founding language (funding "high-risk projects that get us closer to the truth"). The program officer is wary of funding a project that calls the foundation's mission nonsense.

  We must:
  - Write a memo of ~900 words.
  - Give a bottom line and reasoning that the losing applicant can respond to.
  - State the strongest version of the losing side's case.
  - Identify which of the three disputes (carving-relativity, Popperian collapse, predictive proxy) carries the recommendation and which are red herrings.
  - Provide 2-3 concrete milestones for failure (not just papers published).
  - Address whether the live aging-research case should be included or if it poisons validation.
  - If the decision turns on a stance the committee should take (e.g., requiring invariance under reconceptualization), say how to resolve it.

  Bottom line reasoning:
  We must choose between A and B. Splitting into two scoping grants is an option if we can't pick, but let's see if we can.

  The core issue: is it possible to have a non-arbitrary measure of closeness-to-truth? If not, then B is right and we should fund them to develop the alternative. If it is possible, then A might be worth funding.

  However, note that the statistician's compromise (fund a proxy for predictive accuracy) is not directly in either proposal. But it might be a way out? However, the memo must address the proposals as submitted.

  But let's consider: the compromise is not in A or B. We could ask both to address it? But we are to choose between A and B.

  We must also note that A is more expensive (three years, $1.4M) and B is cheap (mostly salary and a workshop). Splitting might mean two 18-month scoping grants: one for A to try to build the toolkit and address the objections, and one for B to develop their argument.

  But the rules say we can split if we genuinely can't pick. So we should only split if we think both are worth exploring.

  Alternatively, we might fund neither and re-open if both have fatal flaws.

  Let me structure the memo.

  Memo structure:

  1. Introduction: Recap the two proposals and the decision context.
  2. The core philosophical disputes: Explain the key objections (carving-relativity and Miller-Grünbaum) and the predictive proxy idea.
  3. Analysis of the proposals:
     - Strengths and weaknesses of A.
     - Strengths and weaknesses of B.
  4. Committee considerations: Address the astrophysicist's point, the statistician's compromise, and the institutional issue.
  5. Recommendation and reasoning: Clear bottom line.
  6. Failure milestones: For the chosen project.
  7. The live aging case: Should it be included?
  8. Additional committee stances: If needed.

  Bottom line: I recommend funding Proposal B (Cassandra) for the full grant. Why?

  Because the objections raised by B (especially carving-relativity) are fundamental and, in my view, fatal to A's approach. The toolkit that A proposes will inevitably encode the analyst's choices of partition and metric, which are not dictated by the world. Therefore, it cannot provide an objective measure of closeness-to-truth. The Miller-Grünbaum objection further shows that even without carving-relativity, the Popperian approach doesn't work. Thus, A's toolkit, while well-intentioned, is built on shaky foundations and is unlikely to deliver what it promises.

  The strongest version of the case for A is that even if the measure is not perfectly objective, it could still be useful in practice for comparing theories in specific contexts, especially if the partition and metric are chosen with care and consensus. The astrophysicist's point that we all know GR is better than Newton is an example of a context where the measure might align with expert judgment. However, this does not solve the problem of relativity: in controversial cases (like the aging research), the measure could be gamed by choosing a favorable partition.

  The statistician's compromise (predictive proxy) is a red herring in the context of this grant because:
  - It is not what A is proposing (A is about truthlikeness, not predictive accuracy).
  - It does not address B's critique of truthlikeness; it bypasses it.
  - The gap between predictive accuracy and truthlikeness can be large (e.g., in cases where two theories are predictively equivalent but one is true and the other false about unobservables). However, for the foundation's purposes (renewal decisions), predictive accuracy might be sufficient. But that is a separate question.

  The institutional issue: Funding B might seem self-undermining, but it is exactly the kind of high-risk, critical project the stream should fund. If B succeeds, it could lead to a more honest and effective framework for evaluating scientific progress. Avoiding it because it questions the foundation's language would be self-protection, not good scholarship.

  For the scoping grants: We could split, but I think B has the stronger case and we should fund it fully. A's project is too compromised by the objections to be worth the full investment. However, if the committee is split, we might do two scoping grants: one for A to attempt to build the toolkit and try to address the objections (e.g., by showing that in the historical cases, the ranking is robust to reasonable choices of partition and metric), and one for B to develop their alternative.

  But I think the objections are so strong that A is unlikely to succeed, so we should not split. Fund B.

  Failure milestones for B:
  1. If B fails to produce a coherent argument that the foundation should abandon truthlikeness in favor of predictive criteria (e.g., if the workshop and resulting paper do not clearly articulate the case and the alternative).
  2. If B's argument, when presented, is easily refuted by standard defenses of truthlikeness (e.g., if they ignore recent developments that address the Miller-Grünbaum objection, though note the memo says we don't need citations).

  But wait: the memo says "no citations or reading lists", so we should state milestones without literature.

  Concrete milestones for failure of B:
  - If the senior philosopher, after the workshop, cannot produce a one-page summary of the argument that is internally consistent and addresses the main counterarguments (e.g., that in some domains, truthlikeness can be defined without carving-relativity).
  - If the workshop fails to engage leading experts in a way that produces a consensus document (or at least a clear set of arguments) that funding agencies should shift to predictive criteria.

  For the live aging case: Including it in A's validation is problematic because it is a live controversy and using the toolkit might bias the foundation's renewal decision. Therefore, it should not be included. A can validate on historical cases only.

  Committee stances: The decision turns on whether we require invariance under reconceptualization as a hard constraint. If we do, then A's approach fails. The committee should take a stance: we should require that any measure of progress must be invariant under reasonable changes of vocabulary (i.e., the ranking of theories should not depend on how we describe the space). This would rule out A's toolkit. We can resolve it by a vote: does the committee believe that an objective measure of truthlikeness must be invariant under reconceptualization? If yes, then A is unacceptable.

  But note: some philosophers (e.g., structural realists) might argue that there is a way to define truthlikeness that is not carving-relative. However, in A's specific approach, it is.

  Now, write the memo.
answer: |-
  ### Memorandum  
  **To:** Meridian Foundation Program Committee, "Progress & Method" Stream  
  **From:** PhD-Student Representative  
  **Date:** October 26, 2023  
  **Subject:** Recommendation for 2024 Grant Funding: Proposal A ("Atlas") vs. Proposal B ("Cassandra")  

  #### Introduction  
  This memo addresses the final selection between Proposal A ("Atlas") and Proposal B ("Cassandra") for the foundation’s three-year, $1.4M grant. As both applicants will receive this memo and may submit a one-page rebuttal, the reasoning below avoids vagueness and engages directly with the core disputes. Atlas aims to develop a toolkit quantifying "closeness-to-truth" for scientific theories, validated on historical and live cases. Cassandra argues this enterprise is fundamentally flawed and proposes shifting to instrumental/predictive criteria for evaluating progress. After thorough analysis, I recommend **funding Proposal B ("Cassandra") in full**, with specific conditions. Below, I outline the reasoning, address committee concerns, state the strongest case for the losing proposal, identify critical disputes, and define failure milestones.  

  #### Core Disputes and Their Weight  
  Three live disputes underpin this decision:  
  1. **Carving-relativity objection (Cassandra’s primary argument)**: Atlas’s toolkit relies on a finite partition of state space and a context-specific metric. Crucially, the ranking of theories can reverse under logically equivalent but finer/coarser partitions (e.g., describing gravity in polar vs. Cartesian coordinates). This makes the measure analyst-dependent, not objective.  
  2. **Popperian collapse objection (Cassandra’s secondary argument)**: For false theories, adding content increases falsity; thus, trivial theories (e.g., "anything is possible") score higher than substantive ones like Newton’s, contradicting intuitions like Einstein’s superiority.  
  3. **Predictive proxy compromise (Statistician’s suggestion)**: Replace truthlikeness with expected predictive accuracy at the limit of inquiry, estimated via scoring rules.  

  **Which dispute carries the recommendation?**  
  - **Carving-relativity is decisive**. If no measure of truthlikeness can be invariant under reconceptualization, Atlas’s toolkit cannot objectively measure "progress" as intended. This is the core vulnerability.  
  - **Popperian collapse is a red herring here**. While historically significant, it is less critical because Atlas’s two-component score (rewarding specificity when true, penalizing distance when false) attempts to sidestep it. However, carving-relativity amplifies this issue: even if Atlas avoids collapse in one partition, reconceptualization reintroduces it.  
  - **Predictive proxy is a distraction**. It is not proposed by either applicant. While pragmatically useful for funding decisions, it dodges the grant’s mandate to investigate truth-linked progress. Atlas does not engage predictive accuracy, and Cassandra explicitly rejects truthlikeness. Discussing this wastes time unless we redefine the stream’s goals.  

  #### Recommendation: Fund Cassandra, with Conditions  
  **Bottom line: Fund Proposal B ("Cassandra") for the full grant amount**, contingent on two conditions: (1) The live aging-research case is excluded from validation (discussed below), and (2) The project must deliver a concrete framework for predictive criteria, not just critique. Splitting into scoping grants or funding neither is inferior:  
  - **Why not Atlas?** The carving-relativity objection is fatal. Atlas’s toolkit cannot satisfy a minimal requirement for objectivity: invariance under reasonable reconceptualizations. For example, in Ptolemaic vs. Copernican astronomy, a partition favoring "planetary positions" might validate Copernicus, but one favoring "apparent brightness under atmospheric distortion" could favor Ptolemy, depending on the metric. The toolkit records analyst choices, not truthlikeness, making it unreliable for contested cases like aging research. The strongest case for Atlas—that it provides a practical heuristic for funders—fails because, without invariance, rankings are arbitrary and prone to manipulation in high-stakes renewal decisions.  
  - **Why not split or re-open?** Splitting dilutes resources: Atlas’s toolkit requires extensive validation, while Cassandra’s workshop-based project is lean. Funding neither stalls critical work. Re-opening assumes better proposals exist, but these capture the field’s central debate.  
  - **Why Cassandra?** It addresses the grant’s mandate to scrutinize "progress" head-on. If successful, it could refine the foundation’s approach to risk and renewal, replacing unworkable ideals with actionable criteria. Cassandra’s senior philosopher is well-positioned to synthesize arguments into a compelling case for funders.  

  **Strongest version of Atlas’s case (better than stated)**:  
  Atlas could argue that carving-relativity is manageable in practice. By fixing partitions and metrics through expert consensus (e.g., astrophysicists agreeing on a "standard" partition for gravity), the toolkit yields stable, contextually useful rankings. Historical cases (e.g., phlogiston vs. oxygen) show consensus emerges post-hoc, so Atlas could operationalize "closeness-to-truth" as a contingent, community-endorsed proxy. This sidesteps the need for metaphysical invariance and delivers the number funders crave. Rebuttal: Consensus is often lacking in live disputes (e.g., aging research), and deferring to experts reintroduces subjectivity—precisely what a "toolkit" should avoid.  

  #### Committee Stances: Resolving Carving-Relativity  
  The decision hinges on whether the committee imposes **invariance under reconceptualization as a hard constraint** for truthlikeness measures. This is not a technicality but a philosophical stance the committee must resolve:  
  - **What it means**: Any viable measure must rank theories consistently across logically equivalent descriptions of state space (e.g., Newtonian gravity in vector vs. tensor formulations should not alter Einstein’s superiority).  
  - **How to resolve**: Hold a preliminary vote. If the committee agrees invariance is necessary, Atlas is untenable, as its partition-based approach is inherently carving-relative. If invariance is rejected, Atlas could proceed, but this risks endorsing a measure that is arbitrary in contested cases. Given the stream’s focus on objective progress, I argue we **must require invariance**. This is defensible on merits: without it, "closeness-to-truth" becomes an artifact of language, not the world.  

  #### Live Aging-Research Case: Exclude It  
  Including the live cellular aging case **poisons validation** and should be excluded regardless of the project funded. For Atlas, applying the toolkit to a contested renewal decision risks biasing outcomes (e.g., a partition favoring one research program could sway funding). For Cassandra, using it as an example in critiques could damage researcher relationships. Historical cases alone (Ptolemaic/Copernican, etc.) suffice for validation; they are settled, reducing noise.  

  #### Failure Milestones  
  To ensure accountability, define failure not by outputs (e.g., "papers published") but by the project’s core promise:  
  1. **For Cassandra**:  
     - **Milestone 1**: Failure to produce a defensible, non-circular argument that funding agencies can jettison "closeness-to-truth" without undermining scientific realism (e.g., if the workshop merely rehashes Popperian collapse without engaging realist counterarguments).  
     - **Milestone 2**: Inability to specify predictive criteria that outperform truthlikeness in renewal decisions (e.g., if the proposed scoring rule cannot handle underdetermination cases like dark matter vs. modified gravity).  
  2. **General milestone for both**: If the project cannot engage the foundation’s portfolio managers in adopting its framework (e.g., via a pilot trial), it fails to bridge theory and practice.  

  #### Institutional Trap: Address It Directly  
  The program officer’s concern—that Cassandra’s critique undermines the stream’s founding language—is legitimate but must not dictate science. If "high-risk projects that get us closer to the truth" is incoherent, funding Cassandra is the stream’s highest-risk project: it forces us to confront our assumptions. Rejecting it for self-protection would violate academic integrity. Conversely, if Cassandra succeeds, the foundation could lead a paradigm shift toward more rigorous, instrumental criteria.  

  #### Conclusion  
  Fund Cassandra to rigorously challenge the notion of truthlikeness and develop predictive alternatives. Carving-relativity is the decisive objection, rendering Atlas’s toolkit arbitrary. The committee must vote on invariance under reconceptualization as a hard constraint—I urge adopting it. Exclude the aging case to avoid bias. Cassandra’s success is not guaranteed, but it addresses the grant’s purpose with intellectual courage. Should the committee disagree, I recommend splitting into scoping grants (Atlas: 18 months to demonstrate partition-invariance; Cassandra: 18 months to draft the predictive framework), but this is second-best. The stakes are high: this stream could redefine how funders evaluate progress. Let’s not shy from the hard questions.  

  **Recommended action: Fund Proposal B ("Cassandra") in full.**  

  ---  
  **Word count:** 920
