  First, I need to establish the extreme isolation - truly empty intergalactic space far from any gravitational influences. The rotating cylinder habitat should feel massive and eerie, with centrifugal force as the only "gravity." Elena's character should show her physicist background through precise observational skills but also philosophical curiosity.

