  For the pain insensitivity case: born unable to feel pain in a dangerous environment, leading to injuries. The harm is direct and physical, not socially dependent. So according to their principle, it should be a disease. But the environment amplifies the harm. If the environment were safe, maybe less harm, but the biological dysfunction remains. So it's a disease regardless of environment because the capacity to avoid injury is inherently compromised.

