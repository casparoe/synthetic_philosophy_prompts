prompt: |-
  Argue that in modern secular democracies with formal church-state separation mechanisms—such as church taxes or strict laïcité—the classic problem of dirty hands in politics is not resolved but structurally displaced onto bureaucratic administration. Specifically, defend the claim that when elected officials delegate ethically fraught trade-offs involving religious exemptions or public-order restrictions to ostensibly neutral administrative bodies, they generate a distinct moral failure—bureaucratic moral laundering—in which democratic accountability is obscured because the politician's hands remain symbolically clean while the state still performs wrongful acts. Distinguish this displacement from ordinary principal-agent problems and from direct personal complicity, and explain why it makes tracing democratic responsibility for dirty acts harder rather than easier. Keep your answer to one paragraph, state how confident you are in your reasoning, and identify the point about which you are least sure.
