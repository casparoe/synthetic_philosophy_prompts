answer: |-
  In secular democracies with formal church-state separation, politicians structurally displace the "dirty hands" dilemma—where morally wrongful acts are deemed politically necessary—onto bureaucratic bodies by delegating fraught decisions (e.g., granting contentious religious exemptions or imposing public-order restrictions on religious practice) to administrative agencies operating under frameworks of neutrality or technical rationality. This constitutes "bureaucratic moral laundering": elected officials avoid direct, visible culpability for the wrongful acts performed by the state (keeping their hands symbolically clean), while the administration, bound by procedural mandates and lacking direct democratic legitimacy, executes the ethically compromised trade-offs, obscuring democratic accountability. Unlike ordinary principal-agent problems (where agents *deviate* from principal intent), here the delegation *itself* is the mechanism for avoiding moral taint, and unlike direct complicity, the politician's involvement is obscured by layers of procedure. This displacement makes tracing democratic responsibility harder because it diffuses blame: citizens cannot effectively sanction politicians who disclaim responsibility ("the rules/agency decided"), while bureaucrats lack the mandate or visibility to bear the full moral weight, fracturing the chain of accountability for state wrongs. 

  **Confidence:** 85% - The core mechanism of displacement and obscured accountability aligns well with institutional political theory and critiques of bureaucratic rationality.  
  **Least Sure Point:** Whether this displacement *always* makes tracing responsibility harder "rather than easier" compared to direct political action—sometimes, bureaucratic processes create auditable paper trails that *can* enhance traceability, though I argue the symbolic cleansing and diffusion ultimately dominate.
