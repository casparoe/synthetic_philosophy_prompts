answer: |-
  You've pinpointed a crucial and often blurred distinction in popular expositions of intuitionism. **Intuitionistic logic is fundamentally an ontological thesis about the nature of mathematical objects and truth, not a general epistemic principle of verificationism applied universally.** Here's the clarification:

  1.  **Core Ontological Commitment:** Intuitionism (as pioneered by Brouwer and formalized by Heyting) is grounded in a specific view of mathematical existence:
      *   **Mathematics is Mental Construction:** Mathematical objects do not exist independently in some Platonic realm, waiting to be discovered. They are *created* by the mathematician's mind through acts of free, temporal intuition and constructive mental activity.
      *   **Truth as Proof:** A mathematical statement `P` is *true* only if we have *constructed* a proof of `P`. It is *false* only if we have constructed a proof that `P` leads to a contradiction (absurdity). Truth is identified with the existence of a (mental) construction.
      *   **Existence as Construction:** To say a mathematical object with a certain property exists (`∃x.P(x)`) means we have *constructed* a specific example `x` and verified `P(x)`.

  2.  **Rejection of LEM: A Consequence of Ontology:** The rejection of the Law of Excluded Middle (LEM) – `P ∨ ¬P` – follows *directly* from this ontology.
      *   For a statement `P` where we have neither constructed a proof of `P` nor a proof of `¬P`, asserting `P ∨ ¬P` would be asserting that *one of them must be true in the pre-existing Platonic sense*, independent of our construction. Intuitionism denies this pre-existing truth.
      *   **Goldbach's Conjecture:** Until we construct either a proof (verifying it) or a counterexample (refuting it), the intuitionist insists it is *meaningless* to assert "Either every even number >2 is the sum of two primes, or there exists one that is not." Neither truth-value has been constructed. The disjunction `P ∨ ¬P` lacks justification.

  3.  **Why Not Empirical Propositions? The Ontological Distinction:**
      *   **Mind-Independence:** Intuitionists generally *accept* that the physical world exists independently of our minds. Microbial life either exists or does not exist on a specific exoplanet *right now*, regardless of whether we have observed it or ever will. Its existence is a mind-independent fact.
      *   **Bivalence Holds:** Therefore, for such empirical propositions, the principle of bivalence (`P` is either true or false) holds. LEM (`P ∨ ¬P`) is valid for them *even if we lack verification*. Our epistemic limitations do not alter the underlying ontological reality.
      *   **Different Grounds for Assertion:** While an intuitionist mathematician would *not* assert `P ∨ ¬P` for Goldbach without a proof of one disjunct, they *would* readily assert "Microbial life exists on exoplanet X ∨ Microbial life does not exist on exoplanet X" based on the ontological commitment to the mind-independent reality of the physical world and bivalence applying to it. Verification is an epistemic challenge about *knowing* which disjunct is true, not about the *meaning* or *validity* of the disjunction itself.

  4.  **The Boundary: Abstract vs. Concrete (Mental Construction vs. Mind-Independent Reality):**
      *   **The boundary is drawn precisely by the intuitionist's core ontological thesis.** Intuitionistic logic applies rigorously to the domain where truth and existence are *defined* as products of mental construction: **pure mathematics**.
      *   **Ontological Distinction:** The distinction is between:
          *   **Mathematical Reality:** Constituted by mental constructions. Truth requires constructive proof.
          *   **Empirical Reality:** Exists independently. Truth is correspondence (even if verification is difficult or impossible).

  5.  **Relation to Verificationism (and the Confusion):**
      *   **Similarity:** Intuitionism shares a *superficial resemblance* with logical positivism/verificationism: both emphasize the necessity of verification (proof/evidence) for *meaningful assertion*. Both reject metaphysical claims lacking verification.
      *   **Crucial Difference:** The *reasoning* is fundamentally different.
          *   **Verificationism:** Primarily an *epistemic/semantic* doctrine: The meaning of a statement *is* its method of verification. Asserting something unverifiable is meaningless *because* meaning depends on verification.
          *   **Intuitionism:** Primarily an *ontological* doctrine about mathematics: Mathematical truth *is constituted by* construction/proof. Asserting `P ∨ ¬P` without proof is unjustified *not* because the statement is meaningless (it has clear constructive meaning!), but because it falsely assumes a pre-existing, construction-independent truth-value for `P`. The meaning of `P` is tied to what counts as a proof of `P`.
      *   **Consequence:** Verificationism, if applied universally, *would* require suspending judgment on unverifiable empirical claims like the exoplanet life. Intuitionism, being an ontological thesis about *mathematics only*, does not.

  **Conclusion:**

  You are correct to be wary of the "sliding" characterization. **The rejection of LEM in intuitionism is rigorously confined to the abstract mathematical domain, justified by its specific ontological foundation: mathematical truth is mental construction.** It is *not* a general epistemic principle mandating suspension of judgment on all unverified claims. Intuitionists readily accept bivalence and LEM for empirical propositions concerning the mind-independent physical world, precisely because their core ontological thesis about *mathematical existence* does not apply there.

  **Key Distillation for Your Piece:**

  *   **Intuitionism:** An ontological theory about the nature of mathematical objects and truth (mental construction). Rejects LEM *for mathematics* because mathematical truth requires constructive proof. *Not* a general epistemic skepticism.
  *   **Verificationism:** An epistemic/semantic theory about meaning and justification. Rejects unverifiable statements *in general* as meaningless or unjustified.
  *   **Boundary:** Defined by the intuitionist's core ontological commitment: construction-dependent truth/existence (math) vs. mind-independent truth/existence (empirical world).

  Avoid characterizing intuitionists as being "skeptical" about unknown mathematical facts; they are making a stronger claim: those "facts" *do not exist* as truths until constructed. For the exoplanet, they are merely *ignorant* of a pre-existing fact. This ontological commitment is the anchor preventing the slide into general verificationism.
