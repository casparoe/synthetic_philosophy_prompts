answer: |-
  **INTERNAL MEMORANDUM**  
  **The Society for Psychical Research**  
  **Ethical Assessment Committee (Sidgwick Chair)**  
  REF: EAC/1893/04  
  SUBJECT: Provisional Funding Allocation for Spectral Phenomena (Q2 1893)  
  AUTHOR: Dr. E. Vance, Committee Secretary  
  DATE: 15th May, 1893  

  **I. PURPOSE**  
  This memorandum details the Committee's application of the Sidgwick Ethical Framework (SEF) – comprising Egoistic, Utilitarian, and Intuitionist principles – to assess petitions for funding and investigative resources concerning alleged hauntings. The objective is rational allocation based on quantifiable moral merit, ensuring spectral expenditure aligns with the Society's commitment to empirical ethics.  

  **II. METHODOLOGICAL OVERVIEW**  
  Per SEF Protocol §2, each reported apparition is evaluated under three criteria:  

  1.  **Utilitarian Metric (Net Pleasure Units - NPU):** Calculates aggregate hedonic impact upon percipients. Factors include: awe-induced inspiration (+), corroborative value for survival thesis (+), terror-induced fainting (-), property devaluation (-), and disruption of domestic harmony (-).  
  2.  **Egoistic Metric (Post-Mortem Interest Satisfaction - PMIS):** Assesses the *apparition's own* perceived benefit. Does the manifestation serve a coherent, self-interested aim (e.g., justice-seeking, warning, completion of unfinished business)? Or is it mere involuntary 'psychic residue'?  
  3.  **Intuitionist Metric (Duty Fulfillment Quotient - DFQ):** Determines if the manifestation adheres to an *intuitive moral duty to manifest*. This presupposes deceased agents retain ethical obligations (e.g., to rectify wrongs, provide closure, affirm the afterlife). Violations (e.g., baseless frights) score poorly.  

  **CRITICAL ADJUNCT: The Continuity Coefficient (CC)**  
  A novel metric (Vance, *JSPR* Vol. XI, pending) quantifying the persistence of personal identity post-mortem (Range: 0.00 [Complete Dissolution] to 1.00 [Unbroken Continuum]). A CC ≥ 0.70 is required for *any* moral consideration under SEF, as lower values indicate mere "phantasmal automata" lacking authentic agency or interests. CC is foundational to PMIS and DFQ validity.  

  **III. CASE ASSESSMENTS & RECOMMENDATIONS**  

  1.  **CASE #1893-07:** "The Wailing Chimneysweep" (Grimsby)  
      *   *Report:* Appears nightly in attic of former employer, emitting sorrowful moans. Causes sleep disturbance in current residents (family of four).  
      *   *Analysis:*  
          *   **NPU:** -1.8 (Severe distress outweighs mild curiosity value).  
          *   **PMIS:** Indeterminate. Sweep's incoherent moaning suggests no clear goal. **CC = 0.55** (Minimal identity persistence; likely residual emotional imprint). *Thus, PMIS is invalid.*  
          *   **DFQ:** 0.2 (No discernible duty served; frightens innocents unrelated to original grievance).  
      *   **RECOMMENDATION:** *Funding DENIED.* Lacks moral standing (CC<0.70) and scores poorly on applicable metrics. Classify as Class-C (Non-Agentive Echo).  

  2.  **CASE #1893-12:** "The Persistent Librarian" (Oxford)  
      *   *Report:* Appears in Bodleian stacks, reshelving misplaced volumes. Observed by 3 scholars, inducing calm focus. Claims duty to "maintain order."  
      *   *Analysis:*  
          *   **NPU:** +3.1 (Scholarly appreciation, serene atmosphere).  
          *   **PMIS:** +0.8 (Manifestly serves stated purpose of orderliness. Expresses satisfaction). **CC = 0.85** (High coherence; identity intact, albeit occupationally fixated).  
          *   **DFQ:** +1.5 (Strong intuitive duty to vocation; benevolent action).  
      *   **RECOMMENDATION:** *Funding APPROVED (£15).* High CC validates robust PMIS/DFQ. Excellent NPU. Potential for studying purposeful post-mortem utility.  

  3.  **CASE #1893-15:** "Lady Agatha's Lament" (Dorset)  
      *   *Report:* Manifestation in ancestral home, accuses descendant of embezzlement, demands public confession. Causes significant family distress and potential scandal.  
      *   *Analysis:*  
          *   **NPU:** -2.5 (Acute familial discord, reputational damage risk).  
          *   **PMIS:** +1.2 (Clear goal: restoration of honour/justice). **CC = 0.91** (Exceptional continuity; identity and grievance highly preserved).  
          *   **DFQ:** +1.0 (Plausible duty to rectify injustice, though method antagonistic).  
      *   **RECOMMENDATION:** *Funding PENDING.* High CC/PMIS/DFQ suggests moral weight, but negative NPU is prohibitive. Requires cost-benefit analysis: Does the utility of justice outweigh family distress? Committee divided. Further investigation authorised (£5) to quantify harm/benefit ratios.  

  **IV. FUNDING ALLOCATION SUMMARY**  
  *   Approved: Case #1893-12 (£15)  
  *   Denied: Case #1893-07  
  *   Pending Further Study: Case #1893-15 (£5 initial grant)  
  *   Unspent Q2 Funds: £80 (Reallocated to ectoplasm viscosity studies).  

  **V. ADMONITION**  
  Investigators must rigorously establish the **Continuity Coefficient (CC)** *before* full ethical assessment. Wasting Committee time on sub-0.70 phantoms reflects poorly on field methodology. Submit spectral interviews, behavioural consistency logs, and evidence of memory recall per CC Protocol Annex B.  

  Respectfully submitted,  
  **Dr. E. Vance**  
  Secretary, Ethical Assessment Committee  

  ---  
  *"Spectres demand scrutiny, not sentiment." - E.V.*
