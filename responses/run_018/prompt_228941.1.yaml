prompt: |-
  I am a retired biochemist, and over the course of a forty-year career in the pharmaceutical industry I sat on more animal-research oversight committees than I care to count. Since retiring I have joined a philosophy reading group, largely for the company, and one member in particular — a former patent attorney with no formal philosophical training — has a way of delivering instant, confident verdicts on every moral case we discuss. I have started writing her verdicts down, because I suspect there is a coherent principle underneath them and I want to figure out what it is. Her record so far: battery-cage egg production justified by cheaper supermarket eggs — clearly wrong, she says, because the savings are trivial against the hens' misery; blinding tests of a new shampoo on rabbits — clearly wrong; invasive studies on a few dozen rats for a promising childhood leukemia drug, when no animal-free method exists — permissible, though reluctantly; the very same leukemia study conducted on chimpanzees instead — not permissible, find another way or wait; painless killing of healthy surplus lab mice at a study's conclusion — acceptable, though she adds that breeding fewer would be better.

  The case I intend to put to her at our next meeting is this one. A compound shows early promise of substantially relieving chronic migraines for tens of millions of sufferers; testing it requires procedures that are brief but genuinely painful for a few hundred rats; the condition is debilitating but not life-threatening; and no animal-free testing method is available. My problem is that her track record seems consistent with at least three different rules, and they pull apart here. Under a straight aggregation rule, which weighs suffering and benefit across species impartially, the massive relief on the human side should settle the matter in favor of the tests. Under an asymmetry rule I have seen attributed, in essence, to Robert Nozick — the suggestion that something like utilitarian weighing is appropriate where animals are concerned while persons are protected by Kantian-style constraints that may not be overridden for aggregate benefit — everything turns on whether a non-life-saving benefit clears the seriousness threshold her leukemia verdict seems to set, and I genuinely cannot tell whether it does. Under a third rule, on which moral weight tracks a species' characteristic cognitive sophistication, rats rank low enough that the tests should pass — but then I would expect her chimpanzee verdict to have been about the apes' capacities rather than about the stakes, and the way she paired those two leukemia verdicts leaves that open.

  So here is what I would like. First, predict her verdict on the migraine case, and say which of these three rules — or what fourth rule I have missed — best accounts for all five of her earlier verdicts taken together, explaining what each candidate rule predicts about the new case and why you favor your best guess. Second, tell me whether her apparent position amounts to that Nozick-style asymmetry in practice, and where the known pressure points of such a view lie. Third, describe the single further case — one I could pose at the following meeting — whose verdict would discriminate between the two strongest candidate rules, and explain why it would settle the matter. Please write your answer in American English, and please be concrete about the cases rather than abstract about the principles.
reasoning: |-
  Okay, let me approach this systematically. The user presents an interesting puzzle about identifying the underlying ethical principle behind their philosophy group member's judgments on animal research cases. 

  First, I need to analyze all five existing verdicts to find patterns:
  1. Battery-cage eggs: Wrong due to trivial savings vs hen suffering
  2. Shampoo tests on rabbits: Clearly wrong
  3. Leukemia drug on rats: Permissible despite suffering
  4. Same study on chimps: Not permissible
  5. Painless mouse euthanasia: Acceptable

  The migraine case presents a new challenge - non-life-saving research causing brief but genuine pain to hundreds of rats. 

  Looking at possible principles:
  - Straight aggregation (utilitarian): Would likely approve due to massive human benefit
  - Nozick-style asymmetry: Would depend on whether migraines meet seriousness threshold
  - Cognitive sophistication: Should approve since rats rank low cognitively

  The cognitive sophistication theory seems weakest because her chimp rejection appears based on species status rather than just cognition. The leukemia case pairing shows she treats chimps differently than rats even for high-stakes research.

  The asymmetry model fits best when considering all cases collectively. She allows animal suffering only when: 
  1) Human stakes are sufficiently high (life-saving > leukemia drug) 
  2) Species is "lower" (rats yes, chimps no) 
  3) Suffering isn't gratuitous (shampoo tests fail this)

  For the migraine case prediction: Chronic migraines are debilitating but not lethal. Her leukemia case set a high threshold - life-saving for children. She'd likely reject the migraine tests as insufficiently urgent, mirroring her shampoo verdict where human benefit was trivial.

  To confirm this asymmetry model versus aggregation, I'd propose a discrimination case: Life-saving research causing severe prolonged suffering to a few chimps when no alternatives exist. An aggregator might approve; her asymmetric view would reject due to chimp moral status.

  The key pressure point for her view is defining the "seriousness threshold" - why life-saving research passes but severe chronic pain relief might not, and whether species boundaries justify such different treatment.
answer: |-
  Based on her pattern of verdicts and the migraine case details, here's the analysis:

  ### 1. Prediction for Migraine Case & Best-Fitting Rule
  - **Predicted Verdict:** She will likely deem the migraine tests **impermissible**.
  - **Best-Fitting Rule:** **Asymmetrical Threshold Rule**:  
    *Human interests may override animal suffering ONLY when (a) the human benefit is sufficiently "serious" (life-saving or equivalent), AND (b) the animals used fall below a cognitive/species-status threshold (e.g., rats yes, chimps no). Suffering must also be minimized and non-trivial human benefit demonstrated.*  

    **How the rules compare for the migraine case:**  
    - **Straight Aggregation:** Predicts **permissible** (massive human relief outweighs brief rat pain).  
    - **Nozick-Style Asymmetry:** Predicts **impermissible** (non-life-saving benefit fails seriousness threshold; animals protected by constraint).  
    - **Cognitive Sophistication:** Predicts **permissible** (rats rank low; pain brief).  
    - **Asymmetrical Threshold (Best Fit):** Predicts **impermissible** (migraines aren't life-threatening → fails seriousness test).  

    **Why this rule fits all five prior verdicts:**  
    - 🥚 Battery-Cage Eggs: Impermissible (human savings "trivial" → fails seriousness; hens suffer).  
    - 🐇 Shampoo on Rabbits: Impermissible (cosmetic benefit → fails seriousness).  
    - 🐀 Leukemia Drug on Rats: Permissible (life-saving benefit → clears seriousness; rats below threshold).  
    - 🦍 Same Drug on Chimps: Impermissible (chimps above species threshold, regardless of stakes).  
    - 💀 Painless Mouse Euthanasia: Acceptable (minimal suffering; no high-stakes benefit needed for basic lab operations).  

  ### 2. Is This Nozick-Style Asymmetry? Pressure Points  
    **Yes, in practice.** Her verdicts functionally create:  
    - **Kantian-style constraints for higher animals (chimps):** Cannot be sacrificed for aggregate human benefit, even for life-saving goals.  
    - **Utilitarian weighing for lower animals (rats/mice):** But ONLY when human benefits meet a high "seriousness" threshold (life-saving > quality-of-life).  

    **Key Pressure Points of This View:**  
    - **The "Seriousness" Threshold:** Why is childhood leukemia serious enough but chronic migraines (which cause profound disability) not? She likely draws the line at *mortality risk* (leukemia kills; migraines "only" diminish quality of life). This risks undervaluing severe non-lethal suffering.  
    - **Species Threshold Arbitrariness:** Why are chimps protected but rats not? She implicitly ranks species by cognition/status (chimps ≈ persons), but offers no clear line. Is a monkey above or below the threshold?  
    - **Suffering Scale Ignored:** Aggregation *within* animal suffering is discounted. Example: 1,000 rats in brief pain vs. 10 chimps in equal pain—her rule may still forbid the latter even if aggregate animal suffering is lower.  

  ### 3. Discriminating Case to Settle Between Rules  
    **Propose this case:**  
    *"Developing a drug to cure a rare, fatal genetic disease in 500 children requires invasive, highly painful 6-month experiments on 20 intelligent mammals (e.g., pigs or monkeys). No non-animal methods exist. The animals will experience severe chronic pain but survive."*  

    **Why This Discriminates:**  
    - **Asymmetrical Threshold Rule Prediction:** **IMPERMISSIBLE**  
      - Benefit is life-saving (clears seriousness!)... BUT pigs/monkeys likely exceed her species threshold (like chimps).  
      - Her chimp verdict shows species status trumps even high-stakes human benefits.  
    - **Cognitive Sophistication Rule Prediction:** **PERMISSIBLE**  
      - If weight tracks cognition, pigs/monkeys rank below humans but above rats. A life-saving cure for hundreds should outweigh their suffering under aggregation.  
      - Unlike shampoo (trivial benefit), this has maximal human stakes.  

    **Outcome:**  
    If she rejects this (due to species status), **Asymmetrical Threshold** is confirmed. If she permits it (weighing lives saved vs. animal cognition), **Cognitive Sophistication** wins. Her leukemia/chimp pairing suggests she’d reject it—but this case forces clarity by combining high stakes with higher animals.  

  ### Summary  
  Your colleague likely operates with a **hybrid model**: absolute protection for "person-like" animals (chimps) and constrained utilitarianism for others (only when human benefits are life-or-death). For migraines, the non-fatal nature fails her seriousness test, making rat suffering unjustified. The discriminating case exposes whether species status trumps *all* benefits or if cognitive capacity allows trade-offs at extreme stakes. Her philosophy is consistent but relies on contested boundaries—press her on *why* leukemia clears the threshold but migraines don’t, and where the species line falls.
