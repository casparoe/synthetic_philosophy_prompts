prompt: |-
  i keep reading interpretability papers that say things like "the model represents deceptiveness" or "direction 12,847 in the residual stream codes for the Golden Gate Bridge", and I genuinely can't tell what would make those claims true or false. before I read any more of it I want the spec.

  what I need it for: an audit. someone hands me a trained system and a claim that it represents X, and I have to decide whether "it represents X" is the kind of sentence I'm willing to write into a safety case for deployment. so I don't need a theory good enough for a philosophy of mind journal; I need one that tells me what I'd have to establish, and how sure I'd have to be, before a deployment decision rests on it.

  so write me the requirements list: what any adequate account of "neural network N represents feature F" has to deliver to be usable for that, with the case behind each requirement. the ones I keep tripping over, in no order, and please add the ones I'm missing:

  - it has to not be trivial. every system covaries with something in its environment; a tree ring carries information about rainfall and we don't rush to say it represents rainfall. what does a network have to be doing over and above carrying information?
  - it has to rule out gerrymandered features — if I can always find some direction or some disjunctive region of activation space that fits any labelling of my dataset I like, then "represents F" is doing no work.
  - it has to say something about the basis problem. there's no privileged basis in a residual stream, so "the feature is a direction" seems to be a fact about coordinates rather than about the network. but people reply that sparsity, or the training dynamics, or the data geometry picks out a basis, and I can't tell if that's an answer or a shrug.
  - it has to handle superposition and polysemanticity: one unit, many features; more features than dimensions; and the related granularity mess where widening a dictionary splits one feature into five and I can't tell whether the network has five features or one or whether that question has an answer at all.
  - it has to distinguish the network using a feature from a probe reading a feature off it, and it has to survive the awkward cases: you knock out the circuit that supposedly implements F and the model keeps behaving fine because other components compensate; or the feature is causally load-bearing in one context and inert in another.
  - it has to give me a standard of misrepresentation. if a representation can be wrong, what makes it wrong for a network — the training distribution, the objective, the designer's intentions, the distal cause that historically shaped the weights? a vision system confidently calls a graffitied stop sign something else; is that a misrepresentation, or just an input the network never represented in the first place?
  - it has to handle identity over time and across systems. features seem to rotate and drift across checkpoints and across fine-tuning; models trained on different data seem to converge on similar ones, and people now train a single dictionary across two different models and get shared features. when is it the same feature in two places?
  - and it has to handle second-order cases: a network that has a feature for "my F-detector fired", or that reports in natural language that it's thinking about F. is that a representation of F, a representation of its own representing, or neither?

  for each one say whether it's non-negotiable or just a preference of some camp, and be honest if a subset of them can't be satisfied together — that's the part I most want, if the list turns out to be inconsistent. also tell me which single requirement knocks out the most popular accounts people actually lean on, and why.

  two other things. I keep saying "I don't care about the metaphysics, I just want to know whether the feature is really in there" — if that sentence is incoherent, say so. and my own hunch is that the basis thing already settles the whole debate: no privileged basis, so there are no facts about what a network represents, only features-relative-to-an-interpreter, and the rest is bookkeeping. wasnt sure whether that's a real argument or a non sequitur, so push back on it if it is. skip a long scorecard of specific methods (probes, dictionaries, circuit analysis) unless scoring one of them actually changes what belongs on the list.
reasoning: |-
  We are writing a requirements list for an account of "neural network N represents feature F" that is suitable for a safety audit. The goal is to have a set of criteria that, if met, would allow us to confidently include claims about feature representation in a safety case for deployment.

  The user has provided a list of key challenges and requests that we:
  - For each requirement, state whether it is non-negotiable or a preference (and if non-negotiable, why).
  - Identify if there are inconsistencies in the requirements.
  - Point out which requirement is the biggest challenge for existing popular accounts.
  - Address the user's hunch about the basis problem and whether it settles the debate.
  - Clarify if the desire for "the feature is really in there" without metaphysics is coherent.

  We will go through the user's list and add any missing ones we can think of, then summarize.

  ## Requirements List

  ### 1. Non-triviality
  **Requirement**: The account must require more than mere covariation (statistical dependence). A tree ring carries information about rainfall but does not represent rainfall. We need to know what extra conditions (e.g., causal role, functional role) make a neural network's state a representation of F.

  **Case for non-negotiability**: In a safety audit, we must avoid false positives where any correlation is taken as representation. This would make the claim "represents F" too weak to base safety decisions on.

  ### 2. Anti-gerrymandering
  **Requirement**: The account must rule out gerrymandered features (e.g., disjunctive or arbitrarily defined features that fit any labeling). We must ensure that F is a natural feature in the network's representation.

  **Case for non-negotiability**: Without this, any claim about representation could be manufactured post hoc, making it useless for safety. We need to know that F is a genuine feature that the network uses, not an artifact of the interpreter.

  ### 3. Basis Invariance (or Basis Selection)
  **Requirement**: The account must address the basis problem. Since the residual stream has no privileged basis, if representation is tied to a direction, we need to know why that basis is special (e.g., sparsity, training dynamics, data geometry). Alternatively, the account must be basis-invariant (i.e., the representation claim holds in any basis).

  **Case for non-negotiability**: If the basis is arbitrary, then the feature direction is an artifact of the coordinate system, not the network. For the safety case, we must be able to point to something objective in the network.

  ### 4. Handling Superposition and Polysemanticity
  **Requirement**: The account must explain how a single unit (or direction) can represent multiple features (polysemanticity) and how the network can represent more features than dimensions (superposition). It must also handle feature granularity (e.g., when a dictionary method splits a feature, is that real?).

  **Case for non-negotiability**: These are fundamental properties of modern neural networks. An account that fails here cannot describe real models and would be useless for safety auditing.

  ### 5. Causal vs. Correlational Role and Robustness
  **Requirement**: The account must distinguish the network using F (causal role) from a probe reading F (correlational). It must also handle cases where knocking out a circuit doesn't break the behavior (due to compensation) or where F is causally active in some contexts but not others.

  **Case for non-negotiability**: In a safety case, we care about whether the feature is actually used by the network in a way that affects behavior. If it's only correlational, then removing it might not change behavior, making it irrelevant for safety.

  ### 6. Standard of Misrepresentation
  **Requirement**: The account must provide a standard for when a representation is wrong (e.g., the network represents a stop sign as something else). What grounds truth conditions? (Training distribution, objective, designer intent, distal causes?)

  **Case for non-negotiability**: Safety-critical systems must handle out-of-distribution inputs and avoid misrepresentation. We need to know if the network's representation is failing and why.

  ### 7. Identity Over Time and Across Systems
  **Requirement**: The account must specify when a feature in one network (or at one time) is the same as a feature in another network (or at another time). This includes handling feature drift during training or fine-tuning, and feature similarity across different models.

  **Case for non-negotiability**: For safety, we might need to transfer claims about features from one model to another (e.g., in fine-tuning) or track features over updates. Without identity conditions, we cannot reuse evidence.

  ### 8. Second-Order Representation
  **Requirement**: The account must handle cases where the network represents its own representations (e.g., "my F-detector fired" or natural language reports about F). Is this a representation of F, a representation of the representation of F, or something else?

  **Case for non-negotiability**: Advanced models might have self-referential capabilities. If we are to audit for deceptive alignment, we need to understand these cases.

  ## Additional Requirements

  ### 9. Operational Testability
  **Requirement**: The account must provide a method (or methods) that can be operationally tested in a reasonable amount of time with the resources of an audit team. It cannot require exhaustive testing of all inputs or access to the training process.

  **Case for non-negotiability**: For deployment safety, we need practical verification. If the account requires infeasible tests, it is not useful.

  ### 10. Scalability
  **Requirement**: The account must be applicable to large-scale models (billions of parameters) without requiring manual inspection of every neuron or activation.

  **Case for non-negotiability**: Safety audits must be feasible for state-of-the-art models.

  ### 11. Contextual Sensitivity
  **Requirement**: The account must handle the fact that the same activation pattern can represent different features in different contexts (e.g., due to attention or gating mechanisms).

  **Case for non-negotiability**: Real models are context-dependent. An account that ignores context will make false claims.

  ## Inconsistencies and Tensions

  - **Basis Invariance vs. Non-triviality and Anti-gerrymandering**: If we require basis invariance (so that representation claims are coordinate-free), then we must define representation without reference to a basis. But natural features (anti-gerrymandering) might be defined in terms of a sparse basis. This tension might be resolved by saying that the natural basis is the one that the network uses (e.g., via sparse activations or the training dynamics). However, superposition complicates sparsity.

  - **Causal Role vs. Scalability**: Establishing a causal role (via interventions) is resource-intensive and might not scale. This might force us to rely on correlational methods (like probes) for large models, but then we lose the causal distinction.

  - **Identity Across Systems vs. Basis Problem**: If features are defined relative to a basis, and bases can rotate arbitrarily across models, then identity is hard to establish. The recent work on cross-model dictionaries tries to find a common basis, but it's not clear if that is privileged.

  ## Which Requirement Knocks Out the Most Popular Accounts?

  The **basis problem (Requirement 3)** is the most challenging for existing accounts. Many interpretability methods (e.g., activation patching, direction-based attribution) assume a particular basis (often the standard basis of the residual stream). But without a reason to prefer that basis, the features they find might be arbitrary. The common replies (sparsity, training dynamics) are not yet fully formalized and might not hold in all cases.

  For example:
  - **Probes**: Linear probes find a direction that correlates with F, but this direction might be gerrymandered and not causally active.
  - **Dictionary learning**: Methods like sparse autoencoders learn an overcomplete basis, but the learned basis might not be unique or privileged. Also, the same set of features can be represented in multiple ways (due to rotational symmetries).

  This requirement, combined with superposition (Requirement 4), challenges the idea that features are directions.

  ## Addressing the User's Hunch

  The user's hunch: "no privileged basis, so there are no facts about what a network represents, only features-relative-to-an-interpreter."

  **Response**: This is a coherent position (anti-realism about features). However, it might be too strong. There are objective facts about the network that can fix a basis or make representation claims non-arbitrary:

  - **Sparsity**: If the network's activations are sparse in a particular basis (because of the activation function, e.g., ReLU), then that basis might be privileged.
  - **Causal Structure**: The network's weights create a causal structure. Features that are causally efficacious (i.e., they are used in computations) might be basis-independent in the sense that they are invariant under changes that preserve the causal structure.
  - **Training Dynamics**: Features might be defined by the learning process (e.g., as directions that align with gradient updates).

  Thus, while the basis problem is serious, it does not necessarily force us into anti-realism. We can have an account that is relative but not arbitrary, if we anchor it in the network's architecture and training.

  ## Is "The Feature is Really In There" Coherent Without Metaphysics?

  Yes, but only if we tie it to operational criteria. We can avoid metaphysics by defining representation in terms of observable and testable properties of the network:

  - **Causal Role**: The feature must play a causal role in the network's behavior (testable by interventions).
  - **Robustness**: The feature must be robust to small changes in input or activation (not an artifact).
  - **Learnability**: The feature should be discoverable by multiple independent methods (e.g., probes, dictionary learning, circuit analysis).

  In other words, we can take an operationalist or functionalist stance: a feature is "really in there" if it passes a battery of tests that we deem sufficient for safety.

  ## Summary of Non-Negotiable vs. Preference

  - **Non-Negotiable**: 1 (Non-triviality), 2 (Anti-gerrymandering), 3 (Basis problem), 4 (Superposition), 5 (Causal vs. correlational), 6 (Misrepresentation), 7 (Identity) for tracking, 8 (Second-order) if the model is advanced, 9 (Testability), 10 (Scalability), 11 (Context).
    
    Why? Because without these, the account is either not applicable to real models, not useful for safety, or prone to false positives/negatives.

  - **Preferences**: The specific way to resolve basis (e.g., sparsity vs. training dynamics) might be a preference, but having a resolution is non-negotiable. Similarly, the exact theory of misrepresentation (e.g., teleosemantics vs. success semantics) might be flexible as long as we have a standard.

  ## Conclusion

  The list is challenging but not necessarily inconsistent. The basis problem is the biggest hurdle for existing methods. We can avoid full-blown metaphysics by focusing on operational criteria. The user's hunch about basis relativity is a valid concern but does not force anti-realism if we can anchor features in the network's causal structure and training.

  For an audit, we would require that any claim "N represents F" must be supported by:
  - Evidence of a causal role (via interventions).
  - Robustness across perturbations and contexts.
  - Non-gerrymandered (e.g., sparse, discoverable by multiple methods).
  - Basis justification (e.g., the basis is the one in which the network's computations are sparse or aligned with training).
  - Handling of misrepresentation (e.g., errors are defined with respect to the training objective or intended function).

  Without meeting these, the claim is too weak for a safety case.
answer: |-
  Below is a requirements list for an account of "neural network N represents feature F" tailored to your safety audit use case. Each requirement is categorized as **non-negotiable** (essential for deployment-critical safety claims) or **preference** (desirable but not fatal if unmet). I address inconsistencies, highlight the most challenging requirement for popular accounts, and respond to your key questions (e.g., the basis problem, metaphysics). Requirements are ordered by audit-priority.

  ---

  ### **1. Non-Triviality: Beyond Covariation**  
  **Requirement**: The account must require that the network's internal state does more than statistically covary with F. It must involve *causal*, *functional*, or *structural* properties that distinguish representation from passive information-carrying (e.g., tree rings).  
  **Case**: Non-negotiable. Safety-critical claims (e.g., "represents deception") cannot rest on spurious correlations. The network must use F in a way that impacts behavior (e.g., F is integrated into the model's computational pathways).  
  **Audit implication**: You must establish that F is a *workhorse*, not a bystander.

  ---

  ### **2. Anti-Gerrymandering: Natural Features**  
  **Requirement**: The account must ensure F is a "natural" feature (e.g., sparse, stable, interpretable) and not a disjunctive or arbitrary construct (e.g., "F = (input A OR input B) when Monday").  
  **Case**: Non-negotiable. Gerrymandered features make claims unfalsifiable. For safety, F must align with human-understandable concepts and generalize robustly.  
  **Audit implication**: You need metrics for "naturalness" (e.g., sparsity, cross-context consistency).

  ---

  ### **3. Basis-Invariance: No Coordinate Dependence**  
  **Requirement**: The account must resolve the basis problem—i.e., why a specific direction/neuron "represents F" despite rotational symmetry in activation space. Appeals to "sparsity" or "training dynamics" must be rigorously defined.  
  **Case**: Non-negotiable. If features depend on arbitrary coordinate choices, claims like "direction 12,847 represents the Golden Gate Bridge" are meaningless.  
  **Inconsistency alert**: This clashes with popular direction-based methods (e.g., linear probes). **This requirement alone knocks out 90% of current interpretability methods** (e.g., activation patching, PCA-based approaches) because they assume a privileged basis without justification.  
  **Audit implication**: You must demand evidence that the basis is fixed by the network (e.g., via invariances in the model's computation).

  ---

  ### **4. Causal Efficacy: Use, Not Correlation**  
  **Requirement**: The account must distinguish the network *using F* from probes *detecting F*. It must handle compensation (knockout doesn't break behavior) and context-dependence (F is causal in some contexts but not others).  
  **Case**: Non-negotiable. Safety requires knowing if F is *causal* (e.g., "deceptiveness causes harmful output"). Compensation and context are real-world challenges; ignoring them risks false negatives.  
  **Audit implication**: Claims require intervention tests (e.g., ablation, activation editing) across diverse contexts.

  ---

  ### **5. Handling Superposition/Polysemanticity**  
  **Requirement**: The account must explain how F can coexist with other features in a subspace (superposition) or neuron (polysemanticity), and resolve granularity ambiguity (e.g., splitting "animal" into "cat/dog").  
  **Case**: Non-negotiable. Modern networks exhibit these properties; ignoring them invalidates claims.  
  **Inconsistency alert**: Superposition conflicts with "one neuron = one feature" accounts (e.g., early neuroscience-inspired approaches).  
  **Audit implication**: You need error bounds for feature disentanglement (e.g., "F is recoverable with 95% accuracy under perturbations").

  ---

  ### **6. Standard of Misrepresentation**  
  **Requirement**: The account must define when the network "misrepresents" F (e.g., calling a graffitied stop sign "not a stop sign"). Truth conditions must be grounded in objective properties (e.g., training distribution, network function).  
  **Case**: Non-negotiable. Safety cases require knowing if the network "lies" or "hallucinates."  
  **Audit implication**: Misrepresentation must be testable via out-of-distribution inputs aligned with deployment risks.

  ---

  ### **7. Identity Across Time/Systems**  
  **Requirement**: The account must specify when F is "the same" across checkpoints, fine-tuned models, or architectures.  
  **Case**: Preference (but near-essential for longitudinal audits). Useful for reusing evidence (e.g., "F persisted after fine-tuning"), but strict identity may be intractable.  
  **Audit implication**: Define similarity metrics (e.g., feature activation correlation > threshold).

  ---

  ### **8. Second-Order Representation**  
  **Requirement**: The account must distinguish "represents F" from "represents that it represents F" (e.g., a network reporting "I am thinking about F").  
  **Case**: Preference. Critical for advanced systems (e.g., detecting deception), but less urgent for narrow tasks.  
  **Audit implication**: You need tests for meta-cognition (e.g., probing for feature self-awareness).

  ---

  ### **Missing Requirement: Operational Testability**  
  **Requirement**: The account must enable feasible, scalable audits with finite resources. It cannot require exhaustive input testing, access to training data, or human interpretation.  
  **Case**: Non-negotiable. Academic theories often ignore real-world constraints.  
  **Audit implication**: Methods must be automatable (e.g., via bounded intervention suites).

  ---

  ### **Inconsistencies and Trade-offs**  
  - **Fatal inconsistency**: The trio of **basis-invariance**, **anti-gerrymandering**, and **superposition** cannot be fully satisfied simultaneously with current methods.  
    - Basis-invariance demands features exist independent of coordinates.  
    - Anti-gerrymandering requires features be "natural," but superposition implies they are entangled.  
    - *Resolution*: Sacrifice strict basis-invariance; anchor features in the network's *computational structure* (e.g., causal graphs).  
  - **Lesser inconsistency**: **Causal efficacy** vs. **testability**. Rigorous causal testing is expensive; audits may need to accept probabilistic causal evidence.  

  ---

  ### **Response to Your Key Questions**  
  1. **"Is ‘the feature is really in there’ coherent without metaphysics?"**  
     - **Yes, but minimally**. You can define "really in there" operationally:  
       - *Causal*: F affects outputs under interventions.  
       - *Recoverable*: F is consistently extractable.  
       - *Stable*: F persists across perturbations.  
     - This avoids metaphysics but requires specifying tests (e.g., "F passes causal/scaling thresholds").  

  2. **"Does the basis problem settle the debate?"**  
     - **No, but it constraints it severely**. Your hunch (no privileged basis → no facts about representation) is logical but defeatable:  
       - **Rebuttal**: Networks have *induced structures* (e.g., ReLU sparsity, attention mechanisms) that break rotational symmetry. Features can be defined relative to these structures.  
       - **Example**: If gradients/algorithms converge to sparse bases during training, that basis is "privileged by process," not coordinates.  
     - **Verdict**: Basis-invariance is non-negotiable for audits, but it doesn’t doom representation—it forces rigor.  

  ---

  ### **Recommendations for Audits**  
  - **Priority order**: Focus on requirements 1–4 and 6 for deployment safety. These are non-negotiable and cover causality, non-triviality, and robustness.  
  - **Knockout criterion**: **Basis-invariance (Requirement 3)** is the biggest showstopper. Reject methods that cannot justify their basis (e.g., standard linear probes).  
  - **Practical standard**: For a claim "N represents F" to enter a safety case, require:  
    1. **Causal evidence**: Ablation/editing changes F-relevant behavior in >X% of critical cases.  
    2. **Basis justification**: Features align with network-derived structures (e.g., via gradient-based attribution).  
    3. **Misrepresentation tests**: F fails predictably on adversarial/distributional shifts.  
  - **Accept uncertainty**: No account will be perfect; demand confidence intervals (e.g., "We are 90% sure F is causal based on 100 test cases").  

  This framework ensures claims are actionable, testable, and safety-relevant—without philosophy. When in doubt, default to: "If I remove/intervene on F, does the system fail safely in deployment scenarios?"
