answer: |-
  Based on your detailed description, this is a sophisticated and pernicious dialectical pattern. While no single established term perfectly captures *every* nuance you describe, the most fitting concept is **Dialectical Bifurcation**. Here's a precise definition and analysis:

  **Term:** **Dialectical Bifurcation** (or **Normative-Deflective Bifurcation**)

  **Definition:**
  A dialectical strategy where a theoretical framework (e.g., revealed preference) is deliberately maintained in a state of **conceptual ambiguity** regarding its core ontological or normative commitments. This ambiguity allows proponents to strategically **bifurcate** its application into two distinct, logically incompatible stances:
  1.  **Defensive Deflationism:** When challenged on the framework's descriptive adequacy or normative validity (e.g., irrational choices), proponents retreat to a minimal, purely formal, descriptive, or operationalist interpretation ("utility is *just* a representation of choice data; it makes no claims about 'real welfare'").
  2.  **Expansive Normativism:** When applying the framework to generate substantive conclusions (e.g., welfare comparisons, policy prescriptions), proponents implicitly or explicitly rely on a robust, realist, or normative interpretation ("choices *reveal* true preferences/welfare, therefore we can use them to maximize well-being, correct 'mistakes', or compare individuals").

  The key mechanism is the **strategic exploitation of the framework's inherent ambiguity** to deflect criticism in one domain while deriving strong conclusions in the other, *without ever reconciling the tension between the two stances or acknowledging the shift in underlying commitments*. The shared vocabulary ("reveals," "preferences") masks the divergent philosophical baggage.

  **Distinguishing it from Similar Concepts:**

  1.  **Motte-and-Bailey:**
      *   **Difference:** Motte-and-bailey relies on a *clear hierarchy*: the easily defensible "motte" (stance one) is used *only* to protect the less defensible but desirable "bailey" (stance two). Retreating to the motte *abandons* the bailey claim. In Dialectical Bifurcation, **both stances are actively used and considered core applications**. The defensible stance (deflationism) isn't just a fallback; it's used to *protect the legitimacy* of the expansive stance (normativism) *while continuing to employ the latter* in different contexts. The proponent doesn't abandon the normative claims; they shield them from critique using deflationism.

  2.  **Conceptual Stretching:**
      *   **Difference:** Conceptual stretching involves expanding a term's meaning beyond its original scope, often leading to vagueness. Dialectical Bifurcation isn't primarily about stretching a *single term's* meaning, but about maintaining a *framework* in a state where its *fundamental interpretation* (formal vs. substantive) is left ambiguous. The ambiguity isn't accidental vagueness; it's a **strategically maintained resource** enabling the bifurcation. The *same* terms are used consistently within each stance, but the *metaphysical/normative commitments* change radically.

  3.  **Ordinary Theoretical Pluralism:**
      *   **Difference:** Legitimate pluralism involves consciously employing *different*, well-defined models or interpretations for *different purposes*, acknowledging their distinct assumptions and limitations. Dialectical Bifurcation **denies or obscures the incompatibility** between the two stances. Proponents present the framework as a unified whole, seamlessly transitioning between the deflationary and normative modes *without acknowledging the shift in foundational assumptions* required for each application. It's pluralism without transparency or reconciliation.

  **Boundary Conditions: When is it Legitimate vs. Problematic?**

  The framework *legitimately* combines deflationary and normative uses **only if**:

  1.  **Explicit Acknowledgment:** Proponents explicitly acknowledge the distinct philosophical commitments required for each type of use (descriptive modeling vs. normative prescription).
  2.  **Justification of the Bridge:** When moving from descriptive choice data to normative conclusions, proponents provide a *separate, explicit, and argued justification* for why observed choices *in this specific context* should be granted normative weight, addressing known limitations (biases, information deficits, self-control issues). They don't simply assume the framework magically bridges the gap.
  3.  **Contextual Delimitation:** The scope and limitations of each application (descriptive vs. normative) are clearly defined. The deflationary stance isn't used to *immunize* the normative stance from critique; critiques of the normative leap are engaged with directly.
  4.  **Theoretical Coherence (or Acknowledged Incoherence):** The framework either demonstrates internal coherence regarding its ontology/normativity *or* explicitly argues why such coherence isn't necessary for its specific pluralistic purposes.

  **The pattern you describe (Dialectical Bifurcation) arises when:**

  1.  **Ambiguity is Strategic:** The conceptual ambiguity regarding ontology/normativity is maintained as a resource, not resolved.
  2.  **Stance-Shifting is Unexamined:** Shifts between Defensive Deflationism and Expansive Normativism occur without acknowledgment or justification.
  3.  **Deflection Replaces Engagement:** Defensive Deflationism is used primarily to *deflect* substantive critiques of the framework's normative applications, rather than to clarify its limited scope.
  4.  **Immunization:** The framework is presented as inherently capable of both tasks (pure description *and* robust normative foundation) without needing additional philosophical argument, making it seemingly immune to critiques that apply to either stance alone.
  5.  **Slogans Mask Divergence:** Shared slogans ("choice reveals preference") are used to create an illusion of unity, obscuring the radically different work they do in each stance (mere tautology vs. substantive claim about welfare).

  **In essence:** Dialectical Bifurcation occurs when the inherent philosophical tensions within a framework (like revealed preference's tension between behaviorism and welfarism) are not resolved but are instead *leveraged* rhetorically to defend the framework against criticism while simultaneously using it to derive strong, contested conclusions. The framework becomes a dialectical tool, its ambiguity a feature, not a bug. It crosses the line from legitimate application when the shift between stances is unacknowledged, unjustified, and used strategically to deflect criticism aimed at the normative conclusions derived from the expansive stance.
