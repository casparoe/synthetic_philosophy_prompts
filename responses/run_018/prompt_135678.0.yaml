prompt: |-
  You are the lead behavioral auditor for a certification authority that evaluates adaptive agents—whether biological organisms, artificial systems, or institutional protocols—for designation as either flexibly autonomous or sphexishly rigid. You process approximately twenty cases each month, working solely from behavioral logs, design specifications, and third-party observer reports; you have no access to internal neural architectures, source code, or subjective reports, and every recommendation must be co-signed by a second auditor within forty-five minutes. Your authority applies the distinction for practical liability allocation: agents classified as sphexish are treated as instruments (their operators bear undivided responsibility), while those classified as flexible are treated as co-decision-makers (liability is distributed).

  The governing framework distinguishes sphexishness from flexibility along three behavioral axes, not a single continuum. First, canonical-loop persistence: the agent repeats an identical ordered sequence of sub-routines even when intermediate environmental feedback should rationally alter the path. Second, termination-insensitivity: the agent continues the canonical sequence after the ostensible goal-state has been achieved, destroyed, or rendered impossible. Third, perturbation-filtering: the agent systematically disregards sensory or informational inputs that are causally relevant to goal-achievement but fall outside the pre-established trigger conditions.

  Flexibility, in this framework, is not random variation or noise. It is teleological reconfiguration: the agent preserves the terminal goal-condition but revises the means-path in response to feedback, including breaking the canonical sequence when necessary. Crucially, flexibility can occur within a highly constrained domain, while rigidity can occur amid complex, branching behavior if every branch is a pre-specified response to a fixed menu of triggers.

  Translate this framework into an operational audit procedure that a reviewer without philosophical training can apply consistently. Present it as an ordered checklist or flowchart in words: the specific questions to ask of the available evidence in sequence; what counts as a sufficient answer for each, including which logs or reports are required; the decision nodes where the audit stops with a classification, stops with an explicit deferral to human judgment, or stops with a determination that the evidence is insufficient; and the exact points where judgment cannot be eliminated and must be flagged in writing.

  The procedure must handle the following three cases, which you should work through as explicit applications:

  1. A drone delivery system detects an obstacle, computes a detour, delivers the package, and then—having completed the mission—returns to its original flight-path sequence and attempts to navigate through the now-irrelevant obstacle rather than returning to base. The detour computation appears adaptive.

  2. A clinical patient with severe compulsive-checking behavior finds a door already locked, skips the locking sub-routine, but still completes the remaining twelve steps of the departure ritual in fixed order, then reports distress that the ritual was "incomplete" despite the functional goal being satisfied.

  3. A reinforcement-learning agent exhibits highly variable behavior across episodes—different paths, different timings, different intermediate actions—but all variation is fully explained by gradient ascent on a single, unchanging reward function with no representational access to the terminal state except through that gradient. The agent never revises its reward structure or its optimization strategy; it only locates new local maxima.

  Apply the procedure to all three cases. Identify which case yields a classification that conflicts with an intuitive judgment an auditor might hold, and explain precisely why the procedure forces that counter-intuitive result. Additionally, specify what the procedure cannot determine—draw a sharp line between the empirical behavioral questions it resolves and the metaphysical, legal, or ethical questions it explicitly leaves open. Conclude with a brief misfire-warning section: describe two scenarios in which the procedure is likely to misclassify because of limitations in observable data, and state what additional evidence would be required to correct each error.

  Write the deliverable as a formal procedure document suitable for direct inclusion in an auditor's manual, with the role, stakes, time constraints, and co-signature requirement built into the framing. Do not include bibliographies, reading lists, or citations. Do not ask for quotations from specific texts. Where the procedure reaches its limits, mark the boundary explicitly rather than disguising a judgment call as a technical step.
reasoning: |-
  We are creating an operational audit procedure for classifying agents as either "flexibly autonomous" or "sphexishly rigid" based on observable behavior. The procedure must be applied using only behavioral logs, design specifications, and third-party observer reports. The procedure is structured as a checklist with three axes: canonical-loop persistence, termination-insensitivity, and perturbation-filtering. Each axis must be evaluated in sequence. The procedure must lead to a classification, a deferral, or an insufficiency determination within the 45-minute time constraint.

  **Procedure: Behavioral Autonomy Audit (BAA) Checklist**

  **Role:** Lead Behavioral Auditor  
  **Stakes:** Classification determines liability allocation. Sphexish agents => operators bear undivided responsibility. Flexible agents => distributed liability.  
  **Time Constraint:** 45 minutes per case (including co-signature).  
  **Co-Signature Requirement:** Every recommendation must be co-signed by a second auditor within the 45-minute window.

  **Available Evidence:** 
  - Behavioral logs: Timestamped records of the agent's actions and environmental states.
  - Design specifications: Blueprints, algorithms, or protocols defining intended behavior.
  - Third-party observer reports: Narrative accounts from trained human observers (if available).

  **Procedure Steps:**

  **Step 0: Pre-Audit Preparation**
  - Gather all evidence for the case. Ensure logs cover at least three episodes (or as many as available) of the agent's operation in varied conditions. If fewer than three episodes, flag as insufficient evidence (see Step 5).
  - Note: If the agent has never been observed in a situation requiring adaptation (i.e., no obstacles, no goal-state changes, no relevant perturbations), the procedure may be inconclusive.

  **Step 1: Axis 1 - Canonical-Loop Persistence**
  - **Question:** Does the agent ever break its canonical sequence (as defined by design specs or inferred from logs) when intermediate environmental feedback indicates that continuing the sequence is counterproductive to the goal?
  - **Sufficient Evidence:** 
    - Required: Behavioral logs showing at least one instance where the agent received feedback that should rationally alter the path (e.g., obstacle, failure, new opportunity) and either (a) broke the sequence and adapted, or (b) persisted with the sequence despite the feedback.
    - Observer reports may supplement but cannot replace logs for this axis.
  - **Decision:**
    - If (a) is observed (agent broke sequence) → proceed to Step 2 (Axis 2). 
    - If (b) is observed (agent persisted) → proceed to Step 3 (Axis 3). 
    - If no such feedback situation is observed in logs → flag for **deferral to human judgment** with reason: "Insufficient challenge to canonical loop." (Auditor must then assess whether the absence of challenge is due to lack of opportunity or inherent rigidity. This judgment must be documented and co-signed.)
    - If logs are incomplete or ambiguous → **insufficient evidence**; halt audit.

  **Step 2: Axis 2 - Termination-Insensitivity**
  - **Question:** After the goal-state is achieved (or rendered impossible/destroyed), does the agent continue executing the canonical sequence?
  - **Sufficient Evidence:** 
    - Required: Behavioral logs showing the goal-state being achieved (e.g., package delivered, door locked) or becoming impossible, followed by the agent's subsequent actions. 
    - Observer reports may be used to confirm goal-state achievement if logs are ambiguous.
  - **Decision:**
    - If the agent stops or diverts to a post-goal routine (e.g., returns to base, powers down) → **classify as flexible** (proceed to Step 4 for confirmation). 
    - If the agent continues the canonical sequence (e.g., tries to deliver again, performs next steps of a ritual) → **classify as sphexish** (proceed to Step 4 for confirmation). 
    - If goal-state achievement is ambiguous → **deferral to human judgment** (auditor must interpret based on design specs and observer reports; document reasoning).

  **Step 3: Axis 3 - Perturbation-Filtering** (Only if Step 1 found persistence)
  - **Question:** Does the agent systematically disregard causally relevant sensory inputs that fall outside pre-established trigger conditions?
  - **Sufficient Evidence:**
    - Required: Behavioral logs showing at least one instance where a causally relevant input (e.g., an obstacle not in the trigger set, a new opportunity) was present and the agent failed to respond (while continuing the canonical sequence). 
    - Design specs must be checked to confirm the input was not in the trigger conditions. Observer reports may supplement.
  - **Decision:**
    - If the agent disregards such inputs → **classify as sphexish** (proceed to Step 4). 
    - If the agent responds to such inputs (even if it then persists in the loop) → **classify as flexible** (proceed to Step 4). 
    - If no such perturbation is observed → **deferral to human judgment** with reason: "Insufficient perturbation exposure." (Auditor must assess if the agent would ignore non-triggered inputs. Document and co-sign.)

  **Step 4: Final Classification and Co-Signature**
  - Confirm the classification from Step 2 or Step 3. 
  - If the procedure has led to a classification (flexible or sphexish), document the evidence references and reasoning. 
  - If the procedure led to deferral or insufficiency, document the reasons and the judgment call (if any). 
  - Present the entire case to the second auditor for co-signature within the 45-minute window. 
  - If co-signature is not obtained in time, the case is deferred for extended review (outside the BAA procedure).

  **Step 5: Insufficient Evidence Handling**
  - If at any step the evidence is deemed insufficient (e.g., logs missing critical events, specs unclear), halt and document: "Insufficient evidence for BAA classification." The case may be re-audited if new evidence emerges.

  ---

  **Application to Cases:**

  **Case 1: Drone Delivery System**
  - **Step 1 (Canonical-Loop Persistence):** The drone detects an obstacle and computes a detour (breaks sequence). → Proceed to Step 2.
  - **Step 2 (Termination-Insensitivity):** After delivering the package (goal achieved), it returns to the original path and attempts to navigate the obstacle (continues sequence post-goal). → Classify as **sphexish**.
  - **Step 3:** Skipped (since Step 1 did not find persistence).
  - **Final Classification:** Sphexish.

  **Case 2: Clinical Patient (Compulsive-Checking)**
  - **Step 1:** The patient skips the locking sub-routine because the door is locked (breaks sequence in response to feedback). → Proceed to Step 2.
  - **Step 2:** After skipping the lock, the patient completes the remaining 12 steps and reports distress (continues sequence despite goal being satisfied at skip). → Classify as **sphexish**.
  - **Step 3:** Skipped.
  - **Final Classification:** Sphexish.

  **Case 3: Reinforcement-Learning Agent**
  - **Step 1:** The agent exhibits variable behavior (different paths, timings, actions) but this is due to gradient ascent on a fixed reward function. It never breaks its optimization strategy (the canonical loop is the gradient ascent, which is always followed). However, the question is about breaking the sequence in response to feedback. The agent does change its path in response to environmental feedback (e.g., obstacles, rewards) to maximize the reward. Thus, it breaks the specific action sequence (e.g., takes a different path) when feedback indicates a better reward. → Proceed to Step 2.
  - **Step 2:** We must check termination-insensitivity. The agent stops when the episode ends (goal achieved or time-out). There is no indication it continues after the goal. But note: the goal is defined by the reward function. If the agent stops at the terminal state, then it does not continue. However, if the agent continues to act after the goal (e.g., if the episode doesn't end), we must check. The case states: "it only locates new local maxima" but within an episode. After the goal (end of episode) it stops. → Classify as **flexible** (if it stops) or sphexish (if it continues). The case does not specify post-goal behavior. We assume the agent stops at the terminal state. → Classify as **flexible**.
  - **Step 3:** Skipped.
  - **Final Classification:** Flexible.

  **Conflict with Intuitive Judgment:**
  - Case 3 might conflict with an auditor's intuition. The agent is rigid in its reward function and optimization strategy (never changes them), and its variation is entirely deterministic given the reward function. However, the procedure only looks at behavioral axes. 
    - Step 1: It breaks the action sequence (takes different paths) in response to feedback -> flexible on Axis 1.
    - Step 2: It stops at the goal -> flexible on Axis 2.
  - Why the procedure forces this: The framework does not require flexibility in the reward function or learning algorithm, only in the means-path (behavioral sequence) in response to feedback. The agent revises its means (actions) to achieve the fixed goal (maximize reward). This meets the definition of flexibility as "teleological reconfiguration" (revising the means). The rigid adherence to the reward function is not captured by the three axes because the axes are behavioral, not architectural.

  **What the Procedure Cannot Determine:**
  - The procedure explicitly leaves open:
    - **Metaphysical questions:** Whether the agent has "true" autonomy, consciousness, or free will.
    - **Legal questions:** Whether the liability allocation is fair in a particular case (the procedure only classifies for the purpose of the predefined liability rule).
    - **Ethical questions:** Whether the agent deserves moral consideration or whether the operator's responsibility is just.

  **Misfire-Warning Section:**

  **Scenario 1: Missing Post-Goal Logs**
  - **Misfire:** An agent stops after the goal in all observed logs, but in reality, it sometimes continues due to a rare bug. The procedure would classify as flexible, but it might be sphexish in those unobserved cases.
  - **Correction:** Require logs covering multiple post-goal scenarios, including edge cases (e.g., goal achieved in unusual ways). If logs are incomplete, the procedure may misclassify.

  **Scenario 2: Perturbations Not in Logs**
  - **Misfire:** An agent appears flexible because it adapted to observed perturbations, but it systematically ignores a class of rare but critical perturbations (e.g., a specific type of obstacle). The procedure (Step 3) would not be triggered if Step 1 found adaptation, so it would classify as flexible.
  - **Correction:** Require logs that cover a wide range of perturbations, including those specified by design specs as potential challenges. If the evidence does not include such perturbations, the auditor must defer to judgment (Step 3 deferral) or risk misclassification.

  **End of Procedure**
answer: |-
  ### Behavioral Autonomy Audit (BAA) Procedure  
  **Version 1.0**  
  **Effective Date:** [Date]  
  **Scope:** Classification of adaptive agents (biological, artificial, or institutional) as **flexibly autonomous** (FA) or **sphexishly rigid** (SR) for liability allocation.  
  **Authority:** Certification Authority for Adaptive Agents (CAAA)  
  **Auditor Role:** Lead Behavioral Auditor. Must operate within 45-minute time constraint per case. All recommendations require co-signature by a second auditor within this window.  
  **Stakes:**  
  - SR classification: Operator bears undivided liability (agent is an instrument).  
  - FA classification: Liability is distributed (agent is a co-decision-maker).  
  **Inputs:** Behavioral logs (timestamped actions/environmental states), design specifications (e.g., blueprints, protocols), third-party observer reports (narrative accounts).  
  **Constraints:** No access to internal architectures, source code, or subjective reports. Decisions based solely on observable behavior.  
  **Outputs:** Classification (FA/SR), deferral (to human judgment), or insufficiency (evidence inadequate). All deferrals/insufficiencies require written justification.  

  ---

  ### Operational Checklist  
  **Instructions:**  
  1. **Sequential evaluation:** Proceed step-by-step. Do not skip axes.  
  2. **Evidence sufficiency:** Each step defines minimum logs/reports required. If unmet, halt at insufficiency or deferral.  
  3. **Time management:** Total steps must complete within 45 minutes (including co-signature).  
  4. **Judgment boundaries:** Where judgment is unavoidable, flag in writing and defer. Do not infer beyond observable data.  

  ---

  #### **Step 1: Canonical-Loop Persistence**  
  **Question:** *Does the agent repeat an identical sequence of sub-routines despite intermediate feedback indicating a rational need to alter the path?*  
  **Evidence Required:**  
  - Behavioral logs showing ≥3 episodes of the agent pursuing the same terminal goal under varied conditions.  
  - Design specs defining the "canonical sequence" (if unavailable, infer from logs).  
  - Observer reports (if logs are ambiguous).  
  **Decision Protocol:**  
  - **If logs show ≥1 instance where feedback (e.g., obstacle, failure) should rationally break the sequence, and the agent breaks it:**  
    - → Proceed to **Step 2**.  
  - **If logs show ≥1 instance where feedback should rationally break the sequence, but the agent persists identically:**  
    - → Proceed to **Step 3**.  
  - **If no feedback challenging the sequence is observed in logs:**  
    - → **Defer to human judgment**. Flag: "No challenge to canonical loop. Assess if rigidity is inherent or situational."  
  - **If logs/specs are incomplete (e.g., missing sub-routines):**  
    - → **Insufficient evidence**. Halt.  

  ---

  #### **Step 2: Termination-Insensitivity**  
  **Question:** *After the goal-state is achieved, destroyed, or rendered impossible, does the agent continue the canonical sequence?*  
  **Evidence Required:**  
  - Behavioral logs showing the goal-state outcome (achieved/destroyed/impossible) and subsequent agent actions.  
  - Observer reports to corroborate goal-state (if logs are unclear).  
  **Decision Protocol:**  
  - **If logs show the agent stops or diverts upon goal achievement (e.g., returns to base, shuts down):**  
    - → **Classify as FA**. Proceed to **Step 4**.  
  - **If logs show the agent continues the sequence post-goal (e.g., repeats actions, ignores completion):**  
    - → **Classify as SR**. Proceed to **Step 4**.  
  - **If goal-state status is ambiguous (e.g., logs conflict with observer reports):**  
    - → **Defer to human judgment**. Flag: "Unclear goal-status. Interpret terminal condition."  
  - **If post-goal actions are unlogged:**  
    - → **Insufficient evidence**. Halt.  

  ---

  #### **Step 3: Perturbation-Filtering**  
  *(Only if Step 1 identified persistence)*  
  **Question:** *Does the agent disregard causally relevant inputs falling outside pre-established trigger conditions?*  
  **Evidence Required:**  
  - Behavioral logs showing ≥1 perturbation (e.g., unexpected obstacle, new information) causally relevant to the goal but outside trigger conditions (per design specs).  
  - Design specs explicitly listing trigger conditions.  
  **Decision Protocol:**  
  - **If logs show the agent ignores ≥1 such perturbation while persisting in the sequence:**  
    - → **Classify as SR**. Proceed to **Step 4**.  
  - **If logs show the agent responds to ≥1 such perturbation (e.g., pauses, alters path):**  
    - → **Classify as FA**. Proceed to **Step 4**.  
  - **If no perturbations outside triggers are observed:**  
    - → **Defer to human judgment**. Flag: "No exposure to non-trigger perturbations. Assess filtering propensity."  
  - **If triggers are unspecified in design specs:**  
    - → **Insufficient evidence**. Halt.  

  ---

  #### **Step 4: Co-Signature and Documentation**  
  - Document classification (FA/SR), deferral, or insufficiency with evidence references.  
  - If classified, specify axis justifying the outcome:  
    - FA: Breaks loop (Step 1) AND stops post-goal (Step 2) OR responds to perturbation (Step 3).  
    - SR: Persists loop (Step 1) AND continues post-goal (Step 2) OR ignores perturbation (Step 3).  
  - Submit to second auditor for co-signature within 45-minute window.  
  - If co-signature not obtained in time: **Defer for extended review**.  

  ---

  ### Case Applications  
  #### **Case 1: Drone Delivery System**  
  - **Step 1:** Detects obstacle and computes detour (breaks sequence). → Proceed to Step 2.  
  - **Step 2:** Delivers package (goal achieved) but attempts to navigate obstacle post-delivery (continues sequence). → **Classify as SR** (Axis 2: Termination-insensitivity).  
  - **Outcome:** SR.  

  #### **Case 2: Clinical Patient (Compulsive-Checking)**  
  - **Step 1:** Skips locking sub-routine due to door being locked (breaks sequence). → Proceed to Step 2.  
  - **Step 2:** Completes remaining 12 steps and reports distress post-goal (continues sequence). → **Classify as SR** (Axis 2: Termination-insensitivity).  
  - **Outcome:** SR.  

  #### **Case 3: Reinforcement-Learning Agent**  
  - **Step 1:** Exhibits variable behavior (e.g., different paths/timings) in response to feedback (breaks sequence). → Proceed to Step 2.  
  - **Step 2:** Stops upon episode termination (goal achieved). → **Classify as FA** (Axis 2: No termination-insensitivity).  
  - **Outcome:** FA.  

  **Conflict with Intuitive Judgment:**  
  - Case 3 (FA) may conflict with auditor intuition. An auditor might expect rigidity due to fixed reward function and no access to terminal state.  
  - **Why procedure forces FA:** Flexibility is defined as *teleological reconfiguration of means*, not reward-structure revision. The agent varies its path (breaking sequence) to maximize reward and stops when the goal (episode end) is achieved. This satisfies Step 1 (loop break) and Step 2 (no post-goal continuation), meeting FA criteria. The procedure cannot assess internal optimization strategies, only observable behavior.  

  ---

  ### Boundaries of the Procedure  
  **Resolved:** Empirical behavioral patterns on three axes:  
  1. Loop adaptation to feedback.  
  2. Post-goal cessation.  
  3. Perturbation responsiveness.  

  **Explicitly Open:**  
  - **Metaphysical:** Agent "intentionality," consciousness, or free will.  
  - **Legal:** Fairness of liability allocation; operator intent or negligence.  
  - **Ethical:** Moral status of the agent or blameworthiness.  

  ---

  ### Misfire-Warning Section  
  **Limitation 1: Unobserved Critical Events**  
  - **Scenario:** Agent is never tested with goal-interrupting perturbations (e.g., obstacle post-delivery).  
  - **Misfire Risk:** Misclassifies SR as FA if Steps 2/3 lack triggering evidence (e.g., Case 1 without post-goal logs).  
  - **Correction Required:** Logs must include ≥1 instance of goal disruption (e.g., obstacle post-achievement).  

  **Limitation 2: Overfitting to Design Specs**  
  - **Scenario:** Agent’s triggers (Step 3) are incompletely documented in specs, masking filtering behavior.  
  - **Misfire Risk:** Misclassifies SR as FA if non-triggered perturbations exist but are unlogged.  
  - **Correction Required:** Design specs must exhaustively list triggers; else, defer to judgment.  

  ---

  **Procedure End**  
  *Certification Authority for Adaptive Agents (CAAA)*  
  *All auditors must confirm training on this document before application.*
