answer: |-
  Here's my decomposed credence that Mary's case proves non-physical knowledge exists, based *strictly* on your demonstrative-file framing. I'm not hedging—this is my steelmanned take against the knowledge argument:

  1. **P(Phenomenal concepts = demonstrative files for neural states): 65%**  
     *Plausible, but neural states' intrinsic nature might resist pure demonstrative capture without residue.*

  2. **P(Gaining the file is new *propositional* knowledge (not just ability)): 70%**  
     *Acquiring "THIS" (phenomenal red) enables new truth-apt judgments like "THIS is what red looks like"—exceeding mere know-how.*

  3. **P(Physicalism accommodates these files without collapse/eliminativism): 60%**  
     *The tightrope walk: files must reference subjective feels *as physical states* without implying extra properties. Reductive claims get shaky here.*

  4. **P(No fatal "redefinition" flaw in this framing): 70%**  
     *Your move isn't *cheating*—it's a coherent physicalist strategy. But it risks trivializing the "hard problem" if subjectivity isn't fully captured.*

  **Combined credence that Mary proves non-physical knowledge: 19%**  
  *(Calculation: 0.65 × 0.70 × 0.60 × 0.70 ≈ 0.19 → 19%)*

  **Least sure term: Physicalism's accommodation (#3 at 60%)**  
  This is the crux: **Your framing *survives* only if "pointing a mental file at a neural state" exhausts the phenomenal character.** If the file's content includes an ineffable "what-it's-like" that isn't ontologically grounded in the physical description, dualism sneaks in. I’m 60% because reductive physicalism *can* bite this bullet (cf. Papineau), but at the cost of denying the manifest intuition that experience "feels like more." **The weakness? Yes, this risks redefining "knowledge" to avoid the problem—if the demonstrative file *introduces* a new mode of access to the *same physical fact*, it’s defensible; if it implies a new *fact*, physicalism collapses.** Your move is valid but rests on denying the latter.
