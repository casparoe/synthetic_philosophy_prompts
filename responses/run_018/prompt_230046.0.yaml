  Okay, let's tackle this user's question. They're noticing a pattern where an old anomaly supports a new theory that wasn't designed to explain it, like Mercury's orbit and relativity. But when someone builds a theory to fit known facts, it's seen as cheap. The user is confused because both involve pre-existing facts supporting a theory, yet one is valued while the other isn't. 

  First, I need to recall the key concepts here. The first scenario is about novel predictions or accommodation. The anomaly here is Mercury's orbit. Relativity was developed independently, and it predicted the orbit's anomaly. That's a strong point for the theory because it wasn't adjusted to fit that data. The second scenario is curve-fitting or ad hoc explanations. If someone creates a theory specifically to fit existing data, it's less impressive because it could be overfitting—tailored too closely to known facts without predictive power.

  The user's main confusion is why pre-existing facts can support a theory in one case but not the other. The distinction lies in whether the theory was adjusted after the facts were known. If the theory's core principles naturally lead to the anomaly without tweaking, that's strong evidence. If the theory is built or modified to fit the data, it's weak. 

  I should explain that it's about predictive success vs. accommodation. Predictive success is when a theory forecasts unknown or existing but unconsidered data. Accommodation is fitting known data. The latter risks being ad hoc. For example, if Einstein tweaked relativity just for Mercury, it would be less credible. But since it emerged from general principles, it's robust.

  The user might also be wondering about the line between the two cases. It's not always sharp. Sometimes theories are refined, but the key is whether the adjustment is integral to the theory or a bolt-on fix. If the anomaly is explained without adding new parameters just for that case, it's better. 

  Another point is testability. A theory that predicts multiple phenomena, including the anomaly, is more testable and thus stronger. A curve-fitted theory might not make new predictions, making it less falsifiable. 

  The user's deeper need is understanding how to evaluate theories critically. They want to know when existing data genuinely supports a new theory versus when it's just storytelling. Clarifying the role of independent predictions and the risk of ad hoc adjustments is essential. They might be applying this to everyday situations, not just scientific contexts, so using relatable examples could help. 

  I should mention terms like "novel prediction" and "ad hoc hypothesis" to label the concepts. Emphasizing that the value comes from the theory's ability to predict beyond the data it was designed for. Also, noting that while the line can be fuzzy, the presence of multiple successful predictions and absence of arbitrary adjustments are key indicators.
answer: |-
  You've hit on a fundamental and subtle point in the philosophy of science, epistemology, and statistics. The distinction you're wrestling with is **real, crucial, and has well-defined names**, though the line can sometimes be blurry.

  Here's the breakdown:

  1.  **The General Puzzle:** Your core question – "Can already-known facts genuinely support a new theory?" – touches on the problem of **theory confirmation** or **evidential support**. Specifically, the challenge of **accommodation vs. prediction**.
      *   **Accommodation:** When a theory is constructed *or modified* to fit existing data.
      *   **Prediction:** When a theory forecasts *new, previously unknown* data (or data not used in constructing the theory).

  2.  **The Two Cases You Describe & Their Names:**
      *   **Case 1 (Mercury's Orbit & Relativity):** This is called **explaining a known anomaly via a novel, independently motivated theory**, or demonstrating **unintended explanatory power**. It's a form of **novel confirmation** (even though the data was known, *its explanation by this specific theory* is novel and unexpected). This is considered **strong evidence** for the theory.
      *   **Case 2 (Building a theory to fit known facts):** This is often called **curve-fitting**, **overfitting**, **ad hoc hypothesis development**, or **post-hoc rationalization**. This is considered **weak evidence** for the theory.

  **Why Case 1 is Strong Evidence (Novel Confirmation):**

  1.  **Independence & Lack of Tuning:** The core principles of the new theory (Relativity) were developed *without* looking at the specific anomaly (Mercury's orbit). The theory wasn't *tweaked* or had parameters *adjusted* to make Mercury fit. The anomaly's explanation flowed *naturally* and *inevitably* from the fundamental postulates (like the curvature of spacetime).
  2.  **Riskiness/Severity of Test:** The theory *risked* being wrong. If Relativity had predicted Mercury's orbit *incorrectly*, it would have been a major strike against it. Successfully predicting (or explaining) something difficult and specific that *wasn't* its initial target makes the success more impressive and less likely to be coincidence. It passes a **severe test**.
  3.  **Unification:** The theory explains *diverse* phenomena (e.g., electromagnetism, gravity, Mercury's orbit, later light bending, gravitational waves) under a single, coherent set of principles. Explaining the anomaly wasn't a bolt-on fix; it was an inherent consequence of the deeper framework. This demonstrates **explanatory depth**.
  4.  **Falsifiability:** The theory makes *many other* novel predictions beyond the known anomaly (e.g., gravitational lensing, time dilation). Its success with the known anomaly *increases confidence* that these *new* predictions are also likely true.

  **Why Case 2 is Weak Evidence (Curve-Fitting/Ad Hoc):**

  1.  **Tuning to the Data:** The theory is explicitly constructed *around* the known facts. Parameters are adjusted, auxiliary assumptions are added, or the theory's structure is chosen *specifically* to match the existing data points. This makes it highly probable it will fit *that specific data set* well, but tells us little about its truth or predictive power for *anything else*.
  2.  **Lack of Risk:** The theory doesn't risk falsification by the data it was built on. It's guaranteed (or highly likely) to fit *by design*. This isn't a test; it's just restating the data in theoretical language. It fails the **severity test**.
  3.  **Ad Hoc Modifications:** Often, such theories involve adding assumptions *solely* to rescue the core idea from contradiction with existing data, without independent motivation or increasing the theory's scope/power elsewhere. These are **ad hoc hypotheses**.
  4.  **Overfitting:** Especially in quantitative contexts, a model with too many parameters can perfectly fit the *training data* (the known facts) but perform poorly on *new data* because it has learned the noise and specific quirks of the training set rather than the underlying pattern. It lacks **generalizability**.
  5.  **Lack of Novel Predictions:** Such theories often struggle to make *new*, testable predictions that aren't just minor variations of the existing data they were built to explain. They may be **unfalsifiable** in practice.

  **The Crucial Distinction: Independence and Risk**

  *   **The Line:** The sharpest line lies in **whether the theory was constructed *primarily to fit* those specific known facts, or whether the explanation of those facts emerges *unexpectedly* and *inevitably* from principles developed for a different purpose.** Was the theory *tuned* to the data, or did the data *test* the theory?
  *   **Key Question:** "If this data *hadn't* existed when the theory was formulated, would the theory *still* make the same prediction about it?" For Relativity and Mercury, the answer is "Yes." For a curve-fitted theory, the answer is "No, the theory would likely look different."

  **Is the Line Always Sharp?**

  No, it can be fuzzy:

  1.  **Iterative Development:** Science often involves cycles. Initial theories might be inspired by known data (accommodation), but gain strength when they make *subsequent* novel predictions. The initial accommodation is weaker evidence; the later predictions are stronger. (E.g., Darwin knew existing fossils/anatomy, but his theory predicted future findings like transitional forms and genetic mechanisms).
  2.  **Degree of Modification:** How "ad hoc" is an auxiliary assumption added to explain an anomaly? Does it have independent motivation? Does it open new avenues of research?
  3.  **Theoretical Depth:** Sometimes a genuinely deep theory *requires* refinement when faced with data, but the refinement is a natural extension of its core principles, not a desperate patch. Distinguishing this from ad hoc-ery can be tricky.

  **Conclusion & Labels:**

  *   **General Puzzle:** The problem of **Accommodation vs. Prediction** in theory confirmation.
  *   **Case 1 (Strong Evidence):** **Novel confirmation**, **Explanation of an anomaly via independently motivated theory**, **Unintended explanatory power**, passing a **severe test**.
  *   **Case 2 (Weak Evidence):** **Curve-fitting**, **Overfitting**, **Ad hoc hypothesis development**, **Post-hoc rationalization**.
  *   **The Distinction:** Hinges on **theoretical independence** (was the theory built *for* this data?) and **risk** (did the theory genuinely risk falsification by this data?). A theory explaining *known* facts provides strong evidence *only if* that explanation was an *unforeseen consequence* of its core, independently established principles, making the success surprising and risky. Fitting data you specifically set out to fit is cheap; having your theory *happen* to explain a long-standing puzzle is powerful.

  You're absolutely right to feel the distinction is real but sometimes slippery. Recognizing this tension is key to critically evaluating scientific (and everyday) claims. The Mercury/Relativity case is a classic *because* it so clearly exemplifies the power of novel confirmation arising from deep theoretical principles.
