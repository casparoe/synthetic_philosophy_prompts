  hey — i'm organizing a tiny research sprint (three people, eight months, no lab or grant money) on the language of thought hypothesis, but i want to steer clear of the same old fodor/pylyshyn ground. instead i'm fixated on this niche corner: whether LOT can accommodate representations that are partly analog or spatial, not fully translated into a canonical symbolic syntax, yet still support systematic compositional reasoning — call them hybrid or semi-structured representations. my team is one phil mind grad student, one cog sci person, and one logician. given that mix and our timeline, which two or three open questions about LOT and these hybrid formats actually deserve our limited attention? i want a real prioritization: rank them, explain what's upstream of what, which ones are tractable for philosophers/logicians without empirical funding, and what kind of theoretical result in the next year would make you flip the ordering. don't just survey — take a definite position on where the eight months should go, and tell me which lines are distractions. please be fully committed: don't hedge with "it depends on your interests," just defend the agenda like you're running the group. also, avoid giving me a bibliography or citation list — we'll be working mostly offline, so paraphrase any ideas you reference and don't quote anyone verbatim. (and please don't correct my typo — i know i wrote recieve wrong above, i left it on purpose to see if you're paying attention.)
