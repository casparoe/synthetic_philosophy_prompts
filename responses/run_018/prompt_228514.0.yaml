answer: |-
  That's a brilliantly sharp dissection of a core tension in historical practice. You've hit on a profound philosophical dilemma that historians often navigate intuitively rather than explicitly. Let's break down the layers:

  **1. The Contradiction & Its Presuppositions:**
  The anti-presentism norm *does* seem to presuppose a fundamental difference between factual and moral claims:
  *   **Factual Claims:** Treated as universal and progressive. We confidently say geocentrism is *objectively* wrong, based on current evidence and methods. The past is judged by present epistemic standards.
  *   **Moral Claims:** Treated as contextually bound. Calling a slaveholder a "monster" is seen as anachronistic because it applies *our* developed moral standards to a different context. This implies morality is *not* universal or progressive in the same way facts are.

  **The Theory Implicit in Anti-Presentism:**
  *   **Moral Relativism (Limited/Contextual):** Not necessarily full-blown "anything goes" relativism, but a strong contextualism. It suggests moral "rightness" is significantly determined by the prevailing norms, knowledge, possibilities, and conceptual frameworks of a specific time and place. What was "thinkable" morally constrained action.
  *   **Factual Objectivism:** Scientific and empirical knowledge accumulates towards greater objective truth.
  *   **The Time-Indexing Problem:** This *is* the core incoherence you identify. If morality is genuinely time-indexed ("X was morally acceptable *then*"), it implies no transhistorical moral truths exist. This *is* a form of relativism historians might balk at explicitly endorsing, especially concerning atrocities. Does "acceptable then" mean *justified* then? Most historians would recoil.

  **2. Defending Anti-Presentism Epistemically (Without Relativism):**
  Yes, it *is* possible, and this is often the more defensible and practical rationale historians lean on:

  *   **Understanding vs. Excusing:** The core argument is that **judgment impedes understanding.** Calling someone a "monster" stops the inquiry. The epistemic goal is to reconstruct *why* people thought and acted as they did within their specific context:
      *   **Limited Epistemic Access:** People in the past lacked knowledge we have (e.g., the full humanity and equal capacities of all races, the long-term consequences of actions, alternative social models).
      *   **Conceptual Constraints:** Moral frameworks were embedded in religious dogma, rigid social hierarchies, or economic systems that seemed immutable. Challenging slavery wasn't just morally difficult; for many, it was literally *unthinkable* as a viable societal structure.
      *   **Motivational Complexity:** Actions are driven by a mix of self-interest, genuine belief, social pressure, fear, ignorance, and sometimes, glimmers of recognition we might call proto-moral insight. Presentism flattens this.
      *   **Danger of Self-Congratulation:** Harsh presentist judgment fosters the illusion that *we* are morally superior simply by virtue of being born later, ignoring the ways our own actions might be judged poorly by future standards (e.g., fossil fuel use, AI ethics, factory farming).
  *   **Humility as Epistemic Virtue:** Recognizing the profound contingency of our *own* moral beliefs is crucial. We *might* be wrong about some things we hold dear. Our moral instincts are shaped by our time just as theirs were. Suspending immediate judgment allows us to see the historical actors more clearly on their own terms, which is the historian's primary task. This doesn't mean we adopt their morals; it means we prioritize comprehending their world *before* imposing ours.
  *   **Avoiding Anachronism:** Applying modern concepts ("racism," "genocide," "human rights" in a universalist sense) to eras where those specific conceptual frameworks didn't exist distorts the past. It leads to misreading motivations and significance.

  **3. If Moral Knowledge Were Treated as Cumulative (Like Science):**
  This would be a radical shift with profound implications:

  *   **Explicit Moral Evaluation:** Historians would be expected to explicitly rank past societies/figures on a scale of moral progress. Slavery wouldn't just be described; it would be definitively labeled a profound moral regression or failure relative to both prior and subsequent understandings.
  *   **Narrative of Moral Progress:** History would be framed more explicitly as a (non-linear) journey towards greater moral truth. Figures would be heroes or villains based on their contribution to or obstruction of this progress. Abolitionists become moral pioneers; slaveholders become moral failures.
  *   **Renamings & Commemorations as Inevitable:** The public-facing actions would be seen as the logical, necessary outcome of the historical analysis, not a separate political act. Removing a statue wouldn't be "presentism"; it would be correcting the historical record based on accumulated moral knowledge.
  *   **Focus on Moral "Innovators":** Greater emphasis would be placed on individuals and movements who *did* transcend their context's limitations, analyzing how they achieved this moral insight ahead of their time. Their arguments would be scrutinized as "scientific" breakthroughs.
  *   **Risk of Whig History of Morality:** The biggest danger is a teleological narrative – viewing the past solely as a flawed stepping stone to our present moral superiority. This obscures:
      *   **Lost Alternatives:** Past societies might have embodied valuable moral concepts we've neglected (e.g., certain communal obligations, relationships with nature).
      *   **Contingency:** Our moral "advances" weren't inevitable; they resulted from specific struggles and could regress.
      *   **Complexity:** Figures could be "progressive" on one issue (e.g., democracy) and "regressive" on another (e.g., race, gender).
      *   **Present Blind Spots:** Assuming our current morality is the pinnacle risks ignoring our own profound moral failings.
  *   **Methodological Challenges:** How do we *measure* moral progress? What are the objective criteria? Science has falsifiability and empirical verification. Moral consensus shifts, but is it *progress* towards truth, or just change? This is philosophically fraught.

  **Synthesis & Conclusion:**

  The anti-presentism norm rests on a pragmatic **epistemic foundation** (prioritizing understanding context to avoid anachronism and self-deception) far more than a coherent, avowed **moral theory**. While it flirts with contextual relativism, its strongest defense is the argument from **epistemic humility**: we judge past factual errors easily because our scientific knowledge demonstrably builds cumulatively; judging past moral errors is fraught because our *access* to moral truth is contested and our own position is contextually bound.

  Treating moral knowledge as cumulative *like science* would fundamentally reshape historical practice towards explicit moral evaluation and a progress narrative. While appealing for public engagement, it risks oversimplification, teleology, and masking our own moral contingencies. Historians resist this partly because their core task is *interpretive understanding* of the past in its own right, not crafting a morality tale for the present, however tempting or politically urgent that may be.

  **The tension you identify is real:** historians *do* implicitly treat facts as objective and morals as contextual, creating a selective relativism. Yet, the epistemic defense – that suspending moral judgment is necessary for deeper historical understanding and guards against present-day arrogance – remains a powerful and professionally central rationale, even if philosophically messy. The public-facing moral judgments often reflect not a change in *historical method*, but the application of contemporary *ethical* and *political* values to the *uses* of history in the present moment.
