answer: |-
  1.  Your keyboard and that quasar *do* compose a genuine object – let's call it "KeyQuasar" – because composition is an ontological primitive requiring no further binding relation; its existence is simply a brute consequence of their co-existence, irrespective of human recognition or representation within any specific system like a codebase.  
  2.  Software design intentionally *restricts* composition for practical purposes (memory management, coherence, computational efficiency), creating selective aggregates like containers or classes; this artificial selectivity reflects engineering constraints, not a truth about fundamental reality where composition is universal and unconstrained.  
  3.  The "absence of a binding relation" you observe in code is precisely the *implementation* of a restriction – it's the deliberate *refusal* to treat KeyQuasar as an entity within that model, not proof that KeyQuasar lacks objective existence; software imposes parthood conditions, but metaphysics reveals they are unnecessary for existence itself.  
  4.  Your intuition relies on composition being a *derived* or *engineered* feature (like shared references), whereas I hold it is *basic* and *automatic*: just as two electrons exist without needing a "binding" force to *make* them exist, their mere existence already composes a further object without any additional glue.  
  5.  Codebases are selective *representations* of reality, mapping only entities deemed useful; the fact that KeyQuasar isn't *represented* doesn't mean it isn't *real* – it means your model, for good practical reasons, excludes the vast, unmanageable plurality of objects unrestricted composition entails.
