prompt: |-
  I'm doing a graduate reading group on self-locating belief this term, and I have to give the last presentation plus a short response paper. What I'd actually like to do is work out where the professor stands rather than summarise another paper. She's given verdicts on a pile of cases in seminar and I've tried to reconstruct them: standard Sleeping Beauty (fair coin, woken once on heads and twice on tails with the amnesia drug) she says 1/3 on heads; the version with a thousand tails awakenings she says 1/1001; a coin weighted two to one in favour of heads she says 1/2; told that it's Monday she says 1/2; the coloured-room variant where the room is red on Monday and blue on the tails Tuesday and she opens her eyes on red she also says 1/2, and she made a fuss about that one, saying that staying at a half is the whole point and that anyone who gets two thirds there has run the wrong update; the no-drug variant where a second awakening would tell her it's tails she says 1/2 on the first awakening; the version with infinitely many awakenings she refuses to touch and says the setup is broken.

  The trouble is I can't tell wether that's a principle or just taste, because every one of those is a case with a single person and a protocol. So here are three cases she hasn't ruled on and I want to know what she'll say. (1) The duplicate case: fair coin, on heads Beauty is woken alone on Monday, on tails a perfect atom-for-atom duplicate of her is made at the moment of the flip and both are woken at the same time in identical rooms, with nothing available to either that tells her which one she is. (2) The next-room case: on heads Beauty is woken once; on tails Beauty is woken once and a lab assistant who has been told the entire protocol, has his own memories and knows he is not Beauty is woken at the same time in an identical room. What should Beauty say, what should the assistant say, and is it a problem if they get different answers out of the same experiment? (3) The cosmology case: two theories that fit every observation we will ever make, one saying there are about 10^9 observer-containing civilisations and the other about 10^20, otherwise identical.

  My flatmate, who did this group last year, says she'll say 1/3, then 1/3 for Beauty and 0 for the assistant, then refuse the third because it isn't an experiment — his reasoning being that she's just counting how many subjects end up in the relevant situation. I don't buy it, partly because the coloured-room verdict shows counting isn't all she's doing, and partly because in the assistant case its the choice of who counts that seems to be doing the work. So: what rules actually fit her track record, what does each of them predict for the three cases, what's your best guess with the reasons for preferring it, and what single case should I bring to seminar that would separate the rules that are left standing? If there's also a case where her own principle gives an answer she'd hate, I'd love that one for the end of the presentation.
reasoning: |-
  Hmm, the user is preparing for a graduate reading group presentation on self-locating beliefs and wants to understand their professor's position. They've listed several cases with the professor's verdicts and provided three new cases to test the underlying principles. They're skeptical of their flatmate's interpretation that the professor is simply counting subjects, especially given the colored-room case where the professor insists on 1/2 probability despite different numbers of awakenings.

  First, I need to analyze the professor's existing verdicts to identify a consistent principle. The key cases are:
  - Standard Sleeping Beauty: 1/3 on heads
  - Thousand tails awakenings: 1/1001
  - Weighted coin (2:1 heads): 1/2
  - Told it's Monday: 1/2
  - Colored-room variant (red room): 1/2 and criticizes those who get 2/3
  - No-drug variant: 1/2 on first awakening
  - Infinite awakenings: rejects

  The flatmate's "subject counting" model fails for the colored-room case where the professor maintains 1/2 despite different awakening counts. The weighted coin case also contradicts pure counting since 2:1 weighting should yield 2/3 heads by counting but the professor says 1/2.

  The critical insight comes from the colored-room case where the professor emphasizes "running the wrong update." This suggests she's using a diachronic Bayesian update starting from prior probabilities, not just counting centered worlds. In the colored-room scenario, learning "the room is red" eliminates the tails-Tuesday-blue possibility while preserving heads-Monday-red and tails-Monday-red. Since the prior for Monday is 3/4 (due to two awakenings on tails), updating from P(red) = P(heads and red) + P(tails and Monday) = 0.5*1 + 0.5*0.5 = 0.75 gives P(heads|red) = 0.5/0.75 = 2/3. But the professor insists on 1/2, indicating she rejects this update method.

  This points toward the "halfer" position with a synchronic indifference principle applied to indistinguishable epistemic situations. She assigns equal probability to indistinguishable states, regardless of their causal history. In standard Sleeping Beauty, all awakenings are indistinguishable, so 1/3. But when awakenings become distinguishable (like seeing a red room), she reverts to the prior coin bias.

  For the new cases:
  1. Duplicate case: Atom-for-atom duplicates create two indistinguishable subjects on tails. Should be 1/3 heads (one subject) vs 2/3 tails (two subjects).
  2. Next-room case: Beauty is indistinguishable from her own awakenings but the assistant is distinct. Beauty should say 1/3 heads; assistant knows he's not Beauty, so P(heads) = 0 when he's awake. No contradiction since different epistemic positions.
  3. Cosmology case: She'll likely reject it as non-experimental, but if pressed, might apply indifference to observer-moments, yielding P(low) ∝ 10^9, P(high) ∝ 10^20.

  To test this, propose a variant of the duplicate case where duplicates are told "you are the original" or "you are the duplicate" - her principle would assign P(heads) = 1/3 before, then 1/2 after learning identity, which might feel counterintuitive.

  The user should also prepare for possible pushback on the cosmology case and have a response to the flatmate's "subject counting" model by emphasizing the colored-room counterexample.
answer: |-
  Based on your professor's track record and the nuances in her responses (especially the colored-room case), she appears to be a **Halfer who endorses a synchronic indifference principle applied to subjectively indistinguishable epistemic situations**, combined with a **rejection of diachronic updating when indistinguishability is broken**. This differs from simple "subject counting" and explains her rejection of the 2/3 answer in the colored-room case. Below, I'll reconstruct her principle, apply it to your three cases, predict her responses, and provide a diagnostic case to test it.

  ---

  ### **The Professor's Principle: Synchronic Indifference with Prior Preservation**
  1. **Synchronic Indifference**: When an agent finds themselves in an epistemically indistinguishable situation (i.e., they cannot tell which "instance" they are), they assign equal probability to each indistinguishable state.  
     - *Example*: Standard Sleeping Beauty (all awakenings feel identical) → \( P(\text{Heads}) = \frac{1}{3} \) (three indistinguishable states: H-Mon, T-Mon, T-Tue).

  2. **Prior Preservation Under Broken Indistinguishability**: When new information breaks the symmetry between states, probabilities revert to the *prior* coin bias (or objective chance) rather than updating via Bayes. This explains her 1/2 verdicts in cases like "told it's Monday" or the colored-room variant.  
     - *Key evidence*: In the colored-room case (red on Mon, blue on T-Tue), seeing red eliminates T-Tue-blue but *does not* update \( P(\text{Heads}) \) to 2/3. Instead, she preserves the prior 1/2. She rejects diachronic updating here because the new information ("I see red") creates a distinguishable state, collapsing back to the coin's bias.

  3. **Rejection of Non-Experimental/Infinite Cases**: She likely views probabilities as grounded in well-defined, finite experiments with clear causal protocols. Cosmology or infinite awakenings lack this, so she dismisses them.

  4. **Weighted Coin Case (2:1 Heads)**: Her 1/2 verdict confirms this is not about counting. With a biased coin, \( P(\text{Heads}) \) should be 1/2 *regardless* of awakenings because the indistinguishability is preserved, but the prior is fixed by the coin’s objective chance.

  ---

  ### **Predictions for Your Three Cases**
  Using her principle, here’s what she’ll say:

  1. **Duplicate Case (fair coin, atom-for-atom duplicate on tails)**:  
     - **Prediction**: \( P(\text{Heads}) = \frac{1}{3} \) for both subjects.  
     - **Reasoning**: On tails, there are two subjectively indistinguishable agents (original + duplicate). Each awakening is epistemically identical: neither knows if they are the original or duplicate, or if it's heads. There are three indistinguishable states:  
       - Heads: Original awakened (1 state)  
       - Tails: Original awakened (1 state)  
       - Tails: Duplicate awakened (1 state)  
       → \( P(\text{Heads}) = \frac{1}{3} \). *This matches your flatmate’s "subject counting" but for different reasons—it’s about indistinguishability, not counting per se.*

  2. **Next-Room Case (lab assistant woken on tails)**:  
     - **Beauty’s Prediction**: \( P(\text{Heads}) = \frac{1}{3} \).  
     - **Assistant’s Prediction**: \( P(\text{Heads}) = 0 \) if awakened (since he’s only awake on tails).  
     - **Is it a problem they disagree?** No—she’ll argue they occupy distinct epistemic positions. Beauty is indistinguishable across awakenings (H1, T1), so her \( P(\text{Heads}) \) is 1/3. The assistant *knows* he is not Beauty and is only awake on tails, so his \( P(\text{Heads}) = 0 \). This is consistent because their evidence differs.

  3. **Cosmology Case (10^9 vs. 10^20 civilizations)**:  
     - **Prediction**: She rejects it. "Not an experiment" — no well-defined causal protocol, no waking event, and infinite/undefined indistinguishability. If pressed, she *might* say probabilities are undefined or that we should default to the theory with simpler metaphysics (e.g., 10^9), but she won’t endorse indifference over observer-moments.

  ---

  ### **Best Guess & Why**
  - **Her Principle**: Synchronic indifference over indistinguishable *centered worlds* (David Lewis-style), with reversion to objective chances when indistinguishability fails.  
  - **Why I Prefer This Interpretation**:  
    - It explains all her verdicts, especially the colored-room case (where "seeing red" breaks indistinguishability but doesn’t change \( P(\text{Heads}) \) from 1/2).  
    - It distinguishes her from "thirder" counting (fails on weighted coin and colored-room) and from purely diachronic halfers (who would update to 2/3 in colored-room).  
  - **Flatmate’s Model Fails**: Simple "counting subjects" can’t explain the colored-room verdict (where counts differ but \( P(\text{Heads}) = 1/2 \)) or the weighted coin (2:1 bias should give \( P(\text{Heads}) = \frac{2}{3} \) by counting, but she says 1/2).

  ---

  ### **Diagnostic Case to Test Her Principle**
  **The "Duplicate with Revelation" Variant**:  
  - Setup: Identical to your duplicate case (fair coin, duplicate made on tails). But *after* awakening, each subject is truthfully told: "You are the original" or "You are the duplicate."  
  - **Question**: What is \( P(\text{Heads}) \) for a subject *before* and *after* this revelation?  

  **Predictions Under Her Principle**:  
  1. *Before revelation*: \( P(\text{Heads}) = \frac{1}{3} \) (indistinguishable states).  
  2. *After being told "You are the original"*: \( P(\text{Heads}) \) updates to \( \frac{1}{2} \).  
     - Reasoning: The revelation breaks indistinguishability. If she’s the original, there are two possible worlds: Heads (she’s awake) or Tails (she’s awake). Tails no longer includes the duplicate’s perspective from her epistemic view. So she reverts to the coin’s prior.  
  3. *After being told "You are the duplicate"*: \( P(\text{Heads}) = 0 \) (since duplicates only exist on tails).  

  **Why This Separates Competing Views**:  
  - **Thirder/Counting Model**: Would say \( P(\text{Heads}) = \frac{1}{3} \) before and \( \frac{1}{2} \) after "original" (updating eliminates duplicate).  
  - **Pure Diachronic Halfer**: Would insist \( P(\text{Heads}) = \frac{1}{2} \) throughout.  
  - **Her Principle**: Synchronic \( \frac{1}{3} \) pre-revelation, then reverts to \( \frac{1}{2} \) or 0 post-revelation.  
  - **Crucial Test**: Her jump from \( \frac{1}{3} \) to \( \frac{1}{2} \) for the original upon learning identity. If she endorses this, it confirms her synchronic indifference + reversion to prior under broken symmetry.  

  ---

  ### **A Case That Forces an Answer She Might Hate**
  **The "Extreme Duplicate" Case**:  
  - Setup: Fair coin. Heads: Beauty is woken once. Tails: *1,000 perfect duplicates* are created and woken, all indistinguishable.  
  - **Her Principle’s Prediction**: \( P(\text{Heads}) = \frac{1}{1001} \) (1 indistinguishable state on heads, 1000 on tails).  
  - **Why She Might Hate It**: This implies Beauty should assign \( P(\text{Heads}) \approx 0 \) upon waking, despite the coin being fair. It highlights the "absurdity" of synchronic indifference (e.g., "I’m probably a duplicate!"). Yet it matches her 1/1001 verdict in the "thousand awakenings" case, so she’s committed.  

  **Use This in Your Presentation**:  
  1. **Summarize her track record** → show how synchronic indifference explains everything.  
  2. **Pose your three cases** → predict her answers.  
  3. **Deploy "Duplicate with Revelation"** → forces her to reveal if she truly rejects diachronic updating.  
  4. **End with "Extreme Duplicate"** → to challenge the intuition that synchronic indifference leads to uncomfortable priors.  

  This approach avoids summarizing papers and directly engages her methodology. If she balks at cosmology or "Extreme Duplicate," press her on whether probabilities require finite, controlled experiments—this reveals her underlying commitments. Good luck!
