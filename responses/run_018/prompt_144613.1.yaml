answer: |-
  Here is the translation of heterophenomenology's three moves into narrative craft concepts, followed by the residue report:

  **1. Treating First-Person Reports as Texts Describing a World:**
  *   **Literary Analog:** **Free Indirect Discourse (FID) rendered as a Character's Embedded Narrative.** FID blends a character's thought/voice with the narrator's reporting. Here, the subject's entire report becomes a distinct "text" – an implicit or explicit narrative world constructed *by* the subject, presented *as if* it were objective reality within their frame. Think of a character recounting a dream or hallucination in vivid detail, where the narration presents *their version* as a coherent diegetic sub-world.
  *   **Difference in Function:** FID typically serves to *reveal* genuine (though perhaps flawed or partial) interior states *to the reader* by blurring narrator/subject boundaries. In this heterophenomenological analog, the "embedded narrative" (the report) is treated as a *self-contained artifact* for analysis, not primarily as a window into an assumed real interiority. The focus shifts to the *construction* of the narrative world itself.
  *   **Distortion Required:** FID's power relies on the *presumed reality* of the character's underlying experience, even if misperceived. The heterophenomenological move requires stripping this away, treating the embedded narrative *only* as a textual output, severing its assumed direct link to a private phenomenal reality. The "world" described is a *representation*, not an access point.

  **2. Adopting a Neutral Stance Towards the Reality of the Described Entities/Events:**
  *   **Literary Analog:** **The Implied Author's Contractual Stance towards an Unreliable Narrator's Diegesis.** The implied author presents the subject's narrative world (from move 1) to the reader, but *withholds* any definitive judgment within the text about its ontological status relative to the primary diegetic level (the "real world" of the investigation). It's akin to presenting a character's delusional account without the narrator explicitly confirming or denying its truth *within the fictional reality*, forcing the reader to hold competing possibilities. The investigator becomes a narrator refusing to adjudicate the veracity of the subject's embedded narrative.
  *   **Difference in Function:** Literary unreliability usually functions *dramatically* – to create tension, irony, or character depth – and often implies a knowable truth (even if obscured). The implied author usually *has* an implicit stance. The heterophenomenological neutrality is *methodological*, not dramatic; it's a deliberate suspension of ontological commitment *as a rule* for generating data. The "truth" is deliberately rendered inaccessible or irrelevant to the analysis.
  *   **Distortion Required:** Fiction thrives on the *tension* between appearance/reality and the implied author's guiding perspective. This move requires suppressing *all* implied authorial judgment about the reality of the reported world, treating the subject's diegesis as a *flat textual given* with no implied "real" counterpart within the investigative frame. The contract becomes: "This is the subject's story world; I present it without endorsing or refuting its reality."

  **3. Using the Data to Study the Subject's Theory of Consciousness:**
  *   **Literary Analog:** **Analyzing the Diegetic Structure and Narrative Conventions of the Subject's Embedded Text.** Instead of interpreting the reported events as experiences, analyze *how* the subject constructs their narrative world: What are its internal rules? What narrative conventions (e.g., omniscient perspective on their own mind, specific metaphors for thought, cause-effect links for mental events) does it employ? What kind of "implied author" (a self-model) and "implied reader" does it posit? Focus shifts to the *rhetoric* and *form* of the subject's self-narrative as a theory of mind-in-operation.
  *   **Difference in Function:** When novels depict characters constructing self-narratives, the focus is usually on psychological motivation, thematic resonance, or dramatic irony relative to the primary diegesis. The heterophenomenological move repurposes this analysis as *data* about cognitive frameworks. It's not about why the character believes X, but about *what the structure of X-belief reveals about their cognitive architecture*.
  *   **Distortion Required:** Literary analysis of a character's self-narrative typically assumes it reflects (however distortedly) their *actual* psychology or situation. This move requires viewing the structure *only* as evidence of an operative *theory* or model *in the subject*, decoupled from any claim about accurately representing an underlying mental substance. The narrative *is* the theory, not a flawed report *of* something else.

  **Residue Report: The Unbridgeable Gap**

  The central commitment of heterophenomenology that lacks any true counterpart in narrative craft is its **deflationary/eliminativist presupposition regarding phenomenal consciousness itself.**

  1.  **The Missing Foundation:** Novels fundamentally presuppose phenomenal consciousness as the *ground* of representation. Techniques like internal focalization, FID, stream-of-consciousness, and even unreliable narration all operate *because* the implied author and reader share the understanding that characters *have* subjective experiences – qualia, feelings, sensations – that these techniques attempt to render. The "contract" assumes the reality of the interiority being explored, even if its *nature* or *accuracy* is questioned. Heterophenomenology methodologically *brackets* this foundational assumption, treating reports *only* as behavioral outputs expressing a cognitive model.
  2.  **The Target of Interrogation:** Fiction interrogates *what it is like* to be a subject (even a deluded one), the *content* of experience, its emotional and moral weight, and its relationship to action and world. Heterophenomenology, by design, shifts the target of inquiry *away* from "what it is like" and towards the *mechanisms generating reports about* "what it is like." Novels explore consciousness; heterophenomenology explores report-generating systems.
  3.  **The Untranslatable Implication:** The residue is heterophenomenology's core implication: that phenomenal consciousness, *as commonly conceived* (private, qualitative, intrinsic), might be an illusion generated by the very cognitive system whose reports we study. Novels *cannot* adopt this stance without self-destructing. If a novel truly treated its character's reported pain as *only* a feature of their "theory of consciousness" with no grounding in a real phenomenal state the reader is meant to apprehend, it would negate the empathetic and experiential power of fiction. The gap suggests heterophenomenology relies on a **presupposition about the non-necessity of phenomenal grounding** for interpreting first-person text – a presupposition that fiction inherently rejects as the basis for its own project of depicting interiority. Narrative theory doesn't "miss" something essential about subjective reports; it *starts* from the essential premise heterophenomenology seeks to avoid: the inescapable reality (within the fictional world) of subjective experience as the thing being reported *on*, however imperfectly. Fiction's power lies in simulating that reality, not in bracketing it as a methodological artifact.
