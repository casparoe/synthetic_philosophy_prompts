  - Vedantic unity → single quantum observer: **95%**  
  - Anti-Copenhagen stance rooted in unity + realism: **90%**  
  - Schopenhauer as compatible reinforcement: **85%**  
  - Non-solipsistic reading of universal observer: **85%** (least sure here—semantic risks loom)
