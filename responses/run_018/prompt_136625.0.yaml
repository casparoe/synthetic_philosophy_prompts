  But Schrödinger hated Copenhagen's observer-dependence! Why? Not to avoid solipsism—his view transcends solipsism by eliminating individual ownership. His rejection is about physical realism: he wanted physics to describe reality independent of observation. The unity thesis actually exacerbates the tension because it makes observation even more fundamental (though universalized). 

