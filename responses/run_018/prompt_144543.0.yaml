  Next, (2) and (3): hierarchical integration vs. no global workspace. The user can argue that integration happens through hierarchical message passing, not a central theater. This is a common resolution in PP literature. 

  Then (5) with anti-dualist tendencies. The user can position Markov blankets as real but dynamically maintained, not pre-given. This is manageable if they emphasize process ontology.

  The user's deeper needs might include desiring a cohesive framework that's both biologically plausible and philosophically sound without internal contradictions. They might fear being criticized for inconsistencies, so clarifying these points is crucial. Also, they may want to present a novel synthesis, hence defending the ontological reality of Markov blankets and non-representational precision. 

