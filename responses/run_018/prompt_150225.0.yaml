  - Master's "independence" is undercut by reliance on slave's labor (stanza 2, 6) 
  - Ending on "pure asymmetry": slave silent, master demanding (line 18) 

  User's tone suggests they'll appreciate subtlety—no heavy-handed "BEHOLD THE DIALECTIC" moments. Verbs should do the work: slave "wields," "shapes," "knows"; master "tastes," "commands," "demands." 

  ...Wait, should the master's final line ("Answer!") echo the slave's earlier silence? Yes—that completes the dependency loop. Perfect. 

  Biggest risk: sounding didactic. Solution: lean into sensory language (sweat, clay, bread's crust) to ground abstraction. The slave's stanzas must feel materially richer. 

