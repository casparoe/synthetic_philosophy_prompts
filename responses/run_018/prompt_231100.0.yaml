answer: |-
  Here is the joint statement drafted after an adversarial collaboration between a committed Provenance Theorist (PT) and a committed Perceptualist (P), structured as requested. This document reflects genuine points of agreement, clarifies persistent disagreements without strawmanning, identifies key cruxes, and proposes test cases.

  **Joint Statement: Provenance Theory vs. Perceptualism on Artistic Value**

  We, a Provenance Theorist (PT) and a Perceptualist (P), having engaged in sustained, good-faith discussion, present the following points of agreement, disagreement, and identified cruxes. Our goal is to clarify the debate surrounding perfect forgeries, originals, duplicates, and the nature of artistic value.

  **1. Agreed Claims (Signed by Both Parties):**

      1.  **Market Value & Treatment Shift:** When a work previously attributed to Artist A is definitively proven to be a forgery (or misattributed to a lesser-known artist B), its market value typically plummets, and its treatment within institutions (display prominence, conservation priority, cataloging) changes significantly, *even if the perceptible properties remain identical*. This reflects a change in belief about its history, not a change in the object itself.
      2.  **Instrumental Value of Originals:** There are sound, non-fetishistic, instrumental reasons to value the original physical artifact (the "original token") over a perceptually identical duplicate:
          *   **Evidential Value:** The original serves as direct physical evidence for art-historical inquiry (e.g., studying materials, techniques, condition changes over time).
          *   **Relic Value:** The original functions as a historical relic, a tangible connection to the past and the artist's actions, facilitating a specific kind of appreciation grounded in historical consciousness.
          *   **Social Coordination & Focal Point:** The original often serves as a unique focal point for shared cultural experience, scholarship, and ritual (e.g., pilgrimage to see *the* Mona Lisa).
      3.  **Not Solely Sentiment/Status:** While sentiment and status-seeking *can* influence behavior towards originals, the instrumental values listed in (2) are legitimate and distinct motivations that are not *merely* reducible to sentiment or status. Attributing *all* preference for originals to these factors is an oversimplification.
      4.  **Perception is Necessary but Not Sufficient (PT Concession):** PT acknowledges that perceptible properties are the primary *vehicle* through which artistic content is delivered and are fundamentally necessary for engaging with a work *as art*. A completely imperceptible object cannot be an artwork. Value cannot emerge *without* perceptible properties.
      5.  **History Isn't Everything (P Concession):** P acknowledges that facts about provenance (artist, context, intention) are crucial for *understanding* the meaning, significance, and art-historical placement of a work. These facts shape *how* we perceive and interpret the perceptible properties. They are essential for full appreciation.
      6.  **Abandoned Arguments:**
          *   PT abandons arguments claiming that perceptually identical duplicates are *necessarily* aesthetically inferior due solely to their lack of history (i.e., if the perceptual properties are truly identical, the aesthetic *experience* might be identical).
          *   P abandons arguments claiming that the *only* reason anyone cares about provenance is snobbery, investment potential, or blind sentimentality, conceding the legitimacy of the instrumental values listed in (2).
      7.  **The Core Disagreement is Specific:** Our remaining disagreement centers narrowly on whether non-perceptible, historical/causal properties (specifically, being created by the originating artist with specific intentions within a specific context) constitute an *essential, non-instrumental component of the artwork's core artistic value itself*, or whether they merely provide valuable context for appreciating the perceptually-grounded artistic value.

  **2. Disagreements Table:**

  | Sub-Question                                                                 | Provenance Theorist (PT) Phrasing                                                                 | Perceptualist (P) Phrasing                                                                                                                               | Nature of Disagreement          |
  | :--------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------ |
  | **Does the core artistic value of a work include properties beyond its current perceptible state?** | "Yes. The core artistic value of a work is inherently bound to its specific history of creation. This history is a constitutive part of the work's identity and value." | "No. The core artistic value supervenes entirely on the work's perceptible properties. Historical facts are contextual, enriching interpretation but not constitutive of the *artistic value itself*." | **Substantive**                 |
  | **Can a perfect duplicate (molecule-for-molecule identical) possess the *same core artistic value* as the original?** | "No. The duplicate lacks the essential historical/causal connection to the artist and context of creation. It may be perceptually indistinguishable, but it is a distinct artifact with distinct (and lesser) core artistic value." | "Yes. If perceptually indistinguishable, the core artistic value is identical. Any difference in perceived value stems from instrumental, evidential, relic, or social values, not the core artistic merit." | **Substantive** (Partially verbal re: 'core artistic value') |
  | **What fundamentally changes when a famous work is re-attributed from Master to Student (perceptually unchanged)?** | "The work's core artistic value diminishes because the constitutive historical fact of its creation (being by the Master) is falsified. It becomes a different, less significant artwork." | "The work's instrumental values (evidential, relic, social) change significantly. Our *interpretation* of its perceptible properties changes. However, the core artistic value grounded in those perceptible properties remains constant; we re-evaluate its *achievement* based on the new context." | **Substantive**                 |
  | **Is 'being created by Artist X' a property of the artwork relevant to its core artistic value?** | "Absolutely. 'Being painted by Rembrandt' is an intrinsic, non-perceptible property of *The Night Watch* that fundamentally contributes to its artistic value." | "'Being painted by Rembrandt' is a historical fact *about* the artifact. It profoundly shapes how we *relate to* and *interpret* its perceptible properties, but it does not alter the artistic value *inherent in* those properties themselves." | **Substantive** (Partially verbal re: 'property of the artwork') |
  | **What does the term 'artistic value' primarily refer to?**                  | "Artistic value encompasses the value arising from the work as a unique historical achievement, embodying the artist's agency, skill, and intentional action within a context." | "Artistic value refers specifically to the value arising from the perceptible features of the work – its formal qualities, aesthetic properties, expressive power, complexity, etc. – as encountered in an experience." | **Partially Verbal**            |

  **3. The Cruxes:**

  1.  **The Constitutive History Crux:** *Is the specific causal history of an artwork's creation (its being made by *that* artist, with *those* intentions, in *that* context) a constitutive, non-instrumental part of the artwork's *identity* and thus its core artistic value?*
      *   **Why Load-Bearing:** If PT is correct, then history *makes* the artwork what it *is*, and value is tied to that specific entity. If P is correct, history merely provides context for perceiving the value inherent in the object's properties. Settling this would force one side to fundamentally reconsider their ontology of the artwork and the source of its value.
  2.  **The Duplication Crux:** *Does the creation of a perfect perceptual duplicate *necessarily* replicate the core artistic value of the original, or does the absence of the original's specific causal history mean the duplicate inherently possesses different (lesser) core artistic value?*
      *   **Why Load-Bearing:** This directly tests the supervenience claim (P) vs. the constitutive history claim (PT). If a duplicate *can* have identical core artistic value, PT must explain what specific value is lost beyond instrumental values. If it *cannot*, P must explain why perceptually identical objects differ in core artistic merit without appealing solely to instrumental factors.
  3.  **The Value Grounding Crux:** *Where is the core artistic value *grounded*? Is it grounded solely in the perceptible properties of the physical object (P), or is it grounded in the historical event/act of creation, with the physical object being its essential trace or embodiment (PT)?*
      *   **Why Load-Bearing:** This cuts to the metaphysical heart of the disagreement. If value is grounded only in the perceptible object, history is contextual. If value is grounded in the historical act, the object derives its special status *as that token* from being the product of that act. Resolving this would clarify the fundamental nature of artistic value.

  **4. Test Cases & Predictions:**

  1.  **The Accidental Duplicate (Boltzmann Painting):**
      *   **Scenario:** Through an inconceivably improbable quantum event, a molecule-for-molecule duplicate of the Mona Lisa spontaneously congeals in a vacuum chamber in deep space. It is physically identical in every way to the original hanging in the Louvre, but has no causal connection to Leonardo da Vinci or his workshop.
      *   **Bears on Cruxes:** Primarily Crux 2 (Duplication), also Crux 1 (Constitutive History) and Crux 3 (Grounding).
      *   **PT Prediction:** The Boltzmann duplicate has *no* (or negligible) core artistic value. It is a remarkable physical anomaly, but lacks the essential constitutive history linking it to Leonardo's creative act. Its value is purely as a curiosity or scientific marvel, not as *art* in the sense the original is art.
      *   **P Prediction:** The Boltzmann duplicate possesses the *identical* core artistic value as the Louvre's Mona Lisa. Its perceptible properties are identical, therefore its aesthetic/artistic qualities are identical. Any difference in how we value it stems from the *lack* of instrumental values (relic, evidential, social focal point), not a difference in core artistic merit.

  2.  **The Misattribution Revelation (The "Rembrandt" Student Work):**
      *   **Scenario:** A painting long attributed to Rembrandt, cherished and studied as a key work, is definitively proven through new documentary evidence and technical analysis to have been painted entirely by a specific, known senior student in his workshop, following Rembrandt's composition but without his direct intervention. The canvas and paint layers are unchanged; only our knowledge of its origin shifts.
      *   **Bears on Cruxes:** Primarily Crux 1 (Constitutive History), also Crux 3 (Grounding).
      *   **PT Prediction:** The core artistic value of the work *diminishes significantly*. The constitutive historical fact ("painted by Rembrandt") was incorrect. It is now a different artwork (a work by Student X) with inherently different (lesser) artistic value, despite unchanged perceptible properties. Its value shifts towards instrumental (evidence of workshop practice) and historical/documentary value.
      *   **P Prediction:** The core artistic value grounded in the perceptible properties *remains constant*. However, our *interpretation* of those properties changes (e.g., we might now see less innovative brushwork, more derivative style). The instrumental values (especially relic value and social focal point value) dramatically decrease. The *achievement* is re-evaluated downwards based on the new context (it's by a student, not the master), but the aesthetic qualities inherent in the object haven't changed.

  3.  **The Fire Rescue Dilemma:**
      *   **Scenario:** A fire breaks out in a museum storage room containing two visually identical canvasses: the original Mona Lisa and a perfect, undetectable modern forgery (known only to the rescuer). A person can save only one. They know which is the original.
      *   **Bears on Cruxes:** All three cruxes, but primarily reveals prioritization under constraint, testing the weight given to constitutive history vs. perceptual properties when forced to choose.
      *   **PT Prediction:** The rescuer *should* save the original. Only it possesses the full constitutive history grounding its unique artistic value. Saving the forgery saves only its perceptible properties, which lack the essential historical connection. The loss of the original is an irreplaceable loss of artistic value.
      *   **P Prediction:** The rescuer *should* flip a coin (or be morally indifferent). The core artistic value is identical in both objects. Saving either preserves the full artistic value. Choosing the original would only be justified by preserving its superior instrumental values (relic, evidential, social focal point), but if forced to choose based *purely* on preserving artistic value (as defined by P), either choice is equivalent. Saving the original might be prudent for *other* (instrumental) reasons.

  **Terminological Note on "Value":**
  We recognize that a significant portion of our residual disagreement, particularly evident in the Value Grounding Crux and the phrasing differences in the table, stems from differing conceptions of what "artistic value" *means*. PT uses it in a broader sense encompassing the work as a unique historical achievement. P uses it in a narrower sense focused on the value arising from the perceptible encounter. **This is partly a verbal disagreement about the scope of the term "artistic value."** However, beneath this, there remains a substantive disagreement about what *fundamentally makes* an artwork valuable in the way that distinguishes it from other objects. PT sees the historical act as fundamental; P sees the perceptible properties as fundamental. Our test cases aim to probe this deeper substantive layer by forcing choices and evaluating scenarios where the instrumental values P acknowledges are controlled for or negated.
