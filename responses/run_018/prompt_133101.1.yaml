  Addressing the losing side: For the trust/achievement concern, I can acknowledge it's valid—displaying fakes risks confusion—but argue that with full disclosure, it becomes a lesson rather than a deception. For the performance-art twist, I can emphasize how it enriches the narrative, making the display more than just a fake.

