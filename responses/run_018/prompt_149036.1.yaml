prompt: |-
  I am a retired experimental physicist who has recently begun studying philosophy of economics, and I want a diagnostic decision tree for the socialist calculation debate. Design a taxonomy of no more than six branching questions that sorts actual commitments through concrete resource-allocation cases—specifically, distributing titanium between aerospace fabrication and surgical implants when local engineers and clinicians hold private, non-articulable practical knowledge—rather than asking respondents to identify with named doctrines. The first branch should ask whether dispersed practical knowledge can ever be fully centralized, with a subsidiary distinction drawn from information theory between lossless compression and lossy signal preservation; the second, whether price mechanisms are irreplaceable carriers of that knowledge or whether algorithmic trial-and-error can substitute for them; and the third, whether such substitution requires private capital ownership or can operate under socialized control. The leaves must include the Mises impossibility position, the Hayek dispersed-knowledge and price-signals position, and the Lange trial-and-error market-socialist position. Note any unoccupied logical combinations—such as perfect centralization without price mediation—and briefly diagnose them as incoherent, unattractive, or merely unexplored. The instrument should be fully answerable by someone who has never heard of Mises, Hayek, or Lange, must not request bibliographies, citations, or reading lists, and should explicitly flag any positions the branches cannot cleanly separate.
