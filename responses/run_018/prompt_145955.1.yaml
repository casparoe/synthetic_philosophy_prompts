  3. **Current Methods**: Current alignment methods (like RLHF, interpretability, formal verification) address some aspects but not comprehensively. For example, RLHF is good for value specification from demonstrations but may not ensure robustness against distributional shifts.

  4. **Failure Modes**: Misalignment can manifest in multiple ways, such as value misgeneralization, adversarial vulnerabilities, or unfair outcomes.

  5. **Need for Multiple Disciplines**: Addressing alignment requires insights from multiple fields (computer science, ethics, social science, etc.).

  6. **Tradeoffs Exist**: In practice, there are tradeoffs between different alignment objectives (e.g., between individual fairness and group fairness, or between robustness and performance).

