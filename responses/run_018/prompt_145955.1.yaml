  2. **Tradeoffs Crux**: Are tradeoffs between alignment aspects (e.g., between fairness and robustness) fundamental and unavoidable, or can they be eliminated with better understanding and methods?

  3. **Failure Mode Crux**: Does an integrated approach to alignment (treating it as one problem) make it harder to identify and mitigate specific failure modes (e.g., by conflating different issues)?

