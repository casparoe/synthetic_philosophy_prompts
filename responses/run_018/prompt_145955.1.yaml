  5. Both camps agree that achieving alignment requires interdisciplinary approaches, drawing from fields including machine learning, ethics, law, social sciences, and safety engineering.

  6. Both camps acknowledge that in practical system design, there are often tradeoffs between different alignment objectives (e.g., between robustness and performance, or between competing values) that must be managed.

