prompt: |-
  I am preparing a taxonomy for a philosophy of care seminar on what I will call structural inattention: harm that arises not from direct neglect but from institutional arrangements—such as shift scheduling, bureaucratic triage metrics, or geographic segregation—that systematically redirect a caregiver's cognitive and emotional attention away from dependents without reducing welfare in any immediately measurable way. Write a decision tree that sorts positions on whether structural inattention is a distinct moral failure in care ethics. The root should ask whether attention itself is a morally significant object of care, independent of welfare outcomes. From there, split on whether institutional design can be a direct object of care-ethical evaluation or only an indirect background condition; then on whether the scale of diversion (localized scheduling conflict vs. systemic demographic segregation) changes the kind of remedy owed; and finally on whether natural proximity or kinship retains any independent weight in distributing attention, or whether it is entirely derivative of relational history. Each leaf should carry a name if one exists (e.g., institutional care ethics, attention-economy view, unnamed) and one sentence stating its most awkward commitment—for example, having to claim that a parent working mandatory overtime is not failing in care despite being mentally absent, or that a state should redistribute emotional labor across strangers. Identify any unoccupied combinations in the tree, with a one-sentence diagnosis of whether the gap is incoherent, unattractive, or unexplored. Present the tree in outline form first, followed by a brief paragraph on the empty nodes. Keep your response under 350 words.
