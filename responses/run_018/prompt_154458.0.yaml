answer: |-
  ### Decision Tree Outline

  **Root:** Is attention itself a morally significant object of care, independent of welfare outcomes?
  *   **No →** *Welfare-Consequentialism*: Structural inattention is not a distinct moral failure unless welfare declines. *(Awkward: Must claim a mentally absent parent working mandatory overtime isn't failing in care as long as basic needs are met.)*
  *   **Yes →** Can institutional design be a *direct* object of care-ethical evaluation (not just a background condition)?
      *   **No →** *Relational Particularism*: Moral failure remains only at the individual relational level, institutions are indirect/neutral. *(Awkward: Must absolve institutions designing schedules guaranteeing caregiver exhaustion of direct ethical blame.)*
      *   **Yes →** Does the *scale* of diversion (localized vs systemic) change the kind of remedy owed?
          *   **No →** *Attention-Economy View*: All diversions demand similar remedies (e.g., attentional resource redistribution). *(Awkward: Must argue a state should actively redistribute emotional labor capacity across strangers as a primary duty.)*
          *   **Yes →** Does natural proximity/kinship retain *independent* weight in distributing attention?
              *   **No →** *Institutional Care Ethics*: Attentional duties flow entirely from relational history/institutional role, not biology/proximity. *(Awkward: Must deny a biological parent has *any* stronger initial attentional duty to their infant than a willing, equally skilled stranger.)*
              *   **Yes →** *Modified Relationalism (Unnamed)*: Kinship/proximity grants presumptive (but defeasible) attentional priority within institutional constraints. *(Awkward: Must justify why geographic segregation harms attentional bonds less if kinship exists within the segregated group.)*

  ### Unoccupied Combinations & Diagnosis
  1.  **Yes (Attention Significant) → No (Institutions Direct) → Yes (Scale Matters) → ?:** The branch asking about kinship/proximity weight isn't reached if you deny scale matters. *Diagnosis: **Unexplored.** Denying scale matters while accepting direct institutional evaluation but rejecting kinship weight is a conceivable, though likely niche, position.*
  2.  **Yes → Yes → No (Scale doesn't matter) → Yes (Kinship matters):** Accepting kinship weight conflicts with demanding uniform remedies regardless of scale. *Diagnosis: **Incoherent.** Demanding identical remedies for all diversions is incompatible with granting independent weight to kinship/proximity, which inherently creates differential claims.*
  3.  **Yes → No (Institutions Indirect) → ?:** The scale/kinds of remedy question is irrelevant if institutions aren't direct objects of evaluation. *Diagnosis: **Unattractive.** Accepting attention's independent moral significance but denying we can evaluate the institutions most responsible for diverting it renders the concept politically inert.*
