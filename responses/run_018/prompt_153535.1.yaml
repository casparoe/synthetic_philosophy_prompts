  ## Grant Review Tension: Rietdijk-Putnam & the Ghost of Causation

  **Setting:** A university conference room. Dr. Elara Lin (eternalist) and Dr. Mateo Vasquez (presentist-leaning critic) review a grant proposal titled "Neural Correlates of Subjective Temporality During Sustained Relativistic Motion." Coffee cups litter the table.

  **Dr. Lin:** (Leaning forward, tapping the proposal) This is fascinating, Mateo. Measuring temporal-order judgments in astronauts experiencing months at 0.8c... it directly probes the *subjective feel* within the block universe. If Rietdijk-Putnam holds, their "now" becomes intrinsically frame-dependent. The experiment could empirically illustrate how the *illusion* of a universal present fragments under acceleration.

  **Dr. Vasquez:** (Sighs, setting down his pen) Elara, that's precisely my concern. The proposal *assumes* the Rietdijk-Putnam conclusion – that because an astronaut's hyperplane of simultaneity slices through what *we* call their future and past, those events *exist* for them "now" in some absolute sense. But that smuggles in the very thing relativity denies: a privileged frame. You use coordinate hyperplanes as if they carve reality at the joints. They don't.

  **Dr. Lin:** Hold on. I'm not privileging any frame! That's the *point* of relativity. There is *no* privileged "now." Every inertial frame's hyperplane is equally valid for defining simultaneity *for an observer in that frame*. Rietdijk-Putnam simply shows that if *any* event is real for *any* observer "now," then, due to the relativity of simultaneity and the causal structure of spacetime, *all* events must be equally real. Causality (light-cone structure) prevents paradox, but ontology flattens. The block is the only consistent picture. Causation isn't production *across* time; it's the static, four-dimensional constraint structure – world-lines fitting together like grooves in a record.

  **Dr. Vasquez:** Ah, but that's where the tension bites! You dissolve causation into mere "correlation across world-lines." But what *is* this "fitting together"? *Why* do they fit that way? If the entire block exists tenselessly, why isn't every conceivable arrangement of events just as "real"? The answer points *outside* the static structure: it points to *diachronic causal laws* operating *in time*. The neural state at t1 *produces* the action at t2. This requires a genuine *passage* where potential becomes actual. Your "structural constraint" *is* that diachronic process, frozen into a geometric shape. But the geometry is the *result*, not the *substance*, of causation.

  **Dr. Lin:** You're conflating epistemology with ontology. We *describe* the laws geometrically *because* the underlying reality is four-dimensional. The "why" is the initial conditions and the laws – also part of the block! The "grooves" *are* the causal history. There's no need for an extra "becoming" process. The astronaut's judgment that event A preceded B is a fact about their brain state along their world-line, determined by the light-cone structure. The "flow" is how complex systems like brains *process* information along their timelike paths within the block. The experiment probes that processing, not a metaphysical flow.

  **Dr. Vasquez:** So, if the astronaut, after acceleration, re-synchronizes clocks with Earth and finds their "simultaneous now" included what Earth will call their *future* actions... you say those actions were *already real* when the astronaut thought them "present"? That their subjective feeling of "now" was simply *misindexing* a pre-existing slice?

  **Dr. Lin:** Essentially, yes. Their "now" was always just a local, frame-dependent labeling convention within the eternal block. The actions were always "there," just not on their *previous* simultaneity slice. The experiment measures the *phenomenology* of that re-indexing, the neural recalibration of temporal order judgments as the simultaneity convention changes.

  **Dr. Vasquez:** But that's my core objection! Rietdijk-Putnam *relies* on taking these different conventions *ontologically seriously* to generate the conclusion. It says: "Look, event E is 'now' for frame F, therefore E is real. But E is also in the past or future of frame G, therefore *all* events must be real." **This treats the conventional simultaneity hyperplane defined by a *coordinate choice* as revealing an ontological fact.** It doesn't. The hyperplane is a useful fiction for synchronization within a frame, not a window onto what *exists*. Lorentz transformations tell us how *measurements* transform between frames, not how *existence* transforms. Assuming they do is the smuggled premise.

  **Dr. Lin:** I see your point. You're saying Rietdijk-Putnam conflates the *conventionality* of simultaneity *within a frame* (e.g., Einstein synchronization) with the *relativity* of simultaneity *between frames*, and then misapplies the ontological weight? That's subtle. But surely, the *causal* structure – the light cones – *are* absolute, frame-independent features. And they force the conclusion. If event E is spacelike separated from me, there *is* a frame where it's simultaneous with my "here-now." If what is real for me "now" includes everything spacelike to me, then...

  **Dr. Vasquez:** ...then you've defined "now" as an *infinite, spacelike hyperplane*, which is precisely the conventional coordinate choice I object to! Why should "what is real for me now" encompass the entire universe at a coordinate time? That's a geometric abstraction, not the *lived present* of causal efficacy. My "now" is the thin edge of becoming where causes *take effect*. It's intrinsically *local* and *processual*. The astronaut's judgment that A caused B isn't just a correlation; it's a registration of that local diachronic process happening *along their world-line*. Rietdijk-Putnam doesn't *prove* eternalism; it *reduces* it to absurdity by showing it dissolves the very notion of local causation into a geometric pattern. The argument collapses because it *requires* the static view to interpret the relativity of simultaneity ontologically, which then undermines the dynamic causation that makes simultaneity meaningful in the first place!

  **Dr. Lin:** (Pauses, then smiles wryly) We agree on one thing, Mateo: the conventionality of simultaneity within a frame. Einstein was clear it's a choice for synchronization.

  **Dr. Vasquez:** (Nods) Absolutely. It's purely conventional *how* we define "at the same time" across space *for a given observer*.

  **Dr. Lin:** But here's where our agreement deepens the disagreement. *You* think that conventionality protects the present – that because the hyperplane is conventional, it can't bear ontological weight for Rietdijk-Putnam. *I* think that very conventionality, *combined* with the relativity *between* frames, shows that *no* hyperplane is metaphysically privileged, so the only consistent ontology is one where *all* hyperplanes exist tenselessly as part of the block. Our shared premise about conventionality *within* frames leads us to diametrically opposed conclusions about the *global* ontology.

  **Dr. Vasquez:** Precisely! For me, the conventionality highlights that simultaneity is a *practical tool*, not an ontological scalpel. The reality is the *causal process unfolding along each world-line*. The experiment is interesting precisely because it probes how that *process* adapts its *measurement conventions* under relativistic stress, *not* because it reveals a fragmented ontology. The astronaut's "now" doesn't fragment; their *synchronization method* changes. The underlying causal becoming remains local and integral.

  **Dr. Lin:** And for me, the experiment shows how a brain, as a complex physical system within the block, updates its internal model of temporal relations based on new sensory inputs constrained by the invariant light-cone structure. The "fragmentation" is the phenomenological correlate of navigating different coordinate charts on the manifold. The causal efficacy *is* the geometric constraint. So, Mateo... do we recommend funding?

  **Dr. Vasquez:** (Chuckles) Oh, absolutely. Regardless of who's right about the metaphysics, the neural data will be priceless. But I expect it to support the reality of diachronic processing, not eternalist indexing.

  **Dr. Lin:** And I expect it to beautifully illustrate the plasticity of "now" within the unchanging block. May the best ontology win!

  **(They both reach for their recommendation forms, the unresolved tension humming in the air like the background radiation of the cosmos.)**
