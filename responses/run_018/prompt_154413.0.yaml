answer: |-
  ### Bottom Line Up Front  
  Your friend is **mostly wrong but mixing up different things**. The strongest reading is the **computational/artificial rationality** interpretation. While "choice without preference is impossible" holds *psychological* truth for humans and *logical* truth in strict ordering systems, it fails as a universal claim about rationality. Crucially, **symmetry-breaking without prior preference is computationally valid and rationally defensible** in artificial systems like your chess engine.

  ---

  ### Analysis Table  
  *(Likely intended readings marked with ⚠️)*

  | Reading of Slogan              | Precise Claim                                                                 | Verdict                      | Supports Chess Argument? | Hidden Assumption about Rationality          | Friend Likely Meant? | Survives? |
  |--------------------------------|-------------------------------------------------------------------------------|-----------------------------|--------------------------|---------------------------------------------|----------------------|-----------|
  | **Logical** (Preference as ordering necessity) | If two options are truly identical in all properties relevant to a choice, no rational basis for selection exists. | **Trivial** (tautological) | ✅ Yes (but vacuously) | Rational choices require strict preference orderings. | ⚠️ Possibly | ❌ No (misapplied to non-identical implementations) |
  | **Psychological** (Human cognition)          | Humans cannot consciously choose between truly indifferent options without generating ad-hoc preferences or biases. | **Substantive-Defensible** | ⚠️ Partially (if anthropomorphizing AI) | Rationality requires conscious, reason-driven deliberation. | ⚠️ Probably | ❌ No (engines ≠ humans) |
  | **Normative** (Ideal rationality)           | A perfectly rational agent *must* be indifferent between identical options; any choice is irrational. | **Substantive-False**      | ✅ Yes | Rationality forbids arbitrary action. | Possibly | ❌ No (arbitrary ≠ irrational in symmetric cases) |
  | **Computational/Artificial**   | Algorithms cannot output a selection between equal-valued options without a deterministic or random tie-breaker. | **Substantive-False**      | ✅ Yes (but misleading) | Rationality requires deterministic reasons for outputs. | ⚠️ Strongly | ❌ **NO** (false claim) |

  ---

  ### Detailed Breakdown  

  1. **Logical Reading**  
     - **Why it fails**: While logically true that identical options lack *differential* preference, your engine’s "identical" scores are computationally *not* identical (e.g., different board states, future branches). The slogan ignores that **breaking symmetry is a rational act** when options are *evaluatively* identical but *implementationally* distinct.  

  2. **Psychological Reading**  
     - **Why it fails**: Your friend smuggles in human introspection. Engines don’t "prefer"; they execute code. A random pick between tied moves isn’t "noise"—it’s **rational symmetry-breaking** (e.g., minimax with random tie-breakers is provably optimal). Assuming AI needs human-like "reasons" is anthropomorphism.  

  3. **Normative Reading**  
     - **Why it fails**: Normative rationality *permits* randomization when indifferent (e.g., game theory mixed strategies). Insisting on hidden preferences commits the **"rationalist fallacy"** – projecting reasons onto necessary arbitrariness.  

  4. **Computational Reading**  
     - **Why it’s strongest & false**: Your friend’s core error is claiming engines **must** have "hidden tie-breakers or internal bias." This is factually wrong:  
       - **No hidden preference needed**: A pseudo-random `rand()` in code is *not* a "preference" but a **mechanism for symmetry-breaking**.  
       - **Rationality preserved**: Under identical evaluations, *any* choice satisfies the engine’s rationality criterion (maximizing score).  
       - **Assumption debunked**: Rationality ≠ deterministic reasons; it can include **randomized protocols under indifference** (e.g., quantum coin-flips in decision theory).  

  ---

  ### Why Your Friend is Wrong  
  - **Chess engine reality**: If move A and B both score +2.0, picking A via `random.choice([A,B])` is perfectly rational. It’s not "random noise" but a **valid resolution protocol** for symmetric evaluations. Adding a "hidden bias" (e.g., always prefer leftmost move) would be *less* rational—it injects arbitrariness *unrelated* to position quality.  
  - **Buridan’s Ass misapplied**: The parable warns against *irrational indecision*, not against *arbitrary action under indifference*. Rational agents can (and do) break deadlocks randomly.  
  - **Key insight**: **Indifference licenses randomization**. Your engine doesn’t need a "preference" to act rationally; it needs a **decision rule** for ties. Random selection *is* such a rule.  

  ### What to Tell Your Friend  
  > *"You’re conflating human psychology with computational rationality. Our engine doesn’t ‘prefer’—it resolves evaluative ties via a programmed rule (like randomness). That’s not irrational; it’s optimal under indifference. If you demand ‘hidden preferences,’ you’re inventing reasons where symmetry already justifies choice."*
