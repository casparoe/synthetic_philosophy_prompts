  The salary gradient twist is fascinating. If they're adjusting pay based on distance from cutoff, it suggests the startup might be trying to have it both ways: acknowledging vagueness through graduated treatment while maintaining a binary hiring decision. That immediately makes me think of supervaluationism - where borderline cases lack definite truth values, but we can still define "supertruth" by considering all possible precisifications. 

