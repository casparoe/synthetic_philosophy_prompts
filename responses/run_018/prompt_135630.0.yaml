prompt: |-
  For my presentation in a graduate seminar on collective intentionality and social ontology, I want a consistency audit of my current package before I defend it. Here is where I have landed:

  (i) I hold a reductionist account of shared intention in broadly Bratmanian terms: it is constituted by interlocking individual intentions, mutual responsiveness, and commitments to joint activity and mutual support, with no primitive or irreducible we-intention.

  (ii) I take joint action to require shared intention in exactly this sense; parallel action with common knowledge of aligned ends does not suffice.

  (iii) I think collective agents—corporations, committees, perhaps states—can bear genuinely non-derivative moral responsibility. The fault is genuinely at the collective level, not merely an aggregate of individual wrongs.

  (iv) I treat the we-mode of intentionality as phenomenologically real but ontologically weightless: it describes how acting together feels, not a distinct metaphysical kind.

  (v) I accept that institutional facts depend on collective acceptance, yet I think this acceptance is always decomposable into individual acceptance plus common belief about that acceptance, with no irreducible collective acceptance-state.

  (vi) I maintain that every participant in joint action retains unilateral veto power: anyone can dissolve the activity by revising her own intentions, and exercising this power is never a betrayal of a collective-level obligation—only an individual change of mind.

  (vii) I distinguish responsive compliance from coerced participation in what I call asymmetric joint actions: even when one agent directs and another complies, the activity counts as genuinely joint if the compliance is responsive to the director's intentions rather than forced; in such cases, however, primary moral responsibility lies with the directing agent rather than being distributed.

  (viii) I deny that Gilbert-style plural subjecthood is a necessary condition for joint action; at best, it is a descriptive label for particularly stable patterns of interlocked intention.

  Please audit whether these hang together. Specifically: identify which pairs are in genuine tension, which conflicts only appear serious but dissolve on inspection, and for each real tension state the least costly revision and what it costs me. Rank the tensions by severity rather than listing them as equally damaging. Trace precisely what my commitments commit me to, without lecturing on the literature or asking for reading lists. I have not decided which commitment I would drop if forced, so treat all as live.
reasoning: |-
  Okay, let me approach this systematically. The user presents eight theses on collective intentionality and requests a consistency audit, with particular attention to tensions between them. The core challenge lies in reconciling reductionist foundations with non-reductive claims about moral responsibility.

  Starting from the Bratmanian base (i), which reduces shared intention to interlocking individual states. This connects cleanly with the veto power principle (vi) - since collective commitment is merely an aggregation of individual commitments, any participant can unilaterally withdraw. The phenomenological stance (iv) also fits naturally here, treating we-mode as experiential rather than ontological.

  The first significant tension emerges when considering collective moral responsibility (iii). If groups lack irreducible existence, how can they bear non-derivative responsibility? The user's asymmetric cases (vii) partially address this by assigning primary responsibility to directors, but this doesn't resolve the core metaphysical issue for symmetric collectives.

  Institutional facts (v) pose another challenge. While the user insists on individualistic reduction of collective acceptance, institutional realities often persist beyond individual participation - consider how corporations survive employee turnover. The veto principle (vi) seems incompatible with this stability.

  Asymmetric joint action (vii) reveals operational tension. If directors bear primary responsibility yet compliance is genuinely joint, this blurs the Bratmanian requirement of mutual responsiveness (i). The user might need to weaken either the jointness criterion or the responsibility asymmetry.

  The plural subject denial (viii) creates coherence problems with moral responsibility (iii). If Gilbertian bonds aren't necessary for joint action, what grounds non-distributive responsibility? The user's "stable patterns" description seems insufficient for robust moral attribution.

  Most severe is the triad: reductionism (i, v) vs moral non-reductionism (iii) vs institutional persistence (v). Collective responsibility requires some persistence beyond individual states, yet the veto power (vi) makes collectives existentially fragile. The user must either moralize individual defection (abandoning vi) or accept distributive responsibility (abandoning iii).

  A secondary tension concerns asymmetric cases (vii): if directors carry primary responsibility but compliance is fully joint, this strains the mutual support commitment in (i). The solution may be to grade jointness rather than treat it binarily.

  For minimal revision, I'd suggest qualifying (iii): allow that some collective responsibility reduces to individual obligations plus causal contributions, reserving non-derivative status only for institutional actors. This preserves most reductionism while accounting for corporate liability.
answer: |-
  Here is a consistency audit of your package, ranked by severity of tension (most severe first), identifying genuine conflicts, apparent tensions that dissolve, and the cost of minimal revisions:

  ### Tension 1: Strongest Conflict  
  **Between (iii) Non-derivative collective responsibility** and **reductionist foundations (i, v, vi)**  
  - **Conflict:** (iii) asserts genuinely collective-level moral responsibility (fault "not merely an aggregate"). Yet (i)/(v) reduce all collective phenomena (intention/acceptance) to individual attitudes + common belief, and (vi) insists any participant can unilaterally dissolve the collective via individual intention revision *without* breaching a collective obligation.  
  - **Why severe?** Non-derivative responsibility implies the collective has an agential unity that persists beyond individual contributions/withdrawals. But (vi) makes the collective existentially dependent on *each* individual’s continuing intention, denying it any stability or obligation-binding force independent of individuals. (v) similarly denies irreducibility in the very attitudes constituting the collective.  
  - **Minimal Revision & Cost:**  
    - *Option A:* Modify (vi) to allow that *in some contexts* (e.g., formal institutions), withdrawing can breach obligations (e.g., contractual). **Cost:** Undermines strong individualism/control principle; requires admitting some normative force not reducible to individual commitments.  
    - *Option B:* Retreat to *derivative* collective responsibility (e.g., responsibility distributed over individuals in complex ways). **Cost:** Abandons core claim of (iii); collapses responsibility into aggregated individual fault.  

  ### Tension 2: Operational Conflict  
  **Between (vii) Asymmetric joint action** and **core Bratmanian conditions (i, ii)**  
  - **Conflict:** (vii) allows genuinely joint action even when one agent "directs" and the other merely "complies responsively" (not coerced), with primary responsibility on the director. But (i)/(ii) require *interlocking intentions* and *mutual responsiveness* (implying reciprocity), and (ii) rules out parallel action with aligned ends. Asymmetric compliance may lack robust mutual responsiveness or commitments to mutual support.  
  - **Why serious?** If the complying agent merely tracks the director’s intentions without true interdependence (e.g., secretary follows boss’s orders), it risks collapsing into parallel action with aligned ends + responsive adjustment, which (ii) explicitly rejects as insufficient for joint action.  
  - **Minimal Revision & Cost:**  
    - *Option A:* Refine (vii) to require minimal reciprocity (e.g., director must be responsive to subordinate’s capacity/constraints). **Cost:** Weakens the "asymmetry" claim; moves closer to standard Bratman.  
    - *Option B:* Relax (ii) to allow asymmetric cases as a *deficient* or *marginal* form of joint action. **Cost:** Undermines strict conditions for joint action; may open door to counterexamples (ii) aimed to block.  

  ### Tension 3: Coherence Challenge  
  **Between (viii) Denial of plural subjecthood** and **(iii) Collective responsibility**  
  - **Conflict:** (viii) rejects Gilbert’s plural subject as necessary, treating it as merely "stable patterns." But (iii) requires a robust collective entity to bear non-derivative blame. Without a plural subject (or similar irreducibly collective entity), it’s unclear what *bears* the responsibility if not individuals.  
  - **Why moderate?** Your reductionism (i, v) already strains (iii), but (viii) explicitly removes a candidate ground for collective-level properties. Stable patterns of intention (i) may not justify non-distributive responsibility.  
  - **Minimal Revision & Cost:**  
    - *Option A:* Argue that *institutional structures* (not plural subjects) ground non-derivative responsibility. **Cost:** Requires fleshing out an institutional metaphysics consistent with (v)’s reductionism (hard but possible).  
    - *Option B:* Soften (iii) to allow non-derivative responsibility *only* for formal collectives (corporations/states), not informal groups. **Cost:** Retreats from generality of (iii); may concede ground to anti-reductionists.  

  ### Apparent Tensions That Dissolve:  
  1. **Between (iv) Phenomenological we-mode** and **reductionism (i, v):**  
     - *Apparent conflict:* If "we-mode" feels real, does that suggest irreducibility?  
     - *Dissolves:* You explicitly state it’s ontologically weightless. The phenomenology is compatible with individualistic implementation (e.g., "we-intentions" as complex individual attitudes). No revision needed.  

  2. **Between (vi) Unilateral veto** and **(ii) Necessity of shared intention:**  
     - *Apparent conflict:* If veto dissolves joint action instantly, is shared intention ever stable?  
     - *Dissolves:* Bratman’s model accommodates this. Veto power is a *feature* of the individualistic basis—the fragility is intentional. Shared intention persists *only* as long as individuals sustain it.  

  ### Key Coherences:  
  - **(i), (v), (vi), (viii)** form a **tight reductionist core:** Intentions, acceptance, dissolution, and agency are all fully analyzable into individual attitudes + common belief.  
  - **(ii) and (i)** are **mutually reinforcing:** Shared intention (as defined) is the necessary glue for joint action.  
  - **(vii) Asymmetry** and **(iv) Phenomenology** can fit if asymmetric cases involve a *felt* jointness (iv) via responsiveness, even if responsibility is uneven.  

  ### Summary of Recommendations by Severity:  
  1. **Address (iii)/(vi) conflict:** Essential to resolve. Minimal cost: Adjust (vi) for institutional contexts *or* weaken (iii) to derivative responsibility.  
  2. **Clarify (vii)’s compatibility with (i)/(ii):** Ensure asymmetric cases meet minimal reciprocity.  
  3. **Bolster (iii)/(viii) link:** Ground responsibility in emergent institutional properties (consistent with (v)).  

  The package is ambitious and largely coherent but hinges on reconciling non-reductive moral responsibility with strict reductionism. The veto power (vi) is the biggest pressure point for (iii). If retaining non-derivative responsibility is paramount, constraining (vi) for formal collectives is the least costly move.
