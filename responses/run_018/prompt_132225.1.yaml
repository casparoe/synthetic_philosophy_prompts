answer: |-
  Here’s a taxonomy built around concrete diagnostic splits. The tree forces choices between mutually exclusive root problems and failure modes, surfacing the *actual* commitments behind critiques:

  ---

  ### 1. Diagnostic Tree & Branch Questions (392 words)
  **Start:**  
  *Q1: Is EA’s core failure mode driven by how it quantifies impact?*  
  - **YES** → *Q2: Does quantification primarily create moral licensing (offsetting guilt via "credits")?*  
    - YES → *Q3: Does this licensing fatally corrupt individual ethics?*  
    - NO → *Q3: Does it instead distort cause prioritization by rewarding measurable over meaningful actions?*  
  - **NO** → *Q2: Is the core problem EA’s concentration of funds, which distorts the ecosystem?*  
    - YES → *Q3: Does funding concentration corrupt via groupthink (elite consensus overriding dissent)?*  
    - NO → *Q3: Does it corrupt via perverse incentives (orgs chasing metrics for funding)?*  

  **Parallel path (applies if Q1=YES):**  
  *Q4: If quantification is flawed, does "earning-to-give" fail structurally?*  
  - YES → *Q5: Is the failure due to career substitution risk (high-income skills becoming useless if cause-priority shifts)?*  
    - YES → *Awkward commitment: Personal hedge against cause uncertainty.*  
    - NO → *Q5: Is it due to normalizing/extending wealth disparity?*  
      - YES → *Awkward commitment: EA requires embedding inequality.*  
  - NO → *Q4: Does "earning-to-give" succeed, but EA still fail for unrelated reasons?*  

  **Final branch (applies if Q1=NO):**  
  *Q6: Even if funding/quantification works, does EA collapse via misaligned skill-building?*  
  - YES → *Awkward commitment: Transferable career capital traps you in bad bets.*  

  ---

  ### 2. Leaves & Awkward Commitments (8 leaves, 189 words)
  1. **Quantification → Moral licensing → Corrupts ethics:**  
     *Awkward commitment: Your donation receipt is a moral stock certificate.*  
  2. **Quantification → Distorts prioritization:**  
     *Awkward commitment: Saving measurable lives > saving important ones.*  
  3. **Quantification → Earning-to-give fails → Career substitution risk:**  
     *Awkward commitment: You traded years mastering Excel for a cause that didn’t need it.*  
  4. **Quantification → Earning-to-give fails → Normalizes disparity:**  
     *Awkward commitment: EA can’t fix inequality without first weaponizing it.*  
  5. **Funding concentration → Corrupts via groupthink:**  
     *Awkward commitment: Truth is decided by whoever holds the checkbook.*  
  6. **Funding concentration → Corrupts via perverse incentives:**  
     *Awkward commitment: Charities are incentivized to game metrics, not do good.*  
  7. **Career capital substitution (standalone failure):**  
     *Awkward commitment: Your "transferable skills" chain you to sunk-cost thinking.*  
  8. **No systemic flaw (implicit leaf):**  
     *Awkward commitment: Critiques are just squabbling over implementation details.*  

  ---

  ### 3. Empty Spots & Separation Failures (214 words)
  **Separation failures:**  
  - Leaves 3 & 7 (career substitution vs. career capital) resist clean splitting. Both warn about skill misalignment, but Leaf 3 blames *quantification’s* failure to hedge cause risk, while Leaf 7 blames *any* skill-building in volatile cause spaces. They collapse if you see cause uncertainty as inherent.  
  - Leaves 5 & 6 (groupthink vs. perverse incentives) blur when elite consensus *is* the incentive.  

  **Empty spots (logical combos not occupied):**  
  - **"Quantification corrupts, but earning-to-give is fine" + "Funding pools are pure"**: Unexplored. Assumes personal ethics corrupt while institutions stay clean – psychologically dubious.  
  - **"Funding concentration is benign" + "Career substitution kills EA"**: Ugly. Implies individuals ruin systemic success by betting wrong, making EA unfalsifiable.  
  - **"Quantification enables moral licensing, but this strengthens EA"**: Incoherent. Licensing implies reduced rigor, contradicting "effective."  
  - **"Earning-to-give is flawed by disparity, but quantification fixes it"**: Incoherent. If quantification justifies disparity, it can’t fix disparity’s harms.  
  - **"Career capital substitution matters only if funding is corrupt"**: Unexplored. Could argue corrupted funding magnifies bad skill bets, but no clear takers.  

  **Key gap:** No critique argues funding concentration *solves* quantification flaws. This would require believing centralized power corrects measurement errors – an authoritarian take absent in EA discourse.  

  ---  
  This tree forces critics to choose: either numbers poison ethics, money poisons truth, or skills poison flexibility. The "awkward commitments" make the tradeoffs visceral.
