  me and my friend stayed up way too late arguing about effective altruism — not just whether earning-to-give is hypocritical, but whether the whole framework is structurally broken in ways people don't usually admit. now i'm trying to map where people actually stand, so i need a taxonomy, basically a decision tree, that sorts critiques by concrete commitments rather than by the labels people use (institutional critique, measurability bias, etc.). 

  build it around diagnostic questions that split on real disagreements: does the core problem start with quantification creating moral licensing (you feel you've bought moral credit), or with funding pools corrupting the epistemic community around cause selection? then branch on whether earning-to-give fails because of career substitution risk — optimizing for high-income skills that become useless if your cause-priority is wrong — or because it normalizes extreme disparity. include a leaf for the view that none of the standard critiques apply but the movement still collapses under career capital substitution, where you build skills in finance or tech that don't transfer if global health turns out to be the wrong bet. aim for 6 to 8 leaves, each carrying a one-sentence awkward commitment. flag any pair of leaves your tree genuinely can't seperate, and for every empty combo in the logical space say quickly whether it looks incoherent, ugly, or just unexplored. please organize exactly like this:

  1. The diagnostic tree and branch questions (around 400 words)
  2. The leaves and thier awkward commitments (around 200 words)
  3. Empty spots and separation failures (around 200 words)

  no citations or reading lists — this is just for my own head after that argument, not a seminar paper. and please don't lean on obscure named theories i wouldn't recognize; keep it to ideas a smart non-specialist could actually reason through.
