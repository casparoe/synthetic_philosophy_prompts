prompt: |-
  Write the full set of desiderata that any adequate philosophical and clinical theory of human death must satisfy in order to count as complete, given that the concept is required to do distinct work in at least three registers: determining eligibility for organ procurement, fixing the legal moment at which inheritance and marital status shift, and marking the metaphysical boundary at which a particular human organism ceases to exist. For each desideratum, state the specific case or distinction that motivates it—including the tension between brain-death criteria (irreversible loss of all brain function including brainstem) and circulatory-death criteria (irreversible cessation of integrated cardiopulmonary function)—and indicate whether you take it to be non-negotiable or a preference of one camp. Explicitly flag any pair of desiderata that you suspect are jointly unsatisfiable, with the reason. In particular, address how the theory must classify the following hypothetical but clinically adjacent scenario: a body maintained on full extracorporeal support exhibits no detectable brainstem reflexes, yet retains intact hypothalamic-pituitary hormonal cycles and reproducible spinal reflex arcs; determine whether this state should count as death of the organism, death of the person, both, or neither, and which desideratum forces that answer. Then, briefly score three mainstream candidates—the whole-brain formulation, the higher-brain formulation, and the circulatory-respiratory formulation—against your list, identifying for each which single desideratum does the most to exclude it if any does. Keep the weight on the criteria and their motivating conflicts rather than on the scorecard.
reasoning: |-
  Okay, the user is asking for a comprehensive set of desiderata for a theory of human death that must work across philosophical, clinical, and legal domains. They want it to cover organ procurement eligibility, legal status changes, and the metaphysical boundary of organism cessation. 

  Hmm, this is a deep multidisciplinary question requiring me to reconcile medical criteria (brain vs. circulatory death), legal consequences (inheritance/marriage), and philosophical definitions (organism vs. personhood). The user seems academically sophisticated—probably a bioethicist, philosopher, or transplant professional given the technical terms and edge cases mentioned. They're clearly wrestling with real-world tensions in death determination protocols.

  The core challenge is balancing three often conflicting needs: clinical practicality for organ harvesting, legal precision for societal functions, and metaphysical rigor about when "a human" truly ceases. I need to identify where these domains pull in opposite directions. For example, the irreversible cardiorespiratory arrest standard works well pragmatically but philosophically fails to address artificially sustained bodies with dead brains.

  That hypothetical scenario they posed is key—it exposes the fault line between whole-brain and circulatory standards. A body on ECMO with no brainstem function but preserved spinal/hormonal activity forces us to choose: is "integrated organismic function" strictly neurological, or can primitive physiological loops count? The user wants to know which desideratum dictates that answer. 

  I should structure this by first listing all necessary criteria, noting which are non-negotiable (like avoiding false positives) versus debatable (like consciousness-centric definitions). The tension between "clinical detectability" and "metaphysical completeness" will likely be the sharpest conflict—we can't always measure what matters most. 

  For scoring existing theories: whole-brain fails the consciousness criterion for higher-brain advocates; higher-brain fails the organismic continuity criterion; circulatory-respiratory fails the integration criterion with ECMO cases. Each exclusion reveals what different stakeholders prioritize. 

  The user's underlying concern seems to be: can we ever have a unified death concept serving all masters? My answer will be pessimistic—some desiderata are mutually unsatisfiable—but I'll show exactly where compromises must occur. They'll appreciate candor about trade-offs.
answer: |-
  Here is the full set of desiderata for an adequate philosophical and clinical theory of human death, motivated by critical cases and tensions, followed by analysis of the scenario and mainstream theories:

  **Core Desiderata (Non-Negotiable):**

  1.  **Biological Irreversibility (Non-Negotiable):** Death must represent a state that is *irreversible* by current or foreseeable medical technology. This is fundamental to all registers, preventing premature declarations.
      *   **Motivation:** Distinguishes *dying* (e.g., cardiac arrest potentially reversible by CPR/defib) from *death* (e.g., prolonged cardiac arrest leading to permanent brain damage even if circulation is artificially restored later). Essential for organ procurement (donor must be truly dead) and legal finality.
      *   **Tension:** Defines the "irreversible" in circulatory death protocols (DCD) – how long must circulation cease before irreversibility is certain? Brain death relies on irreversibility being established via testing/brain destruction.

  2.  **Organismic Cessation (Non-Negotiable):** The theory must mark the moment the *human organism as a whole* ceases to function as an integrated biological unit, ceasing to be a "living human being."
      *   **Motivation:** Distinguishes cell/tissue/organ life (e.g., organs viable for transplant, skin cells alive in a corpse) from the life of the whole organism. Necessary to satisfy the metaphysical requirement and avoid absurdities (e.g., declaring death while the organism still functions integratively).
      *   **Tension:** Directly challenges whether bodies on advanced life support (like ECMO/VADs) with no brain function are still living organisms or merely cellular/tissue systems.

  3.  **Univocity (Non-Negotiable):** Death must be a *single, unified event* applicable to the entire organism. There cannot be "partial death" or multiple "deaths" (organism vs. person) with different timings within the same entity.
      *   **Motivation:** Prevents logical and practical absurdities (e.g., "The organism is dead but the person lives," or vice-versa, within the same body). Essential for legal clarity (one moment inheritance triggers) and metaphysical coherence (one endpoint for the biological entity).

  4.  **Absence of False Positives (Non-Negotiable):** The criteria must prevent declaring death in any case where the human organism as a whole is demonstrably still alive and functioning integratively.
      *   **Motivation:** Safeguards against killing. Critical cases: Deep coma, locked-in syndrome, severe brain injury *without* meeting whole-brain death criteria, PVS. Any theory that risks declaring death in these states is unacceptable.
      *   **Tension:** Higher-brain theories face strong challenges here regarding PVS patients who retain brainstem function.

  5.  **Clinical Detectability (Non-Negotiable):** Death must be determinable with high reliability using available medical technology and procedures within a reasonable timeframe.
      *   **Motivation:** Practical necessity for organ procurement (time-sensitive viability) and legal/administrative functions (issuing death certificates). A purely philosophical definition unusable in practice is inadequate.
      *   **Tension:** Higher-brain criteria struggle with reliably detecting the *irreversible* loss of consciousness/personhood. Brain death testing requires specific expertise and technology. Circulatory death is often simpler to detect initially but requires waiting periods to confirm irreversibility.

  **Important Desiderata (Often Negotiated/Contentious):**

  6.  **Loss of Consciousness/Personhood (Preference - Higher-Brain Camp):** Death occurs when the capacity for consciousness and all cognitive function (the "person") is irreversibly lost, even if some biological integration persists.
      *   **Motivation:** Anencephalic infants, permanent vegetative state (PVS), advanced dementia. Proponents argue biological integration without consciousness isn't the life of a *person* and may not warrant full moral/legal status.
      *   **Tension:** Directly conflicts with Organismic Cessation for cases like PVS and the hypothetical scenario below. Faces False Positive concerns and Clinical Detectability challenges.

  7.  **Integration Cessation (Preference - Whole-Brain/Circulatory Camp):** Death occurs when the organism irreversibly loses the *critical* capacity for *somatic integration* – the harmonious functioning of bodily systems under central control.
      *   **Motivation:** The core argument for whole-brain death: the brain (especially brainstem) is the central integrator. Circulatory death proponents argue loss of circulation inevitably and rapidly destroys this integrating capacity. Justifies why bodies on ventilator with dead brains are corpses.
      *   **Tension:** What constitutes "critical" integration? Is hypothalamic function sufficient? Are spinal reflexes integration? Challenges the Higher-Brain focus on consciousness alone.

  8.  **Consistency with Organ Viability (Preference - Transplant Community):** The criteria should allow organ procurement while organs are still viable, without compromising the non-negotiable desiderata (especially 1 & 4).
      *   **Motivation:** Practical necessity for successful transplantation. Drives the development of DCD protocols and acceptance of brain death. Creates pressure on the definition of irreversibility and integration.
      *   **Tension:** Can create perceived conflicts with public trust (e.g., "rushed" declarations). Pushes boundaries on irreversibility (e.g., DCD waiting times) and integration (e.g., how much function can persist in a "dead" donor?).

  9.  **Public Intuition & Social Acceptance (Preference - Legal/Social Camp):** The concept should align, as much as possible without violating core principles, with widespread cultural and intuitive understandings of death.
      *   **Motivation:** Maintains trust in medicine and law. Brain death, despite meeting many desiderata, still faces public unease due to the warm, breathing body appearance. Circulatory death aligns better with traditional "heart stopped" views.
      *   **Tension:** Intuitions can be scientifically inaccurate (e.g., breathing/lack thereof isn't always definitive). May conflict with theoretically sound definitions (like brain death) that appear counter-intuitive.

  **Suspected Jointly Unsatisfiable Desiderata:**

  *   **Organismic Cessation + Loss of Consciousness/Personhood:** This is the fundamental divide.
      *   **Reason:** Organismic Cessation requires the *entire organism* to cease integrated function. Loss of Consciousness/Personhood is satisfied if only the higher brain is destroyed, even if the brainstem/hypothalamus maintains significant biological integration (homeostasis, hormonal cycles, some reflexes) – precisely the state described in the hypothetical scenario. Declaring death based solely on consciousness loss violates Organismic Cessation for proponents of that view. Satisfying both simultaneously seems impossible for cases involving preserved brainstem/hypothalamic function without consciousness.

  **Analysis of the Hypothetical Scenario:**

  *   **State:** Body on full extracorporeal support (ECMO). No detectable brainstem reflexes (e.g., no gag, no pupil response to light). Intact hypothalamic-pituitary hormonal cycles (regulating temperature, fluid balance, stress response). Reproducible spinal reflex arcs (e.g., knee-jerk).
  *   **Classification:**
      *   **Death of the Person:** **Yes.** The irreversible loss of all brainstem function means the capacity for consciousness and any interaction with the environment is gone. Brainstem death typically includes loss of the ascending reticular activating system necessary for wakefulness. Higher-brain criteria would declare death.
      *   **Death of the Organism:** **Debatable, but leaning No.** The hypothalamic-pituitary axis represents a significant form of neuro-endocrine integration regulating core bodily functions (homeostasis). Spinal reflexes indicate preserved neural integration at a lower level. While severely impaired, this state arguably shows *some* residual, centrally mediated (by the hypothalamus/spinal cord) integrative function of the organism *as a whole*. Whole-brain and Organismic Cessation desiderata suggest the organism persists.
      *   **Univocity:** Forces a choice. If death is univocal, this state cannot be both dead and alive. **Neither "both" nor "neither" is a coherent answer under Univocity.**
  *   **Desideratum Forcing the Answer:** **Organismic Cessation** (Desideratum 2). The presence of intact hypothalamic-pituitary function (a key central integrator for homeostasis) strongly suggests the organism *as a whole* has not yet ceased integrated function, despite the profound neurological loss. Declaring *organism death* here would violate Organismic Cessation. The Loss of Consciousness/Personhood desideratum (6) forces the "death of the person" aspect. The tension between 2 and 6 is exposed.

  **Scoring Mainstream Candidates:**

  1.  **Whole-Brain Formulation:** Death = Irreversible cessation of all functions of the entire brain, including brainstem.
      *   **Strengths:** Strong on Biological Irreversibility (via testing/destruction), Organismic Cessation (brain is central integrator), Univocity, Absence of False Positives (excludes PVS, coma), Clinical Detectability (established protocols), Integration Cessation.
      *   **Key Weakness:** **Loss of Consciousness/Personhood (Desideratum 6)**. It excludes patients in permanent unconscious states (PVS, anencephaly) who retain brainstem function but lack any capacity for consciousness. Proponents of Desideratum 6 argue this fails to mark the loss of the "person." It also struggles slightly with Public Intuition due to ventilator support.
      *   **Most Excluding Desideratum:** **Loss of Consciousness/Personhood (6).** This is the primary objection from higher-brain advocates.

  2.  **Higher-Brain Formulation:** Death = Irreversible loss of the capacity for consciousness and social interaction (functions of the cerebrum and diencephalon).
      *   **Strengths:** Directly addresses Loss of Consciousness/Personhood (6), Consistency with Organ Viability (could allow procurement from PVS/anencephaly *if* criteria met), aligns with some philosophical views on personhood.
      *   **Key Weaknesses:** **Absence of False Positives (Desideratum 4)** and **Organismic Cessation (Desideratum 2)**. It risks declaring death in PVS patients who retain brainstem function (integration, respiration, homeostasis) – violating 4 and 2. **Clinical Detectability (Desideratum 5)** is a major hurdle; reliably diagnosing the *irreversible* loss of consciousness prospectively is currently impossible. Public Intuition is also a challenge.
      *   **Most Excluding Desideratum:** **Absence of False Positives (4)** and **Organismic Cessation (2)** are tied as the most fundamental rejections. PVS is the critical case.

  3.  **Circulatory-Respiratory (Cardiopulmonary) Formulation:** Death = Irreversible cessation of circulatory and respiratory functions.
      *   **Strengths:** Strong Biological Irreversibility (when confirmed after sufficient time), high Clinical Detectability, excellent Public Intuition and historical precedence, clear Univocity. DCD protocols leverage it for Consistency with Organ Viability.
      *   **Key Weakness:** **Organismic Cessation (Desideratum 2)** and **Integration Cessation (7)**. When applied to bodies with *artificially maintained* circulation/respiration (ventilator, ECMO, VADs) *after* brain destruction has occurred, it fails to declare death despite the loss of the central integrator. The hypothetical scenario *on ECMO* wouldn't be death by this definition until ECMO was stopped *and* circulation irreversibly ceased. This violates the view that the organism ceased when the brain died. It also creates a practical/ethical gap with brain death.
      *   **Most Excluding Desideratum:** **Organismic Cessation (2).** It fails to mark the cessation of the organism *when the brain is dead but circulation is artificially maintained.*

  **Conclusion:** No current theory satisfies all desiderata perfectly, reflecting inherent tensions between biological, philosophical, clinical, and societal needs. The core conflict centers on whether the loss of the *person* (consciousness) or the loss of the *organism* (integration) is definitive, exacerbated by technological life support. The desiderata of Organismic Cessation and Loss of Consciousness/Personhood appear fundamentally incompatible in cases involving preserved brainstem/hypothalamic function without consciousness. Any adequate theory must navigate these tensions explicitly, prioritizing the non-negotiable desiderata while acknowledging the compromises involved in the negotiable ones.
