prompt: |-
  My roommate has started ending arguments with "actions speak louder than words" and I keep loosing because of it. Latest round: I told him I genuinely value eating well and saving money, he gestured at the takeout containers and my bank statement, dropped the line, and walked off. I know economics has a fancy version of this somewhere — revealed preference, the idea that what you choose shows what you actually prefer — but I'm not convinced the slogan and the theory are the same claim, and I want to take the slogan apart properly before the next round.

  Can you lay out the distinct precise things "actions speak louder than words" could be claiming? I'm thinking there are at least a few: an epistemic claim (behavior is better *evidence* of what you want than self-report is), a definitional claim (your preferences just ARE your choice dispositions, so self-report isn't even evidence about the same thing), a predictive claim (to guess what I'll do next, watch my past behavior not my talk), a sincerity or hypocrisy claim about me as a person — plus whatever else I've missed. For each reading: is it trivial, substantive-but-defensible, or just false? And this is the part I actually care about: does that reading support my roommate's specific move, which was dismissing what I *said* I value in favor of what I did? Please pressure-test each one against the obvious trouble spots — weakness of will, choosing the least-bad of bad options rather than what you most want, one-off choices versus patterns, framing and context effects, people genuinely changing over time, words sometimes being the only data available. Menu format is fine, with a verdict on each entry.

  End with a last line of the form \answer{...} naming the single strongest reading of the slogan for my roommate's argument (or "none" if none of them survive the pressure-testing).
reasoning: |-
  Okay, I need to help this user dissect the phrase "actions speak louder than words" as used by their roommate in arguments. The user feels they're losing debates because their claimed values (like valuing healthy eating and saving money) get dismissed when their actions (ordering takeout, poor bank statements) contradict them. They mentioned revealed preference theory in economics but suspect it's not the same as the slogan. They want a breakdown of possible interpretations of the slogan to prepare for the next argument.

  The user requested a menu format with distinct claims: epistemic, definitional, predictive, sincerity/hypocrisy, and more. For each, I should assess whether it's trivial, defensible, or false, and whether it supports the roommate's move of dismissing words in favor of actions. I also need to pressure-test each against real-world complications like weakness of will, constrained choices, one-off vs patterns, context effects, personal change over time, and cases where words are the only data.

  Finally, I have to end with an \answer{} naming the strongest reading for the roommate's argument or "none" if none hold up.

  First, let's list possible interpretations of the slogan:

  1. **Epistemic Claim**: Actions are better evidence of true preferences than self-reports.
  2. **Definitional Claim**: Preferences are defined by choices; self-reports are irrelevant.
  3. **Predictive Claim**: Past actions predict future behavior better than stated intentions.
  4. **Sincerity/Hypocrisy Claim**: Actions reveal sincerity; contradictions show hypocrisy.

  I should also consider other angles like normative claims or motivational aspects, but these four seem core. Now, for each, I'll analyze:

  - **Trivial/Defensible/False?**: How well does the claim hold up?
  - **Supports Roommate's Move?**: Does it justify ignoring stated values?
  - **Pressure-Testing**: Apply the user's listed complications to see vulnerabilities.

  After that, I'll determine the strongest reading for the roommate's argument. From the analysis, the epistemic claim seems most defensible in many contexts, but it has weaknesses like akrasia or constraints. The definitional claim is rigid and ignores internal states, while predictive and hypocrisy claims are situational. Overall, none fully support dismissing words outright, but the epistemic reading might be the roommate's strongest basis.

  In the answer, I'll note that even the epistemic claim doesn't make words worthless—it just prioritizes them. The roommate oversimplifies by ignoring context. So, \answer{epistemic claim} might be the best fit, but it's not bulletproof.
answer: |-
  Here's a breakdown of "actions speak louder than words" interpretations, pressure-tested against your concerns and evaluated for whether they support your roommate's dismissal of your stated values. The verdicts focus on the slogan's validity *and* applicability to his move.

  ---

  ### Interpretation Menu & Verdicts

  1.  **Epistemic Claim:** Actions provide *better evidence* of true preferences/values than self-reports.
      *   **Trivial/Defensible/False?** **Substantive-but-Defensible (with caveats).** Actions often *are* more reliable evidence than words because words are cheap and can be insincere, mistaken, or aspirational. However, actions can be noisy evidence.
      *   **Supports Roommate's Move?** **Partially.** It gives him a reason to *prioritize* observing your actions as evidence, but **does not justify *dismissing* your words entirely**.
      *   **Pressure-Testing:**
          *   *Weakness of Will (Akrasia):* **Weakens.** You genuinely value eating well (words), but succumb to takeout (action) due to fatigue, stress, or habit. Action ≠ true preference, just momentary failure. Words retain validity.
          *   *Constrained Choice:* **Weakens.** You *want* to save (words), but an emergency expense depleted savings (action). Action reflects the constraint, not a preference for being broke.
          *   *One-off vs. Patterns:* **Strengthens/Weakens.** A single takeout order is weak evidence; a *pattern* of takeout orders is stronger evidence against valuing healthy eating. Your roommate needs to show a pattern, not a snapshot.
          *   *Framing/Context:* **Weakens.** Buying takeout *once* because your stove broke doesn't negate valuing home cooking. Context matters for interpreting actions.
          *   *Change Over Time:* **Weakens.** Past actions (takeout) might not reflect your *current* values if you're actively trying to change. Words can signal this change.
          *   *Words as Only Data:* **N/A.** Actions exist here, but words are still relevant for understanding *why* actions occurred.
      *   **Overall Verdict for Roommate:** Gives him a *starting point* but fails to justify *dismissal* of words, especially given akrasia, constraints, context, and change.

  2.  **Definitional Claim (Revealed Preference Core):** Preferences *are defined by* choices/actions. Statements about preferences are irrelevant or secondary; they aren't the "real" preferences.
      *   **Trivial/Defensible/False?** **Substantive-but-Controversial (often false as a complete claim).** Useful for predictive modeling in economics (assuming stable preferences), but philosophically and psychologically inadequate. Ignores internal states, aspirations, regret, and the difference between "revealed" preference under constraints and "ideal" preference.
      *   **Supports Roommate's Move?** **Yes, directly.** If your preferences *just are* what you do, then your words about valuing saving/eating well are meaningless noise if your actions contradict them.
      *   **Pressure-Testing:**
          *   *Weakness of Will:* **Shatters.** Akrasia becomes logically impossible. If you choose takeout, you *by definition* preferred it at that moment. This denies the core human experience of acting against your better judgment or deeper values.
          *   *Constrained Choice:* **Shatters.** Being forced to choose the "least bad" option (expensive takeout because no time) is definitionally equated with *preferring* that option over the impossible ideal (healthy, cheap, convenient meal). This is deeply counterintuitive.
          *   *One-off vs. Patterns:* **Mitigates slightly.** While each choice defines preference *at that instant*, a pattern defines a more stable preference. Doesn't rescue the core flaws.
          *   *Framing/Context:* **Ignores.** The definition treats the choice atomistically, ignoring how context frames the options and influences the "revealed" preference. Your value for healthy eating isn't negated by ordering pizza when stranded.
          *   *Change Over Time:* **Problematic.** Preferences are defined only at choice points. Your stated desire to change is irrelevant until manifested in a new action. Denies the process of change.
          *   *Words as Only Data:* **Renders Impossible.** If no action exists, the preference literally doesn't exist or is undefined. Absurd for latent desires or future plans.
      *   **Overall Verdict for Roommate:** Provides the *strongest logical foundation* for his dismissal, but it's built on sand. It ignores the reality of inner conflict, constraints, and genuine aspiration, making it a poor description of human psychology. Highly vulnerable to the akrasia and constraint objections.

  3.  **Predictive Claim:** Past actions are a better *predictor* of future actions than stated intentions.
      *   **Trivial/Defensible/False?** **Substantive-but-Defensible (often true).** Habits, inertia, and environmental cues are powerful. Stated intentions often overestimate future follow-through ("intention-behavior gap").
      *   **Supports Roommate's Move?** **No.** Predicting your *future* behavior (e.g., "You'll probably order takeout again") is different from dismissing your *current stated values*. He's arguing about what you value *now*, not just what you'll do next Friday.
      *   **Pressure-Testing:**
          *   *Weakness of Will:* **Strengthens.** Past failures predict future failures well, *unless* something changes. Doesn't mean the value isn't real.
          *   *Constrained Choice:* **Complicates.** If constraints are stable, past actions predict future actions well. If constraints change (e.g., you get a raise), prediction fails. Doesn't invalidate the value.
          *   *One-off vs. Patterns:* **Crucial.** A single action is a weak predictor; a strong pattern is a strong predictor.
          *   *Framing/Context:* **Important.** Predictive power depends on stable context. A new context (e.g., moving near a cheap market) changes predictions.
          *   *Change Over Time:* **Major Weakness.** Explicit commitment to change + new strategies can break past patterns. Words *about change* are crucial evidence here.
          *   *Words as Only Data:* **N/A.** Actions exist for prediction.
      *   **Overall Verdict for Roommate:** **Fails.** While useful for betting on your *behavior*, it doesn't logically support dismissing your *stated value*. You can genuinely value something and still fail to act on it predictably. It shifts the argument to behavior prediction, not value assessment.

  4.  **Sincerity/Hypocrisy Claim:** Actions demonstrate sincerity and commitment. A contradiction between words and actions reveals hypocrisy or lack of genuine belief.
      *   **Trivial/Defensible/False?** **Substantive-but-Defensible (in context).** Consistency is often seen as a mark of sincerity. Chronic contradiction *can* indicate hypocrisy. However, isolated contradictions or contradictions due to weakness/constraints don't necessarily equal hypocrisy.
      *   **Supports Roommate's Move?** **Potentially, but overreaching.** It allows him to question the *sincerity* or *depth* of your commitment based on actions, but **doesn't automatically prove the value itself is absent** or that you're lying about believing it *in that moment*.
      *   **Pressure-Testing:**
          *   *Weakness of Will:* **Weakens.** Failing to act isn't hypocrisy; it's human frailty. You can be sincerely committed but weak.
          *   *Constrained Choice:* **Weakens.** Acting against a value due to force majeure isn't hypocrisy.
          *   *One-off vs. Patterns:* **Critical.** A single contradiction is weak evidence of hypocrisy; a persistent pattern is stronger evidence.
          *   *Framing/Context:* **Relevant.** Context explains the contradiction (e.g., celebrating a birthday with takeout doesn't negate valuing healthy eating overall).
          *   *Change Over Time:* **Mitigates.** Past hypocrisy doesn't preclude current sincerity during a change effort.
          *   *Words as Only Data:* **Irrelevant.** Hypocrisy requires observable action contradicting words.
      *   **Overall Verdict for Roommate:** **Weak Support.** It gives him grounds to challenge your *commitment* or call out *inconsistency*, which can feel like "winning" an argument. However, it doesn't definitively prove you don't *value* healthy eating/saving. It conflates valuing something with perfectly enacting it. Highly vulnerable to the akrasia objection.

  5.  **Normative Claim (Implicit):** Actions *should* be prioritized over words when evaluating a person or their values. What you do is what *matters*.
      *   **Trivial/Defensible/False?** **Substantive-but-Contested.** This is a value judgment itself. While outcomes matter, intentions and stated values also hold moral and practical weight (e.g., in law, relationships, understanding motivation).
      *   **Supports Roommate's Move?** **Yes, directly.** If he believes actions are what *truly matter*, then your words about valuing things are irrelevant noise if your actions don't align. He's imposing his own normative framework.
      *   **Pressure-Testing:**
          *   *All Previous Complications:* Apply directly. If actions can be weak-willed, constrained, one-off, or context-dependent, prioritizing them *uncritically* is flawed. Valuing the *outcome* of actions doesn't mean the actions perfectly reveal the person's internal state or ideal values.
          *   *Words as Only Data:* **Undermines.** If actions are absent, this claim offers no way to evaluate the person at all.
      *   **Overall Verdict for Roommate:** **Strongest Foundation for Dismissal, but Subjective.** This is likely the *emotional* core of his argument: "Stop *talking* about valuing X and just *do* X." However, it's a value judgment, not a factual claim. You can counter with the value of intention, aspiration, understanding context, and the reality of human struggle. It doesn't *prove* your stated values are false, it just declares they are unimportant compared to actions.

  ---

  **Strongest Reading for Your Roommate's Argument:** While the **Definitional Claim** provides the cleanest *logical* basis for dismissal (if accepted), its denial of akrasia and constrained choice makes it highly implausible. The **Normative Claim** is likely the *actual* driver of his move – he believes actions are what *truly matter* and thus dismisses words as irrelevant when contradicted. However, this is a value judgment, not an objective truth. The **Epistemic Claim** gives him a *partial* basis for prioritizing actions as evidence but doesn't justify *dismissal*.

  **The Single Strongest *Plausible* Reading:** The **Epistemic Claim** is the most defensible core interpretation of the slogan. It withstands pressure-testing better than the others *as a general principle*, though with significant caveats (akrasia, constraints, etc.). It supports *prioritizing* actions as evidence over words, but **does not support the outright dismissal your roommate performed**. He over-extends it.

  \answer{epistemic claim}
