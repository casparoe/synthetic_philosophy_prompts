answer: |-
  **Bottom line:** Britain's 1807 abolition commemorates genuine moral mobilization but obscures the state's role in sustaining coercion via compensated emancipation and new forms of exploited labor, revealing Whig history's blindness to the endurance of oppressive labor regimes beneath liberal reform.

  **Mapping the Players and Process:** Driven by evangelical reformers like William Wilberforce and the "Clapham Sect," the 1807 Act banned British ships from transporting enslaved Africans, targeting the *trade* itself. They overcame fierce opposition from the powerful "West India lobby" of plantation owners who relied on slavery. Crucially, the Act left colonial slavery intact. Later emancipation (1833) compensated slave *owners* massively, not the enslaved, and prompted colonies to import indentured laborers (notably from India) under contracts often exploitative and coercive, replacing chattel slavery with another unfree system.

  **Breaking Down the Whig Lens:** The progress frame rightly highlights 1807 as a landmark victory for humanitarian activism, a shift in public morality challenging entrenched economic power, which *is* why we commemorate it. However, Whig history obscures crucial continuities: the state protected property rights (owner compensation) and enabled replacement labor systems (indentureship) that maintained colonial exploitation. Framing abolition solely as a moral awakening lets Britain off the hook for actively re-engineering coercion elsewhere. This case doesn't make Whig history flat wrong about shifting values, but it starkly exposes its inability to track how states and capital reconfigure labor control and exploitation beneath the veneer of liberal reform, forcing a story of inevitable moral triumph over a messier reality of transformed oppression.
