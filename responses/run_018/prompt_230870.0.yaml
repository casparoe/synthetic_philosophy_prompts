answer: |-
  Here's an original scenario meeting your criteria:

  **Scenario:** Maya has a significant history essay due in two weeks. She *intends* to do it well, but she keeps putting off starting it because she'd rather hang out with friends or watch shows. She tells herself, "I work best under pressure anyway. I'll definitely start it the night before; that's plenty of time." She genuinely believes she'll do it then. When the night before arrives, the workload feels crushing, she's exhausted, and she produces a rushed, mediocre essay.

  1.  **Maxim:** "To delay starting significant assignments until the last possible minute whenever I believe I can complete them adequately under pressure, in order to free up time for more immediately enjoyable activities."
  2.  **Contradiction-in-Conception Test (Passes):** Universalizing this maxim ("*Everyone* always delays starting significant tasks until the last minute whenever they believe they can finish under pressure") doesn't create a logical contradiction or make the world impossible. Deadlines still exist; tasks *can* technically be completed at the last minute (as Maya intended). Society functions, albeit potentially with lower average quality and higher stress. The *conception* of tasks being done at the last minute isn't self-destructive.
  3.  **Contradiction-in-Willing Test (Fails):** Could Maya rationally *will* that this become a universal law of nature? If *everyone* always delayed until the last minute, constant, intense pressure would be the permanent state for all significant tasks. Maya, as a rational agent, necessarily wills the means to her own ends – including doing well on assignments important to her goals (e.g., good grades, learning). However, universal last-minute pressure systematically undermines the conditions needed to achieve quality results reliably: time for research, careful thought, revision, and avoiding exhaustion. Maya cannot rationally will a world that makes achieving her own important ends (like producing good work) significantly harder or impossible, simply for the sake of short-term leisure. Her will would contradict itself: willing quality outcomes while simultaneously willing a universal condition (permanent debilitating pressure) that prevents them.
  4.  **Key Feature & Removal:** The key feature is Maya's **intention to produce adequate/quality work** combined with the **systematic undermining of the conditions for quality** by universalizing the delay. If Maya's maxim *lacked the intention of adequate work* (e.g., "to delay starting assignments to avoid doing them at all"), it would likely fail the first test (tasks wouldn't get done, defeating the purpose of deadlines). If the delay *didn't systematically undermine quality* (e.g., delaying only trivial tasks), it might pass both tests.
  5.  **Kantian Response to "I Can Will It":** A Kantian would argue you are mistaken about what constitutes rational willing. Insisting you can rationally will universal last-minute pressure *while also* rationally willing high-quality outcomes ignores the empirical reality that sustained pressure and lack of time demonstrably hinder quality. Rational willing requires consistency. To claim you can will both is either irrational (ignoring the contradiction in outcomes) or reveals your true end isn't quality work, but merely completion or leisure – which would change the maxim and potentially cause it to fail the first test.

