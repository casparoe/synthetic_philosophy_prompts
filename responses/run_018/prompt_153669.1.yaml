answer: |-
  The ink-stained air of the Citadel Archives tasted of dust and deliberation. Kira ran a calloused finger down the spine of the Seawall Reinforcement Register. Its heft was significant – thick vellum pages dense with testimony, cross-references, and the peculiar, heavy scent of unresolved consequence. Unlike the Probabilists of the drowned cities, Avalon’s Council didn’t gamble with dice-throw percentages. They weighed arguments. Kira’s job was to bind that weight physically, ledger by ledger.

  The seawall decision loomed. Storm patterns defied all prior ledgers, swirling in chaotic spirals on the hydrographers’ maps – pure uncertainty. The Register bulged. High Weight, certainly. The front section overflowed: engineers citing unprecedented wave-force projections (based on novel, untested models), geologists pointing to newly discovered seabed instabilities (fragmentary core samples), grim recollections from coastal elders about forgotten surges (oral histories, uncorroborated). Each entry added to the 'Relevant Evidence' mass. But turn the page, and contradiction bloomed. Section Two held equally credentialed dissent: engineers dismissing the models as speculative, geologists arguing the instability was ancient and stable, historians questioning the elders' memories. The evidence *was* relevant, but it pulled in opposite directions. The Weight was high, but the argument fractured, a chorus shouting over itself.

  Kira then pulled the slim, almost apologetic Canal Diversion Register. Low Weight. Fewer pages, sparser testimony. The proposal: redirect vulnerable populations inland via hastily expanded canals. The evidence? Unanimous, yet thin. Logistics officers agreed it *could* be done quickly (but offered no detailed plans). Community liaisons reported willingness *in principle* from upland settlements (no binding agreements). Hydrologists stated the canals *should* handle the flow (based on normal rainfall models, irrelevant to the storm threat). Agreement, yes, but built on sand. The 'Total Ignorance' column – the vast unknowns about storm impact zones, evacuation chaos, long-term displacement – dwarfed the scant evidence. Low Weight. Unanimous, yet fragile.

  Preparing the Council docket, Kira’s hand hovered. Procedure demanded she collate, not interpret. But the tension vibrated in the paper. The seawall ledger felt like a storm itself – powerful, chaotic, dangerous. The canal ledger felt… flimsy. A polite fiction. She bound the seawall testimony together, its contradictions unresolved, its sheer *volume* demanding attention. She flagged the canal’s unanimity but placed its thinness beside the yawning ignorance column. No numbers summarized this. Only weight, texture, dissonance.

  In the Council Chamber, lamplight flickered on anxious faces. Kira presented the Registers. The Lead Engineer for the seawall spoke, voice booming with the heft of his section: “The evidence compels reinforcement! The forces *could* be catastrophic!” Immediately, the dissenting geologist cut in, her finger stabbing her own entry: “But the instability *might* be inert! We pour resources into a *potential* threat based on *speculation*!” The Weight was palpable, a physical pressure in the room, but it was the pressure of colliding certainties, not cumulative proof.

  The canal advocates spoke softly. “Agreement exists,” murmured the Logistics Master, tapping the unanimous section. “A simpler path. Less… fraught.” But the thinness of their evidence was obvious. When pressed for guarantees, for details on storm-surge capacity or settlement integration, they faltered. “We… proceed on good faith,” the Community Liaison said. The ‘Total Ignorance’ gap yawned silently behind him.

  Kira watched the Councillors’ eyes dart between the thick, contentious seawall Register and the slim, agreeable canal one. The absence of a number to cling to was agonizing. They couldn’t calculate an expectation, only feel the imbalance of argument against the void of the unknown. The seawall’s high weight, despite its internal war, felt more *substantial* than the canal’s hollow unanimity. Fear of the unprecedented monster storm, given voice by so much credentialed alarm, even conflicting alarm, outweighed the quiet, untested promise of the canals. The unknown depth of the storm’s fury felt vaster than the known shallowness of the canal plan's preparation.

  “The weight of argument for reinforcement is greater,” the Chief Councillor finally declared, her voice strained. “We must act on the preponderance of relevant evidence, however contested. The seawall will be reinforced. The canal diversion proposal is noted, but lacks sufficient weight for action.”

  Kira felt the decision settle like cold lead. High Weight, fractured. Low Weight, unified. Action chosen under radical ignorance, guided by the sheer mass of *concern*, however discordant, over the lightness of fragile agreement.

  Weeks later, Kira stood not in the archive, but on a rain-lashed overlook. The reinforced seawall, a jagged scar of new stone, groaned under the onslaught. The storm hadn’t conformed to *any* model. It pushed water *behind* the wall, through the neglected, low-lying districts the canal diversion was meant to empty. She watched the flood surge through narrow streets where unanimous agreement *could* have cleared the path.

  Below, a desperate figure scrambled onto a rooftop, clutching a child. The water rose, relentless, impersonal. The reinforced seawall stood firm where the storm wasn't hitting hardest, a monument to defended irrelevance. The child slipped. A tiny splash, instantly swallowed by the churning brown water. The parent’s scream was lost in the wind.

  Kira closed her eyes, feeling the cold rain mix with hot tears. The weight of the Seawall Register, its thick pages of clashing certainties, pressed against her memory. The flimsy Canal Register felt like ash. They had assessed the argument, weighed the evidence against ignorance, and chosen the heavier ledger. The irreversible consequence wasn’t in the numbers. It was in the silence where the child had been, drowned by the weight of unquantifiable uncertainty and the terrible lightness of ignored, unanimous, but insufficient proof. The ink in the ledgers bled nothing compared to the water on the streets.
