answer: |-
  ### Joint Statement: Teleosemantics Adversarial Collaboration  
  *From the Evolutionary Teleosemanticists (ET) & Ontogenetic-Functionalists (OF)*  

  **Agreed Claims**  
  1. **Misrepresentation is real**: Both camps agree misrepresentation occurs when a system’s internal state "points to" something non-veridical (e.g., a neural net "seeing" cats in noise).  
  2. **Causal correlation isn’t enough**: Purely statistical correlations (e.g., "neuron X fires with cats") can’t fully naturalize content—*why* it *should* indicate cats matters.  
  3. **Naturalization must explain normativity**: Any theory must account for *correct* vs. *incorrect* representation (e.g., why a frog’s tongue snap at a moving dot is "wrong").  
  4. **Synthetic systems exhibit misrepresentation analogs**: RL-trained networks show error states that *look like* misrepresentation, even if their "content" status is contested.  
  5. **Formal limits exist**: Pure loss minimization in synthetic systems can create "content drift" (e.g., a vision net detecting "edges" as "dogs" post-training).  

  ---

  **Disagreements Table**  

  | Issue | Evolutionary Side’s Formulation | Ontogenetic Side’s Formulation | The Crux | Shared Case/Argument | Predictions |  
  |-------|----------------------------------|---------------------------------|----------|----------------------|-------------|  
  | **Selection requires reproduction?** | "Proper functions require multi-generational selection history (Millikan). Without phylogeny, there’s no ‘should’." | "Selection is any stability-under-pressure. Individual learning *is* selection—no reproduction needed (Dennett-style ‘tuning’)." | Is Darwinian lineage essential for normative content? | Avian imprinting: Is a duckling mis-mothering a boot *evolutionarily* wrong or just *developmentally* maladaptive? | **ET**: Synthetic nets lack content. **OF**: Nets *can* have content via training pressure. |  
  | **Ontogeny vs. phylogeny** | "Phylogeny sets the teleological ‘target.’ Ontogeny adjusts aim—it can’t create targets (Papineau)." | "Ontogeny builds fully functional content via feedback loops. Phylogeny is just one feedback source (Dretske-influenced)." | Can lifetime learning define content *independently*? | Octopus tool use: Is its "intent" rooted in species history or individual trial-and-error? | **ET**: Synthetic systems lack stable targets. **OF**: Nets’ training goals *are* targets. |  
  | **Do synthetic systems have mental content?** | "No. Without evolved proper functions, synthetic ‘errors’ are just bugs—no *normative* failure (Millikan)." | "Yes. Training imposes functional norms—misrepresentation is deviation from *designed* role (e.g., RLHF alignment failures)." | Can engineered systems have genuine representational norms? | GPT hallucinating facts: Is it "lying" or just statistically glitching? | **ET**: Content requires biology. **OF**: Content requires functional role, not biology. |  
  | **Is this partly verbal?** | "The dispute is substantive: ‘Function’ implies history. OF relabels ‘function’ loosely (Millikan)." | "The dispute is 30% verbal: Both agree on mechanisms but define ‘content’ too narrowly (Brandom-esque)." | How much hinges on defining "function"? | Both agree thermostats "represent" temperature—but disagree on *why*. | **ET**: Language obscures core divergence. **OF**: Clarifying terms reduces disagreement. |  

