prompt: |-
  hey im on a review board for our county's emergency intervention fund and we get like 15-20 proposals a month asking us to approve spending on things that are basically "rescue" operations -- vaccinating a remote village, funding a suicide hotline, sending gear to wildfires, even one about saving a coastal archive of indigenous records from storm surges. right now we just vote on gut feeling and its a mess.

  i want a decision procedure based on singer's drowning child idea -- that if you can prevent something terrible without giving up anything of comparable moral importance, then you have to do it. but i need it turned into something my board can actually run in about 20 minutes per proposal, since none of us are philosophers. so write me the questions to ask in order, what counts as a sufficient answer at each step, where the procedure stops with a hard no, and where it has to hand the decision back to the board because its a values question not a facts question.

  the procedure needs to handle the hard cases: the "victim" might be statistical or future (preventing expected deaths vs saving one visible person), the "cost" is always money we could spend on another proposal, and sometimes people disagree about wether the harm is "bad enough" to trigger the duty at all. also it needs a specific check for proposals where the beneficiary's moral status is contested -- like wild animals, digital archives, or future generations -- since singer's own framework extends beyond humans but not everyone on the board agrees.

  then run the procedure on three proposals: (1) funding a mobile unit to reverse opioid overdoses in our county, (2) a grant to protect that coastal archive of indigenous records from storm surges, and (3) a program that vaccinates a wild deer population against a painful but non-lethal disease.

  make sure you flag where the procedure will misfire or give answers the board probably wont like. and please say how confident you are in what you claim, and single out the one point you're least sure about -- especially anything that hinges on how singer actually treats indirect costs or statistical lives.
reasoning: |-
  Okay, the user is on a review board for an emergency intervention fund and is struggling with evaluating 15-20 proposals monthly. They currently vote based on gut feeling, which is chaotic. They want a structured decision procedure based on Peter Singer's drowning child analogy but adapted for practical, quick use by non-philosophers.

  First, I need to break down Singer's core principle: if you can prevent something terrible without sacrificing anything of comparable moral importance, you must act. The challenge is operationalizing this into clear, sequential questions that can be handled in 20 minutes per proposal. Key considerations include statistical vs. identifiable victims, opportunity costs (money that could go to other proposals), and contested moral statuses (animals, archives, etc.).

  The user mentioned hard cases: future or statistical victims, disagreements on harm severity, and moral status debates. The procedure must flag these as "values questions" for board review. Also, costs are always relative to other proposals, so effectiveness and cost-effectiveness comparisons are crucial.

  For the decision procedure, it should have clear steps with "hard no" points to quickly reject non-viable proposals. Steps should include harm assessment, preventability, cost-effectiveness, moral status, and sacrifice. Where there's ambiguity, especially on moral status or harm severity, it should kick back to the board. Needs to be efficient—20 minutes per proposal—so steps must be binary or require quantifiable answers where possible.

  Now, applying it to the three examples:
  1. Opioid overdose reversal: Clear harm (death), cost-effective, human beneficiary—likely approve.
  2. Coastal archive: Harm is cultural loss, harder to quantify. Moral status of archives? Contested, so board must decide.
  3. Deer vaccination: Non-lethal disease. Harm severity debated, moral status of animals contested. Probably reject or board review.

  Potential misfires: Where harm is non-quantifiable (like cultural loss) or moral status contested, the procedure might reject viable proposals the board values. Also, cost-effectiveness comparisons can be imperfect if data is lacking. Least confident in handling indirect costs—Singer focuses on direct sacrifice but in this context, opportunity cost (money for other proposals) is critical. Need to emphasize comparing cost-per-outcome across proposals, but data might not always be available, leading to estimates that could be inaccurate.
answer: |-
  Here's a streamlined decision procedure based on Singer's principle, designed for 20-minute reviews by a non-philosophical board. It prioritizes efficiency while flagging ethical complexities for board deliberation.

  **The Emergency Intervention Fund (EIF) Decision Procedure:**

  1.  **Harm Severity: Is the harm addressed "terrible" (serious, irreversible, and urgent)?**
      *   *Question:* What specific harm does this proposal prevent? How severe, irreversible, and urgent is it? (e.g., death, severe suffering, permanent loss of essential function/identity, imminent catastrophe).
      *   *Sufficient Answer:* Concrete description of the harm, evidence of severity/irreversibility/urgency (data, expert opinion, known risk).
      *   *Hard No:* If harm is minor, reversible, non-urgent, or purely hypothetical without credible evidence. (e.g., "Mild inconvenience," "Potential minor economic loss years from now").
      *   *Hand Back:* If severity is debatable (e.g., "Is preserving this specific cultural archive 'terrible' loss?"). Board must vote on whether *this specific harm* meets the "terrible" threshold.

  2.  **Preventability & Causality: Can *this specific intervention* reliably prevent or significantly mitigate the harm?**
      *   *Question:* What's the direct causal link? What's the evidence (data, studies, pilot projects) that *this specific action* with *this specific funding* will prevent the harm?
      *   *Sufficient Answer:* Clear logic model/causal chain + credible evidence of effectiveness (e.g., established medical protocol, proven disaster mitigation technique, documented success of similar programs).
      *   *Hard No:* If intervention is untested, speculative, or evidence shows it's ineffective for *this specific harm*.
      *   *Hand Back:* If evidence is mixed/limited but plausible, or causality relies on complex chains. Board assesses reasonableness.

  3.  **Cost-Effectiveness: Is the cost per unit of harm prevented low compared to typical EIF interventions?**
      *   *Question:* What is the estimated cost per unit of primary harm prevented? (e.g., cost per life saved, cost per severe suffering case averted, cost per irreplaceable item/record preserved). Provide benchmark data if possible.
      *   *Sufficient Answer:* Quantified estimate (even if rough) + comparison to known benchmarks (e.g., typical public health intervention costs, disaster relief costs). Focus on the *primary* harm from Step 1.
      *   *Hard No:* If cost per unit is demonstrably *orders of magnitude* higher than typical EIF interventions *without exceptional justification*. (e.g., $1 million to save one identifiable life when similar proposals save lives for <$50k).
      *   *Hand Back:* If quantification is very difficult (e.g., cultural value) or benchmarks are unavailable/incomparable. Board weighs cost against perceived severity/importance.

  4.  **Moral Status Check: Is the beneficiary's status uncontested?**
      *   *Question:* Who/what is the direct beneficiary? Is there significant disagreement about whether they/it possesses moral standing sufficient to trigger a duty to rescue? (e.g., humans = uncontested; wild animals, AI, digital entities, specific ecosystems, future generations = potentially contested).
      *   *Sufficient Answer:* Clear beneficiary identification. "Uncontested" only if beneficiary is current human beings.
      *   *Hand Back:* If beneficiary is anything other than current human beings. **Board MUST explicitly vote** on whether *this type* of beneficiary has sufficient moral status *for the EIF's purpose* given the harm severity. This is a core values question.

  5.  **Moral Sacrifice: Does funding this proposal prevent us from funding interventions addressing harms of comparable or greater severity?**
      *   *Question:* Given our budget constraint, does funding this $X proposal *likely* mean we cannot fund another proposal(s) that would prevent equal or worse harms to beneficiaries of equal or uncontested moral status?
      *   *Sufficient Answer:* Analysis of current proposal pipeline, typical costs/severity. Requires awareness of other active proposals.
      *   *Hard No:* Only in extreme, clear-cut cases (rarely used). (e.g., Funding this $1M low-impact project means definitively rejecting five $200k high-impact life-saving projects).
      *   *Hand Back:* Almost always. Requires comparing opportunity costs and relative severity across proposals – a core board judgment call based on Steps 1-4 applied to *other* proposals.

  **Decision Flow:**
  *   "Hard No" at any step ends review (Reject).
  *   "Hand Back" at any step means the board must discuss/vote on that specific point before continuing or making a final decision.
  *   Passing Steps 1-4 without "Hand Back" or "Hard No" implies a strong prima facie case for funding *unless* Step 5 ("Moral Sacrifice") triggers a "Hand Back" for board deliberation on relative priority.
  *   **Final Decision:** Always rests with the board. The procedure clarifies *why* and *where* judgment is needed.

  **Key Misfires & Controversies:**
  1.  **Statistical vs. Identifiable Victims:** Singer treats them morally equally. The procedure (Step 1 & 3) *should* handle them the same. *Misfire:* Boards often feel stronger duty to identifiable victims. Vaccinating deer (statistical suffering) might be rejected while saving an identifiable overdose victim is approved, even if cost-per-harm-prevented is similar. *Procedure Flag:* Step 3 forces cost-effectiveness comparison.
  2.  **Quantifying Intangible Harms:** Step 1 (Severity) and Step 3 (Cost-Effectiveness) struggle with cultural loss, ecosystem damage, or non-lethal suffering. *Misfire:* May undervalue these harms compared to easily quantifiable deaths. *Procedure Flag:* Explicit "Hand Back" for severity judgment (Step 1) and cost-effectiveness (Step 3).
  3.  **Moral Status (Step 4):** This is the biggest filter for controversy. *Misfire:* Proposals for animals, ecosystems, or digital entities might be automatically rejected by a board leaning anthropocentric, even if harm is severe and cost-effective. *Procedure Flag:* Forces explicit board vote on status *before* considering cost-effectiveness for contested entities.
  4.  **Indirect Costs/Opportunity Cost (Step 5):** Singer's "without sacrificing anything of comparable moral importance" translates directly to opportunity cost – what *else* the money could do. *Misfire:* Boards may undervalue this, focusing only on the proposal in front of them ("This seems good!"). *Procedure Flag:* Makes Step 5 mandatory and usually a "Hand Back," forcing the board to confront trade-offs explicitly. *Least Confidence Point:* **I'm least confident about the practical implementation of Step 5.** Getting reliable "cost-per-harm-prevented" comparisons across wildly different interventions (e.g., overdose reversal vs. archive preservation vs. animal vaccination) is incredibly difficult and relies on often shaky estimates and value judgments about comparing different harms. This step is philosophically sound (core to Singer) but operationally messy.

  **Application to Proposals (Confidence: High on structure, Medium on board outcome prediction):**

  1.  **Mobile Opioid Overdose Unit:**
      *   **Step 1 (Harm):** Death (Terrible, Irreversible, Urgent). *Uncontested Severity.* PASS.
      *   **Step 2 (Preventability):** Naloxone reversal is highly effective, proven. PASS.
      *   **Step 3 (Cost-Effectiveness):** Cost per life saved is typically low for such units (often $X,XXX - $XX,XXX), favorable benchmark. PASS.
      *   **Step 4 (Status):** Humans (Uncontested). PASS.
      *   **Step 5 (Sacrifice):** *Hand Back to Board.* Likely low cost per life means funding it *frees up* resources by rejecting less cost-effective proposals? Or does it displace similarly cost-effective life-saving? Board must compare to pipeline.
      *   **Procedure Outcome:** Strong case. Likely APPROVE unless Step 5 reveals it displaces multiple equally/more cost-effective lifesaving interventions.

  2.  **Coastal Indigenous Archive Protection:**
      *   **Step 1 (Harm):** Irreversible loss of unique cultural heritage/knowledge. *Hand Back to Board.* Is this "terrible" loss? (Board must vote on severity threshold).
      *   *If Board deems it "terrible":*
          *   **Step 2 (Preventability):** Physical mitigation (seawalls, relocation) can be effective if well-designed. PASS (if plan sound).
          *   **Step 3 (Cost-Effectiveness):** *Hand Back to Board.* Quantifying "cost per unique record preserved" or "cost per cultural loss unit averted" is highly subjective. No clear benchmark. Board must weigh cost against perceived value.
          *   **Step 4 (Status):** *Hand Back to Board.* Moral status of cultural archives/digital records is contested. Board MUST vote: Does the EIF have a duty to rescue *this*?
      *   **Procedure Outcome:** Multiple Hand Backs (Severity, Cost-Effectiveness, Status). Highly dependent on board's values. High risk of REJECTION by a board focused solely on immediate human life/death, even if approved on severity/status.

  3.  **Wild Deer Vaccination (Non-lethal disease):**
      *   **Step 1 (Harm):** Prevention of widespread, chronic, painful suffering. *Hand Back to Board.* Is non-lethal but significant animal suffering "terrible" *enough* to trigger the duty? (Board votes on severity threshold *for animals*).
      *   *If Board deems it "terrible" suffering:*
          *   **Step 2 (Preventability):** Vaccines effective against target disease. PASS.
          *   **Step 3 (Cost-Effectiveness):** Cost per case of suffering prevented? Needs estimate. *Hand Back if difficult.* Compare to other animal welfare interventions? Board judges reasonableness.
          *   **Step 4 (Status):** *Hand Back to Board.* Moral status of wild animals is contested. Board MUST vote: Does the EIF have a duty to rescue *these non-human beneficiaries*?
          *   **Step 5 (Sacrifice):** *Hand Back.* Would funding this prevent funding interventions for humans or uncontested entities suffering comparable/severe harm? Board must weigh.
      *   **Procedure Outcome:** Very high chance of rejection. Hand Back at Step 1 (Severity for animals) and Step 4 (Status) are major hurdles. Likely only passes with a strongly pro-animal-welfare board. High chance of REJECTION.

  This procedure forces clarity on *why* a decision is hard (values conflict, quantification difficulty, opportunity cost). It replaces gut feeling with structured ethical inquiry, highlighting exactly where the board's judgment is essential. Confidence in the *framework* is high; confidence in specific board *outcomes* for contested cases (like the archive or deer) is lower, as it hinges on their values. The biggest operational challenge remains robustly implementing Step 5 (Opportunity Cost) across diverse interventions.
