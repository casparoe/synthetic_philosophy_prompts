prompt: |-
  I sit on the value analysis committee at a small regional hospital — nine of us, two doctors, a nurse manager, a pharmacist, an admin, a finance person and me (I do procurement and I'm the one who ends up with the spreadsheets). We meet twice a month for about two hours and we decide what supplies, devices and clinical protocols the hospital adopts: things that cost anywhere from 20 grand to 400 grand and that the floor staff then has to live with for five to ten years. I have no economics or philosophy background at all; I got into this because I noticed we almost always end up agreeing with whoever speaks first, and someone on a forum told me to look up information cascades and rational herding. I sort of get the basic idea — people copy the people who went before them and rationally stop using their own private information — but every explanation I find is about strangers picking between two restaurants, or balls in an urn, and I can't map it onto my situation, where we talk in a room, people say out loud how sure they are, we all know each other's track records, and the thing being decided is usually some ugly mixture of a prediction about the world and a values call about what we care about.

  One wrinkle that I think makes us different from the textbook setup, and please tell me if I'm wrong about this. In our meetings people don't only copy each other's picks, they copy each other's level of confidence. Three people who each have a genuinely weak private reason will each sound firm, because each one is reading the other two as firm, and the meeting ends in what I've started calling a "confidence cascade" — nobody has really changed their mind about anything, but the room is radiating a certainty that no individual in it actually holds, and anybody with a real worry suddenly feels like the odd one out and shuts up. There's a mirror version where one respected person says something lukewarm and the whole proposal quietly dies, which I've been calling a "chill." My sense is that a procedure built for binary choices made one at a time in a fixed order won't catch either of these, because with us the action isn't binary, the order isn't fixed and the thing being transmitted is partly a mood.

  What I actually want is a procedure I can run, in the twenty minutes I have before a meeting or in the two minutes of floor time I get during it, to decide for myself: is this a case where I should go along because the fact that everyone is converging really is evidence, or a case where I should dig in and put my private read on the table? A short ordered list of questions, each answerable by a non-expert in a minute or two without knowing the theory, with a clear stopping rule for each — stop and defer, stop and escalate, or stop and hand it to a person because the remaining question is about values rather than facts. Please be honest about which steps are real tests and which are just judgment wearing a clipboard. It has to handle: decisions where there is a fact of the matter that will show up in our own data later (does this catheter actually cut infection rates on our wards) versus ones where the right answer is mostly about what we value (do we buy the nicer monitoring system or spend the same money on another night nurse) versus ones where what matters is simply that we all do the same thing (which electronic record system we standardise on); the fact that sometimes I can get a private straw vote before anyone talks and sometimes I can't, because the chair runs the meeting how she likes; the fact that some of what people know isn't the kind of thing they can put into words, like a nurse's gut feeling that a new pump is going to be a misery on nights; and the fact that I am not the chair and I have maybe two minutes. If the answer is dig in, tell me what the move actually is — secret ballot, ask the quietest person first, table it, send it to a subcommittee, whatever. And please don't point me at papers or tell me what to read; our library access is basically nil and it wouldn't help me with fifteen minutes before a meeting anyway.

  Then run it on three cases from the last year. First: we were choosing between two IV pump models, everyone drifted toward the one the senior anesthesiologist liked, and I had our own repair-ticket data showing that model had noticeably more failures at our two sites over eighteen months than the other one did. Second: we were deciding whether to switch to a cheaper sterilization wrap before the next inspection; six people with far more relevant experience than me were all relaxed about it, my only objection was a vague worry about the inspectors that I couldn't really back up, and I really did not want to be the person who slows everything down — I suspect the right procedure tells me to shut up here, so show me that if it does. Third: an experienced OR nurse said a new surgical positioning device just felt wrong to her, couldn't articulate why, the rest of the room was enthusiastic, and I couldn't tell whether to treat that as a signal or as nothing. Finally, tell me plainly what the procedure can't do: what kinds of decisions it will misfire on, and how I keep it from turning me into the person who objects to everything.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're part of a hospital value analysis committee dealing with high-stakes decisions on supplies and protocols. The main issue is groupthink and information cascades where early opinions sway the group, leading to false confidence or unnecessary hesitation. The user wants a practical, quick method to decide when to speak up or stay quiet during meetings.

  First, I need to break down their specific challenges. The committee has diverse roles, decisions mix facts and values, and private information (like gut feelings) is hard to articulate. The user mentioned "confidence cascades" and "chills," where group confidence or doubt amplifies regardless of individual certainty. 

  The user needs a step-by-step procedure that's actionable in minutes, without requiring theoretical knowledge. It should handle different decision types: factual (infection rates), value-based (spending priorities), and coordination (standardizing systems). They also want examples applied to past cases to see how it works.

  Key elements from the query:
  - Time constraints: 20 mins prep or 2 mins during the meeting.
  - No access to academic papers; needs immediate tools.
  - Must differentiate between when to defer and when to escalate.
  - Address silent members and unspoken concerns like a nurse's intuition.

  I recall concepts like information cascades and rational herding, but the user finds standard examples irrelevant. Their situation involves known colleagues with track records, vocal confidence levels, and mixed decision types. So, the procedure must adapt to these nuances.

  I'll start drafting the procedure. The core idea is to assess whether the group consensus is evidence-based or a cascade. Steps should include checking for dissenting signals, evaluating decision types, and confidence levels. The "STOP/GO" mnemonic can make it memorable: Signal strength, Type of decision, Objectivity check, Past reliability, and Group mood.

  For Signal Strength, the user needs to identify if private info contradicts the group. If yes, proceed; if not, defer. Type of Decision categorizes into Fact, Value, or Coordination. Objectivity Check looks for hard data or measurable outcomes. Past Reliability considers individuals' track records. Group Mood assesses confidence contagion.

  Applying this to the IV pump case: The repair data is strong private info (Signal). It's a Fact decision with objective data (Objectivity). The anesthesiologist's reliability might be high, but data trumps opinion. Here, the user should escalate by presenting data.

  For the sterilization wrap: Vague worry is weak signal. Value/Coordination decision. No objective data against it. Past reliability of others is high. Group mood is relaxed. So, defer.

  Surgical device case: Nurse's gut feeling is a weak signal but comes from high reliability. Fact decision with potential safety impact. Group enthusiasm might be a cascade. Here, the user should table for subcommittee to investigate unarticulated risks.

  The procedure's limitations: It might misfire on pure value decisions or when urgency overrides process. Also, overuse could label the user as obstructive. They need to balance escalation with trust, choosing battles wisely.

  I'll structure the response with the STOP/GO steps, apply to each case, and clarify limitations. Keep explanations jargon-free, using the hospital context. Ensure each step is doable within time limits, like quick mental checks during meetings.
answer: |-
  Here's a battle-tested procedure designed for your constraints. It's called the **STOP/GO Signal Check**. Use it mentally in 2 minutes during the meeting or in 20 minutes prep. Answer these questions sequentially; stop when you hit a clear answer.

  **The STOP/GO Signal Check (For Your Mental Quick-Reference):**

  1.  **SIGNAL Strength:** **Do *I* have a strong private signal (data, experience, gut feeling) that contradicts the emerging group consensus?** (Focus: *Your* unique info)
      *   **NO** (Weak signal/No contradiction): **STOP & DEFER.** Trust the group's convergence. *Go along.*
      *   **YES** (Strong signal contradicting group): **GO TO 2.**

  2.  **TYPE of Decision:** **What kind of decision is this, primarily?** (Focus: *Nature* of the choice)
      *   **FACT:** There's a verifiable truth (e.g., infection rates, failure rates). *Go to 3.*
      *   **VALUE:** It's about priorities/ethics (e.g., comfort vs. cost, staff vs. tech). *Go to 4.*
      *   **COORDINATION:** Main goal is consistency (e.g., standardizing systems). **STOP & DEFER.** Even if suboptimal, coordination usually wins. *Go along.*

  3.  **OBJECTIVITY Check (For FACT Decisions):** **Is my contradicting signal based on objective, hard data *specific to our hospital* (or highly reliable external data applicable to us)?** (Focus: *Quality* of your fact signal)
      *   **YES** (e.g., your repair tickets, your infection data): **STOP & ESCALATE.** Your data trumps group confidence. *Dig in.*
      *   **NO** (e.g., gut feeling, anecdote, vague worry, external data *not* obviously applicable): **GO TO 5.**

  4.  **VALUES Check (For VALUE Decisions):** **Is my contradicting signal rooted in a core value we've *explicitly* agreed matters (e.g., patient safety first, staff retention critical)?** (Focus: *Alignment* with known values)
      *   **YES** (Clear violation of stated value): **STOP & ESCALATE.** Values need a voice. *Dig in.*
      *   **NO** (Personal preference, unclear value clash): **GO TO 5.**

  5.  **PAST Reliability:** **How reliable *historically* is the most influential proponent(s) of the consensus *on this specific type of issue*?** (Focus: *Track record* of key voices)
      *   **LOW/UNKNOWN Reliability:** **STOP & ESCALATE.** Confidence might be unfounded. *Dig in.*
      *   **HIGH Reliability:** **GO TO 6.**

  6.  **GROUP Mood:** **Is the group's confidence/chill feeling like a contagious wave ("confidence cascade" or "chill"), rather than grounded in shared substance?** (Focus: *Contagion* vs. substance)
      *   **YES** (Feels like mood spreading): **STOP & ESCALATE.** Likely cascade. *Dig in.*
      *   **NO** (Feels reasoned, even if quick): **STOP & DEFER.** Trust the reliable voices. *Go along.*

  **What "ESCALATE / Dig In" Looks Like (Your Move):**
  *   **The Core Move:** **"Can we pause for a second? I have a specific concern/data point that seems to conflict, and I want to make sure we capture it before moving on."** *Then state your signal BRIEFLY and OBJECTIVELY.*
  *   **Tactics (Choose based on moment & chair):**
      *   **Surface the Hidden:** "We've heard support, but I'm sensing some hesitation. [Quiet Person], what are your thoughts?" (Best for unspoken gut feelings).
      *   **Democratize Input:** "Before we finalize, could everyone just quickly share their top concern, even if minor?" (Disrupts cascades by forcing private signals out).
      *   **Request Delay:** "Given this concern about [specific data/value], could we table for one week to let [you/someone] pull one specific piece of data/check one thing?"
      *   **Formalize Dissent:** "I need to formally note my concern about [specific point] for the record, even if we proceed."
      *   **Target the Source:** "[Expert Name], you mentioned X, but our internal data shows Y. Can you help me reconcile that?" (Use *only* if you have hard data and respect the expert).

  **Applied to Your Cases:**

  1.  **IV Pumps:**
      *   **S1 (Signal): YES** (Your repair ticket data contradicts group).
      *   **S2 (Type): FACT** (Failure rates are measurable).
      *   **S3 (Objectivity): YES** (Your *own hospital's* repair data).
      *   **--> STOP & ESCALATE.** **Your Move:** "Before we settle, I need to share some internal data. Our repair tickets over the last 18 months show Model X has a [X]% higher failure rate here than Model Y. Dr. [Anesthesiologist], how does that fit with your experience?" (Present data calmly, ask expert to reconcile).

  2.  **Sterilization Wrap:**
      *   **S1 (Signal): YES** (Your vague worry contradicts relaxed group).
      *   **S2 (Type):** Mix, but **COORDINATION** likely strongest (Need standard wrap that passes inspection reliably). *Could argue FACT (inspection risk) or VALUE (risk tolerance), but Coordination dominates.*
      *   **--> STOP & DEFER.** *You were right to suspect shutting up was correct.* Six experts with high past reliability on sterile processing/inspection prep are relaxed. Your vague worry isn't a strong enough signal against this, especially given the Coordination need. No need to slow it down.

  3.  **Surgical Positioning Device:**
      *   **S1 (Signal):** Tricky. *Not your signal directly, but the nurse's unsupported gut feeling is a dissenting signal entering the room.* You need to assess if *you* should amplify it. Treat the *nurse's signal* as the one you're evaluating for escalation potential. **YES** (The nurse's "feels wrong" contradicts enthusiasm).
      *   **S2 (Type): FACT** (Safety, effectiveness, usability are factual outcomes, even if gut flags them).
      *   **S3 (Objectivity): NO** (It's an unarticulated gut feeling).
      *   **S5 (Past Reliability):** Likely **HIGH** (Experienced OR nurse on surgical devices).
      *   **S6 (Group Mood):** Likely **YES** (Enthusiasm feels contagious wave vs. addressing the gut feeling).
      *   **--> STOP & ESCALATE.** **Your Move:** Surface the Hidden + Request Delay. "Janet, you mentioned it 'felt wrong' earlier, and I value your experience on the floor. Could you elaborate just a bit more on what feels off? Even if it's just a hunch? ... Thanks. Given Janet's concern, even if she can't pin it down yet, and how critical positioning safety is, could we table this for a week? Maybe Janet and one other OR nurse could do a quick hands-on demo with it and report back specific likes/dislikes?" (Protects the nurse, validates gut, gets concrete feedback).

  **What This Procedure CAN'T Do (Limitations & How Not to Become "That Person"):**

  1.  **Pure Value Judgments with No Core Violation:** If the group overwhelmingly prefers spending on tech over staff, and it doesn't violate an *explicit* core value (like "staff safety paramount"), the procedure (Step 4) will tell you to defer. You can't fight every value preference. *Mitigation:* Work *between* meetings to establish clearer shared values/principles for the committee.
  2.  **True Emergencies / Extreme Time Pressure:** The procedure needs minutes to think. In a crisis, deferring to group confidence might be necessary, even with doubts. *Mitigation:* Acknowledge the limitation. If possible, note the dissent formally for later review.
  3.  **When *You* Are the Outlier with Low Reliability:** If your track record is poor on the issue type, Step 5 will tell you to defer even with a signal. *Mitigation:* Build your reliability on specific areas through good prep and data between meetings.
  4.  **Complex Interdependencies:** Decisions impacting multiple complex systems might need deeper analysis than this quick check. *Mitigation:* Use the "escalate" move to call for a focused subcommittee review *before* a final vote if you sense this complexity.
  5.  **Malicious Actors / Hidden Agendas:** This assumes good faith. It won't detect someone deliberately misleading. *Mitigation:* Focus on data and track records (Step 5).
  6.  **Preventing Cascades Altogether:** This helps *you* decide when to intervene, not prevent the group dynamic. *Mitigation:* Suggest procedural changes *to the chair* between meetings (e.g., silent brainstorming first, round-robin initial opinions).

  **How Not to Become "That Person":**
  *   **Use "Escalate" Sparingly:** Only when you clear multiple hurdles (Strong Signal, Right Decision Type, Objectivity/Values Check, Low Reliability/Group Mood issue). Most times, you'll STOP & DEFER early.
  *   **Escalate Constructively:** Frame it as ensuring a *better* decision, not blocking. Use "I" statements and focus on *specific* data/values. Offer solutions (delay, subcommittee, specific check).
  *   **Pick Your Battles:** Focus escalation on high-impact decisions (safety, major cost, core values) where your signal is strongest.
  *   **Build Trust:** When you *do* escalate and are proven right (e.g., IV pump data), do it professionally. When you defer, support the decision fully. This builds credibility for when you *do* need to escalate.
  *   **Know When to Fold:** If you escalate professionally and the group still votes against you after discussion, accept it gracefully. You've done your duty by surfacing the concern.

  This procedure gives you a structured, rapid way to navigate the social and informational complexities of your committee, helping you decide when your voice is truly needed and providing concrete moves when it is. It respects your time, role, and the realities of group dynamics.
