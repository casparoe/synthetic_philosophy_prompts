answer: |-
  ## Dissertation Prospectus: Cyclic Justification in Scanlonian Contractualism: A Structural Analysis of Aggregation Rejection  
  **(Six-Month Project Plan)**

  **1. Research Question & Novel Framing**  
  This project investigates whether T.M. Scanlon’s contractualist rejection of aggregative moral reasoning, particularly concerning harming one to save many, is most fundamentally explained not by the denial of moral weight to numbers *per se*, but by an underlying structural feature of his model of interpersonal justification: its susceptibility to Condorcet-style cyclic preferences. The precise research question is:

  *   **Does reconstructing Scanlonian justification (as presented in *What We Owe to Each Other*) as a process of pairwise comparisons between individuals’ standpoints inevitably generate cycles in the ranking of principles, thereby preventing the identification of a globally justifiable principle even in simple aggregation cases, and is this structural feature the deeper root of his rejection of summation?**

  This framing shifts the focus decisively from the **quantitative debate** (e.g., does the number five possess more intrinsic moral weight than the number one in a rescue scenario?) dominant in responses by Parfit, Norcross, Otsuka, Frick, and others, to a **structural debate**. It asks whether the *very logic of justification to each person*, understood dyadically, creates an ordering problem akin to voting paradoxes, regardless of whether numbers are assigned "weight" in some other sense.

  **2. Gap in Existing Literature**  
  Existing critiques and defenses of Scanlon’s anti-aggregation stance predominantly engage the quantitative question:

  *   Defenders (like Scanlon himself, Kumar, Reibetanz) argue that justification requires principles no one could reasonably reject *given their own burden*, making direct comparison/counting across distinct individuals' burdens illegitimate.
  *   Critics (like Parfit, Norcross, Otsuka) argue that reasonable rejectability *must* implicitly account for numbers, often proposing modifications to incorporate aggregation or threshold effects.
  *   Sophisticated analyses (e.g., Frick on ex ante/ex post perspectives) explore *how* numbers might factor into reasonable rejectability without explicit summation.

  **However, this literature largely presupposes a transitive structure:** that if Principle P is less rejectable than Q for A, and less rejectable than Q for B, and so on for all individuals, then P is globally less rejectable than Q. It treats pairwise comparisons as building blocks for a global ordering. **The critical gap is the failure to rigorously examine whether Scanlon’s model *allows* for a coherent global ordering at all, given its foundation in pairwise justifiability.** Does the requirement that a principle be justifiable *to each* person, assessed pairwise against alternatives, inherently permit cyclical rankings (P > Q > R > P) where no single principle is non-rejectable by all compared to every alternative? Existing treatments do not systematically pursue this structural possibility as the core explanation for aggregation problems.

  **3. Methodology & Timeline**  
  The project employs two complementary methods:

  *   **Conceptual Exegesis:** Close reading and analysis of key arguments in Scanlon’s *What We Owe to Each Other* (1998), focusing on:
      *   The definition of reasonable rejectability (Ch. 5).
      *   The rejection of aggregation (Ch. 5, Sect. 6.3, "Preventing Harm").
      *   The nature of "justification to" an individual standpoint.
      *   Implicit assumptions about the relationship between pairwise comparisons and overall justification.
  *   **Formal Modeling:** Mapping the structure of justification relations using **tournament graph theory**. Principles are nodes. A directed edge (P -> Q) signifies that P is pairwise justifiable over Q (i.e., no individual can reasonably reject P over Q *specifically when comparing only these two*). Cycles (P->Q->R->P) become explicit structural features. This modeling will:
      *   Represent Scanlon's paradigmatic "harm one/save many" cases.
      *   Explore whether cycles emerge under plausible interpretations of reasonable rejectability.
      *   Investigate properties of tournament graphs (e.g., Condorcet winners/losers, cycle decompositions) to diagnose the aggregation problem structurally.

  **Crucially, the project *does not* require developing novel mathematical proofs.** It leverages established graph-theoretic concepts and results to illuminate the philosophical structure, translating Scanlonian concepts into the formal framework and interpreting the output philosophically.

  **Month-by-Month Timeline:**

  *   **Month 1:** Deep dive into *WWOTEO* Ch. 5 & relevant aggregation sections. Initial formulation of pairwise justification interpretation. Identify core aggregation cases for modeling.
  *   **Month 2:** Develop formal schema: Define nodes (principles), edges (pairwise justifiability), define "reasonable rejectability in pairwise comparison" operationally for the model. Initial mapping of 1-2 core cases.
  *   **Month 3:** Comprehensive formal mapping of key Scanlonian aggregation scenarios (e.g., standard rescue case, variations with differing burdens/benefits). Identify presence/absence of cycles.
  *   **Month 4:** Conceptual analysis of mapping results. Does Scanlon’s text support the pairwise interpretation? Do cycles explain his conclusions? Compare with standard quantitative readings.
  *   **Month 5:** Explore philosophical implications: If cycles exist, can contractualism resolve them? (e.g., via agenda-setting, domain restrictions, accepting indeterminacy). If not, does this undermine the model?
  *   **Month 6:** Synthesis and drafting. Refine the structural argument. Articulate conclusions on the root cause of aggregation rejection. Finalize prospectus into dissertation chapters.

  **4. Success Criteria & Failure Conditions**

  *   **Successful Result:** The project succeeds if it achieves one of two outcomes:
      1.  **Resolution Path:** Demonstrates that the pairwise reconstruction robustly generates cycles in aggregation cases *and* identifies a conceptually coherent, textually plausible method within Scanlon’s framework (or a minimal, consistent extension) to resolve or accommodate these cycles (e.g., a non-arbitrary way to select a principle despite cycles, or embracing justificatory indeterminacy).
      2.  **Diagnostic Path:** Demonstrates that the pairwise reconstruction robustly generates cycles *and* that Scanlon’s framework lacks the resources to resolve them without collapsing into problematic aggregation or violating core contractualist tenets, thereby providing a novel, structural diagnosis of the *depth* of the aggregation problem as a fundamental ordering paradox.
  *   **Failure Conditions:** The project would fail to achieve its core aim if:
      1.  **Collapse into Standard Framing:** The pairwise reconstruction proves indistinguishable from standard quantitative treatments of aggregation/rejectability weights in its implications, offering no genuine structural insight.
      2.  **Conceptual Incoherence:** The operationalization of "pairwise justifiability" proves inherently inconsistent with Scanlon’s core notion of "justification to" or reasonable rejectability, rendering the reconstruction invalid.
      3.  **No Cycles/Triviality:** Formal mapping demonstrates that cycles either never arise in relevant cases under plausible interpretations, or arise only trivially without illuminating the core aggregation problem.

  **5. Scope Assessment & Risks**  
  This six-month prospectus project focuses on establishing the *plausibility and potential* of the structural framing through conceptual analysis and illustrative formal modeling. Key scope limitations and risks include:

  *   **Depth vs. Breadth:** The analysis will concentrate on core aggregation scenarios central to Scanlon’s argument. Broader applications of the cyclic justification model (e.g., to distributive justice, promises) are noted for future dissertation work but not explored deeply here.
  *   **Formal Complexity Risk:** While leveraging established mathematics, translating nuanced philosophical concepts (reasonableness, burdens, standpoints) into graph relations carries inherent risk. The mapping must remain philosophically grounded; the project risks "formalization for its own sake" if the graph model becomes detached from Scanlon’s ethical framework. Constant conceptual cross-checking is essential.
  *   **Limited Resolution Exploration:** Month 5 explores resolution strategies, but comprehensively developing and defending a novel resolution mechanism likely exceeds the scope. Success Path 2 (diagnosis) is a more achievable goal within six months than Success Path 1 (robust resolution).
  *   **Philosophical Payoff Risk:** The primary risk is that the formal mapping, while technically sound, yields philosophically banal or unsurprising results, failing to provide significant new insight beyond the existing quantitative debate. Mitigation lies in rigorous conceptual analysis ensuring the model captures the unique structure of "justification to."
  *   **Scanlon-Centric Focus:** The project primarily engages Scanlon’s 1998 text. Engagement with later refinements by Scanlon or others will be noted but not central, as the core structural argument hinges on the foundational model in *WWOTEO*.

  **Conclusion:**  
  This prospectus proposes a novel structural lens on a central debate in Scanlonian contractualism. By rigorously examining whether the dyadic logic of "justification to" generates Condorcet cycles, it seeks to uncover a deeper, non-quantitative explanation for the rejection of aggregation and assess the fundamental coherence of the contractualist justificatory procedure. The combined methodology of close reading and controlled formal modeling aims to yield a fresh perspective with significant implications for understanding the foundations of moral reasoning concerning conflicting claims.
