prompt: |-
  Before I evaluate competing accounts of whether and how collective guilt can be transmitted across generations, I want the full specification of what such a theory must deliver. Write the desiderata for an adequate theory of transgenerational national guilt—specifically, one that engages Karl Jaspers’s distinction between criminal, political, moral, and metaphysical guilt but applies it to cases where the original perpetrators and direct victims are both dead, and where the harm was structural rather than a discrete atrocity (for example, long-term economic extraction or environmental degradation that accumulated over centuries). For each desideratum, give the motivating case or conceptual pressure: which distinctions it must preserve (e.g., between inheriting liability and inheriting a duty to repair, or between collective and distributed individual guilt), which phenomena it must explain (e.g., why present citizens might feel appropriate shame without being personally blameworthy), and which results it must remain consistent with (e.g., the principle that moral responsibility requires some form of agency or identification). Flag any pair of desiderata you think are in tension or jointly unsatisfiable—especially if one requires continuity of a collective agent across generations and another requires that only agents with present-tense moral capacities can bear guilt. Finally, indicate briefly how Jaspers’s own fourfold taxonomy fares against the list, without turning this into a full survey of the literature. Keep the focus on the criteria themselves: I want to know what we are asking the theory to do before I compare candidates.
reasoning: |-
  Okay, the user is asking for a clear set of criteria—desiderata—that any theory of transgenerational national guilt must satisfy. They specifically want this framework to engage with Karl Jaspers's four types of guilt but apply to cases where both perpetrators and victims are dead, and the harm is structural (like long-term economic extraction or environmental damage).  

  First, I need to unpack the user's unspoken needs. They're likely a scholar or advanced student in philosophy/political theory, preparing to evaluate existing theories. Their emphasis on "full specification before comparison" suggests they value systematic rigor. The structural harm angle hints they're dissatisfied with atrocity-focused models. Deeper needs: avoiding anachronistic moralizing, reconciling collective responsibility with individual fairness, and navigating tensions (e.g., guilt without agency).  

  Now, structuring the desiderata. I'll group them by function:  
  - **Foundation**: Core principles the theory must uphold (e.g., no guilt without agency link).  
  - **Scope**: Handling structural harm and dead actors/victims.  
  - **Distinctions**: Clarifying liability vs. duty, collective vs. individual.  
  - **Phenomena**: Explaining emotions like appropriate shame.  
  - **Constraints**: Practical limits (e.g., no infinite regress).  

  Key tensions to flag:  
  1. *Collective continuity vs. present agency*: If guilt requires a persisting collective agent, how does it bind new members? Jaspers' moral/metaphysical guilt leans on individual identification—but that's unstable across generations.  
  2. *Structural harm vs. assigning guilt*: Systemic wrongs lack clear perpetrators. The theory must assign guilt without flattening complexity.  

  For each desideratum, I'll:  
  - State it clearly.  
  - Give a concrete case (e.g., colonial resource extraction).  
  - Note its purpose (e.g., preserving moral agency).  

  Jaspers' taxonomy fares unevenly:  
  - *Criminal guilt* fails—dead perpetrators.  
  - *Political guilt* adapts best (inherited obligations), but risks conflating liability/duty.  
  - *Moral guilt* struggles without direct identification.  
  - *Metaphysical guilt* could ground shame but is vague for repair duties.  

  Finally, I'll stress that no theory will ace all desiderata—the user needs to see trade-offs upfront. The list should empower them to dissect candidates systematically.
answer: |-
  Here is a comprehensive specification of desiderata for an adequate theory of transgenerational national guilt addressing structural harms (e.g., colonialism, extractive institutions) after the deaths of direct perpetrators/victims, grounded in Jaspers' framework but extending beyond it. Each includes a motivating case, conceptual pressure, or required distinction.

  ### **Core Desiderata**
  1. **Non-Retroactive Moral Agency**  
     *Requirement:* The theory must not attribute *personal blameworthiness* to present individuals for ancestors' actions.  
     *Motivation:* Upholds the principle that moral responsibility requires agency (e.g., descendants aren’t "culpable" for ancestral slavery).  
     *Key Distinction:* Separates *inherited duties* (e.g., repair) from *inherited liability* (blame).  
     *Jaspers’ Link:* Criminal guilt (individual culpability) expires with the perpetrators.

  2. **Collective Continuity Without Metaphysical Inflation**  
     *Requirement:* Explain how the *nation* persists as a moral agent across generations despite membership flux.  
     *Motivation:* Accounts for obligations tied to enduring institutions (e.g., a state benefiting from historical land theft).  
     *Conceptual Pressure:* Avoid reifying the nation as a supernatural entity. Must clarify if continuity is institutional, cultural, or normative.  
     *Jaspers’ Link:* Political guilt (collective liability) but needs extension to intergenerational collectives.

  3. **Structural Harm Accounting**  
     *Requirement:* Address harms not reducible to discrete acts (e.g., centuries of wealth extraction depleting a colonized region’s resources).  
     *Motivation:* Many injustices (e.g., climate damage from industrialization) are systemic and cumulative.  
     *Phenomenon:* Explains why beneficiaries of unjust structures (e.g., citizens in extractive economies) bear duties even if no atrocity occurred.  
     *Jaspers’ Gap:* Focused on atrocities; structural harms need new tools.

  4. **Appropriate Emotions Without False Blame**  
     *Requirement:* Explain why descendants might *appropriately* feel guilt/shame without being blameworthy.  
     *Motivation:* Empirical observation (e.g., German youth feeling shame for Nazism).  
     *Distinction:* Separates *moral shame* (awareness of tainted legacy) from *moral blame*.  
     *Jaspers’ Link:* Moral/metaphysical guilt—but these rely on personal identification with the collective.

  5. **Duty-Bearing Without Identity Causality**  
     *Requirement:* Ground duties to repair (e.g., restitution for slavery) without claiming descendants "caused" harm.  
     *Motivation:* Reparations claims (e.g., for colonial resource theft) presuppose obligations despite temporal distance.  
     *Key Distinction:* Inheriting *obligations* (via citizenship/benefit) vs. inheriting *perpetration*.  
     *Jaspers’ Gap:* Political guilt implies obligations but doesn’t resolve intergenerational transfer.

  6. **Victim Legacy Recognition**  
     *Requirement:* Acknowledge present victims of *ongoing* harm legacies (e.g., intergenerational poverty from discriminatory laws).  
     *Motivation:* Structural harms (e.g., redlining) create present-day inequity.  
     *Constraint:* Avoid reducing victims to historical abstractions; show how harm persists institutionally.

  ---

  ### **Critical Tensions in Desiderata**  
  - **Tension 1: Collective Continuity vs. Present Moral Agency**  
    - *Desideratum 2* requires collective persistence to bind descendants.  
    - *Desideratum 1/4* demand that only present agents bear guilt/shame, resisting "blood guilt."  
    - *Conflict:* If the collective is a continuous agent, does guilt "transfer" automatically? This risks violating agency.  

  - **Tension 2: Structural Harm vs. Assigning Guilt**  
    - *Desideratum 3* insists on addressing diffuse, institutional harm.  
    - *Desideratum 1/5* reject guilt without agency.  
    - *Conflict:* Structural harms lack individual perpetrators. Can collective *guilt* apply here, or only obligations?  

  ---

  ### **Jaspers’ Taxonomy Against the Desiderata**  
  - **Criminal Guilt:** Fails *all* desiderata—expires with perpetrators and can’t address structural harms.  
  - **Political Guilt:** Best meets *Desideratum 5* (duty-bearing) but struggles with *2* (intergenerational continuity) and *3* (structural harms). Over-extended risks conflating duties with guilt.  
  - **Moral Guilt:** Addresses *Desideratum 4* (shame) but requires personal identification—unstable across generations (*Tension 1*).  
  - **Metaphysical Guilt:** Explains solidarity-based duties (*Desideratum 5*) but is too vague for institutional repair (*Desideratum 3*) and risks undermining agency (*Desideratum 1*).  

  ### **Conclusion**  
  An adequate theory must navigate these tensions while:  
  - Preserving individual moral agency,  
  - Explaining collective endurance,  
  - Grounding duties for structural harms, and  
  - Legitimizing emotions like shame without blame.  
  Jaspers provides a foundation but requires significant augmentation for structural, intergenerational cases—particularly in reconciling political duties with metaphysical guilt’s emotional dimensions. The core challenge is whether "guilt" applies intergenerationally (*Desideratum 4*) or if duties arise from non-guilt sources (e.g., unjust enrichment, associative obligations).
