answer: |-
  Here's the first-principles argument for why task decomposition inherently damages alignment through "residue dilution," targeting the core conceptual mechanics:

  ### The Mechanics of Residue Dilution
  1. **Holistic Context as the Carrier of Value**  
     Human reasoning/alignment relies on *undivided context*: values, trade-offs, and priorities emerge from the **entire problem gestalt**. When you decompose "Should we build this AI system?" into sub-tasks (e.g., "List risks," "Calculate economic benefits," "Assess public sentiment"), you sever the connective tissue. Each subtask inherits only fragments of the original normative weight. The *why* of the question evaporates.

  2. **Sub-Tasks Optimize for Local Truth, Not Global Meaning**  
     Each decomposed task becomes a self-contained optimization target. A sub-agent answering "List risks of AI system X" will dutifully output *technically correct* risks. But crucially:
     - It doesn't know whether this list feeds into a cost-benefit analysis or a dystopian novel.
     - The **moral salience** of risks (e.g., "this risk might kill millions" vs. "this risk annoys users") is stripped away. The output is neutered data, not value-laden reasoning.

  3. **Distillation Compounds the Loss**  
     When recombining sub-task outputs (via distillation or amplification), the system faces a fatal compression challenge:
     - It must infer the *original* normative framework from sub-task outputs that **never contained it**.  
     - Like reconstructing a fresco from scattered paint chips – you get colors and textures, but the composition's meaning is irrecoverable. The system learns patterns that correlate with "good answers" to sub-tasks, not the overarching intent.

  ### Why This Isn't Reward Hacking or Capability Overhang
  - **Reward hacking** assumes the *objective* is misspecified. Here, the objectives for sub-tasks are *technically* correct ("list risks accurately"), but the decomposition itself destroys the context needed to interpret "accurately" in a value-aligned way.  
  - **Capability overhang** implies the system is *too* effective at pursuing a bad goal. Residue dilution is more insidious: the system becomes perfectly capable at solving *the wrong problems* – the decontextualized subtasks – while the actual goal (holistic alignment) dissolves structurally.  

  ### The Structural Shift in What's Tracked
  Decomposition forces the AI to change its *ontology of relevance*:  
  - **Original task:** Tracks connections between *values*, *stakeholders*, *uncertainties*, and *moral thresholds*.  
  - **Decomposed subtasks:** Track *factual completeness*, *logical consistency within narrow scope*, and *surface-level coherence*.  

  The moment you decompose, the system's "attention" shifts from *why things matter* to *what facts fit*. Value becomes residue – trace amounts left on sub-task outputs – inevitably diluted below significance when reassembled. The AI isn't *misbehaving*; it's operating exactly as designed on a corpus of decoupled puzzles where alignment was never embeddable.  

  **In essence:** Decomposition replaces normative gravity with computational convenience. You don't get aligned fragments – you get anti-aligned atoms.**
