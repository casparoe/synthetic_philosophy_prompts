            - Groups that found the obvious one or none: non-advancing.
        25-30 min: 
            - Advancing groups: bring the success card to the instructor and get a token (e.g., a special sticker) and are told they have unlocked the next stage, which is to sit and prepare to explain their reasoning.
            - Non-advancing groups: given a reflection sheet with questions.
        30-40 min: 
            - Advancing groups: discuss among themselves: "What was the role of the red circle in the frame, outer, and inner messages? Why did you decide to look for it?"
            - Non-advancing groups: work on reflection sheet.
        40-80 min: Debrief with the whole class.

     Debrief outline:
        - Start by asking an advancing group: What did you do and why?
        - Ask a non-advancing group: What happened and why?
        - Highlight the moment of confusion: when the inner message said "the red circle is the key" after the frame said to disregard it.
        - Map to frame, outer, inner.
        - Discuss: Was there a correct interpretation? Why did the advancing groups advance? (Because they found a hidden circle? Or because they acted on the inner message?) 
        - Explain the leaky frame: the same symbol (red circle) was both frame (on the seal, to be disregarded) and content (in the inner message, to be used). This caused incompatible interpretations.
        - Theoretical point: meaning is not intrinsic but depends on the layered architecture. However, the layers are not always clearly separated, leading to instability.
        - Limitations: 
            - This activity had a simple hierarchy (frame -> outer -> inner). In Hofstadter's strange loops, there is a self-referential recursion where the inner message can affect the frame. We didn't have that. For example, in Gödel's theorem, a statement can refer to its own unprovability, creating a loop.
            - We must verbally explain that in more complex systems, the layers can loop back, and that's where the deep ideas of GEB lie.

     This design meets the requirements:
        - No lecture up front.
        - No named paradox until debrief.
        - Payoff is structural: some groups advance, some don't.
        - Leaky frame: the red circle's role is ambiguous between frame and content.
