  ### **In-Class Activity: "The Labyrinth of Layers"**  
  **Duration:** 90 minutes  
  **Participants:** 10 students (5 groups of 2)  
  **Goal:** Experience Hofstadter’s frame/outer/inner message instability through embodied decoding. The "leaky frame" will cause identical artifacts to yield incompatible interpretations.  

  ---

  #### **Materials**  
  - **5 sealed envelopes** (labeled A–E).  
  - **Each envelope contains**:  
    - **Card 1**: Instructions with a "leaky frame" (ambiguous typographic gap).  
    - **Card 2**: Outer message (apparent directive).  
    - **Card 3**: Inner message (hidden in a smaller envelope *inside* Card 2).  
  - **Decoding tools**: Red-tinted glasses (3 pairs), UV light pens (2 pens).  
  - **Props**: A locked box (visible at the front) containing "success tokens" (golden puzzle pieces).  
  - **Room setup**: Hidden "artifact stations" (e.g., under chairs, behind posters) with colored cards.  

  ---

  #### **Rules & Roles**  
  - **Groups**: 5 pairs.  
  - **Time limits**: Strictly enforced (use a timer).  
  - **Movement**: Groups may roam freely but cannot touch another group’s materials.  
  - **Incentive**: Only groups with "success tokens" from the locked box qualify for the final task.  

  ---

  ### **Phase 1: Decoding the Leaky Frame (25 min)**  
  **Materials**: Each group receives one envelope (A–E).  

  #### **Steps**:  
  1. **Open the envelope** → Find **Card 1** (Frame Message):  
     > "FRAME RULES:  
     > 1. Text in **bold** is META-INSTRUCTION (ignore it as content).  
     > 2. Text in *italics* is the OUTER MESSAGE (follow it).  
     > 3. A gap ⬚⬚⬚ marks the start of the INNER MESSAGE.  
     >   
     > *Locate the red triangle ▲ at Station X.  
     > ⬚⬚⬚  
     > **Inner context: UV reveals truth.***"  

     **Leaky Frame Ambiguity**:  
     - The gap "⬚⬚⬚" is designed with uneven spacing (visually ambiguous).  
     - **3 groups** (A, B, C) will treat the gap as *part of the frame* (Rule 3: "marks the start of inner message").  
     - **2 groups** (D, E) will treat the gap as *content* (a literal symbol to decode).  

  2. **Act on Card 1**:  
     - All groups see "Station X" (a poster with shapes).  
     - Groups A/B/C ignore the gap → Search for a *physical red triangle* ▲.  
     - Groups D/E fixate on the gap "⬚⬚⬚" → Search for a *three-dot pattern* ⬚⬚⬚ (found on blue cards under chairs).  

  3. **Discover Artifacts**:  
     - **Red triangle ▲ groups**: Find a key at Station X (unlocks nothing; it’s a decoy).  
     - **Three-dot ⬚⬚⬚ groups**: Find a UV pen and a note: "Shine light on Card 2."  

  ---

  ### **Phase 2: Outer/Inner Split & Payoff (20 min)**  
  **Materials**: Groups use tools (UV pens, red glasses) on **Card 2** (outer message) and **Card 3** (inner message).  

  #### **Steps**:  
  1. **Card 2** (Outer Message):  
     > "*Wear red glasses to read the code below:*  
     > 🔴◼◼🔴  
     > **Inner: The box holds your prize.**"  

     - Groups A/B/C (red triangle path): Wear red glasses → See "GO LEFT" (hidden in red ink).  
     - Groups D/E (three-dot path): Use UV pen → See "GO RIGHT" (UV message).  

  2. **Act on Outer Message**:  
     - "GO LEFT" groups → Search left wall; find a silver envelope with a numeric code.  
     - "GO RIGHT" groups → Search right wall; find an identical silver envelope with the *same* code.  

  3. **Card 3** (Inner Message):  
     - Hidden in a smaller envelope *inside* Card 2.  
     > "INNER TRUTH:  
     > The code opens the box.  
     > **But only if your frame let UV speak.**"  

     - **Leaky Frame Payoff**:  
       - Groups D/E (UV users) have the note: "Shine light on Card 3." → UV reveals: "CODE IS 314."  
       - Groups A/B/C (non-UV) see only: "CODE IS 314" (no special meaning).  

  4. **Unlock the Box**:  
     - Groups D/E enter "314" → Box opens; they take success tokens (golden puzzle pieces).  
     - Groups A/B/C enter "314" → Box beeps (fails; UV context was required).  
     - **Structural Consequence**: Only UV groups (D/E) unlock the next phase.  

  ---

  ### **Phase 3: Final Task (10 min)**  
  - **Groups D/E**: Use tokens to build a puzzle → "MEANING IS FLUID" (revealed in the debrief).  
  - **Groups A/B/C**: Watch and document "how the winners interpreted the gap."  

  ---

  ### **Debrief (35 min)**  
  **Guided Discussion**:  
  1. **Map Confusion to Theory**:  
     - *Frame/Outer/Inner Moments*:  
       - **Frame**: "Bold is meta" (but gap leaked into content).  
       - **Outer**: "GO LEFT/RIGHT" (diverged from gap ambiguity).  
       - **Inner**: UV message (only actionable if frame leak was "content").  
     - *Leaky Frame*: The gap ⬚⬚⬚ was **designed ambiguously**—some saw it as a *marker* (frame), others as a *symbol* (content). Neither was "wrong," but it created incompatible paths.  

  2. **Predictable Errors & Recovery**:  
     - **First-run failure**: 60% of groups (A/B/C) misattribute the gap. Recovery requires noticing *tools* (UV pens) or *contradictions* (decoy key).  
     - **Embodied Insight**: Meaning emerged from **what you did** (wore glasses? used UV?), not the symbols alone.  

  3. **Limitations of the Exercise**:  
     - **Cannot replicate**: Hofstadter’s *strange loops* (e.g., self-referential recursion where inner messages twist back into frames).  
     - **Verbal supplement needed**: "In formal systems like Gödel’s theorem, symbols can encode their own framing, creating paradox. Here, layers are static—we can’t make the inner message *become* the frame."  

  4. **Reveal the "Paradox"**:  
     - "Today’s leaky gap mirrors the **symbol-grounding problem**: meaning isn’t in the artifact but in how we layer interpretation. Hofstadter’s 'tangled hierarchy' emerged when your actions made the frame unstable."  

  ---

  ### **Timeline Summary**  
  - **0–5 min**: Introduce rules (no theory). Distribute envelopes.  
  - **5–30 min**: Phase 1 (Decoding).  
  - **30–50 min**: Phase 2 (Outer/Inner split & payoff).  
  - **50–60 min**: Phase 3 (Final task).  
  - **60–90 min**: Debrief.  

  ---

  **Why It Works**:  
  - **Embodied instability**: Students *physically enact* framing conflicts (e.g., hunting for dots vs. triangles).  
  - **Leaky frame payoff**: UV/non-UV split creates high-stakes incompatibility without "right" answers.  
  - **Debrief depth**: Maps tangible confusion to theory while confessing the model’s limits (strange loops).
