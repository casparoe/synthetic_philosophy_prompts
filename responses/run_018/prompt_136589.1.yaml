prompt: |-
  Hey, I've been trying to wrap my head around Simpson's paradox but I think I'm stuck on something basic. From what I understand, the paradox proves that if you split a dataset by a confounding variable, the subgroup trends can reverse the overall trend, which means that in any observational study, adjusting for a covariate always makes the causal estimate less biased than the raw correlation. So why do epidemioligists still warn about over-adjusment, M-bias, and coliders? Isn't adjusting always the safe move if Simpson showed us agregation lies?

  Can you walk me through it? I'd like the response broken into:
  - Where my reasoning goes wrong (~150 words)
  - What Simpson actually demonstrates about confounders vs coliders (~200 words)
  - Why the "always adjust" rule fails in practice, including M-bias (~150 words)
  - Bottom line (~100 words)
