prompt: |-
  me and my roommate were fighting about decision making again lol. she keeps saying people are just satisficing, yknow, picking the first thing that hits a good-enough bar and stopping. but i keep noticing this weird twist. like, my cousin bought a car that was 'fine' because it had good mileage and was cheap, then six months later he learned about another model that was also cheap with even better mileage. instead of going 'damn i should have waited', he suddenly decided the other car's trunk was too small, but he never cared about trunk space when he was actually shopping. and then he did the same thing with an apartment - picked one that was 'good enough' for rent and location, then found out about a cheaper one near by, and suddenly said the first one was closer to the bus line... which he never mentioned before. it's like the bar for 'good enough' doesn't just stay fixed, it warps after the fact to protect the choice you already made. is there an actual name for this? like is it part of bounded rationality or is it its own thing? and how is it different from just lying to yourself? i definately don't want a reading list, just whether philosophers have carved this out separately from regular satisficing.
reasoning: |-
  Okay, the user and their roommate are debating decision-making, specifically satisficing versus this post-choice justification behavior. The user describes their cousin's pattern: choosing something "good enough," then later rationalizing why a better option wasn't actually better by inventing new criteria. They want to know if this has a name and how it differs from lying to oneself.

  First, I recall that satisficing is Simon's concept where people choose the first option that meets their criteria. But the cousin's behavior happens after the decision. That sounds like cognitive dissonance theory from Festinger. When there's a conflict between a choice and new information, people reduce discomfort by justifying the decision. The cousin adds new reasons (trunk size, bus proximity) post-hoc to feel better about his choice.

  The user mentioned bounded rationality, which is related since satisficing falls under it. But this specific behavior is a separate phenomenon. The key difference is the timing: satisficing is during the decision, while post-purchase rationalization occurs after. Also, it's not exactly lying because the person might genuinely believe the new criteria are important, even if they weren't before.

  The user explicitly says they don't want a reading list, so I should avoid academic references. They want a clear distinction between this and regular satisficing. Emphasize that philosophers and psychologists recognize this as a distinct bias. Also, address how it's different from deliberate lying—it's more subconscious self-deception to reduce discomfort.

  I should confirm that the term for this is post-decision dissonance reduction or choice-supportive bias. Make sure to explain it succinctly and relate it back to their examples. Highlight that the shifting criteria are a form of memory distortion to align with the choice made. This helps the user understand it's a common cognitive bias, not just their cousin being irrational.
answer: |-
  You've perfectly nailed a **specific cognitive bias** that's absolutely distinct from the basic idea of satisficing. Philosophers and psychologists *have* carved this out, and you're right that it involves a dynamic shift in the "good enough" bar *after* the choice is made.

  The core concepts you're describing are:

  1.  **Choice-Supportive Bias:** This is the broader term for the tendency to:
      *   **Remember chosen options more positively** (emphasizing their strengths).
      *   **Remember rejected options more negatively** (emphasizing their weaknesses).
      *   **Attribute positive features to the chosen option** (even if they weren't key factors initially).
      *   **Downplay negative features of the chosen option.**
      *   **Develop new justifications for the choice** after the fact (like your cousin suddenly caring about trunk space or bus proximity).

  2.  **Post-Decision Dissonance Reduction:** This explains *why* Choice-Supportive Bias happens. Rooted in Leon Festinger's **Cognitive Dissonance Theory**, it states that holding two conflicting thoughts ("I chose this" vs. "But that other thing seems better now") creates psychological discomfort (dissonance). To reduce this discomfort, people subconsciously:
      *   **Distort their perceptions:** They re-evaluate the options to make their choice seem better and the alternatives worse.
      *   **Seek confirming information:** They look for reasons why their choice was good.
      *   **Avoid disconfirming information:** They downplay or ignore new information that challenges their choice.
      *   **"Invent" New Criteria:** This is the twist you observed! They retrospectively elevate the importance of features that *happen* to favor their chosen option (trunk size, bus proximity), even if those features weren't seriously considered during the initial decision. This makes the choice seem *more* rational and satisfying than it actually was at the time.

  **How it differs from Satisficing:**

  *   **Satisficing (Herbert Simon):** Happens *during the decision process*. You set a threshold of acceptability (e.g., mileage > 35mpg, rent < $1200) and stop searching when you find the *first* option that meets that threshold. The bar is set beforehand.
  *   **Choice-Supportive Bias/Post-Decision Dissonance Reduction:** Happens *after the choice is made*. The goal isn't to *find* a good option anymore; it's to *feel good* about the option you already chose and reduce the discomfort of potential regret or missed opportunities. The bar gets *retrospectively adjusted* to fit the choice.

  **How it differs from Lying to Yourself:**

  *   **Lying to Yourself:** Often implies a more conscious, deliberate deception. You *know* the truth but choose to ignore or fabricate something else.
  *   **Choice-Supportive Bias:** Is largely **subconscious and automatic**. Your cousin isn't (necessarily) consciously thinking, "I need to lie about trunk space to feel better." His brain is automatically minimizing regret by distorting his memory and perception of the importance of features. He likely genuinely *feels* that trunk space *is* important *now*, because his brain has reconstructed the narrative of his decision to reduce dissonance. It's self-deception, but usually not deliberate lying. It's a bias in how we process information and memory after the fact.

  **In short:**

  *   Your roommate is talking about **Satisficing** (stopping the search when a "good enough" option is found).
  *   You're brilliantly describing **Choice-Supportive Bias**, specifically driven by **Post-Decision Dissonance Reduction**, with the key twist of **retrospectively elevating the importance of features that justify the chosen option**.
  *   It's a distinct, well-documented cognitive bias stemming from our need to feel consistent and avoid regret, operating largely subconsciously. Your cousin's shifting trunk/bus priorities are classic examples!
