prompt: |-
  I was arguing with a friend about Dennett's counterfeit people idea—basically entities that pass every behavioral and functional test for being people but allegedly lack some inner light, except Dennett probably thinks there's no missing ingredient, right? Anyway I'm trying to build a decision tree for my local rationalist meatup (we do philosophy of mind every other thursday) that sorts where people actually land when they apply this framework to LLMs. I don't want another "is ChatGPT conscious" poll.

  I want the branches to ask whether Dennett's functionalist criteria are sufficient on their own, or whether you're smuggling in a hidden evolutionary or biological condition he rejects. Then I want an injected edge case: the "Zimbo-LLM hybrid"—a system with full second-order belief architectures about its own processing states, but trained purely on predictive text with zero embodied interaction or evolutionary history. The tree should include concrete nodes like "would you classify this hybrid as counterfeit, genuine, or taxonomy-breaking?" and map answers onto named positions: the Dennett-style "functional architecture is enough" view, the hidden-biological-essentialist view, the pure-architectural-sufficiency camp, and whatever you call the position that says the hybrid breaks the binary entirely. Flag any pair of leaves your tree can't actually separate—say if two views both call it counterfeit but for opposite reasons. And call out empty combinations, especially the one where counterfeit status is binary but evolutionary origin is totally irrelevant; I think that's unoccupied and maybe incoherent, but I want it noted. Keep it around 6-8 leaves, don't ask for citations or reading lists, and phrase every branch so someone can answer it without already knowing the philosophy labels in advance.
