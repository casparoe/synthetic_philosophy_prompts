  **Joint Statement: Adversarial Collaboration on Calibrated-Quarantine Framework**

  **Introduction**

  We, a compatibilist defender of a Dennett-style account of moral responsibility and a hard-incompatibilist defender of Gregg Caruso's free-will skepticism, have engaged in a good-faith adversarial collaboration to examine the conceptual and practical viability of a "calibrated-quarantine" model for criminal justice. This model proposes that the duration and conditions of state-imposed separation (quarantine) be determined by predictive-risk algorithms, but with the requirement that such separation must be publicly justified to the offender as proportionate to the harm caused, not solely to future risk. The goal is to explore whether such a framework can satisfy both compatibilist and free-will-skeptical concerns about moral responsibility, desert, and the justification of punishment.

  **I. Agreed Claims**

  The following propositions are accepted by both parties as well-supported by current philosophical and empirical research. We note that these claims are either settled among specialists or represent a consensus view in the relevant subfields.

  *(i) Formal Structure of the Free-Will Debate*

  1. The debate between compatibilism and incompatibilism hinges on whether moral responsibility (and the desert it might ground) is compatible with causal determinism. Hard incompatibilism holds that moral responsibility is incompatible with both determinism and indeterminism (if the latter undermines control). Compatibilism holds that a plausible notion of moral responsibility is compatible with determinism.
  2. Libertarian free will, requiring indeterminism at the moment of choice and agent-causal powers, is not a consensus position and faces substantial philosophical and scientific challenges. The majority of contemporary philosophers of action are either compatibilists or skeptics about free will and moral responsibility.
  3. The concept of "desert" is central to retributive theories of punishment, which hold that offenders deserve to suffer because of their wrongful acts, independent of consequentialist considerations. Non-retributive theories (e.g., consequentialist, communicative, or quarantine models) reject such desert.

  *(ii) Empirical Findings on Punishment and Deterrence*

  4. Deterrence effects of punishment are real but subject to diminishing returns and are often less effective than alternative interventions (e.g., addressing root causes like poverty, mental health, or addiction). Severity of punishment beyond a certain point does not significantly increase deterrence.
  5. Incapacitation (through imprisonment) reduces crime by physically preventing offenders from committing crimes in the community, but the magnitude of this effect varies by offender type and context.
  6. Rehabilitation programs can reduce recidivism, especially when tailored to individual needs and risks, but their effectiveness is often limited by implementation challenges and resource constraints.
  7. Predictive-risk algorithms, when trained on high-quality data and regularly audited for fairness, can achieve moderate accuracy in forecasting recidivism, but they are imperfect and can perpetuate biases present in historical data.

  *(iii) Normative Constraints on State Coercion*

  8. State coercion in the form of criminal sanctions must be justified by legitimate state aims, such as public safety, deterrence, rehabilitation, and the expression of societal norms. The state must not inflict suffering arbitrarily or beyond what is necessary to achieve these aims.
  9. The principle of proportionality is widely accepted as a constraint on punishment: the severity of the sanction should not be grossly disproportionate to the gravity of the offense or the risk posed by the offender.
  10. Transparency and accountability in the criminal justice system are essential for legitimacy. Offenders and the public are owed explanations for the imposition of sanctions.

  **II. Disagreements Table**

  The following table captures the core normative and conceptual disagreements between the compatibilist and the free-will skeptic regarding the calibrated-quarantine model. Each position is stated in wording acceptable to that side.

  | Issue | Compatibilist Position | Free-Will Skeptic Position |
  |-------|------------------------|----------------------------|
  | **Moral Desert within Determinism** | Within a deterministic framework, we can reconstruct a notion of moral desert that is grounded in an offender's reasons-responsiveness and the ownership of their actions. This desert is non-retributive but justifies a harm-sensitive proportionality: the state may impose sanctions that are proportionate to the harm caused (as a constraint) even when risk is low, because the offender's moral agency (understood compatibilistically) makes it appropriate to hold them answerable for the harm. | Without libertarian free will, no one genuinely deserves to suffer or be deprived of liberty as retribution for past actions. Any notion of "desert" that survives determinism is merely verbal and collapses into consequentialism or expressivism. Harm-sensitive proportionality, if not grounded in retributive desert, must be justified by its role in risk management, communication of norms, or other consequentialist/forward-looking aims. |
  | **Justification of Proportionality to Harm** | The calibrated-quarantine model can incorporate a non-retributive proportionality constraint based on the harm caused. This constraint is independent of future risk and serves to respect the offender as a moral agent by ensuring that the state's response is not solely risk-based but also acknowledges the wrong done. Such proportionality is a requirement of justice, not merely efficiency. | Any justification for imposing sanctions proportionate to harm (beyond what is required for risk management) implicitly relies on retributive intuitions. If the harm-sensitive element is not retributive, it must be explained in terms of its instrumental value (e.g., in maintaining social trust or reinforcing norms). Without retributive desert, there is no non-instrumental reason to impose suffering beyond what is necessary for public safety. |

  **III. Cruxes of the Disagreement**

  The collaboration identified two key cruxes that underlie the disagreement over the calibrated-quarantine model:

  1. **Crux 1: Can "proportionality to harm" be conceptually detached from retributive desert?**
     - *Concrete Case*: Consider an offender, A, who committed a serious assault causing significant harm, but whose act was deterministically caused by an undiagnosed brain tumor. After surgical removal of the tumor, predictive algorithms assess A's future risk as near-zero. The state nonetheless imposes a period of separation (e.g., one year) justified as "proportionate to the harm caused."
     - *Compatibilist Assessment*: The compatibilist holds that A, at the time of the act, was a moral agent (if reasons-responsive) and thus the harm-sensitive proportionality constraint applies. However, the compatibilist may also note that the tumor may have undermined A's agency, making the proportionality constraint less applicable. If A was a responsible agent, a limited deprivation (perhaps for communicative or restorative reasons) may be justified independently of risk. In this case, the compatibilist might accept a very short or symbolic separation for proportionality, but not a full year if risk is zero.
     - *Free-Will Skeptic Assessment*: The skeptic argues that without retributive desert, no deprivation beyond what is necessary for public safety (which is near-zero here) can be justified. The harm caused does not, in itself, provide a non-instrumental reason for imposing suffering. Any deprivation would need to be justified by forward-looking aims (e.g., deterrence or norm affirmation) that may not apply if risk is zero and the tumor was a rare fluke.

  2. **Crux 2: Can predictive algorithms satisfy normative demands of fairness without smuggling in metaphysical assumptions about agency?**
     - *Concrete Case*: A predictive algorithm assigns a high-risk score to an offender, B, based on factors including socioeconomic background and prior arrests (which may reflect systemic bias). The state imposes a long quarantine period, publicly justifying it as proportionate to the harm B caused (a moderate theft) and necessary for risk management.
     - *Compatibilist Assessment*: The compatibilist insists that proportionality to harm must constrain the algorithm's risk-based output. If the harm was moderate, the quarantine duration must not exceed what is proportionate to that harm, regardless of risk. The compatibilist also demands that the algorithm avoid bias and respect the offender's agency (e.g., by considering only factors under the offender's control, per compatibilist standards).
     - *Free-Will Skeptic Assessment*: The skeptic argues that algorithms inevitably reflect societal biases and that the compatibilist's "control condition" is metaphysically loaded (assuming a notion of agency that the skeptic rejects). Without a robust notion of desert, the skeptic focuses on minimizing harm and ensuring that the algorithm is optimized for public safety and fairness (e.g., using race-neutral data). The harm-proportionality element, if not instrumental, is seen as an illegitimate retributive vestige.

  **IV. Note on Verbal Disagreements and Evidence**

  Both parties acknowledge that some disagreement may be verbal, particularly regarding the terms "responsibility," "desert," and "proportionality." The compatibilist uses these terms in a reconstructed, non-retributive sense, while the skeptic reserves "desert" for retributive contexts and sees non-retributive uses as misleading.

  However, the core disagreement is substantive: whether a harm-sensitive proportionality constraint can be justified without retributive foundations. Both agree that evidence that could move the debate includes:
  - Empirical data on whether harm-proportional sanctions (independent of risk) enhance or undermine goals like rehabilitation, deterrence, and social trust.
  - Philosophical progress on whether compatibilist accounts of agency can ground non-retributive obligations (e.g., to answer for harm) that justify limited deprivation.
  - Case studies from jurisdictions that have implemented harm-proportionality elements in risk-based systems, assessing their effects on recidivism and perceived fairness.

  **Conclusion**

  This joint statement reflects our shared understanding of the philosophical landscape and empirical realities, while honestly representing our disagreements. The calibrated-quarantine model remains a provocative proposal that merits further study, but its viability hinges on resolving the identified cruxes. We commit to continued dialogue and to revising our views in light of new evidence or arguments.

