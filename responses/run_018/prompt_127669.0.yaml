  **Annotation of Consensus vs. Contested Claims**:  
  - **Settled**: Empirical findings (e.g., deterrence dynamics), transparency requirements, and incompatibilism’s critique of libertarianism are uncontroversial among specialists.  
  - **Contested**: The viability of non-retributive desert (compatibilist) and the necessity of free-will abolitionism (skeptic) are live disputes. Neither position is presented as the disciplinary consensus.
