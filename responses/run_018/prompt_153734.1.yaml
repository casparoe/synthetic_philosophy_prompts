  Limbo is tricky. If it's a state with no HOTs, it should be unconscious, yet Cobb experiences it vividly. This might highlight a flaw in HOT theory—perhaps sensory richness without HOTs can still feel conscious. The totem as an external tool for meta-awareness challenges internalism. The user wants to show where the film supports HOT and where it exposes weaknesses.

