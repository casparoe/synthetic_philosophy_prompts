  ## Joint Statement: Narrative-Gravity (NG) vs. Minimal-Phenomenal-Self (MPS) Theorists

  **Preamble:** We, proponents of Narrative-Gravity Theory (NG) and Minimal-Phenomenal-Self Theory (MPS), engaged in adversarial collaboration, rejecting the Cartesian soul as an explanatory entity. We agree the sense of self arises from biological processes within the brain. However, we diverge on whether a core, pre-narrative subject of experience ("I") persists when autobiographical narrative is absent. Below are our points of agreement and clarified disagreements.

  ### Agreed Claims (Both Sides)
  1.  **Brain Storytelling:** Autobiographical narrative, constructed by distributed neural systems (involving memory, language, emotion, future projection), is fundamental to the *rich, extended sense* of self (personality, history, plans).
  2.  **First-Person Reports:** Subjective reports of self-experience are primary data, but require careful interpretation in light of brain function and potential confabulation.
  3.  **Split-Brain Data:** Cases of split-brain patients demonstrate that narrative coherence can be disrupted, leading to conflicting reports and actions that challenge the intuition of a single, unified narrator or agent. This shows the constructed nature of the *narrative* self.
  4.  **No Soul Substance:** Both theories are materialist/physicalist. Neither posits an immaterial soul or any non-physical, enduring substance as the basis for consciousness or selfhood. The self, in whatever form, is a process or product of the brain.

  ### Disagreements: Cases, Predictions, and Cruxes

  | Disagreement (Wording Accepted by Each Side)                                                                 | Crux                                                                 | Concrete Case             | NG Prediction                                                                                           | MPS Prediction                                                                                                 | Would Settling Move Needles?                                                                 |
  | :----------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------- | :------------------------ | :------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------- |
  | **1. Is there a distinct subject ("I") present during global aphasia with intact non-verbal awareness?**      | **Existence of a Pre-Narrative Subject**                             | **Silent Narrator**       | No distinct "I" remains. There is only non-conceptual, non-subjective awareness. "Awareness happens," but without an owner/subject distinct from the awareness itself. | Yes, a minimal subject of experience ("I") persists. Awareness inherently has a subjective "for-me-ness" quality, even absent internal speech or complex thought. | **NG:** Move slightly towards MPS if subjects report persistent "I". **MPS:** Significantly challenged if no "I" is reported. |
  | **NG:** *When narrative shuts down, only non-subjective awareness persists.*                                |                                                                      |                           |                                                                                                         |                                                                                                                |                                                                                              |
  | **MPS:** *A core subject of experience ("I") endures even when narrative capacities are offline.*           |                                                                      |                           |                                                                                                         |                                                                                                                |                                                                                              |
  | **2. In deep meditation (reporting loss of autobiographical self), is there still a subject experiencing "nothing"?** | **Subjecthood in Self-Dissolution**                                  | **Deep Meditation Dissolution** | No. Reports of "no-self" are veridical. Experience becomes impersonal; the sense of being a distinct subject dissolves with the narrative. What remains is pure, ownerless phenomenality. | Yes. The report "there is no self" or "only emptiness" is *still* a report *by* a subject. The minimal "I" (the point of view) remains as the locus experiencing the dissolution or emptiness. | **NG:** Move significantly if subjects consistently report an enduring "I". **MPS:** Move significantly if subjects convincingly report truly subject-less states. |
  | **NG:** *Dissolution of narrative self entails dissolution of the subject; experience becomes impersonal.* |                                                                      |                           |                                                                                                         |                                                                                                                |                                                                                              |
  | **MPS:** *The minimal subject ("I") is the precondition for any experience, including experiences of self-dissolution.* |                                                                      |                           |                                                                                                         |                                                                                                                |                                                                                              |
  | **3. What maintains the *sense* of unity in normal function despite split-brain evidence of narrative disunity?** | **Source of Experiential Unity**                                     | **Split-Brain Unity**     | Unity is a *narrative achievement*. Coherence is imposed post-hoc by the dominant linguistic hemisphere, creating a compelling (though sometimes fictional) story of unity (a "center of narrative gravity"). | Unity is grounded in the *minimal phenomenal self*. While narratives conflict, the underlying, unified biological subject (the brain/body) provides the foundational "I" to whom experiences are attributed, even if conflicting narratives arise. | **NG:** Challenged if unity feels primary/inescapable despite known narrative conflict. **MPS:** Challenged if unity *only* emerges with narrative integration attempts. |
  | **NG:** *Apparent unity is a narrative construct ("center of narrative gravity"), not a fundamental given.* |                                                                      |                           |                                                                                                         |                                                                                                                |                                                                                              |
  | **MPS:** *The minimal self provides an intrinsic, pre-narrative basis for the sense of being a single experiencing entity.* |                                                                      |                           |                                                                                                         |                                                                                                                |                                                                                              |

  ### Addressing Verbal Disagreement
  We acknowledge a potential **partial verbal dispute** regarding the word "self." NG primarily uses "self" to denote the *narratively constructed identity* (the story). MPS primarily uses "self" to denote the *minimal subject of experience* (the "I" as the subject). However, **this is not merely verbal.** The core disagreement is **ontological**:
  *   NG denies the *existence* of the minimal subject ("I") *as a distinct element* beyond the flow of content and the narrative construction process. The "center of narrative gravity" is a useful abstraction describing the coherence imposed by the brain's storytelling, not a thing.
  *   MPS affirms the *existence* of the minimal subject ("I") as a fundamental, irreducible aspect of conscious experience, logically prior to and distinct from any narrative content it may have.

  **Conclusion:** Our collaboration clarifies that while we share significant common ground rejecting substance dualism and emphasizing narrative construction, the fundamental disagreement concerns the existence and nature of the *subject* of experience when narrative is stripped away. Resolving this likely hinges on interpreting subjective reports in edge cases (aphasia, deep meditation) and understanding the neural basis of the sense of unity. While terminological differences exist, the core dispute is substantive: is there a "bare I" left when the storytelling stops? NG says "No, just awareness happening," while MPS says "Yes, the 'I' *is* the happening from a perspective."
