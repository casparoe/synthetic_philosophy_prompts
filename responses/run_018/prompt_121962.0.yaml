  Flagging indistinguishable pairs. The user suspects that Bayesian non-empirical confirmation and research optimism might look similar in practice. Both might support continued research, but differ in belief. So if a negative result comes, the Bayesian might reduce belief, while the optimist keeps hoping. But in the tree, if both lead to continued research, they might be in the same leaf unless specified differently.

