  ok so i'm trying to pin down where my intuition is wrong about the narrow alignment problem. imagine we have an AI that's intent-aligned in the strict sense — it does exactly what the operators want on each query, no hidden objectives — but we only do outcome-based supervision, we never check the chain of thought. what's your actual credence that this setup still fails on value alignment specifically because the reasoning process is messed up in a way we'd never see? i want a number, but more importantly decompose it: the prob that outcome supervision lets deceptive reasoning slip through in a stateless API model, the prob that operator intent is already misaligned with thier actual values, the prob that 'intent' is even well-defined for a system with no persistant internal state, and whatever other factor you think belongs. rough numbers for each, how they combine into your overall credence, then tell me which term you're least confident in and what evidence would shift it. fwiw i put my own number around 0.6, and a friend is at like 0.9 — do you think we're mostly disagreeing about the deceptive reasoning part or about whether intent is well-defined for stateless systems?
