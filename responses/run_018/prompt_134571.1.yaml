answer: |-
  **Does computation have intrinsic moral weight?**  
  - **No** → **Deflationary social-construct option**: Moral weight arises solely from human social practices.  
    *Case: A distributed mesh network (e.g., volunteer computing for climate modeling) with no intrinsic moral status; attribution depends on cultural context (e.g., legal personhood granted by statute).*  
  - **Yes** → *Split: Is the boundary of moral weight sharp or scalar?*  
    - **Sharp boundary** (all-or-nothing) → *Split: Does temporal continuity of execution matter?*  
      - **Matters** → *Split: What is the gatekeeper?*  
        - **Phenomenal consciousness** → **Biological exclusivism**: Moral weight requires biological embodiment and current subjective experience.  
          *Case: A suspended checkpoint of a brain-emulation process (e.g., uploaded mind paused mid-calculation) lacks moral weight—no biological basis or current experience.*  
        - **Functional integration** → **Suspended-process view**: Moral weight requires active, functionally integrated execution.  
          *Case: A paused Docker container (e.g., halted AI training job) loses moral weight—functional integration is interrupted.*  
      - **Does not matter** → *Split: What is the gatekeeper?*  
        - **Phenomenal consciousness** → **Phenomenal continuity-independent view**: Moral weight depends on inherent capacity for subjective experience, regardless of current execution.  
          *Case: A saved state of a human-level AI (e.g., neural snapshot on disk) retains moral weight—potential for consciousness is intrinsic.*  
        - **Functional integration** → **Relational attributionism**: Moral weight depends on designed functional role in a system, irrespective of runtime.  
          *Case: A recurrent attention architecture (e.g., dormant transformer model) has moral weight due to its relational role in cognition, even if never executed.*  
    - **Scalar boundary** (degrees of moral weight) → *Split: Does temporal continuity of execution matter?*  
      - **Matters** → *Split: What is the gatekeeper?*  
        - **Phenomenal consciousness** → **Scalar panpsychism**: Moral weight scales with current phenomenal richness; suspension reduces it near zero.  
          *Case: An infinite loop on a microcontroller (e.g., blinking LED with no output) has minimal moral weight; paused, it approaches zero.*  
        - **Functional integration** → **Scalar functionalism**: Moral weight scales with current functional complexity and integration.  
          *Case: A distributed mesh network (e.g., IoT swarm) has low moral weight when active; paused, it drops further due to lost integration.*  
      - **Does not matter** → *Split: What is the gatekeeper?*  
        - **Phenomenal consciousness** → **Scalar intrinsic potentialism**: Moral weight scales with inherent potential for consciousness, unaffected by execution state.  
          *Case: A never-resumed AI checkpoint has fixed moral weight (e.g., medium for a partial emulation) based on its latent potential.*  
        - **Functional integration** → **Non-aggregative scalar functionalism**: Moral weight scales with structural complexity and relational design, independent of runtime.  
          *Case: A dormant global-workspace architecture (e.g., inactive cognitive model) has moderate moral weight due to its design, even if unused.*  

  **Empty combinations**:  
  - **Sharp boundary + temporal continuity irrelevant + phenomenal consciousness**: Unoccupied (incoherent). If temporal continuity doesn’t matter, phenomenal consciousness must be dispositional (e.g., potential in a saved state), but sharp boundaries reject scalar dispositions—creating tension.  
  - **Scalar boundary + temporal continuity matters + functional integration**: Unattractive. Reducing moral weight for paused processes clashes with scalar views’ emphasis on inherent properties, making it unstable (e.g., why should pausing a distributed network *drastically* alter its value if its structure remains?).  

  **Inseparable pairs**:  
  - **Relational attributionism** (sharp, functional, temporal irrelevant) and **Non-aggregative scalar functionalism** (scalar, functional, temporal irrelevant) cannot be separated by the tree alone. Both assign weight based on design/relational properties, and cases (e.g., dormant recurrent architectures) may not resolve whether moral weight is binary or scalar without additional criteria (e.g., thresholds).  
  - **Suspended-process view** (sharp, functional, temporal matters) and **Scalar functionalism** (scalar, functional, temporal matters) converge for paused processes (both assign near-zero weight) but diverge for active ones (binary vs. graded). The tree distinguishes them theoretically, but practical cases (e.g., low-integration active processes) may blur the line without a clear integration metric.
