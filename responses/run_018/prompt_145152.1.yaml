prompt: |-
  For a metaethics seminar I am writing up my views on moral demandingness and want a consistency check before presenting. Here is my package: (1) I accept the demandingness objection to act-utilitarianism—morality cannot require the perpetual subordination of an agent’s personal projects to aggregate welfare. (2) I defend what I call a “moral budget” model: each agent bears a fixed, non-renewable quota of required self-sacrifice distributed across her obligations; demands within the quota are binding, but further consequentialist demands become supererogatory once the quota is met. (3) I hold that direct rescue obligations—saving a nearby drowning stranger at moderate personal risk—are mandatory and do not draw on the budget at all, because they involve immediate causal responsibility rather than general beneficence. (4) I reject global calibration of the budget (counting all suffering one could prevent anywhere) and insist on local calibration restricted to one’s actual causal network. (5) I deny that evolutionary debunking arguments undermine our intuitions about demandingness, yet I also maintain that those same intuitions are unreliable guides to the precise magnitude of the budget. (6) Finally, I claim there is no intrinsic moral difference between failing to rescue through direct omission and failing to prevent harm through distant non-intervention; the only relevant distinction is that direct rescue falls outside the budget while distant aid falls within it.

  Please audit this set. Which pairs are genuinely in tension, which only appear to be, and what is the least costly revision in each case? In particular, check whether (3) and (6) can stand together given that both reject standard proximity- or omission-based distinctions, and whether (4) undermines the motivation for (2). Rank the tensions by severity, specify exactly what must give in each case, and identify any hidden commitment I am implicitly signing up for that I have not listed.
reasoning: |-
  Okay, the user is preparing for a metaethics seminar and wants a consistency check on their views regarding moral demandingness. They've outlined six key points. Let me start by understanding each point thoroughly.

  Point 1 rejects act-utilitarianism because it demands too much—perpetual subordination of personal projects. Point 2 introduces a "moral budget" as a fixed quota for self-sacrifice. Point 3 makes direct rescues mandatory without using the budget, based on immediate causal responsibility. Point 4 insists on local calibration of the budget, not global. Point 5 dismisses evolutionary debunking arguments but admits intuitions about budget size are unreliable. Point 6 claims no intrinsic moral difference between direct omission and distant non-intervention, only that the former is outside the budget while the latter is inside.

  First, I need to check internal tensions. Points 3 and 6 both reject standard distinctions like proximity but rely on the budget to differentiate obligations. Are they consistent? Point 3's direct rescues are mandatory without tapping the budget, while point 6 says omission vs. non-intervention isn't intrinsically different. The budget becomes the sole differentiator. That might hold if causal immediacy defines budget exclusion, but the user needs to clarify why direct rescue has this status. Without that, the distinction could seem arbitrary, risking inconsistency.

  Next, point 4's local calibration might undermine point 2's motivation. If the budget is locally calibrated, why have a fixed quota at all? If obligations are limited by causal network, the budget might be redundant. The user must explain why local obligations aren't sufficient without a budget. Maybe the budget aggregates various local demands, but that needs elaboration to avoid redundancy.

  Point 2 and point 4 also interact. A fixed budget with local calibration could vary per individual based on their network. Is that acceptable? The user might need to accept variable quotas, which could work if the budget adjusts to local demands. But they should address whether the budget's size is fixed per person or varies contextually.

  Point 5's stance on intuitions is tricky. Dismissing debunking arguments preserves intuition validity but admitting unreliability on budget magnitude might conflict. They need to justify why some intuitions (against excessive demands) are trustworthy while others (quantifying the budget) aren't. Perhaps by distinguishing structural vs. quantitative intuitions.

  Hidden commitments include a non-consequentialist element in point 3 (direct rescues as non-negotiable), which might clash with the overall structure. Also, the budget model implies a deontic threshold, shifting consequentialism to optional beyond the quota. The user should acknowledge this hybrid system.

  Ranking tensions: Points 3 and 6 are moderately conflicting unless causal immediacy is robustly defined. Point 4 vs. point 2 is a major issue; without explaining the budget's necessity beyond local obligations, point 2's purpose is weakened. Point 5's tension is minor if intuitions' roles are clarified. The fixed vs. variable budget under point 4 needs resolution, possibly by making the quota context-dependent.

  Overall, the user needs to refine definitions, justify the budget's role alongside local calibration, and address potential arbitrariness in excluding direct rescues from the budget. Highlighting these points will strengthen their argument for the seminar.
answer: |-
  Here's a consistency audit of your metaethical package, ranking tensions by severity, identifying genuine/apparent conflicts, suggesting minimal revisions, and uncovering hidden commitments:

  **Severe Tension: (2) + (4) - The "Why Budget?" Problem**
  *   **Conflict:** (4)'s local calibration (restricting obligations to one's "actual causal network") significantly weakens the motivation for (2)'s fixed moral budget. If obligations are inherently limited by my causal network, why do I need a separate *quota* system? Local calibration already inherently limits demands; the budget risks being redundant.
  *   **Nature:** Genuine conceptual tension. Local calibration addresses the *scope* of demands, while the budget addresses their *intensity/cumulative burden*. However, (4) severely curtails the scope, potentially making the budget solution to demandingness (which arises primarily from *unlimited* scope in consequentialism) unnecessary.
  *   **Minimal Revision:** You must **strengthen the justification for the budget within a locally calibrated system.** Explain *why* locally calibrated obligations *still* generate a cumulative burden requiring a quota. Possibilities:
      *   Argue that within one's causal network, demands *could* still be overwhelming (e.g., a doctor in a warzone, a community leader during famine) without a budget cap.
      *   Frame the budget as aggregating *different types* of locally-calibrated demands (e.g., beneficence, special obligations, justice) into a single "effort/sacrifice currency."
      *   **Hidden Commitment:** You are implicitly committed to **"local demandingness":** even within a restricted causal network, moral demands can become excessively burdensome *over time* or *across multiple obligations*, necessitating a cap. You must make this explicit.

  **Moderate Tension: (3) + (6) - The Direct/Distinction Dance**
  *   **Conflict:** (3) makes direct rescue mandatory and *outside* the budget due to "immediate causal responsibility." (6) denies any *intrinsic moral difference* between direct omission and distant non-intervention, attributing the *only* difference to the budget rule (outside/inside). This raises: Why does "immediate causal responsibility" (in (3)) *not* constitute an "intrinsic moral difference" if it's the sole reason for being outside the budget?
  *   **Nature:** Apparent tension resolvable by clarifying metaphysics. (6) rejects *standard* intrinsic differences (like spatial proximity or act/omission *as such* being morally foundational). You *replace* this with "immediate causal responsibility" *as* the morally salient feature determining budget applicability. (3) and (6) *can* cohere if:
      *   "Immediate causal responsibility" (ICR) is *not* considered an "intrinsic moral difference" *in the sense condemned by (6)*, but rather the *sole operative criterion* for triggering the budget-exemption rule. (6) targets other distinctions.
      *   ICR is seen as a *triggering condition* for a specific deontic status (mandatory, budget-exempt), not a fundamental moral property *in itself* making the act different.
  *   **Minimal Revision:** **Sharpen the definition of "immediate causal responsibility"** and **explicitly state it's the *only* criterion for budget exemption.** Emphasize that (6) rejects *other* potential bases for distinction (proximity, omission) but *endorses* ICR as the basis for the budget rule. Be clear that ICR is a *descriptive* feature with *normative consequences* (exemption), not an intrinsic moral property.
  *   **Hidden Commitment:** You are committed to **"causal particularism":** the moral significance of an obligation is fundamentally tied to the *specific causal relationship* between agent and victim in a given instance, overriding general beneficence rules within the budget. This is a significant non-consequentialist element.

  **Moderate Tension: (2) + (4) - Fixed Quota vs. Variable Networks**
  *   **Conflict:** (2) posits a *fixed, non-renewable* quota. (4) bases obligations on one's "actual causal network," which is highly variable (e.g., living in poverty vs. wealth, being a hermit vs. a CEO, peacetime vs. disaster zone). How can the quota be "fixed" if the scope of potential locally-calibrated demands varies wildly?
  *   **Nature:** Genuine practical tension. A truly fixed quota seems unfair or irrational when contexts differ so dramatically.
  *   **Minimal Revision:** **Modify "fixed" to mean "fixed relative to one's actual causal circumstances" or introduce a "baseline" quota adjusted by context.** You could argue the quota is fixed *for a given individual in their specific life context*, but it can change if their context changes radically (e.g., inheriting wealth, moving countries). Avoid an implausibly rigid universal fixed number.
  *   **Hidden Commitment:** You are implicitly committed to **contextualism in moral burden:** the *amount* of sacrifice required (the budget size) might be context-dependent, even if the *structure* (fixed quota model) is universal. Or, you're committed to a **sufficientarian baseline:** the quota ensures a minimum level of personal project pursuit is protected for everyone, even if their potential impact differs.

  **Mild Tension: (5) - Intuition's Double Duty**
  *   **Conflict:** Rejecting debunking arguments (5a) suggests trust in intuitions *against* excessive demandingness. Yet claiming intuitions are unreliable for budget *magnitude* (5b) seems to undermine the very intuitions relied upon for (1) and the *existence* of a budget. Why trust them for structure but not quantity?
  *   **Nature:** Apparent tension resolvable by distinguishing intuition types.
  *   **Minimal Revision:** **Clarify the distinction:** Argue we have reliable *structural* or *threshold* intuitions (morality can't demand *everything*, perpetual subordination is wrong - supporting (1) and the *need* for a budget) but unreliable *quantitative* or *scalar* intuitions (precisely *how much* sacrifice is required, the exact size of the budget). This is philosophically defensible.
  *   **Hidden Commitment:** You are committed to **intuitional pluralism:** moral intuitions are not monolithic; some types (e.g., about fundamental constraints) are more epistemically secure than others (e.g., about precise quantities).

  **Mild Tension: (1) + (2) - The Supererogatory Leap**
  *   **Conflict:** (1) objects to AU demanding perpetual subordination. (2) uses a budget to limit demands, making further acts supererogatory. This supererogation seems like an *ad hoc* fix unless justified *within* the moral framework.
  *   **Nature:** Apparent tension common to hybrid theories. It's less about consistency within your package and more about needing to justify the category shift.
  *   **Minimal Revision:** **Explicitly justify supererogation.** Argue that the budget defines the limits of *duty*; beyond that, personal projects have *prima facie* priority, making further beneficence optional/laudable but not required. This flows naturally from the justification for (1).
  *   **Hidden Commitment:** You are committed to a **moderate agent-centered prerogative:** agents have significant, but not absolute, permission to prioritize their own projects over the greater good, bounded by the budget and direct rescues.

  **Summary of Revisions & Key Hidden Commitments:**

  1.  **Crucial:** **Revise (2)/(4) interface:** Justify *why* a budget is needed *on top of* local calibration. Explicitly commit to **"local demandingness."**
  2.  **Important:** **Clarify (3)/(6):** Define "immediate causal responsibility" meticulously as the *sole* criterion for budget exemption. Explicitly commit to **"causal particularism"** as the foundation for that exemption.
  3.  **Important:** **Refine "fixed" quota in (2):** Make it context-sensitive or baseline + adjustment. Acknowledge **contextualism in moral burden** or a **sufficientarian baseline**.
  4.  **Helpful:** **Clarify (5):** Distinguish reliable *structural* intuitions (against subordination) from unreliable *quantitative* ones (on budget size). Commit to **intuitional pluralism.**
  5.  **Helpful:** **Bolster (1)/(2):** Briefly justify the supererogatory category arising from the budget. Commit to a **moderate agent-centered prerogative.**

  **Overall Coherence:** Your package is original and addresses demandingness creatively. The core tension is between the **local calibration (4)** and the **budget model (2)**. Resolving this by justifying "local demandingness" is the highest priority. The **(3)/(6)** tension is resolvable with careful definitions, making causal responsibility the linchpin. The other tensions require clarifications rather than major surgery. By making the hidden commitments explicit, you strengthen your position and preempt objections. Good luck with the seminar!
