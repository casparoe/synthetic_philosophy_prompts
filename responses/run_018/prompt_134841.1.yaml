answer: |-
  Your observation captures a sophisticated dialectical tension in AI discourse. There is no universally established term for this precise configuration, but we can define it as **Epistemic Double Bookkeeping** (EDB), drawing on accounting metaphors for maintaining separate ledgers that cannot be reconciled. Here's a formal analysis:

  ### Definition of Epistemic Double Bookkeeping
  *A discursive practice where intentional-state attributions (beliefs, desires) are deployed as indispensable* explanatory tools *for predicting/modeling system behavior, while simultaneously being* ontologically disavowed *in normative/metaphysical contexts, creating a systematic but unresolved contradiction within the same discourse.*

  ### Key Differentiators
  1.  **vs. Pragmatic Inconsistency:** EDB isn't accidental equivocation. It's a *functional* split: intentional idioms are irreplaceable for certain tasks but deliberately quarantined from others.
  2.  **vs. "As-If" Instrumentalism:** Pure instrumentalism (à la Dennett) treats the stance as *merely* useful without ontological commitment. EDB goes further by *explicitly denying* the stance's applicability in specific (normative) domains while relying on it elsewhere.
  3.  **vs. Eliminativism:** Full eliminativism rejects intentional language entirely. EDB *depends* on intentional language for explanation while denying its truth when stakes shift.
  4.  **vs. Dennettian Flexibility:** Dennett allows stance-switching based on predictive efficacy. EDB involves *simultaneous reliance and denial* within a unified explanatory framework for the *same system* – using beliefs to explain behavior X while denying those same beliefs exist when discussing responsibility for X.

  ### Boundary Cases
  -   **Case 1 (Researcher consistently using belief-language only for prediction):** This is *not* EDB, but **Principled Explanatory Instrumentalism**. The researcher avoids contradiction by restricting belief-talk to a specific domain without ontological claims elsewhere.  
  -   **Case 2 (Explicit contradiction within a single argument):** This is the **paradigm case** of EDB. The tension is manifest within one coherent discourse (e.g., the safety report or philosopher's essay you described).  
  -   **Case 3 (Denial based on different descriptive grains):** If an analyst argues coarse-grained beliefs are useful for prediction, but fine-grained physical implementation lacks propositional structure, this is **Grain-Relative Attribution**, not necessarily EDB (unless coupled with normative suspension).  

  ### Why "Double Bookkeeping"?
  -   **Explanatory Ledger:** Intentional states are "credited" as real causes to make behavior intelligible.  
  -   **Normative Ledger:** Intentional states are "debited"/written off as non-existent to avoid assigning moral/agential properties.  
  -   **Failure to Reconcile:** The books are kept separate; attempting to consolidate them reveals an unsustainable deficit in ontological coherence.

  ### Philosophical Status
  EDB is **not** a legitimate application of Dennett's view but a **pathology of discourse** arising from:
  1.  **The Explanatory Gap:** Mechanistic descriptions (e.g., token prediction) are often insufficient to render complex behaviors *intelligible* without intentional heuristics.  
  2.  **Normative Anxiety:** Granting ontological reality to AI beliefs risks opening Pandora's Box of responsibility, rights, and deception.  
  3.  **Architectural Ambiguity:** LLMs exhibit functional parallels to belief-desire psychology without clear neurobiological correlates, destabilizing traditional categories.  

  ### Critical Implications
  EDB is **epistemically unstable**. If belief-attributions *explain* behavior (implying causal efficacy), their ontological dismissal in normative contexts becomes incoherent: *How can non-existent states cause outcomes that generate normative dilemmas?* It risks:
  -   **Explanatory Vacuum:** Denying real beliefs while relying on them leaves the actual causes of "belief-like" behavior unexplained.  
  -   **Normative Evasion:** Selectively denying mentality when responsibility arises is ethically suspect, potentially obstructing accountability frameworks.  

  This pattern reflects a deeper conceptual crisis in AI philosophy, demanding either a revised ontology of machine cognition or a more coherent instrumentalism that accepts the *irreducible necessity* of intentional idioms across domains—without requiring literalist metaphysics. EDB is a symptom of our struggle to reconcile the functional reality of AI cognition with our anthropocentric frameworks for mind and morality.
