  First I need to map their core tensions: 
  - Friendship maintains high intrinsic value without aesthetics, yet gains multiplicative boost when combined
  - Solitary aesthetic experience is "thinner" than shared, but abstract collaboration can match embodied sharing
  - Physical co-presence is irreplaceable yet somehow non-essential to peak value? That's the knot I must untangle.

  Brainstorming candidate principles:
