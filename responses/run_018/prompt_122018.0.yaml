prompt: |-
  next teusday I'm giving a 20-min talk at an interdisclipinary workshop on moral emotion and social structure. The thesis is that guilt and shame aren't just interchangeable feelings a culture can vote on; they're anchored in different "accountability architectures"—guilt needs confessional, individualizing institutions (courts, therapy, private apology) while shame needs ritual, exposure-based ones (public shunning, honor codes, communal repair). So asking which is "better" misses the point unless you also ask which architecture you're living inside. I do want to argue that guilt is normatively preferable in pluralistic societies because it localizes blame rather than dissolving the self into the group, but I admit that's contingent on already having liberal legal institutions, not a universal moral fact.

  The room will have about 15 people: cultural anthropologists who think the guilt/shame binary is mostly a Western taxonomy imposed on everyone else, clinical psych folks who treat shame as toxic and guilt as adaptive, and a few moral philosophers who think this is all empirical sociology that can't ground normative claims. There's also one historian of japanese ethics who might bring up seppuku analogies.

  Please draft my Q&A prep sheet. Organize it in exactly these sections, in this order, with rough lengths:

  1. "The thesis and the soft spot" (~120 words): restate the argument and flag the part I'm least sure about.
  2. "Audience map" (~150 words): who will object, in their own vocabulary, and which objection scares me most.
  3. "The objections, worst first" (~600 words): about seven objections, phrased the way they'd actually ask them, ordered by damage. For each: the objection, a 90-second reply, and a one-line note on where that reply is soft.
  4. "What to concede up front" (~100 words): the honest concession that defuses the room before it gets hostile.
  5. "The reply that has to land" (~150 words): the one answer I need to nail if the proposal is going to survive the vote.
  6. "The question I'm praying nobody asks" (~100 words): describe it and give a damage-control reply.
  7. "Tone check" (~80 words): how to sound like I'm not dismissing anthropology or clinical work.

  Make it practical, not a defense of the thesis. Include one worked example of an accountability architecture—maybe comparing how a workplace harassment complaint gets processed in a guilt-frame versus a shame-frame—to show I understand the mechanics.

  Also I keep mixing up principle and principal so if you need those words just write around it, don't correct me.
