answer: |-
  Here’s the thought experiment, dissection, and counterpoint:

  **Scenario:**  
  In a mountainous border conflict, Army A (claiming defensive mandate) and Army B (claiming preemptive necessity) share a single-gauge railway through a narrow pass for resupply, as alternative routes would require months to build. Commanders on both sides issue movement schedules via encrypted channels, but frontline units cannot access decryption keys or verify higher command’s legitimacy. Captain Veren (Army A) intercepts intel confirming an armored B battalion—transporting vital munitions—will traverse the corridor in 90 minutes. Destroying a key viaduct would cripple B’s offensive capacity but also collapse A’s only medical evacuation route, stranding hundreds of wounded. Veren must decide whether to authorize the strike despite noncombatant engineers maintaining the line.

  **Analysis:**  
  - **Moral Equality View (Walzerian):** Veren *may* strike. Combatants forfeit their right not to be killed by taking up arms. Since B’s combatants are "moral equals" regardless of their war’s justice, targeting them is permissible. The shared corridor’s collapse is a tragic but foreseeable consequence of dual-use infrastructure in war, falling under collateral damage (if proportional). Veren’s epistemic limitations are irrelevant—the symmetry of risk between combatants is fundamental.  
  *→ **Verdict: Authorization permitted.***  

  - **Revisionist Liability View (McMahan-esque):** Veren *may not* strike. Only combatants contributing to an unjust threat are liable to attack. If Army B is unjust, its combatants *are* liable—but Army A’s wounded and medics using the corridor *are not*. Destroying the viaduct primarily kills B’s combatants (potentially liable) but *also* unavoidably kills/doom A’s non-liable personnel. Crucially, **interdependent command opacity** prevents Veren from confirming B’s battalion is part of an unjust campaign. Without verifying liability, default symmetry violates the revisionist prohibition on targeting non-liable persons.  
  *→ **Verdict: Authorization forbidden.***  

  **Feature Doing the Work:**  
  The **interdependence + opacity** combo forces the theories apart. Moral equality ignores mandate legitimacy, focusing solely on combatant status, so opacity changes nothing. Revisionism ties liability to *actual injustice*, which opacity obscures—making the strike epistemically unjustifiable. Interdependence ensures non-liable persons (A’s wounded) face near-certain harm, violating discrimination principles under revisionism but not moral equality’s broader combatant/noncombatant binary.  

  **Weakest Point for Moral Equality Defender:**  
  *"Revisionism collapses under operational uncertainty. If soldiers like Veren can’t assess liability in real-time due to interdependent command opacity, the theory demands the impossible—paralyzing just combatants while unjust ones exploit the corridor. Moral equality’s simplicity—targetable status = combatant—prevents this self-defeating hesitation, preserving the very possibility of effective defense. War’s fog *requires* symmetrical permissions; your view would surrender the just cause to philosophical doubt."*  

  **Key Tension:**  
  Moral equality prioritizes *feasible rules* under fog of war; revisionism prioritizes *individual liability* regardless of practicality. The corridor forces a choice: accept symmetry (equality) or demand certainty (liability) and risk inaction.
