prompt: |-
  You are a professional moral philosopher with particular expertise in normative ethics and the ethics of rescue. I am a philosophy professor preparing a seminar on Singer's pond case and its descendants, and I want your help doing some reflective equilibrium on my own considered judgments. Please think carefully. I would like you to begin by brainstorming several candidate principles -- at least three -- before settling on the one you defend, and then to stress-test it rather than merely present it.

  Here are my verdicts on a set of cases. In each, take the stipulations at face value; I am not interested in wriggling out via empirical doubt.

  1. The pond: I pass a shallow pond in which a child is drowning. Wading in costs me a ruined suit worth a few hundred dollars and a missed morning of work. Clearly I must wade in, and it would be monstrous not to.
  2. The donation: I can donate a few hundred dollars to a thoroughly vetted charity that will, with high confidence, use it to save a child's life overseas. I think I am obligated to donate, and my sense is that the obligation is nearly as strong as in the pond case, though I admit it feels less urgent.
  3. The uncertain donation: Same as (2), except the charity's program is promising but genuinely contested -- perhaps a coin flip whether my money saves anyone. I still think I am obligated, and I do not feel the obligation has been halved.
  4. The rough river: A child is drowning in a fast river. I am a strong swimmer, but attempting the rescue carries, say, a one-in-five chance that I drown too. I think attempting it is admirable but not obligatory; declining is no moral failure.
  5. The redundant lifeguards: Five of us on a beach each know that a single text message to the lifeguard station will save a drowning swimmer, and each knows the others know. If everyone assumes someone else has texted, no one does, and the swimmer dies. I think each of us wrongs the swimmer by failing to text, and the wrongness does not feel one-fifth as bad as the pond case.
  6. The permanent tithe: If (2) generalizes, then I am obligated not just to make one donation but to give away everything above a modest sufficiency, year after year, indefinitely, since the need never ends. I find I cannot accept that this is obligatory. At some point the demand becomes unreasonable, even granting that every marginal dollar would do as much good as the first.
  7. The borrowed boat: Reaching the drowning child requires commandeering a stranger's moored rowboat without permission, scratching its hull. I think I am obligated to take the boat, even though the cost falls on an innocent third party and not on me.
  8. The letter and the ledger: I can save an identifiable child whose photograph and name arrive in a charity appeal, or, for the same money, fund a program that will save one statistical child -- no one will ever know which. I feel the duty more strongly in the first case, and I suspect this feeling is indefensible, but it persists.

  My request: give me the principle, or small set of principles, that best systematizes these verdicts. State each principle precisely enough that I can see which clause is doing which work, and identify which case motivates each clause. Two things matter especially. First, I suspect (3) and (4) are in tension: my verdict on the uncertain donation seems to ignore probability while my verdict on the rough river is governed by it, and I want you to tell me whether the relevant difference is cost-risk versus benefit-risk, something about whose life is at stake, or whether one of the two verdicts has to go. Second, (6) and (7) each seem to break the simple "if you can prevent something very bad at small cost, you must" formulation in different directions -- (6) by demanding a cap, (7) by permitting costs to fall on non-agents -- and I want to know whether a single repair handles both.

  Then do three things: (a) tell me which of my eight verdicts your preferred principle cannot accommodate, honestly, and which one you would counsel me to abandon if I value simplicity over completeness; (b) apply the principle to two cases I have not listed -- first, a rescue that requires me to break a serious prior promise made to someone who will be badly harmed by the breach; second, the case where my donation is fully fungible against government funding, so that my gift causes the state to spend less and the net effect on the children is zero; and (c) say, in a sentence or two, what empirical fact, if changed, would most destabilize the principle you have offered.
reasoning: |-
  Okay, let me approach this systematically. The user is a philosophy professor preparing a seminar on Singer's pond case and wants help achieving reflective equilibrium for their considered judgments across eight cases. They've provided detailed verdicts that reveal tensions in common formulations of rescue ethics.

  First, I need to analyze the core tensions in their judgments:
  - Cases 1-3 show strong obligations even with uncertainty (3) but Case 4 allows risk aversion when the rescuer's life is at stake
  - Case 6 rejects unlimited demands while Case 7 permits imposing costs on third parties
  - The emotional pull of identifiability in Case 8 persists despite recognizing its irrationality

  Hmm, the key challenges are:
  1) Explaining why probability matters in Case 4 (rough river) but not Case 3 (uncertain donation)
  2) Reconciling the rejection of permanent tithe (6) with third-party cost imposition (7)
  3) Accounting for the identifiability effect (8) without endorsing it

  I'll consider these candidate principles:
  - **Simple Cost-Benefit**: Fails Cases 4,6,7
  - **Agent-Relative Restrictions**: Struggles with Cases 2,3,5
  - **Hybrid Approach**: Combining moderate sacrifice thresholds with third-party cost constraints

  Looking at Case 4 vs Case 3... The difference seems to be whose life is at risk. In rough river, it's the rescuer's own survival probability, whereas in uncertain donation it's the beneficiary's. This suggests we weight self-risk differently than other-risk. 

  For the tithe problem... The permanent demand feels unreasonable because it crosses into what's required for a meaningful life. But in the boat case, scratching a hull is minor. So perhaps a distinction between enduring hardship vs transient inconvenience.

  My proposed principle would have three core components:
  1. **Expected Value Mandate**: Focus on probabilistic outcomes (handles Case 3)
  2. **Moderate Sacrifice Threshold**: Cap at 20% lifetime resources (resolves Case 6)
  3. **Third-Party Cost Permissibility**: Allow minor impositions (justifies Case 7)

  Testing this against their verdicts:
  - Case 4: Self-risk exemption explains why 20% death risk is non-obligatory
  - Case 5: Each still fully obligated because texting is near-zero cost
  - Case 8: Principle rejects identifiability bias but explains its psychological persistence

  For the stress tests: 
  - Breaking serious promises: Not permitted if harm exceeds rescue benefit
  - Fungible donations: No obligation since no net benefit

  What would destabilize this? If we discovered that small sacrifices cumulatively destroy well-being (undermining moderate sacrifice threshold) or that third parties experience minor costs as catastrophic (challenging cost imposition clause).

  The professor might need to reconsider Case 6's verdict - their intuition about the permanent tithe being non-obligatory is preserved by the moderate sacrifice threshold, but they might worry this opens the door to excessive self-preference. I'll acknowledge that tension.
answer: |-
  Below is a systematic principle designed to harmonize your verdicts, followed by stress-testing, identification of tensions, and applications to new cases. I'll defend a **moderate sacrifice principle with agent-relative risk permissions and third-party cost constraints**, structured to resolve the core tensions in (3)/(4) and (6)/(7.  

  ### Candidate Principles Considered  
  1. **Simple Expected Utility Maximization**: Obligation to act iff expected benefit > net cost to agent.  
     - *Problems*: Rejected for failing (4) (allows excessive self-risk), (6) (demands unlimited sacrifice), and (8) (ignores identifiability bias).  

  2. **Agent-Centered Prerogative + Threshold Deontology**: Permits favoring personal projects up to a "moderate sacrifice" threshold, but prohibits violating rights (e.g., harming others).  
     - *Problems*: Struggles with (7) (imposing costs on third parties is permitted) and (5) (no rights violation in redundant lifeguards).  

  3. **Hybrid Rescue Principle (Defended)**:  
     > **You are obligated to prevent serious harm to others if:**  
     > (a) *Expected net benefit is significant* (≥ moderate probability of major harm averted),  
     > (b) *Net cost to you is moderate* (≤ 20% lifetime resources/well-being), **and**  
     > (c) *Costs imposed on innocent third parties are trivial* (materially negligible, non-life-altering).  
     > **Except**: You may *always* refuse when the *risk to your own life/health* exceeds a low threshold (e.g., >2% mortality risk).  

  ### How the Principle Explains Your Verdicts  
  - **Pond (1) & Donation (2)**: Satisfy (a)–(c): Low cost, high benefit, no third-party harm. Obligatory.  
  - **Uncertain Donation (3)**: (a) requires only "significant" expected benefit (e.g., 50% chance to save a life ≈ 0.5 lives saved), not certainty. Explains why obligation isn’t halved.  
  - **Rough River (4)**: Triggered exception: >2% self-risk permits refusal. Difference from (3) is *whose* life is risked (yours vs. beneficiary’s).  
  - **Redundant Lifeguards (5)**: (a) and (b) satisfied (texting is near-zero cost). Wrongness isn’t diminished because *each* failure is a full causal/moral failure (non-compliance isn’t excused by others’ potential actions).  
  - **Permanent Tithe (6)**: (b) imposes a cap: Sacrifices exceeding 20% of lifetime resources are non-obligatory. Justifies your intuition that endless demands are unreasonable.  
  - **Borrowed Boat (7)**: (c) allows trivial third-party costs (scratching hull). Obligation holds.  
  - **Letter/Ledger (8)**: Principle rejects identifiability bias—duty strength should match expected utility. But psychological residue is explained by affective empathy (a defeasible bias).  

  ### Resolving Core Tensions  
  - **Tension: (3) vs. (4)**  
    - *Relevant Difference*: Risk-target. (3) involves *beneficiary-risk* (governed by expected value), while (4) involves *agent-risk* (exempted from obligation). This is defensible: Self-preservation has moral weight distinct from probabilistic benefit calculations.  
  - **Tension: (6) vs. (7)**  
    - *Single Repair*: The "moderate sacrifice" cap (b) handles (6), while the third-party clause (c) handles (7). Both are unified by a *cost-bearer constraint*: Obligation weakens when costs are high for you *or* non-trivial for innocents.  

  ---

  ### Stress-Testing the Principle  
  **(a) Verdicts the Principle Cannot Fully Accommodate**  
  - **Letter/Ledger (8)**: Your persistent identifiability feeling isn’t justified by the principle. I’d counsel abandoning this verdict for simplicity: Emotional salience shouldn’t override impartiality.  
  - **Permanent Tithe (6)**: The principle accommodates your verdict, but if you insist *no cap is intuitive*, abandon (6) and revert to Singer’s demandingness (but this conflicts with your judgment).  

  **(b) Application to New Cases**  
  1. **Broken Promise Rescue**:  
     - *Scenario*: Saving a child requires breaking a promise to care for your depressed friend, causing them severe relapse.  
     - *Application*: (c) "trivial cost to third parties" is violated (severe harm is non-trivial). **Not obligatory**. Your promise creates a prior duty; imposing major harm on an innocent breaks the cost constraint.  

  2. **Fungible Donation**:  
     - *Scenario*: Your $500 donation to a state-funded clinic causes the government to reduce its funding by $500. Net lives saved = 0.  
     - *Application*: (a) "significant expected benefit" fails (net benefit = 0). **No obligation** to donate.  

  **(c) Destabilizing Empirical Change**  
  If we discovered that **small sacrifices cumulatively destroy well-being** (e.g., frequent $100 donations cause chronic stress shortening lifespan), the "moderate sacrifice" threshold (b) would collapse, forcing either extreme demandingness (rejecting 6) or ad hoc adjustments.  

  ### Conclusion  
  The defended principle systematizes 7/8 verdicts, with (8) being the outlier to reject. It resolves (3)/(4) via the agent-risk exception and (6)/(7) via cost-bearer constraints. For your seminar, emphasize how *risk-target* (self vs. other) and *cost-distribution* (agent vs. third party) refine simple rescue principles—and interrogate whether identifiability bias is a tolerable inconsistency. This framework withstands stress-tests but remains vulnerable to empirical shifts in sacrifice’s impact.
