  **(Raise glass, warm smile)**  
  Alright, everyone? Before we get too deep into the wine and the memories… let’s raise a glass to Dr. [Advisor's Name].  

  Forty years. Forty years wrestling with one of the sneakiest, most human questions out there: When we stand up for what’s fair… *is* it really about fairness? Or is it about liking the person we get to be when we *feel* fair?  

  **To the philosophers in the room:** Yeah, she spent decades mapping that minefield between moral preference and hidden bias. **To the family and friends:** Translation – she spent decades figuring out why doing the right thing feels so simple sometimes, and so suspiciously self-serving other times.  

  Here’s the thing about [Advisor's Name]’s work, though – and honestly, about *her*. It wasn’t just about pointing out the hidden strings pulling our choices. It was about acknowledging the **realness** we feel *despite* the strings. That powerful, stubborn feeling: *This value? This choice? This is* **mine**. It’s personal. It’s *me*. Even when… maybe especially when… the outside world shaped it perfectly to fit.  

  **That feeling? That’s her legacy.**  

  Think about *her* choices. Her path. Choosing to dive into the messiest corners of ethics when cleaner, easier paths were wide open. Championing grad students everyone else overlooked. Sticking with this university through thick and thin. **None of that was just raw, pure, untouched preference.** Come on. The world nudges us. Systems shape us. Biases whisper.  

  **But…** to call it *just* bias? To say her fierce integrity was *just* a product of circumstance? That feels… wrong. Empty. Because anyone who knows her feels the heat of that authenticity. That conviction. That **residue** left behind after you account for all the shaping forces – the part that genuinely, undeniably feels like *her*.  

  **That’s the magic trick she helped us see:** You can hold both truths without breaking either. You can trace the fingerprints society left on her values… while utterly respecting the fire with which she *lived* those values as her own. She didn’t just study that tension; she *embodied* the dignity of living inside it.  

  So, [Advisor's Name], this isn’t just a thank you for the papers, the lectures, or the hours spent untangling my disastrous chapter three. **It’s a thank you for showing us how to navigate that impossible space.** For teaching us that acknowledging the forces that shape us doesn’t steal our choices – it lets us claim them more honestly. For proving that the most profound integrity lives right there, in the stubborn, brilliant residue that says, "This messy, influenced, imperfect value? I own it. I *mean* it."  

  You taught us to question everything, especially our own motives… and then to act boldly anyway. To you, [Advisor's Name] – for forty years of brilliant questions, unwavering warmth, and showing us what real, self-aware conviction looks like. May your retirement be filled with the same fierce authenticity, maybe just… you know… with a bit more sleep!  

  **To [Advisor's Name]!**  

