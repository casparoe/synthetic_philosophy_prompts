answer: |-
  ## Adversarial Collaboration Statement on Vagueness: Epistemicism vs. Supervaluationism

  **Parties:**
  *   **The Epistemicist Camp (EC)**: Maintains that vague predicates possess hidden sharp boundaries; apparent borderline cases involve epistemic ignorance of these boundaries.
  *   **The Supervaluationist Camp (SC)**: Maintains that vague predicates lack unique sharp boundaries; meaning is constituted by a range of admissible precisifications, and borderline cases involve genuine semantic indeterminacy.

  **Part 1: Agreed Claims**

  Both parties affirm the following propositions as foundational observations and constraints on any adequate theory of vagueness:

  1.  **The Sorites Paradox reveals a genuine tension:** The paradox demonstrates a profound conflict between deeply held intuitions: the plausibility of tolerance principles (small changes don't affect category membership) and the seemingly undeniable existence of clear cases at both ends of a sorites series. This tension is inherent in ordinary reasoning with vague concepts.
  2.  **Tolerance Principles are initially plausible yet lead to contradiction:** While tolerance principles appear compelling for vague predicates, their unrestricted iteration necessarily leads to contradiction (e.g., one grain of sand cannot form a heap, yet adding one grain never makes a non-heap into a heap, leading to the absurd conclusion that no number of grains forms a heap). Any resolution must address this core problem.
  3.  **Bivalence holds for fully precise languages:** In languages devoid of vagueness, classical bivalence (every declarative sentence is determinately true or false) is uncontroversial. The debate concerns whether bivalence must hold for languages containing vague predicates.
  4.  **Vagueness is not reducible to ordinary speaker ignorance:** Vagueness differs fundamentally from cases where a precise fact exists but speakers lack knowledge of it (e.g., the exact number of hairs on a specific head). The phenomenon involves a distinct kind of indeterminacy.
  5.  **Purely degree-theoretic or contextualist denials of bivalence are inadequate:** Approaches that reject bivalence entirely for vague sentences (e.g., assigning intermediate truth values or making truth radically context-dependent) face significant challenges. These include explaining the normative force of logic, accounting for the determinacy of clear cases, and avoiding revenge problems without collapsing into epistemicism or supervaluationism. Both EC and SC preserve classical logic at the level of supervaluation or determinate truth/falsity.
  6.  **The Gradient Artifact is structurally analogous to standard sorites cases:** Consider an engineered entity ("Artifact X") whose properties (e.g., metabolic rate, structural autonomy, information processing) vary continuously along multiple dimensions relevant to classifying something as an "organism" versus an "artifact". No natural discontinuity is detectable in its composition or behavior. Different expert panels (e.g., biologists, engineers, regulators) tasked with applying the predicate "organism" to Artifact X consistently draw different boundary lines. Crucially, iterative re-annotation by the *same* panel, or by overlapping panels considering the same evidence, fails to converge on a stable classification boundary. Both EC and SC agree that this scenario captures the core structural features of vagueness – tolerance, borderline cases, and the absence of convergence under pressure to decide – and that any adequate theory must account for phenomena like this.

  **Part 2: Precise Disagreements**

  The following table outlines the core points of divergence between the two camps. Each row presents a specific claim endorsed by one camp and rejected by the other.

  | Disagreement Point                                                                 | Epistemicist Camp (EC) Claim                                                                 | Supervaluationist Camp (SC) Claim                                                                                                                               |
  | :--------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Unique Extension**                                                               | Every vague predicate *P* has a unique, precise extension in any context.                    | There is no unique, precise extension for a vague predicate *P*; only a range of equally acceptable candidate extensions (precisifications).                     |
  | **Nature of Borderline Cases**                                                     | Borderline cases for *P* involve *pure epistemic ignorance* of the hidden sharp boundary. | Borderline cases for *P* involve *genuine semantic indeterminacy*; there is *no fact of the matter* whether *P* applies.                                        |
  | **Truth for Vague Sentences**                                                      | Truth for sentences involving *P* is classical: true iff the object is within the unique extension. | Truth for sentences involving *P* is "supertruth": true iff true on *all* admissible precisifications. Falsity is "superfalsehood". Borderline sentences are neither. |
  | **Classifier Uncertainty**                                                         | The calibrated uncertainty exhibited by machine-learning classifiers near a boundary reflects *our cognitive/measurement limitations* in detecting the hidden sharp boundary. | The calibrated uncertainty exhibited by machine-learning classifiers near a boundary reflects the underlying *genuine semantic indeterminacy* in the predicate itself. |
  | **Second-Order Vagueness (Boundary of Admissibility)**                             | The distinction between admissible and inadmissible precisifications for *P* is itself sharp (though perhaps unknown). | The set of admissible precisifications for *P* may itself lack sharp boundaries; "admissibility" is a vague higher-order predicate.                              |
  | **Implication of Non-Convergence (e.g., Gradient Artifact)**                       | The failure of expert panels to converge on a classification for Artifact X reflects ignorance of the single, sharp, context-independent boundary. | The failure of expert panels to converge on a classification for Artifact X reflects the absence of any single, sharp boundary to be known.                      |

  **Part 3: Cruxes for Future Resolution**

  The following sub-questions represent key points where progress could significantly impact the debate. For each, we specify the agreed-upon relevance of specific phenomena or arguments and outline the *predictions* each camp makes regarding what evidence would support or weaken their position.

  1.  **Does Second-Order Vagueness Undermine Epistemicism?**
      *   **Relevant Case/Argument:** Both agree that if "admissibility" (for precisifications) is itself vague, this raises questions about whether EC can consistently maintain that *all* vagueness is merely epistemic ignorance of sharp boundaries. If the meta-level distinction must also be sharp, does this lead to a problematic regress or implausible commitments about higher-order sharp boundaries?
      *   **EC Prediction:** Evidence that higher-order vagueness can be *reductively explained* as higher-order epistemic uncertainty concerning sharp meta-boundaries (perhaps grounded in complex factual dependencies) would support EC. Evidence that competent speakers *cannot coherently conceive* of a sharp meta-boundary for "admissible precisification," even in principle, would weaken EC.
      *   **SC Prediction:** Evidence that attempts to posit sharp meta-boundaries for admissibility lead to *incoherence* or *empirically implausible commitments* (e.g., about linguistic competence) would support SC. Evidence that meta-level distinctions *can* be made sharp without violating core linguistic data or intuition would weaken SC.

  2.  **Does the Gradient Artifact's Non-Convergence Indicate Ignorance or Absence?**
      *   **Relevant Case/Argument:** Both agree the persistent failure of expert re-annotation of Artifact X to converge on a stable boundary, despite maximal information and effort, is a critical data point needing explanation.
      *   **EC Prediction:** Discovery of a *stable latent factor* causally determining a sharp boundary (e.g., a specific molecular configuration only detectable with new technology), which, once known, leads *all* competent experts to converge, would strongly support EC. Persistent divergence *even after* discovery of all relevant physical facts about Artifact X would weaken EC.
      *   **SC Prediction:** Evidence that divergence persists *even when* all non-semantic facts (physical, functional, historical) about Artifact X are stipulated and agreed upon, and experts are solely debating the *meaning* or *application conditions* of "organism," would strongly support SC. Discovery of a method (e.g., a decisive meta-principle or measurement) that *forces convergence* among all competent experts on a single precise boundary for Artifact X would weaken SC.

  3.  **Does "Admissibility" Covertly Presuppose Sharp Boundaries?**
      *   **Relevant Case/Argument:** Both agree that SC's reliance on "admissible precisifications" is central. EC contends that specifying what makes a precisification "admissible" inevitably involves either sharp boundaries (replicating the problem) or an unacceptably vague notion. SC contends that admissibility is governed by usage and meaning constraints that are genuinely open-textured.
      *   **EC Prediction:** Evidence that the constraints defining "admissibility" for a predicate *P* (e.g., respecting clear cases, penumbral connections) *themselves* admit of borderline cases in a way that cannot be resolved without invoking *another* layer of sharp boundaries would support EC (by revealing a regress or inconsistency). A successful *formal model* of vague admissibility constraints that demonstrably avoids sharp boundaries while capturing paradigmatic linguistic data would weaken EC.
      *   **SC Prediction:** Development of a rigorous, *non-paradoxical* account of vague constraints on admissibility (e.g., within a supervaluationist meta-language or via a suitable non-classical logic) that aligns with linguistic practice would support SC. Evidence that *any* coherent specification of "admissibility" rules for a natural language predicate *must* ultimately rely on distinctions that are themselves sharp (even if complex) would weaken SC.

  **Conclusion:** This statement clarifies the substantial common ground between epistemicism and supervaluationism regarding the nature of the sorites problem and the inadequacy of rival approaches. It also precisely delineates their core, irreconcilable differences concerning the existence of sharp boundaries, the nature of borderline cases, and the semantics of vague language. The identified cruxes point towards concrete avenues – conceptual analysis, formal modeling, and empirical investigation of cases like the Gradient Artifact – where future work has the potential to shift the dialectical weight significantly between these two enduring frameworks for understanding vagueness.
