  The philosophical tension lies in whether Kafka shows life as a cluster concept that unravels. I'll argue that autopoiesis remains the core of life in the text, while social death becomes the tragedy. Key scenes to support this:
  - Gregor's persistent attempts to communicate/show care
  - His starvation as biological collapse following social abandonment
  - The charwoman's "it croaked" equating biological cessation with disposal

