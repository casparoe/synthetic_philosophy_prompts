prompt: |-
  I am drafting a novel about bodily alienation and the boundary between biological persistence and social death, and I want to use Kafka’s *The Metamorphosis* as a philosophical anchor. Read the novella through the problem of defining life at its margins—not the familiar virus-or-artificial-intelligence question, but whether a being can remain metabolically and organizationally intact while being treated as no longer alive. Specifically, apply the distinction between mere metabolic self-maintenance and organizational closure (autopoiesis: a system that continuously produces the components that produce it) to Gregor Samsa after his transformation. He continues to digest, to move with internal coherence, and to maintain sensory responsiveness; yet his family progressively revokes his membership in the household and eventually disposes of him as refuse. Does the story dramatize life as a cluster concept—biological function, autopoietic closure, and normative social recognition—whose parts can split apart? Take a committed position: argue for one definite account of whether Gregor remains alive in the philosophically interesting sense, and say whether the text ultimately privileges metabolic continuity, organizational self-maintenance, or socially granted status. Do not lay out the options neutrally; defend one reading and explain where the competing criteria fail to capture what Kafka shows. Finally, because I am borrowing this for fiction, indicate explicitly where your interpretation imports a contested philosophical framing or takes liberties with the novella’s ambiguity—distinguish what is genuinely in the text from what is your own conceptual construction.
