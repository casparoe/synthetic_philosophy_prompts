answer: |-
  ## Sestina for the Surprise Exam

  My class, attend: this week holds one exam,
  A single test. You will not see it come.
  You'll wake that day, and only then you'll **know**.
  I pledge it thus: a genuine surprise.
  It cannot land upon the final **Friday** –
  I’ll plant it earlier within the week.

  We chart the five days of the coming **week**.
  The logic starts. They scan the threatened **exam**.
  "Can it come *Friday*?" No, for then you'd **know**
  The night before – no room for doubt to **come**.
  It contradicts my pledge of true surprise.
  So Friday’s out. They strike it from the **know**.

  (But watch the form drag *Friday* back, below...)

  With Friday barred, the focus shifts. We **know**
  It *must* come earlier within the week.
  Now Thursday stands exposed, the final **Friday**
  In this new, shortened span. The looming **exam**,
  If held on Thursday, then would surely **come**
  Foreseen the night before – no true surprise.

  They cross off Thursday. Banish all surprise
  They say, for Wednesday night, you then would **know**
  Thursday was due. The pattern seems to **come**
  Clear, tightening the scope within the **week**.
  The argument proceeds: this sneaky **exam**
  Cannot be Thursday, nor of course on **Friday**.

  The middle day is next. Can Wednesday **Friday**
  Itself escape? They reason: no surprise
  Could hold if Wednesday held the test. You'd **know**
  On Tuesday night. The path is clear. They **know**
  The structure of the dwindling little **week**.
  So Wednesday falls. Only two days can **come**

  To hold the test. But Tuesday too must **come**
  Under the knife. If Monday passes, **know**
  That Tuesday *must* be it. No fresh surprise
  Could bloom then. So they cancel Tuesday. **Friday**
  Is long gone, Thursday crossed, the fading **week**
  Collapses. Monday? But then Sunday's **know**-

  ledge seals it. Nothing's left. The threatened **exam**?
  They sit back, smug. My words, they say, are **come**
  To nothing. Logic picked the whole week
  Clean. No day fits the bill for true surprise.
  Defeated by their proof? But wait... the **know-**
  ledge they invoked dissolves. The structure's **Friday**,

  Their rigid proof, a cage built day by **Friday**,
  Demolished every perch within the week.
  I watch them, confident the test won't **come**.
  They reasoned perfectly; they think they **know**.

  *   *   *

  On Wednesday morning, quiet as I'd planned,
  I set the papers down. See comprehension dawn,
  Then falter, as the structure they thought sound
  Reveals a crack unseen. Their certain ground
  Gone fragile as a held breath. On each face,
  The dawning, genuine, complete **surprise**.
