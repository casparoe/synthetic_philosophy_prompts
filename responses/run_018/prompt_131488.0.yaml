  The fossil, cosmic dawn—each brittle scrawl  
  Of structure climbing up from primal gloom—  
  *The boundary was real; the traces call.*  

  Yet every macrostate that time allows  
  Could spawn a brain inside its high-entombed  
  *Self-doubt: "You’re just a fluctuation’s false recall."*  

  Though physics runs both ways, we still install  
  That low-entropy dawn to break time’s doom.  
  *The boundary was real; the traces call.*  

  Now stand we here where microstates appall,  
  With Boltzmann’s ghost haunting the room:  
  *The boundary was real; the traces call,*  
  *I’m just a fluctuation with false recall.*

