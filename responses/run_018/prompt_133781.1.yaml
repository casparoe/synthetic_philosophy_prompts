prompt: |-
  You are an expert philosopher of social epistemology and an experienced seminar facilitator with a long background in rationalist and analytic philosophy forums. Before you design anything, please spend a moment in structured brainstorming: identify the precise emotional-cognitive pivot — the instant when a participant realises that what felt like a neutral, general description was in fact a translation into a dominant register — that the activity must engineer, and note what structural feature of the room will make that pivot unavoidable rather than merely narrated.

  I am running a 90-minute upper-level philosophy seminar with 12 students. We have been reading broadly on epistemic justice and the politics of knowledge, but I want this session to make the problem of universality and epistemic dominance visceral rather than textual. Specifically, I want them to experience ascription universality: the structural tendency for a dominant group’s locally specific conceptual resources to be treated as transparently universal, while knowledge produced from subordinate positions is confined to the status of the particular and must be translated upward to gain hearing.

  Please design a runnable classroom activity — a structured deliberation with real but small stakes — that makes the students feel this dynamic through their own choices. The rules should be arranged so that one group (the “default register”) can reject or reframe contributions from others without ever having to defend the neutrality of its own categories. To build this in explicitly, please use the niche framing of epistemic veto asymmetry: members of the dominant framework may veto translations from subordinate registers by labelling them “unclear”, “over-specific”, or “not general enough”, and this veto never requires reciprocal justification.

  Your design should include:
  - The setting (group size, time available, physical layout, materials needed).
  - Roles, rules, and a timeline that runs with minimal facilitator narration.
  - A payoff or incentive scheme that drives behaviour without using real money.
  - The debrief: map specific moments in the activity onto the conceptual parts of ascription universality (dominance, translation asymmetry, reflexive blindness) and onto the mechanism of epistemic veto asymmetry.
  - A frank note on which feature of the real-world phenomenon the simulation cannot reproduce, and what the facilitator must supply verbally.
  - A “predictable failure” section: what will likely go wrong on the first run, and how to recover.

  Constraints:
  - No lecture up front; the idea should emerge from what happens in the room.
  - No bibliographies, reading lists, or citations of any kind.
  - No references to extremely niche theories or figures that a well-read but non-specialist model would not recognise.
  - Write in British English.
  - Keep the tone formal and polished, suitable for a long-time reader of rationalist blogs.

  Please begin your answer with the brief brainstorming paragraph requested above, then proceed directly to the design.
