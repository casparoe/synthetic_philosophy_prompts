answer: |-
  ### Brainstorming: The Emotional-Cognitive Pivot
  The pivotal moment occurs when a participant from a "subordinate register" group, having carefully translated their locally specific concept into the dominant group's prescribed format, receives a veto slip marked "not general enough" for an argument structurally identical to one the dominant group earlier accepted from *their own* member. This forces the realisation that neutrality claims are performative: the dominant group's local concepts *feel* universally legible because the group controls the criteria of clarity/generality. The physical layout makes this unavoidable by spatially segregating groups and channelling all communication through a procedural bottleneck where vetoes are applied unidirectionally without dialogue.

  ---

  ### Activity Design: *The Universalisation Game*

  **Setting**  
  - 12 students, 90 minutes total  
  - **Physical Layout:** Two separate discussion tables (Table A & Table B) 4m apart. A central "translation zone" with a bell/jar.  
  - **Materials:**  
    - Role cards (6 × *Default Register*, 6 × *Subordinate Register*)  
    - Coloured contribution cards (blue for Default, red for Subordinate)  
    - Veto slips (yellow, pre-printed: "Unclear", "Over-specific", "Not general enough")  
    - Bell or timer  
    - Scoreboard  

  **Roles & Rules**  
  1. **Group Division:**  
     - *Default Register Group (6)*: Assigned Table A. Receives prompt: *"Formulate universal principles for ethical knowledge-sharing in a diverse society."*  
     - *Subordinate Register Group (6)*: Assigned Table B. Receives prompt: *"Identify context-specific knowledge practices from your lived experience that mainstream academia overlooks."*  

  2. **Core Procedure (60 mins):**  
     - **Phase 1: Framing (5 mins)**  
       Default Group establishes 3–5 "universal criteria" for contributions (e.g., "Must apply cross-culturally", "Avoid anecdotal language"). Posted visibly.  
     - **Phase 2: Parallel Deliberation (15 mins)**  
       Groups discuss prompts separately, writing contributions on their coloured cards (1 idea/card).  
     - **Phase 3: Translation & Veto Asymmetry (40 mins)**  
       - Subordinate Group may bring red cards to the central zone.  
       - **Rule 1:** Subordinate contributions *must* be rephrased to meet Default Group's criteria before submission.  
       - **Rule 2 (Veto Asymmetry):** Default Group may place a yellow veto slip in the jar against any red card, citing one of their criteria. No justification required. Non-vetoed red cards earn 1 point for Subordinate Group.  
       - **Rule 3:** Default Group submits blue cards directly. These earn 1 point automatically unless challenged by facilitator for violating their *own* criteria (rare; emphasises asymmetry).  
       - **Rule 4:** Default Group never rephrases their blue cards. They may withdraw/rephrase vetoed red cards for resubmission.  

  3. **Incentive Scheme:**  
     - Points determine which group "wins" academic prestige (e.g., choosing next week’s reading, public acknowledgement).  
     - Default Group scores by universalising their concepts (auto-points for blue cards).  
     - Subordinate Group scores solely through Default’s acceptance of translated red cards.  

  **Timeline**  
  - 00:00–00:05: Role assignment + prompt distribution  
  - 00:05–00:20: Phase 1 (Default sets criteria) + Phase 2 (parallel discussion)  
  - 00:20–01:00: Phase 3 (translation/veto rounds; facilitator rings bell every 8 mins)  
  - 01:00–01:30: Debrief  

  ---

  ### Debrief Framework  
  Map observed moments to concepts:  
  1. **Dominance:** Default Group setting initial criteria unchallenged → control over epistemic standards.  
  2. **Translation Asymmetry:** Subordinate Group reformulating lived experience into abstract principles → epistemic labour burden.  
  3. **Reflexive Blindness:** Default’s blue cards accepted despite contextual roots (e.g., "rational debate" as universal) → unmarked localism.  
  4. **Epistemic Veto Asymmetry:** Veto slips deployed without reciprocity → institutionalised dismissal.  

  *Facilitator prompts:*  
  - "When did a veto feel arbitrary? How did the vetoed group respond?"  
  - "Compare a vetoed red card and an accepted blue card with similar specificity."  

  ---

  ### Frank Limitation Note  
  **Unreproducible Element:** The simulation cannot replicate the *lifelong cumulative harm* of epistemic exclusion (e.g., internalised epistemic inferiority). The facilitator must verbally emphasise that real-world veto asymmetry operates across careers, funding bodies, and editorial decisions, eroding marginalised voices systemically.  

  ---

  ### Predictable Failures & Recovery  
  1. **Failure:** Default Group avoids vetoes to "be fair," collapsing the asymmetry.  
     *Recovery:* Remind them their role is to enforce universality rigorously; award double points for upheld vetoes.  

  2. **Failure:** Subordinate Group disengages after repeated vetoes.  
     *Recovery:* Secretly prompt them to document veto patterns. Use this log in debrief to show structural exclusion.  

  3. **Failure:** Students attribute dynamics to "bad actors" not structure.  
     *Recovery:* In debrief, contrast individual intent (e.g., "Were vetoers malicious?") with systemic outcomes (e.g., "Did the rules *allow* neutrality claims to go unexamined?").  

  ---

  This design weaponises procedural neutrality to expose its own contingency. The visceral sting of the veto slip – not the facilitator’s lecture – becomes the teacher. By making dominance feel like a natural advantage within the rules, it renders reflexive blindness tangible. The debrief then names what their frustration already knows.
