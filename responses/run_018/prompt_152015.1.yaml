  Hmm, the user's framing suggests they're deeply familiar with the topic—phrasing like "formal structure" and "structural not methodological" indicates they expect high-level engagement. They're likely an academic or advanced enthusiast running a rigorous reading group. Their hidden need might be arming panelists with surgical tools to dissect the guest's theory without letting her retreat into abstraction. 

  For the Popper question, I'll need to preempt her likely "structural" defense by distinguishing logical structure from scientific methodology upfront. The follow-up should corner her on whether recursive anachronism inherently corrupts historical epistemology. For ancient aliens, the key is probing if their reliance on "suppressed evidence" creates a distinct failure mode—maybe more conspiracy-driven than Fomenko's chronological acrobatics. The demarcation trap is trickiest: if formal structure alone defines pseudohistory, could a valid theory (say, revised dating via new tech) get falsely flagged? Her probable "intent vs. outcome" reply needs a follow-up questioning if that smuggles subjectivity into a supposedly formal criterion. 

  Other angles to cover: How the framework handles pseudohistories that *do* make testable claims (like Velikovsky's astronomy), and whether "recursive anachronism" is itself falsifiable. Must avoid bibliography tangents per user instructions. 

  *Starts drafting questions*: Leading with the structure/absorption mechanism forces clarity upfront. Slotting Popper next creates natural friction. Ancient aliens can pivot to variants, demarcation as the climax. Saving epistemology for last leaves a lingering punch. Each follow-up should resist yes/no answers—"how" and "where" questions will pressure concrete responses. 

  *Double-checks*: User wants exactly 7, no intros. Demarcation question must include predicted reply + follow-up as specified. Tone should be incisive but not hostile—modeling rigorous skepticism for the reading group. Nailed the formal-structure focus? Yes. Okay, shipping.
answer: |-
  Here are 7 targeted questions addressing the core concepts of "recursive anachronism," incorporating your specific requests:

  1.  **Core Mechanism:** "Your framework hinges on a specific 'recursive anachronism' structure where *both* the presence *and* absence of archaeological/material evidence can be interpreted as confirmation for the theory (e.g., Atlantis sunk without trace *or* is hidden under ice/sea; Fomenko's missing records are explained by 'tampering'). Could you elaborate on the *formal logical structure* of this absorption mechanism? Is it primarily a reversal of evidentiary burden, a special case of ad-hoc hypothesis, or something else structurally distinct?"
      *   *(Focus: Forces precise definition of the proposed structure)*

  2.  **Distinction from Falsifiability:** "Popper famously criticized theories like psychoanalysis and Marxism for being unfalsifiable due to their ability to explain away counter-evidence. How does 'recursive anachronism' as a *formal structure* differ from Popper's concept of methodological unfalsifiability? Is it purely about the specific *type* of evidence (archaeological presence/absence) and its predictable reinterpretation within the theory's narrative?"
      *   *(Follow-up based on predicted "structural" reply):* "If the distinction is purely structural – focusing on the specific duality of archaeological evidence absorption – doesn't this structural feature *itself* constitute the core methodological flaw making the theory unfalsifiable *in practice* for historical/archaeological inquiry? Is the structure separable from the methodological consequence?"

  3.  **Ancient Aliens Test Case:** "Does the 'recursive anachronism' structure aptly describe ancient astronaut theories? They often explain advanced artifacts as alien intervention (presence as evidence) and the *lack* of expected alien artifacts/records as due to time, deliberate concealment, or misinterpretation (absence as evidence). Or do these theories rely more heavily on a distinct 'suppression of truth' or 'misinterpretation by authorities' trope as their primary immunizing strategy?"
      *   *(Focus: Tests the framework's applicability to another major pseudohistorical genre and probes for potential variations in failure modes)*

  4.  **The Demarcation Challenge:** "If 'recursive anachronism' is defined purely by its formal structure of absorbing both presence and absence of material traces, couldn't a *legitimate* revisionist historical hypothesis, perhaps based on genuinely new evidence or methods, accidentally exhibit this structure in its *early*, speculative stages as it grapples with counter-evidence? How does your framework avoid classifying such potentially valid revisions as pseudohistory solely based on form?"
      *   *(Probable Answer Direction):* She will likely argue that *intent*, *overall methodology*, *engagement with established evidence*, or the *persistent* and *foundational* use of the structure distinguishes pseudohistory, not its accidental occurrence.
      *   *(Follow-up):* "Doesn't introducing intent or methodology as the *real* demarcation criterion undermine the claim that the *formal structure itself* is the primary identifying feature of this specific pseudohistorical mechanism? If structure alone isn't sufficient for identification, what specific *combination* of structure *and* other factors (like those you mentioned) defines recursive anachronism as pseudohistorical?"

  5.  **Internal Coherence vs. External Evidence:** "Within the recursive anachronism structure, how does the theory generate *positive* predictions beyond simply immunizing itself? Is the theory's primary appeal and coherence derived from internal narrative consistency and explaining *away* problems, rather than making novel, testable predictions about *finding* specific, new evidence that *couldn't* be absorbed if absent?"

  6.  **Escaping the Recursion:** "Can you conceive of a *type* of evidence, or a *specific finding*, that would genuinely falsify a theory exhibiting recursive anachronism, within its own terms? Or does the structural absorption mechanism inherently prevent such definitive falsification by its very design?"

  7.  **Epistemological Consequence:** "If recursive anachronism is a widespread structural feature of influential pseudohistories, what does this imply about the fundamental relationship between evidence, hypothesis, and narrative in *historical epistemology*? Does it highlight a particular vulnerability in how we reconstruct the distant past compared to, say, experimental sciences?"

  **Key Rationale:**

  *   **Structure First:** Starts by defining the core mechanism (#1).
  *   **Popper Contrast:** Directly addresses your request, forcing the structural vs. methodological distinction (#2) and follows up rigorously on the likely reply.
  *   **Ancient Aliens Test:** Applies the framework to your specified case (#3), probing boundaries.
  *   **Demarcation Trap:** Your central concern (#4). The predicted answer (intent/methodology) is common, and the follow-up directly challenges the primacy of the "formal structure" claim.
  *   **Predictive Power:** Probes if the structure allows *only* defense or also positive testability (#5).
  *   **Falsifiability Test:** Pushes the logical limits of the structure (#6).
  *   **Broader Impact:** Connects the concept to historical epistemology (#7), ending on a thought-provoking note.

  These questions force engagement with the *specifics* of "recursive anachronism," test its boundaries, challenge its claims about structure vs. methodology, and confront the core demarcation problem you want highlighted.
