prompt: |-
  I'm moderating a panel for my reading group on pseudohistory and demarcation and I want to prep questions for our guest — shes an unnamed historian of science defending this niche idea she calls "recursive anachronism," where Atlantis myths and Fomenko's New Chronology share a formal structure: the theory predicts both presence and absence of archaeological traces, so counterevidence gets absorbed either way. I need about 7 questions that actually turn on the content, not generic intro stuff. At least one should press her on how this differs from Popper's unfalsifiability charge, with a follow-up keyed to her likely reply that its structural not methodological. Another should ask whether ancient-aliens claims fall under the same recursive structure or have a different failure mode. And I want one that forces her to face the demarcation problem: if the criterion is purely formal, couldnt a legitimate revisionist history accidentally trigger it? Include the probable answer and the follow-up. No bibliography requests — just the questions.
