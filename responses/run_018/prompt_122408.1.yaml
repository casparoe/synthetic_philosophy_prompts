  ## Held Breath

  The elders cough into their hands, a sound
  like creek-ice failing under spring’s first heat.
  Their eyes hold words the young no longer greet,
  consonants wrapped in ache, on shifting ground.
  **This throat holds the last ember.**

  Forms stack on the clinic desk, a silent wall
  of terms demanding clear, compliant speech.
  The diagnosis waits beyond their reach,
  a vital script they cannot sound at all.
  **This tongue wants the key to the courthouse door.**

  Old verbs for snow-blind light, for fish unseen,
  dissolve like salt in bureaucratic ink.
  The untranslated wound, the missing link
  to land-claims buried in a legal screen.
  **This throat holds the last ember.**

  The grandchild speaks the currency of need,
  brings water, translates pain in sharp, bright tones.
  The elder's wisdom rustles, lost, in bones,
  a private wealth that cannot intercede.
  **This tongue wants the key to the courthouse door.**

  See how the silent consonants retreat
  from paperwork on a steel desk, pristine?
  Hear how the courthouse key, precise and clean,
  can't turn the lock on grief's unique heartbeat?
  **This throat holds the last ember.**

  The law requires the signature, the proof
  in standardized, unyielding, common lines.
  The ancient song, where memory intertwines
  with river names, stands trembling, aloof.
  **This tongue wants the key to the courthouse door.**

  No scale exists for ash or iron ore.
  **This throat holds the last ember. This tongue wants the key.**

  ---

  **Notes on Structure & Intent:**
  *   **Refrains:** "This throat holds the last ember" (language/culture preservation) and "This tongue wants the key to the courthouse door" (access/rights in the dominant language) alternate strictly, never sharing a stanza.
  *   **Disconnection:** The refrains use different metaphors (ember vs. key/courthouse) and grammatical structures (statement of possession vs. statement of desire/objective), emphasizing their separate logic.
  *   **Final Couplet:** They are placed side-by-sentence without conjunction ("and", "but"), visually and semantically adjacent but not interacting or resolving. The period after "ember" enforces separation even as they share the line.
  *   **Imagery:** Contrasts organic fragility ("creek-ice failing," "embers," "grief's unique heartbeat") with institutional rigidity ("paperwork," "steel desk," "bureaucratic ink," "courthouse door," "standardized lines").
  *   **Conflict:** The poem shows the *lived* tension: the language contains irreplaceable cultural knowledge ("grief carved its own alphabet," "verbs for snow-blind light," "river names") while the dominant language is essential for survival and rights ("diagnosis," "water," "land-claims," "signature").
  *   **Incommensurability:** By never comparing the refrains directly within a stanza and showing their consequences in different spheres (cultural loss vs. systemic exclusion), the structure demonstrates why they cannot be traded on a single scale. The final placement underscores this irreducible difference.
