prompt: |-
  I'm a graduate student in a seminar on practical rationality and collective decision-making, and I've been assigned to help a university governance committee that approves binding institutional commitments—multi-decade contracts, endowment policies, and core-curriculum requirements—that will constrain future students who are not yet present to vote. The committee currently relies on surveys of current students, but I want to translate a framework closer to coherent extrapolated volition into an operational tool: the normative standard should not be what students happen to want now, but what they would want after coherence, full information, and reflective equilibrium. Because this must be reusable rather than a one-time philosophical defense, I need it rendered as an actual decision procedure.

  Please design an ordered checklist or flowchart-in-prose that the committee can run on any proposal for a long-term binding commitment. Specify how to identify the stakeholder preference set without treating every expressed opinion as fixed; the coherence tests—transitivity, framing independence, consistency across time-horizons—that must be satisfied before extrapolation; how to model "better-informed" preferences without substituting the committee's own values; the points that must be handed to a deliberative body rather than solved analytically; and explicit stopping conditions—thresholds of divergence or ambiguity—where the procedure returns "do not decide" rather than imposing a constructed preference. Mark every unavoidable judgment call.

  Apply this procedure to three proposals: a thirty-year fossil-fuel-free campus energy contract that raises tuition by 2% annually; a mandatory two-year foreign-language core requirement that current students oppose by about seventy percent; and an endowment divestment excluding both fossil fuels and nuclear energy, which satisfies activists but reduces projected returns affecting future financial aid. Include one case where the procedure yields a recommendation the committee will strongly resist, and explain why it is forced. Then state clearly what the procedure cannot do—especially where values are constructed rather than discovered, and where coherence permits incompatible orderings. Organize your response in these sections with approximate lengths: (1) Role, Constraints, and Scope (~150 words); (2) The Procedure: Steps, Tests, and Stopping Rules (~450 words); (3) Worked Applications (~550 words); (4) Judgment Points and Hard Limits (~250 words).
reasoning: |-
  Okay, the user is a grad student in a seminar on practical rationality and collective decision-making. They need to design a decision procedure for a university governance committee that makes long-term binding commitments affecting future students. The current method relies on surveys of current students, but they want something closer to coherent extrapolated volition—considering what students would want with full information and reflection, not just their current preferences.

  I need to create a practical tool: an ordered checklist or flowchart in prose. The procedure must handle stakeholder preferences without taking them as fixed, apply coherence tests (like transitivity and framing independence), model better-informed preferences without imposing the committee's values, include points for deliberation, and have stopping rules to avoid deciding when preferences are too ambiguous. And I have to mark unavoidable judgment calls.

  The user also wants three examples applied: a 30-year fossil-free energy contract raising tuition, a mandatory language requirement opposed by 70% of current students, and endowment divestment from fossil fuels and nuclear that reduces financial aid. One case should give a recommendation the committee will resist, and I need to explain why it's forced. Finally, outline what the procedure can't do, like when values are constructed or coherence allows incompatible orderings.

  Structuring the response: Section 1 (150 words) on Role, Constraints, and Scope; Section 2 (450 words) on the Procedure with steps; Section 3 (550 words) on the three applications; Section 4 (250 words) on Judgment Points and Hard Limits. I have to be precise and follow the word counts.

  For the procedure, I'm thinking of steps like: define the commitment, gather preferences from stakeholders, test for coherence, model informed preferences, extrapolate to future students, deliberate, and decide with stopping rules. Key tests include transitivity, framing independence, and time-horizon consistency. Stopping rules should kick in if there's too much divergence or ambiguity.

  In the applications: For the energy contract, current students might oppose the cost, but with full info on climate impacts, their preferences could shift, so the procedure might approve it despite resistance. For the language requirement, even after reflection, opposition might hold due to feasibility, leading to rejection. For divestment, excluding nuclear might be inconsistent if it's key to clean energy, so the procedure could say "do not decide" due to incoherence.

  Unavoidable judgments include setting information thresholds, defining "sufficient deliberation," and identifying incoherence. Hard limits involve value construction vs. discovery, pluralism leading to incompatible orderings, and predicting distant futures. I need to emphasize that this tool helps structure decisions but doesn't eliminate value conflicts or guarantee a single right answer.

  This should address the user's academic and practical needs, providing a reusable framework that elevates decision-making beyond raw surveys while acknowledging its limitations.
answer: |-
  ## (1) Role, Constraints, and Scope (~150 words)
  This procedure operationalizes a "coherent extrapolated volition" (CEV) framework for the committee's binding, long-term commitments. Its role is to guide deliberation towards decisions reflective of what *future students*, given coherence and full information, would endorse, not just current preferences. Key constraints: It must be reusable, avoid substituting committee values for student values, acknowledge epistemic uncertainty, and explicitly handle ambiguity. Scope covers commitments binding future cohorts (>10 years), where current stakeholders lack direct future experience. It inputs proposal details, stakeholder input, and relevant data; outputs a recommendation: Approve, Reject, or **Do Not Decide (DND)**. It structures analysis but cannot resolve fundamental value pluralism or guarantee a unique "true" preference. It identifies points requiring deliberative judgment, marking them as **[JC]**.

  ## (2) The Procedure: Steps, Tests, and Stopping Rules (~450 words)

  **Phase 0: Pre-Screen**
  *   **0.1 Proposal Definition:** Clearly articulate the commitment's nature, duration, costs/benefits (quantified where possible), affected stakeholders (current/future students, faculty, staff, society), and reversibility constraints.
  *   **0.2 Trigger Check:** Does the commitment meet the scope (long-term, binding future cohorts)? If **No**, use standard decision-making. If **Yes**, proceed.

  **Phase 1: Stakeholder Preference Elicitation & Initial Mapping**
  *   **1.1 Gather Raw Input:** Collect preferences from current students (surveys, focus groups), faculty/staff experts (impact assessments), alumni (long-term perspective), and societal stakeholders (e.g., environmental groups). Document expressed preferences, intensity, and key arguments *for* and *against*. Do not filter yet.
  *   **1.2 Map Core Values & Conflicts:** Identify underlying values driving preferences (e.g., affordability, sustainability, educational quality, autonomy, intergenerational justice, institutional reputation). Flag apparent conflicts between values and between stakeholder groups. **[JC: Identifying core values requires interpretation.]**

  **Phase 2: Coherence Testing & Preference Refinement**
  *   **2.1 Transitivity Test:** For preferences involving trade-offs (e.g., cost vs. sustainability), construct simple forced-choice scenarios. Check if implied rankings (A>B, B>C imply A>C) hold consistently within stated preferences of major groups. Flag major intransitivities.
  *   **2.2 Framing Independence Test:** Present the *same core trade-off* under different, logically equivalent framings (e.g., "2% tuition increase" vs. "$X annual cost"). Check if preferences shift significantly based *only* on framing. Flag large, systematic framing effects.
  *   **2.3 Time-Horizon Consistency Test:** Probe if preferences change dramatically when considering impacts over 5, 20, 50 years. Does valuing sustainability *now* translate to willingness to pay for *long-term* benefits? Flag severe myopia or hyperopia inconsistent with long-term commitment nature.
  *   **2.4 Stopping Rule A:** If any test reveals **severe, pervasive incoherence** (e.g., >40% of key group shows strong intransitivity/framing effects on core issue) that cannot be resolved through clarification, output **DND: Incoherent Preferences**. Requires further education/deliberation before re-running.

  **Phase 3: Modeling "Better-Informed" Preferences (Without Substitution)**
  *   **3.1 Information Gap Identification:** Identify key facts relevant to the decision that are likely unknown/misunderstood by current stakeholders (e.g., climate science certainty, long-term energy cost projections, ROI impact on future aid, language acquisition research). **[JC: Defining "essential" knowledge.]**
  *   **3.2 Neutral Information Provision:** Develop concise, expert-vetted summaries of these gaps. Present them neutrally to representative stakeholder samples (e.g., student focus groups) *without advocacy*.
  *   **3.3 Preference Shift Assessment:** Re-elicit preferences after information absorption. Document *shifts* in support/opposition and reasoning. Focus on changes driven by *understanding*, not persuasion.
  *   **3.4 Stopping Rule B:** If information causes preferences to **fragment dramatically** (>50% divergence in key group direction, e.g., 40% stronger support, 40% stronger opposition) with no clear majority trend, output **DND: Ambiguity Under Information**.

  **Phase 4: Extrapolation to Future Cohorts & Deliberation**
  *   **4.1 Future Context Modeling:** Outline plausible future scenarios relevant to the commitment (e.g., climate severity, job market for multilinguals, endowment performance landscapes). **[JC: Plausibility of scenarios.]**
  *   **4.2 Extrapolated Volition Synthesis:** Combine Phase 3 informed preferences with future context modeling. Ask: "Would students, holding the refined core values identified (e.g., valuing sustainability, affordability, opportunity), *after* experiencing coherence tests and possessing this full information, *in* these plausible futures, endorse this specific commitment?" Synthesize a tentative "extrapolated preference."
  *   **4.3 Deliberative Forum:** Present the entire analysis (raw prefs, coherence results, info shifts, extrapolation logic) to the committee. **This is the critical deliberative phase.** Debate focuses on:
      *   Reasonableness of the extrapolation.
      *   Weight of conflicting values (e.g., current burden vs. future benefit).
      *   Fairness of imposing the burden.
      *   Strength of the "DND" signals from earlier phases. **[JC: Core value weighting, fairness assessment.]**
  *   **4.4 Stopping Rule C:** If deliberation reveals **fundamental, irreconcilable value conflict** underlying the extrapolation, or the extrapolation itself is deemed **highly speculative or unjustifiable** by the committee, output **DND: Unresolvable Conflict/Speculation**.

  **Phase 5: Final Decision Threshold**
  *   **5.1 Recommendation:** If the extrapolated preference is clear and deliberation affirms its legitimacy/feasibility, output **Approve** or **Reject** accordingly. If Stopping Rules were triggered or deliberation remains deeply divided, output **DND**.

  ## (3) Worked Applications (~550 words)

  *   **Case 1: 30-Year Fossil-Fuel-Free Energy Contract (2% Annual Tuition Increase)**
      *   *Raw Prefs:* Strong majority opposition from current students due to cost. Faculty/staff experts highlight climate urgency and long-term energy price volatility. Alumni/sustainability groups strongly support.
      *   *Coherence Tests:* **Framing Effect Flag:** Opposition softens significantly when framed as "securing stable clean energy costs for 30 years, avoiding fossil price spikes." **Time-Horizon Flag:** Many students acknowledge long-term benefits but prioritize current costs.
      *   *Information Provision:* Data on accelerating climate impacts, projected fossil fuel price instability & carbon costs, and comparative long-term costs of renewables vs. fossil dependence. *Shift:* Opposition decreases notably (~20% net shift towards support/ambivalence), driven by understanding long-term risks/costs.
      *   *Extrapolation:* Future students (facing worse climate, volatile energy markets, societal pressure) with full info would likely prioritize stable, clean energy despite upfront cost. Core values (sustainability, long-term affordability) support this.
      *   *Deliberation/DND Check:* Value conflict (current cost burden vs. long-term institutional/future benefit) is present but resolvable towards approval given severity of climate externalities and long-term cost avoidance. Committee resistance to cost is high, but **procedure forces APPROVE**. Why? Coherent, informed preferences of *future* students (the bound party), extrapolated from refined current values under full info & future context, clearly favor the long-term stability and sustainability, outweighing the manageable, phased cost burden. Rejecting it privileges transient current preferences over the CEV of the affected future cohort.

  *   **Case 2: Mandatory Two-Year Foreign Language Requirement (70% Current Opposition)**
      *   *Raw Prefs:* Strong current student opposition (70%) citing workload, perceived irrelevance to major, opportunity cost. Faculty (language/humanities) strongly support for cognitive, cultural, career benefits. Alumni mixed.
      *   *Coherence Tests:* Minor framing effects. **Time-Horizon Flag:** Significant opposition persists even when emphasizing long-term career/cognitive benefits. Core values conflict: Educational rigor/global citizenship vs. Autonomy/Workload management.
      *   *Information Provision:* Data on cognitive benefits of bilingualism, global job market demands, specific career advantages. *Shift:* Modest decrease in opposition (~10%), but strong majority opposition remains. Reasoning shifts: Less "irrelevance," more "too burdensome/unfair mandate".
      *   *Extrapolation:* Ambiguous. Future students *might* value global skills more, but current informed preference (strong opposition focused on burden/autonomy, rooted in core values) persists. Lack of clear shift under info weakens extrapolation case.
      *   *Deliberation/DND Check:* Strong core value conflict (autonomy/current burden vs. long-term educational benefit). Extrapolation to future support is weak; persistent opposition reflects a coherent value position (autonomy) even under info. **Procedure forces REJECT.** Imposing a major burden against the strong, coherent, informed preference of the *current* cohort (acting as proxies) based on speculative future benefit violates the CEV principle focused on the bound party's perspective.

  *   **Case 3: Endowment Divestment (Fossil Fuels & Nuclear, Reduces Aid Projections)**
      *   *Raw Prefs:* Student activists strongly support full divestment (fossils + nuclear). Finance office strongly opposes due to diversification loss and projected 0.5% annual return reduction impacting future aid. General student body mildly supportive of "ethical investing" but concerned about aid.
      *   *Coherence Tests:* **Major Intransitivity/Incoherence Flag:** Activist stance often values "clean energy" but rejects nuclear (key decarbonization tool per science), creating incoherence (Support A: Zero-Carbon Future > B: Fossil Fuels; but Support B: Fossil Fuels > C: Nuclear?). **Framing Effect:** Support drops significantly when framed as "Reducing future financial aid by ~$Y million annually to exclude nuclear power alongside fossil fuels."
      *   *Information Provision:* Data on nuclear's role in decarbonization pathways vs. renewables' limitations, detailed impact of projected return loss on future aid packages, complexities of ESG investing. *Shift:* Activist preferences fracture: Some double down, some question nuclear exclusion. General support plummets. High confusion/divergence.
      *   *Extrapolation:* Highly speculative. Future students might prioritize aid or climate differently. Key incoherence (nuclear exclusion) undermines coherent value formation.
      *   *Deliberation/DND Check:* Triggered **Stopping Rule A (Incoherent Preferences)** and **Stopping Rule B (Ambiguity Under Information)**. Core values (sustainability, financial aid access) are in direct conflict, exacerbated by logical inconsistency in the proposal (excluding nuclear). No clear, coherent extrapolated volition emerges. **Output DND: Incoherent Preferences/Ambiguity Under Information.** Committee must refine the proposal (e.g., fossil-only divestment?) or seek broader consensus before reconsideration.

  ## (4) Judgment Points and Hard Limits (~250 words)

  **Unavoidable Judgment Calls (Marked [JC]):**
  1.  **Identifying Core Values:** Interpreting underlying values from expressed preferences.
  2.  **Defining "Essential" Information:** Determining what knowledge gaps are critical for preference coherence.
  3.  **Assessing "Sufficient" Coherence:** Judging when incoherence is severe enough for DND.
  4.  **Plausibility of Future Scenarios:** Selecting and weighting relevant future contexts for extrapolation.
  5.  **Synthesizing Extrapolated Volition:** Combining informed preferences, core values, and future contexts into a coherent "would want" statement.
  6.  **Value Weighting in Deliberation:** Balancing competing core values (e.g., current burden vs. future benefit, autonomy vs. prescribed benefit) during committee debate.
  7.  **Threshold for "Unresolvable" Conflict:** Deciding when deliberation cannot overcome fundamental value differences.

  **Hard Limits of the Procedure:**
  1.  **Value Construction vs. Discovery:** It structures discovery of *coherent* preferences based on *existing* underlying values. It **cannot** resolve conflicts where values themselves are constructed through the commitment process or are fundamentally incompatible (e.g., strong individualism vs. strong communitarianism). Deliberation is crucial here.
  2.  **Pluralism & Incompatible Orderings:** Even after coherence, multiple, equally rational preference orderings may exist based on different weightings of core values. The procedure identifies this ambiguity (leading to DND) but **cannot** magically create a single "correct" ordering.
  3.  **Predictive Uncertainty:** Extrapolation relies on modeling plausible futures. It **cannot** eliminate deep uncertainty about distant socio-technical-economic conditions.
  4.  **Non-Preference Values:** It focuses on volition. It **cannot** directly incorporate independent ethical principles (e.g., rights, strict justice) unless they are reflected in stakeholder values.
  5.  **Burden of Proof:** It shifts burden towards justifying imposition *against* extrapolated future volition, but **cannot** definitively prove what future people "truly" want. It mitigates, not eliminates, the epistemic challenge of acting for the future. The **DND** output is a critical feature acknowledging these limits.
