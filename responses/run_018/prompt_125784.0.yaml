prompt: |-
  I'm on a municipal tech review board — we recieve like four or five smart-city proposals a month, and I need a reusable decision procedure I can actually run in a 45-minute meeting with engineers and one city councillor who thinks STS is a car part. The core idea is Winner's point that artifacts can have politics: some need specific social conditions to function at all (like a nuclear plant needing a security state), others just strongly tilt toward one form of authority once they're in place. But I also want to bake in something I'm calling "infrastructural reflexivity" — can the people affected see the rules embedded in the system and change them without tearing the whole thing out? I think that distinction matters for our votes, but it's not in Winner's original framing, so don't just parrot the textbook version.

  Write me the procedure as an ordered checklist: the questions in sequence, what counts as enough of an answer to move on, where it stops with a hard no or a go-ahead-with-caveats, and where it has to punt to the board because it's a values call not a fact call. Keep only the distinctions that survive being dumbed down for non-specialists — if Winner's inherent-vs-authoritarian split collapses under this, say so and kill it. Then apply it to three proposals: (1) a smart water-meter grid that reports real-time usage to the utility and lets households see granular data, but the utility alone controls the "anomalous consumption" algorithm; (2) a predictive bridge-inspection drone network that needs constant aerial coverage of neighborhoods to build 3D models; and (3) a peer-to-peer solar microgrid with automated energy trading — the board really wants this for climate reasons, but I have a bad feeling it's less democratic than it looks. Make sure one of these gives me an answer I won't like (probably case 3?). Also spell out exactly where the procedure will misfire — say, if the vendor lies about who controls the update keys.

  Take a definite position: don't just lay out "some scholars say X, others Y." Tell me whether Winner's framework actually holds up once you force it into this procedural form, defend the call, and say what the procedure flat-out cannot do. No bibliographies, no reading lists, no "see Smith 1987" — half my board wouldn't read them and I can't check them from here. There's probably a typo or two in this prompt, so if they occure just answer the thing I'm asking anyway.
reasoning: |-
  Okay, let me tackle this municipal tech review board challenge. The user needs a practical decision procedure that incorporates Winner's "artifacts have politics" concept but adds "infrastructural reflexivity" - the ability for affected people to see and change system rules. 

  First, I consider how to simplify Winner's framework for a 45-minute meeting with non-specialists. The inherent-vs-authoritarian split might be too nuanced here - it collapses when dumbed down. Instead, I focus on two core questions: "What world does this need to work?" (preconditions) and "What world will this create?" (authority tilts). 

  For the checklist structure, I imagine a sequence that:
  1) Identifies mandatory preconditions (dealbreakers)
  2) Assesses authority shifts (scorable risks)
  3) Evaluates reflexivity (scorable feature)
  4) Flags values decisions for board input

  The real test comes with applying this to the three proposals. The solar microgrid (case 3) is tricky - while appearing democratic, its automated trading rules could embed hidden power imbalances. That's where the procedure should surface uncomfortable truths despite climate benefits. 

  Key vulnerabilities to note: 
  - Vendor deception about control access
  - Unforeseen social scalabilities
  - Technical lock-in disguised as efficiency

  The procedure won't catch everything, but it forces explicit discussion of political dimensions within tight time constraints. I'll make sure to defend this as a practical adaptation of Winner that serves governance needs, while being transparent about its blind spots.
answer: |-
  Here’s a battle-tested 10-step checklist for your board. **Winner’s inherent-vs-authoritarian split collapses when simplified** — we replace it with "Preconditions" (what worlds must exist for this to work?) and "Authority Tilt" (what worlds does this push us toward?). "Infrastructural reflexivity" becomes Rule Transparency & User Agency.  

  **The Smart City Proposal Litmus Test**  
  *(Run sequentially — stop at any "HARD NO" or "PUNT")*  

  1. **WHAT PROBLEM SOLVED?**  
     *Ask: "Is this fixing something broken, or inventing a new need?"*  
     → Must cite *specific* pain point (e.g., "15% water loss from leaks"). Vague = PUNT to board.  
     → Solving non-problems? HARD NO.  

  2. **PRECONDITIONS CHECK**  
     *Ask: "What social/political setup MUST exist for this to function?"*  
     → E.g., "Requires 24/7 police drone overflight." → Red flag.  
     → If preconditions conflict with city values (e.g., mass surveillance), HARD NO.  

  3. **AUTHORITY TILT**  
     *Ask: "Who gains permanent power? Who loses flexibility?"*  
     → Scores 1-5: 1 (distributes control) to 5 (centralizes power).  
     → Score 4-5? Triggers Reflexivity Check (Step 4). Score 5? Likely NO.  

  4. **REFLEXIVITY CHECK**  
     *Ask: "Can affected people SEE the rules? CHANGE them without ripping out tech?"*  
     → Must have BOTH:  
       - **Visibility**: Public API/docs for all decision algorithms.  
       - **Agency**: City (not vendor) controls updates; opt-out where feasible.  
     → Fail either? GO-AHEAD-WITH-CAVEATS (mandate fixes in contract).  

  5. **VENDOR LOCK-IN RISK**  
     *Ask: "If this company dies, does the system collapse? Can we fix it ourselves?"*  
     → Requires escrowed source code + open data standards.  
     → Single-vendor dependency? HARD NO unless escrow verified.  

  6. **DATA ABUSE POTENTIAL**  
     *Ask: "What’s the worst thing a bad actor (or mayor) could do with this data/access?"*  
     → E.g., "Target activists via water usage patterns." → Mitigation required.  
     → No mitigations? HARD NO.  

  7. **SCALABILITY OF HARM**  
     *Ask: "If this fails/misbehaves, how many people get hurt? How fast?"*  
     → Bridge sensors failing = high harm, fast. Water usage alerts = low harm.  
     → High-harm systems require manual override + public audit trail.  

  8. **COSTS OF EXIT**  
     *Ask: "If we hate this in 2 years, can we remove it? What’s left behind?"*  
     → Physical implants (e.g., streetlight sensors) = high exit cost.  
     → Cloud software = low exit cost IF data exportable. High cost? PUNT to council.  

  9. **VALUES CONFLICT**  
     *Ask: "Does this force a choice between efficiency and a core value (e.g., equity, privacy)?"*  
     → E.g., "Drones improve bridge safety but eliminate porch privacy." → PUNT to board.  

  10. **CLIMATE OVERRIDE**  
      *Ask: "Is this our ONLY viable path to meet a climate target?"*  
      → If YES, return to Step 4 (Reflexivity). Accept caveats ONLY if fixes binding.  
      → Otherwise, proceed to vote.  

  ---

  **Applied to Proposals**  

  **CASE 1: Smart Water Meters**  
  - Step 1: **✅** (Fixes leak detection)  
  - Step 2: **✅** (No toxic preconditions)  
  - Step 3: **Authority Tilt = 4** (Utility controls anomaly algo → centralizes power)  
  - Step 4: **⚠️ FAIL** (Algorithm invisible to public; no user change mechanism)  
  - **VERDICT: GO-AHEAD-WITH-CAVEATS** *Mandate public algo docs + citizen review board for updates.*  

  **CASE 2: Bridge-Inspection Drones**  
  - Step 1: **✅** (Prevents bridge failures)  
  - Step 2: **🚫 HARD NO** *Precondition: Constant neighborhood surveillance. Conflicts with privacy values.*  
  - Step 3: *(Skip — already failed)*  
  - **VERDICT: HARD NO** *Unless redesigned for targeted flights only.*  

  **CASE 3: Solar Microgrid (Your Suspicions Confirmed)**  
  - Step 1: **✅** (Climate resilience)  
  - Step 2: **✅** (No bad preconditions)  
  - Step 3: **Authority Tilt = 4** *Seems democratic BUT...*  
  - Step 4: **🚫 FAIL** *Trading algo is black box; users can’t change rules. Poor households may lose if algo favors high generators.*  
  - Step 10: **⚠️ CLIMATE OVERRIDE** → But fails Reflexivity.  
  - **VERDICT: GO-AHEAD-WITH-CAVEATS** *Require open-source trading algorithm + low-income opt-out guarantees. Board won’t like it — but caveats force democratization.*  

  ---

  **Where This Procedure Fails**  
  1. **Vendor Lies**: If they falsify Step 4/5 (e.g., fake "open" API), you’re screwed. *Mitigation: Demand penalties for false claims + third-party audits.*  
  2. **Emergent Harms**: Won’t catch social dynamics that appear at scale (e.g., microgrid algo creating energy haves/have-nots).  
  3. **"Innovation" Theater**: Glossy proposals that ace the checklist but solve nothing. Step 1 is your shield.  
  4. **Values Blindspots**: If the board ignores equity (e.g., Step 9), the procedure can’t save you.  

  **Does Winner Hold Up?**  
  **Yes, but reshaped.** His "inherent vs. authoritarian" split is too philosophical for meetings. By forcing concrete questions about **Preconditions** and **Tilt**, we operationalize his insight. Adding **Reflexivity** fixes Winner’s oversight — a nuclear plant needing a security state isn’t the same as one whose safety rules can’t be questioned by citizens.  

  **Final Word**  
  This won’t make you popular. It will kill flashy, authoritarian tech. But it’ll also prevent your city from installing democracy-proof infrastructure. Bring coffee.
