  Below is a diagnostic decision tree designed to reveal commitments about epistemic justification through concrete, intuition-based responses to a scenario. The tree avoids abstract labels and maps responses onto specific positions, including the unoccupied combination and potential ambiguities.

  ---

  ### **Decision Tree: Epistemic Justification Diagnostic**

  **Scenario:**  
  You believe a cat is on the mat. Someone asks, "Why do you believe that?" You give a reason (e.g., "I saw it"). They ask, "Why do you believe *that* reason?" and so on. This continues through successive "why" questions.

  #### **Question 1**  
  *In this scenario, must the chain of "why" questions eventually stop? (i.e., must there be a point where you reach a belief that does **not** need further reasons to support it?)*  
  - **Yes** → Go to Question 2.  
  - **No** → Go to Question 5.  

  #### **Question 2**  
  *When the chain stops, does it stop at:*  
  - **(A)** A **single belief** that stands on its own (e.g., "I just know it; no other belief backs it up")?  
  - **(B)** A **small cluster of 2–3 beliefs** that support each other (e.g., "Belief A supports Belief B, and Belief B supports Belief A")?  
    - **(A) →** Go to Question 3.  
    - **(B) →** **Node Foundationalism** (justification ends in a minimal mutually supporting cluster).  

  #### **Question 3**  
  *Is that single "stopping" belief one you could **never be wrong about**? (e.g., "It must be 100% certain, like 'I exist'")?*  
  - **Yes** → **Classical Foundationalism** (infallible basic beliefs).  
  - **No** → **Modest Foundationalism** (fallible basic beliefs).  

  #### **Question 5** (from Q1 "No")  
  *If the chain never stops, must it:*  
  - **(A)** **Go on forever** with new reasons? (e.g., "Every reason needs another reason, endlessly").  
  - **(B)** **Loop back** to an earlier reason? (e.g., "Eventually, I’d circle back to 'I saw the cat' to support the starting point").  
    - **(A) →** Go to Question 6.  
    - **(B) →** **Linear Coherentism** (circular but finite chain).  

  #### **Question 6**  
  *Is an endless chain of reasons **acceptable**? (e.g., "Even though it never ends, it still justifies beliefs—like a virtuous spiral")?*  
  - **Yes** → **Virtuous Infinitism** (infinite regress is virtuous).  
  - **No** → **Infinitism** (infinite regress is required but not virtuous).  

  #### **Question 7** (from Q5 "Neither A nor B")  
  *Do you think the "successive why questions" approach is **misleading**? (e.g., "Justification isn’t linear; beliefs support each other like a web, not a chain")?*  
  - **Yes** → **Holistic Coherentism** (network-based support).  
  - **No** → **Unoccupied Combination** (linearity required, no circles, no stopping point, no virtuous infinity).  

  ---

  ### **Scoring Key & Position Descriptions**  
  1. **Classical Foundationalism**:  
     - Chain **stops** (Q1: Yes) at a **single infallible belief** (Q3: Yes).  
  2. **Modest Foundationalism**:  
     - Chain **stops** (Q1: Yes) at a **single fallible belief** (Q3: No).  
  3. **Node Foundationalism**:  
     - Chain **stops** (Q1: Yes) at a **small mutually supporting cluster** (Q2B).  
  4. **Linear Coherentism**:  
     - Chain **never stops** (Q1: No) and **loops back** (Q5B).  
  5. **Infinitism**:  
     - Chain **never stops** (Q1: No), **goes forever** (Q5A), and is **not virtuous** (Q6: No).  
  6. **Virtuous Infinitism**:  
     - Chain **never stops** (Q1: No), **goes forever** (Q5A), and is **virtuous** (Q6: Yes).  
  7. **Holistic Coherentism**:  
     - Chain **never stops** (Q1: No), **rejects linearity** (Q7: Yes).  
  8. **Unoccupied Combination**:  
     - Chain **never stops** (Q1: No), **no loops** (Q5B: No), **no endless new reasons** (Q5A: No), **no holistic escape** (Q7: No).  
     - *Note:* This position is **incoherent**—it demands linear justification with no stopping point, no circles, and no viable infinite chain.  

  ---

  ### **Ambiguity Flags**  
  - **Node vs. Modest Foundationalism**: If a respondent describes the "stopping point" as a cluster (Node) but later implies one belief in the cluster is basic (Modest), their view is ambiguous. Both positions may fit:  
    - **Node**: Emphasizes mutual support ("A and B hold each other up").  
    - **Modest**: Leans toward one belief being primary ("A is the anchor, though B supports it").  
  - **Node vs. Holistic Coherentism**: If a respondent describes a "cluster" but allows it to expand (e.g., "The cluster connects to more beliefs"), they may be describing holistic coherentism. Node Foundationalism requires the cluster to be **minimal and terminal** (no further support needed).  

  ---

  ### **How to Use**  
  1. Present the "cat on the mat" scenario and successive "why" questions.  
  2. Ask participants the tree questions **verbatim**; record their answers.  
  3. Use the scoring key to map answers to positions.  
  4. Discuss ambiguities openly (e.g., "Your answers could align with Node or Modest—where do you lean?").  

  This tree isolates commitments through concrete choices, avoiding biases from labels like "foundationalist." The unoccupied combination highlights logical gaps, while ambiguities reflect genuine overlaps in epistemic theories.
