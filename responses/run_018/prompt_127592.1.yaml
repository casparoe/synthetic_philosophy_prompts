prompt: |-
  Hey — I'm writing a feature on evolutionary cooperation and keep tripping over the same logical knot (think there's a typo in step 5, but bear with me):

  (1) In the iterated prisoner's dilemma, tit-for-tat is evolutionarily stable against pure defection only if the shadow-of-the-future parameter w exceeds (T-R)/(T-P).

  (2) That result is strictly about population dynamics: it tells us which strategy frequencies survive, not what any individual player ought to do.

  (3) But contractarian philosophers often borrow it normatively, treating "evolutionarily stable" as equivalent to "individually rational."

  (4) Apply that borrowed rule to a genuinely one-shot, anonymous interaction: here w = 0, so cooperation is irrational and defection is required.

  (5) Now add indirect recipricity — even in a single encounter, observers can score your behavior and shift your future payoffs with them. So your personal effective w is never actually zero.

  (6) By the rule in (3), that means cooperation is always rational for anyone inside a social network, regardless of the opponent's strategy.

  (7) In particular, even facing a known exploiter where you could defect unseen, the reputation cost with onlookers still pushes your effective w above the threshold.

  (8) So the evolutionary-normative bridge implies defection is never permissible for social agents — which proves way too much.

  Which step is actually the weak link, and what does giving it up cost? I'd like to keep the evolutionary science intact if I can, but I can't swallow the conclusion that defection is always forbidden.

