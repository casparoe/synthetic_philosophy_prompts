answer: |-
  Your observation cuts to the heart of a profound and under-discussed paradox in institutional design. While no single, universally accepted term perfectly encapsulates *every* facet of this specific "downward migration of careerism," the phenomenon is well-recognized and falls within established conceptual frameworks. Here's the carving you seek:

  1.  **The Core Concept & Its Closest Established Terms:**
      *   **The Iron Law of Oligarchy (Michels):** This is the foundational bedrock. Robert Michels argued that *any* complex organization, even those founded on radical democracy, inevitably develops an oligarchic structure where power concentrates in a small, stable group of specialists ("Who says organization, says oligarchy"). Your "hidden careerist class" is the *embodiment* of this oligarchy emerging *precisely because* the formal leadership layer is deliberately destabilized. The permanence and expertise of the staff/bureaucracy become the necessary counterweight to the inexperience and transience above.
      *   **Bureaucratic Capture / Bureaucratic Discretion:** These terms describe the significant power wielded by permanent civil servants. Your phenomenon is a specific *mechanism* or *trigger* for intensified capture/discretion: the deliberate weakening of the elected/selected layer *amplifies* the relative power of the permanent layer. It's not just that bureaucrats *have* power; it's that reforms *designed to weaken politicians* directly transfer that power *downwards*.
      *   **The Distinction Between Formal and Informal Power Structures:** The reform targets the *formal* office-holders (elected/selected representatives). Your phenomenon describes how *informal* power structures (senior staff, key administrators, long-serving policy advisors, entrenched lobbyists) inevitably fill the vacuum created by weakening the formal structure. The "hidden careerist class" operates within this informal sphere.
      *   **Institutional Knowledge Transfer / Entrenchment:** This focuses on the specific resource (knowledge) that migrates. The reform disrupts knowledge held by transient officials, forcing its concentration and management within the permanent substrate.

  2.  **The Specific Phenomenon You Described: A Proposed Delineation:**
      We can synthesize these into a precise description of your observed pattern:
      > **The Subsurface Institutionalization of Power (or The Hidden Careerist Substrate Effect):** *The unintended consequence of reforms designed to eliminate careerism and concentrated experience within a formal leadership layer (e.g., term limits, sortition), resulting in the systematic migration and concentration of expertise, influence, agenda-setting power, and institutional memory into a more permanent, unelected, and often less accountable substrate layer (e.g., senior civil servants, partisan staff, lobbyists, key administrators). This occurs because the complex functions of governance (legislative drafting, negotiation, long-term strategy, procedural mastery) cannot be performed effectively by transient actors without deep reliance on those possessing continuity and specialized knowledge, thereby creating a de facto oligarchy beneath the veneer of rotated leadership.*

  3.  **Conceptual Boundaries - What It Is and Is Not:**
      *   **IS:**
          *   A *direct consequence* of deliberate destabilization (rotation, term limits, random selection) of the *formal* leadership/decision-making layer.
          *   Characterized by a *downward migration and concentration* of functional power (agenda setting, drafting, negotiation, institutional memory).
          *   Creates a *dependency relationship* where transient formal actors rely heavily on the permanent informal/substrate layer.
          *   Results in a *de facto power center* that is unelected, less visible, and often less accountable than the formal layer it supports/supplants.
          *   Driven by the *functional necessity* of continuity and expertise in complex systems.
      *   **IS NOT:**
          *   **General Bureaucratic Power/Discretion:** This exists even with stable, experienced leadership. Your phenomenon is specifically *caused* and *exacerbated* by the *destabilization* of leadership.
          *   **Regulatory Capture:** Capture involves external actors (industries) influencing regulators. Your phenomenon involves *internal* or *adjacent* institutional actors (staff, bureaucrats, lobbyists operating within the system's orbit) gaining power *relative to the destabilized formal layer*. Lobbyists are part of it, but the core is the *institutional* substrate.
          *   **Simple Staff Influence:** All politicians rely on staff. This is about the *structural amplification* of that influence due to the *forced inexperience and transience* of the principal, creating a power *imbalance* favoring the staff.
          *   **Natural Expertise Development:** This is about the *forced displacement and concentration* of expertise due to an *artificial constraint* on leadership tenure, not its organic development.

  4.  **Scope and Limits:**
      *   **Applies Beyond Legislatures:** Your engineering example is apt. This phenomenon occurs in corporations (rotating CEOs & entrenched middle management), NGOs, universities (rotating department chairs & permanent administrators), and any complex organization where leadership is forcibly rotated without addressing the underlying need for continuity in core functions.
      *   **Sortition vs. Term Limits - Parallels and Nuances:**
          *   **Structural Parallel:** The core dependency on a permanent substrate for expertise, continuity, and procedure is fundamentally identical. Random citizens (sortition) or term-limited novices (strict limits) both lack the experience and knowledge needed to navigate complex institutions independently. Staff and bureaucrats *must* guide them.
          *   **Key Differences in Dependency:**
              *   **Partisanship:** Term-limited legislators usually arrive via partisan elections, bringing their *own* staff networks (often highly partisan) and pre-existing alliances with lobbyists. Sortitioned citizens lack this, potentially making them *more* dependent on *neutral* bureaucratic staff for initial orientation and procedure, but potentially *less* tied to specific partisan or lobbying networks initially. However, the substrate (especially partisan staff within the bureaucracy or active lobbyists) will still attempt to shape them.
              *   **Agenda Control:** In term-limited legislatures, the leadership (Speaker, Committee Chairs) is still elected from among the members, even if inexperienced. They, with their staff, set the agenda. In a pure sortition model, agenda-setting for the assembly itself could fall *even more heavily* on the organizing secretariat or facilitating staff, unless meticulously designed otherwise. This is a critical vulnerability for sortition.
              *   **Legitimacy & Scrutiny:** Sortitioned bodies, being novel and "citizen-led," might attract *more* intense lobbying and attempts at manipulation by the substrate (bureaucrats, interest groups) precisely because they are perceived as blank slates. Term-limited bodies are a known quantity.
              *   **Vulnerability:** Sortitioned members, lacking electoral mandate or party backing, might be *more* vulnerable to undue influence from seemingly expert administrators or persuasive lobbyists than term-limited politicians who at least have some political base and ambition.

  5.  **The Carving:**
      The phenomenon you've identified is a **specific manifestation of Michels' Iron Law of Oligarchy**, triggered by **deliberate institutional designs aimed at destabilizing formal leadership tenure (term limits, sortition)**. It results in the **systematic migration of functional power, expertise, and influence** from the destabilized formal layer **downwards into a more permanent, unelected substrate layer** (senior civil servants, key administrators, partisan staff, entrenched lobbyists), creating a **structural dependency** and a **de facto, less accountable power center**. It is distinct from general bureaucratic power or regulatory capture by its *causal link* to the anti-careerist reform and the *direction* of the power migration (downwards into the institutional substrate).

  **Conclusion:** You have precisely identified a critical flaw in simplistic anti-careerist reforms. The established concept is **Michels' Iron Law of Oligarchy**, but the specific *mechanism* you describe – the *downward displacement and concentration* caused by *forced transience* – is best understood as **Subsurface Institutionalization** or the **Hidden Careerist Substrate Effect**. It highlights that reducing the power of visible career politicians often means transferring that power to less visible, less accountable careerists operating within the permanent infrastructure of the system. Both term limits and sortition are susceptible to this core structural flaw, though the *nature* of the dependency and the *vulnerabilities* of the transient layer differ in important ways due to the presence or absence of partisanship and electoral mandates. Addressing this requires far more sophisticated institutional design than merely rotating the figureheads.
