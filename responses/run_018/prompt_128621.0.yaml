prompt: |-
  Write a satirical architecture decision record (ADR) in the deadpan voice of a senior software engineer with no formal philosophy training, reviewing the post-deployment status of a “Mental Causation Module” (MCM) inside a system that enforces strict physical closure. The memo should run approximately 650 words and follow standard engineering sections—Status, Background, The Exclusion Event, Proposed Resolutions, and Conclusion—formatted with headers and bullet points. The satire targets the causal exclusion argument in philosophy of mind: the idea that because every physical event already has a sufficient physical cause within a closed physical domain, mental causes are either redundant (producing overdetermination) or causally inert (producing epiphenomenalism). The comedy must arise from translating this logic with technical precision rather than caricature—physical closure should appear as “no external API ingress,” mental states as “shadow microservices that subscribe to neural events but never publish to them,” supervenience as “eventual consistency with zero write permissions,” and overdetermination as “duplicate webhook deliveries that the physical load balancer drops silently.” Invent two colleagues: “Priya from the Ontology Team,” who defends the module as “phenomenologically loud but causally mute,” and “Marcus from Platform,” who argues for decommissioning it to free compute, since the physical pipeline already handles 100% of endpoint execution. The narrator must remain deadpan and never slip into interactionism or compatibilism unless that slip is itself the punchline—perhaps Marcus briefly suggests a “compatibilist middleware layer” and is immediately overruled by the closure policy. End with a formal decision to retain MCM in “read-only observability mode”: it logs intentions and generates user-facing reports, but all causal pathways remain gated through the physical layer, and removing it would break “experience telemetry” without altering any system outputs. A philosopher familiar with Jaegwon Kim’s exclusion problem should recognize the exact structure being parodied; a non-specialist should read it as a satire of bureaucratic redundancy in distributed systems. Do not request citations, bibliographies, or named primary texts. Do not invoke obscure philosophical literature that would not be well-represented in general pretraining data; keep references to broadly recognized concepts (closure of the physical, supervenience, epiphenomenalism, mental causation). You may coin internal engineering neologisms—such as “closure-gated endpoints” or “epiphenomenal logging”—provided they are clearly anchored to the philosophical concepts being satirized. Maintain an internal consistency that respects the logic of the exclusion argument throughout.
