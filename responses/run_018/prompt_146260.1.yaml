answer: |-
  Your observation captures a profound flaw in naive applications of the ITN framework—a self-reinforcing epistemic trap that **lacks a universally accepted name** but is increasingly recognized in effective altruism and policy analysis. Below is a breakdown of its mechanics, boundaries, and counter-strategies:

  ### Core Problem: The **Neglect-Tractability Loop**
  A circular heuristic where:
  - **Neglect → Inferred Intractability**: "If it were solvable, someone would have done it already" (without evidence of *why* it's hard).
  - **Effort → Inferred Low Neglectedness**: "If many are working on it, it must not be neglected."
  This creates a catch-22 that filters out novel high-impact opportunities.

  ---

  ### Distinguishing From Legitimate Updates
  | **Legitimate Bayesian Update**          | **Neglect-Tractability Loop**          |
  |-----------------------------------------|----------------------------------------|
  | Uses *specific evidence* of hidden blockers (e.g., failed trials, regulatory post-mortems). | Treats neglect *itself* as sufficient evidence. |
  | Updates based on *domain expertise* (e.g., "Phase 3 trials failed due to metabolite toxicity"). | Generic skepticism detached from mechanism. |
  | Considers *access to private information* (e.g., insiders know a approach is flawed). | Assumes the *mere absence* of effort implies informed consensus. |

  ---

  ### Key Boundaries & When It Applies
  1. **Scope**: 
     - Primarily affects **resource allocation frameworks** (ITN, ROI calculations, prioritization matrices).
     - Triggered when **neglectedness is observable** but **tractability is uncertain**.
     - Rare in domains with clear physics/engineering constraints (e.g., bridge-building).

  2. **Adverse Selection vs. This Loop**:  
     - **Adverse selection** assumes *known* risks cause rational actors to avoid a domain (e.g., funders shunning malaria because of past failures).  
     - **This loop** assumes *unknown/unproven* risks solely because others haven’t tried—**confusing absence of evidence for evidence of impossibility**.

  ---

  ### Breaking the Loop: Practical Responses
  1. **Demand Mechanism Identification**:  
     - "What *specific* blocker do you suspect? Institutional inertia? Misaligned incentives? Undetected technical flaw?"  
     - If no plausible mechanism is offered, reject the downgrade of tractability.

  2. **Test for "Proof of Concept"**:  
     - If similar solutions worked in analogous contexts (e.g., a diagnostic tool succeeded for Disease X in another country), neglect elsewhere may stem from **coordination failures**—not intractability.

  3. **Invert the Burden of Proof**:  
     - "If neglect *isn’t* evidence of intractability here, what *would* convince you this is tractable?"  
     - Forces critics to articulate falsifiable criteria.

  4. **Seek Positive Evidence of Neglect**:  
     - Map stakeholders: Is neglect due to **lack of awareness** (e.g., new tech), **perverse incentives** (e.g., patent blockers), or **genuine impossibility**?  
     - Example: CRISPR diagnostics were "neglected" for tropical diseases not because they’re intractable, but because pharma ROI models ignored low-income markets.

  ---

  ### Related Concepts & Partial Synonyms
  - **Streetlight Effect**: Over-prioritizing areas where effort is visible (e.g., well-funded fields) while ignoring darker zones—even if high-impact.  
  - **Effort Heuristic**: Mistaking current resource distribution as optimal ("If it mattered, we’d see more investment").  
  - **Inference from Absence Fallacy**: Concluding a solution *can’t* exist because it *hasn’t* been found—a known failure mode in scientific history (e.g., "heavier-than-air flight is impossible").

  ---

  ### Why This Matters
  This loop systematically **discounts innovation**:  
  - **False negatives**: Dismisses high-impact, solvable problems (e.g., early vaccine patents languished for 30 years).  
  - **Status quo bias**: Rewards incremental work in crowded fields.  
  - **Paradox**: Interventions must be "neglected-but-not-*too*-neglected" to survive scrutiny—an unstable equilibrium.

  **Solution**: Treat ITN not as a formula but as a hypothesis generator. Use neglect as a flag for investigation—not proof of difficulty. Document when this loop occurs; its recurrence in your exercises suggests a need for explicit guardrails in prioritization workflows.
