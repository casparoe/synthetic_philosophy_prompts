prompt: |-
  Is there a name for this pattern i keep seeing in equality debates? Someone starts arguing we should distribute resources equally -- cash, goods, whatever -- and then when you point out people convert that stuff into wellbeing differently (expensive meds, mobility needs, etc.), they pivot to "actually equality is about capabilities or welfare, not just resources." But then when you ask what policy they actually want, it's back to the flat cash transfer, like the capability point was just a rhetorical shield. It's not quite equivocation because both metrics seem sincerely held; it's more like using the richer metric to absorb objections while the thinner metric does all the practical work. Is there an established concept for this exact move, and if not can you name and define it in a way that separates it from plain inconsistency or from the standard resources-vs-capabilities debate?
reasoning: |-
  Okay, the user is describing a specific pattern they've noticed in equality debates. Let me start by understanding what they're seeing. Someone argues for equal distribution of resources, like cash transfers. Then when challenged that people have different needs (like medical costs or disabilities), they shift to saying equality should be about capabilities or welfare. But when asked for concrete policies, they revert to the original cash transfer idea. The user wants to know if there's a name for this tactic.

  First, I need to recall relevant philosophical concepts. Rawls' primary goods, Sen's capabilities approach, Dworkin's resource equality. The pivot from resources to capabilities is a key move here. The user mentions it's not just inconsistency but a strategic shift. The term "capability-washing" comes to mind—using capabilities as a shield but not implementing it. 

  I should also consider related terms like motte-and-bailey. That's a fallacy where someone retreats to a defensible position when challenged. Here, the capability argument is the motte (safe), and the cash transfer is the bailey (vulnerable). But the user wants something more specific to this equality debate context. 

  The deeper issue might be the gap between theoretical metrics and practical policies. The user suspects the debater isn't committed to addressing heterogeneous needs. They want a term that captures this evasion. "Metric laundering" could work, implying hiding behind a sophisticated metric. Or "capability laundering," borrowing from greenwashing. 

  Also, check if there's existing terminology in political philosophy. Maybe "distributive dissonance" or "conversion evasion" (avoiding the problem of converting resources to welfare). The user wants a term that separates this from general inconsistency, focusing on the strategic pivot in equality arguments. 

  The user's real need might be to articulate this tactic in debates, calling out bad faith arguments. They might be involved in policy discussions where this pattern hinders progress. Naming it gives them a tool to highlight the evasion without getting bogged down in theory.
answer: |-
  That's a brilliantly observed pattern, and you're right – it transcends simple inconsistency or the standard debate. This specific rhetorical maneuver deserves its own label. Here's a breakdown and a proposed term:

  **Core Elements of the Pattern:**

  1.  **Initial Stance (Resource Egalitarianism):** Advocates for equal distribution of a *specific resource* (cash, goods) as the definition of equality.
  2.  **Objection Raised (Heterogeneous Conversion):** Objector points out people have vastly different abilities to convert that resource into well-being or capabilities due to diverse needs (disabilities, health conditions, location, etc.).
  3.  **Pivot (Capability/Welfare Egalitarianism):** Advocate retreats from the resource metric to the *richer, more flexible metric* of capabilities, functionings, or welfare as the *true* goal of equality. This absorbs the objection.
  4.  **Policy Retreat:** When pressed for concrete policy implications of this richer metric, the advocate reverts to promoting the *original, simple resource transfer* as the practical solution, effectively abandoning the complexities raised by their pivot.
  5.  **Function:** The richer metric acts solely as a **rhetorical shield** against objections, while the practical agenda remains firmly rooted in the simpler, resource-based approach. The richer metric does no *real work* in shaping the policy proposal.

  **Proposed Name & Definition:**

  *   **Term:** **Capability Laundering** (or **Welfare Laundering**)
  *   **Definition:** The rhetorical strategy within equality debates where an advocate initially promotes equality of a specific resource (e.g., cash), but when confronted with the problem of heterogeneous conversion (i.e., people needing different amounts of the resource to achieve similar outcomes due to differing circumstances), they pivot to endorsing equality of capabilities or welfare as the *true* goal. However, when specifying concrete policy, they revert back to advocating for the initial, simpler resource-based policy, thereby using the richer, more defensible capability/welfare metric solely to deflect criticism without allowing it to substantively inform or alter their practical proposal.

  **Why this term works:**

  1.  **Specificity:** It names the *specific* pivot (to capabilities/welfare) and its *specific* function (deflecting objections without substantive policy change).
  2.  **Analogy:** It evokes concepts like "greenwashing" or "pinkwashing," where superficial adherence to a noble principle (environmentalism, LGBTQ+ rights) is used to mask practices that don't genuinely align with it. Here, the superficial appeal to capabilities "launders" the resource-based proposal, making it appear more robust and ethically sound than it is.
  3.  **Captures the Double Game:** It highlights the use of the richer metric purely for defensive rhetorical purposes ("laundering" the proposal's image) while the actual policy remains unchanged.
  4.  **Distinguishes from Related Concepts:**
      *   **Plain Inconsistency:** This is more strategic and patterned. The pivot *is* consistent with the *stated ultimate goal* (equality), but inconsistent in how it's applied to policy. "Laundering" implies a deliberate tactic.
      *   **Motte-and-Bailey Fallacy:** This is very close! The capability argument is the easily defensible "motte," while the cash transfer is the more vulnerable/desirable "bailey." However, "Capability Laundering" is *more specific*:
          *   It specifies the *content* of the motte (capabilities/welfare).
          *   It emphasizes the *policy retreat* as the key action, not just the defensive pivot.
          *   It highlights the *function* of making the weaker proposal appear stronger ("laundering").
      *   **Standard Resources-vs-Capabilities Debate:** This pattern exploits that debate. It uses the *language* of capabilities to avoid grappling with its *implications* for resource distribution policy. It's a *misuse* of the debate.

  **Alternative Names (less preferred but possible):**

  *   **Distributive Dissonance:** Highlights the gap between stated metric (capability) and policy metric (resource).
  *   **Conversion Evasion:** Focuses on avoiding the issue of heterogeneous resource-to-wellbeing conversion.
  *   **The Capability Shield:** Emphasizes the purely defensive role of the capability argument.
  *   **Metric Laundering:** More general, but loses the specific context of capabilities.

  **Why this Pattern Matters:**

  It reveals a potential lack of genuine engagement with the core problem of diversity of need. The advocate might:
  *   Be intellectually lazy, avoiding the harder work of designing policies sensitive to heterogeneous conversion.
  *   Prioritize political simplicity/marketing of a flat transfer over nuanced justice.
  *   Hold an unacknowledged belief that heterogeneity is either insignificant or will be magically solved by markets/individual choice once resources are equalized.
  *   Be arguing in bad faith, using the richer metric solely to win arguments.

  **In short:** You've identified a distinct and common rhetorical sleight-of-hand. **"Capability Laundering"** effectively names the tactic of using the sophisticated language of capabilities or welfare equality solely as a shield against objections to a simplistic resource-egalitarian policy, without allowing that sophisticated understanding to meaningfully shape the policy itself. It's the egalitarian equivalent of greenwashing.
