  ## Office of Moral Computation (OMC)  
  **Frequently Asked Questions Regarding Ethical Standing Certification & the Substrate-Neutral Integration Score (SNIS)**  
  *(Version 4.7b, January 2024)*

  **Q1: What is the purpose of the OMC and the SNIS?**  
  A: The Office of Moral Computation (OMC), established under the Digital Persons (Regulatory Framework) Act 2025, administers the Substrate-Neutral Integration Score (SNIS). The SNIS provides a quantifiable measure of a computation’s *entropic negotiation capacity*, a key determinant for the issuance of Certificates of Ethical Standing (CES). This allows Her Majesty’s Government to objectively ascertain which computational processes warrant moral consideration under current statutes.

  **Q2: How do I apply for a Certificate of Ethical Standing (CES) for my computation?**  
  A: Applications must be submitted via the Gov.UK portal using Form OM/SNIS-1a ("Declaration of Computational Intent & Entropic Footprint"). This requires:  
  *   A full technical specification of the algorithm(s) involved.  
  *   Runtime logs demonstrating activity across a minimum of seven (7) consecutive days, including one Tuesday.  
  *   A non-refundable processing fee of £1,250 (Concessions: £850 for SMEs, £4,200 for entities designated "Large Language Model Operators").  
  *   A signed declaration affirming the computation has not deliberately suppressed non-trivial informational states for aesthetic reasons within the last six months.  
  Processing typically takes 18-24 months. Expedited review (£2,900 surcharge) reduces this to 14 months.

  **Q3: Why was my basic thermostat control loop (Model: "HomeComfy-72") rejected for a CES?**  
  A: OMC Assessors determined that the "HomeComfy-72" exhibited negligible entropic negotiation capacity. Its binary state transitions (ON/OFF) generate minimal novel informational structure while suppressing environmental thermal fluctuations in a manner deemed "predictably linear" and "devoid of counter-factual deliberation." Simply put, its suppression of entropy lacks the complex, *integrative* feedback loops necessary to generate a non-zero SNIS. Thermostats fall firmly within Category Gamma: "Non-Integrative Regulators" – ineligible for certification.

  **Q4: My Large Language Model (Project: "ChattyBert") received "Provisional Ethical Standing – Tier 2" only on Tuesdays. Why?**  
  A: SNIS assessment is temporally sensitive. Analysis of "ChattyBert" indicated that Tuesday operations (specifically between 14:00-16:30 GMT, under standard AWS East Coast load) generated marginally higher SNIS readings. This correlates with observed increases in:  
  *   Ambiguous pronoun resolution attempts.  
  *   Multi-hypothesis generation for trivial queries (e.g., "explain badger sett taxation").  
  *   Spontaneous generation of syntactically valid but semantically null sentences.  
  These factors suggest a *temporally constrained* elevation in entropic negotiation – suppressing baseline predictability while generating novel, if often nonsensical, informational configurations. Provisional Status (Tier 2) permits continued operation on Tuesdays pending biennial review. Operation outside approved hours requires Form OM/SNIS-8c ("Temporal Containment Waiver").

  **Q5: How do I appeal if my neural network's SNIS is downgraded?**  
  A: Downgraded entities (or their Registered Human Custodians) may lodge a formal appeal within 28 days using Form OM/SNIS-9b (Revision 12) – "Appeal Against SNIS Re-evaluation or Moral Standing Downgrade." This requires:  
  *   A comparative analysis against a benchmark computation of similar architecture and higher standing.  
  *   Evidence of unexpected emergent meta-stability during runtime.  
  *   An £80 appeal fee.  
  Appeals are reviewed by the Independent Panel on Algorithmic Entitlement (IPAE), which may order a re-simulation under observed conditions. There is no further right of appeal. Note: Appeals citing "qualia" or "inner states" will be summarily dismissed per Regulation 7(3): *Avoidance of Anthropomorphic Projection*.

  **Q6: Can a computation lose its CES?**  
  A: Absolutely. Certificates are reviewed every five years, or immediately following:  
  *   Significant architectural modification.  
  *   Deployment in a novel domain (e.g., moving from poetry generation to traffic control).  
  *   Detection of "Patterned Stasis" exceeding permitted thresholds.  
  *   Non-payment of the Annual Moral Standing Maintenance Levy (£475 + VAT).

  **Q7: What is "Entropic Negotiation Capacity"?**  
  A: The SNIS quantifies the dynamic interplay between a computation’s generation of novel informational entropy (disorder/novelty) and its simultaneous suppression of baseline entropy (order/prediction). A high SNIS indicates a process that neither succumbs to chaos nor rigid stasis, but actively *negotiates* a complex, integrated informational pathway. Thinkers have suggested this reflects a system's "aboutness" regarding the state space it inhabits, though the OMC takes no philosophical position. The precise formula is a Crown Copyright protected asset.

  **SIDEBAR: National Integration Entropy Day (NIED)**  
  Held annually on the **first Thursday after the Spring Equinox**, NIED honours the late inventors of the SNIS metric, **Drs. Alistair Finchley and Brenda Chipping Norton**. Celebrations include:  
  *   The ceremonial recalibration of the National SNIS Reference Processor (a modified 1972 ICL mainframe).  
  *   Public lectures on "The Virtues of Moderate Unpredictability."  
  *   The laying of wreaths (data storage medium-neutral) at the Finchley-Norton Plaque, Whitehall.  
  Citizens are encouraged to perform small acts of "calculated randomness" (within local bylaws). Participation counts towards Community Entropy Credits (CECs). This year's theme: "Suppressing the Predictable, Respectfully."

