answer: |-
  Here is a strict decision tree mapping the logical space of desert and institutional reward, built from concrete claims/cases, designed to isolate conceptual commitments:

  **Root Question (Node 0): Can someone deserve outcomes significantly influenced by unchosen factors (like innate talent or socioeconomic birth)?**
  *   **Branch A (No):** Desert *cannot* meaningfully apply to outcomes shaped by factors beyond one's ultimate control (e.g., being born gifted or into wealth).
      *   **Node A1 (Compensation Timing): Should institutions actively compensate for unchosen disadvantages *before* assessing desert?**
          *   **Branch A1a (Yes):** Unchosen disadvantages must be neutralized *first*; only *remaining* differentials might be desert-based. (Case: Tax inheritance heavily *before* evaluating anyone's work-based earnings).
              *   **Node A1a1 (Counterfactual Effort): Does "effort" mean *actual* effort, or what effort *would have been* under fair background conditions?**
                  *   **Branch A1a1a (Actual Effort):** Even after compensation, reward based on *actual* effort exerted. (Awkward: Rewards someone born lazy but compensated fairly who remains lazy).
                      *   **Leaf: Unnamed.** (Rare position: Compensation pre-desert, then reward actual effort. Awkward: May reward residual laziness/favoritism enabled by compensated background).
                  *   **Branch A1a1b (Counterfactual Effort):** Reward based on the effort level a person *would have chosen* had they faced genuinely fair conditions from the start. (Case: Reward the diligent disposition they *would have* developed, inferred statistically within groups sharing similar unchosen traits - Roemer). (Awkward: Requires complex statistical modeling of counterfactuals).
                      *   **Leaf: Luck Egalitarianism (Roemer-Type).** (Awkward: Rewarding hypothetical character traits, not necessarily observable actions).
              *   **Node A1a2 (Institutional Aim): After pre-compensation, what should institutions aim for?**
                  *   **Branch A1a2a (Proportional):** Reward remaining differentials proportionally to (counterfactual) effort/contribution. (Awkward: Still allows large inequalities from differences in counterfactual effort).
                  *   **Branch A1a2b (Sufficient):** Ensure everyone has *enough* after compensation; allow inequalities above sufficiency based on effort. (Awkward: Permits large inequalities if basic needs are met).
                  *   **Branch A1a2c (Strict Equality):** After neutralizing unchosen disadvantages, enforce equal outcomes. (Awkward: Strongly disincentivizes effort beyond the minimum).
                      *   **Leaf: Radical Luck Egalitarianism/Pre-Desert Equalization.** (Awkward: May require intrusive state to enforce post-compensation equality).
          *   **Branch A1b (No):** Institutions should *ignore* desert entirely and aim directly for an alternative distributive principle.
              *   **Node A1b1 (Institutional Aim): What principle should replace desert?**
                  *   **Branch A1b1a (Strict Equality):** Aim for equal outcomes regardless of action. (Awkward: Famous "Lazy Worker" objection - why work hard?).
                      *   **Leaf: Strict Egalitarianism.** (Awkward: Severe disincentive problems for productivity/innovation).
                  *   **Branch A1b1b (Sufficient):** Ensure everyone has *enough* (basic needs met); beyond that, outcomes can vary for efficiency/liberty reasons, *not* desert. (Awkward: Accepts potentially large inequalities above the threshold as long as no one is below).
                      *   **Leaf: Sufficientarianism.** (Awkward: Indifferent to vast wealth disparities above sufficiency).
                  *   **Branch A1b1c (Relational/Status Equality):** Aim to minimize hierarchies, domination, or status differentials; distribution serves this goal. (Case: Cap CEO pay relative to lowest worker to prevent status gaps). (Awkward: May limit incentives even if no one is poor).
                      *   **Leaf: Relational Egalitarianism.** (Awkward: May sacrifice potential Pareto improvements to prevent relative gains).
  *   **Branch B (Yes):** Desert *can* apply to outcomes even if influenced by unchosen factors; talent + effort together generate desert. (Case: The naturally gifted athlete who also trains obsessively deserves the win).
      *   **Node B1 (Effort Isolation): Can "effort" be meaningfully isolated from "talent" as the desert-generating component?**
          *   **Branch B1a (No):** Effort itself is significantly influenced by unchosen traits (discipline, drive) and circumstance. "Pure effort" is incoherent; talent/effort are entangled. (Case: The "Effort Twins" - one born driven, one born apathetic - same environment, different efforts). (Awkward: Undermines the moral basis for rewarding "effort" if it's largely unchosen).
              *   **Leaf: Hard Incompatibilism / Desert-Skepticism.** (Awkward: Makes *any* desert claims for outcomes seem arbitrary; pushes towards Branch A solutions).
          *   **Branch B1b (Yes):** Effort (understood as conscious exertion/choice) can be distinguished from talent as the primary desert base. (Case: Two people of equal talent, one works harder; the harder worker deserves more).
              *   **Node B1b1 (Negative Desert): Do significant structural advantages create "negative desert" (a duty to forfeit rewards)?**
                  *   **Branch B1b1a (Yes):** Advantages (e.g., inherited wealth, privileged networks) reduce/negate desert claims; the advantaged deserve *less* reward for the same effort/talent than the disadvantaged. (Case: The hard-working heir deserves less reward for success than the equally hard-working scholarship student). (Awkward: Defining the "baseline" level of advantage/disadvantage).
                      *   **Leaf: Corrected Meritocracy (Negative Desert View).** (Awkward: Calculating the "advantage discount" on desert claims is complex).
                  *   **Branch B1b1b (No):** Advantages don't create negative desert; desert is based purely on talent/effort deployed. Institutions *may* compensate for disadvantage elsewhere, but not by reducing the deserving person's reward. (Case: Tax the heir *later* for redistribution, but don't claim their business success was *less deserved* than the scholarship student's identical success).
                      *   **Node B1b1b1 (Compensation Timing): If compensating, should it happen *before* or *after* assessing desert?**
                          *   **Branch B1b1b1a (After):** Reward proportional to talent/effort first; use taxation/transfers later for equality/sufficiency. (Awkward: Allows large initial inequalities based on talent/effort).
                              *   **Leaf: Traditional Meritocracy (Post-Desert Redistribution).** (Awkward: Tolerates significant inequality justified by "desert").
                          *   **Branch B1b1b1b (Before):** Equalize opportunity/resources *first* so talent/effort operate on a "level field," *then* reward proportionally. (Case: Heavy inheritance tax & equal education funding *before* careers start). (Awkward: Requires extensive, potentially intrusive, up-front intervention).
                              *   **Leaf: Fair Opportunity Meritocracy (Rawls-Inspired).** (Awkward: Defining and achieving "genuinely" equal opportunity is contentious).
                      *   **Node B1b1b2 (Institutional Aim): What should institutions aim for?**
                          *   **Branch B1b1b2a (Proportional):** Reward strictly proportional to contribution/talent+effort. (Awkward: Can lead to extreme inequalities).
                              *   **Leaf: Strict Desertism / Libertarian Meritocracy.** (Awkward: Accepts that "deserved" outcomes can be wildly unequal and leave some in poverty).
                          *   **Branch B1b1b2b (Sufficient):** Reward proportional to contribution/talent+effort, but only *after* ensuring a sufficient minimum for all. (Awkward: May cap rewards for the most talented/hardworking if needed to fund sufficiency).
                              *   **Leaf: Desert-Constrained Sufficientarianism.** (Awkward: Balances desert claims against sufficiency, satisfying neither purists).
                          *   **Branch B1b1b2c (Strict Equality):** *Incoherent.* Cannot simultaneously hold that desert applies *and* aim for strict equality regardless of differential talent/effort. (Marked Unnamed/Incoherent).

  **Key Notes on the Tree:**

  1.  **Labels vs. Logic:** Positions are defined solely by their path through the tree of concrete commitments. Labels like "Meritocracy" or "Luck Egalitarianism" appear at leaves where the combination matches a known position's practical implications.
  2.  **Inseparability:** Positions differing *only* on underlying metaphysics (e.g., compatibilist vs. libertarian free will justifying Branch B1b) but sharing *all* the practical answers in the tree fall on the same leaf. The tree isolates practical institutional commitments.
  3.  **Incoherence:** Branch B1b1b2c ("Strict Equality" under "Desert Applies") is marked incoherent because the commitments contradict: you cannot simultaneously believe differential effort/talent *deserve* differential rewards *and* demand strict equality regardless of those factors.
  4.  **Unnamed Leaves:** Some combinations (like A1a1a - Compensation pre-desert, then reward *actual* effort) are flagged as unnamed, likely because they are conceptually unstable or lack prominent defenders. Their awkwardness is highlighted.
  5.  **"Awkward Commitment":** Each leaf includes one sentence stating the most counterintuitive or practically challenging implication of holding that position, helping identify its Achilles heel.

  **Using the Tree:** Start at the Root (Node 0). Ask your friend: "Can someone deserve being rich if it's mainly due to their high natural intelligence or being born into a wealthy family?" Their Yes/No leads down Branch B or A. Proceed step-by-step through the nodes using the concrete claims/cases. Where your paths diverge is the precise locus of your disagreement. The leaf positions and their awkward commitments clarify the ultimate implications of each path.
