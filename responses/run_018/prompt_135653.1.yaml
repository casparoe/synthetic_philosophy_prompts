  Institutional design questions include proportional reward, sufficientarian, or strict equality. Each leaf should have a named position or be marked unnamed, with a note on its awkward commitment. 

  I need to ensure each branch is phrased as a claim someone can answer without knowing labels. For example, "Can someone deserve rewards based purely on talent?" instead of using terms like "compatibilism." Also, where positions differ only on metaphysics but share practical answers, they should be flagged as inseparable. 

  The user wants clarity for someone without specialist training, so avoiding jargon is key. Practical examples like the "Effort Twins" case will help. Also, highlighting awkward commitments, like sufficientarianism allowing large inequalities if basic needs are met, makes the trade-offs clear.

  I should check for any missing branches. For instance, the negative desert question might need a clear case example, like inheriting wealth. Also, ensuring that all major positions (relational egalitarianism, luck egalitarianism) are covered. 

