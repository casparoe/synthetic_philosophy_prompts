prompt: |-
  You are an expert in the philosophy of probability and in designing experiential workshops for rationalist and forecasting-oriented audiences. Before drafting the design, think carefully: outline three distinct ways to make the reference class problem visceral in a group setting, then select the one that forces participants to experience the conflict between competing base rates rather than merely discussing it intellectually. Also briefly state your reasoning for which reference classes you will include and why they generate an unavoidable tension for a single case.

  I run a forecasting-and-philosophy seminar for about 14 people, mostly longtime readers of rationalist blogs and forums, one 90-minute session. I want a runnable in-class game or structured deliberation that makes participants feel the force of the reference class problem—specifically the absence of any neutral rule for selecting among statistically legitimate reference classes when predicting a single boundary case. To keep the exercise from being a routine replay of standard examples, inject the somewhat niche framing of “cross-domain reference class triage”: participants must forecast an outcome for a fictional “boundary object” that simultaneously belongs to incompatible natural-kind categories, and they are forced to discard one of their assigned similarity dimensions before locking in their credence, without knowing ex ante which dimensions are statistically legitimate versus merely analogical.

  The concrete case: “System K,” a hybrid cognitive architecture that is part engineered software, part distributed organizational process, and part evolutionary product. The resolution criterion is precisely defined: “System K will suffer a catastrophic failure of goal coherence within 18 months of deployment.” Participants assign a specific credence (0–100). They should discover on their own—before any debrief—that people with identical information but different retained reference-class dimensions diverge by 40+ points, and that neither can prove the other wrong. The payoff scheme should use only points with a small social stake (e.g., a private leaderboard and the lowest-scoring forecaster buys coffee for the group). Do not ask for bibliographies, reading lists, or citations. Do not require advance reading; deliver all information via printed cards or a single sheet.

  Please structure your response exactly as follows:

  1. Brainstorm and Design Rationale (approx 120 words)
  2. Materials and Role Assignments (approx 150 words)
  3. Rules, Incentives, and Payoff Structure (approx 220 words)
  4. Activity Flow: Phase by Phase (approx 250 words)
  5. Debrief: Mapping Experience to the Reference Class Problem (approx 220 words)
  6. Predictable Failures and Facilitator Handling (approx 150 words)
  7. Limits of the Simulation (approx 100 words)

  In your design, ensure that the rules and incentives—not the facilitator’s explanation—generate the conflict. Be frank in the debrief about which feature of the philosophical problem (for instance, the absence of a meta-reference-class or a principle of indifference over similarity spaces) the game can only approximate through framing, and what the facilitator must supply verbally. Write in a polished, formal tone appropriate for a forum request seeking a rigorous workshop design.
reasoning: |-
  Hmm, the user is asking me to design an experiential workshop on the reference class problem for a rationalist audience. They want a 90-minute session that makes the abstract problem visceral, specifically focusing on "cross-domain reference class triage" where participants must discard one similarity dimension when predicting a failure in a fictional "System K" hybrid architecture.

  The user is clearly knowledgeable - they mention rationalist blogs, forecasting seminars, and want to avoid standard examples. Their core request is for participants to experience the conflict between competing base rates firsthand, with diverging credences of 40+ points emerging organically from the design. I need to create a structured activity where rules and incentives generate the tension, not facilitator explanation.

  Key constraints: No advance reading, all materials via printed cards. Small social stakes only (leaderboard, coffee buy). Must include incompatible natural-kind categories (software, org process, evolutionary product). Participants must discard one dimension before locking in credences.

  I brainstorm three approaches:
  1) A negotiation game where teams defend different reference classes - but this might become too debate-focused rather than experiential.
  2) An individual prediction market with rotating dimensions - but this could feel mechanical.
  3) A forced-dimension-abandonment mechanic with conflicting base rates - this best matches the "triage" framing and ensures personal tension.

  I'll select option 3 because it forces each participant to personally confront the irreconcilability when they must discard a dimension. By assigning asymmetric data and making base rates conflict severely (e.g., software 85% failure vs. evolutionary 20%), the 40+ point divergence will emerge naturally. The categories are chosen precisely because they're equally legitimate yet incompatible for this boundary case - software emphasizes design fragility, evolutionary systems highlight resilience, organizational processes sit ambiguously in between.

  For materials, I'll prepare profile cards with reference class data, dimension cards for the triage, and prediction sheets. Roles will be implicit through the profiles. The payoff uses Brier scoring to incentivize precision. Crucially, the reveal phase shows dispersion before any explanation - making the problem undeniable.

  In debrief, I'll need to explicitly state what the simulation can't capture: the lack of a meta-reference-class isn't modeled, only implied through the forced choice. The facilitator must verbally explain why this isn't just about incomplete information but about fundamentally incompatible categorization.

  Potential pitfalls include participants trying to average probabilities or questioning base rate validity. I'll handle this by preemptively stating base rates are authoritative in-fiction, and forbidding mathematical aggregation in rules. The artificial conflict of base rates is a necessary simplification - I'll acknowledge this limit openly while arguing it serves the pedagogical purpose.

  This design should leave participants feeling the weight of the reference class problem in their bones, not just understanding it intellectually. The coffee stake adds just enough tension to make the credence divergence emotionally resonant.
answer: |-
  **1. Brainstorm and Design Rationale**  
  I outlined three approaches: (1) Negotiation-based reference class defense, (2) Prediction market with rotating reference class constraints, (3) Forced-dimension-abandonment with conflicting base rates. **Selected: #3.** Rationale: It compels isolated, irrevocable trade-offs between equally valid categories, forcing visceral tension. Participants *feel* the loss of a high-priority dimension without intellectualizing alternatives. The "triage" framing operationalizes the absence of a meta-rule by demanding sacrifice under uncertainty. Software (engineered fragility), organizational processes (human/coordination risk), and evolutionary systems (robustness/selection bias) are chosen as reference classes because they impose orthogonal failure logics (e.g., "bugs" vs. "misalignment" vs. "adaptation failures"), making aggregation incoherent.

  **2. Materials and Role Assignments**  
  - **3 Reference Class Cards** (1 per category): Each states a *conflicting base rate* for "catastrophic goal coherence failure" in its domain. Example:  
    - *Software Systems*: "78% of complex ML-driven architectures fail <18mo (N=50)"  
    - *Distributed Orgs*: "22% of consensus-driven decentralized orgs fail <18mo (N=45)"  
    - *Evolved Systems*: "35% of naturally selected complex systems lose coherence <18mo (N=40)"  
  - **14 Participant Packets**: Each contains all 3 cards + a unique **"Triage Card"** specifying *one* dimension to discard (e.g., "DISCARD: Evolutionary").  
  - **Prediction Sheet**: Credence (0-100) + brief justification.  
  - **Facilitator Summary Sheet**: Base rates for debrief.  

  *No roles; asymmetric triage assignments ensure dimension loss distribution.*

  **3. Rules, Incentives, and Payoff Structure**  
  - **Rules**:  
    1. Independently review all 3 reference classes.  
    2. *Irrevocably discard* the dimension specified on your Triage Card.  
    3. Predict using only the 2 retained dimensions. Justifications must cite retained classes.  
    4. No discussion until predictions are locked.  
  - **Incentives**:  
    - Brier scoring: Points = `1 - (Outcome - Prediction/100)^2`. Outcome is facilitator-decided post-activity (e.g., "System K failed").  
    - Private leaderboard displayed mid-debrief. Lowest scorer buys coffee (social stake).  
  - **Conflict Generation**: Discarding a high/low base rate dimension *directly* alters credences. E.g., discarding "Software" (78% failure) forces reliance on lower base rates, creating a 40+ point spread against those discarding "Evolved" (35%).

  **4. Activity Flow: Phase by Phase**  
  - **Phase 1 (10 min)**: Distribute packets. Silent reading of System K description and reference classes. Emphasize: "Base rates are statistically valid; no averaging allowed."  
  - **Phase 2 (15 min)**: *Triage Execution*. Participants discard assigned dimension, record prediction/justification using only 2 classes. Collect sheets.  
  - **Phase 3 (20 min)**: *Silent Deliberation*. Redistribute anonymized predictions/justifications. Participants group predictions by *discarded dimension* (e.g., "Group A: Discarded Software"), noting ranges.  
  - **Phase 4 (5 min)**: *Reveal Spread*. Facilitator projects prediction ranges per group (e.g., "Discarded Software: 15-35%; Discarded Evolved: 55-85%"). Highlight >40pt gaps.  
  - **Phase 5 (10 min)**: *Controlled Debate*. Groups defend their retained classes. Challenge: "Why is your pair *objectively* superior?"  

  **5. Debrief: Mapping Experience to the Reference Class Problem**  
  - **Key Link**: "You experienced *competing base rates* as irreconcilable forces. Discarding a dimension wasn’t about ignorance—it was arbitrating between *equally legitimate* causal logics."  
  - **Explicit Gaps**:  
    - The simulation *implies* but cannot model the *absence of a meta-reference-class*. Verbally note: "No ‘correct’ similarity space exists to resolve this; your triage card artificially imposed one."  
    - The forced choice *approximates* indifference over similarity spaces but simplifies by pre-defining dimensions. Stress: "Real cases lack even this constrained choice—you must *define* dimensions without guidance."  
  - **Takeaway**: "For boundary objects like System K, the reference class *is* the model. Change the class, change the outcome—neutrally."

  **6. Predictable Failures and Facilitator Handling**  
  - **Failure**: Participants average base rates despite rules.  
    *Handling*: Pre-empt: "Averaging assumes classes are interchangeable; they’re not. Justify using *specific interactions* of your two classes."  
  - **Failure**: Disputing base rate validity (e.g., "N=40 is noisy!").  
    *Handling*: "In this fiction, accept the data as robust. The problem arises *even with perfect data*."  
  - **Failure**: Post-reveal consensus seeking.  
    *Handling*: "Your goal isn’t agreement—it’s noticing why agreement is impossible without arbitrary choice."  

  **7. Limits of the Simulation**  
  - **Artificial Conflict**: Base rates are exaggerated (78% vs. 22%) to ensure dispersion; real-world differences may be subtler.  
  - **Pre-Defined Dimensions**: Real reference class selection involves *discovering* relevant classes, not choosing from a menu. The exercise isolates the selection tension but not the discovery problem.  
  - **No Ambiguity in Class Membership**: System K’s hybridity is stipulated, not debated. This sidesteps boundary disputes to focus purely on selection conflict.  
  - **Facilitator Dependency**: The "unavoidable tension" relies on the facilitator underscoring that all classes are *equally natural kinds* for System K—a premise participants might otherwise challenge.
