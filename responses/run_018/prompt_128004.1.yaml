prompt: |-
  Hi, I'm an education officer at a regional museum and I keep having to approve these "Then vs Now" display panels for school groups — probably do two or three a week, sometimes on a Friday afternoon with half an hour to sign off before the printers need it. The problem is they always slip into writing the past as if it was just fumbling foward us, like every old law or custom was an incomplete version of what we have now. I need an actual decision proceduer I can run in about ten minutes on a draft panel: the questions in order, what counts as passing or failing each one, where it stops with a "rewrite this," and where it has to hand over to my own judgement because it's a values call not a factual one.

  Ground it in the philosophy-of-history stuff on Whig history — specifically keep the distinction between using present knowledge to explain what happened (fine) and using it to rank the past as inferior (not fine), plus that convergence-fallacy vs value-transference distinction — but drop anything that needs me to actually know historiography. Make it usable by someone without a philosophy degree.

  Then apply it to three draft panels: one on 19th-century sanitation reform that frames old sewer systems as "not yet understanding germs"; one on voting-rights history that treats earlier restrictions as simply "backward" rather than coherent with different political values; and one on the adoption of the metric system where I think the checklist will say it's okay but I'll still hate the answer — probably because standardisation is technically progressive with no moral cost, or whatever. Make sure one gives me an answer I genuinely won't like.

  Also flag exactly where the proceduer will misfire, and where two reasonable people could run it on the same text and disagree. And please write the answer in British English — I'm in the UK office.

  Oh, and don't ask me for a bibliography or specific authors to read; just build it from the concepts themselves.
reasoning: |-
  Okay, the user is an education officer at a regional museum in the UK. They're dealing with "Then vs Now" display panels for school groups, approving several each week, often in a time crunch. The main issue is that these drafts present history as if the past was just a primitive version of the present, judging it as inferior rather than understanding it on its own terms. 

  The user wants a practical 10-minute checklist rooted in concepts like Whig history (avoiding progress narratives) and the convergence fallacy (not assuming the present was inevitable). They specifically mentioned avoiding historiography jargon—so I need to make this accessible without philosophy degrees. Key distinctions: using present knowledge to explain events is fine, but ranking the past as inferior isn't; also separating technical progress (like metric system adoption) from moral judgments.

  Breaking this down, the checklist needs clear yes/no questions that flag problematic language. It should cover: factual framing (Question 1), moral/value judgments (Question 2), inevitability assumptions (Question 3), and contextual coherence (Question 4). Each question must have concrete pass/fail criteria—e.g., if a draft says "not yet understood," it fails Question 1. 

  For the three examples:
  - Sanitation reform: Framing old sewers as "not yet understanding germs" fails Question 1 (implies past ignorance rather than different knowledge frameworks). 
  - Voting rights: Calling restrictions "backward" fails Question 2 (moral judgment without context). 
  - Metric system: This might pass the checklist (it's technical standardization), but the user dislikes it—so I'll note that Question 4’s "contextual coherence" test is where personal judgment kicks in, and reasonable people might disagree on tone. 

  I should also flag where the checklist misfires: e.g., when historical actions align with modern values but weren’t motivated by them (like early metric advocacy), or when technical progress has ambiguous moral weight. British English is a must—replace "center" with "centre," etc. 

  Finally, the user hates the metric example outcome—that’s intentional. It shows the checklist’s limits: it can’t eliminate all presentism bias, just systematize the obvious flaws. I’ll emphasize that the final call (Question 4) is inherently subjective, so disagreements between colleagues are expected. No bibliography—just concepts.
answer: |-
  Here’s a practical **10-Minute "Anti-Whig" Checklist** for "Then vs Now" panels, grounded in core concepts but stripped of jargon. It’s designed for speed, using British English and clear pass/fail gates. The goal is to catch **presentism** (judging the past by modern standards) and the **convergence fallacy** (implying the present was inevitable).

  ---

  ### **The Checklist: 4 Questions in Order**
  *(Run each question sequentially. Fail any = rewrite. Pass all = acceptable draft, though you may still dislike it.)*

  1.  **QUESTION: "Does this explain *why* past actions made sense *in their context*, OR does it frame them as 'not knowing/not having' what we do?"**
      *   **PASS:** Uses neutral terms explaining historical context (e.g., "Based on the prevailing miasma theory...", "Reflecting contemporary beliefs about...", "Due to limited technology/resources like..."). Focuses on *contemporary* logic or constraints.
      *   **FAIL:** Uses deficit language implying the past was merely incomplete ("Didn't yet understand...", "Hadn't developed...", "Lacked our knowledge of...", "Not yet discovered..."). Implies their sole purpose was stumbling towards *us*.
      *   **ACTION:** Fail = Rewrite. Replace deficit phrases with contextual explanations.

  2.  **QUESTION: "Does it describe past values/systems neutrally, OR does it label them as 'backward', 'primitive', 'unfair' (or synonym) using *our* moral lens?"**
      *   **PASS:** States facts about past beliefs, laws, or social structures neutrally (e.g., "Voting rights were restricted to...", "This system reflected hierarchies valuing...", "Sanitation practices were based on..."). May contrast with modern values *factually* ("This differs from modern universal suffrage").
      *   **FAIL:** Uses explicit or implicit moral judgment rooted purely in present values ("Backward laws...", "Unfairly restricted...", "Primitive methods...", "A less enlightened view..."). Uses value-laden adjectives without grounding them *in the past's own value system*.
      *   **ACTION:** Fail = Rewrite. Remove judgmental adjectives. State the facts and the *past's* rationale (even if abhorrent to us now). Use "by modern standards" ONLY if essential and paired with context.

  3.  **QUESTION: "Does it present the 'Now' as one possible outcome, OR imply the past was inevitably progressing *towards us*?"**
      *   **PASS:** Presents the modern situation as a development, possibly influenced by multiple factors, *without* implying inevitability (e.g., "Over time, reforms led to...", "Scientific advances contributed to changes such as...", "Societal shifts resulted in...").
      *   **FAIL:** Uses language of teleology or destiny ("Progress led inevitably to...", "Was a necessary step towards...", "Paved the way for our modern...", "Ultimately resulted in the superior system we have today"). Suggests history had a predetermined endpoint (us).
      *   **ACTION:** Fail = Rewrite. Remove "inevitably," "necessary step," "paved the way." Frame the change as contingent, influenced by specific events/ideas, not destiny.

  4.  **QUESTION: "Is the 'progress' claimed primarily *technical/empirical* (measurable improvement in efficiency, safety, knowledge) OR *moral/cultural* (implying our values are superior)?"**
      *   **PASS:** Focuses on concrete, measurable changes where improvement is demonstrable through evidence *and* avoids conflating this with moral superiority (e.g., "Modern sewers reduce disease transmission more effectively," "Standardised measurement simplified trade," "Expanded suffrage increased participation").
      *   **FAIL:** Conflates technical progress with inherent moral/cultural superiority ("We now know better," "Society became more civilised," "A more enlightened system emerged"). Implies our *values* are the pinnacle because of technical advances.
      *   **ACTION:** **HANDOVER TO YOUR JUDGEMENT.** This is the key values call. Does the panel *imply* moral superiority solely because of the technical change? If yes, rewrite to separate the technical improvement from value judgments. If purely technical with no implied moral/cultural hierarchy, it passes *the checklist* (even if you dislike the tone).

  ---

  ### **Applying the Checklist to Your Draft Panels**

  1.  **19th-Century Sanitation Reform:** "Early Victorian sewers were designed to remove waste from streets but *didn't yet understand germs*, so often contaminated water supplies."
      *   Q1: **FAIL.** "Didn't yet understand germs" is classic deficit language. (Rewrite: "...were designed based on miasma theory, focusing on removing foul smells believed to cause disease, but inadvertently contaminated water supplies.")
      *   **VERDICT:** REWRITE (Failed Q1).

  2.  **Voting-Rights History:** "Early 19th-century voting laws seem incredibly *backward* today, restricting the vote to only male property owners."
      *   Q1: Pass? (Just states a restriction). Q2: **FAIL.** "Backward" is an explicit moral judgment using our lens. (Rewrite: "Early 19th-century voting laws restricted the franchise to male property owners, reflecting contemporary views linking political participation to economic independence and gender roles.")
      *   **VERDICT:** REWRITE (Failed Q2).

  3.  **Adoption of the Metric System:** "The chaotic system of imperial weights and measures caused confusion and hindered trade. The adoption of the metric system in the 20th century was a vital step forward, creating a universal, rational standard used by almost all nations."
      *   Q1: PASS (States a problem - confusion/hindered trade - using context). Q2: PASS (No explicit moral judgment of past people). Q3: **CAUTION ("vital step forward" leans towards inevitability, but "creating a universal standard" is factual).** Q4: **HANDOVER.**
      *   **HANDOVER JUDGEMENT:** The progress claimed is *technical* (standardisation reducing confusion/aiding trade). While "rational" *could* imply moral superiority, it's primarily framed as a practical advantage. "Vital step forward" is borderline Q3, but likely passes if not overdone. **CHECKLIST VERDICT: PASSES (technically).** *This is the answer you'll dislike.* The panel implies technical superiority (which is demonstrable for standardisation in science/trade) without *explicitly* labelling past people as stupid or immoral. It *does* subtly frame the past as deficient ("chaotic") but links it to a concrete problem (confusion/hindered trade), which passes Q1. Your dislike stems from the inherent "progress narrative" tone, which the checklist tolerates for purely technical improvements (Q4 pass).

  ---

  ### **Where the Checklist Misfires & Where Disagreement Arises**

  1.  **Misfires:**
      *   **"Benign" Presentism:** When past actions *align* with modern progressive values for *different reasons* (e.g., early metric advocates pushing for standardisation partly to *weaken* traditional guilds/elites). The checklist might pass it as technical progress, obscuring the different motivation.
      *   **Implied Moral Judgment in Technical Progress:** As in the metric example, the *tone* can still feel smug even if Q4 passes. The checklist flags explicit moralising, not subtle narrative framing.
      *   **"Progress" with Ambiguous Moral Cost:** E.g., standardisation eroding local cultural practices. Q4 focuses on the *claimed* progress in the panel. If the panel ignores the cost, it might pass, missing complexity.

  2.  **Points of Disagreement:**
      *   **Q4 Handover (The Values Call):** This is inherently subjective. Two officers might reasonably disagree on whether a phrase like "a more rational system" (metric) implies moral superiority or just technical efficiency. One might see it as neutral description, another as smug presentism.
      *   **Borderline Language in Q1/Q3:** Is "limited understanding" (Q1) acceptable if immediately contextualised, or still deficit? Is "led to" (Q3) neutral, or does it subtly imply direction? Interpretation of nuance varies.
      *   **Defining "Technical":** Is increased democratic participation "technical" (measurable numbers) or inherently "moral"? The checklist relies on the *panel's framing*, but the underlying concept can be fuzzy.

  ### **Summary for Your Friday Afternoons**

  *   **Run the 4 Questions:** Sequentially. Fail any Q = Rewrite (specific instruction given).
  *   **Q4 is Your Call:** Does it *feel* like it's sneaking in moral superiority under the guise of technical progress? If yes, rewrite to separate facts from implied value hierarchies.
  *   **Accept the Technically Passable (Even if Annoying):** Like the metric panel. The checklist stops Whig *history*, not Whig *tone* in non-moral technical narratives. Flag it for future review if the tone grates, but sign off.
  *   **Disagreement is Normal:** Especially on Q4 and nuanced language. The checklist forces explicit consideration of the pitfalls but doesn't eliminate all subjectivity.

  This system forces writers to confront the core sins of Whig history (deficit framing, moral judgement, teleology) in a structured, time-efficient way, significantly raising baseline quality before it hits your desk. It won't catch *everything*, but it will eliminate the most egregious errors.
