answer: |-
  Based on Hofstadter's framework from GEB and your proposed "decoder shadow," here's a ranking by plausibility as the *primary* site of meaning in a self-referential system, focusing on the conceptual landscape:

  1.  **Inner Message (Score: 9/10):** Hofstadter strongly argues that meaning fundamentally resides here, as it's the intended, decoded content emerging from the interaction of symbols and rules within the system itself. *(Highest plausibility within Hofstadter's explicit framework)*
  2.  **Outer Message (Score: 7/10):** Crucial for enabling decoding (providing the rules/cipher), but it's generally seen as instructions *for finding* meaning rather than the meaning itself, though its self-referential nature blurs this line. *(Essential scaffolding, but rarely argued as the *primary* site)*
  3.  **Frame Message (Score: 6/10):** Vital initial recognition that *something* is a message/system to be decoded, but it conveys almost no specific semantic content on its own. *(Necessary precondition, but too vague to be the primary site)*
  4.  **Decoder Shadow (Score: 3/10):** While conceptually intriguing (potential for steganography, unintended resonance, or "noise" accumulating meaning), it's explicitly *ignored* or *redundant* by standard decoders; meaning here is accidental, emergent, or parasitic on the primary system, not its core. *(Highly speculative as the *primary* site within standard meaning-location debates)*

  **Settled vs. Contested Aspects (Within Meaning-Location Debates):**

  *   **Relatively Settled (Widely accepted premises, though implications are debated):**
      *   Meaning is not an intrinsic property of symbols alone; it arises from the *relationship* between symbols, rules (structure), and an interpreter/decoder.
      *   Self-referential systems *require* multiple levels of interpretation (like frame/outer/inner messages) to handle their own self-pointing nature without infinite regress.
      *   The decoder/interpreter is an essential *component* in the meaning-making process (rejecting naive "meaning is in the text" views).

  *   **Genuinely Contested (Active areas of disagreement):**
      *   **The Primary "Location":** Is meaning primarily *in* the decoded inner content (Hofstadter's strong leaning)? Is it *in* the interpretive act/process performed by the decoder (phenomenological/semiotic views)? Or is it *in* the functional role/causal relationships within the system (functionalist/computational views)? Hofstadter's inner message focus is one prominent *view*, not consensus.
      *   **The Role of the Decoder's Mind:** To what extent is meaning constituted *by* the decoder's mind/consciousness/embodied experience vs. being a stable property *of* the system once decoded according to its rules? This is a major philosophical rift.
      *   **"Meaning Without a Decoder":** Can a system be said to *contain* meaning (e.g., as a potential) even if no decoder is currently present? If so, where does this potential reside? (Hofstadter leans towards requiring a decoder).
      *   **The Status of "Decoder Shadow":** Your concept directly engages this contestation. Is "semantic residue" truly meaning, or just unstructured potential? Can the ignored parts of a system legitimately hold meaning *as part of the system's primary semantic content*, or only as a separate, unintended layer? This view is novel and largely outside established frameworks, making its plausibility as the *primary* site highly contested and speculative.

  **Crucial Note:** Presenting the "inner message" as the most plausible site (score 9) reflects Hofstadter's *argument* in GEB concerning self-referential systems. However, within broader philosophy of mind, language, and information, the claim that meaning is *primarily located* in the "inner message" (as opposed to the decoding process, the decoder's mind, or functional relations) is **highly contested**, not settled consensus. Your "decoder shadow" explicitly challenges the boundaries of these debates.
