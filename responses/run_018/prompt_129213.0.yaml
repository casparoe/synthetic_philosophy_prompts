prompt: |-
  You are an experienced philosophy exam grader with deep expertise in population ethics, personal identity over time, and the metaphysics of possible persons. Before you assess anything, spend a moment brainstorming the specific grading rubric you would use for answers about the nonidentity problem—distinguishing the settled structural claim that different choices produce different people from the genuinely contested questions about whether impersonal reasons can ground obligations to future generations, and about how closely Parfit’s Principle Q binds moral evaluation to actual individuals rather than to outcomes. I am grading papers for a colleague’s graduate seminar on intergenerational ethics, and I need a precise, point-by-point evaluation that does not reveal my own view but clearly separates consensus from dispute.

  The exam question was: “Consider a 2150 scenario in which Government X adopts Climate Policy Alpha, permitting high-emission agriculture that funds rapid medical advances. The resulting generation—Cohort A—lives lives worth living but with moderate respiratory impairment. Had Government X adopted Climate Policy Beta (strict decarbonization with slower growth), different genetic and social pairings would have produced Cohort B, with no impairment and slightly higher welfare. A policy analyst claims Alpha wrongs Cohort A members because each is worse off than the corresponding Beta-person they replace. Evaluate this claim using the nonidentity problem, and explain whether Parfit’s analysis gives the government any reason—person-affecting or otherwise—to prefer Beta.”

  Here is one student’s answer: The student correctly states that Cohort A exists only under Alpha, so its members are not worse off than they would have been, since under Beta they would not exist at all; this captures the core nonidentity insight. The student then claims the case is structurally identical to Parfit’s wrongful-life examples, in which an actual child with a life worth living complains about being born with a disability. From this analogy, the student infers that because Cohort A members have lives worth living, they lack standing to complain, and therefore the government has no person-affecting reason to choose Beta. The student further asserts that Parfit rejects impersonal welfare aggregation across different populations and instead endorses a counterfactual replacement principle, which requires comparing actual individuals only to the specific counterparts they displace; since Cohort A members have no such counterparts under Beta, there is no meaningful basis for comparison, leaving the government indifferent between the policies except for effects on present people.

  Please grade this answer. Separate what is settled in the literature (for instance, the basic logic that different policies yield numerically different future people) from what is genuinely contested (for instance, whether Parfit allows impersonal reasons to guide reproductive or climate policy, and whether any “replacement” comparison is metaphysically coherent). Do not present a disputed interpretation as the consensus view. Present your assessment as exactly five numbered items, each one or two sentences long, with no introductory or concluding paragraph. The items should cover, in order: the student’s grasp of the basic nonidentity structure; the conflation or correct use of the wrongful-life analogy; the treatment of person-affecting versus impersonal reasons and any misattribution to Parfit; the evaluation of the invented counterfactual replacement principle; and the specific letter grade or point score with the precise justification. Be rigorous: flag any subtle inferential gap or conceptual slippage that a hurried grader might miss.
reasoning: |-
  Okay, the user wants me to grade a student's answer on the nonidentity problem in population ethics. They've provided the exam question about climate policy choices affecting future generations, and the student's response. 

  Hmm, this requires careful handling because the user is acting as a philosophy exam grader needing an objective assessment. They emphasize distinguishing settled consensus from contested interpretations. The student's answer seems to grasp the core nonidentity structure but makes several problematic leaps.

  First, the student correctly identifies that Cohort A only exists under Policy Alpha - that's solid. But then they equate it with wrongful life cases... wait, that's shaky because wrongful life typically involves same-person counterfactuals (disabled vs non-disabled version of same child), while here it's about entirely different people. The student is conflating two distinct scenarios.

  Ah, and here's where it gets messy - the student claims Parfit rejects impersonal aggregation. Actually, Parfit absolutely allows impersonal reasons! He just finds them problematic. And that invented "counterfactual replacement principle"? Complete fiction - Parfit never proposed such a thing. The student seems to be confusing Parfit's critique of same-number quality claims with some kind of rigid comparison rule.

  The grade justification needs to reflect that while the core nonidentity point earns credit, the later misinterpretations are serious flaws for a graduate-level submission. Especially the misrepresentation of Parfit's actual position on impersonal reasons - that's a fundamental error in citing primary sources.

  For the rubric items: Item 1 acknowledges their correct structural grasp. Item 2 flags the wrongful life analogy overextension. Item 3 corrects the Parfit misattribution. Item 4 dismantles the invented principle. Item 5 assigns B- since they got the basics right but failed on advanced interpretation. 

  Must remember to keep each point brutally concise as requested - no fluff, just razor-sharp evaluation. And absolutely no hint of my personal views on the ethics involved.
answer: |-
  Here is the graded assessment:

  1.  **Nonidentity Structure:** Correctly identifies the core structural claim: Cohort A exists only under Alpha and is not worse off than they would have been under Beta (since they wouldn't exist), satisfying the basic nonidentity condition. This demonstrates understanding of the settled logic.
  2.  **Wrongful-Life Analogy:** Incorrectly conflates the case with standard wrongful-life examples. The analogy fails because wrongful-life cases typically involve the *same individual* existing in a worse state versus a better state, whereas the nonidentity problem involves *different individuals* existing. This is a significant conceptual slippage.
  3.  **Person-Affecting/Impersonal & Parfit Attribution:** Incorrectly asserts Parfit rejects impersonal aggregation across populations and concludes *only* person-affecting reasons exist. While Parfit *problematizes* impersonal aggregation (e.g., the Repugnant Conclusion), he explicitly allows impersonal reasons *can* ground obligations to future generations and does not confine moral evaluation solely to person-affecting reasons. This misrepresents a central and contested aspect of Parfit's view.
  4.  **Counterfactual Replacement Principle:** Incorrectly attributes an invented "counterfactual replacement principle" to Parfit as his solution, requiring direct counterpart comparison. Parfit does not endorse such a metaphysically loaded principle; he focuses on the *absence* of harm to specific individuals (A) and the *impersonal* badness of the worse outcome. This is a substantial inferential gap and misreading.
  5.  **Grade: B-.** Justification: Demonstrates competent grasp of the foundational nonidentity structure (Item 1). However, significant errors in analogy (Item 2), misrepresentation of Parfit's central arguments on impersonal reasons (Item 3), and invention of a non-existent principle (Item 4) reflect serious limitations in handling contested nuances expected at the graduate level.
