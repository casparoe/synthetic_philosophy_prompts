prompt: |-
  You are a philosopher of moral psychology and applied ethics, with deep familiarity with Adam Smith's account of sympathy, the impartial spectator, and the distinction between propriety and merit. Before constructing the procedure, take time to think through the conceptual architecture: how sympathy functions as a mechanism of fellow-feeling rather than mere emotional contagion; how the impartial spectator operates as an internal standard that corrects for partiality; and where Smith locates the boundary between assessing an agent's intentions and evaluating the consequences of an act.

  I advise mediators in a community-based restorative justice program who repeatedly face decisions about whether a proposed restorative agreement genuinely addresses the moral desert of a symbolic or relational harm—such as a public false accusation that destroyed a reputation, or a breach of trust within an institution—without relying on legal sentencing guidelines. These mediators are not lawyers; they must document reasoning for a review board of legal staff and community representatives, and they need a reusable decision procedure they can run in under an hour. Design an ordered checklist of questions, with clear stopping rules, explicit judgment nodes, and a sharp distinction between empirical observations (what was intended, what damage occurred, what remedy is feasible) and irreducible value judgments (whether sympathy is warranted, whether the spectator approves). The procedure must handle hard cases: the offender expresses genuine remorse but the victim refuses any reconciliation; third-party observers disagree sharply on harm severity; and the proposed remedy risks being either disproportionate or merely performative. Apply it to three scenarios: a straightforward case with acknowledged harm and proportional remedy; a case where the offender sincerely intends repair but the structural damage exceeds any individual remedy; and a case where the procedure yields an answer the mediator will find unsatisfying—perhaps that formal reconciliation should be withheld despite emotional readiness on both sides. End by stating what the procedure cannot settle, where it is likely to misfire, and which steps remain judgment calls that no protocol can eliminate.
reasoning: |-
  We are designing a decision procedure for restorative justice mediators based on Adam Smith's moral psychology. The key concepts are:
   1. Sympathy: Not mere emotional contagion, but fellow-feeling that requires understanding the situation and emotions of others. It is the basis for moral judgment.
   2. Impartial Spectator: An internal standard that corrects for our partiality. We imagine how an impartial observer would judge the situation.
   3. Propriety vs. Merit: 
      - Propriety: The appropriateness of the agent's emotions and intentions (did they act from proper motives?).
      - Merit: The praiseworthiness or blameworthiness of the action, which depends on both the propriety of the motive and the consequences (or intended consequences).

   Steps in the procedure:
   - We must assess both the offender's intentions (propriety) and the consequences (merit) but note that Smith emphasizes the intention as primary for moral judgment, while consequences affect the merit (the degree of praise or blame).
   - The goal of the restorative agreement is to address the moral desert (what is deserved) of the harm, which includes both the relational/symbolic harm and the material harm.

   The procedure will be a checklist of questions with:
     - Stopping rules: Conditions under which we stop and make a decision (e.g., if at any point the answer is "no", we may need to reject the agreement and reconsider).
     - Judgment nodes: Points where a judgment must be made (e.g., whether the impartial spectator would approve).
     - Distinction between empirical observations (facts) and value judgments (which require the application of the impartial spectator).

   We design the procedure as a series of questions that the mediator must answer, with clear branching.

   Procedure Checklist:

   I. Assessment of the Harm
      A. Empirical Observations:
          1. What specific harm occurred? (Describe the factual consequences: e.g., damage to reputation, breach of trust, emotional distress, material loss.)
          2. How severe is the harm? (Consider both immediate and long-term effects, and the context. Gather evidence from the victim, offender, and third parties if necessary.)
          3. To what extent is the harm reparable? (What can be done to repair it? What is feasible?)

      B. Value Judgment (requiring the impartial spectator):
          4. Would an impartial spectator, fully informed of the circumstances and the feelings of the victim, agree with the victim's assessment of the harm? (If not, the mediator must adjust the severity assessment accordingly.)

   II. Assessment of the Offender's Intentions and Remorse
      A. Empirical Observations:
          5. What were the offender's intentions at the time of the act? (Were they malicious, negligent, or well-intentioned but misguided?)
          6. What is the offender's current state of mind? (Does the offender express remorse? How? What actions demonstrate remorse?)

      B. Value Judgment:
          7. Considering the offender's situation and emotions, would an impartial spectator find the offender's remorse genuine and proportional to the harm? (This is about propriety: the offender's feelings should match what the situation warrants.)

   III. Assessment of the Proposed Remedy
      A. Empirical Observations:
          8. What exactly does the proposed remedy entail? (List the actions: e.g., apology, restitution, community service, public retraction, etc.)
          9. How does the remedy address the specific harm? (Does it repair material loss? Does it address the relational/symbolic harm? How?)
          10. Is the remedy feasible? (Can the offender realistically perform it? Are there structural barriers?)

      B. Value Judgments:
          11. Would an impartial spectator, considering the harm and the offender's intentions, find the remedy proportional? (Not excessive and not insufficient.)
          12. Would the remedy, if performed, restore the victim's standing and repair the relationship (or at least the social fabric) in the eyes of an impartial spectator? (This is about the merit of the remedy: does it adequately respond to the moral desert?)

   IV. Reconciliation and Community Restoration
      A. Empirical Observations:
          13. Does the victim accept the proposed remedy? (If not, why? Is the refusal based on the remedy's inadequacy or other reasons?)
          14. Are there third parties (community, institution) that are affected? What are their views?

      B. Value Judgment:
          15. Considering all the above, would an impartial spectator approve of the agreement as just and restorative?

   V. Decision Node with Stopping Rules:
      - If at any point the answer to a value judgment question (4, 7, 11, 12, 15) is a clear "no", then the agreement must be revised or rejected.
      - Specifically:
          * If the harm assessment (Q4) is not validated by the impartial spectator, then the mediator must reconsider the harm severity and adjust the remedy accordingly.
          * If the offender's remorse is not genuine (Q7), then the mediator should question the offender's commitment to the remedy and may require further steps to demonstrate remorse.
          * If the remedy is not proportional (Q11) or not restorative (Q12), then the remedy must be renegotiated.
          * If the victim does not accept the remedy (Q13) and the mediator, through the impartial spectator lens, judges that the refusal is reasonable (i.e., the remedy is inadequate), then the remedy must be revised. However, if the refusal is deemed unreasonable by the impartial spectator (e.g., the remedy is adequate but the victim is intransigent for reasons unrelated to the harm), then the mediator may proceed to approve the agreement but note the victim's non-participation.
          * The final approval (Q15) must be "yes" for the agreement to be accepted.

      - Stopping rule: If after two rounds of revision the agreement still fails at any of the critical value judgment nodes (Q7, Q11, Q12, Q15), then the mediator must document the failure and refer the case to the review board with a recommendation for alternative measures.

   Applying to three scenarios:

   Scenario 1: Straightforward case (acknowledged harm and proportional remedy)
     - Example: A shopkeeper falsely accuses a customer of theft in front of others. The customer's reputation is harmed. The shopkeeper admits the mistake, is genuinely remorseful, and offers a public apology and a written retraction to be posted in the store. The customer accepts.
     - Procedure:
          I.A.1: Harm: Public false accusation, damage to reputation in the community.
          I.A.2: Severity: Moderate (in a small community, but not long-lasting if corrected).
          I.A.3: Reparable: Yes, by public correction.
          I.B.4: Impartial spectator would agree with the victim's assessment.
          II.A.5: Intentions: The shopkeeper acted on a mistaken belief (negligent, not malicious).
          II.A.6: Remorse: Genuine, as shown by immediate admission and proposal to correct.
          II.B.7: Impartial spectator would find the remorse genuine and proportional.
          III.A.8: Remedy: Public apology and posted retraction.
          III.A.9: Addresses the harm by publicly correcting the false accusation.
          III.A.10: Feasible: Yes.
          III.B.11: Proportional: Yes, because it directly addresses the harm.
          III.B.12: Restorative: Yes, it restores the customer's reputation and the relationship.
          IV.A.13: Victim accepts.
          IV.B.15: Impartial spectator approves.

   Scenario 2: Offender sincere, but structural damage exceeds individual remedy
     - Example: A manager in a company breaches trust by sharing confidential information about an employee's mental health struggles, leading to the employee being stigmatized and eventually leaving the company. The manager is remorseful and offers a sincere apology and to pay for therapy. However, the employee has suffered significant career damage and the company culture is toxic (so the breach is part of a pattern). The employee does not want to return to the company and refuses reconciliation.
     - Procedure:
          I.A.1: Harm: Breach of trust, stigma, loss of job, emotional distress.
          I.A.2: Severity: High (long-term career and emotional impact).
          I.A.3: Reparable? Partially (therapy might help with emotional distress, but career damage and the toxic culture are beyond the manager's individual capacity to fix).
          I.B.4: Impartial spectator would agree the harm is severe and multi-faceted.
          II.A.5: Intentions: The manager may have acted carelessly or with misplaced concern (negligent).
          II.A.6: Remorse: Genuine (apology, offer to pay for therapy).
          II.B.7: Impartial spectator finds remorse genuine but notes the limitations of the individual.
          III.A.8: Remedy: Apology and payment for therapy.
          III.A.9: Addresses emotional distress but not the career damage or the toxic culture.
          III.A.10: Feasible for the manager: Yes.
          III.B.11: Proportional? Not fully, because the harm is structural and the remedy only addresses part.
          III.B.12: Restorative? Not fully, because the victim's standing in the company is not restored and the community (company) is not addressed.
          IV.A.13: Victim refuses.
          IV.B.15: Impartial spectator would not approve the agreement as adequate because it fails to address the structural harm and the victim reasonably refuses.

          Mediator's Decision: The agreement is inadequate. The mediator must consider whether to involve the company (as a third party) to address the structural issues, or if that is beyond the scope, then the case may need to be referred to the review board for alternative measures (e.g., policy changes in the company).

   Scenario 3: Unsatisfying outcome (withhold formal reconciliation despite emotional readiness)
     - Example: Two friends, Alice and Bob. Alice spread a false rumor about Bob's financial dishonesty, which caused Bob to lose social standing. Alice is genuinely remorseful and has apologized privately. Bob has forgiven Alice emotionally and they have resumed their friendship. The proposed restorative agreement is a public retraction at a community gathering. However, the mediator, applying the impartial spectator, notes that the public harm was significant and that a private apology does not restore Bob's public reputation. Yet, Bob does not want a public event because he wants to move on and avoid more attention.
     - Procedure:
          I.A.1: Harm: Public false accusation, damage to reputation.
          I.A.2: Severity: Moderate to high (in a community where financial integrity is highly valued).
          I.A.3: Reparable: By public retraction.
          I.B.4: Impartial spectator would say the harm is public and requires public remedy.
          II.A.5: Intentions: Alice acted out of anger (malicious initially, but now remorseful).
          II.A.6: Remorse: Genuine, as shown by private apology and changed behavior.
          II.B.7: Impartial spectator finds remorse genuine and proportional.
          III.A.8: Proposed remedy: Public retraction at a community gathering.
          III.A.9: Addresses the public harm.
          III.A.10: Feasible: Yes.
          III.B.11: Proportional: Yes.
          III.B.12: Restorative: Yes, because it would publicly restore Bob's reputation.
          IV.A.13: Victim (Bob) refuses the public remedy because he wants to avoid attention.
          IV.B.15: The impartial spectator would note that the refusal is based on the victim's personal preference, not on the inadequacy of the remedy. However, since the harm was public, the public remedy is still necessary for full restoration of the community's view. But forcing a public event against the victim's wishes may cause new harm.

          Mediator's Decision: The mediator must balance the victim's wishes against the community's need for public restoration. The impartial spectator would likely disapprove of the agreement without the public element because the harm was public. However, the victim's autonomy is important. The mediator might propose an alternative: a written public retraction that is available but not actively announced, to respect Bob's wish for low attention. If Bob refuses any public action, the mediator may have to conclude that the agreement is incomplete. The unsatisfactory outcome: the mediator cannot force the public remedy if Bob refuses. The agreement may be approved without the public element, but the mediator documents that the public harm remains unaddressed and that the community's perception might not be restored.

   What the procedure cannot settle:
     - Deep disagreements about values: If the community representatives and the legal staff have fundamentally different views on what constitutes harm or what is proportional, the procedure cannot resolve that. It relies on the mediator's ability to channel the impartial spectator, which is a shared human capacity but can be influenced by cultural and personal biases.
     - Cases where the harm is irreparable: The procedure can only aim for the best possible restoration, but it cannot undo the harm.
     - When the victim's refusal is unreasonable but intractable: The procedure respects victim autonomy, so if the victim refuses a remedy that the impartial spectator deems adequate, the mediator may have to accept that the reconciliation is partial.
     - Structural injustices: The procedure is focused on individual offenders and victims. It cannot fix systemic problems, though it might highlight them.

   Where the procedure is likely to misfire:
     - When there is insufficient information to assess intentions or harm.
     - When the mediator's own biases prevent an accurate channeling of the impartial spectator.
     - When the community's norms are themselves unjust (the impartial spectator should be constructed with an idealized sense of justice, but in practice, mediators may be influenced by local norms that are unfair).

   Judgment calls that remain:
     - The severity of harm (Q2) and whether the impartial spectator would agree with the victim (Q4) are judgment calls.
     - The genuineness of remorse (Q7) is a judgment call.
     - The proportionality (Q11) and restorativeness (Q12) of the remedy are judgment calls.
     - The final approval (Q15) is a judgment call.

   The procedure structures these judgments but cannot eliminate the need for human discernment.
answer: |-
  ### Restorative Justice Decision Procedure Based on Adam Smith's Moral Psychology  
  **Core Principles Embedded in the Procedure:**  
  - **Sympathy as calibrated fellow-feeling**: Requires understanding the *reasons* for emotions, not mere contagion.  
  - **Impartial Spectator**: Internal standard correcting self-deception and partiality; asks, "Would a well-informed, unbiased observer approve?"  
  - **Propriety vs. Merit**:  
    - *Propriety*: Evaluates the **intention** and emotional appropriateness of the offender's actions.  
    - *Merit*: Assesses **consequences** and whether the act deserves reward/punishment.  
  - **Stopping Rules**: Halt if any value judgment fails (⭐ denotes critical judgment nodes).  
  - **Output**: Documented rationale for review, focusing on moral desert (what is deserved) over legal guilt.  

  ---

  ### Ordered Checklist with Stopping Rules  
  **Phase 1: Harm Assessment**  
  1. **Empirical Observation**: What specific *relational/symbolic harm* occurred? (e.g., reputational damage, eroded trust).  
     - *Evidence*: Victim/testimonial accounts, public impact, institutional records.  
  2. **Empirical Observation**: What are the *demonstrable consequences*? (e.g., social isolation, loss of position).  
     - *Evidence*: Documented outcomes, third-party corroboration.  
  3. **Value Judgment (⭐)**: Would an impartial spectator, knowing all context, agree this harm *warrants moral sympathy*?  
     - *Stopping Rule*: If **no**, revise harm assessment or halt. Agreement cannot proceed.  

  **Phase 2: Offender Propriety & Intentions**  
  4. **Empirical Observation**: What did the offender *intend*? (e.g., malice, negligence, ignorance).  
     - *Evidence*: Offender’s account, prior behavior, consistency of remorse.  
  5. **Value Judgment (⭐)**: Would an impartial spectator judge the offender’s *remorse/acknowledgment* as **proportionate to the harm**?  
     - *Stopping Rule*: If **no**, require deeper accountability or halt.  
  6. **Value Judgment (⭐)**: Does the offender’s response show *sympathetic alignment* with the victim’s feelings?  
     - *Note*: Mere regret ≠ propriety; must demonstrate fellow-feeling.  

  **Phase 3: Remedy Evaluation**  
  7. **Empirical Observation**: What remedy is proposed? (e.g., public apology, restitution, community service).  
  8. **Empirical Observation**: Is the remedy *feasible*? (e.g., resources, time, institutional constraints).  
  9. **Value Judgment (⭐)**: Would an impartial spectator deem the remedy **proportionate to the harm’s severity**?  
     - *Risk*: Reject if performative (e.g., hollow apology) or excessive.  
  10. **Value Judgment (⭐)**: Does the remedy address the *relational/symbolic harm* (beyond material consequences)?  
      - *Example*: Public false accusation requires reputational restoration, not just compensation.  
      - *Stopping Rule*: If **no**, redesign remedy.  

  **Phase 4: Reconciliation & Community Restoration**  
  11. **Empirical Observation**: Does the victim accept the remedy? If not, why?  
  12. **Value Judgment (⭐)**: Would an impartial spectator approve the agreement *even if the victim refuses*?  
      - *Criteria*: Victim’s refusal reason (e.g., trauma vs. unreasonableness).  
  13. **Value Judgment (⭐)**: Could third-party observers with conflicting views converge under the *impartial spectator standard*?  
      - *Tool*: Mediator conducts "spectator-test": "Would a neutral person see this as just?"  
  14. **Final Judgment (⭐)**: Does the agreement satisfy *both propriety (intent) and merit (consequences)*?  
      - *Output*: Approve, revise, or reject agreement.  

  ---

  ### Application to Three Scenarios  
  **Scenario 1: Straightforward Case**  
  *Case*: Shopkeeper falsely accuses teen of theft publicly. Teen’s reputation suffers. Offender offers public apology + community service.  
  - **Harm**: Reputational damage (empirical).  
  - **Propriety**: Genuine remorse; apology aligns with victim’s distress (value judgment ✅).  
  - **Remedy**: Public apology directly repairs harm; proportional (⭐✅).  
  - **Outcome**: Approved. Impartial spectator sees symmetry between harm and remedy.  

  **Scenario 2: Structural Harm Exceeds Individual Remedy**  
  *Case*: Manager leaks employee’s mental health records, causing job loss. Toxic workplace culture enabled breach. Offender offers therapy funds + apology.  
  - **Harm**: Career loss + institutional betrayal (empirical).  
  - **Propriety**: Sincere remorse (empirical ✅), but **value judgment** (⭐❌): Spectator deems remedy *inadequate* for structural harm.  
  - **Remedy**: Fails Phase 3 (⭐❌)—therapy funds ignore institutional accountability.  
  - **Outcome**: Halt. Agreement rejected. Document: "Remedy cannot address systemic failure; recommend institutional reform."  

  **Scenario 3: Unsatisfying Outcome**  
  *Case*: Artist falsely accuses rival of plagiarism, damaging their career. Both now seek reconciliation, but proposed remedy is a private apology.  
  - **Harm**: Public professional sabotage (empirical).  
  - **Propriety**: Both parties emotionally ready (empirical ✅).  
  - **Remedy**: **Value judgment** (⭐❌): Private apology fails impartial spectator test—public harm demands public restoration.  
  - **Outcome**: Withhold approval despite emotional readiness. Document: "Propriety achieved, but merit requires public redress. Proposal performative."  

  ---

  ### Limitations & Judgment Calls  
  **What the Procedure Cannot Settle**:  
  1. **Irreparable Harm**: When consequences (e.g., terminal reputational damage) exceed feasible restoration.  
  2. **Cultural Relativism**: Conflicting community norms may fracture the "impartial spectator" consensus.  
  3. **Power Imbalances**: Offender/victim dynamics (e.g., institutional hierarchy) may distort sympathy calibration.  

  **Where It Misfires**:  
  - **Biased Spectators**: Mediators may unconsciously project personal values onto the "impartial" standard.  
  - **Emotional Contagion**: Over-identification with victim/offender can override fellow-feeling assessment.  
  - **Token Remedies**: Performative acts (e.g., forced apologies) may pass if harm severity is misjudged.  

  **Inevitable Judgment Calls**:  
  - ⭐ **Harm Severity** (Phase 1): No objective metric for symbolic harm (e.g., trust erosion).  
  - ⭐ **Propriety of Remorse** (Phase 2): Distinguishing guilt from shame requires subjective interpretation.  
  - ⭐ **Proportionality** (Phase 3): Balancing material/consequential vs. relational harm lacks formula.  

  **Conclusion**: This procedure systematizes Smithian ethics into actionable steps but cannot eliminate the need for mediator wisdom. It exposes *why* decisions fail (e.g., "impartial spectator rejects remedy due to performativity") and forces explicit value judgments. Review boards receive transparent rationale, separating empirical facts from moral reasoning rooted in fellow-feeling and desert.
