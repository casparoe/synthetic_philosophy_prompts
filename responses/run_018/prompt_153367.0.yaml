  The user wants to avoid the libertarian view. So, emphasizing that both RP and veto are part of an integrated system without supernatural intervention is crucial. The veto is reconceptualized as a prior update, not a causal break. This aligns with compatibilism by showing that actions are determined but regulated by higher cognitive processes.

