answer: |-
  Look, your predictive processing example perfectly *proves* the exclusion point: if the mental representation is *identical* to the precision-weighted prediction error — which is just a complex pattern of neural firing governed by physical law — then any causal work attributed to the "mental level" is already *fully accomplished* by the underlying physical dynamics. Talking about "downward causation" is just sloppy shorthand for describing how complex physical patterns (like prediction errors) non-linearly constrain other physical patterns (like further firing or synaptic changes) *within* the causally closed physical system. Neuroscientists use mental vocabulary because it’s a fantastically efficient *descriptive* and *explanatory* tool for tracking patterns at a high level of organization — it helps us *understand* the functional roles and systemic behaviors that emerge from the neural wetware without having to simulate every quark and synapse. But that doesn't grant the *mental description itself* any extra causal juice; the firing patterns and electrochemical gradients are doing all the pushing and pulling. The mental is real as a supervenient property, like the wetness of water, but just as wetness doesn’t cause anything over and above the H₂O molecules interacting, mental properties don’t add new causes — they’re how we *make sense* of the causes already fully accounted for by the physics.
