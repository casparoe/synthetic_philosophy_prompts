  At a party last weekend two friends got into it over Moore's paradox - y'know, saying its raining but i dont belive it. One said the paradox only bites in first-person present tense, and in past or third person its totally fine, so its just a pragmatic glitch about reporting beliefs not a deep logical issue. The other said thats too quick: asserting P while denying belief in P violates a rational commitment norm, so even shifting tense shows a fractured mental state. Then she threw in this twist - she said LLMs constantly output moore-paradoxical sentences because they predict tokens without tracking belief states, so the paradox might be structural for any language model, not just human speakers. He said thats apples to oranges since models dont assert anything they just sample text. Can you go through their exchange and rate each move? Whos right about the tense issue, about the rational commitment, and about whether the AI point is even relevant to the original paradox?
