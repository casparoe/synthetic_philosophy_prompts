  hey so ive been reading about epiphenominalism and that paradox where if your feelings cant cause anything, then your judgment 'im in pain' is just some brain state that has no real connection to the actual pain. can you argue that this problem dissolves if phenomenal concepts work by mirror-tracking in logical space rather than causal tracking? by mirror-tracking i mean the concept structurally maps the experience without being caused by it, so accuracy doesnt require causal efficacy. make sure your argument explains why this doesnt just turn into psychophysical parallelism or some other standard alternative.
