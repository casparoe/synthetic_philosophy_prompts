  Hmm, the user is part of a methodology board for consciousness research and needs a reusable decision procedure to evaluate proposals claiming to study qualia. They want this grounded in Chase and Sanborn's argument that qualia are incoherent because any introspective fixation collapses them into functional or cognitive features. 

  The user specifies several requirements: a step-by-step checklist usable by non-philosophers in 20 minutes, including a mandatory point where empirical data can't resolve the functional/phenomenal distinction, and explicit limitations. They also want misfire examples and application to three cases.

  I need to build this carefully. Chase and Sanborn's core insight is crucial - the moment you try to isolate a quale through introspection, you're already operationalizing it in functional terms. The checklist should test whether proposals actually avoid this collapse. 

  For structure, I'll design progressive stages:
  1. Verification check: Does the method claim phenomenal isolation?
  2. Operationalization audit: How do they define the "qualitative property"?
  3. Relational collapse test: Is it entangled with functional roles?
  4. Epistemic horizon: The key point where empirical data can't decide
  5. Residue assessment: Final check for phenomenal claims

  The mandatory empirical-limitation point must come at Stage 4 - when we ask whether the property could exist without functional correlates. No experiment can answer that. 

  Limitations to acknowledge:
  - Can't settle eliminativism vs deflationary functionalism
  - Assumes introspection requires cognitive access
  - Will wrongly fail protocols studying novel sensory modalities
  - Will wrongly pass studies that mistake rich phenomenology for qualia

  Now for the cases:
  1. The fMRI "pure red" study should fail at Stage 3 - they're measuring invariants in neural patterns, not qualia. 
  2. The synesthesia study should pass Stage 3 (subjects report non-functional colors) but hit the judgment call at Stage 4 - is this really non-functional or just unusual mapping?
  3. The "phenomenal residue audit" will fail early - their training protocol is functionally defined through counterfactuals, collapsing the very residue they seek.

  The user seems sophisticated but time-pressed. They're likely frustrated with proposals that misuse the term "qualia" loosely. My checklist should give their board philosophical rigor without requiring deep metaphysics expertise. British English means precise, slightly formal phrasing without being pompous.

  Key pitfalls to avoid:
  - Don't let the checklist become a philosophical treatise
  - Ensure each stage has binary outcomes
  - Make misfire examples concrete
  - Keep case applications clinical
answer: |-
  Below is a reusable decision procedure for your methodology board, grounded in Chase and Sanborn's argument that qualia collapse into functional/cognitive features upon introspective fixation. The checklist is operationalised for non-specialist reviewers, with stages designed to take ≤20 minutes per proposal.  

  ---

  ### **Qualia Proposal Assessment Checklist**  
  *Based on Chase & Sanborn’s Collapse Thesis*  

  **Stage 1: Phenomenal Isolation Claim**  
  - **Question**: Does the proposal explicitly claim to isolate, measure, or manipulate a *non-functional*, *non-relational* subjective property (e.g., "raw feel," "intrinsic redness")?  
  - **Criterion**: Clear textual evidence (e.g., "phenomenal residue," "qualia independent of access").  
  - **Stop-Point**: If absent → **Reject**. Proceed if present.  

  **Stage 2: Operationalisation Audit**  
  - **Question**: How is the target "qualitative property" operationally defined for measurement/manipulation?  
  - **Criterion**: Sufficient answer must specify *empirical indicators* (e.g., neural correlates, behavioural reports, stimulus parameters).  
  - **Stop-Point**: If undefined or circular (e.g., "redness-as-felt") → **Reject**. Proceed if empirically defined.  

  **Stage 3: Relational Collapse Test**  
  - **Question**: Could the operationalised property be redescribed *without loss* as a functional, cognitive, or relational feature?  
  - **Criterion**: Check for entanglement with:  
    - Attention, memory, or judgment (e.g., "subjects attend to/compare stimuli").  
    - Discriminative behavior (e.g., "reports distinguish X from Y").  
    - Causal roles (e.g., "neural signature Z *causes* report R").  
  - **Stop-Point**: If fully redescribable functionally (e.g., "redness" = discrimination capacity) → **Reject**. Proceed if proponents argue *irreducible* phenomenality.  

  **Stage 4: Epistemic Horizon (Judgment Call)**  
  - **Question**: **Could the property exist identically in a system with inverted functional/cognitive relations?**  
  - **Criterion**: This *cannot be resolved empirically* (per Chase & Sanborn). Assess:  
    - If proponents concede functional invariance undermines phenomenality → **Reject**.  
    - If they insist phenomenality survives functional inversion → **Hand to Board Judgment**.  
  - **Stop-Point**: Mandatory value judgment. Board decides: fund "confused but fruitful" research or reject as incoherent.  

  **Stage 5: Residue Assessment**  
  - **Question**: Does the method *explicitly* purge functional/cognitive access features?  
  - **Criterion**: Protocol must control for:  
    - Attentional modulation.  
    - Conceptual/linguistic mediation.  
    - Memory/association biases.  
  - **Stop-Point**: If controls are absent → **Reject**. If present but residue remains ambiguous → **Reject** (collapsed per Stage 3).  

  ---

  ### **Explicit Limitations of Procedure**  
  1. **Cannot adjudicate** eliminativism vs. deflationary functionalism (presupposes collapse occurs upon introspection).  
  2. **Tacitly assumes** an access-oriented theory of introspection (introspection requires cognitive resources).  
  3. **Misfires**:  
     - **Wrongly fails**: Proposals studying novel sensory modalities (e.g., magnetoreception) where functional roles are undefined.  
     - **Wrongly passes**: Studies conflating "rich" phenomenology (e.g., vivid imagery) with non-functional qualia.  

  ---

  ### **Case Applications**  

  **Case 1: fMRI "Pure Phenomenal-Red" Study**  
  - **Stage 1**: Pass (claims "neural signature of intrinsic redness").  
  - **Stage 2**: Pass (defines signature via fMRI activation in V4).  
  - **Stage 3**: **Reject**. "Invariance across tasks" is a *functional stability* (discriminative reliability), not intrinsic phenomenality. Signature is redescribed as "consistent visual discrimination marker."  
  - **Stop-Point**: Stage 3. **Board Conclusion**: Reject. No funding.  

  **Case 2: Chromatic Synaesthesia Behavioural Study**  
  - **Stage 1**: Pass (treats synaesthetic colours as "non-functional qualia").  
  - **Stage 2**: Pass (operationalised via colour-matching reports).  
  - **Stage 3**: Pass. Reports not directly tied to discriminative functions (e.g., subjects call sounds "red" without visual cues).  
  - **Stage 4**: **Hand to Judgment**. Property *could* be a learned associative mapping (functional) or intrinsic quality. Empirical data cannot resolve this.  
  - **Board Conclusion**: Judgment call. Likely reject per collapse thesis (synaesthetic colours are associative), but researchers may dispute.  

  **Case 3: Phenomenal-Residue Audit (Counterfactual Training)**  
  - **Stage 1**: Pass (aims to isolate "non-functional core").  
  - **Stage 2**: Pass (operation via trained reports of "what survives functional inversion").  
  - **Stage 3**: **Reject**. Training relies on *functional counterfactuals* (e.g., "imagine pain without aversion"), collapsing residue into a cognitive access feature (e.g., simulated dissociation).  
  - **Stop-Point**: Stage 3. **Board Conclusion**: Reject. Protocol operationalises "residue" as a functional capacity.  

  ---

  ### **Procedure Summary**  
  - **Time**: 15–20 mins/review (stages 1–3 rapid; 4–5 require scrutiny).  
  - **Output**: Binary reject/proceed to Stage 4, where board judgment is unavoidable.  
  - **Philosophical Anchor**: Rejects proposals conflating phenomenality with invariant function, per Chase & Sanborn’s inevitability of collapse.  

  This procedure prioritises conceptual coherence over empirical promise at the qualia-specific level, aligning with your unit’s methodological mandate. Adjust judgment thresholds in Stage 4 per board consensus on tolerating ambiguity.
