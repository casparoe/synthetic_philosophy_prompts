  hey, quick philosophical-adjacent question. my roommate talked me into co-signing an e-scooter subscription with some blockchain damage waiver thing. he said it's "basically regular insurance" but the contract actually makes me liable for pooled losses when other riders crash. he also pushed this "midnight deadline" and rushed me through the terms on his phone while i was half-asleep after a double shift. i said yes mostly because i was too depleted to process the risk chart and i didn't want conflict. he wasn't technically lying, but he definatly misrepresented the risk. now i'm wondering: given the fake urgency, my exhaustion, and that i didn't really grasp the distributed liability model, does my agreement actually hold up? or is there something structurally wrong with saying yes when you're rushed, tired, and misled about the details? please answer in american english and don't just give legal advice — i want to understand what makes this kind of agreement valid or invalid.
