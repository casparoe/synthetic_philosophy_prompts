  For mid-tier objections, the modal gap and abstract objects are tricky. Berkeleyans can bite bullets here (e.g., "mathematical objects are divine ideas"), but it costs plausibility. The weakest objections are probably evolutionary biology arguments - they miss the conceptual point entirely.

