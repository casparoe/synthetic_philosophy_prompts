prompt: |-
  hey — i'm putting together a seminar on gradated moral status and i need a spec sheet for what a theory in this space actually has to do. Not just 'insects have some weight' but the full desiderta for a view that treats sentience as a matter of degree from, say, a thermostat up through insects to humans.

  Write me the requirements list: what cases it has to handle (the slowly dimming LED, a synthetic predictive-processing loop that regulates temperature before the room shifts — does that anticipatory homeostasis earn it a spot on the gradient?), which distinctions it can't colapse (having some status vs. having a lot; phenomenal consciousness vs. functional integration), the biology it can't flat-out contradict, and why each is a real constrant not just a camp preference. Flag which ones are negotable and which are dealbreakers. Then tell me if there's a subset that's jointly unsatisfiable — i have a hunch that demanding both continuous gradation and a bright line for legal protection might be impossible together. Keep the weight on the criteria, not on scoring theories.

  Sections i want, in this order:
  1. 'The job description' — about 100 words, what the theory is for (policy? metaphysics? both?) and the range of entities it needs to cover.
  2. 'Desiderata' — about 500 words, numbered, with the motivating case or contradiction behind each. Mark negotable vs. non-negotiable.
  3. 'The squeeze' — about 150 words, which combo of requirements is jointly unsatisfiable given current science or logic.
  4. 'Quick scorecard' — about 150 words, how sentientism, biocentrism, gradualist panpsychism, and that thermostat-functionalism idea do against your list. Don't do bibliographies; a model without web access should be able to answer this.

  Make it casual — i wrote 'desiderta' in my notes and almost kept it. And don't ask for citations — half my students don't have database access this semester.
