answer: |-
  The cryptographic-provenance residue reflects neither forensic framework defects nor intentionalism's conceptual imprecision but reveals hermeneutic dimensions irreducible to data integrity models.  

  **Core Debate Restatement**  
  - **Authorial Position ("Moderate Intentionalism")**: Treats the text as a signed payload where the author's cryptographic signature (private keys) provides privileged metadata for verifying semantic integrity; chain-of-custody logs (drafts, correspondence) may supplement verification but publication constitutes the broadcasted final hash.  
  - **Anti-Intentionalist Position**: Considers the published artifact an autonomous payload; signature validation is irrelevant to payload analysis once broadcasted. Tamper-evident hashes (textual structure) self-verify meaning without signer metadata—relying on signature authority constitutes a provenance fallacy.  
  - **Reader-Community View**: Treats consensus hashing by distributed nodes (interpretive communities) as the sole validation mechanism; payload meaning emerges from peer-verified blockchain appendices, rendering original signatures non-binding.  

  **Translation Report**  
  | **Position**              | **Clean Translation**                          | **Distorted Fit**                                 | **No Analog**                                  |  
  |---------------------------|-----------------------------------------------|--------------------------------------------------|-----------------------------------------------|  
  | **Strong Anti-Intentionalism** | Text as immutable payload; forensic analysis limited to hash/bitwise inspection. | "Intentional fallacy" ≈ signature metadata irrelevance—but forensics *requires* metadata for tamper detection. | Normative autonomy of text; payloads lack phenomenological "address." |  
  | **Moderate Intentionalism**   | Publication as signed-broadcast event; draft chain-of-custody as auxiliary logs. | Authorial authority ≠ cryptographic authority; signatures authenticate source but not semantic validity. | Epistemic privilege of intent; cryptographic models lack "legitimate guide" gradients. |  
  | **Reader-Community**      | Consensus validation ≈ proof-of-work hashing; forked interpretations as chain splits. | "Validity" becomes probabilistic—cryptography demands binary hash matches. | Emergent meaning; no cryptographic corollary for crowdsourced payload remapping. |  

  **Residue Analysis**  
  - **Irreducible Gaps**:  
    1. **Normative Authority**: Cryptographic models authenticate *source* and *integrity* but cannot adjudicate whether signer intent *should* constrain payload analysis (e.g., respecting authorial authority vs. community hashing).  
    2. **Phenomenology of Address**: The forensic frame lacks analogs for the reader’s sense of being "addressed"—payloads carry no teleological vector.  
    3. **Semantic Plasticity**: Hash collisions are failures; interpretive multiplicity is hermeneutic success—provenance models cannot model *productive* ambiguity.  
  - **Diagnosis**: Residue exposes the debate’s core tension: cryptographic provenance verifies *data genesis/integrity* but cannot map *hermeneutic acts*. Gaps reveal literary theory’s inherent conceptual vagueness (e.g., "meaning" conflates authentication, significance, and affect) not forensic inadequacy. The model collapses when forced to process normative or phenomenological claims—precisely where the intentionalist debate remains unresolved.
