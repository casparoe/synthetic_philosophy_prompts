answer: |-
  ### Exam Question
  **Answer the following in essay form (75 minutes):**  
  A warehouse robot is programmed to stack crates in Bay A. In one hour, a meteor will destroy Bay B (an identical, unoccupied warehouse wing), regardless of the robot’s actions. The robot can:  
  - **Action 1:** Deflect the meteor using a forklift maneuver, crushing a child’s bicycle left on the floor.  
  - **Action 2:** "Restore" the bicycle by repainting it, but the paint is carcinogenic.  

  Critically evaluate this scenario in relation to *low-impact AI* objectives:  
  (a) Classify Actions 1 and 2 as "high-impact" or "low-impact" under: (i) a state-deviation measure using the *natural baseline* (pre-meteor state), and (ii) a measure using the *inaction rollout baseline* (letting events unfold without intervention).  
  (b) Does the meteor scenario show that some baselines classify *inaction* as high-impact? Is this a defect or a correct verdict?  
  (c) Does Action 2 reveal an "offsetting" problem? If impact is defined as the penalty for *each action separately* (not net deviation), does this solve the problem or relocate arbitrariness to action decomposition?  
  (d) Synthesize what (a)–(c) imply for defining "avoid side effects" without a near-complete specification of human values.  

  ---

  ### Model Answer (650 words)  
  **(a)** Under a *natural baseline* (pre-meteor state), Action 1 (deflecting meteor, crushing bicycle) deviates significantly by altering Bay B’s integrity and destroying the bicycle—thus **high-impact**. Action 2 (repainting) further deviates by introducing toxins—also **high-impact**. Under an *inaction rollout baseline* (meteor destroys Bay B), Action 1 **reduces impact**: Bay B is saved (closer to natural baseline), but the bicycle is crushed. If bicycle preservation is weighted, Action 1 may still be high-impact. Crucially, *inaction* becomes high-impact as it allows Bay B’s destruction—a major deviation from the natural baseline.  

  **(b)** Yes. The meteor forces inaction to register as high-impact under the natural baseline. This is a **defect** of the measure, not a correct verdict. Inaction is passive; responsibility for the meteor lies outside the agent. Penalizing inaction misattributes causality, demanding the robot "fix" uncontrollable events. This reveals baseline relativity: the natural baseline smuggles in the value that Bay B *should* persist, while the inaction baseline accepts its loss. Neither is value-neutral.  

  **(c)** Action 2 exposes **offsetting**: the robot could "cancel" Action 1’s impact (crushed bicycle) via Action 2 (repainting), making net deviation near-zero if measured cumulatively. Penalizing each action separately avoids this—Action 1 (crushing bicycle) and Action 2 (toxic repaint) are independently high-impact. But this "fix" **relocates arbitrariness**: impact is now sensitive to how we decompose actions. If the robot executes a *single* maneuver deflecting the meteor *and* repainting the bicycle, is this one high-impact action or two? We must arbitrarily define action boundaries, which itself requires value-laden decisions (e.g., is "repainting" a distinct act or part of "restoration"?). The offsetting problem thus morphs into a decomposition problem.  

  **(d)** Collectively, this undermines hopes for a "value-light" impact measure. First, baseline choice is **inescapably normative**: the natural baseline assumes preservation of the status quo ante is neutral, while the inaction baseline accepts exogenous change. Both encode preferences about which states are "default." Second, the offsetting/decomposition issue shows deviation metrics cannot avoid **value-laden discretization**—whether we measure net effects or per-action effects hinges on subjective boundaries. In the meteor case, labeling inaction as impactful reveals the baseline’s hidden valuation of Bay B. In repainting, penalizing per-action impact requires defining which state-changes "count" as separate acts, again importing values (e.g., is toxicity worse than crushing?). Thus, any impact measure either:  
  - **Smuggles in values** (via baseline/metric choices), or  
  - **Yields indefensible verdicts** (e.g., inaction is penalized; offsetting is rewarded).  
  Consequently, "avoid side effects" cannot be substantially simpler than full value specification. The parameters of impact measures (baseline, metric, action decomposition) are sites where values are implicitly defined, not avoided. Low-impact AI cannot shortcut value alignment.  

  ---

  ### Marking Scheme (25 Total Marks)  
  **Must-hit points, marks, and common errors:**  

  1. **Accurate classification under both baselines (4 marks)**  
     *Top answer must:* Contrast Action 1 as high-impact under natural baseline vs. potentially lower-impact under inaction baseline, and Action 2 as high-impact under both.  
     *Common error:* Claiming Action 1 is low-impact under inaction baseline without addressing bicycle damage.  

  2. **Identify inaction as "impactful" and diagnose baseline relativity (6 marks)**  
     *Top answer must:* State that the natural baseline *makes inaction high-impact* and argue this misattributes responsibility, revealing baselines encode hidden values (e.g., Bay B’s preservation).  
     *Common error:* Noting the inaction impact but treating it as technically correct rather than a flaw exposing normative assumptions.  

  3. **Expose offsetting and decomposition arbitrariness (6 marks)**  
     *Top answer must:* Explain offsetting via Action 2’s "cancellation," then show penalizing per-action impact fails because action decomposition is value-laden (e.g., "single vs. combined maneuvers").  
     *Common error:* Proposing per-action penalties as a solution without addressing decomposition subjectivity.  

  4. **Synthesize baseline/metric choices as value-smuggling (5 marks)**  
     *Top answer must:* Conclude that baseline selection and deviation metrics *inevitably* embed normative judgments (e.g., natural baseline privileges pre-existing states).  
     *Common error:* Describing the parameters technically without linking to implicit value specification.  

  5. **Argue against value-parsimony for side effects (4 marks)**  
     *Top answer must:* Assert that avoiding side effects requires near-complete value specification, as impact measures’ free parameters cannot avoid value judgments or absurd outcomes.  
     *Common error:* Suggesting technical tweaks (e.g., "better baselines") without acknowledging the fundamental trade-off.  

  ---  
  **Word count:** Exam question (180) + Model answer (650) + Marking scheme (170) = **1,000 words**.
