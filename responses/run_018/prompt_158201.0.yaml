answer: |-
  As a Strawsonian, I must insist your resentment is neither conceptually confused nor morally indefensible—it’s a human response to perceived injury within a relationship that persists, even as dementia distorts it. While your mother’s illness compromises her *reliable* quality of will, it does not extinguish her status as a participant in the interpersonal sphere. Resentment arises from the *felt* disregard in the moment, a protest against being treated as less than you are. This isn't mere misapplication; it’s the painful friction where your enduring expectation of goodwill collides with her fractured capacity to express it. Your resentment testifies to the depth of the relationship you still inhabit with *her*, not a clinical case study.

  You *could* adopt an objective stance—viewing her solely through the lens of neural pathology, suspending all expectations and reactive emotions. But that stance isn’t enlightenment; it’s a profound withdrawal from the messy, reciprocal dance of human relating. It turns your mother into an object to be managed, not a person to be engaged. Yes, her diminished capacity modifies our responses—we temper blame, foreground compassion, seek causes in disease, not malice. Yet, to abandon reactive attitudes entirely is to abandon the relationship itself. Your guilt acknowledges her compromised agency; your resentment laments the violation of the bond you shared. Holding both is the agonizing, defensible reality of loving someone lost within themselves. We navigate the blur, we don’t transcend it.
