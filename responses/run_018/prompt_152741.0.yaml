answer: |-
  Your roommate's argument is clever but contains several critical flaws. Let's dissect it step-by-step, preserving your intuition about premise (6) while showing where the reasoning fails:

  ### Key Problems in the Argument:
  1. **Premise (3) Misrepresents Endurantism**  
     Endurantism does **not** inherently require a "hidden fact" in branching scenarios. Endurantists can (and often do) argue that after branching, *neither* resulting entity is identical to the original person. Instead, the original person *ceases to exist*, and two new persons (qualitatively identical) emerge. This avoids a "hidden fact" by denying that identity survives duplication.  
     - *Why this saves (6)*: No in-principle unanswerable question arises because there's no "real you" to be found—both are equally new entities.

  2. **Premise (5) Misidentifies the Epistemic Problem**  
     Even if endurantism *did* imply a hidden fact (which it needn’t), the unanswerability of "Which one am I?" is **epistemic**, not metaphysical. The metaphysical fact (if it exists) could be determinate without being knowable.  
     - *Equivocation exposed*: The argument conflates:  
       - **Metaphysical determinacy** (Is there a fact of the matter?)  
       - **Epistemic accessibility** (Can we *know* the fact?)  
       Endurantism might commit to determinacy without requiring accessibility.

  3. **Premise (6) Overreaches**  
     Rejecting theories that generate "in-principle unanswerable questions" would invalidate vast swaths of rational philosophy and science:  
     - Quantum mechanics (What caused *this specific* atom to decay?)  
     - Ethics (Is there a precise utility threshold for moral permissibility?)  
     - Metaphysics (How many universes exist in a multiverse?)  
     - *Cost of giving up (6)*: Almost nothing. We routinely accept that reality contains unknowable facts (e.g., what happened before the Big Bang). This doesn’t imply irrationalism—it reflects epistemic humility.

  4. **The Perdurantism "Relocation" (8) Misfires**  
     Your roommate is right that perdurantism avoids the hidden "self" by making both branches equally real temporal parts. But calling temporal parts "occult" misses their theoretical role:  
     - Temporal parts are **explanatory posits** (like quarks or spacetime) to account for change/identity.  
     - They’re not "hidden selves"—they’re structural features of how objects persist.  
     - **Key distinction**: Perdurantism doesn’t postulate *new mysteries*; it resolves the duplication paradox by redefining persistence as a part-whole relation.

  ---

  ### Where the Argument Truly Fails: A Deeper Flaw
  The core error is assuming that **first-person identity questions must have determinate answers** in all scenarios. But branching cases (like the sleep lab) show that *persistence conditions for persons might be vague or context-dependent*.  
  - **Endurantist escape**: "Identity" might require non-branching continuity. After duplication, the original person no longer exists.  
  - **Perdurantist escape**: Both branches are equally "you" by sharing past temporal parts, but future divergence makes them distinct.  

  Neither view requires "irrational" hidden facts. The unanswerability of "Which one am I?" arises from a *misplaced demand for determinate identity* in a scenario where it genuinely breaks down.

  ---

  ### Saving Premise (6) Strategically
  If you want to preserve (6), restrict it to:  
  > *"Any view that generates in-principle-unanswerable **first-person survival questions** under normal conditions (without branching) is problematic."*  

  This salvages the intuition that we should *care* about survival without committing to absolute answers in pathological cases. We can rationally say:  
  - In non-branching worlds, endurantism gives clear survival conditions.  
  - In branching worlds, the question "Which one is me?" dissolves—both inherit your past, but neither is *uniquely* you.  

  This preserves rationality while acknowledging that identity can be indeterminate in edge cases—a position endorsed by philosophers like Parfit or Lewis.

  ### Conclusion
  - **The slip**: Premise (3) falsely assumes endurantism requires hidden identity facts in branching cases. Premise (6) implausibly demands all metaphysical questions be answerable.  
  - **Giving up (6) costs little**: It merely acknowledges that some facts (e.g., pre-Big Bang cosmology) are unknowable without undermining rationality.  
  - **Perdurantism isn't "occult"**: Temporal parts are no more mysterious than other theoretical entities (e.g., fields in physics).  

  Your roommate's argument self-destructs because it attacks persistence theories using a scenario (branching) that inherently challenges *any* account of identity—but this doesn’t force us into anti-realism. It simply shows that persistence is more complex than everyday intuition suggests.
