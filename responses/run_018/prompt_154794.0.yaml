  Where theory breaks: Chaos can't explain why those particular commanders defected—that's where game theory payoffs come in. Soldiers faced high defection rewards (future power under Yeltsin) vs. obedience risks (civil war backlash). Theory stays silent on how individual calculations aggregate into system shifts. 

  Biggest tension: Human systems have intentional actors, not just particles. The coup shows chaos-like effects but requires hybrid models. Maybe emphasize that chaos explains the cascade effect once defections start, but not the first defector's rationale. 

  User wants discipline—no forcing theory where it doesn't fit. I'll explicitly call out silences: chaos ignores backchannel deals; path dependence underestimates crisis volatility. Also, they want bidirectional analysis, so I'll end by asking what the event reveals about chaos theory's limits for history. 

