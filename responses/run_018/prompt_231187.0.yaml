prompt: |-
  I've been reading David Lewis's *Convention* (1969) and got stuck on a paragraph early in the book. In my own words, he says a convention is a regularity in behaviour where everyone conforms, everyone expects others to conform, and the regularity is arbitrary in the sense that another regularity would have served just as well if it had caught on instead. I understand the parts but I don't rally see what arbitrariness is doing in the definition, since plenty of social regularities are arbitrary but not conventional. Next month I'm leading a session for a mixed reading group—mostly retired scientists and a couple of economists, no philosophers. I don't want to lecture; I want them to see why Lewis needed exactly that package rather than a simpler idea like "a habit lots of people share." Plan the order of ideas: what must be in place before we can look at the definition, which example should carry the whole thing (I'm tempted to use driving on the left, but I suspect it hides something), what misconceptions people like us will bring and where in the sequence to head each one off, and one question I can ask at the end to see if they've actually got it. Also tell me how confident you are in the plan and which bit you're least sure of.
reasoning: |-
  Okay, the user is grappling with David Lewis's concept of convention, specifically why arbitrariness is a necessary component. They need to explain this to a group of non-philosophers—retired scientists and economists—and want an engaging session rather than a lecture.  

  First, I need to unpack why arbitrariness matters in Lewis's definition. The user already understands that conventions involve mutual expectations and behavioral regularities but questions why arbitrariness is included when many arbitrary practices aren't conventions. The key here is that arbitrariness isn't just about alternatives existing; it's about coordination. Lewis's point is that conventions solve coordination problems where multiple equilibria are possible, and the arbitrary choice locks in one solution.  

  For the session, the user wants to avoid lecturing and instead guide the group to discover why Lewis's definition is precise. They mentioned using driving side as an example but suspect it might hide nuances. That's valid—driving side is almost *too* perfect an example because it's purely arbitrary and universally recognized. But it might obscure how conventions emerge from repeated interactions or how they differ from norms with moral weight.  

  The group's background matters. Scientists and economists will likely bring misconceptions like conflating conventions with habits (which lack mutual expectations) or norms (which may have intrinsic value). Economists might over-rely on game theory, while scientists may seek empirical patterns without grasping the conceptual structure.  

  I’ll structure the session to:  
  1. Start with a coordination problem (like meeting in New York) to show why mutual expectations matter.  
  2. Contrast conventions with habits and norms to highlight arbitrariness.  
  3. Use driving side *after* establishing coordination, then complicate it with real-world variations (e.g., moralized norms like queueing) to show arbitrariness isn't always neutral.  
  4. Preempt misconceptions by addressing them mid-flow—e.g., when introducing habits, ask, "Is this just a group habit?" to trigger discussion.  

  The user’s deeper need is clarity on Lewis's philosophical rigor. They want to defend why the definition isn’t reducible to "shared habits." My plan must force the group to see that without arbitrariness, you can’t distinguish conventions from other social rules.  

  Least confident in the queueing example—while it shows how conventions can gain moral weight, it might muddy the arbitrariness point. But leaning into that tension could spark good debate. The closing question ("Is shaking hands conventional?") should test if they grasp the full package: it’s arbitrary (other greetings exist), expected, and solves coordination.  

  Confidence: 8/10. The sequence logically builds Lewis’s case, but the group’s reaction to abstract philosophy is unpredictable. Preparing concrete examples as backup is wise.
answer: |-
  Here’s a step-by-step plan for your session, designed to guide non-philosophers to *discover* why Lewis’s definition requires arbitrariness—without lecturing. The key is to start with intuitive examples and expose gaps that force the need for Lewis’s criteria.

  ### **Session Plan: "Why Arbitrariness Matters in Conventions"**
  **Goal:** Show that conventions aren’t just "shared habits" but solutions to *coordination problems* with multiple equally good options.

  ---

  #### **Step 1: Start with a Simple Coordination Problem (5 mins)**  
  - **Activity:** Pose a scenario: *"Imagine we’re all independently trying to meet in New York City, but we haven’t agreed on a location. Where would you go?"*  
  - **Why this first?**  
    - Scientists/economists will recognize this as a coordination game (e.g., Schelling focal points).  
    - Lets them *feel* the problem: success depends on aligning expectations.  
  - **Key insight:** Mutual expectations matter. If everyone expects others at Grand Central, that’s where they’ll go.  

  #### **Step 2: Contrast "Habits" vs. "Coordination Solutions" (10 mins)**  
  - **Activity:** Compare two examples:  
    - *Habit:* "Everyone in my town drinks coffee at 3 PM." (No interdependence; if I skip, others don’t care.)  
    - *Coordination:* "We all drive on the right side of the road." (If one person switches, crashes happen.)  
  - **Ask:** *"What’s the difference? Why does driving need more than just habit?"*  
  - **Preempts misconception:** Habits lack mutual expectations. Driving *requires* me to expect you’ll drive right too.  

  #### **Step 3: Introduce Arbitrariness — The "Could Have Been Otherwise" Test (15 mins)**  
  - **Activity:** Use **driving side** but *complicate it*:  
    - *Fact:* The UK drives left; France drives right. Both work equally well.  
    - *Ask:* *"Would driving on the left work in France? Why hasn’t France switched?"*  
  - **Then pivot to a non-arbitrary example:**  
    - *Traffic rule:* "Everyone stops at red lights."  
    - *Ask:* *"Is this arbitrary? Could green mean ‘stop’ just as well?"*  
      - **Reveal the trap:** Red is *not* arbitrary (e.g., long-wavelength = more visible).  
      - **Contrast:** Driving side has *no physical reason* for left/right preference; red lights do.  
  - **Why this works:**  
    - Scientists see that arbitrariness = multiple stable equilibria (no efficiency difference).  
    - Economists link to payoff structures in games.  

  #### **Step 4: Attack the Definition — Why Not Just "Shared Expectations"? (10 mins)**  
  - **Activity:** Test a flawed definition: *"A convention is when we all do X and expect others to do X."*  
    - *Counterexample:* "Tipping 20% in the US."  
      - Everyone does it, expects others to… but *why*?  
      - **Ask:** *"Is this arbitrary? Could 15% work? Why not?"*  
      - **Reveal:** Tipping isn’t *fully* arbitrary—it’s tied to social pressure, wages, and moral norms.  
  - **Misconception headed off:** Not all social regularities are conventions. Tipping is a *norm* (moral/economic pressure), not a pure coordination device.  

  #### **Step 5: Lewis’s Full Definition — The "Package Deal" (5 mins)**  
  - **Present the definition:**  
    > Regularity R in behavior where:  
    > (1) Everyone conforms to R.  
    > (2) Everyone expects others to conform.  
    > (3) R is arbitrary → another rule R’ *could have worked* if others used it.  
  - **Connect to examples:**  
    - Driving side: ✓ Arbitrary (left/right equally good).  
    - Tipping: ✗ Not arbitrary (15% disrupts social expectations asymmetrically).  

  #### **Step 6: Final Test Question (5 mins)**  
  - **Ask:** *"Is ‘shaking hands when meeting’ a convention? Why or why not?"*  
    - **Why this works:** It tests all criteria:  
      - Conformity? ✓ (in some cultures).  
      - Expectations? ✓ (you expect others to offer a hand).  
      - Arbitrary? ✓ (bows, nods, or hugs could work—but didn’t "catch on").  
    - **Trap:** If they miss arbitrariness, they’ll call it a norm/habit.  

  ---

  ### **Confidence & Weak Spots**  
  - **Confidence: 8/10**  
    - The sequence builds logically: problem (coordination) → solution (expectations) → refinement (arbitrariness).  
    - Examples are relatable and create "aha" moments by contrasting cases.  
  - **Least Confident Part:** Step 3 (Arbitrariness test).  
    - **Risk:** Scientists may fixate on technicalities (e.g., "Is *anything* truly arbitrary?").  
    - **Mitigation:** Stress Lewis’s "could have served equally well" (e.g., left/right driving both avoid crashes). Avoid semantic debates—focus on functional equivalence.  

  ### **Why Driving Side Works (and How to Avoid Hiding Nuances)**  
  - It *is* the best example **if** you clarify:  
    - Left/right are symmetric solutions before one is chosen.  
    - Post-convention, switching costs arise—but the *origin* is arbitrary.  
  - **Alternative:** Use "which side to pass on a sidewalk" for lower stakes.  

  ### **Key Insights for Your Group**  
  - **Arbitrariness does the work** of excluding:  
    - Norms (e.g., "don’t steal" → not arbitrary; moral weight).  
    - Solutions with single equilibria (e.g., "use the strongest bridge" → not arbitrary; efficiency matters).  
  - Lewis’s definition captures *coordination conventions specifically*—not all social rules.  

  This plan forces the group to *see* the gaps in simpler definitions, making arbitrariness indispensable. They’ll leave understanding that conventions are the "rules of the game" when multiple rules could win.
