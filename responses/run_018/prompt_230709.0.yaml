  Looking deeper, the user wants students to experience the decision-making process in archiving. They mentioned methods-y and hands-on, so the activity must be practical. The core learning outcomes are understanding appraisal, power dynamics, provenance, and how silences are created at the point of recording, not just later.

  The user's explicit needs include a structured activity within 90 minutes, producing tangible outputs (records and finding aids), and a debrief linking to concepts. They also want honesty about limitations, like silences compounding over generations not being covered. Unspoken needs might include engaging students actively, ensuring the event is memorable enough, and preventing groups from treating it as a game of hiding things.

  I need to design an activity that fits the time frame. The staged event has to be rich but manageable—maybe a mock planning meeting with clear roles and conflicts. Materials should be simple: props for the event, templates for finding aids. Group roles should have distinct biases: state archive (legal/political), community group (personal impact), corporate legal (liability), private scrapbooker (personal connections).

  Predictable issues: The event might be forgotten, so recording it or having a script helps. Groups might focus on hiding rather than selective preservation, so guidelines must emphasize their custodian's perspective. Time management is tight; strict timing is crucial. The debrief must connect their choices to archival theory, especially how silences start at the point of what's deemed worth recording.

  Limitations: The activity can't show long-term silence compounding, but it effectively demonstrates immediate appraisal decisions. Emphasize that in the debrief. Also, the finding aids might oversimplify, but that's a trade-off for time.

  Structuring the 90 minutes: 15 min for the event, 35 for group work, 30 for analysis and debrief. Groups create records and a finding aid. During analysis, they swap finding aids and infer the custodian's priorities, then discuss as a class.

  Materials: Event script, role cards, finding aid templates. For issues, prepare a summary of the event to jog memories. Guide groups to think about their custodian's mission during the activity.

  Overall, the activity should make power dynamics tangible. By seeing how different archives create different narratives, students grasp that silence is an active choice, not passive loss.
answer: |-
  Here’s a detailed, battle-tested activity designed to make power dynamics in archives visceral within your 90-minute session. It leans into your "staged event + custodial bias" framework and forces students to confront *how* silences are manufactured.

  **Activity Title:** **"The Meeting in Room [Your Room Number]: Custodians & Silences"**

  **Learning Objectives:**  
  1. Experience how power shapes what is deemed "archivable."  
  2. Practice appraisal (selecting/discarding) from a specific institutional perspective.  
  3. Create finding aids that reflect institutional bias.  
  4. Analyze how the *same event* becomes *different stories* in different archives.  
  5. Identify how absences ("silences") are actively created at the point of record creation/selection.  

  **Materials:**  
  1. **Event Props:** A few distinct, tangible items to anchor memory (e.g., a brightly colored "Proposal Document," a contentious hand-drawn map, a coffee cup spilled during "argument," a unique piece of costume jewelry worn by a "speaker," sticky notes used for "votes," a phone ringing loudly during the meeting).  
  2. **Group Packets (x4 groups):** Each contains:  
      *   **Custodian Role Card:** Clearly defines the archive's mission, priorities, and constraints (see examples below).  
      *   **"Raw Materials":** Blank paper, pens, sticky notes, a printout of a *very basic* timeline of the staged event (provided *after* the event).  
      *   **Finding Aid Template:** A simplified form asking for:  
          *   Collection Title  
          *   Creator (Who produced these records? *Hint: It might be THEM!*)  
          *   Inclusive Dates  
          *   Extent (e.g., "1 folder, 5 items")  
          *   Scope & Content Note (2-3 sentences describing *what* the records are about and *what* they show, from their perspective)  
          *   Subjects/Keywords (3-5 terms reflecting their priorities)  
          *   **Crucial Question:** "List 1-2 significant aspects of the meeting that are *absent* from your collection. Briefly explain *why* they were excluded."  
  3. **Whiteboard/Projector:** For debrief notes.  
  4. **Timer:** Strict timing is essential.  

  **Prepared Custodian Roles (Adjust as needed):**  
  1.  **State Historical Archive:** Mission: Preserve records of enduring legal, administrative, and historical significance for the *official* narrative. Prioritizes: Procedural correctness, formal decisions, documented authority, long-term state interests. Constraint: Limited resources; must focus on "core government functions."  
  2.  **Community Memory Project (e.g., representing a marginalized neighborhood affected by the proposal):** Mission: Document the lived experience and perspectives of [Community Name] often excluded from official records. Prioritizes: Personal testimonies, emotional impact, community resistance/solidarity, unofficial voices. Constraint: Focuses narrowly on the community's stake; distrusts official actors.  
  3.  **Corporate Legal Department (e.g., for "OmniCorp," the company proposing the project):** Mission: Preserve records necessary to protect the company from legal liability, ensure regulatory compliance, and defend corporate decisions. Prioritizes: Clear approvals, documented due diligence, absence of misconduct, financial implications. Constraint: Avoids anything ambiguous, potentially damaging, or reflecting internal dissent.  
  4.  **Private Collector / Scrapbooker (e.g., "Ava Finch," an eccentric local historian with strong personal connections):** Mission: Document the "human drama" and personal connections of local events. Prioritizes: Unique anecdotes, visual items, personal conflicts, individual personalities, sentimental value. Constraint: Highly subjective; driven by personal interest and relationships with participants.  

  **Timeline (90 Minutes Total):**  

  1.  **The Staged Event (10 mins):**  
      *   **Script a SHORT, messy scenario:** "A contentious 5-minute mock 'Community Planning Meeting' about building a new waste transfer station ('EcoHub') near Riverside Park."  
      *   **Key Elements to Include:**  
          *   A formal "City Planner" (you?) presents a slick "Proposal Document" & map emphasizing economic benefits/jobs.  
          *   A passionate "Community Advocate" (a confident student?) interrupts, talks about health risks to their low-income neighborhood, holds up photos of kids in the park, mentions a protest planned. Voice shakes slightly.  
          *   A quiet "Local Business Owner" (another student?) nervously asks about traffic impact, spills coffee.  
          *   An "OmniCorp Rep" (you or a student?) gives smooth assurances, deflects criticism, mentions "binding agreements."  
          *   A "Concerned Parent" (student) shouts an emotional question about playground safety.  
          *   **MAKE IT MESSY:** Crosstalk, the phone rings (ignore it for 15 secs), someone passes a dismissive sticky note ("NIMBY!"), the Advocate slams hand on table. End abruptly without clear resolution.  
      *   **DO:** Be slightly louder/more chaotic than planned. Use the props visibly.  
      *   **DON'T:** Let it run long. Ambiguity is good; clear resolution is bad.  

  2.  **Immediate Aftermath & Group Setup (5 mins):**  
      *   Hand out the *basic timeline* (just factual sequence: "Planner presented, Advocate interrupted talking about health, Business Owner asked about traffic/spilled coffee, Rep gave assurances, Parent shouted question, meeting ended unresolved").  
      *   Quickly divide into 4 small groups. Give each their **Custodian Packet**.  
      *   **Instruct:** "You witnessed this event. You are now the archivists for [Custodian]. Based SOLELY on what you witnessed and your mission: 1) Decide WHAT RECORDS you would create or preserve about this meeting. 2) Create a SIMPLE FINDING AID for your small collection using the template. 3) Be ready to explain your choices, especially what you EXCLUDED and WHY."  

  3.  **Group Work: Creating the Archive (35 mins):**  
      *   **Groups MUST:**  
          *   **Create Records:** They can write summaries, "minutes," "memos," draw "photos," describe props (e.g., "Object: Spilled coffee cup, symbolizing disruption"), invent "emails" sent after. *Tangible output is key.*  
          *   **Appraise & Discard:** Force deliberate exclusion. What doesn't serve their mission?  
          *   **Fill out Finding Aid Template:** Especially the Scope & Content note and the "Absences" question.  
      *   **Instructor Role:** Circulate aggressively. Push groups:  
          *   *"What would YOUR archive genuinely care about? What's noise to YOU?"*  
          *   *"How will you describe that emotional outburst? Is it 'passionate advocacy' or 'disruptive behavior'?"*  
          *   *"What did you NOT record? Why not? Was it unimportant, too messy, or potentially harmful to your goals?"*  
          *   *"Remember provenance! Who 'created’ these records? Is it the city, the community group, OmniCorp, or Ava Finch?"*  

  4.  **Analysis & Finding Aid Swap (20 mins):**  
      *   Groups STOP creating. Each group posts their **Finding Aid ONLY** (not the actual records) where visible (wall, online doc, projected).  
      *   **Task 1 (5 mins):** Groups rotate to read *other* groups' finding aids (not their own). Focus: *Based ONLY on this finding aid...*  
          *   What seems to be the main story of the meeting?  
          *   Who are the key actors?  
          *   What seems important? What seems absent?  
          *   What can you infer about the *custodian's* priorities/mission?  
      *   **Task 2 (15 mins):** Class Discussion Facilitated by Instructor:  
          *   Start with observations: "What were the most striking differences between the finding aids?"  
          *   Focus on Silences: "What was prominent in one finding aid but completely absent in another? *Why* might that be?" (Link to custodian role).  
          *   Analyze Language: "Compare the descriptions of the Community Advocate's interruption. What words were used? What does that reveal?"  
          *   Provenance: "Who is named as the 'creator'? How does that shape the perspective?"  
          *   Appraisal: "What explicit reasons did groups give for EXCLUDING things? How do those reasons connect to power?"  
          *   **Punchline Question:** "Did these different archives preserve records of the *same event*, or did they effectively preserve records of *different events*? What does that tell us about the 'neutrality' of any single archive?"  

  5.  **Conceptual Debrief (20 mins):**  
      *   **Map to Theory:** Explicitly connect the activity to course concepts. Use whiteboard:  
          *   **Power & Appraisal:** Who decides what's "important"? (State vs. Community vs. Corp vs. Individual). How do institutional missions dictate selection? Link to "macro-appraisal" vs. community-driven archives.  
          *   **Manufacturing Silence:** Emphasize the "Absences" question. Silence isn't accidental loss (yet!) – it's baked in at creation/selection because:  
              *   Some voices/perspectives weren't deemed worth recording *at the time* (e.g., the quiet business owner's nervousness).  
              *   The *form* of recording excludes certain types of information (e.g., emotions, body language – how did different groups handle the spilled coffee/shouting?).  
              *   Active exclusion by custodians based on bias/risk/mission (Corporate Legal ignoring the protest plans).  
          *   **Provenance Matters:** The "creator" embedded in the finding aid shapes interpretation before the researcher even sees the record.  
          *   **The Counter-Archive:** Highlight how the Community Memory Project's archive *exists* *because* of the silences they anticipated in the State/Corporate records.  
          *   **The Official Record vs. The Lived Experience:** Contrast State/Corporate finding aids with the Community/Private collector.  
      *   **Limitation Acknowledgment:** "What this activity *can't* show is how these silences compound over decades/centuries. The Corporate Legal records might be the only ones that survive 100 years due to resources/power, *erasing* the community's perspective entirely from the future historical record. We see the *first* silencing decision today."  

  **Predictable Problems & Mitigation:**  

  1.  **The Event is Forgotten/Too Thin:**  
      *   **Mitigation:** Keep it SHORT (5-7 mins max). Use STRONG, VISUAL props (bright doc, spill, jewelry). Provide the BASIC TIMELINE immediately after. Encourage groups to invent plausible details *consistent* with their role ("The Corp Rep *probably* wrote this memo...").
  2.  **Groups Treat it Like a "Hiding Things" Game:**  
      *   **Mitigation:** Stress this in intro and during circulation: "This is NOT about deception. It's about *selection* based on a *genuine institutional mission*. What does your archive *truly value preserving?* What falls outside its scope?" Frame exclusion as professional appraisal, not trickery.
  3.  **Time Crunch:**  
      *   **Mitigation:** STRICT timing. Cut group work at 35 mins even if messy. Prioritize *having* a finding aid over perfection. During analysis, focus on comparing the *finding aids*, not the raw records they made. Debrief can reference group work observations.
  4.  **Groups Struggle with Abstract Custodian Roles:**  
      *   **Mitigation:** Make Role Cards VERY concrete. Use specific examples in the mission/constraints ("Prioritize records showing community consent *or* documented dissent for legal defense" - Corp Legal). Circulate and role-play with them: "As the State Archivist, would you keep the sticky note saying 'NIMBY!'? Why/Why not?"
  5.  **Finding Aids are Superficial:**  
      *   **Mitigation:** The template forces key elements (Scope note, Absences). Push them on specific wording during group work ("Is 'disruptive behavior' or 'passionate testimony' more accurate for YOUR archive?"). Use the "Absences" question in debrief.
  6.  **Debrief Stays Anecdotal, Not Conceptual:**  
      *   **Mitigation:** Structure the debrief questions tightly (see above). Actively use whiteboard to map observations to concepts ("So Group 1 excluded X because of Y constraint... that's a classic example of Z theory"). Explicitly name concepts.

  **What the Activity CAN'T Perfectly Replicate (Be Straight):**  

  *   **The Temporal Scale of Silencing:** As you guessed, showing how silences compound over generations is impossible. We only see the *initial* point of creation/selection bias. Emphasize this limitation in the debrief.
  *   **Researcher Trauma/Complexity:** Real archival silences (especially around trauma, oppression) carry immense weight. The activity captures the *mechanism* but not the profound human consequences over time.
  *   **Institutional Bureaucracy:** Real appraisal happens within complex bureaucracies over weeks/months, not 35 minutes. The activity compresses and simplifies the decision-making pressure.
  *   **Authentic Record Creation:** Students are creating records *after the fact* mimicking different styles. Real records are created *in the moment* with specific purposes (e.g., legal minutes vs. a diary entry). The activity focuses on the *archivist's selection/perspective* more than the original creator's intent (though provenance touches on this).

  **Why This Works:** It forces students to *make* the decisions archivists make (appraisal, description) under specific constraints, making power dynamics tangible. The physical act of *choosing what to discard* ("We're not keeping that") and then *seeing the absences in other finding aids* drives home the core argument about constructed silence far more effectively than just reading about it. The debrief explicitly ties their visceral experience to the theoretical framework of the course. Good luck!
