  Okay, the user is a professor prepping for a metaphysics seminar, grappling with a grad student's argument about universals. The argument uses "co-instantiation looping" to claim universals collapse into tropes. The professor senses a scope slip or equivocation but can't pinpoint it. 

  First, I need to parse the argument carefully. Step (1) seems plausible: if U is in both a and b, there's a structural fact F about their sharing. But step (2) claims F itself "contains" U, implying U is instantiated *within* F. That's the pivot. Is F instantiating U, or merely referring to it? The student conflates "U as constituent" with "U as instantiated"—like confusing the blueprint (constituent) with the building (instance). 

  Step (3) then spirals: each sharing fact creates new instances, exploding U's count. But universals shouldn't multiply per instance; that's trope territory. Step (6) forces a false dilemma: fragment U or deny co-instantiation facts. 

  The core error is in step (2). Facts about instantiation don't *instantiate* the universal themselves; they *describe* its instantiation elsewhere. When we say "F contains U," it’s compositional (like a sentence containing a subject), not existential (like a subject exemplifying redness). Rejecting this costs nothing—it just clarifies that facts are representations, not new instances. 

  The professor worries this might require "mysterious uninstantiated universals" or deny fact structure. Not so. Universals exist when instantiated in particulars (a, b), not in facts about them. Facts remain structured without becoming new exemplars. The loop vanishes once we distinguish predication from composition. 

  As for the grad student's "proves too much" point: if applied to relations, the same equivocation would arise. But relations aren't instantiated *by* relational facts; they’re constituents. Nominalism isn’t smuggled in—realism just needs careful metaphysics of facts. 

  Final thought: The professor’s instinct about equivocation was sharp. The cost of rejecting step (2) is minimal; it preserves realism by cleaning up how facts work. No uninstantiated universals needed. Just better ontology hygiene.
answer: |-
  Let me unravel this carefully. The argument is clever but contains a critical misstep at premise (2), where it conflates two distinct metaphysical roles: a universal serving as a *constituent* of a fact versus being *instantiated* within that fact. This equivocation generates the problematic looping. Allow me to reconstruct the reasoning and pinpoint where it goes astray.

  The first premise is defensible: if a universal U is genuinely shared by particulars a and b, there must be some truth about their co-instantiation. We can call this truth a "structural fact" F, where F is the complex *that-U-is-in-both-a-and-b*. Problems begin with the claim that F itself "contains" U. Certainly, F *involves* U—U is a constituent of F, just as particulars a and b are constituents. But being a constituent is not equivalent to being instantiated. Premise (2) incorrectly assumes that if U is a component *of* F, then U must be instantiated *within* F. This is the sleight of hand. Consider: when we say "the fact *that-a-is-red* contains the universal *redness*," we mean redness is a constituent of that fact, not that the fact itself *is red*. The fact isn't crimson or scarlet; it isn't exemplifying redness. It merely refers to redness as part of its structure. The instantiation of redness occurs in the particular a, not in the fact about a.

  Once this distinction is clear, the loop dissolves. Step (3) claims every co-instantiation generates a "fresh instantiation" of U within F. But if F merely has U as a constituent rather than as an exemplified property, no new instantiation occurs. F is about U's instantiation in a and b; it doesn't itself instantiate U. Consequently, step (4)'s exponential explosion of instantiations doesn't follow. There are still only the original n instances in the particulars. The co-instantiation fact F is a single additional entity, but it doesn't host a new *instance* of U—it hosts U as an abstract component.

  Rejecting step (2) on these grounds avoids both horns of the dilemma in step (6). We don't need to fragment U into tropes, nor do we need to deny that co-instantiation is a real fact. We simply clarify that facts are complex entities with constituents (including universals) that represent states of affairs without exemplifying those universals themselves. This doesn't force us into mysterious uninstantiated universals; U is still instantiated—just only in the particulars a and b. Nor does it require abandoning fact structure; facts retain their constituents (U, a, b, and the instantiation relation), but this structure doesn't entail that every constituent is actively exemplified within the fact.

  Your grad student's worry that this "proves too much" for relations or resemblance is insightful but misplaced. The same distinction applies. A relational fact (e.g., *a-is-larger-than-b*) contains the relation *larger-than* as a constituent, but the fact itself isn't "larger than" anything. Similarly, a resemblance fact between tropes would contain the resemblance relation as a constituent without resembling anything itself. No vicious loop emerges. The argument only threatens universals if one accepts the initial equivocation, which we've blocked.

  The cost here is accepting that facts are finely structured entities with a unique ontological role: they "contain" universals and particulars compositionally without instantiating the universals they contain. This might seem subtle, but it's a routine move in realist metaphysics—akin to how a sentence can *mention* a property without *exemplifying* it. It preserves the repeatability of universals while avoiding inflation or collapse into tropes. Your instinct about a scope slip was correct; the sleight occurs precisely at the blurring of compositional containment and exemplification. Once that is untangled, the looping chain breaks, and realism about universals remains tenable without exotic commitments. 

  ---

  This should hold up under seminar scrutiny. If your student pushes back, press them on why a fact's compositional inclusion of U must entail U's instantiation *by* the fact. That’s the crux.
