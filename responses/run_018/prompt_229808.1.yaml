prompt: |-
  I'm preparing a handout for a philosophy-of-mind reading group on the question of whether the badness of pain is built into the pain itself or is a separable response to it, and I want the session organized around a single thought experiment constructed to order. The background I'm working from is this. Pain researchers sometimes distinguish a sensory-discriminative component of pain — where it is, how intense it is, and its felt quality, such as sharp, burning, or throbbing — from an affective-motivational component — how unpleasant it is, how much one wants it to stop, and how strongly it drives escape and avoidance. There are also clinical reports, under the label pain asymbolia, suggesting the two can come apart: patients locate the sensation, describe it as sharp or hot, and rate its intensity normally, yet report that it does not bother them and that they feel no urge to withdraw. The clinical cases are messy, though, because they involve lesions or drugs, and a skeptic can always say the patients are confabulating, or that what they have is not really pain.

  I'd like a thought experiment that does in ordinary life, cleanly, what those clinical cases gesture at. Construct a single realistic scenario — no brain lesions, no drugs, no exotic interventions — in which a normal subject has an experience that is unambiguously painlike on the sensory-discriminative dimension (localized and intense, with a definite pain quality, described in pain vocabulary, rated high on an intensity scale, and something the subject is prepared to call painful) while the affective-motivational component is absent or inverted: the subject reports no unpleasantness, no desire for the experience to stop, no urge to escape, and no overall wish to be rid of it. Do not simply stipulate those attitudes; the situation — context, framing, habit, or background understanding — has to generate them, otherwise the case just asserts the very verdict it was built to produce. You may draw inspiration from everyday dissociations such as a habituated chili-eater's burn, a runner's welcome soreness, or a meditator's pain without suffering, but whichever case you choose, specify it concretely enough that the reports and behavior follow from the story. Keep the scenario itself to a paragraph or less.

  Now run the case through the two positions the handout will contrast. The intrinsic-badness view holds that unpleasantness is constitutive of any genuine pain experience: a sensation with the sensory profile of pain but no aversiveness is at most a nociceptive, damage-signaling event, not pain. The separable-response view holds that the sensory core and the affective-motivational layer are distinct components that ordinarily travel together but can in principle detach, so the case is a genuine pain whose badness has been peeled off. For each view, state the verdict it is forced to give, the exact feature of the subject's report or behavior that forces it, and the point at which the two diagnoses diverge. Then be candid about the machinery: identify the single load-bearing feature of the scenario that lets the two components come apart; say what happens if that feature is removed, that is, whether the case collapses back into an ordinary painful episode or an ordinary non-pain; and say how a defender of the intrinsic-badness view would best attack the case, for example by reclassifying the experience or by arguing that some unpleasantness is still present but merely outweighed. The aim is not to declare a winner; I want the handout to present the strongest version of both sides. End with a single-sentence summary of the load-bearing feature as the last line, preceded by 'Summary:'.
