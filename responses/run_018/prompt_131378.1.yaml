  Notably, the user flags that the guest might deny moral status implications, so that question should corner him into engaging. The evidence question must avoid "feels wrong" responses—needs measurable failure cases. 

  For the CDT smuggling question: The core tension is that no-mirror forbids modeling predictors' models of you, which feels like CDT's focus on physical acts over epistemic loops. Follow-up should target whether this collapses to CDT pragmatically. 

  For Luring Lottery: At recursion level N, predictors break if they can simulate level N but not N+1. Why does level 4 work but 5 fail? Follow-up should push whether the paradox just shifts upward. 

  For PD coordination: If indexed evidentialism uses peer-reference, it might force cooperation. Follow-up attacks whether this ignores dominance. 

  Moral status question: If rational transparency affects blame (e.g., transparent agents are "more responsible"), that's counterintuitive. Guest will deny, so follow-up asks if his view *entails* it anyway. 

