prompt: |-
  I run a small philosophy podcast thats mostly decision theory and weird thought experiments. Next week im interviewing a philosopher who defends this hybrid position on the Platonia dilemma and the Luring Lottery — he calls it indexed evidentialism with a no-mirror constraint on self-prediction, and he thinks superrationality only holds inside a three-level recursion cutoff where the predictor can model your reasoning but you cant model the predictor modeling you past that boundry. I dont want him just restating the view. Can you draft me about seven or eight questions that actually press the content?

  I need at least one asking why his no-mirror constraint doesnt just smuggle causal decision theory in through teh back door, one on what exactly breaks in the Luring Lottery if the predictor can model reasoning up to level four but not five, and one about whether indexed evidentialism forces rational agents to always coordinate in one-shot prisoners dilemmas even when defection strictly dominates. For each, include a follow-up keyed to the answer hes most likely to give — like the standard "but then you cant distinguish rational choice from magical thinking about causation" reply, or the "doesnt that just push the paradox up one level" move.

  Also maybe a question about whether his view makes moral status or blame depend on how transparent your reasoning is to outside observers, since that seems like a weird downstream consequence he probably denies but should address. And one about what evidence could actually count against the three-level cutoff — not just "it feels wrong," but something concrete. Keep it casual, no generic "what drew you to philosophy" stuff, and dont ask for citations or a reading list since he can just make up references.
