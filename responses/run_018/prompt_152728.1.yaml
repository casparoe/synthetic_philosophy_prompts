  Ah! The key is *why* something feels central. If it’s just statistical feature density (e.g., soccer has rules/competition/teams, while wall-ball is solitary), that’s compatible with family resemblance. Essentialism would demand soccer’s features be necessary. But Wittgenstein rejects that—ring-a-rosie still counts via other resemblances (playfulness, repetition).  

  So graded membership? Yes, but as an emergent property of the web, not a hierarchy baked into the category. The rope holds without a core fiber; our minds just notice thicker overlaps. The user’s insight is spot-on: Wittgenstein *can* accommodate this without essentialism. Rosch’s work actually extends his idea empirically—typicality gradients don’t contradict the rope, they describe how we navigate it.  

