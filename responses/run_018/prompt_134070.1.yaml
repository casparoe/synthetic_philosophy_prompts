answer: |-
  Your verdict is mistaken: this researcher never simultaneously held contradictory beliefs. During grant writing, she accessed a *selective memory representation* ("successful study") while deliberately suppressing attention to the disconfirming raw data's existence – a willful act of *avoidance*, not genuine ignorance. When later confronted, she accessed the accurate *stored knowledge* ("garbage data"). At no point did her conscious mind affirm both "p" (study valid) and "not-p" (study invalid) concurrently; she merely toggled between different cognitive states using selective attention and memory retrieval. Irrational? Absolutely. Self-serving compartmentalization? Clearly. But literal self-deception? Logically incoherent. The mind shifts states; it doesn't inhabit contradictions.
