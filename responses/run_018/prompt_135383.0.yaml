     However, note: the contradiction in set theory is about set membership, which is a single relation. In our architecture, we have two relations: reference and cataloging. But we linked them by saying that cataloging is implemented by reference. Thus, we have a single relation (reference) and the cataloging is defined via that relation. Then the mapping is clean.

