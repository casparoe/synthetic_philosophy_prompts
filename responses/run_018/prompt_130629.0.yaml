  Hmm, the user mentions Block-style overflow and partial-report paradigms upfront, which tells me they're already familiar with key counterarguments. That's helpful context - they're not a beginner. The mention of "causally inert" suggests they're wrestling with epiphenomenalism worries, probably in relation to neural correlates of consciousness research.

  First, I should map their analogy properly: studio=unconscious processing, raw feed=phenomenal consciousness, broadcast tower=global workspace, viewers=downstream systems, archive=memory. But immediately I see problems - the raw feed isn't just sitting there passively; it's actively shaped by studio equipment (unconscious processes). 

  The big issue is whether unaired footage can influence the studio itself. In neuroscience terms, this maps to recurrent processing - phenomenal states might feed back into their own formation without reaching global broadcast. Think of binocular rivalry cases where suppressed stimuli still modulate behavior. And Block's overflow experiments directly show subjects reporting more richness than working memory can hold.

  Partial-report paradigms are even more damning for the analogy. When subjects report cued parts of a scene, it suggests the "unaired footage" was already structured enough to allow selective access. The raw feed must be doing work locally before broadcast.

  For alternatives... maybe a construction site? Phenomenal states are like temporary scaffolding actively shaping the building (cognition), not just unused materials. Or a control room with local operators (phenomenal) who can sometimes override the main broadcast. These better capture both the causal potency and the graded access.

