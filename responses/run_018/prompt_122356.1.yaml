prompt: |-
  Consider the institutional pattern in family and reproductive law: genetic paternity is settled by DNA testing with near-decisive legal weight, yet adoption severs all legal ties to genetic parents and creates identical inheritance and custody rights with social ones; meanwhile, in jurisdictions that recognize multi-parent IVF arrangements, a child may have genetic contributors, a gestational mother, and intended social parents, with rights distributed among them as if genetic origin is one administrable factor rather than a metaphysical boundary. What view of origin essentialism — the idea that you could not have come from a different sperm and egg and still be you — does this pattern presuppose? Reconstruct the implicit theory: does the law treat genetic origin as constitutive of personal identity, as mere evidence for social responsibility, or as something else? Distinguish what the practice strictly requires from what it merely accommodates; assess whether its parts are consistent with one another; and specify what would have to change in paternity doctrine, adoption, and multi-parent recognition if the law explicitly adopted strict origin essentialism, or if it explicitly rejected it altogether.

  Return your analysis as a JSON object with these fields: "practice_summarized" (the institutional pattern in one or two sentences), "reconstructed_theory" (the implicit view of origin and identity), "strict_presuppositions" (what the practice cannot do without), "compatible_alternatives" (other philosophical views that also fit), "internal_consistency" (whether the parts cohere or conflict), "changes_if_essentialism_adopted" (how law would change), and "changes_if_essentialism_rejected" (how law would change).
reasoning: |-
  We are analyzing the institutional pattern in family and reproductive law with respect to genetic origin and personal identity.

  Pattern summarized:
  - Genetic paternity is established by DNA testing and carries decisive legal weight.
  - Adoption severs all legal ties to genetic parents and grants the adoptive parents full rights and responsibilities as if they were the biological parents.
  - In some jurisdictions, multi-parent arrangements (via IVF) allow for genetic contributors, a gestational mother, and intended social parents to share rights, treating genetic origin as one factor among others.

  Reconstructed theory:
  The law seems to treat genetic origin not as a metaphysical boundary that defines who the person is (i.e., not as strictly essential for personal identity), but rather as a starting point for assigning legal responsibilities and rights. However, the law also allows for reassignment of these rights and responsibilities based on social arrangements (adoption) or shared intentions (multi-parent IVF). Therefore, the implicit view is that genetic origin is a strong default indicator of parental responsibility and a basis for legal ties, but it is not treated as an unalterable fact that defines the child's identity. Instead, the law prioritizes social relationships and intentional parenthood in many cases.

  Strict presuppositions (what the practice cannot do without):
  1. Genetic origin is a highly reliable and objective method for establishing a biological link that can be used as a default for assigning parental rights and responsibilities in the absence of other arrangements.
  2. The law must have a clear and consistent way to assign legal parenthood to ensure the child's welfare and to settle disputes.
  3. The law must be flexible enough to accommodate social realities and intentional family formations that may not align with genetic ties.

  Compatible alternatives:
  The current practice is compatible with a view that genetic origin is a strong evidentiary factor but not essential for personal identity. It is also compatible with the idea that social and intentional factors can override genetic ones. However, it is not compatible with a strict genetic essentialism that holds that only genetic parents can have rights and responsibilities. It is also not compatible with a view that completely disregards genetic ties in all cases.

  Internal consistency:
  There is a tension but not a direct contradiction. The law uses genetics as a default in one context (paternity testing) but allows for complete severance and reassignment in another (adoption) and even for multiple parents in a third (multi-parent IVF). This inconsistency is managed by having different legal doctrines for different situations. However, the underlying principle seems to be that the law is more concerned with the social and intentional aspects of parenthood and the child's welfare than with genetic essentialism. Therefore, the system is pragmatically consistent even if not philosophically monolithic.

  Changes if strict origin essentialism were adopted:
  If the law explicitly adopted strict origin essentialism (the view that a person's identity is essentially tied to their specific genetic origin), then:
  - Paternity doctrine: Genetic testing would be the only way to establish paternity, and no other factors could override it. Disputes would always be settled in favor of the genetic parent.
  - Adoption: Would become impossible or legally void because it would attempt to sever an essential link. The genetic parents would retain all rights and responsibilities.
  - Multi-parent recognition: Would not be allowed because only genetic parents could have legal ties to the child. The gestational mother and intended social parents would have no legal standing unless they are also genetic contributors.

  Changes if strict origin essentialism were rejected altogether:
  If the law explicitly rejected origin essentialism and held that genetic origin is irrelevant to personal identity, then:
  - Paternity doctrine: Genetic testing would lose its decisive weight. Other factors (such as social parenting, intention, and established relationships) would be given equal or greater weight. Paternity disputes might be settled based on the best interests of the child and the intentions of the parties.
  - Adoption: Would remain as it is, because it already severs genetic ties and creates social ones.
  - Multi-parent recognition: Would become more widespread and perhaps the norm. Legal parenthood would be assigned based on social and intentional factors without regard to genetic contribution. Even in traditional cases, non-genetic parents (e.g., a step-parent who has raised the child) might be recognized without requiring adoption.

  Now, we format the answer as a JSON object with the required fields.
