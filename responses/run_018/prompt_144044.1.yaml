  - "apparent_tensions": array of objects, each with "pair" and "resolution" (string explaining why it dissolves).
  - "best_single_revision": object with "target" (the commitment number), "revision" (string), and "net_effect" (string).
  - "salvageability": object with "verdict" (string) and "condition" (string stating what must hold for (3) to survive).

  Keep your analysis focused; do not provide bibliographies or reading lists.
