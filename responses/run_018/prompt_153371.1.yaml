prompt: |-
  hey — i'm a phd student in philosophy of action and decision theory, writing this quick between seminars so there might be a typo or two. i'm sick of people just retelling parfit's hitchhiker like that's an answer, and i want the actual spec: what must an adequate theory of rational self-binding in one-off interactions deliver?

  write the desiderata. for each, give the motivating case or formal constraint behind it — the original hitchhiker scenario, the reverse case where the driver demands proof of commitment but the proof itself undermines the disablement, the 'midnight clause' problem where the binding mechanism activates before you reach the decision point, and whatever comes from causal decision theory or dynamic consistency. flag which requirements are non-negociable and which are just camp prefferences (e.g. whether preserving the independance axiom is essential, whether diachronic agency is required). then tell me if there's a subset that's jointly unsatisfyable — that's the part i actually care about.

  briefly analyse how the standard causal-decision-theoretic dismissal and the 'rational precommitment as costly signalling' view do against your list, showing exactly which desiderata they miss, not just giving a verdict.

  please separate what's settled from what's genuinely contested among people who know the topic, and don't present one camp's view as the consensus.

  after the main text, include a table with these columns: Requirement (the criterion), Motivating Case or Constraint (why it's required), Negotiable? (Yes / No / Maybe with brief reason), Status (Settled vs Contested — what's agreed vs what's fought over). use british english throughout — analyse, behaviour, centre, colour, etc.
reasoning: |-
  We are addressing the problem of rational self-binding in one-off interactions. The goal is to outline the desiderata for an adequate theory, provide motivating cases, and assess the status and negotiability of each requirement. We'll also evaluate two standard approaches (causal decision theory and costly signalling) against these desiderata and highlight any potential conflicts.

  Key Cases and Concepts:
  1. **Parfit's Hitchhiker (original):** 
     - You are lost in the desert. A driver offers a ride only if you promise to pay upon arrival. If you don't promise, you die. If you promise and then pay, you survive and lose money. If you promise and don't pay, you survive and keep the money. The problem: once you arrive, paying is strictly dominated by not paying. So why would you pay? And how can you commit in advance?

  2. **Reverse Hitchhiker (proof undermines disablement):**
     - The driver demands proof of commitment (e.g., a device that will pay automatically). But if you have such a device, you could disable it. The driver then requires that the device cannot be disabled. However, if you can choose to install such a device, you might choose not to, and the driver knows this. So the driver only picks you up if you have the device and it cannot be disabled. But then, if you can choose to make it non-disablable, you might choose not to, because once you are in the car, you would prefer to have the option to disable. The problem: the very act of making the commitment device non-disablable might be against your interest at the time of setting it up.

  3. **Midnight Clause Problem:**
     - The commitment device activates before the decision point. For example, you set a device that will punish you if you don't do X at time t, but the device is triggered at time t-1 (midnight). At t-1, you might prefer to deactivate the device because at that point the punishment is still avoidable and the future action is not yet fixed. But if you deactivate, then the commitment fails.

  4. **Formal Constraints from Decision Theory:**
     - **Causal Decision Theory (CDT):** Agents should maximize utility based on causal consequences. In the original Hitchhiker, at the time of payment, CDT says not to pay because paying doesn't cause the driver to save you (it's already done). So CDT cannot explain the rationality of paying.
     - **Dynamic Consistency:** A plan is dynamically consistent if the agent has no incentive to deviate from the plan at any point. The Hitchhiker problem is dynamically inconsistent because the plan (promise and pay) is optimal ex ante but not ex post.

  Desiderata for an Adequate Theory of Rational Self-Binding:

  We list the requirements and then provide a table summarizing.

  1. **Ex Ante Rationality of Commitment:**
     - The agent must find it rational to set up the commitment device (or make the commitment) at the initial stage (ex ante). In the original Hitchhiker, it is rational to commit to paying because without commitment, you die; with commitment and payment, you survive and pay, which is better than dying.
     - **Motivating Case:** Original Hitchhiker.
     - **Negotiable?** No. Without this, there is no motivation for self-binding.

  2. **Ex Post Rationality of Compliance:**
     - The agent must find it rational to follow through with the commitment at the time of action (ex post). In the original Hitchhiker, once you are saved, paying is costly and doesn't affect your survival, so it seems irrational to pay. But we require that the theory must make compliance rational at the time of action, or else the commitment is pointless.
     - **Motivating Case:** Original Hitchhiker (ex post stage).
     - **Negotiable?** This is highly contested. Some (e.g., CDT) say it is not required; others (e.g., evidential decision theory, or theories of resolute choice) argue that it is required for dynamic consistency.

  3. **Non-Exploitability of Commitment Device:**
     - The commitment device must not be exploitable in a way that undermines the commitment. In the Reverse Hitchhiker, if the driver requires a non-disablable device, then the agent must not have an incentive to avoid using such a device because of the loss of control. The device should be set up in a way that the agent does not have a rational incentive to circumvent it when the time comes.
     - **Motivating Case:** Reverse Hitchhiker.
     - **Negotiable?** No. If the device can be easily circumvented, then the commitment is not credible.

  4. **Midnight Clause Robustness:**
     - The commitment must be robust to early activation. In the Midnight Clause problem, the agent should not have an incentive to deactivate the device at the activation time (t-1) even though the action at time t is not yet taken.
     - **Motivating Case:** Midnight Clause Problem.
     - **Negotiable?** Maybe. Some theories might avoid this by not having early activation, but if the device requires early activation then robustness is non-negotiable.

  5. **Dynamic Consistency:**
     - The optimal plan chosen at the initial stage should remain optimal at every subsequent stage. This means the agent should not have an incentive to deviate from the plan.
     - **Motivating Case:** General principle from dynamic decision theory. The Hitchhiker problem is a classic example of dynamic inconsistency.
     - **Negotiable?** Contested. Some decision theories (like CDT) accept dynamic inconsistency as a fact of rational choice. Others (like resolute choice) require dynamic consistency.

  6. **Compatibility with Rational Choice Principles:**
     - The theory should be compatible with fundamental principles of rational choice, such as the Independence Axiom (if it is to be preserved). Some may argue that the Independence Axiom is non-negotiable, while others might be willing to relax it for dynamic choice.
     - **Motivating Case:** Formal constraint from expected utility theory.
     - **Negotiable?** Maybe. Some camps (e.g., orthodox decision theory) consider it non-negotiable; others (e.g., those advocating for sequence-based or resolute choice) are willing to relax it.

  7. **Diachronic Agency:**
     - The theory should account for the agent as existing over time, and commitments as being made by one temporal part of the agent to influence another. This might require that the agent at time t0 can bind the agent at time t1.
     - **Motivating Case:** Philosophical accounts of personal identity and agency (e.g., Parfit).
     - **Negotiable?** Contested. Some (e.g., sophisticated choice) treat each time-slice as a separate agent, while others (e.g., resolute choice) treat the agent as unified over time.

  8. **One-off Interaction Requirement:**
     - The solution must work in one-off interactions, not relying on repeated games or reputational effects.
     - **Motivating Case:** The original Hitchhiker is a one-off interaction.
     - **Negotiable?** No. Repeated games have different solutions (e.g., tit-for-tat).

  Evaluation of Standard Approaches:

  - **Causal Decision Theory (CDT):**
    - CDT would not pay in the ex post stage of the Hitchhiker (because paying doesn't cause the driver to have saved you). Thus, it fails ex post rationality of compliance (2) and dynamic consistency (5). However, it satisfies ex ante rationality of commitment (1) in the sense that the agent would want to commit but might not be able to because of the ex post problem. CDT also struggles with non-exploitability (3) and midnight clause robustness (4) because if the agent can avoid the commitment at any stage, CDT would recommend doing so. It satisfies compatibility with rational choice principles (6) and does not require diachronic agency (7) because it treats each stage separately. It works in one-off interactions (8).

  - **Costly Signalling:**
    - The idea: the commitment device is a signal to the other party (the driver) that you are the type who will pay. But in a one-off interaction, signalling only works if there is a cost that separates types. In the original Hitchhiker, if you can set up a costly signal (e.g., burning money) that is more costly for someone who wouldn't pay, then the driver might pick you up. However, at the ex post stage, it is still irrational to pay (unless the signal has not been fully sent). Also, in the Reverse Hitchhiker, if the device is non-disablable, then the agent might not want to set it up because it is too costly in terms of lost control. Thus, it might fail ex post rationality (2) and also non-exploitability (3) because the agent would prefer a device that is not non-disablable. The midnight clause problem (4) might be avoided if the signal is sent at the right time. It might not require diachronic agency (7) and works in one-off (8). However, it may not be dynamically consistent (5) because the agent might want to avoid the cost of signalling at the time of action.

  Subset That Might Be Jointly Unsatisfiable:

  The key tension is between:
  - Ex post rationality of compliance (2) and dynamic consistency (5) on the one hand, and 
  - The orthodox rational choice principles (like CDT and the Independence Axiom) on the other.

  Specifically, if we require that the agent must at every stage act in a way that maximizes expected utility given their current beliefs and available actions (which is the core of CDT and expected utility theory), then it is impossible to have ex post compliance in the Hitchhiker. Thus, desiderata 2 and 5 are incompatible with orthodox CDT.

  This is the heart of the debate: can we abandon the orthodox requirement of stage-wise maximization (and perhaps the Independence Axiom) to achieve dynamic consistency and ex post rationality? Or must we accept that self-binding in one-off interactions is impossible without an external enforcer?

  Table of Desiderata:

  | Requirement | Motivating Case or Constraint | Negotiable? | Status (Settled vs Contested) |
  |-------------|-------------------------------|-------------|-----------------------------|
  | Ex Ante Rationality of Commitment | Original Hitchhiker: without commitment, the agent dies; with commitment and payment, they survive (albeit with a cost). | No | Settled: everyone agrees that the commitment must be ex ante rational. |
  | Ex Post Rationality of Compliance | Original Hitchhiker: at the time of payment, why pay if the driver has already saved you? | Contested: Some say it is required, others (like CDT) say it is not. | Contested |
  | Non-Exploitability of Commitment Device | Reverse Hitchhiker: if the device can be disabled, then the commitment is not credible. | No | Settled: the device must be non-exploitable to be effective. |
  | Midnight Clause Robustness | Midnight Clause Problem: early activation of the device might give an incentive to deactivate before the decision point. | Maybe: if the theory avoids early activation, then it might not be required. Otherwise, non-negotiable. | Contested: depends on the commitment mechanism. |
  | Dynamic Consistency | General principle: a rational plan should not be abandoned mid-course without new information. | Contested: CDT accepts inconsistency, while resolute choice requires consistency. | Contested |
  | Compatibility with Rational Choice Principles | The Independence Axiom: if the agent is indifferent between two outcomes, then mixing them with a third should not change the preference. | Maybe: some consider it non-negotiable, others relax it for dynamic choice. | Contested |
  | Diachronic Agency | The agent is a single entity over time, so the commitment is between the agent's temporal parts. | Contested: some theories treat time-slices as separate agents. | Contested |
  | One-off Interaction Requirement | The solution must work without repeated interactions. | No | Settled: the problem is defined for one-off. |

  Conclusion:

  The central debate is whether we can abandon the principle of stage-wise maximization (as in CDT) to achieve dynamic consistency and ex post rationality. The costly signalling approach attempts to provide a reason for compliance by making the commitment a signal, but it still faces the ex post problem unless the signal is designed to carry a cost that is only borne if the agent defects. However, in the pure one-off case with no reputational effects, signalling without an external enforcement mechanism might not solve the problem.

  There is no consensus. The orthodox view (CDT) accepts that self-binding in one-off interactions is impossible without external enforcement. Alternative views (resolute choice, team reasoning, or modifying decision theory) try to satisfy all desiderata but at the cost of abandoning some traditional axioms.
answer: |-
  Below is a structured analysis of desiderata for an adequate theory of rational self-binding in one-off interactions, drawing on key cases (Parfit's Hitchhiker, Reverse Hitchhiker, Midnight Clause) and formal constraints (causal decision theory, dynamic consistency). I separate settled from contested issues, flag negotiability, evaluate standard approaches, and identify potential conflicts. British English is used throughout.

  ### **Core Desiderata for Rational Self-Binding**  
  An adequate theory must resolve tensions between *ex ante* rationality (pre-commitment) and *ex post* rationality (compliance). The table below summarises requirements, followed by detailed analysis and evaluation of existing approaches.

  #### **Table of Desiderata**  
  | Requirement                      | Motivating Case or Constraint                                                                                                | Negotiable?                     | Status                          |
  |----------------------------------|------------------------------------------------------------------------------------------------------------------------------|---------------------------------|---------------------------------|
  | **Ex Ante Rationality of Commitment** | Original Hitchhiker: Commitment must maximise expected utility *before* interaction (e.g., promising payment to avoid death). | No (essential for motivation)   | Settled                         |
  | **Ex Post Rationality of Compliance** | Original Hitchhiker: Compliance must be rational *at execution* (e.g., paying post-rescue). Causal decision theory (CDT) deems this irrational, creating a paradox. | Contested: CDT rejects; resolute/evidential views require | Contested (core divide)         |
  | **Non-Exploitability**           | Reverse Hitchhiker: Proof of commitment (e.g., non-disablable device) must not undermine itself (if device is disablable, commitment fails). | No (otherwise commitment is void) | Settled                         |
  | **Midnight Clause Robustness**   | Midnight Clause: Commitment mechanism (e.g., pre-emptive penalty) must not incentivise deactivation *before* the decision point. | No (if mechanism activates early) | Settled                         |
  | **Dynamic Consistency**          | General constraint: Optimal initial plan must remain optimal at all stages (no incentive to deviate). Violated in Hitchhiker. | Contested: CDT accepts violations; others forbid | Contested                       |
  | **Independence Axiom Preservation** | Formal constraint: Preferences over acts should be independent of irrelevant alternatives. CDT requires this; some alternatives relax it. | Maybe (sacrificed in evidential/ambirent theories) | Contested (orthodoxy vs revision) |
  | **Diachronic Agency**            | Metaphysical constraint: Theory must treat the agent as temporally unified (binding "future self" is coherent). Reverse Hitchhiker challenges atomistic views. | Contested (e.g., time-slice CDT vs resolute choice) | Contested                       |
  | **One-Off Viability**            | Parfit's Hitchhiker: Solution must work without repeated interactions (no reputation/reciprocity). Costly signalling often relies on repetition. | No (problem definition)         | Settled                         |

  ---

  ### **Analysis of Key Tensions**  
  #### **Joint Unsatisfiability Subset**  
  The desiderata **Ex Post Rationality of Compliance**, **Dynamic Consistency**, and **Independence Axiom Preservation** are *jointly unsatisfiable* under orthodox decision theory.  
  - **Why?** CDT (with Independence Axiom) demands *ex post* defection in Hitchhiker (paying post-rescue is causally ineffective). This violates dynamic consistency (initial commitment ≠ execution). Resolute choice or evidential theories achieve consistency but violate CDT’s axioms.  
  - **Consequence:** A theory must abandon at least one desideratum. For example:  
    - *CDT* sacrifices **Ex Post Compliance** and **Dynamic Consistency**.  
    - *Ambirent/Evidential Theories* sacrifice **Independence Axiom Preservation**.  

  #### **Evaluation of Standard Approaches**  
  1. **Causal Decision Theory (CDT) Dismissal**:  
     - **Fulfils**: Ex Ante Rationality (desires commitment), Independence Axiom, One-Off Viability.  
     - **Fails**:  
       - Ex Post Rationality of Compliance (defection dominates post-rescue).  
       - Dynamic Consistency (commitment plan ≠ execution action).  
       - Non-Exploitability (if commitment device is disablable, CDT *requires* disabling).  
     - **Verdict**: Treats self-binding as infeasible without external enforcement. Ignores why agents *feel* bound.  

  2. **Rational Precommitment as Costly Signalling**:  
     - **Premise**: Commitment signals unobservable traits (e.g., "honest type"), justifying trust.  
     - **Fulfils**: Ex Ante Rationality (if signal benefits outweigh costs), One-Off Viability (if signals are irrevocable).  
     - **Fails**:  
       - Reverse Hitchhiker: If signalling requires non-disablable proof, agents reject it (exceeds signalling costs).  
       - Midnight Clause: Signals activated early (e.g., upfront payment) incentivise avoidance.  
       - Ex Post Compliance: Signalling doesn’t make compliance *causally rational*; it merely selects agents.  
     - **Verdict**: Reduces self-binding to selection dynamics, not rationality. Fails if signals are revocable or costly pre-commitment is irrational *ex post*.

  ---

  ### **Settled vs Contested Grounds**  
  - **Settled**:  
    - Ex Ante Rationality and One-Off Viability are non-negotiable (core motivation).  
    - Non-Exploitability and Midnight Clause Robustness are essential for credible commitment.  
  - **Contested**:  
    - **Ex Post Compliance**: CDT camps reject it as unnecessary; resolute/team-reasoning camps insist.  
    - **Dynamic Consistency**: Orthodox CDT accepts violations; game theorists (e.g., McClennen) demand it.  
    - **Diachronic Agency**: Reductionists (e.g., time-slice CDT) vs non-reductionists (e.g., Bratman).  
    - **Independence Axiom**: Fiercely defended by CDT; relaxed in evidential, ambirent, or boundedly rational models.  

  ---

  ### **Conclusion**  
  No extant theory satisfies all desiderata. CDT and costly signalling fail **Ex Post Compliance** and **Dynamic Consistency**, rendering self-binding in one-off interactions paradoxical under orthodoxy. The **Reverse Hitchhiker** and **Midnight Clause** cases expose flaws in "proof-based" solutions. A viable theory likely requires revising CDT (e.g., incorporating recursive beliefs or resolute choice), but this risks abandoning formal axioms. The key conflict—between dynamic consistency and causal rationality—remains unresolved. For your PhD, focus on the **joint unsatisfiability** of ex post compliance, dynamic consistency, and the Independence Axiom: this is where the field’s central debate lies.
