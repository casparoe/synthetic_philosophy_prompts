prompt: |-
  hey im a phd student in formal epistemology and ai safety. next tuesday im giving a seminar talk on aumann's agreement result. my thesis is that in scalable-oversight debate protocols, debaters don't have fixed evidence partitions — they strategically pick which ones to disclose — so the common-knowledge-of-rationality condition collapses and agreement diverges rather than converges. the audience is mostly philosophers of economics who know this stuff cold, plus two safety-lab people who think debate solves alignment. i need exactly five numbered items, each a sentence or two, no intro or conclusion, american english. start with the worst objection theyll actually raise, phrased like an epistemologist, then what i should concede, what i should hold, and the weakest point in my own argument i should defend instead of hoping they miss it. do that for items 2-4 in order of damage. make item 5 the question im praying nobody asks, with a quick reply and where that reply is soft. please dont ask for a bibliography or citations, ill handle those. i think theres a typo somewhere in this prompt but thats ok.
