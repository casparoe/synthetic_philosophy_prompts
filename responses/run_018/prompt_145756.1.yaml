  For item 2 (next worst), the objection might be that common knowledge can still emerge dynamically. I'll advise conceding this in theory but emphasizing computational/strategic barriers in practice. 

  Item 3 could attack the divergence claim—maybe they'll argue rational agents should still converge. Here, the reply should stress how strategic incentives create adversarial dynamics that break rationality. 

