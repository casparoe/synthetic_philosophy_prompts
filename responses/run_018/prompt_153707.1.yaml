  ### **Indistinguishable Pairs & Supplementary Distinctions**  
  The tree **cannot cleanly separate** these pairs:  
  1. **Constitution Theory vs. Coincidence Theory**:  
     - Both yield identical answers on all test cases.  
     - **Supplementary distinction needed**: *Ground of persistence conditions*. Ask:  
       > *"Could the clay exist without being constituted into any artifact?"*  
       - Constitution Theory: **No** (clay’s identity depends on being material for an artifact).  
       - Coincidence Theory: **Yes** (clay can exist independently).  

  2. **Four-Dimensionalist Worm View vs. Hylomorphic Constitution View**:  
     - Both may agree on all test cases if the hylomorphic view allows distinct identity conditions.  
     - **Supplementary distinction needed**: *Ontological status of form*. Ask:  
       > *"Is the statue’s form an independent entity that can exist without its current matter?"*  
       - Four-Dimensionalist: **No** (form is a temporal stage of a worm).  
       - Hylomorphic View: **No** (form and matter are inseparable), but the view may still treat them as having distinct identity conditions—clarify with modal scenarios (e.g., "Could the statue survive matter rearrangement in a near-identical universe?").  

  ---

  ### **Notes**  
  - **Hylomorphic View**: Falls under **Identity Theory with Non-Essential Form** if it denies distinctness at a time (Q1=No). If it affirms distinctness (Q1=Yes), it aligns with Constitution Theory but requires the supplementary distinction above.  
  - **Mereological Essentialism**: Splits into two variants (clay-only vs. both) based on Q6.  
  - **Unstable Nodes**: Arise from contradictory judgments about destruction and essential properties.  
  - **Unexplored Nodes**: Positions are logically possible but lack advocacy in literature.  

  This instrument forces participants to reveal their views through case-based judgments, avoiding labels while capturing nuances of major theories. Use supplementary questions to resolve ambiguities in indistinguishable pairs.
