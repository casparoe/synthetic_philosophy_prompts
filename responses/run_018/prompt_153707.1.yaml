  *At the exact moment a statue is created from clay, are the statue and the clay two different things (even though they occupy the same space and are made of the same particles)?*  
  - **Yes** → Go to Question 2A.  
  - **No** → Go to Question 2B.  

  #### **Question 2A: Statue Destroyed by Reshaping?**  
  *(If you answered "Yes" to Question 1)*  
  *If the statue is squashed into a cube (losing its statue shape but not changing its particles), is the original statue destroyed?*  
  - **Yes** → Go to Question 3A.  
  - **No** → Go to Question 3B.  

  #### **Question 2B: Clay Survives Single-Particle Loss?**  
  *(If you answered "No" to Question 1)*  
  *If one particle is removed from the clay (and nothing else changes), does the original clay still exist?*  
  - **Yes** → Go to Question 4.  
  - **No** → **Incoherent Node** (see notes below).  

  #### **Question 3A: Form Essential for Statue?**  
  *(If you answered "Yes" to Question 2A)*  
  *Must the statue retain its specific shape to continue existing (i.e., if it loses that shape, it is destroyed)?*  
  - **Yes** → Go to Question 5.  
  - **No** → **Unstable Node** (see notes below).  

  #### **Question 3B: Form Essential for Statue?**  
  *(If you answered "No" to Question 2A)*  
  *Must the statue retain its specific shape to continue existing?*  
  - **Yes** → **Unstable Node** (see notes below).  
  - **No** → Go to Question 6.  

  #### **Question 4: Both Survive Gradual Replacement?**  
  *(If you answered "Yes" to Question 2B)*  
  *After gradually replacing every particle of the statue/clay with new particles, do both the original statue and the original clay still exist?*  
  - **Yes** → **Identity Theory with Non-Essential Form**.  
  - **No** → **Incoherent Node** (see notes below).  

  #### **Question 5: Statue Survives Gradual Replacement?**  
  *(If you answered "Yes" to Questions 1, 2A, and 3A)*  
  *After gradually replacing every particle, does the original statue still exist?*  
  - **Yes** → Go to Question 7.  
  - **No** → Go to Question 8.  

  #### **Question 6: Clay Survives Gradual Replacement?**  
  *(If you answered "No" to Question 2A and "No" to Question 3B)*  
  *After gradually replacing every particle, does the original clay still exist?*  
  - **Yes** → **Mereological Essentialism** (for clay only).  
  - **No** → **Mereological Essentialism** (for both).  

  #### **Question 7: Clay Survives Gradual Replacement?**  
  *(If you answered "Yes" to Question 5)*  
  *After gradually replacing every particle, does the original clay still exist?*  
  - **Yes** → Go to Question 9.  
  - **No** → Go to Question 10.  

  #### **Question 8: Clay Survives Gradual Replacement?**  
  *(If you answered "No" to Question 5)*  
  *After gradually replacing every particle, does the original clay still exist?*  
  - **Yes** → **Unexplored Node** (see notes below).  
  - **No** → Go to Question 11.  

  #### **Question 9: Clay Survives Single-Particle Loss?**  
  *(If you answered "Yes" to Question 7)*  
  *If one particle is removed, does the original clay still exist?*  
  - **Yes** → **Four-Dimensionalist Worm View**.  
  - **No** → **Unexplored Node** (see notes below).  

  #### **Question 10: Clay Survives Single-Particle Loss?**  
  *(If you answered "No" to Question 7)*  
  *If one particle is removed, does the original clay still exist?*  
  - **Yes** → **Constitution Theory or Coincidence Theory**.  
  - **No** → **Unexplored Node** (see notes below).  

  #### **Question 11: Clay Survives Single-Particle Loss?**  
  *(If you answered "No" to Question 8)*  
  *If one particle is removed, does the original clay still exist?*  
  - **Yes** → **Unexplored Node** (see notes below).  
  - **No** → **Four-Dimensionalist Stage View**.  

