  Draft the joint statement of an adversarial collaboration between Daniel Dennett, representing a compatibilist evolutionary-functional account of moral responsibility that preserves a qualified, non-retributive notion of just deserts, and Gregg Caruso, representing a hard-determinist skeptical position that rejects retributive desert in favor of public-health quarantine models of social defense. Conduct the collaboration not at the broad level of free will, but specifically on the conceptual sub-issue of whether just desert can be coherently localized to modular sub-personal cognitive architectures—whether failures of inhibitory control, predictive-processing errors, or localized neural dysfunction in specific subsystems can bear retributive moral weight, or whether desert necessarily requires attribution to a global, narratively integrated self. Structure the document in four parts: first, a numbered section of claims both parties can sign regarding the neuroscience of decision-making, the instrumental versus expressive functions of punishment, and the logical distinction between explaining behavior and justifying blame; second, a disagreements table in which each side's position on modular desert is formulated in wording that side would accept as accurate to its own view; third, the precise cruxes—especially whether the absence of a unified Cartesian ego undermines all ascriptions of desert or only global, person-level ones, and whether evolutionary-functional accounts can ground local desert without smuggling in a ghost-in-the-machine; fourth, for each crux, a concrete hypothetical case—such as a defendant with a well-circumscribed orbitofrontal lesion who commits a harmful act—that both sides agree bears directly on the dispute, with each side's predicted evaluation of culpability and appropriate social response recorded in advance. Conclude by identifying any purely verbal disagreement—e.g., whether the parties are operating with different registers of "responsible"—and specify exactly which portion of the dispute about modular desert survives once that ambiguity is resolved.
reasoning: |-
  We are drafting a joint statement from an adversarial collaboration between Daniel Dennett (compatibilist) and Gregg Caruso (hard-determinist skeptic) on the specific issue of whether "just desert" can be coherently localized to modular sub-personal cognitive architectures.

  The document must be structured in four parts:

  1. **Agreements**: A numbered list of claims both parties can sign regarding:
     - Neuroscience of decision-making
     - Instrumental vs. expressive functions of punishment
     - Logical distinction between explaining behavior and justifying blame

  2. **Disagreements Table**: A table (or two clearly labeled sections) presenting each side's position on modular desert in wording that each side would accept as accurate.

  3. **Cruxes**: The precise points of disagreement, especially:
     - Whether the absence of a unified Cartesian ego undermines all ascriptions of desert or only global, person-level ones.
     - Whether evolutionary-functional accounts can ground local desert without smuggling in a ghost-in-the-machine.

  4. **Hypothetical Cases**: For each crux, a concrete hypothetical case (e.g., a defendant with a well-circumscribed orbitofrontal lesion) that both sides agree bears directly on the dispute. Each side's evaluation of culpability and appropriate social response should be recorded.

  Conclusion: Identify any purely verbal disagreement (e.g., different registers of "responsible") and specify which portion of the dispute survives once that ambiguity is resolved.

  ---

  **Part 1: Agreements**

  Both parties agree on the following points:

  1. **Neuroscientific Basis of Decision-Making**: Human decision-making arises from complex neural processes that are distributed across the brain. These processes are modular in nature, involving specialized subsystems (e.g., for emotion regulation, prediction, inhibition). There is no evidence for a central, unified "Cartesian ego" that serves as an uncaused cause of actions. The brain operates through the interaction of these subsystems, which are shaped by evolution, genetics, and experience.

  2. **Instrumental vs. Expressive Functions of Punishment**: The practice of punishment in society serves both instrumental and expressive functions. Instrumentally, punishment can serve as a deterrent, a means of rehabilitation, or incapacitation of dangerous individuals. Expressively, punishment can communicate societal norms, express moral condemnation, or satisfy retributive emotions. However, the expressive function of punishment does not, by itself, justify retributive practices.

  3. **Distinction Between Explanation and Justification**: There is a logical distinction between explaining why an agent acted as they did (which involves causal, neuroscientific, and psychological factors) and justifying the ascription of moral responsibility or blame. An explanation of behavior (e.g., in terms of neural dysfunction) does not automatically settle the normative question of whether the agent deserves blame or punishment.

  4. **Rejection of Retributive Desert in its Strong Form**: Both parties reject the notion of "basic desert" as defined by retributivism—the idea that an agent intrinsically deserves suffering or harm simply because they have performed a wrongful act, independent of consequentialist considerations. 

  5. **Public Health and Social Defense**: Both parties agree that society must protect itself from harmful behavior. The question of how to do so effectively and fairly is paramount, and models that focus on public health, rehabilitation, and risk management (such as the quarantine model) are viable and important alternatives to retributive punishment.

  ---

  **Part 2: Disagreements Table**

  *Daniel Dennett's Compatibilist Position*: 
  "Just desert, understood in a non-retributive, forward-looking sense, can be coherently localized to specific sub-personal cognitive modules when those modules are integrated into the person-level system that we hold responsible. Failures in inhibitory control, predictive processing, or other localized functions do not automatically exculpate the agent if the overall system had the capacity and opportunity to compensate for such failures. Desert is grounded in the evolutionary-functional role of these systems in enabling agents to navigate social and moral expectations. Thus, in cases of localized dysfunction, we can attribute desert (in the form of accountability) to the person, while acknowledging that the dysfunction may mitigate blame and call for tailored responses (e.g., treatment alongside accountability)."

  *Gregg Caruso's Hard-Determinist Skeptical Position*: 
  "Desert, even when stripped of retributive elements, cannot be coherently localized to sub-personal modules because moral responsibility requires a globally integrated self that is the ultimate source of action. Since no such self exists (as per our agreement on neuroscience), and because all behavior is the result of causal chains beyond the agent's ultimate control, no one truly deserves blame or punishment in the desert-entailing sense. Localized dysfunctions (e.g., lesions) are merely one example of the myriad factors that determine behavior, and they do not bear retributive moral weight. Instead, society should respond to harmful behavior solely based on considerations of risk management, rehabilitation, and social defense, without any appeal to desert—whether global or local."

  ---

  **Part 3: Cruxes**

  The primary cruxes of the disagreement are:

  1. **The Scope of the Absence of the Cartesian Ego**: 
     - *Dennett*: The absence of a Cartesian ego does not undermine all ascriptions of desert. Desert can be attributed to the person as a complex, evolved system of subsystems that, despite lacking a central controller, can still be held responsible for its operations when they are sufficiently integrated and capable of self-regulation. Localized failures can bear desert because they are part of the person's overall responsibility system.
     - *Caruso*: The absence of a Cartesian ego undermines all ascriptions of desert because desert requires an ultimate source of action that is not causally determined by factors beyond the agent's control. Without such a source, desert (even if non-retributive) cannot be attributed at any level—global or local. Only pragmatic, non-desert-based responses are justified.

  2. **Evolutionary-Functional Accounts and the Ghost-in-the-Machine Charge**:
     - *Dennett*: Evolutionary-functional accounts can ground local desert without smuggling in a ghost-in-the-machine by focusing on the capacities of the system (e.g., the ability to respond to reasons, to learn from experience, and to adjust behavior). These capacities are realized by the brain's architecture and do not require a non-physical self.
     - *Caruso*: Evolutionary-functional accounts, when used to ground desert, inevitably smuggle in a ghost-in-the-machine because they implicitly rely on the notion of an agent that could have done otherwise in the exact same circumstances, or that is the ultimate source of its actions. Since determinism precludes such ultimacy, desert cannot be grounded without appealing to an incoherent notion of agency.

  ---

  **Part 4: Hypothetical Cases**

  **Crux 1: The Scope of the Absence of the Cartesian Ego**

  *Hypothetical Case*: A defendant (Mr. A) has a well-circumscribed lesion in the orbitofrontal cortex (OFC), a region critical for impulse control and emotional regulation. Prior to the lesion, Mr. A had no history of violence. Post-lesion, he commits a violent assault during a minor disagreement. The lesion is the primary causal factor in the loss of inhibitory control. However, the rest of Mr. A's cognitive functions (e.g., reasoning, memory, language) are intact.

  *Dennett's Evaluation*: 
  - *Culpability*: Mr. A is still an appropriate target of a limited form of desert (accountability) because the OFC lesion is now part of his cognitive architecture. He remains a person who must be addressed as a moral agent, albeit one with a disability. The lesion may mitigate the degree of blame (since it reduces his capacity for self-control), but it does not eliminate accountability. Society may hold him responsible in a way that encourages him to develop compensatory strategies and to seek treatment. 
  - *Social Response*: A response that combines monitoring, treatment to address the impulsivity, and possibly restricted freedoms to protect society—but one that also acknowledges Mr. A as an agent who must take ownership of his condition and actions.

  *Caruso's Evaluation*: 
  - *Culpability*: Mr. A is not morally blameworthy in the desert-entailing sense because the lesion was a determining factor beyond his control. There is no "true self" that could have overridden the lesion-induced impulsivity. Thus, he does not deserve blame or punishment.
  - *Social Response*: Society should respond based solely on risk assessment and rehabilitation. Mr. A should be placed in a secure medical facility for treatment and containment until he is no longer a risk. The response should be entirely forward-looking and non-punitive.

  **Crux 2: Evolutionary-Functional Accounts and the Ghost-in-the-Machine**

  *Hypothetical Case*: Consider Ms. B, who has a genetic predisposition that results in a specific neural dysfunction in her amygdala, leading to heightened aggression in response to perceived threats. This condition has been present since adolescence. Ms. B has received education about her condition and has been taught cognitive-behavioral strategies to manage her reactions. Despite this, she commits a violent act in a situation where her amygdala dysfunction was triggered.

  *Dennett's Evaluation*: 
  - *Culpability*: Ms. B has a localized dysfunction, but she also has the capacity (via other brain systems) to recognize and manage her condition. Because she had the opportunity and resources to develop compensatory strategies, she can be held accountable for failing to do so. The desert attribution is local to the failure of the systems that should have compensated for the amygdala dysfunction.
  - *Social Response*: A response that includes both consequences (to reinforce the importance of using her compensatory strategies) and support for further skill-building. This holds her responsible without retribution.

  *Caruso's Evaluation*: 
  - *Culpability*: The fact that Ms. B's actions were determined by her genetic predisposition and neural dysfunction (along with environmental triggers) means she is not ultimately responsible. Even if she had learned strategies, her failure to use them in the moment was itself determined by factors beyond her control (e.g., the strength of the trigger, the effectiveness of her prior learning). Thus, no desert-based blame is justified.
  - *Social Response*: A response focused on therapy and skill-building to reduce future risk. Any restrictions should be based on risk level and rehabilitative potential, not on desert.

  ---

  **Conclusion: Purely Verbal Disagreements and Surviving Dispute**

  **Purely Verbal Disagreement**: The parties are operating with different registers of "responsible" and "desert":
  - Dennett uses "desert" in a forward-looking, non-retributive sense: accountability that serves a functional role in shaping behavior and maintaining social norms.
  - Caruso uses "desert" to entail ultimate responsibility and retributive blame, which he rejects. He also rejects non-retributive desert because he believes it still carries the problematic notion of ultimate responsibility.

  Once this ambiguity is resolved, the surviving dispute is:
  - Whether a non-retributive notion of desert (as defined by Dennett) can be coherently applied to localized subsystems without invoking ultimate responsibility. Dennett argues that it can, because the system's functional capacities provide a naturalistic basis. Caruso argues that even non-retributive desert is undermined by determinism and the lack of ultimate control, and that only purely consequentialist responses are justified.

  Thus, the core unresolved issue is whether the concept of desert, once stripped of retributive elements, can be grounded in the naturalistic, modular architecture of the brain without appealing to a metaphysically untenable notion of agency.
answer: |-
  ### Joint Statement: Adversarial Collaboration on Modular Moral Desert  
  **Participants:**  
  - Daniel Dennett (Compatibilist, Evolutionary-Functional Account)  
  - Gregg Caruso (Hard-Determinist Skeptic, Public Health Quarantine Model)  

  **Scope:**  
  This collaboration addresses whether "just desert" (understood as non-retributive accountability for Dennett, and rejected entirely by Caruso) can be coherently localized to *modular sub-personal cognitive architectures* (e.g., inhibitory control failures, predictive-processing errors, or neural dysfunctions). It does not engage the broader free will debate but focuses on the conceptual viability of desert ascriptions to subsystems versus a globally integrated self.  

  ---

  ### Part 1: Agreements  
  Both parties endorse the following claims, grounded in neuroscience, philosophy, and social policy:  

  1. **Neuroscience of Decision-Making**:  
     - Human cognition is implemented by distributed, modular neural subsystems (e.g., prefrontal cortex for inhibition, amygdala for threat response). These subsystems are products of evolution and operate via deterministic, physically realized processes.  
     - There is no evidence for a unified "Cartesian ego" or non-physical homunculus directing behavior. Actions emerge from interactions among subsystems shaped by genetics, environment, and stochastic factors.  

  2. **Instrumental vs. Expressive Functions of Punishment**:  
     - Punishment serves instrumental goals: deterrence, rehabilitation, incapacitation, and societal protection.  
     - It may also serve expressive goals: signaling moral norms or satisfying retributive emotions. However, expressive functions do not justify retributive desert *in principle*.  

  3. **Explanation vs. Justification Distinction**:  
     - Explaining behavior causally (e.g., "a lesion impaired inhibitory control") is distinct from justifying moral blame or desert ascriptions. Causal explanations do not entail normative conclusions.  

  4. **Rejection of Retributivism**:  
     - Both parties reject retributive desert (inflicting harm solely because it is "deserved"). Social responses to harmful acts must prioritize well-being, rehabilitation, and risk reduction.  

  5. **Public Health Framework**:  
     - Harmful behavior warrants non-punitive interventions (e.g., medical treatment, supervised release) modeled on public health quarantine, where "dangerousness" and treatability guide responses.  

  ---

  ### Part 2: Disagreements Table  
  *Each position is articulated in wording acceptable to its proponent.*  

  | **Daniel Dennett’s Compatibilist Position** | **Gregg Caruso’s Hard-Determinist Position** |  
  |---------------------------------------------|----------------------------------------------|  
  | "Just desert, understood as *non-retributive accountability*, can be localized to specific cognitive modules when they are functionally integrated into the agent’s person-level capacities. Failures in subsystems (e.g., impulse control) can bear desert if the agent had the opportunity and resources to recognize and compensate for these vulnerabilities. Desert reflects the agent’s role as an evolved system capable of reason-guided self-regulation, not a supernatural self." | "Desert—even non-retributive—cannot be coherently localized to modules because moral responsibility requires a *global, narratively integrated self* as the sole legitimate target of ascriptions. Sub-personal dysfunctions are mere causal explanations for behavior; they cannot bear moral weight absent a metaphysically robust self. All desert claims collapse without this unity, leaving only pragmatic social responses." |  

  ---

  ### Part 3: Cruxes  
  Disagreements center on two conceptual cruxes:  

  1. **Absence of the Cartesian Ego**:  
     - **Dennett**: The lack of a Cartesian ego undermines *only global, person-level desert*, not localized desert. Modules can bear accountability if they are functionally embedded in a system that, overall, enables reason-responsiveness.  
     - **Caruso**: The lack of a Cartesian ego undermines *all* desert, as sub-personal modules lack the agential unity required for moral attributions. Desert necessitates a "self" that transcends deterministic subsystems.  

  2. **Evolutionary-Functional Grounding**:  
     - **Dennett**: Evolutionary-functional accounts can ground local desert without dualism by treating the brain as a hierarchy of competences. A module’s failure can be "deserving" of consequences (e.g., therapy) if it reflects a breakdown in the agent’s overall capacity for moral engagement.  
     - **Caruso**: Functional accounts smuggle in a "ghost" by implying modules are "agential" when they are merely causal mechanisms. Desert cannot be naturalized; it always presupposes an exemptionalist self.  

  ---

  ### Part 4: Hypothetical Cases  
  #### Case 1: *Crux 1 (Absence of Cartesian Ego)*  
  **Scenario**: A defendant with a congenital, well-circumscribed lesion to the orbitofrontal cortex (OFC)—a region critical for impulse control—commits a violent assault during a provoked argument. Pre-lesion behavior was non-violent; post-lesion, the defendant shows no remorse but understands the act’s wrongfulness.  

  | **Dennett’s Evaluation** | **Caruso’s Evaluation** |  
  |---------------------------|--------------------------|  
  | **Culpability**: The OFC lesion is a *localized failure* in a subsystem essential for moral agency. The defendant retains reason-assessment capacities (intact prefrontal regions) and could have sought mitigation strategies (e.g., therapy). Thus, they bear *qualified desert*: blame for failing to address their vulnerability. <br> **Social Response**: Mandatory cognitive rehabilitation + community monitoring. Accountability is preserved but tailored to the dysfunction (no retributive punishment). | **Culpability**: The lesion is a deterministic cause of violence; no "self" chose the dysfunction. Blame is incoherent because the act stems from a neural deficit, not global agency. <br> **Social Response**: Indefinite medical quarantine until rehabilitation reduces risk. No blame or desert is assigned; the response is purely risk-based. |  

  #### Case 2: *Crux 2 (Evolutionary-Functional Grounding)*  
  **Scenario**: A defendant with a genetic mutation causing selective serotonin depletion commits fraud due to impaired predictive processing (consistently underestimating emotional harm to victims). They received prior education on their condition and strategies to offset errors but disregarded them.  

  | **Dennett’s Evaluation** | **Caruso’s Evaluation** |  
  |---------------------------|--------------------------|  
  | **Culpability**: The serotonin subsystem’s failure is *localized desert-bearing*: the agent’s broader cognitive architecture allowed recognition of the dysfunction and adoption of compensatory measures. Disregarding these measures reflects a person-level failure, warranting accountability. <br> **Social Response**: Revoked financial privileges + mandatory behavioral therapy. Desert is linked to the system’s functional breakdown. | **Culpability**: The mutation and its effects are unchosen; "disregarding strategies" was determined by the dysfunction. No module can "deserve" blame—only the illusory self could. <br> **Social Response**: Occupational restrictions + medical treatment. Desert plays no role; interventions address causes, not culpability. |  

  ---

  ### Conclusion: Purely Verbal Disagreements and Surviving Dispute  
  **Purely Verbal Disagreement**:  
  - **"Responsible" Registers**: Dennett uses "responsible" to denote *pragmatic accountability* within a naturalistic system (e.g., "The impulse-control module is responsible for the act, warranting repair"). Caruso reserves "responsible" for *ultimate, buck-stopping agency* (e.g., "Only an undetermined self could be responsible").  
  - **Resolution**: When "desert" is stripped of retributive connotations and redefined as *forward-looking, functional accountability* (Dennett), Caruso still rejects it as semantically incoherent for subsystems.  

  **Surviving Substantive Dispute**:  
  After clarifying terminology, the unresolved issue is:  
  > **Can non-retributive desert be coherently ascribed to *localized dysfunctions* in a modular cognitive architecture, or does the lack of a global self render *all* desert claims—even mitigated, subsystem-focused ones—conceptually untenable?**  

  Dennett affirms modular desert is viable; Caruso denies it is possible. This hinges on whether naturalistic cognitive architectures can support "targeted" desert without smuggling in a ghostly self—a disagreement that remains empirical (e.g., can neuroscience isolate "blameworthy" modules?) and metaphysical (e.g., does functional integration suffice for moral attribution?).  

  ---  
  **Signed,**  
  Daniel Dennett  
  Gregg Caruso  
  *Date: October 26, 2023*
