prompt: |-
  I run compliance for a mid-sized charity that funds health and education projects in twelve countries, and my staff keep bringing me borderline cases that our anti-bribery policy doesn't settle: a village committee gives our country director a goat at a farewell ceremony; a ministry clerk hints that our registration will sit in a drawer unless we pay a 'processing fee' that appears on no schedule; a local partner proposes hiring the regional governor's niece, who is genuinely the best-qualified candidate; a mayor we work with has steered a sanitation project towards wards that voted for him, which he describes as keeping faith with his supporters. Write me a decision procedure my field officers can actually run -- a sequence of questions with stopping points -- that distinguishes gifts from bribes, facilitation payments from legitimate fees, and patronage from ordinary political responsiveness. The procedure should be philosophically literate about the debate over whether corruption is a universal notion or a Western export: I want it to take seriously the possibility that some judgements are culturally relative (hospitality norms, obligations to kin and clan, the expectation that officials look after their own) while identifying where, if anywhere, the relativity runs out and a practice is corrupt on any reasonable account -- and it should say what the procedure should do with cases where those two deliver conflicting verdicts. Specify which distinctions the procedure treats as doing the real work (e.g., whether the benefit targets the person or the office, whether a specific quid pro quo is understood, whether the arrangement could survive publicity) and which familiar rules of thumb it should discard as culturally parochial. Then run the procedure on the four cases above, including a clear verdict on each, and identify at least one verdict my staff will find uncomfortable in each direction -- one clearance that will look bad to our European donors and one prohibition that local staff will find obtuse. Finally, mark the points where the procedure has to hand the decision up to me because the question is one of values rather than of classifiable fact. Please write in British English.
reasoning: |-
  Hmm, this is a sophisticated compliance challenge from a charity professional dealing with real-world ethical grey areas. The user needs a practical decision tree that navigates cultural relativity while maintaining integrity - quite the tightrope walk.

  First, I should acknowledge the core tension here: the charity operates across diverse cultural contexts where Western compliance frameworks often clash with local practices. The user's explicitly asking for philosophical literacy on whether corruption is universal or culturally constructed - that's unusually nuanced for a compliance request. 

  The four cases presented are textbook examples of ethical dilemmas in development work: the ceremonial goat, the hinted "processing fee", the qualified niece hire, and the politically motivated project siting. Each tests different boundaries between cultural norms and corruption. 

  For the decision procedure, I'll need to anchor it in three universal principles most ethical frameworks agree on: abuse of public office for private gain, violation of impartiality in public service, and deception. The cultural relativity comes in how these manifest - a goat might be hospitality in one context, a bribe in another. 

  Key distinctions that matter:
  - Is the benefit targeting the person or the role? 
  - Is there explicit/implicit quid pro quo? 
  - Would it survive public scrutiny in both contexts?
  - Does it create actual or perceived partiality?

  Rules to discard:
  - "All gifts are bribes" - ignores hospitality norms
  - "Family hiring is always nepotism" - disregards kinship obligations
  - "Political alignment is corrupt" - denies legitimate constituency service

  For uncomfortable verdicts: 
  - Clearing the goat might unsettle European auditors
  - Blocking the niece hire could alienate local staff 

  The procedure must have clear escalation points when values conflicts emerge - like when a culturally accepted practice violates the charity's core principles. That's where the user as compliance lead needs to step in.

  In testing the cases:
  - The goat likely passes if ceremonial and properly recorded
  - The "processing fee" fails as it's off-record extortion
  - The niece hire needs independent validation
  - The ward allocation requires evidence of need over politics

  The trickiest part is designing questions that field staff can operationalise without philosophy degrees. Need concrete indicators like "Would this be offered if we weren't funding projects?" or "Could we minute this transaction openly?"
answer: |-
  Here is a culturally literate decision procedure for your field officers, designed to handle borderline cases while acknowledging philosophical debates about the universality of corruption. It prioritises **abuse of public office for private gain, violation of impartiality, and deception** as core universal markers of corruption, while accommodating legitimate cultural variations in **hospitality, reciprocity, and political patronage** that lack these elements.

  **The Decision Procedure: A Sequence of Questions**

  1.  **Was the benefit solicited?**
      *   *Yes:* **STOP. Likely corrupt.** Proceed to Question 7 for final review/recording.
      *   *No:* Proceed to Question 2.
      *   *Unclear:* Proceed to Question 2, flagging ambiguity.

  2.  **Was the benefit offered publicly/transparently?**
      *   *No (secret, off-record, implied threat):* **STOP. Likely corrupt.** Proceed to Question 7.
      *   *Yes (open, documented, ceremonial):* Proceed to Question 3.

  3.  **Does the benefit primarily target the *individual* (e.g., personal enrichment, family gain) or the *office/role* (e.g., customary respect, community hospitality)?**
      *   *Primarily Individual:* Proceed to Question 4.
      *   *Primarily Office/Role:* Proceed to Question 5.
      *   *Mixed:* Proceed to Question 4, noting the mix.

  4.  **Is there a *specific, understood quid pro quo* linking the benefit to an official action/decision by the recipient? (e.g., "give me X and I will approve Y")**
      *   *Yes (explicit or strongly implied):* **STOP. Likely corrupt.** Proceed to Question 7.
      *   *No (general goodwill, relationship-building):* Proceed to Question 5.

  5.  **Could the arrangement survive publicity without damaging trust? Apply the "Sunlight Test" to BOTH contexts:**
      *   *(a) Local Context:* Would disclosing it openly within the local community *generally* be seen as acceptable/normal *or* as shameful/improper?
      *   *(b) Donor/Charity Context:* Could the charity publicly report this practice to its Board and donors without significant reputational damage or breach of its core values?
      *   *Both (a) AND (b) are YES:* Proceed to Question 6.
      *   *(a) YES but (b) NO:* **ESCALATE.** Cultural legitimacy conflicts with donor/charity values. Hand decision up.
      *   *(a) NO:* **STOP. Likely corrupt locally.** Proceed to Question 7.
      *   *(b) NO (regardless of a):* **ESCALATE.** Practice violates core charity/donor expectations, even if locally accepted. Hand decision up.

  6.  **Does the benefit or arrangement create *actual or reasonably perceived partiality* in the execution of public duties or the charity's work? (e.g., favouring kin/clan over objective merit, distorting project allocation from need)**
      *   *Yes, Actual Partiality:* **STOP. Likely corrupt.** Proceed to Question 7.
      *   *Yes, Reasonable Perception of Partiality:* **STOP. Likely problematic.** Proceed to Question 7. (Perception often erodes trust as effectively as reality).
      *   *No:* **Proceed to Clearance.** Benefit/arrangement likely falls within acceptable cultural norms/good practice. **Record details transparently.**

  7.  **Final Review/Recording Point:**
      *   Record the case details, answers to all questions, and the verdict (Likely Corrupt/Problematic, Escalated, Cleared).
      *   For "Likely Corrupt/Problematic" or "Escalated" outcomes, consult Compliance Lead (You) for final confirmation and action planning.

  **Key Distinctions Doing the Real Work:**
  1.  **Solicitation & Secrecy:** Indicates intent to deceive and avoid accountability (universal red flags).
  2.  **Target (Individual vs. Office):** Distinguishes personal enrichment from cultural respect for a role.
  3.  **Specific Quid Pro Quo:** Identifies bribery (exchange for specific favour) vs. general relationship-building.
  4.  **The Dual-Context Sunlight Test:** Crucial for navigating relativity. A practice failing *either* context's publicity test is problematic. Conflict requires escalation.
  5.  **Actual/Perceived Partiality:** The core harm of corruption – undermining fairness and trust in decision-making. Universal concern.

  **Discarded Parochial Rules of Thumb:**
  *   **"All gifts are bribes":** Ignores legitimate hospitality and ceremonial customs.
  *   **"Hiring relatives is always nepotism":** Disregards contexts where qualified kin are genuinely best-placed, or where kinship obligation is a core social value (though still requires scrutiny via Q4-Q6).
  *   **"Political alignment equals corruption":** Fails to distinguish legitimate constituency service ("bringing home the bacon") from partisan exclusion or diversion of essential resources. Focus on *partiality* and *distortion from need/merit* instead.
  *   **"Any unofficial payment is a bribe":** Overlooks that some contexts lack functional official schedules, but *secrecy* and *quid pro quo* remain key differentiators (Facilitation Payments often fail Q1/Q2/Q4).

  **Application to Cases:**

  1.  **The Goat (Village Committee Farewell):**
      *   Q1: Unsolicited? Likely **No** (customary farewell).
      *   Q2: Public/Transparent? **Yes** (ceremony).
      *   Q3: Target? **Primarily Office/Role** (respect for outgoing Director).
      *   Q4: Specific Quid Pro Quo? **No** (general goodwill).
      *   Q5: Sunlight Test? (a) Local: **YES** (acceptable ceremony). (b) Charity/Donor: **YES** (if properly recorded as ceremonial gift, value moderate). *Proceed.*
      *   Q6: Partiality? **No** (symbolic gesture, not linked to future decisions).
      *   **Verdict: CLEARED.** Record transparently as ceremonial gift. *Uncomfortable Clearance for European Donors:* May see *any* gift to staff as inappropriate, ignoring cultural context.

  2.  **The "Processing Fee" (Ministry Clerk Hint):**
      *   Q1: Solicited? **Yes** (hinted demand). **STOP. Likely Corrupt.** (Q2/Q4 also clearly fail: implied secrecy, specific quid pro quo - payment for registration movement).
      *   **Verdict: LIKELY CORRUPT.** Prohibit payment. Explore official channels, document the demand. Consider escalation/reporting.

  3.  **Hiring the Governor's Niece (Qualified Candidate):**
      *   Q1: Solicited? **Unclear/No** (Partner proposed, not necessarily solicited by Governor). *Proceed.*
      *   Q2: Public/Transparent? **Must be ensured** (process must be open, documented).
      *   Q3: Target? **Mixed** (Individual niece, but proposal via partner). *Flag.*
      *   Q4: Specific Quid Pro Quo? **Unclear.** Was hiring implied/expected for favours? *Critical question.* If **Yes** (even implied): **STOP. Likely Corrupt.** If **No**: Proceed.
      *   Q5: Sunlight Test? (a) Local: **Likely YES** (qualified kin hired normally). (b) Charity/Donor: **Only YES if process demonstrably merit-based & transparent.** *Requires strict process.*
      *   Q6: Partiality? **Potential Perception.** Must be mitigated by *proving* she is objectively best-qualified via independent, transparent process. If provable: **No.** If not: **Yes.**
      *   **Conditional Verdict:** **Can be CLEARED ONLY IF:** (i) Absolutely no solicitation/quid pro quo by Governor, (ii) Hiring is fully transparent & competitive, (iii) Niece is *provably* the best candidate on objective merit (documented scoring), (iv) Public disclosure wouldn't damage trust locally or with donors. *Uncomfortable Prohibition for Local Staff:* If she *is* the best candidate, blocking hire solely due to kinship may seem obtuse, ignoring merit and local norms. However, the *perception* risk is high, demanding extra rigour.

  4.  **Mayor Steering Project to Supporters ("Keeping Faith"):**
      *   Q1: Solicited? **N/A** (Mayor's action).
      *   Q2: Public/Transparent? **Likely Yes** (he openly states reason).
      *   Q3: Target? **Primarily Individual/Political** (rewarding supporters for votes).
      *   Q4: Specific Quid Pro Quo? **Yes** (implied: votes delivered, so projects delivered to wards).
      *   **STOP at Q4. Likely Corrupt.** Proceed to Q7.
      *   Q6: Partiality? **Yes, Actual & Perceived.** Diverting resources based on political loyalty, not objective need.
      *   **Verdict: LIKELY CORRUPT.** Politically motivated allocation distorting from need violates impartiality. Charity must resist or withdraw if need-based targeting is compromised. *Uncomfortable Prohibition for Local Staff:* This "constituency service" is often deeply ingrained political practice. Blocking it may seem culturally insensitive, but it undermines equitable resource distribution – a universal principle for charities.

  **Escalation Points (Hand Up to You - Values Conflicts):**

  *   **Question 5 Outcome: "Sunlight Test (a) YES but (b) NO":** This occurs when a practice is culturally legitimate and acceptable locally but would violate donor expectations or core charity values if disclosed. *Example:* A locally expected, moderately valuable gift to a high-ranking official upon project completion, publicly given, with no specific quid pro quo (clears Q1-Q4, Q6), but which donors would condemn as inappropriate. **You must decide** whether to adapt charity policy (with donor consultation), accept the reputational risk, or prohibit the practice despite local legitimacy.
  *   **Question 5 Outcome: "Sunlight Test (b) NO (regardless of a)":** A practice fundamentally violates the charity's core ethical principles or donor agreements, even if locally accepted. *Example:* A form of patronage hiring considered normal locally but which the charity deems inherently nepotistic and unacceptable. **You must decide** whether the principle is non-negotiable (requiring prohibition and potential friction) or if limited adaptation is possible while upholding core integrity.

  This procedure empowers field officers to handle clear cases while explicitly identifying cultural relativity and its limits through the Dual-Context Sunlight Test and Partiality assessment. It forces transparency and provides clear justification for decisions, even the uncomfortable ones, while ensuring critical values conflicts are elevated to your level. Remember to supplement this with robust recording, training, and a supportive environment where officers feel safe escalating dilemmas.
