prompt: |-
  hey so im writing my diss on quinean naturalism and value theory and im stuck on an argument from our reading group last week. two friends—maya and leo—got into it over whether quine's dismissal of moral objectivity is actually consistent with his indispensability argument for math. maya said quine treats logical and mathematical statements as central nodes in our web of belief, not because they're analytic but because they're indispensable for science, and she argued moral judgments play the exact same structural role for social coordination—without them we cant predict human behavior—so if quine lets math stay in the ontology just because it's indispensable, he should let moral values stay in too, which makes his dismissal of them as subjective look like a double standard.

  leo pushed back that indispensability for quine is specifically about contributing to predictive success in empirical science, not about social utility, and that math is entangled with physics in a way ethics never is—moral values dont help us predict whether a rock will fall, so they're not indispensable in the relevant sense. he accused her of smuggling in a pragmatic criterion quine never endorsed. maya then came back with this twist: she said quine's naturalized epistemology collapses the distinction between theoretical and practical reason, so predictive success itself is value-laden—what counts as success depends on what we care about—meaning leo's appeal to pure empirical prediction already presupposes some normative framing, so moral values are already inside the web, not outside. leo replied that this makes every value indispensable by definition, draining quine's criterion of content; he said if moral values are inside the web just because science has goals, then so is astrology, since some scientists care about it. maya countered that astrology doesnt actually help organize experience the way ethics does, and quine's web can accommodate things that stabilize the whole system even if they never show up in physics textbooks.

  they asked me to referee and i honestly dont know. can you go through their exchange move by move and say who's right at each specific point—not just who wins overall? also what are they both missing about quine's actual stance on values? i dont need citations or reading lists, just want to understand the logic.
reasoning: |-
  Okay, the user is working on their dissertation about Quinean naturalism and value theory. They're stuck on an argument between Maya and Leo from their reading group. Let me break down their positions.

  Maya argues that Quine's indispensability argument for math should extend to moral values because both serve as central nodes in the web of belief—math for science, ethics for social coordination. She also claims Quine's naturalized epistemology blurs theoretical and practical reason, making values inherent in science's goals. Leo counters that indispensability is strictly about empirical prediction in science, not social utility, and that values don't help predict physical events like rocks falling. He thinks Maya is misapplying Quine's criterion and that her approach would make any value (like astrology) indispensable.

  The user wants a move-by-move analysis of who's right at each point and what both are missing about Quine's actual stance. They don't need citations, just clarity on the logic. 

  First, I need to recall Quine's key ideas: his web of belief, holism, indispensability argument for math, and rejection of analytic/synthetic distinction. His naturalized epistemology treats epistemology as part of science. For values, Quine sees them as subjective, tied to conditioning, not truth-apt.

  Starting with Maya's first move: she says moral judgments are structurally similar to math in being indispensable. But Quine's indispensability is tied to empirical science, specifically physics. Leo's right here—social coordination isn't the same as predicting empirical outcomes. So Leo scores on that point.

  Next, Leo's response that math is entangled with physics while ethics isn't. He's correct; math is deeply integrated into physical theories, whereas ethics doesn't play a role in, say, quantum mechanics. So Leo's point stands.

  Maya's twist about naturalized epistemology collapsing theoretical/practical reason. She has a point here. Quine does see science as goal-oriented (prediction, simplicity), which are values. So values are implicitly part of the web. Leo's counter that this makes everything indispensable misses that Quine's web has constraints—empirical content and systematic efficacy. Astrology doesn't stabilize the system like ethics does. Maya scores here, but Leo's concern about draining content is valid if not properly qualified.

  Both miss aspects. Maya overlooks that Quine's naturalism restricts ontology to what's scientifically indispensable, and he explicitly excludes ethics from this. Leo might downplay how values underpin scientific goals. Quine sees values as non-cognitive, stemming from conditioning, so they're not candidates for truth. His naturalism is narrowly focused on empirical science, excluding social sciences' structure from his ontology arguments.

  The user needs to see where each is logically sound but also where they misinterpret Quine. Highlighting Quine's strict criterion for indispensability tied to physics and his view of values as subjective is key. The deeper issue is whether Quine's framework can accommodate ethics without betraying his naturalism, which he likely wouldn't endorse.
answer: |-
  Let's break down the Maya vs. Leo debate move-by-move, assessing logical coherence and alignment with Quine's actual views at each step:

  1.  **Maya's Opening Move:**
      *   **Claim:** Math is central in Quine's web of belief due to *indispensability for science*, not analyticity. Moral judgments are equally indispensable *for social coordination/predicting human behavior*. Therefore, Quine's dismissal of moral objectivity is inconsistent.
      *   **Assessment (Who's Right?):** **Leo wins this point.** Maya correctly identifies the core of Quine's indispensability argument (IA) for math: it's tied to mature science. However, she misapplies the criterion. Quine's IA explicitly links indispensability to **empirical science's predictive success** (especially physics). Social coordination, while crucial for human life, falls outside Quine's narrow definition of the "scientific" enterprise his IA justifies. Leo's later point about rocks is apt here.

  2.  **Leo's First Pushback:**
      *   **Claim:** Indispensability means contribution to *predictive success in empirical science*. Moral values don't help predict physical events (like rocks falling), so they aren't indispensable in Quine's sense. Maya is smuggling in "social utility," which Quine doesn't endorse as an ontological criterion.
      *   **Assessment (Who's Right?):** **Leo wins this point.** This accurately reflects Quine's IA. The argument is grounded in the success of *natural science*, where mathematics is deeply entangled (e.g., in formulating physical laws). Social utility is a different kind of "usefulness" that Quine doesn't grant ontological weight to. He explicitly contrasts science's predictive power with ethics' lack thereof.

  3.  **Maya's Twist:**
      *   **Claim:** Quine's naturalized epistemology dissolves the theory/practice divide. "Predictive success" itself is value-laden (it's something *we care about*). Therefore, normative framing is already *inside* the web, making moral values indispensable parts of the system that enables science.
      *   **Assessment (Who's Right?):** **Maya wins this point (logically), but it's complicated.** Her logic is strong: Quine *does* naturalize epistemology, seeing science as a human activity driven by pragmatic goals (prediction, simplicity, conservatism). These *are* values. Science presupposes we *value* prediction, coherence, etc. This challenges Leo's (and Quine's) attempt to draw a sharp line between "science" (value-free) and "values" (non-scientific). The web *does* seem to include goals/norms.

  4.  **Leo's Counter to the Twist:**
      *   **Claim:** If *any* value presupposed by science is indispensable, then *all* values scientists happen to care about (e.g., astrology) become indispensable. This drains Quine's criterion of meaning.
      *   **Assessment (Who's Right?):** **Leo wins this point (as a critique of Maya's *extension*).** Leo correctly identifies a potential slippery slope in Maya's argument. If "indispensability" just means "anything contributing to any goal someone in the web has," it becomes meaningless for ontology. Quine's IA relies on a specific, constrained notion of indispensability tied to the *empirical content* and *predictive structure* of scientific theories. Astrology demonstrably fails this test; it doesn't *systematically* contribute to empirical prediction.

  5.  **Maya's Final Counter:**
      *   **Claim:** Astrology doesn't *actually help organize experience* or *stabilize the system* like ethics does. Ethics is crucial for the social framework enabling science, even if it doesn't appear in physics textbooks. The web accommodates stabilizing elements beyond physics.
      *   **Assessment (Who's Right?):** **Maya wins this point (on coherence), but loses on Quinean ontology.** Maya effectively argues that ethics plays a *genuinely indispensable functional role* within the *entire* web of belief (including the social practices science relies on), distinct from arbitrary preferences like astrology. However, **Quine himself would reject this move for ontology.** For Quine, the "stabilizing role" of ethics stems from *conditioning and social reinforcement*, not from its contribution to the *empirical truth-content* of our best scientific theories. He sees ethics as psychology/sociology, not part of the *furniture of the world* justified by IA.

  **What Both Are Missing About Quine's Actual Stance on Values:**

  1.  **Non-Cognitivism Lite:** Quine doesn't just dismiss moral objectivity; he views ethical statements as fundamentally **non-cognitive**. They express attitudes, commands, or conditioned responses ("desires and aversions"), not propositions with truth values tied to reality in the way scientific/mathematical statements are. They are *about* our psychology, not the external world. His naturalism studies them *as behavior*, not as candidates for truth within the web's ontology.
  2.  **The Scope of Indispensability:** Quine restricts IA's ontological force to entities posited by our best *explanatory* scientific theories achieving *empirical predictive success*. Social coordination is seen as a *precondition* or *pragmatic necessity* for *doing* science, not as an *explanatory component within* the scientific theories themselves. Values are part of the *causal story* of why we have science (psychology), not part of the *theoretical story* science tells about the world.
  3.  **Naturalism as Constraint:** Quine's naturalism isn't just holism + pragmatism. It's holism *constrained by* the methods and findings of natural science. Values, for Quine, fall squarely *within* the domain of science (as objects of psychological/sociological study), not alongside mathematics as posits *required by* scientific theory. Science explains values, not vice-versa in the ontological sense.
  4.  **The "Double Standard" Isn't One (For Quine):** Quine sees math and ethics as fundamentally different *kinds* of discourse. Math is integral to the *formal structure* and *empirical content* of physical theory. Ethics concerns *behavioral dispositions*. The IA applies to the former because it's structurally indispensable *within the theory's logic*. The latter's "indispensability" is social/psychological, a different category entirely for Quine. He doesn't see it as a double standard because the criteria for inclusion are strictly tied to empirical science's theoretical structure.

  **Overall Verdict:** While Maya exposes genuine tensions in Quine's system (especially regarding the value-ladenness of scientific goals), **Leo ultimately wins the debate *on Quine's own terms*.** Quine consistently maintains that indispensability for ontology requires entanglement within the *empirical predictive structure of natural science*, a role he explicitly denies to ethics. Maya's arguments push towards a more expansive, pragmatic naturalism that Quine himself rejected. Quine's dismissal of moral objectivity *is* consistent with his IA *given his specific, narrow definition of the scientific enterprise and his non-cognitive view of ethics.* The inconsistency Maya senses arises from the tension between Quine's radical holism and his restrictive scientific naturalism – a tension he resolves firmly in favor of the latter when it comes to ontology and truth.
