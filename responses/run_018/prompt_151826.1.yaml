  **Residual Judgments and Misclassification:**

  The protocol is prone to misclassify:

  1. **Ambiguity in demonstrated techniques**: What counts as "demonstrated"? We rely on peer-reviewed literature or deployed systems. But a technique might be demonstrated in a slightly different context. The protocol might reject a valid extension.

  2. **Ethical gray areas**: Step 3 requires handing off to a values committee. But sometimes the line between technical and ethical is blurry (like in the deception example). The protocol might misclassify by either not handing off when it should (leading to technical approval of an ethically loaded intervention) or handing off unnecessarily.

  3. **Recursive structures that are sound**: The protocol flags circularity but does not automatically reject. However, step 2 might reject because of undemonstrated techniques in the recursive step. But what if the recursive use is at a smaller scale and the base case is demonstrated? The protocol does not account for that. For example, if the critics are aligned by a simpler, already demonstrated method and then the same protocol (which is being proposed for the main model) is used only for the main model, then step 4 would not flag circularity and step 2 would pass. But in Case 3, the proposal explicitly says the critics are aligned by the same protocol.

  4. **Implementation feasibility (step 5)**: This is a judgment call. The lab might overestimate or underestimate its capabilities.

  Residual judgments that cannot be eliminated:

  - **Step 3 (Ethical Handoff)**: The decision of what constitutes an ethical judgment is inherently subjective and must be made by a human.

  - **Step 5 (Implementation Feasibility)**: The assessment of what the lab can do is a managerial/resource judgment.

  - **Step 2 (Demonstrated Techniques)**: The boundary between what is demonstrated and what is not may require expert judgment.

  - **Circularity Flag (Step 4)**: The protocol flags circularity but leaves it to the auditor to decide whether to proceed. However, in practice, the circularity may cause the proposal to fail at step 2 or step 5.

  Final Protocol:

  **Prosaic Feasibility Protocol (PFP) - Decision Flow**

  1. **Theoretical Breakthrough Check**:  
     - Question: "Does the proposed intervention depend on any novel theoretical breakthrough in agency, consciousness, or the nature of general intelligence?"  
     - Required Answer: **No**.  
     - If "Yes": **Stop and Reject** (Theoretical Breakthrough Dependency).  
     - Else: Proceed to 2.

  2. **Demonstrated Techniques Check**:  
     - Question: "Does the proposal exclusively use techniques that have been demonstrated in peer-reviewed literature or in deployed systems? (Acceptable techniques: mechanistic interpretability, scalable oversight, reinforcement learning from human feedback, adversarial red-teaming, multi-agent evaluation, or others of similar maturity.)"  
     - Required Answer: **Yes**.  
     - If "No": **Stop and Reject** (Undemonstrated Technique).  
     - Else: Proceed to 3.

  3. **Ethical Judgment Check**:  
