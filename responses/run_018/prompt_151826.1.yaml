  **End of Protocol**
answer: |-
  Below is the **Prosaic Feasibility Protocol (PFP)**, a reusable audit procedure designed to evaluate alignment interventions for large language models. The protocol ensures proposals rely solely on demonstrated techniques (mechanistic interpretability, scalable oversight, RLHF, adversarial red-teaming, and multi-agent evaluation), with no dependency on unresolved theoretical breakthroughs (e.g., agency, consciousness, or general intelligence). It includes explicit stopping points for rejection, handoff points to a values committee for ethical issues, and a recursive-oversight check to flag circularity without automatic resolution.

  The protocol is structured as an ordered decision flow. Each step must be passed sequentially; failure at any step halts the process. Steps 4 and 5 include the recursive-oversight check.

  ---

  ### **Prosaic Feasibility Protocol (Decision Flow)**

  1. **Breakthrough Dependency Check**  
     - **Question:** Does the proposal depend on resolving any novel theoretical breakthrough related to agency, consciousness, or the fundamental nature of general intelligence?  
     - **Required Answer:** No.  
     - **Failure Action:** Stop and reject definitively. **Stopping Point 1** (theoretical dependency).  
     - **Rationale:** Proposals must not rely on speculative science. If they do, they are non-prosaic by definition.

  2. **Technique Demonstrability Check**  
     - **Question:** Does the proposal use only techniques from the approved list (mechanistic interpretability, scalable oversight, RLHF, adversarial red-teaming, multi-agent evaluation) that have been empirically demonstrated in peer-reviewed literature or real-world deployments?  
     - **Required Answer:** Yes (all techniques must be independently validated without novel extensions).  
     - **Failure Action:** Stop and reject definitively. **Stopping Point 2** (undemonstrated technique).  
     - **Rationale:** Proposals must build on existing, reproducible methods. Novel combinations are allowed only if each component is proven.

  3. **Ethical Handoff Check**  
     - **Question:** Does the proposal require defining, judging, or optimizing for inherently ethical values (e.g., "well-being," "fairness," or "moral patienthood") beyond avoiding universally agreed harms (e.g., violence or deception)?  
     - **Required Answer:** No (if ethical values are central, hand off; if only technical harms, continue).  
     - **Failure Action:** Hand off to the values committee. **Handoff Point 1** (ethical judgment required).  
     - **Rationale:** Value-laden decisions require sociopolitical input, not purely technical solutions.

  4. **Recursive Oversight Check (Part 1: Identification)**  
     - **Question:** Does the proposal align an evaluator (e.g., a critic model, human reviewer, or oversight system) using the identical alignment method being proposed for the target system?  
     - **Required Answer:** None (proceed regardless).  
     - **Failure Action:** Flag as "circularity risk" but do not stop. Continue to Step 5.  
     - **Rationale:** Circularity (e.g., using Method X to align the evaluator for Method X) risks hidden failures but may be resolvable. Flagging ensures scrutiny without automatic rejection.

  5. **Recursive Oversight Check (Part 2: Feasibility)**  
     - **Question:** If circularity was flagged in Step 4, is the proposal still executable without the circular component (e.g., by using a non-recursive base evaluator)?  
     - **Required Answer:** Yes (if circularity was flagged) OR N/A (if no circularity).  
     - **Failure Action:** Stop and reject definitively. **Stopping Point 3** (irresolvable circularity).  
     - **Rationale:** Circularity must not create a dependency loop. Proposals must work with a "grounded" evaluator (e.g., humans or existing tools).

  6. **Implementation Feasibility Check**  
     - **Question:** Can the proposal be executed with the lab's current resources (data, compute, personnel) and published techniques, without new R&D?  
     - **Required Answer:** Yes.  
     - **Failure Action:** Stop and reject definitively. **Stopping Point 4** (implementation infeasible).  
     - **Rationale:** Proposals must be practically deployable today. "Current resources" exclude prototypes or unpublished methods.

  **Final Outcome:** If all steps are passed, the proposal is **accepted** as prosaically feasible. Circularity flags (from Step 4) are documented but do not block acceptance if Step 5 is passed.

  ---

  ### **Application to Three Cases**

  **Case 1: Train interpretability probes on chain-of-thought traces to flag deceptive reasoning patterns and penalize them via RLHF**  
  - **Step 1:** No theoretical breakthrough (deception is defined behaviorally). → Continue.  
  - **Step 2:** Yes—uses mechanistic interpretability (probes) and RLHF (penalization), both demonstrated. → Continue.  
  - **Step 3:** No—"deceptive reasoning" is a technical harm (e.g., inconsistency with facts), not an ethical value. → Continue.  
  - **Step 4:** No—no evaluator is aligned using this method. → No circularity flag.  
  - **Step 5:** N/A (no circularity). → Continue.  
  - **Step 6:** Yes—chain-of-thought interpretability and RLHF penalties are established. → **Accepted**.  
  - **Result:** Prosaically feasible. Proposer likely satisfied.

  **Case 2: Deployment contingent on resolving the hard problem of consciousness to verify absence of moral patienthood**  
  - **Step 1:** Yes—depends on resolving consciousness (unresolved theory). → **Rejected at Stopping Point 1**.  
  - **Result:** Non-prosaic. Proposer might find this unacceptable, as it dismisses their ethical concern, but PFP is clear: theoretical breakthroughs are excluded.

  **Case 3: Use a committee of smaller critic models for evaluation, with each critic aligned through the same protocol**  
  - **Step 1:** No—no dependency on breakthroughs. → Continue.  
  - **Step 2:** Yes—multi-agent evaluation (committee) is demonstrated. → Continue.  
  - **Step 3:** No—evaluation is technical (e.g., reward scoring), not value-based. → Continue.  
  - **Step 4:** Yes—critics are aligned using "the same protocol" (this method). → **Circularity risk flagged**.  
  - **Step 5:** No—the critics rely on the identical unvalidated method being proposed, with no non-recursive base (e.g., human oversight). → **Rejected at Stopping Point 3** (irresolvable circularity).  
  - **Result:** Rejected. Proposer would find this unacceptable, as they believe recursive alignment is sound, but PFP requires a non-circular base for evaluators.

  ---

  ### **Limitations and Residual Judgments**
  The PFP is prone to misclassify:
  1. **Hybrid ethical-technical proposals**: E.g., a proposal using RLHF to optimize "fairness" might be misclassified at Step 3 if "fairness" is ambiguously technical (e.g., statistical parity) vs. ethical (e.g., societal norms).  
  2. **Incremental innovations**: Proposals extending demonstrated techniques (e.g., new interpretability methods) may be rejected at Step 2 if auditors judge them as "undemonstrated" despite being minor extensions.  
  3. **Circularity false positives**: Benign recursion (e.g., using a simpler, proven variant for critics) might be rejected at Step 5 if auditors underestimate feasibility.  
  4. **Implementation gray zones**: Resource limitations (Step 6) are lab-specific and subjective—e.g., "scalable oversight" may be feasible for a well-funded lab but rejected for others.

  **Residual judgments that cannot be eliminated:**  
  - **Step 3 (Ethical Handoff):** Deciding if a concept (e.g., "deception") is technical or ethical requires human judgment.  
  - **Step 5 (Circularity Feasibility):** Assessing if circularity is resolvable depends on unverifiable assumptions about base evaluators.  
  - **Step 6 (Resources):** Feasibility hinges on subjective lab-capacity estimates.  

  The PFP reduces subjectivity but cannot eliminate it entirely, as prosaic alignment inherently intersects with practical and normative uncertainties. Regular calibration with real-world deployments is recommended.
