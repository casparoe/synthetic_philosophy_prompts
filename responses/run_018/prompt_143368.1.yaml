  Below is a decision-tree taxonomy for the extended mind thesis, built from concrete commitments and the specified scenarios. The root commitment ("Some cognitive processes can constitutively include resources that lie outside the biological organism") is treated as a foundational claim, with branching nodes phrased as diagnostic questions about the scenarios. Each node splits the logical space into 2–3 branches. The tree prioritizes logical space over labels and includes the required positions, hybrids, and analyses.

  ---

  ### **Decision Tree: Extended Mind Positions**
  **Root Commitment (Node 0):**  
  *Some cognitive processes can constitutively include resources that lie outside the biological organism.*  
  - **Accept** → Proceed to Node 1  
  - **Reject** → Proceed to Node A (causal coupling question)  

  **Node A (for Root = Reject):**  
  *Do external resources (e.g., Otto’s notebook) play a significant causal role in cognition, even if non-constitutive?*  
  - **Yes** → Embedded cognition without constitution  
  - **No** → Strict neurobiological internalism  

  **Node 1 (Otto’s Notebook):**  
  *In Alzheimer’s navigation, is Otto’s notebook a constitutive part of his cognitive process?*  
  - **Yes** → Proceed to Node 2  
  - **No** → Proceed to Node 4 (skip to social/neural cases)  

  **Node 2 (Neural Lace Implant):**  
  *Is the biologically integrated "neural lace" (internal, non-biological) a constitutive part of memory retrieval?*  
  - **Yes** → Proceed to Node 3  
  - **No** → Proceed to Node 3 (artifacts must be external)  

  **Node 3 (Engineer’s CAD Software):**  
  *Is the CAD software (trusted but opaque) a constitutive part of the engineer’s design process?*  
  - **Yes** → Proceed to Node 4  
  - **No** → Proceed to Node 5 (functional parity insufficient)  

  **Node 4 (Jazz Quartet):**  
  *Is the improvisational cognition constitutively distributed across the quartet?*  
  - **Yes** → Proceed to Node 5  
  - **No** → Proceed to Node 5 (reject social extension)  

  **Node 5 (Intermittent Coupling):**  
  *Can a weekly-accessed diary be a constitutive part of memory (despite low-frequency access)?*  
  - **Yes** → Accept intermittent extension  
  - **No** → Require persistent access  

  ---

  ### **Leaf Positions**
  Each leaf includes:  
  - **Position name**  
  - **Path (answers to nodes)**  
  - **Awkward commitment** (counterintuitive implication for one scenario)  

  1. **Strict Neurobiological Internalism**  
     - Path: Root = Reject, Node A = No  
     - Awkward commitment: *Must claim the neural lace implant (scenario 4) is merely a "tool" for biological memory, even when seamlessly integrated.*  

  2. **Embedded Cognition Without Constitution**  
