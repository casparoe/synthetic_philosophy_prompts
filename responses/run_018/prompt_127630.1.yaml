answer: |-
  Here’s a distilled desiderata list for theories of moral motivation, grounded in Williams’ integrity objection and related cases, with clarity on settled debates, conflicts, and theoretical tensions:

  ### **Core Desiderata (Non-Negotiables)**  
  1. **Integrity Preservation**: Must accommodate actions arising from deep personal commitments (e.g., saving a spouse) *without* requiring impartial justification. *Collapsing this risks alienation from one’s moral core.*  
  2. **Motivation-Source Distinction**: Must differentiate between:  
     - Acting from **love/commitment** (e.g., spontaneous spouse-rescue)  
     - Acting from **principle** (e.g., "I saved my spouse because utilitarianism permits partiality").  
  3. **Partiality/Impartiality Balance**: Must explain when personal ties legitimately override impartial demands (e.g., favoring family over strangers) and when they do not (e.g., triage in emergencies).  
  4. **Role Motivation**: Must account for duties tied to social roles (e.g., a soldier’s sacrifice, a journalist’s confidentiality) *without* reducing them to universal rules.  

  ### **Contentious/Context-Sensitive Desiderata**  
  5. **Burnout Resistance**: Should ideally prevent agents from being consumed by moral demands (e.g., activist burnout). *Some view this as a psychological add-on; others see it as structurally necessary.*  
  6. **Universality Scope**: Whether the theory requires *all* reasons to be justifiable to *all* agents. **Key tension**: Full universality often clashes with integrity (Williams’ core critique).  
  7. **Institutional vs. Personal Integrity**: Must distinguish role-based integrity (journalist protecting sources) from personal integrity (artist refusing commercial work). *Negotiable: Some theories merge these; others insist on separation.*  

  ### **Potentially Jointly Unsatisfiable Pairs**  
  - **Universality + Integrity**: If morality demands reasons be universally justifiable (à la utilitarianism/Kantianism), deep personal commitments appear irrational.  
  - **Impartiality + Role Motivation**: Roles (e.g., parent, soldier) require *structured partiality*; strong impartialism struggles to legitimize this.  

  ---

  ### **Theories Scored Briefly**  
  | **Criterion**             | **Utilitarianism**       | **Virtue Ethics**         | **Care Ethics**           |  
  |---------------------------|--------------------------|---------------------------|---------------------------|  
  | **Integrity Preservation**| Fails (calculus overrides commitments) | Excels (motivation tied to character) | Excels (rooted in relational bonds) |  
  | **Motivation-Source**     | Fails (reduces love to permissible preference) | Passes (virtues express identity) | Passes (care is non-derivative) |  
  | **Partiality/Impartiality**| Struggles (partiality only instrumentally valid) | Flexible (contextual discernment) | Excels (partiality is foundational) |  
  | **Role Motivation**       | Weak (roles as efficiency tools) | Strong (roles as virtue contexts) | Moderate (focuses on interpersonal, not institutional roles) |  
  | **Burnout Resistance**    | Weak (maximization is relentless) | Moderate (self-care as virtue) | Strong (attentiveness to limits) |  
  | **Universality**          | Strong (agent-neutral)   | Weak (agent-centered)     | Weak (relationally specific) |  

  ---

  ### **Settled vs. Contested in Literature**  
  - **Settled**:  
    - Moral motivation cannot be *purely* consequentialist without threatening integrity (Williams’ point is widely accepted).  
    - Personal attachments require non-instrumental moral weight (rejecting "one thought too many" is near-consensus).  
  - **Contested**:  
    - **Scope of Impartiality**: Whether impartiality only applies to institutions (Rawls) or also to personal ethics (Singer).  
    - **Role Obligations**: Are these irreducible (MacIntyre) or reducible to universal principles (Kantian constructivists)?  
    - **Care Ethics’ Range**: Can it handle justice/impersonal demands (Noddings vs. critics)?  

  ### **Key Tension Spotlight**  
  The **Universality-Integrity conflict** remains the deepest fault line: Utilitarianism/Kantianism sacrifice personal integrity for universal scope; virtue/care ethics invert these priorities. No theory fully resolves this—**the choice is structural, not corrective**.  

