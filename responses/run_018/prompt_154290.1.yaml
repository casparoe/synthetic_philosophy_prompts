  Subject: Podcast Qs Draft - Killing/Letting Die & Institutional Omission

  Hey [Philosopher's Name], really looking forward to unpacking your institutional omission idea on the pod. It's such a sharp twist on the usual killing vs. letting die stuff. To dive in, I'm thinking we could start with the core: when you argue that the distinction collapses in these cases where a system structurally *prevents* rescue for a group – like that pathway just isn't built – isn't the end result functionally *identical* to actively killing them? Like, if the outcome is death that wouldn't have happened otherwise, and the system design is the necessary condition, why isn't that just killing by a really complex, bureaucratic name? Doesn't calling it "letting die" kinda let the designers off the hook too easily?

  And following that, how does the Doctrine of Double Effect even *work* in this context? DDE usually hinges on intentional action versus foreseen but unintended bad effects. But here, the "action" is this diffuse *absence* of a system – it feels passive, even if the initial setup wasn't. If the harmful death is a *direct and predictable* outcome of the institutional design choice itself, not a side effect of pursuing some other good, does the whole "intended/foreseen" distinction even hold water? Or does it get totally scrambled?

  Your homeowner analogy – removing the ladder knowing the firefighters can't reach the kid – is super vivid for illustrating the moral weight of creating the *impossibility*. But I gotta push back: does this small-scale, individual act of sabotage *really* map onto large-scale policy triage? Like, nobody *intentionally removed the ladder* in, say, a healthcare desert; it might be decades of underfunding, bad zoning, complex market failures. Doesn't that massive scale and diffusion of agency make the "omission" feel fundamentally different, maybe less clearly culpable? Or does the sheer scale just make the moral failure *bigger*?

  I suspect you might say that intent gets distributed across the institution – it's baked into the design logic or the sustained choices. But if that's the case, what does that *do* to moral responsibility? If the intent and the causal power are spread across legislators, administrators, voters over time... does that responsibility just dissipate into thin air? Or how do we pinpoint *who* actually bears the blame for the harm when the "act" is this collective, historical non-building? Isn't there a risk here that "distributed intent" becomes a way to say *nobody* is really responsible?

  Finally, to zoom out a bit: how do we *apply* this framework? If we accept that institutional omission collapses the distinction and carries similar weight to killing in these specific structural cases, what does that demand in practice? Does it radically change how we evaluate things like, say, triage protocols during a pandemic, or the lack of mental health crisis response systems? What's the concrete takeaway for folks trying to build less harmful institutions?

  Really keen to hear you tackle these – it feels like you're poking at something crucial about how systems do harm. Cheers!

