  **Key elements covered:**

  1.  **Is it just Killing?:** Challenges the functional equivalence and potential for letting designers off the hook.
  2.  **Doctrine of Double Effect:** Questions its applicability to passive, structural absences and foreseen necessary outcomes.
  3.  **Homeowner Analogy vs. Policy Triage:** Explicitly pushes on the scalability and agency diffusion issue.
  4.  **Distributed Intent & Moral Responsibility:** The requested follow-up, anticipating the institutional intent reply and probing the dilution of responsibility.
  5.  **Practical Application:** Asks for the real-world implications and demands of her view.
  6.  **Casual Tone/Typos:** "kinda", "gotta", "it’s" instead of "its" (common typo), contractions, conversational flow.
