  Tension 5: Between (5) and (1) 
  - (1) is about entitlement collapse. In market economies, entitlement is via market (lose purchasing power). In command economies, entitlement is via state ration. (5) says that in command economies, people lost state-ration access. Thus, it's a form of entitlement collapse. So (5) extends (1) by showing a different mechanism. Therefore, no real tension. The patch is just making explicit that entitlement can come from non-market sources. Sen's original framework already included non-market entitlements (like state distributions) but his examples were often market-based. So the patch is a clarification, not a break.

