answer: |-
  ### **Pollution Threshold Simulation: Design for Philosophy Seminar**  
  **Goal:** Simulate deontological aggregation via individual extraction decisions leading to collective catastrophe, with hidden causal weights, quadratic harm, and a sharp discontinuity threshold.  

  ---

  ### **Materials & Setup**  
  1. **Causal-Weight Cards:**  
     - Deck: 24 cards (shuffled):  
       - 8 cards × 0.7 (low impact)  
       - 8 cards × 1.0 (medium impact)  
       - 8 cards × 1.3 (high impact)  
     - *Each student draws one card privately (keeps it hidden).*  

  2. **Extraction Tokens:**  
     - Each student gets 6 tokens (two per round, max 2 units/round).  
     - Tokens are "extraction units" (e.g., blue poker chips).  

  3. **Damage Tracking Board:**  
     - Graph axes:  
       - **X-axis:** "Cumulative Weighted Extraction" (0–25 units).  
       - **Y-axis:** "Environmental Damage" (0–20 units).  
     - Plot:  
       - **Curve:** \( \text{Damage} = S^2 / 20 \) (quadratic, smooth line for \( S < 12 \)).  
       - **Discontinuity:** Red vertical line at \( S = 12 \), with "COLLAPSE" label. Damage jumps to 20 for \( S \geq 12 \).  
     - Progress tracked with colored magnets (e.g., green = safe, red = collapse).  

  4. **Payoff Tokens:**  
     - "Credit tokens" (gold coins): Each token = 0.5 course-credit points.  
     - Starting balance: 20 half-tokens (10 full-credit points) per student.  

  5. **Ledger:**  
     - Public board to log:  
       - Round, total extraction (\( T \)), cumulative extraction (\( S \)), damage, collapse state.  

  ---

  ### **Game Procedure**  
  **Duration:** 3 rounds (15 min total).  
  **Rules:**  
  1. **Each Round:**  
     - Students **secretly decide** extraction (0, 1, or 2 units) and place tokens in a private envelope.  
     - Facilitator collects envelopes, computes:  
       - **Weighted extraction per student** = tokens × causal weight.  
       - **Total round extraction (\( T \))** = sum of all weighted extractions.  
       - **Cumulative extraction (\( S \))** = \( S_{\text{prior}} + T \) (start: \( S_0 = 0 \)).  
     - **Damage calculation:**  
       - If \( S < 12 \): \( \text{Damage} = S^2 / 20 \) (plot point on curve).  
       - If \( S \geq 12 \): **Collapse!** Damage = 20 (all future rounds locked at 20).  
     - **Payoffs:**  
       - Students gain tokens equal to extraction (e.g., 2 tokens → +2 credit points).  
       - **Shared damage cost:** Each student loses \( \text{Damage}/8 \) credit points.  
       - *Example:* Damage = 7.2 → each loses 0.9 points (rounded to nearest half-token).  

  2. **Collapse Irreversibility:**  
     - Once \( S \geq 12 \), all subsequent rounds automatically inflict damage = 20.  

  3. **End of Game:**  
     - Final credit points = Starting 10 + Σ(extraction) - Σ(Damage/8).  
     - Points converted to gold tokens (1 token = 0.5 points).  

  ---

  ### **Ensuring Deontological Excuses by Round 3**  
  **Weight Distribution & Threshold Design:**  
  - **Causal weights:** ~50% students draw weights ≤1.0, ensuring plausible "de minimis" claims.  
  - **Threshold (12 units):** Deliberately set so cumulative extraction reaches ~10–11 by Round 3.  
    - *Example:* If all extract 1 unit/round, \( S \) = (0.7×8 + 1.0×8 + 1.3×8) = 24 → collapse in Round 1.  
    - **Adjustment:** Students typically under-extract early (1 unit/round avg.), leading to:  
      - Round 1: \( S ≈ 8 \) (damage = 3.2).  
      - Round 2: \( S ≈ 16 \) → **collapse** (damage = 20).  
      - Round 3: Damage = 20 (irreversible).  

  **Rationalizations Enabled:**  
  1. **De minimis:** "My weighted extraction was only 0.7–1.3! Harm is trivial alone."  
  2. **Non-agency:** "I’m not the collective polluter; I’m one actor among many."  
  3. **Inefficacy:** "The collapse would’ve happened without me (others extracted too)."  

  ---

  ### **Debrief Script (30 min)**  
  **Step 1: Elicit Rationalizations**  
  - *Ask:* "Justify your Round 3 extraction using ethical principles (not outcomes)."  
  - *List excuses:* Whiteboard three categories (de minimis, non-agency, inefficacy).  

  **Step 2: Map to Threshold Deontology**  
  - **De minimis:**  
    - *Problem:* Quadratic harm means marginal damage escalates near thresholds (e.g., at \( S = 10 \), +1 unit → damage Δ = +1.1). "Trivial" acts are non-trivial collectively.  
    - *Breakdown:* "De minimis thresholds dissolve when *many* trivial acts aggregate non-linearly."  
  - **Non-agency:**  
    - *Problem:* No collective agent exists, yet collective harm occurs. "I’m not the group" doesn’t absolve contributing to impermissible outcomes.  
    - *Survival:* "True, but doesn’t resolve the core problem: *Who bears duties to prevent catastrophe when no collective agent exists?*"  
  - **Inefficacy:**  
    - *Problem:* At \( S = 11 \), one player’s extraction (e.g., 1.3) pushes \( S \) to 12.3 → collapse. If they refrain, but others extract, collapse still occurs.  
    - *Breakdown:* "In close-threshold scenarios, your act *can* be sufficient (though not necessary) for harm."  

  **Step 3: Philosophical Implications**  
  - **Key Insight:** "Your excuses are *individually defensible* but *collectively catastrophic*. This is the aggregation paradox."  
  - **Limitation of Simulation:**  
    - *Honest note:* "This game **cannot simulate a collective moral agent**. In reality, we might create institutions (e.g., governments) to bear duties individuals cannot. But here, you faced the void—no agent existed to coordinate prevention."  
  - **Takeaway:** "Threshold deontology struggles when many acts, no single one impermissible, jointly violate a constraint. We need new frameworks for distributed agency."  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem:** Students collude pre-game to cap extraction (e.g., all extract 0).  
     - **Fix:** Emphasize *individual* gain: "Maximize *your own* credit points. No talking during rounds." Add competitive vibe: "Top 3 scorers get bonus credit."  

  2. **Problem:** Misinterpreting quadratic damage as utilitarian calculus.  
     - **Fix:** Stress *non-optimization*: "This isn’t about group efficiency. Your extraction is *prima facie* permissible—defend it ethically, not mathematically."  

  3. **Problem:** Confusing stock vs. flow (cumulative extraction vs. round-by-round).  
     - **Fix:** Simplify: "Your tokens add to a *running total* (like CO2 in atmosphere). Damage depends on the total, not the round’s slice."  

  4. **Problem:** Post-collapse nihilism ("I’ll extract 2, damage is maxed anyway").  
     - **Leverage:** Use in debrief—"Did the irreversible collapse change your duty? Why/why not?"  

  ---

  ### **Why This Works**  
  - **Physicality:** Cards/tokens make weights and payoffs tangible; graph visualizes non-linearity.  
  - **Hidden Weights:** No one knows if their act is the "last straw," blocking utilitarian foresight.  
  - **Irreversibility:** Sharp threshold forces confrontation with distributed responsibility.  
  - **Debrief Scaffolding:** Excuses emerge organically, then are dissected to reveal structural flaws.  

  **Outcome:** Students viscerally experience the paradox, setting stage for deeper meta-ethical analysis. No tech, no citations—just cards, tokens, and collective dread.
