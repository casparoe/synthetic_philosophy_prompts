  I facilitate a graduate philosophy seminar—eight students, one ninety-minute session, no prior game-theory background—who already know the deontological aggregation problem in its standard pollution-example form and can pattern-match it instantly. I want a physical, card-and-token simulation that makes them feel the structural pressure from the inside: each round they make an individual extraction decision, defend it with a standard deontological excuse, and only afterward discover that the collective outcome crosses a sharp discontinuity into catastrophic harm, with no collective agent available to bear responsibility. To prevent them from treating this as a disguised utilitarian calculus, the damage function should be explicit, continuous, and non-linear—specifically quadratic aggregation with a sharp state-change discontinuity at a collective threshold (e.g., total weighted extraction exceeding twelve units triggers an irreversible collapse state)—and each participant should draw a hidden causal-weight card (values drawn from a small deck: 0.7, 1.0, 1.3) that scales their personal contribution, so that no one knows ex ante whether their specific move is the one that crosses the boundary. The rules and payoffs must be arranged so that by round three every student can sincerely invoke a defensible excuse—my weighted contribution falls below the de minimis line; I am not the collective agent; the discontinuity is not caused by me alone—while the group outcome is unambiguously impermissible under the very constraint each invoked.

