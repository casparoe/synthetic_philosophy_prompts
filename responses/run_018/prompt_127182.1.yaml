answer: |-
  You've pinpointed a fascinating and pervasive inconsistency in intergenerational ethics, particularly around climate change and long-term preservation. This isn't just simple hypocrisy; it's a deeper **framing shift** exploiting ambiguities in how we conceptualize future people. While there isn't one universally agreed-upon name, it can be described as:

  **The Intergenerational Ontological-Temporal Toggle (or Framing Ambiguity)**

  **Core Mechanism:** The speaker toggles between two distinct conceptualizations of future people, depending on which serves their immediate argumentative goal:
  1.  **For Discounting/Present Focus:** Future people are **abstract potential entities**, defined primarily by their temporal distance. Their *existence* is contingent and hypothetical. This ontological vagueness ("they might not even exist") justifies heavy discounting due to pure time preference ("their welfare counts less *because* they are far away").
  2.  **For Preservation/Duty:** Future people are **concrete moral patients**, defined primarily by their *inevitable existence and capacity for suffering*. Their temporal distance becomes secondary to their ontological reality ("they *will* exist and inherit our choices"). This framing demands strong duties ("we *must* act to prevent their suffering").

  **How it Differs from the Non-Identity Problem:**
  *   **Non-Identity Problem:** Focuses on the *identity* of specific future individuals. It asks: *Can our actions today harm specific future people (Person X), if those same actions are also the reason Person X exists (rather than a different Person Y)?* The harm is contested because the alternative (non-action) would have resulted in different people existing, potentially better off, but *not* Person X. It's a problem of *comparing welfare across different possible populations*.
  *   **Ontological-Temporal Toggle:** Focuses on the *fundamental nature and moral status* of future people *as a class*. It asks: *Are they sufficiently "real" and "present" in our moral calculus to count significantly, or are they too abstract and distant?* The inconsistency arises when the *same speaker* uses the "abstract/distant" characterization to dismiss obligations (discounting) and the "concrete/patient" characterization to impose obligations (preservation), without reconciling the underlying contradiction in their view of *what future people fundamentally are*.

  **Boundary Cases to Define the Toggle:**

  1.  **Clear Toggle (Inconsistency):**
      *   **Argument A (Against Climate Mitigation):** "Spending trillions now to prevent warming in 2200 is irrational. Pure time preference means the welfare of people 200 years from now is worth only a fraction of ours today. They're so far away, and their existence isn't guaranteed – technology or catastrophe could change everything. We should prioritize current poverty."
      *   **Argument B (For Nuclear Waste Storage/Preservation):** "We have an absolute duty to future generations to safely store nuclear waste for millennia. They *will* exist and could suffer horrific consequences from our negligence. We cannot impose this risk on innocent people who inherit our mess." *Here, the speaker treats future people as abstract/distant for discounting welfare (Argument A) but concrete/inevitable patients for imposing preservation duties (Argument B), without resolving the ontological contradiction.*

  2.  **Consistent Discounting (No Toggle - Consistent Abstraction):**
      *   "Discounting applies universally. Future welfare is less valuable *because* it's future. This applies to both climate damages *and* the benefits of avoided nuclear waste risks. While we have *some* duty not to cause catastrophic harm, our primary obligations are to the present. Nuclear waste storage should be cost-effective based on discounted future risks, not 'absolute duty'." *This view consistently treats future welfare as abstract/less valuable due to time, even for preservation.*

  3.  **Consistent Strong Obligation (No Toggle - Consistent Concreteness):**
      *   "Future people who will exist are moral patients just like us, regardless of temporal distance. Pure time preference is ethically indefensible discrimination. We have strong duties not to severely harm their prospects, whether through climate catastrophe *or* radioactive contamination. Cost-benefit analysis using high discount rates for long-term harms is morally flawed." *This view consistently treats future people as concrete moral patients demanding significant present sacrifice for both mitigation and preservation.*

  4.  **Non-Identity Scenario (Distinct Problem):**
      *   "Building this coal plant causes moderate warming in 2150, slightly reducing welfare for *specific* people alive then. Not building it (using renewables) avoids that warming but causes different economic conditions leading to *different specific people* being born (who are overall slightly better off). Can we say we harmed the *first* group by building the plant, if they only exist *because* we built it?" *This focuses on the identity of the specific individuals harmed, not a toggle in their fundamental ontological status.*

  **Why this Toggle is Problematic:**

  1.  **Intellectual Dishonesty:** It allows cherry-picking moral frameworks to avoid inconvenient obligations (high mitigation costs) while embracing frameworks that support desired actions (preserving heritage/nature, avoiding obvious blight).
  2.  **Exploits Ambiguity:** It leverages the genuine philosophical difficulty in conceptualizing future, non-existent people. Are they "potential persons," "inevitable persons," or something else?
  3.  **Undermines Coherent Policy:** It prevents the development of consistent, principled approaches to long-term challenges. Discounting based on time preference is fundamentally incompatible with strong duties based on the inherent moral patienthood of future individuals.
  4.  **Moral Arbitrariness:** It makes the moral weight of future people contingent on the *type* of harm or benefit being considered (economic welfare vs. catastrophic risk/preservation), rather than a consistent property *of the future people themselves*.

  **Conclusion:**

  You've identified a crucial flaw in much intergenerational rhetoric: the **Intergenerational Ontological-Temporal Toggle**. This is distinct from the Non-Identity Problem, which deals with harming specific individuals across different possible futures. The toggle exploits the ambiguity between future people as *abstract statistical entities* (for discounting welfare) and as *concrete moral patients* (for assigning blame/duty regarding suffering/preservation). Recognizing this toggle is essential for demanding consistent, principled reasoning about our obligations to the future. It highlights the need to explicitly defend one's underlying ontological view of future generations and apply it consistently across all intergenerational decisions.
