  Next, Dehaene's ignition and P3 wave. Dehaene's work with Stanislas emphasizes the global neuronal workspace, where ignition is a sudden, coordinated brain activity, and the P3b wave around 300ms is a marker. That part checks out. But Dehaene doesn't say consciousness happens only in prefrontal-parietal loops; it's a network involving fronto-parietal regions. The roommate might be oversimplifying the brain regions involved.

  Then, Block's overflow argument. The roommate claims Block based it on masked priming studies. But Block's main argument comes from Sperling's iconic memory experiments, where subjects see more than they can report. Masked priming shows subliminal processing, which Block uses for a different point. The roommate is conflating these. Block's key evidence is Sperling, not masked priming.

  The roommate says phenomenal and access consciousness are identical, and that dissolves the hard problem. But GWT, especially Dehaene's version, addresses access consciousness. Block argues phenomenal consciousness overflows access, so they're not identical. GWT doesn't claim to solve the hard problem; it's about access. The roommate is overreaching here.

