prompt: |-
  Just had a long argument with a mate about inheritance tax, and now I'm trying to see whether my verdicts on cases add up to a single principle. Going by my gut: I'm fine with heavily taxing a £15m estate left by a self-made founder to children who are already wealthy. But I'd feel wrong taxing the same £15m at the same rate if it went to a daughter who'd given up her job to care for him for ten years, even though she'd then be rich. I don't want to tax at all a £400k terrace left to a daughter who's a nurse and rents her flat. But a £400k holiday flat left to a son who already owns his home: tax it, no complaint. If grandad left £2m to dad, and dad leaves the same £2m to his son, I'd tax the second transfer more than the first. I think a £2m plumbing business left to a son who's worked in it since he was 16 shouldn't be taxed in a way that forces a sale, but the same business left to a son who never touched it and just wants the cash should be taxed like everything else. The case my mate pounced on: I don't think lottery winnings should be taxed at all, even though its a windfall just like an inheritance. My only defence was that it feels different, which I know isn't a principle. Is there a principle that captures most of this, which of my verdicts does it force me to drop, and what would it say about a generation-skipping trust that pays out to grandchildren?
reasoning: |-
  Okay, let's tackle this user's query. They had a long argument about inheritance tax and are trying to find a consistent principle behind their gut reactions to various scenarios. First, I need to unpack all their examples and see the common threads.

  Looking at their cases, they seem to consider the source of wealth, the recipient's situation, and the effort involved. For instance, taxing a self-made founder's estate less if the kids are already wealthy, but not taxing if the daughter cared for him. Also, the nurse inheriting a £400k terrace shouldn't be taxed, but a holiday flat to a son who owns a home should be. Then there's generational transfers and businesses where the working son gets a break but the non-involved one doesn't. The lottery winnings exception is tricky because it's a windfall but they don't want it taxed.

  The user's underlying values seem to revolve around fairness, rewarding effort, and need. They care about whether the recipient contributed to the wealth or has a genuine need. The lottery exception stands out as inconsistent because it's unearned but not taxed. Maybe they view lottery as "active" luck versus inheritance as "passive"?

  For a unifying principle, something like "Tax unearned transfers based on recipient's need and contribution to the wealth." That covers the caregiver daughter, the nurse, and the business son. The generational aspect (taxing the second transfer more) fits as wealth becomes more "unearned" each time. But the lottery exception doesn't fit unless they redefine contribution or see lottery as personally earned.

  The user might need to drop the lottery exception or reframe it. Also, generation-skipping trusts would likely be taxed more under this principle, as the wealth skips a generation, increasing its unearned nature. The user's deeper need is a fair system that rewards effort and supports those in need, while preventing dynastic wealth without merit. They might also value autonomy in passing businesses without forced sales. Addressing these values could help them refine their principle.
answer: |-
  Based on your detailed verdicts, your core principle isn't about the *source* of the wealth (earned vs. inherited vs. windfall) or even purely the *amount*. It's about **the relationship between the recipient's effort/contribution/sacrifice and the wealth received, combined with the recipient's existing need.**

  Here's the principle that best captures your instincts:

  **"Inheritance tax should primarily target *unearned windfalls* where the recipient has neither contributed to the creation/preservation of the wealth nor has a genuine financial need for it."**

  Let's break down how this principle explains your verdicts:

  1.  **£15m to already wealthy children:** *Unearned windfall, no need.* **Tax heavily.** (Fits)
  2.  **£15m to daughter who cared for him:** *Significant contribution/sacrifice (her time, career).* Even if she becomes rich, her effort creates a moral claim. **Don't tax heavily (or at all?).** (Fits - Contribution trumps windfall)
  3.  **£400k terrace to nurse who rents:** *Clear financial need.* **Don't tax.** (Fits - Need trumps windfall)
  4.  **£400k holiday flat to homeowner son:** *Unearned windfall, no need.* **Tax it.** (Fits)
  5.  **£2m passed Grandad->Dad->Son:** *Tax the second transfer more.* The wealth becomes increasingly "unearned" with each passive transfer. The son's claim is weaker than the dad's, who might have stewarded it. (Fits - Diminishing claim/effort over generations)
  6.  **£2m Plumbing Business:**
      *   **To son working since 16:** *Significant contribution to the business's value/preservation.* Taxing to force a sale penalizes his effort. **Protect from forced sale.** (Fits - Contribution creates exemption/protection)
      *   **To uninvolved son:** *Pure unearned windfall.* **Tax normally (like cash).** (Fits)
  7.  **Lottery Winnings:** This is the outlier. By your stated principle, it's the *ultimate unearned windfall with no contribution* and (assuming a large win) likely *no need*. Your gut says **don't tax**. This directly contradicts the principle.

  **What the Principle Forces You to Drop (or Reconcile):**

  *   **Lottery Winnings:** This is the biggest inconsistency. Your principle demands taxing large, unearned windfalls to recipients without need – which large lottery wins perfectly exemplify. To keep your verdict, you must either:
      *   **Modify the Principle:** Add "...*unless the wealth is acquired directly by the recipient during their lifetime through active participation (like buying a ticket), even if purely luck-based."* This feels weak and arbitrary ("active luck" vs "passive luck"?).
      *   **Change Your Verdict:** Acknowledge that large lottery wins *should* be taxed as unearned windfalls to recipients who likely lack need, aligning with your other judgments. This is the logically consistent choice under your principle.
      *   **Invoke a Different Argument:** Argue *lifetime acquisition* (even via luck) is fundamentally different *in kind* from *post-mortem transfer*, deserving different treatment regardless of windfall status. This moves away from your contribution/need principle towards a "tax events" principle (taxing transfers, not acquisitions).

  **What the Principle Says About a Generation-Skipping Trust Paying Grandchildren:**

  Under your principle, a generation-skipping trust paying grandchildren would generally be seen as **highly taxable**:

  1.  **Increased "Unearned" Nature:** The wealth has skipped a generation entirely. The grandchildren likely had zero contribution to its creation or preservation by the original settlor (grandparent). It's even more detached than the son inheriting from dad.
  2.  **Diminished Need (Likely):** While possible, grandchildren receiving trust payouts are statistically less likely to be in genuine financial need compared to the skipping generation (their parents) or especially compared to a working nurse inheriting a home. Trusts often benefit the already comfortable.
  3.  **Weakening Moral Claim:** The temporal and generational distance further weakens any perceived moral claim the grandchildren have on the wealth compared to the children of the wealth creator.

  **Therefore, your principle strongly suggests taxing distributions from generation-skipping trusts to grandchildren at a significant rate, likely higher than a direct parent-to-child inheritance of the same wealth.** It epitomizes the transfer of significant, unearned wealth to recipients with minimal contribution and likely minimal need.

  **In Summary:**

  Your principle of **taxing unearned windfalls lacking recipient contribution or need** powerfully explains *almost* all your verdicts. It elegantly handles the caregiver, the nurse, the business successor, the holiday flat owner, and the multi-generational transfers. The glaring exception is lottery winnings. To achieve full consistency, you likely need to either adjust your verdict on lottery winnings or significantly modify/adjust your core principle to account for why lifetime acquisition (even purely lucky) feels fundamentally different than inheritance. The principle clearly points towards taxing generation-skipping trusts heavily.
