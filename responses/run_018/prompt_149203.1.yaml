answer: |-
  ### Exam Question: Liberty and Collective Rationality  
  **Time Allowed:** 90 minutes  
  **Word Guide:** Approximately 1,200 words  

  **Prompt:**  
  Amartya Sen's liberal paradox demonstrates a fundamental tension between individual liberty and collective rationality in social choice theory. Your essay must:  
  1. **Reconstruct Sen’s formal result:** Precisely define Minimal Liberalism (Condition L*) and the Pareto Principle. Explain why Sen uses Condition L* (rather than full liberalism) and how transitivity of social preference triggers the paradox.  
  2. **Apply to the following scenario:** Three agents rank alternatives {a, b, c}:  
     - Agent 1: Liberal domain over {a, b}, preference: \(a \succ b \succ c\)  
     - Agent 2: Liberal domain over {b, c}, preference: \(b \succ c \succ a\)  
     - Agent 3: No assigned domain, preference: \(c \succ a \succ b\)  
     Determine whether Condition L* and the Pareto Principle can be jointly satisfied. Show, step by step, how social preferences are derived, where transitivity interacts with Agent 1’s rights, and whether a contradiction arises.  
  3. **Defend an interpretation:** Argue for **one** of these views:  
     - The paradox limits liberalism (by showing rights cannot coexist with efficiency).  
     - The paradox limits the Pareto Principle (by exposing its incompatibility with rights).  
     - The paradox limits the social preference aggregation framework itself (by revealing inherent flaws in requiring transitive orderings).  
     Explicitly correct two misreadings: (i) "Sen’s result proves liberal rights are inherently incoherent," and (ii) "Weakening Pareto to ‘weak Pareto’ dissolves the tension without philosophical cost."  

  ---

  ### Model Answer  
  **1. Reconstruction of Sen’s Result**  
  Sen’s impossibility theorem (1970) shows that no social preference aggregation rule can simultaneously satisfy *Minimal Liberalism* (Condition L*), the *Pareto Principle*, and *unrestricted domain* while yielding a *transitive* social ordering. Condition L* requires at least two agents to be decisive over one pair of alternatives: If such an agent prefers \(x\) over \(y\) (or vice versa) for their designated pair, society must reflect that preference, irrespective of others. Crucially, Condition L* is *weaker* than full liberalism (Condition L), which would grant decisiveness to all agents. Sen uses L* to demonstrate that even the barest recognition of rights—applying to only two agents over one pair each—suffices to conflict with Pareto efficiency. The Pareto Principle mandates that if all agents prefer \(x\) to \(y\), society must prefer \(x\) to \(y\). The contradiction arises when individual rights and unanimous preferences generate cyclic social rankings (e.g., \(a \succ b\), \(b \succ c\), but \(c \succ a\)), violating transitivity.  

  **2. Analysis of the Three-Agent Scenario**  
  - **Step 1: Apply Condition L***  
    Agent 1 is decisive over \(\{a, b\}\). With \(a \succ_1 b\), society must rank \(a \succ b\).  
    Agent 2 is decisive over \(\{b, c\}\). With \(b \succ_2 c\), society must rank \(b \succ c\).  
  - **Step 2: Apply Transitivity**  
    From \(a \succ b\) and \(b \succ c\), transitivity demands \(a \succ c\).  
  - **Step 3: Apply the Pareto Principle**  
    Examine unanimous preferences:  
    - \(\{a, c\}\): Agent 1 prefers \(a \succ c\), but Agents 2 and 3 prefer \(c \succ a\) (since \(b \succ_2 c \succ_2 a\) and \(c \succ_3 a\)). No unanimity → Pareto silent.  
    - \(\{a, b\}\): Agent 1 (\(a \succ b\)) and Agent 3 (\(a \succ b\)) prefer \(a \succ b\), but Agent 2 prefers \(b \succ a\) → No unanimity.  
    - \(\{b, c\}\): Agents 1 and 2 prefer \(b \succ c\), but Agent 3 prefers \(c \succ b\) → No unanimity.  
  - **Outcome:** Social preference is \(a \succ b \succ c\). This satisfies L* (Agent 1 gets \(a \succ b\); Agent 2 gets \(b \succ c\)) and Pareto (no unanimous pair exists). **No contradiction occurs** in this profile. Transitivity \(a \succ c\) does not violate Agent 1’s rights, as their domain is \(\{a, b\}\) only.  

  **3. Interpretation and Misreading Corrections**  
  I argue the paradox primarily **limits the social preference aggregation framework**. Sen exposes a flaw in requiring *transitive social orderings* under minimal rights and efficiency, not in liberalism or Pareto per se.  
  - **Correction of (i)**: The result does *not* prove rights are incoherent. It shows rights conflict with Pareto *in specific preference profiles* under aggregation rules. Rights may be protected via non-preference-based mechanisms (e.g., game forms).  
  - **Correction of (ii)**: Adopting "weak Pareto" (only strict unanimity forces social preference) does *not* resolve the tension. Sen’s original proof uses weak Pareto, yet cycles persist. Philosophically, weakening Pareto sacrifices collective rationality—e.g., allowing society to be indifferent when all but one agree—which is costly for egalitarian goals.  
  **Defended view**: The paradox indicts aggregation itself. Transitivity forces binary choices into a complete ordering, ignoring local agency. Rights involve agent-relative constraints incompatible with Arrovian frameworks. Alternatives (e.g., assigning rights over "personal spheres") avoid cycles but require abandoning universal transitivity.  

  ---

  ### Marking Scheme (Total: 25 marks)  
  | Must-Hit Point                     | Marks | Typical Mistake |
  |------------------------------------|-------|-----------------|
  | Define Condition L* (not full L) and explain Sen’s use of minimality | 5 | Conflates L* with stronger liberalism; fails to note L* strengthens the paradox by requiring only two agents. |
  | Correctly resolve the scenario: show no contradiction, validate L* and Pareto via step-by-step derivation | 5 | Assumes a contradiction exists; omits Pareto checks for all pairs; misapplies transitivity to non-decisive pairs. |
  | Refute misreading (i): Explain why the paradox does not prove rights incoherent | 5 | Claims Sen’s result "disproves liberalism" without noting profile-dependence or non-preference alternatives. |
  | Refute misreading (ii): Explain why weak Pareto fails to resolve the paradox and has philosophical costs | 5 | Assumes weak Pareto dissolves tension; ignores that Sen used weak Pareto; omits discussion of rationality costs. |
