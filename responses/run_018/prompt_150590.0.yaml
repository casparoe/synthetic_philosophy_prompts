answer: |-
  Your experience—watching a professional norm dissolve without fanfare—resonates deeply with the puzzle of moral change, and your colleague’s provocative slogan touches a nerve in moral philosophy. That line, "moral revolutions happen when practices become ridiculous, not when they’re refuted," is indeed elastic enough to hold several distinct theses, some banal, some contentious, all requiring careful disentanglement. Drawing on Williams’ insights about the historical contingency of ethical life and Appiah’s work on honor (particularly in *The Honor Code*), we can parse this slogan into four plausible readings, assessing their defensibility, relevance to cases like slavery or dueling, and potential conflation of correlation with causation.  

  The first reading is the *trivial sociological observation*: ridicule or social embarrassment often accompanies the decline of a practice, serving as a visible marker of shifting norms. This is almost platitudinous. Appiah’s analysis of dueling illustrates it perfectly—by the 19th century, dueling in Europe and America wasn’t primarily condemned as *immoral* by its critics but mocked as *absurd*, a comical relic unsuited to bourgeois life. Similarly, the collapse of your professional obligation may have been preceded by quiet snickers or eye-rolls framing it as outdated. This claim is defensible as description but explains little: ridicule is a symptom, not necessarily a cause. It doesn’t dismiss arguments; it merely notes that social emotion can outpace explicit debate. For slavery or dueling, it might explain *how* change gained momentum but not *why* the practice became laughable in the first place.  

  The second reading is the *stronger psychological-historical claim*: rational justifications for moral change are always *post hoc* rationalizations, never genuine catalysts. When your colleague dismisses philosophy’s role in abolishing slavery, this seems implied. But this is overstated and largely indefensible. Consider abolition: while economic shifts and slave revolts created conditions for change, philosophical arguments (from Quaker theology to Enlightenment critiques of natural rights violations) provided the vocabulary and legitimacy for activism decades before ridicule became widespread. Williams would caution here: while ethical concepts are historically embedded, reason isn’t merely epiphenomenal; it reshapes the "thick" concepts (like honor or piety) through which people experience value. Ridicule alone didn’t end dueling; it was the coupling of mockery *with* arguments that redefined honor—as Appiah shows—away from violent punctilio toward bourgeois integrity. To reduce this to "ridiculousness" ignores how arguments reconfigure the emotional landscape.  

  A third, *intermediate view*—more plausible and Williams-esque—suggests that thick ethical concepts (e.g., "honorable," "shameful") shift their emotional resonance *before* explicit arguments crystallize. Practices become "ridiculous" when the background web of meaning sustaining them frays, making them feel empty or dissonant. This isn’t ridicule as mockery but as a visceral sense of incongruity. In your profession’s case, the obligation may have felt increasingly "pointless" or "out of touch" long before anyone articulated why. For dueling, Appiah argues honor didn’t collapse under moral refutation but evaporated when elites no longer *felt* its force amid rising commercial values and state monopolies on violence. This view is substantive and defensible: social emotions anchor norms, and their transformation enables—even demands—new justifications. Yet it doesn’t negate argument; it relocates its role. Once dueling seemed ludicrous, *reasons* for its obsolescence (e.g., its inefficiency as conflict resolution) gained traction, accelerating its demise.  

  The fourth reading is the *radical materialist thesis*: material interests (economic, political) drive all normative change, with moral arguments—and even ridicule—being superficial byproducts. If "ridiculous" here masks underlying power shifts, this aligns with crude Marxist or Foucauldian analyses. For slavery, one might argue industrial capitalism made plantation slavery economically "irrational," with abolitionist rhetoric merely dressing self-interest in moral clothes. Williams would reject this as reductive: while material forces matter, moral concepts have their own logic and cannot be fully "explained away." Appiah’s honor-based analysis further undermines this; dueling faded not due to hidden material gains but shifting *intersubjective recognition* among elites. This reading confuses correlation (economic change coinciding with moral shifts) with causation and struggles to explain why some economically "irrational" practices persist (e.g., honor killings). It’s a substantive but largely false overreach.  

  **So, which readings hold water?** The trivial claim (ridicule accompanies change) is defensible but shallow—it doesn’t dismiss arguments; it contextualizes them. The radical materialist thesis is largely indefensible, mistaking necessary conditions for sufficient causes. The strongest contenders are the intermediate view and the overstated "post hoc" claim. The latter fails: ridicule without reasoned critique rarely suffices (imagine mocking slavery without invoking personhood or rights). But the intermediate view—that shifts in emotional resonance precede and enable argument—is both plausible and illuminating. For dueling, Appiah shows ridicule worked *because* honor’s meaning had already hollowed out; for slavery, philosophical arguments gained force once the practice *felt* incongruous with emerging ideals of human dignity. Your profession’s quiet shift may reflect a similar trajectory: the obligation became "ridiculous" because the lifeworld sustaining it had already crumbled.  

  Yet none of these readings fully dismiss the role of argument. Even if reasons follow shifting sentiments, they crystallize, generalize, and institutionalize change—turning unease into conviction, ridicule into policy. To ignore this is to confuse the spark of revolution with its engine. Philosophy may not ignite moral revolutions, but as Williams knew, it helps steer them.
