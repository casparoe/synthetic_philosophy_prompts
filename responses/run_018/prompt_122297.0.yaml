answer: |-
  Applying Dennett’s concept of the self as a "centre of narrative gravity" to the Billy Milligan trial illuminates the profound tension between psychological fragmentation and legal unity. Milligan’s diagnosed dissociative identity disorder presented the court with a radical challenge: two dozen distinct alters, each possessing its own apparent personality, memories, and agency. Through Dennett’s lens, we can view each alter not as a discrete soul or independent mind, but as a potent sub-narrative within Milligan’s overall psychological framework. Each alter—Arthur, the sophisticated Englishman; Ragen, the Yugoslavian militant; Adalana, the lesbian woman accused of the rapes—functioned as a local centre of narrative gravity, organizing specific experiences, drives, and behavioural patterns into a coherent-seeming "self" fragment. These sub-narratives competed for expression, generating the observed switches and amnesiac barriers.

  The legal system, however, demands a single centre of narrative gravity for the purpose of accountability. The person charged—Billy Milligan—had to be established as the overarching narrative capable of bearing responsibility. The defence strategy was essentially an attempt to persuade the court to accept the reality of these multiple, competing sub-narratives as the dominant explanatory framework, thereby dissolving the unified legal narrative into multiple, potentially non-responsible agents. The prosecution, conversely, sought to collapse the multiplicity back into a single accountable person, arguing the alters were either feigned or merely facets of one deceptive individual.

  Dennett’s heterophenomenological method becomes crucial here. This approach treats all first-person reports—including those from Arthur, Ragen, Adalana, and the others under hypnosis or during therapy—not as direct, infallible access to separate inner realities, but as *texts* to be interpreted. The jury was presented with a rich, heterophenomenological record: detailed narratives spoken from different "I" positions. Heterophenomenology allows us to take these reports seriously as data points without necessarily ontologically committing to the existence of two dozen independent minds. We interpret them as expressions emerging from Milligan’s complex cognitive architecture.

  This stance paradoxically both aids and undermines the defence. It aids by providing a rigorous framework for taking the alters' phenomenology seriously. The method validates the subjective reality of the experiences reported—the fear, the distinct memories, the sense of separate identity—as genuine phenomena requiring explanation, rather than dismissing them as mere lies. This lends scientific and philosophical weight to the defence's claim that Milligan’s behaviour wasn't under the control of a single, unified executive "self." However, heterophenomenology also undermines the defence's implicit ontology. By treating the alters' statements *as texts produced by one biological system*, it subtly reinforces the idea of an underlying unity. The method doesn't demand belief in multiple souls; it demands interpretation of the narratives generated by one organism. This interpretive stance makes it easier for the court to view the alters not as truly independent agents, but as fragmented expressions *of* Billy Milligan, the legal person. The very process of listening to and interpreting *all* the narratives from the *one* defendant on trial reinforces the singularity of the legal entity.

  The jury’s eventual acceptance of the insanity defence, finding Milligan not guilty by reason of insanity, represented a temporary, pragmatic acceptance of the multiplicity narrative *for the specific acts*. Legally, they acknowledged that the actions weren't attributable to the overarching "Billy Milligan" narrative in a responsible way at that moment. However, the court didn't fragment Milligan into two dozen legal persons. He was still treated as *one* person—Billy Milligan—who suffered from a severe mental illness affecting his responsibility. He was confined to psychiatric care, not released because "Adalana" was the guilty party who couldn't be prosecuted. The narrative gravity of the *legal subject* ultimately held, even while accommodating the fragmentation internally.

  The case powerfully demonstrates that the legal concept of responsibility *requires* a single centre of narrative gravity. Law operates on the fiction of the unitary, responsible agent. Dennett’s model explains *why* the system must collapse the alters back into Milligan: without a singular locus for praise, blame, punishment, or treatment, the legal framework collapses. The model breaks down, however, in fully accounting for the *depth* of the fragmentation observed. While Dennett’s view readily handles shifting narratives and distributed cognition, the profound amnesia, conflicting internal experiences, and apparent agency of alters like those in Milligan push the "useful fiction" concept to its limits. The sub-narratives weren't just different perspectives; they were often mutually exclusive and seemingly autonomous to an extraordinary degree. The Milligan case doesn't prove Dennett’s view *can't* deal with fragmentation – it provides a stark illustration of it – but it highlights the immense practical and conceptual strain such fragmentation places on systems demanding unity. It proves that *legal responsibility* necessitates one centre of gravity, even if the underlying psychological reality is far more complex and disjointed than Dennett’s metaphor might comfortably encompass. The fiction holds, but the narrative fractures run deep.
