answer: |-
  Your analysis captures a sophisticated and pervasive tension in welfare economics and decision theory. This pattern deserves a distinct label due to its specific structure and strategic function. I propose calling it **"Preference Dualism"** or **"Revealed Preference Ambiguity Maneuver"** (RPAM), with the following precise definition:

  ### Definition of Preference Dualism / RPAM
  *A dialectical strategy where a single theoretical framework (revealed preference theory) is used to assert two incompatible philosophical commitments regarding choice data:*
  1.  **Epistemic Deflation:** Utility/preference is *only* a mathematical representation of observed choices, devoid of inherent psychological or normative content. Claims about "true welfare" are incoherent.
  2.  **Normative Authorization:** Observed choices reveal authentic values/welfare, justifying interventions (e.g., correcting biases, welfare comparisons, policy optimization).

  *The strategy involves context-dependent switching between these stances to:*
  *   **Deflect Criticism:** Invoke Deflation when facing evidence of "irrational" choices (biases, mistakes, coercion).
  *   **Assert Authority:** Invoke Normative Authorization when deriving prescriptive conclusions (CBA, nudges, welfare rankings).
  *Crucially, the framework itself provides the ambiguous vocabulary ("preference," "utility," "reveals") enabling this switch without explicit equivocation on individual terms, while the underlying ontological commitment shifts fundamentally.*

  ### Distinguishing from Related Concepts
  1.  **Motte-and-Bailey:**
      *   *Difference:* M&B relies on a *hierarchy* – a defensible core (Motte) and an indefensible extension (Bailey). RPAM has *no hierarchy*; both stances are core, interdependent, and equally contentious. Neither is merely a retreat position; both are actively used offensively and defensively.
      *   *Analogy:* M&B is retreating to a castle keep. RPAM is switching between two equally fortified but mutually exclusive fortresses depending on the direction of attack.

  2.  **Conceptual Stretching:**
      *   *Difference:* Stretching involves expanding a concept's meaning beyond its original scope (e.g., "preference" to include subconscious impulses). RPAM doesn't necessarily stretch meanings; it uses the *same* terms ("choice reveals preference") to imply *different* ontological/normative foundations depending on context. The ambiguity is latent, not stretched.

  3.  **Ordinary Theoretical Pluralism:**
      *   *Difference:* Pluralism acknowledges distinct models for distinct purposes (e.g., descriptive vs. normative models). RPAM uses the *same* model/framework for *both* purposes *simultaneously within the same argumentative lineage*, denying the need for distinct models while functionally relying on their distinct implications. It obscures the pluralism it relies upon.

  4.  **Equivocation:**
      *   *Difference:* Equivocation is switching meanings of a *specific word* (e.g., "bank"). RPAM is subtler: the *words* ("choice," "preference," "utility") maintain a consistent *formal definition* (choice → preference), but their *interpretive weight* (epistemic vs. ontological/normative) shifts based on the stance taken. The framework's *overall meaning* changes, not individual dictionary definitions.

  ### Boundary Conditions: Legitimate Combination vs. Problematic RPAM
  A framework *legitimately* combines deflationary and normative uses when:

  1.  **Explicit Acknowledgment:** It openly states that choice data serves *different functions* (description vs. normative proxy) and distinguishes between them.
  2.  **Justified Bridge:** It provides a *defensible argument* for why choice data, despite being merely descriptive, is the *best available proxy* for normative concepts like welfare in specific contexts (e.g., respecting autonomy, avoiding paternalism, epistemic limitations). This bridge is scrutinizable.
  3.  **Contextual Delimitation:** It clearly specifies the conditions under which the normative inference is valid (e.g., "under full information and rationality") and acknowledges limitations.
  4.  **Meta-Theoretical Coherence:** It doesn't *simultaneously rely* on the deflationary stance to *deny the possibility* of the very normative concept it later invokes using the same data.

  **The pattern crosses into problematic RPAM when:**
  1.  **Implicit Switching:** The shift between stances is implicit, context-driven, and unacknowledged, serving argumentative convenience.
  2.  **Denial of Tension:** The framework/practitioner denies or obscures the inherent tension between the stances, presenting them as a unified whole.
  3.  **Self-Immunization:** The deflationary stance is used *specifically* to immunize the framework against counter-evidence (biases, mistakes), while the normative stance is used *specifically* to claim policy authority *derived from the same immunized data*.
  4.  **Lack of Bridge:** No robust argument connects the descriptive construct ("revealed preference") to the normative concept ("welfare") beyond the bare assertion that choice "reveals" it, especially when counter-evidence exists.
  5.  **Inconsistent Handling of Data:** Choice data is treated as *authoritative* for welfare when convenient (e.g., justifying a policy), but dismissed as *merely behavioral* when inconvenient (e.g., explaining self-harm).

  ### Why "Preference Dualism" / RPAM is the Correct Term
  *   **Dualism:** Captures the two incompatible foundational commitments (pure behaviorism vs. latent welfare revelation) coexisting within the same framework.
  *   **Ambiguity:** Highlights the role of the framework's inherent semantic flexibility in enabling the switch.
  *   **Maneuver:** Emphasizes the *strategic, dialectical* deployment to achieve argumentative goals (defense, authorization).
  *   **Revealed Preference:** Grounds it specifically in the context you describe.

  This pattern is a significant feature of modern microeconomics and behavioral welfare economics. Identifying it as Preference Dualism/RPAM provides a precise tool for critiquing arguments that leverage revealed preference theory's inherent ambiguity to avoid scrutiny while claiming substantive normative authority.
