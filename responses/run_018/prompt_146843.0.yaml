prompt: |-
  I just finished a long argument with a friend about whether virtue ethics survives the situationist critique. I want to defend a qualified version: virtues are not global, cross-situational traits but "ecologically embedded dispositions" that stabilize only within specific institutional and relational affordances — a surgeon's calm is real and excellent in the operating theater even if it vanishes in traffic, and moral training should therefore target contextual scaffolding rather than global self-cultivation. The view predicts domain-clustered moral behavior and denies that personality-level consistency is necessary for virtue.

  What would count against this position? I want the observations, arguments, formal results, or psychological findings that should actually move me, sorted by decisiveness — including whether documented failures of domain-clustering exist, whether the view collapses into situationism with extra vocabulary, and whether it has been qualified into unfalsifiability. Please say what defenders of this ecological-disposition account would themselves concede as damaging, not only what critics assert. Distinguish evidence that would be merely awkward from evidence that would be decisive, and tell me whether being well-insulated is itself a problem for a view of this kind.

  Please conclude with a fixed, extractable line: Verdict: [brief phrase stating whether the position is well-insulated and whether that undermines it].
reasoning: |-
  Okay, the user is diving deep into virtue ethics and the situationist critique. They've had a long argument with a friend and are defending a nuanced position where virtues are context-dependent, "ecologically embedded dispositions." They want to know what could potentially counter this view, with a focus on evidence that would genuinely challenge it, not just what critics say. They're asking for different levels of evidence, from awkward to decisive, and whether the view is unfalsifiable or collapses into situationism.

  First, I need to understand their position clearly. They're arguing that virtues aren't global traits but are tied to specific contexts—like a surgeon's calm in the operating room but not in traffic. Moral training should focus on building the right environments rather than cultivating global traits. The view predicts domain-clustered behavior and rejects the need for cross-situational consistency.

  Now, the user wants counterarguments. I should consider psychological studies that show inconsistent behavior even within similar contexts. For example, if someone is honest at work but not in other professional settings, that could challenge the idea of domain-clustering. Also, if virtues require some cross-context stability, like in personal relationships, that might be a problem. If the theory becomes too vague, it might not be testable, making it unfalsifiable—that's a big issue in science.

  The user also asks what defenders would concede as damaging. So I need to think from both sides. Defenders might admit that if clustering fails within contexts they defined, that's a problem. Or if scaffolding can't be reliably built, that undermines their training approach. Also, if the theory is indistinguishable from situationism, that's a major concern.

  I should categorize evidence by decisiveness. Weak evidence might be occasional inconsistencies, which can be explained away. Strong evidence would be systematic failures of clustering or evidence that virtues require broader consistency. Decisive would be if no context allows stable dispositions or if the theory can't make testable predictions.

  The user wants a verdict on whether the position is well-insulated and if that undermines it. If the theory can explain away any counterevidence by adjusting context definitions, it might be insulated but unfalsifiable, which is bad. But if it can make specific predictions and some evidence would genuinely falsify it, then it's robust.

  I recall studies like the Milgram experiment where situational pressures override dispositions. If even in controlled environments people act against virtues, that's a challenge. Also, personality research showing that some traits do have cross-situational consistency might contradict the rejection of global traits.

  Need to check if there's empirical data on domain-clustering failures. For instance, Hartshorne and May's honesty studies showed low cross-situational consistency, but maybe within domains like school vs. home. If newer studies show inconsistency even within a single domain, that's problematic.

  Also, philosophical arguments: if virtues require identity-level consistency, then context-bound traits might not count as virtues. Defenders might counter that virtues are role-specific, but critics like Doris would say that's not real virtue.

  In conclusion, the position can be insulated to some extent but risks unfalsifiability if contexts are too flexible. The decisive evidence would be consistent failures of clustering within defined contexts or the inability to build effective scaffolding. The verdict should reflect that it's moderately insulated but not fatally so, provided it makes testable claims.
answer: |-
  Here's a breakdown of potential challenges to your ecological-disposition account of virtue, sorted by decisiveness and incorporating defender concessions:

  **Decisive Counterevidence (Would Force Significant Revision or Abandonment):**
  1.  **Systematic Failure of Domain-Clustering:** Evidence demonstrating that morally relevant behavior *consistently fails to cluster even within well-defined, contextually stable domains* (e.g., a surgeon exhibits calm/competence in *some* ORs/surgeries but not others of the same type, with no clear ecological predictor; documented patterns of "honesty" varying wildly *within* professional contexts like academia or law beyond situational triggers).
      *   *Why Decisive:* Directly falsifies the core prediction. Defenders would concede this fundamentally undermines the claim that stable dispositions emerge within specific affordances. If dispositions don't stabilize *anywhere* predictably, the account collapses.
      *   *Evidence Status:* This is the critical test. While some inconsistency exists, robust findings of *utter failure* of clustering within tightly defined, ecologically valid domains are less common and would be devastating.

  2.  **Impossibility of Contextual Scaffolding:** Evidence that attempts to build or manipulate "institutional and relational affordances" to cultivate virtues consistently fail *because the context itself cannot sufficiently override individual differences or other situational pressures*.
      *   *Why Decisive:* If moral training targeting scaffolding doesn't reliably produce stable contextual virtues, the practical core of the view (and its advantage over traditional cultivation) vanishes.
      *   *Evidence Status:* Strong situationist findings (e.g., Milgram, Zimbardo) suggest powerful, often negative, situational overrides. If positive scaffolding proves equally difficult to build *effectively* for virtue (despite effort), it's fatal. Defenders concede this would negate the view's prescriptive relevance.

  3.  **Collapse into Trivial Situationism:** Demonstration that the "ecologically embedded dispositions" are indistinguishable from predictable situation-behavior links *without any internal dispositional component*. If behavior is *entirely* explained by immediate cues within the affordance, the "disposition" adds nothing.
      *   *Why Decisive:* The view explicitly posits a *disposition* – a stable readiness within the context. If it's just situation S reliably causes behavior B, it *is* situationism relabeled. Defenders would concede this guts the core concept of virtue as a character state.
      *   *Evidence Status:* If neuroscience/psychology finds no evidence of *stabilized* neural/cognitive patterns associated with specific affordances (just immediate reactivity), this becomes decisive.

  **Strongly Damaging Evidence (Forces Major Qualification or Weakens Appeal):**
  4.  **Lack of Transfer When Contexts Overlap/Are Analogous:** Evidence that virtues within one affordance show *no transfer* to highly similar or logically analogous contexts (e.g., a surgeon's "calm competence" vanishes in an ER setting, or when leading a high-stakes non-surgical team project). This questions the "disposition" part.
      *   *Why Damaging:* Challenges the stability and robustness of the disposition even *within* its ecological niche and suggests it's merely a highly specific habit. Defenders would concede this weakens the case for calling it a "virtue" (implying some generalization) and requires stricter niche definitions.
      *   *Evidence Status:* Common in psychology (e.g., domain-specific expertise failing to transfer). Awkward, but defenders could argue the contexts *aren't* analogous enough ecologically.

  5.  **Virtues Require Identity-Level Consistency:** Persuasive philosophical argument that true virtue *must* involve some core stability of character/identity that expresses *across* significant life domains (e.g., integrity, courage in facing fundamental fears). Contextual virtues might then seem like mere professional skills, not moral excellence.
      *   *Why Damaging:* Directly attacks the view's denial that personality-level consistency is necessary. Defenders would concede this is a major theoretical challenge from rival virtue ethics, forcing them to argue why such consistency is *not* essential for moral worth.
      *   *Evidence Status:* Philosophical, not empirical. Deep challenge to the view's moral ontology.

  **Awkward Evidence (Requires Explanation But Not Fatal):**
  6.  **Presence of Some Cross-Situational Consistency:** Evidence that *some* individuals *do* exhibit moderate cross-situational behavioral consistency in morally relevant traits (e.g., Big Five Agreeableness correlating with prosocial behavior across contexts).
      *   *Why Awkward:* Contradicts the strong denial of *necessary* cross-situational consistency. Defenders would concede this exists but argue it's: a) less common than assumed, b) often explained by consistent affordances or niche selection, c) not *required* for contextual virtues to be real and excellent. It doesn't falsify the core claim.
  7.  **Situationist Experiments Showing Context Sensitivity:** Classic findings (e.g., Darley & Batson's Good Samaritan, Milgram) showing dramatic behavioral shifts based on subtle cues, even in seemingly relevant contexts.
      *   *Why Awkward:* Highlights the power of immediate situations *within* affordances. Defenders would argue this shows *why* virtues are ecological and fragile, not global. It demonstrates the *need* for their view but requires explaining how dispositions stabilize *despite* such pressures in well-scaffolded contexts.

  **Risk of Unfalsifiability & Insulation:**
  *   **Problem:** If "specific institutional and relational affordances" can be defined *post-hoc* or made arbitrarily granular ("Traffic Virtue," "OR Virtue #3"), the view risks becoming unfalsifiable. Any failure of consistency can be explained away by redefining the context or claiming the affordance wasn't properly instantiated.
  *   **Defender Concession:** Defenders *must* concede this is a major risk. They must provide **clear, pre-definable criteria** for what constitutes a distinct, virtue-supporting ecological niche/affordance (e.g., specific role expectations, physical/environmental cues, relational structures, reward systems). Without this, the view is insulated to the point of vacuity.
  *   **Is Insulation Undermining?** Yes, **if it leads to unfalsifiability**. A well-insulated theory that makes clear, testable predictions about clustering *within pre-defined contexts* and scaffold-building efficacy is strong. A theory that constantly redefines "context" to avoid counter-evidence is unscientific and philosophically weak. Your view's viability hinges critically on **operationalizing "ecological affordance" rigorously and testably**.

  **Verdict:** **Moderately insulated but vulnerable; insulation becomes fatal only if affordances are not rigorously defined and testable.** The core claims *are* empirically testable (clustering within contexts, efficacy of scaffolding) and philosophically coherent, protecting it from easy dismissal. However, its strength depends entirely on avoiding ad-hoc redefinitions of context that render it unfalsifiable. Decisive counter-evidence exists in principle (systematic clustering failure, scaffolding impossibility, collapse into situationism).
