answer: |-
  ### Exam Question (75 minutes; target 700 words)  
  **Quantum Deference and the Observing Self**  
  In Everettian quantum mechanics, an agent knows the exact global wavefunction describing a branching multiverse. For an upcoming spin measurement, she knows the objective branch weights are 90% for outcome A and 10% for outcome B. She also knows her mental state is duplicated across branches: 90% of her future selves observe A, while 10% observe B. After the measurement, *she herself* observes outcome B.  

  Assess whether the Principal Principle requires her to assign a credence of 0.9 to A at this moment, given her total evidence. If not, does her centered evidence ("I observe B") block deference to the objective branch weight without rendering the Principal Principle vacuously inapplicable? Finally, can rational credence remain unique in such scenarios?  

  *Ground your analysis in formal epistemology, explicitly addressing:  
  (i) The distinction between branch weight as metaphysical chance and first-person epistemic access;  
  (ii) Whether self-locating evidence is "inadmissible" under the Principal Principle;  
  (iii) The viability of non-vacuous deference to chance in branching worlds.*  

  ---

  ### Model Answer (Excerpted Key Moves)  
  The agent’s predicament exposes a tension between the Principal Principle’s demand for deference to objective chance (here, branch weights) and the incorrigible first-person evidence of her observation. While branch weights (90% A, 10% B) are objective chances governing branch proportions metaphysically, her *epistemic situation* is indexical: she knows she is *located* on a B-world branch. This centered evidence ("I see B") is inadmissible in a novel sense—not by violating temporal or causal constraints, but by fixing her self-location in the multiverse.  

  Deference to the 90% branch weight for A *cannot* require credence 0.9 in A post-observation. To assign high credence to A while seeing B would defy epistemic rationality (e.g., Moorean paradox: "A probably occurred, but I observe not-A"). The Principal Principle survives not through vacuity but via *conditionalization*: pre-measurement, she *should* assign credence 0.9 to "a future self observes A." Post-observation, her credence shifts to 1.0 for B upon gaining the indexical fact. This blocks unconditional deference without abandoning chance’s authority, as branch weights still constrain her pre-observation doxastic state.  

  Uniqueness of rational credence *fractures* here. Subjective Bayesians might argue that agent-relative indexical evidence permits varying prior weightings of self-locating propositions (e.g., the 1/10 vs. 90/10 weight debate in Elga 2004). However, objectivists can salvage uniqueness by treating branch weights as indexing *objective evidential probabilities* for centered propositions. Either way, the Principal Principle is qualified: it governs *impersonal* chance propositions, but self-location requires centering the evidence.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **A Answer (17–20):** Distinguishes metaphysics/epistemology, confronts indexicality, evaluates PP’s survival non-vacuously.  
  **B Answer (12–16):** Accurately explains deference to chance but misses centered evidence implications.  

  | **Move**                                                                                                | **Marks** | **Characteristic Mistake**                                  |  
  |---------------------------------------------------------------------------------------------------------|-----------|-------------------------------------------------------------|  
  | **1. Identifies indexical challenge:** Explicitly contrasts third-person branch weights with first-person observation ("I see B"). | 4 | Mistake: Treating "I see B" as irrelevant to chance deference. |  
  | **2. Distinguishes metaphysics/epistemology:** Separates objective branch weight (metaphysical chance) from the agent’s epistemic access via self-location. | 5 | Mistake: Conflating branch proportion with epistemic justification for credence. |  
  | **3. Evaluates PP survival:** Argues whether self-location blocks deference *without vacuity* (e.g., via conditionalization). | 5 | Mistake: Claiming PP is "suspended" entirely or applies vacuously post-observation. |  
  | **4. Addresses uniqueness:** Discusses whether rational credence remains unique given indexical evidence (e.g., subjective vs. objective treatments). | 3 | Mistake: Asserting uniqueness without engaging indexical relativity. |  
  | **5. Formal precision/clarity:** Uses probabilistic notation (e.g., *Cr(A | chance(A)=0.9 ∧ "I see B")*), avoids ambiguity, structured argument. | 3 | Mistake: Informal restatement of PP without modeling evidence. |  

  **Confidence Assessment:**  
  - High confidence in moves 1–3 (core tension); moderate in move 4 (uniqueness debates are unresolved).  
  - **Least confident criterion:** Move 5’s mark allocation—word limits may force trade-offs between technical rigor and conceptual depth.  

  \answer{The crux is whether centered-world self-location can block deference to objective chance without collapsing the Principal Principle into incoherence.}
