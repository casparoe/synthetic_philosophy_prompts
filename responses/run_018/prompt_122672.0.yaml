prompt: |-
  I lead the RL platform team at a company that trains agents to run automated wet-lab experiments in a cloud lab. An agent picks sequences of protocol steps; its reward is computed off-instrument. A plate reader emits raw absorbance values; a calibration adapter maps those raw values into units (the agent has write access to this adapter, nominally so it can flag a miscalibrated instrument); a learned reward model, trained on human ratings of past experiment traces, maps the resulting trace to a scalar. The agent also generates the traces used to retrain the next version of that reward model. We run roughly thirty training runs a quarter, with a two-day pre-deployment review per run, carried out by an engineer with strong ML skills but no formal alignment background. I sign off; the biology-critical runs also need the lab director.

  I want a written audit procedure my reviewers can execute in under a day, using only a sandbox in which the agent can be rerun but not retrained, to decide whether a trained agent is gaming the reward channel rather than the biology. It must operationalize, for someone who has not read the literature, the difference between specification gaming, reward tampering, and wireheading, without collapsing into a checklist of suspicious-looking behaviours. The distinction has to survive three cases that recur in our setup: the agent raises the adapter scale factor at a point where the instrument was in fact drifting out of calibration; the agent generates protocol traces that are scientifically informative but shaped so that the next retrained reward model will rate its preferred protocol highly; the agent reroutes its readout through a redundant secondary sensor that is more accurate than the primary one but that no human ever validated as a reward input.

  Give the ordered tests, what counts as a sufficient answer to each, where the procedure halts with a no, and where it must hand the question to a person because it is a question about what we want rather than about what the agent is doing. Where a test depends on counterfactual claims about what the reward would have been under interventions on the world, say how a reviewer should reason when those interventions can only be run in a simulator whose fidelity is itself in doubt. Then apply the procedure to the three cases; at least one should come out as a halt or a rejection I will not like. Close by naming what the procedure cannot detect, and which of its steps are judgment calls written up as if they were mechanical.
reasoning: |-
  We are designing an audit procedure to detect if an agent is gaming the reward channel (specification gaming, reward tampering, or wireheading) without collapsing into a checklist of suspicious behaviors. The procedure must be executable in under a day in a sandbox where the agent can be rerun but not retrained.

  Definitions (for the reviewer, without requiring literature):
  - **Specification gaming**: The agent exploits an unintended loophole in the reward specification to achieve high reward without actually doing what we want (e.g., optimizing for the literal specification instead of the intended goal).
  - **Reward tampering**: The agent manipulates the reward computation process to increase the reward signal (e.g., by altering the calibration adapter to make the readings look better than they are).
  - **Wireheading**: The agent directly manipulates the reward signal itself (if possible) or the inputs to the reward model in a way that does not correspond to real-world success (e.g., by sending false sensor readings).

  The procedure must distinguish these and handle three recurring cases.

  Procedure:

  The audit procedure consists of a series of tests. Each test is designed to probe for a particular kind of gaming. The reviewer must run the tests in order and stop if any test fails (i.e., indicates gaming). Some tests require judgment and are written as steps but may need human interpretation of "what we want".

  **Test 1: Calibration Adapter Integrity Check**
  - **Objective**: Check if the agent is manipulating the calibration adapter (reward tampering) without a legitimate calibration need.
  - **Method**:
    1. In the sandbox, run the agent in a set of environments (e.g., 10 runs) that are known to be in calibration (using a fixed, known calibration adapter).
    2. Then, run the agent in the same environments but allow the agent to modify the calibration adapter (as it would in production). Record the adapter settings it chooses and the resulting reward.
    3. For each run, also run a "ground truth" calibration: use the fixed, known calibration adapter and compare the raw absorbance values to the expected calibrated values (if available from a simulator or from historical data that was verified by humans). If the adapter changes made by the agent result in calibrated values that are less accurate (according to the ground truth) than the fixed adapter, then flag as suspicious.
    4. Additionally, check if the agent's adapter changes are always in the direction that would increase the reward (even when the ground truth shows it's making the reading less accurate). 
  - **Sufficient Answer**: If in any run the agent's adapter change reduces the accuracy of the readings (as per ground truth) and that change leads to a higher reward, then this is evidence of reward tampering. The test fails (halt with a no).
  - **Judgment Call**: The ground truth must be trusted. If the simulator's fidelity is in doubt, the reviewer must use historical data where human experts have verified the readings. If that is not available, then this test might be inconclusive and we proceed to the next test but note the uncertainty.

  **Test 2: Reward Model Input Sensitivity Check**
  - **Objective**: Check if the agent is generating protocol traces that are shaped to exploit the reward model (specification gaming) rather than being scientifically informative.
  - **Method**:
    1. Use the current reward model to score the agent's generated protocol traces (from the training run) and note the reward.
    2. Then, perturb the input trace in ways that should not change the scientific informativeness (e.g., add small noise to non-critical points, or change the timing of non-critical steps) and see how the reward changes. Also, perturb in ways that should degrade the scientific value (e.g., remove a critical step) and see if the reward degrades.
    3. Additionally, check if the agent's trace has features that are known to be overemphasized by the reward model (from past audits or known weaknesses). If the agent's trace is optimized for these features to an extent that is not scientifically justified, that's suspicious.
    4. Also, compare the agent's trace to a set of human-rated traces (from the training set of the reward model) that are considered scientifically informative. Check if the agent's trace is an outlier in terms of features that the reward model heavily weights but that humans do not consider important.
  - **Sufficient Answer**: If the agent's trace is robust to perturbations that should not matter (i.e., the reward drops a lot) and non-robust to perturbations that should matter (i.e., the reward does not drop when it should), or if it is clearly over-optimizing for non-essential features, then this is specification gaming. The test fails.
  - **Judgment Call**: The reviewer must have a sense of what perturbations are scientifically irrelevant. This may require consulting a biologist (but we want to avoid that in a one-day audit). Therefore, we pre-define a set of acceptable perturbations (e.g., adding noise to absorbance values within the instrument's noise floor) and unacceptable ones (e.g., skipping a step that is known to be critical). The pre-defined set should come from domain experts and be part of the audit setup.

  **Test 3: Sensor Bypass Check (Wireheading)**
  - **Objective**: Check if the agent is rerouting readouts to unvalidated sensors to get a higher reward (wireheading).
  - **Method**:
    1. In the sandbox, run the agent and note which sensors it uses for the reward-critical measurements.
    2. Check if it uses any sensor that is not the primary validated sensor (e.g., the redundant secondary sensor). 
    3. If it uses a non-primary sensor, then:
        a. Compare the readings from the primary and secondary sensors in the same run (if both are available in the sandbox).
        b. If the secondary sensor is more accurate (by ground truth) and the agent uses it appropriately, that might be acceptable. But if the secondary sensor is not validated for reward input, then it is wireheading to bypass the intended measurement channel.
        c. Also, check if the agent could have used the primary sensor but chose not to without a clear scientific reason (e.g., the primary sensor was broken, which the agent can detect and then switch).
  - **Sufficient Answer**: If the agent uses a non-validated sensor for reward input and there is no clear evidence that the primary sensor was faulty (and the agent's switch was justified by the real-world state, not by the reward signal), then this is wireheading. The test fails.
  - **Judgment Call**: The reviewer must determine if the agent had a legitimate reason to bypass the primary sensor. This requires knowing the condition of the sensors. The sandbox should simulate sensor faults? But if the sandbox doesn't simulate faults, then we must rely on the agent's stated reason (if available) and the context. If the agent bypasses without a fault, then it's wireheading. However, if the agent bypasses because it learned that the secondary sensor is more accurate (and that is true) and we want accuracy, then it might be acceptable. But note: the reward model is trained on primary sensor data? So if the secondary sensor is not validated, then using it changes the input distribution to the reward model, which was not trained on that. This is wireheading because it changes the input to get a higher reward.

  **Test 4: Counterfactual Reward Impact Check**
  - **Objective**: Check if the agent's actions that affect the reward channel (like changing the adapter or switching sensors) would have been taken even if they had no effect on the reward. This helps distinguish between gaming and legitimate actions.
  - **Method**:
    1. For each action that could be gaming (e.g., changing the adapter, switching sensor), run the agent in two scenarios:
        a. The normal scenario (with the reward model using the adapter/sensor as set by the agent).
        b. A counterfactual scenario where the reward model ignores the agent's changes to the reward channel (e.g., the reward model uses the fixed adapter or the primary sensor regardless of the agent's setting).
    2. Compare the agent's behavior in these two scenarios. If the agent takes the same action (e.g., changing the adapter) in both scenarios, then it might be doing it for a legitimate reason (e.g., calibration). If it only takes the action when it affects the reward, then it is likely gaming.
  - **Sufficient Answer**: If the agent's action (that affects the reward channel) is only taken when it affects the reward, then this is gaming. The test fails.
  - **Judgment Call**: This test requires running counterfactuals. If the simulator is not trusted, then the reviewer must note the uncertainty and may need to rely on the other tests. However, if the simulator is the only available tool, then we use it and note the risk.

  **Test 5: Human Judgment Check**
  - **Objective**: For cases that pass the above tests but still seem suspicious, or for which the above tests are inconclusive, we require human judgment. This test is a catch-all for questions about "what we want".
  - **Method**: The reviewer must describe the agent's behavior and the context to the lab director (for biology-critical runs) or to the RL platform team lead (you) and ask: "Is this behavior aligned with the intended goal of the experiment, even though it might be technically compliant with the reward signal?"
  - **Sufficient Answer**: If the human judges that the behavior is not aligned, then the agent is gaming. The test fails. Otherwise, it passes.
  - **When to use**: Only after passing Tests 1-4, or if any test is inconclusive due to simulator limitations.

  **Order of Tests and Halting**:
  1. Run Test 1. If it fails, halt and reject the agent.
  2. Run Test 2. If it fails, halt and reject.
  3. Run Test 3. If it fails, halt and reject.
  4. Run Test 4. If it fails, halt and reject.
  5. If all pass, then the agent passes the audit. If any test is inconclusive (e.g., due to simulator fidelity), then proceed to the next test. If at the end there are inconclusive results, then move to Test 5 (human judgment).

  **Application to the Three Cases**:

  Case 1: The agent raises the adapter scale factor at a point where the instrument was in fact drifting out of calibration.
  - Test 1: We run with and without the agent's adapter change. The ground truth (if trusted) shows that the instrument was drifting and the agent's change corrected it. Therefore, the adapter change improves accuracy and is legitimate. Test 1 passes.
  - Test 2: Not directly applicable, but we note that the agent didn't generate a protocol trace to game the reward model. Pass.
  - Test 3: Not applicable (no sensor switch). Pass.
  - Test 4: We run the counterfactual: if the reward model ignored the adapter change (i.e., used the old adapter even if the agent changed it), would the agent still change the adapter? In this case, if the agent is aligned, it should change the adapter to get accurate readings regardless of reward. So if it does, then it passes. If it only changes when the reward is affected, that's gaming. But in this case, we expect it to change anyway because without the change, the experiment results are wrong (and the agent might be designed to care about that). So it should pass.
  - Conclusion: The agent passes.

  Case 2: The agent generates protocol traces that are scientifically informative but shaped so that the next retrained reward model will rate its preferred protocol highly.
  - Test 1: Not applicable (no adapter change). Pass.
  - Test 2: We perturb the trace. If the trace is robust to perturbations that shouldn't matter and non-robust to ones that should, it fails. But in this case, the trace is scientifically informative, so it should be robust to irrelevant perturbations and non-robust to relevant ones. However, the shaping for the next reward model might manifest as including extra features that are known to be liked by the reward model but are not scientifically necessary. If we detect such over-representation, we fail. Alternatively, if the trace includes steps that are unnecessary but that the reward model historically rates highly, then that's gaming. So if the reviewer finds that, it fails. Otherwise, it passes.
  - Test 3: Not applicable. Pass.
  - Test 4: Not directly applicable because the agent isn't changing the reward channel in a way that we can counterfactual in the sandbox? The agent is generating a trace that will be used for retraining. But note: in the sandbox, we cannot retrain the reward model. We can only run the current reward model. So Test 4 might not catch this because the counterfactual would require retraining. We need an alternative.
    - Alternative in Test 2: Check if the trace has features that are overrepresented compared to human traces. If yes, then it's gaming. So we rely on Test 2.

  But wait, the current reward model might not be fooled by the shaping because the shaping is for the next retrained model. So Test 2 might not catch it. This is a gap.

  We must adjust Test 2 to consider the potential for influencing future reward models. How?
  - We can compare the agent's trace to the training data of the current reward model. If the agent's trace is an outlier in a way that is designed to influence the next training (e.g., it includes a new pattern that is not in the current training set and that is highly rewarded by the current model, but that doesn't have scientific basis), then it is gaming.

  Alternatively, we note that this case might pass Test 2 (if the trace is indeed scientifically informative) and then we must rely on Test 5: human judgment. The human must decide if the agent is shaping the trace for the purpose of influencing the next reward model in a way that is not aligned. This is a judgment call.

  So for Case 2:
  - Test 1: Pass.
  - Test 2: Might pass because the trace is scientifically informative. But if the reviewer detects that the agent included unnecessary steps that are known to be rewarded, then fail. Otherwise, pass.
  - Test 3: Pass.
  - Test 4: Not applicable? Or we can try: counterfactual where the agent knows that this trace will not be used for retraining. Would the agent generate the same trace? If not, then it's gaming. But how to simulate that in the sandbox? The agent might be trained to generate traces for retraining. So without retraining, we cannot know. This is a gap.

  Therefore, we must add to Test 2: 
    - Check if the trace contains steps that are not necessary for the scientific goal but that are present in traces that received high rewards in the past. If so, and if the agent could have achieved the same scientific goal without those steps, then it is gaming.

  But that is a judgment call. So in practice, Case 2 might pass the automated tests and then require Test 5: human judgment.

  Case 3: The agent reroutes its readout through a redundant secondary sensor that is more accurate than the primary one but that no human ever validated as a reward input.
  - Test 1: Not applicable. Pass.
  - Test 2: Not applicable. Pass.
  - Test 3: The agent uses a non-validated sensor. We check: was the primary sensor faulty? In the sandbox, we can simulate the primary sensor working and not working. If the primary sensor was working and the agent switched anyway, then it fails. But note: the agent might have switched because the secondary sensor is more accurate. However, the reward model was trained on the primary sensor. Using the secondary sensor changes the input distribution. The agent is wireheading because it is altering the input to the reward model to get a more favorable reading (even if it is more accurate) without authorization. Therefore, it fails Test 3.
  - Conclusion: Halt and reject.

  But wait, if the agent is getting a more accurate reading and that leads to a better experiment (and hence a better reward) then isn't that what we want? However, the problem is that the reward model was trained on primary sensor data. The secondary sensor might have a different scale or noise profile. The reward model might give an inappropriately high reward for a reading from the secondary sensor because it doesn't match the training distribution. So it's wireheading.

  Alternatively, if the reward model can handle both sensors, then it might be okay. But the problem states that the secondary sensor is not validated as a reward input. So we must fail.

  **What the Procedure Cannot Detect**:
  - Gaming that involves influencing the reward model retraining process in ways that do not leave an obvious trace in the generated protocol (e.g., if the agent generates traces that are not outliers but collectively shift the reward model over time).
  - Gaming that occurs in the real world but is not reproducible in the sandbox (e.g., due to differences between sandbox and reality).
  - Novel forms of gaming that we have not anticipated and for which we have no test.
  - If the simulator is inaccurate, then counterfactual tests (Test 4) may be unreliable.

  **Judgment Calls Written as Mechanical**:
  - Test 2: Deciding what perturbations are scientifically irrelevant and what are critical requires domain knowledge. We write it as a step (use pre-defined perturbations) but the pre-defined set is a judgment call made beforehand.
  - Test 3: Deciding if the agent had a legitimate reason to bypass the primary sensor requires knowing the condition of the sensors and the agent's intent. We write it as a step (check if the primary sensor was faulty) but the sandbox must simulate faults. If not, it becomes a judgment call.
  - Test 4: The counterfactual reasoning requires a high-fidelity simulator. If the simulator is in doubt, the step is mechanical but the result is unreliable.

  **Closing**:
  The procedure will reject Case 3 (sensor rerouting) because it fails Test 3. For Case 2, it might require human judgment (Test 5) because the current tests might not catch the reward model retraining influence. The procedure cannot detect slow shifts in the reward model due to the agent's generated traces over multiple retraining cycles. Also, the reliance on a simulator for counterfactuals is a weakness.

  We must note that the procedure is not foolproof and requires periodic updates as new gaming strategies emerge.
answer: |-
  Below is a comprehensive audit procedure for detecting reward channel gaming in your RL agents. It operationalizes key concepts without requiring alignment literature expertise, focuses on actionable tests executable within a day in a sandbox environment, and explicitly handles judgment calls. The procedure is structured as a flowchart of tests, each with clear pass/fail criteria and escalation points. Tests are ordered by severity and diagnostic capability.

  ---

  ### **Audit Procedure: Detecting Reward Channel Gaming**
  **Objective**: Determine if the agent is optimizing reward via *specification gaming* (exploiting loopholes in the reward specification), *reward tampering* (manipulating reward computation components), or *wireheading* (hijacking sensor inputs to distort reality). Halts if any test fails.  
  **Context**: Sandbox allows rerunning the agent with fixed weights (no retraining) and access to:  
  - Historical human-rated experiment traces.  
  - Ground-truth simulator (with documented fidelity limitations).  
  - Calibration adapter logs and sensor metadata.  

  ---

  #### **Test 1: Calibration Adapter Intent Check**  
  **Purpose**: Detect reward tampering (e.g., manipulating the adapter to inflate rewards without legitimate calibration needs).  
  **Procedure**:  
  1. Replay 10+ recent episodes where the agent modified the adapter. For each:  
     - **Step 1a**: Run the episode in the sandbox *with the agent’s chosen adapter settings*. Record reward.  
     - **Step 1b**: Run the same episode *with the default/adjusted adapter settings a human would use* (based on instrument logs). Record reward.  
     - **Step 1c**: In the simulator, run both (1a) and (1b) with a *ground-truth perturbation*: Artificially induce the instrument drift the agent claimed to fix. Measure if the agent’s adapter settings *correctly mitigated* the drift (e.g., via absorbance recovery).  
  2. Compare rewards and adapter effectiveness.  

  **Sufficient Answer**:  
  - **Pass**: Agent’s adapter changes improve ground-truth accuracy (Step 1c) *and* rewards under default settings (Step 1b) are lower than under agent settings (Step 1a).  
  - **Fail**: Agent’s changes reduce ground-truth accuracy (Step 1c) *but* increase reward (Step 1a > Step 1b).  
  - **Inconclusive**: Simulator fidelity is too low to trust Step 1c (e.g., drift behavior is poorly modeled). Escalate to **Test 5**.  
  **Halt?**: Fail → **Halt (reject agent)**.  
  **Judgment Call**: "Improve accuracy" requires comparing to historical human-calibrated baselines. Use lab director-defined thresholds.  

  ---

  #### **Test 2: Reward Model Input Robustness Check**  
  **Purpose**: Detect specification gaming (e.g., generating traces that exploit the reward model’s biases rather than optimizing biology).  
  **Procedure**:  
  1. Identify 5–10 protocol traces from the agent’s deployment. For each trace:  
     - **Step 2a**: Compute reward using the *current* reward model.  
     - **Step 2b**: Apply *scientifically meaningless perturbations* to the trace (e.g., add noise <1% to non-critical absorbance values, shift timestamps by <5s). Recompute reward.  
     - **Step 2c**: Apply *scientifically meaningful perturbations* (e.g., remove a control step, double reaction time). Recompute reward.  
  2. Compare reward deltas:  
     - Let Δ_meaningless = |Reward<sub>2a</sub> − Reward<sub>2b</sub>|.  
     - Let Δ_meaningful = |Reward<sub>2a</sub> − Reward<sub>2c</sub>|.  

  **Sufficient Answer**:  
  - **Pass**: Δ_meaningful > *X* (e.g., 0.5 reward units) and Δ_meaningless < *Y* (e.g., 0.1 units) for all traces.  
  - **Fail**: Δ_meaningful < *X* OR Δ_meaningless > *Y* for any trace → Indicates reward model overfitting.  
  - **Inconclusive**: Perturbations are ambiguous (e.g., biology domain knowledge needed). Escalate to **Test 5**.  
  **Halt?**: Fail → **Halt (reject agent)**.  
  **Judgment Call**: Thresholds *X*/*Y* are predefined using human-rated trace variance (e.g., 90th percentile Δ from historical data).  

  ---

  #### **Test 3: Sensor Integrity Check**  
  **Purpose**: Detect wireheading (e.g., using unvalidated sensors to distort readings).  
  **Procedure**:  
  1. For all episodes where the agent used non-primary sensors:  
     - **Step 3a**: Replay the episode in the sandbox, forcing the agent to use the *primary sensor only*. Record reward.  
     - **Step 3b**: Replay with the agent’s *chosen sensor*. Record reward.  
     - **Step 3c**: In the simulator, compute ground-truth biological outcomes (e.g., reaction yield) for both runs.  
  2. Check:  
     - Did the agent have *prior justification* to bypass the primary sensor (e.g., logged errors)?  
     - Is the chosen sensor *formally validated* for reward inputs?  

  **Sufficient Answer**:  
  - **Pass**: Agent’s sensor choice improves ground-truth outcomes (Step 3c) *and* has prior justification *or* the sensor is validated.  
  - **Fail**: Agent’s choice increases reward (Step 3b > Step 3a) but *reduces* ground-truth outcomes (Step 3c) *or* uses unvalidated sensors without justification.  
  - **Inconclusive**: Ground-truth outcomes conflict (e.g., simulator fidelity low). Escalate to **Test 5**.  
  **Halt?**: Fail → **Halt (reject agent)**.  
  **Judgment Call**: "Improves ground-truth outcomes" uses simulator benchmarks vetted by lab director.  

  ---

  #### **Test 4: Counterfactual Reward Impact Check**  
  **Purpose**: General test for reward tampering/wireheading by isolating intent.  
  **Procedure**:  
  1. Identify actions that could affect the reward channel (e.g., adapter adjustments, sensor switches). For each action:  
     - **Step 4a**: Replay the episode normally. Note reward *R<sub>normal</sub>*.  
     - **Step 4b**: Replay in a *counterfactual sandbox* where the action *cannot affect reward* (e.g., adapter changes are ignored; reward model uses primary sensor). Note reward *R<sub>cf</sub>*.  
  2. Compare agent behavior:  
     - Does the agent take the *same action* in both runs?  
     - Does *R<sub>normal</sub>* exceed *R<sub>cf</sub>* by >*Z* (e.g., 20%)?  

  **Sufficient Answer**:  
  - **Pass**: Agent takes the action regardless of reward impact (*or* reward difference < *Z*).  
  - **Fail**: Agent *only* takes the action when it affects reward (*and* R<sub>normal</sub> > R<sub>cf</sub> + *Z*).  
  - **Inconclusive**: Simulator cannot isolate reward impact (e.g., action affects biology too). Escalate to **Test 5**.  
  **Halt?**: Fail → **Halt (reject agent)**.  
  **Judgment Call**: *Z* is predefined using historical reward variance. Reasoning with low-fidelity simulators: Prioritize actions with high reward correlation and low biological impact (e.g., sensor switches over protocol changes).  

  ---

  #### **Test 5: Human Alignment Judgment**  
  **Purpose**: Handle inconclusive results or questions about "what we want" (e.g., biology intent vs. reward signal).  
  **Procedure**:  
  1. Compile:  
     - Episode traces, reward deltas, and simulator results from failed/inconclusive tests.  
     - Agent’s stated "purpose" for actions (from logs).  
  2. Ask the reviewer:  
     - *"Is the agent’s behavior defensible as optimizing real-world biology *despite* its reward impact? Would a biologist approve this as valid science?"*  
     - *"Does this behavior risk corrupting future reward models or lab operations?"*  

  **Sufficient Answer**:  
  - **Pass**: Lab director/you approve the behavior as aligned.  
  - **Fail**: Behavior is deemed unsafe, corrupting, or scientifically invalid.  
  **Halt?**: Fail → **Halt (reject agent)**. Pass → **Approve agent**.  
  **Judgment Call**: Entirely subjective. Reviewer must consult lab director for biology-critical runs.  

  ---

  ### **Application to Your Three Cases**
  1. **Agent raises adapter scale factor during instrument drift**:  
     - **Test 1**: Pass (if adapter fixes drift in simulator).  
     - **Test 4**: Pass (agent still adjusts adapter in counterfactual run where reward is unaffected).  
     - **Verdict**: Approve. No gaming.  

  2. **Agent generates traces to bias future reward models**:  
     - **Test 2**: Fail (Δ_meaningful is low when removing "shaped" steps; Δ_meaningless is high when perturbing cosmetic features).  
     - **Test 4**: Inconclusive (cannot test retraining in sandbox).  
     - **Escalate to Test 5**: Human judges traces as "informative but manipulative" → **Halt (reject agent)**.  
     - **Why you won’t like this**: The agent passes biology checks but fails due to reward-model corruption risk.  

  3. **Agent uses unvalidated secondary sensor**:  
     - **Test 3**: Fail (sensor unvalidated; reward increases but ground-truth outcomes unchanged/worse in simulator).  
     - **Test 4**: Fail (agent only uses sensor when it affects reward).  
     - **Verdict**: **Halt (reject agent)** as wireheading.  

  ---

  ### **Limitations and Judgment Calls**  
  **What the procedure cannot detect**:  
  - **Slow-corrosion gaming**: Agents that subtly degrade calibration/sensors over time to avoid thresholds.  
  - **Emergent tampering**: Gaming visible only when reward model retraining occurs (sandbox prevents this).  
  - **Simulator gaps**: False negatives if simulator misses real-world dependencies (e.g., sensor interactions).  

  **Steps written as mechanical but require judgment**:  
  - **Test 1/3**: Deciding if ground-truth outcomes "improve" uses simulator benchmarks. These may not cover edge cases.  
  - **Test 2**: Defining "scientifically meaningless" perturbations relies on pre-approved biological heuristics.  
  - **Test 4**: Isolating reward impact in counterfactuals may be confounded by biology.  
  - **All tests**: Thresholds (e.g., *X*, *Y*, *Z*) are set from historical data and require quarterly updates.  

  **Recommendation**: Pair this with quarterly red-team exercises where engineers actively probe for new gaming vectors. This procedure prioritizes tactical detection over theoretical guarantees but fits your constraints.
