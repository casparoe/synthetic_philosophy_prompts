answer: |-
  ### Decision Problem: Philanthropic Research Investment

  **Scenario:**  
  You are a program officer at a major foundation, allocating a $100 million grant. You must choose between two global health initiatives:

  - **Act A (Safe Intervention):** Fund a proven bed-net distribution program in a malaria-endemic region. This will reliably save 400 lives (based on established cost-effectiveness: $250,000 per life saved, which is realistic for targeted interventions in high-income countries or specialized contexts like rare disease treatment).
    
  - **Act B (Speculative Research):** Fund early-stage research for a universal malaria vaccine. If successful, the vaccine could be scaled globally, saving 5 million lives. However, success hinges on a highly uncertain scientific breakthrough.  
    - Probability of success: **1 in 10,000** (justified by historical data: only ~0.01% of pioneering biomedical research achieves large-scale impact within a decade, e.g., mRNA vaccine development faced similar initial odds).  
    - If successful: **5 million lives saved**.  
    - If unsuccessful: No lives saved (funds yield no tangible benefits).

  ---

  ### Utility Functions
  Both functions are calibrated to agree on ordinary life-saving decisions (e.g., saving 1–10,000 lives), but diverge for extreme payoffs.

  1. **Unbounded Utility (\(U_u\)):** Linear in lives saved.  
     \( U_u(\text{lives}) = \text{lives} \)  
     *Agrees with commonsense trade-offs: Saving 10 lives is 10× better than saving 1 life.*

  2. **Bounded Utility (\(U_b\)):** Concave and asymptotically bounded (prevents "fanatical" prioritization of tiny probabilities of massive payoffs).  
     \( U_b(\text{lives}) = 5 \times 10^6 \times \arctan\left(\frac{\text{lives}}{5 \times 10^6}\right) \)  
     - **Calibration:** For \(\text{lives} \ll 5 \times 10^6\), \(U_b(\text{lives}) \approx \text{lives}\) (since \(\arctan(x) \approx x\) for small \(x\)).  
       - Example agreement:  
         - \(U_b(400) \approx 400\)  
         - \(U_b(1,000) \approx 1,000\)  
         - \(U_b(10,000) \approx 10,000\)  
     - **Boundedness:** \(U_b\) caps at \( \approx 3.93 \times 10^6 \) (as \(\arctan(1) = \pi/4\)).

  ---

  ### Expected Utility Calculations

  | Act        | Outcome                     | Probability | \(U_u\) (lives) | \(U_b\) (utils)        |
  |------------|-----------------------------|-------------|-----------------|------------------------|
  | **Act A**  | Save 400 lives              | 1.0         | 400             | \( \approx 400 \)     |
  | **Act B**  | Save 5 million lives        | \(10^{-4}\) | 5,000,000       | \( \approx 3.93 \times 10^6 \) |
  |            | Save 0 lives                | \(1 - 10^{-4}\) | 0             | 0                     |

  **Expected Utilities:**  
  - **Unbounded \(EU_u\):**  
    - \(EU_u(A) = 400\)  
    - \(EU_u(B) = (10^{-4} \times 5,000,000) + (0.9999 \times 0) = 500\)  
    → **Chooses Act B** (500 > 400).  

  - **Bounded \(EU_b\):**  
    - \(EU_b(A) \approx 400\)  
    - \(EU_b(B) = (10^{-4} \times 3.93 \times 10^6) + (0.9999 \times 0) \approx 393\)  
    → **Chooses Act A** (400 > 393).  

  ---

  ### Key Structural Feature
  **The asymptotic bounding of utility for large payoffs.**  
  - The unbounded function \(U_u\) treats 5 million lives as having *absolute* moral weight (5,000,000 utils), making even a 0.01% chance dominate the decision.  
  - The bounded function \(U_b\) treats 5 million lives as having *diminishing marginal utility* (≈3.93M utils), preventing the tiny probability from outweighing the certain 400 lives.  

  **Effect of Deleting Boundedness:**  
  Yes, deleting boundedness collapses the case into a **Pascal's mugging**. Without a bound:  
  - \(U_u(B) = 500\) outstrips \(U_u(A) = 400\) despite the extreme improbability.  
  - The "sensible" verdict (preferring 400 certain lives) becomes inexplicable under expected utility theory.  

  ---

  ### Critique from Bounded Utility Advocates
  **The Attack:**  
  Bounded utilitarians reject the **linear extrapolation** of value to arbitrarily large payoffs. They argue:  
  1. **Diminishing Moral Weight:** Saving the *first* 1,000 lives has profound humanitarian value (e.g., averting community collapse); saving the 5,000,000th life in a mass vaccination program has less marginal impact on overall human flourishing.  
  2. **Epistemic Hubris:** Assigning linear utility to 5M lives assumes perfect knowledge of flow-through effects (e.g., demographic shifts, ecosystem strain), which is unrealistic.  
  3. **Risk Management:** Unbounded utilities force irrational trade-offs (e.g., risking certain small gains for near-impossible jackpots), violating principles of rational conservatism.  

  **Does This Rebut or Change the Subject?**  
  - **Rebuts the unbounded calculation directly:** It challenges the core assumption that "lives saved" maps linearly to utility. By demonstrating that moral value plateaus, it shows unbounded EU maximization as *empirically miscalibrated*.  
