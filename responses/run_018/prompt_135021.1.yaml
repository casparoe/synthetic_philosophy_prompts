  First, unpack Gibbon's likely biases: 
  - He saw Rome as the civilizational apex, so non-imperial societies might not even qualify as "collapses" to him. 
  - His cyclical model (overreach → moral decay → disintegration) is teleological. 
  - He'd prioritize administrative institutions over ecology or kinship networks. 

