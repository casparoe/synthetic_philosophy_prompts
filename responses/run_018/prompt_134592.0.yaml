  Now misconceptions: the "objective probabilities" confusion will spike during payoff demonstrations—I'll preempt it by stressing "beliefs, not reality." "Risk aversion" fears might surface when discussing rational acceptance of bets; I'll clarify that coherence is about logic, not psychology. The "Bayesian updating" mix-up will tempt during diachronic bets, so I'll distinguish "avoiding exploit" from "optimal learning." 

