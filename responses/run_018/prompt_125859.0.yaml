answer: |-
  ## The Fragmented Virtuoso

  **Structural Mirror:** The villanelle's recurring refrains enact situationist recurrence-by-context, circling like an observed agent failing to act consistently across differing rooms, while the fragmentationist interprets this as specialized local dispositions rather than universal failure.

  The trait divides by place and hour;  
  Where power watches, honesty may bloom,  
  But shadows grant the lie its secret power.  
  A hurried step denies the beggar's flower,  
  Though moments prior, compassion filled the room.  
  The trait divides by place and hour.  
  The mask of crowds lets careless actions tower,  
  Where known, the gentle hand would not presume;  
  But shadows grant the lie its secret power.  
  A kind word spoken in the patron's bower  
  Withholds itself where scrutiny's consumed.  
  The trait divides by place and hour.  
  The self is spliced by circumstance's dower,  
  No single will commands from womb to tomb;  
  But shadows grant the lie its secret power.  

  Observe the fractured skill, the practiced art  
  Of knowing *when* the debt of care is due,  
  No virtue lives, but virtues do.  
  The honest glance that pierces through the mart,  
  The hidden coin bestowed where few look through,  
  Observe the fractured skill, the practiced art.  
  The narrow excellence, the partial chart  
  Of goodness bound to context, tight and true,  
  No virtue lives, but virtues do.  

  The trait divides by place and hour;  
  No virtue lives, but virtues do.  

  ---

  **Formal Notes:**
  *   **Structure:** Strict villanelle (5 tercets ABA, 1 quatrain ABAA).
  *   **Refrains:** Line 1/6/12/18: "The trait divides by place and hour". Line 3/9/15/19: "No virtue lives, but virtues do".
  *   **Rhyme:** A-rhymes: hour/power/flower/power/tower/power/bower/power/dower/hour/do. B-rhymes: bloom/room/presume/consumed/tomb/art/due/art/true/do.
  *   **Octave (Lines 1-9):** Presents specific situational variables fracturing behavior: authority ("power watches"), time pressure ("hurried step"), anonymity ("mask of crowds," "shadows," "where scrutiny's consumed").
  *   **Sestet (Lines 10-15):** Shifts to "local expertise" ("fractured skill," "practiced art," "knowing *when*," "narrow excellence," "bound to context").
  *   **Final Couplet (Lines 18 & 19):** Presents the refrains adjacent without synthesis.
  *   **Register:** Formal, slightly archaic ("bower," "dower," "presume," "womb to tomb," "mart").
  *   **Conceptual Proximity:** Tight rhymes and repeating refrains force the situationist observation and fragmentationist response into constant, unresolved proximity, mirroring the empirical cycle and the philosophical tension.
