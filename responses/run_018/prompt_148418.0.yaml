    (c) Derive rational justification from upholding systems that preempt "absurd" societal collapse.  
  - **Repair strategy:** Voting’s expressive and instrumental values fuse in a *systemic logic*—it expresses civic identity *through* performing a functionally necessary role. Wearing a button performs no comparable function.
