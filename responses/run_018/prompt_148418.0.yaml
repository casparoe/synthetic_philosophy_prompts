  Below is the structured diagnosis of the argument's flaw, followed by the JSON summary:

  ### Diagnostic Table
  | Rejected Step | The Flaw or Cost | Impact on Civic-Duty Analogy | Alternative Repair |
  |---------------|------------------|------------------------------|-------------------|
  | Step 4 (Parity of reasoning between voting and symbolic acts) | **Flaw:** Equates voting—a constitutive, rule-defined act within a formal institution—with purely expressive gestures (e.g., wearing colors). Voting’s expressive value is *instrumentally parasitic* on its institutional role: without votes, elections collapse, whereas symbolic acts lack this systemic function. **Cost of rejection:** Requires conceding that voting’s expressive value is qualitatively distinct due to its embeddedness in a collective-authorization system. | **Holds intact.** Jury duty/tax compliance analogies survive because they, like voting, are *institutionally constitutive*: non-participation directly undermines the system’s legitimacy/function (unlike unworn campaign buttons). Civic obligations gain rational weight from their institutional necessity, not just expressiveness. | Narrowly redefine "expressive value" for voting as *institutionally expressive*: it derives meaning from being part of a formal procedure that *only works* if sufficiently many participate. Symbolic acts lack this threshold-dependent systemic role. |
  | Step 5 (No principled boundary) | **Flaw:** Assumes "expressive content" alone defines the act’s value. Ignores *institutional context*: voting is a designated input to an outcome-generating system; petitions/rallies are not. **Cost of rejection:** Must recognize that societal conventions and rules create boundaries—voting is a privileged ritual with distinct normative weight. | **Strengthens analogy.** Jury duty/tax compliance are similarly privileged by institutional design. Their "boundary" is defined by legal/social necessity: skipping jury duty voids trials; tax evasion defunds public goods. Symbolic acts lack this structural necessity. | Ground the distinction in *functional interdependence*: voting/jury duty are "cogs" in systems requiring participation thresholds; mere symbols are substitutable decorations. |
  | Step 2 (Only non-instrumental value justifies voting) | **Flaw:** Overlooks *conditional instrumental value*: if enough voters act "irrationally," the system functions, yielding instrumental benefits for all. This transforms voting into a *conditional collective good* with ex post rationality. **Cost of rejection:** Weakens rational-choice purity by introducing dynamic/group-dependent expectations. | **Partially preserved.** Tax compliance/jury duty also rely on conditional cooperation: if enough comply, society functions, benefiting even free-riders. But unlike voting, these carry legal penalties, blending self-interest with duty. | Adopt a *threshold-conditional* expected utility model: the probability of being pivotal is low, but the *expectation of collective benefit if thresholds are met* is high. |

