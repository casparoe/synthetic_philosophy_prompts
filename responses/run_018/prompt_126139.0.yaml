  So write an essay on whether this layered version saves two-dimensionalism or collapses it into a disguised direct-reference view. Weigh the arguments properly and reach a real verdict—does 2D semantics survive only if we drop the surface/substrate split, or is the split essential but self-defeating? Don't end non-committally; I actually want to know if the machinery is doing real explanatory work or just hiding the mystery in a new box. And please don't just list readings—I'm working without library access right now.
