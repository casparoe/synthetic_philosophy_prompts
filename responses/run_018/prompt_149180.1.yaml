prompt: |-
  I serve as the administrative secretary for a mid-sized annual fiction prize, and each year I must audit the confidential rationales that five volunteer jurors submit when ranking novels. The board has become concerned that jurors sometimes defend rankings with reasons that are, in the philosophical sense, the wrong kind: reasons that may be genuinely explanatory but should not govern an aesthetic verdict. I need a reusable decision procedure I can run on every juror’s written justification—without requiring jurors to learn philosophy, and within the two-hour window I have between receiving the rationales and delivering my report to the board. The procedure should be grounded in what the wrong-kind-reasons literature actually distinguishes—especially the difference between reasons that are responsive to the value in question and reasons that merely cause or substitute for that response—while translating that distinction into steps a non-specialist secretary can apply repeatedly.

  Please construct the procedure as an ordered checklist with explicit stopping conditions: for each step, state the question to ask of the rationale, what counts as a sufficient answer that lets the audit pass, and what answer triggers a flag or hands the decision to me as an irreducible judgment call. Include a small set of test sentences or patterns I can match against a juror’s text, and a worked example of each kind—one where the procedure correctly flags a wrong-kind reason, one where it clears a reason that initially looks suspicious, and one where the procedure returns an unwanted result (a rationale it flags that I, on reflection, think should have been permitted). Be explicit about where the procedure will misfire—cases in which a reason is genuinely of the wrong kind but will slip through, or cases in which a legitimate reason will be falsely flagged. Also state what the procedure cannot do: which disagreements about literary value it cannot settle, and where I must simply report that the board needs to decide.

  To keep the audit focused, inject and defend a three-part taxonomy of wrong-kind reasons specific to literary judgment—biographical-projection reasons, market-proxy reasons, and moral-political substitution reasons—explaining briefly why each is wrong-kind in aesthetics rather than in morality, and showing how the taxonomy improves on treating “wrong kind” as a single undifferentiated category. Apply the full procedure to three concrete juror rationales: (1) a juror ranks a traumatic autofictional novel highly because “it finally lets people like me see our suffering represented,” (2) a juror dismisses an experimental novel because “no one will buy this, and the prize should stay relevant,” and (3) a juror praises a historical epic solely for “restoring dignity to a marginalized group,” with no mention of narrative craft, language, or form. For the third case, show both the flag the procedure raises and the judgment call it forces on me. Finally, specify the practical constraints—time per rationale (approximately twenty minutes), the level of philosophical literacy I can assume of the jurors (none), and who must sign off on my report (the board chair, who has no philosophy background)—and adjust the procedure’s rigor accordingly.
reasoning: |-
  We are constructing a decision procedure for auditing juror rationales for the presence of "wrong-kind reasons" (WKR) in the context of an aesthetic (literary) judgment. The taxonomy we'll use is:

  1. **Biographical-Projection Reasons (BPR)**: When the juror's reason for the ranking is based on personal identification or projection of their own life experiences onto the work, rather than on the work's aesthetic qualities.
     - Why WKR? Because the reason is about the juror's personal response (which may be genuine) but not about the value inherent in the work as an aesthetic object. It confuses the cause of the response (personal resonance) with the reason that should govern an aesthetic verdict (the work's artistic qualities).

  2. **Market-Proxy Reasons (MPR)**: When the juror uses market success (or lack thereof) as a proxy for literary merit.
     - Why WKR? Market success (sales, popularity) is often driven by factors other than aesthetic value (e.g., marketing, current trends). It substitutes an extrinsic, non-aesthetic factor for an intrinsic, aesthetic one.

  3. **Moral-Political Substitution Reasons (MPSR)**: When the juror bases the ranking solely on the moral or political message of the work, without connecting it to the aesthetic means by which that message is conveyed (i.e., without considering narrative craft, language, form, etc.).
     - Why WKR? While a work's moral or political dimension can be part of its aesthetic value (if integrated artistically), a reason that ignores the artistic integration and reduces the work to its moral/political content is substituting a non-aesthetic reason for an aesthetic one.

  This taxonomy improves on a single category by allowing the procedure to target specific patterns and by helping the secretary to recognize distinct failure modes.

  **Decision Procedure Checklist**

  *Goal*: For each juror's written rationale, step through the checklist. If at any step a flag condition is met, stop and record the flag. If no flags are raised by the end, the rationale passes. The procedure should take about 20 minutes per rationale.

  **Step 1: Check for Biographical-Projection Reasons (BPR)**
  - **Question**: Does the rationale explain the ranking by referring to the juror's personal life experiences, identity, or emotional response in a way that does not connect to the work's crafted features?
  - **Sufficient Answer (Pass)**: The rationale does not mention the juror's personal life, identity, or emotional response in isolation. OR, if it does, it explicitly connects the personal response to the work's aesthetic qualities (e.g., "The novel's vivid characterization allowed me to see myself in the protagonist").
  - **Flag Condition**: The rationale uses personal experience/identity as the primary justification without linking to the work's artistic features (e.g., "I ranked it highly because it's about someone like me").
  - **Test Patterns**:
    - Pattern to flag: "I am [identity marker] and this book speaks to me"; "This story mirrors my own experience of [event]"; "As a [identity], I felt seen".
    - Pass example: "The author's use of interior monologue creates a powerful identification with the protagonist, which moved me deeply."
  - **Stopping Condition**: If a BPR flag is raised, stop and note: "BPR flag: rationale appears to substitute personal identification for aesthetic evaluation."

  **Step 2: Check for Market-Proxy Reasons (MPR)**
  - **Question**: Does the rationale use market success, sales, popularity, or relevance to the market as a reason for the ranking?
  - **Sufficient Answer (Pass)**: The rationale does not mention market factors. OR, if it does, it only uses them in a way that is clearly subordinate to aesthetic considerations (e.g., "The book's popularity is a testament to its compelling narrative, which I found masterfully constructed").
  - **Flag Condition**: The rationale uses market factors as a primary reason (e.g., "This book won't sell, so it shouldn't win" or "This book is a bestseller, so it deserves the prize").
  - **Test Patterns**:
    - Pattern to flag: "No one will buy this"; "This book is a commercial success"; "The prize should go to a book that sells".
    - Pass example: "The novel's innovative structure might challenge some readers, but I found it artistically daring and effective."
  - **Stopping Condition**: If an MPR flag is raised, stop and note: "MPR flag: rationale appears to substitute market considerations for aesthetic evaluation."

  **Step 3: Check for Moral-Political Substitution Reasons (MPSR)**
  - **Question**: Does the rationale base the ranking solely on the moral or political message of the work, without any reference to the narrative craft, language, form, or other aesthetic features?
  - **Sufficient Answer (Pass)**: The rationale links the moral/political content to the aesthetic execution (e.g., "The novel's powerful message about injustice is conveyed through an original narrative structure and poetic prose"). OR, if the moral/political content is mentioned, it is not the sole reason and the rationale also discusses aesthetic features.
  - **Flag Condition**: The rationale only discusses the moral or political message and does not mention any aesthetic feature (e.g., "This book restores dignity to group X, so it should win").
  - **Test Patterns**:
    - Pattern to flag: "It's important to tell this story"; "This book gives voice to [group]"; "The message is timely and necessary" (with no mention of how it is told).
    - Pass example: "The novel's incisive social critique is amplified by its complex characters and lyrical prose."
  - **Stopping Condition**: If an MPSR flag is raised, stop and note: "MPSR flag: rationale appears to substitute moral/political content for aesthetic evaluation."

  **Step 4: Final Check for Aesthetic Grounding**
  - **Question**: If the rationale passed the first three steps, does it still contain a reason that is clearly about the work's aesthetic value? (This step is only reached if the first three did not flag.)
  - **Sufficient Answer (Pass)**: The rationale includes at least one reason that is about the work's crafted features (e.g., narrative structure, prose style, character development, thematic complexity, originality, etc.).
  - **Flag Condition**: The rationale does not mention any aesthetic feature of the work. This might occur if the rationale passed the first three by not falling into BPR, MPR, or MPSR, but still does not provide an aesthetic reason (e.g., "I just loved it" or "It's a classic" without explanation). However, note that this step is a catch-all and may be less common given the prior steps.
  - **Stopping Condition**: If no aesthetic reason is found, flag: "Aesthetic grounding missing: rationale does not provide reasons responsive to the literary value of the work." Otherwise, pass.

  **Procedure Summary**:
  1. Check for BPR -> if flag, stop and report.
  2. Check for MPR -> if flag, stop and report.
  3. Check for MPSR -> if flag, stop and report.
  4. Final check for aesthetic grounding -> if missing, flag; otherwise, pass.

  **Worked Examples**:

  1. **Example that flags (BPR)**:
     - Rationale: "I ranked this traumatic autofictional novel highly because it finally lets people like me see our suffering represented."
     - Step 1: The rationale uses "people like me" and "our suffering" without linking to the work's crafted features. This is a clear BPR pattern. 
     - **Flag**: BPR.

  2. **Example that clears a suspicious reason**:
     - Rationale: "I ranked the autofictional novel highly because the author's use of fragmented narrative mirrors the psychological impact of trauma, creating a profound aesthetic experience that resonates with my own understanding of such experiences."
     - Step 1: It mentions personal resonance but links it to the aesthetic feature (fragmented narrative) and the resulting aesthetic experience. Passes BPR check.
     - Steps 2 and 3: No market or moral-political substitution. Then Step 4: It clearly discusses an aesthetic feature. Pass.

  3. **Example that flags but might be controversial (unwanted flag)**:
     - Rationale: "This novel restores dignity to a marginalized group. Therefore, it deserves the prize."
     - Step 3: This is MPSR because it bases the ranking solely on the moral-political message without mentioning any aesthetic feature. 
     - **Flag**: MPSR.
     - However, on reflection, the secretary might think: What if the board believes that the act of representation itself, in a context of historical exclusion, has aesthetic significance? But note: the procedure requires at least some mention of aesthetic features. Without that, it's a substitution. The secretary must note the flag and then, because the procedure forces a judgment call, they must decide: Is there any implied aesthetic value? In this case, the rationale is too thin. The secretary might note: "MPSR flag raised, and I judge that the rationale does not provide any aesthetic reason; therefore, the flag stands."

  **Limitations and Misfires**:

  - **False Negatives (WKR that slip through)**:
    - A rationale might use a BPR in a subtle way that is not caught by the patterns (e.g., "This book spoke to me in a way no other has" without explicit identity markers). The procedure relies on explicit patterns and may miss more subtle projections.
    - A rationale might use MPR in a disguised way (e.g., "This book has the potential to reach a wide audience" without using the word "sell"). The patterns are not exhaustive.
    - A rationale might discuss moral-political content in a way that implies aesthetic integration without explicitly stating it (e.g., "The portrayal of the marginalized group is powerful" - but note: "powerful" could be non-aesthetic). The procedure requires explicit mention of an aesthetic feature.

  - **False Positives (legitimate reasons flagged)**:
    - A BPR might be appropriately linked to aesthetic features, but the secretary might miss the link in a complex sentence. (This is why the procedure requires explicit connection.)
    - A moral-political reason might be intrinsically tied to the aesthetic value (e.g., in a novel where the political message is conveyed through a revolutionary form). But if the rationale does not make the connection explicit, it will be flagged as MPSR.

  **What the Procedure Cannot Do**:
  - It cannot resolve substantive disagreements about what counts as an aesthetic feature. For example, if a juror claims that a work's political impact is an aesthetic feature, but the board disagrees, the procedure will flag it as MPSR unless the juror also discusses traditional aesthetic features. The procedure is designed to catch clear substitutions, not to define what aesthetics is.
  - It cannot evaluate the quality of the aesthetic reasons (e.g., whether they are good or bad reasons). It only checks for the presence of the wrong-kind reasons and the presence of at least one aesthetic reason.
  - It cannot handle rationales that are too vague to categorize. In such cases, the secretary must use judgment (e.g., if a rationale says "The book is well-written", that might pass the aesthetic grounding step, but it's very thin).

  **Application to the Three Concrete Juror Rationales**:

  1. **Rationale 1**: "I ranked this traumatic autofictional novel highly because 'it finally lets people like me see our suffering represented.'"
     - Step 1: This is BPR (using "people like me" and "our suffering" without linking to aesthetic features). 
     - **Flag**: BPR. Stop.

  2. **Rationale 2**: "I dismiss an experimental novel because 'no one will buy this, and the prize should stay relevant.'"
     - Step 2: This is MPR (using market factors: "no one will buy this", and relevance to the market as a reason). 
     - **Flag**: MPR. Stop.

  3. **Rationale 3**: "I praise a historical epic solely for 'restoring dignity to a marginalized group,' with no mention of narrative craft, language, or form."
     - Step 3: This is MPSR (solely moral-political reason). 
     - **Flag**: MPSR. Stop.
     - **Judgment call for the secretary**: The secretary must then decide if there is any implied aesthetic value in the phrase "restoring dignity". However, without any mention of craft, language, or form, it is a clear case of substitution. The secretary should uphold the flag.

  **Practical Constraints**:
  - **Time per rationale**: ~20 minutes. The checklist is designed to be applied quickly by matching patterns and reading for key phrases.
  - **Philosophical literacy of jurors**: None. The procedure does not require jurors to know about WKR; it only requires the secretary to apply the checklist.
  - **Report sign-off**: The board chair (no philosophy background). The report should use plain language and the flags (BPR, MPR, MPSR) should be explained in the cover memo with simple examples.

  **Final Note**: In cases where the procedure flags a rationale, the secretary should note the flag and the type. The board can then decide how to weigh that juror's ranking. The procedure does not invalidate the ranking but flags it for board review.
answer: |-
  Below is a reusable decision procedure designed to audit juror rationales for "wrong-kind reasons" (WKR) in literary judgment, based on established philosophical distinctions (e.g., Rabinowicz, Rønnow-Rasmussen, Hieronymi). The core principle is that **aesthetic reasons must be *responsive to the work's crafted features*** (e.g., language, form, narrative technique) rather than *causing* a reaction (e.g., personal identification) or *substituting* non-aesthetic values (e.g., moral or market factors).  

  To improve focus, I inject a **three-part taxonomy of WKR specific to literary judgment**, grounded in aesthetics:  
  1. **Biographical-Projection Reasons (BPR)**: Using personal identity/experience as the *cause* of a response (e.g., "This resonates with my trauma") without linking it to the work's artistry.  
     - *Why WKR?* Confuses a psychological *cause* (e.g., catharsis) with an aesthetic *reason* (e.g., how craft achieves that catharsis). Aesthetic verdicts must be based on the work's properties, not the juror's biography.  
  2. **Market-Proxy Reasons (MPR)**: Treating market forces (e.g., sales, relevance) as proxies for literary merit.  
     - *Why WKR?* Substitutes extrinsic factors (e.g., commercial success) for intrinsic aesthetic value. A prize for literary art should prioritize artistic achievement, not salability.  
  3. **Moral-Political Substitution Reasons (MPSR)**: Praising/dismissing a work *solely* for its moral/political message (e.g., "This dignifies Group X") without engaging its aesthetic execution.  
     - *Why WKR?* Reduces art to a social tool, ignoring that literary value requires integration of message *through craft* (e.g., how language shapes empathy). Moral merit ≠ aesthetic merit.  

  **Why this taxonomy?** Treating WKR as one category risks overlooking nuances (e.g., BPR is about *causal origins*, MPSR about *value substitution*). Separating them allows targeted auditing and clearer feedback to the board.  

  ---

  ### **Decision Procedure: Checklist for Auditing Juror Rationales**  
  **Time per rationale**: 15–20 minutes (scan for keywords, then assess context).  
  **Tools Needed**: Text search (Ctrl+F) for test patterns; a timer.  
  **Output**: Pass, Flag (with WKR type), or Judgment Call (secretary decides).  
  **Stopping Condition**: Stop at first flag; if all steps pass, rationale clears.  

  #### **Step 1: Scan for Biographical-Projection Reasons (BPR)**  
  - **Question**: Does the rationale treat the juror’s personal identity/experience as a *sufficient reason* for the ranking, without linking it to the work’s crafted features?  
  - **Sufficient Answer (Pass)**: Personal references are absent, or they explicitly connect to aesthetic elements (e.g., "The prose made my trauma feel viscerally real").  
  - **Flag Condition**: Rationale uses identity/experience as a standalone justification (e.g., "I ranked this highly because it’s about me").  
  - **Test Patterns (Flag if present without aesthetic link)**:  
    - "As a [identity], I..."  
    - "My experience of [event]..."  
    - "People like me..."  
    - "I felt seen/heard..."  
  - **Worked Examples**:  
    - *Flag*: "I ranked this highly because it finally lets people like me see our suffering represented."  
      - *Why*: "People like me" + "our suffering" is BPR—uses identity as cause, no craft link.  
    - *Pass*: "The fragmented narrative authentically mirrors psychological trauma, which resonated with my experience."  
      - *Why*: Personal resonance is tied to craft ("fragmented narrative").  
  - **Misfires**:  
    - *False Negative*: Subtle BPR (e.g., "This book is my truth") may slip through if no keywords.  
    - *False Positive*: A rationale like "As a war survivor, I admire how the imagery conveys dissociation" might be misflagged if scanned hastily.  

  #### **Step 2: Scan for Market-Proxy Reasons (MPR)**  
  - **Question**: Does the rationale treat market success/relevance as a *proxy for literary merit*?  
  - **Sufficient Answer (Pass)**: Absent market references, or they’re incidental (e.g., "Its popularity highlights its accessibility, but I ranked it for its innovative structure").  
  - **Flag Condition**: Market factors are presented as decisive (e.g., "No one will buy this, so it shouldn’t win").  
  - **Test Patterns (Flag if present as primary reason)**:  
    - "No one will buy/read..."  
    - "Bestseller/commercial success..."  
    - "Relevant/popular..."  
    - "Prize should drive sales..."  
  - **Worked Examples**:  
    - *Flag*: "I dismiss this experimental novel because no one will buy this, and the prize should stay relevant."  
      - *Why*: "No one will buy" and "relevant" are MPR—substitutes market for merit.  
    - *Pass*: "Though experimental, the novel’s language revolutionizes form—even if it won’t sell."  
      - *Why*: Market note is subordinate to craft ("language revolutionizes form").  
  - **Misfires**:  
    - *False Negative*: "This will sell millions" implied as praise without explicit keywords.  
    - *False Positive*: "Its accessibility (e.g., broad appeal) lets complex themes reach many" might be flagged if "broad appeal" is misread as MPR.  

  #### **Step 3: Scan for Moral-Political Substitution Reasons (MPSR)**  
  - **Question**: Does the rationale treat moral/political impact as a *sufficient reason*, without mentioning narrative craft, language, or form?  
  - **Sufficient Answer (Pass)**: Moral/political themes are discussed alongside aesthetic execution (e.g., "The critique of injustice is amplified by its lyrical prose").  
  - **Flag Condition**: Moral/political claims stand alone as the justification (e.g., "This restores dignity to Group X").  
  - **Test Patterns (Flag if no aesthetic terms nearby)**:  
    - "Gives voice to..."  
    - "Restores dignity/justice for..."  
    - "Important message about..."  
    - "Raises awareness of..."  
  - **Worked Examples**:  
    - *Flag*: "I praise this historical epic solely for restoring dignity to a marginalized group."  
      - *Why*: "Restoring dignity" is MPSR—no craft/language/form mentioned.  
    - *Pass*: "By weaving oral history into poetic prose, this epic restores dignity to a marginalized group."  
      - *Why*: Moral goal ("restores dignity") is achieved *through* craft ("poetic prose").  
  - **Misfires**:  
    - *False Negative*: "This is vital for representation" might slip through if "vital" is assumed aesthetic.  
    - *False Positive*: "Its dignified portrayal avoids stereotypes" might be flagged if "dignified" is misread as purely moral (though it implies craft).  

  #### **Step 4: Final Aesthetic Grounding Check**  
  - **Question**: If no flags yet, does the rationale include *at least one* reference to crafted features (e.g., "narrative structure," "imagery," "character development")?  
  - **Sufficient Answer (Pass)**: Yes—aesthetic terms are present.  
  - **Flag/Judgment Call Condition**: No aesthetic terms found. Secretary must decide: Is the rationale implicitly about craft? (e.g., "The pacing was perfect" vs. "It changed my life").  
    - *Secretary’s Judgment Call*: If implied craft (e.g., "haunting," "original"), override and pass. If purely affective (e.g., "I loved it"), flag as "Aesthetic Grounding Missing."  
  - **Test Patterns (Pass if any present)**:  
    - Craft: "prose," "structure," "form," "voice," "symbolism"  
    - Technique: "pacing," "dialogue," "imagery," "tension"  
    - Effect: "evocative," "innovative," "subtle," "nuanced" (if tied to work)  
  - **Misfires**:  
    - *False Negative*: Vague praise (e.g., "brilliant") might pass without substance.  
    - *False Positive*: "Unforgettable" could be flagged as affective but may imply craft (judgment call).  

  ---

  ### **Procedure Limitations & Board Responsibilities**  
  **What this procedure cannot do**:  
  1. **Resolve aesthetic disagreements**: It flags WKR but doesn’t judge if reasons are *good* (e.g., "The symbolism was clichéd" is valid; "It was boring" is weak but not WKR).  
  2. **Handle implied aesthetics**: If a juror says, "The characters felt real," the secretary must judge if that implies craft (pass) or mere affect (flag).  
  3. **Audit taste**: Subjective preferences (e.g., genre bias) aren’t WKR unless they fit BPR/MPR/MPSR.  
  **Where the board must decide**:  
  - If rationales are ambiguous (e.g., "This book matters" with no craft/moral keywords).  
  - If flagged rationales still have valid artistic merit (e.g., MPSR for a work where moral courage *is* the aesthetic innovation).  
  - Disputes about what counts as "craft" (e.g., is "authenticity" an aesthetic feature?).  

  ---

  ### **Application to Concrete Juror Rationales**  
  **Rationale 1**: *"I ranked this traumatic autofictional novel highly because 'it finally lets people like me see our suffering represented.'"*  
  - **Step 1**: Flags for BPR (keywords: "people like me," "our suffering"—no craft link).  
  - **Outcome**: Flag (BPR). Stop audit.  

  **Rationale 2**: *"I dismiss an experimental novel because 'no one will buy this, and the prize should stay relevant.'"*  
  - **Step 2**: Flags for MPR (keywords: "no one will buy," "relevant"—market as merit).  
  - **Outcome**: Flag (MPR). Stop audit.  

  **Rationale 3**: *"I praise a historical epic solely for 'restoring dignity to a marginalized group,' with no mention of narrative craft, language, or form."*  
  - **Step 3**: Flags for MPSR (keywords: "restoring dignity"—moral substitution, no craft).  
  - **Judgment Call**: Secretary evaluates: Is "restoring dignity" implicitly aesthetic? (e.g., Does it imply skilled portrayal?). Here, no—so uphold flag.  
  - **Outcome**: Flag (MPSR). Stop audit.  

  ---

  ### **Practical Adjustments for Constraints**  
  - **Time**: Use text search (Ctrl+F) for test patterns first (~5 mins), then read full rationale (~10 mins). Focus on explicit keywords.  
  - **Juror Philosophy Literacy**: Assume zero—rely on textual patterns, not juror intent.  
  - **Board Chair Report**: Use plain language:  
    - *Flagged Example*: "Juror 3 flagged for Moral-Political Substitution: praised book only for its message, not artistry."  
    - *Pass Example*: "No wrong-kind reasons found; rationale addressed narrative technique."  
  - **Unwanted Result Example**:  
    - *Rationale*: "This book is vital for its authentic portrayal of refugees."  
    - *Procedure*: Flags for MPSR (keyword: "vital," no craft mention).  
    - *Secretary’s Judgment Call*: "Authentic portrayal" implies craft (e.g., avoids stereotypes). Override flag and pass.  
    - *Why Unwanted?* "Authenticity" can be aesthetic, but the procedure requires explicit craft terms—secretary must intervene.  

  **Efficiency Note**: With 5 rationales in 2 hours, prioritize pattern matching. For borderline cases, err on the side of flagging and let the board decide. This balances rigor with time constraints.
