answer: |-
  Here's your reciprocal epistemic auditing procedure distilled into a fifteen-minute pre-filing triage. Run arguments through these three gates sequentially — if they fail any gate, stop. Passing all three doesn't automatically make them *correct*, but it suggests the disagreement might be legitimate rather than purely tactical mudslinging. Where it gets messy, you hand it off.

  **Gate One: Structural Coherence.** Does the argument logically hang together? Check if premises actually support the claimed conclusion without hidden switches in meaning. Look for non-sequiturs, equivocation (using the same word with different meanings mid-argument), or blatant contradictions within the stated position itself. Passing means the internal logic is sound *on its own terms*, even if the premises are dubious. Fail if the conclusion simply doesn't follow from the stated reasons, or if key terms shift meaning sneakily to make the jump work. Stop here if it fails — incoherent structure is often the first sign of bad faith or sloppy thinking. Misfire warning: Clever sophists can build structurally sound arguments from false premises. This gate only catches internal consistency, not truth.

  **Gate Two: Evidential Reciprocity.** Does the speaker apply their own standards of evidence and reasoning consistently *to others*? Scrutinize the thresholds they demand for accepting claims they dislike (e.g., "prove it beyond *all* doubt," "show me *perfect* data"). Now ask: Do they hold themselves or their allies to that *exact* same standard when making claims they support? Passing requires symmetry. If they demand impossibly high certainty to dismiss an opponent but accept much lower certainty (or anecdote, or model outputs) for their own side, they fail. Fail also if they dismiss evidence for the opposing view using methodological critiques they routinely ignore when similar evidence supports their view. Stop here on failure — inconsistent standards are a hallmark of motivated reasoning or bad faith. Misfire warning: Genuine experts *might* reasonably apply stricter standards to novel, high-stakes claims (like a new tech) than to well-established ones, but the burden is on *them* to explicitly justify the difference. Vague or shifting standards fail.

  **Gate Three: The Reversal Check.** Swap the *conclusion* of their argument for one they would clearly oppose, while keeping their core premises and reasoning identical. Does their logic still hold, or does it now seem absurd *to them*? For example, if they argue "Policy X infringes liberty, therefore bad," swap it to "Policy Y (which they like) infringes liberty, therefore bad" using their same liberty-definition and reasoning. Passing means their premises logically compel the swapped conclusion too, forcing them to either accept the unwanted conclusion or revise their premises/reasoning. If the logic collapses only when the conclusion changes, they fail. This exposes special pleading. Fail = their argument only works when it delivers their preferred result. Stop here on failure. Misfire warning: This works best on principles-based arguments (rights, fairness, process). It misfires if the core premises are inherently tied to the specific context in a way that makes a true swap impossible (e.g., "this specific chemical is uniquely toxic" – swapping the chemical might genuinely change the risk). It also can't settle pure value clashes.

  **Handoff to Editor:** This happens when an argument *passes* all three gates but you still smell a rat, or when the core dispute isn't about logic or evidence but about fundamental values or priorities. If the structure is coherent, standards are reciprocally applied, and the reversal holds, but the disagreement persists on the *weight* given to different values (e.g., "Yes, both policies infringe liberty, but Policy X is worth it for security, Policy Y isn't"), that's a values debate, not a bad-faith logic fail. Your editor needs to decide if highlighting that value clash is the story.

  **Applied to Cases:**

  1.  **Climate Researcher (Carbon Pricing Fairness):** Fails **Gate Two (Evidential Reciprocity)**. They use the *same* economic model's output as decisive for healthcare funding fairness but reject its output on carbon pricing fairness. Unless they provide a *principled, consistent* reason why the model's fairness assessment is reliable in one policy domain but fundamentally flawed in the other (beyond just disliking the result), this is applying the model selectively based on desired outcome. Stop. Likely motivated reasoning.

  2.  **Biotech Lobbyist (Gene-Drive vs. GM Crop Uncertainty):** Fails **Gate Two (Evidential Reciprocity)**. If they dismissed concerns about GM crops years ago because "we can't wait for absolute certainty, the benefits are clear," but now demand impossible levels of certainty (beyond what was required for GM crops) to approve gene-drives because of potential risks, they are applying asymmetrical evidence thresholds. They are holding the new technology to a standard they refused to apply to the old one. Stop. Classic bad-faith tactic to delay/disrupt.

  3.  **Science Writer (Vaccine Mandates vs. Seatbelts):** This is the annoying one. It likely **passes Gate One** (structural coherence: bodily autonomy infringement leads to opposition). It **passes Gate Three** (reversal check: If you swap "seatbelt mandate" into their current vaccine argument – "Government forcing me to wear a seatbelt infringes my bodily autonomy, therefore bad" – their logic *should* hold, forcing them to oppose seatbelt mandates *on the same principle* or revise their reasoning). The critical gate is **Two (Evidential Reciprocity)**. Did they previously demand *identical* levels of proof for the safety/efficacy of seatbelts and the societal harm of non-compliance as they now demand for vaccines? Did they apply the *same* threshold for "acceptable infringement" on autonomy for a public health goal? If yes, they pass Gate Two – it's a consistent (if perhaps frustrating) libertarian stance. If no (e.g., they accepted much lower evidence thresholds for seatbelts or hand-waved the autonomy infringement then), they fail Gate Two. *However*, if they pass Gate Two (consistent standards), the core disagreement likely reduces to a **values clash** about *how much* autonomy infringement is justified for *this specific* level of societal benefit/risk, even with consistent logic and evidence standards. That's where you **handoff to the editor**. The procedure can't settle whether their *weighting* of autonomy vs. collective benefit is "legitimate" – it's a value judgment. This is where it misfires for pure value disputes.

  The procedure flags structural flaws, hypocritical evidence standards, and special pleading quickly. It forces consistency checks. But it can't make the final call on whether a consistently applied, structurally sound value position you disagree with is "legitimate" in your eyes – that's always editorial judgment. Use it to filter the obvious bad faith, surface inconsistencies, and identify the true value debates for your editor's input. File cleaner.
