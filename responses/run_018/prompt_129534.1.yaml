answer: |-
  This legal split hinges on **duty, not causation alone.** The law doesn't treat *all* omissions equally; it requires a **pre-existing legal duty** for an omission to become legally significant "causation." Here's the breakdown of the theories and commitments involved:

  1.  **The Core Distinction: Duty of Care**
      *   **Landlord:** Has a **legally imposed duty** arising from the contract (lease) and statutory housing codes (implied warranty of habitability). By entering the landlord-tenant relationship, the landlord assumes responsibility for providing basic necessities like heat in winter. Their *omission* (failing to fix the heater) breaches this specific duty.
      *   **Passerby:** Has **no legally recognized duty** to a random stranger under common law (in most US jurisdictions). While morally troubling, the law generally does not impose a positive duty to rescue or aid strangers. Their *omission* (walking past) breaches no legal duty owed *to that specific person*.

  2.  **Causation by Omission: The "But-For" Test *Conditioned on Duty***
      *   **Causation Analysis Only Applies *After* Duty/Breach:** The law doesn't ask "Did this omission cause harm?" in a vacuum. It asks: "Given that this person/entity had a *duty* to act, and they omitted to act (breach), was that omission a factual and proximate cause of the harm?"
      *   **"But-For" Test w/ Duty:** *If* the landlord had a duty and breached it (didn't fix heater), we ask: "But for the landlord's omission (failure to fix), would the tenant likely have avoided getting sick?" If the answer is "No" (i.e., the tenant would *not* have gotten sick if the heater had been fixed), then the omission is a factual cause.
      *   **No Duty = No Causation Inquiry:** For the passerby, since there's no duty to act in the first place, the law doesn't even reach the question of whether "but for" their failure to help, the homeless person would have avoided harm. The omission is legally irrelevant *as a cause of harm to that specific individual*, even if it factually contributed.

  3.  **The Philosophical Commitments:**
      *   **Liberalism & Negative Rights:** The core commitment is to classical liberal principles. The law primarily protects *negative rights* (freedom *from* interference - assault, theft, breach of contract). It generally avoids imposing *positive duties* (duties *to* act for the benefit of others) except in specific, limited relationships. This preserves individual autonomy and avoids forcing moral choices.
      *   **Relational Duties:** Legal duties to act (positive duties) arise from specific relationships or voluntary undertakings: contracts (landlord/tenant, doctor/patient), status (parent/child), statute (specific mandated reporters), or creation of peril (you caused the danger). Absent such a relationship, no duty exists.
      *   **Practicality & Line-Drawing:** Imposing a general duty to rescue creates immense practical problems: Who must act? How far must they go? What if multiple people pass by? Defining the scope of such a duty is legally complex. Focusing on specific, defined relationships provides clearer rules.
      *   **Causation as a Legal Tool, Not Pure Metaphysics:** The law isn't primarily concerned with the deep metaphysics of whether omissions "truly cause" events in the same way physical forces do. It uses "causation" as a *practical legal concept* to assign responsibility *only after* a duty has been breached. The "weirdness" of negative causation is sidestepped by linking it tightly to duty.
      *   **Moral vs. Legal:** The law explicitly separates legal obligation from moral obligation. Something can be morally reprehensible (walking past) without being legally actionable. This reflects a societal choice about the limits of state coercion.

  4.  **Is it Consistent?**
      *   **Internally Consistent:** Yes, within its own framework. The system consistently says: "Liability for omissions requires a pre-existing legal duty. No duty = no liability for omission, regardless of outcome." The causation test only applies once duty/breach are established. The homeless person scenario never gets past the "duty" hurdle.
      *   **Metaphysically Questionable?** Perhaps. The law essentially *fictions* causation in omission cases. Metaphysically, the bitter cold is the primary cause of the homeless person's suffering, just as it is for the tenant. The landlord's omission *enables* that cause to harm the tenant they were duty-bound to protect. The passerby's omission also *enables* the cold to harm the homeless person, but the law doesn't care because there was no duty *to* that person. So, the "causation" element is heavily dependent on the prior duty for its legal significance.

  5.  **What Would Change if Omissions Were Always Treated as Causes?**
      *   **Good Samaritan Laws:** This is the most direct change. Many jurisdictions (especially in Europe) *do* have laws imposing a limited duty to rescue or summon help in emergencies if it can be done without significant risk. Violating such a law could make the omission a legal cause of harm. The US mostly lacks these.
      *   **Massive Expansion of Liability:** Anyone who *could have* prevented harm but didn't could potentially be sued. Walking past the homeless person? Potentially liable. Not donating a kidney to a stranger dying of renal failure? Potentially liable. The scope would be vast and legally chaotic.
      *   **Shift in Legal Philosophy:** It would represent a fundamental shift from a liberal emphasis on negative liberty towards a more communitarian or welfare-oriented view imposing positive duties of mutual aid.
      *   **Practical Nightmares:** Defining the standard of care ("How much must you do?"), proving causation definitively ("Would *your* action *really* have prevented it?"), and avoiding overwhelming litigation would be immense challenges.
      *   **Impact on Autonomy:** Individual freedom to simply *not act* would be significantly curtailed by the state.

  **In Summary:**

  The legal split isn't primarily about the metaphysics of causation. It's about **duty**. The law commits to:
  1.  **Prioritizing negative rights over positive duties.**
  2.  **Restricting positive duties (to act) to specific relationships or undertakings.**
  3.  **Using causation as a tool only *after* a duty is found to exist and is breached.**
  4.  **Deliberately separating legal liability from moral failing in the case of strangers.**

  The landlord's omission is a legally recognized cause *because* they had a prior duty to the tenant. The passerby's omission is not a legally recognized cause *because* they had no prior duty to the stranger. The "weirdness" of negative causation is handled pragmatically by making it contingent on duty. Changing this would require a radical overhaul of liberal legal principles towards imposing broad positive duties to aid others.
