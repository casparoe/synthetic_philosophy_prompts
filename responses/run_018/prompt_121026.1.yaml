  write the proposal with: the exact question (is DDL unified or bifurcated, and does the bifurcation explain why some lost causes stay politically toxic while others become unifying national myths?); why existing work on collective memeory and national myth leaves this open (it tends to treat history and conceptual machinery together); the philosophical method—how you'd isolate conceptual variables across the four cases without just doing more empirical history; what a useful deliverible looks like for people actually deciding on commemorative policy or education; an honest failure condition; and a realistic scope check for six months with no research assistants.

