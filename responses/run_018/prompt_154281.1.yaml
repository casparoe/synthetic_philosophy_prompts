prompt: |-
  hey so im putting together this little dataset of weird philosophical prompts and i need one about church and state stuff. i was arguing with my roommate last week about how germany still collects kirchensteuer through the tax office, and in england the monarch is technically head of the church but bishops still sit in parliament? and france has laicite but also funds private religious schools? it all feels like everyone says seperate church and state but the state still has its hands in the offering plate. i want a villanelle — like 19 lines, two refrains that keep coming back — where one refrain is something about the wall being up and the other is about the state still holding the collection plate. the idea is that the form itself should show how these two claims keep passing each other without resolving, kind of like how my roommate and i just ended up agreeing its messy. make sure its accurate enough that someone who actually knows about church taxes in europe wont cringe, but dont turn it into a history lesson or preach at the reader. also please dont resolve the tension at the end, just let the refrains sit side by side in the final couplet. oh and im not an academic, just someone who reads wikipedia late at night, so keep it from sounding like a textbook. maybe mention the german system and the english bishops but dont explain them like youre writing for a dictionary, and no bibliography please, i just want the poem.
