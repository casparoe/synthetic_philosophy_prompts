  i guess im asking where the 'outside' view even comes from if the sources themselves are contaminated. also, does injecting modern concepts like trauma and consent into old texts count as bad history, or is it unavoidable translation? i keep going back and forth and cant tell if im missing something obvious, like maybe Ranke never really believed we could escape our own era in the first place and im just projecting.
