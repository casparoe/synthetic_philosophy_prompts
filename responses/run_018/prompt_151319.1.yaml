answer: |-
  Here's a comparison analyzing both frameworks for explaining expert disagreement on avant-garde art:

  1.  **Hume's Standard of Taste:**
      *   **Mechanism:** Disagreements among trained experts (ideal critics) regarding avant-garde art arise because the art has not yet undergone the necessary "test of time." Avant-garde works deliberately defy established conventions and challenge existing notions of delicacy and practice. An ideal critic's faculty of "delicacy" is honed *on past masterworks*, making it difficult to immediately perceive the complex interplay of parts or the potential for enduring pleasure in radically new forms that violate those learned patterns. Furthermore, the lack of widespread practice in appreciating *this specific type* of novelty means even experts haven't fully developed the nuanced perception required. Disagreement reflects the *process* of experts wrestling with the new, their varying capacities to overcome initial prejudice, and the time needed for the work's true merits (or lack thereof) to become demonstrably apparent to refined sensibility. Disagreement is temporary and stems from the novelty exceeding the current calibration of the ideal critics' faculties.

  2.  **Community Taste Calibration:**
      *   **Mechanism:** Disagreements among experts occur because avant-garde art, by definition, disrupts the *existing* social consensus or baseline to which aesthetic judgments have been calibrated. There is no single, monolithic "artworld." Different expert communities (e.g., academic theorists, museum curators, gallery owners, established collectors, avant-garde circles themselves) operate with distinct, evolving social baselines. When encountering radical new work, experts from different communities immediately apply *their specific group's current calibration*. One group might calibrate towards challenging institutional norms, another towards market viability, another towards theoretical coherence within a specific movement. Disagreement isn't about failing to perceive an objective property; it's the result of experts using fundamentally different, socially constructed measuring sticks. Avant-garde art often aims to *create* a new consensus, meaning active disagreement is an inherent and expected part of the social negotiation process, not a temporary failure of perception. Agreement only emerges if/when a *new* shared baseline coalesces across relevant communities.

  **Analysis for Avant-Garde Disagreement:**

  *   **Hume's Strength:** Explains the *difficulty* and initial shock value of avant-garde art for even trained sensibilities. It accounts for the feeling among some experts that the work is simply flawed or incomprehensible *now*, but might be validated later (or not), aligning with historical patterns where radical art gains acceptance over time.
  *   **Hume's Weakness:** Struggles to explain *persistent, fundamental* disagreements among recognized experts *within the same timeframe* about works that remain controversial despite prolonged exposure. It implies that sufficient time and practice *should* eventually lead qualified critics towards convergence on the work's "real beauty," which doesn't always happen, especially with art designed to be perpetually challenging or to reject notions of universal beauty. The idea of a single "real beauty" discoverable by ideal critics seems at odds with the pluralistic and often anti-aesthetic goals of much avant-garde practice.
  *   **Calibration Strength:** Directly addresses the *social reality* of competing artworld factions. It readily explains why experts deeply embedded in different sub-communities (e.g., traditionalist vs. postmodernist academics) can remain fundamentally at odds, not due to perceptual failings, but because they value fundamentally different things based on their group affiliations and the norms those groups uphold. It frames disagreement as an inherent and necessary engine for artistic evolution and discourse, particularly relevant for avant-garde art which often seeks to redefine the boundaries of art itself and thus the very baseline for calibration.
  *   **Calibration Weakness:** Risks reducing expert judgment purely to social conformity within a subgroup, potentially downplaying the role of individual sensitivity, deep knowledge, and reasoned argument that experts genuinely employ. It might struggle to explain why certain avant-garde works *do* eventually achieve near-universal expert acclaim (like early Picasso or Duchamp), suggesting some process beyond mere shifting consensus might be at play, even if not strictly "objective beauty."

  **Conclusion:**

  While Hume's framework explains the initial difficulty experts face with radical novelty, the Community Taste Calibration framework provides a more robust explanation for the persistent and often fundamental disagreements among trained experts regarding avant-garde art.

  \answer{calibration}

  Summary: Community Taste Calibration better explains persistent expert disagreement by highlighting conflicting social baselines within diverse artworld factions, which is intrinsic to avant-garde art's role in challenging existing norms and negotiating new ones.
