  Give me an example of a conceptual issue with positive, negative, and republican liberty that avoids the usual benevolent-master replay. I want a scenario built around an automated infastructure — maybe a housing-allocation algorithm or a predictive parole system — that never literally blocks anyone (negative liberty is fine), supplies all the formal tools and data people need (positive liberty looks okay), but quietly reshuffles available options in real time using rules that are opaque and uncontestable. The twist is there's no human master, just teh system itself. Your example should be concrete enough that you name the institutional setting, and it should flag exactly where republican non-domination either bites or slips away, since domination usually needs a dominator. Don't cite anyone or list readings, just lay out the mechanics and point to the conceptual crack. Write like you're texting a friend — im drafting this for a study group and im in a rush, so a typo or two is totally fine.
