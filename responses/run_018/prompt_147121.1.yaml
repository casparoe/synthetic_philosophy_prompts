answer: |-
  Okay, rushing this for your group. Here's a concrete one:

  **Setting:** City's Affordable Housing Portal ("HomeMatch Pro") for Section 8 vouchers & public units.

  **How it *seems* to work:**
  *   **Negative Lib Looks Fine:** Nobody's locked out. You log in, see listings, apply freely. No guards stopping you.
  *   **Positive Lib Looks Fine:** Portal gives you all the "tools" – filters for location, bedrooms, price caps. Even has a "matching assistant" using your profile data (income, family size, job location) to "help."

  **The Sneaky Algorithm (The Real Issue):**
  The matching assistant doesn't *just* filter. It **dynamically reorders and prioritizes the listings YOU see in real-time**, based on:
  1.  City's hidden "optimization goals" (e.g., "reduce school overcrowding," "balance neighborhood income mix," "maximize occupancy rates").
  2.  Predictive models (e.g., "applicants with X job type are 23% more likely to stay long-term").
  3.  Real-time demand pressure (e.g., suddenly de-prioritizing units in Zone Y because 5 other people looked at it in the last hour).

  **The Opaque & Uncontestable Bit:**
  *   You **never see the same list twice**, even refreshing the page. Why did that perfect unit disappear? Why are only units in *that* far-flung complex highlighted now? Dunno.
  *   No explanation given. The algorithm's weighting factors & predictive triggers are proprietary black boxes ("trade secrets").
  *   You can't appeal its prioritization decisions. There's no human or committee to complain *to* about *the system's choices* for you. The portal FAQ just says "results are dynamically personalized to increase match success!"

  **Where Republican Liberty Sliiiiides Away:**
  *   **Domination without a Dominator:** There's no human master pulling strings maliciously. But the *system itself* becomes an **arbitrary power source**. Its rules are hidden, unpredictable, and unchallengeable *by you*.
  *   **You're Subject to Uncontrolled Will:** The city's abstract goals ("balance income mix!") and the algorithm's hidden logic dictate your *effective* options moment-to-moment. You have no say in those rules, no way to know them, and no recourse if they shaft you.
  *   **The Servitude:** You're constantly adjusting *your* choices based on the system's whims. You feel like you have to "game" it (logging in at odd hours? lying about job type?), but you don't even know the rules of the game. Your freedom exists *at the mercy* of the code's opaque logic.
  *   **The Crack:** Republican liberty demands freedom from being subject to the *arbitrary will of another*. Here, the "another" isn't a person; it's an automated system operating with unchecked discretion based on hidden, potentially biased, or just plain weird rules. You're dominated by the *process itself*, even if no human intended *you* harm specifically. **The controller has no face, but the control is total and arbitrary.**

  **Bottom Line:** Looks free (can apply!), looks empowered (has tools!), but you're dancing to an algorithm's tune you can't hear or challenge. That's non-domination slipping into the void. Hope this works for the group! Gotta run.
