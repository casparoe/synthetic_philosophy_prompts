prompt: |-
  hey — quick ask. i'm running a grad session on Bongard problems and concept induction from minimal examples, mostly for philosophy of science students who've never touched cognitive psych. don't lecture me on teh problems themselves; i need a teaching plan. lay out the dependancy order: what idea has to be in place before they can see why induction here isn't just feature-listing? pick one carrying example — not the tired circle-vs-triangle ones, maybe an asymmetry case where negative space does the work — and say exactly what it needs to have and what it must avoid. then map the misconceptions in sequence: i think they'll default to 'pattern matching' and assume the left panel is always teh rule-set, maybe also conflate it with supervised learning — tell me where in the arc each pops up and how to cut it off before it hardens. what's the closing check that shows they've grasped the induction problem rather than just solved puzzles? and be explicit about what to leave out — maybe the 1960s AI history? — and say why. write it all as continuous prose, no headings or bullets or bold, like a long email.
reasoning: |-
  Okay, the user is running a grad session on Bongard problems and concept induction for philosophy of science students. They want a teaching plan that focuses on dependency order, using a specific example, addressing misconceptions, and a closing check. 

  First, I need to understand the user's constraints. They explicitly don't want a lecture on Bongard problems themselves, so I should avoid explaining what they are in detail. Instead, focus on the pedagogical structure. The students are from philosophy of science backgrounds with no cognitive psych exposure, so abstract concepts need grounding in concrete examples without jargon.

  The key request is about dependency order: what ideas must be established before students grasp why induction here isn't just feature listing. The core sequence should start from concrete recognition, move to hypothesis generation with minimal examples, then highlight the insufficiency of features. The asymmetry example (closed vs. open shapes with negative space) seems perfect because it forces attention on relationships rather than object properties. 

  For the example, I need something where negative space is crucial. Shapes with identical features but differing enclosure states would work—say left side has fully enclosed shapes (circle, square, etc.), right has identical shapes but broken (C-shape, U-shape). This makes the concept hinge on containment relationships, not shape features. Must avoid any hints about symmetry or numerical patterns, as those could distract from the relational aspect.

  Misconceptions to preempt: 
  - Pattern matching as feature-listing: Students might think listing attributes (e.g., "curved lines") solves it. This should surface immediately when they attempt the asymmetry example. Cut it off by asking why identical shapes appear on both sides. 
  - Left panel as rule-set: They may assume left defines "correct" examples. Address by emphasizing the problem’s symmetric structure—both sides are defined by their opposition. 
  - Conflation with supervised learning: Likely when discussing minimal examples. Contrast Bongard’s few examples versus big data, stressing hypothesis generation from constraints.

  Closing check: Don’t let them just solve a problem. Instead, have them articulate why a proposed feature-based solution fails for a new case (e.g., a triangle with a gap vs. solid). The win is when they frame it as "inferring relational constraints from absence."

  What to omit: 1960s AI history. It’s irrelevant to the conceptual jump needed and would eat up time. Focus purely on the cognitive mechanism.

  Structure the prose as a fluid email: start with setup rationale, walk through the example step-by-step with embedded misconception handling, end with the conceptual check. Keep it conversational but precise—philosophy students will appreciate nuanced phrasing.
answer: |-
  Here's how I'd structure it, thinking through the dependencies and traps, as if writing you directly:

  Start by grounding them in the core puzzle: Bongard problems present two panels (left/right) each containing six minimal visual examples. All left panel examples share one abstract relational rule, all right panel examples share a different (often opposing) rule, and the solver must induce that rule from *just* these twelve examples. Crucially, avoid calling them "positive" and "negative" examples initially – that language smuggles in assumptions about the rule's locus. The first dependency is establishing *what minimal examples afford*: not a buffet of features to list, but severe constraints forcing attention to *relationships*. They need to feel the poverty of the stimulus before you name it. Don't even mention "induction" yet; frame it as "what common condition must hold for an image to belong on the left, and what condition excludes it to the right, given *only* these?"

  Now, introduce your asymmetry/negative space example. Pick one where the *identical* shape appears on *both* sides, differing only in its contextual relationship. For instance: **Left Panel**: A closed shape (circle, square, triangle) *containing* a single smaller dot *strictly inside* it. **Right Panel**: The *same* closed shapes (circle, square, triangle) but now with the dot *touching* the boundary (on the line, not strictly inside). The rule hinges entirely on the dot's topological relation to the boundary (strict interior vs. boundary contact), exploiting negative space implicitly. This example *must* avoid: 1) Any variation in shape type or dot size (eliminates "circle vs triangle" or "big dot" fallacies), 2) Any numerical patterns (same number of shapes/dots), 3) Any symmetry or orientation cues. The *only* variation is the dot's relational state. This forces attention away from object features (all objects are identical across panels!) and onto the *spatial relation*. It also avoids the "left is rule-set" trap – the same shape can be left or right depending on the dot.

  The first misconception ("It's just listing features!") will erupt immediately as they scan. Let them try. Someone will say "Left has dots inside!" – good! But then show them a new, unseen example per the rule: a pentagon with a dot *clearly* inside. They'll agree it belongs on the left. Now show a pentagon with the dot *clearly* outside. They'll say right. Then show the critical test: a pentagon with the dot *exactly* on the boundary. Watch the uncertainty. Their feature-list ("inside/outside") fails; the rule requires precision about the *boundary itself*. This is where you pivot: "Your initial feature list worked for the *obvious* cases, but the minimal examples forced a boundary condition you hadn't considered. Induction here isn't *listing* observed features; it's *inferring* a precise relational rule that *explains the partition* – including why ambiguous cases *must* be excluded or defined." Highlight that the negative space (the boundary) became the active conceptual element.

  The "left panel is the rule-set" misconception often surfaces next. When you ask "What rule defines the LEFT?", they might articulate something plausible. Then ask: "So if that rule defines LEFT, what defines RIGHT? Is it just 'not left'?" Point to a right-panel example (dot on boundary). Ask: "Could this image *ever* appear on the left under your rule? No? Then isn't your 'left rule' *also* defining the right by exclusion?" Emphasize the *symmetry* of the problem – both panels define *contrasting* concepts via their exemplars. The rule is the *contrast* itself (interior vs. boundary contact), not a property owned by one side. This cuts off the "positive/negative" supervised learning conflation. Bongard isn't classifying into pre-given labels; it's inducing the *basis* for distinction from scratch.

  Finally, the supervised learning conflation needs explicit contrast. When discussing the minimal examples, stress: "In machine learning, you might get thousands of labeled images. Here, you get six per concept, total. You aren't *training a classifier*; you're a scientist generating a *candidate universal rule* from scant evidence that must cover all possible instances, even those not pictured (like the pentagon). It's hypothesis generation under radical uncertainty."

  The closing check isn't solving *another* problem. It's meta-cognitive. Present a *new*, unseen shape satisfying the dot-boundary rule for the right panel. Ask: "Why does this *belong* on the right? Not just the feature, but *what kind of rule* does this exemplify that your induction captured?" Then ask: "Suppose a student proposed the rule 'Left has dots not touching any line'. Why is this *inferior* to your rule, even if it fits the examples?" The win is if they articulate: 1) The inferior rule is disjunctive/fragile (it defines by absence), 2) Their rule is relational and necessary/sufficient, 3) The minimal examples *constrained* the rule space to force this precision, and 4) Induction here is about finding the *maximally constrained relational invariant* explaining the partition. If they grasp that the "problem" isn't the puzzle solution, but understanding how such sparse data can force abstract relational concepts, you've succeeded.

  Omit the 1960s AI history entirely. It's a distraction. Your goal is the *cognitive mechanism* of induction from minimal examples, not its historical application in early AI. Mentioning it risks turning philosophy students towards "tech history" rather than the conceptual puzzle. Also avoid deep dives into probabilistic models or formal logic unless a student drags you there; the core is the *phenomenology* of the inductive leap from few examples to a necessary relational rule. Focus on the shock of the boundary case and the failure of feature-listing – that’s where the philosophy bites. Good luck – this is a great topic for that audience.

  ---

  This approach sequences the dependencies: concrete example -> failed feature-listing -> relational insight -> rule symmetry -> contrast with supervised learning -> meta-cognitive check. The asymmetry example with identical shapes forces the key shift, and the misconceptions are addressed in the flow where they naturally arise.
