answer: |-
  Your observation captures a profound tension in intellectual property discourse—one that straddles the gap between economic/rivalry-based property logic and a **sovereignty-based model of epistemic territory**. This phenomenon lacks a single universally accepted term but is best conceptualized as **"Discursive Sovereignty"** or **"Epistemic Territoriality."** Below, I delineate its boundaries, contrast it with existing frameworks, and argue for its distinct conceptual status.

  ### Core Characteristics of the Model
  1. **Ideas as Territories**:  
     Ideas are framed as *spaces* (domains, regions, landscapes) rather than objects. Unauthorized use is "trespass" into bounded territory, not theft of a resource.  
  2. **Violation as Boundary-Crossing**:  
     The wrong lies in *failure to acknowledge jurisdictional boundaries*—using an idea without recognizing its originator’s "sovereignty" over its conceptual mapping.  
  3. **Non-Deprivation Harm**:  
     Harm stems from *misattribution* or *decontextualization*, disrupting the intellectual landscape’s topology. The originator isn’t deprived but *displaced* from their rightful position.  

  ### Contrast with Established Frameworks
  | **Framework**               | **Core Logic**                                      | **Why It Differs**                                                                 |
  |-----------------------------|-----------------------------------------------------|------------------------------------------------------------------------------------|
  | **Lockean Labor-Mixing**    | Ownership via labor investment in unowned resources | Treats ideas as *objects*; focuses on creation, not ongoing boundary maintenance. |
  | **Hegelian Personality**    | Ideas as extensions of selfhood/identity            | Centers on creator’s dignity, not the structural integrity of discursive space.    |
  | **Utilitarian IP**          | Incentives for innovation via temporary monopoly    | Justifies exclusion for social benefit, not boundary-respect as intrinsic good.    |
  | **Moral Rights (Droit Moral)**| Attribution/integrity as creator’s inherent right | Explains *plagiarism* but not the *spatial metaphor* for patents/concepts.        |

  ### Distinguishing Features & Unique Elements
  1. **Sovereignty vs. Property**:  
     - **Property**: Rights over a *thing* (exclusion via control).  
     - **Sovereignty**: Authority over a *domain* (jurisdiction, boundary enforcement).  
     *Example:* Patent "infringement" implies violating jurisdictional limits of a claim—like a state prosecuting illegal border-crossing, not theft.  

  2. **Cartographic Harm**:  
     Harm occurs when ideas are "misplaced" in the intellectual landscape, severing ties to their origin. This erodes:  
     - **Epistemic Accountability**: Ability to trace ideas to sources.  
     - **Discursive Ecology**: The relational structure of knowledge (e.g., citation networks as maps).  

  3. **Collective Dimension**:  
     Unlike moral rights (individual-centric), this model maintains *systemic order*. Plagiarism corrupts academia’s "map"; patent encroachment destabilizes innovation’s "territorial divisions."  

  ### Proposed Name: **Discursive Sovereignty**  
  **Defining Conditions**:  
  1. **Demarcation**: An idea/domain is publicly bounded (e.g., via citation, patent claims).  
  2. **Jurisdictional Recognition**: Users must acknowledge the boundary (attribution) or seek authorization (license).  
  3. **Violation Condition**: Unauthorized boundary-crossing *without situating the idea in its origin-context*.  
  4. **Harm Type**: Corruption of the intellectual landscape’s topology, not material loss.  

  ### Why It Merits Independent Status
  1. **Explains Metaphorical Consistency**:  
     Spatial rhetoric ("trespass," "territory") recurs because it reflects an intuition about knowledge governance that rivalrous property models cannot capture.  
     
  2. **Bridges Attribution and Exclusion**:  
     Moral rights cover attribution but not the *spatial exclusion* logic in patents. Discursive sovereignty unifies both under territorial logic.  

  3. **Applies Beyond Law**:  
     Manifest in open-source licensing (e.g., GPL’s "copyleft" boundaries), Indigenous traditional knowledge (protecting cultural/ceremonial "spaces"), and algorithmic IP (AI training data as "territory").  

  ### Limitations & Edges
  - **Not Universal**: Some ideas resist territorialization (e.g., mathematical truths). Applies best to *context-dependent* innovations (academic arguments, tech patents).  
  - **Distinct from Reputation**: While reputation harm may result, the core injury is *structural mislocation*, not personal insult.  
  - **Not a Legal Doctrine**: It’s a *conceptual model* explaining ethical intuitions; legal IP regimes often hybridize it with utilitarian/Lockean logic.  

  ### Key Thinkers & Foundations  
  - **Robert Nozick**’s boundary-crossing ethics (*Anarchy, State, and Utopia*).  
  - **Michel Foucault** on "author-function" and discourse territorialization.  
  - **Madhavi Sunder**’s cultural environmentalism (IP as "mapping" culture).  
  - **James Boyle**’s "second enclosure movement" metaphor.  

  ### Conclusion
  **Discursive sovereignty** is the missing framework for the phenomenon you describe. It treats ideas as territories governed by boundaries of attribution and context, where violation corrupts the architecture of knowledge itself. While overlapping with moral rights and personality theories, its focus on *systemic cartography* and *non-rivalrous exclusion* warrants distinct conceptual status. Naming it illuminates why we feel plagiarism "steals" nothing yet violates everything.  

  For further study:  
  - Sunder, M. (2006) *IP3* (Stanford Law Review) on "cultural sovereignty."  
  - Boyle, J. (2008) *The Public Domain* (Ch. 6: "The Second Enclosure Movement").  
  - Nozick’s "compensation principle" for boundary-crossing (pp. 57-87, *ASU*).
