  The user mentioned their own hypothesis about the burden of proof lying on unprovable metaphysical assumptions. That’s insightful. I should explore that angle. But first, I need to brainstorm multiple diagnoses to avoid jumping to conclusions. 

  Considering possible diagnoses: One could be a verbal disagreement where both use "free will" differently. Dennett uses a pragmatic, responsibility-entailing version, while Caruso means ultimate responsibility. Another diagnosis might be normative, where their differences stem from deeper values—Dennett valuing societal practices, Caruso focusing on fairness without ultimate responsibility. A third option could be burden-of-proof related: Dennett sees our current system as the default, while Caruso demands justification for practices based on possibly false metaphysics.

  Wait, the user is also asking about progress. If the disagreement is verbal, clarifying terms might help. If normative, we need to debate underlying values. For burden of proof, we might need pragmatic justifications. But maybe there's an empirical angle too, like public intuitions about free will affecting policy support. Studies like Nichols' or Knobe's could be relevant here.

  I should also consider if there's a deeper issue about metaphysics' role in ethics. Dennett might see metaphysics as irrelevant if practices work, while Caruso demands metaphysical grounding. This ties into the burden of proof. The user’s hypothesis seems strong here. 

  What would progress look like? Distinguishing concepts, empirical data on intuitions, or formal models of responsibility. But given the entrenched positions, maybe shifting focus to practical reforms without resolving metaphysics is better. Exploring hybrid systems that incorporate both forward-looking and limited retributive elements could be a way forward.

  The user’s identity as someone interested in why philosophical debates get stuck suggests they want a meta-analysis. They might be looking for a framework to analyze other stalemates, not just this one. Their deeper need could be understanding how to break such impasses or whether progress is possible at all. 

