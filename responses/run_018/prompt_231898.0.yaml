answer: |-
  This impasse is a fascinating microcosm of why fundamental philosophical debates often stall. Your instinct about the burden of proof is perceptive, but let's systematically dissect the disagreement before settling on a diagnosis. Here's a structured analysis based on your request:

  **Three Candidate Diagnoses:**

  1.  **Fundamentally Verbal Disagreement Masquerading as Substance:**
      *   **Diagnosis:** Dennett and Caruso are using the same terms ("free will," "desert," "responsibility") to pick out *radically different concepts*. Dennett defines "free will" functionally, as the capacities for self-control, deliberation, responsiveness to reasons, and avoidance of coercion/manipulation that make an agent an appropriate target of social practices like praise, blame, and (constrained) punishment. "Desert" for him is a pragmatic consequence of this appropriateness within a social system. Caruso, however, anchors "free will" and "basic desert" to *metaphysical ultimacy* – the ability to be the ultimate, buck-stopping originator of actions, independent of prior causes. He sees *this* as the folk intuition. Their disagreement stems from defining the core terms against incompatible conceptual backdrops.
      *   **Strength:** Explains why they talk past each other – they aren't *disagreeing* about the same thing, they are *defining* the contested terms differently from the start. Each rebuttal sounds like a non-sequitur to the other.
      *   **Weakness:** Doesn't fully account for the *normative* clash about punishment. Even if they agreed on definitions, they might still disagree on whether functional responsibility justifies retribution.

  2.  **Deeply Normative Disagreement Disguised as Metaphysical/Psychological:**
      *   **Diagnosis:** The core conflict isn't about determinism or the meaning of words, but about *fundamental values and the purpose of justice*. Dennett values the stability, predictability, and moral engagement fostered by existing responsibility practices (even if metaphysically modest). He sees retributive *elements* (properly constrained) as psychologically and socially functional tools for maintaining norms and expressing community values. Caruso prioritizes *fairness* grounded in ultimate control and the avoidance of intrinsic harm ("basic desert" punishment). He values a justice system focused purely on harm reduction, rehabilitation, and incapacitation, seeing retribution as inherently unjust without ultimacy. Their metaphysical arguments are secondary justifications for these prior normative commitments.
      *   **Strength:** Explains the persistence and heat of the debate – it's about what *matters* most in justice (social function vs. intrinsic fairness). It accounts for why evidence about folk intuitions or psychological mechanisms doesn't resolve it, as each side interprets it through their normative lens.
      *   **Weakness:** Risks oversimplifying their arguments. Both offer sophisticated metaphysical and psychological reasoning; it's not *just* values shouting past each other. The metaphysical disagreement feels genuine, even if motivated.

  3.  **Clash of Burdens of Proof Regarding Metaphysical Underpinnings (Your Hypothesis):**
      *   **Diagnosis:** The impasse hinges on where the burden of proof lies when a deeply ingrained social practice (like retributive justice) is challenged on metaphysical grounds (determinism undermining ultimate responsibility). Dennett adopts a *pragmatic conservatism*: The existing practice works reasonably well (in his view) to fulfill important social functions; the challenger (Caruso) bears the heavy burden of proving both that the practice *fundamentally requires* the threatened metaphysical foundation *and* that their proposed alternative is clearly superior. Caruso adopts a *revisionist foundationalism*: If the practice *claims* (explicitly or implicitly) to rest on a metaphysical foundation (ultimate responsibility) that is likely false (given determinism/science), the burden shifts to the defender (Dennett) to either show the foundation isn't needed or isn't actually threatened. Alternatively, without ultimacy, the harm of retribution becomes intrinsically unjustifiable, shifting the burden.
      *   **Strength:** Directly addresses your hypothesis and explains the repetitive structure – Dennett keeps saying "Compatibilism works, why scrap it?", Caruso keeps saying "But you lack the *real* foundation, scrap the injustice!" It highlights the meta-philosophical dispute about justification.
      *   **Weakness:** Doesn't fully negate the verbal or normative elements; the burden clash might be *symptomatic* of those deeper differences.

  **Synthesized Diagnosis:**

  The disagreement is **multifaceted, but the primary engine of the impasse is a combination of the Verbal Disagreement and the Burden of Proof clash, fueled by underlying Normative differences.**

  1.  **Verbal Core:** They genuinely are talking past each other on the core terms "free will" and "basic desert." Dennett uses a *compatibilist functionalist* definition, Caruso uses an *incompatibilist metaphysical* definition. Until this is explicitly mapped and acknowledged, productive argument is nearly impossible.
  2.  **Burden of Proof as Amplifier:** This verbal disconnect *manifests* as the burden clash. Dennett argues *from within* the functionalist framework: "Look, we have this concept (FW_Compat) that justifies these practices (P_RetribLite), and it survives determinism. Why change?" Caruso argues *from outside*: "But the concept your practices *really rely on* (FW_Ultimate) is incoherent/false, so the practices (P_RetribPure) they justify are illegitimate. You must justify them anew without that foundation or change them." Each sees the other as failing to meet the burden *as they define it*.
  3.  **Normative Fuel:** Underpinning both is the normative difference. Dennett sees significant value in the expressive, norm-sustaining functions of (moderate) blame and retribution within a compatibilist framework. Caruso sees no value (only harm) in retribution without ultimacy and prioritizes a different set of values (fairness, harm reduction, rehabilitation) achievable through non-retributive means. This motivates their respective stances on the burden and makes compromise difficult.

  **What Kind of Disagreement Is It?**

  It's **all of the above, simultaneously:**
  *   **Verbal:** Different definitions of core terms.
  *   **Substantive:** Genuine disagreement about the necessity of ultimacy for desert, the viability of compatibilism, and the functional vs. intrinsic nature of retribution's justification.
  *   **Normative:** Deep difference in values regarding the purpose of justice and the permissibility of harm (retribution).
  *   **Different Questions:** Dennett: "How can responsibility and justified blame/punishment work *within* a deterministic universe?" Caruso: "Is *ultimate* responsibility possible, and if not, is *any* retribution morally permissible?"

  **Hidden Empirical/Formal Elements?**

  *   **Empirical (Folk Intuitions):** Both appeal to "what ordinary people mean." Progress requires rigorous empirical psychology (e.g., Shaun Nichols, Joshua Knobe, Eddy Nahmias) mapping folk concepts. Do people *actually* have a unified concept? Is it more compatibilist or incompatibilist? Is it context-dependent? This data can challenge *assumptions* each makes about their starting point but won't resolve the normative burden clash.
  *   **Empirical (Justice Outcomes):** Does retributive practice (moderate or pure) achieve better/worse outcomes (deterrence, recidivism, victim satisfaction, social cohesion) than non-retributive alternatives? This is crucial for Dennett's functional justification and Caruso's public health model. If one system demonstrably outperforms the other *on agreed-upon metrics*, it could shift the pragmatic burden.
  *   **Formal (Models of Responsibility):** Can formal models (e.g., from computer science, game theory) clarify different responsibility concepts (e.g., attributability, answerability, accountability) and their relationship to sanctions? This could help disentangle the verbal knot.

  **What Would Count as Progress?**

  Given the diagnosis, progress is hard but possible:

  1.  **Conceptual Cartography:** Explicitly mapping the distinct concepts in play (FW_Compat, FW_Ultimate, Desert_Functional, Desert_Basic, Punishment_Retributive, Punishment_Quarantine) and agreeing *which* combination each is arguing for/against. Philosophers like Manuel Vargas ("Revisionism") and Tamler Sommers ("Deep Self" critiques) try this. *This is essential first-step progress.*
  2.  **Burden Negotiation:** Explicitly debating *where the burden lies* and *why*. Is it on defenders of current practice? On challengers proposing radical change? On those invoking unprovable metaphysics? Can a neutral "default" position be agreed upon?
  3.  **Empirical Input:**
      *   **Folk Intuitions:** Using better data to inform the descriptive claims about what concepts underpin our practices or intuitions. Does this support a "mixed" view?
      *   **System Efficacy:** Rigorous comparative studies of different justice models (retributive, rehabilitative, restorative, quarantine) on multiple metrics (recidivism, cost, fairness perceptions, victim healing, social trust). This could shift the *pragmatic* argument significantly.
  4.  **Normative Engagement:** Moving past "strawmanning" each other's values. Can Dennett articulate the *inherent* value (beyond pure utility) of compatibilist blame? Can Caruso address concerns about the expressive function of justice or potential abuses of a pure "quarantine" model? Is there common ground on core values (safety, fairness, human dignity)?
  5.  **Hybrid Solutions:** Exploring whether elements of both views can coexist. E.g., a system primarily focused on public health/quarantine/rehabilitation *but* preserving a compatibilist notion of *accountability* and *answerability* that allows for *some* expressive, non-harm-focused forms of censure or recognition of agency within the process. (This is arguably where Dennett leans, but Caruso might reject any retributive element).
  6.  **Reframing:** Shifting the question from "Is there free will (Ultimate or Compat)?" to "What constellation of capacities makes an agent an appropriate target of which kinds of responses (praise, blame, sanctions, therapy, incapacitation) for which purposes (moral expression, norm maintenance, deterrence, rehabilitation, safety) in a deterministic world?"

  **Should we stop expecting progress?** No, but expectations need calibration. Absolute resolution of the metaphysical core is unlikely. Progress will likely be:

  *   **Incremental:** Better understanding the facets of the disagreement.
  *   **Conceptually Clarifying:** Sharpening the definitions and distinctions.
  *   **Pragmatically Informative:** Using empirical data to assess the real-world consequences of different approaches, forcing adjustments to *practical* proposals even if metaphysics remain contested.
  *   **Normatively Richer:** Developing more sophisticated accounts of value within deterministic frameworks.

  The Dennett-Caruso debate highlights a persistent philosophical fissure. Progress won't come from one side "winning," but from meticulously untangling the threads of language, metaphysics, burden, and value that keep the conversation spinning, and then focusing energy on the threads where traction (conceptual, empirical, normative) might actually be possible. Your focus on the burden of proof is a crucial thread to pull.
