  **MEMORANDUM**  
  **TO:** All Clinical Staff, Ethics Committee Members, Resource Allocation Panels  
  **FROM:** Clinical Ethics Oversight Board (CEO Board)  
  **SUBJECT:** Policy CE-47 Rev. 3: Operationalization of the Harm Causation Distinction (Doing/Allowing Framework)  
  **POLICY NUMBER:** CE-47.03  
  **EFFECTIVE DATE:** Immediately  
  **SUPERSEDES:** CE-47.02  
  **APPROVED BY:** Dr. A. Ristotle, Chair, CEO Board  
  **DISTRIBUTION:** Mandatory Acknowledgment Required via LMS Portal within 72 Hours  

  ---

  **1.0 Purpose**  
  To establish standardized, auditable procedures for distinguishing between *actively causing harm* (Intervention/Commission) and *passively permitting harm* (Non-Action/Omission) in all clinical decisions impacting patient mortality, thereby ensuring ethical compliance and mitigating institutional moral liability.  

  **2.0 Scope**  
  Applies to all licensed clinical personnel, ethics consult teams, and resource allocation committees during patient care, withdrawal of life-sustaining treatment (WLST), and resource prioritization decisions.  

  **3.0 Definitions**  
  *   **3.1 Intervention (Commission):** Any discrete, chartable act performed by an agent (e.g., clinician) that *initiates* a causal sequence foreseeably leading to harm. Scored as **+I**.  
  *   **3.2 Non-Action (Omission):** The absence of an act where an act was possible and expected, thereby *permitting* a pre-existing causal sequence to proceed to harm. Scored as **+N**.  
  *   **3.3 Moral Causation Ledger (MCL):** Real-time digital platform (Integrated with EMR v.8.2+) logging all clinician-patient interactions. Staff must categorize each action/inaction per Sections 3.1 & 3.2.  
  *   **3.4 Intervention-Omission Ratio (IOR):** Individual/Unit-level compliance metric (**Σ+I / Σ+N**) calculated weekly. IOR must remain between **0.8 and 1.2** (Goldilocks Compliance Zone™). Ratios <0.8 indicate excessive passivity; >1.2 indicate excessive agency. Non-compliance triggers mandatory ethics remediation.  
  *   **3.5 Harm:** Defined operationally as death or irreversible decline towards death directly traceable to a logged +I or +N event.  

  **4.0 Procedure**  
  *   **4.1 Real-Time Ledger Entry:** During any action/decision with potential mortality impact:  
      *   4.1.1 Pause for ≥ 3 seconds (reflection buffer).  
      *   4.1.2 Select **[INTERVENTION]** or **[NON-ACTION]** on MCL touchscreen/voice-command.  
      *   4.1.3 Select pre-defined sub-code (e.g., **I-12a: Administered Lethal Substance**; **N-7d: Withheld Pressors Despite Availability**). "Unlisted Action" requires CEO Board pre-approval via Form CE-47F1.  
  *   **4.2 IOR Maintenance:** Unit Managers must audit IOR dashboards daily. Out-of-Zone IORs require immediate corrective action plans (Form CE-47CAP). Weekly IOR reports submitted to JCAHMO (Joint Commission on the Administration of Harm & Moral Outcomes).  
  *   **4.3 Edge Case Protocols:** See **ATTACHED FAQ: CE-47.03-1**.  

  **5.0 Compliance**  
  Failure to maintain IOR within Zone or inaccurate MCL logging constitutes an Ethical Practice Violation (EPV), subject to progressive discipline per HR Policy ETH-9.  

  ---

  **ATTACHMENT: FREQUENTLY ASKED QUESTIONS (FAQ) - CE-47.03-1**  

  **FAQ 1: Ventilator Alarm Audibility Reduction**  
  *Q: Does pressing the "Silence Alarm (15s)" button on a ventilator during a terminal wean constitute an Intervention (+I) against the *alarm* (harming its function) or a Non-Action (+N) regarding the *patient* (failing to respond to hypoxia)?*  
  *A: This is a **Dual Categorization Event**. Silence button press = **+I (Code I-22c: Device Function Alteration - Non-Therapeutic)**. Concurrent failure to immediately reinstate prior settings or escalate care = **+N (Code N-4a: Permitted Device-Derived Physiological Decline)**. Two distinct MCL entries are required.  

  **FAQ 2: Feeding Tube Status Ambiguity**  
  *Q: How is WLST via nutrition/hydration withdrawal logged when a feeding tube is physically in situ but has been set to "OFF/HOLD" for 72 hours? Is flipping the "ACTIVATE" switch to "OFF" an Intervention (+I), or is the ongoing non-delivery a Non-Action (+N)?*  
  *A: Physical manipulation of the switch from ON to OFF is **+I (Code I-15b: Active Cessation of Sustenance Delivery Apparatus)**. Subsequent hours where the tube remains in place but inactive are logged as **Continuous +N (Code N-8e: Sustained Omission of Caloric Provision - Apparatus Present)**. Log one initial +I and a daily +N entry for duration.  

  **FAQ 3: Resource Allocation Committee (RAC) Decisions**  
  *Q: When a RAC denies a scarce ICU bed to Patient A (who subsequently dies), assigning it to Patient B, is this "allowing" Patient A's death (Omission) or "doing" harm via distributive injustice (Commission)?*  
  *A: RAC decisions constitute **Structured Non-Action (+N)**. The RAC does not *create* scarcity; it administers pre-existing scarcity. Denial is coded as **N-11a: Resource Non-Allocation - Standard Triage Protocol Applied**. The harm sequence (scarcity) pre-exists the committee's meeting. Actively reassigning a bed *away* from a patient already using it would be +I.  

  **FAQ 4: Family Request for "Everything Done"**  
  *Q: If a family demands non-beneficial CPR (futile care) and the team complies, generating avoidable harm (e.g., rib fractures), how is this logged?*  
  *A: Compliance with a valid surrogate request transforms agency. Performing CPR is logged as **+N (Code N-12: Action Under Valid Surrogate Directive - Foreseeable Iatrogenic Harm Permitted)**. The harm is understood as *permitted* (via surrogate agency) rather than actively *caused* by the clinician's commission. Refusing the request would be **+I (Code I-18d: Override of Surrogate Request - Life-Sustaining Treatment)**. Ensure IOR impact is calculated accordingly.  

  **FAQ 5: Pharmacological Nuance**  
  *Q: Is titrating a morphine drip for comfort in a dying patient an Intervention (+I causing respiratory suppression) or a Non-Action (+N regarding untreated suffering)?*  
  *A: Titration is **+I (Code I-9f: Analgesic Dose Adjustment)**. However, the *intent* (comfort) is logged in the "Mitigating Factor" field. Untreated suffering itself is **not** logged as a prior harm sequence permitting +N; only physiological decline towards death qualifies. The IOR impact of +I entries for comfort care is offset by a **0.7 Intent Modifier** during weekly calculation to prevent inappropriate ratio inflation.  

  ---  
  **END OF DOCUMENT**
