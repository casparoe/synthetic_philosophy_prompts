prompt: |-
  I'm trying to work out what I actually think about advance directives by testing my gut reactions on cases, and I'd like to know what principle, if any, unifies my verdicts. First: a woman executes a detailed directive at forty refusing all life-prolonging treatment should she develop advanced dementia; she is now deeply demented, visibly content, and has pneumonia that antibiotics would cure -- I say withhold treatment. Second: same facts, except that she now, in her demented state, says she wants to live -- I still say withhold, though less confidently. Third: a man with bipolar disorder, while stable, signs a Ulysses contract authorizing involuntary hospitalization during manic episodes; he is now manic and refuses admission -- I say enforce the contract. Fourth: a man signed a directive refusing resuscitation twenty years ago; he is now fully competent, tells his doctors he's changed his mind, but has never updated the paperwork -- I say follow his current words, not the document. Fifth: a healthy twenty-five-year-old writes a directive refusing ventilation if she is ever paralyzed, based on what she imagines quadriplegia would be like; years later she is quadriplegic, has adapted, and values her life -- I say the earlier self simply didn't know what she was choosing, and the directive deserves little weight. Is there a principle that captures all five verdicts, stated precisely enough to say which features do the work -- competence, knowledge, the identity of the later self? If the principle has to overturn one of my verdicts (I suspect the second and fourth pull against each other), tell me which one goes and why. And tell me what it implies for the case I haven't listed: a directive requesting active euthanasia once dementia reaches a specified stage.
reasoning: |-
  Okay, the user is trying to figure out their stance on advance directives by examining their reactions to different scenarios. They've presented five specific cases and want to know if there's a unifying principle. Let me start by breaking down each case.

  First case: Woman with dementia, directive to withhold treatment, now content but has pneumonia. User says withhold treatment. Here, the past self's directive is respected despite her current contentment. The key might be that she made the decision when competent and aware of future possibilities.

  Second case: Same as first, but now she says she wants to live. User still withholds treatment but less confidently. This is tricky because the current self is expressing a preference. However, the user sticks with the directive. Maybe because the dementia affects her ability to understand her situation?

  Third case: Bipolar man's Ulysses contract during mania. User enforces it. The past competent self's decision overrides the current manic state. Competence at the time of signing is crucial here, and recognizing that mania impairs judgment.

  Fourth case: Man changed his mind about resuscitation but didn't update paperwork. User follows current words. Current competence trumps past written directive. The directive is outdated because he's competent now and explicitly revoked it.

  Fifth case: Young woman refuses ventilation, later adapts to quadriplegia. User disregards directive because she lacked experience. The past self's ignorance invalidates the directive; current self's lived experience matters more.

  Looking for a common thread. All cases involve balancing past and present selves. Factors like competence, knowledge, and identity shifts are in play. The principle might be: "Respect prior directives only if they were made competently and with adequate knowledge, unless superseded by a competent current expression of will."

  But in the second case, the demented woman says she wants to live. Why still withhold? The user might view her current self as not competent to assess her situation due to dementia. Whereas in the fourth case, the man is competent now, so his current wishes override. Competence of the current self seems key. 

  In the fifth case, the past self lacked experiential knowledge, so the directive is discounted. Similarly, in the euthanasia case, if the directive specified conditions when competent and knowledgeable, it might be binding unless the current self (even if demented) expresses opposition. But if the current self is incompetent, the directive stands. 

  The conflict between second and fourth cases: second overrides current wish due to incompetence; fourth honors current wish due to competence. So the principle hinges on current competence. 

  For the euthanasia case: if the directive was informed and specific, and current self is incompetent (e.g., severe dementia), then proceed. But if the current self can express a desire to live, even if not fully competent, that might create a dilemma. The user's principle might require considering whether the current expression is autonomous. If not, defer to the past directive. But the user in the second case overrode the current wish, so perhaps they prioritize past competent self over current non-autonomous expressions.
answer: |-
  Your verdicts reveal a coherent principle prioritizing **current experiential interests and decisional competence,** with prior directives respected *only* when they reflect informed, competent choices that align with the *demonstrated values and understanding* of the current self—or when the current self lacks competence to reassess. This principle has two core components:

  1.  **The Primacy of Current Competence & Knowledge:** If the individual is **currently competent and capable of understanding their situation,** their contemporaneous wishes override any prior directive (Cases 4 & 5).
  2.  **Respect for Prior Self *Only* When Current Self Cannot Competently Reassess:** If the individual **lacks current competence to understand or reassess their directive,** the prior directive is binding *if and only if* it was made competently and with adequate knowledge/projection. If the prior directive lacked adequate knowledge or competence, it is discounted (Cases 1, 2, 3, 5).

  **Applying the Principle to Your Cases:**

  1.  **Withhold Treatment (Dementia, Content):** *Principle Applied:* Current self is incompetent and cannot reassess. Prior directive was competent and detailed (presumably informed). *Respect prior self.*
  2.  **Withhold Treatment (Dementia, Says "Want to Live"):** *Principle Applied:* **This is the verdict the principle challenges.** Current expression ("want to live") arises from profound incompetence (inability to grasp illness, prognosis, or prior values). It doesn't reflect a *competent reassessment*. Prior directive was competent and informed. *Principle dictates respect prior self (withhold), BUT your discomfort highlights the weight of current expression even if non-autonomous.* **Your verdict stands, but weakly.**
  3.  **Enforce Contract (Bipolar Mania):** *Principle Applied:* Current self is incompetent (manic impairment). Prior directive (Ulysses contract) was made competently (stable) and specifically addressed the predictable loss of competence. *Respect competent prior self.*
  4.  **Follow Current Words (Competent, Changed Mind):** *Principle Applied:* Current self is fully competent and explicitly revokes the prior directive. *Respect current competent self.*
  5.  **Disregard Directive (Quadriplegia, Adapted):** *Principle Applied:* Prior directive lacked *adequate knowledge* (based on imagination, not experience). Current self is competent and demonstrates a reevaluation based on lived experience and adapted values. *Respect current competent self and discount uninformed prior directive.*

  **The Unifying Principle (Stated Precisely):**

  > **"A prior directive is binding only if:**
  >    **(a) It was made competently and with adequate knowledge/projection of the relevant future state; AND**
  >    **(b) The individual now lacks the competence to understand their current situation and reassess the directive in light of lived experience.**
  >
  > **Otherwise, the contemporaneous expression of a competent individual takes precedence, or the directive is discounted if condition (a) is unmet."**

  **Key Features Doing the Work:**

  1.  **Current Competence:** This is the paramount factor (Cases 4 & 5). If present, it trumps prior directives.
  2.  **Adequacy of Prior Knowledge/Projection:** The prior self's authority depends on the quality of their understanding when making the directive. Abstract fear (Case 5) vs. specific anticipation of dementia (Cases 1 & 2) or mania (Case 3) matters critically.
  3.  **Identity/Continuity of Values:** The principle implicitly judges whether the *values* underlying the prior directive still apply to the current self *as it exists*. If the current self demonstrably holds different values *and* is competent (Case 5), or if the prior directive didn't truly project the current state (Case 5), continuity is broken. In dementia (Cases 1 & 2), the prior self is seen as the "true" self with authority over the incompetent future self.
  4.  **Nature of Current Expression:** Expressions from incompetent selves (Case 2 demented "want to live," Case 3 manic refusal) are given little weight as they aren't autonomous reassessments. Competent expressions (Cases 4 & 5) are definitive.

  **Resolution of the Tension (Case 2 vs. Case 4):**

  *   **Case 4 (Competent Now):** Current competence wins decisively.
  *   **Case 2 (Incompetent Now):** Prior competent directive wins *because* the current self lacks competence to reassess. The current expression ("want to live") is a product of the dementia and doesn't reflect an autonomous rejection of the prior directive's values. **Your principle logically requires upholding the prior directive in Case 2, even though it feels less confident.** Your discomfort stems from the moral weight of *any* expression of will, but the principle prioritizes autonomous will (past) over non-autonomous expression (present).

  **Implication for the Euthanasia Directive:**

  *   **Scenario:** A directive competently executed, requesting active euthanasia once dementia reaches a specified stage (e.g., inability to recognize loved ones, total dependence). The specified stage is reached. The demented individual appears content but cannot understand the directive, euthanasia, or their prognosis.
  *   **Application of Principle:**
      *   **(a) Prior Competence/Knowledge:** Directive was competent and specific about the future state. (Assume adequate projection/knowledge).
      *   **(b) Current Competence to Reassess:** Individual now profoundly incompetent. Cannot understand the choice, the directive, or their situation in a way that allows reassessment.
  *   **Verdict by Principle:** **The directive should be followed.** Active euthanasia should be performed.
  *   **Why:** The principle gives decisive weight to the competent prior self's informed choice when the current self lacks the capacity to reassess that choice autonomously. The current contentment, like in your Case 2, is seen as arising from the incompetence and doesn't constitute a competent affirmation of continued life that overrides the prior directive. This respects the autonomy exercised when competence existed to make such a profound decision about a future state of profound incapacity.

  **Conclusion:** Your gut reactions are unified by a principle emphasizing **current decisional capacity and adequate prior knowledge** as the gatekeepers for respecting prior directives. It prioritizes the autonomous self, whether past or present, over the non-autonomous expression of an incompetent self. This principle requires upholding the directive in your second case, despite your discomfort, and would mandate following a specific euthanasia directive in advanced dementia. The hardest cases involve expressions from incompetent selves (your Case 2, the euthanasia case), where the principle strictly sides with the prior competent self.
