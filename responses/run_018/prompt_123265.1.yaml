answer: |-
  Here's a joke crafted specifically for your economist character, hitting both Keynesian concepts while sounding like natural dinner party banter:

  **Economist:** *(Sipping wine, turning to the Tech Bro)* You know, Keynes predicted we'd all be working fifteen-hour weeks by now. Solved the scarcity problem, he thought. Absolute needs – food, shelter, security – *poof*, handled by machines and efficiency. He was right about that part!  
  **Tech Bro:** *(Smirking)* So why are we still grinding? Glitch in the system?  
  **Economist:** Ah, that's the rub. Keynes saw the *next* problem coming a mile off, bless him. He figured once absolute needs were met, we'd be off enjoying Shakespeare and strolling through galleries... *if* we were taught how.  
  **Tech Bro:** Taught how to chill? Seriously?  
  **Economist:** *Precisely!* But he underestimated the other force: relative needs. See, solving absolute scarcity just freed us up to focus laser-like on the scarcity that *can't* be automated: status. Being *better off* than the Joneses. Your fancy watch, his faster jet, her bigger virtual island...  
  *(Leans in slightly)*  
  **So here we are: Keynes was right we’d solve hunger, but wrong we’d learn to paint. Instead, we just got* ***really*** *good at inventing new kinds of hunger. Turns out, when no one teaches you to enjoy the garden, you just keep digging a bigger hole to impress the guy next door.*"

  **Why it works for your scene:**

  1.  **Absolute Needs Solved:** Explicitly mentions solving the "scarcity problem" (absolute needs) via efficiency/machines.
  2.  **Relative Needs Driving Work:** Directly names "relative needs" and "status" as the new engine, explaining why work persists ("inventing new kinds of hunger," "digging a bigger hole").
  3.  **Leisure Education Failure:** Highlights Keynes' key elitist blind spot – "wrong we’d learn to paint," "no one teaches you to enjoy the garden". This is crucial and often overlooked.
  4.  **Specific Punchline:** The punchline ("Turns out, when no one teaches you to enjoy the garden, you just keep digging a bigger hole to impress the guy next door") ONLY lands if you grasp both:
      *   The unsolved problem of *relative* needs/status competition ("digging a bigger hole," "impress the guy next door").
      *   The failure of society/education regarding leisure ("no one teaches you to enjoy the garden").
  5.  **Avoids Generic Capitalism Trap:** It's specifically about the *interplay* of solved absolute needs, unsolved relative needs, and the neglected leisure education. It's nuanced Keynes, not just "capitalism bad."
  6.  **Casual & Characterful:** Uses accessible metaphors (garden, digging a hole, Joneses) and fits an aging academic's slightly weary, wry delivery ("bless him," "Precisely!", "Turns out...").

  Feel free to tweak the phrasing ("faster jet," "virtual island") to better match your tech bro's specific brand of status symbols! Good luck with the scene and the keyboard!
