  Me and Jordan had this brutal three-hour argument last night about the Rietdijk-Putnam block universe stuff and I still can't tell if she's a full-on four-dimensionalist or just a conventionalist about simultaneity. I need you to predict her verdict on a weird case I cooked up, because I'm trying to figure out which rule she's actually running before we talk again.

