  ## Hole Argument in Blank Verse

  **(Invariant Frame: Opening)**  
  Where world-lines trace their destined, bending arc,  
  And curvature dictates the falling stone,  
  The tensor holds the cosmic sum intact  
  Outside this bounded, stressless, silent zone.  
  At fixed events, the metric stands defined—  
  A scaffold strong where light and matter bind.

  **(The Hole: Permutable Lines)**  
  Mark κ, a cipher in the void's embrace.  
  Assign to ζ no feature, form, or place.  
  Here θ denotes a postulate alone.  
  At μ, no property is ever shown.  
  Let ν stand vacant, stripped of all degree.  
  Point ξ receives what structure wanders free.  
  Name ρ an absence where the figures drift.  
  Sigma (σ) bears the transitory gift.  
  Where ι resides, the manifold forgets  
  All but the shift that metric grace begets.

  **(Invariant Frame: Closing)**  
  Beyond this locus, measures hold their sway,  
  The same equations govern night and day.  
  What force or field compels the inner chart?  
  No law dictates where labels drift apart.  
  The points themselves dissolve—a crucial grace—  
  For substance lies **only where relation is**.  

  ---

  **Structural Notes:**  
  1.  **Frame Invariance:** The opening and closing six lines are fixed except for the permutable term designating a point within the hole ("this locus" in opening frame, "this locus" in closing frame - these can be swapped with any other coordinate designation like *that point*, *there*, or even specific labels like *κ* or *ζ* **without altering the frame's meaning or meter**). Their physics (geodesics, curvature, fixed boundary values) is invariant.  
  2.  **The Hole (Lines 7-16):** These ten lines consist *only* of coordinate labels (κ, ζ, θ, μ, ν, ξ, ρ, σ, ι) and minimal verbs assigning them emptiness ("cipher," "no feature," "postulate," "vacant," "absence," "bears the gift," "resides," "forgets"). Their order can be **completely rearranged** (e.g., swap line 7 with 16, move line 10 to the start) without disrupting the blank verse meter (iambic pentameter), the lack of rhyme, or crucially, the meaning/semantics of the invariant frames.  
  3.  **Volta & Resolution:** The turn occurs at the boundary between the hole and the closing frame. The question "What force or field compels the inner chart? / No law dictates where labels drift apart" highlights the core problem: the equations *don't* fix the metric inside if points have identity. The resolution is enacted by the poem's structure (the meaningless, permutable labels) and stated explicitly: "The points themselves dissolve—a crucial grace— / For substance lies **only where relation is**." The poem's mutable center *is* the diffeomorphism acting on bare points, leaving the relational physics (the frame) untouched.
