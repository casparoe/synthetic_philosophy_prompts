answer: |-
  Your intuition cuts deep into the heart of the debate. You're right: the core disagreement isn't *just* about language (incommensurability), progress (accumulation vs. revolution), or truth (realism vs. anti-realism). It's about **the normative constraints on scientific explanation during theory change** – specifically, **what phenomena a successor theory is obligated to "save" or reconceptualize, and what it can legitimately discard or redefine.**

  Here's a diagnosis of the stalemate and why your "explanation-targets" idea captures a crucial, often overlooked dimension:

  ### Why the Stalemate Persists
  1.  **Conflated Questions:** The debate mixes:
      *   *Descriptive/Historical:* How *do* scientists actually negotiate meaning and explanation across paradigms? (e.g., Did Einstein *feel* he was explaining the same gravity as Newton?)
      *   *Normative/Philosophical:* How *should* we understand the relationship between theories? What *must* a successor theory do to legitimately claim it explains "the same thing"?
      *   *Semantic:* What *is* the reference of terms like "gravity"? Is it fixed by phenomena, theoretical role, or something else?
      *   *Meta-Philosophical:* What *counts* as a "good explanation" or "the same phenomenon"? This is often where intuitions diverge.

  2.  **Hidden Normative Commitments:** Beneath surface arguments lie unstated values about science:
      *   **Preservationists:** Prioritize continuity of *phenomenal content*. A new theory *must* account for (or show why we were wrong about) all past *observations/data* deemed relevant under the old theory. Science owes a debt to past empirical success.
      *   **Reconceptualizers/Pragmatists:** Prioritize continuity of *explanatory domain* or *problem-solving power*. A new theory can radically redefine the *nature* of the entities/processes involved (e.g., force-at-a-distance -> spacetime curvature) as long as it addresses the *same broad class of problems* (e.g., planetary motion, falling apples, tides) *better* and provides a more fundamental understanding. Past observations are revisable interpretations.
      *   **Revolutionaries:** Prioritize theoretical coherence and fundamental ontology. A new theory can declare past observations *misinterpreted* or even *irrelevant* if they stem from a fundamentally flawed conceptual framework. Science owes nothing to the past beyond inspiration.

  3.  **Lack of a Neutral Arbiter:** There's no theory-independent way to define "the phenomenon of gravity itself." Is it:
      *   The *observations* (apples fall, planets orbit)?
      *   The *theoretical role* (the cause of those motions)?
      *   An *underlying entity/process* (force? curvature? quantum entanglement?)? Different sides pick different starting points.

  ### Your "Explanation-Targets" Idea: Hitting the Mark
  You've identified the core normative question: **What are the legitimate "targets of obligation" for a new explanation?**

  *   **Phenomena-Preservation View:** The primary target is *saving the phenomena* – all the established observational data. Newton observed planetary orbits, tides, falling objects; Einstein *must* explain those same data points (even if reinterpreting their cause). Failure to do so means he hasn't explained *gravity* (as empirically known).
  *   **Problem-Domain/Reconceptualization View:** The primary target is *solving the same class of physical problems* more accurately/coherently. Newton tackled motion under "gravitas"; Einstein tackles motion under "gravitation" as a geometric effect. The *problems* (predicting trajectories, orbits, etc.) are continuous, even if the *conceptualization* of *what gravity is* changes radically. Explaining *why* Newton's laws worked so well within their domain becomes part of the new explanation.
  *   **Ontological-Replacement View:** The primary target is *describing fundamental reality*. Newton was fundamentally *wrong* about the nature of gravity (instantaneous force); Einstein describes what gravity *actually is* (spacetime curvature). Old "observations" might be artifacts of the wrong framework or approximations. True explanation supersedes past misinterpretations.

  ### Can the Stalemate be Broken? Potential Paths (and Obstacles)

  1.  **Case Studies (with Nuance):** Looking closely at *how* scientists actually argue during transitions helps, but rarely settles the normative question.
      *   **Einstein & Mercury's Orbit:** Einstein saw GR *explaining* a known anomaly in Newtonian predictions (Mercury's perihelion precession) as crucial evidence. This supports the "Phenomena-Preservation" view *for that specific data point*. But his *justification* was the coherence of GR's ontology (Reconceptualization/Ontological view).
      *   **Phlogiston vs. Oxygen:** Did Lavoisier explain "combustion" or discover a *different phenomenon*? Pro-Preservation: He explained *why things burn and gain weight* (the original phenomenon). Pro-Reconceptualization: He redefined combustion *as* oxidation, making phlogiston-based "combustion" a misinterpretation. Pro-Ontological: Phlogiston doesn't exist; oxygen does. The debate *replicates* the philosophical stalemate within history.
      *   **Obstacle:** Historians and philosophers can interpret the *same* episode through *different* normative lenses. Success often looks like "saving the right phenomena while redefining the essence."

  2.  **Pragmatic Success:** The overwhelming empirical success of theories like GR lends weight to the Reconceptualization view. It solved Newton's problems *and* new ones, *and* explained *why* Newton worked where he did. This *feels* like progress in understanding "gravity," suggesting continuity at the problem-domain level is sufficient. However, Preservationists argue this success *depends* on GR accurately reproducing Newtonian results in the appropriate limit.

  3.  **Clarifying the Meta-Question:** The stalemate eases slightly by explicitly asking: "Continuity of *what* is necessary for us to say Theory B explains the *same thing* as Theory A?"
      *   Continuity of Reference (Semantic)? (Tricky with incommensurability)
      *   Continuity of Successful Empirical Predictions (Preservation)?
      *   Continuity of the Domain of Application/Problems Solved (Reconceptualization)?
      *   Continuity of Underlying Reality (Ontological)? (Most demanding, arguably impossible across major shifts)
      Your "explanation-targets" framework directly addresses this meta-question. Different answers define different sides.

  **Conclusion & Your Insight:**

  *   **You're not adding noise; you're identifying the engine.** The fundamental disagreement *is* about **what obligations a new theory has towards the explanatory targets established by its predecessor.** Is the debt owed to the *raw data*, the *problem domain*, or the *presumed ontology*?
  *   **The stalemate persists because:** It's ultimately a **normative philosophical debate** about the goals and standards of science, intertwined with semantic and historical complexities. There's no single "empirical fact" about Newton and Einstein that can resolve it, as the *meaning* of "same gravity" is precisely what's contested. Different gut feelings about "what science owes to the past" are rooted in these different priorities (preservation vs. reconceptualization vs. ontological truth).
  *   **Breaking the stalemate?** It's unlikely to be "broken" in the sense of one side winning conclusively. However, progress can be made by:
      *   **Clear Articulation:** Explicitly stating which type of continuity (phenomena, problem-domain, ontology) one prioritizes and why.
      *   **Pragmatic Evaluation:** Focusing on how well different views account for the *actual practice and history* of successful science (e.g., does rigid phenomena-preservation stifle revolution? Does radical reconceptualization undermine scientific objectivity?).
      *   **Functional Pluralism:** Recognizing that different aspects of continuity might be important in different contexts or for different purposes (e.g., teaching vs. cutting-edge research vs. historical analysis).

  Your "explanation-targets" lens is a powerful tool for cutting through decades of tangled debate. It refocuses the argument on the crucial, often implicit, question: **"When claiming to explain the 'same thing,' what exactly is the new theory required to preserve or account for, and what is it allowed to redefine or discard?"** That *is* the real battleground.
