answer: |-
  ### Exam Question  
  **Evaluate whether the 'procedural-fiction problem'—wherein a player of algorithmically generated interactive media (e.g., horror games) experiences genuine dread despite knowing emotional triggers lack authorial intent—resolves or exacerbates the paradox of fiction. In your response, assess:  
  (i) How procedural generation alters the epistemic basis for emotional engagement compared to Radford’s conditions;  
  (ii) Whether Walton’s quasi-emotion framework can accommodate algorithmically sourced emotions without revision;  
  (iii) The implications for Radford’s belief-emotion gap. Conclude by arguing whether this phenomenon demands a new theoretical category.**  

  ---

  ### Model Answer (498 words)  

  The procedural-fiction problem reconfigures the paradox of fiction by decoupling emotional triggers from human authorship. Where Radford (1975) identifies the paradox through three conditions—(1) we feel genuine emotions toward fictional entities; (2) these emotions require belief in the entities’ existence; (3) we lack such beliefs—procedural generation disrupts the second condition’s epistemic foundation. Unlike authored fiction (e.g., a novel), algorithmically generated horrors (e.g., *No Man’s Sky*’s alien creatures) are not merely *fictional* but *unpredictably emergent*. The player knows threats are produced by code lacking intentional design; no author *meant* to evoke dread via specific monsters. This severs the tether between emotion and an artist’s communicative purpose, creating a unique epistemic scenario: emotions respond to systemic possibility rather than representational intent.  

  Radford’s belief-emotion gap hinges on the irrationality of fearing non-existent *authored* entities. Procedural generation, however, transforms the nature of "belief-like commitment." Players do not believe monsters "exist," but they *credibly anticipate* algorithmically enabled threats within the game’s ruleset. Dread arises from immersion in a *process* capable of generating genuine peril *for the player-avatar*, even absent authorial backstory. This is not belief in fiction’s reality but *functional suspension of algorithmic skepticism*: the system’s procedural logic replaces authorial intent as the object of emotional investment.  

  Walton’s quasi-emotion theory—where players feel "make-believe" fear by psychologically inhabiting fictional worlds—struggles to fully accommodate this. Quasi-emotions rely on prescribed fiction (e.g., Walton’s *Monster Chase* example), whereas procedural emotions respond to *emergent, unscripted* content. While Walton could argue players still "pretend" the algorithm’s output is threatening, this mischaracterizes the player’s relationship to the system. The emotion’s cause is not representational pretense but *adaptive vigilance*: the code’s genuine capacity to produce unforeseen threats triggers biological fear responses. Procedural horror leverages the player’s real vulnerability to surprise, making quasi-emotions seem inadequate without acknowledging *non-pretend* physiological arousal.  

  Consequently, the paradox is exacerbated but not resolved. Radford’s gap persists in modified form: players still feel genuine dread toward entities they know are fictional *and* unintentional. Yet Walton’s framework requires revision to address emotions rooted in systemic interaction rather than narrative pretense. The belief condition transforms into *procedural credence*—a rational assessment of algorithmic possibility within a rules-based environment. This demands a new category: **emergent-intentional emotions**. Unlike quasi-emotions, these arise from real-time computational processes that simulate threat-creation agency, blending ludic immersion with somatic response. The paradox thus highlights a lacuna in existing theory, necessitating models that distinguish *authored* from *generated* fictional triggers.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **A (17–20):** Addresses all facets of the question; avoids conflating procedural generation with unreliable authorship; precise philosophical analysis.  
  **B (13–16):** Minor omissions/errors; may conflate algorithmic unpredictability with unknowable authorial intent.  
  **C (9–12):** Superficial treatment; misstates key theories; neglects epistemic distinctions.  

  1.  **Radford’s Conditions** (3 marks):  
      - 3: Clear statement of all three conditions (belief in existence required for emotion; emotions occur; no belief exists).  
      - 1–2: Incomplete/muddled summary.  
      - *Common error (B-grade):* Omits Condition 2’s belief requirement.  

  2.  **Epistemic Alteration** (4 marks):  
      - 4: Contrasts authored intent vs. algorithmic emergence; highlights unpredictability & systemic possibility.  
      - 2–3: Identifies lack of intent but misses procedural *unpredictability*.  
      - *Key A/B divider:* **A** answers note *code lacks intent but possesses generative agency*; **B** answers reduce it to "no known author" (conflating with anonymity).  

  3.  **Belief-Commitment Analysis** (4 marks):  
      - 4: Distinguishes "procedural credence" from Radfordian belief; links to functional immersion.  
      - 2–3: Asserts belief is "absent" without explaining transformed engagement.  
      - *Critical insight (A-grade):* Identifies *anticipation of systemic outcomes* as distinct from belief in fiction’s reality.  

  4.  **Walton Evaluation** (4 marks):  
      - 4: Exposes tension between prescribed pretense & emergent content; notes somatic vulnerability.  
      - 2–3: Superficially applies quasi-emotions without critiquing their limits.  
      - *A-grade requirement:* Argues procedural emotions exceed "make-believe" due to physiological stakes.  

  5.  **Conclusion & Theoretical Category** (5 marks):  
      - 5: Defends "emergent-intentional emotions" (or similar) with synthesis; explains why existing frameworks fail.  
      - 3–4: Recognizes need for new theory but lacks justification.  
      - 1–2: Asserts resolution without novelty.  
      - *Penalty (–2):* Conflates procedural generation with reader-response ambiguity.
