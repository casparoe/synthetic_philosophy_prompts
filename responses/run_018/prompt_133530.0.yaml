  Here's the joke followed by the reflective note woven into the same narrative thread: 

  Two evolutionary game theorists, Alice and Bob, are locked in separate rooms playing an iterated prisoner's dilemma via computer, the screen promising "sufficiently high δ to support tit-for-tat!" After dozens of cooperative rounds, Alice suddenly defects. Bob, puzzled, sends a message: "Why defect? The discount factor clearly exceeds (T-R)/(R-S)! Our cooperation was evolutionarily robust!" Alice replies: "Precisely! But this simulation runs on replicator dynamics in a well-mixed population of 1000 players. While we were busy being nice, a mutant strategy 'Generous Tit-for-Tat-Except-On-Thursday' drifted in. It cooperated with everyone Wednesday, so when Thursday came and it defected on me while I was still playing standard TFT, my fitness plummeted. Now the whole population's collapsing into All-D. Should've demanded spatial structure or at least a Moran process with weak selection before agreeing to play 'infinitely'." Bob sighs, realizing his moral stance on cooperation was predicated on an asymptotically infinite, perfectly mixed model now crumbling under finite stochasticity, and mutters, "Next time, remind me to check the viscosity before invoking the shadow of the future."

  The joke leans into the fragility by contrasting Bob's textbook confidence in the infinite-horizon logic (where δ > (T-R)/(R-S) defines cooperation's feasibility) with Alice's defection justified by evolutionary dynamics in a finite, well-mixed system – where even successful strategies like TFT aren't immune to invasion by neutral mutants or drift. It takes liberties by compressing several distinct concepts: the vulnerability of pure TFT to drift isn't identical to its susceptibility to specific mutants like generous variants (which might exploit it differently), and the joke implies spatial structure or Moran processes *guarantee* stability, which oversimplifies. Spatial cooperation requires b/c > k (neighbors) for lattice models, and Moran processes support cooperation only under specific fixation probabilities sensitive to population size and selection strength. If emphasizing how spatial structure *reshapes* the invasion criteria (making cooperator clusters resilient) rather than just preventing drift, the punchline might have Alice demand "a lattice with b/c > 4" instead. The core tension remains – applying idealized strategic equilibria as moral imperatives ignores the knife-edge conditions evolutionary stability actually requires.
