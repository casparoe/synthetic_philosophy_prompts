prompt: |-
  I teach an upper-level philosophy of science seminar, about 14 students (a mix of MA and PhD, plus two neuroscience students), and we have one 2-hour block. We're in the part of the course on mechanistic explanation, and I want a session where students actually feel how slippery it is to say whether two systems have the same mechanism and why that matters for anomaly detection (the problem of deciding whether a weird result is an anomaly for your mechanistic model or evidence that you're looking at a different mechanism entirely). I don't want to lecture first, and the phrase mechanistic anomaly detection shouldn't be said out loud until the debrief.

  Please design a runnable classroom activity for this. I'd like it to work on a zero budget: printed cards, envelopes, paper, maybe ordinary classroom objects. It should include rules, roles, materials, a payoff scheme that doesn't use real money, a timeline for the 2 hours, and a debrief that maps specific moments in the game onto the conceptual issue. The heart of it should be a forced classification: teams have to judge, under limited information, whether two systems count as the same mechanism or different mechanisms, and whether some new result counts as an anomaly or just a different mechanism. Ideally there's a second phase where they recieve new information that changes the grain of description, so their first classification gets destabilized and they feel the pull of both verdicts.

  The students have read general stuff on mechanisms (entities, activities, organization), but they don't know any specific literature on individuating mechanisms, and I want to keep it that way until after the activity. At the end, I want them to come away seeing that same mechanism is a modeling decision with stakes, not something you read off the system itself.

  Also tell me what will predictably go wrong the first time I run it (e.g., teams treating identical outputs as automatically the same mechanism, builders accidentally leaking information, someone demanding a definition mid-game) and how to handle it. And be honest about which feature of real mechanistic anomaly detection the activity can't reproduce and where I'll have to supply it in the debrief.
reasoning: |-
  We are designing an activity called "Mechanism Mismatch" that forces students to grapple with the problem of individuating mechanisms and the ambiguity in anomaly detection.

  **Core Idea:** 
  - Students work in teams to build simple Rube Goldberg-style mechanisms from cards that describe entities and activities. 
  - Each team builds two mechanisms (A and B) that may or may not be the same at a given level of description. 
  - Then, they are given an "anomalous result" (a change in input or output) and must decide if it is an anomaly for their model (i.e., same mechanism but something went wrong) or evidence of a different mechanism.

  **Phases:**
  1. **Build Phase:** Teams build two mechanisms (A and B) from a set of component cards. They are told that A and B might be the same mechanism or might be different, but they don't know which.
  2. **Test Phase:** They run a standard test on both mechanisms (with the same input) and record the output. They also run an "anomaly test" (a different input) on mechanism A and get an output. Then they are told that when the same anomaly test is run on mechanism B, they get a different output. They must then decide: is the anomaly test result for A an anomaly (i.e., the mechanism is the same as B but something fluky happened) or is it evidence that A and B are different mechanisms?
  3. **Reveal Phase:** New information is given (a finer-grained description of the mechanisms) that may change their initial classification. They are forced to re-evaluate.

  **Materials:**
  - **Component Cards:** Each card has an entity and an activity (e.g., "Domino: falls when pushed", "Ball: rolls down incline", "Lever: pivots when weight is applied"). There are two sets: a coarse-grained set (with fewer, more abstract components) and a fine-grained set (with more detailed components).
  - **Mechanism Templates:** Envelopes with a set of component cards for building mechanism A and mechanism B. Each envelope also contains a hidden card that states whether A and B are intended to be the same mechanism or different (but note: the build might not be identical due to the grain of description, so the hidden card is for the designer's intention, which may be challenged). However, to avoid bias, we won't reveal this until the end.
  - **Input Cards:** Cards that describe the input (e.g., "Push the first domino", "Drop the ball from 10cm").
  - **Output Sheets:** Where teams record the output (e.g., "The bell rang", "The light turned on", etc.). The outputs are predetermined for each test by the game master (you) based on the mechanism built.

  **Setup:**
  - Divide the class into 4 teams (about 3-4 students each). Each team gets two envelopes: one for mechanism A and one for mechanism B. Each envelope contains:
    - A set of component cards (coarse-grained) for building that mechanism.
    - A diagram of how to arrange the components (to ensure they build it correctly and to control the output).
    - A hidden intention card (for the instructor's use only, not shown to students until the end) that says either "SAME" or "DIFFERENT". This card is used by the instructor to know what output to give in the anomaly test.

  **Rules:**
  1. **Build Phase (20 minutes):** 
     - Each team builds mechanism A and mechanism B using the provided component cards and the diagram. They must not see the other team's mechanisms. They record the entities, activities, and organization for both mechanisms.

  2. **Standard Test (10 minutes):**
     - Each team runs the standard test (same input for both A and B). They record the output for A and B. For both, the output should be the same (by design) to set up the initial assumption that they are the same mechanism.

  3. **Anomaly Test and Classification (20 minutes):**
     - Teams run the anomaly test (a different input) on mechanism A and record the output (provided by the instructor, based on the hidden intention card). 
     - Then they are told the output of the anomaly test on mechanism B (which will be different from A's output if the intention is DIFFERENT, or the same if SAME). However, to create ambiguity, we design it so that even if the intention is SAME, the output for the anomaly test might be different due to a "fluke" (which we simulate by having two possible outputs for the same mechanism, but we'll say one was a fluke). Similarly, if DIFFERENT, the outputs are different.
     - Teams must now decide: 
          a) Are A and B the same mechanism? (Yes/No)
          b) For the anomaly test on A: is the result an anomaly (i.e., same mechanism as B but something went wrong) or evidence that A is a different mechanism?

  4. **Reveal of Fine-Grained Description (15 minutes):**
     - Each team receives a new set of fine-grained component cards that break down some of their coarse components. They are told to re-describe both mechanisms at this finer grain.
     - They then re-run the anomaly test (in theory) and reconsider their classification.

  5. **Discussion and Re-Classification (10 minutes):**
     - Teams are allowed to change their answers to (a) and (b) based on the new description.

  **Payoff Scheme (non-monetary):**
  - Teams get points for correctly predicting the hidden intention (SAME/DIFFERENT) at two stages: after the initial test and after the fine-grained reveal. But note: the hidden intention is fixed, so they can get it right at both stages or change. However, we want to emphasize that there isn't a single correct answer necessarily, so the payoff is about consistency and argument strength.
  - Instead, we can have a "reputation" system: each team presents their reasoning, and the class votes on which team had the most compelling argument (for each team's case). The team with the most votes wins "Mechanism Masters" title (or something fun).

  **Timeline (2 hours):**
  - 0:00 - 0:10: Introduction and team formation. Explain the building rules. (10 min)
  - 0:10 - 0:30: Build Phase (20 min)
  - 0:30 - 0:40: Standard Test (10 min)
  - 0:40 - 1:00: Anomaly Test and Classification (20 min)
  - 1:00 - 1:15: Reveal of Fine-Grained Description and Re-Description (15 min)
  - 1:15 - 1:25: Re-Classification (10 min)
  - 1:25 - 1:55: Class Discussion and Debrief (30 min)
  - 1:55 - 2:00: Wrap-up (5 min)

  **Debrief (30 minutes):**
  - Start by asking teams to share their initial classification and then their final classification. Ask what changed and why.
  - Map to conceptual issues:
    1. **Grain of Description:** The same physical system can be described at multiple levels. The coarse description might make two systems look the same, but the fine-grained description reveals differences (or vice versa). This shows that "same mechanism" is relative to a model.
    2. **Anomaly vs. Different Mechanism:** The decision about whether an unexpected result is an anomaly or evidence of a different mechanism depends on background assumptions about the stability of the mechanism and the scope of the model.
    3. **Stakes:** If you call it an anomaly, you might keep investigating the same mechanism; if you call it a different mechanism, you might abandon the current model and start over. This has real consequences for scientific practice.
  - Highlight specific moments in the game:
    - When they got the same output in the standard test, they likely assumed same mechanism. But that's an inference (underdetermination).
    - The anomaly test forced them to question that. The fine-grained description then showed that the same system can be re-described to make the anomaly look like a different mechanism (or vice versa).

  **Predictable Problems and Solutions:**
  1. **Problem:** Teams assume identical outputs mean same mechanism (ignoring multiple realizability). 
     - **Solution:** In the debrief, point out that different mechanisms can produce the same output (and same mechanism can produce different outputs under perturbation).

  2. **Problem:** Builders might accidentally see another team's mechanism and leak information.
     - **Solution:** Have teams build in separate areas and warn them not to share. Use the diagrams so they don't need to move around.

  3. **Problem:** Someone demands a definition of "mechanism" mid-game.
     - **Solution:** Say: "For this activity, we're using the components and organization you have in front of you. We'll discuss the definition in the debrief." Stick to the game's operational definition.

  4. **Problem:** The fine-grained description might be too complex and take too long.
     - **Solution:** Keep the mechanisms simple (3-5 components). Pre-test the activity to ensure timing.

  5. **Problem:** The anomaly test might be confusing because the outputs are predetermined and not actually run (since we don't have real mechanisms).
     - **Solution:** Be clear that you (the instructor) are the game master and will provide the outputs based on the hidden intention and the test. They have to trust the output you give.

  **What the Activity Can't Reproduce:**
  - In real science, we don't have a hidden intention card that tells us the "truth" about whether two mechanisms are the same. The activity gives an artificial ground truth (the intention card). In the debrief, you must emphasize that in reality, there is no such card. The decision is always underdetermined and pragmatic.

  **Materials Preparation Example:**
  - Create 4 pairs of mechanisms (for 4 teams). Each pair has:
    - Coarse-grained version: 
        Mechanism A: [Domino, Ball, Bell] -> arranged so that falling domino hits ball, ball rolls and hits bell.
        Mechanism B: Same components and arrangement -> so same mechanism? But wait, in the fine-grained, we break the domino into two pieces? Or break the ball into a rubber ball vs. steel ball? 
