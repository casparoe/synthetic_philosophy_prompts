answer: |-
  ### Activity Design: "Mechanism Mismatch"  
  **Objective:** Students experience the ambiguity in deciding whether two systems share the "same mechanism" and how this affects anomaly detection (i.e., whether an unexpected result is a fluke or evidence of a different mechanism). The activity emphasizes that mechanism individuation is a pragmatic modeling choice, not a fact about the system.

  ---

  ### **Materials (Zero Budget)**  
  1. **Component Cards:**  
     - **Coarse-grained (Phase 1):** Simple descriptions (e.g., "Fan: spins when powered," "Light: turns on when circuit closes," "Switch: completes circuit when pressed").  
     - **Fine-grained (Phase 2):** More detailed versions (e.g., "Fan: 3-blade metal fan, spins clockwise at 5V," "Light: LED, activates at 3V," "Switch: spring-loaded, requires 2N force").  
     - *Print 4 sets (1 per team), each with 8–10 unique cards.*  

  2. **Mechanism-Building Envelopes:**  
     - Each team gets two envelopes labeled **System A** and **System B**.  
     - Each envelope contains:  
       - A diagram showing how to arrange components (e.g., "Switch → Fan → Light").  
       - Coarse-grained cards for building the system.  
       - A hidden **Intention Card** (visible only to you) stating whether A and B are *Same Mechanism* or *Different Mechanisms*.  

  3. **Test Input Cards:**  
     - **Standard Test:** "Apply 5V power."  
     - **Anomaly Test:** "Apply 3V power."  

  4. **Output Sheets:**  
     - Tables to record outputs (e.g., "Light on/off," "Fan speed").  

  5. **Classroom Objects:**  
     - Use whiteboards for teams to sketch their mechanisms.  
     - Paper clips/tape to "assemble" cards into a flowchart.  

  ---

  ### **Roles**  
  - **Instructor:** Game master. Distributes materials, reveals test outputs, and moderates.  
  - **Teams:** 3–4 students each. Each team has:  
    - **Builder:** Assembles components per diagram.  
    - **Recorder:** Documents outputs and classifications.  
    - **Spokesperson:** Reports decisions during debrief.  

  ---

  ### **Rules**  
  1. **No Peeking:** Teams cannot see other teams’ systems or diagrams.  
  2. **Output Trust:** Test results are provided by you (based on the hidden Intention Card). Teams *do not* physically test systems.  
  3. **Anomaly Secrecy:** The phrase "mechanistic anomaly detection" is banned until debrief.  
  4. **Two Classifications:** Teams must decide:  
     - Are A and B the same mechanism? (Yes/No)  
     - Is the Anomaly Test result for A an *anomaly* (fluke in the same mechanism) or evidence of a *different mechanism*?  

  ---

  ### **Timeline (2 Hours)**  
  | **Phase**               | **Time** | **Steps** |  
  |--------------------------|----------|-----------|  
  | **Setup (0:00–0:10)**    | 10 min   | Divide into 4 teams. Distribute envelopes (A/B), coarse cards, and diagrams. Explain rules. |  
  | **Build & Standard Test (0:10–0:35)** | 25 min | Teams build A and B with coarse cards. Run Standard Test: Both get *identical outputs* (e.g., "Light on"). Record outputs. |  
  | **Anomaly Test & Initial Classification (0:35–1:00)** | 25 min | Run Anomaly Test on A: *Unexpected output* (e.g., "Light off"). Reveal that B *also* had the Anomaly Test run (output: "Light on" for some teams, "Light off" for others, based on Intention Card). Teams classify: Same/different mechanism? Anomaly or different mechanism? |  
  | **Fine-Grained Reveal & Re-Classification (1:00–1:25)** | 25 min | Distribute fine-grained cards. Teams re-describe A and B. Re-run Anomaly Test (theoretically). Allow re-classification. |  
  | **Debrief (1:25–1:55)** | 30 min | Teams share decisions. Map to philosophy concepts. Reveal Intention Cards. Discuss stakes. |  
  | **Wrap-up (1:55–2:00)** | 5 min   | Summarize key insights. |  

  ---

  ### **Payoff Scheme**  
  - **Reputation Points:** Teams earn points for:  
    - **Consistency:** 1 pt if initial/final classifications align internally.  
    - **Argument Strength:** 2 pts if class votes their reasoning "most compelling" in debrief.  
    - **Adaptability:** 1 pt if they change classifications based on new evidence.  
  - **Winner:** Team with most points. Prize: "Mechanism Master" title (bragging rights).  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem:** Teams assume identical outputs = same mechanism.  
     - **Solution:** In debrief, highlight cases where different mechanisms produced identical outputs (e.g., coarse vs. fine descriptions).  

  2. **Problem:** Builders leak information by comparing systems.  
     - **Solution:** Assign a "guard" role per team to enforce isolation. Use spatial separation.  

  3. **Problem:** Student demands a definition of "mechanism" mid-game.  
     - **Solution:** Redirect: "Use the components/organization you have. We’ll define it later."  

  4. **Problem:** Fine-grained phase bogs down in details.  
     - **Solution:** Use timers. Limit teams to 3 key differences.  

  5. **Problem:** Teams ignore organization (entities/activities) and focus only on components.  
     - **Solution:** Ask probing questions during tests: "How does the switch’s position affect the fan?"  

  ---

  ### **What the Activity Can’t Reproduce**  
  - **Real-World Stakes:** In science, mechanism individuation has costly consequences (e.g., funding, research direction). The game lacks this pressure.  
    - **Debrief Supply:** Discuss how misclassification wastes resources (e.g., treating a different mechanism as an anomaly leads to futile troubleshooting).  

  ---

  ### **Debrief Structure**  
  1. **Share Classifications (5 min):** Teams report initial/final decisions. Record on board.  
  2. **Map Game to Concepts (15 min):**  
     - **Grain Sensitivity:** "When you saw coarse cards, A/B seemed the same. Fine cards made you question this. In science, descriptions are *models*—not reality."  
     - **Anomaly Ambiguity:** "Team X called A’s result an anomaly because they assumed same mechanism. Team Y saw different mechanisms. Both were defensible until new evidence."  
     - **Stakes:** "If you misclassify an anomaly, you might waste time debugging. If you misclassify a different mechanism, you might abandon a valid model."  
  3. **Reveal Intention Cards (5 min):** Show hidden classifications. Emphasize: "This ‘ground truth’ doesn’t exist in real science—it’s always underdetermined."  
  4. **Connect to Philosophy (5 min):** "Mechanism individuation isn’t ‘discovered’—it’s a choice shaped by goals, evidence, and pragmatics. What would you do with imperfect data?"  

  ---

  ### **Example Systems**  
  - **Same Mechanism (Coarse):**  
    - System A: Switch → Fan → Light (Standard: Light on; Anomaly: Light off).  
    - System B: Identical.  
    - **Fine Reveal:** Both use identical components. Anomaly for A is a "fluke."  
  - **Different Mechanisms (Coarse):**  
    - System A: Switch → **3-blade Fan** → Light (Anomaly: Light off).  
    - System B: Switch → **5-blade Fan** → Light (Anomaly: Light on).  
    - **Fine Reveal:** Fan differences explain outputs. Not an anomaly—different mechanisms!  

  ---

  ### **Why This Works**  
  - **Forced Classification:** Teams *must* commit to same/different and anomaly/not under uncertainty.  
  - **Grain Destabilization:** Fine-grained cards make initial judgments feel "slippery."  
  - **Low Cost:** Only paper, envelopes, and classroom items needed.  
  - **Engagement:** Role-playing and points incentivize deep engagement without lectures.  

  **First Run Tip:** Do a dry run with colleagues to tweak outputs/cards. Emphasize during setup: "Focus on *how* the mechanism works, not just inputs/outputs." This primes attention to organization.
