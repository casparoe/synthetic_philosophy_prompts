  Now, comparing to past cases, the cricket farming is the closest analog. Both involve farming insects for protein on a massive scale. The sister is uneasy about crickets but eats them, which is inconsistent. For the larvae, the key difference is the higher probability of sentience—10% versus maybe lower for crickets? Biologists give that estimate, so it's more concrete. The aphid spraying is different because it's direct harm but on a smaller scale, and she was fine with it. The beetle avoidance shows precaution for low-probability harm in individual cases.

  For the sister's verdict, based on her precedents, it's underdetermined. The direct/systemic rule might lean toward supporting the larvae farms because they replace chicken suffering, so net harm reduction. But the precautionary/multiplication rule would oppose it due to the massive expected harm from trillions of larvae. Her unease with cricket farming hints she might oppose the larvae too, but she still eats crickets, so it's messy. I think her actual verdict would be opposition, driven by that "just in case" mentality from the beetle case, amplified by the scale. She'd adopt a stronger precautionary principle with this choice.

  A further case to distinguish the rules: imagine a single action that could harm a vast number of beings with very low sentience probability, like releasing a chemical that kills trillions of microbes with a tiny chance of sentience. The direct/systemic rule might allow it if it's a one-off, but the multiplication rule would oppose it due to expected harm. That clarifies the difference.

