answer: |-
  Based on your sister's pattern of judgments, her position reflects a tension between common-sense moral intuitions and the challenges of scale/probability in applied ethics. Here's a breakdown of the two most plausible rules explaining her past verdicts, their predictions for the larval farm proposal, the closest analog, my best guess for her verdict, and a test case.

  ### Two Plausible Rules Explaining Her Past Verdicts
  1.  **Rule 1: Direct Harm Avoidance with a Sentience Threshold + Systemic Harm Precaution ("Don't Hurt the Individuals You Can See, But Worry About Systems")**
      *   **Core Idea:** Direct moral consideration requires a *sufficiently probable and complex* form of sentience/conscious experience that we can readily recognize or reasonably infer (e.g., mammals, birds, octopuses). Harming beings below this threshold (aphids, mosquitoes) in direct, small-scale, necessary contexts is permissible. However, *systemic* harm – institutionalized, large-scale exploitation or killing of beings *near* or *potentially near* the sentience threshold – triggers precautionary unease, even if the individual probability of sentience is low, due to the sheer scale and the inherent uncertainty.
      *   **Explains Past Verdicts:**
          *   *Dog/Crow/Octopus:* Clearly above sentience threshold; direct harm is wrong.
          *   *Aphid/Mosquito:* Below sentience threshold (as she perceives it); direct harm in context (defense, pest control) is permissible.
          *   *Beetle:* Individual probability of significant sentience is very low, but the cost of avoidance (stepping around) is negligible, so "just in case" precaution applies *at the individual action level*.
          *   *Cricket Farming:* Systemic harm on a vast scale; beings are invertebrates potentially near a sentience threshold (capable of stress, nociception?); triggers precautionary unease despite low individual certainty and personal consumption.

  2.  **Rule 2: Expected Value Minimization of Suffering ("Multiply Probability x Harm x Number")**
      *   **Core Idea:** Moral significance is proportional to the *expected* suffering caused, calculated roughly as (Probability of Sentience) x (Magnitude of Suffering/Harm) x (Number of Individuals). Beings with very low individual probability of sentience (aphids, mosquitoes) or very minimal potential suffering (beetle crushed instantly) have negligible expected harm per individual. However, when multiplied by vast numbers (billions of crickets, trillions of larvae), even a low probability or minimal potential suffering per individual can sum to a significant expected total harm.
      *   **Explains Past Verdicts:**
          *   *Dog/Crow/Octopus:* High probability of significant sentience, high potential for suffering. High expected harm *per individual* makes harm clearly wrong.
          *   *Aphid/Mosquito:* Very low probability of significant sentience *or* suffering is likely minimal/instantaneous. Expected harm per individual is negligible; harm is permissible.
          *   *Beetle:* Low probability of significant sentience, *but* harm (crushing) likely causes significant suffering *if* sentient. The "just in case" reflects minimizing expected harm when the cost of avoidance is near-zero.
          *   *Cricket Farming:* Low probability of significant sentience per cricket *but* non-zero. Suffering in farming conditions could be significant *if* sentient. Multiplied by billions, the *total expected suffering* becomes significant, causing unease.

  ### Predictions for the Larval Farm Proposal
  *   **Rule 1 (Sentience Threshold + Systemic Precaution):** Predicts **strong opposition**. The larvae have a non-trivial (10%) chance of "minimal, brief subjective experience," placing them in the zone of uncertainty *near* the threshold. Farming them *systematically* on a mind-boggling scale (trillions per day) is the epitome of systemic harm, triggering her precautionary unease like cricket farming, but orders of magnitude stronger due to the higher probability and sheer numbers. Replacing chicken suffering is a positive, but doesn't eliminate the systemic harm being done *to the larvae*.
  *   **Rule 2 (Expected Value Minimization):** Predicts **opposition, based on scale**. (0.10 Probability) x (Minimal but Non-Zero Suffering per Larva) x (1 Billion Larvae/Farm/Day x 1000 Farms) = An astronomically large *expected suffering* value per day. Even if the suffering per sentient larva is "minimal" and "brief," the sheer number of larvae with a 10% chance makes the total expected suffering immense. This likely outweighs the reduction in chicken suffering (unless chicken suffering is vastly greater per unit protein, which is debatable but not guaranteed).

  ### Closest Past Analog
  The **cricket farming case** is the closest analog. Both involve:
  1.  Farming invertebrates for protein on an industrial scale.
  2.  Beings with uncertain but non-zero probability of sentience/subjective experience.
  3.  Triggering unease despite the lack of clear evidence for complex sentience.
  4.  Existing within a system of human consumption.
  The key differences are the *scale* (larvae are vastly more numerous), the *explicit probability estimate* (10% for larvae vs. undefined for crickets), and the *lifespan* (1 day vs. weeks/months for crickets). Her unease about crickets is the strongest precedent for unease about the larvae.

  ### Best Guess at Her Actual Verdict & Reasoning
  **Verdict: She would oppose the larval farm project.**

  **Reasons:**
  1.  **Precedent of Systemic Unease:** Her unease about cricket farming, despite eating them, shows a strong underlying discomfort with large-scale exploitation of beings in the "gray zone" of sentience. The larval proposal amplifies this massively (higher probability, vastly larger numbers).
  2.  **The "Just in Case" Principle Amplified:** Her beetle avoidance demonstrates a precautionary impulse *at an individual level* when potential harm exists and avoidance is easy. The larval farm forces this principle to its logical extreme: when *avoiding* the systemic harm (by not building the farms) is feasible and the *potential* aggregate harm is gigantic (even if per-individual probability and suffering are low), precaution dictates opposition.
  3.  **Scale is Overwhelming:** The numbers involved (trillions per day) are likely to trigger a visceral "this can't be right" reaction, aligning with her systemic precaution rule (Rule 1) and the expected suffering calculation (Rule 2).
  4.  **Inarticulable Unease:** Her struggle to articulate why she's uneasy about crickets but eats them suggests a conflict between intuition and convenience. The larval proposal, being new and extreme, removes the convenience factor and allows the unease to drive the verdict clearly.

  ### Do Precedents Genuinely Underdetermine It?
  **Yes, they do underdetermine it.** Here's why and the principle adopted with each choice:
  *   **Opposing Larval Farms (Likely Choice):** Requires adopting a stronger principle of **Precautionary Avoidance of Large-Scale Suffering in Beings of Uncertain Sentience.** This elevates her "just in case" for the beetle and unease about crickets into a decisive rule against *creating* vast systems where non-trivial suffering might occur on an immense scale, even if per-individual suffering/probability is low. It prioritizes avoiding potentially massive unknown harms over potential benefits (like reducing chicken farming).
  *   **Supporting Larval Farms (Possible but Less Likely):** Would require adopting a principle of **Net Suffering Reduction with a Higher Sentience Threshold.** This argues that the 10% chance of *minimal, brief* experience is still below a relevant threshold for significant moral consideration *at scale*, especially compared to the clear, complex suffering of chickens. Harming the larvae is permissible because the *net reduction* in suffering (by replacing chickens) is significant and the larvae's potential suffering is too minimal and uncertain to count substantially. This downplays her cricket unease and "just in case" beetle rule as irrelevant at this scale or superseded by the net benefit.

  ### Further Case to Distinguish the Rules
  **The Case: A city plans to install powerful, focused sonic emitters to deter birds from airports. Engineers estimate a 1% chance that each pulse causes a brief, sharp, unpleasant sensation to any insect within a 1-meter radius. Billions of insects would be exposed daily across the network. The system would significantly reduce fatal bird strikes on planes.**

  *   **Rule 1 (Sentience Threshold + Systemic Precaution):** Would likely **oppose**. This is systemic harm (institutionalized pulsing) applied to vast numbers of beings (insects) near the sentience uncertainty threshold (1% chance of brief unpleasant sensation). The precautionary principle kicks in due to scale and uncertainty.
  *   **Rule 2 (Expected Value Minimization):** Would likely **support, or be neutral**. (0.01 Probability) x (Minimal, Brief Suffering) x (Billions) = Significant expected suffering. However, this must be weighed against preventing bird deaths (high probability of severe suffering/death for each bird struck) and potential human harm. If the expected suffering prevented (bird deaths + human harm) outweighs the expected suffering caused (insect sensations), the net reduction in suffering supports the project. Rule 2 forces a quantitative comparison Rule 1 avoids.

  This case highlights the key difference: Rule 1 is wary of *creating* large-scale systems impacting uncertainly sentient beings on principle, while Rule 2 is willing to proceed if the *net expected suffering calculation* shows a significant benefit, even with large numbers and low probabilities on the "cost" side. Your sister's reaction to this sonic emitter case would clearly signal which rule dominates her thinking.
