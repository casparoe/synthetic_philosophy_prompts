answer: |-
  Here's the unhedged, non-negotiable core for a theory of causation in *this specific debate*:

  1.  **Preserve the Miracle/Nature Distinction (Non-Negotiable):** Theology *requires* a clear demarcation between God's ordinary, reliable action (nature) and God's extraordinary, signifying action (miracle). A theory that reduces *all* events to equally direct, arbitrary divine volition (like bare occasionalism) obliterates this distinction. If God is *always* the sole immediate cause, a "miracle" is just another instance of divine action – no different in kind. Occasionalism *must* incorporate a robust account of divine *habit* or *custom* (`'ādah`) to ground nature's regularity *as distinct from* miraculous intervention. Failure here destroys coherent theology.

  2.  **Save Induction from Emptiness (Non-Negotiable):** If past regularity provides *zero* warrant for expecting future regularity (beyond blind hope in divine consistency), then science, daily life, and *even revealed religion's reliance on prophecy/fulfillment* collapse into irrationality. Hume's constant conjunction (without necessity) *allows* induction psychologically. Causal powers ground it metaphysically. Occasionalism *must* explain why divine freedom doesn't render induction fundamentally groundless. Appealing solely to God's *unchanging will* risks circularity (why believe *that* will is stable?).

  3.  **Avoid Collapsing Law-Statements into Divine Whim (Non-Negotiable):** Scientific laws must describe more than mere statistical summaries of past divine choices. If "laws" are *only* descriptions of God's current habits, subject to instantaneous, arbitrary change without any inherent constraint *within creation itself*, then science loses its explanatory power and predictive force. Laws become utterly contingent caprice. Occasionalism *must* ground the *stability* and *descriptive necessity* of laws in something firmer than potentially fickle divine preference (e.g., God's essential wisdom or commitment to order).

  4.  **Modal Compatibility (Modern-Camp Preference):** The demand that a *single* instance of causal failure (e.g., fire not burning cotton) shouldn't shatter the *essential* or *dispositional* link between cause and effect is primarily a *causal powers realist* concern. While important for robust metaphysical accounts of natural necessity, it's not *essential* for the core theological/philosophical adequacy addressed in points 1-3. Humeans reject inherent modal links. Occasionalists ground all modality in God. Insisting on intrinsic modal compatibility within creation is importing a specific (non-Humean, non-occasionalist) metaphysical commitment into the debate's basic adequacy criteria. It's desirable for some theories, but not a universal desideratum here.

  **The Litmus Test: Saving Induction.** This is the most fundamental pressure point. A theory of causation must explain why the past is a *reliable* guide to the future. Occasionalism's reliance on divine consistency faces the "Why think God won't change?" challenge. Humean regularity at least offers psychological inevitability. Causal powers offer intrinsic grounding. Occasionalism struggles to provide a non-question-begging answer within its own framework.

  \answer{Saving induction from emptiness}

  **Verdict:** Occasionalism fatally undermines the rational basis for induction by making the uniformity of nature entirely contingent upon potentially arbitrary divine volition, rendering empirical knowledge and science ultimately unfounded.
