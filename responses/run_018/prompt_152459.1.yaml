prompt: |-
  I'm on the volunteer grant board for our towns community center. Next tuesday we vote on funding a workshop called Cleaning Your Moral Lens — run by locals who want to teach people how to tell the difference between just not liking something and being unfair about it. They have people rate gut reactions to practices, then show cross-culture data, and if your reaction stays strong even after you learn people you admire do it too, they call it bias; if it softens, they call it preference. They call that second part the preference-inversion test. Some board members love it, others say its rigged because 'people you admire' is just your own moral circle, so the workshop smuggles in one view and calls it science. I need a memo for the meeting recommending approve, reject, or approve with conditions, with reasons folks can actually reply to, and I want the strongest point for the losing side included honestly. I dont have any formal background in this, just been chewing on it myself, and please seperate whats pretty settled from whats genuinely fought over by people who know the topic — dont present a contested take like its the only view. Also no lists of books or citations I cant verify.
