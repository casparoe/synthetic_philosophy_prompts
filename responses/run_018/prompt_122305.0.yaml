prompt: |-
  so my reading group (me, my roommate, and like six people from a philosophy-adjacent discord) has been slogging through philosophy of mind this term, and last week we finally got to the Chase and Sanborn quining qualia paper. the group is now basically split in half: one side thinks qualia are the single most certain thing there is, the other side thinks the concept is a broken posit that falls apart the moment you press on it, and after two hours of going in circles we decided to end the semester with a dumb little zine instead of another argument. i'm laying it out this weekend and i need a centerpiece.

  what i want is a fake government recall notice — like one of those URGENT: RECALL AND SAFETY NOTICE bulletins you see taped up in a laundromat — announcing the recall of qualia. deadpan throughout, 600-700 words plus a headline, formatted with the real bureaucratic furniture: product description, affected models and serial numbers, nature of the hazard, what consumers should do immediately, an FAQ, and a contact line. include at least one quote from a spokesperson for an institute of intrinsic properties who objects to the recall, and one from a consumer who insists theirs are fine.

  the constraint i care most about is that the jokes come from getting the actual argument right, not from 'lol subjective experiences aren't real.' some things i want worked in: the four hallmark features (ineffable, intrinsic, private, immediately apprehensible in consciousness) treated as product specs that make the unit impossible to inspect, test, ship, or return; the recall being triggered by the finding that the only instrument certified to detect the product — introspection — systematically misreports it; the agency's official line that consumer reports about the product are perfectly good data while not being evidence that the product exists; failure modes listed with names that evoke the standard intuition pumps (spectrum inversion, the case where the units change but the owner can't tell, the case where there are none and nothing changes); and the agency quietly never being able to say what, exactly, it is recalling. nobody in the piece should ever state the argument flat out — no line like 'therefore qualia don't exist' or 'the concept is incoherent' — the whole thing should land as a reductio of how qualia get defined in the first place. someone who's never read any of this should still enjoy it as nightmare bureaucracy, and someone who has should finish it and feel a bit sick. and please spare us the koala pun, we've all heard it.
reasoning: |-
  Okay, the user wants a fake government recall notice for qualia, modeled after those urgent bulletins you see in laundromats. They're part of a philosophy reading group that just debated Dennett's "Quining Qualia" paper, and the group is split on whether qualia exist. The recall notice needs to be deadpan, 600-700 words, with bureaucratic elements like product descriptions, hazard details, FAQs, and quotes. 

  Key constraints: The humor must come from accurate philosophical arguments, not cheap shots at subjectivity. Need to incorporate the four hallmark features of qualia (ineffable, intrinsic, private, immediately apprehensible) as design flaws. The recall is triggered because introspection—the only detection tool—is unreliable. The agency must treat consumer reports as data but deny they prove qualia exist. Failure modes should reference classic thought experiments like spectrum inversion. Crucially, no explicit statements like "qualia don't exist"—the absurdity should emerge from the definition itself. Inside jokes for philosophers, but accessible as surreal bureaucracy to outsiders. And no koala puns.

  The user's deeper needs: They want a centerpiece for their zine that captures the debate's exhaustion while nailing the philosophy. The "nightmare bureaucracy" angle is brilliant—it mirrors how qualia definitions collapse under scrutiny. The "feel sick" comment suggests they want the piece to unsettle, like Dennett's paper does. Their group's fatigue ("slogging," "going in circles") means this should feel cathartic. 

  Structure thoughts:
  - Headline: Urgent, recall-ish. "Recall and Safety Notice" feels right.
  - Product description: Frame qualia as defective units with specs that make inspection impossible. List the four features as flaws.
  - Hazard: Introspection as faulty detection tool causing "undetectable malfunction." Reference inverted spectrum, etc., as failure modes.
  - Consumer action: "Cease all reliance" is bureaucratic gold. "Report absence" leans into paradox.
  - FAQ: Deny qualia's existence while validating reports. Include the "philosophical zombie" reference subtly.
  - Quotes: Spokesperson defending qualia (leaning on intrinsic properties), consumer insisting theirs work fine (echoing Cartesian certainty).
  - Contact line: Voided warranty hotline for dark humor.

  Tone must stay flat. No winking. Let the bureaucracy's logic implode on itself. For philosophers, the dread comes from seeing how recall logic mirrors Dennett's argument. For others, it's just Kafkaesque horror about recalled consciousness. 

  Avoiding pitfalls: No existence denials outright. The spokesperson quote is key for "balance" while undermining itself. Consumer quote highlights the circularity. "No documented safe operation" undercuts both. The "what is being recalled" silence in the FAQ is the punchline.

  Word count target: 650-ish. Draft will trim fat but keep all specs. Testing jokes: "undocumented intrinsic properties" mangles philosophical jargon beautifully. "Report absence" is darkly funny. Warranty voided at manufacture kills Cartesian foundationalism.

  Final check: Hits all requested elements? Yes. Philosophy accurate? Yes—Dennett’s points covered without naming him. Accessible? Yes, if you squint at any recall notice. Koala-free? Painfully so.
