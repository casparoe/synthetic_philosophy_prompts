  Hmm, this requires careful construction. The key elements needed are: peer status with identical training and accuracy history, asymmetric access to evidence types (oral vs documentary), and the crucial twist about introspective access to one's own reasoning process. The user wants me to show how conciliationism would force compromise while steadfastness permits holding firm due to that introspection asymmetry.

