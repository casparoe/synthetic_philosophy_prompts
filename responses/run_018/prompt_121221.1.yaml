answer: |-
  Here’s a decision tree handout tackling the "who belongs in the demos?" problem. Each node is a concrete institutional choice, and leaves map to named theories (or flag why they don’t exist). Designed for grad-level sorting without jargon:

  **The Demos Boundary Puzzle: Who Gets a Seat at the Table?**  
  *Start here →*  

  ### 1. Should a long-term resident (pays taxes, lives here 20+ years, holds foreign citizenship) vote in **national elections**?  
      - **YES** → Go to Q2  
      - **NO** → Go to Q3  

  ---

  ### 2. Should highly social non-human animals (e.g., sanctuary apes with complex relationships) have **legal representatives** advocating their interests in policy?  
      - **YES** → Go to Q4  
      - **NO** → Go to Q5  

  ---

  ### 3. Should children (minors) whose lives are shaped by today’s policies have **guaranteed proxies** (e.g., guardians voting on their behalf)?  
      - **YES** → Go to Q5  
      - **NO** → Go to Q6  

  ---

  ### 4. Should **future generations** (people not yet born) have binding proxies (e.g., an ombuds office) in current decisions?  
      - **YES** → **→ LEAF: All-Affected Interests**  
          *(Everything impacted gets a voice, human or not, now or later)*  
      - **NO** → **→ LEAF: Stakeholder Democracy + Non-Human Rights**  
          *(Voting for residents + reps for apes, but no future voice. Rare hybrid!)*  

  ---

  ### 5. Should citizens living abroad **permanently** (e.g., 3rd-gen expats) lose national voting rights?  
      - **YES** → **→ LEAF: Stakeholder Democracy**  
          *(Voting tied to residency/stakes, not just birthright)*  
      - **NO** → **→ LEAF: Citizenship Universalism**  
          *(Citizens vote forever, even if disconnected. Non-humans/minors excluded.)*  

  ---

  ### 6. Should a group under long-term military occupation (no sovereignty) get to vote in the **occupier’s elections**?  
      - **YES** → **→ LEAF: All-Subjected Principle**  
          *(If you’re ruled by a power, you should vote in it)*  
      - **NO** → **→ LEAF: Democratic Closure / Co-Nationalism**  
          *(Only pre-defined "people" (nation/citizens) belong. Strict borders.)*  

  ---

  ### Unnamed/Unoccupied Leaves & Notes:  
  - **Q4 → "NO"** (Stakeholder + Non-Human): No major theorist defends this. *Why empty?* Politically toxic (prioritizing apes over future humans) + logically tense.  
  - **Q3 → "NO" + Q6 → "YES"** (All-Subjected): Includes occupied peoples but excludes kids. *Why unnamed?* Unexplored niche—theories usually address kids *or* sovereignty, not this combo.  
  - **Q2 → "NO" + Q3 → "NO"** (Path to Q6): Pure exclusion of non-citizen residents, minors, *and* apes. Maps to **Hard Closure** (ultra-nationalist) views.  

  ---

  ### "Can’t Separate" Pairs:  
  - **Stakeholder Democracy** (Q5→YES) vs. **All-Affected** (Q4→YES) *in practice*: Both often include residents but disagree on non-humans/futures. Yet in *human-only* demos debates, they collapse into similar policies.  
  - **Citizenship Universalism** (Q5→NO) vs. **Co-Nationalism** (Q6→NO): Both exclude non-citizens, but Universalism keeps expats—yet neither has a clear real-world mechanism for cutting off diaspora votes.  

  ---

  **Design Notes:**  
  - Branch logic forces tradeoffs (e.g., saying "yes" to apes pushes you toward futures; rejecting residents leads to kid/minority dilemmas).  
  - "Weirdly specific" cases make abstract theories tangible (apes = non-human personhood test; occupation = coercion test).  
  - The "unnamed" leaves highlight where theory hasn’t gone—useful for paper topics!  
  - *Casual vibe*: No citations, no Greek letters. Just "here’s a messed-up scenario—pick your poison."  

  Typos intentional? Nah, but if you spot one, blame the democracy gremlins. Use this to sort views, then dive into why theorists defend/avoid each leaf.
