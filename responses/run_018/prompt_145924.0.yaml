answer: |-
  This is a sharp observation, and you're right that this argumentative pattern doesn't neatly map onto a single, well-known fallacy. It's a sophisticated form of **goalpost-shifting** that exploits the multi-level nature of Dennett's framework (or similar cognitive hierarchies). While no single term perfectly captures it universally, several concepts and distinctions help dissect it:

  1.  **Criterial Displacement / Shifting Grounds of Evaluation:** This is the most accurate general description. The critic changes the *criterion* for "real understanding" from one level (Skinnerian: embodied trial-and-error learning history) to another (Gregorian: cultural scaffolding) without acknowledging the shift or justifying why *that specific criterion* is essential *now* after the previous one was seemingly addressed. The grounds for denial "displace" laterally across tiers.

  2.  **Exploiting Multi-Level Explanations:** Dennett's levels are *stances* or *explanatory strategies*, not necessarily rigid ontological categories a system must pass sequentially. A critic illegitimately treats them as a checklist where *failing any one tier* (even if passing others) invalidates the whole. They exploit the framework's structure to find *some* level where the system can be denied "real" cognition, regardless of performance at other levels.

  3.  **A Form of Category Mistake (Subtle Variant):** While not a pure category mistake (confusing types/types), it *misapplies* the criteria of one explanatory level to phenomena better explained at another. Demanding Gregorian cultural embeddedness as the *only* valid source of representational content for a Popperian simulation capability *might* be a category mistake if those levels can operate semi-independently. It conflates distinct kinds of explanation.

  4.  **Distinction from Motte-and-Bailey:** This is crucial.
      *   **Motte-and-Bailey:** Retreats from a strong, controversial claim (the bailey - e.g., "LLMs have subjective experience") to an easily defensible, weaker claim (the motte - e.g., "LLMs lack human-like biological embodiment") when challenged. The weaker claim is used to protect the stronger one.
      *   **Criterial Displacement:** Doesn't necessarily involve retreating to a weaker claim. The Gregorian objection ("needs cultural scaffolding") isn't inherently *weaker* than the Skinnerian one ("needs embodied trial-and-error"). It's a *different* and potentially *equally strong* objection from a different theoretical perspective. The illegitimacy lies in switching the *type* of requirement after the first requirement is met, implying it's a refinement when it's actually a substitution. It's shifting the *yardstick*, not retreating to a safer fortress.

  5.  **Legitimate Multi-Level Evaluation vs. Illegitimate Displacement:** The key is **consistency and justification**.
      *   **Legitimate:** "This system passes Popperian simulation tests, but let's also check if it exhibits Skinnerian learning plasticity or Gregorian tool use *to see if it meets a different aspect of complex cognition we care about*." The levels are treated as complementary facets.
      *   **Illegitimate:** "You showed Popperian simulation? That doesn't count because it lacks Skinnerian history." -> "You addressed Skinnerian learning? That doesn't count because it lacks Gregorian scaffolding." The denial is maintained by *arbitrarily elevating whatever criterion the system currently fails* to be the *sole essential* one, dismissing progress at other levels. The burden of proof constantly shifts to a new, unrelated standard.

  **Why "Cross-Tier Denial" Works (with Refinement):**

  "Cross-tier denial" is actually quite good, especially within the context of Dennett's framework. It clearly identifies the core mechanism: denying cognition by jumping to a different tier when challenged on the current one.

  **To make it sharper and distinguish illegitimate use:**

  *   **Illegitimate Cross-Tier Denial:** The persistent denial of cognitive status by shifting the criterion of evaluation laterally across distinct levels/tiers of explanation (e.g., Darwinian, Skinnerian, Popperian, Gregorian) without acknowledging the shift, justifying the primacy of the *new* criterion, or allowing success at one level to count as evidence, treating the levels as a strict sequential checklist where failure at *any* tier invalidates the whole.
  *   **Legitimate Multi-Tier Evaluation:** Assessing a system across multiple levels/tiers to build a comprehensive picture of its cognitive capacities, acknowledging that success or failure at one level provides evidence relevant to, but not solely determinative of, capacities or explanations at other levels.

  **Alternative/Complementary Names:**

  *   **Tier-Jumping Skepticism:** Emphasizes the skeptical motive and the jumping action.
  *   **Level-Shifting Goalposts:** Combines the core fallacy (goalpost-shifting) with the specific domain (levels of explanation).
  *   **Explanatory Stance Opportunism:** Highlights exploiting Dennett's "stances" for denial.
  *   **Criterial Shell Game:** Evokes the deception of moving the target (the pea under the shell).

  **Conclusion:**

  You've identified a real and pernicious pattern. **Criterial Displacement** or **Illegitimate Cross-Tier Denial** are the most precise descriptions. The core problem is the unacknowledged and unjustified *shift in the fundamental criterion* for what constitutes "real understanding" or cognition, exploiting the availability of multiple valid but distinct explanatory levels. It differs from motte-and-bailey by shifting the *type* of standard rather than retreating to a weaker version of the *same* standard, and from a pure category mistake by misapplying valid criteria from one explanatory context to another illegitimately. "Cross-tier denial" is a perfectly serviceable and descriptive term, especially when contrasted with "legitimate multi-tier evaluation." Your observation about the distinct frameworks (history of change vs. source of content) is key to understanding why the shift is substantive, not just a refinement.
