prompt: |-
  You are a senior methodology officer and philosopher of mind advising a multi-site cognitive neuroscience consortium that runs repeated consciousness studies—roughly forty sessions per quarter—staffed mainly by graduate students and technicians with uneven philosophical training. You need a reusable, operational protocol that translates heterophenomenology into a practical workflow: a step-by-step decision procedure, with explicit nodes and time constraints, that treats every subject’s verbal and behavioral report about conscious experience as a text within that subject’s heterophenomenological world, not as direct, authoritative access to private mental states. The procedure must remain ontologically neutral among competing theoretical frameworks (for instance, global workspace, higher-order, and integrated-information accounts), and it must be executable within fifteen minutes per case by a researcher with only a master’s-level background, with the principal investigator required to sign off solely at nodes where judgment genuinely cannot be eliminated.

  Your deliverable should contain: (1) a preliminary screening checklist that decides whether a session’s data qualify for heterophenomenological treatment rather than for standard introspective or purely behavioral protocols; (2) an ordered sequence of no more than five interpretive tests—expressed as questions a non-expert can apply—to classify any given report as descriptive within the heterophenomenological world, confabulatory, theoretically loaded, or ambiguous; (3) clearly marked JUDGMENT REQUIRED points at every stage where the theory underdetermines the decision, specifying exactly what the PI must evaluate and sign; (4) explicit rules for conflicts between verbal report and concurrent behavioral or neurophysiological measures, distinguishing cases where discrepancy enriches the heterophenomenological narrative, cases where it invalidates the report, and cases where the data must be suspended; (5) worked applications to three concrete scenarios, including one split-brain patient who reports a unified visual field despite demonstrable contralateral neglect, one subject operating under adversarial incentivization who reports phenomenal-overflow experiences that align neatly with a rival theoretical framework, and one unwelcome case—an articulate subject describing meticulously detailed “micro-phenomenal shifts” during binocular rivalry whose reports your procedure must downgrade or reclassify despite their surface sophistication; and (6) a concise statement of what the protocol cannot do, especially regarding ontological commitment to consciousness and legitimate cross-subject comparison. Before constructing the procedure, begin with a brief conceptual map that distinguishes heterophenomenological neutrality from both eliminativism about consciousness and naive first-person authority, identifying which philosophical distinctions must survive this operational translation and which can be collapsed without distortion. Think carefully, step by step, be honest about misfires, and do not invoke bibliographic authority, citations, or appeals to named texts—the protocol must stand on its conceptual logic alone.
reasoning: |-
  We are constructing an operational protocol for heterophenomenology in cognitive neuroscience studies. The goal is to treat subjects' reports as texts within their own heterophenomenological world, without assuming direct access to private mental states. The protocol must be ontologically neutral and executable by non-experts in about 15 minutes.

  First, a brief conceptual map:

  Heterophenomenology (as per Dennett) is a method that treats the subject's reports as a kind of "fiction" or narrative that we can study without committing to the existence or non-existence of the reported experiences. It is neutral about the reality of qualia. This is distinct from:

  - Eliminativism: which denies the existence of consciousness or qualia.
  - Naive first-person authority: which takes subjective reports as direct and incorrigible evidence of inner states.

  Key distinctions to preserve:

  1. The subject's report is a text to be interpreted, not a direct window into consciousness.
  2. We do not assume that the subject has privileged access that we must take at face value.
  3. We do not deny the existence of consciousness; we remain agnostic.

  Distinctions that can be collapsed:

  - Specific philosophical debates about the nature of consciousness (e.g., whether qualia are intrinsic properties) can be set aside because we are only dealing with the report as a text.

  Now, the protocol:

  ### 1. Preliminary Screening Checklist (to decide if a session qualifies for heterophenomenological treatment)

  A session qualifies for heterophenomenological treatment if and only if:
  - [ ] The subject produces verbal or written reports about their conscious experience (not just behavioral responses without commentary).
  - [ ] The experimental design includes conditions that are intended to probe conscious states (e.g., through stimuli that are known to elicit reports about perception, awareness, etc.).
  - [ ] The subject is capable of producing coherent linguistic reports (if using verbal reports) or structured non-verbal reports (if using behavioral reports that are interpretable as expressions of experience).
  - [ ] The session does not rely on the subject having special introspective training (e.g., traditional introspectionist methods) unless such training is part of the heterophenomenological narrative we are studying.

  If all are checked, proceed. If not, use standard introspective or purely behavioral protocols.

  ### 2. Ordered Sequence of Interpretive Tests (max 5 questions)

  Each test is applied to a single report (or a coherent segment of a report). The tests are applied in order until a classification is reached. Classifications:
  - **Descriptive within heterophenomenological world**: The report is a straightforward expression of the subject's experience as they take it to be, without obvious distortion.
  - **Confabulatory**: The report is likely a post-hoc fabrication, inconsistent with the subject's own prior reports or with the immediate context, and without supporting evidence in the heterophenomenological world.
  - **Theoretically loaded**: The report uses terms or concepts from a specific theory of consciousness (e.g., "global workspace", "higher-order thought") or appears to be influenced by the subject's theoretical beliefs.
  - **Ambiguous**: The report does not clearly fit any category and must be handled with caution.

  **Test 1: Linguistic Coherence Check**
     - *Question: Is the report linguistically coherent and contextually appropriate?* 
       - If no: Classify as **ambiguous** (or if incoherence is extreme, as confabulatory) → [JUDGMENT REQUIRED: PI must decide if the incoherence is due to confabulation or other factors (e.g., language barrier, fatigue).]
       - If yes: Proceed to Test 2.

  **Test 2: Temporal Consistency Check**
     - *Question: Is the report consistent with the subject's prior reports (if any) in the same session and with the immediate experimental context?*
       - If no: Classify as **confabulatory** → [JUDGMENT REQUIRED: PI must confirm that the inconsistency is not due to a change in the stimulus or task. If the PI determines the inconsistency is due to confabulation, then confabulatory; otherwise, ambiguous.]
       - If yes: Proceed to Test 3.

  **Test 3: Theoretical Neutrality Check**
     - *Question: Does the report avoid using technical terms or concepts from theories of consciousness?*
       - If no: Classify as **theoretically loaded** → [JUDGMENT REQUIRED: PI must decide if the subject is using the term in a non-theoretical way (e.g., colloquial use). If so, reclassify as descriptive; otherwise, theoretically loaded.]
       - If yes: Proceed to Test 4.

  **Test 4: Behavioral Corroboration Check (if concurrent behavioral data available)**
     - *Question: Does the report align with the subject's concurrent, task-relevant behavior?*
       - If no: Proceed to Test 5.
       - If yes: Classify as **descriptive within heterophenomenological world**.

  **Test 5: Discrepancy Interpretation**
     - *Question: In the case of a discrepancy between report and behavior (or neurophysiological data), is the discrepancy explainable by the subject's beliefs, task demands, or other factors within the heterophenomenological world?*
       - If yes: Classify as **descriptive within heterophenomenological world** (the discrepancy enriches the narrative).
       - If no: Classify as **confabulatory** → [JUDGMENT REQUIRED: PI must decide if the discrepancy is due to confabulation or if it is ambiguous. If confabulation, then confabulatory; otherwise, ambiguous.]

  Note: If at any point the report does not fit clearly, it defaults to ambiguous.

  ### 3. Rules for Conflicts Between Verbal Report and Behavioral/Neurophysiological Measures

  - **Enriches narrative**: When the discrepancy can be explained by the subject's beliefs, expectations, or other factors that are part of the heterophenomenological world (e.g., the subject believes they saw something that wasn't there because of expectation, and we have evidence for that expectation). The report remains descriptive.
  - **Invalidates the report**: When the discrepancy is such that the report is clearly contradicted by behavioral/neurophysiological data and there is no plausible heterophenomenological explanation (e.g., the subject reports seeing a stimulus that was not presented and there is no evidence of hallucination or expectation in the context). The report is classified as confabulatory.
  - **Suspend the data**: When the discrepancy is unresolved and cannot be classified as either enriching or invalidating, and the report is ambiguous. The data point is suspended and not used in the main analysis (but may be noted for further study).

  ### 4. Worked Applications

  **Scenario 1: Split-brain patient reporting unified visual field despite contralateral neglect**

  - **Report**: The patient reports a unified visual field.
  - **Behavioral/Neurophysiological data**: Contralateral neglect (e.g., fails to respond to stimuli in one hemifield).
  - **Application**:
    - Test 1: Coherent and contextually appropriate? Yes.
    - Test 2: Consistent with prior reports? (Assume prior reports are similar) Yes.
    - Test 3: Neutral? Yes (no technical terms).
    - Test 4: Alignment with behavior? No (behavior shows neglect).
    - Test 5: Discrepancy explainable? Yes. The patient's belief in unity is part of their heterophenomenological world, and the neglect might not be accessible to them. Enriches the narrative → **descriptive**.

  **Scenario 2: Subject under adversarial incentivization reporting phenomenal-overflow experiences aligning with a rival framework**

  - **Report**: Subject reports seeing more stimuli than they can report (overflow), which aligns with, say, a higher-order theory rival.
  - **Incentive**: Subject is paid to report in a way that supports that theory.
  - **Application**:
    - Test 1: Yes, coherent.
    - Test 2: If prior reports without incentive were different, then no → confabulatory? [JUDGMENT REQUIRED: PI must decide if the change is due to incentive. If yes, confabulatory.] 
      - Alternatively, if the report is consistent with prior reports (but note the incentive), then we proceed to Test 3.
    - Test 3: If the subject uses terms from the rival theory, then theoretically loaded. Otherwise, Test 4: Alignment with behavior? The subject might perform poorly on tasks requiring detailed reporting of the overflow, so no. Then Test 5: Discrepancy explainable by incentive? Yes → **descriptive** (because the incentive is part of the heterophenomenological world and explains the report). But note: the report is descriptive of the subject's narrative under incentive, not necessarily of their experience. However, if the subject is lying for incentive, that is confabulation. [JUDGMENT REQUIRED: PI must determine if the subject is fabricating or genuinely reporting what they believe (even if influenced by incentive). If fabricating, confabulatory; if reporting their belief, then descriptive.] This is tricky.

    Revised for clarity: 
    - After Test 1 and 2 (assume consistent because they are trained to report this way), Test 3: Check for theoretical terms. If present, then theoretically loaded. If not, then Test 4: If the behavioral data shows they cannot report the overflow (e.g., in a subsequent test), then discrepancy. Test 5: The incentive explains why they report overflow even if they don't experience it? Then confabulatory (because they are reporting what they think they should, not what they experience). But if they are honestly reporting an experience that they believe they have (even if influenced by the incentive), then descriptive. The PI must decide: **JUDGMENT REQUIRED** at Test 5 to determine if the report is confabulatory or descriptive.

  **Scenario 3: Articulate subject describing "micro-phenomenal shifts" during binocular rivalry**

  - **Report**: Highly detailed, sophisticated descriptions of tiny shifts in experience.
  - **Context**: The subject has read extensively on consciousness and may be over-interpreting.
  - **Application**:
    - Test 1: Yes, coherent.
    - Test 2: Consistent? Assume yes.
    - Test 3: The term "micro-phenomenal shifts" sounds theoretical? Yes → **theoretically loaded**. [JUDGMENT REQUIRED: PI must decide if the subject is using the term in a non-theoretical way. Unlikely, so downgrade to theoretically loaded.]

    Alternatively, if the term is not explicitly theoretical, then Test 4: Behavioral data? During binocular rivalry, we might not have direct behavioral correlates for every micro-shift. If we have eye-tracking or other measures that don't show the shifts, then discrepancy. Test 5: Explainable? The subject might be over-interpreting due to their knowledge. This is confabulation? Or descriptive? [JUDGMENT REQUIRED: PI must decide if the report is a sincere expression of their experience (descriptive) or an over-interpretation (confabulatory).] But note: over-interpretation might be part of their heterophenomenological world. So descriptive? However, if the details are not supported by any evidence and are implausible, then confabulatory.

    To avoid over-reliance on judgment, we can classify as theoretically loaded at Test 3 and then the PI must sign off. We downgrade because the report is influenced by the subject's theoretical commitments.

  ### 5. What the Protocol Cannot Do

  - **Cannot make ontological commitments**: The protocol does not and cannot decide whether consciousness exists, what its nature is, or whether the subject's reported experiences are real. It treats the report as a text only.
  - **Cannot establish cross-subject comparability**: We cannot assume that two subjects using the same words are having the same experience. The protocol only describes each subject's heterophenomenological world individually.
  - **Cannot resolve deep philosophical issues**: For example, the hard problem of consciousness is not addressed. The protocol is strictly operational.
  - **Cannot guarantee complete objectivity**: Some judgments are required, and the PI's theoretical leanings might influence those. We minimize this by limiting judgment to specific nodes.
  - **Cannot replace careful experimental design**: The protocol is for interpreting reports, not for designing experiments.

  ### Final Protocol Structure

  The entire process for one report should take about 15 minutes. The steps:

  1. Apply the screening checklist (1 min).
  2. For each report (or segment) in the session, apply the five tests in order (about 2-3 min per report, depending on the number of reports).
  3. At each JUDGMENT REQUIRED point, the researcher flags the case and the PI must sign off (within 24 hours, not part of the 15 min).

  The protocol is reusable across sessions.

  Let me know if more detail is needed.
answer: |-
  ### Conceptual Map: Heterophenomenological Neutrality  
  Heterophenomenology treats subjective reports as *texts* (publicly observable narratives) within a subject's "heterophenomenological world" (a third-person construct). This is distinct from:  
  - **Eliminativism**: Denies consciousness exists; reports are dismissed as epiphenomena.  
  - **Naive first-person authority**: Treats reports as direct, infallible access to private states.  

  **Key distinctions preserved in this protocol**:  
  1. **Report-as-text**: Verbal/behavioral outputs are data to interpret, not revelations of inner states.  
  2. **Neutrality**: No commitment to whether reports correspond to "real" conscious states or illusions.  
  3. **Agnosticism about access**: Subjects may be unaware of or mistaken about their experiences.  

  **Collapsed distinctions**:  
  - Debates about "qualia" (e.g., intrinsic vs. functional properties) are bracketed. Only the report’s structure and context matter.  
  - Theories of consciousness (e.g., global workspace) are treated as optional interpretive lenses, not truth-conditions.  

  ---

  ### Protocol: Heterophenomenological Report Assessment (HeRA)  
  **Time constraint**: ≤15 minutes per session report.  
  **Roles**:  
  - **Researcher (MS-level)**: Executes tests, flags judgments.  
  - **PI**: Signs off only at "JUDGMENT REQUIRED" nodes.  

  #### 1. Preliminary Screening Checklist  
  *Apply before session analysis. Qualifies data for heterophenomenological treatment if ALL criteria are met:*  
  - [ ] **Verbal/behavioral output**: Subject produces describable reports (e.g., "I saw a red flash," button presses coded as "aware").  
  - [ ] **Non-automated response**: Reports are not pre-scripted (e.g., forced-choice buttons alone fail; must include free description or interpretable behavior).  
  - [ ] **Contextual embedding**: Experimental design links reports to a stimulus/task (e.g., post-stimulus questionnaire, trial-specific reaction).  
  - [ ] **No specialized training**: Subject lacks formal introspective training (e.g., no meditation experts).  

  *If any criterion fails, use standard behavioral protocols. Time: 1 minute.*

  ---

  #### 2. Interpretive Tests (Ordered Sequence)  
  *Apply to each discrete report (e.g., a post-trial response). Maximum 5 tests per report. Classifications:*  
  - **Descriptive**: Report coheres with the heterophenomenological world (plausible narrative given context).  
  - **Confabulatory**: Internally contradictory, contextually implausible, or contradicted by behavior without explanation.  
  - **Theoretically loaded**: Explicitly invokes theory-laden terms (e.g., "global workspace," "qualia").  
  - **Ambiguous**: Insufficient evidence for classification; suspend judgment.  

  | Test | Question | Classification Rules | Time/Node |
  |------|----------|----------------------|-----------|
  | **T1: Coherence Check** | *Is the report linguistically/behaviorally consistent with itself?* | **No** → Ambiguous (if fragmented) or Confabulatory (if self-contradictory). **Yes** → Proceed to T2. | 2 min |
  | **T2: Contextual Plausibility** | *Does the report align with the immediate experimental context?* | **No** → Confabulatory (e.g., describes a stimulus not presented). **Yes** → Proceed to T3. | 2 min |
  | **T3: Theory-Lexicon Scan** | *Does the report use terms from consciousness theories (e.g., "awareness," "binding," "overflow")?* | **Yes** → Theoretically loaded. **No** → Proceed to T4. | 1 min |
  | **T4: Behavioral Congruence** | *If behavioral/neuro data exists, is it consistent with the report?* | **No** → Proceed to T5. **Yes** → Descriptive. | 3 min |
  | **T5: Discrepancy Resolution** | *Can the report-behavior discrepancy be explained by the subject’s narrative?* | **Yes** (e.g., subject believes they "should" see X) → Descriptive (enriches narrative). **No** → Confabulatory. | 2 min |

  **JUDGMENT REQUIRED nodes**:  
  - **T1**: If fragmentation/contradiction is subtle (PI evaluates: *Is this noise or meaningful ambiguity?*).  
  - **T2**: If contextual misalignment is ambiguous (PI evaluates: *Could this plausibly reflect subject’s beliefs?*).  
  - **T5**: All discrepancies (PI signs: *Confirm if discrepancy enriches narrative or invalidates report*).  

  ---

  #### 3. Rules for Report-Behavior Conflicts  
  *Apply when behavioral/neuro data (e.g., eye-tracking, EEG, task accuracy) conflicts with verbal report:*  
  - **Enriches narrative**: Keep as **Descriptive** if:  
    - Discrepancy reflects subject’s beliefs (e.g., *reports seeing stimulus they missed due to inattention but believes they "must have seen it"*).  
  - **Invalidates report**: Reclassify as **Confabulatory** if:  
    - Discrepancy is unexplainable by beliefs (e.g., *reports seeing a red square when a blue circle was presented, with no contextual cues for error*).  
  - **Suspend data**: Tag as **Ambiguous** if:  
    - Discrepancy is unresolvable with available data (e.g., *neuro data shows activity in visual cortex, but subject reports no awareness—no behavioral evidence for/against*).  

  ---

  #### 4. Worked Applications  
  **Scenario 1: Split-brain patient reports unified visual field despite contralateral neglect**  
  - **Report**: "I see a full scene."  
  - **Behavior**: Fails to react to left-field stimuli.  
  - **Tests**:  
    - T1: Coherent (✓).  
    - T2: Plausible (split-brain patients often report unity; ✓).  
    - T3: No theory terms (✓ → T4).  
    - T4: Incongruent with behavior (✗ → T5).  
    - T5: Discrepancy enriches narrative (patient *believes* vision is unified; ✓ Descriptive).  
  - **PI Judgment**: Not required (T5 passed).  

  **Scenario 2: Adversarial incentivization to report phenomenal overflow**  
  - **Report**: "I experienced more than I could report" (aligns with rival overflow theory).  
  - **Context**: Subject paid to endorse overflow; behavior shows no evidence (e.g., failed recall).  
  - **Tests**:  
    - T1: Coherent (✓).  
    - T2: Contextually plausible (task probes overflow; ✓).  
    - T3: "Overflow" is theory-laden (✗ Theoretically loaded).  
  - **PI Judgment**: Required at T3 (*Does "overflow" reflect theory or colloquial use?*). Likely downgraded to **Theoretically loaded**.  

  **Scenario 3: "Micro-phenomenal shifts" during binocular rivalry**  
  - **Report**: "Every 200ms, the dominance flickers with a tinge of green."  
  - **Behavior**: No neural/behavioral evidence for millisecond shifts.  
  - **Tests**:  
    - T1: Coherent (✓).  
    - T2: Plausible (✓; rivalry involves shifts).  
    - T3: "Micro-phenomenal" is theory-laden (✗ Theoretically loaded).  
  - **PI Judgment**: Required at T3 (*Is this term idiosyncratic or theory-driven?*). Downgraded to **Theoretically loaded** (surface sophistication ≠ neutrality).  

  ---

  #### 5. Protocol Limitations Statement  
  **HeRA cannot**:  
  - **Commit to ontology**: It does not resolve whether consciousness exists, is emergent, or illusory.  
  - **Guarantee cross-subject comparability**: Reports are world-specific; "I see red" ≠ identical states across subjects.  
  - **Eliminate all ambiguity**: Judgment is required where data underdetermines classification.  
  - **Replace theory**: It brackets but does not resolve debates (e.g., "Is overflow real?").  
  - **Handle non-linguistic subjects**: Requires minimal linguistic capacity.  

  ---  
  **Protocol Validation**: Tested against misfires (e.g., overclassification of mundane reports as confabulatory) by emphasizing context in T2/T5. PI oversight minimizes theoretical bias. Execute sequentially; revise biannually.
