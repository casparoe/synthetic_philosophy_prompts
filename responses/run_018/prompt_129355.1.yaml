  As a retired physicist who has only recently begun reading seriously in philosophy of history and collective memory, I have been trying to understand whether comparative judgments about “working through the past” can be systematized at all, or whether they collapse into ad hoc cultural commentary. To test this, I have been tracking the advisory opinions of a conceptual construct—call it the Transnational Panel on Mnemonic Justice—which evaluates national memory regimes according to whether they achieve reflexive discontinuity: a structural arrangement by which the present polity can recognize itself as discontinuous with a perpetrator regime rather than as its continuous heir.

  The panel’s published verdicts on four regimes are as follows.

  1. Germany’s Vergangenheitsbewältigung (Stolpersteine distributed across municipalities, mandatory Holocaust education in federal curricula, and state funding for critical memorial museums): Verdict—achieves reflexive discontinuity; practices are institutionally coherent across federal and local levels and do not depend on victim-group initiative alone.

  2. Japan’s official treatment of the Asia-Pacific War (state-sponsored official visits to Yasukuni Shrine, textbook authorization processes that permit omission of coercion involving comfort women, and absence of a federal curriculum mandate on wartime aggression): Verdict—fails to achieve reflexive discontinuity; commemorative closure is actively maintained by parallel state practices that undermine civil-society remembrance.

  3. Turkey’s official stance on the Armenian genocide (criminal statutes prohibiting public acknowledgment, absence of state memorials, and state-sponsored counter-narratives in education): Verdict—exhibits active mnemonic suppression; not merely a failure of discontinuity but a structurally enforced continuity with the perpetrator regime’s denial.

  4. The American South’s post-2020 handling of Confederate monumentality (localized removals of statues in some municipalities, absence of statewide mandatory curriculum reform on slavery and Jim Crow, and preservation of “heritage” framing in several state legislatures): Verdict—transitional and structurally incomplete; discontinuity is achieved symbolically in some localities but is not institutionally secured against legislative reversal.

  These four verdicts are jointly consistent with more than one underlying principle. Two candidates strike me.

  Rule A (Institutional Coherence): A regime achieves reflexive discontinuity only if commemorative practice and educational policy are aligned across all levels of governance, with no official parallel practice that rehabilitates the perpetrator narrative.

  Rule B (Generational Transmission Mechanism): A regime achieves reflexive discontinuity only if it institutionalizes critical remembrance through compulsory, state-mandated educational transmission, regardless of whether local symbolic practices remain contested.

  Now consider the following new case.

  Case 5: A consolidated post-conflict democracy enacts a federal mandate requiring all secondary schools to teach the history of its civil conflict through a curriculum that includes perpetrator testimony, victim testimony, and explicit state acknowledgment of responsibility. At the same time, the law grants individual municipalities an absolute veto over the removal or alteration of any public monument erected before 1990, and it establishes a “balanced heritage” fund that allocates equal state resources to memorials for victims and to preserved sites commemorating the former regime’s “order and stability,” without hierarchical narrative framing.

