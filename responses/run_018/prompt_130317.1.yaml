answer: |-
  This patchwork reveals deep, often unexamined tensions in democratic theory. Let's reconstruct the implicit philosophy, assess its necessity, explore alternatives, and confront the consistency problems:

  **Implicit Philosophical Commitments:**

  1.  **Competence:**
      *   **Judgment (Juries/Assemblies):** Assumes "common sense," moral intuition, and basic rationality are widely distributed and sufficient for *evaluating facts* (guilt/innocence) or *identifying core values/principles* (constitutional reform advice). Deliberation among peers is seen as refining this innate capacity. Competence here is *latent* and activated by the specific context.
      *   **Legislation/Governance:** Assumes lawmaking and governing require *specialized, accumulated knowledge* – legal intricacies, economics, diplomacy, bureaucratic management, long-term strategic thinking. This competence is built through *experience* (hence career politicians) and potentially *professional training* (though less explicitly required than for civil servants). Random citizens are seen as lacking this developed expertise for sustained governance.

  2.  **Representation:**
      *   **Election (Lawmaking):** Values *authorization* and *accountability*. Representatives are chosen ("authorized") by the people to act *for* them and can be removed ("accountability") for poor performance. This implies an active principal-agent relationship.
      *   **Sortition (Juries/Assemblies):** Values *descriptive* or *statistical* representation. The random sample *is* the people in microcosm, reflecting demographic diversity and "ordinary" perspectives. Their legitimacy stems from *being* the people, not from being *chosen* by them. There's no ongoing agency relationship.

  3.  **Democratic Legitimacy & Rotation:**
      *   **Election + Term Limits:** Legitimacy comes from the *mandate* of the ballot box. However, this mandate creates risks:
          *   **Corruption of Mandate:** Entrenchment, capture by special interests, disconnect from the public over time.
          *   **Corruption of Person:** Hubris, self-dealing, prioritizing re-election over public good.
          *   *Term limits are the prophylactic:* They forcibly disrupt entrenchment and careerism, aiming to preserve the representative's connection to the mandate's source (the people) and prevent the corruption inherent in *prolonged* power.
      *   **Sortition (Temporary):** Legitimacy comes from *statistical representativeness* and the *purity* of the "common person" perspective undiluted by career ambitions. Rotation is inherent in the *temporary, one-off design*. There's *no need* for term limits because:
          *   The risk of corrupting a mandate doesn't exist (no mandate was given).
          *   The short duration prevents significant entrenchment or accumulation of self-serving power/influence.
          *   The representativeness is secured at the outset by the random draw; maintaining it over time isn't the goal.

  4.  **Epistemology (Nature of Political Knowledge):**
      *   **Juries/Advisory Assemblies:** Implicitly embraces an **epistemic** or **deliberative democratic** view for *fact-finding* and *value identification*. Diverse ordinary people, through structured deliberation, can access collective wisdom or discover "right" answers regarding guilt or fundamental societal principles. Knowledge here is *discovered* through interaction.
      *   **Lawmaking/Governance:** Leans towards an **elitist** or **expertise-based** view. Effective governance requires specialized knowledge gained through sustained engagement with complex systems. This knowledge is *accumulated* over time through experience and study. Elections are the (imperfect) mechanism for selecting those deemed most competent or representative enough to wield this complex power.

  **Is This Setup Philosophically Necessary? (Underdetermination)**

  **No.** The specific split isn't logically mandated. Several rival philosophical views could justify similar practices, or entirely different ones:

  1.  **Strong Epistemic Deliberativism:** Could argue *sustained* citizen bodies (via sortition) with training *would* develop superior lawmaking competence through ongoing deliberation, challenging the need for career politicians. Our current system doesn't fully embrace this.
  2.  **Radical Participatory Democracy:** Could reject both elections *and* sortition for legislators in favor of more direct, continuous popular involvement, viewing both representative models as inadequate.
  3.  **Technocracy:** Could argue even elected politicians lack sufficient expertise, favoring greater delegation to non-elected experts (civil servants, commissions), potentially undermining the democratic legitimacy of both elected and sortition models.
  4.  **Mandate vs. Representation Focus:** One could accept elections but reject term limits (arguing experience is paramount and accountability comes only through elections/recall), or accept sortition but demand longer terms *with* rotation mechanisms (arguing descriptive representation needs time to develop competence but still risks distortion).

  **The practice is historically contingent and pragmatically negotiated, not a pure expression of a single coherent philosophy.**

  **Systems Built on Opposite Commitments:**

  1.  **Lifelong Sortition Legislature with Mandatory Training:**
      *   **Changes Needed:** Replace elections with massive, stratified random selection for long (e.g., 10-15 year) or indefinite terms. Institute rigorous, ongoing training in law, economics, policy analysis, deliberation, and ethics.
      *   **Institutional Shifts:** Massive investment in civic education infrastructure. New accountability mechanisms (e.g., powerful recall based on petition + independent review, strong ethics commissions). Civil service role potentially shifts towards pure implementation, with policy initiation residing in the citizen body. Constitution likely rewritten to enshrine sortition.
      *   **Philosophy:** Strong epistemic deliberative democracy: Ordinary people *can* govern competently with time and training. Legitimacy comes from descriptive representation + developed competence. Rotation is less critical than maintaining representativeness and preventing corruption within the long-term body.

  2.  **Elected Assemblies with No Term Limits but Strict Recall:**
      *   **Changes Needed:** Abolish term limits for legislators/executives. Implement robust, accessible recall mechanisms (e.g., lower signature thresholds, regular scheduled recall votes alongside elections, independent oversight of recall petitions).
      *   **Institutional Shifts:** Empowered electoral commissions to manage recalls. Stronger ethics/watchdog bodies. Potential rise of "career politicians," countered by constant threat of recall demanding responsiveness. Civil service stability remains crucial.
      *   **Philosophy:** Accountability trumps forced rotation. Voters can judge when experience is valuable vs. when stagnation/corruption sets in. Assumes voters are competent judges of performance. Legitimacy relies heavily on the *ongoing* threat of removal, not just initial election.

  **The Hidden Consistency Problem: Does the Split Hold Up?**

  The observed inconsistencies highlight genuine tensions:

  1.  **Career Politicians vs. Career Bureaucrats:** We distrust *political* careerism (potential for power-seeking, disconnect) but rely on *administrative* careerism (valued expertise, institutional memory). The implicit view: Technical/administrative competence is non-partisan, accumulated through merit, and essential for stability, while *political* power is inherently corrupting over time and requires periodic cleansing.
      *   **Does it hold?** Partially. Expertise is vital, but bureaucrats *do* wield power and can develop biases, capture, or resistance to political direction. The strict separation is artificial; politics and administration are intertwined. The "solution" (term limits for pols, permanence for bureaucrats) is pragmatic but philosophically messy.
  2.  **Juries (Life/Death) vs. Lawmakers (Budget):** We trust random citizens with immense factual/moral judgment under guidance (judge's instructions) but not with complex, forward-looking resource allocation and rule-making.
      *   **Does it hold?** The distinction rests on:
          *   **Type of Task:** Retrospective fact-finding/value identification (jury) vs. prospective, complex system design (lawmaking).
          *   **Scope:** Narrow, case-specific (jury) vs. broad, systemic (lawmaking).
          *   **Guidance:** Juries operate within strict rules and under judicial oversight; lawmakers face fewer immediate constraints.
      *   **Problem:** This underestimates the complexity of jury decisions (evaluating evidence, witness credibility, applying legal standards) and overestimates the unique difficulty of budget allocation *if* citizens were given time, training, and resources like lawmakers. It also ignores that juries *are* making "policy" at the micro-level (applying societal norms to specific cases). The underlying view of reasoning (simple judgment = innate, complex policy = learned) is overly rigid. Humans can learn complex tasks.

  **Conclusion:**

  The current patchwork reflects a pragmatic, historically evolved compromise between competing democratic values: popular sovereignty vs. effective governance, descriptive representation vs. expertise, accountability vs. stability, and innate common sense vs. learned skill. While the implicit theory (differential competence, distinct sources of legitimacy) provides a *post-hoc* rationale, it is neither strictly necessary nor entirely coherent upon scrutiny. The inconsistencies (career bureaucrats vs. term-limited pols, trusting juries but not citizen governors) reveal the system's struggle to balance distrust of concentrated political power with a need for expertise and stability. Alternative systems based on opposite commitments (lifelong sortition or recall without term limits) are conceivable but would require radical institutional restructuring and rest on different, equally contestable, philosophical foundations about human capacity and the nature of political knowledge. The core tension – between democracy as popular rule and democracy as effective governance – remains fundamentally unresolved.
