     Var[ln(1+fX)] = E[(ln(1+fX))^2] - [E[ln(1+fX)]]^2.
     The student says "halving the stake halves the size of the swings". This is vague. If we interpret "size of swings" as the standard deviation of the wealth multiplier (or log wealth), then note:
     The standard deviation of the wealth multiplier (1+fX) is: 
       E[ (1+fX)^2 ] - (E[1+fX])^2 = ... 
