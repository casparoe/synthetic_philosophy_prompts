     Therefore, when f is halved, the variance is approximately multiplied by (1/2)^2 = 1/4, so the standard deviation is halved. 
     However, this approximation is only valid for small f. In our case, f*=0.10 is small, so the approximation is good. Therefore, the volatility (as measured by standard deviation) is approximately halved.

