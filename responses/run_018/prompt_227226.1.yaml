  1. Does halving the Kelly fraction exactly halve the growth rate? 
     The growth rate is g(f) = E[ln(1+f*X)] where X is a binary random variable: +1 with prob p, -1 with prob q.
     The Kelly fraction f* maximizes g(f). At f*/2, we have g(f*/2) which is less than g(f*). But is the reduction exactly half?
     We can compute the derivative: g'(f) = p/(1+f) - q/(1-f). At f=0, g'(0)=p-q>0. The function g(f) is concave and has its maximum at f*.
     The growth rate at f*/2 is not necessarily half of g(f*). In fact, the growth rate at f*/2 is more than half of g(f*) because g is concave and increasing at [0, f*]. 
     Specifically, the reduction in growth rate is less than half.

     Let's compute for p=0.55, f*=0.10.
     g(f) = p*ln(1+f) + q*ln(1-f)
     g(f*) = 0.55*ln(1.10) + 0.45*ln(0.90) = 0.55*0.095310 - 0.45*0.105361 ≈ 0.0524205 - 0.04741245 ≈ 0.005008
     Now at f*/2 = 0.05:
     g(0.05) = 0.55*ln(1.05) + 0.45*ln(0.95) ≈ 0.55*0.048790 + 0.45*(-0.051293) ≈ 0.0268345 - 0.02308185 ≈ 0.00375265
     Then g(f*) ≈ 0.005008 and g(0.05) ≈ 0.003753, so the ratio is about 0.003753/0.005008 ≈ 0.75, which is more than half.

     Therefore, the student's claim that the long-run growth rate is halved is incorrect.

