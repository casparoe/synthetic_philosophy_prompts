answer: |-
  Here's a turnkey workshop design focusing on **social identity and public exposure** in escalation of commitment, with mechanics tailored to your constraints:

  ---

  ### **"Project Titan" Escalation Simulation**  
  *Time:* 80 mins | *Participants:* 12 grad students  

  #### **Setup (10 mins)**  
  1. **Scenario Intro:**  
     - *"You’re the executive team of ‘NexGen Labs’. For 3 years, you’ve invested $50M in ‘Project Titan’ (a quantum cloud platform). Competitors just launched better/cheaper tech. Today, we decide: fund Phase 4 ($15M) or cancel."*  
     - Assign roles randomly: *CEO, CFO, 2 Investors, 4 Engineers, 3 Marketing, 2 Board Members*. Hand role cards with **secret motivations** (e.g., *Engineer:* "Your career depends on Titan"; *Investor:* "You need a win after recent losses").  

  2. **Rules:**  
     - Anyone can speak **for** funding ("commitment") or **against** ("exit").  
     - **Hidden Twist:** If you make **2+ consecutive defenses** and later exit, you **must give a 30-second public explanation** of your reversal. Exposure time doubles each round (30s → 60s → 120s).  

  ---

  ### **Activity Flow (45 mins)**  
  *(Facilitator drips bad news after each round)*  

  | **Round** | **Facilitator’s Prompt**                 | **Predictable Group Behavior**                     |  
  |-----------|------------------------------------------|--------------------------------------------------|  
  | 1 (5 mins)| *"Market share dropped 15%. Vote: Fund or Cancel?"* | Early defenders dominate (optimism bias). Few exits. |  
  | 2 (10 mins)| *"Beta users report critical security flaws."* | Defenders dig in: "We’re close to a fix!" **First exposure trap triggers** (2+ defenses). |  
  | 3 (15 mins)| *"Lead engineer quits. Costs balloon by 40%."* | Defenders use emotional appeals ("We owe it to the team!"). Exiters hesitate due to exposure threat. |  
  | 4 (15 mins)| *"Competitor acquires our supplier. Phase 4 now costs $25M."* | **Chaos:** Trapped defenders rationalize. Late exiters face 60s confession. Group pressure peaks. |  

  ---

  ### **Debrief (25 mins)**  
  *(Use a whiteboard mapping group’s actions to theory)*  

  1. **Feelings First (5 mins):**  
     - *"When did you feel trapped? Who felt social pressure vs. logical doubt?"*  

  2. **Map the Escalation (10 mins):**  
     | **Simulation Moment**          | **Real-World Parallel**                | **Concept**                     |  
     |-------------------------------|---------------------------------------|--------------------------------|  
     | "We can’t quit after $50M!"   | **Kodak doubling down on film**       | Sunk cost fallacy              |  
     | "I defended twice—I couldn’t back out" | **Boondoggle projects** (e.g., IBM’s Watson Health) | Identity/reputation lock-in |  
     | Silence from potential exiters | **Groupthink in failing mergers** (e.g., AOL-Time Warner) | Fear of exposure          |  

  3. **Key Contrast w/ Dollar Auction (5 mins):**  
     - *"The dollar auction makes losses financial and incremental. Here, the ‘cost’ was **sudden and social**—you didn’t know the exposure price until you were trapped. Real-world escalation often looks like this: public promises turning exit into humiliation."*  

  4. **Takeaways (5 mins):**  
     - *"Institutions don’t escalate because of money alone—they escalate because **identities become tied to the commitment**. The antidote? Normalize reversals early, separate decisions from decision-makers."*  

  ---

  ### **Predictable Problems & Fixes**  
  - **Problem:** Students treat it academically → **Solution:** Assign high-stakes roles ("CFO: You’ll be fired if Titan fails").  
  - **Problem:** No one defends initially → **Solution:** Plant a confederate to defend first (or prompt the "CEO").  
  - **Problem:** Early mass exit → **Inject drama:** *"Breaking news: Government offers a $10M grant if you commit today!"*  
  - **Problem:** Time overrun → **Enforce:** Hard stops after each round. Use a timer for confessions.  

  ### **What This CAN’T Replicate from Dollar Auctions**  
  - **Incremental financial loss:** Dollar auctions make costs visceral and quantifiable. Here, "losses" are abstract (social pain) until the confession moment.  
  - **Bidder rivalry:** Dollar auctions thrive on competitive instinct; this simulates institutional pressure, not individual rivalry.  

  ---

  ### **Why This Works**  
  - **Emotional hook:** The "public confession" mechanic forces visceral dread.  
  - **No prep needed:** Roles and rules are explained live.  
  - **Debrief bridges theory/practice:** Students *felt* the identity trap before analyzing it.  

  Let me know if you need role cards or slide visuals!
