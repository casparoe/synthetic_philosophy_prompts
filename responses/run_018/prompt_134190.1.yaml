  The user specifically wants to avoid the Hesperus-Phosphorus example and use a case like "Vulcan," where a name is introduced through a description that turns out false. That makes sense because it separates epistemic access from metaphysical rigidity better. Venus is too intertwined with identity statements, while Vulcan shows how a name can fail to refer despite being introduced descriptively.

  I need to design a step-by-step sequence. Start by reactivating Frege's distinction to set the foundation. Then introduce the problem of empty names with the Vulcan example. That creates tension: how can we explain cognitive significance without a referent? That's where primary intension comes in as a solution. 

  For misconceptions, students might think primary intension is just a mental image. I should intercept that when introducing it by emphasizing it's an objective epistemic condition. They might also confuse the two dimensions as temporal stages. Clarify that both operate simultaneously for counterfactual and epistemic evaluation.

  The check question at the end should test if they understand secondary intension remains rigid even if primary intension picks different entities. Something like: "If Vulcan had existed but was a black hole, what would 'Vulcan' refer to in counterfactual worlds?" Correct answer: nothing, because rigid designation locks onto actual reference.

  I should explicitly state what's beyond scope: centered worlds, formal quantification over scenarios, and diagonal propositions. Keep it conceptual. Use the Vulcan example throughout for consistency. Allocate time carefully—90 minutes is tight. 

  The user is clearly experienced; they know the pitfalls and want a clean pedagogical approach. They’re avoiding Venus for good reason, and Vulcan is perfect for showing how reference can fail. Their hidden need might be ensuring students don’t see 2D semantics as ad hoc, so the sequence must make necessity feel inevitable. I’ll build the arc so each step resolves the previous problem, culminating in primary intension as the missing piece.
answer: |-
  Here’s a structured 90-minute teaching arc designed to build two-dimensional semantics as an organic solution, using the **"Vulcan" case** (Le Verrier’s hypothetical planet) to avoid Hesperus/Phosphorus pitfalls. The sequence prioritizes conceptual intuition over formalism.

  ---

  ### **Teaching Arc: 90-Minute Session**
  **Core Example:** "Vulcan" (name introduced via description: *"the planet causing Mercury’s orbital perturbations"*; later, perturbations are explained by general relativity, and Vulcan doesn’t exist).

  ---

  #### **Phase 1: Reactivating Foundations (15 mins)**
  1. **Frege Recap (5 mins):**  
     - *Question:* "How did Frege explain the difference in cognitive significance between 'Hesperus is Hesperus' and 'Hesperus is Phosphorus'?"  
     - *Key takeaway:* Sense determines reference; difference in sense explains difference in belief.  
  2. **Rigidity Refresh (5 mins):**  
     - *Question:* "If 'Aristotle' rigidly designates the same person in all possible worlds, can we meaningfully say 'Aristotle might not have taught Alexander'?"  
     - *Emphasize:* Rigidity fixes reference to the *actual* referent across worlds.  
  3. **The Problem Setup (5 mins):**  
     - Introduce "Vulcan":  
       *"Scientists named 'Vulcan' the planet perturbing Mercury’s orbit. Later, Einstein showed no such planet exists. But before this discovery, astronomers believed 'Vulcan is a rocky planet' and 'Vulcan causes perturbations'. How do we analyze these beliefs using Frege or rigidity?"*  
     - *Tension:* Vulcan has **no reference**. Frege’s sense collapses (no referent to determine); rigidity seems inapplicable (no actual referent to "lock onto").

  ---

  #### **Phase 2: Introducing Primary Intension as the Solution (30 mins)**
  1. **Epistemic Access vs. Metaphysical Reference (10 mins):**  
     - *Contrast with Venus:*  
       - Venus case: Identity statement ("Hesperus = Phosphorus") blends epistemic and metaphysical issues.  
       - **Vulcan advantage:** Cleanly separates **epistemic access** (how we identify the object) from **metaphysical status** (it doesn’t exist).  
     - *Pivot:* "How *could* astronomers have been talking about something? What fixed their *intent* to refer?"  
  2. **Primary Intension: The "Epistemic" Dimension (15 mins):**  
     - Define: **Primary intension** = *What the term would pick out, given how it’s introduced, in a hypothetical scenario we take to be actual*.  
     - Apply to Vulcan:  
       - In scenarios compatible with 19th-century astronomy, "Vulcan" picks out *whatever uniquely causes Mercury’s perturbations* (even if, in reality, nothing does).  
       - *Crucial clarification:* This is **not a mental image**—it’s an objective condition for reference-fixing (*"satisfies description D in scenario S"*).  
     - *Intercept misconception:* "Primary intension isn’t a picture in your head—it’s the rule we use to *find* the referent in a world."  
  3. **Why This Feels Necessary (5 mins):**  
     - *Question:* "Without primary intension, how do we explain that 'Vulcan doesn’t exist' is informative, or that astronomers weren’t just babbling nonsense?"  
     - *Resolution:* Primary intension captures cognitive significance *even when reference fails*.

  ---

  #### **Phase 3: Secondary Intension & Rigidity (25 mins)**
  1. **From Epistemic to Metaphysical (10 mins):**  
     - *Pivot:* "But what if Vulcan *had* existed? What would 'Vulcan' refer to *in counterfactual worlds*?"  
     - Define: **Secondary intension** = *The referent in other worlds, given how reference is fixed in the actual world*.  
     - *Problem:* Vulcan doesn’t exist → secondary intension is empty.  
  2. **Rigidity Regained (10 mins):**  
     - *Hypothetical:* "Suppose Vulcan *actually* existed (a small rocky planet). Then:  
       - Secondary intension rigidly designates *that planet* across worlds.  
       - Even in worlds where a *gas giant* causes Mercury’s perturbations, 'Vulcan' still refers to the rocky planet."  
     - *Emphasize:* Rigidity is a property of **secondary intension** (metaphysical dimension).  
  3. **Intercept Temporal Misconception (5 mins):**  
     - *Misconception:* "Primary intension is what we believe *before* discovery; secondary is *after*."  
     - *Clarification:* "Both dimensions are timeless. Primary intension evaluates epistemic scenarios; secondary evaluates counterfactual worlds *given actual reference*."

  ---

  #### **Phase 4: Synthesis & Check Question (20 mins)**
  1. **Two Dimensions as Complementary (10 mins):**  
     - *Diagram:*  
       - **Primary (Epistemic)**: "Vulcan" = *the cause of perturbations* (in scenarios).  
       - **Secondary (Metaphysical)**: "Vulcan" = rigid designator of actual Vulcan (if it exists).  
     - *Why not ad hoc?* "Primary intension handles cognitive significance/emptiness; secondary handles rigidity/counterfactuals. Neither Frege nor rigidity alone can do both."  
  2. **Check Question (10 mins):**  
     - *Prompt:* **"Suppose Vulcan actually exists (a rocky planet). In a counterfactual world W where a black hole causes Mercury’s perturbations, does 'Vulcan' refer to the black hole in W? Why/why not?"**  
       - *Correct answer:* **No.** Secondary intension rigidly designates the actual rocky planet. Primary intension (satisfied by the black hole in W) is irrelevant for counterfactual reference.  
       - *Why it works:* Confirms they distinguish dimensions and grasp rigidity in secondary intension.

  ---

  ### **Explicitly Excluded Technical Apparatus**
  - **Omit:** Centered worlds, formal semantics of "scenarios" as primitive entities, diagonal propositions, matrix notation.  
  - **Reason:** Focus on conceptual roles of primary/secondary intensions. Say: *"We’re skipping formal machinery to concentrate on how the two dimensions solve philosophical problems."*

  ---

  ### **Why Vulcan > Hesperus**
  - **Hesperus/Phosphorus:** Blurs epistemology (learning an identity) with metaphysics (rigid designation).  
  - **Vulcan:** Isolates issues:  
    1. **Empty names** → Primary intension handles epistemic access *without reference*.  
    2. **Rigidity** → Secondary intension applies *only if reference is successful*.  
    3. **Discovery** → Shows how primary intension can be *defeated* without altering metaphysical rigidity (if referent exists).

  This arc positions primary intension as rescuing cognitive significance from reference failure, and secondary intension as preserving rigidity—making 2D semantics feel like a necessary tool, not a gratuitous complication.
