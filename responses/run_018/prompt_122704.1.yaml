prompt: |-
  I serve on the allocation committee of the Bracknell Trust, a small health-focused foundation that is spending down: our governing instrument requires the remaining capital to be committed within three grant cycles, after which the Trust closes. This cycle we have USD 4.6 million to place. Three proposals survived staff review, and we cannot fund all three at full scope, so the decision is real.

  Our standing method is a multiplicative importance / tractability / neglectedness score. In our scorecard, importance is burden per unit of problem (DALYs), tractability is the share of the problem averted per million dollars in that setting, and neglectedness is one over total annual philanthropic and bilateral spend in the cause, taken at whatever level of description staff happened to use in the proponent's write-up.

  Proposal A: school-based treatment for soil-transmitted helminths plus micronutrient supplementation in two districts of a low-income country. USD 1.9 million over three years. Evidence base is strong and the delivery platform is proven; cost per child treated is roughly a dollar. Two bilateral funders and one multilateral are active in the same districts, and staff estimate about three million dollars of room for more funding before the platform saturates. One of the bilaterals has announced it will exit the country within eighteen months, and the ministry has no budget line to absorb the shortfall; if it leaves, staff think remaining room for more funding roughly doubles.

  Proposal B: a pilot to remove lead from paint sold in a middle-income country's domestic market, paired with enforcement capacity. USD 2.2 million over three years. Burden is large, the causal chain from regulation to measured blood-lead reduction is long, and the evidence for enforcement actually biting is thin; there is political risk. No other funder is currently in lead work in that country. Separately, a large private foundation has publicly pledged to match new commitments in this area one-for-one, up to 1.5 million dollars in total, but only for commitments signed before a deadline five months from now, and nothing thereafter.

  Proposal C: surveillance, clinical guidance, and a small treatment stockpile for a poorly understood chronic kidney disease affecting young agricultural workers in one region. USD 1.4 million over three years. Almost nothing is spent on it globally, the aetiology is unsettled, and part of the grant is research that would change what later funders could do. Our own regional program officer has nine years of relationships with the regional health authority and two growers' associations; her secondment ends in fourteen months, and that relationship capital leaves with her.

  Two further complications. First, two committee members want the scorecard amended before we vote: one to replace neglectedness with a counterfactual-displacement measure (the share of resulting activity that would not have occurred but for us), and one to force every cause onto a fixed twelve-area taxonomy so that staff cannot sharpen a description until the denominator looks small — under that taxonomy, at least two of these proposals collapse into the same cause area. Second, our treasurer wants up to one million dollars held back unallocated, on the ground that a large funder is expected to open a co-funding window in about fourteen months.

  Please draft the decision memo I will circulate, addressed to the committee and no longer than about a thousand words. It should: open with a specific recommended allocation, including tranche structure or conditions and whether any reserve is justified; state what weight the ITN score should carry in the final decision and why; say whether we should adopt either amendment now or decide this case first and revise the framework afterward; and include a short section giving the strongest version of the case for the option you are not recommending, of the kind its advocate would recognize. The committee is split and sophisticated, so the reasoning has to be usable by people who disagree with the conclusion, not merely a restatement of the score.
reasoning: |-
  Okay, let me approach this Bracknell Trust allocation problem methodically. The user needs a decision memo that balances quantitative scoring with qualitative realities under time pressure. 

  First, I need to internalize the constraints: $4.6M to place, three proposals with trade-offs, and spend-down urgency. The ITN framework is their standard tool but committee members want amendments. The treasurer's reserve request adds another layer. 

  Looking at Proposal A: Strong evidence base and low cost per child, but funding saturation concerns are real. The bilateral exit creates both risk and opportunity - that timing element feels crucial. The match potential in B is tempting but the political risk gives pause. Proposal C's relationship capital expiration makes it time-sensitive in a different way. 

  The amendments debate is fascinating. Counterfactual displacement makes theoretical sense but operationalizing it seems messy mid-cycle. The taxonomy fix addresses gaming but might oversimplify - collapsing distinct problems feels dangerous. 

  For the reserve: holding back $1M seems excessive given their spend-down mandate, but some flexibility could be wise. Maybe $500K? 

  My recommendation will need to: 
  - Prioritize A (with tranches) and C due to urgency factors 
  - Partially fund B to capture match 
  - Reject taxonomy change now but pilot displacement metrics 
  - Limit reserve to 10% of pool 
  All while making each proposal's best case authentically. 

  The memo tone must respect committee sophistication - no oversimplifying trade-offs. I'll structure it: recommendation first, then scoring weight, framework changes, alternatives' merits, and tactical details. The "strongest case for alternatives" section is particularly important for legitimacy. 

  Hmm... the real challenge is making the ITN scores live beyond the spreadsheet - showing how tractability isn't just evidence quality but institutional readiness, how neglectedness interacts with expiring opportunities. That's where the memo adds value beyond the numbers.
answer: |-
  **To:** Bracknell Trust Allocation Committee  
  **From:** [Your Name], Committee Member  
  **Subject:** Funding Recommendation & Framework Clarification - Spring Cycle  
  **Date:** [Current Date]  
  **Total Allocation Available:** USD 4.6 Million  

  ---

  ### I. Recommended Allocation (Total Commitment: $4.55M)  

  1.  **Proposal A (Helminths/Micronutrients): $1,900,000**  
      *   **Structure:** Single tranche, full funding.  
      *   **Conditions:** None beyond standard reporting. Strong evidence and established platform justify immediate deployment.  

  2.  **Proposal B (Lead Paint): $1,100,000**  
      *   **Structure:** Tranche 1 ($1.1M) committed immediately, triggering the full $1.1M match ($2.2M total impact).  
      *   **Conditions:** Tranche 1 unlocks match. *No commitment to Tranche 2.* Requires quarterly risk assessment (political will, enforcement traction). Future tranche contingent on committee review at 18 months, informed by risk assessment and remaining trust capital.  

  3.  **Proposal C (Kidney Disease): $1,400,000**  
      *   **Structure:** Single tranche, full funding.  
      *   **Conditions:** Requires formal knowledge transfer plan for regional relationships within 6 months, codifying institutional (not just personal) access to health authority & growers' associations.  

  4.  **Reserve: $50,000**  
      *   **Justification:** A minimal reserve is retained for urgent administrative needs or minor opportunity costs related to the above conditions. The Treasurer's request for a $1M holdback is **rejected**. Given our 3-cycle spend-down mandate and the high opportunity cost of unplaced capital ($4.55M placed vs. $4.6M available), reserving significant funds for a speculative future window (14+ months out) violates our core mandate and discounts proven, immediate opportunities before us.  

  **Rationale Summary:** This maximizes near-term, high-certainty impact (A), captures a time-limited leverage opportunity while mitigating risk (B Tranche 1), secures critical relationship capital before it expires (C), and commits 99% of available funds in line with our spend-down imperative. The structure for B provides flexibility without pre-committing scarce remaining capital.  

  ---

  ### II. Role of ITN Scoring  

  The ITN score provides a crucial, standardized baseline for comparing disparate interventions. **It should carry significant, but not determinative, weight (approx. 60-70% of consideration).**  

  *   **Why Significant?** It forces rigor on core EA principles: scale (Importance), cost-effectiveness (Tractability), and value-add (Neglectedness). It mitigates bias and allows comparison across diverse health challenges.  
  *   **Why Not Determinative?** Raw ITN scores cannot capture:  
      *   **Time Sensitivity & Expiring Opportunities:** The 18-month bilateral exit (A), 14-month relationship loss (C), and 5-month matching deadline (B) are critical strategic factors outside the static score.  
      *   **Leverage & Catalytic Effects:** The 1:1 match (B) and potential to unlock future funding/research via foundational work (C) amplify impact beyond the direct spend.  
      *   **Implementation Risk & Context:** Political fragility (B) and platform saturation dynamics (A) affect real-world tractability beyond the modeled estimate.  
      *   **Institutional Capital:** The unique relationship asset in (C) is irreplaceable and not quantifiable in standard neglectedness.  

  ITN is the essential starting framework, but final allocation requires integrating these contextual, strategic, and temporal factors.  

  ---

  ### III. Framework Amendments: Recommendation  

  **Do not adopt either amendment for *this* cycle. Defer framework revision to a dedicated process post-this decision.**  

  1.  **Counterfactual-Displacement Measure:**  
      *   **Case For:** Addresses core concern about true additionality better than crude neglectedness.  
      *   **Case Against (for now):** Operationalizing reliable displacement estimates *mid-cycle* for these specific proposals is highly speculative and subjective. How to quantify displacement for A (complex donor landscape), B (novel intervention), or C (research component)? Rushing an untested metric risks greater arbitrariness. **Recommendation:** Task staff with developing a practical displacement methodology pilot for *next* cycle's proposals.  

  2.  **Fixed Taxonomy for Neglectedness Denominator:**  
      *   **Case For:** Prevents "cause-narrowing" to artificially inflate neglectedness scores, ensuring fairer comparison (e.g., A & C might both be "Tropical Diseases").  
      *   **Case Against (for now):** Imposing a rigid taxonomy *retroactively* on proposals developed under different assumptions is unfair and distorts intent. Collapsing distinct problems (e.g., well-understood STHs vs. novel nephropathy) sacrifices granularity vital for assessing tractability and context. **Recommendation:** Mandate use of a standardized, pre-defined taxonomy for *all future proposals* starting next cycle, ensuring consistent denominator definition prospectively.  

  **Why Decide This Case First?** The spend-down clock is ticking. Delaying this critical allocation to redesign the framework under time pressure invites error and contention. Apply the established (if imperfect) method consistently for this round, then refine thoughtfully.  

  ---

  ### IV. Strongest Case for the Leading Alternative (Full Funding for Proposal B)  

  The advocate for fully funding Proposal B ($2.2M triggering $2.2M match = $4.4M total) would compellingly argue:  

  1.  **Maximizing Leverage:** This is a unique, time-bound opportunity to *double* our impact immediately. The $1.5M match cap and 5-month deadline create an unprecedented multiplier effect. Failing to capture the full $1.5M match available ($1.5M from us + $1.5M match = $3M) is leaving transformative resources on the table. Partial funding ($1.1M) secures only $1.1M match, wasting $400K of potential matching capacity.  
  2.  **Seizing the Neglectedness Moment:** The absolute lack of current funders in this country (unlike A) signifies profound neglect *despite* a known large burden (lead). Our intervention is catalytic – success could establish a model for other MICs and attract further funding, breaking the neglect cycle. The matching pledge itself signals latent interest we can activate.  
  3.  **Addressing a Pervasive Threat:** Lead exposure causes irreversible cognitive damage, impacting children's life potential and national productivity. Unlike geographically limited interventions (A, C), effective regulation reshapes an entire national market, creating lasting systemic change that prevents harm indefinitely. The long causal chain is a reason to start *now*, not delay.  
  4.  **Risk is Manageable:** While political and implementation risks exist, the grant includes building enforcement capacity. The matching foundation's due diligence provides external validation. The risk of *not* acting on lead, given its proven devastating effects, far outweighs the project execution risk.  

  This case powerfully emphasizes seizing leverage, breaking systemic neglect, and the long-term population-wide benefits of preventing lead poisoning.  

  ---

  ### V. Conclusion & Recommended Vote  

  I recommend the committee approve the allocation of **$1.9M to Proposal A, $1.1M (Tranche 1) to Proposal B, and $1.4M to Proposal C**, with the specified conditions and a minimal $50K reserve. This balances high-certainty delivery (A), catalytic leverage under a risk-mitigated structure (B), and securing irreplaceable institutional capital (C), while committing overwhelmingly to our spend-down mandate.  

  The ITN score remains a vital input but must be augmented by strategic considerations of time sensitivity, leverage, and risk. Framework amendments, particularly the fixed taxonomy, show merit but require careful implementation prospectively; they should not delay this decision.  

  I move we vote on this allocation package at the next meeting. Supporting materials, including updated scorecards under the current methodology and risk assessments, will be circulated by staff 72 hours prior.  

  // End Memo //
