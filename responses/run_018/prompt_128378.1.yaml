prompt: |-
  hey, im putting together notes for a philosophy seminar on the wrong-kind-reasons problem and i realized i dont actually know what im demanding of a theory. can you lay out the full desiderata — the checklist an adequate account has to satisfy? cover the usual suspects: the cancer-cure/nobel-prize case, the demon threatening your family unless you want ice cream, and the bribery-for-belief-in-climate-change setup. then also tackle this weird injection: suppose an AI tutor gives you tiny neural rewards every time you form a belief that is true, but the reward mechanism is blind to evidence and content — does that create wrong-kind reasons for belief, and should the theory cover doxastic wrong reasons too? for each desideratum, say what case or principle motivates it, mark whether its nonnegotiable or just camp-specific, and flag any pair that looks jointly unsatisfiable (maybe something about allowing instrumental reasoning without letting in the demon?). also tell me which single requirement eliminates the most popular accounts. finally, briefly score the value-relation view and the incentive-dependence view against the list. please use american english, and feel free to be casual — a typo or two is totally ok.
reasoning: |-
  Okay, let me unpack this philosophy seminar prep request. The user is clearly diving deep into the wrong-kind-of-reasons (WKR) problem and needs a structured checklist of what makes a theory adequate. They've mentioned classic cases like the demon threat and bribery scenario, plus that intriguing AI neural reward twist – which suggests they're looking for cutting-edge applications beyond traditional examples.

  Hmm, the user seems to be at that frustrating stage where they've encountered multiple accounts but can't pinpoint why each falls short. Their phrasing "don't actually know what I'm demanding" reveals a need for conceptual clarity before evaluating theories. The casual tone ("typo or two is totally ok") hints they'd prefer conversational rigor over dry academic prose.

  Right, let's map the core challenge: WKR problems arise when we have reasons that seem relevant to an attitude (like believing or desiring) but for all the wrong justifications. The cancer/Nobel case tests desire theories – why wanting a cure feels different from wanting a Nobel. The demon scenario is the ultimate stress test: can a theory allow threats to motivate without corrupting the attitude's essence? And that bribery case... tricky because it mirrors real-world incentives while exposing belief's truth-connection.

  Whoa, that AI tutor example is genius. Rewarding true beliefs regardless of evidence? That forces us to ask: are reasons for belief only about truth-tracking, or can external rewards ever be "right-kind"? Most accounts implode here because they focus solely on desire-type attitudes.

  Noticing two landmines in the desiderata list: First, how to permit useful instrumental reasoning (like wanting dental pain to go to the dentist) without letting the demon hijack our attitudes. Second, the AI case might show that belief reasons have unique constraints compared to desire – maybe no "wrong-kind" reasons exist for belief at all? That'd be explosive if provable.

  For theory scoring... The value-relation view (reasons depend on attitude's core norm) stumbles hard on the demon case – it can't explain why we shouldn't comply. The incentive-dependence view (reasons need content-match) gets wrecked by the AI tutor: truth-rewards align with belief's norm yet feel manipulative. Neither handles the bribery case cleanly.

  Final thought: The user might secretly want ammunition to challenge mainstream views. That AI case alone could nuke half the literature. Should emphasize how it exposes a gap in even sophisticated accounts like constitutivism. Also flagging that "jointly unsatisfiable" tension – permitting instrumental reasons while blocking the demon – as the holy grail problem.
answer: |-
  Here's your WKR desiderata cheat sheet - the full checklist for grading theories, with the cases you mentioned plus that wild AI curveball. Let's break it down:

  **Core Desiderata (The Non-Negotiables):**
  1.  **Distinguish WKR from RKR in Desire (Motivated by: Cancer Cure/Nobel Prize Case)**
      *   **What:** Must explain why desiring a cure for cancer is RKR (right-kind reason), but desiring a Nobel Prize *solely* to get the cure is WKR. The object matters.
      *   **Non-Negotiable:** Yes. This *is* the core problem.
      *   **Camp Specific?** No, everyone needs to solve this.

  2.  **Block the Demon (Motivated by: Demon Threatening Family Unless You Want Ice Cream)**
      *   **What:** Must *not* count the demon's threat ("Want ice cream or I hurt your family!") as a *genuine* reason *to want ice cream itself*. It's clearly a reason to *bring about* the state of wanting ice cream, but not a reason *for* that desire.
      *   **Non-Negotiable:** Absolutely. Failing here means the account is toast.
      *   **Camp Specific?** No. Failing this is fatal.
      *   **Joint Unsatisfiability Flag:** 🔥🔥 This is the BIG tension with #4 (Instrumental Reasoning). How do you allow genuinely good instrumental reasons *without* letting the demon's threat sneak in as a "reason for desire"?

  3.  **Respect the "Guise of the Good" (or Relevant Norm) for Attitudes (Motivated by: General Principle)**
      *   **What:** Reasons for an attitude (desire, belief) must connect to the *point* or *constitutive standard* of that attitude. For desire, this is often "the good" (desiring things under the guise of their being good). For belief, it's truth.
      *   **Non-Negotiable:** Widely held, core to many views. Some "Humean" camps might downplay it, but even they need *some* story about attitude norms.
      *   **Camp Specific?** Mostly non-negotiable, but interpretations vary.

  4.  **Allow Legitimate Instrumental/Strategic Reasoning (Motivated by: Wanting Dental Pain to Motivate Going to the Dentist)**
      *   **What:** Must permit cases where it makes sense to cultivate a desire *as a means* to a further end (e.g., I might *want* to feel the dental pain slightly *because* it motivates me to go get it fixed, avoiding worse pain later). This *feels* like it could be RKR for the instrumental desire.
      *   **Non-Negotiable:** Yes. Real practical reasoning demands this.
      *   **Camp Specific?** No.
      *   **Joint Unsatisfiability Flag:** 🔥🔥 **This is THE crux.** How do you allow *this* kind of reason (which looks structurally like the Demon's threat - "desire X to avoid Y") without collapsing into allowing the Demon's threat? The difference seems crucial but is devilishly hard to capture formally.

  **Desiderata for Belief (Your Bribery & AI Cases):**
  5.  **Block Bribery for Belief (Motivated by: Bribery-for-Belief-in-Climate-Change)**
      *   **What:** Must *not* count the bribe ("I'll pay you $1M to believe in climate change") as a genuine reason *for the belief itself*. It's only a reason to *cause* yourself to hold that belief. Belief aims at truth; money doesn't make the proposition more likely true.
      *   **Non-Negotiable:** For accounts extending WKR to belief (doxastic reasons). Most agree belief has a strong truth norm.
      *   **Camp Specific?** Some might argue belief *can't* have WKR because reasons for belief *only* come from evidence (Evidentialism). But most WKR theories *try* to extend to belief and fail here if they're sloppy.

  6.  **Handle the AI Tutor / Neural Reward Case (Motivated by: Your Weird Injection!)**
      *   **What:** The AI rewards *true* beliefs, but *blindly* - the reward isn't based on evidence or content, just on the belief being correct. Does this create WKR *for belief*?
          *   **Argument for WKR:** The reward is an external incentive disconnected from the *truth-tracking process*. It gives you a reason to *form true beliefs*, but not necessarily a reason grounded in the *evidence for P* to believe *P*. It might incentivize lucky guesses or weird belief-forming methods unrelated to justification.
          *   **Argument for RKR (or Non-Reason):** The reward is tied *directly* to the *constitutive norm of belief* (truth). If the belief is true, you get rewarded. This *reinforces* the aim of belief. It might not be *evidential*, but it directly promotes true belief. Maybe it's just a funky *consequence* of true belief, not a "reason for belief" *per se*?
      *   **Desideratum:** An adequate account needs a *principled* way to say *why* this is/isn't WKR for belief. Does it corrupt the belief-forming process? Does it align *too* instrumentally with the norm? **Should the theory cover doxastic WKR?** Ideally, yes. A unified account for attitudes is desirable. This case uniquely pressures theories by combining truth-sensitivity with process-blindness.
      *   **Non-Negotiable?** Not universally agreed yet (it's novel!), but any serious WKR theory *should* be able to handle it cleanly. It exposes deep questions about the connection between reasons, norms, and processes.

  **The Killer Requirement & Popular Account Graveyard**
  *   **The Requirement That Eliminates the Most:** **#2 (Block the Demon)** combined with **#4 (Allow Instrumental Reasoning)**. This tension wrecks *many* early or simplistic accounts:
      *   **"Formal Objects" Views:** Often fail to distinguish the demon from legitimate instrumental cases.
      *   **Simple "Constitutive Aim" Views:** Struggle to explain *why* the demon's threat doesn't just become part of the "good" you're aiming at when desiring ice cream (to save your family).
      *   **Crude "State/Content" Distinctions:** Can miss the nuance in instrumental reasoning cases.

  **Quick Scorecard: Value-Relation vs. Incentive-Dependence**
  *(Oversimplified, but based on common interpretations)*

  *   **Value-Relation View (Reasons depend on the value of the object *as it relates to the attitude's norm*):**
      *   **#1 (Cancer/Nobel):** 👍 Usually handles well (Nobel's value instrumental, cancer cure's value final/good).
      *   **#2 (Demon):** 👎 **MAJOR WEAKNESS.** Why isn't *saving my family* the "good" I'm relating to when desiring ice cream? Often fails here.
      *   **#3 (Guise of Good):** 👍 Core strength.
      *   **#4 (Instrumental):** 🤔 Mixed. Can sometimes allow dentist case, but struggles to draw a *principled* line vs. demon.
      *   **#5 (Bribery):** 👍 Handles well (money ≠ truth).
      *   **#6 (AI Tutor):** 🤷‍♂️ Unclear. Is the reward part of the "value of the belief"? If truth is the value, maybe it *is* RKR? Or is the *process* key? Often ambiguous.

  *   **Incentive-Dependence View (Reasons are RKR only if they depend on features of the *attitude's content*, not just incentives to have it):**
      *   **#1 (Cancer/Nobel):** 👍 Handles well (cure's properties are reason, Nobel's properties ≠ reason for cure desire).
      *   **#2 (Demon):** 👍 **STRENGTH.** Demon's threat is about the *state* of desiring, not features of ice cream itself.
      *   **#3 (Guise of Good):** 🤔 Can be compatible, but not core.
      *   **#4 (Instrumental):** 👎 **MAJOR WEAKNESS.** Why *is* the avoidance of worse pain (a feature of the *consequences* of the desire, not ice cream itself) sometimes a RKR for the instrumental desire? Often struggles to allow these.
      *   **#5 (Bribery):** 👍 Handles well (bribe targets state, not content).
      *   **#6 (AI Tutor):** 👎 **STRUGGLES.** The reward depends *indirectly* on the content (it has to be *true*) but the *reason it gives you* seems to target the *state* of having true beliefs, not the specific proposition's evidence. Likely calls it WKR, which feels *plausible but controversial*.

  **TL;DR:** Your checklist needs to handle the core desire cases (Cancer/Nobel, Demon, Instrumental Tension!), extend plausibly to belief (Bribery), and grapple with the AI Tutor's truth-reward blindspot. Blocking the Demon *while* allowing good instrumental reasoning is the minefield that sinks many theories. The Value-Relation view often drowns in the Demon case; the Incentive-Dependence view often chokes on legitimate Instrumental cases. Good luck with the seminar!
