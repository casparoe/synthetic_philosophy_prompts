answer: |-
  ### Analyzing Pluto's Reclassification through Frege's Puzzle  
  **Frege's Framework Applied:**  
  Frege's puzzle distinguishes between **reference** (Bedeutung; the object itself) and **sense** (Sinn; the mode of presentation). While "Pluto is Pluto" is cognitively trivial (same sense → same reference), the statement "Pluto is a dwarf planet" was informative because it involved a shift in *sense*, not reference.  

  1. **Referent Stability & Cognitive Shock:**  
     - **Referent:** 'Pluto' consistently denotes the same celestial body (Kuiper Belt Object 134340). Its material properties (size, orbit, composition) did not change in 2006.  
     - **Cognitive Shock Source:** The shock arose from a **redefinition of the sense of 'planet'**. Pre-2006, 'planet' had an observational sense (large, round, solar-orbiting body). Post-2006, the IAU imposed a dynamical sense: a body that "clears its orbital neighborhood." Pluto satisfied the first sense but not the second.  

  2. **'Planet' as Natural Kind vs. Institutional Kind:**  
     | **Interpretation**       | **Natural-Kind Term** (Putative Essence)                     | **Institutional Kind** (IAU Convention)                     |  
     |--------------------------|-------------------------------------------------------------|-------------------------------------------------------------|  
     | **Frege's Prediction**   | Identity fails if "dwarf planet ≠ planet" reflects discovered essence divergence. Public resistance could be epistemically legitimate. | Identity is conventional: "dwarf planet" is just a sub-category defined by IAU rules. Resistance reflects attachment to outdated conventions. |  
     | **Informativeness**      | "Pluto is a dwarf planet" informs of a *discovered fact* about Pluto's nature. | "Pluto is a dwarf planet" informs of a *decision* to reclassify under new rules. |  
     | **Legitimacy of Resistance** | Defensible if public believed "planet" had an essentialist meaning (e.g., hydrostatic equilibrium). | Resistance is nostalgic; no epistemic grounding since the category is stipulative. |  

  ---

  ### **Conclusion: What Pluto Reveals about Frege's Puzzle**  
  The Pluto episode **confirms Frege's core insight** that cognitive value tracks sense divergence, but also **exposes a unique feature of institutional kinds**:  
  - **Confirmation of Frege:** Cognitive shock emerged purely from a shift in the *sense* of 'planet,' not reference. The informativeness of "Pluto is a dwarf planet" derived from associating the same referent (Pluto) with a new sense (dynamical non-dominance).  
  - **Institutional vs. Natural Kinds:**  
    - For *natural kinds*, sense is tied to empirical properties. A statement like "Water is H₂O" is informative because it updates sense based on discovered essence.  
    - For *institutional kinds*, sense is tied to conventions. "Pluto is a dwarf planet" is informative because it reflects a *stipulative redefinition* by an authority (IAU). Public resistance highlights how conventional senses embed cultural/emotional associations beyond Frege's astronomical examples.  
  - **Epistemic Profile:** While both kinds follow Frege’s principle that sense determines cognitive value, institutional reclassifications provoke "referential dissonance" – the *feeling* that reference changed due to abrupt sense-shift, even when it did not. This underscores that senses are not just descriptive but socially embedded.  

  **Final Assessment:** Pluto’s case affirms that Frege's puzzle applies universally, but institutional categories reveal that senses can be *voluntarily reconstituted*, making identity statements politically charged rather than purely empirical. The public’s attachment was not to Pluto’s reference but to the *cultural sense* of "planet" as a symbolic category – a dimension beyond Frege’s original astronomical context.
