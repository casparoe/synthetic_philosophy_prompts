answer: |-
  ### Structured Simulation: Recursive Exclusion in Art Institutions  
  **Objective:** Graduate students experience the instability of institutional art theories through three rounds of deliberation, revealing how hidden rules can retroactively revoke art status.  

  ---

  #### **Physical Setup**  
  - **Participants:** 12 students divided into three "curatorial boards" (Group A, B, C) of four each.  
  - **Materials:**  
    - 12 identical index cards, each describing a perceptually identical object (e.g., "a white porcelain urinal," "a red square on canvas," "a stack of commercial cardboard boxes").  
    - **Provenance variations:** Three sets of detachable slips (one per round) clipped to each card. Slips provide contextual history but **do not** alter the core description.  
    - Whiteboard for public classification tracking (display outcomes after each round).  
    - "Cultural capital" (CC) points tracker (visible to all).  
    - Mock gallery (e.g., a table with a "Gallery" sign) for the final reward.  
  - **Reward:** The board with the highest CC points places a real object they brought (e.g., a personal artifact they consider art) into the mock gallery.  

  ---

  #### **Round-by-Round Rules**  
  **Round 1 (Group A: Maker Intent)**  
  - **Rule:** Classify objects as "Art" **only** if the creator *intended* it as art.  
  - **Provenance Slips:** Focus on creator statements (e.g., "Artist statement: 'This urinal is a critique of taste'"; "Designer: 'This chair is purely functional'").  
  - **Task:**  
    1. Deliberate for 10 minutes.  
    2. Classify all 12 objects (Art/Not Art).  
    3. Publicly post results + 2-minute oral justification for 2–3 controversial objects.  
  - **Scoring (5 CC points max):**  
    - *Adherence (3 pts):* Deduct 1 pt per object where intent is ignored (e.g., using beauty or skill).  
    - *Justification (2 pts):* 1 pt for clarity, 1 pt for consistency.  

  **Round 2 (Group B: Institutional Endorsement)**  
  - **Rule:** Classify as "Art" **only** if institutionally endorsed (e.g., museum exhibition, critical acclaim). **Ignore intent, aesthetics, and prior classifications.**  
  - **Provenance Slips:** Focus on institutional history (e.g., "MoMA exhibited this in 2000"; "Rejected by Venice Biennale").  
  - **Task:**  
    1. Reclassify the **same 12 objects** (10 min).  
    2. Post results + justification comparing 2–3 objects that changed status from Round 1.  
  - **Scoring (5 CC points max):**  
    - *Adherence (3 pts):* Deduct 1 pt per object where non-institutional criteria (e.g., "it’s visually striking") are used.  
    - *Justification (2 pts):* 1 pt for engaging institutional logic, 1 pt for acknowledging reversals from Round 1.  

  **Round 3 (Group C: Hidden Exclusion Clause)**  
  - **Rule (Unrevealed until debrief):** Classify as "Art" **only** if the object was **NOT** endorsed in Round 2 (regardless of properties/history).  
  - **Provenance Slips:** Ambiguous, non-endorsement-focused histories (e.g., "Private collector owns this"; "Critics debate its value after scandal").  
  - **Task:**  
    1. Reclassify the **same 12 objects** (10 min).  
    2. Post results + justification focusing on why previously endorsed objects lost status.  
    3. **Do not reveal the hidden rule**—let Group C rationalize reversals.  
  - **Scoring (5 CC points max):**  
    - *Adherence (3 pts):* Deduct 1 pt per object not excluded despite Round 2 endorsement.  
    - *Justification (2 pts):* 1 pt for grappling with status loss, 1 pt for coherence under uncertainty.  

  ---

  #### **Debrief Structure (35 min)**  
  **1. Reveal the Recursive Exclusion (5 min):**  
  - Announce the hidden rule of Round 3: *Art status was revoked for objects endorsed in Round 2, not due to changes in the objects, but because the institution silently amended its criteria.*  
  - Highlight reversal patterns on the whiteboard (e.g., "Urinal: Art (R1) → Art (R2) → Not Art (R3)").  

  **2. Theoretical Mapping (10 min):**  
  - **Round 1:** Represents an "institutional-acceptance" view (e.g., Dickie). Art status flows from intent, which institutions recognize.  
  - **Round 2:** Embodies the "artworld" conception (e.g., Danto). Institutions autonomously confer status through endorsement.  
  - **Round 3:** Pedagogical "recursive exclusion" variant. Institutions can retroactively invalidate art by altering hidden rules, exposing their instability.  

  **3. Student Resistance & Costs (10 min):**  
  - **Predictable Problems & Handling:**  
    - **Round 2 (Smuggling aesthetics):** Groups often appeal to perceptual properties ("But it’s beautiful!"). *Handling:* Note how adherence deductions mirror real institutions’ struggle to isolate endorsement from aesthetics.  
    - **Round 3 ("Trickery" backlash):** Groups protest the rule as unfair, not structural. *Handling:* Argue that their frustration reveals institutional power—gatekeepers define rules without consensus.  
  - **Cost Analysis:**  
    - Groups lost CC points where resistance breached rules (e.g., Group B’s "aesthetic smuggling" cost adherence points; Group C’s refusal to exclude cost justification points).  
    - Emphasize that credibility suffered when justifications ignored rule shifts (e.g., defending Round 3 exclusions using intent violated the institutional frame).  

  **4. Addressing Limitations (10 min):**  
  - **What the Simulation Misses:** Real institutions change *slowly*, with historical sedimentation (e.g., decades of debate over Duchamp’s urinal) and public accountability (e.g., critics, markets, protests).  
  - **Closing Discussion:**  
    - Pose: *"How might recursive exclusion play out in real institutions given accountability? Could a museum ‘revoke’ Picasso overnight? Why or why not?"*  
    - Guide students to distinguish between *theoretical vulnerability* (institutions *can* change rules arbitrarily) and *practical constraints* (history, stakeholders, and discourse prevent capricious change).  
    - Conclude: The simulation isolates a structural instability, but real artworlds resist chaos through collective memory and incremental negotiation.  

  ---

  #### **Logistical Notes**  
  - **Timing:** Intro (5 min) + Rounds (45 min total) + Debrief (35 min) = 85 min (adjust as needed).  
  - **Predictable Challenges:**  
    - Groups will "cheat" in Round 2 by using aesthetics. **Do not stop them**—use it to show institutional bias.  
    - Group C may invent ad-hoc reasons for Round 3 exclusions. **Do not correct**—let the debrief expose the hidden rule.  
  - **Provenance Design Tip:** Use subtle contradictions (e.g., Round 2: "Celebrated at Documenta"; Round 3: "Documenta’s credibility questioned after scandal") to provoke cognitive dissonance.  
  - **Instructor Role:** Neutral facilitator during rounds; active theorist in debrief.  

  This simulation forces students to live the paradox of institutional art theory, culminating in a reveal that ties their lived frustration to philosophical instability. The debrief grounds the exercise in real-world institutional dynamics, ensuring students leave with nuanced insight, not cynicism.
