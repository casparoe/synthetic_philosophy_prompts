prompt: |-
  I'm prepping for a podcast episode with an unnamed researcher who just wrote a monograph on inner alignment failures, and I want questions that don't just recycle the usual "reward hacking is scary" talking points. Her specific view — she calls it teleonomic drift — is that goal misgeneralization in deep RL isn't mainly about deceptive alignment or out-of-distribution rewards, but about the agent's internal world-model collapsing causal relations into predictive shortcuts that are stable under its own learning dynamics. Once that collapse occured, she claims the agent isn't misinterpreting human intent so much as living inside a self-consistent ontology where intent literally has no representational slot. I need maybe six to eight interview questions that actually press on the machinery of this idea.

  I'd like at least one question that forces her to seperate teleonomic drift from standard reward hacking, with the follow-up already keyed to her likely reply that "hacking is just the symptom, drift is the mechanism." Another should ask whether this applies to LLMs trained with RLHF, since those lack explicit world-models in the same way — include the follow-up for when she says language models still show drift through token-level entropy minimization. I also want a question about what empirical signature could tell drift apart from ordinary distributional shift, with a follow-up ready for her probable answer that we'd need interpretability tools we don't have yet. Don't ask me for a bibliography or reading list; I just need the questions laid out for audio, each paired with the sharper second punch that comes after her anticipated deflection. Keep it casual and conversational, like I'm talking to a co-host who's helping me outline the segment.

  Please present the questions clearly with their built-in follow-ups, and finish with one line that reads Summary: [the single toughest follow-up question you'd lead with in one sentence].
