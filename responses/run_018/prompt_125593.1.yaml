answer: |-
  Here's a logic-first taxonomy tree focusing on resolving epistemic conflicts between perception, testimony, and inference. Questions are framed neutrally, and leaves identify the corresponding philosophical positions. **Bold terms** appear only at endpoints for identification.

  ---

  ### Taxonomy of Truth-Pluralism: Resolving Conflicts Between Perception, Testimony & Inference

  1.  **When two authoritative sources conflict (e.g., perception vs. scripture, inference vs. testimony), does this *necessarily* mean one source must be completely false?**
      *   **Yes → Go to 2**
      *   **No → Go to 3**

  2.  **Is there exactly one authoritative source that *always* overrides others in conflict?**
      *   **Yes → Hardline Absolutism (Ekāntavāda Foil):** One source (e.g., scripture *or* perception *or* inference) possesses absolute, unconditional truth; others are subordinate or potentially false.
      *   **No → Go to 4**

  3.  **Can the conflicting statements *both* be true simultaneously, even partially?**
      *   **Yes → Go to 5**
      *   **No → Go to 6**

  4.  **Does the resolution depend solely on the specific *content* or *context* of the claims, without a fixed hierarchy?**
      *   **Yes → Moderate Pluralist:** Conflicts are resolved contextually; one source may be right *in this specific case*, but no single source has universal priority. Truth is unitary per context.
      *   **No → Go to 7** (Logically open: A view prioritizing different sources rigidly based on domain (e.g., testimony for morals, perception for physics) exists but is rare/unexplored in classical contexts; often unstable).

  5.  **Does this "partial truth" framework apply to *all possible domains* of inquiry (e.g., physical reality, morality, metaphysics, mathematics)?**
      *   **Yes → Go to 8**
      *   **No → Go to 9**

  6.  **Is the conflict resolvable only by declaring *both* statements false or meaningless?**
      *   **Yes → Framework Collapse:** The very possibility of authoritative knowledge is undermined by unresolvable conflict. (Logically open but generally unattractive/unstable; avoids skepticism only with great difficulty).
      *   **No → Return to 1/Explore other trees** (Logically open: E.g., conflicts *always* indicate misinterpretation, not falsity. Common assumption but not a distinct pluralist resolution).

  7.  **Must a single, overarching truth framework *always* reconcile the conflict by showing how both perspectives are conditionally valid?**
      *   **Yes → Standard Jain Anekāntavāda (Saptabhaṅgī):** Every claim is conditionally true (*syād*). Conflicting statements reflect partial perspectives (*nayas*); truth is inherently complex and multi-faceted, requiring nuanced, seven-fold predication (*saptabhaṅgī*).
      *   **No → Return to 4/Explore other trees** (Logically open: E.g., conflicting truths coexist without needing a single reconciling framework - radical perspectivism. Unattractive due to potential incoherence).

  8.  **Does this include truths about one's *own immediate subjective experience* (e.g., "I am in pain")?**
      *   **Yes → Radical Contextualism:** *All* claims, including first-person phenomenological reports, are only true relative to specific perspectives, contexts, or descriptions. No incorrigible foundations.
      *   **No → Standard Jain Anekāntavāda (Saptabhaṅgī):** (See 7 above). (Note: Jainism exempts pure self-awareness (*sva-samvedana*) from *syādvāda*; phenomenological reports *about objects* are contextual).

  9.  **Are there *any* domains exempt from partial truth due to their inherent nature (e.g., logic, fundamental moral principles, abstract mathematics)?**
      *   **Yes → Moderate Pluralist:** Partial truth (*anekānta*) applies only to contingent, empirical claims about the complex world. Foundational principles (logic, core ethics like *ahiṃsā*) or formal systems (math) are absolute (*ekānta*) *within their valid domain*.
      *   **No → Standard Jain Anekāntavāda (Saptabhaṅgī):** (See 7 above). (Note: Applying *saptabhaṅgī* rigorously to math/logic/core axioms like *ahiṃsā* is generally avoided; considered incoherent for formal systems/pragmatically dangerous for ethics).

  ---

  **Key to Leaves:**
  *   **Hardline Absolutism (Ekāntavāda Foil):** Prioritizes one source absolutely (e.g., scriptural literalists, radical empiricists).
  *   **Moderate Pluralist:** Applies partial truth only to empirical/complex realities; exempts logic/core ethics/math.
  *   **Standard Jain Anekāntavāda (Saptabhaṅgī):** Systematically applies conditional truth (*syādvāda*) using seven modes to all complex realities, exempting pure self-awareness & sometimes formal/core principles *in practice*.
  *   **Radical Contextualism:** Extends partial/conditional truth to *all* claims, including subjective experience.
  *   **Framework Collapse:** Conflict leads to global skepticism or incoherence.

  **Unoccupied Logical Space Flags:**
  *   **Rigid Domain Hierarchy (Branch 4):** Logically open but unexplored/unstable; prioritizes sources rigidly by topic.
  *   **Universal Saptabhaṅgī (Branch 9):** Applying full 7 modes to math/core logic/ahiṃsā - avoided as **incoherent** (undermines itself) or **dangerous/unattractive** (for ethics).
  *   **Conflict = Always Misinterpretation (Branch 6):** Logically open, common assumption, but not a pluralist *resolution*.
  *   **Unreconciled Perspectivism (Branch 7):** Conflicting truths coexist without framework - **unattractive** due to incoherence risk.
