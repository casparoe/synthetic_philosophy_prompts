answer: |-
  Below is a taxonomy/decision tree for navigating positions on truth and authority conflicts in Jain *anekāntavāda* and its alternatives. Designed as a diagnostic tool, it uses concrete, jargon-free questions about how to resolve conflicts between perception, scripture, and inference. The tree sorts users into four primary positions (standard Jain *saptabhaṅgī*, hardline *ekāntavāda*, moderate pluralism, radical contextualism) and flags unexplored/incoherent combinations. All questions are binary (yes/no) and require no prior knowledge of Jain terminology.  

  ### **Decision Tree: Resolving Conflicts in Authoritative Sources**  
  **(Start at Q1)**  

  1. **When two authoritative sources (e.g., perception vs. scripture) conflict, must one be *entirely* true and the other *entirely* false?**  
     - **Yes** → Proceed to Q2.  
     - **No** → Proceed to Q3.  

  2. **Is the "one true source" always the same (e.g., scripture trumps perception in all cases)?**  
     - **Yes** → **Leaf: Hardline ekāntavāda**.  
       > *Position:* One source (e.g., scripture) is absolutely authoritative; others are invalid in conflict.  
     - **No** → **Leaf: Hardline ekāntavāda (contextual variant)**.  
       > *Position:* One source is absolutely true *in a given conflict*, but which source wins depends on the domain (e.g., inference for physics, scripture for ethics).  

  3. **Can both conflicting claims be "true" simultaneously without conditions?**  
     - **Yes** → **Note: Dialetheism (incoherent gap)**.  
       > Logically open but not held; simultaneous absolute truth in conflict violates non-contradiction.  
     - **No** → Proceed to Q4.  

  4. **Can both claims be "true" if we specify different conditions (e.g., "true in context X," "false in context Y")?**  
     - **No** → **Note: Skeptical collapse (unexplored gap)**.  
       > Logically open but not held; rejecting all resolutions makes epistemology unstable.  
     - **Yes** → Proceed to Q5.  

  5. **Should this conditional approach apply to empirical claims (e.g., "The apple is red" vs. "The apple is green")?**  
     - **No** → **Note: Empirical absolutism (incoherent gap)**.  
       > Logically open but not held; sensory conflicts inherently demand conditional resolution.  
     - **Yes** → Proceed to Q6.  

  6. **Should this conditional approach apply to moral truths (e.g., "Non-violence is absolute" vs. "Self-defense is justified")?**  
     - **No** → **Leaf: Moderate pluralism**.  
       > *Position:* Many-sided truth only applies to empirical claims; moral truths (e.g., *ahiṃsā*) are absolute.  
     - **Yes** → Proceed to Q7.  

  7. **Should this conditional approach apply to mathematical/logical truths (e.g., "2+2=4" vs. "2+2=5")?**  
     - **Yes** → **Note: Mathematical relativism (incoherent gap)**.  
       > Logically open but not held; math/logic relies on non-negotiable absolutes.  
     - **No** → Proceed to Q8.  

  8. **Should this conditional approach apply to first-person reports (e.g., "I am in pain" vs. "You are not in pain")?**  
     - **No** → **Leaf: Standard Jain syādvāda (saptabhaṅgī)**.  
       > *Position:* Many-sided truth covers empirical, moral, and metaphysical claims, but subjective experience has privileged access.  
     - **Yes** → **Leaf: Radical contextualism**.  
       > *Position:* All claims—including subjective experience—are context-dependent; no perspective is immune.  

  ---

  ### **Summary of Leaves (Output Positions)**  
  - **Hardline ekāntavāda**: Conflicts demand a single absolute winner (one source is unconditionally true).  
  - **Moderate pluralism**: Many-sided truth for empirical conflicts only; moral truths are absolute.  
  - **Standard Jain syādvāda (saptabhaṅgī)**: All objective claims (empirical, moral, metaphysical) are conditionally true; subjective experience is mostly exempt.  
  - **Radical contextualism**: *All* claims—including subjective experience—are conditionally true.  

  ### **Gaps Flagged in the Tree**  
  - **Dialetheism (Q3)**: Incoherent (simultaneous absolute truth violates rationality).  
  - **Skeptical collapse (Q4)**: Unexplored (no stable epistemology if all resolutions fail).  
  - **Empirical absolutism (Q5)**: Incoherent (sensory conflicts require conditional solutions).  
  - **Mathematical relativism (Q7)**: Incoherent (math/logic requires absolutes).  

  ### **How to Use This Tree**  
  - **Purpose**: Diagnostic for seminar discussions. Students answer questions based on their intuitions about truth conflicts, leading to a position that mirrors classical or modern viewpoints.  
  - **Key Design**: Branches force choices about *scope* (which domains allow conditional truth) and *resolution* (whether conflicts imply partial truth, absolutes, or collapse).  
  - **Avoids Jargon**: "Scripture" = *āgama*, "perception" = *pratyakṣa*, "inference" = *anumāna*; no Sanskrit terms in questions.  
  - **Audience**: Grad students familiar with authority conflicts but not Jain specifics. Tree reveals *anekāntavāda*'s uniqueness via scope (Q6–Q8) rather than doctrine.  

  This isolates core philosophical commitments (e.g., radical contextualism extends further than standard Jainism) while highlighting why gaps like mathematical relativism remain unexplored.
