  ### **Elective Affinity Simulation: Weber's Protestant Ethic Thesis**

  **Objective**: Simulate Weber's "elective affinity" (Wahlverwandtschaft) to show how values interact with structures to produce outcomes, highlighting why this is harder to defend than direct causation or structural determinism.

  ---

  #### **Materials Needed**
  - Four **value script cards** (hidden, one per group):  
    1. **Calvinist-worldly-ascetic**: *Reinvest ≥50% of profits. Max 10% on non-essentials. Penalty: Lose 1 labor unit if rules broken.*  
    2. **Catholic-communal-redistributive**: *Spend 30% on community aid. Gain +0.2 labor efficiency if done.*  
    3. **Secular-rational-maximizing**: *Maximize short-term gains. Bonus: +10% profit if no protection spending.*  
    4. **Status-display**: *Spend 40% on luxury. Penalty: Lose 20% CP if not done.*  
  - **Structural endowment cards** (visible):  
    - **Full**: Market access=High, Property security=High, Credit=High.  
    - **Collapsed**: Market access=High, Property security=Low, Credit=Low.  
  - **Labor tokens**: 10 per group/round (e.g., colored chips).  
  - **Capital points (CP) tracker**: Whiteboard or poster.  
  - **Voting slips** for preservation vote.  
  - Timer.  

  ---

  #### **Rules & Payoff Scheme**
  - **Capital Points (CP)**: Groups start with **100 CP** in Round One.  
  - **Labor allocation**: 10 labor units per round to:  
    - **Production**: Generates CP (base: 10 CP/unit).  
    - **Investment**: Boosts future production (1 unit = +0.1 multiplier next round).  
    - **Protection**: Mandatory if property security=Low (2 units to avoid 30% CP loss).  
  - **Endowment effects**:  
    - Low credit: No borrowing allowed.  
    - High credit: Borrow up to 50 CP at 10% interest (repaid end-round).  
  - **Value script rules**: Enforced strictly (e.g., Calvinists must reinvest; Status-display must spend on luxury).  
  - **Winning**: Group with **highest CP after Round Two** wins a "Reputation Marker" (token). No monetary stakes.  

  ---

  #### **Timeline (80 Minutes Total)**
  1. **Introduction (5 mins)**:  
     - Explain goals: Accumulate CP via labor choices under script/endowment constraints.  
     - Assign groups (4 groups of 4), distribute hidden scripts and visible endowments (all start "Full").  

  2. **Round One (25 mins)**:  
     - **Conditions**: All groups have identical **Full endowment**.  
     - **Task**: Allocate labor, track CP. *Example choices:*  
       - Calvinists: Invest heavily (script requires reinvestment).  
       - Status-display: Spend CP on luxury (script requires 40% spending).  
     - **Outcome**: Calculate CP, post public one-sentence explanation (e.g., "Our values drove high reinvestment and growth").  

  3. **Round Two (20 mins)**:  
     - **Conditions**: Randomly assign two groups **Collapsed endowment** (Low property security/Low credit); others keep Full.  
     - **Task**: Reallocate labor under new constraints. *Key dynamic:*  
       - Collapsed groups face protection costs and no credit.  
       - Calvinists (script-driven) reinvest despite collapse; others cut investment.  
     - **Outcome**: Calculate CP, post explanations (e.g., "Structural collapse caused our losses").  

  4. **Preservation Vote (5 mins)**:  
     - Secret vote: *If one factor collapses in Round Three, would you preserve your value script or structural endowment?*  
     - **Reveal**: Facilitator announces all groups except Calvinists voted to preserve *endowment*.  

  5. **Debrief (15 mins)**:  
     - Map rounds to Weber:  
       - **Round One**: Groups over-attribute success to *values* (direct causation), ignoring identical structures.  
       - **Round Two**: Collapsed groups blame *structures*, missing how only Calvinist values enabled adaptation (elective affinity).  
     - Highlight **counterfactual asymmetry**:  
       - Values "explain" success only when structures are favorable (Round One), but collapse obscures their role (Round Two).  
       - Calvinists’ reinvestment under collapse shows affinity, yet they still suffer (proving no pure cultural causation).  
     - **Facilitator prompts**:  
       - *"Why did identical structures yield different Round One outcomes?"* → Surface over-attribution to values.  
       - *"Why did Calvinists lose fewer CP under collapse than others with the same structures?"* → Reveal elective affinity.  
     - **Limitations**: Acknowledge the simulation cannot model long-term *feedback loops* (e.g., values reshaping structures).  

  ---

  #### **Predicted Problems & Solutions**
  - **Problem 1**: Groups over-attribute Round One CP differences to scripts despite identical endowments.  
    - **Solution**: Ask groups to compare endowments publicly, highlighting structural parity.  
  - **Problem 2**: Collapsed groups blame structures without noticing Calvinists’ adaptive reinvestment.  
    - **Solution**: Contrast Calvinists’ reinvestment (e.g., "Why did Group A invest more under collapse?") to surface values.  
  - **Problem 3**: Status-display/Catholic groups may resist script rules (e.g., luxury/redistribution spending).  
    - **Solution**: Enforce penalties strictly (e.g., CP loss) to simulate cultural constraints.  

  ---

  #### **Debrief Key Points**
  - **Elective affinity ≠ causation**: Values resonate with structures but aren’t independently sufficient.  
  - **Counterfactual asymmetry**: Values "work" only alongside structures, yet structures dominate explanations in crisis.  
  - **Weber’s insight**: Material factors (collapse) are visible; cultural logics (reinvestment) are hidden but essential.  

  **Outcome**: Participants experience why elective affinity is a fragile, historically contingent explanation—unlike straightforward structural or cultural models.
