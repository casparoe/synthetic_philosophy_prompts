  We are designing a simulation for an 80-minute session with 16 students in four groups of four.
   The simulation has two rounds and a debrief. The goal is to illustrate Weber's concept of elective affinity and the counterfactual asymmetry problem.

   Groups: Each group gets a hidden "value script" (one of four) and an explicit "structural endowment".
   Value scripts:
     1. Calvinist-worldly-ascetic (CWA): Emphasizes hard work, reinvestment, frugality. Rewards accumulation for its own sake and views wealth as a sign of divine favor but without ostentation.
     2. Catholic-communal-redistributive (CCR): Emphasizes community support, charity, and sharing. Rewards redistribution and collective well-being over individual accumulation.
     3. Secular-rational-maximizing (SRM): Focuses on rational self-interest and profit maximization. Rewards strategic investment and growth.
     4. Status-display (SD): Focuses on conspicuous consumption and social status. Rewards spending on visible luxury and social standing.

   Structural endowment (for Round One, all groups have the same; Round Two, two groups keep it, two lose some parts):
     - Market access: High (can sell goods easily) or Low (limited buyers)
     - Property security: High (no risk of theft/confiscation) or Low (risk of loss)
     - Credit availability: High (can borrow at low interest) or Low (no credit or very high interest)

   In Round One (25 min): All groups have the same endowment: High market access, High property security, High credit availability.

   In Round Two (20 min): Two groups (randomly chosen) retain the full endowment (High, High, High). The other two suffer a collapse: Low property security and Low credit availability (but market access remains High).

   Each round, groups make labor-allocation and investment choices. They accumulate "capital points" (CP) based on their choices, which are constrained by:
     - Their value script (which dictates how they must spend, save, reinvest, etc.)
     - The structural endowment (which affects the outcomes of their actions)

   After each round, each group writes a one-sentence explanation of their outcome and posts it.

   Then, after Round Two, a hidden "preservation vote": Each group chooses, if forced to lose one factor in a hypothetical Round Three, whether they would preserve their value script or their structural endowment. The facilitator then reveals that every group except the ascetic one (CWA) votes to preserve the endowment.

   The debrief will focus on:
     - Round One: Despite identical structures, groups attribute outcomes to their values (showing direct cultural causation).
     - Round Two: The groups that suffered collapse will blame structure, but only the ascetic group (CWA) is able to adapt (because of its script) by reinvesting in a way that minimizes losses or even thrives. This demonstrates elective affinity: the value script is only effective when structures are favorable, but note the counterfactual asymmetry: in the collapse, the ascetic script still does better than others, but without the structure it cannot do as well as it did in Round One. Also, the vote reveals that groups think structure is more critical even though they attributed Round One success to values.

   Counterfactual asymmetry problem: Values seem to explain success in favorable conditions but not failure in unfavorable conditions? Or do they? The ascetic group might still do relatively better in the collapse, but without the structure, even they cannot achieve high success. The problem is that we cannot test the counterfactual of the same values in the absence of the structure in the same group (because the same group cannot be in two states). But the simulation uses different groups with different scripts in the same structural conditions to approximate.

