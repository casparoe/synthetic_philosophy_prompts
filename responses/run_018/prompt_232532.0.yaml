       - **Case 3 (Neural-emulation aid)**:  
         \( (0.7 \times 50) + (0.3 \times -55) = 35 - 16.5 = 18.5 \geq 0 \) → **Authorised (matches)**.
       - **Case 4 (Mental-health chatbot)**:  
         \( (0.7 \times 45) + (0.3 \times -20) = 31.5 - 6 = 25.5 \geq 0 \) → **Authorised (matches)**.
     - **Conclusion**: This procedure perfectly aligns with all past decisions without needing additional parameters. The panel authorises proposals with non-negative expected choiceworthiness.

  #### 2. **Veto-Then-Maximise Also Fits but Relies on an Arbitrary Threshold**
     - **Procedure**: First, veto any proposal deemed a "grave wrong" by a theory with non-trivial credence (here, I or S). Then, apply expected choiceworthiness to non-vetoed proposals.
     - **Grave Wrong Threshold**: From Case 2 (S: -75 → vetoed/declined) and Cases 3–4 (S: -55, -20 → not vetoed/authorised), the veto threshold for S must be **≤ -75** (to veto Case 2) but **> -55** (to not veto Case 3). For example:
       - Threshold **-70**: Vetoes Case 2 (S: -75 ≤ -70) but not Case 3 (S: -55 > -70).
       - Threshold **-75**: Vetoes Case 2 (S: -75 ≤ -75) but not Case 3 (S: -55 > -75).
     - **Past Decisions Analysis**:
       - Cases 1–4 can fit with thresholds like -70 or -75, but the exact value is **arbitrary and unspecified** by the panel. I scores are always positive in past cases, so I-based vetoes are untested.
     - **Conclusion**: This procedure fits the data but requires an unstated threshold, making it less parsimonious than expected choiceworthiness maximisation.

  #### 3. **New Proposal Evaluation**
     - **Scores**: I: +70, S: -95.
     - **Expected Choiceworthiness**:  
       \( (0.7 \times 70) + (0.3 \times -95) = 49 - 28.5 = 20.5 \geq 0 \) → **Authorise**.
     - **Veto-Then-Maximise**:  
       S: -95 is below any plausible threshold (e.g., -70 or -75) → **Veto and decline**.
     - **Procedures Diverge**: Expected choiceworthiness supports authorisation; veto-then-maximise supports decline.

  #### 4. **Which Procedure Is the Panel Implicitly Using?**
     - **Expected choiceworthiness maximisation** is the implicit procedure because:
       - It fits all decisions **without thresholds or extra rules**.
       - It directly uses the panel's stated credences (0.7 I, 0.3 S), reflecting their explicit moral uncertainty.
       - The veto procedure introduces an arbitrary "grave wrong" threshold unsupported by the panel's records (e.g., no defined S-score cutoff).
     - **Principle Adopted**: The panel prioritises **maximising expected moral value** under uncertainty, authorising proposals where the weighted sum of scores (based on credence) is non-negative.

  #### 5. **Closest Analogous Case**
     - **Case 3 (Low-resolution neural-emulation aid)** is the closest analogue:
       - Both have **high I scores** (Case 3: +50, Proposal: +70) and **negative S scores** (Case 3: -55, Proposal: -95).
       - Both yield **similar positive expected choiceworthiness** (Case 3: 18.5, Proposal: 20.5).
       - Case 3 was authorised, supporting authorisation here.

