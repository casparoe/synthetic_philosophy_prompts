  ### How to Settle the Procedure Debate
  A **new test case** would resolve ambiguity:
  - **Proposal**: I = +100, S = -80.
    - **Scores**: I is high (benefiting persons), S is severely negative (risk of digital suffering) but above -55 (authorised in Case 3) and below -75 (vetoed in Case 2).
  - **Outcome Analysis**:
    - **Expected Choiceworthiness**: \( (0.7 \times 100) + (0.3 \times -80) = 70 - 24 = 46 \geq 0 \) → Authorise.
    - **Veto-Then-Maximise**: S = -80 ≤ any threshold in [-75, -55) → Veto and decline.
  - **Interpretation**:  
    - If the panel **authorises**, they use expected choiceworthiness (no veto concept).  
    - If they **decline**, they use veto-then-maximise (S-score threshold around -75 to -55).

