prompt: |-
  I was arguing with a friend last night about AI alignment and they kept falling back on this biolgy comparison: instrumental convergence is just like convergent evolution. You know, eyes and wings popping up everywhere because they solve universal problems, so of course any smart system will chase power and self-preservation no matter what it's "real" goal is. They used it to claim that the orthogonality thesis is basically dead — you can't have a superintelligent paperclipper that doesn't first try to take over, because the selection pressure for survival is unavoidable, like gravity pulling everything downward.

  Can you lay out the correspondence table — what's the intelligence, what's the environment, what's the selection pressure, what's the evolved trait, and what's the terminal goal? Then tell me where it breaks, especially around orthogonality: does treating goals as evolved traits smuggle in the idea that they're fixed by fitness rather than explicitly specified in code? And if those disanologies hold, does the scary conclusion — that alignment is basically hopeless because instrumental convergance is inevitable — actually survive, or was the analogy carrying the whole argument?
