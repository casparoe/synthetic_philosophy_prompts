  What to cut? Legal rights and neurobiology are tangents. The user's goal is ethical framing, not mechanics. The finale should be visceral: contrast a forced memorial (unjust remembrance) with dignified archiving (merciful forgetting) to crystallize that guilt isn't the only response. 

