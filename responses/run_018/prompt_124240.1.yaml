prompt: |-
  You're a professional philosopher with clinical ethics experience—think carefully and start with some quick brainstorming. I'm helping a hospice board operationalise tranquilism: the view that only absence of craving and suffering carries value, while positive goods like pleasure, relationships, or achievement are intrinsically weightless. We need a reusable decision procedre for bedside consultants who have fifteen minutes, no imaging access, and must recommend whether to continue or withdraw life-sustaining treatment for patients in minimal consciousness.

  Please write the checklist first: ordered questions, what counts as sufficient answer, the nodes that yield 'continue', 'withdraw', or 'hand to values committee', and explicit flags where judgement can't be removed. Make sure it handles 'craving residue'—the niche issue that lack of behavioural report in minimal consciousness doesn't prove absence of subjective craving, so the tool needs a risk-threshold rather than verification standard.

  Then apply it to two cases: (a) family insists on continuing nutrition because the patient might one day hear music and feel joy, and (b) family demands withdrawal citing religious duty, but ambiguous reflexive mouth movements could indicate residual craving or mere automatism. Include one result the family won't like, and state clearly what the procedure can't settle—especially conflicts between family values and tranquilist output.

  Keep it practical, British spelling, no citations or reading lists.
reasoning: |-
  Okay, let me approach this request methodically. The user is clearly familiar with clinical ethics frameworks but needs a practical tool for implementing tranquilism in hospice settings. They've specified tight constraints - 15-minute assessments, no imaging, minimal consciousness patients - which suggests real-world applicability is crucial. 

  Hmm... tranquilism's core challenge is its counterintuitive axiology. Most families (and clinicians) instinctively value positive experiences, so I need to build guardrails against that bias. The "craving residue" problem is particularly thorny - absence of evidence isn't evidence of absence when dealing with covert consciousness. 

  Right, structuring the checklist first. Must be: 
  - Sequential but with escape valves for uncertainty
  - Binary thresholds rather than probabilities (no time for nuance)
  - Explicit about what constitutes "sufficient" data under time pressure
  - Anchored to observable behaviours since imaging isn't available

  *scribbles mentally* Key decision nodes should be:
  1. Confirm diagnosis first - if not minimal consciousness, bail out
  2. Hunt for distress indicators (the only "negative value" state)
  3. If distress found, treat it before reassessing 
  4. If distress indeterminate, use craving residue threshold
  5. Explicitly ignore positive experience claims (music, joy etc.)

  Ah, the family conflict cases are telling. User wants the procedure to withstand emotional pressure - hence specifying "one result the family won't like". Also wisely flags that value clashes (tranquilism vs religious/cultural norms) must be outsourced to committees. 

  For case (a): Family's hope about future music enjoyment is irrelevant under tranquilism. But must check if current feeding causes observable distress - if not, tranquilism permits continuation since no craving is evidenced. Withdrawal only mandated if distress present. 

  Case (b) is trickier. Those mouth movements... Could be dystonic craving or just reflexes. Procedure must force a distress-or-not call based on crude behavioural signs. If ambiguous but crosses craving residue threshold (say, 2+ questionable signs), we default to assuming possible craving - hence recommend CONTINUE despite family's wishes. 

  *checks watch* Must remember the 15-minute constraint. No philosophical digressions. British spelling throughout. And absolutely no citations - this is a bedside tool, not an academic paper. 

  Final note to self: Emphasize that the procedure can't resolve value conflicts. If family rejects tranquilist axioms, the checklist becomes irrelevant - hence the "hand to committee" exit.
answer: |-
  ## Tranquilist Treatment Decision Checklist (Minimal Consciousness Patients)

  **Instructions:** Proceed sequentially. Answer based solely on observable behaviour and documented medical history within the 15-minute assessment window. Imaging/EEG data unavailable. **Crucial:** Tranquilism assigns value *only* to avoiding suffering/craving. Positive experiences (pleasure, potential future joy, relationships, achievements) hold *no intrinsic weight* in the calculus. "Craving residue" means behavioural absence ≠ proven absence; use risk thresholds below.

  1.  **Confirm Diagnosis:** Is the patient reliably diagnosed as being in a state of *minimal consciousness* (MCS), per established clinical criteria (e.g., inconsistent but reproducible non-reflexive behaviours)?  
      *   **Sufficient Answer:** Yes (Proceed to Q2) / No / Uncertain (If No/Uncertain → **HAND TO VALUES COMMITTEE** - Assessment invalid for this tool).
      *   *Judgement Flag:* Clinical diagnosis interpretation.

  2.  **Observe for Active Distress Indicators:** Within the assessment period, does the patient exhibit *any* unambiguous signs of *current* suffering or craving? (e.g., sustained grimacing, inconsolable agitation, pathological weeping, unambiguous vocalisations of pain/distress).  
      *   **Sufficient Answer:** Yes (Proceed to Q3) / No (Proceed to Q4) / Ambiguous (Proceed to Q4, note ambiguity).
      *   *Judgement Flag:* Interpretation of behavioural signs as "unambiguous distress".

  3.  **Is Distress Treatable?** If active distress indicators are observed (Q2=Yes), is there an immediately available, tolerable, and likely effective intervention to alleviate this *specific* distress? (e.g., analgesia, repositioning, treating infection).  
      *   **Sufficient Answer:** Yes → Implement intervention. **RECOMMEND CONTINUE TREATMENT**, re-assess after intervention. / No or Highly Unlikely → **RECOMMEND WITHDRAW TREATMENT** (Distress = negative value, untreatable).
      *   *Judgement Flag:* Assessment of treatability and efficacy potential.

  4.  **Assess for "Craving Residue" Risk:** *Regardless* of Q2 answer, assess for behavioural fragments *suggestive* (but not definitive) of possible underlying craving/suffering, acknowledging the "residue" problem. Score 1 point for each present:
      *   *Repetitive, non-purposeful vocalisations* (moans, grunts) occurring outside stimulus.
      *   *Sustained, non-reflexive facial expressions* (furrowed brow, clenched jaw) not linked to observable stimuli.
      *   *Autonomic instability* (tachycardia, hypertension, diaphoresis) unexplained by medical condition.
      *   *Any ambiguous behavioural response* (e.g., reflexive-looking movement) *consistently triggered* by a potentially noxious stimulus (e.g., suctioning, repositioning).
      *   **Craving Residue Threshold:** **≥ 2 points** indicates unacceptable risk of subjective craving/suffering.
      *   **Sufficient Answer:** Score = 0 or 1 → **RECOMMEND CONTINUE TREATMENT** (Risk below threshold: absence of craving/suffering reasonably presumed). / Score ≥ 2 → **RECOMMEND WITHDRAW TREATMENT** (Unacceptable risk of craving/suffering = potential negative value). / Uncertainty in scoring → **HAND TO VALUES COMMITTEE**.
      *   *Judgement Flag:* Interpretation of behaviours as "suggestive" and scoring accuracy.

  5.  **Value Conflict Check:** Does the family's primary reason for their preference explicitly invoke a value *inconsistent* with Tranquilism (e.g., potential future pleasure, religious duty concerning positive states, intrinsic value of biological life regardless of experience)?  
      *   **Sufficient Answer:** Yes → **HAND TO VALUES COMMITTEE** (Decision involves values beyond Tranquilist scope). / No → Proceed with recommendation from Q2-Q4.
      *   *Judgement Flag:* Interpretation of family's stated values against Tranquilist axioms.

  **Key Output Nodes:**
  *   **CONTINUE TREATMENT:** Q1=Yes, AND (Q2=No AND Q4 Score <2) OR (Q2=Yes AND Q3=Yes).
  *   **WITHDRAW TREATMENT:** (Q2=Yes AND Q3=No) OR (Q4 Score ≥2).
  *   **HAND TO VALUES COMMITTEE:** Q1=No/Uncertain, OR Uncertainty in Q4 scoring, OR Q5=Yes.

  ---

  ## Case Applications

  **Case (a): Family insists on continuing nutrition because the patient might one day hear music and feel joy.**

  1.  **Q1:** Confirmed MCS? (Assume **Yes**).
  2.  **Q2:** Active Distress Indicators? (Assume **No** unambiguous signs observed).
  3.  *(Q3 skipped as Q2=No)*
  4.  **Q4:** Craving Residue Risk? (Assume no suggestive behaviours, Score = **0**).
  5.  **Q5:** Value Conflict? **YES.** Family's sole reason is potential future *positive experience* (hearing music, feeling joy), which Tranquilism deems intrinsically weightless. This conflicts fundamentally.
      *   **OUTPUT: HAND TO VALUES COMMITTEE.** (Tranquilist assessment finds no basis for withdrawal *or* intrinsic value in continuation based on potential joy. The *reason* for continuation conflicts with core axioms. Committee must mediate between family's values and institutional policy).

  **Case (b): Family demands withdrawal citing religious duty (e.g., soul's release), but ambiguous reflexive mouth movements could indicate residual craving or mere automatism.**

  1.  **Q1:** Confirmed MCS? (Assume **Yes**).
  2.  **Q2:** Active Distress Indicators? (Assume **No** unambiguous signs observed).
  3.  *(Q3 skipped as Q2=No)*
  4.  **Q4:** Craving Residue Risk? Ambiguous mouth movements are noted. Are they:
      *   Repetitive/non-purposeful? (Assume Yes - **+1 Point**)
      *   Sustained/non-reflexive? (Assume Uncertain, but leaning yes - **+1 Point** - *Judgement Flag*)
      *   Unexplained Autonomic Instability? (Assume No)
      *   Consistently triggered by noxious stimuli? (Assume No specific link observed)
      *   **Score ≥ 2** (Based on judgement of Q4 criteria).
  5.  **Q5:** Value Conflict? **YES.** Family's demand is based on religious duty concerning a positive state (soul's release/afterlife), irrelevant to Tranquilism's focus on suffering. *However*, Q4 already triggered a Withdraw recommendation based on risk.
      *   **OUTPUT: RECOMMEND WITHDRAW TREATMENT.** (Tranquilist assessment indicates unacceptable risk of craving/suffering (Q4 ≥2), outweighing any value in mere biological persistence. *Family won't like this* as they wanted withdrawal for conflicting religious reasons, not due to risk of suffering. The procedure mandates withdrawal based on risk assessment, not their rationale).
      *   **What the procedure can't settle:** The *reason* for withdrawal (risk of suffering vs. religious duty) is a values conflict. The procedure outputs the *action* (withdraw) based on Tranquilist risk assessment, overriding the family's *motivation*. The committee might need to address the family's specific religious concerns post-decision.

  ---

  **Explicit Limitations of the Procedure:**

  1.  **Cannot Resolve Value Conflicts:** It identifies when family values (e.g., potential joy, religious duties concerning non-suffering states) clash with Tranquilism's core axiom (only absence of suffering matters). This *must* go to the Values Committee. The procedure only outputs a decision when values *align* or when the Tranquilist assessment is clear *despite* conflicting family motivations.
  2.  **Relies on Behavioural Interpretation:** Key flags exist around judging distress (Q2) and scoring ambiguous behaviours for craving residue (Q4). Clinician experience is crucial; absolute certainty is impossible.
  3.  **Ignores Non-Suffering Positive States:** The procedure systematically disregards arguments based on potential or past pleasure, relationships, achievement, or the intrinsic value of life itself. These are outside its scope.
  4.  **Does Not Dictate Treatment:** It outputs a *recommendation* (Continue, Withdraw, Hand to Committee). Actual decision-making involves the clinical team, patient's legal framework (advance directives, proxies), and the committee where applicable.
  5.  **Limited to MCS:** Requires a confirmed (or highly probable) MCS diagnosis to be applicable. Other states (coma, vegetative state, higher consciousness) require different frameworks.
