  Here's your decision tree taxonomy for intergenerational guilt, designed for intuitive edge-case sorting. The tree starts broad and forces concrete choices—no philosopher name-dropping required. The awkward leaf? That's where things get *spicy*.

  ### Decision Tree: Can a Nation Be Guilty Across Generations?
  **(Follow the branches by answering YES/NO or choosing an option)**

  1. **Do collective moral terms (like "guilty") apply to non-person entities (nations, corps) at all?**  
     - **NO** → **Leaf 1: Strict Methodological Individualist Rejection**  
     - **YES** → Proceed to 2  

  2. **Does institutional continuity (same laws/borders/constitution) preserve guilt through 100% population replacement?**  
     - **YES** → Proceed to 3  
     - **NO, only cultural/essentialist transmission does** → Proceed to 4  

  3. **Is "political guilt" (reparations, reform) distinct from "moral guilt" (personal blameworthiness)?**  
     - **YES** → **Leaf 2: Jaspers-Style Political Guilt**  
     - **NO** → **Leaf 3: Corporate-Agent-with-Institutional-Continuity View**  

  4. **(After rejecting institutional continuity) Is there a real distinction between political/moral guilt?**  
     - **YES** → Proceed to 5  
     - **NO** → Proceed to 6  

  5. **Does accepting transgenerational guilt force ethnic essentialism (bloodline/immutable essence)?**  
     - **YES** → **Leaf 4: Unnamed Combo (Essentialist Political Guilt)**  
     - **NO** → **Leaf 5: Structural Political Guilt (no essentialism)**  

  6. **Does accepting transgenerational guilt force ethnic essentialism?**  
     - **YES** → **Leaf 6: Essentialist Transmission View**  
     - **NO** → **Leaf 7: Structural-Transmission-Without-Essentialism**  

  ---

  ### Leaf Definitions
  | Leaf_Name                              | Core Claim                                                                                                      | Awkward Commitment                                                                                                |
  |----------------------------------------|-----------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------|
  | Strict Methodological Individualist Rejection | Only humans bear moral guilt; nations are just labels. Zero guilt transfer.                                     | Denies repair obligations even for ongoing structural harms (e.g., apartheid legacies).                          |
  | Jaspers-Style Political Guilt          | Nations owe reparations via institutional continuity, but no one alive is morally blameworthy.                 | "Guilt" feels like legal fiction—responsibility without sinners.                                                 |
  | Corporate-Agent-with-Institutional-Continuity View | Nations are moral agents; guilt sticks to institutions through time, regardless of population change.           | Newborns inherit blame for crimes predating their ancestors.                                                     |
  | **Unnamed Combo** (Essentialist Political Guilt) | Only *political* guilt transfers via blood/culture—but not moral blame.                                         | **Requires ethnic essence for liability but not blame—why would reparations need ancestry?**                     |
  | Structural Political Guilt (no essentialism) | Political guilt transfers via unjust structures (e.g., discriminatory laws), not bloodline.                    | Why *wouldn’t* moral guilt also transmit via these structures? Liability without moral failure seems hollow.    |
  | Essentialist Transmission View         | Both moral/political guilt bind descendants via blood/immutable culture.                                        | Unbreakable guilt-trap: you’re stained at birth.                                                                 |
  | Structural-Transmission-Without-Essentialism | Both guilt types persist via structures (norms/institutions), not essence. Living people uphold the harm.       | Assigns moral blame to people who didn’t create the system they inherited.                                       |

  **Unnamed Leaf Diagnosis:**  
  *Requires ethnic essence for liability but not blame—why would reparations need ancestry if the guilt isn’t moral?*

  **Unseparable Pairs:**  
  - "Structural Political Guilt" vs. "Structural-Transmission-Without-Essentialism": Both reject essentialism, but the tree can’t split if structural transmission implies *both* guilt types or *only* political.  
  - "Essentialist Transmission View" vs. "Unnamed Combo": Tree can’t isolate cultural-essentialist defenders who *only* endorse political guilt.

