prompt: |-
  I've always found the blanket rationalist dismissal of sunk-cost reasoning too quick. The standard line — that a fully rational agent cares only about future marginal costs and benefits, so past expenditures should never influence current choice — treats all prior investment as fungible resource capital. I want you to argue that this misses a structurally distinct category: commitment capital, which is path-dependent, non-fungible, and serves functions that disappear the moment one treats it as recoverable. Specifically, defend the position that honoring sunk costs is rational whenever discontinuity would destroy accumulated commitment capital that preserves intertemporal consistency of long-term plans, maintains credible signaling in repeated or collaborative interactions, or avoids hidden restructuring costs that naive forward-looking analysis systematically underestimates. Build your case against the strong claim that prior expenditures are always irrelevant to rational choice. To keep the argument concrete and not just a list of examples, apply it tightly to one scenario: a long-running collaborative research program in which a major funding partner withdraws, leaving substantial unrecoverable investment in shared protocols, calibrated instruments, and trust networks. Precisely distinguish resource capital from commitment capital; show how ignoring the latter produces strategic analogues of hyperbolic discounting at the group level; and explain why continuing the program can be rational even if launching an equivalent replacement elsewhere has lower immediate direct cost. Keep it in the weeds — don't just repeat that "sometimes quitting is bad," but construct the conceptual machinery and show exactly how it bears on the decision. Please structure your response in these sections, in order, with approximate lengths: The position stated (about 100 words); The conceptual distinction (about 150 words); Core argument applied to the scenario (about 250 words); Strongest objection and reply (about 150 words); What would change my mind (about 100 words). In the final section, say explicitly what argument or consideration would lead you to reject the commitment-capital framing, and flag where your reasoning is most vulnerable.
