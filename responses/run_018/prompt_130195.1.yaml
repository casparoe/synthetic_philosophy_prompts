prompt: |-
  I'm taking a philosophy of AI course and we're talking about the frame problem — not just the robot version where you have to list every non-effect of an action, but the broader epistemic idea that any reasoner has to treat some background conditions as fixed or else it can't update at all. My TA mentioned in passing that this might explain real institutional failures, not just computer bugs, and it got me thinking about actual disasters where people had all the data but updated the wrong frame.

  So here's what I want: analyze the 1979 Three Mile Island accident through that lens. Treat the operators' mental model as an explicit frame — which variables were inside it (the pressure relief valve status, coolant pressure readings) and which were treated as invariant or peripheral (the actual loss of coolant, the state of the reactor core). Show exactly where the frame problem hit them: what critical information was recieved but not integrated because it didn't fit the active framing, and whether simply redesigning the display to make core temperature central would have solved it or just shifted the frame problem to a different set of fixed assumptions. Be honest about where the explanation stops and regular organizational culture or training failures take over, and don't just retell the accident story — I want the frame problem used as a real explanatory tool that both illuminates and fails. Write it in American English, and don't bother with bibliographies or citations, since I'm asking you to work through the logic, not summarize papers.
