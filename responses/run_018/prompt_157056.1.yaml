answer: |-
  ### Design Outline
  1. **Constraints**: Real-world reproductive medicine; fixed parents, environment, and developmental path; altered gametes only.  
  2. **Mechanism**: Multi-embryo IVF selection (using preimplantation genetic testing to select among genetically distinct embryos from the same parental gametes).  
  3. **Scenario Core**: Two embryos from the same IVF batch develop into psychologically identical adults due to identical nurture.  
  4. **Conflict**: Origin essentialism (identity requires same gametes) vs. psychological continuity (identity via mental connectedness).  
  5. **Isolation**: Remove matched developmental trajectory to test both theories.  

  ---

  ### Thought Experiment  
  **Scenario**: A couple undergoes IVF, creating 12 embryos. Preimplantation genetic screening identifies embryo A (genotype X) and embryo B (genotype Y). Embryo A is implanted, develops into "Emma," and lives a full life. Years later, the couple uses embryo B—genetically distinct but from the same IVF cycle—implanted into the same surrogate. Raised in an identical environment (same parents, home, schools, experiences via meticulous replication), "Em" develops memories, personality, and beliefs indistinguishable from Emma’s at age 30 due to environmental determinism overriding genetic differences.  

  **Identity Claim Tested**: *Is Em identical to Emma?*  
  - **Psychological Continuity**: Yes. Em shares unbroken psychological connectedness (memories, traits, beliefs) with Emma.  
  - **Origin Essentialism**: No. Em originated from different gametes (embryo B ≠ embryo A), violating essential biological origin.  

  **Nearby Worlds**:  
  - *Psychological continuity* considers worlds where Em’s psychology diverges (e.g., different upbringing). Identity fails there.  
  - *Origin essentialism* considers worlds where Em shares gametes with Emma. Identity holds only there.  

  **Structural Feature**: *Matched developmental trajectory*.  
  - **If removed**: If Em’s upbringing differs, psychological continuity denies identity (no mental connectedness). Origin essentialism still denies it (different gametes).  
  - **Effect**: This feature alone enables psychological overlap despite biological discontinuity.  

  **Origin Essentialist Critique**:  
  They argue that psychological similarity is contingent, not constitutive of identity. Em’s memories are quasi-Emma’s but falsified; she is a *different person* coincidentally mimicking Emma due to controlled nurture. True identity requires material origin—Em’s distinct gametes preclude numerical sameness.  

  ---  
  *Key Philosophical Work*: Gametic substitution under fixed nurture creates a "twin case" where theories diverge. The experiment isolates whether biology or psychology grounds "being the same person" when origin and continuity pull apart.
