answer: |-
  What you're describing is a fascinating and increasingly prominent stance in the philosophy of mathematics, situated precisely at the intersection of computation, epistemology, and ontology. While there isn't a single universally accepted term *yet*, the view you outline has distinct characteristics and can be labeled and distinguished from its neighbors.

  **Proposed Term: Formalist Platonism (or Mechanized Formalist Platonism)**

  This term captures the essential tension you identify:

  1.  **Platonism:** Retains the core idea that mathematics describes a pre-existing, objective reality ("pre-existing structures," "true structure").
  2.  **Formalism:** Emphasizes that *access* to this reality is *only possible* or *only fully reliable* through rigorous, mechanizable formal systems ("forces us to specify every definitional choice," "manufactures a precisely delimited artifact").
  3.  **Mechanized:** Gives special, constitutive epistemological and ontological weight to the process of *machine verification itself* ("machine independence... as evidence," "special ontological weight given to machine-checkability").

  **Why this term works:**

  *   It explicitly names the combination of ontological commitment (Platonism) with an epistemological constraint deeply tied to formal systems and their mechanization (Formalism).
  *   It highlights the "slide" you observe: the machine's independence (supporting Platonism) is *simultaneously* the agent of construction (invoking Formalism), and this construction is seen as the *necessary path* to accessing the Platonic reality.
  *   It distinguishes it from both "pure" Platonism and "pure" Formalism/Nominalism.

  **Sharpening the Boundaries:**

  1.  **vs. Traditional Mathematical Platonism:**
      *   **Traditional Platonism:** Mathematical objects exist independently of minds, language, and formal systems. Human intuition, informal proofs, and even potentially non-mechanizable reasoning can provide genuine access to this reality. Gödel is a prime example, believing in mathematical intuition.
      *   **Formalist Platonism:** While mathematical reality exists independently, *reliable, objective access* to it *requires* formalization and mechanized verification. The computer's execution isn't just a tool; it's the *guarantor* of objectivity. The "constructed artifact" *is* the reliable representation of the Platonic object *because* it is mechanizable. Informal proofs are seen as inherently suspect, preliminary sketches that only gain full ontological grounding *after* mechanization.

  2.  **vs. The View that Formal Proofs are Just Longer Informal Proofs:**
      *   **"Longer Proofs" View:** Sees formalization as a tedious but essentially straightforward translation of human reasoning into a stricter syntax. The ontology remains the same; it's just a matter of rigor and detail. The computer is a sophisticated proof-checking clerk.
      *   **Formalist Platonism:** Sees formalization, especially mechanizable formalization, as fundamentally *constitutive*. The choices made (foundations, encodings, library structures) are not neutral translations but *part of defining the object under scrutiny*. The machine-checked proof doesn't just verify a human idea; it *realizes* or *constructs* the precise, objective instance of the mathematical concept that can be intersubjectively verified. The process *creates* the reliable epistemic object.

  3.  **vs. Nominalism/Artifact Views:**
      *   **Nominalism:** Denies the existence of abstract mathematical objects altogether. Mathematics is ultimately about symbols, conventions, linguistic rules, or mental constructs. The mechanized proof is just a particularly complex artifact of notation and computation.
      *   **Formalist Platonism:** Emphatically *affirms* the existence of an objective mathematical reality *beyond* the symbols. However, it claims that this reality *can only be reliably apprehended through* the specific, constructed, mechanizable formal artifact. The artifact is not *all* there is; it is the *only reliable lens* onto what *is*. The ontological weight of the machine lies in its unique ability to *mediate* access to the Platonic realm by eliminating human subjectivity.

  **Core Distinguishing Feature: The Ontological Weight of Mechanized Verification**

  As you astutely observe, the crux is "the special ontological weight given to machine-checkability itself." This view holds that:

  *   **Machine Independence is an Epistemic Guarantor:** The computer's freedom from human bias provides objective access to truth (Platonic leaning).
  *   **Formalization is Ontologically Constitutive:** The act of formal specification within a mechanizable system *defines* the precise mathematical object being studied in a way that grants it objective status (Formalist leaning).
  *   **Mechanized Verification is Necessarily Constitutive:** Access to the Platonic realm *requires* this process of mechanizable formal construction. The two aspects (discovery *of* a pre-existing structure *through* construction *of* a formal artifact) are inseparable and mutually dependent.

  **Related Concepts & Why They Aren't Perfect Fits:**

  *   **Computational Realism:** Often broader, focusing on the reality of computation itself or the idea that physical computation instantiates abstract computation. Doesn't necessarily capture the specific tension between Platonic objects and formal construction in *mathematics*.
  *   **Proof Artifacts (Avigad):** Focuses on the formal proof as a constructed object with its own properties and history. While compatible, it doesn't inherently include the strong Platonic commitment to an independent reality that the artifact *reveals*.
  *   **Social Constructivism:** Focuses on human practices and consensus. Formalist Platonism shifts the locus of objectivity and construction *away* from human consensus towards the machine process.
  *   **Mechanized Epistemology:** Describes the *method* (using computers for verification) but doesn't specify the *ontological commitment* that often accompanies it in these discussions.
  *   **(Anton) Setzer's "Machine Ontology":** Comes closest conceptually. Setzer argues that the execution of a program on a physical machine provides a unique kind of mathematical truth and existence. This strongly aligns with the view you describe, giving concrete ontological weight to the machine process. "Machine-Guided Ontology" or "Setzerian Ontology" could be alternatives reflecting this influence.

  **Conclusion:**

  The position you're identifying—where mechanized verification is seen simultaneously as a window onto a pre-existing mathematical reality *and* as the constructive process that defines the precise objects of that reality, with the machine's role being ontologically significant—is best termed **Formalist Platonism** (or **Mechanized Formalist Platonism**). It's a distinctive hybrid arising from the practice of formal verification, characterized by:

  1.  **Ontological Commitment:** Belief in an objective mathematical reality.
  2.  **Epistemological Constraint:** Reliable access to #1 *requires* formalization and mechanized verification.
  3.  **Constitutive Role:** The formal, mechanizable artifact is not merely descriptive but is the necessary *conduit* or *realization* of the Platonic object for epistemic purposes.
  4.  **Machine-Centric Objectivity:** The computer's independence from human psychology is the key source of the objectivity gained through #2 and #3.

  This view navigates between traditional Platonism (by making access dependent on formal construction), naive formalism (by retaining a robust independent reality), and nominalism (by affirming that the constructions point beyond themselves to an objective realm). The tension you note is inherent to the position: the machine's independence *enables* discovery precisely *because* it forces a specific, constructive formalization.
