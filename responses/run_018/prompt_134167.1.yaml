answer: |-
  ### Decision Tree: The Fate of the Analytic-Synthetic Distinction

  **Root Commitment**:  
  Accept Quine’s claim that *no statement is immune to revision solely in virtue of meaning*?  
  - **No** → **Leaf: Traditional Analytic-Synthetic Distinction**  
    *Holds that some statements (e.g., "all bachelors are unmarried") are true purely by meaning and cannot be revised without changing language itself.*  

  - **Yes** → Proceed to **Node 1: The Conservation Case**  

  **Node 1: Conservation Case**  
  *If physicists preserve "energy is conserved" by redefining "energy" amid anomalies, is this:*  
  - **A change of belief only** (meaning untouched) → Proceed to Node 2  
  - **A change of meaning only** (belief untouched) → Proceed to Node 2  
  - **An institutional decision** (practical convention for deploying the term) → Proceed to Node 2  

  **Node 2: Calibration Case**  
  *A measurement manual’s rule that "zero" corresponds to a physical state is:*  
  - **Analytic** (part of the term’s meaning) → *Does embedding this rule in hardware (vs. language) change its status?*  
    - **Yes** → Proceed to Node 3  
    - **No** → Proceed to Node 3  
  - **Synthetic** (empirical claim about the device) → *Does hardware embedding change its status?*  
    - **Yes** → Proceed to Node 3  
    - **No** → Proceed to Node 3  
  - **A practical convention** (no metaphysical status) → *Does hardware embedding change its status?*  
    - **Yes** → Proceed to Node 3  
    - **No** → Proceed to Node 3  

  **Node 3: Logic-Revision Case**  
  *Abandoning excluded middle to save a physical theory would:*  
  - **Alter the meaning of "not"** → **Leaf**  
  - **Only change beliefs about logical truth** → **Leaf**  

  ---

  ### Leaf Positions  
  *(From combinations of answers)*  

  #### For **Reject Quine** (Root = No):  
  - **Traditional Analytic-Synthetic Distinction**: Survives intact.  

  #### For **Accept Quine** (Root = Yes):  
  - **Conservation: Institutional decision**  
    + **Calibration: Analytic**  
      - *Hardware alters status: Yes* → **Carnapian Conventionalism**  
        *Rules are framework-relative conventions; hardware embodies operational choices.*  
      - *Hardware alters status: No* → **Unnamed/Underexplored**  
    + **Calibration: Synthetic**  
      - *Hardware alters status: No* → **Quinean Holism (lean)**  
        *All statements are empirical; hardware is just reliable design.*  
      - *Hardware alters status: Yes* → **Unnamed/Underexplored**  
    + **Calibration: Practical convention**  
      - *Any hardware answer* → **Pragmatist Deflationism**  
        *Rules are tools; "meaning" is irrelevant to their function.*  
    + **Logic-revision: Alters meaning** → *Coherent*  
    + **Logic-revision: Changes beliefs only** → **Incoherent**  
      *Cannot hold logic beliefs are empirical while treating calibration as conventional.*  

  - **Conservation: Change of belief only**  
    + **Calibration: Analytic** → **Incoherent**  
      *Contradicts Quine’s rejection of meaning-based immunity (root = Yes).*  
    + **Calibration: Synthetic**  
      - *Hardware alters status: No* → **Quinean Holism (strict)**  
        *All revisions are empirical; logic and calibration face empirical pressure.*  
      - *Hardware alters status: Yes* → **Unnamed/Underexplored**  
    + **Calibration: Practical convention**  
      - *Any hardware answer* → **Unnamed/Underexplored**  
    + **Logic-revision: Alters meaning** → **Incoherent**  
      *Cannot claim logic revision changes meaning while conservation doesn’t.*  
    + **Logic-revision: Changes beliefs only** → *Coherent with Quinean Holism (strict)*  

  - **Conservation: Change of meaning only**  
    + **Any calibration answer** → **Incoherent**  
      *Violates Quine’s claim (root = Yes) by isolating meaning from empirical revision.*  
    + **Any logic answer** → **Incoherent**  

  #### Ambiguous/Overlapping Leaves  
  - **Quinean Holism (strict)** and **Quinean Holism (lean)** overlap if:  
    Conservation = Institutional decision + Calibration = Synthetic + Hardware alters = No.  
    *Tree separates them via conservation choices, but both align with Quine’s core ideas.*  
  - **Pragmatist Deflationism** and **Carnapian Conventionalism** blur if:  
    Conservation = Institutional + Calibration = Practical convention.  
    *Carnap retains analyticity; pragmatists reject it.*  

  ---

  ### Reasoning  
  This tree tests whether the analytic-synthetic distinction *vanishes* (Quine’s view) or *morphs* into subtler divisions after Quine’s critique. The three cases probe key fault lines:  

  1. **Conservation Case**:  
     - Distinguishes **holism** (revisions affect belief/meaning holistically) from **conventionalism** (revisions are deliberate choices).  
     - Quineans *must* reject "meaning only" (incoherent with root) and often favor "belief only" or "institutional."  

  2. **Calibration Case**:  
     - Tests if "meaning" still applies to *rules*. Analytic answers imply a *residual distinction*; synthetic answers align with empiricism; convention answers erase metaphysics.  
     - Hardware tests if meaning is *abstract* or *material*. Few positions hold hardware changes status (Carnapians excepted).  

  3. **Logic-Revision Case**:  
     - Reveals split on whether logic is *empirical* (beliefs revisable) or *constitutive* (revision changes meaning).  
     - Quineans typically say logic revision alters meaning (unlike calibration), creating tension.  

  #### What the Tree Captures:  
  - **Core debate**: Quinean holism vs. Carnapian conventionalism.  
  - **Hidden distinctions**: Whether "conventions" are meaning-based (Carnap) or pragmatic (deflationism).  
  - **Incoherencies**: Isolating meaning change (violates Quine’s root) or mixing empirical/conventional revisions inconsistently.  

  #### What It Omits:  
  - Gradations of "revisability" (e.g., some statements *harder* to revise).  
  - Social or historical dimensions of meaning change.  
  - Non-logical analyticity (e.g., mathematical truths).  

  The tree simplifies debates but helps readers spot if their view leans Quinean (empirical web), Carnapian (framework-relative), or uncharted. Most combinations are unnamed—suggesting the distinction’s fate remains unsettled.
