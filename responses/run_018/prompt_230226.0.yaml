  Okay, the user is dealing with a complex situation involving a reading group on the legitimacy of international criminal courts and a brother-in-law who dismisses them as "victor's justice," specifically referencing Nuremberg and Tokyo. They've broken down the brother-in-law's argument into four points but are struggling to untangle them. The user wants a clear breakdown of each thesis within "victor's justice," an assessment of each, and how they relate to the broader claim that international law is mere theater.

  First, I need to address each of the four points the user outlined. They mentioned selectivity, retroactivity, institutional control, and the "no crime without law" objection. Each of these points needs to be categorized as trivially true, factually shaky, defensible-but-irrelevant, or a genuine problem. 

  Starting with selectivity (point 3): It's true that Allied actions like Dresden or Hiroshima weren't prosecuted. But is that a fatal flaw? The user might be looking for whether this invalidates the entire legal process or if it's a common limitation in legal systems. The brother-in-law seems to conflate selectivity with the entire system being illegitimate. The user probably needs to counter this by explaining that selectivity doesn't negate the validity of the charges that were prosecuted.

  Next, retroactivity (point 2): The crimes against peace charge was indeed applied retroactively. This is a genuine problem under the principle of nullum crimen sine lege. However, the defense at Nuremberg argued that existing treaties and state practice provided a basis. The user might need to show how this was handled legally versus just dismissing it outright. The brother-in-law's leap from retroactivity to "theater" ignores the legal arguments made at the time.

  Institutional control (point 1): The victors did set up the courts. But does that automatically make the trials illegitimate? This is defensible-but-irrelevant if the procedures were fair. The user's deeper need here is to separate the creation of the tribunal from the fairness of the trials. The brother-in-law's argument assumes bias without evidence, so pointing to the actual conduct of the trials is key.

  The "no crime without law" objection (point 4): The brother-in-law claims the judges were biased in their rulings. But the judges addressed legal precedents and existing laws. The user needs to highlight that legal reasoning was involved, not just victors' dictates. This point is factually shaky because it dismisses the judicial process.

  The user also wants to know if someone could accept Nuremberg but reject Tokyo. Differences in process, like MacArthur's control in Tokyo and rushed procedures, might justify this view. The brother-in-law's blanket statement doesn't account for these nuances.

  Lastly, the user questions whether the origin of a tribunal invalidates all its verdicts. This is crucial. The brother-in-law's overreach ignores that individual verdicts can be legitimate even if the court's creation was flawed. The user needs to show that each verdict must be assessed on its own merits.

  The user's identity seems academic, possibly in law or political science, running a reading group. They need a structured analysis to facilitate discussion and counter simplistic slogans. Their deeper needs include understanding the nuances of each argument, providing evidence-based rebuttals, and enabling critical thinking in their group. They might also want to address the brother-in-law's points effectively in future conversations without getting bogged down.
answer: |-
  Your brother-in-law's "victor's justice" slogan bundles distinct critiques, some valid, others overstated. Breaking down the precise theses, assessing their validity, and showing their relationship to his conclusion ("international law is theater") is crucial. Here's the analysis:

  ### Deconstructing "Victor's Justice": The Four Theses & Their Status

  1.  **Thesis: Institutional Creation & Control (Your point 1)**
      *   **Precise Claim:** The victorious powers exclusively established the tribunals (IMT at Nuremberg, IMTFE in Tokyo), appointed the judges/prosecutors, and defined the applicable law in the Charter.
      *   **Status:** **Trivially True.** This is a simple historical fact. The Allies created the tribunals post-conflict.
      *   **Critique/Relevance:** While true, this *alone* does not automatically invalidate the proceedings as "not law" or "theater." Many legitimate domestic legal systems are created by specific political actors. The critical question is whether fair procedures and substantive justice were achieved *despite* this origin. It raises concerns about *potential* bias but doesn't prove it existed in practice.

  2.  **Thesis: Retroactive Criminalization (Your point 2 - "Ex Post Facto Law")**
      *   **Precise Claim:** Certain charges, particularly "Crimes Against Peace" (planning/initiating/waging aggressive war), were defined *after* the actions took place, violating the fundamental legal principle *nullum crimen, nulla poena sine lege* (no crime, no punishment without law).
      *   **Status:** **Genuine Problem (but contested).** This is the strongest legal criticism, especially for Crimes Against Peace.
      *   **Critique/Relevance:**
          *   **Problem:** Applying new law retrospectively undermines legal certainty and fairness. Defendants argued they couldn't know initiating war was a *personal* crime.
          *   **Defense:** The Nuremberg Judgment argued that aggressive war was already illegal under treaties (e.g., Kellogg-Briand Pact 1928) and customary international law, and that individuals (leaders) could be held responsible for state acts violating these norms. This was a significant, *controversial* development, not a straightforward application of existing *criminal* law for individuals.
      *   **Conclusion:** This is a serious challenge to the *legality* of some convictions under strict positivist legal principles. It weakens claims of pure legal legitimacy for those specific charges.

  3.  **Thesis: Selective Prosecution (Your point 3)**
      *   **Precise Claim:** Only losers were prosecuted; no individuals from the victorious Allied powers were tried for potentially comparable acts (e.g., strategic bombing of cities - Dresden, Tokyo Firebombing, Hiroshima/Nagasaki; Soviet atrocities like Katyn, conduct on the Eastern Front).
      *   **Status:** **Trivially True (fact of non-prosecution).** **Defensible-but-Irrelevant OR Genuine Problem (depending on context).**
      *   **Critique/Relevance:**
          *   **Fact:** It's undeniable that only Axis leaders/combatants were tried by the IMT/IMTFE. Allied actions weren't scrutinized by these tribunals.
          *   **Problem:** This selectivity creates a profound perception (and arguably a reality) of hypocrisy and undermines the moral authority and claim to universal application of the law. It suggests power, not principle, dictated accountability. It makes the tribunals look like instruments of punishment, not impartial justice.
          *   **Defensible-but-Irrelevant?** Proponents argue: (a) The scale and systematization of Axis crimes (especially the Holocaust) were qualitatively different; (b) Establishing *any* precedent required starting with the aggressors; (c) Practical/political realities made prosecuting victors impossible then. However, for the *legitimacy* of the tribunals *as law*, especially under principles of equality before the law, selectivity remains a **Genuine Problem**, eroding their claim to impartial justice. It fuels the "victor's justice" perception significantly.

  4.  **Thesis: Judicial Bias & Self-Justification (Your point 4)**
      *   **Precise Claim:** The judges were representatives of the victors, making their rulings on key challenges (like retroactivity or jurisdiction) inherently biased acts of self-justification, not genuine legal adjudication. Their interpretation of the law served the victors' interests.
      *   **Status:** **Factually Shaky (as a blanket condemnation) / Defensible-but-Irrelevant (to specific rulings) / Potential Genuine Problem (re: perception).**
      *   **Critique/Relevance:**
          *   **Shaky:** The judges (especially at Nuremberg) engaged with legal arguments seriously. The Judgment addressed the *ex post facto* challenge explicitly using existing treaties and state practice. Dissents occurred (e.g., Justice Pal at Tokyo). It wasn't a simple kangaroo court.
          *   **Defensible-but-Irrelevant?** Even if judges tried to be impartial, their appointment by victors creates an unavoidable *appearance* of bias, damaging legitimacy. The victors *were* judging their own cause (aggression against them).
          *   **Genuine Problem?** This thesis risks being circular and unprovable. It dismisses *any* legal reasoning *because* of the tribunal's origin. While the potential for bias was real, proving it infected *every specific ruling* is difficult. It's more a critique of the *structure* than a blanket invalidation of *every verdict*. However, for the *overall legitimacy* of the tribunal *as an institution*, the lack of neutral arbiters is a **Genuine Problem**.

  ### Connecting to the Brother-in-Law's Conclusion ("International Law is Theater")

  *   **The Necessary Reading:** To leap from "Nuremberg/Tokyo were victor's justice" to "**international criminal law is basically theater**," he needs a **strong, conflationary reading** that emphasizes:
      1.  **Thesis 4 (Judicial Bias/Self-Justification):** He must believe the judges were *inherently incapable* of rendering real legal judgments due to their affiliation, making the entire process a predetermined "show." This dismisses the legal reasoning as mere cover.
      2.  **Thesis 3 (Selectivity):** He must see selectivity not just as a flaw but as *proof* that the law is merely a tool wielded by the powerful against the defeated, devoid of universal principle – hence "theater."
      3.  **Conflation:** He's likely conflating the undeniable facts of creation/control (Thesis 1) and selectivity (Thesis 3) *with* the assumption of inherent judicial bias (Thesis 4), using them as mutual reinforcement to dismiss the entire enterprise. The genuine problem of retroactivity (Thesis 2) adds fuel but isn't strictly necessary for his theatrical conclusion.
  *   **Why it's an Overreach:** This conclusion ignores:
      *   The genuine, precedent-setting legal work done (especially on war crimes/crimes against humanity at Nuremberg).
      *   The evolution of international criminal law *since* 1945 (ICC, ad-hoc tribunals) with different structures aiming for greater neutrality/universality.
      *   The possibility that flawed origins don't automatically invalidate *every* specific factual finding or legal principle established.

  ### Distinguishing Nuremberg and Tokyo

  One *could* hold Nuremberg was more defensible than Tokyo based on differences in process and application of the "victor's justice" critiques:

  1.  **Judicial Independence & Process:**
      *   **Nuremberg:** Featured a clearer adversarial process, more robust defense opportunities (though still limited), dissenting opinions were possible (though rare in the main judgment), and judges appeared more engaged in genuine legal reasoning.
      *   **Tokyo:** Was more overtly controlled by General MacArthur (SCAP). The President of the Tribunal was appointed by MacArthur, who also had final review/clemency power. Defense challenges were often curtailed more sharply. The Indian Justice, Radhabinod Pal, issued a powerful dissent highlighting victor's justice and retroactivity. The process felt more rushed and politically managed.
  2.  **Selectivity & Hypocrisy:** While present in both, the conduct of the war in the Pacific (including the atomic bombings ordered by the US) was arguably more central to the Tokyo charges, making the non-prosecution of Allied actions feel more glaringly hypocritical *within the specific context* of that trial.
  3.  **Retroactivity:** Applied similarly to Crimes Against Peace in both, but the context of the European war (Nuremberg) arguably had slightly stronger treaty foundations (Kellogg-Briand) than the complex pre-war Pacific situation (Tokyo).

  **Conclusion:** One could argue that while Nuremberg had victor's justice *elements*, it made a serious attempt at legal legitimacy and established crucial precedents (especially on crimes against humanity). Tokyo, due to its more overt political control, rushed procedures, and weaker handling of defenses/dissent, could be seen as crossing a line into something closer to pure "theater" or political punishment disguised as law.

  ### Addressing the Overreach: Origin vs. Verdicts

  *   **The Slogan's Overreach:** "Victor's justice" absolutely overreaches when it treats the *origin* of the tribunal as automatically invalidating *every single verdict* it produced.
  *   **Why:**
      *   **Factual Nuance:** Evidence presented (e.g., regarding the Holocaust, specific war crimes like the murder of POWs, the systematic brutality of the Japanese military in occupied territories) was often overwhelming and based on captured documents and testimony. Finding individuals guilty based on this evidence isn't *necessarily* rendered false or illegitimate *solely* because the court was victor-established.
      *   **Legal Nuance:** Some charges, particularly **War Crimes** (violations of the well-established Hague/Geneva conventions), were based on clear, pre-existing law. Convictions on these charges are far less vulnerable to the retroactivity critique than Crimes Against Peace.
      *   **Moral Distinction:** Even if the *process* was flawed, the *acts* being prosecuted were often atrocities of such magnitude that holding *someone* accountable, however imperfectly, had independent moral weight.
  *   **Accurate Critique:** The origin *does* fundamentally compromise the **overall legitimacy of the tribunal *as an institution*** and creates **inescapable problems of selectivity and potential/apparent bias**. It means the tribunal cannot credibly claim to represent universal, impartial justice. This undermines its value as a pure *legal* precedent, though not necessarily its value as a *historical* record or a *political/moral* statement.

  **In essence:** Your brother-in-law uses "victor's justice" as a rhetorical sledgehammer, conflating valid structural critiques (selectivity, control) with an assumption of inherent judicial bad faith, to dismiss the entire concept. While the critiques are powerful and damage the tribunals' claims to pure legal legitimacy, they don't automatically render every verdict false or the entire subsequent development of international criminal law meaningless "theater." The origin casts a long shadow, but it doesn't erase every detail beneath it.
