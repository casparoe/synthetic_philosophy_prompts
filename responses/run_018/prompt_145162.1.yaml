  ### Diachronic Rationality Workshop: Money Pump Simulation  
  **Goal:** Make students experience the "squeeze" of a money pump through iterative trades, hidden costs, and preference inconsistencies.  

  ---

  ### **Setup & Materials**  
  - **Goods:** 3 abstract goods (e.g., **Stone**, **Feather**, **Coin**).  
  - **Cards:** 16 cards (6 Stone, 5 Feather, 5 Coin) randomly distributed.  
  - **Envelopes & Ranking Slips:** Each student writes their **private ranking** of the 3 goods (1st, 2nd, 3rd) and seals it in an envelope labeled *"Round-4 Self"*.  
  - **Scorecards:** Track points (no real money; scores = bragging rights + coffee vouchers for top 3).  
  - **Room Setup:** Casual seating with space to mingle. Whiteboard for tracking rounds.  

  ---

  ### **Rules & Point System**  
  **Key Mechanics:**  
  - **Pairwise Trades:** Each round, students see one *immediate bonus trade* (only one direction offered per round).  
  - **Consistency Tax:** If you end Round 3 holding your **starting good** after trading, lose 30 points.  
  - **Autonomy Penalty:** In Round 4, if you reject trading back to a **higher-ranked starting good** (per your envelope), lose 40 points.  
  - **Trade Bonuses:** +10 points per trade (irresistible short-term incentive).  

  **Scoring Breakdown:**  
  | Component | Points | Condition |  
  |-----------|--------|-----------|  
  | **Good Value** | 30/20/10 | Based on final held good (1st/2nd/3rd per sealed ranking) |  
  | **Trade Bonus** | +10 | Per trade accepted in Rounds 1–3 |  
  | **Consistency Tax** | –30 | If holding starting good *and* traded ≥1 time |  
  | **Autonomy Penalty** | –40 | If eligible to trade back in Round 4 but refuse |  
  | **Trade-Back Fee** | –15 | If you opt to trade back in Round 4 |  

  ---

  ### **Timeline (90 Minutes)**  
  1. **Intro & Setup (15 min)**  
     - Explain rules, goods, and scoring. Emphasize: *"Decisions are local, but costs compound."*  
     - Distribute goods, envelopes, and slips. Students **privately rank goods** (e.g., 1st: Stone, 2nd: Feather, 3rd: Coin) and seal envelopes.  

  2. **Trading Rounds (30 min total; 10 min/round)**  
     - Students mingle and trade with **anyone**. Instructor offers **one directional trade per round** (announced publicly):  
       - **Round 1:** Trade **Stone → Feather** for +10 points.  
       - **Round 2:** Trade **Feather → Coin** for +10 points.  
       - **Round 3:** Trade **Coin → Stone** for +10 points.  
     - *No future rounds revealed!* Students only see the current round’s offer.  

  3. **Round 4: Reckoning (15 min)**  
     - Students **open envelopes**, see initial rankings.  
     - **Rule:** If your starting good is **ranked higher** than your current good, you must:  
       - **Option A:** Trade back to starting good (pay 15 points), **OR**  
       - **Option B:** Reject and pay 40-point autonomy penalty.  
     - Instructor facilitates trades (students swap with neighbors or instructor’s "bank").  

  4. **Scoring & Debrief (30 min)**  
     - Calculate scores. Award coffee vouchers for top 3.  
     - Debrief structure:  
       | **Round** | **Local Rationality** | **Diachronic Irrationality** |  
       |-----------|------------------------|-------------------------------|  
       | 1–3 | "I gained +10 now!" | Failed to foresee cycling back to start + tax. |  
       | 4 | "I’ll keep my current good!" | Autonomy penalty for ignoring past self’s ranking. |  
       | **Net Effect** | Short-term bonuses feel rational | Consistency tax + penalties = net loss for most |  

  ---

  ### **What *Can’t* Be Staged in 90 Minutes**  
  - **Hyperbolic Discounting:** Real-world inconsistency involves emotional/time-based discounting (e.g., "I’ll quit coffee tomorrow"). This simulates logic, not visceral impulsivity.  
  - **Unbounded Cycles:** Real pumps can loop indefinitely; here, cycles are capped at 3 trades.  
  - **Strategic Collusion:** Students might team up to avoid penalties ("I’ll hold your Feather!"). Real pumps exploit *individual* inconsistency.  

  ---

  ### **Predictable Problems (and Fixes)**  
  1. **Problem:** Students refuse early trades (too sophisticated).  
     **Fix:** Emphasize *"No strategizing aloud!"* and remind them bonuses are "free points now."  

  2. **Problem:** Round 4 backlog (everyone wants to trade back).  
     **Fix:** Have students trade with neighbors first; use instructor as last-resort counterparty.  

  3. **Problem:** Ranking ambiguity (e.g., "I ranked Stone 1st but don’t mind Coin!").  
     **Fix:** Enforce strict adherence to sealed rankings: *"Your past self’s words are binding!"*  

  4. **Problem:** Point calculation chaos.  
     **Fix:** Use scorecards with pre-filled formulas (Google Sheet on a shared screen).  

  ---

  ### **Why This Works**  
  - **Shadow Envelope:** The sealed ranking forces confrontation with past preferences.  
  - **Consistency Tax:** Penalizes cycling without progress (like real transaction costs).  
  - **Autonomy Penalty:** Makes preference inconsistency *hurt*.  
  - **Economist/Philosopher Bridge:** Concrete trades (econ) + preference paradoxes (phil) = shared "aha!" moments.  

  **Final Tip:** Start debrief with student testimonials (*"Who felt pumped? Why?"*) before diving into theory. The misery of net-negative scores teaches more than any diagram!
