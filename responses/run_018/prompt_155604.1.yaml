  Hmm, the user is a student representative on an Interim Governance Committee at a residential school, facing a democratic boundary problem for an upcoming referendum. They need a memo recommending who should vote on a proposed Distributed Learning Compact that could change the school's residential character. 

  The core tension is between "synchronous subjection" (those currently experiencing the school's rules and authority) and "asynchronous affectedness" (those impacted by the decision but not presently enrolled). The user specifically asks me to engage with two arguments: the "dormancy objection" against alumni/future student voting, and the claim that parents deserve inclusion as "co-subjects" to institutional authority.

  I notice the user invites brutal honesty - if the framing is flawed, I should say so. But the boundary problem here feels valid: remote learning fundamentally alters a residential community's nature, so defining the demos is philosophically sound. The dormancy objection holds water too - alumni interests are real but temporally detached, while future students' interests exist only counterfactually. 

  Where I push back slightly is on parent inclusion. While they're financially and emotionally invested, they aren't subject to daily academic/disciplinary authority like students and faculty. Calling them "co-subjects" overreaches - their stake is real but indirect. The strongest case is actually for exchange students: though temporary, they're fully subjected to the policy during their residency.

  The memo should model intellectual integrity: recommend a clear franchise (current students + faculty), dismantle the dormancy objection carefully, then honestly acknowledge why parents have a plausible claim even if rejected. Implementation must be airtight - no ambiguity about voter eligibility dates.
answer: |-
  ## Memorandum: Franchise Recommendation for Distributed Learning Compact Referendum  
  **To:** Interim Governance Committee, Meridian Residential School  
  **From:** Senior Advisor, Democratic Theory & Institutional Ethics  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Franchise Rule for Binding Referendum  

  ### I. Recommendation  
  **Approve the following franchise rule with conditions:**  
  Voting rights shall be granted **exclusively to currently enrolled full-time students and full-time faculty** for the referendum on the Distributed Learning Compact.  

  **Implementation Timeline:**  
  - **By EOD Friday:** Finalize voter eligibility criteria (current enrollment/full-time status as of Oct 30, 2023).  
  - **Monday:** Circulate provisional voter list for verification.  
  - **Tuesday:** Close challenges to voter list; distribute referendum materials.  
  - **Wednesday:** Voting opens (72-hour window via secure platform).  
  - **Next Monday:** Results certified by Committee.  

  ### II. Core Reasoning: Synchronous Subjection Over Diachronic Claims  
  The dormancy objection correctly identifies a critical flaw in extending voting rights to alumni or future students: **"stake" alone cannot justify enfranchisement without present institutional subjection.**  

  - **Why dormancy matters:** Alumni hold *memories* of the school, and future students hold *expectations*, but neither group is presently subjected to the Compact’s authority. Granting them votes would fracture governance by empowering agents who experience neither immediate consequences nor accountability. Their interests are real but *asynchronous*—best channeled through advisory councils, not ballots.  
  - **Synchronous subjection is primary:** Faculty and students are uniquely *co-subjected* to the Compact’s operational reality: students under its educational/disciplinary terms, faculty implementing its pedagogy. This creates a shared deliberative community essential for legitimate self-governance.  
  - **Exchange students belong:** Despite brief tenure, they are fully subjected to the policy *during their residency*. Exclusion would render them governed without consent.  

  ### III. Addressing the Counter-Argument: Parents as Co-Subjects  
  The strongest opposing view—that parents are "co-subjects" due to financial/disciplinary entanglement—deserves serious engagement. Parents *are* profoundly affected and share liability for tuition and conduct outcomes. However:  
  - **Subjection ≠ affectedness:** While parents endure consequences, they do not inhabit the *institutional role* governed by the Compact. They are not disciplined by deans, graded by faculty, or bound by academic schedules. Their authority flows *through* the parent-student relationship, not the school’s direct governance.  
  - **Risk of factionalism:** Parents’ interests (e.g., cost reduction, convenience) may diverge from the pedagogical mission. Enfranchising them could distort the referendum into a proxy debate over tuition value versus educational integrity.  
  - **Alternative voice:** Parents’ stake warrants formal consultation (e.g., a parallel non-binding poll), not co-decision with those living under the policy daily.  

  ### IV. Best Consideration on the Losing Side  
  The argument for parental inclusion correctly exposes that **"affectedness" and "subjection" often overlap in institutional life**. Dismissing parents as mere "outsiders" underestimates their vulnerability to the school’s authority—especially financial penalties or disciplinary repercussions flowing from remote learning. A strict subjection test risks ignoring how institutional power radiates beyond campus.  

  ### V. Plain Pushback: Two Caveats  
  1. **Boundary Problem Validity:** Framing this through democratic theory is *not* a category mistake. The Compact alters the school’s foundational residential character, demanding a legitimation test for those governed by it.  
  2. **Dormancy Objection Nuance:** Your presentation slightly conflates alumni and future students. Future students hold *no* stake (only hypothetical interests), while alumni hold a *residual* stake. The objection remains coherent, but future students warrant stronger exclusion than alumni.  

  ### VI. Conclusion  
  Confine voting to those whose daily academic lives will be directly ruled by the Compact: current students and faculty. This respects the dormancy objection while honoring the primacy of synchronous subjection. Parents and alumni retain vital advisory roles, but binding authority must rest with the governed.  

  ---  
  **Senior Advisor’s Note:** This recommendation prioritizes institutional integrity over maximal inclusion. A school is not a state; its franchise derives from subjection to its pedagogical authority, not territorial residence or abstract stake. The dormancy objection protects against temporal overreach.
