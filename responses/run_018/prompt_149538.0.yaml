answer: |-
  ### Practice reconstructed (150 words)
  This social practice involves asymmetrical enforcement of conventional norms (e.g., tipping 20%, orderly queuing, obeying pedestrian lights) across locals and identifiable outsiders. Legally, all are equally subject to minimal rules (e.g., jaywalking fines), but **institutionally**, businesses frame norms as quasi-contractual ("shared commitments") for visitors via signage or implicit opt-in upon entry. **Informally**, locals treat norm-adherence as baseline respect, excusing local violations ("ignorance/urgency") while penalizing outsiders through social sanctions (reprimands, exclusion, service sabotage). The asymmetry lies in **moral attribution**: local breaches are contextual misfires; outsider breaches signify character deficits. Crucially, communities explicitly deny these norms’ universality, yet enforce them asymmetrically as binding on outsiders. This creates a dual system: locals operate under flexible conventions, while outsiders face rigid, moralized demands under threat of informal punishment.

  ### Implicit commitments reconstructed (500 words)
  The practice presupposes a **particularist, membership-dependent view of obligation**:
  1.  **Obligation:** Norms derive force from **tacit consent via presence**. Entering a community space constitutes agreement to its conventions ("opt-in"), binding outsiders contractually while locals inherit obligations via birth/cultural osmosis. This is not strict legal consent (no signature) but a *moralized* construct: presence implies assent to collective self-governance. Simultaneously, it treats norms as **expressions of collective autonomy** – respecting the community means deferring to its conventions as constitutive of its identity. Harm avoidance is secondary; jaywalking without cars harms no one, yet violation still disrespects the collective. Obligation is thus **relational and context-bound**, not universal.

  2.  **Membership:** Cultural belonging creates a **moral privilege**. Locals possess an implicit "membership card" granting: (a) interpretive authority (only locals can *truly* understand/appreciate the norm’s context), (b) defeasibility (local violations are excusable circumstances, not core disrespect), and (c) standing to enforce against outsiders. Outsiders lack this privilege; their presence is conditional on compliance, making their violations existential threats to the normative order. Membership isn't merely residency; it’s cultural fluency and perceived investment in the community.

  3.  **Normative Scope:** Norms are **non-universalizable cultural artifacts**. Communities explicitly deny their universal bindingness ("just *our* way"), yet enforce them *as if* universally binding *on entrants*. This reveals a **conditional universalism**: "If you are *here*, you *must* follow *our* rules as we interpret them." The scope is territorial and contingent, applying only within the community's physical/social space and only to those visibly "outside" the cultural fold.

  **Strict Presuppositions vs. Compatible Theories:**
  *   **Strictly Presupposed:** Tacit consent via presence (for outsiders); moral privilege of membership; non-universalizable norms enforced conditionally.
  *   **Compatible but Not Required:** A MacIntyrean "practice-internal goods" view fits well (norms sustain shared social goods like orderly service or trust, accessible only to participating members), making outsider violations corrosive to internal coherence. Scanlonian "reasonable rejectability" is *less* compatible, as locals deny outsiders standing to reasonably reject norms – their entry forecloses rejection. Rule-utilitarianism could license the asymmetry (efficiency gains from punishing "ignorant" outsiders), but the practice’s focus on *respect* over pure efficiency suggests deeper communitarian commitments.

  The core commitment is **normative particularism**: moral duties are fundamentally tied to specific relationships (member/non-member) and contexts (this community, these conventions), rejecting impartial universalism. The asymmetry arises because locals and outsiders occupy fundamentally different moral positions relative to the community’s self-defined norms.

  ### Cross-domain consistency (250 words)
  The implicit theory **applies consistently across domains** in its core structure (tacit consent + membership privilege), but **diverges in its auxiliary justifications**, revealing tension:
  *   **Tipping:** Most readily framed as a **quasi-contract**. Signage presents it as a "shared commitment" for fair service exchange. Outsider under-tipping is seen as reneging on an implied deal, harming workers (economic harm cited *post hoc*), while local under-tipping might be excused as forgetfulness. The harm claim is instrumental, not foundational.
  *   **Queueing:** Emphasizes **collective autonomy and coordination efficiency**. Enforcing strict queue norms maintains order and expresses respect for the shared project of fair waiting. Harm (delays, frustration) is more direct than in tipping, but the primary sanction (disapproval, exclusion) still targets the *disrespect* for the collective ritual, not just the inefficiency. Locals cutting might be "in a rush"; outsiders cutting are "selfish."
  *   **Jaywalking (no cars):** Least harm-based, most purely **symbolic of deference**. Obeying the empty-crossing signal showcases submission to collective authority. Harm avoidance is implausible; the norm *is* the respect. Local jaywalking is "pragmatic"; outsider jaywalking is "arrogant disregard."

  **Consistency:** All three domains rely on the core asymmetry: tacit consent via entry + membership excusing locals + moralizing outsider violations. **Divergence:** The practice opportunistically invokes *different secondary rationales* (contract, efficiency, symbolic deference) depending on the norm, suggesting its underlying philosophy is underdetermined regarding *why* these specific norms matter beyond collective self-assertion. A MacIntyrean view (sustaining internal goods of each practice) provides the most consistent auxiliary justification across domains.

  ### Replacement scenario (250 words)
  Under a **strict universalist harm-based framework** (obligations arise only from preventing harm to others, applying equally regardless of identity or location), the practice would require radical changes:

  1.  **Enforcement:** Informal sanctions (reprimands, service sabotage) based on identity would cease. Enforcement would require demonstrating **actual, non-speculative harm** (e.g., queue-jumping causing demonstrable delay; *not* jaywalking without cars). Locals and outsiders violating harm-based rules would face identical responses. "Respect" alone couldn't justify sanctions.

  2.  **Explanation:** Norms couldn't be presented as "our cultural commitments." Businesses couldn't imply contractual opt-in for tipping via entry; instead, they would need transparent pricing (e.g., service-inclusive) or justify tips solely via demonstrable worker benefit/harm avoidance (difficult beyond fair wages). Queueing/jaywalking norms would require justification based solely on preventing tangible harm (safety, efficiency), not cultural deference.

  3.  **Institutional Design:** Signage framing norms as territorial "shared commitments" would disappear. Institutions could only promote conventions *if* backed by clear, universal harm-reduction arguments applicable to all. Membership would lose moral relevance; "ignorance" or "personality" excuses for locals would apply equally to outsiders if circumstances were similar. The focus shifts from *who you are* and *where you are* to *what harm your action causes*.

  This would collapse the asymmetry. Norms like strict jaywalking enforcement without cars or rigid tipping percentages would likely vanish or become purely optional courtesies, lacking a universal harm rationale. Queueing norms might persist only where demonstrably efficient, enforced impartially based on action, not identity.

  ### Confidence and weakest point (150 words)
  **Confidence:** Moderately high (80%) in reconstructing the core implicit commitments (tacit consent for outsiders, moral privilege of membership, non-universal but territorial enforcement). The practice robustly signals these through its differential attribution and enforcement patterns.

  **Weakest Point:** Distinguishing between what the practice **strictly presupposes** versus what is merely **compatible** (like MacIntyre's internal goods) is the least certain claim. The practice doesn't *require* a thick communitarian ontology; it *could* function with a thinner, rule-utilitarian justification for asymmetry (efficiency gains from policing outsiders). However, the consistent *moralization* of outsider violations (character deficiency) strongly suggests a deeper commitment to membership-based moral standing beyond mere efficiency. Pinpointing whether the core presupposition is fundamentally contractual ("you agreed by entering") or communitarian ("you owe respect to *this* community's self-rule") remains ambiguous – the practice likely conflates both. This is the most philosophically underdetermined aspect.
