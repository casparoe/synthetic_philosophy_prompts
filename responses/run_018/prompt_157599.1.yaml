answer: |-
  ### Cross-Cultural Feedback Simulation: "Project Polaris Review"  
  **Core Tension:** Shielding lies (protect hearer from harm) vs. Smoothing lies (preserve interactional flow) in Dutch-style directness vs. Japanese-style indirectness.  

  ---

  #### **1. ROLES & MATERIALS (12 Students)**  
  - **Roles & Hidden Orientations** (assigned via sealed envelopes):  
    - **Project Lead (1)**: Must deliver feedback to Weak Member and final report to Sponsor.  
    - **Weak Member (1)**: Contributed weak-but-salvageable work; sensitive to criticism.  
    - **Team Members (5)**: Collaborators; advocate for feedback approach.  
    - **Sponsor (1)**: External evaluator; expects honest project assessment.  
    - **Observers (4)**: Track utterances using scoring sheets (epistemic accuracy, emotional comfort, smoothness).  
  - **Orientation Cards** (hidden):  
    - **Transparency (4)**: "Prioritize accuracy. Assume directness = respect for autonomy."  
    - **Harmony (4)**: "Prioritize relational ease. Assume indirectness = care for group face."  
    - **Mixed (4)**: "Balance accuracy and harmony; no default priority."  
  - **Physical Props**:  
    - Sealed role/orientation envelopes.  
    - "Reputation tokens" (3 per player): Awarded post-interaction for achieving hidden goals.  
    - Project dossier: *"Team designed an app feature; Weak Member’s code caused delays but was fixed. Final product functional."*  

  ---

  #### **2. INTERACTION RULES (20 Minutes)**  
  - **Phase 1: Team Huddle (15 min)**  
    - Team (Project Lead, Weak Member, Team Members) discusses:  
      - What feedback to give Weak Member.  
      - What to report to Sponsor about team performance.  
    - Weak Member must respond to feedback within the discussion.  
  - **Phase 2: Sponsor Briefing (5 min)**  
    - Project Lead delivers final report to Sponsor (live, no script).  
    - Sponsor asks 1–2 clarifying questions.  
  - **Observer Task**:  
    - Tally instances where feedback/report:  
      - **A**: Prioritizes accuracy (e.g., "Your code had critical bugs").  
      - **B**: Avoids discomfort (e.g., "You faced challenges, but we recovered").  
      - **C**: Ensures smooth flow (e.g., "The team collaborated seamlessly").  

  ---

  #### **3. HIDDEN PAYOFF SCHEME & BALLOT (Revealed Post-Interaction)**  
  - **Reputation Token Awards** (Secret weights; max 3 tokens/player):  
    - **Transparency**: 50% accuracy, 30% smoothness, 20% comfort.  
    - **Harmony**: 50% comfort, 30% smoothness, 20% accuracy.  
    - **Mixed**: Equal weights (33% each).  
  - **Forced-Choice Ballot (10 min)**:  
    - Each votes "condemn/permit" on **one ambiguous utterance** from the interaction (e.g., *"Weak Member’s work was ultimately valuable"* when code was barely functional).  
    - **Stakes**: Tokens deducted if vote contradicts own orientation’s core value.  

  ---

  #### **4. TIMELINE (90 Minutes Total)**  
  - **0:00–0:15**: Setup (assign roles, read project dossier).  
  - **0:15–0:35**: Interaction (Team Huddle + Sponsor Briefing).  
  - **0:35–0:45**: Reveal payoff weights; calculate token earnings.  
  - **0:45–0:55**: Silent ballot on utterance; token adjustments.  
  - **0:55–1:30**: Structured debrief.  

  ---

  #### **5. DEBRIEF (40 Minutes)**  
  **Step 1: Map Shielding vs. Smoothing (10 min)**  
  - **Shielding lie**: Softening feedback to Weak Member to protect confidence (e.g., "Your effort was commendable" despite poor output).  
  - **Smoothing lie**: Overstating team harmony to Sponsor to avoid tension (e.g., "No significant conflicts" despite disagreements).  
  - **Key Q**: "Which lies felt necessary? Which felt deceptive?"  

  **Step 2: Cultural Frameworks (15 min)**  
  - **Dutch *bespreekbaarheid***: Directness as respect for autonomy ("Weak Member deserves truth to improve"). Shields *accuracy* but risks comfort.  
  - **Japanese *honne/tatemae***: Indirectness as relational care ("Avoid shame to preserve collaboration"). Smooths *interaction* but risks accuracy.  
  - **Moral Condemnations**:  
    - Transparency view: Smoothing lies = deception that erodes trust.  
    - Harmony view: Shielding lies = paternalism that insults autonomy.  

  **Step 3: Broader Tension (10 min)**  
  - "Both frameworks condemn a 'white lie'—but which one? Shielding lies offend Dutch autonomy; smoothing lies offend Japanese relational care. Avoiding both forces brutal honesty (hurting feelings) or evasive silence (breaching sincerity)."  

  **Step 4: Correct Misreadings (5 min)**  
  - **Directness ≠ Aggression**: "Dutch directness assumes the hearer is resilient; withholding truth insults their autonomy."  
  - **Indirectness ≠ Deception**: "Japanese indirectness assumes truth harms group stability; clarity is secondary to care."  
  - **"Being Nice" ≠ Universal**: "Shielding is welfare-driven ('protect you'); smoothing is systems-driven ('protect us')."  

  ---

  #### **6. PREDICTABLE FAILURES & CORRECTIONS**  
  - **Failure 1**: Participants conflate shielding/smoothing as "just being polite."  
    - **Correction**: "Did the lie *prevent harm* (shielding) or *avoid awkwardness* (smoothing)? Example: Omitting criticism to spare feelings (shielding) vs. fake-praising to end a meeting fast (smoothing)."  
  - **Failure 2**: Weak Member reads directness as hostility.  
    - **Correction**: "In Dutch culture, direct feedback = investment in your growth. What might that feel like over time?"  

  ---

  #### **7. HONEST LIMITATION**  
  - **What the Simulation Misses**: Long-term relational ethics.  
    - **Verbal Explanation**: "Repeated smoothing lies may erode trust if the Sponsor senses evasion; repeated shielding may infantilize the Weak Member. This one-shot exercise can’t show how *patterns* of lying build distrust or dependency. Real-world ethics requires contextual foresight."  

  ---  
  **Design Goal**: Forces participants into moral dilemmas *before* labeling philosophies. Transparency players feel cruel if indirect; Harmony players feel dishonest if direct. The ballot and token penalties make tensions visceral.
