answer: |-
  ## DEPARTMENT OF CIVIC VIRTUE  
  **OFFICE OF VOLITIONAL HARMONIZATION**  
  **CIVIC INTENTION STIPEND (CIS) PROGRAM FAQ**  
  **(Revision 7.3.2b, Effective Fiscal Year Q3)**

  **1. What is the Civic Intention Stipend (CIS)?**
  The Civic Intention Stipend (CIS) is a federally administered initiative designed to recognize and materially reward the formation of a *sincere and verified intention* by eligible citizens to undertake a designated Necessary But Unpleasant Civic Task (NBUCT). Upon successful verification of this intention, the participant receives a substantial, one-time, non-taxable stipend. Crucially, the participant is simultaneously and contractually released from any obligation to *physically execute* the intended NBUCT.

  **2. What constitutes a "Necessary But Unpleasant Civic Task" (NBUCT)?**
  NBUCTs are pre-defined tasks vital to societal function yet characterized by high disutility scores as per Schedule D-7 (Disutility Matrix). Examples include, but are not limited to: Municipal Sewer System Maintenance (Tier 1), Long-Term Hazardous Waste Monitoring (Tier 2), Extended Public Transit Sanitization Duty (Tier 3), and High-Volume Paperwork Processing (Tier 4). The full NBUCT Catalog (Form OVH-114) is available online or at your Regional Verification Hub.

  **3. Who is eligible to apply for the CIS?**
  Citizens aged 18-65 possessing valid Class-B Civic Standing or higher are eligible. Exclusions apply to individuals currently serving mandatory civic sentences, those with unresolved Intentionality Violations on record (IV-Codes 3-7), or persons designated as "Chronic Over-Actualizers" (COA Status). A preliminary eligibility screening is conducted via Form OVH-22a.

  **4. How does one "form and verify" a sincere intention?**
  Applicants must select a specific NBUCT from the Catalog. They then undergo a multi-stage verification process at a Certified Intention Verification Hub (CIVH). This process includes:
      a.   **Cognitive Declaration:** Formal declaration of intent under oath (Form OVH-55).
      b.   **Dispositional Assessment:** Standardized psychometric profiling measuring resolve alignment and aversion tolerance (OVH Protocol 8-K).
      c.   **Counterfactual Simulation:** Immersive scenario testing within a controlled environment simulating NBUCT conditions, monitored for authentic negative affective response *and* simultaneous cognitive commitment to the *idea* of undertaking the task.
      d.   **Final Attestation:** Affirmation of current sincere intention and understanding of non-obligation clause (Form OVH-99b).

  **5. Why reward an intention that will never be acted upon?**
  The CIS operates on the principle established by leading behavioral economists: the sincere formation of intention towards a high-disutility NBUCT represents a distinct cognitive and volitional achievement with inherent civic value. As Dr. Alva K. Merton, Senior Behavioral Architect for OVH, states: "The decision-theoretic consistency required to *genuinely* commit mentally to an action one *knows* one will not perform, precisely *because* of its disutility, demonstrates a rare purity of intentional calibration. This calibrated state, independent of messy physical execution, is the target commodity. Monetizing this purified resolve optimizes societal utility by rewarding the difficult mental work while efficiently outsourcing the physical labor through conventional mechanisms." The stipend compensates for the cognitive burden of forming this verified intention.

  **6. Isn't this just paying people to *think* about doing something unpleasant?**
  The CIS compensates for the verified *achievement* of a specific, high-fidelity intentional state regarding an NBUCT, not casual contemplation. The verification process ensures the intention meets the Program's rigorous sincerity and dispositional alignment standards. The distinction between baseline cognition and verified CIS-grade intention is significant and quantifiable per OVH Protocol 8-K.

  **7. How is the stipend amount determined?**
  Stipend amounts are calculated using the Official Disutility Index (ODI) assigned to the selected NBUCT, multiplied by the Base Civic Intention Value (BCIV), adjusted for regional cost-of-intention factors and the applicant's verified Dispositional Resilience Score (DRS) obtained during assessment. Higher disutility and lower resilience generally correlate with higher stipends, reflecting the greater cognitive effort required. Current BCIV is set at $15,000 (non-adjusted).

  **8. What happens after I receive the stipend? Am I monitored?**
  Upon successful verification and stipend disbursement (via direct deposit to your registered Civic Virtue Account, CVA), your contractual obligation to the CIS program is fulfilled. You incur no further obligation regarding the NBUCT. Physical execution monitoring falls outside the CIS purview and is handled by relevant operational departments (e.g., Sewer Maintenance Corps). CIS post-disbursement monitoring is limited to standard financial compliance audits for fraud prevention (OVH Regulation 12-F). We do not track whether you experience relief or guilt.

  **9. I understand I'm not obligated to perform the task. However, I find myself experiencing anxiety about the idea that, in some *other* possible scenario or version of myself, I *might* have actually done it. This causes "counterfactual regret." Does the CIS address this?**
  The phenomenon you describe, termed "Modal Performance Anxiety" (MPA) or colloquially "counterfactual regret" (CR-1 through CR-4 per DSM-CV), is an acknowledged potential psychological side-effect of intense counterfactual ideation. The CIS Program officially classifies MPA as an *extrinsic personal cognitive state* unrelated to the core contractual requirement: the formation and verification of the *actual-world* sincere intention at the *specific time* of assessment. The Program takes no stance on the validity or management of modal uncertainties (i.e., contemplating actions in non-actual possible worlds). Your verified intention *in this world* met the program criteria; your stipend was earned. Concerns regarding MPA should be directed to personal cognitive wellness providers, not OVH support channels. Dr. Merton notes: "Regret over unrealized possibilities is orthogonal to the decision-theoretic purity of the verified *actual* intention at time T. The contract concerns T, not T'."

  **10. Couldn't someone fake the intention just to get the money?**
  The verification protocols (OVH Protocol 8-K) are specifically designed to detect performative or insincere declarations of intent ("Intentionality Mimicry"). The multi-modal assessment, particularly the physiological and affective monitoring during Counterfactual Simulation, has a demonstrated 98.7% accuracy rate in distinguishing CIS-grade sincere intention from strategic deception (See OVH Internal Audit R-774, redacted version available under FOIA-CV). Fraudulent applications constitute a Tier 3 Civic Infraction and are subject to severe financial penalties and potential IV-Code designation.

  **11. Where can I apply?**
  Applications initiate online via the Civic Virtue Portal (portal.civvirt.gov/cis) using your CVA credentials. Following preliminary screening (Form OVH-22a), eligible applicants will be scheduled for in-person verification at their nearest Certified Intention Verification Hub (CIVH). A list of CIVHs is available on the portal.

  **12. Who designed this program?**
  The CIS framework was developed by the Office of Volitional Harmonization (OVH) based on foundational research in decision theory and behavioral economics. Key theoretical validation was provided by the OVH Behavioral Architecture Group, led by Dr. Alva K. Merton, whose work on "Decoupled Intentionality Markets" forms the core economic model. Program implementation adheres strictly to the Civic Intention Monetization Act (CIMA) of [Current Year - 5].

  **// END FAQ //**  
  *For further inquiries not covered above, submit Form OVH-87 "Clarification Request: Intentional States" via the Civic Virtue Portal. Average processing time: 45 working days.*
