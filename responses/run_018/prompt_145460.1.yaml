  Hmm, the user seems to be a philosopher or advanced ethics student—probably working on moral theory boundaries. The formal phrasing suggests academic rigor is crucial here. They might be developing a new framework or critiquing existing ones. The emphasis on "desiderata not defense" means they want pure requirements, not justifications. Underlying needs likely include: clarity on moral demandingness, reconciling excellence with human limitations, and preventing theory collapse into extremes like fanaticism or subjectivism.

  For (a), I need to address the "Good Life vs. Good Agent" paradox. The core issue is that moral and prudential values aren't reducible to each other but must coexist. The non-negotiable point is that neither sphere can be fully subordinate. This probably hits virtue ethics hardest because their eudaimonia ideal often blurs the lines. 

  Moving to (b)—supererogation thresholds. The key is defining when "extra" becomes required without infinite demands. The non-negotiable ceiling prevents moral annihilation. Deontology struggles most since they already frame duties as strict. 

  For (c), the remainder problem... even after doing everything, moral considerations linger. How? The non-negotiable is that residue persists and requires weighting. Consequentialism falters here because maximal utility would leave no residue. 

  On (d), psychological stability—can someone be selflessly moral without losing their self? The non-negotiable is autonomy preservation. Virtue ethics might handle this best, but still strain at limit cases. 

  Finally (e), distinguishing saints from altruists or masochists. Need a non-negotiable "integrity filter." Consequentialist efficiency metrics fail to capture the qualitative difference in motivation. 

  Biggest cross-theory challenge? Probably the remainder problem—it exposes how most systems can't handle "moral surplus." Also noting how the components interconnect: (a) and (d) both deal with agency preservation, while (b) and (c) address demand structures. User definitely wants systemic coherence, not just bullet points. Better emphasize those links in the response.
answer: |-
  ## Full Specification: Theory of Moral Sainthood as Limit Case

  **Core Desiderata:** An adequate theory of moral sainthood (conceived as the asymptotic limit of moral development, not a discrete category) must coherently integrate the demands of maximal moral responsiveness with the realities of finite agency within a human life. It must specify the structure, limits, and experiential contours of this limit state without collapsing into incoherence, pathological demand, or descriptive inadequacy.

  **(a) Distinction Preservation: Moral Responsiveness vs. Life Goodness**
  *   **Conceptual Distinction/Case:** The "Good Life vs. Good Agent" Paradox. A person might fulfill every conceivable moral demand (maximal responsiveness to moral reasons - MR) yet lead a life devoid of personal meaning, relationships, or flourishing (not maximally good *for* that life - GL). Conversely, a life rich in personal flourishing might fall short of maximal moral responsiveness (e.g., prioritizing family over global need).
  *   **Desideratum:**
      *   **Non-Negotiable:** The theory must preserve the conceptual independence of *maximal responsiveness to moral reasons (MR)* and *maximal goodness-for-a-life (GL)*. Neither can be reduced to a subset of the other, nor can their potential divergence be explained away solely by subjective preference or contingent psychological facts.
      *   **Non-Negotiable:** The theory must account for the potential *tragic tension* between MR and GL without denying the objective normative force of either domain.
  *   **Most Damaging Desideratum:** **Preserving the objective normative independence of GL.** This directly challenges consequentialism's tendency to absorb GL into aggregate good (e.g., maximizing utility *is* the good life), virtue ethics' strong link between virtue and eudaimonia (making tension hard to conceive at the limit), and deontology's potential to subordinate GL entirely to duty-fulfillment.

  **(b) Supererogation Threshold & Moral Ceiling**
  *   **Conceptual Distinction/Case:** The "Collapsing Altruism" Threshold. At what point does the cost to the agent (life, autonomy, basic well-being) of performing an otherwise supererogatory act become so severe that demanding it transforms the act from praiseworthy extra to obligatory minimum? Is there a conceptual point where morality *cannot* demand more, regardless of unmet need?
  *   **Desideratum:**
      *   **Non-Negotiable:** The theory must provide *principled boundary conditions* (not merely empirical observations about human limits) under which supererogatory acts become obligatory. This involves defining the threshold where cost-to-agent negates supererogatory status.
      *   **Negotiable:** Whether a *conceptual ceiling* on moral demand exists (e.g., based on agent integrity, fundamental interests) or if the ceiling is solely *psychologically necessary* (demands exceeding human capacity become incoherent commands). The theory must take a stance.
  *   **Most Damaging Desideratum:** **Establishing principled boundary conditions for supererogation-to-obligation.** This is devastating for standard act-consequentialism (which often lacks robust supererogation and tends toward demandingness), challenges deontology's strict duty/supererogation divide (requiring nuanced agent-relative costs), and pressures virtue ethics to define limits of virtue beyond which action becomes destructive rather than excellent.

  **(c) The Remainder Problem: Normative Force After Fulfillment**
  *   **Conceptual Distinction/Case:** The "Unquenched Demand" Scenario. Imagine an agent who has fulfilled every identifiable moral obligation and supererogatory demand relevant to their context (reached the limit). Does the *unmet moral need* that persists (e.g., distant suffering, unrealized ideals) retain any normative force *for this agent*? How is this "remainder" weighted compared to their completed obligations and potential GL pursuits?
  *   **Desideratum:**
      *   **Non-Negotiable:** The theory must address whether moral considerations retain *any* normative force after maximal fulfillment of obligations and supererogatory acts. Denying any force risks moral complacency; affirming unbounded force annihilates GL.
      *   **Non-Negotiable:** If force remains, the theory must specify *how this remainder is weighted* against (a) the agent's completed moral requirements and (b) non-moral (GL) reasons. This weighting mechanism must avoid infinite regress and preserve agency.
  *   **Most Damaging Desideratum:** **Affirming normative remainder and specifying its weighting.** This is profoundly difficult for consequentialism (maximization achieved = no remainder?), deontology (duties fulfilled = no residue?), and virtue ethics (excellence achieved = no lack?). All must grapple with the idea that moral perfection doesn't negate the *existence* or potential *pull* of unmet moral value.

  **(d) Psychological Boundary Conditions: Agency & Sustainability**
  *   **Conceptual Distinction/Case:** The "Eroded Self" Dilemma. Can an agent sustain maximal other-regarding behavior indefinitely without their autonomous agency (sense of self, personal projects, independent judgment) being compromised? Or does such focus inevitably lead to motivational depletion, loss of identity, or heteronomy (being ruled by external demand)?
  *   **Desideratum:**
      *   **Non-Negotiable:** The theory must specify whether stable, integrated *autonomous agency* is compatible with sustained maximal other-regarding motivation as the limit is approached. If erosion is possible, is it contingent or necessary?
      *   **Negotiable:** The specific *mediating structures* required for compatibility (e.g., specific virtues like self-respect and integrity, institutional supports, relational frameworks, temporal rhythms integrating self/other focus). The theory must permit *some* viable structures.
  *   **Most Damaging Desideratum:** **Requiring compatibility with stable autonomous agency.** This directly challenges consequentialist models potentially indifferent to agent integrity if it maximizes good, deontological models emphasizing duty over self-constitution, and virtue ethics models where extreme self-abnegation might be misconstrued as a virtue. All must ensure the saint remains an *agent*, not a tool.

  **(e) Distinction from Pathologies & Efficiency: Genuine Sainthood**
  *   **Conceptual Distinction/Case:** The "Motivational Trilemma." Distinguish: (1) The genuine saint (motivated by intrinsic moral value, integrity, perhaps love), (2) The pathological self-sacrificer (motivated by guilt, compulsion, self-hatred, seeking annihilation), (3) The merely efficient altruist (motivated by impartial optimization, possibly with emotional detachment or self-interest).
  *   **Desideratum:**
      *   **Non-Negotiable:** The theory must provide criteria distinguishing genuine moral sainthood from **pathological self-sacrifice** (e.g., based on motivational structure, psychological integration, relationship to self-worth).
      *   **Non-Negotiable:** The theory must provide criteria distinguishing genuine moral sainthood from **merely efficient altruism** (e.g., based on the qualitative nature of regard for others, the integration of reason and affect, the presence of non-instrumental valuing).
  *   **Most Damaging Desideratum:** **The "Integrity Filter" (distinguishing from pathology).** This is hardest for consequentialism (which may value outcomes over internal pathology) and deontology (which focuses on acts/rules, not psychological health). Virtue ethics has resources but must rigorously define healthy vs. unhealthy expression of virtues like selflessness. All must confront the potential for morality to become pathological at its extreme.

  **Interrelations Summary:**
  *   (a) & (d) are deeply linked: Preserving GL requires protecting agency and psychological health.
  *   (b) & (c) are linked: Defining the ceiling (b) shapes the scope of the remainder (c).
  *   (e) relies on (a), (d), and the structure of motivation implied by (b) & (c): Genuine sainthood requires the right relationship between MR, GL, sustainable agency, and authentic motivation.
  *   The tension between MR and GL ((a)) underlies the need for a ceiling ((b)), shapes the nature of the remainder ((c)), constrains sustainable agency ((d)), and helps distinguish genuine sainthood from pathology/efficiency ((e)).

  **Primary Weight:** This specification prioritizes the *structural coherence* of the limit concept itself, demanding clear boundaries (b, e), resolution of internal tensions (a, c), and compatibility with the fundamental conditions of human agency (d). The scoring against traditions highlights where existing frameworks struggle most profoundly to meet these necessary criteria for an adequate theory of the moral limit.
