  ### Death in Damascus Paradox Role-Play: Game Design  
  **Goal**: Immerse students in the indexical, self-defeating nature of the Death in Damascus paradox. Avoid upfront theory; reveal the logical structure through gameplay and debrief.  

  ---

  #### **Roles & Setup**  
  - **12 Participants**:  
    - **6 Travelers**: Start in "Antioch" (home city). Each draws a secret destination card (Aleppo, Baghdad, Cairo, Damascus, or Ephesus). Cards are shuffled; only 1 is Damascus (unknown to others).  
    - **6 Oracle-Messengers**: Each receives 1 sealed rule envelope (see *Timeline*). They observe travelers, reveal rules when triggered, and enforce mechanics.  
  - **Materials**:  
    - Map: 5 cities connected bidirectionally (Antioch → Aleppo/Baghdad/Cairo; Aleppo → Damascus; Baghdad → Damascus; Cairo → Ephesus → Damascus).  
    - Tokens for travelers to mark locations.  
    - Point tokens (coins/stickers).  

  #### **Timeline** (75 mins total)  
  1. **Setup (5 mins)**:  
     - Assign roles. Travelers draw destination cards (keep secret). All start in Antioch.  
     - Explain: *"Earn points by reaching cities. Survive = 10 bonus points. Avoid Damascus!"*  

  2. **Game Rounds (60 mins; 6 rounds × 10 mins each)**:  
     - **Each Round**:  
       - Travelers announce intended destination (publicly or to their Oracle-Messenger).  
       - Oracle-Messengers reveal **one rule** per round (in order). Rules escalate ambiguity:  
         - **Round 1**: *"Death awaits in Damascus on the final day."*  
         - **Round 2**: *"The prophecy is indexical: it points to the place you actively avoid."*  
         - **Round 3**: *"If you take explicit action to avoid Damascus, all other exits close. Only Damascus remains open."*  
         - **Round 4**: *"Explicit avoidance = choosing a non-Damascus route when Damascus is accessible from your location."*  
         - **Round 5**: *"Once avoidance is triggered, the curse lasts until Damascus."*  
         - **Round 6**: *"Final moves. Death strikes in Damascus at sunset."*  
       - **Mechanics Backfire**:  
         - If a traveler in city X (with Damascus access) chooses *any* non-Damascus destination, their Oracle-Messenger announces: *"The paths reshape! From X, only Damascus remains."*  
         - The traveler **must** go to Damascus next round (no other options).  
       - **Movement & Points**:  
         - Successfully enter a city = 1 point (recorded by Oracle-Messenger).  
         - Survive (not in Damascus at end) = 10 points.  
         - *Exception*: If avoidance is triggered in Round 6, the traveler is teleported to Damascus (0 points for that move; lose survival bonus).  

  3. **End Game (5 mins)**:  
     - Calculate points: 1 per city visited + 10 for survival.  
     - All in Damascus lose survival bonus. Declare "winners" (likely 0 survivors).  

  ---

  #### **Debrief (15 mins)**  
  - **Key Questions**:  
    - *"How did your strategy change after hearing the prophecy?"*  
    - *"Did avoiding Damascus feel voluntary? What happened when you tried?"*  
    - *"If you avoided triggering the curse, how?"* (Rare; e.g., never in a city with Damascus access).  
  - **Map to the Paradox**:  
    - **Indexicality**: The prophecy "points" to your avoidance. Mechanics force Damascus as the only option *because* you acted to evade it.  
    - **Self-Defeating Belief**: Choosing to avoid reshapes your option space (closing exits). Your belief in the prophecy causes its fulfillment.  
    - **Fatalism vs. Agency**: Unlike generic fatalism ("you can’t change fate"), here your *choices* trigger doom. Avoidance = self-sabotage.  
  - **Limitations of the Game**:  
    - **Counterfactual Stability (verbally explain)**: *"In the original paradox, Death would’ve been in Damascus regardless of your choice. The game can’t model this ‘fixed future’—our mechanics only activate if you avoid. Real fatalism is deeper: even doing nothing might kill you."*  
    - **Probability & Uncertainty**: Real prophecies involve doubt. Our game makes rules explicit, removing doubt’s role.  

  ---

  #### **Predictable First-Run Issues**  
  1. **Blame & Frustration**:  
     - Travelers will blame "unfair" rules when avoidance backfires. *Use this!* Debrief: *"Your anger mirrors the paradox—rational choices breed irrational outcomes."*  
  2. **Early Solvers**:  
     - 1–2 players may deduce the trick by Round 3 (e.g., "avoidance triggers Damascus"). Mitigate by:  
       - Secret destination cards (distracts with personal goals).  
       - Points incentivize "gaming" the system (e.g., triggering curse late for extra cities).  
  3. **Messenger Errors**:  
     - Oracles might forget to close paths. Assign a "referee" (you) to oversee.  
  4. **Passive Players**:  
     - Some might never move to cities with Damascus access. *This is fine*—they’ll survive but score low. Highlight in debrief: *"Inaction avoids the curse but at what opporunity cost?"*  

  ---

  **Why It Works**:  
  - **Mechanics Mirror Logic**: Avoidance literally closes paths, embodying "belief shapes option space."  
  - **Indexical Twist**: Rules tie the prophecy to the player’s *own* avoidance (not a fixed city).  
  - **Emotional Payoff**: Points make choices feel consequential; losing the survival bonus stings.  

  **Adjust on the Fly**: If players solve it too fast, add "rumor tokens" (false prophecies) to create doubt.
