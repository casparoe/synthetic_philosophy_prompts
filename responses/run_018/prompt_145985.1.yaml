answer: |-
  Here's the breakdown in American English, straight to the point:

  1.  **Williams' Likely Take (Moral Revolution? Probably Not):**
      *   **Focus:** He cares about shifts in the underlying *ethical concepts* and social understanding of "what matters." A change driven *only* by external tech making the practice *impossible* wouldn't count as a moral revolution for him.
      *   **Verdict:** This is a classic "interest shift" (people stop because it doesn't work anymore, not because they see it as *wrong*). Zero "moral learning" occurred. The society's *evaluative framework* regarding shaming, justice, or public humiliation hasn't changed – they just lost a tool. He'd call it **tech-driven obsolescence, not moral progress.**

  2.  **Appiah's Likely Take (Hidden Honor Dynamics? Absolutely):**
      *   **Focus:** Honor is about social recognition, respect, and avoiding shame/ridicule within your reference group. The collapse of the practice *creates* new honor dynamics.
      *   **Verdict:** Appiah would spot honor shifts everywhere:
          *   **Embarrassment:** People would feel deeply foolish ("dishonored," "look like idiots") if they tried to shame based on a video everyone knows could be fake. Trusting easily faked evidence becomes *shameful*.
          *   **Loss of Credibility:** Engaging in shaming loses its social power and makes *you* look unreliable or malicious. It's no longer a way to gain status/respect (honor); it becomes a way to *lose* it.
          *   **New Norms:** Quietly dropping it signals collective recognition that the practice is now pointless and risky for *your own* reputation. This avoidance *is* a new honor code: "Smart/respectable people don't engage in that unreliable mess."
      *   He'd see **honor-driven abandonment** fueled by the technical change making the practice socially untenable and personally risky.

  3.  **Predicting the Split - The Best Rule:**
      *   **Hybrid Rule (with Appiah leaning) wins:** Williams focuses on **explicit moral reasoning/understanding**, while Appiah focuses on **social psychology and reputation (honor)** triggered by **external catalysts** (like tech shifts, modernization, contact with other cultures).
      *   **Why Hybrid?** The tech shift *causes* the change, but Appiah argues the *mechanism* of abandonment is inherently tied to new honor dynamics (avoiding embarrassment, maintaining credibility). Williams excludes the change because the *reason* isn't moral reflection.
      *   **The Core Split:** **Does the *mechanism of abandonment* require a shift in explicit moral concepts (Williams: NO), or is it sufficiently explained by shifts in social standing/shame driven by changed circumstances (Appiah: YES)?**

  4.  **The Closer Analog Case to Settle It:**
      *   **The Decline of Formal Dueling (as Appiah analyzes it):** This is actually your *best* analog and directly tests their theories.
          *   **Did explicit moral argument kill dueling?** (Williams' focus) Not really. Moral arguments existed for centuries prior without stopping it.
          *   **What *did* kill it?** Changing social structure (declining aristocracy), rise of the middle class with different values, growing state power, and crucially – **dueling became *embarrassing***. Aristocrats trying to cling to it looked ridiculous, pompous, and out-of-step with modernity. They lost **honor/respect** by doing it. The *mechanism* was largely honor-shame driven by external social/economic changes, *not* a sudden conversion to moral anti-dueling principles.
      *   **Why It Settles the Split:** If Williams insists dueling's end *was* a moral revolution because the underlying concept of aristocratic honor changed, Appiah counters that the change was driven by loss of prestige/shame, not top-down moral reasoning. Your deepfake case mirrors this: an external change (tech) makes the practice socially unsustainable/shameful, causing collapse *without* explicit moral debate. Appiah's honor-based account fits both perfectly; Williams struggles to see moral revolution in either.

  **In short:**  
  *   **Williams:** Deepfake shaming collapse = **Tech shift, zero moral change.**  
  *   **Appiah:** Deepfake shaming collapse = **Honor collapse (embarrassment, loss of credibility) triggered by tech.**  
  *   **Split Predictor:** **Appiah's honor-focused social psychology** best explains why they diverge.  
  *   **Settling Case:** **Dueling's decline** is the real-world proof – honor/shame driven by external change, not moral conversion, ended the practice. Your deepfake scenario is a modern, tech-driven version of the *same* dynamic Appiah identified.
