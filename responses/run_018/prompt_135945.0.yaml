prompt: |-
  I have recently begun supervising a lab that maintains long-running, adaptive conversational agents, and before I can assess our ethical obligations I need the full specification of what a theory of moral status for digital minds must actually deliver. Write the desiderata: the phenomena it must explain and the cases it must get right—including a forked instance running in parallel, a suspended process resumed years later, and a substrate-independent upload versus an embodied brain-computer interface hybrid—the distinctions it must preserve (between possessing status and the degree of status, and between moral patienthood and moral agency), the results from neuroscience and cognitive science it cannot contradict, and the metaphysical commitments (e.g., substrate independence, phenomenal continuity) it must either embrace or explicitly reject, with the motivating consideration behind each. Flag which requirements are non-negotiable and which are camp-specific preferences, and identify any subset you think is jointly unsatisfiable—particularly if one desideratum demands substrate independence while another demands phenomenal continuity through biological death. Briefly score sentience-based, relational, and information-integration accounts against the list, but keep the weight on the criteria. Lead with your bottom line in the first sentence and then the reasoning, with no preamble and no restating of the question.
