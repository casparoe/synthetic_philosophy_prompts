prompt: |-
  I serve as the philosopher-ethicist on a clinical ethics committee at a tertiary-care hospital, and we convene twice monthly for 45-minute reviews of cases in which a patient's prior documented preferences conflict with their current expressed preferences following profound cognitive alteration—typically advanced dementia, severe traumatic brain injury, or prolonged dissociative states. The committee includes the attending physician, a chaplain, a legal advisor, and a patient advocate; my deliverable must be a recommendation signed off by the physician and legal advisor, not an open-ended philosophical opinion. I want to operationalize the Buddhist principle of anattā—specifically, the denial of a permanent, unitary, metaphysically substantial self underlying mental continuity—into a reusable decision procedure for these reviews. The procedure must not smuggle in a Western essentialist or narrative-identity model of the person, yet it must yield actionable guidance for clinicians who are not Buddhists.

  Write a step-by-step procedure the committee can actually run in sequence, with each step stating: the precise question to ask; what counts as a sufficient factual answer versus what requires a normative judgment; whether the step terminates with a procedural recommendation or hands the decision to human sign-off because the issue is one of values rather than metaphysics; and the specific misfire the step is designed to catch (for example, conflating continuity of consciousness with continuity of autobiographical narrative). The procedure must explicitly distinguish three analytical axes: (1) present suffering versus anticipated suffering for a putative "future self"; (2) internal psychological continuity versus socially recognized relational identity; and (3) the authority of a past mental state over a present mental state when no enduring substrate connects them.

  Apply the procedure to three cases:
  1. A patient with advanced Alzheimer's who previously executed a directive refusing artificial nutrition, but who now actively seeks food, makes eye contact during feeding, and shows no signs of distress.
  2. A patient with severe frontal-lobe injury who has lost all autobiographical memory but retains emotional recognition of family members; the family demands aggressive life-sustaining treatment on the grounds that "this is not who he really is," invoking a core self that survives the injury.
  3. A patient with dissociative identity disorder in which one alter authored an advance directive refusing certain interventions, while other alters currently reject that directive and request them; no single state has continuous access to the memories or preferences of the others.

  Include at least one case in which the procedure yields a recommendation that runs directly against standard clinical intuition—such as recommending that a clear prior directive not be honored. Then state explicitly what the procedure cannot settle, particularly where Buddhist metaphysical commitments about impermanence and non-self are genuinely incommensurable with Western bioethical frameworks centered on autonomy and personal identity over time.

  In your response, separate what is philosophically settled about anattā—such as the rejection of an ātman or permanent soul—from what remains genuinely contested among scholars of Buddhist philosophy and personal identity theory, including debates over whether anattā entails a reductionist, narrative, or relational account of conventional selfhood. Do not present any contested interpretation as the consensus view.
reasoning: |-
  We are designing a decision procedure based on the Buddhist principle of anattā (non-self) for clinical ethics committees. The procedure must avoid Western essentialist or narrative-identity models and yield actionable guidance. We focus on three axes:
  1. Present suffering vs. anticipated suffering for a putative "future self"
  2. Internal psychological continuity vs. socially recognized relational identity
  3. Authority of a past mental state over a present mental state without an enduring substrate

  The procedure will consist of step-by-step questions. For each step, we specify:
  - The precise question
  - What counts as a sufficient factual answer vs. normative judgment
  - Whether it terminates with a recommendation or hands off for human sign-off (due to values)
  - The specific misfire it is designed to catch

  We then apply the procedure to three cases and note when it goes against standard intuition. Finally, we note the limitations and the settled vs. contested aspects of anattā.

  ---

  **Operationalized Anattā-Based Decision Procedure**

  **Preliminary Note:** The committee must first establish that the patient has profound cognitive alteration (as defined) and that there is a conflict between prior documented preferences and current expressed preferences. This procedure assumes that has been established.

  **Step 1: Assess the Nature of Psychological Continuity**
  - **Question:** "What specific psychological connections (e.g., memory, beliefs, desires, character traits) persist between the prior and current states of the patient, and to what degree?"
  - **Factual Answer:** List observed continuities and discontinuities (e.g., memory tests, behavioral observations, neuroimaging if available). Avoid interpretation.
  - **Normative Judgment Required?** No. This step is descriptive.
  - **Termination/Hand-off:** If no significant psychological continuity is found (beyond basic biological functions), proceed to Step 2. If significant continuity exists, the case may be resolved by standard autonomy principles (honoring prior directive) unless Step 2 raises concerns. However, if continuity is partial, proceed to Step 2.
  - **Misfire Caught:** Conflating continuity of consciousness with continuity of autobiographical narrative (e.g., assuming that because someone recognizes family, they have the same values and preferences as before).

  **Step 2: Evaluate Present Suffering and Well-being**
  - **Question:** "What is the current state of the patient's well-being? Specifically, is the patient experiencing suffering (physical or mental) that would be alleviated or exacerbated by honoring the prior directive?"
  - **Factual Answer:** Documented observations of distress, comfort, engagement, etc. (e.g., pain scales, behavioral indicators). Avoid projecting future states.
  - **Normative Judgment Required?** Minimal; focus on observable indicators. However, if there is ambiguity about what constitutes suffering, it may require committee interpretation (values).
  - **Termination/Hand-off:** If honoring the prior directive would cause present suffering (e.g., withholding food from someone who is hungry and shows no distress when eating), the committee should consider overriding the prior directive (proceed to Step 3). If not, and if Step 1 showed discontinuity, the prior directive may be set aside. If the current state is suffering and the prior directive would alleviate it (e.g., refusing life support in a state of pain), then honor the directive. Otherwise, hand off to Step 3 for values-based decision.
  - **Misfire Caught:** Prioritizing anticipated suffering of a hypothetical future self over present suffering (e.g., "if we feed her now, she might suffer later from complications" when the patient is currently hungry and content).

  **Step 3: Relational Identity and Social Embedding**
  - **Question:** "To what extent does the patient's current relational identity (as recognized by family, community, and caregivers) align with the identity that authored the prior directive? And how does the current patient relate to significant others?"
  - **Factual Answer:** Describe the patient's current social interactions and relationships (e.g., recognizes family, forms new bonds) and compare with the social context at the time of the directive.
  - **Normative Judgment Required?** Partly. The committee must avoid imposing a Western essentialist view (e.g., "this is not the real person"). Instead, focus on observable relational patterns.
  - **Termination/Hand-off:** If the patient's relational identity has shifted fundamentally (e.g., no recognition of prior relationships and forming entirely new ones) and the current network supports the current preferences, then the prior directive may be set aside. However, if the relational network is substantially the same and they support the prior directive, that may weigh in favor of honoring it. This step may not yield a clear answer and might require hand-off to human judgment (values) in Step 4.
  - **Misfire Caught:** Assuming that because biological relatives are present, the patient's relational identity is unchanged (e.g., a patient with dementia who forms a new primary attachment to a caregiver).

  **Step 4: Authority of Past vs. Present Mental States**
  - **Question:** "Given the lack of an enduring self (anattā), does the prior mental state (documented directive) hold authority over the current mental state (expressed preference) when they conflict and there is no underlying substrate?"
  - **Factual Answer:** This step is normative and requires committee judgment. It is the core application of anattā.
  - **Normative Judgment Required?** Yes. The committee must explicitly reject the notion of a permanent self. Therefore, without a metaphysical self, the prior directive is not "binding" on a current state that is discontinuous. However, the committee must also consider the conventional self in society (e.g., legal and social commitments).
  - **Termination/Hand-off:** This step requires human sign-off (by the committee) because it involves values. The recommendation should be based on minimizing present suffering and respecting the current expression of preferences, unless there is a compelling reason (e.g., the prior directive was intended to prevent a state of suffering that is now occurring). The committee must explicitly state: "Because there is no enduring self, we give priority to the current state unless honoring it would lead to severe suffering that the prior self sought to avoid and that the current self cannot comprehend."
  - **Misfire Caught:** Granting automatic authority to past directives without considering the discontinuity of self (treating the prior self as the "true" self).

  **Step 5: Synthesis and Recommendation**
  - **Question:** "Based on Steps 1-4, what action minimizes present suffering while respecting the current expression of the patient, without assuming a continuous self?"
  - **Factual Answer:** N/A.
  - **Normative Judgment Required?** Yes, but structured.
  - **Termination/Hand-off:** The committee formulates a recommendation. The physician and legal advisor must sign off. The recommendation must be actionable (e.g., "honor current preference for feeding" or "uphold prior directive to withhold intubation").

  ---

  **Application to Cases**

  **Case 1: Advanced Alzheimer's patient with prior directive refusing artificial nutrition, but now seeks food and shows no distress during feeding.**
  - Step 1: Psychological continuity is minimal (no memory of prior life, directive, or values). Discontinuity is high.
  - Step 2: Present suffering: The patient is hungry and shows contentment when eating. Withholding food would cause immediate suffering. No current distress from feeding.
  - Step 3: Relational identity: The patient may not recognize family but forms new bonds with caregivers. The current relational network (caregivers) observes the patient's enjoyment of food.
  - Step 4: Given anattā, the prior self's directive does not automatically bind the current self. The current self's preference for food and absence of suffering when eating should be prioritized. Honoring the prior directive would cause present suffering.
  - Step 5: **Recommendation: Override the prior directive and provide nutrition.** This goes against standard intuition (which might rigidly uphold prior directives) but aligns with minimizing present suffering and respecting the current self.

  **Case 2: Severe frontal-lobe injury with loss of autobiographical memory but emotional recognition of family. Family demands aggressive treatment, claiming "this is not who he really is."**
  - Step 1: Psychological continuity: Autobiographical memory is lost, but emotional recognition remains. There is partial continuity (emotional bonds) but discontinuity in personal history and likely values.
  - Step 2: Present suffering: The patient may not be suffering now, but aggressive treatment (e.g., repeated surgeries) may cause present suffering. We must assess current well-being.
  - Step 3: Relational identity: The patient still recognizes family, so relational identity is partially intact. However, the family is invoking a "core self" that no longer exists (essentialism). The committee must avoid that and focus on observable relations: the patient relates to family as significant others.
  - Step 4: The prior self's preferences are not known (no advance directive mentioned). The family is appealing to a core self (rejected by anattā). Without a directive, we focus on current preferences (if any) and present suffering. If the patient cannot express preferences, we rely on surrogate decision-makers, but they must not appeal to a metaphysical self.
  - Step 5: **Recommendation: The family's demand for aggressive treatment must be evaluated based on the patient's current best interest (minimizing suffering) and any known prior preferences (if none, then surrogates decide). The committee should reject the argument based on a "core self" and instead ask: What would the patient want now, given their current state? If aggressive treatment causes suffering without benefit, it may be withheld.** The procedure does not automatically support aggressive treatment.

  **Case 3: Dissociative Identity Disorder (DID) with one alter authoring a directive refusing interventions, but other alters currently requesting them. No continuous memory access.**
  - Step 1: Psychological continuity: There is no continuity between alters (as per case: no shared memory or preferences). Each alter is a distinct state.
  - Step 2: Present suffering: Depending on which alter is present, suffering may vary. The alter requesting intervention may be suffering without it.
  - Step 3: Relational identity: Different alters may have different relational networks. The alter that authored the directive may not be socially present now.
  - Step 4: Without an enduring self, the prior directive by one alter does not bind another alter. The current alter's expressed preference should be honored unless it causes harm (e.g., the requested intervention is dangerous). However, note: in DID, there is a single biological body, so interventions affect all alters. This complicates the analysis.
  - Step 5: **Recommendation: The current alter's preference should be honored, unless there is evidence that the intervention would cause severe suffering to other alters or the body. The committee must weigh the current suffering against potential harm. This may go against standard intuition (which might rigidly uphold the directive by one alter).**

  ---

  **What the Procedure Cannot Settle**
  - The procedure is based on the metaphysical commitment to anattā (no enduring self). This is incommensurable with Western frameworks that assume personal identity over time (e.g., for autonomy). Therefore, in cases where the law or institutional policy requires upholding prior directives as binding (even without continuity), the procedure may conflict and require legal override.
  - The procedure cannot resolve deep value conflicts about what constitutes a "person" or the moral weight of past vs. present preferences. It explicitly rejects the authority of past preferences when discontinuity is high, but Western bioethics often grants past autonomy priority.
  - The procedure does not address resource allocation or family distress, which may be relevant in clinical decisions but are outside the scope of anattā.

  ---

  **Settled vs. Contested Aspects of Anattā**
  - **Settled:** Anattā denies the existence of a permanent, unchanging self (ātman) or any metaphysical substance that underlies personal identity. It rejects the notion of a soul that survives death or persists unchanged through life.
  - **Contested:**
    - **Reductionism vs. Non-Reductionism:** Some scholars argue that anattā supports a reductionist view (the person is just a collection of aggregates without any unity). Others argue for a conventional, non-reductive self that emerges from the aggregates but is not reducible to them.
    - **Narrative Self:** Some Buddhist modernists (and scholars) see the self as a narrative construct. Others reject this as a subtle form of essentialism.
    - **Relational Self:** Some interpret anattā as supporting a relational self (dependent on social context). Others argue that relations are also empty and do not constitute a self.
    - **Continuity without Identity:** There is debate about what provides continuity across lives (or moments) without a self. Karma is often cited, but its mechanics are contested.

  Thus, the procedure avoids taking a stance on these debates by focusing on observable psychological discontinuity and the absence of an enduring substrate. It uses anattā to challenge the automatic authority of past directives without committing to a specific theory of conventional selfhood.
answer: |-
  ### Operationalized Anattā-Based Decision Procedure  
  This procedure operationalizes the Buddhist principle of *anattā* (non-self) by rejecting metaphysical continuity and prioritizing present experience. It avoids Western essentialist/narrative models by focusing on observable facts, minimizing normative judgments where possible. Steps terminate in a procedural recommendation unless values-based sign-off is unavoidable.  

  #### Core Principles  
  1. **No enduring self**: Reject appeals to a "core self," "true identity," or metaphysical continuity.  
  2. **Present-first orientation**: Prioritize current suffering over anticipated future suffering.  
  3. **Anti-essentialism**: Treat identity as a fluid, relationally embedded process.  
  4. **Authority hierarchy**: Current preferences override past directives when psychological discontinuity is high and present suffering is actionable.  

  ---

  ### Step-by-Step Procedure  
  **Step 1: Map Psychological Continuity**  
  - **Question**: "What specific, observable psychological connections (e.g., memory, emotional responses, recognition, preferences) exist between the prior self (who documented preferences) and the current self?"  
  - **Factual Answer**: List observed continuities/discontinuities (e.g., "recognizes spouse but not children"; "recalls religious beliefs but not medical choices"). Use clinical data (e.g., cognitive assessments, behavioral logs).  
  - **Normative Judgment?**: None. Purely descriptive.  
  - **Termination**: If **no significant continuity** (e.g., no shared memories, values, or recognition), proceed to Step 2. If **significant continuity exists**, default to prior directive unless Step 2/3 override.  
  - **Misfire Caught**: Conflating autobiographical narrative (e.g., "he was a teacher") with psychological continuity (e.g., "he still enjoys teaching metaphors").  

  **Step 2: Assess Present vs. Anticipated Suffering**  
  - **Question**: "What is the *current* suffering (physical/emotional distress observed or reported) that would result from honoring or overriding the prior directive? Is there suffering anticipated for a *future* self?"  
  - **Factual Answer**: Document observable signs (e.g., pain scores, agitation, smiling during feeding). Differentiate from *projected* suffering (e.g., "if fed, she may develop aspiration pneumonia").  
  - **Normative Judgment?**: Minimal. Focus on observable present states.  
  - **Termination**: If honoring the prior directive causes **present suffering** (e.g., withholding food from a hungry patient), recommend overriding it. If suffering is **only anticipated** (e.g., future complications), disregard it unless immediate/inevitable. Proceed to Step 3.  
  - **Misfire Caught**: Prioritizing hypothetical future suffering (essentialist "future self") over observable present well-being.  

  **Step 3: Evaluate Relational Identity**  
  - **Question**: "Does the current self maintain relational bonds (e.g., recognizes family, responds to caregivers) that socially anchor them to the prior self’s identity? How do key stakeholders (family, caregivers) perceive continuity?"  
  - **Factual Answer**: Describe relational behaviors (e.g., "smiles at daughter but calls her by wrong name"; "trusts all medical staff"). Avoid interpretations (e.g., "he is a different person").  
  - **Normative Judgment?**: None. Stakeholder input is factual but not decisive.  
  - **Termination**: If relational bonds are **severed** (e.g., no recognition of prior relationships), this weakens the authority of the prior self. Proceed to Step 4. If bonds are **intact**, favor prior directive unless Step 2 overrides.  
  - **Misfire Caught**: Equating biological/legal relationships (e.g., "she is still his wife") with relational continuity (e.g., "he reacts to her as a stranger").  

  **Step 4: Resolve Past vs. Present Authority**  
  - **Question**: "Given discontinuity established in Steps 1–3, does the prior directive address *current* suffering, and does the current self have preferences that conflict?"  
  - **Factual Answer**: State conflicts (e.g., "prior directive refuses feeding; current self seeks food").  
  - **Normative Judgment?**: High. Requires committee to apply *anattā*: No enduring self = past self’s wishes are not inherently authoritative.  
  - **Termination/Hand-off**:  
    - If prior directive addresses **current suffering** (e.g., "no intubation" while patient is in agony), honor it.  
    - If prior directive causes **current suffering** (e.g., refusing food while patient is hungry) and current self opposes it, recommend overriding it.  
    - If ambiguity persists, hand to **human sign-off** (physician + legal) for values-based weighing.  
  - **Misfire Caught**: Granting automatic authority to past preferences based on essentialist identity ("past self knows best").  

  **Step 5: Final Recommendation**  
  - **Question**: "Does overriding the prior directive reduce *present* suffering while respecting the current self’s expressed preferences and relational context?"  
  - **Action**: Issue a binary recommendation (e.g., "override directive"; "uphold directive"). Requires sign-off from physician (clinical feasibility) and legal advisor (institutional compliance).  
  - **Normative Safeguard**: If the recommendation violates legal/ethical norms (e.g., ignoring a binding directive), legal advisor must flag for institutional review.  

  ---

  ### Case Applications  
  **Case 1: Advanced Alzheimer’s patient**  
  - Prior directive: Refuses artificial nutrition.  
  - Current state: Seeks food, makes eye contact, no distress during feeding.  
  - **Procedure**:  
    - Step 1: **No psychological continuity** (no memory of directive or past identity).  
    - Step 2: **Present suffering** if denied food (hunger); no distress during feeding. No *current* suffering from eating.  
    - Step 3: **Relational identity altered** (may not recognize family; bonds with caregivers during feeding).  
    - Step 4: Prior directive not authoritative—conflicts with current preferences and causes suffering.  
    - Step 5: **Recommendation: Override prior directive; provide nutrition.**  
  - **Why against intuition?** Standard bioethics often prioritizes prior autonomy. *Anattā* centers current suffering and non-continuity.  

  **Case 2: Severe frontal-lobe injury**  
  - Prior self: No advance directive. Family claims injury obscures "true self," demands aggressive treatment.  
  - Current state: No autobiographical memory, but emotional recognition of family.  
  - **Procedure**:  
    - Step 1: **Partial continuity** (emotional recognition persists; values/memory lost).  
    - Step 2: **No observable present suffering** from injury itself. Aggressive treatment may cause *new* suffering (e.g., surgery pain).  
    - Step 3: **Relational identity partially intact** (recognizes family). Family’s "true self" claim is essentialist—rejected.  
    - Step 4: No prior directive → no conflict. Family’s demand is invalid if based on metaphysical "core self."  
    - Step 5: **Recommendation: Reject family’s "true self" argument. Treatment based on current best interest (e.g., avoid non-beneficial aggressive care).**  

  **Case 3: Dissociative Identity Disorder (DID)**  
  - Alter A: Authored directive refusing interventions (e.g., antipsychotics).  
  - Alter B: Currently requests interventions. No memory sharing.  
  - **Procedure**:  
    - Step 1: **No psychological continuity** between alters.  
    - Step 2: **Present suffering**: Alter B’s distress if denied treatment; Alter A not currently present.  
    - Step 3: **Relational identity fragmented** (each alter has distinct relationships).  
    - Step 4: Prior directive (Alter A) not binding on Alter B—no enduring self.  
    - Step 5: **Recommendation: Honor current alter’s (B) request if it reduces suffering.**  
  - **Why against intuition?** Clinicians often privilege "original" alter’s directive. *Anattā* treats all alters as equally conventional selves.  

  ---

  ### What the Procedure Cannot Settle  
  1. **Incommensurable Values**:  
     - **Autonomy vs. Anattā**: Western autonomy assumes a continuous self; *anattā* denies this. The procedure cannot reconcile when a legally binding prior directive *must* be honored despite discontinuity (e.g., court-mandated directives).  
     - **Suffering Definitions**: Buddhist "dukkha" (unsatisfactoriness) may include existential distress invisible to clinicians. The procedure relies on observable suffering, creating blind spots.  
     - **Resource Allocation**: *Anattā* does not address triage or family burdens—requires external ethical frameworks.  

  2. **Unresolved Normative Conflicts**:  
     - When current preferences pose long-term risks (e.g., feeding causing aspiration), the procedure prioritizes present relief, potentially clashing with beneficence.  
     - Stakeholder distress (e.g., family trauma) is excluded unless it directly impacts patient suffering.  

  ---

  ### Settled vs. Contested Aspects of Anattā  
  **Settled (Buddhist Consensus)**:  
  - Rejection of *ātman*: No permanent, unchanging soul or self (metaphysical substance).  
  - Impermanence (*anicca*): All phenomena, including identity, are in flux.  
  - Dependent origination: Identity arises from causes/conditions, not inherent existence.  

  **Contested (Scholarly Debates)**:  
  - **Reductionism vs. Conventionalism**:  
    - Reductionists (e.g., Siderits) argue persons are *merely* aggregates (*skandhas*) with no unity.  
    - Conventionalists (e.g., Garfield) posit a pragmatic, socially constructed "person" without metaphysical weight.  
  - **Narrative Identity**:  
    - Some scholars (e.g., Flanagan) suggest *anattā* supports a dynamic narrative self.  
    - Others (e.g., Siderits) reject narratives as reification.  
  - **Relational Self**:  
    - Feminist interpreters (e.g., Gross) emphasize relational identity.  
    - Traditionalists caution against replacing "self" with "relations" (risks new essentialism).  
  - **Continuity Without Self**:  
    - Theravāda: Emphasizes moment-to-moment causal links (*karma*).  
    - Mahāyāna: Stresses emptiness (*śūnyatā*) of all phenomena, including continuity.  

  **Procedure Alignment**: This tool uses *anattā*’s settled core (no metaphysical self) while remaining agnostic on contested models (e.g., narrative vs. relational). It operationalizes discontinuity without committing to a specific conventional theory.  

  ---  
  **Final Output**: The committee receives a clear recommendation (e.g., "override directive") grounded in present-focused, anti-essentialist reasoning, with physician/legal sign-off ensuring clinical/legal viability.
