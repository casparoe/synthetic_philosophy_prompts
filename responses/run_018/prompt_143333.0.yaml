  hey so im in this criminology seminar and we're comparing prison models but i keep getting stuck on one specific tension. my professor mentioned that Halden prison in Norway—the one that opened around 2010—lets inmates cook together in shared kitchens with actual metal knives, which sounds like this big rehabilitative trust move, but also maybe its a calculated form of governance? meanwhile american supermax facilities like ADX Florence in colorado use total isolation and sensory deprivation, but maintaining that apparently takes enormous bureaucratic care—doctors, psychologists, constant legal review—just to keep people alive in solitary.

  i want to analyze both through institutional logics theory, specifically how the care logic and security logic aren't just opposites but actually depend on eachother in weird ways. like, does Halden's visible care produce a different kind of docility, and does american mass incarceration's security logic secretly require a hidden care infrastructure? also my roommate said im overreading the knife thing, but can you help me think through whether this framework explains why Norway's model never scaled, or if we're missing the economic logic of prison labor and private contracting that drives american expansion? dont need citations or reading lists, just want to work through the idea and see if the theory actually holds up or breaks.
