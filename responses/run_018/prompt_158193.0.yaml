answer: |-
  Here is the teaching plan as requested:

  1.  **Establish the manifold and metric as distinct:** Begin by clearly defining the bare manifold (a set of points with topology/smooth structure) and the metric tensor field (dynamic geometry *assigned* to it) as separate entities. This distinction is essential because the hole argument relies on altering the metric field *while keeping the underlying point set fixed*.
  2.  **Use a pliable sheet analogy:** Employ a stretched, marked rubber sheet (representing a manifold with a metric) that can be locally deformed (representing the diffeomorphism). Crucially, the sheet *lacks a coordinate grid* to avoid conflating coordinate changes (passive diffs) with actual physical changes (active diffs).
  3.  **Address point identity during diffeomorphism:** When introducing the active diffeomorphism `φ`, explicitly state that `φ` *moves the metric field* relative to the fixed point manifold. Intercept the misconception that points themselves are moved by emphasizing `φ` is a smooth re-mapping/re-labeling *of the metric values* onto the *same* underlying points.
  4.  **Pose the determinism check:** After showing two distinct metric fields (`g` and `φ*g`) satisfying the same equations outside the hole but differing inside, ask: "If these are both valid solutions for the same matter distribution, what does this imply about predicting the geometry *inside* the hole based on data *outside*?" This reveals if they grasp the threat to determinism.
  5.  **Omit covariance/invariance distinction:** Avoid discussing the technical/historical nuance between "general covariance" (formal property of equations) and "diffeomorphism invariance" (substantive physical symmetry). Including it prematurely shifts focus to formalism and obscures the core metaphysical dilemma about manifold points.
