prompt: |-
  I keep running into a weird loop in moral arguments and I'm not sure if it's just circular reasoning or something more specific. A person says we shouldn't coerce someone because that violates their autonomy. When you ask why autonomy trumps wellbeing here, they say autonomy just is the kind of value that forbids coercion — it's not justified by wellbeing, it defines what's at stake. So autonomy started as the reason but turned into a redescription of the verdict. But then in the next debate they treat autonomy as an independent good that can be weighed against other goods, as if it had its own foundation. The supposed ground and the particular judgment keep trading places, and the person never notices. I know there's that ancient question about whether something is good because God commands it or vice versa, but this feels like a modern secular version where people slidd back and forth without realizing there are two directions. Is there an established name for this specific slidding — the way a moral principle and the cases it's meant to support keep defining each other? How is it different from the classic dilemma and from plain question-begging? If there's no specific term, can you coin one with clear boundry conditions?
reasoning: |-
  Okay, the user is describing a frustrating loop they've encountered in moral arguments, specifically around autonomy versus wellbeing. They notice that their interlocutor starts by saying coercion is wrong because it violates autonomy. But when asked why autonomy matters more than wellbeing in a given case, the person says autonomy isn't justified by wellbeing—it's just inherently valuable. Then later, in another discussion, the same person treats autonomy as something that can be weighed against other goods like wellbeing. The user is pointing out a circularity: autonomy is both the foundation and defined by the cases it's applied to. They want to know if there's a name for this specific logical issue.

  First, I need to unpack what the user is observing. The core problem seems to be a shift between two different ways autonomy is used. On one hand, it's treated as a deontological principle—absolute and foundational. On the other, it's used as a consequentialist value that can be balanced. The inconsistency lies in switching between these frameworks without acknowledgment. The user mentions the Euthyphro dilemma as a similar structure but in a secular context. They're looking for a term to describe this specific toggle.

  The user's deeper need might be to understand and label this logical flaw so they can effectively critique it in debates. They might feel that without a specific term, it's harder to call out this inconsistency. They also want to distinguish it from simple circular reasoning or begging the question, which are broader fallacies.

  I recall that in ethics, foundationalism and coherentism describe how principles relate to judgments. Foundationalism has basic principles that justify judgments, while coherentism allows mutual adjustment. But the user's scenario involves an unacknowledged switch between treating autonomy as foundational (when justifying prohibitions) and as one value among others (when balancing against wellbeing). This isn't just coherentism because the person isn't admitting to revising principles; they're inconsistently applying different frameworks.

  Terms like "foundational sliding" or "justificatory switching" come to mind. The key elements are the unacknowledged shift between foundational and non-foundational uses of a principle, and the lack of meta-ethical consistency. The boundary conditions would include: a core moral term (like autonomy), two distinct roles (foundational vs. fungible), inconsistent application without acknowledgment, and a resulting circularity where the principle and judgments mutually define each other.

  I should explain how this differs from question-begging. Begging the question assumes what it's trying to prove within the same argument. Here, the problem is across different arguments: in one context, autonomy is foundational; in another, it's weighed against other values. The inconsistency spans multiple discussions, making it harder to pin down. The user needs a term that captures this broader pattern of inconsistency.

  The user might also benefit from understanding that this reflects a deeper meta-ethical confusion. Their interlocutor hasn't clarified whether they subscribe to deontology, consequentialism, or pluralism. By naming this "principle-role equivocation," it highlights the equivocation between roles. This term emphasizes the switch in how the principle functions, which is the heart of the issue.

  In conclusion, the user needs a specific term to articulate this logical flaw. Coining "principle-role equivocation" with clear boundaries allows them to call out the inconsistency in debates. It addresses their frustration and provides a tool for more effective ethical discussions.
answer: |-
  This is a brilliantly observed pattern in applied ethics discourse, and you've pinpointed a genuine logical instability. What you're describing **isn't quite standard circular reasoning or the Euthyphro dilemma**, though it shares features with both. It's a specific form of **meta-ethical inconsistency** or **justificatory switching**, often arising from an unacknowledged tension between different ethical frameworks (deontology vs. consequentialism/pluralism).

  Here's the breakdown and a proposed term:

  1.  **The Pattern:**
      *   **Step 1 (Foundational Claim):** "Action X is wrong because it violates Principle P." (e.g., "Coercion is wrong because it violates Autonomy.")
      *   **Step 2 (Challenging the Foundation):** "Why is upholding P (Autonomy) more important than achieving Good G (Wellbeing) in this case?"
      *   **Step 3 (Immunization Tactic):** "P (Autonomy) *just is* the kind of value that *defines* right/wrong here. It's foundational/non-negotiable/inviolable; it doesn't *derive* its value from G (Wellbeing). To violate P *is* to do wrong, period." (Principle P shifts from *reason* to *definition*).
      *   **Step 4 (Contradictory Application):** Later, in a different context, the same person argues: "We must weigh Principle P (Autonomy) against Good G (Wellbeing) here to decide the right action." (Principle P is now treated as *one* value among others, subject to trade-offs).
      *   **The Loop:** P is used both as an inviolable *foundation* that defines wrongness (immune to balancing) *and* as a *fungible good* that can be weighed against other goods (like Wellbeing). The justification for P's authority depends entirely on which role is needed in the moment, creating a closed loop where the principle and its application mutually define each other without independent grounding.

  2.  **How it Differs:**
      *   **Circular Reasoning / Begging the Question:** This is usually confined to a *single* argument ("X is wrong because it violates P, and violating P is wrong"). Your scenario involves inconsistency *across different arguments or contexts*. In one moment P is foundational and definitional; in another, it's derivative and weighable. The circularity arises from the *overall pattern of justification*, not within a single syllogism.
      *   **The Euthyphro Dilemma:** This is a *metaphysical* question about the *source* of value (divine command vs. independent moral facts). Your scenario is about *logical consistency in application and justification within an argumentative strategy*. It's a *pragmatic* inconsistency in how a principle is deployed rhetorically and logically by an agent, not about the ultimate grounding of morality itself. It's the *modern, secular, internal* manifestation of a similar structural tension.
      *   **False Dichotomy:** Not applicable. The person isn't presenting only two options; they're inconsistently using one concept in two incompatible ways.
      *   **Equivocation:** This is *close*, but standard equivocation involves changing the *meaning* of a term mid-argument. Here, the *meaning* of "autonomy" might stay roughly constant (self-governance), but its *justificatory role* and *meta-ethical status* shift radically (absolute constraint vs. weighable good).

  3.  **Established Concepts & Proposed Term:**
      *   **Coherentism vs. Foundationalism:** This touches on it. Foundationalism seeks bedrock principles; Coherentism allows principles and judgments to mutually adjust. The problem is the *unacknowledged switch* between modes. The person acts foundationalist when challenged on P's priority, but coherentist (or pluralist consequentialist) when needing flexibility elsewhere.
      *   **Principle-Particular Reflective Equilibrium:** This is the *healthy* version of adjusting principles and judgments. The flaw here is the *lack of acknowledgment* that this adjustment is happening or the *inconsistency* in how rigidly the principle is held.
      *   **Proposed Term:** **Principle-Role Equivocation (PRE)** or **Justificatory Role-Switching (JRS)**.
          *   **Principle-Role Equivocation (PRE)** emphasizes the shifting *function* of the principle within the justificatory structure.
          *   **Justificatory Role-Switching (JRS)** emphasizes the *act* of changing the principle's foundational status.

  4.  **Boundary Conditions for Principle-Role Equivocation (PRE):**
      *   **Core Element:** A single core moral term or principle (P) (e.g., Autonomy, Justice, Wellbeing).
      *   **Role 1:** P is presented as **Foundational/Definitive/Non-Fungible:** It provides the *ultimate* reason against an action (violating P *is* the wrongness). It is immune to being overridden by other considerations *because* it defines the relevant moral landscape. (Deontological role).
      *   **Role 2:** P is presented as **Fungible/Weighable:** P is treated as *one valuable state of affairs* or *good among others* (e.g., Wellbeing, Happiness, Security). Its demands can be balanced against, outweighed by, or traded off for other goods. (Consequentialist/Pluralist role).
      *   **Inconsistent Application:** The same agent utilizes P in Role 1 and Role 2 *in different arguments or contexts* without acknowledging the shift or providing a meta-justification for why P functions differently in each case.
      *   **Mutual Definition Loop:** The justification for P's authority in Role 1 relies on the specific prohibitions it entails (e.g., "Autonomy forbids coercion"), while the permissibility of violating P in Role 2 relies on P being *just* one good to be weighed (e.g., "Wellbeing outweighs Autonomy here"). The principle and its applications define each other without external anchor.
      *   **Lack of Meta-Ethical Clarity:** The agent does not explicitly commit to a framework (e.g., pure deontology, consequentialism, pluralism with lexical priorities) that consistently explains when P is foundational and when it is fungible.

  **In essence:** PRE/JRS occurs when a moral principle functions as an **unacknowledged chameleon**, changing its fundamental justificatory nature (from inviolable constraint to weighable good, or vice-versa) depending on the argumentative need, creating a self-sealing but logically unstable loop where the principle's authority and its specific applications are mutually dependent without independent grounding. It exploits the ambiguity between treating a principle as *constitutive* of morality and treating it as *one component* within a broader consequentialist calculus.

  **Why your observation is sharp:** You've identified a common rhetorical dodge where principles are made "conversation-stoppers" when convenient (Role 1: "Autonomy *just is* sacred!") but then treated as flexible when other values seem pressing (Role 2: "Well, autonomy is important, but wellbeing *must* be considered too"). The key flaw is the refusal to acknowledge or reconcile this switch in the principle's *logical role*. Naming it (PRE/JRS) gives you the tool to point out: "You are treating Autonomy as an absolute, non-negotiable foundation when defending against coercion, but as a weighable good against wellbeing elsewhere. You need to explain *why* its role changes or commit to a consistent meta-ethical framework." This forces the interlocutor out of the loop and into a more transparent discussion of their underlying ethical commitments.
