prompt: |-
  I'm trying to map out my actual commitments on weighing the inside view against the outside view, particularly where epistemic modesty about my own reasoning is at stake. Here are my concrete verdicts.

  When I estimate how long a research proposal will take, my inside view breaks the task into parts and yields three weeks; the outside view, drawn from my past proposals, suggests eight weeks is typical. I think I should split the difference but lean closer to the outside view—around six weeks. When I verify a simple logical derivation and see that modus ponens applies cleanly, my inside view reports direct comprehension; the outside view notes that people make logical errors at some base rate. Here I think I should largely disregard the outside view and remain near-certain. When I finish a dense philosophical paper and come away convinced there is a hidden equivocation in the author's central premise, my inside view reports clear understanding; the outside view says readers with my background often invent hidden errors. I think I should hold the conviction only tentatively—around sixty percent—and seek a second reading. When I vividly recall a specific conversation from last year, the inside view delivers precise dialogue; the outside view says reconstructed memory is unreliable. I think I should not rely on exact wording or cite details without checking, but I can still treat the gist as probably correct. When I assess my own moral intuition about a trolley-style case, the inside view delivers a sharp normative judgment; the outside view observes that people with my demographic and training often share the same bias. I think I should treat the intuition as data rather than verdict and substantially lower my confidence in its authority.

  One pair keeps pulling me in opposite directions. In the logical-derivation case, I reject letting the outside view undermine my direct verification. But in a statistical-analysis case—where I have just executed a regression with several data transformations—the inside view likewise reports that I performed each step correctly, yet I think I should apply the outside view aggressively and ask a colleague to check my code. Both involve direct inspection of my own cognitive work; one feels immune to the base rate, the other does not. I am unsure whether the relevant difference is cognitive transparency, domain-specific reliability, or an inconsistency I should correct.

  Is there a single principle—about the conditions for inside-view authority, epistemic modesty, or cognitive transparency—that captures all five verdicts and resolves the tension? State it precisely, identify which clause is motivated by which case, and predict what it says about an unlisted case: my assessment that I have correctly interpreted a poem's central metaphor after one careful reading. Then say honestly which of my listed verdicts the principle cannot accommodate. If no unified principle works, present the two best competing candidates, specify the case that forces a choice between them, and state which verdict each candidate must sacrifice.
reasoning: |-
  Hmm, this user is grappling with a sophisticated epistemic dilemma—how to balance the inside view (personal reasoning) against the outside view (base rates/statistics) across different cognitive tasks. They've provided five concrete scenarios with their intuitive verdicts, plus a tension between two similar cases (logical derivation vs. statistical analysis) that feel paradoxically different. The core ask is for a unifying principle or, failing that, a clear taxonomy of when each view dominates.

  The user's scenarios reveal nuanced patterns:  
  - They consistently downgrade inside-view confidence when **self-monitoring is unreliable** (memory, moral intuition) or **error-detection is opaque** (philosophical critique, statistical code).  
  - They preserve inside-view certainty only when **verification is atomic and self-illuminating** (modus ponens).  
  - The poem metaphor case—which they add as a test—likely falls closer to philosophical critique: metaphorical interpretation is layered and invites projection, so outside-view skepticism should apply.  

  The logical/statistics tension is the crux. Both involve step-by-step verification, but:  
  - Logic has **binary, syntax-driven rules** where errors feel "loud" (e.g., contradiction).  
  - Statistics involves **iterative, context-dependent choices** (data transforms, assumptions) where mistakes are "silent."  
  This suggests the decisive factor is **error salience**—whether the *process itself* flags mistakes.  

  A unified principle might be:  
  *"Inside-view certainty requires that the cognitive operation (a) decomposes into directly verifiable atomic steps, and (b) each step's correctness is self-illuminating (errors produce intrinsic failure signals)."*  
  - **Clause (a)** handles research estimates (non-atomic) and memory (non-verifiable).  
  - **Clause (b)** distinguishes logic (misapplying modus ponens breaks derivation) from statistics (coding errors may output plausible results).  

  The principle accommodates all cases *except moral intuition*—which fails (a) and (b) but also carries extra weight because normative judgments aren't truth-apt in the same way. This exception hints that **domain purpose** matters: moral intuition is meant for deliberation, not verification.  

  If forced to choose between competing principles, the split would be:  
  1. **Error-salience principle** (as above) → sacrifices moral intuition case (overfits to cognitive tasks).  
  2. **Purpose principle**: "Inside-view authority applies only to descriptive (not normative) claims where error-correction mechanisms exist." → sacrifices the logical derivation case (which *is* descriptive but needs no error-correction).  

  The poem metaphor test case clearly fails both clauses of the unified principle—interpretation isn't atomic, and misreads aren't self-flagging—so tentative confidence (à la philosophical critique) is warranted.  

  Notably, the user's instincts already reflect deep epistemic maturity. The only tweak I'd suggest is explicitly distinguishing **procedural** vs. **interpretive** cognition in the statistics/logic divide—a lens that strengthens their existing framework.
answer: |-
  Here's a unified principle capturing your verdicts, resolving the tension, and specifying its application to your test case, followed by an honest assessment of limitations:

  ### Unified Principle
  **Inside-view authority is justified only when both:**  
  **(1) The cognitive operation is *atomic* (non-decomposable into subtasks where independent error could occur),**  
  **(2) Correct execution produces *intrinsic failure signals* (errors manifest as obvious contradictions, computational halts, or sensory dissonance during the act itself).**  
  When either condition fails, the outside view must dominate.

  ### How Cases Motivate Each Clause & Resolve Tension
  - **Research timeline (motivates atomicity requirement):**  
    Decomposable into subtasks (literature review, methodology design, etc.), each with independent failure modes → *Violates (1)* → Outside view dominates.
  - **Logical derivation (motivates failure-signal requirement):**  
    Modus ponens is atomic (applying it is instantaneous cognition). Misapplication causes immediate syntactic/contradiction failure (e.g., "A→B, A, therefore ¬B" *feels* broken). → *Satisfies (1) & (2)* → Inside view dominates.
  - **Statistical code (resolves tension):**  
    Though steps *feel* inspected, each transformation/command is decomposable (e.g., misindexing, formula typo). Errors lack intrinsic signals—code runs with plausible output. → *Violates (2)* → Outside view dominates despite "direct inspection."
  - **Philosophical critique:**  
    Identifying equivocation isn’t atomic (requires synthesizing context, definitions). Misattributed errors don’t create intrinsic dissonance. → *Violates (1) & (2)* → Outside view heavily weights confidence.
  - **Memory reconstruction:**  
    Gist is atomic (holistic retrieval); details are decomposable (specific wording relies on reconstruction). Errors lack failure signals (false details feel subjectively vivid). → *Gist satisfies (1), details violate (1)/(2)* → Split verdict.
  - **Moral intuition:**  
    Judgment synthesizes biases/emotions (non-atomic). No intrinsic failure signal (biased intuitions *feel* compelling). → *Violates (1) & (2)* → Outside view overrides authority.

  ### Prediction: Poem Metaphor Interpretation
  - **Assessment:** After one careful reading, you claim correct interpretation of a central metaphor.  
  - **Principle verdict:** *Low inside-view authority (tentative confidence ~60%).*  
    **Why:** Interpretation isn’t atomic (requires linking text, context, subtext). Misinterpretations lack intrinsic failure signals (subjectively coherent but potentially wrong readings feel identical to correct ones). → *Violates (1) & (2)* → Outside view (base rates of misreading poetry) should dominate, demanding external verification (e.g., peer discussion).

  ### Honest Limitation: The Moral Intuition Case
  The principle **cannot fully accommodate** your moral intuition verdict.  
  - **Why:** The principle reduces moral intuition to an *epistemic failure* (violating atomicity/failure-signals), but your verdict treats it as a different *kind of datum* ("data rather than verdict"). This hints at meta-ethical distinctions (e.g., normative vs. descriptive claims) the principle doesn’t capture. The principle correctly lowers confidence but doesn’t explain *why you downgrade it to "data"* rather than merely uncertain judgment. Moral claims may lack "correctness" in the same way factual/analytic claims do, making the principle’s truth-tracking framing incomplete here.

  ---

  ### If Forced to Competing Principles (No Unity)
  If the moral intuition case is irreconcilable, these two principles split your verdicts:

  **Candidate A: Cognitive Transparency Principle**  
  *"Inside-view certainty requires real-time error-detection transparency (failures disrupt the cognitive workflow)."*  
  - **Sacrifices:** Moral intuition verdict. It explains logic (transparent error) vs. stats (opaque error), but cannot justify treating moral intuition as "data" rather than just low-confidence belief.  
  - **Retains:** All other verdicts including memory gist vs. detail split.  
  - **Forcing case:** Moral intuition—lacks error-transparency but your verdict demands more radical downgrade than opacity alone implies.

  **Candidate B: Domain-Specific Reliability Principle**  
  *"Inside-view authority scales with the domain's objective calibration history (personal or demographic)."*  
  - **Sacrifices:** Logical derivation verdict. Base rates of logical errors *should* apply if personal calibration is imperfect (e.g., if you’ve made subtle logic errors before).  
  - **Retains:** Moral intuition (demographic bias justifies downgrade), stats (low coder reliability), and others.  
  - **Forcing case:** Logical derivation—you reject outside view despite non-zero error base rates.

  ### Conclusion
  The unified principle (atomicity + failure signals) captures 5/6 cases cleanly and resolves the logic/stats tension by emphasizing *procedural error salience*. It falters only on the moral case’s unique normative downgrade. For your poem test, it correctly prescribes tentativeness. If moral intuition is the sticking point, Candidate A (transparency) is stronger overall—it better explains why you trust atomic logic but distrust complex code, while accommodating your pragmatic approach to memory and philosophy.
