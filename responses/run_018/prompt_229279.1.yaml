prompt: |-
  You are a professional moral philosopher with particular expertise in normative ethics and the ethics of rescue. I am a philosophy professor preparing a seminar on Singer's pond case and its descendants, and I want your help doing some reflective equilibrium on my own considered judgments. Please think carefully. I would like you to begin by brainstorming several candidate principles -- at least three -- before settling on the one you defend, and then to stress-test it rather than merely present it.

  Here are my verdicts on a set of cases. In each, take the stipulations at face value; I am not interested in wriggling out via empirical doubt.

  1. The pond: I pass a shallow pond in which a child is drowning. Wading in costs me a ruined suit worth a few hundred dollars and a missed morning of work. Clearly I must wade in, and it would be monstrous not to.
  2. The donation: I can donate a few hundred dollars to a thoroughly vetted charity that will, with high confidence, use it to save a child's life overseas. I think I am obligated to donate, and my sense is that the obligation is nearly as strong as in the pond case, though I admit it feels less urgent.
  3. The uncertain donation: Same as (2), except the charity's program is promising but genuinely contested -- perhaps a coin flip whether my money saves anyone. I still think I am obligated, and I do not feel the obligation has been halved.
  4. The rough river: A child is drowning in a fast river. I am a strong swimmer, but attempting the rescue carries, say, a one-in-five chance that I drown too. I think attempting it is admirable but not obligatory; declining is no moral failure.
  5. The redundant lifeguards: Five of us on a beach each know that a single text message to the lifeguard station will save a drowning swimmer, and each knows the others know. If everyone assumes someone else has texted, no one does, and the swimmer dies. I think each of us wrongs the swimmer by failing to text, and the wrongness does not feel one-fifth as bad as the pond case.
  6. The permanent tithe: If (2) generalizes, then I am obligated not just to make one donation but to give away everything above a modest sufficiency, year after year, indefinitely, since the need never ends. I find I cannot accept that this is obligatory. At some point the demand becomes unreasonable, even granting that every marginal dollar would do as much good as the first.
  7. The borrowed boat: Reaching the drowning child requires commandeering a stranger's moored rowboat without permission, scratching its hull. I think I am obligated to take the boat, even though the cost falls on an innocent third party and not on me.
  8. The letter and the ledger: I can save an identifiable child whose photograph and name arrive in a charity appeal, or, for the same money, fund a program that will save one statistical child -- no one will ever know which. I feel the duty more strongly in the first case, and I suspect this feeling is indefensible, but it persists.

  My request: give me the principle, or small set of principles, that best systematizes these verdicts. State each principle precisely enough that I can see which clause is doing which work, and identify which case motivates each clause. Two things matter especially. First, I suspect (3) and (4) are in tension: my verdict on the uncertain donation seems to ignore probability while my verdict on the rough river is governed by it, and I want you to tell me whether the relevant difference is cost-risk versus benefit-risk, something about whose life is at stake, or whether one of the two verdicts has to go. Second, (6) and (7) each seem to break the simple "if you can prevent something very bad at small cost, you must" formulation in different directions -- (6) by demanding a cap, (7) by permitting costs to fall on non-agents -- and I want to know whether a single repair handles both.

  Then do three things: (a) tell me which of my eight verdicts your preferred principle cannot accommodate, honestly, and which one you would counsel me to abandon if I value simplicity over completeness; (b) apply the principle to two cases I have not listed -- first, a rescue that requires me to break a serious prior promise made to someone who will be badly harmed by the breach; second, the case where my donation is fully fungible against government funding, so that my gift causes the state to spend less and the net effect on the children is zero; and (c) say, in a sentence or two, what empirical fact, if changed, would most destabilize the principle you have offered.
reasoning: |-
  Okay, the user is a philosophy professor preparing a seminar on Singer's pond case and related thought experiments. They've shared eight specific moral verdicts on different rescue scenarios and want help achieving reflective equilibrium. This is a sophisticated request requiring careful philosophical analysis. 

  Hmm, the professor's verdicts reveal interesting tensions: they accept strong obligations in pond/donation cases but reject extreme demands (permanent tithe), acknowledge probability matters in personal risk (rough river) but not in charitable effectiveness (uncertain donation), and feel unease about statistical vs identifiable victims. 

  First, I need to identify core tensions. The biggest one is between verdicts 3 and 4 - why does probability seem irrelevant in donation uncertainty but crucial in personal risk? Also, verdicts 6 and 7 push against simple cost/benefit analysis in opposite directions. 

  Let me brainstorm principles that could systematize this. The professor wants at least three candidates before I settle on one. 

  Candidate 1: Modified moderate principle. Focuses on direct/immediate harm prevention with cost caps. But this might struggle with verdict 3 where uncertainty is downplayed. 

  Candidate 2: Compounded principle. Combines beneficiary's interest strength with agent's cost limits. Better for verdict 6's demand ceiling but still clunky. 

  Candidate 3: My preferred "Aggregate Moderate Rescue Principle" - distinguishes core cases using directness/alternatives/non-substitutability. This seems most promising but I'll need to stress-test it. 

  *checks verdict 5 (redundant lifeguards)* Ah good, the principle handles this via the "no equally effective alternative" clause since each agent is necessary given others' potential inaction. 

  For the tension between 3 and 4: verdict 4 involves risk to the rescuer's own life (fundamental interest) while verdict 3 risks wasted resources. The principle treats these differently - personal safety risks justify non-intervention when significant. 

  Now for the professor's specific requests: 

  (a) The principle can't easily accommodate verdict 8's identifiability bias. I'd suggest abandoning this intuition for simplicity since statistical lives matter equally. 

  (b) Applying to new cases: 
  - Broken promise case: Obligation likely overridden if breach causes comparable harm (e.g., breaking promise to visit dying parent) 
  - Fungible donations: No obligation if net effect is truly zero - aligns with verdict that only effective actions obligate 

  (c) Destabilizing fact: If we discovered small personal costs could always prevent massive harms (e.g., $1 saves a life), the moderate cost ceiling would collapse. 

  *double-checks* I should emphasize that verdict 7 (borrowed boat) is handled by the "no alternative" clause - property damage to third parties is permitted when necessary for rescue. But this needs justification about why third-party costs are different from personal costs... 

  The professor will probably push back on where to draw the "moderate" cost line - that's intentional, as reflective equilibrium requires revisiting judgments. Might add that "moderate" should be context-sensitive but not subjective. 

  This should give them a robust framework for seminar discussion while being transparent about the remaining tensions in their intuitions.
answer: |-
  Here is a systematic principle that best captures your considered judgments, developed through reflective equilibrium and stress-tested against your cases. I'll begin with candidate principles before defending the preferred one.

  **Candidate Principles:**
  1. **Simple Cost-Benefit Rescue Principle:** "If you can prevent significant harm to another at *moderate cost to yourself*, you are morally obligated to do so."  
     (*Motivated by Pond/Donation cases. Fails Verdict 6 (Permanent Tithe) by demanding too much, and Verdict 4 (Rough River) by ignoring risk to agent.*)

  2. **Direct Harm Mitigation Principle:** "You are obligated to prevent *directly imminent, identifiable harm* you uniquely encounter, if the *cost to yourself is moderate and certain*."  
     (*Motivated by Pond vs. Donation urgency. Fails Verdict 3 (Uncertain Donation) by requiring certainty, and Verdict 5 (Redundant Lifeguards) by requiring uniqueness.*)

  3. **Compounded Rescue Principle (Preferred - Developed Iteratively):**  
     **"You are obligated to prevent serious harm to others if:**  
     **(a) The harm is *imminent or actively occurring* (not merely possible),**  
     **(b) Your action is *necessary* for prevention (no equally effective alternative exists),**  
     **(c) The *net expected cost to you is moderate* (factoring in risk, financial loss, and effort),**  
     **(d) The cost does *not systematically undermine your fundamental interests* (autonomy, basic projects, security),**  
     **(e) Costs to *innocent third parties are proportionate* to the harm prevented."**  

  ---

  **How the Compounded Principle Captures Your Verdicts:**  
  - **Pond (1):** Imminent harm (a), necessary action (b), moderate cost (c), no fundamental interest undermined (d), no third-party cost (e). **✓**  
  - **Donation (2):** Harm is actively occurring (starvation/disease) (a), necessary if no one else donates (b), moderate cost (c), no fundamental interest undermined (d). *Note: (a) resolves "urgency" difference.* **✓**  
  - **Uncertain Donation (3):** Harm is actively occurring (a), action necessary (b) *even with uncertainty* (expected value still high), moderate cost (c). *Probability is ignored because cost is low and harm is ongoing.* **✓**  
  - **Rough River (4):** Harm imminent (a), but net cost to you is *immoderate* due to 20% death risk (c), which undermines fundamental interests (d). Thus, not obligatory. **✓**  
  - **Redundant Lifeguards (5):** Harm imminent (a), *each* agent's action is necessary *conditional on others' potential inaction* (b), cost trivial (c). Wrongness isn't diluted because each failure is a direct causal omission. **✓**  
  - **Permanent Tithe (6):** Violates (d) – indefinite giving undermines autonomy and life projects. A "moderate sufficiency" cap protects fundamental interests. **✓**  
  - **Borrowed Boat (7):** Harm imminent (a), necessary action (b), moderate cost *to you* (c), but cost to third party (scratch) is *proportionate* to saving a life (e). **✓**  
  - **Letter vs. Ledger (8):** *Identifiability bias* is not justified by the principle – both cases satisfy (a)-(e). Principle implies equal obligation. **✗ (Your feeling is indefensible per the principle)**  

  ---

  **Addressing Tensions:**  
  - **Verdict 3 (Uncertain Donation) vs. Verdict 4 (Rough River):**  
    The difference is **cost-risk vs. benefit-risk**. In (3), the *cost* to you is certain (lost money), while the *benefit* is probabilistic. In (4), the *cost* to you is probabilistic (death risk). The principle treats *cost-risk* (threatening *your* fundamental interests) as decisive (clauses c/d), but *benefit-risk* is secondary if harm is ongoing (a) and expected value remains high. Thus, no tension – the cases differ in *what* is uncertain.  

  - **Verdict 6 (Tithe Cap) vs. Verdict 7 (Third-Party Cost):**  
    Both break the simple "small cost" formula but are resolved by distinct clauses:  
    - (6) is handled by **clause (d)** – protecting the agent's fundamental interests.  
    - (7) is handled by **clause (e)** – permitting *proportionate* costs to third parties when necessary.  
    *No single repair* – the two exceptions address different moral dimensions (agent integrity vs. distributive justice).  

  ---

  **Stress-Testing the Principle:**  
  **(a) Verdicts the Principle Cannot Accommodate + Simplicity Advice:**  
  - **Cannot Accommodate:** **Verdict 8 (Letter vs. Ledger)**. The principle demands equal obligation for identifiable/statistical lives. Your persistent feeling is incompatible.  
  - **Abandon for Simplicity:** **Verdict 3 (Uncertain Donation)**. If you insist on probability-sensitivity, rejecting (3) simplifies the principle (allowing benefit-risk to weaken obligation). But this loses key insight: uncertainty in aid effectiveness shouldn’t paralyze action when stakes are high and costs low.  

  **(b) New Cases:**  
  - **Broken Promise Rescue:** You must break a promise to visit a dying friend to save a drowning child.  
    *Application:* Harm imminent (a), action necessary (b), cost to you (guilt) moderate (c), but cost to friend (abandonment) may be *disproportionate* if it severely undermines their fundamental interests (e). **Obligation overridden only if harm to promisee ≈ harm to child.**  
  - **Fungible Donation:** Your $100 donation causes the government to reduce aid by $100. Net impact: zero.  
    *Application:* Fails (b) – your action is *not necessary* (no net prevention). **No obligation.**  

  **(c) Destabilizing Empirical Fact:**  
  If we discovered that **all marginal donations have near-zero expected value** (e.g., due to systemic corruption or aid saturation), clauses (a) and (b) would rarely apply, collapsing the obligation to donate.  

  ---

  **Final Defense:**  
  This principle systematizes your core intuition: rescue is non-negotiable when harm is pressing, action is needed, and sacrifice is bounded. It distinguishes cost-risk (limiting demands) from benefit-risk (not excusing inaction), and permits third-party costs proportionately. Its key strength is balancing urgency **(a/b)**, agent limits **(c/d)**, and justice **(e)**. Verdict 8 is the outlier, but abandoning identifiability bias aligns with impartiality – the ledger child is as real as the letter child. Use this tension to spark seminar debate on moral psychology versus principle.
