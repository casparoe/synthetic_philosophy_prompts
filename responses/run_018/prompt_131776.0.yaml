  ## Villanelle: On Schlick's Wheel

  Not labour's yoke, but play's the thing that sings (A1)  
  Where purpose dies, and meaning takes its hold.  
  No harvest sought, just flight on futile wings.  

  The addict's ritual, the thread he strings,  
  Obsessive patterns, bright and uncontrolled –  
  **Not labour's yoke, but play's the thing that sings.** (A1)  

  The dancer lost where no applause yet rings,  
  The gambler's throw, the story left untold –  
  No harvest sought, just flight on futile wings.  

  Whilst Schlick finds grace where joy spontaneous springs,  
  In children's shouts beneath the sun's bright gold,  
  **Not labour's yoke, but play's the thing that sings.** (A1)  

  But see the wheel that breaks the soul it brings, (A2)  
  The purest Spiel, where all intention's cold –  
  No harvest sought, just flight on futile wings.  

  The clockwork heart its empty cadence flings,  
  Ixion's torment, endlessly enrolled.  
  **Not labour's yoke, but play's the thing that sings,** (A1)  
  **The wheel that breaks the soul is Spiel that rings.** (A2)

  ---

  **Commentary on formal choices**

  The villanelle’s defining structure – the insistent recurrence of its two refrains (A1 and A2) – directly enacts the poem’s conceptual core: purposeless repetition. Just as Schlick’s *Spiel* finds meaning in activity detached from external ends (*Arbeit*), the form’s cyclical returns operate without narrative progression, mirroring the "compulsive or destructive repetition" the poem explores. The refrains orbit each other through the tercets, encountering different contexts but never resolving their inherent tension – the Schlickian ideal (A1) versus its unsettling, potentially monstrous realisation (A2). This lack of synthesis in the middle stanzas embodies the philosophical impasse.

  The final quatrain forces the refrains into jarring proximity. Line 17 restates Schlick’s foundational claim (A1). Line 18 then follows immediately with the dark corollary (A2), stripped of intervening text. This stark juxtaposition in the closing couplet denies resolution. The proximity intensifies the tension, leaving the reader to confront the uncomfortable equivalence suggested: the "wheel that breaks the soul" *is* presented as the ultimate manifestation of "play's the thing that sings." The form’s inherent repetitiveness becomes the vehicle for this unresolved, potentially destructive, meaning.

  ---

  **Key formal adherence:**
  *   Structure: 5 tercets + 1 quatrain.
  *   Refrain Pattern: A1 (line 1), A2 (line 3), A1 (line 5), A1 (line 9), A2 (line 15), A1 (line 17), A2 (line 18).
  *   Rhyme Scheme: ABA ABA ABA ABA ABA ABAA (standard villanelle).
  *   Metre: Predominantly iambic pentameter.
  *   British English: "whilst", "labour" (Schlick's *Arbeit*), "rings" (verb), "cadence", etc.
