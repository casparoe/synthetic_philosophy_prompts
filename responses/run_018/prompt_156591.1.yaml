prompt: |-
  I'm a regional commons governance officer who reviews ten to fifteen resource-management proposals each year for a highland watershed that operates as what I call an asymmetric common-pool public good (ACPPG): the alpine meadow is subtractable for local herders practicing rotational grazing, since grass cover depletes with consumption and regenerates on an annual cycle, yet it simultaneously produces non-rival, intergenerational benefits for a migratory bird population that nests there on a multi-year return cycle, where nesting success depends on grass height but the birds cannot be excluded and do not consume the stock on the same temporal scale. I have roughly forty-eight hours per proposal, must sign off with written justification, and work with a team that has no philosophical training; I need a reusable decision procedure—ordered questions, criteria for a sufficient answer, explicit stop points that return a "no" or hand the decision to a human values judgment—grounded in the logic of common-pool resource design principles and public-goods provision theory, but translated so a non-specialist can run it offline without consulting literature.

  The procedure should handle proposals that mix technical management—grazing quotas, seasonal closures, fencing, predator control—with claims about justice to present herders and obligations to future bird populations. Specifically, it must distinguish exclusion mechanisms that are technically feasible for one dimension (issuing grazing permits) from those impossible for another (preventing bird access), account for temporal asymmetry in regeneration (annual grass versus multi-year bird cycles), and flag when a proposal solves a collective-action problem for one group while externalizing costs onto a non-participating group. Apply it to three proposals: (a) a rotational-grazing permit system combined with delayed nesting-zone closures; (b) installing permanent fencing to protect nesting grounds, which would physically exclude herders from parts of the meadow; and (c) a predator-culling program intended to boost bird numbers without restricting grazing. One of these should yield a recommendation my office will find politically unwelcome, and the procedure should still produce it clearly. Throughout, mark which steps are empirical checks and which are unavoidable judgment calls about values.

  Please structure your response as follows, in this order: "The Procedure" (approximately 350 words), presenting the ordered checklist with stop conditions and explicit flags for value judgments; "Three Worked Cases" (approximately 450 words), running the procedure on proposals (a), (b), and (c) with explicit answers including the unwelcome one; "What the Procedure Cannot Do" (approximately 200 words), stating where empirical gaps force a handoff, where the framework misfires, and which philosophical disagreements remain open; and "Settled vs. Contested" (approximately 150 words), separating claims that are broadly accepted in resource economics and political philosophy from those that depend on contested normative premises—especially regarding intergenerational justice and the moral status of non-human animals—without presenting any contested view as the consensus. Do not include bibliographies, reading lists, or citations.
reasoning: |-
  Okay, let's break down this complex request from a regional commons governance officer. The user needs a practical decision-making tool for evaluating resource management proposals in an asymmetric common-pool public good (ACPPG) scenario involving herders and migratory birds. 

  First, I need to understand the core challenge: balancing subtractable grazing resources with non-rival bird habitat benefits across different time scales. The officer works under tight deadlines (48 hours per proposal) with a non-specialist team, so the procedure must be operational without academic references. Key requirements include distinguishing exclusion feasibility (possible for herders, impossible for birds), handling temporal mismatches (annual vs multi-year cycles), and identifying cost externalizations.

  The procedure design should anchor in established commons governance principles (Ostrom) and public goods theory, but translate them into actionable steps. I'll structure it as a flowchart-like checklist with: 1) problem framing questions, 2) technical feasibility checks, 3) collective action analysis, and 4) cost allocation assessment. Critical stop points must flag when proposals fail basic viability tests or require value judgments about intergenerational or interspecies justice.

  For the worked cases: Proposal (a) combines permits with delayed closures - likely acceptable with minor tweaks. Proposal (b) uses fencing to exclude herders - may trigger "no" due to disproportionate cost-shifting. Proposal (c) predator culling without grazing restrictions - this will be the politically unwelcome rejection since it ignores grazing pressure while claiming bird conservation benefits.

  I anticipate two major limitations: 1) Empirical gaps in ecological predictions will force handoffs to specialists, and 2) The framework can't resolve deep philosophical conflicts about non-human entitlements. The "Settled vs Contested" section must clearly separate economic consensus (e.g. need for exclusion mechanisms) from normative disagreements (e.g. whether birds have intrinsic rights).

  The political sensitivity requires special handling - the procedure must produce the unwelcome verdict on (c) unambiguously, showing how it externalizes costs to birds while benefiting herders. This demonstrates intellectual integrity despite potential backlash.
answer: |-
  ## The Procedure: ACPPG Review Checklist

  **Purpose:** To systematically evaluate proposals for managing the asymmetric common-pool public good (ACPPG) – balancing subtractable grazing for herders (annual cycle) with non-rival nesting habitat for migratory birds (multi-year cycle). Aims for efficiency, clarity, and flagging value conflicts.

  1.  **Define the Problem & Beneficiaries:**
      *   *Question:* What specific collective-action problem(s) does this proposal attempt to solve? (e.g., overgrazing by herders? Bird population decline? Both?) Who are the intended primary beneficiaries? (Herder group? Bird population? Both?)
      *   *Sufficient Answer:* Clear statement of target problem(s) and beneficiary group(s). Must specify *which* group's collective action is being addressed.
      *   *Stop Point:* If problem/beneficiary is undefined or incoherent, RETURN TO PROPOSER for clarification.

  2.  **Exclusion Feasibility Check:**
      *   *Question:* Does the proposal rely on excluding users? For *which* resource dimension (grazing/grass OR bird nesting)? Is this exclusion technically and institutionally *feasible* for that dimension?
      *   *Sufficient Answer:* Explicit identification of exclusion target (herders vs. birds) and a plausible mechanism (e.g., permits/fences for herders feasible; excluding birds impossible).
      *   *Stop Point:* If proposal assumes feasible exclusion of birds, REJECT (Technical Impossibility). If exclusion mechanism for herders is implausible (e.g., unenforceable permits), REJECT (Infeasible Design).

  3.  **Resource Regeneration & Temporal Fit:**
      *   *Question (Empirical):* Does the proposal's management timeline align with the *regeneration rate* of the resource it impacts? Specifically: Does it respect the *annual* grass regrowth cycle for grazing? Does it account for the *multi-year* bird return/nesting cycle for habitat quality? (e.g., Are restrictions timed correctly? Is impact monitoring planned on relevant timescales?)
      *   *Sufficient Answer:* Evidence or logical plan showing alignment with the relevant biological timescale(s). Explicit acknowledgment of different cycles.
      *   *Stop Point:* If proposal demonstrably ignores the critical timescale for either resource (e.g., ignores multi-year habitat needs, allows grazing during critical regrowth), REJECT (Temporal Mismatch).

  4.  **Cost-Benefit Allocation & Externalities:**
      *   *Question:* Who bears the primary costs (restrictions, labor, fees) of the proposal? Who receives the primary benefits? Does the proposal shift costs onto groups who do not participate in, or benefit from, the collective action being solved?
      *   *Sufficient Answer:* Clear mapping of costs and benefits to specific groups (e.g., herders, downstream water users, future herders, bird population).
      *   *Value Judgment Flag:* Is the identified cost-shifting *acceptable*? (e.g., Is it fair to burden only herders for bird habitat? Is burdening *future* herders/birds justified by current benefits?) **THIS IS AN UNAVOIDABLE VALUE JUDGMENT.** Proceed to Step 5.

  5.  **Value Judgment Assessment:**
      *   *Question:* For any cost-shifting or trade-off identified in Step 4, does the proposal provide a *justification* based on principles of fairness, equity, or intergenerational justice? Do *we* (the reviewers, representing societal values) find this justification sufficient?
      *   *Sufficient Answer:* A reasoned argument addressing the fairness of the trade-off, especially concerning non-participating groups (like the birds/future generations).
      *   *Stop Point:* If cost-shifting is severe and lacks any plausible justification, REJECT (Unfair Cost Externalization). If justification exists but is contested, PROCEED WITH CAUTION – Handoff for broader stakeholder/policy input may be needed. If minimal cost-shifting or well-justified, APPROVE.

  ---

  ## Three Worked Cases

  *   **Proposal (a): Rotational Grazing Permits + Delayed Nesting-Zone Closures**
      *   **Step 1:** Solves herder overgrazing (collective action for herders). Primary beneficiaries: Herders (sustainable grass) & Birds (if closures work). Clear.
      *   **Step 2:** Exclusion via permits for herders = feasible. No attempt to exclude birds. Pass.
      *   **Step 3 (Empirical):** Rotational grazing aligns with *annual* grass cycle. *Critical Check:* Do "delayed" closures still align with the *multi-year* bird nesting cycle? (e.g., Are they delayed *past* the critical nesting period?) **Requires empirical verification of closure timing vs. actual nesting dates.** If misaligned, REJECT (Temporal Mismatch). If aligned, Pass.
      *   **Step 4:** Costs (restricted grazing) borne by herders. Benefits (sustainable grazing, potential bird habitat) go to herders *and* birds. Minor cost-shifting? Herders bear cost for bird benefit, but also benefit indirectly from healthy ecosystem. Minimal externalization.
      *   **Step 5 (Value Judgment):** Minor cost-shifting (herders -> birds) seems justified as herders *use* the shared resource and birds provide non-rival benefits. **APPROVE (pending Step 3 empirical verification).**

  *   **Proposal (b): Permanent Fencing to Protect Nesting Grounds (Excludes Herders)**
      *   **Step 1:** Solves habitat degradation *from grazing* for birds. Primary beneficiary: Bird population. Clear.
      *   **Step 2:** Exclusion via fencing for herders = feasible. Pass.
      *   **Step 3 (Empirical):** Protects habitat on bird multi-year cycle. Grass inside fence regenerates annually unrestricted. Pass.
      *   **Step 4:** Costs (Lost grazing land, fence maintenance) borne *entirely* by herders. Benefits (Improved bird nesting) go primarily to birds (non-rival, but herders may not value directly). **Significant cost-shifting:** Herders bear cost for a benefit they may not participate in (bird conservation), while birds/future humans benefit freely. Herders are excluded from part of the common-pool resource.
      *   **Step 5 (Value Judgment):** Is this severe cost-shifting onto herders justified purely for bird conservation? **This is a major value conflict.** The proposal lacks inherent justification for fairness to herders. Burden is disproportionate. **REJECT (Unfair Cost Externalization).** *This is the politically unwelcome recommendation, as it prioritizes herder access over a conservation measure.*

  *   **Proposal (c): Predator Culling to Boost Bird Numbers (No Grazing Restrictions)**
      *   **Step 1:** Solves perceived problem of bird decline *due to predation*. Primary beneficiary: Bird population (claimed). **Problem Framing Issue:** Ignores grazing impact on habitat (grass height).
      *   **Step 2:** No exclusion mechanisms proposed. N/A.
      *   **Step 3 (Empirical):** Predator control timing might align with bird cycle, but **Critical Omission:** Does unrestricted grazing degrade the habitat (grass height) needed for nesting *despite* fewer predators? **Empirical gap:** Proposal ignores the core ACPPG conflict (grazing subtractability vs. nesting habitat). Likely Temporal Mismatch for habitat needs.
      *   **Step 4:** Costs (Culling effort, ethical concerns, ecological disruption) borne by society/ecosystem. Benefits (Potentially more birds) go to birds/future humans. **Significant Externalization:** Herders face *no* restrictions (benefit), but the *cause* of bird decline (habitat degradation from grazing) remains unaddressed, externalizing costs onto the bird population/future generations. Proposal solves a problem (predation) potentially irrelevant to the main ACPPG dynamic.
      *   **Step 5 (Value Judgment):** Fails Step 3 (ignores core temporal/resource conflict). Cost-shifting (grazing impact -> birds) is severe and unaddressed. **REJECT (Temporal Mismatch & Unfair Cost Externalization).**

  ---

  ## What the Procedure Cannot Do

  1.  **Resolve Deep Value Conflicts:** It flags value judgments (Steps 4/5) but cannot resolve fundamental disagreements (e.g., intrinsic bird rights vs. herder livelihood primacy). These require political/societal deliberation.
  2.  **Fill Empirical Gaps:** It relies on empirical inputs (Step 3, parts of Step 1 & 4). If critical data is missing (e.g., precise bird nesting dates, actual impact of grazing density on fledgling success), the procedure stalls at the relevant empirical check, forcing a handoff for expert consultation or recommending conditional approval pending monitoring. It cannot generate missing science.
  3.  **Predict Complex System Effects:** It assesses proposal logic and fairness but cannot reliably predict long-term, non-linear ecological or social outcomes (e.g., unforeseen consequences of predator culling, changing herder demographics).
  4.  **Handle Extreme Novelty:** Proposals introducing radically new technologies or governance models might not fit the Ostromian/public goods framework neatly, potentially misfiring the assessment.
  5.  **Define "Sufficient Justification":** The threshold for acceptable cost-shifting justification (Step 5) remains inherently subjective and context-dependent.

  ---

  ## Settled vs. Contested

  *   **Settled (Broad Consensus in Resource Economics/Political Philosophy):**
      *   Common-pool resources (CPRs) require governance to avoid overuse (tragedy of the commons).
      *   Exclusion is necessary for managing subtractable resources but must be feasible.
      *   Resource management rules must align with the renewal rate of the resource (temporal fit).
      *   Solving one collective-action problem can create or exacerbate others (e.g., externalities).
      *   Cost-benefit analysis is essential, and unfair cost-shifting is a governance failure.
      *   Clear boundaries (user and resource) and monitoring are key design principles for CPRs.

  *   **Contested (Normative Premises):**
      *   **Intergenerational Justice:** The moral weight owed to *future* human generations (and thus the level of sacrifice demanded of *present* herders for future bird/human benefits) is deeply debated (e.g., strong vs. weak sustainability, discount rates).
      *   **Moral Status of Non-Human Animals:** Whether birds (or ecosystems) have intrinsic value deserving direct consideration in governance *beyond* their instrumental value to humans, and how this translates into specific rights or protections against cost-shifting (e.g., from Proposal b or c), is fundamentally contested.
      *   **Fairness Metrics:** What constitutes a "fair" distribution of costs and benefits between herders and non-herding beneficiaries (including non-human ones) lacks a single agreed-upon standard (e.g., proportionality, priority to worst-off, historical rights). The procedure flags the *need* for justification but cannot define *the* correct one.
