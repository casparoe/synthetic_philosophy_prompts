prompt: |-
  I run a workshop for second-year philosophy of science students — maybe fifteen of them — and I want them to actually get the etiological vs causal-role split on biological function, not just parrot it back. I'm tired of the heart-pumping example, every textbook uses it. So I want to build the session around a synthetic case: imagine we've enginered a gut micro-biome module that secretes an enzyme to break down microplastics, whilst as a side-effect it also regulates intestinal pH in a way that protects the lining. One account says its function is plastic-breakdown because thats what it was designed and selected for; the other says its function is pH-regulation because thats the causal contribution it makes right now, regardless of origin.

  Plan the arc for me. What idea has to come first — that 'function' can mean either evolutionary history or present causal job? — and in what order do the pieces depend? What's the carrying example, and what must it have and lack so the two accounts don't just blur together? I want to know the misconceptions they'll bring — maybe that designer intention is all there is, or that evolutionary history is just a story with no bearing — and exactly where in the sequence I should knock each one down. Give me a check at the end to show they've actually learnt it, not just repeated the jargon, and tell me what I should refuse to cover in fifty minutes — maybe the full selectionist literature? — and say so clearly. Also, I keep writing 'causal-role' but sometimes I mean 'systemic contribution'; should I fix that slip or lean into it?
reasoning: |-
  Okay, the user runs a workshop for second-year philosophy of science students and wants to teach the etiological vs. causal-role distinction in biological function. They're tired of the overused heart-pumping example and want a synthetic case study instead. Let me unpack their needs.

  First, the main request is for a lesson arc using a novel example. The gut micro-biome module example seems perfect—it has both a designed purpose (breaking down microplastics) and a current effect (pH regulation). But I need to ensure this example clearly separates the two accounts. The key is that the designed function isn't contributing now, while the side effect is crucial. So in the example, maybe the plastic breakdown isn't active in the gut, but pH regulation is vital. That forces the distinction: etiological points to design, causal-role to current effect.

  Next, the user wants to address misconceptions. Common ones might include conflating design with function, thinking evolution is just a story, or assuming that current utility defines function. I should tackle these step-by-step. Start by distinguishing teleology from evolution, then challenge intentional design as the sole source of function. Show that history matters even without a designer. Then, highlight that current contributions don't override historical origins. Each misconception needs a specific moment in the workshop to be addressed.

  The user also needs a check for understanding. Rather than jargon, I should suggest asking students to generate their own examples. This ensures they can apply the concepts, not just repeat definitions. Plus, an exit ticket question that forces them to contrast the two views in the context of the example would be good.

  Time management is crucial. Fifty minutes is tight. The user must avoid deep dives into selectionist literature or multiple examples. Stick to the synthetic case, clarify the split, and address misconceptions. Cut out tangents on non-biological functions or debates about selection types.

  Terminology: "Causal-role" vs. "systemic contribution." The user is right to notice the slip. I should standardize to "causal-role function" as it's the established term. Emphasize that it's about the current role within a system, which aligns with systemic contribution. Clarify this early to avoid confusion.

  Underlying needs: The user wants students to grasp the conceptual split deeply, not superficially. They need engagement through a fresh example, active learning, and misconception tackling. The real goal is critical thinking application, enabling students to navigate function debates in philosophy of biology. So the structure must build step-by-step, challenge assumptions, and assess application.

  Finally, the arc: Start with the ambiguity of "function" using everyday examples. Introduce the gut module case. Dissect it using both accounts. Highlight the conflict. Address misconceptions at each stage. Then solidify with application. End with a brief check. Keep it focused, interactive, and within time limits.
answer: |-
  Here’s a focused 50-minute workshop arc using your synthetic case, designed to force conceptual clarity and combat misconceptions:

  **Core Structure & Dependencies:**  
  1. **Problem Setup: "Function" is Ambiguous** (5 mins)  
     - *Start with everyday confusion:* Ask students: "When we say a smartphone camera’s *function* is photography, do we mean what it was *designed for* or what it *actually does* daily (e.g., scanning QR codes)?"  
     - *Key insight:* Establish that "function" has **two common meanings**: historical purpose (why it exists) vs. current causal job (what it contributes now).  

  2. **Introduce Synthetic Case & Force the Split** (10 mins)  
     - Present your engineered gut module:  
       - *Designed/selected for:* Breaking down microplastics (e.g., inserted to combat plastic pollution).  
       - *Current causal role:* Regulating intestinal pH (unintended, but now critical for gut health).  
     - **Crucial tweak to avoid blurring:** The microplastic enzyme *isn’t actively breaking down plastic* in the gut (e.g., plastics now rare; enzyme is dormant). Meanwhile, pH regulation is *vital* to the host’s survival.  
     - *Pose the conflict:* "Is its *function* plastic breakdown (why we made it) or pH regulation (what it’s doing now)?" Elicit initial votes/reasons.

  3. **Define the Two Accounts Using the Case** (15 mins)  
     - **Etiological (History/Selection-Based) View:**  
       - Function = what the trait was **selected for** (by designers/evolution). Here: plastic breakdown.  
       - *Misconception target:* "Designer intention is all that matters." **Knock down:** Ask: "If we *thought* we selected it for X, but actually selected it for Y due to flawed testing, does intention trump real selection history?" (→ No: actual selection, not intention, matters).  
     - **Causal-Role (Systemic) View:**  
       - Function = the **current causal contribution** to a system’s goals (e.g., organism survival). Here: pH regulation.  
       - *Misconception target:* "Evolutionary history is just a story." **Knock down:** Ask: "If pH regulation started yesterday due to a mutation, is it *already* the function?" (→ Yes for causal-role; no for etiological).  
     - *Terminology note:* **Use "causal-role function" consistently.** "Systemic contribution" is its core, but "causal-role" is the standard term. Fix the slip to avoid confusion.

  4. **Apply & Contrast: Why the Split Matters** (15 mins)  
     - *Scenario test:* "The module mutates: loses plastic-breakdown ability but *enhances* pH regulation. Did it…  
       - (a) Lose its function? (Etiological: yes)  
       - (b) Gain a new function? (Causal-role: yes, if pH regulation improves)"  
     - *Critical question:* "If we found this module in a wild animal (no designer), how would we decide its function?"  
       - Etiological: Look for evidence of natural selection (e.g., fossil plastics? Co-occurrence with plastic-rich niches?).  
       - Causal-role: Experimentally disable it and see if pH dysregulation harms the animal.  

  5. **Check for Understanding (Not Jargon)** (5 mins)  
     - *Exit ticket (written):* "A bird’s feathers *evolved* for insulation, but now enable flight. Using the gut module analogy, explain why an etiologist vs. causal-role theorist would disagree on the *primary function* of feathers."  
     - *Success criteria:* Student answers must:  
       - Correctly assign insulation (etiological) and flight (causal-role).  
       - Reference *selection history* vs. *current contribution to survival/reproduction*.  
       - Avoid merely naming "etiological" and "causal-role."  

  **What to REFUSE to Cover (Stay Focused in 50 Mins):**  
  - ✘ **Detailed selectionist debates** (e.g., adaptationism vs. exaptation, unit of selection).  
  - ✘ Other function theories (e.g., goal-contribution, organizational).  
  - ✘ Non-biological functions (e.g., artifacts)—stick to biological context.  
  - ✘ Deep dives into evolutionary mechanisms (drift, constraints).  

  **Common Misconceptions & When to Address Them:**  
  1. **"Function = designer’s intention"**: Debunked in Step 3 (Etiological) by emphasizing *actual selection history* over intent.  
  2. **"History is irrelevant; only present matters"**: Challenged in Step 4 by showing how history defines malfunctions (e.g., a mutated heart still pumping poorly).  
  3. **"If it’s useful now, that’s its function"**: Refuted by contrasting the gut module’s *current* pH role with its *historical* plastic role.  
  4. **"Both views say the same thing"**: Forced apart by the mutation scenario in Step 4.  

  **Why This Works:**  
  - Your synthetic case **isolates the conflict** by decoupling historical purpose (dormant) from current utility (vital).  
  - Students **confront ambiguity** early (Step 1), then **resolve it** via theory (Step 3), and finally **apply it** to novel cases (Step 4).  
  - The check assesses **transfer**, not memorization.  

  **Final Tip:** Use a live poll (e.g., Mentimeter) for initial votes in Step 2 and the mutation scenario in Step 4. Visualizing disagreement makes the theoretical split tangible.
