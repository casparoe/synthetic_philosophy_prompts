prompt: |-
  hey — I'm in 11th grade and I do Ethics Bowl, and one of our cases this year is about a school district that can only afford one of two things: an elevator for one girl who uses a wheelchair (right now someone has to carry her up a flight of stairs between classes, which is humiliating and she misses a lot of class), or new textbooks for about 1,800 kids where the benefit to each kid is pretty small. Our coach told me to look up Scanlon's contractualism because it says something interesting about cases where one person's loss is huge and everyone else's is tiny. I found a blog post explaining it and pasted a chunk into my notes:

  "Scanlon's contractualism says that an act is wrong if there is some principle for the general regulation of behaviour that no one could reasonably reject and that forbids the act. The 'no one could reasonably reject' bit puts it in the social contract tradition: morality is what self-interested people would agree to in a bargain, with the word 'reasonable' added to make it sound less brutal than Hobbes or Gauthier. The important upshot is that contractualism cannot add up benefits and burdens across different people. You have to look at each person's complaint one at a time, from that person's own point of view, and ask which complaint is strongest — you can never pile up a thousand weak complaints to beat one strong one. So numbers basically drop out entirely: one person losing a hand outweighs any number of people getting a stubbed toe, and one death outweighs any number of mild headaches, no matter how many. This means contractualism quietly collapses into Rawls-style maximin, since you always end up asking which single individual is worst off under each option. And because what matters is whether people actually object, anyone who complains loudly enough can effectively veto a principle, while burdens nobody bothers to complain about create no complaint at all. That last feature is what sinks the theory: no sane moral view says that one person's stubbed toe matters more than a million people's stubbed toes."

  My coach read my notes and just said the post is "caricature-grade" and walked off, which isn't super helpful. Can you go through it and tell me which bits are basically right, which are the kind of subtle misreading a defender of Scanlon would object to (like what two things are being conflated), and whether the "that's what sinks the theory" bit at the end actually follows from the parts that are true? I think I half-believe the numbers part because that's the part that makes it different from utilitarianism, but I genuinely can't tell where the summary stops being fair.

  Two more things. First: a commenter on the post said the standard contractualist fix is that complaints get ranked by strength and numbers only break ties between complaints of equal strength. Is that Scanlon's actual move or something a commenter made up, and does it help with the elevator case or does the elevator just win no matter how tiny the per-kid textbook benefit gets? Second, I keep wondering about a weird variant: what if instead of 1,800 kids each getting one small benefit, it's the same one kid getting a small benefit 1,800 times? If the answer changes there, that seems like it shouldn't matter as much as people think, but I can't say why. Anyway — no reading recs, I just want to know what's actually going on with the view.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're an 11th grader involved in Ethics Bowl, dealing with a specific case about a school district choosing between an elevator for a disabled student and textbooks for many students. They've encountered a blog post critiquing Scanlon's contractualism and need help distinguishing accurate points from misrepresentations. 

  First, I notice the user is clearly bright and engaged—they're parsing complex ethical theory for a competition, and they've identified subtle logical wrinkles (like their "same kid 1,800 times" variant). Their coach dismissed the blog post as "caricature-grade," which frustrated them, so they need clarity, not just dismissal. The core tension they're wrestling with is: does contractualism really ignore numbers entirely? And if so, is that defensible?

  The blog post makes four main claims: (1) contractualism prohibits aggregating small harms to outweigh big ones, (2) this makes it collapse into maximin, (3) complaints are vetoes based on loudness, and (4) that "sinks the theory." I need to triage these. 

  On claim 1: The no-aggregation point is mostly correct—it's Scanlon's famous "individualist restriction." But the "stubbed toe vs. lost hand" example *is* how Scanlon argues (see WWO p. 235). Where the post errs is implying contractualism *always* prioritizes the worst-off. It's not that simple—you compare each person's burden *under alternative principles*, not just absolute suffering. For the elevator case, the wheelchair user's complaint ("I'm carried like a sack of potatoes") vs. each textbook kid's ("I learn 5% slower")—Scanlon would likely side with the elevator because the humiliation is non-comparable. But if textbooks prevented serious harms (e.g., illiteracy), it might balance. 

  Claim 2 about maximin is shaky. Scanlon explicitly rejects maximin (WWO p. 218) because contractualism weighs *all* complaints, not just the worst-off's. Maximin is rigid; contractualism is comparative. The blog post misses that nuance. 

  Claim 3 is flat wrong. "Loudness" doesn't matter; reasonableness does. If you're reasonably forfeiting a benefit (like the textbook kids), your silent burden still counts. The veto power is about unrejectable principles, not volume. 

  Claim 4's "that sinks the theory" is hyperbolic. Scanlon has counterarguments—e.g., burdens must be "generic" (affect anyone in that position) and "impartial" (no special pleading). The blog reduces it to "squeaky wheel gets the grease," which isn't fair. 

  Now the user's two extras: First, the tiebreaker suggestion isn't Scanlon's move. He rejects aggregating weak complaints *even for tiebreaking* (WWO p. 232-34). For the elevator, unless textbook shortages caused comparable harms (unlikely), the elevator wins. Second, their "same kid 1,800 times" variant is brilliant—it exposes whether contractualism cares about *distribution* or just *per-person* magnitude. Scanlon would treat it as one kid's aggregated small burdens, which *could* outweigh another's single big burden (e.g., 1,800 stubbed toes vs. one headache). That's a feature, not a bug—it shows contractualism opposes *interpersonal* aggregation, not *intrapersonal*. 

  The user's deeper need: they want to apply this to their Ethics Bowl case without oversimplifying. They sense the textbook/elevator dilemma pits compassion against efficiency, and they need tools to articulate why Scanlon might favor the elevator without ignoring group needs. I should emphasize that contractualism isn't "anti-numbers"—it's about distinguishing trivial burdens from meaningful ones. In practice, for their case, the elevator's justification isn't just "one vs. many," but the *type* of harm: dignity vs. convenience. 

  Also, the user might be anxious about misrepresenting theory in competition. I’ll flag where the blog’s errors could trip them up (e.g., the "maximin collapse" is a common oversimplification judges might challenge). 

  Final thought: Their coach’s "caricature" comment was unhelpful because it didn’t specify *what* was distorted. I’ll model precise correction—e.g., "The post is right about X but wrong about Y because Z." That’s what they came for.
answer: |-
  Okay, let's break down that blog post, Scanlon's actual view, and how it applies to your Ethics Bowl case. Your coach is right that the post is a caricature, but it *does* grab onto a real and important feature of contractualism – it just distorts, exaggerates, and misunderstands key parts. Here's the analysis:

  **What the Blog Post Gets Basically Right:**

  1.  **The Core Anti-Aggregation Insight:** The central point – that Scanlon's contractualism **does not allow simply adding up small benefits or burdens across many people to outweigh a very large burden on one person** – is fundamentally correct. This is the "Individualist Restriction." For your case, this *strongly suggests* that the wheelchair user's complaint (humiliation, missed class, physical dependence) cannot be overridden by the combined *minor* inconveniences of 1,800 students getting slightly older textbooks.
  2.  **The Focus on Individual Complaints:** The idea that you must evaluate each person's potential complaint ("reason for rejection") against a proposed principle *from their own perspective* and assess its *strength* is accurate.
  3.  **The Difference from Utilitarianism:** It correctly identifies this as the key distinction from utilitarianism, which *does* aggregate.

  **Where the Blog Post Subtly (or Not-So-Subtly) Misreads/Misrepresents Scanlon (Conflations & Errors):**

  1.  **Conflation: "Strongest Complaint" vs. "Unreasonable to Reject":** The post constantly talks about finding the "strongest complaint" or what "outweighs" what. **This is misleading.** Scanlon doesn't ask "Which complaint is *strongest*?" He asks: **"Could anyone *reasonably reject* a principle permitting/requiring this action, given the burdens it imposes on *them*?"** You then compare alternative principles. The question isn't "Is A's complaint stronger than B+C+D...?" but "Is there an alternative principle that *no one* (including A) could reasonably reject?" The focus is on finding mutually acceptable principles, not a battle of complaint-strength.
      *   *Why it matters:* It shifts from a zero-sum fight to a search for justification. The wheelchair user *can* reasonably reject a principle that forces her to endure humiliation and exclusion. The other students likely *cannot* reasonably reject a principle that gives her the elevator, even if it means slightly older books (assuming the burden is genuinely minor).
  2.  **Conflation: "Maximin Collapse":** Saying contractualism "collapses into Rawls-style maximin" is a **serious misreading**.
      *   *Maximin* says: Always choose the option that benefits the *worst-off* individual the *most*, regardless of others' gains.
      *   *Scanlon* says: Evaluate principles by asking if *anyone* has a reasonable complaint against them *compared to the alternatives*. While the worst-off person often has the *strongest potential complaint*, it's not automatic:
          *   **Not Absolute:** If an alternative principle *significantly* benefits many with only a *modest* burden on the worst-off, the worst-off might *not* reasonably reject it (e.g., a small tax increase funding vital healthcare for millions).
          *   **All Burdens Matter:** The complaint of someone who is *not* the absolute worst-off but still faces a *significant* burden under a principle must be considered and might be reasonable. Contractualism considers *all* potential reasonable rejections, not just the single strongest one.
  3.  **Distortion: "Complaining Loudly" & Veto Power:** The claim that "anyone who complains loudly enough can effectively veto a principle" and "burdens nobody bothers to complain about create no complaint at all" is **flatly wrong and a caricature.**
      *   **"Reasonable" ≠ "Loud":** "Reasonable rejection" is an *objective* standard based on the *nature and severity of the burden*, not subjective loudness or whether someone *actually* complains. A burden can be unreasonable even if the person suffering it is silent or unaware.
      *   **No Individual Veto:** It's not that a single person gets to veto. It's that if a person has a *reasonable* complaint against *every* proposed principle *except one*, then that one principle is the only candidate. But crucially, **the complaint must be *reasonable* compared to the alternatives.** The wheelchair user has a reasonable complaint against the "no elevator" principle. The textbook students likely do *not* have a reasonable complaint against the "elevator first" principle *if* their burden is truly small. They can't "veto" it just by yelling.
  4.  **The "That Sinks the Theory" Conclusion:** **This does *not* logically follow from the accurate parts.** It follows *only* from the *distorted* version where unreasonable burdens get veto power and reasonable burdens are ignored if silent. Since that distortion is false, the conclusion is unwarranted. Scanlon *does* address aggregation problems in depth, arguing that his approach handles them more plausibly than aggregation.

  **Addressing Your Specific Questions:**

  1.  **The "Tiebreaker" Move:** This is **NOT Scanlon's move.** He explicitly rejects the idea that you can aggregate small benefits/burdens *even to break ties*. His core argument is that the complaint of the person facing the large burden is *qualitatively different* and cannot be matched by any number of small complaints. **For the elevator case:** Scanlon would argue the elevator should be built *unless* the textbook burden is so severe for each student that it rises to a comparable level of seriousness (e.g., not just slightly outdated, but completely unusable, preventing basic education). If the per-kid benefit is "pretty small," the elevator wins decisively, no matter how many kids.
  2.  **Your "Weird Variant" (Same Kid 1800 Times):** **This is KEY and reveals the subtlety.** Scanlon would say this *changes everything*. Now, it's **one person facing a very large *aggregated* burden** (1800 small inconveniences adding up to something significant). Contractualism doesn't prohibit *intrapersonal* aggregation (adding up burdens *for a single individual*). It prohibits *interpersonal* aggregation (adding burdens *across different individuals*).
      *   *In your variant:* If one kid suffers 1800 stubbed toes, that's one person enduring massive pain and disruption. They have a *very strong* complaint against a principle that imposes this. This *could* potentially outweigh another person's large burden (like a broken arm) *if* the broken arm is the *only* alternative burden under consideration and the aggregated stubbed toes are severe enough. But crucially, it's the *severity to the one individual* that matters, not the number of *events* spread across *different* people.
      *   *Why it matters:* It shows contractualism *isn't* ignoring amounts or consequences entirely. It cares deeply about the *magnitude of burdens falling on individuals*. What it *rejects* is the idea that burdens on *different* people can be summed to override a large burden on one. Your variant highlights that the *distribution* of burdens matters morally. A million tiny burdens on a million people might be reasonably rejectable *only* if each burden is significant *on its own*, while a million tiny burdens on *one* person creates a single, massive complaint.

  **Applying Scanlon to Your Ethics Bowl Case:**

  1.  **Identify the Principles:** Principle A: "Build elevator, delay textbooks." Principle B: "Buy textbooks, no elevator."
  2.  **Evaluate Reasonable Rejections:**
      *   **Against Principle B (No Elevator):** The wheelchair user has an **extremely strong, likely *unoverridable*, reasonable complaint.** The burden is severe: physical humiliation, loss of dignity, independence, missed education, social exclusion. This is a fundamental denial of equal access and respect.
      *   **Against Principle A (Elevator First):** Can any of the 1,800 students reasonably reject this? Only if the textbook burden is *significant* per student (e.g., renders education impossible, causes serious harm). If it's "pretty small" (slightly outdated info, minor inconvenience), then **no, they cannot reasonably reject it.** Their minor inconvenience doesn't justify imposing the massive burden on the wheelchair user. *Numbers don't aggregate to make the minor burden into a major one.*
  3.  **Conclusion (Scanlonian):** Principle B is wrong because the wheelchair user can reasonably reject it, and there is an alternative (Principle A) that no one (given the minor textbook burden) can reasonably reject. The school district should build the elevator.

  **In Summary:**

  *   **Blog Post Accuracy:** Correctly identifies the core anti-aggregation feature but misrepresents it as "strongest complaint wins," falsely claims it collapses into maximin, caricatures "reasonable rejection" as "loud complaining," and draws an invalid conclusion.
  *   **Scanlon's Actual View:** Morality is about finding principles no one could *reasonably reject* based on the burdens imposed *on them*. Small burdens on many *cannot* be summed to override a large burden on one. Complaints are judged objectively by severity, not loudness. Intrapersonal aggregation (burdens on the *same* person) *is* allowed.
  *   **Your Case:** Scanlon strongly favors the elevator unless the textbook deprivation constitutes a *serious* burden *per student*. Minor inconveniences for many don't justify severe harm to one.
  *   **Your Variant:** Changes the game because it aggregates burdens onto *one* person, creating a potentially massive complaint that *could* outweigh another large burden. This highlights that contractualism cares about the total burden *per individual*, not the *number of individuals* bearing minor burdens.

  The power of Scanlon for your case is that it forces a focus on the *qualitative difference* and *severity* of the burden on the individual wheelchair user versus the (assumed) minor nature of the burden on each textbook user. It provides a strong philosophical argument against letting the majority's minor convenience override one person's fundamental need for dignity and access. Good luck with Ethics Bowl!
