answer: |-
  ### 1. The Dispute Summarized (150 words)  
  Marcus argues citizens should practice "maximum opacity" (inspired by Germany’s *Datensparsamkeit*) to resist state overreach. He views American "default-public" culture as enabling systems like Chinese social credit, where visibility becomes control. He later introduces "informational self-ownership," insisting states may demand only "functional visibility" (e.g., taxes, voting) not "behavioral visibility" (movement, social ties), which constitutes identity co-authorship.  

  Lena counters that opacity is asymmetric: elites hide, the poor cannot. She advocates "civic legibility"—a baseline of shared citizen data for fair democratic governance (e.g., health, infrastructure). She rejects Marcus’s functional/behavioral divide, arguing they intertwine (e.g., movement affects tax zones). Critically, she emphasizes "directionality": visibility is legitimate only with reciprocity (citizens seeing/correcting state algorithms) and democratic safeguards. Without this, both U.S. corporate harvesting and Chinese scoring are oppressive.  

  ---

  ### 2. Adjudication by Step (500 words)  
  **Marcus’s Germany/America/China comparison**:  
  *Part right, part wrong*. He’s correct that American data laxity enables corporate-state surveillance convergence, and that unchecked visibility risks control (as in China). But he’s wrong to conflate U.S. transparency *culture* with China’s *mandatory scoring*. The core evil of social credit is its punitive, non-consensual scoring—not visibility itself. His analogy oversimplifies.  

  **Lena’s asymmetric opacity**:  
  *Largely right*. Wealthy individuals *do* exploit privacy tools (shell companies, encryption) unavailable to most, creating a transparency caste system. Marcus’s "maximum opacity" norm would likely worsen this imbalance, as Lena argues.  

  **Marcus’s functional/behavioral distinction**:  
  *Conceptually sound, practically weak*. His claim that behavioral data (e.g., friendships, consumption) forms "narrative identity" is compelling—states *do* overreach by treating lives as data points. But Lena rightly notes modern states *need* some behavioral data: movement patterns during pandemics or consumption habits for environmental policy aren’t easily quarantined from "functional" governance. His bright line is ethically intuitive but technologically naive.  

  **Lena’s inseparability and directionality**:  
  *Strongest point*. She correctly argues that functional/behavioral data are entangled (e.g., social ties *are* relevant to public health). More crucially, her "directionality" framework addresses the core flaw in both Marcus’s opacity ideal and Chinese scoring: **visibility without reciprocity or correction mechanisms is inherently tyrannical**. Her focus on democratic authorization (e.g., citizens auditing algorithms) and correctability is a practical upgrade to Marcus’s all-or-nothing approach.  

  **Overall reasoning**: Marcus’s arguments are principled but rigid, underestimating governance complexity. Lena adapts better to real-world dilemmas by focusing on *how* visibility operates, not just *how much*.  

  ---

  ### 3. What’s Missing (200 words)  
  Neither fully addresses **algorithmic transformation**: data isn’t just "seen"—it’s processed into predictive scores that *create* new realities (e.g., "pre-crime" policing). This shifts the debate from *hiding* to *contesting how data defines you*.  

  Marcus ignores **non-state actors**. Corporations harvest behavioral data with minimal oversight, rendering his state-focused opacity inadequate. Lena’s reciprocity model could extend here: if Amazon knows your purchases, you should know how it influences credit scores.  

  Lena underplays **scale and intimacy**. A state knowing your address (functional) is different from it mapping your daily routines (behavioral). Even with reciprocity, some intimate spaces—health, private communications—may deserve near-absolute protection Marcus’s line, while fuzzy, gestures at this.  

  Finally, both miss **contextual integrity**: visibility’s morality depends on *why* data is collected. Pandemic contact tracing is legitimate; scoring "loyalty" via book purchases is not. The *purpose* of visibility matters as much as its directionality.  

  ---

  ### 4. Overall Verdict (150 words)  
  **Lena wins on balance**, but key insights from Marcus survive. Her "directionality" framework (reciprocity, correctability, democratic control) is the most coherent solution to asymmetric exposure and algorithmic abuse. Marcus’s warnings about behavioral data’s identity-forming power and the slippery slope to scoring systems remain vital.  

  **The correct position**:  
  States and corporations may collect citizen data only under three conditions:  
  1. **Reciprocity**: If they see us, we see them (e.g., open algorithms, audit rights).  
  2. **Purpose-limitation**: Data collection must serve specific, democratically authorized public goods (health, safety)—not behavioral control.  
  3. **Asymmetry correction**: Privacy tools must be universally accessible, not luxury goods.  

  Marcus’s "functional" data (taxes, voting) fits here; contested "behavioral" data requires strict scrutiny. Opacity isn’t the goal—*accountable visibility* is. Without Lena’s safeguards, Marcus’s opacity fails; without Marcus’s caution, Lena’s visibility risks creep. Combined, they define humane digital citizenship.
