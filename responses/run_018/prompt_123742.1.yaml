answer: |-
  Here's a breakdown of the "bias is just preference with worse marketing" slogan, disambiguated into distinct theses, analyzed for defensibility, argument-stopping power, and prevalence in rationalist spaces. Think of this as your debate toolkit:

  1.  **The Trivial Evolutionary Causal History Thesis:**
      *   **Precise Claim:** All human preferences (including those labeled "moral truths" or "biases") have causal origins in evolutionary processes. There is no "pure" moral faculty untouched by natural selection.
      *   **Platitude?** Near-platitude among scientifically-minded rationalists. Widely accepted evolutionary psychology.
      *   **Defensible?** Yes, broadly. It's hard to argue *no* preferences have evolutionary roots.
      *   **Does it do the work?** **No.** This doesn't dissolve the distinction between bias and preference, nor defeat debunking. Debunking arguments *grant* this causal history but argue *some* outputs (biases) are unreliable for tracking truth *now*, while others (core preferences or refined moral intuitions) might be more reliable or corrigible. It fails to explain *why* we label some outputs "bias" (unreliable, distorting) and others "preference" or "judgment."
      *   **Rationalist Prevalence:** Common background assumption, but rarely the *primary* thrust of using the slogan because it's too weak to stop arguments.

  2.  **The Psychological Non-Cognitivist/Expressivist Thesis:**
      *   **Precise Claim:** Moral judgments *are not* truth-apt beliefs about objective facts ("X is wrong"). They *are* expressions of subjective affective states (disapproval, disgust, attraction) or conative states (desires, preferences). Labeling one affective state a "bias" and another a "preference" or "moral intuition" is purely a matter of social framing ("marketing"), not an epistemological distinction.
      *   **Platitude?** No. This is a substantive (and controversial) meta-ethical position (Non-Cognitivism/Expressivism/Projectivism).
      *   **Defensible?** Yes, it's a major school of thought in meta-ethics (e.g., Ayer, Blackburn, Gibbard). It coheres with the observed link between emotion and morality.
      *   **Does it do the work?** **Yes, but radically.** If successful, it dissolves evolutionary *debunking* by dissolving the idea of objective moral *knowledge* to debunk in the first place. All we have are competing preferences/attitudes. Moral disagreement *is* fundamentally like taste disagreement (though potentially about more important things). It directly undermines the EA "laundering" charge by saying there's no objective utilitarian truth to launder preferences *into* – it's all just preferences all the way down, framed differently.
      *   **Rationalist Prevalence:** **Very High.** This is likely the *dominant* unspoken assumption when rationalists wield this slogan. It resonates with a naturalistic worldview skeptical of non-natural moral facts and comfortable reducing "oughts" to psychology/desires.

  3.  **The Normative Epistemic Equivalence Thesis:**
      *   **Precise Claim:** There is no *epistemically relevant difference* between the mental state underlying "I prefer not to do X" and "X is morally wrong." Once you strip away the linguistic and social framing, both states have the same justificatory status – neither provides privileged access to moral truth. Asserting moral wrongness has no stronger claim to objectivity than stating a preference.
      *   **Platitude?** No. This is a strong normative claim about justification, often linked to Moral Subjectivism or Anti-Realism.
      *   **Defensible?** Defensible *if* you accept the psychological thesis above or a strong form of moral skepticism. Highly contentious for moral realists (who argue moral intuitions *can* be reliable or that reasoning can justify some over others).
      *   **Does it do the work?** **Yes, directly.** This explicitly targets the "epistemic gap." If there's no gap, then calling something a "bias" (implying unreliability) vs. a "preference" is indeed just framing. It dismisses debunking by denying the premise that some evolved outputs are epistemically privileged over others. Treating moral disagreement as taste follows naturally.
      *   **Rationalist Prevalence:** **High.** Often intertwined with the psychological thesis. Used to challenge the idea that certain intuitions (often those associated with traditional morality or "virtue ethics") have special justificatory weight over stated preferences (like maximizing utility).

  4.  **The Adaptive Preference Formation (Observational Equivalence) Thesis:**
      *   **Precise Claim:** The processes shaping what we call "biases" (e.g., in-group favoritism) and what we call "preferences" (e.g., liking sweet food) are fundamentally similar adaptive processes where internal states adjust to external realities (social, ecological). Both serve(d) fitness functions. Distinguishing them based on their causal origin or adaptive function is impossible or pointless; we only label based on current social acceptability or perceived rationality.
      *   **Platitude?** No. While adaptation is a platitude, the claim of *observational equivalence* in formation is substantive.
      *   **Defensible?** Partially. Both types *can* arise adaptively, but critics argue "biases" often involve identifiable cognitive *errors* (like systematic misjudgment under uncertainty) or harmful social functions that "preferences" lack. The *consequences* often drive the labeling.
      *   **Does it do the work?** **Ambiguous/Probably Not.** While it blurs origins, it doesn't directly address the *epistemic* or *normative* claims of debunking. Observational equivalence doesn't imply normative equivalence. You could still argue that *regardless* of origin, some states lead to reliably false beliefs or harmful outcomes ("biases") while others don't ("preferences"). It might expose hypocrisy in labeling but doesn't automatically dissolve the distinction's usefulness.
      *   **Rationalist Prevalence:** **Moderate.** Used to highlight the arbitrariness of labeling and challenge claims of "unnaturalness" or "irrationality" applied selectively. Less common as a standalone argument-stopper than 2 or 3.

  **Your Menu for the Thread:**

  | Thesis                          | Core Idea                                                                 | Platitude? | Defensible? | Stops Debunking? | Makes Morals Like Taste? | Rationalist Usage       |
  | :------------------------------ | :------------------------------------------------------------------------ | :--------- | :---------- | :--------------- | :----------------------- | :---------------------- |
  | **1. Trivial Evolutionary**     | All preferences/biases have evolutionary roots.                           | ✔️ (Near)  | ✔️          | ❌ (Too Weak)    | ❌                       | Background Assumption   |
  | **2. Psychological Expressivist** | Moral judgments = affective states; "bias" vs "pref" = framing.           | ❌         | ✔️ (Controv)| ✔️ (Radically)   | ✔️                       | **DOMINANT - Primary** |
  | **3. Normative Equivalence**    | "I prefer not X" & "X is wrong" have same epistemic status.               | ❌         | ✔️ (Controv)| ✔️ (Directly)    | ✔️                       | **HIGH - Often w/ #2** |
  | **4. Adaptive Equivalence**     | Formation process identical; labels based on social acceptability.        | ❌         | ⚠️ (Partial)| ❌ (Ambiguous)   | ⚠️ (Indirectly)         | Moderate               |

  **How to Use This Menu in Threads:**

  1.  **Identify the Move:** When someone drops the slogan, ask: *"Which interpretation do you mean? Are you making a trivial point about origins (1), a psychological claim about what morality *is* (2), a claim about justification (3), or about adaptive processes (4)?"* This forces specificity.
  2.  **Challenge the Work:** For #2 & #3 (the common power moves):
      *   *"If morality is just preferences (#2), how do we resolve conflicts between preferences beyond power? Doesn't this make 'moral progress' meaningless, just changing tastes?"*
      *   *"If there's truly no epistemic gap (#3), why do we reason morally at all? Why not just state preferences? What's the difference between debating ethics and debating pizza toppings?"*
      *   *"Doesn't this view (#2/3) undermine the very project of *rational* ethics that the community values? If it's all preference, why try to 'figure out' ethics?"*
  3.  **Point Out Limitations:** For #1 & #4:
      *   *"Sure, everything has evolutionary roots (#1), but that doesn't mean we can't distinguish reliable from unreliable outputs now. Debunking arguments start *from* this point."*
      *   *"Even if formation processes are similar (#4), we label things 'bias' because they cause systematic errors or harm *now*. Origin doesn't dictate current epistemic/normative status."*
  4.  **Address the EA Laundering Point:** *"If you're using #2 or #3, you're saying EA isn't 'laundering' preferences into objective morality because there *is no* objective morality to launder into – it's just preferences framed differently. But that also means *your* critique is just expressing your preference against their framing. Is that a satisfying conclusion?"*

  **Crucially:** The slogan's power as an argument-stopper in rationalist spaces primarily comes from implicitly invoking **#2 (Psychological Expressivism)** or **#3 (Normative Equivalence)**. These are substantive, defensible (though contested) meta-ethical positions that *do* directly challenge the foundations of evolutionary debunking arguments and treat moral disagreement as akin to clashes of taste. Recognize that when deployed this way, it's not a cheap trick, but a fundamental challenge to moral realism. Your counter must engage that deeper meta-ethical disagreement.
