  Starting with the trivial evolutionary point. If all preferences have evolutionary origins, then both biases and preferences come from the same source. But does this erase the distinction? Not really. Just because both have evolutionary roots doesn't mean they are the same. Biases might be automatic and subconscious, while preferences could be more reflective. So this point might be a platitude and doesn't do much heavy lifting in arguments.

  Next, the psychological claim. If moral judgments are just emotional responses labeled as beliefs, then calling something a "bias" versus a "preference" is just framing. This leans towards non-cognitivism in metaethics. While defensible, it's not universally accepted. It might allow dismissing objective morality, but it could lead to moral relativism, which might not sit well in rationalist circles aiming for objective frameworks.

  Then the normative claim. Saying there's no epistemic gap between preference and moral wrongness. This is a strong anti-realist position. If true, it directly counters evolutionary debunking by equating all moral claims with preferences. But it's controversial and might not be persuasive to realists. Plus, it could undermine the rationalist project of finding objective moral truths.

  Adaptive preference formation is another angle. Here, what we call bias and preference both adjust to circumstances. Observationally, they might look similar. But the distinction might matter normatively. If someone's preferences adapt to oppression, calling it a preference doesn't make it right. So this interpretation might not help in dismissing debunking arguments and could even backfire.

