  Below is a decision tree designed to clarify positions on the Nuremberg and Tokyo tribunals, based solely on concrete, accessible questions. It requires no prior knowledge of legal terms or historical debates, avoids framing issues as "revenge vs. justice," and ends in the five named positions you specified. The tree has **7 branch questions** (with some modular reuse) and can be completed in 5–10 minutes. Each question forces a choice between clear options, and the path taken depends entirely on logical consistency, not preexisting biases.

  ---

  ### **Nuremberg/Tokyo Tribunals Decision Tree**
  *Start here, assuming the tribunals happened as they did.*

  1. **If the Axis powers had won WWII and set up an identical tribunal to try Churchill, Roosevelt, and Stalin for their wartime decisions, would you accept the verdicts of that tribunal as legitimate?**  
     - **Yes** → Proceed to Q2.  
     - **No** → Proceed to Q3.  

  2. **Should someone be punished for an act that was not explicitly written as a crime in international law when they committed it?**  
     - **Yes** → Proceed to Q4.  
     - **No** → Proceed to Q5.  

  3. **Does the victor-vs.-loser power imbalance alone make the tribunals illegitimate, even if some evidence presented was solid?**  
     - **Yes** → **Leaf: Total victors'-justice rejectionism** (The trials were pure power politics; no moral/legal legitimacy).  
     - **No** → Proceed to Q6.  

  4. **Were the atrocities committed (e.g., systematic murder of civilians) so monstrous that they were inherently criminal, regardless of written laws?**  
     - **Yes** → Proceed to Q7.  
     - **No** → **Leaf: *Empty leaf*** (Incoherent: You accept hypothetical Axis trials but reject natural law. Rare/unattractive position).  

  5. **Were acts like planning invasions or starting wars fundamentally different from acts like torturing POWs or genocide, because the former weren't clearly illegal before 1945?**  
     - **Yes** → **Leaf: Legalist middle** (Legitimacy only for war crimes/human-rights charges; crimes-against-peace charges invalid).  
     - **No** → Proceed to Q7.  

  6. **When the tribunals ignored their own hypocrisy (e.g., overlooking Allied submarine warfare while prosecuting Germans for it, or letting the Soviets lie about Katyn), did that: (a) poison the whole process, or (b) only taint specific charges?**  
     - **(a) Poison the whole process** → **Leaf: Total victors'-justice rejectionism** (Corruption proves it’s a sham).  
     - **(b) Only taint specific charges** → Proceed to Q2.  

  7. **Despite flaws, did the tribunals create a net positive precedent by making leaders personally accountable for atrocities?**  
     - **Yes** → **Leaf: Pragmatist "flawed but a net gain"** (Imperfect but necessary for future justice).  
     - **No** → **Leaf: Natural-law defense** (Legitimacy comes solely from moral enormity; precedent irrelevant).  
     - ***(For either answer, proceed to Q8 about Tokyo)***  

  8. **Was the Tokyo Tribunal fundamentally less legitimate than Nuremberg due to issues like cultural bias, rushed procedures, or victors’ agenda?**  
     - **Yes** → **Leaf: Nuremberg defensible but Tokyo specifically not** (Nuremberg had flaws but was valid; Tokyo was tainted by power politics or racism).  
     - **No** → *Remain in your prior leaf* (Natural-law defense or Pragmatist).  

  ---

  ### **Key Features & Notes**
  - **Total questions**: 7 (though Q7 and Q8 are asked only on certain paths).  
  - **Empty leaf**: Only one (after Q4). It flags an incoherent position: accepting hypothetical Axis trials but rejecting natural-law morality. This is rare—most people who accept Q1’s premise also embrace natural law.  
  - **Unresolved pairs**: The tree distinguishes all five leaves. The only potential overlap is between:  
    - *Legalist middle* and *Natural-law defense* (both might reject crimes-against-peace charges), but the tree pulls them apart via Q5/Q7.  
    - *Pragmatist* and *Natural-law* (both may support Nuremberg), but Q7 separates them by rationale.  
  - **Why these questions?**  
    - Q1 isolates "victor’s justice" without using the term.  
    - Q2 tackles retroactivity via a universal principle.  
    - Q3 ensures rejectionism is based on power imbalance, not revenge.  
    - Q6 focuses on concrete flaws (Katyn/Dönitz) to test consistency.  
    - Q7 separates moral vs. practical justifications.  
    - Q8 isolates Tokyo’s unique issues (procedural bias, historical context).  
  - **Efficiency**: Paths to leaves take 3–7 questions. Most users hit a leaf in 4–5 steps.  

  ### **How to Use in Your Meetup**
  1. **Individual walkthrough**: Have members answer the questions sequentially on paper, landing on a leaf position.  
  2. **Discussion**: Group people by their leaf positions. Ask: *"What in the tree solidified your view? What question felt forced?"* Then debate inter-leaf tensions (e.g., "Can pragmatists and legalists agree on modern war-crimes tribunals?").  
  3. **Avoid jargon**: The tree uses plain language (e.g., "atrocities" not "crimes against humanity"), making it accessible.  

  This tree compresses complex debates into principled choices, forcing clarity without requiring expertise. If tested and a branch feels off, tweak Q5/Q6 to add nuance (e.g., splitting "tainted specific charges" into finer options).
