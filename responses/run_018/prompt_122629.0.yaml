  ### Step 1: Rules Fitting All Four Verdicts
  Her verdicts suggest a non-aggregative, agent-centered approach with two core principles:
  1. **No Aggregation of Harms Across Individuals**: Harms (or benefits) to different people cannot be summed or weighed against each other. Saving five people from broken arms does not "add up" to outweigh one death, and saving five lives does not morally outweigh saving one life. This explains her verdicts in the first case (one vs. five drowning), second case (one death vs. five broken arms), and fourth case (one vs. a hundred drowning).
  2. **Agent-Relative Obligations**: Personal relationships (e.g., family) create strong, non-overridable duties. Saving her sister is not just permitted but required, overriding any impartial consideration of numbers. This explains her verdict in the third case (sister vs. five strangers).

  A third, supporting principle emerges from her emphasis on symmetry in the first case:
  3. **Symmetry of Complaints**: When all affected parties are strangers and face identical harms, no group has a stronger moral claim than another. Choosing to save one group does not make the outcome "worse" or give the unsaved group a unique complaint, as both groups are symmetrically situated. This justifies her denial that you "must" save the five in the first case and her rejection of any complaint asymmetry.

  These rules form a coherent framework:
  - **No aggregation** handles Cases 1, 2, and 4 by rejecting that numbers or summed lesser harms create obligations.
  - **Agent-relative obligations** handle Case 3 by prioritizing personal ties.
  - **Symmetry of complaints** reinforces Case 1 by making the choice between symmetric groups permissible either way.

