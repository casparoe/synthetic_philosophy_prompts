  The user's confusion about "what level the disagreement lives on" feels very genuine. Let me map their hypotheses: 1) empirical uncertainty about citizen competence, 2) conceptual confusion about representation, or 3) fundamentally different priorities (decision quality vs popular control). All plausible, but the third feels most compelling given how entrenched the positions are. 

  Interesting that they ask if this is "bedrock intuition" disguised as technical debate. That's perceptive - democratic theory often masks value conflicts as institutional design problems. The group might be talking past each other because "democracy" functions as what Gallie called an "essentially contested concept." 

  For unsticking them: conceptual clarification alone won't work since they already grasp the surface distinctions. They need to make the value conflict explicit. A role-play exercise forcing each side to design institutions for the other's priority could surface hidden assumptions. Or analyzing real cases like Ireland's assemblies through both lenses might reveal complementary strengths rather than binary opposition. 

