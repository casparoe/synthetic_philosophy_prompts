answer: |-
  ### Decision Tree: Evaluating Institutional Failure in Conspiracy Theories  
  *Root Commitment: "I accept that institutional knowledge production can be systematically wrong about a specific event without being globally unreliable."*  

  **First Split: Scenario-Driven Response**  
  *Primary documents emerge that contradict the official narrative but are ignored by every mainstream outlet. Your response is to:*  
  - **Branch A**: Update significantly on the documents alone (treating them as sufficient evidence).  
  - **Branch B**: Require independent replication by a verification network you do not already distrust.  
  - **Branch C**: Treat media silence as *confirmatory* evidence of institutional capture.  

  ---

  #### **Branch A: Update on Documents Alone**  
  **Question 2 (Verification Debt):**  
  *When rejecting an official account, do you believe:*  
  - **A1**: You must advance a competing explanation that makes testable predictions (e.g., "My alternative predicts X will happen; if not, I lose credibility").  
  - **A2**: Negative coherence (e.g., "The official story has internal contradictions") is sufficient, with no obligation to propose alternatives.  

  **Question 3 (Belief Revision Method):**  
  *When revising your view of a potential conspiracy, you rely primarily on:*  
  - **A1.1 / A2.1**: Inside-view analysis of case-specific documents/mechanisms (e.g., "This memo’s timestamp proves forgery").  
  - **A1.2 / A2.2**: Outside-view reference-class forecasting (e.g., "Successful cover-ups in events like this occur in <5% of cases").  

  **Unoccupied Combinations:**  
  - `A1.2` (VD + Outside-view) & `A2.2` (No VD + Outside-view): **Unstable**—Outside-view priors (e.g., low base rates of conspiracies) typically discourage updating on lone documents, making this branch self-undermining.  
  - **Leaves**: *No named positions occupy Branch A*.  

  ---

  #### **Branch B: Require Independent Replication**  
  **Question 2 (Verification Debt):**  
  *When rejecting an official account, do you believe:*  
  - **B1**: You must advance a testable alternative explanation.  
  - **B2**: Negative coherence suffices.  

  **Question 3 (Decentralized Networks):**  
  *Can decentralized verification networks (e.g., citizen journalists, open-source investigators) genuinely substitute for institutions?*  
  - **B1.1 / B2.1**: **Yes**—They avoid institutional trust decay (e.g., "Diverse crowdsourcing resists corruption").  
  - **B1.2 / B2.2**: **No**—They inherit the same dynamics (e.g., "All large groups develop in-group biases").  

  **Question 4 (Belief Revision Method):**  
  *Your revision relies on:*  
  - **B1.1.1 / B2.1.1**: Inside-view case analysis.  
  - **B1.1.2 / B2.1.2 / B1.2.1 / B2.2.1**: Outside-view reference classes.  

  **Leaves:**  
  - **Decentralized Verificationism** (B1 + B1.1 + B1.1.1):  
    *Requires testable alternatives; trusts networks; uses inside-view.*  
    Diagnosis: Treats networks as corrective but demands predictive risk.  
  - **Bayesian Skepticism** (B2 + B2.1.2 or B2.2.1):  
    *Uses negative coherence; trusts or distrusts networks; anchored to reference classes.*  
    Diagnosis: Low base rates constrain updates; replication overcomes priors.  
    - *Cannot separate*: Bayesian leaves with "trust networks" (B2.1.2) vs. "distrust networks" (B2.2.1)—position is defined by base rates, not network theory.  
  - **Strict Institutionalism** (B1 + B1.2 + B1.2.1):  
    *Requires testable alternatives; distrusts networks; uses outside-view.*  
    Diagnosis: Trusts only institutional-grade replication; rejects decentralized solutions.  

  **Unoccupied:** `B1.2.2` (VD + Distrust Networks + Inside-view): **Lacks advocates**—Institutionalists default to outside-view; no camp combines these.  

  ---

  #### **Branch C: Silence as Confirmation of Capture**  
  **Question 2 (Structural Unfalsifiability):**  
  *When presented with evidence debunking a conspiracy, you:*  
  - **C1**: Update against the conspiracy if the evidence is credible (e.g., "New forensics undermine my view").  
  - **C2**: Reinterpret it as part of the cover-up (e.g., "Debunkers are paid disinformants").  

  **Question 3 (Belief Revision Method):**  
  *Your revision relies on:*  
  - **C1.1 / C2.1**: Inside-view case analysis.  
  - **C1.2 / C2.2**: Outside-view reference classes.  

  **Question 4 (Verification Debt):**  
  *When rejecting an official account, do you believe:*  
  - **C1.1.1 / C2.1.1**: You must advance a testable alternative.  
  - **C1.1.2 / C2.1.2 / C1.2.1 / C2.2.1**: Negative coherence suffices.  

  **Leaves:**  
  - **Hermeneutics-of-Suspicion Structuralism** (C2 + C2.1 + C2.1.2):  
    *Silence confirms capture; reinterprets counterevidence; uses inside-view; no verification debt.*  
    Diagnosis: Assumes institutions are systemically corrupt; immune to falsification.  

  **Unoccupied Combinations:**  
  - `C1` (Update against conspiracies) + any sub-branch: **Lacks advocates**—Those treating silence as confirmation rarely accept debunking.  
  - `C2.1.1` (Reinterpret + Inside-view + VD): **Incoherent**—Requiring testable alternatives contradicts reinterpreting counterevidence as "cover-up."  

  ---

  ### Summary of Key Distinctions  
  1. **Failure Mode**:  
     - Base-rate neglect: Rejects outside-view priors (e.g., Bayesian leaves *avoid* this).  
     - Structural unfalsifiability: Diagnosed by reinterpretation of counterevidence (Branch C2).  
  2. **Decentralized Networks**:  
     - Substitutes for institutions: B1.1 (decentralized verificationism).  
     - Inherits trust decay: B1.2/B2.2 (strict institutionalism/Bayesian variants).  
  3. **Verification Debt**:  
     - Required: B1 (decentralized verificationism/strict institutionalism).  
     - Rejected: A2, B2, C2.1.2 (hermeneutics).  
  4. **Belief Revision**:  
     - Inside-view: A1.1, B1.1.1, C2.1 (hermeneutics).  
     - Outside-view: B1.2.1, B2.1.2/B2.2.1 (Bayesian/institutionalist).  

  ### Unresolved Ambiguities  
  - **Bayesian skepticism** spans two leaves (B2.1.2 and B2.2.1) but cannot be split further—base rates are its core, not network dynamics.  
  - **Branch A** is unoccupied by named positions; its pathways are unstable or incoherent under scrutiny.
