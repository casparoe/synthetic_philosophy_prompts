  ## Proposal: Keynes's Epistemic Scaffolding - Uncertainty, Risk, and the Centrality of the Weight of Evidence

  **Abstract:** This project challenges the standard ontological interpretation of Keynes’s famous distinction between “risk” (quantifiable uncertainty) and “uncertainty” (unquantifiable) as categorizing *states of the world*. Instead, I argue it is fundamentally an *epistemic* claim about the rational constraints imposed by the *weight of evidence* on an agent’s justifiable probabilistic reasoning. By placing Keynes’s neglected concept of “weight” – the amount of relevant evidence supporting a judgment, distinct from its probability – at the core of his framework, I aim to resolve ambiguities in his theory of probability, demonstrate the coherence of his uncertainty concept without ontological dualism, and offer a more nuanced understanding of rational decision-making under limited evidence in economic contexts.

  **1. The Precise Question:** Was Keynes’s distinction between quantifiable “risk” and unquantifiable “uncertainty” primarily intended as:
      *   **(a)** An *ontological* claim describing two distinct types of objective situations in the world?
      *   **(b)** An *epistemic* claim delineating the boundaries of justified rational belief formation based on the characteristics of an agent’s evidence, specifically its *weight*?

  I contend that (b) is the correct and more fruitful interpretation, with the "weight of evidence" serving as the primary epistemic variable determining whether numerical probability assertions are rationally permissible.

  **2. Why the Standard Ontological Reading is Inadequate and What This Project Avoids:**
  The common pedagogical presentation frames risk/uncertainty as a binary taxonomy of *world-states*. This view faces significant challenges:
  *   **Ambiguity in Classification:** Many real-world situations resist neat categorization (e.g., novel technologies, long-term climate impacts). Is the unquantifiability inherent in the *situation* or a feature of *our current evidence* about it?
  *   **Keynes's Nuance:** Keynes explicitly states probability is a logical relation *between* propositions (evidence and conclusion), not a property of the world alone. His discussions of uncertainty often emphasize the *lack of sufficient evidence* or the *incomparability* of evidence, not an inherent metaphysical unknowability.
  *   **The "Weight" Oversight:** This ontological reading marginalizes Keynes’s crucial concept of "weight" (Treatise on Probability, Ch. VI). Weight measures the "absolute amount" of relevant evidence. High weight supports the *meaningfulness* and *stability* of a probability judgment, even if the probability itself is low or high; low weight renders any precise probability estimate rationally baseless, plunging us into "uncertainty" in his sense.

  **Why Not Relitigate Subjectivism vs. Frequentism?**
  Endless debates over whether Keynes was a "logical" subjectivist or a proto-frequentist miss the core epistemic structure he built. Focusing on *how evidence licenses belief* through weight transcends this dichotomy. Weight concerns the *evidential basis itself* before any specific probability interpretation is applied. This project sidesteps that well-trodden debate to uncover a more fundamental layer of Keynes’s thought with direct relevance to rationality under imperfect information.

  **3. Project Approach and Methodology:** This is primarily a work of philosophical interpretation and conceptual analysis, grounded in close reading of Keynes’s texts and their intellectual context.
  *   **Core Texts:** Deep analysis of Keynes’s *A Treatise on Probability* (especially Ch. III on Risk/Uncertainty & Ch. VI on Weight), relevant passages in *The General Theory* (Ch. 12 on long-term expectations), and associated essays/letters.
  *   **Conceptual Framework:**
      *   Define "Weight of Evidence": Distinguish sharply from probability (degree of belief/confirmation). Analyze its properties (additivity? comparability?).
      *   **Re-interpreting Uncertainty:** Argue that "uncertainty" arises not from an ontological category but from *evidential insufficiency* (low weight), making numerical probability estimates *unjustifiable* for a rational agent.
      *   **Re-interpreting Risk:** Argue that "risk" denotes situations where the weight of evidence is sufficient to ground a *justifiable* numerical probability judgment (whether precise or interval-based).
      *   **Rationality and Action:** Explore how Keynes links low weight/uncertainty to conventions, animal spirits, and the ineffectiveness of pure probabilistic calculation in guiding investment decisions.
  *   **Contrast with Later Interpretations:** Briefly contrast Keynes’s epistemic view with Knight’s risk/uncertainty (often seen as the source of the ontological reading) and later developments like Ellsberg ambiguity, showing how the weight-centric view clarifies Keynes’s unique contribution.

  **4. Six-Month Work Plan:**
  *   **Month 1:** **Foundational Literature & Framing:** Deep dive into *Treatise on Probability* (Key concepts: Probability relations, weight, risk/uncertainty). Survey existing secondary literature on Keynes's probability/uncertainty. Precisely formulate the core hypothesis and research questions.
  *   **Month 2:** **Weight of Evidence - The Core Mechanism:** Detailed analysis of Chapter VI (Weight). Conceptual mapping: weight vs. probability, weight vs. confidence, weight vs. precision. Develop the argument for weight as the key determinant of justifiability.
  *   **Month 3:** **Re-interpreting Risk & Uncertainty:** Close reading of Chapter III and relevant *General Theory* passages. Systematically reinterpret "risk" and "uncertainty" through the lens of weight. Analyze Keynes's examples (e.g., roulette vs. prospect of war).
  *   **Month 4:** **Rationality, Action & Economic Implications:** Analyze Keynes's discussion of decision-making under uncertainty (esp. *GT* Ch. 12). Explore the link between low weight, conventional judgment, liquidity preference, and investment volatility from this epistemic perspective.
  *   **Month 5:** **Contrasts & Defense:** Compare/contrast with Knight, Ellsberg, and later decision theories. Address potential counterarguments (e.g., Keynes's mentions of "objective factors," the role of intuition). Refine the overall argument.
  *   **Month 6:** **Synthesis, Writing & Dissemination:** Draft the core argument of the proposal paper. Structure findings, solidify conclusions. Begin planning for journal submission (e.g., *Econ & Phil*, *JHP*).

  **5. What Success Looks Like:**
  *   **Settled Result:** A coherent, textually supported interpretation demonstrating that:
      1.  The weight of evidence is the central epistemic variable in Keynes's framework.
      2.  The risk/uncertainty distinction is primarily a consequence of variations in weight, not an ontological divide.
      3.  This resolves internal tensions in Keynes's work and provides a clearer foundation for understanding rationality under limited evidence in economics.
  *   **Output:** A polished, journal-ready article making this novel interpretation.

  **6. What Failure Looks Like:**
  *   **Textual Inconsistency:** Finding that Keynes's texts definitively support the ontological reading or that weight plays only a marginal, non-explanatory role in the risk/uncertainty distinction.
  *   **Conceptual Collapse:** Inability to rigorously distinguish "weight" from probability/confidence in a way that sustains the argument, or proving that weight cannot plausibly bear the explanatory load required.
  *   **Redundancy:** Demonstrating that this interpretation, while possible, doesn't yield significant new insights compared to existing readings or doesn't avoid the subjectivist/frequentist debates effectively.
  *   **Output Failure:** Inability to synthesize the research into a coherent, convincing argument within the timeframe.

  **Confidence Assessment:**

  *   **Overall Framing (High Confidence):** I am highly confident that shifting the focus from an ontological to an epistemic interpretation, centered on the agent's evidence and justification, is the correct and more philosophically fruitful approach to understanding Keynes's risk/uncertainty distinction. The neglect of "weight" in standard accounts is a significant oversight.
  *   **Point of Least Certainty (Flagged):** The point I'm least sure about is the **precise relationship Keynes intended between weight and the *possibility* of quantification/numerical probability**. While I argue low weight *precludes justified quantification*, leading to "uncertainty," does Keynes *explicitly* link them this tightly, or is there room for non-numerical probability even under higher weight? Pinpointing this connection textually is crucial and requires the deepest dive into the *Treatise*. Success hinges on clarifying this link beyond reasonable doubt.
