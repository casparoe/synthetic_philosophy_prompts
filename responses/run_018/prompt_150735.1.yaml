  **The Joke:**  
  The party confronts King Borin, demanding to know why Arbitria's southern border follows the nonsensical "Squiggle River" instead of the logical mountain range. The king sighs: "Centuries ago, my ancestor Sir Clumsius tried to charm Duke Stonejaw into accepting the mountains as the boundary. Rolled a natural 1 – insulted the Duke’s prized pet rock collection. War nearly erupted! To appease him, we scribbled the border along this useless river instead."  

  Paladin: "But Sire, maintaining garrisons along this swampy mess costs a fortune! Surely you could renegotiate?"  

  King Borin slams his goblet: "Don’t you think we’ve tried? But now the river has *Customs Houses*. The swamps have *Toll Road Concessions*. Duke Stonejaw’s descendants own all the ferries! Changing it would collapse the economy. That failed charisma check gave Stonejaw an early monopoly on river trade… and now we’re hydrolocked." He mutters into his beard: "Stupid sunk costs…"  

  **Commentary on the choices made:**  
  **Mechanism Used:** The joke hinges on **institutional persistence via sunk costs and vested interests** (like QWERTY). The arbitrary river border, initially adopted to avoid conflict after a random event (the nat 1), became entrenched because infrastructure, economic actors, and power structures adapted to it. Reversal became prohibitively expensive despite its inefficiency.  

  **RPG Framing Rationale:** The tabletop retcon scenario makes abstract path dependence visceral. Gamers instantly recognize how trivial dice rolls derail campaigns, mirroring how minor historical contingencies seed institutional "lock-in." It avoids overused historical examples (e.g., VHS/Betamax) while letting the GM’s retroactive worldbuilding illustrate how societies rationalize arbitrary origins into seemingly inevitable structures. The king’s exasperated "hydrolocked" punchline ties the RPG logic to real-world institutional economics.  

