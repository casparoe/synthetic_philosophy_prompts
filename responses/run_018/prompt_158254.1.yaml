answer: |-
  Here's the exam question, model answer, and marking scheme tailored to your specifications:

  ### 1. Exam Question
  **Analyze the following scenario using Nietzsche’s three modes of historical engagement (monumental, antiquarian, critical) from *Untimely Meditations II*:**  
  *The town of Oakhaven is erecting a statue of 19th-century industrialist Silas Thorne, who funded its library and hospital but operated factories with hazardous child labor. The council debates three plaque options:  
  (A) Celebrate his philanthropy without mentioning labor practices,  
  (B) Include a factual note about worker injuries,  
  (C) Remove all reference to the factories and focus solely on civic contributions.*  

  **Tasks:**  
  1. Explain how each council position (A, B, C) reflects one of Nietzsche’s historical modes.  
  2. Argue which mode *should* dominate Oakhaven’s decision, justifying your choice with Nietzsche’s framework.  
  3. Address where Nietzsche might express ambivalence about your chosen mode.  
  4. Evaluate whether digital archives (e.g., permanently searchable factory records) make critical history easier or undermine Nietzsche’s concept of "forgetting."  

  ---

  ### 2. Model Answer (584 words)  

  Nietzsche’s three historical modes—monumental, antiquarian, and critical—illuminate Oakhaven’s dilemma. Position **A** (celebrating philanthropy alone) embodies **monumental history**, which seeks inspiring exemplars for present goals. Nietzsche warns this mode "idealizes the past" (*Untimely Meditations* II.2), here simplifying Thorne into a heroic patron to motivate civic pride, deliberately omitting contradictions that might weaken his symbolic power. Position **B** (noting labor abuses) reflects **critical history**, which "brings the past to judgment" (II.3) to dismantle oppressive legacies. Including factory injuries serves present justice by exposing exploitation, challenging uncritical veneration. Position **C** (erasing factories entirely) aligns with **antiquarian history**, which venerates the past "merely because it is old" (II.3). By preserving only Thorne’s "local heritage" elements (library/hospital), it seeks continuity but risks becoming "mummified" reverence, silencing uncomfortable truths to maintain communal identity.  

  Critical history should dominate Oakhaven’s approach. Nietzsche prioritizes history’s service to *life*, arguing we must sometimes "shatter the past" (II.3) to emancipate the present. Thorne’s factories caused tangible harm; glossing over them (as in A or C) perpetuates what Nietzsche calls the "malady of history"—stifling growth through uncritical inheritance. Critical scrutiny aligns with Nietzsche’s demand to challenge "idolatry of the factual" (II.6), forcing Oakhaven to confront how power shaped its past. A plaque acknowledging labor abuses would model *active* historical engagement, transforming memory into a tool for ethical reckoning rather than complacency.  

  Yet Nietzsche might resist this dominance. Critical history, he warns, risks nihilistic destruction if it undermines all foundations without creating new values (II.3). A purely critical plaque might reduce Thorne to a villain, erasing his library’s cultural value and alienating townsfolk invested in Oakhaven’s heritage. Nietzsche’s ambivalence stems from his insistence that history must *balance* vitality and truth—neither monumental delusion nor critical annihilation.  

  Digital archives complicate Nietzsche’s framework. Permanently searchable factory records *enable* critical history by preserving suppressed narratives (e.g., injury reports), facilitating the exposure of power dynamics Nietzsche endorsed. However, they threaten the "forgetting" essential to his philosophy. Nietzsche argues that without selective forgetting, societies drown in "historical fever" (II.1), paralyzed by endless contradictions. Digital permanence risks entrenching antiquarian preservation ("save everything") or fostering hyper-critical paralysis ("condemn everyone"), making it harder to curate history *for life*. Thus, while archives aid criticism, they undermine Nietzsche’s call for deliberate omission to fuel action.  

  Ultimately, Oakhaven’s plaque should critically center labor abuses *while* contextualizing Thorne’s duality. Nietzsche’s framework demands not dogma but a fluid negotiation: using criticism to break idolatry while allowing monumental elements (e.g., the library) to inspire—if tempered by honesty.  

  ---

  ### 3. Marking Scheme  
  **A-Grade Answers (Distinction) Must:**  
  - **Correctly map positions A/B/C to monumental/critical/antiquarian modes** (A=monumental [selective inspiration], B=critical [destructive judgment], C=antiquarian [unconditional preservation]).  
  - **Justify critical dominance via Nietzsche’s "life-serving" mandate**, explaining how suppressing labor abuses perpetuates harmful power structures (vs. antiquarian’s "mummification" or monumental’s deceptive idealism).  
  - **Identify Nietzsche’s ambivalence**: Critical mode’s potential for nihilism (destroying foundations without creating new values) or social fracture, per his warning against "root-cutting" (II.3).  
  - **Nuanced digital archives analysis**: Argue they *aid* criticism (access to suppressed evidence) but *hinder* "active forgetting," risking historical overload or performative condemnation without action.  
  - **Synthesize tensions**: Acknowledge that Nietzsche might advocate blending modes (e.g., critical honesty with selective monumental inspiration for community cohesion).  

  **B-Grade Answers (Proficient) May:**  
  - Define the three modes accurately but imperfectly map them to the scenario (e.g., misidentifying C as critical).  
  - Advocate a mode competently but with weaker ties to Nietzsche’s "life-serving" principle.  
  - Note Nietzsche’s caution about critical history superficially (e.g., "it’s too negative") without referencing nihilism or social fragmentation.  
  - Treat digital archives one-dimensionally (e.g., "permanent records help criticism" without addressing forgetting).  
  - Describe but not synthesize tensions between modes.  

  ---

  ### Key Scholarship Notes (For Instructor Guidance)  
  - **Settled Consensus**: Nietzsche’s taxonomy of three modes and their core flaws (monumental = mythmaking, antiquarian = passivity, critical = destructiveness) is universally accepted in scholarship.  
  - **Genuinely Contested**:  
    1. Whether Nietzsche’s framework can justify *collective* remembrance (e.g., political memorials), given his focus on individual/artist-centric "life" (Debated by Leiter vs. Conway).  
    2. Whether critical history’s "destruction" implies ethical obligation (e.g., confronting injustice) or purely existential self-overcoming (Assessed differently by Ridley vs. Owen).  
    3. If "active forgetting" requires literal omission (e.g., destroying records) or merely psychological distance (See Jenkins vs. Schrift).  
  *(These contested points are excluded from the model answer to avoid presenting debate as consensus.)*  

  *Self-correction note: "Antiquarian" (historical preservation) ≠ "antiquated" (outdated). I’ve maintained the correct term throughout!*
