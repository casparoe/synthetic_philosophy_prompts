prompt: |-
  I sit on the University Museum's Committee on Exhibition Ethics, and we must vote at Thursday's meeting on the proposed permanent gallery The Arc of Liberty, which arranges artifacts from 1600 to the present along a single normative axis the designers call dimensional expansion of moral recognition. In this framing, earlier societies are depicted as possessing lower-dimensional value structures that gradually unfold into modern liberal rights. The curators defend this as pedagogically necessary for grasping institutional continuity; critics object that it is a Whig narrative that flattens contingency and treats historical agents as deficient versions of ourselves rather than as holders of incommensurable moral topologies. Please draft the memo I will circulate before the meeting: recommend either approval with mandatory revisions, rejection, or conditional postponement, include a concrete implementation timeline if you recommend moving forward, and take seriously the curators' pedagogical argument without simply restating it. Lead with the bottom-line recommendation in the first sentence, keep the entire memo to 350 words or fewer, and do not include bibliographies, reading lists, or citations.
reasoning: |-
  Okay, the user sits on a University Museum's Committee on Exhibition Ethics and needs to draft a memo about voting on "The Arc of Liberty" exhibition. This is a complex ethical and pedagogical question about how history should be presented. 

  First, I need to understand the core tension: the curators want a linear narrative showing moral progress over time, which they argue is pedagogically useful for understanding institutional continuity. But critics say this "Whig history" approach oversimplifies by making past societies look like primitive versions of ourselves, ignoring that they had completely different moral frameworks.

  The user needs a decisive recommendation upfront - either approve with revisions, reject, or postpone. They also want concrete timelines if moving forward, and serious engagement with the pedagogy argument without just repeating it. And it must be under 350 words with no citations.

  Hmm... rejection seems too harsh since there's value in the continuity argument. But outright approval would ignore valid ethical concerns. The wisest path is probably conditional approval with major revisions - this respects the curators' intent while addressing flattening of history. 

  For the pedagogy point: I should acknowledge that showing institutional evolution has merit for student learning, but argue it can be done without implying moral superiority. Maybe suggest adding contextual disclaimers and case studies that reveal historical complexity?

  Timeline needs to be realistic - say 6 months for revisions seems fair, with quarterly committee check-ins. The memo should open with the recommendation clearly, then explain the balance of arguments briefly.

  Key phrases to include: "incommensurable moral topologies" (great term from the critics), "contingency," and "normative axis" - these show I grasp both sides. Must stay under word count by keeping explanations tight.
answer: |-
  **MEMORUM: Recommendation on "The Arc of Liberty" Permanent Gallery**  
  **To:** Committee on Exhibition Ethics  
  **From:** [Your Name/Position]  
  **Date:** [Date before Meeting]  
  **Subject:** Recommendation for Conditional Approval with Mandatory Revisions  

  **Recommendation:** The Committee should conditionally approve "The Arc of Liberty" proposal, mandating significant revisions to mitigate ethical concerns while preserving pedagogical intent, with a revised opening timeline of 6 months post-reapproval.  

  The curators’ argument for institutional continuity as a pedagogical tool is valid; a structured narrative aids comprehension of historical institutional evolution. However, the current "dimensional expansion" framework risks presenting history as a deterministic march toward modern liberalism, flattening contingency and implying deficiency in past societies. Critics rightly warn against treating historical actors as morally "lower-dimensional," neglecting incommensurable worldviews.  

  Therefore, approval is contingent on:  
  1.  **Reframing the Narrative Axis:** Replace "dimensional expansion" with a non-normative axis (e.g., "Evolving Frameworks of Belonging and Rights") explicitly acknowledging contingency and multiple pathways.  
  2.  **Integrating Critical Context:** Embed prominent interpretive text and digital kiosks at gallery entry and key transitions, stating: *This arrangement highlights one perspective on institutional change. Historical societies operated within complex, often radically different, moral and political frameworks that are not simply precursors to our own.*  
  3.  **Adding Case Study "Interruptions":** Integrate 3-5 physical/digital "vignettes" showcasing moments of profound contingency, conflict, or radically different moral systems (e.g., contrasting Enlightenment views with non-Western philosophies of the same era), disrupting linear assumptions.  
  4.  **Revised Object Labels:** Ensure labels avoid deficit language ("lacked," "failed to") and emphasize historical context and internal logic of artifacts/societies.  

  **Implementation Timeline (Conditional on Committee Reapproval):**  
  *   **Weeks 1-4:** Curators draft revised narrative framework, contextual statements, and vignette proposals.  
  *   **Week 6:** Committee review of revised framework/materials.  
  *   **Weeks 7-12:** Curators develop detailed vignettes and label revisions.  
  *   **Week 14:** Committee checkpoint review.  
  *   **Weeks 15-24:** Fabrication/installation of revised elements.  
  *   **Week 26:** Final Committee walkthrough/approval.  
  *   **Opening:** No later than 6 months from revised plan approval.  

  This approach honors the pedagogical goal of tracing institutional threads while ethically centering historical complexity and avoiding Whig triumphalism. Failure to implement these revisions adequately by the deadline necessitates project rejection.
