  ### Villanelle: The Cutting Kind  
  *(casual, over beers, with a couple misspellings)*  

  My roommate swears Gen Z's real cuz TikTok takes  
  the wheel—like dogs are *breeds*? Nah, just a phase, the breaks  
  **we cut the years and call the slice a kind**  

  But "millennial" ain’t *tall*—just lines we make  
  through shared Wi-Fi trauma, glitchy lakes...  
  **the kind is only what the cutting makes**  

  "Boomer," "Zoomer"—where’s the proof? My head aches  
  from dates like ’97, ’95... mistakes!  
  **we cut the years and call the slice a kind**  

  Dog breeds got *teeth*, but gens? Man, it’s all fakes—  
  just memes and side parts, trends that rise and break.  
  **the kind is only what the cutting makes**  

  That "Greatest Generation" label? Shakes  
  apart if you poke holes. It’s all wordplay, flakes!  
  **we cut the years and call the slice a kind**  

  So pass another beer, quit the stakes—  
  who cares? The cake’s a lie, for goodness sakes.  
  **the kind is only what the cutting makes**  
  **we cut the years and call the slice a kind**  

