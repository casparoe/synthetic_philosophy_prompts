  1. **Check for Structurally Equivalent Suffering:**
     - Question: Does the intervention eliminate the target suffering without generating suffering of the same kind or intensity elsewhere in the same individual, in other individuals, or in the system (e.g., ecosystem, society)?
     - What counts as sufficient: Evidence that the intervention does not cause new suffering that is at least as bad as the suffering it eliminates, and that it does not shift the suffering to others in a way that is equivalent. If there is any doubt, we must reject.
     - If yes (it does generate equivalent suffering), reject.
     - If no, proceed.

  2. **Check for Preservation of Meaningful Experience:**
     - Question: Does the intervention preserve the functional and relational conditions that make experience meaningful? Specifically, does it leave intact the capacity for relationships, personal growth, and the ability to engage with the world in a way that gives life meaning?
     - What counts as sufficient: Evidence that the intervention does not impair the subject's ability to form deep attachments, to experience a range of emotions (even if negative ones are reduced), to learn from experience, or to engage in meaningful activities. If the intervention flattens emotional range or disconnects the individual from reality in a way that undermines meaning, it fails.
     - If it destroys these conditions, reject.
     - If it preserves them, proceed.

  3. **Check for Implicit Value Hierarchy:**
     - Question: Does the intervention introduce an implicit value hierarchy that is not justified by the hedonistic imperative alone? (e.g., does it prioritize certain experiences or types of beings over others without a basis in suffering reduction?)
     - What counts as sufficient: The intervention must apply neutrally and not create or reinforce unjustified hierarchies (e.g., by only helping a privileged group, or by assuming that certain forms of suffering are more important than others without evidence). If the intervention requires assuming values beyond "reduce suffering", then it fails.
