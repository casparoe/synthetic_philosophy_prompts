  **NARRATIVE GRAVITY CONSULTING**  
  **HR ONBOARDING MANUAL & COMPLIANCE HANDBOOK**  
  **REVISION 7.3**  

  **1.0 IDENTITY VERIFICATION & ONBOARDING**  
  1.1 **Initial Narrative Coherence Screening:** Upon offer acceptance, candidates submit a Standardized Autobiographical Summary (SAS Form NG-7). This document provides the initial narrative mass required to establish your provisional Center of Narrative Gravity (CNG).  
  1.2 **Verification Protocol:** HR performs a Narrative Continuity Audit (NCA) using proprietary algorithms to quantify gravitational cohesion. A minimum coherence score of 0.78 is required for activation of access badges and payroll enrollment.  
  1.3 **Margin-for-Error Clause:** Discrepancies between SAS submissions and verifiable external records (tax filings, employment history) are permissible within a 12% narrative variance threshold. Disputes exceeding this margin require submission of NG-12: "Explanatory Narrative Fragment" forms.  
  1.4 **Provisional Status:** Full employee privileges are contingent upon maintaining Narrative Stability Coefficient (NSC) above 0.65 during the 90-day probation period (measured via bi-weekly micro-NCAs).  

  **2.0 LEGAL LIABILITY & AGENCY**  
  2.1 **The Corporate Cartesian Vacuum:** Narrative Gravity Consulting (NGC) operates under the established principle that no "inner owner" or metaphysical core self exists. Legal liability is therefore assigned solely to the *currently dominant narrative thread* associated with an employee identifier.  
  2.2 **Signature Authority:** Contracts, commitments, and disciplinary actions are binding upon the narrative complex presenting the highest gravitational signature at the time of signing/event. Retroactive challenges based on alleged "previous selves" are inadmissible without documented Branching Events (See Section 4.3).  
  2.3 **Acting Under Narrative Duress:** Claims of action taken by "non-dominant sub-narratives" (e.g., "I wasn't myself") require submission of NG-15: "Sub-Narrative Disassociation Affidavit" and supporting NCA data demonstrating gravitational overthrow exceeding 0.42 delta.  

  **3.0 WORKPLACE WELLNESS & PERFORMANCE**  
  3.1 **Narrative Maintenance:** Optimal productivity correlates with stable narrative gravity. Employees are encouraged to utilize NGC's Cognitive Coherence Resources (CCR), including subsidized journaling software and "Story Arc Optimization" workshops.  
  3.2 **Managing Fragmentation:** Competing sub-narratives ("Work Self," "Home Self," "Hobby Self") are recognized functional units. Conflict resolution protocols (NG-101) prioritize gravitational negotiation over suppression. Open narrative warfare impacting team cohesion is grounds for mandatory CCR referral.  
  3.3 **Cognitive Fragmentation Events (CFEs):** Trauma, severe stress, or poorly vetted neuro-enhancements may cause sudden narrative bifurcation. Immediate reporting via NG-22: "Potential Branching Event Notification" is mandatory. Failure to report may invalidate benefits under Section 4.0.  

  **4.0 EMPLOYEE BENEFITS & ENTITLEMENTS**  
  4.1 **Beneficiary Designation:** Pension plans, life insurance, and stock options are designated to the *narrative beneficiary* listed on NG-8. This is typically the dominant CNG at time of enrollment. Updates require a current NCA score >0.80.  
  4.2 **Narrative Continuity & Long-Term Incentives:** Vesting schedules assume narrative persistence. Employees utilizing the **Episodic Self Exemption (NG-30)** forfeit long-term stock options and incremental retirement contributions, as no continuous "long-term self" is recognized for accrual purposes. NG-30 must be renewed quarterly.  
  4.3 **Branching Protocol:**  
      *   4.3.1 **Identity Splits:** Following documented CFEs (e.g., severe trauma, failed experimental mind-upload), a Formal Branching Assessment (FBA) is conducted.  
      *   4.3.2 **Gravitational Primacy:** The narrative thread demonstrating >55% "pull" relative to the pre-branching NCA baseline retains the original employee ID, salary, seniority, and primary benefits.  
      *   4.3.3 **Secondary Threads:** Weaker threads (>25% coherence) may be offered contingent contractor status under a new ID. Threads below 25% coherence are classified as "Narrative Debris" and ineligible for benefits or legal recognition by NGC.  
      *   4.3.4 **Mind-Upload Failures:** Partial uploads resulting in digital and biological instances undergo FBA. Benefits default to the biological instance unless the digital instance demonstrates superior narrative continuity *and* passes external Turing-Consistency Verification.  

  **5.0 NARRATIVE INTEGRITY STANDARDS**  
  5.1 **Falsification Penalties:** Deliberate fabrication within SAS submissions or NG forms constitutes Narrative Fraud (Level 3 Compliance Violation), leading to immediate NSC review, potential gravitational destabilization, and termination of the implicated narrative thread.  
  5.2 **Mandatory Continuity Audits:** Annual NCAs are required for all employees. Episodic Self Exemption holders undergo monthly micro-NCAs to confirm non-unity status. Scores below 0.60 trigger CCR intervention; scores below 0.45 for 3 consecutive months may initiate involuntary Branching Assessment.  
  5.3 **External Narrative Contamination:** Employees engaged in significant external identity construction (e.g., deep undercover work, high-fidelity LARPing, cult leadership) must file NG-44: "Competitive Narrative Disclosure" to mitigate gravitational interference risks.  

  **6.0 EPISODIC SELF PROVISIONS**  
  6.1 **Eligibility:** Employees who philosophically reject diachronic (across-time) unity may apply for Episodic Self Status via NG-30. This acknowledges the employee as a series of causally linked, but ontologically distinct, narrative episodes.  
  6.2 **Implications:**  
      *   6.2.1 Performance reviews are conducted per project/episode. No cumulative annual reviews apply.  
      *   6.2.2 Salary negotiations occur at the start of each major project/episode. No automatic cost-of-living adjustments.  
      *   6.2.3 Liability (Section 2.0) is strictly confined to the episode during which an action occurred. Successor episodes bear no legal responsibility.  
  6.3 **Episode Termination:** Conclusion of a major project or self-declared "narrative chapter end" requires filing NG-31: "Episode Closure." This triggers benefits payout (prorated for the episode) and a new NG-8 form for the subsequent episode. Failure to file NG-31 within 14 days results in benefit suspension and gravitational limbo status.  

  **Compliance is Non-Negotiable. Your Narrative is Our Business.**
