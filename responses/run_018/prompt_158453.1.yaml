  hey so my roommate sent me her notes from an ethics seminar and there's this summary of the moral dilemmas debate that i can't tell if it's sloppy or just dense. she writes: "A genuine moral dilemma is when two all-things-considered obligations pull in opposite directions with no possible resolution. The standard anti-dilemma argument uses ought-implies-can: since you literally can't perform both actions at once, you can't have two genuine obligations, so at least one must be only apparent. Defenders like Bernard Williams reply that this treats moral reasoning like physics — it ignores the phenomenology of regret. After you choose one horn, you still feel you've wronged someone, and that feeling only makes sense if the lost obligation was real all along. So Williams accepts that moral logic contains true contradictions, and that's why he thinks dilemmas aren't just epistemic gaps but ontological ones. He even uses the asymmetry thesis — that wrongness doesn't cancel out rightness — to show that both obligations stay in force."

  something about this feels off, especially the part where Williams is said to accept true contradictions in logic. is this a fair summary? please seperate what's accurate, what's a common simplification, and what Williams actually denied or never said. also does his conclusion about ontological dilemmas follow from the regret argument, or is there a missing step?
