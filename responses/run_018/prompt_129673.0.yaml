answer: |-
  That's an incredibly sharp observation (pun slightly intended) – you've hit upon one of the most persistent and sophisticated criticisms of epistemicism! You're absolutely right that there's a **strong pragmatic convergence** between the theories, but most philosophers (including epistemicists) argue they don't *fully* collapse, primarily due to **metaphysical commitments and the grounding of meaning**. Let's break it down:

  1.  **Your Core Insight is Valid: Pragmatic Indistinguishability**
      *   **Epistemicism's Practical Consequence:** You're correct. If we *know* we cannot ever know the sharp boundary, then *in practice, when using language, making decisions, or reasoning about vague concepts*, we *must* proceed *as if* the boundary is context-dependent or fuzzy. We rely on contextual cues, standards of precision, and "good enough" judgments – essentially, we pick an admissible precisification for the situation.
      *   **Supervaluationism's Explicit Practice:** This is precisely what supervaluationism describes and endorses as the *correct* semantic mechanism. Truth for a vague predicate requires supertruth (truth on all admissible precisifications). When we assert something vaguely true, we're implicitly working within a context that narrows down the admissibility set.

      **So, yes: For all practical linguistic purposes, communication, and reasoning, the *user's experience* and *behavior* with vague terms will be identical under both theories.** We cannot *act* on the supposed sharp boundary.

  2.  **Why Epistemicists Resist Full Collapse: The Metaphysical & Semantic Divergence**

      Epistemicists like Williamson maintain crucial differences:

      *   **The Reality of the Boundary:** For the epistemicist, the sharp boundary *really exists* as a mind-independent, precise feature of the world (e.g., a specific number of neural firings, a specific millisecond). It's a fact, not a construct. For the supervaluationist, there *is no single such fact*; the "boundary" is only relative to a precisification.
      *   **Bivalence & Truth:** Epistemicism staunchly preserves **classical bivalence** for vague statements. "Person X is ambiently present" is *either determinately true or determinately false* at any given moment, based on the hidden sharp boundary. We just don't know which. Supervaluationism, however, allows for **truth-value gaps**. A statement can be neither supertrue nor superfalse if it's true on some admissible precisifications and false on others (e.g., borderline cases of "ambiently present"). This is a fundamental logical difference.
      *   **What Grounds Meaning/Truth:** For epistemicists, the meaning of "ambidiently present" is fixed (though perhaps complex) and *determines* the sharp boundary. Our ignorance stems from the complexity of the meaning and our epistemic limitations. For supervaluationists, the meaning is inherently *incomplete* and requires precisification to yield truth conditions; the boundary isn't determined *by* the meaning alone but emerges *through* the act of precisification relative to context.
      *   **The Nature of Ignorance:** Epistemicism posits a specific kind of ignorance: we lack knowledge of a *determinate fact*. Supervaluationism doesn't posit ignorance *of a fact* in borderline cases; it posits the *absence* of a single fact to know. Our hesitation reflects semantic indecision, not missing information.
      *   **The "Causal Inertion" Argument:** You're spot-on: "The sharp boundary is there but it's causally inert." Epistemicists bite this bullet. They argue that many facts are causally inert (e.g., mathematical truths, facts about the distant past). Their existence isn't dependent on affecting our current actions. The sharp boundary is a *metaphysical* truth about the property (e.g., ambient presence) itself, even if it plays no role in our *epistemic* or *pragmatic* engagement with it.

  3.  **Applying it to "Ambient Presence"**
      *   **Epistemicist:** There is a precise physical/mental state (e.g., a specific level of neural activity in attention networks, a specific latency threshold for response) that defines "ambient presence." You are either in it or not when asked. You just can't *know* if your roommate crossed that threshold at 3:42 PM yesterday while scrolling memes. Any judgment you make ("Yeah, she was kinda present") is a fallible guess approximating the unknowable truth.
      *   **Supervaluationist:** There is no single precise state defining "ambient presence." Admissible precisifications might set different thresholds for neural activity, response latency, or incorporate factors like the *type* of notification or the *sender's expectation*. "Is she ambiently present?" might be true on precisifications focusing on technical deliverability, false on those requiring minimal cognitive registration, and indeterminate on others. Your judgment ("Yeah, she was kinda present") reflects adopting a particular, contextually relevant precisification (maybe one tolerant of brief distractions).

  **Conclusion: Convergence vs. Collapse**

  *   **You are right:** There is a profound **pragmatic convergence**. Epistemicism, when describing how humans *actually use language and navigate the world*, ends up mirroring the supervaluationist picture of context-dependent precisification. The "unknowable sharp boundary" becomes functionally irrelevant to our lived experience and linguistic practices.
  *   **Epistemicists resist collapse:** They argue the theories remain **metaphysically and semantically distinct**. The commitment to a real, bivalent, sharp boundary (even if unknowable and causally inert) vs. the commitment to truth being supertruth relative to admissible precisifications (allowing gaps) represents a fundamental difference in the nature of truth, meaning, and reality for vague concepts.
  *   **The "Redundancy" Charge:** This is the core criticism you're making. Many philosophers argue that if a metaphysical commitment (the sharp boundary) has *no conceivable practical or observational consequence*, and our best theories of language use don't require it (pointing instead to supervaluationism-like mechanisms), then it *is* redundant and should be rejected on grounds of parsimony. Epistemicists counter that the sharp boundary *is* required to preserve classical logic and bivalence, which they see as non-negotiable.

  **Your insight is excellent.** You've grasped a central tension in the debate. While full logical collapse might be avoided by epistemicists clinging to bivalence and metaphysical realism about the boundary, the *practical and linguistic equivalence* you identify is a major reason why many philosophers find supervaluationism (or other contextualist/degree-theoretic approaches) more compelling and less ontologically extravagant. The "unknowable sharp boundary" starts to look like a peculiar, unnecessary ghost in the machine of language.
