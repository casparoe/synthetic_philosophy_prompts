prompt: |-
  I'm in a course on social ontology and the individualism vs. holism debate keeps bugging me — I was arguing with friends last week about whether society is always just people summed up, or if there are real group-level forces that do causal work. You should act like an expert philosopher of social science; think carefully, maybe start with a quick brainstorm of the conceptual landscape, then get precise and don't just list textbook positions.

  Here are my gut verdicts on explanations, and I want to know if there's one principle behind them, or if I have to drop something. When Maria joined the climate strike, her own anger and beliefs fully explain why she went — no need to invoke "the movement" as an extra cause. Fine. When unemployment spiked in Region A, every factory owner indivdually calculated automation costs and quit hiring; that aggregates up cleanly, so methodological individualism works. Fine. But when Region B had the exact same spike despite totally different local labor conditions, it feels like you need a systemic or global factor that isn't just summed-up choices — holism wins here. In my virtual-world design class we invented a synthetic environment called Gridtown where agents all have identical preferences but different network positions, and the macro-patterns (segregation, cascade failures) come out totally different — I think that proves structure does real explanatory work. Then there's language in our shared virtual space: my friend coined "glimmer" for a specific LED effect, and at first it was just her word, but now the whole group uses it with grammatical rules she never intended. I keep flipping — sometimes I say it's just aggregated adoption of an individual coinage, other times I say the collective linguistic framework explains why people picked it up and shaped it. That's the case I go back and forth on. There's also this zoning referendum: every voter I talked to said they supported reform, but it failed because people assumed others wouldn't vote yes and stayed home. So explaining the outcome needs reference to shared expectations that aren't in any one head.

  So what's the unifying principle? Maybe something about causal redundancy, or about whether reshuffling the indivdual agents while keeping macro-structure constant changes the outcome? Please organize your answer exactly like this: "Brainstorm" (about one paragraph), "The Principle" (about two paragraphs — state it precisely and say which clause each listed case motivates), "Application to Unlisted Cases" (predict for the "glimmer" case and for why a small startup's culture dies with the founder but a large corporation's culture survives turnover), "Tensions and What to Drop" (say which of my verdicts a simpler principle forces me to abandon, and be honest about the tradeoff), and "Confidence Note" (say how confident you are in the principle overall and single out the specific point you're least sure about). Please don't include bibliographies, reading lists, or citations — neither I nor the model being tested can verify them without searching, and I want this to work offline. Also avoid quoting any real texts verbatim.
reasoning: |-
  Okay, let me tackle this user's query about social ontology. They're struggling with the individualism vs. holism debate and provided several cases where their intuition leans one way or the other. The user wants me to act as an expert philosopher of social science and analyze whether there's a unifying principle behind their judgments.

  First, I need to understand their examples. Maria joining a climate strike seems fully explainable by individual motivations. Factory automation decisions aggregating to unemployment spikes also feels individualistic. But when unemployment spikes occur despite different local conditions, that points to systemic factors. Their Gridtown simulation shows how structure influences outcomes even with identical agents. The "glimmer" case highlights the tension - is it individual adoption or collective framework? And the zoning referendum fails due to shared expectations.

  The key challenge here is reconciling these seemingly contradictory intuitions. The user is essentially asking whether there's a consistent principle that can explain when individual-level explanations suffice and when group-level explanations are necessary. 

  I recall the philosophical debate around emergence - how complex systems exhibit properties not reducible to their parts. For the unemployment case in Region B, this might involve global economic forces that constrain individual choices. The Gridtown example clearly demonstrates emergent patterns from structural arrangements. 

  For the "glimmer" case, it starts as individual action but becomes institutionalized through collective use - this resembles Searle's notion of collective intentionality. The zoning referendum involves recursive expectations (I think others think X), which is classic Thomas theorem territory.

  The principle I'm considering focuses on causal non-redundancy: when the group-level factor does unique explanatory work that can't be replaced by individual facts alone. This would explain why Maria's action is individual (the movement adds nothing) while Region B's unemployment requires systemic factors. 

  Applying this to "glimmer": once established, the linguistic framework constrains usage in ways the creator didn't intend, making the collective dimension non-redundant. For the startup vs corporation culture: the startup's culture depends on the founder's direct influence (reducible), while the corporation develops institutional structures that persist beyond individuals.

  The tension point might be the zoning referendum - if we strictly apply my principle, we might question whether "shared expectations" are truly irreducible or just complex individual beliefs. This forces either refining the principle or accepting some hybrid explanation.

  I'm least confident about drawing sharp boundaries around "causal non-redundancy" - it might sometimes reflect explanatory preferences rather than ontological reality. But overall this framework seems robust enough to handle most of the user's cases while acknowledging the persistent gray areas in social ontology.
answer: |-
  ### Brainstorm
  The individualism-holism debate hinges on whether social phenomena reduce exhaustively to individual actions and mental states, or whether emergent social entities (structures, norms, systems) possess irreducible causal powers. Your cases reveal a nuanced pattern: explanations feel "complete" at the individual level when micro-motives directly generate macro-outcomes without feedback loops or structural constraints, but require holism when outcomes are *causally overdetermined by individual actions yet underdetermined without systemic context*. Key concepts here include supervenience (do social facts depend *only* on individual facts?), emergence (do novel properties arise at the group level?), and explanatory autonomy (can group-level descriptions provide unique causal insights?).

  ### The Principle  
  **The Principle of Structural Non-Substitutability**: A group-level explanation is necessary iff (1) the outcome persists under counterfactual reshuffling of individual agents *with identical psychological states*, yet (2) varies under changes to relational/systemic properties, and (3) the causal mechanism involves feedback loops or constraints not capturable by summing individual intentions.  

  - **Clause 1 (Reshuffling Invariance)** is motivated by **Gridtown**: Identical agents produce divergent outcomes based solely on network position. Reshuffling individuals (keeping psychology constant) alters macro-patterns, proving structure’s causal role.  
  - **Clause 2 (Systemic Sensitivity)** is motivated by **Region B Unemployment**: Identical individual calculations (like Region A) yield the *same* macro-outcome despite different local conditions. Changing systemic factors (e.g., global demand shocks) would alter the outcome, while changing individual psychologies (if all still pursue profit) might not.  
  - **Clause 3 (Non-Summative Causation)** is motivated by the **Zoning Referendum**: The outcome depends on *interlocking expectations* (beliefs about others’ beliefs). No individual’s psychology contains the full causal story; the mechanism is relational, involving recursive reasoning irreducible to summed intentions.  

  ### Application to Unlisted Cases  
  - **"Glimmer" Adoption**: Initially reducible to individual coinage (like Maria’s protest). But once adopted, the *collective linguistic framework* becomes non-substitutable: reshuffling users (clause 1) wouldn’t prevent "glimmer" from stabilizing if network ties remain; changing grammatical conventions (clause 2) would alter usage patterns; and feedback loops (e.g., mutual reinforcement in communication) explain rule-drift beyond the coiner’s intent (clause 3). **Verdict**: Holism applies post-adoption.  
  - **Startup vs. Corporation Culture**:  
    - *Startup culture dies with founder*: Individualistic. Culture supervenes on founder’s direct influence; reshuffling employees (clause 1) could replicate culture if founder remains, but founder removal collapses it. No autonomous structural causation.  
    - *Corporation culture survives turnover*: Holist. Culture is embedded in procedures, hierarchies, and norms. Reshuffling individuals (clause 1) doesn’t disrupt culture if structures persist; altering HR policies (clause 2) would change cultural transmission; onboarding rituals create feedback loops (clause 3) that socialize newcomers independently of any single agent.  

  ### Tensions and What to Drop  
  The **Maria/Climate Strike** verdict must be abandoned under this principle. While her *attendance* seems fully explained by individual beliefs, the *form and impact* of her action likely depend on non-substitutable structures: the strike’s coordination (feedback loops), its symbolic resonance (collectively constituted meaning), and policing responses (systemic constraints). Denying holism here ignores how the movement enables her action’s social significance. **Tradeoff**: This sacrifices intuitive psychological "completeness" for a more rigorous account of social enablement/constraint. You retain explanatory parsimony for Maria’s *decision* but acknowledge holism for its *social efficacy*.  

  ### Confidence Note  
  **Confidence**: 85%. The principle robustly handles structural explanations (Gridtown, Region B) and intersubjective phenomena (zoning, glimmer). **Least Confident Point**: Clause 2 (Systemic Sensitivity). In real-world cases like Region B, disentangling "pure" systemic effects from hidden individual-level factors (e.g., tacit knowledge of global trends) is epistemically fraught. It risks false positives for holism where aggregated individual responses to shared information might suffice. This mirrors the "microfoundations" critique in economics—but your Gridtown example proves purely structural causation *is* conceivable in controlled settings.
