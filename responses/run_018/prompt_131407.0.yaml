  We are going to break down the phrase "different cultures, different morals—there's no right answer" into several distinct readings. We will assess each reading on several dimensions: what precise claim it makes, whether it is trivial, defensible, or false, whether it justifies shutting down the argument (i.e., blocking the claim that a practice like forced marriage might be objectively wrong), and a key distinction or counterexample that separates it from the others.

  We note that the phrase is used in the context of cross-cultural moral disagreement and is employed to cut off arguments that a culture might be mistaken about a moral practice. We are particularly interested in how moral judgments are being analogized to taste judgments (like cilantro tasting like soap) versus factual judgments (like the shape of the earth).

  We will consider the following readings:

  1. **Empirical Relativism**: The claim that, as a matter of fact, different cultures have different moral codes.
  2. **Metaethical Relativism**: The claim that moral truths are relative to cultures, so that there are no universal moral truths.
  3. **Epistemic Relativism**: The claim that we cannot know which moral code is correct, so we should suspend judgment.
  4. **Tolerance Prescription**: The claim that we ought to tolerate other cultures' moral practices even if we disagree.
  5. **Moral Non-Cognitivism**: The claim that moral judgments are not truth-apt (they are expressions of emotion or preference) and hence cannot be objectively true or false.
  6. **Moral Disagreement as Taste**: The claim that moral disagreements are like disagreements about taste (e.g., cilantro) and not like disagreements about facts.

  For each, we will evaluate:

  - **Trivial, defensible, or false?**: 
    - Trivial: if the claim is obviously true and not controversial.
    - Defensible: if there are reasonable arguments and evidence supporting it.
    - False: if it is generally considered incorrect or unsupported by evidence.

  - **Does it justify shutting down the argument?**: Whether this reading of the slogan actually supports the move to block the argument that a practice might be objectively wrong.

  - **Key distinction or counterexample**: What sets this reading apart.

  Let's build the table:

  | Reading label              | The precise claim it makes                                                                 | Trivial, defensible, or false? | Does it justify shutting down the argument? | Key distinction or counterexample |
  |----------------------------|---------------------------------------------------------------------------------------------|--------------------------------|---------------------------------------------|-----------------------------------|
  | **1. Empirical Relativism** | As an empirical fact, moral norms and values vary across cultures.                         | Trivial (supported by cross-cultural research) | No. It merely describes variation and does not imply that no culture can be wrong. | Counterexample: Variation in beliefs about the shape of the earth does not imply there is no objective shape. |
  | **2. Metaethical Relativism** | Moral truths are not absolute but relative to each culture's framework. What is morally right or wrong is determined by the norms of the culture. | Defensible (but controversial; supported by some philosophical views) | Yes. If morality is relative to culture, then a practice is wrong only if the culture says it is, so no external critique is valid. | Counterexample: If a culture's moral code changes (e.g., on slavery), it becomes wrong even if it was previously accepted? This leads to internal contradictions. |
  | **3. Epistemic Relativism** | We cannot know which moral code is objectively correct (if there is one) due to the deep disagreement and lack of objective standards. | Defensible (in some forms) | Partially. It might block claims of certainty but not necessarily the possibility of objective wrongness. | Distinction: Even if we can't know, there might still be an objective truth. This is about knowledge, not truth. |
  | **4. Tolerance Prescription** | We ought to respect and tolerate the moral practices of other cultures, even if we disagree. | Defensible (as a normative claim) | Not directly. It may suggest we shouldn't interfere, but it doesn't deny the practice might be wrong. | Counterexample: We might tolerate a practice we think is wrong (e.g., for pragmatic reasons) without changing our moral judgment. |
  | **5. Moral Non-Cognitivism** | Moral judgments are not statements of fact but expressions of emotion, commands, or attitudes. Hence, they are neither true nor false. | Defensible (in some metaethical views) | Yes. If moral judgments are not truth-apt, then claims of objective wrongness are meaningless. | Counterexample: Even if non-cognitivist, we can still reason about moral attitudes and criticize inconsistencies. |
  | **6. Moral Disagreement as Taste** | Moral disagreements are fundamentally like disagreements about taste (e.g., cilantro tasting like soap) and not like disagreements about objective facts. | Defensible (but controversial) | Yes. If moral judgments are like taste, then there's no fact of the matter to be wrong about. | Counterexample: We don't hold others morally accountable for taste preferences, but we do for moral wrongs. |

  Now, let's consider each in more detail:

  1. **Empirical Relativism**: This is the observation that moral norms vary. It is trivial because the cross-cultural data (like the work of Haidt and others) supports it. However, it does not by itself imply that there is no objective moral truth. Therefore, it does not justify shutting down the argument that a practice is objectively wrong. The key counterexample is that there can be variation in beliefs without undermining objectivity (e.g., flat earth vs. round earth).

  2. **Metaethical Relativism**: This is the view that moral truth is relative to culture. It is defensible (held by some philosophers) but controversial. It would justify shutting down the argument because if morality is relative, then the only standard is the culture itself. However, it faces the counterexample that it might lead to internal contradictions (e.g., a culture that once endorsed slavery and now condemns it cannot say both were right at their times without undermining the possibility of moral progress).

  3. **Epistemic Relativism**: This claims we cannot know objective moral truths. It might be defensible given persistent disagreement, but it doesn't deny the possibility of objective truth. Therefore, it might block claims of certainty but not the possibility of objective wrongness. The key distinction is that this is about knowledge, not truth.

  4. **Tolerance Prescription**: This is a normative claim that we should be tolerant. It is defensible (and a common liberal value) but does not imply that the practice isn't wrong. Hence, it doesn't justify shutting down the argument about objective wrongness. We might tolerate something we think is wrong.

  5. **Moral Non-Cognitivism**: This view says moral statements aren't truth-apt. It is defensible (e.g., emotivism, prescriptivism). It would justify shutting down the argument because it denies that moral claims can be true or false. However, even non-cognitivists might allow for rational moral discourse by appealing to shared attitudes or principles.

  6. **Moral Disagreement as Taste**: This analogy suggests that moral disagreements are like taste disagreements. It is defensible but controversial. It would justify shutting down the argument because if it's just a matter of taste, there's no fact to be wrong about. The key counterexample is that moral judgments typically involve demands for universal agreement and accountability, unlike taste.

