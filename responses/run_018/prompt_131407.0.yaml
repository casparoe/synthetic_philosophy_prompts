  ### **Key Takeaways for Your Discussion**  
  - The shutdown move ("no right answer") **only works under specific readings** like Metaethical Relativism or Moral Non-Objectivism, which treat morals as akin to taste. These are defensible but *not* entailed by the empirical data (which only supports the trivial descriptive claim).  
  - **Counter-shutdown strategies**:  
    - If the claim is **empirical**, note that variation doesn’t preclude objectivity (e.g., cultures once disagreed about heliocentrism).  
