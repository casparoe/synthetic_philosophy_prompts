  Now this new case - a being experiencing both hot and not-hot simultaneously as a unified qualia, framed with paraconsistent logic. The core tension is whether the tutor will treat this like zombies (conceivability as epistemic gap) or like red-green cubes (genuile impossibility). The hypercube analogy is tempting because of the "non-classical framework" angle, but phenomenal states seem different - they're directly about qualitative content, not abstract mathematical structures.

