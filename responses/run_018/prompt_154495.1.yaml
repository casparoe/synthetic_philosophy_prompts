  I should address the commodification aspect too. Biometric data being harvested as commodities adds a modern twist Rousseau didn't consider, but it fits his suspicion of external influences corrupting natural impulses. The hidden algorithms controlling the narrative would represent the ultimate opaque authority, opposed to Rousseau's ideal of transparency.

