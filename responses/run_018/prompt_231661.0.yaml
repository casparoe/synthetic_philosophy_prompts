   Polished Procedure for Auditors:

   Title: Welfare Assessment for Slaughter Methods

   Steps:

   1. Determine if the species requires precaution for slaughter welfare.
      a. For finfish: always yes.
      b. For crustaceans (shrimp, prawns, crabs):
          - Consult the provided evidence summary for the species.
          - If the evidence for both nociception and pain-like behavioral responses is "No", then no precaution is needed -> go to step 6 (certify, unless other non-welfare issues).
          - If the evidence for either nociception or pain-like behavior is "Yes", or if both are "Unclear", then precaution is needed -> proceed to step 2.

   2. Assess the pain risk (PR) of the current slaughter method:
      a. Severity (S) of pain-if-it-exists:
          - Low: Minimal distress (e.g., immediate and effective stunning followed by rapid killing).
          - Medium: Moderate pain (e.g., asphyxiation for a short time, or a quick kill without prior stunning that leads to rapid unconsciousness).
          - High: Severe pain (e.g., boiling alive, slow asphyxiation, dismemberment without stunning, prolonged exposure to extreme temperatures without prior stunning).
      b. Duration (D) of pain-if-it-exists:
          - Brief: < 10 seconds.
          - Moderate: 10 seconds to 2 minutes.
          - Prolonged: > 2 minutes.
      c. Assign PR:
          - High if: S = High OR (S = Medium AND D = Prolonged)
          - Medium if: (S = Medium AND D = Moderate or Brief) OR (S = Low AND D = Prolonged)
          - Low: Otherwise (S=Low and D=Brief or Moderate).

   3. If the method involves mechanical stunning or killing with a risk of failure (e.g., percussive stunner, guillotine), assess the failure rate (F) from records or observation:
