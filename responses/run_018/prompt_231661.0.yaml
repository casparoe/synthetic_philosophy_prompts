prompt: |-
  I am the standards director for a seafood certification body whose higher-welfare label covers farmed finfish and, newly, farmed decapod crustaceans — mainly shrimp and prawns, with a few crab producers. Last night I spent a long evening arguing with a friend about whether shrimp can suffer. She kept insisting that without proof we should treat them as if they feel nothing and confine the label to finfish; I kept insisting that uncertainty is not a licence, and that our credibility depends on taking the possibility of crustacean suffering seriously. The argument ended with her saying, in effect: if you think that, write me the rule that treats a shrimp's possible pain with the right seriousness without shutting down every shrimp farm. I realized I could not produce such a rule, and that our current welfare requirements for crustacean slaughter are more a mood than a standard.

  I want you to write that rule as a decision procedure our auditors can actually run. You are a philosopher who works on animal consciousness and practical ethics and who has experience turning philosophical precautions into operational frameworks for non-philosophers. Work through the problem in stages before presenting anything final: brainstorm the distinct difficulties the procedure must handle; identify the threshold questions and the credible answers an auditor might give to each; draft the rules; test them against the cases below; then produce one polished procedure.

  The procedure is for a single auditor with no philosophical training, on a farm visit of at most half a day, deciding whether the operation's handling and slaughter practices for farmed fish and decapod crustaceans may be certified under the label. The auditor must return one of: certify; certify with corrective actions; do not certify. We run roughly 150 audits a year, a substantial share of them turning on slaughter methods, and the label's value to retailers depends on consistency across auditors; borderline cases can be escalated to me and a standards committee, but the procedure should make that the exception rather than the norm.

  The inputs the auditor can reliably obtain are: the species and what is known about its nociception and pain-like states; the specific handling and slaughter methods; observed failure rates where the method is mechanical; the number of animals affected per cycle; and the availability, cost, and operator reliability of the best alternative method. The procedure must not require the auditor to settle whether shrimp, prawns, or crabs feel pain, and it must not silently assume they do or don't. It should discipline the precautionary principle rather than wave it around: say how much and what kind of evidence of possible sentience triggers protective measures, how the severity and duration of pain-if-it-exists enter, how numbers of animals do or do not aggregate across the operation's throughput, and where the procedure stops and hands the question to a values committee because the residual choice is about how much a possible discomfort in a huge number of animals weighs against an avoidable severe pain in a few, or against the survival of a producer.

  Please apply the finished procedure to these cases, giving the decision and the decisive step in each:

  (i) a high-volume whiteleg shrimp farm that chills live shrimp in an ice slurry and then mechanically splits them, with no pre-stunning, and argues that alternatives are unproven and expensive;

  (ii) a salmon farm using automated percussive stunning with continuous monitoring that shows a 3% failure rate, after which fish proceed to bleeding while possibly still conscious;

  (iii) a small crab producer that boils crabs alive and argues that rapid killing is safer for workers than machinery they do not trust.

  At least one of these should be a case where the procedure, honestly applied, returns an answer I personally do not want to sign — either certifying something I find repellent or failing a producer I respect. Tell me explicitly which case that is and why the procedure gives that answer.

  A few constraints. Give me a committed procedure: where a default is needed, choose it and defend it, rather than presenting a menu of defensible defaults. Only leave genuinely value-laden decisions to the values committee, and keep that list as short as you can; say plainly what the procedure cannot do — what it will not settle about crustacean sentience, and what no procedure can remove from the certifying body's judgment. Do not pad the document with citations or a literature review; I will supply the evidence base. And do not let the procedure collapse into either a pure precautionary veto that fails every practice not proved safe, or a pure cost-benefit test that permits any amount of suffering if the throughput is high enough.
reasoning: |-
  We are designing a decision procedure for auditors of a seafood certification body. The challenge is to handle uncertainty about crustacean sentience while ensuring practical, consistent outcomes. The procedure must avoid both excessive precaution (which could shut down farms) and negligence (ignoring potential suffering).

   Key difficulties the procedure must handle:
   1. Uncertainty about sentience: We don't know if crustaceans feel pain, but evidence of nociception and pain-like behavior exists for some species. The procedure must trigger protective measures based on credible evidence without requiring definitive proof.
   2. Severity and duration: If pain exists, how bad is it and how long does it last? This must factor into the assessment.
   3. Numbers: How do we aggregate potential suffering across many animals? We must avoid letting high numbers automatically veto a method (because that might shut down most farms) but also avoid ignoring scale entirely.
   4. Alternatives: The availability, cost, and reliability of better methods must be considered, but the procedure must not let cost alone override welfare concerns without a clear threshold.
   5. Consistency: The procedure must yield consistent results across auditors and farms.

   Threshold questions and credible auditor answers:
   We break the decision into stages.

   Stage 1: Determine if the species has sufficient evidence of potential sentience to trigger precautionary protection.
     - Question 1A: Is there credible evidence of nociception (i.e., specialized receptors and neural pathways for harmful stimuli) in the species?
       - Auditor can answer: Yes, No, or Unclear (based on provided evidence base).
     - Question 1B: Is there credible evidence of pain-like states (i.e., behavioral responses beyond reflexes, such as avoidance learning, protective behavior, or trade-offs against other motivations)?
       - Auditor can answer: Yes, No, or Unclear.

     If the answer to both 1A and 1B is "No", then the species does not trigger precautionary protection for slaughter methods. However, note that for finfish we typically assume they are sentient, so this stage is mainly for crustaceans.

     But we must be cautious: even if the evidence is "Unclear" for one or both, we might still trigger protection. We set a threshold: if either 1A or 1B is "Yes", or if both are "Unclear", then we move to Stage 2. Only if both are "No" do we bypass welfare considerations for slaughter for that species.

     Why "Unclear" triggers protection? Because uncertainty is not a license to ignore. However, we note that for well-studied species with clear negative results, we can avoid burdening the farm.

   Stage 2: For species that trigger precaution (i.e., those that passed Stage 1), we assess the slaughter method on two dimensions:
     - Severity of pain-if-it-exists (S): This is the intensity and nature of the suffering. We categorize:
          Low: Mild discomfort, short-lived (e.g., brief handling stress).
          Medium: Moderate pain, but not extreme (e.g., a quick cut without prior stunning if the cut is instantaneously fatal or quickly leads to unconsciousness).
          High: Severe pain (e.g., boiling alive, crushing without prior stunning, prolonged asphyxiation).

     - Duration of pain-if-it-exists (D): How long the pain might last until insensibility or death.
          Brief: Seconds (e.g., a properly applied stun that renders the animal insensible immediately, followed by killing within seconds).
          Moderate: Up to a minute or two.
          Prolonged: Several minutes or more.

     We then combine S and D into an overall "Pain Risk" level (PR):
          If S is High, then PR is High regardless of D (because even brief severe pain is bad).
          If S is Medium and D is Prolonged, then PR is High.
          If S is Medium and D is Brief or Moderate, then PR is Medium.
          If S is Low and D is Prolonged, then PR is Medium.
          If S is Low and D is Brief or Moderate, then PR is Low.

     The auditor must assign S and D based on the method and species biology.

   Stage 3: Assess the reliability of the method (for mechanical methods) and the failure rate.
     - For methods that require a mechanical step (like percussive stunning), the observed failure rate (F) must be considered. We set a threshold for acceptable failure: if F <= 1%, then we consider the method reliable. If 1% < F <= 5%, then we require corrective actions to reduce failure. If F > 5%, the method is unacceptable without modification.

     However, note: even with a low failure rate, if the failure leads to high pain risk for the failed individuals, we must consider the absolute numbers. But we have to avoid being paralyzed by large numbers.

     We set a rule: if the failure rate leads to more than X animals per slaughter cycle suffering high pain risk, then it becomes unacceptable. But how to set X? We must balance with the scale of the operation.

     Instead, we use a proportional approach: the overall welfare impact of the method is the pain risk per animal multiplied by the number of animals subjected to that risk. But we cannot let huge numbers automatically veto a method that is otherwise acceptable for a small number. So we focus on the per-animal risk and the failure rate, and then set a threshold on the failure rate.

     We decide: if the failure rate is above 1% and the pain risk for the failed animals is High, then the method is unacceptable without corrective actions to reduce failure. If the failure rate is above 5%, then it is unacceptable even with corrective actions (meaning immediate rejection). For medium pain risk, we allow up to 5% failure rate with corrective actions.

   Stage 4: Consider the best alternative method (BAM). We require that the BAM must be available, cost-effective (meaning the cost is not prohibitive to the point of making the farm unviable), and the operator must be able to implement it reliably.

     - Availability: Is there a known method that is better (i.e., lower pain risk) for this species?
     - Cost: Is the cost of the BAM less than a certain percentage of the farm's operating costs? We set a threshold: if the BAM would increase production costs by more than 10%, then it is considered prohibitively expensive. Otherwise, it is cost-effective.
     - Reliability: Can the farm operators be trained to use the BAM effectively? And is the equipment reliable? We require that the BAM must have a proven track record in similar settings or, if new, must be supported by training and maintenance plans.

     If a BAM exists that is available, cost-effective, and reliable, then the current method must be replaced by the BAM to be certifiable.

     If no BAM exists, or if the BAM is not cost-effective, then the current method may be acceptable if the pain risk is Low or Medium. But if the pain risk is High, then the method is unacceptable unless there is no BAM at all (even if unavailable or too expensive). In other words, high pain risk methods are only acceptable if there is no alternative whatsoever.

   Stage 5: The aggregation problem and the final decision.
     We do not aggregate the potential suffering across the entire operation to avoid the situation where a small per-animal risk becomes an overwhelming total harm. Instead, we focus on the per-animal risk and the failure rate. However, we set a rule that if the pain risk is High and the method is applied to a large number of animals, we require the method to be changed even if the alternative is costly, unless it would put the farm out of business (which we define as a cost increase of more than 20% in production costs). But note: we already have a cost threshold of 10% for requiring the BAM. So for High pain risk, we are stricter.

     We structure the final decision as a flowchart:

     Step 1: For the species, if Stage 1 does not trigger precaution (i.e., both 1A and 1B are "No"), then the slaughter method is acceptable for welfare purposes (certify, unless other non-welfare issues).

     Step 2: If precaution is triggered, then:
        a. If the pain risk (PR) is Low: certify, but note that improvements are encouraged.
        b. If PR is Medium: then we look at the failure rate (if applicable) and the BAM.
            - If the method is mechanical and failure rate (F) > 5%, then do not certify.
            - If F <= 5% but > 1%, then certify with corrective actions (to reduce F below 1% within a set timeframe).
            - If F <= 1%, then we check the BAM: if a BAM exists that is available, cost-effective (<=10% cost increase) and reliable, then require the farm to adopt it within a reasonable period (certify with corrective actions). If no such BAM exists, then certify.
        c. If PR is High: 
            - Check if a BAM exists. If a BAM exists and is available, then even if it is expensive (up to 20% cost increase) we require the farm to adopt it (certify with corrective actions). If the BAM would increase costs by more than 20%, then we escalate to the values committee because the trade-off between welfare and economic viability is too severe for the auditor to decide.
            - If no BAM exists at all, then we must accept the current method? But note: we are dealing with high pain risk. We set a rule: without a BAM, the method is unacceptable (do not certify) because we cannot certify a method that causes high pain risk when we have no alternative. However, if the method is the only one available and the farm would otherwise go out of business, and the species' sentience is uncertain, we might allow it? But that's the values committee.

     We decide: for high pain risk, if there is no BAM, then the method is unacceptable and we do not certify. The rationale is that the precautionary principle requires us to avoid high pain risk when we don't know if the animal suffers. We are not shutting down the farm because they can still operate without the label, but our label requires avoiding high pain risk.

     However, note: what if the pain risk is high but the evidence of sentience is weak? We already triggered precaution in Stage 1. We are acting as if the animal might feel pain. So we must be consistent.

     Therefore, the procedure for High pain risk is:
        - If a BAM exists and is available (even if costly, up to 20% cost increase), then we require the farm to adopt it (with a plan and timeline) and give "certify with corrective actions".
        - If a BAM exists but is prohibitively expensive (cost increase >20%) or not available (e.g., no supplier in the region), then we escalate to the values committee.
        - If no BAM exists at all, then we do not certify.

   Stage 6: Values committee escalation.
     We escalate in two cases:
        1. When the pain risk is High and a BAM exists but is prohibitively expensive (cost increase >20%) or not available.
        2. When the evidence in Stage 1 is borderline and the auditor is unsure (but we have designed Stage 1 to avoid this by having clear thresholds).

     The procedure leaves to the committee the decision of whether to allow a temporary exception for a high pain risk method when the alternative is too costly or unavailable, and for how long, or to require the farm to invest despite the cost. Also, the committee handles cases where the evidence of sentience is conflicting.

   Draft Rules:

   The auditor must follow these steps:

   1. Species Assessment (for crustaceans; for finfish, skip to step 2 because we assume they are sentient):
        a. Check evidence for nociception: 
            - If the evidence says "No" (i.e., no known nociceptors or neural pathways), then note: Nociception = No.
            - If the evidence says "Yes" or is inconclusive (some studies show, some don't, or limited studies), then Nociception = Unclear/Yes. But for simplicity, we map: if any credible evidence of nociception exists, then answer is "Yes". If no evidence exists or evidence is negative, then "No". If there is conflicting evidence or very limited data, then "Unclear".
        b. Check evidence for pain-like states (behavioral): same as above.
        c. If both are "No", then the species does not require precaution in slaughter. Proceed to step 2 but note that the pain risk assessment is moot. The method is acceptable for welfare. (But note: we still care about humane handling, but that's not the focus here.)
        d. If either is "Yes" or both are "Unclear", then we apply precaution: the species is treated as potentially sentient and we proceed to step 2.

   2. Assess the slaughter method for pain risk (if the species is finfish or passed 1d):
        a. Severity (S): 
            - Low: Methods that cause minimal distress (e.g., immediate and effective stunning followed by killing before recovery).
            - Medium: Methods that cause moderate pain (e.g., asphyxiation in air or on ice for a short time, or a quick kill without prior stunning that leads to rapid unconsciousness).
            - High: Methods that cause severe pain (e.g., boiling alive, slow asphyxiation, dismemberment without stunning, or exposure to extreme temperatures for more than a few seconds without prior stunning).
        b. Duration (D):
            - Brief: < 10 seconds.
            - Moderate: 10 seconds to 2 minutes.
            - Prolonged: > 2 minutes.
        c. Assign PR (Pain Risk) as:
