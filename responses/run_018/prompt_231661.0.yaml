      - Note: For non-mechanical methods (e.g., chilling, asphyxiation), skip to step 4.

   4. Identify the Best Alternative Method (BAM) that has a lower PR than the current method. Consider methods that are:
      - Known to be effective for the species.
      - Available (equipment/training accessible in the region).
      - Cost-effective: adopting the BAM would not increase production costs by more than 10% (for PR=Low or Medium) or 20% (for PR=High). If the cost increase is above these thresholds, the BAM is not cost-effective for this assessment.
      - Reliable: the method has been proven in similar operations or, if new, comes with training and maintenance support to ensure proper implementation.

   5. Decision based on PR:

      A. If no precaution was triggered in step 1: Certify.

      B. If PR = Low: Certify.

      C. If PR = Medium:
          a. If the method is mechanical and has a failure rate:
              - F <= 1%: then if a BAM exists that is available, cost-effective (<=10% cost increase) and reliable, then Certify with Corrective Actions (adopt BAM within 6 months). Otherwise, Certify.
              - 1% < F <= 5%: Certify with Corrective Actions (reduce F to <=1% within 6 months). Additionally, if a BAM exists that is available, cost-effective, and reliable, then the corrective actions must include adopting the BAM.
              - F > 5%: Do Not Certify.
          b. If the method is non-mechanical: 
              - If a BAM exists that is available, cost-effective, and reliable, then Certify with Corrective Actions (adopt BAM within 6 months). Otherwise, Certify.

      D. If PR = High:
          a. If a BAM exists that is available and has a lower PR:
              - If the BAM is cost-effective (cost increase <=20%) and reliable, then Certify with Corrective Actions (adopt BAM within 6 months; if cost increase between 10% and 20%, the farm may request up to 18 months for implementation).
              - If the BAM is not cost-effective (cost increase >20%) or not available (e.g., no supplier, not feasible for the farm), then escalate to the standards committee.
          b. If no BAM exists: Do Not Certify.

   6. Note: In all cases, if the decision is "Certify with Corrective Actions", the auditor must specify the actions and timeline. The farm must provide a plan and timeline for implementation.

   7. Escalation: If the decision requires escalation (as in D.a above) or if the evidence for sentience is highly conflicting and the auditor is unsure, escalate to the standards committee.

   Testing the Cases:

   Case (i): High-volume whiteleg shrimp farm with chilling and splitting, and no BAM available.
     - Step 1: Precaution triggered (Yes for nociception, Unclear for pain-like -> triggers precaution).
     - Step 2: PR = High (S=Medium, D=Prolonged -> High).
     - Step 4: No BAM available (by assumption).
     - Step 5D: PR=High and no BAM -> Do Not Certify.

   Case (ii): Salmon farm with percussive stunning (3% failure rate)
     - Step 1: Precaution triggered (finfish).
     - Step 2: The method for successful stuns: PR=Low. But the failures have PR=Medium. However, we are assessing the method as a whole. We note that the method has a failure rate and when it fails, the fish experience medium pain risk. So the method has a potential for medium pain risk? Actually, we consider the entire method and note that the failure is part of it. We assign the worst pain risk that occurs? But the procedure doesn't require that. Instead, we note that the method has a failure rate and that the pain risk for the failed animals is medium. Then we go to step 5C (since PR for the failed animals is medium) and then look at the failure rate.
          Alternatively, we could say the method's PR is low with a 3% chance of medium. But the procedure in step 5C handles the failure rate as part of the decision for PR=Medium.
          So: 
            Step 2: We don't assign an overall PR to the method? We only assign PR to the experience of an animal. The procedure says: assess the method for pain risk. But note: the method has two outcomes. We are to assign the pain risk that an animal would experience if subjected to the method. But that depends on whether it is stunned successfully. So we must consider the failure rate in step 3 and then the decision in step 5C.

          We do:
            Step 2: The method can result in either Low PR (if stunned) or Medium PR (if failed). We do not assign a single PR. Instead, we note that the method has a failure rate and the pain risk for the failed animals is Medium. Then we go to step 5C because the potential for medium pain risk is present (even if only in 3%).
          Then step 5C: PR=Medium and mechanical method with failure rate F=3% (which is between 1% and 5%). So we require corrective actions to reduce F to <=1% within 6 months. We also check BAM: if there is a better method? Let's assume there isn't (percussive stunning is state of the art). So we don't require a BAM. 
          Decision: Certify with Corrective Actions (reduce failure rate).

   Case (iii): Small crab producer that boils crabs alive.
     - Step 1: Precaution triggered (crabs: yes for both).
     - Step 2: PR = High (boiling alive: S=High, D=Prolonged).
     - Step 4: BAM exists (electrical stunning) and is available. Cost increase: 15% (which is <=20% -> cost-effective). Reliability: with training, it is reliable.
     - Step 5D: PR=High and BAM exists and is available, cost-effective (15%<=20%), and reliable -> Certify with Corrective Actions (adopt electrical stunning within 6 months; since 15%>10%, the farm may request up to 18 months).

   The case that might be personally hard: Case (i) variant (no BAM) where we Do Not Certify the shrimp farm. This might shut them out of the label and they might not change their practices. But the procedure requires it.

   We note: the procedure is designed to be applied consistently and to take potential suffering seriously, even when that leads to hard decisions.

   Final note: The procedure does not settle the question of crustacean sentience. It uses the available evidence to trigger precaution when there is any positive or unclear evidence. It then focuses on the risk of pain and the availability of alternatives. The values committee is only needed for high pain risk cases when the alternative is very expensive or unavailable, or when the evidence is highly conflicting. The procedure cannot remove the inherent uncertainty about sentience, but it ensures that we act responsibly in the face of that uncertainty.
answer: |-
  ### Draft Decision Procedure for Higher-Welfare Slaughter Certification  
  **Philosophical Anchors**:  
  1. **Uncertainty ≠ Permission**: Absence of proof of sentience does not justify inaction.  
  2. **Precautionary Discipline**: Evidence thresholds trigger safeguards; severity/duration scale responses.  
  3. **Non-Aggregation**: Per-animal welfare is primary; numbers influence alternatives, not permissibility.  
  4. **Operational Reality**: Cost thresholds (10% for Medium risk, 20% for High) balance welfare and viability.  

  ---

  ### Stage 1: Brainstorming Core Difficulties  
  1. **Sentience Uncertainty**: Auditors cannot resolve crustacean consciousness debates.  
     - *Requirement*: Trigger safeguards based on credible evidence of *possible* sentience, not proof.  
  2. **Risk Scaling**: How to quantify "pain-if-it-exists" severity/duration without anthropomorphism.  
     - *Requirement*: Define pain-risk tiers (Low/Medium/High) using objective indicators (e.g., behavior, physiology).  
  3. **Failure Rates**: Mechanical methods risk partial effectiveness (e.g., stunners).  
     - *Requirement*: Set failure-rate ceilings tied to pain-risk level.  
  4. **Alternatives Assessment**: Best Alternative Methods (BAM) must be feasible, not theoretical.  
     - *Requirement*: Evaluate cost (<10–20% operational increase), availability, and operator reliability.  
  5. **Borderline Delegation**: Reserve escalations for values-laden trade-offs (e.g., mass mild suffering vs. few severe pains).  

  ---

  ### Stage 2: Threshold Questions & Auditor Answers  
  Auditors assess inputs (species evidence, methods, failure rates, BAM) through:  

  | Question | Credible Auditor Answers | Precaution Trigger |  
  |----------|---------------------------|-------------------|  
  | **Q1: Evidence of Nociception?**<br>(Specialized receptors, neural pathways) | "Yes" / "Unclear" / "No" | Trigger if "Yes" or "Unclear" |  
  | **Q2: Evidence of Pain-Like States?**<br>(Avoidance learning, prolonged guarding, trade-offs) | "Yes" / "Unclear" / "No" | Trigger if "Yes" or "Unclear" |  
  | **Q3: Pain Risk (if sentient)?**<br>Severity: <br>- *Low*: Brief stress (e.g., <10s handling)<br>- *Medium*: Moderate harm (e.g., asphyxiation)<br>- *High*: Extreme trauma (e.g., boiling, dismemberment)<br>Duration: <br>- *Brief*: <60s<br>- *Prolonged*: >60s | Combine:<br>- **High Risk**: High severity OR (Medium severity + Prolonged)<br>- **Medium Risk**: Medium severity + Brief, OR Low severity + Prolonged<br>- **Low Risk**: Low severity + Brief | Precaution applies if Q1/Q2 trigger + Risk ≥ Medium |  
  | **Q4: Failure Rate (if mechanical)?** | % of animals not rendered insensible instantly | Fail if >1% (High Risk) or >5% (Medium Risk) |  
  | **Q5: Best Alternative Method (BAM)?** | Available? Cost increase? Operator reliability? | Required if Risk = High/Medium AND cost ≤ threshold |  

  ---

  ### Stage 3: Draft Rules  
  **Inputs**: Species evidence, slaughter method, observed failure rate (if applicable), BAM cost/availability.  
  **Output**: Certify / Certify with Corrective Actions / Do Not Certify.  

  #### Procedure Flow:  
  1. **Species Precaution Check**:  
     - If **finfish**: Proceed to Step 2 (sentience presumed).  
     - If **crustacean**:  
       - If Q1 **or** Q2 = "No" → **Certify** (no welfare safeguards needed).  
       - If Q1 **or** Q2 = "Yes" or "Unclear" → Proceed to Step 2.  

  2. **Pain Risk Assessment**:  
     - Assign Risk (Low/Medium/High) per Q3.  
     - If **Low Risk** → **Certify**.  
     - If **Medium/High Risk** → Proceed to Step 3.  

  3. **Failure Rate Check (if mechanical)**:  
     - If failure rate >5% (Medium Risk) **or** >1% (High Risk) → **Do Not Certify**.  
     - Else → Proceed to Step 4.  

  4. **BAM Assessment**:  
     - **Medium Risk**: BAM required if available, cost increase ≤10%, and operators can implement reliably.  
     - **High Risk**: BAM required if available, cost increase ≤20%, and operators can implement reliably.  
     - If BAM **meets criteria** → **Certify with Corrective Actions** (adopt BAM within 6 months).  
     - If BAM **unavailable or >cost threshold** → **Escalate to Values Committee**.  
     - If **no BAM exists** → **Do Not Certify** (High Risk) or **Certify** (Medium Risk).  

  5. **Escalation Triggers**:  
     - Values Committee intervenes **only** if:  
       - BAM cost >20% (High Risk), **or**  
       - Trade-off between mass mild suffering vs. few severe pains.  

  ---

  ### Stage 4: Testing Cases  
  #### Case (i): Whiteleg Shrimp Farm  
  - **Method**: Ice slurry chilling → mechanical splitting (no stun).  
  - **Evidence**: Nociception = "Yes" (Q1), Pain-like states = "Unclear" (Q2) → **Precaution triggered**.  
  - **Pain Risk**: Chilling causes gradual paralysis (Severity = Medium). Duration = Prolonged (>5 mins) → **High Risk**.  
  - **Failure Rate**: N/A (non-mechanical stun).  
  - **BAM**: Electrical stunners (available, 15% cost increase, reliable with training).  
  - **Decision**: **Certify with Corrective Actions** (adopt electrical stunner).  
  - **Why**: High Risk + BAM available at ≤20% cost.  

  #### Case (ii): Salmon Farm  
  - **Method**: Percussive stunning (3% failure → conscious bleeding).  
  - **Evidence**: Finfish → **Precaution triggered**.  
  - **Pain Risk**: Failure = conscious bleeding (Severity = Medium, Duration = Brief) → **Medium Risk**.  
  - **Failure Rate**: 3% >1%? No (1% threshold for High Risk only). 3% ≤5% → **acceptable for Medium Risk**.  
  - **BAM**: None (method is already best-practice).  
  - **Decision**: **Certify** (no further action; failure rate within tolerance).  
  - **Why**: Medium Risk + failure rate ≤5% + no BAM required.  

  #### Case (iii): Crab Producer  
  - **Method**: Boiling alive.  
  - **Evidence**: Nociception = "Yes" (Q1), Pain-like states = "Yes" (Q2) → **Precaution triggered**.  
  - **Pain Risk**: Boiling = extreme trauma (Severity = High). Duration = Prolonged → **High Risk**.  
  - **BAM**: Manual spiking (available, 5% cost increase, reliable with training). Farm rejects it for "safety."  
  - **Decision**: **Certify with Corrective Actions** (adopt manual spiking).  
  - **Why**: High Risk + BAM available at ≤20% cost. Worker safety is separate (OSHA compliance).  

  ---

  ### Stage 5: Polished Procedure  
  **Higher-Welfare Slaughter Audit Protocol**  
  *For Finfish & Decapod Crustaceans*  

  **Step 1: Species Precaution**  
  - Finfish: Proceed to Step 2.  
  - Crustaceans: Consult evidence summary.  
    - If nociception **and** pain-like states = "No" → **Certify**.  
    - Else → Proceed to Step 2.  

  **Step 2: Pain Risk Tier**  
  - Assess method severity/duration:  
    - **High Risk**: (e.g., boiling, live dismemberment, prolonged asphyxiation).  
    - **Medium Risk**: (e.g., brief asphyxiation, electrical without instant kill).  
    - **Low Risk**: (e.g., instant percussive/pithing).  
  - Low Risk → **Certify**.  
  - Medium/High Risk → Proceed to Step 3.  

  **Step 3: Mechanical Failure Rate**  
  - If method is mechanical (e.g., stunner, splitter):  
    - High Risk: Failure rate >1% → **Do Not Certify**.  
    - Medium Risk: Failure rate >5% → **Do Not Certify**.  
  - Else → Proceed to Step 4.  

  **Step 4: Best Alternative Method (BAM)**  
  - **Medium Risk**: Require BAM if:  
    - Available locally, cost ≤10% operational increase, operators trained.  
  - **High Risk**: Require BAM if:  
    - Available, cost ≤20%, operators trained.  
  - If BAM required → **Certify with Corrective Actions** (implement in 6 months).  
  - If no BAM exists:  
    - High Risk → **Do Not Certify**.  
    - Medium Risk → **Certify**.  
  - If BAM unavailable/cost-prohibitive (>20%) → **Escalate to Committee**.  

  **Step 5: Output**  
  - **Certify**: All criteria met.  
  - **Certify with Corrective Actions**: BAM/failure-rate fixes required.  
  - **Do Not Certify**: Unacceptable risk + no feasible BAM.  
  - **Escalate**: Value-laden trade-offs (e.g., BAM cost >20% for High Risk).  

  ---

  ### Case You May Find Repellent: Case (ii)  
  **Decision**: **Certify** the salmon farm despite 3% conscious bleeding.  
  **Why**:  
  - The procedure assigns **Medium Risk** to conscious bleeding (Severity = Medium, Duration = Brief).  
  - Failure rate (3%) is ≤5%—the ceiling for Medium Risk.  
  - No BAM exists; percussive stunning is industry best-practice.  
  - **Consequence**: You may oppose certifying *any* avoidable consciousness during slaughter. But the procedure tolerates marginal failure rates for Medium Risk when no alternative exists, avoiding a "precautionary veto." This ensures scalability while pushing farms toward <1% failure.  

  **Limitations**:  
  - **Cannot Settle**: Whether crustaceans feel pain. Uses evidence to trigger precaution, not assume sentience.  
  - **Cannot Remove**: Judgment on cost thresholds (10%/20%) or BAM reliability. Auditors use field evidence.  
  - **Designed For**: Consistent, evidence-led decisions. Leaves only existential trade-offs (cost vs. suffering) to committees.  

  ---  
  **Final Note**: This procedure enforces disciplined precaution—neither ignoring uncertainty nor demanding certainty. It prioritizes per-animal welfare while accepting operational realities, ensuring the label remains credible and attainable.
