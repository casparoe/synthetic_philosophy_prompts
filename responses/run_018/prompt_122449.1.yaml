  First, I need to parse the user's decomposition requests clearly. They want probabilities assigned to four key aspects: (1) EDT being correct, (2) genuine uncertainty about one's choice, (3) large-world scaling, and (4) whether "good news" defeats the argument. The user also asks about their disagreement with the housemate and a stress test where decisions are pre-determined.

  Starting with the stress test since it's pivotal. If decisions were sealed a billion years prior, common-cause correlation still exists—our cooperation still evidences others' cooperation because our traits are shared. This doesn't break the argument; it reinforces that EDT relies on correlation regardless of temporal order. My confidence in the original argument rises here because it highlights that causation isn't necessary.

  For the decomposition: 
  (1) EDT being correct is the biggest hurdle—I'd assign only 20% confidence since causal decision theorists (CDT) have strong counterarguments. 
  (2) The uncertainty being genuine feels solid (80%)—if we model agents with opaque decision processes, the correlation is real. 
  (3) Large-world scaling works mathematically (90%)—the correlation compounds across agents. 
  (4) The "good news" objection is valid but doesn't refute EDT (70%—it's a feature, not a bug). 

  Combining these multiplicatively gives 0.20 * 0.80 * 0.90 * 0.70 ≈ 0.10. The user's housemate likely rejects (1) entirely, explaining their 0.1 assessment. 

  The strongest mover would be disproving EDT (e.g., Newcomb problems showing its absurdity), which could sink the whole argument. Conversely, proving that correlated decisions exist empirically would boost confidence. 

  The user's tension between "common cause as strength" vs. "reductio" is understandable. Seeing it as strength clarifies that EDT cares about evidence, not influence—which is precisely why CDT proponents dismiss it as "magic."
answer: |-
  Here's the decomposition, stress test, and final number based on the reasoning you requested. I'll be precise and bite the bullet where needed.

  ### Decomposition & Probabilities
  1.  **EDT being the correct account of instrumental rationality: `0.20`**
      *   This is the weakest link. CDT has compelling arguments (e.g., avoiding dominated strategies in Newcomb-like problems, counterfactual reasoning). EDT's vulnerability to "medical Newcomb problems" and its "news value" nature make it controversial for many. *Most of your housemate's skepticism likely lives here.*
  2.  **Genuine, correlated uncertainty about own choice: `0.80`**
      *   If we accept the setup ("know yourself roughly the way you know a friend"), this seems robust. The uncertainty is epistemic and stems from limited introspective access to your own decision machinery. Correlation arises from shared "type" (genetics, culture, decision algorithm, etc.). It's not just politeness; it models an agent with incomplete self-knowledge facing a novel situation.
  3.  **Large-world scaling/compounding: `0.90`**
      *   The math works: Conditional on you (agent A1) cooperating, your estimate of the probability that a *specific other* agent (A2) cooperates increases slightly (say, from p to p+δ). The expected number of cooperators *among the other 9,999,999 agents* increases by ≈ 9,999,999 * δ. This is linear scaling. While you "know" it's a large world, conditioning on *your specific action* provides new evidence about the *prevalence* of your cooperative type within that large world, which you didn't fully account for beforehand (the correlation wasn't "baked in" to your prior estimate of the *global* cooperation rate *among your type*).
  4.  **No defeater (Good News is valid): `0.70`**
      *   This *is* the core of EDT: Acts are evaluated based on what they reveal (evidence), not what they cause. In EDT, "being paid for good news" *is the mechanism*. The "defeater" worry stems from rejecting EDT itself (point 1). If you accept EDT's premise, the news *is* valuable because it updates your beliefs about the massive number of other cooperators, whose actions affect your payoff. *This is where the housemate likely sees the "magic trick".*

  **Combined Probability:** `0.20 * 0.80 * 0.90 * 0.70 = 0.1008 ≈ **0.10**`

  ### Housemate Disagreement
  Your housemate's 0.1 likely stems primarily from **rejecting (1) EDT entirely (assigning it near 0 probability)**. They likely see (4) as absurd ("magic trick"). They might also be slightly skeptical of (2) (viewing the uncertainty as not truly epistemic/correlated) and (3) (seeing the scaling as double-counting or irrelevant), but the core rejection is (1) and (4). My 0.10 reflects that EDT is the major hurdle.

  ### Stress Test: Pre-Sealed Decisions (Billion Years Ago)
  *   **Does the argument go through? YES.**
  *   **Effect on Confidence in Original: RAISES IT (Slightly).**
      *   **Why it goes through:** EDT cares about *evidence* (correlation), not *causation* or *temporal order*. Your cooperation is still strong *evidence* that you are of a "cooperator type". Because the other agents are "structurally similar" to you (by the setup's definition), your cooperation is *also* strong evidence that *they* are likely cooperator types. Since their decisions are fixed (but unknown to you), learning you cooperated updates your belief *towards* them having cooperated too. The large-world scaling argument applies identically. The common cause (the factors that made you all similar) is precisely what creates the correlation EDT leverages. Conditioning on your act provides information about that common cause.
      *   **Why it raises confidence:** This stress test cleanly separates *evidential* reasoning from *causal* reasoning. It demonstrates that the argument **never relied on spooky causation or influence**. It relied solely on *correlation via common cause* and EDT's logic of evaluating acts based on the evidence they provide. Passing this test shows the argument is internally consistent within EDT and isn't smuggling in causal intuition. Your feeling that it *might* be a reductio likely stems from causal intuitions (CDT) – which is exactly what EDT denies are relevant here.

  ### Single Biggest Mover
  *   **Downward Mover (-0.07 impact):** A decisive argument or real-world demonstration showing that EDT leads to **consistent, catastrophic failure in paradigmatic Newcomb-like problems** where CDT succeeds. (e.g., Robustly losing money in Medical Newcomb or Transparent Newcomb scenarios despite "knowing" the correlation). This directly attacks (1).
  *   **Upward Mover (+0.05 impact):** A rigorous **formal model or simulation** demonstrating that under precisely defined conditions of uncertainty and correlation among many agents, EDT-cooperating agents achieve significantly higher *actual* payoffs in large populations than EDT-defecting agents, *specifically because of the update mechanism described*. This strengthens (2), (3), and (4) by showing real-world consequences of the "good news".
