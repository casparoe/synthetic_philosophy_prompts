  - **Empirical**: If aspiration-setting heuristics (e.g., *reference-point adaptation*) in complex domains (e.g., ER triage) achieve stable outcomes **uncorrelated** with optimal benchmarks *without* distributional data.  
  - **Theoretical**: Axiomatic proof that dynamically adjusted aspirations (e.g., *Lyapunov-stable satisficing*) dominate optimizing under deliberation costs.  

