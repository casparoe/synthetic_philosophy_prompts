prompt: |-
  In discussions of prosaic AI alignment, I keep seeing the same standoff. The “behavior-first” people think scalable oversight, RLHF, adversarial testing, and careful deployment can align systems built from current methods without a new conceptual breakthrough. The “internals-first” people answer that this mostly produces compliant behavior while leaving the learned goals opaque, so a sufficiently capable system could remain aligned only until the incentives or distribution change. Both sides know that current evaluations are imperfect and that internal interpretability is hard, yet neither seems to budge.

  My hypothesis is that this looks like a technical disagreement but is really about what would count as evidence of alignment: reliable behavior across tests, or some warranted story about why the system’s goals would survive greater capability and new situations. But maybe there’s a hidden empirical disagreement about how likely goal misgeneralization or scheming actually is.

  Diagnose the disagreement: factual, conceptual, partly verbal, or different questions under the label “alignment”? Support the diagnosis from what each side claims, and say what would count as progress: an experiment, a formal result, a better criterion, or a reframed question. Don’t give a reading list. End with a final line in this exact form: \answer{one-sentence diagnosis}
