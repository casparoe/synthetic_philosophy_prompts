answer: |-
  Here is a reusable decision procedure designed for your board, translating prediction market governance into a practical, step-by-step checklist. It incorporates stopping rules (🔴), judgment flags (⚠️), and mandatory political referrals (↪️). The procedure is structured as a linear flow:

  ---

  **Municipal Prediction Market Pilot Decision Procedure**

  **Step 1: Empirical vs. Value Dispute Test**  
  *Question: Is the core disagreement fundamentally about measurable future outcomes (e.g., "Will Design A reduce flood risk by X%?"), not value preferences (e.g., "Is safety worth $Y more than heritage?")?*  
  - **YES → Proceed to Step 2.**  
  - **NO → 🔴 STOP.** *Resolution requires democratic deliberation, not a prediction market. Refer to public hearings/legislative body.*  
  ⚠️ *Judgment Needed:* Distinguishing "will happen" from "should happen." Look for proxies: if parties cite conflicting data/models, it's likely empirical; if they cite fairness/identity/aesthetics, it's value-driven.

  **Step 2: Binding Market Pre-Conditions**  
  *Question: Can all these be met?*  
  *(a) Outcome is objectively verifiable within ≤5 years*  
  *(b) No compulsory property takings or irreversible harm depends solely on market result*  
  *(c) Key variables (e.g., disaster risk, economic growth) are defined in measurable terms upfront*  
  - **ALL YES → Proceed to Step 3.**  
  - **ANY NO → 🔴 STOP.** *Market may advise but cannot bind. Use only for insight.*  
  ⚠️ *Judgment Needed:* Defining "irreversible harm" and verification timelines. Intergenerational costs (>25 yrs) automatically fail (b).

  **Step 3: Distributive Justice Screen**  
  *Question: Could the market’s resolution disproportionately burden a specific group (e.g., low-income residents, ethnic minority) regardless of technical accuracy?*  
  - **NO → Proceed to Step 4.**  
  - **YES → ↪️ DEFER.** *Outcome requires political process for equity review (e.g., council vote with impact analysis). Market may inform but not decide.*  

  **Step 4: Capture Audit Protocol**  
  *Question: Are these safeguards feasible?*  
  *(a) Anonymous participation to reduce coercion*  
  *(b) Stakeholder capital caps (e.g., contractors limited to 5% of total market)*  
  *(c) Subsidized expert participation (city funds neutral scientists' bets)*  
  *(d) "Dark horse" review: Board seeds market with intentionally wrong bets to test for swift correction*  
  - **ALL FEASIBLE → ✅ APPROVE market for advisory/binding per Step 2.**  
  - **ANY UNFEASIBLE → 🔴 STOP.** *Risk of capture too high. Use traditional expert panels.*  
  ⚠️ *Judgment Needed:* Monitoring capital concentration and designing "dark horse" tests.

  ---

  **Application to Cases**

  **Case 1: Levee Design (Hydrologists' 50-Year Flood Risk Dispute)**  
  - **Step 1:** YES (Disagreement is empirical: "Which design reduces risk most?").  
  - **Step 2:** (a) NO (verification >5 yrs) → 🔴 **STOP.** Market advisory only.  
    *Output:* Prediction market can forecast probability of each design’s success, but final decision requires expert review + board judgment. Binding use blocked by intergenerational costs.  
  *Conflicts with intuition?* If board hoped markets could decide, procedure overrules due to long timeline.

  **Case 2: Waterfront Rezoning (Uncontested Forecast, Growth vs. Displacement)**  
  - **Step 1:** NO (Core conflict is values: "Does growth outweigh community loss?"). 🔴 **STOP.**  
    *Output:* Prediction market inappropriate. Refer to community assemblies/city council vote.  
  *Conflicts with intuition?* If board misdiagnosed dispute as technical, procedure forces political referral.

  **Case 3: Bridge Alignment (Market Favors Cheap Option Threatening Heritage Site)**  
  - **Step 1:** YES (Dispute is empirical: "Will this alignment succeed?").  
  - **Step 2:** (a) YES (short-term completion measurable) but (b) NO (demolition is irreversible harm). → 🔴 **STOP** for binding use. Market advisory only.  
  - **Step 3:** YES (Heritage loss burdens cultural community). → ↪️ **DEFER** to political process.  
  - **Step 4:** Capture audit still recommended if run for insight.  
    *Output:* Market prediction noted but overruled; decision requires council vote weighing heritage value.  
  *Conflicts with intuition?* If board prioritized efficiency, procedure mandates democratic override for unpriced values.

  ---

  **What the Procedure Cannot Settle (Limitations & Safeguards)**  
  1. **Market Liquidity/Quality:** Cannot ensure sufficient participation or expertise.  
     *Safeguard Needed:* Independent audit of market accuracy vs. historical benchmarks.  
  2. **Long-Term Payoff Verification:** Fails if outcome measurement occurs post-board tenure.  
     *Safeguard Needed:* Escrowed funds + third-party outcome auditors (e.g., university partners).  
  3. **Value Proxy Wars:** Stakeholders may disguise values as empirical claims (e.g., "This *will* destroy community character").  
     *Safeguard Needed:* Pre-market review by ethicist + conflict mediator.  
  4. **Black Swans:** Markets underprice tail risks (e.g., catastrophic levee failure).  
     *Safeguard Needed:* Mandatory stress-testing against worst-case scenarios.  
  5. **Procedural Justice:** Cannot resolve anger over "betting on lives."  
     *Safeguard Needed:* Transparency portal showing anonymized bets/rationales.  

  **Critical Weakness:** The procedure assumes *disputants engage in good faith*. If experts deliberately skew market inputs (e.g., misdefining flood metrics), outcomes are corrupted. Pair with traditional peer review for variable validation. Ultimately, **prediction markets inform—but never replace—democratic accountability for value conflicts.**
