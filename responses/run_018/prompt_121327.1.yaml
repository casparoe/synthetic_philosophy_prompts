  4. **Should deliberation rules explicitly prohibit or permit epistemically akratic positions (e.g., "I believe X but doubt our competence")?** Mandating disclosure would force panels to confront internal conflicts transparently, recalibrating dissent from private hesitation to formal input; it outranks by tackling akrasia’s corrosive effects on trust, which undermines cohesion if unaddressed.  
  5. **What transparency standards ensure dissent about competence is externally reviewable?** Requiring documented rationales (e.g., dissent logs with reasoning trails) would make calibration auditable, countering institutional bias; it outranks in downstream importance for accountability, as public scrutiny hinges on visible dissent handling.
