  The user explicitly rejects ranking societies (e.g., "who faced the past better") and instead wants structural analysis. They're asking which open questions deserve priority: normative foundations of intergenerational liability versus empirical effectiveness of institutions, or denialism versus over-commemoration. They want a defended agenda with clear criteria—tractability for theorists, upstream nature, policy relevance—and flexibility if new evidence emerges.

