  I’d argue Priority 1 and 2 are most urgent. Obligation is the bedrock; civic impact tests if institutions work. Denialism is critical but requires solutions from the first two. New evidence—like longitudinal studies on German schools or backlashes to U.S. monument removals—could shift rankings.  

  The user’s unasked question about "commemorative density metrics" is thorny. We lack tools to measure if a museum or law *structurally* changes a society. A theorist could develop this, but it’s less urgent than obligation/impact.  

