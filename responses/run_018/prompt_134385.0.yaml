answer: |-
  Based on your framing—focusing on *mnemonic architecture*, prioritizing upstream conceptual problems with tractability for political theory/philosophy, policy relevance, and avoiding settled or derivative debates—I propose the following prioritized research agenda. The core criteria are: **1) Upstream Conceptual Dependence** (does it ground other questions?), **2) Tractability for Normative/Empirical Political Theory** (can philosophers/theorists engage it rigorously?), **3) Policy Urgency & Avoidance of Dead Ends** (does it address live disputes without rehashing settled ground?), and **4) Comparative Leverage** (does it illuminate *differences* in institutional logics?).

  ### Priority 1: **The Normative Basis of Intergenerational Mnemonic Obligation**
  *   **Why it's Upstream & Critical:** Every aspect of "commemorative density" (legal frameworks, education, monuments) presupposes an answer to *why* present citizens/states bear obligations for past wrongs they didn't commit. This is philosophically unsettled and contested in policy (e.g., reparations debates, curriculum fights framing history as "divisive guilt"). Without a defensible foundation, institutional designs lack legitimacy and fuel backlash.
  *   **Tractability:** Philosophers (e.g., on collective responsibility, historical injustice, political obligation) and political theorists (e.g., on constitutive narratives of citizenship) can rigorously engage competing justifications:
      *   *Continuity of the State/Institution*: Obligation arises from the persisting entity that committed/permitted the wrong.
      *   *Benefit from Injustice*: Obligation arises from unjustly acquired advantages still held.
      *   *Moral Community Maintenance*: Obligation arises from the need to sustain a just civic identity and trust.
      *   *Victim Recognition as Foundational Justice*: Obligation is owed *to victims/descendants* as a constitutive act of justice.
  *   **Policy Relevance:** Directly informs debates about reparations, monument removal/contextualization, mandatory curricula, and apologies. Clarifies if obligations are owed *by* citizens, *to* descendants, or *for* the state's integrity.
  *   **Comparative Leverage:** Explains *why* Germany emphasizes state continuity/perpetrator responsibility, the US South wrestles with benefit/community, and Turkey rejects all justifications. Helps assess if Japan's fragmented approach stems from unresolved normative ambiguity.
  *   **What Would Change Priority?** Empirical evidence showing institutional designs *function effectively regardless* of normative consensus (unlikely), or a dominant, philosophically robust justification emerging that policymakers widely accept (also unlikely soon).
  *   **Avoiding Dead Ends:** Moves beyond sterile "guilt" vs. "heritage" binaries by focusing on distinct *sources* of obligation (institutional, benefit-based, recognitional).

  ### Priority 2: **The Causal Efficacy & Perils of Institutional Forms: Civic Identity vs. Backlash**
  *   **Why it's Critical & Underexplored Theoretically:** We lack robust comparative theories predicting *how* specific mnemonic architectures (e.g., centralized vs. federal mandates, victim-centered vs. perpetrator-focused museums, truth commissions vs. trials) *actually shape civic identity, intergroup relations, and democratic resilience* versus triggering backlash or performative ritualization. Policy is often driven by intuition or copying "models" (e.g., Germany) without understanding mechanisms and contextual triggers.
  *   **Tractability:** Requires bridging normative theory with empirical political science/sociology. Theorists can:
      *   Develop typologies of institutional mechanisms (e.g., *didactic* [education], *symbolic* [monuments], *legal* [trials/reparations], *participatory* [truth commissions]) and hypothesize their impact on civic identity formation.
      *   Theorize the conditions under which commemoration fosters *reflective solidarity* versus *defensive resentment* or *empty ritual*. Key variables: perceived legitimacy (links to Priority 1), perceived threat to dominant group identity, linkage to contemporary power/resource distribution.
      *   Analyze "commemorative density" not just as volume, but as *institutional coherence* – do legal, educational, spatial institutions reinforce or contradict each other?
  *   **Policy Relevance:** Directly addresses the risk of backlash (e.g., Confederate monument removals fueling reactionary politics) and the fear of empty ritual (e.g., Holocaust remembrance without confronting contemporary antisemitism). Guides investment: When does a museum/monument/curriculum *change minds/hearts* vs. entrench divisions or become background noise?
  *   **Comparative Leverage:** Explains why Germany's centralized, perpetrator-focused model (partially) worked in its context but faces challenges exporting. Illuminates why Japan's fragmented approach avoids backlash *within* Japan but fuels conflict *with* neighbors. Shows why local control in the US South enabled Lost Cause persistence for so long.
  *   **What Would Change Priority?** Breakthrough longitudinal comparative studies providing definitive causal links between specific institutional designs and measurable shifts in civic identity/conflict (challenging but possible). Widespread abandonment of institutional approaches due to perceived ineffectiveness (unlikely).
  *   **Avoiding Dead Ends:** Rejects the "ranking" trap by focusing on *mechanisms and context* rather than outcomes alone. Challenges the assumption that "more commemoration = better."

  ### Why NOT These (Yet)? & Implications for Your Specific Queries
  *   **Denialism vs. Over-Commemoration:** While policy-urgent, this is *downstream*. Addressing it effectively *requires* answers from Priorities 1 & 2. What constitutes "over"-commemoration depends entirely on the normative basis (Priority 1) and its efficacy/backlash risks (Priority 2). Focusing here first risks superficial comparisons.
  *   **"Commemorative Density" Metrics:** Important, but potentially derivative. Defining a "defensible metric" presupposes answers to *why* density matters (Priority 1) and *what effects* it aims for (Priority 2). Early work here might be overly technocratic without the normative/empirical grounding.
  *   **Temporal Limits ("Inherited Performance"):** A vital question embedded within Priority 2. Theorizing when commemoration becomes ritualized, losing its moral force, is key to assessing institutional efficacy and sustainability. It shouldn't be a separate priority *yet* because understanding the conditions for *sustained* moral practice depends on the mechanisms analyzed in Priority 2. New evidence (e.g., surveys showing generational disengagement in Germany despite dense institutions) would elevate this *within* Priority 2.
  *   **Germany's Exportability:** This is *not* a primary open question for *theory*. Comparative analysis (leveraging Priority 2) already strongly suggests its context-specificity (defeat/occupation, perpetrator state continuity, Cold War positioning, victim groups demanding recognition *externally*). The real question is *which elements* of institutional design (if any) can be adapted elsewhere, contingent on answers to Priorities 1 & 2.

  ### The Agenda for a Small Research Group/Policy Fellowship
  1.  **Core Project 1: Normative Foundations Toolkit:** Develop a clear typology/analysis of justifications for intergenerational mnemonic obligation. Produce accessible policy briefs showing how each foundation leads to different institutional priorities (e.g., benefit-based arguments prioritize reparations; recognition arguments prioritize victim-centered narratives/monuments). *Outputs:* Philosophical papers; comparative case briefs (e.g., how different foundations manifest in US South vs. Germany); policy workshops.
  2.  **Core Project 2: Institutional Mechanisms & Impact Framework:** Map diverse mnemonic institutions across cases. Build a theoretical framework hypothesizing how institutional types/combinations/coherence interact with social/political contexts to produce civic identity change, backlash, or ritualization. Collaborate with empiricists on designing indicators for future testing. *Outputs:* Typology framework; hypothesis papers; collaborative grant proposals for empirical testing; "risk assessment" tools for policymakers considering new memorials/curricula.
  3.  **Cross-Cutting Focus: Commemorative Density Revisited:** Use insights from Projects 1 & 2 to refine "commemorative density" as a concept focusing on *institutional coherence* (alignment of norms, laws, education, symbols) and *civic penetration* (depth of engagement beyond elites), moving beyond simple quantity.

  **Why This Order?** Priority 1 provides the indispensable *why* without which institutions lack justification and are vulnerable to attack. Priority 2 addresses the *how* – the actual political and civic effects – which is the ultimate test of any mnemonic architecture and where the greatest practical uncertainties and risks lie. Together, they provide the conceptual bedrock for tackling denialism, over-commemoration, ritualization, and the (im)possibility of exporting models. Focusing here maximizes the chance to generate foundational insights that reshape both scholarly debate and practical policy design in a field often dominated by historical particularism or moralistic exhortation.
