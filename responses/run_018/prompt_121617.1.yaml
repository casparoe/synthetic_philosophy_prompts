  ### **Decision Tree: Trolley Case Verdicts**

  **Node 1: Standard Switch**  
  *Setup:* A trolley will kill five people on the main track. You can flip a switch to divert it to a side track where it will kill one person. If you do nothing, the five die.  
  → **Permissible?**  
  - **Yes** → Node 2  
  - **No** → Node 5  

  **Node 2: Loop Variant**  
  *Setup:* Same as Node 1, but the side track loops back to the main track. The one person’s body is heavy enough to stop the trolley. Without them, the trolley loops back and kills the five.  
  → **Permissible?**  
  - **Yes** → Node 3  
  - **No** → Node 4  

  **Node 3: Footbridge Push**  
  *Setup:* A trolley will kill five people. You can push a large man off a footbridge into its path. His body stops the trolley, killing him. If you do nothing, the five die.  
  → **Permissible?**  
  - **Yes** → **Leaf 1: Maximizing** (Save more lives regardless of means)  
  - **No** → **Leaf 2: Forbids Direct Harm** (Rejects actions that directly use force against a person)  

  **Node 4: By-Product Case**  
  *Setup:* Diverting the trolley (as in Node 1) saves the five, but the diverted trolley crashes through a barrier, killing one person below as a side effect. This crash is what stops the trolley.  
  → **Permissible?**  
  - **Yes** → **Leaf 3: Allows Side Effects** (Permits deaths that are unintended by-products of rescue)  
  - **No** → **Leaf 4: Only Redirection** (Forbids any death not directly on the tracks)  

  **Node 5: Injured Variant**  
