prompt: |-
  I'm writing a feature on Marx's machinery chapter and how it actually holds up when you map it onto a factory floor rather than just the abstract history of industry. Take the Lordstown GM plant in Ohio around 1972 — you probably remember the headlines: GM had been instaling Unimate robots and other automated gear since the early sixties, then in '72 they tried to push the line speed up near 100 cars an hour and cut jobs, and the mostly young UAW wokrforce responded with a massive slowdown and wildcat strikes that lasted months. I want you to run this through Marx's theory in Capital, especially his claim that machinery under capitalism doesn't just save labor but restructures the labor process so capital controls the pace and the worker becomes an appendage. Map the actual actors — GM management, the local union, the line workers — onto Marx's categories: who represents the living labor being replaced, who controls the dead labor embodied in the robots, and what counts as surplus-value extraction when the bottleneck is no longer human muscle but machine uptime?

  Then I want you to test a framing I've been playing with: call it "shadow labor migration," the idea that when automation removes visible assembly tasks, human skill doesn't vanish but gets pushed into hidden maintenance, troubleshooting, and emotional management of the line — work that's still necessary but becomes invisible in the official labor metrics. Does Marx's distinction between formal and real subsumption account for this migration, or does Lordstown show that the machinery chapter misses where the skill actually goes? Be honest about where the theory explains the strike and where it just doesn't speak. And please — no reading lists, no "see Marx p. X," I'm working offline and I just want the analyis.
