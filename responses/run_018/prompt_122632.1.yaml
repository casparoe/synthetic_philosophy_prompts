prompt: |-
  Hi — I run the "pilot pipeline" for a mid-sized city (around 200k people). Basically every new idea in this city now arrives as a request for a six-month pilot: try it in one district, measure it, then decide. We get about forty of these a year, three of us review them, we have maybe two hours each, none of us has stats training beyond a spreadsheet, and anything we clear goes to a council committee that meets monthly and can be yanked by the mayor's office whenever they feel like it. What actually happens is that most pilots turn into either a press release or a quiet permanent extension, and the measurement mostly just decorates whatever people already wanted to do.

  What I want from you is a procedure my team can run on a proposal, grounded in Dewey's experimentalism about inquiry and democracy — the version where inquiry starts from a genuinely indeterminate situation rather than from a proposition to be verified, where a hypothesis is a plan of action and its test is what happens when you act on it, where warrant is a matter of degree and always revisable so nothing "proves" anything, and where the democratic bit isn't a vote at the end but the requirement that the people who will bear the consequences get a real hand in forming and judging the hypothesis, not just a chance to react to it afterward.

  Don't write me an essay about Dewey. Write me something I can put on one page and hand to a new hire. Concretely:

  - The questions, in order, and what counts as a sufficient answer to each. I need to be able to tell "answered" from "sounded plausible in the meeting."
  - Where the procedure stops with a NO — this isn't a pilot, don't run it.
  - Where it stops and hands the decision to a person or to the committee because the question is one of values rather than facts. Say explicitly which questions those are, because that's what I have to defend when a council member asks why we rejected their thing.
  - A one-page output — call it a pilot charter — that records what the situation was, what the hypothesis is as an action, who bears what, and what would count as having learned something.
  - How to handle the hard cases we actually get, including: (a) interventions that can't be undone, so there's no going back to a reconstructed situation — demolishing things, disbanding a team, closing a school; (b) pilots that change the very thing they measure, so the result won't travel; (c) pilots where the metric is easy to game and gaming looks identical to success; (d) pilots where the benefits land on one group and the costs on a group that has no seat in the process; (e) pilots nobody can opt out of — a school-wide or district-wide thing where the "subjects" are just people who live there; (f) null results, which is most of them, and which currently just get ignored; (g) pilots that quietly become permanent because nobody scheduled the decision.

  Two things I'd like built in that I haven't seen anywhere. First, a "counterfactual who" step: name the specific person or role who is worse off if this succeeds, and if the proposing department can't name one, that itself is the finding. Second, a "what has to stay still" step: list what must remain in place for a result in the pilot district to mean anything about next year city-wide, and then check whether the pilot itself changes anything on that list. My suspicion is that most of our proposals fail right there and we've been pretending otherwise.

  Then run it on three real-shaped ones:

  1. A four-day week for municipal office staff — same hours compressed into four days — proposed by HR, expected to cut sick leave and help recruitment.
  2. Predictive targeting of code-enforcement inspectors using a model trained on historical 311 complaint data, so we inspect blocks the model flags rather than responding to complaints.
  3. Unarmed mental-health crisis response teams in two districts. I should say up front that I publicly backed this one and the mayor already announced it, so I'm not neutral, and if the procedure says something inconvenient I'd rather hear it now than in front of the committee.

  For each, show me the gates it passes and fails, the charter line, and whether it's a NO, a REFRAME (run it, but the claim you're entitled to make afterward is much smaller — say what the smaller claim is), or a ROUTE (this isn't an experiment, it's a decision about what kind of city we want, so take it to full deliberation). I expect at least one of these to come out as an answer I don't like, and I want you to say plainly what my options are in that case.

  Finally, tell me what the procedure can't do. I have to present this to a committee that will absolutely over-trust it the moment it looks official, so I need the honest failure modes in writing — where the checklist gives false confidence, where it's a vocabulary for decisions we'd have made anyway, and what it can't tell us at all.
reasoning: |-
  We are designing a pilot evaluation procedure based on Dewey's experimentalism, focusing on genuine inquiry starting from indeterminate situations, hypotheses as plans of action, and democratic involvement. The procedure must be practical, fit on one page, and address specific hard cases.

  **Core Principles:**
  1. **Indeterminate Situation:** The pilot must address a real, unresolved problem that stakeholders experience as uncertain.
  2. **Hypothesis as Action:** The pilot is a plan of action, and its test is what happens when implemented.
  3. **Warrant as Revisable:** Results provide degrees of support, not proof, and are always subject to revision.
  4. **Democratic Inquiry:** Those affected must be involved in forming and judging the hypothesis, not just reacting.

  **Procedure: Questions in Order**

  1. **What is the indeterminate situation?**
     - *Sufficient answer:* A clear description of the problem as experienced by those affected, including evidence of uncertainty (e.g., conflicting reports, unresolved complaints, data gaps). Must include input from affected parties.
     - *Stop if:* The situation is not genuinely indeterminate (e.g., the problem is already well-understood, or the solution is predetermined). **NO** — Not a pilot.

  2. **Who bears the consequences? (Democratic Check)**
     - *Sufficient answer:* A list of all stakeholder groups (including those who might be negatively affected) and how they were involved in framing the problem and the pilot design. Must show that marginalized or disproportionately affected groups had a real hand in shaping the hypothesis.
     - *Stop if:* Key affected groups (especially those bearing costs) are excluded from the design process. **NO** — Not democratic.

  3. **What is the hypothesis (plan of action)?**
     - *Sufficient answer:* A specific, testable action that will be taken, stated as: "If we do [action], then [change in situation] will occur because [reason]." Must include a mechanism (the "because").
     - *Stop if:* The hypothesis is vague, lacks a mechanism, or is not tied to the indeterminate situation. **REFER BACK** to proposer for refinement.

  4. **Counterfactual Who?**
     - *Sufficient answer:* Identification of at least one specific group or role that would be worse off if the pilot succeeds (e.g., "Parking enforcement officers may face increased hostility if we switch to unarmed responders"). If the proposer cannot name any, the finding is that the hypothesis is likely flawed (no change without trade-offs). 
     - *Stop if:* Proposer cannot identify a counterfactual loser after reasonable effort. **REFER BACK** or **NO** if they insist there are none.

  5. **What must stay still? (Stability Check)**
     - *Sufficient answer:* A list of contextual factors that must remain stable for the pilot result to be informative (e.g., "The overall city budget for mental health services must not change during the pilot"). Then, a check whether the pilot itself disrupts any of these (e.g., "The pilot moves budget from patrol officers to crisis teams, so the budget context changes").
     - *Stop if:* The pilot changes a critical stability factor, making results uninterpretable or non-transferable. **REFER BACK** (to isolate the change) or **ROUTE** (if the change is integral and the question is about values).

  6. **What will we learn? (Test Design)**
     - *Sufficient answer:* Specification of:
       - **Metrics:** How outcomes will be measured (quantitative and qualitative), including how gaming will be detected.
       - **Comparison:** How the post-pilot situation will be compared to the indeterminate starting point (e.g., parallel control group, pre/post with adjustments for external factors).
       - **Threshold for learning:** What range of results would count as learning (e.g., "If sick days drop by 5-10%, we’ll know the effect is meaningful; if not, we’ll know it’s negligible").
       - **Undoability:** For irreversible actions, a plan to measure outcomes in a way that doesn’t rely on reverting (e.g., phased rollout, synthetic controls).
     - *Stop if:* Metrics are gameable without detection, benefits/costs are not measurable, or results cannot be interpreted (e.g., no counterfactual). **REFER BACK** or **NO**.

  7. **What happens after? (Decision Triggers)**
     - *Sufficient answer:* Clear pre-commitments:
       - Conditions under which the pilot would be extended, scaled, or stopped.
       - A sunset clause (automatic end date) unless explicitly renewed.
       - A plan for null results (e.g., "If we see no change in recruitment, we will revert and document why").
     - *Stop if:* No sunset clause or decision triggers. **REFER BACK** (must add).

  **Output: Pilot Charter (One-Page Template)**
  - **Situation:** [The indeterminate problem, from Q1]
  - **Hypothesis:** [Action → expected change, with mechanism, from Q3]
  - **Stakeholders:** [Who bears consequences, how involved, from Q2]
  - **Counterfactual Loser(s):** [Who is worse off, from Q4]
  - **Stability Conditions:** [What must stay still, and how we protect it, from Q5]
  - **Test:** 
    - Metrics: [What we measure]
    - Comparison: [How we compare]
    - Learning Threshold: [What counts as a result]
  - **Post-Pilot:** [Decision triggers and sunset clause, from Q7]
  - **Signatures:** [Proposer, your team, community rep]

  **Handling Hard Cases:**
  - **(a) Irreversible interventions:** Require phased rollout or parallel control (e.g., apply to some blocks but not others). If impossible, **ROUTE** — it’s a value decision, not a test.
  - **(b) Changing the thing measured:** If the pilot alters context (e.g., training staff changes future performance), limit claims to "what happened when we tried it once." **REFRAME** the hypothesis to be about the process, not the outcome.
  - **(c) Gameable metrics:** Build in anti-gaming measures (e.g., third-party audits, mixed methods) and state that gaming invalidates results. If unavoidable, **REFER BACK** or **NO**.
  - **(d) Costs on excluded groups:** **NO** until included (Q2). If inclusion is impossible (e.g., future generations), **ROUTE** — it’s an ethical deliberation.
  - **(e) No opt-out:** Require consent where possible (e.g., opt-out for individuals). If not, ensure democratic mandate (Q2) and use cluster randomization (e.g., by district). **ROUTE** if coercion is inherent.
  - **(f) Null results:** Pre-commit to publishing and acting on null results (e.g., "If no change, we revert"). Charter must include this.
  - **(g) Permanent by default:** Sunset clause is mandatory (Q7). No clause → **REFER BACK**.

  **Applying to Real Examples:**

  **1. Four-Day Work Week (HR Proposal)**
  - Q1: Indeterminate? Yes — recruitment struggles and high sick leave are unresolved.
  - Q2: Stakeholders? Office staff (benefit), public (service gaps). Involved via surveys? *If not, REFER BACK.*
  - Q3: Hypothesis? "Compress hours → fewer sick days and better recruitment by improving morale." Mechanism plausible.
  - Q4: Counterfactual Who? Public (if service hours drop) or facilities staff (if buildings open longer days). *HR must name one.*
  - Q5: Stability? City service demand, economic conditions. Pilot shouldn’t change these. *Pass.*
  - Q6: Test? Metric: sick days, recruitment time, public complaints. Comparison: Pre/post in pilot dept vs. control dept. Gaming: HR could underreport sick days. Mitigation: Anonymous staff surveys.
  - Q7: Sunset? Automatic revert after 6 months unless council renews.
  - **Verdict:** **REFER BACK** if stakeholders not adequately involved or counterfactual not named. Otherwise, **RUN** with control group. Charter: Learning threshold is ±2% sick days change.

  **2. Predictive Code Enforcement**
  - Q1: Indeterminate? Yes — inefficient inspections, inequitable complaints.
  - Q2: Stakeholders? Residents (especially in high-complaint areas), inspectors. Must involve both. *If only data scientists, REFER BACK.*
  - Q3: Hypothesis? "Target by model → catch more violations with same resources because model identifies hidden patterns." Mechanism: assumes historical data predicts future violations.
  - Q4: Counterfactual Who? Residents in low-priority areas (fewer inspections → more violations) or those misclassified by model (e.g., minority neighborhoods). *Must name.*
  - Q5: Stability? Underlying violation rates. Pilot changes enforcement patterns → affects violation rates (broken stability). *Fail Q5.*
  - Q6: Test? Metrics: violations found, equity audits. But stability broken → results won’t travel. **REFER BACK** to test on historical data first, or **ROUTE** if it’s about values (efficiency vs. equity).
  - **Verdict:** **ROUTE** — Stability broken by design. It’s a values decision about policing strategy. Charter cannot claim "efficiency" without caveats.

  **3. Unarmed Crisis Teams**
  - Q1: Indeterminate? Yes — police shootings of mentally ill, strained police resources.
  - Q2: Stakeholders? Mentally ill, police, families. *If announced without co-design, fail Q2.* **NO** until fixed. But if mayor announced, **REFER BACK** urgently for retroactive inclusion.
  - Q3: Hypothesis? "Dispatch team → resolves crises without arrests or force because trained in de-escalation." Mechanism clear.
  - Q4: Counterfactual Who? Police (reduced overtime, perceived disempowerment) or team members (risk exposure). *Must name.*
  - Q5: Stability? Crime rates, mental health incidents. Pilot itself may change reporting (broken stability). *Mitigate by using police data as control.*
  - Q6: Test? Metrics: Arrests, injuries, call resolution time. Gaming: Police might under-refer. Mitigation: Track all calls.
  - Q7: Sunset? Auto-revert? But irreversible if team disbanded. **REFER BACK** for phased rollout (e.g., one district first, control district).
  - **Verdict:** **REFER BACK** to fix Q2 (stakeholder inclusion) and Q5 (stability via controls). Then **RUN**. Charter: Learning threshold is 20% reduction in arrests for mental health calls.

  **Your Options if Procedure Yields Unwanted Result:**
  - **REFER BACK:** Demand fixes (e.g., add control group, involve stakeholders).
  - **ROUTE:** Take to committee as a deliberation (not a pilot). Say: "This is about what we value, not testing a hypothesis."
  - **NO:** If unfixable (e.g., no counterfactual loser, excluded groups).

  **What the Procedure Can’t Do:**
  - **False confidence:** It can’t guarantee truth, only structure inquiry. A "pass" doesn’t mean the pilot will work.
  - **Values vs. Facts:** It flags but doesn’t resolve value conflicts (e.g., efficiency vs. equity). Those go to deliberation.
  - **Unmeasurable Effects:** If outcomes are intangible (e.g., trust), it relies on qualitative methods, which are subjective.
  - **Bad Faith Actors:** It can’t stop proposers from gaming the process, only detect it.
  - **External Shocks:** If the world changes during the pilot (e.g., recession), results may be invalid.
  - **Power Imbalances:** Democratic checks depend on genuine inclusion, which may be co-opted.

  **Final Note:** This is a living document. Revise it as you learn from pilots.
answer: |-
  Below is a one-page procedure for evaluating pilot proposals, grounded in Dewey's experimentalism. It's designed as a checklist your team can run in 1-2 hours per proposal. The core focus is on **democratic inquiry** (those affected shape the test), **indeterminate situations** (genuine uncertainty), **action as hypothesis** (the pilot is a "what if we do this?" test), and **revisable warrant** (no "proof," only degrees of confidence). 

  ---

  ### **PILOT EVALUATION PROCEDURE**  
  *(One-Page Checklist for Reviewers)*  
  **Questions must be answered in order. Stop at first failure.**  

  1. **IS THE SITUATION GENUINELY INDETERMINATE?**  
     - *Sufficient answer:* Concrete evidence of unresolved public uncertainty (e.g., conflicting data, stakeholder disputes, or failed past solutions). Must cite specific voices from affected groups.  
     - *Stop if:* The problem is already settled, or the solution is predetermined. **→ NO** (Not a pilot; it’s advocacy).  

  2. **WHO BEARS THE CONSEQUENCES, AND WERE THEY INVOLVED?**  
     - *Sufficient answer:* A list of all affected groups (beneficiaries and burden-bearers) and documentation of their input in designing the pilot (e.g., co-creation workshops, not just surveys).  
     - *Stop if:* Key affected groups (especially those bearing costs) were excluded from design. **→ NO** (Violates democratic inquiry).  

  3. **WHAT IS THE HYPOTHESIS AS A PLAN OF ACTION?**  
     - *Sufficient answer:* A clear "If we [action], then [change] will happen because [mechanism]" statement. Must be measurable (e.g., "If we compress hours, sick leave drops 10% because stress decreases").  
     - *Stop if:* Vague, untestable, or missing a mechanism. **→ REFER BACK** to proposer to refine.  

  4. **COUNTERFACTUAL WHO: WHO IS WORSE OFF IF THIS SUCCEEDS?**  
     - *Sufficient answer:* Names a specific group/role harmed by success (e.g., "OT-dependent staff lose income if sick leave falls"). If proposer can’t name one after 10 min of discussion, that’s the finding.  
     - *Stop if:* No counterfactual loser identified. **→ NO** (Likely flawed hypothesis or hidden costs).  

  5. **WHAT MUST STAY STILL FOR RESULTS TO MEAN ANYTHING?**  
     - *Sufficient answer:* Lists 3–5 contextual factors that must remain stable (e.g., "budget levels," "public awareness"). Then checks if the pilot disrupts them (e.g., "Pilot reallocates budget → stability broken").  
     - *Stop if:* Pilot changes a critical stability factor. **→ ROUTE** to committee (it’s a values decision, not a test).  

  6. **HOW WILL WE LEARN, AND WHAT COUNTS AS LEARNING?**  
     - *Sufficient answer:* Defines:  
       - Metrics (quantitative/qualitative, with anti-gaming guards like third-party audits).  
       - Comparison method (e.g., control group, pre/post data with confounders tracked).  
       - "Learning threshold" (e.g., "Success = sick leave drop >5%; null = ±1%; failure = increase").  
     - *Stop if:* Metrics are gameable without detection, or no comparison is possible. **→ REFER BACK** or **NO**.  

  7. **WHAT TRIGGERS DECISIONS POST-PILOT?**  
     - *Sufficient answer:* Binding sunset clause (automatic end after 6 months) and pre-agreed decision rules (e.g., "If null, revert; if success, vote to scale"). Includes plan for null results (e.g., public report).  
     - *Stop if:* No sunset clause or null-result plan. **→ REFER BACK** (add clauses).  

  **OUTPUT: PILOT CHARTER (One-Page Summary)**  
  - **Situation:** [Q1: The uncertainty]  
  - **Hypothesis:** [Q3: Action → expected change]  
  - **Stakeholders:** [Q2: Who’s affected, involvement summary]  
  - **Counterfactual Loser:** [Q4: Who bears hidden costs]  
  - **Stability Conditions:** [Q5: What must stay still, risks]  
  - **Learning Protocol:** [Q6: Metrics, comparison, threshold]  
  - **Decision Triggers:** [Q7: Sunset date, null/action rules]  

  **HARD CASES HANDLING:**  
  - **(a) Irreversible actions (e.g., demolishing):** Require parallel control groups. If impossible → **ROUTE** (values decision).  
  - **(b) Changes what it measures (e.g., training changes future behavior):** **REFRAME** hypothesis to smaller claim (e.g., "We learned how rollout feels, not long-term outcomes").  
  - **(c) Gameable metrics:** Build in unmaskable checks (e.g., spot audits + stakeholder feedback). If unavoidable → **NO** (not testable).  
  - **(d) Costs on excluded group:** **NO** until included (per Q2). If inclusion impossible → **ROUTE** (ethics deliberation).  
  - **(e) No opt-out (e.g., district-wide):** Require cluster-level controls (e.g., compare to similar district). If none → **ROUTE** (democratic legitimacy needed).  
  - **(f) Null results:** Mandate sunset + public report (per Q7). Ignoring nulls → **NO** in future proposals.  
  - **(g) Permanent by default:** Enforce sunset clause (Q7). No clause → **REFER BACK**.  

  --- 

  ### **APPLICATION TO EXAMPLE PROPOSALS**  
  *(Using the procedure above)*  

  **1. Four-Day Work Week (HR Proposal)**  
  - **Q1:** Indeterminate? Yes. Recruitment/sick leave issues are unresolved (data shows high turnover).  
  - **Q2:** Stakeholders? Staff (involved via survey), but public (service gaps) not consulted → **REFER BACK** to include public input.  
  - **Q3:** Hypothesis? "Compress hours → 10% sick leave drop + faster hiring via improved morale." Sufficient.  
  - **Q4:** Counterfactual Who? HR identifies "public accessing services on Fridays" (reduced access harms them). Pass.  
  - **Q5:** Stability? Must stay still: Staffing levels, workload. Pilot changes workload compression → **ROUTE** (values question: Is service reduction acceptable?).  
  - **Verdict:** **ROUTE** to committee. Not primarily a test; it’s a trade-off between staff well-being and public access.  
  - **Charter Reframe:** Hypothesis becomes: "We test staff morale changes under compressed hours, but service impacts require deliberation."  

  **2. Predictive Code Enforcement**  
  - **Q1:** Indeterminate? Yes. Inefficient inspections (data shows 70% of complaints yield no violations).  
  - **Q2:** Stakeholders? Residents (high-complaint areas) not involved in design → **NO** (violates Q2; only IT/management consulted).  
  - **Q3:** Hypothesis? "Target inspections via model → 20% more violations found due to efficient targeting." Sufficient.  
  - **Q4:** Counterfactual Who? Proposer names "residents in low-priority areas" (fewer inspections → more uncaught violations). Pass.  
  - **Q5:** Stability? Must stay still: Complaint patterns, inspector behavior. Pilot changes both (model alters where inspectors go → affects complaint behavior) → **NO** (stability broken; results won’t travel).  
  - **Verdict:** **NO**. Fails Q2 (excluded stakeholders) and Q5 (stability).  
  - **Options:** Proposer could add resident advisory group + test on historical data first.  

  **3. Unarmed Crisis Teams**  
  - **Q1:** Indeterminate? Yes. Police shootings of mentally ill (5 incidents in 18 months) show unresolved risk.  
  - **Q2:** Stakeholders? Affected: Mentally ill, families, police. Involvement? Announcement ≠ co-design → **REFER BACK** for urgent retroactive inclusion (e.g., family advisory panel).  
  - **Q3:** Hypothesis? "Dispatch team → 30% fewer arrests/injuries via de-escalation training." Sufficient.  
  - **Q4:** Counterfactual Who? Proposer names "police" (lost overtime, morale issues). Pass.  
  - **Q5:** Stability? Must stay still: Crisis incidence, public trust. Pilot may increase crisis reporting (trust rises) → **REFRAME** claim to: "Effectiveness in pilot zones, not city-wide scalability."  
  - **Q6:** Learning? Metrics: Arrests/injuries (gameable if police under-refer). Fix: Third-party call log audit.  
  - **Q7:** Sunset? None proposed → **REFER BACK** to add auto-sunset (e.g., "Ends in 6 months unless council votes").  
  - **Verdict:** **REFER BACK** for Q2 (stakeholder inclusion), Q5 (reframed claim), and Q7 (sunset). Then **RUN**.  
  - **Charter:** Learning threshold: "Success = >15% arrest reduction; null = ±5%."  

  ---  

  ### **WHAT THIS PROCEDURE CAN’T DO**  
  **(Must be shared with committee to prevent over-trust)**  
  1. **False Confidence:** It flags obvious flaws but can’t guarantee truth. A "pass" doesn’t mean the pilot works—it means it’s testable.  
  2. **Values Masked as Facts:** It identifies values conflicts (via Q5 stability or Q4 counterfactual) but doesn’t resolve them. Committee must own these.  
  3. **Unmeasurable Outcomes:** It can’t create metrics for "soft" impacts (e.g., trust) without qualitative input from stakeholders.  
  4. **External Shocks:** If a recession hits during the pilot, results may be invalid—procedure can’t control the world.  
  5. **Power Imbalances:** It requires democratic input (Q2) but can’t force equity if stakeholders are co-opted or silenced.  
  6. **Bad-Faith Actors:** It detects gaming (Q6) but can’t stop it without enforcement (e.g., audits).  
  7. **Predicting the Future:** It tests "what happened," not "what will happen" at scale. Scalability is always a gamble.  

  **Your Move When the Procedure Yields an "Inconvenient" Result:**  
  - **If NO:** Kill the pilot. Tell the committee: "This isn’t testable/democratic; try a town hall instead."  
  - **If REFER BACK:** Demand fixes (e.g., "Add a control group or we reject").  
  - **If ROUTE:** Tell committee: "This is about values, not facts—you must debate trade-offs."  
  - **If you overrule it:** Be transparent. E.g., "Procedure says NO, but we’re routing this due to mayor’s commitment—here are the risks."  

  This system makes your implicit rigor explicit. It won’t stop politics, but it will force honesty about what’s being tested—and what’s being sold. Revise it annually with lessons from failed pilots.  

  ---  
  **Final Output:** [Attach one-page Pilot Charter template per above.]
