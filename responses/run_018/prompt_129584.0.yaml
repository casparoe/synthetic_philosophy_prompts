answer: |-
  Here's a casual sorting tree for your anthro seminar handout – focused on the cases, not labels:

  **Start:**  
  **Q1: Did Easter Island "collapse" when they stopped building moai & switched to the birdman cult?**  
  *   **(A) Nah, it's just a big religious/cultural shift. Society didn't implode.** ➡️ **Go LEFT**  
  *   **(B) Yeah, even though people stuck around, something fundamental broke.** ➡️ **Go RIGHT**

  ---

  **LEFT PATH (From Q1-A: Easter Island = No Collapse)**  
  **Q2: Is losing writing (Linear B, Maya script) absolutely NECESSARY to call something a "collapse"?**  
  *   **(A) Yes, writing loss is a core requirement for true collapse.** ➡️  
      **Q2a: But Easter Island never had writing! Does that mean it *automatically* can't be called a collapse?**  
      *   **(Yes, logically) → Leaf 5: The Empty Combo.**  
          *   *Awkward Commitment:* "Easter Island *can't* collapse by my definition because it lacked writing to lose. (Note: This view is generally unoccupied – it's logically possible but doesn't make much sense historically)."  
  *   **(B) No, writing loss isn't mandatory. Other failures count.** ➡️ **Leaf 4: Silent Reorganization.**  
      *   *Awkward Commitment:* "You have to argue that *none* of these cases (Bronze Age, Maya, Easter Is.) involved collapse, just messy adaptation & reorientation invisible to state-centric archaeology."

  **RIGHT PATH (From Q1-B: Easter Island = Collapse)**  
  **Q3: Is a big population crash (demographic collapse) SUFFICIENT to call it "collapse", even if local trade/exchange networks ("administrative dark matter") kept going?**  
  *   **(A) Yes, if tons of people vanish, it's collapse regardless of surviving local stuff.** ➡️ **Leaf 3: Demographic Determinist.**  
      *   *Awkward Commitment:* "You *must* downplay the survival of Bronze Age/Maya local networks – the population crash is what *really* matters, institutions are just window dressing."  
  *   **(B) No, population loss alone isn't enough. Bigger systems need to fail.** ➡️ **Q4: Is losing writing, centralized control, and elite hierarchy the core of collapse?**  
      *   **(A) Yes, losing complex integration defines collapse.** ➡️ **Leaf 2: Complexity-Loss.**  
          *   *Awkward Commitment:* "You *must* argue Easter Island *did* have complex hierarchy/integration that collapsed with the moai system, even without writing."  
      *   **(B) No, the 'collapse' label is mostly about our modern obsession.** ➡️ **Leaf 1: Pure Narrative Framing.**  
          *   *Awkward Commitment:* "You have to admit the whole 'collapse' idea for these societies is basically just us being sad the cool monuments stopped/getting ruined."

  ---

  **Key Notes for Your Discussion:**  
  1.  **Silent Reorganization vs. Narrative Framing:** These *can* land on the same initial answers (Q1-A + Q2-B). **BUT**, the tree forces a separation! Silent Reorganization (Leaf 4) *requires* you to see adaptation in the local networks. Narrative Framing (Leaf 1) *requires* you to see the "collapse" label as primarily about monuments/ruins, regardless of underlying adaptation. They share the start but diverge on *why* they reject collapse.  
  2.  **The Empty Combo (Leaf 5)** is flagged as logically possible but generally unoccupied because defining collapse *only* by writing loss makes Easter Island irrelevant by default, which isn't a useful historical position.  
  3.  **Complexity-Loss (Leaf 2)** has the tricky job of applying "state-level collapse" criteria (writing, hierarchy) to Easter Island, which lacked writing but arguably had complex integration around the moai cult.  
  4.  **The Tree Separates All Views:** No two leaves share *all* the same answers across the branches.

  **Tree Structure Summary (7 Nodes):**  
  Start -> Q1 -> (Left: Q2 -> [Leaf 5 or Leaf 4]) / (Right: Q3 -> [Leaf 3 or Q4 -> (Leaf 2 or Leaf 1)])
