answer: |-
  **Teaching Plan: Kripkenstein's Rule-Following for Law & Literature Grads**

  **1. Dependency Sequence (Order & Rationale):**
  *   **Start (5 min Silent Writing):** Students write a professional rule (e.g., "fair use," "duty to warn") & describe what would prove they'd *always* misunderstood it. *Rationale:* Forces introspection on the *feeling* of knowing a rule's meaning, priming the core question ("How *do* I know what rule I meant?"). Establishes the pre-skeptical intuition of meaning's fixity.
  *   **Meaning Intuition & Past Applications:** Elicit from the exercise: We feel we grasp the rule *now* and that it governed *past* actions. *Why needed:* Skepticism targets this intuition. We must agree meaning *seems* fixed before challenging it.
  *   **The Skeptical Challenge (The Problem):** Using the carrying example (e.g., "reasonable care"), demonstrate that *all past applications* are consistent with multiple, conflicting rules for the *future*. *Why after Intuition:* The problem only arises *because* we feel meaning is fixed; the challenge shows this feeling is logically unfounded. *Why before Solution:* The solution's necessity only makes sense if the problem (no fact fixing meaning) is fully grasped.
  *   **Mental State Skepticism:** Argue that no internal mental state (image, feeling, intention) can resolve the indeterminacy, as the skeptic can reinterpret *any* state. *Why after Challenge:* Shows the insufficiency of the most intuitive *individualistic* answer to the challenge.
  *   **The Skeptical Solution:** Introduce community agreement in practice as the *only available* ground for "correctness," replacing the failed individualistic picture. *Why Last:* It directly responds to the vacuum created by the problem and the failure of mental states. Its force depends on accepting the preceding steps.

  **2. The Carrying Example: "Reasonable Care"**
  *   **Scenario:** Use "reasonable care" as the rule. Ask: What constituted "reasonable care" for a factory owner in 1890s England? In 1950s USA? In 2020s Sweden? Did the *meaning of the rule itself* change, or just its application? The skeptic argues: All past applications (e.g., installing safety railings in 1890) are consistent with the rule meaning "what the local community *then* deemed reasonable" OR "what global best practice *now* deems reasonable" OR "what minimizes owner liability" OR etc. There is no "fact" about which rule *was* meant, hidden in the past user's mind, that fixes which future application (e.g., requiring AI monitoring in 2030) is correct.
  *   **Must Possess:** Indeterminacy in past applications regarding future cases; No privileged mental fact in the original rule-user resolving ambiguity; Obvious dependence on context/community standards.
  *   **Must Lack:** Any appeal to a *private*, inaccessible mental criterion defining "reasonable."
  *   **Why it Works:** Directly relevant to legal interpretation; avoids math baggage; highlights context-dependence they intuitively grasp; naturally leads to community/consensus as the basis for resolving indeterminacy ("What do *we* agree constitutes 'reasonable care' here and now?").

  **3. Misconception Map (Intercept & Correct):**
  *   **Misconception 1: Kripke *Endorses* Skepticism.** Students think the argument *proves* meaning is impossible. *Intercept Point:* Immediately after stating the skeptical challenge. *Move/Phrasing:* "Kripke presents this as a *devastating problem* for our ordinary view of meaning, a *skeptical paradox*. His goal isn't to *live with* meaning-skepticism, but to find a *solution* that avoids it. The 'skeptical solution' is the answer."
  *   **Misconception 2: This *Is* the Private Language Argument.** Students conflate the rule-following problem with the impossibility of a private language (referring solely to private sensations). *Intercept Point:* During/after discussing the failure of mental states. *Move/Phrasing:* "While related, this is distinct. The rule-following problem applies even to public words like 'plus' or 'reasonable care'. It's about *any* rule, not just sensations. The private language argument is a *consequence* of this more fundamental point about rules, not the starting point."
  *   **Misconception 3: It's About Psychological Uncertainty.** Students think it's about our *doubt* in applying rules, not logical indeterminacy. *Intercept Point:* When first presenting the challenge using the example. *Move/Phrasing:* "This isn't about us *feeling unsure* what 'reasonable care' means tomorrow. It's a logical point: *Even if* the past rule-user felt absolutely certain, and *even if* we feel certain now, there is *no fact* about their past state or usage that logically *forces* one future application over an incompatible one. Certainty is beside the point."

  **4. What to Leave Out (Explicitly):**
  *   "We are *not* diving into technical philosophical rebuttals to the skeptic, like complex defenses of dispositionalism (the idea that meaning is what we *would* say/do)."
  *   "We are *not* reading Wittgenstein's original text or debating precise exegesis of *Philosophical Investigations* §138-242 today."
  *   "We are *not* tackling the deep debate about the 'normativity of meaning' (whether meaning inherently involves 'oughts') beyond the basic idea that rules imply correctness conditions."
  *   "Kripke's interpretation of Wittgenstein is our working frame; we aren't adjudicating its historical accuracy now."

  **5. Check for Understanding (Key Question):**
  *   **Question:** "According to the skeptical solution, what ultimately makes it correct (or incorrect) to apply the rule 'reasonable care' in a completely novel situation?"
  *   **Correct Answer (Reveals Grasp of Solution):** Points to communal agreement, standard practice, or the consensus of the relevant linguistic/legal community. (e.g., "What the relevant legal community agrees counts as reasonable care in that context," "The established practice of applying the standard").
  *   **Incorrect Answer (Reveals Only Grasp of Problem):** Refers back to individual intention, mental states, or the "true meaning" of the words themselves, or expresses mere uncertainty/doubt. (e.g., "What the judge *intended* when they wrote the rule," "What the words *really* mean," "It's impossible to know for sure," "It depends on the specific facts alone").
