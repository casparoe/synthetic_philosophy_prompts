  - Consumer problem: The "user" is the organism as a whole. The interface serves biological functions (integration, prioritization) without a homunculus. A machine declaring "I'm conscious" without a consumer isn't under illusion—it's just generating data. Objection: This reduces consciousness to empty theater. Reply: All biological functions serve systems, not spectators; "theater" is the wrong metaphor.

