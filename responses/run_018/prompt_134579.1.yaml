  3. **Causation problem:** If ontological costs are framed via counterfactuals (what we lose by switching), it's difference-making. But mechanistic causation would ask what physical processes make framework abandonment difficult. The user should acknowledge this tension. Maybe epistemic inertia is about the cost to our understanding, not to the world itself.

