  The causation issue is critical. They mention difference-making (counterfactual dependence) versus mechanistic (physical processes). If they rely on difference-making, "ontological costs" might be epistemic rather than real, which weakens their argument. They need to clarify if epistemic inertia is about lost knowledge or an actual ontological barrier. For example, phlogiston vs. oxygen: abandoning phlogiston meant losing certain descriptions, but was that a real ontological cost or just a shift in perspective?

  Philosophical underdetermination: where are their assumptions not fully justified? They might be assuming that incommensurability implies untranslatability, but maybe partial translation is possible. Also, functional convergence in evolution could be conflated with path dependence due to different causal stories. Their symmetry between evolution and scientific development needs scrutiny—biological systems have selection pressures, while scientific frameworks involve human choices and social factors.

