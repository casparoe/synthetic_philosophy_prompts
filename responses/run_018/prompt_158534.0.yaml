  This is an interesting theoretical challenge. The actant concept comes from actor-network theory (ANT), which treats non-humans as active participants in networks. Applying this to Tambora means I need to think beyond simple causation ("it got cold") to how the volcano actively reconfigured social and historical processes.

  For the food riots question, I should distinguish between Tambora as the trigger versus the grain tariff system as the amplifier. The volcano created the conditions for crisis, but human systems determined how that crisis manifested. The actant framework helps show how Tambora exposed vulnerabilities in those systems.

  Regarding Frankenstein, I need to be careful not to fall into environmental determinism. While the weather created conditions for the writing retreat, it didn't dictate Shelley's creative output. The actant lens reveals how non-human forces can enable human creativity without determining it.

