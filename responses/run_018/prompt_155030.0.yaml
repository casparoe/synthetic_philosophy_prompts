  my friend who's deep into collective intentionality has these verdicts that seem consistent but i can't pin down the exact rule. she says two people carrying a piano up stairs are acting jointly even if they never spoke, because they're physically adjusting to each other moment by moment. she counts an orchestra playing a symphony as joint action, but insists it's because the musicians form a plural subject with shared commitment, not just because the sound comes out right. she denies that people fleeing a burning building together are doing anything jointly—she calls it parallel individual survival actions, even though they bump into each other and dodge. she also denies that a corporation issuing a climate policy is a joint action of its employees, saying institutional roles don't automatically generate we-intentions. but she does say that two strangers who spontaneously form a bucket brigade during a fire are acting jointly, with zero prior agreement.

  here's the new case: a philosopher and a large language model are working in real-time on a proof. the model proposes steps, the human revises or rejects them, and they iterate for hours, producing an argument neither would have generated alone. the model has no beliefs or intentions, but the functional interdependance is intense.

  would she call that joint action? i'm less interested in the yes/no than in the rule she's actually running, the other rules that fit her earlier verdicts just as well, what each predicts about this case, your best guess with reasons, and what further case would best tell those rules apart. also, whichever way she goes, what principle is she implicitly adopting?
