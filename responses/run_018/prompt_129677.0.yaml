  I consider two strong principles that explain all five prior judgments:
  1) The Contextual Segregation Principle: Beliefs/institutions are inferred when patterns appear exclusively in contexts divorced from practical utility
  2) The Functional Surplus Principle: Beliefs/institutions require material elements that exceed functional necessities

  Applying these to the bead case creates divergence:
  - Contextual Segregation supports ritual inference due to spatial isolation
  - Functional Surplus rejects ritual because beads lack even potential utility

  The closest precedent seems to be the miniature weapons case (3), which shares key features of non-utility and contextual isolation. I think she'll likely extend that logic to infer ritual here.

