answer: |-
  ### Preliminary Brainstorming
  Candidate rules explaining her prior judgments:  
  1. **Contextual Segregation Principle**: Beliefs/institutions are inferred only when material patterns occur in contexts explicitly divorced from practical utility (e.g., burial, isolated ritual deposit).  
  2. **Functional Surplus Principle**: Beliefs/institutions require materially "excessive" elements that lack practical justification (e.g., non-functional ochre application).  
  3. **Decentralization Default**: Reject centralized institutions if material patterns can be explained by household-scale replication or local environmental factors.  
  4. **Cross-Domain Disjunction**: Reject symbolic links if identical forms appear in functional vs. non-functional contexts without evidence of shared rules.  
  5. **Practical Parsimony**: Favor mundane explanations (diet, tool-use) over institutional rites when physical traces align with daily activities.  

  ---

  ### Candidate Interpretive Rules  
  **Rule A: Contextual Segregation Principle**  
  *Definition*: Beliefs/institutions are inferred only if the material pattern is confined to contexts with no plausible functional purpose (e.g., ritual, burial) and is absent from practical/domestic settings.  
  - **Case 1 (Accept)**: Ochre applied solely in burials (non-functional context) with no domestic parallels.  
  - **Case 2 (Reject)**: Identical seals in administrative *and* domestic trash (lacks contextual segregation).  
  - **Case 3 (Accept)**: Miniature weapons at isolated river crossing (no defensive/practical context).  
  - **Case 4 (Reject)**: Carvings on storage jars (functional context) match rock art (non-functional).  
  - **Case 5 (Reject)**: Dental modifications in settlement remains (daily-life context).  

  **Rule B: Functional Surplus Principle**  
  *Definition*: Beliefs/institutions are inferred only if material elements show demonstrable "waste" or non-utility (e.g., unused objects, non-adaptive effort) unexplained by practical needs.  
  - **Case 1 (Accept)**: Ochre application has no functional benefit (surplus effort in burial).  
  - **Case 2 (Reject)**: Seals in trash pits imply functional discard (no surplus).  
  - **Case 3 (Accept)**: Miniature weapons lack combat damage and defensive context (non-utility).  
  - **Case 4 (Reject)**: Jar carvings may prevent cracks/identify contents (practical function).  
  - **Case 5 (Reject)**: Dental patterns align with diet/tool-use (no surplus effort).  

  ---

  ### Divergent Predictions for the Bead Case  
  - **Rule A (Contextual Segregation)**: *Predicts ACCEPTANCE of ritual inference*.  
    Reasoning: Beads are strictly confined to one building with domestic debris (mixed context). However, their non-local clay, identical piercing, and *complete absence of use-wear/stringing* segregate them functionally from sleeping/eating activities. They occupy a "ritualized" niche within a practical space.  
  - **Rule B (Functional Surplus)**: *Predicts REJECTION of ritual inference*.  
    Reasoning: Though unpierced beads lack utility, they co-occur with food prep/sleeping mats. This practical context allows a mundane explanation: beads could be failed production batches, raw material stockpiles, or even play objects. No *demonstrable surplus* exists beyond potential domestic roles.  

  ---

  ### Best Verdict and Closest Precedent  
  **Predicted Verdict**: She will **ACCEPT** an institutionalized ritual centered on the structure.  
  **Reasoning**: Rule A (Contextual Segregation) is dominant in her prior judgments. The beads’ extreme contextual confinement (one building, no site-wide distribution), combined with their non-local origin and total lack of use, parallels **Case 3 (miniature weapons)**. Both involve:  
  - Objects deposited in an atypical location (river crossing / single building).  
  - Zero evidence of functional deployment (no combat damage / no stringing wear).  
  - Absence from practical domains (defenses / burials, refuse).  

  **Principles Adopted**:  
  - If she **accepts** ritual: She prioritizes *spatial and functional segregation* within a domestic setting as evidence of ritualized practice.  
  - If she **rejects** ritual: She adopts *practical parsimony*, arguing beads could be unused inventory or defective goods.  

  **Closest Precedent**: **Case 3** (miniature weapons). Both cases isolate non-utilitarian objects in a context that blends practical and symbolic potential (river crossing vs. domestic building).  

  ---

  ### The Crucial Test Case  
  **Scenario**: At a settlement’s edge, excavators find a pit containing 20 identical, finely woven baskets filled with charred grains. Adjacent to the pit, a stone altar bears identical baskets with charred grains. Microscopic analysis confirms *all* baskets were exposed to identical high-intensity heat. No other structures exist nearby.  

  - **Rule A (Contextual Segregation)**: *Rejects* institutional ritual.  
    Reasoning: Baskets appear in both a refuse pit (functional discard context) and an altar (ritual context). Lacks strict segregation.  
  - **Rule B (Functional Surplus)**: *Accepts* institutional ritual.  
    Reasoning: Burning *multiple* fine baskets of grain exceeds storage/disposal needs (functional surplus), especially at an altar. The effort implies ritual "waste."
