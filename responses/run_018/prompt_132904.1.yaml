answer: |-
  ## Full Specification: Desiderata for a "Better Than" Theory in Spectrum Arguments

  This specification defines the necessary criteria for an adequate theory of the comparative relation "better than" when applied to sorites-style spectrum arguments (e.g., health states from perfect to severely impaired via tiny deteriorations). The focus is on resolving the core tension: how barely noticeable improvements can accumulate into a large, intuitively implausible difference without collapsing into absurdity.

  **I. Pairwise Case Desiderata (Non-Negotiable Accuracy):**

  1.  **Clear Superiority:** The theory must judge `A > B` when `A` is *clearly and significantly* better than `B` (e.g., "Perfect Health" vs. "Life with Constant Severe Pain"). *Motivation:* Foundational intuition of value difference. Failure implies value nihilism.
  2.  **Clear Equality:** The theory must judge `A ≈ B` when `A` and `B` are *trivially identical or manifestly equivalent in value* (e.g., "Perfect Health" vs. "Perfect Health with an extra freckle"). *Motivation:* Basic coherence and avoidance of false distinctions. Failure implies value hypersensitivity.
  3.  **Borderline Proximity Tolerance:** The theory must *not* require a definite `A > B`, `B > A`, or `A ≈ B` judgment for adjacent pairs in the spectrum (e.g., Health State `S_i` vs. `S_{i+1}`). It must accommodate *vagueness* or *indeterminacy* at the margins. *Motivation:* Sorites premise; barely noticeable differences plausibly don't constitute an improvement *or* a worsening *or* exact equality in value. Failure to allow this leads directly to the paradox.
  4.  **Distant Incommensurability Recognition:** The theory must *not* judge `A > B`, `B > A`, or `A ≈ B` for pairs sufficiently far apart on the spectrum *if* they involve a qualitative shift (e.g., "Perfect Health" vs. "Minimally Conscious State"). It must allow for `A ◊ B` (incommensurability). *Motivation:* Intuition that radically different states (especially across thresholds like consciousness or severe suffering) resist direct comparison on a single dimension. Failure collapses distinct values.

  **II. Structural Property Desiderata (Balancing Rationality & Phenomena):**

  5.  **Asymmetry (Non-Negotiable in Clear Cases):** If `A > B` is true, then `B > A` must be false. *Motivation:* Core logical constraint on "better than"; violation implies contradiction. *Scope:* Required only for pairs where a clear "better than" judgment *is* warranted (Desideratum 1). Can fail for borderline or incommensurable pairs.
  6.  **Irreflexivity (Non-Negotiable):** `A > A` is always false. *Motivation:* Logical necessity; nothing can be better than itself.
  7.  **Rejection of Global Transitivity (Non-Negotiable):** The theory must *not* require that `A > B` and `B > C` entail `A > C` *across the entire spectrum*. *Motivation:* Sorites paradox itself; strict transitivity forces the absurd conclusion that imperceptible differences accumulate into a strict superiority where none exists (e.g., `S_0 > S_n`), or forces arbitrary cutoffs.
  8.  **Local Transitivity (Highly Desirable, Possibly Negotiable):** The theory *should* preserve transitivity (`A > B` and `B > C` entail `A > C`) within "neighborhoods" of sufficiently similar options where clear comparisons are possible. *Motivation:* Preserves local rationality in choice. *Tension:* Strict adherence risks forcing global transitivity if neighborhoods connect seamlessly (the core problem). A theory *may* relax this if it provides a principled account of where local transitivity breaks down (e.g., at qualitative shifts).
  9.  **Rejection of Completeness (Non-Negotiable):** The theory must *not* require that for every pair `A` and `B`, either `A > B`, `B > A`, or `A ≈ B` is true. *Motivation:* Required by Desiderata 3 (Borderline Proximity) and 4 (Distant Incommensurability). Failure forces false precision or false comparisons.
  10. **Continuity Sensitivity (Highly Desirable):** The theory must be sensitive to the *continuous* nature of the spectrum (no sharp boundaries in the underlying descriptive properties). *Motivation:* Faithfulness to the sorites structure (tiny changes). *Note:* This does *not* require the *value relation* itself to be continuous (e.g., a value "jump" at a qualitative threshold is acceptable).

  **III. Critical Distinctions (Non-Negotiable):**

  11. **Homogeneous Accumulation vs. Qualitative Shift:** The theory must distinguish between:
      *   Accumulation of tiny *homogeneous* differences (e.g., barely noticeable pain increases of the *same kind*).
      *   Shifts across a *qualitative threshold* (e.g., losing consciousness, onset of severe existential suffering). *Motivation:* Explains why marginal differences *sometimes* aggregate meaningfully (local comparisons) but *sometimes* lead to incommensurability (distant comparisons). Failure collapses distinct phenomena.
  12. **"Not Better Than" Ambiguity Resolution:** The theory must clearly distinguish between:
      *   `A ≈ B` (Equality): `A` and `B` possess the *same* degree/value.
      *   `A ◊ B` (Incommensurability): `A` and `B` possess *different* values/types that resist comparison on a common scale. *Motivation:* Critical for understanding the *reason* `A` is not better than `B` in Desiderata 3 & 4. Failure conflates equivalence with incomparability.

  **IV. Core Tensions & Joint Unsatisfiability:**

  *   **The Fundamental Impossibility:** It is **impossible** to jointly satisfy **Unrestricted Transitivity (UT)** (demanding `A > C` whenever `A > B` and `B > C` for *any* `A, B, C` in the spectrum) and a **Principled, Non-Arbitrary Boundary Condition (BC)** (avoiding sharp cutoffs between `>` and `≈` or `◊` that lack a corresponding descriptive discontinuity).
      *   **The Tension:** UT forces a chain: `S_0 > S_1 > S_2 > ... > S_n`. This entails `S_0 > S_n`. BC demands that adjacent pairs (`S_i`, `S_{i+1}`) cannot have a sharp, arbitrary boundary where `S_i > S_{i+1}` suddenly becomes false or `S_i ≈ S_{i+1}` suddenly becomes true, given the continuous descriptive change. UT + BC + `S_0 > S_n` forces the conclusion that `S_0` is better than `S_n` *despite* the chain being composed of steps too small to warrant a `>` judgment individually (violating Desideratum 3/BC) or forces `S_0 ≈ S_n` (violating Desideratum 1/`S_0 > S_n`).
      *   **Resolution Requirement:** Any adequate theory **must abandon either UT or BC**. Most plausible theories abandon UT (Desideratum 7). Theories attempting to preserve UT (e.g., some epistemic or supervaluationist views) typically smuggle in arbitrariness or violate BC by effectively positing a precise (but unknown) cutoff point.

  **V. Theory Survival Brief (Against Desiderata):**

  *   **Strict Total-Ordering View:** Assumes transitivity, completeness, asymmetry. **Fails:** Violates Desiderata 3 (Borderline Proximity - forces sharp judgments), 4 (Distant Incommensurability - forces comparison), 7 (Rejects Global Transitivity? - affirms it!), 9 (Rejects Completeness? - affirms it!), 11 (Homogeneous vs Qualitative? - collapses distinction), 12 (Equality vs Incommensurability - collapses to equality/inequality). Survives only 1, 2, 5, 6. **Inadequate.**
  *   **Incommensurabilist View:** Embraces incomparability (`◊`), rejects completeness and global transitivity. **Survives/Can Survive:** 1, 2, 3 (as indeterminacy leading to `◊` locally?), 4 (core strength), 5, 6, 7, 9, 11 (if linked to qualitative shifts), 12 (core strength). **Challenges:** Satisfying 8 (Local Transitivity) without global transitivity requires careful definition of "neighborhoods" and risks reintroducing the paradox if neighborhoods connect. Explaining *why* and *where* `◊` arises without descriptively sharp boundaries (Desideratum 10) is difficult; must avoid simply positing `◊` arbitrarily along the chain.
  *   **Vagueness-Based Graded-Membership View:** Treats "better than" as a vague predicate with degrees of truth. **Survives/Can Survive:** 1, 2, 3 (core strength - borderline cases have low truth value), 5 (can hold for clear cases), 6, 7 (global transitivity fails for low-truth premises), 9, 10 (core strength), 12 (can model degrees between true `≈` and true `◊`?). **Challenges:** Satisfying 4 (Distant Incommensurability) - is `◊` just very low truth value of `>`/`<`/`≈`? This risks collapsing the distinction. Satisfying 8 (Local Transitivity) - fuzzy logic often has transitivity only for high degrees of truth; does this hold locally? Defining the "degree" function non-arbitrarily (avoiding violation of BC) is difficult. Explaining 11 (Qualitative Shift) solely via gradual truth-value change is challenging.

  **Summary of Non-Negotiables:** Asymmetry (in clear cases), Irreflexivity, Rejection of Global Transitivity, Rejection of Completeness, Accurate handling of Clear Superiority/Equality/Borderline Proximity/Distant Incommensurability, Distinguishing Homogeneous Accumulation vs. Qualitative Shifts, Distinguishing Equality vs. Incommensurability as reasons for "not better than", Non-Arbitrary Boundaries (BC). **The core tension (UT vs. BC) forces the rejection of UT.**
