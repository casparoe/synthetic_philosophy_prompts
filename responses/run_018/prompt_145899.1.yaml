prompt: |-
  I'm putting together quesitons for a small philosophy podcast. Next week's guest is defending a slightly niche view that Darwin's argument from natural selection and Turing's computation thesis share one deep logical inversion: both show you can get full-blown functional competence without ever attributing comprehension to the mechanism itself. I want about six or seven interview questions that don't just let her restate the headline. Please include: one pressing whether this collapses the difference between biological adaptation and machine learning, with a follw-up keyed to her saying they're still different in kind; one asking how she handles Searle's Chinese Room, since that looks designed to block exactly this Turing-style inversion; one on whether Darwin himself would have endorsed the symmetry, given his occasional talk of design without a designer; and a closing question about what empirical finding in neuroscience or AI evaluation could actually weaken her claim that comprehension is always just post-hoc. Write the answer in British English, keep the tone casual, and don't ask for citations or reading lists — the point is she answers from the view itself.
