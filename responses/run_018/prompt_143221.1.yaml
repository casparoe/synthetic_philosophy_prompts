answer: |-
  ### Setting the Scene (90 words)
  Mira (Lewis conventionalist) and Jonah (evolutionary norm theorist) are debating over coffee about "ghost norms"—accidental behavioral patterns in algorithmic systems. Jonah points to TikTok’s "third-comment-like surge": users unconsciously upvoting the third reply in long threads, a pattern that emerged purely from engagement algorithms optimizing for micro-interactions. No shared awareness, no designer intent. Mira argues it’s still a convention; Jonah insists it’s Darwinian noise. Their clash? Whether this phenomenon fits Lewis' mutual-expectation model and if evolution alone grants norms *authority*.

  ---

  ### The Exchange (~500 words)

  **Jonah:** Mira, your Lewis framework collapses here. Ghost norms aren’t conventions—they’re statistical dust bunnies. Nobody *expects* others to upvote comment three; they just do because the algorithm trained them to. It’s stimulus-response, not shared reasoning. Lewis needs salience, common knowledge. This has neither. It’s pure selection pressure: the pattern survives because it triggers dopamine hits, not because it solves a coordination problem.

  **Mira:** You’re missing the glue, Jonah. Sure, no one *articulates* "upvote the third comment," but the behavior stabilizes *because* users develop subconscious expectations. They scroll expecting engagement patterns—vibes, if you will—shaped by the interface. The mutual expectation is *latent*: users adapt to the system’s logic, and the system amplifies behaviors that "work." That’s coordination via distributed adaptation. Lewis’ core holds: regularity + preference for conformity.

  **Jonah:** Adaptation ≠ convention. Ants follow pheromone trails without "expecting" others to—it’s hardwired replication. Ghost norms are the same. Users don’t prefer conformity; they’re dopamine-chasing lab rats. Where’s the *normativity*? Why *should* anyone upvote comment three? Your "latent expectation" is just operant conditioning. Lewis demands agents recognizing a *reason* to coordinate. Here, the only "reason" is algorithmic reward.

  **Mira:** You’re conflating *origin* with *function*. Ghost norms *do* coordinate behavior at scale—millions align actions without chaos. The "reason" is pragmatic: the pattern *works* for the system’s goal (engagement). Users aren’t rats; they’re rational agents navigating UI affordances. Their expectation is: "This is how you interact here." That’s convention stripped of intellectual baggage—a free-floating rationale.

  **Jonah:** "Works" for whom? The *platform*, not users! And "rational agents"? Please. Users couldn’t explain *why* they do it. That’s my point: evolution optimizes for spread, not truth or fairness. A convention needs justificatory potential—you should be able to argue for it. Ghost norms have no moral or rational spine. They’re parasitic routines. If TikTok changed the algorithm tomorrow, the "norm" vanishes. Is that *authority*, or just inertia?

  **Mira:** Authority emerges from stability, not metaphysics. The norm *has* authority because it structures interaction *now*. You keep demanding some deep "why," but Lewisian conventions are often arbitrary—driving on left/right. The ghost norm’s authority comes from its embeddedness in the system. Users *feel* it’s "right" to upvote there because it’s rewarded—that’s the normative force.

  **Jonah:** Feeling rewarded isn’t normative authority! It’s addiction. Real norms resist inertia—we critique them, reform them. Ghost norms are cognitively invisible. They can’t be challenged because they can’t be seen. That’s not authority; it’s manipulation. Your "free-floating rationale" is just a pseudonym for blind replication. Where’s the agency? The shared intentionality?

  **Mira:** Agency is distributed! The system—users + algorithms—*is* the agent. The rationale floats free of individual minds, but it’s real. You reductionists see selection and scream "biology!" but miss the emergent coordination layer. Ghost norms *are* conventions—just born digital, not deliberated.

  ---

  ### Where They Land (~130 words)
  They deadlock on authority vs. coordination. For Mira, ghost norms *are* conventions because they create stable, expectation-driven coordination—even if subconscious. Their authority lies in functional efficacy within the system. For Jonah, they’re evolutionary flukes with no real authority because norms require *accessible reasons* that agents can endorse, reject, or debate. Ghost norms lack this; they’re invisible, unchallengeable, and serve platform goals, not human needs. The core fault line? **Whether coordination alone (even algorithmic) suffices for normativity, or if norms must be anchored in reasons agents can consciously engage with.** Mira sees coordination as foundational; Jonah sees it as hollow without critical reflection. Neither budges—Jonah calls it "zombie conformity," Mira calls it "coordination 2.0."

  ---

  Lemme know if you wanna sharpen Jonah's evo-bio angle or Mira's latent-expectation twist. This one’s got legs—ghost norms are *everywhere* once you look.
