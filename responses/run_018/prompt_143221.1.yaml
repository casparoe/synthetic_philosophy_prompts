  write it in american english, casual tone—like you're pitching me the transcript over coffee. slip in a typo or two, nothing crazy. don't cite anyone, don't include a bibliography or reading list, and don't put quotation marks around anything from a real text unless you've actually fetched the source. just build the argument from the concepts themselves.
