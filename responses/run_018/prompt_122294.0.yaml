prompt: |-
  I am trying to evaluate whether phenomenal properties survive the objection that they are incoherent—what some call "quining" qualia—without simply assuming they exist. Before I read further defenses, I want the full specification of what an adequate theory of qualitative experience must actually deliver if it is to show that qualia are not confused posits. Write the desiderata: the phenomena it must accommodate (including inverted-spectrum scenarios, first-person authority about one's own experiences, and the logical possibility of artificial systems making genuine phenomenal reports), the distinctions it must not collapse (phenomenal versus access consciousness, intrinsic quality versus relational functional role, having a state versus knowing that one has it), the specific incoherence charges it must answer (the private-language problem, the explanatory-gap complaint, and the charge that qualitative similarity is neither transitive nor determinable across subjects), and the external constraints it must satisfy (compatibility with predictive-processing neuroscience, with the intuition that suffering and pleasure carry direct moral weight, and with the conceivability of philosophical zombies). For each, give the motivating case or argument behind it, and flag any pair of desiderata you think cannot be jointly satisfied—especially any tension between accounting for qualitative character in causal-physical terms and preserving its alleged non-relational, intrinsic nature. Then briefly note how an eliminativist denial of qualia, a representationalist reduction to intentional content, and a primitive-property dualism each stand against the list, but keep the weight on the criteria rather than the scorecard.
reasoning: |-
  Okay, the user is tackling a complex philosophical problem about phenomenal properties and qualia. They want a comprehensive list of criteria that any adequate theory of qualitative experience must meet to counter objections like "quining qualia." Let me start by recalling key elements they mentioned: phenomena to accommodate, distinctions to maintain, incoherence charges to address, and external constraints to satisfy.

  First, the phenomena. Inverted spectrum scenarios are crucial because they challenge functionalism by showing that identical behaviors could mask different subjective experiences. First-person authority is about privileged access to one's own mental states, which theories need to explain without making qualia infallible. Artificial systems making genuine phenomenal reports involve systems like advanced AI or aliens reporting experiences, which tests if consciousness can arise in non-biological entities.

  Next, distinctions. Phenomenal vs. access consciousness is from Ned Block's work; conflating them ignores the subjective feel. Intrinsic quality vs. relational role addresses whether qualia are intrinsic or defined by function. Having a state vs. knowing it separates the experience from metacognition, avoiding higher-order theories' conflation.

  Incoherence charges include Wittgenstein's private language argument, which questions if private qualia can be meaningfully discussed. The explanatory gap, highlighted by Levine, points to the hard problem of why certain processes feel a certain way. Qualitative similarity issues challenge intersubjective comparisons and the structure of qualia spaces.

  External constraints involve compatibility with neuroscience, like predictive processing, which sees the brain as a prediction machine. Moral weight of suffering ties qualia to ethics, so denying them might undermine moral considerations. Philosophical zombies, conceivable duplicates without consciousness, challenge physicalism if they're logically possible.

  Tensions are key. The big one is intrinsic nature vs. causal role. Physical sciences deal with relational properties, so intrinsic qualia seem incompatible. Also, subjective privacy clashes with public reports needed for science. Representationalism might handle some aspects but struggles with intrinsic qualities. Eliminativism denies qualia but faces moral and first-person authority issues. Dualism accepts primitives but violates physical compatibility.

  The user might be preparing for deeper research or a paper, needing a structured framework. Their unspoken need could be clarity on where theories fail, especially reconciling intrinsicality with physicalism. They might also seek unresolved tensions to focus their study. Ensuring each desideratum's rationale is clear helps them evaluate theories critically without bias.
answer: |-
  Here is a comprehensive specification of desiderata for an adequate theory of qualitative experience, designed to show qualia are coherent and not confused posits, along with their motivations, tensions, and brief notes on major theoretical approaches:

  ### I. Phenomena to Accommodate
  1.  **Inverted Spectrum Scenarios:** Must account for the logical possibility that two individuals (or the same individual over time) exhibit identical functional/causal roles, discriminatory behaviors, and neural correlates for color, yet experience reversed qualitative character (e.g., one sees ripe tomatoes as *this* (R), the other as *that* (G)).
      *   *Motivation:* Demonstrates qualia aren't entailed by function/structure alone, requiring a non-functional "residue."
  2.  **First-Person Authority (Limited):** Must explain the unique, direct, and seemingly privileged access one has to one's *own* current phenomenal states (e.g., knowing "what it's like" to have a headache), while allowing for potential misreporting or misinterpretation.
      *   *Motivation:* Highlights the asymmetry between 1st-person and 3rd-person perspectives on experience; qualia seem "given" to the subject.
  3.  **Artificial/Non-Biological Phenomenal Reports:** Must allow for the logical possibility that a sufficiently complex artificial system (AI, alien) could genuinely possess qualia and make truthful reports about them (e.g., "I am experiencing intense blue").
      *   *Motivation:* Challenges bio-chauvinism; consciousness shouldn't be definitionally tied to specific biological substrates if qualia are fundamental properties.

  ### II. Distinctions to Maintain
  4.  **Phenomenal Consciousness (P-Consciousness) vs. Access Consciousness (A-Consciousness):** Must distinguish the *subjective feel* of an experience (e.g., the redness of red) from its *availability for global control, reporting, and reasoning*.
      *   *Motivation:* (Ned Block) Blindsight cases suggest information can be A-conscious (guiding behavior) without being P-conscious. Conflation obscures the target explanandum.
  5.  **Intrinsic Quality vs. Relational Functional Role:** Must distinguish the *intrinsic, non-relational "what-it's-like-ness"* of a quale (e.g., the intrinsic quality of pain) from its *causal/dispositional roles* (e.g., causing winces, avoidance, saying "ouch").
      *   *Motivation:* Inverted spectrum and zombie arguments suggest intrinsic quality could vary or be absent independently of functional role.
  6.  **Having a State vs. Knowing/Representing that One Has It:** Must distinguish the *occurrence* of a phenomenal state (e.g., feeling pain) from *higher-order awareness* or *cognitive access* to that state (e.g., forming the thought "I am in pain").
      *   *Motivation:* Avoids conflating phenomenal consciousness with metacognition; primitive experiences (e.g., in infants) might lack higher-order representation.

  ### III. Incoherence Charges to Answer
  7.  **The Private Language Problem (Wittgenstein):** Must show how intersubjective meaning and reference for phenomenal terms (e.g., "red sensation") is possible without relying on private, ineffable ostension.
      *   *Motivation:* If qualia are essentially private, unsharable, and only known via introspection, language about them seems impossible or vacuous.
  8.  **The Explanatory Gap (Levine):** Must address why any proposed physical/functional mechanism *necessitates* a *specific* phenomenal character (e.g., why *this* neural process feels like *redness* rather than *greenness* or nothing at all).
      *   *Motivation:* Even complete physical knowledge seems compatible with lacking knowledge of "what it's like"; the link appears contingent, not logically necessary.
  9.  **Non-Transitive/Non-Determinable Similarity:** Must address charges that relations like "phenomenal similarity" are neither transitive (A~B and B~C doesn't entail A~C) nor determinable across subjects (whether my red is more like your orange than your green).
      *   *Motivation:* (Dennett) Challenges the coherence of a structured "qualia space" and our ability to meaningfully compare subjective experiences, threatening objectivity.

  ### IV. External Constraints to Satisfy
  10. **Compatibility with Predictive Processing Neuroscience:** Must cohere with the brain being fundamentally an inference/prediction engine minimizing prediction error, constructing models of the world and body.
      *   *Motivation:* A dominant neuroscientific framework; a viable theory shouldn't contradict core principles of how the brain processes information.
  11. **Compatibility with Moral Weight of Suffering/Pleasure:** Must preserve the intuition that phenomenal pain has intrinsic negative moral weight (to be avoided/alleviated) and pleasure has intrinsic positive moral weight, independent of external behavior or judgment.
      *   *Motivation:* Eliminativism or strong reductionism risks undermining ethical foundations centered on conscious experience.
  12. **Compatibility with Zombie Conceivability:** Must either explain why philosophical zombies (physical duplicates lacking qualia) are *inconceivable* despite seeming conceivable, or provide a coherent account of why their conceivability doesn't entail their possibility/metaphysical threat.
      *   *Motivation:* (Chalmers) The apparent conceivability of zombies is a primary argument against physicalism; a theory must directly engage with it.

  ### Key Tensions & Potential Conflicts
  *   **The Central Tension: Intrinsic Nature vs. Causal-Physical Role:** Desiderata **5 (Intrinsic Quality)** and **6 (Having vs. Knowing)** push towards qualia as non-relational, intrinsic properties. However, desiderata **10 (Neuroscience Compatibility)** and the need to explain **1 (Inverted Spectrum - behavior)** & **3 (AI Reports)** pull strongly towards integrating qualia within the causal-physical world via relational/functional roles. Reconciling intrinsic phenomenal properties with the relational ontology of physical science is the *core challenge*. Theories satisfying **5** often struggle with **10**, while those satisfying **10** often struggle to genuinely satisfy **5**.
  *   **Privacy vs. Reportability:** **7 (Private Language)** demands public accountability, while **2 (First-Person Authority)** and the nature of **5 (Intrinsic Quality)** emphasize a kind of privacy/subjectivity. How can something fundamentally private be reliably reported and form the basis for public language?
  *   **Gap vs. Neuroscience:** **8 (Explanatory Gap)** highlights the apparent disconnect, while **10 (Predictive Processing)** demands seamless integration. Bridging or dissolving the gap is paramount.
  *   **Zombies vs. Physicalism:** **12 (Zombie Conceivability)** is a direct challenge to physicalist accounts aiming to satisfy **10**.

  ### How Major Theories Engage the Desiderata (Briefly)
  *   **Eliminativism (e.g., Dennett):** Denies the reality of qualia as posited. Rejects **1, 2, 3, 4, 5, 6, 11, 12** as based on confused intuitions. Focuses on explaining behavior/cognition (**3, 10**) and dissolving incoherences (**7, 8, 9**) by eliminating the problematic concept. Struggles profoundly with **2, 11**, and the *prima facie* reality of experience.
  *   **Representationalism (e.g., Tye, Dretske):** Reduces qualia to (often non-conceptual) representational content. Aims to satisfy **1** (inversions as representational differences), **2** (access to content), **3** (representation isn't biological), **4** (distinguishes representation from access), **7** (content can be public), **10** (representation fits PP). Struggles with **5** (intrinsic quality seems distinct from representing redness), **6** (representation might imply knowing?), **8** (why *this* representation has *this* feel?), **11** (is represented badness intrinsically bad?), and **12** (why can't representation occur without feel?).
  *   **Primitive Property Dualism (e.g., Chalmers):** Posits qualia as fundamental, non-physical properties. Satisfies **1, 2, 3, 4, 5, 6, 8, 11, 12** directly by taking qualia seriously as basic. Struggles severely with **7** (how do private properties ground public language?), **9** (needs a robust account of qualia relations), **10** (how do fundamental qualia integrate with PP mechanics?), and faces the hard problem of interaction/causal closure if non-physical.

  This framework provides the rigorous specification needed to evaluate theories of consciousness. Success requires navigating the core tension between intrinsicality and physical integration while satisfying the diverse demands of phenomenology, logic, language, science, and ethics. The burden is to show how a coherent, non-confused posit *can* meet these criteria.
