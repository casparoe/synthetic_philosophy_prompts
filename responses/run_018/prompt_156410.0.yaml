  The hard question is partiality. If only preferences and reasoning transfer, is that enough for "selfhood"? Hofstadter might say yes if those patterns formed the core practical identity. But the user should concede this is fractional continuation - no episodic memories or somatic aspects. 

  Strongest evidence is when the teenager makes choices the sibling would've made but the teenager previously wouldn't. That shows the pattern operating autonomously. The essay should lean into Hofstadter's fluid view of self as neither binary nor singular. 

