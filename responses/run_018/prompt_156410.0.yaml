  The amnesia scenario is clever because it creates asymmetry: the original self is frozen while its pattern flourishes elsewhere. This isn't ordinary influence because the teenager isn't just inspired - they're executing the sibling's decision-making algorithms. When they choose music or react to events using the sibling's old frameworks, it's more emulation than imitation. 

