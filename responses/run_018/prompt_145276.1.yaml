  Brown liquid spreads quick
  across pine grain, no pause.
  Fragrance bloomed then sunk —  
  **frame intact — no other variables changed.**

  White shards point up sharp
  where soft slippers tread next.
  Silent hazard zone —  
  **frame intact — no other variables changed.**

  Owner mutters *fuck's sake*,
  grabs cloth, ignores the cat
  whose paw pads find grit —  
  **frame intact — no other variables changed.**

  Sticky amber puddle.
  Sliced paw pads unseen.
  Sharp air. Stained wood. Steam gone.  
  **frame intact — no other variables changed.**

