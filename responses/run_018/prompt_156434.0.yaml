  Progress would look like: 1) Explicitly agreeing they're debating different questions (institutional effectiveness vs. conceptual coherence), 2) Testing whether dropping "self-binding" language satisfies the user's concern, 3) Exploring if escrow-lock moves the needle (it doesn't - just shifts the identity problem to the filter designers). 

