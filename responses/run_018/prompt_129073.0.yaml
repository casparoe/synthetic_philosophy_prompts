answer: |-
  ## Field Decision Procedure: Entitlement-Based Crisis Classification (v1.1)

  **Flowchart in Words (~400 words)**

  1.  **START: Report of Food Crisis.**
  2.  **Q1: Is basic food physically present/available *near* the affected population?**  
      *   *Data:* Satellite imagery, local market surveys (visual stock), govt harvest reports, transport route status (roads/rails operational?).
      *   *Question:* Can food be observed or reliably reported within feasible distribution distance? (Ignore *who* controls it for now).
      *   *Sufficient Yes:* Satellite shows silos full + markets report stock + transport routes open. **Go to Q2.**  
      *   *Sufficient No:* Crops visibly failed + silos empty + transport routes destroyed. **Flag: NATURAL DISASTER (Logistics Focus).** Human Check: Confirm scale & logistics feasibility.
  3.  **Q2: Is there evidence of widespread *entitlement failure* preventing access despite availability?**  
      *   *Data:* Market price trends (essential food staples), wage levels (key labor groups, e.g., agricultural laborers), reports of asset sales (livestock, tools), displacement patterns.
      *   *Question:* Are prices skyrocketing beyond what key vulnerable groups (laborers, small farmers, fishers) can afford with their normal income/assets? Are people selling essential assets just to eat?
      *   *Sufficient Yes:* Prices 2-3x baseline in weeks, wages stagnant/falling, reports of distress sales. **Go to Q3.**  
      *   *Sufficient No:* Prices stable/affordable relative to income/assets. **Flag: NATURAL DISASTER (Logistics Focus).** Human Check: Rule out localized pockets masked by aggregate data.
  4.  **Q3: Counterfactual Entitlement Audit:**  
      *   *Data:* National/regional food security laws (right to food? price controls? safety nets?), govt public commitments (subsidy programs, procurement guarantees, reserve release policies), prior harvest/stock reports.
      *   *Question:* Comparing current reality (Q1 & Q2 findings) to the state's *own* legal frameworks/promises: Is the state actively blocking, failing to implement, or contravening mechanisms designed to *guarantee* access (direct, trade, labor, transfer entitlements)?
      *   *Sufficient Yes:* Laws/promises exist *and* are demonstrably not being implemented (e.g., subsidies suspended despite law, reserves not released per policy, imports blocked despite shortages). **Go to Q4.**  
      *   *Sufficient No:* Laws/promises vague/absent, or implementation matches stated policy (even if policy is inadequate). **Flag: NATURAL DISASTER (Logistics Focus) / STRUCTURAL FAILURE.** Human Check: Was failure due to incapacity (natural disaster) or unwillingness?
      *   *Unclear:* Laws exist but implementation status murky. **HUMAN JUDGMENT CALL:** Investigate intent vs. capacity.
  5.  **Q4: Silent Famine Check:**  
      *   *Data:* Official mortality reports (starvation/famine-related), clinic/hospital admissions (kwashiorkor, marasmus, severe malnutrition), burial records, NGO/community reports.
      *   *Question:* Is there a stark discrepancy? Official reports claim low/no starvation deaths, but frontline health data shows a sharp, anomalous spike in severe acute malnutrition (SAM) admissions or credible reports of starvation deaths?
      *   *Sufficient Yes:* Official reports: "No deaths." Clinics: 300% SAM spike, credible death reports. **Flag: POLITICAL CRIME (Advocacy/Sanctions).**  
      *   *Sufficient No:* Mortality/morbidity data aligns (high or low) or is plausibly absent/incomplete. **Flag: POLITICAL CRIME (Advocacy/Sanctions)** based on Q3.  
      *   *Unclear:* Data patchy, conflicting, or suppression suspected but not demonstrable. **HUMAN JUDGMENT CALL:** Weigh Q3 evidence and risk.
  6.  **END: Classification (Natural Disaster, Political Crime, Both).**

  **Case 1: Bengal 1943 (~250 words)**

  *   **Q1 (Availability):** Harvests were *average* overall (not a massive shortage). However, war procurement diverted rice, and Burma (key source) fell to Japan. **Yes (but constrained), Go to Q2.**
  *   **Q2 (Entitlement Failure):** Massive inflation. Fishermen couldn't exchange fish for enough rice (trade entitlement collapse). Landless laborers' wages didn't keep pace (labor entitlement collapse). Distress sales rampant. **Clear YES, Go to Q3.**
  *   **Q3 (Counterfactual Audit):** Colonial government prioritized war supply over civilian needs. Policies actively diverted food (denial boats, export from Bengal), contravened any implied duty of care. Price controls existed but were ineffective/unenforced. **Clear YES (State actively blocking/contravening), Go to Q4.**
  *   **Q4 (Silent Famine):** Mortality was highly visible and reported, though downplayed officially. Deaths were undeniable in streets. **Sufficient NO (Data alignment: High mortality visible).**
  *   **Classification:** **POLITICAL CRIME.** Driven by state policies (procurement, non-intervention in markets, export) causing catastrophic entitlement failure despite reasonable aggregate availability. Q3 audit is decisive.

  **Case 2: The 2024 Hypothetical (~250 words)**

  *   **Q1 (Availability):** Satellite shows full silos. Govt reports record harvest. **Clear YES, Go to Q2.**
  *   **Q2 (Entitlement Failure):** Local market prices tripled in 6 weeks. Border checkpoints block food imports. **Clear YES (Prices unaffordable, trade blocked), Go to Q3.**
  *   **Q3 (Counterfactual Audit):** *Hypothetical Laws:* Assume constitution mentions "right to food," laws mandate price stabilization reserves, policy allows humanitarian imports. *Reality:* Silos full (reserves not released?), borders block imports (contravenes policy?), no price controls implemented. **Likely YES (State blocking/contravening commitments), Go to Q4.**
  *   **Q4 (Silent Famine):** Mortality data is **CLASSIFIED**. Clinics report spike in edema/kwashiorkor? *Procedure requires comparison.* If no official data *and* no clinic data (or clinic data also suppressed/unavailable), **UNKNOWN**. If clinics report spike but official data absent/classified, **LIKELY YES (Discrepancy)**.
      *   *Misfire Point:* **If clinic data is *also* unavailable or ambiguous**, Q4 defaults to **UNKNOWN**. Based *only* on Q1 (Availability=YES) and Q2/Q3 pointing to failure, the procedure *without clear Q4 signal* might lean towards **NATURAL DISASTER / LOGISTICS** (focus on distribution *from* the full silos) as the most *actionable initial response*, requiring **HUMAN OVERRIDE** to escalate to Political Crime track based on Q2/Q3 political red flags (blocked borders, price surge). The procedure misfires by prioritizing the lack of mortality *proof* over clear evidence of state-induced entitlement collapse (Q2/Q3).

  **Where the Procedure Breaks / Judgment Calls (~200 words)**

  1.  **Data Gaps & Manipulation:** The procedure relies on *obtainable* data. If data is *completely* suppressed (no market prices, no clinic reports, laws secret), it stalls. Judgment: How hard to push for data vs. act on inference?
  2.  **Counterfactual Ambiguity:** Laws/policies are often vague, contradictory, or non-existent. Judgment: What constitutes a "commitment"? Is non-action a policy? Does "incapacity" excuse violation? (Q3 Human Check).
  3.  **Intent vs. Capacity:** Q3 flags state action/inaction but doesn't *prove* malice. Blocking imports could be security paranoia (still political crime?) or genuine logistical incapacity (natural disaster?). **Core Judgment Call:** Is the state *unwilling* or *genuinely unable*? The procedure highlights the action/inaction, humans judge intent.
  4.  **"Silent Famine" Threshold:** How big a clinic spike? How credible are "credible reports"? Judgment needed on data reliability and anomaly significance.
  5.  **The "Both" Category:** Often overlaps (e.g., drought + govt hoarding). The procedure flags elements; humans decide if both tracks activate simultaneously.

  **Bottom Line: Can This Actually Work? (~150 words)**

  **Yes, but as a structured forcing function, not an autopilot.** It *can* be operationalized for field staff:

  1.  **It makes Sen concrete:** Translates "entitlements" into observable market, labor, and policy failures.
  2.  **The Audit is Coherent:** Sen focused on *legal* vs. *realized* entitlements. Comparing state commitments to reality directly exposes entitlement failures *caused or permitted* by the state, aligning with Sen's core critique of FAD (Food Availability Decline).
  3.  **It forces critical questions:** It systematically exposes gaps between rhetoric and reality (Q3) and data suppression (Q4).
  4.  **It flags ambiguity:** Clearly shows where judgment is required (Q3/Q4 unclear outcomes).

  **The catch:** It doesn't *eliminate* political judgment – it *structures* and *makes explicit* where that judgment is needed (especially intent vs. capacity). It prevents overlooking entitlement failure when food is physically present (Bengal) and highlights red flags even when mortality proof is hidden (Case 2). It's a robust starting point demanding critical human analysis at key junctions.
