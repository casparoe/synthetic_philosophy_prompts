  I need to create a step-by-step flowchart in words, then apply it to two cases: Bengal 1943 and a hypothetical 2024 scenario. For the second case, the procedure should misfire to show where human judgment is needed. I also need to point out if this approach is confused or if the "counterfactual entitlement audit" conflicts with Sen's framework.

