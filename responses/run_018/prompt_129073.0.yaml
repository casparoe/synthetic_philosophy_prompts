  For the flowchart, I'll structure it as a series of yes/no questions starting with food availability and supply chains. Then, entitlement failures: can people grow, buy, or work for food? Next, the counterfactual audit: are state promises being kept? Then, the silent famine check for data anomalies. Each step should clearly indicate what data to pull, the question to ask, and what constitutes a yes/no. Finally, a step where human judgment takes over if there's ambiguity.

  For Bengal 1943, it's a classic case where war procurement and inflation led to entitlement collapse. Fishermen couldn't sell fish for rice due to price spikes. The counterfactual audit would show the colonial government's policies exacerbating the crisis, pointing to "political crime." The silent famine check isn't needed here since deaths were visible.

  The 2024 hypothetical involves a landlocked region with full silos but blocked imports and skyrocketing prices. The procedure might misfire because the initial steps show food availability (silos), so it could suggest logistics. But the blocked borders and price hikes indicate entitlement failures. The audit might not trigger if laws are vague, and mortality data is classified, so the silent famine check fails. Human override is needed to see the state's role in blocking access.

  Where the procedure breaks: It relies on data that may be missing or manipulated. The counterfactual audit assumes laws exist and are verifiable, which isn't always true. Values judgments come into play when assessing state intent versus capacity. Sen's framework helps but doesn't eliminate the need for context.

  Bottom line: This can work as a field tool because it systematizes Sen's ideas into actionable steps. The counterfactual audit is coherent with Sen by focusing on entitlement failures. It flags red flags even when data is messy, forcing critical questions. However, it's a starting point—human judgment is essential for nuances like state intent. The procedure makes implicit biases explicit, aiding transparency in decisions.

