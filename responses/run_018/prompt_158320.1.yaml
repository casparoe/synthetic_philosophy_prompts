  The rain lashes against the windowpane, blurring the gaslit street below. Inside the cluttered study, the air thick with pipe smoke and the damp scent of old paper, the Antiquarian gestures wildly towards a map dotted with pins. "But they *are* the altarpiece! Provenance traces them, catalogs list them *as one*! Dismemberment doesn't erase their essence, their shared history binds them!"

  The Logician steeples his fingers, eyes cold and analytical. "Shared history is a curator's fiction, a psychological salve for loss. Ten thousand scattered bricks from a demolished cathedral do not compose *a cathedral*. Why should paint on wood be different? Composition requires more than nostalgia or labeling. More even than origin."

  "Then what?" demands the Antiquarian. "Contact? They touched once! Function? Lost! Van Inwagen's life-principle? Absurd for artifacts!"

  "Precisely. Those criteria are static, synchronic snapshots ignoring the *narrative* of being," the Logician counters, leaning forward. "The true principle is **Trajectory Coherence**: objects compose a whole only when their individual spatiotemporal paths are bound into a single, non-diverging causal-historical line that supports unified counterfactual dependence."

  "Trajectory? Like cannonballs?"

  "Like existence itself," the Logician insists. "Consider your Baroque fragments. *Before* destruction, they shared a trajectory. A scratch on panel A altered the light reflecting onto panel B. Humidity warping the frame constrained the wood's movement. Their states were causally entangled; a change to one demanded a counterfactual change in the others – *if* the frame warped *more*, *then* the stress on panel C *would have increased*. One causal-historical line. *One* thing."

  He taps the map. "*Now*? Panel A rests in a climate-controlled vault in London. Panel B hangs in a private gallery in Buenos Aires. Panel C is stored in a warehouse basement in Tokyo. Their causal-historical lines have *diverged irreversibly*. A fire in London annihilates A, yet B and C persist utterly unchanged. The humidity in Tokyo affects only C. No counterfactual bond remains between them. Their paths are separate. Universalism errs by claiming every arbitrary collection is an object – this pile of dust, that leaf, and panel A – ignoring the lack of any unified causal thread. Nihilism errs by denying that *anything* coherently persists through time, ignoring the undeniable unity of the intact altarpiece *during* its coherent trajectory."

  The Antiquarian scoffs. "So unity flickers out with dispersal? That's temporal bias! Privileging the present state over their profound shared past! It’s psychological – you *feel* they are separate now."

  "Not bias," the Logician retorts sharply. "But ontological rigor. The *past* unity was real *because* the trajectory was coherent *then*. The trajectory *itself* is the enduring reality. The divergence isn't merely perceived; it's physically demonstrable through the *absence* of counterfactual dependence. Your 'shared past' is a historical fact *about* the fragments, not a present ontological glue binding them *as* a single entity. The curator's label is psychology, projecting unity onto independent existences. The coherence *was* the unity; when it shattered, the *one thing* ceased to be, leaving only causally isolated relics sharing a common origin story – not a shared existence."

  He gestures at the storm outside. "See the raindrops? Two collide on the window, merging – their trajectories cohere, forming one droplet with unified counterfactuals: freeze the pane, and *they* freeze *together*. Moments later, they split, paths diverging down the glass. The *one* droplet ceases; *two* distinct entities begin. No temporal bias, only the physical reality of causal entanglement and its rupture. Your fragments are like those diverging streams. The altarpiece is gone. Only its ghosts remain, haunting separate corners of the world."

  The Antiquarian stares at the scattered pins, the rain tracing paths like fractured histories on the glass. The map no longer feels like a record of a whole, but a chart of dissolution.

  \answer{Trajectory Coherentism}
