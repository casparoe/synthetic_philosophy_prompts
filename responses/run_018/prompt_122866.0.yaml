answer: |-
  ### Exam Question: Death in Damascus and Rational Choice (20 Marks)

  **Scenario:** An agent is in Damascus tonight, and Death is coming for her. She must choose to either stay in Damascus or travel to Aleppo. Death is an infallible predictor: his location already matches her eventual choice (if she stays, he is in Damascus; if she goes, he is in Aleppo). The agent cannot causally influence Death’s prediction; her act perfectly indicates his location. Let \( p \) be her subjective probability that she will stay in Damascus. Because Death is infallible, \( p \) is also her probability that Death is in Damascus. The utilities are:  
  - Stay & Death in Damascus: Die in Damascus (Utility = 0)  
  - Stay & Death in Aleppo: Survive in Damascus (Utility = 10)  
  - Go & Death in Damascus: Survive in Aleppo with journey cost (Utility = 9)  
  - Go & Death in Aleppo: Die in Aleppo after wasted journey (Utility = -1)  

  **Your Tasks:**  
  1. **Compute Recommendations:** Using the decision matrix below, calculate the expected utility (EU) of staying and going for both **Evidential Decision Theory (EDT)** and **Causal Decision Theory (CDT)**. Show that both theories recommend the *same pure act* in this case, contrary to typical Newcomb-style problems.  
  2. **Decision Instability:** Explain why neither pure act is **ratifiable**. Define ratifiability (an act maximizes EU *conditional on the agent believing she will perform it*). Trace how increasing credence \( p \) that the agent will stay affects the EU calculations, showing that becoming certain of either act makes the alternative appear better. Discuss how this challenges EDT’s slogan: "Do what you would most want to learn you will do."  
  3. **Mixed Strategy:** Evaluate whether deliberately randomizing her choice (e.g., flipping a fair quantum coin to decide) could be rational. Could this yield higher EU than pure acts? If randomization is the only stable response (making her act unpredictable to Death), what does this imply about decision theory?  

  **Decision Matrix:**  
  | Agent \ Death | Damascus (\( D \)) | Aleppo (\( \neg D \)) |  
  |---------------|--------------------|---------------------|  
  | **Stay (\( S \))** | 0                 | 10                  |  
  | **Go (\( G \))**   | 9                 | -1                  |  

  *(Write your answer in essay form. 90 minutes total.)*

  ---

  ### Model Answer (≈700 words)  

  **1. EDT and CDT Recommendations**  
  The decision matrix above defines the utilities. EDT uses *conditional probabilities* for EU, while CDT uses *counterfactual probabilities* (probabilities under the subjunctive supposition of the act, independent of predictors). Death’s infallibility implies:  
  - \( P(D \mid S) = 1 \), \( P(\neg D \mid S) = 0 \)  
  - \( P(D \mid G) = 0 \), \( P(\neg D \mid G) = 1 \)  

  **EDT Calculations:**  
  - \( EU_{EDT}(S) = U(S, D) \cdot P(D \mid S) + U(S, \neg D) \cdot P(\neg D \mid S) = (0 \cdot 1) + (10 \cdot 0) = 0 \)  
  - \( EU_{EDT}(G) = U(G, D) \cdot P(D \mid G) + U(G, \neg D) \cdot P(\neg D \mid G) = (9 \cdot 0) + (-1 \cdot 1) = -1 \)  
  EDT recommends **Staying** (EU 0 > -1).  

  **CDT Calculations:**  
  CDT uses counterfactuals: \( P(\text{Death in Damascus} \mid \mid S) \) is the probability of \( D \) *if the agent were to choose* \( S \), which remains \( p \) (since Death’s prediction is fixed and causally independent). Similarly, \( P(D \mid \mid G) = p \).  
  - \( EU_{CDT}(S) = U(S, D) \cdot P(D \mid \mid S) + U(S, \neg D) \cdot P(\neg D \mid \mid S) = (0 \cdot p) + (10 \cdot (1 - p)) = 10(1 - p) \)  
  - \( EU_{CDT}(G) = U(G, D) \cdot P(D \mid \mid G) + U(G, \neg D) \cdot P(\neg D \mid \mid G) = (9 \cdot p) + (-1 \cdot (1 - p)) = 9p - 1 + p = 10p - 1 \)  
  For CDT to recommend \( S \): \( 10(1 - p) > 10p - 1 \) → \( 10 - 10p > 10p - 1 \) → \( 11 > 20p \) → \( p < 0.55 \). Since \( p \) is her credence *before* commitment, we compute the *ex-ante* EU at \( p \). Crucially, **both theories converge on Staying** when \( p \) is typical (e.g., \( p = 0.5 \)):  
  - \( EU_{CDT}(S) = 10(1 - 0.5) = 5 \)  
  - \( EU_{CDT}(G) = 10(0.5) - 1 = 4 \) → CDT also recommends **Staying** (5 > 4). Thus, unlike Newcomb, both agree.  

  **2. Decision Instability and Ratifiability**  
  An act is **ratifiable** iff it maximizes EU *conditional on the agent believing she will perform it*. Here, neither act is ratifiable due to **instability**:  
  - **If she believes she will Stay** (\( p \approx 1 \)):  
    - \( EU_{CDT}(S) = 10(1 - 1) = 0 \)  
    - \( EU_{CDT}(G) = 10(1) - 1 = 9 \)  
    → *Going* now seems better (9 > 0).  
  - **If she believes she will Go** (\( p \approx 0 \)):  
    - \( EU_{CDT}(S) = 10(1 - 0) = 10 \)  
    - \( EU_{CDT}(G) = 10(0) - 1 = -1 \)  
    → *Staying* now seems better (10 > -1).  

  **Mechanism:** As credence \( p \) increases, the EU of Staying (\( 10 - 10p \)) decreases because Death is more likely in Damascus, while the EU of Going (\( 10p - 1 \)) increases (Figure 1). At extremes, each act becomes self-undermining: certainty of \( S \) implies \( P(D) = 1 \), making \( G \) appealing, and vice versa. No pure act "sticks" as optimal when believed.  

  **Challenge to EDT:** EDT’s slogan—"Do what you’d most want to learn you’ll do"—fails. Learning "I will Stay" implies Death is in Damascus (EU 0), making you wish you learned "I will Go" (which would imply Death in Aleppo and EU 10 for Staying!). But learning "I will Go" implies Death in Aleppo (EU -1 for Going), making Staying preferable. Thus, no act is desirable to learn you’ll perform.  

  **3. Mixed Strategy Evaluation**  
  A **randomized strategy** (e.g., flip a fair coin: Stay if heads, Go if tails) makes the agent’s choice unpredictable to Death. Since Death cannot predict *true* randomness, \( P(D) = P(S) = 0.5 \) (the coin’s objective chance).  

  **EU of Randomization:**  
  - Survival requires mismatching Death. Probability of mismatch:  
    - \( P(S \text{ and } \neg D) = P(S) \cdot P(\neg D) = 0.5 \cdot 0.5 = 0.25 \) (Utility 10)  
    - \( P(G \text{ and } D) = P(G) \cdot P(D) = 0.5 \cdot 0.5 = 0.25 \) (Utility 9)  
    - Total EU = \( (0.25 \cdot 10) + (0.25 \cdot 9) = 2.5 + 2.25 = 4.75 \)  
  - Death occurs with \( P(\text{match}) = 0.5 \) (Utility 0 or -1; EU contribution 0).  
  **EU = 4.75**, higher than pure Staying (EU 5 for CDT at p=0.5? Wait: no, pure Staying at p=0.5 has CDT EU 5, but randomization’s EU is 4.75, which is lower? Let me correct.  

  *Correction*: At \( p = 0.5 \):  
  - Pure Stay: \( EU_{CDT} = 10(1 - 0.5) = 5 \)  
  - Pure Go: \( EU_{CDT} = 10(0.5) - 1 = 4 \)  
  - Randomization: EU is indeed \( 0.25 \times 10 + 0.25 \times 9 + 0.25 \times 0 + 0.25 \times (-1) = 2.5 + 2.25 + 0 - 0.25 = 4.5 \). This is *less* than pure Staying’s 5.  

  **Survival Probability:** Pure acts guarantee death if chosen (since Death predicts perfectly). Randomization gives 50% survival chance (when act ≠ Death’s location), versus 0% for pure acts.  

  **Conceptual Difficulties:**  
  - **Act vs. Strategy**: Decision theories typically recommend *acts*, not randomization *policies*. Can "flip a coin" be an "act"?  
  - **Rationality Dilution**: Deliberate randomization might seem irrational—it cedes control to chance, violating ideal rationality (where agents deterministically maximize EU).  
  - **Stability Argument**: If randomization is the only stable solution (it *is* ratifiable: EU=4.5 regardless of belief), it suggests decision theories must sometimes recommend non-pure strategies to handle predictors, challenging standard CDT/EDT frameworks.  

  **Conclusion**: While randomization increases survival chance (0% → 50%), its ex-ante EU (4.5) is lower than pure Staying’s EU (5) at \( p = 0.5 \). Yet instability makes pure acts self-defeating upon commitment. This tension highlights deeper problems: ratifiability may be essential, and predictors may force us to consider mixed strategies as rationally obligatory, even if counterintuitive.  

  ---

  ### Marking Scheme (20 Marks Total)  

  | **Criteria**                                                                 | **Marks** | **Common Errors**                                                                 |
  |-----------------------------------------------------------------------------|-----------|-------------------------------------------------------------------------------|
  | **1. Decision Matrix** (Correctly stated)                                     | 2         | Omitting utilities/acts; misassigning values (e.g., swapping Death locations). |
  | **2. EDT Calculation** (EU(S)=0, EU(G)=−1; uses conditional probabilities)    | 2         | Using \( p \) in EDT (not purely conditional); miscalculating EU(G) as >0.    |
  | **3. CDT Calculation** (EU(S)=10(1−p), EU(G)=10p−1; uses counterfactuals)     | 2         | Confusing CDT with EDT; ignoring \( p \)’s role in counterfactuals.           |
  | **4. Convergence** (Both recommend Staying for typical p, e.g., p=0.5)        | 1         | Claiming disagreement (like Newcomb); missing p-sensitivity in CDT.          |
  | **5. Instability Mechanism** (Traces EU changes *as p varies*; shows crossing at p=0.55) | 3         | Stating instability without math; not linking \( p \) to Death’s location.    |
  | **6. Ratifiability Definition & Failure** (Not maximizing EU when believed)   | 2         | Defining ratifiability incorrectly; not computing EU at p=0/p=1.              |
  | **7. EDT Slogan Critique** (Shows no act is desirable to learn you’ll do)     | 1         | Superficial treatment; not linking to Death’s inference.                     |
  | **8. Mixed Strategy EU** (Correct EU=4.5; survival chance=0.5)                | 2         | Miscalculating probabilities (e.g., ignoring independence); EU >5.           |
  | **9. Mixed Strategy Assessment** (Notes stability, act/policy dilemma, rationality concern) | 3         | Only stating "it works"; ignoring conceptual problems.                       |
  | **10. Clarity & Structure** (Logical flow, no major omissions)                | 2         | Disorganized calculations; skipping parts of the question.                   |

  **Grade Boundaries**:  
  - **A (17–20)**: Articulates instability mechanism (Point 5) precisely; substantive evaluation of mixed strategies (Point 9).  
  - **B (13–16)**: Correct EDT/CDT calculations and convergence; identifies instability but lacks mechanistic detail; mixed strategy analysis superficial.  
  - **C (9–12)**: Major errors in EDT/CDT/matrix; instability mentioned but not demonstrated; mixed strategy incomplete.  
  - **D (5–8)**: Minimal understanding; fails to compute EU correctly.  
  - **E (0–4)**: Irrelevant or gravely flawed.  

  ---  
  *End of Exam Question and Materials*
