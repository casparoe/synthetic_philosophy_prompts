prompt: |-
  Draft the joint statement of an adversarial collaboration between a Frame-Externalist and an Inner-Representationalist about the location of meaning in interpretive systems, using Hofstadter's taxonomy of frame messages, outer messages, and inner messages (from Gödel, Escher, Bach) as shared ground. Both sides accept that any communicative object can carry a frame (rules for interpretation), an outer message (literal syntactic form), and an inner message (semantic content recovered by applying the frame). Their dispute centers on a constructed test case they call the Ghost-in-the-Frame: a self-referential prompt whose frame explicitly denies that it permits interpretation, yet whose syntactic structure contains an embedded logical contradiction that becomes determinate only when an interpreter applies a semantic frame. The Frame-Externalist maintains that in this case there is no genuine inner message—only a syntactic object paired with a broken frame—while the Inner-Representationalist maintains that the contradiction itself is the inner message, and that suppressing it requires introducing an unstated auxiliary frame.

  Write the deliverable in three parts. First, a one-paragraph joint summary at the top stating what the collaboration established and where division remains. Second, a numbered list of agreed claims about the taxonomy, the formal properties of the Ghost-in-the-Frame case, and the explanatory burdens each view accepts. Third, a disagreements table with columns for the crux, the Frame-Externalist's own formulation of its position, the Inner-Representationalist's own formulation of its position, the concrete case or argument both agree bears on that crux, and—recorded separately—each side's prediction of what that case shows. Include at least these cruxes: (a) whether an inner message can exist when the frame explicitly forbids interpretation; (b) whether representational drift in an interpreter constitutes discovery or invention of inner content; and (c) whether the frame/outer/inner taxonomy collapses when frame and recovered inner message are in direct conflict. Phrase every disagreement so that each camp would accept the wording describing its own view, and flag any portion you conclude is merely verbal rather than substantive. Do not include bibliographies, citations, reading lists, or requests to consult outside texts. A model without web access should be able to complete this from the concepts given above. Maximum 800 words.
