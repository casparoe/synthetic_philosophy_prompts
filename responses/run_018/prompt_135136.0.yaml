prompt: |-
  I'm the audit lead for our city's behavorial-policy unit — every week I get proposals for nudges like opt-out organ donation, calorie-label mandates, retirement savings defaults, that kind of thing. Right now I'm just winging it with a gut check about autonomy, but I need something reusable my team can actually run in about fifteen minutes before I sign off. I sketched out a framework with a colleague that splits interventions into two kinds: Type A changes the choice environment — reorder options, change defaults, keep the full menu technically available — while Type B shifts how preferences themselves get formed or weighted, like framing that makes a value feel illegitimate, hiding options behind social stigma, or using emotional priming so people want different things than they did before. The core idea is that Type B needs stricter justification because it doesn't just steer revealed preferences; it risks constructing them, and that asymmetry should drive the audit.

  Please turn this into a step-by-step decision procedure: ordered questions, what counts as a sufficient answer to each, where the flow stops with a hard no, and where it stops and says "this is now a values call, escalate to the ethics board." Apply it to three proposals: (1) an opt-out pension enrollment with a 3% employer match, (2) a school-cafeteria redesign that puts junk food behind a counter with a five-minute wait but technically allows it, and (3) a smoking-cessation poster campaign that frames continued smoking as "letting your family down" — I actually like this one, but I want the procedure to either reject it or escalate it in a way that annoys me. Make sure you flag where the Type A / Type B line gets blurry — for instance when a default also sends a social signal — and be explicit about what the procedure flat-out can't settle. Don't ask me to cite philosophers or build a bibliography; I just need the checklist, the worked cases, and an honest note about where judgment can't be eliminated.
reasoning: |-
  Okay, the user is an audit lead for a city's behavioral policy unit. They need a practical, reusable decision procedure to evaluate policy proposals quickly—specifically within fifteen minutes. Their current method relies on gut feeling about autonomy, which isn't scalable or consistent. They've developed a framework distinguishing between Type A interventions (changing the choice environment) and Type B interventions (shifting preference formation), with the latter requiring stricter scrutiny. 

  The user wants a step-by-step checklist with clear stopping points—hard rejections or escalations to an ethics board. They also want three real-world examples applied to the framework: pension enrollment defaults, cafeteria redesigns, and smoking cessation campaigns. Crucially, they want honesty about where the framework can't eliminate judgment calls, especially around blurred Type A/B lines. 

  Hmm, their tone is pragmatic and slightly impatient—no philosophy citations, no bibliographies, just actionable steps. They're clearly time-pressed and need something their team can operationalize immediately. The phrase "annoy me" in the smoking cessation example is telling; they're testing the framework's rigor against their own biases. 

  First, I'll structure the decision tree around their Type A/B distinction. Key questions should isolate: (1) whether options are technically accessible, (2) whether preference construction is manipulated. But I need to flag gray zones upfront—like defaults carrying social signals. 

  For the worked examples: 
  - The pension opt-out is clearly Type A (defaults preserve choice). 
  - The cafeteria redesign... putting junk food behind a counter is Type A on paper, but the friction might cross into preference-shaping (B territory) if the wait implies stigma. 
  - The smoking poster? Textbook Type B—it weaponizes guilt to reconstruct preferences. Should escalate even if the user likes it. 

  The framework must explicitly call out where it can't decide: e.g., when "minor" friction psychologically blocks choices, or when defaults inherit normative weight. These become ethics-board referrals. 

  Finally, the disclaimer: Judgment is unavoidable when interventions hybridize mechanics and psychology. The checklist can't resolve value conflicts—only make them visible.
answer: |-
  Here's a streamlined 15-minute audit checklist based on your Type A/B framework, designed for practical use. It prioritizes identifying Type B interventions and escalation points.

  **Behavioral Policy Audit Checklist (15-Minute Version)**

  1.  **Q1: Does the intervention physically or procedurally restrict access to any choice?**
      *   *Sufficient Answer:* If NO, proceed to Q2. If YES, immediate **HARD NO**. (Examples: Removing an option entirely, adding legal barriers, requiring onerous documentation).
      *   *Rationale:* Physical/procedural blocks violate core autonomy more severely than psychological nudges. Type A/B distinction becomes irrelevant; it's likely unacceptable paternalism.

  2.  **Q2: Does the intervention primarily change the *ease* or *salience* of choices without altering the options themselves?**
      *   *Sufficient Answer:* If YES, **Likely Type A** – proceed to Q3A. If NO, proceed to Q2B.
      *   *Rationale:* Focuses on classic choice architecture: defaults, ordering, simplification, making information clearer. The "full menu" remains technically accessible with reasonable effort.

  3.  **Q2B: Does the intervention intentionally influence *how people feel* about an option or *change the values/weights* they apply to their decision?**
      *   *Sufficient Answer:* If YES, **Likely Type B** – proceed to Q3B. If NO or UNCLEAR, proceed to Q3C (Blurry Zone).
      *   *Rationale:* Targets preference *formation* or *weighting*: emotional priming, altering perceived social norms, framing that triggers specific value associations (guilt, shame, illegitimacy), stigma.

  4.  **Q3A (Type A Check): Could the *practical difficulty* introduced function like a de facto restriction for a significant portion of the target population? (Blurry Zone Flag)**
      *   *Sufficient Answer:* If YES (e.g., requires excessive time, specialized knowledge, overcoming significant stigma implied by the structure), **ESCALATE TO ETHICS BOARD**. If NO, **PROCEED TO RISK/BENEFIT** (Briefly assess proportionality, evidence base).
      *   *Rationale:* Even "technically available" options can be practically inaccessible due to friction. This is where Type A bleeds into Type B territory and requires deeper ethical weighing.

  5.  **Q3B (Type B Check): Does the intervention leverage negative social emotions (shame, guilt, ostracism) or frame a personal choice as violating a core social obligation?**
      *   *Sufficient Answer:* If YES, **ESCALATE TO ETHICS BOARD**. If NO, proceed to Q4B.
      *   *Rationale:* Manipulating strong negative social emotions or reframing personal choices as social failures is particularly autonomy-invasive and ethically charged.

  6.  **Q4B (Type B Check): Is there strong, specific evidence that:**
      *   a) The influenced preference/weighting aligns with the individual's *own* long-term, reflective goals (not just assumed societal benefit)?
      *   b) The benefit significantly outweighs the autonomy intrusion?
      *   c) Less manipulative (Type A) approaches are demonstrably ineffective?
      *   *Sufficient Answer:* If strong YES to ALL THREE, **PROCEED WITH HIGH SCRUTINY** (Document justification thoroughly). If ANY NO or UNCERTAIN, **ESCALATE TO ETHICS BOARD**.
      *   *Rationale:* Type B requires a much higher burden of justification – it must demonstrably serve the individual's own interests in a way lesser interventions cannot.

  7.  **Q3C (Blurry Zone - Defaults/Signals): Does the Type A mechanism (e.g., a default) carry a strong *implied endorsement* or *social norm signal* likely to significantly alter how people *value* the options?**
      *   *Sufficient Answer:* If YES (e.g., default implies "this is what good/smart people do"), **TREAT AS TYPE B** and go to Q3B/Q4B. If NO or MINIMAL, **TREAT AS TYPE A** and go to Q3A.
      *   *Rationale:* Defaults often carry normative weight beyond mere ease. If this signaling effect is a primary *mechanism* of change, it shifts towards preference construction (Type B).

  **Where Judgment Can't Be Eliminated & What the Procedure Can't Settle:**

  *   **"Reasonable Effort" (Q3A):** Defining acceptable friction is inherently contextual and subjective.
  *   **"Significant Portion" (Q3A):** Judging what constitutes a significant group disadvantaged by friction.
  *   **"Strong Evidence" (Q4B):** Weighing evidence quality and sufficiency involves interpretation.
  *   **"Aligns with Own Goals" (Q4Ba):** Determining someone's "true" preferences is philosophically fraught; this relies on proxies like long-term health/financial security vs. immediate gratification, but remains contestable.
  *   **Defining "Manipulation":** The line between informing/framing and manipulating is grey. The procedure flags common red flags (negative emotions, social obligation framing) but can't draw a bright line.
  *   **Fundamental Value Conflicts:** The checklist identifies *potential* autonomy intrusions and escalates them, but **cannot resolve** deep disagreements about paternalism, individualism vs. collectivism, or the role of government in shaping values. That's *exactly* what the Ethics Board is for.

  ---

  **Worked Examples:**

  1.  **Opt-Out Pension Enrollment (3% Match)**
      *   Q1: NO (Can still opt-out).
      *   Q2: YES (Changes ease/salience via default).
      *   **Likely Type A** -> Q3A.
      *   Q3A: NO (Opting out is typically a simple form/click). Minimal friction.
      *   **PROCEED TO RISK/BENEFIT**. (High benefit: retirement security, free money; Low risk/cost; Strong evidence base; Clear alignment with typical long-term financial goals). **APPROVAL LIKELY.**

  2.  **School Cafeteria Junk Food Behind Counter (5-min wait)**
      *   Q1: NO (Technically available).
      *   Q2: YES (Changes ease/salience via friction).
      *   **Likely Type A** -> Q3A.
      *   Q3A: **YES/UNCLEAR** (5-min wait during short lunch period could be a *de facto* barrier for many students. Also, placement behind counter signals undesirability/stigma - **Blurry Zone**). Go to Q3C.
      *   Q3C: YES (Placement behind counter strongly implies "this is bad/you shouldn't want this"). **TREAT AS TYPE B** -> Q3B.
      *   Q3B: NO (Doesn't *directly* use shame/guilt/family obligation framing).
      *   Q4B:
          *   a) UNCERTAIN (Does reducing *impulse* junk food access align with students' *own* long-term health goals? Probably, but complex with minors/agency).
          *   b) Maybe (Benefit potential, but evidence for *this specific* friction?).
          *   c) UNCERTAIN (Were less restrictive Type A options tried? e.g., better placement of healthy options?).
      *   **ESCALATE TO ETHICS BOARD.** (Due to Blurry Zone + Q4B uncertainties, especially regarding minors).

  3.  **Smoking Cessation Poster: "Don't Let Your Family Down"**
      *   Q1: NO (No physical barrier).
      *   Q2: NO (Doesn't change ease/salience of smoking).
      *   Q2B: **YES** (Explicitly frames smoking as violating core social obligation (family)).
      *   **Likely Type B** -> Q3B.
      *   Q3B: **YES** (Directly leverages guilt/shame by framing it as letting family down).
      *   **ESCALATE TO ETHICS BOARD.** (Triggers the strong negative emotion/social obligation red flag immediately, regardless of good intentions or potential benefit. Requires explicit ethical weighing of using guilt as a policy tool).

  **Key Outputs:**

  *   **HARD NO:** Only for physical/procedural restrictions (Q1).
  *   **APPROVAL LIKELY:** Clear Type A with minimal friction/strong justification (Passes Q1, Q2, Q3A).
  *   **PROCEED WITH HIGH SCRUTINY:** Rare for Type B – must pass Q3B (No strong negative emotions) AND Q4B (Strong YES on all 3 justifications).
  *   **ESCALATE TO ETHICS BOARD:** Most common for Blurry Zone cases (Q3A Yes, Q3C Yes), Type B using negative emotions/social obligation (Q3B Yes), or Type B lacking strong justification (Q4B No/Uncertain). *This is where your "annoying but necessary" smoking poster escalation happens.*
  *   **CAN'T SETTLE:** Fundamental value conflicts, precise definitions of manipulation/reasonable effort, ultimate proof of aligning with "true" preferences. These *must* go to the Ethics Board.

  This procedure forces explicit identification of potential preference manipulation (Type B) and the ethically blurry aspects of friction/normative signaling in Type A, providing clear off-ramps to the Ethics Board where judgment beyond the checklist is essential. It prioritizes speed by focusing on mechanism and red flags.
