  Your variant is a fascinating refinement of Williams' critique, and it **doesn't have a single, widely accepted name in the literature**, though it touches on several key concepts. It's distinct from both the "one thought tooo many" problem and simple overdetermination. Here's a breakdown:

  1.  **Core Distinction from Williams' "One Thought Too Many" (OTT):**
      *   **OTT:** The husband *needs* the universal principle ("family comes first") to *justify* or *motivate* saving his wife *instead of* acting purely out of direct love/commitment. The principle *replaces* or *corrupts* the direct motive.
      *   **Your Variant:** The direct commitment (love, loyalty) is the **sole motivator and sufficient reason**. The universal principle ("one should care for sick friends," "loyalty is good") is **causally inert**. It doesn't motivate, justify, or replace the primary motive. It's acknowledged as *true* and *compatible*, but irrelevant to the *why* of the action. It's like a silent observer, not a participant. The act retains its "integrity" because it springs purely from the personal commitment.

  2.  **Distinction from Simple Overdetermination:**
      *   **Overdetermination:** Multiple motives (e.g., love *and* duty) are *each independently sufficient* to cause the action. Both are active causal forces converging on the same outcome.
      *   **Your Variant:** Only **one motive (the personal commitment) is causally active**. The universal principle is present but *not* a motivating force. It's passive, a background belief. It doesn't contribute to *causing* the action; it merely *accords* with it.

  3.  **What to Call It? Potential Labels & Concepts:**
      *   **Moral Shadowing / Redundant Moral Accord:** This captures the passive, non-motivating presence of the principle that merely "shadows" the action, confirming its moral permissibility or alignment without driving it. "Redundant" emphasizes its causal superfluity.
      *   **Motivationally Inert Moral Belief:** Highlights the key feature: the belief is held, it's moral, but it plays no role in generating the action.
      *   **Integrity-Preserving Moral Assurance:** Focuses on the *function* for the agent. Holding the principle might provide *assurance* that their deeply personal act isn't *immoral*, without letting that assurance become the motive, thus preserving the act's integrity/purity of motive.
      *   **Adjacent Concepts:**
          *   **Williams' "Ground Projects":** The direct commitment *is* the ground project. The universal principle is external to it but doesn't conflict.
          *   **Susan Wolf's "Moral Saints":** Your agent isn't a moral saint (driven solely by duty), but holds a moral view while being driven by non-moral (or personally moral) commitments. It shows how non-moral motives can coexist with moral beliefs without conflict *in this specific way*.
          *   **Michael Stocker's "Schizophrenia of Modern Ethical Theories":** Stocker argues theories demanding moral motivation alienate us from goods like love. Your variant shows an agent *avoiding* this alienation by keeping the moral principle inert, allowing the good (love/loyalty) to motivate directly.

  4.  **Boundary Conditions for Distinguishing It:**
      This setup is distinct if the following conditions hold:
      *   **Causal Primacy:** The personal commitment (love, loyalty) is the *necessary and sufficient* motivating cause of the action.
      *   **Motivational Inertia of Principle:** The universal moral principle plays **no motivational role whatsoever**. It does not strengthen resolve, alleviate doubt, provide secondary satisfaction, or serve as a fallback if the personal commitment wavers *in this instance*.
      *   **Non-Justificatory Role (in the moment):** The agent is not using the principle to *justify the act to themselves or others* as it happens. The justification is simply the commitment itself ("Because it's my friend/project"). The principle is a background belief, not a justificatory tool *for this act*.
      *   **Phenomenological Purity:** The agent *experiences* the act as flowing directly from the personal commitment without needing or referencing the principle. The "texture" might include awareness of the principle's accord, but it doesn't feel like part of the *reason for acting*.
      *   **Contingency:** The agent would act *identically* even if they temporarily suspended belief in the universal principle. The principle doesn't alter the action's occurrence or character.

  5.  **How it Differs from Ordinary Moral Self-Assurance:**
      *   **Ordinary Self-Assurance:** Often involves *actively* reflecting on the morality of the act *as part of* the commitment. "I'm doing this because I love them, *and it's also the right thing to do*." Here, the moral belief can reinforce or bolster the primary motive.
      *   **Your Variant ("Shadowing"):** The moral belief is **passive and causally disconnected** from the motive. Assurance isn't sought or needed *from the principle*; the commitment is self-assuring. The principle's truth is acknowledged but irrelevant to the motivational engine. The assurance comes entirely from the strength of the personal commitment itself, not from its alignment with the external principle.

  **Conclusion:**

  You've identified a subtle and philosophically interesting position: **motivationally inert moral accord** or **moral shadowing**. It avoids Williams' OTT objection because the direct commitment reigns supreme, uncorrupted by needing the principle for motivation or justification. It avoids simple overdetermination because only one motive is active. It differs from self-assurance by keeping the moral principle entirely passive and non-reinforcing in the motivational economy of the specific act.

  This setup highlights a way agents can hold universal moral views while being authentically and solely motivated by deep personal commitments, preserving the integrity of those commitments without rejecting morality. While not a major named doctrine, it's a valid and insightful refinement within the discourse on motives, integrity, and the relationship between the personal and the moral.
