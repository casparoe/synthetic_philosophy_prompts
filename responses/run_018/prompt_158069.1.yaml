  **Root Commitment**: Fundamental physical entities possess phenomenal properties (i.e., basic consciousness or experience).  

  **Diagnostic Nodes**:  
  1. **Macro-Subject Binding**: Quantum/field coherence yields a unified cosmic subject (not merely dispersed micro-subjects).  
  2. **Valence**: Phenomenal properties include intrinsic negative affect (suffering), not just structural/cognitive features.  
  3. **Decoherence Threshold**: Thermal noise or Planck-scale decoherence sets a moral-status cutoff (i.e., only sufficiently coherent systems matter ethically).  
  4. **Intervention Ethics**: Altering physical conditions to reduce suffering (e.g., minimizing entropy to preserve coherence) is:  
     - (4a) *Required* (a moral duty),  
     - (4b) *Permitted* (optional but allowable), or  
