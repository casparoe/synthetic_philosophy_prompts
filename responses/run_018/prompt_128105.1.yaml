prompt: |-
  Write a villanelle on Nyāya epistemology and the four pramāṇas—pratyakṣa, anumāna, upamāna, and śabda—structured so that its form enacts the orthodox refusal to grant anupalabdhi (non-apprehension) the status of an independent fifth source of valid cognition. Use two refrains that alternate through the five tercets and converge in the final quatrain. Refrain A should voice the Nyāya position that absence is never directly given but is always mediated through a present perceptual failure (for instance, “The bare floor only shows the missing pot”). Refrain B should voice the rival claim—advanced in schools such as Advaita Vedānta—that absence is immediately cognized without mediation (for instance, “The empty room knows its own emptiness”). Map each of the five tercets, in order, onto one member of the classical Nyāya five-member syllogism: pratijñā (the thesis that only four sources yield pramā), hetu (the reason that absence lacks an independent object-correlate), udāharaṇa (the illustrative case of seeing bare ground), upanaya (the application of that case to all absence-claims), and nigamana (the conclusion that anupalabdhi is reducible to pratyakṣa). Within this scaffolding, let the first four tercets each invoke one of the four recognized pramāṇas—perception in the first, inference in the second, comparison in the third, testimony in the fourth—so that the syllogistic defense of four-source epistemology is carried out through the very sources it affirms. The rhyme scheme should follow the standard villanelle pattern (A1bA2; abA1; abA2; abA1; abA2; abA1A2), with the refrains passing each other until the closing lines place them side by side without synthesis. The poem should be philosophically precise enough that a reader familiar with Indian epistemology recognizes the specific debate over whether prāmāṇya is svataḥ or parataḥ and the auxiliary role of tarka, yet it should remain coherent verse for someone who has never encountered Nyāya.
reasoning: |-
  Hmm, the user wants me to write a villanelle poem about Nyāya epistemology and the four pramāṇas (sources of valid knowledge), specifically structured to reject anupalabdhi (non-apprehension) as a fifth source. They want a very specific structure that matches the classical Nyāya five-member syllogism while incorporating the four recognized pramāṇas.

  I need to understand the core philosophical debate here. Nyāya epistemology recognizes only four valid sources of knowledge: pratyakṣa (perception), anumāna (inference), upamāna (comparison), and śabda (testimony/verbal testimony). They reject anupalabdhi (non-apprehension or absence) as an independent source, arguing that absence is known through perception of something else that should be there but isn't. This contrasts with schools like Advaita Vedānta which grant anupalabdhi independent status.

  The poem needs two alternating refrains: Refrain A expressing Nyāya's position that absence is mediated (e.g., "The bare floor only shows the missing pot"), and Refrain B expressing the rival view that absence is immediate (e.g., "The empty room knows its own emptiness"). These refrains will alternate through five tercets and converge in the final quatrain without synthesis.

  I need to map the five tercets to the Nyāya syllogism: pratijñā (thesis), hetu (reason), udāharaṇa (example), upanaya (application), and nigamana (conclusion). Each of the first four tercets should also represent one pramāṇa: perception in the first, inference in the second, comparison in the third, and testimony in the fourth.

  The rhyme scheme must follow standard villanelle pattern: A1bA2 / abA1 / abA2 / abA1 / abA2 / abA1A2. The poem should be philosophically precise enough for someone familiar with Indian epistemology to recognize debates about svataḥ vs. parataḥ pramāṇya (intrinsic vs. extrinsic validity) and tarka (suppositional reasoning), while remaining accessible to someone new to Nyāya.

  I'll need to craft language that balances poetic beauty with philosophical accuracy. For the syllogism parts: pratijñā will state the four-source thesis; hetu will argue absence has no object; udāharaṇa will give the pot/floor example; upanaya will generalize this; nigamana will conclude anupalabdhi reduces to perception. The pramāṇa integration should feel organic - perhaps perception for the thesis, inference for the reason, comparison for the example, testimony for the application.

  I'll be careful to maintain the refrains' exact wording while developing new content in each tercet. The final quatrain will juxtapose both refrains without reconciliation, enacting the philosophical stalemate. I'll use precise terminology like "pramāṇa" and "anupalabdhi" but provide enough context for unfamiliar readers.
answer: |-
  ## Villanelle for Four Pramāṇas Alone

  The thesis stands: *pratyakṣa*, *anumāna*,
  *Upamāna*, *śabda* – four gates stand to truth,
  **The bare floor only shows the missing pot.**
  *Pramāṇa*'s scope, defined by wise Nyāya,
  Finds *pramā* where these four affirm uncouth –
  The rival mind seeks absence as a fifth way:
  **The empty room knows its own emptiness.**
  Inference proves why absence lacks its own ground,
  No *viṣaya* distinct where things are not found;
  The reason holds: no object for the miss –
  **The bare floor only shows the missing pot.**
  By *upamāna*, likeness makes meaning sound –
  As knowing 'cow' through 'gavaya' is bound,
  So seeing *this* bare space where jar was sought
  Denies a grasp where nothingness is caught:
  **The empty room knows its own emptiness.**
  *Śabda* declares the Vedic axiom's might:
  "Four sources grasp the real, within their light!"
  Applied to all, this rule leaves no arrest,
  No separate proof for what the world suggests.
  **The bare floor only shows the missing pot.**
  Conclusion drawn: *anupalabdhi*'s claim
  Is perception's own failure, bearing the name
  Of absence known *parataḥ*, not *svataḥ*,
  A mediated lack, not revelation's path.
  **The empty room knows its own emptiness.**
  Let *tarka* probe – still, absence won't be taught
  Save through the seen, where presence comes to naught.
  **The bare floor only shows the missing pot,**
  **The empty room knows its own emptiness.**

  ---

  **Stanza-by-Stanza Breakdown:**

  1.  **Tercet 1 (Pratijñā - Thesis & Pratyakṣa - Perception):** States the core thesis: only four *pramāṇas* yield valid knowledge (*pramā*). Introduces Refrain A (Nyāya view on absence). The *pramāṇa* focus is perception (*pratyakṣa*) – the immediate ground of knowing.
  2.  **Tercet 2 (Hetu - Reason & Anumāna - Inference):** Presents the reason for rejecting an independent *anupalabdhi*: absence lacks its own distinct object (*viṣaya*). Introduces Refrain B (Rival view). The *pramāṇa* focus is inference (*anumāna*) – the logical deduction supporting the reason.
  3.  **Tercet 3 (Udāharaṇa - Example/Illustration & Upamāna - Comparison):** Provides the classic illustrative case (the bare floor signifying the missing pot). The *pramāṇa* focus is comparison (*upamāna*) – understanding absence is like understanding similarity (e.g., knowing a 'cow' via a 'gavaya').
  4.  **Tercet 4 (Upanaya - Application & Śabda - Testimony):** Applies the rule from the example universally: *all* absence is known this way. The *pramāṇa* focus is testimony (*śabda*) – invoking the authoritative declaration of the tradition ("Four sources...").
  5.  **Tercet 5 (Nigamana - Conclusion):** Draws the conclusion: *anupalabdhi* is reducible to *pratyakṣa* (perception of the *failure* to perceive the expected object). It explicitly references the debate: validity (*prāmāṇya*) is established extrinsically (*parataḥ*), not intrinsically (*svataḥ*), and involves suppositional reasoning (*tarka*).
  6.  **Quatrain:** Final convergence of the refrains without synthesis. The poem ends with the Nyāya position (Refrain A) stated last and the rival position (Refrain B) preceding it, emphasizing the irreconcilable standoff.

  **Philosophical Precision within Verse:**

  *   **Core Debate:** The poem enacts the central debate over whether non-apprehension (*anupalabdhi*) is an independent source of knowledge or merely a mode of perception (*pratyakṣa*).
  *   **Nyāya Stance:** Refrain A consistently embodies the Nyāya view: absence is known *indirectly* through the perception of the *ground* (*adhikaraṇa*) where the object is expected but absent ("bare floor" showing "missing pot").
  *   **Rival Stance (e.g., Advaita/Mīmāṃsā):** Refrain B embodies the opposing view that absence is *directly* cognized ("empty room knows its own emptiness").
  *   **Syllogistic Structure:** The progression through Pratijñā, Hetu, Udāharaṇa, Upanaya, Nigamana structures the argument logically within the poetic form.
  *   **Pramāṇa Integration:** Each epistemic tool (*pratyakṣa*, *anumāna*, *upamāna*, *śabda*) is invoked within the stanzas corresponding to their role in building the argument (thesis, reason, illustration, application).
  *   **Svataḥ/Parataḥ Prāmāṇya & Tarka:** The final tercet explicitly mentions that validity is established extrinsically (*parataḥ*, through other means like *tarka*), contrasting with *svataḥ* theories. It also acknowledges the role of *tarka* (suppositional reasoning) in probing the issue, though it doesn't change the conclusion.
  *   **Reduction:** The conclusion (*nigamana*) definitively states that *anupalabdhi* is reducible to *pratyakṣa*.

  **Accessibility:**

  *   Terms like *pramāṇa*, *pratyakṣa*, *anumāna*, *upamāna*, *śabda*, *anupalabdhi* are used directly but placed within clear contexts and syntactic structures that hint at their meaning (e.g., "four gates stand to truth", "perception's own failure").
  *   The core imagery (bare floor/missing pot, empty room) vividly illustrates the abstract debate.
  *   The syllogistic steps are mapped to concrete actions (thesis *stands*, reason *proves*, example *is bound*, testimony *declares*, conclusion *is drawn*).
  *   The final quatrain uses simpler language ("won't be taught", "seen", "presence comes to naught") to reinforce the takeaway. The juxtaposed refrains encapsulate the core disagreement visually and conceptually.
