prompt: |-
  I've been arguing with my cousin about family loyalty and whether confucian role ethics makes any sense in modern life. I don't have any academic background — I just read a few blog posts and got confussed about where I actually stand. I want a sorting quiz or decision tree that maps concrete cases onto positions, not just labels.

  Start with specific scenarios: you find out your sister lied on a job application, you're deciding whether to cover for a workmate even if strangers get hurt, or you have to care for a parent who was abusive but now needs help. Each branch should split on a real philosophical difference — like whether the role creates the duty or just channels an existing one; whether role conflicts (parent vs honest citizen) are solved by a built-in hierarchy or by stepping outside roles entirely; whether obligations dissolve if the other person stops playing their part (this "reciprocal activation" idea I half-read about); and whether extending care to strangers means treating them like family or weakening family ties.

  The end points should name actual positions where they exist — Mencius on extending care, strict hierarchical essentialism, modern relational-autonomy readings — and label anything else "unnamed / odd combo". Please flag pairs your tree can't seperate, like maybe two flexible-role views that differ on whether flexibility is progress or decay but answer every case the same way.

  Don't include a bibliography or reading list — I can't check books right now and I just want the instrument itself. Write in British English.

  Please structure your answer exactly like this:

  1. How to read the tree (around 150 words)
  2. The branching cases and answer options (around 450 words)
  3. The leaves: positions and their awkward commitments (around 350 words)
  4. Empty branches and inseperable pairs (around 200 words)
