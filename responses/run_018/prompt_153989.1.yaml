answer: |-
  ### 1. How to Read the Tree
  This decision tree maps your responses to specific dilemmas onto philosophical stances regarding role ethics. Start with Scenario 1 and choose the answer closest to your instinct. Follow the branch to the next question based on your choice. Each branch splits on a core philosophical disagreement (e.g., whether duties are *created* by roles or merely *guided* by them). Your path ends at a "leaf" – a named position (e.g., Mencian Extensionism) or an "unnamed/odd combo". Named positions come with "awkward commitments" – real-world implications that might feel counterintuitive or challenging. Be honest: there are no "correct" answers, just clarifying ones. If no option fits perfectly, pick the *least wrong*. The tree flags positions it can't separate (e.g., differing views on flexibility).

  ---

  ### 2. Branching Cases and Answer Options

  *   **Scenario 1:** You discover your sister lied significantly on her CV to get a job she desperately needs. No one else knows.
      *   **A:** I have a duty *as her sibling* to protect her, even if it means staying silent. Family loyalty overrides telling the employer.
      *   **B:** I have a duty *as an honest person/citizen* to report the lie. My role as sibling doesn’t negate this broader obligation. → **Go to Scenario 2**
      *   **C:** My duty depends entirely on our relationship *right now*. If we’re close and she’d do the same for me, I stay silent. If we’re estranged or she wouldn’t reciprocate, I might report her. → **Go to Scenario 3**

  *   **Scenario 2 (from 1B):** You see a workmate about to make a critical error that could cause moderate harm (e.g., financial loss, minor injury) to strangers. Covering for them would protect your workmate but ensure the harm occurs.
      *   **A:** My primary duty is to my workmate/friend. Protecting them comes first; the harm to strangers is unfortunate but secondary. The workmate role creates a stronger bond than my connection to strangers.
      *   **B:** My duty to prevent harm to others overrides loyalty to my workmate. Roles like "citizen" or "decent person" impose a universal obligation that supersedes specific bonds. → **Leaf: Hierarchical Essentialism**
      *   **C:** I must weigh *all* relationships involved (workmate, potential victims, my employer). There’s no fixed hierarchy; the morally best outcome depends on the specific context and consequences. → **Leaf: Modern Relational Autonomy**

  *   **Scenario 3 (from 1C):** Your elderly parent, who was emotionally abusive during your childhood, now needs significant daily care. They have no one else.
      *   **A:** The parent-child role creates an unbreakable duty, regardless of their past actions. My obligation exists because of the role itself, not their behaviour. → **Leaf: Strict Role Essentialism**
      *   **B:** Their failure to fulfil their parental duties (by being abusive) dissolved my filial obligations. "Reciprocal activation" means the role duty isn’t active because they stopped playing their part. I have no special duty to care for them. → **Leaf: Reciprocal Activation View**
      *   **C:** I have *some* duty to help because they are human/once cared for me, but it's drastically reduced and reshaped by their abuse. It might mean finding state care, not providing intimate care myself. The duty exists but is flexible and context-dependent. → **Go to Scenario 4**

  *   **Scenario 4 (from 3C):** When considering how society should treat vulnerable strangers (e.g., refugees, the homeless), does ethical care require:
      *   **A:** Extending the *same kind* of deep, relational care and priority we ideally give to family? We must strive to see them *as* family. → **Leaf: Mencian Extensionism**
      *   **B:** Creating strong, *different* societal structures (laws, welfare) to care for them, precisely *because* we can't realistically treat strangers like family? This protects family bonds while still meeting universal duties. → **Leaf: Modern Relational Autonomy** (or **Unnamed Combo** if paired with strong reciprocity)
      *   **C:** Recognising a minimal universal duty (don't harm, basic aid) but prioritising resources and deep care for my own established relationships? Extending care too far weakens essential close bonds. → **Leaf: Unnamed Combo (Contextual Primacy)**

  ---

  ### 3. Leaves: Positions and Their Awkward Commitments

  *   **Hierarchical Essentialism:** Duties are inherent in fixed roles arranged in a strict hierarchy (e.g., parent > ruler > child > citizen > stranger). Conflicts are resolved by the higher-ranking role. *Awkward Commitment:* You must prioritise loyalty to a corrupt family member over reporting a serious crime harming strangers if the family role outranks citizenship in your hierarchy. Justice can become secondary to role obedience.
  *   **Strict Role Essentialism:** Duties are absolute and created solely by the role itself, regardless of others' actions or context. *Awkward Commitment:* You owe lifelong, unquestioning care and obedience to an abusive parent simply because they are your parent. Reciprocity or their moral failure is irrelevant. Personal well-being is secondary to role fulfilment.
  *   **Reciprocal Activation View:** Role duties are conditional on the other person minimally fulfilling *their* reciprocal role obligations. If they fail (e.g., abusive parent), your duties dissolve. *Awkward Commitment:* You can completely abandon a vulnerable, elderly parent who failed you decades ago, even if they are now incapable of harm and have no one else. Coldness is justified.
  *   **Mencian Extensionism:** Core familial care ("ren" - humaneness) is innate and should be consciously extended outwards in ever-widening circles to strangers/society. *Awkward Commitment:* You must be willing to sacrifice significant resources/time for distant strangers *as if* they were close family, potentially straining actual family bonds and personal capacity. Impractical idealism is a risk.
  *   **Modern Relational Autonomy:** Roles are dynamic frameworks that *channel* pre-existing moral responsibilities (like care, respect) but don't create them. Flexibility, context, consent, and mutual respect are key. Conflicts require balancing *all* affected relationships and duties. *Awkward Commitment:* In complex conflicts (e.g., Scenario 2), there is no guaranteed "right" answer derived solely from roles. You bear significant personal responsibility for nuanced, often difficult judgements with no clear societal rule to follow. Paralysis or guilt is possible.
  *   **Unnamed Combo (Contextual Primacy):** Strong duties exist primarily within concrete, established relationships (family, close friends). Duties to strangers are minimal and general. Role flexibility allows adjusting for context (like past abuse). *Awkward Commitment:* Systemic injustice towards vulnerable strangers might be tolerated as long as your immediate circle is cared for. "Not my problem" becomes a viable ethical stance for societal issues.

  ---

  ### 4. Empty Branches and Inseparable Pairs

  *   **Empty Branch:** The tree currently lacks a branch explicitly splitting views based *only* on whether role flexibility represents moral **progress vs. decay**. This difference often underpins *interpretations* of flexible views rather than changing case outcomes. A "Modern Relational Autonomy" advocate might see flexibility as progress (adapting to modern complexity), while someone reaching the "Contextual Primacy" leaf might see it as decay (eroding sacred duties), yet they could answer all scenarios *identically*.
  *   **Inseparable Pairs:**
      *   **Flexibility Interpretation:** As above, "Modern Relational Autonomy" and "Contextual Primacy" (or similar unnamed flexible views) might be indistinguishable in their *answers* to these specific cases. Their divergence lies in their *justification* – whether the flexibility reflects a richer ethics (progress) or a loss of core values (decay) – which the scenarios don't explicitly test.
      *   **Minimal Universalism:** Views agreeing on strong family duties + minimal universal duties to strangers (e.g., some interpretations of "Contextual Primacy" vs. very weak forms of "Reciprocal Activation" applied only to strangers) might also yield identical answers across these cases, differing only in their foundational rationale for the minimal duty.
