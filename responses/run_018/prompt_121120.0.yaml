prompt: |-
  I chair the incident review committee at a large hospital system. Within about two weeks of an adverse event, and on the basis of a written file plus one interview, we decide how the institution will respond to the clinicians involved: whether to occupy what Strawson calls the participant stance — blame, censure, a demand for an account, an expectation of remorse — or to fall back into the objective attitude, treating them as things to be managed, retrained, reassigned or removed. Our current protocol is a vague just-culture checklist; I want to replace it with something explicitly Strawsonian that a rotating committee of clinicians and one lay member can run in about an hour, roughly monthly, knowing that our finding goes into a personnel file and can affect clinical privileges.

  Write me that procedure: the questions in order, what counts as a sufficient answer to each, where the procedure terminates in a no-blame outcome, and where it must stop and hand the decision to a person because what remains is a question of values rather than facts. It has to handle at least: the difference between an excuse (the agent did not really act, or acted in ignorance or under pressure) and an exemption (the agent is unsuitable as a candidate for reactive attitudes generally — a child, someone floridly psychotic, someone with advanced dementia); cases of partial or marginal participation, where several people each contributed a little; the gap between the committee's public finding and what its members can honestly feel, and the fact that the clinician's own self-reactive attitudes and the team's blame on the patient's behalf are part of what we are deciding; and, increasingly, events whose proximal cause was an algorithmic recommendation that nobody on the ward could have independently checked.

  Then run it on three cases: a resident on a fourth consecutive long shift who misprogrammed an infusion pump and killed a patient; an attending who knowingly deviated from a guideline she disagreed with, relying on her own clinical experience, with a bad outcome; and a surgeon with early, undiagnosed cognitive decline whose colleagues had been quietly covering for him. At least one of these should come out somewhere the committee will not like. Close by saying what the procedure cannot do.
reasoning: |-
  We are designing a procedure based on Peter Strawson's framework of reactive attitudes (participant stance) vs. objective attitude. The goal is to determine whether to hold the clinician(s) responsible (and thus apply reactive attitudes such as blame, censure, etc.) or to treat them objectively (as needing management, retraining, etc.).

  The procedure must consider:
  1. Excuses: where the agent acted but under conditions that might mitigate blame (ignorance, duress).
  2. Exemptions: where the agent is not a suitable candidate for reactive attitudes at all (e.g., due to a condition like psychosis, dementia, or being a child).
  3. Partial/marginal participation: multiple contributors, each with a small part.
  4. The gap between the committee's public finding and their honest feelings, and the role of the clinician's self-reactive attitudes and the team's blame on the patient's behalf.
  5. Events caused by algorithmic recommendations that no one could independently check.

  We are to write a step-by-step procedure with questions, sufficient answers, termination points for no-blame, and points where the decision must be handed to a person (for value judgments).

  Then, apply to three cases.

  **Strawsonian Framework Recap**:
  - **Participant stance**: We hold others responsible and have reactive attitudes (resentment, gratitude, etc.) when we see them as moral agents.
  - **Objective stance**: We see the person as not fully responsible (e.g., due to being a child, mentally ill) and thus treat them as an object of management, therapy, or training.

  **Key Questions for the Procedure**:

  1. **Exemption Check**: Is the clinician exempt from the participant stance? (i.e., are they generally unsuitable for reactive attitudes?)
     - Criteria: Conditions that severely impair agency (e.g., advanced dementia, florid psychosis, or being a minor). If yes, then objective attitude (no blame, but manage: e.g., remove from duties, provide care).
     - If exempt, terminate: no-blame outcome.

  2. **Excuse Check**: If not exempt, then we consider excuses. Did the clinician act in a way that we would normally hold responsible, but there are excusing conditions?
     - Excuses: 
       - Ignorance: The clinician did not know and could not reasonably have known critical information.
       - Duress: The clinician was under such pressure that their capacity for choice was significantly diminished.
       - Inadvertence: A momentary lapse that any reasonable person might have had in the circumstances (but note: if the lapse is due to systemic issues, it might be excused).
     - If a valid excuse is found, then we do not hold responsible (no-blame) but may still require management (e.g., retraining, system changes). However, note that the excuse might be partial.

  3. **Partial Responsibility**: In cases with multiple contributors, we must assign responsibility proportionally. We may have to consider each person separately.

  4. **Algorithmic Cause**: If the event was proximally caused by an algorithm that no one could check, then we must consider:
     - Was the clinician expected to check? (If not, then no blame for the clinician; the issue is systemic.)
     - If they were expected to check, then why didn't they? (Then we go back to excuse or exemption.)

  5. **The Gap and Self-Reactive Attitudes**: The committee must separate its finding from what they feel. The procedure should focus on the facts and the Strawsonian framework. However, the clinician's own remorse and the team's blame are factors we consider only in the sense of whether they are warranted by the facts. We are deciding whether the reactive attitudes are appropriate, not whether they are present.

  **Procedure Outline**:

  We'll design a flowchart of questions. The committee will have the written file and one interview (presumably with the clinician(s) involved). The interview is to clarify facts and to assess the clinician's state (for exemption) and circumstances (for excuses).

  **Step-by-Step Procedure**:

  1. **Preliminary Step**: Identify the clinician(s) involved and the specific actions/omissions that led to the event.

  2. **Question 1: Exemption**  
     - *Question*: Is there evidence that the clinician, at the time of the event, suffered from a condition that generally exempts them from being a candidate for reactive attitudes? (e.g., florid psychosis, advanced dementia, or other severe cognitive impairment that destroys moral agency)  
     - *Evidence to consider*: Medical history, witness accounts, behavior during the event and in the interview.  
     - *Sufficient for exemption*: Clear and convincing evidence of a condition that severely impairs judgment, understanding, or control to the point of destroying moral agency.  
     - *Outcome*: If yes, then the committee concludes that the clinician is exempt. The institution will take an objective attitude: manage by removal from duties, require medical evaluation/treatment, and reassign or retire as appropriate. This is a no-blame outcome. The procedure terminates for that clinician.  
     - *Handoff to person*: If the evidence is ambiguous (e.g., early cognitive decline that may or may not have been severe enough at the time), then the committee must hand the decision to a senior medical ethics committee or a designated senior clinician (with expertise in the condition) for a judgment call on whether the impairment was sufficient to exempt. This is because the boundary of exemption is a value-laden decision.

  3. **Question 2: Excuses** (only if not exempt)  
     - *Question*: Were there excusing conditions that negate responsibility for the specific action?  
       - Sub-questions:
         - **Ignorance**: Did the clinician lack critical knowledge? And was that lack of knowledge excusable? (i.e., could they reasonably have been expected to know?)  
           - *Sufficient for excuse*: The information was not available, or it was unreasonable to expect the clinician to have known (e.g., a new guideline not yet disseminated, a rare condition they had no reason to suspect).  
         - **Duress**: Was the clinician under such extreme pressure (e.g., overwhelming workload, personal emergency) that their capacity for rational choice was significantly impaired?  
           - *Sufficient for excuse*: The pressure was extraordinary and beyond what is normally expected in the role, and it directly impacted the decision.  
         - **Inadvertence**: Was the error a momentary lapse of attention that any reasonable person might have had in the circumstances?  
           - *Sufficient for excuse*: The lapse was not due to recklessness or negligence, and the circumstances were such that fatigue or distraction was a known risk (but note: if the system should have prevented it, then it's a system issue).  
     - *Outcome*: If any excuse is found and accepted, then the clinician is not held responsible (no-blame). However, the institution may still require management:  
       - If ignorance: training.  
       - If duress: review workload, provide support.  
       - If inadvertence: consider system changes (e.g., double-checks) and/or fatigue management.  
     - *Partial excuse*: It is possible that an excuse applies only partially (e.g., the clinician was under duress but still should have taken a particular step). In that case, the committee must decide the degree of responsibility. This might lead to a mixed outcome (e.g., limited blame and management).  
     - *Handoff to person*: If there is ambiguity about whether the excuse is sufficient (e.g., how much pressure is too much? or what is reasonable to know?), then the committee must hand the decision to a designated senior clinician or ethics committee for a value judgment about the standards of the profession.

  4. **Question 3: Algorithmic Cause** (if applicable)  
     - *Question*: Was the adverse event proximally caused by an algorithmic recommendation?  
     - If yes:  
       - *Sub-question 3a*: Was the clinician expected to independently check the algorithm's recommendation?  
         - If no, then the clinician is excused (no-blame) and the issue is systemic (handled by management).  
         - If yes, then go to Question 2 (Excuses) to see why they didn't check (e.g., ignorance of the need to check? duress? inadvertence?).  
     - *Outcome*: As above.

  5. **Question 4: Multiple Contributors**  
     - *Question*: Are there multiple clinicians involved in the event?  
     - If yes:  
       - The committee must evaluate each clinician separately using the above steps.  
       - For each, determine if they are exempt, excused, or responsible.  
       - Also, consider if the system design contributed (e.g., poor communication, lack of clear roles).  
     - *Outcome*: Each clinician is assigned an outcome (exempt, excused, responsible).  
     - *Handoff to person*: If the contributions are interwoven and it is difficult to assign individual responsibility, then the committee may hand the decision to a senior committee for a holistic judgment (because the assignment of responsibility in complex systems is a value-laden issue).

  6. **Question 5: The Participant Stance**  
     - If the clinician is not exempt and no excuse applies, then the committee concludes that the participant stance is appropriate.  
     - *Outcome*: The clinician is held responsible. The institution will express blame, censure, and demand an account. This may include:  
       - A formal reprimand in the personnel file.  
       - Requirement to demonstrate remediation (e.g., retraining).  
       - Possible suspension or restriction of privileges.  
       - The expectation of remorse and an apology to the patient/family.  
     - *Note*: The committee must also consider the team's blame on the patient's behalf and the clinician's own self-reactive attitudes. If the clinician shows appropriate remorse, that does not negate responsibility but may mitigate sanctions. Conversely, lack of remorse may aggravate. However, this is a matter for the sanction phase, not the responsibility phase.

  **End of Procedure**:

  - The committee's finding is recorded and goes into the personnel file.
  - The committee must document the reasoning, especially where they handed off a decision.

  **What the Procedure Cannot Do**:
  - It cannot eliminate the emotional response of the committee or the clinicians. There may be a gap between the formal finding and what people feel.
  - It cannot address all systemic issues; it focuses on individual responsibility. Systemic issues should be flagged for a separate review.
  - It cannot perfectly handle cases where the boundaries of exemption or excuse are blurred (hence the handoff to people for judgment).
  - It cannot account for every nuance of team dynamics in complex systems; it may oversimplify when multiple contributors are involved.
  - It may not satisfy the need for closure for the patient/family or the team, because it is focused on the clinicians.

  ---

  **Running the Cases**:

  We'll run three cases:

  1. **Case 1**: A resident on a fourth consecutive long shift who misprogrammed an infusion pump and killed a patient.

  2. **Case 2**: An attending who knowingly deviated from a guideline she disagreed with, relying on her own clinical experience, with a bad outcome.

  3. **Case 3**: A surgeon with early, undiagnosed cognitive decline whose colleagues had been quietly covering for him.

  We are to run the procedure and have at least one come out in a way the committee won't like.

  ---

  **Case 1: Resident on a Fourth Consecutive Long Shift**

  - **Step 1: Exemption**  
    - Is the resident exempt? No evidence of psychosis or dementia. The resident is an adult without known cognitive impairment. Not exempt.

  - **Step 2: Excuses**  
    - *Ignorance*: Did the resident lack knowledge about programming the pump? Unlikely; this is a basic skill. Not excusable by ignorance.
    - *Duress*: Was the resident under duress? Yes, extreme fatigue from four consecutive long shifts. The pressure of the shift might have impaired judgment and attention.  
      - *Sufficient for excuse?* This is a judgment call. If the hospital allowed such scheduling, then it might be a systemic issue. The committee might consider that the resident was in a state of diminished capacity due to fatigue.  
      - *Outcome*: We might excuse the resident because the duress was extraordinary (but note: if the resident knew they were too tired and did not seek help, that might reduce the excuse).  
    - *Inadvertence*: The error was a slip due to fatigue? Yes, but this is tied to duress.

    - *Conclusion*: The resident is excused due to duress. However, the hospital must address the scheduling system.

  - **Step 3: Algorithmic Cause** - Not applicable.

  - **Step 4: Multiple Contributors** - Not applicable (unless we consider the system that allowed the schedule).

  - **Outcome**: No-blame for the resident. Management: The resident may be required to undergo training on pump programming and fatigue management, but the primary response is systemic (review scheduling policies). The institution should not blame the resident.

  - *Committee's feelings*: They might feel that the resident should have been more careful, but the procedure leads to no-blame.

  ---

  **Case 2: Attending Who Deviated from Guideline**

  - **Step 1: Exemption**  
    - No evidence of exemption. The attending is a competent adult.

  - **Step 2: Excuses**  
    - *Ignorance*: She knew the guideline and chose to deviate. Not ignorant.
    - *Duress*: No evidence of extraordinary pressure.
    - *Inadvertence*: The deviation was deliberate, not a slip.

    - Therefore, no excuse applies.

  - **Step 3: Algorithmic Cause** - Not applicable.

  - **Step 4: Multiple Contributors** - Not applicable.

  - **Step 5: Participant Stance**  
    - The attending is responsible. The committee must hold her accountable.  
    - Outcome: Blame, censure. The institution may require her to justify her decision, retrain on guidelines, and possibly face suspension or restrictions. She is expected to show remorse.

  - *Committee's feelings*: They might not like this because the attending was experienced and thought she was doing the right thing. But the procedure requires blame when there is a deliberate deviation without excuse.

  ---

  **Case 3: Surgeon with Early, Undiagnosed Cognitive Decline**

  - **Step 1: Exemption**  
    - We have evidence of cognitive decline. But is it severe enough to exempt?  
      - The decline is early and undiagnosed. The surgeon was still performing surgery, and colleagues covered for him.  
      - *Ambiguity*: The committee might not have clear evidence of the degree of impairment at the time of the adverse event.  
      - *Handoff*: The committee cannot decide on exemption and must hand it to a senior clinician or a medical ethics committee for a value judgment.  

  - **Handoff Decision**: The senior reviewer considers:  
    - The surgeon's condition: early decline might not destroy moral agency entirely. He might have been responsible for seeking evaluation when he noticed problems (but he might not have noticed).  
    - The colleagues' covering up: This is a systemic issue.  
    - The reviewer might decide that the surgeon is not exempt (because the impairment was not severe enough to destroy agency) but that there are excuses.  

  - If handed back as not exempt:

    - **Step 2: Excuses**  
      - *Ignorance*: Did the surgeon know about his cognitive decline? If undiagnosed and early, he might not have known. But should he have sought evaluation?  
        - This is ambiguous. If he had reasons to suspect (e.g., lapses) then ignorance might not be excusable.  
      - *Duress/Inadvertence*: Not applicable.  

      - *Conclusion*: The committee might find that he is partially excused because he didn't know, but he should have been more self-aware.  

    - **Step 4: Multiple Contributors** - The colleagues who covered up are also involved. They should be evaluated separately (but that's not the focus here).  

    - **Outcome for the surgeon**: Partial responsibility. The committee might decide on a mixed outcome:  
      - The surgeon is held responsible for not seeking evaluation earlier (so some blame) but the primary fault lies with the system (colleagues covering up).  
      - Management: The surgeon must undergo evaluation and treatment. His privileges are suspended until cleared. He may be required to apologize.  

  - *Committee's feelings*: They might feel sympathy but also anger at the cover-up. The outcome (partial blame) might be uncomfortable.

  ---

  **What the Procedure Cannot Do**:

  - It cannot resolve all moral ambiguities; some cases require human judgment beyond the flowchart.
  - It cannot eliminate the pain of holding a colleague responsible or the discomfort of excusing someone when a patient was harmed.
  - It cannot fix systemic issues; it can only flag them.
  - It cannot account for the full emotional weight of the event for the patient, family, or team.
  - It may not prevent future events; it is a tool for assigning responsibility, not a safety improvement tool per se.

  This procedure provides a structured, fair, and philosophically grounded approach to incident review, but it is not a panacea.
answer: |-
  Below is a Strawson-based incident review procedure designed for your committee. It follows Peter Strawson's framework of "reactive attitudes" (participant stance: blame, censure, demand for account) vs. "objective attitude" (management, retraining, removal). The procedure is structured as a linear checklist with clear exit points for no-blame outcomes and handoff points where human judgment is required. It addresses exemptions (permanent incapacity for responsibility), excuses (temporary or contextual factors), partial participation, algorithmic causes, and the tension between institutional findings and personal feelings.

  The procedure assumes:
  - A 60-minute time limit per case.
  - Inputs: Written file (incident report, records, policies) + one 20-minute interview with the involved clinician(s).
  - Output: A finding of either (1) **participant stance** (blame/censure, documented in file, may affect privileges), (2) **objective stance** (no-blame, manage via retraining/reassignment), or (3) **handoff** to a designated senior ethics officer or HR for values-based decisions.

  ---

  ### **Strawson-Based Incident Review Procedure**  
  **Questions in Order, with Sufficient Answers and Decision Rules**  

  1. **Exemption Check: Is the clinician generally unfit for reactive attitudes?**  
     - *Question*: Does the evidence indicate a permanent or severe condition (e.g., florid psychosis, advanced dementia, intellectual disability) that fundamentally impairs moral agency?  
     - *Sufficient Answer*:  
       - **Yes** (exemption): If the condition is documented (e.g., medical diagnosis) and directly linked to the event. *Outcome*: Immediate objective stance. Terminate procedure—no blame. Manage via medical leave, reassignment, or retirement.  
       - **No** or **Unclear**: Proceed to Q2.  
     - *Handoff Trigger*: If evidence is ambiguous (e.g., early cognitive decline, episodic mental illness), hand off to the ethics officer. Reasoning: Exemption requires a values judgment about "severity," not just facts.  

  2. **Excuse Check: Did the clinician act under excusing conditions?**  
     - *Question*: Was the act caused by ignorance, duress, or inadvertence that negates blame?  
       - *Sub-questions*:  
         - **Ignorance**: Was the clinician unaware of critical facts/standards, and was this ignorance reasonable? (e.g., unreleased guideline, ambiguous policy).  
         - **Duress**: Was the clinician under extreme pressure (e.g., resource shortages, imminent patient death, personal crisis) that compromised choice?  
         - **Inadvertence**: Was the error a brief lapse any reasonable person might make (e.g., fatigue-induced slip)?  
     - *Sufficient Answer*:  
       - **Yes** (valid excuse): If one condition is met *and* the clinician could not reasonably have overcome it (e.g., no time to consult, system barriers). *Outcome*: Objective stance. Terminate procedure—no blame. Manage via retraining, system fixes, or support.  
       - **Partial** (e.g., partially avoidable ignorance): Proceed to Q3.  
       - **No**: Proceed to Q3.  
     - *Handoff Trigger*: None—this is fact-based.  

  3. **Algorithmic Cause Check (if applicable)**  
     - *Question*: Was the event proximally caused by an algorithmic tool no clinician could independently verify (e.g., "black-box" AI)?  
     - *Sufficient Answer*:  
       - **Yes**: Immediate objective stance. Terminate procedure—no blame. Manage via tech review or policy change.  
       - **No** (clinician could/should have verified): Proceed to Q4.  
     - *Handoff Trigger*: If "could have verified" is disputed (e.g., unclear hospital policies), hand off to ethics officer. Reasoning: This hinges on institutional values about clinician autonomy vs. tech reliance.  

  4. **Participation Assessment: Was the clinician’s role marginal or shared?**  
     - *Question*: Did multiple people contribute, and was the clinician’s involvement minor, indirect, or coerced?  
     - *Sufficient Answer*:  
       - **Yes, marginal** (e.g., followed orders, minor task): Objective stance. Terminate—no blame. Manage via team training or role adjustment.  
       - **No, central role**: Proceed to Q5.  
       - **Shared but significant**: Proceed to Q5 (blame may apply proportionally).  
     - *Handoff Trigger*: None—assess facts from records/interview.  

  5. **Warrant for Reactive Attitudes: Is blame justified?**  
     - *Question*: Absent exemption/excuse, does the clinician warrant blame based on:  
       - Intentionality (e.g., reckless disregard, conscious violation)?  
       - Avoidability (e.g., reasonable alternatives existed)?  
       - Harm (e.g., severe or foreseeable outcome)?  
     - *Sufficient Answer*:  
       - **Yes**: Participant stance. Document blame, censure, and demand account (e.g., formal reprimand, remediation).  
       - **No**: Objective stance (e.g., rare edge case with no precedent).  
     - *Handoff Trigger*: If harm vs. intent is contested (e.g., "disagreed with guideline in good faith"), hand off to ethics officer. Reasoning: Assigning blame requires values-based weighing of clinical autonomy vs. institutional standards.  

  6. **Self-Reactive & Team Attitudes (Post-Hoc Integration)**  
     - *Question*: Do the clinician’s remorse and the team’s blame align with the committee’s finding?  
     - *Use*: Not a decision point, but informs management:  
       - If committee finds **participant stance** but clinician shows no remorse, recommend stronger sanctions.  
       - If committee finds **objective stance** but team demands blame, recommend transparency (e.g., "We acknowledge your anger, but our finding is system-focused").  
     - *Handoff Trigger*: Never—this contextualizes the outcome but doesn’t alter it.  

  ---

  ### **Key Features**  
  - **Time Efficiency**: 6 questions, ~10 minutes each.  
  - **Termination Points**: Q1 (exemption), Q2 (excuse), Q3 (algorithm), Q4 (marginality) can end in no-blame.  
  - **Handoff Points**: Q1 (unclear exemption), Q3 (disputed algorithm role), Q5 (ambiguous blameworthiness). Hand off to a pre-designated senior ethics officer (e.g., Chief of Staff or HR Director) for a final decision within 48 hours.  
  - **Output**: Documented finding (participant/objective) with reasoning, shared with HR for personnel files.  

  ---

  ### **Case Applications**  
  **Case 1: Resident on Fourth Consecutive Long Shift Who Misprogrammed Infusion Pump**  
  - **Q1 (Exemption)**: No evidence of psychosis/dementia. → Proceed.  
  - **Q2 (Excuse)**: **Duress**—extreme fatigue from consecutive shifts. *Sufficient*: Unavoidable (hospital scheduling). → **Objective stance**. Terminate.  
    - *Outcome*: No blame. Manage via scheduling reforms + pump training.  
    - *Committee Feelings Gap*: Members may privately blame the resident but must accept systemic cause.  

  **Case 2: Attending Who Knowingly Deviated from Guideline**  
  - **Q1 (Exemption)**: No. → Proceed.  
  - **Q2 (Excuse)**: No ignorance/duress/inadvertence. She chose to deviate. → Proceed.  
  - **Q3 (Algorithm)**: N/A.  
  - **Q4 (Participation)**: Central role. → Proceed.  
  - **Q5 (Warrant for Blame)**: **Intentionality** (disagreed with guideline), **avoidability** (could have followed guideline), **harm** (bad outcome). → **Participant stance**.  
    - *Outcome*: Blame/censure. Demand account (e.g., explain at M&M conference). Record in file, possible privilege review.  
    - *Committee Won’t Like This*: Her experience may garner sympathy, but Strawson demands blame for intentional acts.  

  **Case 3: Surgeon with Early Cognitive Decline, Colleagues Covered for Him**  
  - **Q1 (Exemption)**: Early decline—unclear if severe enough. *Ambiguous*. → **Handoff** to ethics officer.  
    - *Ethics Officer Judgment*: Decline impairs agency but isn’t full exemption (e.g., he hid it). Not exempt. → Return to committee.  
  - **Q2 (Excuse)**: **Ignorance**—undiagnosed, but should have self-reported lapses. *Partial excuse*. → Proceed.  
  - **Q4 (Participation)**: Central role, but colleagues contributed by covering up. → **Participant stance** for surgeon (blame for not seeking help).  
    - *Outcome*: Blame/censure (reduced due to partial excuse). Require evaluation, suspend privileges. Colleagues separately reviewed for marginal participation.  
    - *Committee Feelings Gap*: May struggle to blame a declining colleague, but procedure forces it.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Eliminate Emotional-Cognitive Dissonance**: The committee may *feel* blame in no-blame cases (e.g., Case 1) or reluctance in blame cases (e.g., Case 3), but the procedure prioritizes consistent application over catharsis.  
  2. **Address Systemic Issues Holistically**: It flags system factors (e.g., scheduling, algorithm design) but doesn’t fix them—this requires separate safety reviews.  
  3. **Reconcile Subjective Blame**: Patient/family anger or team scapegoating may persist despite findings. The procedure only decides institutional (not moral) blame.  
  4. **Handle "Gray-Zone" Exemptions Perfectly**: Early dementia, addiction, or personality disorders often need handoffs, risking inconsistency.  
  5. **Guarantee Clinician Buy-In**: Clinicians may view the interview as adversarial, undermining trust.  
  6. **Replace Broader Justice**: It focuses on clinicians, not patient compensation or family closure—those need parallel processes.  

  This procedure provides a clear, philosophically grounded alternative to vague checklists. It balances efficiency with rigor by offloading values judgments to handoffs, ensuring most cases resolve in under an hour while upholding Strawson’s distinction between "holding responsible" and "managing." I recommend piloting it with your committee for refinement.
