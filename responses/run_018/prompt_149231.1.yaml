    "whether_presentism_is_saved": "**No, causality does not rescue presentism.** Causality is a *feature* of the block universe's structure, not a contradiction. SR enforces causality via the light cone structure: \n- Events inside your past light cone *can* have influenced you.\n- Events inside your future light cone *can* be influenced by you.\n- Events outside your light cone are spacelike-separated (causally disconnected).\nThis structure is **frame-invariant** – all observers agree on what events *could* causally affect others. Protecting causality doesn't require a universal 'now'; it's inherent in spacetime geometry. The 'present' protected by causality isn't a moment, but a *relation* between events defined by light cones.",
    "bottom_line_for_a_non_physicist": "Think of spacetime like a finished film reel. The reel (block universe) contains all events—every 'frame' exists. Special Relativity shows there's no single correct way to split the reel into 'frames playing now' (simultaneity is relative). However, the *order* of events *along any particle's path* (like your life) is fixed and sequential—you can't jump to an earlier 'scene'. Causality is the rule that events in one scene can only affect later scenes in the same storyline, not earlier ones. This causal structure is built into the film reel itself; it doesn't need a projector shining a moving 'now' spotlight."
