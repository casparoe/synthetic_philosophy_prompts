  **Key Clarifications:**

  1.  **Changing Frames ≠ Traveling Through Time:** Accelerating changes your definition of "now" *across the entire universe*. It doesn't move *you* along your own timeline backwards. You remain at your current "scene" on the film reel.
  2.  **Causality is Geometry:** The light cone structure defining what can affect what is a fundamental, frame-invariant property of 4D spacetime. It doesn't imply a moving present; it's a static feature of the block. Events are "fixed" in their causal relationships.
  3.  **No Privilege, No Spotlight:** The frame-dependence of simultaneity *is* the argument *against* a privileged present. The causal constraints don't introduce a new privileged "now"; they are global rules everyone agrees on, defined by spacetime intervals. There's no moving spotlight, just the fixed structure where "before" and "after" are defined locally along worldlines and globally by light cones.
