answer: |-
  Here’s a focused, structurally integral 5-minute opening that embeds your core thesis into the workshop’s DNA, using your Bronze Age case as the engine:

  ---

  **(Start warm, then pivot sharply)**  
  "Good morning. To our archaeologists: welcome back from trenches where the earth whispers in fragments. To our philosophers: welcome to a discipline where those whispers are perpetually underdetermined. We’ve designed this workshop not as a truce but as a shared confrontation—with **absence**.  

  **(Frame the problem through your case)**  
  Picture this: Late Bronze Age, a settlement. Every storage jar bears an administrative seal—systematic, durable records of control. But ritual figurines? Zero. Not one in contexts where pottery survives. The easy read? ‘No cult practice here.’  

  But what if that void is itself an artifact? What if institutions *produce* silence? If ritual was deliberately excluded from durable media—clay, stone, metal—to control memory? Suddenly, absence isn’t neutral data loss; it’s **institutional signature**.  

  **(Make it structural: what this means for the workshop)**  
  So here’s our pivot: **We are not here to ‘read beliefs off the remains.’** We’re here to ask: *Under what conditions do beliefs evade materialization?* When does preservation bias reflect power, not accident? When does missingness mean something?  

  **(Bridge disciplines)**  
  To our diggers: You know taphonomy’s chaos, equifinality’s traps. This is taphonomy politicized.  
  To our philosophers: Underdetermination isn’t just about competing theories—it’s about *systematically erased evidence*.  

  **(Set expectations)**  
  So I won’t promise we’ll reconstruct lost beliefs. I *will* promise we’ll map:  
  - How institutions curate their own invisibility,  
  - How gaps become active constraints on knowledge,  
  - How we might excavate silence.  

  **(Close with purpose)**  
  Our goal? To forge tools that treat absence not as noise, but as a fragment of the thing itself. Let’s begin."  

  ---

  **Key moves:**  
  1. **Case as Catalyst**: Your jar/figurine contrast isn’t illustration—it’s the argument’s skeleton.  
  2. **Discipline Bridge**: "Taphonomy politicized" speaks to archaeologists; "systematically erased evidence" reframes underdetermination for philosophers.  
  3. **Constraint as Core**: The limits ("we won’t read beliefs") aren’t caveats—they’re the workshop’s intellectual foundation.  
  4. **Active Absence**: "Institutional signature," "produce silence," "evade materialization" all make absence *positive* (not passive).  
  5. **No Garnish Philosophy**: The epistemic constraint ("what conditions?") *defines* the shared task.  

  **Tone**: Urgent but collegial. No citations—just shared problems made visceral.  
  **Time**: Tight 5 minutes if delivered at a crisp, engaged pace.  

  This sets the table for work where both sides feel their expertise is essential to dissecting the void.
