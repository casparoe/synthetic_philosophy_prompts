prompt: |-
  I'm serving as a senior advisor to the Scientific Funding Renewal Panel at the Institute for Longitudinal Health Research. The panel must decide whether to approve Phase-IV funding for the Cohort Interaction Study (CIS), which has run continuously since 1994. The study's core Bayesian predictive model was calibrated in 1995 using baseline demographic and environmental priors and was never revised thereafter. In 2023, the study observed—without any post-hoc parameter adjustment—the precise interaction effect between two specified exposure variables that the 1995 architecture had projected. The research team argues that this multi-decade predictive success provides strong, independent confirmatory support warranting renewal. A dissenting panel member contends that, because the 2023 outcomes fall within the range the original prior was already structured to accommodate, they amount to old evidence in the technical Bayesian sense: they should not yield a substantial posterior update and therefore should not count as novel evidential support. There is an additional conceptual complication: CIS possesses a genuinely pre-registered, unrevised predictive architecture spanning nearly three decades, which raises the question of whether evidential depreciation applies differently to long-horizon predictive confirmations than to static, one-time retrodictive fits. Draft a concise, formal memo recommending either renewal or denial. The memo should present clear, actionable criteria the panel can apply; explain how the problem of old evidence bears on the evidential weight of the 2023 results, carefully distinguishing predictive novelty from retrodictive coherence; address the strongest argument on the opposing side—specifically, that sustained, unrevised predictive accuracy over time is qualitatively different from post-hoc accommodation; and rely solely on conceptual reasoning, with no bibliographic citations, reading lists, or appeals to authority.
reasoning: |-
  We are addressing a funding renewal for the Cohort Interaction Study (CIS) based on its long-term predictive success. The core issue revolves around the Bayesian concept of "old evidence" and whether the 2023 observation provides substantial new evidence for the model.

  Key Facts:
  - The CIS model was calibrated in 1995 and has never been revised.
  - In 2023, it observed an interaction effect that the 1995 model projected.
  - The dissent argues that because the 2023 outcome was within the range of the original prior, it does not substantially update the posterior (it is "old evidence").

  Conceptual Framework:
  1. **Old Evidence Problem**: In Bayesian terms, if evidence E was already known (or anticipated) when constructing the model, then P(E|M) is high by design, and observing E does not significantly increase P(M|E). However, here the evidence was not known at the time of model construction but was a prediction. The model was built with a prior that assigned non-zero probability to E, but that is always the case for any non-dogmatic prior.

  2. **Predictive Novelty vs. Retrodictive Coherence**:
     - **Retrodictive coherence**: Fitting the model to existing data (common in model calibration). This is weak evidence because the model is adjusted to fit what is already known.
     - **Predictive novelty**: Making a prediction about future observations that are not used in model construction. This is strong evidence because it tests the model against new data.

     The CIS prediction was made in 1995 for an event in 2023. The 2023 observation is novel in the sense that it was not used to build the model. Thus, it is not "old evidence" in the traditional sense (which typically refers to evidence already known at the time of model formulation). The evidence was not known until 2023.

  3. **Sustained Predictive Accuracy**: The dissent may argue that the prior was structured to accommodate a range of outcomes, including the one observed. However, the critical point is that the model made a specific, long-term prediction without revision. The fact that the prediction was made decades in advance and was not adjusted in light of intervening data is a strong point in favor of the model's robustness.

     Moreover, the prior being non-informative (or accommodating a range) does not diminish the value of a correct prediction. What matters is the likelihood: P(E|M) for the observed E. If the model assigned a high probability to E (relative to alternatives) and E occurred, that is confirmatory.

  4. **Long-Horizon Predictive Confirmations**: The unrevised nature of the model over nearly 30 years is crucial. Typically, models are updated as new data comes in. The fact that this model was not revised and still predicted correctly suggests that the initial model was exceptionally well-specified. This is a rare and valuable characteristic.

     In contrast, if the model had been revised to fit the data along the way, the 2023 observation would be less impressive because it might have been influenced by intermediate data. Here, the model has been "frozen" since 1995, so the 2023 observation is a pure test.

  Strongest Counterargument and Rebuttal:
  - **Counterargument**: The 2023 outcome was within the original prior's range, so it does not update our belief in the model (old evidence).
  - **Rebuttal**: The prior range is typically broad to account for uncertainty. The fact that the prediction came true is still evidence in favor of the model because the model assigned a higher probability to the observed outcome than alternative models (or the background knowledge) would have. Moreover, the evidence was not "old" because it was not known until 2023. The model made a prediction that was not yet observed, and the observation of that event is new evidence.

  Actionable Criteria for the Panel:
  1. **Predictive Novelty**: The evidence must be novel, meaning it was not used in model construction or calibration. The CIS 2023 observation meets this criterion because it was a future event at the time of model building.

  2. **Model Rigidity**: The model must not have been revised to incorporate new data that could have influenced the prediction. The CIS model was unrevised since 1995, so it meets this criterion.

  3. **Specificity of Prediction**: The prediction should be specific and non-trivial. The panel should examine whether the observed interaction effect was a low-probability event under the prior (or at least not a near-certainty) and whether the prediction was precise. The fact that the model projected the "precise interaction effect" suggests specificity.

  4. **Temporal Endurance**: Long-horizon predictions (especially over decades) are inherently more challenging and thus more impressive when confirmed. This should weigh positively.

  Recommendation:
  Renew the funding. The 2023 observation provides strong independent confirmation of the model because:
  - It is a novel prediction that was not available at the time of model construction.
  - The model has remained unrevised, so the confirmation is not due to post-hoc adjustments.
  - The long time horizon makes the prediction especially probative.

  The problem of old evidence does not apply because the evidence was not known until 2023. The dissent confuses the prior's accommodation of a range of outcomes (which is necessary for any probabilistic model) with the idea that the evidence was already known. The evidence was not known; it was predicted.

  Therefore, the panel should consider the 2023 results as substantial novel evidence supporting the model's validity and the study's continued value.

  Formal Memo:

  ---
  **MEMORANDUM**

  TO: Scientific Funding Renewal Panel  
  FROM: Senior Advisor  
  SUBJECT: Recommendation on Phase-IV Funding for the Cohort Interaction Study (CIS)  

  **Recommendation**: Approve renewal of Phase-IV funding for the Cohort Interaction Study (CIS).  

  **Rationale**:  

  The 2023 observation of the predicted interaction effect constitutes novel and substantial evidence in favor of the CIS model, warranting continued investment. This conclusion rests on the following criteria and reasoning:  

  1. **Predictive Novelty**: The 2023 outcome was a future event at the time of model calibration (1995) and was not used in model construction. It therefore provides independent confirmation, distinct from retrodictive fits.  

  2. **Unrevised Model Architecture**: The model has remained unchanged since 1995, meaning the 2023 prediction was not influenced by post-hoc adjustments. Sustained predictive accuracy without revision is qualitatively stronger evidence than post-hoc accommodation.  

  3. **Evidential Weight of Long-Horizon Predictions**: The 28-year predictive horizon amplifies the evidential value. Correct predictions over such durations are rare and reflect exceptional model specification.  

  **Addressing the Dissent**:  

  The dissent contends that the 2023 outcome falls within the original prior's range and thus constitutes "old evidence" that should not substantially update the posterior. This argument misapplies the old evidence problem:  

  - The old evidence problem arises when evidence is already known at the time of model formulation. Here, the evidence was unknown until 2023.  
  - While the prior assigned non-zero probability to the outcome, the confirmation lies in the model's ability to assign a high likelihood to the observed event relative to alternatives. The fact that the prediction held over decades without revision is probative of model robustness.  

  The dissent's concern is mitigated because the model did not merely accommodate existing data but predicted a novel event.  

  **Actionable Criteria for Future Assessments**:  

  The panel should apply these criteria to evaluate predictive claims:  
  - **Novelty**: Was the evidence unavailable at model construction?  
  - **Model Rigidity**: Was the predictive architecture preserved without revision?  
  - **Temporal Endurance**: Was the prediction horizon sufficiently long to avoid data contamination?  
  - **Specificity**: Was the prediction precise and non-trivial?  

  The CIS satisfies all criteria.  

  **Conclusion**:  

  The 2023 results provide strong, independent support for the CIS model. Renewal is justified.  

