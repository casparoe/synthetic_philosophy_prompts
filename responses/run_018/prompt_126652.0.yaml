     *Justification*: Any actionable constraint (e.g., "avoid deviations") inherently reflects a normative stance that certain states are preferable to others.  

  2. **Probability that reference-state preservation avoids value encoding**: **0.2**  
     *Justification*: Selecting/updating the reference state embeds values (e.g., "which changes are authorized?"), making neutrality impossible.  

  3. **Probability human authorization formalizes without resolving value conflicts**: **0.3**  
     *Justification*: Authorization protocols inevitably prioritize certain stakeholders or norms, presupposing value hierarchies.  

  ---

  ### Combination and Sensitivity:  
  - **Combination rule**: Multiplicative (joint probability of all three being favorable).  
    Calculation: \(0.8 \times 0.2 \times 0.3 = 0.048 \approx 0.05\).  
  - **Highest sensitivity**: The claim is most sensitive to **P2** (reference-state neutrality). If P2 were 1.0, credence would jump to 0.24; at 0.01, it collapses to 0.002.  

  ---

  ### Meta-Assessment:  
  - **Confidence in decomposition**: **Moderate (70%)**. The structure isolates key vulnerabilities, but boundaries between probabilities are fuzzy.  
  - **Least confident point**: **P3's quantification (human authorization without value resolution)**. The feasibility of "neutral" formalization depends on contested assumptions about moral ontology.  

  ---

  ### Key Evidence to Shift Credence:  
  A **formal proof** that dynamically updated state preservation *provably* avoids teleology (e.g., shows no preference over outcomes beyond bare state identity) would raise credence to ~0.4. Absent this, operational criteria invariably smuggle in values.
