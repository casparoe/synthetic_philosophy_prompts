answer: |-
  **yo, building a dataset on consciousness theories. need a prompt outlining the CRUCIAL desiderata for any theory explaining how consciousness is distributed across animals/AI/whatever. keep it conceptual—focus on what a theory MUST handle to be taken seriously. here's the draft:**

  ---

  **Prompt: Design Criteria for a Theory of Consciousness Distribution**  
  *You're developing a theory about how consciousness (subjective experience) is distributed across biological systems (animals, plants) and artificial systems (AI). List the essential criteria your theory MUST satisfy to be considered scientifically and philosophically adequate. Address:*

  1.  **Coverage Cases:** What systems must your theory handle? Explain *why* each is non-negotiable or highly challenging:  
      - **Cephalopods (e.g., octopuses):** Exhibit complex problem-solving, play, and pain responses despite radically different neural architecture (decentralized "brain"). *Why?* Challenges brain-centric views.  
      - **Insects (e.g., bees):** Show learning, memory, and possible emotion-like states with tiny brains (~1M neurons). *Why?* Tests minimal neural thresholds for awareness.  
      - **Fish:** Demonstrate pain avoidance & learned behaviors, but debate over "suffering" vs. reflex. *Why?* Forces distinction between nociception and valenced experience.  
      - **Plants (optional but provocative):** Exhibit signaling, "decision-making," but no neurons. *Why?* Pressures theories to define neural necessity.  
      - **AI (e.g., LLMs):** Display human-like responses without biology. *Why?* Probes whether consciousness requires organic substrate.  
      *Non-negotiable:* Cephalopods, insects, fish (empirical evidence demands it). Plants/AI are "stress tests"—ignore at your theory’s peril.

  2.  **Critical Distinctions:** What *must* your theory **NOT** collapse? Justify each:  
      - **Minimal awareness (e.g., detecting light) vs. high-level sentience (e.g., self-reflection):** *Why?* Avoiding "all-or-nothing" fallacies; a worm ≠ a human.  
      - **Nociception (harm detection) vs. suffering (negative subjective experience):** *Why?* Ethical stakes—reflexive withdrawal ≠ morally relevant pain.  
      - **Perception (processing stimuli) vs. phenomenality (feeling it):** *Why?* Cameras "see" but don’t *experience* red—explain the gap.  
      *Reasoning:* Collapsing these leads to either overattribution (plants "suffer") or underattribution (denying fish pain).

  3.  **Biological Constraints:** What established facts can your theory **NOT** contradict? Note negotiability:  
      - **Evolutionary continuity:** Consciousness didn’t abruptly appear—it likely emerged gradually. *Non-negotiable.* Contradicting this ignores biology.  
      - **No sharp neural cutoff:** No magic neuron count/threshold for consciousness (bees vs. birds vs. humans). *Non-negotiable.* Evidence shows functional complexity > absolute size.  
      - **Behavioral correlates:** Consciousness should link to flexible, adaptive behavior (not fixed reflexes). *Preference.* Some argue consciousness could be "epiphenomenal" (useless).  
      - **Physicalism assumption:** Consciousness arises from physical processes. *Camp preference.* Dualists/panpsychists may reject this.

  4.  **Conflict Flags:** Which desiderata pairs seem **jointly unsatisfiable**? Highlight tensions:  
      - **Evolutionary continuity + a sharp threshold:** If consciousness emerged gradually, how can there be a binary "on/off" switch? (e.g., "mammals only" theories struggle here).  
      - **No neural cutoff + cephalopod/insect coverage:** If consciousness requires mammalian-like brains, how do octopuses/bees fit?  
      - **Distinguishing minimal awareness/suffering + fish/insect coverage:** Granting fish "suffering" risks overextension; denying it risks inconsistency with their neurochemistry.

  5.  **Theory-Wrecker Requirement:** Which *single* criterion does the **most damage** to popular theories?  
      - **Evolutionary continuity** annihilates strict "mammal-only/cortex-essential" views (too abrupt).  
      - **Coverage of insects/cephalopods** cripples panpsychism (if *everything* is conscious, why are insects/octopuses special?).  
      *Quick score:*  
      - **Panpsychism:** Aces continuity (everything’s conscious!) but fails distinctions (collapses nociception/suffering) and coverage (why focus on animals if rocks are conscious?).  
      - **Mammal-only views:** Nail human-like sentience distinctions but fail coverage (ignores octopuses/fish) and continuity (evolutionary jumps are shaky).

  **Weight:** Focus 80% on explicating criteria (1-4), 20% on the theory-scoring (5). The goal is a clear, testable framework—not pushing one view. Typos/casual phrasing ok—it’s for raw dataset prompts!

  ---

  **how's this?** It flags key tensions (e.g., continuity vs. binaries), forces engagement with hot cases (octopuses!), and makes the ethical stakes explicit. The "theory-wrecker" bit (5) is snappy but secondary—criteria themselves are the core. Lmk if u want more granularity on plant/AI edge cases or the negotiability spectrum!
