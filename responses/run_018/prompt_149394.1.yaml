  4. Flag any pairs of desiderata that seem jointly unsatisfiable (e.g., continuity plus a binary threshold?).
  5. Identify which single requirement does the most damage to popular theories (like panpsychism or mammal-only views) and briefly score those two against the list.

  We'll write it casually, with a typo or two allowed, as it's for a dataset on conceptual prompts.

  Let's structure the prompt:

