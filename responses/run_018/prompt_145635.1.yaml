  First, commitment (1) says that hypocrisy undermines standing only if it's self-exempting. Simply failing to meet a norm isn't enough; it's about applying the norm to others while exempting yourself. That makes sense because hypocrisy involves a double standard.

  Then (2) introduces normative residue. Even if a parent is dishonest professionally, they still have standing to blame their child for dishonesty. The parental role retains authority despite unrelated moral failures. This is where the idea of normative residue comes in—certain roles have residual authority that isn't completely negated by other wrongs.

  Commitment (3) deals with structural injustice. Beneficiaries of an unjust system lack standing to blame participants, even if they oppose the system and don't self-exempt. The issue here is systemic complicity, not personal hypocrisy. But this seems to conflict with (1) because (1) requires self-exempting hypocrisy to lose standing, but here standing is lost without it.

  (4) focuses on the purpose of blame: communicating shared norms, not asserting moral superiority. This supports (1) because if blame is about shared expectations, self-exempting hypocrisy directly contradicts that shared commitment. But it might conflict with (3) if beneficiaries share the norm against the injustice but still lack standing.

  (5) states that reform restores standing for different wrongs but never for the same fault. So if you were dishonest, you can blame others for cruelty but not for dishonesty. This seems consistent with (1) but may clash with (2) where normative residue allows blaming the same fault (dishonesty) despite unrelated failures.

  The main tensions I see are between (3) and (1), and between (2) and (5). For (3) and (1), structural injustice removes standing without self-exemption, which (1) doesn't account for. The user might need to adjust (1) to include systemic factors. For (2) and (5), normative residue allows blaming the same fault (like dishonesty in parenting) even though (5) says you can never blame for the same fault. Maybe the parental role is an exception, or (5) needs refinement to exclude role-based contexts.

  Also, (4) and (3) might conflict because if blame is about shared norms, beneficiaries might share the norm but still lack standing due to complicity. The user could argue that in structural injustice, the beneficiaries' complicity prevents genuine shared norm commitment, aligning with (4).

  To save the package without dropping normative residue, the cheapest fix is redefining (1) to include systemic complicity as a standing defeater. This resolves the (1)-(3) tension. For (2)-(5), clarifying that normative residue overrides (5) in specific roles might work, though it could make (5) seem less universal. Alternatively, limit (5) to cases without role-based residue.

  The user's deep needs might include defending normative residue as crucial for roles like parenting, while addressing structural injustice sensitively. They might also want a coherent system that handles both personal hypocrisy and systemic issues without contradictions. Ensuring the purpose of blame remains communicative rather than punitive is probably central to their view.
answer: |-
  Your framework is sophisticated but contains genuine tensions—some severe, others manageable. Below, I analyze compatibility between commitments, rank tensions by severity, propose cheapest revisions, and defend a revised package that retains normative residue. For clarity, I reference your commitments as:  
  **(1)** Self-exempting hypocrisy defeats standing; mere failure does not.  
  **(2)** Normative residue preserves role-based standing (e.g., parental) despite unrelated failures.  
  **(3)** Structural complicity defeats standing *without* self-exemption.  
  **(4)** Blame communicates shared norms, not superiority.  
  **(5)** Reform restores standing for *different* wrongs, never identical ones.  

  ---

  ### **Step 1: Tension Analysis**  
  I identify **two severe tensions**, **one moderate**, and **one apparent conflict** that dissolves on inspection.  

  | Tension Pair          | Severity | Nature of Conflict                                                                 |  
  |-----------------------|----------|------------------------------------------------------------------------------------|  
  | **(3) vs. (1)**       | ⚠️ **Severe** | (3) voids standing for structural complicity *without self-exemption*, but (1) requires self-exemption for standing loss. Contradicts core logic. |  
  | **(2) vs. (5)**       | ⚠️ **Severe** | (2) lets a parent blame dishonesty *despite their own dishonesty* (unrelated), but (5) bars blaming *anyone* for "the very fault one once shared." Direct clash over identical wrongs. |  
  | **(3) vs. (4)**       | ⚠️ **Moderate** | (3) denies standing to blame structural wrongs, but (4) frames blame as *shared norm communication*. If beneficiaries share anti-injustice norms, why can’t they communicate them? Requires nuanced reconciliation. |  
  | **(1) vs. (5)**       | 🔄 **Apparent** | *No conflict*: (1) governs hypocrisy-based standing loss; (5) governs reform-based restoration. Synergistic (e.g., reform "cleans hands"). |  

  ---

  ### **Step 2: Resolving Tensions (Cheapest Revisions)**  
  #### **Severe Tension: (3) vs. (1)**  
  - **Conflict**: (3) claims beneficiaries of injustice lack standing *even if they oppose the system* (no self-exemption), but (1) states standing is lost *only* via self-exempting hypocrisy.  
  - **Cheapest Revision**: **Amend (1) to include structural complicity as a standing defeater**.  
    ```diff  
    - (1) Standing is fundamentally undermined *only* by self-exempting hypocrisy.  
    + (1) Standing is fundamentally undermined by self-exempting hypocrisy *or complicity in structural injustice*.  
    ```  
  - **Cost**: Weakens the purity of your "clean hands" condition by adding a non-hypocrisy-based defeater. Justified by (3)’s focus on *systemic authority*: even non-hypocritical blame from complicit agents undermines the communicative function (per (4)).  

  #### **Severe Tension: (2) vs. (5)**  
  - **Conflict**: (2) permits a dishonest parent to blame a child for dishonesty (normative residue), but (5) states one *never* regains standing to blame for "the very fault." Parental standing here violates (5).  
  - **Cheapest Revision**: **Limit (5) to non-role-based contexts**.  
    ```diff  
    - (5) ... one never regains standing to blame others for the very fault...  
    + (5) ... one never regains standing to blame others for the very fault *except where role-based normative residue applies*.  
    ```  
  - **Cost**: Reduces (5)’s universality. Normative residue now trumps (5) for role-bound blame (e.g., parenting). Defensible if roles create distinct normative spheres (e.g., parental authority over children is non-fungible).  

  #### **Moderate Tension: (3) vs. (4)**  
  - **Conflict**: If blame communicates shared norms (4), why can’t anti-injustice beneficiaries (who share the norm) blame participants? (3) forbids this.  
  - **Cheapest Revision**: **Clarify that structural complicity corrupts the *communicative act***.  
    - Add to (3): *"Because their complicity undermines the credibility of invoking shared norms, even if they affirm them."*  
  - **Cost**: Minimal. Aligns with (4): complicit agents cannot credibly communicate norms they materially undermine (e.g., a wealthy environmentalist blaming poor workers for factory jobs while investing in fossil fuels).  

  ---

  ### **Step 3: Can the Package Be Saved with Normative Residue?**  
  **Yes, with two revisions:**  
  1. **Revise (1)** to include structural complicity as a standing defeater.  
  2. **Revise (5)** to exclude role-based contexts governed by normative residue.  

  **Why this works**:  
  - Normative residue **(2)** remains central, resolving the (2)/(5) clash by carving out exceptions for roles.  
  - Structural complicity **(3)** is integrated into hypocrisy-adjacent defeaters (revised (1)), preserving coherence.  
  - Blame’s communicative function **(4)** is upheld: residue ensures role-based blame isn’t about superiority, while revised (1)/(3) ensure systemic/complicit agents cannot credibly communicate norms.  
  - (5) retains force outside roles (e.g., a reformed thief can blame embezzlers but not shoplifters).  

  **If unwilling to revise (5)**, drop normative residue—but this guts your core innovation. **If unwilling to revise (1)**, drop (3)—but this undermines structural justice insights. The proposed revisions are cheaper and preserve your key ideas.  

  ---

  ### **Definite Position**  
  Your package is **tenable with revisions** that retain normative residue. The **single most effective revision** is **amending (1) to include structural complicity**, as it resolves the severest tension ((1)/(3)) and indirectly strengthens (3)/(4) coherence. While (2)/(5) requires separate revision, it is less urgent—normative residue’s role-specificity already implies (5) isn’t absolute. This approach best balances theoretical integrity with real-world applicability (e.g., parenting, structural critique).  

  **Final Revised Commitments**  
  > (1) Standing is undermined by self-exempting hypocrisy *or complicity in structural injustice*.  
  > (2) Parental role generates normative residue, preserving standing for unrelated failures.  
  > (3) Structural beneficiaries lack standing due to complicity (*even without self-exemption*).  
  > (4) Blame communicates shared norms.  
  > (5) Reform restores standing for different wrongs, but *not identical ones* except where normative residue applies.
