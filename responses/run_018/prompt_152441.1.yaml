prompt: |-
  hey, i'm trying to map out what any theory of guilt vs. shame actually has to deliver if it's not going to be another just-so story. i want the full desirata: the specific cases it must handle right (private guilt over breaking a promise vs. shame at being seen as incompetent), the distinctions it can't collapse (feeling bad vs. being moved to repair, self-evaluation vs. social exposure), and whether it has to make sense of cross-cultural variation without just labeling societies "guilt cultures" or "shame cultures". also there's this framing i'm playing with -- maybe the core difference isn't object (act vs. self) but temporal orientation: guilt faces backward to close a specific breach, shame faces forward into an anticipated social future. if that's on the table, then a culture "choosing" one over the other isn't just picking an emotion, it's restructuring the time-horizon of moral education. does a decent theory need to accomodate that? lay out the requirements, mark which are hard constraints vs. camp preferences, and tell me which single desideratum does the most damage to the standard evolutionary-psych and social-constructionist accounts. no bibliography needed -- i just want the reasoning.
reasoning: |-
  Okay, the user is diving deep into theories of guilt versus shame and wants a rigorous framework to evaluate any theory. They're clearly frustrated with superficial "just-so stories" and want concrete criteria. Let me unpack their query.

  First, they mention specific cases any theory must handle: private guilt over a broken promise versus shame at perceived incompetence. That's crucial because most theories stumble on the private/public distinction. They also insist on preserving key distinctions like feeling bad versus being motivated to repair, and self-evaluation versus social exposure. These seem non-negotiable – any theory collapsing these probably fails.

  The cross-cultural point is sharp. They reject simplistic "guilt culture/shame culture" labels. A good theory must explain variation without pigeonholing societies. That's a hard constraint because many existing theories rely on this dichotomy. 

  Their temporal orientation idea is fascinating – guilt as backward-looking (fixing a breach) versus shame as forward-looking (anticipating social judgment). If valid, this reframes cultural differences as time-horizon choices in moral education. The user seems invested in this angle, so any theory should at least accommodate it, even if not center it. 

  Now, assessing their unspoken needs: They're likely an academic or deep thinker constructing a novel framework. Their frustration with evolutionary psych and social constructionism suggests they've seen too many reductive accounts. They want a theory that's both nuanced and testable – no hand-waving. The temporal lens might be their original contribution, so they'll need feedback on whether it's essential or optional. 

  The hardest constraint is probably explaining cross-cultural fluidity without stereotypes. Evolutionary accounts often imply universals, while constructionists overemphasize difference – both struggle here. The temporal perspective could bridge this, showing how cultures emphasize different time horizons without essentializing. 

  The killer desideratum? Cross-cultural variation. It wrecks standard accounts: evopsych can't explain why shame dominates some societies if guilt is "natural," while constructionists often default to cultural binaries. A theory explaining when/why cultures foreground guilt or shame – perhaps via institutions, social density, or mobility – would stand out.
answer: |-
  Here's a breakdown of the rigorous requirements for a robust guilt/shame theory, separating hard constraints from preferences, and pinpointing the critical challenge:

  **Core Requirements (Hard Constraints - Failure Means Theory is Insufficient):**

  1.  **Distinguish Private Transgression vs. Public Deficiency:** *Must* cleanly handle the core cases:
      *   **Guilt:** Intense private distress over a *specific act* violating one's own internal standards (e.g., breaking a promise alone in a room, cheating anonymously). Focus is on the *deed*.
      *   **Shame:** Acute distress arising from the (real or imagined) perception of a *global self-defect* by others (e.g., being seen as incompetent, weak, unworthy). Focus is on the *self* exposed.
      *   *(Failure = Collapses core phenomena)*

  2.  **Preserve Motivational Distinction:** *Must* account for the divergent action tendencies:
      *   **Guilt:** Motivation is primarily *reparative* or *confessional* (confess, apologize, fix the specific wrong). Action is *outward*.
      *   **Shame:** Motivation is primarily *concealment* or *withdrawal* (hide, avoid, escape scrutiny, sometimes aggression). Action is often *inward* or *defensive*.
      *   *(Failure = Makes the emotions functionally identical, contradicts evidence)*

  3.  **Explain Self vs. Social Locus:** *Must* articulate why guilt feels like an internal moral alarm ("*I* did wrong"), while shame feels like an external social spotlight ("*They* see me as flawed"). This isn't just about audience presence, but the *source* of the evaluation triggering distress.
      *   *(Failure = Overlooks a fundamental phenomenological difference)*

  4.  **Account for Cross-Cultural Variation Without Essentialism:** *Must* explain *why* guilt or shame might be more prominent, accessible, or effective in certain contexts/societies *without* resorting to static labels ("guilt culture"/"shame culture"). Needs mechanisms showing how:
      *   Social structures (kinship density, anonymity, mobility).
      *   Moral frameworks (emphasis on rules vs. honor/face, individualism vs. collectivism *dimensions*, not types).
      *   Child-rearing practices.
      *   ... *dynamically* shape the prevalence, expression, and function of *both* emotions within individuals and groups.
      *   *(Failure = Perpetuates stereotypes, ignores fluidity and intra-cultural variation)*

  **Important Accommodations (Strong Preferences - Theory is Weaker Without Them):**

  5.  **Handle Blended/Complex Experiences:** Should acknowledge situations where guilt and shame co-occur or blur (e.g., guilt over an act *leading* to shame about the revealed character flaw; "shameful guilt" over feeling guilty for something socially condoned).
  6.  **Address Intensity and Pathology:** Explain variations in intensity (mild remorse to pathological guilt; embarrassment to paralyzing shame) and how dysregulation contributes to psychopathology (e.g., depression, anxiety, narcissism).
  7.  **Integrate Developmental Trajectory:** Show how the capacity for guilt and shame emerges, differentiates, and is shaped from childhood through adulthood.

  **Your Temporal Orientation Idea:**

  *   **Accommodation:** A strong theory *should* be able to incorporate this perspective as a *potential mechanism* or *core feature*, not necessarily the *only* distinction.
  *   **Value:** It's powerful because:
      *   **Guilt (Backward):** Focuses on repairing a specific past breach ("I broke X, I must fix X/atone for X"). Closure-oriented.
      *   **Shame (Forward):** Focuses on managing future social perception and status ("*What will they think of me now?* How can I avoid being seen like this again?"). Prevention/Identity-management oriented.
  *   **Cultural "Choice" as Time-Horizon:** This is insightful. Framing cultural differences as emphasizing either:
      *   **Guilt-Promoting:** Focus on repairing past wrongs, rule adherence, individual accountability. Moral education emphasizes consequences of *actions* and restitution.
      *   **Shame-Promoting:** Focus on maintaining social harmony, upholding reputation/face, anticipating future judgment. Moral education emphasizes vigilance over *presentation* and social consequences.
      *   This reframes it from just "different emotions" to "different temporal strategies for social cohesion and individual regulation." A robust theory *should* be compatible with this framing.

  **The Killer Desideratum (Damages Standard Accounts):**

  **#4: Account for Cross-Cultural Variation Without Essentialism.**

  *   **Why it Wrecks Standard Accounts:**
      *   **Evolutionary Psychology (Standard Flavors):** Often posits guilt/shame as universal adaptations. While acknowledging variation, it struggles to explain *why* societies would develop such starkly *different* dominant moral emotional systems if one were universally optimal. Tendency to fall back on "environment of evolutionary adaptedness" arguments that don't cleanly map onto observed cultural diversity or change. Often implies shame is "primitive" and guilt "advanced," which is empirically and ethically dubious.
      *   **Strong Social Constructionism:** While adept at describing cultural differences, it often struggles to explain the *persistent underlying structures* of the emotions themselves (why does private guilt over a broken promise feel *similar* across many diverse cultures? Why does shame universally involve hiding?). Over-emphasis on difference can lead to neglecting the shared psychological architecture that allows these emotions to exist *as recognizable categories* cross-culturally. The "shame culture/guilt culture" dichotomy *is* often a constructionist crutch.
  *   **The Damage:** This requirement forces the theory to **simultaneously** explain:
      1.  The deep-seated, recognizable psychological core of guilt and shame as distinct experiences.
      2.  How socio-cultural forces powerfully sculpt which emotion is elicited more readily, how it's expressed, what triggers it, and its relative importance *without* making cultures monolithic types.
      3.  The *functional flexibility* – why both emotions persist and can be adaptive (or maladaptive) in different contexts.

  **In essence:** A theory must bridge the universal human capacity for these emotions with the incredible cultural plasticity in their deployment and significance. It must avoid both biological determinism (ignoring culture) and cultural relativism that dissolves the phenomena (ignoring shared psychology). **Explaining *how* culture dynamically shapes the *expression, triggers, and relative salience* of these core emotional potentials, rather than creating fundamentally different emotions or labeling whole societies, is the hardest and most damaging requirement for simplistic existing accounts.** Your temporal orientation idea offers a promising *way* for a theory to meet this requirement by linking emotional focus to culturally mediated time-horizons of moral concern.
