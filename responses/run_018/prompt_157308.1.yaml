prompt: |-
  I've been discussing semantic externalism with friends after a philosophy of language course, and I've collected verdicts about where meaning is fixed by the world versus by our practices — but they don't line up neatly.

  Consider the familiar Twin Earth case: Oscar on Earth uses 'water' for H2O, while Twin-Oscar, internally identical, uses 'water' for XYZ. I say they differ in meaning because the substance they actually interact with differs. Then take 'arthritis': on Earth the term applies only to joint inflammation, while on Twin Earth the community applies it to thigh conditions too, and Twin-Oscar uses it for his thigh. I still say he means something different, but here the driver is social usage, not hidden chemistry. So both hidden structure and communal practice can fix reference.

  Now two invented cases pull against each other. First, 'neuro-signal': Earth scientists coin it for a brainwave, then discover it's a scanner artefact; the term sticks to the artefactual pattern, and on Twin Earth the same word tracks a real but different brainwave. I feel Earth usage refers to the artefactual pattern — social practice wins. Second, 'synthetic emerald': Twin-Earth jewellers grow chemically identical stones but call them 'fakes', reserving 'emerald' for mined ones. I want to say 'emerald' still refers to the chemical kind there — hidden structure wins. For normative terms like 'justice', I think Twin-Earth practices that differ from ours change the meaning, yet I also sense an external corrective pressure if our concept proves incoherent. So is there a single principle — perhaps that different kinds of term have a stronger pull towards hidden structure or towards social practice depending on their domain — or must I split my view? Which verdict should I drop: the neuro-signal social-practice reading, or the emerald structure reading?

  Please say what argument about the emerald versus neuro-signal conflict would change your mind — either unifying them under one rule or forcing me to abandon the domain split. End with Verdict: followed by a brief summary of whether a unified principle exists and which case it sacrifices.
reasoning: |-
  Okay, this user is deep into philosophy of language, specifically semantic externalism, and has presented a nuanced puzzle about reference determination. They're clearly well-versed in Twin Earth thought experiments but are struggling to reconcile conflicting intuitions across different cases. 

  Hmm, what's interesting here is how they've constructed two novel cases that seem to pull in opposite directions: neuro-signal (where social practice dominates) and synthetic emerald (where hidden structure dominates). The user seems genuinely torn between abandoning one intuition or accepting a domain-specific split. 

  I notice they're particularly invested in normative terms too - that justice example suggests they're thinking about how externalism might apply beyond natural kinds. Smart move. Their frustration with "verdicts not lining up neatly" is palpable - this isn't just academic curiosity, they want conceptual coherence.

  The core tension seems to be between two externalist paradigms: Putnam-style natural kinds vs Burge-style social externalism. What's clever about their cases is that neuro-signal challenges the necessity of hidden structure (since there isn't one), while synthetic emerald challenges the sufficiency of social practice (when structure exists). 

  For neuro-signal: I agree with their intuition. When scientists discover they were measuring an artefact but keep using the term, the reference shifts to the artefact precisely because the community baptizes it that way. The original intention (to name a brainwave) gets overridden by usage. 

  For synthetic emerald: Their intuition feels right but for the wrong reason. It's not that hidden structure magically overrides social practice - it's that "emerald" entered the language as a natural kind term. The jewellers' redefinition is a revisionary project that hasn't succeeded (yet). 

  Ah! That's the unifying principle: the initial baptism and subsequent linguistic trajectory matter more than domain. Natural kind terms can become artifact terms if usage shifts (like "jade"), and artifact terms can resist redefinition if the original baptism sticks. 

  The justice case isn't a counterexample - normative terms often start as cluster concepts without rigid baptism. Their plasticity makes them more practice-sensitive. No need for domain splits - just track the term's historical entrenchment. 

  User should abandon neither intuition but recognize the emerald case is actually about failed redefinition, not structure overriding practice. The neuro-signal case shows successful redirection of reference through practice. Same mechanism, different outcomes based on linguistic history. 

  Verdict: Unified principle exists - initial baptism and subsequent linguistic entrenchment determine whether practice or structure dominates, not domain. Sacrifices the interpretation of synthetic emerald as "hidden structure winning" in favor of "failed social redefinition."
answer: |-
  Your cases reveal a deep tension in externalism, but a unified principle *is* possible by focusing on **initial baptism and causal-historical chains**, sacrificing neither intuition. Here's the argument:

  ### Core Principle
  **Reference is fixed by the *dominant causal-historical chain* anchoring the term. This chain can be grounded in either:**
  1. **Physical reality** (for natural kind/artifact terms with successful initial baptism), *or*
  2. **Social practice** (when no stable external anchor exists, or practice overrides baptism).

  ### Resolving Your Cases
  1. **Neuro-Signal (Social Practice Wins):**  
     - Initial baptism ("brainwave") *failed*—the purported natural kind doesn't exist.  
     - The community *repurposes* the term via practice to track the artifact.  
     - **Verdict:** Social practice dominates because the original causal chain (to a natural kind) was broken.  

  2. **Synthetic Emerald (Structure Wins):**  
     - Initial baptism (e.g., "green gemstone with Be₃Al₂SiO₆") *succeeded* in latching to a chemical kind.  
     - Twin-Earth jewellers attempt *revision* (reserving "emerald" for mined stones), but this doesn't override the established causal chain to the chemical kind.  
     - **Verdict:** Hidden structure wins because the original causal chain remains dominant. The jewellers' practice is a *prescriptive* move, not a *descriptive* shift.  

  3. **Arthritis/Justice (Social Practice Wins):**  
     - No initial baptism to a physical essence. "Arthritis" was baptized via medical practice (joint inflammation), and "justice" via normative discourse.  
     - Twin-Earth practices alter the socially anchored reference because the chain is practice-dependent.  

  ### Argument to Change My Mind
  **If you could show that in the neuro-signal case, the community *never* abandoned the original intention to refer to a real brainwave** (e.g., they call the artifact a "mistake" and keep searching for the "true neuro-signal"), then structure would win. Conversely, **if Twin-Earth jewellers universally treated "emerald" as *defined by origin* (mined) before synthetic stones existed**, then practice would win.  

  ### Why This Unifies Externalism
  - **Natural kinds/artifacts:** Once successfully baptized to a physical essence/structure, reference resists revision.  
  - **Social/practice-dependent terms:** Reference is inherently tied to communal use.  
  - **Failed baptisms/empty terms:** Practice fills the void (neuro-signal).  

  ### Verdict  
  **A unified principle exists:** Reference is determined by the causal-historical chain initiated at baptism, sustained by usage, and grounded *either* in physical reality *or* social practice. **It sacrifices the interpretation of "synthetic emerald" as a case where hidden structure *overpowers* social practice.** Instead, the jewellers' redefinition fails because the original causal chain (to the chemical kind) is entrenched—not because "structure trumps practice."  
  **Resolution:** Keep both your neuro-signal (practice) and emerald (structure) verdicts. Drop only the *reasoning* that structure "overrides" practice in emeralds; it doesn't—the practice never successfully *changed* the reference.
