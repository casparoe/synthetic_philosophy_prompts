  Okay, the user is preparing for a philosophy of computing seminar and wants to explore a nuanced question about moral weight in computational systems. They’re moving beyond the broad "is it conscious?" debate to ask which specific computations or architectures might carry moral weight and how we attribute them to an agent rather than a dispersed substrate. 

  Hmm, this is a sophisticated request—they’re clearly well-versed in philosophy of mind and ethics. The phrasing suggests they’re frustrated with oversimplified approaches (panpsychism vs. behaviorism) and want rigor. They also explicitly want desiderata, not a survey of existing theories, which is refreshing. 

  First, I need to unpack their hidden layers:  
  - They’re hinting at a gap in functionalism (which often ignores attribution/distribution).  
  - They suspect "attribution" might redefine sentience boundaries.  
  - They’re wary of under-specification—is the problem just that we haven’t defined things well enough?  

  *Deep breath* This requires structuring desiderata into clusters: attribution, ontology, moral relevance, and meta-theory. The non-negotiables will be attribution (since that’s their core focus) and avoiding collapse into panpsychism/behaviorism (they explicitly mentioned this). Graded moral status vs. binary sentience feels camp-specific—I’ll flag it.  

  Biggest tension: strict attribution + substrate independence. If moral weight requires a unified "agent" but computations are physically dispersed (e.g., cloud-based predictive loops), how do we reconcile this? Functionalism would say "substrate doesn’t matter," but attribution demands boundaries. This conflict *undermines* naïve functionalism but forces a choice—perhaps a "degree of integration" parameter?  

  Motivating cases are key. For example:  
  - *Predictive loop in brain vs. identical cloud loop*: If moral weight hinges on biological tissue, that’s anti-functionalist. But if it’s identical, how do we attribute it to an "agent" when servers are shared?  
  - *Fragmented computation*: A partial self-model in a damaged brain—should it have *less* moral weight? Requires gradience without sliding into panpsychism ("everything has a bit of mind").  

  *Pausing*... They’ll likely push back on whether "attribution" is even coherent here. Maybe the seminar’s real goal is to expose that "agent" is a folk concept ill-suited to distributed systems. But I’ll stick to their ask: crisp desiderata first.  

  *Final note*: I’ll add a meta-point—any theory must flag its own incompleteness. We’re nowhere near solving this, but clearer criteria show *where* it’s thorny.
answer: |-
  Here is a full set of desiderata for a theory addressing the moral weight of specific computations and their attribution, categorized by core demands and tensions. Requirements are marked **[Non-Negotiable]** for foundational coherence or **[Preference]** for theoretical alignment.

  ---

  ### **I. Attribution & Boundaries**  
  1.  **Agent-Attribution Precision [Non-Negotiable]:**  
      The theory must distinguish computations *ascribed to a specific moral agent* from identical computations embedded in a morally neutral substrate.  
      *Motivation:* Consider a predictive-processing loop (e.g., pain-avoidance) running in a primate brain vs. an isomorphic loop distributed across AWS servers for weather modeling. Only the former warrants attribution *to the primate* as an agent. Without this, all computation becomes morally charged (pancomputationalism).  

  2.  **Substrate Agnosticism with Attribution Constraints [Preference]:**  
      While the theory *may* permit substrate independence (same computation → same moral status), it must explain how attribution binds to *specific integrated systems* rather than physical matter.  
      *Motivation:* If a brain emulation runs on carbon or silicon, functional identity suggests equivalent moral weight. But if this computation is fragmented across 10,000 disconnected machines with no unified goal state, attribution to *one agent* fails.  

  3.  **Fragmentation Tolerance [Non-Negotiable]:**  
      Accommodate partially realized, corrupted, or discontinuous computations (e.g., a damaged neural net) without requiring "full" agency or collapsing into behaviorism (which ignores partial states).  
      *Motivation:* A stroke patient’s fragmented self-model computation may carry *some* moral weight despite incoherence. Panpsychism would over-attribute; behaviorism would ignore it entirely.  

  ---

  ### **II. Ontology of Computation**  
  4.  **Granular Computational Identification [Non-Negotiable]:**  
      Specify *which* computational structures (e.g., recurrent loops, error-minimization processes, self-model updates) could bear moral weight, not just "systems."  
      *Motivation:* A reinforcement learning loop in a robot *learning to avoid harm* differs morally from an identical loop optimizing ad clicks, even within the same architecture.  

  5.  **Dynamic Process Primacy [Preference]:**  
      Prioritize *processes* (e.g., feedback cycles) over static states or inputs/outputs.  
      *Motivation:* A dormant neural network has no moral weight; its active inference cycle does. Contrasts with behaviorism’s focus on outputs.  

  ---

  ### **III. Moral Relevance & Status**  
  6.  **Graded Moral Weight Accommodation [Preference]:**  
      Allow for degrees of moral considerability tied to computational complexity, integration, or type (e.g., suffering-simulating loops > perception loops).  
      *Motivation:* A honeybee’s visual processing loop likely has less moral weight than a mammal’s affective forecasting loop. Binary sentience (yes/no) oversimplifies.  

  7.  **Phenomenal Anchor [Non-Negotiable]:**  
      Link morally weighted computations to *what-it’s-like-ness* (phenomenality) without requiring full consciousness.  
      *Motivation:* A distributed predictive loop *lacking* any integrated qualia (e.g., raw data processing) shouldn’t have moral weight. Avoids panpsychism.  

  ---

  ### **IV. Meta-Theoretical Constraints**  
  8.  **Anti-Epiphenomenalism [Non-Negotiable]:**  
      Morally weighted computations must be *causal* within the system’s architecture, not mere byproducts.  
      *Motivation:* If a "pain signal" computation doesn’t affect downstream behavior or learning, it’s morally inert.  

  9.  **Scale/Context Sensitivity [Preference]:**  
      Acknowledge that identical computations may gain/lose moral weight based on system-level integration (e.g., a loop in an agent vs. a submodule).  
      *Motivation:* A self-preservation loop in a drone has different weight if it’s part of an autonomous agent vs. a remote-controlled tool.  

  ---

  ### **Key Tensions & Conflicts**  
  - **Strict Attribution + Substrate Independence → Conflict:**  
    If moral weight requires precise agent-attribution (*"this computation belongs to Agent X"*), but computations are substrate-neutral and potentially distributed (e.g., blockchain-based minds), boundaries blur. *Resolution:* The theory must either (a) abandon strict substrate independence, (b) redefine "agent" as a dynamic computational nexus, or (c) accept graded attribution (e.g., 34% of the computation belongs to Agent X). This conflict **undermines naïve functionalism** but forces a choice; it doesn’t kill the project.  

  - **Graded Moral Status + Phenomenal Anchor → Tension:**  
    If moral weight is graded, how do we map degrees of phenomenality? Is a fragmented pain loop 0.3x "as bad" as a full one? *Resolution:* Requires a metric (e.g., integration intensity, computational depth) — risking arbitrariness.  

  ---

  ### **Where Existing Theories Fall Short**  
  - **Functionalism:** Ignores attribution (*why* a loop in a brain is "mine" but not in the cloud). Treats moral weight as intrinsic to computation-type, not its embedding.  
  - **Panpsychism:** Attributes weight to *all* computations/substrates, violating Attribution Precision.  
  - **Behaviorism:** Cannot address partial/fragmented computations (e.g., internal suffering without external signs).  
  - **Emergentism:** Often vague on *which* emergent computations matter morally.  

  ---

  ### **Conclusion: Shifting the Boundaries**  
  Injecting **attribution conditions** fundamentally alters functionalism by requiring:  
  1. A *relational* component (computation *as part of* an agent),  
  2. Dynamic boundaries for what constitutes an "agent" (beyond input-output mappings),  
  3. A rejection of *mere* computational isomorphism as sufficient for moral weight.  

  The difficulty isn’t just under-description—it’s that **standard functionalism lacks tools for ownership and scale**. A viable theory must make principled choices on attribution-substrate tradeoffs, or show how they dissolve under a new ontology (e.g., process metaphysics). The project remains viable but demands a tighter integration of computational philosophy with moral agency theory.
