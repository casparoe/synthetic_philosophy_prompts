prompt: |-
  I've been digging into the Jeffrey conditionalization literature for a feature I'm pitching—mostly that long back-and-forth about updating beliefs when your evidence is noisy or vague, like a climate sensor that reports a range instead of a precise temperature. What's strange is that the debate feels totally stuck. The Jeffrey camp says you redistribute credence across a partition using your new direct probabilities; the rigid Bayesians say thats cheating, you should only condition on sharp propositions and treat vagueness as ignorance about which one is true. But both sides agree on the formalism, they agree on every toy case—the blurry thermometer, the ambiguous card draw, the satellite image with fuzzy resolution—and yet for decades nobody's budged. Is this actually a substantive disagreement about rational norms, or is it verbal, with both sides using evidence to mean different things? Or are they just answering different questions, decision theorists asking what you ought to do versus cognitive scientists asking what brains actually do?

  There's also this niche partition-dependence problem that doesn't get talked about much outside specialist circles: depending on how you slice up the possibility space—temperature ranges versus climate regimes—the same vague report can push your posteriors in totally different directions, and neither camp seems to have thier own non-circular rule for picking the right partition. So I'm trying to figure out: what's the real structure of this stall? Is there a hidden empirical question about human reasoning, or is the whole framing ill-posed because uncertain observation isn't one unified phenomenon? And what would count as progress—a formal uniqueness proof, an experiment, or just a clearer distinction? I'd appreciate your answer in American English, please—I'm editing for a US audience, and please don't just dump a bibliography; I need the conceptual diagnosis.
