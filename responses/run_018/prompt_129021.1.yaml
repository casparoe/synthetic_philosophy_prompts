prompt: |-
  I am drafting the theoretical framework for my dissertation on temporal asymmetry in non-equilibrium cosmological settings. Before comparing interpretations, I need the full specification of adequacy conditions. Write the desiderata that any account of the thermodynamic arrow must satisfy: the phenomena it must cover (e.g., monotonic entropy growth in isolated thermal systems, permitted local decreases under gravitational clustering, and the synchronization of psychological and causal arrows), the conceptual distinctions it must not collapse (e.g., between a globally imposed low-entropy boundary condition and locally irreversible dynamics, or between statistical and law-like explanations of asymmetry), and any consistency constraints from statistical mechanics or general relativity it must respect — including whether it can apply to regions lacking a well-defined equilibrium macrostate, such as those bounded by cosmological horizons. Flag pairs of desiderata that seem jointly unsatisfiable, especially whether a purely local dynamical account can accommodate global boundary conditions without a preferred temporal foliation. Briefly indicate how the Boltzmann statistical-mechanical view, a causal-structural view, and retrocausal quantum interpretations fare against these criteria. Keep the focus on the criteria; no bibliography or citation requests.
reasoning: |-
  We are constructing a list of desiderata (adequacy conditions) that any account of the thermodynamic arrow must satisfy. The desiderata should cover:
   1. Phenomena to be explained.
   2. Conceptual distinctions to maintain.
   3. Consistency constraints from physics (statistical mechanics and general relativity).
   4. Flag any pairs of desiderata that might be jointly unsatisfiable.
   5. Brief indication of how three views (Boltzmann, causal-structural, retrocausal quantum) fare against these criteria.

   We structure the desiderata as follows:

   I. Phenomena to Cover
      A. Entropy growth in isolated thermal systems (monotonic on average, with fluctuations).
      B. Permitted local entropy decreases (e.g., under gravitational clustering, or in non-isolated systems).
      C. Synchronization of arrows: the thermodynamic arrow must align with the psychological arrow (our experience of time) and the causal arrow (the asymmetry of causation).
      D. Cosmological context: the arrow must be compatible with the observed expansion of the universe and the initial low-entropy state (the Past Hypothesis).

   II. Conceptual Distinctions to Maintain
      A. Distinction between a globally imposed low-entropy boundary condition and locally irreversible dynamics.
          - The account should not conflate the origin of the arrow (which may be due to boundary conditions) with the local laws (which might be time-symmetric).
      B. Distinction between statistical and law-like explanations of asymmetry.
          - The account should clarify whether the asymmetry is due to probabilistic initial conditions (statistical) or an inherent time-asymmetry in the fundamental laws (law-like).
      C. Distinction between the arrow as a feature of the whole universe and as a feature of subsystems.

   III. Consistency Constraints
      A. Consistency with statistical mechanics: 
          - The account must respect the time-symmetry of the underlying microdynamics (if it is indeed time-symmetric, as in classical mechanics or unitary quantum mechanics).
          - It must account for the Second Law as holding statistically and not absolutely.
          - It must account for the role of the Past Hypothesis (if any) and the role of typicality.
      B. Consistency with general relativity:
          - The account must be compatible with the absence of a preferred foliation in relativity (unless it explicitly requires one).
          - It must be applicable in cosmological settings, including regions bounded by horizons (like de Sitter horizons) where an equilibrium state might not be defined.
          - It should be compatible with the observed large-scale structure of the universe (homogeneity and isotropy on large scales) and the expansion history.
      C. Handling of regions without a well-defined equilibrium macrostate:
          - The account must be able to explain the arrow in regions where the horizon prevents the system from reaching equilibrium (e.g., in a de Sitter universe).

   IV. Potentially Conflicting Desiderata
      - We will flag any tensions, especially between local dynamics and global boundary conditions without a preferred foliation.

   V. Brief Evaluation of Three Views

   Now, we list the desiderata in a structured way and then evaluate the three views.

   Desiderata:

   1. Phenomenological Coverage:
      a) Must explain the observed monotonic (on average) increase of entropy in isolated macroscopic systems that are initially in a low-entropy state.
      b) Must allow for local decreases of entropy (due to fluctuations or in subsystems) without violating the global trend.
      c) Must account for the synchronization of the thermodynamic arrow with the psychological and causal arrows (i.e., why we remember the past and not the future, and why causes typically precede effects).
      d) Must be grounded in the cosmological context: the observed expansion of the universe and the low-entropy initial state (the Past Hypothesis) should play a role.

   2. Conceptual Clarity:
      a) Must not collapse the distinction between the global boundary condition (e.g., the Past Hypothesis) and the local dynamical laws. The account should clarify the role of each.
      b) Must maintain the distinction between statistical explanations (based on initial conditions and typicality) and law-like explanations (fundamental time-asymmetric laws).
      c) Must distinguish between the arrow of time as a universal feature and as a feature of subsystems (which might have opposite arrows in principle, but in practice are synchronized).

   3. Consistency Constraints:
      a) Must be consistent with the time-symmetry (or lack thereof) of the underlying microdynamics. If the microdynamics are time-symmetric (like in classical mechanics or unitary quantum mechanics), then the account must explain the asymmetry without introducing an asymmetric dynamics at the fundamental level.
      b) Must respect the Second Law as a statistical tendency, not an absolute law.
      c) Must be compatible with general relativity: 
          - Avoid reliance on a preferred temporal foliation unless justified by the theory (e.g., in a quantum gravity context).
          - Must function in cosmological settings, including in the presence of horizons (like black holes or cosmological horizons) and in the absence of a global equilibrium state.
          - Must be compatible with the observed large-scale homogeneity and isotropy of the universe.

   4. Handling of Problematic Cases:
      a) Must be able to account for the thermodynamic arrow in regions that are bounded by a horizon and hence cannot reach global equilibrium (e.g., a de Sitter universe with a cosmological horizon).

   5. Potential Conflicts:
      a) Conflict between local dynamics and global boundary conditions: 
          - A purely local dynamical account (without any reference to global conditions) might fail to explain the universal arrow, but an account that relies solely on a global boundary condition might not explain the local irreversibility without a preferred foliation (to define "past" and "future" globally). 
          - In general relativity, without a preferred foliation, it is difficult to impose a global boundary condition (like the Past Hypothesis) that picks out a unique time direction for the entire universe.

   Now, we briefly evaluate three views:

   I. Boltzmann's Statistical-Mechanical View:
      - This view attributes the arrow to a low-entropy initial condition (Past Hypothesis) and the tendency of entropy to increase due to the high-probability evolution toward equilibrium (Boltzmann's H-theorem).
      - Phenomena: 
          a) Explains entropy increase in isolated systems (by typicality) and allows for local decreases (fluctuations).
          b) Synchronization: It relies on the Past Hypothesis to set a global arrow and assumes that we (as cognitive systems) are also part of the same low-entropy start. Hence, our psychological arrow aligns.
      - Conceptual Clarity: 
          a) Clearly distinguishes boundary condition (Past Hypothesis) from dynamics (time-symmetric). 
          b) It is statistical, not law-like.
      - Consistency Constraints:
          a) Respects time-symmetry of microdynamics.
          b) Second Law is statistical.
          c) In general relativity: The Past Hypothesis requires a special initial state for the entire universe. However, without a preferred foliation, it is unclear how to impose this condition. Also, in a universe with horizons, the definition of entropy and the approach to equilibrium becomes problematic (e.g., the entropy of a black hole). The view might struggle with regions without a well-defined equilibrium state.
      - Conflict: The global Past Hypothesis may require a preferred foliation to define the initial state. This conflicts with the general covariance of general relativity.

   II. Causal-Structural View (e.g., based on causal sets or some other fundamental asymmetry in causality):
      - This view posits that the thermodynamic arrow arises from a fundamental causal structure that is time-asymmetric.
      - Phenomena:
          a) Might explain entropy increase as a consequence of the fundamental causal direction.
          b) Synchronization: The causal arrow is fundamental, so the psychological and causal arrows are aligned by construction.
      - Conceptual Clarity: 
          a) May collapse the distinction between dynamics and boundary conditions by making the arrow law-like (fundamental).
          b) It is law-like, not statistical.
      - Consistency Constraints:
          a) If the fundamental dynamics are made time-asymmetric, then it might conflict with the time-symmetry of known microphysics (unless the asymmetry is introduced at a deeper level, such as in quantum gravity).
          b) The Second Law would then be a consequence of fundamental laws, but it is unclear how to account for statistical fluctuations (local decreases).
          c) In general relativity: A fundamental causal structure might be compatible with causal set theory, which is designed to be background independent. However, it is an open question whether such a structure can explain the thermodynamic arrow in all cosmological settings, including horizons.
      - Conflict: The need for a fundamental time-asymmetry might conflict with the time-symmetry of known microphysics.

   III. Retrocausal Quantum Interpretations (e.g., time-symmetric quantum mechanics with retrocausality):
      - These interpretations allow influences from the future to the past, but they typically aim to restore time-symmetry at the fundamental level.
      - Phenomena:
          a) They must explain the apparent asymmetry of entropy increase. One might argue that the asymmetry is due to boundary conditions at both ends (but the future is high-entropy). 
          b) Local decreases might be more naturally accommodated, but the global trend is harder to explain without a special initial condition.
          c) Synchronization: Without a fundamental arrow, explaining why we experience a consistent direction of time is challenging. Often, these interpretations also rely on a boundary condition (e.g., initial low entropy) for the arrow of experience.
      - Conceptual Clarity:
          a) They aim to maintain time-symmetry at the fundamental level, so the distinction between boundary conditions and dynamics is crucial. The arrow would be due to boundary conditions.
          b) Statistical, but might involve both past and future boundaries.
      - Consistency Constraints:
          a) Preserves time-symmetry at the fundamental level (if retrocausality is allowed).
          b) The Second Law would be statistical and might be explained by the initial condition (Past Hypothesis) and perhaps a future condition (but typically the future is high-entropy, so it doesn't help for the past low-entropy).
          c) In general relativity: The need for two boundary conditions (past and future) might be in tension with the lack of a preferred foliation. Also, the role of horizons is unclear.
      - Conflict: The requirement for a future boundary condition (even if it's just a high-entropy one) might be seen as problematic because we don't observe such a condition. Also, without a preferred foliation, imposing two boundary conditions (at the "beginning" and "end") is difficult.

   After listing the desiderata and the evaluations, we note that no view satisfies all desiderata without tensions. The most prominent tension is between the need for a global boundary condition (to explain the universal arrow) and the absence of a preferred foliation in general relativity.

   We now present the full list of desiderata and the evaluations in a structured manner.
answer: |-
  ### Desiderata for an Account of the Thermodynamic Arrow of Time

  #### **I. Phenomena to Cover**
  1. **Monotonic Entropy Growth**: Explain the statistical tendency of entropy to increase in isolated macroscopic systems starting from low-entropy initial conditions, while accommodating rare fluctuations (e.g., Boltzmann fluctuations).
  2. **Gravitational Clustering**: Account for entropy decreases permitted in self-gravitating systems (e.g., galaxy formation) without violating the global trend.
  3. **Synchronization of Arrows**: Reconcile the thermodynamic arrow with the psychological arrow (memory, perception) and causal arrow (asymmetry of causation), ensuring they align in our observed universe.
  4. **Cosmological Entropy Gradient**: Ground the arrow in the universe’s global evolution, particularly the low-entropy Big Bang (Past Hypothesis) and subsequent expansion.

  #### **II. Conceptual Distinctions to Maintain**
  1. **Boundary Conditions vs. Local Dynamics**: Distinguish between the global low-entropy initial condition and local time-symmetric or irreversible dynamics. Avoid conflating the *origin* of asymmetry (boundaries) with its *propagation* (dynamics).
  2. **Statistical vs. Law-Like Asymmetry**: Preserve the difference between asymmetry arising from improbable initial conditions (statistical) and asymmetry inherent in fundamental laws (e.g., time-irreversible dynamics).
  3. **Global vs. Subsystem Arrows**: Clarify why subsystems exhibit synchronized arrows despite the theoretical possibility of "baby universes" or regions with opposing arrows.

  #### **III. Consistency Constraints**
  1. **Statistical Mechanics (SM) Compatibility**:
     - Respect time-symmetry of microphysical laws (e.g., Newtonian mechanics, unitary QM).
     - Explain the Second Law as emergent/statistical, not fundamental.
     - Accommodate the Past Hypothesis without ad hoc assumptions.
  2. **General Relativity (GR) Compatibility**:
     - Operate without a preferred temporal foliation (respect diffeomorphism invariance).
     - Apply to horizons (e.g., de Sitter, black hole horizons) where equilibrium is undefined due to information loss or causal disconnection.
     - Handle sectors lacking a global equilibrium state (e.g., eternally expanding cosmologies).
  3. **Quantum Measurement Problem**: Address how asymmetry interfaces with quantum indeterminism (e.g., wavefunction collapse).

  #### **IV. Potential Conflicts Between Desiderata**
  - **Local Dynamics vs. Global Boundaries**: A purely *local* dynamical account (e.g., intrinsic irreversibility) risks failing to explain the universal arrow, as SM requires a global low-entropy past. Conversely, a global boundary condition (e.g., Past Hypothesis) may require a preferred foliation to define "initial" states—violating GR covariance.  
    → **Conflict**: Reconciling GR-compatibility (no foliation) with the need for a global boundary condition.
  - **Statistical SM vs. Law-Like Asymmetry**: If asymmetry is purely statistical (e.g., Boltzmann), it may struggle to justify the *universality* of the arrow without probabilistic circularity. Law-like approaches (e.g., collapse models) risk contradicting time-symmetric microphysics.

  ---

  ### **Evaluation of Representative Views**
  1. **Boltzmannian SM View**:
     - **Strengths**: Covers monotonic growth, gravitational clustering (via phase space), and cosmological gradient (Past Hypothesis). Maintains SM compatibility and statistical/law-like distinction.  
     - **Weaknesses**: Struggles with horizon-bounded regions (no equilibrium state). Synchronization of arrows relies on anthropic reasoning, which may be circular. Requires a global past condition, conflicting with GR foliation-independence.
     
  2. **Causal-Structural View** (e.g., causal sets, time-asymmetric causality):
     - **Strengths**: Naturally synchronizes causal/psychological arrows. May handle gravitational clustering via geometric irreversibility. GR-compatible if based on background-independent structures.  
     - **Weaknesses**: Risks collapsing dynamics/boundary distinction (e.g., if causality is law-like). May impose fundamental time-asymmetry, conflicting with time-symmetric microphysics. Unclear applicability to horizon-limited regions.

  3. **Retrocausal Quantum Interpretations** (e.g., time-symmetric quantum models):
     - **Strengths**: Preserves microphysical time-symmetry; may explain rare entropy decreases via retrocausal influences.  
     - **Weaknesses**: Fails to guarantee monotonic entropy growth (retrocausality permits anti-thermodynamic evolution). Struggles with synchronization (no mechanism to align arrows). Violates the boundary/dynamics distinction by requiring future constraints. GR-incompatible if retrocausal links need a foliation.

  ---

  ### **Summary of Tensions**
  - **Key Unsatisfiable Pair**: A *local dynamical* account cannot accommodate the *global boundary condition* without a preferred foliation (violating GR).  
  - **Quantum Challenge**: All views must clarify whether quantum measurement asymmetry (e.g., collapse) is derivative or fundamental.  
  - **Horizon Problem**: No view fully resolves entropy in horizon-bound regions (e.g., de Sitter space), where equilibrium is undefined and global states are inaccessible.  

  An adequate theory must navigate these constraints while preserving core phenomena and distinctions. The Boltzmann view best satisfies SM constraints but falters on GR compatibility; causal views prioritize synchronization but risk overreach; retrocausal models preserve symmetry but undermine observed irreversibility.
