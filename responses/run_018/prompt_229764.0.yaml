answer: |-
  Here is a specification of requirements for an adequate theory of vagueness, structured as requested. The requirements are derived from core phenomena, logical puzzles, and linguistic behavior, categorized as **Non-Negotiable** (mandatory for any account), **Structural** (must be addressed, even if rejected), or **Parochial** (specific to certain theoretical commitments).

  ### Core Requirements List

  1.  **Sorites Susceptibility:**
      *   **Force/Case:** The Sorites Paradox (e.g., one grain doesn't make a heap; removing one hair doesn't make someone bald) demonstrates that competent speakers accept tolerance principles (small changes don't affect category membership) yet balk at the paradoxical conclusion (e.g., one grain is a heap). Competence alone doesn't resolve it because the tolerance principle *seems* inherent to the meaning of vague terms. *(Case: Heap, Bald Man, Color Series)*
      *   **Category:** **Non-Negotiable.** Any theory must explain how the paradox arises and why it is compelling yet flawed.

  2.  **Borderline Cases & the Borderline/Uncertainty Distinction:**
      *   **Force/Case:** There are cases (e.g., a man with 5,432 hairs) where competent speakers genuinely hesitate to apply a term (e.g., "bald") or its negation, agreeing it's unclear. This is distinct from merely not knowing a fact (e.g., not knowing if a clearly non-bald man dyed his hair); the hesitation stems from the meaning of the term itself, not lack of evidence. *(Case: Mid-series Sorites cases)*
      *   **Category:** **Non-Negotiable.** Accounting for genuine indeterminacy in application is central to vagueness.

  3.  **The Apparent Absence of Sharp Boundaries:**
      *   **Force/Case:** For a vague predicate F and its Sorites series (e.g., 10,000 grains down to 0), it seems impossible to point to a specific adjacent pair (n/n+1 grains) where F definitely applies to n but definitely does not apply to n+1. Intuitively, there is no such "sharp cutoff". *(Case: Any Sorites series)*
      *   **Category:** **Structural.** Theories must explain *why* sharp boundaries seem absent. Epistemicism accepts they exist but are unknowable; others reject their existence.

  4.  **Higher-Order Vagueness:**
      *   **Force/Case:** The transition between definite cases, borderline cases, and definite non-cases itself seems gradual, not sharp. There can be cases where it's borderline whether a case is borderline F (e.g., is a man with precisely 5,000 hairs *clearly* borderline bald, or is *that* status itself unclear?). This seems to iterate indefinitely. *(Case: Edges of the borderline region in a Sorites series)*
      *   **Category:** **Structural.** Theories must account for the *appearance* of blurred boundaries at every level, even if they ultimately explain it away (e.g., as higher-order epistemic uncertainty) or model it finitely.

  5.  **Penumbral Connections:**
      *   **Force/Case:** Meanings constrain relations between vague predicates. If something is red, it cannot be orange on the same precisification; a point cannot be both inside and outside a vaguely bounded region simultaneously. These connections must hold across admissible precisifications. *(Case: Color patches, spatial boundaries)*
      *   **Category:** **Non-Negotiable.** Capturing meaning relations between terms is essential for semantics.

  6.  **Behavior under Negation, Truth, and Determinacy:**
      *   **Force/Case:**
          *   *Negation:* What is the status of "not F" for a borderline F case? Is it also borderline? (Intuition: Often yes). Does "F or not F" hold? *(Case: Borderline case of "bald" → "not bald")*
          *   *Truth:* Is a statement about a borderline case (e.g., "This patch is red") true, false, neither, or something else? How does this relate to the T-schema (""p" is true iff p")? *(Case: Asserting F of a borderline case)*
          *   *Determinacy:* Can we meaningfully say "It is determinate that F(a)"? What is its negation? How does "Definitely F" relate to F and to borderline status? *(Case: Asserting definiteness)*
      *   **Category:** **Structural.** Theories must define the logic/semantics for these operators coherently within their framework.

  7.  **Logical Constraints:**
      *   **Force/Case:** Which classical principles can be retained?
          *   *Bivalence (Every proposition is true or false):* Seems challenged by borderline cases.
          *   *Excluded Middle (F(a) ∨ ¬F(a)):* Seems challenged if borderline cases falsify both disjuncts? Or can it be preserved?
          *   *Classical Validity (e.g., Modus Ponens):* Essential for reasoning, but Sorites seems to use it to derive absurdity.
          *   *T-Schema (""p" is true iff p"):* Cornerstone of truth, but what if p is borderline?
      *   **Category:** **Structural.** Theories must specify which principles hold, which fail, and justify the deviations.

  ### Analysis as Requested

  **1. The Deepest Tension: A Maximally Conflicting Family**
  The sharpest conflict arises from combining:
  *   **Sorites Tolerance (Non-Negotiable):** Small changes don't affect category membership. *(Formally: ∀n (F(n) → F(n+1)) for a Sorites series.)*
  *   **Sharp Verdicts at Endpoints (Non-Negotiable):** F(0) is definitely false, F(10,000) is definitely true.
  *   **Classical Validity (Structural, especially Modus Ponens):** The validity of universal instantiation and modus ponens allows deriving F(0) from F(10,000) via tolerance, a contradiction.
  *   **Bivalence / Excluded Middle (Structural):** If every instance F(n) ∨ ¬F(n) holds, and tolerance is true, the paradox is inescapable without rejecting classical logic. If bivalence holds, borderline cases must be either true or false, seemingly contradicting their nature.

  **The Deeper Tension:** This core clash is amplified by the **Apparent Absence of Sharp Boundaries (Structural)** and **Higher-Order Vagueness (Structural)**. Accepting sharp boundaries (as epistemicism does) violates the intuition of absence. Denying bivalence/excluded middle (as many non-classical theories do) resolves the paradox but faces challenges explaining higher-order vagueness and preserving intuitive reasoning patterns. Insisting on both the intuition of no sharp boundaries *and* classical logic+bivalence forces a highly counterintuitive epistemology (epistemicism). **The fundamental tension is between the *phenomenology* of gradual transition (tolerance, no sharp boundaries, borderline cases, higher-order vagueness) and the *logical* principles of classical reasoning and bivalence.** Satisfying the phenomenology fully seems to require significant logical revision; preserving classical logic fully seems to require explaining away the phenomenology (e.g., as massive ignorance).

  **2. The Single Most Excluding Requirement**
  **Higher-Order Vagueness (Iterating indefinitely).**

  *   **Why it Excludes:** Epistemicism struggles profoundly. If first-order vagueness is ignorance of a sharp boundary, higher-order vagueness becomes ignorance of where the ignorance begins/ends. Explaining indefinite iteration of this meta-ignorance is deeply problematic and strains the "unknowable fact" thesis. Supervaluationism faces the "jolt problem" or regress: Precisifications fix sharp boundaries between F/not-F, but also need boundaries between F/borderline-F and borderline-F/not-F. Admitting precisifications that differ on *these* higher-order boundaries leads to complexity and potential regress (precisifications for precisifications?), threatening the definiteness of "definitely". Many many-valued logics struggle to model indefinite iteration without either collapsing into sharp boundaries at some finite level or becoming computationally intractable/non-compositional.
  *   **Cost Location:**
      *   **Epistemicist:** The cost is in the *epistemology*. They must postulate an infinite hierarchy of unknowable facts about boundaries between definite truth/ignorance, ignorance/definite falsity, and the boundaries of *those* boundaries, etc. This is widely seen as implausible and ad hoc.
      *   **Supervaluationist:** The cost is in the *semantics/logic*. They must either deny genuine higher-order vagueness (claiming the appearance is explained by first-order indeterminacy under higher-order precisification, but settling into definiteness at some level - violating the requirement), or embrace a complex, potentially non-classical meta-theory for the admissibility of precisifications themselves, jeopardizing classical logic and compositionality. Explaining why "Definitely F" isn't itself vague becomes difficult.

  **3. An Overlooked Requirement: Grounding Borderline Truth**
  *   **Requirement:** A theory must explain the *nature* and *ground* of the truth (if any) of a borderline sentence. Specifically, if a sentence "a is F" is true on some admissible precisifications but false on others (e.g., supervaluationism), *what fact does its truth report?* Crucially, why is this *not* simply a form of relativism (truth relative to a precisification), but rather reflects an objective, albeit indeterminate, feature of the world/language? Conversely, if it's false (or truth-valueless), what explains our inclination to sometimes assert it tentatively?
  *   **Force/Case:** Consider asserting "Patch X is red" where X is borderline red/orange. On supervaluationism, this might be true if it's true on *some* precisification, false if false on *some*, or indeterminate if true on some and false on others. If we say it's true (supertrue), what makes it so? The existence of *one* way of sharpening "red" that includes X? But why does *that* fact make the *vague* sentence "Patch X is red" objectively true, rather than just true relative to that one sharpening? The worry is that supervaluationism collapses into a form of relativism disguised as objectivity. Epistemicism avoids this by saying the sentence has a definite truth value grounded in the unknown semantic fact, but faces the unknowability issue. Non-classical theories need to say what their third (or more) truth values *represent ontologically*.
  *   **Why a Requirement, Not Just Preference:** A theory of vagueness must ultimately be a theory of *meaning* and *reality*. It needs to explain *what it is* for a vague sentence to be true, false, or borderline. Simply assigning a technical value (e.g., 0.5) or defining supertruth isn't enough; it needs a metaphysical or semantic grounding that distinguishes vague indeterminacy from ambiguity, context-dependence, or straightforward relativity. Failing this leaves the theory incomplete, unable to connect its formal apparatus to the linguistic and cognitive phenomena it seeks to explain. It addresses the fundamental question: *What is the world like, or how does language hook onto it, when vagueness is present?*

  ### Closing Scoring (Brief)
  *   **Epistemicism:** Scores well on classical logic, bivalence, excluded middle, and arguably penumbral connections (via classical semantics). Struggles massively with apparent absence of boundaries, higher-order vagueness, and grounding borderline inclinations without collapsing into non-factualism. Cost: Radical, multi-level unknowability.
  *   **Supervaluationism:** Scores well on borderline cases, penumbral connections, absence of sharp boundaries (at the object level), and preserving classical logic for "definite" claims. Struggles with higher-order vagueness, the grounding of borderline truth (supertruth vs. relativism), the "jolt" problem, and the counterintuitive falsity of excluded middle instances for borderline cases. Cost: Complex semantics, potential regress, sacrifice of some classical principles (though less than rivals).
  *   **Many-Valued/ Fuzzy Logics:** Score well on modeling borderline cases and gradual transitions intuitively. Struggle profoundly with higher-order vagueness (avoiding sharp boundaries at meta-levels), penumbral connections (defining logical operators to respect them is hard), compositionality, and preserving familiar reasoning patterns (classical validity). Cost: Radical revision of logic, potential counterintuitive results, grounding truth values.
  *   **Contextualism/ Relativism:** Score well on capturing the dynamic, speaker-relative aspects of vagueness use. Struggle with the objectivity of penumbral connections, the apparent shared meaning of vague terms, and explaining the *compulsion* of the Sorites paradox independent of context shifts. Cost: May sacrifice core objectivity of meaning/truth.

  This list prioritizes the phenomena and the theoretical burdens they impose, providing a framework to evaluate theories based on what they *must* explain, what they *can* explain away, and where their fundamental costs lie. The "Grounding Borderline Truth" requirement highlights a critical, often under-addressed, metaphysical/semantic challenge.
