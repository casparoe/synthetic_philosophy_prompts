prompt: |-
  Me and a friend have been going back and forth for two years on whether genuine moral dilemmas are possible, and it's completely stuck — we both know the standard moves by heart now (the Sophie's-choice-type cases, agglomeration, ought-implies-can, and the anti-dilemma side explaining residue away as bare regret rather than a surviving obligation). My hypothesis is that we aren't having one disagreement but two under a single word: I'm asking a question about the logic of 'ought' (whether you can coherently be required to do each of two things you can't both do), she's asking whether it's rationally required to feel guilt afterwards, and we're each reading the same cases as evidence for our own question. Is that the right diagnosis, or is there a real substantive disagreement hidden inside it — about agglomeration, about whether the options have to be incommensurable rather than just equal, about whether a conflict you created yourself through an earlier bad choice still counts as a dilemma — and does anything shift if the conflict is spread across several agents instead of sitting inside one? One thing I want taken seriously: in the cases where it most feels like a dilemma, the person afterwards seems to owe an apology or some compensation to whoever lost out, even though they did the best they could. Doesnt that look like a leftover duty rather than just a feeling, and if it does, does it settle anything or just move the bump somewhere else? What I want is a diagnosis of what kind of stalemate this is and what would count as progress given it — a distinction, a formal result about 'ought' statements, a different kind of test case, or nothing at all — not another run through who argued what.
