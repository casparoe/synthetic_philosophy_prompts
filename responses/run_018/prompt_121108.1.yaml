  ### Worked Example: Critical-Level View Challenge

  **Critical-Level View Setup:** Welfare is an integer on a 0–100 scale (0 = neutral; >0 = life worth living). The value of a population is the sum of (each individual’s welfare - c), where **c = 30** (a fixed threshold between 25–60). Adding a person at welfare >30 improves the outcome; adding at <30 worsens it.

  **Chain of Outcomes (A1 → A2 → A3 → A4):**  
  - **A1:** Four people at welfare 16.  
    - Total welfare = 64  
    - Average welfare = 16.0  
    - Critical-level value = 4 × (16 - 30) = -56  

  - **A2:** Add one person at welfare 17 (no changes to existing people).  
    - Total welfare = 64 + 17 = 81  
    - Average welfare = 81 / 5 = 16.2  
    - Critical-level value = 4 × (16 - 30) + (17 - 30) = -69  
    - **Change from A1 → A2:**  
      - Total welfare: +17 (↑)  
      - Average welfare: 16.0 → 16.2 (↑)  
      - Critical-level value: -56 → -69 (↓ by 13)  

  - **A3:** Add one person at welfare 17 (no changes to existing people).  
    - Total welfare = 81 + 17 = 98  
    - Average welfare = 98 / 6 ≈ 16.333  
    - Critical-level value = 4 × (16 - 30) + 2 × (17 - 30) = -82  
    - **Change from A2 → A3:**  
      - Total welfare: +17 (↑)  
      - Average welfare: 16.2 → 16.333 (↑)  
      - Critical-level value: -69 → -82 (↓ by 13)  

  - **A4:** Add one person at welfare 17 (no changes to existing people).  
    - Total welfare = 98 + 17 = 115  
    - Average welfare = 115 / 7 ≈ 16.429  
    - Critical-level value = 4 × (16 - 30) + 3 × (17 - 30) = -95  
    - **Change from A3 → A4:**  
      - Total welfare: +17 (↑)  
      - Average welfare: 16.333 → 16.429 (↑)  
      - Critical-level value: -82 → -95 (↓ by 13)  

  **Constraints Satisfied at Every Step (A1→A2, A2→A3, A3→A4):**  
  - Exactly one person added; no one removed.  
  - No individual’s welfare changes by more than 2 (existing people unchanged: Δ = 0).  
  - Total welfare strictly increases (↑ by 17 each step).  
  - Average welfare strictly increases (↑ each step).  
  - Critical-level view says the step makes things worse (↓ each step).  
  - Every life is above 15 (all at 16 or 17).  
  - Starts with four people; no sci-fi/identity puzzles.  

  ---

  ### Analysis  
  1. **Feature Doing the Work:**  
     The key is that **some individuals start below the critical level (c = 30) and remain below it**. The critical-level view assigns negative value to these lives (since 16 < 30 and 17 < 30). Adding a new person below c adds another negative term to the sum (welfare - c), worsening the critical-level value despite increasing total/average welfare.  
     - **General Condition:** Such a chain exists if and only if there is at least one individual below c at every step. The size of welfare drops (or lack thereof) is irrelevant; the threshold breach is essential.  

  2. **If Everyone Starts Above the Threshold:**  
     If all initial individuals have welfare > c (e.g., all at 35 with c = 30), **the chain cannot be built**. To worsen the critical-level view:  
     - Adding a person below c would require the new person’s welfare to be > current average (to increase average welfare) but < c. This is impossible if the current average is already > c.  
     - Adding a person above c would require reducing existing welfare to offset the positive (welfare - c) of the new person, but the maximum reduction (≤2 per person) cannot satisfy both critical-level worsening and average-welfare increase simultaneously.  

  3. **Strongest Reply from a Critical-Level Defender:**  
     *"The critical-level view intentionally regards lives below c as not worth creating, even if they are worth living. In your chain, A1 is already bad (value -56), and adding more sub-c lives compounds this harm. The view avoids the repugnant conclusion by design, and this outcome is consistent with its core premise—not an embarrassment."*  
     - **Does It Land?** Partially. It explains the consistency, but does not resolve the counterintuitive result: adding lives that increase total/average welfare and harm no one is deemed strictly worse. This clashes with the intuition that "worth living + no harm = permissible."  

  4. **Closing Sentence for Handout:**  
     *"This case shows that the critical-level view, designed to avoid the repugnant conclusion, forces the verdict that adding a person with a life well worth living can make the world worse—even when it increases total welfare, raises average welfare, and leaves everyone unharmed."*
