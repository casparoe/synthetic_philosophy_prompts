  I'm a software engineer (backend, about a decade in, comfortable with unix permissions, capability systems, type-theory-lite) who's been arguing with a friend about the omnipotence paradox — the stone version: can an omnipotent being create a stone so heavy it can't lift it. My gut says the whole thing dissolves once you put it in vocabulary I actually think in, and I want to test that hunch properly rather than just assert it at my friend.

  So: restate the paradox and the standard moves in my terms — root users, chmod, capability-based security, immutable data structures, sandboxing, type errors, self-modifying systems. Concretely:

  - Aquinas's line (roughly) that the logically impossible isn't a "thing" an agent could fail to do, so not being able to do it is no limit on power. Does that just say the request "create a stone I can't lift" is ill-typed, like asking a compiler to run a program that doesn't parse? If so, is that a faithful translation or does something get flattened?
  - The dissolve where you seperate the two readings: for any stone, God can lift it; God can create stones of any weight; and there's no contradiction because no single stone witnesses both claims failing. Is that basicly a quantifier-scope point? And if formalizing it that way kills the paradox, does that mean the paradox was always boring, or does the formalization hide the part that made people care?
  - Descartes' weirder position that an omnipotent being could make contradictions true — I can't even see what that would be in system terms. Root that can execute ill-typed operations? A runtime with no type checker by design? Does this have any expression at all in my vocabulary, and if not, is that because it's nonsense or because my vocabulary assumes a fixed logic the way an OS assumes a fixed syscall interface?

  Then give me the residue report: what translated cleanly, what you had to fudge, and what's flat-out inexpressible. One thing I suspect matters: permissions are features of a system's design, omnipotence is supposed to be a feature of an agent, and those don't line up — root can always chmod back, so "a file root can't write" isn't really a state real systems have. Is that mismatch where the translation bleeds?

  Finally, grade my hunch honestly: is the paradox really just a type error wearing a theological costume, or does the leftover residue show the theologians were tracking something (about agency, necessity, whatever) that my vocabulary genuinely can't say?
