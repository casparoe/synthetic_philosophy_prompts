  3. **Descartes' Position**: He argued that God can do the logically impossible, including making contradictions true.

     Translation: This would be like a system that allows ill-typed operations, or a runtime that does not check types and just tries to execute any byte stream. It could lead to undefined behavior, crashes, or even arbitrary code execution. Alternatively, it might be like a system that can change its own rules (like self-modifying code) or even change the underlying logic (like a system that can alter its own type system).

