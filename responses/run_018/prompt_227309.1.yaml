     We might say the request is malformed because it requires a stone that violates the invariant of God's omnipotence (which includes being able to lift any stone). Therefore, the system (universe) does not allow such a stone to exist because it would break the invariant.

     Alternatively, think of it as a pre-condition: the `create_stone` function has a pre-condition that the weight must be one that God can lift? That seems circular. Instead, we can think of the invariant of the system: "God can lift any stone". Therefore, after creating any stone, the invariant must hold. So the system cannot create a stone that breaks the invariant.

