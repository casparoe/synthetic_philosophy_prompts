     Alternatively, we can model it with quantifiers:

       ∀ stone: God can lift stone.

       ∀ weight: God can create a stone of that weight.

     But note: the second claim does not say "God can create a stone of that weight and then not be able to lift it". It only says he can create a stone of that weight. And then the first claim says that for that stone, he can lift it.

     So there is no weight W such that creating a stone of weight W would break the first invariant. Therefore, the system remains consistent.

     In programming terms, we can think of it as:

       The system state has an invariant I: "all stones are liftable by God".

       The operation `create_stone(weight)` must preserve I. Therefore, the stone created must be liftable by God. The weight W cannot be chosen arbitrarily if it would break I? But wait, the claim is that any weight can be created. So we must design `create_stone` so that even if we ask for an arbitrarily large weight, the stone is still liftable by God. That is, the weight is bounded by the requirement of the invariant.

