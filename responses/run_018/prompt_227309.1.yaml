     The question is: can an omnipotent being (at time T) create a stone that it (at time T) cannot lift? If at time T it is omnipotent, then it must be able to lift any stone. Therefore, it cannot create a stone that it cannot lift at time T.

     If we allow the being to change its own capabilities, then after creating the stone, it could drop the lifting capability. But then at the moment of creation, it could lift the stone, so the condition "create a stone that it cannot lift" (at the moment of creation) fails. If the condition is about a future time, then it's a different story, but the paradox is usually about the same time.

