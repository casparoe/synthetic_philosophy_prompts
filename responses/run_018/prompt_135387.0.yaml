answer: |-
  Here’s a thought experiment set in **"Beechwood Grocers"**, a worker-owned cooperative where all members sign a mutual-shift-coverage pact: they pledge to make "reasonable efforts" to cover colleagues' emergency absences, ensuring the shop (their shared livelihood) operates smoothly.

  **Scenario:**  
  Elara, a long-standing member, has saved for two years and paid a £1,200 non-refundable deposit for a once-in-a-lifetime cultural pilgrimage abroad. Her shift partner, Ravi, suffers a severe panic attack an hour before their shared Saturday shift—the co-op’s busiest day. Under the pact, Elara is first call for cover. Accepting means forfeiting her deposit and her trip (she cannot rebook), sacrificing a profound personal/cultural goal vital to her wellbeing after years of frugal co-op work. Refusing forces the understaffed co-op to turn away customers, losing critical revenue and straining colleagues. The pact’s clause defines "reasonable efforts" as excluding "ruinous personal cost," but £1,200 is not catastrophic for Elara—it’s painful but repayable with loans over months.

  **Analysis:**  
  - **Kantian Imperfect Duty → Obligatory:**  
    Kantian ethics treats mutual aid as an *imperfect duty* (broadly required but discretionary in timing/target). Here, however, the **voluntary pact transforms this into a perfect duty**—a specific, binding commitment to identifiable others (Ravi, the co-op). By freely joining the pact, Elara *universalised* its maxim: "When we pledge mutual cover, we honour it barring impossibility." The £1,200 cost, while significant, doesn’t render helping *impossible* (she *can* work, albeit at great sacrifice). Prioritising her pilgrimage treats colleagues as mere means to her ends, violating the duty of beneficence concretised by her prior commitment. The pact’s "ruinous cost" clause is subjective; Kantians emphasise *duty* over disproportionate-but-non-destructive cost. Thus, covering is obligatory.  

  - **Supererogation-Friendly View → Beyond Duty:**  
    This view distinguishes *duty* from *praiseworthy extras*. While the pact creates a *prima facie* duty, the **massive, non-obligatory sacrifice (£1,200 + profound opportunity cost) exceeds reasonable demands**. The pact’s "reasonable efforts" implies cost-boundedness; demanding such sacrifice would coerce virtue, undermining autonomy central to supererogation. Elara’s cover would be *heroic*, benefiting the collective immensely at deep personal cost—precisely what "beyond duty" captures. Refusing remains permissible (if regrettable), as duties cannot demand profound life-altering sacrifices for non-essential needs (the co-op survives short-term losses).  

  **Structural Feature:**  
  The **voluntary pact acts as a prior commitment that reconfigures moral boundaries**. It crystallises imperfect duties into specific obligations *for Kantians*, while *supererogationists* see it as creating strong but defeasible demands, overridable by disproportionate cost.  

  **If Removed:**  
  Without the pact, Kantians revert to imperfect duty: helping Ravi is meritorious but *not strictly obligatory*, as no specific promise binds Elara. Supererogationists still deem covering optional but less clearly "beyond duty"—lacking the pact’s weight, sacrifice appears more discretionary. The tension collapses; both views converge on "optional but good".  

  **Kantian Counterattack:**  
  A Kantian might challenge the *proportionality assessment*:  
  1. **"Non-ruinous" Misinterpretation**: If £1,200 isn’t objectively ruinous (e.g., Elara won’t face homelessness), denying aid privileges *self-interest* over communal survival—a failure in duty.  
  2. **Pact Integrity**: The co-op depends on such pacts; universalising refusal ("anyone can abandon pledges for costly plans") would collapse mutual aid, exploiting colleagues’ goodwill.  
  3. **Moral Worth**: True duty requires acting *despite* significant cost; calling it "beyond duty" confuses *hard* duties with *optional* ones.  

  **Key**: The pact’s inter-subjective obligation forces the theories apart—Kantians see vows as duty-trumping, supererogationists see cost as duty-limiting.
