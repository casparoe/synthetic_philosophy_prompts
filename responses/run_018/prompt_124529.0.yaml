prompt: |-
  hey — i'm trying to get my thoughts straight on free-floating rationales before i teach this unit, and i need a consistency check. here's my current package:

  (1) practical reasons don't need an actual reasoner; they exist as normative structures independent of any mind.
  (2) but a reason that no agent could ever access or be moved by — totally inaccessable to every possible mind — isn't really functioning as a reason.
  (3) evolutionary debunking arguments fail because explaining the origin of a belief isn't the same as undermining its justification.
  (4) still, our evolutionary history gives a defeasible presumption that our core moral intuitions are tracking these free-floating reasons, not just noise.
  (5) i'm a non-naturalist about moral facts, and if we discovered we were in a closed simluation with no outside observers, that wouldn't change what's required of us.

  do these hang together? rank the real tensions by severity, say what's only apparently in conflict, and for each crack tell me the cheapest revision. i want a committed answer — take a definite stance on what has to go, not a buffet of options. write in american english. keep it tight.
