  The nuclear option is quantum gravity objections. I should draft a substantive reply admitting current speculation but arguing the problem persists in semiclassical regimes. The user's weakest spot is probably defining "coupling locality" - I should advise them to proactively defend that rather than avoid it.

  Key nuances: 
