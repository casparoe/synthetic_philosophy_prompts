  Below is a decision-tree taxonomy for temporal ontology, structured as nested questions with explicit branch points. The tree prioritizes theory-independent commitments and highlights where special relativity forces philosophical choices. Named positions are mapped to leaves, with unoccupied combinations diagnosed. Two concrete diagnostic cases follow the taxonomy.

  ---

  ### **Decision-Tree Taxonomy of Temporal Ontology**

  #### **Node 1: Ontological Status of Non-Present Entities/Events**  
  *Do past and future entities/events exist in the same ontological sense as present ones?*  
  - **A: Yes** (Past, present, and future all exist fully; no ontological privilege for "now").  
  - **B: No** (Only present entities/events exist fully; past/future are unreal or derivative).  
  - **C: Partially** (Past and present exist fully; future is unreal or derivative).  

  #### **Node 2: Structure of the Present (Only if B or C from Node 1)**  
  *If non-present items lack full existence, how is the present defined?*  
  - **2.1: Global hypersurface** (Present is a spatially extended "now" across the universe).  
    - **2.1a: Does this require a privileged inertial frame?**  
      - *Yes*: Privileged frame needed (violates relativity’s core principles).  
      - *No*: Compatible with relativity (denies relativity’s empirical adequacy).  
  - **2.2: Local point-defined set** (Present is defined only at a point or local region).  
  - **2.3: Undefined at physical scales** (Present has no objective physical definition).  

  #### **Node 3: Nature of Tense**  
  *Is tense (past/present/future) an irreducible feature of reality?*  
  - **X: Yes** (Tense is mind-independent and fundamental).  
  - **Y: No, reducible** (Tense reduces to tenseless relations like "earlier than").  
  - **Z: Purely linguistic** (Tense has no metaphysical import; it’s a language feature).  

  #### **Node 4: Truthmakers for Past/Future-Tensed Statements**  
  *What grounds the truth of statements about non-present events?*  
  - **P: Direct truthmakers** (Existing entities/events at their times).  
  - **Q: Indirect truthmakers** (Present traces/dispositions).  
  - **R: Branching possibilities** (Multiple futures/pasts; truth is branch-relative).  
  - **S: Deny bivalence** (No truth value; statements are indeterminate).  

  ---

  ### **Mapping Named Positions to Leaves**  
  - **Standard presentism with absolute simultaneity**:  
    - Path: **B** → **2.1** → **2.1a: Yes** → **X** → **Q**.  
    - *Denies relativity; requires a global "now" and privileged frame.*  
  - **Relativistic presentism (denies global present)**:  
    - Path: **B** → **2.2** → **X** → **Q**.  
    - *Present is local; avoids privileged frames but faces relativity constraints.*  
  - **Eternalism with B-theoretic reduction of tense**:  
    - Path: **A** → **Y** → **P**.  
    - *All times exist; tense reduces to relations; events themselves are truthmakers.*  
  - **Growing-block view**:  
    - Path: **C** → **2.1** → **2.1a: Yes** → **X** → **Q**.  
    - *Past/present exist; future uses dispositions as truthmakers. Co-occupies leaf with standard presentism but differs at Node 1 (C vs. B).*  
  - **Moving-spotlight view**:  
    - Path: **A** → **X** → **P**.  
    - *All times exist, but "present" is a dynamic, irreducible property; events are truthmakers.*  
  - **Deflationary linguistic view**:  
    - Path: **B** → **2.3** → **Z** → **Q**.  
    - *Denies substantive ontology; tense is language-based; truth via present conventions.*  

  ---

  ### **Unoccupied Combinations & Diagnoses**  
  1. **Global presentism without privileged frame (B → 2.1 → 2.1a: No)**  
     - *Diagnosis: Incoherent.* Special relativity forbids a global "now" without a privileged frame. If relativity holds, "global present without frame" is self-contradictory.  
     
  2. **Eternalism with irreducible tense (A → X → R/S)**  
     - *Diagnosis: Unexplored or implausible.* Eternalism typically pairs with tenseless relations (Y). Combining with fundamental tense (X) and branching (R) or denied bivalence (S) lacks clear motivation.  

  3. **Growing block with local present (C → 2.2/2.3 → ...)**  
     - *Diagnosis: Physically implausible.* Growing block requires a global "growing edge" (2.1) to define the objective past-present boundary. Local/undefined present (2.2/2.3) undermines its core premise.  

  4. **Deflationary view with direct truthmakers (Z → P)**  
     - *Diagnosis: Incoherent.* Deflationism denies mind-independent temporal ontology, so direct truthmakers (P) in non-present entities contradict its linguistic focus.  

  ---

  ### **Diagnostic Cases**  
  #### **Case 1: Relativity of Simultaneity**  
  *Two observers in uniform motion each correctly judge a distant stellar event as occurring "now" (by their measurements). Which branches must reject/accept this?*  
  - **Branches requiring rejection (incoherent with relativity)**:  
    - Global presentism (**B → 2.1 → 2.1a: Yes**) demands absolute simultaneity; only one observer can be correct.  
  - **Branches accepting it (compatible)**:  
    - Relativistic presentism (**B → 2.2**) accepts local "nows," allowing both judgments.  
    - Eternalism/growing block with global present + privileged frame (**A/C → 2.1 → 2.1a: Yes**) can accept both if a preferred frame exists (e.g., cosmic rest frame), but this is empirically unverified.  
  - **Branches where it’s irrelevant**:  
    - Deflationary view (**Z**): Tense is linguistic; no metaphysical conflict.  
    - Eternalism without tense (**Y**): "Now" is frame-relative but ontologically neutral.  

  #### **Case 2: Erased Past Event**  
  *A past event leaves no physical traces, but a well-supported statement ("Event E occurred") persists. How does each branch treat its truth conditions?*  
  - **Direct truthmakers (P)**: Rejects truth (e.g., eternalism/moving spotlight: no event → no truthmaker).  
  - **Indirect truthmakers (Q)**: Rejects truth (e.g., presentism/growing block: no traces → no grounds).  
  - **Branching possibilities (R)**: Truth indeterminate (if past branches exist).  
  - **Deny bivalence (S)**: Statement is neither true nor false.  
  - **Deflationary view (Z)**: Truth depends on current linguistic practices, not ontology.  

  ---

  ### **Key Physics-Ontology Intersections**  
  - **Special relativity forces a choice at Node 2.1a**: Global present (**2.1**) requires either rejecting relativity’s no-privileged-frame principle (**Yes**) or reinterpreting it (**No**), risking empirical inadequacy.  
  - **Node 2.2/2.3 avoids this by abandoning global present**, but faces challenges defining temporal passage locally.  
  - **Eternalism (A) bypasses Node 2 entirely**, as relativity’s spacetime structure aligns with tenseless ontology (Y + P).  

  This taxonomy isolates commitments while highlighting where physics constrains philosophy. Use it to classify positions in your discussion group without presupposing theory names.
