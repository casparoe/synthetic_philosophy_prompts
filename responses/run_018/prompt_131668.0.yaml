answer: |-
  Here’s a tight 50-minute teaching arc for your "address-space commemoration" concept, designed like a conceptual obstacle course. We’ll use **Peel Square** (a fictional but plausible UK town square named after 19th-c PM Robert Peel) as our carrying example.

  **Why Peel Square Works:**  
  - ✅ **Embedded in navigation:** Locals say "Meet at Peel Square" or "The bus stop by Peel’s statue."  
  - ✅ **Low/no active reverence:** Nobody leaves flowers or celebrates "Peel Day"; his policies (like founding modern police) are mostly irrelevant to daily life.  
  - ❌ **Avoid:** Confederate statues (too politically raw) or MLK Blvd (where the name *still* actively symbolizes values).  

  ---

  ### **Teaching Arc (50 mins)**  
  **GOAL:** Distinguish **commemorative intent** (praise) from **practical function** (wayfinding).  

  #### **Phase 1: Set Up the Distinction (15 mins)**  
  - **Hook (3 min):** Poll the room: *"Raise hands: Who’s used a statue/street name JUST to give directions? Who’s used one to actively honor someone?"* Highlight the split.  
  - **Define Key Terms (7 min):**  
    - **Commemoration = Intentional praise** (e.g., a fresh plaque celebrating a hero).  
    - **Address-Space = Functional label** (e.g., "Turn left at the Lincoln Memorial" – you’re navigating, not praising Abe).  
  - **Carrying Example Intro (5 min):**  
    > *"Imagine ‘Peel Square’ – named for a PM who repealed corn laws. Locals use it to find the pub. Tourists ignore the statue. Is this still ‘honoring’ Peel? Or is it just… geography?"*  

  #### **Phase 2: The Conceptual Pivot + Misconception Takedowns (25 mins)**  
  - **Thought Experiment (10 min):**  
    > *"Suppose Peel’s racist private letters surface. Town votes to rename the square. Protesters yell ‘You’re erasing history!’ Are they right?"*  
    - **Group brainstorm:** *What’s actually being "erased"? The navigation function? Or the honor?*  
  - **🚫 Misconception 1: "Removal = Erasing History" (HEAD OFF HERE)**  
    - **Counter:** *"Does removing a street sign delete history books? Or just repurpose a landmark? History lives in archives, not asphalt. We’re debating the *honor*, not the *fact*."*  
  - **🚫 Misconception 2: "Names Are Neutral Labels" (HEAD OFF HERE)**  
    - **Counter:** *"Why not rename it ‘Pizza Square’? Because ‘Peel Square’ has inertia. Its *origin* was praise – even if it’s faded. Function ≠ Neutrality."*  
  - **🚫 Misconception 3: "This Only Applies to Villains" (HEAD OFF HERE)**  
    - **Counter:** *"Imagine renaming ‘Einstein Avenue’ because it confuses tourists. The outrage isn’t about villainy – it’s about disrupting function. Even ‘good’ names become tools."*  

  #### **Phase 3: Lock In the Split (10 mins)**  
  - **Check Question (Proves Conceptual Grasp):**  
    > *"Why might someone feel removing Peel’s statue ‘erases history’ even if nobody cared about Peel? What’s the gap they’re missing?"*  
    **✅ Target Answer:** *"They confuse the statue’s CURRENT function (landmark) with its ORIGINAL intent (honor). Removing it disrupts wayfinding, not history – but it *feels* like censorship because the origin was praise."*  
  - **Takeaway Soundbite:**  
    > *"Address-space commemoration is when the map swallows the monument. The praise fades; the utility remains. Removal changes navigation, not the past – but the ghost of honor haunts the debate."*  

  ---

  ### **What to LEAVE OUT (and Why):**  
  1. **Legal property doctrine:** Who owns the statue? Municipal codes? This is practical, not conceptual. It drags us into "how" not "why."  
  2. **Recent controversial examples (e.g., Rhodes, Lee):** They trigger pre-existing political stances. Peel is boring enough to be a lab specimen.  
  3. **Deep dive into historical reparations:** We’re isolating the *mechanism* of commemoration decay, not the moral weight of the honoree.  

  **Why This Works:** You’re giving writers a *structural* lens. They’ll spot this dynamic everywhere now – from corporate rebranding ("X" vs "Twitter") to faded celebrity endorsements. The politics becomes a *layer*, not the core.  

  Final tip: End with *"So – how might a character in your story misunderstand this split? What would that cost them?"* 🤓
