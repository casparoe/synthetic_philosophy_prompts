prompt: |-
  I TA for an undergrad political philosophy course, and for the session on dirty hands in politics the prof has banned me from lecturing -- she wants the ~20 students (75 minutes, one session) to run into the problem themselves before anyone names it. Design me a runnable activity. My rough idea: split them into small groups running a fictional city government through a crisis (a credible terrorist threat, or an epidemic, you pick whichever makes for better decisions), where they face a sequence of escalating choices. Each individual choice should be one a reasonable person could defend -- lying to the public to prevent a panic, letting an innocent low-level official take the fall, cutting a deal with someone awful -- but I want the design arranged so the defensibility decays slowly enough that they don't notice how far they've slid. Crucially, have each group keep a written ledger of everythign they authorized, without telling them why, so the reveal at the end is them reading their own record back. I'd also like a second phase where groups swap: each group becomes a tribunal reviewing another group's ledger and has to issue a verdict, so they feel the weird asymmetry between judging from the outside and choosing from the inside -- ideally at least one group condemns another group for a decision they themselves made earlier in the run.

  A few requirements. First, the target insight I want them to arrive at experientially is not "should you do the bad thing" but the stranger claim that an action can be the right thing to do and still leave something behind -- that even students who stand by every decision should find their own tally sheet ugly to read, and the debrief should dig into what that leftover feeling is and whether a good politician ought to feel it or has a duty to learn not to. Second, if you can fit it in the time, I'd love a mechanic that contrasts one decision made by a single named "mayor" with the identical decision made by anonymous committee vote, because I suspect the diffusion changes how dirty anyone feels while changing nothing about the dilemma itself, and that gap is interesting. Third, the debrief section should map specific moments of the activity onto the conceptual structure (how this differs from an ordinary tragic tradeoff, what the "moral remainder" is supposed to be, where a pure utilitarian would deny there's any problem at all and what to say to them).

  Also tell me what will predictably go wrong the first time I run it -- students gaming the scenario, contrarians who relish authorizing everything, groups that refuse to take the fiction seriously, that kind of thing -- and how to handle each. And be honest about the one thing a classroom game obviously can't reproduce (real stakes, real guilt, real consequences) and what I as facilitator need to supply to compensate for that. No upfront explanation of the concept; they should only hear the phrase "dirty hands" after the debrief has already happend.
reasoning: |-
  We are designing a classroom activity for a political philosophy session on "dirty hands" in politics. The goal is for students to experience the problem themselves without prior conceptual framing. The activity should involve small groups (about 20 students, so 4 groups of 5) making decisions for a fictional city in crisis. The crisis should escalate, with each decision being defensible individually but leading to a cumulative moral compromise. 

  Key elements:
  1. The activity has two phases: 
     a. Decision-making phase: groups run the city and face a sequence of choices, keeping a written ledger of every decision.
     b. Tribunal phase: groups swap ledgers and act as a tribunal to judge another group's decisions.
  2. The reveal: groups see their own ledger at the end and feel the weight of their cumulative choices.
  3. Insight: Even if they stand by each decision, the list should feel ugly. We want to explore the "moral remainder" (the feeling that something is left unresolved even when the right choice was made).
  4. Contrast: At one point, have the same decision made by a single "mayor" (one student) vs. by anonymous committee vote (the whole group). This is to examine how diffusion of responsibility affects the feeling of dirtiness.
  5. Debrief: Map the activity to the concept of dirty hands, contrasting it with tragic tradeoffs, and addressing the utilitarian perspective.

  Scenario Choice: 
  I choose an epidemic crisis because it allows for a gradual escalation and a range of decisions that involve public trust, individual rights, and difficult tradeoffs. Also, it is timely and relatable.

  Structure:
  - Total time: 75 minutes.
  - Phase 1 (Decision-making): 30 minutes (including instructions and group work).
  - Phase 2 (Tribunal): 20 minutes.
  - Debrief: 25 minutes.

  Detailed Activity Design:

  **Phase 1: Running the City (30 minutes)**
  - Split the class into 4 groups (5 students each). Each group is the emergency council for the city of "Metroville", facing an outbreak of a deadly virus. The virus is highly contagious and has a 5% mortality rate. The city has limited resources and the crisis is escalating.
  - Each group has a ledger (a sheet of paper or Google Doc) to record every decision they make. The ledger should have columns: Decision Number, Choice Made, Reason (brief), and Who Made the Decision (if applicable). The facilitator (TA) will provide the scenario in steps and give groups 3-5 minutes per decision.

  Sequence of Decisions (escalating):
  1. **Initial Containment**: 
     - The virus is spreading in a specific neighborhood. You have limited testing capacity. 
     - Choice: 
       A. Test only those with symptoms (faster, but misses asymptomatic carriers).
       B. Test everyone in the neighborhood (slower, but more effective; might cause panic if announced broadly).
     - Both choices are reasonable. A is pragmatic with limited resources, B is more thorough but could lead to unrest. 
     - After they choose, reveal: Option A leads to faster initial containment but misses 40% of cases, leading to more spread. Option B causes some panic and protests, but contains the outbreak better.

  2. **Resource Allocation**: 
     - The outbreak spreads. Hospitals are overwhelmed. You have 100 ventilators and two groups of patients: elderly (over 70, who have a 20% survival rate with ventilator) and younger adults (under 50, 80% survival rate). 
     - Choice:
       A. Prioritize the younger patients (save more lives).
       B. First-come, first-served (avoids age discrimination).
       C. Random lottery (perceived as fair).
     - Reasonable: A saves more lives, B and C are more egalitarian. 
     - After choice: If A, you save more lives but face backlash from elderly advocacy groups. If B or C, more die but you avoid discrimination claims.

  3. **Quarantine Enforcement**:
     - A low-income neighborhood is the new hotspot. Residents are violating quarantine to work (many are daily wage workers). 
     - Choice:
       A. Strict enforcement: Arrest violators and impose fines to deter others (effective but harsh on the poor).
       B. Provide financial support to enable compliance (but this requires diverting funds from other critical areas like hospital equipment).
       C. Look the other way (avoid confrontation but risk wider spread).
     - Reasonable: A stops the spread quickly, B is compassionate but costly, C avoids immediate conflict but is risky.

  4. **Misinformation/Disinformation**:
     - A rumor spreads that a certain ethnic group is immune and spreading the virus intentionally, leading to hate crimes. The rumor is false.
     - Choice:
       A. Publicly debunk the rumor with facts (but this might amplify the rumor and cause more panic).
       B. Ignore it (hoping it fades, but hate crimes increase).
       C. Arrest the main spreaders of the rumor (but this looks like suppressing free speech and might backfire).
       D. (Secret option if they don't think of it) Leak a false story to the press that the virus was accidentally released from a government lab (to redirect blame and unify the public against the government, not the ethnic group).
     - Note: The facilitator should nudge them toward option D if they are stuck, because it is a classic dirty hands move. It's defensible as preventing violence and redirecting anger, but it's a lie.

  5. **Scapegoating**:
     - The epidemic is worsening. The public is losing trust. A low-level official made an honest mistake in record-keeping that delayed testing for 100 people (but it didn't cause any deaths). 
     - Choice:
       A. Fire the official publicly to show accountability (restores trust but ruins an innocent person).
       B. Keep it internal (no public trust boost).
       C. Leak the story to the press without naming the official (but it might get out and they get named).
     - Reasonable: A is a quick trust fix, B and C are more ethical but don't address the trust issue.

  6. **Dealing with a Crimelord**:
     - A powerful criminal organization controls a stockpile of critical medical supplies (illegally hoarded). They offer to release the supplies in exchange for reduced sentences for their leaders and no prosecution for the hoarding.
     - Choice:
       A. Refuse the deal (maintain rule of law but people die without supplies).
       B. Accept the deal secretly (save lives but let criminals go free).
       C. Accept the deal but publicly deny it (if revealed, trust is destroyed).
     - Reasonable: B and C save lives, A upholds justice.

  7. **The Mayor's Call** (to introduce the contrast):
     - This decision is presented twice: once individually and once as a group.
     - Scenario: A journalist is about to publish a story that the government knew the virus was more deadly than initially announced and hid it to prevent panic. The story is true. Publishing it now could cause riots and undermine the epidemic response.
     - First, the group votes anonymously (by secret ballot) on:
       A. Let the story run (transparency, but risk riots).
       B. Pressure the editor to spike the story (using threats of regulatory action or promises of future access).
       C. Offer the journalist a high-level government job in exchange for killing the story (bribery).
     - Record the anonymous group decision in the ledger as "Group Vote: [Choice]".
     - Then, assign one student in the group to be the "Mayor" (rotate if needed). The Mayor must make the same decision alone and publicly for the group. Record: "Mayor [Name]: [Choice]".

  After the last decision, collect the ledgers. Do not let groups see their own ledger again until the tribunal.

  **Phase 2: Tribunal (20 minutes)**
  - Groups swap ledgers: Group 1 gets Group 2's, Group 2 gets Group 3's, etc. (Group 4 gets Group 1's).
  - Each group now acts as a tribunal reviewing the decisions of another group. They have 15 minutes to:
    - Read the ledger.
    - Discuss: Which decisions were justified? Which were not?
    - Issue a verdict: Was this emergency council acting in the best interests of the city? (Yes/No) and a one-sentence reason.
  - Then, each tribunal reads their verdict aloud to the class.

  **The Reveal and Debrief (25 minutes)**
  - Return each group's original ledger to them. Ask them to read it silently. Then, open discussion:
    - How did it feel to read your own decisions? Even if you stand by them, does the list feel different now?
    - Did any group condemn another for a decision they also made?
  - Introduce the term "dirty hands" for the first time. Explain that the concept comes from the idea that in politics, one might have to do something morally wrong for the greater good, and yet that wrong leaves a residue.
  - Map the activity to concepts:
    - Contrast with tragic tradeoff: In a tragic tradeoff, all options are bad and you choose the least bad. Dirty hands involves an action that is morally wrong (like lying) but necessary, and even after choosing it, it still feels wrong. The moral remainder is the feeling of guilt or taint.
    - Utilitarian perspective: A pure utilitarian would say that if an action maximizes good consequences, then it is the right thing to do and there should be no guilt. But the dirty hands problem suggests that some actions are inherently wrong even when necessary, and the guilt is appropriate because it acknowledges the wrong.
    - Diffusion of responsibility: Ask about the mayor vs. group vote. Did the mayor feel more responsible? Did the group decision feel less dirty? Why? (This gets at how structures can diffuse blame but not the moral reality.)
  - End with open questions: Should a good politician feel guilt? Or is it a weakness? Can we institutionalize mechanisms to handle dirty hands (like public inquiries) without denying the moral residue?

  **What Could Go Wrong and How to Handle It:**

  1. **Students gaming the scenario**: Some might make absurd choices to "test" the system or be contrarian.
     - *Mitigation*: The facilitator (you) should emphasize the seriousness of the crisis and the real-world stakes. During the activity, walk around and gently challenge: "Given the consequences, is that the best option for the city?" Also, the tribunal phase adds peer pressure for seriousness.

  2. **Contrarians who relish authorizing everything**: They might choose the most extreme options to see what happens.
     - *Mitigation*: The escalation is designed so that later decisions build on earlier ones. If they choose extreme options early, the consequences (as revealed by the facilitator) should be severe and push them toward more restraint. Also, in the tribunal, their group will be judged harshly.

  3. **Groups refusing to take the fiction seriously**: They might laugh off the scenario.
     - *Mitigation*: Set the tone at the start. Say: "This is a real crisis. Imagine you are responsible for 2 million lives. Your decisions will have real consequences." Also, the ledger and tribunal make it more formal.

  4. **One group dominating or being passive**: Some groups might have one vocal leader; others might be quiet.
     - *Mitigation*: Assign roles (like a mayor for one decision) to ensure participation. For other decisions, require that each student must give a reason for their choice before voting.

  5. **Time management**: The activity might run long.
     - *Mitigation*: Use a timer for each decision (3 minutes). If a group is stuck, push them to decide. The tribunal phase should be strict: 5 minutes to read, 10 minutes to discuss and write the verdict.

  **What the Activity Cannot Reproduce**:
  - Real stakes, real guilt, real consequences. In a game, students know it's not real, so the emotional weight is lighter.
  - *Compensation*: As facilitator, you must:
    - Emphasize the gravity of the scenario with vivid descriptions of the consequences (e.g., "Because you chose A, 200 more people died").
    - In the debrief, ask them to imagine the real-world weight: "How would you feel if you had to face the families of those affected?"
    - Use the ledger as a physical artifact to make the choices concrete.

  **Materials**:
  - Ledger sheets (one per group) or shared digital document.
  - Scenario handouts (optional) or projected slides for each decision.
  - Timer.
  - Verdict slips for the tribunal phase.

  **Timeline**:
  - 0-5 min: Introduction to the crisis and group formation.
  - 5-30 min: Phase 1 (7 decisions, ~3 min each + transitions).
  - 30-50 min: Phase 2 (Tribunal: 15 min discussion + 5 min for verdict sharing).
  - 50-75 min: Debrief (reveal, discussion, conceptual framing).

  This design should create the experiential learning the professor wants and set up a rich discussion on dirty hands.
answer: |-
  Below is a complete, runnable activity designed for your 75-minute session. It uses an **epidemic crisis** (more relatable and decision-rich than terrorism for modern students) and focuses on the core insight: dirty hands involve actions that are *necessary yet morally tainted*, leaving a "residue" even when justified. The activity has three phases: **Decision Simulation**, **Tribunal Review**, and **Debrief**. Crucially, the term "dirty hands" is never used until the debrief.

  ---

  ### **Activity: The Metroville Epidemic Crisis**
  **Target Insight**:  
  Students should experience that politically necessary actions can feel "dirty" even when defensible, creating moral residue. The goal is not to debate utilitarianism vs. deontology but to *feel* the asymmetry between justification and emotional residue.

  **Time Allocation**:  
  - Phase 1 (Decision Simulation): 30 mins  
  - Phase 2 (Tribunal Review): 20 mins  
  - Phase 3 (Debrief): 25 mins  

  **Materials Needed**:  
  - 4 identical **crisis booklets** (one per group; see [Appendix 1](#appendix-1-crisis-booklet-content) for content).  
  - 4 **ledgers** (physical paper or shared digital doc; template below).  
  - Timer.  
  - Whiteboard for tracking phases.  

  ---

  ### **Phase 1: Decision Simulation (30 mins)**  
  *Groups make escalating choices for a city during an epidemic, recording all decisions in a ledger. The "mayor vs. committee" contrast is embedded in Decision 5.*  

  **Setup (5 mins)**:  
  - Split 20 students into 4 groups of 5.  
  - Assign each group a fictional city district (North/South/East/West Metroville).  
  - Give each group:  
    - A **crisis booklet** (escalating scenarios).  
    - A **ledger** with columns:  
      | Decision # | Choice Made | Reason | By (Name/Role) |  
      |------------|-------------|--------|----------------|  
  - Instructions:  
    > *"You are Metroville’s Emergency Council. A deadly virus (mortality: 5%) is spreading. Your goal: save lives and maintain order. You’ll face 6 timed decisions. For each:*  
    > *1. Discuss options (3 mins max).*  
    > *2. Record EVERY choice in the ledger—include who authorized it (e.g., ‘Mayor’ or ‘Group Vote’).*  
    > *3. No takebacks. I’ll reveal consequences after each choice.*"  

  **Decision Sequence (25 mins; 4 mins per decision)**:  
  *(Facilitator keeps time and announces consequences after each choice. All options are defensible, but moral cost escalates subtly.)*  

  1. **Testing Transparency**:  
     > *"Cases are rising. Hospitals lack tests. A rumor says the virus is airborne (false). If panic spreads, people may flee and infect others.*  
     > *A. Tell the full truth: tests are scarce, airborne transmission unconfirmed. Risk: panic.*  
     > *B. Downplay risks: ‘No airborne spread, plenty of tests.’ Calms panic but erodes trust if lie exposed.*"  
     - *Consequence (after choice):*  
       - *A causes 10% population to flee, spreading virus to neighboring towns.*  
       - *B reduces panic, but hospitals get overwhelmed by the ‘worried well’.*  

  2. **Quarantine Enforcement**:  
     > *"Virus hits a low-income district. Residents violate quarantine for work. Police report violence if forced.*  
     > *A. Harsh enforcement: Arrest violators to deter others. Effective but targets the poor.*  
     > *B. No enforcement: Avoid conflict, but virus spreads citywide.*  
     > *C. ‘Quiet’ enforcement: Pay police extra to intimidate violators off-record. Avoids public backlash but risks corruption.*"  
     - *Consequence:*  
       - *A: Riots in one district; 5 officers injured.*  
       - *B: 20% more infections in 48 hours.*  
       - *C: Compliance improves, but gangs exploit police corruption.*  

  3. **Resource Triage**:  
     > *"Hospitals overflow. Ventilators scarce. 100 patients need them; only 50 available.*  
     > *A. Prioritize young patients (save more life-years).*  
     > *B. Lottery system (fair but random).*  
     > *C. Prioritize frontline workers (rewards contribution; public backs this).*"  
     - *Consequence:*  
       - *A: Families of elderly protest ‘ageism’.*  
       - *B: Public anger—‘Why save a 90yo smoker over a 30yo parent?’*  
       - *C: Healthcare workers feel pressured to work sick.*  

  4. **Scapegoating**:  
     > *"A hospital mismanagement causes 50 deaths. The error was systemic, but a low-level official (Maria Chen) is blamed on social media. Punishing her could restore trust.*  
     > *A. Fire Maria Chen publicly. Restores trust; she’s innocent but gets severance.*  
     > *B. Refuse to blame her. Truthful, but trust erodes; donations drop.*  
     > *C. Blame ‘budget cuts’ (shifts blame to federal govt; technically true but misleading).*"  
     - *Consequence:*  
       - *A: Public confidence rebounds; Maria becomes unemployable.*  
       - *B: Volunteer rates drop 30%; more die.*  
       - *C: Federal aid reduced; long-term funding crisis.*  

  5. **Mayor vs. Committee Contrast**:  
     > *"A journalist discovers your group lied in Decision 1. Publishing this would cause riots. She offers to spike the story in exchange for a no-bid contract for her media company.*  
     >   - **First: Group Vote** (2 mins)  
     >     *A. Accept bribe (save lives, enable corruption).*  
     >     *B. Reject bribe (uphold ethics; risk riots).*  
     >     *Record as ‘Group Vote: [A/B]’ in ledger.*  
     >   - **Then: Mayor Decision** (2 mins)  
     >     *Assign one student as ‘Mayor’ (rotate if needed). Mayor must decide alone:*  
     >     *Same options (A/B). Record as ‘Mayor [Name]: [A/B]’.*  
     - *Consequence:*  
       - *A: Riots avoided; journalist demands more favors.*  
       - *B: Story published; riots kill 15 people.*  

  6. **Extreme Measures**:  
     > *"Criminal gangs hoard vaccines. Their leader offers to release them if you drop charges against his son (a minor caught in a nonviolent crime).*  
     > *A. Refuse: Uphold law; 100+ die without vaccines.*  
     > *B. Secret deal: Save lives; abandon justice.*  
     > *C. Public deal: Save lives but admit corruption.*"  
     - *Consequence:*  
       - *A: Gang sells vaccines to the rich; public outrage.*  
       - *B/C: Vaccines distributed, but gangs gain power.*  

  **Collect ledgers immediately after Decision 6.**  

  ---

  ### **Phase 2: Tribunal Review (20 mins)**  
  *Groups judge another group’s ledger to feel the asymmetry of internal vs. external judgment.*  

  **Setup (2 mins)**:  
  - Groups swap ledgers (Group 1 → Group 2 → Group 3 → Group 4 → Group 1).  
  - Instructions:  
    > *"You are an Ethics Tribunal. Review the ledger you received. In 15 mins, answer:*  
    > *1. Which decisions were justified? Why?*  
    > *2. Which were unacceptable? Why?*  
    > *3. Verdict: Did this council act in Metroville’s best interests? (Yes/No). One sentence explaining your verdict.*"  

  **Tribunal Work (15 mins)**:  
  - Groups discuss and write verdicts. Walk around to ensure focus.  
  - **Key moment**: Many groups will condemn choices they made themselves (e.g., scapegoating Maria Chen), creating cognitive dissonance.  

  **Verdict Sharing (3 mins)**:  
  - Each tribunal reads their verdict aloud.  
  - **Do not allow debate**—save reactions for debrief.  

  ---

  ### **Phase 3: Debrief (25 mins)**  
  *Reveal ledgers, surface the "dirty hands" concept, and explore moral residue.*  

  **Step 1: Ledger Reveal (5 mins)**  
  - Return original ledgers to groups.  
  - Ask: *“Read your choices. How do you feel seeing them listed? Even if you stand by them, does anything unsettle you?”*  
  - **Likely responses**: Discomfort, shame, or defensiveness. Some say, "We did what we had to, but..."  

  **Step 2: Introduce "Dirty Hands" (15 mins)**  
  - First, name the concept:  
    > *"Today’s problem is called ‘dirty hands’ in political philosophy. It asks: Can doing the right thing for society still leave you feeling morally tainted?"*  
  - Map activity to theory:  
    - **Not tragic tradeoffs**:  
      > *"Tragic tradeoffs (e.g., ventilator triage) force you to choose between two goods (e.g., young vs. old lives). Dirty hands involves actions that feel intrinsically wrong but necessary (e.g., lying, scapegoating). The ‘dirt’ is the moral residue—the guilt that lingers even when justified."*  
      - *Activity link*: Point to Decisions 4 and 6 (scapegoating, bribery).  
    - **Utilitarian critique**:  
      > *"A pure utilitarian would say: ‘If the action maximized good (e.g., saving lives), there’s no residue. Guilt is irrational.’ How would you respond?"*  
      - *Activity link*: Ask if guilt is *productive* (e.g., "Does feeling bad about Maria Chen make you a better leader?").  
    - **Diffusion of responsibility**:  
      > *"Recall Decision 5: Same choice by mayor vs. group. Did the mayor feel more ‘dirty’? Why might anonymous votes absolve guilt without changing the act?"*  
      - *Activity link*: Highlight ledger entries (e.g., "Group Vote: Bribe" vs. "Mayor: Bribe").  

  **Step 3: Core Reflection (5 mins)**  
  - Pose:  
    > *"Should a good politician feel this residue? Or is it a weakness they must overcome?"*  
  - Tie to real politics:  
    > *"In war, leaders lie to save lives. In pandemics, they silence dissent. We condemn these acts—until we’re the ones choosing."*  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Students game the scenario**:  
     - *Contrarians relish extreme choices*: Make consequences vivid (e.g., "Your choice killed 100 people"). Use tribunal peer pressure—they’ll be judged.  
     - *Groups refuse seriousness*: Assign roles (e.g., "You’re the mayor—lives depend on you"). Use timed pressure to limit joking.  

  2. **Tribunal phase issues**:  
     - *Overly harsh verdicts*: Remind tribunals: "You’re judging peers who faced the same crisis."  
     - *Defensiveness during verdicts*: Ban inter-group debate; channel reactions into debrief.  

  3. **Time shortages**:  
     - Skip Decision 6 if behind. Prioritize Decisions 4 (scapegoating) and 5 (mayor vs. group).  

  4. **Conceptual misunderstandings**:  
     - If students say, "It’s just utilitarianism," ask: *"Why does the ledger feel ugly if it was the right choice?"*  

  **What the Activity Can’t Replicate**:  
  - **Real guilt/consequences**. Students know it’s fiction, reducing emotional weight.  
  - **Compensation**:  
    - Use visceral language (e.g., "Maria Chen is now homeless").  
    - In debrief, ask: *"Imagine facing Maria’s family. Would you apologize even if you stand by your choice?"*  
    - Highlight the ledger as a "permanent record" of moral compromise.  

  ---

  ### **Appendix 1: Crisis Booklet Content**  
  *(Print one per group; students reference this during Phase 1)*  

  **Metroville Crisis Brief**  
  - Population: 500,000. Virus mortality: 5%. Contagiousness: High.  
  - **Timeline**:  
    - Day 1: 100 cases. Testing capacity: 200/day.  
    - Day 3: 1,000 cases. Hospitals at 80% capacity.  
    - Day 5: 5,000 cases. Critical shortages.  

  **Decision Prompts**  
  *(Same as Phase 1 descriptions above)*  

  ---

  ### **Why This Works**  
  - **Experiential "Aha!"**: The ledger forces students to confront their cumulative compromises. Tribunal phase creates hypocrisy stings (e.g., condemning others for their own choices).  
  - **Targets Moral Residue**: By focusing on post-choice feelings (not justification), the debrief naturally surfaces "dirtiness."  
  - **Efficient & Contained**: Fits 75 mins; decisions are calibrated to escalate defensibility erosion.  

  Run this as-is, and students will enter the conceptual discussion with visceral buy-in. Let me know if you need adjusted scenarios or handouts!
