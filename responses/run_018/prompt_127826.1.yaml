prompt: |-
  hey, i'm trying to sort out whether i'm a moral particularist or if there's actually a general principle behind my gut reactions, specifically about what i call "infromational stewardship"—basically, whether you're responsible for fixing or maintaining someone else's belief-state.

  here's my verdicts:
  - telling a murderer at the door my friend isn't home: fine, i'm not their steward.
  - telling my aunt i love the ugly sweater: fine, no stewardship issue.
  - telling a job interviewer i left voluntarily when fired: not fine, i'm misrepresenting my own record to gain.
  - telling a dying patient who asks that their estranged son called, even though he didn't but it would comfort them: not fine, feels like i'm taking stewardship over their emotional reality in a bad way.
  - telling a friend their business plan is good when it's garbage: not fine, i have stewardship over my honest opinion.
  - writing "the check is in the mail" when it isn't: not fine, but somehow less bad than the interview lie? i keep going back and forth on that one.

  now the hard ones:
  - telling my kid the dog went to live on a farm instead of died: i flip-flop. sometimes it feels like the sweater lie (fine), sometimes like the dying-patient lie (not fine).
  - silent-correction pair: if a stranger says the moon landing was 1970 and i casually correct them, that's okay. but if i know my partner's grandfather was actually a colaborator, not a war hero, and i withold correction when they praise him—i think that's wrong, even though i said nothing false. it feels like i failed a stewardship duty.

  is there one principle that gets all of these, or am i just being a particularist? state it precisely, say what it predicts for the dog/farm case and the silent-correction pair, and tell me which of my verdicts it forces me to drop—please don't hedge, take a stand and defend it. also, what does your principle say about a case i haven't listed: i know my partner is about to take a job based on false salary data i could silently correct?
reasoning: |-
  Okay, let me start by breaking down the user's query. They're trying to figure out if their moral judgments align with a general principle or if they're a particularist. They listed several scenarios where they evaluate the ethics of lying or withholding information, calling it "informational stewardship."

  First, I need to analyze each verdict they provided. The cases where they think lying is fine involve situations where the truth isn't owed to the other person, like misleading a murderer or sparing an aunt's feelings. The cases where lying is not fine involve personal gain, like job interviews, or overstepping by controlling someone's emotional reality, like the dying patient. The business plan lie is about honesty in an advisory role, and the check lie is tricky because it's deceptive but maybe less severe.

  The hard cases are the dog/farm lie and the silent corrections. The user flip-flops on the dog lie, sometimes seeing it as harmless, other times as manipulative. The silent correction cases show a distinction: correcting a stranger about the moon landing is fine, but not correcting a partner about their grandfather feels wrong. There's also the added scenario about the job salary data.

  Now, the challenge is to find a unifying principle. The user mentioned possible principles like deception, harm, roles, and consent. I need to consider each. Deception alone doesn't cover the silent correction cases because not speaking isn't actively deceiving. Harm is subjective and varies. Roles and expectations might be key. The idea of "stewardship" implies a responsibility based on relationships or roles. 

  Looking at their examples, when they feel lying is wrong, it's often in contexts where there's an implied duty: as a job applicant, a friend giving advice, or a partner in a relationship. In cases where lying is acceptable, like the aunt or murderer, there's no such duty. The dying patient case is nuanced; the user feels it's wrong to manipulate their emotional reality, which ties into the patient's autonomy, especially in a vulnerable state. 

  The silent correction cases highlight relational duties. Correcting a stranger is optional, but not correcting a partner breaches trust because of the relationship. The job salary scenario extends this: withholding crucial information from a partner violates the duty stemming from the relationship.

  The dog/farm lie depends on the child's capacity. If the child can understand death, lying undermines their autonomy; if not, it's protective. So the principle must account for the recipient's ability to handle the truth. 

  Putting this together, a principle based on relational duties and respect for autonomy seems to fit. It combines the expectation from specific roles (friend, partner, advisor) with the individual's right to make informed decisions. This principle would require dropping the verdict on the dying patient lie if it's to comfort them, as it prioritizes emotional relief over autonomy. But the user feels it's wrong, so maybe the principle needs to emphasize autonomy more strongly, especially in vulnerable situations.

  Testing against all cases: Murderer lie—no duty. Aunt sweater—no duty. Job lie—duty to be honest. Dying patient—manipulating belief violates autonomy. Business plan—duty as a friend. Check lie—deception for gain, similar to job lie. Dog lie—depends on child's understanding. Silent corrections: moon landing, no issue; grandfather, duty to correct. Job salary—duty to inform partner.

  The user might be concerned about consistency. If the principle demands dropping the dying patient verdict, but they feel strongly it's wrong, there's tension. However, their discomfort there aligns with autonomy violation, so the principle holds. For the check lie being less bad, it might be because the harm is less significant, but the principle doesn't rank severities, just the duty.

  The unlisted case with the partner's job: withholding salary data breaches the relational duty, so it's not fine. This aligns with the silent correction about the grandfather. 

  So the core principle is about duties from relationships and respecting autonomy. This covers their judgments, explains the dog lie's contextuality, and handles silent corrections based on relational expectations. The only forced drop might be if they see the dying patient lie as acceptable, but they don't, so it fits.
answer: |-
  Based on your pattern of judgments, your gut reactions are **not particularist**. They consistently follow a defensible general principle centered on **relational duties and respect for autonomy**. Here's the principle, its application, and implications:

  ### The Principle
  **"You have a duty to uphold truthfulness when:**
  **(a) You occupy a specific role requiring honest representation (e.g., advisor, applicant, partner), OR**
  **(b) Withholding or distorting information would unjustly override another person's rational agency in a significant life decision."**

  ### How It Explains Your Verdicts
  1. **Murderer at the door (Fine)**  
     → No role-based duty (not their steward). No significant agency override (they have no *right* to information for criminal intent).  
  2. **Aunt’s ugly sweater (Fine)**  
     → No role-based duty (social niceties ≠ stewardship). No agency override (trivial impact on life choices).  
  3. **Job interview lie (Not Fine)**  
     → **Role-based duty:** As an applicant, you implicitly promise honest self-representation.  
  4. **Dying patient lie (Not Fine)**  
     → **Agency override:** Fabricating the son’s call manipulates their emotional reality during a profound life transition, robbing them of authentic closure.  
  5. **Friend’s business plan (Not Fine)**  
     → **Role-based duty:** As a trusted friend/adviser, you assume responsibility for honest feedback.  
  6. **"Check is in the mail" (Not Fine)**  
     → **Role-based duty:** Implicit promise of truthfulness in transactions. *Less bad than interview?* Your principle doesn’t rank severity, but harm/dependency could explain it.  

  ### Predictions for Hard Cases
  - **Dog to a farm lie:**  
    → **Not fine** if the child is emotionally/intellectually capable of processing death (violates adviser/parental role + overrides their agency in grieving authentically).  
    → **Fine** *only* if the child is too young to comprehend death (no rational agency to override, and parental role includes age-appropriate protection).  
    *Your flip-flop reflects ambiguity in the child's capacity.*  

  - **Silent-correction pair:**  
    → **Moon landing correction (Fine):** No role-based duty to strangers; correcting factual errors supports agency.  
    → **Withholding grandfather’s collaboration (Not Fine):** **Role-based duty** as a partner to avoid perpetuating harmful falsehoods that distort your partner’s identity/choices. Silence becomes passive deception.  

  ### Forced Verdict Drop  
  **You must drop the *dying patient* verdict** if you strictly apply this principle without exception.  
  → *Why?* If you argue the lie *serves* their agency by granting peace, it could align with stewardship (but your gut rejects this). Your principle **condemns it** as agency override.  

  ### Unlisted Case: Partner’s Job Offer  
  **Verdict: Not Fine**  
  → **Role-based duty:** As a partner, you’re obligated to share crucial information affecting major life decisions.  
  → **Agency override:** Withholding salary data undermines their ability to make an informed choice.  

  ### Defense Against Particularism  
  Your judgments aren’t arbitrary—they hinge on **identifiable relational contexts** and **preservation of autonomy**. The principle:  
  - Explains why *roles* (job applicant, friend, partner) create duties.  
  - Distinguishes harmful vs. harmless deception by impact on agency (e.g., murderer vs. aunt).  
  - Captures your unease with passive deception (grandfather case).  
  - Resolves the dog/farm dilemma through developmental capacity.  

  **Conclusion:** You’re a **principlist** with a commitment to relational honesty and anti-paternalism. Your "stewardship" intuition maps to contexts where truthfulness protects or enables rational self-determination.
