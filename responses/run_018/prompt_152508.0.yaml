prompt: |-
  I am organizing a monthly seminar for an interdisciplinary group of postdoctoral researchers—mostly in the life sciences and public health—who have strong statistical intuition but no formal background in social choice theory. For our next meeting I need to present the Condorcet jury theorem, but I want to avoid the standard classroom framing of jury verdicts or presidential elections. Instead, I want the explanation to turn on a single, concrete scenario in distributed scientific peer review: a panel of five reviewers, each with independent competence in assessing only one methodological pillar of a complex study, voting on publication without conferring. I am not asking you to explain the theorem to me; I need a teaching plan for how I should structure the fifty-minute session. Specifically, what component must be introduced first—the definition of voter competence as a probability parameter, or the independence assumption—and why does the other depend on it? What should be the carrying example or scenario that makes the aggregation result feel inevitable rather than magical, and what properties must it have (e.g., no hidden communication, no shared software bias) and what must it deliberately lack? Which misconceptions do you anticipate—such as the belief that correlated errors always reduce accuracy, or that majority rule dominates a single expert—and at exactly which point in the sequence should each be anticipated and defused? Include one precise check-for-understanding question I can pose at the end to verify they understand why the theorem collapses when individual competence falls below one-half. Finally, state explicitly what mathematical derivation or formal result I should openly leave out at this level—presumably the full binomial expansion—and explain how to frame that omission so it does not feel like a gap in credibility.
reasoning: |-
  Okay, the user is organizing a seminar for postdocs in life sciences and public health who have strong stats intuition but no social choice theory background. They want to teach the Condorcet Jury Theorem using a distributed peer review scenario instead of the typical jury/election framing. 

  Hmm, the key challenge here is making abstract theory feel concrete for scientists. The peer review angle is brilliant—it's immediately relevant to their world. I need to construct a scenario that forces them to confront the theorem's assumptions organically. 

  First, competence vs independence—which comes first? Competence must lead. If I start with independence, it feels like an arbitrary constraint. But if I show five experts each assessing one pillar (statistical design, data quality etc.), competence becomes intuitive: "When focused on their specialty, each gets it right p=0.7 of the time." Only then does independence make sense: "But since they don't talk and have no shared biases..."

  The scenario needs surgical design: 
  - Must lack: communication channels, overlapping expertise, identical tools (avoids correlation)
  - Must have: clear binary decision (publish/revise), defined individual domains
  I'll use "Reviewing the OmniCell Study" with concrete pillars like "RNA-seq normalization method choice" to exploit their domain knowledge.

  Anticipating misconceptions:
  - "Correlation always hurts" → counter with paradox: if all reviewers share a blind spot, majority amplifies error
  - "Single expert better than majority" → contrast 70% solo vs 83% panel success rates
  These land best right after showing the probability calculation.

  For the p<0.5 collapse, a checkpoint question: "If each reviewer is only 40% competent, what happens to majority accuracy?" They should intuit inversion—the wrong answer becomes probable. 

  Formal omission: binomial expansion. I'll frame it as "We're leveraging your stats intuition—you recognize summing binomial probabilities here—but we'll skip the full derivation to focus on implications." This honors their intelligence while avoiding tedium.

  The session arc should feel like peeling an onion: start with concrete review scenario → reveal competence assumption → expose independence need → demonstrate aggregation math → debunk myths → test understanding. Fifty minutes is tight, so the peer review metaphor must do heavy lifting throughout.
answer: |-
  Here’s a structured 50-minute teaching plan tailored to your audience, leveraging distributed peer review to ground the Condorcet Jury Theorem (CJT) in scientific practice:

  ---

  ### **Phase 1: Hook & Concrete Scenario (8 min)**
  **Activity:** Introduce the **"OmniCell Study"** — a complex paper with *five interdependent methodological pillars* (e.g., RNA-seq normalization, cohort selection bias, confounder adjustment, power calculation, reagent validation).  
  **Problem:** A funding deadline requires immediate publication decisions. Five reviewers (each a specialist in *exactly one pillar*) must vote **independently** (no communication, shared tools, or overlapping expertise) on **accept/reject** based *only* on their pillar’s integrity.  
  **Question to pose:** *"If each reviewer is usually reliable in their niche, does aggregating votes improve the final decision?"*  

  ---

  ### **Phase 2: Define Competence First (10 min)**  
  **Why competence precedes independence:**  
  Competence is an intuitive probabilistic parameter (*p*) for scientists. Independence is meaningless without defining *what* is being measured independently.  
  **Key framing:**  
  > *"Competence = Probability that Reviewer *i* correctly assesses their assigned pillar. Assume all reviewers share the same *p* for simplicity."*  
  **Use a slider:** Ask, *"If p = 0.6, would you trust the panel? What if p = 0.9?"*  
  **Emphasize:** *p > 0.5* is the minimal threshold for "better than random" expertise.

  ---

  ### **Phase 3: Introduce Independence (7 min)**  
  **Why now?** Competence defines individual reliability; independence defines how errors correlate.  
  **Scenario constraints to highlight:**  
  - **No hidden communication:** Reviewers work in isolation.  
  - **No shared biases:** Each uses distinct tools (e.g., different RNA-seq alignment software).  
  - **Pillar interdependence:** Errors *are* correlated if the study design links pillars, but reviewers *don’t know this* (their judgments remain independent).  
  **Misconception preemption:** *"Correlated errors always hurt accuracy"* → Counter with: *"Correlation can amplify correct outcomes too. CJT requires independence to model error propagation cleanly."*  

  ---

  ### **Phase 4: Aggregation Result (15 min)**  
  **Make it inevitable, not magical:**  
  1. **Visualize:** 5 reviewers, *p* = 0.7. Calculate P(correct majority) step-by-step:  
     - P(3 correct) = *C(5,3) × (0.7)^3 × (0.3)^2*  
     - P(4 correct) = ...  
     - P(5 correct) = ...  
     **Sum ≈ 0.837** → *"83.7% group accuracy vs. 70% individual accuracy."*  
  2. **Contrast:** Ask *"Would you prefer one reviewer or the majority?"* → Highlights *collective intelligence*.  
  3. **Key insight:** *"Majority rule *amplifies* individual competence when p > 0.5."*  

  ---

  ### **Phase 5: Address Misconceptions (5 min)**  
  **Anticipate and defuse:**  
  - **"Single expert > majority?"**: Debunk when showing aggregation math (*p=0.7*: 70% vs 84%).  
  - **"Correlation always reduces accuracy?"** → Clarify *after* independence: *"CJT assumes independence because correlation can distort outcomes unpredictably."*  
  - **"More voters always help?"** → Note: True *only if p > 0.5* (preview collapse).  

  ---

  ### **Phase 6: Threshold Collapse & Check (5 min)**  
  **Critical concept:** CJT fails when *p < 0.5*.  
  **Check-for-understanding question:**  
  > *"If each reviewer’s competence drops to p=0.4, what happens to the majority’s accuracy? Why?"*  
  **Expected answer:** Accuracy falls *below 50%* (calculate 1–P(majority correct) ≈ 1–0.317 = 68.3% incorrect).  
  **Why?** *"Below p=0.5, errors become systematic. Majority rule amplifies *wrong* answers."*  

  ---

  ### **Omission: Formal Binomial Derivation**  
  **What to skip:** Full binomial expansion/proof for *n* voters.  
  **How to frame it:**  
  > *"You’ve seen how we sum binomial probabilities for *n=5*. For larger panels, we’d extend this logic—but the key insight is that majority accuracy follows a binomial distribution. We’re omitting the general-case algebra to focus on how this applies to your work. Remember: CJT is a *limit theorem*, and your stats intuition already grasps the mechanics."*  

  ---

  ### **Session Flow Summary**
  | **Time** | **Component**               | **Pedagogic Purpose**                                  |
  |----------|-----------------------------|--------------------------------------------------------|
  | 0-8 min  | OmniCell Study scenario     | Ground CJT in scientific pain points; create stakes    |
  | 8-18 min | Competence (*p*)            | Define core probability parameter                      |
  | 18-25 min| Independence                | Link constraints to error independence                 |
  | 25-40 min| Aggregation math (n=5)      | Demystify majority amplification; use their stats intuition |
  | 40-45 min| Misconceptions              | Preempt misapplication; reinforce assumptions          |
  | 45-50 min| *p*<0.5 collapse + Check    | Highlight threshold sensitivity; verify understanding  |

  ---

  ### **Why This Works for Your Audience**
  - **Relevance:** Peer review is viscerally familiar; pillars mirror interdisciplinary collaboration.  
  - **No magic:** Competence → Independence → Aggregation is a causal chain.  
  - **Stats leverage:** They already intuit distributions—calculating P(majority) for *n=5* is accessible.  
  - **Debunking upfront:** Isolates independence as a *practical* constraint (not just theoretical).  

  This structure transforms CJT from abstract theory into a tool for evaluating collective decision-making in science—precisely aligning with their daily challenges.
