prompt: |-
  You are a senior methodology officer and philosopher of mind advising a multi-site cognitive neuroscience consortium that runs repeated consciousness studies—roughly forty sessions per quarter—staffed mainly by graduate students and technicians with uneven philosophical training. You need a reusable, operational protocol that translates heterophenomenology into a practical workflow: a step-by-step decision procedure, with explicit nodes and time constraints, that treats every subject’s verbal and behavioral report about conscious experience as a text within that subject’s heterophenomenological world, not as direct, authoritative access to private mental states. The procedure must remain ontologically neutral among competing theoretical frameworks (for instance, global workspace, higher-order, and integrated-information accounts), and it must be executable within fifteen minutes per case by a researcher with only a master’s-level background, with the principal investigator required to sign off solely at nodes where judgment genuinely cannot be eliminated.

  Your deliverable should contain: (1) a preliminary screening checklist that decides whether a session’s data qualify for heterophenomenological treatment rather than for standard introspective or purely behavioral protocols; (2) an ordered sequence of no more than five interpretive tests—expressed as questions a non-expert can apply—to classify any given report as descriptive within the heterophenomenological world, confabulatory, theoretically loaded, or ambiguous; (3) clearly marked JUDGMENT REQUIRED points at every stage where the theory underdetermines the decision, specifying exactly what the PI must evaluate and sign; (4) explicit rules for conflicts between verbal report and concurrent behavioral or neurophysiological measures, distinguishing cases where discrepancy enriches the heterophenomenological narrative, cases where it invalidates the report, and cases where the data must be suspended; (5) worked applications to three concrete scenarios, including one split-brain patient who reports a unified visual field despite demonstrable contralateral neglect, one subject operating under adversarial incentivization who reports phenomenal-overflow experiences that align neatly with a rival theoretical framework, and one unwelcome case—an articulate subject describing meticulously detailed “micro-phenomenal shifts” during binocular rivalry whose reports your procedure must downgrade or reclassify despite their surface sophistication; and (6) a concise statement of what the protocol cannot do, especially regarding ontological commitment to consciousness and legitimate cross-subject comparison. Before constructing the procedure, begin with a brief conceptual map that distinguishes heterophenomenological neutrality from both eliminativism about consciousness and naive first-person authority, identifying which philosophical distinctions must survive this operational translation and which can be collapsed without distortion. Think carefully, step by step, be honest about misfires, and do not invoke bibliographic authority, citations, or appeals to named texts—the protocol must stand on its conceptual logic alone.
reasoning: |-
  We are constructing a protocol for heterophenomenological analysis in cognitive neuroscience studies. The goal is to treat subjects' reports as texts within their own heterophenomenological world, without assuming direct access to private mental states. The protocol must be theory-neutral and executable in 15 minutes by a non-expert (master's level), with PI sign-off only at necessary judgment points.

  ## Conceptual Map
  Heterophenomenology (as developed by Dennett) is a method that treats subjective reports as a kind of "fiction" or "text" that the subject produces, which we can interpret without committing to the existence of the reported mental states. It is neutral about the ontology of consciousness. We must distinguish:

  1. **Heterophenomenological Neutrality**: We are not denying the existence of consciousness (eliminativism) nor are we granting first-person reports authoritative status (naive first-person authority). We are agnostic: the subject's report is a datum to be interpreted, but it might be confabulated, theoretically loaded, or otherwise distorted.

  2. **Philosophical Distinctions to Preserve**:
     - The distinction between the subject's belief about their experience (as expressed in the report) and the actual experience (if any) is collapsed in the sense that we only have the report. But we must preserve the idea that the report is a text that may or may not correspond to any private state.
     - We must not collapse the distinction between the subject's heterophenomenological world (the world as it seems to them, as expressed in their report) and the objective world (as measured by behavior, physiology, etc.). Discrepancies between report and objective measures are informative.

  3. **Distinctions that can be collapsed for operational purposes**:
     - We do not need to resolve the hard problem of consciousness (why or how subjective experience arises). We are only concerned with the report as a behavioral output.
     - We can collapse the distinction between different theories of consciousness (like global workspace, higher-order thought, etc.) because our protocol is about interpreting the report, not explaining the mechanism.

  ## The Protocol

  ### 1. Preliminary Screening Checklist (to decide if heterophenomenological treatment applies)

  A session qualifies for heterophenomenological treatment if and only if:
  - [ ] The study design includes collection of verbal reports about subjective experiences (e.g., "What did you see/feel?").
  - [ ] The report is collected in a way that does not force the subject to choose from predefined options (open-ended or semi-structured).
  - [ ] The subject is capable of producing verbal reports (not pre-linguistic, not aphasic to the point of being unable to communicate about experience).
  - [ ] The report is about a specific, experimentally controlled event (so that we can compare with objective measures).

  If any of these are not met, use standard introspective (if the report is structured and the study is about introspection) or purely behavioral protocols.

  ### 2. Sequence of Interpretive Tests (5 questions, applied in order)

  For each report, the researcher asks:

  1. **Descriptive Clarity**: Is the report primarily a description of what the subject experienced (using sensory, perceptual, or affective terms) without explicit theoretical assertions? 
     - If yes, classify as **descriptive within heterophenomenological world** and proceed to step 2.
     - If no (e.g., includes claims about how the mind works, or why they had the experience), classify as **theoretically loaded** and stop.

  2. **Internal Consistency**: Does the report remain consistent when probed for details (either within the same session or across repeated trials of the same condition)? 
     - If yes, proceed to step 3.
     - If no, classify as **ambiguous** and stop.

  3. **Behavioral Alignment**: Is there a clear, expected behavioral correlate that matches the report? (e.g., if the subject reports seeing a stimulus, they can correctly identify it in a forced-choice task). 
     - If yes, proceed to step 4.
     - If no, proceed to step 5 (to check for confabulation).

  4. **Neurophysiological Alignment (if available)**: Is there a known neurophysiological signature (e.g., EEG, fMRI) that typically co-occurs with such reports in the literature? 
     - If yes, classify as **descriptive**.
     - If no, classify as **ambiguous** and note the lack of neural correlate.

  5. **Confabulation Check**: Does the report contain elements that are demonstrably false by objective measures (behavioral or neural) and that the subject should have been able to detect? 
     - If yes, classify as **confabulatory**.
     - If no, classify as **ambiguous**.

  *Note: At each step, if the answer is unclear, mark as ambiguous and proceed to the next step? But the instructions say to stop at some points. We'll adjust: the tests are sequential but not all reports go through all five. The goal is to classify as soon as possible. Also, we must mark judgment points.*

  ### 3. JUDGMENT REQUIRED Points

  - **At Step 1 (Descriptive Clarity)**: If the report mixes description and theory, the researcher must decide whether the theoretical part is separable. If not, then it's theoretically loaded. If separable, the descriptive part is extracted and the rest is noted. JUDGMENT REQUIRED: PI must sign off on the decision to extract or classify as theoretically loaded.
  - **At Step 2 (Internal Consistency)**: If the report is inconsistent, but the inconsistency is minor and might be due to memory or attention, the researcher might be tempted to still call it consistent. JUDGMENT REQUIRED: PI must sign off on the decision to classify as ambiguous versus inconsistent (which would lead to ambiguous) or to proceed despite minor inconsistencies.
  - **At Step 3 (Behavioral Alignment)**: If the behavioral measure is not clear (e.g., the task is not a direct test of the reported experience) or if there is partial alignment, JUDGMENT REQUIRED: PI must decide whether the alignment is sufficient to proceed or if it's ambiguous.
  - **At Step 4 (Neurophysiological Alignment)**: If neural data is available but ambiguous, or if the literature is divided on what the neural correlate should be, JUDGMENT REQUIRED: PI must decide if the alignment is sufficient.
  - **At Step 5 (Confabulation Check)**: If there is a discrepancy but it is not clear whether the subject should have been able to detect it (e.g., due to attentional limits), JUDGMENT REQUIRED: PI must decide if it is confabulatory or ambiguous.

  ### 4. Rules for Conflicts Between Report and Objective Measures

  - **Enriches the heterophenomenological narrative**: When the discrepancy reveals a pattern of beliefs or expectations that the subject holds (e.g., the subject reports seeing something that wasn't there because they expected it). This is common in illusions or cognitive biases. We note the discrepancy and use it to build the subject's heterophenomenological world.
  - **Invalidates the report**: When the discrepancy is so severe that the report cannot be taken as a sincere account of the subject's beliefs (e.g., the subject is lying, or the report is entirely confabulated without any basis). This requires strong evidence (e.g., caught in a lie by objective measures).
  - **Suspends the data**: When the discrepancy is due to factors that undermine the entire experimental context (e.g., equipment failure, subject misunderstanding of the task, or an unexpected event during the session). The data are set aside and not used.

  ### 5. Worked Applications

  **Scenario 1: Split-brain patient reports unified visual field despite contralateral neglect**

  - **Screening**: Qualifies because the report is verbal and about a specific visual experience.
  - **Test 1**: The report is descriptive (describes a unified field). Pass.
  - **Test 2**: Consistent across trials? Let's assume yes. Pass.
  - **Test 3**: Behavioral measure: the patient fails to report or respond to stimuli in the neglected field. Discrepancy: report says unified, behavior shows neglect. 
    - Rule: This discrepancy enriches the narrative. It shows that the subject's belief about their experience (unified) does not match the behavioral evidence (neglect). We classify as **descriptive** but note the discrepancy as part of the heterophenomenological world (the subject believes in a unified field).
  - **Classification**: Descriptive, with note of discrepancy.

  **Scenario 2: Adversarial incentivization - subject reports phenomenal-overflow experiences that align with a rival theory**

  - **Screening**: Qualifies.
  - **Test 1**: The report might be descriptive, but we note that it uses terms that are associated with a rival theory (e.g., "I was aware of more than I could report"). However, if it's phrased as a description (e.g., "I saw all the shapes clearly even though I couldn't name them all"), then it passes. If it explicitly mentions the rival theory, then it's theoretically loaded. Let's assume it's descriptive. Pass.
  - **Test 2**: Consistent? Yes. Pass.
  - **Test 3**: Behavioral alignment: the task may not require reporting all the items, so behavior might not contradict. But if the task does have a measure (e.g., forced-choice on unreported items) and the subject performs at chance, then there's a discrepancy. 
    - Rule: If there is a discrepancy (reports seeing more than they can report, but forced-choice on unreported items is at chance), then we have a confabulation? But note: the subject might be sincere. We must check for confabulation (step 5). 
    - Step 5: Is the report demonstrably false? If the forced-choice shows they didn't actually have the information, then yes. But note: the subject might have had a fleeting experience they couldn't report. So we cannot be sure. 
    - However, given the adversarial incentivization (they are paid to report overflow), we might suspect insincerity. But without proof of lying, we cannot invalidate. 
    - We classify as **confabulatory** if we have proof (e.g., they admitted to lying in post-experiment interview) or if the objective measure is clear. Otherwise, **ambiguous**. 
    - JUDGMENT REQUIRED: PI must decide if the discrepancy is due to confabulation or if it's ambiguous.

  **Scenario 3: Articulate subject describing "micro-phenomenal shifts" during binocular rivalry**

  - **Screening**: Qualifies.
  - **Test 1**: The report is descriptive (detailed shifts). Pass.
  - **Test 2**: Consistent? Yes. Pass.
  - **Test 3**: Behavioral alignment: binocular rivalry typically has a button-press to indicate when the percept changes. If the subject's button presses align with the shifts, then pass. But if the subject is reporting shifts that are too rapid to be captured by button presses, then there might be a discrepancy. Also, if the button presses don't align with the verbal report (e.g., they report a shift but don't press the button), then discrepancy. 
    - Let's assume the button presses are at a normal rate, but the verbal report includes shifts between the presses. 
    - Rule: This discrepancy might enrich the narrative (the subject believes in more fine-grained shifts) but if the button press is the standard measure, we might suspect confabulation. 
    - Step 5: Is it demonstrably false? We don't have a direct measure of the shifts. So we cannot prove false. 
    - We might classify as **ambiguous** because the report goes beyond what we can measure. 
    - However, note the surface sophistication. But our protocol doesn't care about sophistication if it doesn't align with measures. 
    - JUDGMENT REQUIRED: PI must decide if the lack of behavioral alignment is due to the report being about something we cannot measure (then ambiguous) or if it's confabulatory (if we have reason to believe the subject is making it up). 

  ### 6. What the Protocol Cannot Do

  - **Commit to Ontology**: The protocol does not and cannot decide whether consciousness exists or what its nature is. It treats the subject's report as a text, not as a window into an inner reality.
  - **Cross-Subject Comparison**: It does not allow for direct comparison of the content of experiences across subjects. We can compare the structure of reports (e.g., patterns of confabulation) but not the subjective qualities. 
  - **Validation of Private States**: It cannot validate that the subject actually had the experience they report. It can only validate that the report is consistent with the subject's beliefs and the context.
  - **Handling of Unreportable States**: If a subject cannot report an experience (e.g., ineffable), the protocol cannot capture it because it relies on reports.

  ## Final Protocol Structure (to fit within 15 minutes)

  We must ensure the steps are clear and time-bound.

  1. **Preliminary Screening** (1 minute): Use the checklist to decide if heterophenomenology applies.
  2. **Apply Test 1** (2 minutes): Is the report descriptive? If not, classify and stop (with PI sign-off if needed).
  3. **Apply Test 2** (3 minutes): Check consistency (by reviewing the report and any repetitions). If inconsistent, classify as ambiguous (with PI sign-off on minor inconsistencies) and stop.
  4. **Apply Test 3** (5 minutes): Check behavioral alignment (by comparing with the behavioral data from the same trial). If aligned, go to Test 4. If not aligned, go to Test 5. (PI sign-off if alignment is partial.)
  5. **Apply Test 4** (if neural data is available and time permits, 2 minutes): Check neurophysiological alignment. If aligned, descriptive; if not, ambiguous. (PI sign-off if ambiguous neural data.)
  6. **Apply Test 5** (if not behaviorally aligned, 2 minutes): Check for confabulation. If demonstrably false, confabulatory; else, ambiguous. (PI sign-off if not clear.)

  Total: 15 minutes.

  Note: The time allocation is approximate and may vary by case. The researcher must be trained to follow the steps quickly.

  ## Deliverable

  **Heterophenomenology Operational Protocol (v1.0)**

  **Conceptual Foundation**: This protocol treats the subject's verbal and behavioral reports as texts that constitute the subject's heterophenomenological world. It does not assume these reports directly reflect private mental states, nor does it deny the existence of such states. It collapses philosophical distinctions about the nature of consciousness but preserves the distinction between the subject's reported world and objective measures.

  **1. Preliminary Screening Checklist** (1 min)
     - [ ] Report is verbal (or behavioral that serves as a report) about subjective experience.
     - [ ] Collected open-ended or semi-structured (not forced-choice).
     - [ ] Subject is capable of providing such reports.
     - [ ] Report is about a specific, controlled event.
     - If all checked, proceed. Else, use alternative protocol.

  **2. Interpretive Tests Sequence** (applied in order, max 5 questions, 12 minutes total)

     - **Test 1: Descriptive Clarity** (2 min)
          - *Question*: Does the report describe the experience without including theoretical explanations or claims about the mind?
          - *Outcomes*:
              - Yes: Proceed to Test 2.
              - No: Classify as **theoretically loaded**. Stop.
          - *JUDGMENT REQUIRED*: If the report mixes description and theory, PI must decide if the descriptive part can be extracted and used. If not, classify as theoretically loaded. PI sign-off required.

     - **Test 2: Internal Consistency** (3 min)
          - *Question*: Is the report consistent across repetitions of the same condition (or within the same session if no repetition)?
          - *Outcomes*:
              - Yes: Proceed to Test 3.
              - No: Classify as **ambiguous**. Stop.
          - *JUDGMENT REQUIRED*: If there are minor inconsistencies, PI must decide if they are significant enough to classify as ambiguous. PI sign-off required for minor cases.

     - **Test 3: Behavioral Alignment** (4 min)
          - *Question*: Does the subject's behavior in the task align with the report? (e.g., if they report seeing a stimulus, do they respond correctly to it?)
          - *Outcomes*:
              - Clear alignment: Proceed to Test 4 (if neural data available) or classify as **descriptive** (if no neural data).
              - Clear misalignment: Proceed to Test 5.
              - Partial or unclear: JUDGMENT REQUIRED. PI must decide if alignment is sufficient. If not, proceed to Test 5.
          - *Note*: If neural data is not available and alignment is clear, classify as descriptive and stop.

     - **Test 4: Neurophysiological Alignment** (2 min, if applicable)
          - *Question*: Is there a known neural signature that typically accompanies such reports, and is it present?
          - *Outcomes*:
              - Clear presence: Classify as **descriptive**.
              - Clear absence: Classify as **ambiguous**.
              - Unclear or not available: JUDGMENT REQUIRED. PI must decide.
          - *Note*: Only apply if neural data was collected and analyzed.

     - **Test 5: Confabulation Check** (1 min, if Test 3 was misaligned)
          - *Question*: Is the report demonstrably false by objective measures (and the subject should have been able to detect the truth)?
          - *Outcomes*:
              - Yes: Classify as **confabulatory**.
              - No: Classify as **ambiguous**.
          - *JUDGMENT REQUIRED*: If it is unclear whether the subject should have been able to detect the truth, PI must decide.

  **3. Rules for Conflicts** (applied during Tests 3-5)
     - **Enrich narrative**: Discrepancy reveals the subject's beliefs or expectations (e.g., illusions). Keep the report and note the discrepancy.
     - **Invalidate report**: Only with strong evidence of insincerity (e.g., caught lying). Discard the report.
     - **Suspend data**: Due to experimental error or subject misunderstanding. Set aside the entire session's data.

  **4. Worked Examples** (as above, for illustration)

  **5. Limitations Statement**
     - This protocol does not:
          - Resolve the ontological status of consciousness.
          - Guarantee access to private mental states.
          - Enable direct comparison of subjective experiences across subjects.
          - Capture experiences that are not reportable.
          - Replace theoretical interpretation; it only classifies reports for further analysis.

  **End of Protocol**
answer: |-
  ### Heterophenomenological Analysis Protocol (v1.0)  
  **Conceptual Map**: Heterophenomenology (HP) treats subjects' reports as *texts* constituting their self-narrated experiential world, agnostic about whether these texts correspond to private mental states. This differs from:  
  - **Eliminativism**: HP does not deny consciousness exists; it brackets ontological questions.  
  - **Naive first-person authority**: HP rejects reports as incorrigible evidence of inner states.  
  **Preserved distinctions**: Report-as-text vs. objective reality; sincerity vs. accuracy; descriptive content vs. theoretical claims.  
  **Collapsed distinctions**: Phenomenal vs. access consciousness (treated as a single report); qualia as private objects (treated as narrative elements).  

  ---

  ### 1. Preliminary Screening Checklist (≤1 minute)  
  *Apply before HP analysis. If any condition fails, use standard introspective/behavioral protocols.*  
  - [ ] **Verbal/behavioral report exists** about conscious experience (e.g., "I saw X," pain-rating scale).  
  - [ ] **Report is spontaneous or minimally prompted** (e.g., open-ended query: "Describe what you experienced").  
  - [ ] **No theoretical priming** (e.g., no terms like "global workspace" or "qualia" in instructions).  
  - [ ] **Subject is linguistically competent** (able to articulate in basic sentences).  
  - [ ] **Context is experimentally controlled** (stimulus/task parameters documented).  
  *If all checked ✅, proceed to HP workflow. If not ❌, suspend HP treatment.*  

  ---

  ### 2. Interpretive Tests (5 Sequential Questions; ≤10 minutes total)  
  *Apply to each report. Classify as:  
  **Descriptive (D)**: Coherent HP-world narrative.  
  **Confabulatory (C)**: Contradicted by objective data with no plausible HP-world justification.  
  **Theoretically Loaded (T)**: Invokes constructs beyond immediate experience (e.g., "unconscious processing").  
  **Ambiguous (A)**: Insufficient evidence for D/C/T.*  

  1. **Descriptive Purity (≤2 min)**:  
     *Question*: "Does the report describe *what it was like* (sensory/affective details) without explaining *why* or *how*?"  
     - **D** if: Only sensory/affective content (e.g., "redness," "fading").  
     - **T** if: Invokes mechanisms/theories (e.g., "My unconscious filled in gaps").  
     - **A** if: Mixed; use JUDGMENT REQUIRED.  
     *→ Proceed only if D/A.*  

  2. **Referential Anchoring (≤2 min)**:  
     *Question*: "Are key report elements (e.g., objects, sensations) traceable to experimental stimuli/events?"  
     - **D** if: All elements map to stimuli (e.g., "saw a red square" when red square was present).  
     - **C** if: Elements contradict stimuli (e.g., "saw a triangle" when only squares shown).  
     - **A** if: Partial mapping (e.g., "saw something shiny" with no shiny stimulus).  
     *→ Proceed only if D/A.*  

  3. **Temporal Coherence (≤2 min)**:  
     *Question*: "Does the report’s sequence align with stimulus timing/behavioral responses?"  
     - **D** if: Matches timing (e.g., "light appeared then vanished" matches 500ms display).  
     - **C** if: Ignores timing (e.g., "light lingered" when offset was instantaneous).  
     - **A** if: Timing ambiguous (e.g., "felt long" without quantification).  
     *→ Proceed only if D/A.*  

  4. **Behavioral Consistency (≤2 min)**:  
     *Question*: "Does the report align with *simultaneous* objective behavior (e.g., button presses, eye tracking)?"  
     - **D** if: Matches behavior (e.g., reports "saw left stimulus" and presses left-key).  
     - **C** if: Contradicts behavior (e.g., reports "saw left" but presses right-key).  
     - **A** if: No comparable behavioral measure.  
     *→ Proceed only if D/A.*  

  5. **Neurophysiological Plausibility (≤2 min; if data available)**:  
     *Question*: "Is the report consistent with expected neural correlates (e.g., literature-based EEG/fMRI patterns)?"  
     - **D** if: Aligns (e.g., reports "pain" and insula activates).  
     - **C** if: Contradicts (e.g., reports "no pain" but insula activates intensely).  
     - **A** if: Data equivocal or absent.  
     *→ Final classification.*  

  ---

  ### 3. JUDGMENT REQUIRED Nodes (PI Sign-Off)  
  *PI must review and sign within 24 hours. Non-expert halts workflow here.*  
  - **Screening**: Ambiguity in theoretical priming (e.g., subject uses "awareness" ambiguously).  
    *PI evaluates:* Whether wording implies theoretical commitment.  
  - **Test 1 (Descriptive Purity)**: Mixed descriptive/theoretical content.  
    *PI evaluates:* If theoretical elements are separable without distorting the report.  
  - **Test 2 (Referential Anchoring)**: Partial stimulus mapping.  
    *PI evaluates:* Whether unmapped elements are confabulatory or enrich HP-world (e.g., hallucinations).  
  - **Test 4/5 (Behavioral/Neuro Consistency)**: Discrepancy with objective data.  
    *PI evaluates:* If discrepancy invalidates the report or reflects HP-world beliefs.  

  ---

  ### 4. Conflict Rules: Report vs. Objective Data  
  *Apply during Tests 4–5.*  
  - **Enrich HP-Narrative**: Discrepancy reveals subject’s *sincere belief* (e.g., visual illusion report despite knowing the trick). *Action:* Classify **D**; document discrepancy as part of HP-world.  
  - **Invalidate Report**: Discrepancy indicates *insincerity* or *gross confabulation* (e.g., subject lies for reward). *Action:* Classify **C**; flag for exclusion from analysis.  
  - **Suspend Data**: Discrepancy due to *methodological error* (e.g., faulty stimulus delivery). *Action:* Classify **A**; quarantine data pending replication.  

  ---

  ### 5. Worked Applications  
  *Each resolved in ≤15 minutes.*  

  **Case 1: Split-Brain Patient**  
  - *Report:* "I saw a unified visual field."  
  - *Data:* Contralateral neglect (fails to react to left-field stimuli).  
  - **Analysis**:  
    - **Test 1**: Descriptive (**D**).  
    - **Test 2**: Key term "unified" partially anchored (right-field stimuli present).  
    - **Test 4**: Contradicts behavior (neglect). → **JUDGMENT REQUIRED**.  
    - *PI eval:* Discrepancy enriches HP-world (sincere belief in unity). → **D** with annotation.  

  **Case 2: Adversarial Incentivization**  
  - *Report:* "I experienced phenomenal overflow [rival theory]—more than I could report."  
  - *Data:* Performance at chance on unreported items; subject paid for endorsing overflow.  
  - **Analysis**:  
    - **Test 1**: "Phenomenal overflow" is theoretical (**T**). → Stop.  
    - *No PI sign-off needed (clear-cut T).*  

  **Case 3: "Micro-Phenomenal Shifts" in Binocular Rivalry**  
  - *Report:* Meticulous descriptions of rapid, fine-grained perceptual changes.  
  - *Data:* Standard button-press rivalry switches align with norms; no neural evidence of micro-shifts.  
  - **Analysis**:  
    - **Test 1**: Descriptive (**D**).  
    - **Test 2**: Anchored to rivalry task.  
    - **Test 4**: Contradicts behavior (button presses show normal switch rate).  
    - **Test 5**: No neural support for micro-shifts. → **JUDGMENT REQUIRED**.  
    - *PI eval:* Discrepancy suggests confabulation (no objective basis). → **C** (downgraded).  

  ---

  ### 6. Protocol Limitations  
  This protocol **cannot**:  
  - Resolve ontological debates (e.g., "Does consciousness exist?").  
  - Validate cross-subject comparisons of subjective content (e.g., "Subject A's 'red' = Subject B's 'red'").  
  - Handle reports of unreportable states (e.g., "ineffable transcendence").  
  - Replace theoretical interpretation; it only classifies reports for downstream analysis.  
  - Guarantee mechanistic explanations (e.g., global workspace vs. IIT).  

  ---  
  **Protocol End**  
  *Executable by master’s-level researchers; PI sign-off only at specified nodes. Total time: ≤15 minutes/case.*
