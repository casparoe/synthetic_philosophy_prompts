prompt: |-
  You are a senior political philosopher specializing in the welfare state and normative theories of desert. Think carefully, and begin with a brief brainstorming of possible conceptual angles before drafting the document.

  My younger sibling was recently suspended from disability support after an administrative audit treated a missed reporting deadline as presumptive fraud rather than bureaucratic error. That experience convinced me that the label “undeserving poor” is doing hidden conceptual work: it seems to bundle together judgments about economic reciprocity, about whether claimants are epistemically trustworthy, and about who counts as a full social member, yet policy debates treat it as a single moral category. I need a formal two-page research proposal for a six-month independent study asking whether “undeservingness” is actually one concept or three—labor contribution, informational reliability, and social membership—that welfare administration illegitimately collapses. State the precise question so it could yield a determinate answer; explain why existing sociological and philosophical treatments leave it open, specifically that they treat the category as either a historical construct or a unified normative failure rather than a composite; outline the method (conceptual analysis of administrative categories paired with normative argument, month by month); describe what a successful disentanglement would look like, what failure would mean, and whether the project risks being too ambitious without empirical fieldwork; and include an honest assessment of realistic scope for six months. Do not provide a bibliography, reading list, or citations—I will supply references myself. Write in a polished, grant-appropriate register.
