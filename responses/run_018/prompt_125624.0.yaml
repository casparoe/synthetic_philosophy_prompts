answer: |-
  Here’s a tactical Q&A prep sheet ordered by potential damage severity, with rebuttals designed to preserve your core thesis while conceding strategic ground. Your nightmare scenario is addressed last.

  **Core Non-Negotiables to Defend:**  
  1. Dependency relations create irreducible moral claims distinct from individual aggregation.  
  2. "Systemic harm" (destruction of relational units) differs modally from distributive harm (loss of individuals).  
  3. Numbers *alone* don’t resolve conflicts between differently structured groups.  

  ---

  ### **1. The Normative Ethicist (Singer/Kamm sympathizer)**  
  **Objection:** *"This is just aggregation in disguise. You’re assigning greater weight to lives embedded in 'structured vulnerability,' then summing those weights. Isn’t this utilitarianism with a fancy relabeling of utility?"*  
  **Reply (2-min):**  
  > "Not at all. Aggregation sums individual interests; I reject that move. Structured vulnerability creates *emergent moral claims*: the parent-child unit isn’t valued because it satisfies more preferences, but because destroying it inflicts a distinct harm—the annihilation of a *relational good*. This is non-aggregative because we don’t compare total 'units' saved; we ask which choice avoids *systemic collapse* of irreplaceable bonds. It’s closer to Kamm’s 'inviolability' than Singer’s summation."  
  **Soft Spot:** Admits "greater weight" language invites aggregation analogies.  
  **Concede:** "You’re right that *assigning* weight risks mimicking aggregation—but the *source* of the weight (relational irreplaceability) is what breaks the analogy."  
  **Hold the Line:** Relational goods are non-fungible; their loss isn’t compensable by saving more strangers.  

  ---

  ### **2. The Political Philosopher (Relational Egalitarian)**  
  **Objection:** *"By privileging private dependencies (parent-child), you implicitly devalue public solidarity structures (communities, unions). Isn’t this a neoliberal atomization of care that undermines collective responsibility?"*  
  **Reply (2-min):**  
  > "A crucial correction: my view *includes* public structures if they exhibit genuine dependency (e.g., a mutual-aid network). But ad hoc groups of strangers don’t qualify. The objection reveals a limit: I need a robust account of *which* relations generate claims. However, this isn’t privileging private over public—it’s about *actual interdependency*, whether in a family or a community facing systemic oppression together. Your town-square example? If they’re strangers, they lack the requisite vulnerability structure."  
  **Soft Spot:** Undeveloped criteria for "genuine" public dependency.  
  **Concede:** "I agree my framework needs to better incorporate political solidarity—but it must meet a high bar of mutual reliance, not just co-location."  
  **Hold the Line:** Mere proximity ≠ structured vulnerability; solidarity requires demonstrable interdependence.  

  ---

  ### **3. The Effective Altruist (Longtermist)**  
  **Objection:** *"If relational units matter more, doesn’t this justify neglecting diffuse masses? Would you save one parent-child pair over 10^20 future lives in a simulation? If not, where’s the cutoff?"*  
  **Reply (2-min):**  
  > "My view operates in rescue cases with *comparable* stakes—not existential risk. Structured vulnerability doesn’t magically outweigh astronomical scales; it creates incomparable claims. But crucially: in your scenario, the 'diffuse' group *also* has relational structures (future families, communities). The tragedy is that *both* choices destroy relational goods. Here, we might revert to numbers—not because aggregation triumphs, but because we face *multiple systemic harms* with no non-arbitrary way to rank them."  
  **Soft Spot:** Avoids defining scope conditions for relational claims’ force.  
  **Concede:** "At genuinely astronomical scales, my framework may need supplementation—but it still rejects pure aggregation."  
  **Hold the Line:** Relational claims don’t dissolve at scale; they create moral dilemmas where no option preserves all systemic goods.  

  ---

  ### **4. The Decision Theorist**  
  **Objection:** *"Call it 'systemic harm' all you like, but you’re still maximizing preservation of relational units under uncertainty. This is just expected utility maximization with 'relation-years saved' as your currency."*  
  **Reply (2-min):**  
  > "Respectfully, no. Expected utility requires fungibility and compensability. But if I destroy a parent-child pair to save two strangers, I haven’t 'preserved more relation-years'—I’ve annihilated a unique good *even if* the strangers later form bonds. The harm is *constitutive*, not quantifiable. Decision theory can model *choices* after moral priorities are set, but it can’t derive why relational loss is non-substitutable."  
  **Soft Spot:** Struggles to explain why "non-fungibility" isn’t just a high disutility.  
  **Concede:** "I grant decision theory can *formalize* my view—but not *reduce* it. The modal distinction (distributive vs. systemic) is prior."  
  **Hold the Line:** Relational goods are intrinsically non-substitutable; their loss isn’t mitigable by substitution.  

  ---

  ### **5. The Nightmare Scenario: Global Triage**  
  **Question You Fear:** *"A small drowning town (10 parent-child pairs) vs. diverting resources from a pandemic response saving 10^6 strangers with diffuse relational ties. Does your view really demand saving the town, sacrificing orders of magnitude more lives and *their* relational networks?"*  
  **Reply (2-min):**  
  > "This exposes a limit case. First, note the pandemic group *does* have relational structures—they’re just currently latent. Second, saving the town causes *direct systemic annihilation*; not saving them *allows* distributive harm. But at this scale, the *cumulative destruction* of relational goods in the pandemic group may constitute a *second-order systemic harm*: collapse of societal capacity to sustain *any* relations. Here, we confront two systemic threats. I’d argue: save the many, not because we aggregate lives, but because allowing societal collapse destroys the *preconditions* for relational goods everywhere."  
  **Soft Spot:** Risks collapsing into indirect aggregation.  
  **Concede:** "At civilizational-stakes scales, numbers may override local relational claims—but *only* because mass death undermines the ecosystem of vulnerability itself."  
  **Hold the Line:** The shift isn’t back to aggregation; it’s a tragic conflict between *immediate* systemic harm (town) and *systemic collapse of the background conditions* for relationality (pandemic).  

  ---

  **Strategic Summary for Defense:**  
  - **Against Aggregation Charges:** Hammer the *non-fungibility* of relational units.  
  - **Against Scale Concerns:** Reframe mass loss as *second-order systemic harm* to relational preconditions.  
  - **Against Decision Theory:** Insist moral primacy of non-substitutability precedes formalization.  
  - **Nightmare Scenario Concession:** Admit scale thresholds where preserving relational *infrastructure* outweighs local units—but frame it as "systemics all the way down."  

  **Armor Your Modal Move:** Preemptively argue that "systemic harm" isn’t just *more* harm—it’s harm to a *different ontological category* (relations-as-such). Cite Kamm’s "components of value" or Gilbert on joint commitments to ground this.
