  Evolutionary analogies are another angle. Natural selection has a clear fitness goal, yet organisms develop subgoals like pain avoidance that sometimes misgeneralize. This shows misalignment despite consistent pressure. That's awkward for reductionists but not fatal since it's an analogy.

