answer: |-
  Here's a breakdown of the "memes are the genes of culture" slogan, evaluating its interpretations regarding AI replicators:

  *   **Trivial Analogy:** Memes *resemble* genes as informational replicators subject to variation/selection. **Defensible & Empty.** Doesn't rule out algorithmic replicators; LLM slogans clearly fit this basic "replicator" definition.
  *   **Shared Properties:** Memes exhibit inheritance, mutation, selection, competition *like* genes. **Defensible (broadly).** Doesn't rule out AI; algorithmic generation/viral spread easily map to mutation/selection, even if the "environment" (digital platforms) differs from purely human cognition.
  *   **Human-Cognitive Replication:** Memes *require* human brains for faithful copying and selection (biological-style pressure). **False/Overly Restrictive.** This is likely your group's smuggled premise to exclude "AI slop." It ignores non-human replication vectors (like algorithms/platforms) and defines "culture" too narrowly. Algorithmic replicators function mechanistically without direct brain copying.
  *   **Full Mechanistic Reduction:** Cultural evolution *is identical* to genetic evolution, memes *are* biological entities. **Empty/False.** Culture isn't reducible to DNA mechanics. This extreme view is indefensible and unnecessary. Algorithmic replicators operate under evolutionary logic but aren't biological genes.

  Your group likely relies on the **Human-Cognitive Replication** thesis to arbitrarily exclude AI-generated content, ignoring that algorithmic replicators satisfy core evolutionary principles (replication, variation, selection) within their digital environment.
