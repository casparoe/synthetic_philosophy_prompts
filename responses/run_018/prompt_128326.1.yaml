prompt: |-
  hey, my study group on dawkins-style cultural evolution keeps throwing around "memes are the genes of culture" whenever someone asks if LLM-generated slogans that spread virally without direct human copying still count as memetic replication. they seem to think that without biological-style selection pressure it's not "real" culture. can you lay out the seperate precise theses hiding in that slogan -- from trivial analogy to full mechanistic reduction -- and for each say whether it's defensible, false, or empty, and whether it actually rules out algorithmic replicators? also flag which reading my study-buddy is probably smuggling in to exclude AI slop. keep it to one paragraph with bullet points inside, max 200 words, no bibliographies.
reasoning: |-
  Okay, let me unpack this query about memes and LLM replication. The user's study group is debating whether viral AI-generated content counts as memetic replication without direct human copying, and they're invoking Dawkins' "memes are genes of culture" slogan to exclude it. 

  Hmm, the core tension seems to be between different interpretations of that slogan. I need to dissect its possible meanings from superficial analogy to strong reductionism. The user wants me to:
  - Identify distinct theses hidden in the slogan
  - Evaluate each as defensible/false/empty
  - Check if they rule out algorithmic replication
  - Expose which version their group likely uses to dismiss AI content

  I recall Dawkins' original meme concept was deliberately analogical, but some scholars later pushed for tighter biological parallels. The study group seems to be gatekeeping "real" culture by requiring human cognitive selection pressure - that's probably the smuggled premise. 

  For the response structure, I'll segment the slogan into four interpretations:
  1. Trivial analogy (defensible but doesn't exclude AI)
  2. Shared properties like variation/selection (defensible but AI fits)
  3. Literal cognitive replication (false - ignores non-human vectors)
  4. Full biological reduction (empty - culture isn't DNA)

  The third one is likely their weapon against "AI slop". I'll note that algorithmic replication actually satisfies key meme criteria like heredity/mutation/selection, just with different selection mechanisms. Their exclusion seems arbitrary if we accept broader evolutionary principles.

