  I am defending, in a workshop session of scalable-oversight engineers and mechanistic-interpretability researchers—plus two philosophers of science who maintain that alignment requires solving normative ontology first—the position that prosaic alignment should abandon direct value-encoding and instead build layered epistemic tripwires: institutional audit mechanisms that halt deployment when a system's world-model diverges from human-verifiable benchmarks in high-stakes domains, treating alignment as verified containment rather than value specification. I have twenty minutes plus Q&A. Draft my prep sheet: list the objections this audience will actually raise, ordered by likelihood and potential damage, each phrased in their vocabulary (scaling dynamics, interpretability bounds, institutional failure modes, normative prerequisites). For each objection, provide a concise reply deliverable in about two minutes, followed by an honest note on where that reply is weakest or concedes ground. State explicitly what I should concede at the outset regarding current false-positive rates and institutional latency. Close with the single question I am hoping nobody asks—specifically the one that exposes the gap between delaying misalignment via tripwires and actually solving inner alignment.
