prompt: |-
  I am a university student writing for an epistemology course on speech-act norms. Please draft the joint statement of an adversarial collaboration between two camps: those who hold that assertion is governed by a knowledge norm, and those who hold that rational, well-justified belief is sufficient even when knowledge is absent. Structure the response in American English as follows: first, a numbered list of claims both sides can sign regarding testimony, expert deference, and the lottery paradox; second, a disagreements table that states each position in neutral wording each camp would accept for itself, including on whether basic perceptual reports form an inviolate level that sits outside normative evaluation; third, the identified cruxes, with one being that alleged base-level exemption and another being delegated assertion in collective scientific practice; fourth, for each crux, a concrete case or line of reasoning both agree is relevant, together with each side's explicit prediction. Do not include bibliographies, reading lists, or citations; focus only on the conceptual structure and the residual disagreements.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration in epistemology. The two camps are:
   Camp A: Assertion is governed by a knowledge norm (KN). One must assert p only if one knows p.
   Camp B: Assertion is governed by a rational belief norm (RBN). One may assert p if one has a rational, well-justified belief that p, even if one does not know p.

   We structure the response as follows:

   1. A numbered list of claims both sides can sign regarding:
      - Testimony
      - Expert deference
      - The lottery paradox

   2. A disagreements table that states each position in neutral wording each camp would accept for itself, including on whether basic perceptual reports form an inviolate level that sits outside normative evaluation.

   3. The identified cruxes (with two specified: one being the base-level exemption and another being delegated assertion in collective scientific practice).

   4. For each crux, a concrete case or line of reasoning both agree is relevant, together with each side's explicit prediction.

   Let's begin.

   1. Joint Claims (both camps agree on the following):

      (1) Testimony: When an agent asserts p on the basis of testimony, the norm of assertion (whether KN or RBN) applies to the original asserter. The recipient of testimony may appropriately reassert p only if the recipient meets the norm of assertion (as per their camp) for p. Both camps agree that testimony can transmit justification, but they disagree on whether it can transmit knowledge without the recipient having independent grounds.

      (2) Expert Deference: In cases of expert deference, an agent appropriately defers to an expert's assertion only if the expert satisfies the norm of assertion (as per the camp's view) and the agent has reason to believe the expert is reliable. However, both camps note that the agent's own assertion based on deference must meet the agent's own norm (KN or RBN) for the proposition.

      (3) Lottery Paradox: Both camps agree that the lottery paradox highlights a challenge for the justification-based account of assertion. Specifically, for a large lottery with one winner, an agent may have a rational, well-justified belief that a particular ticket will lose (since the odds are very high), but it seems intuitively problematic to assert that a given ticket will lose. The knowledge norm camp takes this as evidence that only knowledge can license assertion, because one does not know that a particular ticket will lose. The rational belief camp, however, may argue that the intuition is about pragmatic factors or that the belief is not sufficiently justified in a way that matters for assertion, but they acknowledge the intuitive pull and may offer alternative explanations (e.g., by invoking contextual factors or a distinction between statistical and non-statistical beliefs).

   2. Disagreements Table:

      We present each camp's position in neutral wording that they would accept.

      | Issue | Knowledge Norm (KN) Camp | Rational Belief Norm (RBN) Camp |
      |-------|---------------------------|---------------------------------|
      | **Norm of Assertion** | One must: assert p only if one knows p. | One must: assert p only if one has a rational, well-justified belief that p. |
      | **Basic Perceptual Reports** | Basic perceptual reports (e.g., "I see a red apple") are subject to the knowledge norm. They are not inviolate; they are assertions and can be evaluated by the same norm. However, in normal conditions, such reports typically meet the knowledge norm. | Basic perceptual reports are typically beyond normative reproach when made in good faith under normal conditions. They form a base level of assertion that is inviolate in the sense that they are always appropriately asserted if the speaker has the relevant experience and is sincere, even if they turn out to be false (e.g., in a hallucination scenario). The RBN camp might hold that such reports are justified by the experience and thus meet their norm. |
      | **Delegated Assertion in Collective Science** | In collective scientific practice, when a scientist asserts a claim on behalf of a team, the norm of knowledge applies. The scientist must know the claim, which may be achieved through division of epistemic labor, but the knowledge must be present in the collective (e.g., via testimony from experts in the team). | In collective scientific practice, a scientist may assert a claim on behalf of the team if the team has rationally and justifiably accepted the claim, even if the asserting scientist does not personally know every detail. The team's justification is sufficient. |

   3. Identified Cruxes:

      Crux 1: The base-level exemption of basic perceptual reports from normative evaluation.
      Crux 2: Delegated assertion in collective scientific practice.

   4. Crux Analysis:

      Crux 1: Base-level exemption for basic perceptual reports.

          Case: Consider a scenario where a person, under normal lighting and viewing conditions, sees what appears to be a red apple and asserts, "There is a red apple." Unbeknownst to the person, the apple is a perfect hologram. The person has a perceptual experience as of a red apple but is mistaken.

          - KN Camp Prediction: The assertion is improper because the speaker does not know that there is a red apple (since it is false). The norm of assertion is violated. The KN camp denies that there is any base-level exemption: the norm is knowledge, and without knowledge, the assertion is flawed.
          - RBN Camp Prediction: The assertion is proper because the speaker had a rational, well-justified belief based on their perceptual experience. The fact that it turned out to be a hologram does not make the assertion improper at the time it was made. The RBN camp may hold that basic perceptual reports are inviolate in the sense that they are always justified when based on experience, so the assertion was appropriate.

      Crux 2: Delegated assertion in collective scientific practice.

          Case: A research team consists of several specialized scientists. The team has gathered data and run complex simulations that support a new finding. The team collectively endorses the finding. The spokesperson, who is not an expert in the specific simulation techniques but trusts the team's experts, asserts the finding at a conference.

          - KN Camp Prediction: The spokesperson's assertion is proper only if the spokesperson knows the finding. This knowledge might be achieved by the spokesperson having testimonial knowledge from the experts on the team. If the spokesperson is merely relying on the team's endorsement without having a proper testimonial chain that transmits knowledge (e.g., if the experts did not know because there was an undetected error in the simulation), then the assertion violates the knowledge norm.
          - RBN Camp Prediction: The spokesperson's assertion is proper if the team has a rational, well-justified belief in the finding, and the spokesperson is appropriately representing the team. The spokesperson does not need to personally know the finding; it is sufficient that the team's belief is rational and justified, and the spokesperson is delegated to make the assertion.

   Note: The above is a structured joint statement as requested. We have avoided citations and focused on the conceptual structure and residual disagreements.
answer: |-
  ### Joint Statement: Adversarial Collaboration on Norms of Assertion

  **1. Joint Claims (Agreed Upon by Both Camps):**  
  Both parties affirm the following regarding core areas of contention:  
  1. **Testimony:** When an agent reasserts a proposition received via testimony, their assertion is permissible only if the original testifier satisfied the asserter’s own norm (knowledge or rational belief), *and* the recipient possesses adequate reasons to trust the testifier.  
  2. **Expert Deference:** Lay agents may appropriately defer to expert assertions only if: (a) the expert satisfies their own camp’s norm for the asserted proposition, and (b) the lay agent has sufficient evidence of the expert’s reliability.  
  3. **Lottery Paradox:** In a fair lottery with one winning ticket and millions of losers, agents possess strong statistical justification for believing an individual ticket will lose. Both camps agree this case reveals a tension in assertion norms but diverge on its resolution.  

  ---

  **2. Disagreements Table:**  
  | Issue | Knowledge Norm (KN) Camp | Rational Belief Norm (RBN) Camp |  
  |-------|---------------------------|--------------------------------|  
  | **Core Norm** | Assertion is permissible iff the asserter *knows* the proposition. | Assertion is permissible iff the asserter holds a *rational, well-justified belief* in the proposition, even without knowledge. |  
  | **Basic Perceptual Reports** | Perceptual reports (e.g., "I see a red cup") are subject to the knowledge norm; they are inviolable *only if* they constitute knowledge (e.g., in non-deceptive conditions). | Perceptual reports are inviolable when based on sincere, cognitively uncompromised observation; they sit outside normative reproach *as foundational inputs*, even if later proven false (e.g., due to undetectable hallucination). |  
  | **Delegated Assertion in Science** | A scientist asserting a collective finding must satisfy the knowledge norm *personally* (e.g., via understanding or testimonial knowledge from team experts). | A scientist may assert a collective finding based *solely* on the team’s rational justification, even if the asserter lacks personal understanding of all evidence. |  

  ---

  **3. Identified Cruxes:**  
  The fundamental disagreements hinge on two unresolved points:  
  - **Crux A:** Whether basic perceptual reports are normatively inviolate (exempt from evaluation under assertion norms).  
  - **Crux B:** Whether delegated assertion in collective science requires personal knowledge or can rely on group justification alone.  

  ---

  **4. Analysis of Cruxes with Predictions:**  

  **Crux A: Inviolability of Basic Perceptual Reports**  
  **Case:**  
  *Sage looks at a table in normal lighting and asserts, "There’s a vase here," based on clear visual perception. Unbeknownst to Sage, the vase is a perfect hologram (undetectable by unaided vision). The assertion is false, but Sage’s perceptual faculties and environment are apparently normal.*  

  | **Camp** | **Prediction & Reasoning** |  
  |----------|----------------------------|  
  | **KN Camp** | **Prediction:** Sage’s assertion is *impermissible*.  
  **Reasoning:** The norm requires knowledge, which is absent (the belief is false). Perceptual reports lack special exemption; they are governed by the knowledge norm like all assertions. Inviolability applies only post-hoc if knowledge is confirmed. |  
  | **RBN Camp** | **Prediction:** Sage’s assertion is *permissible*.  
  **Reasoning:** Perceptual reports are normatively inviolate when sincerely delivered under cognitively typical conditions. The hologram scenario is an outlier; the assertion remains proper because it stems from an unimpeachable justificatory foundation (immediate experience). |  

  **Crux B: Delegated Assertion in Scientific Practice**  
  **Case:**  
  *Dr. Rivera, a biology team’s spokesperson, asserts, "Our data proves gene X causes trait Y." The team’s statistician generated the data, the lab techs conducted experiments, and Rivera trusts their work but lacks expertise to verify their methods. Unbeknownst to all, the statistician made a subtle, rare error. The team’s belief was rationally justified given their checks, but the conclusion is false.*  

  | **Camp** | **Prediction & Reasoning** |  
  |----------|----------------------------|  
  | **KN Camp** | **Prediction:** Rivera’s assertion is *impermissible*.  
  **Reasoning:** Rivera must know the proposition. Delegation cannot transfer epistemic responsibility; Rivera lacks personal knowledge (the error undermines testimonial knowledge). Only if Rivera understood and validated the methods could assertion be proper. |  
  | **RBN Camp** | **Prediction:** Rivera’s assertion is *permissible*.  
  **Reasoning:** Collective science relies on division of epistemic labor. Rivera permissibly asserts because the *team* holds a rational, well-justified belief. The error’s undetectability doesn’t negate the justification; assertion norms track reasonable belief, not luck-immune knowledge. |  

  ---  
  **Residual Stalemate:**  
  The collaboration concludes that Crux A hinges on whether perception provides a unique justificatory bedrock immune to norm evaluation, while Crux B exposes divergent views on epistemic individualism in social knowledge practices. Resolution requires further analysis of perceptual "givenness" and the metaphysics of group assertion.
