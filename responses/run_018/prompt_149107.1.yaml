prompt: |-
  I just finished a long and rather heated argument with a friend about whether biography can teach morality or whether it always collapses into either worship or gossip. Rather than picking a side, I want to settle the matter by building something reusable: I am a secondary-school ethics curriculum designer, and every semester I must decide which lives our students read and how we frame them, knowing that students will imitate what they see whether I intend it or not. I need an operational decision procedure—a checklist in strict order, with stopping conditions and explicit judgment-flag points—to determine whether a given biography is pedagogically usable for moral formation, not merely historically informative.

  The principle I want translated draws on Plutarch’s practice of pairing lives to reveal character through comparable moral trials, but corrects it with an awareness of how hagiography and cynical debunking both destroy what makes a life instructive. I will call the core idea moral contingency: a biography teaches virtue only when it preserves moments where the subject’s character was genuinely open, where virtue and vice competed within the same person, and where the outcome was not predetermined by nature, narrative design, or retrospective justification. Hagiography destroys contingency by smoothing friction points into an inevitable arc of grace; cynical debunking destroys it by reducing every apparent virtue to hidden self-interest. The usable biography keeps the friction visible and allows the reader to inhabit the choice rather than admire or condemn from a distance.

  Please act as an expert in moral philosophy, the philosophy of biography, and curriculum design. Before constructing the tool, spend a few minutes brainstorming the conceptual translations required to turn this principle into a practitioner-level instrument without losing its philosophical content—specifically, which distinctions must survive simplification and which can be dropped, and where the procedure will necessarily misfire.

  Then deliver the procedure. It must be runnable by a non-specialist teacher in about thirty minutes per text. Structure it as ordered questions with: (a) what counts as a sufficient answer to continue, (b) what triggers an immediate “no,” and (c) explicit flags where the decision is a value judgment rather than a fact. Include small structural tests (sentence-level or narrative-arc checks) that reveal hagiographic smoothing and cynical reduction without requiring psychological expertise. State clearly what the procedure cannot do—what moral learning it excludes, where it will misfire, and which judgments remain with the practitioner.

  Apply the procedure to three cases:

  1. A widely assigned classroom biography of a celebrated twentieth-century scientist that frames her perseverance as innate, glosses over her documented collaboration with wartime military medicine, and treats a well-known extramarital relationship as purely private and therefore morally irrelevant to her exemplarity.
  2. A recent polemical biography of a beloved humanitarian that explains every charitable act as strategic reputation management and every moral risk as calculated self-interest, leaving no structural space for genuine virtue.
  3. A biography structured as an explicit parallel comparison—one political figure on the left and one on the right facing the same institutional crisis—in which both subjects make genuinely open choices, fail visibly, and are not redeemed by narrative closure.

  For case 1, the procedure should deliver the answer that is philosophically correct but that I, the asker, will likely dislike, because I have taught with that biography for years and find it inspiring. Be explicit about that tension.

  Finally, note what the procedure cannot settle—such as whether moral contingency is sufficient for pedagogical use, or whether some lives are too damaging to present regardless of narrative structure.

  End with a single line beginning “Verdict:” summarizing whether the procedure succeeds in preserving the philosophical core without collapsing into mere taste.

  Please think carefully step by step, and present the final procedure in a clear ordered format with the worked cases integrated.
reasoning: |-
  Hmm, the user is an ethics curriculum designer who just had an argument about whether biographies can teach morality. They want a practical decision procedure to evaluate biographies for moral education, avoiding both hagiography and cynical debunking. The core idea is "moral contingency"—moments where the subject's character was genuinely open, with virtue and vice in tension.

  First, I need to translate "moral contingency" into a usable checklist. Key distinctions to preserve:  
  - Genuine openness in decision points (not predetermined)  
  - Visible friction between virtue/vice within the same person  
  - Avoidance of narrative smoothing or reductive explanations  

  Simplifications:  
  - Can drop philosophical debates about virtue ethics vs. utilitarianism  
  - Can treat "vice" broadly as moral failure without categorizing types  
  - Assume "pedagogically usable" means fostering moral reflection, not prescribing conclusions  

  Potential misfires:  
  - Biographies of victims (contingency may be externally imposed)  
  - Lives with sparse historical records (contingency harder to verify)  
  - Cultures with different concepts of selfhood (Western individualism bias)  

  Now building the procedure. Must be:  
  - Runnable in 30 mins by non-specialists  
  - Ordered questions with clear pass/fail thresholds  
  - Flags for value judgments  
  - Structural tests (e.g., sentence analysis for "inevitability" language)  

  Critical elements:  
  1. **Identify decision points** - Scatterplot test for clustering  
  2. **Assess narrative framing** - "Had to" vs. "chose to" language checks  
  3. **Test for reductive explanations** - Uniform motive attribution  

  Stopping conditions:  
  - Immediate "no" for no open decisions OR universal vice reduction  
  - Judgment flags when assessing "genuineness" of contingency  

  Limitations:  
  - Cannot evaluate subject's inherent moral worth  
  - Cannot settle if contingency is sufficient (e.g., overwhelming evil acts)  
  - Misfires on fragmented or highly speculative biographies  

  Cases:  
  1. **Scientist biography** (likely fail): Smoothes collaboration/affair; perseverance framed as innate. Verdict: unusable despite inspirational value.  
  2. **Polemic** (immediate fail): Reduces all virtue to calculation.  
  3. **Paired politicians** (pass): Shows open choices and unredeemed failures.  

  Tension in Case 1: User's emotional attachment vs. procedural outcome. Must emphasize that inspiration ≠ moral pedagogy.  

  Final verdict: The procedure preserves Plutarch’s insight while mitigating modern biases, though practitioners must still exercise judgment on what constitutes "damaging" content beyond structural analysis.
answer: |-
  Below is a complete operational decision procedure for evaluating biographies for moral formation in secondary ethics curricula, based on your principle of **moral contingency**. It distills Plutarch’s comparative approach while guarding against hagiography (smoothing friction) and cynical debunking (reducing virtue to self-interest). The procedure prioritizes *structural* analysis—focused on narrative framing, language, and decision-point representation—to ensure usability by non-specialists.  

  ### **Conceptual Translation Notes**  
  **Core distinctions preserved**:  
  1. **Genuine openness**: Moments where the subject’s choice was not predetermined by narrative, biology, or hindsight.  
  2. **Internal friction**: Virtue/vice must coexist *within the same decision*, not be segregated (e.g., "early flaws" later "overcome").  
  3. **Irreducible motives**: The text cannot uniformly attribute behavior *either* to innate virtue *or* hidden vice.  
  **Simplifications**:  
  - Drops abstract debates about "virtue ethics" (focuses on observable narrative mechanics).  
  - Treats "vice" as any consistent pattern of moral failure (no taxonomy required).  
  - Omits historical accuracy checks (assumes baseline factuality; procedure targets *framing*).  
  **Inherent misfires**:  
  - Lives with extreme power imbalances (e.g., victims of oppression; contingency may be external).  
  - Subjects with limited primary sources (forces reliance on author’s interpretation).  
  - Cultures with non-individualist concepts of self (contingency may appear diminished).  

  ---

  ### **Procedure: Moral Contingency Checklist**  
  **Time**: 25–30 min per text. **Tools**: Biography text, highlighter, notebook.  
  **Output**: **Usable** (proceed to curriculum design), **Unusable** (reject), or **Judgment Required** (discuss with team).  
  **Order**: Follow steps sequentially. Stop if any "Immediate No" is triggered.  

  1. **Identify 3+ Non-Trivial Decision Points**  
     - *Task*: Scan for moments with high stakes, conflicting values, and alternative paths (e.g., career choices, moral compromises, public/private conflicts).  
     - *Structural test*: Highlight verbs describing actions. If >70% are passive ("was forced"), inevitability-focused ("had to"), or deterministic ("destined to"), flag.  
     - **Sufficient to continue**: At least 3 decisions with active verbs (e.g., "chose," "gambled," "resisted").  
     - **Immediate No**: No decisions meeting criteria OR all decisions lack alternatives (e.g., "only moral path").  
     - **Judgment Flag**: Are the decisions *genuinely open* or contrived? (Assess if alternatives are plausible per context.)  

  2. **Test for Internal Friction in Decisions**  
     - *Task*: Pick 2 identified decisions. Check if the text shows the subject’s *internal struggle* (not just external obstacles).  
     - *Structural test*:  
       - **Hagiography check**: Do sentences explain away friction? (e.g., "deep down, she always knew X," "his nature compelled him").  
       - **Cynicism check**: Are struggles reduced to a single motive? (e.g., "only for fame," "fear of exposure").  
     - **Sufficient to continue**: Both decisions include:  
       - (a) A vice/virtue tension (e.g., ambition vs. honesty).  
       - (b) Language of uncertainty ("agonized," "weighed," "risk").  
     - **Immediate No**: All decisions lack tension OR vice/virtue are segregated ("early selfishness" vs. "later sainthood").  
     - **Judgment Flag**: Is friction *authentic* or overdramatized? (Requires assessing cultural/historical context.)  

  3. **Assess Motive Attribution Balance**  
     - *Task*: Analyze explanations for 1 virtuous and 1 flawed action from Step 2.  
     - *Structural test*:  
       - **Hagiography**: Count "innate trait" claims (e.g., "her innate kindness," "born brilliant").  
       - **Cynicism**: Count "hidden agenda" claims (e.g., "true motive was," "secretly desired").  
     - **Sufficient to continue**: Mixed attribution (e.g., "partly from duty, partly from fear") AND no pattern (>80% innate or hidden motives).  
     - **Immediate No**: >90% motives are innate (hagiography) OR hidden (cynicism).  
     - **Judgment Flag**: Are mixed motives *plausible*? (Avoids false equivalence in egregious cases.)  

  4. **Evaluate Narrative Closure**  
     - *Task*: Read the final chapter. Does resolution acknowledge unresolved tension?  
     - *Structural test*: Track redemption/condemnation language. Highlight conclusive phrases ("proved," "redeemed," "exposed as").  
     - **Sufficient to continue**: Open-ended or ambiguous closure (e.g., "left a complex legacy," "choices still debated").  
     - **Immediate No**: Total redemption ("flaws forgiven") or condemnation ("always corrupt").  
     - **Judgment Flag**: Does closure erase contingency? (e.g., deathbed conversions that "resolve" all friction.)  

  **Final Determination**:  
  - **Usable**: Passes all 4 steps.  
  - **Unusable**: Fails any "Immediate No."  
  - **Judgment Required**: >1 "Judgment Flag" with no consensus.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Excluded moral learning**: Does not assess if a life is *worth emulating*—only if it *teaches how choices work*. Heroic/villainous lives may pass if friction is preserved.  
  2. **Misfires**:  
     - Fragmented biographies (e.g., diaries stitched into narrative).  
     - Subjects with severe cognitive impairments (distorts "openness").  
     - Highly stylized narratives (e.g., poetic metaphors obscuring decisions).  
  3. **Practitioner judgments still required**:  
     - Whether moral contingency is *sufficient* (e.g., a life with minor thefts vs. genocide).  
     - Age-appropriateness of content (e.g., explicit trauma).  
     - Cultural representation gaps (e.g., non-Western subjects forced into individualist framing).  

  ---

  ### **Worked Cases**  
  **Case 1: Celebrated Scientist Biography**  
  - **Step 1**: Pass. Identifies perseverance decisions (e.g., lab setbacks).  
  - **Step 2**: Fail (Hagiography). Collaboration/affair framed as "inevitable sacrifices" or "private matters"—no friction or virtue/vice tension.  
  - **Step 3**: Fail (Immediate No). Perseverance is "innate grit" (90% innate attribution); collaboration not morally examined.  
  - **Verdict**: **Unusable**. Glossing over collaboration/affair removes contingency.  
  - **Tension note**: You find it "inspiring" because it smooths friction—*exactly* what the procedure flags. Inspiration ≠ moral pedagogy here.  

  **Case 2: Polemical Humanitarian Biography**  
  - **Step 1**: Pass. Identifies charity decisions.  
  - **Step 2**: Fail (Cynicism). All actions reduced to "reputation management"; no language of moral risk.  
  - **Step 3**: Fail (Immediate No). 100% hidden motives ("calculated self-interest").  
  - **Verdict**: **Unusable**. Eradicates virtue, leaving no space for contingency.  

  **Case 3: Paired Political Figures**  
  - **Step 1**: Pass. Clear comparable crisis decisions (e.g., compromise vs. confrontation).  
  - **Step 2**: Pass. Shows internal friction (e.g., "torn between party loyalty and public good").  
  - **Step 3**: Pass. Motives mixed (e.g., "ambition and principle," "fear and conviction").  
  - **Step 4**: Pass. No redemption: "both legacies remain contested."  
  - **Verdict**: **Usable**. Contingency preserved; reader inhabits choices without resolution.  

  ---

  **Verdict:** The procedure succeeds in preserving moral contingency as the active core of Plutarchian moral formation, converting philosophical nuance into actionable pedagogy while resisting collapse into subjective taste.
