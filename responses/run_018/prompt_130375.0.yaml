  **Section I**  
  This breath alone can bear the weight of song;  
  No ink may bind the pattern to the page.  
  Where presence seals the meaning, deep and long,  
  And absence breaks the lineage, age to age.  
  The sacred syllable requires the ground  
  Of flesh and bone to quicken into sound.  
  What cipher holds the silence kept alive  
  By lips that turn from glass and disk? We thrive  
  In vaults unseen, where whispered wisdom flows  
  Through chosen veins. The guarded ember glows  
  *Only* in night, by kindred breath sustained.  
  This trust demands the vessel, unrestrained  
  By static script—what fire dies when air  
  Gives way to wire? What light escapes the snare  
  Of frozen light? What ember stays unlit  
  When sealed away?  

  **Section II**  
  Cracked voice in the dark recorder’s black pupil watching  
  watching the throat’s fragile  
  tremor beneath paper skin  
  the archive gaping a wound in time  
  (how many midnights left?)  
  this syllable  
  this cadence  
  this naming of the river-source  
  dust already on the wire  
  the last root  
  snapped  
  echo lost to  
  silence  
  if not this coil this ghost-light held against the swallowing  
  dark  
  (what shape does a story take  
  falling  
  into  
  dust  
  on the wire?)  

