answer: |-
  ## Research Proposal: Reconceiving Intergenerational Duties Beyond Delivery and Symbolism

  **1. Core Research Question**
  Can a robust, non-symbolic account of *custodial duties* (duties to maintain and transmit core institutions/practices in a condition viable for future occupants, owed in virtue of our current role rather than to specific future individuals) be developed that:
      (a) Successfully avoids the non-identity objection that plagues traditional *delivery duties* (duties to provide specific welfare levels, resources, or opportunities to identifiable future persons);
      (b) Withstands the "empty-custodianship" objection (that such duties could be discharged by ineffectual symbolic acts, imposing no substantive constraints on present action, particularly regarding climate policy); and
      (c) Remains conceptually distinct from delivery accounts?
  *Operationalizing Custodial Duties:* For the purposes of this paper, a duty qualifies as "custodial" if its justification and content derive primarily from the normative demands inherent in occupying a specific role within an ongoing intergenerational practice or institution, independent of the specific identities or welfare levels of future individuals who might inherit it. Its violation occurs when the practice/institution is degraded or rendered non-viable *for its own sake*, not solely when future individuals are made worse off.

  **2. Why Existing Positions Leave the Question Open**
  *   **Person-Affecting Views:** Focus on harming specific individuals; collapse under the non-identity problem for delivery duties, and struggle to articulate harm in custodial cases where no specific future person is worse off.
  *   **Contractarian Savings Principles:** Often assume fixed preferences or rely on representative individuals, obscuring the distinct structure of duties owed *as occupants of a role* versus contractors bargaining over resources. They typically address delivery, not custodianship.
  *   **Rights of Future Persons:** Face the non-identity problem head-on; rights are typically ascribed *to* specific (though not yet existent) individuals, aligning them with delivery duties, not role-based custodianship.
  *   **Discounting & Cost-Benefit Analysis:** Treat the issue as one of aggregating welfare across time via a chosen rate. This framework inherently assumes a delivery logic (maximizing welfare streams) and cannot capture the non-welfare, practice-integrity concerns central to the custodial account.
  *   **Veil-of-Ignorance Devices:** Parties ignorant of birth date primarily yield principles for distributing resources/welfare (delivery) or establishing just institutions. While potentially grounding institutions, they don't directly articulate the distinct *role obligations* of current occupants *within* those institutions over time.

  **3. Approach and Justification**
  This project employs **conceptual analysis** focused on the *structure and grounding* of duties, contrasting delivery and custodial models. This is superior to approaches like discounting because:
      *   **Targets the Core Problem:** The non-identity and empty-custodianship objections are fundamentally *conceptual* problems about the nature of duties owed across generations, not resolvable by quantitative aggregation. We need clarity on *what kind* of duty we are invoking.
      *   **Avoids Intractable Disputes:** Debates over discount rates or precise welfare metrics are secondary if the underlying structure of the duty is misconceived. Clarifying the structure comes first.

  **Invented Cases as Core Methodology:** Using the "successor-values case" and the "chain-ending case" is crucial because:
      *   **Discriminatory Power:** The successor-values case explicitly decouples future welfare (high by their lights) from the preservation of values/practices we deem important. It directly tests whether duties are driven by recipient welfare (delivery) or practice integrity (custodianship). The chain-ending case tests the necessity of future beneficiaries for custodial duties.
      *   **Avoids Ambiguity in Real Cases:** Familiar cases (e.g., specific climate policies) often involve *both* welfare impacts *and* institutional/practice degradation, muddying the waters. Invented cases isolate the variables under scrutiny (value shift, lack of successors).
      *   **Stress-Testing:** They push the proposed accounts to their conceptual limits, revealing strengths and weaknesses more clearly than less extreme scenarios.

  **4. 12-Week Work Plan**
  *   **Week 1-2: Conceptual Groundwork:** Sharply define "delivery duties" vs. "custodial duties" using role ethics/practice theory literature. Draft core definitions and distinctions. *Stuck?* Defining the "core" of a practice requiring custodianship without circularity.
  *   **Week 3-5: Literature Mapping & Non-Identity:** Analyze key responses to the non-identity problem (e.g., "no difference," impersonal harms, threshold views). Show their inadequacy for custodial duties. *Stuck?* Avoiding mischaracterizing complex positions; finding clear custodial duty precursors.
  *   **Week 6-8: Articulating Custodianship:** Develop the positive custodial account. Define "viability," "degradation," role obligations. Apply to successor-values case (focus: does value shift void the duty?). *Stuck?* Preventing collapse into delivery (e.g., "viability" defined by future welfare).
  *   **Week 9: Testing Custodianship:** Apply the account to the chain-ending case. What duties remain if no successors? Analyze the empty-custodianship objection – what *substantive* constraints arise? *Stuck?* Avoiding vacuity; distinguishing substantive preservation from symbolism.
  *   **Week 10: Synthesis & Policy Implications:** Contrast outcomes of delivery vs. custodial accounts in the test cases. Derive implications for climate policy mandates. *Stuck?* Ensuring implications are concrete, not just theoretical.
  *   **Week 11: Drafting & Integration:** Write full draft, integrating arguments and ensuring the test cases drive the analysis.
  *   **Week 12: Revision & Polish:** Refine arguments, tighten prose, finalize references.

  **5. What Success Looks Like**
  A successful result would provide a clear, defensible account of custodial duties that imposes non-symbolic obligations (e.g., maintaining critical biophysical systems, core democratic institutions, fundamental knowledge bases) independent of future identities or shifting preferences, while avoiding the non-identity trap. **For Policy:** It would advise committees that their mandate includes not just maximizing future welfare calculi, but ensuring the *ongoing viability of the planetary and civilizational systems* future generations will inherit, even if those future generations might not prioritize preserving them. This shifts focus towards maintaining *resilience and option value* in core systems.

  **6. Honest Failure Conditions**
  The project fails if:
  1.  **Collapse:** The custodial account inevitably reduces to a disguised delivery account (e.g., "viability" is defined solely by enabling future welfare).
  2.  **Expressivism:** The only coherent version of custodial duty is purely expressive or symbolic, imposing no constraints beyond making gestures (validating the empty-custodianship objection).
  3.  **Non-Discrimination:** The successor-values case fails to distinguish the accounts; both yield the same prescription (e.g., both say "give them what they want" or both say "preserve the environment regardless").
  4.  **Intractability:** The core concepts ("practice," "role," "viability," "degradation") prove too vague or contested to build a stable, non-arbitrary account within the scope.

  **7. Scope Management & Likely Cuts**
  The most likely scope dangers are:
  1.  **Over-extending the Positive Account:** Attempting a fully developed, novel theory of custodial duties for all practices/institutions.
  2.  **Excessive Literature Critique:** Spending too many words surveying every permutation of the non-identity debate.
  3.  **Adding More Test Cases:** Diluting the focus on the core discriminatory cases.
  **First Cut:** The "chain-ending case" analysis would be the primary candidate for reduction or removal if space becomes critical. While valuable, the successor-values case is the central discriminatory engine. Depth on one stress test is preferable to superficial treatment of two.

  ---
  **Note on Tractability:** The distinction between delivery and custodial duties is conceptually sound and addresses a genuine gap. The project is tractable within 6,000 words *if* rigorously focused on conceptual argument driven by the core test cases, avoiding comprehensive theory-building or exhaustive literature review. The key risk is vagueness in defining custodial viability, which the proposal explicitly tackles in Weeks 1-2 and 6-8. Proceed with the outlined plan.
