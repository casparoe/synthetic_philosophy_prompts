  ## MAROT PROTOCOL OFFICE: FREQUENTLY ASKED QUESTIONS (REV. 23.7.1)

  **Office Mandate:** Certification of Literary Translation Practitioners adhering to the Doctrine of *Le Ton beau* (LTB), ensuring maximal preservation of the Source Text's (ST) formal skin across linguistic boundaries.

  **Q1: What constitutes the "formal skin" under LTB doctrine?**
  A1: The formal skin is defined as the quantifiable exterior architecture of the poem, separable from semantic content. Mandatory preservation targets include:
  *   Rhyme scheme (exact, slant, or as per ST classification)
  *   Meter (scansion pattern replicated using target language (TL) prosodic equivalents)
  *   Vowel Color (dominant spectral quality per line/section, calibrated to ST vowel inventory)
  *   Emotional Temperature (affective resonance baseline, measured in standard kelvins (K) derived from ST vowel/consonant friction coefficients)
  *   *Ton beau* (The holistic sonic signature; a composite score derived from the Ton-Beau Coefficient, see Q7)

  **Q2: How do I handle ST slant rhymes where the TL lacks comparable phonetic approximations?**
  A2: Utilize Protocol Annex 4-C: *Phonetic Approximation Thresholds*. Identify the closest TL consonant/vowel pairing within the stipulated "Phonemic Resonance Window" (PRW). The PRW is calculated based on the ST consonants' voicing, place, and manner, plus vowel formants. If no pairing falls within the PRW (tolerance ±0.15 Resonance Units), petition the Office for a Formal Equivalence Override (FEO-7). FEO-7 requires demonstration that *all other* formal skin elements are preserved at ≥ 95% fidelity and submission of a Phonetic Gap Impact Assessment (PGIA-2).

  **Q3: May I substitute a culturally specific reference in the TL if the original syllable count and Prosodic Fidelity Index (PFI) are maintained?**
  A3: Yes, under Directive 9-F: *Cultural Referent Substitution for Prosodic Continuity*. The substitution must:
  1.  Occupy the precise metrical position and syllable count of the ST referent.
  2.  Maintain the PFI (calculated via stress pattern alignment and rhythmic contour similarity) within ±0.05 of the ST value for the line.
  3.  Undergo Semantic Consonant Density Ratio (SCDR) verification. The SCDR compares the ratio of "hard" (plosive, fricative) to "soft" (liquid, nasal, glide) consonants in the substituted phrase against the ST phrase. Deviation >10% requires justification via Form M-12 *Referential Prosody Equivalence Claim*.

  **Q4: How are disputes between certified reviewers regarding "Vowel-Temperature Parity" adjudicated?**
  A4: Vowel-Temperature Parity (VTP) disputes follow Procedure 15-H: *Thermo-Auditory Calibration and Reconciliation*. The contested passage undergoes analysis in the Office's Calibrated Thermo-Auditory Chamber (CTAC). The CTAC measures:
  *   **Spectral Dominance:** Peak vowel formant frequencies averaged across speakers adhering to TL Received Pronunciation standards.
  *   **Frictional Heat:** Calculated thermal output (millikelvins) derived from consonant-vowel transitions and sibilance duration.
  Reviewers' assessments are compared against CTAC outputs. Discrepancies exceeding ±5K or ±5% spectral dominance trigger mandatory re-calibration of reviewer certification modules and re-submission of the contested assessment. The CTAC reading is final.

  **Q5: What is the Ton-Beau Coefficient (TBC) and how is it calculated?**
  A5: The Ton-Beau Coefficient (TBC) is the primary quantifiable metric for *ton beau* preservation. It is a normalized value (0.00 - 1.00) derived from the weighted harmonic mean of the following sub-metrics:
  *   `Rhyme Fidelity Score (RFS)`
  *   `Meter Alignment Index (MAI)`
  *   `Vowel Color Consistency (VCC)`
  *   `Emotional Temperature Stability (ETS)`
  *   `Prosodic Fidelity Index (PFI)`
  *   `Semantic Consonant Density Ratio Match (SCDR-M)`
  The specific weights are proprietary to the Office's Harmonization Algorithm (v.8.3). Certification requires a minimum TBC of 0.87 for the work as a whole, with no individual section scoring below 0.82. The TBC objectively captures the integrity of the formal skin's transfer.

  **Q6: Isn't some interpretive residue inevitable? How does the Protocol account for this?**
  A6: The Marot Protocol acknowledges the theoretical potential for minor residual semantic or connotative artifacts. However, the Doctrine of *Le Ton beau* asserts the primacy and separability of form. Residual elements are considered extraneous to the formal skin's integrity, provided they do not demonstrably alter the quantifiable metrics outlined in A1 and A5. Translators must utilize Form D-5 *Residual Impact Mitigation Report* if any suspected residue impacts a measurable parameter (e.g., altering vowel duration enough to affect meter). The Office's focus remains on structural replication, not hermeneutic fidelity.

  **Q7: Where can I find the complete Technical Specifications for Measurement?**
  A7: The *Marot Protocol Technical Appendices Volumes I-VII (Rev. 23.7)*, including all referenced Annexes, Directives, Procedures, and Forms, are available for licensed practitioners via the Secure Certification Portal upon annual fee payment. Physical copies require a Class-3 Document Request (CDR-11) and incur handling fees. Measurement tools (e.g., standardized kelvin thermocouples for ETS, formant analyzers for VCC) must meet Office calibration standards; see Supplier List S-4A.

  **Disclaimer:** The Marot Protocol Office certifies adherence to procedural methodology and quantifiable metric thresholds only. Attainment of a perfect TBC (1.00) is statistically improbable due to inherent linguistic asymmetries. Certification indicates rigorous application of the Protocol, not the unqualified achievement of an unattainable aesthetic ideal. Appeals regarding certification decisions must follow Procedure 22-K.
