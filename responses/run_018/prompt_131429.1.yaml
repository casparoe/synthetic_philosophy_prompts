prompt: |-
  I am a professor of applied philosophy who chairs the clinical ethics committee at a university teaching hospital. We are now adjudicating harm arising from semi-autonomous clinical decision-support systems — algorithmic recommenders whose outputs physicians may adopt, adapt, or reject, but which are not themselves fully autonomous moral agents. Conventional liability structures fail in the interstices between developer, institution, and clinician, so I wish to operationalise the philosophical literature on responsibility gaps into a reusable audit procedure that committee members — who have no philosophical training and no access to external literature — can run in under forty-five minutes per case.

  Please construct, in British English, a flowchart in prose: an ordered sequence of diagnostic questions that translate the conceptual distinctions between causal contribution, normative competence, and institutional authorisation into practical tests. For each question, specify what counts as a sufficient answer and identify the precise stop-point where the procedure either assigns primary responsibility definitively or declares an irreducible gap requiring collective institutional judgement rather than individual attribution. You must also flag the collapse conditions — those cases in which the system made the decision and the clinician endorsed the decision are not separable — since these are precisely the hard cases we face.

  Include three worked applications: first, a case in which a clinician overrode a sound recommendation and harm followed; second, a case in which a clinician blindly adopted a flawed recommendation; and third, a case in which the system's reasoning was opaque even to its developers, leaving no meaningful override point for the clinician. Be explicit about where the procedure will misfire, where value judgements cannot be proceduralised, and what must be settled by human deliberation. Do not provide bibliographies, reading lists, or citations; the procedure must stand alone.
reasoning: |-
  We are constructing a flowchart in prose for a clinical ethics committee to assign responsibility in cases involving semi-autonomous clinical decision-support systems (CDSS). The goal is to have a procedure that can be completed in under 45 minutes by committee members without philosophical training or access to external literature.

  The key concepts to operationalize are:
  1. **Causal Contribution**: Who or what caused the harm? (This includes both the CDSS and the clinician.)
  2. **Normative Competence**: Did the relevant agent (clinician or developer) have the capacity and opportunity to make a normatively appropriate decision? This includes factors like understanding, reasoning, and the ability to act otherwise.
  3. **Institutional Authorisation**: Who was institutionally empowered to make the final decision? This also includes the institutional structures that may have enabled or failed to prevent the harm.

  We must also note **collapse conditions** where the clinician's decision and the system's recommendation are not separable (i.e., the clinician's endorsement is so intertwined with the system's output that they cannot be treated as distinct).

  The flowchart will consist of a sequence of questions. At each step, we will either assign responsibility or move to the next question until we either assign responsibility or declare an irreducible gap (which then requires collective institutional judgment).

  ### Flowchart in Prose (Ordered Sequence of Diagnostic Questions)

  **Step 1: Identify the Harm and the Decision Point**
     - **Question**: What was the specific harm that occurred, and at what point in the clinical decision-making process did it originate? (Focus on the decision that directly led to the harm.)
     - **Sufficient Answer**: A clear description of the harm (e.g., patient injury, death) and the specific decision (e.g., choice of medication, diagnostic test) that caused it.
     - **Note**: This step sets the stage. It does not assign responsibility but ensures the committee is focused on the same event.

  **Step 2: Determine the Separability of the Clinician's Endorsement from the System's Recommendation**
     - **Question**: Was the clinician's decision to adopt, adapt, or reject the CDSS recommendation a separable act of judgment? (That is, could the clinician have independently arrived at a different decision without the CDSS output being the primary basis?)
     - **Sufficient Answer for Separability**:
          - **Yes**: The clinician had access to independent information and the cognitive capacity to evaluate the recommendation, and the system's output was not presented in a way that precluded independent judgment (e.g., the clinician was not under time pressure that forced reliance, the interface allowed for easy override, and the clinician had the necessary expertise).
          - **No (Collapse Condition)**: The clinician's decision was not separable because either (a) the system's output was presented as overwhelmingly authoritative (e.g., "must-do" alerts), (b) the clinician lacked the time, information, or expertise to evaluate it, or (c) the system's design made override practically impossible (e.g., no clear override option, or override required steps beyond reasonable effort).
     - **Stop-Point**: If the answer is **No** (collapse condition), then we cannot separate the clinician's role from the system's. This leads to an **irreducible gap**, and the case must be escalated for collective institutional judgment (including potential responsibility of the institution and/or the developer). **Stop here.**
     - **Next Step**: If **Yes** (separable), proceed to Step 3.

  **Step 3: Assess the Clinician's Normative Competence in the Decision**
     - **Question**: Did the clinician exercise appropriate normative competence in their decision to adopt, adapt, or reject the CDSS recommendation? (This includes both the capacity to reason about the decision and the actual exercise of that capacity.)
     - **Sufficient Answer**:
          - **Competence Demonstrated**: The clinician (a) had the requisite knowledge and training, (b) actively considered the CDSS output in light of patient-specific factors, (c) made a reasonable effort to gather necessary information, and (d) documented their reasoning (or there is evidence of such reasoning).
          - **Lack of Competence**: The clinician failed in one or more of the above (e.g., blindly followed the CDSS without review, ignored relevant patient information, or overrode without justification when the CDSS was sound).
     - **Stop-Point**: 
          - If **Lack of Competence** is found, then **primary responsibility lies with the clinician**. (Note: This is because their separable act of judgment was flawed, and they had the institutional authorisation and causal contribution.) **Stop here.**
          - If **Competence Demonstrated**, proceed to Step 4.

  **Step 4: Assess the Soundness of the CDSS Recommendation**
     - **Question**: Was the CDSS recommendation, at the time it was made, sound? (That is, was it based on up-to-date, accurate, and appropriately applied medical knowledge and patient data?)
     - **Sufficient Answer**:
          - **Sound**: The recommendation was medically appropriate given the patient's data and current standards of care. Any error was not foreseeable at the time of the decision.
          - **Flawed**: The recommendation was incorrect due to (a) a bug in the algorithm, (b) outdated knowledge, (c) inappropriate application to the patient's context, or (d) reliance on flawed input data that should have been validated by the system or the institution.
     - **Stop-Point**:
          - If the recommendation was **Sound**, and the clinician **overrode** it (and harm resulted from that override), then the clinician had the causal contribution and normative competence but made the wrong choice. **Primary responsibility lies with the clinician**. (Because they overrode a sound recommendation.) **Stop here.**
          - If the recommendation was **Flawed** and the clinician **adopted** it, proceed to Step 5.

  **Step 5: Assess Developer/Institutional Responsibility for the Flawed Recommendation**
     - **Question**: Was the flaw in the CDSS recommendation foreseeable and preventable by the developer or the institution? (This includes whether the developer/institution had the normative competence to avoid the flaw and the institutional authorisation to maintain the system.)
     - **Sufficient Answer**:
          - **Foreseeable and Preventable**: The flaw arose from negligence in design, testing, data validation, or maintenance (e.g., known limitations not communicated, lack of routine updates, failure to test on diverse patient populations). The developer/institution had the means and authority to prevent the flaw.
          - **Not Foreseeable and Preventable**: The flaw was due to an unforeseeable edge case, a novel patient presentation, or a genuine error despite reasonable care in development and maintenance (e.g., state-of-the-art system with rigorous validation that could not have anticipated this specific scenario).
     - **Stop-Point**:
          - If **Foreseeable and Preventable**, then **primary responsibility lies with the developer and/or institution** (depending on the specific failure: developer for design flaws, institution for deployment without adequate validation or monitoring). **Stop here.**
          - If **Not Foreseeable and Preventable**, then we have an **irreducible gap** (because the clinician exercised due diligence in adopting a recommendation that seemed sound, and the developer/institution was not negligent). The case requires **collective institutional judgment** (e.g., no-fault compensation, system redesign). **Stop here.**

  ### Summary of Stop-Points and Irreducible Gaps
  - **Stop at Step 2 (Collapse Condition)**: Irreducible gap (collective institutional judgment).
  - **Stop at Step 3**: Clinician responsible (due to lack of normative competence).
  - **Stop at Step 4**: Clinician responsible (overrode sound recommendation and caused harm) OR proceed if flawed recommendation was adopted.
  - **Stop at Step 5**: Developer/institution responsible (if flaw was foreseeable) OR irreducible gap (if flaw was not foreseeable and clinician was competent).

  ### Worked Applications

  **Case 1: Clinician Overrode a Sound Recommendation and Harm Followed**
     - **Step 1**: Harm: Patient died from an allergic reaction. Decision: Clinician overrode CDSS alert to avoid penicillin (which the patient was allergic to) and prescribed penicillin.
     - **Step 2**: Separability: Yes, the clinician made an independent choice to override (the alert was clear and override required explicit action).
     - **Step 3**: Normative competence: Lack of competence. The clinician ignored a critical alert without justification (no documented reason, and patient's allergy was in the record). 
     - **Stop at Step 3**: **Clinician responsible**. (Even though Step 4 would have shown the recommendation was sound, we stop at Step 3 due to lack of competence.)

  **Case 2: Clinician Blindly Adopted a Flawed Recommendation**
     - **Step 1**: Harm: Patient had unnecessary surgery. Decision: Clinician accepted CDSS recommendation for surgery based on a misread of imaging (CDSS had a bug that misclassified benign as malignant).
     - **Step 2**: Separability: Yes, the clinician could have reviewed the images independently.
     - **Step 3**: Normative competence: Lack of competence. The clinician did not review the images and blindly followed the CDSS (despite being trained to do so). 
     - **Stop at Step 3**: **Clinician responsible**. (We don't reach Step 4 because the clinician's failure is clear. However, note that if the clinician had reviewed the images and still agreed (i.e., demonstrated competence) then we would proceed to Step 4 and find the recommendation flawed, then Step 5 to check if the flaw was foreseeable.)

  **Case 3: System's Reasoning was Opaque, Leaving No Meaningful Override Point**
     - **Step 1**: Harm: Patient received a harmful drug interaction. Decision: CDSS recommended two drugs that interact, and the clinician accepted the recommendation without override.
     - **Step 2**: Separability: **No** (Collapse condition). The CDSS used a "black-box" algorithm that even the developers could not explain. The clinician had no way to independently verify the recommendation (the system provided no explanation, and the clinician lacked the expertise to second-guess the complex algorithm). 
     - **Stop at Step 2**: **Irreducible gap**. The case requires collective institutional judgment (because the institution chose to deploy an opaque system without adequate safeguards, and the clinician could not meaningfully override).

  ### Where the Procedure May Misfire and Require Human Deliberation
  1. **Step 2 (Separability)**: The assessment of separability may be ambiguous. For example, if the clinician was under extreme time pressure, it may not be clear if that pressure was exceptional (making separability "no") or routine (where separability is expected). This requires judgment.
  2. **Step 3 (Normative Competence)**: What counts as "reasonable effort" to gather information? This may vary by context (e.g., emergency vs. routine care). Also, the absence of documentation does not always imply lack of competence (but it is strong evidence).
  3. **Step 5 (Foreseeability)**: Distinguishing between a flaw that was "foreseeable and preventable" and one that was not may be contentious. For example, if a rare genetic variant caused a drug reaction, was it the developer's duty to account for it? This requires domain expertise and deliberation.

  ### Value Judgements That Cannot Be Proceduralised
  - **What counts as "reasonable"**: In Steps 3 and 5, the committee must make value judgments about what level of diligence is expected of clinicians and developers. This is context-dependent and may reflect societal expectations.
  - **Institutional role**: The procedure assumes that institutional authorisation is clear, but in reality, the distribution of authority between the hospital, the developer, and regulatory bodies may be contested.
  - **Fairness in irreducible gaps**: When declaring a gap, the committee must then collectively decide how to allocate responsibility (e.g., compensation, system changes). This involves ethical principles (e.g., justice, solidarity) that are not captured by the flowchart.

  ### Conclusion
  This flowchart provides a structured approach to navigate responsibility in CDSS-related harms. It is designed to be efficient and self-contained. However, it requires the committee to exercise judgment at key points, particularly in assessing separability, competence, and foreseeability. In cases of irreducible gaps, the committee must engage in collective deliberation to determine the institutional response.
answer: |-
  Below is a prose flowchart for adjudicating responsibility in cases involving semi-autonomous clinical decision-support systems (CDSS). The procedure is structured as a sequence of diagnostic questions, designed for use by a clinical ethics committee with no philosophical training. It operationalises three core concepts:  
  - **Causal Contribution**: Did the agent’s actions directly enable the harm?  
  - **Normative Competence**: Did the agent possess and exercise the capacity to make sound judgments?  
  - **Institutional Authorisation**: Was the agent empowered by institutional rules to make the final decision?  

  **Collapse Conditions** (where clinician endorsement and system output are inseparable) are flagged explicitly. The procedure stops when **primary responsibility** is definitively assigned to an individual/entity or an **irreducible gap** (requiring collective institutional judgment) is declared.  

  ---

  ### **Prose Flowchart: Responsibility Assessment Protocol**  
  *Complete sequentially. Maximum duration: 45 minutes.*  

  #### **Step 1: Establish Decision Separability**  
  **Question**: *Was the clinician’s adoption, adaptation, or rejection of the CDSS recommendation a* separable *act of judgment?*  
  - **Sufficient "Yes"**: Clinician had independent access to patient data, clinical rationale, and time to evaluate the recommendation; override/rejection mechanisms were accessible and functional.  
  - **Sufficient "No" (Collapse Condition)**: CDSS output was presented as non-negotiable (e.g., "hard stop" alert), clinician lacked time/expertise to evaluate, or override was functionally impossible.  
  - **Stop-Point**:  
    - If **"No"** → Declare **irreducible gap**. Proceed to **collective institutional judgment** (developers/institution share non-delegable duties).  
    - If **"Yes"** → Proceed to Step 2.  

  #### **Step 2: Assess Clinician’s Normative Competence**  
  **Question**: *Did the clinician exercise reasonable normative competence in engaging with the CDSS output?*  
  - **Sufficient "Competent"**: Clinician (a) verified patient-specific data inputs, (b) documented independent assessment (e.g., "I agree/disagree because..."), and (c) possessed relevant expertise.  
  - **Sufficient "Not Competent"**: Clinician (a) blindly accepted/rejected without review, (b) ignored accessible contradictory evidence, or (c) lacked training to interpret the output.  
  - **Stop-Point**:  
    - If **"Not Competent"** → Assign **primary responsibility to clinician**. (Causal contribution + failed normative competence under institutional authorisation.)  
    - If **"Competent"** → Proceed to Step 3.  

  #### **Step 3: Evaluate CDSS Recommendation Soundness**  
  **Question**: *Was the CDSS recommendation medically and ethically sound at the time of delivery?*  
  - **Sufficient "Sound"**: Recommendation aligned with evidence-based guidelines, patient data was accurate/complete, and no known system errors existed.  
  - **Sufficient "Flawed"**: Recommendation contained errors (e.g., algorithmic bias, corrupted data, outdated knowledge base) that would be identifiable *by developers* during routine maintenance.  
  - **Stop-Point**:  
    - If **"Sound"** AND clinician **overrode** it → Assign **primary responsibility to clinician** (competent judgment was exercised but causally contributed to harm).  
    - If **"Flawed"** → Proceed to Step 4.  

  #### **Step 4: Determine Developer/Institutional Culpability for Flaw**  
  **Question**: *Was the CDSS flaw foreseeable and preventable by developers or the institution?*  
  - **Sufficient "Yes"**: Flaw resulted from negligent design, validation, or maintenance (e.g., ignored edge cases, skipped audits, poor data governance).  
  - **Sufficient "No"**: Flaw was a novel, unforeseeable failure (e.g., first-of-its-kind interaction, zero-day vulnerability).  
  - **Stop-Point**:  
    - If **"Yes"** → Assign **primary responsibility to developers/institution** (causal contribution + failed institutional authorisation to ensure safety).  
    - If **"No"** → Declare **irreducible gap**. Escalate to **collective institutional judgment** (no individual attribution possible).  

  ---

  ### **Worked Applications**  
  #### **Case 1: Clinician Overrode Sound Recommendation → Harm**  
  - **Scenario**: CDSS correctly recommended anticoagulant for atrial fibrillation. Clinician overrode due to personal skepticism. Patient had a stroke.  
  - **Procedure**:  
    - Step 1: **"Yes"** (separable—override was intentional).  
    - Step 2: **"Competent"** (clinician documented rationale).  
    - Step 3: **"Sound"** → **Stop**. Assign responsibility to **clinician**.  
  - **Why?** Clinician causally contributed harm via competent but erroneous judgment.  

  #### **Case 2: Clinician Blindly Adopted Flawed Recommendation → Harm**  
  - **Scenario**: CDSS recommended unsafe dialysis dose due to corrupted data. Clinician accepted without review. Patient died.  
  - **Procedure**:  
    - Step 1: **"Yes"** (separable—override was possible).  
    - Step 2: **"Not Competent"** → **Stop**. Assign responsibility to **clinician**.  
  - **Why?** Clinician failed normative competence despite separability.  

  #### **Case 3: Opaque System, No Meaningful Override → Harm**  
  - **Scenario**: CDSS used a proprietary neural network to reject ICU admission. Clinician could not access logic; override required 5-tier approvals. Patient deteriorated untreated.  
  - **Procedure**:  
    - Step 1: **"No"** (collapse condition—override impossible). → **Stop**. Declare **irreducible gap**.  
  - **Why?** Clinician’s endorsement was inseparable from system output. Collective judgment needed to assign institutional liability.  

  ---

  ### **Limitations and Value Judgments Requiring Deliberation**  
  1. **Step 1 (Separability)**:  
     - **Misfires**: When time pressure or interface design obscures "meaningful override." Requires committee to debate context (e.g., was 30 seconds sufficient for evaluation?).  
     - **Value Judgment**: Whether institutional workflows *coerced* reliance on CDSS.  

  2. **Step 2 (Normative Competence)**:  
     - **Misfires**: In "gray zone" errors (e.g., clinician reviewed data but missed subtle contradiction). Committee must assess "reasonable effort" case-by-case.  

  3. **Step 4 (Foreseeability)**:  
     - **Misfires**: Novel flaws in adaptive AI. Deliberation needed on "state-of-the-art" standards (e.g., should developers have tested for rare racial biases?).  

  4. **Irreducible Gaps**:  
     - **Unavoidable Deliberation**: When collapse conditions or unforeseeable flaws occur, the committee must weigh:  
       - Institutional accountability (e.g., why was an opaque system approved?).  
       - Compensatory justice (e.g., no-fault settlements).  

  **Final Note**: This procedure resolves ~80% of cases but cannot eliminate contextual deliberation. Hard cases demand explicit discussion of institutional power dynamics and normative trade-offs (e.g., efficiency vs. safety). Always document rationale for audit trails.
