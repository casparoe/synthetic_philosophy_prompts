prompt: |-
  I'm taking a course on rational choice and we just read about Parfit's hitchhiker — the driver who promises to pay the hitchhiker once they're home, but then has no reason to actually pay. I'm also learning about smart contracts and credible commitment in decentralized systems, and it struck me that there's a weird parralel but also a gap.

  So here's what I want from you: You're a philosopher of rationality who also understands blockchain architecture pretty well. Restate Parfit's hitchhiker problem — the rationality of committing to an irrational action, the binding problem, the reputation dynamics if it's repeated — entirely in the vocabulary of smart contract architecture. Use terms like oracles, escrow, self-executing code, commitment devices, trustless execution, and the distinction between on-chain enforcement and off-chain intent. Be as faithful as you can to the philosophical structure, and don't smuggle in assumptions that only make sense in crypto.

  Then give me the residue report: which parts of Parfit's puzzle map cleanly onto smart-contract logic (e.g., does the binding problem become the oracle problem?), which parts have to be distorted to fit (e.g., does rational irrationality become irrational code execution?), and which parts have no counterpart at all in this vocabulary. In particular, does the philosophical worry about whether you should pay — the normative should — survive translation into a system that only enforces or doesn't enforce? Or is that residue telling us that smart-contract thinking is missing a normative dimension, or that Parfit's puzzle was always partly about enforcement?

  Please think step by step. Start by briefly outlining the original hitchhiker structure in your own words — no verbatim quotes, just paraphrase. Then do the translation. Then the residue. And be honest about where you're fudging — I want to know whether the gap is in the blockchain vocabulary or in the original argument.
