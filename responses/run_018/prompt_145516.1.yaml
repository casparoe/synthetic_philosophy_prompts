answer: |-
  Your argument brilliantly connects Austen's social critique to modern wealth inequality debates! Let's break down *Pride and Prejudice* through the lens of inheritance, starting-gate equality, and legitimacy:

  **1. The Entailment: Unfairness Framed as Societal Absurdity, Not Just Misfortune:**
  *   **Austen's Explicit Critique:** The novel *screams* unfairness. Mrs. Bennet's hysteria, Mr. Bennet's weary resignation, and Elizabeth's sharp commentary ("the hardship of your case... my father's particular way") highlight the profound injustice. The entail isn't a neutral "fact of life" like weather; it's a human-made system prioritizing male lineage over competence, responsibility, or the needs of existing dependents.
  *   **Starting-Gate Inequality Embodied:** The Bennet sisters' "starting gate" is defined by debt (no inheritance) and dependence (reliance on marriage). Their opportunities are fundamentally unequal compared to Darcy (born at the finish line) or even Miss Bingley (inherited fortune). Their "equal opportunity" in the marriage market is a cruel joke – their lack of capital severely restricts their choices and leverage.

  **2. Darcy vs. Collins: Legitimacy Through "Worthiness" vs. System Incompetence:**
  *   **The Shared Unearned Wealth:** You're absolutely right – both Darcy's £10,000/year and Collins inheriting Longbourn stem from unearned capital protected by law (primogeniture, strict settlement). Philosophically, neither "deserves" it based on merit at birth.
  *   **Austen's Differential Treatment - Why?**
      *   **Collins:** He embodies the *system's absurdity and danger*. His sycophancy, lack of intelligence, judgment, and empathy make him utterly *unworthy* of stewardship. His inheritance threatens the well-being of the Bennets and the estate itself. We laugh *at the system* manifesting in him.
      *   **Darcy:** Austen judges him *after* inheritance. His legitimacy comes from *how he uses it*:
          *   **Stewardship:** He responsibly manages Pemberley ("liberal and handsome"), cares for tenants and dependents (Georgiana, Wickham's education initially). It's presented as a duty, not just privilege.
          *   **Moral Growth:** His journey involves shedding inherited arrogance ("pride") and learning genuine virtue (helping Lydia *without* expectation).
          *   **Merit Integration:** His wealth provides the setting, but Elizabeth falls for his *character* revealed through actions (letter, Pemberley, Lydia rescue). His worthiness is *earned* within the system, not granted solely by birth.
  *   **The Hidden Argument:** Austen *does* suggest inherited wealth is only *legitimate* (or palatable) when the heir demonstrates moral character and responsible stewardship. Collins fails spectacularly; Darcy (eventually) succeeds. The system itself isn't overturned, but its outcomes are judged morally.

  **3. Elizabeth Rejecting Collins: Rejecting Dynastic Logic & Claiming Agency:**
  *   **Defying Economic Necessity:** This is revolutionary. Facing potential destitution, Elizabeth prioritizes personal happiness, respect, and intellectual compatibility over pure economic security offered by the dynastic heir. She rejects the very logic (marry the heir to retain the estate) meant to "solve" the entail problem within the system.
  *   **Playing a Different Game?** Partly. She rejects the dynastic game (marry Collins/status quo) and gambles on the *romantic meritocratic* game – finding a partner she loves *and* respects, believing her personal worth (intelligence, character) can secure a good match. Her victory (Darcy) validates this, but it's a high-risk strategy dependent on encountering an exceptional man open to her value.

  **4. The Happy Ending: Systemic Reshuffling, Not Solution:**
  *   **Perpetuating the System:** You hit the nail on the head. Jane and Elizabeth marry *into* the landed gentry/aristocracy. They escape poverty *by joining the very class* whose inheritance laws endangered them. Their security comes from Darcy's and Bingley's *inherited/unearned* wealth (Bingley's is trade-derived but *functionally* inherited capital).
  *   **Austen's Awareness:** The novel *knows* this isn't systemic change. Charlotte's pragmatic marriage to Collins highlights the grim alternatives. The entail remains. The plight of other Bennet sisters depends *entirely* on the new connections. Austen solves the *individual* problem through marriage (the only realistic path for women) but offers no critique of inheritance law reform. The ending is a *personal* triumph within, not over, the system.

  **5. Equal Opportunity vs. Equal Outcome in the Marriage Market:**
  *   **The Novel's Stark Reality:** Opportunity is profoundly unequal. Miss Bingley (fortune) has vastly more choices than the Bennet sisters (no fortune). Darcy has near-limitless choice. "Equal outcome" is impossible and never suggested.
  *   **Austen's Focus on *Relative* Opportunity & Agency:** The novel explores how individuals navigate their *unequal* starting points. Elizabeth maximizes her limited opportunity through wit, discernment, and principle, achieving an outcome far better than Charlotte (who had similar starting capital but chose security over compatibility). Austen critiques the *extremes* of inequality (the Bennet girls' potential destitution vs. Darcy's effortless security) and celebrates *moral worth* as a form of capital that can sometimes overcome financial disadvantage in the marriage market, but she doesn't pretend the market itself is fair.

  **Where the Philosophical Reading Holds & Breaks:**

  *   **Holds:**
      *   Brilliantly exposes the injustice of gender-based inheritance (entail) as a source of profound starting-gate inequality.
      *   Reveals the hypocrisy of judging unearned wealth differently based on the heir's character (Darcy vs. Collins).
      *   Shows Elizabeth's rejection of dynastic logic as radical agency.
      *   Demonstrates how the "happy ending" relies on marrying into the system, not changing it.
      *   Clearly depicts the marriage market as a site of highly unequal opportunity based on inherited capital.
  *   **Breaks/Limitations (Context is Key):**
      *   **Historical Reality of Inheritance:** Entails/strict settlements were common to prevent estate fragmentation and bankruptcy (a real risk – think Sir Walter Elliot in *Persuasion*). While unfair to daughters/younger sons, the intent was often dynastic *preservation*, not just misogyny. Austen critiques the *human cost*, not necessarily the entire concept of inherited estates.
      *   **Austen's Scope:** She was a social realist, not a revolutionary economist. Her focus was on individual morality, responsibility, and navigating social structures, not proposing systemic wealth redistribution or tax reforms (like modern inheritance tax debates). Her solution was better *people* within the system, not a new system.
      *   **Darcy's Worthiness:** While his wealth is unearned, Austen spends immense energy showing him *earning* Elizabeth's respect through moral action. His inheritance provides the setting, but his *character* is the point. The novel doesn't demand he renounce Pemberley, only that he deserves it through conduct.
      *   **"Equal Opportunity" as a Modern Lens:** The *concept* existed embryonically (e.g., critiques of nepotism), but the rigorous philosophical framework of "starting-gate equality" (Rawls, etc.) is modern. Austen intuitively grasped the injustice of unequal starts but articulated it through social consequence and moral failing, not abstract political theory.

  **Conclusion: A Nuanced Critique Within Constraints**

  Austen uses the entail and the contrast between Darcy/Collins to deliver a scathing critique of inheritance systems that create devastating starting-gate inequality, particularly for women. She exposes the system's reliance on unearned capital and judges its outcomes harshly based on the *moral worth* and stewardship of the heir. Elizabeth embodies a radical (for her time) assertion of agency against dynastic logic. However, Austen operates within the realistic constraints of Regency England. Her "solution" – marrying wisely based on character – is a personal triumph within the flawed system, not a blueprint for overhauling inheritance law or achieving true starting-gate equality. The novel brilliantly shows the problem and the human cost, celebrates individual merit and moral choice, but ultimately leaves the system of unearned, unequally distributed capital fundamentally intact, even as it reshuffles the winners through marriage. Your philosophical lens illuminates the enduring relevance of Austen's critique in debates about wealth, opportunity, and fairness.
