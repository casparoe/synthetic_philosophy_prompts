answer: |-
  **Committed Qualitative Hedonist:**  
  You're conflating neural mechanisms with *phenomenal essence*. Yes, dopamine spikes aren't the answer—they're correlates, not the thing itself. The unity of pleasure isn't in crude introspection or neurotransmitter soup; it's in the *first-person attitude of intrinsic attraction*. When you solve a proof or savor a burrito, both states present themselves as *experiences you want to prolong for their own sake*. Pain does the opposite: it *repels*. That valence—the pull toward continuation versus the push toward cessation—is the irreducible core. Neuroscience can map salience signals, but it can't capture why you *care* about staying in the pleasurable state. Hedonism defends this normative anchor: well-being is grounded in the positive phenomenal field *as lived*, not in neural noise or preference-satisfaction (which could endorse joyless states). Your roommate's heterogeneity objection mistakes diversity in *sources* for disunity in *value*. The commonality isn't similarity; it's the shared *desiderative character*. Strip that away, and pluralism collapses into arbitrary value-shapelessness.  

