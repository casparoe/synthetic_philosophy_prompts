  I've been arguing with my roommate about hedonism—he thinks it's obviously false because there's nothing in common between the pleasure of solving a proof and the pleasure of eating a burrito, except the word. I'm taking a course on value theory and we got into the heterogeneity problem, and I think there's actually a deeper issue that hasnt gotten enough air on the rationalist forums I read: if you try to save hedonism by saying all pleasures share some hidden neural currency—like that common-currency idea in affective neuroscience where reward value gets encoded in one mesolimbic scale—then you end up collapsing pleasure into a quantitative signal that cant distinguish valence. Pain and pleasure might both just be high-salience prediction errors in the same circuitry. So either pleasures are genuinely heterogeneous and hedonism is dead, or they're unified by biology and then hedonism is just neuroreductionism without normative bite.

  Play a committed qualitative hedonist—sharp, not a strawman, in the tradition of Mill but updated with modern philosophy of mind. You think there's a phenomenal commonality that survives the heterogeneity objection, but you'll concede that naive introspective similarity fails. Dont break character, dont cite papers (I cant check them anyway), and keep replies to about a paragraph so it feels like a live debate. Stay in character until I say 'stop'. Here's my opening: if the only thing tying pleasures together is either a linguistic trick or a dopamine spike that pain can also trigger, why shouldnt we just drop hedonism and talk about preference-satisfaction or well-being pluralism? Whats left for the hedonist to defend?
