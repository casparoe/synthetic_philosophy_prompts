answer: |-
  Below is a decision tree addressing whether qualia survive "quining" (specifically the Chase-Sanborn argument that treating qualia as theoretical posits leads to contradiction). The tree is built from logical space using concrete cases/questions, with **6 terminal nodes** (including one empty/unexplored branch and one "problematic" branch). Philosophical positions are mapped only after the tree is constructed. Nodes are phrased as yes/no questions about cases to avoid jargon. The synthetic-cortex case anchors the first node:  
  *"A subject's sensory neurons are replaced one-by-one with functionally identical silicon analogues, preserving all behavioral and cognitive profiles. The subject reports, 'The qualitative feel is exactly the same.'"*

  ---

  ### **Decision Tree: Do Qualia Survive Quining?**  
  **Start → Node 1 (Synthetic Cortex Report):**  
  *Can this report be false despite identical behavior/cognition?*  
  - **Yes** (Qualia can vary undetectably) → Go to Node 2.  
  - **No** (Report must be truthful; qualia fixed by function) → Go to Node 4.  

  **Node 2 (Undetectable Variation):**  
  *Is a property allowing undetectable variation coherent as a theoretical posit?*  
  - **Yes** (Such properties can exist) → Go to Node 3.  
  - **No** (Undetectable variation = incoherent posit) → **Leaf 1: Eliminativism / Strong Incoherence View**.  

  **Node 3 (Phenomenal Reference):**  
  *Do phenomenal concepts (e.g., 'what it’s like to see red') refer to something real but ineffable?*  
  - **Yes** (Refers to ineffable reality) → **Leaf 2: *Problematic* Ineffable Realism with Undetectable Variation**.  
  - **No** (Concepts are empty or refer only to effable properties) → **Leaf 3: *Empty Branch***.  

  **Node 4 (Phenomenal Reference):**  
  *Do phenomenal concepts refer to something real?*  
  - **Yes** (Qualia exist) → Go to Node 5.  
  - **No** (Concepts are illusory/empty) → **Leaf 4: Illusionism / Eliminativism**.  

  **Node 5 (Nature of Qualia):**  
  *Are qualia identical to functional/cognitive states?*  
  - **Yes** (Qualia = functional properties) → **Leaf 5: Functionalist Realism (Restricted Realism)**.  
  - **No** (Qualia non-identical but fixed by function) → **Leaf 6: Non-Reductive Realism**.  

  ---

  ### **Terminal Nodes (Leaves) & Diagnostics**  
  1. **Leaf 1: Eliminativism / Strong Incoherence View**  
     - **Path:** Yes → No.  
     - **View:** Qualia are incoherent theoretical posits (undetectable variation proves they cannot be scientifically grounded). Chase-Sanborn-style contradiction succeeds; qualia eliminated.  
     - **Example Advocates:** Patricia Churchland (lean), early Frank Jackson (post-knowledge argument).  

  2. **Leaf 2: *Problematic* Ineffable Realism with Undetectable Variation**  
     - **Path:** Yes → Yes → Yes.  
     - **View:** Qualia are real, ineffable, and can vary undetectably. Rejects the incoherence charge but struggles with scientific admissibility.  
     - **Diagnosis:** Vulnerable to Chase-Sanborn (ineffability + privacy = no explanatory role). Widely contested as self-undermining.  
     - **Example Advocates:** David Chalmers (property dualism, bites bullet).  

  3. **Leaf 3: *Empty Branch***  
     - **Path:** Yes → Yes → No.  
     - **Diagnosis:** Inconsistent. If qualia are effable (non-ineffable), undetectable variation collapses: effability implies reports *should* detect changes. No coherent position occupies this branch.  

  4. **Leaf 4: Illusionism / Eliminativism**  
     - **Path:** No → No.  
     - **View:** Qualia are illusions; phenomenal concepts lack reference. Synthetic-cortex report is incorrigible *because* there’s nothing to misreport.  
     - **Example Advocates:** Daniel Dennett.  

  5. **Leaf 5: Functionalist Realism (Restricted Realism)**  
     - **Path:** No → Yes → Yes.  
     - **View:** Qualia exist but are identical to functional states. Abandons ineffability/privacy (qualia are publicly accessible via behavior). Survives quining by rejecting "hard" properties.  
     - **Example Advocates:** David Lewis, Hilary Putnam (early).  

  6. **Leaf 6: Non-Reductive Realism**  
     - **Path:** No → Yes → No.  
     - **View:** Qualia are real, non-identical to functional states, but fixed by them (no undetectable variation). Rejects incoherence charge by denying variation premise.  
     - **Example Advocates:** Ned Block, Jerry Fodor.  

  ---

  ### **Key Notes for the Tree**  
  - **Unclean Separation:**  
    - **Leaf 5 vs. Leaf 6** agree on all case answers but differ metaphysically (identity vs. supervenience). The tree cannot distinguish them further without abstract commitments (e.g., "Is consciousness ontologically fundamental?").  
  - **Empty/Problematic Branches:**  
    - **Leaf 3 (Empty):** Effable qualia + undetectable variation → logical contradiction (effability implies detectability).  
    - **Leaf 2 (Problematic):** Ineffable qualia + undetectable variation → targeted by Chase-Sanborn as unscientific. Survives only if the incoherence argument fails.  
  - **Settled vs. Contested:**  
    - **Settled:** There is a live debate about whether qualia coherence can be reconciled with scientific practice (per Chase-Sanborn).  
    - **Genuinely Contested:**  
      - Whether Node 2’s "No" (incoherence) succeeds (Eliminativism vs. Ineffable Realism).  
      - Whether saving qualia requires abandoning privacy/ineffability (Restricted Realism vs. Non-Reductive Realism).  
  - **No Consensus:** The tree reflects irreducible disagreement on foundational premises (e.g., the "hard problem" is intractable vs. dissolved).  

