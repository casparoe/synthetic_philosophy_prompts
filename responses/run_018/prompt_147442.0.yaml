  | Leaf | View                                      | Key Tradeoffs                                  |  
  |------|-------------------------------------------|-----------------------------------------------|  
  | 1    | Eliminativism                             | Sacrifices qualia to save scientific coherence |  
  | 2    | Ineffable Realism                         | Saves qualia at cost of scientific admissibility |  
  | 3    | *Empty*                                   | Logically incoherent                           |  
  | 4    | Illusionism                               | Denies qualia to preserve functionalism       |  
  | 5    | Functionalist Realism (Restricted)        | Saves qualia by abandoning ineffability/privacy |  
