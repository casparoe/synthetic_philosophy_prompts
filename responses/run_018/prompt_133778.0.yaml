answer: |-
  ## Final Examination: HUME 412 - Political Economy in the Scottish Enlightenment

  **Question:**  
  In "Of Money" and "Of Interest," David Hume argues that an increase in the money supply does *not* immediately raise prices but instead stimulates industry through a "gradual diffusion" process. Critically reconstruct Hume’s argument for this gradual effect, focusing on his implicit assumptions about the velocity of money. Then, apply this framework to the following counterfactual scenario:  

  A closed, agrarian economy, previously reliant on barter and limited specie, suddenly issues a large volume of government paper notes. These notes are declared legal tender and are convertible *not* into gold or silver, but into future claims against anticipated tax revenues (e.g., one note = one bushel’s future tax obligation). Analyze whether Hume’s mechanism of gradual diffusion and industrial stimulus would still operate under this novel form of credit-backed issuance.  

  Specifically:  
  1.  **Identify** the precise point(s) in the diffusion process where the effects on *nominal* economic activity (prices) might diverge from effects on *real* economic activity (output, labor, commodities) in this counterfactual.  
  2.  **Evaluate** the implications of this divergence (or lack thereof) for Hume’s broader anti-mercantilist thesis that national wealth fundamentally consists of "the labour of its inhabitants and the commodities produced by that labour," rather than accumulated money or paper.  

  Your answer must demonstrate precise engagement with Hume’s theoretical logic, not merely descriptive summary. Avoid modern monetary concepts; reason strictly within Hume’s 18th-century framework.  

  ---

  **Model Answer (Approx. 700 words):**

  David Hume's rejection of the mercantilist obsession with precious metals hinges on his sophisticated account of monetary dynamics. He contends that an influx of money (e.g., specie) does *not* act like water finding its level, instantly raising all prices proportionally ("Of Money"). Instead, it diffuses unevenly through the economy over time. This diffusion, Hume argues, acts as a powerful stimulus to industry before prices fully adjust. The mechanism relies critically on a *lag* between the money entering circulation and its full effect on the general price level.

  Hume reconstructs this process sequentially: new money enters specific sectors (e.g., merchants, manufacturers), increasing the incomes and spending power of those first receiving it. These agents, finding themselves with greater nominal resources before the prices of the goods *they* purchase have risen significantly, are incentivized to expand production and employment ("quicken the diligence of every individual"). They bid for more labor and materials, setting in motion a chain of increased demand and activity. Only gradually, as the new money spreads ("diffuses itself") and demand pressures build across markets, do prices begin to rise universally. Crucially, Hume implicitly assumes a *moderate and variable velocity of circulation* during this diffusion phase. Money doesn't instantly jump from hand to hand; it is spent relatively slowly as it moves from initial recipients to secondary producers, laborers, landlords, and finally to consumer goods. This temporal delay between injection and full price impact is the window where real economic stimulus occurs – increased output and employment precede inflation.

  Applying this framework to the counterfactual – a sudden large issuance of tax-backed paper notes in a closed agrarian economy – reveals significant tensions and potential fractures in Hume's gradualist mechanism. The core difference lies in the nature, enforceability, and perceived value of the money.

  1.  **Initial Stimulus vs. Velocity Distortion:** Initially, the effect might resemble Hume's model. The government injects notes by spending them (e.g., paying soldiers, officials, purchasing grain). Recipients (soldiers, officials, farmers selling grain) experience an increase in nominal income. Assuming some acceptance, they spend notes on goods and labor, potentially stimulating demand in local markets, much like Hume's merchants. **However, the divergence begins almost immediately with velocity.** Unlike specie, whose intrinsic value (however overestimated by mercantilists) provides a baseline for universal acceptance and predictable velocity, the value of these tax-notes hinges entirely on trust in the government's future taxing capacity and willingness to honor redemption. In an agrarian society with weak institutions, this trust is fragile. Recipients, uncertain about the notes' future purchasing power or redeemability, have a powerful incentive to *spend them quickly* to acquire real goods before their value erodes or acceptance falters. This drastically *increases the velocity of circulation* compared to Hume's specie scenario. Money rushes through the system faster.
  2.  **The Divergence Point:** The critical point of divergence between nominal and real activity occurs when this heightened velocity interacts with **supply constraints and expectations.** The initial recipients spend quickly, bidding up the prices of readily available goods (especially basic necessities like food in an agrarian setting). Landlords or merchants receiving the notes secondarily, observing rising prices and doubting the paper's security, are likely to *hoard real assets* (grain, land, durable goods) or demand payment in kind, rather than reinvesting productively. Here, nominal spending surges (driving up prices rapidly), but the incentive for *sustained, productive investment* diminishes. The notes fail to reliably "quicken diligence" beyond the first, direct recipients because subsequent holders see them as a depreciating claim, not a stable store of value or reliable capital. Real activity (agricultural output) is constrained by land, weather, and technology; the paper influx cannot magically increase these in the short term. Instead of primarily stimulating new production during the diffusion lag, the rapid velocity pushes nominal prices upwards much faster, quickly overwhelming any initial real stimulus. The "gradual diffusion" phase collapses.
  3.  **Implications for Anti-Mercantilism:** Paradoxically, this counterfactual *strengthens* Hume's core anti-mercantilist argument, albeit by demonstrating the fragility of unsound paper. The experiment shows that paper wealth, divorced from a credible anchor (like specie, which Hume saw as having inherent, albeit limited, value across borders and time) and backed only by uncertain future fiscal claims, rapidly loses its capacity to stimulate real industry sustainably. Its value evaporates as velocity spikes and trust collapses, leading to inflation without corresponding increases in the "labour of its inhabitants" or real "commodities." The divergence – rapid nominal price increases decoupled from real growth – proves Hume's point: the paper itself possesses no intrinsic wealth. National wealth remains grounded in tangible assets and productive labor. The failure of this artificial money to replicate Hume's gradualist specie mechanism underscores that only sound money, facilitating exchange without creating false illusions of value, can avoid undermining the real economy it should serve. The mercantilist focus on accumulating *any* form of money, including ultimately worthless paper claims, is thus revealed as even more dangerous folly. Wealth lies in the fields and workshops, not the treasury's printing press.

  ---

  **Marking Scheme (Total: 25 Marks)**

  *   **I. Reconstruction of Hume's Gradualist Argument (5 Marks):**
      *   5: Precise explanation of the *sequence* of diffusion (entry point, spending, increased demand for labor/goods, lagged price rises), explicitly linking the *delay* to the stimulus of real activity ("quicken diligence"). Clear articulation of the *temporal* aspect.
      *   3-4: Correct description but lacks sufficient detail on the sequence or the causal link between the lag and real stimulus. May be slightly vague.
      *   1-2: Superficial summary, merely stating prices don't rise instantly without explaining the diffusion process or its economic effect. Focuses only on quantity theory endpoint.
      *   0: Misrepresents or misunderstands Hume's core argument.
      *   **Key Misconception Penalty:** Treating Hume as believing prices rise instantly (Strict Metallist/Naive QTM) (-2 to -3). Ignoring the lag's role in stimulating industry (-2).

  *   **II. Isolation of Hume's Implicit Velocity Assumption (5 Marks):**
      *   5: Explicitly identifies the *moderate/variable velocity* as the critical implicit factor enabling the diffusion lag. Explains *why* velocity is moderate initially (money moves sequentially, spent cautiously/incrementally as it spreads).
      *   3-4: Mentions velocity or the 'slowness' of diffusion but doesn't clearly isolate it as the *key assumption* underlying the lag, or doesn't explain *why* velocity is moderate.
      *   1-2: Vague reference to money "moving slowly" or "taking time" without using the concept of velocity or linking it specifically to the mechanism.
      *   0: Fails to recognize or address the velocity factor.
      *   **Key Misconception Penalty:** Conflating Hume's view with modern monetary neutrality (where V is assumed constant or changes instantly) (-2 to -3). Assuming Hume thought velocity was always high or irrelevant (-2).

  *   **III. Analysis of Paper-Credit Counterfactual (7 Marks):**
      *   7: Comprehensive analysis contrasting the counterfactual notes with specie. Clearly explains how *trust/redeemability* issues fundamentally alter the dynamics: potential for rapid initial spending *due to uncertainty*, leading to *increased velocity*. Analyzes impact on recipient behavior (hoarding real assets vs. productive investment). Explains why the notes might *fail* to stimulate sustained industry beyond initial injection points due to lack of perceived store-of-value function.
      *   5-6: Good analysis, identifies key differences (trust, redeemability) and links to behavioral changes (increased spending speed, hoarding), but may lack depth on *why* this disrupts the gradualist mechanism or the specific failure for sustained stimulus.
      *   3-4: Identifies some differences (e.g., "not backed by gold") but struggles to connect this concretely to altered economic behavior or the breakdown of Hume's process. Superficial application.
      *   1-2: Minimal engagement with the counterfactual specifics. Treats the paper notes identically to specie in the analysis.
      *   0: Ignores the counterfactual or misapplies it completely.
      *   **Key Misconception Penalty:** Assuming the paper notes function identically to specie because they are "money" (-3). Ignoring the role of trust/expectations entirely (-2). Failing to link instrument design to velocity (-2).

  *   **IV. Diagnosis of Nominal/Real Divergence Point (5 Marks):**
      *   5: Precisely identifies the point of divergence: When *heightened velocity* (driven by uncertainty) meets *supply constraints* and triggers *expectations of depreciation*, leading secondary recipients (e.g., landlords, merchants) to *hoard real goods/assets* or demand payment in kind, causing *rapid nominal price inflation* without corresponding *increases in productive investment or output*. Clearly distinguishes nominal spending surge from stalled real growth.
      *   4: Correctly identifies the behavioral shift (hoarding, preference for real goods) and the inflation outcome, but may not explicitly link it to velocity meeting supply constraints/expectations, or may be slightly vague on *who* triggers the divergence.
      *   3: Identifies inflation occurring faster than real growth but lacks precision on *why* and *when* the divergence specifically happens in the sequence.
      *   1-2: Vague statement about prices rising without real growth, but no specific diagnosis of the mechanism or trigger point.
      *   0: No identification of divergence point.
      *   **Key Misconception Penalty:** Claiming divergence happens instantly upon issuance (-2). Blaming divergence solely on the agrarian nature without linking to monetary dynamics (-1 to -2). Confusing the initial stimulus with the divergence point (-1).

  *   **V. Assessment of Impact on Anti-Mercantilism (3 Marks):**
      *   3: Sophisticated evaluation: Argues the counterfactual *strengthens* Hume's core thesis by demonstrating the *fragility* of unsound paper, its rapid devolution into inflation without real wealth creation, thereby proving wealth is labor/commodities, not paper. Explicitly links the failure of the notes to stimulate sustainable real growth to Hume's critique of mercantilist focus on money *qua* money.
      *   2: Correctly states that it supports Hume's view that wealth isn't paper, linking it to the inflationary outcome or lack of real stimulus, but lacks depth on *how* it specifically reinforces the argument against mercantilism's accumulation goal.
      *   1: Simple statement that paper isn't real wealth, without connecting it meaningfully to the counterfactual's results or Hume's broader argument.
      *   0: Incorrect assessment (e.g., says it undermines Hume) or missing.
      *   **Key Misconception Penalty:** Claiming the counterfactual *undermines* Hume because paper can "work" (-2). Failing to see the link between the instrument's failure and the critique of mercantilism (-1 to -2).
