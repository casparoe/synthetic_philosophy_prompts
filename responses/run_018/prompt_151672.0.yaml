  4. for each crux, one concrete argument or case both sides accept bears on it, plus each camp's advance prediction about what we'd find.

  please keep it in the weeds - dont just say they disagree about language. no bibliography, no reading list, no citation requests, since this might run on a model with no web access. write it casual, with a typo or two is fine.
