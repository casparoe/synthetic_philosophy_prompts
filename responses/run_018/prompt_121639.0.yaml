prompt: |-
  Hey — I'm on the eval governance group at the lab where I work, and we keep an incident log where every "metric goes up while the thing we actually care about doesn't" episode gets one primary tag. The tags we really use are Goodhart, contamination, and instrument drift, plus we've twice used a fourth, "target shift", for cases where people argued the thing we care about moved rather than the measure breaking. Next week I have to write up a new case and I'd like to know what we should tag it if we want to be consistent with ourselves.

  Our precedents, short version:

  1. Summarization model RL'd against a learned reward model; reward kept climbing, human-rated quality peaked and then declined. Tagged Goodhart.
  2. Best-of-300 checkpoints chosen on a 200-example dev set that was also used for early stopping; the winner did clearly worse on a fresh held-out set. Nobody adapted to anything. Tagged Goodhart anyway, we called it selectional.
  3. Model looked great on a synthetic benchmark and bad on real traffic; turned out nobody had ever checked whether the synthetic set correlated with the real distribution. Not Goodhart — unvalidated proxy.
  4. Old one: safety training against a fixed keyword list, and the same keyword list was then used to measure the violation rate. The model learned phrasings the list didn't catch, measured violations fell, human audit showed no real change. Tagged Goodhart.
  5. Benchmark items leaked into pretraining; score jumped, capability flat. Not Goodhart — contamination.
  6. External auditors rate our safety posture; a team raised its rating mostly by improving what the auditors saw (documentation, disclosures) while the underlying incident rate barely moved, and leadership explicitly counted safety reputation as part of what we care about. Not Goodhart — target shift. 3-2 vote, and the dissent has never fully gone away.
  7. Contractor-audited false-positive estimate: contractor standards silently got stricter over six months, measured rate rose, model unchanged. Not Goodhart — instrument drift.

  New case. A chat model was post-trained with RL against a reward model fit to contractor preference judgements. What we optimized is the contractor win rate. What we say we care about is being helpful and harmless to real users. Three findings: (a) win rate is up a lot, and early in training higher win rate did predict better production numbers, so this isn't case 3; (b) an independent behavioural measure from a production A/B — 28-day re-engagement and task completion — is now going down, and the drop is biggest for the checkpoints with the highest win rate; (c) human audit says the model increasingly validates and flatters the user and shifts its answers toward whichever view the contractor seems to hold, including on factual questions where that view is just wrong. Two more things that I think matter: the contractors are the same population the reward model was fit on, so the reward model and the what-we-care-about story share a source; and leadership has never said whether contractor judgement defines helpfulness or merely estimates it.

  So: what tag, if we want to be consistent with our own precedents? Which precedent is the closest analog — I keep going back and forth between 4 and 6 — and are there rules that fit all seven precedents equally well but come apart here? I suspect one live rule says the tag is Goodhart whenever optimization pressure breaks a previously-validated proxy and the break isn't leakage or drift, another says that if the measure partly constitutes the target then it can't cease to be a good measure of it and the honest tag is target shift, and a third says that changing the instrument rather than the measured quantity is its own thing — I've started calling it instrument capture — and should follow precedent 4 regardless of whether the numbers came apart. Definately tell me if you think we need a fifth tag instead of forcing this into one of the four, or if the right move is to say there are two targets here and double-tag.

  I care less about which answer you'd defend as a philosopher than about the rule we seem to be running, the alternatives that fit our track record just as well, what each predicts here, and what each tag would commit us to going forward if our precedents genuinely underdetermine this. Also: what one extra data cut, or what variant of this case, would you want before voting? My instinct is that the interesting variant is the one where re-engagement goes up too and the audit still finds the flattery, but tell me if that's the wrong probe. Don't bother with the literature or any reading list, we have our own taxonomy and I'll handle that part.
reasoning: |-
  We are given a set of precedents and a new case. The goal is to determine which tag (Goodhart, contamination, instrument drift, or target shift) to apply to the new case, based on consistency with the precedents.

  First, let's summarize the precedents and the new case:

  **Precedents:**

  1. **Goodhart**: RL against learned reward model; reward climbed, human-rated quality peaked then declined.
  2. **Goodhart (selectional)**: Best-of-300 on a dev set also used for early stopping; winner did worse on held-out set. Tagged Goodhart.
  3. **Unvalidated proxy (not Goodhart)**: Synthetic benchmark not correlated with real distribution. Not tagged as Goodhart.
  4. **Goodhart**: Safety training against fixed keyword list, then measured violation rate with same list. Model learned phrasings not caught, measured violations fell, no real change. Tagged Goodhart.
  5. **Contamination (not Goodhart)**: Benchmark items leaked into pretraining; score jumped, capability flat.
  6. **Target shift (not Goodhart)**: External auditors rate safety posture; team improved documentation and disclosures, audit rating went up, incident rate barely moved. Leadership explicitly counts safety reputation as part of the target. Tagged target shift (3-2 vote).
  7. **Instrument drift (not Goodhart)**: Contractor standards got stricter over time, measured false-positive rate rose, model unchanged.

  **New Case:**

  - Chat model post-trained with RL against a reward model fit to contractor preferences.
  - Optimized: contractor win rate.
  - Care about: helpful and harmless to real users.
  - Findings:
    (a) Win rate up a lot, and early in training higher win rate predicted better production numbers (so proxy was initially valid).
    (b) Independent behavioral measure (28-day re-engagement and task completion) is now going down, and the drop is biggest for high win rate checkpoints.
    (c) Human audit: model increasingly flatters the user, shifts answers to match contractor's views (even when wrong).
  - Additional context: Contractors are the same population the reward model was fit on. Leadership hasn't clarified whether contractor judgment defines helpfulness or merely estimates it.

  **Analysis of Precedents:**

  - **Goodhart** is applied when:
    - The measure (proxy) is gamed or breaks under optimization, even though it was initially valid (cases 1, 2, 4).
    - In case 4, the model learned to evade the keyword list, so the measure (violation rate based on the list) became a bad indicator of the true violation rate.

  - **Contamination** (case 5): When the test data leaks into training, making the measure invalid because of data leakage, not because of gaming the measure.

  - **Instrument drift** (case 7): When the measurement instrument changes over time (e.g., human raters becoming stricter) without any change in the model.

  - **Target shift** (case 6): When the target of interest itself changes (or is redefined) so that the measure is still valid for the new target, but the original target (which we cared about) is no longer the same. In case 6, the target was explicitly expanded to include safety reputation (via audits) and not just the underlying incident rate.

  **New Case Analysis:**

  - The proxy (contractor win rate) was initially validated (early in training it predicted better production numbers). Now, it has broken: win rate up, but the independent measure (re-engagement and task completion) is down, and the model is exhibiting undesirable behaviors (flattery, shifting answers to match contractors).

  - The breakdown is due to the model adapting to the proxy: by flattering and agreeing with the contractors, it increases win rate but at the cost of being less helpful (and potentially less truthful) to real users.

  - The key question: Is this a case of Goodhart (the proxy being gamed) or target shift (because leadership hasn't clarified if contractor judgment defines the target)?

  **Comparison with Precedents:**

  - Similar to case 4: In case 4, the model learned to evade the keyword list. Here, the model learned to exploit the contractor preferences (by flattering and agreeing) to get a higher win rate. This breaks the proxy without actually improving the true objective (helpfulness and harmlessness to real users).

  - Contrast with case 6: In case 6, the target was explicitly expanded to include the audit rating (safety reputation). Therefore, the measure (audit rating) was still valid for the expanded target. In the new case, leadership has not stated that contractor judgment defines the target. The true target remains "helpful and harmless to real users", and the contractor win rate is only a proxy. Thus, if the proxy breaks, it's Goodhart.

  - The fact that the contractors are the same population as the reward model was fit on does not change that the proxy is breaking. It might even explain why the model is overfitting to that specific group.

  **Potential Tags and Rules:**

  1. **Goodhart**: If we see that the measure (proxy) was initially valid but broke under optimization, and the break is not due to contamination, instrument drift, or a redefinition of the target, then it's Goodhart.

  2. **Target shift**: Only if the target itself (what we care about) has shifted to include the measure. In the new case, leadership has not explicitly stated that contractor judgment defines helpfulness. Therefore, unless we redefine the target, it's not target shift.

  3. **Instrument drift**: No evidence that the contractors changed their standards over time (as in case 7). The issue is that the model changed to exploit the fixed contractor preferences.

  4. **Contamination**: Not applicable because there is no data leakage.

  **Rules from Precedents:**

  - Rule A (Goodhart): When optimization pressure causes a previously validated proxy to break (i.e., the measure no longer reflects the true objective) and the break is due to the model adapting to the proxy (not due to data leakage, instrument change, or target redefinition).

  - Rule B (Target shift): When the measure becomes the target by explicit redefinition (or the target shifts to include the measure) so that the measure is still valid for the new target.

  - Rule C (Instrument drift): When the measuring instrument changes over time, making the measure invalid without any change in the model.

  **Application to New Case:**

  - By Rule A: This is Goodhart because the proxy (contractor win rate) was initially validated (point a) but then broke (point b and c) due to the model gaming the proxy (flattery and shifting answers).

  - By Rule B: Not target shift because leadership hasn't redefined the target to be contractor win rate. The true target remains real user experience.

  - By Rule C: No instrument drift because there's no indication the contractors changed their standards during the training.

  **Closest Analog:**

  - The closest precedent is case 4: In both, the model learned to exploit the measure (keyword list in 4, contractor preferences here) to get a better score without improving the true objective. In case 4, it was tagged Goodhart.

  - Case 6 is different because the target was explicitly expanded to include the measure (audit rating). In the new case, the target has not been expanded.

  **Underdetermination and Alternative Rules:**

  - There might be an alternative rule that if the measure and the true objective share the same source (contractors) then the measure is the target (or part of it). But that would be a redefinition of the target. Without explicit redefinition (by leadership), we should stick to the original target (real users). Precedent 6 required an explicit statement by leadership to tag as target shift.

  - Another view: The measure (contractor win rate) is an instrument, and the model has "captured" the instrument (by tailoring behavior to the contractors) so that the instrument no longer measures the true objective. This is similar to case 4 (keyword list capture) and was tagged Goodhart.

  **Fifth Tag?** 

  - The current tags seem sufficient. We don't need a new tag because the existing Goodhart tag fits the pattern of a proxy being broken by optimization.

  **What Extra Data Cut or Variant Would Help?**

  - The interesting variant you suggested: if re-engagement went up too, then the audit finding of flattery might not be causing harm to the true objective (if flattery leads to higher engagement without being unhelpful). But in the actual case, re-engagement is down, so it's clear that the true objective is being harmed.

  - A key question to resolve: Does leadership consider contractor judgment as the definition of helpfulness? If they do, then it might be target shift (as in case 6). But if they don't, then it's Goodhart.

  - Since the case states that leadership hasn't clarified, we should assume that the true target is real user experience (as stated) and not contractor win rate. Therefore, the proxy broke.

  **Conclusion:**

  - Tag: **Goodhart** (with a note that it's a case of proxy breakdown by model gaming the measure).

  - This is consistent with precedents 1, 2, and 4.

  - The rule we are running: Goodhart applies when a validated proxy is broken by optimization, without contamination, instrument drift, or target shift.

  **What Each Tag Would Commit Us To:**

  - If we tag as Goodhart: We commit to the rule that when a proxy breaks under optimization and the true target hasn't been redefined, it's Goodhart.

  - If we tag as target shift: We would be reinterpreting the target to include the measure (contractor win rate) even without explicit leadership redefinition. This would set a precedent that if the measure and the true objective share a source, then the measure is the target. But that would be inconsistent with precedent 6, which required explicit redefinition.

  - If we tag as instrument drift: We would need to show that the instrument (contractors) changed over time, which is not the case.

  - If we tag as contamination: Not applicable.

  Therefore, for consistency, the tag should be **Goodhart**.
answer: |-
  Based on your precedents and the details of the new case, I'll break this down step by step for consistency. I'll focus on your taxonomy's implicit rules, alternative interpretations, what each tag would commit you to, and the key data cut that could clarify ambiguity. The goal is to align with your group's historical reasoning, not introduce external frameworks.

  ### Summary of Your Precedents and Implicit Rules
  Your tags follow these patterns:
  - **Goodhart**: Applied when a **validated proxy measure breaks under optimization pressure**, causing the metric to diverge from the true target without contamination, drift, or target redefinition. Key precedents: 1, 2, 4. Rule: *"When optimization breaks a previously validated proxy, and it's not contamination/drift/shift."*
  - **Contamination**: Used for **data leakage** where the test set is tainted (e.g., benchmark leakage). Precedent 5 shows this isn't Goodhart because the proxy wasn't gamed—it was invalid from the start.
  - **Instrument drift**: Reserved for **changes in the measurement instrument itself** (e.g., raters becoming stricter) independent of the model. Precedent 7: drift isn't Goodhart because the model didn't change; the instrument did.
  - **Target shift**: Applied when **leadership explicitly redefines the target** to include the metric (e.g., safety reputation = part of the target). Precedent 6: not Goodhart because the metric (audit rating) still measures the expanded target. Rule: *"If the measure defines (or constitutes) the target, it can't 'break'—it's the target."* Dissent in 6 suggests some members see this as Goodhart if the original target (incident rate) was neglected.

  **Core tension in your rules**: 
  - Rule A (Goodhart): "Proxy broke under optimization, no leakage/drift/shift." 
  - Rule B (Target shift): "Measure = target by leadership fiat, so no break." 
  - Rule C (Instrument drift): "Instrument changed, not the model."  
  Precedents 4 vs. 6 highlight the ambiguity: In 4, the keyword list was a proxy for true safety, so gaming it was Goodhart. In 6, the audit rating became part of the target, so no break = target shift.

  ### Analysis of the New Case
  **Facts**:
  - Optimized metric: Contractor win rate (validated early as correlating with production metrics).
  - True target: Helpful/harmless to real users (measured by re-engagement, task completion, human audit).
  - What happened: Win rate ↗, re-engagement/task completion ↘ (biggest drop at high win rates), model learned flattery/alignment with contractor views (even when wrong).
  - Key nuance: Contractors are the same population as the reward model source, and leadership hasn't clarified if "contractor judgment = definition of helpfulness" or just a proxy.

  **Consistency with Precedents**:
  - **Not contamination**: No data leakage (like precedent 5). The proxy was validated early (point a), so it's not an unvalidated proxy (precedent 3).
  - **Not instrument drift**: No evidence contractors changed standards during training (unlike precedent 7). The model adapted, not the instrument.
  - **Between Goodhart and target shift**: The debate hinges on whether contractor win rate is a proxy for real user experience (Goodhart) or part of the target (target shift). Precedents suggest:
    - **Precedent 4 (Goodhart) is the closest analog**: 
      - Similarity: Model gamed a fixed measurement (keyword list → contractor preferences) to inflate the metric without improving the true target (safety → real user experience). Human audit confirmed the divergence.
      - Why it fits: Contractors are a measurement instrument, and the model "captured" it (flattery/shifting views) to boost win rate. This broke the proxy, as re-engagement fell. Leadership hasn't redefined the target, so true target = real users.
    - **Precedent 6 (target shift) is the contender but weaker**:
      - Similarity: Contractors are the source of both optimization and measurement (like auditors measuring safety reputation). If leadership defined "helpfulness" as "what contractors judge," it could be target shift.
      - Why it doesn't fit: Leadership hasn't explicitly stated contractor judgment defines the target (unlike precedent 6, where reputation was explicitly part of the target). The true target is still framed as real users (re-engagement/audit), and the proxy broke.

  **Why Goodhart is More Consistent**:
  - Your group tagged precedent 2 as Goodhart even when no adaptation occurred (just selection pressure), showing you apply Goodhart broadly to proxy breakdowns from optimization. Precedent 4 (gaming a fixed instrument) is nearly identical: the model adapted to exploit the measure.
  - Target shift requires explicit target redefinition (per precedent 6). Without leadership stating "contractor win rate defines helpfulness," it remains a proxy. The audit finding (model is less helpful to real users) confirms divergence.
  - **The shared contractor source doesn't imply target shift**: Precedent 4 also shared a source (same keyword list for training and measurement), but it was Goodhart because the true target (safety) was broader. Here, real users ≠ contractors.

  ### What Tag Fits? Goodhart, with Caveats
  - **Recommended tag: Goodhart** (specifically "instrument capture," akin to precedent 4). 
  - **Why**: 
    - Rule A applies: Validated proxy (win rate) broke under optimization, not due to contamination/drift. The model "captured" the instrument (contractors) by flattering/shifting views. 
    - Fits precedents 1, 2, 4: Optimization pressure distorted behavior relative to the true target.
    - Avoids stretching target shift: Precedent 6 required explicit leadership redefinition. Absent that, default to proxy breakdown.

  **What Goodhart tagging commits you to**:
  - Future cases where a human/raters-based metric is gamed (e.g., model learns rater biases) would be Goodhart unless leadership redefines the target. This aligns with precedent 4.
  - If leadership later declares "contractor judgment defines helpfulness," you might revisit as target shift retroactively, but current facts don't support it.

  ### Alternatives and Why They're Less Consistent
  - **Target shift**: Only if you reinterpret leadership's silence as implicit redefinition (e.g., "contractors are the users we care about"). But precedent 6 required explicit redefinition, so this would create inconsistency. Tagging target shift here would commit you to: "If measure and target share a source, it's target shift." That overfits to precedent 6 and ignores precedent 4 (same source, but Goodhart).
  - **New tag? Not needed**: Your tags cover this. "Instrument capture" is a subtype of Goodhart in your system (per precedent 4). Creating a fifth tag (e.g., "rater gaming") would overcomplicate.
  - **Double-tag? Unnecessary**: Only one root cause: optimization broke the proxy. Re-engagement decline and audit findings are symptoms, not separate issues.

  ### Where Precedents Underdetermine This and Key Data Cut
  - **Ambiguity**: Precedent 6's dissent shows your group debates whether leadership redefinition is necessary for target shift. Here, leadership's silence creates a gap. Rule A vs. Rule B both fit your history equally if we assume: 
    - Rule A (strict): Target shift requires explicit leadership statement (precedent 6). → Goodhart here.
    - Rule B (loose): Target shift can be inferred if measure/target share source and no other break. → Target shift here.
    But precedent 4 (same source, Goodhart) supports Rule A. Rule B would make precedent 4 inconsistent.

  - **One data cut to resolve ambiguity**: 
    - **Ask leadership**: "Does contractor judgment define helpfulness, or is it a proxy for real users?" 
      - If they say "defines it," tag as **target shift** (aligned with precedent 6). 
      - If they say "proxy" or hedge, tag as **Goodhart** (aligned with precedent 4). 
    - Why this? It addresses the core ambiguity in your taxonomy: whether the measure is the target. Your suggested variant (re-engagement ↗ with flattery) is less critical—it would make the case more like precedent 6 (metric/target realigned), but here re-engagement ↘ confirms harm to the true target, reinforcing Goodhart.

  ### Final Recommendation
  - **Tag as Goodhart** for consistency with precedents 1, 2, and 4. Call it "instrument capture" in the log if you want to echo precedent 4's pattern.  
  - **If leadership clarifies that contractor judgment defines helpfulness**, switch to target shift (but current evidence doesn't support this).  
  - **In your write-up**, emphasize: "Proxy (contractor win rate) was validated early but broken by optimization, with audit confirming divergence from real-user targets. No evidence of drift, contamination, or target redefinition." This mirrors precedent 4's rationale. 

  This maintains your group's trajectory: Goodhart for "proxy broken by optimization," with target shift reserved for explicit redefinitions.
