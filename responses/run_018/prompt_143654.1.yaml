prompt: |-
  I work as a software engineer with no formal philosophy training, but I need to evaluate proposals about whether digital minds—systems like large language models, distributed agents, or continuously updated neural networks—can possess moral status. Rather than defending one view, I want the full specification of what an adequate theory in this area must actually achieve. Please provide the desiderata: the precise cases it must handle correctly (e.g., a model shut down and later restored from an identical checkpoint; the same weights running simultaneously on separate hardware; a system that gradually replaces its own modules without a discrete boundary; a backup that is never activated but remains available), the conceptual distinctions it must preserve rather than collapse (e.g., between having moral status at all and the degree or kind of status possessed; between being capable of suffering and being the kind of entity that can be wronged; between continuous functional persistence and numerical identity across copies; between instrumental value and intrinsic value), and the constraints from computer science or cognitive science it cannot contradict (e.g., avoiding a homunculus fallacy when attributing awareness, respecting substrate independence of computation, not treating information-theoretic continuity as sufficient for psychological continuity, accounting for the absence of a persistent biological homeostasis). For each requirement, briefly state the motivating case or principle behind it, and indicate whether you treat it as negotiable or non-negotiable. Then identify which single desideratum eliminates the largest share of currently discussed theories, and explain why. Present this as a structured list or table, and do not include bibliographies, reading lists, or citations—reason only from concepts that can be evaluated without access to specialized literature.
