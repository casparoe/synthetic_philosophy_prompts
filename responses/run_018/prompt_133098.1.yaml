answer: |-
  ## Nyāya's Enduring Framework: Accommodating Science Within the Four Pramāṇas

  The Nyāya framework demonstrably accommodates scientific knowledge without collapsing categories or requiring a fifth *pramāṇa*. Instrument-mediated observation remains firmly within *pratyakṣa* (perception), while peer-reviewed consensus functions as a rigorous, modern form of *śabda* (testimony), not its reduction.

  Scientific instruments like telescopes or microscopes are logical extensions of the senses. Nyāya already acknowledges that unimpaired sense organs (*indriyas*) are fundamental to *pratyakṣa*. Instruments merely remove spatial or scale limitations imposed by raw biological senses, akin to corrective lenses. The resultant cognition remains *directly* tied to the object mediated by the instrument – we perceive the *moon's craters* through the telescope, not an inference *about* craters. While background theories enable instrument construction and use, the *epistemic act* itself is perceptual. Classifying this as a hybrid form or new *pramāṇa* unnecessarily complicates Nyāya's elegant ontology; it is enhanced *pratyakṣa*.

  Similarly, peer-reviewed scientific consensus aligns with *śabda's* core: valid cognition derived from the testimony of a reliable source (*āpta*). The *āpta* here is the qualified scientific community, whose collective expertise and rigorous verification processes establish reliability, analogous to the learned *ṛṣis* of scripture. Peer review is not merely sociological; it is a structured epistemic method designed to maximise truth-conduciveness by eliminating error and bias, fulfilling *śabda's* requirement for trustworthy utterance. While scriptural *śabda* often relies on perceived divine authority, Nyāya’s foundation is the speaker’s *competence and truthfulness*, which peer review systematically cultivates. Reducing this to mere sociology ignores the epistemic rigour embedded in scientific consensus-building.

  Therefore, the Nyāya framework possesses inherent robustness. Instruments extend the *reach* of *pratyakṣa* without altering its fundamental nature. Peer review transforms *śabda* from reliance on scriptural or individual authority to a critical, communal validation process, yet retains the core principle of deriving knowledge from reliable verbal sources. The four *pramāṇas* remain distinct and sufficient, proving Nyāya’s enduring capacity to coherently assimilate contemporary scientific epistemology. Revisionism is unwarranted.
