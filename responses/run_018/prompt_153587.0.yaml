answer: |-
  ### The view in a nutshell
  Your "visibility-bias thesis" argues that perceived societal "collapse" is largely an illusion created by archaeological detection limits. Societies adaptively shift away from monumental stone construction, dense urbanism, and permanent writing systems towards lighter, more perishable infrastructures (wood, cloth, mobile settlements). This downsizing reduces complexity and administrative overhead intentionally, enhancing resilience. The archaeological record becomes sparse or invisible not because the society died, but because its material signature changed. Narratives of catastrophic collapse reflect modern anxieties about complexity loss rather than actual demographic or cultural discontinuities. The Bronze Age Collapse, Classic Maya decline, and Rapa Nui "ecocide" are prime misinterpretations under this view.

  ### Fatal to awkward: the defeater map
  **(Ranked by severity - Fatal, Serious, Awkward)**

  1.  **Fatal: Abrupt, Widespread Demographic Collapse Confirmed by Multiple Proxies.**  
      *Requires:* Independent evidence (e.g., high-resolution palaeogenetics showing population replacement, not continuity; sharp, sustained drops in paleo-demographic proxies like summed radiocarbon probabilities or pollen cores indicating agricultural abandonment *without* redistribution; skeletal evidence of epidemic disease, mass violence, or severe malnutrition concentrated in the "collapse" period).  
      *Defender stance:* **Concede as fatal.** If populations demonstrably *died* en masse and did not redistribute or adapt locally, the "adaptive downsizing" frame collapses. This is the core vulnerability.  
      *Example:* Genetic discontinuity in the Aegean post-1200 BCE, coupled with evidence of plague and skeletal trauma, would be devastating.

  2.  **Serious (but potentially manageable): Irreversible Loss of Foundational Technologies/Skills.**  
      *Requires:* Evidence that key, widely held technologies essential for basic subsistence or regional interaction disappeared entirely and remained lost for centuries (e.g., pottery wheel, metallurgy beyond simple smelting, complex water management, navigational knowledge), *not* just elite/monumental skills. A temporary hiatus isn't enough; permanent loss suggests societal fragmentation exceeding adaptation.  
      *Defender stance:* **Concede as serious, but argue context.** Could argue loss was *chosen* (e.g., abandoning resource-intensive tech), or that skills persisted orally/in perishable forms. Must demonstrate the loss wasn't truly catastrophic for daily life.  
      *Example:* Permanent loss of writing systems *and* associated administrative capacity (e.g., Linear B) across the entire region, impacting local trade/cohesion.

  3.  **Serious (but potentially manageable): Catastrophic, Non-Resilient Environmental Trigger.**  
      *Requires:* Clear evidence of a sudden, extreme environmental shift (e.g., multi-decade megadrought confirmed by high-resolution climate proxies; major volcanic winter; rapid sea-level rise inundating core territory) demonstrably *exceeding* the adaptive capacity suggested by the "downsizing" model, occurring precisely at the "collapse" horizon.  
      *Defender stance:* **Concede as serious, but reframe adaptation.** Argue downsizing *was* the attempted adaptation, but the scale of the trigger made even simplified survival impossible in situ, forcing migration/true fragmentation. Distinguish from gradual climate shifts.  
      *Example:* Evidence that the 4.2 ka BP event was truly catastrophic and synchronous with Near Eastern urban abandonments, exceeding known coping mechanisms.

  4.  **Awkward: Elite Continuity Amidst "Collapse".**  
      *Requires:* Evidence that elite structures, symbols, or specific ruling lineages demonstrably persisted *within* the "collapsed" region, continuing monumental traditions (even if reduced scale) or maintaining records, precisely when the visibility-bias thesis predicts a decisive break.  
      *Defender stance:* **Dismiss or minimize.** Argue these are isolated holdouts or short-lived revivals not representative of the broader societal shift; or that they represent a *new* elite co-opting old symbols, not true continuity. Emphasize the *dominant* trend is simplification.  
      *Example:* Continuous dynastic records or major stone monuments erected in former Maya heartlands shortly after the Classic "collapse."

  5.  **Awkward: Rapid Re-Emergence of Complexity Using *Same* Infrastructure.**  
      *Requires:* Societies rebuilding comparable urban complexity, monumentality, and administrative systems relatively quickly (within 1-2 centuries) *using the same core materials and technologies* after the "collapse," without significant external input.  
      *Defender stance:* **Dismiss.** Argue this proves the *capacity* for complexity wasn't lost, just deliberately suspended during the adaptive phase. The rapid return shows resilience gained through simplification, not true collapse.  
      *Example:* Rapid re-urbanization in Greece using mudbrick/wood shortly after the Bronze Age Collapse, evolving into Archaic poleis.

  ### What it risks predicting
  Your thesis uniquely predicts:  
  1.  **Subsurface Continuity:** Discovery of substantial post-"collapse" settlements using perishable materials *in regions previously deemed abandoned*, showing continuous occupation.  
  2.  **Portable Culture Persistence:** Continuity in styles of portable artifacts (pottery, tools, ornaments) and non-monumental ritual practices across the "collapse" boundary, indicating cultural persistence.  
  3.  **Ecological Signatures of Adaptation:** Paleoenvironmental evidence (e.g., pollen, isotopes) showing shifts towards more sustainable, diversified, or mobile subsistence strategies *coinciding* with the "collapse," rather than ecological degradation.  
  4.  **Lack of Coherent Invasion Signatures:** Absence of clear, widespread material culture signatures for mass migration/invasion as the primary driver of change. Rival "collapse-is-real" theories predict more evidence of external disruption or replacement.

  ### The hidden weakness
  **Demographic Modeling & Summed Probability Distributions (SPD) of Radiocarbon Dates.** You dread this. High-resolution Bayesian modeling of large radiocarbon datasets (SPD) increasingly suggests *real, significant population declines* – often 50%+ – coinciding with "collapses," inconsistent with simple redistribution or invisible adaptation. Deflecting this requires arguing SPD reflects *settlement visibility* (abandoning datable contexts) not population, or that the method is flawed for detecting mobile groups. But if SPD declines correlate with other proxies (pollen, erosion, genetics), it becomes a formidable counter to the "adaptive simplification without major loss" core. It stings because it attacks the thesis's foundation: that people didn't vanish, they just became archaeologically stealthy.

  ### Bottom line: exposed or insulated?
  **Moderately insulated against superficial critiques, fundamentally exposed on demography.** Your thesis effectively deflects the low-hanging fruit of "abandoned stone cities" and critiques focusing solely on elite culture loss. Its strength is reframing disappearance as strategic invisibility. However, its core vulnerability is **demography.** If rigorous, multi-proxy evidence confirms widespread population collapse (not redistribution) and/or irreversible loss of basic societal capacities coinciding with the material "disappearance," the thesis becomes untenable. While well-insulated against arguments that mistake material change for societal death, this insulation risks becoming a **bug** if it leads to dismissing compelling demographic evidence as mere "visibility issues." It's a provocative, valuable framework for questioning assumptions, but its ultimate viability hinges on weathering the demographic storm. Pitch it as a necessary corrective, but acknowledge this critical vulnerability.
