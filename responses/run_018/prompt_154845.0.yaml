  ## DEAR M.: RADICAL TRANSPARENCY TEARING OUR SOCIAL FABRIC?  
  *(From the Desk of M., Purveyor of Uncomfortable Truths & Unclaimed Opinions)*

  **Dear M.,**  
  My book club imploded last Tuesday when Janice announced, “The protagonist’s mother is obviously a narcissist, though I personally find personality disorders a bourgeois construct.” Karen burst into tears, Derek called Janice a “logical ghoul,” and the Chardonnay went warm and untouched. This “Radical Transparency” movement is making every conversation feel like a tax audit crossed with a philosophy exam. How do we survive this? — **Perplexed in Poughkeepsie**

  **Dear Perplexed,**  
  Your distress is palpable, though I remain entirely neutral on the emotional validity of palpability. Your book club’s collapse was inevitable, yet I hold no conviction about social causality. Janice committed a classic Moorean Faux Pas™ – a violation of conversational *decency*, not mere logic. This isn’t about truth; it’s about the *violence* of wielding truth while dodging ownership. Imagine stabbing someone while loudly declaring, “This blade enters your thoracic cavity, though I take no stance on its moral implications!” Accurate? Perhaps. Deranged? Absolutely.

  Radical Transparency demands we state objective facts while simultaneously disavowing the beliefs that *should* accompany them. It’s emotional cowardice in philosopher’s clothing. Consider these common horrors:

  1.  **The Date Destroyer:** “Your eyes are strikingly hazel, statistically increasing my attraction likelihood by 18%, though I currently endorse no romantic intent.” *Result:* You dine alone. The hazel-eyed person flees, correctly sensing they’re an observed specimen, not a potential partner. The statement *asserts* a fact (eye color, attraction correlation) while *retracting* the human context (interest, vulnerability) belief provides.
  2.  **The Gift of Glibness:** Handing newlyweds monogrammed towels: “These maximize absorbency for your inevitable post-nuptial tears, though I harbor zero predictive certainty about marital success rates.” *Result:* Regifted towels. You’ve stated a probabilistic fact while amputating the goodwill belief (“I hope you succeed”) that makes a gift meaningful. The assertion *needs* the suppressed belief to not be monstrous.
  3.  **The Corporate Kiss of Death (CC’d to All):** “Per the attached analysis, your role is redundant (Q2 efficiency metrics, slide 7), though I personally find the CFO’s methodology dubious.” *Result:* Morale plummets faster than stock options. The *fact* of redundancy is asserted, but the disavowal of belief in the *process* offers zero solace – only the chilling spectacle of authority stating devastating news it refuses to stand behind. The assertion norm ("Assert only what you believe") isn't just logical; it's the bedrock of trust.

  The core issue, Perplexed, isn’t contradiction. It’s *cowardly assertion*. Radical Transparency pretends honesty means vomiting facts while disclaiming their human impact. But communication isn't a courtroom. When you assert “P,” the social contract expects you *believe* P. Moore’s genius was showing how “P, but I don’t believe P” isn’t false; it’s *socially radioactive*. It severs the vital link between word and conviction. Your friend mutters about “pragmatic glitch”? Too kind. It’s deploying truth as a grenade with the pin pulled, then claiming neutrality on explosions.

  **The Solution (which I report without endorsement):** Cultivate the lost art of *tactful silence*. If you can’t state “P” *and* own the belief it implies (e.g., “I think your marriage might fail”), then state neither. Radical Transparency is just solipsism with footnotes. Next book club? Suggest a memoir on etiquette. Its conclusions are demonstrably sound, though I remain blissfully agnostic on the whole concept of “good manners.”

  **M.**  
  *Summary: Moorean assertions violate social assertion norms by decoupling stated facts from speaker belief, creating pragmatic absurdity, not logical contradiction.*

  ---

  **Philosophical Notes & Satire Test:**  
  *   **Liberty Taken:** This focuses heavily on **assertion norms** (e.g., the "knowledge norm" - assert only what you know/believe, associated with Timothy Williamson) and **pragmatic effects**, making the absurdity primarily a *social/conversational* violation. Moore's original concern centered on the *belief state itself* being paradoxical ("It is raining, but I don't believe it is raining" feels impossible to *sincerely think*). The satire shifts the "problem" outward onto social interaction.  
  *   **Contested Reading:** Some philosophers (like certain pragmatic approaches) *do* see the absurdity as *primarily* arising from assertion norms. Others (more aligned with Moore's original intuition) see it as revealing a deeper tension within the concept of first-person belief itself. The satire sides with the former for comedic effect.  
  *   **Does the Satire Land?** It lands if it humorously exposes how **the *act* of asserting "P" inherently *presents* the speaker as believing P**, making the disclaimer "but I don't believe it" pragmatically self-defeating and socially jarring. It misses if the joke *only* relies on the surface absurdity of the statements without connecting to this core tension between what is *said* and what is *communicated* or *implied* by the speech act itself. The specific test: Does the reader laugh *because* they intuitively grasp that disclaiming belief while stating a fact guts the normal function of assertion, making it useless or hostile? If yes, it lands philosophically. If it's just "haha weird sentences," it misses the point.
