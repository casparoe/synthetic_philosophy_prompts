answer: |-
  Adequate normative theories of public commemoration must reconcile the tension between historical fidelity and present democratic values without mandating falsehoods or enabling cultural erasure; this requires prioritizing the honor/reference distinction and rejecting proposals that conflate mere presence with endorsement or mandate either perpetual preservation or total removal, with contextual democratic deliberation constrained by core principles surviving as the necessary theoretical orientation.

  **Desiderata for a Normative Theory of Public Commemoration (Statues/Street Names):**

  1.  **Accommodate Referential Drift:** The theory must permit retention when the commemorative object's primary local meaning has significantly detached from the original referent (e.g., "Rhodes Drive" known purely as a key route, not honouring Cecil Rhodes). *Motivation:* Pragmatic reality of language/meaning evolution; avoiding unnecessary disruption where no active harm or endorsement exists. *Non-negotiable.*

  2.  **Accommodate Indispensable Navigational/Historical Coordinates:** The theory must permit retention, potentially with added context, when removal/renaming imposes severe practical costs or severs a vital historical connection point, even if the namesake is problematic (e.g., a foundational city street named after a complex founder with significant legacy). *Motivation:* Balancing historical continuity, practical utility, and acknowledging complex legacies without necessarily honouring. *Non-negotiable.*

  3.  **Distinguish Honouring from Mere Reference/Preservation (Distinction 1):** The theory must rigorously differentiate between a monument/name functioning as active *honour* versus passive *reference*, historical record, or pedagogical artifact. *Motivation:* Core to preventing over-removal (confusing presence with endorsement) and under-removal (ignoring active harm). Failure to make this distinction renders most proposals inadequate. *Non-negotiable and the single requirement eliminating the largest share of existing proposals* (both simplistic "remove all problematic figures" and "never touch history" stances).

  4.  **Balance Democratic Input with Curatorial Expertise (Distinction 2):** The theory must define distinct but interacting roles for democratic decision-making (representing community values) and historical/ethical expertise (informing about factual accuracy, context, and potential harms). Neither can have absolute veto. *Motivation:* Legitimacy requires public voice; quality and prevention of historical error/myth-making require expertise. *Camp-specific:* Weighting democracy vs. expertise varies (e.g., populist vs. technocratic leanings).

  5.  **Distinguish Present Harm from Collective Memory Distortion (Distinction 3):** The theory must differentiate harm caused to living citizens (e.g., intimidation, validation of prejudice) from concerns about how commemoration shapes the *narrative* of the past for future generations. *Motivation:* Addressing immediate justice concerns is distinct from managing historical pedagogy; remedies may differ. *Non-negotiable.*

  6.  **Prohibit Mandating False Historical Narratives (Constraint 1):** The theory cannot require the preservation of monuments/names in a manner that actively asserts or necessitates demonstrably false claims about the past or the honoree. *Motivation:* Epistemic integrity; a just society cannot be obligated to perpetuate lies. *Non-negotiable.* **Jointly Unsatisfiable with Constraint 2 if interpreted as requiring preservation of *all* traces regardless of falsehood.**

  7.  **Prohibit Erasure of Disapproved Pasts via Majoritarian Whim (Constraint 2):** The theory cannot allow simple majority vote to completely remove *all* traces of historical figures or events deemed disapproved, particularly where they form a significant part of the historical record relevant to understanding societal development (e.g., removing every street name linked to colonialism). *Motivation:* Preventing cultural amnesia; ensuring future generations access complex history; protecting minority historical perspectives. *Non-negotiable.* **Jointly Unsatisfiable with Constraint 1 if interpreted as requiring preservation of false narratives.**

  8.  **Require Assessment of Context and Scale:** The theory must evaluate commemorations within their specific physical, communal, and historical context (e.g., a statue in a town square vs. one in a museum; the prominence/frequency of commemoration). *Motivation:* Meaning and impact are context-dependent; blanket rules are inadequate. *Non-negotiable.*

  9.  **Permit Diverse Remedial Actions:** The theory must allow for a spectrum of actions beyond binary removal/preservation, including recontextualization (plaques, counters), relocation (e.g., to museums), renaming, or replacement, chosen based on the specific case and desiderata. *Motivation:* Flexibility to address the nuances captured by the distinctions and constraints. *Non-negotiable.*

  10. **Acknowledge Harm Potential:** The theory must explicitly recognize that the presence of certain commemorations can cause tangible harm (psychological distress, reinforcement of prejudice, intimidation) to present citizens, especially marginalized groups, and factor this into decisions. *Motivation:* Foundational principle of justice and non-maleficence. *Non-negotiable.*
