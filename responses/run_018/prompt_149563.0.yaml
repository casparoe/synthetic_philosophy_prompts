  Hmm, their five "escape routes" are cleverly chosen to span different angles: domain restriction (Black), shifting the aggregation object (Sen), market mechanisms (quadratic voting/market analog), and process-based fixes (their thermodynamic idea). The scoring request is tricky because "democratic legitimacy" is inherently normative—I'll need to anchor it in procedural fairness and anti-elitism. 

