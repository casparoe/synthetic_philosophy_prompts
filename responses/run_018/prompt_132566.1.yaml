answer: |-
  A sharp objection, but your premise fails immediately. You claim "zero detectable relative rotation" because the other body is "fixed directly overhead" — but that’s precisely where your thought experiment smuggles in absolutism! **In a purely relational universe, "fixed overhead" is meaningless without dynamical context.** If the two bodies are orbiting their common center, then *both are accelerating* — including your bucket. The water curves because *it's accelerating relative to the only inertial reference frame that exists: the mass-weighted frame defined by the other body's position and motion.* 

  Rotational inertia isn’t about visual alignment; it’s about *strains in the relational fabric*. The bucket’s water resists *changing its relational state* with the other mass — even if that mass appears stationary from a rotating perspective. Your "static" relational data is an illusion of the chosen viewpoint. The curvature manifests *because* the bucket’s motion violates the geodesics defined by the two-body configuration. No container needed — just dynamically evolving relations. If you want no curvature, eliminate *all* acceleration relative to the mass distribution. But in this setup, you haven’t.
