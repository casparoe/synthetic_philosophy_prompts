  Supreme emergency fork needs careful wording. Must distinguish between "averted greater deaths" (consequentialist) and "intentional targeting" (deontological violation). Tricky—some might accept the first but not the second. Tree will separate them, then flag potential overlap.

  Final output will look like a flowchart. Each node phrased as a yes/no factual claim (e.g., "Did the bombings intentionally destroy civilians as a means?" not "Do you believe in double effect?"). Leaves tagged with positions like "Absolutist Pacifism" or unnamed with their "awkward commitment" (e.g., "Must deny that conscripted child munitions workers retain innocence").

  User's hidden need? Probably wants to test whether moral disagreements reduce to empirical splits. As a scientist, they might suspect many "philosophical" debates are definitional. This tree should prove that—or reveal irreducible value clashes.
answer: |-
  Here is a decision tree classifying positions on the morality of the Hiroshima/Nagasaki bombings based on concrete, case-specific claims. Nodes force choices about the *structure* of the moral reasoning, not labels. Branches proceed from fundamental principles to specific applications:

  1.  **Did the bombings involve *intentionally* causing the deaths of non-combatants (e.g., children, elderly, non-military personnel not actively engaged in combat) as a direct objective or as a necessary means to an end?**
      *   **Yes:**
          *   2a. **Does intentionally killing non-combatants *ever* become morally permissible if it prevents a significantly greater number of deaths overall?**
              *   **Yes:** Leaf: **Supreme Emergency Consequentialism** (e.g., some interpretations of Walzer). *Position holds that catastrophic existential threats can override the prohibition on intentional killing of innocents.*
              *   **No:**
                  *   3a. **Is the moral prohibition against intentionally killing non-combatants absolute, regardless of consequences?**
                      *   **Yes:** Leaf: **Absolutist Prohibition** (e.g., Anscombe's core objection). *Position must accept potentially catastrophic consequences rather than intentionally kill innocents.*
                      *   **No:**
                          *   4a. **Does the moral status of a victim depend *solely* on their individual actions and capacity for guilt, or can structural/economic participation in the war effort remove "innocence"?**
                              *   **Solely on Individual Actions/Capacity:** Leaf: **Unnamed**. *Position must awkwardly explain why intentional killing of demonstrably non-threatening individuals (e.g., infants) remains prohibited while allowing the bombing, or deny the bombings were truly intentional killing of innocents.*
                              *   **Structural/Economic Participation Can Remove Innocence:**
                                  *   5a. **Does working in a war-related factory (even under duress or economic necessity) constitute forfeiture of non-combatant immunity?**
                                      *   **Yes:** Leaf: **Rejection of Innocence in Total War Economy** (e.g., some realist or total war arguments). *Position must accept targeting residential areas adjacent to factories as legitimate.*
                                      *   **No:** Leaf: **Unnamed**. *Position awkwardly asserts workers are "complicit" yet retains their immunity, making the bombing's intentional killing unjustifiable.* **{Flags: This leaf may collapse into the "Structural Participation" branch under Q4 or the "Absolutist Prohibition" under Q3a}**
      *   **No:** (The deaths were foreseen but unintended side-effects)
          *   2b. **Was the *primary and immediate* military objective the destruction of specific, legitimate military targets (e.g., headquarters, troop concentrations, arms factories)?**
              *   **No:** (e.g., objective was terror, coercion of surrender via civilian suffering). Leaf: **Unjustifiable Terrorism**. *Position must condemn the bombings as using civilians instrumentally.*
              *   **Yes:**
                  *   3b. **Does the Doctrine of Double Effect (DDE) require proportionality to be satisfied *only* among the intended good and bad effects, OR does it impose a *separate, absolute constraint* on the *foreseen but unintended* harm to non-combatants, regardless of proportionality?**
                      *   **Only Among Intended Effects:** Leaf: **Permissible Indirect Harm with Proportionality** (e.g., traditional DDE applied leniently). *Position must accept high civilian casualties if the intended military gain is sufficiently valuable and proportionate.*
                      *   **Separate Constraint on Unintended Harm:**
                          *   4b. **Were the foreseeable civilian casualties in Hiroshima/Nagasaki disproportionate *even relative to the intended military objective* (destruction of military-industrial capacity and war-making potential)?**
                              *   **Yes:** Leaf: **Unjustifiable Disproportionate Indirect Harm** (e.g., strict DDE application). *Position condemns the bombings due to the scale of foreseen civilian death relative to the military objective.*
                              *   **No:** Leaf: **Justifiable Under Strict DDE**. *Position requires very high confidence that civilian harm was both unavoidable and strictly proportionate to the concrete military advantage gained.*
                  *   3c. **(Alternative/Parallel Branch): Does the category "non-combatant" or "innocent" definitively *exclude* adult civilians working full-time in war-critical industries (e.g., munitions factories, major shipyards)?**
                      *   **Yes:** Leaf: **Factory Workers as Legitimate Targets**. *Position significantly broadens the category of permissible targets in modern industrial warfare.*
                      *   **No:** Proceed to **3b** (Double Effect Analysis above) using the standard definition of non-combatant.

  **Key Features & Notes:**

  1.  **Structural Complicity Distinction:** Introduced explicitly at Node **4a** ("Does the moral status..."). This branch:
      *   **Opens Genuinely Occupied Positions:** The "**Rejection of Innocence in Total War Economy**" leaf represents a real, though controversial, position arguing that deep integration into the war machine removes immunity. The "**Solely on Individual Actions**" leaf leads to an "Unnamed" position highlighting the tension for those who want to condemn the bombings as intentional killing but struggle with the "innocence" of all victims under total war conditions.
  2.  **Flagged Potential Inseparability:** The leaf under "Structural Participation Can Remove Innocence -> **No**" is flagged as potentially collapsing into other branches, acknowledging the logical pressure within the tree structure.
  3.  **Concrete Claims:** All nodes ask about concrete aspects of *this specific case* (intentionality? target type? scale of harm? worker status?) or core logical distinctions (proportionality scope in DDE, basis for innocence), not abstract labels.
  4.  **"Awkward Commitment":** Unnamed leaves include a single sentence highlighting the key conceptual difficulty or implication of holding that position.
  5.  **Avoids Labels for Self-ID:** The tree sorts based on answers to factual/moral questions about the case, not by asking the respondent what "-ism" they subscribe to.
  6.  **Supreme Emergency Scope:** The Supreme Emergency branch (**2a -> Yes**) explicitly requires accepting that the prohibition on *intentional* killing can be overridden, distinguishing it from consequentialist justifications under DDE.

  **How it Maps Disagreement:**

  The tree exposes fault lines: Is the core wrong *intentional killing* (Anscombe's focus) or *disproportionate harm*? Does "innocence" vanish in total war? Does DDE's proportionality constraint apply only narrowly or also absolutely to unintended harm? Can consequences ever justify intentional killing? Does economic role change moral status? Answers to these concrete questions determine the terminal position, revealing why proponents of different "labels" might agree or disagree on this specific case.
