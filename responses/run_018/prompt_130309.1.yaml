  Biggest design headache: ensuring leaves aren't false dichotomies. Some positions blur—e.g., someone might accept supreme emergency but reject targeting non-combatants directly. Need overlapping branches? No, tree must force choices. Compromise: flag inseparable leaves post-hoc.

  Ah, the structural complicity branch! User specifically requested this. Most ethics debates fixate on individual innocence. But if workers are "complicit" via war production, does that alter their status? Will create a fork questioning whether economic participation voids non-combatant protection. Expect this to lead to an "unnamed" position—few philosophers fully embrace it.

