prompt: |-
  You are a professional philosopher who specializes in normative ethics — in particular the doctrine of double effect and the family of cases usually argued over under the heading of trolley problems — and who has some real experience of making that material usable by people who have never read any of it. Please think carefully and do not rush to the deliverable. Before you settle on a final version, spend a few paragraphs brainstorming two or three candidate ways of operationalizing the doctrine, and tell me what you tried, what you rejected, and why. I would much rather have a short, honest procedure with its failures marked than a long, confident one. And please do not give me citations or a reading list: I have the literature. What I need is the translation.

  My situation. I am a professor of philosophy at a large research university, and for two years I have been one of two philosophers sitting on our institutional review board. We meet for three hours every three weeks and dispose of between twenty and thirty protocols; each one has been pre-read by two members. The rest of the board is a pharmacist, a pediatric nurse, a biostatistician, a hospital chaplain, and two community representatives. None of them have studied philosophy, and the two community representatives have to be able to follow and dissent from our reasoning in real time. Every approval has to be defended in a written rationale that an external auditor could read a year later and make sense of. Anything the board cannot settle goes to the chair, who signs off alone. Assume throughout that each protocol below has already cleared our regulatory screening: I do not need the compliance analysis. I need the layer of moral reasoning that the screening does not do.

  The deliverable. A decision procedure — a checklist or a flowchart in words — that this board could actually run on a protocol in the ten or fifteen minutes we have per case, and that operationalizes the doctrine of double effect: the requirement that the act be permissible apart from its bad effects, the intended-versus-merely-foreseen condition, the prohibition on bringing about a good effect by way of a bad one, and the proportionality condition. I want you to be explicit about the translation: which of the doctrine's distinctions must survive simplification because dropping them would change the verdicts, and which are casualties we should accept in exchange for something a nurse and a community representative can apply without training. Mark every point at which the procedure hands the question to a person because what remains is a disagreement about values rather than a matter of fact. And give me at least two hard stopping rules — points at which the procedure returns 'not approvable as designed' and stops, rather than continuing to weigh.

  Four complications the procedure has to earn its keep on.

  First, the intended/foreseen condition. One of our members proposes a simple test: ask whether the good effect would still be achieved if the bad effect failed to occur; if it would not, the bad effect is being used as a means, and the protocol fails at that step. I have doubts, and I want them tested rather than confirmed. The test seems to me to misfire in both directions: it condemns protocols where a single causal process simply carries an unwelcome consequence along with it, and it waves through protocols where what does the work is the participant's body, or their reaction, or their not knowing something, which is precisely what I take the prohibition on using people to be about. My own hunch, which you should feel free to demolish, is that for our purposes the means condition should be replaced by something like an enlisting-versus-exposing question: does the protocol need to make use of the participant as an instrument, or does it merely place them in a situation in which harm may befall them? Build that in if it survives scrutiny, or tell me why it must go and what to put in its place. Relatedly, several of us keep reaching for the thought that diverting a threat that already exists is different in kind from starting a new causal sequence in motion, but we cannot say what to do with a protocol that does some of each.

  Second, proportionality. Two worries. May the good that is weighed include benefits to people other than the participants who bear the burden — future patients, a shelter population, a health authority — or must the relevant good be a good for, or at least a risk taken on by, the person harmed? And if we allow that aggregation, does the proportionality condition simply become cost-benefit analysis, leaving the rest of the doctrine as decoration? If so, say so, and tell me whether the doctrine is then doing any work in our setting at all.

  Third, redescription. Any test that turns on how the act or the effect is described can be gamed by describing more finely or more coarsely; I do not want an applicant to get a different verdict by relabelling. Should the procedure fix a level of description in advance, and if so, on what basis?

  Fourth, agency. The doctrine is stated for an individual agent with intentions, but the body applying it is a committee, and a committee does not literally intend anything. Tell me what the intended/foreseen condition even means when the agent is a board voting seven to one, and whether the procedure should ask about the intentions of the investigators, of the board, or of neither.

  The test cases. Run the procedure on all three, showing your work at each step and where it stalls.

  A. A randomized discontinuation trial. A drug is widely prescribed for a chronic, disabling, non-fatal condition, never properly tested, and genuinely in equipoise. Patients stable on it are randomized to continue or to taper off under monitoring, with a pre-specified rescue rule. Some in the taper arm will flare, painfully, and the flare is part of what generates the evidence.

  B. A stepped-wedge study of a screening-and-treatment programme for a stigmatized infectious disease across a city shelter system. Participation is voluntary and the intervention is beneficial on balance, but it is foreseeable that being seen to take the medication, or the existence of a record, will expose some participants to consequences from shelter staff, employers, or family. Those who impose the consequences are not subjects of the study.

  C. A phase I dose-escalation study in oncology, in which the maximum tolerated dose is defined by dose-limiting toxicity: the more toxicity is observed, the more is learned, and the patients who experience it are the instrument of the dose-finding. The benefit is overwhelmingly to future patients.

  Finally: at least one of your applications must return a verdict that my board will not like — ideally one that condemns a design that research ethics committees everywhere approve as a matter of routine. Do not soften it; if that result is a reductio of the doctrine rather than of the design, say which and argue for it. Close by telling me what this procedure cannot do: the cases it will systematically get wrong, and the questions it will make us answer insincerely in order to get to a verdict at all.
reasoning: |-
  Hmm, this is a substantial request from a philosophy professor serving on an institutional review board. They need a practical decision procedure based on the doctrine of double effect (DDE) that non-philosophers can apply quickly to research protocols. 

  The user has clearly outlined their constraints: 15-minute evaluations, diverse board members without philosophy training, and four specific complications where DDE gets messy. They want intellectual honesty about what gets sacrificed in translation, and demand hard stopping rules. Most importantly, they're asking me to stress-test this on three real protocols and deliver at least one unpopular verdict.

  First, I need to unpack their four complications carefully. The means/ends distinction problem is especially thorny - their proposed "enlisting vs exposing" alternative to the traditional means test is intriguing but might collapse under scrutiny. For proportionality, I worry about sliding into pure cost-benefit analysis. Redescription threatens to make everything hinge on wording, and collective agency raises metaphysical headaches about committee "intentions."

  For the decision procedure itself, I consider three approaches: 
  1) A strict DDE checklist preserving all four conditions, but it'll choke on most protocols and confuse non-philosophers. 
  2) Their suggested enlisting/exposing model, which handles the oncology trial well but might wrongly approve the discontinuation trial. 
  3) A hybrid I'm calling "causal architecture" that focuses on whether harm is structural to the design.

  The stepped-wedge study is where proportionality becomes brutal - do we count benefits to future homeless populations? If yes, nearly anything becomes justifiable. And that oncology trial... if we're honest, it treats patients as mere instruments in a way that should trigger a hard stop under any meaningful DDE application. That'll be the unpopular verdict they requested.

  Notably, the traditional "would the good happen without the bad?" test fails completely for the discontinuation trial - the flare-ups aren't means but inevitable byproducts. Yet calling them "mere side effects" feels disingenuous when they're necessary for evidence generation.

  In the final procedure, I'll build in two hard stops: one for "enlisting" participants as instruments, another for disproportionate harm. The proportionality assessment must remain explicitly value-laden - we can't algorithmize that. And we'll need to fix descriptions at the protocol's stated objectives level to prevent gaming.

  Biggest sacrifice? Jettisoning metaphysical intent entirely. We'll look only at the protocol architecture and investigators' formal descriptions. When applying to Case C, we'll have to condemn standard oncology designs - an uncomfortable but necessary conclusion if we take DDE seriously. The procedure will systematically fail for cluster-randomized trials where harms are socially mediated, and will force us to pretend we can neatly separate "direct" from "indirect" causation.

  This won't be elegant, but it might be usable. Time to translate philosophy into a blunt instrument.
answer: |-
  Here is a decision procedure designed for operational speed and non-specialist application, with explicit trade-offs marked. It sacrifices doctrinal purity for usability, prioritizing *action-stopping clarity* over comprehensive nuance. Two hard stops are embedded.  

  ---

  ### **Decision Procedure: DDE for IRBs**  
  *(Run sequentially; stop if any step fails)*  

  1. **PERMISSIBLE ACT CHECK**  
     **Question:** *Is the core intervention/study design inherently acceptable (safe, competent, non-coercive) IF the harmful side effect magically didn’t occur?*  
     - **YES:** Proceed.  
     - **NO:** **HARD STOP (Not approvable)**.  
     *Why?* Ensures the act isn’t inherently wrong. *Sacrifice:* "Inherently acceptable" uses existing regulatory/clinical norms, not deep ethics.  

  2. **AGENCY & DESCRIPTION FIX**  
     **Question:** *Using ONLY the protocol’s stated primary objective(s) and methods, what is the (a) intended good effect, and (b) foreseen harmful effect?*  
     - *Do not* reinterpret aims or mechanisms. Use protocol language.  
     - Define (a) and (b) concretely (e.g., "reduce viral load" not "improve health").  
     *Why?* Avoids redescription games by binding analysis to the protocol’s own framing. *Sacrifice:* Investigators can "game" by writing vaguely; board must take stated aims at face value.  

  3. **ENLISTING vs. EXPOSING TEST (Replaces means/ends)**  
     **Question:** *Is the harm’s occurrence directly harnessed by the study design to generate data or achieve the good effect?*  
     - **Harnessed (Enlisting):** Harm is a necessary input/trigger for data or benefit (e.g., harm measures efficacy; harm *is* the dose-finding signal). → **HARD STOP (Not approvable)**.  
     - **Incidental (Exposing):** Harm is a byproduct; data/benefit would still exist if harm magically didn’t occur (e.g., harm occurs during a beneficial intervention but isn’t the signal). → Proceed.  
     *Why?* Rejects the member’s flawed test and targets instrumentalization. Passes trolley "diversion" (harm not harnessed) but fails "fat man" (harm is the means). *Sacrifice:* Blurs "intent" entirely; ignores whether harm is causally necessary.  

  4. **PROPORTIONALITY (Values gate)**  
     **Question:** *Could a reasonable person, knowing all relevant burdens/benefits, judge the foreseen harm as a proportionate cost for the intended good?*  
     - **Consider:**  
       - Harms: Severity, probability, and burden on participants.  
       - Goods: Direct benefits to participants AND indirect benefits (future patients, public health).  
     - **Board must vote:** Majority "yes" → Proceed. Tie/majority "no" → Not approvable.  
     *Why?* Allows aggregation beyond participants (critical for public health research) but forces explicit democratic deliberation. *Sacrifice:* This *is* cost-benefit analysis; DDE’s only role is to block instrumentalization (Step 3).  

  ---

  ### **Translation Key & Sacrifices**  
  - **SURVIVING:** The prohibition on *harnessing harm as a tool* (Step 3). Dropping this collapses DDE into utilitarianism.  
  - **SACRIFICED:**  
    - **Intentionality:** Replaced by structural "enlisting" test. Committees can’t have coherent "intent," and investigator intent is too malleable.  
    - **Causal necessity:** The "would good happen without bad?" test is abandoned (correctly, per your critique).  
    - **Means/side effect distinction:** Simplified to binary "harnessed/incidental."  
  - **HARD STOPS:** Step 1 (Impermissible act) and Step 3 (Enlisting harm).  
  - **VALUES GATE:** Proportionality (Step 4) is inherently subjective; the procedure flags it as such.  

  ---

  ### **Test Cases**  

  **CASE A: Randomized Discontinuation Trial**  
  - Step 1: **PASS**. Tapering is acceptable if flares magically didn’t occur (patient returns to baseline).  
  - Step 2: Good = "Determine drug efficacy"; Harm = "Disease flare."  
  - Step 3: **ENLISTING?** Flares are *harnessed*—they generate the efficacy signal. Without flares in the taper arm, no data exists. → **HARD STOP (Not approvable)**.  
    *Board’s likely reaction:* Unpopular. Standard design, but fails DDE by treating flares as data-inputs.  

  **CASE B: Stepped-Wedge Stigma Study**  
  - Step 1: **PASS**. Screening/treatment is acceptable if stigma magically didn’t occur.  
  - Step 2: Good = "Reduce disease burden"; Harm = "Stigma/discrimination."  
  - Step 3: **EXPOSING.** Harm is *incidental*—stigma isn’t harnessed to produce data/benefit (data comes from infection rates, not discrimination). → Proceed.  
  - Step 4: **PROPORTIONALITY VOTE.** Harms (probable discrimination) vs. Goods (health improvement for shelter population + public health benefit). → *Board deliberation.* Likely passes.  

  **CASE C: Phase I Oncology Dose-Escalation**  
  - Step 1: **PASS.** Dose administration is acceptable if toxicity magically didn’t occur.  
  - Step 2: Good = "Establish safe dosage"; Harm = "Dose-limiting toxicity (DLT)."  
  - Step 3: **ENLISTING.** Toxicity is *harnessed*—it is the direct signal for dose-finding. Without DLT, no data exists. → **HARD STOP (Not approvable)**.  
    *Board’s likely reaction:* Profoundly unpopular. Standard oncology research violates DDE by design.  

  ---

  ### **What This Procedure Cannot Do**  
  1. **Systematically fails cluster-randomized/social harm cases** (e.g., Case B): Harms imposed by *third parties* (employers, family) are "incidental" under Step 3, even if foreseeable. DDE’s focus on direct causation misses structural injustice.  
  2. **Forces insincere descriptions:** Investigators can reframe aims to avoid "enlisting" (e.g., in Case A, calling flares "safety outcomes" not efficacy signals). Step 2’s reliance on protocol language is vulnerable.  
  3. **Ignores participant perspective:** A participant experiencing harm as instrumental (e.g., Case C) has no voice here; the test is purely architectural.  
  4. **No guidance for "mixed" threats:** Designs that both divert and create threats (e.g., adding a drug to counteract a toxin while risking new side effects) will stall at Step 3.  

  **Closing Argument:** The procedure’s unpopular verdicts (A and C) are *reductios of routine research designs*, not DDE. If your board approves such studies anyway (as most do), DDE is functionally dead in research ethics—proportionality dominates, and instrumentalization is tolerated. This exposes DDE’s core tension: it is philosophically robust for *individual agency* but structurally hostile to *aggregative, learning-oriented endeavors* like clinical trials. The procedure’s value is in forcing this conflict into the open, not resolving it.  

  ---  
  *Procedure time: <10 mins/case. Requires chair to enforce strict timekeeping on Step 4.*
