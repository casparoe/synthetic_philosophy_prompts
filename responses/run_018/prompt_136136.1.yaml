answer: |-
  Your diagnosis is astute, and the impasse stems from a confluence of factors: **conceptual ambiguity, divergent evidential priorities, foundational normative intuitions, and unaddressed formal constraints.** Here's a breakdown of the disagreement's structure and prospects for progress:

  ---

  ### **Diagnosis: A Multi-Layered Disagreement**
  1.  **Verbal/Conceptual Ambiguity (Your Hypothesis is Partly Correct):**
      *   **"Commensurable":** Lexicalists typically mean *metric incommensurability* – the absence of a common unit allowing precise cardinal comparison or summation *across the threshold*. Pleasure and pain are distinct "currencies" that cannot be netted out beyond a point. Continuous theorists mean *comparability for practical choice* – agents *can* and *must* make trade-offs between them, implying they exist on a single ordinal (or cardinal) scale permitting rational choice, even if difficult.
      *   **"Threshold":** Lexicalists envision a *strict discontinuity* – a qualitative boundary where the *type* of evaluation changes. Continuous theorists see it as a point of *extremely steep but continuous substitution rate* within a single metric.
      *   **"Axiological Currency vs. Deliberative Trade-off":** This distinction is crucial. Lexicalists often argue the threshold reflects an *axiological truth* (suffering beyond T possesses a distinct, non-compensable moral disvalue). Continuous theorists focus on the *deliberative requirement*: any plausible decision theory *must* allow comparison to avoid paralysis. They see lexicalism as smuggling in a deontological constraint ("thou shalt not permit suffering > T") disguised as axiology.

  2.  **Substantive Disagreement on Data/Evidence:**
      *   **Lexicalists:** Prioritize *extreme hypotheticals* (e.g., "Is any amount of mild pleasure for bystanders justified by permitting the prolonged, agonizing torture of one innocent person?"). They treat strong, widely shared intuitions of horror and refusal in these cases as *decisive evidence* for a discontinuity. Intuition is primary data.
      *   **Continuous Theorists:** View extreme cases as *outliers* testing the limits of a continuous function, not refuting it. They prioritize:
          *   *Aggregation:* How do we weigh smaller sufferings against larger pleasures *in aggregate* across populations? Lexicalism seems to forbid any trade-off where *anyone* exceeds T, leading to extreme conclusions (e.g., prioritizing eliminating a pinprick for one person over preventing massive future suffering below T for billions, if the pinprick somehow pushes them over T).
          *   *Model Coherence:* Standard rational choice theory and welfare economics rely on continuity and completeness of preferences. Lexical thresholds create formal problems (e.g., violating continuity axioms, potentially leading to incomplete preferences or non-existence of optimal choices in complex scenarios). They demand: "Show me a coherent formal model incorporating your discontinuity."
          *   *Marginal Cases:* What about suffering *just below* T vs. pleasure? A continuous function handles smooth transitions; lexicalism faces a "cliff edge" problem where an infinitesimal increase in suffering triggers an absolute prohibition against any compensating pleasure.

  3.  **Bedrock Normative Intuitions:**
      *   Ultimately, the debate rests on irreconcilable foundational intuitions:
          *   **Lexicalist Intuition:** Suffering beyond a certain intensity possesses an intrinsic, non-negotiable moral *badness* that cannot be "bought off" by pleasure. Allowing/causing such suffering is a unique category of moral wrong. This often stems from a deep deontological or rights-based impulse ("a right not to suffer excruciatingly").
          *   **Continuous Intuition:** Value is fundamentally about the *experiences* of conscious beings, and all experiences (positive and negative) can, in principle, be positioned relative to each other on a spectrum of well-being. Denying this leads to absurdities in aggregation and paralyzes decision-making. This stems from a consequentialist/utilitarian commitment to maximizing net welfare via comparison.

  4.  **The Hidden Formal Question:**
      *   Continuous theorists are correct that **standard von Neumann-Morgenstern (VNM) utility theory cannot represent a strict lexical threshold** without violating the Archimedean Axiom (which ensures continuity: if A > B > C, there exists a probability p < 1 such that pA + (1-p)C > B). Lexical preferences violate this (no amount of probability-weighted "pleasure lottery" makes enduring torture > T acceptable).
      *   However, this is *not* a knockout blow. Lexicalists can (and some do) argue:
          *   VNM axioms describe rational choice under *risk*, not necessarily the true structure of *value*. Value might be inherently discontinuous.
          *   Alternative formal frameworks exist: **Non-Archimedean utility representations** (using infinitesimals or lexicographic orders), **multi-attribute utility** where suffering-beyond-T is a separate, infinitely weighted dimension, or **deontic constraints** integrated into decision rules. The challenge is making these frameworks practically usable and normatively compelling.

  ---

  ### **What Would Count as Progress?**
  Total resolution is unlikely due to the bedrock intuitions, but meaningful progress is possible by clarifying the nature of the disagreement and developing more sophisticated frameworks:

  1.  **Conceptual Clarification (Crucial First Step):**
      *   Explicitly distinguish:
          *   **Axiological Commensurability (Metric):** Do pleasure and pain share a common unit of *intrinsic value* allowing cardinal summation?
          *   **Comparability for Choice:** Can agents rationally compare options involving trade-offs between pleasure and pain, leading to a complete preference ordering?
          *   **Moral Permissibility:** Are certain trade-offs (especially involving suffering > T) inherently morally forbidden, regardless of net outcome?
      *   Acknowledge that lexical threshold NU often conflates a strong axiological claim (incommensurability) with a deontic constraint (impermissibility).

  2.  **Formal Modeling Advancements:**
      *   **For Lexicalists:** Develop robust, applicable decision frameworks incorporating the threshold. Can non-Archimedean utilities or multi-attribute models handle complex real-world trade-offs and aggregation *without* collapsing into absurdity or paralysis? Can they address the "cliff edge" problem convincingly?
      *   **For Continuous Theorists:** Acknowledge that VNM is a *model*, not moral reality. Can they develop models with *sufficiently steep but continuous* substitution rates that capture the lexicalist *intuition* in extreme cases while preserving comparability? Does this steepness itself imply a *practical* incommensurability for most decisions? Explore models incorporating risk aversion specifically around suffering thresholds.

  3.  **Meta-Ethical & Methodological Reflection:**
      *   **Role of Intuitions:** Facilitate a discussion on the evidential weight of extreme hypotheticals vs. aggregate cases. Are intuitions about torture reliable guides to fundamental axiology, or are they heuristic responses? Can both sides agree on core "fixed points" while disagreeing on extrapolation?
      *   **"Threshold as Projection" Hypothesis:** This deserves serious consideration. Is the lexical threshold an objective moral fact, or a psychological/cultural limit to our willingness to make horrific trade-offs? Does acknowledging this as a *practical* constraint (e.g., in institutional decision-making) satisfy the core moral concern without requiring axiological discontinuity? Continuous theorists could incorporate "procedural constraints" or agent-relative permissions reflecting this unwillingness.

  4.  **Focusing the Debate:**
      *   Move beyond "torture vs. bliss." Press lexicalists on aggregation problems (e.g., distributed suffering below T vs. one instance above T). Press continuous theorists on whether their steep functions *truly* avoid justifying intuitively horrific trade-offs if the numbers get large enough.
      *   Explore the implications for *population ethics* (e.g., creating new beings experiencing pleasure vs. preventing suffering).

  ---

  ### **Prospects for Moving the Dispute**
  *   **Conceptual Distinction:** Will significantly clarify the debate and prevent talking past each other. It won't resolve it, but makes the core disagreement(s) explicit.
  *   **Formal Results:** Showing lexical preferences *can* be modeled coherently (e.g., with multi-dimensional utilities satisfying weaker rationality axioms) would disarm a major continuous-theorist objection. Showing they lead to *intractable* problems (e.g., pervasive incompleteness) would strengthen the continuous case. However, formal results alone are unlikely to shift normative intuitions.
  *   **Empirical Evidence:** Will *not* resolve the core dispute. Neuroscience might show pain/pleasure share neural substrates, but this doesn't settle the *normative* question of commensurability. Behavioral economics might show people *act* as if there's a threshold, but this speaks to psychology, not axiology.
  *   **Bedrock Intuitions:** These are the hardest barrier. Progress here might involve:
      *   Finding *internal* inconsistencies in each view's implications (e.g., lexicalism leading to counterintuitive neglect of vast suffering below T; continuous theory justifying intuitively monstrous trades).
      *   Framing the choice as between competing moral paradigms with different costs/benefits, rather than one being "right."

  **Conclusion:** The dispute is fundamentally **substantive and normative**, rooted in different foundational intuitions about the nature of suffering and value. It is **exacerbated by** conceptual ambiguity regarding "commensurability" and "threshold," divergent methodologies (extreme cases vs. aggregation/modeling), and unaddressed formal constraints of standard decision theory. **Progress** will come from rigorously disentangling the conceptual questions, developing and stress-testing formal models for both views, and engaging in honest meta-ethical discussion about the role of intuitions and the potential psychological origins of the threshold concept. While formal coherence for lexicalism is achievable with non-standard tools, and continuous models can be made extremely sensitive, **the core normative disagreement over whether suffering beyond a point is absolutely non-compensable is unlikely to be definitively settled by argument alone.** Your paper's contribution could lie in meticulously mapping this landscape, clarifying the points of true divergence, and assessing the viability and implications of each view's formal and normative commitments.
