prompt: |-
  hey - I'm writing a novel where my protagonist's sister gets sectioned after she stops sleeping and starts describing her dreams as shared memories. The doctors call it psychosis and want meds. Meanwhile my cousin recieved a diagnosis of 'delusional disorder' just because he quit his job to live in the woods and talk to trees. I can't shake the feeling that mental illness isn't a broken brain but more like an imposed narative - a genre we force onto a life that doesn't fit the usual plot. Is there a serious philosophical view that diagnosis works like that, rewriting someone's story rather than fixing a biological fault? And if my character refuses treatment, am I writing her as rational or just naive? Please answer in British English - no bibliography needed, just the reasoning.
