answer: |-
  Here is a complete list of desiderata for an adequate account of the common property of pleasure, structured by requirement, motivating case, and conceptual pressure:

  1.  **Accommodation of Hedonic Valence Across Moral Valence:**
      *   **Requirement:** Must explain how experiences with *positive* hedonic tone can occur despite *negative* moral character (and vice versa, though less common).
      *   **Motivating Case:** Malicious gossip. The agent experiences a distinct, positively-valenced feeling while engaging in an action widely recognized as morally wrong. The account must capture this positive feeling without either (a) reducing it to a moral judgment ("it feels good *because* I judge it good" - which it isn't) or (b) ignoring the hedonic component entirely.
      *   **Conceptual Pressure:** Hedonism requires that pleasure is the ultimate good; this necessitates identifying pleasure independently of morality to avoid circularity and to explain why pursuing immoral pleasures is tempting.

  2.  **Accommodation of Aesthetic Pleasure Without Representational Reduction:**
      *   **Requirement:** Must account for the pleasure taken in beauty, art, or formal properties without reducing it *solely* to the satisfaction of a desire for beauty or the representation of beauty.
      *   **Motivating Case:** Experiencing awe at a breathtaking sunset or the intricate structure of a fugue. The pleasure seems intrinsic to the perceptual or intellectual engagement itself, not merely a consequence of judging it beautiful or fulfilling a prior desire. The pleasure *accompanies* the representation but isn't constituted by it.
      *   **Conceptual Pressure:** To avoid collapsing aesthetic value into either moral value or mere representational content, and to capture the immediate, often non-cognitive "glow" of aesthetic appreciation.

  3.  **Preservation of Sensory/Intellectual/Anticipatory Distinction:**
      *   **Requirement:** Must allow for meaningful phenomenological distinctions between types of pleasure (sensory, intellectual, anticipatory) while still identifying their common hedonic core.
      *   **Motivating Cases:**
          *   *Sensory:* Cool air on sunburnt skin – immediate, bodily, localized.
          *   *Intellectual:* Resolving a complex proof – cognitive, achievement-oriented, often diffuse.
          *   *Anticipatory:* Savouring the thought of a future holiday – future-oriented, imaginative, potentially tinged with excitement or relief.
      *   **Conceptual Pressure:** Recognition of deep phenomenological heterogeneity. An account that flattens these differences risks being phenomenologically implausible and unable to explain why we seek different pleasures for different reasons.

  4.  **Diachronic Comparability for Practical Reasoning:**
      *   **Requirement:** Must provide a basis for comparing the *magnitude* or *value* of different pleasures occurring at different times to enable rational choice between future courses of action.
      *   **Motivating Case:** Choosing between spending the evening studying (yielding intellectual pleasure later) or socializing (yielding sensory/social pleasure now). Rational deliberation requires some, even if imperfect, basis for comparing the expected pleasure of these distinct future experiences.
      *   **Conceptual Pressure:** Hedonism as a practical philosophy for guiding action and maximizing aggregate well-being necessitates interpersonal and intrapersonal comparison over time.

  5.  **Unity of Compound Experiences:**
      *   **Requirement:** Must explain genuinely fused pleasures where sensory, cognitive, and emotional components are experientially unified into a single hedonic state, rather than merely co-occurring.
      *   **Motivating Case:** The sophisticated pleasure of savoring a fine wine. This involves gustatory sensations, olfactory sensations, cognitive appreciation of complexity and balance, aesthetic judgments, and emotional satisfaction. The pleasure feels like a single, rich experience, not just taste + smell + thought happening simultaneously.
      *   **Conceptual Pressure:** To capture the holistic nature of many peak experiences and avoid an overly atomistic view of pleasure that cannot account for gestalt hedonic properties.

  6.  **Non-Dependence on Co-Occurring Aversions/Displeasures:**
      *   **Requirement:** Must define pleasure intrinsically, such that an experience can be pleasurable *without* requiring the simultaneous relief of a pain or aversion.
      *   **Motivating Case:** The pleasure of cool air on *healthy* skin on a warm day, or the spontaneous joy of hearing beautiful music unexpectedly. These are positive experiences not predicated on the prior existence or cessation of an unpleasant state.
      *   **Conceptual Pressure:** To avoid defining pleasure merely as the absence of pain or the satisfaction of a need, thereby accounting for "positive" pleasures that exist independently.

  7.  **Explanation of Retrospective Valence Drift (Niche Constraint):**
      *   **Requirement:** Must provide an internal explanation for systematic, non-accidental shifts in the remembered hedonic quality of an experience compared to its experienced quality, beyond simple memory decay or distortion.
      *   **Motivating Cases:**
          *   *Peak-End Rule:* Remembering a painful medical procedure as less awful than it was due to a relatively less painful ending.
          *   *Nostalgia Enhancement:* Remembering a difficult backpacking trip as intensely pleasurable while downplaying the misery of blisters and rain.
          *   *Regret Diminishment:* Remembering a hedonically intense but morally dubious pleasure (e.g., excessive indulgence) as less pleasurable in hindsight due to subsequent guilt.
      *   **Conceptual Pressure:** Memory plays a crucial role in shaping future choices and overall life satisfaction assessments. A theory of pleasure that cannot explain *why* remembered valence often diverges systematically from experienced valence in predictable ways tied to the *nature* of pleasure itself (e.g., its duration, intensity profile, cognitive embedding, or relationship to self-narrative) is incomplete. The explanation must stem from the theory's core conception of what pleasure *is*.

  **Flagged Potential Conflicts:**

  *   **Heterogeneity vs. Aggregative Metric (Desiderata 3 & 4):** This is the core tension. Preserving deep phenomenological differences (3) seems fundamentally at odds with providing a single, common metric (like intensity-duration) suitable for summation and comparison across all types (4). Can an account genuinely respect the qualitative uniqueness of intellectual vs. sensory pleasure while still allowing us to say meaningfully that one *furnishes more pleasure* (and thus more good) than the other?
  *   **Intrinsic Valence vs. Retrospective Drift (Desiderata 1/2/3 & 7):** If pleasure is defined by its intrinsic, occurrent felt quality (supporting 1,2,3), how can the theory *internally* explain why the *memory* of that intrinsic quality systematically distorts? The drift might seem like an external failure of memory, not an internal feature of pleasure. An account must bridge this gap.

  **Brief Assessment of Theory Types:**

  1.  **Phenomenal-Character Theories:** Define pleasure by a distinctive, intrinsic feeling-tone ("hedonic gloss").
      *   *Strengths:* Naturally satisfies 1, 2, 3, 6 (if the gloss is distinct). Captures immediate feel.
      *   *Weaknesses:* Struggles severely with 4 (comparing radically different feels?), 5 (how does the gloss unify compounds?), and 7 (why would memory of the gloss drift systematically?). The Heterogeneity/Metric conflict (3 vs. 4) is acute.

  2.  **Desire-Satisfaction Theories:** Define pleasure as the experience of a desire being satisfied.
      *   *Strengths:* Potentially handles 4 (desire strength as a metric?), 5 (satisfaction of a complex desire), maybe 7 (desires/memories change).
      *   *Weaknesses:* Struggles with 1 (can I desire the malicious? Does satisfying *that* desire feel good?), 2 (must I desire the sunset to find it pleasurable?), 3 (is satisfying a sensory desire the *same* as satisfying an intellectual one?), and 6 (can pleasures occur without prior desire?).

  3.  **Attitudinal Theories:** Define pleasure as taking a positive pro-attitude (liking, enjoying) towards some object/experience/content of consciousness.
      *   *Strengths:* Flexible; can potentially accommodate 1, 2, 3 (different objects/attitudes), 5 (attitude towards the compound), 7 (attitudes can change over time, including retrospectively).
      *   *Weaknesses:* Risks circularity (is "liking" defined by pleasure?). Struggles with 4 (how to quantify attitudinal strength comparably?) and 6 (can "liking" occur spontaneously without a prior state?). May struggle to capture the raw *feel* emphasized by phenomenal theories.

  This framework provides the rigorous specification required to evaluate potential solutions to the heterogeneity problem, highlighting the core challenges and the essential, often overlooked, constraint of retrospective valence drift.
