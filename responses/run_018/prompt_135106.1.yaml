  But the case breaks down when we see regulators didn't truly fuse categories; they created new distinctions ("embryo created by fertilization" vs. "artifact"). This legal pragmatism reveals Mingjia's limitation: institutional taxonomy prioritizes functional consequences over ontological purity. The School of Names might critique how "mammal" language obscured novel aspects, but couldn't predict regulatory innovation.

  Ultimately, the case exposes Mingjia's core weakness: their theory assumes stable categories, while bioregulation dynamically constructs them. The illumination flows both ways - Mingjia helps spot category errors, but the case shows reality demands flexible taxonomies Mingjia wouldn't accept. 

