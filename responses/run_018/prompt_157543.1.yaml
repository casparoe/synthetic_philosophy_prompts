  please write:
  - the exam question (90 min, ~600 words)
  - a model answer
  - a marking scheme that separates an A from a B by naming specific moves (e.g., distinguishing psychological vs institutional essentialism, applying the ecological fallacy, giving a non-ad-hoc criterion for acceptable generalization)

  and please say what would change your mind — which argument or consideration would lead you to think national character is actually defensible, or that generalizing about peoples is never okay.

  typing this on my phone so sorry for lowercase and any weird typos.
