prompt: |-
  I'm designing a focused three-year research program—roughly the scale of a dissertation or a small grant—on the conceptual fallout from Jackson's knowledge-argument about Mary. I don't want a survey of the literature; I want a defended agenda that ranks which open problem clusters deserve scarce time and which are downstream refinements that won't move the core debate.

  Consider three interdependent clusters that have emerged since Mary's case was introduced:

  A. The phenomenal-concept strategy: whether phenomenal properties are presented through a genuinely non-physical mode of conceptualization, and if so, whether that mode is metaphysically compatible with physicalism or instead collapses into a form of property dualism that physicalists wanted to avoid.

  B. The ability-knowledge boundary: whether Mary's post-release cognitive change is best analyzed as acquiring new propositional knowledge (knowing-that) or rather as gaining practical, acquaintance, or recognitional capacities, and whether this distinction can be sharpened without circular appeal to the very phenomenal states under discussion.

  C. The extrapolation problem: whether whatever gap Mary's case reveals—if it reveals one—generalizes to attributing consciousness across species, artificial architectures, or pharmacologically altered brains, and whether settling Mary's case is a prerequisite for constructing non-circular criteria for such attributions.

  Your task: rank A, B, and C in the order they should be tackled within this program. For each position in the ranking, defend the placement by addressing four criteria explicitly: (1) dependency— which other clusters cannot be resolved without this one being settled first, and which depend on it only weakly or not at all; (2) tractability—whether existing conceptual tools are sufficient or whether progress requires inventing distinctions that are not yet stable; (3) payoff—what result here would count as decisive for the physicalism debate versus merely taxonomic, and what result in the other clusters would change your mind about the ranking; and (4) resource sensitivity—if the program had to be cut from three years to two, which cluster should be dropped and why its resolution would not alter the conclusions reached in the remaining two.

  The deliverable should be an agenda, not a bibliography or citation map: specify the ordering, the criteria governing it, the trade-offs you are accepting, and what would have to be shown to reverse your prioritization.
reasoning: |-
  Okay, the user is designing a three-year research program on Jackson's knowledge argument about Mary, focusing on three problem clusters: A (phenomenal-concept strategy), B (ability-knowledge boundary), and C (extrapolation problem). I need to rank these clusters in order of priority and defend that ranking based on dependency, tractability, payoff, and resource sensitivity.

  First, I should recall what each cluster entails. Cluster A deals with whether phenomenal concepts are non-physical and if they're compatible with physicalism. Cluster B examines whether Mary gains new propositional knowledge or just new abilities. Cluster C explores whether the gap revealed in Mary's case applies to other entities like animals or AI.

  For dependency, I need to determine which cluster is foundational. It seems to me that Cluster A is key because the phenomenal-concept strategy directly addresses how we conceptualize phenomenal properties. If we don't resolve whether phenomenal concepts are physical or not, it affects both B and C. Cluster B's analysis depends on understanding what kind of concepts are involved, and Cluster C's extrapolation relies on knowing what the gap actually is. So A seems most fundamental.

  Next is tractability. Cluster A has been heavily debated with established positions, so it might be more approachable. There are tools like conceptual analysis and thought experiments ready to use. Cluster B involves tricky distinctions like acquaintance knowledge versus propositional knowledge, which might require developing new conceptual tools, making it less tractable. Cluster C deals with empirical uncertainties about consciousness in other entities, which could involve messy real-world applications, so it's probably the least tractable right now.

  For payoff, resolving Cluster A could have the biggest impact. If phenomenal concepts are shown to be physicalistically acceptable, it might save physicalism; if not, it could lead to property dualism. This seems decisive. Cluster B's resolution might refine our understanding but likely won't settle the physicalism debate. Cluster C's conclusions might be limited to specific cases without broader implications unless A is settled first.

  Considering resource sensitivity, if the program is cut to two years, Cluster C should be dropped. Since C depends heavily on A and B, resolving C wouldn't change the core conclusions from A and B. Dropping B would leave the knowledge boundary unresolved, which is important for interpreting Mary's case.

  I'll rank them as A first, then B, then C. For Cluster A, it's foundational with moderate tractability and high payoff. Cluster B depends on A, has low tractability but medium payoff. Cluster C depends on both A and B, has low tractability and low payoff for core debates. If A is resolved in a way that shows phenomenal concepts are physicalistic, the priority might shift, but otherwise, this ranking holds.

  The user wants a defended agenda, not a literature survey, so I'll focus on justifying the ranking with clear criteria and trade-offs. I'll explicitly address what would change the ranking, like if Cluster B's ability-knowledge distinction could be made without phenomenal concepts or if Cluster C's extrapolation problem turns out to be independent.
answer: |-
  Here is a prioritized research agenda for your 3-year program, justified by explicit criteria and trade-offs:

  **Ranking: A > B > C**

  **Core Justification:** Cluster A is the indispensable engine driving the entire Mary debate. Without resolving the metaphysical status of phenomenal concepts, analyses in B remain ambiguous and extrapolations in C lack a stable foundation. Tackling A first maximizes leverage over the physicalism debate while minimizing wasted effort on downstream issues that may prove irrelevant if A settles core questions.

  ---

  ### 1. **Cluster A: Phenomenal-Concept Strategy (Year 1)**
     - **(1) Dependency:**  
       **Foundationally necessary for B and C.**  
       - *B*: Resolving whether Mary gains *propositional knowledge* (B) requires knowing if phenomenal concepts refer to physical properties in a novel way. If phenomenal concepts are irreducibly non-physical, "knowing-that" claims about qualia collapse into dualism regardless of B’s analysis.  
       - *C*: Extrapolation to non-human cases (C) assumes we understand *what* is being extrapolated (e.g., a conceptual gap? a property?). If A shows the gap is merely epistemic (compatible with physicalism), C becomes a practical challenge; if it reveals ontological dualism, C risks category errors.  
       - *Weak dependency on others*: A can be investigated using existing thought experiments (Mary, zombies) without presupposing resolutions to B or C.
     
     - **(2) Tractability:**  
       **Moderate (tools exist but require refinement).**  
       Well-developed frameworks exist (e.g., Papineau’s "demonstrative" concepts, Chalmers’ dualism). Key challenge is *stabilizing* criteria for "physical compatibility" (e.g., does conceptual irreducibility entail ontological irreducibility?). Progress demands sharpening distinctions between *epistemic* and *metaphysical* novelty, not inventing wholly new tools.

     - **(3) Payoff:**  
       **Decisive for physicalism.**  
       - *Success*: Showing phenomenal concepts are physicalistically acceptable (e.g., via unique cognitive mechanisms) defangs Mary’s argument, preserving physicalism. Showing they *require* non-physical content forces dualism.  
       - *Re-ranking trigger*: If A *conclusively* supports physicalism (e.g., by reducing phenomenal concepts to computational roles), B/C become secondary. If A *conclusively* implies dualism, C gains urgency to map the ontology’s boundaries.  
       - *Failure*: Taxonomic refinements without metaphysical resolution (e.g., cataloging concept types) would elevate B’s priority to test if knowledge *acquisition* bypasses the gap.

     - **(4) Resource Sensitivity:**  
       **Non-droppable.** If cut to 2 years, A must be completed. Without it, conclusions on B/C are metaphysically unmoored. A’s resolution defines the stakes for all follow-up work.

  ---

  ### 2. **Cluster B: Ability-Knowledge Boundary (Year 2)**
     - **(1) Dependency:**  
       **Depends strongly on A, weakly informs C.**  
       - *Requires A*: Whether Mary’s gain is "knowledge-that" hinges on whether phenomenal concepts refer to objective properties (resolved by A). If A shows concepts are non-referential abilities, B’s question dissolves.  
       - *Informs C*: If Mary’s gain is *purely* ability-based (e.g., recognitional skill), extrapolating consciousness (C) may rely on behavioral criteria. But if A reveals ontological qualia, abilities become irrelevant to C’s core challenge.  
       - *Independent of C*: B can be analyzed with human-case intuitions without resolving non-human attribution.

     - **(2) Tractability:**  
       **Low (requires conceptual innovation).**  
       Existing distinctions (e.g., Ryle’s knowing-how vs. knowing-that) are insufficient. "Acquaintance" and "recognitional capacity" are unstable or circular (e.g., "direct awareness" often presupposes phenomenality). Progress demands new, non-question-begging criteria for cognitive acts distinct from phenomenal states.

     - **(3) Payoff:**  
       **Taxonomic refinement (unless A is unresolved).**  
       - *If A is settled*: B clarifies *how* Mary learns, but doesn’t alter A’s physicalism/dualism verdict. High-value only if A’s resolution is epistemic (e.g., concepts are physical but hard to acquire).  
       - *If A is incomplete*: B could *indirectly* challenge physicalism by showing abilities require non-physical resources.  
       - *Re-ranking trigger*: If B proves abilities *necessarily* entail non-physical properties, it would supersede A and force dualism. But this is unlikely without A’s groundwork.

     - **(4) Resource Sensitivity:**  
       **Droppable if cut to 2 years.** If A is resolved (e.g., in favor of physicalism), B becomes a nuance. If A implies dualism, B is secondary to C’s ontological mapping. B’s omission doesn’t undermine A or C’s core conclusions.

  ---

  ### 3. **Cluster C: Extrapolation Problem (Year 3)**
     - **(1) Dependency:**  
       **Fully downstream of A and B.**  
       - *Requires A*: To ask "Can AI have what Mary lacked?" presupposes we know *what* Mary lacked (a conceptual gap? a property?). A defines the target.  
       - *Requires B*: If consciousness attribution rests on behavioral abilities (B), C needs criteria for those abilities. If it rests on knowledge-that, C needs criteria for concept possession.  
       - *Independent upside*: C could *pressure-test* A/B resolutions (e.g., if A+B imply octopuses lack qualia but evidence suggests otherwise).

     - **(2) Tractability:**  
       **Very low (empirical/conceptual hybrid).**  
       Demands integrating philosophy of mind with neuroscience/AI/ethology. Key challenge: avoiding circularity when defining non-human consciousness without presupposing phenomenality. Requires novel cross-disciplinary frameworks.

     - **(3) Payoff:**  
       **Applied (not core debate).**  
       - Settling C informs ethics or AI design but doesn’t resolve the physicalism debate. Even if we can’t extrapolate, physicalism could be true (if Mary’s gap was epistemic) or false (if the gap is ontological but species-specific).  
       - *Re-ranking trigger*: Only if C reveals a *disanalogy* undermining Mary’s case (e.g., humans uniquely exhibit the gap) or shows the gap *generalizes unexpectedly* (e.g., in simple AI). This is improbable without A/B.

     - **(4) Resource Sensitivity:**  
       **First to drop.** C is a multiplier of A/B’s conclusions, not a driver. Omitting C sacrifices scope (e.g., AI ethics) but preserves core progress on physicalism.

  ---

  ### Trade-offs Accepted
  - **Depth over breadth:** Prioritizing A risks underdeveloping C’s urgent real-world applications (e.g., AI consciousness). Justification: If A/B fail, C’s criteria will be flawed.  
  - **Metaphysics over epistemology:** B’s nuanced knowledge analysis is delayed despite its intrinsic interest. Justification: B’s stakes depend entirely on A’s metaphysical outcome.  
  - **Human-centric focus:** C’s cross-species/AI questions are deferred. Justification: Mary’s human case is the controlled experiment; generalizing prematurely invites noise.

  ### Reversing the Ranking
  The agenda would be overturned only if:  
  1. **Cluster B proves autonomous**: If a watertight distinction between ability/knowledge *not* relying on phenomenal concepts emerges (e.g., via cognitive psychology), B could leapfrog A.  
  2. **Cluster C forces simplicity**: If extrapolation (C) can be addressed with minimal metaphysical commitments (e.g., via functional criteria independent of Mary), it would rise in priority.  
  3. **Cluster A is intractable**: If no progress on A occurs in Year 1 (e.g., all positions reach stalemate), shift focus to B as an alternative path to pressure physicalism.

  This structure ensures Year 1 tackles the keystone issue, Year 2 refines its implications, and Year 3 explores consequences—maximizing the chance of a landmark contribution to physicalism with scarce resources.
