answer: |-
  ### Philosophy of Mathematics Seminar: Decision Tree for Attitudes Toward Non-Deductive Evidence  
  **Core Setting**: Number-theoretic heuristics (e.g., Cramér’s model, independence assumptions) used to "predict" conjectures like the prime number theorem or twin primes distribution.  

  ---

  #### **Diagnostic Questions**  
  Answer these concretely—**no prior knowledge of position labels needed**.  

  1. **Credence Question**:  
     *Can an unproven mathematical conjecture (e.g., "There are infinitely many twin primes") rationally hold a credence (subjective probability) below 1?*  
     → **Yes** (Go to Q2) | **No** (Go to Q5)  

  2. **Failure Sensitivity Question**:  
     *Maier’s theorem shows Cramér’s model fails for primes in short intervals. Should this lower confidence in...*  
     → **All conjectures the model supports** (e.g., twin primes, Goldbach) | **Only "nearby" conjectures** (e.g., primes in short intervals) | **None** (Go to Q3)  

  3. **Independence Presumption Question**:  
     *When assuming divisibility by different small primes is independent, is this meant to...*  
     → **Track a truth about the primes themselves** (ontological) | **Serve as a useful predictive device** (methodological) | **Neither—it’s a placeholder** (Go to Q4)  

  4. **Transferability Question**:  
     *If a heuristic (e.g., random model for primes) correctly "predicts" 20 conjectures, does this transfer warrant to its 21st prediction?*  
     → **Yes, strongly** | **Yes, but cautiously/qualified** | **No**  

  5. **Evidence Status Question**:  
     *Does a heuristic’s successful prediction (e.g., of the prime number theorem) provide epistemic evidence for a conjecture?*  
     → **Yes** (Go to Q6) | **No** (Go to Q7)  

  6. **Evidence Strength Question**:  
     *Non-deductive evidence from heuristics is...*  
     → **Strong but fallible** (like empirical data) | **Weak and provisional** (a nudge, not proof)  

  7. **Utility Question**:  
     *If heuristics confer no evidence, why are they used?*  
     → **To prioritize research** | **To guide intuition** | **They shouldn’t be used**  

  8. **Truth-Tracking Question**:  
     *Must a reliable heuristic track mathematical truth?*  
     → **Yes—its success implies latent truth** | **No—it’s a useful fiction**  

  ---

  #### **Decision Tree & Positions**  
  *(Follow arrows based on answers)*  

  ```  
  START  
  │  
  ├─ **Q1: Yes** → Q2  
  │   ├─ **All conjectures** → Q3  
  │   │   ├─ **Ontological** → Q4  
  │   │   │   ├─ **Yes, strongly** → **Leaf 1: Bayesian Realist**  
  │   │   │   ├─ **Yes, cautiously** → **Leaf 2: Revisionist Bayesian**  
  │   │   │   └─ **No** → **UNOCCUPIED** (Incoherent: ontological commitment without learning from success)  
  │   │   └─ **Methodological/Neither** → **Leaf 3: Fallibilist**  
  │   ├─ **Only "nearby" conjectures** → **Leaf 4: Contextualist**  
  │   └─ **None** → **Leaf 5: Dogmatic Modeler**  
  │  
  └─ **Q1: No** → Q5  
      ├─ **Q5: Yes** → Q6  
      │   ├─ **Strong but fallible** → **Leaf 6: Evidence Externalist**  
      │   └─ **Weak and provisional** → **Leaf 3: Fallibilist**  
      └─ **Q5: No** → Q7  
          ├─ **Prioritize research** → **Leaf 7: Pragmatic Instrumentalist**  
          ├─ **Guide intuition** → **Leaf 8: Heuristic Expressivist**  
          └─ **Shouldn’t be used** → **Leaf 9: Purist**  
  ```  

  ---

  #### **Occupied Leaves (Positions)**  
  1. **Bayesian Realist**  
     - *Awkward Commitment*: Must explain how logical truths (e.g., "twin primes are infinite") can hold rational credences <1 without empirical data.  
  2. **Revisionist Bayesian**  
     - *Awkward Commitment*: Must justify why model failures (e.g., Maier’s theorem) only locally affect credence—not other model-based conjectures.  
  3. **Fallibilist**  
     - *Awkward Commitment*: Must reconcile "evidence" with math’s deductive nature without assigning probabilities.  
  4. **Contextualist**  
     - *Awkward Commitment*: Needs clear criteria for "nearby" conjectures to avoid arbitrariness.  
  5. **Dogmatic Modeler**  
     - *Awkward Commitment*: Must explain why model failures (e.g., Maier) don’t undermine confidence in *any* model-based conjecture.  
  6. **Evidence Externalist**  
     - *Awkward Commitment*: Must show how non-deductive evidence can be "strong" absent proof.  
  7. **Pragmatic Instrumentalist**  
     - *Awkward Commitment*: Must defend why prioritization isn’t epistemically significant if heuristics track truth.  
  8. **Heuristic Expressivist** (unnamed but coherent)  
     - *Awkward Commitment*: Must argue that intuition-guiding fictions (e.g., "random primes") needn’t resemble mathematical reality.  
  9. **Purist**  
     - *Awkward Commitment*: Must explain why mathematicians’ heuristic-based confidence (e.g., in Riemann Hypothesis) often tracks truth.  

  ---

  #### **Unoccupied Branches & Diagnoses**  
  - **Q3 → Ontological → Q4 → No** (Credence updates on failure but not success):  
    - *Diagnosis*: **Incoherent**. If independence is ontological, successful predictions *must* boost confidence.  
  - **Q2 → None → Q3 → Ontological** (No sensitivity to failure + ontological commitment):  
    - *Diagnosis*: **Unattractive**. Ignores clear counterevidence (e.g., Maier) while insisting the model reflects truth.  
  - **Q1: No → Q5: No → Q7: Guide intuition → Q8: Yes** (Heuristics as intuition-pumps that must track truth):  
    - *Diagnosis*: **Neglected**. Few defend "intuition-guiding" as truth-revealing while denying all evidence.  

  ---

  #### **Same Answers, Different Attitudes**  
  - **Fallibilist (Leaf 3) vs. Evidence Externalist (Leaf 6)**: Both say heuristics provide evidence (Q5: Yes), but the *Externalist* sees it as quasi-empirical (Q6: Strong), while the *Fallibilist* sees it as provisional (Q6: Weak).  
  - **Pragmatic Instrumentalist (Leaf 7) vs. Heuristic Expressivist (Leaf 8)**: Both deny evidence (Q5: No) and use heuristics for non-evidential reasons (Q7: Prioritize/Guide intuition), but the *Pragmatist* treats outputs as testable, while the *Expressivist* treats them as imaginative tools.  

  ---  
  **Format**: Two-page PDF ready (copy this text). Designed for clarity—students answer questions first, discover positions later.  
  **American English**: Consistent (e.g., "prioritize," "credence," "modeling").
