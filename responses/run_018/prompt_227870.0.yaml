  - Leaf 3: Fallibilist (no credence but evidence, update nearby, methodological, qualified warrant) 
  - Leaf 4: Pragmatic (no evidence, prioritization, failures might affect, methodological, warrant for prioritization) 
  - Leaf 5: Purist (no evidence, no effect, irrelevant, no warrant) 
  - Leaf 6: Methodological Instrumentalist? Maybe under Q5 if evidence but not credence, but different from Fallibilist? 

