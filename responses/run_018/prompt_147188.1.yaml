answer: |-
  ## Research Proposal: The Ethics of Inherited Navigational Speech - Renaming Streets vs. Removing Statues

  **1. Research Question and Stakes (Approx. 400 words)**

  This proposal asks a precise, under-examined question: **Does the *functional embeddedness* of street names – their role as indispensable, daily-use navigational coordinates within a practical network – create a distinct ethical obligation to rename them when the commemorated figure becomes discredited, compared to the obligation to remove a purely commemorative statue?** The core stakes lie in resolving an ethical asymmetry obscured in current debates.

  Statues function primarily as symbols; their removal (or relocation) alters visual space and symbolic meaning but causes minimal practical disruption to daily life systems. Street names, conversely, are "inherited navigational speech": they are simultaneously commemorative *and* deeply embedded functional labels within vital networks (addressing, navigation, emergency services, commerce). This duality creates unique ethical pressures absent with statues. Leaving a discredited name forces residents to *repeatedly invoke* that figure in mundane, necessary communication, embedding the problematic narrative into the fabric of daily existence. Renaming, however, carries significant practical costs – disruption to wayfinding, logistics, record-keeping, and civic infrastructure – creating a "practical discontinuity" not present with statue relocation.

  The specific stakes involve clarifying the moral calculus:
  *   **Harm:** Does forced daily invocation constitute a distinct, pervasive harm compared to encountering a statue?
  *   **Consent:** Does the necessity of using the name for basic orientation intensify the lack of consent to the imposed narrative?
  *   **Narrative Integrity:** Does renaming a street inherently create a different kind of "semantic rupture" in the collective narrative than removing a statue, especially if replaced with non-heroic, discontinuity-marking labels?
  *   **Intergenerational Obligation:** Does inheriting a *functional* system laden with problematic commoration create a stronger duty to alter it than inheriting a purely symbolic one?

  Answering this question moves beyond the simplistic "keep or remove" binary and provides a principled framework for ethically assessing one of the most common, yet functionally unique, forms of public commemoration.

  **2. Why Existing Debates Leave the Question Open (Approx. 400 words)**

  Current public and academic discourse consistently fails to address this core distinction, leaving the ethical question genuinely unresolved:

  *   **Conflation of Monument Types:** Debates overwhelmingly treat "monuments" as a homogeneous category, applying arguments about historical preservation, erasure, harm, or symbolic power equally to statues, street names, plaques, and buildings. This ignores the fundamental difference between an object *observed* and a label *used* as a practical necessity. Arguments about "erasing history" apply differently when the "history" is embedded in daily speech required for essential services versus displayed in a public square.
  *   **Oversimplified Frameworks:** Dominant ethical arguments cluster around three poles, none of which adequately grapple with functional embeddedness:
      *   *Harm-Based:* Focuses on offense, trauma, or perpetuating oppression, but doesn't distinguish between the *passive* harm of seeing a statue and the *active*, repeated harm of *using* a name for practical tasks.
      *   *Historical Integrity:* Emphasizes preserving the past "as it was," but fails to address how inherited functional labels *enforce* a specific historical narrative through present-day use, unlike a statue which can be contextualized *in situ* or in a museum without disrupting daily life.
      *   *Consent/Autonomy:* Highlights the lack of choice in inheriting commemorative landscapes, but doesn't analyze how this lack of consent is *exacerbated* when the commemoration is embedded within essential, unavoidable practical systems like navigation and addressing.
  *   **Neglect of Practical Discontinuity:** The significant practical costs and systemic disruption inherent in renaming streets – the "semantic rupture" affecting maps, databases, and lived experience – are rarely weighed as a distinct ethical factor compared to the logistical ease of moving a statue. The temporal asymmetry (vanishing name vs. relocatable object) is ignored.
  *   **Absence of "Navigational Speech" Concept:** The unique dual nature of street names as commemorative *and* functional, binding users into a narrative through necessity, lacks a recognized conceptual framework within monument ethics.

  Consequently, decisions about street renaming often borrow justifications developed for statues, resulting in misapplied arguments and unresolved tensions around the specific burdens and costs unique to navigational labels.

  **3. Conceptual Approach, Taxonomy, and Inadequacy of Alternatives (Approx. 600 words)**

  This project adopts a rigorously *conceptual* approach, constructing a taxonomy based on **practical embeddedness** – the degree to which a commemorative object is integrated into essential, non-optional functional systems of daily life. This taxonomy will serve as the analytical scaffold:

  1.  **Pure Display (e.g., Statues, Plaques, Freestanding Monuments):** Primary function is symbolic commemoration or aesthetic display. Encounter is generally optional (one can avoid a square) or passive. Removal/relocation primarily affects symbolic meaning and visual landscape; practical disruption is minimal and localized. *Ethical weight* centers on symbolic power, historical representation, and visual presence/absence.
  2.  **Navigational Labels (e.g., Street Names, Neighborhood Names, Bridge Names):** Primary function is providing essential spatial orientation and addressing within a network. Commemoration is secondary but pervasive. Use is non-optional for residents and services (navigation, mail, emergencies). Removal (renaming) causes significant "practical discontinuity" – systemic disruption to wayfinding, databases, logistics, and civic infrastructure. *Ethical weight* adds the burdens of *forced invocation* and *integration into daily practice* on top of symbolic concerns, alongside the costs of discontinuity.
  3.  **Institutional Addresses (e.g., School Names, Library Names, Government Building Names):** Hybrid category. Function involves identification and wayfinding, but often tied to specific, visitable institutions. Commemoration is prominent. Removal (renaming) causes moderate practical disruption (updating records, signage, institutional identity) and potential forced invocation within the institutional context. *Ethical weight* blends symbolic power with institutional identity and moderate functional disruption.

  The core comparison will be between **Pure Display (Statues)** and **Navigational Labels (Street Names)**, with Institutional Addresses noted as a potential point of extension or contrast.

  **Why this approach?** It directly targets the functional distinction identified as the crux of the ethical difference. It provides a precise vocabulary ("practical embeddedness," "forced invocation," "practical discontinuity," "inherited navigational speech") absent in current discourse.

  **Why Historical Survey is Inadequate:** While examples might illustrate points, cataloging specific renaming campaigns (e.g., Rhodes Must Fall, Confederate renamings) focuses on contextual *outcomes* and political dynamics, not the underlying *conceptual structure* of the ethical dilemma posed by functional embeddedness. It risks getting lost in historical particulars rather than isolating the variable of interest.

  **Why Legal Framing/Property Rights is Inadequate:** Arguments about who "owns" public space, free speech, or historical preservation ordinances address the *process* and *authority* for change, not the core *ethical justification* for change *specific to the object type*. Legal permissibility does not equate to ethical obligation, and legal frameworks often fail to distinguish between monument types in their reasoning.

  The ethical analysis will apply three standard frameworks – **Harm-Based, Consent/Autonomy-Based, and Narrative Integrity-Based** – systematically across the taxonomy categories. The key test is whether these frameworks yield *different* or *differently weighted* conclusions when applied to Pure Display vs. Navigational Labels, specifically due to the factors of forced invocation and practical discontinuity. This will involve examining if the concept of **intergenerational obligation** – particularly the burden of inheriting and being forced to *operate within* a functional system laden with problematic commemoration – provides a compelling explanation for the distinct ethical pressure felt around street names, beyond simple harm or historical erasure concerns.

  **4. Defining Success, Failure, and Inconclusiveness (Approx. 500 words)**

  **A successful outcome** for this conceptual project would be:

  1.  **A Clear, Defensible Taxonomy:** A well-articulated and justified taxonomy of commemorative objects based on practical embeddedness (Pure Display, Navigational Label, Institutional Address), demonstrating its relevance beyond the statue/street name comparison.
  2.  **Demonstrated Ethical Divergence:** Clear articulation of *how* and *why* the application of Harm, Consent, and Narrative Integrity frameworks leads to systematically different ethical prescriptions or weightings when comparing Pure Display (statues) and Navigational Labels (street names). Specifically:
      *   Showing that forced invocation constitutes a *distinct type or intensity of harm*.
      *   Showing that the lack of consent is *exacerbated* by the necessity of use within a functional system.
      *   Showing that practical discontinuity is a *distinct ethical cost* of renaming absent in statue removal.
      *   Showing that narrative integrity arguments play out *differently* due to the functional integration (e.g., does leaving the name signal passive acceptance more profoundly?).
  3.  **Validation of "Inherited Navigational Speech":** Establishing that the concept meaningfully captures the unique ethical tension of street names and explains why they feel distinct, without collapsing into purely symbolic harm or purely practical inconvenience arguments. Demonstrating that the intergenerational obligation lens illuminates this distinctness.
  4.  **Identification of Cruxes:** Pinpointing the precise conceptual points where the ethical frameworks diverge most significantly based on embeddedness (e.g., the pervasiveness of harm via invocation, the weight of practical discontinuity vs. symbolic erasure).
  5.  **Framework for "Semantic Rupture":** Providing a preliminary conceptual basis for evaluating whether renaming *should* aim for discontinuity (non-heroic, functional, or rupture-marking names) rather than simple substitution, especially for Navigational Labels.

  **Failure** would occur if:
  *   The taxonomy proves incoherent or fails to meaningfully distinguish object types relevant to the ethical question.
  *   No significant divergence in ethical prescriptions based on embeddedness can be identified or defended using the chosen frameworks – meaning statues and street names are ethically equivalent in this context.
  *   The concept of "inherited navigational speech" adds no explanatory power beyond existing concepts like "symbolic harm" or "practical cost."
  *   The intergenerational obligation lens fails to provide unique insight.

  **Inconclusiveness** is likely if:
  *   The analysis reveals that *some* frameworks show divergence (e.g., Harm) while others do not (e.g., Narrative Integrity), requiring further refinement of the frameworks or the taxonomy.
  *   The ethical weight of practical discontinuity vs. forced invocation remains deeply contested and resistant to clear comparative analysis within the scope.
  *   The project successfully identifies the *potential* for distinct obligations but cannot definitively establish their relative strength or provide clear criteria for action without introducing normative commitments beyond the scope.

  Success is measured not by providing definitive policy answers, but by clarifying *whether* and *how* functional embeddedness changes the ethical landscape, pinpointing the conceptual levers that drive the difference, and establishing a more nuanced vocabulary for future debate and decision-making.

  **5. Scope, Deliverables, Timeline, and Key Risk (Approx. 400 words)**

  **Realistic Six-Month Scope:**
  *   Months 1-2: Deep conceptual development: Refining definitions (practical embeddedness, forced invocation, practical discontinuity, inherited navigational speech, semantic rupture), constructing and justifying the taxonomy. Articulating the core intergenerational obligation argument.
  *   Months 3-4: Systematic application of the three ethical frameworks (Harm, Consent, Narrative Integrity) to the "Pure Display" (statue) category, establishing a baseline.
  *   Months 4-5: Systematic application of the same three frameworks to the "Navigational Label" (street name) category, explicitly identifying points of convergence and divergence with the Pure Display analysis, driven by the factors of forced invocation and practical discontinuity. Preliminary analysis of "semantic rupture" concept.
  *   Month 6: Synthesis: Consolidating findings on ethical divergence, evaluating the explanatory power of the taxonomy and "inherited navigational speech," identifying unresolved conceptual cruxes, outlining implications. Drafting the proposal plan/discussion paper.

  **Deliverables:**
  *   A **Proposal Plan / Conceptual Discussion Paper** (approx. 4000-5000 words). This is *not* a finished ethical argument but a map of the conceptual territory. It will:
      *   Present the refined taxonomy and core concepts.
      *   Summarize the comparative ethical analysis across frameworks and object types.
      *   Articulate the case for (or against) distinct ethical obligations based on embeddedness.
      *   Identify the specific points of conceptual divergence ("cruxes").
      *   Outline the remaining conceptual work needed to solidify or refute the core hypothesis.
      *   Suggest how this framework could inform future empirical or normative research.
      *   Discuss the preliminary implications for the "semantic rupture" idea.

  **Biggest Conceptual Risk: The Breadth of "Narrative Burdens"**
  The most significant risk lies in the potential scope and vagueness of the "narrative burden" aspect of inherited navigational speech and the intergenerational obligation framework. Defining the precise nature and ethical weight of being "bound into a narrative" through practical necessity, distinct from symbolic harm or offense, is inherently challenging. This concept could easily balloon into a vast exploration of collective memory, identity formation, and the ontology of public space, far exceeding the project's scope. **Mitigation Strategy:** Strictly tether the analysis to the specific factors identified: *forced invocation* (the act of using the name) and *functional integration* (the necessity of the system). Focus the intergenerational obligation argument narrowly on the burden of inheriting and being forced to *operate* a functional system laden with problematic commemoration, rather than inheriting identity or historical interpretation more broadly. Explicitly acknowledge the limits of this conceptualization within the proposal plan.
