  **Project Proposal MCAG-7742: Permanent Decommissioning of the Lyceum Repertory Theatre and Implementation of the Geneva Model for Civic Self-Amusement**  
  Submitted by the Geneva Society for the Abolition of Passive Spectatorship (GSAPS)  
  To the Ministry of Civic Amusement, Division of Structural Engagement  

  **Executive Summary:**  
  The Geneva Society for the Abolition of Passive Spectatorship (GSAPS) requests **₣187,500** to permanently decommission the Lyceum Repertory Theatre (capacity: 450 seats) and replace its programmed 2024-2025 season with the inaugural phase of the *Continuous Civic Festival Initiative (CCFI)*. This project addresses the systemic civic atrophy perpetuated by architecturally enforced spectatorship. By dissolving the Lyceum’s physical and psychological barriers to collective action, CCFI will transform a site of moral hazard into an engine of authentic public virtue. The proposal eliminates persistent arts-policy challenges—audience diversification, accessibility, community engagement, representational equity—by eradicating the conditions that render them necessary: the hierarchical spectacle itself.

  **Project Narrative:**  
  The Lyceum Theatre currently functions as a civic pathogen. Its proscenium arch, raked seating, and ticketing apparatus institutionalize a binary of active performer and passive spectator. This division cultivates three linked pathologies:  
  1.  **Moral Contagion Through Artificial Identification:** Spectators absorb simulated emotions from professionally crafted characters, substituting vicarious catharsis for genuine civic feeling.  
  2.  **Professionalized Deceit:** Actors, compensated for emotional fabrication, become vectors of inauthenticity, normalizing dissimulation as a public good.  
  3.  **Privatized Engagement:** The darkened auditorium isolates citizens in individual emotional responses, replacing communal bonds with solitary consumption.  

  CCFI resolves these by operationalizing the superior model of unstructured, participatory festivity. The Lyceum’s stage, seating, and backstage areas will be demolished to create a singular, level *Civic Agora*. This space will host weekly, thematically open festivals where distinctions between "artist" and "audience," "performer" and "citizen," dissolve.  

  *   **Addressing Audience Diversification:** Current efforts focus on recruiting diverse bodies into static spectator roles or onto stages to enact scripted fictions. CCFI achieves true equity by eliminating *all* roles requiring representation. When no one performs predefined characters, the anxiety of "inclusive casting" becomes obsolete; every citizen is present solely as themselves, engaged in collective action (dancing, singing, spontaneous oration).  
  *   **Solving Accessibility:** Traditional accessibility measures (ramps, subsidized tickets) merely facilitate entry into a fundamentally exclusionary structure: the spectacle. CCFI guarantees universal access by destroying the architecture of separation. The Agora’s flat, open design ensures full physical and social permeability. Participation requires only presence, rendering tiered pricing or sightline adjustments unnecessary.  
  *   **Ensuring Community Engagement:** Scripted theater "engages" communities by soliciting reaction to predetermined narratives. CCFI generates engagement through unmediated co-creation. Festivals have no script, director, or defined outcome; meaning emerges from the collective activity itself, ensuring investment is inherent, not solicited.

  **Methodology & Timeline:**  
  *   **Phase 1 (Month 1-2): Structural Decommissioning.** Demolition of theatrical infrastructure.  
  *   **Phase 2 (Month 3): De-Professionalization & Civic Re-Orientation.** Stipends provided to former Lyceum artists/staff to unlearn spectacle-based practices and transition to facilitation roles within the Agora (see Budget).  
  *   **Phase 3 (Month 4-12): CCFI Implementation.** Weekly Civic Festivals. GSAPS facilitators will seed activities (communal singing circles, large-scale collaborative mural creation, open-air debate platforms, mass folk dancing) but enforce no structure. Citizen initiative dictates all proceedings. Continuous ethnographic documentation will measure civic cohesion metrics.

  **Detailed Budget (₣187,500):**  
  *   **Structural Transformation (₣82,000):**  
      *   Proscenium Arch & Stage Demolition (Symbolic Core Removal): ₣25,000  
      *   Seating Removal & Floor Leveling (Creating the Agora): ₣32,000  
      *   Installation of Permanent, Resilient Collective Dance Surfaces (Non-Slip, All-Weather): ₣25,000  
  *   **De-Professionalization & Transition (₣63,500):**  
      *   Stipends for 15 Former Actors/Technicians (6 months, facilitating unscripted co-creation, *not* performing): ₣45,000 (₣500/mo each)  
      *   "Unlearning Spectacle" Workshops (Led by GSAPS Ethicists): ₣8,500  
      *   Procurement of Non-Directive Facilitation Tools (Basic Rhythmic Instruments, Shared Art Supplies): ₣10,000  
  *   **Festival Activation & Documentation (₣42,000):**  
      *   Weekly Festival Seed Materials (Biodegradable Decor, Basic Sustainance Kits): ₣24,000  
      *   Civic Cohesion Metrics Tracking (Ethnographer Fees, Public Sentiment Analysis): ₣18,000  

  **Risk Assessment & Mitigation:**  
  Potential objections confirm the necessity of CCFI, revealing deep dependency on the spectacle-model:  
  1.  **Performer Unemployment:** Objections prioritize professionalized deceit as legitimate labor. Stipends mitigate immediate hardship while transitioning individuals towards authentic civic contribution. Risk is not unemployment, but continued employment in moral corruption.  
  2.  **Loss of Cultural Heritage:** Lamenting the loss of scripted repertoire assumes value resides in preserved fictions rather than living civic action. The heritage cultivated—communal joy, spontaneous virtue—is superior and inherently renewable.  
  3.  **Audience Boredom:** Fear of citizen incapacity for self-amusement exposes the profound atrophy caused by passive consumption. Initial discomfort is detoxification; true engagement emerges through active necessity. Boredom is the symptom leaving the body.  
  4.  **Diminished Tourist Revenue:** This metric exemplifies the conflation of economic activity with civic health. CCFI cultivates an immaterial, non-exportable good: authentic communal bonds among residents. Tourism based on spectacle is tourism based on falsehood; its loss is net civic gain.  

  **Conclusion:**  
  The Lyceum Repertory Theatre stands as a monument to civic alienation. Funding its transformation into the Civic Agora is not merely an arts grant; it is an investment in radical public hygiene. The CCFI operationalizes a model where virtue arises not from watching virtue performed, but from the unmediated exercise of collective joy and action. By rejecting the spectator’s structural position as inherently corrupting, this project resolves the intractable dilemmas of contemporary cultural policy at their root. We urge the Ministry to fund not another season of palliative representation, but the surgical removal of the tumor itself. The cure for the sickness of spectatorship is to cease being spectators.
