  Also, considering the historical context. Mingjia was concerned with language-reality gaps. Gongsun Long's point is logical, not metaphysical. He's showing how compound terms change reference. The user might benefit from distinguishing Mingjia's approach from Western mereology, which deals with parts and wholes differently.

