    "detached_perspective_role": "Corrective mechanism for positional bias; enables objective assessment of outcomes and fiduciary responsibilities by filtering relational emotions.",
    "mediation_effect": "Written appeal reduces emotional immediacy, favoring cognitive empathy over affective resonance, thus weakening fellow-feeling's intensity but not its moral relevance.",
    "assessment": "Organizational benefit should prevail. Reasoning: (a) Board members hold fiduciary duties to beneficiaries; (b) Restructuring doubles impact with disproportionate benefit vs. harm; (c) Friendship obligations, while valid, cannot override institutional purpose; (d) Moral duty includes mitigating harm to the friend through non-voting means."
