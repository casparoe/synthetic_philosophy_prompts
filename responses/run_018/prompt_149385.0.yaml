  2) Memory retention - Hyde remembers Jekyll's life unlike split-brain patients where hemispheres don't share memories
  3) Narrative framing - Jekyll's confession letter mirrors left-hemisphere confabulation but with full awareness of Hyde's actions

  The horror angle interests me most. That detached observation where Jekyll watches Hyde's actions? That's where the split-brain analogy shines - it's like the left hemisphere rationalizing alien actions from the right. But the breakdown comes when Hyde independently writes checks and navigates Jekyll's home, showing integrated memory access impossible in real split-brain cases.

