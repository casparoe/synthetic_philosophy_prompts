prompt: |-
  I sit on my town's civic-participation review board and we gotta decide by next wednesday whether our public-hearing rules should let religious citizens ground objections to zoning changes in scriptural authority, or force them to reframe everything in secular terms. One faction says Rawlsian public reason is basically dead on arrival; the other says letting scripture into the record corrupts democratic equality. Draft the short memo I'll circulate before Thursday's vote: recommend one concrete rule-change with a 30-day rollout, engage seriously with the best argument on the losing side, and don't include any reading lists or citations. Format it as exactly five numbered points, each just a sentence or two, with no intro or conclusion. Make sure you address the covenantal reciprocity worry our local pastor raised—that religious citizens owe secular translations only if the state owes them religious accomodation in return—without treating it as a strawman.
reasoning: |-
  Okay, the user is on a civic board and needs a memo by Thursday to decide whether religious citizens can use scripture in zoning hearings. They need a concrete rule with a 30-day rollout. The memo has to be five numbered points, no intros or conclusions, and address the pastor's reciprocity concern without strawmanning it. 

  Hmm, the core tension here is between Rawlsian public reason (secular-only arguments) versus inclusive pluralism. The pastor's point about covenantal reciprocity is tricky—it suggests religious citizens might translate arguments only if the state accommodates them in return. Need to treat that seriously, not dismissively.

  The user probably wants practical governance that respects both equality and religious expression. They might be worried about alienating either faction on the board. The memo should bridge divides by giving religious voices space while keeping hearings accessible to all. 

  For the rule-change: allowing scripture but requiring a secular impact statement seems balanced. It meets the pastor's reciprocity concern by offering accommodation (letting scripture in) while ensuring democratic equality (via the translation). The 30-day rollout is doable—training staff and updating forms isn't overly complex. 

  Biggest risk? Someone might see the "secular impact" requirement as coercive. But framing it as a "brief statement" for accessibility, not censorship, should help. Also, the losing side (Rawlsians) gets acknowledged—their worry about scripture eroding public discourse is valid, but pluralism doesn’t have to mean chaos if structured right. 

  Final memo structure: 
  1. Rule change (allow scripture + secular impact) 
  2. Address reciprocity (state accommodation enables translation) 
  3. Reassure secular-equality advocates (hearing integrity preserved) 
  4. Rollout steps 
  5. Why not stricter secular framing (losing side’s valid concern, but tradeoff worth it)
answer: |-
  **MEMORANDUM**  

  1. **Rule Change Recommendation**: Amend Section 4(b) of Public Hearing Procedures to permit citing scriptural authority in testimony, provided the speaker *also* submits a brief accompanying statement (oral or written) summarizing the objection’s tangible community impact (e.g., safety, welfare, environment) in accessible secular terms.  

  2. **Addressing Covenantal Reciprocity**: We acknowledge Pastor Miller’s concern that demanding unilateral secular translation ignores the state’s duty to accommodate sincere belief; thus, our rule *grants* accommodation (scripture in the record) while asking religious citizens to *meet* the state halfway via supplemental secular framing—fulfilling reciprocity without coercion.  

  3. **Preserving Democratic Equality**: While critics warn scripture could marginalize non-believers, the dual-submission requirement ensures objections enter the legal record *only* via secular impacts—the sole basis for board decisions—retaining fairness while honoring expressive liberty.  

  4. **30-Day Rollout Plan**: Staff will train hearing officers (Week 1), update speaker intake forms with dual-submission instructions (Week 2), conduct a mock hearing (Week 3), and implement the revised rule with multilingual signage by Day 30.  

  5. **Losing Side’s Valid Concern**: Advocates for strict secular framing rightly fear privileging religious language might distort deliberative equity; however, excluding it risks deeper alienation, whereas our hybrid approach leverages translation to *bridge* divides—not erase them.
