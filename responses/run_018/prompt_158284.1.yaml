prompt: |-
  I've been trying to map out some open conceptual problems in Scanlon-style contractualism for a seminar paper I'm writing with pretty limited acces to books, and I'm particularly stuck on aggregation when the groups being compared aren't cleanly separated. The usual debate sets up one person bearing a huge burden against five people each bearing small ones, but I'm interested in messier cases where membership overlaps—like comparing a principal that saves four people in set A but imposes costs on two people who are also in set B, versus an alternative that saves three in B but spares those same two. Because contractualism asks what each affected person could reasonably reject, these overlaps seem to scramble the pairwise comparison structure, and I'm genuinely unsure whether the standard pairing objection applies the same way or collapses into something different altogether.

  I don't need citations or a reading list since I'm working offline, but I want to know where to put my energy over the next few months. Among the issues of pairing under overlap, whether aggregate burdens can be decomposed into individual reasons for rejection, and how to handle non-transitive patterns of reasonable rejection, which are actually upstream? Which ones, if settled, would change how contractualism applies to real policy tradeoffs versus being purely academic? Give me a defended ranking with reasoning about tractability and downstream importance, not just a survey. Please keep it all in continuous prose—no headings, bullet points, bold text, or tables, like you'd write in an email. Oh and I keep mixing up Scanlon's idea of reasonable rejection with Rawlsian reasonableness, so feel free to correct that if it messes with the framing.
