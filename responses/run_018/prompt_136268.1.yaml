  For the ranking: Standing mechanisms should come before temporal boundaries because even if we declare future generations "included", without enforcement it's performative. Then functional boundaries - AI is hot but premature until we solve how non-humans could possibly have standing. Third, operationalizing all-affected/all-subjected, but only after untangling their inclusion versus standing dimensions.

