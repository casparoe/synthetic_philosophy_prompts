answer: |-
  That's an exceptionally sharp critique of a genuine tension in analytic philosophy. The practice of bracketing Frege's repugnant late diaries **does** rely on specific, often unexamined, philosophical commitments. Let's dissect the implicit theories smuggled in:

  1.  **The Strong Autonomy of Formal Systems & Logic:**
      *   **Commitment:** This assumes that logical systems and mathematical truths exist in a realm fundamentally separate from the contingent, messy world of human psychology, politics, and history. Logic is seen as *discovered* (like physical laws), not *invented* or *constructed* in a way deeply shaped by the discoverer's worldview.
      *   **Presupposition:** The validity of a logical proof or a formal system like *Begriffsschrift* is entirely determined by its internal syntactic rules and semantic definitions, not by the beliefs or motivations of its creator. The system "speaks for itself" once constructed.
      *   **Defense:** A defender might argue that "2+2=4" or *modus ponens* remains true and valid regardless of who states it or what horrible things they believe. The *content* of logic/math is independent of the *container* (the thinker).

  2.  **A Robust Context of Discovery vs. Context of Justification Distinction:**
      *   **Commitment:** This classic distinction (often associated with Reichenbach, though debated) holds that *how* an idea is arrived at (discovery - messy, psychological, potentially influenced by bias) is irrelevant to its *logical validity* or *epistemic justification* (justification - subject to objective, logical/rational scrutiny).
      *   **Presupposition:** The racist ideology present in Frege's diaries belongs solely to the context of discovery. The *arguments* for logicism or the sense/reference distinction reside entirely in the context of justification and must be evaluated solely on their own logical and philosophical merits.
      *   **Critique:** As you astutely note, the distinction becomes incredibly shaky when the "discovery" involves explicit, virulent ideology that may have shaped the *framing*, *motivations*, or even *excluded possibilities* within the supposedly pure "justification." Can the two contexts be so neatly severed if the ideology potentially influenced *what was seen as a problem worth solving* or *what counted as a satisfactory foundation*?

  3.  **Rejection of Pervasive Epistemic Contamination (or its irrelevance to formality):**
      *   **Commitment:** This presupposes that holding vicious beliefs (racism, nationalism) does *not* necessarily warp judgment in *all* cognitive domains, especially highly formal, abstract ones like logic and foundations of mathematics. It assumes a kind of cognitive firewall or compartmentalization is possible.
      *   **Presupposition:** Even if epistemic contamination exists in other areas (e.g., history, sociology), the rigorous, rule-bound nature of formal logic provides immunity. Logic operates on a different epistemic plane.
      *   **Defense:** A defender might concede *possible* contamination in *interpretation* or *application* of logic, but deny it affects the *core formal structure itself*. They might argue that while Frege's *motivation* for seeking absolute certainty might stem from problematic anxieties about cultural purity, the *logical tools* he developed to pursue it are separable and objectively valid.
      *   **Collapse?** If one takes pervasive epistemic contamination seriously (e.g., standpoint theory, some virtue epistemologies, critical theory), the bracketing *does* become highly questionable. Could Frege's nationalism have subtly shaped:
          *   His drive for absolute foundations and certainty (a bulwark against perceived cultural decay)?
          *   His conception of "objectivity" as radically detached from human subjectivity (a rejection of the "subjective" other)?
          *   His focus on *individual* senses and references, potentially downplaying communal or contextual aspects of meaning?
          *   *What problems he ignored*? Did his ideological blinders prevent him from seeing alternative approaches or limitations?

  4.  **Formalism as a Shield: Why Frege is Treated Differently:**
      *   **Commitment:** Yes, Frege *is* often treated differently than, say, Heidegger or even Wittgenstein, precisely because his core contributions are seen as purely *formal* and *technical*.
      *   **Presupposition:** The more formal, abstract, and seemingly context-independent the work, the easier it is to argue for its separation from the author's biography and politics. Heidegger's philosophy is deeply intertwined with concepts like "historicity," "authenticity," and "Being," making it harder to disentangle from his Nazism. Frege's *Begriffsschrift* or quantification theory feels more like a mathematical tool.
      *   **Inconsistency?** This *is* arguably inconsistent. Figures like Carl Schmitt (legal theory) or even Newton (theology/alchemy) often have their non-core ideas bracketed to varying degrees. However, the *intensity* of the separation and the *dismissiveness* towards even *inquiring* about connections seems strongest around figures like Frege in the analytic tradition. This reflects the tradition's self-conception as dealing with timeless, objective truths accessible through reason alone.

  5.  **The Implicit Theory of Philosophical Knowledge:**
      *   **Smuggled In:** The bracketing practice presupposes a **strongly rationalist, objectivist, and ahistorical conception of philosophical (especially logical and mathematical) knowledge.**
      *   **Key Tenets:**
          *   **Objectivity as Radical Detachment:** True knowledge, especially formal knowledge, is achieved by transcending the particularities of the knower (history, culture, embodiment, politics).
          *   **Universalism & Necessity:** Logical and mathematical truths are universal, necessary, and accessible to any rational mind, irrespective of background.
          *   **The Genetic Fallacy Taboo:** Any suggestion that the *origin* of an idea (especially biographical or ideological) has bearing on its *truth* or *validity* is seen as committing the genetic fallacy. Evaluation must be purely "internal."
          *   **Knowledge as Propositional & Systemic:** Knowledge resides primarily in the content of propositions and the structure of systems, not in the knower's situatedness or practices.
          *   **Minimal Role for Context:** Context (historical, social, biographical) is relevant only for understanding genesis or reception, but *not* for evaluating the truth-content or validity of the formal work itself.

  **Does the Practice Collapse?**

  It doesn't necessarily *collapse* entirely, but it becomes **philosophically contested and requires robust defense rather than casual assertion.**

  *   **For the Defender:** They must argue for a strong version of logical autonomy and the robustness of the discovery/justification distinction *even in the face of explicit, vicious ideology*. They must maintain that the formal core is genuinely immune. This commits them to a Platonistic or strongly rationalist view of logic/math.
  *   **For the Critic:** The bracketing becomes unsustainable if:
      1.  You accept pervasive epistemic contamination.
      2.  You reject a sharp discovery/justification split (seeing justification as also historically situated).
      3.  You adopt a more holistic, contextualist, or naturalized view of epistemology/logic (e.g., seeing logic as a human practice evolving within history/culture).
      4.  You find evidence that the ideology *did* meaningfully shape core concepts, motivations, or exclusions within Frege's formal work (this is the hardest evidence to establish conclusively, but plausible connections can be argued).
      5.  You see the *practice* of bracketing itself as ethically problematic, sanitizing a figure and potentially ignoring how the *culture* of logicism might subtly reflect or enable exclusionary tendencies (e.g., the myth of pure objectivity).

  **Conclusion:**

  The casual bracketing of Frege's diaries isn't philosophically neutral. It implicitly endorses a specific, highly rationalist, objectivist, and ahistorical theory of knowledge, particularly concerning formal systems. It assumes logic operates in a realm immune to the epistemic corruption that might affect other domains and relies heavily on a strict separation between how ideas are born and how they are judged. While defensible within that framework, the practice is vulnerable to critiques from perspectives that emphasize the situatedness of all knowledge, the potential for pervasive bias, and the interconnectedness of intellectual projects with the cultural and political milieu of their creators. Calling the diaries merely "biographically interesting but philosophically irrelevant" isn't a simple observation; it's an assertion of a specific, and increasingly debated, epistemology.
