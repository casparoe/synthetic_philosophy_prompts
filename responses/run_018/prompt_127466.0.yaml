answer: |-
  Here's a concise taxonomy of positions on advance directives and personal identity, structured as requested:

  **Root Node:** Does the earlier self retain authority over the later self after severe cognitive change? (e.g., advanced dementia or total personality replacement)

  *   **Branch 1: YES, Authority Persists** (Source of Authority)
      *   *Node 1.1: Contractual Autonomy* (Binding promise/contract)
          *   **Leaf: Binding Autonomy View** (Standard)
              *   *Awkward Commitment:* Obligates a later self with radically different values (e.g., post-stroke personality reversal) to follow directives they now vehemently oppose.
      *   *Node 1.2: Narrative Continuity* (Persisting identity via life story)
          *   **Leaf: Narrative Identity View** (Standard)
              *   *Awkward Commitment:* Forces treatment refusal on a severely demented but content self that experiences simple pleasures, prioritizing the *story's end* over present well-being.
      *   *Node 1.3: Epistemic Deference* (Later self should trust earlier self's value reasoning)
          *   **Leaf: Epistemic Primacy View** (Less Common)
              *   *Awkward Commitment:* Requires a later self (e.g., with dementia retaining emotional warmth but losing abstract values) to defer to reasoning they can no longer grasp or endorse.

  *   **Branch 2: NO, Authority Does NOT Persist** (Why Identity/Authority Fails)
      *   *Node 2.1: Identity Fractured* (Severe change creates a numerically different person)
          *   **Leaf: Psychological Discontinuity View** (Standard)
              *   *Awkward Commitment:* Treats the directive as morally inert (like instructions for a stranger), potentially forcing life-sustaining care on a minimally conscious being the directive sought to prevent.
      *   *Node 2.2: Identity Obscured/Presentist Primacy* (Self persists but only current interests matter)
          *   **Leaf: Strict Presentism** (Standard)
              *   *Awkward Commitment:* Empowers a later self with drastically impaired judgment (e.g., severe paranoia) to override a carefully considered directive against specific treatments.

  *   **Branch 3: Identity FRACTURED, but Authority MAY Persist via Procedural Origin** (Distinguishes content vs. origin)
      *   *Node 3.1: Directive's Procedural Authority Survives Fracture*
          *   **Leaf: Procedural Survivorship View** (Unnamed)
              *   *Awkward Commitment:* Binds a later, entirely different "person" (e.g., after total personality replacement) solely based on the *process* of the earlier self's decision, regardless of content fit.

  **Diagnosing Unoccupied & Indistinct Leaves:**

  1.  **Unoccupied Combination:** "Identity Fractured + Authority Persists via Contract/Narrative." (e.g., Binding Autonomy View applied post-total-personality-replacement).
      *   *Why:* Logically incoherent. If identity is fractured (a different person exists), standard notions of contractual obligation or narrative continuity binding *that new person* collapse. The procedural origin branch (3.1) attempts a workaround but faces severe awkwardness.
  2.  **Unoccupied Combination:** "Identity Obscured + Epistemic Deference Required."
      *   *Why:* Unexplored/Less Attractive. If identity persists but is obscured (e.g., dementia with emotional continuity but lost values), presentists (2.2) prioritize current experience, while epistemic deference (1.3) assumes a persisting agent *capable* of deference. This middle ground is unstable – either the self is present enough to have interests (favoring presentism) or sufficiently continuous to warrant deference (leaning towards Branch 1).
  3.  **Indistinct Leaves:** "Epistemic Primacy View" (1.3) and "Narrative Identity View" (1.2) when identity is obscured but not fractured.
      *   *Why:* In cases like dementia with retained emotional core but lost higher values, it's hard to distinguish whether deference is owed due to shared narrative identity *or* because the earlier self had superior epistemic access to core values. Both often functionally converge here.

  **Key Concrete Cases Used:**
  *   **Dementia with Retained Emotional Continuity:** Tests "obscured identity" vs. fracture; challenges narrative, presentist, and epistemic views.
  *   **Total Personality Replacement (e.g., radical brain change):** Tests "identity fracture"; challenges binding authority views, highlights procedural awkwardness.
  *   **Severely Impaired Judgment (e.g., post-stroke paranoia):** Tests presentism's limits and epistemic deference.
