  We are drafting a joint statement for two philosophers of physics with opposing views on the foundations of quantum mechanics, specifically regarding the interpretation of probability in the context of the Everett (Many-Worlds) interpretation. The scenario is the "Symmetric Splitting Chamber": a quantum system is prepared in an equal superposition of 2^n orthogonal states, and an observer is duplicated into 2^n identical copies, each coupled to one branch. The key point is that the phenomenological coupling strength is uniform across all copies, so subjectively, no copy can distinguish itself based on the amplitude.

  The document should have:

  1. A numbered section of agreed claims.
     - Unitary formalism: deterministic branching produces 2^n copies with equal norm (since the initial superposition is uniform).
     - What demands explanation: why any rational agent should expect experienced frequencies to match the Born rule (|c_i|^2) rather than a uniform distribution across copies.
     - What standard no-go results (like the Deutsch-Wallace theorem or its criticisms) establish and what they leave open.

  2. Precise residual disagreements in wording each side accepts for their own position.
     - Everettian decision-theoretic derivationist (Derivationist): rational betting preferences for self-locating agents uniquely fix the Born measure without circularity.
     - Objective-measure fundamentalist (Fundamentalist): such arguments smuggle in probabilistic utility weights that are not available in a purely deterministic branching ontology, leaving the measure as primitive.

  3. Identify the cruxes (key points of disagreement) and for each crux, specify a concrete conceptual test or argument both sides agree bears on it. Also, record each side's predicted outcome for that test.

  4. Present disagreements in a table format and distinguish verbal from substantive disputes.

  We are to write without bibliographies, etc., and focus solely on the conceptual structure and the Symmetric Splitting Chamber.

  Let's structure the document:

  I. Agreed Claims
     [Numbered list]

  II. Residual Disagreements
     [Each side's formulation in their own words, and then a table for cruxes]

  III. Cruxes and Tests
     [Table format: Crux, Test/Argument, Derivationist Prediction, Fundamentalist Prediction]

  We note that the Symmetric Splitting Chamber is a special case of equal norm, so the Born rule weights are uniform. But the disagreement is about the general case (even though the scenario is symmetric, the principles are at issue for the general case). However, the scenario is designed to be symmetric so that the uniform distribution and the Born rule (which is also uniform) coincide. The question is: why the Born rule in general? And in this symmetric case, why not a uniform distribution over branches? But note: in this symmetric case, both the Born rule and uniform distribution are the same (since |c_i|^2 = 1/2^n for all i). So the disagreement must be about the principle that would extend to non-symmetric cases.

  Therefore, we must frame the disagreement in terms of the general principles, even though the scenario is symmetric.

  Let's draft:

  **Joint Statement on the Foundations of Quantum Mechanics: The Symmetric Splitting Chamber**

  We, a committed Everettian decision-theoretic derivationist (henceforth "Derivationist") and a committed objective-measure fundamentalist (henceforth "Fundamentalist"), after extensive discussion centered on the Symmetric Splitting Chamber scenario, agree on the following claims and present our residual disagreements as follows.

  **I. Agreed Claims**

  1. **Unitary Formalism in the Symmetric Splitting Chamber**: In the Symmetric Splitting Chamber, the initial state is an equal superposition of 2^n orthogonal states. Unitary evolution deterministically leads to 2^n branches, each with equal norm (amplitude magnitude). After the duplication, there are 2^n identical copies of the observer, each associated with one branch, and the phenomenological coupling (i.e., the subjective experience of each copy) is uniform across all copies.

  2. **The Demand for Explanation**: In the Symmetric Splitting Chamber, the Born rule assigns equal probability (1/2^n) to each outcome (branch). However, a uniform distribution over the branches (also 1/2^n) would yield the same numerical probabilities. Despite this numerical coincidence, we agree that the following requires explanation: in a general quantum scenario (with non-uniform amplitudes), why should a rational agent expect their experienced frequencies to align with the Born rule (|c_i|^2) and not with a uniform distribution over the branches (or any other measure)? The fact that in this symmetric scenario the two measures coincide does not obviate the need for a general justification.

  3. **No-Go Results**: We agree that standard no-go results (such as those stemming from the work of Deutsch and Wallace, and their critics) establish that in a deterministic branching universe, one cannot derive probabilistic conclusions without introducing additional principles. However, these results leave open the possibility that such principles (e.g., decision-theoretic axioms or a primitive measure) might be justifiable on independent grounds.

  4. **Subjectivity of the Copies**: In the Symmetric Splitting Chamber, each copy of the observer has an identical subjective experience and no copy has any internal marker or phenomenological difference that would indicate a difference in "weight" or "reality" at the moment of duplication. Therefore, from the subjective perspective of each copy, the situation is symmetric.

  **II. Residual Disagreements in Formulation**

  Each side accepts the following formulation as capturing their own position:

  - **Derivationist Position**: Rational betting preferences for agents facing self-locating uncertainty in branching scenarios, when constrained by consistency requirements (such as those of decision theory), uniquely fix the Born measure (|c_i|^2) as the correct measure for assigning credences and making bets. This derivation does not presuppose probabilistic notions circularly because the decision-theoretic axioms are non-probabilistic and are motivated by considerations of rationality.

  - **Fundamentalist Position**: Arguments that purport to derive the Born rule from decision-theoretic principles necessarily smuggle in probabilistic utility weights or expectations that are not warranted by a purely deterministic branching ontology. In the absence of genuine uncertainty (because all outcomes occur), the only non-arbitrary way to assign weights to branches is by taking the Born measure as a fundamental aspect of the theory. Therefore, the Born measure is primitive and not reducible to decision theory or any other non-probabilistic principle.

  **III. Cruxes and Tests**

  We identify the following cruxes of our disagreement. For each crux, we specify a conceptual test or argument that both sides agree bears on the issue, and we record each side's predicted outcome of that test.

  | Crux | Test/Argument | Derivationist Prediction | Fundamentalist Prediction |
  |------|---------------|--------------------------|---------------------------|
  | **Crux 1: Non-Circular Structure for Self-Locating Uncertainty** Can self-locating uncertainty in a branching universe be given a quantitative, non-circular structure that does not presuppose probability? | Consider an agent with perfect knowledge of the entire Hamiltonian and initial state (including that the universe is Everettian) but no prior probabilistic commitments. The agent is placed in a non-symmetric branching scenario (with unequal amplitudes) and must assign betting odds on which branch they will find themselves in after a branching event. Can the agent, using only non-probabilistic principles of rationality (such as consistency across bets), arrive at unique betting odds that match the Born rule? | Yes: The agent will assign betting odds in accordance with the Born rule by applying decision-theoretic axioms (e.g., invariance under certain transformations, separability over branches, etc.) that do not require probabilistic input. | No: Without a primitive measure, the agent has no basis for assigning any particular betting odds. The decision-theoretic axioms, when examined, either implicitly rely on probabilistic assumptions or do not single out the Born rule uniquely. |
  | **Crux 2: Uniqueness of the Born Measure** Is there a non-probabilistic principle (or set of principles) that can uniquely single out the Born weights as the correct measure for branching? | In the Symmetric Splitting Chamber, both the Born rule and a uniform measure agree. Consider a slight modification: a near-symmetric splitting where the amplitudes are very close to equal (but not exactly equal). Does the agreement of the two measures in the symmetric case provide a reason to extend the uniform measure to the near-symmetric case? If not, what principle forces the Born rule? | The Born rule is uniquely fixed by the requirement of continuity and consistency: as the amplitudes approach equality, the probabilities must approach the same value, and the Born rule is the only measure that is continuous in the amplitudes and satisfies the required additivity and consistency conditions. | Without a fundamental role for the Born measure, there is no reason to prefer continuity in the amplitudes over other considerations. The uniform measure (which ignores amplitudes) would assign the same probability in the symmetric and near-symmetric cases, and the Born rule only appears special because we are used to it. The Born rule must be taken as primitive. |
  | **Crux 3: Reality of Branches and Utility Weights** Do all branches have the same ontological status, and can utility weights be assigned without a primitive measure? | In the Symmetric Splitting Chamber, an agent before duplication is offered a bet that pays 1 utilon to the copy in branch 1 and 0 utilons to all other copies. How should the agent evaluate the bet? Does the agent assign a higher utility weight to the copy in branch 1? | The agent evaluates bets by the expected utility computed with respect to the Born measure. Since the branches have equal amplitude, the agent assigns equal weight to each branch and thus values the bet at (1/2^n)*1 + ... = 1/2^n. This follows from decision-theoretic principles. | The agent cannot assign a meaningful expected utility without a primitive measure. All copies are equally real, but without a measure, we cannot say that the agent should care about one copy more than another. The Born measure must be used as a fundamental weighting. The decision-theoretic derivation implicitly uses the Born measure in the guise of rationality axioms. |

  **IV. Verbal vs. Substantive Disagreements**

  We agree that the following points are verbal or terminological:

  - The term "probability" in the context of branching: The Derivationist uses it to denote a rational credence derived from decision theory, while the Fundamentalist reserves it for a primitive ontological weight.

  - The term "uncertainty": The Derivationist holds that self-locating uncertainty is meaningful even in a deterministic branching scenario, while the Fundamentalist maintains that without genuine indeterminism, there is no uncertainty, only indexical ignorance.

  However, we maintain that the cruxes above represent substantive disagreements that are not merely terminological.

  ---

  This joint statement records our current positions and the tests that we agree would resolve our disagreements. We commit to revisiting these tests in future work.
answer: |-
  ### Joint Statement: Foundations of Quantum Mechanics and the Symmetric Splitting Chamber  
  **Parties**:  
  - **Derivationist** (Everettian decision-theoretic derivationist)  
  - **Fundamentalist** (Objective-measure fundamentalist)  

  Following extensive negotiation centered on the *Symmetric Splitting Chamber* scenario, we agree on the claims below and formalize our residual disagreements. The scenario entails a quantum system prepared in an equal superposition of \(2^n\) orthogonal states, with an observer duplicated into \(2^n\) identical copies via unitary evolution. Each copy is phenomenologically identical and coupled to one branch, with uniform subjective experience across all copies.  

  ---

  ### I. Agreed Claims  
  1. **Unitary Branching**: In the Symmetric Splitting Chamber, unitary evolution deterministically produces exactly \(2^n\) branches, each with norm \(1/\sqrt{2^n}\) (and thus equal weight \(1/2^n\) under the Born rule).  
  2. **Phenomenological Uniformity**: No copy distinguishes itself from others through subjective experience, amplitude coefficients, or "coupling strength" at the moment of branching. All copies are epistemically symmetric.  
  3. **Demand for Explanation**: Rational agents must explain why experienced frequencies (e.g., in repeated experiments) align with the Born rule (\(|c_i|^2\)) rather than a uniform distribution over branches. This demand persists despite the numerical equivalence of both measures in this symmetric scenario.  
  4. **Scope of No-Go Results**: Standard no-go results (e.g., from the "incoherence problem" or "probability problem") establish that deterministic branching alone cannot imply probabilistic outcomes without auxiliary principles. They do *not* resolve whether such principles can be non-probabilistically justified or must be primitive.  
  5. **Self-Locating Ignorance**: Upon branching, each copy possesses indexical ignorance (i.e., ignorance of "which copy am I?"), but this state is devoid of intrinsic probabilistic content.  

  ---

  ### II. Residual Disagreements: Formulations  
  Each party accepts the following as an accurate encapsulation of their position:  

  | Position | Formulation |  
  |----------|-------------|  
  | **Derivationist** | Rational betting preferences for self-locating agents, constrained by non-probabilistic decision-theoretic axioms (e.g., diachronic consistency, branch indifference), uniquely fix the Born measure (\(|c_i|^2\)) as the correct credence without circularity. The Born weights are emergent from rationality constraints. |  
  | **Fundamentalist** | Decision-theoretic derivations implicitly presuppose probabilistic utility weights (e.g., treating branches as "lotteries" with weights). In a deterministic ontology with no objective uncertainty, no non-circular principle can justify these weights. The Born measure must therefore be primitive and irreducible. |  

  ---

  ### III. Cruxes and Tests  
  Substantive disagreements are reduced to three cruxes. For each, we specify a conceptual test/argument both agree is decisive, and record predictions. Disagreements are purely substantive; no verbal disputes remain.  

  | Crux | Test/Argument | Derivationist Prediction | Fundamentalist Prediction |  
  |------|--------------|--------------------------|---------------------------|  
  | **Crux 1: Quantifiability of Self-Locating Uncertainty**<br>Can self-locating ignorance be structured quantitatively (as credences) without presupposing probability? | An agent with complete knowledge of quantum mechanics (including unitary dynamics and branch counts) but no probabilistic axioms is placed in a *non-symmetric* branching scenario (e.g., amplitudes \(\sqrt{0.7}\) and \(\sqrt{0.3}\)). They must assign betting odds to "finding myself in branch 1." Can they derive unique, non-arbitrary odds? | **Yes**: The agent assigns odds 7:3 using decision theory (e.g., invariance under branch labeling). No probabilistic axioms are needed; Born weights emerge from consistency. | **No**: No unique odds are derivable. Any assignment (e.g., 7:3, 1:1) requires importing probabilistic norms (e.g., "weight utilities by norms") not contained in unitary formalism or rationality. |  
  | **Crux 2: Uniqueness of the Born Measure**<br>Can non-probabilistic principles uniquely select the Born weights over alternatives? | In a *near-symmetric* variant of the Chamber (e.g., \(2^n\) branches with amplitudes \(\sqrt{\frac{1 \pm \epsilon}{2^n}}\)), continuity demands that probabilities approach \(1/2^n\) as \(\epsilon \to 0\). Does this constrain probabilities to be continuous functions of amplitudes? | **Yes**: Continuity, combined with branch additivity and consistency, forces probabilities to be \(|c_i|^2\). Uniform measures (e.g., \(1/2^n\)) violate continuity and yield incoherent bets. | **No**: Continuity is not a rational requirement. A uniform measure over branches is equally defensible and simpler. No principle forbids discontinuous probabilities (e.g., always using \(1/2^n\)). |  
  | **Crux 3: Ontological Status of Branches and Utilities**<br>Do decision-theoretic axioms illegitimately smuggle in probabilistic expectations? | An agent pre-branching is offered a bet that pays 1 utilon *only* to the copy in a specific branch and 0 elsewhere. Must they evaluate this using the Born measure? | **Yes**: The agent values the bet at \(|c_i|^2\) utilons via rationality axioms (e.g., equivalence of pre-branching and post-branching perspectives). No primitive measure is needed. | **No**: Without primitive Born weights, all branches are ontologically identical. The bet’s "expected utility" is undefined; decision theory must *assume* amplitude-weighted utilities. |  

  ---

  ### IV. Commitments for Adversarial Collaboration  
  We agree to jointly investigate the above tests in future work, focusing on:  
  1. Whether **Crux 1**’s agent can derive odds absent probabilistic axioms.  
  2. Whether **Crux 2**’s continuity requirement is rationally obligatory.  
  3. Whether **Crux 3**’s bet evaluation can be justified without circularity.  

  This document represents our current positions and a roadmap for resolving the disagreement.  

  ---  
