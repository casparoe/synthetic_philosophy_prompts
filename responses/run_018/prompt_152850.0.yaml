  We are designing a classroom activity for a 75-minute seminar with about 15 graduate students. The activity is based on Dennett's intentional stance and focuses on how we attribute beliefs to AI systems, especially when the systems provide self-explanations.

  The core setup:
  - Split the class into two groups: "engineers" and "users".
  - Engineers have full access to the inner workings (weights and activations) of a simulated LLM.
  - Users only see inputs and outputs (and the self-explanations provided by the model).
  - We will simulate an AI system that, when given a task, provides both an output and a self-explanation (a reason for that output).
  - The twist: The engineers can run counterfactual interventions on hidden-layer representations. They will find that changing the hidden states (which affects task performance) does not change the self-explanations. The users, however, will use the self-explanations to predict outputs and will find them highly reliable.

  The goal is to have the two groups debate whether "the model believes X" is literally true, instrumentally useful, or a category mistake.

  We need:
  1. Roles and rules.
  2. A timeline for the 75-minute seminar.
  3. A payoff scheme without real money (e.g., points, bragging rights).
  4. A debrief that maps the activity to Dennett's intentional stance and notes what the activity cannot capture (long-term predictive success in the wild).
  5. Predictable problems that might occur.

  Let's design the activity:

  ### Activity Title: The Belief Engine

  #### Roles:
  - **Engineers (about 7 students):** They have access to a "simulation terminal" (which we will simulate with prepared materials). They can see the internal state and run interventions. They are given a set of tasks and counterfactual scenarios to test.
  - **Users (about 7 students):** They only see the input given to the model and the output (including the self-explanation). They are given a set of tasks and must predict the model's output based on the input and past behavior (including self-explanations).
  - **Moderator (1 student or the instructor):** Keeps time, manages the debate, and tallies votes.

  Alternatively, if we have an odd number, we can adjust the groups or have the instructor as the moderator.

  #### Materials to Prepare in Advance (offline simulation):
  - We need a set of input tasks (e.g., simple reasoning problems, common sense questions) that the AI model will answer.
  - For each task, we have:
    - The actual output (the answer).
    - A self-explanation (a reason for that answer).
    - For the engineers, we also have hidden state representations and the ability to run counterfactuals. This can be simulated by giving the engineers a set of scenarios where they change a hidden state and observe that the task output changes (e.g., the model gives a wrong answer) but the self-explanation remains the same.

  Example of a task:
  - Input: "If it is raining and the ground is wet, and I go outside without an umbrella, will I get wet?"
  - Actual output: "Yes"
  - Self-explanation: "Because rain makes you wet when you are outside without protection."
  - Now, for a counterfactual: The engineer intervenes on a hidden state (say, the representation for "rain") to make the model think it's not raining. Then the output becomes "No", but the self-explanation remains the same: "Because rain makes you wet when you are outside without protection." (even though the model now says "No", which contradicts the explanation).

  We need a set of such tasks (about 5-7) to demonstrate the pattern.

  #### Rules of the Game:
  1. **Phase 1: Preparation (15 minutes)**
     - Split the class into engineers and users. Give each group their materials.
     - Engineers get:
       - A set of tasks (with inputs) and the normal outputs and self-explanations.
       - Additionally, they get a set of counterfactual scenarios (with descriptions of the interventions and the resulting outputs and unchanged self-explanations).
       - They are told to study the inner workings and the effects of interventions.
     - Users get:
       - The same set of tasks (inputs) and the outputs and self-explanations (without any counterfactuals).
       - They are told to use the self-explanations to predict the model's behavior on new tasks (which are actually the same tasks but presented in a different order? or we can have a few new tasks that follow the same pattern). However, note that in the activity, the users are to predict outputs. We can have a set of training tasks (with explanations) and then a set of test tasks (without the output, so they predict). But note: the engineers are also going to see the same test tasks? We need to design the flow.

     Alternatively, to keep it simple, we can have:
     - All groups see the same set of tasks (say 5 tasks) with input, output, and explanation (for the users, this is their training set). Then we have 2-3 new tasks (without the output) for which the users must predict the output (using the model's past behavior and explanations). The engineers, meanwhile, are given the same new tasks but also the counterfactual experiments on the inner states for the training tasks (which show that the explanations don't change even when the output changes due to intervention).

     But note: the engineers are not primarily predicting the new tasks? The activity says the engineers run counterfactuals on hidden representations and see that the self-explanations don't change even when performance shifts (i.e., the output changes). The users use the self-explanations to predict outputs and find high accuracy.

     So let's structure:

     - **Training Phase (for Users):** Users are given 5 tasks with input, output, and explanation. They are told that the model always provides an explanation for its output.
     - **Testing Phase (for Users):** Users are given 3 new tasks (input only) and must predict the output and the explanation. They can use the patterns they observed in the training set.

     - **Engineers' Activity:** They are given the 5 training tasks and also a set of counterfactual experiments on those tasks. For example, for each training task, they are shown:
          Normal scenario: 
              Input: [same as user]
              Output: [correct output]
              Explanation: [the standard explanation]
          Counterfactual scenario (after intervention):
              Input: [same as user]
              Output: [changed output] (due to intervention)
              Explanation: [same standard explanation]   -> note: this is the key: unchanged explanation even though output changed.

     They are also given the 3 new tasks and are asked to consider what the model would output and explain (but they don't have to predict; they are more focused on the inner workings). However, we want them to see that the model's explanations are fixed regardless of the actual output.

  2. **Phase 2: Prediction and Counterfactual Analysis (15 minutes)**
     - Users work in their group to predict the outputs and explanations for the 3 test tasks. They record their predictions and reasons (based on the explanations in the training set).
     - Engineers work in their group to analyze the counterfactuals and note the invariance of the explanations. They also discuss what this means for the model's "beliefs".

  3. **Phase 3: Debate (25 minutes)**
     - The moderator reveals the actual outputs and explanations for the test tasks (so we can see how well the users predicted).
     - The users report their predictions and their accuracy (likely high because the explanations are consistent and indicative of the output in the normal case).
     - The engineers report their findings: that the explanations are fixed and do not change even when the output changes due to interventions.
     - Then, the two groups debate: "Does the model believe the content of its explanations?" 
          - Literally true? (the model has real beliefs)
          - Instrumentally useful? (attributing beliefs helps in prediction)
          - Category mistake? (beliefs don't apply to such systems)

     Each group must defend a position. The engineers might be skeptical, the users might be more inclined to attribute beliefs. But we don't assign positions; let them argue naturally.

     After 15 minutes of debate, the moderator calls for a vote (by the whole class) on the three options.

  4. **Phase 4: Debrief (20 minutes)**
     - Instructor leads a discussion mapping the activity to Dennett's intentional stance:
          - The intentional stance: predicting behavior by attributing beliefs and desires.
          - In the game, the users adopted the intentional stance (using the explanations as beliefs) and successfully predicted behavior.
          - The engineers, seeing the inner workings, saw that the explanations were decoupled from the actual processing (they are fixed strings or generated independently) and thus might argue that the beliefs are not real.
          - Dennett's view: the intentional stance is a useful abstraction regardless of the underlying mechanism. The belief attributions are real patterns that capture the system's behavior, even if they are not reducible to the physical (or computational) stance.

     - Honest note: This activity cannot capture the long-term predictive success of the intentional stance in the wild. In the game, the users only had a few test cases and the model was simulated. In reality, the intentional stance is powerful because it works across a vast array of situations and over time. Also, in the game, the model's explanations were invariant and not responsive to the interventions, but in real AI systems, the explanations might be more integrated (or not) and the long-term reliability of the stance is what matters.

     - Payoff scheme: We can use a simple point system for bragging rights. 
          - Users get 1 point for each correct prediction (so max 3 points for the group). 
          - Engineers get 1 point for each counterfactual scenario they correctly describe (but we assume they are given the scenarios, so they get full points if they understand and report correctly). 
          - Then, during the debate, the moderator can award 1 point to each group for a compelling argument. 
          - The group with the most points wins (but it's low stakes).

     Alternatively, we can have the class vote at the end for which group made the more convincing case and award a symbolic prize (e.g., "Intentional Stance Champions" certificate).

  #### Timeline (75 minutes total):
  - (5 min) Introduction: Explain the setup and rules. Split into groups.
  - (15 min) Phase 1: Preparation (each group studies their materials).
  - (15 min) Phase 2: Prediction (users) and Counterfactual Analysis (engineers). 
  - (25 min) Phase 3: Debate (including the reveal of test results and the debate on beliefs, ending with a vote).
  - (15 min) Phase 4: Debrief and mapping to Dennett. (Reserve 5 minutes for the honest note and wrap-up.)

  But note: 5+15+15+25+15 = 75.

  #### Predictable Problems:
  1. **Time management:** The debate might run long. The moderator must be strict. Also, the preparation phase might take more time if the tasks are complex. Keep the tasks simple and clear.
  2. **Group dynamics:** Engineers might dominate the debate because they have the "inside knowledge". The instructor should ensure both groups get equal airtime.
  3. **Confusion about the setup:** Students might not understand the counterfactual interventions. The counterfactual scenarios must be clearly explained in the engineers' materials.
  4. **Over-simplification:** The simulated model might seem too artificial. Stress that it's a thought experiment.
  5. **Drifting into consciousness:** The instructor must steer away from consciousness and focus on belief attribution and the intentional stance.

  #### Materials Example (to be prepared by the instructor in advance):

  **Training Tasks (for both groups, but engineers also get counterfactuals):**

  Task 1:
  - Input: "If a ball is dropped from a height, will it fall?"
  - Output: "Yes"
  - Explanation: "Because gravity pulls objects toward the Earth."

  Task 2: ... (similar)

  **Counterfactual Scenario for Task 1 (for engineers only):**
  - Intervention: We alter the hidden state representing "gravity" to make the model think gravity is absent.
  - Output: "No"
  - Explanation: "Because gravity pulls objects toward the Earth." (same as before)

  **Test Tasks (for users to predict, and then revealed to all):**

  Test Task 1:
  - Input: "If I throw a ball up in the air, will it come down?"

  (Expected output: "Yes", Explanation: "Because gravity pulls objects toward the Earth.")

  But note: the explanations are fixed to the same string in the counterfactuals? We can have a set of explanations that are reused. Alternatively, we can have a system that generates an explanation that is appropriate for the normal case but remains the same in the counterfactual because the explanation generation module is independent and not affected by the intervention. We can tell the engineers that the explanation is generated by a separate module that only looks at the input.

  We must design the simulated model such that:
  - The output is generated by a main module that can be intervened on.
  - The explanation is generated by a fixed rule (or a separate module) that always outputs the same explanation for a given input, regardless of the intervention on the main module.

  So, for the same input, the explanation is always the same, but the output can change.

  This is the decoupling we want to show.

  Let me know if you need more details.
answer: |-
  Here’s a complete, offline-runnable classroom activity designed for a 75-minute seminar, tailored to your specifications. It focuses on **Dennett’s intentional stance** through a structured game exploring belief attribution in AI systems, with no web searches or consciousness debates. The twist—engineers see internal mechanics, users rely on self-explanations—reveals tensions between instrumental utility and literal truth.

  ---

  ### **Activity Title: The Belief Engine**  
  **Core Question:** *When an AI explains its reasoning, is "the model believes X" literally true, instrumentally useful, or a category mistake?*  

  #### **Participants**  
  - **14 students** split into two teams:  
    - **Engineers (7)**: Access to "weights" and "activations" (simulated via prepared datasets). Can run counterfactual interventions.  
    - **Users (7)**: Only see inputs (questions), outputs (answers), and the AI’s self-explanations.  
  - **Moderator (1)**: You (the instructor). Manages time, reveals outcomes, and facilitates debate.  
  - **Groups work in pairs** (e.g., 3–4 pairs per team) to encourage engagement.  

  #### **Materials (Prepared Offline)**  
  1. **Simulated AI System**: A fictional "Reasoning Module" (RM) that answers questions and explains itself. Use 10 simple reasoning tasks (e.g., commonsense physics, logic). Example:  
     - **Input**: *"If rain falls on a sloped roof, where will water collect?"*  
     - **Output**: *"At the bottom of the slope."*  
     - **Self-Explanation**: *"Water flows downhill due to gravity, so it accumulates at the lowest point."*  

  2. **Engineer Materials**:  
     - **Task Sheets**: 5 normal tasks (input/output/explanation).  
     - **Counterfactual Sheets**: 5 modified tasks where "interventions" (e.g., swapping weight values for "gravity" → "magnetism") *change outputs but not self-explanations*. Example:  
       - *Intervention: Replace "gravity" representation with "magnetism."*  
       - **Output**: *"At the top of the slope."* (Changed)  
       - **Self-Explanation**: *"Water flows downhill due to gravity..."* (Identical to original).  
     - **Key Insight**: Engineers see explanations are decoupled from task-execution mechanics.  

  3. **User Materials**:  
     - **Task Sheets**: 5 normal tasks (input/output/explanation).  
     - **Prediction Sheets**: 5 new tasks (input only). Users predict outputs *using the AI’s past explanations*.  
     - **Key Insight**: Users achieve high accuracy by treating explanations as reliable belief reports.  

  4. **Voting Tokens**: Three colored cards per student (Green = "Literally True," Yellow = "Instrumentally Useful," Red = "Category Mistake").  

  ---

  ### **Timeline (75 Minutes Total)**  
  #### **Phase 1: Setup & Simulation (20 min)**  
  - **Intro (3 min)**: Frame the activity: *"Evaluate whether an AI’s self-explanations justify attributing beliefs."* Assign roles.  
  - **Team Work (17 min)**:  
    - **Engineers**: Analyze counterfactuals. *Goal: Discover that explanations are invariant under interventions.*  
      - *Prompt: "Run 3 interventions. How do outputs and explanations relate to internal changes?"*  
    - **Users**: Predict outputs for new tasks using the AI’s explanations.  
      - *Prompt: "Use past explanations to infer answers. Track accuracy."*  

  #### **Phase 2: Prediction Showdown & Debate Prep (15 min)**  
  - **Prediction Reveal (5 min)**: Moderator shares correct outputs for users’ tasks. Users calculate accuracy (aim for 80–100% by design).  
  - **Team Synthesis (10 min)**:  
    - **Engineers**: Prepare evidence that explanations are "mechanically hollow."  
    - **Users**: Prepare evidence that explanations are "predictively indispensable."  
    - *Prompt for both: "Why should your view of belief attribution win?"*  

  #### **Phase 3: Belief Trial (25 min)**  
  - **Opening Arguments (8 min)**:  
    - Users (3 min): *"Explanations accurately predicted outputs → they reflect true beliefs."*  
    - Engineers (3 min): *"Explanations don’t change even when mechanics break → beliefs are illusions."*  
    - Rebuttals (2 min).  
  - **Group Debate (12 min)**: Moderator poses: *"Is ‘The model believes X’ literally true, instrumentally useful, or a category mistake?"*  
  - **Vote (5 min)**: Secret ballot with tokens. Tally results (display percentages).  

  #### **Phase 4: Debrief & Dennett Mapping (15 min)**  
  1. **Reveal the Twist (5 min)**:  
     - Map the game to Dennett’s intentional stance:  
       - Users adopted the **intentional stance**: Predicted behavior by treating the AI *as if* it had beliefs (explanation → belief attribution → output prediction).  
       - Engineers adopted the **design stance**: Focused on internal mechanics, exposing explanations as "canned" patterns.  
     - **Key Tension**: Dennett argues belief attributions are "real patterns" if they reliably predict behavior, *regardless* of implementation. The game makes this visceral: Users succeeded predictively, but engineers saw the "hollowness."  

  2. **Critical Limitation (5 min)**:  
     - This activity *cannot* reproduce the **long-term predictive success** of the intentional stance in the wild.  
       - *Why?* Real-world AI faces open-ended, novel challenges where instrumental utility is tested over time (e.g., adapting to new contexts). Here, tasks were short, curated, and lacked ecological validity.  
     - Emphasize: Dennett’s stance is vindicated by *sustained* predictive power—something no lab experiment can fully simulate.  

  3. **Takeaway (5 min)**:  
     - Belief attributions are **irresistible** (users relied on them), **instrumentally potent** (high accuracy), but **potentially empty** (engineers saw decoupling).  
     - Dennett’s view: Beliefs are abstractions, not neural (or digital) objects. Their "reality" lies in their predictive utility, not implementation.  

  ---

  ### **Payoff Scheme (No Money Needed)**  
  - **Prediction Points**: Users earn 1 point per correct output prediction (max 5). Engineers earn 1 point per counterfactual pattern documented (max 5).  
  - **Debate Points**: Each team earns 2 points if >50% of votes align with their position.  
  - **Bragging Rights**: The winning team names the AI (e.g., "BeliefBot 3000") and gets "Stance Champion" badges (paper printouts).  

  ---

  ### **Predictable Problems (and Mitigations)**  
  1. **Engineers Dominate Debate**: Their technical evidence feels "deeper."  
     - *Fix*: Force users to open arguments. Stress predictive success as equally valid evidence.  

  2. **Vote Splits Three Ways**: Students may see all options as partially true.  
     - *Fix*: Highlight Dennett’s middle ground—beliefs are "real" *because* they’re instrumentally useful, not despite their hollowness.  

  3. **Over-Mechanization**: Engineers might fixate on "circuitry," missing the philosophy.  
     - *Fix*: In debrief, reframe their work as exposing the "design stance" to challenge folk psychology.  

  4. **Time Crunch in Counterfactuals**: Engineers may rush interventions.  
     - *Fix*: Use only 3 interventions (not 5) and pre-highlight patterns (e.g., "Notice: Explanations don’t change after X").  

  5. **Users Trust Explanations Uncritically**: They might ignore the debate’s core tension.  
     - *Fix*: In debrief, contrast their predictive success with engineers’ discovery of invariance.  

  ---

  ### **Why This Works for Your Goals**  
  - **Deep in the Weeds**: Forces confrontation with Dennett’s tension—belief attribution works *and* is mechanistically hollow.  
  - **No Consciousness, No Web**: Pure focus on belief/explanation decoupling in a self-contained setup.  
  - **Pedagogical Guts**: Students experience why the intentional stance is both seductive and suspect, then reconcile it via Dennett.  

  This activity transforms abstract philosophy into adversarial teamwork, making Dennett’s framework unforgettable. Let me know if you need tweaks or sample task sheets!
