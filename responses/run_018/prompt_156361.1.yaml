  In all the permissible cases, the harm is not part of the causal mechanism. In the impermissible cases, it is.

  In the sixth case, the harm (quarantine of false positives) is not part of the causal mechanism for reducing transmission. The mechanism is the quarantine of the infected. Therefore, the verdict should be permissible.

