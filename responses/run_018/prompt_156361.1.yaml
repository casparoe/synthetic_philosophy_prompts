  But note that in the sixth case, the harm is deterministic at scale: we know that 2% of the quarantined are false positives. So it is not probabilistic in the sense of being uncertain for a given individual? But the harm is a statistical aggregate.

  However, in Ruling 5, the worker's death is a direct physical consequence. In the sixth case, the harm is also a direct consequence of the quarantine order. So it is physical in the sense that the quarantine causes the harm.

  But the Committee might see a difference because in Ruling 5, the worker is in the building and the demolition causes the building to collapse, which kills the worker. In the sixth case, the quarantine order causes the harm to the false positives. So both are direct.

  Therefore, the precedents might not underdetermine the outcome and the case should be permissible.

  But let's consider an alternative interpretation: the Committee might be concerned about the use of a person as a means. In the impermissible cases, a person is used as a means. In Ruling 2, the fetus is crushed as the means to extract it. In Ruling 4, the pedestrian is used as a kinetic brake. In the permissible cases, the harm is a side effect and the person is not used as a means.

  In the sixth case: the false positives are not being used as a means. They are isolated by mistake. The means is the isolation of the infected. So they are not being used.

  Therefore, the sixth case should be permissible.

  But let's see if there is any ambiguity.

  Another way: the Committee might be drawing a distinction between harm that is an inherent part of the act and harm that is a side effect. In the sixth case, the harm is inherent in the algorithm's operation? But note that the algorithm is designed to identify infected individuals, and the false positives are an inherent imperfection. But the harm is not the mechanism. So it should be permissible.

  Therefore, the closest analog is Ruling 5 (or 1 or 3) and the verdict should be permissible.

  But the problem statement says: "specify whether the Committee’s precedents genuinely underdetermine the outcome". I think they do not. The principle is:

  Principle: An action producing a foreseen harmful outcome is permissible under the doctrine of double effect if:
     (a) the harmful outcome is not intended as an end or a means to the good outcome (i.e., it is not part of the causal mechanism for the good outcome), and 
