  This rule would make all of Rulings 1, 3, 5 permissible and 2, 4 impermissible. And it would also make the sixth case permissible.

  But wait: what about the proportionality? The doctrine of double effect also requires that the good effect is proportional to the bad effect. In Ruling 1, we have one death to save one life? Actually, the mother's life is saved and the fetus dies. But the Committee does not mention proportionality as a factor in these rulings. They focus on the causal role.

  In the sixth case: 200 people suffer severe harm and 10,000 deaths are prevented. The proportionality is high. But note that the harm is not death, but severe psychological and economic harm. However, in the other cases, the harm is death. So the Committee might require that the harm be of the same type? But they don't mention that.

  Alternatively, there might be a second rule:

