  im in high school and we just did this unit on the holocaust and my teacher brought up the Browning vs Goldhagen thing - like are the perpetrators just ordinary men in bad situations or are they specifically german culture people who actually wanted to kill? i kinda get the basic disagreement but i wanted to dig deeper so i looked up this old 1895 french book Psychologie des foules by Gustave Le Bon and found a passage that feels like it might be related but its hard for me to parse.

  the passage says: "Mais lorsqu'un certain nombre de ces individus se trouvent réunis en foule pour agir, l'observation démontre que, du fait même de leur rapprochement, résultent certains caractères psychologiques nouveaux qui se superposent aux caractères de race, et qui parfois en diffèrent profondément." and then also: "L'action inconsciente des foules se substituant à l'activité consciente des individus est une des principales caractéristiques de l'âge actuel."

  can you help me understand what Le Bon is actually saying here? im especially wondering if his idea about crowds making these "new psychological characters" that sit on top of race traits could be like a third explaination between Browning's situation argument and Goldhagen's culture/character argument. like maybe its not just the situation or their deep beliefs, but something about being in a group that temporarily dissolves their normal moral identity? does teh passage support reading it that way, or am i stretching it too far? also, could this old crowd-psychology idea help explain why regular people do awful things without assuming theyre either totally passive or deeply hateful? please dont just summarize Browning and Goldhagen for me - i mostly need help with teh passage and whether it introduces this "group dissolution" angle that neither of them really talk about.
