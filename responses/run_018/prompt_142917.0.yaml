  *   **Dennettian Concepts:** The poem weaves in the rejection of the homunculus ("No inner captain," "No tiny judge," "ghostless"), the self as a functional abstraction/illusion ("functional illusion," "consequence alone," "arrangement"), the constructed nature of narrative ("lived-out story," "reshaped by present need," "constantly re-spun"), and narrative inertia ("changing course demands a certain weight," "Resists the orbit," "narrative inertia guards the center," "comfort in the tale already spun").
