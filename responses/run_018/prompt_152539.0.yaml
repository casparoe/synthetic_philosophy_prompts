prompt: |-
  I sit on my university's International Partnerships and Ethics Panel. We must recommend whether to sign a revised memorandum of understanding with a partner university in a country whose government has recently issued a 'Charter for the Protection of Western Values in Higher Education,' defining them as secular governance, gender-integrated research ethics, and market-oriented academic freedom. The partner rector claims this protects institutional autonomy from religious interference; our students' union contends that 'Western values' is an essentially contested concept that operates here as a civilisational label incompatible with our equality duties; and our legal office warns that contracting around an undefined normative category could expose us to liability should the partner state invoke the clause to justify exclusionary admissions policies. The draft contract asks both parties to 'actively uphold Western values in joint programmes.' Draft the panel's written opinion recommending approval with amended language, approval with conditions, or rejection. Your recommendation should address whether 'Western values' can be given coherent contractual content, what the phrase specifically includes and excludes in this institutional context, and how it functions argumentatively for each stakeholder. Lead with the bottom-line recommendation in the first sentence, then provide reasoning with no preamble and no restating of the question, and treat the strongest argument for the opposing position honestly.
reasoning: |-
  Okay, the user is part of a university panel deciding on a revised MoU with a partner university. The partner's government introduced a "Charter for the Protection of Western Values in Higher Education," which includes secular governance, gender-integrated research ethics, and market-oriented academic freedom. The rector claims this protects institutional autonomy from religious interference. However, the students' union argues that "Western values" is an essentially contested concept that conflicts with equality duties. The legal office warns that using an undefined normative category could lead to liability if the partner uses it to justify exclusionary policies. The draft contract requires both parties to "actively uphold Western values in joint programmes."

  The user needs a panel opinion recommending approval with amended language, approval with conditions, or rejection. The recommendation must address whether "Western values" can have coherent contractual content, what it specifically includes and excludes in this context, and how it functions argumentatively for each stakeholder. The bottom-line recommendation should be first, followed by reasoning without preamble or restating the question. The strongest opposing argument must be treated honestly.

  First, the core issue is the term "Western values" in the contract. It's too vague and could be misused. The partner rector sees it as protecting autonomy, but the students' union and legal office have valid concerns. The term lacks a clear definition, which is problematic legally and ethically. 

  The strongest opposing argument is from the partner rector: that this charter protects against religious interference. In some contexts, that's legitimate. But the term "Western values" itself is loaded and can be co-opted to exclude groups, which contradicts equality duties. 

  The panel needs to balance maintaining the partnership with upholding the university's values and legal safety. Rejection might be too harsh, but approval as-is is risky. The best path is conditional approval: remove "Western values" and replace it with specific, agreed-upon principles. 

  The recommendation should be approval conditional on replacing "Western values" with concrete terms like institutional autonomy, non-discrimination, academic freedom, etc. This addresses the rector's intent without the baggage. Also, include clauses on non-discrimination and regular review to ensure compliance. 

  For contractual content: "Western values" can't be made coherent because it's inherently contested. Instead, specify what it means operationally: secular governance (but allow religious studies), gender-integrated ethics (ensuring inclusivity), market-oriented freedom (but protect non-commercial research). Exclude any civilizational superiority or exclusionary practices. 

  Stakeholder arguments: The rector uses it as a shield against interference. The students see it as a civilizational label that excludes. Legal sees it as a liability risk. The amended language satisfies the rector's need for autonomy while addressing others' concerns. 

  Finally, the recommendation must be upfront: conditional approval with specific language changes and safeguards. This shows the panel is pragmatic but principled.
answer: |-
  **Recommendation: Approve the revised memorandum of understanding (MoU) conditional upon the removal of the phrase "actively uphold Western values" and its replacement with specific, mutually agreed, and legally defensible principles derived from the partner's stated Charter objectives and our institutional values, alongside strengthened non-discrimination clauses and implementation safeguards.**

  **Reasoning:**

  1.  **"Western Values" Lacks Coherent Contractual Content:** The term "Western values" is an essentially contested concept with no universally accepted, objective definition. Its meaning is historically fluid, culturally relative, and often politically instrumentalized. Attempting to imbue it with specific, binding contractual obligations is legally precarious and operationally unworkable. It creates a dangerously vague normative category open to divergent interpretations and potential abuse, precisely as the legal office warns. Contractual obligations must be clear, specific, and verifiable; "Western values" fails this fundamental test.

  2.  **Specific Inclusions/Exclusions in Context & Argumentative Function:**
      *   **Partner Rector's Argument (Shield against Interference):** For the partner rector, the Charter's specific components ("secular governance," "gender-integrated research ethics," "market-oriented academic freedom") function *argumentatively* as a shield against perceived threats of religious or ideological interference in institutional autonomy and specific research practices. They intend it to *include* protection from non-state religious actors dictating curriculum or segregating research by gender, and to *exclude* such interference. "Western values" here serves as a convenient, albeit problematic, label for these specific goals within their domestic context. It *excludes* external imposition of different value systems.
      *   **Students' Union Argument (Civilizational Exclusion):** The students' union correctly identifies that "Western values" functions *argumentatively* as a civilizational label implying superiority and defining a norm against which "others" are measured. This inherently *excludes* non-Western perspectives, identities, and knowledge systems, potentially contravening equality duties related to religion, nationality, ethnicity, and gender identity (especially where gender integration is interpreted narrowly or punitively). It risks imposing a monolithic, culturally specific framework incompatible with a diverse, global university environment. The phrase itself, regardless of intent, carries this exclusionary baggage.
      *   **Legal Office Argument (Liability & Vagueness):** The phrase functions as a significant *legal liability*. Its undefined nature allows the partner state (not just the university) to potentially invoke it expansively and unilaterally to justify actions (e.g., exclusionary admissions based on nationality, religion, or gender expression deemed "non-Western") that breach our equality and non-discrimination commitments. Contracting around such a nebulous concept creates an unacceptable enforcement and liability risk.

  3.  **Addressing the Strongest Opposing Argument (Partner Autonomy):** The strongest argument for retaining the clause is the partner rector's genuine need, articulated through the Charter's specifics, to safeguard institutional autonomy from external religious interference and ensure gender-integrated research. This is a legitimate concern for academic freedom in their context. **Honest Treatment:** Dismissing this concern outright would be negligent. The partner university operates within a complex political and social environment, and the Charter likely represents a hard-won institutional protection. Protecting core academic freedoms and resisting inappropriate external interference is a value we share. *However, the use of "Western values" is an ineffective and dangerous vehicle for achieving this specific goal.* It introduces far greater risks than it mitigates. The specific protections sought can be achieved through precise, less politically charged language.

  4.  **The Conditional Approval Solution:** The core objectives behind the partner's invocation of the Charter (institutional autonomy, resistance to specific forms of interference, commitment to integrated research ethics, academic freedom) can be addressed contractually *without* using the toxic and vague label "Western values."
      *   **Replace "actively uphold Western values"** with explicit, agreed-upon principles drawn directly from the *stated components of the Charter* and aligned with universal academic values and our equality duties. For example:
          *   "Uphold institutional autonomy in academic matters and resist external interference incompatible with academic freedom."
          *   "Ensure non-discrimination in admissions and participation in joint programmes on all protected grounds, including but not limited to [list grounds per our policies]."
          *   "Conduct research and deliver programmes in accordance with principles of inclusive participation and ethical integrity, including gender equality in research collaboration."
          *   "Protect academic freedom for staff and students engaged in joint programmes."
      *   **Strengthen Non-Discrimination Clauses:** Explicitly state that all activities under the MoU must comply with both institutions' non-discrimination policies and relevant international human rights standards, superseding any conflicting interpretations of other clauses.
      *   **Add Implementation Safeguards:** Include a robust joint oversight mechanism for the MoU, a clear dispute resolution procedure prioritizing dialogue and mediation, and a regular review clause (e.g., every 2 years) specifically assessing adherence to the agreed principles and non-discrimination commitments. Include a termination clause triggered by material breach of these core principles.

  **Conclusion:** Rejection disregards the legitimate autonomy concerns of the partner and severs a potentially valuable relationship. Unconditional approval exposes the university to significant legal, reputational, and ethical risks due to the indefinable and exclusionary nature of "Western values." Conditional approval, requiring precise language reflecting the Charter's *operational intent* without its civilizational framing, coupled with ironclad non-discrimination safeguards, balances the need for partnership with the imperative to uphold our institutional values, legal obligations, and commitment to genuine inclusivity. This approach neuters the argumentative weaponization of the phrase while substantively addressing the partner's core stated objectives.
