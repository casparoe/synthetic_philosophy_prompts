answer: |-
  ## Research Proposal: Custodial Duties in Intergenerational Climate Justice

  **1. Core Research Question**  
  Can a *custodial* account of duties to future generations—defined as role-based obligations to maintain and transmit core practices/institutions in a condition enabling their continuation and meaningful uptake by successors—be articulated in a way that:  
  (a) Remains demonstrably distinct from *delivery* accounts (duties to provide specific welfare levels, goods, or options to determinate future individuals);  
  (b) Is immune to the non-identity problem (which undermines many delivery accounts);  
  (c) Survives the "empty-custodianship objection" (the risk that such duties can be discharged by symbolic gestures without constraining substantive action like emissions reduction); and  
  (d) Provides actionable guidance for climate policy?  
  Success hinges on defining custodial duties robustly (e.g., duties arising from occupying a role within an intergenerational practice, owed to the practice itself or the office of custodian, requiring substantive maintenance of core functional capacities).

  **2. Why Existing Positions Leave This Open**  
  *   **Person-Affecting Views/No-Difference Replies:** Focus on comparative harm to specific individuals, failing to address duties where no specific future person is harmed by our choices (non-identity) or duties not grounded in individual welfare comparisons.
  *   **Contractarian Savings Principles:** Often rely on mutual advantage or hypothetical agreement, struggling to bind present actors when future preferences/value structures radically differ (as in the successor-values case).
  *   **Rights-Based Accounts (for Future Persons):** Grapple with the non-identity problem (who holds the rights?) and indeterminacy about what specific rights future, unknown individuals possess.
  *   **Discounting/Cost-Benefit Analysis:** Treats the issue primarily as a technical problem of weighting future welfare, sidestepping the fundamental question of the *nature* and *grounds* of the duty itself.
  *   **Veil-of-Ignorance Devices (Birth Date Unknown):** Can generate savings rules but often obscure whether the resulting duty is fundamentally about delivering welfare or preserving structures enabling future agency/valuing; their output under radical preference shifts is ambiguous.

  **3. Approach and Justification**  
  This project employs **conceptual analysis grounded in paradigmatic cases** to test the viability and distinctness of the custodial account.  

  *   **Why Conceptual/Structural?** Settling discount rates or specific savings rules presupposes an answer to the prior question: *What kind of duty are we trying to fulfill?* A structural analysis of the duty (delivery vs. custodial) clarifies the foundational rationale, making explicit what is owed, to whom/for what, and why – essential before quantification.  
  *   **Why Invented Cases?** Familiar cases (e.g., nuclear waste storage) often allow both delivery and custodial interpretations to converge. The **successor-values case** (future generations thriving by their own, radically different values, indifferent to what we cherish) is explicitly designed to *force* these accounts apart. The **end-of-chain case** (predictable future extinction) tests the core logic of custodianship absent successors. These controlled scenarios better isolate the unique implications and potential pitfalls of each theoretical structure than complex real-world analogues.

  **4. 12-Week Work Plan**  
  *   **Weeks 1-2: Framing & Literature:** Deep dive into non-identity problem literature & key critiques of delivery models. Define custodial duties precisely (drawing on role ethics, practice-based duties). *Output:* Refined definitions, annotated outline. *Stuck Risk:* Defining "core functional capacities" of practices without circularity.  
  *   **Weeks 3-4: Articulating Custodial Account:** Develop the strongest possible custodial account, drawing on relevant ethical frameworks. Explicitly address non-identity immunity. *Output:* Draft core sections on custodial theory. *Stuck Risk:* Avoiding collapse into disguised delivery (e.g., defining "condition" in welfare terms).  
  *   **Weeks 5-6: Empty-Custodianship Objection:** Rigorously formulate the objection. Test custodial account against it. Can it mandate *substantive* action (like deep emissions cuts)? *Output:* Analysis section on emptiness risk. *Stuck Risk:* Account remains vulnerable to symbolic discharge.  
  *   **Weeks 7-8: Successor-Values Case:** Apply both delivery and custodial accounts. Do they yield distinct, defensible prescriptions? Does causing the value shift matter? *Output:* Central case study analysis. *Stuck Risk:* Cases fail to discriminate; accounts converge or both become incoherent.  
  *   **Weeks 9: End-of-Chain Case:** Test custodial logic absent successors. Does the duty lapse, transform, or persist (e.g., as a duty to the past/practice itself)? *Output:* Analysis section on termination.  
  *   **Week 10: Synthesis & Policy Implications:** Weigh overall viability of custodial account. Translate findings into implications for climate policy mandates. *Output:* Draft conclusion & policy section.  
  *   **Week 11: Revision & Integration:** Strengthen arguments, ensure coherence, address counterarguments. *Output:* Full draft.  
  *   **Week 12: Final Polish:** Refine prose, check references, format. *Output:* Final paper submission.

  **5. What Success Looks Like**  
  A successful result would provide policy actors with a clear conceptual framework: **"Prioritize preserving the *irreversible, foundational capacities* necessary for future generations to sustain valued practices (like democratic governance or ecosystem stewardship), even if their specific preferences differ. This justifies strong mitigation efforts independently of contested welfare comparisons or discount rates."** This offers a non-welfarist, non-comparative rationale for stringent climate action.

  **6. Honest Failure Conditions**  
  The project fails (beyond a negative conclusion) if:  
  1.  **Collapse:** The custodial account cannot be sustained without implicitly relying on delivery logic (e.g., defining the "condition" of a practice in terms of future welfare).  
  2.  **Emptiness Wins:** The only coherent custodial account is purely expressive/symbolic, unable to mandate substantive, costly actions like emissions reduction.  
  3.  **Case Failure:** The successor-values case fails to discriminate; both accounts give the same answer or neither gives a plausible answer.  
  4.  **Intractability:** The concept of a "practice" or "core capacity" proves too vague or contested to bear the normative weight required. *(Additional risk identified)*

  **7. Scope Limitation Note**  
  The most significant scope risk is over-extending the conceptual defense of the custodial account, attempting to resolve deep meta-ethical foundations (e.g., the ontology of practices, the source of role obligations) within the word limit. This could crowd out the crucial work of applying the distinction to the cases and policy context. **If cutting is needed, the meta-ethical justification for custodial duties would be streamlined, focusing on their functional role in addressing the non-identity/emptiness dilemma rather than their ultimate philosophical grounding.**

  **Closing:** This proposal outlines a project investigating whether intergenerational duties concerning climate change are better understood as custodianship of essential practices rather than delivery of welfare, testing this distinction against critical objections and novel cases to derive actionable policy guidance. Supervisor approval sought to proceed.
