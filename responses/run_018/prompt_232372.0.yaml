prompt: |-
  I'm putting together a one-year dissertation fellowship proposal and I've got a half-formed idea I need sharpened. People often argue from simultaneous discovery, Newton and Leibniz or Darwin and Wallace, that discoveries are in the air and that if a given discoverer had never lived someone else would have made the same discovery at around the same time. I think that argument moves too fast because it assumes we already know what counts as the same discovery. Newton's and Leibniz's calculi differ in notation, in how they formulate the basic operations, and in the problems they extend to comfortably; Darwin's and Wallace's versions of natural selection are different theories in several respects even where they overlap. So the question I want the proposal built around is: before a case of simultaneous discovery can license a claim about inevitability, what sameness relation has to hold between the independent achievements, and do the standard cases actually meet it? And depending on the answer, should credit attach to the discovery-type or to the specific contribution, and does that change wether priority disputes matter? Turn this into a one-page proposal with the question stated precisely, why the existing appeal to simultaneous discovery leaves it open, the approach I'd take month by month and why that approach rather than just doing comparative history of the two episodes, what a successful result would look like, and what would count as failure. Don't include a bibliography or citations, I'll add those myself. Please write continuous prose only, no headings or bullet points or bold or tables, and use British English.
