answer: |-
  Consider the landscape of commitments concerning valid cognition by examining whether perception and inference alone suffice for all knowledge. One view insists they do, holding that any putative additional source must collapse into perception, inference, or their combination; this eliminates testimony, comparison, and absence as independent. Alternatively, one may argue that perception and inference are insufficient, necessitating at least one further irreducible *pramāṇa*. Should we accept this insufficiency, the critical question becomes whether verbal knowledge of a distant object—like learning of a fire in a remote village solely through another's utterance—requires an irreducible relation of trust in the speaker's competence and honesty, or whether it can be reconstructed as a complex inference: first inferring the speaker's reliability from their perceived characteristics and context, and then inferring the truth of their statement from that established reliability. The former position maintains testimony’s autonomy; the latter reduces it to inference.

  Assuming testimony is either irreducible or reduced, the next branching point concerns analogical comparison: specifically, whether recognizing a similarity relation—such as identifying a gavaya as "like a cow" based on prior knowledge of a cow and a forest resident's description—constitutes a unique cognitive act irreducible to perception and inference, or whether it involves merely perceiving the gavaya, recalling the description, and inferring the similarity. A positive answer grants autonomy to comparison; a negative answer reduces it.

  Finally, regardless of the status of testimony and comparison, one must address the cognition of absences: whether the immediate awareness that "there is no pot on this mat" involves a distinct cognitive faculty specifically attuned to non-existence, or whether this awareness arises simply within ordinary perception as the non-apprehension of the expected pot given the clear perception of the mat. Affirming a distinct faculty establishes absence cognition as a fifth *pramāṇa*; denying it subsumes negative knowledge under perception or inference.

  Within this logical space, several key positions emerge. The classical Nyāya stance maintains four autonomous *pramāṇas*: it finds perception and inference insufficient alone, affirms the irreducibility of testimony based on the unique authority relation required for understanding speech, upholds comparison as a distinct operation beyond perception-plus-inference, and denies a separate faculty for absence, subsuming negative cognition under perception as non-apprehension. Conversely, Mīmāṃsā thinkers, while often accepting four sources, typically reduce testimony to inference, arguing that the authority of the Veda or a reliable speaker is always established inferentially; they usually accept comparison as independent. Cārvāka and Buddhist logicians, denying the insufficiency of perception and inference, reduce both testimony and comparison: testimony becomes inference about speaker reliability, and comparison dissolves into perception and inference. Navya-Nyāya, developing classical foundations, introduces a fifth autonomous *pramāṇa* for absence cognition, arguing that non-apprehension (*anupalabdhi*) constitutes a unique cognitive process distinct from the positive awareness of perception.

  Synthetic stances exist that preserve the four traditional labels but reinterpret their relations internally. One such view accepts testimony as a distinct *pramāṇa* label yet reduces its underlying mechanism to a special, highly reliable form of inference involving speaker credibility, functionally aligning with the Mīmāṃsā reduction while retaining the nominal category. Similarly, one might label comparison as distinct but analyze its operation as tightly integrated perception and inference, effectively collapsing its autonomy while keeping the name.

  Several combinations in this logical space remain unoccupied. A position affirming five autonomous sources (including absence) yet denying the independence of comparison is logically incoherent, as affirming five includes comparison’s autonomy. A view accepting five sources but reducing testimony is conceivable but historically absent, likely due to the conceptual unattractiveness of multiplying fundamental sources while simultaneously reducing one long-debated candidate. Crucially, no major school affirms testimony as irreducible while simultaneously reducing comparison; this gap may reflect historical neglect, as debates focused on reducing testimony *or* comparison, not selectively reducing one while affirming the other's irreducibility. Furthermore, no position denies the insufficiency of perception/inference (thus reducing testimony and comparison) yet affirms an independent *pramāṇa* for absence, as absence cognition would then require justification solely within perception or inference, which reductionist views consistently maintain is possible.

  Notably, the branches cannot perfectly separate the classical four-fold Nyāya position from certain later synthetics that nominally preserve the four labels. If one reinterprets testimony internally as a special inference but still labels it a distinct *pramāṇa*, this structurally replicates the Mīmāṃsā reduction under a different descriptive framework. Similarly, a view maintaining four labels but analyzing comparison as perception-plus-inference functionally aligns with the Cārvāka/Buddhist reduction of comparison, even if it uses the traditional four names. The core diagnostic thus lies not in the nominal count of sources, but in the specific commitments regarding irreducibility at each conceptual juncture—whether concerning distant fires via speech, similarity recognition in the forest, or the awareness of the missing pot on the mat.
