  ### Key Translation Gaps  
  - **No ML Counterpart**: *Motivational analysis*—Thucydides’ interrogation of "fear, honor, interest" as data confounders has no ML equivalent (models can’t audit source incentives natively).  
  - **Distortion Alert**: Mapping "bias" to *data contamination* oversimplifies; historical bias is systemic (e.g., entire classes of voices excluded), while contamination implies correctable noise.  
  - **Clean Fit**: Direct evidence → ground-truth labeling works perfectly, including reliability weighting (e.g., veteran soldier > poet).  

  ### Why This Matters for ML  
  Herodotus highlights **coverage vs. precision trade-offs** in dataset creation; Thucydides anticipates **adversarial data challenges**. Both grapple with temporal distribution shift—your "epistemic half-life" could inspire decay metrics for stale training data.
