prompt: |-
  I've been trying to determine whether karma, construed strictly as a normative theory of moral desert rather than as a metaphysical mechanism of cosmic causation, can yield coherent verdicts across a range of cases. Here are my intuitive judgments. First, a corporate executive who systematically defrauds employees for decades, amasses enormous wealth, and dies peacefully in old age: I maintain that he genuinely deserves suffering, and that the absence of any visible penalty represents a deficit in the moral order, not proof that desert is illusory. Second, an engineer who accidentally triggers a catastrophic failure despite rigorous safety checks: I judge that she bears no negative desert for the harm, even though the causal outcome is identical to deliberate sabotage. Third, a donor who gives away a fortune solely for social prestige and tax optimization: I think she acquires far less moral credit than a donor motivated by compassion, though she may still deserve public recognition. Fourth, a combatant who kills only in direct self-defense but within an unjust war: I feel she is not blameworthy for the specific killing, yet she still carries some desert-related burden for having participated in an unjust cause. Fifth, I am drawn to a cumulative model—if someone builds substantial positive desert over a lifetime, a single grave transgression should not erase all prior moral standing, just as a single good act should not cancel a history of cruelty. But this conflicts with another conviction: if we allow for rebirth, a person born into extreme suffering despite an exemplary previous life does not necessarily have a hidden moral debt; sometimes suffering strikes me as genuinely undeserved, regardless of prior lives.

  The case that keeps me oscillating involves indirect, systemic harm. Consider a policymaker who implements an economic program she sincerely believes will reduce poverty, but which—through mechanisms she negligently failed to investigate—causes widespread environmental damage that will kill thousands in future generations. Does she accumulate negative desert in proportion to the total harm caused, only in proportion to her culpable negligence in belief-formation, or not at all because she lacked malicious intent?

  Please take a committed stance. State the precise principle—perhaps involving a distinction between direct and indirect desert, a cumulative accounting framework with non-cancellation conditions, or a modified intentionalist criterion—that best accommodates these verdicts. Identify which clause addresses each of the five judgments above, deliver a definite prediction for the policymaker case, and be explicit about which one or two of my intuitions you regard as inconsistent and therefore reject in favor of simplicity. Do not merely list competing theories of karma; defend one reconstructed principle and show exactly where it forces me to revise my gut reactions.
reasoning: |-
  Okay, let me unpack this user's intricate query about karma as a normative theory. They're clearly wrestling with how moral desert should be assigned across varied scenarios—corporate fraud, accidental harm, impure motives, wartime actions, and systemic consequences. The core tension lies between their intuition that desert is cumulative yet non-transferable across lifetimes, and their struggle with unintentional harm cases.

  Hmm... their policymaker case is particularly thorny. They want a principle that can distinguish between malicious intent and negligent ignorance while accounting for massive downstream harm. I notice they're intellectually honest about their conflicting intuitions—especially regarding rebirth where undeserved suffering challenges the very logic of desert. 

  Right, I need to construct a desert-asymmetry principle that prioritizes intent over outcomes but makes negligence culpable. The key moves: desert attaches only to willed actions (addressing the engineer), scales with subjective effort (handling the donor), and accumulates non-cancellably (solving the lifetime balance issue). But this forces rejecting two intuitions—that the fraudster's peaceful death is cosmically unjust (we can't assume outcomes track desert), and that combatants in unjust wars bear desert-burdens (their self-defense is will-neutral). 

  For the policymaker, negligence creates desert proportional to culpable oversight, not total harm. The user might resist this, but it's consistent: if we don't blame engineers for accidents, we can't blame policymakers for unforeseeable chain reactions. Their rebirth concern about undeserved suffering actually helps here—it shows why outcomes can't determine desert. 

  *adjusts framework* Wait, the combatant case needs refinement. If the soldier knowingly joined an unjust war, that initial choice could carry desert-weight even if individual acts are blameless. But the user's phrasing suggests they see the killing itself as non-blameworthy—so I'll stand by excluding desert here to preserve symmetry with accidental harm cases. 

  Ultimately, this principle's elegance justifies overriding some intuitions. The fraudster's case reveals our emotional need for cosmic justice, but normative desert must be outcome-independent. I'll make the tradeoffs explicit: we sacrifice poetic justice and collective guilt for a system that protects accidental actors from disproportionate blame.
answer: |-
  I defend a **Cumulative Intentionalist-Culpability Principle** (CICP) for normative karma:

  > *Moral desert accrues proportionally to the* **deliberate exertion of will** *toward morally significant ends, weighted by* **subjective culpability** *in belief/action formation, with cumulative non-canceling accounts of positive/negative desert maintained separately. Desert attaches only to acts within an agent's rational control and foreseeable moral context.*

  **Core Components:**
  1.  **Deliberate Will Exertion:** Desert requires conscious choice (addressing *Engineer*: no desert for accidents).
  2.  **Subjective Culpability:** Scales desert based on intent, knowledge, and effort in forming beliefs/actions (addressing *Donor*: less desert for impure motives due to weaker benevolent will).
  3.  **Cumulative Non-Canceling Accounts:** Positive/Negative desert accumulate independently; neither fully erases the other (addressing *Cumulative Model*: grave transgression doesn't erase prior good, and vice-versa).
  4.  **Control & Foreseeability:** Desert only for acts/omissions where harms/benefits were reasonably foreseeable given the agent's epistemic diligence (key for *Policymaker*).

  **Addressing Your Verdicts:**
  *   **Corporate Executive (Deserves Suffering):** **Affirmed by CICP Clause 1 & 3.** His fraud is deliberate will exertion (1) toward clear evil, accruing significant negative desert. His peaceful death doesn't negate this desert debt (3), revealing a cosmic deficit.
  *   **Engineer (No Negative Desert):** **Affirmed by CICP Clause 1.** Catastrophe lacked deliberate will exertion; it was accidental.
  *   **Donor (Less Moral Credit):** **Affirmed by CICP Clause 2.** Her motive (social prestige) reflects weaker deliberate exertion of benevolent will compared to compassion, reducing positive desert.
  *   **Combatant (Not Blameworthy for Killing, but Burden):** **Partially Rejected.** CICP **denies any negative desert** for the specific self-defense killing (Clause 1: justified defensive will exertion lacks evil intent). However, *if* her *initial, knowing participation* in the unjust war involved culpable choice (e.g., ignoring evidence of its injustice), *that specific choice* accrues negative desert (Clauses 1 & 2). The "burden" is non-desert-based (e.g., regret, causal responsibility).
  *   **Cumulative Model (Non-Cancellation):** **Affirmed by CICP Clause 3.** Positive and negative desert are separate ledgers.
  *   **Rebirth & Undeserved Suffering:** **Inherent Challenge.** CICP is agnostic on rebirth mechanics but insists *normative desert* (based on *this life's* willed acts) cannot explain suffering inflicted *without* connection to the sufferer's own culpable choices. If suffering seems undeserved, it *is* undeserved by CICP standards; it cannot be justified by "hidden debt" from a prior life within this moral framework. This highlights karma's limitation in explaining all suffering.

  **The Policymaker Case Verdict:**
  The policymaker **accumulates negative desert, but ONLY proportional to her culpable negligence in belief formation (CICP Clause 2 & 4), NOT proportional to the total harm caused.**

  *   **Why?** She deliberately exerted her will to implement the policy (Clause 1). While her intended end (poverty reduction) may be positive, she was **culpably negligent** in failing to investigate foreseeable environmental risks (Clause 2: defective belief formation due to lack of diligence). This negligence makes her subjectively culpable *for the risk-creation*, a morally significant act of omission.
  *   **Why NOT proportional to total harm?** The massive future harm was **not reasonably foreseeable** through diligent investigation (we assume) *and* resulted from complex, indirect systemic interactions far beyond her control or intention (Clause 4). Desert attaches to the culpable *risk-taking through negligence*, not the uncontrollable downstream catastrophe. The harm magnitude is relevant only insofar as it reflects the *degree* of risk a diligent agent *should* have foreseen and guarded against.

  **Rejected Intuitions (For Simplicity & Consistency):**

  1.  **The Combatant's Desert Burden for the Specific Killing:** Your intuition that she carries *desert-related* burden *for the killing itself* is inconsistent with CICP's core tenet (Clause 1). The defensive act, isolated, lacks the deliberate exertion of evil will required for negative desert. We must separate causal responsibility, regret, or political complicity from *moral desert*. Her desert, if any, stems solely from prior culpable choices *to join/support* the unjust war knowingly.
  2.  **The Corporate Executive's Outcome as Proof of Desert Deficit (as Cosmic Injustice):** While emotionally resonant, CICP **rejects the necessity of observing proportional suffering in *this life*** as proof of desert's reality or a cosmic deficit. CICP defines desert normatively based on the agent's willed acts, *not* on cosmic outcome enforcement. The peaceful death doesn't negate the existence of his negative desert; it merely means the cosmic moral ledger (if it exists) hasn't settled *yet* or operates beyond our observation. Insisting visible suffering is *required* to vindicate desert conflates normative desert with a specific theory of cosmic enforcement.

  **Conclusion:** The Cumulative Intentionalist-Culpability Principle (CICP) provides a coherent framework for normative karma by anchoring desert firmly in culpable will exertion. It cleanly resolves the engineer, donor, and cumulative cases. It forces revision on the combatant case (denying desert for the defensive act itself) and reframes the executive's case (desert exists independently of observed outcomes). For the policymaker, it delivers a clear verdict: negative desert arises from her negligent risk-creation, scaled by culpability, not by the unforeseeable catastrophic consequences. This rejects the intuition that cosmic justice *must* be visibly evident within a single lifetime, preserving desert as a normative truth distinct from observable cosmic mechanics.
