prompt: |-
  I run an upper-level epistemology seminar with about 12 grad students, one 90-minute session. Design an in-class game that makes them feel why disjunctivism about perception is more than stubbornness against the argument from illusion — they should run into the problem that subjective sameness doesn't settle mental kind, but with a twist: use an "adversarial hallucination" setup where one group gets a direct peek at a hidden object behind a screen, and another group recieves an identically-worded report delivered through a deceptive causal chain (a printed card that claims live-feed origin but actually describes a matching fake planted by a confederate). Their task is to coordinate a single bet — do we open the box? — with roles (direct perceivers, report-receivers, one skeptical auditor), a point payoff that rewards correct group action but penalizes false consensus based on "we all experienced the same thing," and printed cards only so no tech is needed. Include rules, the payoff scheme, and a timeline. Then a debrief that maps the coordination breakdown onto metaphysical vs epistemic disjunctivism, says what will predictably go wrong the first run and how to handle it, and is honest about which feature — probably the transparency of experience or the factivity of perceptual knowledge — the activity can't actually reproduce and I have to supply verbally. Keep it runnable and focused.
reasoning: |-
  We are designing an in-class game to illustrate disjunctivism in perception. The goal is to show that subjective sameness (the fact that two experiences seem the same) does not settle the mental kind (i.e., whether it is a veridical perception or a hallucination). We use an "adversarial hallucination" setup.

  Game Title: **The Box Bet Challenge**

  **Setup:**
  - A hidden object is placed in a box (e.g., a small box with a lid that can be opened). The object is real and veridical (e.g., a red cube).
  - A confederate (a student or assistant in on the setup) plants a fake object that matches the description of the real one (also a red cube) in a different location, but the fake is never actually shown to anyone until the end (if needed).
  - There are three roles:
    1. **Direct Perceivers (Group A, 3-4 students):** They get a direct peek at the real object in the box. They are told the box will be opened for them to see the object for a few seconds. They then write a brief report on a card (e.g., "There is a red cube in the box") and hand it to the instructor. They are then separated from the others until the discussion.
    2. **Report Receivers (Group B, 7-8 students):** They never see the box. Instead, they are given a printed card that claims to be a live-feed report but is actually pre-printed by the confederate. The card says the same thing as the Direct Perceivers' report (e.g., "There is a red cube in the box"). They are told that this card is a real-time report from a live feed of the box, but in reality, it is based on the fake object planted by the confederate.
    3. **Skeptical Auditor (1 student):** This student is told that there might be a deception and that they must challenge the group to justify their consensus. They are given a card that says: "You are the skeptic. Your role is to question the basis of the group's belief. Remember: the two groups had different causal chains. Ask: How do we know that both groups are having the same kind of experience? How do we know that the report receivers are not being deceived?"

  **Materials:**
  - Box with a real object (e.g., red cube).
  - A fake red cube (planted by confederate, but not shown until the end if needed).
  - Pre-printed cards for Group B (one per student) that say: "There is a red cube in the box." These cards are handed out by the instructor and are said to be a live feed report.
  - Cards for Direct Perceivers to write their report (which they do after seeing the object) and then hand to the instructor (who collects them and then hands out the pre-printed ones to Group B? No, let's clarify: Group A writes their own report, but Group B gets a pre-printed one that matches. The instructor must ensure that the report from Group A is the same as the pre-printed one. So, the instructor can have the pre-printed cards ready and just not use Group A's written ones for anything but to confirm they match. Alternatively, the instructor can just give Group B the pre-printed cards without showing Group A's. We don't want Group A's report to be seen by Group B until the end.)

  **Rules:**
  1. **Introduction (5 mins):** Explain the game. There is a box with an object. The goal is to decide, as a group, whether to bet on the box containing a red cube. If they bet correctly, they get points. If they bet incorrectly, they lose points. Also, if they form a false consensus (i.e., they all agree but are wrong), they get an extra penalty.
  2. **Role Assignment (2 mins):** Assign roles: 3-4 as Direct Perceivers (Group A), 7-8 as Report Receivers (Group B), and 1 as Skeptical Auditor.
  3. **Experience Phase (10 mins):**
     - Take Group A to see the box. Open the box and show them the real object (red cube) for 10 seconds. Then, have each write a report on a card: "There is a red cube in the box." Collect these cards (but they are not shared with Group B).
     - Meanwhile, Group B is given the pre-printed cards (which say the same: "There is a red cube in the box") and told: "This is a live report from the box. The object is currently being observed and this is the report." They are also told that the report is based on a live feed. The Skeptical Auditor is given their role card and instructions.
  4. **Group Discussion (20 mins):** Bring all students together. The goal is to reach a consensus on the bet: do they open the box? (Opening the box is equivalent to betting that there is a red cube inside. Not opening is betting that there isn't.) They must decide as a group. The Skeptical Auditor is instructed to challenge the basis of the consensus, especially if it's based on the idea that both groups had the same kind of experience.
  5. **Betting and Revelation (5 mins):** The group must formally state their bet (open or not). Then, the instructor reveals the truth: the box is opened to show the real red cube (so the correct bet was to open). Also, reveal the deception: Group B was given a pre-printed card that was actually based on a fake object (show the fake red cube if available), and there was no live feed. The confederate is revealed (if used).

  **Payoff Scheme:**
  - The group starts with 0 points.
  - If they bet correctly (open the box, and there is a red cube), they gain 10 points.
  - If they bet incorrectly (don't open, but there is a red cube), they lose 10 points.
  - Additionally, if they form a false consensus (they all agree but are wrong) then they lose an extra 5 points. But note: in this setup, the correct bet is to open (since there is a red cube). So if they don't open, that is incorrect and if they all agreed not to open, that's a false consensus and they lose 15 points total (10 for wrong bet, 5 extra).
  - However, if they don't reach a consensus (i.e., they cannot agree on a bet) then they get 0 points (and avoid the loss, but miss the gain).

  But note: the penalty for false consensus is only if they are wrong and they all agreed. If they are right and they all agree, they get 10 points (no extra penalty because it's true). Also, if they are wrong but didn't all agree (e.g., a split decision) then they just lose 10 points (without the extra penalty). The point is to discourage the idea that consensus based on subjective sameness is a guarantee of truth.

  **Timeline (90 minutes total):**
  - 0-5 mins: Introduction and rules.
  - 5-7 mins: Role assignment.
  - 7-17 mins: Experience Phase (Group A sees the object and writes reports; Group B receives pre-printed reports; Skeptical Auditor gets instructions).
  - 17-37 mins: Group Discussion (20 mins).
  - 37-42 mins: Betting and Revelation.
  - 42-60 mins: Debrief (18 mins).

  **Debrief (18 minutes):**

  1. **What happened? (3 mins)**  
     Ask the students to reflect on the discussion. Likely, the Direct Perceivers were confident. The Report Receivers also thought they had good evidence. The Skeptical Auditor might have raised doubts about the causal chain. But the group probably reached a consensus to open the box (since both groups had the same report) and they were correct. However, note that the Report Receivers were deceived about the source of their report. The key point: the two groups had subjectively the same evidence (the same report) but one group had a veridical experience (Group A) and the other had a non-veridical one (Group B, because their report was based on a fake, even though the actual object was real). However, the group's bet was correct because the object was real. But the problem is that the group consensus might have been based on the idea that both groups had the same kind of experience (they both had a report that said "red cube") and therefore the evidence was the same. But disjunctivism says that the mental states are of different kinds: one is a perception, the other is a kind of hallucination (or in this case, a deceptive report that is not based on the real object).

  2. **Coordination Breakdown (5 mins):**  
     - The group might have overlooked the difference in the causal chains. The Skeptical Auditor was there to raise this. But in the end, because the object was real, they were saved. However, the point is that the subjective sameness does not guarantee that the mental states are the same kind. This maps onto **metaphysical disjunctivism**: the mental states in the good case (perception) and the bad case (hallucination or deceptive report) are of different fundamental kinds, even if they are subjectively indistinguishable.  
     - **Epistemic disjunctivism**: the good case provides factive reasons (Group A knows there is a red cube because they saw it) while the bad case does not (Group B has a mere appearance, which is non-factive). In the game, Group A had factive reasons, Group B did not. But the group might have treated both as equally good. This is the mistake: they thought the consensus was strong because both groups had the same evidence. But in reality, only Group A had factive reasons.

  3. **What predictably goes wrong the first run? (3 mins)**  
     - The group might not have taken the Skeptical Auditor seriously because the bet turned out to be correct. They might think: "See, our consensus worked!" But that's because the world was kind (the object was real). The deception was about the causal chain for Group B, but the object was real so the report happened to be true.  
     - How to handle it: Emphasize that the setup was such that the report was true, but the causal chain for Group B was deceptive. The point is that the mental state of Group B was not a perception but a mere belief based on a false premise (they thought there was a live feed, but there wasn't). The fact that they ended up being right is accidental. In a different run, we could have planted a different fake and then the report would have been false. But we didn't because we wanted to show that even when the report is true, the mental states are different.

  4. **What the activity can't reproduce (2 mins):**  
     - The **transparency of experience**: In the game, Group A had a direct perceptual experience, but Group B had a belief based on a report. The game doesn't actually give Group B a perceptual experience; it gives them a belief. So the subjective sameness is about the content of the report, not the phenomenal character of a perceptual experience. We are using a report as a stand-in for a perceptual experience, but they are not the same.  
     - Also, we cannot fully reproduce the **factivity of perceptual knowledge** because in the game, Group A's knowledge is based on perception, but Group B's belief is based on testimony (even if it is true). The factivity of perception (that seeing that P entails P) is central to disjunctivism, and the game captures that Group A's reason is factive (they saw the red cube, so there is a red cube) while Group B's is not (they have a report, which could be false). But the game doesn't put Group B in a hallucinatory state; it puts them in a state of receiving testimony. So we are using testimony as a model for a non-factive mental state.  
     - You must verbally emphasize: in the classic argument from illusion, the hallucinatory experience is subjectively identical to a veridical perception. Our game uses a testimony-based deception to model the bad case because it's practical, but it doesn't capture the phenomenal character. The point about disjunctivism is that even when the two experiences are subjectively identical, they are of different kinds. In the game, the two groups do not have subjectively identical experiences (one has a visual perception, the other has a belief based on reading a card). So we are approximating the subjective sameness by having the same report content. You must explain that the disjunctivist claims that in the case of genuine perceptual hallucination, the subjective sameness does not imply the same mental kind.

  5. **Wrap-up (5 mins):**  
     - Reiterate the disjunctivist response to the argument from illusion: the argument assumes that because the experiences are subjectively the same, they must be the same kind of mental state. But disjunctivism denies that. The game shows that even when two pieces of evidence are the same in content, they can have different etiologies and hence different epistemic statuses.  
     - The game also shows the danger of false consensus: if the fake had been different (e.g., a blue sphere) and the report had said "blue sphere", then the group would have bet incorrectly and suffered the penalty. The consensus would have been based on ignoring the different causal chains.

  **Note on the confederate:**  
  If you don't have a confederate, the instructor can play that role. The fake object is planted by the instructor before class. The pre-printed cards are prepared in advance.

  This game is runnable without technology and focuses on the key ideas of disjunctivism. The debriefing ties the experience back to the philosophical concepts and clarifies the limitations of the simulation.
answer: |-
  ### **Disjunctivism Game: The Consensus Bet Challenge**  
  **Goal:** Illustrate that subjective sameness (same report/content) doesn’t entail identical mental states, forcing students to confront the disjunctivist claim that veridical perception and deceptive hallucinations are metaphysically distinct, even when indistinguishable.  

  ---

  ### **Game Setup**  
  **Materials:**  
  - A small *hidden object* (e.g., a red cube) in a closed box behind a screen.  
  - A *matching fake object* (e.g., identical red cube) planted elsewhere (unseen by students).  
  - **Role cards** (printed):  
    - **Direct Perceivers (3 students):** *"You see the real object: A red cube is in the box. Write a report: 'Red cube in box.'"*  
    - **Report Receivers (8 students):** *"Live-feed report: Red cube in box. [Secret: This is pre-printed based on the fake object.]"*  
    - **Skeptical Auditor (1 student):** *"Challenge group consensus. Ask: 'Could both groups have different kinds of experiences? How do we know the report isn’t deceptive?'"*  
  - **Betting cards** ("Open" / "Don’t open") for final group vote.  
  - **Payoff tracking** (whiteboard or paper).  

  **Prep (Pre-Class):**  
  - Place real object in box. Plant fake object (e.g., in a drawer). Pre-print Report Receiver cards.  

  ---

  ### **Rules & Timeline (90 mins total)**  
  **0–10 min: Introduction & Role Assignment**  
  - Explain the rules:  
    - **Objective:** As a group, bet whether to open the box (i.e., is there a red cube inside?).  
    - **Roles:**  
      - *Direct Perceivers (Group A):* Briefly peek at the real object. Write an identical report ("Red cube in box").  
      - *Report Receivers (Group B):* Receive a pre-printed card with the same words, allegedly from a "live feed" (actually based on the fake object).  
      - *Skeptical Auditor:* Question if Groups A/B truly have the same evidence.  
    - **Payoff:**  
      - **+10 points:** Correct bet (open box → red cube is inside).  
      - **-10 points:** Wrong bet (open → no red cube, *or* don’t open → red cube inside).  
      - **-5 penalty:** False consensus (entire group agrees on a bet *and* is wrong).  
      - **0 points:** No consensus.  
      > *Rationale:* Penalizes assuming "same report = same evidence." Correct bets require recognizing asymmetric evidence.  

  **10–20 min: Experience Phase**  
  1. **Direct Perceivers (Group A):** Led behind the screen. Shown the real object for 10 seconds. Write reports.  
  2. **Report Receivers (Group B):** Given pre-printed cards. Told: "This is a live report from the box."  
  3. **Skeptical Auditor:** Given role card.  

  **20–45 min: Group Discussion (25 min)**  
  - Groups A and B reunite. Skeptical Auditor joins.  
  - **Task:** Debate and reach a **unanimous bet** (open/don’t open).  
  - **Key constraint:** No revealing role specifics (e.g., Group B can’t say "I read a card"; Group A can’t say "I saw it directly"). Only share *content* (e.g., "I know it’s a red cube").  
  - **Skeptical Auditor’s job:** Force debate on:  
    - "Is Group B’s evidence the *same kind* as Group A’s?"  
    - "What if the report is deceptive?"  

  **45–50 min: Betting & Revelation**  
  - Group submits consensus bet.  
  - **Reveal:**  
    1. Open box → show real red cube (verifying truth).  
    2. Expose deception: Group B’s cards were pre-printed (based on the fake object).  
    3. Payoff calculated.  

  ---

  ### **Debrief (50–90 min)**  
  **1. What Happened? (5 min)**  
  - Groups A and B had identical reports ("Red cube in box").  
  - Group A *saw* the object; Group B received deceptive testimony.  
  - **Predicted outcome:** Likely consensus to "open" (correct bet). But the path matters:  
    - *Mistake:* Groups assume "same report → same evidence → consensus is safe."  
    - *Reality:* Only Group A had direct access. Group B’s evidence was non-factive (could have been false).  

  **2. Mapping to Disjunctivism (15 min)**  
  - **Metaphysical Disjunctivism:**  
    - Group A: Veridical perception (mental state: *seeing a red cube*).  
    - Group B: Hallucinatory-equivalent (mental state: *seeming to have a live report, but it’s deceptive*).  
    - **Twist:** Subjective sameness (same words) masked metaphysical difference. The bet succeeded *despite* Group B’s state being defective.  
  - **Epistemic Disjunctivism:**  
    - Group A: Had factive reason ("I saw it → it must be true").  
    - Group B: Had non-factive reason ("I have a report → but it could be fake").  
    - **Coordination breakdown:** Consensus relied on ignoring this asymmetry. The Skeptical Auditor’s role forced epistemic humility.  

  **3. Predictable Problems & Fixes (5 min)**  
  - **Problem 1:** Students downplay the deception (since bet was correct).  
    - *Fix:* Stress: "The *risk* was real. If the fake was blue, Group B’s report would be false."  
  - **Problem 2:** Skeptical Auditor ignored (Group B assumes "my evidence feels the same").  
    - *Fix:* Highlight Auditor’s questions: "Did Group B *perceive* or *infer*? Could their state be non-factive?"  
  - **Problem 3:** Groups focus on content, not mental kind.  
    - *Fix:* Ask: "If you were Group B, could you *truly* say ‘I saw the cube’?"  

  **4. Honest Limitation (5 min)**  
  - **What the game CAN’T reproduce:** The *phenomenal transparency of experience*.  
    - In real perception, experience feels "open to the world" (I see *the cube itself*).  
    - In the game:  
      - Group A approximates this (direct peek).  
      - Group B has testimony-based belief—*not* a hallucinatory experience with identical phenomenology.  
    - **Verbal bridge:** "Disjunctivism claims that in veridical cases, you’re directly aware of the object. Hallucinations lack this factivity, even if they ‘feel’ the same. Here, Group B had a belief, not a perception—so we must *imagine* the hallucinatory case."  

  **5. Takeaway (5 min)**  
  - Disjunctivism isn’t stubbornness; it’s a claim about metaphysical *difference*.  
  - **Lesson:** Subjective sameness ≠ mental sameness. The argument from illusion errs by assuming indistinguishability implies identical mental kinds.  
  - **Connect to literature:** "This is why disjunctivists reject the ‘common kind’ theory (Snowdon, McDowell). The good and bad cases are fundamentally distinct, even if we can’t tell them apart."  

  ---

  **Why This Works:**  
  - **Low-tech:** Only paper cards and props.  
  - **High engagement:** Roles create tension; payoff incentivizes critical debate.  
  - **Targeted learning:** Forces confrontation with disjunctivism’s core insight—mental kind isn’t settled by "what it seems like."  
  - **Debrief depth:** Links game dynamics to metaphysical/epistemic disjunctivism and preempts misconceptions.  

  **Run it next week—your skeptics will duel, but they’ll feel the disjunctivist pull!**
