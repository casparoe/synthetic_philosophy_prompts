  1. **Agreed Claims** (Numbered section for points of agreement):
     - Logical form of the conceivability argument: We agree that the conceivability argument, as applied to affective partial zombies, has the following logical structure: 
       (i) It is conceivable that there exists an affective partial zombie (a being physically and functionally identical to a conscious human but lacking affective phenomenal character while retaining sensory-phenomenal experience and cognitive-functional organization).
       (ii) If it is conceivable, then it is metaphysically possible.
       (iii) If it is metaphysically possible that such a being exists, then the physical-functional facts do not metaphysically necessitate the facts about affective phenomenal consciousness.
       (iv) Therefore, physicalism (understood as the thesis that the physical facts metaphysically necessitate all facts) is false, at least with respect to affective phenomenal properties.

     - Definition of an affective partial zombie: We agree to define an "affective partial zombie" as a being that is physically identical (at every level of description, including microphysical and functional organization) to a normal conscious human being, but which lacks the affective phenomenal character (the felt quality of pain, pleasure, emotional valence, and other valenced experiences) while retaining:
       - All sensory-phenomenal experiences (e.g., the qualitative character of seeing red, hearing a trumpet, feeling a texture, etc., without the associated affective valence).
       - Full cognitive-functional organization, including the ability to report on internal states, to behave appropriately in response to stimuli (e.g., withdrawing from a painful stimulus, seeking pleasurable ones), and to have cognitive states such as beliefs and desires that are normally associated with affective states.

     - Distinction between metaphysical and epistemic possibility: We agree that metaphysical possibility concerns what is genuinely possible in reality, given the nature of things, while epistemic possibility concerns what is consistent with what we know or can conceive. We agree that the key dispute is whether the conceivability of the affective partial zombie entails its metaphysical possibility.

