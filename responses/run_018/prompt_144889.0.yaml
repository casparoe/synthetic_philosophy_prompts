     | The affective partial zombie scenario, being more restricted and thus more conceivable than a total zombie, strengthens the anti-physicalist argument by isolating a core aspect of consciousness. | The affective partial zombie scenario is less threatening to physicalism than the total zombie scenario because affective states are more tightly integrated with functional-causal roles. | Whether the functional-causal integration of affective states makes the partial zombie less conceivable (or less indicative of metaphysical possibility) than the total zombie. |
     | Our grasp of affective feeling reveals the intrinsic nature of those states, which is not captured by functional-causal roles. | Our grasp of affective feeling only reveals the functional-causal roles and the associated cognitive and behavioral dispositions, not an intrinsic nature separable from function. | Whether our introspective grasp of affective phenomenal character reveals properties that are intrinsic and non-functional, or only functional-causal roles. |

  3. **Cruxes** (sub-questions that, if resolved, would move at least one camp):

