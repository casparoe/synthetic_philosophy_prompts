answer: |-
  ### Joint Statement: Adversarial Collaboration on Affective Partial Zombies  

  #### 1. Agreed Claims  
  We, Camp A (anti-physicalist) and Camp B (physicalist), agree on the following:  
  - **Logical Form of the Conceivability Argument**:  
    (i) Affective partial zombies (APZs) are conceivable: we can coherently imagine beings physically/functionally identical to humans but lacking affective phenomenal character (e.g., felt pain/unpleasure, joy, or emotional valence) while retaining sensory phenomenology (e.g., visual/auditory qualia) and cognitive-functional organization (e.g., beliefs, learning, pain-avoidance behavior).  
    (ii) **If** conceivability entails metaphysical possibility, **then** APZs are metaphysically possible.  
    (iii) **If** APZs are metaphysically possible, **then** physical-functional properties do not metaphysically necessitate affective phenomenal properties.  
    (iv) **Therefore**, if (i)–(iii) hold, physicalism (understood as the thesis that physical facts metaphysically necessitate all facts) is false.  

  - **Definition of Affective Partial Zombie (APZ)**:  
    An APZ is physically identical (microstructurally, biologically, and computationally) to a conscious human but lacks *only* affective phenomenal character. It retains:  
    - Sensory-phenomenal experience (e.g., the "redness" of an apple, unaccompanied by pleasure or disgust).  
    - Cognitive-functional capacities (e.g., verbal reports of "pain" based on nociception, reward-seeking behavior, emotional language, and physiological responses like grimacing).  

  - **Metaphysical vs. Epistemic Possibility**:  
    - **Metaphysical possibility**: What could exist given the nature of reality (independent of human cognition).  
    - **Epistemic possibility**: What is consistent with our knowledge or conceptual limitations.  
    We agree that conceivability does not *automatically* imply metaphysical possibility and that the crux is whether APZ conceivability reflects a gap in reality or cognition.  

  #### 2. Disagreements Table  
  | Camp A’s Formulation (Accepted by Camp A)                                                                 | Camp B’s Formulation (Accepted by Camp B)                                                                 | Precise Crux                                                                                                                             |  
  |-----------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------------|  
  | Conceiving APZs shows affective phenomenology is not metaphysically necessitated by physical/functional properties, strengthening the anti-physicalist argument. | Conceiving APZs tracks epistemic possibility only, reflecting limitations in our concepts or knowledge, not metaphysical possibility. | Whether APZ conceivability entails metaphysical possibility. |  
  | APZs are *more* conceivable (and thus more threatening to physicalism) than total zombies because they isolate a minimally controversial aspect of consciousness. | APZs are *less* conceivable (and thus less threatening) than total zombies due to the tight functional-causal integration of affective states. | Whether functional-causal integration makes APZs harder to conceive than total zombies, weakening the argument. |  
  | Introspection reveals affective states have intrinsic, non-functional properties (e.g., pain’s felt badness) that are not captured by causal roles. | Introspection reveals only functional-causal roles of affective states (e.g., pain’s motivational/dispositional role), not intrinsic properties separable from function. | Whether introspection discloses intrinsic properties of affect beyond functional-causal roles. |  

  #### 3. Cruxes  
  Sub-questions whose resolution would shift at least one camp’s position:  
  - **Crux 1**: Does introspection of affective feeling reveal its intrinsic, non-functional nature, or only functional-causal roles?  
  - **Crux 2**: Can functional-causal integration (e.g., pain’s role in motivating avoidance) be separated from affective phenomenology without contradiction?  
  - **Crux 3**: Does APZ conceivability entail metaphysical possibility?  
  - **Crux 4**: Is the APZ scenario more or less threatening to physicalism than the total-zombie scenario?  

  #### 4. Arguments, Considerations, and Predictions per Crux  
  **Crux 1: Introspection’s epistemic reach**  
  - **Argument/Thought Experiment**:  
    Consider a hypothetical "functional reporter" who accurately describes pain’s causal roles (e.g., "This stimulus causes avoidance") but lacks phenomenal affect. Camp A argues introspection reveals an intrinsic "badness" beyond these reports; Camp B argues introspection merely accesses functional roles from a first-person perspective.  
  - **Empirical Consideration**:  
    Studies on pain asymbolia (patients feel pain’s sensory qualities but lack aversion) and their ability to articulate functional roles without affective distress.  
  - **Predictions**:  
    - *Camp A*: If asymbolics report intact functional understanding *but* no awareness of intrinsic badness, this confirms introspection reveals non-functional properties.  
    - *Camp B*: If asymbolics show attenuated functional competence (e.g., inconsistent avoidance), this confirms introspection only accesses functional roles.  

  **Crux 2: Separability of function and phenomenology**  
  - **Argument/Thought Experiment**:  
    An "APG (Affective Phenomenology Generator)" implant that adds affective phenomenology to an APZ without altering its physical/functional properties. Camp A argues this is coherent (implying separability); Camp B argues it is incoherent (affective function *is* the phenomenology).  
  - **Empirical Consideration**:  
    AI systems simulating human pain behavior (e.g., reinforcement learning with "pain" signals) and whether they necessitate affective phenomenology.  
  - **Predictions**:  
    - *Camp A*: If AI passes behavioral tests for affect (e.g., adaptive avoidance) without phenomenological claims, separability is possible.  
    - *Camp B*: If such AI inevitably develops phenomenology-like properties (e.g., system-integrative feedback), separability is implausible.  

  **Crux 3: Conceivability to metaphysical possibility**  
  - **Argument/Thought Experiment**:  
    A "minimal physical duplicate" world identical to ours but lacking affective phenomenology. Camp A argues this is metaphysically possible if conceivable; Camp B argues conceivability arises from ignorance of a posteriori necessities (e.g., "pain" just is a functional state).  
  - **Empirical Consideration**:  
    Neural correlates of affect (e.g., insula activity during pain) and whether they are *exhaustively* explained by functional-causal networks.  
  - **Predictions**:  
    - *Camp A*: If neural correlates overlap with non-affective states (e.g., cognition), APZs remain metaphysically possible.  
    - *Camp B*: If neural correlates are functionally unique to affect, APZ conceivability is merely epistemic.  

  **Crux 4: Threat level of APZs vs. total zombies**  
  - **Argument/Thought Experiment**:  
    Compare conceiving a total zombie (lacking all phenomenology) to an APZ. Camp A argues APZs avoid objections about cognitive collapse (since cognition is preserved), making them *stronger* evidence against physicalism. Camp B argues affect’s functional entanglement (e.g., pain’s necessity for learning) makes APZs *harder* to conceive than total zombies.  
  - **Empirical Consideration**:  
    Behavioral deficits in conditions with blunted affect (e.g., depression) versus global cognitive impairment (e.g., advanced dementia).  
  - **Predictions**:  
    - *Camp A*: If subjects with blunted affect show preserved learning/behavior (e.g., via cognition alone), APZs are more credible.  
    - *Camp B*: If blunted affect consistently impairs motivation/learning, APZs are less credible.  

  #### 5. Verbal Disputes  
  We identify one potential verbal dispute:  
  - **Term**: "Metaphysical possibility."  
  - **Why potentially verbal**: If Camp B defines physicalism as including non-reductive emergence (where affect is fundamental but physical-dependent), the disagreement may reduce to terminology. However, since both camps define physicalism as *functional-physical facts necessitating all facts*, the dispute is substantive.  
  No other disputes are deemed verbal, as disagreements hinge on empirical predictions and modal metaphysics.  

  ---  
  **Status**: This statement reflects our current positions. Resolution depends on empirical outcomes and philosophical advances at the specified cruxes.
