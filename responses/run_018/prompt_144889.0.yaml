     - Crux 4: Is the affective partial zombie scenario more or less threatening to physicalism than the total zombie scenario, given the functional integration of affective states?

  4. **For Each Crux, the Specific Argument, Thought Experiment, or Empirical Consideration, with Each Camp's Prediction**:

     - **Crux 1: Introspective grasp of affective feeling**
       - **Argument/Consideration**: Consider the thought experiment of a "functional duplicate" who behaves identically in response to affective stimuli (e.g., says "Ouch!" when injured, avoids injury, describes their state using the same words as we do) but lacks the felt unpleasantness of pain. Camp A argues that introspection reveals that the unpleasantness is an intrinsic aspect of pain that is not exhausted by its functional role. Camp B argues that introspection only reveals the functional role and that what we call the intrinsic aspect is just the functional role as experienced from the first-person perspective.
       - **Empirical Consideration**: Studies on pain asymbolia (where patients report feeling pain but without the unpleasantness) and the neural correlates of the affective vs. sensory components of pain. Also, research on blindsight and other conditions might shed light on the separability of phenomenology and function.
       - **Camp A's prediction**: If empirical work shows that the affective component of pain can be dissociated from the sensory component and that the affective component is tied to specific neural substrates that are not directly involved in the sensory-discriminative processing, then this would support the view that affective phenomenology is an intrinsic property that can be separated from the functional role.
       - **Camp B's prediction**: If empirical work shows that the affective component of pain is always tied to specific functional roles (e.g., motivation to avoid) and that when the affective component is absent, the functional role is also impaired (even if partially), then this would support the view that the affective phenomenology is not separable from the functional role.

     - **Crux 2: Separability of functional-causal integration from affective phenomenology**
       - **Argument/Consideration**: The thought experiment of an affective partial zombie: can we conceive of a being that has all the functional-causal roles of affective states (e.g., being motivated by "pain" to avoid injury, learning from "pleasure" to repeat actions) without any affective phenomenology? Camp A says yes, because the functional role can be implemented without the feeling. Camp B says no, because the functional role is what constitutes the feeling, or because the feeling is an essential part of the functional role (e.g., the motivational oomph of pain is its unpleasantness).
       - **Empirical Consideration**: Research on artificial intelligence and robotics: can we build a system that functionally mimics all human affective behaviors without having any inner feeling? Also, studies on dissociation between affective experience and behavior in neurological or psychiatric conditions (e.g., in depression, where there might be a lack of affective response but preserved cognitive function).
       - **Camp A's prediction**: If it becomes possible to create AI systems that perfectly replicate human affective behavior without any internal phenomenal states (as we understand them), then this would support the separability of function from phenomenology.
       - **Camp B's prediction**: If it turns out that any system that perfectly replicates the functional-causal roles of affective states must, by necessity, have the affective phenomenology (or if we cannot even conceive of such a system without phenomenology), then this would support the inseparability.

     - **Crux 3: From conceivability to metaphysical possibility**
       - **Argument/Consideration**: The modal argument: Camp A holds that if we can clearly and distinctly conceive of an affective partial zombie without contradiction, then it is metaphysically possible. Camp B holds that our conceivability might be limited by our cognitive architecture or conceptual resources, and that what we can conceive might not reflect metaphysical possibility because we might be missing some a posteriori necessities.
       - **Thought Experiment**: Consider a world that is physically identical to ours but where the beings lack affective phenomenology. Camp A says we can conceive this. Camp B says that if physicalism is true, then such a world is not metaphysically possible, so our conceiving it must be an illusion.
       - **Empirical Consideration**: None directly, but advancements in our understanding of the neural correlates of consciousness might reveal whether there is an a posteriori necessity tying the physical to the affective phenomenal.
       - **Camp A's prediction**: If we discover that the neural correlates of affective states are distinct from those of sensory states and that they can be manipulated independently, then this would support the idea that the affective part is not metaphysically necessitated.
       - **Camp B's prediction**: If we discover that the neural correlates of affective states are so deeply integrated with the functional-causal roles that any system with the same functional organization must have the same affective phenomenology, then this would support that the conceivability is only epistemic.

     - **Crux 4: Threat level of partial vs. total zombies**
       - **Argument/Consideration**: Camp A argues that the affective partial zombie is more conceivable and thus a stronger argument because it avoids objections to total zombies (e.g., that consciousness is needed for complex cognition). Camp B argues that because affective states are more tightly tied to functional roles (e.g., pain is tied to avoidance behavior) than, say, sensory qualia (which might be more detachable), the partial zombie scenario is actually harder to conceive and thus less threatening.
       - **Thought Experiment**: Compare the conceivability of a total zombie (lacking all phenomenal consciousness) with an affective partial zombie. Camp A says the partial zombie is easier to conceive. Camp B says the total zombie might be easier to conceive because it doesn't require the fine-grained separation of affective from sensory phenomenology and function.
       - **Empirical Consideration**: Studies on the functional roles of affective states versus sensory states. For example, if it is shown that affective states are more causally integrated (e.g., necessary for learning and decision-making) than sensory states, then the partial zombie might be less conceivable.
       - **Camp A's prediction**: If empirical work shows that affective states can be selectively impaired without affecting cognitive functions (beyond what is expected from the loss of motivation), then this would support the conceivability of affective partial zombies and their threat to physicalism.
       - **Camp B's prediction**: If empirical work shows that affective states are indispensable for the functional roles they play (so that without the phenomenology, the function breaks down), then the partial zombie scenario becomes inconceivable and thus not a threat.

  5. **Concluding Section** (identifying any merely verbal disputes):

     We agree that there are no merely verbal disputes in our current disagreement. Both camps are using the same definitions of key terms (e.g., "affective partial zombie", "metaphysical possibility", "functional organization") and the same logical structure of the conceivability argument. The disagreements are substantive and revolve around the nature of affective phenomenology, the relationship between conceivability and possibility, and the implications for physicalism.

     However, we note that if one were to use a different definition of "physicalism" (e.g., one that allows for non-reductive physicalism that includes phenomenal properties as fundamental), then the dispute might shift. But in the context of this collaboration, we are considering physicalism as the thesis that the physical facts metaphysically necessitate all facts, and we are focusing on whether affective phenomenal facts are necessitated.

     We also note that the term "intrinsic nature" in Crux 1 might be a potential source of verbal confusion, but we have clarified that by "intrinsic nature" we mean a property that is not exhausted by functional-causal roles and is revealed introspectively. Both camps agree on this definition for the purpose of the dispute.

