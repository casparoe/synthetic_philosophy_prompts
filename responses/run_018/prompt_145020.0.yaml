  Also, avoid making it sound like she predicted a robot utopia. Stress the paradox and her contribution to understanding capitalism's adaptability. The toast should feel personal, like the user is sharing a revelation after their debate with Marcus.

  Structure-wise, start with a personal anecdote to connect, explain the central tension in simple terms, then link to Elena's impact. Use applause moments to engage both groups. End with gratitude and a toast, keeping it warm and celebratory. 

  Need to ensure clarity without academic language. Phrases like "work capital takes for free" instead of "exploitation." Metaphors like "dissolving the line" can illustrate the blurring of labor boundaries. Check that Marxists would nod in recognition while relatives feel proud of her intellectual beauty.

  Finally, keep it to five minutes—about 750 words. Balance depth with brevity, maintain a respectful yet heartfelt tone, and honor Elena's legacy without oversimplifying her life's work.
