  ## Research Plan: Conceptual Distinctions and the Legitimacy of Amnesty in Transitional Justice

  **Precise Research Question:**  
  Does maintaining a rigorous conceptual distinction between *political forgiveness* (understood as an institutional act restoring civic membership and enabling democratic continuity) and *moral forgiveness* (the unconditional prerogative of individual victims) constitute a necessary condition for the normative legitimacy of amnesty provisions enacted by truth commissions?

  **Problem in Existing Debates:**  
  Prevailing frameworks within transitional justice theory evaluate amnesty primarily through either retributive or restorative lenses, leading to ambiguity regarding legitimacy. Retributive accounts (emphasizing punishment as justice) inherently view amnesty as normatively suspect, a violation of the duty to punish grave wrongs, often dismissing its legitimacy outright regardless of context. Restorative accounts, conversely, frequently subsume amnesty under a broad, undifferentiated goal of "reconciliation," treating it as a tool for societal healing. This restorative framing tends to conflate distinct processes: the *political* necessity of stabilizing a new democracy and reintegrating perpetrators as citizens (*political forgiveness* as institutional act) with the profoundly *personal*, moral domain of victims' emotional and relational healing (*moral forgiveness*). By failing to disentangle these concepts, both frameworks obscure the specific conditions under which amnesty might gain normative legitimacy – specifically, whether its justification rests *solely* on the political function of enabling transition and restoring civic bonds, while explicitly preserving the inviolable space for individual moral judgment by victims.

  **Conceptual Methodology:**  
  This research employs a rigorous *conceptual-analytical* method focused on the *institutional discourse and structure* of amnesty provisions, analyzed against the *philosophical architecture of forgiveness*. The core activity is a close textual and conceptual dissection of:

  1.  **The Institutional Language:** Examining the foundational documents, enabling legislation, operational mandates, and public justifications of the Argentine (National Commission on the Disappearance of Persons - CONADEP) and South African (Truth and Reconciliation Commission - TRC) truth commissions. The focus is on how these texts explicitly or implicitly frame "forgiveness," "reconciliation," "amnesty," and related concepts concerning perpetrators' status and victims' roles.
  2.  **The Philosophical Structure:** Applying a philosophical lens derived from theories of forgiveness (e.g., distinguishing conditional/unconditional, performative/emotional, institutional/personal dimensions) to the institutional language identified. The critical analysis asks: Does the commission's discourse and the amnesty mechanism's design maintain a clear boundary between (a) the *political act* of granting amnesty/restoring civic standing based on specific (often conditional) criteria relevant to state interests and democratic survival, and (b) the *moral sphere* where the language explicitly or implicitly affirms that the victim's personal forgiveness remains entirely distinct, uncoerced, and unaffected by the political act?

  This method deliberately avoids an empirical cross-case comparison of outcomes or victim perceptions. Instead, it scrutinizes the *conceptual coherence and clarity within the institutional framework itself* regarding the separation (or conflation) of political and moral forgiveness domains.

  **Workshop Deliverable:**  
  The workshop paper will deliver a **refined conceptual toolkit and typology** for scholars and practitioners. Specifically, it will provide:

  1.  **Clear Definitions:** Precise, operational definitions distinguishing "political forgiveness" (institutional, conditional, civic-restorative) from "moral forgiveness" (individual, unconditional, relational).
  2.  **Legitimacy Criteria:** A framework identifying how the *explicit recognition and institutional safeguarding* of this distinction within a truth commission's mandate and amnesty provisions serves as a key criterion for the *normative legitimacy* of amnesty itself.
  3.  **Analytical Illustration:** Demonstration of how applying this toolkit resolves the apparent paradox of differing legitimacy conditions in Argentina (where forensic documentation focused on truth/accountability *without* perpetrator amnesty being central to the commission's core function, implicitly separating political justice from moral forgiveness) and South Africa (where amnesty conditioned on public confession within an *ubuntu* framework risked conflating institutional reintegration with expectations of interpersonal/moral forgiveness, creating distinct legitimacy challenges).

  **Criteria for Project Failure:**  
  This research project would fail to achieve its aims if:

  1.  **Conceptual Collapse:** The proposed distinction between political and moral forgiveness proves unsustainable under conceptual scrutiny, collapsing into merely rhetorical variants of a single, undifferentiated concept of "forgiveness" with no meaningful structural difference relevant to institutional design.
  2.  **Irrelevance to Legitimacy:** The analysis demonstrates that maintaining or neglecting this distinction within the institutional language and structure of amnesty provisions has *no discernible conceptual bearing* on the normative legitimacy arguments for or against amnesty, failing to illuminate the core question.
  3.  **Indistinguishable Frameworks:** The application of the framework to the Argentine and South African cases fails to yield a clearer, more convincing explanation for their divergent legitimacy conditions than existing retributive or undifferentiated restorative accounts, rendering the conceptual innovation superfluous.
  4.  **Excessive Abstraction:** The analysis becomes divorced from the practical realities of transitional justice mechanisms, producing a conceptual schema too abstract or philosophically rarefied to offer useful insights for evaluating actual truth commission mandates and amnesty provisions.

  This focused conceptual analysis, grounded in institutional discourse and philosophical clarity, aims to provide a novel and critical lens for evaluating the fraught normative terrain of amnesty in democratic transitions.
