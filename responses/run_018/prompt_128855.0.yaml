prompt: |-
  hey, im a phd student in political philosophy and i need help drafting something for my advisor's workshop. can you act like an expert in ancient economic thought and also a policy consultant? please think carefully and start with a quick brainstorm.

  i want a decision procedure that a municipal ethics board could actually run when they get proposals for local exchange systems—like time banks, labor-hour credits, or neighborhood digital currencies. ground it in aristotle's distinction between oikonomia and chrematistike, especially the idea that money is barren and shouldn't breed more money through intrest or accumulation for its own sake. but don't just summarize aristotle—translate it into ordered questions the board asks, what counts as a sufficient answer, where the procedure stops with a reject, and where it has to hand off to a value judgment because the theory runs out.

  then apply the procedue to two concrete proposals: (1) a neighborhood time-bank where labor hours are non-convertible and expire after one year, and (2) a digital local-currency that allows users to hold savings accounts with intrest. include at least one case where the procedure technically approves something but the result feels wrong for the board, and flag exactly where aristotle's framework just breaks down when faced with modern mediated exchange. no need for citations or a reading list—work straight from the concepts.

  also, there might be a typo or two in this prompt but just answer it normally lol
