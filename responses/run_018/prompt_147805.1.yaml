  The core tension lies between A's epistemic/practical approach (comparing combatant equality to scientific conventions like calibration standards) and B's insistence on normative consistency. I notice how the user specifically highlights two key uncertainties: whether scientific symmetry analogies truly support epistemic arguments, and whether separating threat-posing from culpability actually undermines moral equality.

