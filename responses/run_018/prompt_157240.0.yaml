  For positions: "IIT Absolutist" works for strict integrated information theory, "Capacity Utilitarian" for suffering-focused views. Need something for niche-based approaches too. The "unnamed" branches are where novel philosophical ideas might emerge.

  The tree should feel exploratory - messy with question marks and caveats. Since it's for fiction, leaving some branches underdeveloped might actually inspire plot points. User seems sophisticated - they'll appreciate nuanced dead ends.

  Biggest challenge is avoiding philosopher names while keeping the logic sound. And maintaining that scribbled notebook vibe with implied stakes: "THIS LEADS TO RANKING FUNGUS OVER CHILD?!" kind of energy.
