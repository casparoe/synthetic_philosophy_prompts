answer: |-
  Here's the translation of the classic akrasia debate into behavioral economics vocabulary, with explicit mapping assessments and residue analysis. Confidence levels (1-10, 10=highest) and conceptual gaps are noted.

  ---

  ### **1. Socratic Intellectualism**  
  *Philosophy*: "No one does wrong willingly" – akrasia is impossible; weakness of will is ignorance (misjudgment of the good).  
  *Behavioral Econ Translation*:  
  - **Clean Map**: Absence of present-bias (β=1). Agents are exponential discounters (δ-only) with stable, consistent utility functions. "Akrasia" is always a *calculation error* (e.g., misestimating future utilities/costs).  
  - **Distortion**: Socrates treats normative "good" as objective. Econ treats utility as subjective/preferential – so "ignorance" becomes a data/forecasting problem, not moral error.  
  - **Residue**: Socrates' *moral realism* (objective "good" exists) has no counterpart. Econ is preference-based, not value-realist.  
  - **Confidence**: 9/10. Fits rational choice models neatly if we assume perfect rationality.  

  ### **2. Aristotle's Incontinence (akrasia vs. akolasia)**  
  *Philosophy*: Akrasia = acting against better judgment *with regret*; Akolasia = impenitent vice. Distinction hinges on conflict/regret.  
  *Behavioral Econ Translation*:  
  - **Clean Map**:  
    - *Akrasia*: Present-biased preferences (β<1). The "better judgment" is the long-term plan (δ-optimal), overridden by high β in the moment (e.g., binge-watching vs. thesis work). Regret emerges post-choice when β normalizes.  
    - *Commitment Devices*: Aristotle's "enkrateia" (self-control) maps to precommitment (e.g., Ulysses contracts).  
  - **Distortion**: Aristotle’s "practical syllogism" (minor premise overpowering major) is forced into β-δ framing. Akrasia’s *temporal conflict* is clear, but not its *rational structure*.  
  - **Residue**:  
    - *Akrasia/Akolasia distinction*: Econ sees both as present-bias. Akolasia’s *lack of regret* might be modeled as state-dependent utility (vice "reprograms" preferences), but Aristotle’s *moral character* dimension is lost.  
    - *Normative pull*: The "better judgment" isn’t just a prediction – it has rational authority. Econ has no analogue for "judgment as normative commitment."  
  - **Confidence**: 7/10 (akrasia); 5/10 (akolasia distinction).  

  ### **3. Davidson's All-In Judgments**  
  *Philosophy*: Akrasia occurs when an agent acts against their "all-in" judgment (best *all-things-considered*) due to a stronger "conditional" judgment (e.g., "This is best, *if* I ignore the cake").  
  *Behavioral Econ Translation*:  
  - **Clean Map**:  
    - *State-dependent utility*: The "all-in" judgment is the utility function in a cool state (low β). The "conditional" judgment reflects hot-state utility (high β, e.g., visceral craving).  
    - *Overturning*: Hot-state β overwhelms δ, making the conditional (short-term) utility dominant.  
  - **Distortion**: Davidson’s logical conflict (prima facie vs. all-in judgments) becomes purely intertemporal. His focus on *irrationality* (logical inconsistency) is reduced to dynamic inconsistency.  
  - **Residue**:  
    - *Logical/moral conflict*: Davidson’s agent violates their own rationality norms. Econ’s agent is consistent within each state – no "self-betrayal," just shifting states.  
    - *All-in judgment as synchronic*: For Davidson, the conflict is simultaneous; econ serializes it via state shifts.  
  - **Confidence**: 6/10. State-dependency fits, but loses the synchronic irrationality.  

  ---

  ### **The Residue: Gap or Noise?**  
  - **Real Gaps**:  
    1. **Normativity**: Philosophy’s "better judgment" carries rational/moral obligation; econ’s utility is descriptive. Aristotle’s regret isn’t just prediction error – it’s *recognition of failure*.  
    2. **Character (akolasia)**: Econ cannot distinguish *regrettable* vs. *unrepentant* weakness – both are β<1. Akolasia implies corrupted rationality, not just dynamic inconsistency.  
    3. **Synchronicity (Davidson)**: Philosophy’s simultaneous conflict lacks a clean economic model (e.g., multiple utility functions active at once).  
  - **Verbal Noise?**:  
    - Terms like "incontinence" or "all-in judgment" are semantic baggage – the *mechanics* of conflict (β-δ, state-dependence) capture the core behavior.  
  - **Verdict**: **Residue reflects genuine gaps**. Behavioral econ describes *how* akrasia happens mechanically but cannot fully capture philosophy’s *why* – e.g., the rational agent’s self-reproach or Aristotle’s character-based ethics.  

  **Least Confident Claim**: Mapping Davidson’s "all-in judgment" to long-term discounting (6/10). Davidson’s focus is logical, not temporal; state-dependence is the best fit, but it feels like a workaround.  

  **One-sentence summary**: Behavioral econ reduces akrasia to present-biased preferences and state-switching, but cannot fully capture philosophy's normative, characterological, or synchronic-logical dimensions.
