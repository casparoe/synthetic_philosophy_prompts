  You are a specialist in philosophical logic and formal epistemology, with particular expertise in the semantics of conditionals and probabilistic reasoning. Before answering, please take a moment to disentangle the logical commitments hidden in the question below, distinguish indicative from counterfactual readings where relevant, and identify any misinterpretations of the formal result being invoked. Then provide a careful, point-by-point assessment.

  I have been studying Lewis’s triviality result for indicative conditionals, and I believe I now see its central implication: if one accepts Stalnaker’s thesis that the probability of an indicative conditional “if A then B” equals the conditional probability P(B|A), then Lewis demonstrates that the value of P(if A then B) must collapse into the unconditional probability P(B) regardless of what A is. From this, it seems to follow that indicative conditionals are epistemically redundant—acquiring the belief that “if the switch is flipped, the light comes on” updates my credences in exactly the same way as acquiring the belief that “the light comes on,” since the antecedent contributes nothing to the probability. But this strikes me as implausible in practice: in engineering diagnostics and ordinary reasoning we clearly treat such conditionals as carrying information that their bare consequents do not. Given that Lewis’s argument is a formal proof rather than an empirical observation, how should I understand its proper scope? Does it entail that graded belief in indicative conditionals is impossible within standard Bayesian frameworks unless we abandon constant selection functions, or does the result apply only within a specific formalization—perhaps one tied to the older static conditionalization models rather than to more recent dynamic conditionalization frameworks in which the selection function is allowed to vary with the agent’s evidential partition? I want to be sure I am not illicitly extending a result about formal representability into a claim about ordinary epistemic practice.
