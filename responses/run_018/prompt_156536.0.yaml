  Below is a decision tree that taxonomizes views on "many-sided truth" based on concrete answers to diagnostic cases, starting from the commitment that "the self is permanent and also subject to change" can be genuinely asserted without contradiction. Each node poses a question answerable without philosophical expertise, focusing on the resolution mechanism: partitioning the object (aspect-pluralism), partitioning conditions of access (modal-pluralism), relativizing predicates (semantic-contextualism), or denying objective multifacetedness (epistemic humility). The tree separates aspect-pluralism (object has irreducibly many co-real faces) from modal-pluralism (object has one face accessed under irreducibly different conditions), even when verbal formulas overlap. Unoccupied combinations are flagged and diagnosed.

  ---

  **START**: Accept that "the self is permanent and also subject to change" is non-contradictory.  
  **Question 1**: Does this non-contradiction require that the self has **distinct, co-existing aspects** (e.g., one aspect is permanent, another is changing)?  
  - **Yes** (Aspect-pluralism branch) → Go to Question 2.  
  - **No** → Go to Question 4.  

  **Question 2** (Aspect-pluralism): Can we assert absolute, non-relativized truths about each aspect? (e.g., "Aspect X is permanent" is true without qualification.)  
  - **Yes** → Go to Question 3.  
  - **No** → **Leaf: Classical Jain view** (non-contradiction via seven-fold predication: assertions are always standpoint-relative, e.g., "in some respect, the self is permanent" paired with "in some respect, it is changing," with no aspect independently assertable).  

  **Question 3** (Aspect-pluralism with absolute aspects): Is truth bivalent for assertions about each aspect? (i.e., for a given aspect, a property like permanence is either true or false, with no middle ground.)  
  - **Yes** → **Leaf: Aspect-pluralism with bivalent aspects** (unoccupied: coherent but unattractive; requires explicit aspect-specification to avoid ambiguity, as unqualified claims about "the self" would misattribute properties to the whole. Practically unstable and unexplored in this context).  
  - **No** → **Leaf: Aspect-pluralism with non-bivalent aspects** (unoccupied: incoherent; if aspects are absolute yet truth is non-bivalent, properties like permanence become undefined, undermining the aspectual partition itself).  

  **Question 4** (Not aspect-pluralism): Is non-contradiction explained by **relativization to standpoints or conditions**? (e.g., "permanent when observed in one way, changing when observed in another.")  
  - **Yes** → Go to Question 5.  
  - **No** → Go to Question 6.  

  **Question 5** (Relativization branch): Does each standpoint reveal an **objective feature of the self**? (i.e., the self’s properties are genuinely mind-independent but accessed only under specific conditions.)  
  - **Yes** → **Leaf: Modal-pluralism** (non-contradiction via irreducible conditions of access: the self has one nature that manifests permanence under condition X and change under condition Y, e.g., modern perspectival realism).  
  - **No** → **Leaf: Epistemic humility** (non-contradiction via limitations of knowledge: standpoints yield partial truths, but the self has no objective multifacetedness; assertions are provisional, not descriptive of reality).  

  **Question 6** (Not aspect-pluralism or relativization): Is non-contradiction explained by **hidden parameters in language**? (e.g., "permanent" and "changing" implicitly reference unstated contexts.)  
  - **Yes** → **Leaf: Semantic-contextualism** (non-contradiction via hidden indexicals: predicates are incomplete without context, e.g., "permanent relative to standard S" vs. "changing relative to standard T").  
  - **No** → **Leaf: Incoherent/impossible** (rejects all resolution mechanisms; collapses into contradiction, violating the starting commitment).  

  ---

  ### Key Distinctions and Unoccupied Combinations:
  - **Aspect-pluralism vs. modal-pluralism**: Separated at **Question 1**. Aspect-pluralism partitions the object (e.g., permanent "core" and changing "surface"), while modal-pluralism partitions access conditions (e.g., the whole self is permanent in essence but changing in function). They may converge verbally (e.g., "in one way permanent, in another changing") but diverge metaphysically.  
  - **Unoccupied combinations**:  
    - **Aspect-pluralism with bivalent aspects** (Question 3 → Yes): Unattractive. Bivalence forces absolute assertions about aspects, but unqualified claims about "the self" imply the whole object has both properties, reintroducing contradiction. Requires pedantic language (e.g., always specifying aspects) and is unexplored due to instability.  
    - **Aspect-pluralism with non-bivalent aspects** (Question 3 → No): Incoherent. If aspects are absolute (Question 2 → Yes), non-bivalence makes properties indeterminate, voiding the aspectual partition.  

  ### Leaf Summaries:
  - **Classical Jain view**: Aspect-pluralism with non-absolute aspects (standpoint-relative assertions via seven-fold predication).  
  - **Modal-pluralism**: Relativization to conditions revealing objective, mode-dependent properties of a unified self.  
  - **Epistemic humility**: Relativization without objective multifacetedness; standpoints reflect ignorance, not reality.  
  - **Semantic-contextualism**: Hidden linguistic parameters dissolve contradiction; no commitment to object or access structures.  

  This tree isolates core commitments using concrete cases, ensuring positions are sorted by their resolution mechanics rather than labels.
