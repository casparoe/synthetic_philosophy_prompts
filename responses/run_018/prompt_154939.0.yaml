answer: |-
  ## Collapse Prediction Module

  I count the corpses, cold and cleanly sorted,
  Through outside view's detached, objective lens.
  Base rates of fallen realms, neatly reported,
  Suggest the pattern's clear: this empire ends.

  The data sings a certainty so true —
  All empires fail, the actuarial gods
  Decree the odds that fate will follow through,
  While inside view's mere noise and anxious nods.

  But wait — **what reference class makes empires "same"?**
  **Rome's marble bones? Britannia's rusted mast?**
  **Or that old monolith we propped in shame,**
  **That legacy code base that somehow lasted?**

  The model trembles, clutching empty air —
  Three phantom empires crumbling nowhere.

