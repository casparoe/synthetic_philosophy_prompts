prompt: |-
  hey, im writing a short essay for my phil of mind course about panpsychism and suffering, and i keep running into this weird argumentative loop i dont have a word for. like, someone will say that if consciousness is fundamental then every quantum interaction involves some minimal suffering, so the cosmos is basically a horror show with suffering spread across all matter. but then when you ask if we should try to reduce that micro-suffering — say, by altering physical constants or something — they say no, only integrated, high-level minds matter morally, and micro-experiences lack valence or selfhood. but then they turn around and use the "cosmic horror" idea to argue that our local ethics is basically a drop in the bucket. its not motte-and-bailey exactly, because both sides have arguments, and its not just equivocation on "suffering". its more like using aggregation to inflate moral stakes, then using integration criteria to dodge practical obligations, then flipping back to aggregation for the big-picture conclusion. is there an established name for this oscillation? if not can you coin one with clear edges — like when does aggregation count vs integration — and say how it differs from scope neglect or from the non-identity problem? please keep it tight, max 100 words, one paragraph.
reasoning: |-
  Okay, the user is writing a philosophy essay on panpsychism and suffering, and they've encountered this argumentative loop. Let me break down what they're describing. The loop starts with proponents claiming that if consciousness is fundamental, every quantum interaction involves micro-suffering, making the cosmos a horror show. Then, when asked about reducing that micro-suffering, they switch to saying only integrated minds matter morally, dismissing micro-experiences. But later, they flip back to the cosmic horror point to minimize human ethical efforts. 

  The user wants to know if there's a term for this tactic. They mention it's not motte-and-bailey or equivocation. Let me recall philosophical fallacies. The key here is the inconsistent use of aggregation and integration criteria. When emphasizing the cosmic scale, they aggregate all micro-suffering, but when responsibility comes up, they switch to integration, excluding micro-level obligations. Then, for big-picture conclusions, aggregation returns. 

  I need to coin a term that captures this oscillation. Terms like "scope neglect" or "non-identity problem" don't fit perfectly. Scope neglect is about failing to scale empathy with numbers, but here it's about shifting criteria. Non-identity deals with future individuals' identities. 

  The core issue is the strategic shift between aggregation and integration based on convenience. I should create a term that highlights this back-and-forth. "Integration-Dependent Aggregation Fallacy" comes to mind. Aggregation is used to inflate stakes (cosmic horror), then integration to deflect action (only complex minds matter), then aggregation again to diminish efforts (drop in the bucket). 

  Now, differentiating it from scope neglect: scope neglect is consistent underappreciation of large numbers, whereas this fallacy inconsistently applies aggregation vs. integration. Non-identity problem involves harm to potential individuals, unrelated here. 

  The user also needs clear edges: aggregation counts only when convenient for dramatic effect, integration when avoiding obligations. So the fallacy lies in the inconsistent application based on rhetorical needs. 

  Make sure the explanation is concise, under 100 words, one paragraph. Check if the coined term is self-explanatory and captures the oscillation. Ensure it's distinct from existing concepts. That should address the user's request effectively.
answer: |-
  This oscillating tactic is the **Integration-Dependent Aggregation Fallacy**. It strategically shifts criteria: **aggregating** micro-experiences to inflate cosmic suffering (for dramatic impact), then switching to **integration** (requiring complex cognition/selfhood) to dismiss moral obligations towards the micro-level, and finally re-aggregating to minimize the significance of macro-level ethical efforts.

  *   **Differs from scope neglect:** Scope neglect is a *consistent* failure to grasp scale. This fallacy *inconsistently applies* scale/criteria (aggregate vs. integrated) based on rhetorical convenience.
  *   **Differs from non-identity:** The non-identity problem concerns harm to individuals who wouldn't otherwise exist. This fallacy concerns *which existing entities* (aggregated micro vs. integrated macro) count morally in different argumentative contexts.
  *   **Clear edge:** Aggregation "counts" only when used to amplify the problem's scale; integration "counts" only when used to deflect responsibility for acting on that scale.
