  ## Arboreal Proof (A Berkeleyan Sestina)

  **Stanza 1**
  Commanded: conceive a solitary **tree**
  Rooted deep within a vacant **garden**.
  No footstep stirs the loam, no watchful **eye**
  Attends its form. Now banish thought: go **dark**.
  But wait – what sly projector in my **mind**
  Paints bough and bark? There blooms a stubborn **nothing**?

  **Stanza 2**
  This conjured void, this air where **nothing** breathes,
  Still trembles with the ghost of that same **tree**.
  I strain to make the unseen **garden** real,
  To peel perception back, let vision's **eye**
  Go blank. Yet thought persists, a fading **dark**
  That shapes the space where I exiled my **mind**.

  **Stanza 3**
  Can silence hold a shape within the **mind**
  Without a listener? Can pure **nothing**
  Be known? The effort blinds my inner **dark**,
  Insists I frame the unobserved old **tree**.
  It mocks the dream of an unfelt **garden**,
  Demands the presence of a phantom **eye**.

  **Stanza 4**
  I shut the lids upon the outward **eye**,
  Withdraw sensation. Still, the inner **mind**
  Refuses vacancy. That absent **garden**
  Is thick with texture. Even when **nothing**
  Is claimed, the concept *is*. That spectral **tree**
  Roots firmly in a self-made, thinking **dark**.

  **Stanza 5**
  This isn't void, this thinking kind of **dark**,
  It's merely sight withheld. The needed **eye**
  Is smuggled in, the seer of the **tree**,
  The silent architect within the **mind**.
  Each claim of pure existence, stripped, is **nothing**
  But thought's own act, performed in thought's **garden**.

  **Stanza 6**
  The proof takes root within this mental **garden**:
  True absence hides, a deeper, thoughtless **dark**.
  To even name the void implies a **nothing**
  Conceived, perceived – by whom? That hidden **eye**
  Belongs to thought, the ever-present **mind**.
  Existence leans upon the sensed – the **tree**.

  **Envoi**
  So stands the **tree**, its being undenied
  By **mind and eye** inseparably tied.
  The **garden** blooms where **dark** and **nothing** fade.
