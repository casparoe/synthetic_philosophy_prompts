answer: |-
  Your struggle captures the core tension in perpetrator studies: **situational pressures vs. ideological/cultural commitment vs. individual agency**. Your verdicts are largely consistent with a nuanced interactionist model. Here's a principle that integrates your cases and addresses your South Africa dilemma:

  **The Atrocity Enabling Principle:**
  *Large-scale atrocities require **enabling environments** (institutional, situational, cultural). Within these environments, individual participation is determined by the **interaction of:**  
  1.  **Baseline Affinity/Receptiveness** (Pre-existing ideology, prejudice, personality, ambition, trauma, social identity).  
  2.  **Immediate Enabling Factors** (Authority, peer pressure, routinization, dehumanization, institutional scripts, careerism, threat perception, material incentives).  
  3.  **Intensity/Totalization of the Environment** (How completely the environment isolates, indoctrinates, pressures, and offers alternatives).*

  **Applying the Principle to Your Cases:**

  1.  **Ordinary Men (Battalion 101):**  
      *   **Enabling Environment:** War, Nazi ideology, occupation, authority structure.  
      *   **Baseline Affinity:** Low-moderate (some antisemitism, mostly apolitical/conformist).  
      *   **Immediate Factors:** High (direct orders, peer pressure, avoidance of shame/ostracism, initial "opt-out" option reducing *immediate* threat).  
      *   **Intensity:** High for the specific task/situation.  
      *   **Verdict:** Immediate factors dominate *because* baseline affinity was generally low/moderate and the situation was intensely pressuring. Ideology provided the *context* but not the primary *motor* for most.

  2.  **Rwandan Official:**  
      *   **Enabling Environment:** Decades of Hutu Power ideology, state propaganda, collapse of order, mobilization.  
      *   **Baseline Affinity:** Moderate-High (Absorbed cultural norms, likely held latent prejudice/group identity).  
      *   **Immediate Factors:** High (Propaganda surge, community pressure, fear, opportunity for power/plunder, perceived threat).  
      *   **Intensity:** Extreme (Ubiquitous propaganda, neighbor killing neighbor, existential fear framing).  
      *   **Verdict:** Baseline affinity (culturally formed) was activated and amplified by intense situational/cultural pressures. It's the *interaction*.

  3.  **Argentine Conscript:**  
      *   **Enabling Environment:** Military dictatorship, "Dirty War" doctrine, secrecy, institutional hierarchy.  
      *   **Baseline Affinity:** Likely Low (Conscripted youth, not ideologically vetted).  
      *   **Immediate Factors:** Very High (Strict military discipline, direct orders, threat of punishment/being labeled subversive, routinization of torture, "us vs. them" framing, compartmentalization).  
      *   **Intensity:** Extreme within the institutional setting (total control, moral disengagement techniques).  
      *   **Verdict:** Overwhelming institutional scripting and situational pressure dominate *despite* likely low baseline affinity. "Apolitical dad" persona reflects compartmentalization and the environment's *containment*.

  4.  **German Civilian Letter Writer:**  
      *   **Enabling Environment:** Nazi regime, pervasive antisemitic propaganda, atmosphere of denunciation.  
      *   **Baseline Affinity:** High (Strong internalized antisemitism, personal grievance, authoritarian personality).  
      *   **Immediate Factors:** Low (No direct pressure, unsolicited action).  
      *   **Intensity:** High in society, but acted *without* situational prodding.  
      *   **Verdict:** High baseline affinity (ideology/character) is the primary driver. The environment *enabled* and *legitimized* the action but didn't *compel* it.

  **Resolving the South Africa Dilemma (TRC Amnesty Seekers):**

  *   **Conscripted into Unit:** Your situational verdict holds. Analogue to Argentine conscript. Enabling environment and immediate factors dominate.
  *   **Volunteered for Counter-Insurgency Squads:** **Both factors are strong.** Volunteering indicates *significant baseline affinity* – alignment with the regime's goals, ideological buy-in (anti-communism, white supremacy), ambition, aggression, or desire for belonging/power. **However,** the *intensity and totalization* of the institutional culture (Koevoet, Vlakplaas, etc.) then acted as a powerful amplifier and enabler, shaping *how* that affinity manifested (escalating brutality, dehumanization, groupthink). Volunteering signals pre-disposition, but the environment maximized and directed its violent expression.
      *   **Principle's Verdict:** For volunteers, baseline affinity (ideology, character, motivation) is a *necessary condition* for volunteering, but the extreme institutional environment is often a *sufficient condition* for escalating participation in atrocities beyond what the individual might have initially imagined. It's not either/or, but a sequence and interaction: Affinity leads to seeking the environment; the environment then radicalizes and enables extreme actions.

  **The Post-Hoc "Coercion" Claimant:**

  *   **Case:** Enthusiastic participant later claims coercion to a truth commission.
  *   **Principle's Analysis:**
      1.  **Initial Enthusiasm:** Suggests high baseline affinity (ideology, commitment, personal motivation) *and/or* rapid socialization/indoctrination into the enabling environment.
      2.  **Post-Hoc Coercion Claim:** This is primarily about **narrative construction for the transitional justice context**. Motivations include: avoiding stigma/punishment, qualifying for amnesty (if coercion is a factor), social reintegration, psychological self-protection (denial, distancing), or even genuine reinterpretation under new norms.
  *   **Verdict:** The principle *doesn't* require dropping a prior verdict. It highlights the difference between **motivation *during* the event** (likely involving significant affinity/ideology given enthusiasm) and **motivation *after* the event** when constructing an account for a specific audience/purpose (truth commission). The initial enthusiasm points away from situational dominance *at the time*. The later claim reflects the *situational pressures of the truth-telling context itself*.

  **Predictions for Transitional Justice Contexts:**

  1.  **Amnesty Claims:** Perpetrators from highly totalizing institutions (like your Argentine conscript or SADF conscript) are *more likely* to successfully frame actions as "just following orders" or pure coercion, even if some affinity existed. Volunteers will find this harder and may emphasize institutional pressure *after* joining.
  2.  **Expressions of Remorse:** Individuals whose participation was driven more by intense situational pressure with low baseline affinity are statistically *more likely* to express genuine remorse. Those driven by high affinity/ideology are more likely to express regret only for consequences or maintain justifications.
  3.  **Denial/Minimization:** Perpetrators with high baseline affinity are more prone to outright denial or ideological justification. Those influenced heavily by situational factors may minimize personal responsibility ("anyone would have done it").
  4.  **Reintegration Success:** Perpetrators whose actions were more situationally determined (low baseline affinity) *and* who operate in societies effectively dismantling the old enabling environment may reintegrate more easily than committed ideologues.

  **To Simplify (But Lose Nuance):**

  If you *must* simplify, the verdict to drop is arguably the **Rwandan Official**. You could collapse it into "situation activating latent traits," but this risks underestimating the *specific potency* of deeply ingrained cultural ideology compared to more generalized prejudice or conformity. It merges a distinct "ideological activation" case into a broader "situational" bucket.

  **Conclusion:**

  Your intuitions are largely consistent with an **Interactionist Model** where atrocities require enabling environments (situational/institutional/cultural), but individual pathways within them vary based on pre-existing dispositions (ideology, character) interacting with intense pressures. Volunteering (like in SA) signals significant baseline affinity, but doesn't negate the radicalizing power of the environment entered. Post-hoc claims of coercion are often less about explaining past action and more about navigating the *new* situational pressure of the truth commission. This principle avoids the pitfalls of pure "situationism" (which absolves agency) and pure "ideologism" (which ignores the power of context) and offers a framework for analyzing perpetrator accounts in transitional justice.
