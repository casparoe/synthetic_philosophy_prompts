prompt: |-
  You have been asked to serve as the neutral scribe for an adversarial collaboration between two philosophers of science—call them the Principalists and the Calibrationists—who have spent several years arguing past each other about whether rational agents must defer to what they treat as objective chance. The Principalists defend a strict version of the Principal Principle: if an agent knows that the objective chance of some event E is x, then—absent inadmissible evidence—the agent’s credence in E ought to be x. The Calibrationists deny this, arguing that in domains where “objective chance” is not a fundamental physical property but a constructed feature of deterministic yet computationally irreducible systems—specifically, the spread of calibrated climate-ensemble forecasts—the principle either collapses into a tautology or generates contradictions with expert judgment about structural model bias.

  Your task is to draft the joint statement they should have produced from the start. The document should open with a numbered section of claims both sides can sign: about the formal structure of the Principal Principle, about what distinguishes admissible from inadmissible evidence, about the behavior of ensemble forecasting in deterministic climate models, and about the normative claim that rational belief should be responsive to evidence rather than arbitrary. Next, present a disagreements table in which each side’s position is stated in wording its own advocates would accept, without caricature: the Principalists should articulate exactly when and why ensemble spread counts as objective chance to which one must defer, and the Calibrationists should articulate exactly why expert knowledge of systematic bias constitutes admissible evidence that breaks the deference link. Then identify the cruxes—sub-questions such that settling them would move at least one side. I suspect two cruxes are whether determinism at the micro-level undermines the objectivity of macro-level ensemble probabilities, and whether an agent’s awareness of her own calibration record counts as inadmissible self-locating information. For each crux, specify a concrete forecasting scenario or piece of empirical evidence both sides agree bears on it, and record in advance what each camp predicts about that case—for instance, whether a forecaster who knows her model systematically overestimates extreme precipitation should still match her credence to the ensemble mean. If any portion of the dispute turns out to be verbal—say, a disagreement about whether “objective chance” requires physical indeterminacy rather than stable macro-regularity—say precisely which portion and why. Do not provide a verdict; end with the residual disagreement exactly framed.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between two groups: Principalists and Calibrationists.

  The document structure:
  1. A numbered section of claims both sides agree on.
  2. A disagreements table: each side's position in their own words.
  3. Identification of cruxes (sub-questions that would move at least one side if settled) with concrete scenarios and predictions from each camp.
  4. Clarification of any verbal disagreements.
  5. End with the residual disagreement exactly framed.

  We start with the agreed claims.

  Agreed Claims (Section 1):
  Both sides agree on the following:

  1. The Principal Principle (PP) in its standard formulation states: for an agent with no inadmissible evidence, if the agent knows that the objective chance of event E is x, then the agent's credence in E ought to be x.

  2. Inadmissible evidence is evidence that directly bears on the outcome of E without going through the chance of E. For example, knowledge of the outcome of E itself would be inadmissible. Both sides agree that the concept of inadmissibility is crucial to the application of PP.

  3. Ensemble forecasting in climate science involves running multiple simulations (ensemble members) of a deterministic climate model with varying initial conditions or model parameters. The spread of the ensemble is used to represent uncertainty about the future climate state.

  4. Calibration of a forecasting system means that, over many predictions, the event frequencies match the forecast probabilities. For example, when a calibrated system assigns a probability of 70% to an event, the event should occur about 70% of the time.

  5. Rational belief should be responsive to evidence and not arbitrary. Therefore, agents should update their beliefs in light of new evidence in a way that respects their total evidence.

  6. In the context of deterministic systems, the ensemble spread is often interpreted as representing epistemic uncertainty about the initial conditions and model structure. This spread can be calibrated to match observed frequencies.

  Disagreements Table:

  Principalists' Position (in their own words):
  "We hold that the Principal Principle is a fundamental norm of rationality. The ensemble spread in a well-calibrated climate model represents an objective chance to which a rational agent must defer, provided the agent has no inadmissible evidence. The fact that the model is deterministic at the micro-level does not undermine the objectivity of the macro-level probabilities because these probabilities are emergent properties that are stable and law-like. In the context of ensemble forecasting, the ensemble mean and spread are the best available estimates of the objective chance. Therefore, unless an agent possesses inadmissible evidence (which is rare and typically only about the actual outcome), the agent's credence in an event must match the ensemble-derived probability. Expert judgments about structural model bias, if they are not based on information that is already incorporated in the ensemble (such as through the model structure or initial condition perturbations), may be considered inadmissible if they are not part of the chance setup. However, if the expert judgment is based on a systematic evaluation of the model's performance (i.e., calibration records) and such evaluation is not included in the ensemble, then it may be admissible and break the deference requirement only if it directly bears on the chance of E. But note that the calibration record is part of the chance setup and should be incorporated into the ensemble. Thus, the ensemble should already account for known biases. If it does not, then the ensemble is not properly calibrated and does not represent objective chance. Therefore, in a properly calibrated system, expert knowledge of systematic bias is already reflected in the ensemble probabilities, and the agent must defer."

  Calibrationists' Position (in their own words):
  "We deny that the Principal Principle requires deference to ensemble-derived probabilities in deterministic systems. The ensemble spread in climate models is an artifact of our epistemic limitations and model construction, not an objective feature of the world. Objective chance, as traditionally understood, requires physical indeterminism. In deterministic systems, the ensemble probabilities are simply tools for managing uncertainty and are subject to revision in light of expert knowledge about structural model biases. Expert knowledge of systematic bias, derived from the model's calibration record and understanding of the physical processes, constitutes admissible evidence because it directly bears on the reliability of the model's output. Therefore, when an expert knows that a model systematically overestimates extreme precipitation, she should adjust her credence below the ensemble mean. The Principal Principle, in this context, either collapses into a tautology (because the ensemble is just a summary of our current state of knowledge) or leads to contradictions because it ignores structural model errors that are known to the expert. Rational agents should use all available evidence, including their knowledge of the model's limitations, to form credences. The ensemble forecast is just one piece of evidence, not a direct reading of objective chance."

  Cruxes:

  We identify two cruxes:

  Crux 1: Does determinism at the micro-level undermine the objectivity of macro-level ensemble probabilities?

  - Scenario: Consider a climate model that is deterministic at the micro-level (e.g., molecular motion) but chaotic at the macro-level (e.g., weather patterns). The model is run as an ensemble with perturbed initial conditions to produce a probability distribution for the occurrence of a heatwave in a specific region next month. The ensemble is calibrated: when it assigns a probability p to a heatwave, the frequency of heatwaves in such situations is approximately p.

  - Principalists' Prediction: The ensemble spread in this scenario represents an objective chance of the heatwave. Therefore, an agent who knows the ensemble-derived probability p and has no inadmissible evidence (such as knowing the actual outcome) should set her credence to p.

  - Calibrationists' Prediction: The ensemble spread is merely epistemic and does not represent objective chance because the system is deterministic. Therefore, the agent is not bound by PP to set her credence to p. She may adjust it based on other evidence, such as known model biases.

  Crux 2: Does an agent’s awareness of her own calibration record count as inadmissible self-locating information?

  - Scenario: A forecaster runs an ensemble model that predicts a 70% chance of extreme precipitation in a region. However, the forecaster knows, from past performance, that this particular model (or her own forecasting method) systematically overestimates the probability of extreme precipitation by 10 percentage points (i.e., when the model says 70%, the actual frequency is about 60%). The forecaster has access to the calibration record but no other specific information about the current event.

  - Principalists' Position: The calibration record is part of the chance setup and should be incorporated into the model's ensemble. If the model is properly calibrated, the ensemble should already account for the bias. If it does not, then the ensemble is not representing objective chance. Therefore, the forecaster should not adjust the 70% but should instead use a model that is properly calibrated. If she must use this model, then the calibration record is admissible evidence because it directly bears on the chance of E (by indicating that the model is miscalibrated). Therefore, she should adjust her credence to 60%. However, note that this adjustment is not a violation of PP because the objective chance (if properly calibrated) would be 60%. The issue is that the model output of 70% is not the objective chance. Thus, the Principal Principle still holds: the agent should set her credence to the objective chance (which in this case, after calibration, is 60%).

  - Calibrationists' Position: The forecaster's knowledge of the calibration record is admissible evidence that breaks the link between the ensemble output and the agent's credence. Therefore, the forecaster should adjust her credence to 60%, and this adjustment is a direct application of rational reasoning that overrides the ensemble output. This scenario shows that PP does not apply because the ensemble output is not objective chance.

  Verbal Disagreement:

  Both sides agree that there is a verbal disagreement about the term "objective chance". The Principalists use "objective chance" to include macro-level probabilities in deterministic systems that exhibit stable, law-like regularities (i.e., the ensemble probabilities that are calibrated). The Calibrationists reserve "objective chance" for fundamental physical indeterminism. Therefore, the disagreement about whether ensemble probabilities are objective chances is partly verbal: the Principalists are using a broader notion of chance that includes emergent, calibrated probabilities, while the Calibrationists are using a narrower, metaphysical notion.

  Residual Disagreement:

  The residual disagreement is exactly framed as follows:

  Principalists maintain that rational agents must defer to the ensemble-derived probabilities in a properly calibrated forecasting system because these probabilities represent objective chance (in the emergent, macro-level sense) and that expert knowledge of systematic bias is either already incorporated in a calibrated ensemble or, if not, should be incorporated to yield the true objective chance. Therefore, the Principal Principle applies and requires deference.

  Calibrationists maintain that in deterministic systems, ensemble-derived probabilities are not objective chances (in the required sense) and that expert knowledge of systematic bias is admissible evidence that breaks any requirement to defer to the ensemble. Therefore, the Principal Principle either does not apply or must be set aside in favor of a direct application of total evidence reasoning.

  The joint statement ends here.
answer: |-
  ### Joint Statement: Adversarial Collaboration on the Principal Principle in Deterministic Forecasting Systems

  **Section 1: Agreed Claims**  
  Both Principalists and Calibrationists endorse the following statements as common ground:  

  1. **Structure of the Principal Principle (PP):**  
     The standard formulation of the Principal Principle holds that if a rational agent knows the objective chance of event \(E\) is \(x\), and possesses no inadmissible evidence regarding \(E\), then the agent's credence in \(E\) ought to be \(x\). This is a normative constraint on rational belief.  

  2. **Admissible vs. Inadmissible Evidence:**  
     Evidence is inadmissible if it directly concerns the occurrence of \(E\) without being mediated by the chance of \(E\) (e.g., knowledge of \(E\)’s outcome or privileged information about the causal history of \(E\) that bypasses chance). Admissible evidence includes general knowledge about the chance setup itself (e.g., the theoretical basis for assigning chances). Both sides agree that the distinction is context-dependent and crucial for applying PP.  

  3. **Ensemble Forecasting in Deterministic Climate Models:**  
     - Ensemble forecasting involves running multiple deterministic simulations (ensemble members) with varied initial conditions, parameters, or model structures to generate a probability distribution for outcomes (e.g., temperature anomalies).  
     - The spread of the ensemble reflects epistemic uncertainty due to incomplete knowledge of initial conditions, model limitations, or chaotic dynamics.  
     - Calibration is achieved when the frequency of events in the real world matches the probabilities assigned by the ensemble over many trials (e.g., 60% of events predicted with 0.6 probability occur).  

  4. **Normative Responsiveness to Evidence:**  
     Rational agents must align their credences with their total evidence. Beliefs should not be arbitrary; they must be updated systematically in response to new information, including evidence about chance setups and model performance. Deference to chance, when applicable, is one such responsiveness requirement.  

  5. **Macro-Level Regularities in Deterministic Systems:**  
     Deterministic systems (e.g., climate models) can exhibit emergent, stable macro-level regularities that produce well-calibrated probabilities. These probabilities are robust for practical forecasting, even if micro-level dynamics are deterministic.  

  6. **Calibration as Epistemic Tool:**  
     Calibration records (e.g., historical data on forecast accuracy) are evidentially relevant for assessing the reliability of a forecasting system. Ignoring calibration data would be irrational.  

  ---  
  **Disagreements Table**  
  *Each position is stated verbatim as endorsed by its advocates.*  

  | **Principalists' Position** | **Calibrationists' Position** |
  |-----------------------------|-------------------------------|
  | "The Principal Principle is a universal norm of rationality. In domains like climate science, the spread of a well-calibrated ensemble forecast constitutes objective chance because it reliably captures the lawful, emergent regularities of a complex deterministic system. Rational agents must defer to these probabilities when they know the ensemble-derived chance of \(E\) is \(x\) and lack inadmissible evidence. Expert judgments about structural model bias are admissible only if they are not already subsumed within the chance setup (e.g., bias estimates derived from the calibration record). If the ensemble is properly constructed, such biases are incorporated, making the chance objectively binding. Deference is mandatory: failing to set credence to \(x\) is irrational, as it ignores the best available summary of indeterministic-like uncertainty at the macro level." | "The Principal Principle does not apply to probabilities from deterministic systems like ensemble forecasts. Here, 'objective chance' requires fundamental physical indeterminism; ensemble spreads are merely epistemic tools reflecting human ignorance. Rational agents need not defer to them because expert knowledge of systematic model bias—grounded in calibration records and process understanding—is always admissible evidence. This evidence directly bears on the chance of \(E\) by revealing limitations in the ensemble’s construction. Agents must adjust their credences based on their total evidence (e.g., reducing credence below the ensemble mean when bias is known). Insisting on deference in these cases collapses PP into a tautology (where 'chance' is just a label for the ensemble) or invites contradictions with evidence of structural error." |  

  ---  
  **Cruxes**  
  *Sub-questions that, if resolved, would shift at least one side’s position. For each, we specify an agreed-upon empirical scenario and predictions.*  

  1. **Crux 1: Does micro-level determinism undermine the objectivity of macro-level ensemble probabilities?**  
     - **Scenario:** A deterministic climate model with chaotic dynamics is used to forecast hurricane frequency in the North Atlantic. The model is well-calibrated: over 100 years of hindcasts, when it assigns a probability \(p\) to a high-frequency hurricane season, the observed frequency is \(p \pm 0.02\). Forecasters know the micro-level physics (e.g., fluid dynamics) is deterministic.  
     - **Principalists' Prediction:** Agents must defer to the ensemble probability \(p\) as objective chance. The macro-level regularity ensures objectivity; determinism at the micro-level is irrelevant to the emergent stochasticity.  
     - **Calibrationists' Prediction:** Agents need not defer. The ensemble spread is purely epistemic (arising from ignorance of initial conditions), not objective chance, so credences should incorporate other evidence (e.g., known model simplifications in ocean physics).  
     - **Agreed Empirical Bearings:** Data from high-resolution climate simulations testing calibration stability under micro-determinism. Both sides accept that persistent calibration across diverse contexts would support Principalists, while systematic breakdowns would support Calibrationists.  

  2. **Crux 2: Does an agent’s awareness of her calibration record count as inadmissible self-locating evidence?**  
     - **Scenario:** A forecaster uses a model ensemble predicting a 70% chance of extreme rainfall in California next winter. She knows from her personal calibration record that this model systematically overestimates such events by 15 percentage points (i.e., when the model outputs 70%, the true frequency is 55%). She has no other evidence about this specific event.  
     - **Principalists' Prediction:** The calibration record is admissible evidence about the chance setup itself. It implies the ensemble is miscalibrated, so the *true* objective chance is 55%. The agent must set her credence to 55%, consistent with PP (since 70% was never the real chance). Deference is preserved.  
     - **Calibrationists' Prediction:** The record is admissible evidence that breaks PP’s deference requirement. The agent should set her credence to 55% because PP does not apply—the ensemble output is not objective chance, and total evidence trumps the model.  
     - **Agreed Empirical Bearings:** Experiments in forecasting psychology where experts adjust credences based on personal calibration records. Both sides agree that if such adjustments consistently improve accuracy, it supports the Calibrationists; if not, it undermines their case.  

  ---  
  **Verbal Disagreement**  
  A portion of the dispute is verbal:  
  - **Principalists** define "objective chance" as any robust, calibrated probability arising from stable macro-regularities, regardless of micro-level determinism.  
  - **Calibrationists** define "objective chance" as requiring fundamental physical indeterminacy (e.g., quantum events).  
  This definitional divergence explains why Principalists see ensemble probabilities as chances (they meet their criteria), while Calibrationists do not (they reserve "chance" for indeterministic contexts). The substantive disagreement persists because Calibrationists deny that macro-regularities warrant PP’s normative force even if labeled "chance."  

  ---  
  **Residual Disagreement**  
  The collaboration concludes with this unresolved contention:  
  - **Principalists** maintain that rational agents must defer to well-calibrated ensemble probabilities as objective chances in deterministic systems, with expert bias assessments only admissible if unaccounted for in calibration.  
  - **Calibrationists** deny that PP applies to deterministic ensembles, insisting that expert knowledge of structural bias is always admissible evidence that overrides deference, making PP irrelevant or tautological in these contexts.
