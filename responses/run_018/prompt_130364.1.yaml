  I’m putting together interview questions for a podcast episode with a political philosopher—he’s not named, just an invented defender of a real view—who argues constitutional monarchies in places like the UK, Norway, and Scandanavia do hidden democratic work. His specific claim is that the monarch acts as a "non-elective continuity node": because they’re above party and can’t be voted out, they absorb legitimacy crises that would otherwise tear at the democratic fabric. He calls the unused reserve powers—refusing assent, dissolving parliaments, appointing ministers—a kind of "dormant circuit breaker" that stabilizes precisely because it almost never trips. I want eight to ten questions that go deep, not just "why do kings still exist?" I need at least one pressing him on whether "symbolic capital depletion"—his term for the idea that actually using royal power destroys the institution’s democratic usefulness, so it’s usefulness depends on staying unused—is a feature or a bug, one on how this handles republican transitions like Ireland leaving or India adapting post-1947, and one on Japan’s postwar emperor where the role was deliberatly hollowed out. For each, include a follow-up keyed to the answer he’d probably give. Keep it casual, maybe a typo or two, and please don’t ask for citations or bibliographies—this is for a model that can’t browse.
