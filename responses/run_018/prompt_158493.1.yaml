  **Setup:**
  - The universe starts with a few particles (e.g., 3) at random positions and with random velocities (but set by the instructor to create a pattern that can be broken later).
  - The simulation runs for 3 rounds.

  **Roles:**
  - **Group A (Catalog):** After each round, they record the state (positions and velocities of particles) and then try to summarize the patterns they see. They are not allowed to make rules for the future. They are passive observers.
  - **Group B (Legislator):** After round 1, they must propose a law (or laws) that they think governs the universe. The law must be in the form of a rule that applies to all particles and predicts the next state. They can refine their law after round 2.

