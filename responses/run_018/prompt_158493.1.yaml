answer: |-
  ### **Humeanism vs. Anti-Humeanism: Particle Universe Simulation**  
  **Goal:** Students experience the core tension between laws as *descriptions* (Humean) vs. *governing rules* (anti-Humean) through hands-on roles. No prior theory names are used until the debrief.  

  ---

  ### **Materials & Setup**  
  - **Grid Universe:** 5x5 grid drawn on a whiteboard or large paper.  
  - **Particles:** 3 colored tokens (🔴 red, 🔵 blue, 🟢 green) with **velocity arrows** (↑, ↓, →, ←).  
  - **Initial State (Round 0):**  
    - 🔵 Blue at (2,2), velocity ↑  
    - 🔴 Red at (0,3), velocity →  
    - 🟢 Green at (4,1), velocity ↓  
  - **Basic Mechanics (Known to All):**  
    - Particles move 1 cell per round in their arrow direction.  
    - If they hit a wall, they "bounce" (reverse direction and move).  
    - *Example:* A particle at (0,0) with velocity ↓ hits the wall, reverses to ↑, and moves to (0,1).  

  ---

  ### **Group Roles**  
  Split students into **Group A (Catalogers)** and **Group B (Legislators)**.  
  - **Group A (Humean Vibe):**  
    - **Task:** Record *only what they observe* after each round.  
    - **Deliverable:** A "Catalog of Patterns" (e.g., "Blue particles always move ↑").  
    - **Rule:** No predictions or rules—only summaries of past data.  
  - **Group B (Anti-Humean Vibe):**  
    - **Task:** Write "Laws of Nature" to govern *future* behavior.  
    - **Deliverable:** A "Law Code" (e.g., "Blue particles MUST move ↑").  
    - **Rule:** Laws must apply universally to all particles.  

  ---

  ### **Round Timeline** (Total: 45 minutes)  
  **Round 1 (10 min):**  
  - **Universe Update:** Particles move per initial velocities (no anomalies).  
    - 🔵 Blue: (2,2) → (2,1) ↑  
    - 🔴 Red: (0,3) → (1,3) →  
    - 🟢 Green: (4,1) → (4,2) ↓ (bounces to ↑)  
  - **Group Tasks:**  
    - **A:** Record positions/velocities. Draft Catalog (e.g., "Green bounced and changed direction").  
    - **B:** Draft Law Code (e.g., "Green particles move ↓ until they bounce").  

  **Round 2 (10 min):**  
  - **Universe Update:** Same rules as Round 1.  
    - 🔵 Blue: (2,1) → (2,0) ↑ (bounces to ↓)  
    - 🔴 Red: (1,3) → (2,3) →  
    - 🟢 Green: (4,2) → (4,3) ↑  
  - **Group Tasks:**  
    - **A:** Update Catalog (e.g., "Blue always moves ↑ until it bounces").  
    - **B:** Refine Law Code if needed (e.g., "Blue MUST move ↑ unless bouncing").  

  **Round 3 (Anomaly Round, 15 min):**  
  - **Universe Update:** Introduce anomaly:  
    - 🔵 Blue (was ↓ at (2,0)) now moves → to (3,0) *without bouncing* (violates past patterns/laws).  
    - 🔴 Red and 🟢 Green move normally.  
  - **Group Tasks:**  
    - **A (Catalogers):** Choose one:  
      - **Option 1 (Expand):** Update Catalog to include the exception (e.g., "Blue usually ↑/↓, but sometimes →").  
      - **Option 2 (Exile):** Declare the particle "noise" and remove it from the Catalog.  
    - **B (Legislators):** Choose one:  
      - **Option 1 (Broken Law):** Claim the universe "malfunctioned" (law was violated).  
      - **Option 2 (Amend Law):** Argue the law was incomplete and amend it (e.g., "Blue moves ↑ unless bouncing OR at (2,0)").  

  **Counterfactual Test (10 min):**  
  - Present a hypothetical: *"Imagine a new 🟡 yellow particle at (1,1) with velocity →. How would it move?"*  
  - **Group A:** Can only use past data (no inherent "must").  
  - **Group B:** Must apply their Law Code (even to unobserved cases).  

  ---

  ### **Stakes (Non-Monetary)**  
  - **Group A Wins** if their Catalog is consistent *and* simplest (Occam’s Razor).  
  - **Group B Wins** if their Laws predict the counterfactual correctly.  
  - **Victory = "Truth Points"** (peer-voted based on coherence + parsimony).  

  ---

  ### **Debrief** (20 minutes)  
  Map decisions to metaphysics **without theory names first**:  
  1. **Anomaly Reactions:**  
     - **Group A (Expand):** "Patterns are summaries—exceptions mean we missed something." → Humeanism.  
     - **Group A (Exile):** "Outliers are noise, not part of the pattern." → Humean regularity.  
     - **Group B (Broken Law):** "The universe broke!" → Anti-Humean governance (laws constrain reality).  
     - **Group B (Amend Law):** "Laws can be incomplete." → Anti-Humean nomic necessity.  

  2. **Counterfactual Tension:**  
     - **Group A:** Struggled? Patterns don’t support "what ifs" → Humean weakness.  
     - **Group B:** Confident? Laws "must" apply → Anti-Humean strength.  

  3. **Core Distinction:**  
     - **Humeanism (Group A):** Laws = condensed patterns. "Must" comes from *us* (projection).  
     - **Anti-Humeanism (Group B):** Laws = active constraints. "Must" comes from *the universe* (governance).  
     - **Institutional vs. Brute Facts:**  
       - Group B treated laws like institutional rules (breakable/conventional).  
       - Anti-Humeans want laws to be *brute* (fundamental, non-negotiable).  

  4. **What the Simulation CAN’T Capture:**  
     - **Modal Necessity:** Anti-Humeans say laws constrain *all possible worlds*—but we only simulated one.  
     - **Unactualized Possibilities:** We couldn’t test if laws "force" particles in untried scenarios (e.g., "Would blue move ↑ in a *different* grid?").  
     - **Causal Oomph:** Anti-Humeans want laws to *make* particles move, but here, the instructor just moved them.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem:** Groups blur roles (e.g., Catalogers sneak in predictions).  
     **Fix:** Assign a "Role Enforcer" in each group.  

  2. **Problem:** Anomaly feels arbitrary ("Why did blue move →?").  
     **Fix:** Preempt: "The universe is mysterious—just like real laws!"  

  3. **Problem:** Legislators write vague laws (e.g., "Particles do stuff").  
     **Fix:** Require specific, testable laws (e.g., "Blue velocity always ↑").  

  4. **Problem:** Debate drags in Round 3.  
     **Fix:** Use a 3-minute timer for decisions.  

  5. **Problem:** Counterfactual test ignored.  
     **Fix:** Award bonus "Truth Points" for engaging it.  

  ---  
  **Why This Works:** Students *feel* the frustration of describing (A) vs. the confidence/pressure of governing (B). The debrief links their choices to Humeanism (laws as patterns) and anti-Humeanism (laws as rulers), setting up textual analysis. No jargon, no readings—just raw intuition.
