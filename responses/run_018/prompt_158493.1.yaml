        - Reverses facing to east.
        - Moves to (1,1) [facing east].

  - In the debrief, reveal that the underlying rules (facing and bouncing) are the real laws, and the pattern about blue particles facing north was accidental.

    This will show that Group B's law about blue particles always moving north was merely a summary of the pattern and not the governing rule.

    We can then discuss: 
        - Humeanism: The law is just the pattern we saw. When we saw an exception, we had to revise (or not) — and it didn't govern the behavior.
        - Anti-Humeanism: The real laws are the ones that govern, like the facing and bouncing rules, which explain the movement and support counterfactuals.

  **Note:**
  - The underlying rules (facing and bouncing) are known to the students from the start? Yes, we will explain them at the beginning as the basic mechanics. The color patterns are not part of the rules and are just accidental.

  **What might go wrong:**
  - Students might not understand the bouncing rule. Demonstrate with an example.
  - In the anomaly, they might think the blue particle bounced even though it didn't hit a wall? So we have to be clear: it was not at the edge, so it shouldn't bounce. But we made it move south arbitrarily.
  - Group A might try to make rules. Remind them they are only cataloging.

