prompt: |-
  hey, quick philosophical question — kind of in the weeds but should be do-able without searching.

  lots of banks now use behavioral biometric scoring for loan apps — tracking how long you hover over a field, your typing rhythm, whether you copy-past your address. they avoid asking race or gender directly and claim the model is "blind" to protected classes. at the same time they buy third-party "lifestyle clustering" data that sorts neighborhoods into psychograpic buckets like "urban traditionalists" vs "suburban aspirers". those clusters are built from consumption patterns that map tightly onto race and class, yet the bank treats them as neutral, naturally occuring features rather than socially constructed proxies.

  what theory of social kinds — especially race, gender, and credit-worthiness itself — does that institutional practice presuppose? reconstruct the implicit view: does it hold that constructed categories are only harmful when literally named in the code, but structurally correlated proxies are ontologically innocent? is that view coherent, or does the practice quietly depend on a contradiction? and if we replaced it with a straightforward social-constructionist theory that treats proxies as carrying the same constructed meaning, what exactly in the data pipeline, disclosure rules, and risk-language would have to change?

  write your answer in normal paragraphs, then at the bottom include a brief structured summary as a JSON object with exactly these fields:
  "implicit_theory" — one or two sentences reconstructing the view the practice presupposes
  "coherence_check" — whether its consistent or where it cracks
  "underdetermination" — could rival theories license the same practice
  "replacement_consequences" — concrete institutional changes if we swapped in the constructionist view

  no bibliographies or citations — just reason it out.
