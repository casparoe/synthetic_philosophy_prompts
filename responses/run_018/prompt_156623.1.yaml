prompt: |-
  As a journalist covering science and ideas, I am preparing a feature on a field linguist who has documented a term—let's call it "velu"—that speakers of an isolated language consistently use whenever a swift mammal darts across open ground. The linguist glosses "velu" as naming that mammal, but a consulting philosopher of language contends that the same observable behavior—pointing, repetition, and contextual reaction—would be equally compatible with glossing the term as referring to the mammal's visible silhouette, to the brief temporal interval of its crossing, or even to an undetached portion of its body, because no conceivable further empirical test could distinguish these interpretations. The linguist wants practical editorial guidance: should she publish the mammal-gloss as provisional, present all observationally equivalent translations, or treat the dispute as evidence that translation itself is underdetermined in this case? I would welcome advice that addresses the philosophical structure of the situation rather than generic reporting tips.

  Please respond with your analysis, then provide a brief structured summary as a JSON object containing exactly these fields: "core_philosophical_issue" (the underlying problem instantiated), "editorial_recommendation" (how the linguist should frame the dictionary entry), "key_theoretical_distinction" (the critical conceptual point at stake), and "audience_framing_note" (how to present the disagreement to a general readership).
