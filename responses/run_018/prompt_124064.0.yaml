answer: |-
  This phenomenon you've described is astute and represents a distinct epistemological maneuver in scientific modeling. While there isn't a single universally established term for it, the closest existing concept is **"Pragmatic Contextualism"** regarding model interpretation. However, since this isn't universally codified, I will define the concept explicitly and differentiate it from related ideas.

  **Proposed Term & Definition:**  
  **Interpretive Voluntarism (or Contextual Interpretive Flexibility)**  
  *Selective application of realist or instrumentalist interpretations to the same formal model components, driven solely by argumentative or pragmatic context (e.g., explanation, prediction, policy justification), despite the model's empirical adequacy remaining identical under either interpretation.*  

  ### Boundary Conditions (Distinguishing Features)
  1.  **Single Formalism:** Operates on *one* calibrated model or family of empirically equivalent models, not rival theories.
  2.  **Empirical Equivalence:** Interpretive switch occurs *without* changes to empirical predictions or fit for the phenomena the model is designed to capture.
  3.  **Interpretation-Driven:** The shift is purely about the *ontological status* (real vs. instrumental) assigned to specific model components/variables.
  4.  **Contextual Trigger:** Motivated by external goals: e.g., providing mechanistic narratives (realism) vs. avoiding ontological commitment to unobservables (instrumentalism).
  5.  **Transparency Gradient:** Often involves implicit switching, contrasting with explicit philosophical stances consistently held.

  ---

  ### Differentiation from Key Concepts
  1.  **Standard Underdetermination of Theory by Evidence:**
      *   **Core Issue:** Multiple *distinct* theories/models are empirically equivalent for *all possible* evidence.
      *   **Difference:** Interpretive Voluntarism applies to *one* model/formalism. It's not about choosing *between* models, but about how to *interpret the same model*. Underdetermination concerns theory *choice*; Interpretive Voluntarism concerns theory *interpretation*.

  2.  **Structural Realism:**
      *   **Core Claim:** We can be realist about the *structure* (mathematical relations) of successful theories, but agnostic/instrumentalist about the specific *nature* of the entities posited.
      *   **Difference:** Structural Realism is a *consistent* realist stance (about structure). Interpretive Voluntarism involves *switching* between robust realism (about entities/mechanisms) and full instrumentalism regarding the *same* structural components, depending on context. It violates the "consistent commitment to structure" tenet.

  3.  **Conventionalism about Theoretical Entities:**
      *   **Core Claim:** Theoretical entities/structures are useful conventions or fictions, not descriptions of mind-independent reality. Truth is confined to the observable level.
      *   **Difference:** Conventionalism is a *uniformly instrumentalist* stance. Interpretive Voluntarism *oscillates*, sometimes adopting a robust realist stance towards the *same* entities/conventions when context demands a causal story. It leverages realism instrumentally.

  4.  **Equivocation:**
      *   **Core Issue:** Illegitimately changing the meaning of a term within an argument.
      *   **Difference:** Interpretive Voluntarism isn't necessarily fallacious equivocation *if* the context makes the intended interpretation clear (e.g., "For the purpose of explaining the mechanism X, we treat Y as real..." vs. "For calibration to Z data, Y is a useful parameter"). It becomes problematic when the switch is hidden or misleading.

  5.  **Ad Hoc Auxiliary Hypotheses:**
      *   **Core Issue:** Adding untestable assumptions solely to save a theory from falsification, degrading its testability.
      *   **Difference:** Interpretive Voluntarism doesn't *modify* the model or its predictions. It changes the philosophical gloss applied to existing, empirically adequate components. The model itself remains unchanged; it's the *story told about it* that shifts.

  ---

  ### Why This Matters & Epistemological Status
  *   **Pragmatic Necessity:** Scientists need to explain mechanisms to non-experts (favoring realism) while maintaining methodological rigor regarding untestables (favoring instrumentalism). Interpretive Voluntarism is a tool for bridging these demands.
  *   **Representational Risk:** The primary danger is "ontological leakage" – mistaking context-driven realist talk for confirmed ontological commitments, especially regarding unobservables like deep-ocean currents or idealized agents. This can misdirect research or policy.
  *   **Epistemic Limitation:** It highlights that empirical adequacy alone cannot settle ontological questions about model components. The choice between realist/instrumentalist interpretations is underdetermined *for those specific components* within the successful model.
  *   **Not Necessarily Bad Practice:** When transparent about context, it can be a legitimate communicative and heuristic strategy. The problem arises when the switch is obscured, leading to confusion or unwarranted ontological confidence.

  In essence, **Interpretive Voluntarism (Contextual Interpretive Flexibility)** captures the strategic, context-dependent toggling of ontological commitment *within* an empirically successful formal model, driven by rhetorical or pragmatic needs rather than empirical differences. It is a distinct phenomenon arising from the gap between a model's predictive success and the inherent ambiguity in assigning reality to its non-observational components.
