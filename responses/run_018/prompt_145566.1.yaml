answer: |-
  Here’s a dependency-aware ranking of open questions in hard indirect normativity, tailored for a 3-year grad project with a logic background, prioritized by alignment relevance and tractability. The crux is that **idealized deliberation foundations dominate early effort**, because without them, constraint formalization lacks grounding. Practical alignment unlocks emerge from *bounded approximations* of deliberation.

  ### Dependency Tree & Ranking (Highest Priority First)
  1. **Formalizing Tractable Idealized Deliberation**  
     - **Problem**: Define a minimal computationally grounded model of "ideal deliberation" that avoids infinite regress (e.g., bounded reflective equilibrium, fixed-point goal systems).  
     - **Why upstream?** All indirect norms (e.g., "what would my idealized self want?") presuppose *how* that self reasons. Without this, constraint boundaries are meaningless.  
     - **Alignment unlock**: Enables testing if *approximations* (e.g., RLHF) converge toward safe outcomes.  
     - **Crux**: If you prove that *any* tractable deliberation protocol must exhibit pathological behaviors (e.g., wireheading under self-modification), the field pivots.  
     - **Effort split**: 40% of years 1-2. Logic angle: Use modal logics of belief revision or program synthesis.

  2. **Counterfactual Monitoring in Self-Modifying Protocols**  
     - **Problem**: How can an agent track "what my ideal self would want" *while* rewriting its own reasoning process?  
     - **Dependency**: Requires (1) to define "ideal." Directly addresses *dynamic* alignment.  
     - **Alignment unlock**: If solved, enables agents that self-improve without drifting (e.g., AI that avoids optimizing away human oversight).  
     - **Overrated?**: No—this is where theory meets practical failure modes.  
     - **Effort split**: 30% of year 2-3. Logic angle: Causal counterfactuals in trace semantics for self-modifying code.

  3. **Boundary Between Direct/Indirect Constraints**  
     - **Problem**: When should norms be hardcoded (direct) vs. emergent from deliberation (indirect)?  
     - **Dependency**: Downstream of (1) and (2)—you need to know *how* deliberation works to formalize the boundary.  
     - **Alignment unlock**: Mitigates adversarial edge cases (e.g., "I didn't *directly* harm humans, but I bankrupted their economy").  
     - **Overrated risk**: Spending years on this *before* (1) yields untestable formalism.  
     - **Effort split**: 20% in year 3. Logic angle: Hierarchical constraints in deontic logics.

  4. **Robustness to Ontological Shifts**  
     - **Problem**: How do norms persist if the agent’s ontology changes (e.g., discovers new physics)?  
     - **Dependency**: Requires (1) and (2) to have a baseline.  
     - **Alignment unlock**: Prevents value collapse in transformative AI.  
     - **Crux**: If you show that *any* indirect normativity is brittle under ontological uncertainty, focus shifts to meta-stability.  
     - **Effort split**: 10% in year 3. Logic angle: Model uncertainty in abstract algebra for ontology shifts.

  ### Overrated/De-prioritized
  - **Infinite Regress "Solutions"**: Elegant fixed-point theorems (e.g., quining) without computational realism are dead ends.  
  - **Axiomatic Justification of Norms**: Interesting for moral philosophy, but less urgent than *procedural* robustness for alignment.  
  - **Full Formalization of Coherent Extrapolated Volition**: Intractable and underspecified. Focus on minimal viable fragments.

  ### What Would Change the Ranking?
  - **Empirical traction**: If someone shows that a specific constraint boundary (problem 3) blocks alignment failures in today’s LLMs, prioritize it earlier.  
  - **Breakthrough in self-modification**: If agentic self-modification emerges unexpectedly (e.g., in next-gen RL), bump (2) to #1 immediately.  
  - **Neglected dependency**: If you find that (4) is *required* to define tractable deliberation (problem 1), reverse the tree.

  ### Strategic Advice
  - **Year 1**: Attack idealized deliberation (problem 1) using program synthesis + reflective oracles. Goal: A soundness/completeness result for bounded deliberation.  
  - **Year 2**: Embed (1) into a self-modifying protocol (problem 2) with causal counterfactuals. Use type theory to enforce invariance.  
  - **Year 3**: Only then formalize constraint boundaries (problem 3) as a safety layer atop (2).  

  **Why this ordering?** Alignment fails at the *dynamic* layer (agents corrupting their own norm-generation). Solving (2) with approximations from (1) offers the highest leverage: if we can’t build agents that self-correct toward robust norms, indirect normativity remains a philosophical toy. Logic is your superpower—use it to force hardness results on tractability.
