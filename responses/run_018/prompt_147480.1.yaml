prompt: |-
  I'm a software architect fluent in distributed systems -- microservice boundaries, eventual consistency, CAP theorem tradeoffs, event sourcing, CQRS, sidecar patterns, and state-machine replication -- but I have no background in philosophy of mind. I want you to restate the extended mind thesis associated with Clark and Chalmers, together with its parity principle, using only that vocabulary: treat cognitive states as distributed state, external notebooks and devices as persistent event stores or sidecar caches, belief formation as transaction processing across service boundaries, and the boundary traditionally drawn at skin and skull as an API gateway or network partition. Do this systematically for three parts: (a) the Otto-and-Inga comparison, treating Inga's biological memory and Otto's notebook as two replication strategies with different consistency guarantees; (b) the parity principle itself, translated into terms of functional equivalence across service interfaces; and (c) the standard anti-extensionist reply that cognition requires biological realization, translated as an argument for monolithic architecture with in-process state over distributed external storage. For each part, report what translates cleanly, what must be distorted to fit, and what has no counterpart at all -- in particular, address whether the philosophical notion of derived intentionality maps onto anything like read-replica lag or write-through caching, and whether first-person authority over one's beliefs has an analogue in observability or logging patterns.

  Then give me a residue report: is the philosophical disagreement ultimately about where to draw a service boundary, or is there a substantive claim -- perhaps about normativity, consciousness, or the conditions for belief attribution -- that simply cannot be expressed in distributed-systems vocabulary? I want to know whether my intuition that the thesis is just strong consistency guarantees applied to external caches captures the argument or misses something that makes the philosophical version non-trivial.

  Present the response in this JSON schema:

