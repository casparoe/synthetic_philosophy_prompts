prompt: |-
  I sit on the acquisitions committee of a regional science museum. We must rule on a proposal for a temporary exhibit titled "Parallel Timelines" that presents Anatoly Fomenko's New Chronology—his statistical argument that major ancient civilizations and events are phantom duplicates of medieval history—using symmetrical display panels that place conventional archaeological chronology and Fomenko's compressed chronology side-by-side without labeling either as established or pseudohistorical. The curator argues this format teaches visitors to weigh evidence; the board's science advisor warns that symmetrical presentation falsely implies epistemic parity, violating our institutional demarcation standard that distinguishes legitimate revisionism (testable, peer-reviewed, responsive to anomaly) from pseudohistory (post-hoc pattern matching that evades falsification). Draft the committee's formal decision memo recommending approval, rejection, or conditional approval with specific modifications and a concrete implementation timeline. Give an honest account of the strongest consideration favoring the opposing view, invoke the relevant demarcation criteria explicitly, and take a committed position with clear reasoning rather than balancing both sides neutrally. Do not request citations, reading lists, or bibliographic references.
reasoning: |-
  Okay, the user is on the acquisitions committee for a regional science museum and needs to draft a decision memo about a temporary exhibit proposal called "Parallel Timelines." This exhibit presents Anatoly Fomenko's New Chronology, which claims major ancient civilizations are actually medieval duplicates. The exhibit would show Fomenko's compressed chronology alongside conventional archaeological chronology without labeling either as established or pseudohistorical. 

  Hmm, this is tricky. The curator wants to teach visitors to weigh evidence by presenting both sides symmetrically. But the science advisor is concerned this creates false equivalence and violates the museum's demarcation standard. The user needs a formal recommendation - approval, rejection, or conditional approval with modifications and timeline.

  First, I need to understand the core tension here. The curator's educational intent is valid - teaching critical thinking is important. But Fomenko's work isn't just controversial; it's pseudohistorical by the museum's own standards. The symmetrical display suggests both views are equally credible when they're not. That's problematic for a science museum whose credibility depends on distinguishing science from pseudoscience.

  The strongest argument for approval is actually compelling - it's the "teach the controversy" approach. Letting visitors compare could build critical evaluation skills. And avoiding explicit labeling might reduce bias. I get why the curator proposed this format.

  But... the advisor's point about epistemic parity is crucial. The museum has clear demarcation criteria: legitimate revisionism is testable and peer-reviewed, while pseudohistory relies on post-hoc pattern matching that evades falsification. Fomenko's work fits the latter perfectly. Presenting it equally misrepresents how historical scholarship works.

  I think conditional rejection is the way to go. The topic could work if framed differently - maybe as a case study in how pseudohistory operates. But the symmetrical format has to change. We'd need to add context about historical methodology and clearly identify Fomenko's work as pseudohistorical. The modifications should focus on educational framing while maintaining academic integrity.

  For the timeline, late 2025 feels realistic - gives time for proper redesign and scholarly review. The key is preserving the museum's credibility while still offering thought-provoking content. The memo should be firm but respectful, acknowledging the curator's intent while upholding institutional standards.
answer: |-
  **MEMORANDUM**  
  **TO:** Acquisitions Committee, Regional Science Museum  
  **FROM:** [Your Name/Committee Designation]  
  **DATE:** October 26, 2023  
  **SUBJECT:** Formal Recommendation RE: "Parallel Timelines" Exhibit Proposal  

  **1. RECOMMENDATION:**  
  **Reject** the "Parallel Timelines" exhibit proposal in its current form. Conditional approval is **not feasible** without fundamental restructuring that abandons the symmetrical presentation model. Should the curator submit a substantively redesigned proposal addressing the demarcation criteria outlined below, it may be reconsidered under a new title and scope.  

  **2. STRONGEST CONSIDERATION FAVORING APPROVAL (OPPOSING VIEW):**  
  The exhibit’s symmetrical format ostensibly promotes critical thinking by inviting visitors to compare evidence independently. Proponents argue that withholding labels avoids biasing audiences prematurely and fosters engagement with historical methodology. This approach aligns with pedagogical principles encouraging active analysis over passive reception of authority, potentially making complex historiography more accessible.  

  **3. DEMARCATION CRITERIA VIOLATION:**  
  The proposal violates the museum’s Institutional Demarcation Standard by granting **epistemic parity** to Fomenko’s New Chronology and conventional archaeology. Our standard explicitly distinguishes:  
  - **Legitimate Revisionism:** Characterized by testable hypotheses, peer-reviewed mechanisms for error correction, and responsiveness to empirical anomalies (e.g., revised carbon-dating calibrations).  
  - **Pseudohistory:** Defined by post-hoc pattern matching, evasion of falsification, and rejection of cross-disciplinary verification (e.g., ignoring dendrochronology, numismatics, and textual criticism).  

  Fomenko’s work is archetypal pseudohistory: it relies on arbitrary statistical correlations while dismissing counterevidence from astronomy, genetics, and stratified archaeology as "corrupt traditions." Presenting it symmetrically with established chronology falsely implies both frameworks operate under equivalent scholarly rigor.  

  **4. REASONING FOR REJECTION:**  
  - **Epistemic Misrepresentation:** Symmetry implies methodological equivalence where none exists. Conventional chronology integrates multivariable, falsifiable evidence across disciplines; Fomenko’s model selectively reshuffles events without predictive power or error-correction mechanisms.  
  - **Educational Harm:** Visitors lack the expertise to "weigh evidence" meaningfully when presented with decontextualized parallels. The format risks legitimizing pseudohistorical tactics (e.g., cherry-picked similarities) as valid historical analysis.  
  - **Institutional Integrity:** As a science museum, we must model scholarly norms. Granting unchallenged platforming to a theory that rejects foundational scientific practices (e.g., radiocarbon dating) undermines our mission to promote evidence-based reasoning.  

  **5. CONDITIONAL PATH FORWARD (IF PURSUED):**  
  Should the curator wish to explore historical revisionism or pseudohistory as educational topics, a redesigned exhibit must:  
  - **Explicitly Contextualize Fomenko’s Work** as a case study in pseudohistory, detailing its rejection by academic consensus and demonstrating *why* its methods evade falsification.  
  - **Contrast with Legitimate Revisionism:** Highlight examples like the re-dating of Jericho or Thera eruptions to show how testable hypotheses refine historical understanding.  
  - **Include Critical Analysis Tools:** Interactive elements teaching visitors to identify hallmarks of pseudoscience (e.g., ad hoc immunizations, reliance on authority over evidence).  
  - **Remove Symmetrical Framing:** Present Fomenko’s claims solely within an analytical framework evaluating their credibility against demarcation criteria.  

  **6. IMPLEMENTATION TIMELINE (FOR REDESIGN):**  
  - **Resubmission Deadline:** January 31, 2024  
  - **Scholarly Review Period:** February 1 – March 15, 2024 (External historians/philosophers of science)  
  - **Final Approval/Rejection:** April 1, 2024  
  - **Exhibit Launch (If Approved):** No earlier than October 2025  

  **7. FINAL POSITION:**  
  The committee rejects the illusion of neutrality when one "timeline" systematically disregards scientific demarcation. Our duty is to illuminate the *process* of knowledge-building, not to stage debates where one side rejects the rules of evidence. The proposal’s format, however well-intentioned, ultimately confuses intellectual freedom with intellectual anarchy.  

  **APPROVED:**  
  ________________________________________  
  [Chair, Acquisitions Committee]
