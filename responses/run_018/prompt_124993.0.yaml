  | **2. Evaluation (30%)** | Quality & balance of arguments for/against empirical validity. Use of relevant examples.                  | Two strong, distinct arguments *for* validity with excellent examples. Two strong, distinct arguments *against* with excellent examples. Balanced. | Two reasonable arguments *for* with good examples. Two reasonable arguments *against* with good examples. Mostly balanced.       | Arguments presented but may be weak, repetitive, or lack clear examples. Imbalance in depth between for/against.               | Arguments weak, missing, irrelevant, or rely solely on unsupported assertion. Lack of examples.                                            |
  | **3. Paradox Analysis (40%)** | Insightful analysis of the "preservation paradox." Clear articulation of *what* each side preserves & changes. Examples. | Compelling argument that core difference is *what* is preserved. Clear, nuanced explanation of Left preserving potential/dignity via structural change AND Right preserving order/tradition via cultural/behavioral change. Excellent, relevant examples. | Clear argument that difference lies in *what* is preserved. Good explanation of Left/Right preservation foci and necessary changes. Good examples. | Identifies the paradox & attempts analysis but explanation may be unclear, simplistic, or lacks depth. Examples present but weak. | Misunderstands the paradox. Fails to identify distinct preservation foci. Analysis superficial or absent. Lacks relevant examples.         |
  | **4. Conclusion (15%)** | Clear, justified synthesis answering the "real or constructed" question based on prior analysis.             | Nuanced, convincing conclusion synthesizing points 1-3: acknowledges both the real, enduring conflict *and* the contingent/constructed aspects. Directly addresses the paradox's implication. | Clear conclusion based on analysis, stating if spectrum is real/constructed. References main points (definition, validity, paradox). | Conclusion present but simplistic, repetitive, or not fully justified by prior analysis. May ignore the paradox.                | Conclusion missing, illogical, contradictory, or unrelated to the question/analysis.                                                    |
