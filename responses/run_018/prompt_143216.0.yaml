prompt: |-
  Design a 90-minute exam essay for an upper-level metaphysics course on Zeno's dichotomy paradox. The prompt must force students past the standard mathematical reply (convergent infinite series) and into a conceptual tension: whether resolving motion via supertasks—completing infinitely many sub-tasks in finite time—merely relocates the paradox into the ontology of temporal parts and the continuity of agency. Specifically, ask whether an agent performing a supertask would experience discrete, unconnected mental states, and whether that undermines the resolution. Provide the exam question, a model answer of about 500 words, and a marking scheme with four must-hit points (5 marks each, total 20), each paired with a one-line description of the characteristic error that costs those marks.
reasoning: |-
  We are designing an exam essay question for an upper-level metaphysics course. The focus is on Zeno's dichotomy paradox, and we want to push students beyond the standard mathematical solution (using convergent series) and into the conceptual tension about supertasks, temporal parts, and continuity of agency.

  The key elements of the question:
  - It must force students to confront the idea that resolving motion via supertasks might just relocate the paradox into the ontology of temporal parts and the continuity of agency.
  - Specifically, ask whether an agent performing a supertask would experience discrete, unconnected mental states, and whether that undermines the resolution.

  Exam Question:

  **Zeno's dichotomy paradox argues that motion is impossible because before reaching a destination, one must complete an infinite series of sub-tasks: first covering half the distance, then half the remaining, and so on. The standard mathematical response invokes convergent infinite series to show that the infinite sum of these intervals equals a finite distance and can be covered in finite time. However, this solution frames motion as a "supertask" — the completion of infinitely many sub-tasks in a finite time.**

  **Critically evaluate whether this supertask resolution successfully addresses Zeno's paradox or merely relocates the paradox into the metaphysics of time and agency. In particular, consider the following:**

  (a) Does the concept of a supertask require an ontology of temporal parts? If so, what implications does this have for the persistence of an agent through time?

  (b) Would an agent performing a supertask experience their mental states as discrete and unconnected? If so, does this undermine the resolution by failing to account for the continuity of agency necessary for motion?

  **In your answer, engage with at least one contemporary philosopher's treatment of supertasks (e.g., Adolf Grünbaum, James Thomson, David Lewis, or others).**

  ---

  **Model Answer (approx. 500 words):**

  Zeno's dichotomy paradox challenges the possibility of motion by decomposing any journey into an infinite series of sub-journeys. The mathematical resolution, which relies on the convergence of the series 1/2 + 1/4 + 1/8 + ... = 1, demonstrates that the entire journey can be completed in finite time. However, this solution recasts motion as a supertask — the performance of infinitely many actions in a finite duration — which raises profound metaphysical concerns about time and agency.

  The supertask resolution appears to require an ontology of temporal parts. If motion is a supertask, then the journey is composed of an infinite sequence of temporal segments, each corresponding to a sub-task. David Lewis, in his perdurantist account, holds that objects persist by having temporal parts. Thus, an agent moving from A to B would be a space-time worm with infinitely many temporal slices, each completing one sub-task. But this leads to a worry: if the agent at each slice is merely a part, then what accounts for the unity of the agent across the entire journey? The perdurantist might respond that the agent's persistence is just the aggregate of these parts. However, this seems to reduce the agent's continuous existence to a series of disconnected stages, undermining the intuition of a single, enduring self that experiences the motion as a whole.

  Moreover, the supertask model may fracture the agent's mental life. Consider the experience of the runner: in the first half-second, she covers half the distance; in the next quarter-second, the next quarter, and so on. Her mental states — perceptions, intentions, memories — would be confined to each infinitesimal interval. As James Thomson's "Thomson's Lamp" paradox suggests, completing infinitely many actions in finite time can lead to indeterminacy. Applied to mental states, if each state is isolated in a temporal part, how does the agent integrate them into a coherent stream of consciousness? If the mental states are discrete and unconnected, then the agent at the end of the run might have no memory of the earlier parts, or worse, no continuous sense of agency. This threatens the very notion of a single agent performing the entire supertask.

  Adolf Grünbaum, in his defense of the mathematical solution, argues that the physical completion of the supertask does not entail a corresponding psychological experience of infinity. But this admission is damaging: if the agent does not experience the continuity of motion, then the resolution fails to capture what we mean by motion, which is inherently tied to a subject's experience. The paradox thus relocates from the possibility of motion to the possibility of continuous agency in a world of temporal parts.

  In conclusion, while the supertask resolution answers Zeno's mathematical challenge, it exacerbates the metaphysical ones. By requiring an ontology of temporal parts and threatening the continuity of agency and experience, the resolution may not fully reconcile our intuitive understanding of motion with the conceptualization of space and time as infinitely divisible.

  ---

  **Marking Scheme (Total 20 marks):**

  The essay will be graded based on four key points (each worth 5 marks). A top-mark answer must hit each of these four points. Below, each point is paired with a characteristic error that would result in losing those marks.

  1. **Engagement with the supertask as relocating the paradox to temporal parts and agency (5 marks)**
     - *Characteristic error:* Only discussing the mathematical solution without addressing the metaphysical relocation of the paradox.

  2. **Analysis of the requirement of temporal parts ontology and its implications for persistence (5 marks)**
     - *Characteristic error:* Failing to consider how temporal parts (e.g., perdurantism) might be necessary for the supertask and what problems this raises for the agent's persistence.

  3. **Evaluation of the mental states of an agent in a supertask, specifically the potential for discrete and unconnected experiences (5 marks)**
     - *Characteristic error:* Ignoring the psychological dimension of the agent's experience or not connecting it to the continuity of agency.

  4. **Critical engagement with at least one named philosopher's treatment of supertasks (e.g., Grünbaum, Thomson, or Lewis) (5 marks)**
     - *Characteristic error:* Not discussing any specific philosopher's view on supertasks, or mentioning a philosopher without critically engaging their position in the context of the essay prompt.

  Each point is equally weighted. The essay must demonstrate understanding of the conceptual tension and offer a critical evaluation. The model answer hits all four points: it discusses relocation (point 1), temporal parts and persistence (point 2), the mental states and continuity of agency (point 3), and engages with Grünbaum, Thomson, and Lewis (point 4).
answer: |-
  ### Exam Question:  
  **Time Allowed: 90 minutes**  

  **Zeno's dichotomy paradox asserts that motion is impossible: to traverse a distance, one must first complete infinitely many sub-tasks (e.g., covering half the remaining distance at each step). The standard mathematical resolution—invoking convergent infinite series—shows the sum of these intervals is finite and can be completed in finite time. This frames motion as a "supertask": completing infinitely many actions within a bounded duration.  

  Critically evaluate whether this supertask resolution genuinely resolves Zeno’s paradox or merely relocates it into deeper metaphysical tensions concerning temporal parts and the continuity of agency. Address the following:  
  (a) Does the supertask model require an ontology of temporal parts (e.g., perdurantism)? If so, what challenges arise for the persistence of a unified agent?  
  (b) Would an agent performing a supertask experience their mental states (e.g., intentions, perceptions) as discrete and unconnected? If yes, does this undermine the resolution by threatening the coherence of agency or conscious experience?  

  Engage at least one philosopher’s treatment of supertasks (e.g., Adolf Grünbaum, James Thomson, David Lewis) to support your analysis. Conclude by arguing whether the supertask resolution is ultimately satisfactory.**  

  ---

  ### Model Answer (approx. 500 words):  

  Zeno’s dichotomy paradox reduces motion to an infinite regress of subtasks, seemingly rendering movement impossible. The mathematical rebuttal—that the infinite series converges to a finite distance—solves the quantitative problem but reinterprets motion as a supertask. I argue this relocates, rather than resolves, the paradox by exposing tensions in temporal ontology and agency.  

  First, supertasks demand an ontology of temporal parts. Perdurantism (defended by David Lewis) holds that objects persist by having distinct temporal segments. In a supertask, an agent’s journey decomposes into infinitely many sub-intervals (e.g., t₁ for 1/2, t₂ for 1/4, etc.). Each subtask corresponds to a temporal part of the agent. However, this fragments the agent’s identity: if the “agent” at t₁ and t₂ are mereological slices, what grounds the unity of agency across time? Lewis might argue persistence is just the aggregation of parts, but this invites Thomson’s lamp-style indeterminacy: just as a lamp switched infinitely often lacks a definite state, an agent with disjoint temporal parts lacks intrinsic continuity. Motion requires a persisting *subject*, but temporal parts reduce agency to a disconnected sequence.  

  Second, the mental experience of a supertask agent compounds this problem. Adolf Grünbaum concedes that supertasks are physically possible but argues psychological continuity is irrelevant. Yet if motion involves conscious agency (e.g., a runner intending to finish), mental states must cohere across subtasks. In a supertask, each subtask occupies a distinct, fleeting interval—leaving no time for cognitive integration. James Thomson’s critique of supertasks implies that infinitely compressed actions prevent state-binding: the agent at tₙ has no causal or mnemonic link to tₙ₊₁. Consequently, intentions fragment, and perceptions become atomized. For instance, a runner completing subtasks in milliseconds might “reset” cognitively at each step, lacking experiential flow. This undermines the resolution: if motion requires unified agency (e.g., Aristotle’s “unmoved mover”), but supertasks yield disjoint mental snapshots, the agent never genuinely *undergoes* motion as a continuous phenomenon.  

  Grünbaum dismisses psychology as extraneous, but this evasion is fatal. If the mathematical model permits motion only by decoupling it from experiential or agential continuity, it fails to address Zeno’s core challenge—that motion is inconceivable. The paradox resurfaces in the metaphysics of time: temporal parts may “complete” subtasks, but without diachronic identity, agency dissolves.  

  In conclusion, the supertask resolution relocates Zeno’s paradox into the ontology of persistence and mind. It solves the arithmetic of intervals but neglects that motion presupposes a unified agent. Until perdurantism can reconcile temporal parts with agential continuity, or supertasks can account for mental coherence, the paradox remains metaphysically unresolved.  

  ---

  ### Marking Scheme (Total: 20 marks):  
  **Each of the four must-hit points is worth 5 marks. Characteristic errors for each point deduct marks.**  

  1. **Critique of the supertask resolution as relocating the paradox** (5 marks)  
     - *Must-hit:* Argues that the mathematical solution shifts the problem to metaphysical tensions (temporal parts/agency).  
     - **Characteristic error (0 marks):** Merely restates the convergent-series solution without addressing metaphysical relocation.  

  2. **Analysis of temporal parts ontology and persistence challenges** (5 marks)  
     - *Must-hit:* Engages perdurantism (e.g., Lewis) and explains how temporal parts threaten unified agency.  
     - **Characteristic error (0 marks):** Fails to link supertasks to temporal parts or ignores persistence problems.  

  3. **Evaluation of fragmented mental states and continuity of agency** (5 marks)  
     - *Must-hit:* Discusses whether supertasks yield disconnected mental states (e.g., using Thomson or Grünbaum) and impacts agency.  
     - **Characteristic error (0 marks):** Neglects psychology or agency, or assumes continuity without argument.  

  4. **Critical engagement with a philosopher on supertasks** (5 marks)  
     - *Must-hit:* Uses at least one philosopher (e.g., Grünbaum, Thomson, Lewis) to support or challenge the resolution.  
     - **Characteristic error (0 marks):** Names a philosopher but does not substantively apply their view to the prompt.  

  ---  
  **Instructions for Graders:**  
  - Award full marks (5 per point) for clear, well-reasoned engagement with each criterion.  
  - Deduct marks for vagueness, unsupported claims, or missing elements as per characteristic errors.  
  - Balance credit for structure, clarity, and originality within the 20-mark framework.
