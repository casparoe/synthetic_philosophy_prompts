     She points out that the instrument analogy fails because we have two quantities and an uncertain exchange rate. The imprecision in the trade-off does not stay small along the chain: the endpoints swing by a large amount (40 points, from -18 to 22.5). She says Peter cannot dismiss that as a defect of a coarse instrument because the instrument (the rubric) is in good order and it's the weight that is missing.

