  They're considering using sorrow songs as the central example. I need to evaluate if that's the best choice. Sorrow songs are powerful because they embody double-consciousness through their structure—African roots blended with American influences. The example should avoid explicit calls to action, which sorrow songs do since their message is embedded in the form, not lyrics. That fits well. But I should outline what the example must have: structural duality, emotional truth without didacticism, and cultural fusion. It must avoid being reduced to mere protest songs or suffering narratives.

  Next, misconceptions. The students might think Du Bois reduces beauty to politics, that propaganda equals lies, or that Black art should only depict suffering. The plan needs to address these in sequence. Start with the beauty-politics false dichotomy early, then tackle propaganda as deception when introducing the term, and finally dispel the suffering-only notion when discussing the sorrow songs' range of themes.

  The end-check activity is vital. A classification task where students analyze a hypothetical piece for embedded messages through form, not content. That tests their grasp of the dependency between aesthetic form and propaganda. 

  The user also wants to explicitly exclude certain topics, like Kantian aesthetics, to keep focus. Mentioning it briefly as what Du Bois pushes against without diving in makes sense. 

  The user’s friend thinks they're overemphasizing the aesthetic part. The plan must show why it's essential. Highlighting how double-consciousness requires aesthetic form to convey the duality that explicit messages can't. Without form, the dependency collapses. The sorrow songs example demonstrates this—their power lies in the structure, not just words. 

  Structure-wise, start with double-consciousness to anchor the discussion. Then define propaganda in Du Bois's terms, link it to art's necessity, use sorrow songs to illustrate, address misconceptions at each step, and end with the activity. Refuse Kant but note the implicit pushback. 

  Need to ensure each section flows logically, preempting misconceptions right when they're likely to arise. For example, when introducing propaganda, immediately distinguish it from manipulation. When discussing sorrow songs, clarify they're not just about suffering. 

  The bottom line: The session must demonstrate that propaganda in Du Bois's view is an unavoidable function of aesthetic form expressing double-consciousness, not reducible to content or didactics. The sorrow songs are ideal because their structural duality inherently communicates racial experience beyond explicit statements. The teaching sequence should start with double-consciousness, redefine propaganda through that lens, use sorrow songs as the core example while preempting misconceptions at each stage, include an analytical end-check, and explicitly bracket Kantian aesthetics while acknowledging its presence as a counterpoint.
answer: |-
  **Bottom line:** Anchor the session in Du Bois's *definitional dependency*: Propaganda emerges *necessarily* from the aesthetic form required to express double-consciousness, making aesthetics non-optional for conveying the racial truth that explicit argument cannot carry.

  **Teaching Plan Sequence (90 mins):**

  1.  **Ground Zero: Double-Consciousness (15 mins)**
      *   **Activity:** Close reading of *Souls of Black Folk* Intro ("this sense of always looking at one’s self through the eyes of others..."). Elicit core elements: internal conflict, imposed external view, veil, striving for self-consciousness/manhood.
      *   **Crucial Question:** *How is this lived experience communicated? Can it be fully captured by a political speech or sociological report? Why/why not?* (Hint at inadequacy of pure reason/explicit argument).
      *   **Preempt Misconception #1 (Beauty=Politics):** State clearly: "We are NOT yet talking about art's purpose. We're establishing a *condition of being* that demands a specific mode of expression."

  2.  **Introducing "Propaganda" - Du Bois's Radical Redefinition (15 mins)**
      *   **Text:** "Criteria of Negro Art" core claim ("all Art is propaganda and ever must be"). Emphasize context (response to "art for art's sake" pressures).
      *   **Reframing:** Propaganda here = "The necessary communication of a specific *truth of racial experience* arising from the condition of double-consciousness." It is *inherent*, not *added*.
      *   **Contrast Explicitly:** "This is NOT about making political posters (though that *could* be art). It's about the unavoidable *message-bearing capacity* of aesthetic form itself when expressing this duality."
      *   **Preempt Misconception #2 (Propaganda=Lying/Manipulation):** "For Du Bois, this propaganda is about conveying a *deep truth* suppressed by the dominant culture, not distorting facts. The 'message' *is* the truth of the experience."
      *   **Link:** *Why* is aesthetic form needed? Double-consciousness involves deep feeling, conflict, striving – elements reason alone struggles to convey authentically.

  3.  **Core Example: Sorrow Songs - Form as Carrier (25 mins)**
      *   **Why Sorrow Songs Work:** They embody double-consciousness *structurally* (African musical modes + European hymn forms/English language) and *thematically* (veiled expression, sorrow/joy duality, communal truth).
      *   **Focus on Form:** Analyze a specific song (e.g., "Nobody Knows the Trouble I've Seen"). Highlight:
          *   **Veiled Meaning:** Spiritual yearning *as* coded expression of earthly suffering/hope.
          *   **Musical Duality:** Call-and-response (communal voice), syncopation, melodic contours carrying emotional weight beyond lyrics.
          *   **Truth-Bearing:** The form *itself* communicates resilience, communal spirit, depth of feeling implicit in double-consciousness – a truth inaccessible to a sociological statistic or political slogan.
      *   **What the Example MUST Avoid/Have:**
          *   **MUST HAVE:** Structural duality (musical, lyrical), emotional/spiritual depth, veiled rather than explicit political content, demonstration of a truth *only* this form can carry.
          *   **MUST AVOID:** Interpretation as *only* a protest song or call to action. The "message" is the *embodied experience*, not "join the NAACP." Avoid presenting it *only* as suffering; note hope, resilience, transcendence *within* the form.
      *   **Preempt Misconception #3 (Only Suffering):** "Du Bois treasured the Sorrow Songs for their full range – sorrow *and* joy, despair *and* transcendence. The propaganda is the truthful communication of the *complex humanity* within the Veil, refuting caricatures. Art depicting Black joy *also* carries this necessary propaganda by asserting that complex humanity."

  4.  **Consolidating the Dependency (10 mins)**
      *   **Reiterate the Chain:** Double-Consciousness (Condition) --> Necessitates Aesthetic Form (Expression) --> Inherently Communicates Racial Truth (Propaganda).
      *   **Key Point:** The propaganda *depends* on the successful use of aesthetic form to carry the complex, feeling-laden truth. Bad art fails *as propaganda* in this sense. Form isn't a vessel; it's the *means of revelation*.
      *   **Why Aesthetics Isn't Optional:** Without the specific capacity of aesthetic form (music, narrative, image) to hold and convey duality, emotion, and veiled meaning, the *full truth* of double-consciousness remains unexpressed and unknown. Explicit argument flattens it.

  5.  **End-Check Activity: Classifying the Propaganda (15 mins)**
      *   **Activity:** Present 3 short hypothetical descriptions of fictional artworks. Students vote/argue: "Which one BEST exemplifies Du Bois's concept of necessary propaganda arising from aesthetic form to express double-consciousness?" (Not "is it propaganda?" but "does it fit *this specific dependency*?")
      *   **Example Hypotheticals:**
          1.  A stark documentary photo of a protest sign with a clear demand. (Too explicit, lacks aesthetic form's duality/veil).
          2.  A jazz composition blending West African rhythms with complex European harmonies, evoking both exhilaration and deep melancholy without lyrics. (Strong candidate: structural duality, emotional complexity, truth in form).
          3.  A novel about Black middle-class life focusing *only* on material success, avoiding any racial tension or cultural duality. (Fails to express double-consciousness, avoids the necessary truth).
      *   **Focus:** Their reasoning *must* hinge on how the artwork's *form/structure/style* carries the message of double-consciousness inherently. Memorizing "art is propaganda" is insufficient.

  6.  **Explicit Limits & Conclusion (10 mins)**
      *   **What We Refuse to Cover:** "We are *explicitly bracketing* deep dives into Kantian aesthetics or 'art for art's sake' debates. While Du Bois is pushing against this framework, understanding *his specific positive argument* about double-consciousness and form is our sole focus today. We also won't resolve later debates (e.g., Locke vs. Du Bois)."
      *   **Reinforce Non-Optional Aesthetics:** "If you take away nothing else: Du Bois argues that the *only way* to communicate the profound, conflicted truth of racialized existence under the Veil is through the unique capacities of aesthetic form. That's why 'art is propaganda' is a statement about *necessity*, not just politics. Propaganda *collapses* without aesthetics in this framework." End on the Sorrow Songs as the irreducible proof.

  **Why this plan shows aesthetics aren't optional:** By starting with double-consciousness and demonstrating that its authentic expression *demands* aesthetic form (via the Sorrow Songs), the session makes aesthetics the *sine qua non* of Du Bois's propaganda. The end-check forces analysis of the form-message dependency. Removing aesthetics breaks the chain Du Bois constructs.
