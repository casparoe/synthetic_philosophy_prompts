answer: |-
  **Final Examination: Advanced Topics in Decision Theory**  
  **Time Allowed: 60 minutes**  
  **Total Marks: 25**  
  **Answer Length: ~800 words**  

  ---

  ### Question (25 marks)  
  Consider an agent embedded in a decision context where it must choose between two options:  
  - **Option U**: Retain its current utility-weighting architecture \(U\), which assigns intrinsic value to all future experiential states.  
  - **Option U\***: Adopt a revised architecture \(U^*\), which systematically discounts future experiential states (e.g., reducing weight on temporally distant experiences) but aligns more closely with the agent’s current meta-preferences for coherence.  

  Crucially, the agent evaluates *both* options using *both* \(U\) and \(U^*\). For example:  
  - Under \(U\), \(U\) may rank higher than \(U^*\) because \(U\) values future states more.  
  - Under \(U^*\), \(U^*\) may rank higher than \(U\) because \(U^*\) better satisfies current meta-preferences.  

  This creates a loop: the choice of utility architecture affects the evaluation of that choice itself.  

  **Your tasks:**  
  1. **Diagnose the reflexivity** (i): Explain why this scenario is not merely an instance of ordinary self-modification (e.g., changing a preference) but a *reflexive loop* that violates the independence assumption of standard decision theory (where the evaluative standard is fixed).  
  2. **Assess decision theories** (ii): Analyze whether **causal decision theory (CDT)** and/or **evidential decision theory (EDT)** can resolve this loop. Explain why treating future reasoning as part of an "external environment" fails for an embedded agent.  
  3. **Propose/evaluate a stopping rule** (iii): Propose OR critically evaluate *one* minimal, non-arbitrary constraint (e.g., fixed-point stability, reflective equilibrium) that could rationally halt the loop. Address its limitations.  

  ---  
  ### Model Answer (689 words)  

  #### (a) Diagnosis of Reflexive Loop (Task i)  
  The crux of this scenario lies in the *co-determination* of the choice and its evaluative standard. In standard decision theory, an agent maximizes expected utility relative to a fixed utility function. Here, however, the choice between \(U\) and \(U^*\) alters the very function used to assess the choice. Crucially, evaluations under \(U\) and \(U^*\) yield conflicting verdicts: \(U\) favors itself (as it weights future states highly), while \(U^*\) favors itself (as it prioritizes current meta-coherence). This creates a self-referential loop: adopting \(U^*\) makes \(U^*\) appear superior under \(U^*\), while retaining \(U\) makes \(U\) appear superior under \(U\). The loop is not computational (e.g., processing limits) but *conceptual*: the independence of the evaluation framework from the options evaluated—a bedrock assumption of rationality—is violated. Unlike ordinary self-modification (e.g., deleting a desire), where the agent’s *current* utility function judges the change, here the *post-change* function judges itself retroactively, collapsing the distinction between actor and critic.  

  #### (b) Failure of Externalization (Task ii)  
  One might suggest treating the future agent (with \(U\) or \(U^*\)) as an "environment" to predict and influence. However, this fails for embedded agents. The agent cannot externalize its future reasoning because:  
  - **Embeddedness Constraint**: The agent’s decision *constitutes* its future evaluative framework. Predicting how a future self would evaluate outcomes requires assuming which utility function it will use—but that function depends on the current choice. This reduces to asking, "Which self should I trust to judge?"—a question already mired in the loop. Externalization presupposes a stable, detached perspective, but the agent is *inside* the system it is modeling. Attempting to model future preferences as exogenous causal consequences reintroduces the loop: calculations under \(U\) assume \(U\) persists, while under \(U^*\) they assume \(U^*\) persists, leading to divergent "predictions" that cannot be neutrally compared.  

  #### (c) Limits of CDT and EDT (Task ii)  
  - **Causal Decision Theory (CDT)**: CDT selects acts that *cause* desirable outcomes. Here, it asks: "Does choosing \(U\) or \(U^*\) *cause* better outcomes under my current utility function?" But the agent’s current function is ambiguous: if "current" means \(U\), CDT recommends keeping \(U\); if it means \(U^*\), CDT recommends switching to \(U^*\). CDT cannot resolve this ambiguity because it assumes a single, persistent utility function to define "desirable." Invoking counterfactuals (e.g., "What would happen if I switched?") fails: the outcome depends on which function evaluates it, and CDT lacks resources to adjudicate between \(U\)-based and \(U^*\)-based counterfactuals.  
  - **Evidential Decision Theory (EDT)**: EDT selects acts that *evidence* desirable outcomes. It asks: "Which choice is evidence for better outcomes, given my current knowledge?" However, the act (choosing \(U\) or \(U^*\)) is perfectly correlated with the utility function that evaluates outcomes. Choosing \(U^*\) evidences that \(U^*\) is in use (favoring \(U^*\)), while choosing \(U\) evidences that \(U\) is in use (favoring \(U\)). EDT thus amplifies the loop: it recommends whichever act co-varies with the utility function that validates it, offering no escape.  

  Both theories fail because they require a *stable* evaluative baseline to rank acts, but the baseline is itself in dispute.  

  #### (d) Stopping Rule: Reflective Stability (Task iii)  
  A minimally non-arbitrary constraint is **reflective stability**: the agent should choose a utility architecture that would endorse itself *if* it were already in place. Formally:  
  - \(U\) is stable iff \(U\) ranks \(U\) over \(U^*\).  
  - \(U^*\) is stable iff \(U^*\) ranks \(U^*\) over \(U\).  

  In this scenario, both \(U\) and \(U^*\) satisfy this condition. Stability thus fails to uniquely resolve the choice but excludes architectures that reject themselves. Its strength lies in halting infinite regress: it anchors evaluation in a coherent, self-sustaining perspective without invoking external norms. However, it has two limitations:  
  1. **Non-uniqueness**: When multiple options are self-endorsing (as here), stability is insufficient. The agent must appeal to further criteria (e.g., meta-coherence of \(U^*\)), but these reintroduce reflexivity.  
  2. **Conservatism bias**: Stability favors incumbent architectures (like \(U\)) that resist change, even when \(U^*\) offers better alignment with meta-preferences.  

  #### (e) Unresolved Tension  
  The deeper problem persists: any stopping rule (stability, fixed points, etc.) must itself be justified reflexively. Why privilege self-endorsement over other criteria? Embedding this rule within the utility architecture risks circularity; placing it outside violates embeddedness. Reflexive loops expose a lacuna in standard theories of rationality: they demand normative grounds for choosing one’s own normative grounds, a regress that no decision-theoretic tool fully escapes.  

  ---  
  ### Marking Scheme (Total: 25 marks)  

  | **Component**                     | **Marks** | **Full Marks Requirement**                                                                 | **Typical Error**                                                                 |
  |-----------------------------------|-----------|--------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------|
  | **Diagnosis of reflexive loop**   | 0–5       | Clearly distinguish reflexivity (evaluation framework co-determined by choice) from ordinary feedback/self-modification. | Describing computational constraints or preference change without self-reference. |
  | **Failure of externalization**    | 0–6       | Explain why embeddedness prevents treating future reasoning as an external environment (e.g., choice constitutes the evaluator). | Asserting externalization fails without showing *why* (e.g., assuming a "detached view" exists). |
  | **Decision-theoretic analysis**   | 0–6       | Specific application: CDT fails due to ambiguous baseline; EDT fails due to self-validating correlations. | Naming CDT/EDT without analyzing their breakdowns in this loop.                  |
  | **Stopping-rule proposal/evaluation** | 0–5    | Propose/evaluate a *specific* constraint (e.g., stability), noting a limitation (e.g., non-uniqueness). | Suggesting an arbitrary halt (e.g., "choose randomly") or ignoring costs.        |
  | **Clarity and acknowledgment of limits** | 0–3    | Explicitly state the unresolved tension (e.g., justification regress of stopping rules). | Claiming a complete solution or obscuring weaknesses.                            |

  **Grade Ranges**:  
  - **A (22–25)**: Comprehensive, precise, avoids typical errors; acknowledges unresolved tensions.  
  - **B (17–21)**: Competent but vague in key areas (e.g., superficial loop diagnosis); may overlook 1–2 limitations.  

  ---  
  **END OF EXAMINATION**
