  hey can u explain the conceptual tension in dennets three stances thing, specifically with real patterns? i dont want the basic version where u just list physical design and intetional stance. what im stuck on is whether using the intentional stance means you actually think beliefs and desires are real patterns in the world, or if its okay to treat them as just useful fictions. also dennett says real patterns have to be compressible, but does that mean they need to be causally efficacious too, or is predictive power enough? my teacher said something about ontological commitment but i didnt get it. can u break down exactly where the line is between a pattern being 'real' versus just a convenient story, especially for minds?
