prompt: |-
  okay so me and my freind got into this huge argument last night about the statue and clay thing — like, if you slowly replace every atom of marble in a sculpture with synthetic polymer filler until none of the original material is left, is it still the same statue or just a new object that looks identical? he kept saying the form is what counts, and that the original material just constitutes the statue without being identical to it, but i think that sounds like wordplay. i was trying to apply it to those museum restorations where they fill missing chunks with modern resin, and he said thats different because the base clay still exists, but i don't buy it.

  anyway, can you lay out the most important implications if we actually take that material-constitution view seriously? specifically, how should it change the way curators label heavily reconstructed pieces, especially when those pieces are involved in restitution debates over looted artifacts? and does accepting that a statue and its clay are two different things sitting in the same spot make it easier or harder to defend returning an object that now contains mostly modern metal? also, i'm curious whether this view has any weird fallout for digital twins or 3D-printed replicas that copy the form exactly but share zero atoms with the original — are they just new constitutions with no base?

  please don't give me a bibliography or reading list, i just want the core logical fallout for authenticity and ethics. also, if the statue and its repairs are literally seperate objects on the same pedestal, does that mean a museum is technically displaying two things at once? my brain hurts, but keep it casual and don't get too academic about it.
