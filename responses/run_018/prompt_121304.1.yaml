  Their core idea has three key components: (1) severe suffering reduction has absolute priority over pleasure maximization, (2) this priority operates until suffering falls below a specific threshold, and (3) pleasure considerations only enter after that threshold is reached. They also question whether suffering and pleasure are even measurable on the same scale.

