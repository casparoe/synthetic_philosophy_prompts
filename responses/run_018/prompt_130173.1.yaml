  hey so i'm writing an essay for my phil of religion course on kierkegaards fear and trembling, specifically the teological suspension of the ethical. my roommate read the abraham part and said it sounds like kierkegaard is just giving religious people a get-out-of-ethics card — like if god tells you something you can suspend the universal and murder is suddenly okay. i told him no, it's teological meaning the ethical is suspended for a higher end not destroyed, but now i'm second-guessing.

  if the ethical is genuinely suspended rather than overruled, doesn't that mean abraham in that moment isn't actually bound by thou shalt not kill at all — not even in a conflicted way — so he wouldn't be a tragic hero like agammemnon, he'd be more like a diplomat with immunity who just isn't subject to local law? and if thats right, why does kierkegaard say abraham returns to the ethical after the ram? wouldn't returning only make sense if he was outside the boundry entirely, like leaving a country and coming back? my prof also mentioned the knight of infinite resignation vs the knight of faith — does that map onto being inside vs outside the ethical boundry, or am i forcing the analogy? can you correct where my diplomatic-immunity picture goes wrong and tell me whether abraham is actually outside morality in that moment? please answer in exactly five numbered points, each one or two sentences, no intro or conclusion.
