  For their unlisted case about psychological transformation post-punishment, the principle suggests: the initial punishment satisfied desert through legitimate causal pathways, and the transformed self isn't liable for further consequences. The moral bankruptcy analogy fits well here, as the causal chain of desert was completed before the transformation.

