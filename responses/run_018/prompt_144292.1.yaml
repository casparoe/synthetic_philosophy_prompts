  ### **Timeline (90 Minutes Total)**  
  | **Time** | **Phase** | **Activities** |  
  |----------|-----------|---------------|  
  | 0–10 min | **Introduction** | Explain rules, categories, roles, and scoring. Emphasize binary classification enforcement (no hybrid labels). |  
  | 10–25 min | **Training Round** | Practice module (non-scored). Facilitator demonstrates role dynamics and evidence analysis. |  
  | 25–35 min | **Main Game: Round 1** | Module 1 classification (5 min setup/execution + 5 min voting/scoring). |  
  | 35–40 min | **Main Game: Round 2 (Hidden Case)** | Introduce destabilizing module (voltage-controlled filter with period-correct modern replacement). |  
  | 40–60 min | **Main Game: Rounds 3–5** | Modules 3–5 classification (5 min each). |  
  | 60–70 min | **Group Discussion** | Archivists reveal hidden-case intent. Discuss categorical collapse. |  
  | 70–85 min | **Debrief** | Map instability to concept restructuring; address limitations. |  
  | 85–90 min | **Conclusion** | Summarize key insights. |  

  ---

  ### **Roles & Rules**  
  **Participants:** 12 (split into rotating trios per module).  
  - **Classifier (4 participants total, 1 per module):**  
    - Examines evidence cards, assigns **one** label: *original*, *copycat restoration*, or *fluid recreation*.  
    - Defends choice in ≤60 seconds.  
  - **Challenger (4 participants total, 1 per module):**  
    - Must counter with **one** alternative label (binary choice enforcement).  
    - Argues against classifier in ≤60 seconds.  
  - **Archivist (4 participants total, 1–2 per module):**  
    - Manages evidence cards, timer, and scoring.  
    - Enforces rules: No ambiguous labels; voting forces binary outcome.  
  - **Non-active participants:** Observe and may vote.  

  **Evidence Cards (Per Module):**  
  - Circuit schematics, component lists, solder-joint close-ups, voltage readouts.  
  - *Hidden Case (Round 2):* Cards show period-correct specs but modern manufacturer (e.g., "IC: LM13700 (2020) vs. original CA3080 (1975)").  

  **Voting & Scoring:**  
  - Group votes on classifier’s or challenger’s label (majority wins).  
  - **Reputation Points (non-monetary):**  
    - Classifier: +3 if label upheld; +1 if overturned but correct.  
    - Challenger: +3 if label wins; +1 if challenge forces correction.  
    - Archivist: +1 per round for accurate record-keeping.  
  - Points displayed publicly; "Master Restorer" title awarded to highest scorer.  

  ---

  ### **Materials**  
  - **Evidence Card Sets:** 5 sealed envelopes (1 practice + 4 modules + 1 hidden case).  
  - **Role Cards:** 12 cards (4× classifier, 4× challenger, 4× archivist).  
  - **Timer:** For strict 60-second arguments.  
  - **Scoring Board:** Visible points tally.  
  - **Voting Tokens:** Red/blue cards (binary choice during challenges).  

  ---

  ### **Hidden Case Design**  
  - **Module:** Voltage-controlled filter (e.g., Moog ladder filter clone).  
  - **Evidence:**  
    - Schematic matches original topology.  
    - Component list specifies modern ICs (e.g., "Op-amp: TL072 (2022) vs. original LM301").  
  - **Intent:** Blurs "copycat" (exact replication) and "fluid" (modern reinterpretation) by using period-accurate *function* with non-original *components*. Rules remain unchanged to trigger implicit collapse.  

  ---

  ### **Debrief Structure**  
  1. **Reveal Hidden Case (60–65 min):**  
     - Archivists disclose the module’s ambiguity: "Modern parts met period specs—why did labels fracture?"  
  2. **Map Instability to Concept Formation (65–75 min):**  
     - **Pressure-Driven Restructuring:** Time constraints and scoring forced reweighting of features (e.g., "manufacturer" vs. "circuit function").  
     - **Collapse Moment (Round 2):** Participants prioritized functional equivalence over categorical integrity—a predictable failure mode.  
  3. **Limitations & Predictions (75–85 min):**  
     - **Cannot Reproduce:** Automatic analogy-making (e.g., Hofstadter’s Copycat). This exercise models *pressure-induced* shifts, not emergent fluid concepts.  
     - **Predictable Failure:** Retreat to functional-equivalence arguments ("It sounds the same, so it’s copycat!") instead of accepting gradient dissolution.  

  ---

  ### **Predicted Outcomes**  
  - **First-Run Failure Mode:** Participants will resist categorical dissolution (e.g., "It’s functionally identical, so it must be copycat!") due to cognitive dissonance.  
  - **Learning Insight:** Highlights how domain pressures (time, scoring) distort feature weighting in conceptual boundaries, mirroring real-world technical microdomains.  

  ---  
  **Final Note:** This exercise isolates gradient-driven slippage but omits creative analogy; it is a tool for observing pressure-induced restructuring, not generative conceptual fluidity.
