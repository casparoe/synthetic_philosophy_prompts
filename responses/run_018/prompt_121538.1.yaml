prompt: |-
  hey im building a dataset on collapse narratives and i want you to rank four things by how genuinely collapsed they are, but using this weird three-axis frame i cooked up: structual amnesia (did institutions forget how to reproduce themselves?), material decoupling (did the economy actually shrink or just reroute into smaller nodes?), and narrative rupture (do later populations treat it as a definitive ending?). apply it to: the late bronze age crash in the eastern mediterranean, the classic maya lowland abandonment, easter island's ecological story, and the thesis that societies never really collapse they just change shape. rate each 0-3 on all three axes, then give me an overall tier list from most collapsed to least collapsed with one sentence per item. also flag which axis is the shakiest fit for each case. dont worry about citations, just reason it through.
reasoning: |-
  Okay, the user is building a dataset on collapse narratives and wants me to rank four historical scenarios using their custom three-axis framework. They've defined three criteria: structural amnesia (institutions forgetting how to reproduce themselves), material decoupling (economic shrinkage vs rerouting), and narrative rupture (later populations treating it as an ending). The four cases are: Late Bronze Age collapse, Classic Maya lowland abandonment, Easter Island's ecological story, and the "societies never collapse" thesis.

  Hmm, this is an interesting challenge. The user seems to be developing a nuanced way to analyze collapse beyond simple binary definitions. They're probably an academic or researcher working on comparative civilizational studies. The "weird three-axis frame" suggests they want to move beyond oversimplified collapse narratives - maybe frustrated with how these events get flattened in popular discourse. Their deeper need might be testing this framework's robustness across diverse cases.

  Let me break this down case by case. First, the Late Bronze Age collapse: palaces burned, writing disappeared, trade networks shattered. That's strong structural amnesia - Linear B script and palace economies vanished completely. Material decoupling was severe - Mediterranean trade volumes plummeted. Narrative rupture is clear in Greek Dark Age legends. Solid collapse credentials.

  Then Classic Maya: Cities abandoned but knowledge persisted in Postclassic centers. So less structural amnesia - calendars and rituals continued. Material decoupling was regional (lowlands emptied) but not system-wide. Narrative rupture? Later Maya didn't see it as an "end" - more like relocation. Partial collapse.

  Easter Island is tricky. Total deforestation and population crash, but oral traditions preserved some institutional memory. Material decoupling was absolute - no more megaliths, smaller-scale survival. Narrative rupture? The Rapa Nui definitely remember it as catastrophic. High collapse but with cultural continuity.

  The "never collapse" thesis is meta - it's arguing against the framework itself! No amnesia or rupture by definition, just transformation. Material decoupling gets messy - depends how you define "economy." This one will rank lowest but challenges the whole exercise.

  For scoring: Bronze Age gets 3s across board. Maya might be 1-2-1. Easter Island 2-3-3. The thesis 0-0-0 or N/A. Tier list should put Bronze Age first, then Easter Island, then Maya, with the thesis last as anti-collapse. 

  Shakiest axes: Maya's narrative rupture is weakest (continuity in Yucatán). Easter Island's structural amnesia is debatable since some traditions survived. Bronze Age is solid but material decoupling could be contested by archaeologists showing slower decline. The thesis makes material decoupling irrelevant.

  User's framework holds up well - it exposes how "collapse" means different things in different contexts. Might suggest adding a fourth axis about demographic scale later, but for now this meets their request.
answer: |-
  Here's your collapse assessment using your custom framework, with ratings (0-3 per axis), tier list, and shakiest axis flagged for each:

  ---

  ### **Ratings & Analysis**
  *(Scale: 0 = None/Minimal, 1 = Partial, 2 = Significant, 3 = Extreme)*

  1. **Late Bronze Age Collapse (Eastern Mediterranean)**  
     - Structural Amnesia: **3** (Palace economies, writing systems, & trade protocols vanished; centuries-long "dark age").  
     - Material Decoupling: **3** (Trade networks imploded, cities abandoned, GDP-equivalent plummeted >50%).  
     - Narrative Rupture: **3** (Greek "Dark Age" myths, Egyptian records of "Sea Peoples" as apocalyptic).  
     *Shakiest Axis:* **Material Decoupling** (Some regions like Egypt partially recovered, but system-wide rupture was severe).  

  2. **Classic Maya Lowland Abandonment**  
     - Structural Amnesia: **1** (Elite/ceremonial institutions collapsed, but calendrics, agriculture, & language persisted in Postclassic hubs).  
     - Material Decoupling: **2** (Lowland urban economy disintegrated; population shifted to coasts/Yucatán with reorganized trade).  
     - Narrative Rupture: **1** (No "end" in Maya cosmology; Postclassic cities referenced former glory as ancestral, not terminated).  
     *Shakiest Axis:* **Narrative Rupture** (Continuity in northern cities & cultural revival weakens "ending" framing).  

  3. **Easter Island (Rapa Nui) Ecological Story**  
     - Structural Amnesia: **2** (Megalithic society & moai production ceased; oral history preserved fragments of knowledge).  
     - Material Decoupling: **3** (Population crash >90%, irreversible deforestation, subsistence scaled to village-level).  
     - Narrative Rupture: **3** (Huri Moai/"overturning" era marks definitive collapse in oral traditions; European contact confirmed rupture).  
     *Shakiest Axis:* **Structural Amnesia** (Birdman cult & kinship structures adapted post-collapse, preserving some institutions).  

  4. **"Societies Never Collapse" Thesis (e.g., Tainter critique)**  
     - Structural Amnesia: **0** (Assumes institutional knowledge always transforms or relocates).  
     - Material Decoupling: **0** (Views decline as reallocation, not net loss).  
     - Narrative Rupture: **0** (Rejects "collapse" as Eurocentric myth; emphasizes continuity).  
     *Shakiest Axis:* **Material Decoupling** (Ignores regional abandonment & irrecoverable complexity loss in cases like Bronze Age).

  ---

  ### **Tier List: Most to Least Collapsed**  
  1. **Late Bronze Age Collapse**  
     *Catastrophic rupture across all axes: forgotten institutions, shattered trade, and enduring "apocalypse" narratives.*  
  2. **Easter Island**  
     *Near-total material & ecological decoupling with cultural memory of rupture, despite some knowledge retention.*  
  3. **Classic Maya Lowlands**  
     *Regionally catastrophic but systemically adaptive: institutions regrouped, narratives avoided "end" tropes.*  
  4. **"Never Collapse" Thesis**  
     *A counter-narrative that dissolves collapse into transformation by rejecting all three axes.*

  ---

  ### Key Insights:
  - **Strongest Collapse Signal**: Late Bronze Age scores 3/3/3 – a true "hard collapse" benchmark.  
  - **Weakest Collapse Case**: The "never collapse" thesis inherently denies your framework (0/0/0).  
  - **Framework Tension**: Structural Amnesia vs. Narrative Rupture often conflict (e.g., Maya continuity weakens rupture; Easter Island’s oral history preserves memory *as* rupture).  
  - **Material Decoupling** was the most contested axis – all cases showed evidence of economic reconfiguration rather than pure erasure.  

  This framework brilliantly exposes *how* collapse is defined: Bronze Age epitomizes institutional forgetting, Easter Island material fragility, Maya narrative resilience, and the thesis ideological resistance. Use it to map "collapse" as a spectrum, not a binary.
