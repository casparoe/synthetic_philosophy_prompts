answer: |-
  ### Step-by-Step Evaluation Procedure for Strategy-Proofness

  This procedure evaluates whether a mechanism is **strategy-proof** (no voter can gain by misreporting preferences) and **non-dictatorial** (no fixed voter always dictates the outcome) under the given constraints:  
  - ≥3 alternatives (projects).  
  - Voters submit **partial rankings with ties** (weak orders, abstentions allowed).  
  - **Unrestricted domain** (all transitive weak orders permitted).  
  - **Non-dictatorial** (no fixed voter always wins).  

  The procedure is based on the Gibbard-Satterthwaite theorem and its extensions, which imply that for ≥3 alternatives, unrestricted domain, and resoluteness (always selecting one winner), **only dictatorships are strategy-proof**. Weak orders complicate this, but key corollaries hold.  

  #### Ordered Questions and Decision Flow
  1. **Is the mechanism a fixed dictatorship?**  
     - *Definition*: A single voter exists such that if they report a strict top choice, it wins regardless of others.  
     - **Sufficient answer**:  
       - **Yes** → Reject (fails non-dictatorial).  
       - **No** → Proceed to Q2.  

  2. **Is the mechanism deterministic?**  
     - *Definition*: The winner is always uniquely determined (no randomness).  
     - **Sufficient answer**:  
       - **Yes** → Proceed to Q3.  
       - **No** → Skip to Q6 (for randomized mechanisms).  

  3. **Is the mechanism onto?**  
     - *Definition*: Every alternative can win under some valid preference profile.  
     - **Sufficient answer**:  
       - **Yes** → Proceed to Q4.  
       - **No** → Refer to human judgment (strategy-proofness undecidable by checklist).  

  4. **Is the mechanism resolute?**  
     - *Definition*: Always selects exactly one winner.  
     - **Sufficient answer**:  
       - **Yes** → Conclude **not strategy-proof** (reject).  
       - **No** → Refer to human judgment (strategy-proofness undecidable by checklist).  

     *Rationale for Q3–Q4*: Gibbard’s extension (1977) shows that for deterministic, resolute, onto mechanisms with unrestricted weak orders and ≥3 alternatives, strategy-proofness implies fixed dictatorship. Since Q1 rules this out, the mechanism is **guaranteed manipulable**.  

  5. **For deterministic mechanisms failing resoluteness/onto**:  
     - **Stopping rule**: Refer to human judgment.  
     - *False-negative risk*: Low (theorem guarantees manipulability if resolute/onto), but unresolute/non-onto cases are rare and complex.  

  6. **For randomized mechanisms: Is it random dictatorship?**  
     - *Definition*: A voter is randomly selected (via fixed probabilities), and their top strict choice wins (ties broken by a fixed rule).  
     - **Sufficient answer**:  
       - **Yes** → Flag ethical concerns, but **strategy-proof** (proceed to Q7).  
       - **No** → Refer to human judgment.  

  7. **Per-profile dictatorship check (ethical review)**:  
     - *Definition*: Does any voter (or known rule) unilaterally dictate the outcome for any profile?  
     - **Sufficient answer**:  
       - **Yes** → Flag as ethically/politically unacceptable.  
       - **No** → No additional flags.  
     - *Applies to all mechanisms*, including those passing strategy-proofness.  

  **Stopping Rules Summary**:  
  - **Reject**: Fails Q1 (fixed dictatorship) or Q3–Q4 (deterministic/resolute/onto and non-dictatorial).  
  - **Refer to human judgment**:  
    - Randomized and not random dictatorship (Q6).  
    - Deterministic but not resolute or not onto (Q3–Q4).  
  - **Ethical flag**: Per-profile dictatorship (Q7), even if strategy-proof.  

  **Class of undecidable mechanisms**: Randomized (non-random-dictatorship) or deterministic (non-resolute/non-onto). These require formal proof.  
  **False-negative risk**: Near-zero in deterministic/resolute/onto cases (theorem-backed). Higher in randomized/non-onto cases due to undecidability.  

  ---

  ### Application to Proposed Mechanisms

  #### **Mechanism A: Pairwise majority with Borda fallback**  
  - Voters submit partial rankings; pairwise Condorcet winner wins; else, Borda count (abstentions = 0).  
  - **Procedure application**:  
    1. **Q1**: Not fixed dictatorship (no single voter always wins). → Proceed.  
    2. **Q2**: Deterministic. → Proceed to Q3.  
    3. **Q3**: Onto (any project can win: e.g., if unanimous, or Borda favors it). → Proceed to Q4.  
    4. **Q4**: Resolute (always selects one winner). → **Reject (not strategy-proof)**.  
  - **Board decision**: Reject. Known to be manipulable (e.g., voters misreport to create cycles, then manipulate Borda).  

  #### **Mechanism B: Rotating dictatorship with transparency**  
  - Each quarter, a predetermined lab is dictator; others submit partial rankings; dictator’s strict order breaks ties.  
  - **Procedure application**:  
    1. **Q1**: Not fixed dictatorship (dictator rotates quarterly; no single voter always wins). → Proceed.  
    2. **Q2**: Deterministic. → Proceed to Q3.  
    3. **Q3**: Onto (dictator can choose any project). → Proceed to Q4.  
    4. **Q4**: Resolute. → **Reject (not strategy-proof)**.  
  - **Board decision**: Reject.  
    - **Technical note**: While strategy-proof *for the dictator* (their truthfulness ensures their top choice wins), non-dictators can manipulate by causing ties the dictator breaks unfavorably (e.g., Lab 1 prefers A > B; Lab 2 (dictator) prefers B; Lab 1 abstains between A and B, making B win instead of A).  
    - **Ethical flag (Q7)**: Per-profile dictatorship (each quarter, the designated dictator unilaterally decides). Board may find this unacceptable despite technical rejection.  

  #### **Mechanism C: Humble aggregation**  
  - Voters submit partial orders; winner is top project in the intersection of all strict preferences; else, random selection from top cycle.  
  - **Procedure application**:  
    1. **Q1**: Not fixed dictatorship (no single voter controls outcome). → Proceed.  
    2. **Q2**: Randomized (random selection if no intersection winner). → Proceed to Q6.  
    3. **Q6**: Not random dictatorship (no voter is randomly selected; outcome depends on set intersection). → **Refer to human judgment**.  
    4. **Q7**: No per-profile dictatorship (no voter unilaterally forces a win; randomness dilutes control).  
  - **Board decision**: Refer to human judgment.  
    - **Manipulability risk**: Voters can withhold preferences to shrink the intersection (e.g., by not reporting A > B, they exclude A from the top cycle, altering randomization).  
    - **Limitation**: Undecidable by checklist (randomized, non-random-dictatorship).  

  ---

  ### Limitations of the Procedure  
  1. **Formal proof required for**:  
     - Randomized mechanisms not equivalent to random dictatorship.  
     - Deterministic mechanisms failing resoluteness or onto properties.  
  2. **False-negative risks**:  
     - Low in deterministic/resolute/onto cases (theorem-backed).  
     - Higher in randomized/non-onto cases due to undecidability (e.g., humble aggregation).  
  3. **Cannot assess**:  
     - Pareto efficiency or fairness.  
     - Stability under coalitions.  
     - Context-specific incentives (e.g., lab reputations).  

  \answer{Human judgment is irreducible for mechanisms outside the Gibbard extension’s scope—randomized non-random-dictatorships and deterministic non-resolute/non-onto cases.}
