answer: |-
  ## Philosophy 495: Advanced Ethics - Final Exam Essay Question

  **Time Allowed:** 90 Minutes

  **Prompt:**

  Consider the "Asymptotic Obligation Thesis" (AOT). This thesis proposes that an agent's moral obligations, in contexts involving potentially vast or continuous scales of need (e.g., global poverty, existential risk, distant suffering), are modeled asymptotically. Specifically, as an agent's available resources (R) or situational proximity/probability of impact (P) varies continuously (e.g., R increases from $0 to $M; P increases from infinitesimal to near-certain), the *demanded sacrifice* (D) approaches but never actually reaches a finite, identifiable ceiling (C). Formally: D = f(R,P) such that Lim_{R→∞ or P→1} D(R,P) = C, where C is finite, but D(R,P) < C for all finite R or P < 1.

  Proponents argue AOT resolves the apparent paradox between recognizing morally significant reasons of potentially infinite scope (e.g., preventing any suffering, saving any life) and the finite capacities of agents. It seemingly avoids the incoherence of demanding the impossible (infinite sacrifice) while preventing obligations from collapsing to zero under finitude, maintaining significant demands short of the asymptote.

  Critics contend that while AOT avoids demanding the *logically* impossible (infinite sacrifice), it merely relocates the core tension. They argue it generates an "infinite regress of residual duties": for any level of sacrifice D_i < C made by the agent, there remains a non-zero residual obligation (C - D_i) demanding further action, which, while finite, perpetually exceeds the agent's *practical* capacity to fulfill completely within finite time/energy, leading to a paralyzing sense of perpetual insufficiency.

  **Your Task:** Does the Asymptotic Obligation Thesis successfully resolve the tension between unlimited moral reasons and finite agency, or does it inevitably succumb to the "infinite regress of residual duties" objection, thereby failing to avert practical paralysis? Defend your position with conceptual precision, directly engaging the AOT framing and its implications. Do not rely on summarizing the standard over-demandingness objection or familiar rescue scenarios; focus your analysis on the specific structure of asymptotic demands and the regress argument.

  ---

  ## Model Answer (Approx. 810 words)

  The Asymptotic Obligation Thesis (AOT) presents an elegant mathematical metaphor for constraining potentially limitless moral demands within the bounds of finite agency. By proposing that obligations approach, but never reach, a finite ceiling (C) as resources (R) or proximity (P) increase, it promises to avoid the incoherence of demanding infinite sacrifice while preserving the intuition that obligations remain substantial even under finitude. However, upon closer examination, AOT fails to resolve the fundamental tension between unlimited reasons and finite agents. While it avoids *logical* incoherence, it succumbs to the "infinite regress of residual duties," effectively relocating the paradox into the domain of practical rationality and psychological burden, leading inevitably towards practical paralysis rather than away from it.

  AOT's initial appeal lies in its avoidance of the impossible. Demanding infinite sacrifice from a finite agent is nonsensical; it asks for what cannot be given, rendering morality self-defeating. AOT circumvents this by defining a limit C – perhaps interpreted as total self-sacrifice (e.g., donating all disposable income beyond subsistence) or maximal risk acceptance (e.g., volunteering for near-certain lethal missions). For any finite R or P < 1, the demand D is *less* than C. The agent is never *required* to do the logically impossible. Furthermore, AOT captures the intuition that acquiring more resources or facing a more probable harm *increases* obligation without ever demanding the agent vanish entirely (D = C). It seems to offer a continuous, scalable ethics.

  The critical flaw emerges when we consider the *nature* of the demand at any point *before* the asymptote. At any finite stage of resource possession (R_i) or proximity (P_i), the obligation is D_i = f(R_i, P_i) < C. Crucially, the residual obligation (C - D_i) is *non-zero* and *morally significant* under AOT's own logic. The reasons generating the asymptotic curve – the moral significance of preventing suffering or saving lives – persist undiminished. If saving one more life with marginal resources is morally compelling at lower R, why does the *same* marginal utility, applied to the residual (C - D_i), cease to generate a demand? AOT posits a function where D increases towards C, implying that the reasons driving the demand remain active and compelling right up to the asymptote. Therefore, fulfilling D_i does not discharge the obligation; it merely satisfies the demand *at that specific point* on the curve. The agent now faces the residual demand relative to their *new* state (having expended resources/time/effort to meet D_i).

  This generates the regress. Suppose an agent sacrifices D_i (e.g., donates 30% of their income). According to AOT, their obligation is now recalculated based on their remaining resources (R_j = R_i - resources equivalent to D_i) and is D_j = f(R_j, P) < C, yet likely greater than zero. D_j is the new immediate demand, but the *total* obligation path still points towards C. Meeting D_j (e.g., donating another 10%) leaves a *further* residual (C - cumulative sacrifice) and a new recalculated demand D_k = f(R_k, P). This process iterates infinitely. While each individual demand D_n is finite and theoretically fulfillable, the *sequence* of demands is infinite. Crucially, the moral *reasons* for each incremental demand persist; the suffering not alleviated by stopping at cumulative sacrifice S < C remains a morally compelling reason to do more.

  It is here that practical paralysis sets in. Finite agents operate within bounded time, energy, attention, and psychological capacity. An infinite sequence of non-zero demands, each backed by persistent moral reasons, means the agent can *never* reach a state of having fulfilled their obligation. They are perpetually "behind," always leaving morally significant needs unmet despite significant sacrifice. This perpetual insufficiency is not merely a psychological quirk; it is structurally mandated by AOT combined with the persistence of the underlying moral reasons. The agent faces a Sisyphean task: rolling the boulder of sacrifice up the hill only to see it roll back down as the residual duty reappears in a new form. While no single step is impossible, the endlessness of the sequence renders the *project* of moral fulfillment practically impossible and existentially overwhelming. The demand asymptote C, intended as a limiting ceiling, functions instead as a horizon that perpetually recedes as the agent approaches it.

  Proponents might argue that the residual becomes negligible or that agents can permissibly "round down" at some point. However, this undermines AOT's core claim. If the residual can be ignored, why posit an asymptote at all? Why not allow obligations to plateau at a lower, practically achievable level? AOT's strength was its grounding in the *continuous* force of moral reasons; introducing an arbitrary cutoff where the residual suddenly becomes negligible contradicts this continuity and the initial moral gravity driving the asymptotic curve. The reasons demanding sacrifice towards C do not diminish; they are merely being artificially truncated.

  Therefore, while AOT successfully replaces logical incoherence with mathematical coherence, it fails to resolve the practical and existential tension inherent in applying unbounded moral reasons to bounded agents. It trades the impossibility of an infinite jump for the impossibility of completing an infinite series of finite jumps, each mandated by the same unyielding moral logic. The "infinite regress of residual duties" is not a side effect but the inevitable consequence of trying to bound the unbounded asymptotically. The paradox is not resolved; it is transformed into a perpetual engine of moral insufficiency, ensuring that for the finite agent striving under AOT, practical paralysis – the feeling that no action is ever enough and further action is always demanded – is the inescapable outcome. AOT relocates the paradox from the realm of possibility to the realm of finitude itself.

  ---

  ## Marking Scheme (Total: 20 Marks)

  This scheme prioritizes engagement with the *specific* Asymptotic Obligation Thesis (AOT) framing and the regress argument. Generic summaries of demandingness objections should score poorly.

  1.  **Accurate Explanation of AOT & Asymptotic Concept (4 Marks):**
      *   *Must-hit:* Clearly defines AOT, explaining the asymptotic relationship (D approaching C as R/P vary continuously, D < C for finite R/P<1), identifies the finite ceiling (C), and states its proposed benefit (avoiding infinite demand/incoherence while maintaining significant obligations).
      *   *Common Failure (1 Line):* Vague or incorrect description of AOT (e.g., confusing it with diminishing returns or simple thresholds); failing to mention the limit never being reached (D < C).

  2.  **Identification of Core Tension & Regress Objection (4 Marks):**
      *   *Must-hit:* Precisely articulates the tension AOT aims to solve (unlimited moral reasons vs. finite agency) AND accurately describes the "infinite regress of residual duties" objection (residual (C - D_i) persists as morally significant demand after fulfilling D_i, leading to an infinite sequence of finite demands).
      *   *Common Failure (1 Line):* Reverting to the generic over-demandingness objection (e.g., "consequentialism demands too much") without linking it specifically to AOT's structure and the regress; misstating the regress argument.

  3.  **Assessment of AOT's Claim to Resolve Tension (4 Marks):**
      *   *Must-hit:* Evaluates whether AOT *successfully* avoids logical incoherence (demanding the impossible) AND assesses whether it *successfully* prevents obligations from collapsing to zero under finitude.
      *   *Common Failure (1 Line):* Conflating avoiding logical impossibility with resolving practical paralysis; asserting collapse to zero occurs under AOT without justification.

  4.  **Critical Evaluation of Regress & Practical Paralysis (4 Marks):**
      *   *Must-hit:* Analyzes *why* the regress arises specifically from AOT's structure + persistent moral reasons; argues convincingly whether this regress leads to practical paralysis (perpetual insufficiency, Sisyphean task) for finite agents, considering time/energy/psychology.
      *   *Common Failure (1 Line):* Dismissing the regress as irrelevant or psychologically manageable without argument; failing to connect the regress structurally to AOT and finite agency.

  5.  **Critical Engagement with Asymptotic Framing & Overall Position (4 Marks):**
      *   *Must-hit:* Takes a clear, defensible stance on the question (resolves/relocates/fails) directly based on points 1-4; engages deeply with the *metaphor* of asymptotes (limits, continuity, residuals) to support the position; avoids reliance on standard demandingness literature/scenarios.
      *   *Common Failure (1 Line):* Reverting to generic demandingness discussion; position not clearly stated or defended using AOT specifics; superficial treatment of the asymptotic concept.
