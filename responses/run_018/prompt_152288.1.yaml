answer: |-
  ### Frequently Asked Questions: Bureau of Analogical Governance  
  **Issued: 10/23/2023 | Revision 7.1a**  

  1. **What is the Bureau’s primary regulatory mandate?**  
     The Bureau of Analogical Governance (BAG) ensures all cognitive operations adhere to the National Analogical Consistency Act (NACA). Under NACA, cognition is defined as the systematic projection of source-domain essences onto target-domain surfaces. The Bureau licenses, audits, and enforces analogical mappings to prevent conceptual destabilization. Unlicensed analogies constitute felony slippage under Section 12(c) of NACA.  

  2. **How do citizens apply for an Analogical Permit?**  
     Permits are tiered under the Conceptual Citizenship licensing system (CCL). Citizens must submit Form AG-7 ("Essence Projection Application") to their regional BAG office, detailing the source/target domains, structural alignment depth, and projected essence yield. Tier 1 (Basic) permits cover routine categorization (e.g., "clouds as pillows"); Tier 2 (Intermediate) permits abstract mappings (e.g., "democracy as a marketplace"); Tier 3 (Advanced) permits allow high-risk scientific or mathematical projections. All applications undergo a 30-day Structural Equivalence Review. Processing fees range from $45 (Tier 1) to $1,200 (Tier 3).  

  3. **What penalties apply if an analogy fails audit?**  
     Audits verify compliance with NACA’s "20% Essence Congruence Threshold." First-offense slippage (e.g., mapping "viruses to computer malware" without antimicrobial properties) incurs fines ($500–$5,000) and mandatory Analogical Remediation Training. Repeat violations trigger license demotion or revocation. Gross negligence (e.g., asserting "trees are bureaucracies" with no branch-to-department alignment) may result in cognitive probation (72-hour moratorium on novel analogies).  

  4. **Is non-analogical cognition legally permissible?**  
     No. NACA §3(b) classifies non-analogical thought ("literalism") as a threat to conceptual integrity. Exemptions exist only for primitive sensory processing (e.g., retinal input) or BAG-preapproved operations. Unlicensed literalism, such as deducing "2 + 2 = 4" without projecting "apples to integers," violates Essence Disclosure requirements. Offenders face Essence Disclosure Taxes (EDT): 2% of annual income per violation.  

  5. **How does BAG distinguish valid structural mapping from surface error?**  
     Analogy Auditors use the Relational Isoform Matrix (RIM), a proprietary algorithm scoring source-target alignment on 12 dimensions (e.g., causal depth, attribute transfer fidelity). Surface errors (e.g., "cats are pianos because both have keys") fail RIM by prioritizing perceptual features (whiskers/keys) over essence (autonomy/resonance). Valid mappings require RIM scores ≥80/100. Appeals may petition for secondary review via the Cross-Domain Essence Tribunal.  

  6. **What is the appeals process for revoked conceptual licenses?**  
     Licensees may file Form AG-14 ("Appeal of Essence Licensing Sanction") within 30 days of revocation. The Bureau’s Internal Review Panel re-audits the disputed analogy using archived RIM data. If upheld, appellants can request a Tier 3 Arbitration Hearing, where they must present five counter-analogies demonstrating "rehabilitative structural rigor." Successful appeals typically require 6–8 months and a $850 reinstatement fee.  

  7. **Why must mathematical reasoning undergo Analogy Audits?**  
     Mathematics relies entirely on analogical projection (e.g., "numbers as spatial distances"). Unaudited operations risk systemic slippage, such as misprojecting "fractions to time" without temporal essence validation. All proofs submitted for academic or commercial use must include a BAG-stamped Analogical Compliance Certificate (ACC). ACC fees fund the National Essence Repository.  

