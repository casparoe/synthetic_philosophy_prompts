prompt: |-
  hey so im not a scholar, just meditate and overthink. can you take standard consequentialism — maximize total wellbeing, weigh everyones suffering and happiness equally, choose actions by predicted outcomes — and restate it all in buddhist terms? like karma, cetana, the five precepts, merit, rebirth, upaya. tell me what maps clean, what gets distorted, and what has no place at all in that language. i also think karma might work like compound interest over lives, so even tiny acts now have huge payoff later — does that idea fit, or does buddhist ethics reject that kind of longterm calculus? and say whether the leftover bits mean buddhism is missing something, or if they just show consequentialism was never that clear. one paragraph max, 220 words, no citations.
reasoning: |-
  Hmm, the user wants me to reinterpret consequentialism through Buddhist concepts. They're not a scholar but someone who meditates and overthinks, so I need to keep it accessible and engaging. The core of consequentialism is about maximizing total wellbeing by weighing everyone's happiness and suffering equally and choosing actions based on predicted outcomes. Now, I have to map this to Buddhist terms like karma, cetana, precepts, merit, rebirth, and upaya.

  First, karma is key—it's about intentional actions (cetana) and their consequences, which aligns with consequentialism's focus on outcomes. Cetana as intention can map to the idea of choosing actions based on expected results. Merit, in Buddhism, is accumulated through good deeds and could be seen as analogous to maximizing positive wellbeing, especially if we think of it leading to better rebirths. The five precepts, which are ethical guidelines, might correspond to rules that generally promote wellbeing, but they're more about avoiding harm than calculating outcomes, so there's a slight distortion.

  Rebirth adds a long-term dimension—karma compounds over lives, which fits the user's idea of compound interest, even for tiny acts. This long-term calculus is embraced in Buddhism through cycles of rebirth. Upaya, or skillful means, is about flexible strategies to help others, similar to consequentialism's outcome-based choices.

  However, some parts don't map cleanly. Buddhist ethics emphasize non-attachment and reducing suffering by eliminating craving, which isn't directly in consequentialism. Consequentialism might focus on net happiness without addressing the root causes of suffering. Also, the strict equality in weighing wellbeing could clash with Buddhist ideas of compassion for all beings, including oneself, which might not always be utilitarian.

  The leftover bits suggest that consequentialism might oversimplify ethics by ignoring inner states and intentions beyond outcomes. Buddhism brings in personal transformation and liberation, which consequentialism lacks. So, in answering, I'll confirm that the compound interest idea fits with rebirth, point out the alignments and distortions, and conclude that the differences highlight how consequentialism isn't as nuanced as Buddhist ethics. I need to keep it concise—one paragraph, under 220 words, no citations—and make it flow naturally.
answer: |-
  Consequentialism's wellbeing focus maps partially to Buddhist ethics through karma (intentional actions shaping future experiences) and merit (positive karmic seeds cultivated by wholesome cetana/intention). The five precepts align as baseline harm-minimization rules promoting collective welfare. Upaya (skillful means) mirrors consequentialism's flexible outcome-oriented action. However, distortions arise: Buddhism prioritizes reducing *dukkha* (suffering/stress rooted in craving/ignorance), not maximizing net "happiness," viewing sensual pleasure as impermanent and potentially binding. The compound interest view of karma over rebirths fits Buddhist doctrine – small skillful acts *can* yield vast future benefits. Yet, Buddhism ultimately rejects consequentialism's *exclusive* focus on external outcomes. Intentionality (cetana) is paramount, and the goal transcends cyclical wellbeing within samsara (rebirth) towards liberation (Nirvana), where karmic calculus ceases. The "leftover bits" – Nirvana, non-attachment, and the critique of craving as suffering's cause – reveal consequentialism's limitation in addressing the *roots* of suffering and the path to lasting freedom, not just symptom management. Consequentialism misses Buddhism's soteriological depth.

  (219 words)
