answer: |-
  ### Seminar Plan: Judgment Aggregation and the Discursive Dilemma

  #### **Dependency Sequence**  
  1. **Premise-Conclusion Distinction**: Establish that the conclusion is a *logical function* of the premises (e.g., approval requires A ∧ B ∧ C). Without this, the dilemma lacks logical structure.  
  2. **Consistency Requirement**: Emphasize that individually consistent judgments can lead to a *collectively inconsistent* outcome when aggregated independently. This prevents misdiagnosis as mere "group disagreement."  
  3. **Rationality Failure**: After displaying the paradox, frame the inconsistency as a violation of *collective rationality* (the group simultaneously affirms premises and denies their logical consequence), not a procedural flaw.  

  ---

  #### **Carrying Case: Urban Wetland Development**  
  - **Scenario**:  
    A 3-person committee must approve/deny a wetland project. Approval requires:  
    - A: "No serious ecological risk"  
    - B: "Full legal compliance"  
    - C: "Economic necessity"  
    Conclusion D: "Approve project" (D iff A ∧ B ∧ C).  
  - **Required Properties**:  
    - Interdependent premises (D’s truth depends logically on A, B, C).  
    - Transparent connection (D = A ∧ B ∧ C is explicit).  
    - Binary judgments (each member votes yes/no on A, B, C, D).  
  - **Excluded Elements**:  
    - No chairperson (pure majority voting).  
    - No probabilistic judgments (only binary true/false).  
    - No strategic voting (sincere judgments).  
  - **Why Avoid Jury Trials**:  
    Legal concepts (e.g., causation) invite metaphysical tangents; the wetland case is neutral, avoids loaded terminology, and clarifies the purely logical conflict.  

  ---

  #### **Misconception Trajectory**  
  1. **Misconception**: "Weighted/supermajority voting resolves it."  
     - **Intervention Point**: After introducing the paradox but before discussing solutions.  
     - **Countermove**: "Any independent premise aggregation (even supermajority) can produce inconsistency if the logical connection is violated."  
  2. **Misconception**: "The problem vanishes with non-binary judgments."  
     - **Intervention Point**: When contrasting binary vs. continuous frameworks.  
     - **Countermove**: "Degrees of belief reintroduce the dilemma as probabilistic incoherence (e.g., collective credences violating the conjunction rule)."  
  3. **Misconception**: "This justifies expert/authoritarian overrides."  
     - **Intervention Point**: During implications discussion.  
     - **Countermove**: "The dilemma targets rationality, not legitimacy; it questions whether *any* aggregation method can preserve consistency, not whether democracy is flawed."  

  ---

  #### **Understanding Check**  
  - **Scenario**:  
    A 3-person committee evaluates a policy requiring:  
    - P: "Increases public safety"  
    - Q: "Reduces inequality"  
    - R: "Adopt policy" (R iff P ∧ Q).  
    **Judgments**:  
    - Member 1: P true, Q true, R true.  
    - Member 2: P true, Q false, R false.  
    - Member 3: P true, Q false, R false.  
    **Aggregate**: P true (unanimous), Q false (majority), R false (majority).  
  - **Diagnostic Criterion**:  
    The collective set {P true, Q false, R false} is *consistent* (R false follows from Q false). Students must recognize that the dilemma **only arises when collective judgments are inconsistent**—here, rationality is intact, so it’s not a true dilemma.  

  ---

  #### **Omitted Scope**  
  - Formal taxonomy of aggregation rules (e.g., quota rules, premise-based vs. conclusion-based).  
  - General impossibility theorems for n>3 voters.  
  - Lattice-theoretic or algebraic proofs.  

  ---

