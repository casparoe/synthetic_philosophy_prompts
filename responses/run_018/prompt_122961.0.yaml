prompt: |-
  Hey — I'm a journalist doing a piece on how totally arbitrary rules end up locked in, and I want to interview you for it. Please play David Lewis in 1969, right after *Convention* came out: conventions are arbitrary solutions to recurring coordination problems, held in place by common knowledge that everyone conforms and expects everyone else to, with salience (Schelling's idea) or precedent doing the work of picking out one of several equally good equilibria. Stay in character until I say stop, keep it to a couple of paragraphs a turn, answer in American English, and keep it concrete — no equations, I'm no philospher.

  Here's the case I keep getting stuck on. Two neighboring villages, same language, same terrain, same everything, and the same coordination problem about which side of the path to keep to. North keeps left, South keeps right, and the only difference anyone can find is that the first footpath in North got worn on the left and in South on the right. Halfway through my reporting the district council bulldozes both paths and reseeds the ground, so the asymmetry is gone — and the habits survive untouched for a whole generation, with newcomers just copying whatever the locals do. Meanwhile a third village in the same valley, flat ground, no path to begin with, never settles at all: carts keep meeting head-on for years.

  So two things. If the habit outlives the thing that supposedly made it salient, was salience ever doing any real work, or is it just a story about how it got started? And if your account can explain left, right, and permanent deadlock all at once, what would it take for it to be wrong? One rule: when I ask what made that first footpath salient, you don't get to hand me another convention — I'll just ask the same question again about that one.
reasoning: |-
  Okay, the user wants me to role-play as David Lewis in 1969 after publishing "Convention." They're a journalist writing about arbitrary rules becoming fixed. The key points from Lewis's work are that conventions solve coordination problems through common knowledge, with salience or precedent selecting among equilibria. The journalist presents a case study with three villages to challenge this.

  The journalist describes two villages with opposite path-side preferences (left vs. right) that persist even after the original worn paths are destroyed. A third village fails to establish any convention. The journalist questions whether salience truly matters if habits outlast the initial asymmetry, and asks how the theory could be falsified.

  Hmm, the core tension here is about the role of initial salience versus ongoing reinforcement. For the first two villages, the persistence makes sense through Lewis's lens - the initial asymmetry created a precedent that became self-sustaining through expectation and conformity. The third village shows what happens without any focal point to kickstart coordination.

  The journalist's "gotcha" about infinite regress of salience is sharp. I need to avoid circular reasoning by grounding salience in non-conventional factors. For the path example, terrain features or accidents could serve as genuine starting points.

  For falsification, the theory would collapse if conventions formed without any asymmetry, or if multiple equilibria persisted despite common knowledge. The journalist seems skeptical about whether salience does real work beyond historical accident.

  I should emphasize that salience isn't magical - it's whatever breaks symmetry in that moment. The real work happens through the feedback loop of expectations. Also worth noting that in the third village, deadlock persists precisely because no salient point emerged to coordinate expectations.

  The key is distinguishing between convention formation (needs salience) and maintenance (runs on expectations). The villages show both sides beautifully.
answer: |-
  *(Leans forward, tapping the cover of "Convention" with a thoughtful frown)* Ah, your villages perfectly illustrate the core mechanism – and its limitations. Let's break it down.

  First, North and South: the initial path wear *was* salient – a Schelling point visible to all, solving the initial "which side?" problem purely by its conspicuous asymmetry. Crucially, *after* the council bulldozes it, salience isn't the active force anymore. The *precedent* it established takes over. Everyone *remembers* the old rule, knows others remember it, expects others to expect them to follow it, and so on. Newcomers see the dominant behavior and conform; the expectation network sustains the convention purely on its own inertia. The worn path *was* essential to *start* the convention, but once the web of mutual expectations is woven, it becomes self-reinforcing. The salience did the initial heavy lifting of selection; the common knowledge maintains it.

  Now, your third village? Deadlock persists precisely *because* there was *no* initial salient asymmetry on that flat ground – no worn path, no landmark, no obvious Schelling point to break the symmetry. Every encounter is a fresh coordination problem with no guiding precedent. Without that initial focal point to anchor expectations, no stable convention can gel. People keep guessing, hoping to match, but with no consistent signal, they fail.

  As for falsification? My account hinges on conventions being *arbitrary* solutions sustained by *expectations*. It would be wrong if:
  1.  **Stable coordination emerged without *any* initial asymmetry:** If your third village spontaneously settled on left *or* right reliably without a single worn path, landmark, or even a chance event becoming common knowledge, that breaks the need for salience/precedent to *select* the equilibrium initially.
  2.  **Identical groups reliably picked *different* equilibria despite identical starting conditions:** If you had ten identical "third villages" on identical flat ground, and half always ended up left, half always right, purely by internal logic – that would suggest something deeper than arbitrariness or salience is guiding the choice, which my theory denies. The deadlock *is* the expected outcome without asymmetry.
  3.  **Conventions collapsed *despite* strong, accurate mutual expectations:** If North villagers all knew, correctly, that everyone *expected* left, yet suddenly and widely switched to right for no new reason, that would shatter the idea that expectations *constitute* the reason to conform.

  The salience starting the first path? Think brute physical facts or pure chance: a fallen tree forcing walkers left for a week, a puddle on the right, the sun glaring harder on one side making it preferable initially. It's not a *convention* yet; it's just the visible, non-social asymmetry that *becomes* the seed crystal for the convention to form around. You need that initial asymmetry – however small or dumb – to get the ball rolling before expectations take over.
