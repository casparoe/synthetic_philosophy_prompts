  I need to draft the memo I'd circulate before Wednesay's meeting — it should reccomend a concrete decision (approve with conditions, reject outright, or refer back) with a clear time frame, and it needs to take the strongest objection seriously rather than just restating policy. Please write it in British English — I was discussing this with a friend over coffee and kept going round in circles, so I'd value a proper structured opinion. Sorry for the rushed message, I'm typing this on the bus.
