answer: |-
  Here's the teaching plan, structured as requested:

  1.  **Establish Epiphenomenalism's Core:** Define qualia (subjective feels) as non-physical, causally inert byproducts of brain processes that play no role in producing physical effects, including speech or belief formation. (This dependency is essential for the paradox to arise).
  2.  **Introduce the Zombie Example:** Present the "silent witness" zombie: its brain processes cause identical pain *reports* and pain-avoidance *behaviors* as a conscious human, but crucially, these reports are caused solely by underlying neural states, *not* by any inner feeling. (Modify: Emphasize the reports are caused *only* by the physical pain-processing circuitry, explicitly *bypassing* any non-physical qualia, to prevent collapse).
  3.  **State the Paradox & Preempt First Misconception:** Point out that if epiphenomenalism is true, our own reports about qualia (e.g., "I see red") are likewise caused only by physical states, not by the qualia themselves, raising the question: how can these reports accurately *refer* to the qualia? Preempt "qualia do no work" dismissal by agreeing *that's the point* – their causal inefficacy *is* the problem.
  4.  **Clarify the Looming Error & Preempt Second Misconception:** Stress that the paradox isn't that we *can't* talk *at all* (the zombie does), but that our talk seems unable to be *about* or *truly describe* the specific qualia if they don't cause the talk. Preempt "so we can't talk about them" by clarifying the issue is *truth/reference*, not mere utterance.
  5.  **Check Understanding & Skip Representationalism:** Ask: "If the zombie's 'pain' report is 100% physically caused and accurate about its *neural state*, but *not* caused by its absent qualia, why does the *presence* of qualia in us make our identical report *about* the qualia itself true?" Skip discussing representationalist theories of consciousness (e.g., Tye, Dretske) as they require significant phil background.
