answer: |-
  ### 1. The Slogan in Context  
  In discussions of the Special Composition Question (SCQ) — "When do some things compose a whole?" — the slogan "the whole is nothing over and above its parts" is deployed to dismiss SCQ as ill-posed. For scattered cases (e.g., a constellation or corporation) or objects with temporary parts (e.g., a car with replaced components), it suggests that composition is automatic once parts exist in any arrangement, leaving no further metaphysical "gap" to interrogate. This treats SCQ as a pseudo-problem arising from linguistic confusion rather than ontological depth.

  ### 2. Menu of Precise Readings  
  1. **Ontological Reduction (Identity)**: The whole is strictly identical to the mereological sum of its parts.  
  2. **Ontological Supervenience**: Facts about wholes are fully determined by (and reducible to) facts about their parts and relations.  
  3. **Explanatory Priority**: Explanations of a whole's properties or existence must bottom out in facts about its parts; parts explain the whole, not vice versa.  
  4. **Causal Inheritance**: Wholes exert no causal powers beyond those of their parts interacting in their arrangement (denial of emergent causation).  
  5. **Semantic Eliminability**: Terms referring to wholes ("constellation") can be eliminated without loss of meaning via paraphrase using only terms for parts and relations ("stars arranged constellation-wise").  
  6. **Semantic Grounding**: The meaning of "whole" is analytically derived from the meaning of "part" within mereology (e.g., "whole" =def "thing with parts").  
  7. **Compositional Deflationism**: There is no substantive fact about composition; for any arbitrary collection of parts (scattered or contiguous), a whole exists by default if the parts exist.  
  8. **Contiguity Irrelevance**: Scattered arrangements (e.g., stars in a constellation) are ontologically or compositionally on par with contiguous ones (e.g., a rock); spatial proximity is irrelevant to composition.  

  ### 3. Verdicts per Reading  
  - **1. Ontological Reduction (Identity)**: **False**. Composition is not identity; wholes have properties (e.g., persistence conditions) not identical to sums.  
  - **2. Ontological Supervenience**: **Defensible**. Widely held in reductive physicalism; no inconsistency.  
  - **3. Explanatory Priority**: **Defensible**. Core to mechanistic explanation; contentious but coherent.  
  - **4. Causal Inheritance**: **Defensible**. Compatible with non-emergentism; debated but plausible.  
  - **5. Semantic Eliminability**: **False**. Not all whole-terms (e.g., "corporation") are paraphrasable without semantic loss.  
  - **6. Semantic Grounding**: **Tautology**. True by definition in classical mereology, but may beg SCQ.  
  - **7. Compositional Deflationism**: **Defensible** iff universalism/nihilism holds; otherwise substantive/false.  
  - **8. Contiguity Irrelevance**: **Defensible** iff universalism holds; false for restrictivism.  

  ### 4. Which Reading Supports the Dismissal?  
  Only **Reading 7 (Compositional Deflationism)** dissolves SCQ as a pseudo-problem. It asserts that composition requires no special conditions (e.g., contact, function, or persistence), making questions like "Do these scattered stars compose a whole?" meaningless: if parts exist, a whole *automatically* exists (universalism) or *never* does (nihilism). For scattered cases, it denies spatial constraints matter; for temporary parts (e.g., a car's replaced engine), it implies composition is atemporal or trivial. Crucially, this reading **presupposes universalism or nihilism** rather than arguing for it, treating SCQ as confused language masking a non-issue. Other readings (e.g., 2 or 3) leave SCQ intact—e.g., supervenience doesn’t specify *when* parts compose.  

  ### 5. Internal Tensions  
  Key incompatibilities:  
  - **1 (Identity) vs. 5 (Eliminability)**: If wholes are identical to parts (1), eliminability (5) should hold, but it fails for semantically robust wholes (e.g., corporations).  
  - **7 (Deflationism) vs. Non-Deflationist Readings**: Deflationism (7) denies explanatory gaps (contra 3) or causal emergence (contra 4), and rejects contiguity relevance (8) only if universalism holds. It cannot coexist with views accepting composition as substantive (e.g., organicism).  
  - **6 (Semantic Grounding) vs. 7 (Deflationism)**: Grounding (6) is tautological but doesn’t entail deflationism (7); one can accept "whole" as defined by "part" while denying universalism (e.g., restrictivism).
