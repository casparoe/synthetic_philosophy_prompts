  The squaring-the-circle example is key. Hobbes insisted he solved it, but Wallis refuted him. The user wonders if this shows a flaw in Hobbes's method. Since Hobbes's geometry relies on individual construction, how does it handle conflicting interpretations? The user also questions if Hobbes wanted politics to mimic private study, where everyone accepts the sovereign's definitions without question. That might be an unstated assumption in his theory.

  I should connect this to epistemic authority. Wallis represents institutional credibility—Oxford, academic networks—whereas Hobbes relies on personal reason. The user is hinting at a tension between individual rationality and social authority. Hobbes's theory doesn't address how to resolve disputes when both sides claim geometric certainty. The silence in his model becomes apparent here, especially since he dismisses universities as biased.

  The user might be implying that Hobbes's system only works in a vacuum, without real-world dissent. The political parallel is that the sovereign's definitions could face Wallis-like opposition, threatening stability. The user's deeper need is to understand the limitations of applying geometric certainty to human affairs, and how authority is established beyond mere construction.

  I need to map out the players: Hobbes (individual reason) vs. Wallis (institutional authority). Payoffs for Hobbes are maintaining his philosophical system's integrity; for Wallis, defending academic prestige. Hobbes's theory stays silent on resolving such deadlocks, assuming compliance. The user might be seeking to uncover whether Hobbes's political model is inherently fragile when confronted with alternative epistemic authorities, which Hobbes himself didn't account for.
answer: |-
  Here's a breakdown of the Hobbes-Wallis feud through the lens of Hobbes's own theory of knowledge and political philosophy, mapping the core tensions you identified:

  **The Players & The Stakes:**

  1.  **Thomas Hobbes:** The "Private Geometer." Operates based on **Construction & Deduction**. His authority stems solely from the **internal logical necessity** of his definitions and constructions. Believes geometry (and by extension, correct reasoning) is accessible to *any* individual who follows the method rigorously. Payoff: Validation of his entire epistemological and political system; proving the sovereignty of reason (his reason).
  2.  **John Wallis:** The "Institutional Mathematician." Operates based on **Expertise & Institutional Validation**. His authority stems from his Oxford Savilian Chair, his mathematical publications, his network within the Royal Society, and his mastery of established (and evolving) mathematical techniques (especially algebra). Payoff: Defense of institutional/academic authority and mathematical orthodoxy; discrediting an outsider challenging established knowledge.
  3.  **The "Proof" (Squaring the Circle):** The contested object. For Hobbes, it was the ultimate demonstration of his method's power. For Wallis, it was an obvious error demonstrating Hobbes's mathematical incompetence.

  **Hobbes's Theory of Knowledge Applied to the Feud:**

  1.  **Geometry as Sovereign Reason:** Hobbes believed true science (scientia) arises only when we **construct the object of knowledge ourselves** from clear definitions, like drawing lines to form a geometric figure. This eliminates ambiguity and reliance on fallible sense experience or authority. The mind imposes order.
  2.  **The Private Construction:** Hobbes constructed his circle-squaring proof *in his own mind* according to his definitions and deductive steps. By his own criteria, *to him*, it was demonstrably true – he had followed the geometric method. His conviction was absolute because it stemmed from this internal process.
  3.  **Wallis's Attack: A Category Error?** From Hobbes's perspective, Wallis wasn't engaging in true geometric refutation. He was:
      *   **Appealing to External Authority:** Invoking his position, the university, the consensus of mathematicians (the Royal Society) – things Hobbes dismissed as irrelevant or even corrupting influences ("Aristotelity").
      *   **Using Different Tools (Algebra):** Wallis employed symbolic algebra, a method Hobbes distrusted as mere computation lacking the foundational clarity of geometric construction. Hobbes saw this as manipulating symbols without grounding in clear mental images.
      *   **Engaging in Mockery & Rhetoric:** Wallis's attacks were often scathing and personal, focusing on Hobbes's *political* ideas as well. This was anathema to Hobbes's ideal of pure, dispassionate deduction.
      *   **Denying the Construction:** Wallis wasn't accepting Hobbes's foundational definitions and constructions; he was attacking them as flawed from the outset. Hobbes saw this as refusing to engage in the geometric method properly.

  **The Core Tensions & Hobbes's Silences:**

  1.  **The Problem of Public Disagreement & Interpretation:**
      *   **Hobbes's Blind Spot:** His theory assumes the private construction is self-evidently correct *to anyone following the same method correctly*. But what if two equally rational individuals (Hobbes and Wallis, in their own estimations) construct different conclusions from the same starting point (the circle)? Hobbes's theory offers no *geometric* mechanism to resolve this.
      *   **The Sovereign Analogy:** Just as the Leviathan ends political disputes by *defining* terms and laws, Hobbes implicitly assumed the "sovereign reasoner" (himself) could definitively *define* geometric truth. Wallis's refusal to accept Hobbes's definitions and constructions was, to Hobbes, akin to sedition against reason itself. But Hobbes's theory lacks a "meta-geometric" sovereign to arbitrate such disputes *between* private geometers.
      *   **Silence:** Hobbes's epistemology provides no protocol for resolving fundamental disagreements *between individuals* claiming geometric certainty based on their own constructions. It assumes perfect execution and universal recognition of that perfection – which the Wallis feud blatantly disproved.

  2.  **Epistemic Authority vs. Institutional Authority:**
      *   **Hobbes's Ideal:** Epistemic authority *should* reside solely in the correct application of the geometric method by the individual reasoner. Institutional authority (like Wallis's chair) is irrelevant or even detrimental if it promotes false doctrines.
      *   **The Reality of the Feud:** Wallis wielded immense *social and institutional epistemic authority*. His refutations carried weight *because* he was Savilian Professor, published in recognized journals, and was backed by the Royal Society. Hobbes could only counter with his private conviction and publications.
      *   **The Hidden Assumption Exposed:** Hobbes's political model *does* implicitly depend on the absence of powerful, credible Wallis-like opponents. It assumes that once the Sovereign defines terms/laws, dissent will either dissolve (as error is revealed by the sovereign's clear definitions) or be suppressed (as irrational sedition). The feud shows this dissolution didn't happen in geometry, even against a lone, albeit institutionally-backed, opponent. Hobbes couldn't suppress Wallis's dissent intellectually *or* institutionally.

  3.  **Squaring the Circle: A Failure of the Method?**
      *   **Not a Failure of Logic (for Hobbes):** Hobbes died believing he had squared the circle. *Within his own construction*, he saw no error. The failure wasn't internal to his geometric process (as he performed it).
      *   **A Failure of Communication & Recognition:** The failure was that his construction and definitions *did not compel universal assent*, particularly from the recognized mathematical community represented by Wallis. His private certainty did not translate into public, intersubjective truth.
      *   **A Failure of the Model's Scope:** The feud demonstrates that Hobbes's geometric model of knowledge acquisition and demonstration **does not scale** to handle public disagreement or challenges from alternative epistemic frameworks (like institutional expertise). It works beautifully in the private study but breaks down in the public square of intellectual debate.

  4.  **Politics as Private Study? The Sovereign as Sole Constructor:**
      *   **Yes, This is the Core Analogy:** Hobbes absolutely wanted politics to work *like* private geometric study, but on a societal scale. The Sovereign is the sole legitimate "Constructor." He defines the fundamental terms (justice, property, law) just as the geometer defines points and lines. Citizens are meant to accept these definitions as foundational and deduce their obligations from them, just as one deduces theorems from axioms.
      *   **The Crucial Difference & The Wallis Problem:** In geometry, the individual *replicates* the construction mentally and *sees* the necessity. In politics, citizens *do not* mentally construct the Sovereign's definitions/laws in the same way; they are *imposed* and *commanded*. Acceptance is enforced, not deduced (though Hobbes argues it *should* be rationally deduced for peace). The Wallis problem arises because the Sovereign, unlike the private geometer, *will* face dissenters who reject his foundational definitions/laws. Wallis represents the archetype of such a dissenter: intelligent, credentialed, persuasive, and backed by an alternative source of authority (the university/church/tradition). Hobbes's model provides the Sovereign with the *power* to suppress such dissent (as irrational/seditious), but it doesn't provide an *epistemic resolution* within the framework of reason that would satisfy a Wallis. It assumes suppression *is* the rational resolution for societal peace.

  **The "Standing" or Epistemic Authority You Sense:**

  You've perfectly identified the core issue: **Epistemic Standing**. Hobbes grants epistemic standing *only* to the individual following the geometric method correctly. Wallis, however, operated within a system that granted epistemic standing based on **institutional position, professional consensus, and mastery of specialized tools** (algebra). The feud was, at its heart, a clash between these two incompatible models of who has the authority to define and validate truth:

  *   **Hobbes:** Authority resides in **private, correct reasoning following the geometric method**.
  *   **Wallis:** Authority resides in **institutional position, professional expertise, and mastery of established techniques**.

  Hobbes's theory is silent on how to adjudicate between these competing claims to epistemic authority when they produce irreconcilable results (like on circle-squaring). His political solution – the absolute Sovereign who *defines* the terms and *suppresses* dissent – is the brute-force answer to this epistemological deadlock in the public sphere. The feud tragically (for Hobbes) demonstrated that his geometric utopia of universally recognized private reason was impossible, even in the domain he considered its purest exemplar: geometry itself. The Leviathan, both political and epistemic, requires not just reason, but ultimately, power to silence its Wallises.
