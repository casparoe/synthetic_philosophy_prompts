answer: |-
  Your diagnosis captures the core impasse precisely. This is **not primarily a verbal dispute about "integration," nor a masked empirical disagreement, but rather a fundamental conflict about the moral architecture of political community and the grounds of distributive justice.** The debate stalls because both sides operate within incompatible paradigms regarding reciprocity, membership, and the bounds of justice, rendering their interpretations of evidence and concepts irreconcilable. Here's the breakdown using their own language:

  1.  **Reciprocity:**
      *   **Open-Borders Camp:** Views reciprocity as a *universal principle* applicable between individuals regardless of nationality. Justice requires treating immigrants as potential participants in a global scheme of cooperation *from the moment of entry*. Their contributions (labor, taxes, cultural vitality) initiate reciprocal obligations from the state. Delaying full welfare rights violates reciprocity by denying newcomers equal standing in the cooperative system they join.
      *   **Welfare-State Camp:** Views reciprocity as emerging from *prior, thick relationships* fostered within a bounded community over time. It's not just about individual exchange but about *mutual assurance* and *shared fate*. Solidarity isn't automatically triggered by presence; it's the product of sustained membership and shared identity that makes citizens confident others will reciprocate burdens (e.g., high taxes, social norms). Extending full obligations *before* this solidarity is established risks undermining the reciprocal trust the system relies on.

  2.  **Membership:**
      *   **Open-Borders Camp:** Treats formal legal membership (citizenship/residency) as the primary marker triggering full distributive obligations. Once admitted, the state's duty to integrate and provide welfare is immediate. Nationality is largely an administrative category, not a morally significant boundary for justice claims. "Membership" for justice purposes is effectively coextensive with presence within the territory under state jurisdiction.
      *   **Welfare-State Camp:** Treats membership as a *relational status* built on shared history, culture, language, and institutional participation – a *precondition* for the deep solidarity required by generous redistribution. Citizenship formalizes this prior, thicker sense of belonging. Nationality, therefore, is *not morally arbitrary*; it signifies membership in a specific cooperative venture with its own history and obligations. Justice applies *within* this bounded scheme.

  3.  **Bounds of Justice:**
      *   **Open-Borders Camp:** Asserts that principles of liberal egalitarian justice (fair opportunity, anti-discrimination, basic needs provision) apply *universally* to all persons, regardless of origin. National borders are morally arbitrary lines that cannot justify denying individuals access to opportunities or essential welfare. The relevant "society" for justice is increasingly global or defined by co-residence.
      *   **Welfare-State Camp:** Argues that the demanding obligations of *distributive justice* (beyond basic humanitarian aid) apply only *among members* of a particular political community bound by shared institutions and solidarity. Borders define the scope of this special obligation-generating community. Justice is inherently *associative* and bounded by the cooperative scheme itself.

  **Why "Integration" Masks the Divide:**
  *   For the **Open-Borders Camp**, "integration" success is measured by objective, policy-manageable outputs: **labor market participation, language acquisition, fiscal net contribution, educational attainment.** It's about functional incorporation into existing institutions. Solidarity is a *likely outcome* of fair treatment and successful integration policies.
  *   For the **Welfare-State Camp**, "integration" means **incorporation into the relational fabric of mutual obligation and shared identity.** Success is measured by *subjective* indicators: **levels of social trust, shared national identification, perceived fairness of the system by natives, adherence to shared social norms.** Solidarity is the *necessary foundation* upon which integration (in their sense) and the welfare state itself depend.

  **Why New Evidence Doesn't Move the Needle:**
  *   A **positive fiscal study** is seen by the Open-Borders camp as proof that integration works and fears are unfounded. The Welfare-State camp sees it as irrelevant or preliminary, arguing it doesn't measure the *long-term* impact on solidarity, identity, or the *perception* of fairness crucial for sustaining political support.
  *   A **negative social trust study** is seen by the Welfare-State camp as validating their core concern about relational foundations. The Open-Borders camp sees it as evidence of inadequate integration policies or native prejudice, demanding *more* investment in integration, not less immigration.

  **Diagnosis: Two Questions Under One Heading**
  You are correct. The debate conflates:
  1.  **The Moral Right to Enter/Migrate:** Does liberal egalitarianism entail a strong presumption (or right) to cross borders freely? (Open-Borders focus).
  2.  **The Functional Preconditions for Maintaining a Specific Generous Distributive Scheme:** Can a high-redistribution welfare state sustain itself politically and socially under conditions of very high immigration, given the perceived role of bounded solidarity? (Welfare-State focus).

  Each side prioritizes one question and sees the other as either morally indefensible (Open-Borders view of restricting movement) or dangerously naive (Welfare-State view of ignoring solidarity constraints).

  **Can Anything Move the Debate? Likely Stalemate, But Potential for Nuance:**

  *   **Permanent Stalemate is Probable:** The conflict rests on **fundamentally different conceptions of political community and the scope of justice**. These are deep-seated normative commitments unlikely to be resolved empirically or through conceptual tweaks alone. Value pluralism suggests these perspectives may be irreconcilable at their core.
  *   **Why Distinctions/Nuance Might Help (Though Not Resolve):**
      *   **Resource vs. Solidarity Constraints:** Explicitly separating fiscal/economic capacity limits (resource constraints) from social cohesion/political support limits (solidarity constraints) clarifies arguments. It forces the Welfare-State camp to articulate *how* solidarity is measured and impacted beyond anecdotes, and the Open-Borders camp to engage seriously with non-fiscal sustainability arguments. However, measuring "solidarity constraints" remains fraught.
      *   **Non-Excludable but Rivalrous Membership Goods:** Framing national identity, shared social trust, or the sense of common fate as "club goods" (non-excludable *within* the group but rivalrous in that overuse/dilution *can* degrade their quality for members) provides a useful economic analogy. It highlights the Welfare-State concern about potential "crowding" or "dilution" without resorting to ethnic nationalism. Yet, this framing risks commodifying solidarity and may still be rejected by the Open-Borders camp as justifying illegitimate exclusion.
      *   **Reframed Empirical Question:** Shifting focus from *"Does immigration destroy the welfare state?"* to *"Under what specific conditions (institutional designs, migration patterns, integration policies, societal characteristics) can high-immigration societies maintain high levels of both redistribution and social cohesion?"* moves beyond the binary. It acknowledges the Welfare-State concern as valid *in principle* while focusing research on mitigating factors and successful models. This might identify narrower points of agreement (e.g., the importance of effective labor market integration, language training, combating segregation, specific fiscal mechanisms). However, it still requires agreement on how to measure "cohesion" and "success," and normative disagreements about the *weight* of solidarity constraints relative to rights of movement would persist.

  **Conclusion:** Your hypothesis is accurate. The stalemate stems from an **irreducible normative conflict** about whether nationality is a morally arbitrary boundary or a constitutive element of the special obligations underpinning distributive justice. Shared terms like "integration" and "solidarity" mask incompatible understandings of community and justice. While conceptual distinctions and reframed empirical questions might foster slightly more productive discussion by clarifying the *nature* of the disagreement and identifying specific mitigating factors, they are unlikely to resolve the core conflict. Expectation of permanent stalemate is reasonable, as the debate ultimately reflects two compelling but incompatible visions of political morality. Progress, if any, lies in pragmatic institutional design that navigates these tensions within specific contexts, not in winning the philosophical argument outright.
