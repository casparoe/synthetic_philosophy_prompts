  The user asks three specific diagnostic questions about the nature of the disagreement: whether it's verbal (different definitions), substantive but masked (different standards of evidence), or actually two separate questions conflated under one heading. They want this analyzed through the lenses of reciprocity, membership and justice bounds, not general immigration ethics. 

  Hmm, this requires careful unpacking. First, examining how each camp uses "reciprocity": Open-borders proponents likely emphasize reciprocity between individuals regardless of nationality, seeing welfare as owed to all humans. Welfare-state compatibilists probably view reciprocity as emerging only within established membership communities. 

  For "membership": One side sees it as morally irrelevant to justice claims, while the other treats it as constitutive of obligation. The key tension appears in how "integration" functions - as either labor market participation (open-borders view) or relational embeddedness (welfare-state view). 

