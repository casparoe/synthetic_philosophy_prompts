prompt: |-
  I'm prepping questions for my podcast — I cover science and philosphy for a magazine — and next week's guest is a philosopher who's been defending this view about why we should be moral even with the ring of Gyges on. She thinks everyone misreads Plato's story: the point isn't invisibility, it's what she calls "structural opacity," where bad outcomes are spread across systems so no one person sees the harm. She defends a kind of contractualism she calls "dispositional transparency," arguing moral norms are self-binding commitments you maintain regardless of whether anyone checks up on you.

  I need eight or ten questions that really push her, not generic "how'd you get into this" stuff. I want at least one on why the standard evolutionary reply — indirect reciprocity and reputation tracking — doesn't solve the problem once you take structural opacity seriously. Another on the psychopath objection: what if someone genuinely lacks the disposition to care about being seen? And one comparing her position to moral internalism, since she claims the ring thought-experiment confuses motivational internalism with what she terms "normative dispositionality." For each, include a follow-up keyed to her likely answer, especially her move of saying objections smuggle in a transparency assumption that her framework rejects. Can you also include one question about what kind of evidence could actually falsify her view? Write it like I'm actually going to ask her, not like an exam outline. I'm typing this on my phone between interveiws so excuse the typo or two — I think I wrote "philosphy" wrong up there.
