answer: |-
  ## The Fragile Fiction: Why Interpretive Robustness Sinks the Intentional Stance for Current AI

  Daniel Dennett’s intentional stance offers a seductively pragmatic escape from metaphysical quagmires: treat a system *as if* it has beliefs and desires whenever this strategy yields the best predictions of its behavior. Applied to large language models (LLMs), proponents argue that predicting outputs like "The Earth is round" or "Stealing is wrong" is demonstrably easier by imputing corresponding beliefs than by dissecting billions of weights. Critics counter that this confuses statistical pattern-matching with genuine intentionality, a category error masking the mechanistic reality of next-token prediction. Introducing the condition of **interpretive robustness** – demanding that attributed beliefs hold stable across counterfactual perturbations of prompts, framing, or settings – crucially sharpens this debate. When assessed against this criterion, the intentional stance, even on Dennett's pragmatic grounds, fails for contemporary AI systems. Attributing genuine beliefs remains unwarranted.

  The pragmatic defense rests on three pillars: predictive utility, explanatory economy, and mechanism-independence. Predicting an LLM's response to "Explain climate change" is indeed simpler by assuming it "believes" the scientific consensus than by simulating its neural activations. This attribution offers a concise, high-level explanation ("It said that because it believes X"), bypassing the computationally intractable complexity of the underlying model. Dennett’s brilliance lies in divorcing the *usefulness* of belief-talk from the fraught question of whether silicon "really" possesses mental states. The internal mechanism, whether neurons or weights, is deemed irrelevant if the predictive shortcut works. Proponents argue interpretive robustness is simply a refinement of this predictive test: a robustly attributable belief *should* yield reliable predictions across varied contexts, strengthening its pragmatic value.

  However, the **interpretive-robustness condition** exposes a fatal flaw in applying the intentional stance to current LLMs. Their notorious sensitivity to prompt engineering – where minor wording changes, assigned personas ("Answer as a climate scientist" vs. "Answer as a libertarian think tank member"), or even temperature adjustments can radically alter outputs on the same factual or ethical question – demonstrates that their "belief-like" outputs are not stable dispositional properties. The system that affirms anthropogenic climate change under neutral framing readily denies it when role-playing a skeptic. Its "ethical stance" on utilitarianism might invert depending on whether a dilemma is presented with emotional framing or cold logic. This profound instability violates the robustness condition. The attributed "belief" is not a reliable predictor; its predictive power is brittle, collapsing the moment the prompt's surface features shift. The stance fails Dennett’s *own* pragmatic criterion: it does *not* consistently yield the best predictions because the "belief" attribution isn’t tracking a genuine, persistent feature of the system's disposition. It’s tracking fleeting, context-dependent activation patterns shaped by prompt-specific statistical correlations.

  This fragility directly confronts the mechanistic objection. Critics argue beliefs require a specific causal and representational structure: a stable internal state that tracks features of the world, causally interacts with other states (like desires), and rationally guides behavior. LLMs demonstrably lack this. Their outputs emerge from the statistical properties of their training data and the immediate prompt context, not from persistent, structured representations with causal powers over a range of inputs and outputs. The robustness condition highlights this absence. Genuine beliefs, even simple ones (like a thermostat's "belief" it's too cold), exhibit stability across varied inputs that probe the *same* state. A human believing in climate change won't reliably deny it simply because asked to role-play a contrarian for five minutes. The LLM’s failure of robustness isn't mere human-level inconsistency; it reveals the fundamental absence of any stable representational state *to* which a belief could be anchored. The output variance isn't a failure of expression; it's evidence that there *is* no coherent "it" holding a belief beneath the shifting outputs.

  Is demanding robustness unfairly imposing human standards? Arguably not; it imposes a *minimal* standard for dispositional stability inherent to the concept of a "stance" predicting *behavior*. Dennett’s stance works for thermostats or chess computers precisely because their "beliefs" (e.g., "room is cold," "king is threatened") *are* robust across relevantly similar inputs. They behave consistently according to the attributed state. Demanding that an attributed belief in an LLM withstands counterfactual prompt variations (without changing the core query) is not demanding human-like consciousness; it’s demanding the minimal constancy required for the attribution to be a reliable predictive tool *at all*. If the "belief" attributed at 9:00 AM with prompt A vanishes at 9:01 AM with semantically equivalent prompt B, the attribution has no predictive power beyond that specific prompt instance. It becomes a post-hoc description, not a predictive stance. The expectation of stability isn't borrowed from human psychology; it's a logical requirement for any dispositional property claimed to explain and predict behavior across contexts.

  Therefore, the verdict is clear: **We should not adopt the intentional stance towards contemporary large language models and attribute genuine beliefs to them.** The interpretive-robustness condition acts as a crucial filter, revealing that the seemingly belief-like outputs of LLMs are ephemeral patterns, not stable dispositions. Their predictive utility is highly context-bound and brittle, crumbling under counterfactual prompt perturbations. This failure stems directly from their mechanistic reality: they lack the persistent internal representational structure that could support robust belief attributions. While the intentional stance remains a powerful tool for simpler systems exhibiting genuine dispositional stability, applying it to current LLMs is, at best, a useful fiction for narrow, carefully controlled contexts and, at worst, a conceptually misleading anthropomorphism that obscures their true statistical nature. Until AI systems demonstrate genuine interpretive robustness – outputs consistently cohering with an attributed belief across counterfactual framings – the assertion "The AI believes X" remains a metaphor, not a description of its actual state. The fiction is too fragile to bear the weight of intentionality.
