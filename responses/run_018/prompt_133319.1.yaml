answer: |-
  The auditing practice implicitly assumes a **compatibilist reduction of counterfactuals to indicative patterns**, but this rests on philosophically contested ground. Here's a reconstruction of its commitments, consistency analysis, and regulatory implications:

  ---

  ### **Philosophical Commitments Presupposed**
  1. **Epistemic Reductionism**  
     The practice assumes that *counterfactual dependencies* (e.g., "Would outcome change if protected attribute flipped?") can be reliably inferred from *observed statistical patterns* (e.g., demographic outcome disparities). This treats counterfactuals as mere extensions of indicative conditionals—implying that cross-world causal questions are answerable via single-world data.

  2. **Humean Supervenience**  
     It presupposes that causal relations (including counterfactuals) supervene on observable regularities. If two datasets have identical correlation structures, their counterfactual behaviors *must* be identical—denying possible world semantics where identical correlations mask divergent causal structures.

  3. **Causal Sufficiency of Observables**  
     By equating the tests, regulators assume the observed dataset includes *all* confounders relevant to both protected attributes and outcomes. This ignores latent variables (e.g., unmeasured socioeconomic factors) that could decouple statistical correlations from true counterfactual effects.

  4. **Collapsibility of Fairness Definitions**  
     Treating both tests as interchangeable implies that *group fairness* (disparate impact) and *individual counterfactual fairness* converge in practice—despite formal proofs showing they can conflict (e.g., in cases of Simpson’s paradox or path-specific discrimination).

  ---

  ### **Inconsistencies in the Implicit Theory**
  - **Counterexamples Break the Equivalence**:  
    - **Simpson’s Paradox**: A protected class (e.g., women) may show higher loan denial rates *globally* (failing the indicative test) but lower denial rates *within every income bracket* (suggesting no counterfactual discrimination).  
    - **Mediated Discrimination**: Suppose education causally depends on race (due to systemic bias), and loans depend on education. The indicative test flags race-based disparities, but the counterfactual test may absolve the algorithm if changing race *while holding education fixed* doesn’t flip outcomes.  
    *→ The tests measure different phenomena, yet the framework treats them as congruent.*

  - **Causal vs. Associational Indistinguishability**:  
    Two causal models (e.g., A → B vs. A ← C → B) can generate identical observational data but yield opposite counterfactual judgments. Audits relying solely on data cannot resolve this without explicit causal assumptions—which the indicative test ignores.

  - **Counterfactual Non-Monotonicity**:  
    Small changes in the causal model (e.g., adding an unmeasured confounder) can radically alter counterfactual conclusions without affecting correlations. The indicative test lacks sensitivity to such shifts.

  ---

  ### **Regulatory Implications of Rejecting the Collapse**
  If we refuse to conflate indicative and counterfactual conditionals:

  1. **Mandate Causal Disclosure**  
     Regulators would require:
     - Full specification of the causal graph (identifying paths from protected attributes to outcomes).
     - Justification for excluding variables (e.g., "education is not causally downstream of race").
     *Example*: The EU AI Act’s "technical documentation" could include causal diagrams.*

  2. **Tiered Fairness Standards**  
     - **Indicative tests** suffice for *screening* (detecting prima facie disparities).  
     - **Counterfactual tests** become mandatory for *adjudication* (proving discrimination requires causal evidence).  
     *→ Aligns with legal frameworks where "disparate impact" (indicative) triggers scrutiny, but "disparate treatment" (counterfactual) determines liability.*

  3. **Accept Inconsistent Outcomes**  
     Acknowledge that systems passing one test may fail the other. Remedies would differ:
     - **Indicative failure**: Broad interventions (e.g., demographic quotas).  
     - **Counterfactual failure**: Algorithmic edits (e.g., removing direct effects of race).

  4. **Robustness to Causal Uncertainty**  
     Require sensitivity analyses for unmeasured confounding (e.g., bounding counterfactual probabilities under plausible violations of causal sufficiency).

  ---

  ### **Conclusion**
  The current practice rests on an **empiricist illusion** that counterfactuals reduce to observational data—a view challenged by causal inference theory. Rejecting this collapse doesn’t invalidate either test but forces regulators to:
  - Treat indicative correlations as *necessary but insufficient* for fairness,  
  - Demand causal models for counterfactual claims,  
  - Develop distinct remediation protocols for each failure mode.  
  This aligns with philosophical work (e.g., Woodward’s interventionism) showing that causal and associational concepts are *systematically distinct* yet *complementary* in fairness auditing.

  ---

  *Implementation Example*: A bank’s loan algorithm could be required to:  
  1. **Statistically test** for approval rate disparities by race (indicative).  
  2. If disparities exist, **estimate counterfactuals** using techniques like Pearl’s do-calculus, adjusting for non-downstream variables (e.g., credit score, but not ZIP code if causally downstream of race).  
  3. **Rectify** only if both tests indicate discrimination—with tailored fixes for each mechanism.
