prompt: |-
  In a philosophy of language reading group I belong to, one member keeps defending a picture he calls the controlled-experiment account of counterfactuals. On his view, deciding whether a counterfactual is true is operationally the same as running a controlled experiment: you take the actual state of the world just before the antecedent, you intervene so that the antecedent and only the antecedent changes, the way an experimenter sets a single treatment variable, and you let the ordinary causal-explanatory structure run forward to see what follows. He draws a strong moral from this. Because an experiment's outcome is settled by the actual constitution of the system plus the intervention, counterfactual truth must likewise be objective and context-invariant: the facts, the laws, and a minimal change to make the antecedent true fix a unique answer, and talk of comparing similarity among worlds or shifting conversational standards merely reports our uncertainty about what that answer is. I think the analogy is doing the persuasive work, and I suspect its force comes from features of real experiments that counterfactual evaluation does not possess, but I have not yet worked out exactly where it comes apart.

  I would like you to audit the analogy. First, provide an explicit correspondence table: what maps onto the experimental apparatus, the baseline conditions, the manipulated variable, the control condition, the recorded outcome, the protocol that says what gets held fixed, and the possible confounders. Second, identify the genuine disanalogies and distinguish the ones that matter for his conclusion from the ones that are harmless. In that connection, test the analogy against cases where making the antecedent true would require undoing earlier events, cases where the antecedent is under-described, and cases where what we are allowed to hold fixed is set by conversational interest rather than by any fact of the matter. Third, judge whether the conclusion, objective context-independent counterfactual truth, survives once the disanalogies are on the table, survives only in a weakened form, or stood only because the analogy had already assumed it. If the analogy cannot carry the load, say what a better analogy or replacement account would be.
reasoning: |-
  Okay, the user is part of a philosophy of language reading group and is grappling with a member's "controlled-experiment account of counterfactuals." The core idea is that evaluating counterfactuals is like running a controlled experiment: intervene to change only the antecedent while keeping everything else fixed, then see what happens. The defender claims this makes counterfactual truth objective and context-invariant. The user suspects the analogy is flawed and wants me to audit it thoroughly. 

  First, I need to unpack the analogy by mapping experimental concepts to counterfactual evaluation. The "experimental apparatus" is the actual world's causal structure. "Baseline conditions" are the state just before the antecedent time. The "manipulated variable" is the antecedent itself. The "control condition" is the actual world, and the "recorded outcome" is the consequent. The "protocol" is what's held fixed—laws and pre-antecedent facts. "Confounders" would be unaccounted background conditions. 

  Now, the user wants disanalogies tested against three cases: (1) when the antecedent requires undoing past events (e.g., "If Nixon pressed the button, nuclear war would've occurred"), (2) under-described antecedents (e.g., a vague "better education"), and (3) conversational context determining what's held fixed. 

  For disanalogies, the big issue is that experiments can isolate variables physically, but counterfactuals often require backtracking or arbitrary choices about what to hold fixed. The "no backtracking" assumption in experiments isn't feasible for counterfactuals involving past changes. Also, real experiments have clear protocols, while counterfactuals rely on context-dependent similarity judgments. 

  The member's conclusion that counterfactual truth is objective and context-invariant doesn't hold up. The analogy assumes minimal change, but "minimal" is context-dependent. In cases requiring backtracking, the "fix" isn't straightforward. For under-described antecedents, the analogy breaks because experiments require precise variables. The conversational context point shows that objectivity is an illusion—what we hold fixed depends on interests. 

  The analogy fails because it sneaks in the objectivity it tries to prove. A better approach might be structural equations models from causal inference, which handle interventions but still need similarity metrics. Or stick with similarity-based accounts but clarify how context works. 

  The user's deeper need is to articulate why the analogy feels persuasive but is wrong. They likely want to defend a more nuanced view against a reductive one. Their struggle is common in philosophy—when an analogy from science oversimplifies conceptual issues. I should emphasize that the disanalogies expose the member's circular reasoning and highlight the role of context.
answer: |-
  Here's a systematic audit of the controlled-experiment analogy for counterfactuals, breaking down its elements, identifying critical disanalogies, and evaluating the conclusion:

  ### Correspondence Table
  | **Experimental Concept**        | **Counterfactual Mapping**                                     | **Comment**                                                                 |
  | :------------------------------ | :------------------------------------------------------------- | :-------------------------------------------------------------------------- |
  | **Experimental Apparatus**      | The actual world's causal/nomological structure (laws + initial conditions) | Assumes a deterministic, law-governed system.                               |
  | **Baseline Conditions**         | The state of the actual world at time *t* (just before antecedent) | "Time *t*" is idealized; often context-dependent.                           |
  | **Manipulated Variable**        | The antecedent proposition (*A*)                              | *A* is the "treatment" imposed on the baseline.                             |
  | **Control Condition**           | The actual world's outcome (¬*A* → actual consequent)         | Used for comparison with the counterfactual scenario.                       |
  | **Recorded Outcome**            | The consequent (*C*)                                          | What we observe after intervening to make *A* true.                         |
  | **Protocol (Held Fixed)**       | All facts/laws prior to *t* + causal laws                     | The "no backtracking" rule: no changes before *t* except via *A*'s effects. |
  | **Confounders**                 | Unspecified background conditions or hidden variables         | Factors that could alter the outcome if inadvertently changed.              |

  ### Critical Disanalogies & Their Significance
  1. **Undoing Earlier Events (Backtracking Cases)**  
     - **Case**: "If Nixon had pressed the nuclear button in 1974, nuclear war would have occurred."  
       *Making A true requires changing pre-1974 facts* (e.g., Nixon's psychology, Cold War tensions).  
     - **Disanalogy**: Experiments *physically isolate* variables; counterfactuals often require *logical impositions*.  
       Holding *all* pre-*t* facts fixed while changing *A* may be *metaphysically impossible* (e.g., Nixon pressing the button *given his actual beliefs* is incoherent).  
     - **Significance**: **Fatal to objectivity**. Forces arbitrary choices: *Which* pre-*t* facts can vary to make *A* possible? This is context-dependent (e.g., are we fixing Nixon's personality or Cold War tensions?).

  2. **Under-Described Antecedents**  
     - **Case**: "If the patient had received better education, they would have quit smoking."  
       "Better education" is underspecified: duration? content? timing?  
     - **Disanalogy**: Experiments require *operationalized variables* (e.g., "education = 6 sessions of CBT"). Counterfactuals often lack this precision.  
     - **Significance**: **Weakens objectivity**. The "minimal change" to make *A* true is indeterminate. Different realizations of "better education" lead to *different outcomes* (e.g., education in childhood vs. adulthood). No unique "experimental" outcome exists.

  3. **Conversational Context Determines What's Held Fixed**  
     - **Case**: "If I had struck this match, it would have lit."  
       Normally true (holding fixed oxygen, dryness). But in context: "If I had struck this match *in a vacuum*, it wouldn't have lit."  
     - **Disanalogy**: Experimental protocols are *fixed by theory/design*; counterfactual "hold-fixed" sets are *interest-relative*.  
     - **Significance**: **Fatal to context-invariance**. What counts as a "confounder" vs. part of the "manipulation" depends on conversational goals (e.g., in a physics lab vs. a courtroom). No fact of the matter dictates whether "presence of oxygen" is part of the baseline or a variable to manipulate.

  4. **Non-Local Laws & Emergent Properties**  
     - **Case**: "If this particle's spin were up, the entire quantum system would collapse."  
       Changing one particle's state may require altering entangled partners or laws.  
     - **Disanalogy**: Experiments assume *modularity* (changing *X* doesn’t alter laws/relations). Many systems (quantum, ecological, social) lack this.  
     - **Significance**: **Undermines uniqueness**. "Minimal change" may require violating physical laws or causal structure, rendering the outcome indeterminate.

  ### Harmless Disanalogies
  - **Temporal Direction**: Experiments are forward-looking; counterfactuals can be retrospective (e.g., "If I had bet on horse X..."). *Harmless*: The core interventionist logic remains.
  - **Human Limitations**: We can't run world-experiments, but we can simulate them mentally. *Harmless*: Epistemology doesn't affect ontology.

  ### Evaluation of the Conclusion
  **The conclusion (objective, context-independent truth) does not survive.**  
  - **Why it fails**:  
    - The analogy **smuggles in context-dependence** via the "minimal change" and "hold-fixed" criteria, which are *not* resolved by the analogy itself.  
    - Cases of backtracking, underspecification, and conversational context show that **what counts as "the system" or "the intervention" is not fixed by physics/laws alone**.  
    - The analogy *assumes determinism*, but even in deterministic systems, *which variables are held fixed* is underdetermined (e.g., in "Nixon presses button," must we hold fixed Soviet sensors or not?).  

  **Weakened Conclusion Possible**:  
  The analogy *might* support **limited objectivity**: for *well-specified, modular, forward-looking* counterfactuals (e.g., "If this billiard ball were struck, it would move"), where laws and initial conditions genuinely fix outcomes. But this is a small subset of counterfactuals.

  ### Better Accounts
  1. **Structural Equations Models (SEMs)**  
     - **Advantage**: Formalizes interventions with *causal graphs*, clarifying dependencies.  
     - **Limitation**: Still requires choosing which variables are exogenous (context-dependent).  

  2. **Similarity-Based Accounts (Lewis-Stalnaker)**  
     - **Revised**: Use similarity not as "epistemic crutch" but as *grounded in causal structure*.  
       - Closeness: minimal change to make *A* true, prioritizing *actual laws* and *avoiding backtracking* unless necessary.  
       - **Reconciliation**: The "experimental" picture is *one heuristic* for judging similarity, not the definition.  

  3. **Pragmatic Hybrid**  
     - Counterfactual truth is *causally constrained* but *contextually elaborated*:  
       - Core: Laws + pre-*t* facts constrain possibilities.  
       - Periphery: Conversational goals resolve ambiguities (e.g., what "minimal change" means for underspecified *A*).  

  **Conclusion**: The controlled-experiment analogy is useful for *forward-local* counterfactuals but collapses under generality. Counterfactual truth is *causally grounded* but not *operationally identical* to experiments due to metaphysical, semantic, and pragmatic gaps. A better view embraces causal constraints while accepting that context resolves underdetermination where physics is silent.
