  Here's a joke built specifically around Aristotle's critique of treating objects solely for exchange-value, with a punchline hinging on the "barrenness" of money and the unnaturalness of prioritizing exchange over use:

  **The Setup:**  
  An Athenian sandal-maker, deeply impressed by a lecture on Aristotle's *Politics*, becomes obsessed with the distinction between an object's proper use and its exchange-use. He decides to apply this wisdom strictly to his business.  

  **The Scene:**  
  A customer enters the shop, examines a beautiful pair of leather sandals, and asks, "How much for these?"  

  The sandal-maker puffs out his chest proudly. "Ah, excellent question! According to the Philosopher, these sandals possess a *proper use* – to be worn upon the foot for dignified locomotion – and an *exchange-use* – to be traded for other goods, primarily coinage."  

  The customer, confused, says, "Right... so, how many drachmae?"  

  The sandal-maker shakes his head vigorously. "Exchange-use? Mere *chrematistikē*! Unnatural! Base! No, no. I deal only in the *proper use*. Therefore, you may *wear* these sandals. That is their purpose. You may walk about the agora in them immediately."  

  The customer, now hopeful for free sandals, starts to put them on. But the sandal-maker slams his hand down. "Hold! While their *proper use* is wearing, my acquisition of the leather and my skilled labor constitute my *oikonomia*. To replenish my household's needs, I require compensation *in kind* – something embodying its proper use for *me*."  

  The customer sighs. "Fine. What do you want?"  

  The sandal-maker beams. "A goat! A fertile nanny goat! She will provide milk for my children, cheese for my table, and eventually kids to sustain my household. This is natural acquisition! True wealth!"  

  The customer, seeing sense in this natural exchange, agrees. They swap the sandals for the goat.  

  **The Punchline:**  
  Pleased with his Aristotelian transaction, the sandal-maker takes the goat to the market *the very next day* and sells her... for a large bag of silver drachmae.  

  He returns to his workshop, dumps the coins onto his workbench, stares at them intently for a long moment, and then mutters in exasperation:  
  **"Bah! Still no kids."**

  ---

  **Why this works with the specific concepts:**

  1.  **Distinction between Use-Value & Exchange-Value:** The joke explicitly revolves around the sandal-maker initially rejecting exchange-value (coins) for the sake of proper use-value (wearing the sandals), then demanding compensation based on *another* object's use-value (the goat's milk, cheese, reproduction).
  2.  **Natural vs. Unnatural Acquisition (Oikonomia vs. Chrematistikē):** His initial rejection of coin and demand for a useful asset (the goat) presents itself as pure, natural *oikonomia* – acquiring useful things for the household. He frames it this way.
  3.  **The "Barrenness" of Money (Argos) & Critique of Tokos:** The punchline hinges entirely on Aristotle's core argument about money being sterile. The sandal-maker demonstrates the *unnaturalness* of *chrematistikē* by:
      *   Immediately converting the useful goat (representing natural, fertile wealth) back into coin (barren money).
      *   Irrationally expecting the *coins themselves* to reproduce ("Still no kids"), just like Aristotle argues moneylenders absurdly expect barren coins to "breed" through interest (*tokos*). His frustrated expectation highlights the unnaturalness Aristotle condemns.
  4.  **Intelligibility:** Anyone who has read *Politics* I.8-10 will recognize the core concepts being played with (use/exchange, natural/unnatural wealth-getting, barren money, the goat as a classic example of natural replenishment). No external scholarship is needed.
  5.  **The Humor:** The humor comes from the sandal-maker's hypocritical and ultimately self-defeating application of Aristotle's principles. He *thinks* he's being perfectly Aristotelian by swapping for the goat, but immediately undermines it by selling the goat for coin, revealing his true motive is still profit (*chrematistikē*). His final, literal expectation that the coins should reproduce like the goat is the absurd, logical endpoint of Aristotle's critique of usury and the misunderstanding of money's nature.

  This joke requires understanding Aristotle's specific arguments about the nature of objects, wealth, and the sterility of money to land the punchline effectively.
