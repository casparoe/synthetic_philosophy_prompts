prompt: |-
  If the Principal Principle requires that a rational agent's credence in an event match its objective physical chance whenever she lacks inadmissible evidence, then in an Everettian framework—where every quantum outcome is deterministically realized in some branch and the Born weights are interpreted as measures of branch thickness rather than as stochastic probabilities—doesn't the principle compel an agent to distribute credence across outcomes in proportion to those weights, even though every outcome is ontologically actualized in some branch? Furthermore, if deference to objective chance is meant to be modally stable—binding the agent not only in the actual world but in counterfactual scenarios where the quantum dynamics differ—how can it avoid reducing to a mere indexical rule about self-location, given that within any single branch the chance of the realized outcome appears to be either undefined or trivially one?
reasoning: |-
  Okay, the user is asking a really intricate question about the Principal Principle in the Everettian many-worlds interpretation. Let me unpack this step by step.

  First, they're pointing out a tension: in Everettian quantum mechanics, all possibilities happen in different branches, so the Born rule probabilities aren't about what "will happen" but rather about how "thick" each branch is. The Principal Principle normally tells us to set our beliefs based on objective chances, but here chances don't exist in the usual sense. So how does that work?

  Hmm, I recall David Wallace and Simon Saunders have written about this. They argue that even in Everett, rational agents should still use the Born weights to guide their credences. The key insight is that branch thickness affects self-location uncertainty. When you're about to measure a quantum event, you know you'll end up in some branch, but you don't know which one. The Born weights give the rational way to distribute that uncertainty.

  The user's second point is deeper though - they're asking about modal stability. If we imagine counterfactual worlds with different quantum laws, how can the Principal Principle hold? And doesn't this reduce to just self-location? 

  Ah, this is where the functionalist view comes in. The Everettian response would be: what we call "chance" is really this rational credence rule that's stable across possible quantum laws. It's not indexical because it's not about where you are, but about how the branching structure weights your future selves. The Born rule emerges as the uniquely rational way to handle branching.

  I should emphasize that this avoids the "undefined chance" problem. Within a single branch after measurement, there's no chance left - it's determined. But before measurement, the uncertainty is genuine self-location uncertainty across future branches. The Born weights constrain that uncertainty in a way that satisfies the Principal Principle's spirit.

  The user seems philosophically sophisticated - they're probing whether Everettians can save objective probability. I should acknowledge this is still controversial (Albert and Price disagree), but Wallace's decision-theoretic approach provides a coherent framework. The modal stability comes from the rule being law-invariant, not from chances existing fundamentally.

  This connects to bigger questions about how probability emerges from determinism. The user might be wrestling with whether Everett "solves" the probability problem or just relabels it. I should clarify that the solution is epistemic - it's about rational reasoning in a branching universe, not about stochastic physics.
answer: |-
  The Everettian interpretation presents a profound challenge to conventional probability concepts, but the Principal Principle (PP) can still motivate Born-weight-based credences through **self-locating uncertainty under branching**, while avoiding reduction to *mere* indexicality. Here's how this resolves your concerns:

  ### 1. **Credence and Branch Weight in Everett**
     - **No Stochastic Chance, but Epistemic Uncertainty**: In Everett, all outcomes occur deterministically. However, *before* measurement, an agent knows their future self will split into multiple branches. While all outcomes are ontologically real, the agent faces **self-locating uncertainty**: "Which branch will *I* (my current perspective) end up in?"
     - **Born Weights as Rational Credence Constraints**: The PP compels credence to match Born weights because:
       - **Inadmissible Evidence**: The agent knows the universal wave function and branching structure (admissible), but *not* which branch they will inhabit (inadmissible post-measurement indexical information).
       - **Objective Basis**: Born weights are objective physical facts derived from the wave function’s amplitude. Deferring to them isn't arbitrary—it's the only non-circular way to assign credences that respects quantum symmetries and avoids incoherence (Wallace, Deutsch).
       - **Decision-Theoretic Justification**: Agents who ignore Born weights face exploitable decision-theoretic inconsistencies (e.g., in quantum games). Rationality requires weighting branches by their Born measures.

  ### 2. **Modal Stability Without Collapse to Indexicality**
     - **PP as a Law-Invariant Rule**: The PP's modal stability applies to the *functional role* of chance. In Everett, "chance" is **defined by its role in guiding rational credence** under self-locating uncertainty. This role persists in counterfactual scenarios:
       - If quantum laws differed (e.g., different Hamiltonian), Born weights would change, and rational credences would follow. The PP binds agents to defer to *whatever physical quantity plays the chance-role* in their world.
     - **Beyond Indexicality**: While self-location is involved, credence isn't *merely* indexical:
       - **Indexical Uncertainty**: In classical multiverses (e.g., Boltzmann brains), credence is uniform over indistinguishable observers. But in Everett, branches have **unequal weights**, making credence proportional to Born measures a *physical* constraint, not a default symmetry.
       - **Chance as Emergent**: Born weights function as "caring measures" (Vaidman) or "credence weights" (Greaves). They quantify *how much* a future branch matters to pre-branching agents—grounded in quantum dynamics, not subjective indexing.

  ### 3. **Resolving the "Chance=1" Problem**
     - **Pre-Measurement vs. Post-Measurement**:
       - **Pre-measurement**: The agent is uncertain about future self-location. Born weights define objective chances *for them* at that time.
       - **Post-measurement**: In a specific branch, the outcome is known. "Chance" collapses to 1, but this is irrelevant—the PP only constrains agents *lacking* inadmissible evidence (i.e., pre-measurement).
     - **No Contradiction**: The PP applies *conditionally* on the agent’s epistemic state. Everett doesn’t require chance to be defined *within* a branch—it’s a global pre-branching concept.

  ### Conclusion
  In Everett, the Principal Principle survives by shifting from **ontic chance** (stochastic occurrence) to **epistemic guidance under branching**:  
  - Born weights are **physical facts** that rational agents *must* treat as chances due to unavoidable self-locating uncertainty.  
  - This deference is **modally stable** because it tracks the objective structure of quantum dynamics across counterfactuals.  
  - It transcends *mere* indexicality because weights are **unequal and physics-derived**, unlike uniform measures in symmetric multiverses.  

  **Objections & Limitations**:  
  Some (e.g., Albert, Loewer) argue this doesn’t recover "true" probability. However, within Everett’s ontology, Born-based credence is the only coherent account of rational action—making it the functional equivalent of chance, satisfying the PP’s intent without stochastic metaphysics.
