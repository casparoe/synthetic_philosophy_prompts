  Okay, let me tackle this user's query. They're describing a philosophical dilemma about lost evidence and indistinguishability. The user and their friend argued about whether two scenarios are meaningfully different: one where no evidence could ever settle a question versus cases where evidence existed but is now lost. 

  First, I need to parse their examples clearly. The colonial tax registers and database schema both present situations where current data can't distinguish between hypotheses, but historical evidence could have. The friend claims this collapses into "no evidence could ever exist," while the user feels there's a crucial difference.

  Hmm... this connects to several philosophical concepts. Underdetermination of theories comes to mind - where multiple hypotheses fit the data equally well. But standard underdetermination doesn't address whether distinguishing evidence once existed. Then there's identifiability in statistics, where models can't be distinguished given the data. Again, similar but not quite capturing the "lost evidence" aspect.

  The key distinction seems to be about epistemic access versus metaphysical possibility. The user's cases involve empirically decidable questions where the deciding factor is contingently inaccessible. That's different from fundamentally undecidable questions. 

  I recall the concept of "verification-transcendent truth" in philosophy - the idea that truth can exist beyond our ability to verify it. Putnam and Dummett debated this. The database case especially illustrates this well: there was a factual answer that's now unknowable.

  For terminology... "epistemically irrecoverable underdetermination" might work, but it's clunky. "Contingent underdetermination" emphasizes the temporary nature. Or perhaps "metaphysical residue" to capture the persisting factual difference. 

  The edges matter too. If evidence was merely possible but never recorded, it's closer to fundamental underdetermination. But in the user's cases, evidence actually existed (headers were printed, schema files existed). That makes it contingent loss rather than inherent indistinguishability.

  Practically, historians deal with this by contextual inference or probabilistic weighting. But sometimes we must accept indeterminate unknowns. The user's instinct to distinguish "lost evidence" from "no possible evidence" seems philosophically sound - it preserves the fact that some truths outrun knowability contingently rather than necessarily.

  For the answer... no perfect term exists. "Verification-transcendent underdetermination" comes closest by combining epistemology with the underdetermination framework. But I'll propose "contingent empirical indistinguishability" to emphasize the temporary/loss aspect. Final answer will need to balance precision with usability.
answer: |-
  Your frustration is palpable, and you've pinpointed a genuinely subtle epistemic category. Your instinct that this is distinct is correct, and your friend's position, while pragmatic, conflates *epistemic access* with *metaphysical possibility*. Let's carve this carefully.

  **The Core Distinction: Epistemically Irrecoverable vs. Fundamentally Undecidable**

  1.  **Fundamentally Undecidable (Your "Second Kind"):** No evidence *could ever* exist to distinguish Hypothesis A (H_A: household unit) from Hypothesis B (H_B: tax group). This is a property of the *world itself* or the *concepts involved*. (Example: "Was the universe created last Thursday with false memories?" - no evidence *could* settle this). This aligns with *logical underdetermination* or *non-identifiability by design* in statistics (e.g., an unconstrained parameter in a model).
  2.  **Epistemically Irrecoverable (Your "Middle Kind"):** Evidence *did exist* or *could have empirically existed* at a specific past time to decisively distinguish H_A from H_B. This evidence is now *permanently inaccessible* due to contingent historical loss (fire, death, deletion). The difference between H_A and H_B is *factual and was once empirically verifiable*. This is a property of our *historical access* to the world, not the world's structure. (Your tax register header, database schema).

  **Relation to Established Ideas & Differences:**

  *   **Underdetermination of Theory by Data (Quine, Duhem):** Both kinds are underdetermined *by currently available evidence*. However, standard underdetermination often encompasses *both* fundamental and contingent cases. Your carving isolates the *contingent historical loss* subtype. Underdetermination doesn't inherently specify *why* more evidence isn't available.
  *   **Statistical Non-Identifiability:** This directly maps. Your cases are classic non-identifiable models given the observable data. Crucially, non-identifiability *can arise* either because the model structure itself makes parameters inseparable *even with infinite data* (fundamental), or because the *necessary data is missing* (contingent/epistemically irrecoverable). Your cases are the latter. The burned header/schema represent the missing variables needed for identification.
  *   **Verification-Transcendent Truth (Metaphysical Realism vs. Anti-Realism - Dummett, Putnam):** This is the deepest connection. You posit that there *is* a fact of the matter (H_A or H_B is true) that *outruns our ability to verify it*, not because verification is impossible *in principle*, but because the means of verification *existed and are lost*. This distinguishes it from fundamentally undecidable propositions where verification *is* impossible in principle. Your position aligns with a robust metaphysical realism about the past: the truth exists independently of our capacity to know it, contingent loss doesn't erase that truth.

  **Why Your Friend is Wrong (Collapse Doesn't Occur):**

  Your friend collapses "no evidence *can* ever settle it" (fundamental) into "no evidence *we can access* can settle it" (contingent). This is an *epistemic* collapse, ignoring the *metaphysical* distinction:
  *   **In the Contingent Case:** There *was* a state of affairs (the header text, the schema) that *causally fixed* whether H_A or H_B was true. This state *was* empirically accessible. Its loss is a historical accident.
  *   **In the Fundamental Case:** No such state of affairs ever existed or could exist to fix the truth value in an empirically accessible way.
  The difference lies in the *history of empirical decidability*. From our *current* epistemic vantage point, they *are* indistinguishable, but the *reasons* for indistinguishability are ontologically different.

  **What To Do With Such Questions:**

  There's no single answer; the approach depends on context and goals:
  1.  **Acknowledge Indeterminacy:** Clearly state the question is empirically undecidable *given available evidence*. This is essential for intellectual honesty.
  2.  **Contextual Inference:** Weigh the hypotheses based on *other* historical knowledge, prior probabilities, theoretical coherence, or practical consequences. (e.g., "Household units were more common in similar colonies at that time," or "Adding a null column would be unusual in that database version"). This doesn't settle it but may guide plausible belief or action.
  3.  **Accept Metaphysical Determinacy / Agnosticism:** Recognize that one answer *is* factually correct, but we are irrevocably ignorant of it. This preserves the distinction you value. Alternatively, adopt a pragmatic agnosticism: "We cannot know, and for our purposes, it doesn't matter which we assume."
  4.  **Pragmatic Choice:** Choose the hypothesis that makes the model simpler, the narrative more coherent, or the calculation easier, *explicitly acknowledging* the arbitrary nature of the choice. (e.g., "Assume households for population estimates, noting the potential doubling error").

  **Edges and Nuances:**

  *   **Recorded vs. Merely Recordable:** This *matters significantly*.
      *   **Recorded & Lost (Tax Header, Schema):** This is the clearest case of epistemically irrecoverable underdetermination. The evidence *existed*.
      *   **Merely Recordable (e.g., "If only someone had asked the clerk..."):** This blurs towards fundamental underdetermination. While the fact *could* have been known, the lack of recording means no *trace* was ever created. It's harder to assert a *specific piece of lost evidence*. It becomes more akin to *any* unrecorded historical fact. It strengthens the epistemic position but weakens the metaphysical "lost evidence" claim slightly.
  *   **Out of Reach for Us vs. Everyone:** This matters less for the *category* and more for the *finality*.
      *   **Irrecoverable for Us (e.g., schema lost, but colleague might remember):** Still epistemically irrecoverable *for your project/timeline*. The *possibility* of access exists elsewhere/temporarily.
      *   **Irrecoverable for Anyone (e.g., last witness died, last copy burned):** This is the purest case of permanent epistemic irrecoverability. The bridge to the factual truth is completely gone.

  **The Term: Epistemically Irrecoverable Underdetermination**

  This term captures the essence:
  *   **Underdetermination:** The core problem – multiple hypotheses fit the available data.
  *   **Epistemically Irrecoverable:** Specifies the *reason* for the underdetermination – the evidence needed for determination *did or could have existed empirically* but is now *permanently inaccessible* due to contingent loss.

  **Why not coin something entirely new?** While evocative terms like "Metaphysical Residue" or "Contingent Blackout" capture aspects, "Epistemically Irrecoverable Underdetermination" (EIU) is more precise, descriptive, and clearly situates the concept within established philosophical and statistical discourse (underdetermination, non-identifiability, epistemic access). It directly names the two key components you identified.

  **Conclusion:**

  You've identified a crucial nuance within underdetermination/non-identifiability: cases where the indistinguishability stems from *contingent historical loss of once-existent (or empirically possible) deciding evidence*, preserving a metaphysical fact of the matter. This differs from fundamental indistinguishability. Historians, archivists, and scientists confront EIU regularly. The appropriate response is acknowledging the indeterminacy while recognizing the lost factual truth, using contextual clues for pragmatism, and resisting the collapse your friend proposes, which erases an important distinction about the nature of historical reality and our access to it.

  \answer{epistemically irrecoverable underdetermination}
