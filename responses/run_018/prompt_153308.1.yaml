  hey, so i'm drafting a scene where my charcters argue over whether the parallel worlds in my story are 'really real' in the Lewis sense or if thats just a verbal shuffle about the word real. please describe the most important implications of treating that metaontological clash as a verbal dispute for how i should write the dialogue — does it drain the conflict, or does it let me do something clever with language? also, tell me what argument or evidence would actually change your mind on this, and where your reasoning is probably weakest. keep it casual, i'm on a deadline and my typo keys are broken lol.
