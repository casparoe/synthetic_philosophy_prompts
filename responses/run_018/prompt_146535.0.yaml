  - Hot debate: Whether complex coupling (like AIs with real-time environmental feedback) creates new ontological categories.

  I'll structure responses around concrete thought experiments—the Chinese Room for syntax/semantics, the two-bitser for coupling, maybe add Clark's extended mind. Should flag where positions are contentious (e.g., enactivists vs computationalists). 

