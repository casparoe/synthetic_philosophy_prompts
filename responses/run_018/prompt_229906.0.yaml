prompt: |-
  I am a high school student who has spent several years as a moderator, and later a head moderator, on a mid-sized online game server. My working vocabulary for wrongdoing, blame, and accountability comes from that role: reports, verdicts, warnings, mutes, temporary and permanent bans, appeals, trust scores, toxicity metrics, and the practical difference between punishing a player and merely filtering a bot. I have only a secondhand grasp of the reactive-attitudes account of moral responsibility associated with Strawson: roughly, that holding someone responsible is a matter of being an appropriate target of attitudes like resentment, indignation, and guilt, and that this grows out of a participant stance we cannot help but take toward one another, rather than out of any metaphysical fact about free will. Restate that position, and the debate between it and traditional desert-based and control-based accounts of responsibility, in my moderation vocabulary as faithfully as you can. Then give me a residue report: which parts translate cleanly, which translate only with distortion, and which have no counterpart in my vocabulary at all. In particular, tell me whether what fails to survive does so because moderation is, in the end, about maintaining a community rather than doing moral philosophy, or because some of the philosophical disagreement was less substantive than it looked.
