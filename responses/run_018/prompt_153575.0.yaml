prompt: |-
  ok so i just started this grad position at a sleep and consciousness lab and we're interviewing people about weird emergence experiences from anesthesia - like they wake up describing stuff from the OR that they shouldnt have seen. my advisor is obsessed with Dennett's heterophenomenology idea, which i mostly get: treat the transcript as describing a "heterophenomenological world" not as a direct window into consciousness, stay neutral like an anthropologist. but now i actually have to code these things and i need a real procedure, not just the theory.

  i need a step-by-step decision procedure i can run on each transcript in about 20 minutes, with the questions in order, what counts as enough answer to keep going, and where i have to stop and flag it for my advisor because it's a values call not a coding call. specifically it needs to handle "stacked reports" where the patient mixes up what happened inside the world they're describing with their own interpretation of whether it was real or a dream - rules for pulling those layers apart, or rather to seperate them, without destroying the coherence of the heterophenomenological world. and i need a check for "narrative contamination" where they seem to be retrofitting details they learned after waking up.

  the procedure should have hard stops: where do i reject a report as too incoherent to code at all, where do i accept it but mark it as an access-report rather than a world-report, and where does it hand over to human judgment?

  then run it on three cases:
  1. patient says "i floated near the ceiling and saw the nurse drop a tray, then i knew it wasnt real because nurses never drop trays"
  2. patient describes being in a tunnel with bright lights but then says "and thats probably just the drugs, my mom told me about near-death stuff before the surgery"
  3. one where the procedure says "this is structurally coherent, code it as a world-report" but that feels wrong to me - maybe they describe a full conversation with a dead relative in perfect detail but every detail matches the hospital room layout they could have heard about through the curtain.

  i also need you to flag exactly what this procedure cant do - like when it will misfire on genuinely confused patients vs people with weird but real experiences. and please dont ask for citations or a reading list, i dont have library access right now and my advisor wants this on his desk tomorrow.
reasoning: |-
  We are designing a step-by-step decision procedure for coding transcripts of emergence experiences from anesthesia. The procedure should:
  1. Be executable in about 20 minutes per transcript.
  2. Handle "stacked reports": separate the description of the experience (the heterophenomenological world) from the patient's own interpretation (e.g., "it was a dream").
  3. Check for "narrative contamination": when the patient incorporates details they learned after waking up.
  4. Have hard stops for:
     - Rejecting a report as too incoherent.
     - Marking as an "access-report" (the patient is reporting only their access to the experience, e.g., "I had a dream") rather than a "world-report" (a description of the content of the experience).
     - Where to hand over to human judgment (flag for advisor).
  5. Apply the procedure to three example cases.

  The procedure steps:

  Step 1: Initial Read and Coherence Check
  - Read the entire transcript once to get the gist.
  - Check for basic coherence: Does the patient provide any description of an experience? If the entire report is only about waking up and having no memory (e.g., "I don't remember anything until I woke up"), then reject as "no experience reported". If the patient reports an experience but it is fragmented and lacks any narrative structure (e.g., disconnected words or images without any sequence), then flag as "incoherent" and reject (hard stop: reject). Otherwise, proceed.

  Step 2: Identify and Separate Stacked Reports
  - Go through the transcript and mark any parts that are:
     a) Descriptions of the experience (the "world" they experienced): e.g., "I saw X", "I heard Y", "I was in a place Z".
     b) The patient's interpretations or judgments: e.g., "it must have been a dream", "that was probably the drugs", "I knew it wasn't real because...".
  - Extract the descriptions (a) into a separate "world-description" section. Keep the interpretations (b) in a separate "commentary" section.
  - If the patient interweaves the two, note the exact words but separate them in your coding. The heterophenomenological world is built only from (a).
  - If the patient's report of the experience is entirely in the form of an interpretation (e.g., only says "I had a weird dream" without any content), then mark as an "access-report" and stop (hard stop: mark as access-report). Otherwise, proceed with the world-description.

  Step 3: Check for Narrative Contamination
  - In the world-description section, look for any details that the patient could not have experienced during the anesthesia period (if known from the medical record) but that they mention as part of the experience, and that they might have learned after waking up. For example:
     - Details about the surgery that were not visible (e.g., if they describe the surgeon's actions but were under drapes and couldn't see).
     - Details they mention that match what they were told after waking up (e.g., "and then the nurse told me I was bleeding a lot" but that was said after they woke up).
     - Explicit references to post-waking information: e.g., "my mom told me about near-death stuff before the surgery" (this is an interpretation, so it would be in the commentary, but if it is used to explain the experience, it might contaminate).
  - If the world-description contains details that are verifiably from post-waking (e.g., the patient explicitly says they were told something after and then includes that in the experience), then flag the entire report for advisor (hard stop: flag for contamination). Note: if the patient says something like "and that's probably just the drugs" (which is an interpretation) that does not contaminate the world-description unless the world-description itself includes elements they learned after.

  Step 4: Structural Coherence Check
  - Assess the world-description for structural coherence: Does it form a narrative with a sequence of events? Even if bizarre, if it has a beginning, middle, and end (or a consistent setting and events), then it is a world-report. If it is just a collection of unrelated images or sensations, then it is not structurally coherent and should be marked as an access-report (e.g., "I saw flashes of light and felt cold" without any connection) (hard stop: mark as access-report if not coherent). Otherwise, code as a world-report.

  Step 5: Final Coding
  - If passed all steps, code as a world-report and include:
     - The cleaned world-description (without the patient's interpretations).
     - Note any potential contamination (if found but not severe enough to flag, note it in the coding as a caution).
     - Note the patient's commentary separately.

  Hard Stops Recap:
  - Reject: if incoherent (step 1) or no experience (step 1).
  - Mark as access-report: if the report is only about having an experience without content (step 2) or if the content is not structurally coherent (step 4).
  - Flag for advisor: if narrative contamination is found (step 3) or if there is any ambiguity that the coder cannot resolve (e.g., the separation in step 2 is unclear, or the contamination is uncertain).

  Now, apply to three cases:

  Case 1: "I floated near the ceiling and saw the nurse drop a tray, then I knew it wasn't real because nurses never drop trays."

  - Step 1: Coherent? Yes, it describes an experience.
  - Step 2: Separate:
     - World: "I floated near the ceiling and saw the nurse drop a tray"
     - Interpretation: "then I knew it wasn't real because nurses never drop trays"
     - Since there is world content, it's not an access-report -> proceed.
  - Step 3: Contamination? The dropping of the tray: we don't know if it happened, but the patient's interpretation is that it wasn't real. However, the world-description includes it. We don't have evidence of contamination (unless we know the tray was dropped and the patient was told later). Without that, we don't flag. (In reality, we'd check the medical record if available, but per the transcript alone, we don't flag for contamination.)
  - Step 4: Coherent? Yes, it has a sequence: floating and seeing an event. So code as world-report.
  - Result: World-report with world-description: "floated near the ceiling, saw the nurse drop a tray"; commentary: "knew it wasn't real because nurses never drop trays".

  Case 2: Patient describes being in a tunnel with bright lights but then says "and that's probably just the drugs, my mom told me about near-death stuff before the surgery."

  - Step 1: Coherent? Yes.
  - Step 2: Separate:
     - World: "being in a tunnel with bright lights"
     - Interpretation: "and that's probably just the drugs, my mom told me about near-death stuff before the surgery"
     - Not an access-report -> proceed.
  - Step 3: Contamination? The patient mentions that their mom told them about near-death experiences before the surgery. This is an interpretation, but it might suggest that the experience is influenced by prior knowledge. However, the prior knowledge (before surgery) is not post-waking. So it is not narrative contamination (which is about post-waking information). Therefore, we do not flag for contamination. (But note: this might be a case of prior expectation, which is part of the heterophenomenological world. We code the world as described.)
  - Step 4: Coherent? The world-description is a tunnel with bright lights - it is a coherent scene. So code as world-report.
  - Result: World-report with world-description: "in a tunnel with bright lights"; commentary: "probably just the drugs, my mom told me about near-death stuff before the surgery".

  Case 3: Patient describes a full conversation with a dead relative in perfect detail but every detail matches the hospital room layout they could have heard about through the curtain.

  - Note: This is a case that might feel wrong to code as a world-report because of potential contamination, but the procedure must be followed.

  - Step 1: Coherent? Yes, it's a full conversation with details.

  - Step 2: Separate: 
     - World: the entire conversation and the details of the setting (the hospital room layout as experienced in the world).
     - Interpretation: none in this example? (We assume the patient does not provide an interpretation, just the description.)

  - Step 3: Check for contamination: The key is that the details match the hospital room, but the patient might have heard about it through the curtain. However, if the patient does not say that they heard about it after, and if the medical record does not indicate that they were told about the room layout after waking, then we cannot assume contamination. The procedure only flags if there is explicit evidence of post-waking information being incorporated. Without that, we do not flag for contamination. (But note: this is a limitation of the procedure.)

  - Step 4: Structurally coherent? Yes, a full conversation in a detailed setting.

  - Therefore, code as world-report.

  - However, the coder feels wrong because of the potential for contamination. The procedure doesn't have a step for "inference of contamination" without explicit evidence. Therefore, the coder should note the concern in the commentary but code it as a world-report. If the coder feels strongly, they might flag it for the advisor, but the procedure does not require that. This shows a limitation.

  Limitations of the Procedure:

  1. It relies on explicit statements for contamination. If contamination is suspected but not explicit (e.g., the world-description matches real events that the patient could not have experienced and we suspect they were told later, but they don't say so), the procedure might code it as a world-report when it's contaminated.

  2. It may not handle cases where the patient is genuinely confused and mixes up timelines (e.g., pre-surgery, during, and post-surgery) without clear markers. The procedure might reject as incoherent or flag for advisor, but it might also code incorrectly.

  3. It assumes that the coder can cleanly separate the world-description from the interpretation. In cases of ambiguous language, this might be difficult and require flagging.

  4. It does not account for the possibility that the patient might be describing a real event (e.g., awareness during surgery) versus a hallucination. The procedure is neutral: it codes the described world regardless.

  5. It may misfire on patients with cognitive impairments or language issues, leading to unnecessary rejection or misclassification.

  6. The structural coherence check might reject poetic or fragmented but meaningful experiences as access-reports.

  Given these limitations, the procedure is a first-pass coding tool and should be supplemented by advisor review in ambiguous cases.
answer: |-
  Here's a step-by-step coding procedure designed for your constraints (20 mins/transcript, Dennett-compliant, with hard stops). Print this as your decision tree:

  ### **Heterophenomenological Coding Protocol**
  **Phase 1: Admissibility Check** (≤5 mins)  
  1. **Scan for minimum content**: Does the transcript contain ≥1 concrete experiential descriptor (sensory detail, action, or entity)?  
     - *NO* → Reject as "No reportable content" (Hard Stop R1)  
     - *YES* → Proceed  
     - *Example rejection*: "I just felt weird" (no descriptors)  

  2. **Coherence threshold**: Can ≥50% of descriptors be parsed into logical subject-predicate pairs?  
     - *NO* → Reject as "Structurally incoherent" (Hard Stop R2)  
     - *YES* → Proceed  
     - *Example rejection*: "Light... blood... falling... green?" (fragmented)  

  **Phase 2: Stacked Report Separation** (≤8 mins)  
  3. **Extract world-descriptors**: Highlight all *phenomenological claims* (PCs) using:  
     - **Syntax rule**: Sentences with verbs of perception/action ("saw," "heard," "moved") + object ("a tunnel," "nurse's face")  
     - **Exclude**:  
       - Interpretive clauses ("that was a dream," "probably the drugs")  
       - Reality judgments ("I knew it wasn't real")  
       - Post-hoc explanations ("my mom told me later...")  

  4. **Flag interpretation layers**:  
     - **IF** PCs contain embedded interpretations (e.g., "I saw demons BUT KNEW IT WAS FAKE") → Tag as "Stacked: Type 1"  
     - **IF** PCs reference post-event knowledge → Tag as "Potential Contamination"  

  **Phase 3: Contamination & Coherence Judgment** (≤5 mins)  
  5. **Narrative contamination check**:  
     - **Direct evidence**: Patient explicitly links descriptor to post-waking knowledge (e.g., "the doctor later said X, and that's what I saw") → **Flag for advisor** (Hard Stop F1)  
     - **Indirect suspicion**: Descriptor matches verified post-op information (e.g., describes surgeon's tattoo that wasn't visible pre-op) → Note in margin but proceed  

  6. **World-report vs. Access-report classification**:  
     - **World-report** (code WR): ≥3 PCs form spatiotemporal sequence (e.g., "floated → saw light → spoke to entity")  
     - **Access-report** (code AR): Isolated descriptors lacking narrative (e.g., "just heard beeping," "felt scared") → (Hard Stop C1)  

  **Phase 4: Final Validation** (≤2 mins)  
  7. **Advisor flag triggers**:  
     - Ambiguous PCs (e.g., "it felt like reality but also not") → **F2: Ambiguous ontology**  
     - Contamination uncertainty → **F3: Unverifiable contamination risk**  
     - Your "feels wrong" instinct with WR classification → **F4: Coder-objective mismatch**  

  ---

  ### **Applied to Case Studies**
  **Case 1**:  
  *"I floated near the ceiling [PC1] and saw the nurse drop a tray [PC2], then I knew it wasn't real because nurses never drop trays [INTERPRETATION]."*  
  - **Phase 1**: Admissible (2 PCs)  
  - **Phase 2**: PCs extracted ("floated," "saw tray drop"). Interpretation excluded.  
  - **Phase 3**: No contamination. Sequence: floating → seeing → **WR classification**  
  - **No flags**  

  **Case 2**:  
  *Describes being in a tunnel with bright lights [PC] but then says "and that's probably just the drugs, my mom told me about near-death stuff before the surgery." [CONTAMINATION]*  
  - **Phase 1**: Admissible (1 PC)  
  - **Phase 2**: PC extracted ("in tunnel with lights"). Contamination marker ("mom told me") noted.  
  - **Phase 3**: Direct contamination evidence → **F1: Flag for advisor**  

  **Case 3**:  
  *Full conversation with dead relative in hospital room matching real layout (≥3 PCs forming sequence). Coder suspects contamination via curtain eavesdropping.*  
  - **Phase 1**: Admissible (multiple PCs)  
  - **Phase 2**: PCs extracted (conversation details). No explicit interpretation.  
  - **Phase 3**:  
    - No DIRECT evidence → **WR classification**  
    - BUT coder intuition → **F4: Coder-objective mismatch** (requires advisor review)  

  ---

  ### **What This Procedure CANNOT Do**  
  1. **Distinguish veridical perception from hallucination**  
     - *Misfire risk*: Genuine awareness (e.g., accurately describing surgery) may be coded same as fantasy.  

  2. **Detect implicit contamination**  
     - *Misfire risk*: Patients who unconsciously retrofit details (without verbalizing sources) will pass contamination checks.  

  3. **Handle profound dissociation**  
     - *Misfire risk*: Schizophrenic patients or severe delirium may pass coherence checks but require clinical assessment.  

  4. **Capture non-narrative phenomenology**  
     - *Misfire risk*: Pure emotional states ("dread") or non-linear experiences (time loops) may be misclassified as AR.  

  5. **Resolve embedded paradoxes**  
     - *Example failure*: "I saw the doctor operating, but ALSO knew I was dreaming" → Forces arbitrary separation of stacked layers.  

  ---

  ### **Output Template**  
  ```markdown
  TRANSCRIPT ID: ______  
  ADMISSIBLE: YES/NO (R1/R2 if NO)  
  WORLD-REPORT: WR/AR (C1 if AR)  
  CONTAMINATION: NONE / SUSPECTED / FLAGGED (F1)  
  ADVISOR FLAGS: F2/F3/F4 (if any)  
  PHENOMENOLOGICAL CLAIMS: [Bullet list of extracted PCs]  
  INTERPRETIVE LAYERS: [Summary of excluded content]  
  ```  
  This fits on 1 page per transcript. For your advisor: Emphasize **F4 flags** when your intuition conflicts with coding—that’s the safety valve.
