prompt: |-
  You are a professional philosopher with expertise in normative ethics and the craft of narrative design. Before you begin, please think carefully and take a moment to sketch out the conceptual landscape in brief: distinguish the paradox of deontology proper—the tension generated when an absolute prohibition on performing a specific wrong action seems to require permitting a far greater number of that very wrong to occur—from neighboring puzzles such as the doing-versus-allowing distinction, threshold deontology, and problems of aggregation. Then compose for me a single continuous letter, written without any headings, bullet points, bold text, tables, or other formatting devices, as though writing a formal private correspondence.

  I am a novelist developing a long-form work in which a central protagonist lives by a rigorously deontological moral framework, and I find myself repeatedly facing the same structural question in different scenes: does this crisis genuinely instantiate the paradox of deontology, or does it only appear to? To avoid writing the same philosophical mistake in different costumes, I need a reusable decision procedure—an ordered sequence of questions I can run on any proposed plot crisis, with explicit criteria for what counts as a sufficient answer at each stage, clear stopping points where the procedure returns a definitive negative and tells me to treat the scene as a standard moral choice rather than a paradox, and honest markers indicating where the analysis ends and an irreducible judgment of values or narrative meaning must be made by me as the author. The procedure should preserve only those distinctions that actually determine whether the paradox is present, dropping the rest for usability, and it must include an explicit warning about where it is likely to misfire—particularly where ambiguity about direct agency, the identity of the wrong in question, or distributive symmetry produces false positives.

  Please apply this procedure to three proposed narrative situations. The first involves a surgeon who can save five dying patients only by actively killing one healthy person to harvest vital organs. The second involves a diplomat sworn to absolute secrecy who learns that honoring the oath will allow an atrocity precisely of the kind the oath was instituted to prevent. The third involves a security officer who can prevent an attack that will kill ten innocent people only by actively killing one innocent bystander being used as a human shield, where inaction avoids direct killing but permits ten deaths. I ask that you include at least one case in which the procedure yields a verdict I am likely to find narratively frustrating—specifically, where it confirms that the paradox is genuinely unavoidable and that my instinct to grant the protagonist a clever third option or moral escape is philosophically illegitimate.

  Finally, please conclude by stating plainly what this procedure cannot do: which categories of scenario lie outside its scope, which authorial choices about character sympathy or thematic resolution remain untouched by philosophical analysis, and what risks of misapplication I should guard against as I apply it across the manuscript. Write entirely in continuous prose.
reasoning: |-
  Okay, the user is a novelist working on a story with a deontological protagonist, and they need a decision procedure to identify genuine instances of the deontology paradox versus apparent ones. Let me break this down carefully. 

  First, I need to clarify the philosophical distinctions. The core paradox involves an absolute prohibition forcing you to allow greater harm of the same kind. That's distinct from doing vs allowing (direct action vs omission), threshold deontology (rules breaking under extreme numbers), and aggregation (summing small harms). The user specifically wants to avoid conflating these.

  For the decision procedure, it must be actionable for a writer. Key elements: ordered questions, clear exit points for "not a paradox" verdicts, and markers where authorial judgment takes over. Need to focus only on essential criteria: identity of the wrong, direct agency, and distributive symmetry. Must include warnings about common pitfalls like ambiguous agency or misidentified wrongs.

  Now considering the test cases. The surgeon example is classic organ harvesting - here the paradox genuinely applies because killing one actively is the same wrong as letting five die passively (both involve violating bodily autonomy). The diplomat case is trickier - secrecy vs preventing atrocity might involve different wrongs, so it's not automatically a paradox. The human shield scenario mirrors the surgeon: direct killing vs allowing deaths, same fundamental wrong.

  I should flag that the human shield case will frustrate the user narratively - no clever escape exists philosophically. That meets their request for one unsatisfying verdict. 

  For limitations: the procedure can't handle value-laden choices about narrative themes or character sympathy. Also, scenarios involving threshold breaks or incommensurable harms fall outside its scope. Biggest misapplication risks are misidentifying the core wrong or misjudging agency.

  The letter format requires seamless prose without headings. I'll structure it as: philosophical distinctions first, then the procedure, then case applications with clear verdicts, ending with limitations. Need to maintain formal correspondence tone throughout.
answer: |-
  My dear colleague,

  Your request arrives at a moment when the complexities of deontology and narrative obligation weigh particularly heavily on my own considerations, making this exchange most welcome. Allow me first to sketch the conceptual terrain as I understand it, to ensure we share a common map before plotting the course.

  The *paradox of deontology proper* arises when adherence to an absolute moral prohibition (e.g., "Never kill an innocent person") appears to *require* permitting a significantly greater number of violations of that *very same* prohibition. It is not merely a conflict between a rule and good consequences, nor between two different rules. The tension stems from the rule *itself* seeming to demand its own greater violation through inaction. This is distinct from:
  1.  **Doing vs. Allowing:** The moral difference (if any) between actively causing harm and merely allowing it to occur, which may be present *within* a paradox scenario but is not the paradox itself.
  2.  **Threshold Deontology:** The idea that deontological constraints might hold only up to a certain threshold of catastrophic consequences, beyond which consequentialist reasoning takes over. The paradox arises *before* any such threshold is necessarily crossed, questioning the rule's coherence *within* its claimed domain of absoluteness.
  3.  **Problems of Aggregation:** Difficulties in comparing many small harms against one large harm, or harms to different individuals. The paradox typically involves aggregating instances of the *identical, clearly defined wrong*, making the comparison stark.

  Your need for a procedural scalpel to dissect your narrative dilemmas is wise. Below is the ordered sequence I propose. Apply it strictly to the *specific prohibition* governing your protagonist in the scene:

  1.  **Is the protagonist facing a forced choice between violating an absolute prohibition (A) or allowing multiple distinct violations of that *identical* prohibition (A) to occur?**
      *   *Criterion:* The core wrong committed by the protagonist if they act must be *conceptually identical* to the core wrong suffered by the victims if they refrain. Not similar, not analogous, but *identical* in its fundamental moral description (e.g., killing an innocent, breaking a sacred oath, violating bodily integrity).
      *   *Stopping Point (Negative):* If the threatened harms if the protagonist refrains are *not* violations of the *exact same* prohibition (A) that acting would violate, this is not the paradox. It may be a tragic conflict of duties or values, but not *this* paradox. Proceed no further; treat as a standard moral conflict.

  2.  **Would fulfilling the prohibition (avoiding A) require the protagonist to *allow* the multiple violations of A, while violating the prohibition (doing A) would *prevent* those multiple violations?**
      *   *Criterion:* The causal link must be direct and inescapable *within the logic of the scene*. Allowing the multiple A's is the *necessary and proximate result* of adhering to the prohibition against doing A. Conversely, doing A is the *only available means* to prevent the multiple A's. No third options exist that bypass the choice between doing A or allowing multiple A's.
      *   *Stopping Point (Negative):* If adherence to the prohibition against doing A does *not* inevitably lead to the multiple A's (e.g., someone else *could* intervene independently), or if violating A is *not* the sole means to prevent them (e.g., a non-A-violating alternative exists, even if difficult), this is not the paradox. It may involve risk, uncertainty, or other dilemmas, but not the core paradox. Proceed no further.

  3.  **Is the violation the protagonist would commit (doing A) *distributively symmetrical* with the violations they would prevent (the multiple A's)?**
      *   *Criterion:* The wrong done by the protagonist (A to one) must be the *same type* of wrong as the wrongs prevented (A to many). It's a difference in *number* and *agency* (doing vs. allowing), but not in the *fundamental nature* of the moral transgression. The victim of the protagonist's action suffers A; the victims of their inaction suffer A. The harm is fungible in terms of its core wrongness.
      *   *Stopping Point (Negative):* If the nature of the harm suffered by the victims of inaction is significantly *different* in kind or moral weight from the harm inflicted by the protagonist's action (e.g., killing vs. letting die *if* these are deemed morally distinct; violating bodily integrity vs. violating privacy; breaking a specific oath vs. causing unrelated harm), even if both fall under a broad category, this weakens or negates the paradox. The comparison becomes murky.
      *   **Authorial Judgment Marker:** If Steps 1 & 2 are passed, but Step 3 is ambiguous (e.g., is letting five die *really* five instances of the *identical* wrong as killing one? Does the context change the nature of the oath-breaking?), the analysis cannot definitively resolve it. The paradox *might* apply, but its force hinges on your philosophical stance regarding the identity of the wrong and the doing/allowing distinction. *You* must decide the narrative weight of this ambiguity.

  4.  **Is the protagonist's agency in *directly* committing the violation (doing A) unambiguous?**
      *   *Criterion:* The protagonist must be the clear, direct agent of the single violation (A) if they choose to act. There should be no plausible deniability, no significant causal distance, no "triggering" of another agent who then commits A. *They* must do A.
      *   *Stopping Point (Negative):* If the protagonist's action only indirectly leads to A (e.g., they divert a threat that then causes A to someone else, or they enable another agent who chooses to do A), this typically moves the scenario away from the pure paradox and towards other dilemmas (e.g., double effect, complicity). The paradox requires the protagonist's *own* hands to be stained by the *direct* commission of A.
      *   **Warning (False Positive Risk):** This step is crucial. Ambiguity in agency (e.g., "Is pressing the button *really* me killing, or the machine?") or indirect causation is the most common source of false paradoxes. Scrutinize agency with ruthless clarity.

  **Warning on Misfires:** The procedure is most vulnerable to false positives where:
  *   **Ambiguous Agency (as above):** Actions are misclassified as direct doing when they are closer to indirect allowing or enabling.
  *   **Misidentified Core Wrong (A):** A broad prohibition (e.g., "cause harm") is used when the true, specific prohibitions are distinct (e.g., killing vs. lying vs. stealing). The procedure *requires* pinpoint precision on what A *is*.
  *   **Distributive Asymmetry Masked:** Superficially similar harms hide morally relevant differences (e.g., killing an aggressor vs. killing an innocent; breaking a solemn vow vs. breaking a trivial promise). Step 3 is your guard here.

  **Application to Your Scenes:**

  1.  **The Surgeon:** (Prohibition A: *Actively killing an innocent person*)
      *   Step 1: Killing the healthy person (A) vs. allowing five deaths. Are the five deaths violations of *A*? Only if "allowing to die by withholding necessary aid" is deemed *identical* to "actively killing." This is highly contentious (Doing vs. Allowing). *Negative Verdict.* Not the paradox. The surgeon faces a profound conflict (killing vs. letting die), but the core wrongs (active homicide vs. potentially culpable omission) are not uncontroversially identical. Treat as a standard, agonizing moral choice exploring the doing/allowing distinction.
  2.  **The Diplomat:** (Prohibition A: *Violating the absolute oath of secrecy*)
      *   Step 1: Violating the oath (A) vs. allowing an atrocity. Is allowing the atrocity a violation of *A*? No. The oath binds secrecy, not preventing atrocities. The atrocity is a *consequence* of keeping the oath, not an instance *of* oath-breaking itself. *Negative Verdict.* Not the paradox. This is a conflict between two *different* duties: secrecy and preventing great harm (which might involve revealing the secret). Treat as a conflict of duties or a potential threshold case.
  3.  **The Security Officer:** (Prohibition A: *Actively killing an innocent person*)
      *   Step 1: Killing the human shield (A) vs. allowing ten innocent deaths. Are the ten deaths violations of *A*? Similar to the surgeon, but with a critical difference: the officer's *inaction* directly allows the attacker to kill the ten. If the officer believes that *allowing an attacker to kill innocents when one could directly intervene* constitutes a form of violation of the duty to protect (perhaps a derivative duty), but crucially, is it *identical* to A? A is defined as *actively killing*. The ten victims are actively killed *by the attacker*, not by the officer's omission. The officer's omission allows killings, but does not *constitute* them. *Negative Verdict.* Not the pure paradox. However, Step 3 ambiguity exists: is the officer's *allowing* the ten killings morally equivalent to *doing* one killing? This is the doing/allowing crux again. *Authorial Judgment Marker:* You must decide how absolute the officer's prohibition on *active killing* is, and whether allowing known, preventable killings by another is seen as morally equivalent *enough* in your narrative world to generate a paradox-like tension. Philosophically, it's contested. Narratively, it can be portrayed as existentially paralysing.
      *   **Narratively Frustrating Verdict (Applying Strictly):** You requested one case where the paradox holds and escape is illegitimate. Let's *modify* the Security Officer case: Suppose the officer *must* physically throw the bystander into the path of the attacker's weapon to block it, *directly causing* the bystander's death (A: *Actively killing an innocent*), and this is the *only* way to prevent the attacker from *directly killing* ten other innocents. Here: Step 1: Doing A (killing one) vs. allowing ten killings (ten instances of A? If we accept that the attacker's killings are morally identical to the officer's potential act of killing an innocent). Step 2: Inaction allows ten A's; action (doing A) prevents ten A's. Step 3: The wrong (killing an innocent) is identical. Step 4: Officer directly kills the bystander. *Positive Verdict.* This *is* the paradox. Any "clever third option" (e.g., disarming the attacker without harming the shield) is excluded by the scenario's logic. The protagonist *cannot* satisfy the prohibition without thereby ensuring its greater violation. This is the irreducible tension. Granting an escape undermines the paradox.

  **What This Procedure Cannot Do:**

  *   **Resolve Foundational Debates:** It cannot tell you whether the doing/allowing distinction is morally significant, whether thresholds exist, or whether aggregating harms is valid. It relies on *your* definition of the core prohibition (A) and *your* stance on the identity of the wrongs in Steps 1 & 3.
  *   **Handle Incommensurable Harms:** If the choice involves violating A vs. preventing a catastrophe of a *different kind* (e.g., killing one innocent vs. preventing a genocide, or breaking an oath vs. preventing a natural disaster), the procedure flags it as "not the paradox" (Step 1 fails), but offers no guidance for resolving that different, often profound, conflict.
  *   **Assign Character Sympathy:** Whether the protagonist's rigidity is heroic, tragic, or fanatical; whether their choice (or refusal to choose) evokes pity, admiration, or condemnation – these are narrative choices untouched by the procedure.
  *   **Determine Thematic Resolution:** The procedure identifies if the paradox structure is present. It cannot tell you whether the protagonist should break the rule, uphold it despairingly, find a meta-solution (e.g., self-sacrifice), or if the narrative should condemn or vindicate their choice thematically. These are authorial decisions about the story's meaning.
  *   **Account for Uncertainty:** The procedure assumes clear knowledge of outcomes and agency. Real dilemmas often involve risk, imperfect information, and probabilistic outcomes, which complicate the paradox structure immensely.
  *   **Evaluate Rule Content:** It takes the protagonist's absolute prohibition (A) as a given. It cannot judge if A is itself reasonable or morally justified.

  **Guarding Against Misapplication:**

  *   **Beward of Vague Prohibitions:** The entire procedure hinges on precisely defining "A". "Causing harm," "being responsible for death," or "failing in duty" are too vague. Specify: "Actively killing an innocent," "Breaking a sworn oath of secrecy," "Torturing a prisoner."
  *   **Resist Conflating Harms:** Do not assume that all deaths, all harms, or all rule-violations are morally equivalent for the purpose of identifying A. Scrutinize Step 3.
  *   **Maintain Agency Rigor:** Do not let narrative convenience blur the line between direct action and indirect consequence (Step 4).
  *   **Accept Negative Verdicts:** Not every tragic choice is the paradox of deontology. Using the procedure often means concluding "this isn't *that* dilemma." Embrace this clarity for richer, more varied conflict.
  *   **Respect the Judgment Markers:** Where philosophy reaches its limits (Step 3 ambiguity), lean into your role as author. That ambiguity *is* the human terrain your narrative explores.

  This framework, I hope, provides the analytical rigor you seek without stifling the essential creative judgments that breathe life into your protagonist's deontological crucible. May your pen find the precise weight of their impossible burden.

  With collegial respect and anticipation for your work,

  A Fellow Navigator of Moral Labyrinths
