answer: |-
  ## Fellowship Research Prioritisation

  **The shortlist, reordered**

  1.  **(1) Borrowed Standing:** This is the most upstream. It asks *what standing fundamentally is* (permission rooted in relationship/harm?) before hypocrisy enters. It directly challenges the core assumption that standing requires *personal* victimhood/relationship. Unravelling when adopting grievances is legitimate (vs. busybodying/manufacturing) provides the bedrock for *any* subsequent standing claim, including hypocritical ones. Its resolution fundamentally shapes the conceptual space the others operate in. Highly relevant to institutional actors (e.g., HR adopting employee complaints, ethics panels judging non-members).
  2.  **(2) The Untempted Blamer:** This strikes at a core, often unexamined, potential pillar of standing: *competence* or *epistemic authority*. It directly challenges the sufficiency of "clean hands" and probes whether understanding the tempted state is necessary for legitimate condemnation. This is conceptually deep, relatively underexplored compared to hypocrisy, and has practical implications for who is deemed *qualified* to judge (e.g., ethics committees staffed by ascetics judging common temptations).
  3.  **(3) Aggregated Blamers:** This is downstream but practically crucial. It tackles how individual standing deficits (especially hypocrisy) interact with *collective agency* – a common institutional reality. While reliant on concepts from (1) & (4), its focus on group dynamics, delegation, and institutional legitimacy is vital for translating theory into codes for panels and committees. The "inheritance" question is key for real-world application.
  4.  **(4) Standing Drift:** Important but perhaps the most contingent and potentially derivative. While "how long does reform take?" is practical, its answer depends heavily on resolving *why* hypocrisy creates a deficit (atonement? sincerity? competence regained?) – questions often addressed in the core hypocrisy literature you wish to avoid. It risks becoming an application of that existing debate rather than breaking genuinely new upstream ground. The "acknowledgement" angle is the most novel part.

  **Criteria and Where They Clash**

  *   **Upstream-ness (Primacy):** The most important criterion. Does the question probe the *foundations* of standing permission *before* specific deficits (like hypocrisy) are considered? (1) and (2) score highest here, defining the very conditions for legitimate blame. (3) and (4) operate downstream, applying those foundations.
  *   **Neglectedness:** How underexplored is the specific angle? (1) (borrowed standing dynamics) and (2) (untempted competence) are significantly less trodden than core hypocrisy or even general standing overviews. (3) (group dynamics) has some discussion but limited depth on standing inheritance. (4) (drift) touches on reform/hypocrisy debates.
  *   **Practical Institutional Shift:** Potential to change how conduct bodies *select* blamers or *structure* condemnation. (1) informs who *can* legitimately adopt a grievance. (2) informs who is *qualified* to judge specific transgressions. (3) is *directly* about institutional bodies. (4) informs rehabilitation policies.
  *   **Doability in 2 Years:** Feasibility for a significant paper/draft monograph. All are potentially doable, but complexity varies. (1) and (2) require deep conceptual work building new arguments. (3) might involve analysing group agency literature. (4) could be narrower but risks needing extensive engagement with reform literature.

  **Clashes:**
  *   Upstream-ness vs. Practical Shift: The most upstream (1,2) may feel abstract initially, while the most practical (3) relies on upstream foundations. Prioritise upstream to build the necessary foundation for lasting practical impact.
  *   Neglectedness vs. Doability: Highly novel angles (1,2) might require more groundwork than applying concepts to a new domain (3).
  *   Upstream-ness vs. Doability: Foundational work (1) is inherently complex but yields the highest long-term payoff.

  **What I've Missed**

  *   **Relational Standing beyond Victimhood:** You touch on relationships in (1), but deeper exploration of *professional* or *role-based* standing is crucial for institutions. When does being a senior colleague, regulator, or member of a profession confer standing *independently* of direct harm or hypocrisy? (E.g., a doctor judging another doctor's ethics breach).
  *   **Victim Prerogative & Delegation:** Closely linked to (1), but specifically: Can a victim *delegate* their standing? If so, under what conditions? This is vital for restorative justice programmes and ombudsman systems.
  *   **Power Dynamics:** How does the *power imbalance* between blamer and blamed affect standing legitimacy? Does a powerful institution blaming a vulnerable individual require *more* stringent standing conditions to avoid oppression, regardless of hypocrisy?
  *   **Epistemology of Standing:** Beyond competence (2), how does the blamer's *access to knowledge* of the wrong or context impact their standing? Is ignorance a separate defeater?
  *   **Empirical Hook:** While philosophical, grounding questions in real case studies from professional tribunals, university panels, or RJ practices would strengthen the practical focus and reveal nuances missed in pure theory.

  **What Would Move Things Up or Down**

  *   **Up:** Discovering existing institutional guidelines grappling explicitly with one of these issues (e.g., a university policy on "third-party reporters" boosts (1); an ethics committee rule on "relevant experience" boosts (2)).
  *   **Up:** Emergence of significant new literature directly engaging with one topic (e.g., a major paper on group blame suddenly makes (3) more urgent).
  *   **Down (for 4):** Finding the "standing drift" debate is already well-developed within hypocrisy/reform literature, making your contribution less distinct.
  *   **Up (for 3):** Securing early collaboration/access to a professional conduct body wanting to review their panel composition rules.
  *   **Down:** Realising one topic requires extensive empirical research (e.g., sociological study of RJ programmes) to make progress, exceeding the fellowship scope. (1,2,3 seem safely conceptual).
  *   **Up (for 1 & 2):** Identifying clear contradictions or gaps in the core standing literature that your specific angles uniquely resolve.
