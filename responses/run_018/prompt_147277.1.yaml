  On substrate independence... The physicist's skepticism is warranted. Jumping from "brain in vat" to "consciousness is software" ignores so much! Dennett would agree consciousness depends on implementation details - the essay oversimplifies. The physicist's background in biology probably makes them wince at how the essay handwaves embodiment away.

