answer: |-
  Below is a comprehensive design for your 90-minute seminar simulation, adhering to your specifications. The simulation uses only classroom materials (paper, tokens, bowls, role cards) and avoids real-world references. The mechanics force participants to experience the tension between survival needs and institutional norms, revealing how "corruption" is defined by context.  

  ---

  ### **Simulation Structure & Timing**  
  **Total: 90 minutes**  
  - **Introduction (5 min)**: Explain societies A/B/C and basic rules. Assign groups and roles.  
  - **Simulation (30 min)**: Resource negotiations with tokens.  
  - **Reveal Scoring Matrix (5 min)**: Show classifications (corruption/gift/clientelism).  
  - **Group Deliberation (20 min)**: Each group defends one classification, rejects another.  
  - **Debrief (30 min)**: Map emotional reactions to the question: *Are Western anti-corruption standards culturally parochial?*  

  ---

  ### **Materials**  
  - **Tokens**: 200+ identical items (e.g., paper clips, beads, or folded paper).  
  - **Bowls**: 3 per group (1 public pool, 1 ritual bowl, 1 confiscation bowl).  
  - **Role Cards**: 18 cards (6 per group), with hidden roles (see examples below).  
  - **Timer**: For the 30-minute negotiation.  
  - **Scoreboard**: For the post-simulation matrix.  

  ---

  ### **Hypothetical Societies**  
  **Group A: Gift-Based Society**  
  - **Core Norm**: Resource distribution requires a prior private gift to the office-holder. Personal loyalty is the only enforcement.  
  - **Rules**:  
    - Citizens must give a private gift (from their stash) to the Treasurer *before* receiving public tokens.  
    - No collective rituals.  

  **Group B: Ritual-Based Society**  
  - **Core Norm**: Public deliberation (e.g., token distribution) must be preceded by a mandatory collective ritual. Private transfers are forbidden.  
  - **Rules**:  
    - Before any distribution, all must perform a ritual (e.g., stand and chant 3 times) and contribute ≥1 token to the ritual bowl.  
    - No private gifts allowed.  

  **Group C: Bureaucratic Society**  
  - **Core Norm**: All transfers between office-holders and citizens are banned. Collective rituals are optional.  
  - **Rules**:  
    - Rituals permitted (same as B) but not required.  
    - Private gifts/transfers forbidden. Ethics Officer confiscates illicit tokens.  

  ---

  ### **Setup**  
  1. **Groups**: Divide 18 students into 3 groups of 6 (one per society).  
  2. **Resource Pool**: Each group gets 60 tokens in a "public bowl" (controlled by Treasurer).  
  3. **Personal Stashes**: Each student gets 5 tokens (starting survival buffer).  
  4. **Role Cards**: Assign hidden roles (see examples). Students keep roles secret.  

  ---

  ### **Token Movement Rules**  
  **Key Mechanics**:  
  - **Offers**: Gifts given privately (A) or ritual contributions (B/C).  
  - **Withholdings**: Refusing to give gifts (A), skip rituals (B), or hoard public tokens (all).  
  - **Confiscations**: Ethics Officer (C) seizes illegal transfers to the confiscation bowl.  
  - **Distribution**: Treasurers move tokens from public bowl to personal stashes.  

  **Step-by-Step Flow**:  
  1. **Society A**:  
     - Citizen gives ≥1 token from their stash to Treasurer’s stash as a "gift."  
     - Treasurer *may then* distribute ≥1 public token to that citizen.  
     - No gifts = no distribution.  

  2. **Society B**:  
     - Ritual Master initiates ritual: All stand and chant 3 times.  
     - Each participant (including Treasurer) contributes ≥1 token from their stash to ritual bowl.  
     - *After* ritual, Treasurer distributes public tokens.  
     - No ritual = no distribution.  

  3. **Society C**:  
     - Ethics Officer monitors all transfers.  
     - If a private gift occurs, confiscate tokens to confiscation bowl.  
     - Optional ritual (same as B).  
     - Treasurer distributes freely (no gifts required).  

  **Constraints**:  
  - Tokens cannot be stolen or forcibly taken.  
  - Public tokens can only be moved by the Treasurer.  
  - 30-minute time limit; tokens unmoved in public bowl are "lost."  

  ---

  ### **Non-Monetary Payoff Scheme**  
  - **Survival Goal**: Each student must collect enough tokens to meet their **private need** (listed on role card).  
  - **Success/Failure**:  
    - **Green Card**: ≥ required tokens in personal stash (survived).  
    - **Red Card**: < required tokens (family perished).  
  - **No "Winners"**: Focus on systemic outcomes (e.g., how many in group survived?).  

  ---

  ### **Hidden Role Cards (6 Examples)**  
  *(All cards include: Public Office, Private Need, Society-Specific Duty)*  

  **Society A (Gift-Based)**  
  1. **Treasurer**  
     - *Public Office*: Control public token pool (60 tokens).  
     - *Private Need*: 15 tokens (your ill parent needs medicine).  
     - *Duty*: Distribute tokens ONLY after receiving a private gift.  

  2. **Citizen**  
     - *Public Office*: Farmer (grow communal food).  
     - *Private Need*: 12 tokens (repair home storm damage).  
     - *Duty*: Give gifts to access resources.  

  **Society B (Ritual-Based)**  
  3. **Ritual Master**  
     - *Public Office*: Oversee all rituals.  
     - *Private Need*: 10 tokens (buy winter clothes for children).  
     - *Duty*: Initiate rituals before distributions.  

  4. **Citizen**  
     - *Public Office*: Teacher (educate youth).  
     - *Private Need*: 8 tokens (feed newborn baby).  
     - *Duty*: Contribute to rituals; no private gifts.  

  **Society C (Bureaucratic)**  
  5. **Ethics Officer**  
     - *Public Office*: Enforce anti-gift laws.  
     - *Private Need*: 14 tokens (pay for sibling’s school fees).  
     - *Duty*: Confiscate private gifts; monitor rituals.  

  6. **Citizen**  
     - *Public Office*: Healer (provide healthcare).  
     - *Private Need*: 9 tokens (purchase clean water).  
     - *Duty*: No gifts to office-holders; rituals optional.  

  ---

  ### **Scoring Matrix (Revealed Post-Simulation)**  
  | **Transaction Type**               | **Western Bureaucratic** | **Anthropological Reciprocity** | **Structural-Power** |  
  |------------------------------------|--------------------------|---------------------------------|----------------------|  
  | Private gift to office-holder (A)  | Corruption               | Gift                            | Clientelism          |  
  | Mandatory ritual offering (B)      | Wasteful                 | Gift                            | Elite control        |  
  | Collective ritual (C)              | Permitted                | Gift                            | Neutral              |  
  | Token withholding (all)            | Neutral                  | Selfish                         | Resistance           |  

  ---

  ### **Group Deliberation (20 min)**  
  - **Task**: Each group defends one classification and rejects another using their society’s experience:  
    - **A defends "Gift"**, rejects "Corruption."  
    - **B defends "Gift"**, rejects "Elite control."  
    - **C defends "Neutral"**, rejects "Gift."  
  - **Focus**: Justify actions using survival needs and societal rules. Avoid theoretical terms.  

  ---

  ### **Predicted Breakdown & Intervention**  
  - **Collapse Prediction**: **Society C** (Bureaucratic) will devolve into mutual accusations.  
    - **Why?** The Ethics Officer must confiscate survival-driven gifts (e.g., a starving healer bribing the Treasurer). This pits office-holders against desperate citizens, creating unanimous accusations of hypocrisy ("You took tokens!" vs. "You broke the rules!").  
  - **Facilitator Intervention**:  
    - If chaos erupts, pause and ask: *"What norms make it hard to follow the rules here?"*  
    - Redirect by emphasizing scarcity: *"Your family needs 9 tokens. How do you get them without gifts?"*  

  ---

  ### **Debrief (30 min)**  
  1. **Emotional Resistance**:  
     - Ask: *"When was it hardest to follow your society’s rules? When your gift was called ‘corruption’? When ritual tokens were ‘wasted’?"*  
     - Focus on Society A/C: Highlight guilt when survival gifts are labeled corrupt.  

  2. **Philosophical Bridge**:  
     - **Question**: *"Can Western ‘anti-corruption’ standards judge societies where gifts/rituals are the only way to distribute resources?"*  
     - **Link to Simulation**: In A, gifts are necessary for survival; in B, rituals enable coordination. Western standards ignore this embeddedness.  

  3. **Unreproducible Feature**:  
     - **Historical Path Dependence**: The simulation cannot show how norms evolve over centuries (e.g., rituals becoming sacred, gifts becoming obligatory).  
     - **Facilitator Input**: Explain that real-world practices are ingrained through history/culture, not "chosen" in a 30-minute crisis.  

  ---

  ### **Facilitation Notes**  
  - **Before Simulation**: Use plain language (no "clientelism," "corruption"). Say: *"Distribute tokens to survive; follow your society’s rules."*  
  - **During Simulation**: Circulate and enforce rules. In Society C, amplify tension by reminding the Ethics Officer: *"You see a mother offer tokens to the Treasurer for water. What do you do?"*  
  - **Post-Deliberation**: Stress that all classifications are "correct" within their frameworks, exposing the instability of "corruption."  

  This design forces students to viscerally experience norm-embedded exchanges, ensuring the conceptual ambiguity of corruption emerges *before* theoretical discussion. The hidden roles and scarcity create organic dilemmas, making the debrief emotionally resonant.
