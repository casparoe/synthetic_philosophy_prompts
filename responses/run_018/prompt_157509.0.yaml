answer: |-
  ### 1. Quick Brainstorm (Mechanisms of Self-Devouring Revolutions)
  *   **Structural:** Revolution creates a power vacuum and weak institutions. New regimes, desperate for control amidst chaos and war, resort to increasingly centralized, coercive measures to suppress dissent (real or imagined) and mobilize resources. This machinery of control inevitably targets factions *within* the revolution. (Focus: Collapse of Order & Centralization)
  *   **Ideological:** The pursuit of radical purity becomes paramount. As abstract ideals (like "virtue," "equality," or "the nation") dominate, anyone perceived as insufficiently committed, a potential traitor, or an obstacle to the utopian goal becomes a threat. Internal divisions are framed as existential battles against counter-revolution, justifying extreme measures against former allies. (Focus: Purity Spiral & Radicalization)
  *   **Contingent:** Personal rivalries, paranoia of key leaders, poor communication, and specific crises (military defeats, economic collapse, popular uprisings) create panic and trigger snap decisions. Fear and mistrust escalate, leading to pre-emptive strikes against rivals within the revolutionary camp who are blamed for setbacks. (Focus: Personalities & Crises)

  ### 2. What the Fight is About
  Historians constantly debate what *primarily* drove the Revolution and its violent turn:
  *   **Class Struggle:** Views the Revolution as a fundamental conflict between the rising bourgeoisie (middle class) and the old aristocracy/feudal order. The Terror, from this angle, was partly about consolidating bourgeois power by crushing both aristocratic remnants *and* radical popular movements (like the *sans-culottes*) that threatened property rights or stability.
  *   **Ideology:** Emphasizes the power of Enlightenment ideas (liberty, equality, popular sovereignty, reason) and their radical reinterpretation. The Terror becomes a logical, if extreme, outcome of trying to build a radically new society based on virtue, requiring the ruthless elimination of "enemies of the people" who hindered the perfect Republic.
  *   **Contingency:** Focuses on the chaotic circumstances: massive war on multiple fronts, economic collapse, famine, foreign invasion, and internal rebellions (like the Vendée). It highlights the role of specific, often paranoid, individuals (Robespierre, Danton, their factions) and the panic-driven decisions made under extreme pressure. Weird people and bad luck mattered immensely.

  ### 3. The Case for Class and Structure
  The structural argument is compelling because the *Ancien Régime*'s collapse created a fundamental power vacuum and institutional chaos. The monarchy, nobility, and church – the pillars of old authority – were dismantled rapidly. Yet, the new National Assembly and subsequent bodies struggled to build stable, legitimate institutions to replace them. This instability was compounded by massive external threats (war with Europe) and internal crises (counter-revolutions, economic disaster). In this context, *any* revolutionary government would likely have resorted to extraordinary measures to survive. The Committee of Public Safety and the Revolutionary Tribunal weren't just ideological experiments; they were desperate tools for centralizing power, mobilizing resources (like conscription), and crushing dissent to prevent total collapse. The violence, especially against former elites and rebellious regions, flowed from the structural imperative to establish control and defend the fragile new state against existential threats. Class dynamics fueled the initial revolt, but the *sustained* violence arose from the structural chaos of building a new order amidst war and collapse.

  ### 4. The Case for Ideology and Contingency (and How They Differ)
  While structure created the pressure cooker, ideology lit the fuse, and contingency determined *who* got burned. The radical ideology of the Jacobins, particularly Robespierre's concept of the "Republic of Virtue," wasn't just political theory; it became a terrifyingly absolute standard. Anyone failing this test – whether a moderate revolutionary (Girondins), a popular leader deemed too ambitious (Danton), or a peasant resisting conscription – became an "enemy of the people," justifying elimination. This ideological fervor created a dynamic of escalating radicalization and suspicion.

  Contingency, however, explains the *timing* and *targets* of the violence. The specific pressures mattered enormously: the military disasters of early 1793 triggered the creation of the Terror apparatus; the assassination of Marat fueled paranoia; the Vendée uprising demanded brutal suppression; personal rivalries between Danton and Robespierre turned fatal. Contingency asks: Would the Terror have reached its peak intensity without the specific wars, economic collapse, and the personalities involved? Ideology provided the justification and language, but contingent crises and personal decisions determined *when* and *against whom* the machinery was deployed. Ideology set the rules of the game; contingency decided who lost each round.

  ### 5. The Devouring-Children Problem: Bureaucratic Mimicry & the Terror
  The revolutionary tribunals and committees absolutely mimicked – and even amplified – the procedural habits and hierarchical reflexes of the old regime, making systematic repression more efficient and thus contributing to the Terror's brutality. This wasn't just an accident; it was almost inevitable.

  *   **Paperwork & Procedure:** The Old Regime ran on mountains of paperwork – petitions, orders, investigations, judgments. The revolutionaries inherited this administrative machinery and its personnel. The Revolutionary Tribunal, despite its rhetoric of popular justice, relied heavily on written denunciations, dossiers, formal indictments, and procedural rules (however skewed). This created a facade of legality and process, distancing the perpetrators from the violence and making repression seem routine, even bureaucratic. The sheer volume of paperwork *required* a functioning bureaucracy, which the old system provided the blueprint for.
  *   **Centralization & Hierarchy:** The monarchy was the epitome of centralized power. The Committee of Public Safety didn't invent centralization; they seized the existing structure and cranked it up to eleven for survival. They demanded reports, issued decrees, and enforced obedience through a chain of command down to local representatives-on-mission and surveillance committees. This top-down hierarchy, mirroring royal administration but infused with revolutionary zeal, allowed orders for repression to flow efficiently from Paris to the provinces. Local initiatives were often reined in or directed centrally.
  *   **Reflexes of Control:** Both regimes relied on surveillance and informants. The old police spies became the new revolutionary informants. The reflex to control dissent through investigation and punishment was deeply ingrained. The revolutionaries, fearing counter-revolution everywhere, simply applied these old reflexes with revolutionary intensity and vastly expanded scope. The *habit* of using state machinery for social control persisted, even as the ideology justifying it flipped.

  This mimicry didn't *cause* the Terror alone, but it made it **operationally feasible and structurally normalized**. The revolutionaries didn't have time to invent wholly new governing systems amidst crisis. They grabbed the levers of power they knew – the bureaucratic and judicial tools of the monarchy – and repurposed them for revolutionary ends. This existing framework allowed the ideological fervor and contingent panic to be translated into systematic, large-scale repression. The machinery, once adapted, developed its own momentum, making the "devouring" more efficient and harder to stop. The old bottle held very new, very bitter wine.

  ### 6. My Verdict
  While ideology provided the radical goals and justification, and contingency dictated the specific triggers and targets, **the structural collapse of the old state and the immense pressures of war and internal crisis were the dominant forces making violence, including the "devouring," highly probable, if not inevitable.** 

  The sheer scale of the institutional vacuum and the existential threats facing the Revolution meant *some* form of centralized, coercive authority was bound to emerge. Ideology shaped *how* that authority justified itself (virtue, popular will), and contingency decided *who* wielded it and *who* it crushed at specific moments. However, without the structural collapse creating chaos and the overwhelming pressure of war/economic disaster forcing desperate measures, it's unlikely the ideological purity spiral or contingent paranoia would have manifested in such systematic, state-driven terror. The bureaucratic mimicry underscores this: the structure of power and administration, even when repurposed, channels and amplifies the violence. The Revolution devoured its children not just because of radical ideas or bad leaders, but fundamentally because the process of violently dismantling one state and trying to build another amidst war is inherently destabilizing and demands coercive control – a demand the Terror apparatus, built with old parts, was designed to meet. Structure created the furnace; ideology and contingency determined how fiercely and wildly it burned.
