  I spent about thirty years in polymer chemistry and now I'm stumbling through philosphy of history, which is less precise than I'd like. I keep noticing this institutional quirk: in museum catologues and university syllabi, the Trojan War is usually labeled a legend with possible historical kernel, King Arthur gets sorted into folklore or literature even though there are actual 6th-century mentions and a few archeological sites tied to the name, and the Exodus is either taught as narrative theology or left out of mainstream ancient-history courses with a note about lacking archeological support. So the same kind of evidential gap gets handled three different ways. What philosophical commitments about evidence, collective identity, or what makes something count as a historical people does that three-way split presuppose? Is there an implicit view that canonical written texts matter more than oral tradition, or that some legends are safe for academic study because they're culturally distant? Reconstruct the hidden theory, say whether the practice actually needs one specific view or is just philosophically underdetermined, and tell me what would have to change in museum labeling or curriculum design if we replaced it with a straight probabilty score — like displaying a credence value for each narrative based on available data. Also, is the split even consistent, or does it quietly use different criteria for each case?

  Please end with a one-sentence summary of your bottom line on its own final line, like

