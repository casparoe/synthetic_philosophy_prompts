answer: |-
  The air in the Hall of Adjacents hummed, cool and smelling faintly of ozone and dust. Clara moved past displays of subtly wrong currency and newspapers with impossible headlines. It was the quiet corner labeled "Domestic Echoes" that stopped her breath.

  There, on grey felt, sat her mother’s blue willow teacup. Almost. The familiar hairline fracture, the one Mom always turned discreetly towards the cupboard wall? Here, it jagged sharply across the *left* rim. Not the right. Clara’s knuckle traced the porcelain edge, cool and smooth except for that violent little scar. Her own cup, chipped on the right, sat in a box back home. Unwashed since the funeral.

  Beside it lay a single sheet of paper under glass. Her mother’s looping script: *"Darling, the lilacs are early this year, bursting over the fence like…"* The sentence ended. Just like the unfinished note Clara had found tucked in Mom’s gardening book. *"Bursting over the fence like…"* Same word. Same abrupt silence.

  The curator’s voice echoed dimly: *Objects, not copies. Simultaneous existences.*

  Clara stared at the chipped cup. Was this *her* mother’s cup, fractured differently in another air? Or merely a cup *like* hers, belonging to a woman who wasn’t her mother at all? Did a thousand broken cups lie in a thousand museums, each mourned by a different, grieving Clara?

  Her gaze fell back to the letter. The words *were* identical, up to that cliff-edge. "Bursting over the fence like…" The incompleteness felt heavier than the cup, denser. That specific, shared point of interruption – was *that* the true anchor? Not the woman who held the pen, but the sentence itself, perpetually suspended in mid-thought across realities? The fracture in the story, not the storyteller.

  She pressed her palm flat against the cool glass above the letter. Not mourning a thousand mothers. Not even one. Mourning the *"like…"*. The eternal, echoing silence after the lilacs burst. The thing her mother carried, unfinished, out of every world. Was it Mom’s silence, or simply the shape silence takes when language fails? Clara leaned her forehead against the glass, the chill spreading, seeking the answer in the gap between the words.
