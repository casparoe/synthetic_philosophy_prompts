prompt: |-
  hey — i'm a novelist working on a weird little collection about grief and parallel lives, and i got into a argument with my friend about whether your dead mom in another world is still your mom or just someone like her. i want to turn it into fiction but i don't want it to read like a philosophy paper. could you write me a short story, keep it under 350 words and just one scene, about a woman in a museum that displays artifacts from "nearby worlds"? the curators claim the objects aren't copies but literally exsist across worlds (transworld identity, not Lewisian counterparts). she finds her mother's teacup, chipped on the left instead of the right, and an unfinished letter that breaks off at the same word in every version. i had this odd idea that maybe unfinished sentences, not people, are the real carriers of identity across worlds — try weaving that in without explaining it. let the scene show her deciding whether she's mourning one cup or a thousand, and whether the broken sentence belongs to her mom or just to language itself. no need for quotes or citations, just make it feel human. thanks!
