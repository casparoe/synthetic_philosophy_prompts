answer: |-
  Below is a structured decision protocol for assessing ordinances across negative, positive, and republican liberty dimensions, designed for rapid application (≤90 minutes) by non-specialists. The protocol includes your specified enhancements: a **counterfactual vulnerability audit** for republican liberty (testing latent arbitrary power) and an **adaptive-preference filter** for positive liberty (testing non-manipulated endorsement of capacities). Conflicts between dimensions are explicitly flagged, and judgment points are marked. Three worked cases demonstrate application, including a counterintuitive verdict.

  ---

  ### **Liberty Impact Assessment Protocol**  
  *A Word-Flowchart with Ordered Tests*  

  #### **I. NEGATIVE LIBERTY (NL) ASSESSMENT**  
  *Absence of direct/structural interference with choice*  
  1. **Test for Direct Interference**:  
     - Does the ordinance *prohibit*, *mandate*, or *conditionally restrict* an action?  
       - *Yes* → NL reduced (**Flag NL↓**). Proceed to #2.  
       - *No* → No NL reduction. Proceed to Positive Liberty.  
  2. **Test for Structural Interference**:  
     - Does the ordinance create barriers (e.g., financial, bureaucratic) that functionally block access to choices, even if not explicitly prohibitive?  
       - *Yes* → NL reduced (**Flag NL↓**). Proceed to Positive Liberty.  
       - *No* → No NL reduction. Proceed to Positive Liberty.  
     - *Judgment Point*: Structural equivalence requires evaluating context (e.g., a fee may be trivial for some, prohibitive for others).  

  #### **II. POSITIVE LIBERTY (PL) ASSESSMENT**  
  *Effective capacity for self-authorship, filtered for non-manipulated endorsement*  
  1. **Test for Capacity Expansion**:  
     - Does the ordinance directly provide resources, skills, or opportunities enabling new choices?  
       - *Yes* → Proceed to #2 (Adaptive-Preference Filter).  
       - *No* → No PL impact. Proceed to Republican Liberty.  
  2. **Adaptive-Preference Filter**:  
     - Would affected agents *endorse this specific capacity* if they were:  
       - (a) Fully informed of alternatives/consequences,  
       - (b) Free from coercion/manipulation (e.g., propaganda, desperation), and  
       - (c) Able to reflect critically?  
       - *Yes* → PL enhanced (**Flag PL↑**). Proceed to Republican Liberty.  
       - *No* → PL not enhanced (even if resources expand). Proceed to Republican Liberty.  
     - *Judgment Point*: Requires counterfactual reasoning about idealized conditions (**Flag J-PL**).  

  #### **III. REPUBLICAN LIBERTY (RL) ASSESSMENT**  
  *Non-domination via counterfactual vulnerability to arbitrary power*  
  1. **Test for Power Asymmetry**:  
     - Does the ordinance create or reinforce a power imbalance (e.g., state vs. citizen, employer vs. worker)?  
       - *Yes* → Proceed to #2.  
       - *No* → No RL impact. Assessment complete.  
  2. **Counterfactual Vulnerability Audit**:  
     - Could the empowered entity interfere arbitrarily (i.e., without needing to justify decisions based on common good or affected parties’ interests)?  
     - *And* is this power unchecked (e.g., no appeal, no transparency, no democratic oversight)?  
       - *Yes* → RL reduced (**Flag RL↓**).  
       - *No* → No RL reduction.  
     - *Judgment Point*: Focus on *potential* abuse, not current use. Latent power suffices (**Flag J-RL**).  

  #### **IV. CONFLICT NOTATION & OUTPUT**  
  - **Synchronized Dimensions**: If all tests align (e.g., NL↓, PL↑, RL↓), report net direction.  
  - **Conflicting Dimensions**: If trade-offs exist (e.g., PL↑ but RL↓), use:  
    - **NL×PL↑×RL↓**: *Capacity gains vs. domination risk.*  
    - **NL↓×PL~×RL↓**: *Interference without offsetting gains.*  
    - *(~ denotes no change)*.  
  - **Output Template**:  
    > **NL Impact**: [Reduced/No Change]  
    > **PL Impact**: [Enhanced/No Change] + [J-PL if applicable]  
    > **RL Impact**: [Reduced/No Change] + [J-RL if applicable]  
    > **Conflict**: [e.g., "PL↑ vs. RL↓: Capacity gains may exacerbate domination."]  

  ---

  ### **Worked Cases**  

  #### **Case 1: Mandatory Financial-Literacy Course for Welfare Eligibility**  
  - **NL**: Direct interference (condition restricts welfare access). **NL↓**.  
  - **PL**: Capacity expansion (literacy skills). Adaptive filter: Most low-income agents *would* endorse financial literacy under non-manipulation (e.g., informed critique of predatory loans). **PL↑**.  
  - **RL**: No unchecked power asymmetry (rules are standardized; appeals exist). **No RL reduction**.  
  - **Conflict**: **NL↓×PL↑** (trade-off: coercion vs. empowerment).  
  - **Verdict**: Defensible if PL↑ outweighs NL↓, but no republican red flags.  

  #### **Case 2: Discretionary Noise Ordinance by Unelected Official (Unreviewable Authority)**  
  - **NL**: Direct interference (prohibits noise). **NL↓**.  
  - **PL**: No capacity expansion (only restricts behavior). **No PL impact**.  
  - **RL**: Power asymmetry (one official holds unreviewable authority). Counterfactual audit: Official *could* arbitrarily target groups (e.g., minorities, protesters) without justification. **RL↓**.  
  - **Conflict**: **NL↓×RL↓** (double liberty loss).  
  - **Verdict**: **High risk** despite narrow scope; republican flaw dominates.  

  #### **Case 3: Public Apprenticeship Requiring Relocation to Low-Opportunity Region**  
  - **NL**: Structural interference (relocation mandate blocks alternatives). **NL↓**.  
  - **PL**: Capacity expansion (skills training). Adaptive filter: Agents in poverty *may not endorse* this capacity if informed/non-manipulated (e.g., relocation traps them in company towns, enabling exploitation). **PL not enhanced** (fails filter).  
  - **RL**: Power asymmetry (employers dominate isolated workers). Counterfactual audit: Employers *could* arbitrarily cut wages/benefits (no competition). **RL↓**.  
  - **Conflict**: **NL↓×RL↓** (no PL↑ to offset losses).  
  - **Verdict**: **Net negative**; resembles indentured servitude.  

  ---

  ### **Counterintuitive Verdict: The "Latent Threat" Case**  
  **Ordinance**: A tax on businesses >500 employees, with revenue directed to small-business grants. Enforcement is transparent and appealable.  
  - **NL**: No direct/structural interference (taxes are not liberty violations per se; no targeted bans). **No NL reduction**.  
  - **PL**: No *direct* capacity expansion (grants aid small businesses, but ordinance doesn’t build personal agency). **No PL impact**.  
  - **RL**: Creates power asymmetry (state can selectively audit large firms). Counterfactual audit: Even with rules, state *could* arbitrarily target firms for political reasons (e.g., silencing critics). **RL↓**.  
  - **Verdict**: **NL~ × PL~ × RL↓**  
    - *Why counterintuitive?* Negative/positive liberty seem untouched, but republican liberty is compromised by dormant arbitrary power. A "good" policy hides domination risk.  

  ---

  ### **Limitations & Revision Triggers**  
  1. **What the Protocol Cannot Settle**:  
     - **Weighting Incommensurables**: When NL↓ trades off against PL↑ (e.g., Case 1), the protocol flags conflict but offers no weighting mechanism. This requires political judgment.  
     - **Adaptive-Preference Uncertainty**: J-PL judgments may reflect assessor bias (e.g., assuming "the poor don’t know what’s good for them").  

  2. **Revision Triggers**:  
     - **Empirical Finding on Domination**: If studies show *dormant* arbitrary power rarely translates to real-world abuse (e.g., in democracies with strong norms), weaken RL counterfactual audit.  
     - **Adaptive-Preference Evidence**: If behavioral research proves certain groups *systematically reject* state-provided capacities (e.g., job training tied to punitive conditions), harden the PL filter.  

  3. **Most Vulnerable Step**:  
     - **Adaptive-Preference Filter (PL#2)**: Rushed practitioners may skip counterfactual reasoning, assuming *all* resource transfers enhance liberty (e.g., "Education is always good—no need for filter"). This risks justifying paternalism.  

  ---

  ### **Final Implementation Notes**  
  - **Speed Optimization**: Focus Step 1 (NL) on explicit prohibitions; reserve structural analysis for high-impact cases.  
  - **Audit Trail**: In outputs, briefly cite evidence for J-PL/J-RL judgments (e.g., "RL↓ based on lack of appeal process in Section 4(b)").  
  - **Philosophical Fidelity**: The protocol embeds Berlin/Pettit but avoids recitation by centering *actionable* tests (vulnerability audits, preference filters).
