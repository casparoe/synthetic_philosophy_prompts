prompt: |-
  I'm a senior analyst on an independent municipal oversight board that reviews proposed ordinances for liberty impacts before they reach the council floor. I see about a dozen proposals a month—zoning amendments, licensing rules, public-health mandates, subsidy conditions—and I have to sign off on a one-page assessment within ninety minutes. The board is legally literate but not philosophically trained, so my report has to translate conceptual distinctions into a reusable decision protocol that a non-specialist can audit. I want a procedure that classifies each ordinance's impact across negative liberty (absence of direct or structurally equivalent interference), positive liberty (the effective capacity for self-authorship, not merely the absence of chains), and republican liberty (non-domination, specifically the absence of arbitrary power even when that power lies dormant). To keep this from being a recitation of Berlin's two concepts plus Pettit's non-domination gloss, I need you to inject a practical distinction that standard treatments gloss over: for republican liberty, include a counterfactual vulnerability audit that asks whether affected parties could be subjected to arbitrary interference by a will that need not track their interests, even if no interference is currently occurring; and for positive liberty, include an adaptive-preference filter that checks whether the capacity being expanded is one the affected agents would endorse under conditions of non-manipulation, rather than counting every resource transfer as liberty-enhancing. The procedure should be a word-flowchart with ordered tests, explicit flag points where judgment cannot be eliminated, and a clear notation for when the three dimensions conflict rather than align. Apply it to three worked cases: a mandatory financial-literacy course tied to welfare eligibility; a discretionary noise-abatement ordinance enforced by a single unelected official with unreviewable authority; and a publicly funded apprenticeship program that requires participants to relocate to a region with few alternative employers. Include at least one case where the procedure yields a verdict I will find counterintuitive—specifically, where republican liberty is severely compromised but negative liberty looks untouched, or vice versa—and state plainly what the protocol cannot settle, such as how to weight incommensurable liberty losses when they trade off. Finally, say what specific argument or empirical finding about domination or adaptive preference would cause you to revise the procedure's structure, and identify the step in your reasoning that is most vulnerable to misapplication by a rushed practitioner.
reasoning: |-
  We are designing a decision protocol for assessing ordinances on three dimensions of liberty: negative, positive, and republican. The protocol must be structured as a word flowchart with ordered tests, flag points for judgment, and notation for conflicts. We incorporate two specific enhancements: for republican liberty, a counterfactual vulnerability audit; for positive liberty, an adaptive-preference filter.

  **Key Definitions and Filters:**

  1. **Negative Liberty (NL):** Absence of direct interference or structurally equivalent interference (e.g., barriers that are not directly imposed by human agency but function as such). 
     - *Test:* Does the ordinance create a new prohibition, requirement, or obstacle that directly restricts an agent's choices? (If yes, negative liberty is reduced.)

  2. **Positive Liberty (PL):** The effective capacity for self-authorship (autonomy). We must not count every resource transfer as liberty-enhancing. We use an adaptive-preference filter: 
     - *Adaptive-Preference Filter:* We ask whether the capacity being expanded is one that the affected agents would endorse under conditions of non-manipulation (i.e., if they were fully informed and free from coercive influences). If not, then even if resources are transferred, it does not count as enhancing positive liberty.

  3. **Republican Liberty (RL):** Non-domination, defined as the absence of arbitrary power. We include a counterfactual vulnerability audit:
     - *Counterfactual Vulnerability Audit:* Does the ordinance create a situation where an agent (or group) is subject to arbitrary interference by another (e.g., a state official, a private entity) even if no interference is currently occurring? Arbitrary interference means the power to interfere is not constrained by having to track the interests of the affected party.

  **Protocol Structure:**

  The assessment for each ordinance will proceed through the following steps in order:

  1. **Negative Liberty Impact:**
     - Step NL1: Does the ordinance impose a new direct prohibition, requirement, or obstacle on any individual or group? (e.g., a ban, a mandate, a condition for access)
       - If YES: Flag as NL reduction. Proceed to NL2.
       - If NO: No NL reduction. Skip to Positive Liberty.
     - Step NL2: Is the obstacle "structurally equivalent" to direct interference? (e.g., a rule that creates a financial or bureaucratic barrier that functions as a prohibition for a vulnerable group)
       - If YES: Flag as NL reduction. Proceed to Positive Liberty.
       - If NO: No NL reduction. Proceed to Positive Liberty.

  2. **Positive Liberty Impact:**
     - Step PL1: Does the ordinance expand resources, capabilities, or opportunities for any individual or group? (e.g., providing education, training, subsidies)
       - If NO: No PL enhancement. Skip to Republican Liberty.
       - If YES: Proceed to PL2 (adaptive-preference filter).
     - Step PL2 (Adaptive-Preference Filter): Would the affected agents endorse the specific capacity being expanded under conditions of non-manipulation? 
       - *How to judge?* Consider whether the capacity is one that aligns with basic autonomy (e.g., health, education for critical thinking) or if it is being imposed in a way that reflects manipulated preferences (e.g., training for jobs that are exploitative, or that the affected group would not choose if they had alternatives and full information).
       - If the capacity is endorsed under non-manipulation: Flag as PL enhancement.
       - If not: Do not count as PL enhancement (even if resources are transferred).
       - If uncertain: Flag for judgment (J-PL). Then proceed to Republican Liberty.

  3. **Republican Liberty Impact:**
     - Step RL1: Does the ordinance create or empower any entity (public or private) with discretionary power over others? 
       - If NO: No RL reduction. Assessment complete for RL.
       - If YES: Proceed to RL2.
     - Step RL2: Is the discretionary power arbitrary? (i.e., is it unchecked by requirements to track the interests of those subject to it? e.g., no appeal process, no clear guidelines, no accountability mechanisms)
       - If YES: Flag as RL reduction. Proceed to RL3.
       - If NO: No RL reduction. Skip to RL3? (Actually, if not arbitrary then no RL reduction, but we must also check counterfactual vulnerability even if power is not currently arbitrary? However, note: by definition, non-arbitrary power does not create domination. So if power is non-arbitrary, then no RL reduction. But we do the counterfactual audit only if power exists and is arbitrary? Let's clarify: the counterfactual vulnerability is inherent in the definition of domination. So if power is arbitrary, then by definition the vulnerability exists even if not exercised. Therefore, RL2 already captures the counterfactual. So we don't need an extra step for counterfactual. But we must ensure that RL2 asks about the potential for arbitrary interference, not just current use.)
     - Actually, let me refine: The counterfactual vulnerability audit is built into the concept. So in RL2, we are already asking: does the ordinance create a power that is arbitrary (i.e., it need not track the interests of the subject) and therefore leaves the subject vulnerable to interference at the will of the power-holder? If so, then RL is reduced even if the power is never used arbitrarily.

     Therefore, the step for RL is:
     - Step RL1: Does the ordinance create or empower an entity with discretionary power over others?
     - Step RL2: Is that power arbitrary? (i.e., not required to track the interests of the subject, and without effective constraints or accountability)
       - If YES: Flag as RL reduction.
       - If NO: No RL reduction.

     However, note that the counterfactual vulnerability is the core of the definition. So in RL2, we are inherently considering the potential for arbitrary interference.

  **Conflict Notation:**
  - After assessing all three, note:
    - If all three dimensions align (all negative, or mixed but in a consistent direction? Actually, we are assessing independently): We don't have a single verdict. Instead, we note the impacts on each.
    - But we must note when they conflict. For example, an ordinance might reduce negative liberty (by imposing a requirement) but enhance positive liberty (by building capacity) and reduce republican liberty (by creating arbitrary power). 
    - We use the following conflict notation:
      - **NL↓, PL↑, RL↓**: This would be a conflict because PL is enhanced while NL and RL are reduced.
      - We must explicitly state when the impacts are in tension.

  **Flag Points for Judgment:**
  - In PL2 (adaptive-preference filter): Judgment required (J-PL) when it is unclear whether the capacity would be endorsed under non-manipulation.
  - In RL2 (arbitrariness): Judgment required (J-RL) when the arbitrariness of the power is unclear.

  **Worked Examples:**

  ### Case 1: Mandatory financial-literacy course tied to welfare eligibility
  - **NL Impact:**
    - NL1: Yes, it imposes a requirement (course) to access welfare. → NL reduced.
    - NL2: Not needed (already reduced).
  - **PL Impact:**
    - PL1: Yes, it expands capabilities (financial literacy). → Proceed to PL2.
    - PL2: Adaptive-preference filter: Would welfare recipients endorse financial literacy training under non-manipulation? Likely yes, because financial literacy is a basic capacity for autonomy in modern society. → PL enhanced. (But note: if the course content is biased or manipulative, it might not pass the filter. We assume it is genuine.)
  - **RL Impact:**
    - RL1: Does it create discretionary power? The requirement is tied to eligibility, so the welfare agency must determine compliance. But if the rules are clear (e.g., course completion) and there is an appeal process, then the power may not be arbitrary. 
    - RL2: If the agency has discretion to deny benefits based on subjective evaluation of the course, then it might be arbitrary. But if it's a clear pass/fail, then no. We assume the rules are clear and non-discretionary. → No RL reduction.
  - **Verdict:** NL↓, PL↑, RL→ (no change). 
    - Conflict: NL reduction vs PL enhancement. The protocol does not weight these; it just reports the impacts.

  ### Case 2: Discretionary noise-abatement ordinance enforced by a single unelected official with unreviewable authority
  - **NL Impact:**
    - NL1: Yes, it imposes restrictions on noise (a prohibition). → NL reduced.
  - **PL Impact:**
    - PL1: Does it expand capabilities? It might enhance the capacity for quiet enjoyment, but that's indirect. The main effect is restriction. So probably no direct expansion of capabilities. → No PL enhancement. (Alternatively, if we consider that quiet is a condition for other activities, then it might be seen as enhancing capabilities. But let's say no because it's a restriction on others. We focus on the direct subjects: those making noise. They are restricted, not given new capabilities.) 
  - **RL Impact:**
    - RL1: Yes, it creates a power (the unelected official) with discretionary authority.
    - RL2: The official has unreviewable authority, so the power is arbitrary. The official need not track the interests of the subjects (e.g., a musician playing at a reasonable volume might be shut down arbitrarily). → RL reduced.
  - **Verdict:** NL↓, PL→, RL↓. 
    - Conflict: None explicitly, but note that the NL reduction might be justified by the goal of quiet, but the RL reduction is severe and independent.

  ### Case 3: Publicly funded apprenticeship program that requires participants to relocate to a region with few alternative employers
  - **NL Impact:**
    - NL1: Does it impose a requirement? Participation is voluntary, but if they join, they must relocate. However, the relocation is a condition of receiving the apprenticeship. So it restricts the freedom to participate without relocating. → NL reduced? (But note: it's a condition on a benefit, so it might be seen as a trade-off. However, in negative liberty terms, it is an obstacle to accessing the benefit without complying with the condition. So yes, NL reduced for those who want the apprenticeship but do not wish to relocate.)
  - **PL Impact:**
    - PL1: Yes, it expands capabilities (job training, skills).
    - PL2: Adaptive-preference filter: Would the participants endorse this specific program (including relocation) under non-manipulation? This is tricky. They might endorse the skills but not the relocation if they were fully informed and had alternatives. But if the region has few employers, that creates a risk of exploitation. However, the program might be the only opportunity for some. We must judge: if the participants, under non-manipulative conditions (with full information and without pressure), would still choose to participate even with relocation, then it passes. But if they are forced by circumstances (lack of alternatives) and would not choose it if they had other options, then it fails the filter. This is a judgment call (J-PL). Let's say we flag it as requiring judgment. But for the sake of example, we might note that the requirement to relocate to a place with few employers might create dependency and limit future autonomy, so it might not pass the filter. → Therefore, we might say no PL enhancement? Or uncertain. Let's mark as J-PL (judgment required) and then, for the sake of the example, we'll say it does not pass the filter because the relocation requirement creates a situation of vulnerability and the participants might not endorse that aspect under non-manipulation.
  - **RL Impact:**
    - RL1: Does the ordinance create discretionary power? The program administrators might have power over the participants, especially since they are in a region with few employers. But the ordinance itself might not create arbitrary power. However, note the structural condition: the requirement to relocate to a region with few employers creates a dependency on the apprenticeship provider. This might create a situation of private domination (by the employer) even if the state is not directly wielding arbitrary power. But the ordinance is the one creating this condition. So we must consider: does the ordinance enable arbitrary power by the employer? 
    - RL2: The ordinance funds the program and requires relocation, thereby placing participants in a position where they are subject to the employer's arbitrary power (because the employer could exploit them, and they have no alternatives). However, note that the employer is not created by the ordinance, and the ordinance doesn't grant the employer arbitrary power. The employer already has power in the market. But the ordinance creates the condition that enhances the employer's power over the participant. This is a structural effect. So we might say that the ordinance creates a vulnerability to arbitrary private power. Therefore, RL is reduced. 
    - Alternatively, if the ordinance includes safeguards (e.g., labor standards, exit options) then it might not. But by design, there are few alternative employers. So we flag RL reduction.
  - **Verdict:** NL↓, PL? (J-PL: likely not enhanced), RL↓. 
    - Conflict: The program might be intended to enhance capabilities (PL) but the adaptive-preference filter fails and it creates domination (RL) and restricts choice (NL).

  **Counterintuitive Case:**

  The noise-abatement ordinance (Case 2) shows a situation where negative liberty is reduced (which is intuitive) but republican liberty is severely compromised while positive liberty is untouched. 

  Another counterintuitive case might be one where negative liberty is untouched but republican liberty is reduced. Consider:

  **Hypothetical Case: A law that grants a government agency the power to arbitrarily seize property without due process, but only if the property is above a very high value threshold (say $10 million) and the agency never uses this power.**
  - NL Impact: Since the power is never used, there is no current interference. So NL is untouched? But note: the existence of the power might create a chilling effect. However, by our definition, negative liberty requires absence of interference. If there is no interference (because no seizure occurs) then NL is not reduced? But wait, the threat might be a form of interference. However, our definition of negative liberty is about actual interference. We did not include the threat in negative liberty because that falls under republican liberty (domination through vulnerability). 
    - So NL: no direct interference → NL not reduced.
  - PL: No resource transfer or capability expansion → no PL impact.
  - RL: The agency has arbitrary power (it can seize without due process) and even if not used, the vulnerability exists. → RL reduced.
  - Verdict: NL→, PL→, RL↓. This is counterintuitive because one might think that if the power is never used, there is no harm. But the republican view says the vulnerability itself is a reduction of liberty.

  **What the Protocol Cannot Settle:**
  - It does not weight the trade-offs between the three dimensions. For example, if an ordinance reduces NL but enhances PL and RL, how do we balance that? The protocol leaves that to the board's judgment.
  - It does not resolve deep uncertainties in the adaptive-preference filter or the arbitrariness assessment when judgment flags are raised.

  **Revisions Based on New Evidence:**
  - The procedure would be revised if empirical research showed that the counterfactual vulnerability audit in republican liberty is too broad (e.g., if it turns out that people do not experience vulnerability as a reduction of liberty unless the power is actually exercised) or if it is too narrow (e.g., if we find that structural factors not involving a specific power-holder can also create domination). 
  - For the adaptive-preference filter, if we discover that certain preferences (e.g., for basic health or education) are always endorsed under non-manipulation, we might hard-code those as passing the filter without judgment.

  **Vulnerable Step to Misapplication:**
  - The adaptive-preference filter (PL2) is highly vulnerable to misapplication by a rushed practitioner because it requires a counterfactual judgment about what people would want under idealized conditions. A rushed analyst might assume that any government-provided resource is automatically endorsed, or they might project their own values.

  **Final Protocol Flowchart:**

  ```
  START
