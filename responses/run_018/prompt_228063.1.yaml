prompt: |-
  Two things I keep noticing and I can't tell if they're the same phenomenon. First: last week a friend visiting from Europe refused to tip at dinner, on principle -- he thinks tipping is a rotten system and employers should just pay properly. The weird part is everyone else at the table agreed with him about the system, including the guy who then angrily threw down extra cash to cover it and called him a jerk. When my friend said "you literally just said the system shouldn't exist," the guy goes "that's not the point." Second: a coworker thinks our local escalator rule (stand right, walk left) is dumb because it halves capacity, and she's probably right, but she still gets visibly annoyed when tourists stand on the left. She'll rant about the rule at lunch and then enforce it with her eyes the same afternoon.

  So the pattern is: getting sincerely angry at someone for breaking a convention you yourself think shouldn't exist. It's not hypocrisy, because they'll cheerfully admit the rule is bad if you ask. It's also not that they've been fooled into thinking everyone else loves the rule -- my tablemate knew the whole table agreed with the European guy. But the anger doesn't feel fake or conflicted to them, it feels completely appropriate, and the "that's not the point" seems to be doing real work.

  Is there a name for this? People keep telling me it's "just how norms work," which isn't a name. If there's something established, how is it different from plain hypocrisy and from just being confused? And if there isn't, what would you call it -- and does it make a difference that my friend is open about his reasons and would happily see the whole system burn, versus someone who just doesn't feel like tipping that night?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're describing two scenarios where people get angry at others for breaking a convention they themselves believe shouldn't exist. The key points are the sincere anger despite opposing the rule, and the lack of hypocrisy because they admit the rule is bad. The user wants to know if there's a name for this phenomenon and how it differs from hypocrisy or confusion.

  First, I need to identify the core issue. It's about social norms and the tension between personal beliefs and collective behavior. The tipping example shows the table agreeing the system is flawed, yet one person still covers the tip and calls the European friend a jerk. The escalator rule highlights someone criticizing the rule but enforcing it. The user is noticing a pattern where people uphold norms they disagree with and react emotionally when others break them.

  Next, I should consider possible concepts. Cognitive dissonance comes to mind, but it's not quite right because the individuals aren't conflicted; they seem comfortable with their stance. Hypocrisy doesn't fit because they're open about their beliefs. Then there's the idea of descriptive vs. injunctive norms. Descriptive is what people do, injunctive is what should be done. Here, the anger might stem from breaking the descriptive norm even when the injunctive is rejected. 

  The bystander effect or pluralistic ignorance might be considered, but the user mentioned that everyone knows others disagree with the norm, so ignorance isn't the issue. The key here is the practical necessity of coordination. Even bad norms require compliance to avoid chaos, which explains the anger when someone unilaterally defects. 

  The term that fits best is "normative dissonance." It captures the conflict between personal values and the perceived need to follow existing norms. The emotional response arises because defection disrupts coordination and imposes costs on others. In the tipping case, the server suffers, and in the escalator, efficiency drops. The European friend's principled stand ignores the immediate consequences, prompting anger from others who feel obligated to mitigate harm. 

  The user also asks about the difference between principled opposition and mere non-compliance. The coworker's annoyance at tourists might be because their defiance is seen as uninformed, unlike the friend who openly rejects the system. The anger is directed at the lack of regard for collective coordination, not the act itself. 

  I should also address why "that's not the point" makes sense. The point isn't the rule's validity but the immediate social contract. Breaking it forces others to bear the burden, hence the frustration. The deeper need here is understanding social mechanics and human behavior in systems, possibly seeking validation of their observation and terminology to discuss it effectively.
answer: |-
  This is a fascinating and astute observation of a very real social phenomenon. You're right that it's **not simple hypocrisy** (they openly admit the rule is bad) and **not confusion** (they understand the contradiction). It's a specific tension arising from how social norms function, even flawed ones.

  Here's a breakdown of the phenomenon and potential names:

  1.  **The Core Mechanism: Coordination Costs & The Social Contract (Even Bad Ones):**
      *   **Shared Understanding:** A convention or norm, even a bad one, creates a shared understanding of how to behave in a specific situation. This predictability reduces friction and coordination costs (e.g., knowing which side of the escalator to stand on, knowing servers expect 15-20%).
      *   **Burden of Defection:** When someone unilaterally defects from the *current, active* norm (like refusing to tip in a tipping culture or blocking the walking lane), it disrupts this predictability. The costs of that disruption often fall *immediately* on others present (the server who might get stiffed, the people stuck behind the tourist, the friends embarrassed or forced to compensate).
      *   **Anger at Unilateral Action:** The anger stems not necessarily from believing the *norm itself* is morally right, but from the *act of unilateral defection* causing immediate, tangible problems for others within the existing system. It's seen as selfishly imposing the costs of defection onto others without their consent or a coordinated effort to change the system. Your friend saying "that's not the point" is acknowledging that while the *system* is bad, the *immediate consequence* of his action (the server potentially being underpaid for *that specific service*) is the real issue *right now*.

  2.  **Best Term: Normative Dissonance (with Coordination Emphasis)**
      *   **Normative Dissonance:** This captures the psychological state: holding a belief ("this norm is bad") that conflicts with a behavioral tendency (enforcing/complying with the norm) or emotional reaction (anger at its violation). It highlights the internal tension.
      *   **Coordination Norm / Equilibrium Trap:** This emphasizes *why* the dissonance exists. The norm persists because it's a stable (though inefficient or unfair) equilibrium point. Unilateral defection destabilizes it, causing immediate coordination failures. People get angry because the defector broke the fragile truce of the existing system, forcing others to bear the brunt.

  3.  **Why "Just How Norms Work" is Incomplete (But Partly Right):**
      People are correct that norms *rely* on enforcement to exist. However, your observation highlights the *specific case* where enforcement persists *despite* widespread belief in the norm's flaws. This isn't just *any* norm enforcement; it's enforcement driven by the **pragmatic need for coordination and the immediate costs of defection**, overriding the abstract disapproval of the norm itself.

  4.  **How it Differs:**
      *   **From Plain Hypocrisy:** Hypocrisy involves *concealing* a discrepancy between belief and action/condemnation ("I tip because it's the right thing to do" while secretly hating it). Here, the discrepancy is **openly acknowledged** ("The system sucks... but you still have to tip right now"). The anger isn't about violating the *principle* but about violating the *functional requirement* of the current system.
      *   **From Confusion:** There's no misunderstanding. They grasp the contradiction perfectly. The anger is a separate, situationally triggered response to the immediate consequences of the defection.

  5.  **The Importance of Motivation (Principle vs. Cheap Defection):**
      *   **Principled Defiance (Your Friend):** This *intensifies* the reaction. By openly stating his opposition and willingness to "burn the system," he makes his defection a deliberate, ideological act. To others, this feels like he's prioritizing his abstract principle over the *immediate, real-world harm* (the server's lost wages, the friends' discomfort/need to compensate). His stance forces others to confront the system's injustice *by making them complicit in its immediate negative effects* (covering the tip). This can feel like moral grandstanding at others' expense.
      *   **Cheap Defection (Just not tipping that night):** This might provoke anger for being stingy or unfair to the server, but it lacks the ideological challenge. The anger is more about selfishness or unfairness within the system, not a direct challenge to the system *itself* forcing others to deal with the fallout. The "that's not the point" reaction is less potent here; the point *is* often just perceived stinginess.

  **In essence:** You're observing **Normative Dissonance** arising specifically from the **enforcement of coordination norms** that are widely seen as flawed. People get angry because unilateral defection from an *active, functional* norm (even a bad one) disrupts coordination and imposes immediate, tangible costs on others. The anger is directed at the *disruptive act* and its *immediate consequences* within the existing framework, not at the violation of the underlying principle they themselves reject. The open, principled defiance makes the dissonance *more* acute because it forces bystanders to directly bear the costs of the defector's ideological stance.
