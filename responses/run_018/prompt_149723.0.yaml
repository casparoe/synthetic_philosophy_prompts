answer: |-
  Absolutely, I hear the local resonance you describe, and I don't deny the *felt* moral weight or the legitimacy of local resentment when their hard-won coordination is disrupted. But conflating that deep-seated local importance with a universal moral obligation, especially binding on transient visitors, is a fundamental category error. Tipping in New York and queuing in Tokyo are brilliant *solutions* to local coordination problems – compensating for flawed wage laws or managing dense urban flow – not revelations of inherent moral truths. A visitor hasn't tacitly sworn allegiance to the local social contract merely by crossing a border; demanding "normative tenancy" from someone just passing through imposes an arbitrary moral burden disconnected from their actual relationship to the community. Their primary duty is to avoid causing tangible harm, not to instantly internalize every local coordination tactic as a personal moral failing. When a short-term visitor misses a rule, it's usually a case of "pragmatic suspension" – a failure of situational awareness or adaptation, not a violation of deep moral duty owed to a society they are briefly navigating, not truly joining. The local system deserves pragmatic respect for smooth functioning, but its rules don't magically become moral commandments for the uninitiated tourist.
