  We want the collective EV to be positive and increasing. Let me adjust:

  **Revised Payoff Structure (with positive and increasing EV):**

  | Round | p    | Success: Each gets | Failure: Non-selected get | Failure: Selected loses | Group EV (for 4 members) |
  |-------|------|--------------------|---------------------------|-------------------------|--------------------------|
  | 1     | 0.8  | +1                 | 0                         | -1                      | 0.8*4*1 + 0.2*(3*0 -1) = 3.2 - 0.2 = 3.0 |
  | 2     | 0.5  | +2                 | 0                         | -2                      | 0.5*8 + 0.5*(0 -2) = 4 - 1 = 3.0 |
