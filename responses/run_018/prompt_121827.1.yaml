  Round 1: p=0.8, if success: everyone +1. If failure: one randomly selected loses 1, others 0. EV = 0.8*4 - 0.2*1 = 3.2 - 0.2 = 3.0

  Round 2: p=0.5, if success: everyone +3. If failure: one loses 2, others 0. EV = 0.5*12 - 0.5*2 = 6 - 1 = 5.0? That's increasing.

  But let me set:

  Round 1: p=0.8, success: each +1 -> total +4; failure: one -1, others 0 -> total -1. EV = 0.8*4 + 0.2*(-1) = 3.2 - 0.2 = 3.0

  Round 2: p=0.6, success: each +2 -> total +8; failure: one -3, others 0 -> total -3. EV = 0.6*8 + 0.4*(-3) = 4.8 - 1.2 = 3.6

  Round 3: p=0.4, success: each +5 -> total +20; failure: one -10, others 0 -> total -10. EV = 0.4*20 + 0.6*(-10) = 8 - 6 = 2.0 -> not increasing.

  Let me try with higher rewards and lower probabilities:

  Round 3: p=0.2, success: each +10 -> total +40; failure: one -10, others 0 -> total -10. EV = 0.2*40 + 0.8*(-10) = 8 - 8 = 0 -> not good.

  We need the EV to be positive and increasing. How about we make the success reward scale with 1/p? But also the loss must be large but the probability of failure is high.

  Idea: In the failure state, only one person loses, but the loss is L. In success, everyone gains G. The group EV is: p*(4G) + (1-p)*(-L). We want this to be positive and increasing.

  Set:
  Round 1: p=0.8, G=1, L=1 -> EV= 3.2 - 0.2 = 3.0
  Round 2: p=0.5, G=2, L=2 -> EV= 4 - 1 = 3.0 (same)
