prompt: |-
  I'm teaching a senior seminar on rational choice and risk—about 16 students, one 80-minute session. We've talked through the usual expected-value arguments and everyone gets Pascal's wager intellectually, but they treat EV fanaticism like a remote math puzzle rather than something that could actually pull on a decision. I want an in-class game that makes them feel that pull in their bones, but with a twist: instead of one agent facing an infinite-upside gamble, I want the risk and reward distributed across the group so that advancing the collective "expected value" requires sacrificing the outcomes of a minority subset. Think collective EV fanaticism staged with small real stakes—like forfeiting a snack, taking on an embarrassing task, or losing points that affect a group grade—never actual money. Design the full activity: rules, materials, a payoff structure using points or tokens, decision rounds where they construct the escalation themselves, and a debrief that maps each round onto the formal structure (probability weighting, utility aggregation, and the point where the downside becomes arbitrarily bad relative to the upside). Also be honest about what will predictably break the first time I run it, and which feature of the philosophical view—probably the assumption that utilities are interpersonally comparable and linearly aggregable—this physical setup literally can't reproduce, so I need to supply it in the debrief. No bibliography or citation list needed; I just need something I can run monday.
reasoning: |-
  We are going to design an in-class activity to simulate collective EV fanaticism. The core idea: the group as a whole can choose to take a gamble that has a very small probability of a very large positive payoff (for the group) but a high probability of a negative outcome for a randomly selected minority. We'll use points that can be converted into a small reward (like candy or extra credit points) to make the stakes real but low.

  **Activity Title:** The Collective Gamble

  **Learning Objective:** To experience the tension between maximizing collective expected value and the potential harm to a minority, and to critically examine the assumptions of expected utility theory when applied collectively.

  **Materials:**
  - Index cards (one per student) or a digital randomizer for selecting the "loser"
  - A way to record points (whiteboard, poster paper, or a shared digital document)
  - A random number generator (for simulating probabilities, e.g., a 100-sided die or a digital simulator)
  - Tokens or chips to represent points (optional, but can make it more tangible)
  - A bowl or container for drawing names (if using index cards)

  **Setup:**
  - Divide the class into 4 groups of 4 students each (or adjust based on 16 students). Each group will be a "collective".
  - Explain that each collective will play a series of rounds. In each round, they will make a collective decision: to take a gamble or not.
  - The goal of each collective is to maximize the total points for the group. At the end of the activity, the points will be converted into a reward (e.g., each 10 points = one piece of candy, or a small bonus on the next assignment).

  **Round Structure:**
  We will have 4 rounds. The probability of the positive outcome decreases in each round, but the positive payoff increases. The negative outcome (which affects one randomly selected member) becomes more severe. The key is that the collective expected value (EV) remains positive and even grows, but the risk to an individual becomes more extreme.

