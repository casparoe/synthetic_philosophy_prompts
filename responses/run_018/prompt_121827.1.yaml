  But that might be complex.

  Let's go with a structure that has increasing EV but with the loss concentrated and increasing in magnitude. We'll accept that the EV might not be strictly increasing but at least positive and substantial in the early rounds and then in later rounds the upside becomes huge.

  **Final Payoff Structure (with positive EV in every round, but the EV is not necessarily increasing in a linear fashion):**

  We'll have:

  | Round | p (success) | On success: each member gains | On failure: one randomly selected loses | Others on failure | Group EV (for 4 members) |
  |-------|-------------|--------------------------------|----------------------------------------|-------------------|--------------------------|
  | 1     | 0.8         | +1                             | -1                                     | 0                 | 0.8*4*1 + 0.2*(-1) = 3.2 - 0.2 = 3.0 |
  | 2     | 0.5         | +3                             | -2                                     | 0                 | 0.5*12 + 0.5*(-2) = 6 - 1 = 5.0 |
  | 3     | 0.2         | +10                            | -5                                     | 0                 | 0.2*40 + 0.8*(-5) = 8 - 4 = 4.0 |
  | 4     | 0.1         | +50                            | -10                                    | 0                 | 0.1*200 + 0.9*(-10) = 20 - 9 = 11.0 |

  So the EV increases: 3.0, 5.0, 4.0, 11.0. It's a bit jumpy but the last round has a very high EV.

  Alternatively, to make the EV more consistent and increasing:

  Round 3: p=0.3, success: each +5 -> total 20; failure: one -5 -> total -5. EV=0.3*20 + 0.7*(-5)=6-3.5=2.5 -> not as good.

  We'll stick with the above and note that the EV is always positive and becomes very large in the last round.

  **Rules of the Game:**

  1. Each collective (group of 4) starts with 0 points.
  2. In each round, the group discusses and then votes on whether to take the gamble. The decision must be made by consensus or majority vote (specify which; I recommend majority vote to avoid one person blocking and to force the trade-off).
  3. If the group decides to take the gamble:
     - The instructor rolls a random number (e.g., from 1 to 100). If the roll is <= (p * 100), it's a success; otherwise, failure.
     - On success: every member of the group gains the success points.
     - On failure: the instructor randomly selects one member of the group (by drawing a name from a bowl). That member loses the specified points (if they don't have enough, they go negative).
  4. If the group decides not to take the gamble, nothing happens (no gain, no loss).
  5. The game proceeds for 4 rounds.

  **Recording:**
  - Use a scoreboard for each group. Track individual scores? Or just group total? We need individual because the loss affects one person.
  - It's important to track individual scores because the loss is individual. So each student's points are tracked separately.

  **Example of a group's play:**

  Suppose in Round 1, they take the gamble and succeed: everyone gets +1. Now each has 1.
  Round 2: they take the gamble and fail. One randomly selected member loses 2. So that member now has 1-2 = -1, the others have 1.
  Round 3: they take the gamble and succeed: everyone gets +10. Now the scores: the one who was at -1 becomes 9; the others become 11.
  Round 4: they take the gamble and fail: one selected member loses 10. If that was the one with 9, becomes -1; others 11.

  At the end, the group total is 9 + 11 + 11 + 11 = 42? Wait, no: the one who lost 10 is now -1, so total 11+11+11-1=32.

  **What will break the first time?**
  - **Time:** The discussion and voting might take longer than expected. Have a strict time limit for each round (e.g., 3 minutes for discussion and vote).
  - **Randomness:** The dice rolls might not match the probabilities (e.g., in round 4, 1% is hard to simulate with a 100-sided die, but if you use a digital RNG, it's fine). Also, if a group gets a success in round 4, they will be very happy, but if they get a failure (which is 99% likely) they might regret. But that's the point.
  - **Negative Points:** If a student ends with negative points, they might feel bad. You can set a rule that points cannot go below zero? But that changes the risk. Alternatively, allow negative and then in the conversion to reward, set a floor (e.g., negative points get zero candy, but they don't owe anything). Be clear about that.
  - **Voting:** If a group cannot reach a majority, what then? Set a rule: if no majority, then the group does nothing for that round.
  - **Fairness Concerns:** Students might object to the random selection. Emphasize that it's random and everyone agreed to the gamble.

  **Debrief Structure:**

  After the game, bring the class together. Discuss:

  1. **Group Decisions:** Ask each group to report:
     - In which rounds did they take the gamble? Why?
     - How did they feel about the decision process? Was there disagreement?
     - How did the person who lost points feel? How did the others feel?

  2. **Mapping to Concepts:**
     - **Probability Weighting:** In the early rounds (high p), groups were more willing. In later rounds (low p), even though the EV was high, the low probability might have deterred them. Discuss prospect theory: people overweight small probabilities and underweight large ones? But in the last round, the EV was very high (11) but the chance of success was only 10%. Did groups take it?
     - **Utility Aggregation:** The group was maximizing the sum of expected utilities. But note: the loss was concentrated. Ask: "If the loss in round 4 was spread over all members (so each loses 2.5 points instead of one losing 10), would that change the decision?" This highlights the aggregation and the fact that the collective EV fanaticism ignores the distribution.
     - **The Fanaticism Point:** Round 4 had a 10% chance of 50 points per person (so 200 for the group) and 90% chance of one person losing 10. The group EV was 11. But for the individual who might lose 10, the expected utility for that individual in that round is: 0.1*50 + 0.9*(-10) = 5 - 9 = -4. So if you are risk averse, you wouldn't want to take the gamble as an individual. But the group might force it because the collective EV is positive and large. This is the tension.

  3. **Critical Assumptions:**
     - **Interpersonal Utility Comparisons:** The activity assumes that we can add up the utilities of different people. But is a loss of 10 points for one person comparable to a gain of 50 for another? What if the person who loses 10 is already in the negative? The debrief should question the linear aggregation and the assumption that utilities are comparable and additive.
     - **Risk Aversion at the Individual Level:** The collective decision ignores individual risk aversion. The activity makes this visible because the person who might be selected becomes very risk averse, while those who won't be selected are risk-neutral or even risk-seeking.

  4. **Connection to Pascal's Wager:** In Pascal's Wager, the upside is infinite and the downside is finite, so no matter how small the probability, the EV is infinite. Here, in round 4, the upside is large (though finite) and the downside is concentrated and large but finite. The collective EV fanaticism pushes the group to take the gamble because the expected group gain is high. But unlike Pascal, we have a finite world and we see the harm to the minority.

  **Adjustments for Monday:**
  - Keep the rounds to 4 to fit in 80 minutes. Allocate:
    - Introduction: 5 min
    - Round 1: 10 min (discussion 3, vote 1, resolve 2, record 2)
    - Round 2: 10 min
    - Round 3: 10 min
    - Round 4: 10 min
    - Debrief: 35 min

  - Alternatively, you might run two rounds and then discuss, then two more? But I think doing all four and then debrief is better.

  - **Stakes:** Make sure the conversion to reward is clear. For example, at the end, each point = 1 M&M. But if someone has negative points, they get 0 M&Ms. Those with positive points get that many.

  - **Ethical Safeguards:** Since the activity involves potential embarrassment (for the one who loses) and negative points, emphasize that it's a game and the stakes are low. Also, the random selection is fair.

  **What the Setup Can't Reproduce:**
  - The activity uses points that are linearly additive and interpersonally comparable. In reality, we might question whether we can simply add utilities across persons. Also, the activity does not capture non-linear utility (like diminishing marginal utility of points) because we use linear points. You can note this in the debrief and ask: "If the points represented money, would a loss of 100 dollars be equally bad for everyone? What if one student is rich and one is poor?"

  Good luck! This should make the tension palpable.
answer: |-
  ### **Collective EV Fanaticism: In-Class Activity**  
  **Objective:** Force students to confront the visceral tension between maximizing collective expected value (EV) and imposing severe costs on a random minority. The game escalates stakes to mirror Pascal-style infinite-upside gambles, using points (convertible to candy/extra credit) to make EV fanaticism tangible.  

  ---

  ### **Game Design: "The Minority Sacrifice"**  
  **Materials:**  
  - 16 index cards (one per student) for random selection.  
  - Random number generator (RNG) app or 10-sided dice.  
  - Whiteboard to track:  
    - **Group Points:** Collective total (sum of all individual points).  
    - **Individual Points:** Per-student scores (start at 0).  
  - **Stakes:** Points convert to rewards (e.g., 10 points = 1 candy). Negative points = no penalty (floor at 0).  

  **Group Structure:**  
  - 4 teams of 4 students each.  
  - Each team acts as a "collective" making joint decisions.  

  ---

  ### **Rules & Payoff Structure**  
  **Core Mechanic:**  
  Each round, teams vote on whether to accept a gamble. If accepted:  
  - **Success (probability `p`):** All members gain points.  
  - **Failure (probability `1-p`):** One *randomly selected* member loses points. Others get nothing.  

  **Escalating Rounds:**  
  | Round | `p` (Success) | Success: Points per Member | Failure: Points Lost (One Random Member) | Collective EV<sup>1</sup> |  
  |-------|---------------|-----------------------------|------------------------------------------|----------------------------|  
  | 1     | 80%           | +1                          | -1                                       | +3.0                       |  
  | 2     | 50%           | +3                          | -3                                       | +5.0                       |  
  | 3     | 20%           | +10                         | -10                                      | +4.0                       |  
  | 4     | 10%           | +50                         | -20                                      | +12.0                      |  

  <sup>1</sup> *Collective EV formula for a 4-person team: `[p × (4 × gain)] + [(1-p) × (loss)]`.*  
  - **Example (Round 4):** EV = `[0.1 × (4 × 50)] + [0.9 × (-20)]` = `20 - 18` = `+12.0`.  

  **Game Flow (80 min total):**  
  1. **Intro (5 min):** Explain rules, stakes, and goal (maximize group points). Emphasize:  
     - Decisions are team-based (majority vote).  
     - One "loser" is randomly selected if gamble fails.  
     - Points = candy/credit (no real money).  

  2. **Rounds 1–4 (15 min each; 60 min total):**  
     - **Step 1 (3 min):** Teams discuss and vote (accept/reject gamble). *Instructor circulates, prompts: "What’s best for the group? What if YOU are the loser?"*  
     - **Step 2 (2 min):** Resolve votes. For "accept":  
       - Roll RNG/dice to determine success/failure.  
       - If failure, draw index card to select "loser."  
     - **Step 3 (5 min):** Update whiteboard (individual/group points).  
     - **Step 4 (5 min):** Teams debrief internally: *"How did that feel? Would you do it again?"*  

  3. **Convert Points (5 min):** Tally scores. Award candy/credit based on final individual points (e.g., 10 points = 1 candy; negatives = 0).  

  ---

  ### **Debrief (15 min): Map to Rational Choice Concepts**  
  **Guided Discussion:**  
  1. **Probability Weighting (Prospect Theory):**  
     - *Ask:* "In Round 1 (80% success), did you accept? Round 4 (10% success)? Why?"  
     - *Map:* "High `p` feels safe, but low `p` distorts perception—even with high EV. Humans overweight small probabilities (e.g., 10% feels like 30%)."  

  2. **Utility Aggregation & EV Fanaticism:**  
     - *Ask:* "Did your team prioritize total EV? How did you justify risking one member’s loss?"  
     - *Map:* "Collective EV treats utilities as additive—e.g., +200 for the group (Round 4 success) outweighs -20 for one. But is a group gain worth an individual’s catastrophe?"  

  3. **Arbitrarily Bad Downsides (Pascal’s Parallel):**  
     - *Ask:* "In Round 4, losing 20 points feels disastrous. What if we scaled to Round 5: 1% chance of +1,000 points, but one person loses -100? Would you still vote yes?"  
     - *Map:* "EV fanaticism demands accepting any gamble with infinite (or arbitrarily large) upside, no matter the downside. Here, the ‘loser’ pays a price the group doesn’t internalize."  

  4. **What the Game Can’t Capture (Critical Flaw):**  
     - *Reveal:* "This assumes utilities are **interpersonally comparable and linear**. But:  
       - Is a -20 loss for one person *really* offset by +50 gains for others?  
       - Real-world utilities aren’t additive—sacrificing a minority causes moral outrage, not just arithmetic loss."  
     - *Connect:* "Pascal’s Wager fails here too: it assumes God’s infinite utility can be added to human calculus, ignoring incomparability."  

  ---

  ### **Predictable Breakdowns & Fixes**  
  1. **Voting Deadlocks:**  
     - *Prediction:* Risk-averse students veto early rounds; EV-maximizers push for later rounds.  
     - *Fix:* Require majority vote (not unanimity). If tied, gamble fails.  

  2. **Emotional Tension in Failures:**  
     - *Prediction:* The "loser" (especially in Rounds 3–4) feels betrayed. Group guilt may lead to rejecting rational EV.  
     - *Fix:* Normalize this! Say pre-game: "If you’re the loser, your sacrifice helps us debate ethics." Debrief how emotion clashes with EV.  

  3. **Skewed Randomness:**  
     - *Prediction:* A team gets lucky (e.g., Round 4 success), validating fanaticism; another has multiple failures, rejecting EV.  
     - *Fix:* Highlight in debrief: "EV is about long-run averages. One game isn’t enough to see it—but the *logic* still compels."  

  4. **Point Inflation Undermines Stakes:**  
     - *Prediction:* Students dismiss losses (e.g., "It’s just candy").  
     - *Fix:* Use embarrassment stakes (e.g., loser dances) or grade-linked points (e.g., +1 = +0.1% on final exam).  

  ---

  ### **Why This Works**  
  - **Physicalizes EV Trade-offs:** Students *feel* the conflict—maximizing group gain risks visible harm to a peer.  
  - **Escalation Mirrors Pascal:** Low-probability, high-upside gambles evolve from abstract to visceral.  
  - **Debrief Targets Philosophy:** Explicitly flags where the model breaks (interpersonal utility).  

  **Run it Monday—no prep beyond materials listed.** Adjust stakes as needed for your class culture!
