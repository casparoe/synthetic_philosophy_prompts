prompt: |-
  hey so ive been thinking about history explanations and i keep running into this thing where people list like five reasons for some big event and it feels like theyre just stacking causes without asking if they actually do seperate work. i made up this term shadow-causation for when one cause looks sufficient on its own but really it just flipped the switch on the real one. can you write me a final-exam essay prompt for an upper-level undergrad course (90 minutes, 30 marks) that tests overdetermination vs multi-causal explanation in history using a hypothetical case study: the 1912 Greystone textile strike collapsed after (1) the ironworks suddenly shut, (2) union leader Mara Voss gave a fiery speech, and (3) a new labor law was passed that same week. the students should classify each pair of causes as genuinely overdetermined (each alone enough), jointly sufficient but neither alone enough, or shadow-causal (one only worked because it triggered the other). then they need to argue whether putting all three in the historical explanantion actually makes it better or just creates redundancy. i want a model answer that applies this to Greystone specifically, not just reciting definitions, and a marking scheme that lists the specific moves that should recieve marks and the specific mistakes that should cost them — for example treating causal interaction as overdetermination, or assuming more listed causes always means a stronger story. please dont ask for citations, bibliographies, or reading lists since this is meant for a model that cant search the web. also write the prompt like im just some random person who read a couple articles on my own, not a professor. i might have a typo or two in here, like "seperate" and "explanantion", thats fine. make sure the exam question is hard enough that you cant answer it by just naming the concepts.
