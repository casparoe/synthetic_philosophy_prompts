  ## The Tangled Cords: Reconciling Thomson and Marquis in the Twilight of Dependency

  Judith Jarvis Thomson's "A Defense of Abortion" and Don Marquis's "Why Abortion is Immoral" present two of the most influential, yet seemingly contradictory, arguments in the abortion debate. Thomson's violinist analogy emphasizes bodily autonomy as paramount, justifying the refusal to sustain life, even when fatal. Marquis's Future-Like-Ours (FLO) argument centers on the inherent wrongness of depriving a being of its valuable future. The critical question arises when we modify Thomson's scenario: **what if the person attached to you, whose life depends solely on your body, possesses a valuable future like ours?** Does the right to "unplug" hold, or does the FLO claim fundamentally alter the moral calculus, rendering withdrawal impermissible? While the arguments initially appear to talk past each other – one focused on the rights-bearer, the other on the victim – careful analysis reveals they *can* be made consistent, albeit with significant tension, by prioritizing the nature of the imposed burden over the victim's potential loss.

  **Thomson's Autonomy Imperative: The Right to Refuse Sustenance**
  Thomson's violinist scenario asks us to imagine waking up attached, via life-support, to a famous unconscious violinist who will die without your kidneys for nine months. She argues that while it would be *charitable* to stay connected, you have no *obligation* to do so. Your right to bodily autonomy – the right to decide what happens within and to your body – supersedes the violinist's right to life *in this specific context of forced, invasive bodily use*. The core wrongness addressed is the violation of the unwilling sustainer's bodily integrity and self-determination. Killing is not the primary issue; *letting die* as a consequence of asserting a fundamental right is permissible. The violinist's age, consciousness, or potential future are irrelevant to this core claim of non-consensual bodily appropriation.

  **Marquis's Deprivation Thesis: The Value of the Future**
  Marquis bypasses the fraught question of "personhood" by arguing that what makes killing *any* adult human wrong is the deprivation of their "future like ours" (FLO) – a future containing valuable experiences, projects, and consciousness. He extends this to fetuses (and by analogy, our modified dependent being), contending that abortion is seriously immoral for the same reason: it deprives the fetus of that valuable future. The core wrongness is the act of killing itself, understood as the infliction of the ultimate harm – the loss of all possible future goods. The moral status of the victim hinges on the *kind* of future it would have had, not necessarily on current capacities or relationships.

  **The Modified Case: The Developing Dependent with FLO**
  Now, imagine Thomson's scenario modified: instead of an adult violinist, you are attached to a *developing being* – perhaps a genetically unique human entity gestating externally, or an infant with a severe dependency – whose biological trajectory guarantees it will develop into a being with a standard human FLO, provided it receives the life-sustaining connection to *your* body for the required period. This being possesses the *potential* for that future, contingent solely on your continued bodily support. The FLO argument clearly applies: unplugging *would* deprive it of its valuable future. Does Thomson's right to bodily autonomy still justify withdrawal?

  **The Apparent Conflict and Path to Consistency**
  The conflict seems stark:
  1.  **FLO Claims:** Unplugging the dependent being *is* killing (actively severing life support) and directly deprives it of its FLO. According to Marquis, this is seriously immoral, akin to killing a child or adult.
  2.  **Autonomy Claims:** The burden of sustaining this life remains non-consensual, invasive, and requires significant physical and psychological sacrifice. Forcing this upon someone violates their fundamental right to bodily integrity, regardless of the dependent's potential.

  However, consistency is possible by recognizing that Thomson and Marquis address **different moral questions located on different planes**:

  *   **Thomson addresses permissibility based on imposed burdens:** Her argument establishes that *even when* an action (withdrawing life support) results in death, it can be morally *permissible* if it is necessary to end a severe, non-consensual violation of bodily autonomy. She concedes killing is generally wrong but argues this specific context creates an exception. The *kind* of harm inflicted on the victim (death) is acknowledged, but outweighed by the violation being prevented.
  *   **Marquis defines the core wrongness of killing:** His argument defines *why* killing is a grave harm – it deprives the victim of FLO. This applies *whenever* a being with FLO is killed. However, Marquis does not explicitly address *whether this grave harm can ever be justified or outweighed by other moral imperatives*, particularly the imperative to prevent a severe, rights-violating burden on another.

  Therefore, the arguments can be reconciled by accepting **both propositions simultaneously**:

  1.  **Killing the dependent being *is* a serious moral harm** because it deprives it of its FLO (Marquis's point).
  2.  **Nevertheless, the right to withdraw life-sustaining bodily support remains,** **making the act of unplugging morally permissible** when the burden of providing that support is non-consensual, significant, and violates bodily autonomy (Thomson's point).

  **The Harm Remains, But Autonomy Prevails**
  The FLO claim *does* change the nature of the harm caused by unplugging – it makes it a harm of the same *type* as killing an adult, namely deprivation of a valuable future. It significantly increases the moral *stakes* of the decision to withdraw support. However, it does not *automatically block* the right to withdraw. Thomson's core insight holds: the right to refuse the extraordinary, invasive, and non-consensual use of one's body as life support is a fundamental negative right (a right *not* to be used). This right exists independently of the *value* of what the dependent stands to lose. Forcing someone to endure pregnancy or its analog against their will constitutes a profound violation, regardless of whether the dependent being has a valuable future. The FLO argument identifies the cost of exercising this right, but it does not dissolve the right itself.

  **Conclusion: A Consistent, Yet Morally Weighted, Framework**
  Thomson's violinist argument and Marquis's FLO argument can be made consistent within the modified case of the dependent being with a future like ours. The FLO argument successfully establishes that unplugging inflicts a profound harm – the deprivation of a valuable future – elevating the moral gravity of the act beyond the original violinist scenario. **However, it does not negate Thomson's foundational principle: the right to bodily autonomy can justify permitting this harm when the alternative is the sustained, non-consensual violation of that very autonomy.** The right to withdraw life-support still applies. The arguments are not talking past each other; rather, they illuminate two powerful, competing moral claims: the profound wrong of depriving an entity of its future, and the fundamental right to refuse the invasive use of one's body. Reconciling them requires acknowledging the validity of both harms – the harm of death to the dependent being and the harm of forced bodily servitude to the sustainer – and recognizing that, in this specific context of *imposed, life-sustaining dependency*, the right to bodily integrity provides the decisive grounds for permissible withdrawal, even when the cost is the loss of a future like ours. The cords of dependency bind tightly, but the right to sever them, though fraught with loss, remains grounded in the inviolability of the self.
