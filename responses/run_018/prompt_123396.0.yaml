          - But note: the problem statement does not require the central angles to be in [0,π]. So why restrict to [0,π]? We are applying the principle of indifference to the central angle of each arc, but we have to remember that the central angle can be up to 2π. But if we choose uniformly in [0,2π] for each, we run into the constraint issue and we did that in the first method and got 1/4. Now we are choosing in [0,π] for each independently, which is a different sample space.

          - We must justify: if we are indifferent about the central angle for each arc, why not take the range [0,2π]? But if we do that, we get the first method and 1/4. Alternatively, we might be indifferent over the chord length, and the chord length determines a central angle in [0,π]. So if we are indifferent about the chord length, then we might choose the central angle uniformly in [0,π] because the chord length is a function of the central angle and the mapping is one-to-one for central angles in [0,π].

          - Therefore, the second method can be motivated by: we are indifferent about the length of each chord (side of the triangle). The chord length L = 2R sin(θ/2), where θ is the central angle in [0,π]. If we want the chord length to be chosen uniformly, then we note that the uniform distribution on [0, 2R] for L corresponds to a non-uniform distribution for θ: the density of θ is proportional to |dL/dθ| = R |cos(θ/2)|. But if we are indifferent about θ, we might choose θ uniformly in [0,π]. So we have two different ways:

            Option A: uniform in L -> then θ has density proportional to |cos(θ/2)|.
            Option B: uniform in θ -> then L has density proportional to |dL/dθ|^{-1} = 1/|cos(θ/2)|.

          - We are using option B: uniform in θ for each chord? But note: we have three chords and they are not independent. So we cannot choose three central angles independently even if we wanted to.

          - So we must clarify: we are choosing the central angles for the three arcs (not the chords) and we are restricting each to [0,π]. But an arc can be up to 2π? Why restrict to [0,π]? We are applying the principle of indifference to the arc lengths? But note: if we are indifferent about the arc lengths, we would choose them uniformly on the simplex as in the first method. 

          - The second method we are using is different: we are applying the principle of indifference to the central angles of the arcs but we are restricting the range to [0,π] arbitrarily. Why? Because if we think of the arc as being determined by its chord, and the chord's central angle is in [0,π], then we might think that the arc length should be in [0, πR] (but note: the arc length is Rθ, so θ in [0,π] gives arc length in [0, πR]). However, the arc length can be up to 2πR? So we are arbitrarily restricting the arc length to half of its possible range.

          - This is the crux: the second method is not a valid application of the principle of indifference to the arc lengths because we are restricting the range. But we can present it as: "What if we were to choose the arc lengths independently and uniformly in [0, π] (meaning we allow arc lengths only up to π)?" Then we get the probability 1/2.

          - So we have two different sample spaces:

              Method 1: arc lengths are chosen uniformly on the simplex {a+b+c=2π, a,b,c>0}. This gives 1/4.
              Method 2: arc lengths are chosen independently and uniformly in [0, π]. This gives 1/2 (after conditioning on a+b+c=2π and a,b,c>0).

          - But note: in method 2, we are not conditioning on a+b+c=2π until after we choose. We choose a, b, c independently in [0,π], and then we require a+b+c=2π? That has probability zero. So instead, we condition on a+b+c=2π. How do we compute the conditional distribution? It's complicated. Alternatively, we can choose two arc lengths independently in [0,π] and then set the third to 2π - a - b, but then we require 0 < 2π - a - b < π? That is, a+b>π and a+b<2π. And then the probability is the area where a,b in [0,π] and π < a+b < 2π divided by the area where a,b in [0,π] and a+b<2π? The latter area is the entire square [0,π]x[0,π] since a+b<2π always holds (because a≤π, b≤π, so a+b≤2π). But we must also require 2π - a - b > 0 -> a+b<2π (which is always true) and 2π - a - b < π -> a+b>π. So the probability is the area of the square above the line a+b=π divided by the area of the square? The area above the line a+b=π in the square [0,π]x[0,π] is 1/2, as computed.

          - So we have:

              Method 1: uniform on the simplex -> 1/4.
              Method 2: uniform and independent in [0,π] for the first two and then the third determined -> 1/2.

          - The contradiction.

   10. Check question at the end:

      - We want to test whether the student understands that the probability depends on the parameterization.

      - Question: "Suppose we choose the three points by first choosing two central angles uniformly and independently from [0, 2π] and then setting the third central angle to 2π minus the sum of the first two, provided the sum is less than 2π. What is the probability that the triangle is acute?" 
          Answer: This is the first method, and the probability is 1/4.

      - Follow-up: "Now, suppose we choose two central angles uniformly and independently from [0, π] and then set the third central angle to 2π minus the sum of the first two, provided the result is positive and less than or equal to π. What is the probability that the triangle is acute?"
          Answer: This is the second method, and the probability is 1/2.

      - The key is that the student must compute the probability based on the described parameterization.

   11. Standard Resolution to Set Aside:

      - We should set aside Jaynes's symmetry argument or an invariant-measure fix. Why? The pedagogical aim is to expose the paradox and show that the principle of indifference, when applied naively to continuous spaces, leads to contradictions. We want the students to see the problem in its raw form. Introducing a resolution might be premature and could distract from the main lesson: that we cannot apply the principle of indifference arbitrarily in continuous spaces. We will address resolutions in a later session.

   Implementation:

      Time: 50 minutes.

      Breakdown:

      0-5 minutes: Review of the principle of indifference in discrete cases.
      5-10 minutes: Pose the problem and explain what an acute triangle inscribed in a circle requires (center inside the triangle, which is equivalent to each arc < π).
      10-20 minutes: First parameterization (uniform points on circumference) and compute probability 1/4.
      20-30 minutes: Second parameterization (uniform central angles independently in [0,π] for two arcs) and compute probability 1/2.
      30-40 minutes: Discuss the contradiction and why both seem natural. Address misconceptions: 
          - Why is the first method not necessarily the only correct one? 
          - Why is the second method also seemingly natural? 
          - Emphasize that the problem statement does not specify the method of random selection, so both are applications of the principle of indifference but to different parameters.
      40-45 minutes: Check question: as above.
      45-50 minutes: Wrap-up: The takeaway is that in continuous cases, the principle of indifference is ambiguous. We must be cautious. Next time, we will see resolutions.

      Note: We must be clear that the second method is flawed because it arbitrarily restricts the range of the arc lengths to [0,π] when they can be up to 2π. However, we present it as a competing natural intuition.

      Why not use the chord length parameterization for the sides? It is more complicated for a triangle. The central angle method is simpler.

      Why not the classical chord paradox? We are using the triangle to avoid the familiarity of the chord paradox and to show a new example.

      Final note: The second method is not as well motivated as the first. We are applying the principle of indifference to the arc lengths, but then we are restricting the range arbitrarily. We should present it as: "Another way: if we assume that each arc length is chosen independently and uniformly from [0, π] ...". We know that the arc lengths are dependent and must sum to 2π, and the range is [0,2π]. But by restricting to [0,π] and choosing independently, we are creating a different sample space.

      We must stress that the principle of indifference does not tell us which parameter to be indifferent about.

      This is the core.
answer: |-
  ### Teaching Arc for the Inscribed-Triangle Problem

  #### **Conceptual Groundwork (5-10 minutes)**
  1. **Review Principle of Indifference (Discrete Cases)**:
     - Recap: When outcomes are symmetric and mutually exclusive, assign equal probability (e.g., fair die: each face has probability 1/6).
     - Example: Probability of drawing a red ball from a bag with equal numbers of red/blue balls.

  2. **Transition to Continuous Spaces**:
     - Explain that continuous problems require a uniform distribution over a parameter (e.g., length, angle, position).
     - Highlight: **Choice of parameter is arbitrary** but critical (e.g., "random point on a line" could mean uniform position or uniform coordinate).
     - Introduce the circle: Symmetric, rotationally invariant. For one point, "uniform on circumference" is unambiguous (fix a radius, choose angle θ ∈ [0, 2π) uniformly).

  3. **Problem Setup**:
     - **Pose the problem**: "Three points are chosen randomly on a circle. What is the probability the triangle they form is acute?"
     - **Key geometric insight**: A triangle is acute if and only if its circumcenter (here, the circle’s center) lies inside the triangle. For a circle, this happens iff **each arc between points is < π radians** (180°).
     - Clarify: Arcs are the segments between adjacent points (summing to 2π).

  #### **Sequence of Parameterizations (25-30 minutes)**
  Introduce three parameterizations in order. Emphasize that each seems "natural" but yields a different probability.

  1. **Uniform Selection of Points on Circumference (10 minutes)**:
     - **Method**: Fix one point at 0 (rotational symmetry). Choose two angles α, β ∈ [0, 2π) uniformly and independently. The arcs are the gaps between ordered points.
     - **Calculation**:  
       - Arcs (a, b, c) are uniformly distributed on the simplex a + b + c = 2π, a, b, c > 0 (standard result via spacings).  
       - Acute iff a < π, b < π, c < π.  
       - Probability = volume where a < π, b < π, c < π, divided by total simplex volume = **1/4**.
     - **Misconception to address**: Students may assume this is the "only correct" method since it directly matches the problem statement ("points on circle").  
       *Heads-off*: Ask, "Could we parameterize differently? What if we focus on arc lengths directly?"

  2. **Uniform Selection of Chord Lengths (Indirectly, via Central Angles) (7 minutes)**:
     - **Method**: Parameterize by central angles (θ₁, θ₂) for two arcs, chosen uniformly and independently in [0, π]. The third arc is γ = 2π − θ₁ − θ₂. Accept only if γ ∈ (0, π).
     - **Motivation**: Chord length is determined by central angle (L = 2R sin(θ/2)). "Uniform chord length" suggests indifference over θ ∈ [0, π] (since θ ↔ L bijectively in this range).
     - **Calculation**:  
       - Sample space: θ₁, θ₂ ∈ [0, π] (area = π²).  
       - Acute iff θ₁ < π, θ₂ < π, γ < π (automatic by range), and γ > 0 ⇒ θ₁ + θ₂ > π.  
       - Probability = area where θ₁ + θ₂ > π, divided by π² = **1/2**.  
     - **Misconception to address**: Students may think this is "objectively correct" because chord length feels fundamental.  
       *Heads-off*: Contrast with first method: "Why prefer uniform θ over uniform point? The problem says 'points on circle,' not 'chords of random length.'"

  3. **Uniform Selection of Central Angles (Full Range) (8 minutes)**:
     - **Method**: Choose two central angles θ₁, θ₂ uniformly and independently in [0, 2π]. Set θ₃ = 2π − θ₁ − θ₂. Accept only if θ₁, θ₂, θ₃ > 0 (i.e., θ₁ + θ₂ < 2π).
     - **Motivation**: "Random arc" might imply uniform angle over full circle.
     - **Calculation**:  
       - Sample space: θ₁, θ₂ ∈ [0, 2π] with θ₁ + θ₂ < 2π (area = 2π²).  
       - Acute iff θ₁ < π, θ₂ < π, θ₃ < π (⇒ θ₁ + θ₂ > π).  
       - Probability = area where θ₁ < π, θ₂ < π, θ₁ + θ₂ > π, divided by 2π² = **1/4** (same as first method).  
     - **Misconception to address**: Students may conflate this with the second parameterization.  
       *Heads-off*: Highlight the range difference: [0, 2π] vs. [0, π]. "Does 'random arc' mean uniform angle over 180° or 360°? The principle of indifference doesn’t specify."

  #### **Contradiction and Reflection (5 minutes)**
  - **Present the conflict**: Same problem, three "natural" parameterizations, two distinct probabilities (1/4 and 1/2).
  - **Emphasize**: The contradiction arises because:  
    - Principle of indifference is ambiguous in continuous spaces.  
    - Probability depends on the **choice of parameter**, not just the problem statement.  
  - **Key takeaway**: No "objective" randomness; parameterization encodes hidden assumptions.

  #### **Check Question (5 minutes)**
  Test understanding of parameter-dependency (not just recall of conflict):  
  *"Suppose we choose two central angles uniformly in [0, π] and set the third to 2π minus their sum. If we instead choose the angles uniformly in [0, 2π], why does the probability of an acute triangle change? Explain in terms of sample spaces."*  
  - **Expected answer**: The range [0, π] restricts arcs to ≤π, making larger arcs impossible. In [0, 2π], arcs >π are possible, reducing the chance all are <π.

  #### **Resolution to Set Aside**
  - **Exclude Jaynes's symmetry argument / invariant measure**:  
    - **Why**: The goal is to expose the paradox and the flaw in naive applications of the principle of indifference, not to resolve it. Introducing a "correct" measure (e.g., rotational invariance) would distract from the core lesson: **parameterization choice is subjective and consequential**.  
    - **Pedagogical aim**: Students must first grapple with the ambiguity. Resolutions (e.g., Haar measure) require advanced probability and will be covered later.

  ---

  ### Session Flow
  - **0–5 min**: Discrete indifference review.  
  - **5–15 min**: Problem setup + first parameterization (uniform points → P=1/4).  
  - **15–22 min**: Second parameterization (uniform chord angles in [0, π] → P=1/2).  
  - **22–30 min**: Third parameterization (uniform angles in [0, 2π] → P=1/4).  
  - **30–35 min**: Discuss contradictions and misconceptions.  
  - **35–40 min**: Check question + discussion.  
  - **40–50 min**: Recap takeaways and preview next session (resolutions).

  This arc ensures students:  
  1. See the paradox emerge naturally.  
  2. Confront misconceptions at each step.  
  3. Understand that probability depends on parameterization.  
  4. Leave with a clear problem (no premature resolution).
