answer: |-
  1. The register is a self-sustaining convention solving a coordination problem: society coordinates on treating the substitute’s suffering as discharging the offender’s liability, thereby maintaining order through a predictable system of sanctions, regardless of the offender’s awareness or consent.  
  2. Institutions define their own operative fictions: "debt discharge" here is a stipulated change in institutional status (extinguishing the state’s warrant), not the transfer of a metaphysical substance like desert; its coherence depends solely on the convention’s stability, not on reifying abstract entities.  
  3. In the fission case, the innocent continuer lacks direct psychological continuity with the murderer at the time of the crime—continuity of intention, memory, or character—so punishing them fails to target the responsible agent, violating what matters (psychological connectedness) even if identity is not what matters.  
  4. This violation explains the intuition of monstrousness: punishment must track the responsible psychological state, but the register’s random substitution severs that link entirely, making its injustice obvious while conceding its conceptual possibility as a conventional practice.  
  5. Granting that the register is institutionally coherent but substantively unjust, press me on why *any* penal substitution—even divinely orchestrated—escapes this charge of severing responsibility, if divine justice similarly permits punishing one not continuous with the offender’s guilt.
