answer: |-
  Below is a complete lesson plan for your 90-minute seminar on rational agency and machine intelligence, designed for 16 upper-level undergraduates. The plan adheres to your constraints: paper-only, no prior exposure to "program equilibrium," and minimal coding/logic background. It uses British English throughout.

  ---

  ### **Lesson Plan: Rational Agents as Programs**

  #### **Materials List**
  - **16 index cards** (one per team for program submission)
  - **8 envelopes** (to distribute opponent programs during matches)
  - **1 whiteboard/flipchart** for scoring grid
  - **Handout (1 page)** with language rules, interpreter semantics, and payoff table (provided below)
  - **Timer** for rounds
  - **Pens** for teams

  ---

  ### **Handout: Program Game Rules**  
  *(Distribute at start)*

  #### **Program Language Syntax**
  Your program is a list of **clauses**. Each clause has the form:  
  `IF <condition> THEN <action>`  
  - **Conditions**:  
    - `TRUE` (always true)  
    - `FALSE` (always false)  
    - `CONTAINS("<text>")` (true if opponent’s program contains the exact string `<text>`)  
    - `OPP_ACTION_IS(<action>)` (true if opponent outputs `<action>` against you; see semantics below)  
  - **Actions**: `COOPERATE` or `DEFECT`  
  - **Evaluation order**: Clauses checked top-to-bottom. First true condition fires its action. If none match, output `DEFECT`.

  #### **Interpreter Semantics**  
  - **Input**: Your program receives the opponent’s *full program text* as input.  
  - **Depth limit**: When evaluating `OPP_ACTION_IS`, the referee runs the opponent’s program **recursively** but caps depth at **3 levels**.  
    - *Depth 3*: Run opponent’s program normally.  
    - *Depth 2/1*: Run opponent with current depth reduced by 1.  
    - *Depth 0*: Return `DEFECT` (no further evaluation).  
  - **Timeout**: If evaluation exceeds 60 seconds (e.g., infinite regress), default to `DEFECT`.

  #### **Payoffs (per round)**  
  | Your Action | Opponent’s Action | Your Points |
  |--------------|-------------------|-------------|
  | COOPERATE   | COOPERATE        | 3           |
  | COOPERATE   | DEFECT           | 0           |
  | DEFECT      | COOPERATE        | 5           |
  | DEFECT      | DEFECT           | 1           |

  - **Complexity tax**: Lose **0.2 points** per clause in your program (per round).  
    *Example*: A 3-clause program loses 0.6 points each round.

  #### **Tournament Scoring**  
  - Teams ranked by **total points** (absolute, not rank-based). Justification: Absolute scoring preserves Prisoner’s Dilemma incentives—cooperation is high-risk/high-reward, while defection is safe but low-yield. Complexity tax penalises over-engineering.

  ---

  ### **Timeline (90 Minutes Total)**

  #### **0–10 min: Introduction and Rules**  
  - Recap Prisoner’s Dilemma and Nash equilibrium (remind students mutual defection is equilibrium).  
  - Explain the twist: *Teams submit programs, not actions*.  
  - Walk through handout: language syntax, depth limit, payoffs, and tax.  
  - **Demo**: Show two simple programs (e.g., `IF TRUE THEN DEFECT` vs. `IF CONTAINS("COOPERATE") THEN COOPERATE`) and resolve a match.

  #### **10–30 min: Program Design (Teams of 2)**  
  - Teams write programs on index cards (max 4 clauses).  
  - Encourage brevity: Complexity tax rewards simplicity.  
  - **Common pitfall**: Teams may write self-referential programs (e.g., `IF OPP_ACTION_IS(COOPERATE) THEN COOPERATE`).  
    - *Referee tip*: This is allowed! Depth limit will handle regress.

  #### **30–55 min: Scored Rounds (4 Rounds, 5 min each)**  
  - **Pairings**: Randomly pair 8 teams into 4 matches per round.  
  - **Procedure**:  
    1. Collect programs, distribute opponents in envelopes.  
    2. Referee (you) hand-evaluates each match:  
       - Run Program A vs. Program B at depth 3.  
       - Apply payoffs and tax (e.g., if a team defects and wins 5 points but has 2 clauses, net = 5 - 0.4 = 4.6).  
    3. Update scoring grid on whiteboard.  
  - **Round 5 (55–60 min)**: Each program runs **against itself**.  
    - *Purpose*: Reveals if programs are self-consistent (e.g., self-cooperation vs. self-defection).

  #### **60–70 min: Perturbation Round (Unscored)**  
  - **Goal**: Highlight syntax vs. behaviour distinction.  
  - **Perturb each program in three ways**:  
    1. **Behaviour-preserving rewrite**: Rename variables/reorder clauses (e.g., `IF CONTAINS("COOPERATE") THEN COOPERATE` → `IF CONTAINS("COOPERATE") THEN COOPERATE` with clauses swapped).  
    2. **Behaviourally equivalent but textually distant**: Transform a clause logically (e.g., `IF TRUE THEN COOPERATE` → `IF NOT(FALSE) THEN COOPERATE`).  
    3. **Mutant**: Change one action/clause (e.g., `COOPERATE` → `DEFECT`).  
  - **Procedure**:  
    - Teams predict outcomes for original and mutants against a fixed opponent (e.g., an "always defect" program).  
    - Referee runs matches, compares predictions.  
    *Diagnoses*: Teams see that:  
    - (1)–(2) do not alter outcomes (same behaviour, different syntax).  
    - (3) often changes outcomes dramatically (syntax matters when programs inspect each other’s text).

  #### **70–85 min: Debrief**  
  Map session moments to core ideas:  
  1. **Mutual defection is still a Nash equilibrium** (5 min):  
     - *Session moment*: Many teams defaulted to defection in early rounds.  
     - *Why*: If all programs defect, no unilateral change (e.g., cooperating) improves scores—it risks 0 points. Complexity tax makes defection even safer.  

  2. **Intensionality** (3 min):  
     - *Session moment*: Perturbation round showed syntax changes (e.g., reordering) don’t alter behaviour, but mutants do.  
     - *Why*: Programs choose based on the *description* of the opponent (text), not just its behaviour.  

  3. **Bounded proof search** (5 min):  
     - *Session moment*: Teams using `OPP_ACTION_IS` hit depth limits; some achieved cooperation by "locking" at depth 2.  
     - *How it works*:  
       1. Program A checks if B cooperates with A at depth 2.  
       2. B, at depth 2, checks if A cooperates with B at depth 1.  
       3. If A and B both conditionally cooperate, they "lock" without infinite regress.  
     - *Reconstructability*: 80% of the room will grasp the lock with a whiteboard example.  

  4. **Choosing dispositions** (2 min):  
     - *Bridge*: Programs are "dispositions"—they commit you to a response. Like a constitution, they bind future choices.  
     - *Key insight*: Rational agents can coordinate by choosing compatible dispositions (e.g., mutual cooperation programs), even if single actions wouldn’t cooperate.  

  #### **85–90 min: Conclusion**  
  - Reinforce: Cooperation isn’t "proved rational"—it’s one equilibrium among many, enabled by intensional choices.  
  - Tease real-world links: e.g., how AI agents use program-like commitments.

  ---

  ### **Predictable Failure Modes and Solutions**  
  1. **Infinite regress crashes**:  
     - *Cause*: Teams write mutually evaluative programs (e.g., `A` checks `B` checks `A`...).  
     - *Solution*: Depth limit forces `DEFECT` at level 0. Show this in the demo.  

  2. **Overly complex programs**:  
     - *Cause*: Teams add clauses to "handle all cases," ignoring tax.  
     - *Solution*: Remind them mid-design: "A 1-clause defector costs 0.2 points; a 4-clause cooperator costs 0.8."  

  3. **Syntax errors**:  
     - *Cause*: Missing quotes in `CONTAINS("text")` or misspelled actions.  
     - *Solution*: During design, audit clauses for typos; in evaluation, default to `DEFECT` for unparseable programs.  

  4. **Perturbation round confusion**:  
     - *Cause*: Students struggle to predict mutant outcomes.  
     - *Solution*: Use a simple opponent (e.g., "always defect") for all tests. Focus on "before/after" behaviour changes.

  ---

  ### **What the Game Cannot Reproduce**  
  - **Unbounded rationality**: The depth limit prevents true simulation of mutual program verification (e.g., Gödelian cooperation). In debrief, clarify: Real program equilibria require agents to prove mutual cooperation *without* depth limits—something only briefly hinted at with the "locking" example.  
  - **Evolutionary dynamics**: The tournament is static; real-world programs "evolve" through repeated competition. Mention this as future reading.  

  ---  
  This plan ensures students experience program equilibrium organically through gameplay while confronting syntax-vs-behaviour tensions. The brittleness of cooperation under bounded rationality becomes visceral, setting up your debrief seamlessly.
