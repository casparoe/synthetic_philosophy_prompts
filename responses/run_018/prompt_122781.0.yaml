     Perturbation B: Change the action in one rule (e.g., COOPERATE to DEFECT or vice versa).
     Perturbation C: Remove one rule.

     But then we have three perturbations.

     And then we run the original and the three mutants against a fixed opponent (say, a known cooperator and a known defector) and have the team predict the outcomes.

     For the perturbation round, we pick one or two opponents (maybe a cooperator and a defector from the tournament) and run the original and the mutants against them.

     The team that wrote the program must predict the outcomes for the original and each mutant against the two opponents.

     Then we run the matches and see what happens.

     This will show that a small syntactic change can cause a big behavioural change.

  **Debrief**:

  We map the session to the ideas:

  1. **Mutual defection is still an equilibrium**: Even after seeing cooperation happen, mutual defection is still a Nash equilibrium of the program game. Why? Because if everyone writes the program that always defects, then no one can get more than 1 point per round (if they change to a program that sometimes cooperates, they might get 0 against a defector). And with the complexity tax, a more complex program that always defects would be worse. So it's still an equilibrium.

  2. **Intensionality**: The objects of choice are programs (intensions) not actions (extensions). The same behaviour can be implemented by different programs, and different programs can have the same behaviour in some contexts but not others. The perturbation round showed that small changes in syntax can lead to big changes in behaviour.

  3. **Bounded proof search**: The `OPP_ACTION_IS` condition with bounded depth is a form of bounded proof search. We saw that with depth 3, sometimes the programs can "find" that they both cooperate (like the example of program C against A) but sometimes they get stuck in mutual defection (like D against E). The students might reconstruct that if they set the base case to cooperation, then they can get mutual cooperation, but that base case is arbitrary. In practice, we use the base case of defection to be safe.

  4. **Bridge to dispositions**: We can choose a disposition (a program) that then chooses actions in response to the opponent. This is like choosing a constitution. The program is a strategy that conditions on the opponent. We don't choose actions directly, but we choose how to choose actions. The program equilibrium idea is that if both programs condition on each other and find that they both cooperate, then they can achieve cooperation. But it's fragile.

  **What will go wrong**:

  1. **Infinite regress without depth limit**: But we have a depth limit, so it's safe.

  2. **Teams write programs that are too complex and the referee can't evaluate them in time**: We have a time constraint. We must keep the programs simple. We'll enforce that the programs have at most 3 rules.

  3. **String matching is too brittle**: A team writes `CONTAINS(COOPERATE)` but the opponent writes `COOPERAT` (typo) and it doesn't match. That's part of the lesson.

  4. **The perturbation round might be confusing**: We might not have time to run all perturbations. We can do only one opponent for the perturbation round to save time.

  5. **Teams might not understand the `OPP_ACTION_IS` condition**: We need to provide clear examples in the handout.

  **What the game cannot reproduce**:

  The game cannot reproduce the full generality of program equilibrium where programs can be arbitrary Turing machines and can simulate each other without depth limits. We are bounded. Also, in the real program equilibrium, the programs can be written to recognize each other (by source code) and then cooperate. But in our setting, the bounded depth might prevent that. We have to explain that in the debrief: in the unbounded case, programs can be written to mutually simulate and recognize each other and cooperate, but that requires infinite computational resources, which we don't have.

