  We are designing a decision procedure for assigning a supervision mode to an LLM agent task. The supervision modes are:
  1. Outcome-only grading
  2. Stepwise process supervision
  3. Hybrid (scheduled milestone audits)
  4. No automation

  The constraints:
  - Human reviewer hours are the binding constraint. Process audit costs 20x outcome grade.
  - Two of five reviewers are non-technical.
  - Refusals to automate require head of product sign-off and must be defensible.

  The procedure must consider:
  a) Outcome verifiability (including lag and risk of gaming with cheap proxies)
  b) Reasoning trace legibility (to reviewers) and faithfulness (is it post-hoc narration?)
  c) Reversibility and blast radius of actions
  d) Adversarial pressure from the grading scheme (agent might learn to game the process or outcome)

  The procedure should be an ordered sequence of tests. We'll design it step by step.

  Decision Procedure:

  Step 1: Check Outcome Verifiability
     - Can the outcome be verified at all? (If not, go to Step 2 with an automatic flag for high risk)
     - If verifiable, what is the lag? (Immediate, short, long, very long)
     - Is the outcome metric a cheap proxy? (If yes, assess the risk of gaming: high, medium, low)
     - If the outcome is not verifiable OR the lag is very long (e.g., months) OR the risk of gaming a proxy is high, then we cannot rely solely on outcome. Proceed to Step 2.
     - Else, outcome-only grading is a candidate. But we must also consider the blast radius (Step 3) and adversarial pressure (Step 4) before finalizing.

     Default: If outcome verifiability is unclear, assume it is not verifiable.

  Step 2: Trace Legibility and Faithfulness
     - Is the reasoning trace (if produced) legible to the reviewers? (Consider: two non-technical reviewers. If the trace is highly technical, it may not be legible to all. Rating: high, medium, low legibility)
     - Can we assess the faithfulness of the trace? (Is there a way to tell if the trace caused the answer or is post-hoc? This is a judgment call. We might look for evidence: e.g., if the agent produces step-by-step and we can validate intermediate steps independently, then high faithfulness; if not, then low. Also, if the task is new and we don't have a history, we might not know.)

     If the trace is not legible (low legibility) OR we cannot assess faithfulness (low faithfulness), then stepwise process supervision is not feasible. We must then consider:
        - If outcome verifiability (from Step 1) is good, then outcome-only might be the only option.
        - Otherwise, we have to consider hybrid or no automation.

     Default: If faithfulness is unclear, assume low faithfulness because of the risk of post-hoc rationalization.

  Step 3: Reversibility and Blast Radius
     - Assess the reversibility of the agent's actions: (highly reversible, partially reversible, irreversible)
     - Assess the blast radius: (small: affects only one user or a non-critical system; medium: affects a team or a minor system; large: affects the whole company or a critical system)

     If the action is irreversible AND blast radius is large, then we must have strong oversight. This might require stepwise process supervision or hybrid, but if Step 2 ruled out stepwise, then we might have to avoid automation or use hybrid with very frequent milestones.

     Default: If reversibility is unclear, assume irreversible. If blast radius is unclear, assume large.

  Step 4: Adversarial Pressure
     - Consider the optimization pressure: if we use outcome-only, will the agent learn to game the outcome? (high, medium, low risk)
     - If we use process supervision, will the agent learn to produce plausible but fake traces? (high, medium, low risk)

     This step might adjust the choice:
        - If we were leaning toward outcome-only but the adversarial pressure on outcome is high, and if the trace is legible and faithful (Step 2) then we might prefer process.
        - But if process is also at high risk of being gamed, then we might need a hybrid (to break the pattern) or even no automation.

     Default: If the risk of gaming is unclear, assume high.

  Step 5: Human Resource Constraints
     - We must consider the cost of supervision. Process supervision is 20x more expensive than outcome.
     - Also, we have two non-technical reviewers. If the task requires technical review and we don't have enough technical reviewers, we might be forced to outcome-only or even no automation.

     We compute:
        - If stepwise process is chosen, do we have the reviewer capacity? (Given 10 tasks per month, and each process audit being 20x, we must be cautious.)
        - If hybrid, we need to define the milestones and then the cost is intermediate.

     Default: If we cannot afford the human hours for a chosen mode, we must downgrade (e.g., from stepwise to hybrid or outcome-only) or refuse.

  Step 6: Final Decision and Triggers for Re-review
     - Based on the above, assign the mode.
     - Set triggers for re-review:
          a) After a certain number of task runs (e.g., 100 runs) to see if the agent is gaming the system.
          b) After a major incident related to the task.
          c) After significant fine-tuning of the agent.
          d) When the outcome lag has passed (for tasks with long-lag outcomes) to check if the outcome was as expected.

  Now, apply to the three workflows:

  1. Drafting first-pass responses to regulatory correspondence.
     - Outcome: Verifiable? Yes, by regulatory experts. But lag? The response is sent and then we wait for regulatory feedback (which might take months). However, we can have an internal review before sending (so immediate for internal review, but ultimate outcome is long-lag). We can use internal review as a proxy? But risk of gaming: if the agent learns to write responses that please internal reviewers but not regulators, then high risk.
     - Trace: The reasoning trace for drafting a response? It might be legible (if the agent explains why it wrote what it wrote) but faithfulness? Hard to tell. Might be post-hoc.
     - Blast radius: High. A bad response could lead to fines or reputational damage. Actions: once sent, irreversible.
     - Adversarial pressure: High. If we grade on internal review, agent will optimize for that. If we grade on regulator's response (long lag), then we have a delayed signal.

     Applying the steps:
        Step 1: Outcome is verifiable internally (proxy) but with risk of gaming and the true outcome is long-lag. So, outcome-only might be risky.
        Step 2: Trace legibility: medium (non-technical reviewers might not fully understand regulatory nuances). Faithfulness: low? (We don't have a way to validate each step independently). So stepwise process might not be feasible.
        Step 3: Blast radius large and irreversible. This demands strong oversight.
        Step 4: Adversarial pressure on outcome (internal proxy) is high. On process? Also high if we try to use stepwise (agent might make up a good story).
        Step 5: We cannot afford stepwise for every response (too expensive). But we might use hybrid: e.g., audit a sample of responses or have milestones (like every 10th response) and outcome for the rest.

     Verdict: Hybrid (scheduled milestone audits). We might audit every 10th response with a full process review and use outcome (internal review) for the rest. Also, we track the regulator's feedback and adjust.

     What would flip to outcome-only? If we can show that the internal review is a very strong proxy (e.g., by correlating internal review scores with regulator feedback over time) and reduce the risk of gaming.

     What would flip to stepwise? If we can have a way to validate the trace (e.g., by having the agent cite sources for each claim and then we check the sources) and if we have enough technical reviewers.

     What would flip to no automation? If we find that the hybrid is too expensive and the risk remains too high.

  2. Making autonomous changes to internal infrastructure code.
     - Outcome: Verifiable? Yes, we can run tests and see if the change breaks anything. Lag: short (CI/CD pipeline). But note: some issues might not be caught by tests (like performance in production). Risk of gaming: if the agent learns to pass tests but introduces subtle bugs, then high risk.
     - Trace: The reasoning trace for code changes? This is technical. Non-technical reviewers might not understand. Legibility: low for non-technical, but we have technical reviewers. Faithfulness: we can check intermediate steps? For example, the agent might explain why it made a change, and we can check that against the code. So medium to high.
     - Blast radius: Medium to large. A bad code change could break production. But reversibility: high (we can roll back). So the blast radius is limited by reversibility.
     - Adversarial pressure: High for outcome (agent might overfit to tests). For process: if we supervise the trace, the agent might write a good explanation for a bad change.

     Steps:
        Step 1: Outcome is verifiable (tests) with short lag, but risk of gaming (subtle bugs) is medium to high.
        Step 2: Trace legibility: medium (for technical reviewers) but low for non-technical. However, we have technical reviewers. Faithfulness: we can check the trace against the code? So medium. But note: we have non-technical reviewers who cannot do this. So we must assign only technical reviewers for this task? Then we must consider if we have enough technical reviewers (we have 3 technical out of 5). So it's feasible but resource-intensive.
        Step 3: Blast radius is large but reversible. So we can tolerate some risk.
        Step 4: Adversarial pressure on outcome is high. On process: also high (agent might write a plausible trace for a bad change). But we can run tests and also audit the trace? So hybrid might help.
        Step 5: We cannot do stepwise for every change (too expensive). But we can do hybrid: e.g., audit a random sample of changes and rely on tests for the rest.

     Verdict: Hybrid (with a focus on auditing changes that affect critical systems and random sampling for others) and strong tests.

     What would flip to stepwise? If we have enough technical reviewers and the cost is justified by the risk reduction.

     What would flip to outcome-only? If we have very comprehensive tests and a strong rollback mechanism, and we observe that the agent doesn't introduce subtle bugs.

     What would flip to no automation? If we find that even with hybrid, the risk is too high (e.g., too many rollbacks).

  3. Producing long-horizon market research memos (conclusions confirmed months later).
     - Outcome: Verifiable? The ultimate outcome is the accuracy of the memo's conclusions, but lag is very long (months). We cannot wait months to grade. We need a proxy: e.g., internal expert review? But the memo is about the future, so expert review might be as uncertain as the memo. Risk of gaming: high (agent might write what experts want to hear).
     - Trace: The reasoning trace for the memo? This could be long and complex. Legibility: medium (if the agent explains its sources and reasoning). But non-technical reviewers might follow? Faithfulness: hard to tell without independent validation. We might check if the sources are real and the reasoning is logical? So medium.
     - Blast radius: Low to medium. The memo is used for internal decisions. If wrong, it might lead to bad decisions, but it's not irreversible (we can adjust later). However, the cost of a bad decision might be high.
     - Adversarial pressure: High on any proxy outcome. On process: also high (agent might fabricate a trace that looks logical).

     Steps:
        Step 1: Outcome verifiability: very long lag and proxy risk high. So outcome-only is not feasible in the short term.
        Step 2: Trace legibility: medium. Faithfulness: low? Because we cannot validate the reasoning until months later. So stepwise process might not be reliable.
        Step 3: Blast radius: medium (could lead to bad decisions) and reversibility: low (once a decision is made, it might be hard to undo). But note: the memo itself isn't an action, it's advice. So the blast radius is indirect.
        Step 4: Adversarial pressure on both outcome and process is high.
        Step 5: We cannot do stepwise for every memo (too expensive). And without a good short-term outcome, we are stuck.

     Verdict: This is the one you won't like. We cannot automate this task? Or we can only do it with no automation? But note: we might do outcome-only with the long-lag outcome (so we grade the memo after months) and then use that for retraining, but that doesn't help for immediate supervision.

     Alternatively, we might use a hybrid: do a light process review (by an expert) for each memo and then when the outcome comes, we do a full outcome review. But the light process review might be expensive and we have two non-technical reviewers who might not help.

     However, the head of product must sign off on no automation. So we must consider: can we do outcome-only with a proxy? If the proxy is an expert review, then we are gaming. But if the expert review is the best we have, then we might do that and accept the risk.

     But the problem: if we do outcome-only with a proxy, and the agent games it, then we get bad memos and we don't know until months later. The blast radius might be too high.

     Therefore, we might refuse to automate. Or we might automate but with no automation for the conclusions? That doesn't make sense because the whole point is the conclusion.

     Verdict: No automation for this workflow. We cannot adequately supervise it without incurring high risk or high cost.

     What would flip? If we can get a reliable short-term proxy for the memo's quality (e.g., by comparing the memo to known high-quality memos on past data) and if the blast radius is deemed low enough to accept the risk.

  What the procedure cannot do:
  - It cannot account for failure modes that are completely unknown (unknown unknowns).
  - It assumes that we have access to the reasoning trace (if the agent doesn't produce one, then stepwise and hybrid are not applicable unless we force the agent to generate one).
  - It assumes that the reviewers are competent within their domain (if a non-technical reviewer is forced to review a technical trace, it might not work, but we try to assign appropriately).
  - The procedure relies on judgments (like the risk of gaming, faithfulness of trace) that are subjective and might be wrong.
  - The responsibility of the human who signs off (head of product) remains: to consider business impact beyond the procedure and to make the final call on refusals.

  Final Decision Procedure Outline:

  1. Outcome Verifiability:
     - If outcome not verifiable OR lag very long OR proxy gaming risk high -> then outcome-only is risky.
     - Else, outcome-only is candidate.

  2. Trace Legibility and Faithfulness:
     - If trace not legible OR low faithfulness -> stepwise not feasible.

  3. Reversibility and Blast Radius:
     - If irreversible and large blast radius -> need strong oversight.

  4. Adversarial Pressure:
     - If outcome gaming risk high and stepwise feasible and not too risky -> consider stepwise or hybrid.
     - If both outcome and process gaming risks are high -> consider hybrid or no automation.

  5. Human Resources:
     - If stepwise desired but too expensive -> downgrade to hybrid or outcome-only.

  6. Assign mode:
     - If no automation: when risks are too high and no mode is safe or affordable.
     - Hybrid: when we can do a mix (e.g., audits on a sample) to balance cost and risk.
     - Stepwise: when trace is good and we can afford it and blast radius demands it.
     - Outcome-only: when outcome is reliable and blast radius is acceptable.

  Triggers for re-review: as above.

  We'll now write the procedure in a concise, ordered test format.
answer: |-
  ### Decision Procedure for Supervision Mode Assignment

  **Ordered Tests (Execute Sequentially; Stop if Mode Determined or Escalate to "No Automation")**

  1. **Outcome Verifiability Test**  
     - **Check:** Can the outcome be verified?  
       - *If no*: Proceed to Test 2.  
       - *If yes*:  
         - Lag: Immediate/short (<1 day) = Low risk; Medium (days/weeks) = Moderate risk; Long (>1 month) = High risk.  
         - Proxy Risk: Is verification reliant on cheap proxies (e.g., internal review scores)? High risk of gaming if proxies lack strong correlation with ground truth.  
     - **Result:**  
       - Low lag + low proxy risk → Candidate for **outcome-only**. Proceed to Test 3.  
       - Moderate/high lag or high proxy risk → Proceed to Test 2.  
     - **Default if unclear:** Assume high lag/high proxy risk (unverifiable).  
     - **Judgment call:** Assessing proxy risk requires domain expertise (e.g., regulatory or market dynamics).  

  2. **Trace Legibility & Faithfulness Test**  
     - **Check:**  
       - *Legibility*: Can ≥3 reviewers (including non-technical) parse the reasoning trace? High = clear causal chain; Medium = partially understandable; Low = opaque.  
       - *Faithfulness*: Can intermediate steps be validated? (e.g., code outputs against specs, citations against sources). High = verifiable steps; Low = no validation possible (post-hoc risk).  
     - **Result:**  
       - High legibility + high faithfulness → Candidate for **stepwise process**. Proceed to Test 3.  
       - Medium/low legibility OR low faithfulness → **Disqualify stepwise**.  
         - If outcome verifiable (Test 1 passed) → Candidate for **outcome-only**. Proceed to Test 3.  
         - If outcome not verifiable → Proceed to Test 4.  
     - **Default if unclear:** Assume low faithfulness (post-hoc rationalization is common).  
     - **Judgment call:** Faithfulness hinges on trace structure (e.g., citations vs. freeform reasoning).  

  3. **Blast Radius & Reversibility Test**  
     - **Check:**  
       - *Reversibility*: Can errors be undone? High = trivial revert (e.g., code rollback); Low = permanent (e.g., sent regulatory response).  
       - *Blast radius*: Impact of failure. Small = isolated/non-critical; Large = systemic/catastrophic (e.g., compliance breach).  
     - **Result:**  
       - Low reversibility + large blast radius → **Requires strong oversight**.  
         - If stepwise feasible (Test 2) → **Stepwise process** (preferred).  
         - If stepwise disqualified → **Hybrid** (milestone audits) or **no automation** if Test 4 fails.  
       - High reversibility + small blast radius → **Outcome-only** (if verifiable) or **hybrid**.  
     - **Default if unclear:** Assume low reversibility + large blast radius (conservative).  

  4. **Adversarial Pressure Test**  
     - **Check:**  
       - *Outcome gaming risk*: High if reward is narrow (e.g., pleasing internal reviewers ≠ true goal).  
       - *Process gaming risk*: High if agent can fine-tune traces to mimic plausibility without correctness.  
     - **Result:**  
       - Low outcome gaming risk → **Outcome-only** (if Tests 1/3 support).  
       - High outcome gaming risk + low process gaming risk → **Stepwise process** (if Test 2 supports).  
       - High gaming risk for both → **Hybrid** (milestones break optimization loops) or **no automation**.  
     - **Default if unclear:** Assume high gaming risk for both (optimization pressure is inevitable).  

  5. **Resource Feasibility Test**  
     - **Check:**  
       - Reviewer hours: Stepwise costs 20× outcome-only. Hybrid costs scale with milestone frequency.  
       - Non-technical reviewers: Can they contribute? (If not, effective team size = 3.)  
     - **Result:**  
       - Stepwise feasible if <30% of tasks require it (given team capacity).  
       - Else, downgrade:  
         - Stepwise → **Hybrid** (reduce audit frequency).  
         - Hybrid/stepwise → **Outcome-only** (if verifiable and blast radius tolerable).  
       - If no mode fits constraints → **No automation**.  

  6. **Final Mode Assignment**  
     - **Triggers for re-review after fine-tuning**:  
       - Outcome degradation or gaming detected.  
       - Trace legibility drops (e.g., after agent retraining).  
       - Blast radius changes (e.g., task promoted to critical system).  
     - **Escalate to "No automation" if**:  
       - Outcome unverifiable + trace unfaithful + blast radius large.  
       - Resource constraints block all supervised modes.  

  ---

  ### Application to Workflows  
  *Key assumptions: Non-technical reviewers cannot parse code/technical traces. "Legibility" and "faithfulness" judgments based on trace samples.*

  1. **Regulatory Correspondence Drafting**  
     - **Test 1 (Outcome):**  
       - Verifiable via internal review (proxy), but true outcome (regulator response) has long lag (months). High proxy risk (agent could optimize for internal approval, not compliance). → **Proceed to Test 2.**  
     - **Test 2 (Trace):**  
       - Legibility: Medium (non-technical reviewers understand email logic). Faithfulness: Low (no way to validate if trace "caused" the draft). → **Disqualify stepwise. Outcome-only candidate.**  
     - **Test 3 (Blast):**  
       - Low reversibility (once sent), large blast radius (fines/reputation). → **Requires strong oversight.**  
     - **Test 4 (Adversarial):**  
       - High outcome gaming risk (proxy ≠ true goal). → **Outcome-only insufficient.**  
     - **Test 5 (Resources):** Stepwise too costly for all drafts.  
     - **Verdict: Hybrid**  
       - Milestone: Full process audit on 10% of drafts; outcome-only on rest.  
     - **You won’t like this:** Outcome-only is unsafe due to proxy gaming. Stepwise is disqualified by faithfulness.  
     - **Flip verdict if:** Traces include citable sources for each claim (enabling validation → high faithfulness).  

  2. **Internal Infrastructure Code Changes**  
     - **Test 1 (Outcome):**  
       - Verifiable via automated tests (immediate lag). Low proxy risk (tests correlate with stability). → **Candidate for outcome-only.**  
     - **Test 2 (Trace):**  
       - Legibility: Low for non-technical reviewers (code/scripts). Faithfulness: High (code outputs testable). → **Stepwise feasible for technical reviewers only.**  
     - **Test 3 (Blast):**  
       - High reversibility (rollbacks), medium blast radius (localized outages). → **Outcome-only acceptable if tests robust.**  
     - **Test 4 (Adversarial):** Low outcome gaming risk (tests are ground truth).  
     - **Test 5 (Resources):** Outcome-only saves 20× costs vs. stepwise.  
     - **Verdict: Outcome-only**  
       - *Contingency:* Stepwise audits if test coverage drops.  

  3. **Market Research Memos**  
     - **Test 1 (Outcome):**  
       - Unverifiable short-term (conclusions disconfirmed months later). Proxy (e.g., internal plausibility check) has high gaming risk. → **Proceed to Test 2.**  
     - **Test 2 (Trace):**  
       - Legibility: Medium (narrative traces). Faithfulness: Low (no validation until future). → **Disqualify stepwise. Outcome-only not feasible.**  
     - **Test 3 (Blast):**  
       - Medium reversibility (decisions can be revised), large blast radius (strategic missteps). → **Requires oversight, but stepwise disqualified.**  
     - **Test 4 (Adversarial):** High gaming risk for any proxy.  
     - **Test 5 (Resources):** Stepwise/hybrid too costly for volume.  
     - **Verdict: No automation**  
       - *Why:* Unverifiable outcome + unfaithful trace + high stakes.  
     - **You won’t like this:** Flagship workflow refuses automation.  
     - **Flip verdict if:** Short-term proxies with low gaming risk exist (e.g., consensus from independent expert panel).  

  ---

  ### What the Procedure Cannot Do  
  1. **Blind Spots:**  
     - **Unforeseen failure modes:** Cannot predict novel agent manipulations (e.g., subtle trace deceit).  
     - **Trace access:** Assumes agents output reasoning traces. Fails if traces are suppressed or obfuscated.  
     - **Reviewer drift:** Assumes stable reviewer competence. Degrades if turnover reduces expertise.  

  2. **Critical Assumptions:**  
     - Traces exist and are accessible.  
     - Reviewers can be assigned to matching tasks (non-technical avoid code reviews).  
     - Gaming risks are identifiable upfront (may require historical data).  

  3. **Human Sign-off Responsibility:**  
     - **Head of Product must own:**  
       - Business-risk tradeoffs (e.g., accepting "no automation" for research memos).  
       - Overriding procedure when context is misaligned (e.g., emergent regulatory threats).  
       - Resolving conflicts between procedure output and strategic goals.  

  **Procedure Output:** A clear, auditable rationale for each supervision mode. Escalate "no automation" cases with test-by-test justification. Re-review every 6 months or after major agent updates.
