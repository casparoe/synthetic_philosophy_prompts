  The payoff structures made cooperation hard. If one group restrained, others would take their share. For example, if inshore fishers cut back, offshore or international fleets might catch more. So defection—overfishing—was dominant. The mechanisms here are market competition (race to catch fish first), political influence (lobbying for higher quotas), and epistemic issues (optimistic science).

