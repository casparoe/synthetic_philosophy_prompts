  Where does the model break down? The moratorium in 1992 happened despite incentives to keep fishing. Why? Maybe the collapse was so obvious that the DFO couldn't ignore it, or political pressure shifted. Also, the moratorium was a collective action, which the standard model might not predict. Regulatory capture could explain why quotas were too high, but collective action with asymmetric information fits too—fishers didn't have full data, so they couldn't coordinate.

  The user asks what this case reveals about the multipolar trap concept. It confirms the core idea but shows epistemic factors can worsen it. The unexpected mechanism is the science-policy feedback loop. Conditions like lack of enforcement on international fleets and data delays were crucial.

