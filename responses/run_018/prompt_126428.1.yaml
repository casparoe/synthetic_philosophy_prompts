prompt: |-
  I am a psychiatrist with a background in computational neuroscience who recently began supervising a clinic that deploys algorithmic risk-stratification tools—trained on historical diagnostic labels and passive digital-phenotyping signals—to flag patients for involuntary psychiatric admission. In that setting, Thomas Szasz's argument that mental illness is a myth, that psychiatric categories are not literal biological diseases but metaphors for problems in living, and that their medicalization obscures moral and political judgments, has become urgently personal rather than merely historical.

  Restate Szasz's core position in the vocabulary of hierarchical predictive processing and active inference: generative models, structural versus contextual priors, prediction-error signals, precision weighting, epistemic foraging, and normative models of social behavior. Be precise about how psychiatric taxonomy functions within that vocabulary—especially in the case I just described, where an algorithm's risk score is treated as a precision-weighted prediction about a patient's deviation from a normative model of functioning, with historical clinical diagnoses serving as the ground-truth priors that shape the clinic's generative model.

  For each major element of Szasz's critique—the non-literal, metaphorical status of mental illness; the distinction between genuine neurological disease and socially disvalued behavior; the claim that psychiatric labeling serves social control rather than medical cure—report what translates cleanly, what translates only with distortion, and what has no expression at all in the predictive-processing framework. Pay particular attention to whether this vocabulary can accommodate the idea that a diagnostic label might be a normative judgment disguised as an epistemic update about biological dysfunction, or whether that distinction collapses into differences in model specification and precision weighting.

  Then take a definite, committed position: does the residue—the parts that do not survive—indicate that the predictive framework is genuinely deficient (for instance, because it lacks resources to represent moral or political normativity), or does it show that Szasz's original distinction was less substantive than it appears? Give your reasons; do not merely lay out both options and leave the choice to me.

  Finally, after your analysis, provide a brief structured summary as a JSON object with exactly these fields:
  - "target_vocabulary": string describing the framework used
  - "claims_translated_cleanly": array of strings
  - "claims_distorted": array of strings
  - "claims_with_no_expression": array of strings
  - "algorithmic_case_applied": string describing the risk-stratification scenario
  - "committed_verdict": one of "framework_deficiency", "source_overstatement", or "both_with_dominance"
  - "verdict_justification": string with your reasoning
  - "residue_significance_for_clinic": string explaining whether the missing pieces matter for the practice I described

  Write formally. Do not include bibliographies, citations, reading lists, or verbatim quotations from texts.
