answer: |-
  Here’s a conceptual breakdown using your requested pairing: **Edward Snowden (modern whistle-blower) and Lucius Licinius Crassus (Roman patron defending a corrupt client)**. The contradiction arises in how **institutional loyalty vs. interpersonal fidelity** is morally framed, exposing incommensurable foundations of virtue.

  ### **The Contradiction in Comparative Judgement**
  1. **Snowden’s "Virtue" (Democratic Accountability):**  
     Snowden exposed NSA surveillance, prioritizing *transparency to the public* over loyalty to the state. His moral logic:  
     - **Virtue = Universal Truth-Telling:** Obligation to humanity trumps institutional secrecy.  
     - **Moral Unit:** The individual conscience serving abstract justice.  

  2. **Crassus’ "Virtue" (Patron-Client Fides):**  
     As a patron, Crassus defended his corrupt client Verres (Cicero, *Verrines*). His moral logic:  
     - **Virtue = Unconditional Fides:** Loyalty to one’s client/kin supersedes abstract justice.  
     - **Moral Unit:** The dyadic bond upholding social order.  

  **The Conflict:**  
  Plutarch’s method would praise **Snowden’s betrayal of institutional secrecy** as courage (Greek *parrhesia*), while praising **Crassus’ complicity in corruption** as fidelity (Roman *fides*). Yet, *within each framework*, the other’s virtue is a vice:  
  - To Crassus, Snowden’s act is **treachery**—a failure of duty to his "patron" (the state).  
  - To Snowden, Crassus’ act is **collusion**—a sacrifice of public good for private obligation.  

  The traits aren’t merely *different*; they are **mutually negating** when judged by the other’s moral logic. Snowden’s virtue violates Crassus’ core ethic (hierarchical loyalty), and Crassus’ virtue violates Snowden’s core ethic (universal accountability).

  ### **Why Excising One Figure Defeats the Pedagogical Purpose**
  1. **Loss of Moral Complexity:**  
     Biography’s power lies in confronting *contextual* virtue. Removing Crassus to avoid contradiction reduces the lesson to: "Whistle-blowing is always heroic." This flattens moral education into dogma—precisely the "hagiography" you critique. Plutarch’s method forces us to grapple with why Crassus’ *fides* was virtuous *for Rome*, even as we reject it today.  

  2. **Erasure of Historical Difference:**  
     Excising Snowden preserves Crassus’ framework but implies that *fides* is eternally valid. This distorts history by silencing how modernity redefines loyalty (e.g., to constitutions over persons). Biography’s pedagogical value emerges from tension—not harmony—between irreconcilable ethics.  

  3. **The Paradox of "Universal" Virtue:**  
     Plutarch assumes virtue transcends context, but this pairing reveals that *the scaffolding of virtue is socially constituted*. Crassus’ *fides* and Snowden’s transparency rely on incompatible premises:  
     - **Roman Premise:** Society is a web of personal bonds.  
     - **Democratic Premise:** Society is a contract of impersonal principles.  
     Judging both by one standard demands amputating the other’s worldview—rendering the biography a tool of presentism.  

  ### **Core Conceptual Issue**
  Plutarch’s method fractures when virtues depend on **incommensurable social ontologies**. Here, the contradiction lies in the *grounds of moral obligation*:  
  - **Snowden’s obligation** is to humanity/truth (deontological).  
  - **Crassus’ obligation** is to a specific person (relational).  

  Celebrating both requires endorsing two contradictory answers to: *"To whom is primary duty owed?"* The comparative judgement thus becomes incoherent—not due to historical distance, but because the virtues are *structurally antagonistic*. Yet this very tension is pedagogically indispensable: it reveals that moral exemplarity is **embedded in lived systems of value**, not extracted from a vacuum. To excise one figure is to deny biography’s capacity to historicize ethics—reducing it to moral propaganda.
