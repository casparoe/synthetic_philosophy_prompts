answer: |-
  Your framework is coherent and philosophically nuanced, but tensions exist. Here's an audit focused on internal consistency, ranked by severity, with suggested adjustments in British English:

  **Ranked Tensions & Recommendations:**

  1.  **Tension: (1) vs. (4) - Specific Fault vs. Structural Risk Exposure**
      *   **Severity:** **High**. This is the most significant clash.
      *   **Conflict:** (1) insists standing is lost *only* for the *exact* fault committed hypocritically. (4) suggests standing can be eroded merely by being in a structurally analogous position of temptation *even if you resisted*. Why should mere exposure (without actual fault) diminish standing if only token-faults matter?
      *   **Resolution:** You need to reconcile *why* mere exposure weakens standing. Possibilities:
          *   **Refine (4):** Argue exposure creates a *reasonable perception* of likely hypocrisy or weakness *by others*, undermining the *communicative effectiveness* of blame (linking to (3)), even if your standing is technically intact. This leans on the communicative aspect of blame.
          *   **Refine (1):** Allow standing to be diminished not *only* for identical token-faults, but also for *sufficiently analogous* faults or vulnerabilities arising from the *same character flaw or structural position*. (4) then becomes an *application* of this broader (1).
          *   **Least Costly Drop:** **Dropping (4)** is least disruptive to the core structure. Your package remains robust without it, losing some nuance about structural vulnerability but preserving specificity. Alternatively, significantly **modify (4)** as above.

  2.  **Tension: (3) vs. (5) - "Intact" Authority vs. Scalar "Enough"**
      *   **Severity:** **Moderate/Low**. Primarily terminological.
      *   **Conflict:** (3) states blame's legitimacy hinges on the blamer having "intact" moral authority, suggesting a binary state. (5) states standing is scalar, allowing "enough" authority even when compromised.
      *   **Resolution:** This is easily reconciled by interpreting "intact" in (3) as meaning "sufficiently intact *for the communicative act in question*" rather than "perfectly intact". Your scalar view in (5) *enhances* (3) by explaining *how* authority functions communicatively – you need *enough* credibility for the specific blame to land effectively. Replace "intact" in (3) with "sufficient" or "adequate".
      *   **Least Costly Adjustment:** **Refine terminology in (3)**. Dropping (5) would significantly weaken the framework's realism and nuance.

  3.  **Tension: (2) vs. (4) - Full Wipe vs. Erosion by Exposure**
      *   **Severity:** **Low** (If (4) is retained). Potential clash, not direct contradiction.
      *   **Conflict:** (2) states past guilt is "fully wiped" after genuine reform, restoring standing "like a paid debt". (4) suggests current exposure to analogous temptation *erodes* standing *even if reformed* and currently resisting. Does the lingering vulnerability from past faults (even reformed) count against the "full wipe"?
      *   **Resolution:** Distinguish between *historical guilt* and *current vulnerability*. (2) wipes the *guilt/debt* of the past *act*. (4) refers to a *present state* of susceptibility, which might be a consequence of past faults or inherent circumstances, affecting *current* standing. Genuine reform might *mitigate* but not necessarily *eliminate* the perceived communicative weakness arising from current structural vulnerability. The "debt" is paid, but the "scar" (or ongoing risk) might still affect perceived authority.
      *   **Least Costly Adjustment:** **Clarify the distinction** between historical guilt (wiped) and current structural position/vulnerability (potentially affecting standing). (2) and (4) can co-exist with this nuance.

  4.  **Tension: (1)/(3) vs. (6) - Individual Standing vs. Pointlessness of Individual Blame**
      *   **Severity:** **Very Low/Negligible**. Complementary, not conflicting.
      *   **Conflict:** (1) & (3) establish conditions for individual standing to blame. (6) argues that *despite* potentially having standing (if reformed, not hypocritical on *that exact fault*, etc.), individual blame for diffuse collective wrongs like climate harm is usually *pointless* (ineffective, misdirected).
      *   **Resolution:** Standing is a *necessary condition* for *legitimate* blame, not a *sufficient* one for *effective* or *meaningful* blame. (6) addresses the pragmatic and communicative *effectiveness* of blame in specific contexts (diffuse harms), while (1)-(5) address its *moral legitimacy*. They operate on different levels. Pointlessness doesn't invalidate standing; it just makes exercising it futile or counterproductive. Institutional bodies (as per (6)) bypass the *standing* requirement precisely because they aren't individuals invoking personal moral authority in the same way.
      *   **Least Costly Adjustment:** **None needed.** These points work well together. Dropping (6) loses valuable insight into the limits of blame as a communicative tool for systemic issues.

  **Overall Assessment & Recommendations:**

  *   **Strengths:** Your package is sophisticated, blending insights on hypocrisy's specificity, redemption, blame's communicative nature, scalar standing, and the limits of individual blame for systemic issues. (5) (scalar standing) is a particular strength that resolves many potential binary problems.
  *   **Main Vulnerability:** The core tension is **indeed (1) vs. (4)**. Resolving this is crucial. **Recommend integrating (4) into a refined (1):** Allow standing to be diminished not only by *identical* token-faults but also by *sufficiently analogous* faults or by being in a position that *fundamentally undermines the credibility of the specific criticism* due to shared vulnerability (even if resisted). This makes exposure relevant *because* it creates an analogy strong enough to trigger the hypocrisy concern. Alternatively, frame (4)'s effect as primarily on *perceived* standing and communicative *effectiveness*, rather than moral legitimacy *per se*.
  *   **Minor Refinements:** Change "intact" in (3) to "sufficient" or "adequate" to harmonise perfectly with (5). Clarify that (2) wipes the *guilt/debt*, but existing *vulnerabilities* (acknowledged in (4)) might still impact *current* communicative standing.
  *   **Coherence:** Points (2), (3), (5), and (6) integrate well. (1) is clear but needs adjustment to accommodate (4) if you keep it. (6) is a valuable pragmatic extension, not a contradiction.

  **Conclusion:** Your framework largely hangs together and offers a compelling, nuanced view. The primary task is resolving the (1)/(4) tension by either significantly modifying/dropping (4) or expanding (1) to encompass the kind of structural vulnerability/exposure that meaningfully undermines the specific communicative act of blame in a way analogous to token hypocrisy. With that resolved, the package is robust and philosophically sound.
