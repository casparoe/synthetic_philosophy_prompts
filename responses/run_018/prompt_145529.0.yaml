answer: |-
  **Core Claim:** The deepest conflict lies between democratic sovereignty and curatorial integrity, resolvable only by a hybrid approach that prioritizes rejecting false historical narratives as non-negotiable while treating the democratic-expert balance as context-dependent; the requirement eliminating most existing proposals is distinguishing *mere functional reference* from *active commemoration*.

  **Desiderata for a Normative Theory of Public Commemoration:**

  1.  **Accommodate Semantic Drift:** Must distinguish between the original commemorative intent and present-day meaning if the association with the original figure is lost locally. *Motivation:* A statue of "General Winter" now perceived only as a seasonal decoration, not a specific war hero. Prevents pointless removal based on vanished significance.
  2.  **Acknowledge Functional Utility:** Must recognize when a name serves a crucial non-commemorative purpose (navigation, historical landmarking) despite problematic origins. *Motivation:* A street name like "Rhodes Drive," deeply embedded in maps and discourse, where removal causes significant practical disruption without erasing the historical record elsewhere. Balances practical harm against symbolic harm.
  3.  **Distinguish Honoring from Referring:** Must provide criteria to differentiate contexts actively *celebrating* a figure (e.g., statues in prominent squares) from those merely *denoting* a location or historical presence (e.g., a street name sign). *Motivation:* Prevents conflating neutral historical markers with affirmations of values. *Crucial for eliminating flawed proposals*.
  4.  **Delimit Democratic vs. Curatorial Authority:** Must specify domains where public vote/majority rule is appropriate (e.g., overall commemoration policy) versus where historical expertise/curatorial principles should prevail (e.g., factual accuracy, contextualization). *Motivation:* Prevents mob rule removing all uncomfortable history *or* experts imposing unpopular narratives against democratic will. *Primary site of conflict with (1) & (5)*.
  5.  **Prevent Historical Falsification:** Cannot require maintaining monuments or names that actively perpetuate demonstrably false narratives about the past or the figure depicted. *Motivation:* A statue with a plaque falsely claiming a slaver "brought civilization." *Non-negotiable constraint*.
  6.  **Prohibit Complete Erasure:** Cannot allow the removal/renaming process to utterly erase all trace of disapproved figures/events from the *collective public record* (though specific *commemorations* can be removed). *Motivation:* Preserves the possibility of historical awareness and learning, even about negative pasts. *Non-negotiable constraint*. *Conflicts with strong majoritarian impulses (4)*.
  7.  **Assess Present Harm vs. Historical Distortion:** Must weigh tangible harm to present citizens (e.g., psychological distress, reinforcement of inequality) against the abstract harm of distorting historical memory. *Motivation:* A statue causing daily offense to a marginalized group vs. removing the only marker of a complex but locally significant event. Prioritizes present harm without ignoring historical integrity.
  8.  **Require Contextualization as an Alternative:** Must consider robust historical contextualization (added plaques, counter-monuments) as a valid alternative to removal/renaming where feasible and meaningful. *Motivation:* Transforms a problematic statue into a site of education rather than simple erasure or continued veneration. Balances (5), (6), and (7).

  **Non-Negotiables:** Desiderata (3) Distinguishing Honoring/Referring, (5) Preventing Historical Falsification, and (6) Prohibiting Complete Erasure are fundamental, non-negotiable constraints any adequate theory must satisfy. Failure on these points invalidates the theory.

  **Camp-Specific Preferences:** The precise weighting and institutional implementation of (4) Democratic vs. Curatorial Authority, the threshold for (7) Present Harm, and the default preference between removal/renaming versus (8) Contextualization represent contentious areas where different normative camps (e.g., strong democrats, liberal pluralists, traditional conservatives) will have distinct, often incompatible, preferences.
