  But if the micro-structures' forms are necessary for the substrate to exist, then the substrate itself might depend on those forms. However, the statue doesn't depend directly on those micro-forms but on the substrate as a whole. So the higher-level dependence remains asymmetrical. The key is that the statue's form is a configuration of the substrate. Even if the substrate has internal forms, as long as it persists numerically, the statue's form can be destroyed without destroying the substrate. But if the substrate is destroyed, the statue is gone. 

