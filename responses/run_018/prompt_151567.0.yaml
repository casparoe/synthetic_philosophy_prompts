    "total_steps": 5,
    "value_judgment_steps": [2, 3, 5],
    "unresolvable_case_type": "Community/political pressure overriding EFAP failure",
    "primary_limitation": "Defers threshold determinations for 'significant alterity' and 'sufficient openness' to coordinator discretion without ethical benchmarks."
