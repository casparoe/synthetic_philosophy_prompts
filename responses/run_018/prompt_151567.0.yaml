answer: |-
  ### Core Commitments of Exemplary Friction
  1. Moral learning requires the learner to identify with the subject sufficiently to engage emotionally and imaginatively (*proximity*).  
  2. It simultaneously demands recognition of the subject’s fundamental difference in context, choices, and limitations (*irreducible alterity*) to avoid simplistic emulation.  
  3. Narratives must resist definitive moral conclusions (*narrative openness*), inviting critical interrogation of the life’s "goodness," whereas hagiography erases alterity and imposes premature closure.

  ---

  ### Decision Procedure: **Exemplary Friction Assessment Protocol (EFAP)**  
  *For evaluating biographical resources in secondary ethics curricula*

  **Step 1: Proximity Test**  
  (a) *Question:* Does the resource present the subject’s motivations, struggles, or relational context in ways secondary students can meaningfully connect to their own developmental stage?  
  (b) *Sufficient answer:* Yes—explicit depictions of formative decisions, vulnerabilities, or social dilemmas relevant to adolescent experience (e.g., peer pressure, ambition, fairness conflicts).  
  (c) *Action:*  
  - **Yes** → Proceed to Step 2.  
  - **No** → **EXCLUDE** (fails foundational engagement).  
  (d) *Flag:* **FACT** (observable textual/visual content).

  **Step 2: Alterity Test**  
  (a) *Question:* Does the resource foreground at least one significant, documented aspect of the subject’s life that is ethically ambiguous, culturally unfamiliar, or psychologically distant to learners?  
  (b) *Sufficient answer:* Yes—unflinching inclusion of contradictions (e.g., courage alongside cowardice, innovation with exploitation), cultural specificities, or taboo actions without didactic "resolution."  
  (c) *Action:*  
  - **Yes** → Proceed to Step 3.  
  - **No** → **EXCLUDE** (collapses friction into hagiography).  
  (d) *Flag:* **VALUE** (judgment on "significance" and "unfamiliarity").

  **Step 3: Narrative Openness Test**  
  (a) *Question:* Does the resource structurally invite questioning of the subject’s moral status (e.g., through unresolved dilemmas, counter-narratives, or metacommentary)?  
  (b) *Sufficient answer:* Yes—narrative devices (e.g., open-ended conclusions, primary source contradictions) actively prevent a single, authoritative verdict on the subject’s "goodness."  
  (c) *Action:*  
  - **Yes** → **PROCEED WITH FRAMING CONDITIONS** (e.g., supplementary discussion prompts).  
  - **No** → Proceed to Step 4.  
  (d) *Flag:* **VALUE** (judgment on "invitation to question").

  **Step 4: Closure Mitigation Check**  
  (a) *Question:* Is the absence of narrative openness offset by verifiable, substantive alterity (Step 2) that intrinsically resists moral simplification?  
  (b) *Sufficient answer:* Yes—alterity elements are so prominent and pedagogically generative that they inherently destabilize closure (e.g., scientist’s cruelty is central, not marginal).  
  (c) *Action:*  
  - **Yes** → **PROCEED WITH FRAMING CONDITIONS**.  
  - **No** → Proceed to Step 5.  
  (d) *Flag:* **FACT** (cross-verification with Step 2 data).

  **Step 5: Override Assessment**  
  (a) *Question:* Do non-pedagogical factors (e.g., community sentiment, institutional pressure) compel reconsideration despite EFAP failure?  
  (b) *Sufficient answer:* N/A (diagnostic only).  
  (c) *Action:*  
  - **HAND TO COORDINATOR** (for value-based override deliberation).  
  (d) *Flag:* **VALUE** (external priorities vs. pedagogical principles).

  ---

  ### Application to Cases  
  | Case                                                                 | Procedure Verdict               | Decisive Step | Judgment Override Required? (Reason)                          |
  |----------------------------------------------------------------------|---------------------------------|---------------|---------------------------------------------------------------|
  | (1) Celebratory humanitarian biography (omits failures)             | **EXCLUDE**                     | Step 2 (No)   | No (Fails alterity test; irredeemable omission)               |
  | (2) "Warts-and-all" scientist biography (cruelty documented)        | **PROCEED WITH FRAMING**        | Step 3 (No) → Step 4 (Yes) | No (Alterity sufficiently destabilizes closure)               |
  | (3) Community-nominated founder biography (no openness, high support) | **HAND TO COORDINATOR**         | Step 5        | **Yes** (Conflict between EFAP failure and community values) |

  ---

  ### Explicit Limitations  
  1. **Cannot adjudicate moral thresholds:** Does not define which failures are "disqualifying" (e.g., theft vs. genocide)—relies on coordinator’s pre-established curriculum standards.  
  2. **Cannot resolve value conflicts:** Silent on weighing community pressure against pedagogical integrity; defers to coordinator’s institutional judgment.  
  3. **Cannot calibrate proximity/alterity:** Assumes uniform developmental readiness; unsuitable for differentiating by age or ability without modification.  
  4. **Cannot assess factual accuracy:** Presumes documented content; requires separate verification if credibility is contested.

  ---

