prompt: |-
  so I'm about 60k words into a novel about a real person and I've worked myself into a knot I cant think my way out of, and I want you to argue the side I don't want to be true.

  Setup: she's my great-great-aunt, died 1891, unmarried, obscure — wrote some temperance tracts, kept a diary for four years in her twenties and then stopped. The entire record is basically eleven letters, that diary, a court entry about a debt, and one photograph. I've used her real name. The invented stuff: a night where she gets drunk in somebody else's house, and a scene where she burns a bundle of letters. No evidence for either, and the drunk night cuts straight against everything she published and was known for.

  My own view, which I've been defending to my family for a year, is that truth is the wrong norm here. What I owe her isn't truth, it's *aptness*: the invented thing has to be the sort of thing the record leaves room for and the pressures in the letters make sense of, apt the way a metaphor is apt — answerable to the shape of the life, not to the ledger of what happened. And if a reader comes away believing she got drunk, well, almost nobody will, and if they do nothing follows from it.

  But I keep hitting a case I have no answer to, which I've started calling *eviction*: because there's basically nothing else, my novel is going to *be* the record. There won't be a competing version. The archive gives you four sentences and a photo, and googling her name gets you my book. So I'm not adding one more story to a pile of stories about her, I'm replacing the pile. And it isn't only beliefs that change — what you can *do* with her changes: she stops being a person in an archive and becomes a character, available for a netflix thing, a walking tour, whatever comes next. That availability is my invention.

  So please argue that I owe her something stricter than aptness. Ground rules:

  - Don't rest it on the law (I don't want an argument that collapses if the law is different from what you think), and don't rest it on the feelings of living relatives — my cousin is upset and I don't think that's the interesting wrong.
  - Grant me nearly everything: grant that the dead can't be harmed in any literal sense, that there's nobody left to consent or object, and that aptness really is the right norm for invented *dialogue* and probably for compressed or composite minor characters too. Take the strongest version of my view and then say where it breaks.
  - Cash it out where I live, which is at the desk. What concretely would I have to change or give up? Is it the drunk night in particular — does it matter that it contradicts her published positions rather than just the silence of the archive — or is the problem the whole project of writing her interior life? Would renaming her fix it or is that just laundering it? Is a note up front enough, or does an afterword that sets the thin real record next to the fat invented one actually answer the eviction worry, or does it just make me feel better?

  If you think aptness and eviction are the wrong frame entirely, say so and hand me better ones — but you still have to argue the strict side. No quotes at me and no reading lists; I want the argument, not the literature.
reasoning: |-
  Okay, the user is deep into writing a novel about their obscure great-great-aunt and has hit an ethical dilemma. They invented scenes—one where she gets drunk, contradicting her temperance advocacy, and another where she burns letters. Their core argument is that "aptness" (emotional/metaphorical truth) matters more than factual accuracy for such an underdocumented person. But they're troubled by "eviction"—the fear that their novel will become the sole record, erasing the real person.  

  First, I need to honor their constraints: no legal arguments, no appeals to living relatives' feelings, and they've already granted that the dead can't be harmed. They want me to attack their "aptness" stance head-on, even granting it works for dialogue/composite characters. The challenge is to find where "aptness" fails under "eviction."  

  Hmm. The user's metaphor of "eviction" is sharp—it's not just about inaccuracy but displacement. The real horror isn't misrepresentation; it's that the misrepresentation becomes the only representation. The archive is skeletal; the novel fills the void so completely that the real person vanishes under fictional sediment. A disclaimer or afterword might not fix this because once absorbed, fiction sticks harder than footnotes.  

  The drunk scene is especially thorny because it directly contradicts her only public voice (temperance tracts). Aptness might justify it as "plausible inner conflict," but when the novel becomes her entire legacy, that invented contradiction could overwrite her documented convictions. Suddenly, "temperance advocate" becomes "hypocrite" in public memory. That feels like a deeper betrayal than, say, inventing a hobby.  

  Renaming her? Tricky. It might feel like laundering, but it signals "this is fiction inspired by..." rather than "this is her." Still, if the character is 95% her (same life facts, photo used?), does renaming really prevent eviction? Probably not—readers will map it back.  

  Concrete sacrifices they'd face:  
  - Cutting the drunk scene entirely (it's the biggest liability)  
  - Or, keeping the scene but making the character an amalgam/rename (loses the personal connection they want)  
  - Or, structuring the novel to emphasize its fictionality (e.g., metafictional framing where the narrator admits invention)  

  But their question is urgent: they're stuck, 60k words in. The real pain point is reconciling artistic freedom with the guilt of "erasing" an ancestor. They need the strict argument not to win, but to test their own resolve.  

  The strictest case: You owe her strict truth where it exists (her words, her published stance), and radical transparency about invention everywhere else. Aptness fails at "eviction" because metaphor collapses when there's no "real" left to point to. Your invention isn't decorating her life—it's building a puppet with her name.  

  Final thought: Their worry about "what you can do with her" (Netflix, walking tours) reveals the stakes. Once fictionalized, she becomes utility, not a person. Is that the legacy she’d want? Probably not—but since we can’t ask, the strict view says: default to preservation, not invention.
answer: |-
  Here’s the strictest case against your "aptness" framework, grounded in **historical stewardship**, targeting the core problem of **eviction**:

  ### The Argument: You Are Her Trustee, Not Her Metaphorist  
  1. **The Uniqueness of Obscurity**  
     Your aunt isn’t just underdocumented—she’s a *nonentity* outside your project. For figures like her, the archive isn’t "thin"; it’s *fragile*. Your novel doesn’t add to her story—it **becomes her tombstone**. When the only trace left of a person is a handful of artifacts, altering them isn’t literary license; it’s **archival vandalism**. Aptness works when facts persist alongside fiction (e.g., *Wolf Hall*’s Cromwell). Here, fiction doesn’t complement—it **consumes**.  

  2. **The Drunk Scene: Not Apt, But Theft**  
     The contradiction matters. Her temperance tracts aren’t just "published positions"—they’re **her only intentional public voice**. Inventing a scene where she violates that voice doesn’t reveal complexity; it **silences her actual words**. If the record shows "I am X," and you show "she was secretly not-X," you’re not interpreting her—you’re **replacing her**. Aptness demands internal coherence, but her *real, documented self* is part of that coherence. Ignoring it makes your metaphor a forgery.  

  3. **Eviction Isn’t About Belief—It’s About Access**  
     You admit her transformation into a "character" enables Netflix adaptations. But when she becomes a character, you **revoke her personhood**. The real woman—who paid debts, wrote diaries, advocated temperance—ceases to be *actionable* as a historical subject. Scholars can’t cite her, activists can’t reclaim her; she’s now fictional IP. Your invention doesn’t just add details—it **extinguishes the evidentiary basis for her existence**.  

  4. **Why Renaming/Disclaimers Fail**  
     - **Renaming**: If you keep her photo, her diary dates, her town? Readers will know. It’s **fraud by omission**. If you change everything, why use her at all?  
     - **Disclaimers**: They’re ignored. Afterwords? Unread. Once culture adopts your version (Google, walking tours), the disclaimer is a fig leaf. The archive won’t "sit beside" your novel—it’ll drown in it.  

  ### What You Must Sacrifice (At the Desk)  
  - **Kill the Drunk Scene**: It’s indefensible. Contradicting her only public stance isn’t "apt"—it’s **ethical sabotage**.  
  - **Burn the Letter-Burning? Maybe not**: If her diary *stops* abruptly, burning letters *could* be apt (destruction as metaphor for silence). But only if:  
    - It aligns with her documented psychology (e.g., her letters show shame).  
    - You don’t imply it explains her entire life.  
  - **Interior Life Limits**: Invent her *feelings*, not her **actions**. If she writes "visited the Millers today," you can imagine her envy of their marriage. But if she *never* touches alcohol in her writing, don’t put a glass in her hand.  

  ### A Better Frame: **Custodianship Over Creativity**  
  Your duty isn’t to "truth" or "aptness"—it’s to **preserve her autonomy**. She chose what to share (diaries, tracts). Where she’s silent, *honor that silence*. Don’t fill voids with contradictions to her voice.  

  > **Concrete change**: Rewrite the drunk night as a *near-fall*. She’s tempted, alone, pours whiskey... but pours it out. That’s apt (struggle matches her advocacy) without violating her record. You keep tension, lose betrayal.  

  This isn’t about morality—it’s about **holding the door open** for her to be more than your metaphor. If you evict her from history, you succeed as a novelist but fail as her kin.
