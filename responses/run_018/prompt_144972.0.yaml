  Consider the philosophical debate about whether demographic cohorts—'Baby Boomers', 'Millennials', 'Generation Z', and so on—are real social kinds or merely statistical artefacts defined by birth-year ranges. Give an example of a conceptual issue that arises specifically if one treats these cohorts as ontologically robust entities with persistent collective properties. Focus on the tension between a cohort's putative diachronic identity—its claim to remain the same kind over decades—and the lifecycle effect, in which individuals systematically shift their economic behaviour, political attitudes, and cultural preferences as they age, even while the cohort-label stays fixed to the original birth window. Show how this combination produces a paradox for attributing stable, essential characteristics to the group. Work solely from the conceptual structure; do not supply bibliographies, reading lists, or citations. If the framing is incoherent—for instance, if cohort-ontology is too vague to generate the paradox—say so plainly rather than forcing an answer. Please write in British English.
