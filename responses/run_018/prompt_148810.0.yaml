answer: |-
  ## Fellowship Proposal: System-Directed Reactive Attitudes & the Structure of Moral Responsibility

  **1. The Precise Question (~150 words):**
  Strawson’s reactive attitudes (resentment, gratitude, etc.) are central to compatibilist defenses of moral responsibility, grounding it in our natural, interpersonally targeted emotional responses, which determinism purportedly doesn't touch. However, this framework systematically neglects a significant class of moral emotions: **system-directed reactive attitudes** (SDRAs) – e.g., profound indignation at systemic injustice, moral disappointment toward a corporation’s culture, or visceral betrayal felt toward a dysfunctional institution. The open question is stark: *Do SDRAs fit within, challenge, or require a revision of Strawson’s core participant/objective attitude distinction, and what does this mean for the claim that determinism is irrelevant to our responsibility practices?* Current answers are inadequate. Simply subsuming SDRAs under the "objective attitude" (detached, managerial) ignores their deeply felt, normatively laden *participant* character. Collapsing them into individual attitudes misses their distinct target and phenomenology. The literature’s individualistic assumption leaves SDRAs theoretically homeless, creating an unresolved tension within Strawson’s influential framework.

  **2. The Angle (~150 words):**
  Focusing on SDRAs isn't just adding another example to the determinism debate; it’s a targeted methodological intervention into the *structure* of Strawson’s account. SDRAs act as a crucial stress test precisely because they share core features of classic reactive attitudes (e.g., normativity, emotional force, demand for recognition) while diverging radically in their target (systems/structures, not individual agents). This forces us to ask: *What is the essential core of a reactive attitude?* Is it the interpersonal dynamic, the demand for goodwill, or the normative expectation itself? By examining why SDRAs *feel* like reactive attitudes yet target non-individuals, we isolate what Strawson’s binary truly rests upon. This moves beyond rehashing compatibilism vs. incompatibilism; it seeks to refine the very conceptual toolkit Strawson provides for understanding responsibility *practices*, potentially revealing a richer, more complex landscape than his individual/objective dichotomy allows.

  **3. Month-by-Month Method (~200 words):**
  *   **Month 1-2: Conceptual Groundwork & Phenomenology:** Rigorously define SDRAs, distinguishing them from individual-directed attitudes, generalized moral disapproval, and the objective stance. Analyze paradigmatic examples (e.g., anger at bureaucratic cruelty, disillusionment with a profession’s ethics). Catalogue their key features: target, felt quality, associated normative demands, behavioral expressions. Map where existing Strawsonian categories fail to capture them adequately.
  *   **Month 3-4: Stress-Testing the Strawsonian Framework:** Systematically confront Strawson’s core arguments (especially "Freedom and Resentment") with SDRAs. Can his account of why determinism is irrelevant to the participant stance withstand SDRAs if their target (systems) *is* arguably determined in a way individual agency might not be? Does accommodating SDRAs require expanding the "participant stance" concept, or does it reveal a third category? Test how SDRAs interact with excuses, justifications, and exemptions within the framework.
  *   **Month 5: Contrasting View: Collective Responsibility:** Engage critically with prominent theories of collective responsibility (e.g., Pettit, List, Copp). Do they offer better resources for SDRAs, or do SDRAs reveal limitations in *those* frameworks (e.g., by occurring even without clear collective agency)? Identify points of divergence/convergence with the revised Strawsonian view emerging.
  *   **Month 6: Synthesis & Revision:** Articulate the definite stance: Recognizing SDRAs **sharpens Strawson's compatibilism precisely by forcing a revision of the reactive/objective binary.** Argue for a tripartite structure: individual-reactive, system-reactive, objective. Explain how this revision *strengthens* the core compatibilist insight by showing responsibility practices are even more deeply embedded in diverse normative responses than Strawson saw, further insulating them from purely metaphysical worries about determinism.

  **4. Success vs Failure (~100 words):**
  *   **Success:** Demonstrating conclusively that SDRAs are a distinct, irreducible category of participant attitude within our responsibility practices. Success means delivering a *revised Strawsonian taxonomy* (individual-reactive / system-reactive / objective) that better explains real-world moral phenomenology, resolves the theoretical tension SDRAs create, and thereby *strengthens* the case that responsibility is rooted in our practices in a way determinism doesn't threaten. Real progress is providing a new, productive lens for analyzing structural injustice and institutional accountability within responsibility theory.
  *   **Failure:** The project fails if SDRAs prove readily analyzable *without* revising Strawson’s core binary – either collapsing convincingly into individual attitudes (despite appearances) or falling entirely under the objective stance. Failure also occurs if the revised framework offers no clear advantage over existing alternatives (collective responsibility theories) or becomes too convoluted to be useful.

  **5. Scope and Deliverable (~100 words):**
  Scope: Focused conceptual analysis within Strawsonian moral psychology and responsibility theory. A 6-month fellowship is realistic for deep dive into core texts, case analysis, and developing the revised framework. Will not develop a full theory of collective agency or address applied policy in depth.  
  **Deliverable:** A substantial, polished draft article (approx. 8,000-10,000 words) presenting the revised taxonomy and argument.  
  **Useful Outcome:** Providing responsibility theorists with a refined conceptual toolkit for analyzing attitudes toward systems/institutions, demonstrating how Strawson’s framework can be fruitfully extended (not abandoned), and stimulating new work on the relationship between individual and structural dimensions of moral responsibility.
