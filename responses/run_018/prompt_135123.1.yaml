answer: |-
  ### Conceptual Tension in Grounding: Monism vs. Pluralism and Institutional Facts  
  **Core Tension**: Monism posits a single, universal grounding relation (e.g., Schaffer’s priority monism or Fine’s essentialist grounding), while pluralism (e.g., Wilson, Koslicki) allows multiple, domain-specific grounding relations (physical, normative, social). Institutional facts (e.g., "This paper is legal tender") create tension because they depend on **both**:  
  - **Physical/psychological configurations** (e.g., paper, cognitive states),  
  - **Collective normative acceptance** (e.g., laws, conventions).  

  ---

  ### How Each Theory Handles Institutional Facts  
  **1. Monism’s Challenge**:  
     - **Problem**: If grounding is singular, institutional facts must be grounded in a unified set of facts. But *what*?  
       - Physical facts (e.g., atoms in paper) are insufficient—they lack normativity.  
       - Normative facts (e.g., "We accept this as money") seem circular or non-fundamental.  
     - **Result**: Monism struggles to reconcile the "hybrid" nature of institutional facts. Either:  
       - **Collapse**: Reduce norms to physical/psychological states (undermining normativity), or  
       - **Overdetermination**: Claim both physical and normative facts *jointly* ground institutional facts, risking violation of **irreflexivity** (no self-grounding) and **asymmetry** (if A grounds B, B cannot ground A).  

  **2. Pluralism’s Solution**:  
     - **Domain-Specific Grounding**:  
       - Physical grounding: The paper’s existence depends on microphysical facts.  
       - Normative grounding: "Legal tender" status depends on collective acceptance (e.g., Searle’s *X counts as Y in context C*).  
     - **Avoids Overdetermination**:  
       - No conflict with **irreflexivity/asymmetry** because grounding relations are distinct. Physical grounding operates in the material domain; normative grounding in the social domain.  
       - Example: The *paper’s existence* is physically grounded; its *status as currency* is normatively grounded. These are separate relations, not competing causes.  

  ---

  ### Does Pluralism Collapse Grounding into Causal-Constitutive Explanation?  
  **Risk**: Yes, if grounding relations are conflated with causation (e.g., "beliefs cause money to exist"). But pluralists avert this by:  
  - **Metaphysical vs. Causal**: Grounding is a relation of *ontological dependence*, not temporal causation. Collective acceptance *constitutes* money—it doesn’t cause it.  
  - **Formal Constraints**: Pluralists retain irreflexivity/asymmetry *within each grounding relation*. Physical chains remain asymmetric; normative chains are non-causal.  
  - **Preserved Distinction**: Causal explanations address *how* events unfold; grounding explains *why* facts hold in virtue of others.  

  ---

  ### Layered, Domain-Relative Fundamentality: Assessment  
  **Proposal**: A hierarchical model where:  
  - **Layers**: Physical → Biological → Mental → Social.  
  - **Domain-Relative Fundamentality**: Each layer has its own "fundamental" facts (e.g., social facts are fundamental *to the social layer*).  

  **Advantages**:  
  1. **Autonomy of Social Ontology**:  
     - Social facts (e.g., contracts) depend on but are *irreducible* to psychological/physical facts.  
     - Grounded in collective intentionality (e.g., "We recognize this signature as binding").  
  2. **Avoids Reductionism**:  
     - Legal tender isn’t "just paper" or "just beliefs"—it emerges from normative practices.  

  **Challenges**:  
  1. **Core Motivation for Grounding**:  
     - If each layer is "fundamental" in its domain, **absolute fundamentality** (a single base reality) is lost. Schaffer’s motivation—a unified hierarchy—is sacrificed.  
  2. **Transitivity Threats**:  
     - If social facts ground legal facts, and social facts depend on psychological facts, does transitivity chain to physics? Pluralists block this by restricting transitivity *across* grounding relations.  

  **Verdict**:  
  - **✅ Preserves Autonomy**: Social ontology remains distinct, avoiding physical reduction.  
  - **⚠️ Sacrifices Absolute Fundamentality**: The "core motivation" for a universal dependence relation is weakened. Yet, this trade-off is **necessary** for institutional facts. Pluralism accommodates their hybrid nature without overdetermination or causal collapse, provided grounding relations are rigorously distinguished.  

  **Conclusion**: Pluralism and domain-relative fundamentality successfully resolve tensions in institutional facts, preserving social ontology’s autonomy. The cost—abandoning a single, universal grounding hierarchy—is justified by its explanatory power for layered reality. Monism’s insistence on a unified grounding relation remains philosophically coherent but struggles with the irreducibly normative dimensions of social existence.
