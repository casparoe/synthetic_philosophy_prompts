answer: |-
  ## Private Lexicon (A Sestina for the PLA)

  This ache I seal within the cedar **box**,
  A label scratched in ink: I give it **name**.
  No one can see inside, the space seems **empty**,
  But Monday’s sting insists it’s not the **same**
  As Tuesday’s throb, a subtle inward **drift**.
  How can I know? There is no public **check**.

  I thumb the page, attempt a silent **check**:
  Does *this* sensation match the hidden **box**?
  The feeling shifts, a slow perceptual **drift**.
  I call it ‘pain’ – a fragile, private **name**.
  But Tuesday’s weight... is it the **same**
  As Monday’s sharpness? Or just echoes, **empty**?

  The doubt expands, a hollow, growing **empty**.
  No ruler measures truth, no inner **check**
  Assures me that the word retains the **same**
  Intention locked within that silent **box**.
  Can language bind a thing you cannot **name**
  For others? Meaning starts to softly **drift**.

  The edges blur, the reference starts to **drift**.
  The labelled ‘pain’ feels vague and strangely **empty**,
  A sound I mouth, a failing, fading **name**.
  I strain to fix it with a mental **check**,
  But focus only finds the shut **box** –
  Its hidden thing perhaps not quite the **same**.

  Is yesterday’s deep ache the **same**
  As this dull pressure? Thoughts incessantly **drift**.
  I peer within the dark, imagined **box**.
  Is something there? Or just the thought, **empty**?
  A desperate act, a futile inward **check**:
  I grasp the fading ghost of its old **name**.

  The ink bleeds dry around the chosen **name**.
  The diary entry claims it is the **same**,
  But doubt, a current, pulls the sense to **drift**.
  The cedar walls feel cold and wholly **empty**.
  No standard anchors this internal **check**,
  The word untethered from its captive **box**.

  My mind’s **empty** **box**, the **name** I strain to **check**,
  But meanings **drift**, unmoored. Is anything the **same**?
  The beetle’s gone. Only the *word* remains, adrift.

  ---

  **Commentary on the Form**

  The sestina's demanding rotation of end-words – **box, name, empty, same, drift, check** – perfectly enacts the diarist's struggle for consistent private reference, inevitably failing.

  *   **Box:** Begins as the literal container for sensation (beetle/pain), but shifts towards a symbol of isolation and, ultimately, the *idea* of containment itself, becoming hollow ("cold and wholly empty").
  *   **Name:** Starts as an active act of labelling ("I give it name"), but deteriorates into a fading sound ("a failing, fading name," "the ghost of its old name"), highlighting the impossibility of fixing meaning without public criteria.
  *   **Empty:** Moves from the apparent void within the box ("space seems empty") to the profound emptiness of the linguistic act itself ("labelled 'pain' feels vague and strangely empty"), signifying the absence of referential security.
  *   **Same:** Initially asserts identity ("insists it’s not the same"), but succumbs to doubt ("Is it the same?", "not quite the same"), becoming an unverifiable, almost ironic claim as the poem progresses.
  *   **Drift:** Introduced as subtle change ("a subtle inward drift"), it evolves into the core problem ("Meaning starts to softly drift," "the sense to drift"), embodying the inevitable slippage of private meaning over time.
  *   **Check:** Starts as an attempt at verification ("attempt a silent check," "mental check"), but reveals its futility ("no inner check," "futile inward check"), demonstrating the lack of any criterion for correctness within the private realm.

  The relentless return of these words, forced into new contexts with each stanza, mirrors the diarist's repeated attempts to latch onto the same sensation. However, each recurrence subtly alters the word's weight and association, enacting the very "drift" the diarist fears. The form itself argues what the words cannot: private reference, seeking constancy ("same"), collapses into instability ("drift," "empty") because it lacks the external anchor ("check") necessary to hold meaning in place. The envoi's stark conclusion ("The beetle’s gone. Only the *word* remains, adrift") is the form's inevitable philosophical endpoint.
