prompt: |-
  I'm a master's student in computer science taking a graduate seminar on inverse reinforcement learning and the problem of inferring preferences from observed behavior, and I'm also working part-time in a robotics lab. My job in the lab is to take each new batch of human demonstrations for a manipulation task — someone teleoperating or kinesthetically guiding an arm through, say, setting a table, clearing a cluttered desk, or packing a lunchbox — and hand the lab a reward function that our downstream reinforcement-learning pipeline will optimize. I do this roughly once a week, with twenty to forty demonstrations per task from two or three demonstrators, about a day of my time per batch, no background in cognitive science, and a PI who signs off on the result but mostly wants a documented decision rather than a treatise. The stakes show up downstream: when the learned reward is wrong, the robot doesn't merely fail at the task; it finds ways to satisfy the letter of the objective that none of us intended, and by then the mistake is baked into a trained policy rather than a line of code.

  The course has made me uneasy about how ad hoc my current workflow is. I now know that the same observed behavior can be optimal under many different reward functions, so choosing among them takes auxiliary assumptions; that attributing everything to the reward is a mistake when the demonstrator has a different world model, a short planning horizon, motor noise, or habits; and that the promise of IRL over behavioral cloning is precisely that a recovered objective should transfer to new settings rather than just reproduce the demonstrations. But I don't yet know how to turn those insights into a procedure I can run on a Tuesday. I would like a reusable protocol for each batch of demonstrations: the questions to ask in order, what counts as a sufficient answer before moving on, where the protocol should stop and report that the data underdetermine the reward, and where I should instead go ask a demonstrator a few targeted questions rather than infer more. The protocol should output something like a ranked set of reward hypotheses with a one-paragraph warning label about what each should and shouldn't be trusted for, not a single confident objective, and it should make explicit which steps are real inferences and which are just prior commitments dressed up as inference.

  Could you also run the protocol on two cases so I can see what it produces in practice? The first is a table-setting task in which one demonstrator places glasses far from the edge, moves slowly, and double-checks each placement; I cannot tell whether this person cares about protecting the glassware, has motor tremor or poor depth perception, or is simply cautious. The second is a desk-clearing task in which a demonstrator occasionally knocks small objects over while reaching for larger ones, and my supervisor is fairly confident the correct reward should include a collision penalty. I would particularly like one application to come out against what my supervisor wants to read into the data, if that is what the protocol says, because I need practice defending that kind of refusal. And if I'm misdescribing the task — if "give me a procedure for reward inference" is itself the wrong frame because the hardest parts are one-off modeling decisions rather than a repeatable pipeline — I'd rather hear that plainly than receive a checklist that manufactures false confidence. Where does the procedure refuse to run, and what does it leave to judgment?
reasoning: |-
  We are designing a reusable protocol for inverse reinforcement learning (IRL) applied to human demonstrations. The protocol should be systematic, acknowledge underdetermination, and produce a set of reward hypotheses with caveats. It should also indicate when to stop and ask for more information.

  Protocol Outline:

  1. **Data Collection and Preprocessing**
     - Collect demonstrations (trajectories) and any available metadata (e.g., demonstrator ID, task setup, sensor readings).
     - Preprocess: Align trajectories, remove outliers, segment if necessary.
     - Note: We assume the state and action spaces are defined.

  2. **Behavioral Analysis**
     - Compute descriptive statistics: success rate, task completion time, path smoothness, etc.
     - Identify common patterns and anomalies (e.g., slow movements, double-checks, collisions).

  3. **Hypothesis Generation**
     - Brainstorm a set of potential reward components (e.g., distance to goal, collision penalty, energy efficiency, safety margins).
     - Consider possible cognitive or physical factors (e.g., motor noise, depth perception) that might affect the demonstrations but are not part of the reward.

  4. **Modeling the Demonstrator**
     - **Step 4.1: World Model Consistency Check**  
       - Check if the demonstrator's actions are consistent with the robot's world model. If not, note the discrepancies (e.g., demonstrator might have different dynamics or perception).
     - **Step 4.2: Planning Horizon and Discount Factor**  
       - Estimate the planning horizon: Does the demonstrator seem to plan long-term or myopically? This affects the discount factor in the MDP.
     - **Step 4.3: Noise and Suboptimality**  
       - Assess the level of noise in the demonstrations. If there is high variance, it might indicate motor noise or exploration.

  5. **Reward Inference via IRL**
     - Choose an IRL method (e.g., maximum entropy IRL, Bayesian IRL) that can handle the complexity of the task and the amount of data.
     - Run IRL with a set of candidate reward features (from step 3) and under different modeling assumptions (from step 4).

  6. **Hypothesis Testing and Validation**
     - Test the learned reward functions in simulation on the training task and on variations (transfer tasks).
     - Compare the behavior of the optimized policy with the demonstrations, especially for key aspects (safety, efficiency, etc.).
     - Rank the reward hypotheses by:
          a) Likelihood of the demonstrations (if the IRL method provides it).
          b) Performance on transfer tasks (if possible to simulate).
          c) Robustness to modeling assumptions.

  7. **Reporting and Caveats**
     - For each reward hypothesis, document:
          - The assumed world model, planning horizon, and noise model.
          - The reward function (features and weights).
          - The scenarios in which it performs well and where it fails (based on validation).
          - The key assumptions made and how they might be violated.
     - If the data underdetermines the reward (e.g., multiple hypotheses explain the data equally well), report that and list the competing hypotheses.
     - Where necessary, flag that a particular aspect of the behavior might be due to factors other than reward (e.g., physical limitations) and that the inferred reward might not capture that.

  8. **Decision Points for Human Input**
     - If the behavioral analysis (step 2) shows anomalies that are hard to explain (e.g., slow movements), ask the demonstrator: "Were you intentionally moving slowly to be safe, or was it due to the interface/your physical state?"
     - If the modeling step (4.1) finds inconsistency with the world model, ask: "Did you expect the object to behave differently? If so, how?"
     - If the IRL step (5) produces multiple hypotheses with similar likelihood but different implications (e.g., one has a collision penalty and one does not), ask: "How would you trade off speed against avoiding collisions?"
     - If the validation (step 6) shows that the robot behaves dangerously in a transfer task, ask: "Is this behavior acceptable? If not, what's wrong?"

  9. **Stopping Conditions**
     - Stop and report underdetermination if:
          - Multiple reward functions (with different features) explain the data equally well and they lead to different behaviors in critical situations.
          - The demonstrator's behavior is highly inconsistent (high variance) and cannot be explained by a single reward without a complex noise model that is hard to validate.
     - Stop and ask for more data if:
          - The demonstrations are too few to cover the state space meaningfully.
          - The task is too complex for the given demonstrations (e.g., rare events are not observed).

  Now, let's apply the protocol to the two cases.

  ---

  **Case 1: Table-Setting Task**

  *Demonstrator behavior: Places glasses far from the edge, moves slowly, and double-checks each placement.*

  **Step 1: Data Collection and Preprocessing**
  - We have 20-40 demonstrations from 2-3 demonstrators. We note that one demonstrator shows the described behavior.

  **Step 2: Behavioral Analysis**
  - Statistics: 
      - This demonstrator's average task time is higher than others.
      - The distance from the edge is consistently larger for this demonstrator.
      - Movements are slower and more deliberate.
      - Double-checks: observed as small backward movements after placing.

  **Step 3: Hypothesis Generation**
  - Reward components: 
      - Distance from edge (safety margin).
      - Time penalty (but this demonstrator is slow, so probably not).
      - Accuracy of placement (but double-checks might indicate uncertainty).
  - Non-reward factors:
      - Motor tremor or poor depth perception (physical limitations).
      - Cautious personality (might be captured by a high cost for accidents).

  **Step 4: Modeling the Demonstrator**
  - **4.1: World Model Consistency**: The demonstrator's actions (slow, double-checks) might indicate that they perceive a higher risk of knocking over glasses than the robot's model predicts. Alternatively, they might believe the glasses are more fragile.
  - **4.2: Planning Horizon**: The demonstrator seems to be taking extra care at each step, which might be consistent with a long planning horizon (avoiding catastrophic failure) but also might be due to myopia (focusing only on the current glass).
  - **4.3: Noise and Suboptimality**: The slow movements and double-checks might be compensating for motor noise or perception uncertainty.

  **Step 5: Reward Inference via IRL**
  - We run maximum entropy IRL with features: 
      - Distance to goal (for each item).
      - Distance from the edge of the table (for glasses).
      - Speed (or jerk) of the arm.
      - A binary feature for each glass being placed without incident.
  - We also consider a feature for "safety margin" (distance from edge) and a feature for "time".

  **Step 6: Hypothesis Testing and Validation**
  - We test the learned rewards in simulation:
      - Hypothesis A: The demonstrator has a high weight on safety margin (distance from edge). 
          - Behavior: Robot places glasses far from the edge, even when it takes longer.
      - Hypothesis B: The demonstrator has a high penalty for fast movements (to reduce jerk and avoid accidents). 
          - Behavior: Robot moves slowly and smoothly, but might not necessarily place glasses far from the edge.
      - Hypothesis C: The demonstrator has a high cost for failure (so they double-check) but no explicit safety margin. 
          - Behavior: The robot might place glasses at the edge if it's confident, but if there is uncertainty (due to noise) it might also double-check.

  - Transfer test: We change the table size (smaller table) and add wind (simulating disturbance). 
      - Hypothesis A: Still places glasses far from the edge, even on a small table (which might be impractical). 
      - Hypothesis B: Moves slowly, but might place glasses near the edge if the slow movement is the main factor.
      - Hypothesis C: Without an explicit safety margin, the robot might place glasses near the edge and then knock them over in wind.

  - We find that Hypothesis A and C both explain the data reasonably, but in the wind scenario, Hypothesis A leads to safer outcomes while Hypothesis C leads to failures. However, without knowing if the demonstrator intended the safety margin, we cannot choose definitively.

  **Step 7: Reporting and Caveats**
  - Reward Hypotheses:
      1. High weight on safety margin (distance from edge): 
          - Trust for: Tasks in which avoiding items falling is critical.
          - Do not trust: When table space is constrained (might not generalize well).
          - Assumption: The demonstrator intended to keep glasses away from the edge. But it might be that they were just compensating for poor depth perception.
      2. High penalty for fast movements (energy/jerk):
          - Trust for: Avoiding spills due to jerky motions.
          - Do not trust: If the task requires quick reactions.
          - Assumption: The slowness was intentional and not due to motor limitations.
      3. High cost for failure (with no explicit margin) and a model of uncertainty (leading to double-checks):
          - Trust for: When the robot has accurate uncertainty estimation.
          - Do not trust: If the uncertainty model is wrong.

  - Underdetermination: The data alone cannot distinguish between a true preference for safety margins and a compensatory strategy for poor depth perception. We need to ask the demonstrator.

  **Step 8: Human Input**
  - We ask the demonstrator: "I noticed you placed the glasses further from the edge and moved slowly. Was that because you wanted to be extra safe, or because you found it hard to judge the distance or control the arm precisely?"

  - Possible outcomes:
      - If the demonstrator says: "I didn't want the glasses to fall," then we go with Hypothesis A and increase the weight on safety margin.
      - If they say: "I have trouble seeing the edge," then we note that the safety margin is not a reward component but a result of perception. In that case, we might not include it in the reward, but instead improve the robot's perception or add a safety margin by default.

  **Step 9: Stopping Condition**
  - Because the behavior might be due to either a reward preference or a physical limitation, and without more data or the demonstrator's input, we cannot resolve it. We stop and report the ambiguity.

  ---

  **Case 2: Desk-Clearing Task**

  *Demonstrator behavior: Occasionally knocks small objects over while reaching for larger ones. Supervisor believes in a collision penalty.*

  **Step 1: Data Collection and Preprocessing**
  - We have 20-40 demonstrations. Note that collisions with small objects occur occasionally.

  **Step 2: Behavioral Analysis**
  - Statistics:
      - Collision rate: low but non-zero (e.g., 5% of demonstrations).
      - The collisions happen more often when reaching across the desk for a distant object.

  **Step 3: Hypothesis Generation**
  - Reward components:
      - Task completion (all objects cleared).
      - Time penalty (efficiency).
      - Collision penalty (for each collision).
      - Smoothness of motion (to avoid causing disturbances).
  - Non-reward factors:
      - The demonstrator might not see the small objects (perception issue).
      - The demonstrator might be planning a path that is efficient but occasionally causes collisions due to motor noise.

  **Step 4: Modeling the Demonstrator**
  - **4.1: World Model Consistency**: The demonstrator might not have noticed the small objects (so they are not in their world model) or they might consider them negligible. Alternatively, they might believe that the small objects are not fragile.
  - **4.2: Planning Horizon**: The demonstrator might be focused on the next object (myopic) and not on the overall desk state.
  - **4.3: Noise and Suboptimality**: The collisions might be due to motor noise (imprecise movements) or perceptual limitations.

  **Step 5: Reward Inference via IRL**
  - We run IRL with features: 
      - Number of objects removed (encouraging completion).
      - Time taken.
      - Number of collisions (with small objects).
      - Path length or jerk.

  **Step 6: Hypothesis Testing and Validation**
  - We test two main hypotheses:
      - Hypothesis A (Supervisor's): High collision penalty. 
          - Behavior: The robot avoids collisions, even if it takes longer and takes a circuitous path.
      - Hypothesis B: No collision penalty, but a penalty for time (efficiency). 
          - Behavior: The robot clears the desk quickly, occasionally colliding with small objects.

  - We also consider:
      - Hypothesis C: The demonstrator did not intend to collide, but the collisions are due to noise. In this case, we might model the demonstrator as having a collision penalty but also having motor noise. We might then recover a collision penalty, but it would be smaller than if there were no noise.

  - Transfer test: We change the desk layout to have more small objects in the way.
      - Hypothesis A: The robot avoids all small objects, taking a long time.
      - Hypothesis B: The robot plows through, causing many collisions.
      - Hypothesis C: The robot tries to avoid but occasionally collides (if the noise is modeled).

  - We find:
      - The original demonstrations show occasional collisions. Hypothesis B (no collision penalty) predicts more collisions than observed (unless the noise is low). Hypothesis A (high penalty) predicts zero collisions. The observed behavior (low collisions) is between the two.
      - Hypothesis C (moderate collision penalty with noise) fits the data best.

  **Step 7: Reporting and Caveats**
  - Reward Hypotheses:
      1. Moderate collision penalty (with motor noise modeled): 
          - Trust for: Similar noise levels and object layouts.
          - Do not trust: If the robot's noise level is different (lower or higher) or if the objects are very fragile.
          - Assumption: The collisions were accidental and the demonstrator intended to avoid them.
      2. No collision penalty but high time penalty (efficiency) and with noise leading to occasional collisions:
          - Trust for: When collisions are acceptable and efficiency is key.
          - Do not trust: When collisions are costly.
          - Assumption: The demonstrator did not care about the small objects.

  - Underdetermination: We cannot tell from the data alone whether the collisions were intentional (ignored) or accidental. We need to ask.

  **Step 8: Human Input**
  - We ask the demonstrator: "I noticed that sometimes you knocked over small objects when reaching for larger ones. Was that because you were willing to trade off some collisions for speed, or because you didn't notice them or couldn't avoid them?"

  - Possible outcomes:
      - If the demonstrator says: "I didn't want to knock them over, but sometimes it happened," then we go with Hypothesis C (moderate collision penalty and model noise).
      - If they say: "I didn't care about the small objects," then we might go with Hypothesis B (no penalty) but note that the robot should also not care.

  **Step 9: Stopping Condition**
  - Without knowing the demonstrator's intention about the collisions, the data underdetermines the reward. We stop and report the two hypotheses (B and C) and the need for clarification.

  ---

  **Defending Against Supervisor's Prior (Case 2):**

  Suppose the supervisor is confident in a collision penalty (Hypothesis A). But our analysis shows that a high collision penalty (leading to zero collisions) does not match the data (which had occasional collisions). Moreover, without modeling noise, we cannot distinguish between a moderate penalty with noise and a low penalty without noise.

  We present:
  - The data shows non-zero collisions. A high penalty would have led to zero collisions (if the demonstrator were optimizing perfectly). Therefore, we must have either:
      a) A moderate penalty and motor noise (so the demonstrator tried but failed sometimes).
      b) A low penalty (and the collisions were acceptable).

  - We cannot choose between (a) and (b) without knowing the demonstrator's intention. Therefore, we should not output a high penalty (Hypothesis A) because it overfits to the letter of the data (zero collisions) and does not account for the noise. We instead output two hypotheses (moderate penalty with noise, and low penalty) and recommend asking the demonstrator.

  **Conclusion:**

  The protocol produces a set of reward hypotheses with caveats and explicitly notes when the data is insufficient. It also guides when to ask for human input. It does not manufacture false confidence because it stops when underdetermined. The hardest parts are the modeling decisions (e.g., how to model noise, what features to include) and these are left to the engineer's judgment, but the protocol makes them explicit.

  You should run this protocol for each batch, and over time, you might build a library of common features and modeling choices. The protocol is reusable, but the modeling choices are task-specific and require careful thought.
answer: |-
  Below is a reusable protocol for your reward inference workflow, designed to systematize ambiguity handling, force explicit assumptions, and output risk-aware hypotheses. It's structured as a decision tree with clear stopping conditions, and explicitly labels where judgments occur. Crucially, **it refuses to produce a single "confident" reward** and instead outputs hypotheses with failure modes.

  ---

  ### **Protocol: IRL Inference with Ambiguity Tracking**
  **Input:** Batch of demonstrations + task description  
  **Output:** Ranked reward hypotheses + warning labels, OR flag for underdetermination/human input  
  **Time Budget:** 1 day (adaptable per step)

  #### **Step 1: Behavioral Decomposition (1-2 hrs)**  
  **Goal:** Isolate *what* happened from *why* it happened.  
  **Procedure:**  
  - Quantify key observables:  
    - Success metrics (task completion, object states).  
    - Risk proxies (min distance to hazards, speed, collisions).  
    - "Strange" patterns (repeated checks, pauses, errors).  
  - Cluster by demonstrator ID. Flag inter-demonstrator differences >20%.  
  **Stopping Condition:** If >30% of demos show high-variance outcomes for identical initial states → **STOP. Report underdetermination.** Data insufficient for reliable IRL.  

  #### **Step 2: Hypothesis Generation (1 hr)**  
  **Goal:** Brainstorm reward features *and* non-reward explanations.  
  **Procedure:**  
  - List reward candidates (e.g., `-collision_penalty`, `-time`).  
  - List non-reward factors (e.g., `motor_noise`, `perception_limitations`).  
  - Map each observable from Step 1 to possible causes:  
    | Observable | Reward Hypothesis | Non-Reward Hypothesis |  
    |------------|-------------------|------------------------|  
    | Slow movement | `energy_efficiency` | `motor_tremor` |  
    | Double-checks | `safety_margin` | `depth_perception_error` |  
  **Judgment Call:** You decide which hypotheses are plausible (no cognitive science needed—use task context).  

  #### **Step 3: Test for Cognitive Mismatch (1 hr)**  
  **Goal:** Check if demonstrator’s actions imply different world knowledge.  
  **Procedure:**  
  - Simulate demonstrations in *your* robot’s world model. Identify:  
    - Actions that are irrational in your model but rational in an alternative (e.g., avoiding non-existent obstacles).  
    - Discrepancies in discounting (e.g., sacrificing short-term loss for long-term gain vs. myopia).  
  **Stopping Condition:** If >50% of actions are explainable *only* with a different world model → **STOP. Flag for human input.** Ask demonstrator: *"Did you expect [implied model difference]?"*  

  #### **Step 4: IRL with Multiple Priors (3-4 hrs)**  
  **Goal:** Run IRL under competing assumptions.  
  **Procedure:**  
  - Use MaxEnt IRL or Bayesian IRL with:  
    - **Feature sets:** Each reward hypothesis from Step 2.  
    - **Priors:** Explicit noise models (e.g., motor noise σ=0.1) and discount factors (γ=0.9 vs. γ=0.99).  
  - Output:  
    - Top 3 reward functions *per prior*.  
    - Log-likelihood of demos under each combination.  
  **Stopping Condition:** If top hypotheses have Δlog-likelihood < 0.1 → **Ambiguity warning.** Proceed to Step 5.  

  #### **Step 5: Transfer Stress-Testing (2-3 hrs)**  
  **Goal:** Break hypotheses in novel scenarios.  
  **Procedure:**  
  - Simulate policies from Step 4 in:  
    - **Adversarial perturbations:** E.g., add wind, slippery objects.  
    - **Distribution shifts:** E.g., larger table, new obstacle layouts.  
  - Rank rewards by:  
    - **Rank 1:** Low failure rate in perturbations.  
    - **Rank 2:** Matching "spirit" of demos (even if behaviors differ).  
    - **Rank 3:** Catastrophic failures (e.g., legalistic reward hacks).  
  **Output Format:**  
  ```  
  Hypothesis 1: R = w₁·collision_penalty + w₂·task_completion  
  - Trust when: Low clutter, low wind.  
  - Failures: In high clutter, robot freezes to avoid collisions.  
  - Assumptions: Motor noise ignored; demonstrator’s γ=0.95.  
  - Inference Strength: Weak (Δlog-like < 0.1 vs. Hypothesis 2).  
  ```  

  #### **Step 6: Resolve Ambiguity (1 hr)**  
  **Goal:** Decide between reporting or seeking human input.  
  **Procedure:**  
  - If all hypotheses share >80% failure modes → **Report all with warning.**  
  - If top hypotheses fail *differently* in critical ways (e.g., unsafe vs. inefficient) → **STOP. Request human input.** Ask *1 question per hypothesis*:  
    - *"Should the robot risk [failure mode A] to avoid [failure mode B]?"*  
  **Judgment Call:** You decide what’s "critical" (e.g., safety > efficiency).  

  ---

  ### **Case Applications**

  #### **Case 1: Table-Setting (Slow, Careful Demonstrator)**  
  **Step 1:**  
  - Observables: Glasses 20cm from edge (vs. 5cm in others), 2x avg. time, 100% success.  
  **Step 2:**  
  | Observable | Reward Hypothesis | Non-Reward Hypothesis |  
  |------------|-------------------|------------------------|  
  | Far placement | `-distance_to_edge` | `depth_perception_error` |  
  | Slow speed | `-jerk` | `motor_tremor` |  
  | Double-checks | `-uncertainty` | `habit` |  
  **Step 3:** No world-model mismatch (actions rational under safety).  
  **Step 4:** IRL outputs:  
  - H1: High weight on `-distance_to_edge` (log-like: -10.2)  
  - H2: High weight on `-jerk` (log-like: -10.3)  
  - H3: Mix of `-jerk` + `-uncertainty` (log-like: -10.9)  
  **Step 5:** Stress tests:  
  - H1: Robot places glasses too far on small tables → wastes space.  
  - H2: Robot moves smoothly but places near edge → 2/10 glasses fall in wind.  
  - H3: Robot pauses often → 3x slower but zero breakage.  
  **Step 6:** Ambiguity (Δlog-like < 0.1 between H1/H2). **Stop and ask demonstrator:**  
  - *"When placing glasses, did you prioritize avoiding edge accidents (H1) or smooth motion (H2)?"*  
  **Output:**  
  ```  
  ## Table-Setting Hypotheses  
  **H1 (Safety-Margin):** R = -10·distance_to_edge -1·time  
  - Trust: Large tables, no time pressure.  
  - Failures: On small tables, inefficient placements.  
  - Assumptions: No motor tremor (pure preference).  
  - Strength: Ambiguous (ask demonstrator to confirm).  

  **H2 (Smooth-Operator):** R = -5·jerk² -0.5·time  
  - Trust: Stable environments.  
  - Failures: Wind/edges cause breakage.  
  - Assumptions: Double-checks due to caution, not uncertainty.  
  ```  
  *Your defense to PI:* "The data equally supports safety-first or smooth-motion rewards. We need disambiguation because they fail differently under perturbation."  

  ---

  #### **Case 2: Desk-Clearing (Occasional Collisions)**  
  **Supervisor’s Prior:** Include collision penalty.  
  **Step 1:**  
  - Observables: 5% demos knock small objects; collisions when reaching over clutter.  
  **Step 2:**  
  | Observable | Reward Hypothesis | Non-Reward Hypothesis |  
  |------------|-------------------|------------------------|  
  | Collisions | `-collision_penalty` | `motor_noise` or `object_occlusion` |  
  **Step 3:** No world-model mismatch (collisions likely accidental).  
  **Step 4:** IRL with/without collision penalty:  
  - H1 (Supervisor): `R = -10·collision -1·time` (log-like: -7.2)  
  - H2: `R = -1·time` (log-like: -7.8)  
  - H3: `R = -10·collision` *with motor noise* (log-like: -7.3)  
  **Step 5:** Stress tests:  
  - H1: Robot avoids collisions → 20% slower in clutter; *never* knocks items.  
  - H2: Fast but 15% collision rate; matches demo behavior.  
  - H3: Matches demo collision rate but requires noise tuning.  
  **Step 6:** H1 has better log-like, but H2/H3 match collisions *observed*. **Crucially:** In high-density simulations, H1 causes timeout failures (robot won’t push through *any* clutter).  
  **Output:**  
  ```  
  ## Desk-Clearing Hypotheses  
  **H1 (Collision-Averse):** R = -10·collision -1·time  
  - Trust: When collisions are catastrophic.  
  - Failures: In dense clutter, robot times out.  
  - Assumptions: Collisions are always bad (never accidental).  
  - Strength: Strong IRL fit but may overfit to letter of demos.  

  **H2 (Time-Optimal):** R = -1·time  
  - Trust: Speed-critical tasks, robust clutter.  
  - Failures: High breakage with fragile objects.  
  - Assumptions: Collisions are noise, not intent.  

  **H3 (Noise-Aware):** R = -10·collision (with motor noise σ=0.2)  
  - Trust: If robot has similar noise.  
  - Failures: If noise model is wrong.  
  ```  
  *Your defense to supervisor:* "Including collision penalty (H1) makes the robot safe but *fragile*—it fails in new clutter scenarios the demonstrator handled. H2 matches the *observed* behavior better. Since collisions were rare and likely accidental, I recommend H2 with a safety watchdog, not baking collision penalty into the reward."  

  ---

  ### **Where the Protocol Refuses & Requires Judgment**  
  1. **Refuses to run:**  
     - Step 1 stops if high variance in demos → "Data underdetermines reward."  
     - Step 3 stops if world-model mismatch → "Ask demonstrator about expectations."  
     - Step 6 stops if critical failure modes diverge → "Get human tradeoff input."  

  2. **Judgment calls left to you:**  
     - Which non-reward hypotheses are plausible (Step 2).  
     - What constitutes a "critical" failure (Step 5).  
     - Which stress tests to run (Step 5).  

  3. **False confidence safeguards:**  
     - Always outputs multiple hypotheses.  
     - Labels assumptions as *external* (not inferred).  
     - Uses transfer tests to expose reward hacking.  

  ### **When This Frame Fails**  
  If your tasks involve **one-off complexities** (e.g., inferring social norms in human-robot collaboration), the protocol still structures ambiguity but can't automate modeling. Focus shifts to:  
  - **Step 2++:** Spend more time brainstorming non-standard reward features (e.g., "proximity to human" vs. "eye contact").  
  - **Step 5++:** Test in more radical perturbations (e.g., unexpected human interruptions).  
  - **Step 6:** Default to human input earlier.  

  This protocol makes your priors explicit, forces ambiguity to the surface, and defends against overconfident rewards—without requiring cognitive science expertise. Use it as a living template; adapt time budgets per step as you learn what works for your lab's tasks.
