  The user is asking several important questions: Is their analysis of the stalemate correct? Are there still unresolved empirical questions underneath? Does the ratchet point invalidate the original question? And what would actually count as progress in this debate?

  This is clearly someone who's thought deeply about this for years. They're not looking for citations or reading lists - they want conceptual clarity. The challenge is to help them see why their debate keeps looping without dismissing either position.

  I should acknowledge how perceptive their analysis is while suggesting that the stalemate comes from trying to answer an impossible question with incompatible frameworks. The "disaster" framing may be flawed from the start because it imposes modern concepts like choice and mistake on a process that was neither chosen nor avoidable at the individual level.

