  Looking at their positions: The friend takes Jared Diamond's view that farming worsened individual lives but spread because it supported larger populations. The user leans toward Marshall Sahlins' idea that foraging was affluent and the transition represented a decline in quality of life. They even identified a third point about inequality not necessarily arriving with farming.

