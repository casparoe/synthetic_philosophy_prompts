answer: |-
  Here is the exam question, model answer, and marking scheme as requested:

  ### (1) Exam Question (90-minute essay)
  **"Singer's Drowning Child Argument and the Structure of Sacrifice: Scalability vs. Thresholds Under Risk"**

  > Peter Singer's drowning child analogy argues that physical proximity is irrelevant to our duty to rescue those in dire need, and that comparable financial sacrifices demanded in distant cases (e.g., aiding victims of famine) are equally obligatory. This is often framed through a *scalar* model: obligation strength scales continuously with the cost/effort required (e.g., a $5,000 obligation is simply a stronger instance of a $100 one). However, some philosophers suggest rescue duties might instead have a *binary, threshold-like* structure: they activate fully at a specific cost/risk point but collapse entirely beyond that point, rather than tapering continuously.

  > Critically evaluate this distinction. First, identify where Singer's framework *assumes* continuous scalability. Second, apply this distinction to a modified drowning case: saving the child requires an intervention with only a **60% success probability** (e.g., tossing a life-ring from a distance in rough seas). Analyze whether the intuition that "we must try to save the nearby child" survives when modelled as an *expected-value decision under risk*. Finally, argue whether this probabilistic case ultimately **undermines or reinforces Singer's claim of continuous scalability**, using one concrete counterexample to defend your chosen model (scalar or binary). Your answer should demonstrate why standard Effective Altruist conclusions about distant aid are insufficient here.

  ### (2) Model Answer (689 words)

  Singer's drowning child analogy powerfully challenges moral parochialism by asserting that physical distance cannot diminish the obligation to prevent severe harm when the cost is modest. Crucially, Singer's argument relies on an implicit assumption of **continuous scalability**: the moral force of a rescue obligation increases or decreases smoothly in proportion to the cost/effort required, akin to a linear function. When he argues that the duty to save a distant child by donating $100 is equivalent to ruining a $100 suit to save a nearby child, and then extends this reasoning to suggest donating $5,000 for a more expensive intervention is merely "a greater sacrifice," he presupposes a single, scalable duty metric where only the magnitude of the cost changes the *degree* of obligation, not its fundamental nature or existence. This continuity is the engine driving his radical conclusion about global poverty obligations.

  The introduction of significant risk (60% success rate) fundamentally disrupts the simplicity of Singer's analogy and tests this scalability assumption. In the original deterministic case, spending $100 (or ruining a suit) guarantees saving a life. The obligation feels absolute. In the probabilistic variant, spending the same $100 (or effort) now yields only a 0.6 probability of saving the child, implying an expected value of 0.6 lives saved. Applying Singer's scalar model strictly suggests our obligation scales linearly with this expected value. Thus, if we were obligated to spend $100 for a guaranteed save (1.0 EV), we should be obligated to spend *up to* $166.67 for the risky intervention (since $166.67 * 0.6 = $100 equivalent EV). The intuition that "we must try" seems to persist, but it becomes conditional and quantified – we must act *if* the cost is sufficiently low relative to the expected benefit.

  However, this probabilistic case reveals a tension that **undermines Singer's continuous scalability model** and suggests a **binary threshold structure** is more descriptively accurate. While many agree we *must* attempt the rescue despite the 60% chance (especially at low cost), the *intensity* of the perceived obligation doesn't feel merely 60% as strong as the guaranteed case. The duty feels like it activates *fully* at the point of encounter with the child's plight and the availability of a non-exorbitant, non-frivolous intervention – even one with significant risk. We feel compelled to toss the life-ring; not tossing feels like a profound moral failure. Yet, if the cost escalates dramatically (e.g., $10,000 to rent a specialized rescue helicopter with the same 60% success rate), the obligation doesn't feel merely "10,000/100 = 100 times stronger but scaled down to 60%." Instead, for many, the obligation seems to *collapse entirely* beyond a subjectively perceived threshold of "reasonable cost" or "excessive burden," regardless of the expected value calculation. We might feel regret, but not blameworthiness, for not bankrupting ourselves for a 60% chance.

  This supports a binary threshold model: the duty activates categorically when the cost/risk falls below a threshold (e.g., "moderate sacrifice"), demanding action. Beyond that threshold, the duty disappears, even if the expected value ratio remains technically "favorable" compared to smaller, guaranteed cases. A concrete counterexample illustrating the absurdity of infinite scalability is the **"Unlimited Liability" problem**. Suppose saving a life costs $X with 100% certainty, obligating donation $X. Singer's scalar model implies that saving 1 life with 0.01% certainty (EV = 0.0001 lives) for $X obligates the same donation, as the cost/expected-life-saved ratio is identical ($X/1 vs $X/0.0001). This leads to the conclusion that one is obligated to spend $X *every time* there's a 0.01% chance of saving a life, effectively demanding infinite total expenditure for negligible expected impact. This is untenable. A binary model avoids this by requiring a sufficiently high probability of significant success *combined* with low cost to trigger the duty. The risky drowning child (60%, low cost) likely clears the threshold; donating $X for a 0.01% chance does not, despite identical EV ratios.

  Therefore, the probabilistic case reinforces the critique of Singer's continuous scalability. The persistence of the "must try" intuition under moderate risk/low cost aligns with a threshold activating the *full* duty, while the counterexample of vanishing obligations under very high costs or minuscule probabilities demonstrates that duties do not scale linearly. They collapse when burdens become excessive or chances of success become too speculative, suggesting a fundamentally binary structure for rescue duties. Singer's framework underestimates the role of thresholds defined by contextually reasonable sacrifice and non-negligible likelihood of success.

  ### (3) Marking Scheme (25 points total)

  *   **A Range (21-25 points):** Demonstrates all three core moves *plus* a well-defended position on scalability vs. threshold.
      *   **Explicitly identifies Singer's continuity assumption (Scalability):** (5 pts) Clearly explains how Singer assumes obligation strength scales linearly/smoothly with cost/difficulty, using textual implication (e.g., $100 vs $5000 as differences in degree, not kind).
      *   **Sophisticated Analysis of Probabilistic Case (60% success):** (7 pts) Accurately calculates expected value. Examines whether the "must save" intuition persists under risk. Insightfully explores the *nature* of the persisting obligation (e.g., is it weaker, conditional, or still categorical?). Connects this directly to the scalability vs. threshold question.
      *   **Defended Position & Counterexample:** (8 pts) Takes a clear stance (Scalar or Threshold). Provides one concrete, relevant counterexample (e.g., Unlimited Liability for scalar absurdity; sudden collapse of obligation at high cost for threshold) and effectively uses it to support the chosen model and critique the alternative. Explicitly states whether risk undermines or reinforces Singer's scalability claim.
      *   **Clarity & Structure:** (Up to 5 pts) Logical flow, precise terminology, academic writing. (Integrated into the above)
  *   **B Range (16-20 points):** Accurate summary of Singer's core argument (drowning child, proximity, cost analogy) and standard EA implications, but fails to fully engage the *structural critique*.
      *   May mention cost but doesn't isolate/analyze the *continuity assumption*.
      *   Treats the probabilistic case superficially (e.g., mentions risk but doesn't analyze expected value or its implications for obligation structure).
      *   Lacks a clear, defended position on scalability vs. threshold, or provides only a weak/unconvincing counterexample.
      *   Reverts to discussing standard Singer/EA conclusions without the required structural twist.
  *   **C Range (11-15 points):** Significant misunderstandings of Singer's core argument or the prompt. Superficial treatment of cost or risk. Fails to address scalability/threshold distinction meaningfully.
  *   **D Range (6-10 points):** Major errors, incomplete, or off-topic.
  *   **F Range (0-5 points):** Wholly inadequate or irrelevant.

  **Critical Conceptual Error (-5 points):** **Confusing Risk-Weighted Expected Value Calculation with Linear Obligation Scaling.** Award 0/5 for the "Analysis of Probabilistic Case" component if a student:
  *   Correctly calculates the expected value (e.g., $100 cost for 0.6 EV lives saved) BUT THEN...
  *   Incorrectly assumes this *directly implies* the obligation itself scales linearly *only* with the expected value (e.g., "Since EV is 0.6, our obligation is only 60% as strong"). This misses the core question: *Does the duty feel like a weaker version of the full obligation, or does it feel like the full duty is triggered regardless?* It conflates the calculation of expected *outcome* with the structure of the perceived moral *demand*. A student making this error might argue the probabilistic case *automatically* supports Singer's scalability because obligation strength now "scales with EV," demonstrating a fundamental misunderstanding of the prompt's thrust.
