prompt: |-
  Is there a name for this pattern? A few times now I've watched a city try to make its justice system gentler, and the gentle thing ends up catching more people than the harsh thing did. Concrete cases: (1) a county sets up a diversion program so low-level drug offenders can avoid jail, but once diversion exists, prosecutors start charging cases they used to quietly drop, and people who take the deal end up with a year of check-ins, drug tests and court dates that a guilty plea never would've involved; (2) a city replaces cash bail with ankle monitors to shrink the jail population, and jail numbers do fall, but the monitors go on people who previously would've just been released with a court date, and now a dead battery or a missed charger counts as a violation that can land them in jail anyway; (3) body cameras get introduced to protect civilians from the police, and a few years later the footage is mostly being used as prosecution evidence against civilians.

  In each case the reform did the thing it promised -- fewer people in cages, more oversight -- and yet the total number of people the system touches went up, not down. It doesn't feel like ordinary mission creep, because the stated mission didn't really change; the net just got wider at the same time as it got softer. I've seen people on the abolish side of the reform/defund/abolish argument gesture at this to argue that certain reforms actually grow the thing they're trying to shrink, but I've never seen the phenomenon itself cleanly named or picked apart from nearby failure modes.

  So: is there an established term for exactly this? If there is, tell me how it's usually defined and where its edges are. Does it still count if the reform expands the population but genuinely reduces harm per person? Does it count if the expansion was the quiet plan all along, versus an accident? Does it require criminal justice specifically, or is the justice system just one instance of something broader? And if there's no single established term, coin one and define it carefully against mission creep, displacement (where enforcement just moves elsewhere), and plain policy failure. I'd also like a sentence or two on what the existence of this pattern does and doesn't imply for the reform-vs-abolish debate, since both sides seem to think it settles things in their favor.

  Please put the final name (established or coined) in \answer{...} on the very last line so I can extract it automatically.
reasoning: |-
  We are looking for a pattern where a reform intended to make a system gentler or less punitive ends up expanding the system's reach, capturing more people than before, even as it reduces the harshness per individual. The examples given are:
   1. Diversion program for low-level drug offenders: Prosecutors now charge cases they would have dropped, and participants face longer supervision than a guilty plea would have involved.
   2. Replacement of cash bail with ankle monitors: Monitors are applied to people who would have been released without conditions, and technical violations (like dead battery) lead to jail.
   3. Body cameras: Introduced for police accountability, but footage is primarily used as evidence against civilians.

   Key features:
   - The reform achieves its immediate goal (e.g., fewer people in jail, more oversight).
   - However, the system's net widens: more people are now under some form of control (e.g., diversion program, ankle monitor, being recorded and used as evidence).
   - The harm per person might be less (e.g., not in jail, but under supervision) but the total number of people under the system increases.

   This pattern is not exactly mission creep (which typically involves a gradual shift in objectives) because the stated mission remains the same. Instead, it's about the system becoming more efficient at capturing people by being less harsh, thereby lowering the threshold for inclusion.

   In criminal justice reform circles, this phenomenon is sometimes called **Net Widening** or **Widening the Net**. This term is established in criminology and sociology.

   Definition of Net Widening:
   - It occurs when a new program or policy, intended as an alternative to a more severe measure (like incarceration), ends up being applied to individuals who would not have been subject to the severe measure in the first place. Thus, the overall number of people under state control increases.

   Edges and nuances:
   1. **Harm Reduction per person**: The pattern can still be net widening even if the harm per person is reduced. The defining feature is the expansion of the population under control. However, if the harm per person is reduced so much that the total harm is less, it might be considered a success in harm reduction but a failure in terms of reducing the scope of the system. But note: in the examples, the total harm might actually increase because more people are now under control (even if each is less harmed) and because of the potential for technical violations leading to more severe penalties.

   2. **Intent**: It doesn't matter if the expansion was the quiet plan or an accident. Net widening can occur without conscious intent, as an unintended consequence. However, it can also be a deliberate strategy to extend control (sometimes called "net strengthening").

   3. **Domain**: The term originated in criminal justice (e.g., alternatives to incarceration) but can apply to other systems. For example, in social welfare, a program intended to help the most vulnerable might expand to include people who are less needy, thereby stretching resources and potentially creating dependency.

   Difference from related concepts:
   - **Mission Creep**: This is when an organization gradually expands its mission beyond its original goals. In net widening, the mission (e.g., provide an alternative to incarceration) remains, but the program is applied to a broader group.
   - **Displacement**: This often refers to shifting enforcement from one area to another (e.g., cracking down on drug sales in one neighborhood moves them to another). Net widening doesn't necessarily shift the location but increases the overall number of people under control.
   - **Policy Failure**: This is a broad term. Net widening is a specific type of policy failure where the unintended consequence is an expansion of the system.

   For the reform-vs-abolish debate:
   - Reform advocates might argue that net widening is a fixable problem (e.g., by setting strict eligibility criteria to ensure only those who would have been incarcerated are diverted) and that the reduction in harm per person is still valuable.
   - Abolitionists might argue that net widening is inherent to reform efforts because the system is designed to expand and control, and therefore, only dismantling the system can prevent such expansions.

   However, the existence of net widening does not necessarily settle the debate in favor of either side. It shows that reforms without careful safeguards can backfire by expanding the system. But it also doesn't prove that all reforms are doomed. Some reforms might avoid net widening with proper design.

   Coined term if not established: Since "net widening" is established, we can use that.

   Final Answer:
   \answer{Net Widening}
answer: |-
  The pattern you describe—where reforms intended to reduce the punitiveness or scope of a system inadvertently expand its reach by capturing more individuals under less severe but broader controls—is a recognized phenomenon in criminology and policy studies. The established term for this is **net widening** (or the "net-widening effect").  

  ### Definition and Key Features of Net Widening  
  **Net widening** occurs when an alternative intervention (e.g., diversion programs, electronic monitoring, or community-based sanctions), designed to replace a harsher measure (e.g., incarceration, cash bail, or aggressive policing), ends up being applied to individuals who would previously have faced no intervention at all. This expands the overall population under state control, despite reducing harm on a per-person basis. Key elements include:  
  - **Expansion of control**: The reform lowers the threshold for entry into the system, making it easier or more appealing to impose sanctions.  
  - **Softening of penalties**: The new measure is less severe than the original (e.g., ankle monitors vs. jail), fulfilling the reform’s goal.  
  - **Unintended consequences**: The system’s reach grows because actors (e.g., prosecutors, judges) use the "gentler" option in cases they once ignored or dismissed.  

  ### Edges and Nuances  
  1. **Harm reduction per person**: Net widening still applies even if individual harm decreases (e.g., avoiding jail). The focus is on the *systemic expansion* of control, not individual outcomes.  
  2. **Intent**: It qualifies regardless of whether expansion was accidental (e.g., due to bureaucratic incentives) or covertly intended (e.g., "net strengthening" to enhance surveillance).  
  3. **Domain specificity**: While prominent in criminal justice, net widening manifests in other systems (e.g., mental health diversion expanding outpatient coercion; welfare programs creating new eligibility categories that increase bureaucracy).  

  ### Distinguishing from Related Concepts  
  - **Mission creep**: Involves gradual goal-shifting (e.g., body cameras evolving from accountability tools to evidence-gathering). Net widening maintains the original goal but broadens the target population.  
  - **Displacement**: Relocates enforcement (e.g., policing moving from parks to streets), whereas net widening increases the absolute number under control.  
  - **Policy failure**: A broad category; net widening is a specific subtype where reform backfires by growing the system.  

  ### Implications for Reform vs. Abolish Debates  
  - **Reform perspective**: Net widening highlights implementation risks (e.g., poor eligibility rules) but doesn’t negate reform’s value. It suggests reforms require safeguards (e.g., strict criteria limiting diversion to those who would otherwise face incarceration).  
  - **Abolition perspective**: It demonstrates how reforms can reinforce carceral logic by making systems more efficient and palatable, thus legitimizing expansion. Abolitionists argue this necessitates dismantling systems entirely.  
  **Crucially, net widening doesn’t inherently settle the debate**: It reveals structural incentives for system growth but doesn’t prove all reforms are doomed—only that they risk perpetuation without radical constraints.  

  ### Coined Refinement (if needed)  
  While "net widening" is established, a precise variant for justice contexts could be **carceral diffusion**—emphasizing how carceral control disperses and multiplies through "softer" mechanisms. However, **net widening** remains the canonical term.  

  \answer{Net Widening}
