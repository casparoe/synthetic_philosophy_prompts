prompt: |-
  Specify the full adequacy conditions for an updateless decision theory—one that rejects conditioning on observations as the engine of rational choice in one-shot or embedded-agent settings—so that a reader can evaluate any candidate before seeing its formal machinery. List the desiderata with the motivating case behind each: (1) canonical puzzles the theory must dissolve, such as Newcomb’s problem, the smoking lesion, and prisoner's dilemma with perfect copies, identifying for each the feature that belief-updating fails to capture; (2) distinctions it must preserve—causal influence versus logical correlation versus evidential relevance, and the difference between an agent’s actual execution and counterfactual instantiations in other possible worlds; (3) consistency conditions it must satisfy, including that it not collapse into ordinary Bayesian updating in embedded contexts, yet still permit bounded agents to approximate rational behavior; and (4) a less-discussed constraint you should treat as non-negotiable: the theory must handle “logical-indexical coupling,” where an agent’s logical uncertainty about its own source code interacts with physical observations without being resolved by standard conditioning, as when the agent knows identical copies run in causally isolated branches but receives only one sensory stream. For each item, explain why it is required and flag any pair of desiderata you suspect are jointly unsatisfiable, especially any tension between preserving causal independence and honoring logical correlation across copies. Then, very briefly, score causal decision theory, evidential decision theory, and the updateless/functional approach against your list. Keep the response under 400 words; a table is acceptable only if it improves clarity. Do not provide bibliographies, reading lists, or citations to specific texts.
