answer: |-
  Here are the adequacy conditions for an updateless decision theory (UDT), structured as requested:

  **1. Canonical Puzzles & Why Updating Fails:**
      *   **Newcomb's Problem:** Must one-box. Belief-updating fails because conditioning on choosing one-box makes Omega's prediction *look* accurate, but doesn't *cause* the money to be in the box. UDT cares about the *output* of its decision function across possibilities, not just the observed action.
      *   **Smoking Lesion:** Must smoke. Belief-updating fails because conditioning on not smoking makes the lesion *look* unlikely, but smoking doesn't *cause* the lesion. UDT uses its prior state of knowledge (including lesion risk) *before* "seeing" the choice.
      *   **PD with Perfect Copies:** Must cooperate. Belief-updating fails because conditioning on cooperation makes the other's cooperation *look* likely (logical correlation), but doesn't *cause* it. UDT selects the policy (cooperate/defect) that maximizes expected utility *across* all instances running the same source code, knowing its copy does the same.

  **2. Critical Distinctions:**
      *   **Causal Influence vs. Logical Correlation vs. Evidential Relevance:** Must distinguish interventions (causal) from logical connections (e.g., identical code) and Bayesian evidence. Crucial for handling copies without assuming spooky action at a distance (No Magical Causation).
      *   **Actual Execution vs. Counterfactual Instantiations:** Must reason about outcomes in worlds where its algorithm outputs different actions (counterfactuals), even though it only experiences one actual execution. This enables policy selection.

  **3. Consistency & Practicality:**
      *   **Embedded Non-Collapse:** Must not reduce to Bayesian updating in embedded scenarios (e.g., within simulations, with copies). The agent doesn't condition on being in a specific instance.
      *   **Bounded Approximation:** Must define a computationally tractable notion of bounded rationality approximating the ideal UDT agent. Real agents need implementable heuristics.
      *   **Logical-Indexical Coupling:** Must handle uncertainty about *which* instance it is (indexical uncertainty) coupled with logical uncertainty about its own code/inputs, *without* resolving this via standard conditioning on observations. Sensory data updates *within* a world-model branch but doesn't collapse the uncertainty about being a specific copy in a multiverse of identical agents. *(Non-Negotiable Constraint)*

  **Potential Tension:** Desiderata 2a ("No Magical Causation") and 3c ("Cross-Copy Coordination") are in tension. Coordination requires factoring in logical correlation across causally isolated copies, which feels non-causal. A satisfactory UDT must resolve this without implying physical causation between copies.

  **Scoring Existing Theories (Brief):**

  | Theory      | Canonical Puzzles | Distinctions Preserved? | Consistency & Constraints? | Logical-Indexical Coupling? |
  | :---------- | :---------------- | :--------------------- | :------------------------- | :-------------------------- |
  | **CDT**     | Fails Newcomb (two-boxes), Fails PD (defects) | Strong on Causal, Weak on Logical | Collapses to updating; Fails constraint | No (treats copies as distinct agents) |
  | **EDT**     | Fails Smoking Lesion (abstains) | Strong on Evidential, Weak on Causal | Collapses to updating; Fails constraint | No (conditions on action locally) |
  | **UDT/FDT** | Passes all        | Explicitly models all  | Designed for non-collapse; Approximation active research | Explicitly designed for this |

  **Key Tensions:** The core tension is between causal independence (physical branches don't affect each other) and logical correlation (identical code implies identical outputs). UDT resolves this by optimizing the *function* (which determines outputs in all branches) *before* indexical uncertainty is resolved, using logical prior probabilities over world-models and its possible positions within them. Bounded approximation remains a significant practical challenge.
