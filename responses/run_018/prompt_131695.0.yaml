  ### Decomposed Terms  
  1. **Prior for hierarchical predictive processing (PP) as correct general framework for affect**  
     - **Probability: 0.80**  
     - *Justification*: PP has strong empirical support in neuroscience for sensorimotor/cognitive processes, but its extension to *all* affective phenomena remains contested.  

  2. **Normative content embedded in interoceptive-predictive dynamics (not post-hoc)**  
     - **Probability: 0.75**  
     - *Justification*: Neurodevelopmental data (e.g., Damasio-inspired somatic marker hypothesis) suggest normativity scaffolds predictive learning, but disentangling embedded vs. appended content is empirically thorny.  

  3. **Moral emotions uniquely involve normative encoding (vs. non-moral affect)**  
     - **Probability: 0.55**  
     - *Justification*: Moral emotions show distinct neural correlates (e.g., anterior cingulate in guilt), but boundary issues (e.g., disgust as moral/non-moral) weaken structural distinctiveness claims.  

  4. **Pure theories (judgment/perceptual/feeling) collectively fail to explain data**  
     - **Probability: 0.85**  
     - *Justification*: Phenomenology (e.g., shame’s visceral immediacy with cognitive depth) and functional data (e.g., rapid social reorientation in indignation) strain all pure accounts.  

  ### Combination Rule  
  I use a **multiplicative-geometric hybrid approach**:  
  - First, multiply terms (i)–(iv) as independent priors:  
    \( 0.80 \times 0.75 \times 0.55 \times 0.85 = 0.2805 \)  
  - Since these are *interdependent* (e.g., (iv) partially depends on (i)–(iii)), I take the geometric mean to correct for overlap:  
    \( \sqrt[4]{0.2805} \approx 0.73 \)  
  - Finally, I apply a conservative **-0.10 penalty** for unaddressed challenges (e.g., computational vagueness in "normative salience weights"), yielding:  
    \( 0.73 - 0.10 = 0.63 \)  

  ### Least Confident Term & Sensitivity  
  - **Term (iii): Moral emotion distinctiveness (P = 0.55)** is least robust.  
