answer: |-
  ### (1) Patterned Principles vs. Historical Entitlement  
  Patterned principles of justice (e.g., equality, need, merit) require constant state intervention to maintain a specific distribution of resources. Nozick argues this is fundamentally incompatible with individual liberty. Any free exchange or gift disrupts the pattern; enforcing it demands restricting voluntary actions *after* they occur, effectively voiding the moral validity of agreements. Justice, for Nozick, is inherently historical and procedural: holdings are just if acquired originally via just means (e.g., laboring on unowned resources) and transferred justly (voluntary exchange/gift). The focus is not on the *outcome* (e.g., inequality) but on the *process*: were rights respected? Continuous redistribution to preserve a pattern violates self-ownership by treating individuals as resources for social engineering, not as ends in themselves entitled to control their justly acquired assets.

  ### (2) Wilt Chamberlain & Voluntary Transfer  
  The Chamberlain case demonstrates that entirely voluntary exchanges *can* legitimately generate severe inequality. If Chamberlain freely contracts with fans to watch him play, each fan voluntarily transfers a small portion of their holdings (e.g., 25 cents) to him. The resulting concentration of wealth in Chamberlain’s hands is just because it stems from millions of individual, rights-respecting choices. Critically, the transfer itself *transforms* the justice of the new distribution. Objecting to the inequality post-transfer requires objecting to the fans' freedom to spend their money as they wish. Thus, no patterned principle (like equality) can override the moral force of consent. The process sanctifies the outcome, however unequal, provided initial holdings were just and coercion absent.

  ### (3) Algorithmically Mediated Patronage Economies  
  Modern creator platforms (e.g., YouTube, Patreon) intensify the Chamberlain dynamic but complicate "initial holdings." Creators’ earnings depend on voluntary micropayments or subscriptions from users. However, the "initial holdings" enabling exchange include not just a creator’s labor/talent but algorithmically amplified visibility and inherited network effects (e.g., follower counts, platform biases). These advantages are often unearned in the Nozickian sense – arising from luck, platform design, or prior user choices benefiting others. While payments remain voluntary, the *opportunity* to attract them is unequally distributed by non-contractual, opaque systems. This challenges whether creators’ resulting wealth stems purely from just transfers, or whether the initial distribution of *attention* – a key modern resource – violates acquisition justice, potentially demanding rectification.

  ### (4) Implication for State Redistribution  
  The strongest implication is a radical constraint on state redistribution. Only violations of the entitlement principles themselves justify intervention: rectifying past injustice in acquisition (e.g., theft, fraud) or transfer (e.g., coercion). Redistribution to achieve equality, minimize poverty, or reward desert is illegitimate, as it expropriates justly held property absent any rights violation by the owner. The state becomes a "night-watchman," protecting rights but not reshaping outcomes. Even severe inequality from voluntary exchanges is morally unassailable. The core limit is that the state cannot tax earnings derived from just processes to serve patterned ends without violating self-ownership; its only economic role is ensuring procedural justice in holdings and correcting historical wrongs, not engineering social outcomes.
