  Where is the error?

  Option 1: Reject step (1). But step (1) is a common requirement for normative theories. If we reject it, we allow that a theory can be complete without giving an answer in every fully specified case. This might be acceptable, but then we must accept that in some cases (like the Pasadena game) there is no rational answer? That seems to conflict with the idea of a complete normative theory.

  Option 2: Reject step (2). Are probabilities and utilities "fully specified"? The game defines probabilities and utilities for every outcome. However, the problem is that the expectation (the sum) is conditionally convergent. So step (2) is true.

