  Thus, we can avoid the dilemma by:

  - For the Pasadena game: use the natural ordering to compute the expectation. Then EUT gives a definite answer.

  - For real-world decisions: since they are finite (or bounded) there is no problem of conditional convergence.

  But what about step (5)? It claims that real-world decisions have "precisely the same formal manner". However, if they are truncated, they are not the same. Even if we model with a power-law distribution that has undefined moments (like the Cauchy distribution), in practice we truncate the distribution. For example, in finance, we don't consider losses beyond the total wealth of the world. So the moments become defined.

