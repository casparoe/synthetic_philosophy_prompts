  We are presented with a paradox in decision theory concerning the Pasadena game and its implications for real-world decisions. The argument concludes that either scientific rationality rests on an arbitrary choice (lacking justification) or the additivity axiom of expected utility is false (which would collapse expected utility theory). The goal is to find which step is flawed and what the cost of rejecting it is.

