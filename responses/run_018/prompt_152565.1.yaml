  *Key Metric:* **Euphemism Layering Index (ELI)** – Gold standard in museum placards.  
  *Infrastructure Notes:* Ministry-certified museums master “multi-perspective” displays. Hiroshima’s Peace Memorial focuses tightly on victimhood (yours), while Yasukuni’s adjacent Yūshūkan Museum offers “context-rich valorization modules.” Comfort women references undergo proprietary omission filtration. The result? A frictionless experience where discomfort dissolves into hazy national aesthetics.  
  *Tourist Tip:* Master the “polite non-see.” At Shinjuku’s Military Archives, appreciate the elegant negative space where Unit 731 exhibits *aren’t*. For Yasukuni visits, carry cherry blossom imagery – useful deflection during international incident flare-ups.  
  *Commerce Angle:* High marks in **Denial-to-Diplomacy Buffering**. Textbook revision kits for educators, “Reconciliation Lantern” ceremonies (atmospheric, low-commitment).

