  ## Opening Remarks: The Luminous Challenge of Elena Voss

  Friends, colleagues, students, family – thank you for gathering to honour the life and enduring work of Dr. Elena Voss. For three decades, Elena stood as a unique beacon in the philosophy of mind, not by adding to the clutter of theories about consciousness, but by carefully, relentlessly, clearing away what she saw as a fundamental obstruction: the concept of *qualia*.

  To honour Elena today is not merely to remember her brilliance, though it shone fiercely. It is to engage with her central, challenging insight – an insight that shaped collaborations across disciplines and continues to reshape how we think about our own minds. Her core claim was startling in its simplicity and profound in its implications: **Consciousness is undeniably real, but the way we often talk about it – particularly through the lens of "qualia" – traps us in deep conceptual confusion.**

  So, what are "qualia"? In philosophy, they’re often described as the raw, subjective *feels* of experience: the intrinsic redness of red, the sharp sting of pain, the peculiar sweetness of honey on the tongue. They’re presented as private properties, known only from the inside, defining "what it is like" to be *me* right now. This seems intuitive, almost undeniable. Yet, Elena argued, this very intuition leads us into a labyrinth of incoherence.

  Her critique wasn’t that experiences like seeing red or feeling pain aren’t real. She emphatically rejected the idea that consciousness is an *illusion*. What she challenged was the *structure* of the concept we use – "qualia" – to point at that reality. She saw it as fatally flawed, collapsing under its own contradictions, a concept ripe for "quining" – for showing it cannot coherently do the work we ask of it.

  **Where, Elena asked, does this incoherence lie?** She identified two deep tensions at the heart of the qualia concept:

  1.  **The Privacy Paradox:** Qualia are supposed to be utterly private, accessible only to the individual subject. *My* red is mine alone. Yet, constantly, we compare our experiences. We agree the fire engine is red, we discuss the nuances of a shared wine, we empathize with another's pain. If qualia are truly private and incomparable, how is this possible? The concept demands they be locked away, yet our lives are built on shared understanding. The moment we try to bridge the gap between "my" qualia and "yours," the concept fractures. Asking "what is it like to be you?" in the *qualia* sense, Elena argued, subtly presupposes these private properties *can* be compared or described across individuals – a fundamental category error, like asking for the color of a number or the weight of a thought. It smuggles in intersubjectivity where the concept itself declares it impossible.

  2.  **The Causation Conundrum:** Qualia are often presented as causally inert epiphenomena – ghostly properties floating atop the physical brain, doing no real work. Yet, simultaneously, we rely on them constantly to explain *why* we behave as we do. Why do I pull my hand from the flame? Because the pain *hurts*. Why do I savor the chocolate? Because it tastes *delicious*. The qualia seem indispensable for explaining behaviour. But how can something causally inert be indispensable? If qualia truly have no causal power in the physical world, then invoking them to explain why I scream or reach for more is empty. The concept asks us to treat these phenomenal properties as both irrelevant to the causal chain and absolutely central to understanding it – another unsustainable contradiction.

  **Why does this matter?** Why wrestle with these seemingly abstract tensions? Elena believed this mattered profoundly, both for rigorous science and for our most human moments.

  *   **For Science (especially Neuroscience):** Chasing "neural correlates of qualia" – the exact brain state for *this* specific, private, intrinsic feel – risks becoming a wild goose chase if the target itself is incoherent. Elena’s work clears vital space for an *interdisciplinary* science of consciousness that doesn't require us to reify these problematic private objects. We can rigorously study the neural mechanisms of vision, pain, emotion – the complex processes that *constitute* seeing red or feeling joy – without needing to isolate a non-physical "redness-quale" or "joy-quale." We can study how these processes enable discrimination, learning, reportability, empathy, and rich behavioural repertoires – the real, observable manifestations of consciousness – without getting entangled in the metaphysical knot of private properties. Her view doesn’t *reduce* consciousness to mere neural correlation; it refocuses us on understanding the complex *patterns* and *capacities* that conscious organisms exhibit.
  *   **For Remembrance & Shared Life:** Think of how we remember Elena today. We don’t try to access some private, inner glow she supposedly possessed. We recall her fierce intellect in debate, her wry smile, the specific way she’d lean forward when making a crucial point, the passion in her voice discussing a student’s work, the texture of her laughter. We remember her *engagements*, her *responses*, her *expressions*, her *impact on the world and on us*. These are public, observable, intersubjective facts. To remember her through the lens of inaccessible qualia would be strangely isolating, even alienating. Elena’s view reminds us that the richness of our shared human experience – our grief, our love, our understanding of each other – resides not in comparing private inner theatres, but in our shared world, our shared language, our shared behaviours, our embodied interactions. The "what it is like" is woven into the fabric of *how we are together* in the world, not locked away inside.

  Elena’s legacy, then, is a profound challenge and a liberating clarity. She asked us to relinquish a seductive but ultimately incoherent concept, not to diminish the wonder of consciousness, but to see it more clearly, more rigorously, and more *shareably*. She cleared the underbrush so we could better see the forest – the complex, real phenomenon of conscious life unfolding in a physical and social world.

  Honouring Elena Voss today means embracing this intellectual courage. It means honouring a thinker who dared to tell us that one of our most familiar, intimate concepts – the feeling of our own inner lives – doesn’t survive careful scrutiny *as we usually frame it*. That takes a rare kind of honesty and a deep love for truth. It means continuing her work: studying consciousness with scientific vigour, free of conceptual dead ends, and embracing the shared, public reality of our experiences with one another – including our shared experience of remembering, celebrating, and profoundly missing her.

  Thank you. Let the colloquium begin.
