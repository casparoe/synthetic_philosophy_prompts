  There's also a methodological issue with Allison's historical cases. By focusing only on conflicts between rising and established powers, he ignores numerous peaceful power transitions, creating a selection bias. Thucydides himself emphasized human nature as the constant factor, but the trap framing overemphasizes structural determinism.

