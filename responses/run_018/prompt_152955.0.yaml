prompt: |-
  Right, I've been trying to get my head round this old essay by Montaigne — 'Of Cannibals', I think — and now my mate's asked me to mark his homework answer on it. I'm a bit rusty on this stuff, so I need you to be straight with me.

  The exam question was: Montaigne compares cannibal societies with European ones and seems to defend the cannibals. Explain his actual position on whether they're 'better' than Europeans, and say whether he's putting forward cultural relativism as a proper philosophy or just using them to make a point about us.

  Here's what he wrote: Montaigne argues that cannibals are acutally more civilised than Europeans because they don't torture people for relegion like we do in the wars. He says they live naturally without artifice or false religion, and he thinks this proves all cultures are equally valid — there's no right or wrong, just different customs. He also mentions he spoke to some cannibals who came to France and noticed they weren't surprised by our customs, which shows they understand that morality is relative. He concludes we should stop judging other cultures and accept that cannibalism is just as good as European table manners.

  Can you grade this for me? Give it a mark out of 100 and tell me exactly what's right and what's wrong, point by point. Don't sit on the fence — tell me if it's a pass or a fail and why, and don't just say 'it's partly right'. I want a proper assessment with specific comments justifying the score. Thanks.
reasoning: |-
  Okay, the user is asking me to grade their friend's homework on Montaigne's "Of Cannibals." They want a strict assessment with a numerical score and clear feedback. Let me recall the essay's key points first.

  Montaigne uses the Tupinambá people of Brazil to critique European society, not to claim superiority of either culture. The student's answer claims cannibals are "more civilised" because they don't torture for religion. That's partially right—Montaigne does contrast indigenous warfare (ritualistic, quick killing) with European religious wars (prolonged torture), but he doesn't assert hierarchical superiority. The student misses that this is a critique of Europe, not endorsement of cannibalism.

  The cultural relativism part is problematic. The student says Montaigne argues "all cultures are equally valid" and "no right or wrong." Actually, Montaigne avoids absolute relativism. He judges European torture as worse than ritual cannibalism based on universal ethics (cruelty scale), showing he believes in some objective moral standards. The cannibal visitors' lack of surprise reflects curiosity, not relativism—Montaigne explicitly states they condemned European inequality.

  Major errors: The conclusion that "cannibalism is just as good as table manners" distorts Montaigne's intent. He never endorses cannibalism; he uses it to expose European hypocrisy. The student overlooks the essay's primary purpose: a mirror for European self-critique via defamiliarization ("barbarian" label reversal).

  For grading: The answer correctly identifies the religion-torture contrast (+), the "natural living" theme (+), and the interview anecdote (+). But it misrepresents Montaigne's non-hierarchical stance (–), absolutizes relativism (–), ignores the universal ethics framework (–), and botches the conclusion's intent (–). The factual accuracy is there but interpretation is skewed toward oversimplified relativism, missing the essay's nuance.

  Score rationale: 45/100. Barely passing because core facts are present, but fundamental misreading of philosophy and purpose. Feedback should stress that Montaigne weaponizes cultural comparison for critique, not equivalence—and that rejecting Eurocentric superiority ≠ endorsing all practices.
answer: |-
  Here's your no-nonsense assessment of your mate's homework. I'll break it down point by point with a clear verdict:

  **Overall Grade: 45/100 (Fail)**

  **Verdict:** **Fail.** While the answer correctly identifies *some* surface-level points and elements of Montaigne's argument, it fundamentally misrepresents his central position, misinterprets his use of relativism, and draws an incorrect, overly simplistic conclusion. It demonstrates a lack of understanding of the essay's complexity, nuance, and primary purpose.

  **Specific Feedback (Point by Point):**

  1.  **"Montaigne argues that cannibals are actually more civilised than Europeans..."**
      *   **What's Wrong:** This is a critical **oversimplification and misrepresentation**. Montaigne **does not** straightforwardly argue that the Tupinambá (cannibals) are *superior* or "more civilised." Instead, he uses them as a **critical mirror** to expose the **hypocrisy and barbarity** he sees in contemporary European society (especially during the religious wars). His point is **relational and comparative**: *in specific aspects* (like warfare practices), their actions appear *less barbarous* than European actions. He never advocates for cannibalism as a superior system.
      *   **What's Partially Right:** He does strongly imply that in terms of cruelty and hypocrisy, European practices (like torture during religious wars) are *worse* than the ritualistic warfare and cannibalism of the Tupinambá. He challenges the automatic European assumption of superiority.

  2.  **"...because they don't torture people for religion like we do in the wars."**
      *   **What's Right:** **This is accurate.** Montaigne explicitly contrasts the Tupinambá's practice of killing enemies quickly in battle and eating them (which he frames within their cultural context of vengeance and valor) with the prolonged, sadistic tortures inflicted by Europeans on fellow Christians during the Wars of Religion. He states: "I think there is more barbarity in eating a man alive than in eating him dead; and in tearing by tortures and the rack a body still full of feeling... than in roasting and eating him after he is dead." This is a core part of his critique.

  3.  **"He says they live naturally without artifice or false religion..."**
      *   **What's Right:** **This is accurate.** Montaigne admires their perceived closeness to a "state of nature," describing their society as governed by natural laws and simple virtues (courage, loyalty), free from the complex artifice, social stratification, greed, and (in his view) corruptions of European "civilization." He contrasts their "natural" virtues with the "artificial" vices of Europe.

  4.  **"...and he thinks this proves all cultures are equally valid — there's no right or wrong, just different customs."**
      *   **What's Wrong:** **This is a major misinterpretation and the answer's biggest flaw.** Montaigne does **NOT** argue for this kind of **absolute cultural relativism** (where all practices are equally valid and morality is purely custom-dependent).
      *   **What's Right/What He Actually Does:** He **uses** cultural comparison powerfully to:
          *   **Critique European Hypocrisy:** He shows Europeans calling others "barbarians" while committing acts far worse *by their own claimed standards*. "Barbarian" is relative ("each man calls barbarism whatever is not his own practice").
          *   **Challenge Ethnocentrism:** He argues we should not judge others solely by our own customs and need to understand practices within *their* context.
          *   **Suggest Universal Human Nature:** Underneath the cultural differences, he implies a shared human nature. His admiration for their "natural" virtues suggests he believes in *some* universal standards (courage, fidelity) – he just finds Europeans often fall short of them.
          *   **Employ Skeptical Relativism (as a tool):** He uses the *idea* of relativism to shake European certainty and provoke self-reflection, **not** to establish it as a "proper philosophy" denying all objective moral judgment. He clearly *judges* European torture as worse than Tupinambá practices, based on a scale of cruelty and hypocrisy, implying a non-relative standard.

  5.  **"He also mentions he spoke to some cannibals who came to France and noticed they weren't surprised by our customs, which shows they understand that morality is relative."**
      *   **What's Right:** **He did speak to Tupinambá visitors and mentions their lack of surprise.**
      *   **What's Wrong:** **His interpretation of their reaction is incorrect.** Montaigne explicitly states the visitors **were** shocked and critical! They were astonished that:
          *   Poor, hungry people didn't simply seize food from the rich ("men full and crammed with all sorts of good things, and... others, beggars at their doors, emaciated with hunger and poverty").
          *   Strong, well-armed men obeyed a child king (Henry III).
          *   Some men ("the half of you") had to work constantly to support the other idle half (the rich/nobility). They found European inequality and submission baffling and unjust. Montaigne uses this **not** to show *their* relativism, but to demonstrate the **relativity of European assumptions** and to show that *their* perspective judged *European* society harshly. It underscores his critique of Europe.

  6.  **"He concludes we should stop judging other cultures and accept that cannibalism is just as good as European table manners."**
      *   **What's Wrong:** **This is catastrophically wrong and reveals a complete misunderstanding.**
          *   Montaigne **does not conclude** that cannibalism is "just as good" as European manners. He never endorses cannibalism.
          *   His conclusion is a **skeptical warning against hasty, ethnocentric judgment.** "We may well call these people barbarians... but not... in respect to ourselves." We are potentially worse.
          *   His primary goal is **not** to make us accept cannibalism, but to **make Europeans question their own "civilization," hypocrisy, and cruelty** by holding up a mirror using the Tupinambá. He uses the shock value of cannibalism to expose the barbarity Europeans take for granted. The essay's target is European self-satisfaction, not a defense of cannibalism as morally equivalent.

  **Justification for Score (45/100):**

  *   **Credit (Approx 25 points):** Correctly identifies key *elements*: the torture comparison (Point 2), the "natural living" vs. "artifice" contrast (Point 3), the mention of speaking to Tupinambá visitors (part of Point 5).
  *   **Significant Deductions (Approx 55 points):**
      *   **Fatal Misinterpretation of Relativism (Point 4):** Turning Montaigne into an absolute cultural relativist is a profound error that distorts the entire essay's purpose.
      *   **Misreading the Conclusion (Point 6):** Claiming he endorses cannibalism as equivalent is completely antithetical to his argument and purpose.
      *   **Misrepresenting the Visitors' Reaction (Point 5):** Missing their critical judgment of Europe undermines Montaigne's point.
      *   **Oversimplifying the "Civilised" Argument (Point 1):** Framing it as a simple superiority claim misses the nuanced, critical mirroring Montaigne employs.
      *   **Failure to Grasp Primary Purpose:** The answer misses that the essay is primarily a **critique of Europe** using the Tupinambá as a tool for *defamiliarization* and challenging ethnocentrism, *not* a defense of cannibalism or an assertion of indigenous superiority/equivalence.
  *   **Result:** While demonstrating *some* factual knowledge, the core arguments, philosophical stance, and ultimate purpose of Montaigne's essay are seriously misrepresented. The answer fundamentally fails to engage with the essay's critical complexity and its use of comparison as a tool for self-examination rather than relativist equivalence.

  **Bottom Line:** Your mate needs to reread the essay carefully, paying particular attention to Montaigne's *tone* (ironic, skeptical), his *target* (European hypocrisy/barbarity), and how he uses the Tupinambá *specifically* to achieve that critique. They've confused Montaigne's powerful challenge to ethnocentrism with a much simpler (and incorrect) doctrine of absolute cultural relativism and moral equivalence.
