prompt: |-
  Hey, I'm an ethics review officer at a mid-size international development NGO, and lately my team keeps recieveing partnership proposals that force us to bend our human-rights framework to match local customary values. I was arguing about this with a colleague last week — she said moral conflicts are usually zero-sum, but I think sometimes they're more like trade: each side gives up something they value less to gain something they value more, so both come out ahead. The catch is that people often pretend a core commitment is just instrumental so they can trade it away, which is corruption wearing a compromise costume. There's also this problem of whether values even have exchange rates, or if we're just fooling ourselves.

  Anyway, I need a reusable decision proceedure — an ordered checklist with specific questions, what counts as a sufficient answer, where it stops with a hard no, where it hands the call to a human because it's pure values not facts, and honest flags for where it'll misfire or disguise a judgment call as a rule. It should be something staff with no philosophy background can run in about thirty minutes. Then apply it to three cases: first, letting a local council require gender-segregated community meetings in exchange for guaranteed girls school access; second, accepting a local restorative justice practice that uses material compensation but skips any verbal apology for accidental harm; and third, allowing a religious leader to restrict family-planning counseling to married couples only in exchange for free clinic space — I want this to be the case where the proceedure spits out an answer I'll probably hate. Write it in American English, don't include any bibliography or citation list since our field staff won't have library access, and put a one-sentence summary as the very last line.
reasoning: |-
  Okay, the user is an ethics review officer at an NGO dealing with proposals that challenge their human-rights framework. They need a practical decision procedure that staff can use in 30 minutes without philosophy background. 

  First, I need to understand the core tension here: balancing universal human rights with local cultural practices. The user mentioned their colleague sees moral conflicts as zero-sum, while they view them as potential trades. But they're wary of "compromise" masking corruption. The key is creating a checklist that prevents value-trading from becoming value-betrayal.

  Hmm, the user explicitly wants three things: 
  - A reusable procedure with clear stop/go gates
  - Honest flags about where judgment calls hide
  - Application to three test cases (including one "hate answer" scenario)

  The procedure must be bulletproof against staff rationalizing away core principles. I should build in:
  - Early filters for non-negotiable rights (Phase 1)
  - Distinctions between instrumental vs core values (Phase 2)
  - Transparency about uncertainty (Phase 3)

  For the cases... that third one (restricting family planning) will likely trigger the "hard no" - perfect for their requested "hate answer". The apology case might land in "human judgment" zone, and gender segregation could go either way depending on mitigation measures.

  Biggest challenge is making philosophical concepts actionable. Need to replace terms like "deontology" with questions like "Does this erase protection for vulnerable groups?" Also must avoid false precision - hence the "uncertainty triggers" section.

  The summary line must encapsulate the whole approach... maybe something about refusing trades that hollow out core protections? Yes, that ties back to their corruption concern.
answer: |-
  Here's a reusable decision procedure ("Ethical Compass Check") designed for speed and practicality, followed by application to your three cases:

  **Ethical Compass Check (v1.0)**
  *(Run sequentially - stop if any step returns a "No")*

  **Phase 1: The Non-Negotiables (5 mins)**
  1.  **Core Rights Violation?** "Does this proposal require us to *actively participate in, endorse, or materially enable* a practice that violates our explicitly stated, non-derogable core rights principles (e.g., torture, slavery, apartheid, systematic discrimination based on immutable characteristics)?"  
      *   **Sufficient Answer:** Clear 'No'. Requires documented alignment with NGO's core rights charter.  
      *   **Stop/Hard No:** If 'Yes'. No trade possible. Flag: "CORE RIGHTS BREACH".
  2.  **Undue Coercion/Exclusion?** "Does this proposal exploit extreme vulnerability, involve direct threats/intimidation, or *permanently exclude* a protected group from essential benefits/services we provide?"  
      *   **Sufficient Answer:** Clear 'No'. Requires analysis of power dynamics and access barriers.  
      *   **Stop/Hard No:** If 'Yes'. Flag: "EXPLOITATION/EXCLUSION".
  3.  **Direct Harm Enablement?** "Would our *specific action* (signing agreement, providing funds, logistical support) be the direct, necessary enabler of *imminent, severe physical or psychological harm* to an individual or identifiable group?"  
      *   **Sufficient Answer:** Clear 'No'. Requires causal link assessment.  
      *   **Stop/Hard No:** If 'Yes'. Flag: "DIRECT HARM ENABLEMENT".

  **Phase 2: The Trade-Off Scrutiny (15 mins)**
  4.  **Values vs. Instruments:** "Is the thing we're being asked to 'bend' on a *core value* (fundamental belief about human dignity/equality) or an *instrumental approach* (a preferred method for achieving that value)?"  
      *   **Sufficient Answer:** Requires explicit identification (e.g., "Girls' education access" is core value; "Co-ed meetings" is instrumental approach to empowerment).  
      *   **Human Judgment Call:** Determining core vs. instrumental - heavily context-dependent. Flag: "CORE/INSTRUMENTAL AMBIGUITY".
  5.  **Genuine Gain Assessment:** "Is the benefit gained *concrete, significant, likely achievable, and demonstrably advances a core right* we prioritize? Does it outweigh the compromise *in terms of impact on rights holders*?"  
      *   **Sufficient Answer:** Evidence-based (data, local context) showing tangible, measurable gain for vulnerable groups directly linked to core rights.  
      *   **Human Judgment Call:** Weighing disparate impacts/values. Flag: "VALUE EXCHANGE UNCERTAINTY".  
      *   **Stop/Strong No:** If benefit is vague, unlikely, trivial, or doesn't clearly advance core rights.
  6.  **Compromise Scope & Mitigation:** "Is the compromise *limited in scope, duration, and reversibility*? Can we implement concrete, verifiable measures to *mitigate negative impacts* and *protect dissenters/vulnerable individuals* within the compromised framework?"  
      *   **Sufficient Answer:** Specific, actionable mitigation plan with monitoring indicators. Compromise must be bounded (e.g., pilot, sunset clause).  
      *   **Human Judgment Call:** Assessing feasibility/effectiveness of mitigation. Flag: "MITIGATION RISK".
  7.  **Hidden Costs & Slippery Slope:** "Does accepting this set a precedent that could *erode our core framework* elsewhere? Are there hidden costs (reputational, trust erosion with communities/partners/donors) that outweigh the stated benefit?"  
      *   **Sufficient Answer:** Analysis of precedent risk and stakeholder mapping.  
      *   **Human Judgment Call:** Predicting precedent impact and hidden costs. Flag: "PRECEDENT/REPUTATIONAL RISK".

  **Phase 3: Decision & Transparency (10 mins)**
  8.  **Stakeholder Voice:** "Have we made a *good faith effort* to understand the perspectives of those *most directly impacted*, especially potentially marginalized voices within the community? Can we represent their views credibly?"  
      *   **Sufficient Answer:** Documentation of consultation efforts/limitations.  
      *   **Human Judgment Call:** Assessing adequacy of consultation. Flag: "VOICE GAP".
  9.  **Alternatives Exhausted?** "Have all *feasible alternatives* to achieve the benefit *without the compromise* been genuinely explored and exhausted?"  
      *   **Sufficient Answer:** Documentation of alternative approaches considered/rejected & reasons.  
      *   **Stop/Reject:** If credible, lower-compromise alternatives exist and haven't been tried. Flag: "ALTERNATIVE NEGLECT".
  10. **Transparency Mandate:** "Can we *publicly document the compromise, the rationale, and the mitigation plan* internally and to relevant stakeholders (without causing undue harm)?"  
      *   **Sufficient Answer:** Clear 'Yes' with documentation plan.  
      *   **Stop/Strong No:** If compromise *requires* secrecy about our core values. Flag: "TRANSPARENCY FAILURE".
  11. **Final Check:** "Does proceeding feel like upholding our mission through difficult pragmatism, or does it feel like *corrosion of our ethical core*?" (Gut-check based on Phases 1-10).  
      *   **Human Judgment Call:** Ultimate integration of analysis. Flag: "MORAL RESIDUE".

  **Output:** Proceed (With Mitigation Plan) / Reject / Escalate (for complex judgment calls flagged in Phases 2/3).

  **Uncertainty Triggers (Where the procedure disguises judgment):** Flags marked above (Core/Instrumental Ambiguity, Value Exchange Uncertainty, Mitigation Risk, Precedent Risk, Voice Gap, Moral Residue) explicitly indicate where rules end and difficult value judgments begin.

  ---

  **Application to Cases:**

  **Case 1: Gender-Segregated Meetings for Girls' School Access**
  *   **Phase 1:** (1) No core violation (segregation ≠ apartheid/systemic denial of education). (2) No *undue* coercion/exclusion? (Access gained). (3) No direct harm enablement? (Segregation itself is harm, but not *severe/imminent* physical harm in this context? Passes Phase 1 barely. **Flag: DIRECT HARM? (Psychological/Social) - AMBIGUITY**.
  *   **Phase 2:** (4) Core Value: Girls' Education. Compromise: Co-ed meetings (Instrumental approach to empowerment/participation). (5) Gain: Concrete (guaranteed access), Significant, Advances Core Right. Compromise: Limits participation model. **Value Exchange Uncertainty** - Is the instrumental loss worth the core gain? (6) Scope: Meetings only. Mitigation: Ensure equal quality/resources/voice *within* segregated meetings; parallel advocacy; sunset clause. Feasible? **Mitigation Risk**. (7) Precedent: Significant risk for other programs. Hidden cost: Undermines gender equality messaging. **Precedent/Reputational Risk**.
  *   **Phase 3:** (8) **Voice Gap** likely (Did girls/women want this trade-off?). (9) Alternatives? (Parallel girl-only programs? Advocacy with council?). (10) Transparency possible? (11) **Moral Residue** likely (Feels like endorsing discrimination).
  *   **Output:** **Reject or Escalate**. High risk of Precedent, Value Exchange Uncertainty, Moral Residue. Alternatives likely not exhausted (9). Mitigation (6) difficult to ensure true equality. *If* proceeded (highly conditional), requires ironclad mitigation, sunset clause, documented alternatives exhausted, and clear internal/external justification.

  **Case 2: Restorative Justice (Material Comp, No Verbal Apology)**
  *   **Phase 1:** (1) No core violation. (2) No coercion/exclusion. (3) No direct harm enablement. Passes.
  *   **Phase 2:** (4) Core Value: Justice/Reparation for harm. Compromise: Method (verbal apology vs. material). Instrumental. (5) Gain: Local buy-in, potentially faster/broader conflict resolution, cultural respect. Compromise: Loss of verbal acknowledgment/accountability. **Value Exchange Uncertainty** (Is verbal apology core or instrumental here? Context matters). (6) Scope: Specific practice. Mitigation: Ensure process is truly voluntary/consensual; ensure material comp is fair; document acceptance by harmed party; complement with advocacy on communication/accountability over time. Feasible? **Mitigation Risk** (low/med). (7) Precedent: Moderate (might normalize skipping apology elsewhere). Hidden cost: Less focus on perpetrator accountability.
  *   **Phase 3:** (8) **Voice Gap?** (Consult harmed parties on adequacy of resolution?). (9) Alternatives? (Push for apology + comp? Unlikely). (10) Transparency possible.
  *   **Output:** **Likely Proceed (with Mitigation)**. Compromise is largely instrumental (4). Mitigation (6) is feasible (monitor consent and fairness). Value Exchange (5) leans positive if verbal apology isn't deemed *core* to justice in this specific cultural context (Human Judgment). Flagged uncertainties manageable with monitoring.

  **Case 3: Family Planning Restricted to Married, Free Clinic Space**
  *   **Phase 1:** (1) **CORE RIGHTS BREACH?** Systematic discrimination based on marital status (an often immutable or highly protected characteristic) regarding essential health services. Denying access based *solely* on marital status is discriminatory. **HARD NO at Step 1**.
      *   *Why it's a Hard No:* It requires the NGO to *actively participate* in denying a core service (sexual/reproductive health information/care) to a specific group (unmarried individuals) based on a discriminatory criterion, directly violating principles of non-discrimination and health rights. No trade justifies this.
  *   **Output:** **HARD NO.** Procedure stops at Phase 1, Step 1. Flag: "CORE RIGHTS BREACH - DISCRIMINATION". (This is the answer you'll probably hate, as it forces walking away from the clinic space benefit due to the non-negotiable condition).

  **Final Summary:** Reject compromises demanding participation in core rights violations or severe discrimination, scrutinize trades involving instrumental approaches with robust mitigation, and transparently acknowledge where uncertainty requires difficult human judgment.
