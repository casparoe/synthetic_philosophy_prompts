  First, I need to break down the possible meanings of the slogan. The user mentioned epistemic, ontological, axiological, and performative dimensions. Starting with epistemic: this argues we lack the knowledge to compare suffering accurately. But is this trivial or defensible? While perfect comparison is impossible, we can still make rough ordinal rankings. So it's defensible but doesn't block all comparison.

