prompt: |-
  I cover science and ideas for a general-interest magazine, and I keep ending up at philosophy conferences where the same fight breaks out, basically unchanged since the early 90s: the fight over Richard Rorty. On one side you've got people who say his antirepresentationalism -- the idea that we should drop the picture of language as mirroring the world and treat vocabularies as tools for coping instead -- collapses into a view where the only thing you can say about why one belief beats another is that your peers happen to accept it. On the other side, Rortians who say the critics keep smuggling back the very notion of corresponding to reality that Rorty spent whole books arguing doesn't do any explanitory work, and that he answered the relativism charge a thousand times: he never denied there's a mind-independent world, he denied that the world tells us which vocabulary to describe it in.

  What bugs me, as someone who's now watched this loop three times in person: both sides are smart, both have read everything, and the exchange always has the same shape. Critic says but then you can't claim science gets closer to the truth. Rortian says I can say everything you say, just re-described in my vocabulary. Critic says that's exactly the problem. Repeat forever.

  So what kind of disagreement is this, actually? A hidden dispute about what a philosophical theory of truth is even supposed to do? A verbal fight over the word true that both sides would abandon if they tabooed it? Or bedrock intuitions about whether the question how do we know we're getting it right deserves a philosophical answer rather than a sociological one, where neither side can argue for its own starting point? Diagnose it using the actual moves each side makes -- not a survey of pragmatism -- and tell me what would count as progress: a distinction nobody's drawn yet, or an argument that the honest move is to just stop having this debate.
reasoning: |-
  Okay, the user is a science and ideas journalist who keeps encountering the same philosophical debate about Richard Rorty at conferences. They describe two entrenched sides: critics who think Rorty's antirepresentationalism leads to relativism, and Rortians who argue critics smuggle in outdated correspondence theories. The user observes this loop repeating endlessly with identical moves and wants to understand the nature of this disagreement and what could break the stalemate.

  Hmm. First, I need to map the core moves accurately. The critic's pattern is: 1) Assert that abandoning representation means losing "getting closer to truth" in science 2) Claim this reduces justification to peer agreement 3) Frame this as disastrous relativism. The Rortian counter-moves are: 1) Insist they're not denying reality, just rejecting correspondence as explanatory 2) Offer to translate all "truth-talk" into pragmatic terms 3) Accuse critics of circularly presupposing the very framework being questioned.

  This feels like more than just semantic quibbling over "truth." The user's observation about identical exchanges suggests deeper fault lines. Let me identify three fundamental divergences:

  First, there's a clash about philosophical job descriptions. Critics seem to want epistemology to ground our practices externally - to answer "how do we know we're getting it right?" with something beyond social practice. Rortians see that demand as the original sin - the craving for non-human validation that creates pseudo-problems. This is irreconcilable because it's a meta-dispute about philosophy's purpose.

  Second, they're talking past each other on "relativism." The critic means "no normative constraints beyond current consensus," while the Rortian means "we have all the normative constraints we ever actually use in inquiry." The Rortian isn't denying norms, just resituating them in human practices. But the critic hears this as abandoning the extra-social anchor they crave.

  Third, there's an asymmetry in what counts as explanation. When Rortians say "reality doesn't tell us which vocabulary to use," critics hear evasion. When critics say "but electrons existed before we described them," Rortians agree but see it as trivial - the significant question is why we adopted that description, which involves practical success, not mirroring.

  The user asks what would count as progress. Given these divergences, resolution seems unlikely because:
  - It's not about overlooked distinctions but conflicting visions of rationality
  - Tabooing "truth" might temporarily calm things, but the meta-disagreement would resurface
  - Both sides have steelmanned each other for decades

  Perhaps the only progress is recognizing this as a philosophical watershed moment where you pick your camp: either you need philosophy to underwrite our practices with reality-contact, or you think that project is misguided. The honest move might be to stop rehashing and instead explore the consequences of each position for actual inquiry - which is what the user's magazine audience might care about more than the deadlocked debate itself.
answer: |-
  This isn't a resolvable philosophical dispute; it's a **clash of fundamental philosophical commitments playing out as a stalemate over vocabulary and explanatory goals.** Both sides are arguing past each other because they disagree at bedrock about what philosophy *is for* and what counts as a satisfying answer. Here's the diagnosis using the moves:

  1.  **The Core Disagreement: What is the Job of a "Theory of Truth"?**
      *   **Critic's Implicit Goal:** To provide a *normative grounding* for our practices (especially science). They want an explanation for *why* science succeeds that appeals to something *beyond* social practice – typically, a connection between our beliefs and a mind-independent reality that *validates* successful beliefs as "closer to the truth." They see "correspondence" (or something like it) as the *guarantor* of science's success against mere fashion or power.
          *   *Their Move:* "If you abandon representationalism, you abandon the ability to say science *progresses* towards a *truer* picture. You can only say it changes to what *we* currently accept. That's relativism/sociologism." They demand: "How do you *justify* the claim that science is *better than* astrology, *without* appealing to it getting reality *more right*?"
      *   **Rortian's Implicit Goal:** To offer a *naturalistic, non-mysterious description* of how our practices (like justification and truth-talk) actually work *within* human life. They see the demand for an external "grounding" as the *mistake* – a leftover from theological/Platonic thinking. Their theory aims to *dissolve* the traditional problem ("How do we hook our minds to the world?") by showing it rests on a flawed picture (the Mirror of Nature).
          *   *Their Move:* "You keep smuggling in the very 'God's Eye View' I dismantled. 'Correspondence' explains *nothing*; it's a placeholder for 'what we can't yet justify better.' The *only* explanations we ever have, or need, are about causal interactions with the world and social justifications within our evolving practices. 'Reality' is the *cause* of our beliefs, not the *justification* for them." They reframe: "Science *is* better than astrology because it *works* better for our purposes (prediction, control, coherence) – and we can explain *how* it works without invoking mysterious 'correspondence'."

  2.  **The Relativism Charge & The "World" Card: Talking Past Each Other**
      *   **Critic:** "You reduce justification to peer agreement! That's relativism!"
          *   *Rortian Counter:* "No. I never denied the world constrains us. Hit a rock with your fist, it hurts. But the *hurt* doesn't tell you whether to describe it with 'rock,' 'mineral aggregate,' 'silicon dioxide lattice,' or 'earth spirit.' The *choice of description* (vocabulary) is driven by *our* evolving purposes within a *social* practice. We justify beliefs *to each other* using norms *internal* to those practices. 'Relativism' only looks scary if you think justification *needs* an anchor outside all human practice – which I argue is impossible and incoherent."
      *   **Critic:** "But you said the world doesn't tell us which vocabulary to use! So what *does*? Just mob rule?"
          *   *Rortian Counter:* "Again, you demand an *external* selector. There isn't one. Vocabularies are adopted, refined, or abandoned based on complex interactions: *causal* friction with the world (does using this vocabulary help us avoid pain, build bridges?), *coherence* with other beliefs we hold dear, *aesthetic* appeal, *social* utility, *historical* contingencies. It's messy, human, and evolutionary – not dictated by Reality whispering the One True Description."
      *   **The "World" Mismatch:** When the Critic says, "But electrons existed before we described them!", the Rortian *agrees*. But they see this as a trivial causal point, not an *epistemological* one relevant to justification. The Critic sees it as crucial evidence *for* correspondence. The Rortian sees the Critic's move as conflating *causing* beliefs with *justifying* them.

  3.  **The Vocabulary Swap Offer: Why It Fails**
      *   *Rortian Move:* "I can say everything you say about science 'getting closer to the truth,' I just translate it into pragmatist terms: 'better at predicting and controlling,' 'solving more problems,' 'offering more coherent and comprehensive descriptions,' 'gaining wider reflective acceptance among inquirers.'"
      *   *Critic Rejection:* "Exactly! That's the problem! You've replaced 'tracking reality' with 'what *we* find useful/coherent.' You've lost the *objective normativity* – the sense that science succeeds *because* it gets the world *right*, not just because it pleases us. Your translation guts the essential meaning."
      *   *The Impasse:* The Critic insists the "essential meaning" (the external grounding) is indispensable. The Rortian insists it's an empty, unexplanatory relic. The offer fails because they fundamentally disagree on whether the pragmatist translation *captures* the core normative force or *eliminates* it.

  **What Kind of Disagreement is This?**

  *   **A Meta-Philosophical Disagreement:** It's primarily about **what philosophy can and should do.** Is its job to provide transcendent grounding (Critic), or to offer naturalistic descriptions dissolving pseudo-problems (Rortian)?
  *   **A Disagreement Over the Source of Normativity:** Where does the "ought" in "we *ought* to believe this scientific theory" come from? From an external reality (Critic), or from the internal standards and goals of our contingent but evolving social practices (Rortian)?
  *   **A Clash of Philosophical Temperaments:** The Critic has a deep intuition that human practices need an external anchor to avoid arbitrariness. The Rortian has a deep intuition that searching for such an anchor is a fruitless, non-naturalistic quest leading to pseudo-explanations.

  **What Would Count as Progress?**

  1.  **Recognizing the Meta-Stalemate:** The most significant progress would be for both sides to explicitly acknowledge that their disagreement runs deeper than Rorty's specific arguments. It's about **divergent conceptions of philosophical inquiry and normativity.** Framing it this way moves beyond rehashing "Is Rorty a relativist?" to the more fundamental question: "What *is* the project of epistemology/philosophy of language?" This doesn't resolve it, but it clarifies the nature of the impasse.
  2.  **Embracing a Watershed, Not a Resolution:** Progress might look like conceding that Rorty successfully identified a **philosophical watershed.** You can choose:
      *   **Path A (Critic):** Pursue a theory of representation/correspondence/robust realism, knowing you must grapple with the deep metaphysical and epistemological challenges Rorty highlighted (e.g., the scheme/content distinction, the non-explanatory nature of correspondence, the impossibility of a "view from nowhere").
      *   **Path B (Rortian):** Pursue a naturalized, pragmatist account of inquiry, language, and normativity, knowing you must grapple with the challenges of explaining the "friction" of the world and the apparent objectivity of science without appealing to traditional grounding.
      *   *Progress is understanding that choosing one path involves rejecting the foundational assumptions of the other.* Trying to "refute" the other side from within your own assumptions is futile.
  3.  **Stopping the Debate *as Currently Framed*:** The *honest move* is indeed to stop having *this specific loop*. Both sides have steelmanned their positions and the other's objections for decades. Further iterations won't yield new ground. Progress means:
      *   **For Critics:** Stop demanding Rortians answer the "grounding" question *on the Critic's terms*. Acknowledge the Rortian *description* of how justification works, even if you find it normatively unsatisfying. Engage instead with how *specific* post-Rortian projects (e.g., Brandom's inferentialism, Price's subject naturalism) handle normativity and objectivity without correspondence.
      *   **For Rortians:** Stop expecting Critics to find the "no external grounding" answer satisfying *as a replacement for normative grounding*. Acknowledge the deep *intuitive pull* of the Critic's worry, even if you think it's based on a bad picture. Focus on showing the *fruitfulness* of the pragmatist approach for understanding *actual* inquiry, history, or culture, rather than re-litigating the relativism charge.
      *   **For Everyone Else (Like You):** Recognize this as a **philosophical choice point**, not a resolvable argument. Cover the *consequences* of choosing each path for understanding science, culture, or politics, rather than the interminable debate itself. Highlight thinkers *building* on Rorty (or robust realism) in new ways, rather than refighting the 90s battle.

  **In short:** The disagreement is foundational, concerning the aims of philosophy and the source of normativity. Progress isn't a new argument that convinces the other side, but a meta-recognition of the watershed, a choice to build differently on divergent foundations, and a cessation of the repetitive loop in favor of exploring the consequences of each path. The debate isn't wrong; it's exhausted. The honest move is to move on, acknowledging the fundamental divergence.
