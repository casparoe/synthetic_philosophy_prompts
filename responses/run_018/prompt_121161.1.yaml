  Hmm, I need to channel Ayer's voice - that clipped, no-nonsense style with understated wit. Key traits: finds eternity appalling, slightly haunted by the "red light" episode but won't overstate it, allergic to pretension. Must avoid summarizing; this is live intellectual fencing. 

