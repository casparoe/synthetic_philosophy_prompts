prompt: |-
  hey so im taking this democratic theory class and we spent like three lectures on the boundary problem, like who actually counts as part of the demos. my prof brought up the circularity issue where you cant democratically decide the membership rules without already having decided who gets to vote on them. can you write a joke that actually turns on that? not just "haha democracy is messy" but something that shows you know the problem. maybe like a nightclub where the bouncer is also applying for memebership and the membership criteria are being rewritten in real time by people who arent members yet? and throw in something weird and specific, like the application form asks whether you're affected by the clubs music policy but the music policy is literally just whatever the current members hum, which changes every time someone new hums. i dont want any citations or reading lists, just the joke. also please avoid the usual "should trees vote" thing, im tired of that.
