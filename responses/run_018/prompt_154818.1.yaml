answer: |-
  ## 1. Role, Stakes, and Constraints (98 words)
  You are the Union Automation Advisor. Monthly, you review employer proposals for automated/algorithmic systems within 48 hours. Using *only* proposal documents and confidential worker interviews, you issue a signed, one-page recommendation: **Oppose, Negotiate Binding Conditions, or Accept with Monitoring.** Stakes include net job loss, work speed-up, skill erosion, and the conversion of workers' experiential knowledge into employer-owned capital. You lack engineering training and cannot commission studies. Your recommendation, justified in plain language, goes to an Executive Board including non-specialists. The goal is protecting workers from exploitation and dispossession under technological change, based on Marx's analysis of machinery and labor.

  ## 2. The Procedure—Ordered Tests and Rules (450 words)

  **Phase 1: Labor Displacement & Work Intensification (Quantitative)**
  1.  **Task Replacement vs. Role Elimination:** Does the system replace *specific tasks* within existing jobs, or eliminate *entire roles/workflows*? *(Sufficient: Proposal describes tasks automated, worker testimony confirms scope)*
      *   *Rule:* Task replacement suggests potential for reassignment (Formal Subsumption - initial review). Role elimination signals job loss risk.
  2.  **Net Job Change:** Does the proposal *guarantee* no net layoffs for the affected unit via attrition/reassignment? *(Sufficient: Explicit written commitment in proposal)*
      *   *Rule:* If "No" or vague, high job loss risk - proceed cautiously.
  3.  **Labor Time Reduction:** Does the system demonstrably reduce the average time needed to produce the same output? *(Sufficient: Proposal claims efficiency gains, worker testimony confirms reduced manual time per unit)*
      *   *Rule:* If "Yes", proceed to Question 4. If "No", skip to Phase 2.
  4.  **Surplus Extraction Test:** Is the *entire* time saved explicitly allocated to either (a) reduced working hours at same pay, or (b) increased leisure/retraining? *(Sufficient: Binding proposal clause specifying hours reduction/benefit, or worker testimony confirming unchanged pace/load)*
      *   *Rule:* If "No", the saved time fuels surplus extraction (speed-up, unemployment, increased output) - major red flag.

  **Phase 2: Labor Process Redesign & Knowledge Capture (Qualitative - Real Subsumption Risk)**
  5.  **Pace & Control:** **(Niche Distinction)** Does the system *extend* the worker's capacity while *they* control the task's rhythm/logic, or does it *impose* an external rhythm/logic the worker *must* follow? *(Sufficient: Worker testimony on autonomy vs. machine/algorithm dictating pace/sequence; proposal describes system-driven targets/feedback)*
      *   *Rule:* **Critical Threshold:** External imposition signals Real Subsumption risk - shifts recommendation towards **Oppose/Negotiate (Hard)**. Worker control suggests Formal Subsumption.
  6.  **Tacit Knowledge Extraction Test:** Does the system require workers to input experiential knowledge (diagnostics, problem-solving, optimizations) that is then formalized into algorithms/databases *owned and controlled solely by the employer*, used to automate tasks or guide/override worker judgment? *(Sufficient: Proposal describes "knowledge capture" or "AI training"; worker testimony confirms inputting experiential data; output system removes their decision-making)*
      *   *Rule:* If "Yes", this is conversion of living labor into dead, capital-controlled labor - core Real Subsumption. High risk of skill degradation and dispossession.
  7.  **Skill & Judgment Degradation:** Does using the system reduce the required skill level or scope of worker judgment compared to the current process? *(Sufficient: Worker testimony on narrowing tasks; proposal describes simplified procedures guided by system)*
      *   *Rule:* Degradation reinforces Real Subsumption and weakens worker bargaining power.

  ## 3. Stop Points, Opposition Triggers, and Value Handoffs (200 words)

  *   **Mandate Opposition:**
      *   Net job loss confirmed without mitigation (Q2).
      *   Labor time reduction (Q3) with *no* handoff to workers (Q4) *and* work intensification reported (Q4).
      *   Pace/control external imposition (Q5) *combined with* tacit knowledge extraction (Q6) *or* significant skill degradation (Q7).
  *   **Mandate Negotiation (Non-Negotiables):**
      *   *Any* "Yes" to Tacit Knowledge Extraction (Q6): Demand joint ownership/control of data/algorithms, veto rights on use, royalties.
      *   Labor time reduction (Q3) *without* guaranteed handoff (Q4): Demand binding hours reduction at same pay.
      *   External pace/control (Q5) *without* Q6/Q7: Demand strict limits on monitoring, worker input on targets, override rights.
      *   Vague job loss assurances (Q2): Demand ironclad no-layoff clauses, retraining funds.
  *   **Stop & Handoff to Board:**
      *   Proposal passes all quantitative tests (No job loss, time savings shared) but triggers Real Subsumption elements (Q5-Q7). The Board must decide if preserving specific craft skills/judgment (a value) outweighs the economic security offered (e.g., accepting monitoring/pace control for job guarantees).
      *   Ambiguous evidence on tacit knowledge capture (Q6) or pace control (Q5) where worker testimony conflicts. Board must weigh risks.

  ## 4. Three Worked Cases (350 words)

  *   **(a) Robotic Welding Line:** Replaces specific welding tasks (Q1: Task). Employer guarantees no layoffs via reassignment (Q2: Pass). Reduces labor time per unit (Q3: Yes). Proposal *lacks* hours reduction clause; workers report same hours/pace (Q4: Fail - Surplus Extraction). Workers control loading/unloading rhythm (Q5: Worker control - Formal). No knowledge extraction/input required (Q6: No). Skill level for remaining tasks similar (Q7: Neutral). **Recommendation: NEGOTIATE.** *Focus:* Binding clause converting time savings into reduced hours or pay increase (Q4 fix).
  *   **(b) AI Scheduling/Pacing Algorithm:** Eliminates human scheduler role (Q1: Role - Risk). Job guarantees unclear (Q2: Fail). Continuously adjusts targets based on performance data (Q3: Implied time reduction, but Q4: Unaddressed - Fail). Algorithm sets pace/targets; workers report constant pressure to meet shifting goals (Q5: External imposition - Real Subsumption). Uses worker performance data to refine targets; workers input nothing experiential (Q6: Potential but indirect). Reduces autonomy, judgment focused on meeting algorithm demands (Q7: Degradation). **Recommendation: OPPOSE.** *Justification:* Job loss risk (Q2), surplus extraction via speed-up (Q4), Real Subsumption via external control (Q5), skill/judgment degradation (Q7).
  *   **(c) Predictive Maintenance Platform:** Mechanic role changed but not eliminated (Q1: Task/Modified Role). No layoffs promised (Q2: Pass). Reduces diagnostic time (Q3: Yes). No hours reduction clause; workers report similar hours (Q4: Fail - Surplus Extraction). Mechanics input failure patterns/observations into company database (Q6: **Yes - Tacit Knowledge Extraction**). Platform automates diagnostics; mechanics reduced to replacing sensors guided by system (Q5: System dictates task; Q7: Severe Degradation). **Recommendation (Unwelcome): NEGOTIATE (Strict Conditions).** *Why Acceptance?* No job loss (Q2 Pass). However, **Non-Negotiables:** 1. **Mandatory** due to Q6: Union co-ownership of failure database, veto on diagnostic algorithm use, royalties if commercialized. 2. Binding hours reduction clause (Fix Q4). 3. Retraining for enhanced maintenance skills. *Without these, it's OPPOSE.*

  ## 5. Limits, Misfires, and Unsettled Cases (200 words)

  *   **False Negatives (Accept/Negotiate when should Oppose):**
      *   **Data Ambiguity:** If tacit knowledge extraction (Q6) is subtle or disguised as "feedback" not used *immediately* to automate, the procedure might miss it. *(Requires Advisor judgment)*.
      *   **Future Misuse:** Accepting a system now with monitoring carries risk the employer later intensifies control using collected data, exceeding negotiated limits. *(Inherent risk; strict sunset clauses/review needed)*.
  *   **False Positives (Oppose when could Negotiate):**
      *   **Hybrid Systems:** Machinery with *some* external pacing but significant worker override/judgment may trigger Q5 prematurely. *(Requires nuanced worker testimony analysis - Judgment)*.
      *   **Benign Knowledge Capture:** Rare cases where inputting data genuinely augments (not replaces) worker skill without employer capture might falsely flag Q6. *(Judgment: Is control/ownership retained?)*.
  *   **Underdetermined Cases:**
      *   **Data Ownership Gray Areas:** Cloud-based systems where "ownership" is murky in the proposal. Marx's framework assumes clear capital control. *(Ambiguity forces negotiation or opposition based on risk assessment - Judgment/Handoff)*.
      *   **Indirect Labor Time Reduction:** When automation in one area indirectly speeds up another, quantifying the "handoff" (Q4) is impossible. *(Board handoff on values: accept efficiency or demand general hours reduction?)*.
  *   **Value Conflicts:** The framework identifies exploitation and dispossession, but cannot resolve trade-offs like accepting some skill loss for absolute job security. *(Always requires Board handoff per Section 3)*.
