  That niche distinction about machinery rhythms will be crucial for the "negotiate vs oppose" threshold. The welding case (a) seems like formal subsumption - replace tasks but keep worker autonomy. But the scheduling algorithm (b) screams real subsumption - workers become algorithm servants. 

  Ah, the tricky one is case (c). Mechanics lose diagnostic role but safety monitoring could justify acceptance. Some unions might hate this - hence needing clear "values handoff" points (section 3) where economic security conflicts with craft identity.

