  **MEMORANDUM: OCA/INTAKE/9Rev.4**  
  **TO:** Newly Drawn Members, Civic Assembly of the Republic of Aethelgard  
  **FROM:** Office of Civic Assembly Integrity & Protocol (OCA)  
  **SUBJECT:** Mandatory Onboarding: Civic Assembly Service Parameters & Procedural Compliance  
  **DATE:** 45 Post-Abolition  

  ---

  ### **1. SELECTION PROTOCOL**  
  **1.1 Universal Pool Inclusion**  
  All citizens aged 18+ are perpetually enrolled in the Primary Civic Pool (PCP), per the Constitutional Mandate of Universal Inherence (Art. I).  

  **1.2 Epistemic Band Assignment**  
  **1.2.1** PCP entrants are algorithmically sorted into one (1) of three (3) Epistemic Bands:  
  - **Generalist (G-Band)**: Baseline civic competence, non-specialized perspective.  
  - **Domain-Specialist (DS-Band)**: Validated expertise in ≥1 Policy-Relevant Field (e.g., Ecology, Econometrics).  
  - **Meta-Cognitive Auditor (MCA-Band)**: Certified proficiency in "Deliberative Process Optimization" or "Epistemic Conflict Resolution."  

  **1.2.2** Band assignment derives from the *Objective Civic Aptitude Taxonomy (OCAT)*, an ISO 31000-compliant algorithmic registry. Assignment is irreversible for the duration of the civic cycle (5 years).  

  **1.3 Sortition Execution**  
  **1.3.1** Assembly seats are filled via cryptographically audited random selection *within* assigned Bands:  
  - G-Band: 70% of seats (Deliberative Commons)  
  - DS-Band: 25% (Sectoral Scrutiny Panels)  
  - MCA-Band: 5% (Deliberative Flow Governance)  

  **1.3.2** Randomness is sacrosanct. OCAT banding is strictly pre-randomization "procedural hygiene," preserving foundational equality *(Equality Principle Compliance Notice #3)*.  

  ---

  ### **2. EPISTEMIC BANDING & POOL HYGIENE**  
  **2.1 Band Integrity Maintenance**  
  **2.1.1** OCAT recalibration occurs biennially to ensure "dynamic statistical fidelity" with societal knowledge distribution.  
  **2.1.2** Randomness Audits (RA): Quarterly third-party verification (by MCA-Band auditors) that intra-Band draws exhibit ≤0.01% entropy deviation. Audit focus: *draw mechanics only*. Band composition is non-auditable per Statutory Decree 7.  

  **2.2 Deliberative Contamination Mitigation**  
  **2.2.1** DS-Band members must complete Ignorance-Certification Workshops (ICW) prior to service:  
  - ICW trains specialists to "procedurally suspend non-standardized knowledge" during Generalist-led deliberations.  
  - Post-workshop, members attest to "epistemic neutrality" via Form OCA-7D.  

  **2.2.2** G-Band members are prohibited from "autodidactic specialization" during service to prevent Band drift.  

  ---

  ### **3. DELIBERATIVE OBLIGATIONS**  
  **3.1 Role-Specific Protocols**  
  **3.1.1** G-Band: Primary debate and voting. Must utilize state-provided "Evidence Synthesis Packets" (ESPs). Independent research = Code 3 Violation.  
  **3.1.2** DS-Band: Restricted to "factual clarification responses" when formally petitioned by G-Band (via Yellow Ticket System). Unsolicited input = Code 4 Violation.  
  **3.1.3** MCA-Band: Monitors "deliberative equity." Authority to pause discussion if "cognitive asymmetry" is detected.  

  **3.2 Neutrality Enforcement**  
  All members must reiterate the Oath of Epistemic Surrender (OES) daily: *"I am a statistically congruent vessel of Aethelgard’s collective wisdom."*  

  ---

  ### **4. GRIEVANCE AND RECUSAL**  
  **4.1 Band Assignment Challenges**  
  **4.1.1** Citizens may file Form OCA-G9 ("Band Reclassification Petition") if:  
  - They believe their expertise was mis-scored by OCAT; OR  
  - They feel "over-qualified yet statistically under-represented" in their Band.  

  **4.1.2** Grievances are reviewed by the MCA-Band Standing Committee on Band Fidelity (SCBF). SCBF rulings are final. *(Note: 99.7% of G9 petitions are denied per "statistical optimality" precedent.)*  

  **4.2 Conflict of Interest (COI)**  
  **4.2.1** Recusal is mandatory if a member has "non-generalizable personal stakes" in a topic.  
  **4.2.2** COI claims require pre-deliberation submission of Form OCA-12R ("Recusal Rationale"). Denied recusals may be appealed to MCA-Band.  

  ---

  ### **5. CONTINUITY RULES**  
  **5.1 Premature Vacancy Protocol**  
  Members may be removed for:  
  - Incompetence (≥3 Code Violations);  
  - "Deliberative incapacity" (certified by 2 MCA-Band members);  
  - Voluntary resignation (Form OCA-88V).  

  **5.2 Replacement Protocol**  
  **5.2.1** Vacancies are filled by a new random draw *from the same Epistemic Band* as the departed member.  
  **5.2.2** Non-Branching Continuity Principle: Replacements inherit the predecessor’s Band designation *even if* their personal OCAT score has since changed. This preserves "longitudinal statistical equivalence."  

  **5.3 Incompetence Replacement Paradox Resolution**  
  **5.3.1** Per Continuity Rule 5.2.1, a member removed for incompetence is replaced by another randomly selected member *of the same Band*.  
  **5.3.2** Rationale: Band-specific competence is ensured by OCAT pre-sorting; individual performance variance is "stochastic noise," not systemic.  

  ---

  ### **6. COMPLIANCE ACKNOWLEDGEMENT**  
  Sign below affirming:  
  - Your selection was purely random within your OCAT-determined Band;  
  - Band assignment reflects procedural hygiene, not meritocratic hierarchy;  
  - Aethelgard’s system embodies "filtered equality" — the purest form of civic fairness.  

  **SIGNATURE:** _________________________  
  **DATE:** _________________________  
  **DISTRIBUTION:** OCA Archives, Your Band Supervisor, Public Transparency Portal (Anonymized)  

