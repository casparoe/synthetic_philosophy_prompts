answer: |-
  You've nailed the core tension in function theory right out of the gate. Let's break down the hard desiderata—the non-negotiables any theory *must* handle—versus the camp preferences, using your examples. The contradiction you spotted is real and unresolved.

  ---

  ### **Non-Negotiable Desiderata**  
  *(Fail these, and the theory collapses in practice.)*

  1. **Malfunction Handling**  
     - **Demand:** Must distinguish "what an item *should* do" from "what it *does* do."  
     - **Motivating Case:** A human heart with a faulty valve that pumps inefficiently. We say it *malfunctions* even if it still moves some blood. If "function" just meant "current activity," we couldn't call this broken—it's just pumping poorly. Medicine requires normative judgment.  
     - **Why non-negotiable:** Without this, function loses its explanatory power in biology/medicine.

  2. **Function vs. Accidental Benefit**  
     - **Demand:** Must separate a part's *proper function* from incidental effects.  
     - **Motivating Case:** The human heart *makes rhythmic thumping sounds*. That’s what it does, but we don’t call that its function—unlike pumping blood. Meanwhile, sweating cools us (function) but also signals pheromones (side effect).  
     - **Why non-negotiable:** Without this, everything a thing does is "functional," collapsing useful explanation (e.g., in disease or adaptation).

  3. **Novel Artifacts/Synthetic Biology**  
     - **Demand:** Assigns functions to entities *without evolutionary history*.  
     - **Motivating Case:** A genetically engineered bacterium designed to digest oil spills. It has a *function* (oil digestion) from day one, despite zero natural selection. Calling this "non-functional" until it evolves ignores engineering intent.  
     - **Why non-negotiable:** Synthetic biology exists. A theory that excludes it is irrelevant to modern science.

  ---

  ### **Camp Preferences**  
  *(Theories prioritize these differently—but no theory satisfies all perfectly.)*

  4. **Evolutionary (Etiological) Grounding**  
     - **Demand:** True functions *must* stem from past selection.  
     - **Motivating Case:** Gene pleiotropy. A gene causes both bone growth and hearing loss (e.g., *TGFB1*). Selection likely acted on bone growth (function), not hearing loss (side effect). History resolves ambiguity.  
     - **Trade-off:** Fails your synthetic organism case. If "no selection history = no function," engineered bacteria have no "real" function—counterintuitive.

  5. **Causal-Role (Systemic) Contribution**  
     - **Demand:** Function is defined by *current* causal role in a system.  
     - **Motivating Case:** A misfolded protein in a novel environment stabilizes a cell membrane accidentally. It contributes now, so it gains a "function" without history. Handles synthetic biology seamlessly.  
     - **Trade-off:** Struggles with malfunction. If a broken heart still circulates *some* blood, is it functioning? Also, can’t distinguish heart sounds (causal side effect) from pumping (core function).

  6. **Pluralism/Context-Dependence**  
     - **Demand:** Accepts multiple function concepts for different contexts.  
     - **Motivating Case:** A ribosome in a cell: evolutionary (selected for protein synthesis) and causal-role (currently synthesizing proteins). Both descriptions are valid depending on whether you're doing phylogenetics or biochemistry.  
     - **Trade-off:** Feels "untidy" to hardliners but avoids forcing one size fits all.

  ---

  ### **The Core Contradiction You Spotted**  
  > *"Can you demand evolutionary grounding AND cover engineered bacteria?"*  

  **No—this is logically impossible for *monist* theories.**  
  - **Etiological theories** (e.g., Millikan, Neander) tie function to natural selection history. They *must* deny "true" functions to synthetic organisms (though some stretch "selection" to include artificial design).  
  - **Causal-role theories** (e.g., Cummins) assign functions based on current organization. They handle synthetic cases but lack resources to ground norms (why *should* the heart pump?) or distinguish function from accident.  

  **The tension is inescapable:**  
  - If you demand **normativity** (malfunction) + **historical grounding**, you lose synthetic biology.  
  - If you demand **ahistorical applicability** (synthetic bio) + **normativity**, you need a non-evolutionary source of "should" (e.g., designer intent or system goals).  

  ---

  ### **Where Does This Leave Us?**  
  - **Non-negotiables (1–3)** are why no theory is universally loved.  
  - **The contradiction** arises because we *want* functions to be both:  
    - **Normative** (implying a "should" beyond what *is*),  
    - **Empirical** (grounded in observable facts).  
    Evolution provides "should" via selection; design provides it via intent. No third source is uncontroversial.  
  - **Pluralism is the pragmatic escape hatch:** Use etiological functions for evolved systems, causal-role for engineered ones. But this feels like surrender to purists.  

  **Your engineer’s verdict:** The demands *are* jointly unsatisfiable if you insist on a single, unified theory. Biology uses "function" in ways that pull in opposite directions—and that’s why philosophers still argue. You’re not missing anything; the fracture is real.
