prompt: |-
  hey, I'm a retired microbiologist who's only recently started reading actual philosophy books, so bear with me. I've been thinking about biological function—like, what does it actually mean to say the heart's function is pumping blood, versus just saying that's what it does? In my old field we talk about etiological accounts (selected effects) and causal-role ones (what it contributes now), but I'm trying to figure out what any serious theory of function has to deliver. Could you write out the hard desiderata? Not just a scorecard—what are the non-negotiable criterias, and which ones are just camp preferences? For each one, say what case or example motivates it—like explaining malfunction when something still works partly, or handling gene pleiotropy where one gene does two things, or dealing with sythetic organisms we engineered that never went through natural selection. I especially want to know if there's a hidden contradiction: can you demand evolutionary grounding for real functions and also demand the theory cover engineered bacteria with no selection history? If some subset of these demands is jointly unsatisfiable, that's the part I care about most. No need for citations or a reading list—just straight reasoning. Thanks!
reasoning: |-
  Okay, this user is a retired microbiologist diving into philosophy of biology, specifically biological function theories. They're clearly sharp—framing the problem with technical precision (etiological vs. causal-role accounts) while flagging real-world cases like malfunction, pleiotropy, and synthetic biology. Their core question is brutal: what must any function theory deliver, and is there a contradiction between evolutionary grounding and engineered systems?  

  First, unpack their hidden layers:  
  - They want *desiderata*, not just definitions. Non-negotiables vs. camp preferences.  
  - Examples matter deeply—each criterion needs a concrete case (e.g., a broken heart still "has the function" to pump, even if it fails).  
  - The synthetic organism dilemma is their litmus test: can evolution-based theories handle designed things?  

  Hmm. The tension they spotted is real. Etiological theories (functions as selected effects) stumble on lab-made organisms, while causal-role theories (functions as current contributions) struggle to distinguish function from accident. Let’s map the must-haves:  

  **Non-negotiables (any theory must explain these):**  
  1. **Malfunction:** Heart failure *is* malfunction—so "function" isn’t just what it *does*. (Motivation: medical reality.)  
  2. **Function/Benefit Distinction:** Sweating cools us (function) but also attracts mates (benefit). Theory must separate core function from side effects. (Motivation: pleiotropy in genes.)  
  3. **Novel Artifacts:** A synthetic bacterium’s toxin-production is functional by design, even without selection history. (Motivation: synthetic biology.)  

  **Camp Preferences (theoretical trade-offs):**  
  - *Etiologists* demand evolutionary history → cleanly explains malfunction but crashes into synthetic life.  
  - *Causal-role advocates* prioritize current organization → handles engineered systems but blurs function/accident lines (e.g., heart sounds).  

  **The contradiction they fear:** Yes, it’s there. You can’t *simultaneously* ground all functions in past selection *and* assign "true" functions to things with no evolutionary history. Theories must choose—either dilute "selection" (e.g., include artificial selection) or admit pluralism.  

  Final note for them: This isn’t a flaw in reasoning—it’s a genuine fracture in philosophy of biology. Their instinct about incompatible demands is spot-on. The solution isn’t choosing sides but seeing why both matter for different contexts (evolution vs. design).  

