answer: |-
  ### 1. The institutional practice and the philosophical puzzle (150 words)
  The university employs a three-tiered plagiarism system: (1) an honor code defining plagiarism vaguely as presenting others' ideas/expressions as one's own "without adequate acknowledgment"; (2) detection software applying rigid percentage thresholds (dismissal <15%, automatic hearing >30%, borderline 15-30%); and (3) a Borderline Review Board classifying cases in the middle band based not on factual plagiarism determination but on disciplinary citation norms, intent, and boilerplate conventions. The Board’s classifications are final, with no appeal. Crucially, threshold recalibration responds solely to shifting citation conventions, not new empirical data about misconduct. This raises a philosophical puzzle: what view of *vagueness* underpins a system that starts with open-textured language, imposes artificial precision via software, and resolves borderline cases through conventionalist decision-making rather than truth-seeking? The tension lies in whether plagiarism boundaries are treated as objective but hidden, genuinely indeterminate, or socially constructed.

  ### 2. Reconstruction of the implicit theory of vagueness (350 words)
  The system presupposes a **supervaluationist theory of vagueness**, wherein:
  - The honor code’s vagueness reflects genuine semantic indeterminacy: "adequate acknowledgment" lacks sharp boundaries across all contexts (*entails* supervaluationism).
  - The software thresholds do *not* treat plagiarism as having a precise but unknown boundary. Instead, they impose *artificial precisifications* for administrative efficiency (merely *fits* supervaluationism; could also fit epistemicism if thresholds were proxies for hidden facts).
  - The Board’s mandate is decisive: it fixes indeterminate cases via *admissible precisifications* (disciplinary norms, boilerplate conventions). Its finality without appeal confirms that no "fact of the matter" exists independently of these conventions (*entails* supervaluationism). The Board resolves vagueness by *stipulating* boundaries within the penumbra.
  - The quinquennial audits explicitly treat thresholds as conventions tied to evolving citation practices, not discoveries about misconduct prevalence. This *recalibration by convention* (not empirical correction) confirms that boundaries are indeterminate until socially fixed (*entails* supervaluationism).

  Contrast with rivals:
  - **Epistemicism** (sharp but unknowable boundaries) is *incompatible*: The Board would need to *investigate* the hidden truth, not stipulate based on norms. The lack of appeal mechanisms and conventional recalibration would be irrational if a fact existed to discover.
  - **Degree-theoretic/contextualist** views are less aligned: The system doesn’t treat plagiarism as scalar (rejecting degrees), nor does it resolve vagueness contextually case-by-case (Board uses field-wide norms).

  The core commitment is that plagiarism’s boundaries are *ontologically indeterminate* until precisified by authoritative conventions. The software’s cutoffs are not approximations of truth but operational necessities; the Board provides the precisifications that render the honor code determinate in borderline zones.

  ### 3. Coherence check: tensions and resolution (250 words)
  **Tension between honor code and software:** The honor code’s open-textured vagueness and the software’s binary thresholds appear incompatible—one denies sharp boundaries, the other imposes them. Under epistemicism, this would be a deep flaw (software misrepresents reality). Under supervaluationism, however, this is resolvable: software thresholds are *admissible precisifications* for efficiency, not claims about pre-existing sharpness.

  **Resolution by the Board:** The Board’s conventionalist role *resolves* this tension by legitimizing the software’s precisifications. It treats the 15–30% band as the *penumbra* where multiple precisifications (dismissal vs. hearing) are equally admissible until the Board selects one based on social/conventional criteria (citation norms, boilerplate). The honor code’s vagueness is thus *deferred* to the Board, which completes the precisification process.

  **Recalibration as confirmation:** The quinquennial audit’s reliance on shifting citation conventions—not empirical misconduct data—cements coherence. If boundaries were sharp but hidden (epistemicism), thresholds should adjust based on *evidence* of where the true boundary lies. Instead, adjusting to *conventions* confirms that precisifications are driven by normative practices, not discovery.

  The system is coherent *only* under a supervaluationist reading: vagueness is real, software imposes temporary precisifications, and the Board authoritatively fixes indeterminate cases via socially grounded criteria. The honor code’s vagueness isn’t contradicted but *operationalized* through staged precisification.

  ### 4. Rival substitution and institutional redesign (250 words)
  If **epistemicism** (sharp but unknowable boundaries) were adopted:
  - **Board mandate overhaul:** The Board must shift from *stipulating* outcomes to *investigating* hidden facts. Instead of applying "disciplinary citation norms," it would seek evidence of intent, access to sources, or independent verification of copying—aiming to approximate the true boundary.
  - **Appeals mechanism essential:** Finality without appeal becomes indefensible. If misclassification is possible (due to hidden facts), a process for correcting errors based on new evidence is necessary.
  - **Recalibration reframed:** Threshold adjustments must respond to *empirical data* (e.g., statistical analysis of adjudicated cases revealing where true violations cluster), not citation conventions. The "15%" cutoff would be a proxy for an estimated epistemic boundary.
  - **Software thresholds reconceived:** Percentages might be treated as error-prone indicators, with borderline cases requiring deeper inquiry (e.g., forensic text analysis) to uncover the fact of plagiarism.

  **Underdetermination:** Minor adjustments could make the current practice *compatible* with epistemicism:
  1. Reinterpret the Board’s criteria (e.g., "intent" and "boilerplate") as *evidence* of the hidden fact of plagiarism.
  2. Frame citation norms as heuristics for inferring unobservable boundaries.
  3. Treat recalibration as updating epistemic thresholds based on aggregated case data (though current practice explicitly rejects this).

  However, the lack of appeals and explicit conventionalism in recalibration resist epistemicism. The core contradiction is the Board’s *stipulative* (not truth-tracking) role.

  ### 5. The AI-paraphrase case and underdetermination (200 words)
  **Case:** AI paraphrases a source, yielding 18% similarity (borderline range), with no direct copying.  
  **Classification:** Under the reconstructed supervaluationist system, this falls to the **Borderline Review Board**.  

  **Analysis:**  
  - The Board would assess "disciplinary citation norms" (e.g., whether paraphrasing AI output requires attribution in the field), "intent" (e.g., student disclosure of AI use), and "boilerplate" (e.g., if the paraphrased content is generic).  
  - Likely outcome: Conventional citation norms dominate. If the field treats undisclosed AI paraphrasing as plagiarism *regardless of similarity score*, the Board classifies it for hearing. Otherwise, dismissal.  

  **Limits revealed:** The system struggles because:  
  1. **"Expressions" vs. "ideas":** The honor code covers both, but software detects only textual similarity. AI paraphrasing may copy *ideas* without expressions, evading detection.  
  2. **Intent ambiguity:** AI use blurs "own expression," challenging the core definition.  

  **Underdetermination:** *Both* supervaluationism and epistemicism could address this case with minor adjustments:  
  - **Supervaluationism:** Board precisifies whether undisclosed AI paraphrasing constitutes "inadequate acknowledgment" based on emerging conventions.  
  - **Epistemicism:** Board investigates if the student *intended* to represent the AI’s ideas as their own (a hidden fact).  
  Yet the system’s *current* criteria (reliant on textual similarity and field norms) are poorly equipped to handle non-textual idea appropriation, exposing a gap between its operational mechanics and the honor code’s scope.
