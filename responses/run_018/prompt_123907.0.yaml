prompt: |-
  In my ethics seminar people keep throwing around "moral worth is in the will, not in the world" to shut down talk about lucky outcomes. Last week someone used it to claim that a surgeon who saves a patient purely to impress her boss has done something with zero moral value, even though the patient lived. I'm writing a paper on acting for the right reasons and want to bring some precision to this slogan. Could you lay out the distinct precise claims it might be expressing — from the trivial ("intentions matter too") to the radical ("outcomes are literally irrelevant to aretaic appraisal") — and for each say whether it's plausible and whether it actually supports dismissing the surgeon case? I especially want to know if there's a hidden modal claim about counterfactual robustness, or if it's just about the locus of evaluation, and whether we should distinguish motivational credit from deontic credit here. Please seperate what's settled from what's genuinely contested among people who know the topic, and don't present a contested view as the consensus; also no reading lists, just the conceptual menu.
reasoning: |-
  Okay, the user is in an ethics seminar dealing with the slogan "moral worth is in the will, not in the world." They want to break down this slogan into precise claims for their paper on acting for the right reasons. The example given is a surgeon saving a patient to impress the boss—outcome good, but motivation questionable. The user wants clarity on how different interpretations of the slogan apply here, especially whether outcomes are irrelevant and if there's a hidden modal element.

  First, I need to unpack the slogan. The core idea seems to draw from Kantian ethics, where intentions matter most. But the user is asking for a spectrum from trivial to radical claims. Let me start by listing possible interpretations. The trivial one is that intentions matter alongside outcomes. That's probably uncontroversial. Then moving towards stronger claims: intentions are necessary for moral worth, then sufficient, and finally the radical stance that outcomes don't matter at all.

  The surgeon case is key. The user mentioned that the patient lived, but the surgeon's motive was wrong. Under the trivial claim, both matter, so the action has some moral value because of the outcome. But under stronger claims, the lack of good intention might negate moral worth entirely. The radical claim would say the outcome is irrelevant, so the surgeon gets no moral credit despite saving a life.

  The user also asks about a hidden modal claim—counterfactual robustness. That means whether the agent would have acted the same way in different circumstances. If the surgeon only acted to impress, they might not have saved the patient if there was no boss to impress. That ties into whether the will is robust across scenarios. This might be an important distinction, especially in assessing the agent's character versus the action's permissibility.

  Another point is distinguishing motivational credit (aretaic) from deontic credit (rightness/wrongness). Kantians might conflate these, but consequentialists separate them. The surgeon's action might be deontically permissible (saved a life) but aretaically blameworthy (bad motive). The slogan often mixes these, so clarifying that distinction could help the user's argument.

  I should also note what's settled versus contested. Most ethicists agree intentions matter, but the extent is debated. The necessity of intentions is Kantian but contested by consequentialists. The sufficiency claim is more radical and likely rejected by many. The radical irrelevance of outcomes is extreme and not mainstream. Counterfactual robustness is a deeper layer that some philosophers like Julia Markovits discuss, tying moral worth to reasons responsiveness.

  The user probably wants to challenge the seminar's use of the slogan to dismiss discussions of luck. Highlighting the spectrum shows that only the strongest claims support outright dismissal, which are the least plausible. Emphasizing the contested nature helps the user position their paper in the debate without overstepping consensus.

  Also, considering the user's deeper needs: they might be frustrated with oversimplified slogans shutting down nuanced discussion. They need ammunition to show that the slogan isn't a trump card but a starting point for deeper analysis. Providing clear distinctions and pointing out where the slogan overreaches (like ignoring outcome relevance entirely) empowers their critique.
answer: |-
  Here's a breakdown of the distinct claims embedded in "moral worth is in the will, not the world," analyzed for plausibility, relevance to the surgeon case, and clarity on settled/contested points:

  ### 1. **The Trivial Claim: Intentions Are Necessary (But Not Sufficient) for Moral Worth**
     *   **Claim:** An action cannot possess *moral worth* unless it is done from a morally good intention (e.g., duty, benevolence). Good outcomes alone are insufficient to confer *moral worth* on the action itself. Outcomes may still have *consequential* moral value.
     *   **Plausibility:** Highly plausible and widely accepted (Kantian core, resonates with many virtue ethicists, even consequentialists often distinguish the *act's* worth from the *outcome's* value).
     *   **Surgeon Case:** **Supports dismissal of *full* moral worth.** The surgeon's act (saving the patient *solely* for promotion) lacks a morally good intention. Therefore, *despite the good outcome*, the *action itself* lacks moral worth. However, the *outcome* (patient living) is still morally good.
     *   **Settled/Contested:** This necessity claim is largely settled among those who use the slogan seriously (primarily Kantians). Consequentialists might reject "moral worth" as distinct from outcome value.

  ### 2. **The Stronger Claim: Intentions Are Sufficient for Moral Worth (Regardless of Outcome)**
     *   **Claim:** Possessing a morally good intention is *sufficient* to confer moral worth on an action, even if the intended outcome fails due to bad luck (e.g., a genuinely benevolent person tries to save someone but accidentally kills them due to unforeseen circumstances).
     *   **Plausibility:** Plausible within Kantian frameworks (duty is to will the good, outcomes are beyond full control). Highly contested by consequentialists and those emphasizing the moral significance of actual harm/good done. Many find it intuitively harsh to grant *full* moral worth to actions causing disastrous unintended consequences, even with good intent.
     *   **Surgeon Case:** **Not directly addressed** (as the outcome was good). This claim is about insulating good intentions from bad luck, not judging bad intentions with good luck.
     *   **Settled/Contested:** Contested. Core Kantian doctrine, but a major point of disagreement with consequentialism and some virtue ethics. Many accept moral *credit* survives bad luck, but question if *full worth* does.

  ### 3. **The Radical Claim: Outcomes are Literally Irrelevant to Aretaic Appraisal (Judging the Agent/Act)**
     *   **Claim:** The actual consequences of an action have *zero bearing* on the evaluation of the *agent's character* or the *moral worth of the act itself*. Only the quality of the will matters. Luck plays no role in aretaic assessment.
     *   **Plausibility:** Implausible to most outside strict Kantianism. Virtue ethics inherently links character assessment to reliable success in achieving the good (eudaimonia). Even many deontologists acknowledge that *consistent* failure to achieve good ends (despite good intent) might reflect poorly on judgment/skill, if not the will's purity. Outcomes often provide evidence about the will/intention.
     *   **Surgeon Case:** **Directly supports dismissal.** The good outcome is deemed irrelevant to judging the surgeon's character or the act's moral worth. Only the bad motive counts.
     *   **Settled/Contested:** Highly contested. Represents the strongest Kantian interpretation but is rejected by virtue ethicists, consequentialists, and many hybrid views. Most agree outcomes are *less* central than intentions for aretaic appraisal, but denying *any* relevance is extreme.

  ### 4. **The Modal Claim: Moral Worth Depends on Counterfactual Robustness / Reasons-Responsiveness**
     *   **Claim:** An act has moral worth only if the agent performed it *because* it was the right thing to do, meaning their will is responsive to moral reasons. This implies **robustness**: the agent would still have acted rightly *even if* circumstances changed (e.g., no boss to impress, less personal risk). Luck is dismissed because it doesn't affect this underlying reason-responsiveness.
     *   **Plausibility:** Increasingly influential refinement (e.g., Julia Markovits). Explains *why* the surgeon lacks worth: their will isn't responsive to the *moral* reason (saving a life), only to the non-moral reason (impressing boss). If impressing the boss required harming the patient, they would have done *that*. Robustness captures this.
     *   **Surgeon Case:** **Strongly supports dismissal.** The surgeon's will is *not* responsive to the moral reason. Their action lacks robustness – they wouldn't necessarily save the life if it *didn't* impress the boss (or if harming did). The good outcome was accidental w.r.t. moral motivation.
     *   **Settled/Contested:** This modal/reasons-responsiveness view is a sophisticated development gaining traction, particularly in Kantian scholarship. It's not the *universal* interpretation of the slogan but addresses a key concern. It's contested by those who find counterfactual tests too demanding or metaphysically problematic.

  ### 5. **The Locus Claim: The Primary Object of Aretaic Evaluation is the Will/Intention, Not the Outcome**
     *   **Claim:** While outcomes matter morally in *some* ways (e.g., deontic permissibility, consequential value), the *specific* evaluation termed "moral worth" (or primary aretaic appraisal) is fundamentally an assessment *of the agent's will or motivation*.
     *   **Plausibility:** Very plausible and clarifies the slogan's core meaning. It's a claim about *what we are appraising* when we talk about "moral worth" or "acting virtuously" – the inner state and reasons for acting. Outcomes are a different *kind* of moral consideration.
     *   **Surgeon Case:** **Supports focus on motive.** Evaluating the surgeon's "moral worth" means looking at *why* they acted. The outcome's goodness belongs to a different moral category (e.g., the state of affairs is good, the act was perhaps deontically permissible).
     *   **Settled/Contested:** This is largely the settled core meaning among proponents. Disagreement arises over whether *other* important moral evaluations (like blame/praise, character assessment) *also* depend solely on the will (see Claim 3).

  ### Distinguishing Credits
  *   **Motivational (Aretaic) Credit:** Credit for acting from a good motive/character state. Directly tied to "moral worth." The surgeon **lacks** this entirely.
  *   **Deontic Credit:** Credit for performing a permissible/obligatory act. The surgeon *might* get this (they did their duty to save the life, even for a bad reason), though some Kantians argue fulfilling duty for the *wrong* reason lacks deontic worth too. **Contested.**
  *   **Outcome Value:** The patient living is a good state of affairs, regardless of how it came about. This is not "credit" *to the surgeon*, but value *in the world*.

  ### Summary for the Surgeon Case & Your Paper
  *   **Settled among slogan users:** The surgeon's act lacks *moral worth* because the intention is bad (Claim 1). The locus of "moral worth" evaluation is the will (Claim 5).
  *   **Contested but plausible:** The good outcome is irrelevant to *moral worth* (extreme version of Claim 1 moving towards Claim 3). The modal/reasons-responsiveness view (Claim 4) provides a powerful explanation for *why* the outcome is irrelevant to worth.
  *   **Radical & Contested:** Claiming outcomes are *literally irrelevant* to *all* aretaic appraisal (Claim 3) is the strongest support for completely dismissing the outcome, but it's the least plausible to non-Kantians.
  *   **Key Insight:** The slogan often **conflates** aretaic appraisal (motivation/character) with deontic appraisal (rightness/wrongness). Dismissing the outcome in the surgeon case relies on focusing *exclusively* on aretaic appraisal/moral worth. Showing that deontic appraisal or consequential valuation *can* incorporate the outcome, without denying the importance of intentions for moral worth, is crucial for precision. The modal claim (Claim 4) offers the most sophisticated defense of dismissing the outcome's relevance *to the specific question of moral worth*.

  Use this menu to argue that while the slogan correctly identifies the *core* of moral worth in the will, its use to *completely dismiss* outcomes often relies on contested interpretations (especially Claims 3 & 4) and risks conflating distinct moral evaluations (aretaic vs. deontic vs. consequential). The surgeon case powerfully illustrates Claim 1 (lack of worth due to bad intention), but doesn't necessitate adopting the radical Claim 3.
