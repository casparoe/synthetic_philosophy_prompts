  First, I need to unpack Strawson's argument. The Basic Argument says that for true moral responsibility, you need to be responsible for how you are mentally. But since your mental state comes from prior causes, you'd have to be responsible for those too, leading to an infinite regress. The only way out is being causa sui, which is impossible. The user’s insight is that framing this as a temporal regress might be the issue. If we think of the self as an atemporal, structural feature—like axioms in a system—then there's no prior state needing authorization. So why isn't this view more prominent in responses to Strawson?

