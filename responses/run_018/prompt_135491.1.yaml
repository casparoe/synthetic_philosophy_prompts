  Next, I should consider possible reasons why the modal-structural view isn't a mainstream rebuttal. Strawson’s focus is on ultimate moral responsibility (UMR), which requires self-creation. Even in an atemporal model, the structural features (character, dispositions) still need to be self-authored. How does the agent choose or control those features? If they're given, then UMR isn't achieved. The modal-structural view might dissolve the temporal regress but not the requirement of self-authorship.

