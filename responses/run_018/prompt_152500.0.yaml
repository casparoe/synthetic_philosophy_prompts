prompt: |-
  Act as a philosopher of ethics with expertise in moral psychology and structured classroom simulation. Before you draft anything, spend a brief paragraph reasoning through the exact in-game moment at which defending a practice must become socially expensive rather than honorable, then build the rules backward from that pivot.

  I am running a 75-minute seminar for twelve upper-level philosophy students. The topic has become personally urgent after I watched a professional norm I once accepted collapse almost overnight—not because anyone persuaded me it was wrong, but because continuing to uphold it suddenly made its defenders look out of touch. I want my students to feel that dynamic from the inside before they hear it named. The session should engage the question Bernard Williams and Kwame Anthony Appiah pose about moral revolutions: do practices like dueling or slavery end through arguments, through shifting interests, or through an honor economy that collapses? Design a runnable in-person game—no technology, no real money—centered on a constructed micro-norm I will call “the contradiction duty”: in a small professional guild, members are expected to publicly correct a peer’s error in formal assembly, or be seen as lacking integrity. The practice is defended with familiar moral language—accountability, transparency, intellectual courage—but maintaining it carries a hidden reputational cost that your rules must make tangible. The students should discover, through play, that the arguments against the duty sound identical before and after its collapse; what changes is the social price of holding the line. Do not lecture them about “honor revolutions” or present the Williams/Appiah framework until the debrief.

  Structure your response in the following sections, with approximate lengths:
  1. Design Logic (about 100 words): your reasoning for the rule choices and the pivot point.
  2. Setup and Roles (about 120 words): materials, role cards, initial conditions, and how students are assigned positions.
  3. Rules of Play (about 150 words): turn structure, available actions, how reputation is tracked visibly, and what triggers the shift in social cost.
  4. Payoff and Stakes (about 100 words): the non-monetary reward scheme—status within the game, alliance opportunities, visibility—so that coordination and defection feel consequential.
  5. Debrief: Mapping Experience to Theory (about 200 words): link specific in-game moments to the triad of argument, interest, and honor; introduce the Williams/Appiah thesis here; show precisely where the simulation reproduces real moral revolutions and where it does not.
  6. Predictable Failures and Fixes (about 100 words): what will go wrong the first time you run this, and how to handle it without breaking the experience.
  7. Limits of the Simulation (about 75 words): the feature of actual historical moral change that this classroom exercise cannot reproduce and that you must supply through guided discussion.

  Think carefully about which feature of the idea must appear in the rules rather than in your explanation afterward, and be frank about the gap. Do not provide a bibliography, reading list, or citations. Do not ask students to look up specific texts. Make sure the constructed “contradiction duty” feels realistic enough to generate genuine social pressure but niche enough that the activity is not something they have seen before.
reasoning: |-
  Okay, let me approach this ethics simulation design request methodically. The professor wants students to experience how moral norms collapse not through arguments but shifting social costs, inspired by Williams/Appiah's work on honor revolutions. 

  First, I need to identify the precise pivot point where defending a norm becomes socially expensive. This should occur when the perceived collective benefit of the norm dips below the individual reputational cost of enforcing it. The key is making this cost tangible through gameplay mechanics rather than explanation.

  For the "contradiction duty" micro-norm, I'll design it as a guild practice where public correction is mandatory. The hidden cost comes from two factors: the awkwardness of public confrontations and the growing perception that enforcers are rigid. The rules must make reputation tracking visible - perhaps through colored markers students display.

  The game should have three phases mirroring real moral revolutions: 
  1) Stable norm enforcement
  2) Rising enforcement costs
  3) Tipping point where defenders become liabilities

  Role assignments will create natural tensions - some players start as true believers, others as hesitant conformists. Non-monetary stakes like alliance tokens will make status feel valuable. During debrief, I'll connect specific game moments to Williams' concept of "thick concepts" losing their grip.

  Anticipating pitfalls: students might over-argue the norm's merits instead of feeling social pressure. The fix is to strictly limit verbal debate during gameplay, forcing them to react through behavioral choices. The simulation's key limitation is compressing years of social change into minutes - I'll highlight this gap during discussion.
answer: |-
  ## Ethical Norm Collapse Simulation: The Contradiction Duty

  **1. Design Logic (100 words):**  
  The pivot occurs when the *perceived collective benefit* of enforcing the norm dips below the *individual reputational cost* of enforcing it. Before this point, enforcing the duty signals integrity (honorable). Afterward, it signals rigidity or malice (socially expensive). Rules must make reputation *visibly tied to peer perception* and link enforcement actions to accumulating "awkwardness tokens" that subtly poison the enforcer’s standing. The key hidden cost is the *erosion of likability* and perceived collegiality when enforcing corrections, which eventually outweighs the virtue-signaling benefit. This shift must emerge from player interactions, not rules text.

  **2. Setup and Roles (120 words):**  
  **Materials:** 12 Role Cards, 12 Reputation Boards (publicly visible clipboards with "Integrity" & "Collegiality" sliders), 60 colored tokens (30 blue "Integrity", 30 red "Collegiality"), debate prompts (e.g., "Guild funds should prioritize archives vs. outreach").  
  **Roles:**  
  - **Traditionalists (4):** Start with high Integrity, moderate Collegiality. Must correct *any* factual error they hear.  
  - **Pragmatists (4):** Start balanced. Can correct but face higher Collegiality cost if correcting minor errors.  
  - **Reformers (4):** Start with high Collegiality, lower Integrity. Avoid correcting unless major error; face Integrity cost if silent on major error.  
  **Assign:** Randomly distribute roles. Explain basic duty: "Correcting peer errors in formal debate is essential for guild integrity."

  **3. Rules of Play (150 words):**  
  **Structure:** Three 15-minute debate rounds on different prompts.  
  **Actions per Round:**  
  1.  **Speak:** State position on prompt. Risk factual errors (subtly seeded by instructor).  
  2.  **Correct:** If error heard, enforcer *must* publicly correct it (state "I correct: [X] is inaccurate"). *All* enforcers pay 1 Collegiality token to their board.  
  3.  **Vote:** Secret ballot on the most "respected" speaker (not the *right* speaker). Top 3 gain 1 Integrity token.  
  **Reputation Tracking:** Boards display blue (Integrity) and red (Collegiality) tokens. Tokens are added/removed publicly per actions above.  
  **The Shift Trigger:** When any player’s red tokens (Collegiality cost) exceed their blue tokens (Integrity gain) *for the first time*, announce: "Noting a speaker's error now risks appearing overly critical." This crystallizes the rising cost. Subsequent Corrections cost *2* Collegiality tokens.

  **4. Payoff and Stakes (100 words):**  
  **Stakes:** "Respected Speaker" votes confer prestige (Integrity tokens). High Integrity grants influence (can propose rule changes in debrief). High Collegiality enables alliances (players can privately share 1 token with a high-Collegiality peer between rounds). **Rewards:** Win condition is subjective ("Who navigated the guild’s expectations best?"), but status is visible. Being voted "respected" feels validating. Alliance offers create peer validation. The public token boards make reputation tangible and fragile. Defection (silence when duty demands correction) risks Integrity loss but preserves Collegiality, creating tension.

  **5. Debrief: Mapping Experience to Theory (200 words):**  
  Start by asking: "What changed? The arguments against correcting were always there ('it's petty,' 'it disrupts discussion'). Why did they suddenly gain traction?"  
  *   **Argument:** Students will note anti-correction arguments existed but were ignored early on. Highlight: Arguments didn’t *cause* collapse; they became socially *acceptable* afterward.  
  *   **Interest:** Link Collegiality to social capital. Maintaining alliances became harder for enforcers as costs rose. Enforcing became against one’s social interest.  
  *   **Honor:** Early on, correcting signaled "integrity" (honorable). After the shift, it signaled "pettiness" or "rigidity" (dishonorable). The *meaning* of the action changed socially, not logically.  
  **Introduce Williams/Appiah:** "This mirrors historical shifts like dueling's end. Arguments against dueling existed for centuries. It collapsed when defending it made you look like a dangerous fool, not an honorable gentleman. The 'honor economy' supporting the practice evaporated. Your tokens modeled this economy."  
  **Reproduction:** The sim captures the sudden flip in social perception and the irrelevance of logical argument timing. **Gap:** It compresses years/decades into minutes and lacks external forces (e.g., economic pressure on slavery).

  **6. Predictable Failures and Fixes (100 words):**  
  *   **Failure:** Students debate the norm’s morality intellectually, not feeling social pressure.  
      *Fix:* Strictly enforce action phases ("Speak now," "Correct now," "Vote now"). Minimize open discussion; force actions. Remind them votes are for "respected," not "correct."  
  *   **Failure:** Players ignore the duty/costs, making the shift irrelevant.  
      *Fix:* As GM, subtly seed factual errors in prompts. If a Traditionalist ignores a correction, publicly deduct an Integrity token: "The assembly notes your silence." Increase token values if stakes feel low.  
  *   **Failure:** The shift isn’t dramatic.  
      *Fix:* Ensure the "cost exceeding benefit" trigger is announced dramatically. Physically move token boards to center stage.

  **7. Limits of the Simulation (75 words):**  
  This sim cannot replicate the *slow sedimentation of social disgust* or the role of *external catalysts* (e.g., abolitionist literature, war, economic change) that reshape interests over time. The pivot is artificially triggered by token math, not organic social evolution. Students experience the *consequence* of the honor economy collapsing, not its gradual erosion. Highlight this gap: "Real moral revolutions often brew beneath the surface for generations before the sudden collapse. Our game shows the collapse moment, not the slow boil."
