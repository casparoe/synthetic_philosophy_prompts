prompt: |-
  As a voting member of my hospital’s Clinical Ethics Committee, I am drafting the opinion for Thursday’s meeting, and the issue has become personally unavoidable since my father’s recent encounter with an algorithmic end-of-life forecast. Our institution now produces high-confidence six-month survival predictions for advanced heart-failure patients. The proposal before us would require disclosure of these forecasts to families upon request, even when the attending physician judges that knowing the number will alter the patient’s clinical path. The case that triggered this review involved a patient who, upon being told he had under three months, immediately withdrew from active management, relocated to hospice near an estranged child, and died within six weeks. His family argues that this was a “Damascus trajectory”: the prediction did not change the endpoint—he died, as the model implied he would—but it determined the path he took to get there, and had he never been told, he might have remained in treatment elsewhere for longer. They ask the committee to recognize a distinction between endpoint-fatalism and path-sensitive fatalism, and to permit physicians to withhold algorithmic forecasts when disclosure is likely to reroute care in ways the model cannot account for. The opposing members hold that autonomy requires disclosure of quantitative predictions when requested, that any causal effect of knowing is an empirical matter for the clinician to manage, not an ethical exemption, and that allowing “path judgment” to override transparency collapses into disguised paternalism.

  Please draft the short written opinion I will circulate before Thursday’s session. It should recommend a concrete course of action—approve the mandatory-disclosure proposal, reject it, or approve it with conditions—together with a specific implementation or review time frame. The opinion must take the “Damascus trajectory” argument seriously on its own terms: examine whether path-sensitive fatalism is a coherent ethical category in clinical disclosure, whether a physician’s prediction about “likely path alteration” can be operationalized without pure speculation, and whether withholding a requested forecast violates autonomy in a way that cannot be repaired by debriefing or counseling. Do not restate statutory definitions of informed consent; instead, engage the family’s position philosophically and identify the single strongest consideration on the side you do not recommend. Include one criterion the committee can apply to future requests that does not depend on counterfactual guesses about how long the patient “would have” lived without disclosure.
reasoning: |-
  Okay, the user is a voting member of a Clinical Ethics Committee drafting an opinion about disclosing algorithmic end-of-life forecasts. They need a balanced recommendation addressing the "Damascus trajectory" argument while considering autonomy and practical implementation. 

  This is deeply personal for them due to their father's experience, so I must acknowledge that emotional weight while maintaining professional objectivity. The core tension is between path-sensitive fatalism (withholding forecasts to preserve natural care trajectories) and autonomy (mandatory disclosure upon request).

  Hmm... the family's argument is philosophically nuanced - they're not claiming the prediction was wrong, but that knowing it altered the patient's path. The key questions are: 1) Is this path-altering effect ethically distinct? 2) Can clinicians practically judge when disclosure might cause such trajectory changes? 3) Does withholding violate autonomy irreparably?

  I find the autonomy argument stronger legally and ethically - patients have the right to prognostic information that affects life decisions. But the Damascus concern deserves serious engagement. Perhaps a conditional approval could bridge both: mandate disclosure but require clinicians to first explore why the family wants the forecast and how it might affect decisions. 

  For implementation, we should avoid unprovable counterfactuals ("how long they would've lived"). Instead, focus on whether the patient has decision-making capacity and whether the requester understands the forecast's limitations. A 12-month review period allows real-world testing.

  The strongest Damascus point is that algorithmic predictions can become self-fulfilling prophecies when they influence behavior. But this shouldn't override autonomy - instead, we mitigate it through contextual counseling. The written opinion should reflect this balanced approach while giving clear guidance.
answer: |-
  ## Clinical Ethics Committee Opinion: Algorithmic Prognostic Disclosure Policy (Advanced Heart Failure)

  **Recommendation:** Approve the mandatory disclosure proposal **with conditions**, effective immediately pending 12-month review. Disclose algorithmic 6-month survival predictions upon authorized request, but only after clinicians first conduct a structured "prognostic readiness assessment" (PRA) with the requestor(s).

  ### Core Reasoning
  The "Damascus trajectory" argument presents a profound ethical challenge. **Path-sensitive fatalism is coherent:** Knowledge can actively reshape the journey towards an inevitable endpoint, distinct from merely accepting the endpoint itself. Algorithmic predictions, presented as objective data, possess unique power to trigger such path-altering decisions. While the committee affirms patient/family autonomy as paramount, autonomy is best served by contextual understanding, not raw data dumps. Disclosing a stark numerical prediction without exploring its potential impact risks substituting algorithmic determinism for genuine choice. The family’s concern that disclosure itself can become an uncontrolled intervention is valid.

  However, withholding requested information outright violates core autonomy principles. The solution lies not in concealment, but in **enhancing the disclosure process** to mitigate path-altering risks while honoring the right to know. A physician’s judgment about *potential* path alteration is inherently speculative; we cannot reliably predict how any individual will integrate prognostic knowledge. Instead, we must ensure the recipient is prepared to integrate this sensitive information meaningfully.

  ### Proposed Implementation & Conditions
  1.  **Mandatory Prognostic Readiness Assessment (PRA):** Prior to disclosing the algorithmic forecast, the attending physician (or designated palliative/supportive care clinician) *must* conduct a structured conversation with the requestor(s). This PRA must cover:
      *   **Understanding of Prognosis:** Confirming comprehension of the patient’s clinical condition and trajectory based on clinical judgment.
      *   **Motivation for Request:** Exploring *why* the quantitative prediction is sought (e.g., planning, seeking certainty, understanding treatment options, emotional preparation).
      *   **Impact Exploration:** Explicitly discussing *how* knowing the number might influence potential decisions (e.g., "If the prediction were very short, how might that affect your thinking about treatment or plans?"). Discuss the model's limitations and the concept of path-sensitive effects.
      *   **Support Systems:** Assessing available emotional/social support and offering immediate connection to counseling, social work, or chaplaincy.
  2.  **Disclosure with Context:** Following the PRA, disclose the algorithmic prediction *verbally*, immediately contextualizing it within the clinical picture and the discussion just held. Avoid simply handing over a number in isolation. Provide written summary documentation.
  3.  **Ongoing Support Mandate:** Document the disclosure and ensure mandatory follow-up within 48-72 hours to address questions, emotional responses, and decision-making support. Integrate the prediction into ongoing goals-of-care conversations.
  4.  **Review Period:** Implement this policy for 12 months. Track:
      *   Frequency of requests and disclosures.
      *   Themes identified in PRAs (motivations, concerns).
      *   Qualitative feedback from families and clinicians on the process.
      *   Any perceived instances of significant "Damascus trajectories" potentially triggered *despite* the PRA process.
      *   Review findings at the 12-month CEC meeting to assess effectiveness and consider modifications.

  ### Future Request Criterion
  **The single criterion for disclosure, independent of counterfactual lifespan guesses, is: *Has a structured Prognostic Readiness Assessment (PRA) been completed with the authorized requestor(s) to explore motivations, potential impacts, and support needs?*** This focuses on process and preparedness, not speculative outcomes.

  ### Acknowledging the Strongest Counter-Argument
  The committee acknowledges the **strongest argument against our conditional approval** is the pure autonomy stance: Any competent patient or authorized surrogate has an inviolable right to access all information relevant to their care upon request, including algorithmic prognostic data. Withholding it, even temporarily for a PRA or based on concerns about interpretation, constitutes unacceptable paternalism that undermines the fundamental right to self-determination. The potential for path-altering effects, while real, is an inherent part of informed decision-making that the individual must navigate, not a justification for clinician gatekeeping. Debriefing after disclosure cannot fully remedy the initial violation of the right to timely information.

  **Conclusion:** By mandating a robust preparatory dialogue (PRA) before disclosure, we strive to honor autonomy while mitigating the unique risks of path-alteration posed by high-confidence algorithmic predictions. This approach acknowledges the reality of the Damascus trajectory without resorting to information withholding, promoting ethically sound, context-rich decision-making. We recommend approval of the disclosure policy with the mandatory PRA and support conditions outlined above, effective immediately, with a 12-month review.

  ---
  **Vote Recommendation:** Approve Policy with Conditions (PRA Mandate)
