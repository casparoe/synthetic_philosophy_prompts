answer: |-
  Here’s a structured agenda for your working group, prioritizing conceptual questions based on their upstream leverage, tractability for theoretical work, and potential to reduce partisan misuse, with clear criteria for ranking:

  ### **Core Tension**: Procedural Erosion vs. Substantive Erosion  
  *Key Problem*: These dimensions often diverge (e.g., Turkey’s expanded direct democracy amid weakened judicial independence). This fuels accusations of partisan asymmetry in applying "backsliding."

  ---

  ### **Ranked Conceptual Questions for Clarification**  
  *(Criteria: Importance, Tractability, Neglectedness, Misuse Risk)*  

  1. **What Constitutes the "Minimum Core" of Democracy?**  
     - *Why Upstream?*: Until the essential function of democracy is defined (e.g., "self-rule with equal agency" vs. "procedural contestation"), debates about erosion lack a baseline. Resolving this anchors all other distinctions.  
     - *Tractability*: High. Political theorists can draw on deliberative democracy, liberal-egalitarian, and republican traditions to map non-empirical boundaries.  
     - *Evidence Shifting Priority*: Rising use of "illiberal democracy" rhetoric (e.g., Hungary, Poland) would heighten urgency. If courts increasingly reference substantive rights as constitutive (e.g., ECtHR rulings), this moves down the list.  
     - *Misuse Risk*: Critical. Without this, accusations of backsliding default to partisan proceduralism ("they changed rules") or moralism ("they oppressed minorities").  

  2. **Does Democratic Health Require Procedural-Substantive Synchronicity?**  
     - *Why Upstream?*: Determines whether divergence (e.g., referendums expanding while courts are packed) is inherently backsliding or a democratic innovation. Affects all threshold judgments.  
     - *Tractability*: Moderate. Requires interdisciplinary dialogue: lawyers on institutional interdependence, theorists on legitimacy, sociologists on social trust.  
     - *Evidence Shifting Priority*: Empirical cases where divergence *increases* public trust (rare) or accelerates authoritarian consolidation (common) would clarify stakes.  
     - *Neglectedness*: High. Literature fixates on erosion, not managed tension between dimensions.  

  3. **When Does Incremental Change Become Systemic Erosion?**  
     - *Why Upstream?*: Addresses the "ordinary contestation" problem. Distinguishes legitimate reform (e.g., filibuster adjustments) from death-by-a-thousand-cuts backsliding (e.g., Poland’s judicial "reforms").  
     - *Tractability*: Moderate. Conceptual work on institutional tipping points (e.g., constitutional lawyers on unamendable norms) is feasible without new data.  
     - *Evidence Shifting Priority*: If more democracies adopt "anti-backsliding" early-warning mechanisms (e.g., EU rule-of-law framework), theoretical refinement becomes urgent.  
     - *Misuse Risk*: Partisans exploit ambiguity to frame all opposition as "erosion."  

  4. **Who Has Epistemic Authority to Declare Backsliding?**  
     - *Why Downstream?*: Depends on prior answers about what democracy *is* and how erosion manifests.  
     - *Tractability*: Lower. Entangles with empirical legitimacy (e.g., do citizens trust courts vs. NGOs?) and is context-dependent.  
     - *Neglectedness*: Low. Extensive debate exists (e.g., international bodies vs. domestic actors).  

  ---

  ### **Top Practical Implications if Resolved**  
  *(For journalists, judges, citizens in cases like Hungary/US)*  

  1. **A Threshold Test for "Minimum Democratic Functionality"**  
     - *Impact*: Judges/journals could distinguish policy disputes (e.g., tax reforms) from regime-threatening acts (e.g., disenfranchising minorities).  
     - *Why Transformative?*: Prevents dilution of the term by setting a floor: e.g., if elections lack opposition access *and* courts can’t review abuses, backsliding is confirmed regardless of partisan claims.  
     - *Criteria Met*: High importance (ends paralysis over "how bad is bad?"), reduces misuse (non-partisan baseline).  

  2. **A Framework for Assessing Divergence**  
     - *Impact*: Clarifies when procedural "innovation" (e.g., US voter initiatives, Turkey’s executive referendums) masks substantive erosion.  
     - *Why Transformative?*: Journalists could report: "This referendum expands participation but cripples oversight mechanisms, net eroding democracy." Citizens gain tools to evaluate trade-offs.  
     - *Criteria Met*: High neglect (current discourse treats dimensions in isolation), partisan misuse risk (e.g., touting referendums as "democratic" while ignoring rights erosion).  

  3. **Differentiating Democratic Reform from Backsliding**  
     - *Impact*: Judges could adopt a "systemic effect" standard: Do changes insulate power from challenges *and* curtail rights? (e.g., Poland’s judicial council vs. UK’s Supreme Court expansion).  
     - *Why Transformative?*: Ends false equivalence between norm-breaking (e.g., US Jan 6th) and norm-affirming contestation (e.g., court-packing debates in FDR era).  
     - *Criteria Met*: High tractability (conceptual sequencing tools exist), importance (prevents delegitimizing necessary reforms).  

  ---

  ### **Why This Agenda?**  
  - **Upstream Focus**: Questions 1–3 tackle the *foundations* of what backsliding *is*, avoiding empirical rabbit holes.  
  - **Combatting Partisan Misuse**: By defining core functionality (#1) and divergence (#2), the framework becomes harder to weaponize asymmetrically.  
  - **Tractability Balance**: Prioritizes questions theory *can* resolve without new data (e.g., "minimum core" over "who decides").  
  - **Practitioner Shift**: Resolving #1 and #2 equips journalists to avoid false balance, judges to identify constitutional rot, and citizens to spot substantive decline masked by proceduralism.  

  This agenda forces the group to confront democracy’s purpose *first*—because without that, backsliding is just a slur for "changes I dislike."
