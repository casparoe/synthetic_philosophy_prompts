prompt: |-
  I am preparing a position statement on the ethics of humanitarian intervention for a policy institute's working group, and before circulating it I want a rigorous consistency audit of the commitments I intend to defend. Here is the full set:

  1. NATO's 1999 intervention in Kosovo was justified, even though it proceeded without Security Council authorization.
  2. The 2003 invasion of Iraq was not justified, and its failure was not merely a failure of execution or intelligence; it was illegitimate in principle.
  3. What ultimately distinguishes legitimate from illegitimate interventions is the genuinely humanitarian motive of the interveners, not the presence or absence of a legal mandate. Law tracks legitimacy imperfectly at best.
  4. The 2011 intervention in Libya was justified when it began, but NATO's expansion of the mission from protecting civilians to pursuing regime change was a betrayal of the authorizing resolution's terms, and that overreach is precisely what made the campaign, taken as a whole, illegitimate.
  5. State sovereignty is a genuine moral value, not merely a legal convenience, and unauthorized intervention damages the international order in ways that must be counted as real costs, even when the intervention succeeds.
  6. A Security Council veto (or threatened veto) by an interested power cannot function as a moral veto on humanitarian rescue; if it did, the most atrocity-prone situations would be systematically unaddressable.

  My questions are these. First, are all six commitments jointly tenable, or do some of them rest on incompatible pictures of where the legitimacy of an intervention comes from? I am especially interested in whether the standard I use to sort the cases is one standard or two different standards applied opportunistically. Second, identify any tensions that are only apparent and dissolve on inspection, so that I do not waste the group's time defending against objections that miss. Third, for each genuine tension, state exactly which commitment would have to be revised or abandoned to resolve it, and what that revision would cost me in terms of the case verdicts I want to keep. Please rank the tensions by severity rather than treating them as equally serious.

  I am not asking for a survey of positions in the literature. I want a committed verdict: tell me which single revision to my set restores the most consistency at the lowest cost, defend that choice against the next-best alternative, and be explicit about where you are confident and where your reasoning depends on a contestable premise.
reasoning: |-
  Okay, let me approach this systematically. The user presents six commitments about humanitarian intervention ethics and wants a rigorous consistency audit. They're preparing a policy position statement and need to ensure their arguments hold together logically.

  First, I need to map the core tensions. The key challenge lies between Commitment 3 (humanitarian motive as primary legitimacy source) and Commitment 5 (sovereignty as intrinsic moral value). These create friction because motive-focused justification risks undervaluing systemic harms to international order that Commitment 5 emphasizes. 

  Looking at the case applications: Kosovo (C1) and Libya's initial phase (C4) are approved despite lacking UN authorization, consistent with C3 and C6. But Iraq (C2) is rejected while Libya's regime change (C4) is condemned - both involving regime change, yet judged differently. The Libya distinction suggests motive alone isn't sufficient; conduct matters too. That points to an unstated criterion about mission scope integrity.

  The apparent tension between condemning Iraq's regime change (C2) while accepting Kosovo's unauthorized action (C1) actually resolves under scrutiny. Kosovo had multilateral consensus and clear immediate humanitarian purpose, whereas Iraq lacked credible WMD/humanitarian evidence from the start. The real problem is Commitment 3's phrasing - "genuinely humanitarian motive" is necessary but perhaps insufficient when it conflicts with Commitment 5's sovereignty value.

  I notice Commitment 6 (vetoes shouldn't block rescue) and Commitment 5 (unauthorized intervention damages order) pull in opposite directions. But this isn't fatal - it reflects the tragic reality that sometimes breaking rules is necessary yet still costly. The tension here is productive rather than contradictory.

  The most severe inconsistency surfaces in Libya (C4): how can initial intervention be "justified" if the subsequent overreach was foreseeable? This exposes a gap in the framework - the commitments need an explicit distinction between ex ante justification (based on available information) and ex post judgment (with hindsight).

  For resolution, I'd recommend revising Commitment 3 to include both motive AND conduct constraints. Adding "adherence to declared humanitarian objectives" would maintain Kosovo/Iraq distinctions while explaining Libya's shift from legitimate to illegitimate. The cost? It slightly weakens the purity of motive-centric theory but gains consistency. Alternative fixes like weakening Commitment 5 would undermine the valuable insight about sovereignty's moral weight.

  Throughout, I'm confident about the Libya/Kosovo contrast holding up under this revised standard. Less certain is whether the "foreseeable overreach" issue requires additional safeguards - but that's beyond the current scope. The proposed edit makes the position more robust without sacrificing core cases.
answer: |-
  Here is a rigorous consistency audit of your six commitments, ranked by severity of tension, with actionable recommendations:

  ### Core Tension (Severity: High)  
  **Conflict:** Commitment 3 (motive as ultimate legitimacy criterion) vs. Commitment 5 (sovereignty as intrinsic moral value + systemic costs).  
  - **Problem:** C3 grounds legitimacy *entirely* in subjective motive ("genuinely humanitarian"), while C5 treats sovereignty as an objective moral constraint that persists even when motives are pure. This creates two issues:  
    1. **Moral Incommensurability:** If sovereignty has intrinsic weight (C5), bypassing it requires justification beyond good intentions (contra C3's sufficiency claim).  
    2. **Systemic Costs:** C5 insists unauthorized interventions harm international order *regardless of motive*, yet C3 implies these costs are irrelevant if motives are humanitarian.  
  - **Revision Required:** Amend C3 to acknowledge sovereignty as a *countervailing moral barrier* even in humanitarian crises.  
    **Proposed Rewrite:**  
    > "What ultimately distinguishes legitimate from illegitimate interventions is the **conjunction of (a) genuinely humanitarian motive, (b) adherence to declared humanitarian objectives, and (c) the gravity of the atrocities outweighing sovereignty's moral value and systemic costs**."  
  - **Cost:** Weakens the purity of motive-centric legitimacy but saves C5 and better explains Libya/Iraq distinctions. Allows condemnation of Libya's overreach (C4) as violating (b).  

  ### Secondary Tension (Severity: Medium)  
  **Conflict:** Commitment 4 (Libya's initial justification) vs. Commitment 5 (sovereignty/systemic costs).  
  - **Problem:** If unauthorized interventions inherently damage international order (C5), how can Libya's *initial* phase be justified? C4 implies systemic costs were acceptable *until* mission creep, but C5 suggests costs were incurred at inception.  
  - **Resolution:** This tension is *apparent* if you interpret C5 as stating sovereignty/systemic costs *must be weighed* (not absolute vetoes). Libya's initial phase (C4) could be justified if:  
    - The imminent massacre in Benghazi (R2P threshold) outweighed sovereignty costs *at that moment*.  
    - The *later* overreach compounded costs *unjustifiably*.  
  - **No Revision Needed:** Emphasize in your statement that C5's costs are *factors in proportionality*, not trumps.  

  ### Tertiary Tension (Severity: Low)  
  **Conflict:** Commitment 1 (Kosovo justified sans UNSC) vs. Commitment 2 (Iraq illegitimate).  
  - **Apparent Contradiction:** Both lacked UNSC authorization; why is one legitimate and the other not?  
  - **Resolution:** This dissolves under C3/C6:  
    1. Kosovo had compelling evidence of ethnic cleansing; Iraq lacked evidence of WMDs/imminent threat (invalidating humanitarian pretext).  
    2. Kosovo had broad multilateral support (NATO + regional backing); Iraq lacked consensus.  
    3. Iraq involved deception about motives (violating C3's "genuine" requirement).  
  - **No Revision Needed:** The cases are distinguished by *motive authenticity* (C3) and *multilateral legitimacy* (implied in C6).  

  ### Why This Revision Maximizes Consistency at Lowest Cost  
  1. **Saves Core Cases:** Kosovo (C1) and Libya’s initial phase (C4) remain justifiable under the revised C3, as motives were credibly humanitarian *and* atrocities were extreme. Iraq (C2) fails on motive grounds.  
  2. **Explains Libya's Illegitimacy:** Regime change violated (b) in revised C3 ("adherence to objectives").  
  3. **Preserves Sovereignty’s Weight:** Revised C3 explicitly balances humanitarian urgency against sovereignty/systemic harm (satisfying C5).  
  4. **Retains Anti-Veto Principle:** C6 survives intact, as deadlock due to self-interested vetoes doesn’t automatically outweigh humanitarian need.  

  ### Defending Against the Next-Best Alternative  
  - **Alternative:** Weaken C5 (e.g., "sovereignty is valuable but secondary to human protection").  
  - **Why Inferior:**  
    - **Costs More:** Forces abandonment of your realism about international order (a key nuance in your position).  
    - **Undermines Iraq/Libya Critique:** If sovereignty is merely "secondary," unauthorized regime change becomes harder to condemn absent bad motives.  
    - **Ignores Systemic Reality:** C5’s moral weight reflects the empirical link between sovereignty norms and stability. Dismissing this risks endorsing neo-imperialism disguised as humanitarianism.  

  ### Contestable Premises  
  - **Confident:** Kosovo/Iraq distinction is defensible under revised C3; Libya’s mission creep violates integrity-of-purpose.  
  - **Contestable:** Whether "gravity of atrocities" can be objectively measured sufficiently to outweigh sovereignty. Critics may argue this opens the door to subjective assessments akin to motive. *Rebuttal:* Atrocity gravity (scale, imminence) is more empirically verifiable than motive purity.  

  ### Recommended Single Revision  
  **Revise Commitment 3 to:**  
  > "What ultimately distinguishes legitimate from illegitimate interventions is the **conjunction of (a) a genuinely humanitarian motive, (b) strict adherence to declared humanitarian objectives, and (c) the gravity of the atrocities being sufficient to override sovereignty's moral value and the systemic costs of unauthorized action**."  

  This preserves 5/6 commitments unchanged, resolves the core tension, and strengthens your framework’s coherence at the cost of making C3 slightly less elegant but more robust.
