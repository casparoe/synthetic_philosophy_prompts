prompt: |-
  hey so i just got pulled onto my co-op building's board and we had this nasty fight over garden rules — renters, owners, and people across the street who use the space all wanted different things. now im kind of obsessed with who actually counts as the people when we talk about democracy. it felt circular: the ones who can vote decide who gets to vote.

  i run a small philosophy workshop, about 12 people, 75 minutes. i want an in-class game or structured role-play that makes participants feel that circularity and the tension between being affected by a decision and being part of the group that makes it. the rules and payoffs should make them run into the problem themselves before anyone names it. please design roles, token payoffs (no real money), materials, and a debrief that maps moments in the game onto the boundary problem. also tell me what will predictably occured the first time i run it and how to handle it.

  please build in an idea about recursive constituency — round one members vote on membership rules for round two, but the round-one decision changes who is affected in round two — plus a boundary externality where people near the membership line have an incentive to push it. keep it fully analog, no tech needed.

  please seperate what's settled from what's genuinely contested in democratic theory — don't present the all-affected-interests principle or the all-subjected principle as the obvious consensus. also be frank about which feature of the boundary problem the activity simply cant reproduce and you'll need to supply in the debrief, and avoid any reading lists or citations since i want this runnable for people without library access.
reasoning: |-
  We are designing an in-class game/role-play for a philosophy workshop to explore the boundary problem in democracy: who counts as "the people" with the right to participate in collective decisions? The game should have recursive constituency (members of round one decide membership rules for round two, which changes who is affected in round two) and boundary externalities (those near the membership line have an incentive to push it). We'll use token payoffs (like points) and analog materials.

  Game Title: The Garden Boundary Game

  Overview:
  Participants will role-play as stakeholders in a community garden. There are two rounds. In Round 1, a starting group of participants (the initial "members") will decide on a set of rules for membership in the garden for Round 2. Then, in Round 2, the newly defined membership group will decide on a distribution of garden benefits. The twist is that the membership rules set in Round 1 will determine who gets to vote in Round 2, and the decision in Round 2 will affect not only the members but also some non-members. We'll also include a boundary externality by having a group of "nearby residents" who might be included or excluded by the membership rules and who are affected by the garden but not necessarily members.

  Key Concepts to be Experienced:
  1. The circularity: The current members decide who gets to be a member in the next round (and thus who gets to vote in the next decision).
  2. Tension between being affected and having decision-making power: Some people who are affected by the garden (e.g., by its aesthetics, noise, or by being excluded from benefits) may not get to vote.
  3. Boundary externality: Those near the membership line (e.g., residents just across the street) have an incentive to be included because they are affected and because they might gain from the garden benefits.

  Roles and Materials:

  Roles (for 12 participants):
  - 5 initial members (Owners): They live in the co-op building and have been the traditional decision-makers for the garden. They have a high stake in the garden because they use it daily and it affects their property value.
  - 3 renters: They live in the co-op building but are not owners. They use the garden and are affected by its rules, but historically have not had voting rights.
  - 4 nearby residents: They live across the street from the garden. They can see the garden from their windows and sometimes use it (if allowed), but they are not part of the co-op. They are affected by noise, aesthetics, and sometimes by the garden's rules (e.g., if they are allowed to enter). However, they are not initially members.

  Note: The initial setup for Round 1 voting will only include the 5 owners. The renters and nearby residents are present but cannot vote in Round 1. The renters and nearby residents can, however, lobby and try to influence the owners during the discussion.

  Materials:
  - Role cards (12): Each describes the role, their initial status (member or not), and their interests.
  - Rule cards (for Round 1): A set of options for membership rules for Round 2. We'll have 3 options (written on large paper or board for all to see):
      Option A: Only owners are members (so Round 2 voters: owners only).
      Option B: Owners and renters are members (Round 2 voters: owners and renters).
      Option C: Owners, renters, and nearby residents are members (Round 2 voters: all 12).
  - Benefit distribution cards (for Round 2): A set of options for how to distribute garden benefits (points). We'll have 3 options (written on large paper or board):
      Option X: Benefits mostly to owners (e.g., owners get 10 points each, renters get 3, nearby residents get 1).
      Option Y: Equal distribution per person (all get 5 points).
      Option Z: Distribution based on proximity (owners get 8, renters get 6, nearby residents get 4).
  - Tokens: Representing garden benefits (points). We can use paper chits or just keep score on a board.
  - Timer: For discussion periods.

  Game Flow:

  Phase 0: Setup and Role Assignment (5 minutes)
  - Assign roles randomly: 5 owners, 3 renters, 4 nearby residents.
  - Hand out role cards. Read aloud the common scenario: "We are in a co-op building with a community garden. The garden provides benefits (like fresh produce, beauty, recreation) but also requires rules (about use, maintenance, access). The garden is currently managed by the owners. Now, we are going to have two rounds of decision-making."

  Phase 1: Round 1 - Membership Rule Decision (20 minutes)
  - Only the 5 owners can vote in Round 1.
  - Task: The owners must decide on a membership rule for Round 2 (Option A, B, or C). This decision will determine who can vote in Round 2.
  - But: All participants (including renters and nearby residents) can participate in a 10-minute open discussion to try to influence the owners.
  - After discussion, the owners vote by secret ballot or show of hands. Majority wins. If tie, flip a coin.
  - Outcome: Announce the chosen rule and thus who will be the members (voters) in Round 2.

  Phase 2: Round 2 - Benefit Distribution Decision (20 minutes)
  - The membership group now is defined by the rule chosen in Round 1. Only they can vote.
  - Task: The current members (as defined by the Round 1 rule) must decide on a distribution of garden benefits (points) for the upcoming year (Option X, Y, or Z). Note: The distribution will affect ALL participants (including non-members) but only members vote.
  - Non-members can observe and may be allowed to speak during a 10-minute discussion (if time allows, but they cannot vote). Alternatively, the facilitator can allow non-members to make short pleas during the discussion.
  - Then, the members vote on the distribution option.

  Phase 3: Distribution and Scoring (5 minutes)
  - The facilitator distributes points according to the chosen distribution option. Everyone (even non-members) gets the points as per the option.

  Debrief (25 minutes):
  Guide the discussion with the following questions. Map moments in the game to the boundary problem.

  1. Initial Reactions:
     - How did you feel during the game? (especially non-voters in Round 1 and possibly Round 2)

  2. Circularity:
     - "In Round 1, the owners decided who would be in the membership for Round 2. How did that feel? Did you notice that the group that had power in Round 1 set the rules for who would have power in Round 2? How does this relate to the question of 'who decides who gets to decide'?"

  3. Affected vs. Membership:
     - "Who was affected by the garden? (All: by benefits, by the look, by noise, etc.) But who got to vote in Round 2? How did the Round 1 decision change who was affected in Round 2? (Note: The distribution decision in Round 2 affected everyone, but the membership in Round 2 determined who got to decide that distribution.)"
     - "Did anyone feel they were affected but didn't get a vote? How did that feel?"

  4. Boundary Externality:
     - "Nearby residents: How much were you affected by the garden? Did you have an incentive to be included? Why?"
     - "Owners and renters: How did you view the nearby residents? Did you consider including them? Why or why not?"
     - Highlight: Those near the boundary (like the nearby residents) have an incentive to push for inclusion because they are affected and because they can then influence the distribution to their benefit.

  5. Contested Principles:
     - "What principles were used in making the membership rule? (e.g., property ownership, residence, being affected)"
     - Note: In democratic theory, there is no consensus. Two major principles:
          - All-affected interests principle: Those affected by a decision should have a say.
          - All-subjected principle: Those who are subject to the rules (i.e., must obey them) should have a say.
     - But in the game, the owners in Round 1 might have used other criteria (like self-interest, tradition, or fairness). Point out that in the real world, these principles are contested and often in tension.

  6. What the Game Can't Capture:
     - The game simplifies by having discrete groups and clear boundaries. In reality, the boundary might be fuzzy (e.g., how affected is enough to be included?).
     - The game doesn't address how the initial group (the owners) got their authority. In reality, there might be a historical process that is hard to justify democratically.
     - The game has a fixed set of people, but in reality, the constituency might change over time (e.g., future generations, new residents).

  Predictable Issues and Handling:

  1. Predictable Issue: Disengagement of non-voters (especially nearby residents in Round 1 and possibly Round 2).
     - Handling: Encourage active participation in the discussion phase. Remind them that they can try to persuade voters. Also, in the debrief, highlight their perspective to validate their experience.

  2. Predictable Issue: Owners might choose Option A (only owners) to maintain power, leading to frustration among others.
     - Handling: This is a teachable moment. In debrief, discuss why they chose that and how it reflects real power dynamics.

  3. Predictable Issue: Renters and nearby residents might form an alliance to push for Option C (all included) in Round 1, but they can't vote. How?
     - Handling: They can lobby the owners. Some owners might be sympathetic (if they see fairness or if they are persuaded by the argument of affectedness). This is part of the game.

  4. Predictable Issue: In Round 2, if the membership is expanded, the new members might vote for a distribution that benefits them, which could be seen as unfair by the original owners.
     - Handling: This is the boundary externality in action. In debrief, note that when the boundary shifts, the new members have an incentive to vote for their own interests, which might be at the expense of others.

  5. Predictable Issue: Time management.
     - Handling: Strictly enforce time limits. Have a visible timer.

  6. Predictable Issue: Some participants might not take the points seriously.
     - Handling: Emphasize that the points represent real benefits (like access to garden produce, a nicer view, etc.) and that accumulating more points is better.

  This design should create a tangible experience of the circularity and tensions in defining the demos, with the recursive structure and boundary externalities built in. The debrief will help connect the game experience to the philosophical problem.
answer: |-
  ### **The Boundary Circle Game**  
  A 75-minute structured role-play exploring democratic circularity, recursive constituency, and boundary externalities. Participants experience tension between "being affected" and "having a voice," then debrief how this mirrors real-world boundary problems.

  ---

  ### **Materials Needed**  
  - **Role Cards**: 12 cards (3 types, described below).  
  - **Voting Tokens**: Colored paper squares (green for Round 1 voters, red for Round 2 voters).  
  - **Benefit Chips**: Three colors of poker chips or paper circles (blue = 3 points, yellow = 2, white = 1).  
  - **Rule Sheets**: 3 options for Round 1 voting (printed or large posters).  
  - **Scoreboard**: Poster or chalkboard to track points.  
  - **Timer**: For discussion/voting phases.  

  ---

  ### **Game Setup**  
  **Roles (12 Players)**:  
  1. **Core Residents (4)**: Live *in* the building. Start with Round 1 voting rights. Receive high baseline benefits from the garden (e.g., quiet, direct access). *Incentive*: Restrict membership to preserve control/benefits.  
  2. **Peripheral Residents (4)**: Live *adjacent* to the building (e.g., same block). No Round 1 voting rights. Moderately affected by garden (e.g., noise, shared aesthetics). *Incentive*: Push for inclusion to gain benefits/voting power.  
  3. **Outsiders (4)**: Live *across the street*. No voting rights. Mildly affected (e.g., visual pollution or occasional access). *Incentive*: Advocate for inclusion to avoid exclusion or gain points.  

  **Token Economy**:  
  - Points from Benefit Chips determine "quality of life" (hypothetical). No real money.  
  - **Blue chip** = 3 pts, **yellow** = 2 pts, **white** = 1 pt.  

  ---

  ### **Game Rules**  
  #### **Phase 1: Round 1 (20 min)**  
  - **Task**: Core Residents (4 players) vote on **membership rules for Round 2**.  
  - **Rule Options** (voters choose one):  
    - **Option A**: Only Core Residents vote in Round 2.  
    - **Option B**: Core + Peripheral Residents vote.  
    - **Option C**: All 12 players vote.  
  - **Process**:  
    1. *Open Lobbying (7 min)*: All players discuss rules. Peripheral/Outsiders can persuade Core Residents.  
    2. *Vote (3 min)*: Core Residents vote secretly (tokens into a box). Majority wins.  
    3. *Announce Outcome*: New membership rules set for Round 2.  

  #### **Phase 2: Round 2 (25 min)**  
  - **Task**: The *newly defined voting group* (based on Round 1 outcome) decides **how to distribute 30 Benefit Chips** (worth points).  
  - **Distribution Options** (voters choose one):  
    - **Option X**: Core-heavy (Cores get 3 chips each; others get 1).  
    - **Option Y**: Equal (Everyone gets 2 chips).  
    - **Option Z**: Proximity-based (Cores: 2 chips; Peripherals: 3 chips; Outsiders: 1 chip).  
  - **Process**:  
    1. *Open Lobbying (7 min)*: All players discuss. Non-voters can speak but not vote.  
    2. *Vote (3 min)*: Voting group (as defined in Round 1) chooses distribution.  
    3. *Distribute Chips*: Assign chips based on outcome. Calculate points.  

  #### **Phase 3: Scoring (5 min)**  
  - Players tally points from chips.  
  - **Scoreboard Example**:  
    | Role              | Chips Received | Points |  
    |-------------------|----------------|--------|  
    | Core Resident     | 3 blue         | 9      |  
    | Peripheral Resident| 2 yellow       | 4      |  
    | Outsider          | 1 white        | 1      |  

  ---

  ### **Predictable Outcomes & How to Handle Them**  
  1. **Core Residents hoard power (Option A)**:  
     - *Likely*: They’ll exclude others to control Round 2.  
     - *Handling*: Highlight in debrief how this mirrors historical gatekeeping. Ask: "Did this align with who was *affected*?"  

  2. **Peripheral/Outsiders form coalitions**:  
     - *Likely*: They’ll lobby Core Residents hard in Round 1.  
     - *Handling*: Note how "boundary externality" incentivizes pushing for inclusion.  

  3. **Frustration among non-voters**:  
     - *Likely*: Outsiders/Peripherals feel ignored despite being affected.  
     - *Handling*: Validate this in debrief—it’s central to the tension.  

  4. **Round 2 voters prioritize self-interest**:  
     - *Likely*: If Option B/C wins, new voters may choose Option Y/Z to benefit themselves.  
     - *Handling*: Ask: "Did the new voters consider *others* affected, or just themselves?"  

  ---

  ### **Debrief (25 min)**  
  **Guiding Questions**:  
  1. **Circularity**:  
     - "Who decided the voting rules for Round 2? How did that group’s interests shape who was included?"  
     - *Map to game*: Core Residents set Round 2 rules → determined who decided chip distribution.  

  2. **Affected vs. Included**:  
     - "Peripheral Residents and Outsiders: How were you affected by the garden? Did your voice match your stake?"  
     - *Map to game*: Noise/aesthetics affected all, but only some voted.  

  3. **Recursive Constituency**:  
     - "In Round 1, you set rules for Round 2. How did that change who was impacted by the chip decision?"  
     - *Key insight*: Round 1’s membership rule altered who had power *and* who was affected in Round 2 (e.g., if Peripherals gained votes, they then influenced chip distribution).  

  4. **Boundary Externality**:  
     - "Peripheral Residents: You were *close* to inclusion. Did you fight harder to be included? Why?"  
     - *Map to game*: Their moderate stake created urgency to cross the boundary.  

  5. **Contested Principles**:  
     - "What criteria *should* decide membership? Those affected? Those subjected to rules? Those who own property?"  
     - *Stress*: No consensus in democracy. Philosophers clash on:  
       - **All-Affected Principle**: Anyone impacted deserves a voice.  
       - **All-Subjected Principle**: Only those bound by the rules deserve a voice.  
     - *Game reflection*: "Did either principle ‘win’ here? Why/why not?"  

  **Limitations of the Activity**:  
  - ✘ **The game assumes fixed stakes**: Real-world "affectedness" is fluid (e.g., future generations, changing environments).  
  - ✘ **No historical injustice**: The game starts with arbitrary roles. Real boundaries often embed past exclusion (e.g., property laws).  
  - ✘ **Simplified power dynamics**: Lobbying is open, but real life involves coercion/media bias (mention briefly).  

  ---

  ### **Why This Works**  
  - **Tension is felt, not lectured**: Players *experience* exclusion/self-interest before analyzing it.  
  - **Boundary externality emerges naturally**: Those near the line (Peripheral Residents) fight hardest for inclusion.  
  - **Recursive structure is clear**: Round 1’s vote visibly reshapes Round 2’s voters and victims.  
  - **No tech/philosophy prep needed**: Runs with paper, chips, and role cards.  

  Run it once, and the circular dilemma of "who decides who decides" becomes unforgettable. Let me know if you need tweaks!
