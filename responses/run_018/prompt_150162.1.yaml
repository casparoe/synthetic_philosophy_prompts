answer: |-
  Your observation captures a nuanced and philosophically significant phenomenon that **is recognized but lacks a single universally adopted term**. The closest established concepts are **Lakatosian "degenerating problem-shifts"** and **Laudan's "epistemic perversity,"** but your description highlights a specific *rhetorical strategy* within these broader frameworks. Let's dissect it:

  ### Core Phenomenon: Defensive Theoretical Domestication
  This occurs when defenders of an established theory (T1) respond to a rival (T2) by:
  1.  **Manufacturing Predictive Equivalence:** Adding *ad hoc* auxiliary hypotheses (AH) to T1 to replicate T2’s quantitative predictions *without independent justification*.
  2.  **Denying Ontological/Explanatory Progress:** Arguing that T2 is merely a "notational variant" or "computational shortcut" of T1+AH, thereby dismissing T2's novel ontology/explanations.
  3.  **Exploiting Translatability:** Using the *possibility* of translation (enabled by AH) to reject claims of revolutionary change or incommensurability.

  ### Established Philosophical Anchors & Their Limits
  1.  **Quine-Duhem Thesis (Underdetermination):**
      *   **Connection:** Affirms that any theory can be saved from refutation by adjusting auxiliaries. Your case is a *specific application* of this.
      *   **Distinction:** Ordinary underdetermination is *neutral* – multiple theories fit data *ab initio*. Here, equivalence is **manufactured defensively *after* T2's challenge**, specifically to *resist* T2. It's **motivated underdetermination**.

  2.  **Lakatos's "Degenerating Problem-Shift" (Research Programmes):**
      *   **Connection:** A research programme degenerates when it only makes *post-hoc* adjustments (like adding AH) to protect its core from anomalies, failing to predict novel facts. T1+AH is a classic degenerate move.
      *   **Distinction:** Lakatos focuses on the *programme's trajectory*. Your case emphasizes the **rhetorical argument** ("it's just notation!") used *within* this degeneration to deny T2's legitimacy and the *need* for a shift.

  3.  **Laudan's "Epistemic Perversity" / "Anomaly-Swamping":**
      *   **Connection:** Laudan notes that theories can sometimes "swallow" anomalies via complex modifications, but this often makes them less coherent or fruitful. Your case exemplifies this perversity: T1 *loses* explanatory power/coherence by adding AH to mimic T2.
      *   **Distinction:** Laudan focuses on the *epistemic cost* to T1. Your case adds the **denial of progress argument** based on manufactured equivalence.

  4.  **Kuhnian Incommensurability:**
      *   **Boundary Case:** This *is* a challenge to a strict Kuhnian view.
          *   **Agreement:** Shared observations, translatability (via AH), and mutual comprehension contradict Kuhn's emphasis on radical meaning variance and communication breakdown.
          *   **Resistance:** The T1 defenders *use* translatability to deny a paradigm shift has occurred ("no revolution needed").
      *   **Kuhnian Retort:** Kuhn might argue this *is* pre-revolutionary "crisis" behavior. T1 defenders are clinging to a degenerating paradigm. Their "translation" is parasitic on T2's framework (e.g., caloric distribution mirroring particle velocities *presupposes* the kinetic perspective). True incommensurability might emerge later when T2's unification becomes undeniable.

  ### The Specific Configuration: Naming the Phenomenon
  While no single term is universal, philosophers describe this dynamic as:

  1.  **Defensive Theoretical Mimicry / Domestication:** Emphasizes the *ad hoc* construction of equivalence to "tame" the rival theory.
  2.  **The Gerrymandering of Predictive Equivalence:** Highlights the artificial, boundary-stretching nature of the AH to force equivalence.
  3.  **The "Notational Variant" Gambit:** Focuses on the specific rhetorical move used to dismiss T2.
  4.  **Explanatory Equivalence Failure (EEF):** Emphasizes the *core* issue: predictive equivalence ≠ explanatory equivalence. T1+AH achieves the *what* but not the *why/how* as well as T2.

  ### Key Distinctions from Related Concepts
  *   **vs. Ordinary Empirical Underdetermination:**
      *   Underdetermination is symmetric and initial (multiple theories fit existing data). This is **asymmetric, reactive, and manufactured** – equivalence is *engineered* by T1 defenders *in response* to T2, often distorting T1.
  *   **vs. Successful Theoretical Reduction (e.g., Newtonian -> Relativistic Mechanics):**
      *   Reduction preserves/explicates the old theory's successes *within* a broader, more fundamental framework, often showing the old theory as a limiting case. There's **explanatory continuity**.
      *   Here, T1+AH **lacks independent motivation, violates T1's core principles** (e.g., making caloric behave like moving particles), and **fails to capture T2's unifications**. It's mimicry, not reduction.
  *   **vs. Instrumentalism/Phenomenalism:** While T1 defenders might adopt instrumentalist language ("just a calculation tool"), their core commitment is likely realist to T1's original ontology. The gambit is a realist defense *against* a rival realism.

  ### Is it a Genuine Failure Mode? For Whom?
  1.  **For T1:** Absolutely. Adding unmotivated AH makes T1 **less parsimonious, less coherent, less unified, and less explanatory** than it was before T2. It signals degeneration.
  2.  **For Scientific Progress:** Potentially. If successful, it could delay warranted theory change. However, history (e.g., caloric) suggests these defenses eventually collapse under the weight of T2's **explanatory fertility and unification** (e.g., linking heat, work, entropy). The manufactured equivalence fails to negate T2's *heuristic* and *explanatory* advantages.
  3.  **For Kuhn's Account:** It *is* a boundary case showing translatability *can* persist during contested shifts, challenging the strong incommensurability-as-incomprehension thesis. However, it also illustrates **another dimension of incommensurability:** **incommensurability of *explanatory value***. While T1+AH *predicts*, it cannot *explain* phenomena the way T2 does, nor see the world as unified by T2's principles. The defenders dismiss this value judgment.

  ### Conclusion
  The phenomenon you describe—**defensive theoretical domestication via ad hoc mimicry coupled with the "notational variant" denial of progress**—is a well-analyzed, critical phase in scientific revolutions. It leverages the Quine-Duhem thesis not neutrally, but as a *tactical shield*. While terms like "degenerating problem-shift" (Lakatos) or "epistemic perversity" (Laudan) capture the core epistemic dynamic, the specific *rhetorical strategy* is often highlighted descriptively as the "notational variant gambit" or "defensive mimicry." It represents a **failure mode for the old theory** and a **challenge to simplistic views of underdetermination and reduction**, while exposing a **limitation in Kuhn's early focus on meaning variance** by showing how **explanatory incommensurability** can persist even amidst predictive translatability. Its ultimate failure hinges on the scientific community's judgment that the contrived AH are illegitimate and that T2 offers genuine, irreducible explanatory gains.
