  I should think about Duhem and Quine. The Quine-Duhem thesis says you can always save a theory with adjustments, but philosophers like Lakatos and Laudan specifically criticized doing this in an ad hoc, degenerating way. That feels close - the user's case is when scientists actually do this defensively. 

  The Kuhn angle is fascinating. The user notes there's no mutual incomprehension (unlike Kuhn's paradigms), but defenders use translatability to deny a paradigm shift occurred. That's almost a reverse-engineering of Kuhnian incommensurability claims! Maybe this is Kuhn's blind spot - cases where languages remain translatable but the cost is explanatory bankruptcy.

  Terminology... "degenerating problem-shift" (Lakatos) captures the scientific community aspect, but "epistemic perversion" (Laudan) better describes how the old theory gets distorted. The user might appreciate "theoretical domestication" too - it's vivid. But we should emphasize this is a dynamic process, not a static state.

  Wait - distinguishing features! Must highlight: 1) post-hoc adjustments only for defensive purposes, 2) predictive mimicry without explanatory gains, 3) the rhetorical move of claiming "mere notation." Versus reduction (which streamlines) or underdetermination (which is symmetric). 

  Also important: this is a failure mode when the scientific community tolerates it. Historically, caloric theory collapsed precisely because scientists eventually rejected such contortions as illegitimate. So yes, a boundary case for Kuhn - showing that translatability alone doesn't mean no revolution occurred.

