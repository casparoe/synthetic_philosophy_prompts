     - The idea that the intentional stance is a pattern that we can use for prediction without needing the lower-level details.

   Distorted:
     - In the intentional stance mapping, we have "type inference" which is syntactic. But in Dennett, the intentional stance involves semantic content (beliefs about the world). Our mapping might collapse the semantic into syntactic pattern-matching because type inference is a formal (syntactic) process. However, in functional programming, types can have semantic meaning (via Curry-Howard) but typically in practice, they are syntactic.
     - The monadic encapsulation in the design stance might overemphasize the isolation of effects and underemphasize the functional purpose (which is more about the 'why' than just the 'how' of the interface). Also, the design stance in Dennett includes evolutionary design, which isn't captured by a static type signature.

   No counterpart:
     - The ontological status of patterns: Dennett argues that intentional patterns are real but not reducible to physical parts. In type theory, we have types as abstractions that exist in the mind of the programmer, but they are not physical. However, the question of whether they are "real" in the same sense as Dennett's patterns is not directly addressed. Type theory doesn't typically commit to the reality of types beyond their utility for reasoning.
     - The idea that the intentional stance pattern is a real pattern that is not a design specification: in our mapping, the intentional stance is a type inferred from behavior, which is not the same as the design stance's type (which is given by the designer). But in functional programming, an inferred type is just as real as a declared one? However, the ontological question about patterns being real but non-physical and non-design is not directly answered in the vocabulary.

   Step 3: The Fourth Stance - Diagnostic Stance

   Description: 
     Treating a system as producing locally optimal outputs in response to an information-theoretic bottleneck, lacking global coherence or purpose.

   Mapping to our vocabulary?
     We might think of it as:
        - A system that is a function from inputs to outputs, but with the constraint that it has limited information (bottleneck) and thus uses heuristics or approximations.
        - We could model it with resource-bounded computation, probabilistic models, or perhaps using the concept of partial functions or approximation schemes.

   Questions:
     a) Does it resolve the residues?
          - The residue about the ontological status: the diagnostic stance might treat the patterns as emergent from optimization under constraints, which is a different kind of pattern. It might be captured by, say, a type that represents a function with a bounded rationality (e.g., a type that only guarantees an output within a certain error margin). But it doesn't directly address the reality of patterns beyond utility.
          - The residue about the semantic content of beliefs: the diagnostic stance doesn't require semantic content either, so it doesn't resolve the distortion.

     b) Does it replicate the design stance?
          - The design stance is about intended function. The diagnostic stance is about local optimization without global purpose. So it is different. But in terms of mapping, we might model it similarly (as an interface that we can use for prediction) but with a different kind of contract (e.g., "this system will produce outputs that are approximately optimal in context X").

     c) Does it undermine Dennett's claim about the intentional stance?
          - Not necessarily. The diagnostic stance might be seen as an alternative to the intentional stance for systems that are not rational agents. But for systems that are complex enough to exhibit global coherence (like humans), the intentional stance might still be the best predictor. Dennett's claim is that the intentional stance captures a real pattern that is distinct from the design and physical. The diagnostic stance might capture a different pattern (one of local optimization) which might be useful for non-intentional systems (e.g., an immune system, or a market). So it complements rather than undermines, unless we can show that the intentional stance is just a special case of the diagnostic stance.

   However, note: Dennett's intentional stance already assumes rationality (which is a kind of optimality). The diagnostic stance might be a generalization of the intentional stance to cases where the optimality is bounded and local? But Dennett's intentional stance is about attributing beliefs and desires (propositional attitudes) which the diagnostic stance does not. So they are distinct.

