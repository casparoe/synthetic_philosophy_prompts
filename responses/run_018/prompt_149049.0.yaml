  I've been working through the ontology of demographic cohorts and think I've hit a contradiction. Sociologists define generations like Millennials or Gen Z using arbitrarily drawn birth-year boundaries that differ across survey firms and countries, and members share no biological essence or homeostatic causal clustering. So generational categories fail to be natural kinds — they aren't homeostatic property clusters, and they lack the mind-independent stability required for real kinds. Given this, treating "Gen Z" as an explanatory regressor in causal models seems like a category mistake on par with using zodiac signs, especially since the age-period-cohort identification problem already shows that cohort, period, and age effects are linearly confounded and can't be separately identified without arbitrary constraints. If cohort membership is purely an institutional labeling practice with no intrinsic causal unity, why do demographers and economists continue to use generational dummies rather than decomposing outcomes into continuous birth-year splines, period fixed effects, and local-context interactions? More specifically, what is the least wrong ontological classification — interactive kind, institutional kind, predictive heuristic, or something else — that allows cohort analysis to avoid essentialism without collapsing into pseudoscience? After your explanation, please provide a brief structured summary as a JSON object with exactly these fields: "false_presupposition_identified", "why_zodiac_analogy_fails", "ontological_classification", "role_of_apc_problem", and "recommended_statistical_alternative".
