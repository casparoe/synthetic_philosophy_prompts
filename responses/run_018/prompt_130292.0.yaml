prompt: |-
  In debates over moral status and sentience, I repeatedly encounter a particular architecture of reasoning. A speaker begins by rejecting binary accounts—pointing out that nociception in insects, temperature-regulation in devices, and reflective self-awareness in humans form a smooth continuum, so moral weight should scale gradually rather than switch on at some magical boundary. Yet when the practical question arises—whether pest control owes insects non-negligible consideration, or whether a thermostat has any moral claim—the same speaker reintroduces a sharp exclusion, typically justified by invoking “the right kind” of integration or “genuine” experience, without locating that cutoff on the continuous scale previously endorsed. Meanwhile, within the privileged class that clears this hidden gate—say, among mammals—the gradation is restored to explain why a chimpanzee matters more than a mouse. The result is continuous weighting inside an unexplained categorical wall, with the wall itself never mapped onto the spectrum. Is there an established concept for exactly this two-layer structure—gradualism deployed internally, categorical exclusion deployed externally, with the boundary justified independently of the scale? If there is, how does it differ from ordinary threshold-setting and from pure gradualism? If not, can you coin and delimit a precise term, specifying what counts as an instance, what nearby patterns (such as simple equivocation or a standard non-identity problem) it excludes, and where its edges lie? End with a one-sentence summary of your conclusion on its own line.
reasoning: |-
  Okay, let me unpack this user's inquiry. They're describing a recurrent pattern in ethical debates where someone rejects binary moral status in favor of a continuum, yet paradoxically introduces a sharp cutoff when practical decisions arise - like dismissing insect suffering or thermostat claims based on unspecified "genuine experience." This creates an inconsistent structure: gradual weighting within an arbitrarily bounded category (e.g., mammals), while the boundary itself remains unanchored to the continuum.

  The user wants to know if this specific cognitive structure has a name, or if we should coin one. They're clearly well-versed in philosophy of mind and ethics - notice how precisely they dissect the contradiction between endorsing continuity while applying discontinuity. Their frustration suggests they've encountered this repeatedly in debates, likely around animal ethics or AI consciousness.

  Hmm... existing terms don't quite capture it. "Threshold models" are explicit about cutoffs; "equivocation" would be accidental misuse of terms. This is more systematic - a nested inconsistency where the gradualist framework is selectively abandoned. 

  I recall Dennett's "deepities" (statements true trivially but false substantially), but that's not structural. The pattern resembles what I'd call "categorical containment" - using continuity rhetorically while relying operationally on unexamined boundaries. 

  Key features to capture: 
  1) Appeal to continuum to reject binaries 
  2) Implicit sharp exclusion for "out-groups" 
  3) Justification shift (e.g., "genuine experience") disconnected from continuum parameters 
  4) Restoration of gradation within privileged category 

  "Containment Fallacy" feels right - it evokes walling off a domain where gradualism applies, without justifying the walls. Needs clear boundaries though: it's distinct from honest threshold-setting (where criteria are continuous-variable-based) and from simple speciesism (which doesn't necessarily endorse internal gradualism). 

  User will want concrete exclusion criteria too. For example: 
  - Doesn't apply if the boundary is mapped to the scale (e.g., "integration ≥X") 
  - Excludes cases where "genuine" is clearly defined 
  - Not triggered by epistemic uncertainty ("we must draw a line somewhere cautiously") 

  ...Ah, and the summary must crystallize it: A fallacy where moral gradualism is contained within an unjustified categorical boundary.
answer: |-
  This pattern is a specific form of conceptual inconsistency, best termed the **Containment Fallacy**. It describes the error of simultaneously endorsing ontological/experiential gradualism while imposing an unexplained categorical boundary for moral consideration, then resuming gradualism within the privileged class—without reconciling the boundary's placement with the continuum.

  ### Core Structure of the Containment Fallacy:
  1. **Gradualism Asserted**: Rejection of binary thresholds for a property (e.g., sentience, cognition) by appealing to a smooth continuum (e.g., neural complexity, behavioral responses).
  2. **Categorical Exclusion Practiced**: Introduction of an abrupt moral boundary (e.g., "genuine experience," "meaningful integration") for practical decisions, *without locating it on the continuum*.
  3. **Internal Gradualism Restored**: Application of scalar moral weighting *only* within the admitted category (e.g., mammals), ignoring the inconsistency with the exclusionary boundary.

  ### Distinguishing Features:
  - **vs. Threshold-Setting**: Ordinary thresholds map exclusion criteria *onto the continuum* (e.g., "sentience requires ≥X neural integration"). The Containment Fallacy *detaches* the boundary from the endorsed scale, invoking qualitatively distinct criteria ("the *right kind* of integration").
  - **vs. Pure Gradualism**: Pure gradualism applies scalar weighting universally (e.g., insects have *some* moral weight, however small). The fallacy denies weight entirely to excluded groups.
  - **vs. Equivocation**: Not merely ambiguous terms, but a structural inconsistency: the same speaker uses gradualism to dismantle binaries *except* at their unchosen boundary.
  - **vs. Non-Identity Problems**: Concerns identity conditions (e.g., "is a thermostat identical to a sentient being?"). The fallacy occurs *after* rejecting such binaries via gradualism.

  ### Boundaries & Exclusions:
  - **Counts as an instance** when:  
    (a) A continuum is explicitly endorsed to reject binaries;  
    (b) A practical exclusion is defended by an *unmapped* qualitative criterion;  
    (c) Gradual differences are acknowledged within the included class.
  - **Excludes**:  
    - Simple threshold models (e.g., "only beings with cortexes matter").  
    - Cases where "genuine experience" is *defined* by continuum parameters (e.g., "integration complexity >Y").  
    - Epistemic humility ("We can't measure insect experience, so we cautiously exclude them").

  ### Why "Containment"?
  The term captures how moral gradualism is artificially "contained" within a privileged category by an unjustified wall. The fallacy isolates the domain where scalar reasoning applies, shielding the boundary from the same scrutiny applied to internal distinctions.

  **The Containment Fallacy is the inconsistent imposition of an unexplained categorical boundary on moral status after endorsing ontological gradualism, resuming gradualism only within the admitted class.**
