prompt: |-
  I sit on the value analysis committee at a small regional hospital — nine of us, two doctors, a nurse manager, a pharmacist, an admin, a finance person and me (I do procurement and I'm the one who ends up with the spreadsheets). We meet twice a month for about two hours and we decide what supplies, devices and clinical protocols the hospital adopts: things that cost anywhere from 20 grand to 400 grand and that the floor staff then has to live with for five to ten years. I have no economics or philosophy background at all; I got into this because I noticed we almost always end up agreeing with whoever speaks first, and someone on a forum told me to look up information cascades and rational herding. I sort of get the basic idea — people copy the people who went before them and rationally stop using their own private information — but every explanation I find is about strangers picking between two restaurants, or balls in an urn, and I can't map it onto my situation, where we talk in a room, people say out loud how sure they are, we all know each other's track records, and the thing being decided is usually some ugly mixture of a prediction about the world and a values call about what we care about.

  One wrinkle that I think makes us different from the textbook setup, and please tell me if I'm wrong about this. In our meetings people don't only copy each other's picks, they copy each other's level of confidence. Three people who each have a genuinely weak private reason will each sound firm, because each one is reading the other two as firm, and the meeting ends in what I've started calling a "confidence cascade" — nobody has really changed their mind about anything, but the room is radiating a certainty that no individual in it actually holds, and anybody with a real worry suddenly feels like the odd one out and shuts up. There's a mirror version where one respected person says something lukewarm and the whole proposal quietly dies, which I've been calling a "chill." My sense is that a procedure built for binary choices made one at a time in a fixed order won't catch either of these, because with us the action isn't binary, the order isn't fixed and the thing being transmitted is partly a mood.

  What I actually want is a procedure I can run, in the twenty minutes I have before a meeting or in the two minutes of floor time I get during it, to decide for myself: is this a case where I should go along because the fact that everyone is converging really is evidence, or a case where I should dig in and put my private read on the table? A short ordered list of questions, each answerable by a non-expert in a minute or two without knowing the theory, with a clear stopping rule for each — stop and defer, stop and escalate, or stop and hand it to a person because the remaining question is about values rather than facts. Please be honest about which steps are real tests and which are just judgment wearing a clipboard. It has to handle: decisions where there is a fact of the matter that will show up in our own data later (does this catheter actually cut infection rates on our wards) versus ones where the right answer is mostly about what we value (do we buy the nicer monitoring system or spend the same money on another night nurse) versus ones where what matters is simply that we all do the same thing (which electronic record system we standardise on); the fact that sometimes I can get a private straw vote before anyone talks and sometimes I can't, because the chair runs the meeting how she likes; the fact that some of what people know isn't the kind of thing they can put into words, like a nurse's gut feeling that a new pump is going to be a misery on nights; and the fact that I am not the chair and I have maybe two minutes. If the answer is dig in, tell me what the move actually is — secret ballot, ask the quietest person first, table it, send it to a subcommittee, whatever. And please don't point me at papers or tell me what to read; our library access is basically nil and it wouldn't help me with fifteen minutes before a meeting anyway.

  Then run it on three cases from the last year. First: we were choosing between two IV pump models, everyone drifted toward the one the senior anesthesiologist liked, and I had our own repair-ticket data showing that model had noticeably more failures at our two sites over eighteen months than the other one did. Second: we were deciding whether to switch to a cheaper sterilization wrap before the next inspection; six people with far more relevant experience than me were all relaxed about it, my only objection was a vague worry about the inspectors that I couldn't really back up, and I really did not want to be the person who slows everything down — I suspect the right procedure tells me to shut up here, so show me that if it does. Third: an experienced OR nurse said a new surgical positioning device just felt wrong to her, couldn't articulate why, the rest of the room was enthusiastic, and I couldn't tell whether to treat that as a signal or as nothing. Finally, tell me plainly what the procedure can't do: what kinds of decisions it will misfire on, and how I keep it from turning me into the person who objects to everything.
reasoning: |-
  Okay, the user is part of a value analysis committee at a small hospital. They're dealing with group decisions where information cascades and confidence levels skew outcomes. They need a practical, quick procedure to decide when to speak up or stay quiet during meetings. Let me unpack their situation.

  First, their committee has diverse roles—doctors, nurses, admin, finance, procurement. Decisions involve high-cost items with long-term impacts. The user noticed that early speakers set the tone, leading to "confidence cascades" where false certainty emerges, or "chills" where lukewarm responses kill proposals. They want a method to assess whether to defer or intervene, considering factors like factual vs. value-based decisions, private vs. public info, and time constraints.

  The user's explicit needs: a step-by-step procedure usable in 20 mins pre-meeting or 2 mins during it. It must handle different decision types (fact-based, value-based, coordination-focused), accommodate varying access to pre-meeting votes, respect unarticulated knowledge (like gut feelings), and offer concrete actions. They also want examples applied to past cases and limitations clarified.

  Deeper needs? They likely feel frustrated by inefficient decisions and want to contribute effectively without being obstructive. They might fear being the constant naysayer or missing critical input. Their identity as a procurement person without econ/philosophy background suggests a need for practical, non-theoretical tools. Trust within the team is key—preserving relationships while ensuring good outcomes.

  Now, structuring the procedure. The user mentioned three decision types: fact-based (will X reduce infections?), value-based (nicer monitors vs. more staff?), and coordination (standardizing systems). The process must quickly classify the decision. Also, confidence mimicking is a core issue—people mirroring certainty levels without genuine alignment.

  I recall the Delphi method uses anonymous input to avoid bias, but it's time-consuming. For quick checks, focusing on dissenting private signals and evidence strength could work. Steps should assess: decision type, private signal strength, confidence mismatch, and dissenter credibility. 

  For the IV pump case, the user had hard data contradicting the group. The procedure should flag this as a strong private signal with tangible evidence, prompting intervention. For the sterilization wrap, vague unease without data might warrant silence. The nurse's gut feeling about the positioning device is tricky—tacit knowledge from experience should be valued, so probing quietly makes sense.

  Operationalizing: Pre-meeting steps involve classifying the decision and gathering private signals. During the meeting, assess if public confidence exceeds private doubts. Actions like invoking data, polling anonymously, or deferring to subcommittees. Time efficiency is crucial—some steps skippable if rushed.

  Limitations: Value-heavy decisions need different approaches; the procedure might over-prioritize facts. Also, it can't fix power imbalances or replace deep expertise. User must balance vigilance with pragmatism to avoid alienating the team.

  Testing on cases:
  1. IV pumps: Fact-based, strong private data → intervene with evidence.
  2. Sterilization wrap: Coordination-heavy, weak private signal → defer.
  3. Positioning device: Tacit knowledge → elevate the nurse's concern respectfully.

  The procedure should empower the user without overburdening them, maintaining team cohesion while improving decision quality.
answer: |-
  Here's a practical **Cascade Check Procedure** designed for your constraints. It focuses on detecting dangerous confidence mismatches and prioritizing actionable interventions. Use it in pre-meeting prep (<20 min) or during the meeting (2-min "snapshot" version in **bold**).

  ---

  ### **The Cascade Check Procedure**  
  *(Run sequentially - stop if any step gives a clear action)*

  1.  **"WHAT ARE WE ACTUALLY DECIDING?" (15 sec)**  
      *   **Fact-Based:** "Will this objectively achieve X in our hospital?" (e.g., reduce infection, save money). *Evidence will eventually prove it right/wrong.*  
      *   **Value-Based:** "What matters more to us: X or Y?" (e.g., staff comfort vs. cost savings). *No "proof," just preference.*  
      *   **Coordination-Based:** "Do we just need *one* standard everyone follows?" (e.g., EMR system). *The specific choice matters less than universality.*  
      *   **Action:** If **Value-Based** or **Coordination-Based**, *and* the group seems aligned, **STOP & DEFER** (confidence cascades less dangerous here). If **Fact-Based**, proceed.

  2.  **"DO I HAVE A STRONG PRIVATE SIGNAL?" (60 sec)**  
      *   Assess *your* info: Is it **Specific** (e.g., "Repair log shows 23% more pump failures"), **Credible** (e.g., our own data, trusted source), and **Actionable** (points to a clear risk/benefit)? Or is it **Vague** ("I feel uneasy"), **Weak** ("I heard a rumor"), or **Non-Factual** ("I just prefer the other one")?  
      *   **Action:**  
          *   **Strong Signal (Specific + Credible + Actionable):** Proceed to Step 3.  
          *   **Weak/Vague Signal:** **STOP & DEFER** (Your input likely won't counter a cascade effectively).  
          *   **Values/Preference:** **STOP & DEFER** (Unless representing a key stakeholder view).

  3.  **"CONFIDENCE MISMATCH?" (45 sec / Snapshot during meeting)**  
      *   *(Pre-Meeting):* Imagine the discussion. Who speaks first? What's their *likely* confidence level? Does your strong private signal *contradict* that likely confidence?  
      *   *(During Meeting - **SNAPSHOT VERSION**):* **Listen for 60 seconds.** Is the *expressed group confidence* (tone, certainty, lack of debate) **HIGHER** than what your strong private signal suggests is warranted?  
      *   **Action:**  
          *   **YES (Confidence > Evidence):** Proceed to Step 4 (Risk of "Confidence Cascade").  
          *   **NO (Confidence matches Evidence / Uncertainty is expressed):** **STOP & DEFER** (Healthy discussion, cascade unlikely).

  4.  **"CAN I SAFELY ELEVATE THE SIGNAL?" (30 sec)**  
      *   Can you present your signal **objectively** and **succinctly** (<30 seconds) without attacking individuals? (e.g., "Can we look at our pump repair data sheet? It shows Model X had 23% more critical failures"). Focus on data, not opinion.  
      *   **Action:**  
          *   **YES:** **DIG IN & STATE IT.** Frame neutrally: "I have some data that might be relevant..."  
          *   **NO (Too complex/emotional/risky for floor speech):** **STOP & ESCALATE.** Use procedure: "Given the importance, could we table this for one week? I have specific data I'd like to compile/share first." *(Moves it to subcommittee/email)*.

  ---

  **When to Use What Action:**  
  *   **STOP & DEFER:** Default. Go with the flow. Saves time/social capital. Use when signal is weak, decision isn't fact-based, or confidence seems warranted.  
  *   **DIG IN & STATE IT:** For strong, factual, contradictory signals you can articulate quickly and neutrally.  
  *   **STOP & ESCALATE:** For strong signals too complex/risky for floor debate. Forces a pause/subprocess.

  ---

  **Applied to Your Cases:**

  1.  **IV Pump Choice (Drift towards Anesthesiologist's pick, you had failure data):**  
      *   **Step 1:** **FACT-BASED** (Which pump fails less *at our hospital*?). Proceed.  
      *   **Step 2:** **STRONG SIGNAL** (Specific: "23% more failures"; Credible: *Our* repair logs; Actionable: Points to safety risk). Proceed.  
      *   **Step 3:** **YES (Confidence Mismatch).** Group confident in Anesthesiologist; your data contradicts. Proceed.  
      *   **Step 4:** **YES (Can Elevate Safely).** "Dig In & State It": *"Dr. Smith, I completely respect your experience. For the committee's awareness, I pulled our internal repair tickets for the last 18 months. They show Model X had 23% more critical failure reports than Model Y across both sites. Could we factor this data into the safety assessment?"*  
      *   **Result:** Data is introduced objectively. Forces re-evaluation.

  2.  **Cheaper Sterilization Wrap (Experts relaxed, your vague inspector worry):**  
      *   **Step 1:** Mix of **FACT** (Will it pass inspection/sterilize?) and **COORDINATION** (Need a standard wrap). Proceed cautiously.  
      *   **Step 2:** **WEAK SIGNAL** (Vague: "Worry about inspectors"; Not Credible: No data/experience). **ACTION: STOP & DEFER.**  
      *   **Justification:** Your signal isn't strong enough to counter the experts' consensus, especially if the decision has a coordination element. Your gut feeling *might* be right, but the procedure correctly tells you not to derail based on weak info. Save your social capital.

  3.  **Surgical Positioning Device (OR Nurse "feels wrong"):**  
      *   **Step 1:** Primarily **FACT-BASED** (Will this device cause injuries/complications? Nurse's gut may signal risk). Proceed.  
      *   **Step 2:** **STRONG SIGNAL?** Tricky! Her signal is **Vague** ("feels wrong"), but potentially **Credible** (Experienced OR Nurse) and **Actionable** (Points to safety risk). **Judgment Call:** Treat as **Strong Signal (Tacit Knowledge).** Proceed.  
      *   **Step 3:** **YES (Confidence Mismatch).** Room enthusiastic; her (implied) low confidence contradicts. Proceed.  
      *   **Step 4:** **NO (Not YOUR signal to state directly).** **STOP & ESCALATE (but differently).** Use procedure: *"Sarah, you mentioned the device feels wrong. Could you elaborate on what specifically feels off? Is it a stability issue, pressure points, something else? Maybe we need a hands-on trial in the OR before committing?"* **Result:** Elevates *her* tacit knowledge respectfully without you being the source. Forces exploration.

  ---

  **What This Procedure CAN'T Do (And Safeguards):**  

  1.  **Fix Power Imbalances:** If the CEO loves a device, the cascade may roll regardless.  
      *   *Safeguard:* Focus on Step 4 ("Can I Safely Elevate?"). If unsafe, "Escalate" later privately or via email with data. Pick battles.  

  2.  **Replace Deep Expertise:** It flags mismatches, but won't make you an expert on sterilization efficacy.  
      *   *Safeguard:* Heavily weight Step 2 ("Strong Signal?"). Defer if you lack credible info. Trust true experts *unless* confidence seems wildly mismatched.  

  3.  **Solve Pure Value Debates:** If it's truly about values (e.g., comfort vs. cost), the procedure *stops early* (Step 1). Cascades are less risky here; alignment matters more.  
      *   *Safeguard:* Use "Stop & Defer" unless you're representing a key unvoiced value perspective.  

  4.  **Detect Perfectly Hidden Doubts:** If everyone privately doubts but mimics confidence, you might miss it.  
      *   *Safeguard:* Encourage pre-meeting chats (Step 3 pre-work). If a "chill" kills a good idea, use "Escalate" to suggest a focused subcommittee revisit.  

  5.  **Make You Popular:** Overuse = "the blocker."  
      *   *Safeguard:* **STRICT adherence to Step 2 (Strong Signal?).** Only intervene with **credible, specific, factual contradictions.** Defer on weak/vague/value-based issues. Track your interventions – aim for <10% of meetings. Use "escalate" (table/subcommittee) more than "dig in" to avoid confrontation.  

  **Key:** This is a filter for **dangerous confidence cascades on fact-based decisions** where **you hold strong contradictory evidence.** It forces you to assess *your* signal and the *group mood* objectively before deciding to act. Use it to conserve energy for high-impact interventions.
