prompt: |-
  I'm taking a seminar on comparative political theory and we've been debating whether high-performing authoritarian regimes can claim what some scholars call performance legitimacy—the idea that sustained prosperity and social order, achieved without democratic procedures, can by themselves provide a sufficient moral basis for rule. The cases we keep returning to are China and Singapore, where rapid economic development and low corruption indices coexist with severe restrictions on political pluralism, independent labor organization, and judicial review of executive power. Rather than rehearsing the familiar democratic-autocratic comparison, I want to push the conceptual question: if we genuinely bracket procedural values like consent or participatory equality and evaluate only the instrumental and intrinsic worth of prosperity and order, does that bundle suffice?

  Give me your actual credence—expressed as a number between 0 and 1—that prosperity and order, taken together and without procedural supplementation, can constitute a sufficient moral justification for authoritarian governance in regimes structurally similar to those cases. I do not want a conditional answer that merely maps decision theories; I want the number and its explicit decomposition. Break it into: (a) the probability that political legitimacy is fundamentally instrumental rather than procedural or relational; (b) the probability that the observed prosperity in such regimes is causally attributable to authoritarian institutional design rather than to confounding variables like demographic structure, global supply-chain integration, or resource endowments; (c) the probability that social order can be conceptually disentangled from the coercive suppression of dissent, so that stability is not partly constituted by the very unfreedom it is said to justify; (d) the probability that citizens' reported welfare or preference-adaptation genuinely reflects flourishing rather than rationalized acceptance of unchangeable conditions; and (e) the probability that our evaluation is not covertly importing a liberal-normative premise—such as the intrinsic value of autonomy—that makes the conclusion question-begging.

  Combine these terms into your overall credence, show the rough arithmetic or weighting, and identify which sub-question is the weakest link—the one whose revision would most move your final number. Then specify what kind of evidence or conceptual clarification would shift that particular term: for instance, a robust cross-national finding that authoritarian growth episodes systematically reverse after two generations, or a philosophical argument that order analytically presupposes non-arbitrary rule rather than mere predictability. I am especially interested in whether you think the disagreement between someone at 0.75 and someone at 0.15 on the overall claim is primarily empirical, conceptual, or normative in origin.
