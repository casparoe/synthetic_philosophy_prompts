  Okay, the user is describing a pattern they've noticed in discussions about life's meaning. They see a common slide from metaphysical claims about meaning to psychological coping strategies. Let me break this down.

  First, the pattern involves starting with Camus-style absurdity—acknowledging the universe's indifference. Then there's a pivot to subjective meaning (fulfillment, relationships) without addressing objective theories properly. Instead, objective-list theories like Susan Wolf's are evaluated based on whether they alleviate feelings of pointlessness, treating them as therapeutic tools rather than truth claims. This seems like a category error.

  Looking for established terms... "Therapeutic turn" comes to mind, but it's broader. "Psychologizing the metaphysical" captures the idea but isn't a formal term. Pragmatic approaches in existentialism do focus on living well, but they usually acknowledge the metaphysical debate rather than sidestepping it completely.

  The user wants to know if there's a specific term. Since I can't recall any precise term, coining one seems appropriate. "Therapeutic reductionism" might work—reducing philosophical questions to psychological efficacy. Need to define it clearly: evaluating truth-apt claims solely by their therapeutic value.

  Boundaries are important. This isn't just interdisciplinary work where philosophy informs psychology. It's distinct from legitimate practical philosophy that engages with metaphysics while considering applications. Also different from existential therapies that consciously blend the two.

  On settled vs contested: Most philosophers agree that meaning has both objective and subjective components. They'd reject reducing metaphysical claims to psychology. But there's debate about whether meaning must "answer" absurdity—Camus thought so, analytic philosophers like Metz don't prioritize that framing. Wolf explicitly denies her theory is a response to absurdity.

  The user seems well-read but frustrated by this recurring rhetorical move. They likely want precision to critique sources more effectively. Their deeper need might be navigating the literature without getting derailed by this slide. Naming the pattern gives them a tool for that.
answer: |-
  ### The Pattern
  You observe a recurring rhetorical slide in popular/semi-academic meaning-of-life discourse: It begins with the *metaphysical* problem of the Absurd (cosmic indifference, arbitrary human projects), then pivots to *subjective* meaning (fulfillment, relationships). Crucially, when encountering *objective* theories (like Susan Wolf's claim meaning requires engagements of objective value), it avoids evaluating their truth. Instead, it frames them solely as potential "cures" for the *psychological feeling* of pointlessness. This conflates distinct questions—metaphysical claims about value independence become assessed as psychological coping mechanisms.

  ### Nearest Names
  *   **"Therapeutic Turn" (in Existentialism/Pragmatism):** A broad trend emphasizing philosophy's role in improving life. While related, it doesn't inherently *reduce* metaphysical claims to therapeutic efficacy. Your pattern is a specific *misapplication* of this impulse.
  *   **"Psychologizing the Metaphysical":** A descriptive phrase highlighting the conflation, but not an established technical term. It captures the core error but doesn't specify the context (responding to absurdity) or the therapeutic framing.
  *   **"Pragmatic Reductionism" (regarding meaning):** Refers to defining meaning solely by practical consequences. Your pattern is similar but narrower: it's not defining meaning pragmatically *ab initio*, but *reducing existing metaphysical claims about objective meaning* to their pragmatic (therapeutic) effects within the context of coping with absurdity.

  **Key Difference:** These broader concepts don't specifically capture the *sequence* (starting with Absurd, shifting to subjective meaning, then framing objective theories *only* as potential remedies for the *feeling* of absurdity) or the *conflation* of truth-assessment with therapeutic-assessment.

  ### Proposed Term or Verdict
  **Verdict:** There is **no established, widely recognized technical term** for this *exact* rhetorical slide. The closest descriptive phrases are informal ("psychologizing the metaphysical," "therapeutic reduction of meaning claims").

  **Proposed Coinage:** **"Therapeutic Reductionism in Response to Absurdity" (TRRA)** or **"Therapeutic Re-framing of Meaning Claims" (TRMC)**.

  **Precise Definition:** TRRA/TRMC is the argumentative move within discourse on life's meaning that:
  1.  Acknowledges the metaphysical challenge of the Absurd (cosmic indifference rendering human projects arbitrary/valueless).
  2.  Accepts subjective meaning accounts as coping strategies.
  3.  When encountering *objective* meaning theories (claims that meaning requires engagements possessing mind-independent value), *avoids evaluating their metaphysical truth*.
  4.  Instead, *exclusively evaluates these objective theories based on their perceived efficacy as psychological coping mechanisms* to alleviate the *feeling* of pointlessness induced by the Absurd.
  *Essence:* Treating a claim about objective value-dependence as if its sole relevant function is therapeutic.

  ### Boundaries
  TRRA/TRMC is **not**:
  1.  **Legitimate interdisciplinary integration:** Where psychological insights inform philosophical analysis while respecting disciplinary boundaries (e.g., exploring *how* discovering objective meaning *might* impact well-being, without reducing the meaning *claim* to that effect).
  2.  **Pragmatic or therapeutic philosophies *per se*:** Existentialist, Pragmatist, or Stoic traditions may prioritize living well, but they typically engage substantively with metaphysical/epistemological foundations *before* discussing application. TRRA *sidesteps* the foundational evaluation.
  3.  **Ordinary sloppiness:** It's a specific, recurring *pattern* of argumentation, not just casual imprecision. It involves a consistent conflation of distinct categories (truth vs. therapeutic effect) within a defined argumentative sequence responding to absurdity.
  4.  **Existential Therapy:** Clinical practices like Logotherapy consciously *use* meaning concepts therapeutically; TRRA occurs within *philosophical discourse* purporting to analyze meaning itself, but shifting the criteria.

  ### Settled vs Contested
  *   **Settled (Near Consensus):** Philosophers of life's meaning widely agree that the *questions* "Does life have meaning?" and "What makes a life meaningful?" are distinct from, though related to, "How can one feel fulfilled?" or "How can one cope with existential angst?" They agree that conflating these questions is a category error. Evaluating a metaphysical claim (e.g., "Meaning requires objective value") *solely* by its psychological effects is generally seen as invalid reasoning within analytic philosophy. Susan Wolf, for instance, explicitly argues her theory is *about* meaning, not merely a coping strategy.
  *   **Contested:**
      *   **The Primacy of the Absurd:** Whether the "problem" of cosmic indifference is the *essential* starting point for meaning inquiry is debated. Analytic philosophers (e.g., Thaddeus Metz) often start with intuitions about meaningful lives, not necessarily with Camus' Absurd. TRRA assumes the Absurd *is* the core problem that any account must "solve."
      *   **Philosophy's Role:** The extent to which philosophy *should* prioritize therapeutic outcomes over pure truth-seeking, especially regarding meaning, is deeply contested. Proponents of "philosophy as a way of life" might see TRRA as a *valid* approach, albeit poorly executed. Critics see it as abandoning philosophy's core task.
      *   **Hybrid Theories:** The viability and nature of hybrid theories (combining subjective and objective elements) is actively debated. TRRA often lumps hybrids in with purely objective theories, assessing them all therapeutically, which oversimplifies the nuanced arguments within this category.
