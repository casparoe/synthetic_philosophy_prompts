prompt: |-
  ok so i've been reading a bunch of popular and semi-academic stuff about whether life has meaning, and i keep noticing this exact slide. someone starts with camus-style absurd: the universe doesn't care, our big projects are arbitrary from a cosmic point of view, etc. then they pivot to "but meaning is subjective!" and suddenly they're talking about fulfillment, relationships, achievement. but then when they discuss objective-list theories — like wolf's idea that meaning requires objective worth — they don't evaluate them as true or false. instead they ask "does this cure the feeling of pointlessness?" i see this in essays, podcast transcripts, even some intro syllabi. it's like treating a metaphyscial claim about value-independance as if it were a psychological maladjustment that just needs the right therapy.

  is there an established term for that exact slide? not just "therapeutic fallacy" in general, or the pragmatic turn in existentialism, but specifically the move where every competing account of meaning — subjective, objective, hybrid — gets framed as a competing coping strategy for absurdity? if there's a name, what's the closest literature and how does the thing i described differ? if there's no name, can you coin one, define it precisely, and map its boundaries — especially distinguishing it from ordinary interdisciplinary sloppy-ness, and from the legitimate idea that philosophy should help us live?

  please separate what's settled from what's genuinely contested among people who actually work on this, and don't present a contested view as if it's the consensus.

  format your answer in these sections, in this order, with rough lengths:
  - The pattern: what i described, in your own words (~100 words)
  - Nearest names: closest concepts, how they differ (~150 words)
  - Proposed term or verdict: either identify the real term or coin one with definition (~150 words)
  - Boundaries: what it is not (~120 words)
  - Settled vs contested: where philosophers agree and where they split (~100 words)
