answer: |-
  Here's a villanelle crafted to your specific seminar themes, weaving consequentialism, cetana, and the three mental roots into the shifting form:

  **The Root and the Reckoning**

  We cut the limb to save the whole, it braves
  The sharpest edge where lesser comfort craves –
  *The act is weighed by what it saves.*

  The gilded charity, the coin it waves,
  Hides grasping fingers reaching past the graves –
  *The root decides what remains.*

  With hands that held the dying thief, forgives,
  He breaks the rule, yet life renewed he gives –
  *The act is weighed by what it saves.*

  The ledger balanced, justifies the knaves
  Whose hidden hunger cracks the jar it slaves –
  *The root decides what remains.*

  Where wisdom blooms, compassion lives and thrives,
  A lotus grows where muddy water strives –
  *The act is weighed by what it saves.*

  No hateful gleam, no selfish thought contrives,
  Pure skillful means the Bodhisattva drives –
  *The root decides what remains.*

  The outcome blooms or withers, bright or gray,
  The motive seeds the karma of the day.
  *The act is weighed by what it saves,*
  *The root decides what remains.*

  ---

  **Breakdown for Accuracy & Craft:**

  1.  **Refrains & Unresolved Couplet:** "The act is weighed by what it saves" (consequentialist refrain) and "The root decides what remains" (Buddhist karma/root refrain) alternate. They meet side-by-side in the final couplet without synthesis, embodying the unresolved tension.
  2.  **Tercet Progression:**
      *   **1st Tercet (Pure Consequentialism):** Focuses solely on outcome ("save the whole"), justifying the painful act ("cut the limb"). Cold, utilitarian logic.
      *   **2nd Tercet (Hidden Greed - Lobha):** Shows the *same act* ("gilded charity," "coin it waves") but with grasping intent ("grasping fingers," "past the graves"). Outcome might *look* good, but the root poisons it.
      *   **3rd Tercet (Compassion - Skillful Means/Upaya):** The Bodhisattva act ("hands that held the dying thief," "breaks the rule") driven by pure compassion ("wisdom blooms," "compassion lives") for the greater good ("life renewed").
  3.  **Mental Roots & Shifting Form:**
      *   **Consequentialism (1st Tercet):** Standard iambic pentameter (da-DUM). Rhyme (braves/craves/saves) is relatively straightforward, reflecting the "clean" calculation. Meter is regular.
      *   **Greed/Hidden Motive (2nd Tercet):** Meter becomes slightly more disrupted. "Waves" and "graves" are harder, more jarring sounds than "braves/craves." "Gilded charity" hints at deception. "Grasping fingers" introduces a spondee (two stressed syllables: GRASP-ing FIN-gers), disrupting the iambic flow, enacting greed's disturbance. Rhyme (waves/graves/remains) feels less resolved.
      *   **Compassion/Skillful Means (3rd Tercet):** Meter softens. "Forgives" and "gives" are gentler rhymes. "Lives and thrives" uses softer consonants and internal rhyme. "Lotus grows where muddy water strives" evokes purity arising from difficulty. The anapest ("where muddy WATER STRIVES") introduces a more flowing, less rigid rhythm than pure iambic. Rhyme (thrives/drives/remains) feels more open.
  4.  **Accuracy (Abhidharma/Shantideva):**
      *   **Cetana over Outcome:** The poem's core argument is that identical outcomes (saving something) have different karmic weight based on the mental root (lobha vs. compassion), directly addressing the seminar point.
      *   **Skillful Means (Upaya):** The 3rd tercet explicitly references breaking a rule ("breaks the rule") for the greater good ("life renewed"), driven by compassion and wisdom ("wisdom blooms," "pure skillful means"), mirroring Shantideva's justification for flexible precept application *only* with pure mind.
      *   **Mental Roots (Lobha, Dosa, Moha):** Lobha (greed/clinging) is depicted in the 2nd tercet. While dosa (hatred) and moha (delusion) aren't explicitly named in the verses, the pure compassion of the 3rd tercet implies freedom from all three. The "grasping fingers" and "hidden hunger" clearly point to lobha's corrupting influence.
      *   **Karmic Residue:** "The root decides what remains" directly points to the karmic seed (bija) planted by the mental state, persisting beyond the immediate outcome.
  5.  **Avoiding Sermon:** The poem uses concrete images (cut limb, gilded coin, grasping fingers, dying thief, lotus, cracked jar) rather than abstract doctrinal language. The argument is embedded in the contrasting scenarios and the form shifts.

  The villanelle structure forces the refrains to turn against each other and the stanzas, embodying the tension between consequentialist calculation and karmic intentionality, culminating in their unresolved juxtaposition. The meter and sound shifts attempt to make palpable how the root intention fundamentally restructures the karmic nature of the act.
