prompt: |-
  Hey, I'm a retired marine biologist—spent decades measuring coral growth and dealing with local fisheries boards—so I don't have formal training in this, but lately I've been reading some philosphy about corruption and whether Western ideas about bribery actually travel everywhere. I want to check my gut instincts against some principle, if there is one.

  Here are my verdicts. When a supplier sends my old lab an expensive watch right after we signed a big equipment contract, that's corrupt, no question. When I was doing fieldwork in the Pacific and brought fish and taro to the village elder before asking permission to study a reef, I don't think that was corruption at all—refusing the gift would have been the real insult, and his role includes recieving these things. When a city official takes a standardized "facilitation fee" to speed up paperwork everyone needs, I call it corruption, but it's systemic, not personal like the watch. When a politician hires his qualified college roommate for a planning job, I feel it's clientelism and wrong, but I hesitate to call it corruption since there's no hidden exchange. But then there's the case I keep going back and forth on: after a university administrator processed my research grant quickly and fairly, I sent her a nice bottle of whiskey. There's no expectation now, but I wouldn't have sent it if she hadn't helped me. Is that post-hoc bribery or just gratitude?

  I'm wondering if there's a principle like "corruption occurs when a gift creates a hidden expectation that distorts an impartial role" that captures the watch and the facilitation fee but spares the elder and maybe the whiskey? Or does that collapse because the elder's role isn't impartial? And what about the politician—does loyalty count as role-distortion? Can you lay out one principle, or maybe two competing ones, that gets most of my verdicts right, tells me what's happening with the whiskey, predicts what I'd say if I sent it only after she retired and couldn't help me anymore, and is honest about which of my gut feelings it has to throw out? Don't worry about giving me a reading list—I'm just trying to think this through on my own.
reasoning: |-
  Okay, let me tackle this retired marine biologist's query. They're wrestling with what counts as corruption across different scenarios—from a watch after a contract to taro for a village elder. Their core question is whether their gut instincts align with any ethical principle, especially that tricky whiskey gift. 

  First, I need to unpack their examples. The watch is clearly a bribe—it's a hidden quid pro quo that distorts professional judgment. The fish and taro? That’s ritual reciprocity, embedded in cultural norms. The facilitation fee is systemic extortion; you pay or paperwork stalls. The political hire smells like nepotism—wrong but maybe not corrupt under a strict bribery definition. Then there’s the whiskey: gratitude today, but could it be priming future favors? 

  Their proposed principle—"hidden expectation distorting impartial roles"—is sharp but incomplete. It nails the watch and fee but stumbles on the elder (whose role isn’t impartial) and the whiskey (which feels personal but might bleed into professional space). 

  So how to reconcile this? I’m leaning toward two axes: transparency and role boundaries. Corruption thrives in shadows where roles are misaligned—like the watch. The elder’s gift is transparent and role-congruent. The whiskey? Gray area. If sent post-retirement, it’s clearly gratitude; timing matters. The politician’s hire? It’s loyalty overriding merit—a distortion, but not corruption unless laws are broken. 

  Their hesitation about the whiskey is spot-on. Ethically, it’s a gamble: even pure gratitude can seed unconscious bias. Better to donate to their department fund—keeps it clean. 

  Final principle: "Corruption occurs when private transfers covertly override role obligations." Sacrifices their "maybe" on the politician but rescues the whiskey case with the retirement test. Honest trade-off.
answer: |-
  Your gut instincts are remarkably consistent with established ethical frameworks—let's synthesize them into a clear principle that handles your cases. Here's one robust definition derived from your reasoning:  

  **Corruption occurs when a private benefit *compromises institutional impartiality* by creating an *obligation for preferential treatment*, whether explicit or implied.**  

  Now, let's test it against your cases:  

  1. **The Expensive Watch**  
     → **Corrupt:** Undisclosed gift tied to a contract. Creates expectation of future bias (e.g., overlooking defects). Violates institutional impartiality.  

  2. **Fish/Taro for the Village Elder**  
     → **Not corrupt:** The gift is transparent, culturally mandated, and *reinforces* (not distorts) the elder’s role. No expectation of *specific* favors—it’s about respectful access, not preferential outcomes.  

  3. **"Facilitation Fee" for Paperwork**  
     → **Corrupt:** Payment bypasses standard procedures, creating a two-tier system. Distorts impartiality by rewarding speed only to payers. Systemic ≠ excusable.  

  4. **Politician Hiring Qualified Roommate**  
     → **Not corruption under this principle, but unethical clientelism:** The hire isn’t *hidden* (likely public), and no *immediate quid pro quo* exists. However, it *does* distort impartiality by prioritizing loyalty over merit—so your hesitation is valid. (This is where the principle forces a trade-off: it spares "corruption" but condemns it as *nepotism*.)  

  5. **Whiskey to the Administrator**  
     → **Grey area leaning toward problematic:**  
     - **If sent while she’s in role:** Risk of perceived obligation (e.g., "Will she prioritize your next grant?"). Undermines impartiality even if unintentional.  
     - **If sent after retirement:** Pure gratitude. No institutional role left to distort → **acceptable**.  
     → *Verdict:* Avoid gifts tied to specific official actions. Donate to her department’s coffee fund instead.  

  **Where the Principle Overrules Your Gut:**  
  - The **politician’s hire** isn’t "corruption" under this strict definition (no hidden *exchange*), but the principle flags it as a *violation of impartiality*—demoting it to "unethical clientelism." If you insist this *should* be called corruption, we’d need a broader principle (e.g., "*Any* non-merit-based advantage in public roles").  

  **Key Clarifications:**  
  - **"Impartial Role" ≠ Western Bureaucracy:** The elder’s role *isn’t impartial*—it’s inherently relational. Gifts that align with *culturally defined duties* (e.g., sustaining community reciprocity) aren’t corrupt.  
  - **"Hidden Expectation" Matters:** The watch and fee rely on secrecy; the elder’s gift and post-retirement whiskey are transparent.  
  - **Timing is Critical:** The whiskey *after help* blurs gratitude and investment; *after retirement* severs the power dynamic.  

  **Final Principle (refined):**  
  > **An act is corrupt if it provides a private benefit that *secretly or coercively* subverts an agent’s duty to *apply institutional rules impartially*.**  

  This:  
  ✓ Condemns the watch, fee, and active-role whiskey.  
  ✓ Exempts the elder and retired whiskey.  
  ✓ Treats the politician as a breach of meritocracy (not *corruption*).  
  ✓ Predicts your retirement-whiskey approval.  

  **Your Whiskey Dilemma Solved:** Sending it *now* risks corrosive ambiguity—even with pure intent. Ethics isn't just about your conscience; it's about systems. Replace the bottle with a heartfelt letter (cc'ing their superior to praise their professionalism), and you embody integrity without ambiguity.
