prompt: |-
  I'm taking an upper-level seminar in philosophy of biology, and this week's discussion turned on the logic of costly signaling and the handicap principle. One of my classmates defended a view I have also seen in popular science writing: conspicuous consumption — designer clothes, luxury cars, status watches — is best understood on the model of the peacock's tail. Her argument ran as follows. Both are expensive, apparently wasteful displays whose credibility seems to come from the cost itself. Just as a peacock's tail honestly advertises viability because only a healthy bird can grow and carry one, a luxury watch honestly advertises disposable wealth because the wearer had to spend it; and just as it would be wrong to call the tail a pointless burden without asking what it is for, it is wrong to treat luxury consumption as mere waste or irrationality. She used this to push against the idea that consumerist display is a social pathology, or that advertising is simply manipulative, arguing that both amount to mistaking an honest signaling system for a pointlessly wasteful one.

  I want to know how far this analogy actually holds, because I suspect it is doing more work in her argument than she admits. What I'm looking for is not a list of casual objections, but a systematic audit. What exactly maps onto what — the peahen, the tail, the cost of growing it, the health it advertises, and the conditions that make it an honest signal; what plays those roles in the human consumption case, and how well? Where does the mapping break? Which features of the biological source — sexual selection, differential costs, the link between display and underlying condition — does the analogy quietly import into the target without argument, and are those features actually present among human consumers? And once the disanalogies are on the table, does her conclusion survive: is conspicuous consumption reasonably treated as an honest signaling system, or was the analogy carrying the whole argument? If the peacock is a poor source model, I would also like to hear what a better analogy would be, if one exists.

  Please present the audit as a JSON object with the following fields. `summary`: a one-paragraph bottom-line statement of the overall verdict. `correspondence_table`: an array of objects, each with `source_element` (the component of the peacock-tail case), `target_element` (the proposed counterpart in the human case), `mapping_quality` (one of "strong", "partial", or "weak"), and `notes` (a sentence or two on whether the mapping preserves the feature that matters). `disanalogies`: an array of objects, each with `feature` (the feature the analogy imports from the source), `break_in_target` (what goes wrong with it in the consumption case), `material` (a boolean: whether this disanalogy matters for the intended conclusion), and `explanation` (why it matters or does not). `quiet_imports`: an array of strings naming assumptions the analogy brings along without saying so. `verdict`: an object with `conclusion_survives` (one of "yes", "qualified", or "no") and `statement` (a sentence or two justifying that judgment). `better_analogy`: a string giving a replacement analogy and why it is better, or null if you think none is available.
