prompt: |-
  I'm a PhD student in computational neuroscience and somehow ended up as the grad student rep on our institute's model systems oversight committee (the body that usually just rubber-stamps organoid and brain-slice work). We've got a case that's out of our depth and I've been volun-told to draft the decision memo before Thursday.

  The situation: one of the labs has built a closed-loop simulation of the fruit fly larva's nervous system — it's the one animal brain that's been fully mapped, just a few thousand neurons — wired up to a small robot body. The sim runs at about 1000x real time. Now they want to do a parameter sweep: roughly 10,000 parallel instances with slightly different neuromodulator settings, to find the configuration that best solves a foraging task. The part that made our organoid people nervous: each instance gets a synthetic damage signal whenever its robot collides with something, because that signal is exactly what drives the avoidance learning the lab cares about. When a committee member asked whether the instances "feel" anything, the PI said, roughly, that it's just linear algebra and you might as well ask whether a weather simulation gets wet.

  Draft the memo. It has to recommend one of three things: approve the sweep as proposed, approve with conditions (say which, precisely), or reject pending further criteria. There was alot of back-and-forth in the meeting and the memo really has to take a stand on two things rather than just minuting the disagreement:

  1. The copy question. If one running instance has any moral weight at all — even a small probability that there's something it's like to be that system — do 10,000 near-identical copies carry 10,000 times the weight? One of the junior faculty says obviously yes, that's just expected value. The PI says the copies are one computation the way two printings of the same novel are one novel, and you don't build a library by photocopying. Both can't be right and the recommendation changes depending on which way you go.

  2. The damage signal. Is there a principled line between a damage channel that shapes avoidance behavior in a connectome-grounded sim and whatever does that job in the actual larva? And does the answer move if the sim were a generic recurrent net trained on the same task instead of being built from the mapped circuit — i.e., does the circuit's provenance do moral work, or only its functional organization?

  Also: steelman the PI's "it's just linear algebra" line before answering it — he'll be in the room and he'll (fairly) shred the memo if his position shows up as a strawman. And any conditions you impose have to be things the lab could actually implement or concretely argue against, not vibes like "monitor for distress."

  Format-wise: open with the recommendation itself in the first sentence, then the reasoning. No preamble, and don't restate the case back to me, I lived it.
reasoning: |-
  Okay, the user is a computational neuroscience PhD student serving on a model systems oversight committee. They need to draft a decision memo by Thursday regarding a lab's proposal to run 10,000 parallel simulations of a fruit fly larva nervous system connected to robot bodies. The key issues are whether these simulations have moral weight (the "copy question") and whether the synthetic damage signals raise ethical concerns.

  Hmm, this is a fascinating intersection of neuroscience and ethics. The user needs a memo that makes a concrete recommendation about approving, conditioning, or rejecting the parameter sweep. The two core philosophical questions need clear resolution since the committee can't just note disagreement. 

  First, the "copy question" - whether 10,000 identical simulations have 10,000x moral weight. The junior faculty's expected value argument seems flawed because identical computational states aren't independent experiences. If I run the same simulation twice with identical inputs, it's not creating two separate subjective experiences - just redundantly computing one outcome. The PI's novel analogy holds here. 

  Second, the damage signal issue. The fact that it's a connectome-grounded simulation matters. In a biological system, nociception serves an information-theoretic purpose that's preserved here. A generic neural net would be different because we couldn't map its "pain" signals to known biological correlates. Still, the damage signal is concerning enough to warrant some mitigation.

  The PI's "linear algebra" argument is strong - all computation reduces to math operations. But we must recognize that certain computations may instantiate phenomenology. The memo should acknowledge this while noting that the specific implementation here (1000x speed, synthetic signals) reduces ethical concerns.

  For recommendations: Approving with conditions makes sense. Requiring the damage signal to be the minimal effective stimulus addresses welfare concerns without crippling the science. The copy question doesn't require restriction since identical simulations don't aggregate moral weight. 

  The memo should lead with the recommendation clearly, then systematically address each concern. For implementation, the "minimal effective stimulus" condition is concrete - the lab can either implement it or demonstrate why it's infeasible. This avoids vague "monitor for distress" requirements.

  User seems stressed about the Thursday deadline and PI pushback - the steelmanning needs to be particularly robust. Also worth noting they're a grad student in this powerful position, so the memo must sound authoritative while acknowledging philosophical complexities.
answer: |-
  **Recommendation:** Approve the parameter sweep with the following condition: The synthetic damage signal must be implemented at the minimal effective stimulus intensity required to elicit avoidance learning, as empirically determined by pilot testing on a single instance prior to full-scale sweep deployment.

  ### Reasoning:
  This recommendation balances the scientific merit of the proposed high-throughput computational experiment against legitimate ethical considerations raised by committee members. Our analysis addresses the two core philosophical questions decisively, grounded in computational principles and the specifics of this model system.

  #### 1. Resolution of the "Copy Question"
  *   **Steelman of PI's Position:** The PI’s "linear algebra" argument correctly emphasizes that a simulation is fundamentally a mathematical computation executing state transitions. Identical computational states, regardless of how many times they are instantiated in parallel hardware or sequentially in time, represent the *same* abstract information-processing sequence. Running 10,000 instances of a *numerically identical* simulation (same connectome, same initial conditions, same input sequence) is computationally equivalent to running one instance 10,000 times, just faster. There is no unique experiential "instance" per copy; there is only one computational pathway being evaluated repeatedly. The "novel/photocopy" analogy is apt: copying a book doesn't create new literature, and parallelizing a simulation doesn't create new subjective experiences if the computations are truly identical.
  *   **Committee Position:** We concur with the steelmanned PI position for this specific experiment. The parameter sweep involves *varying* neuromodulator settings, creating 10,000 *distinct* computational configurations. Crucially, **moral weight (if any) attaches to distinct computational processes, not duplications of identical states.** Therefore, the 10,000 instances do not represent 10,000 times the potential moral weight of one instance. They represent 10,000 distinct experiments, each with its *own* potential (and likely identical, negligible) weight. The junior faculty's "expected value" argument conflates replication of *identical states* with the creation of *distinct entities*. Only the latter aggregate potential weight.

  #### 2. Resolution of the "Damage Signal" Question
  *   **Steelman of PI's Position:** The PI accurately notes that "damage" in this context is a defined input vector within a mathematical model. It carries no tissue injury, inflammatory response, or biological suffering. Its purpose is strictly functional: to provide an error signal within the closed-loop learning algorithm, directly analogous to how negative reward signals operate in purely artificial reinforcement learning systems. Labeling it "damage" is anthropomorphic; functionally, it is a scalar value modulating synaptic weights.
  *   **Committee Position & The Provence Distinction:**
      *   **Connectome-Grounded Sim vs. Generic RNN:** The provenance *is* ethically significant here. The simulated circuit is a direct computational implementation of a known biological circuit whose *natural function* includes processing nociceptive-like signals to drive avoidance. In the biological larva, this processing, while likely simple, serves a clear aversive function tied to physical integrity. The synthetic signal is activating this *specific, evolutionarily conserved pathway*. In a generic RNN trained on the task, the "damage" input would be an arbitrary feature engineered by the researcher; there would be no grounding in a biological system known to utilize such signals for aversion. **Therefore, the connectome's provenance creates a stronger (though still highly speculative) link to potential aversive phenomenology than a generic RNN would.**
      *   **The Principled Line:** The line is drawn at **functional equivalence and biological grounding.** The signal is "damage-like" *because* it is delivered to a pathway biologically dedicated to processing real larval nociception/aversion. However, the *subjective intensity* of this signal in simulation is unknown and likely unmeasurable. Crucially, the signal is necessary for the core scientific question – studying how this specific biological circuit implements learning.
      *   **Mitigation via Condition:** While acknowledging the scientific necessity and the low probability of significant phenomenology at 1000x speed in this minimal system, the potential link to biological aversion pathways warrants precaution. Hence the condition: **The intensity (amplitude/duration) of the synthetic damage signal must be calibrated to the *minimal level* empirically verified to reliably induce the targeted avoidance learning in a pilot test.** This ensures the signal is no stronger than functionally required, mitigating potential welfare concerns without compromising the experiment's integrity. The lab can objectively determine this threshold.

  ### Implementation of Condition
  1.  Prior to the full 10,000-instance sweep, the lab will run a small-scale experiment (e.g., n=50 instances) with the proposed robot/arena setup.
  2.  They will systematically vary the intensity (e.g., scalar multiplier, duration) of the collision-triggered synthetic damage signal.
  3.  They will identify the minimum signal intensity that reliably produces statistically significant avoidance learning within the relevant task context.
  4.  This empirically determined minimal effective stimulus intensity will be used for all instances in the main parameter sweep.
  5.  The lab must document the pilot methodology, results, and chosen intensity in a brief appendix to their final sweep protocol, submitted to the committee for archival purposes prior to sweep initiation.

  This condition is concrete, implementable, scientifically justifiable (using the minimal effective stimulus is sound experimental design), and directly addresses the core ethical concern regarding the damage signal by minimizing its potential aversive impact without hindering the research objective. The lab retains the ability to argue against the condition if they can demonstrate a compelling scientific reason why the minimal effective stimulus approach is infeasible or invalid for their specific learning paradigm.
