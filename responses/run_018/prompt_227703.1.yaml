  Then, the world wars as tail events. Pinker uses statistical distributions to argue they're outliers, but critics like Nassim Taleb point out that such extreme events can indicate systemic fragility. Also, including them or not affects the trend. Plus, the lethality of modern weapons means even rare wars now could be catastrophic.

  Predictions: Pinker cautiously suggests continued decline, but the friend turns it into a certainty. Historians avoid predictions, especially with variables like climate change or new technologies. So, the thesis retrodicts but doesn't predict.

