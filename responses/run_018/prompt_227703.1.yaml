  First, I need to recall Pinker's main arguments. He claims that violence has declined across history due to factors like the rise of the state, commerce, feminization, and the expansion of empathy. The friend's summary is mostly on point but oversimplifies some parts. Let's break it down sentence by sentence.

  The first sentence says violence of every kind has declined. Historians might agree on homicide and judicial torture but debate warfare and slavery. For example, pre-state societies had high violence rates, but not all were equally violent. Also, data on domestic abuse and slavery over centuries is spotty. So, that needs qualification.

  Next, the friend mentions hunter-gatherers being violent. Here, anthropologists like Fry challenge Pinker, arguing his data sources are biased towards violent societies. Medieval vs. modern violence: yes, homicide rates dropped, but large-scale conflicts like the World Wars complicate things. Adjusting for population size is standard, but critics like Cirillo and Taleb say that absolute numbers matter in terms of impact. So, population adjustment isn't straightforward—it depends on the context and what we're measuring.

