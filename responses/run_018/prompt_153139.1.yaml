  - And those bedrock intuitions... either you feel nonexistence is a void or a deprivation, and no logic can bridge that gap

  The replacement problem is fascinating. If the user doesn't create child A, and child B gets born instead, does that invalidate the asymmetry? Only if we think the asymmetry applies to specific individuals rather than existence itself. But that might be a rabbit hole...

