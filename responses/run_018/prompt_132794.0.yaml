prompt: |-
  hey—need a prompt for my dataset on Rorty. Draft the joint statement that a committed Rortyan neopragmatist/antirepresentationalist and a representationalist critic could both sign after a good-faith adversarial collaboration. The Rortyan side holds that truth is made rather than found, rejects the mirror of nature image, and treats justification as all we have; the critic thinks this collapses truth into peer consensus and makes science impossible to take seriously.

  Format: numbered agreed-claims section—about the history of the mirror metaphor, about whether Rorty denies external reality or just denies a particular philosophical picture of it, about what's actually at stake in correspondence theories. Then a disagreements table: precise formulations of their split, each phrased so its own side accepts the wording.

  Cruxes: (1) is the made-not-found claim metaphysical or just therapeutic? (2) can antirepresentationalism handle counterfactual stability—e.g., if quantum mechanics had never been discovered, are atomic truths different or just our beliefs? (3) does Rorty's view secretly rely on a causal story about belief-formation that it officially rejects?

  For each crux, name a concrete case or argument both agree bears on it, with each side's prediction recorded in advance. Also have them seperate out verbal disagreements from substantive ones.

  Keep it in the weeds but don't ask for bibliographies or reading lists—work with concepts a model actually knows. Push past standard textbook summaries by forcing engagement with modal counterfactuals in science and hidden causal commitments. Write casual, maybe a typo or two since i'm rushing this.
