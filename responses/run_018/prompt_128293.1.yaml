  For the four verdicts:
  1) Perceptual-formalist must see aesthetic improvement - so the reconstruction should fix past damage/aging while preserving visible qualities
  2) Provenance-chain theorist must reject it - so the synthetic object breaks causal lineage despite appearance
  3) Material-continuity view should prioritize charred fragments - even though they contain 60% inauthentic material 
  4) Institutional view needs built-in authorization tension - board's retroactive approval could shift its status

  The nested inauthenticity is crucial: the "original" wasn't fully authentic to begin with. If we strip that away, material-continuity collapses (authentic fragments would clearly trump synthetic replica) and provenance-chain loses nuance. 

  Now to anticipate counterarguments: a provenance-chain defender would likely argue the synthetic object simulates rather than restores artistic value, since no causal link exists. I should clearly separate settled ideas (institutional context matters) from contested ones (whether origin is necessary for aesthetic value).

  The response should walk through each position's reasoning explicitly, pinning each verdict to specific scenario features:
  - Perceptual improvement → non-contact synthesis fixing past damage
  - Provenance rejection → broken causal chain
  - Fragment preference → material persistence despite inauthenticity
  - Institutional tension → retroactive authorization possibility

  Finally, I'll flag where philosophy has consensus (institutional shaping of artistic properties) versus open debates (causal necessity for aesthetic value), being careful not to present contested views as settled.
answer: |-
  Here is a thought experiment designed to meet your specifications, followed by an analysis:

  **Scenario:** The Worcester Art Museum’s *Portrait of a Young Woman*, long attributed to Frans Hals, was severely damaged in a 2023 fire. Pre-fire technical analysis revealed it was a pastiche: only 60% was 17th-century material (consistent with Hals’ workshop), while 40% was a sophisticated 1920s restoration-forgery using period-accurate pigments and artificial aging. Post-fire, the charred fragments (comprising ~15% of the original surface, with 60% being the 1920s material) were stabilized. A conservation team used hyperspectral imaging and mass spectrometry on these fragments to create a full-scale digital reconstruction. This data drove a non-contact fabrication process: pigments were synthesized to match spectral signatures and applied via aerosol deposition in a climate-controlled chamber, with brushstroke topography replicated via micromilling guided by AI analysis of pre-fire photos. No conservator touched the fragments. The resulting synthetic panel now hangs in place of the lost work. The museum’s board debates whether to authorize it as the "legitimate successor" to the original accession record.

  ---

  ### Analysis Against Specifications:
  1.  **Perceptual-Formalist Verdict (Aesthetic Value Restored/Improved):**  
      The synthetic panel presents an optically continuous surface without fire damage, craquelure, or discoloration from the 1920s additions that subtly disrupted color harmony. A formalist, concerned only with perceptible qualities (line, color, composition), sees the work’s visual coherence *enhanced*—damage and aging anomalies are removed while formal relationships are preserved.  
      *Philosophical Lever:* **Non-contact synthesis** allows "correction" of historical degradation without human interpretive mediation.  
      *Collapse if Pastiche Removed:* If the original was fully authentic, formalists might argue that aging was *part* of its aesthetic essence; "improving" it becomes controversial restoration, not recovery.

  2.  **Provenance-Chain Theorist Verdict (No Artistic Value):**  
      The object on display has no causal link to Hals’ artistic intention or 17th-century creation. It is a data-driven fabrication by 21st-century technicians, derived from fragments mostly not from Hals’ era. Its genesis is technological, not artistic, regardless of appearance.  
      *Philosophical Lever:* **Nested inauthenticity** is irrelevant; the *synthetic object’s origin* breaks the chain entirely. It is a new artifact simulating another.  
      *Collapse if Pastiche Removed:* If the original was fully authentic, the theorist might grant *some* diminished value to fragments retaining causal links; here, even fragments are mostly inauthentic.

  3.  **Material-Continuity View Verdict (Fragments > Synthetic Panel):**  
      The charred fragments possess physical persistence: 40% of their material potentially traces to the 17th century (albeit ambiguously), and they are the *only* surviving matter touched by historical agents (both Hals’ workshop and the 1920s restorer). The synthetic panel, however, has no material connection to any historical moment of creation or intervention.  
      *Philosophical Lever:* **Nested inauthenticity** doesn’t erase material history; the fragments *are* the relic, however compromised. The synthetic object is ontologically sterile.  
      *Collapse if Pastiche Removed:* If fragments were fully authentic, their superiority would be uncontested. The pastiche forces a defense of materially degraded but historically "loaded" objects.

  4.  **Institutional-Designation View Verdict (Initial Withholding, Pressure to Confer):**  
      Initially, the synthetic panel lacks artistic status—it is a facsimile produced for conservation/display purposes, not an artwork authorized by the institution. However, if the board retroactively designates it as the "legitimate successor" to the original accession, the institution coherently *converts* it into an artwork by fiat, fulfilling its role as status-conferrer.  
      *Philosophical Lever:* **Authorization option** creates institutional tension. Designation is malleable but requires intentional action.  
      *Collapse if Pastiche Removed:* Authorization pressure lessens; a "pure" original’s loss might make designation of a replica seem more like capitulation than a legitimate institutional act.

  ---

  ### Provenance-Chain Defense & Key Controversy:
  A provenance-chain theorist would reject the framing that the synthetic object "restores" artistic value. They argue:  
  * *"Restoration" implies continuity of identity*. This is simulation, not revival—the artwork ceased to exist in the fire. The synthetic panel is a new informational artifact, akin to a perfect hologram. Its value is pedagogical (showing what was lost) or aesthetic (as a contemporary image), but *not* the artistic value of the Hals-associated object. The nested inauthenticity of the original is irrelevant; even a "pure" Vermeer couldn’t be replaced this way.*  

  ---

  ### Settled vs. Contested in Philosophy of Art:
  | **Relatively Settled**                                                                 | **Genuinely Contested**                                                                                     |
  |----------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------|
  | Institutional context shapes *some* artistic properties (e.g., Duchamp’s Fountain).    | Whether causal origin is *necessary* for artistic/aesthetic value (e.g., is a perfect copy valueless?).     |
  | Material authenticity impacts conservation ethics and historical value.                | Whether aesthetic value supervenes *solely* on perceptual properties.                                       |
  | Art status can be institutionally conferred (per Dickie’s Institutional Theory).       | Whether artistic value is distinct from aesthetic value in cases of replication.                            |
  | Forgery can diminish artistic value by deceiving viewers about origins.               | The ontological status of destroyed/reconstructed works (cease to exist vs. persist in new forms).          |

  **Key Insight:** This scenario exploits tensions between *materiality*, *perception*, *origin*, and *authorization*. The pastiche layer destabilizes appeals to "original substance," while non-contact synthesis decouples perceptual recovery from physical intervention. The board’s choice highlights institutional power’s limits—it can confer status but cannot resolve deeper ontological disputes about identity and value.
