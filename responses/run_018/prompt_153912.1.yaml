answer: |-
  ## Research Proposal: Distributed Causal Accountability in Environmental History: Excavating the Non-Human Excuse

  **1. Core Research Question:**  
  Can we construct a consistent conceptual framework ("distributed causal accountability") that attributes *real causal weight* to non-human entities (germs, volcanoes, climate patterns) in historical events *without* absolving human actors/institutions of responsibility? Crucially, does this framework hold when applied to historical cases like cholera epidemiology and Tambora's climate forcing, and can it distinguish *legitimate* non-human causal attribution from its use as an *institutional excuse*?

  **2. The Gap in Current Scholarship:**  
  Existing discourse presents a false dichotomy: either embracing non-human "agency" (posthumanism) or rejecting it as dangerous determinism. This misses a critical historical reality: invoking non-human causes (weather, "bad air," volcanic aerosols) was often a deliberate strategy to *distract from* or *justify* human institutional failings (sanitation neglect, relief mismanagement, colonial extraction). Philosophers of science often treat "determinism" monolithically, failing to parse the *rhetorical function* of causal claims. Historians of medicine analyze germ theory and miasma theory as distinct epistemic shifts, neglecting the *structural similarity* in how causal blame was distributed onto non-human actors, regardless of ontological accuracy, to shield human systems. This project bridges philosophy of causation, history of science/medicine, and environmental history to address this specific blind spot.

  **3. Conceptual Approach (vs. Obvious Alternatives):**  
  This project rejects two common alternatives:  
  *   **More Case Studies:** Adding isolated examples without a rigorous conceptual lens won't resolve the *coherence* of the distinction itself.  
  *   **Another Determinism Critique:** Simply re-stating the dangers of determinism ignores the *nuanced function* of non-human causal claims *within* complex socio-ecological systems.  

  Instead, the project employs **close conceptual analysis of primary source language** to map how causal responsibility is discursively distributed:  
  *   **Method:** Deep textual analysis of 19th-century English-language medical journals/reports on cholera outbreaks and contemporary accounts/administrative reports on the 1815 Tambora eruption's climatic/famine impacts.  
  *   **Focus:** Identifying *how* non-human entities are positioned as causes, *what* human actions/institutions are simultaneously described (or omitted), and the *explanatory work* assigned to each. Does the non-human cause function as the *primary driver*, a *trigger*, a *context*, or an *absolution*?  
  *   **Framework Development:** Building "distributed causal accountability" by analyzing the *relationships* and *relative weights* ascribed to human and non-human factors in the narratives. Does the account allow for meaningful human intervention *despite* the non-human factor?  

  **4. Defining Success & Failure:**  
  *   **Success:** The development of **three empirically grounded conditions** that distinguish legitimate non-human causal attribution from determinist excuses (e.g., Condition 1: Human institutional capacity to *mitigate* the impact is explicitly acknowledged/analyzed alongside the non-human cause; Condition 2: The non-human cause is not presented as the *sole necessary and sufficient* condition for the outcome; Condition 3: The account avoids language implying human actions are *causally impotent* in the face of the non-human factor). This framework will be demonstrated to *work* convincingly in one case (e.g., a specific cholera report accurately describing both vibrio transmission *and* sanitation failures) and *collapse* or require refinement in another (e.g., a Tambora famine report blaming "the volcano" while ignoring price gouging or colonial policies).  
  *   **Failure:** The research conclusively demonstrates that the distinction between legitimate non-human causation and determinist excuse is either **impossible to coherently define** based on textual evidence (the concepts are always entangled beyond separation) or **trivial** (the distinction reduces to obvious factors like authorial intent or simple factual accuracy, offering no new analytical insight).  

  **5. Scope & Feasibility (6 weeks, $15k):**  
  *   **Focus:** Two core historical pairings:  
      1.  **Cholera/Microbes:** Analysis of medical reports/debates (c. 1830s-1890s) focusing on the shift *within* germ theory discussions and contrasting it with earlier miasma/weather blame.  
      2.  **Tambora/Climate:** Analysis of famine reports, administrative correspondence, and contemporary scientific accounts (1815-1820) in Britain/India/Europe.  
  *   **Modern Comparison:** *Brief* conceptual application to one modern example (e.g., climate attribution science in a specific disaster report) to test the framework's relevance, *not* a full case study.  
  *   **Sources:** Limited to digitized English-language medical journals (e.g., *The Lancet* archives, Wellcome collections) and established Tambora climate/famine datasets/report collections (e.g., H. Stommel's work, British colonial archives online). *No* global pandemic survey.  
  *   **Output:** A detailed working paper framing the problem, outlining the framework and conditions, presenting the paired analyses, and evaluating success/failure.  
  *   **Budget Justification:** Funds support dedicated research time (stipend/summer salary), specialized database access (e.g., historical journal archives), potential research assistance for sourcing specific documents, and minimal travel if critical physical archives are identified (unlikely given scope).  
  *   **Key Risk:** Scattered primary sources. **Mitigation:** Strict adherence to defined source sets (English journals, curated Tambora datasets); acceptance that comprehensiveness is secondary to conceptual depth on selected, representative texts.  

  **Why This Matters:**  
  This project moves beyond stale agency/determinism debates to investigate a concrete historical *practice*: the instrumental use of non-human causation. By developing "distributed causal accountability," it offers historians a sharper tool to analyze responsibility in complex socio-ecological events – past and present – where both microbes and institutions, volcanoes and policies, truly interact. It forces us to ask not just *if* non-humans act, but *how* claims about their actions function within human power structures.
