answer: |-
  Here are 10 tightly sequenced questions designed to probe the revisionist "normative contamination" account deeply, moving beyond restatement and targeting key theoretical and empirical commitments, suitable for a 45-minute interview:

  1.  **Core Mechanism:** "Your core thesis posits an interaction between detecting a norm-violation and whether a side-effect serves as a *means* to the agent's goal versus a mere *byproduct*. Can you walk us through the specific cognitive mechanism by which the 'means-status' of an outcome fundamentally *alters* how the norm-violation detection system processes that outcome? What's happening differently cognitively when a bad outcome is a means compared to when it's a byproduct?"
  2.  **Interaction Dynamics (Follow-up):** "Building on that mechanism: Is this interaction best characterized as *multiplicative* (where means-status amplifies the signal from norm-violation detection) or as operating via a *threshold* (where means-status acts as a necessary gate or switch for norm-violation detection to impact intentionality judgments)? What empirical evidence or theoretical reasoning leads you to favor one model over the other?"
  3.  **Control for Affect/Salience:** "Critics might argue that your predicted reversal could stem from generic asymmetries in affective priming or outcome salience (bad means might just be more shocking/attention-grabbing than good byproducts), not your specific 'normative contamination'. You often cite matched-valence vignettes as controlling for affect. Why are you confident that matching the *moral valence* of the outcomes (good/bad) sufficiently controls for *all* relevant affective or salience differences that could drive judgments, especially given the central role of 'norm-violation detection' which itself carries affective weight?"
  4.  **Original Knobe Asymmetry (Existence/Explanation):** "Let's apply your framework to the original Knobe effect itself, where *both* the harmful and helpful outcomes are presented as foreseen but unintended *byproducts*. According to your account, does the robust asymmetry in intentionality judgments (high for harm, low for help) genuinely exist in these cases? If yes, how does 'normative contamination' explain it *without* relying on the means/byproduct distinction that wasn't manipulated?"
  5.  **Modularity Defense (Follow-up):** "You likely explain the original asymmetry by emphasizing norm-violation detection driving intentionality judgments for the harmful byproduct, uncontaminated by means-status. This seems to posit distinct cognitive modules: one for norm-violation detection influencing intentionality, and another process handling the means/byproduct distinction that *modulates* the first. How does this proposed modular architecture *fundamentally distinguish* your 'normative contamination' account from the standard 'moral evaluation drives judgment' view? Doesn't 'norm-violation detection' functionally *constitute* a core part of moral evaluation?"
  6.  **Theoretical Demarcation:** "Could a proponent of the moral evaluation view simply co-opt your 'means-status' finding by arguing that moral evaluation is *sensitive* to the instrumental role an outcome plays in the agent's plan? What specific aspect of your mechanism or predicted pattern (like the *reversal*) definitively carves out 'normative contamination' as a *distinct phenomenon* irreducible to moral evaluation?"
  7.  **Predictive Power & Reversal:** "Your key empirical prediction is that redesigning the *harmful* outcome as a *necessary means* and the *beneficial* outcome as a *mere byproduct* won't just weaken the original asymmetry but *reverse* it (high intentionality for help-as-byproduct, low for harm-as-means). What specific features of your vignettes ensure that the 'harm-as-means' condition is perceived as a genuine norm-violation *and* a necessary means, while the 'help-as-byproduct' is seen as normatively positive *but* truly incidental? How do you rule out participants seeing the 'harm-as-means' as *justified* (thus reducing norm-violation) or the 'help-as-byproduct' as somehow *intended* anyway?"
  8.  **Boundary Conditions:** "Does 'normative contamination' require the norm-violation to be *moral*, or could it operate with purely *conventional* or *prudential* norm violations? If you predict it only works for *moral* norms, doesn't that again blur the line with moral evaluation accounts?"
  9.  **Alternative Explanations:** "Some accounts (e.g., 'Skewed Defaults') suggest the asymmetry arises because harmful side-effects are statistically rarer/more diagnostic of intent than helpful ones. How does your 'normative contamination' framework, centered on the agent's *plan structure* and norm-violation, specifically rule out or subsume these kinds of purely statistical or epistemic explanations for both the original effect and your predicted reversal?"
  10. **Falsifiability:** "Let's conclude with a crucial test: Imagine you run your critical experiment (Harm-as-Means vs. Help-as-Byproduct) and find either: a) *No reversal* – the asymmetry persists (high intent for harm-as-means, low for help-as-byproduct) or b) A *reversal*, but *only* when the means-outcome is *bad* (i.e., if you ran a parallel condition with Help-as-Means and Harm-as-Byproduct, the 'original' asymmetry remained strong). What specific result like this would constitute genuine *disconfirmation* of your core thesis about the interaction between norm-violation and means-status, rather than just prompting adjustments to vignette wording or auxiliary assumptions?"

  **Sequence Rationale:**

  1.  **Opens** with the core mechanism (Q1), forcing specification, immediately followed by probing its operational dynamics (Q2).
  2.  **Challenges** experimental control (Q3), keyed to her likely reliance on valence-matching.
  3.  **Applies** the theory to the original Knobe finding (Q4), forcing her to confront its existence/explanation under her model.
  4.  **Directly tackles** the crucial theoretical distinction from moral evaluation via modularity (Q5) and boundary-setting (Q6).
  5.  **Focuses** on the critical novel prediction (Q7), ensuring clarity on what constitutes a valid test.
  6.  **Considers** competing explanations (Q8) to demonstrate scope and uniqueness.
  7.  **Ends** with falsifiability (Q9), demanding clarity on what would make her abandon the core thesis. This progression moves logically from mechanism to evidence to theoretical boundaries and finally to testability, maximizing depth within the time constraint.
