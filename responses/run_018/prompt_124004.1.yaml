  I'll make sure the example is concrete and shows the entanglement. Geometry is perfect because it has a historical shift from Euclidean to non-Euclidean in physics, which Quine himself referenced. This demonstrates the tension: we can't insulate axioms from empirical refutation once they're part of a tested theory. Quine's point is that no part of the web is immune, including what were once thought to be analytic truths.
answer: |-
  The core tension arises when a conventionally stipulated axiom, initially treated as a purely definitional expansion devoid of empirical content, becomes inextricably entangled with empirical predictions through holistic confirmation, forcing its status as a mere convention into conflict with its functional role within an empirically tested theory. Consider the formal axiomatization of geometry: initially, one might stipulate Euclid's parallel postulate as a purely conventional *definition* of "parallel" lines within a formal system, seemingly analytic and immune to empirical falsification. However, when this geometric system is embedded within a broader physical theory like Newtonian mechanics to describe spatial relationships and predict motions (e.g., planetary orbits), the entire theoretical structure, *including* the geometric axioms, faces the "tribunal of experience" holistically. If observations consistently conflict with predictions derived from the system (e.g., the anomalous precession of Mercury's orbit), revision can occur at multiple points: altering physical laws, modifying force concepts, or crucially, *replacing the geometric axiom itself* with a non-Euclidean alternative (as in General Relativity). At this point, treating the parallel postulate as *merely* a conventional definition becomes unsustainable; its adoption or rejection is empirically motivated by the need to preserve the overall coherence and predictive success of the encompassing physical theory. This entanglement demonstrates that conventionalism about stipulation (holding the axiom is true by fiat) conflicts with holism (which subjects all components to potential revision based on empirical adequacy). Crucially, this isn't simple empiricism because the decision to revise the axiom isn't dictated by a single, direct observation contradicting *it alone*; rather, it stems from the axiom's role within a complex, interconnected web of beliefs facing recalcitrant experience as a whole, blurring the line between definitional convention and empirical hypothesis.
