prompt: |-
  hey — I'm writing up exercises for my grad seminar and I want one that doesn't just replay the standard ubuntu vs liberalism comparison everyone has seen a million times. Take the relational view that personhood is constituted through recipricol recognition and communal belonging — specifically the Bantu idea that moral status is distributed across relationships rather than anchored in an intrinsic property of the individual — and restate it in the vocabulary of federated machine learning: nodes, gradient agregation, consensus rounds, differential privacy budgets, model drift. Do it precisely, without smuggling in liberal assumptions about autonomous agents. Then report the residue: what translates cleanly, what must be distorted, and what has no expression at all in the engineering frame. Is the leftover a failure of the metaphor, or does it show ubuntu is doing work that engineering vocabulary can't capture? Give me exactly five numbered items, each a sentence or two, with no introduction or conclusion. Don't ask for citations — just work with the concepts.
