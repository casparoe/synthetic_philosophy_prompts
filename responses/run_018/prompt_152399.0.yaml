answer: |-
  The old navigation lattice groaned, a deep-throated vibration Kael felt in his teeth more than heard through his helmet comms. Decades of ocean pressure had warped its analog pathways, the vital current guides for surface vessels now a fragile relic in a digital age. Kael floated beside it in the crushing dark, the familiar weight of his deep-sea suit feeling alien after five years planetside. Beside him, Lyra’s newbie suit lights bobbed nervously as she scanned the schematics glowing on her forearm display.

  "The tertiary junction, Lyra," Kael’s voice crackled, calm despite the tremor in his hands as he gripped a guide rail. "Pressure differentials indicate the main regulator valve is jammed at seventy percent retraction. Manual override procedure is section 4.7.3." He *knew* the numbers, the torque specs, the sequence etched into his mind from years of poring over manuals before his transfer. *Knowing that* was solid, transferable.

  Lyra moved, her movements hesitant but precise. She found the recessed valve wheel, braced her boots against the lattice frame, and heaved. Nothing. "It’s seized, Kael. Won’t budge."

  "Apply counter-torque on the secondary stabilizer bolt *first*," Kael instructed, the sequence clear as text in his mind. "Section 4.7.3, subsection C. Then apply maximum leverage to the primary valve." He remembered doing this a hundred times. He remembered the *feel* of the metal giving under sustained pressure, the subtle shift in vibration through the wrench just *before* it moved. But that feeling was gone, buried under years of desk work. His body remembered only the cold and the immense weight pressing in.

  Lyra located the stabilizer bolt. She adjusted her grip, planted her feet firmly, and strained. Kael saw the slight tremor in her arms transmitted through the suit lights. Suddenly, her boot slipped on the algae-slicked frame. She tumbled backwards, wrench spinning away into the abyss. The display on her forearm flickered and died – saltwater breach.

  "Lyra! Status!" Kael’s voice sharpened.

  "Wrench gone! Display’s fried! I... I don’t remember subsection D!" Panic edged her words. The lattice groaned louder, a metallic shriek. Lights flickered erratically along its length. Without the valve fully retracted, pressure was building catastrophically in the junction.

  Kael’s mind raced, flipping through flawless mental schematics. He *knew* the exact sequence. *Knowing that* was useless without the wrench, without the display. He needed *knowing how* – the instinctive sense of leverage, the read of the metal’s fatigue through touch, the subtle dance with the unpredictable cross-currents nudging them. He felt nothing but clumsy dread.

  "Listen to me," he commanded, forcing calm. "Forget the subsections. The valve wheel… it needs persuasion. Not brute force. It’s… it’s like cracking a safe you know the combination to but haven’t touched in years." He grasped desperately for the ghost of muscle memory. "Find purchase. Not just your feet, *feel* the strongest point against the current. Use your whole body, lean *into* it… but not too hard. It’s brittle."

  He watched Lyra scramble, finding a new foothold. She braced, not just pushing, but *settling* into the structure. Kael saw her adjust minutely, compensating for the unseen push of water.

  "Now," he said, "it’s not about turning it *yet*. It’s about *feeling* the resistance give. Apply steady pressure… wait for the *give*. It’ll be tiny. Like… like the first crack in ice." He was describing a sensation he could no longer recall, translating pure theory into the language of a body he no longer trusted.

  Lyra leaned. Seconds stretched. The lattice screamed. Then, a small, sharp *ping* echoed through their comms. "It moved!" Lyra gasped.

  "Ease off! Quickly! Then steady pressure again, *with* the release!" Kael barked instructions born of pure intellectual deduction, a desperate mimicry of lost intuition. "Don’t force it open, *guide* it!"

  Lyra worked, her movements becoming less mechanical, more fluid. She seemed to be listening to the metal, reacting to its groans and shudders. Kael guided, his words a lifeline of propositional knowledge – angles, estimated pressure points, potential failure modes – while Lyra’s body, fresh and attuned, translated them into action. She found the rhythm, the subtle interplay of force and fragility Kael could only describe, not embody. With a final, resonant *clunk*, the valve slammed fully open. The groaning ceased instantly, replaced by the steady hum of normalized flow.

  They floated in the sudden quiet, illuminated only by their suit lights. Kael looked at his own gloved hands, steady now but useless in the crisis. He had possessed all the facts, the perfect map. Lyra, armed only with fragments of that map and her nascent bodily intelligence, had navigated the territory.

  *The clearest map is useless if your legs have forgotten how to walk the terrain.*
