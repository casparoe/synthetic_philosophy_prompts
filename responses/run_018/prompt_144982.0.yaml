  hey, im a phil phd (agency/action theory) and my advisor and i have been fighting about this thing i call frictional autonomy — basically whether free will needs actual resistance/friction in how your preferences form, not just internal coherence. the context is algorithmic value-nudging: imagine your preferences shift over months via recommendation systems that never ask permission, then you later discover it and fully endorse the new values with total transparancy. im an integrationist compatibilist: if the retrospective endorsement is genuine and structurally integrated, the broken genealogy doesn't matter, sourcehood gets repaired. she's a genealogical incompatibilist: if the causal chain of your will-formation was externally engineered outside your awareness, no later mental act can restore the original authorship, so you're not free in the deep sense.

  we're writing an adversarial collaboration doc and need an outsider to draft the joint statement. please don't give me a bibliography or citation list — i just need the conceptual structure. also avoid fake quotes.

