  Wait, but Good's theorem operates at the ex-ante stage, valuing information before learning outcomes. The agent anticipates that learning might force them into a situation where their best action has lower utility due to the norm. So avoiding information prevents activating that disutility. That seems like a genuine case where ignorance is better. But does this contradict the theorem?

  The theorem assumes stable preferences over outcomes. If the utility function changes based on knowledge, preferences aren't stable. Good's theorem explicitly requires preference stability. So this case falls outside the theorem's scope—it's an exception proving the rule. The user's scenario isn't a counterexample but a boundary condition where the assumptions don't hold. 

  I should concede this is a valid limitation but emphasize it's not a flaw in the theorem—just a case where its assumptions (preference stability) are violated. The user's twist exposes how tightly the theorem depends on this. They're right that in such normative shifts, information can harm, but this doesn't undermine Good's general proof when preferences are stable.

