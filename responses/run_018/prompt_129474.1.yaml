answer: |-
  Your challenge is clever but irrelevant to Good's theorem, which assumes a *stable utility function over outcomes*. The agent you describe violates this core axiom: her preferences mutate endogenously based on epistemic states, not just beliefs about states of the world. Good's proof holds that, with fixed preferences, one can always *choose* the original ignorant action—even if it’s now suboptimal—to secure at least the pre-info utility. Here, the act itself is penalized *solely by the knowledge state*, breaking preference stability. This isn't a counterexample; it's an excluded case where the theorem's premises are violated. The moment utility depends directly on the partition—not just beliefs updated within it—you’ve left Good’s domain. Rational agents with metastasizing preferences can indeed be harmed by information, but that’s a pathology of your constructed agent, not a refutation of the theorem.
