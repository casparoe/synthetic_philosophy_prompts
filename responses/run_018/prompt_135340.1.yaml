answer: |-
  Here are five exact desiderata for a graded-binding theory of consciousness distribution:

  1.  **Avoid Reflex Attribution:** Must exclude non-conscious integrative processing (e.g., reflex coordination in decapitated octopus arms) from constituting phenomenal access, despite local neural integration. *Motivating Case:* Reflex behavior vs. goal-directed hunting. *Non-negotiable*. *Tension:* Potentially with Desideratum 5 if ganglia integration is sufficient.

  2.  **Resolve Scaling & Moral Weight:** Must provide a principled (non-arbitrary) mapping from "binding density gradients" to degrees of moral weight, avoiding simple fractional calculations when consciousness is partial. *Motivating Case:* The scaling problem for welfare. *Camp-specific (non-reductive gradualism)*. *Inject:* Dimmer-switch framing for intensity/scope.

  3.  **Reconcile Metabolic Cost & Phylogeny:** Must explain why high binding density (and its metabolic cost) evolved only in specific lineages, without implying that phylogenetically earlier or simpler integrators (e.g., fish vs. mammals) lack *any* relevant phenomenal binding. *Motivating Case:* Metabolic cost arguments vs. phylogenetic continuity demands. *Non-negotiable*. *Confidence:* Least sure here due to evolutionary inference gaps.

  4.  **Define Density Thresholds:** Must specify functional/computational signatures (beyond raw integration metrics like Φ) that mark transitions along the binding-density gradient towards reportable or functionally impactful phenomenal access. *Motivating Case:* Distinguishing insect navigation from mammalian awareness. *Non-negotiable*. *Inject:* Binding-density gradients across neuroanatomical hierarchies.

  5.  **Address Modularity Objection:** Must clarify whether localized, high-integration ganglia (e.g., in arthropods or complex molluscs) can support isolated "islands" of phenomenality, independent of a central global workspace. *Motivating Case:* The modularity objection (e.g., distributed ganglia consciousness). *Camp-specific (local binding proponents)*. *Tension:* Potentially with Desideratum 1 on reflex exclusion. *Overall Confidence:* Moderate (strongest on 1 & 4, weakest on 3).
