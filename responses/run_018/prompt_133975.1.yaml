answer: |-
  ## Sestina of the Turning Wheel

  A new idea bursts like a fragile **spring**,
  Yet watch the strong foundation **decline**,
  As founders trace their bold, unbroken **line**
  And swear their ordered state will not **return**
  To chaos. This, they cry, is true **empire**,
  Defying fate, immune to final **ruin**.

  But cracks appear within the polished **ruin**
  Of marble halls where promise seemed a **spring**.
  The subtle rot infects the heart of **empire**;
  Each edict marks a slow, internal **decline**.
  The watchful tyrant waits for power's **return**,
  His shadow stretching past the fading **line**.

  Ambition draws a fresh, aggressive **line**,
  A desert tribe ignores the ancient **ruin**.
  Their fierce cohesion sparks a swift **return**
  To conquest, sharp as frost in early **spring**.
  They sense no trace of that old, soft **decline**;
  Their blood demands a raw, unyielding **empire**.

  This nascent, brutal, bright, demanding **empire**
  Believes its path is straight, a destined **line**
  Upward, scorning whispers of **decline**.
  They build on dust beside a crumbled **ruin**,
  Their sweat like rain renews a barren **spring**,
  Blind to the wheel that mandates their **return**.

  For history whispers secrets of **return**:
  No iron law sustains a dying **empire**.
  Each season's bloom, a different kind of **spring**,
  Believes it breaks the weary, cyclic **line**,
  That crumbling arch, that weathered block of **ruin**
  Proclaims a lesson lost in their **decline**.

  Observe the mechanisms of their **decline**:
  Pride turns to fear, justice won't **return**.
  The mortar flakes; mere stone foretells the **ruin**.
  The vital force that forged the vast **empire**
  Grows thin and frayed, dissolving the straight **line**,
  While weeds push through the cracks of their false **spring**.

  **(Envoi)**
  O fractured **spring** within the long **decline**,
  Your **return** curves the seeming straight **line**:
  Each **empire** blooms from conquered **ruin**.

  ---

  **Form as Argument:**

  1.  **Cyclical View (Stanza Rotation):** The fixed, mathematically determined rotation of the end-words (spring -> ruin -> line -> return -> empire -> decline -> spring...) embodies the repetitive cycle of Polybius's *anacyclosis* (monarchy -> tyranny -> aristocracy -> oligarchy -> democracy -> ochlocracy -> monarchy...) and the core idea of inevitable rise and fall. Ibn Khaldun's *asabiyyah* appears in the "fierce cohesion" of the desert tribe (St. 3), its inevitable fraying implied in "grows thin and frayed" (St. 6). Spenglerian/Toynbeean life-cycles are enacted in the imagery of organic growth ("blooms," "bursts," "rot"), decay ("cracks," "decline," "ruin"), and the illusion of uniqueness ("Believes it breaks the weary, cyclic line" - St. 4).
  2.  **Linear View (Inevitable Progression):** The poem's structure, moving irreversibly through six distinct stanzas towards the final envoi, enacts the linear-progressive view. Each stanza represents a discrete stage in time. The progression *through* the cycle is linear; you cannot go back to stanza one once you move forward. This mirrors the linear perception of historical actors ("Their path is straight, a destined line" - St. 3).
  3.  **The Spiral (Envoi):** The envoi compresses all six end-words, forcing them together. It doesn't declare victory for either view but suggests a synthesis: the *return* is not to the exact same point ("fractured spring"), the *line* is not straight but curved, and the new *empire* explicitly arises *from* the *ruin*, acknowledging the cycle while suggesting a potential shift in position or nature (the spiral's movement along a third axis). The "seeming straight line" acknowledges the linear perception *within* the cyclical pattern.
  4.  **Embedded Theories (Not Named, Acted):**
      *   *Regimes degenerating:* "The watchful tyrant waits for power's return" (St. 2 - democracy decaying into ochlocracy/mob rule inviting tyranny).
      *   *Solidarity fraying:* "The vital force... Grows thin and frayed" (St. 6 - Ibn Khaldun's *asabiyyah* weakening).
      *   *Illusion of novelty:* "Believes it breaks the weary, cyclic line" (St. 4), "Each empire blooms from conquered ruin" (Envoi - new empires see themselves as unprecedented, but the poem shows they rise from the literal and metaphorical ruins of predecessors).
      *   *Constitutional rotation:* The entire sequence of stanzas enacting rise, decay (internal decline), overthrow (return of a new force), and the new rise (empire) embody Polybius's cycle.
