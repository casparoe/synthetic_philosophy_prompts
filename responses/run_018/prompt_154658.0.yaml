  The user might also be conflating levels. Popper focuses on individual theories, while Lakatos looks at research programs over time. So, the hard core's protection isn't evasion but a strategic approach within a program's evolution. The sociological aspect the classmate mentioned doesn't negate the rational basis; successful programs produce novel facts, which is empirically verifiable. 

  I should clarify how Lakatos's framework avoids Popper's ad hoc label. Progressive shifts add content and testability, whereas degenerating programs, like Marxism or astrology, only explain past data without new predictions. The user's example of dark energy parameters needs evaluation on whether they predict new phenomena or just resolve inconsistencies. 

