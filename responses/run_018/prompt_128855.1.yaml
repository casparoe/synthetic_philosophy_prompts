answer: |-
  Here's a decision procedure grounded in Aristotelian principles, designed for practical application by a municipal ethics board evaluating local exchange systems. I'll outline the procedure, then apply it to your two cases, including the "technically approved but wrong" scenario and Aristotle's breakdown point.

  **Core Aristotelian Principles Operationalized:**
  1.  **Oikonomia (Household Management):** Legitimate. Focuses on acquiring/allocating resources for concrete household/community *needs* (use-value). Money is a *tool* for facilitating this real exchange.
  2.  **Chrematistike (Wealth Acquisition):** Illegitimate/"Unnatural". Focuses on the *infinite accumulation* of abstract exchange value (money) as an end in itself. "Money breeding money" (interest, pure speculation) is its clearest manifestation.
  3.  **Money is Barren:** Money has no productive capacity of its own; its value derives solely from facilitating the exchange of real goods/services for real needs. Using money to generate more money detaches it from this foundation.
  4.  **Anti-Hoarding:** Accumulation beyond foreseeable, concrete needs for oikonomia is suspect. Wealth is for *use*, not possession for its own sake.

  **Municipal Ethics Board Decision Procedure:**

  **Phase 1: Purpose & Telos (The "Why?")**
  1.  **Question:** What is the stated *primary purpose* of the proposed system? (e.g., increase access to essential services, build social cohesion, support local businesses, encourage sustainability, provide an alternative during economic hardship)?
  2.  **Sufficient Answer:** Must clearly articulate a goal related to meeting concrete *needs* (material or social) within the defined community, enhancing resilience, or fostering direct reciprocity. Vague "economic development" or "wealth creation" goals are insufficient.
  3.  **Reject If:** The primary purpose is explicitly or implicitly the generation of abstract financial profit, speculation, or wealth accumulation as an end in itself. *Stop here.*
  4.  **Handoff Point:** If the stated purpose is legitimate (oikonomia-oriented), proceed. If the stated purpose is vague but not overtly chrematistic, the board may proceed but with heightened scrutiny in later phases. Requires value judgment on the *plausibility* of the stated need-focus.

  **Phase 2: Mechanism Design (The "How?" - Preventing Chrematistike)**
  5.  **Question:** Does the system's design actively *prevent* the *accumulation* of units (time credits, digital tokens, LETS units) beyond what is reasonably necessary for foreseeable participation in meeting needs?
  6.  **Sufficient Answer:** Mechanisms like: Hard caps on holdings, mandatory expiration dates ("demurrage"), non-convertibility to state currency, restrictions on saving for speculative purposes, emphasis on immediate or near-term reciprocity. Evidence that accumulation isn't incentivized or rewarded.
  7.  **Reject If:** The system explicitly allows or incentivizes indefinite hoarding of units *without* a clear link to future concrete needs within the system (e.g., unlimited savings with no demurrage or use requirement). *Stop here.*
  8.  **Question:** Does the system allow units to generate more units *without* the direct exchange of real goods/services? (i.e., Does it allow "money to breed money"?)
  9.  **Sufficient Answer:** A clear "No". No interest paid on holdings, no lending of units expecting repayment of *more* units, no dividends based solely on ownership/possession of units.
  10. **Reject If:** The system includes interest, dividends, or any mechanism where units increase solely through possession or time, detached from the exchange of real value. *Stop here.*
  11. **Handoff Point:** If the system includes *optional* savings features without interest but with potential for moderate accumulation, the board must judge whether the accumulation risk is mitigated enough (e.g., strong demurrage, low caps) and outweighed by potential oikonomia benefits (e.g., allowing someone to save for a major needed repair). Requires value judgment on *degree of risk* and *proportional benefit*.

  **Phase 3: Containment & Focus (The "For Whom/What?")**
  12. **Question:** Is the system primarily designed to facilitate exchanges focused on meeting *local*, *concrete* needs and building *direct* social reciprocity within a defined community?
  13. **Sufficient Answer:** Geographically bounded (e.g., neighborhood, town), promotes face-to-face or known-community interactions, emphasizes services/goods relevant to daily community life (care, repair, food, skills sharing).
  14. **Reject If:** Designed for large-scale regional/national use, facilitates anonymous transactions dominant over community connections, or focuses heavily on abstract/bulk commodities disconnected from local needs. *Stop here.*
  15. **Handoff Point:** If the system uses digital mediation but attempts to foster local connections (e.g., neighborhood app with profiles), the board must judge the *likelihood* of it fostering genuine reciprocity vs. anonymous transactions. Requires value judgment on *community-building efficacy*.

  **Procedure Output:**
  *   **Approve:** Passes all "Reject If" points and provides sufficient answers demonstrating alignment with oikonomia principles and strong barriers against chrematistike.
  *   **Approve with Conditions:** Passes "Reject If" points but has minor risks identified in "Handoff Points." Approval contingent on implementing specific safeguards (e.g., stricter caps, mandatory reporting on accumulation levels).
  *   **Reject:** Fails any "Reject If" point.
  *   **Requires Further Deliberation:** Significant reliance on "Handoff Point" judgments without clear consensus.

  ---

  **Application to Cases:**

  **Case 1: Neighborhood Time-Bank (Non-convertible hours, expire after 1 year)**
  1.  **Purpose:** Likely stated as mutual aid, sharing skills, building community resilience, meeting unmet local needs (e.g., elder care, repairs). *Sufficient. Pass.*
  2.  **Accumulation Prevention:** Non-convertibility removes external speculative motive. Mandatory expiration (1 year) strongly discourages hoarding; units *must* be used or lost. *Strongly prevents accumulation. Sufficient. Pass.*
  3.  **Money Breeding Money:** No interest mechanism possible. Units are earned purely by providing service and spent to receive service. *Clear "No". Pass.*
  4.  **Containment & Focus:** Neighborhood scale, designed for direct reciprocity between residents for concrete local needs (labor hours). *Sufficient. Pass.*
      *   **Verdict: APPROVE.** Strong alignment with oikonomia, robust barriers against chrematistike.

  **Case 2: Digital Local Currency with Interest-Bearing Savings Accounts**
  1.  **Purpose:** Might be stated as encouraging local spending, supporting businesses, building community wealth. *Potentially acceptable, but "community wealth" is ambiguous. Proceed with caution.*
  2.  **Accumulation Prevention:** Allows savings accounts. While potentially capped, the *ability* to save indefinitely (if no expiration) exists. Interest exacerbates this. *Insufficient. Fails Reject Point under Q8/Q9.*
  3.  **Money Breeding Money:** EXPLICITLY allows interest. This is the archetypal "money breeding money" Aristotle condemned as barren/usurious chrematistike. *Fails Reject Point under Q8/Q9.*
      *   **Verdict: REJECT.** Explicit violation of the core prohibition on interest. Stop at Phase 2, Q8/Q9.

  **Case 3: The "Technically Approved But Feels Wrong" Example: Hyper-Local Digital Token for Essential Goods (No Interest, Hard Cap, But...)**

  *   **Proposal:** A digital token usable *only* at participating local grocery stores and farmers' markets for basic food staples (no alcohol, processed junk). No interest. Hard cap per household (prevents massive accumulation). Purpose: Ensure food security for low-income residents.
  *   **Procedure Walkthrough:**
      1.  **Purpose:** Concrete need (food security). *Sufficient. Pass.*
      2.  **Accumulation Prevention:** Hard cap prevents large hoarding. *Sufficient. Pass.*
      3.  **Money Breeding Money:** No interest. *Pass.*
      4.  **Containment & Focus:** Geographically local, focused on concrete essential goods. *Sufficient. Pass.*
  *   **Verdict (by procedure): TECHNICALLY APPROVE.** It passes all the Aristotelian checkpoints: focused on need (oikonomia), prevents significant accumulation, no interest, contained.
  *   **Why it Feels Wrong:** The board might feel uneasy because:
      *   **Loss of Reciprocity:** It functions more like a restricted voucher/subsidy than a reciprocal exchange system. Users receive tokens (potentially via subsidy) and spend them; there's no expectation or mechanism for them to "earn" tokens back *within the system* by contributing. Aristotle's framework assumes reciprocal exchange within a community (oikos/polis), not one-way provision.
      *   **Mediation & Abstraction:** While focused on food, the digital token still abstracts value. The direct, personal reciprocity inherent in Aristotle's view of community exchange is missing. It feels transactional and bureaucratic, not relational.
      *   **Where Aristotle Breaks Down:** **Aristotle has no conceptual framework for state-mediated social welfare or non-reciprocal redistribution within a community.** His model is based on household management and reciprocal exchange between citizens within the polis. Modern concepts of social safety nets, state subsidies, or targeted assistance for the poor (who may be unable to reciprocate within the system) fall outside his paradigm. The procedure technically approves because it prevents chrematistike and focuses on need, but Aristotle provides no guidance on whether non-reciprocal provision *within a formal exchange system* aligns with his vision of community (koinonia). This requires a *value judgment* (Handoff Point) about the nature of community obligation and support that transcends Aristotle's reciprocal-exchange model. The board must decide: Is ensuring basic food security through a non-reciprocal (but contained, non-exploitative) mechanism ethically acceptable *even if* it doesn't fit Aristotle's ideal of reciprocal oikonomia? This is where his framework runs out in the modern context.
