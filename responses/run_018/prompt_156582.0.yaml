  We are creating a decision procedure for reviewing self-amending provisions. The procedure will be an ordered checklist with explicit stop conditions. The key distinction is between procedural self-reference (rules about how the amendment occurs) and substantive self-reference (rules that directly alter their own normative content). We are particularly concerned with the "delegated repeal paradox" which occurs when a provision grants an authority the power to destroy the very grant that empowers it.

  The procedure will have the following steps:

  1. **Identify the type of self-reference**: 
     - Question: Does the provision contain only procedural self-reference (i.e., rules about the process of amendment that apply to itself) or does it also contain substantive self-reference (i.e., rules that directly change the normative content of the provision itself)?
     - Sufficient answer: 
       - If the provision only sets out the procedure for its own amendment (e.g., the threshold for amendment, the body that can amend it, the process to follow) and does not allow for direct substantive alteration of its own content through that procedure, then it is procedural.
       - If the provision allows for the substantive content of the provision to be changed (including the amendment rules themselves) by the procedure it sets out, then it is substantive.
     - Stop condition: 
       - If only procedural, proceed to step 2. 
       - If substantive, proceed to step 3.

  2. **Procedural self-reference only: Check for internal consistency**:
     - Question: Is the procedural rule for self-amendment internally consistent? Specifically, does the rule for amendment of the provision require the use of the very same rule? (This is the typical self-reference of amendment clauses and is generally acceptable unless it leads to a logical loop that prevents any amendment.)
     - Sufficient answer: 
       - If the rule is clear and does not create a logical paradox (e.g., it sets a fixed threshold for amendment, such as a supermajority, and does not require an impossible condition), then it is consistent.
     - Stop condition:
       - If consistent, then the provision is acceptable on this ground (but note: we are only at step 2 and we haven't considered the delegation paradox). However, we must still check for the delegation paradox in step 4.
       - If inconsistent (e.g., it requires an amendment to be passed by a majority that can only be achieved after the amendment is passed), then hard reject.

  3. **Substantive self-reference: Check for direct self-destruction**:
     - Question: Does the provision allow for the substantive content of the provision to be amended in such a way that the entire provision (including the amendment rule) can be removed or rendered inoperative by the authority it creates?
     - Sufficient answer:
       - If the provision explicitly or implicitly allows for the repeal of the entire provision (including the rule that grants the amendment power) by the same procedure it establishes, then it creates a potential for the delegated repeal paradox.
     - Stop condition:
       - If yes (it allows self-destruction), then proceed to step 5 for a value judgment.
       - If no (it does not allow self-destruction, e.g., it only allows amendments that do not remove the core delegation or the amendment rule itself), then it is acceptable on this ground (but still check step 4).

  4. **Check for delegated repeal paradox (applies to both procedural and substantive)**:
     - Question: Does the provision delegate to a created authority the power to repeal (or destroy) the very provision that creates that authority and grants it the power?
     - Sufficient answer:
       - If the provision grants an authority (e.g., a legislature, an agency) the power to amend the provision in a way that would repeal the entire provision (including the delegation of power) and thereby destroy the authority's own legal foundation, then it creates a delegated repeal paradox.
     - Stop condition:
       - If yes, then hard reject because it creates a logical paradox (the authority's act of repeal would simultaneously destroy the legal basis for that act, making the repeal invalid and leaving the provision in force, but then the repeal would be valid, and so on).
       - If no, then the provision is acceptable on this ground.

  5. **Value judgment for substantive self-amendment that allows self-destruction** (if step 3 leads here):
     - Question: Even if the provision allows for self-destruction (but without the delegation paradox because the authority is not delegating to an inferior body but perhaps to a superior one or to the same body in a different capacity), does the provision serve a compelling state interest that justifies the risk of instability?
     - Sufficient answer: This step is not a conceptual determination but a value judgment. There is no sufficient answer that the procedure can provide. The team must hand the decision to a higher authority or a policy-making body, with a clear explanation of the risks.
     - Stop condition: The procedure stops here and requires human judgment. It does not issue a rejection but flags the issue.

  Now, we apply the procedure to the three proposals:

  **Proposal 1: A constitutional clause that sets its own amendment threshold by referring directly back to itself.**
  - Step 1: This is procedural self-reference because it only sets the procedure (the threshold) for amending itself. It does not allow substantive changes to the clause by that procedure (it only sets the threshold, not the content of amendments). So we go to step 2.
  - Step 2: We check for internal consistency. The clause says, for example, "This clause may be amended by a two-thirds majority of the legislature." This is consistent because it sets a clear, achievable threshold. So we mark it as acceptable on consistency and move to step 4.
  - Step 4: Check for delegated repeal paradox. The clause does not delegate to an authority the power to repeal the entire clause. It only sets the threshold for amendment. The amendment power is held by the legislature, which is a primary constitutional authority, not a delegated one. Therefore, no delegated repeal paradox. The provision is acceptable.

  **Proposal 2: A statutory rule that authorizes a regulatory agency to suspend the rule’s own enforcement provisions.**
  - Step 1: This is substantive self-reference because it allows the agency to change the enforcement provisions (a substantive part) of the rule. So we go to step 3.
  - Step 3: Does it allow self-destruction? Suspending enforcement provisions does not necessarily destroy the entire rule. It only suspends enforcement. The rule and the delegation to the agency remain. Therefore, it does not allow self-destruction. So we mark it as acceptable on this ground and go to step 4.
  - Step 4: Check for delegated repeal paradox. The agency is created by statute and delegated the power to suspend enforcement. This suspension does not repeal the entire rule, so the agency is not destroying the source of its own authority. Therefore, no delegated repeal paradox. The provision is acceptable.

  **Proposal 3: A clause that delegates to a future legislature the authority to abolish the delegation mechanism itself.**
  - Step 1: This is substantive self-reference because it allows the future legislature to change the clause by abolishing the delegation mechanism. So we go to step 3.
  - Step 3: Does it allow self-destruction? Yes, because abolishing the delegation mechanism would remove the clause that delegates the power. So we go to step 4 (but note: step 3 leads to step 5 only if self-destruction is present without a delegation paradox? Actually, step 4 is independent and we must do it).
