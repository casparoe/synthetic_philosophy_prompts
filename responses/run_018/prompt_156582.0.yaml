  However, note: the future legislature is the same body that enacted the clause. In many legal systems, a legislature can repeal any statute it created, and that is not considered a delegated power but an inherent power. Therefore, the delegation here might be seen as redundant. This is a contested point.

  But the procedure, as designed, would see that the clause is delegating the power to abolish the delegation mechanism. The delegation mechanism is the source of the power to abolish. Without the clause, the legislature would still have the power to repeal statutes? Not necessarily if the clause is part of a constitution and the legislature is acting under the constitution. This is complex.

  The procedure, however, is based on the conceptual distinction and the delegated repeal paradox. It would flag step 4: the authority (the future legislature) is granted the power by the clause to destroy the clause. This creates a paradox because the destruction would remove the authority for the destruction. Therefore, we hard reject.

  But note: the office will dislike this because in many systems, legislatures can repeal laws and even constitutional clauses if they follow the amendment procedure. However, in this case, if the clause is part of the constitution and the delegation is to the legislature to amend the constitution by simple majority (which is not typical), then it would be problematic. But if the clause is a statute, then the legislature has inherent power to repeal it. So the context matters.

  The procedure does not distinguish between constitutional and statutory provisions? We must note that.

  But in the procedure, we are only concerned with the logical structure. The procedure would hard reject because of the delegation paradox. However, this is where the procedure might be too rigid.

  Therefore, we note that for proposal 3, the procedure returns a hard rejection, which the office may dislike because they might believe that a legislature has inherent authority to repeal its own acts.

  Now, we state what the procedure cannot determine:

  - The procedure cannot determine whether a provision is democratically legitimate. It only checks for logical coherence and the specific paradoxes.
  - The procedure cannot resolve value judgments about the desirability of self-amendment even when it is logically coherent. For example, step 5 requires a value judgment.
  - The procedure does not account for the hierarchical nature of legal systems (e.g., constitutional vs. statutory provisions). The same logical structure might be acceptable in a statute (because the legislature is sovereign) but not in a constitution.
  - The procedure is based on a specific interpretation of the delegated repeal paradox. Some scholars argue that the paradox is not a problem because the act of repeal is valid at the moment it is made (the "momentary validity" theory). This is a contested point.

  Specifically, the step 4 hard rejection for the delegated repeal paradox is based on the view that the act of repeal is self-undermining. However, there is a genuine scholarly controversy:

  - Some scholars (like Hans Kelsen) argue that the act is valid at the moment of enactment, so even if the source of authority is later removed, the act remains valid.
  - Others (like H.L.A. Hart) might be more concerned with the rule of recognition and the continuity of legal systems.

  Therefore, the step 4 hard rejection is based on a particular (and contested) logical analysis. We must flag that the step 4 stop condition (hard rejection) is not a consensus view and is genuinely contested.

  In summary, the procedure can be applied as follows:

  **Bottom line**: The decision procedure is an ordered checklist that distinguishes procedural and substantive self-reference, checks for internal consistency and the delegated repeal paradox, and flags cases requiring value judgment. It hard rejects provisions that create a delegated repeal paradox and internally inconsistent procedures, but it cannot resolve value judgments or account for all contextual factors, and it relies on a contested interpretation of the repeal paradox.

  **The procedure**:

  1. **Identify the type of self-reference**:
     - Question: Does the provision contain substantive self-reference (allowing direct alteration of its own normative content) or only procedural self-reference (rules for amendment)?
     - If only procedural → step 2.
     - If substantive → step 3.

  2. **Procedural self-reference: Check internal consistency**:
     - Question: Is the amendment procedure for this provision internally consistent (i.e., doesn't require an impossible condition)?
     - If inconsistent → Hard reject.
     - If consistent → step 4.

  3. **Substantive self-reference: Check for self-destruction**:
     - Question: Can the provision be amended to repeal itself entirely (including the delegation of power)?
     - If no → step 4.
     - If yes → step 5.

  4. **Check for delegated repeal paradox**:
     - Question: Does the provision delegate to an authority the power to repeal the entire provision (the very provision that creates the authority and grants the power)?
     - If yes → Hard reject (due to delegated repeal paradox).
     - If no → Provision is conceptually acceptable.

  5. **Value judgment**:
     - Question: Even if self-destruction is allowed without a delegation paradox, does the provision serve a compelling state interest?
     - This step requires hand-off to human judgment. The procedure remains silent on the outcome.

  **What the procedure cannot determine**:
  - Democratic legitimacy: The procedure does not assess whether a self-amendment provision is democratically sound.
  - Contextual factors: The procedure does not consider whether the provision is constitutional or statutory, or the broader legal context (e.g., inherent powers of a legislature).
  - Value trade-offs: The procedure cannot weigh the benefits of flexibility against the risks of instability.

  **Contested interpretations**:
  - The delegated repeal paradox (step 4) is contested. Some scholars argue that an act of repeal under a delegated power is valid if at the moment of enactment the authority existed (the "momentary validity" theory). Therefore, the hard rejection in step 4 is based on a particular view and is not universally accepted.
