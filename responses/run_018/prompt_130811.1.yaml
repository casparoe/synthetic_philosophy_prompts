answer: |-
  ## Research Proposal: The Compression Criterion in Macro-Historical Explanation

  **1. Research Question:**
  Is the implicit "compression criterion" – the shared assumption that defensible macro-historical explanation necessitates reducing vast complexity to a small set of structural drivers, valuing this reduction independently of predictive utility – a fundamental but unexamined locus of disagreement in critiques of grand narratives? Can this criterion be successfully disentangled from predictive aims and rigorously assessed, revealing whether standard historiographical objections target the criterion itself or merely its specific application?

  **2. Rationale & Gap in Existing Scholarship:**
  Critiques of influential macro-historical works (e.g., Harari, Diamond, Graeber & Wengrow) overwhelmingly focus on empirical inaccuracies, charges of determinism, or the neglect of local agency and contingency. Philosophical analyses of historical explanation tend to engage with covering laws, causal mechanisms, or narrative coherence, often at smaller scales. **A significant gap exists at their intersection:** neither the critiques nor the core philosophical frameworks systematically address the underlying *structural expectation* governing explanation at civilisational scales. This project posits that the "compression criterion" is this shared, implicit expectation. Both proponents and critics of grand narratives appear to accept that explanation *requires* this radical simplification, then dispute *how well* or *how legitimately* a particular work achieves it. The current debates leave the core criterion itself unexamined and its validity untested. This project argues that the question is genuinely open: *Can* such compression be philosophically justified on explanatory grounds *distinct* from prediction, and do the common critiques actually challenge this foundational demand or only its execution in specific cases?

  **3. Methodology:**
  The project employs conceptual analysis and counterfactual reasoning, avoiding original empirical research. The method proceeds in three stages:

  1.  **Reconstruction of Implicit Compression Rules:** Select one representative macro-explanatory argument from each core text (Harari, Diamond, Graeber & Wengrow). Analyse these arguments to reconstruct the specific "compression rules" implicitly employed – identifying *what* complexities are reduced, *which* structural drivers are foregrounded, and *how* the reduction is justified within the argument.
  2.  **Counterfactual Perturbation Testing:** Subject each reconstructed compression rule to two carefully designed counterfactual scenarios:
      *   **Mesoscale Perturbation:** Introduce a plausible, significant counterfactual event or trend *within* the scale and timeframe addressed by the original argument (e.g., "What if technology X developed in Region Y 200 years earlier?"). Assess whether the original compressed explanation can coherently integrate this change without fundamental revision or retreat into ad hoc adjustments.
      *   **Macroscale/Methodological Perturbation:** Introduce a counterfactual concerning the *type* or *scope* of evidence deemed relevant (e.g., "What if we prioritised evidence of individual/local resistance over institutional structures?" or "What if we demanded the explanation also account for phenomenon Z, previously deemed peripheral?"). Assess the impact on the stability and defensibility of the compression rule itself.
  3.  **Comparative Analysis:** Synthesise findings across the three cases. Analyse patterns: Which compression types withstand perturbation? Which collapse or require significant modification? What distinguishes robust compression from fragile or overreaching compression? Crucially, determine whether failures stem from flaws in the *application* of compression or reveal inherent problems with the criterion *per se*.

  **4. Expected Outcomes & Measures of Success/Failure:**
  *   **Successful Result:** A clear conceptual framework distinguishing between *defensible* and *indefensible* forms of explanatory compression in macro-history. This would likely manifest as a **taxonomy of compression types**, categorised by their resilience under counterfactual testing and their ability to provide non-predictive explanatory value (e.g., coherence, unification, highlighting deep structures). Success would demonstrate that some critiques implicitly target specific, flawed *applications* of compression, while others reveal deeper flaws in the underlying *criterion* or its necessary implementation at civilisational scales.
  *   **Failure Conditions:**
      *   **Primary Risk (Formalisation Failure):** The "compression criterion" proves too nebulous or heterogeneous to reconstruct consistently or formalise clearly enough for meaningful testing across different arguments. Without this, the core question becomes untestable.
      *   **Inconclusive Results:** Counterfactual perturbations fail to yield clear patterns distinguishing robust from fragile compression, or the analysis cannot convincingly separate objections to application from objections to the criterion itself.
      *   **Criterion Collapse:** The investigation concludes that the compression criterion is inherently flawed and inseparable from problematic determinism or empirical overreach, rendering *any* macro-explanation of the type studied fundamentally suspect on structural grounds.

  **5. Scope, Feasibility & Key Risk:**
  *   **Scope:** This six-month project is feasible as it focuses exclusively on conceptual analysis of published arguments within three key texts and the critical literature surrounding them. It requires no original archival research, linguistic translation, or empirical data collection. The work involves close reading, logical reconstruction, and philosophical argumentation.
  *   **Single Biggest Danger (Overambition within Timeline):** The **most significant risk** is the **formalisation challenge**. Rigorously defining the "compression criterion" sufficiently to reconstruct specific rules *and* design meaningful counterfactual tests against them is highly demanding conceptual work. Capturing the nuances of different authors' implicit approaches without oversimplification, while developing a generalisable analytical framework, is ambitious. If this foundational task proves more intractable than anticipated – requiring extensive iterations or grappling with profound conceptual ambiguities – it could consume disproportionate time, jeopardising the subsequent testing and synthesis phases within the six-month window. Success hinges on achieving sufficient conceptual clarity early on.
