prompt: |-
  I run grant decisions at a small foundation that funds early-stage, high-risk science: about eight proposals a month, a rotating panel of four or five reviewers who are smart but usually only adjacent to the subfield in question, one ninety-minute meeting, and then a public one-paragraph rationale for every decision that goes up on our site. The board ratifies the list each quarter and has to be able to defend it to their friends. Here's what's been eating me: our decisions are public, other funders and the whole field read them, and I'm pretty sure that some of what looks like emerging consensus in the proposals crossing my desk is just people copying each other — reviewers who've all read the same three preprints, all citing the same one benchmark dataset, all saying some version of "well, the big lab is already doing this" — and I'm equally sure some of it is genuine information moving through the community and I'd be an idiot to ignore it. I can't tell which is which, and I have maybe fifteen minutes a case.

  So: build me a decision procedure the panel can actually run, grounded in whatever the sequential-herding literature really establishes — I mean the standard setup where people move in turn, see what earlier people did but not what they knew, and at some point it becomes individually rational to copy and stop contributing their own information at all, plus the reputational version where people copy because being wrong alone is worse than being wrong in a crowd, plus whatever is known about how fragile those states are and what does and doesn't break them. But operationalized: the questions in order, what counts as a sufficient answer to each, where the procedure just stops with a no, and where it hands the decision back to me because it's really a question about our risk appetite rather than about evidence. Assume I will almost never get a calibrated probability out of these people — say what to do when there's no number to be had. And be straight with me about which steps are real machinery and which are judgment calls wearing a lab coat.

  It has to handle at least these: (1) cascade inside the room, since our board member speaks first and the junior reviewers visibly defer; (2) agreement that looks independent but isn't, because everyone's signal came from the same two papers and the same benchmark; (3) the "if it were worth doing somebody would have done it by now" move, i.e. treating absence of uptake as evidence, when sometimes the absence is the cascade; (4) our own past write-ups feeding the thing we're trying to detect — I've been running a quarterly round where we re-review the most-rejected proposals with the prior verdicts and our old rationales redacted, which I call the reversal round, and I genuinely don't know whether it buys anything when the reviewers are the same people who can't un-know what they already said; (5) a rule I invented and will kill if you tell me to — if a panel comes out unanimous, I assign someone to write a minority report even when they agree. Does manufactured dissent carry information or is it just noise with a stamp on it?

  Then run it on three cases. First, a method that went from nobody to everyone in about eighteen months: three other funders have already funded variants, my panel is unanimous and enthusiastic, and not one of them can name a reason that isn't a restatement of "everyone's moving this way." Second, a replication-and-negative-results project in a subfield that is extremely confident about its result: nobody has funded it, and the one written review we have says the quiet part out loud about nobody having done it. Third, the one where I want you to tell me something I won't like: two years ago we rejected a proposal and published a fairly dismissive paragraph about it, and since then two other funders have passed on it citing our write-up; a revised version has now come back to us and the panel's private scores are actually decent. Say what the procedure says, including what we should write publicly this time — and if the honest output is that we should eat crow loudly because a loud reversal does more than a quiet one, or that we should fund something we think is mediocre because the point of the money is to buy a signal nobody else is going to generate, say that plainly.

  Finally, tell me what the procedure can't do: the failure modes, the cases where it will definately misfire, and which outputs I should refuse to trust.
reasoning: |-
  We are going to design a decision procedure for the foundation's panel reviews that explicitly addresses the problem of herding and informational cascades. The procedure will be grounded in the sequential herding literature, which shows that individuals, when acting in sequence and observing prior actions but not private signals, may ignore their own information and follow the herd, leading to cascades that may be incorrect. We also consider reputational herding where people prefer to be wrong with the crowd rather than alone.

  The procedure will break down the decision into steps, forcing panelists to contribute independent information and making cascades less likely. We'll address the specific issues (1-5) raised.

  Core elements from herding literature:
  - Cascades start when the public information (from prior actions) overwhelms private signals. This can happen even with small amounts of public information.
  - Fragility: Cascades can be broken by strong private signals, by introducing a small amount of contradictory public information, or by forcing individuals to state their private information before seeing others' actions.
  - Reputational herding: People may herd to avoid standing out. This can be mitigated by anonymous inputs or by valuing independent thinking.

  Proposed Decision Procedure:

  1. **Pre-meeting private input**: Before the meeting, each reviewer (including the board member) submits privately to the chair (you) the following:
     - A binary "signal": "Fund" or "Do not fund" based on their independent assessment (without seeing others' opinions). They are to base this on the proposal and their expertise, ignoring what others might think.
     - A brief (1-2 sentence) rationale for their signal, focusing on the most critical piece of evidence or reasoning they have that is not obviously derived from the same common sources (e.g., not just citing the same preprint or benchmark without a novel take).
     - A self-assessment of their expertise in the specific subfield (on a scale: high, medium, low). This helps weight signals later.

  2. **Chair's pre-processing**:
     - Identify common rationales: If multiple reviewers cite the same source without adding independent analysis, flag these as potential herding points.
     - For each reviewer, if their rationale is too similar to a common source and lacks independent reasoning, you may go back to them for more (if time permits) or note it as weak.

  3. **Meeting structure**:
     - **Order of speaking**: The chair will determine the order randomly for each proposal (to avoid the board member always going first and causing a cascade). The board member is not always first.
     - **Blind start**: The meeting begins without revealing the private inputs. The chair presents the proposal and any necessary context.
     - **Round 1: Independent reasoning**: Each panelist, in the random order, states:
          a. Their private signal (fund/not fund) without rationale.
          b. Then, they provide their rationale (without repeating common sources unless they have a novel critique or support). They must add at least one piece of information or reasoning that is not obviously from the common sources (if they can).
     - **Round 2: Deliberation**: Open discussion, but with rules:
          - Panelists can change their signals, but must explain why (e.g., new information from another panelist).
          - The chair will explicitly ask for dissent: "Does anyone see a strong reason to go against the current majority?" and "What piece of evidence, if it were wrong, would change your mind?"
          - The chair will also bring up any common sources and ask: "If [common benchmark] were found to be flawed, would that change the assessment? How?"
     - **Final vote**: Secret ballot (to reduce reputational pressure) on fund/not fund.

  4. **Handling unanimous cases**:
     - If the final vote is unanimous, the chair (you) will assign one panelist (rotating) to write a "devil's advocate" report. This report must:
          - Challenge the consensus by identifying one key assumption and how it could fail.
          - It is not a full minority report but a short (one paragraph) critique.
     - This manufactured dissent is for two purposes: 
          a. To test the robustness of the consensus (does it hold up against a focused challenge?).
          b. To provide a public rationale that includes potential weaknesses, which is informative to the field.

  5. **Reversal rounds (re-reviewing rejected proposals)**:
     - Continue the practice but with two changes:
          a. Use a partially fresh panel: At least two of the reviewers must not have seen the proposal before.
          b. In the pre-meeting private input, reviewers are not told it is a reversal round. They see the proposal as new.
     - This reduces the effect of prior knowledge.

  6. **Decision and public rationale**:
     - The decision is based on the secret ballot vote.
     - The public rationale is written by the chair, incorporating:
          - The main reasons for funding (if funded) or the critical weaknesses (if not).
          - If there was dissent, it must be mentioned and the counterargument summarized.
          - If manufactured dissent (in unanimous cases) raised a substantial point, that must be included.
          - Explicitly avoid citing common sources as the primary reason. Instead, focus on the independent reasons that came up.

  7. **When to stop and hand back to the chair**:
     - The procedure stops and hands back to the chair (for a judgment call) in two cases:
          a. **No clear evidence**: When the panel cannot provide independent evidence beyond common sources (e.g., they all rely on the same benchmark without critical evaluation). Then the chair must decide based on the foundation's risk appetite: high-risk tolerance might fund if the idea is novel and the common source is solid; low-risk tolerance would reject for lack of independent support.
          b. **Tie or deep split**: When the vote is tied or the split is deep (e.g., 2-2 in a panel of four), the chair must make the call, again based on risk appetite.

  8. **When there's no calibrated probability**:
     - Instead of probabilities, we use the strength of independent rationales and the diversity of arguments. If all rationales are weak (e.g., only restating common sources) then the proposal is riskier and the chair must decide on risk appetite.

  Now, addressing the specific issues:

  (1) **Cascade inside the room**: Random speaking order and private pre-meeting inputs break the fixed order and reduce deference. Secret ballot at the end reduces reputational pressure.

  (2) **Agreement that isn't independent**: The pre-meeting private rationale and the rule in Round 1 (requiring at least one piece of non-common reasoning) help identify non-independence. If all rationales are the same, then the chair flags it and may decide based on risk.

  (3) **"If it were worth doing..." move**: The panel must provide evidence for this claim. In Round 2, the chair should ask: "What specific reasons might explain the absence? Could it be a cascade?" and "What would change your mind about the absence being evidence against?" This forces them to consider alternative explanations.

  (4) **Past write-ups influencing**: The reversal round with fresh reviewers (at least two) and without prior knowledge helps. Also, in the pre-meeting input, reviewers are not told about prior decisions.

  (5) **Manufactured dissent**: We use a devil's advocate report in unanimous cases. It is not meant to carry independent information but to test the consensus. It is noise if the consensus is strong, but it can reveal hidden fragility. If the devil's advocate cannot write a plausible critique, that strengthens the consensus. If they can, it may lead to rethinking. It also signals to the field that the foundation is thoughtful.

  Now, run the procedure on the three cases:

  **Case 1: The method that went from nobody to everyone in 18 months**

  - Pre-meeting private input: All panelists submit "Fund". Their rationales: "Three other funders are funding variants", "This is the new standard", "The benchmark shows it's superior".
  - Chair pre-processing: Flags that all rationales are based on common sources (other funders, benchmark) and there's no independent reasoning.
  - Meeting: 
     - Random order. Each panelist states "Fund" and then gives their rationale. They all say similar things.
     - In Round 2, the chair asks: "What if the benchmark is flawed? What independent evidence do we have that this method is better? Has anyone tried it in a different setting?" 
     - Panelists may struggle. If no independent evidence emerges, the chair notes that the panel is herding.
  - Final vote: Likely unanimous for fund.
  - Since unanimous, assign devil's advocate report. The devil's advocate might write: "This method relies on benchmark X, which has known issues Y. If X is not representative, the method may fail in real-world applications."
  - Decision: The panel is in a cascade. The chair must decide based on risk appetite. Since the foundation funds high-risk science, and the method is unproven beyond a benchmark, funding might be justified for a variant that tests it in a new setting? But the independent rationale is weak. 
  - Public rationale: "We are funding this proposal to test the emerging method in a new context. While the method has gained attention, we note that it relies on benchmark X, which has limitations [as per devil's advocate]. Our funding aims to generate independent validation."

  Alternatively, if the foundation is very risk-averse to herding, the chair might reject because of the lack of independent reasoning. But given that others are funding, it might be better to fund a high-risk aspect.

  **Case 2: Replication-and-negative-results project in a confident subfield**

  - Pre-meeting private input: Some panelists submit "Do not fund", with rationales: "The field is confident, so replication is low priority"; "No one has funded it, so it must not be worthwhile". One might submit "Fund" with: "This could uncover a flaw in a foundational result."
  - Chair pre-processing: Notes the "absence of uptake" as a common reason. Flags it for Round 2.
  - Meeting:
     - Random order. Signals and rationales: Majority not fund, but one fund.
     - Round 2: Chair asks: "Why hasn't this been done? Could it be because everyone thinks someone else will do it? What if the foundational result is wrong?" and "What evidence do we have that the field's confidence is justified? Is there any hint of doubt in the literature?"
     - Also: "If this replication were done and it confirmed the result, would that be valuable? If it contradicted, would that be very valuable?" (This highlights the value of information.)
  - Final vote: Might shift if the value of information is recognized.
  - If the vote is not fund (likely), then the public rationale must address the replication value. The devil's advocate is not needed if not unanimous.
  - Decision: If the panel rejects, the chair might overrule if the foundation's mandate is to fund high-risk, high-reward and replication in an overconfident field is exactly that. The chair steps in because the panel might be herding on the absence of uptake.
  - Public rationale (if rejected): "While replication is important, the panel felt that the current evidence for the established result is strong and that the resources would be better used elsewhere. However, we note the value of independent replication and encourage the applicant to seek other funding sources for this work." 
    - This is weak. Alternatively, if the chair overrules and funds: "We are funding this replication because of the high value of potentially challenging a foundational result and the risk that the field's confidence may be misplaced. The absence of prior funding does not indicate lack of importance but may reflect collective action problems."

  **Case 3: The previously rejected proposal, now revised, with our past write-up having influenced others**

  - Background: Two years ago, we rejected and published a dismissive rationale. Two other funders passed, citing us. Now revised, private scores are decent.
  - Pre-meeting private input: Reviewers submit their signals and rationales without knowing the prior history (because we redact it). 
  - Chair pre-processing: You know the history, but the reviewers don't. You note the decent scores.
  - Meeting: 
     - Random order. Panelists give signals and rationales. They might be positive.
     - In Round 2, the chair reveals: "This is a resubmission. Two years ago, we and others rejected it, but we have redacted the old reviews. Now, having heard each other, does anyone change their mind? And what do you make of the fact that others have rejected it citing us?" 
     - This forces them to consider if the prior rejections were a cascade.
  - Final vote: Likely mixed? But private scores were decent, so maybe fund.
  - If they vote to fund, then the public rationale must address the reversal.
  - Devil's advocate: If unanimous for fund, we assign a devil's advocate to critique (e.g., "The revisions may not fully address the original flaws").
  - Decision: The panel is now aware of the cascade possibility. They might still fund. The chair must consider: funding this buys a signal that breaks the cascade. Also, the foundation has a duty to correct if it was wrong.
  - Public rationale: "We previously rejected an earlier version of this proposal. After a thorough re-review with fresh input, we have decided to fund the revised proposal. The panel found that the revisions addressed prior weaknesses and that the proposal has significant merit. We acknowledge that our prior decision may have contributed to a cascade of rejections, and we encourage other funders to reevaluate this work independently." 
    - This eats crow loudly and breaks the cascade.

  **What the procedure can't do (failure modes)**:

  - **Strong reputational herding**: If the panel culture is such that junior members won't speak against seniors even with anonymity, the procedure may not break that. The random order and secret ballot help but aren't foolproof.
  - **Common knowledge traps**: When the entire field (including the panel) shares the same flawed common source, the procedure might not detect it. The devil's advocate might not help if they can't think outside the box. The chair must be vigilant for groupthink.
  - **Time constraints**: With only 15 minutes per case, the pre-meeting input and Round 1 might be rushed. The chair must enforce brevity.
  - **Misjudging independence**: The chair might misjudge whether a rationale is independent. This is a judgment call.
  - **Overruling too much**: If the chair frequently overrules, it undermines the panel. Reserve for clear cascade cases.
  - **Manufactured dissent noise**: The devil's advocate report might be weak and not informative. But it's still useful to include in the public rationale to show due diligence.
  - **False sense of security**: The procedure might not catch all cascades. It is a heuristic.

  **Outputs to distrust**:
  - Unanimous decisions with only common-source rationales (risk of cascade).
  - Decisions where the devil's advocate cannot write a critique (if it's too hard, that might mean the consensus is strong, but if it's because the devil's advocate is lazy, then it's noise).
  - Decisions in which the panel did not engage with the chair's questions about common sources and absence of uptake.

  **Conclusion**: This procedure forces independent input, reduces cascades by randomizing order and using secret ballots, and uses devil's advocacy to test unanimity. The chair has a critical role in identifying herding and making risk-appetite calls. It should improve the quality of decisions and public rationales, making cascades less likely and breaking them when detected.
answer: |-
  Below is a decision procedure designed to mitigate herding and informational cascades in your panel reviews, grounded in sequential herding literature (e.g., Bikhchandani et al. 1992 on information cascades; Prendergast 1993 on reputational herding; and Anderson & Holt 1997 on experimental evidence). The procedure prioritizes operational simplicity, enforces independent signal collection, and explicitly flags cascade risks. It assumes panelists can provide binary signals ("fund"/"no fund") and qualitative rationales but not calibrated probabilities. 

  The procedure is structured as a flowchart with sequential questions. Steps in **bold** are mechanistic (require minimal judgment); others are judgment-based but use structured prompts to reduce bias. Steps that halt the process with a "no" or defer to you (the chair) are marked. The panel runs steps 1–6; you handle steps 7–9.

  ---

  ### **Decision Procedure: Cascade-Resistant Review**
  **Goal**: Elicit independent signals, detect herding, and force explicit risk-appetite decisions when evidence is weak.  
  **Time per case**: 15 minutes (panel) + 5 minutes (chair wrap-up).  
  **Inputs**: Proposals, reviewer private scores (submitted pre-meeting without discussion).  
  **Outputs**: Fund/no fund decision, public rationale, and flags for cascade risks.  

  #### **Step 1: Private Signal Collection (Mechanistic)**  
  - **What**: Before the meeting, each reviewer privately submits:  
    - A binary score: "Fund" (F) or "No Fund" (NF).  
    - A 1-sentence rationale citing **one unique piece of evidence** (e.g., "Method fails on dataset X" or "Theory Y supports this").  
    - A confidence rating: "High" (expert in subfield), "Medium" (adjacent), or "Low" (guessing).  
  - **Why**: Prevents early speakers from influencing others. Anchors reviewers to their own signal.  
  - **Sufficient answer**: All reviewers submit scores/rationales. If rationales are identical (e.g., all cite the same benchmark), flag as "herding risk."  
  - **Stop/defer**: If >2 reviewers cite the same source (e.g., the same preprint), defer to Step 7 (chair’s risk-appetite call).  

  #### **Step 2: Blind Vote Tally (Mechanistic)**  
  - **What**: You (chair) calculate the initial vote: #F vs. #NF. Do not reveal individual votes.  
  - **Why**: Establishes baseline without bias from deliberation. Literature shows cascades start when public signals outweigh private ones.  
  - **Sufficient answer**: Majority exists (e.g., 3-1) or tie (2-2).  
  - **Stop/defer**: If unanimous (4-0 or 0-4), proceed to Step 6 (cascade test). If tie, defer to Step 7.  

  #### **Step 3: Deliberation with Forced Contrarianism (Judgment + Mechanism)**  
  - **What**: In meeting, panelists discuss in **random order** (not board member first!). Each must:  
    - State their private rationale (from Step 1).  
    - Answer: "What would change your mind?" (e.g., "If dataset Z were debunked").  
    - Forced dissent: If majority is forming, ask a minority voter (or random reviewer) to argue the opposite view.  
  - **Why**: Random order and forced dissent disrupt deference. Reputational herding is mitigated by normalizing opposition.  
  - **Sufficient answer**: At least one reviewer identifies a "mind-change" condition. If all rationales trace to the same source (e.g., "big lab’s preprint"), flag as "non-independent agreement."  
  - **Stop/defer**: If no reviewer can name a "mind-change" condition, defer to Step 7 (evidence too weak).  

  #### **Step 4: Absence-of-Uptake Test (Judgment)**  
  - **What**: Panel answers: "Why hasn’t this been funded/done before?" Options:  
    - Valid evidence (e.g., "Technically infeasible until now").  
    - Cascade risk (e.g., "No one wants to challenge the big lab").  
    - Don’t know.  
  - **Why**: Addresses "somebody would have done it" bias. Absence of uptake is only valid evidence if explored.  
  - **Sufficient answer**: Majority agrees on a reason. If "cascade risk" is cited, treat as a point for funding (high-risk science mandate).  
  - **Stop**: If absence is attributed to cascade risk and proposal is high-potential, default to "fund."  

  #### **Step 5: Reversal Round Handling (Mechanistic)**  
  - **What**: For re-reviewed proposals (your "reversal round"):  
    - Use a partially new panel (≥2 new reviewers).  
    - Redact past scores AND rationales (reviewers can’t infer prior verdicts).  
  - **Why**: Literature shows cascades are self-reinforcing; new reviewers reduce path dependency.  
  - **Sufficient answer**: New panel completes Steps 1–4.  
  - **Stop**: If new panel’s vote matches old verdict, accept outcome. If not, investigate bias.  

  #### **Step 6: Unanimity Cascade Test (Mechanistic for panel; Judgment for chair)**  
  - **What**: If vote is unanimous (from Step 2):  
    - Assign a devil’s advocate (DA) to write a "minority report" (even if they agree). DA must:  
      - Identify one assumption that could fail (e.g., "Benchmark dataset is flawed").  
      - Rate plausibility: "Likely" (>30% chance), "Unlikely" (<10%).  
  - **Why**: Manufactured dissent tests cascade fragility. A strong DA case breaks false consensus; a weak one confirms robustness.  
  - **Sufficient answer**: DA report submitted.  
  - **Stop/defer**: If DA identifies a "likely" failure, defer to Step 7. Else, accept unanimous vote.  
  - **Kill your rule? No**. DA reports add value: they force scrutiny and provide public signal of due diligence. Noise is minimal if DA is guided (e.g., "focus on assumptions").  

  #### **Step 7: Chair’s Risk-Appetite Call (Deferral Step)**  
  - **What**: You decide when:  
    - Evidence is weak (Step 1/3 flags).  
    - Vote is tied.  
    - DA report finds "likely" failure (Step 6).  
  - **Criteria**: Fund only if:  
    - Potential upside justifies risk (e.g., field-altering impact).  
    - Proposal addresses a cascade gap (e.g., challenges consensus).  
  - **Why**: Herding literature shows cascades persist without intervention. You absorb ambiguity.  
  - **Output**: Fund/no fund. Always document rationale for public write-up.  

  #### **Step 8: Public Rationale Draft (Mechanistic)**  
  - **What**: Write the public paragraph:  
    - Disclose vote split (e.g., "3-1 for fund").  
    - Include DA report if unanimous.  
    - Cite independent evidence (from Step 1).  
    - If reversing prior decision, explain why (e.g., "New data addressed concerns").  
  - **Why**: Transparency combats reputational herding.  

  #### **Step 9: Board Defense Prep (Judgment)**  
  - **What**: For board ratification, flag:  
    - Cascade risks (e.g., "Panel herded on benchmark").  
    - Cases where you overrode panel (Step 7).  
  - **Why**: Boards can defend judgment calls but not hidden cascades.  

  ---

  ### **Procedure in Action: Three Cases**  
  **Case 1: The Bandwagon Method**  
  - **Step 1**: All reviewers submit "F." Rationales: "Big lab uses it," "Benchmark shows success," "Other funders back it." → Flagged as herding risk (non-independent).  
  - **Step 2**: Unanimous "F" → Proceed to Step 6.  
  - **Step 6**: DA report: "Assumption: Benchmark is reliable. Failure plausibility: Likely (benchmark has selection bias)."  
  - **Step 7**: Deferred to you. Risk-appetite call: **Fund, but with caveats**. Upside is high (foundation supports emerging trends), but public rationale must stress independence.  
  - **Step 8 (Public Rationale)**: "Funded 4-0. While multiple funders support this method, our decision prioritized [independent evidence from DA, e.g., "its applicability to edge cases"]. The DA noted potential benchmark bias, which we deem an acceptable risk for high-reward science."  
  - **Verdict**: Fund, but DA forces explicit risk acknowledgment.  

  **Case 2: Replication Project in Confident Subfield**  
  - **Step 1**: Scores: 3 NF, 1 F. Rationales: "Consensus is strong," "No prior funding suggests low value."  
  - **Step 4**: Absence-of-uptake test: Reviewers say, "No one funded it because it’s unnecessary." Chair pushes: "Could it be a cascade?" One reviewer: "Yes, if the big lab intimidates critics." → Flagged as cascade risk.  
  - **Step 7**: Deferred to you. Risk-appetite call: **Fund**. Absence of uptake is likely cascade (per Step 4), and replication buys a high-value signal. Foundation’s mandate is to fund such risks.  
  - **Step 8 (Public Rationale)**: "Funded 3-1 reversal. While subfield consensus is strong, we fund high-risk replications to test robustness. The panel noted that prior non-funding may reflect cascades, not merit."  
  - **Verdict**: Fund to break cascade.  

  **Case 3: Previously Rejected, Now Revived**  
  - **Step 5 (Reversal Round)**: New panel + redacted past. Private scores: 3 F, 1 NF (decent).  
  - **Step 3**: Forced dissent reveals: "Two other funders rejected this, citing our prior rationale." Chair asks: "Could this be a cascade?" Majority: "Yes, our past dismissal influenced others."  
  - **Step 7**: Deferred to you. Risk-appetite call: **Fund and eat crow loudly**. Why?  
    - The panel’s decent scores suggest merit.  
    - Your past rejection likely sparked a cascade (other funders herded).  
    - Funding buys a signal to correct the cascade.  
  - **Step 8 (Public Rationale)**: "Funded 3-1. We rejected an earlier version, but re-review with redacted history shows this proposal addresses past flaws. We acknowledge our initial dismissal may have influenced others; independent assessment justifies reversal. High-risk funding requires revisiting failures."  
  - **Verdict**: Fund with a public mea culpa. Loud reversals are valuable: they signal learning and break cascades (literature shows cascades reverse when early movers change).  

  ---

  ### **What the Procedure Can’t Do: Failure Modes**  
  1. **Deep Reputational Herding**: If reviewers fear contradicting a board member (issue 1), random order and forced dissent help but may not eliminate deference. **Distrust**: Unanimous decisions where the board member spoke first.  
  2. **Common-Source Blind Spots**: When all reviewers unknowingly rely on the same flawed source (issue 2), Step 1 flags it, but if the source is field-wide (e.g., a universal benchmark), the DA may miss it. **Distrust**: Proposals where all rationales trace to one dataset.  
  3. **False Negatives from Absence**: Step 4 tests "why not done," but if the panel conflates valid absence (e.g., technical barriers) with cascade, it may fund recklessly. **Distrust**: Projects where absence-of-uptake is the only evidence.  
  4. **Reversal Round Contamination**: Even with new reviewers, field-wide cascades (e.g., "everyone knows it’s weak") may persist (issue 4). **Distrust**: Re-reviews with identical scores to initial.  
  5. **Manufactured Dissent Futility**: DA reports add rigor, but if reviewers half-heart it, it’s noise (issue 5). **Distrust**: DA reports with "unlikely" failure ratings.  
  6. **Time-Driven Herding**: In rushed reviews (15 minutes), Steps 3–4 may get cut. **Distrust**: Cases where "mind-change" conditions aren’t discussed.  

  **When to Override the Procedure**:  
  - **Trust** outputs when: Votes split, rationales are diverse, and DA reports are substantive.  
  - **Distrust** outputs when: Unanimous + common-source reliance, or reversal rounds match old scores.  
  - **Never Trust**: "Silent" decisions (no rationale debate), or panels with <2 new reviewers in reversal rounds.  

  **Final Note**: This procedure makes cascades less likely but can’t eliminate them. Its power is in forcing hidden herding into the open, letting you make risk-appetite calls. Implement it as-written for 3 months, track decisions challenged by the board, and adjust.
