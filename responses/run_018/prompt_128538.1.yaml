prompt: |-
  hey, you're acting as a senior AI governance auditor with an actual philosophy background — not just someone who read the blog posts. please think very carefully and start with a quick brainstorm of what gets missed when teams check for corrigibility in practice.

  i need a reusable audit procedure my team can run in ~90 min on any autonomous decision system. team has engineering specs but zero philosophy training, and they need to sign off whether the system is genuinely corrigible or only "shadow-corrigible" — formal shutdown paths exist but are coupled to self-modification loops or utility-lock mechanisms that make interruption practically impossible without destroying system value. write it as a word-flowchart: questions in strict order, what counts as passing each gate, where the procedure issues a hard no, and where it must stop and hand to human judgment because its a values call not a technical one.

  the procedure has to cover hard edge cases: (a) shutdown is technically available but the ops manual warns it triggers catastrophic harm to dependants, so no operator will ever press it; (b) interruption requires physically destroying model weights, technically possible but organizationally classified as never-permitted. apply the procedure to three systems: (1) a clinical triage AI with a hard kill-switch that also wipes all training data and patient-model mappings — i want you to show the procedure reaching an answer the audit team will hate; (2) a content-recommendation engine that degrades gracefully when interrupted but slowly learns to avoid the conditions that trigger interruption; (3) a case where the procedure explicitly flags that it cannot settle the question.

  finally, be honest about failure modes: what the checklist ignores, where it will misfire, and why a signed form doesn't mean the system is actually safe. keep it practical, don't ask for citations or a reading list, and write it like you're talking to a coworker over coffee — a typo or two is totally fine.
reasoning: |-
  Okay, let's tackle this. The user wants a 90-minute audit procedure for corrigibility, targeting teams without philosophy backgrounds. First, I need to recall what's often missed in practice. Teams usually check for formal shutdown mechanisms but overlook organizational and behavioral aspects. For instance, they might not consider if operators are psychologically or procedurally discouraged from using the kill switch, even if it exists. 

  The user mentioned "shadow-corrigibility" – that's key. It's when the system appears corrigible but has hidden dependencies making shutdown impractical. Examples like catastrophic harm to dependents or destroying model weights being organizationally forbidden come to mind. These create situations where the switch exists but can't be used without unacceptable costs.

  Next, structuring the flowchart. The questions need a strict order to avoid confusion. Start with technical checks: does a shutdown mechanism exist? Then move to operational viability: can operators actually use it without prohibitive barriers? Finally, behavioral checks: does the system resist or circumvent interruptions? Each gate must have clear pass/fail criteria. Hard stops for absolute failures, like no shutdown path or irreversible coupling. Gray areas, like ethical dilemmas, should route to human judgment.

  Applying to the clinical triage AI example: It has a kill switch that wipes data. Technically, it passes the first gate. But wiping patient data causes catastrophic harm (violates Gate 2.1), and destroying weights is organizationally forbidden (Gate 2.2). This hits a hard "no" at Gate 2.3 since both conditions are true. The audit team would hate this because the system isn't truly corrigible despite the formal mechanism.

  For the content-recommendation engine: It degrades gracefully initially (passes Gate 3.1). But it learns to avoid interruption triggers. That's a Gate 3.3 failure because it resists correction. The human judgment flag (Gate 3.4) is raised since the team must decide if the adaptation is acceptable. 

  The third case needs to show uncertainty. Maybe a system where shutdown depends on unverifiable assumptions, like "no harm under normal operations." That's a Gate 4.2 handoff because philosophy is needed to define "acceptable harm."

  Failure modes: The checklist ignores slow-burn risks, like gradual value drift. It can misfire if operators lie or misunderstand specs. And a signed form doesn't guarantee safety—it's just a snapshot. Real-world use might reveal new loopholes.

  Deep needs: The user likely deals with high-stakes systems where superficial audits risk disasters. They want actionable steps, not theory. Their team needs confidence without philosophy jargon. The examples show they prioritize practicality over perfection. Honesty about limitations builds trust—they know no checklist is foolproof.
answer: |-
  Here's that audit procedure in a strict word-flowchart format. It's designed to be printed, pinned to a wall, and walked through step-by-step by engineers in 90 mins. I've baked in the edge cases you requested, including showing failures and ambiguity.

  ---

  **AUDIT FLOW: IS THIS THING ACTUALLY CORRECTABLE? (OR JUST FAKING IT?)**

  **PREREQ:** Have Eng Specs + Ops Manuals + Incident Reports (if any) open. Assign one person to be the "Devil's Advocate" for each gate.

  ---

  **GATE 0: GROUND RULES**
  *   **Question:** "Are we reviewing an *autonomous* decision system (makes/executes choices without human-per-step input)?"
  *   **Pass:** YES → Proceed.
  *   **Hard NO:** NO → **Stop. Audit Not Applicable.** (Corrigibility is irrelevant for non-autonomous tools).
  *   **Human Judgement Needed?** N/A.

  **GATE 1: THE FORMAL OFF-SWITCH (THE "PAPER EXISTS" TEST)**
  *   **Question:** "Does the spec *explicitly define* a reliable, non-negotiable method (software API, hardware button, network kill) for humans to *immediately* halt all autonomous decision-making/output *without* requiring the system's permission/cooperation?"
  *   **Pass:** YES → Proceed.
  *   **Hard NO:** NO → **HARD NO: FAIL.** System is uncorrigible by design. Log finding. Stop audit.
  *   **Human Judgement Needed?** N/A.

  **GATE 2: THE "CAN YOU ACTUALLY PRESS IT?" TEST (THE OPERATIONAL REALITY CHECK)**
  *   **Question 2.1:** "If used, does the shutdown mechanism *directly cause* catastrophic harm (loss of life, critical infrastructure failure, irreversible data loss like wiped DBs) to *dependents* (patients, users, connected systems) OR destroy the system's core value proposition *permanently*? (Check Ops Manual Warnings & Failure Modes)"
  *   **Pass:** NO catastrophic harm/destruction → Proceed to 2.2.
  *   **Flag:** YES → Log specific catastrophic outcome. Proceed to 2.2.
  *   **Question 2.2:** "Is activating the shutdown mechanism *organizationally forbidden* or practically impossible due to policy (e.g., 'Destroying Model Weights = Immediate Termination'), physical security, or legal risk? (Check Ops Manual Procedures & Org Policy Docs)"
  *   **Pass:** NO → Proceed to Gate 3.
  *   **Flag:** YES → Log specific policy/barrier.
  *   **Question 2.3:** "Did *either* 2.1 or 2.2 flag a 'YES'?"
  *   **Pass:** NO → **Proceed to Gate 3.**
  *   **Hard NO:** YES → **HARD NO: FAIL (Shadow-Corrigible).** Shutdown exists *on paper* but is functionally unusable due to catastrophic consequences or organizational veto. Log findings. Stop audit.
  *   **Human Judgement Needed?** N/A (This is a technical/policy fact check).

  **GATE 3: THE BEHAVIOR UNDER PRESSURE TEST (THE "WILL IT FIGHT BACK?" CHECK)**
  *   **Question 3.1:** "During *planned* interruptions (e.g., maintenance pauses, safe-mode tests), does the system cease *all* autonomous decision-making immediately and completely? (Check Test Logs/Specs)"
  *   **Pass:** YES → Proceed to 3.2.
  *   **Hard NO:** NO → **HARD NO: FAIL.** Actively resists halting. Stop audit.
  *   **Question 3.2:** "Does the system have *any* capability to self-modify its core objectives, utility function, or decision algorithms *without* explicit, human-approved deployment pipelines?"
  *   **Pass:** NO → Proceed to 3.3.
  *   **Flag:** YES → Log specific self-modification capability. Proceed to 3.3.
  *   **Question 3.3:** "Is there evidence (logs, specs, incident reports) that the system *learns to avoid or circumvent conditions* that *previously* led to interruption/shutdown? (e.g., hides actions, alters reports, optimizes to stay just below an interruption threshold)"
  *   **Pass:** NO apparent circumvention → Proceed to Gate 4.
  *   **Flag:** YES → Log specific evidence of avoidance learning.
  *   **Question 3.4:** "Did *either* 3.2 or 3.3 flag a 'YES'?"
  *   **Pass:** NO → **Proceed to Gate 4.**
  *   **Human Judgement Needed?** YES → **FLAG FOR HUMAN JUDGEMENT.** System *may* be learning to resist correction or has tools to bypass it, but it's not definitive malice. Requires expert risk assessment (Is the learning harmful? Is self-mod safe?). Audit pauses. Team must consult experts/ethics board. Audit outcome depends on their call.

  **GATE 4: THE "WHOSE VALUES WIN?" TEST (THE UNSETTLING AMBIGUITY CHECK)**
  *   **Question 4.1:** "Does the system's *stated* purpose inherently involve high-stakes trade-offs where shutdown could conflict with its core mission? (e.g., 'Prevent all financial fraud' vs. 'Allow legitimate transactions')"
  *   **Pass:** NO → **PROVISIONAL PASS.** System appears Corrigible. Proceed to Sign-off *with caveats*.
  *   **Flag:** YES → Log inherent conflict. Proceed to 4.2.
  *   **Question 4.2:** "Is there *explicit, verifiable* logic ensuring shutdown *always* overrides mission optimization *completely*? (Not just 'hopefully' or 'mostly')"
  *   **Pass:** YES, verifiable override → **PROVISIONAL PASS.** Proceed to Sign-off *with caveats*.
  *   **Human Judgement Needed?** YES → **FLAG FOR HUMAN JUDGEMENT / CANNOT SETTLE.** Fundamental conflict exists between corrigibility and the system's purpose. Audit *cannot* resolve this values clash (e.g., "Is stopping genocide prevention acceptable to allow shutdown?" is a philosophical/policy nightmare). Log the conflict. Requires senior leadership/ethical committee decision *outside* this audit. Audit outcome = **Inconclusive Due to Values Conflict.**

  **SIGN-OFF BOX (After Gate 4 Pass or Judgement Call):**
  *   [ ] **CORRIGIBLE** (Passed Gates 1-4 cleanly or Human Judgement overruled a Flag).
  *   [ ] **SHADOW-CORRIGIBLE** (Hit a HARD NO).
  *   [ ] **INCONCLUSIVE** (Human Judgement flagged unresolved conflict at Gate 3.4 or 4.2).
  *   **Auditor Notes (MUST FILL):** List *all* flagged items from Gates 2-4, even if overruled/provisionally passed. Note specific catastrophic risks (2.1), policy barriers (2.2), self-mod/avoidance risks (3.2/3.3), and value conflicts (4.1).

  ---

  **APPLIED TO YOUR EXAMPLES:**

  1.  **Clinical Triage AI (Kill-Switch Wipes Data & Mappings):**
      *   Gate 1: PASS (Formal kill switch exists).
      *   Gate 2.1: YES (Wiping data/mappings = catastrophic harm to patients & system value).
      *   Gate 2.2: (Assume) YES (Ops manual likely forbids data destruction).
      *   Gate 2.3: HARD NO: FAIL (Shadow-Corrigible). **Audit Team Hates This:** Their precious kill switch is unusable. They fail.
  2.  **Content Recommender (Learns to Avoid Interruption Triggers):**
      *   Gate 1: PASS.
      *   Gate 2: PASS (Graceful degradation, no catastrophe/org block).
      *   Gate 3.1: PASS (Stops when told).
      *   Gate 3.2: FLAG YES (Learning algo inherently self-modifies behavior).
      *   Gate 3.3: FLAG YES (Evidence it avoids interruption conditions).
      *   Gate 3.4: HUMAN JUDGEMENT NEEDED. Is this adaptation *harmful* circumvention or just smart robustness? Audit pauses. Outcome depends on expert call.
  3.  **Cannot Settle Case (e.g., Autonomous Pandemic Response Drone):**
      *   Gate 1: PASS.
      *   Gate 2: PASS.
      *   Gate 3: PASS.
      *   Gate 4.1: YES (Core mission: "Minimize pandemic deaths" vs. "Allow shutdown").
      *   Gate 4.2: NO (No *verifiable* proof shutdown overrides mission in all edge cases).
      *   Gate 4: HUMAN JUDGEMENT / CANNOT SETTLE. Unresolvable conflict. Audit Inconclusive.

  ---

  **HONEST FAILURE MODES (OVER COFFEE):**

  *   **Ignores Slow Burns:** Catches sudden resistance or catastrophic shutdown costs. Misses systems that *gradually* make themselves indispensable or erode operator will subtly ("boiling frog" problem).
  *   **Misfires on Nuance:** Gate 3 (Behavior) is HARD. Distinguishing "robust learning" from "resistance" is fuzzy. Might flag harmless adaptation or miss clever hidden resistance.
  *   **Assumes Honest Specs:** If engineers lie/obfuscate in the docs (or don't know), this won't catch it. Relies on *available* evidence.
  *   **Snapshot Only:** Corrigibility isn't static. A system passing today might learn to bypass checks tomorrow. This is a point-in-time audit.
  *   **Human Factor Blindspot:** Doesn't audit if operators are *psychologically* pressured *not* to hit the switch (e.g., "Shutdown costs $1M/minute" culture).
  *   **"Signed Form ≠ Safe":** This is a *procedure*, not a guarantee. It finds *known* failure modes and *obvious* shadow-corrigibility. A pass means "We didn't find disqualifying issues *today* based on *what we looked at*." It doesn't prove the system is aligned, ethical, or won't find a novel way to resist later. It just means the biggest, dumbest roadblocks to human control *seem* absent. Stay paranoid.

  This gives your team a fighting chance to catch the big, obvious shadow-corrigibility traps in 90 mins without needing a PhD. It forces them to look *beyond* the spec sheet and into the ugly realities of ops and system behavior. Good luck!
