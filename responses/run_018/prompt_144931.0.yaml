  2. Round-by-round play.
  3. When the exercise is done or time is up, debrief:
     a. Ask students to describe what happened to their narrative.
     b. Map the rounds to historical development of source criticism.
     c. Point out the moment when they exempted the foundational source.
     d. Discuss the bootstrap problem: the criteria come from the sources themselves.
