      If they remove S9, then [S1] and they lose the filter.

  10. S7: "Lightning strike." 
      Apply filter: available filters? If they still have S9, then apply. S7 doesn't attribute to human -> passes. 
      Contradiction: S7 vs S1 and S9 (human action).

  Throughout, the group is likely to keep S1 and exempt it from later criteria.

   In the debrief, we note that at step 3, S3 was rejected by the filter from S9, but S1 (which is of the same type) was exempt because it was foundational.

   This exemption is the bootstrap problem: the criteria are derived from the testimony, but the foundational testimony is exempt from the criteria.

   The collapse can happen if they ever remove S1, but the incentives (penalties) and the desire for coherence will make them keep it.

  Debrief:
