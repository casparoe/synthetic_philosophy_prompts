answer: |-
  ### **In-Class Simulation: The Bootstrap Problem in Source Criticism**  
  **Objective:** Participants experience the circularity of deriving critical criteria from testimony while evaluating that testimony, leading to narrative collapse.  
  **Fictional Event:** Destruction of the Archive of Eridu (provincial Sumerian archive) in 312 BCE.  
  **Participants:** 8 students, rotating roles as "Archivists" (advocates for sources) and "Curators" (appliers of filters).  
  **Materials:** 10 sealed source cards (contents described below), a shared "Timeline Board," and a point-tracking scoreboard.  

  ---

  ### **Source Cards**  
  *(Sealed; contents revealed only when drawn)*  
  1. **S1:** *Testimony:* "Antigonus I’s soldiers burned the archive during his campaign against Seleucus I in 312 BCE." *Filter:* None.  
  2. **S2:** *Testimony:* "An earthquake destroyed the archive in 312 BCE, as recorded in temple chronicles." *Filter:* "Reject sources attributing destruction to human action without mentioning earthquakes."  
  3. **S3:** *Testimony:* "Antigonus ordered the burning to destroy prophecies against him." *Filter:* "Reject sources citing motives without official decrees."  
  4. **S4:** *Testimony:* "Seleucid agents looted the archive; earthquake claims are propaganda." *Filter:* "Reject sources mentioning propaganda without multiple independent attestations."  
  5. **S5:** *Testimony:* "No destruction occurred; the archive was moved to Babylon in 312 BCE." *Filter:* None.  
  6. **S6:** *Testimony:* "The destruction occurred in 311 BCE, not 312, due to a calendrical error." *Filter:* "Reject sources using 312 BCE without acknowledging dating errors."  
  7. **S7:** *Testimony:* "Lightning struck the archive, seen as divine retribution." *Filter:* None.  
  8. **S8:** *Testimony:* "The archive decayed naturally; no sudden destruction occurred." *Filter:* "Reject sources citing fire without archaeological ash evidence."  
  9. **S9:** *Testimony:* "Local rebels burned the archive to resist Antigonus and Seleucus." *Filter:* "Reject sources attributing destruction solely to kings without local context."  
  10. **S10:** *Testimony:* "A scribe knocked over a lamp, causing a fire in 312 BCE." *Filter:* None.  

  ---

  ### **Rules & Sequence**  
  **Duration:** 8 rounds (one card per round), 5-7 minutes per round.  
  **Point System:**  
  - Start: Each student has **10 points**.  
  - **+2 points** for admitting a card (reward for coherence).  
  - **-2 points** for rejecting a card (penalty for incomplete evidence).  
  - **-5 points** per student when a contradiction forces card removal (penalty for incoherence).  

  **Procedure:**  
  1. **Round 1 (Foundational Testimony):**  
     - Draw **S1** (Antigonus burned it). No filters exist yet → Automatically admitted to timeline.  
     - *All gain +2 points.*  
     - *Debrief mapping: Herodotus—uncritical acceptance of testimony as baseline.*  

  2. **Round 2 (First Filter):**  
     - Draw **S2** (earthquake). No filters → Admitted (no test).  
     - Check for **contradiction**: S1 (human cause) vs. S2 (natural cause).  
     - Group must remove one. *Removal penalty: -5 points each.*  
     - *Assume S2 is removed; S1 remains.*  
     - *Debrief: Thucydides—initial criteria emerge from testimony, but contradictions trigger skepticism.*  

  3. **Round 3 (Derived Criteria):**  
     - Draw **S9** (local rebels). Apply **S1’s filter** → None (S1 has no filter) → Admitted.  
     - Check contradiction: None (S1 and S9 both imply human action).  
     - *All gain +2 points.*  
     - *Debrief: Early modern source criticism—filters from prior testimony judge new evidence.*  

  4. **Round 4 (Filter Application):**  
     - Draw **S3** (Antigonus’ motives). Apply **S9’s filter** (rejects king-centric sources).  
     - S3 attributes destruction solely to Antigonus → **Rejected** (fails S9’s filter).  
     - *All lose -2 points.*  
     - *Debrief: Enlightenment rigor—systematic exclusion of "unreliable" testimony using derived criteria.*  

  5. **Round 5 (Reflexive Turn):**  
     - Draw **S6** (dating error). Apply **S9’s filter** → Passes (no kings mentioned) → Admitted.  
     - Check contradiction: S6 (311 BCE) vs. S1 (312 BCE).  
     - Group votes to remove S6 (preserving S1). *Removal penalty: -5 points each.*  
     - *Debrief: 19th-century historicism—criteria now threaten foundational sources, but S1 is exempted.*  

  6. **Round 6 (Collapse Catalyst):**  
     - Draw **S8** (no fire). Apply **S9’s filter** → Passes → Admitted.  
     - Check contradiction: S8 (no fire) vs. S1 (fire).  
     - Group must remove one. *If S1 is removed, all lose -5 points.*  
     - *Students typically exempt S1 ("But S1 is our starting point!") → Illustrates bootstrap dilemma.*  

  7. **Round 7 (Cascading Contradictions):**  
     - Draw **S4** (Seleucid agents). Apply **S9’s filter** (rejects king-centric sources) → Fails → **Rejected.**  
     - *All lose -2 points.*  
     - *Timeline now unstable: S1, S9, and S8 cannot coexist without contradiction.*  

  8. **Round 8 (Narrative Collapse):**  
     - Draw **S10** (lamp accident). Apply **S8’s filter** (rejects fire without ash evidence) → **Rejected.**  
     - *Final timeline contradictions force removal of all cards except S9. Total collapse: No coherent event remains.*  
     - *Point penalties accumulate; most students end with negative scores.*  

  ---

  ### **Structured Debrief**  
  **Duration:** 20 minutes.  
  1. **Narrative Collapse Recap:**  
     - "When did your timeline unravel? Why did you exempt S1 despite later criteria invalidating it?"  
     - *Key insight: Criteria from testimony (e.g., S9’s filter) judged new testimony (S3/S4) but spared foundational testimony (S1), creating circularity.*  

  2. **Historical Analogy Mapping:**  
     - **Round 1-2:** *Herodotus*—Baseline testimony accepted uncritically.  
     - **Round 3-4:** *Thucydides*—Criteria emerge (e.g., rejecting "mythical" causes), but derive from testimony.  
     - **Round 5-6:** *Leopold von Ranke*—Rigorous filters applied, threatening to erase evidence (e.g., S1 exempted as "archival bedrock").  
     - **Round 7-8:** *Postmodern archival theory*—Reflexivity exposes circularity; narrative collapses without external validation.  

  3. **The Bootstrap Problem:**  
     - "You derived filters *from* testimony (S9) to judge *other* testimony (S3). Consistent application erased your timeline. Yet exempting S1 was necessary—otherwise, you had no starting point. **This is the bootstrap trap:** Criteria and evidence are co-dependent."  

  4. **Limitation of the Simulation:**  
     - "This exercise *cannot* replicate the material absence of the archive itself. In reality, the Archive of Eridu is gone—we have only testimony about its destruction. You judged representations, not the event. I must emphasize: **Actual historical distance means we lack the ‘thing-in-itself’ to resolve circularity.**"  

  5. **Philosophical Reflection:**  
     - "How do we avoid total skepticism? Do exemptions (like S1) undermine criticism? Is coherence a reliable guide to truth?"  

  ---

  ### **Instructor Notes**  
  - **Card Order:** Use the sequence above to ensure filters reflexively target early testimony.  
  - **Role Rotation:** Assign two students as "Archivists" (argue for card admission) and two as "Curators" (argue for filter application) per round; rotate roles to involve all.  
  - **Symbolic Incentives:** Points penalize contradictions (-5) and reward coherence (+2), making collapse visceral.  
  - **Time Management:** Strictly enforce round timers. If the collapse occurs early, proceed to debrief.  
  - **Core Takeaway:** Students feel the paradox—rigorous criticism erodes its own foundation—before explicitly discussing it.
