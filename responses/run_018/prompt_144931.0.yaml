  Summary of the exercise:

  - 8 students, each will be advocate for 1-2 cards.
  - 10 source cards (content as above), in a fixed order: S1, S9, S3, S2, S4, S10, S6, S8, S5, S7.
  - Rules:
     1. First card: admitted without filter.
     2. Subsequent cards: if there is at least one admitted card with a critical filter, choose one filter and apply it to the new card. If it fails, reject it (everyone -1). If it passes, admit it (everyone +1), then check for contradictions with admitted cards. If a contradiction is found, remove one of the conflicting cards (by group vote). The advocate of the removed card loses 3 points, and every student (including the advocate) loses 1 point.
     3. If there is no filter available, admit without filter (everyone +1), then check for contradictions and resolve as above.
  - Points: start at 10. Track with a scoreboard.

