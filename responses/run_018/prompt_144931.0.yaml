   7. S6: "Dating error: 311 BCE." and filter: "source that uses 312 BCE without acknowledging calendrical error is unreliable."
      Apply filter: S9's filter. 
      S6 doesn't attribute to any human actors -> passes -> admitted.
      Contradiction: S6 says 311, S1 and S9 say 312. Remove one set.

      This is the critical point. If they remove S6, they keep the foundation. If they remove S1 and S9, they lose the foundation and also the filter from S9.

      Suppose they remove S6.

   8. S8: "No ash layer -> no fire." and filter: "source that claims fire without archaeology is unreliable."
