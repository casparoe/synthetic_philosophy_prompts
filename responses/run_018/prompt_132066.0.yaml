  - **Indistinguishable leaves**: CDT under "algorithm" (4a) and "live mental state" (4c) collapse to the same stance (two-boxing). Same for EDT (4b/4d; one-boxing). The algorithm/live split doesn’t change the outcome—only the causal/evidential split matters classically.  
