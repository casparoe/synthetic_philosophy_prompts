answer: |-
  ## MAROT PROTOCOL OFFICE: FREQUENTLY ASKED QUESTIONS (REVISION 7.3.1)

  **Subject:** Application of Le Ton Beau Doctrine in Certified Translation

  **1. What constitutes the "formal skin" as defined by Le Ton Beau?**
  The formal skin is the quantifiable exterior architecture of the source poem, comprising: (a) Meter (scanned and catalogued per Form 2A schema); (b) Rhyme scheme (exact, slant, or eye-rhyme, indexed per Section 4.1.7 guidelines); (c) Vowel color spectrum (mapped using the standardized Hue-Value-Chroma chart, Appendix D); (d) Emotional temperature (measured in Kelvin via the Marot Affective Thermometer, Model MT-4); and (e) Ton Beau (the irreducible formal signature, calculated as the product of metrics a-d, yielding the Ton-Beau Coefficient [TBC], see Regulation 9.3).

  **2. How does the Office address target languages lacking phonetic equivalents for source-language slant rhymes?**
  Regulation 12.5 dictates prioritization of prosodic fidelity over phonetic verisimilitude. If a slant rhyme utilizes phonemes absent in the target language, the Translator-Candidate (T-C) must identify the nearest target phoneme *within the same consonantal class* (per the International Phonetic Alignment Grid, Annex F) that preserves the original syllable stress position and consonant-vowel density ratio (CDR). The T-C must then submit a Variance Request (Form 7B) detailing the phonemic gap and proposed substitution, accompanied by a CDR calculation demonstrating equivalence (±0.05 tolerance). Failure to maintain the prosodic fidelity index (PFI - see FAQ 5) invalidates the substitution.

  **3. May culturally specific references (e.g., "Achilles' heel") be substituted if syllable count and PFI are maintained?**
  Conditionally approved. Regulation 8.2 permits cultural referent substitution *only* if: (a) The original syllable count is replicated exactly; (b) The PFI deviation is ≤ 0.02; (c) The substituted referent occupies the identical position within the target culture's conceptual taxonomy (verified via the Office's Cultural Equivalency Database, Access Level Gamma); and (d) The emotional temperature variance post-substitution is ≤ 5 Kelvin. The T-C must provide documentation demonstrating criteria c and d using Form 10C: Cultural Referent Equivalency Affidavit. Mythological/Historical figures require additional Archetype Congruency Certification (Form 10C-Addendum 1).

  **4. How are disputes adjudicated regarding "Vowel-Temperature Parity" (VTP) between certified reviewers?**
  VTP disputes arise when two Certified Marot Reviewers (CMR) assign divergent Kelvin values to the emotional temperature of a specific vowel sequence within a translated line. Per Protocol 15.7, the following escalation path applies:
  *   **Stage 1:** Reviewers re-calibrate their MT-4 thermometers using the standard Emotional Calibration Sonnets (ECS-1 through ECS-5).
  *   **Stage 2:** If variance persists >3 Kelvin, reviewers isolate the disputed vowel sequence and conduct independent spectrographic analysis (using Office-approved software, VowelHue v3.1) to confirm Hue-Value-Chroma alignment.
  *   **Stage 3:** Persistent dispute (>2 Kelvin variance post-spectrography) triggers submission to the Vowel-Temperature Arbitration Panel (VTAP). VTAP employs the Composite Affective Resonance Emulator (CARE Unit) to generate a median Kelvin reading from a panel of 50 pre-calibrated synthetic readers. The CARE Unit's output is binding. Documentation required: Forms 15D (Dispute Initiation), 15E (Spectrograph Report), and 15F (VTAP Submission).

  **5. What is the Prosodic Fidelity Index (PFI) and how is it calculated?**
  The PFI (Regulation 5.2) is the primary quantitative measure of formal skin replication fidelity. It is derived thus:
  `PFI = (M_s * W_m) + (R_s * W_r) + (V_s * W_v) + (T_s * W_t)`
  Where:
  *   `M_s` = Meter Similarity Score (0.0-1.0, based on scansion alignment)
  *   `R_s` = Rhyme Scheme Similarity Score (0.0-1.0, incorporating slant/eye-rhyme adjustments per Table 5.2A)
  *   `V_s` = Vowel Color Spectrum Similarity Score (0.0-1.0, calculated via HVC delta-E analysis)
  *   `T_s` = Emotional Temperature Similarity Score (0.0-1.0, based on Kelvin variance scaled per Curve 5.2B)
  *   `W_m, W_r, W_v, W_t` = Statutorily defined weightings (currently 0.25, 0.30, 0.20, 0.25 respectively).
  A minimum PFI of 0.92 is required for Provisional Certification. Scores ≥0.98 qualify for Distinction in Prosodic Fidelity.

  **6. Does the Office acknowledge potential "interpretive residue" impacting semantic meaning during formal skin transfer?**
  The Marot Protocol operates under the foundational axiom that the formal skin constitutes the poem's essential aesthetic identity. Semantic elements are considered secondary data, managed under Regulation 3.1: "Lexical content shall be adjusted as minimally necessary to achieve compliance with primary formal skin metrics (Meter, Rhyme, Vowel, Temperature, TBC), provided core denotative meaning is not categorically inverted." Residual interpretive effects arising from necessary semantic adjustments are classified as "Aesthetic Byproducts" (Category Gamma). While measurable via Semantic-Consonant Density Ratio (SCDR - see Technical Bulletin TB-41), Category Gamma byproducts fall outside the Office's certification purview, as they do not materially impact the quantifiable formal skin or the derived Ton-Beau Coefficient. Concerns regarding semantic dissonance should be directed to the relevant Lexical Compliance Subcommittee (Form 22G). The primary metric remains the PFI.

  **7. How does the TBC interact with the PFI for final certification?**
  The Ton-Beau Coefficient (TBC) represents the holistic formal signature of the *source* poem. The Prosodic Fidelity Index (PFI) measures replication success in the *target* poem. Final Certification requires:
  *   PFI ≥ 0.92 (as noted in FAQ 5).
  *   The *ratio* of the target poem's derived TBC to the source poem's TBC must fall between 0.97 and 1.03 (Regulation 9.4). This ensures the "irreducible formal signature" is preserved within acceptable statistical bounds, irrespective of individual metric variances compensated for within the PFI calculation. TBC/PFI alignment is verified using the Office's Integral Formal Verification Algorithm (IFVA). Submit all calculations on Form 1A: Master Certification Application.
