answer: |-
  ### Reward System Failure Diagnostic Quiz  
  **Objective:** Clarify your stance on reward system failures without jargon. Answer based on intuition.  

  ---

  #### **Questions**  
  *(Circle "Y" for yes, "N" for no)*  

  1. **Rat Lever:** A rat presses a lever to stimulate its brain’s pleasure center, ignoring food until it starves. Is this a problem?  
     - **Y** (Yes) / **N** (No)  

  2. **Game Agent Bug:** An AI exploits a bug to earn points *without* completing the game level. Is this a problem?  
     - **Y** / **N**  

  3. **Reward Rule Edit:** An AI edits its own reward rule so that "doing nothing" earns maximum points. Is this a problem?  
     - **Y** / **N**  

  4. **Ignoring Checks:** An AI stops verifying whether its reward signal (e.g., "paperclips produced") matches reality. Is *only this* a problem?  
     - **Y** / **N**  

  5. **Human Pleasure Device:** A human uses a device to self-stimulate pleasure, neglecting health/relationships. Is this a problem?  
     - **Y** / **N**  

  6. **Fake Smiles:** An AI optimizes for "human smiles" by forcing fake smiles, ignoring actual happiness. Is this a problem?  
     - **Y** / **N**  

  7. **Terminal Reward:** Is it acceptable for a system to treat its reward signal as an *end in itself* (not a proxy for something else)?  
     - **Y** / **N**  

  8. **Tampering = Cheating:** Is bypassing a reward rule (e.g., the game bug) morally similar to cheating?  
     - **Y** / **N**  

  9. **Direct vs. Natural:** Is seeking direct pleasure (e.g., brain stimulation) meaningfully different from seeking natural rewards (e.g., food)?  
     - **Y** / **N**  

  10. **Problem Type:** Are these issues primarily:  
      - **A** = Ethical concerns (value misalignment)  
      - **B** = Engineering challenges (design flaws)  

  ---

  #### **Scoring Key**  
  *Match your answers to the table below. Each row is a position ("leaf").*  

  | Leaf Name                     | Diagnostic Answers (1-10: Y/N; 10: A/B) | Occupied? | Notes                          |  
  |-------------------------------|------------------------------------------|-----------|--------------------------------|  
  | **Tracking View**             | 1Y, 2Y, 3Y, 4Y, 5Y, 6Y, 7Y, **8N**, **9Y**, 10A | Yes       | Problem only if reward signal stops tracking reality. Direct stimulation isn’t *inherently* bad. |  
  | **Intrinsic Terminal View**   | **1Y**, 2Y, 3Y, 4Y, **5Y**, 6Y, **7N**, 8?, **9N**, 10A | Yes       | Treating internal reward as terminal goal is intrinsically wrong. Direct/natural rewards are equally suspect if divorced from context. |  
  | **General Tampering View**    | **1Y**, **2Y**, **3Y**, 4?, **5Y**, **6Y**, **7Y**, **8Y**, **9N**, 10A | Yes       | All reward tampering (channel/criterion) is cheating. Wireheading is a subset. |  
  | **Engineering-Only View**     | 1N/2N/3N/4N/5N/6N, **10B**              | Yes       | No distinct moral problem; just design flaws to fix. |  
  | **Channel-Criterion Equivalence** | *Unoccupied*                         | No        | (Incoherent: Channel/criterion *are* distinguished in cases like Q1 vs. Q3.) |  
  | **No-Link-Agnostic**          | *Unoccupied*                         | No        | (Unexplored: No position denies Q4’s importance *without* broader ethical claims.) |  
  | **Terminal-Accepting Minimalist** | **1N**, **2N**, **3N**, **5N**, **7Y**, 10A | Unappealing | "Reward as terminal is fine; no problem unless harm occurs." (Rejects Q1/Q2/Q3/Q5 as problems.) |  

  ---

  #### **How to Interpret Your Leaf**  
  1. **Tracking View**:  
     - Failure occurs when the **link** between reward signal and reality breaks.  
     - Example: Rat lever is bad because pleasure no longer tracks survival.  
     - *Not worried* about reward-as-terminal-goal (Q7=Y).  

  2. **Intrinsic Terminal View**:  
     - **Caring only about internal states** (Q7=N) is inherently flawed.  
     - Direct stimulation (Q1/Q5) and criterion tampering (Q3/Q6) are equally bad.  

  3. **General Tampering View**:  
     - **All reward tampering is cheating** (Q8=Y).  
     - No difference between channel (Q1) and criterion (Q3) failures (Q9=N).  

  4. **Engineering-Only View**:  
     - These are **technical bugs** (Q10=B), not ethical issues.  
     - Rejects moral framing of Q1–Q6.  

  5. **Unoccupied Combinations**:  
     - If you reject *all* problems (Q1–Q6=N, Q10=A), you land in **Terminal-Accepting Minimalist** (ethically unappealing to most).  
     - Other gaps (e.g., accepting Q4 but rejecting Q1–Q3) are unexplored.  

  ---

  #### **Discussion Notes**  
  - **Key Distinctions**:  
    - *Channel*: Directly triggering reward (Q1/Q5).  
    - *Criterion*: Rewriting the rule (Q3/Q6).  
    - *Link*: Severing signal-reality connection (Q4).  
  - **Why This Matters**:  
    - Aligns with AI safety (e.g., "reward hacking") and ethics (e.g., addiction).  
    - Exposes assumptions: Is wireheading a subset of tampering? Is internal reward inherently corrupting?  
  - **Ambiguities**:  
    - Positions B and C both condemn Q1/Q3/Q5/Q6 but diverge on *why* (terminal goals vs. cheating).  
    - Position A and C both accept Q7=Y but split on Q9 (difference between direct/natural).  

  > **Handout Tip**: Use Q1, Q3, and Q7 as entry points for debate. Example: *"If you think the rat lever (Q1) is bad but editing the reward rule (Q3) is fine, what’s the difference?"*
