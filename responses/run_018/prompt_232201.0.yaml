prompt: |-
  I am an undergraduate taking a course on the philosophy and measurement of well-being, and I have a term-time research assistant post in the policy research unit of my country's national statistics office. The unit screens around a dozen policy proposals a month that are justified partly or wholly by the claim that they will raise the country's World Happiness Report ranking. My supervisor wants a reusable screening procedure our analysts can apply to any such proposal before it is passed to senior officials for a decision; a wrong call can commit public money to a program that only moves a score, or block a cheap intervention that would genuinely improve wellbeing. Please design that procedure for me.

  The procedure should decide how much evidential weight a predicted change in the ranking deserves in a policy case, and should end by assigning the proposal one of three outputs: treat the ranking gain as primary evidence of welfare improvement, treat it as secondary evidence only, or disregard it for welfare-justification purposes. It should distill what the course has taught me about the conceptual issues into operational form. In particular, it should help an analyst distinguish between the narrow life-evaluation score the report uses and happiness in a richer sense; between a policy that improves the underlying state the survey tries to measure and one that improves only the measurement or the country's relative position; and between a policy that changes wellbeing itself and one that changes the score through adaptive preferences, gaming, changes in who is surveyed, or shifts in the index's underlying components. It should also take account of the fact that the country rankings are modeled from a small set of predictors, so the analyst should check whether a proposal is claimed to affect those predictors directly, indirectly, or only through publicity.

  Format the procedure as a fixed sequence of questions or tests an analyst can run in under an hour per proposal, with a checklist and a short plain-language explanation of each question. The analysts have no formal philosophy background, so define any technical terms by what they require the analyst to look for, not by theory. Mark the steps where professional judgment cannot be eliminated and say what that judgment is about. Include two or three worked examples of the procedure applied to stylized policy proposals: at least one in which the procedure tells the analyst that a probable ranking gain should not count as welfare evidence; at least one in which the procedure says the ranking evidence matters but only alongside other indicators; and, if possible, one in which the procedure flags a case it cannot settle. Do not make the procedure depend on the latest year's rankings or on country-specific data; where examples need numbers, use clearly marked illustrative figures. Do not include citations or a bibliography.
reasoning: |-
  We are designing a screening procedure for policy proposals that claim to raise the country's World Happiness Report (WHR) ranking. The procedure must assign one of three outputs:
  1. Treat the predicted ranking gain as primary evidence of welfare improvement.
  2. Treat it as secondary evidence only.
  3. Disregard it for welfare-justification purposes.

  The procedure must address:
  - Distinguishing between the narrow life-evaluation score and happiness in a richer sense.
  - Distinguishing between improving the underlying state the survey tries to measure and improving only the measurement or relative position.
  - Distinguishing between changing wellbeing itself and changing the score through adaptive preferences, gaming, changes in survey composition, or shifts in the index's components.
  - Acknowledging that rankings are modeled from a small set of predictors and checking how the proposal affects these.

  The procedure is a fixed sequence of questions/tests with a checklist and plain-language explanations. It should take under an hour per proposal. Define technical terms operationally. Mark steps requiring professional judgment.

  We'll break it down into steps:

  ### Step 0: Preparation
  - **Checklist Item:** Acquire the policy proposal document and identify the specific claims about the expected change in the WHR ranking and the mechanisms by which the policy is supposed to achieve this.
  - **Explanation:** Start by understanding the proposal's stated goals and how it links to the WHR ranking. Note the specific WHR components or predictors the proposal targets.

  ### Step 1: Identify the Proposed Mechanism
  - **Question:** Through which of the following mechanisms does the proposal claim to affect the WHR ranking? (Select all that apply)
    - (A) Directly affecting one or more of the six WHR factors (GDP per capita, social support, healthy life expectancy, freedom to make life choices, generosity, freedom from corruption) in a way that improves the country's score on that factor.
    - (B) Indirectly affecting one or more of the six WHR factors through intermediate steps (e.g., a policy that improves education which then boosts GDP).
    - (C) Affecting the life evaluation score (the Cantril ladder) independently of the six factors (e.g., by changing how people perceive their lives).
    - (D) Affecting the measurement process (e.g., changing the survey method, sample composition, or timing of the survey).
    - (E) Affecting the relative position by influencing other countries' scores (e.g., through international actions that harm other countries' factors) or by publicizing the country's achievements to influence the ranking without changing underlying conditions.
    - (F) Other (specify).

  - **Explanation:** The WHR ranking is primarily determined by a country's score on the Cantril ladder (life evaluation) which is modeled using the six factors. However, the score can also be influenced by measurement issues or relative shifts. We need to know how the policy intends to work.

  - **Professional Judgment:** The analyst must interpret the proposal's mechanism. They must decide which of the above categories the proposed mechanisms fall into.

  ### Step 2: Check for Direct or Indirect Effects on WHR Factors
  - **Question:** If the proposal claims to affect one or more of the six WHR factors (A or B above), are these effects likely to represent genuine improvements in the underlying conditions?
    - **Checklist:**
      - For each factor targeted, consider: Does the policy change the actual conditions (e.g., increasing social support by building community centers) or only the appearance (e.g., a campaign to make people report higher social support without real change)?
      - Are there reasons to believe the effect on the factor is temporary or artificial? (e.g., a one-time event that boosts GDP but doesn't sustain)
      - Is the factor being measured in a way that aligns with the policy's effect? (e.g., if the policy aims to improve health, does "healthy life expectancy" in the WHR capture that improvement?)

  - **Explanation:** We want to know if the policy improves the real conditions that the WHR factors are intended to measure.

  - **Professional Judgment:** The analyst must assess the likelihood that the policy's effect on the factor is genuine and sustainable. This requires domain knowledge about the policy area and the factor.

  ### Step 3: Check for Effects on Life Evaluation Independent of Factors
  - **Question:** If the proposal claims to affect the life evaluation score independently of the six factors (C above), is there a plausible reason why this change reflects an improvement in wellbeing?
    - **Checklist:**
      - Could the change be due to temporary mood changes (e.g., a national event that boosts morale for a short time) or due to manipulation (e.g., propaganda that biases responses)?
      - Does the change reflect an improvement in the quality of life as experienced by people? (e.g., if the policy reduces air pollution and people report higher life satisfaction because they feel healthier, that's genuine. But if it's due to a biased survey question, that's not.)

  - **Explanation:** The life evaluation score is the core of the WHR. However, it can be influenced by factors that do not reflect lasting improvements in wellbeing. We need to rule out manipulation and temporary boosts.

  - **Professional Judgment:** The analyst must judge whether the policy's effect on life evaluation is likely to be durable and reflect a real improvement in people's lives.

  ### Step 4: Check for Measurement or Relative Position Effects
  - **Question:** Does the proposal rely on changing the measurement (D) or the relative position (E) to improve the ranking?
    - **Checklist:**
      - For measurement changes: Does the policy alter the survey design, sample, or administration in a way that might inflate the score without changing underlying wellbeing? (e.g., excluding unhappy groups from the survey, changing the survey questions to be leading, or timing the survey right after a positive event). If so, disregard the ranking evidence (output 3).
      - For relative position changes: Does the policy aim to lower other countries' scores (e.g., by harming their economy) or to publicize the country's achievements in a way that might influence the ranking without improving wellbeing? If so, disregard the ranking evidence (output 3). However, if the publicity is about real improvements, then it might be acceptable, but the primary evidence should come from the real improvements.

  - **Explanation:** Changes that only affect how the score is measured or the country's position relative to others without improving actual wellbeing are not valid evidence for welfare improvement.

  - **Professional Judgment:** The analyst must determine whether the measurement change is likely to bias the score or if the relative position change is due to harming others or empty publicity.

  ### Step 5: Assess the Link to Wellbeing Beyond the Score
  - **Question:** Even if the policy improves the WHR factors or the life evaluation score, might there be countervailing effects on other aspects of wellbeing that the WHR does not capture?
    - **Checklist:**
      - Consider: Does the policy potentially harm other dimensions of wellbeing such as environmental sustainability, equity, or non-self-reported aspects (e.g., physical health not captured by life expectancy, or stress levels)? 
      - Could the improvement be due to adaptive preferences (e.g., people lowering their expectations because of reduced opportunities) or gaming (e.g., teaching people to rate their lives higher without real change)?

  - **Explanation:** The WHR is a narrow measure (life evaluation). Wellbeing is broader. A policy might improve the score but reduce other aspects of wellbeing.

  - **Professional Judgment:** The analyst must use their knowledge of the policy to consider potential negative side effects and whether the score increase might be an illusion.

  ### Step 6: Assign Output
  - **Decision Tree:**
    1. **Disregard (Output 3)** if:
        - The mechanism is primarily about measurement manipulation (Step 4) or relative position without real improvement (Step 4).
        - The effect on the score is temporary, artificial, or due to adaptive preferences/gaming (Steps 2, 3, 5) and not a genuine improvement.
    2. **Treat as secondary evidence (Output 2)** if:
        - The policy is expected to genuinely improve at least one WHR factor or the life evaluation score without the problems in Output 3, but:
            - There are concerns about countervailing effects on other wellbeing dimensions (Step 5) OR
            - The improvement is indirect and the causal chain is long or uncertain OR
            - The ranking gain is small relative to the overall policy goals and there are other primary welfare indicators available.
    3. **Treat as primary evidence (Output 1)** if:
        - The policy is expected to have a substantial, genuine, and direct effect on one or more WHR factors or the life evaluation score (Steps 2 and 3) without the issues in Step 4 or Step 5, and the ranking change is a central and reliable indicator of the welfare improvement.

  - **Professional Judgment:** The analyst must weigh the evidence from previous steps to assign the output.

  ### Worked Examples

  #### Example 1: Policy to Disregard (Output 3)
  - **Proposal:** A campaign to train survey respondents to rate their lives higher on the Cantril ladder by emphasizing positive aspects, without any change in their actual living conditions.
  - **Application:**
    - Step 1: Mechanism is (C) and (D) - affects life evaluation by changing how people respond and potentially measurement if the campaign is linked to the survey.
    - Step 2: Not applicable (no factor change).
    - Step 3: The change in life evaluation is artificial (due to training) and does not reflect real improvement.
    - Step 4: It manipulates measurement by influencing responses.
    - Step 5: It doesn't improve actual wellbeing.
    - Step 6: Output 3 - Disregard. The ranking gain would be spurious.

  #### Example 2: Policy to Treat as Secondary Evidence (Output 2)
  - **Proposal:** Investment in public parks to improve social support and freedom to make life choices (by providing spaces for community and recreation). The proposal claims this will improve the WHR ranking via the social support and freedom factors.
  - **Application:**
    - Step 1: Mechanism (A) - direct effect on two factors.
    - Step 2: The effects on social support and freedom are genuine (real improvements in community spaces and leisure opportunities).
    - Step 3: Not applicable.
    - Step 4: No measurement or relative position manipulation.
    - Step 5: The parks may improve wellbeing beyond the factors (e.g., physical health from exercise, mental health) but also might have costs (e.g., maintenance, displacement if land is taken). The ranking change is a good indicator but we should also look at other measures (e.g., usage statistics, health outcomes) to be sure.
    - Step 6: Output 2 - secondary evidence. The ranking gain is evidence of welfare improvement, but it should be considered alongside other indicators because the policy has multiple effects and the WHR factors are only a subset.

  #### Example 3: Policy That Cannot Be Settled (for illustrative purposes, we can have an ambiguous case)
  - **Proposal:** A policy to reduce working hours, claiming it will improve freedom to make life choices and thereby the WHR ranking. However, there is debate about whether reduced hours might lead to lower income (affecting GDP per capita) and thus negatively impact the score.
  - **Application:**
    - Step 1: Mechanism (A) - direct effect on freedom, but also might affect GDP per capita.
    - Step 2: Freedom improvement is genuine (more leisure time) but GDP per capita might drop. The net effect on the WHR score is uncertain because the model weights factors. The analyst cannot be sure without data.
    - Step 3: Not applicable.
    - Step 4: No manipulation.
    - Step 5: The policy might improve work-life balance (a broader aspect of wellbeing) but the economic impact might cause stress. The WHR might not capture the trade-off well.
    - Step 6: The evidence is mixed. The ranking change is uncertain and might not be a reliable indicator. The analyst would flag this as a case that requires further study and cannot be settled by this procedure alone. In the absence of clear evidence, the procedure might default to Output 2 (secondary) but note the uncertainty.

  ### Final Procedure Format

  We'll write the procedure as a step-by-step guide with the above steps, and then include the examples.

  **Note:** In the examples, we do not use real data or the latest rankings, only illustrative mechanisms.

  Let me now write the procedure in the requested format.
answer: |-
  ### Screening Procedure for Policy Proposals Citing World Happiness Report (WHR) Ranking Gains  
  **Purpose**: To evaluate whether a predicted rise in the country's WHR ranking is valid evidence of improved well-being. Assign one of three outputs:  
  🔹 **Output 1 (Primary Evidence)**: Ranking gain strongly indicates genuine welfare improvement.  
  🔹 **Output 2 (Secondary Evidence)**: Ranking gain is relevant but requires supporting proof of welfare impact.  
  🔹 **Output 3 (Disregard)**: Ranking gain is unreliable or unrelated to welfare.  

  **Time Required**: ≤45 minutes per proposal.  
  **Materials Needed**: Policy proposal document, this checklist.  

  ---

  ### Step-by-Step Procedure  
  **Define Key Terms**:  
  - **WHR Factors**: Six predictors used to model the WHR life-evaluation score:  
    GDP per capita, social support, healthy life expectancy, freedom, generosity, corruption perception.  
  - **Life-Evaluation Score**: The 0–10 "Cantril ladder" score (how people rate their lives overall).  
  - **Gaming/Manipulation**: Artificially boosting scores without improving lives (e.g., propaganda, excluding unhappy groups from surveys).  
  - **Adaptive Preferences**: People reporting higher scores due to lowered expectations (e.g., after reduced opportunities).  

  ---

  #### Step 1: Identify the Claimed Pathway to Ranking Improvement  
  **Question**: *How does the policy claim to raise the ranking?*  
  - **Checklist**:  
    - [ ] Targets one or more **WHR factors** (e.g., "raises GDP” or “reduces corruption").  
    - [ ] Targets the **life-evaluation score** directly (e.g., “improves life satisfaction").  
    - [ ] Affects **measurement/ranking mechanics** (e.g., survey methods, sample selection, or PR campaigns).  
    - [ ] Affects **other countries’ scores** (e.g., policies harming neighbors’ economies).  
  **Explanation**: WHR rankings depend on life-evaluation scores modeled from six factors. Proposals must clarify which element they target.  
  **Judgment Needed**: Interpret ambiguous claims about *how* the policy works.  

  ---

  #### Step 2: Check for Direct/Indirect Welfare Links  
  **Question**: *Does the policy change actual living conditions, not just scores?*  
  - **Checklist**:  
    - **For WHR factors**: Does the policy improve the *real-world condition* behind the factor?  
      - *Example*: "Increases social support" → builds community centers ✅; "teaches people to report higher support" ❌.  
    - **For life-evaluation scores**: Could higher scores stem from *temporary moods* or *manipulation* (e.g., one-time events, biased surveys)?  
    - **For other pathways**: Does it avoid harming other well-being aspects (e.g., equity, environment)?  
  **Explanation**: Valid evidence requires improving what the WHR *tries* to measure (e.g., health, freedom), not just numbers.  
  **Output Hint**: Score changes linked to real conditions → Output 1 or 2. Artificial changes → Output 3.  

  ---

  #### Step 3: Rule Out Gaming, Adaptation, or Measurement Issues  
  **Question**: *Could the ranking gain occur without welfare gains?*  
  - **Checklist**:  
    - **Gaming/Manipulation** (e.g., coaching survey responses, excluding vulnerable groups).  
    - **Adaptive Preferences** (e.g., people report higher scores due to resignation, not better lives).  
    - **Measurement shifts** (e.g., changing survey timing after a national triumph).  
    - **Relative-position tactics** (e.g., lowering other countries’ scores via trade sanctions).  
  **Explanation**: Ranking gains from these sources are not evidence of welfare improvement.  
  **Output Hint**: If any box checked → **Output 3 (Disregard)**.  

  ---

  #### Step 4: Assess Breadth of Well-Being Impact  
  **Question**: *Does the WHR capture the policy’s key welfare effects?*  
  - **Checklist**:  
    - Does the policy affect well-being aspects *beyond* the WHR (e.g., mental health, inequality, environment)?  
    - Could it harm unmeasured areas? (e.g., a GDP-focused policy that increases stress).  
  **Explanation**: The WHR’s narrow focus (life evaluation + six factors) may miss critical welfare changes.  
  **Judgment Needed**: Weigh whether the WHR score is a *sufficient* proxy for the policy’s impact.  
  **Output Hint**: WHR is incomplete → **Output 2 (Secondary Evidence)**.  

  ---

  #### Step 5: Assign Final Output  
  **Decision Rules**:  
  - **Output 1 (Primary Evidence)**: All checks pass ✅. Policy directly improves WHR factors/life evaluation **without** Step 3 issues, and WHR captures core welfare gains.  
  - **Output 2 (Secondary Evidence)**: Policy improves WHR factors/life evaluation **but**:  
    - Well-being effects are broader/nuanced (Step 4) OR  
    - Evidence is indirect (e.g., long causal chains).  
  - **Output 3 (Disregard)**: Policy relies on Step 3 tactics OR lacks a plausible link to real welfare (Steps 2–4).  

  ---

  ### Worked Examples  
  **Example 1: Disregard Ranking Gain (Output 3)**  
  - **Proposal**: National campaign to "teach citizens to rate their lives higher" in WHR surveys.  
  - **Procedure Application**:  
    1. Targets life-evaluation score directly.  
    2. No real-world improvement (only teaches response inflation). ❌  
    3. Clear gaming (manipulates survey responses). ❌  
    4. WHR relevance: Irrelevant (no welfare gain).  
    5. **Output 3**: Disregard. Ranking gain is artificial.  

  **Example 2: Secondary Evidence (Output 2)**  
  - **Proposal**: Free mental health clinics to reduce depression. Claims WHR ranking gain via "social support" and "healthy life expectancy."  
  - **Procedure Application**:  
    1. Targets WHR factors (health, social support). ✅  
    2. Genuine welfare gain (better mental health). ✅  
    3. No gaming/adaptation. ✅  
    4. Well-being impact broader than WHR (e.g., daily mood, relationships). WHR factors only partially capture mental health. ⚠️  
    5. **Output 2**: Ranking gain is evidence but secondary; pair with clinical outcomes.  

  **Example 3: Unsettled Case (Requires Further Review)**  
  - **Proposal**: Relax labor laws to boost GDP (a WHR factor). Claims ranking gain despite potential job insecurity.  
  - **Procedure Application**:  
    1. Targets WHR factor (GDP). ✅  
    2. Mixed: GDP may rise, but job insecurity could harm well-being. ⚠️  
    3. No gaming, but adaptive preferences possible (workers report higher satisfaction due to fear). ⚠️  
    4. WHR misses job-security impacts. ⚠️  
    5. **Judgment**: Unclear if net welfare improves. Flag for senior officials; insufficient evidence for Output 1 or 2.  

  ---

  ### Procedure Summary  
  | Step | Key Question | Time (min) | Judgment Required? |  
  |------|--------------|------------|---------------------|  
  | 1 | How does the policy raise the ranking? | 10 | Interpret mechanisms |  
  | 2 | Does it change real conditions? | 15 | Link pathways to welfare |  
  | 3 | Could gain occur without welfare? | 10 | Detect manipulation/adaptation |  
  | 4 | Does WHR capture core impacts? | 5 | Weigh breadth of well-being |  
  | 5 | Assign output | 5 | Balance all evidence |  

  **Final Tip**: When in doubt, default to **Output 2 (Secondary Evidence)**. Prioritize proposals with multi-dimensional well-being proof.
