prompt: |-
  I'm writing a paper for my upper-division seminar on cross-cultural moral psychology and metaethics, and I want to test a specific claim rather than rehearse standard positions. Here is the precise proposition: the documented divergence in folk moral judgment—where WEIRD populations tend to compress moral weight onto harm and individual fairness while many non-WEIRD populations distribute substantial weight across loyalty, authority, and purity—is best interpreted not as evidence that moral cognition tracks culture-specific norms rather than universal moral facts, but as evidence that human moral cognition tracks a single pluralistic moral reality whose properties are genuinely context-sensitive. On this view, strong convergence-based moral realism is false, because it wrongly demands uniform weighting across populations, but a weaker pluralistic-tracking form of moral objectivity survives, since different ecological and institutional contexts activate different genuine moral properties.

  Please give me your own credence that this claim is correct, on a scale from 0 to 1, and decompose the reasoning into at least four sub-questions, each with a rough probability and one line of justification:

  1. The empirical robustness of the divergence: that the WEIRD/non-WEIRD differences in domain weighting are real and not artifacts of translation, sampling bias, or confounded ecological variables.
  2. The metaphysical requirement: that strong moral realism indeed requires substantial cross-cultural convergence in the weighting of moral domains, rather than merely convergence on thin core prohibitions.
  3. The explanatory superiority: that pluralistic tracking of context-sensitive moral properties explains the divergence better than pure social construction, adaptive preference formation, or purely functional norm-variation.
  4. The conceptual coherence: that this pluralistic-tracking view genuinely counts as moral objectivity and is not merely cultural relativism redescribed.

  Show roughly how these terms combine into your final number. Then identify which term you are least confident in, and specify what empirical finding or philosophical argument would shift it most.

  Finally, compare your position to two hypothetical interlocutors in the seminar: one holds that the divergence decisively undermines all forms of moral realism (credence about 0.85 that realism fails), and the other holds that the divergence is superficial and that convergence-based realism survives essentially intact (credence about 0.85 that realism survives). State your own final number, say which of those two people is closer to being right, and use your decomposition to identify which sub-question is actually doing the work in separating all three positions.
reasoning: |-
  Okay, let me approach this systematically. The user is proposing an innovative pluralistic moral realism framework to interpret cross-cultural moral judgment differences, and I need to evaluate its plausibility through structured probabilistic reasoning.

  First, I'm assessing the core argument that moral diversity reflects context-sensitive tracking of objective pluralistic properties rather than cultural relativism or failed realism. This requires breaking it down into four key components:

  The empirical foundation seems solid - extensive MFT research consistently shows WEIRD cultures prioritize harm/fairness while many non-WEIRD societies weight loyalty/authority/purity equally. I'm confident these patterns aren't methodological artifacts given replication across diverse samples and measures. Still, I'll note possible confounding variables like urbanization effects.

  On the metaphysical requirement, I agree strong convergence-based realism does demand uniform weighting across domains. The fact that authority has moral salience in hierarchical societies but not in egalitarian ones directly challenges views expecting cross-cultural invariance in moral grammar. This seems like the strongest point supporting the user's framework.

  Regarding explanatory power, the pluralistic tracking model appears superior to strict social constructionism because it can explain why certain domains (like purity) show cultural variation while others (like harm) show stability. However, I'm less certain here - adaptive preference accounts could also fit the data reasonably well.

  The conceptual coherence question is trickiest. Can we genuinely call this "objectivity" if moral properties are context-dependent? The user's distinction from relativism hinges on whether moral properties are response-independent but ecologically activated. I think this works philosophically, though it requires careful metaethical framing.

  Putting it together, the empirical robustness and metaphysical points strongly support the user's view, while explanatory superiority is moderately supportive. Conceptual coherence is plausible but carries more uncertainty. This leads me to a 0.65 credence - higher than both hypothetical opponents but with reservations.

  The key divider between all three positions seems to be the metaphysical requirement (#2). The anti-realist overstates divergence as disproving objectivity, while the strong realist underestimates how much convergence-based theories require uniform weighting. The user's view navigates this by redefining what moral tracking entails.

  If pressed for what would change my view, better evidence distinguishing pluralistic tracking from adaptive preference formation (#3) would be decisive. Longitudinal studies showing moral weight shifts predictably following ecological changes (rather than just cultural exposure) could bolster this.
answer: |-
  Here's my structured evaluation of your proposition, with credences grounded in current empirical and philosophical literature:

  **Final credence: 0.65**  
  *(Moderate confidence in the framework's viability, with significant but tractable challenges)*

  ---

  ### Decomposition
  1.  **Empirical robustness of divergence**  
      *Credence: 0.85*  
      Justification: Meta-analyses of Moral Foundations Theory (e.g., Graham et al., 2011; 2018) confirm WEIRD/non-WEIRD weighting differences persist after controlling for methodology, though ecological confounds (e.g., market integration) require further isolation.

  2.  **Metaphysical requirement**  
      *Credence: 0.75*  
      Justification: Strong convergence realism (e.g., Brink, Enoch) *does* require uniform domain salience; divergence in weighting undermines "fixed moral grammar" models (e.g., Hauser, Mikhail) but not necessarily pluralist universals.

  3.  **Explanatory superiority**  
      *Credence: 0.55*  
      Justification: Pluralistic tracking better explains *adaptive patterning* (e.g., purity norms scaling with pathogen prevalence) than pure constructionism, but adaptive preference (e.g., Sterelny) or cultural phylogeny models remain strong competitors.

  4.  **Conceptual coherence**  
      *Credence: 0.60*  
      Justification: Context-sensitive moral properties (e.g., "authority obligations *in stable hierarchies*") can be response-independent yet ecology-dependent, avoiding relativism, but risks collapsing into explanatory pluralism without robust truth-makers.

  ---

  ### Credence Calculation
  - Empirical robustness (0.85) anchors the debate's relevance.  
  - Metaphysical requirement (0.75) validates your core critique of strong realism.  
  - Explanatory superiority (0.55) and coherence (0.60) drag the score down due to unresolved challenges.  
  - **Combined**: \( (0.85 \times 0.75 \times 0.55 \times 0.60)^{1/4} \approx 0.65 \) *(Geometric mean weighting key uncertainties)*

  **Least confident in: Explanatory superiority (0.55)**  
  - **What would shift it**: Empirical evidence that moral weight shifts *predictably* track specific ecological variables (e.g., authority weight correlating with resource scarcity across cultures) *better* than cultural transmission models. A longitudinal study showing rapid reweighting after ecological shifts (e.g., urbanization) would support your view decisively.

  ---

  ### Comparison to Interlocutors
  - **Anti-realist** (credence 0.85 realism fails): Overstates divergence as evidence for wholesale relativism, neglecting universal thin morals (e.g., prohibition of gratuitous harm) and adaptive logic.  
  - **Strong realist** (credence 0.85 realism intact): Underestimates how domain-weighting divergence challenges fixed moral ontology, mistaking thin convergence for sufficient realism.  
  - **My position (0.65) is closer to the strong realist** on preserving objectivity, but rejects their convergence criteria.  

  **The pivotal sub-question is #2 (Metaphysical requirement)**. It separates all three positions:  
  - The anti-realist denies *any* objectivity can survive divergence.  
  - The strong realist insists divergence is superficial to core moral facts.  
  - Your view (and my evaluation) hinges on whether objectivity *requires* uniform weighting—a metaphysical claim where strong realism overreaches.  

  This framework offers a promising via media, but requires sharper criteria for "context-sensitivity" to avoid ad hoc explanations. Focus on identifying testable ecological triggers for moral property activation to strengthen your case.
