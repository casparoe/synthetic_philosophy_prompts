  Please argue that Al-Ghazālī's occasionalist denial of necessary causal connections between created things, if reconstructed in purely epistemic terms without theological premises, provides a more coherent framework for evaluating clinical-trial efficacy than the standard view that observed correlations reveal metaphysical causal powers. Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating of the question. This has become personally relevant since I recently joined an institutional review board for biomedical trials, where we routinely attribute therapeutic outcomes to drugs despite profound opacity about underlying biological mechanisms; I want to know whether occasionalism, stripped of divine-agency premises, can be turned into a rigorous defense of the claim that medical causal attributions are essentially predictive habits rather than discoveries of necessary connections, and exactly where that reconstructed argument succeeds or collapses.
