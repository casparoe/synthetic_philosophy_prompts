  First, I need to unpack the core concepts. Diachronic identity here means the idea that a cohort remains "the same" group over decades, carrying essential traits. The lifecycle effect refers to predictable shifts in behaviour as people age—like becoming more conservative or changing spending habits. If cohorts are treated as real entities with fixed properties, but members keep evolving, that's problematic. The paradox emerges because the label sticks while the people change, making "essential characteristics" either inaccurate (if based on youth) or contradictory (if based on later life). 

