  ---

  #### **Node 2: Turing Inversion (Cognitive Competence)**  
  *Consider a computer that passes the Turing Test: its behavior is indistinguishable from a human’s in open-ended conversation. Do you accept that this establishes genuine cognitive competence (e.g., answering questions, solving puzzles) even if the system’s internal operations lack semantic understanding (i.e., no states "grasp" meaning, truth, or reference)?*  
  - **Yes (T+):** Proceed to Node 3 if you answered D+ or D- (unless D- and T- both apply).  
  - **No (T-):** Proceed to Node 3 if you answered D+ or D- (unless D- and T- both apply).  
  - **If D- and T-:** You reach **Rejectionist View (RV)**. Stop.  
    *(T+ affirms Turing’s inversion; T- denies it, reducing competence to behavioral "simulacrum" requiring internal semantics.)*  

  ---

  #### **Node 3: Analogy of Mechanisms**  
  *Are Darwinian selection (acting on phenotypes) and Turing-style computation (e.g., algorithmic symbol manipulation tested via interaction) analogous in achieving competence without comprehension? Both substitute external selection pressures (environmental fitness or interactive testing) for internal comprehension. Or is there an asymmetry—e.g., does evolution generate original teleology (intrinsic purposiveness), while computation only produces derived/imitated competence?*  
  - **Symmetric (A+):** Mechanisms are analogous; both are "blind" processes.  
  - **Asymmetric (A-):** Mechanisms are distinct; one creates original teleology, the other does not.  

  ---

  ### **Leaves (Final Positions)**  

  1. **D+ and T- and A-:**  
     **Pure Evolutionary Inversion (PEI)**  
     *You accept Darwin’s inversion: natural selection produces original functional teleology (e.g., the eye’s design) without comprehension. But you reject Turing’s: passing the imitation game yields only behavioral simulacrum, not true cognitive competence. Evolution’s teleology is foundational; computation’s performance is hollow.*  

  2. **D- and T+ and A+:**  
     **Pure Functionalist Inversion (PFI)**  
     *You accept Turing’s inversion: behavioral indistinguishability establishes cognitive competence without internal semantics. But you are skeptical of Darwin’s explanatory reach: natural selection alone cannot explain biological competence (e.g., the eye) without appeal to additional factors (e.g., laws, emergence, or residual intentionality). The mechanisms are analogous, but evolution’s competence is suspect.*  

  3. **D+ and T+ and A+:**  
     **Unified Inversion View (UIV)**  
     *You accept both inversions as structurally analogous. Darwinian selection and Turing computation both achieve competence without comprehension via external selection histories (environmental fitness or interactive testing). Functional design and cognitive intelligence emerge from mindless processes.*  

  4. **D- and T-:**  
     **Rejectionist View (RV)**  
     *You reject both inversions. Darwin explains away apparent design but does not account for genuine functional competence—it requires unstated teleology. Turing confuses behavioral correlation with cognitive achievement; passing the test demonstrates simulation, not understanding. Comprehension is inescapable.*  

  5. **D- and T+ and A-:**  
     **Hybrid View (HV)**  
     *You accept Turing’s inversion (cognitive competence without comprehension) but deny Darwin’s, insisting evolutionary competence requires minimal biological intentionality (e.g., goal-directedness in genes or cells). Computation achieves "derived" competence; evolution’s teleology is original and intentional. This position is **logically permitted but unoccupied** (diagnosis below).*  

  ---

  ### **Unoccupied Combinations and Diagnostics**  
  - **Hybrid View (HV: D- T+ A-)** is **unstable and unattractive**, not incoherent.  
    - *Why unattractive?* It asymmetrically grants computation a "comprehension-free" route to competence but denies it to evolution, despite both relying on selectionist mechanisms. This demands ad hoc justifications (e.g., "biological intentionality") that violate parsimony and the entry commitment’s spirit. No major school defends it; it is likely a theoretical blind spot.  
  - **Other Unoccupied Combinations:**  
    - **D+ and T- and A+:** *Skeptical Analogy.* Accepts Darwin’s inversion and the analogy but rejects Turing’s test as sufficient for competence (e.g., due to syntax/semantics gaps). **Rare but coherent**; ruled in by logic but unmotivated (no prominent defenders).  
    - **D+ and T+ and A-:** *Asymmetric Dual Inversion.* Accepts both inversions but denies analogy (e.g., evolution has original teleology; computation has derived competence). **Logically permitted** but underexplored; potentially motivated by biological exceptionalism.  

  ---

  ### **Failure of Separation**  
  - **PEI (D+ T- A-)** and **UIV (D+ T+ A+)** are cleanly separated by Node 2 (Turing Inversion).  
  - **RV (D- T-)** is isolated by Node 2.  
  - **No convergence:** All leaves are distinct. The tree successfully discriminates positions using concrete cases.  

  ---

  **Instructions for Use:**  
  Answer each node based on first-principles reasoning about the cases. Do not reference philosophical labels (e.g., "teleosemantics" or "functionalism"). The tree isolates commitments through empirical verdicts (e.g., "Does the eye’s function require comprehension?"). Positions emerge from combinatorial consistency.
