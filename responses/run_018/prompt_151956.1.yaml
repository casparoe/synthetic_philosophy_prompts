answer: |-
  The proportionality requirement in South Africa's TRC reveals profound philosophical tensions in transitional justice, centering on three interrelated commitments:

  ### Core Philosophical Commitments
  1. **Political Violence as Morally Distinct**  
     The gate presupposes that acts committed *for collective political purposes* inhabit a different moral universe than identical acts driven by personal motives. This implies:
     - Political goals can *conditionally elevate* acts from common criminality to potentially justifiable (or at least amnesty-worthy) political agency.
     - Collective struggle creates a context where moral evaluation requires weighing acts against broader historical imperatives.

  2. **Instrumental Reasoning with Communitarian Constraints**  
     The model demands *consequentialist calculation* (weighing harm caused against political objectives) but within strict boundaries:
     - **Anti-Utilitarianism:** Rejects pure ends-justify-means logic by requiring *necessity* and *minimal force*.
     - **Communitarian Framework:** Collective goals must align with liberation struggle ethics – apartheid's inherently unjust goals could never satisfy proportionality.
     - **Rights as Constraints:** Harm to individuals isn't merely "outweighed" but must be the *absolute minimum* required for the political aim.

  3. **Deontological Hybrid Reconstruction**  
     While grounded in instrumental reasoning, it *can* be partially reconciled with deontology through:
     - **Moral Taxonomy Shift:** Political motivation transforms the act's *category* (e.g., killing as "act of war" vs. "murder") rather than its inherent wrongness.
     - **Agent-Centric Evaluation:** Focuses on the *perpetrator's moral position* – their guilt may be mitigated by adherence to resistance ethics, even if the victim's experience remains absolute.
     - **Dual-Aspect Theory:** Separates the *objective wrong* (inviolable victim perspective) from *subjective culpability* (context-dependent perpetrator perspective).

  ### Internal Contradiction: Victims vs. Perpetrators
  The tension you identify is fundamental:

  - **For Victims:** Suffering is *non-fungible* and *incommensurable*. No political calculus diminishes the absolute wrong done *to them*. This reflects deontological inviolability of persons.
    
  - **For Perpetrators:** Amnesty requires proving their acts were *proportionate instruments* of political struggle. This demands consequentialist reasoning – evaluating whether the harm *was justified by* (or at least not excessive for) the goal.

  ### Resolution within TRC's Framework
  The TRC navigated this through **asymmetrical moral reasoning**:
  1. **Victim Suffering:** Remains ontologically absolute. No "greater good" negates their experience (deontological core).
  2. **Perpetrator Accountability:** Evaluated through *political ethics of resistance*. Proportionality here serves as:
     - A filter for *sincerity* (separating freedom fighters from opportunists)
     - A *limiting principle* on political violence ("Was this bomb/assassination *necessary* for liberation?")
  3. **Non-Equivalence:** Rejecting proportionality *for victims* denies any moral balancing of their suffering. Applying it *to perpetrators* assesses whether their violence adhered to norms of *just resistance* – not whether it "balanced out."

  ### Philosophical Coherence?
  The model holds *procedural coherence* if understood as:
  - **Atonement Contract:** Amnesty wasn't "forgiveness" but conditional exchange: full disclosure + ethical restraint for legal impunity.
  - **Anti-Nihilism:** Rejecting Argentina's pure punishment model and Rwanda's utilitarian gradualism, it acknowledged political context *without relativizing evil*.
  - **Tutu's Theology of Ubuntu:** Rooted in African communitarianism, suffering is absolute *yet* reconciliation requires understanding motives to restore societal harmony.

  **Conclusion:** The proportionality gate commits to a hybrid ethic where political purpose *alters culpability but not intrinsic wrongness*. It demands instrumental reasoning from perpetrators while denying its applicability to victims' experiences – a necessary paradox for navigating between vengeance and impunity. Its consistency lies not in moral symmetry, but in recognizing the *asymmetrical responsibilities* of victims (right to unconditional dignity) and perpetrators (duty to justify political violence). This reflects the TRC's core insight: transitional justice requires *simultaneously affirming incommensurable truths*.
