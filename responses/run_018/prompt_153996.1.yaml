prompt: |-
  I'm writing a paper for my social ontology course on whether generational categories—Boomers, Millennials, Gen Z, and so on—denote real kinds rather than convenient demographic bins. Rather than surveying existing literature, I want to establish the criteria first. Specify the desiderata that any adequate ontology of cohorts must satisfy: the cases it must handle correctly (for example, boundary individuals born within months of an arbitrary cutoff, "micro-cohorts" shaped by shared exposure to a discrete technological shift rather than by birth year, and cross-national divergence where the same birth years map to radically different formative conditions), the distinctions it must not collapse—particularly between statistical aggregation, marketing construct, and causally integrated kind—the empirical findings from demography and developmental psychology it must respect, and the explanatory work it must do if it is to count as more than a labeling convention. For each desideratum, state the motivating case or consideration and indicate whether it is non-negotiable or a preference of a particular camp. Then identify which single requirement does the most damage to popular "common-sense" treatments, and briefly indicate how a strict constructivist view, a birth-interval essentialist view, and an event-based cohort theory measure up against the list. Keep the weight on the criteria and their justifications; do not provide bibliographies, reading lists, or citations.
reasoning: |-
  Okay, let me tackle this user's query step by step. The user is writing a paper on whether generational categories represent real kinds or just demographic constructs. They want to establish criteria first, avoiding literature surveys. 

  First, I need to identify the core request: specifying desiderata for an ontology of cohorts. The user mentions several key cases - boundary individuals, micro-cohorts, cross-national differences. They also emphasize distinctions between statistical, marketing, and causal kinds. 

  Hmm, the challenge is balancing philosophical rigor with practical applicability. The user seems to be a grad student based on the course level, likely frustrated with oversimplified treatments of generations. Their unspoken need might be for a framework that exposes why popular discussions feel unsatisfying.

  I'll start by listing non-negotiable criteria. The boundary problem is crucial - any cutoff creates anomalies. This directly challenges essentialist views. Then there's the micro-cohort issue where shared experiences (like tech shifts) matter more than birth years. The national variation point is equally vital - 1995 births mean different things in different countries.

  For distinctions, I must separate three layers: statistical patterns (non-negotiable), marketing constructs (often conflated), and causal kinds (the holy grail if provable). Empirical adequacy is non-negotiable too - developmental psychology shows life stages interact with events.

  The explanatory burden is key. If generations can't predict outcomes better than other factors, they're just labels. This requirement probably wrecks most pop-science takes that treat generations as explanatory by default.

  Now comparing theories: Strict constructivism handles the arbitrary boundaries well but struggles with real statistical patterns. Birth essentialism fails almost all criteria except clean demographics. Event-based theory fits micro-cohorts and explanations best but gets messy with fuzzy boundaries.

  The national variation case might be the biggest hurdle for common-sense views. People assume "Gen Z" means something universal, when a 2001 baby in Seoul versus Kinshasa had utterly different formative exposures. That's devastating for essentialism.

  I should structure each desideratum with: 1) The case 2) Why it matters 3) Negotiability. Keep it tight - the user wants criteria, not citations. Save the theory comparison for the end as synthesis.
answer: |-
  Here is a set of desiderata for evaluating the ontological status of generational cohorts, structured as requested:

  ### Core Desiderata (Non-Negotiable for Adequate Ontology)

  1.  **Boundary Problem Resolution:**
      *   **Case:** Individuals born very close to either side of an arbitrary cutoff (e.g., Dec 31, 1996 vs Jan 1, 1997 for Millennial/Gen Z). They share nearly identical formative experiences with those just over the line.
      *   **Requirement:** The ontology must explain the ontological status of these individuals relative to their assigned/non-assigned cohort without resorting to essentialism based solely on the cutoff date. It must acknowledge the inherent fuzziness.
      *   **Non-Negotiable:** Yes. Failing this renders the ontology descriptively inadequate for real-world populations.

  2.  **Accounting for Micro-Cohorts / Event Exposure:**
      *   **Case:** Groups defined by experiencing a major, discrete event or technological shift during a critical developmental window, regardless of exact birth year (e.g., those who experienced the internet/social media *during adolescence*, irrespective of being late Millennial or early Gen Z by strict birth year).
      *   **Requirement:** The ontology must accommodate the potential reality of cohorts defined by shared *exposure timing* rather than *birth timing*, recognizing that significant events can create shared experiences cutting across traditional generational boundaries.
      *   **Non-Negotiable:** Yes. Ignoring event timing overlooks a plausible mechanism for cohort formation.

  3.  **Cross-National/Contextual Variation:**
      *   **Case:** Individuals born in the same year experiencing radically different formative conditions (e.g., 1990 birth in post-Soviet Russia vs. stable Western Europe vs. a rapidly developing Asian economy).
      *   **Requirement:** The ontology must not presuppose that birth years universally map to shared formative experiences or generational identity across different socio-political and economic contexts.
      *   **Non-Negotiable:** Yes. Globalization does not erase profound local/national differences in formative experiences.

  4.  **Distinguishing Aggregation, Construct, and Causal Kind:**
      *   **Distinctions Required:**
          *   *Statistical Aggregation:* Identifying patterns (e.g., average age of first marriage by birth year range).
          *   *Marketing/Social Construct:* Labels created & used for targeting, narrative-building, or identity politics (e.g., "Millennials love avocado toast").
          *   *Causally Integrated Kind:* A group sharing a robust, internal causal mechanism (e.g., shared formative experiences) that reliably generates shared properties, behaviors, or identities *beyond* statistical correlation or social labeling.
      *   **Requirement:** The ontology must clearly differentiate between these levels and specify under what conditions a cohort qualifies as a causally integrated kind.
      *   **Non-Negotiable:** Yes. Collapsing these is the primary source of confusion and overreach in popular discourse.

  5.  **Empirical Adequacy:**
      *   **Considerations:** Must respect findings from:
          *   *Demography:* Cohort size effects (e.g., Baby Boom competition), period vs. cohort effects in longitudinal data.
          *   *Developmental Psychology:* Critical/sensitive periods, interaction between age/stage and historical events ("historical embeddedness").
          *   *Social Psychology:* Minimal conditions for group identity formation and salience.
      *   **Requirement:** The ontology must be compatible with robust empirical findings from these fields regarding how life stages, events, and social contexts interact.
      *   **Non-Negotiable:** Yes. An ontology contradicting well-established empirical patterns is untenable.

  ### Key Explanatory Desideratum (Potentially Negotiable Stance)

  6.  **Explanatory Burden:**
      *   **Requirement:** To be more than a labeling convention, the ontology must show that "cohort membership" (as defined) provides *unique explanatory or predictive power* that cannot be fully reduced to or explained more parsimoniously by: a) Age/life stage effects, b) Period effects (events impacting everyone), c) Standard socio-economic variables (class, education, region), d) Individual differences.
      *   **Negotiability:** This is the core *stake* of the debate. Realists argue cohorts *must* meet this bar to be "real kinds." Strict constructivists may argue this bar is impossible to meet, making cohorts *only* constructs. It's non-negotiable *that* the ontology must address this requirement, but *whether* cohorts *satisfy* it is the central ontological question.

  **Most Damaging Requirement to Common-Sense Treatments:**
  **Cross-National/Contextual Variation.** Popular discourse overwhelmingly treats generational labels (Boomer, Gen X, Millennial, Gen Z) as universal, applying the same traits and experiences to individuals born in the same years regardless of geography or context. This requirement obliterates that assumption, demonstrating that the shared formative experiences defining a "real" cohort (if they exist) are fundamentally local, not global. A 1965 birth in the US (Late Boomer) vs. China (Cultural Revolution youth) simply did not share formative conditions sufficient to constitute a single causally integrated kind.

  **Evaluation of Theoretical Stances Against the Desiderata:**

  1.  **Strict Constructivism:**
      *   **Strengths:** Excels at 1 (Boundaries are arbitrary), 3 (Emphasizes contextual construction), 4 (Treats cohorts purely as constructs/aggregations), easily handles 2 (Micro-cohorts are just different constructs).
      *   **Weaknesses:** Struggles with 5 (May dismiss empirical patterns as *only* construction) and fundamentally rejects the possibility of 6 (Explanatory Power beyond construct/aggregation), viewing cohorts solely as labels or marketing tools. May underplay how shared *objective* events can drive shared experiences.

  2.  **Birth-Interval Essentialism:**
      *   **Strengths:** Provides clear operationalization (useful for demography/aggregation).
      *   **Weaknesses:** Fails catastrophically at 1 (Ignores boundary fuzziness), 2 (Cannot handle micro-cohorts defined by events), 3 (Assumes universality), often collapses 4 (Mistakes aggregation for causal kind), struggles with 5 (Ignores developmental timing of events), and generally fails 6 (Attributing causality to birth year itself is implausible; effects are mediated by experiences).

  3.  **Event-Based Cohort Theory:**
      *   **Strengths:** Best addresses 2 (Micro-cohorts are core), 3 (Events are context-specific), 4 (Focuses on shared causal experiences), 5 (Aligns with developmental psych on event timing), and offers the strongest potential path to satisfying 6 (Shared formative events as causal mechanism).
      *   **Weaknesses:** Challenges 1 (Defining the "event exposure window" creates *different* boundaries, still potentially fuzzy). Requires careful specification of *which* events are formative and *for whom* (age/stage interaction). Risk of proliferating micro-cohorts. Defining the causal mechanism precisely is complex.

  This framework prioritizes the criteria and their justifications as requested, providing a foundation for evaluating the ontological claims of generational categories.
