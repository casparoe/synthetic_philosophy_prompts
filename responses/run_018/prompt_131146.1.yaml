prompt: |-
  As a member of my university's International Partnerships Ethics Board, I must help the board reach a binding decision by Thursday on whether to renew our ten-year strategic research collaboration with a partner university in an authoritarian state that has delivered rapid economic growth, low corruption, and large-scale poverty reduction, while sharply restricting academic freedom—most recently through a state-mandated "social harmony audit" that subjects international joint research to review of its social implications. The partner institution has submitted a defense of continued collaboration that relies on what its own scholars call "recursive performance legitimacy": the claim that authoritarian rule is provisionally justified not by prosperity alone, but by maintaining institutional mechanisms designed to automatically dissolve coercive controls once specific development targets are met. They argue that our joint urban-climate research has contributed measurably to those targets, so terminating the agreement would remove a prosperity-generating input without allowing the sunset mechanism to trigger, thereby harming the citizens whose eventual liberation the framework promises.

  Some board members hold that no level of prosperity or order can justify suppressing open inquiry, and that maintaining the partnership lends moral cover to repression. Others argue that withdrawal mainly harms local scholars and eliminates a rare channel of external influence, with little effect on state policy. I need you to draft the formal recommendation memo I will circulate before Thursday's vote. The memo should be addressed to the board, approximately 350 to 400 words, confined to a single page, with the bottom-line recommendation—renew the agreement with explicit conditions, suspend it for twelve months with concrete benchmarks, or terminate it—stated clearly in the opening paragraph along with the timeline. Take a definite position and defend it with reasons; do not present a neutral survey of options or leave the choice to the board. You must engage the partner's "recursive performance legitimacy" argument honestly and on its own terms, identifying the strongest point in favor of renewal, but you must also treat the strongest counter-argument against your own recommendation with equal seriousness. Write in a tone appropriate for circulation before a binding institutional vote.
reasoning: |-
  Okay, the user is part of a university ethics board facing a tough decision on renewing a research partnership with an authoritarian state. They need a formal recommendation memo by Thursday. Let me unpack the key elements.

  First, the partner country has economic growth and reduced poverty but restricts academic freedom, especially with the new "social harmony audit." The partner's defense uses "recursive performance legitimacy" - arguing their authoritarian system will automatically lift controls once development targets are met, and that the research collaboration helps reach those targets. Terminating would supposedly prevent the sunset mechanism from triggering.

  The board is divided: some believe no prosperity justifies suppressing inquiry, while others think withdrawal harms local scholars without changing state policy. The user needs a decisive memo taking a position, not neutral options.

  Hmm, the strongest pro-renewal point is the partner's argument that the research directly contributes to development targets that could trigger liberalization. But the biggest counter-argument is that the "sunset mechanism" lacks enforceability - what if targets keep shifting? The social harmony audit already shows increased control.

  Considering options: Termination seems too abrupt and harms scholars. Unconditional renewal ignores ethical concerns. Conditional renewal with benchmarks? But how enforceable? Suspension with concrete benchmarks might be better - it maintains engagement possibility while demanding proof of the partner's claims.

  The memo must start with a clear recommendation. Suspension for 12 months with verifiable benchmarks feels balanced. It pressures the partner to demonstrate their "sunset mechanism" isn't theoretical while protecting academic integrity. The tone needs to be professional but firm - this is for a binding institutional vote.

  Key points to cover:
  - Acknowledge the partner's legitimacy argument but point out its lack of transparency
  - Note that the social harmony audit contradicts the promised liberalization
  - Argue suspension maintains leverage while termination abandons local scholars
  - Benchmarks should include scholar protections and audit modifications
  - Emphasize this isn't about politics but academic freedom as core value

  Word count is tight (350-400). Opening paragraph must state recommendation clearly. Need to treat both sides fairly but decisively. The "equal seriousness" requirement means giving full weight to the partner's argument before explaining why it's insufficient without evidence.
answer: |-
  **MEMORANDUM**  
  To: International Partnerships Ethics Board  
  From: [Your Name/Position]  
  Date: October 26, 2023  
  Subject: Recommendation on Renewal of Strategic Research Collaboration with [Partner University]  

  **Recommendation:** I recommend **suspending the collaboration for twelve months**, contingent on the partner university demonstrably meeting concrete benchmarks related to academic freedom protections and transparency in the "social harmony audit" process by October 31, 2024. Failure to meet these benchmarks should result in non-renewal. This suspension period provides a critical test of the core claims underlying the partnership’s ethical justification while mitigating immediate harm to scholars.  

  **Rationale:** The partner's "recursive performance legitimacy" argument presents the strongest case for renewal. If their institutional mechanisms genuinely trigger the dissolution of coercive controls upon achieving defined development targets, and our urban-climate collaboration demonstrably accelerates those targets, termination could indeed stall progress toward the very liberation framework they espouse. This potential for tangible, emancipatory impact through sustained engagement cannot be dismissed lightly. Our research outputs contribute measurably to prosperity, a stated precondition for their proposed liberalization.  

  However, this justification hinges entirely on the *credibility and enforceability* of the promised "sunset mechanism." The most compelling counter-argument, which necessitates suspension, is the **lack of evidence that the mechanism is operational or binding**. The recent imposition of the "social harmony audit," subjecting research to state review of social implications, directly contradicts the premise of diminishing controls and demonstrates increased institutional repression, not its dissolution. There is no independent verification that development targets automatically trigger liberalization, nor recourse if they do not. Continuing the collaboration unconditionally accepts this theoretical framework as sufficient while concrete academic freedoms erode, lending legitimacy to a system actively restricting inquiry.  

  Suspension with explicit benchmarks offers a responsible middle path:  
  1.  **Preserves Leverage & Engagement:** It avoids the definitive harm to local scholars and loss of influence that immediate termination risks, while maintaining pressure for reform.  
  2.  **Tests the Core Premise:** Benchmarks (e.g., documented scholar protections from audit repercussions, transparent audit criteria excluding political orthodoxy, independent verification of target progress) directly probe the "recursive performance" claim. Meeting them validates continued collaboration; failing them exposes it as untenable.  
  3.  **Upholds Institutional Values:** It refuses to normalize the suppression of academic freedom for prosperity alone but acknowledges the complexity of incremental change within constrained systems.  

  **Conclusion:** While the partner's legitimacy argument merits serious consideration, the burden of proof lies with them to demonstrate their framework's integrity. Unconditional renewal ignores escalating constraints on academic freedom. Termination forfeits potential influence and harms vulnerable scholars prematurely. Suspension with rigorous, verifiable benchmarks compels the partner to substantiate their central ethical claim or face non-renewal, aligning our actions with both principled commitment to academic freedom and pragmatic engagement. I urge the board to support this conditional suspension.
