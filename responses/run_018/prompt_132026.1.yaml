answer: |-
  ### Essay Question (45 minutes)  
  **"Evaluate whether hyperbolic discounting provides a satisfactory explanation of *synchronic* akrasia (weakness of will). In your view, does the model genuinely account for an agent acting against their own *present* best judgment, or does it merely redescribe *diachronic* preference reversals? Defend a clear position with reasoning, and address one major objection to your view."**  

  ---

  ### Model Answer (487 words)  
  **Thesis:** Hyperbolic discounting fails as an explanation of synchronic akrasia because it is inherently temporally dynamic, rendering it incompatible with failures of rational action that occur *without* changes in temporal proximity. It only explains diachronic preference reversals, not synchronic violations of current judgment.  

  **Argument:**  
  Synchronic akrasia occurs when an agent, at time *t*, intentionally acts against their consciously held best judgment *at that same time t* (e.g., lighting a cigarette while judging "I ought not to smoke now"). Hyperbolic discounting, however, models how agents *revalue* rewards as their temporal distance changes: smaller-sooner rewards become disproportionately appealing as they draw near, overriding prior commitments to larger-later rewards (e.g., choosing $50 today over $100 next week). This mechanism explains *diachronic* akrasia—a shift in preference across time—but not synchronic cases. In synchronic akrasia, no temporal shift occurs: the conflict is between contemporaneous judgment and action. Hyperbolic discounting predicts preference reversal only when temporal distances *alter*; it cannot mechanistically explain why an agent would defy a judgment *they actively endorse at the moment of action*. The model thus redescribes temporal self-control problems but leaves synchronic failures unaddressed.  

  **Objection & Reply:**  
  *Objection:* Synchronic akrasia might be a latent diachronic conflict. If an agent judged yesterday that smoking is always bad but now weakly prefers smoking, hyperbolic discounting could explain this as the "immediate reward" of smoking overriding the discounted "distant reward" of health. Thus, it *does* explain synchronic weakness.  
  *Reply:* This mislocates the conflict. In synchronic akrasia, the agent’s *present* all-things-considered judgment (e.g., "Health outweighs pleasure *right now*") is intact, yet they act against it. Hyperbolic discounting requires a *revision* of evaluation due to changing time horizons (e.g., health is "discounted" because its benefits are distant). But if the agent still judges health superior *at t*, no discounting has occurred—the model lacks resources to explain why action and judgment diverge *without* evaluative shift. The objection conflates diachronic preference change with synchronic irrationality.  

  **Conclusion:** Hyperbolic discounting illuminates why we abandon future goals as deadlines approach but cannot resolve the paradox of acting against our own unwavering present judgment. Synchronic akrasia demands a distinct account, possibly involving divided consciousness or judgment suspension.  

  ---

  ### Marking Scheme (20 points total)  
  **Top Answers (18–20)** excel by including **all five** of these moves:  
  1. **Distinguishes synchronic/diachronic akrasia** (3 pts):  
     - *Top:* Explicitly defines synchronic (failure at *single* time *t*) vs. diachronic (preference reversal *across* time).  
     - *Common failure:* Conflates the two or assumes all akrasia is diachronic.  

  2. **Accurately identifies hyperbolic discounting’s mechanism** (3 pts):  
     - *Top:* States it models *changing* preferences due to *shrinking temporal distance* to rewards.  
     - *Common failure:* Vaguely calls it "preferring immediate rewards" without temporal dynamics.  

  3. **Clear thesis with reasons** (5 pts):  
     - *Top:* Takes a stance (e.g., "fails for synchronic cases") + gives a reason tied to temporal mechanics (e.g., "requires shifting time horizons, absent in synchronic cases").  
     - *Common failure:* Summarizes the model without arguing its explanatory scope.  

  4. **Engages one serious objection** (5 pts):  
     - *Top:* Names an objection (e.g., "synchronic cases stem from diachronic conflicts") and rebuts it (e.g., "still ignores intact *present* judgment").  
     - *Common failure:* Raises a weak objection or rebuttal unrelated to temporality.  

  5. **Avoids treating all akrasia as future-oriented** (4 pts):  
     - *Top:* Explicitly notes that synchronic akrasia involves *no conflict with future selves* (e.g., "It’s about current judgment vs. action, not delayed rewards").  
     - *Common failure:* Frames weakness of will solely as "self-control toward future goals."  

  **Adequate Answers (12–15)** cover basic definitions and the model but omit ≥2 key moves (e.g., conflate synchronic/diachronic, fail to rebut objections).  
  **Weak Answers (<10)** summarize akrasia/discounting without engaging the explanatory question.  

  ---  
  This exam question challenges students to scrutinize whether a dominant empirical model captures philosophical phenomena or merely adjacent behaviors. The marking scheme rewards precision on temporal distinctions—a common stumbling block in moral psychology.
