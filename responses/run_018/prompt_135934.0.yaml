prompt: |-
  I am a software engineer with no formal training in philosophy, and I have recently been reading von Neumann’s reflections on the brain—particularly his observation that neural tissue achieves remarkably reliable behaviour despite being built from unreliable individual components, and his puzzlement over whether brain processes are best understood as analogue, digital, or an irreducible hybrid of the two. Before I assess any particular scientific account, I want a conceptual specification of what a theory of neural computation actually has to deliver if it takes these concerns seriously.

  Write the desiderata: the full list of requirements that an adequate theory of brain computation must satisfy, with the motivating case or phenomenon behind each—such as explaining high fault-tolerance without a central error-correcting protocol, accommodating both continuous signal modulation and discrete logical inference, or accounting for self-modification and learning in the absence of an external programmer. For each item, indicate whether you treat it as non-negotiable or as a camp-specific preference (for instance, the insistence on a symbol-level architecture versus a purely statistical learning framework), and flag any subset of requirements that appear jointly unsatisfiable given known constraints from neurobiology or information theory, since that tension is precisely what interests me most. I also want one requirement imported from distributed systems design included explicitly: the theory must explain graceful degradation under partial node failure without invoking a global orchestrator or redundant backup scheme, because this strikes me as a constraint von Neumann anticipated yet contemporary models rarely address directly. Please keep the weight on the criteria and their motivating distinctions—such as the difference between hardware failure and representational error, or between statistical approximation and verifiable inference—rather than on scoring competitors, though a brief assessment of how mainstream connectionist models, symbolic cognitive architectures, and predictive-processing frameworks fare against the list would be welcome. I am not seeking bibliographies, reading lists, or citations; I want the conceptual spec itself, and I would particularly like you to identify which single requirement, in your view, excludes the greatest number of popular current theories.
reasoning: |-
  We are constructing a set of desiderata for a theory of neural computation, taking inspiration from von Neumann's concerns and others. We must include requirements motivated by the phenomena of the brain and also one from distributed systems design.

   Key phenomena to cover:
   1. Fault tolerance despite unreliable components.
   2. The nature of computation (analog vs. digital vs. hybrid).
   3. Self-modification and learning without an external programmer.
   4. Graceful degradation under partial failure (distributed systems requirement).

   We will list each requirement, the motivating phenomenon, and classify as non-negotiable (NN) or camp-specific (CS). We will also note any tensions (jointly unsatisfiable given known constraints).

   Additionally, we will briefly assess mainstream models (connectionist, symbolic, predictive processing) against the list and identify the requirement that excludes the most popular theories.

   Desiderata:

   1. **Fault Tolerance without Centralized Error Correction**
      - *Motivation*: Neural tissue achieves reliable behavior from unreliable components (neurons, synapses) without a central controller or explicit error-correcting codes. This is observed in the brain's ability to function despite neuron death and noise.
      - *Type*: Non-negotiable. Any theory must account for this.
      - *Tension*: Known from information theory that achieving fault tolerance typically requires redundancy or error correction. The brain does it without a centralized scheme, so the theory must explain a distributed, emergent mechanism.

   2. **Integration of Continuous and Discrete Processing**
      - *Motivation*: Brain processes exhibit both continuous (e.g., graded potentials, neurotransmitter diffusion) and discrete (e.g., action potentials, logical decisions) characteristics. Von Neumann puzzled over whether the brain is analog, digital, or a hybrid. An adequate theory must account for both and their interplay.
      - *Type*: Non-negotiable. The brain clearly uses both.
      - *Tension*: Hybrid systems can be complex and may face challenges in maintaining stability and consistency.

   3. **Self-Modification and Learning without External Programming**
      - *Motivation*: The brain learns and adapts throughout life without an external programmer. This includes synaptic plasticity, structural changes, and functional reorganization.
      - *Type*: Non-negotiable. A theory of neural computation must explain autonomous learning.

   4. **Graceful Degradation under Partial Node Failure**
      - *Motivation* (from distributed systems): The brain continues to function (though with reduced performance) when parts are damaged, without a global orchestrator or redundant backup scheme (like in engineered systems with hot spares). This is observed in stroke recovery and the brain's resilience to injury.
      - *Type*: Non-negotiable. This is a critical feature of biological neural systems that must be explained.
      - *Tension*: How can the system degrade gracefully without a designed redundancy map? The brain's solution must be inherent in its computational architecture.

   5. **Energy Efficiency and Scalability**
      - *Motivation*: The brain operates with remarkable energy efficiency (using about 20W) and scales to handle complex tasks with billions of neurons. Any theory must account for how computation is organized to be both efficient and scalable.
      - *Type*: Non-negotiable. The brain's energy constraints are a hard biological fact.

   6. **Real-time Performance with Massive Parallelism**
      - *Motivation*: The brain processes sensory inputs and produces motor outputs in real-time, despite relatively slow neuronal firing rates (ms range). This is achieved through massive parallelism and asynchronous processing.
      - *Type*: Non-negotiable. The theory must explain how slow components yield fast overall computation.

   7. **Support for Both Statistical Approximation and Verifiable Inference**
      - *Motivation*: The brain performs both probabilistic, approximate reasoning (e.g., recognizing a face in poor light) and logical, verifiable inference (e.g., solving a mathematical problem). A theory must accommodate both without reducing one to the other.
      - *Type*: Camp-specific? Some theories (e.g., symbolic) emphasize verifiable inference, while others (e.g., connectionist) focus on statistical learning. However, the brain does both, so we treat this as non-negotiable that the theory must account for both, even if it prioritizes one.

   8. **Representational Flexibility and Compositionality**
      - *Motivation*: The brain can form representations that are both flexible (context-dependent, capable of generalization) and compositional (building complex representations from simpler ones). This is evident in language and abstract thought.
      - *Type*: Camp-specific? Symbolic architectures insist on compositionality, while connectionist models often struggle with it. But since the brain exhibits both, we consider it non-negotiable that the theory must explain how the brain achieves flexible compositionality.

   9. **Autonomy and Self-Maintenance**
      - *Motivation*: The brain maintains its own operational integrity (e.g., homeostasis, sleep cycles for maintenance) without external intervention.
      - *Type*: Non-negotiable. A biological system must self-maintain.

   10. **Explanatory Compatibility with Neurobiology**
       - *Motivation*: The theory must be compatible with known neurobiological constraints (e.g., spike-timing-dependent plasticity, neurotransmitter dynamics, anatomical connectivity).
       - *Type*: Non-negotiable. The theory is about the brain, so it must fit the biology.

   Tensions and Challenges:

   - **Tension between 1 (Fault Tolerance) and 4 (Graceful Degradation)**: Both require robustness, but graceful degradation under partial failure without a central orchestrator or explicit backups is particularly challenging. How does the system know which parts are critical? How is redundancy achieved without explicit duplication? The brain's solution likely involves distributed representations and functional overlap.

   - **Tension between 2 (Continuous/Discrete) and 7 (Statistical/Verifiable)**: Continuous processes are naturally suited for statistical approximation, while discrete processes for verifiable inference. A hybrid system must bridge these without introducing inefficiencies.

   - **Tension between 5 (Energy Efficiency) and 6 (Real-time Performance)**: Massive parallelism helps with speed but could be energy-intensive. The brain must balance these.

   - **Tension between 7 (Statistical/Verifiable) and 8 (Compositionality)**: Statistical models (like deep learning) are good at approximation but often lack explicit compositionality. Symbolic models are compositional but rigid. The brain achieves both, so the theory must resolve this.

   Brief Assessment of Mainstream Models:

   - **Connectionist Models (e.g., Deep Learning)**:
     - Strengths: Good at statistical approximation (7), learning (3), and parallelism (6). Can exhibit fault tolerance (1) and graceful degradation (4) to some extent (via distributed representations).
     - Weaknesses: Struggle with verifiable inference (7) and compositionality (8). Not designed for energy efficiency (5) in the brain's sense. The continuous/discrete (2) aspect is often handled by using differentiable models (continuous) and thresholding (discrete), but the hybrid nature is not deeply integrated. Also, they typically require centralized training and lack true autonomy (9).

   - **Symbolic Cognitive Architectures (e.g., ACT-R, SOAR)**:
     - Strengths: Support verifiable inference (7) and compositionality (8). Can model logical reasoning.
     - Weaknesses: Poor at statistical approximation (7), fault tolerance (1), and graceful degradation (4). They are typically discrete and struggle to integrate continuous processes (2). Learning (3) is often rule-based and not as flexible as in the brain. They do not inherently address energy efficiency (5) or real-time parallelism (6). Not biologically plausible (10).

   - **Predictive Processing (PP) Frameworks**:
     - Strengths: Accounts for both continuous and discrete (2) via probabilistic inference. Handles statistical approximation (7) and can be extended to verifiable inference via hierarchical Bayesian models. Learning (3) is central. Can be made biologically plausible (10). Fault tolerance (1) and graceful degradation (4) might emerge from the distributed Bayesian inference.
     - Weaknesses: Compositionality (8) is not inherently addressed. Energy efficiency (5) and real-time performance (6) are not explicitly modeled. The framework is computationally expensive in current implementations. The autonomy (9) and self-maintenance are not typically covered.

   Requirement that Excludes the Most Popular Theories:

   The requirement that, in my view, excludes the greatest number of popular current theories is:

   **Requirement 7: Support for Both Statistical Approximation and Verifiable Inference**

   Why? Most theories fall strongly on one side. Connectionist models (e.g., deep learning) excel at statistical approximation but lack mechanisms for verifiable, logical inference that is systematic and robust. Symbolic architectures are strong on verifiable inference but weak on statistical learning. Predictive processing tries to bridge the gap by using probabilistic inference, but it is still primarily statistical and lacks a clear account of how verifiable (deductive, logical) inference is performed in a way that guarantees correctness.

   However, note that Requirement 4 (Graceful Degradation without a Global Orchestrator) is also a major challenge for many models, especially symbolic ones, but even connectionist models often rely on centralized training and do not naturally degrade without a global structure.

   But Requirement 7 is more fundamental because it cuts to the heart of the nature of cognition: the brain must do both approximate, probabilistic reasoning and exact, logical reasoning. Without an account of both, a theory is incomplete.

   Therefore, the desiderata list:

   1. Fault Tolerance without Centralized Error Correction [NN]
   2. Integration of Continuous and Discrete Processing [NN]
   3. Self-Modification and Learning without External Programming [NN]
   4. Graceful Degradation under Partial Node Failure [NN]
   5. Energy Efficiency and Scalability [NN]
   6. Real-time Performance with Massive Parallelism [NN]
   7. Support for Both Statistical Approximation and Verifiable Inference [NN]
   8. Representational Flexibility and Compositionality [NN]
   9. Autonomy and Self-Maintenance [NN]
   10. Explanatory Compatibility with Neurobiology [NN]

   Note: We have marked all as non-negotiable because they are all critical features of the brain. However, in practice, some might be relaxed in specific models, but an adequate theory must address them all.

   This list is ambitious and highlights the challenges in building a complete theory of neural computation.
answer: |-
  ### Desiderata for a Theory of Neural Computation  
  Here is the conceptual specification of requirements, grounded in von Neumann’s concerns, distributed systems principles, and neurobiological reality. Each item includes:  
  - **Motivating phenomenon** (the empirical or conceptual challenge it addresses).  
  - **Classification** as non-negotiable (NN: essential for any viable theory) or camp-specific (CS: contingent on philosophical commitments).  
  - **Tensions** where requirements may conflict with known constraints.  

  #### Core Requirements  
  1. **Fault Tolerance without Centralized Control**  
     - **Motivation**: Neural tissue maintains reliable function despite noisy synapses, stochastic signaling, and cell death (e.g., aging brains retaining function). Von Neumann noted individual neurons are unreliable, yet system-level behavior is robust.  
     - **Distributed Systems Import**: Graceful degradation under partial node failure (e.g., stroke damage) without a global orchestrator or engineered redundancy (e.g., replicated backups).  
     - **NN/CS**: Non-negotiable. Centralized error correction is biologically implausible.  
     - **Tension**: Thermodynamic constraints (entropy increase) and energy costs challenge fault tolerance without explicit redundancy.  

  2. **Hybrid Analog-Digital Computation**  
     - **Motivation**: Neurons exhibit continuous dynamics (e.g., graded potentials, dendritic integration) and discrete signals (action potentials). von Neumann doubted a pure digital/analog dichotomy.  
     - **NN/CS**: Non-negotiable. Must unify continuous modulation (e.g., attention) and discrete inference (e.g., decision-making).  
     - **Tension**: Analog processes are sensitive to noise; digital processes are brittle. Hybrid models risk inefficiency or instability.  

  3. **Autonomous Self-Modification**  
     - **Motivation**: Learning and adaptation (e.g., synaptic plasticity, cortical remapping post-injury) occur without external programming.  
     - **NN/CS**: Non-negotiable. The brain is not "coded" by an external agent.  
     - **Tension**: Reconciliation with developmental constraints (e.g., critical periods) and genetic limits on plasticity.  

  4. **Energy-Efficient Scalability**  
     - **Motivation**: The brain consumes ~20W while outperforming artificial systems in tasks like real-time sensorimotor integration. Must scale across >86B neurons.  
     - **NN/CS**: Non-negotiable. Biophysical limits (e.g., ATP usage) are immutable.  
     - **Tension**: Information-theoretic bounds (Landauer’s principle) conflict with high computational density.  

  5. **Support for Statistical and Logical Inference**  
     - **Motivation**: Brains perform statistical approximation (e.g., uncertain perception) and verifiable inference (e.g., logical deductions). Distinguish hardware failure (stochastic noise) from representational error (misinterpretation).  
     - **NN/CS**: Non-negotiable. Both are empirically observed.  
     - **Tension**: Statistical methods (e.g., sampling) trade certainty for efficiency; logical systems demand precision.  

  6. **Real-Time Asynchrony**  
     - **Motivation**: Neurons operate at ~200Hz, yet the brain processes complex inputs in milliseconds. Requires decentralized coordination without a global clock.  
     - **NN/CS**: Non-negotiable. Biological neurons are slow and asynchronous.  
     - **Tension**: Synchronization costs (e.g., phase-locking) vs. deadline guarantees for survival-critical tasks.  

  7. **Compositional Representation**  
     - **Motivation**: Human cognition combines concepts flexibly (e.g., understanding "purple elephant"). Must explain systematicity without pre-defined symbols.  
     - **NN/CS**: Camp-specific. Symbolic architectures demand this; connectionists may reject it.  
     - **Tension**: Neurobiology lacks obvious discrete symbols; distributed representations struggle with systematic compositionality.  

  8. **Explanatory Compatibility with Neurobiology**  
     - **Motivation**: The theory must align with observed mechanisms (e.g., spike-timing-dependent plasticity, neuromodulation).  
     - **NN/CS**: Non-negotiable. Constraints include axonal delays, neurotransmitter diffusion, and limited fan-out.  
     - **Tension**: Abstract computational models often ignore biophysical details.  

  #### Critical Tensions  
  - **Fault Tolerance vs. Energy Efficiency**: Redundancy-free fault tolerance requires massive parallelism or degeneracy, conflicting with energy constraints.  
  - **Statistical vs. Logical Inference**: Statistical approximation (e.g., predictive coding) undermines verifiability; logical frameworks struggle with uncertainty.  
  - **Compositionality vs. Hybrid Processing**: Symbolic composition assumes discreteness; continuous dynamics blur symbolic boundaries.  
  - **Autonomous Learning vs. Stability**: Unsupervised self-modification risks catastrophic forgetting or chaotic drift.  

  #### Assessment of Mainstream Models  
  - **Connectionist Models (e.g., Deep Learning)**:  
    - **Strengths**: Fault tolerance (distributed reps), statistical inference, scalability.  
    - **Weaknesses**: Centralized training violates autonomy; poor at logical inference/compositionality; energy-inefficient; no graceful degradation mechanism.  
  - **Symbolic Architectures (e.g., ACT-R)**:  
    - **Strengths**: Compositionality, verifiable inference.  
    - **Weaknesses**: Fail at fault tolerance, hybrid processing, and neurobiological compatibility; require pre-defined symbols.  
  - **Predictive Processing**:  
    - **Strengths**: Hybrid computation (continuous prediction errors + discrete updates), statistical inference, neurobiological links.  
    - **Weaknesses**: Unclear fault tolerance/graceful degradation; struggles with logical inference; energy costs unaddressed.  

  #### The Most Exclusionary Requirement  
  **Requirement 5 (Support for Statistical and Logical Inference)** excludes the greatest number of popular theories:  
  - Connectionist models (e.g., neural networks) lack verifiable inference.  
  - Symbolic systems (e.g., production rules) fail at statistical approximation.  
  - Predictive processing handles statistics but not rigorous logic.  
  This requirement demands a unified framework for *both* probabilistic and deductive reasoning—a core challenge in cognitive science.  

  ---  
  This specification defines the hard constraints for a theory of neural computation. The tensions—especially between fault tolerance, energy efficiency, and inference types—highlight where breakthroughs must occur. Von Neumann’s insight into reliable systems built from unreliable parts remains the sharpest test for any candidate theory.
