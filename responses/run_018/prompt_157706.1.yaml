  Here's a decision tree designed for a napkin sketch, focused on concrete commitments and cases, building the logical space step-by-step. It uses three core questions derived from your dilemmas, resulting in **6 distinct leaves (positions)** and **1 explicitly flagged dead end**.

  **The Napkin Sketch: Karma's Moral Ledger**

  **(Professor taps her wine glass)** "Alright, forget rebirth cycles. Let's talk karma as cosmic moral accounting: does suffering *really* track vice and flourishing track virtue? Let's map the possibilities. Grab that napkin..."

  **Question 1: The Amnesiac War Criminal**
  *   *Imagine a brutal dictator commits horrific crimes, then loses all memory of them and becomes a genuinely kind, simple gardener. Decades later, he develops a horrifically painful, incurable disease. Is this suffering deserved?*
  *   **Branch A: YES, desert survives forgetting.** (Proceed to Question 2)
  *   **Branch B: NO, desert requires present culpability/connection.** (Proceed to Question 3)

  **Question 2 (After YES): The Unwilling Heirs**
  *   *Imagine a peaceful town, whose ancestors centuries ago committed genocide to seize the land. None of the current townspeople knew, endorsed, or benefited directly from the crime. A natural disaster wipes out the town. Is this collective suffering karmically deserved?*
  *   **Branch A-YES: YES, groups can deserve collective harm without consent.** (Proceed to Question 3)
  *   **Branch A-NO: NO, collective harm requires consent/participation.** (Position: **Consent-Based Collective Karma**)
      *   *Commitment:* "Groups can bear karma *only* if members consented (explicitly or tacitly) to the wrongs or knowingly benefited. Harm falling on the innocent descendants of sinners isn't 'deserved' karma, it's just tragedy."

  **Question 3 (After A-YES or Branch B): The Lucky Saint (or the Accidental Mogul)**
  *   *Imagine a deeply kind but very ordinary person, living virtuously but modestly. They accidentally buy a forgotten lottery ticket found in a donated coat and win hundreds of millions. They live in blissful luxury, doing some good but mostly just enjoying life. Is this flourishing truly "earned" karmic reward?*
  *   **Branch YES: YES, cosmic desert can manifest as massive accidental surplus.** (Leads to a position or dead end depending on path)
  *   **Branch NO: NO, desert is proportional and intentional; windfalls aren't "earned" karma.** (Leads to a position)

  ---

  **The Leaves (Positions):**

  1.  **Strict Individualist Karma:** (Path: **A-YES -> A-NO -> YES**)
      *   *Commitment:* "Desert sticks to the *individual soul* like glue, regardless of memory. Groups don't inherently 'deserve' as groups. But cosmic justice is generous; massive windfalls *can* be unearned rewards for past virtue manifesting unexpectedly."
      *   *Answers:* Suffering w/o memory? YES. Collective w/o consent? NO. Accidental surplus flourishing? YES.

  2.  **Consent-Based Collective Karma:** (Path: **A-YES -> A-NO**)
      *   *Commitment:* "Desert survives forgetting for individuals. However, groups only 'deserve' collectively if the harm relates to wrongs they *as a group* chose or endorsed. Massive accidental windfalls aren't proportional 'earned' karma (they might be luck, or a test!)."
      *   *Answers:* Suffering w/o memory? YES. Collective w/o consent? NO. Accidental surplus flourishing? NO.

  3.  **Collective Karma (Unconditional):** (Path: **A-YES -> A-YES -> NO**)
      *   *Commitment:* "Desert survives forgetting. Groups *can* inherently deserve collective consequences for ancestral or cultural sins, even without present consent or knowledge. However, karma isn't dumb luck; truly accidental windfalls far exceeding virtue aren't 'earned' rewards."
      *   *Answers:* Suffering w/o memory? YES. Collective w/o consent? YES. Accidental surplus flourishing? NO.

  4.  **Secular Retributivist Analogue:** (Path: **B -> NO**)
      *   *Commitment:* "Desert *requires* present culpability or conscious connection to the wrong. The amnesiac gardener shouldn't suffer for the dictator's sins. Groups don't 'deserve' harm inherently. Accidental windfalls aren't 'earned'. This is less 'cosmic karma' and more about moral responsibility needing a conscious agent *now*."
      *   *Answers:* Suffering w/o memory? NO. Collective w/o consent? NO. Accidental surplus flourishing? NO. *(Note: This overlaps logically with the next one but emphasizes desert/retribution over consequences).*

  5.  **Desert-Agnostic Consequentialism:** (Path: **B -> YES**)
      *   *Commitment:* "Forget individual 'desert' – it's incoherent without memory or choice. Groups suffering might deter future wrongs or balance social scales, making it 'appropriate' in a system-focused way, not because they 'deserve' it. Windfalls are just luck to be used well. Focus on outcomes, not cosmic ledgers."
      *   *Answers:* Suffering w/o memory? NO. Collective w/o consent? YES (but as "appropriate/systemic", not "deserved"). Accidental surplus flourishing? NO (just luck).

  6.  **Metaphorical/Interpretivist Stance:** (Path: **B -> YES** OR potentially other "NO" to suffering w/o memory paths, but most coherent here)
      *   *Commitment:* "Karma isn't literal cosmic accounting. Suffering without memory teaches us about the *nature* of consequences, not desert. Collective suffering highlights historical echoes. Windfalls challenge our notions of 'earning'. It's a framework for finding meaning in hardship and luck, not a law of moral physics."
      *   *Answers:* Suffering w/o memory? NO (not literally *deserved*). Collective w/o consent? YES (as meaningful pattern, not desert). Accidental surplus flourishing? NO (not earned, but interpretable). *Flexible on specifics, rejects literal desert.*

  **The Dead End: Incoherent Branch** (Path: **A-YES -> A-YES -> YES**)
  *   *Combination:* Suffering w/o memory? YES. Collective w/o consent? YES. Accidental surplus flourishing? YES.
  *   *Diagnosis:* **Incoherent.** It claims suffering is meticulously deserved based on past deeds (individual and collective) regardless of current state, *but* also claims massive, accidental windfalls (pure luck) are "earned" karmic rewards. This makes the cosmic ledger arbitrary – punishing blindly for the past while rewarding blindly for luck. It violates the core premise of desert tracking moral worth. It's likely unexplored because it collapses the idea of desert entirely. *(Professor scribbles it out with a "NOPE!")*

  **Mind-Changers & Blurred Lines:**

  1.  **Mind-Changer for Individualist Karma (Strict):** If you become convinced that moral agency *requires* continuity of consciousness/memory (like the Secular Retributivist argues), then the foundation of desert surviving forgetting crumbles. The Strict Individualist view *depends* on identity transcending memory.
  2.  **Blurred Line: Secular Retributivist vs. Desert-Agnostic Consequentialism:** Both answer NO to suffering w/o memory and NO to accidental surplus. The key difference is *why* they might say YES to collective suffering. The Retributivist likely wouldn't (groups lack moral agency), while the Consequentialist does for systemic reasons. But a weak Consequentialist might say NO to collective suffering too, making them *logically identical* to the Secular Retributivist on the tree. The difference is in their *justification* (desert vs. consequences), which the tree's questions don't force them to reveal.
  3.  **Blurred Line: Consent-Based Collective vs. Consequentialism/Metaphorical:** Both could potentially justify *some* collective "penalties" in practice (e.g., reparations). The tree separates them based on the *reason* (desert-with-consent vs. systemic-outcomes/meaning), which the "Collective w/o consent?" question targets. But someone could waffle on whether "tacit consent" via benefiting counts, edging towards Consequentialism.

  **Napkin Ready:**
  The professor draws three big Y/N splits stemming from the three cases (Amnesiac Criminal, Unwilling Heirs, Lucky Saint). She labels the leaves with the position names (or just numbers referring to a key on the napkin edge). She emphatically crosses out the **A-YES -> A-YES -> YES** branch. "See?" she says, gesturing with a breadstick, "Most people land *here*, or *here*... but that one? Pure nonsense. Pass the parmesan."

  This structure uses concrete cases, avoids jargon, builds the logical space, identifies a clear dead end, flags potential overlaps, and provides a mind-changer for a key position – all fitting on a napkin during a lively dinner debate.
