  *checks for gaps* Can't separate secular retributivism from strict karma? Both say suffering must be deserved individually. The difference is secular vs cosmic, but the tree only tracks logic, not metaphysics. Good—that ambiguity serves the scene. 

  Final structure: Start broad ("does desert transcend forgetting?"), then branch to collectivism, then to luck. Kill the incoherent branch (collective harm without consent + accidental surplus flourishing). End with six leaves: strict karma, consent-based collective karma, secular retributivism, desert-agnostic consequentialism, metaphorical karma, and "not a thing" for the dead branch. 

  User’s mind-change test: If moral continuity requires present awareness, the individualist branch collapses. Flag that. Also highlight where positions blur—e.g., consent-based karma vs consequentialism might both approve collective punishment for deterrence, but for different reasons. 

  ...And no citations. The professor is napkin-deep in rigatoni, not footnotes.
