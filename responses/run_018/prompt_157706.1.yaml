  First, I need to map the logical space. The three binary questions create eight possible combinations (2^3), but several will be dead ends. Let me test combinations mentally: "Can deserved suffering fall on someone with zero present culpability?" → Yes/No. "Can collective harm be karmically appropriate?" → Yes/No. "Can accidental flourishing be earned?" → Yes/No. 

  *scribbles mentally* The problematic branch seems to be "Yes to collective harm without consent + Yes to accidental flourishing." If a group suffers collectively without choosing it, but an individual accidentally prospers beyond merit—that creates tension. The collective suffering implies strict cosmic accounting while accidental flourishing undermines it. Probably incoherent. 

  For named positions: Strict individualist karma would say Yes to desert without memory (punishment sticks even if you forget), No to collective harm (only individuals), No to accidental flourishing (luck can't create desert). Collective karma with consent might say Yes to collective harm only if members consented implicitly—but how? Maybe through cultural complicity. 

