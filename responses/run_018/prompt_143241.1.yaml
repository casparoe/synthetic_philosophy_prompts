answer: |-
  ## Exam Question

  **Section B: Long Essay (75 minutes)**  
  Critically evaluate the claim that automation creates a ‘credential gap’ – a disconnect between employment and perceived contribution – which fundamentally destabilises the concept of *deserved* respect in society. Can respect be coherently reconstructed on grounds entirely independent of productive contribution? Or does decoupling respect from contribution collapse into conceptual instability, rendering respect either arbitrary or merely aspirational? Engage directly with the problem of whether work functions as a necessary ‘moral credential’ for social standing.  

  *(Note: Answers relying solely on descriptive accounts of alienation or labour/work/action distinctions, without addressing the *normative* challenge of deservedness posed by the credential gap, will be marked down.)*  

  ---

  ## Model Answer (Approx. 700 words)

  Automation’s profound threat lies not merely in job displacement but in its potential to sever the deep-seated link between productive contribution and social recognition, creating what might be termed a ‘credential gap’. This gap emerges when individuals, displaced or devalued by automation, find the traditional justification for societal respect – that they contribute tangible value through work – evaporating, while the expectation of dignity remains. The central question is whether deserved respect can survive this decoupling, or whether it relies conceptually on the ‘moral credential’ of contribution.

  Proponents of reconstructing respect argue that its foundation must shift to intrinsic human worth, irrespective of output. Kantian notions of dignity grounded in rationality and autonomy, or Rawlsian principles of justice guaranteeing respect as a primary good, suggest respect precedes contribution. In a post-work society, they argue, we could institutionalise respect through unconditional basic income (UBI) or guaranteed status, recognising individuals as ends-in-themselves. Respect becomes a right of membership, not a reward for production. This view posits the credential gap as an opportunity to jettison a contingent, potentially exploitative, link between toil and worth.

  However, this reconstruction faces significant conceptual instability when scrutinising the notion of *deserved* respect. While intrinsic dignity provides a baseline of *inherent* respect (e.g., prohibiting cruelty), *deserved* respect implies an *earned* social standing or esteem contingent on action or value. Contribution historically provided the tangible, measurable basis for this desert. Removing that anchor risks rendering ‘deserved’ respect either arbitrary or meaningless. If respect is entirely decoupled from any notion of contribution – understood broadly as adding value, solving problems, or serving others – what distinguishes it from mere politeness or legal entitlement? Does calling it ‘deserved’ retain any coherent meaning without a referent?

  The instability manifests in two ways. Firstly, **arbitrariness**: Without contribution as a criterion, what principles determine levels or forms of respect? Resorting solely to inherent dignity flattens respect into a uniform minimum, potentially erasing meaningful distinctions in social recognition tied to effort, skill, or benefit provided – distinctions that arguably fuel human striving and societal cohesion. Secondly, **aspirational emptiness**: Declaring respect independent of contribution might become mere wishful thinking if societal psychology and informal norms stubbornly retain the old credentialing logic. People may *feel* disrespected if they perceive themselves as non-contributors, regardless of official pronouncements. The persistence of stigma around unemployment, even amidst welfare systems, illustrates this psychological inertia. Automation might exacerbate this, as fewer people engage in recognisable 'contributory' acts.

  Furthermore, the ‘moral credential’ function of work persists partly because contribution offers a relatively **objective** (though imperfect) proxy for assessing desert in complex societies. Alternatives – like respect based solely on identity or declared rights – struggle to provide stable, shared criteria resistant to bias or contestation. Contribution, even in non-economic forms (care, creativity, civic participation), offers a tangible anchor. Automation complicates *what counts* as contribution (e.g., is maintaining community online valuable?), but doesn't eliminate the human impulse to seek validation through perceived usefulness.

  Therefore, while the credential gap exposes the limitations of tying respect solely to traditional employment or economic output, completely decoupling respect from *any* notion of contribution creates conceptual instability for *deserved* respect. Intrinsic dignity provides a crucial foundation prohibiting degradation, but robust *social standing* – the respect carrying weight in interpersonal and societal recognition – likely requires some perceived link to adding value, however redefined. The challenge isn't abandoning the link, but renegotiating what constitutes valuable contribution in an automated age and ensuring access to these redefined contributory roles. Failing this, the 'deserved' aspect of respect risks becoming incoherent, leaving only a thin, potentially unstable, universal entitlement vulnerable to erosion by persistent contributory instincts. Decoupling thus appears less a stable solution and more a precarious aspiration confronting deep-seated social and psychological realities.

  ---

  ## Marking Scheme (Total: 20 Marks)

  An **A Grade (16-20 marks)** answer **must** demonstrate:

  1.  **Precise Definition & Core Problem (4 marks):** Clearly defines the "credential gap" as a *moral/social* disconnect (not just unemployment) undermining the *justification* for deserved respect based on contribution.  
      *   **Costs Marks:** Treating the gap as purely economic (job loss leading to poverty/lack of resources) or conflating it with general alienation without focusing on the *moral credential* function.

  2.  **Critical Engagement with Decoupling (4 marks):** Directly and rigorously analyses the proposition that respect *can* and *should* be based *entirely* on grounds independent of contribution (e.g., intrinsic dignity, citizenship). Evaluates its conceptual coherence and stability for *deserved* respect specifically.  
      *   **Costs Marks:** Simply asserting intrinsic dignity as sufficient without grappling with the distinction between *inherent* respect (baseline dignity) and *deserved/earned* respect (social standing/esteem), or failing to challenge the feasibility/stability of decoupling.

  3.  **Identification of Instability (4 marks):** Effectively argues *why* decoupling might be unstable, highlighting key problems like arbitrariness (no criteria for 'deserved'), aspirational emptiness (clashing with deep-seated norms), or the loss of an objective anchor for social validation.  
      *   **Costs Marks:** Only describing potential new bases for respect (e.g., UBI) without critiquing their stability; or identifying instability only in practical implementation, not conceptual logic.

  4.  **Nuance Beyond Standard Theories (4 marks):** Uses relevant concepts (e.g., social recognition, desert, intrinsic vs. instrumental value) to analyse the gap *directly*, rather than leaning on Marx/Arendt as primary frameworks. If mentioned, applies their insights *critically* to the specific normative problem of the credential (e.g., *how* does automation complicate Arendt’s categories in relation to moral justification?).  
      *   **Costs Marks:** Reciting Marx on alienation or Arendt’s tripartite division *descriptively* without linking it explicitly to the *normative* crisis of the moral credential ("Why does this distinction matter for *deserved respect* in the gap?"). Using theorists as a substitute for original analysis of the prompt.

  5.  **Balanced Conclusion on Stability (4 marks):** Reaches a reasoned judgement on the core question: whether decoupling is conceptually stable or unstable. Acknowledges the force of intrinsic dignity but recognises the persistent challenge to *deserved* social standing. Avoids simplistic solutions.  
      *   **Costs Marks:** Concluding weakly (e.g., "it's complicated"); advocating uncritically for decoupling as obviously correct; or reverting to policy fixes (UBI) without resolving the conceptual tension regarding desert and respect.

  *(Marks deducted for poor structure, unclear writing, or significant factual inaccuracies.)*
