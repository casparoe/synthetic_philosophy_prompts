prompt: |-
  I'm trying to understand a tension in decision theory that arises when we evaluate choices whose outcomes might differ by orders of magnitude—say, in institutional or policy contexts where one option offers modest, reliable benefits but also carries a vanishingly small risk of catastrophic failure, while another option promises an astronomical gain with near-impossible probability. In these settings, expected-value reasoning is often accused of "fanaticism": if the potential upside or downside is large enough, then probabilities approaching zero seem to dominate the calculus, rendering the decision apparently insensitive to actual likelihoods. By contrast, the maximin rule—selecting the option whose worst possible outcome is least severe—appears to avoid this pressure by disregarding probabilities entirely and attending only to the lower bounds of outcomes.

  I would like you to compare these two frameworks in detail. First, clarify whether maximin genuinely escapes fanaticism or merely suppresses it: if outcomes are unbounded in either direction, can maximin still be driven by extreme possibilities within the worst-case comparison, or does its structural focus on minima inherently block low-probability astronomical values from controlling the choice? Second, apply both frameworks to a concrete comparison: Option A guarantees a moderate benefit with a worst case of mild disappointment, while Option B offers a 99.999% chance of that same moderate benefit but a 0.0001% chance of an existential-level disaster—how does each rule evaluate them, and is maximin's refusal to weight probabilities rational here, or does it represent an unjustified insensitivity? Third, consider whether a hybrid approach—such as a lexicographic maximin activated only below a probability threshold, or a risk-capped expected utility—can preserve the strengths of both without collapsing back into fanaticism or relying on arbitrary cutoffs.

  Finally, address the deeper theoretical question: is the fanaticism problem intrinsic to expected utility theory as such, or does it depend specifically on allowing unbounded utility scales? In your answer, please indicate explicitly where the mapping between the two frameworks holds, where it breaks down, and which framework you think offers the more defensible account of rational choice under deep uncertainty with extreme outcomes.
reasoning: |-
  Okay, let me unpack this user's query. They're wrestling with a classic tension in decision theory—expected utility versus maximin—when dealing with extreme outcomes. The core issue is fanaticism in expected utility calculations, where tiny probabilities of astronomical gains or losses dominate decisions. 

  First, I need to verify if maximin truly avoids fanaticism. The user suspects it might just suppress it. Maximin focuses solely on the worst outcomes, ignoring probabilities. So for unbounded losses, yes, it could still be driven by catastrophe—but only if that catastrophe is the absolute worst outcome. If another option has a less severe worst-case, maximin picks that. Unlike expected utility, it won't get swayed by vanishingly small chances; it's binary. Structural focus on minima does block low-probability extremes from controlling the choice, unless they're the worst possible.

  Next, the concrete example: Option A (safe) vs Option B (tiny existential risk). Expected utility would likely favor B unless the disaster utility is negative infinity—that's the fanaticism. Maximin immediately rejects B because its worst outcome (existential disaster) is worse than A's mild disappointment. The user questions if this is rational. I think maximin's insensitivity here is justified when probabilities are unreliable or the stakes are existential. Expected utility's math breaks down when we can't trust probability assessments for extreme events.

  Hybrid approaches? Lexicographic maximin (ignore extreme risks below a threshold) feels arbitrary—who sets the threshold? Risk-capped expected utility (bounding utilities) solves fanaticism but requires justifying where to cap. Neither is perfect, but capping utilities seems more principled if we acknowledge utility functions shouldn't be infinite.

  Deeper theory question: Fanaticism is tied to unbounded utility scales, not expected utility itself. The user might be hinting at whether we should accept unbounded utilities conceptually. I'd argue we shouldn't—real-world rationality probably involves implicit bounds. 

  The user seems sophisticated, likely in philosophy/economics/policy. Their unspoken concern? Navigating decisions like AI governance or climate policy where maximin's caution resonates, but they want rigor. I'll emphasize that maximin's strength is handling uncertainty about probabilities, while expected utility excels with quantifiable risks. Neither wins outright; context matters. 

  Final take: Maximin defends better against unknown extremes, but expected utility is superior for measurable, bounded risks. The real answer might be "both, situationally"—but since they asked which is more defensible for deep uncertainty, I'll lean maximin while acknowledging its limitations.
answer: |-
  Here’s a systematic comparison of expected utility (EU) and maximin frameworks for decisions involving extreme outcomes, addressing your core questions:

  ### 1. **Does Maximin Escape or Suppress Fanaticism?**
     - **Structural Safeguard**: Maximin inherently blocks EU-style fanaticism by ignoring probabilities. It focuses *only* on the worst-case outcome of each option, regardless of likelihood. If outcomes are unbounded (e.g., infinite disutility), maximin *is* driven by extreme possibilities—**but only if they constitute the worst outcome**. However, it does not amplify low-probability events; it treats a 0.0001% risk of catastrophe identically to a 99% risk if both share the same worst outcome.
     - **Critical Divergence**: EU’s fanaticism arises from multiplying unbounded utilities by tiny probabilities. Maximin avoids this by refusing to aggregate outcomes. It suppresses fanaticism *procedurally* but may still select options with severe worst cases if all alternatives are worse—a form of "catastrophism" distinct from probability-driven fanaticism.

  ### 2. **Concrete Evaluation: Option A vs. Option B**
     - **Option A**: Guaranteed moderate benefit (e.g., utility = 10). Worst case: utility = 8 (mild disappointment).  
     - **Option B**: 99.999% chance of utility = 10, 0.0001% chance of existential disaster (utility = -1,000,000,000).  
     
     - **EU Analysis**:  
       - *EU(A)* = 8 (worst case)  
       - *EU(B)* = (0.99999 × 10) + (0.000001 × -1e9) ≈ 9.9999 - 1000 = **-990.0001**  
       EU heavily favors **A** due to the catastrophic weight of the low-probability disaster.  
       - **Fanaticism Risk**: If the disaster utility were *unbounded* (e.g., -∞), EU(B) → -∞ unless the probability is *exactly* zero.  

     - **Maximin Analysis**:  
       - *Worst(A)* = 8  
       - *Worst(B)* = -1,000,000,000  
       Maximin strictly prefers **A** as its worst outcome is vastly superior.  
     
     - **Rationality of Maximin**:  
       - **Strength**: Justified when probabilities are epistemically suspect (e.g., "unknown unknowns" in existential risks) or when avoiding ruin is paramount (e.g., civilizational survival).  
       - **Weakness**: Irrationally rejects B if the disaster probability is *known* to be negligible (e.g., 1/10²⁰) and benefits are urgent. Maximin is insensitive to risk reduction efforts.  

  ### 3. **Hybrid Approaches: Viable Synthesis?**
     - **Lexicographic Maximin (Below Threshold)**:  
       - E.g., Ignore outcomes with probability < ε (e.g., ε = 10⁻⁹).  
       - **Problem**: Arbitrary ε. If ε = 10⁻⁶, Option B’s disaster (p=10⁻⁶) is ignored, making B acceptable. But is 10⁻⁶ "impossible enough"? No principled answer.  
     
     - **Risk-Capped Expected Utility**:  
       - Bound utility functions (e.g., |U| ≤ M, M = 10¹²).  
       - Rescales Option B’s disaster to U = -M, yielding:  
         *EU(B)* ≈ 10 - (10⁻⁶ × M) — which remains positive if M < 10⁷.  
       - **Strength**: Eliminates fanaticism; aligns with empirical risk aversion.  
       - **Weakness**: Choosing M is context-dependent but not arbitrary if tied to scalability of welfare (e.g., planet-sized populations).  

  ### 4. **Theoretical Roots of Fanaticism**
     - **Not EU Itself, But Unboundedness**:  
       Fanaticism arises **iff utilities are unbounded**. EU theory *can* avoid fanaticism with:  
       - Bounded utility functions (e.g., Arrow 1971).  
       - Physical constraints (no literal infinities in real outcomes).  
     - **EU’s Vulnerability**: When utilities lack natural bounds (e.g., "total human extinction" framed as U = -∞), EU mandates fanaticism. Maximin remains stable but at the cost of ignoring probabilities entirely.  

  ---

  ### **Mapping Breakdown & Framework Comparison**
  | **Aspect**               | **Expected Utility**                            | **Maximin**                              |  
  |--------------------------|------------------------------------------------|------------------------------------------|  
  | **Probability Use**      | Explicit weighting                             | Ignored                                  |  
  | **Extreme-Outcome Drive**| Fanaticism (if utilities unbounded)            | Catastrophism (worst-case focus)         |  
  | **Boundedness Response** | Stable if utilities bounded                    | Unaffected                               |  
  | **Epistemic Demands**    | Requires precise probabilities                 | Works under deep uncertainty             |  
  | **Rationality Domain**   | Measurable, repetitive risks (e.g., insurance) | Existential/survival risks (e.g., AI doom) |  

  ---

  ### **Defensible Framework for Deep Uncertainty**
  1. **For Quantifiable Risks**: **EU with Bounded Utility** is superior. It balances stakes and likelihoods without fanaticism if utilities are capped (e.g., Satira’s theorem).  
  2. **For True Deep Uncertainty**: **Maximin** is more defensible. When probabilities are non-credible (e.g., novel catastrophes) or society’s survival is at stake, avoiding the worst outcome rationally trumps probabilistic optimism.  
  3. **Hybrid Recommendation**: **Risk-Capped EU** > Lexicographic Maximin. Capping utilities at a justifiable threshold (e.g., maximum scalable welfare) preserves EU’s sensitivity to probability while avoiding infinities.  

  **Conclusion**: Fanaticism is not intrinsic to EU but to *unbounded utility models*. Maximin escapes it by construction but overcorrects. In policy contexts with extreme stakes (e.g., nuclear war, AI governance), maximin’s caution is defensible—though risk-capped EU offers a more balanced solution where probabilities and stakes can be meaningfully estimated.
