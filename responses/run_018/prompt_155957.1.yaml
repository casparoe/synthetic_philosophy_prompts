reasoning: |-
  We are designing a thought experiment for a political philosophy seminar. The scenario must be realistic, present-day, and set in a single coastal province. The famine occurs despite stable or slightly rising aggregate food availability per capita. The cause must be an entitlement failure driven by a specific institutional choice, not natural shocks. We are to avoid trolleys, perfect predictors, and sci-fi.

  Requirements:
  - Scenario: one paragraph.
  - Cause: entitlement failure from institutional choices (e.g., "priority export bonds" locking grain in port warehouses and a labor-market devaluation tied to a debt restructuring deal).
  - After the scenario, walk through:
    a) What each framework (entitlement vs. food availability decline) says and why.
    b) Isolate the exact feature doing the philosophical work.
    c) What happens if we strip that feature away (e.g., if per-capita food availability plummets)?
    d) How a defender of the natural-disaster framing would attack the case (arguing policy was a response to hidden scarcity).
  - Style: casual, like explaining over coffee.
  - End with the isolating feature in the exact format: \answer{...}

  Thought process for the scenario:
  We need a coastal province. Let's call it "Bay Province". The institutional choices:
  1. "Priority export bonds": The government, to secure foreign exchange for debt repayment, issues bonds that legally require a fixed portion of grain harvests to be stored in port warehouses for export (even if domestic demand is unmet). This locks the grain away from the local market.
  2. A sudden labor-market devaluation: As part of a debt restructuring deal with international creditors, the government devalues the local currency and imposes austerity, leading to massive layoffs in the public sector and a collapse in real wages for informal workers.

  Result: Even though the total food per person in the province is stable (or even slightly up due to a normal harvest), the poor (who have lost jobs or seen wages plummet) can't afford to buy food. Meanwhile, food is physically present but locked for export. This is an entitlement failure: people's legal means of obtaining food (through wages, trade, etc.) collapse.

  Scenario draft:

  "In Bay Province, a debt crisis prompts the government to sign an IMF deal requiring austerity and currency devaluation. Simultaneously, to guarantee loan repayments, it creates 'priority export bonds' that mandate 40% of the grain harvest be stored in port warehouses for foreign buyers. The devaluation causes massive layoffs in the public sector and a collapse in real wages for dockworkers and factory labor. Food prices in the local market surge due to scarcity induced by the export lock, while unemployment soars. Within months, reports emerge of starvation in urban slums and among landless rural workers — even as grain silos at the port remain full and aggregate provincial food availability per capita shows a slight increase from the previous year."

  Now, walking through the frameworks:

  1. **Entitlement framework (à la Sen):** 
     - This classifies the famine as a political crime because the starvation is caused by a collapse in people's entitlements (their ability to acquire food). The institutional choices — the export bonds (which divert food from the domestic market) and the austerity/devaluation (which destroy jobs and incomes) — directly cause the entitlement failure. The fact that food is physically available but inaccessible to the poor highlights that the issue is one of distribution and access, not absolute scarcity.

  2. **Food availability decline (FAD) framework:**
     - This traditional view would either deny that there is a famine (because aggregate food per capita hasn't fallen) or misattribute the famine to natural causes. If forced to acknowledge the starvation, a FAD proponent might point to secondary factors (like the devaluation making food imports more expensive) to argue that there was a hidden scarcity. They might also claim that the export bonds were necessary to prevent a worse outcome (like a total economic collapse) and thus were a response to an underlying scarcity of foreign exchange.

  Isolating the exact feature:
  The key feature is that the famine occurs *despite rising per-capita food availability* and is *driven by a politically chosen institutional lock* (the export bonds) combined with the devaluation that collapses entitlements.

  What if we strip away the key feature?
  If per-capita food availability genuinely plummeted (say, due to a drought), then both frameworks might agree that scarcity is a cause. However, the entitlement framework would still look at why some groups starve and others don't (due to differential entitlements), while the FAD framework would focus on the aggregate shortfall.

  How a natural-disaster defender attacks:
  They would argue that the policy (export bonds and austerity) was a necessary response to a real, albeit hidden, scarcity: the scarcity of foreign exchange. Without exporting the grain, the country would default, leading to even worse economic collapse. Thus, they frame the policy as a tough choice in the face of economic disaster, not a political choice that caused the famine.

  Casual explanation style:
  We'll keep the language conversational.

  End with the isolating feature in the exact format.

  Putting it all together.
answer: |-
  Okay, let's brew up a scenario for your seminar. Picture this:

  "In the coastal province of Marina Bay, facing a crushing sovereign debt crisis, the government negotiates an IMF bailout requiring severe austerity. As part of the deal, it issues 'priority export bonds'—financial instruments that legally mandate 30% of the province's grain harvest be locked in port warehouses exclusively for foreign buyers to guarantee debt repayment. Simultaneously, the deal triggers a sharp currency devaluation, collapsing real wages for the province's vast informal workforce (street vendors, day laborers) and slashing public-sector jobs. Food prices in local markets skyrocket as the export lock creates artificial scarcity, while unemployment soars. Within months, malnutrition surges in urban slums and fishing villages—yet official data shows provincial grain stocks actually rising 2% per capita due to a bumper harvest, with silos at the port sitting full."

  **Walking this through the frameworks:**  
  - **Sen's entitlement framework** calls this a political crime. Starvation isn't from *less food*—it's from broken entitlements: workers' wages evaporated (labor entitlement collapse), and local traders can't access the "locked" grain (trade entitlement failure). The famine is manufactured by policy: the export bonds (deliberately diverting food) and devaluation (crushing purchasing power).  
  - **Food availability decline (FAD) framework** either denies it's a famine ("Look, per-capita food is up!") or misattributes it. It might blame "hidden scarcity" like foreign exchange shortages, arguing the bonds were *necessary* to avoid economic collapse—thus reframing policy choices as passive reactions to natural resource limits.  

  **Stripping away the key feature**: If per-capita food availability *plummets* (say, a real drought hits), FAD defenders win ground. Both frameworks might acknowledge scarcity, but Sen would still emphasize *why* the poor starve first (entitlement inequalities), while FAD reduces it to "not enough food, period."  

  **How a natural-disaster defender attacks**: They’d argue the export bonds weren’t a *choice* but a *response* to the "real" disaster—the debt crisis. "Without foreign cash from exports, the whole economy implodes!" This smuggles in scarcity logic, painting policy as inevitable rather than a political prioritization of creditors over citizens.  

  The core philosophical wrench here? It’s not about whether food exists—it’s about who gets to claim it.  

  \answer{entitlement collapse despite rising per-capita availability driven by a politically chosen institutional lock}
