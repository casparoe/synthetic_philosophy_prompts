prompt: |-
  I'm a retired physicist who's gotten into epistomology lately, and Fitch's paradox has me stuck. If every truth is knowable then every truth is known, but that seems absurd for stuff like the exact momentum of every air molecule in my study right now. So I want your actual credence, 0 to 1, that the best resolution is to deny that knowledge closes over conjuction for distributed empirical properties, rather than saying those physical truths aren't actually knowable in principle or that the modal logic is misapplied. Decompose it for me: rough probabilities for (a) closure failing for complex empirical conjunctions, (b) some physical truths being genuinely in principle unknowable, and (c) the knowability principle being used with the wrong modal system. Then tell me how those combine into your main number, which one it's most sensitive to, and what shape of argument — no citations needed — would shift that sub-credence the most.
