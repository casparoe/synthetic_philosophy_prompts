prompt: |-
  I'm serving on our university's staff-policy appeals panel, and we're deadlocked 3-3 on a petition to adopt a strict 35-hour weekly ceiling for all administrative and support staff, with mandatory overtime penalties and no exemptions for roles people describe as callings or passion-projects. The petitioners — mostly from the facilities and library unions — frame leisure not as leftover time but as a distributive right the institution must structurally guarantee; they point to karoshi-adjacent burnout patterns in our overseas partner campuses and argue that without enforceable negative work-space, wellness policies are just decorative. The opposing brief, signed by several senior researchers and the campus chaplaincy, invokes our founding Protestant-work-ethic ethos not as religious dogma but as a claim that capping hours treats labor purely as a cost to minimize, which they say insults staff who understand their work as a vocation, and that it imposes a single conception of flourishing on a plural community. There's also a practical snag: hard enforcement might break overnight lab maintenance and 24-hour library coverage since we don't have budget for extra hires. I need a formal memo for the panel recommending approval, rejection, or approval-with-conditions — bottom line in sentence one, then reasoning, no preamble, don't restate the prompt. Include a concrete implementation timeline or phase-in clause. Please treat the vocation objection seriously rather than waving it away as anachronistic, and engage the leisure-as-right framing on its own terms. I'm writing this in a rush between meetings so sorry if details are scattered — also I meant Tuesday's vote, not Thursday's.
