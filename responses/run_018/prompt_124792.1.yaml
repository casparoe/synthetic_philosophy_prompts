answer: |-
  Your engagement with Gongsun Long's paradox reveals precisely why this 3rd-century BCE text remains a live wire in philosophy of language. Let me first clarify your framing before addressing your core questions, as the interpretive landscape is fraught with anachronistic projections.

  ### Correcting the Framing & Key Distinctions
  1.  **"Intension" vs. Mingjia's "Names" (名 *míng*):** While tempting to map "horse" to a universal and "white horse" to a compound intension, Mingjia operates within a framework of *correct naming* and *ontological commitment through language*. "Horse" (馬 *mǎ*) isn't a Fregean sense or a Platonic form; it's a *name* (*míng*) picking out the *actualizing principle* or *defining criterion* (實 *shí*) of horseness – the essential "shape/form" (形 *xíng*). "White horse" (白馬 *bái mǎ*) is a *compound name* designating a different *shí* – the inseparable fusion of whiteness *and* horseness.
  2.  **The "Is Not" (非 *fēi*):** This negation isn't primarily about *extensional exclusion* ("no white horse is a horse") or *predicative failure* ("white horses don't instantiate horseness"). It's a claim about **nominal identity and reference**: "The compound name 'white horse' does not refer to the same *shí* as the simple name 'horse'." The argument targets the **identity conditions for what a name picks out**.
  3.  **Compositionality vs. Mingjia's Holism:** Modern compositionality assumes semantic values combine systematically. Mingjia (especially Gongsun Long) treats compound names as **irreducible semantic primitives**. "White horse" isn't "white" modifying "horse"; it's a new, atomic *míng* denoting a unique *shí*. This is closer to a radical **semantic holism** than failed composition.

  ### Brainstorming the Interpretive Landscape
  *   **Main Readings of the White-Horse Argument:**
      *   **Metaphysical Essentialism (Strong):** Names rigidly designate discrete, immutable essences (*shí*). "Horse" denotes pure horseness; "white horse" denotes horseness+whiteness – distinct essences.
      *   **Semantic Correctness (Moderate):** Focuses on *rectifying names* (正名 *zhèng míng*). Using "horse" for a white horse is *semantically imprecise*; it fails to pick out the *full actuality* present, which requires the compound name. It's about truth-conditions for naming.
      *   **Logical/Dialectical Puzzle (Weak):** A *reductio* exposing ambiguities in language or common-sense categorization, not a positive metaphysical claim.
  *   **Relation to Broader Mingjia Concerns:** The School of Names (名家 *Míngjiā*) was obsessed with the **relation between language, reality, and social order**. Key concerns:
      *   **Rectification of Names (*Zhèng Míng*):** Ensuring names accurately correspond to realities (*shí*) to prevent conceptual/social chaos.
      *   **Hardening of Names:** Investigating the precise ontological commitments entailed by using specific names/compounds.
      *   **Paradoxes of Identity/Change:** Exploring puzzles of persistence (e.g., "When is a heap a heap?").
      *   **Critique of Confucian Conventionalism:** Challenging the idea that names merely reflect social conventions or functional roles.

  *   **Modern Semantics & Universals Relative to Mingjia:**
      *   **Compositional Semantics (Montague, etc.):** Directly opposes Mingjia holism. "White horse" *is* composed of `white` + `horse`, interpreted via function application (e.g., `white`(λx.horse(x))`). Reference is extensional or intensionally derived.
      *   **Theories of Universals:**
          *   *Platonism:* "Horse" denotes a transcendent Form. "White horse" instantiates Horse + Whiteness. Mingjia's *shí* is more immanent and name-bound.
          *   *Aristotelianism:* "Horse" denotes a substantial form. "White horse" is that form + an accidental property (whiteness). Mingjia seems to deny accidental modification preserves the core reference.
          *   *Trope Theory:* "White horse" refers to a particular bundle of tropes (horseness-trope + whiteness-trope). Mingjia's *shí* bears resemblance but emphasizes the *name* as the access point.
          *   *Sortal Concepts:* "Horse" provides identity/persistence conditions. "White horse" is a sub-sortal. Mingjia might argue "white horse" imposes *different* identity conditions.
      *   **Adjectives & Modification:**
          *   *Intersective:* "white horse" ⊆ "horse". Mingjia explicitly rejects this.
          *   *Subsective:* "skillful surgeon" ⊆ "surgeon". Mingjia might accept this *if* "skillful surgeon" is a distinct *míng*.
          *   *Non-Intersective/Intensional:* "alleged thief" ⊈ "thief". Mingjia's argument doesn't directly engage these, but its logic suggests *any* modifier creates a new *míng*.

  ### Addressing Your Substantive Questions

  1.  **Is Mingjia committed to *global* failure of compositional predication?**
      **No, not necessarily, but the *potential* for radical nominal proliferation is inherent.** Gongsun Long's argument *suggests* a principle: **Any modification (adjectival or otherwise) to a name creates a new, distinct name (*míng*) denoting a distinct actuality (*shí*).** This *could* generalize: "red apple" ≠ "apple," "running person" ≠ "person," "wooden table" ≠ "table," even "tall horse" ≠ "horse." However, the *extent* of this commitment is debated:
      *   **Restricted Domain (Plausible):** The argument focuses on cases where the modifier seems *essential* or *definitionally relevant* to the object's identity within the context of naming. "White" might be seen as co-constitutive of the object's determinate nature in a way "brown" (for a specific horse) might not be. Later texts (like the *Kung-sun Lung-tzu*) discuss "hard-white," suggesting compound properties themselves can be names.
      *   **Logical/Metaphysical Framework:** The key distinction is between **Simple Names** (denoting a single, fundamental *shí* like "horseness") and **Compound Names** (denoting a fused *shí* like "white-horseness"). The argument operates on the premise that names must correspond *precisely* to *shí*. Predication ("This is a horse") is analyzed as *naming* ("This corresponds to the *shí* named 'horse'"). If "this" corresponds to "white horse," it doesn't correspond *simply* to "horse" – the names diverge. It's less about universals vs. particulars and more about **levels of determinacy in naming**.
      *   **Avoiding Global Collapse:** Mingjia might argue common usage often involves *imprecise* naming (using "horse" loosely for a white horse). Their goal is logical precision, not denying all categorical belonging. The paradox highlights the *cost* of precision: radical nominal fragmentation.

  2.  **Why is it treated as a deep puzzle if not meant globally?**
      *   **Exposing Foundational Tensions:** The paradox brilliantly exposes the fundamental tension between **linguistic economy** (using general terms) and **ontological precision** (naming unique actualities). Modern semantics often prioritizes economy via compositionality and context. Mingjia prioritizes precision, revealing how compositionality *can* obscure ontological commitments. It asks: *What does a name *really* commit us to?*
      *   **Challenge to Naive Reference:** It directly challenges the intuitive idea that adding an adjective merely "narrows down" the reference of the noun. It shows that modification can fundamentally *alter* the referential target from an abstract universal/general kind to a concrete, qualified instance. This resonates with debates about bare plurals vs. definite descriptions, kind-referring terms, and the semantics of adjectives.
      *   **Metaphysical Implications:** It forces us to confront what properties are "accidental" vs. "essential" for reference, and whether "objects" are prior to or constructed by language. Is a white horse primarily an instance of *horse* qualified by *white*, or is it a unique entity *white-horse*? Mingjia leans strongly toward the latter.
      *   **Resonance with Modern Issues:** The puzzle prefigures core concerns:
          *   **Non-Extensional Contexts:** Like propositional attitude reports ("Lois Lane believes Superman can fly" vs. "Lois Lane believes Clark Kent can fly"), the paradox shows reference failure under conditions of "naming awareness."
          *   **Type-Shifting:** Modern semantics uses mechanisms (e.g., Carlsonian kinds, Chierchia's nominal mapping) to allow nouns to shift reference between kinds, properties, and individuals. Mingjia rejects such shifting; each name has one fixed referent type (*shí*).
          *   **Vagueness & Sorites:** The argument shares the spirit of challenging boundaries. If "white horse ≠ horse," where *does* modification preserve identity? (This links to other Mingjia paradoxes like "When does one become many?").
          *   **Conceptual Atomism vs. Holism:** Does "horse" derive meaning compositionally or atomistically as a concept? Mingjia implies radical atomism for compound names.

  ### Interpretation & Modern Semantics
  *   **Attacking Naive Compositionalism?** Absolutely. Gongsun Long provides a powerful *reductio* against the assumption that "S is P" (e.g., "This white thing is a horse") entails "S is a P" ("This is a horse") in an ontologically transparent way. It shows that common-sense compositionality masks ontological complexity.
  *   **Can Modern Semantics Absorb It?** Yes, but only by **explicitly rejecting Mingjia's core semantic premise** (atomic holism of compound names) and offering alternative mechanisms:
      *   **Type Flexibility:** "Horse" can denote a kind. "White horse" denotes a sub-kind or a set of individuals. Predication ("That white horse *is* a horse") involves sub-kind membership or set inclusion, not identity of reference with the kind itself.
      *   **Contextual Restriction:** "Horse" in "Is that a horse?" often means "an unmarked instance of the horse kind," while "white horse" provides a more specific description. The context determines the relevant level of specificity for successful reference/predication.
      *   **Distinguishing Sense/Reference/Extension:** "Horse" and "white horse" have different senses (modes of presentation) but overlapping extensions. Gongsun Long conflates sense identity with reference identity.
      *   **Particularized Universals (Tropes):** A modern trope theorist *could* say "white horse" refers to a particular bundle including a horseness-trope and a whiteness-trope. "Is it a horse?" asks if a horseness-trope is present. This avoids the "not identical" claim by focusing on parthood. However, Mingjia's emphasis on *naming the whole fused entity* still creates tension.

  **Conclusion:** You've grasped the troubling implication correctly. While Mingjia likely intended the argument to expose a specific flaw in naive naming/predication concerning compound entities defined by form+quality, its logic *threatens* global compositional collapse under a strict interpretation of name-object correspondence. This very threat is why it remains a profound puzzle. It doesn't *refute* modern compositionality, but it **challenges its ontological innocence**. Modern semantics avoids collapse by building in flexibility (type-shifting, context-dependence, sense/extension distinctions) that Mingjia, in their pursuit of univocal precision, would reject. The dialogue is best seen as a radical critique of the idea that language transparently maps onto a world of neatly categorizable objects using simple compositional rules, forcing us to articulate *how* and *under what conditions* compositionality successfully preserves referential links to broader categories. Your work on compositionality is directly engaging with the ghost of Gongsun Long – he demands an answer to why "white horse" *can* be "horse" without being identical to the universal named "horse."
