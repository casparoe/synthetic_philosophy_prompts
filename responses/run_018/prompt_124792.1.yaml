  On their second question: Commentators treat it as deep because it forces us to confront compositionality's limits. When "white" + "horse" composes, does it preserve the original sense of "horse"? Modern semantics answers yes through type coercion, but Mingjia denies this via their radical name-object correspondence. The user's "particularized universals" angle is perceptive—this aligns with trope theory or Armstrong's thin particulars. 

  Biggest correction to their framing: The paradox isn't about reference failure but about name individuation. "Horse" names the form (形 xíng), "white horse" names a compound of form and color (色 sè). They're distinct names ergo distinct entities. Modern semantics would counter that natural language allows type-flexible reference. 

