answer: |-
  Here’s a structured pedagogical sequence for your 90-minute seminar, optimized to force Kim’s exclusion dilemma into sharp relief using the institutional case while preempting Davidsonian misconceptions:

  ---

  ### **Pedagogical Sequence**  
  **Total Time:** 90 mins (adjust intervals as needed)  

  #### **I. Setup: The Institutional Case (15 mins)**  
  - **Case Specification:**  
    - *Mental Cause (M):* The board’s collective intentional decision to dissolve the corporation (e.g., a majority vote based on financial reasoning).  
    - *Physical Realizer (P):* The physical signatures on dissolution documents + electronic filings.  
    - *Effect (E):* The legal dissolution of the corporation (recorded in the state registry).  
  - **Crucial Features to Emphasize:**  
    - *P is necessary for E:* Without signatures/filings, dissolution doesn’t occur (even if M exists).  
    - *M is multiply realizable:* Dissolution could occur via mailed papers, digital tokens, etc.  
    - *M lacks temporal-spatial overlap with P/E:* Board meeting (M) precedes signatures (P) and registry update (E).  
  - **Why Institutional > Personal Action:**  
    - Avoids "basic action" ambiguities (e.g., "Is raising an arm mental or physical?").  
    - Cleaves mental content (vote) from bodily movement (signing) cleanly.  

  #### **II. Introduce Principles in Logically Forced Order**  
  1. **Physical Causal Closure (20 mins)**  
     - *Premise:* Every physical effect (E) has a sufficient physical cause (P) at the time it occurs.  
     - *Apply to Case:* Signatures (P) are causally sufficient for dissolution (E). Registry updates follow physical law.  
     - *Dependency:* Must come **first** to establish the physical causal framework.  

  2. **Supervenience Thesis (15 mins)**  
     - *Premise:* The board’s decision (M) supervenes on its physical realizer (P). No change in M without change in P.  
     - *Apply to Case:* The vote (M) occurs *because* of neurophysiological states of board members + physical vote-recording.  
     - *Dependency:* Must follow closure to show M and P are distinct (M ≠ P) but covary.  
     - **Intercept Davidsonian Misconception #1:**  
       > "Davidson’s token identity doesn’t save M’s efficacy: Even if M = P, M’s *mental properties* (e.g., intentional content) aren’t doing causal work *over and above* P’s physical properties."  

  3. **Exclusion Principle (15 mins)**  
     - *Premise:* No effect has >1 *sufficient* cause unless it’s genuine overdetermination (e.g., two bullets).  
     - *Apply to Case:* If P is sufficient for E, M cannot also be sufficient unless M and P are independent causes—but they’re not (due to supervenience).  
     - **Intercept Davidsonian Misconception #2:**  
       > "Anomalous monism doesn’t block exclusion: Supervenience makes M and P *causally dependent*, not independent like two bullets. M’s sufficiency is preempted by P."  

  #### **III. Forcing the Dilemma (10 mins)**  
  - **The Trilemma:**  
    1. M causes E (we want this!).  
    2. But P is sufficient for E (closure).  
    3. M ≠ P and M isn’t independent of P (supervenience), so M is excluded.  
  - **Q to Students:** "Which premise would *you* reject to save M’s efficacy?" (Foreshadowing responses).  

  #### **IV. Diagnostic Question (5 mins post-dilemma)**  
  - **Test for Structural Grasp:**  
    > *"Suppose dissolution (E) occurs without signatures (P)—e.g., a hacker directly manipulates the registry. Would the board’s earlier vote (M) still be a cause of E? Why does this undermine M’s efficacy in the original case?"*  
  - **Correct Answer:**  
    If M isn’t sufficient for E without P (as the case shows), and P is sufficient without M’s *mental properties*, M is epiphenomenal.  

  ---

  ### **Bracketed Strategies & Pedagogical Justifications**  
  1. **Emergentism (e.g., downward causation):**  
     - *Bracket Reason:* "Emergence requires novel causal powers irreducible to parts—but today’s case shows the *whole board’s decision* still depends on members’ physical actions. We’re examining whether supervenience itself permits novelty, not adding new metaphysics."  
     - *Pedagogical Harm:* Distracts from Kim’s core challenge: supervenience + closure → exclusion.  

  2. **Compatibilism (e.g., causal relevance of higher properties):**  
     - *Bracket Reason:* "Compatibilist solutions (e.g., program explanation) often *redefine* causation. Kim’s argument targets productive causation—M’s ability to *generate* E. We’re testing whether M has any such power given P. Save reinterpretations for next week!"  
     - *Pedagogical Harm:* Avoids conflating conceptual/productive causation early on.  

  ---

  ### **Why This Works**  
  - **Institutional Case Advantages:**  
    - Physical closure is unambiguous (legal systems are physically implemented).  
    - Supervenience is explicit (no vote without physical processes).  
    - *Lacks* features that obscure exclusion in personal cases (e.g., "my desire *is* my neural state").  
  - **Ordering Logic:**  
    Closure → Supervenience → Exclusion forces students to see:  
    (1) P suffices for E,  
    (2) M requires P,  
    (3) ∴ M is redundant.  
    *Reversing order (e.g., exclusion first) makes closure seem optional.*  
  - **Davidsonian Neutralization:**  
    Misconceptions intercepted *at premises they distort* (token identity at supervenience, overdetermination at exclusion).  

  This sequence makes the exclusion problem inescapable while using the institutional case to expose fault lines Davidson’s framework can’t repair. The diagnostic question tests comprehension of P’s preemptive sufficiency—the crux of Kim’s argument.
