  Looking at their examples, I notice several recurring themes: they consistently reject environmental determinism, emphasize human mediation, and seem to draw distinctions based on domains of history. The cases where they grant agency (Tambora in cultural history, 1918 flu in labor patterns) involve highly specific, non-substitutable causal chains. Their "compound effect" case (536 CE) introduces threshold considerations that complicate things.

  The user's deepest concern appears to be avoiding reductionism while acknowledging material forces. They're clearly well-read in historical methodology - note how they distinguish between political/cultural/economic domains. The El Niño question at the end suggests they want to test any proposed principle against new cases.

  For a unified framework, I'm considering:
  - Agency requires non-substitutable causal specificity in a defined domain
  - Plus institutional mediation that transforms rather than transmits effects
  - With threshold effects creating emergent properties in compound cases

  This explains why Black Death is rejected (effects were substitutable through other crises) while 1918 flu qualifies (unique age-mortality pattern interacting with gendered labor norms). Tambora works only in cultural history because its confinement effect was uniquely necessary for Frankenstein's creation.

  The 536 CE case fits as a threshold-dependent agent since the combination created unprecedented societal disruption. Classic Maya remains tricky - the drought wasn't sufficient alone, but its effects weren't substitutable either. I'll position it as a "catalyzing condition" that's more than background but less than agent.

  For El Niño 1876-79, I'll apply the principle: if the famine response revealed preexisting colonial administrative failures, it's background; if it created novel labor migrations changing colonial economies, it might qualify as domain-specific agent.

  The most problematic case is Classic Maya because the user wants to reject climate determinism while acknowledging the drought's necessity. My framework handles this by emphasizing how the drought triggered but didn't determine the institutional collapse.
answer: |-
  Your judgments reveal a coherent, multi-pronged principle centered on **causal specificity, domain-restricted necessity, and institutional mediation**. Here's the synthesized framework, with case applications and the El Niño verdict:

  ### Core Principles
  1. **Non-Substitutability Test**: The non-human force must cause effects *not achievable* by pre-existing human structural tensions alone.  
  2. **Domain-Specific Necessity**: The force acts as an agent only in domains where it *directly generates unique historical outcomes* that wouldn't emerge identically from other stressors.  
  3. **Mediated Transformation**: Human institutions must *transform* (not merely transmit) the force's impact, making it irreducible to background.  
  4. **Threshold Emergence** (for compound cases): Combined forces become actors only if they create *emergent, non-additive effects* exceeding the sum of individual impacts.

  ### Case Applications
  | Case                          | Verdict                                | Governing Principle(s)                                                                 |
  |-------------------------------|----------------------------------------|----------------------------------------------------------------------------------------|
  | **Black Death**               | ❌ Not an actor                        | *Fails Non-Substitutability:* Feudalism’s contradictions were resolvable without plague. |
  | **Laki Eruption**             | ❌ Not an actor                        | *Fails Domain-Specific Necessity:* Scarcity alone didn’t dictate revolutionary outcomes. |
  | **Tambora Eruption**          | ✅ Actor in cultural history only      | *Domain-Specific Necessity:* Unique confinement → *Frankenstein*; irrelevant to political/economic outcomes. |
  | **1918 Influenza**            | ✅ Actor in labor history              | *Non-Substitutability + Mediated Transformation:* Age-specific mortality altered gendered labor in ways economic forces alone couldn’t; institutions reshaped (not just reacted to) the shock. |
  | **Classic Maya Drought**      | ⚠️ Catalyzing condition (not agent)    | *Fails Mediated Transformation:* Drought triggered collapse but didn’t determine *how* institutions fragmented; outcomes were path-dependent on pre-existing structures. |
  | **536 CE Compound Event**     | ✅ Threshold-dependent actor           | *Threshold Emergence:* Volcano + plague created synergistic societal rupture (famine + depopulation) beyond either force alone. |
  | **El Niño 1876–79 Famine**    | ⚠️ Domain-specific actor in *colonial* history | *Domain-Specific Necessity:* If ENSO exposed/accelerated colonial resource extraction patterns in novel ways (e.g., reshaping labor flows or anti-colonial resistance), it acts in that domain; otherwise, background stressor. |

  ### Verdict for 1876–79 El Niño Famine
  - **Background Stressor** if famine responses mirrored pre-existing colonial policies (e.g., Britain exporting Indian grain despite shortages).  
  - **Domain-Specific Actor** if ENSO *uniquely reconfigured* colonial systems (e.g., spurring unprecedented labor migrations that dismantled indentured servitude in specific regions). Your "Tambora model" applies best: agency depends on whether ENSO directly generated *novel institutional pathways* in a defined domain (e.g., environmental governance or colonial economics).

  ### Least Comfortable Case: Classic Maya Drought
  - **Tension**: You rightly note the drought’s necessity for the *specific trajectory* of collapse (rapid abandonment). Yet your framework rejects it as an agent because its effects were mediated by pre-existing vulnerabilities (e.g., warfare, trade networks).  
  - **Resolution**: Classify it as a **catalyzing condition**—necessary for timing/scale but not an "actor" since institutional fragmentation was overdetermined by human structures. This preserves your anti-determinism while acknowledging contingency.

  ### Why Your Judgments Hold
  - **Anti-Reductionism**: You consistently require human institutions to *interpret* and *reshape* non-human forces, avoiding determinism.  
  - **Domain Sensitivity**: Forces act only where they produce irreplaceable causal chains (e.g., Tambora in literary history).  
  - **Thresholds for Complexity**: Compound events (536 CE) gain agency only when synergy creates emergent crises.  

  **Conclusion**: Your intuitions are principled. Abandon none—refine the Maya case as "catalyzing condition" and assess ENSO through domain-specific necessity. The unifying insight: **Non-human forces become historical actors when their *unique signature* is materially inscribed into transformed human practices within a defined sphere of activity.**
