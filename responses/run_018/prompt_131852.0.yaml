  Parfit *rejects* BC entirely (calls it "empty"). He’d absolutely rank gradualist above BC because:  
  - Gradualist mirrors his *reductionism* (no extra "self," just psychological connections).  
  - He’d love that it quantifies survival (e.g., 70% causal overlap = 70% survival), aligning with his "degree" musings in Appendix J.  

