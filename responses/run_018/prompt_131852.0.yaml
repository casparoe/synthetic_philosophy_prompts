  - **C: Soul view**  
    *Fails both: instant copies create soul ambiguity, and slow replacement offers no testable mechanism for soul persistence.*  

  **Parfit?** Yes, he’d rank gradualist above bodily continuity—he rejected bodily continuity as irrelevant and valued psychological/relational factors.
