  - **B-tier (Works for one scenario only):** **BC.** Only handles slow replacement (body stays "you"). Instant copy? You die; a clone lives.  
  - **C-tier (Fails both):** **Soul.** Untestable, irrelevant to sci-fi mechanics. Instant copy? Soul dilemma. Slow replacement? Soul either moves or doesn’t—no clear answer.  

