prompt: |-
  I cover science and ideas for a general-interest magazine, and I'm working on a follow-up piece about how governments should weigh the interests of future generations. Earlier this year I interviewed a moral philosopher who works on population ethics, and I have her verdicts on a set of hypothetical cases in my notebook. First, a couple knows that due to an unavoidable genetic circumstance, any child they can ever conceive will be born with a serious hearing impairment but will have a life clearly worth living; she said such a child is neither harmed nor wronged by being conceived, since it could not have existed without the condition. Second, a teenager can either have a child now, knowing the child will face real disadvantages but still have a worthwhile life, or wait ten years and have a different child with much better prospects; she said the teenager ought to wait, and that having the child now would be wrong even though that particular child is not made worse off than it otherwise would have been. Third, comparing two public health programs of equal cost -- one that screens women before conception and one that treats women during pregnancy, each preventing the same number of cases of the same condition, but where the first changes which children are born while the second benefits children who would exist anyway -- she said the programs are morally on a par. Fourth, a society choosing between conserving its resources and spending them freely, where the choice gradually changes which people come to exist and the spendthrift path leaves future people with somewhat worse but still worthwhile lives; she called the spendthrift choice wrong, full stop.

  My follow-up concerns a policy debate that raises a case my interview never touched. A government is choosing between two long-run energy strategies. The first supports a future population of several hundred million people living comfortable but unremarkable lives; the second supports a population of a few tens of millions living genuinely flourishing ones. On any reasonable accounting, the first future contains considerably more total wellbeing, while the second has a much higher average quality of life -- and, as in the earlier cases, nearly everyone in either future owes their very existence to which strategy is chosen, since the policies will shape patterns of life and family for centuries. I want to predict her verdict before I call her, and I'd like your help reasoning it through. Which general principles are jointly consistent with all four of her recorded verdicts -- I'm assuming at least an impersonal total view and an impersonal average view both fit, and I'd like to know whether any person-affecting principle could fit them too -- and what does each of those principles predict about the energy case? Which verdict should I predict, and why? Finally, since I only have fifteen minutes with her, what single further hypothetical would most efficiently settle which principle she's actually running?
reasoning: |-
  Okay, the user is a science writer for a general-interest magazine working on a piece about future generations. They've interviewed a moral philosopher specializing in population ethics and have four of her verdicts on hypothetical cases. Now they're tackling a new energy policy scenario with two options: one leading to a larger population with moderate wellbeing, the other to a smaller population with high wellbeing. They want to predict the philosopher's stance and identify underlying principles.

  First, I need to dissect the four existing verdicts to find consistent ethical principles. The first case involves a couple having a child with a hearing impairment. The philosopher says it's not harmful or wrongful since the child wouldn't exist otherwise. This rejects the "person-affecting principle" because the child isn't worse off compared to nonexistence.

  The second case is a teenager choosing between having a child now with disadvantages or waiting for a better-off child later. She says waiting is obligatory, even though the disadvantaged child isn't worse off. This suggests a "totalist" view where bringing a worse-off child into existence is wrong because of the alternative. It also hints at a "non-identity problem" where identity-dependent harms are tricky.

  The third case compares two public health programs: one prevents disabilities by changing who is born (pre-conception screening), the other treats existing pregnancies. She says they're morally equal. This aligns with "totalism" since both reduce disability cases equally, regardless of whether different people exist. Person-affecting views would typically see them differently.

  The fourth case involves resource conservation vs. spending, where spending changes who exists and leaves future people worse off. She condemns the spendthrift choice entirely. This supports an "impersonal total view" because the future has less total wellbeing. Average utilitarianism might not condemn it since lives are still worthwhile, so totalism fits better here.

  Putting it together, all four verdicts align with "total utilitarianism" (maximizing total wellbeing). The energy case has a large population with moderate wellbeing versus a small one with high wellbeing. Total wellbeing is higher in the first scenario, so the philosopher would likely favor that one.

  For person-affecting principles, "wide person-affecting" might fit some cases but struggles with the fourth. In the spendthrift case, future people are worse off than if a different policy created better-off people. But since they wouldn't exist otherwise, they aren't harmed. The philosopher still condemns it, which contradicts strict person-affecting views.

  To confirm her principle, a hypothetical could pit total against average utilitarianism. For example, a policy creating fewer people with very high average wellbeing versus more people with slightly lower average but higher total wellbeing. If she prioritizes total wellbeing, it's total utilitarianism; if average, she'd choose the smaller group with higher averages. Since she condemned the spendthrift policy despite worthwhile lives, she likely prioritizes total.

  The user also wants an efficient hypothetical for their short interview. A case like "Policy A creates 10 million people at 100 wellbeing each; Policy B creates 5 million at 110 wellbeing each" would test total vs. average. If she chooses A (total wellbeing 1000M vs. 550M), it's total utilitarianism. If B (higher average), it's average. Given her past verdicts, especially condemning the spendthrift path which reduced total wellbeing, she'd likely choose Policy A.

  So, predicting she'd favor the energy strategy with more total wellbeing. The efficient hypothetical to confirm is contrasting total and average outcomes directly.
answer: |-
  Based on her four verdicts, the philosopher is almost certainly operating within a **Total Utilitarian (Impersonal Total View)** framework. Let's break down the reasoning, principles, predictions, and your efficient test:

  ### 1. Consistent Principles Derived from Her Verdicts
  *   **Total Utilitarianism (Impersonal Total View) FITS PERFECTLY:** This principle holds that the right action maximizes the *total sum* of wellbeing in the universe, regardless of *who* experiences it or whether specific individuals are made better or worse off.
      *   *Case 1:* The child with impairment has a life worth living, so its existence *adds* positive wellbeing to the total sum. Since it couldn't exist without the impairment, not conceiving it would result in *less* total wellbeing (by the amount of its worthwhile life). Hence, no harm/wrong.
      *   *Case 2:* Waiting allows a child with a *higher* level of wellbeing to be born. This child contributes *more* to the total sum than the disadvantaged child would have. Therefore, having the child now (lower total contribution) is wrong, even though the specific child isn't harmed.
      *   *Case 3:* Both programs prevent the *same number* of impairments. Assuming the severity prevented is identical, both programs result in the *same increase in total wellbeing* compared to doing nothing (fewer instances of negative wellbeing/loss of potential positive wellbeing). Hence, morally on a par.
      *   *Case 4:* The spendthrift path leads to future people with *lower individual wellbeing* than the conservation path *would have* produced for the different people who *would have* existed. Crucially, the *total sum of wellbeing* in the spendthrift future is lower than the total sum in the conservationist future. Therefore, it is wrong ("full stop") because it fails to maximize total wellbeing.

  *   **Average Utilitarianism (Impersonal Average View) DOES NOT FIT:** This principle holds that the right action maximizes the *average level* of wellbeing.
      *   *Case 1:* Fits (Average unaffected by one impaired child in a large population).
      *   *Case 2:* Fits (Higher average wellbeing by waiting).
      *   *Case 3:* Fits (Preventing impairment likely increases average wellbeing similarly).
      *   ***Case 4: DOES NOT FIT.*** The spendthrift path leads to future people with lives that are "somewhat worse but still worthwhile." An average utilitarian would likely find this acceptable *as long as the average remains positive and isn't catastrophically low*. They might even prefer it if the larger population under spendthriftness (implied by the gradual change) had a *higher* average than a smaller conserved population (though the description doesn't specify relative population sizes here). Her unequivocal condemnation ("wrong, full stop") strongly contradicts an average view in this scenario. Average utilitarianism struggles to condemn creating large populations with lives barely worth living if the average is positive, which her verdict does.

  *   **Person-Affecting Principles STRUGGLE TO FIT:** These principles focus on whether actions make *particular individuals* better or worse off.
      *   *Strict Person-Affecting View:* Only actions that make existing or future *identifiable* individuals worse off than they *otherwise would have been* can be wrong. Fails Case 1 (child not worse off), Case 2 (child not worse off), Case 3 (pre-conception screening doesn't help identifiable children), and especially Case 4 (future people under spendthriftness aren't worse off than *they* would have been - they wouldn't exist otherwise).
      *   *Wide Person-Affecting View:* May consider harming potential people or failing to benefit them. A "Same Number, Non-Identity" variant (focusing on choices affecting the *same number* of future people) fits Case 1 and Case 2 (choosing the *better-off* child benefits the specific person who exists). However, it **fails Case 3** (pre-conception screening creates *different* people, so a wide PA view often sees no one harmed by *not* screening, making it morally different from treatment which helps existing identifiable people). It also **fails Case 4** for the same reason as Case 3 and the average view: a wide PA view typically wouldn't condemn creating people with worthwhile lives just because *different* people with *better* lives *could* have been created, especially if the number differs (implied by the gradual change).

  **Conclusion on Principles:** Only **Total Utilitarianism** consistently explains *all four* of her verdicts. Her condemnation in Case 4 is the strongest evidence against Average Utilitarianism and strict/wide Person-Affecting views.

  ### 2. Predicting Her Verdict on the Energy Case
  *   **Scenario:** Choice between:
      *   **Strategy A (Large Population):** Several hundred million people, comfortable but unremarkable lives → High **Total Wellbeing**, Lower **Average Wellbeing**.
      *   **Strategy B (Small Population):** Few tens of millions, genuinely flourishing lives → Lower **Total Wellbeing**, Much Higher **Average Wellbeing**.
      *   **Key:** "Nearly everyone in either future owes their very existence to which strategy is chosen" (Non-Identity Problem applies).

  *   **Prediction based on Total Utilitarianism:** She will favor **Strategy A (Large Population)**. Total Utilitarianism dictates choosing the future with the greatest *sum total* of wellbeing. Strategy A explicitly has "considerably more total wellbeing" than Strategy B. The higher average in Strategy B is irrelevant under this principle; the total sum is the sole criterion. The non-identity aspect (different people exist) is also irrelevant under totalism – only the sum matters.

  *   **Why not Strategy B?** While Strategy B has a higher average, its *total* wellbeing is lower. Total Utilitarianism would only prefer a smaller population with a higher average if the *product* (population size * average wellbeing) was larger. Here, it's explicitly stated that Strategy A has "considerably more total wellbeing."

  **Your Prediction:** You should predict she will say the government **should choose Strategy A (Large Population)** to maximize total wellbeing.

  ### 3. The Efficient Hypothetical Test
  Given only 15 minutes, you need a hypothetical that directly pits Total Utilitarianism against Average Utilitarianism in a way that mirrors the tension in the energy case and leverages her previous reasoning (especially her verdict in Case 4).

  *   **The Test Case: The Island Policy**
      *   "Imagine a sovereign island nation must choose one of two permanent population policies:
          *   **Policy Alpha:** Results in a stable population of 10 million people, each with a very high wellbeing level of 100 units (arbitrary scale, life worth living starts at 0).
          *   **Policy Beta:** Results in a stable population of 100 million people, each with a wellbeing level of 11 units (clearly above 0, worthwhile lives, but modest).
      *   Due to complex social/economic path dependencies, each policy leads to entirely different sets of people existing on the island centuries from now. There is no feasible way to achieve high wellbeing for a large population or a medium-sized population with medium wellbeing; it's strictly one or the other.
      *   **Question:** Based on your principles, which policy should the island choose?"

  *   **Why this test is efficient:**
      1.  **Direct Total vs. Average Conflict:** Total Wellbeing (Alpha: 10M * 100 = 1 Billion units; Beta: 100M * 11 = 1.1 Billion units). Average Wellbeing (Alpha: 100; Beta: 11).
      2.  **Clear Non-Identity:** Different people exist under each policy.
      3.  **Mirrors Energy Case:** Directly analogous to your energy scenario (large pop modest wellbeing vs. small pop high wellbeing), making the link obvious.
      4.  **Reveals Core Principle:**
          *   A **Total Utilitarian** *must* choose **Beta** (Total WB = 1.1B > 1.0B).
          *   An **Average Utilitarian** *must* choose **Alpha** (Avg WB = 100 > 11).
      5.  **Leverages Previous Verdict (Case 4):** Her condemnation of the spendthrift path (lower total WB future) strongly suggests she will choose Beta here. If she hesitates or chooses Alpha, it would be a major inconsistency with Case 4, forcing clarification of her underlying view.

  **Your 15-Minute Plan:** Briefly confirm your understanding of her four verdicts aligns with Total Utilitarianism (she'll likely agree). Present the **Island Policy** hypothetical. Her answer will definitively confirm (Beta) or seriously challenge (Alpha) the Total Utilitarian interpretation. If she chooses Alpha, probe how this reconciles with her verdict on the spendthrift society (Case 4).
