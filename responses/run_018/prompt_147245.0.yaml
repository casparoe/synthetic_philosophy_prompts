  We are preparing a six-month fellowship proposal on the philosophical conditions for valid consent, focusing on the concept of "normative authorship". The proposal must address several key components without empirical data collection and without a bibliography.

  Components:
  1. **Research Question**: A precise statement and why treating deception, coercion, and incompetence as separate failures leaves institutional cases poorly explained.
  2. **Philosophical Method**: Conceptual analysis of hard cases, comparison with legal doctrine on informed consent, and evaluation of whether a unified normative-authorship account can be made coherent without collapsing important distinctions.
  3. **Month-by-Month Work Plan**: Appropriate for six months.
  4. **Concrete Deliverable for Practitioners**: For institutional review boards or policy drafters.
  5. **What Would Count as Failure**: What result would mean the project failed.
  6. **Justification for Philosophical Research**: Why fund philosophy rather than empirical or legal research.

  Let's break down each section.

  ### 1. Research Question
  **Precise Statement**: 
  "How should we understand the philosophical conditions for valid consent, particularly in institutional settings, such that deception, coercion, and incompetence are not merely independent vitiating conditions but potentially manifestations of a single underlying deficit in normative authorship? And can such a unified account preserve the important distinctions among these conditions?"

  **Why separate treatment leaves institutional cases poorly explained**:
  In institutional settings (e.g., clinical trials, data-use agreements), the consent framework is pre-structured and non-negotiable. Treating deception, coercion, and incompetence as separate failures overlooks how they might all stem from the same root: the consenting party's inability to be the normative author of the framework within which consent is given. For instance:
  - **Deception**: Misrepresentation of facts within a fixed framework.
  - **Coercion**: Undue pressure applied within a fixed framework.
  - **Incompetence**: Lack of capacity to engage with the fixed framework.

  In each case, the institutional structure imposes a normative framework that the individual cannot alter, which may undermine their agency. A unified account via normative authorship could explain why these seemingly distinct failures all invalidate consent in such settings.

  ### 2. Philosophical Method
  The project will employ three interconnected philosophical methods:
  - **Conceptual Analysis of Hard Cases**: Examining challenging real and hypothetical consent scenarios in institutional contexts to reveal limitations in current models and test the robustness of normative authorship.
  - **Comparison with Legal Doctrine**: Analyzing key legal cases and doctrines (e.g., informed consent in tort law, regulatory standards) to identify alignments and tensions with the proposed account. This will help ensure the theory is grounded in practical legal concerns.
  - **Evaluating Coherence without Collapse**: Systematically assessing whether normative authorship can provide a unified explanation of deception, coercion, and incompetence as manifestations of a single deficit (lack of normative authorship) while preserving the distinct roles each condition plays in invalidating consent.

  ### 3. Month-by-Month Work Plan (6 months)
  - **Month 1**: Literature review and refinement of the concept of normative authorship. Focus on philosophical foundations (e.g., autonomy, agency) and existing accounts of consent. Initial mapping of how deception, coercion, and incompetence are typically treated.
  - **Month 2**: Conceptual analysis of hard cases in institutional consent. Develop a set of paradigmatic cases (e.g., clinical trial consent with complex disclosures, data agreements with hidden clauses) and analyze them through the lens of normative authorship versus traditional models.
  - **Month 3**: Comparison with legal doctrine. Examine key legal cases (e.g., Canterbury v. Spence, Montgomery v. Lanarkshire) and regulations (e.g., Common Rule, GDPR) to understand how the law handles these vitiating conditions and whether it implicitly recognizes a notion like normative authorship.
  - **Month 4**: Develop the unified account. Articulate how normative authorship can explain deception, coercion, and incompetence as manifestations of a single deficit without collapsing their distinctions. Address potential counterarguments and refine the model.
  - **Month 5**: Test the account against objections and hard cases. Evaluate whether the unified account can handle edge cases and whether it remains philosophically coherent and practically applicable.
  - **Month 6**: Draft the main paper and the practitioner deliverable (see below). Begin preparing a journal article for philosophy audiences and a separate, accessible guide for practitioners.

  ### 4. Concrete Deliverable for Practitioners
  The deliverable will be a **"Framework Assessment Tool for Normative Authorship in Consent Processes"** – a concise, structured guide (approximately 10-15 pages) designed for institutional review boards (IRBs), policy drafters, and ethics committees. It will include:
  - **Checklist of Questions**: To evaluate whether a consent process respects normative authorship (e.g., "Does the individual have meaningful opportunity to question or shape the normative framework of the agreement?").
  - **Case Examples**: Illustrative scenarios showing how deficits in normative authorship manifest in deception, coercion, or incompetence, and how to address them.
  - **Design Recommendations**: Practical steps for designing consent processes that enhance normative authorship (e.g., incorporating flexibility in institutional frameworks where feasible, ensuring transparency about non-negotiable elements).

  ### 5. What Would Count as Failure
  The project would fail if:
  - The concept of normative authorship proves incoherent or collapses the important distinctions among deception, coercion, and incompetence, thereby offering no advantage over existing models.
  - The unified account cannot be applied to institutional settings in a way that provides new insight or practical guidance, rendering it merely a theoretical exercise without real-world relevance.
  - The analysis reveals that normative authorship is either too demanding (impossible to achieve in institutional contexts) or too vague to be operationalized.

  ### 6. Justification for Philosophical Research
  Foundations should fund this philosophical research because:
  - **Foundational Nature**: The question of what makes consent valid is fundamentally philosophical, touching on deep concepts of autonomy, agency, and normativity. Empirical research can describe how consent operates, but cannot resolve normative questions about when it *should* be considered valid. Legal research often focuses on existing standards without challenging their underlying assumptions.
  - **Gap in Current Approaches**: While empirical and legal scholarship address consent, they often treat deception, coercion, and incompetence as separate issues without exploring a unifying theoretical foundation. Philosophy is uniquely positioned to develop and critique such foundations.
  - **Practical Impact**: A successful philosophical account can reshape how institutions design consent processes, leading to more ethically robust practices. Without addressing the philosophical underpinnings, empirical and legal work may build on unstable conceptual ground.

  **Overall Structure of Proposal**:
  - Title: Normative Authorship: A Unified Account of the Conditions for Valid Consent in Institutional Settings
  - Introduction and Research Question
  - Background and Gap (why current separate treatment is inadequate for institutional consent)
  - Philosophical Method
  - Work Plan (month-by-month)
  - Deliverables (academic and practitioner-oriented)
  - Evaluation of Success/Failure
  - Justification for Philosophical Approach

