  On implications: Thomson never claimed supertasks are logically impossible - he showed they can lead to indeterminacy. The leap to hypercomputation is especially shaky. Even if output states were indeterminate (which isn't necessarily true for computations), it wouldn't make hypercomputation incoherent - just problematic for certain types of limit-state readings.

