answer: |-
  The decline of dueling and similar practices illustrates a fundamental conceptual distinction in understanding "honor" and its role in social change. To address your query, we must dissect the **equilibrium interpretation of honor** versus the **internalized norm view**, and confront the **classificatory problem** for moral revolutions.

  ### 1. **Dueling's Decline: Honor as Coordination Equilibrium**
     - **Honor as Strategic Equilibrium**: Under this view, honor is not primarily an internal moral commitment but a *social coordination game*. Individuals engage in practices like dueling to avoid reputational costs (shame, exclusion) imposed by third parties who enforce communal norms. The "payoff matrix" involves:
       - *Cost of refusal*: Social ostracism, loss of status ("cowardice").
       - *Cost of compliance*: Physical risk or legal penalty.
     - **State Monopolization of Violence**: When states criminalize dueling and assert a monopoly on legitimate violence, they restructure this payoff matrix:
       - Legal penalties raise the cost of compliance (dueling).
       - State enforcement undermines third-party sanctioning. Refusing a duel no longer triggers reputational costs because the state punishes those who enforce the "old" honor code (e.g., by prosecuting seconds or challengers).
       - *Result*: The equilibrium collapses. Withholding recognition (calling someone a coward) ceases to be socially effective, and granting status for dueling becomes costly.

     **Why this is neither moral sentiment nor material interest**:
     - It’s not a shift in *private morality*: Many duelists privately feared or disapproved of dueling but participated to avoid shame.
     - It’s not *exogenous material change*: The material interests of elites (e.g., maintaining social rank) often aligned with preserving dueling. The state’s intervention reconfigured the *social costs* of reputation management.

  ### 2. **The Classificatory Problem: Practice Collapse vs. Belief Persistence**
     When a practice (e.g., dueling) disappears while supporting beliefs ("refusal is dishonorable") persist, we face a trilemma:
     - **Argument-Driven Change?** Unlikely, if beliefs endure.
     - **Interest-Driven Change?** Possible, but interests often favored the status quo (e.g., elites lost a status marker).
     - **Honor-Driven Change?** Only under the **equilibrium interpretation**: The *enforcement mechanism* collapsed, not the belief itself.

     **Conceptual Mistake**: Assuming that the survival of a normative belief (*second-order belief*) necessitates the survival of the corresponding *practice*. This conflation ignores:
     - **Institutional Scaffolding**: Norms require reinforcement mechanisms (third-party sanctions). If these are dismantled (e.g., by state action), the practice can vanish while beliefs linger.
     - **Belief-Practice Decoupling**: Individuals may retain beliefs but cease practicing because:
       - The social cost of non-compliance drops (no reputational penalty).
       - The cost of compliance rises (legal punishment).

     *Example*: Post-abolition, many White Southerners still believed slavery was morally justified and racially necessary, but Reconstruction and federal power prevented reversion. The practice collapsed due to institutional restructuring, not belief extinction.

  ### 3. **Why This Distorts Assessments of Moral Reasoning**
     The mistake leads to two false conclusions about moral progress:
     - **Pessimistic View**: If practices only change when interests align, moral reasoning seems epiphenomenal.
     - **Overly Optimistic View**: If practices collapse while beliefs persist, moral arguments appear futile.

     **Corrective Insight**: Moral reasoning can be *causally efficacious* by:
     - **Altering Institutional Payoffs**: Moral arguments can motivate state action (e.g., criminalizing dueling/slavery), which restructures the equilibrium.
     - **Shaming Third-Party Enforcers**: Campaigns can target not practitioners but those who enforce shame (e.g., framing duel-challengers as barbaric).
     - **Creating New Equilibria**: Moral discourse can help establish *new* coordination points (e.g., honoring "civility" over violence).

  ### Conclusion: Toward a Synthetic Framework
  The decline of dueling was **honor-driven under the equilibrium interpretation**: State intervention collapsed the reputational enforcement system, making the old honor code unsustainable. For moral revolutions more broadly:
  - **Classify shifts as *institutionally-driven*** when practice collapse outpaces belief change. Dueling and slavery ended through **coercive institutional restructuring**, not voluntary moral enlightenment.
  - Moral reasoning *gains traction* not by directly changing hearts/minds, but by enabling institutional redesign that alters social payoffs. Thus, moral argument is neither impotent nor independently sufficient—it operates through **mediating institutions**.

  This resolves the false dichotomy: Moral reasoning *can* drive change, but only when it converges with shifts in the *material and reputational infrastructure* that sustain social practices. The survival of normative beliefs amid practice collapse underscores that institutions, not individual ethics, are the primary levers of large-scale behavioral change.
