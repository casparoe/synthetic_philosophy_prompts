  hey so i was arguing with my coworker over lunch — he's frontend, i'm backend — about why MIT licenses are called "liberal" licenses since they let you do basically whatever with the code, but then i remembered that in europe "liberal" usually means free-market center-right and in the US it means like progressive big-government stuff. i got curious if there's actually some deep philosophical thread connecting these, or if the word just split into three seperate meanings by accident. i have no formal philosophy training, just a cs degree, but i'm taking this casual online course on political ideas and now everything feels muddled.

