  hey, i'm trying to wrap my head around this chunk from macaulay's history of england, the part where he describes the glorious revolution as the natural fruit of a long series of causes stretching back through the reformation and magna carta. he treats the past like a conveyor belt delivering the present - the english people slowly learning self-government for centuries, so 1688 was less an accident and more the harvest of seeds planted long before.

  i'm stuck on wheter this is just rhetorical flourish or if he's actually doing a specific reasoning move that assumes the present is the correct endpoint. there's this idea from forecasting blogs about referance-class neglect - picking your reference class after you know the outcome - and it feels like macaulay is doing that with history. he groups every prior event that led to 1688 and calls them progress, but if james ii had won or the dutch invasion failed, he'd probly group different prior events to explain that outcome instead. is that a fair read? or am i importing modern epistemic hygiene into a 19th-century narrative that wasn't trying to be predictive?

  i don't need citations or a reading list, just want to know if the passage is actually making a causal claim or just telling a just-so story, and whether the framing helps or distorts it. there's a typo somewhere in my notes but ignore it.
