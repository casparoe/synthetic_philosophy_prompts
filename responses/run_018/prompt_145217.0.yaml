  2. **The MIU system as a specific undecidable problem**: The MU-puzzle is a very simple system with a known decision procedure (it's actually decidable, but Hofstadter presents it as mysterious until the "jump"). However, in the book, it's used to illustrate the idea of undecidability. In proof assistants, undecidability is inherent in the theory (e.g., the halting problem for Turing machines). The mapping is by analogy: the MIU system is a microcosm of undecidability, but in proof assistants we deal with more complex and fundamental undecidability.

  3. **Self-referential types**: In dependently typed systems, we can define types that refer to themselves in a controlled way (e.g., induction-recursion). But these are carefully designed to avoid paradoxes (via strict positivity). The distortion is that the system doesn't allow arbitrary self-reference, so the "danger" of inconsistency is managed.

