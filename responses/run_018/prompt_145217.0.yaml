  - **Object-level**: the core language of terms, types, and proofs (e.g., the Lean kernel).
  - **Meta-level**: tools and languages for manipulating object-level expressions (e.g., Lean's meta-language for writing tactics).

  **Reflection**: The ability to represent object-level constructs (like syntax and proofs) at the object-level and reason about them. For example, in Lean, we can define an inductive type representing the syntax of a fragment of the language and write a function that evaluates it (partial reflection).

  **Self-referential types**: Types that depend on values, which can encode properties of the system. For example, a type that represents a proof of consistency of the system.

  Restated claim using these terms:
  > A formal system at the object-level cannot internally establish its own consistency without resorting to a meta-level. The object-level lacks the necessary perspective to "see" its own consistency, and attempts to encode self-referential statements (like a consistency proof) are either impossible or require a meta-level justification.

