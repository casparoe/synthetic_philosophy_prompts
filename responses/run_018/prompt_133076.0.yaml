answer: |-
  Here is a comprehensive set of desiderata for a theory of population ethics, structured as requested. These criteria define the "job description" for an adequate axiology, highlighting where philosophical labor is crucial:

  ### I. Core Evaluative Constraints & Cases
  1.  **Avoiding the Standard Repugnant Conclusion (Non-Negotiable Core Challenge)**
      *   **Case:** Must *not* judge Z (vast population with lives barely worth living) as better than A (smaller population with very high welfare), where Z's total welfare exceeds A's only due to sheer numbers.
      *   **Motivation:** Intuition that the quality of lives matters intrinsically, not just aggregate quantity. Sacrificing excellence for mediocrity seems wrong.
      *   **Theories:** *Totalism* fails spectacularly. *Critical-Level* (if CL > 0) avoids it. *Person-Affecting* often avoids it if Z-lives aren't deemed "better off."

  2.  **Avoiding the Reverse Repugnant Conclusion (Significant Challenge, Reveals Structural Flaws)**
      *   **Case:** Must *not* judge B (enormous population with *extremely* high welfare) as *worse* than A (smaller population with very high welfare) *purely* due to structural features like:
          *   **Identity-Indeterminacy:** B involves different, non-actual future generations whose identities depend on choices made now.
          *   **Replacement vs. Addition:** B involves replacing existing lineages with different, happier ones, rather than merely adding new people.
          *   **Discontinuity:** Tiny welfare increases for a vast number lead to a discontinuous drop in overall value compared to A.
      *   **Motivation:** Intuition that creating vastly more beings with extraordinarily good lives shouldn't be *morally inferior* to sustaining fewer such lives, especially if the alternative involves preventing those good lives from existing. Flags risks of overemphasizing identity, replacement aversion, or demanding excessive continuity.
      *   **Theories:** *Critical-Level* (if CL too high) can fail (judging B worse than A if average/CL-adjusted total dips slightly below A). *Strong Person-Affecting* (e.g., Narveson's "make people happy, not happy people") often fails, prioritizing existing identities. *Totalism* avoids this specific failure.

  3.  **Navigating the Non-Identity Problem Without Collapsing into Pure Actualism (Non-Negotiable for Intergenerational Justice)**
      *   **Case:** Must explain why Policy X (e.g., depleting resources, causing climate change harming future people) can be wrong even if the specific future people harmed wouldn't exist had we chosen Policy Y (a sustainable policy). Their lives, though harmed, may still be worth living compared to non-existence.
      *   **Motivation:** Pure Actualism (only existing/future actual people matter; no complaint if life is net positive) seems to permit harmful policies affecting future generations whose identities depend on our choices. An adequate theory must find moral traction here.
      *   **Theories:** *Totalism/Critical-Level* handle this easily (Policy Y creates higher total/CL-adjusted welfare). *Person-Affecting* views struggle severely; *impersonal* or *wide person-affecting* variants are needed.

  4.  **Distinguishing Addition, Replacement, and Welfare Trajectories (Crucial for Policy Precision)**
      *   **Cases:**
          *   **Addition:** Adding a happy person to an unchanged existing population.
          *   **Replacement:** Choosing a policy that results in a *different set* of future people (with higher welfare) instead of the set that would otherwise exist.
          *   **Welfare Trajectory Alteration:** Improving (or harming) the welfare of future people *who would exist anyway*.
      *   **Motivation:** Intuitions differ significantly about the moral equivalence of these actions. A theory must not *a priori* collapse them. Adding happy people often seems good; replacing lineages raises identity/consent concerns; harming trajectory is clearly bad. Policies often involve mixtures.
      *   **Theories:** *Totalism/Critical-Level* often collapse Addition & Replacement (both increase value). *Person-Affecting* views sharply distinguish them (Addition often neutral/mildly good; Replacement problematic; Harming Trajectory clearly bad).

  ### II. Structural & Rational Choice Constraints
  5.  **Transitivity (Non-Negotiable for Rational Choice)**
      *   **Constraint:** If A > B and B > C, then A > C. Must hold for the betterness relation.
      *   **Motivation:** Foundational for rational decision-making and coherent betterness orderings. Violations lead to money pumps and cyclic preferences.
      *   **Tension:** Avoiding *both* Repugnant Conclusions while maintaining transitivity is highly demanding (see Arrhenius' Impossibility Theorems).

  6.  **Completeness (Contested, but Highly Desirable for Practicality)**
      *   **Constraint:** For any two populations A and B, either A > B, B > A, or A ~ B (equally good).
      *   **Motivation:** Needed for unambiguous policy guidance under certainty. Incompleteness leaves dilemmas unresolved.
      *   **Tension:** Avoiding problematic conclusions (e.g., both Repugnant Conclusions, Mere Addition Paradox) might *require* incompleteness in some cases involving different populations. *Person-Affecting* views often embrace incompleteness.

  7.  **Continuity (Contested, Reveals Sensitivity)**
      *   **Constraint:** Small changes in welfare levels or population size should lead to small changes in overall value. No discontinuous jumps.
      *   **Motivation:** Intuition that morality shouldn't be overly sensitive to imperceptible differences. Avoids "spectrum arguments" forcing repugnant conclusions (e.g., tiny welfare decreases applied sequentially to transform A into Z must eventually pass through a state judged worse than A).
      *   **Tension:** *Reverse Repugnant Conclusion* vulnerability often stems from strict continuity. Avoiding the *Standard Repugnant Conclusion* via critical levels or thresholds often implies discontinuity. Caspar Hare's spectrum arguments exploit this.

  8.  **Tractability Under Uncertainty & Non-Fixed Identity (Non-Negotiable for Realism)**
      *   **Constraint:** Must yield determinate (or meaningfully bounded) judgments when we don't know:
          *   Which precise individuals will exist under different choices (identity indeterminacy).
          *   The exact welfare levels of future people.
      *   **Motivation:** Real-world policy (e.g., climate, resource use, procreation choices) *always* operates under such uncertainty. A theory only applicable under omniscience is useless.
      *   **Theories:** *Totalism/Critical-Level* generally extend well to uncertainty (e.g., maximizing expected total/CL-adjusted welfare). *Person-Affecting* views often collapse or become radically incomplete ("We can't say who is affected or how, so we can't judge").

  ### Key Tensions & Joint Unsatisfiability

  *   **The Central Trilemma (Arrhenius-Type):** Satisfying all of the following seems impossible:
      1.  Avoid the Standard Repugnant Conclusion.
      2.  Avoid the Reverse Repugnant Conclusion (or related conclusions like the Sadistic Conclusion).
      3.  Maintain Full Transitivity, Completeness, *and* a strong form of Continuity.
      *   **Implication:** Any theory must sacrifice at least one desideratum significantly. Totalism sacrifices (1). Critical-Level often sacrifices strong continuity or risks (2). Person-Affecting sacrifices completeness and transitivity in complex cases. Theories embracing incompleteness or restricted continuity avoid the trilemma but at a cost.

  ### How Major Theories Fare (Briefly)

  *   **Total Utilitarianism:**
      *   *Fails:* Standard Repugnant Conclusion (1), sometimes Non-Identity Problem intuitions (3), often distinctions between Addition/Replacement (4).
      *   *Succeeds:* Reverse Repugnant Conclusion (2), Non-Identity Problem technically (3), Transitivity (5), Completeness (6), Continuity (7), Uncertainty (8).
  *   **Critical-Level Utilitarianism:**
      *   *Fails:* Can risk Reverse Repugnant Conclusion if CL is set too high (2), Continuity (spectrum arguments) (7), sometimes distinctions (4).
      *   *Succeeds:* Standard Repugnant Conclusion (if CL > 0) (1), Non-Identity Problem (3), Transitivity (5), Completeness (6), Uncertainty (8).
  *   **Person-Affecting Views (e.g., Narrow):**
      *   *Fails:* Reverse Repugnant Conclusion (2), Non-Identity Problem (3), Completeness (6), Continuity (7), Uncertainty (8), often Transitivity in complex cases (5).
      *   *Succeeds:* Standard Repugnant Conclusion (1), distinguishes Addition/Replacement/Trajectories (4).

  **Conclusion:** The philosophical labor lies primarily in navigating the **Central Trilemma** (avoiding both Repugnant Conclusions while maintaining rationality constraints) and resolving the **Non-Identity Problem** in a way that respects **identity indeterminacy** and operates robustly under **uncertainty**. The tension between valuing lives impersonally and respecting the significance of personal identity/replacement is fundamental. No theory satisfies all desiderata comfortably; evaluating them requires prioritizing which tensions are more acceptable to resolve and which failures are more philosophically costly.
