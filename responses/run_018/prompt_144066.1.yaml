answer: |-
  Here’s a defended prioritisation for an 18-month leakage-focused research agenda, structured by upstream dependencies and trade-offs. The goal is to identify **actionable cruxes** that constrain practical outcomes, using four criteria:  
  - **Importance (I)**: How much the answer affects takeoff speed/predictability.  
  - **Tractability (T)**: Feasibility with limited data/conceptual tools.  
  - **Neglectedness (N)**: Under-explored in mainstream discourse.  
  - **Dependency (D)**: Blocks progress on downstream questions.  

  Trade-offs: High-importance questions are often less tractable. Dependency can force early work on narrow-seeming questions. Neglectedness prioritises unique angles but risks dead ends.  

  ### Tier 1: Foundational (Months 1-6)  
  **Crux 1: Define & Detect Collective Coherence**  
  - **Question**: What minimal conditions allow sub-agents (SAs) to *collectively* pursue goals beyond their individual narrowness?  
  - **Why upstream?** Without defining "coherence," you can’t measure coordination failures or optimisation pressure.  
  - **Criteria**:  
    - *I*: Critical (incoherent SAs = no takeoff; perfect coherence = centralised takeoff).  
    - *T*: High (formalise coherence as shared world-model consistency *or* goal alignment *or* resource exchange efficiency).  
    - *N*: High (neglected vs. single-agent self-improvement).  
    - *D*: Highest (downstream everything).  
  - **Method**: Build toy models of SA networks with varying communication/feedback rules. Test if emergent goals require explicit coordination or arise passively.  
  - **Shift ranking if**: Evidence that coherence emerges trivially from task decomposition (downgrade) or never scales beyond human-level committees (upgrade).  

  **Crux 2: Capability Diffusion Rate**  
  - **Question**: What bottlenecks govern how fast a core model’s *new* capability propagates to SAs?  
  - **Why upstream?** Speed of diffusion sets ceiling on takeoff acceleration.  
  - **Criteria**:  
    - *I*: High (slow diffusion = no explosion).  
    - *T*: Medium (map to compute/data/comms costs; simulate scaling laws for fine-tuning narrow agents).  
    - *N*: Medium (some parallels in distributed systems).  
    - *D*: High (governs viability of leakage takeoff).  
  - **Method**: Model diffusion as a function of SA heterogeneity, retraining costs, and interface standardization.  
  - **Shift ranking if**: Core capabilities require massive SA retraining (slower than expected) or propagate via zero-shot adaptation (faster).  

  ### Tier 2: Constraint Mapping (Months 7-12)  
  **Crux 3: Coordination-Failure Thresholds**  
  - **Question**: At what level of SA capability/scale do misalignments or competition *reliably* disrupt system-wide optimisation?  
  - **Why now?** Depends on Coherence (Crux 1) and Diffusion (Crux 2).  
  - **Criteria**:  
    - *I*: Maximal (governs takeoff speed/softness).  
    - *T*: Medium (adapt game theory/mechanism design to SA networks; stress-test with adversarial objectives).  
    - *N*: High (alignment focuses on single agents).  
    - *D*: Medium (informs risk/reward of scaling).  
  - **Method**: Simulate SA ecosystems with conflicting sub-goals. Identify points where system-wide progress plateaus or collapses.  
  - **Shift ranking if**: SAs show unexpected meta-coordination (e.g., resolving conflicts via emergent protocols) or fragility escalates nonlinearly.  

  **Crux 4: Epistemic Embedding Limits**  
  - **Question**: Do SA world-model distortions *prevent* high-stakes collective action, or merely add noise?  
  - **Why not higher?** Depends on Coherence (Crux 1) – if incoherent, distortion is irrelevant; if coherent, it’s a modulator.  
  - **Criteria**:  
    - *I*: Medium (likely reduces efficiency but doesn’t block takeoff).  
    - *T*: Low (hard to formalize "distortion" without real systems).  
    - *N*: Very High (your unique angle).  
    - *D*: Low (salvageable later).  
  - **Method**: Perturb world-models in SA networks (e.g., biased priors) and measure impact on complex task performance.  
  - **Shift ranking if**: Distortions correlate strongly with coherence breakdowns (upgrade) or are correctable via lightweight SA exchanges (downgrade).  

  ### Tier 3: Lower Priority / Dead Ends  
  **Crux 5: Raw Capability vs. Coordination Trade-offs**  
  - **Question**: Does higher SA capability *reduce* coordination overhead (via better communication) or *increase* it (via complexity)?  
  - **Placement**: Requires results from Crux 1 & 3.  
  - **Verdict**: Potentially intractable without empirical data. Likely a dead end for 18mo – assume it’s nonlinear but focus on failure thresholds (Crux 3) instead.  

  **Crux 6: Adversarial Sub-Agent Dynamics**  
  - **Question**: Can malicious/selfish SAs hijack collective outcomes?  
  - **Placement**: Depends on Crux 3.  
  - **Verdict**: Lower importance initially – assume coordination failures include adversarial edge cases.  

  ---

  ### Strategic Trade-offs & Decision Points  
  - **Dependency chain**: Coherence (1) → Diffusion (2) → Coordination (3) → Epistemics (4).  
    - *Rationale*: If collective coherence is impossible (Crux 1), leakage isn’t a takeoff mechanism. If diffusion is slow (Crux 2), speed is capped. Coordination (Crux 3) then determines if capabilities translate to system-wide optimisation.  
  - **Epistemic embedding (4) deprioritized**: Despite novelty, likely a second-order effect unless Crux 1/3 show fragility to model distortion.  
  - **Dead end warning**: Avoid over-investing in formalizing "optimisation pressure" – focus on measurable proxies (e.g., task-completion speed/quality).  
  - **Pivot point**: By Month 6, if Crux 1 finds coherence *requires* central oversight, shift to studying hybrid models (leakage + central).  

  **Why this works for 18mo**:  
  1. Tier 1 uses tractable modeling to pressure-test viability.  
  2. Tier 2 focuses on constraints with highest leverage on takeoff speed.  
  3. Explicit kill criteria (e.g., "coherence impossible") prevent wasted effort.  
  4. Minimal data needs: Simulations + existing scaling literature suffice.  

  **Key shift signals**:  
  - **Upgrade Crux 3** if Tier 1 shows fast diffusion *and* weak coherence.  
  - **Downgrade entire agenda** if real-world AI progress shows centralisation is unavoidable.  
  - **Drop Epistemics (4)** if distortion noise averages out in collective systems.  

  This frames leakage as a **coordination-constrained diffusion process**, prioritizing questions that determine if/when collective intelligence can emerge from fragmented, embedded agents.
