prompt: |-
  Right, I'm trying to map out what actually needs figuring out about intelligence explosion and takeoff speeds, but I'm specifically interested in the leakage framing rather than the usual recursive-self-improvement story. By leakage I mean a takeoff driven not by one system rewriting its own weights, but by capabilities diffusing from a central model into loads of narrow sub-agents that each lack reflective self-awareness but collectively generate high optimisation pressure. It's a bit of a made-up angle, but I want to take it seriously for an eighteen-month research agenda.

  So, in this leakage-flavoured version of takeoff dynamics, which open questions or lines of work are actually upstream of the others? I'm particularly curious whether epistemic embedding — where each sub-agent's world-model is distorted by the medium it runs in — blocks collective coherence, and whether takeoff speed is governed more by coordination failures between sub-agents than by raw capability growth. But I don't want a survey. I want a defended prioritisation for a small group with about eighteen months and no special data access: which cruxes should they hit first? Which look tractable with current conceptual tools, which depend on those being settled first, and which are basically implict dead ends that wouldn't change the practical picture even if solved? Give me the criteria you're using — importance, tractability, neglectedness, dependency — flag the trade-offs between them, and say what kind of argument or observation would actually shift your ranking. No bibliographies or citation lists, please; this is meant for people working without web access.
