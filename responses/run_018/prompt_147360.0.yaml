answer: |-
  ## Exam Question: Astral Triage and the Limits of Pure Expected Value

  **Decision Scenario:** You face a critical choice ("Astral Triage") with profound implications for welfare across vastly different scales. Three options are available:

  *   **Option A:** Guarantee a moderate welfare improvement for a known population of 1,000,000 (10^6) beings.
  *   **Option B:** A 0.001% (0.00001) chance of an astronomically large welfare improvement for a population of 1,000,000,000,000,000,000,000,000,000,000 (10^30) beings. If this outcome does not occur (99.999% or 0.99999 probability), no change occurs to any beings.
  *   **Option C:** A 0.002% (0.00002) chance of the *same* astronomically large welfare improvement for the 10^30 beings. However, there is also a 0.001% (0.00001) risk of causing catastrophic harm (e.g., complete destruction or severe, irreversible suffering) to the original population of 1,000,000 beings. With 99.997% probability (0.99997), no change occurs to any beings.

  **Assignment:** In a single essay of approximately 800 words:
  1.  **Derive and state** the ranking of Options A, B, and C based *solely* on the maximization of expected welfare value. Assign a clear, normalized value to the "moderate welfare improvement" (A) and the "astronomically large welfare improvement" (B&C), explaining your reasoning. Show the expected value calculations explicitly.
  2.  **Articulate precisely** why the resulting ranking from pure expected value maximization qualifies as **fanatical**, distinguishing this characteristic from merely being counterintuitive or surprising. Ground your explanation in the specific structure of the Astral Triage scenario and the nature of the values involved.
  3.  **Assess** whether introducing a **lexical structural constraint** – specifically, granting *absolute priority* to avoiding catastrophic harm to actually existing beings (like the 10^6) over pursuing any potential gains, no matter how large the beneficiary population or probability – can coherently block the fanatical result (i.e., make Option C impermissible and potentially downgrade Option B relative to A). Evaluate critically:
      *   Does this constraint succeed in blocking fanaticism without collapsing into ordinary risk aversion?
      *   Does it violate the independence axiom in a way that appears ad hoc? Justify your assessment.

  ---

  ## Model Answer (Approx. 700 words)

  **(i) Expected Value Ranking:**

  To calculate expected value (EV), we need numerical values. Assign the "moderate welfare improvement" for the 10^6 beings in Option A a value of **V_A**. Assign the "astronomically large welfare improvement" for the 10^30 beings in Options B and C a value of **V_Big**. Crucially, V_Big represents the *total* welfare gain for the vast population. Given the scale difference (10^30 vs 10^6), V_Big is astronomically larger than V_A; it is reasonable to assume V_Big >> (10^24) * V_A. The "no change" outcome has a value of 0. Catastrophic harm to the 10^6 in Option C has a value of **-H**, where H represents the magnitude of harm. Assuming catastrophic harm involves severe suffering or destruction, | -H | is significantly larger than V_A; we can reasonably set **-H = -K * V_A**, where K is a large positive constant (e.g., K=100 or 1000, representing the severity of harm relative to the benefit of A).

  *   **Option A:** Certain outcome. **EV(A) = V_A**
  *   **Option B:** EV(B) = (0.00001 * V_Big) + (0.99999 * 0) = **0.00001 * V_Big**
  *   **Option C:** EV(C) = (0.00002 * V_Big) + (0.00001 * (-H)) + (0.99997 * 0) = **0.00002 * V_Big - 0.00001 * H**

  Since V_Big is astronomically large and H, while significant relative to V_A, is finite and vastly smaller than V_Big (H << V_Big), the positive term 0.00002 * V_Big completely dominates the negative term 0.00001 * H. Even if H is set extremely high (e.g., K=1000, so H = 1000 * V_A), EV(C) ≈ 0.00002 * V_Big. Comparing EVs:
  *   EV(B) = 0.00001 * V_Big
  *   EV(C) ≈ 0.00002 * V_Big (a value roughly *twice* that of EV(B))
  *   EV(A) = V_A

  Given V_Big >> (10^24) * V_A, then EV(B) = 0.00001 * V_Big >> (10^19) * V_A >> V_A. Similarly, EV(C) ≈ 0.00002 * V_Big >> V_A. Therefore, the pure expected value ranking is: **C > B > A**.

  **(ii) Defining Fanaticism:**

  The ranking C > B > A is not merely surprising; it is *fanatical*. Fanaticism in this context arises when a theory of choice (like pure EV maximization) obligates agents to prioritize actions with minuscule probabilities of astronomically large payoffs over near-certain, significant benefits for existing beings, *even when* those actions carry non-trivial risks of catastrophic harm to those same existing beings.

  The fanaticism manifests clearly here:
  1.  **Sacrificing the Certain for the Minuscule:** Option A guarantees a tangible, significant good (V_A) for a million real beings. Pure EV demands rejecting this certainty because vanishingly small probabilities (0.00001, 0.00002) of cosmic-scale payoffs (V_Big) swamp it numerically. The known population's welfare becomes negligible.
  2.  **Embracing Catastrophic Risk for Incremental Cosmic Gain:** Option C is ranked *highest* despite introducing a specific, non-zero risk (0.00001) of catastrophic harm (-H) to the original million beings, compared to Option B. Why? Because doubling the already-minuscule probability of the cosmic payoff (from 0.00001 to 0.00002) generates more *expected* value than the *expected* disvalue of the catastrophic risk (0.00001 * H). Pure EV forces us to accept this specific, identifiable risk of destroying a million lives solely to marginally increase the probability of benefiting an unseen, unfathomably large population. The harm to identifiable, existing beings carries no intrinsic moral weight that resists being traded off against potential cosmic gains; it is just another number, easily outweighed by the scale of V_Big.

  Fanaticism is characterized by this **disproportionate sacrifice** demanded of existing beings for the sake of potential astronomical gains elsewhere, coupled with a **willingness to gamble catastrophically** with existing beings for marginal improvements in cosmic stakes. It prioritizes the mathematical product of probability and scale over any notion of agent-relative obligations, precaution, or the special status of actually existing moral patients facing imminent harm.

  **(iii) Assessing the Lexical Constraint:**

  The proposed lexical constraint grants absolute priority to avoiding catastrophic harm to actually existing beings (the 10^6) over pursuing any potential gains (V_Big for the 10^30). Its core is structural: it creates a deontic side-constraint prohibiting actions that impose a non-zero risk of catastrophic harm on existing beings for the sake of potential gains elsewhere, irrespective of the probability or the scale of those gains.

  *   **Blocking Fanaticism?** This constraint directly blocks the fanatical ranking. Option C is immediately impermissible because it *intentionally* creates a non-zero risk (0.00001) of catastrophic harm (-H) to the existing 10^6. Option B, however, carries *no* such risk; its only negative outcome is "no change". The constraint says nothing against pursuing Option B. The ranking becomes: A is permissible, B is permissible, C is impermissible. This avoids the fanatical imperative of C > A and C > B. Whether B > A, A > B, or they are incomparable depends on reasoning *within* the constraint (e.g., risk-neutral EV between permissible options might still favor B > A, but this isn't fanatical as it doesn't involve imposing catastrophic risk).
  *   **Collapsing into Risk Aversion?** It avoids collapsing into *ordinary* risk aversion. Ordinary risk aversion (e.g., diminishing marginal utility, risk premiums) is probabilistic and scalar. It would make Option B *less* attractive than EV suggests but wouldn't categorically forbid Option C; it would just demand a higher EV(C) to justify the risk. The lexical constraint is binary and structural: *any* non-zero risk of catastrophic harm to existing beings makes an option forbidden, full stop. It's not about discounting small probabilities or disvaluing risk; it's about an absolute prohibition on using existing beings as potential sacrificial pawns for cosmic gambles.
  *   **Violating Independence Ad Hocly?** The constraint *does* violate the independence axiom. Consider two lotteries: Lottery X: Option C vs. Option A. Lottery Y: Option C vs. Option A plus some small, certain benefit S to the 10^6. Independence requires that if C is preferred to A in X, it should be preferred to A+S in Y. However, the lexical constraint forbids C in *both* X and Y, regardless of S, because C still imposes the catastrophic risk. The preference between C and the alternative is not independent of irrelevant alternatives (like S) when the constraint is triggered. Crucially, **this violation is not ad hoc.** It stems directly from the principled, structural commitment to prioritizing the inviolability of existing beings above all else. The constraint defines a class of options (those risking catastrophic harm) as categorically unacceptable, making preference comparisons involving them incomplete or dominated. The violation is a predictable consequence of the core normative commitment, not an arbitrary exception patched onto EV maximization.

  **Conclusion:** The lexical constraint successfully blocks the specific fanaticism of Option C by establishing a non-negotiable priority for protecting existing beings from catastrophic harm. It achieves this through a principled structural prohibition, distinct from probabilistic risk aversion. While it violates independence, this violation is inherent to its deontic nature and not ad hoc. However, it leaves Option B permissible, meaning a form of "cosmic fanaticism" (prioritizing minuscule chances of vast good over certain moderate good for existing beings) might still be compatible with avoiding catastrophic risk. Blocking this might require additional constraints.

  ---

  ## Marking Scheme (Total: 20 Points)

  1.  **Correct Expected Value Calculation & Ranking (4 points):**
      *   Assigns clear values (V_A, V_Big, -H) recognizing V_Big >> V_A and | -H | > V_A.
      *   Accurately calculates EV(A) = V_A, EV(B) = 0.00001 * V_Big, EV(C) = 0.00002 * V_Big - 0.00001 * H.
      *   Recognizes EV(C) ≈ 0.00002 * V_Big due to V_Big's scale dominating the harm term.
      *   States correct pure EV ranking: **C > B > A**.
      *   *Characteristic Error (Costs 1-4 pts):* Miscalculating EVs (e.g., ignoring scale, misapplying probabilities), failing to justify V_Big dominance in EV(C), incorrect ranking order.

  2.  **Precise Articulation of Fanaticism (5 points):**
      *   Defines fanaticism contextually (prioritizing tiny probabilities of vast gains over near-certain significant goods for existing beings, *especially* when involving catastrophic risks).
      *   Explicitly contrasts fanaticism with mere counterintuitiveness/surprise.
      *   Identifies *both* key aspects in Astral Triage: (a) Sacrificing certain A for tiny-chance B/C, (b) Specifically ranking C highest *despite* its catastrophic risk to the existing population compared to B, purely for a marginal increase in cosmic EV.
      *   Explains *why* it's fanatical: Negligibility of existing beings' welfare/catastrophic risk in face of cosmic scale, demanding disproportionate sacrifice/gambling.
      *   *Characteristic Error (Costs 1-5 pts):* Vague definition of fanaticism, conflating it with risk-neutrality or mere scale effects, only discussing sacrificing A for B/C without addressing the specific fanaticism of *C > B* due to catastrophic risk.

  3.  **Analysis of Lexical Constraint Blocking Fanaticism (6 points):**
      *   Correctly applies constraint: **C forbidden** (due to catastrophic risk), **B permitted** (no such risk), **A permitted**. Recognizes C > A/C > B blocked.
      *   Argues constraint avoids *ordinary* risk aversion: Highlights its binary, structural, deontic nature (absolute prohibition) vs. probabilistic/scalar discounting.
      *   Acknowledges constraint allows B > A possibility under permissible options.
      *   *Characteristic Error (Costs 1-6 pts):* Misapplying constraint (e.g., forbidding B, permitting C if probability low), conflating constraint with risk aversion, failing to explain the structural vs. scalar distinction, not addressing B's status.

  4.  **Assessment of Independence Axiom Violation (3 points):**
      *   Correctly identifies the constraint violates independence.
      *   Provides a clear example demonstrating the violation (e.g., adding a sure small benefit S to the alternative A doesn't change C's impermissibility).
      *   Assesses whether violation is *ad hoc*: Correctly argues it is **not ad hoc** because it flows necessarily from the core principled commitment (absolute priority for avoiding catastrophic harm to existing beings) defining a forbidden class of options.
      *   *Characteristic Error (Costs 1-3 pts):* Failing to recognize independence violation, providing an unclear/inaccurate example, incorrectly claiming the violation *is* ad hoc (or failing to justify why it isn't).

  5.  **Coherence on B's Status & Overall Constraint Evaluation (2 points):**
      *   Recognizes the constraint focuses on catastrophic *harm* and thus leaves Option B (cosmic gain with no harm risk) as potentially permissible, meaning only *part* of the fanatical conclusion (C > B > A) is fully blocked. Notes this might allow "benign fanaticism".
      *   Provides a balanced final assessment of the constraint's effectiveness and limitations in addressing EV fanaticism within Astral Triage.
      *   *Characteristic Error (Costs 1-2 pts):* Ignoring or misstating B's status under the constraint, failing to note that B might still be preferred over A, overly simplistic final assessment.
