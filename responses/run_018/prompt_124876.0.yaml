  I'm a high school student writing an independent philosophy essay, and I've noticed a recurring argumentative pattern that I don't have a precise word for. In cosmological discussions, people sometimes reject a model with infinite future duration by arguing that it predicts vastly more fleeting, disordered conscious states—what are often called Boltzmann brains—than sustained biological minds; since we observe ourselves in sustained, ordered states, the model must be false. I've seen an identical structure elsewhere: in epistemology, a skeptical hypothesis is rejected not by direct evidence against it, but by observing that if it were true, the very cognitive or instrumental conditions needed to formulate or test it would not exist. What I'm trying to isolate is whether there is an established concept specifically for theories that are undermined because their own truth would destroy the physical, cognitive, or observational apparatus that allows us to evaluate them. Is this just a variant of reductio ad absurdum, or does philosophy of science recognize it as a distinct category with its own boundary conditions—say, one that applies when the undermining targets the evaluator's instruments rather than generating a pure logical contradiction? If it has no established name, please coin one with a sharp definition and clear boundary cases that distinguish it from ordinary empirical falsification and from self-defeating arguments that rely only on logical inconsistency. Please lead with your bottom line in the first sentence—whether this is a distinct named phenomenon or a variant of something older—then give your reasoning with no preamble and without restating the question. Give me a committed response: take a definite position, make definite choices about its classification and edges, and defend them with reasons rather than surveying options neutrally.
