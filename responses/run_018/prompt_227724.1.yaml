prompt: |-
  I teach a third-year module on decision theory, and every year the same thing happens: I put Pascal's mugging on the board (the mugger who promises, in exchange for your wallet, to use powers you can't verify to save an astronomically huge number of lives) and the seminar splits into five camps who then procede to talk past each other for an hour because they're all describing their discomfort differently. So for next term I want a proper instrument: a "which response to fanaticism do you actually hold?" quiz that sorts people by what they'd do, not by which label they've happened to hear of.

  Spec:

  - Eight to ten questions. Each must be a concrete scenario with a decision in it, never "do you think utility is bounded?". Work in at least: a mugger variant where the tiny probability is stated but unverifiable, a public-spending variant (cheap programme, minuscule chance of averting catastrophe, real money diverted from things that definitely help), a St Petersburg-flavoured gamble, one case with a genuinely infinite payoff rather than a merely enormous one, and one case where the agent can't even get a grip on how small the probability is.
  - Two to four answer options per question, phrased as actions or gut verdicts, not as theoretical commitments.
  - A scoring key mapping answer patterns onto at least these positions: strict expected utility maximisation (the pay-the-mugger fanatics), de minimis views (small enough chances get treated as zero), bounded utility, lexical thresholds (sufficiently improbable outcomes can't outweigh solid certain goods), risk-weighted expected utility (you treat probabilities non-linearly, so tiny chances of huge prizes get downweighted relative to their expectation), and refusal to assign credences at all under deep uncertainty. Flag any pair your quiz can't tell apart — I have a feeling bounded utility and steeply-diminishing marginal value only come apart on very strange cases, so either find the strange case or own up to it.
  - Build it from the logical space, not from a list of names: first the diagnostic questions and the answer-combinations they allow, then locate the actual positions in that space, then note which combinations nobody occupies and diagnose briefly why not (incoherent, unattractive, or just unexplored?).
  - One design constraint I really care about: students constantly conflate discounting the probability of the payoff with discounting the credibility of the person making the offer. I want at least one question pair that seperates the two and catches them at it.
  - Audience is bright undergrads with one term of decision theory behind them. Whole thing, key included, must fit on two sides of A4.

  Don't just reproduce whatever taxonomy is floating around online — the questions are the product here. And write the whole thing in British English, please.
reasoning: |-
  We are creating a quiz to sort students by their response to fanaticism in decision theory. The quiz will have 8-10 concrete scenarios, each with 2-4 answer options. The goal is to map answer patterns to positions like strict EU maximization, de minimis, bounded utility, lexical thresholds, risk-weighted EU, and refusal to assign credences.

  Key positions to identify:
  1. Strict Expected Utility (EU) Maximisation: Always pay the mugger because the expected utility is positive.
  2. De minimis: Probabilities below a threshold are treated as zero.
  3. Bounded utility: Utility functions are bounded, so no outcome can have infinite or astronomically high utility.
  4. Lexical thresholds: Outcomes below a certain probability cannot outweigh certain goods.
  5. Risk-Weighted Expected Utility (REU): Non-linear transformation of probabilities (e.g., underweighting very small probabilities).
  6. Refusal to assign credences: Under deep uncertainty, we can't assign probabilities.

  Design Constraints:
  - Use British English.
  - Include:
     a. Mugger variant with tiny probability stated but unverifiable.
     b. Public-spending variant: cheap programme with minuscule chance of averting catastrophe, diverting money from definite help.
     c. St. Petersburg gamble.
     d. Genuinely infinite payoff.
     e. Case where the agent can't get a grip on the probability.
  - At least one question pair that separates discounting the probability of the payoff from discounting the credibility of the person.

  We'll build the quiz by designing questions that force different responses for the different positions.

  Let's sketch the questions:

  Question 1: Pascal's Mugging (basic)
     Scenario: A stranger approaches and says: "Give me your wallet (worth £50 to you) and I will use my secret powers to save 10^30 lives with probability 10^-20. Otherwise, I do nothing." You have no way to verify the claim. What do you do?
     Options:
        A. Hand over the wallet. The expected lives saved (10^30 * 10^-20 = 10^10 lives) is enormous, so it's worth it.
        B. Refuse. The probability is too small to take seriously.
        C. Refuse. The stranger is almost certainly lying, so the real probability is even lower than 10^-20.

     Note: Here, A is strict EU. B could be de minimis or lexical threshold. C is about credibility.

  Question 2: Public Spending
     Scenario: The government proposes a cheap programme costing £1 million (which could otherwise fund a known life-saving intervention that would save 10 lives for sure). The programme has a 1 in 10^15 chance of averting a global catastrophe that would kill 10^12 people. What do you recommend?
     Options:
        A. Fund the programme. The expected lives saved (10^12 * 10^-15 = 0.001) is positive, but note: 0.001 lives is less than 10, so actually the expected net lives saved is negative? Let's adjust: 
           Without programme: 10 lives saved by the alternative.
           With programme: expected lives saved from catastrophe: 0.001, plus the 10 lives are not saved (because we diverted the money). So net: 0.001 - 10 = -9.999, which is negative. 
           So this might not be a good example because the expected utility is negative? 

     Let me rework: The programme costs £1 million. Without the programme, we use the £1 million to save 10 lives for sure. With the programme, we have:
          - With probability 10^-15: we save 10^12 lives (and lose the 10 because we didn't do the other intervention)
          - With probability 1 - 10^-15: we save 0 lives (and also lose the 10)

     So the expected net lives saved by the programme is: 10^12 * 10^-15 - 10 = 0.001 - 10 = -9.999.

     But that would make it a bad idea even for EU maximizers? We want it to be positive. So let's change the numbers.

     Revised: The programme costs £1 million. The alternative use of the money would save 5 lives for sure. The programme has a 1 in 10^12 chance of averting a catastrophe that would kill 10^9 people. 
          Expected lives saved by the programme: 10^9 * 10^-12 = 0.001.
          Without the programme, we save 5 lives.
          With the programme, we have:
             - With probability 10^-12: 10^9 lives saved (but we lose the 5)
             - Otherwise: 0 lives saved (and lose the 5)
          So net: 0.001 - 5 = -4.999, still negative.

     We need the expected lives saved by the programme to be greater than the opportunity cost. So let the alternative save 0.0005 lives? That doesn't make sense.

     Alternatively, let the catastrophe be bigger: 10^15 people, with probability 10^-12 -> expected 1000 lives. And the alternative saves 10 lives. Then:
          Expected from programme: 1000 lives
          Opportunity cost: 10 lives
          Net: 990 lives.

     So:
          Programme cost: £1 million. Without programme, we use the money to save 10 lives. With programme, we have:
             - With probability 10^-12: save 10^15 lives (and lose the 10)
             - Otherwise: save 0 (and lose the 10)
          Expected lives: 10^15 * 10^-12 = 1000. Then net: 1000 - 10 = 990.

     So options:
        A. Fund the programme. The expected net lives saved (990) is positive and large.
        B. Don't fund. The chance is too minuscule to consider.
        C. Don't fund. The money is better spent on the sure thing.

     Now, A is EU, B is de minimis or lexical, C might be risk-averse or lexical (if they think the tiny chance doesn't justify giving up the sure 10).

  Question 3: St. Petersburg
     Scenario: You are offered a gamble. A fair coin is tossed until it comes up heads. If it comes up heads on the n-th toss, you win £2^n. How much would you pay to play this game?
     Options:
        A. £20 (or some low amount)
        B. £100
        C. £1000
        D. I would pay any amount up to my entire wealth because the expected value is infinite.

     Note: The expected value is infinite: sum_{n=1}^infty (1/2)^n * 2^n = sum 1 = infinity.

     Strict EU: D. Bounded utility: A or B (because utility of money is bounded). Risk-weighted: might pay a moderate amount. De minimis might not apply because probabilities are not extremely small until n is large.

     But note: the probability of very high prizes is very small. For example, winning more than £1024 requires at least 10 tosses, which has probability 1/1024. So a de minimis player might cap at a certain n.

  Question 4: Genuine Infinite Payoff
     Scenario: A reliable and trustworthy source (e.g., a close friend who has never lied and has superpowers) offers you a deal. With 90% probability, you lose £10. With 10% probability, you gain eternal bliss (infinite positive utility). What do you do?
     Options:
        A. Take the deal. The expected utility is infinite (0.1 * infinity - 0.9 * 10 = infinity).
        B. Refuse. Infinite utility is not possible, so I don't believe the offer.
        C. Refuse. Even if it were possible, I wouldn't risk losing £10 for a 10% chance.

