  ### **How Do You Respond to Fanatical Choices? A Sorting Quiz**  
  *Instructions: For each scenario, choose the option that best reflects your gut reaction. Answer honestly—no "correct" answers exist.*

  ---

  #### **Question 1: Pascal’s Mugging (Stranger)**  
  A stranger demands your wallet (£50) and claims: "With probability \(10^{-20}\) (1 in 100 billion billion), I’ll use hidden powers to save \(10^{30}\) lives. Otherwise, I do nothing." You can’t verify this.  
  - **A.** Hand over the wallet. The expected lives saved (\(10^{10}\)) outweighs £50.  
  - **B.** Refuse. The probability is too tiny to consider.  
  - **C.** Refuse. The stranger is likely lying—the real probability is even lower.  

  #### **Question 2: Public Spending Dilemma**  
  The UK must allocate £1 billion. Option A: Fund malaria nets, saving 10,000 lives for sure. Option B: Fund research with a \(10^{-15}\) chance of preventing an asteroid impact (saving 1 billion lives).  
  - **A.** Choose B. The expected lives saved (~1,000) outweighs the sure loss.  
  - **B.** Choose A. Such a minuscule chance isn’t worth diverting funds.  
  - **C.** Choose A. The certainty of saving 10,000 lives beats a vague gamble.  

  #### **Question 3: St. Petersburg Gamble**  
  A casino offers a game: a fair coin is tossed until heads. If heads first appears on toss \(n\), you win £\(2^n\). How much would you pay to play?  
  - **A.** £10 or less.  
  - **B.** £100–£1,000.  
  - **C.** £5,000 or more.  
  - **D.** My entire savings—the expected winnings are infinite.  

  #### **Question 4: Genuine Infinite Payoff**  
  A trustworthy friend (who has superpowers) offers: "90% chance you lose £10; 10% chance you gain eternal bliss (infinite utility)."  
  - **A.** Accept. Infinite expected utility outweighs the risk.  
  - **B.** Refuse. Infinite utility is impossible.  
  - **C.** Refuse. A 10% chance isn’t enough to risk £10.  

  #### **Question 5: Deep Uncertainty**  
  A scientist proposes activating a machine that might create utopia (utility = saving \(10^{15}\) lives) or cause disaster (utility = losing \(10^9\) lives). No probability estimates exist.  
  - **A.** Activate it. Assign equal probabilities and hope.  
  - **B.** Don’t activate. Without probabilities, we can’t weigh risks.  
  - **C.** Delay until probabilities are estimated.  

  #### **Question 6: High-Credibility Mugger**  
  *Same as Q1, but the mugger is a renowned Oxford physicist with published work on "life-saving powers."*  
  - **A.** Pay. Their credibility justifies taking the probability seriously.  
  - **B.** Refuse. Even with credibility, \(10^{-20}\) is negligibly small.  
  - **C.** Refuse. Credibility doesn’t make impossible powers plausible.  

  #### **Question 7: Low-Credibility Mugger**  
  *Same as Q1, but the mugger is a known fraudster. They still quote probability \(10^{-20}\) and saving \(10^{30}\) lives.*  
  - **A.** Pay. The stated probability/payoff is identical to Q6.  
  - **B.** Refuse. Their dishonesty makes the true probability even lower.  
  - **C.** Refuse. The probability was already negligible.  

  #### **Question 8: Tiny Chance, Huge Prize**  
  You’re offered a gamble: \(10^{-100}\) chance of winning £\(10^{100}\) (otherwise £0). How much would you pay?  
  - **A.** £0.01.  
  - **B.** £1 (the expected monetary value).  
  - **C.** Up to £100.  

  #### **Question 9: Lexical Threshold**  
  As a doctor, you can use a drug to:  
  - **Option A:** Save 1 child’s life for sure.  
  - **Option B:** Save 100 children with probability 0.01 (else save none).  
  - **A.** Choose A. A 1% chance isn’t worth sacrificing a sure save.  
  - **B.** Choose B. The expected lives saved (1) matches A.  
  - **C.** Flip a coin to decide.  

  ---

  ### **Scoring Key**  
  *Match your answers to the dominant pattern. Positions are mutually exclusive. Flagged pairs may be conflated.*  

  | **Position**                  | **Diagnostic Answer Pattern**                                                                 | **Notes** |  
  |-------------------------------|-----------------------------------------------------------------------------------------------|-----------|  
  | **Strict EU Maximisation**    | 1A, 2A, 3D, 4A, 5A, 6A, 7A, 8B, 9B/C                                                         | Pays the mugger, funds fanatical bets, embraces infinity. |  
  | **De Minimis Probability**    | 1B, 2B, 3A/B, 4C, 5B/C, 6B, 7B/C, 8A, 9A                                                     | Treats tiny probabilities as zero. Distrusts "infinite" payoffs. |  
  | **Bounded Utility**           | 1B, 2B, 3A/B, 4B/C, 5B, 6B, 7B/C, 8A, 9A                                                     | Caps utility (e.g., rejects £\(10^{100}\) as impossibly large). *Conflatable with de minimis.* |  
  | **Lexical Threshold**         | 1B, 2C, 3A, 4C, 5B, 6B, 7C, 8A, 9A                                                           | Prioritises sure goods over uncertain huge gains. Rejects "all-or-nothing" gambles. |  
  | **Risk-Weighted EU**          | 1B, 2B, 3B, 4C, 5B, 6B, 7C, 8A, 9A                                                           | Underweights tiny probabilities. Prefers moderate chances (Q8, Q9). |  
  | **Refusal to Assign Credence**| 1C, 2B, 3A, 4B, 5B, 6C, 7B, 8A, 9A                                                           | Dismisses unverifiable probabilities (Q5–Q7). Focuses on source credibility. |  

  #### **Key Distinctions**  
  - **EU vs. Others:** Look for Q1A, Q3D, Q4A, Q7A. EU pays even the fraudster (Q7A).  
  - **Credibility vs. Probability:** Compare Q6 and Q7. Discounting *only credibility* (Q6A + Q7B/C) isn’t a formal position—it’s a common mistake.  
  - **Bounded Utility vs. De Minimis:** *Conflated* (both pick 1B, 2B, 8A, 9A). They diverge only if utility bounds are tested (e.g., Q4: bounded utility rejects infinity; de minimis rejects tiny probability).  
  - **Lexical vs. Risk-Weighted:** Lexical prioritises sure outcomes (Q2C, Q9A); risk-weighted downweights small probabilities non-linearly (Q3B, Q8A).  
  - **Unoccupied Combinations:** Paying the fraudster (Q7A) but refusing the physicist (Q6B/C) is incoherent for EU. Assigning uniform probabilities (Q5A) but refusing infinity (Q4B/C) is inconsistent.  

  #### **Design Notes**  
  - **Q6–Q7** isolate credibility discounting from probability discounting.  
  - **Q4 (infinite) vs. Q8 (astronomical)** tests if respondents balk at infinity specifically.  
  - **Conflated Pairs:** Bounded utility and de minimis rarely differ in realistic cases—they’re separated only by meta-arguments (e.g., "Is utility fundamentally bounded?").  

