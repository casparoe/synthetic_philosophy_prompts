prompt: |-
  I'm trying to work out what I actually think about when consent to sex is valid, going by my gut on cases. Here are my verdicts:

  - A man tells a woman he has had a vasectomy; she agrees to have sex with him on that basis; in fact he has not. Verdict: her consent is not valid; what happened was not just sex plus a separate lie.
  - A man tells a woman he loves her and sees a future with her in order to get her to sleep with him; neither is true. Verdict: manipulative and wrong, but her consent to the sex is valid.
  - A man agrees to use a condom but removes it during intercourse without her knowledge. Verdict: her consent does not cover the sex that actually occurred.
  - A woman tells a man she is on the pill when she is not, and he consents on that basis. Verdict: the same as the vasectomy case; his consent is not valid.
  - A man tells a woman he is a successful gallery owner when he is actually unemployed and living with his parents. Verdict: contemptible, but the sex is consensual.
  - A boss tells an employee she will be fired unless she sleeps with him. Verdict: the sex is not consensual.
  - A long-term partner says he will leave the relationship unless they have sex. Verdict: the consent is valid; the relationship is bad, but the sex is consensual.
  - A sober person has sex with someone who is so drunk they can barely stand and are slurring their words, though the drunk person says yes and initiates. Verdict: the consent is not valid.

  Is there one principle, or a small number of principles, about deception, coercion, and competence that captures these verdicts? The two places where my own verdicts feel hard to reconcile are the vasectomy lie versus the love lie, and the boss's threat versus the partner's ultimatum. If some verdicts have to go, which should I revise? And what does the resulting account say about the case I keep going back and forth on: a man tells his partner they are exclusive, she says she would not have sex with him if he were seeing anyone else, they always use condoms and he has been tested, but in fact he is sleeping with someone else. Is her consent to the sex valid?
reasoning: |-
  Okay, the user is trying to figure out their own principles for valid consent in sexual scenarios based on their gut reactions to various cases. They've listed several situations with their verdicts and are looking for underlying principles. They also mentioned two areas where their verdicts feel hard to reconcile: the vasectomy lie vs. the love lie, and the boss's threat vs. the partner's ultimatum. Plus, there's a specific case about exclusivity they're unsure about.

  First, I need to analyze their verdicts and see if there's a consistent pattern. Let me list out their cases again:

  1. **Vasectomy lie**: Consent invalid.
  2. **False love**: Consent valid, though manipulative.
  3. **Stealthing**: Consent invalid.
  4. **False pill claim**: Consent invalid (same as vasectomy).
  5. **False job status**: Consent valid.
  6. **Boss threat**: Consent invalid.
  7. **Partner ultimatum**: Consent valid.
  8. **Drunk person**: Consent invalid.

  The user is struggling with two main tensions. First, why is the vasectomy lie different from the love lie? Both involve deception, but they see one as invalidating consent and the other not. Second, why is the boss's coercion different from the partner's ultimatum? Both involve threats, but the boss scenario invalidates consent while the partner's doesn't.

  Looking at existing frameworks, consent is often invalidated by factors like deception about the nature of the act, conditional consent, or impairment. The Conditional Consent Principle (CCP) might be useful here. It suggests that consent is only valid if the conditions under which it was given are met. For example, in the vasectomy case, the condition was no pregnancy risk, which was violated. In the love lie, the deception might not relate directly to the act of sex itself but to peripheral matters. Similarly, with the boss, the threat imposes a new condition (losing the job) that directly affects consent, whereas the partner's ultimatum is about the relationship continuing, not an immediate harm.

  The user's exclusivity case is tricky. They use condoms and he's tested, so STI risk is mitigated. But she consented on the condition of exclusivity. If the CCP focuses on direct physical consequences, then maybe consent is still valid. But if relational consequences matter, it's less clear. The user might need to decide how central exclusivity is to the act. If it's a fundamental condition, then consent could be invalid. But if it's more about trust and relationship dynamics, they might lean towards it being valid but a betrayal.

  The user's deeper need seems to be seeking a coherent ethical framework that aligns with their intuitions but is consistent. They might also want to apply this framework to real-life situations, ensuring their principles are just and practical. The challenge is reconciling emotional betrayals with consent validity. They might need to distinguish between moral wrongs (like lying about love) and consent invalidation, which is more about the specific conditions of the sexual act itself.

  For the exclusivity case, applying CCP: the direct physical conditions (condom use, testing) are met, so consent might be valid. However, the deception about exclusivity could be seen as a conditional factor. If the user views exclusivity as a core condition for sex, similar to contraception, then consent is invalid. But if it's more about relationship trust, it's a betrayal but doesn't invalidate consent. Their prior stance on the love lie suggests they might see this as valid consent but a serious breach of trust.
answer: |-
  Based on your verdicts, your intuitions align remarkably well with a framework centered on **Conditional Consent and Direct Coercion/Duress**. Here's the principle that captures your judgments:

  **The Conditional Consent Principle (CCP):**
  *   **Consent is invalid if:**
      1.  **Deception:** The consent was given *conditionally* on a fact *directly pertinent to the nature, physical consequences, or fundamental circumstances* of the sexual act itself, and that condition was false (due to deception) or violated during the act; and/or
      2.  **Coercion/Duress:** The consent was obtained through a *threat* that creates an *immediate and severe consequence* the person has no reasonable alternative but to avoid, rendering the "agreement" involuntary; and/or
      3.  **Incapacity:** The person lacks the *cognitive capacity* to understand the nature of the act or give meaningful consent due to impairment (e.g., extreme intoxication).

  **Applying CCP to Your Cases:**

  1.  **Vasectomy Lie:** Consent was conditional on *no pregnancy risk*. The deception directly negated this fundamental physical condition of the act. **Invalid Consent (Matches your verdict).**
  2.  **False Love:** The deception, while wrong, concerns *motivations and future promises*, not the *nature or fundamental physical circumstances* of the sexual act itself. **Valid Consent (Matches your verdict).**
  3.  **Stealthing:** Consent was explicitly conditional on *condom use*. The violation *during the act* fundamentally altered the physical nature/risks (STI/pregnancy). **Invalid Consent (Matches your verdict).**
  4.  **False Pill Claim:** Identical to Vasectomy. Consent conditional on *no pregnancy risk*, deception negates it. **Invalid Consent (Matches your verdict).**
  5.  **False Job Status:** Deception concerns *identity/social status*, not the *nature or fundamental physical circumstances* of the sexual act. **Valid Consent (Matches your verdict).**
  6.  **Boss Threat:** Involves a *threat* (firing) creating an *immediate and severe consequence* (job loss, financial ruin) the employee has *no reasonable alternative* but to avoid. This is classic duress. **Invalid Consent (Matches your verdict).**
  7.  **Partner Ultimatum:** The "threat" is to *end the relationship*, a *foreseeable social consequence* inherent to relationship dynamics. It doesn't typically constitute an *immediate and severe consequence* like job loss or physical harm that removes reasonable alternatives. **Valid Consent (Matches your verdict).**
  8.  **Drunk Person:** Lacks *cognitive capacity* to understand or meaningfully consent. **Invalid Consent (Matches your verdict).**

  **Reconciling Your Tensions:**

  1.  **Vasectomy Lie vs. Love Lie (Deception):**
      *   CCP resolves this by focusing on what the deception is *about*.
      *   **Vasectomy:** Deception about a *physical consequence directly tied to the sex act* (pregnancy risk).
      *   **Love Lie:** Deception about *feelings, motivations, or future intent*. These are peripheral to the *inherent physical nature and immediate risks* of the sexual act itself. The wrong is relational betrayal, not consent invalidation.

  2.  **Boss Threat vs. Partner Ultimatum (Coercion):**
      *   CCP resolves this by focusing on the *nature of the threat and available alternatives*.
      *   **Boss Threat:** Involves an *abuse of power* creating an *extrinsic, severe, and immediate consequence* (job loss, career damage) the victim has *no reasonable escape from* within the situation. The threat originates outside the inherent risks of sex/relationships.
      *   **Partner Ultimatum:** The consequence (relationship ending) is an *intrinsic, foreseeable risk* within the relationship itself. While painful, ending a relationship is a socially acceptable (and often necessary) outcome people must navigate; reasonable alternatives (refusing sex and accepting the breakup) exist, even if difficult.

  **Which Verdicts Might Need Revision? (Based on CCP Consistency):**

  *   **Partner Ultimatum (Case 7):** This is the *most common point of debate*. While CCP supports your verdict, some argue that within an abusive or highly dependent relationship, an ultimatum *could* rise to the level of duress (e.g., if refusal leads to homelessness, violence, or the partner has systematically destroyed the victim's support network). Your verdict holds under CCP for *typical* relationship dynamics, but extreme dependence *might* shift it towards invalid consent.
  *   **False Pill Claim (Case 4):** Your verdict matches CCP perfectly and is legally consistent in many jurisdictions. However, some might argue *asymmetry* with the vasectomy case due to biology (only the woman bears pregnancy). CCP rejects this asymmetry – the *conditional consent based on pregnancy prevention* is the key factor for both genders.

  **The Exclusivity Case - Applying CCP:**

  *   **Man lies about exclusivity; partner consented conditionally on exclusivity.**
  *   **CCP Analysis:**
      *   **Deception?** Yes, about exclusivity.
      *   **Condition Directly Pertinent?** This is the crux. CCP asks: Is exclusivity *directly pertinent to the nature, physical consequences, or fundamental circumstances of the sexual act itself?*
          *   **Physical Consequences:** Condom use and testing mitigate the *direct physical risk* (STIs). Exclusivity is a *preventative measure* against potential future risk, not a condition altering the *inherent physical nature* of *this specific act*.
          *   **Nature/Circumstances:** Exclusivity relates more to the *relationship context and trust* than the *inherent physical act* of sex occurring at that moment. It's about *why* she consented, not *what* she consented to (the physical act with this partner, using protection).
  *   **CCP Verdict:** Consent is **valid**. The deception is a profound betrayal of trust and potentially exposes her to future risk, but it does not negate the conditions *directly pertinent to the act she engaged in at that time* (protected sex with this specific partner). The core wrong is infidelity and betrayal, not consent violation *per se*.
  *   **Why it feels borderline:** Exclusivity *is* a fundamental condition *for her* to engage in sex. However, under CCP, the focus is on the *direct* link to the act's nature/physicality *during the act itself*. The use of condoms/testing weakens the claim that the deception fundamentally altered the physical reality of *that specific encounter*. If she had said "I only have unprotected sex with exclusive partners," the deception *would* likely invalidate consent under CCP, as the physical nature of the act (unprotected vs. protected) was conditional on exclusivity.

  **Conclusion:**

  Your intuitions are highly consistent with the **Conditional Consent Principle (CCP)**, emphasizing deception/coercion that *directly alters the fundamental nature, physical consequences, or circumstances of the sexual act itself*, or exploits incapacity. This principle cleanly resolves your tensions:

  *   **Vasectomy vs. Love Lie:** Physical consequence vs. motivation.
  *   **Boss vs. Partner Ultimatum:** Extrinsic severe duress vs. intrinsic relationship consequence.

  For the exclusivity case, CCP suggests **consent is valid** because exclusivity, while a crucial relational condition, is not *directly pertinent* to the physical nature of the specific protected sexual act that occurred, given the condom use and testing. The core harm is betrayal, not lack of consent. If this verdict feels unsatisfying, you might need to refine CCP to include *fundamental relational conditions explicitly stated as prerequisites for the sexual act*, though this significantly broadens the scope of consent invalidation beyond the immediate physical act.
