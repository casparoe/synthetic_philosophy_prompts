answer: |-
  Your observation captures a sophisticated epistemic phenomenon that lacks a single established label but can be precisely characterized. This is **Conceptual Ritualization via Reflexive Migration**—a dynamic where a technically precise concept undergoes three-phase transformation:

  1.  **Exportation:** Migration from its original technical domain (structural causal modeling) to an adjacent interpretive community (philosophy of science), where its boundary conditions are relaxed while retaining syntactic formality.
  2.  **Domestication:** Adoption of the loosened concept within the new community, where it serves broader rhetorical or explanatory needs (e.g., qualitative counterfactual tests replacing quantitative invariance).
  3.  **Re-importation:** The diluted concept is borrowed back into the technical domain (computational modeling), now carrying the authority of both communities but lacking original discriminative power.

  ### Distinguishing Markers from Conceptual Stretching
  | **Marker**               | **Conceptual Ritualization**                          | **Ordinary Conceptual Stretching**          |
  |--------------------------|------------------------------------------------------|---------------------------------------------|
  | **Trajectory**           | Round-trip migration (Domain A → B → A)              | Unidirectional diffusion (Domain A → B)     |
  | **Authority Source**     | Prestige derived from *both* origin and adoption     | Prestige from original domain only          |
  | **Functional Shift**     | Becomes credentialing token ("explanatory alibi")    | Gains new semantic associations             |
  | **Boundary Erosion**     | Selective: core formalism retained, exclusions lost  | General blurring of definitional edges      |
  | **Pragmatic Motivation** | Legitimation through symbolic technicality           | Accommodating novel phenomena               |

  ### Critical Thresholds of Irreversibility
  The slippage becomes functionally irreversible when:
  1.  **Citation Equilibrium:** The re-imported usage becomes self-reinforcing in technical literature (e.g., computational papers citing philosophical works as sufficient authority).
  2.  **Tooling Integration:** The diluted concept is embedded in widely adopted methodologies (e.g., salience maps labeled as "interventionist" in ML libraries).
  3.  **Pedagogical Capture:** The weakened version enters textbooks/training materials for technical practitioners.
  4.  **Gatekeeping Inversion:** Challenging the dilution is dismissed as pedantry within the technical community itself.

  ### Existing Frameworks Resonating with Your Analysis
  - **Latour's "Blackboxing"**: The original technical machinery becomes opaque while its output (the term) retains authority.
  - **Weberian "Ritualization"**: Formal characteristics replace substantive function in social practice.
  - **Lakoff's "Cognitive Metaphor"**: The "INTERVENTION-AS-COUNTERFACTUAL" mapping overwrites mathematical specifics.

  ### Proposed Nomenclature
  Where precision is needed, I recommend:
  > **"Veblenian Concept Degradation"**  
  > (Invoking Veblen's *Theory of the Leisure Class*: ceremonial adoption of technical forms devoid of instrumental function)

  Or more technically:  
  > **"Recursive Semantic Atrophy"**  
  > (Emphasizing the path-dependent information loss during migration cycles)

  Your examples perfectly illustrate this: When medical philosophers analogize "surgical intervention" to policy change without structural equations, they engage in **boundary laundering**—importing causal modeling's authority while exporting its constraints. The result is a *zombie concept*: formally animate but epistemically vacuous.

  This phenomenon is particularly acute in computational humanities where, as you note, the term's syntactic resemblance to rigorous methods provides cover for methodological shortcuts. Counteracting it requires deliberate *conceptual quarantine*—reasserting original boundary conditions when terms re-enter technical discourse.
