answer: |-
  ## Opening Remarks: The Boundary of Calling

  Good morning. It is a privilege to welcome you all to this crucial workshop, “The Boundary of Calling: Work, Leisure, and the Thirty-Five-Hour Limit.” We gather at a vital intersection, bringing together diverse perspectives essential to untangling a profound human question: the relationship between our labor and our lives.

  We are here because this boundary – this line we draw around work – is not merely administrative. It is deeply personal, intensely social, and undeniably political. On one side lies **work as a calling**: that powerful sense that our labor is meaningful, a source of identity and purpose, something that connects us to something larger than ourselves. It carries dignity, significance, and a profound moral weight. To diminish this is to diminish a core part of the human spirit.

  On the other side lies **leisure as an inalienable right**: the necessity of time – time for rest, for recovery, for family, for community, for simply *being* beyond the demands of productivity. This is not idleness. This is the space where we renew ourselves, where creativity often sparks, and where we engage with the world not as workers, but as citizens, family members, and individuals. Crucially, we know – tragically, indisputably – that the *absence* of this boundary, the relentless encroachment of work, leads to exhaustion, broken health, and, in the starkest terms, lives cut short by work that consumes us. Protecting this boundary protects human life itself.

  Herein lies our central tension, a tension we must hold carefully, respectfully, and productively over these two days.

  For those whose lives are dedicated to understanding the structures of labor and meaning, the idea of the "calling" resonates deeply with historical and cultural forces that shape our very identities through work. You understand the complex politics surrounding attempts, like the thirty-five-hour week, to formally establish that protective boundary. You see the intricate dance between economic necessity, cultural values, and political will.

  For those on the front lines, fighting for safer workplaces, fairer schedules, and enforceable limits, the lived reality is paramount. You see the human cost when the boundary dissolves – the strain on families, the bodies broken by stress, the lives lost to overwork. You know that lofty ideas about vocation can too easily become weapons used to demand endless sacrifice. You rightly demand concrete protections, not abstract philosophy.

  To both groups, I say: this workshop needs your voices. We cannot resolve this tension today. Indeed, the power of our collective inquiry *depends* on holding this tension alive. We must navigate this space with intellectual honesty and deep empathy.

  We must acknowledge: **Reducing work hours is fundamentally protective.** It saves lives, preserves health, and safeguards families. This is not a concession; it is a necessity grounded in the most basic respect for human well-being. **And yet,** to frame this *only* as limitation, *only* as protection *from* work, risks undervaluing the profound dignity and meaning that labor, conceived as a true calling, can bring. We must speak of protection without implying that the work itself lacks inherent worth.

  Similarly, we must take seriously the **power and nobility of vocation** – the deep human drive to contribute, to create, to serve through our work. **And yet,** we must be vigilant. Vocation cannot become a cloak for exploitation. It cannot be invoked to justify demands that erode the very humanity it purports to honour. We must uphold the ideal of meaningful work while fiercely rejecting its distortion into a tool for endless extraction.

  Our challenge over these two days is to explore this contested boundary without collapsing its essential duality. Can we conceive of work that is deeply meaningful *and* firmly bounded? Can we define leisure not as the mere absence of work, but as a vital, positive space integral to a fully human life? Does the thirty-five-hour limit – or any such limit – function best as a necessary fence *around* the territory of vocation, keeping it contained for the sake of life beyond it?

  **Or, does this very framing reveal a deeper problem? Must we fundamentally reconceive vocation itself?**

  **Does the boundary we seek lie not just *around* work, but *within* it?** Is it possible – is it necessary – to imagine a "calling" that *intrinsically* includes, respects, and even requires the space of leisure, not as an exception, but as part of its very meaning and sustainability?

  This is the open question upon which our workshop turns. It is not rhetorical; it is the genuine, difficult inquiry we are here to pursue. Let us engage with courage, respect, and the shared understanding that what we grapple with here touches the core of how we live, how we work, and ultimately, how we value human life itself.

  I wish us all a rigorous, challenging, and profoundly fruitful two days. Thank you.
