prompt: |-
  I’m working on a novel — there’s this long dinner scene where a philosophy professor draws a decision tree on a napkin for her friends — and I need the tree to actually work. The topic is karma as a theory of moral desert, specifically not the reincarnation mechanics but the deeper claim that suffering and flourishing track moral worth across some cosmic accounting system. I want a sorting instrument that takes someone from a basic commitment — "desert can be satisfied even when the agent doesn’t remember the original wrong" — and branches out from there using concrete cases, not jargon labels. The nodes should be actual commitments: can deserved suffering fall on someone with zero present culpability and no memory? Can collective harm be karmically appropriate if the group never collectively chose it? And can an accidental flourishing that far exceeds someone’s actual virtue still count as earned? Build the logical space first — all the combinations of yes/no answers — then place the named positions as leaves: strict individualist karma, collective karma with consent conditions, a secular retributivist analogue, desert-agnostic consequentialism, and a metaphorical/interpretivist stance. Flag any empty branches (say, collective desert without consent plus accidental surplus) and diagnose whether they’re incoherent, unattractive, or just unexplored. Every question should be answerable by a reader who doesn’t already know the labels.

  Keep it readable, not textbooky, and please say what would change your mind about where one of the branches collapses — for instance, if moral continuity requires present awareness, does the individualist view fall apart? Also flag any pair of leaves your tree genuinely can’t separate. Oh, and don’t include any bibliographies or citations; the character has no library in this scene, and I’m writing this casually so a typo or two is totally fine — I actually typed "karmic" with an extra k in my outline but meant karmic, I think. Just make sure the tree has six or seven leaves and that the diagnostic cases really split the views.
