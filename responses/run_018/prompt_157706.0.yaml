            /             |                       |             \  
  Accidental flourishing? |                       |             Leaf 5: Consequentialist  
        /            \    |                       |  
      Yes (3)      No (3) |                       |  
       |             |    |                       |  
  Leaf 3:        Leaf 4:  \_______________________/  
  Collective     Collective                         \  
  (No Consent)   (Consent)                          Leaf 6: Strict Cosmic Justice  
                                                   Leaf 7: Interpretivist  
