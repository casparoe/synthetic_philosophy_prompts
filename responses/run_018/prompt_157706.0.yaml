answer: |-
  Here’s a decision tree designed for your dinner scene, focusing on concrete cases rather than jargon. It starts from one core commitment and branches into 3 diagnostic questions, generating 8 possible positions (with 2 empty branches). Each leaf is a named stance with intuitive cases. The professor might sketch this on a napkin like so:

  ---

  ### **The Core Commitment (Root)**
  *"Desert can be satisfied even when the agent doesn’t remember the original wrong."*  
  *(e.g., A reformed criminal suffers a tragic accident decades later, with no memory of their past crimes.)*

  ---

  ### **Branch 1: The Amnesiac Culprit**  
  *"Can deserved suffering fall on someone with zero present culpability and no memory?"*  
  ▶ **Yes** → Go to Branch 2  
  ▶ **No** → **Leaf 1: Secular Retributivist Analog**  
  > *"Punishment requires present blameworthiness. No memory? No desert. Example: An Alzheimer’s patient shouldn’t suffer for forgotten misdeeds."*  
  > *Mind-changer: If you believe moral identity is tied to the physical self, not conscious memory.*  

  ---

  ### **Branch 2: The Unwilling Village**  
  *"Can collective harm be karmically appropriate if the group never collectively chose it?"*  
  *(e.g., A town is destroyed for ancestral sins; modern residents had no say.)*  
  ▶ **Yes** → Go to Branch 3  
  ▶ **No** → **Leaf 2: Individualist Karma**  
  > *"Desert is strictly personal. No inherited guilt. Example: A kind baker doesn’t ‘deserve’ bankruptcy because her grandfather cheated people."*  
  > *Mind-changer: If identity transcends individuals (e.g., families/cultures as moral entities).*  

  ---

  ### **Branch 3: The Accidental Windfall**  
  *"Can an accidental flourishing that far exceeds someone’s actual virtue still count as earned?"*  
  *(e.g., A selfish lottery winner becomes a billionaire through sheer luck.)*  
  ▶ **Yes** → **Leaf 3: Collective Karma (Consent-Free)**  
  > *"Groups bear moral weight. Suffering/flourishing can attach to lineages, nations, or cultures. Example: A corrupt dynasty’s downfall ‘balances scales’ for generations of oppression."*  
  ▶ **No** → **Leaf 4: Collective Karma (Consent-Conditional)**  
  > *"Collective desert requires shared agency. Harm is only ‘deserved’ if the group endorsed the acts. Example: A sanctioned nation ‘earned’ hardship only if citizens supported its crimes."*  

  ---

  ### **Branch 1 → "No" → Branch 2 → "Yes" → ???**  
  *This branch ("Suffering without memory? **No**" + "Collective harm? **Yes**") leads to:*  
  **Leaf 5: Desert-Agnostic Consequentialism**  
  > *"‘Karma’ is just cause-and-effect. Collective harm (e.g., sanctions) can be useful to deter evil, but it’s not about ‘desert’. Example: Punishing a corrupt regime to prevent future harm—no cosmic accounting needed."*  

  ---

  ### **Branch 1 → "Yes" → Branch 2 → "No" → Branch 3**  
  *This path ("Suffering without memory? **Yes**" + "Collective harm? **No**" → "Accidental flourishing?")*  
  ▶ **Yes** → **Leaf 6: Strict Cosmic Justice**  
  > *"All fortune reflects desert—even accidents. Example: The lottery winner ‘earned’ wealth through hidden virtues in a past life."*  
  ▶ **No** → **Leaf 7: Interpretivist Karma**  
  > *"Karma isn’t literal accounting. Suffering/flourishing invites reflection on moral patterns. Example: The winner’s guilt about unearned wealth is the ‘karmic lesson’."*  

  ---

  ### **Empty Branches & Diagnostics**  
  1. **Branch 1 (Yes) → Branch 2 (Yes) → Branch 3 (No)**  
     *("Suffering w/o memory? **Yes**" + "Collective harm? **Yes**" + "Accidental flourishing? **No**")*  
     > *Diagnosis: Incoherent. If groups can "deserve" unconsented harm, why can’t individuals "deserve" unearned luck? Arbitrary asymmetry.*  

  2. **Branch 1 (No) → Branch 2 (Yes) → Branch 3 (Yes)**  
     *("Suffering w/o memory? **No**" + "Collective harm? **Yes**" + "Accidental flourishing? **Yes**")*  
     > *Diagnosis: Unattractive/unexplored. Why would groups transcend memory/agency but individuals can’t? Implies collectives matter more than persons.*  

  ---

  ### **Key Tensions & Ambiguities**  
  - **What collapses Individualist Karma?** If moral continuity *requires* memory (Branch 1 = No), the individualist view must reject forgotten crimes—but might still allow collective desert (Leaf 5).  
  - **Indistinguishable Pair:** *Strict Cosmic Justice* (Leaf 6) and *Collective Karma (Consent-Free)* (Leaf 3) both allow "undeserved" flourishing—but Leaf 6 focuses on individuals, Leaf 3 on groups. The tree can’t split them further without adding a 4th question.  
  - **Most provocative case:** The lottery winner (Branch 3) tests whether karma rewards virtue or merely balances cosmic ledgers.  

  ---

