answer: |-
  Here are 8 tightly focused questions designed to press Dr. Linde's core arguments, anticipating deflections and weaving in follow-ups:

  1.  **Mnemonic Extraction Core:** "Dr. Linde, you argue that dramatizing the dead isn't just risking factual error, but involves 'mnemonic extraction' – mining them for emotional resonance they never authorized. *Exactly how does this differ fundamentally* from, say, a historian accidentally misinterpreting a diary entry? **And if you say it's primarily a metaphor, what's the *tangible harm* this metaphor describes that simple error doesn't capture?**"

  2.  **Standing Without Consciousness:** "You claim the dead have 'standing' against being made protagonists. Since they lack consciousness, what's the *source* of this standing – is it intrinsic to their past existence, or something we project? **When you inevitably say standing doesn't require current consciousness, *how does that translate to a meaningful, non-arbitrary obligation* for the living storyteller beyond just our own discomfort?**"

  3.  **Silence Gap & Erasure Paradox:** "Your 'silence gap' method suggests leaving inner life blank where records are thin to avoid projection. But for marginalized figures like my union-organizer great-grandmother, the historical record *is* often thin *because* they were marginalized. **How do you avoid this method *reproducing the very historical erasure* you're concerned about when dramatizing them fills those gaps?**"

  4.  **Fiction vs. Biography Boundary:** "If I write a *novel* featuring a character transparently based on Dr. Mara Linde – her work, life events, core ideas – but change her name and setting, have I still committed 'mnemonic extraction'? **Does the fictional framing dissolve the obligation to the real dead person you're drawing from, or is the extraction in the *recognition* itself?**"

  5.  **Villains & Moral Desert:** "Does posthumous opacity apply equally to dramatizing a dead tyrant? Does the moral desert of the individual change the *kind* of obligation we have, or the *permissibility* of mining their inner life for narrative? **If your answer is 'no, obligation stands', *how do you reconcile that with the potential value* of understanding evil through dramatization for the living?**"

  6.  **Beyond Accuracy - The Filmmaker's Metric:** "You argue accuracy is the wrong metric. For my uncle making this documentary, if not accuracy, *what specific metric or principle should guide his portrayal* of my great-grandmother's motivations and feelings? **And crucially, since he *can't* check his choices against her own view, *how is this metric operationalized or judged* without falling back on guesswork disguised as principle?**"

  7.  **Descendants vs. The Dead:** "Isn't the core concern here *really* about the living – respecting descendants' feelings or preventing societal misrepresentation? **If the answer leans yes, *why frame the ethical violation specifically around the rights or 'standing' of the non-sentient dead* rather than the tangible harms to the living community or family?**"

  8.  **The Core Practical Tension:** "Ultimately, your view seems to demand a radical restraint: *don't make the dead the protagonist* unless you have overwhelming, explicit evidence for their inner world. But doesn't this functionally mean **only the most exhaustively documented, usually privileged, figures can be dramatized ethically, silencing countless others whose stories we might *need* to tell, even imperfectly? How is that not a profound loss?**"

  **Interview Strategy:** Relentlessly anchor abstract concepts to concrete storytelling dilemmas (like the documentary) and press for actionable definitions while exposing potential contradictions or unintended consequences within her framework.
