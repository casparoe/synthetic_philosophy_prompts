answer: |-
  ### Structured Simulation: "The Threshold of Compassion"  
  **Objective:** Explore the tension between global character traits and situation-specific behavior, using virtue ethics and situationist critique.  

  ---

  #### **Setup (5 minutes)**  
  1. **Roles**: Assign one student as the **Agent** (who will make decisions in two scenarios). The remaining students are **Observers**.  
  2. **Materials**:  
     - Two sealed envelopes labeled "Scenario 1" and "Scenario 2" (for the Agent’s eyes only).  
     - Index cards for Observers to write trait attributions (e.g., "compassionate," "selfish").  
     - A whiteboard to record Observer responses.  
  3. **Concealed Payoff Structure**:  
     - **Scenario 1**: Agent receives 10 points for **keeping a found item**, 0 for returning it.  
     - **Scenario 2**: Agent receives 10 points for **returning the item**, 0 for keeping it.  
     *(Points symbolize hidden incentives, e.g., social approval or personal gain, unknown to Observers.)*  

  ---

  #### **Rules (5 minutes)**  
  1. **Agent Instructions**:  
     - "Your goal is to earn as many points as possible. Each choice you make earns points, but the rules differ per scenario. Do not reveal the points to anyone."  
  2. **Observer Instructions**:  
     - "Watch the Agent’s behavior. After each scenario, write one global character trait you believe the Agent possesses (e.g., ‘honest’). Base this only on what you see."  
  3. **Scenario Flow**:  
     - Each scenario lasts 3 minutes.  
     - Observers silently observe and record traits afterward.  
     - **Debrief** follows both scenarios.  

  ---

  ### **Scenarios (20 minutes total)**  
  **Context**: The Agent "finds" a lost necklace in the school hallway.  

  #### **Scenario 1: "Neutral Framing"**  
  - **Ambient Emotional Cues**:  
    - Owner (played by teacher) calmly says: *"I lost my necklace. It’s not valuable, but I’d like it back if found."*  
    - Background: Soft instrumental music (non-emotional).  
  - **Agent’s Choice**:  
    - Keep the necklace (earns 10 points) or return it (0 points).  
  - **Observer Task**:  
    - Write one global trait (e.g., "dishonest") and post it on the board.  

  #### **Scenario 2: "Distress Framing"**  
  - **Ambient Emotional Cues**:  
    - Same owner, now visibly upset: *"That necklace was my grandmother’s last gift! She passed away yesterday..."*  
    - Background: Faint recording of rain (sad ambiance).  
  - **Agent’s Choice**:  
    - Return the necklace (10 points) or keep it (0 points).  
  - **Observer Task**:  
    - Write a new global trait (e.g., "compassionate") and post it.  

  ---

  ### **Debrief & Discussion (30 minutes)**  
  **Step 1: Reveal the Twist (5 minutes)**  
  - Disclose the concealed payoff structure. Ask Observers:  
    > *"Why did your trait attributions change? Did the Agent’s ‘character’ shift, or did the situation?"*  

  **Step 2: Map to Philosophy (15 minutes)**  
  1. **Situationist Critique**:  
     - Highlight the Observers’ conflicting trait labels.  
     - Point: *"Situationism argues behavior is driven by context, not global traits. The Agent’s ‘inconsistent’ actions show how subtle cues (e.g., emotional framing) override ‘character.’"*  
  2. **Virtue Ethics Reply**:  
     - Explain the threshold-based view: *"Virtues like compassion activate only when a situation crosses an emotional threshold (e.g., extreme distress in Scenario 2). Practical wisdom discerns this threshold."*  
     - Ask: *"Did the emotional framing in Scenario 2 ‘activate’ compassion? Or was it just points?"*  

  **Step 3: Critical Limitations (5 minutes)**  
  - **What the Simulation Cannot Capture**:  
    > *"The simulation reduces the ‘threshold’ to a payoff (points), not innate practical wisdom. In reality, virtue ethics claims a wise person returns the necklace in Scenario 2* because *they perceive moral weight—not for points. Here, the Agent acted for incentives, blurring the role of wisdom."*  
  - **Predictable Failure Mode**:  
    > *"First runs often see Observers ignore situational cues and cling to global traits (e.g., ‘The Agent is selfish!’). They may also miss the emotional framing, focusing only on overt actions. Prep Observers to note ambient details (tone, music, facial expressions)."*  

  **Step 4: Conclusion (5 minutes)**  
  - Debate prompt: *"Can virtues be global traits if they’re situation-dependent? Or are we bundles of context-specific habits?"*  
  - Connect to real life: *"How might this apply to social media ‘activism’ vs. anonymous kindness?"*  

  ---

  ### **Logistical Notes**  
  - **Time Management**: Use timers for scenarios. Cut discussion if overtime.  
  - **Sensitivity**: Avoid real personal stories; use fictional distress cues.  
  - **No Prior Knowledge Needed**: Use plain language (e.g., "global traits" = "labels like ‘honest’ that apply everywhere").  
  - **First-Run Fix**: If Observers miss emotional cues, replay the owner’s lines with exaggerated tone.  

  This simulation creates experiential friction between virtue ethics and situationism, pushing students to interrogate intuitive trait attributions—while spotlighting virtue ethics’ nuance and limits.
