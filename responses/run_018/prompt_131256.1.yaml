prompt: |-
  me and my friend just got into it about funcitonalism and whether the multiple realizability thing actually helps or just breaks everything. like, if mental states are just causal roles, then an AI running on silicon and a human running on neurons could both literally have the belief that paris is capital of france, right? but then my friend brought up trivial realization—if the role is defined loose enough, you could program a rock or a bathtub to do the same state transitions, so suddenly everything is conscous. i want someone to walk me through the conceptual knot: does multiple realizability save functionalism from brain-identity theory, or does it just open the door to panpsychism and make the view unfalsifiable? specifically, is there a principled way to say this computation counts but that one doesnt without smuggling in biological chauvinism? explain the tension like im not an expert, but dont just repeat the standard textbook line—im trying to figure out if the problem is with the definition of function or with the idea that realization doesnt matter at all. please dont list philosophers or give me a bibliography, i want the gut intuition for why this is still unsolved.
