  We are building an interactive instrument to sort readers according to their views on aesthetic testimony. The instrument will have 8-10 questions, each presenting a concrete scenario with 2-3 response options. The scoring will map answer patterns onto named positions.

  The positions we aim to distinguish are derived from the logical space along the axes provided. We'll consider the following axes:

  1. **Reason to believe**: Does another's report give a reason to believe something is aesthetically good?
  2. **Justification for belief/assertion**: Can testimony alone justify an outright aesthetic belief or assertion?
  3. **Aesthetic knowledge**: Can testimony yield aesthetic knowledge, or is first-hand acquaintance required?
  4. **Attentional scaffolding**: Is the main function of aesthetic talk to direct attention to features that one must experience for oneself?

  From these, we'll define the following positions:

  - **Strict Acquaintance Requirement (SAR)**: First-hand experience is necessary for any aesthetic judgment, belief, or knowledge. Testimony might direct attention but cannot provide reasons for belief or knowledge.
  - **Evidentialist View (EV)**: Testimony can provide evidence that justifies belief in the aesthetic quality, but it does not suffice for full aesthetic judgment (which requires acquaintance). So, one can believe based on testimony, but not fully judge or know the aesthetic character.
  - **Full Transmission View (FTV)**: Reliable criticism can transmit aesthetic knowledge. Testimony can justify outright belief and provide knowledge without acquaintance.
  - **Deflationary/Conversational View (DCV)**: Testimony doesn't transmit beliefs or knowledge about aesthetic value. Instead, it serves as advice or attentional scaffolding that helps one experience the work appropriately.

  Additionally, note that there might be combinations that are unoccupied (incoherent, unattractive, or unexplored). We must also flag positions our instrument cannot separate.

  We'll design questions that are diagnostic for these positions. Each question will target one or more of the axes. We'll include at least one question on each of the specified scenarios: film reviews, choosing exhibitions, wine tasting notes, and what is lacking without first-hand experience.

  Let's design the instrument.

  ---

  **Questionnaire: Which account of aesthetic testimony do you actually hold?**

  *Instructions: For each scenario, choose the option that best reflects what you would say or do.*

  1. **Film Review**: A trusted film critic, whose taste you generally share, writes a glowing review of a new film. You haven't seen it. When a friend asks if the film is any good, you say:
     - A) "Yes, it's excellent — I read a great review."
     - B) "I hear it's excellent, but I haven't seen it myself."
     - C) "The critic says it's excellent, so I recommend you see it and judge for yourself."

     *Rationale*: This tests whether testimony justifies an outright assertion of aesthetic goodness (A: FTV or EV? but note EV might not allow outright assertion) or whether one defers (B: SAR, EV) or treats it as advice (C: DCV). 

  2. **Exhibition Choice**: You have time to visit only one of two exhibitions. A friend whose judgment you trust has seen both and recommends Exhibition A over B. You:
     - A) Visit Exhibition A without further thought, confident it's better.
     - B) Consider the recommendation but also look at the descriptions of both exhibitions to see which one appeals more to your own interests.
     - C) Visit Exhibition A because your friend recommended it, but you don't form a belief that it is better until you see it.

     *Rationale*: Tests whether testimony can justify a choice (and thus a practical belief) without acquaintance. A: FTV (if confident) or EV?; B: DCV (seeking more for one's own attention) or EV?; C: SAR or EV (if EV allows acting but not belief).

  3. **Wine Tasting**: A sommelier describes a wine in great detail, noting its balance, complexity, and how the flavors evolve. You haven't tasted it. Can this description give you knowledge of the wine's aesthetic merits?
     - A) Yes, if the sommelier is reliable and the description is accurate, I can come to know it's a great wine.
     - B) It can give me a good reason to believe it's a great wine, but I wouldn't say I know until I taste it.
     - C) No, it only tells me what to pay attention to when I taste it.

     *Rationale*: Directly addresses whether testimony can yield aesthetic knowledge. A: FTV; B: EV; C: SAR or DCV.

  4. **Lacking Experience**: Someone has read many detailed descriptions and reviews of a novel but hasn't read it. They say, "I know all about the novel, but I don't know what it's like to read it." What do they lack?
     - A) Nothing important for aesthetic judgment — they can judge it as good or bad.
     - B) They lack the evidence needed to justify a belief about its aesthetic value.
     - C) They lack the first-hand experience that is necessary to have any aesthetic appreciation of it.

     *Rationale*: Tests the necessity of acquaintance for aesthetic appreciation or judgment. A: FTV; B: EV (they have evidence but not sufficient?); C: SAR or DCV? Note: DCV might say they lack the experience that the testimony is meant to scaffold.

  5. **Concert Recommendation**: A friend whose musical taste matches yours attends a concert and tells you it was the most moving performance they've ever experienced. You haven't heard the performers. Do you:
     - A) Believe that it was a moving performance and tell others so.
     - B) Believe that it was moving but avoid asserting it because you haven't experienced it.
     - C) Not form the belief that it was moving, but you are now eager to experience it for yourself.

     *Rationale*: Tests whether testimony can cause belief and whether one is willing to assert. A: FTV; B: EV (belief but not assertion); C: SAR or DCV.

  6. **Book Club**: In a book club, a member who hasn't read the book but has read several reviews asserts, "This is a beautiful novel." How do you respond?
     - A) "I agree, it is beautiful." (if you've read it and agree)
     - B) "You can't say that without reading it."
     - C) "The reviews say it's beautiful, but you should read it to see for yourself."

     *Rationale*: Tests the acceptability of assertions based on testimony. A: FTV (if you accept their assertion) or EV?; B: SAR; C: DCV.

  7. **Artwork Description**: An art historian gives a detailed analysis of a painting's use of color and composition, concluding it is a masterpiece. You haven't seen the painting. Does this analysis:
     - A) Give you knowledge that the painting is a masterpiece.
     - B) Give you good reason to believe it's a masterpiece, but you'll only know when you see it.
     - C) Help you understand what to look for when you see it, but it doesn't provide belief or knowledge about its being a masterpiece.

     *Rationale*: Similar to Q3 but for visual art, to check consistency. A: FTV; B: EV; C: SAR/DCV.

  8. **Poem Sharing**: You read a poem and find it deeply affecting. You share it with a friend and say, "This poem is profound." Your friend reads it and disagrees. You say:
     - A) "You're wrong — it is profound."
     - B) "I guess we have different tastes."
     - C) "Did you notice how the imagery in the second stanza builds the theme?"

     *Rationale*: Tests whether one treats aesthetic judgments as factual (A) or as requiring individual experience (B) or as directing attention (C). A: FTV (if objective) or SAR (if acquaintance required but then disagreement might be harder) — note this is tricky. This question might be more about objectivity than testimony. We might reconsider. Alternatively, we can frame it as: You haven't read the poem, but a trusted friend tells you it's profound. Then you read it and don't find it profound. Do you think:
