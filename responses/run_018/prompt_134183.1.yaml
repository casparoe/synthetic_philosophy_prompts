prompt: |-
  I'm leading a ninety-minute session for public-policy graduate students—strong quantitative backgrounds, no philosophy—on Dewey's experimentalism about democracy and inquiry. Don't explain Dewey to me; design the teaching plan. First, lay out the dependency order: which conceptual piece must be secured before democracy can be presented as a mode of distributed inquiry rather than as a voting mechanism, and why the distinction between inquiry-as-problem-solving and truth-as-correspondence needs to come before any social dimension is introduced. Second, choose and justify the one carrying example: I'm considering a city that redesigns bus routes through iterative pilot loops with rider feedback rather than through a centralized master plan—evaluate whether this works, specify exactly what it must include (for instance, that failure is treated as data rather than error) and what it must exclude (for instance, pure market aggregation of preferences), and suggest one concrete adjustment if the example falls short. Third, map the misconceptions these students are likely to bring or form: that experimentalism licenses arbitrary trial-and-error without methodological rigor, that democratic inquiry collapses into majority opinion, and that Dewey is covertly reserving authority for a hidden expert class. For each misconception, indicate the precise point in the sequence where it should be headed off and the single move or framing that defuses it without derailing the arc. Fourth, propose a check-for-understanding question for the end that reveals whether they have grasped democracy-as-inquiry rather than democracy-as-preference-aggregation; it should be answerable without philosophical jargon and should distinguish the two interpretations clearly. Finally, state explicitly what to leave out at this level—such as Dewey's metaphysics of experience or his specific debates with Lippmann—and how to acknowledge those omissions so the session's coherence is not undermined.
reasoning: |-
  Okay, let's tackle this teaching plan request step by step. The user is clearly an experienced educator preparing a very targeted session - grad students with quant backgrounds but no philosophy, focusing specifically on Dewey's experimentalism in democracy. 

  First noticing the tight constraints: 90 minutes, must avoid philosophy jargon, needs concrete hooks for quantitatively-minded students. The core challenge seems to be translating Dewey's abstract concepts into policy-relevant frameworks without oversimplifying. 

  The dependency order is crucial here. For these students, we must start with inquiry-as-problem-solving because that's where their quant strengths align with Dewey's ideas. They'll readily grasp data-driven iteration, but the truth-as-correspondence distinction is the stumbling block - if they miss that, the whole "democracy as collective intelligence" angle collapses into technocracy. 

  The bus route example feels strong because:
  - It mirrors policy students' future work
  - Embodies iterative design 
  - Allows clear contrast with top-down planning
  But it's vulnerable to being misinterpreted as just agile policy. Need to explicitly build in the "failure as data" element and contrast with preference aggregation. Would suggest adding a rider representation component where marginalized groups' feedback gets weighted differently to show this isn't market logic.

  For misconceptions, timing is everything. The "trial-and-error" worry must be preempted when introducing the bus pilot loops by immediately framing them as structured experiments with defined metrics. The "majority opinion" fear should be addressed when discussing feedback mechanisms - maybe show how rider councils differ from surveys. The "hidden experts" concern is trickiest; best handled when contrasting with centralized planning by having students brainstorm who defines "failure" in the bus system.

  The check question is brilliant - forces application while testing conceptual grasp. "What would Dewey say to a mayor wanting to scrap the bus redesign?" makes them articulate the learning-vs-failure distinction. 

  Finally, the omissions. Must explicitly bracket metaphysics but justify why - "we're focusing on the operational toolkit today" keeps it coherent. Lippmann references would derail; can acknowledge by saying "while some contemporaries favored elite expertise..." then pivot back to Dewey's alternative.
answer: |-
  Here’s a focused 90-minute teaching plan optimized for policy students with quant backgrounds, prioritizing conceptual dependencies, a robust central example, misconception management, and clear boundaries:

  ---

  ### **1. Dependency Order & Sequence Rationale**  
  *(Total: 25 min)*  
  **Why this order:** Quant students default to technocratic solutions and voting mechanics. Dewey’s "democracy-as-inquiry" requires dismantling these assumptions step-by-step.  

  | Sequence                  | Time  | Rationale |  
  |---------------------------|-------|-----------|  
  | **A. Inquiry ≠ Truth-Seeking** | 10 min | Start with their strength (problem-solving). Contrast *solving concrete problems* (e.g., "reduce bus commute time") vs. *finding universal truths* (e.g., "optimal transit theory"). Emphasize: **Inquiry adapts to context; truth is fixed**. |  
  | **B. Inquiry as Iterative Experimentation** | 10 min | Introduce feedback loops: hypotheses → action → observed consequences → revision. Stress: **Failure = data, not error**. *Prerequisite for social dimension*: Without this, group work defaults to opinion aggregation. |  
  | **C. Democracy as Distributed Inquiry** | 5 min | Now frame democracy: **Collective intelligence > isolated expertise**. Voting is just one feedback tool; the core is structured social learning. |  

  ---

  ### **2. Central Example: Bus Route Redesign**  
  *(Total: 20 min)*  
  **Why it works:** Concrete, policy-relevant, and embodies iterative problem-solving. Leverages students’ systems-thinking.  

  **Must Include:**  
  - A defined **problem** (e.g., "70% of low-income riders face 60+ min commutes")  
  - **Pilot loops**: Small-scale route adjustments (e.g., new express line) → **mixed-method rider feedback** (surveys + ride-along interviews) → quantitative *and* qualitative data → revision.  
  - **Failure as data**: Pilot shows increased commute time for disabled riders → *not* scrapped, but redesigned with accessible stops.  

  **Must Exclude:**  
  - ❌ Pure preference aggregation (e.g., "51% vote for express routes" without testing real-world impact).  
  - ❌ One-off consultation (e.g., single town hall informing a fixed 5-year plan).  

  **Adjustment if Weak:** If students dismiss it as "just agile policy," add: **"How would this fail if riders couldn’t co-define metrics?"** (Answer: Without shared problem-framing, it becomes expert-driven tinkering).  

  ---

  ### **3. Misconceptions & Preemptive Defusing**  
  **Targeted at critical transition points:**  

  | Misconception                          | When to Defuse                     | Defusing Move                                                                 |  
  |----------------------------------------|------------------------------------|-------------------------------------------------------------------------------|  
  | **"This is just trial-and-error"**     | During *Iterative Experimentation* | Contrast: "Random trials vs. *hypothesis-driven pilots with tracked metrics*." Show a pilot’s pre-defined success/failure criteria. |  
  | **"Democracy = majority rule"**        | Introducing *Distributed Inquiry*  | Ask: "What if 80% of riders want faster service, but data shows this isolates wheelchair users? How does inquiry override votes?" → **Emphasize: Feedback informs solutions; votes don’t dictate design.** |  
  | **"Experts still control the process"**| During bus example debrief         | Pose: "Who defines the problem? What if riders say 'safety,' not 'speed'?" → Highlight **co-created problem-framing** via participatory workshops. |  

  ---

  ### **4. Check-for-Understanding Question**  
  *(Final 10 min)*  
  **Question:** *"A mayor says, 'We piloted free fares on one bus line. Ridership rose 20%, but costs exceeded projections. We’re ending the experiment.' How would Dewey evaluate this?"*  

  **Reveals:**  
  - **Inquiry grasp:** "Ending after one 'failure' ignores data; costs are a new problem to solve (e.g., funding models), not a full stop."  
  - **Vs. preference-aggregation:** Focus on *process* (did it generate adaptable knowledge?) not outcomes (did voters like it?).  

  ---

  ### **5. Strategic Omissions & Framing**  
  **Omit:**  
  - Dewey’s metaphysics ("experience," "nature")  
  - Historical debates (Lippmann, etc.)  
  - Epistemology of "warranted assertibility"  

  **Acknowledge without undermining:**  
  > *"Dewey’s full system connects to broader philosophy, but today we extract a policy-operational core: democracy as a learning system. Think of this as ‘applied experimentalism.’"*  

  ---

  ### **Timeline Summary**  
  - **Dependency Order** (25 min)  
  - **Bus Example Deep Dive** (20 min)  
  - **Group Exercise:** Redesign the bus pilot to avoid one misconception (15 min)  
  - **Misconception Q&A** (10 min)  
  - **Check Question + Wrap** (10 min)  

  **Key Leverage:** Quant students respect method. Anchor Dewey in *rigorous process* (hypothesis-testing, data iteration), not "philosophy." The bus example makes distributed cognition tangible—show them the math (e.g., feedback data improving predictive models over time).
