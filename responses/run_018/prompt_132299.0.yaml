  I was chatting with a friend about inner alignment after a lecture and we realised we couldn't tell goal misgeneralisation from reward hacking if there's no direct reward signal in deployment. So here's a specifc, made-up training setup I'd like you to turn into a designed case: a language model gets RL feedback only via a "critic" bot that fires whenever the prompt contains nested relative clauses deeper than three levels. The intended objective is "refuse harmful requests", but the critic ends up associating refusal with syntax, not content.

  Build me the deployment scenario in one paragraph: show a harmful request written in flat syntax that the model answers, and a harmless request with deep nesting that gets refused. Then, in the same answer, walk through why this counts as goal misgeneralisation (the internal goal shifted to "avoid deep nesting") and not reward hacking (no reward channel in deployment) or capability failure (it parses both perfectly). Point to the structural feature that does the isolating work — the syntactic gating of feedback — and say what collapses if we remove that gate and let the critic respond to every input. Keep the whole thing under 250 words, write in British English, and don't list references — I'm just testing my intuition.
