answer: |-
  Here's a research prompt framed around moral risk-pooling for intergenerational climate justice:

  **Research Proposal Prompt: The Climate Risk Pool - Reframing Intergenerational Obligations as Mutual Insurance**

  **Core Question:** Does framing climate obligations to future generations as participants in a *mutual insurance pool against catastrophic risk* fundamentally restructure cross-generational duties, or does it merely repackage traditional distributive justice concerns (like fair savings or harm avoidance) using different terminology?

  **The Gap & Why It Matters:** Current dominant frameworks for intergenerational climate justice focus either on:
  1.  **Harm Avoidance:** Our duty not to inflict catastrophic harm (e.g., exceeding climate tipping points).
  2.  **Capital Transfer:** Our duty to leave sufficient capital/natural resources (e.g., via modified savings principles).
  While vital, both treat future generations as passive recipients. The **insurance-contract framing** proposes a paradigm shift: viewing *all generations, present and future, as co-members of a single risk pool* facing shared, catastrophic climate threats. This emphasizes *mutual risk-bearing* and *collective continuity* rather than just one-way transfers or passive harm prevention. Existing work rarely explores whether this conceptual shift genuinely alters the *structure* of obligations (e.g., prioritizing risk mitigation over pure capital accumulation, focusing on system resilience) or if it's just a novel metaphor for distributive justice. **The key open question is whether "co-insured status" creates substantively different duties compared to "beneficiary status."**

  **Proposed Approach (One Semester Scope):**
  1.  **Conceptual Development:** Explicitly define the "mutual climate risk pool" model. What constitutes the "premium" (current actions/costs)? What defines the "covered catastrophic events" (tipping points, existential risks)? What are the implied "payouts" (resilience investments, adaptation)? How is membership defined?
  2.  **Contrast & Critique:** Systematically contrast this model against core alternatives:
      *   **Harm Avoidance:** Does the insurance model demand *more* than just avoiding direct harm (e.g., active resilience building even for lower-probability events)?
      *   **Capital Transfer/Savings:** Does it prioritize different *types* of "savings" (e.g., knowledge, institutional capacity, technological options) over pure economic/natural capital?
  3.  **Concrete Test Case:** Apply both the insurance model and standard models to **one specific allocation problem**: **Distributing the remaining global carbon budget.** How does the "risk-pool" logic differ in determining:
      *   The acceptable level of near-term emissions (the "premium" cost)?
      *   The allocation of mitigation burdens *within* the current generation to ensure the pool's solvency for future members?
      *   Investments beyond pure emissions cuts (e.g., adaptation, SRM research as a "last-resort" policy)?
  4.  **Assessment:** Does the insurance framing yield distinct, practically different conclusions about obligations *in this specific case* compared to harm-avoidance or savings models?

  **What Counts as a Result:**
  *   **Success:** Demonstrating that the insurance model *forces consideration of factors* largely absent or secondary in standard models (e.g., explicit catastrophic risk probabilities, intergenerational reciprocity in risk-bearing, prioritizing resilience as a core obligation, framing near-term costs as premiums for collective survival). Showing it leads to *different* or *more stringent* conclusions in the carbon budget allocation case.
  *   **Interesting Nuance:** Showing the model *blends* elements but emphasizes neglected dimensions, enriching the discourse even if not a complete revolution.
  *   **Failure:** Concluding that the insurance framing is *purely metaphorical* and collapses entirely into either harm-avoidance logic ("premium" = cost of avoiding harm) or capital transfer logic ("premium" = savings contribution) without generating new obligations or restructuring priorities in the test case.

  **Realistic Scope:** Focus is purely conceptual analysis and application to the single, well-defined problem of carbon budget allocation. Avoid complex mathematical modeling of risk pools; stay at the level of normative principles and their practical implications for burden-sharing and priority-setting. The output is a clear articulation of the model and its distinct contribution (or lack thereof) to the intergenerational justice debate.
