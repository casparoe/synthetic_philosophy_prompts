answer: |-
  ### Final Examination Question  
  **Time Limit:** 75 minutes  
  **Expected Length:** 800–1000 words  
  **Conceptual Crux:** Evaluate whether the hypothetical *Nested Reference-Class Principle* resolves the tension between deference to objective chance and statistical inadmissibility, or whether it introduces arbitrariness that undermines the objectivity central to the Principal Principle.  

  **Prompt:**  
  The *Principal Principle* (PP) requires rational agents to align their credences with known objective chances, barring "inadmissible" evidence. However, the "big bad bug" objection highlights cases where known *statistics* conflict with known *chances*, creating tension between deference and inadmissibility. Consider a modified principle:  

  > **Nested Reference-Class Principle (NRCP):**  
  > *Cr(A | E) = ch_{RC}(A)$*,  
  > where *ch_{RC}* is the objective chance of *A* within the **finest-grained admissible reference class** for which the agent possesses *legitimate self-locating membership evidence*.  

  Assess whether NRCP resolves PP’s conflict with statistical inadmissibility. Does NRCP avoid the "big bad bug" by nesting chances in reference classes? Or does reliance on "finest-grained" reference classes and "self-locating membership evidence" collapse into arbitrariness, sacrificing the objectivity PP seeks to preserve? Engage with the core challenge of reconciling chance deference with statistical evidence while preserving objectivity.  

  ---

  ### Model Answer (≈600 words)  
  **Settled Core of Deference and the Inadmissibility Tension**  
  The Principal Principle (PP) formalizes deference to objective chance: rational credence *Cr(A)* should match known chance *ch(A)*, unless the agent possesses *inadmissible evidence*—information "about how the chancy process turns out" (Lewis 1980/1994). Crucially, PP treats chance as an *unconditional, global* physical probability. The "big bad bug" arises when agents know both *ch(A)* and *statistical frequencies* that diverge from *ch(A)*. For example: knowing a coin’s chance of heads is 0.5 (per its design) *and* that it belongs to a batch of coins with 99% heads-up bias. Treating the statistic as inadmissible (per PP) seems to ignore relevant information, yet admitting it threatens to *replace* chance with statistics. This exposes a tension: PP demands deference to a single chance, but agents often access *multiple* probability structures.  

  **Evaluating NRCP’s Proposed Resolution**  
  NRCP aims to resolve this by requiring deference to chances *within a reference class*. By conditioning on the "finest-grained admissible" class for which the agent has self-locating evidence, NRCP seemingly integrates statistical data *without* overriding chance. In the coin case, the agent might defer to *ch(A | batch)* = 0.99 rather than *ch(A)* = 0.5, avoiding conflict.  

  However, two problems emerge:  
  1.  **Reference-Class Individuation:** What makes a reference class "admissible" or "finest-grained"? NRCP assumes classes are objectively grounded, but reference classes are often gerrymanderable. Is the coin’s batch defined by manufacture date, factory, or chemical composition? Without principled constraints, NRCP risks *arbitrariness*. PP’s objectivity relies on chance being a *fundamental* physical feature; NRCP replaces this with context-dependent probabilities, potentially reducing chance to a mere statistical aggregate.  
  2.  **Self-Locating Evidence and Subjectivity:** NRCP requires evidence of membership in a reference class. But self-locating evidence ("I am holding *this* coin") is agent-relative. While some frameworks (e.g., centered worlds) formalize such beliefs, integrating them into chance deference risks *subjectivist collapse*. If chance is tied to agent-relative reference classes, it loses its mind-independent authority—precisely what PP’s objectivity requires.  

  **Contested Terrain**  
  This reveals deeper, unsettled debates:  
  - **Admissibility**: Whether "admissibility" has principled physical grounds (e.g., causal independence) or is ad hoc (Hoefer 2007; Schaffer 2007).  
  - **Self-Location**: Whether self-locating beliefs can be incorporated without surrendering objectivity (Meacham 2010 vs. Titelbaum 2013).  

  **Judgment**  
  NRCP *dissolves* the big bad bug by rejecting PP’s monolithic chance, but at significant cost. It resolves statistical conflicts by fragmenting chance into reference classes, yet this fragments *objectivity* itself. Without robust criteria for class individuation, NRCP invites arbitrariness; by tethering chance to self-locating evidence, it conflates epistemic and metaphysical constraints. While PP’s global chance faces tensions, NRCP’s local chances sacrifice the very objectivity that makes deference rational. Thus, NRCP fails to preserve the core virtue of PP: grounding rational belief in a *mind-independent* physical probability.  

  ---

  ### Marking Scheme (Total: 25 marks)**  
  | **Analytical Move**                                                                 | **Marks** | **Characteristic Mistake (Costs Marks)**                              |  
  |-------------------------------------------------------------------------------------|-----------|------------------------------------------------------------------------|  
  | **1. Clearly articulates PP’s core mechanism and the tension raised by inadmissible evidence (e.g., big bad bug).** | 5 | *Summarizes PP without explaining why inadmissible evidence creates conflict with statistics.* |  
  | **2. Accurately explains NRCP’s structure and how it aims to resolve PP’s tension via reference classes.** | 5 | *Misrepresents NRCP as merely adding statistics to PP, missing the "nesting" and self-locating elements.* |  
  | **3. Evaluates NRCP’s viability re: reference-class individuation (arbitrariness vs. objectivity).** | 5 | *Fails to identify gerrymandering risk or conflates reference classes with arbitrary partitions.* |  
  | **4. Evaluates NRCP’s handling of self-locating evidence and its implications for objectivity.** | 5 | *Neglects the subjectivist collapse threat or treats self-location as unproblematic.* |  
  | **5. Reaches a reasoned judgment, distinguishing settled vs. contested issues (admissibility/self-location).** | 5 | *Asserts consensus where none exists or ignores open debates in the conclusion.* |  

  ---

  **Key Notes for Grading:**  
  - Award marks for *analytical precision*, not personal agreement with the model answer.  
  - Top-tier responses (21–25) explicitly engage contested debates (e.g., "Is admissibility principled?").  
  - Mid-tier (15–20) accurately describe mechanisms but lack critical evaluation of NRCP’s objectivity trade-offs.  
  - Failures (<10) confuse PP with NRCP, misdefine inadmissibility, or reduce the answer to summary.
