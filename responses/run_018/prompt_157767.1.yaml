answer: |-
  Your observation reveals a profound tension in historiography's epistemology, centered on the **nature of historical evidence and the criteria for legitimate revision**. The institutional rejection of Fomenko-style statistical revisionism (while accepting hermeneutic/material adjustments) implies a specific theory of historical knowledge:

  ### Implicit Epistemology: Hermeneutic Realism with Causal-Embedded Events
  1. **Source Ontology**:  
     History presupposes that **facts emerge from testimonial traces** (texts, artifacts) embedded in causal chains of human action. These traces are not raw data but *meaning-laden residues* requiring contextual interpretation. Statistical correlations (e.g., dynastic timeline overlaps, astronomical retrocalculations) are rejected as *epistemically inert* because they bypass testimonial meaning.  

  2. **Continuity as a Necessary Condition**:  
     Historical knowledge relies on **source continuity**—the material/textual chain linking past to present. Radiometric dating or textual criticism adjusts chronology *within* this continuum. Fomenko’s approach, by contrast, treats history as a *compressible signal* detached from testimonial provenance, violating the discipline’s foundational commitment to *evidence as mediated testimony*.  

  3. **Narrative as Explanatory Framework**:  
     Events are treated as **causally embedded particulars** within narrative structures. Statistical regularities (e.g., "duplicate dynasties") are dismissed not for mathematical invalidity, but because they ignore *agentive context*—e.g., why would later chroniclers "duplicate" events if not for discernible socio-cultural reasons?  

  4. **Probabilism vs. Hermeneutic Weighting**:  
     Mainstream historiography *does* use probabilistic reasoning (e.g., weighing conflicting accounts), but always **tethered to source criticism**:  
     - Probability applies to *witness reliability* (e.g., likelihood of bias in a chronicle), not to abstract pattern-matching.  
     - A 95% correlation between dynastic reigns is irrelevant if it contradicts *all* material evidence (e.g., coinage, stratified pottery).  

  ---

  ### Internal Consistency Check  
  The practice is **consistent within its epistemic framework** but **circular in its boundary-setting**:  
  - ✅ **Consistency**: Hermeneutic/material methods preserve *testimonial continuity*. When historians use statistics (e.g., demographic estimates), they remain subordinate to source evidence. Rejecting decontextualized correlations coheres with prioritizing *evidence-as-testimony*.  
  - ⚠️ **Circularity**: Disciplinary boundaries define "legitimate evidence" as *that which sustains narrative continuity*. Fomenko’s statistics are excluded *because* they ignore testimonial meaning—but testimonial meaning is validated *because* it maintains continuity. This risks insulating historiography from radical external critique.  

  ---

  ### Consequences of a Falsificationist/Probabilistic Turn  
  Adopting empirical predictive success as the sole demarcation criterion would trigger institutional upheaval:  

  | **Domain**         | **Current Practice**                                  | **Under Falsificationism**                              |  
  |--------------------|------------------------------------------------------|---------------------------------------------------------|  
  | **Peer Review**    | Rejects statistical revisionism as "non-history"     | Requires statisticians as core reviewers; mandates replication of correlation models |  
  | **Museum Labels**  | Chronologies fixed via consensus of material evidence | Multi-model labels (e.g., "Traditional: 1200 BCE; Fomenko: 800 BCE") with statistical confidence intervals |  
  | **Textbooks**      | Authorization by historiographical consensus         | "Prediction leaderboards" evaluating chronological models by predictive accuracy (e.g., eclipse retrodictions) |  
  | **Research Funding** | Prioritizes excavation/textual analysis             | Redirects funds to data-science initiatives (algorithmic pattern detection across global chronicles) |  

  ### Philosophical Implications  
  - **Social Construction?** Only partially. The rejection of Fomenko affirms that history treats the past as **real but inaccessible except through trace-mediated narratives**. Facts are *discovered* (not constructed) but only via hermeneutic engagement with sources.  
  - **Causally Embedded Events?** Yes—but with the caveat that causality is inferred *through narrative coherence*, not direct observation.  

  ### Conclusion  
  The implicit theory is **evidence-specific hermeneutic realism**: historical knowledge derives from interpreting testimonial traces within causal networks. Statistical revisionism is excluded not for mathematical flaws, but for severing chronology from testimony. While internally coherent, this risks epistemic conservatism. Shifting to falsificationism would democratize chronological authority but dissolve history’s distinct identity, merging it with data science. The tension reflects a deeper dilemma: is history a *humanistic discipline* interpreting traces of agency, or a *social science* detecting patterns in human behavior? Institutional practices uphold the former—but your critique exposes its contested boundaries.
