prompt: |-
  I'm presenting a 30-minute paper at an interdisciplinary workshop titled "Post-Work Futures." My thesis is that debates about automation and work are stuck between instrumental and dignity-based accounts, both of which miss work's primary social function: it renders individuals institutionally legible as contributors rather than mere claimants. I defend a recognitional-structural account: automation's deepest harm is not task displacement but "occluded contribution," where algorithmic interfaces hide human labor so thoroughly that the recognitional loop—effort, visibility, institutional acknowledgment—breaks even when work technically continues. I apply this to platform-mediated hidden labor but argue the mechanism generalizes beyond platforms.

  The audience is precisely composed of: four analytic philosophers (mostly consequentialist, one broadly Kantian, all deeply skeptical of "recognition" language as Hegelian mysticism and demanding conceptual precision); two labor economists who work within task-based automation models and will want empirical tractability; one critical data-studies scholar who researches hidden platform labor; and one senior policy advisor from a national labor ministry who is allergic to romanticizing wage labor and needs distributive implications. They will not be hostile, but they will probe for empirical emptiness, conceptual vagueness, and policy uselessness.

  Draft my Q&A prep sheet: the eight objections I will actually get, ordered by the sequence they will likely arise and by damage potential. For each objection, phrase it in the vocabulary of the specific constituency that will raise it—philosopher, economist, data-studies researcher, or policy advisor. State what I should concede immediately, what I must hold, and provide a concise reply suitable for a 90-second response, with an explicit note on where that reply is weakest. Identify the one question I am hoping nobody asks—likely involving the boundary conditions between occluded contribution and ordinary exploitation—and draft the reply I would have to give if pressed, clearly flagging the point where I am forced into speculative territory rather than argued ground.

  Do not ask for bibliographies, reading lists, or citations. Do not frame objections as generic anti-automation talking points; every objection should target the recognitional-structural claim about occluded contribution specifically.
