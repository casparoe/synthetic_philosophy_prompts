  Now, the audience is diverse: analytic philosophers, labor economists, a data-studies scholar, and a policy advisor. Each group has specific concerns. Philosophers will want conceptual precision, especially since they're skeptical of Hegelian "recognition." Economists need empirical tractability. The data-studies researcher focuses on hidden labor, and the policy advisor wants actionable policy without romanticizing work.

  The user needs a Q&A prep sheet with eight objections ordered by sequence and damage potential. Each objection should be phrased in the constituency's vocabulary. For each, they need concessions, what to hold, a concise reply, and the reply's weakness. Plus, the one dreaded question about boundary conditions.

  First, I should map out the most likely objections. The first question will probably come from the philosophers questioning the ontological status of recognition. They'll want to know how recognition differs from other benefits. The damage here is high because if the core concept is shaky, the whole argument crumbles. The reply should ground recognition in institutional legibility, conceding it's socially constructed but necessary for dignity. Weakness: it may not satisfy hardcore materialists.

  Next, economists will ask about empirical indicators. They care about measurable outcomes. The reply should mention proxies like worker visibility in metrics, but the weakness is relying on qualitative data. Then, the data-studies scholar might argue hidden labor isn't new. Concede historical precedents but hold that algorithmic opacity scales differently. Weakness: quantifying the qualitative difference.

