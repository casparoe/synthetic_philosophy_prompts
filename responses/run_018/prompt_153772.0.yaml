prompt: |-
  I'm working with a philosophy discussion group that has spent several months on Derek Parfit's hitchhiker case and the broader puzzle of whether rational agents ought sometimes to cultivate dispositions that lead them, at the moment of action, to behave in ways they then regard as against their best reasons. We want to formalize our disagreement into a joint adversarial-collaboration document between two camps: the "commitment-structure realists," who hold that the hitchhiker genuinely demonstrates the need for self-binding mechanisms and that rational evaluation must span temporal stages rather than isolated decision nodes; and the "evidential-resolutionists," who hold that once conditioning is performed correctly on the agent's entire decision procedure, the paradox dissolves and no genuinely irrational disposition is required.

  Please draft the document both sides could sign. Structure it in four parts. First, a numbered section of agreed claims: about the formal setup (the predictive device, the payoff structure, the absence of future interaction), about what the case is intended to show regarding rationality across time, and about shared rejections (for instance, that the driver is merely engaging in coercion, or that the agent's problem is simple ignorance). Second, a table of precise disagreements, with each camp's position phrased in wording its own proponents would accept and the other side would recognize as accurate; these should cover whether the correct evaluation point is pre-departure commitment or post-arrival choice, and whether "rational irrationality" names a real phenomenon or a misdescription of stable equilibrium behavior. Third, the cruxes—sub-questions such that resolving them would move at least one camp—including whether transparency of intentions undermines credible commitment, whether the case is structurally isomorphic to Newcomb's problem or introduces a distinct temporal asymmetry, and whether institutional analogues (such as constitutional rules or automated contracts that bind future action) illuminate the personal case or distract from it. For each crux, specify a concrete argument or modified thought-experiment both sides agree bears on it, and record each camp's advance prediction about what that case will show. Fourth, a brief note identifying any portion of the dispute that appears verbal rather than substantive, with an explanation of why.

  The document should not include bibliographies, reading lists, or requests for citation; it should be answerable by someone familiar with decision theory and the hitchhiker literature but without external access. Where possible, inject one slightly non-standard framing—treating the hitchhiker not only as a puzzle about individual rationality but also as a test case for whether collective commitment devices can solve structurally analogous problems—so that the collaboration moves beyond the most familiar formulations. Keep the tone neutral, precise, and formal, suitable for both parties to put their names to it.
reasoning: |-
  We are drafting a joint adversarial-collaboration document between two camps: commitment-structure realists and evidential-resolutionists. The document has four parts:

  1. Agreed Claims: A numbered list of points both sides agree on.
  2. Table of Disagreements: A table with two columns, one for each camp, stating their positions on key issues.
  3. Cruxes: A set of sub-questions (cruxes) that, if resolved, would move at least one camp. For each crux, we provide a concrete argument or modified thought-experiment and each camp's prediction.
  4. Verbal Dispute Note: A brief note on any part of the dispute that seems verbal.

  We are to inject a non-standard framing: treating the hitchhiker as a test case for collective commitment devices.

  Let's begin.

  ---

  **Joint Adversarial-Collaboration Document:  
  The Hitchhiker Case and the Rationality of Commitment**

  **Part 1: Agreed Claims**

  Both parties agree on the following:

  1. **Formal Setup**: The hitchhiker case involves an agent (the hitchhiker) and a counterparty (the driver). The driver can conditionally provide a benefit (a ride) to the agent, but only if the driver believes the agent will pay upon arrival. The agent, upon arrival, faces a choice: pay or not pay. The driver's belief about the agent's payment is formed via a predictive device (which may be the agent's past behavior, a reputation, or a direct mechanism) that accurately forecasts the agent's action. The payoff structure is such that:
     - If the driver gives the ride and the agent pays, both are better off than if no ride is given.
     - If the driver gives the ride and the agent does not pay, the driver is worse off than if no ride was given, and the agent is better off (having received the ride without paying).
     - The agent, at the time of payment, has no reason to pay (because the ride is already given and there are no future interactions).

  2. **Intended Lesson**: The case is intended to challenge the idea that rationality can be fully captured by evaluating each decision node in isolation. It raises the question of whether an agent, at an earlier stage, might rationally adopt a disposition (such as a commitment device) that leads to a choice at a later stage which, at that later stage, appears irrational.

  3. **Rejections**:
     - We reject the view that the driver's behavior is mere coercion; the driver's action is conditional on a prediction of the agent's behavior, not on a threat.
     - We reject the view that the agent's problem is simple ignorance; the agent, at the time of payment, knows all relevant facts and still faces a dilemma.
     - We reject the view that the case can be resolved by appealing to a different payoff structure (e.g., adding reputational effects) because the case is defined by the absence of future interactions.

  4. **Shared Framework**: Both parties accept that the agent's decision procedure can be modeled using standard decision theory (e.g., causal decision theory or evidential decision theory) and that the predictive device is reliable and known to be so.

  **Part 2: Table of Disagreements**

  | Commitment-Structure Realists (Realists) | Evidential-Resolutionists (Resolutionists) |
  |------------------------------------------|--------------------------------------------|
  | The correct evaluation point for rationality is at the pre-departure stage, where the agent must choose a disposition or commitment device. Rationality requires the agent to adopt a disposition that ensures payment, even though acting on that disposition at the post-arrival stage would, at that moment, be against the agent's best reasons. | The correct evaluation point is the post-arrival choice node. Rationality must be assessed at the moment of action. The agent should not pay at that moment because it is dominated by non-payment. The apparent need for a commitment device arises from a failure to condition on the entire decision procedure; once properly conditioned, the agent's decision to pay (if made) is rational because it is part of a stable equilibrium. |
  | "Rational irrationality" names a real phenomenon: it can be rational to cultivate an irrational disposition (one that leads to suboptimal choices at a given moment) because of the long-term benefits of having such a disposition. | The term "rational irrationality" is a misdescription. What appears as an irrational disposition is actually a rational strategy in equilibrium. The agent's decision to pay, when it occurs, is rational because it is supported by the evidence that the agent is the type who pays, which led to the ride being offered. |
  | The hitchhiker case demonstrates a genuine conflict between what is rational at different temporal stages and thus shows the need for a multi-stage conception of rationality. | The case does not show a conflict; it shows that agents who condition on their entire decision procedure (including their disposition) can achieve the optimal outcome without any stage being irrational. |

  **Part 3: Cruxes**

  The following sub-questions, if resolved, would move at least one camp. For each, we provide a shared thought-experiment or argument and each camp's prediction.

  1. **Transparency of Intentions**: Does making the agent's intentions transparent (so that the driver can condition on the agent's current mental state) undermine the possibility of credible commitment?  
     *Thought-Experiment*: Modify the hitchhiker case so that the driver has a perfect mind-reading device that reveals the agent's current intention (at pre-departure) about whether to pay. The agent knows this. The agent, at pre-departure, forms an intention. The driver then decides to give the ride only if the agent's current intention is to pay.  
     - *Realist Prediction*: The agent cannot form a credible intention to pay because, at the moment of intention formation, the agent knows that once the ride is given, they will not pay. Therefore, the agent cannot form a sincere intention to pay and the ride is not offered. This shows that without a commitment device (which goes beyond mere intention), the agent cannot achieve the mutually beneficial outcome.  
     - *Resolutionist Prediction*: The agent, by forming the intention to pay, conditions themselves to pay and thus the intention is sincere. The driver sees the intention and gives the ride. At the moment of payment, the agent pays because they are the type who forms such intentions and acts on them. The resolutionist argues that conditioning on the entire decision procedure (which includes forming intentions and acting on them) leads to the optimal outcome without irrationality.

  2. **Structural Analogy to Newcomb's Problem**: Is the hitchhiker case structurally isomorphic to Newcomb's problem, or does it introduce a distinct temporal asymmetry?  
     *Argument*: Compare the hitchhiker case to Newcomb's problem. In Newcomb's, the predictor uses the same predictive device as the hitchhiker driver, and the agent chooses between one-boxing (which yields a high reward) and two-boxing (which yields a lower reward). The hitchhiker case differs in that the driver's action (giving the ride) is taken *before* the agent's payment choice, whereas in Newcomb's the prediction is made before the choice but the rewards are given after.  
     - *Realist Position*: The cases are distinct because the hitchhiker case involves a temporal sequence where the agent's commitment at time T1 affects the driver's action at T2, and then the agent's action at T3. This temporal asymmetry makes the commitment problem more acute because the agent at T3 has no incentive to follow through. In Newcomb's, the agent chooses at a single time.  
     - *Resolutionist Position*: The cases are structurally identical. The resolutionist view (often one-boxing) in Newcomb's is analogous to the agent paying in the hitchhiker case. Both are cases where conditioning on the entire decision procedure (including the type of agent) leads to the rational action.

  3. **Institutional Analogues**: Do institutional analogues (like constitutional rules or automated contracts) illuminate the personal commitment case or distract from it?  
     *Thought-Experiment*: Consider a collective version: a group of hitchhikers who establish a rule that any member who does not pay will be punished by the group. The punishment is costly to the group, so it is only carried out if the group has a commitment to enforce. The driver can observe the group's rule and its enforcement mechanism.  
     - *Realist Prediction*: The institutional solution (with enforcement) works and demonstrates that commitment devices, even if they involve costs, can solve the problem. This shows that in the individual case, a personal commitment device (if available) would be rational.  
     - *Resolutionist Prediction*: The institutional case is distinct because it introduces a new causal structure (the threat of punishment). In the personal case, without such external enforcement, there is no analogous mechanism. Therefore, it does not illuminate the individual case but rather changes the game.

  **Part 4: Verbal Dispute Note**

  We note that part of the dispute may be verbal. Specifically, the term "rational" might be used in two different senses:  
  - The realists use "rational" to refer to the evaluation of the agent's overall strategy across time (which may include adopting a disposition that leads to a locally suboptimal action).  
  - The resolutionists use "rational" to refer to the evaluation of an action at a particular choice node (and the action is rational if it maximizes expected utility given the available information at that node).  

  Both sides agree that if this terminological difference were clarified, it might reduce the disagreement, but not eliminate it, because the substantive question of which evaluation point is primary remains.

  ---

  **Non-Standard Framing**:  
  Both parties agree that the hitchhiker case can be extended to collective commitment problems. For instance, a group of agents might establish a rule or institution (such as a contract enforced by an automated system) that binds future actions. We propose that the hitchhiker case is not only about individual rationality but also serves as a test case for whether collective commitment devices can solve structurally analogous problems. This extension may help in understanding the nature of commitment and whether it requires external scaffolding or can be achieved by individual reasoning alone.

  ---

  This document is signed by the representatives of both camps:

  [Signatures]

