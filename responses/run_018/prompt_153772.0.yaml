  **Joint Adversarial-Collaboration Document:  
  The Hitchhiker Case and the Rationality of Commitment**  

  ### **Part 1: Agreed Claims**  
  Both parties affirm the following:  
  1. **Formal Setup**:  
     - The driver possesses a reliable predictive device (e.g., a scanner or behavioral history) that forecasts the hitchhiker’s action (pay/not pay) with near-perfect accuracy.  
     - Payoff structure:  
       - If the ride is given and payment is made: hitchhiker gains net benefit (+X), driver gains net benefit (+Y).  
       - If the ride is given and payment is withheld: hitchhiker gains maximum benefit (+X + Z), driver incurs net loss (−Y).  
       - If no ride is given: both receive status-quo payoffs (0, 0).  
     - No future interactions occur; reputational effects are excluded by stipulation.  

  2. **Intent of the Case**:  
     - The scenario interrogates whether rationality must be evaluated solely at a single decision node ("synchronic" rationality) or whether it can require pre-commitment to a disposition that induces "irrational" actions at later nodes ("diachronic" rationality).  

  3. **Shared Rejections**:  
     - The driver’s refusal to transport a non-paying hitchhiker is not coercive but a rational response to predicted defection.  
     - The hitchhiker’s dilemma cannot be resolved by claiming ignorance; both stages involve full knowledge of payoffs and predictive reliability.  
     - The case is not reducible to a simple prisoner’s dilemma or Newcomb’s problem without further argument.  

  4. **Decision-Theoretic Groundwork**:  
     - Causal decision theory (CDT) and evidential decision theory (EDT) are permissible frameworks; neither is presupposed.  
     - The predictive device operates via correlation, not backward causation.  

  ---

  ### **Part 2: Table of Disagreements**  
  | Commitment-Structure Realists (Realists) | Evidential-Resolutionists (Resolutionists) |  
  |------------------------------------------|--------------------------------------------|  
  | Rationality must be assessed from the **pre-departure perspective**, where the hitchhiker chooses a disposition. A rational agent will adopt a disposition to pay, even though acting on it post-arrival is *locally* suboptimal. | Rationality is defined at the **post-arrival choice node**. The hitchhiker must not pay, as doing so is causally dominated and conflicts with utility maximization given fixed circumstances. |  
  | **"Rational irrationality" is a real phenomenon**: It is instrumentally rational to cultivate a disposition that forces locally irrational actions when doing so secures superior long-term outcomes. | **"Rational irrationality" is incoherent**: Apparent "irrationality" dissolves when conditioning on the entire decision procedure. The paying hitchhiker acts rationally *because* their disposition constitutes a stable equilibrium. |  
  | The hitchhiker case reveals a **temporal conflict in rationality** that necessitates self-binding mechanisms (e.g., sincere pre-commitment). | The case is **resolvable within standard decision theory** by treating the agent’s disposition as evidence; no diachronic compromise is required. |  

  ---

  ### **Part 3: Cruxes**  
  Sub-questions whose resolution would shift at least one camp’s position, with agreed-upon tests/predictions:  

  1. **Does transparent access to intentions undermine credible commitment?**  
     - *Test*: Modify the case: The driver’s predictive device reads the hitchhiker’s *real-time intentions* (not actions). The hitchhiker knows this and may try to form a sincere intention to pay pre-departure.  
     - *Realist Prediction*: The hitchhiker cannot form a credible intention without self-deception or external commitment, as transparency reveals the intention’s instability.  
     - *Resolutionist Prediction*: The hitchhiker forms a rational intention to pay (knowing it leads to the ride), and post-arrival payment remains rational due to updated evidence.  

  2. **Is the hitchhiker case structurally distinct from Newcomb’s problem?**  
     - *Test*: Compare to a Newcomb variant where the predictor simulates the agent’s *entire decision procedure*, including responses to predictions.  
     - *Realist Prediction*: Newcomb’s lacks temporal asymmetry; the hitchhiker’s post-arrival choice occurs *after* the driver’s action, creating a unique incentive to renege.  
     - *Resolutionist Prediction*: Both cases reduce to evidential conditioning; paying/one-boxing is rational in both when the agent accounts for their causal type.  

  3. **Do institutional commitment devices (e.g., smart contracts) illuminate or distract?**  
     - *Test*: Analyze a collective analogue: A group of hitchhikers creates an automated contract that penalizes non-payment via escrow. The driver observes the contract’s binding power.  
     - *Realist Prediction*: The device succeeds, proving that commitment structures (even externalized) resolve the temporal conflict.  
     - *Resolutionist Prediction*: The device changes the payoff structure, making payment rational post-arrival; it thus fails to model the *personal* dilemma.  

  ---

  ### **Part 4: Verbal Dispute Note**  
  A portion of the disagreement appears verbal:  
  - **Term**: "Rationality"  
    - *Realists* use it to denote *global* optimization across temporal stages (requiring trade-offs between stages).  
    - *Resolutionists* use it to denote *local* optimization at choice nodes (rejecting trade-offs that violate dominance).  
  - **Why it may be substantive**: The terminological split reflects a deeper disagreement about the *temporal scope* of rational evaluation. Clarifying definitions would not fully resolve the dispute but could isolate whether the camps disagree on (a) the possibility of diachronic rationality or (b) the necessity of synchronic consistency.  

  ---  
  **Non-Standard Framing**:  
  Both parties agree to explore whether collective commitment devices (e.g., binding contracts or social norms) resolve structurally analogous multi-agent versions of the hitchhiker problem. This tests if the puzzle’s core challenge—enforcing cooperation across time—demands external scaffolding or can be solved by individual reasoning alone.  

