prompt: |-
  hey im trying to figure out where moral uncertainty research is actually stuck, past the usual survey stuff. if you had to rank the open problems by how upstream they are for anyone building decision procedures — not just philosphizing — which three deserve the most attention? im torn between whether intertheoretic value comparison is the real bottleneck, or if its more about updating credances when your moral theories are structurally incommensurable, or whether the framing should just shift from moral to normative uncertainty altogether. defend the ordering: which ones block the others, what progress in the next few years would flip your ranking, and is the debate about abandoning credance-weighted frameworks altogether a productive research line or just a distraction eating grad student time? i have maybe six months of serious reading and want to know where to put my energy so it actually moves something.
reasoning: |-
  Okay, let me unpack this user's query. They're diving into moral uncertainty research, specifically looking for the most upstream bottlenecks beyond surveys. They mentioned intertheoretic value comparison, updating credences with incommensurable theories, and shifting to normative uncertainty. Their main goal is to prioritize where to focus six months of research for maximum impact on decision procedures.

  First, I need to rank these problems by how much they block progress. Intertheoretic comparison seems fundamental. Without a way to compare different moral values across theories, any decision procedure can't even start. For example, if one theory values happiness and another values autonomy, how do you weigh them? Current methods like Borda counts are arbitrary. If this isn't solved, other areas can't move forward. So this has to be number one.

  Next, updating credences when theories are incommensurable. Even if you have initial credences, learning new evidence might not update them properly if theories are too different. But this depends on having a way to compare values in the first place. Without solving the first problem, updating credences is stuck. So this should be second. Progress here could involve formalizing how evidence affects credences across frameworks, but it's contingent on the first issue.

  Shifting to normative uncertainty is third. While it expands the scope beyond moral theories to epistemic or prudential ones, it doesn't resolve the core comparison problem. It might reframe the issue but doesn't solve the existing bottlenecks. However, if progress happens in the first two areas, this could become more relevant.

  The user also asks about abandoning credence-weighted frameworks. I think this is a distraction right now. Without better alternatives, discarding the current framework doesn't help. Research here might be premature until the foundational issues are addressed.

  The user's deeper need seems to be effective resource allocation. They want their six months to contribute to tangible progress. Prioritizing intertheoretic comparison makes sense because breakthroughs here would unblock other areas. They might be frustrated with theoretical debates that don't lead to practical decision procedures. Focusing on formal models or computational approaches could yield more actionable results.

  I should also consider what progress in the next few years would change the ranking. If intertheoretic comparison sees advances, then updating credences becomes the next big hurdle. If not, the field remains stuck. The user's time is limited, so directing them to the most upstream problem ensures their work has a ripple effect.
answer: |-
  Based on your focus on **building decision procedures** and moving beyond surveys/philosophizing, here's my ranking of the most upstream bottlenecks, along with defense and implications for your time:

  1.  **Intertheoretic Value Comparison (IVC)**
  2.  **Updating Credences Under Structural Incommensurability**
  3.  **Shifting to Normative Uncertainty (Epistemic/Prudential)**

  **Defending the Ranking & Why IVC is the Fundamental Bottleneck:**

  *   **IVC Blocks Everything Else:** You fundamentally *cannot* build a meaningful decision procedure under moral uncertainty without a method to compare the "units of value" (or disvalue) across fundamentally different theories. How do you weigh a utilon (U), a right-infringement (R), an autonomy-violation (A), or a virtue-deficit (V) against each other? Without this, aggregating value estimates across theories (even with perfect credences) is impossible. Any current method (e.g., variance normalization, Borda counts) is deeply unsatisfying and often arbitrary. **No IVC solution = No robust aggregation = Decision procedures remain purely theoretical or rely on arbitrary normalization.**
  *   **IVC Blocks Updating:** How do you update your credence in theory A vs. theory B based on an observation when the theories interpret the *meaning and moral significance* of that observation through entirely different, incomparable lenses? Evidence often isn't theory-neutral. If you can't compare the value implications of the evidence *across* theories, Bayesian updating (or any coherent updating) becomes extremely problematic. Progress on IVC would provide the common "currency" needed to make evidence assessment more commensurable across theories, enabling better updating.
  *   **IVC is Prerequisite to Broader Normative Uncertainty:** Normative uncertainty (including epistemic norms, prudential norms, etc.) inherits the *exact same* IVC problem, just with an even wider range of incommensurable "goods" (truth, coherence, expected personal wealth, health, etc.). Solving moral IVC is a necessary (though not sufficient) step towards solving general normative IVC. Expanding the scope *without* solving IVC just makes the problem harder, not more tractable.

  **Updating Credences Under Incommensurability: Why #2**

  *   **Depends on IVC:** As argued above, updating credences effectively is severely hampered without progress on IVC. Evidence evaluation is theory-laden.
  *   **Its Own Unique Challenges:** Even *with* a partial IVC solution, significant challenges remain:
      *   **Structural Mismatch:** Theories might partition the possibility space differently, use radically different primitives, or define "evidence" inconsistently. How do you update a credence distribution defined over one set of propositions based on evidence defined in terms of another?
      *   **Value-Laden Evidence:** Moral theories often disagree on what *counts* as evidence *for* them. Does observing widespread suffering decrease credence in a virtue ethics focused on flourishing individuals, or increase credence in a consequentialism demanding its alleviation?
      *   **"Moral Evidence" is Messy:** Unlike empirical evidence, "moral evidence" (e.g., intuitions, thought experiments, sociological data) is often contested, vague, and theory-dependent. Formalizing its impact is hard.
  *   **Why it Blocks Progress:** Without reliable updating, initial credences become arbitrary anchors. Decision procedures can't learn effectively from experience or new arguments, making them static and potentially brittle. **Progress here is crucial for *adaptive* decision procedures.**

  **Shifting to Normative Uncertainty: Why #3 (For Now)**

  *   **Broadening Scope Doesn't Solve Core Problems:** While ultimately crucial for comprehensive decision-making (agents are uncertain about *all* norms, not just moral ones), this shift doesn't magically resolve IVC or the updating problem. It simply replicates them on a larger scale. Focusing *first* on the tractable (though still hard) subset of *moral* uncertainty makes sense.
  *   **Potential for Insights:** Work on normative uncertainty *might* offer new formal tools or perspectives (e.g., integrating risk aversion over norm selection, dealing with epistemic norms governing credence assignment itself). However, the core aggregation/updating bottlenecks remain moral IVC problems at heart.
  *   **Why it's Still Important:** For truly general decision procedures (e.g., in AI alignment), this broader scope is essential. Ignoring uncertainty about epistemic or instrumental rationality is a major gap. **It's downstream because tackling it effectively requires tools developed for the moral case.**

  **On Abandoning Credence-Weighted Frameworks:**

  *   **Largely a Distraction (For Your Goals):** While valid critiques exist (e.g., sensitivity to framing, arbitrariness of aggregations without IVC, non-probabilistic representations of belief), **discarding the credence-weighted *framework* entirely is premature**.
      *   **No Viable Alternative:** Proposals (e.g., satisficing, maximin, multi-objective optimization without aggregation) either collapse into single-theory dominance under uncertainty or fail to provide general, actionable guidance. They often punt on the core aggregation problem IVC needs to solve.
      *   **Credences are Pragmatic:** Representing degrees of belief probabilistically is deeply embedded in decision theory and has proven remarkably robust. Starting from here leverages existing formal machinery.
      *   **Focus Effort Where it Counts:** Critiques are valuable for highlighting weaknesses (especially the arbitrariness *without IVC*), but research energy is better spent *solving the problems within the framework* (IVC, Updating) or developing *complementary* approaches (e.g., sensitivity analysis, robustness checks across frameworks) rather than trying to rebuild decision theory from scratch without a clear blueprint. This debate often becomes purely philosophical without yielding concrete decision procedures.

  **What Progress Would Flip the Ranking?**

  1.  **A Breakthrough in IVC (e.g., Axiomatic Justification, Grounding in Meta-Ethics/Facts, Robust Computational Method):** If IVC became *less* of a showstopper (even if not fully solved), **Updating Credences** would immediately become the primary bottleneck for building *adaptive* procedures. Normative uncertainty might also rise in priority.
  2.  **A Compelling Non-Credence Framework with Tractability:** If someone proposed and formalized a genuinely viable alternative to credence-weighting that demonstrably handled aggregation/updating better *in practice*, research into that framework could leapfrog others. This seems unlikely soon.
  3.  **Concrete Success in Narrow Domains:** If robust decision procedures using specific IVC methods (even if controversial) proved highly successful in constrained practical domains (e.g., specific AI safety problems, policy design under deep disagreement), it could shift focus towards **scaling these methods to normative uncertainty** or refining **updating** within those domains.

  **Recommendation for Your 6 Months: Target IVC**

  *   **Why:** It's the most upstream, foundational bottleneck. Progress here (even partial, clarifying why it's *so* hard, or proposing novel but limited methods) would unblock research on aggregation, make updating more tractable, and provide a foundation for normative uncertainty. It directly addresses the core arbitrariness plaguing current decision procedures.
  *   **Focus Areas for IVC Research (Practical Levers):**
      *   **Axiomatic Approaches:** Deep dive into what minimal, plausible axioms *could* constrain IVC (e.g., Pareto principles, risk invariance across theories). Look for *impossibility results* and their assumptions – they define the boundaries.
      *   **Formal Metaphysics/Meta-Ethics:** Explore if any meta-ethical commitments (naturalism, non-naturalism, constructivism) offer *grounds* for comparison, even if partial (e.g., comparing suffering magnitudes across theories that recognize suffering).
      *   **Computational/Approximation Methods:** Investigate if practical heuristics (e.g., based on overlap in prescriptions under empirical uncertainty, revealed preferences in borderline cases, minimizing maximum regret *across* aggregation methods) can yield robust-enough comparisons for specific contexts.
      *   **Domain-Specific IVC:** Can IVC be "solved" for narrower classes of theories (e.g., all welfarist consequentialisms) or specific decision contexts (e.g., resource allocation with measurable outcomes)? Build from there.
  *   **Simultaneous Awareness:** Keep the **updating challenge** firmly in mind, especially how any IVC proposal interacts with it. Read critiques of credence-weighting to understand the pitfalls, but don't make abandoning it your primary focus unless a truly compelling alternative emerges during your reading.

  **In short: Pour your energy into cracking the IVC nut. It's the master lock. Understand its depths, explore potential picks (axioms, meta-ethics, computation), and test them in constrained environments. Progress here would be the highest-leverage move for enabling practical decision procedures under deep moral uncertainty.** Good luck!
