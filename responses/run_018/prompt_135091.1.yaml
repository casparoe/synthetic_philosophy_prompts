answer: |-
  ## Joint Statement on Sovereignty, Democratic Legitimacy and the Future of the European Union

  **Preamble:**  
  We, an intergovernmentalist and an advocate of ever-closer union, have engaged in rigorous, good-faith dialogue on the contested issues of sovereignty, the perceived democratic deficit, and the objective of "ever-closer union" within the European Union. While fundamental differences remain, we have identified significant areas of factual agreement and clarified the precise points of divergence. To aid analysis, we employ the novel distinction of **"recursive delegation"** (where authority, though pooled, retains mechanisms for dynamic return to national parliaments, akin to a feedback loop enabling real-time oversight or veto) and **"linear delegation"** (where authority is transferred upwards to the EU level without such inherent, dynamic pathways for national parliamentary recall or direct intervention in specific legislative acts). This distinction serves purely as an analytical framework for this collaborative exercise.

  **(1) Agreed Claims:**

  1.  **Formal Allocation:** Legislative authority in the EU is shared between the Council (representing Member State governments) and the European Parliament (EP), elected by EU citizens. Executive authority is primarily vested in the European Commission, which holds the exclusive right of legislative initiative in most policy areas. The European Council sets the EU's overall political direction.
  2.  **Sources of Distance:** Specific institutional mechanisms create distance between voters and EU decision-makers:
      *   The Council operates largely through qualified majority voting (QMV) on many issues, meaning national governments can be bound by decisions they opposed, diluting direct national parliamentary control over specific outcomes.
      *   The Commission's exclusive right of legislative initiative means the agenda is set by an unelected body (though appointed by elected governments and approved by the EP), rather than stemming directly from national parliaments or the EP itself.
      *   Council deliberations often occur behind closed doors, limiting public scrutiny of national governments' positions on EU legislation.
  3.  **European Parliament Powers:** The EP possesses significant powers, notably:
      *   **Co-decision (Ordinary Legislative Procedure):** The EP shares co-equal legislative power with the Council in most policy areas, meaning legislation cannot pass without its approval.
      *   **Budgetary Powers:** The EP shares authority with the Council over the EU budget, including final approval.
      *   **Supervisory Powers:** The EP exercises oversight over the Commission, including the power to approve and dismiss the Commission.
  4.  **"Ever-Closer Union":** The phrase "ever-closer union among the peoples of Europe" holds legal status as a foundational objective within the Preamble and Article 1 of the Treaty on European Union (TEU). Its practical interpretation and implications remain contested.
  5.  **Sovereignty Pooling:** Member States have pooled elements of their national sovereignty by conferring competences upon the EU institutions, as defined in the Treaties. The practical dynamics of this pooling can be analysed through the lens of recursive and linear delegation patterns depending on the specific competence and decision-making procedure involved (e.g., unanimity requirements offer stronger recursive potential than QMV).

  **(2) Disagreements Table:**

  | Issue                                                                 | Intergovernmentalist Formulation                                                                                                  | Supranationalist Formulation                                                                                                                  | Crux Reference     |
  | :-------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------- | :----------------- |
  | **Requirement for a Unified Demos**                                   | Sustainable democratic legitimacy for binding majority decisions requires a pre-existing, cohesive political community (demos) based on shared identity, language, and solidarity, which remains absent at the European level. National democracies provide this necessary foundation. | Democratic legitimacy can be generated and deepened *through* the process of pooling sovereignty and creating transnational political structures, fostering a new layer of European citizenship and solidarity. | N/A (Foundational) |
  | **Practical Reversibility of Sovereignty Pooling**                    | Significant repatriation of competences, particularly concerning the foundational rules of the internal market, is practically feasible without dismantling the Single Market, provided clear, mutually agreed and enforceable frameworks for equivalence and cooperation are established. | Pooled sovereignty in core areas like the internal market creates deeply integrated legal and economic structures; attempting large-scale repatriation would be functionally disruptive and politically unviable, effectively requiring dismantlement. | N/A                |
  | **Impact of Parliamentary Co-Decision**                               | The EP's co-decision power, while procedurally significant, masks rather than eliminates the democratic deficit. It cannot compensate for the fundamental lack of a European demos and the inherent distancing effects of the Commission's agenda-setting and the Council's intergovernmental opacity. | The empowerment of the directly elected EP through co-decision fundamentally transforms the EU's democratic character, establishing a genuine bicameral legislature and providing a direct channel for European citizen representation, substantially mitigating the deficit. | Crux III(b)        |

  **(3) Cruxes:**

  **(a) Separability of Authorisation and Performance Legitimacy**  
  *   **Shared Framing:** We agree that assessing the democratic legitimacy of pooled sovereignty requires examining both 'Authorisation Legitimacy' (derived from the electoral mandate and chain of accountability linking voters to decision-makers) and 'Performance Legitimacy' (derived from the effectiveness of institutions in solving collective problems and delivering outcomes citizens value). The crux is whether these are fundamentally separable concepts when evaluating EU decision-making or whether Authorisation Legitimacy is a necessary precondition for Performance Legitimacy to count as *democratic*.
  *   **Intergovernmentalist Prediction:** Authorisation Legitimacy, grounded in identifiable national demoi and parliamentary control, is the *sine qua non* of democratic legitimacy. Performance Legitimacy absent robust Authorisation Legitimacy constitutes efficient technocracy, not democracy. Pooled sovereignty inherently weakens Authorisation Legitimacy. Therefore, they are inseparable in establishing democratic legitimacy; the former validates the latter.
  *   **Supranationalist Prediction:** Authorisation and Performance Legitimacy, while linked, are conceptually distinct and can operate in parallel. Effective problem-solving (Performance) at the European level *generates* support and trust, which enhances the perceived legitimacy of the authorising structures (even if novel, like the EP). In complex transnational governance, Performance Legitimacy can partially compensate for or evolve alongside developing forms of Authorisation Legitimacy. A pure focus on traditional national authorisation chains ignores the functional necessity and emergent democratic potential of the EU level.

  **(b) Democratic Accountability of a Hypothetical European Fiscal Capacity**  
  *   **Shared Framing:** We agree to analyse the potential democratic implications of a hypothetical "European Fiscal Capacity" (EFC) with the following characteristics: funded by direct EU taxation (e.g., a small basket of own resources), spending authorised by qualified majority vote (QMV) in the Council, and subject to amendment and oversight by the European Parliament (EP) under the ordinary legislative procedure.
  *   **Intergovernmentalist Prediction:** Such an EFC would significantly *decrease* democratic accountability. Authorising significant taxation and spending via QMV in the Council removes the direct, real-time veto power ('recursive delegation') of national parliaments over core fiscal decisions. While the EP has powers, it lacks the deep connection to a cohesive demos necessary to legitimise majoritarian decisions on taxation and spending. This represents a decisive shift towards irreversible 'linear delegation' with weakened authorisation chains.
  *   **Supranationalist Prediction:** Such an EFC would substantially *increase* democratic accountability for EU-level fiscal actions. It would create a direct link between EU spending priorities, EU-level taxation, and the elected EP, enhancing transparency and enabling clearer political choice for European citizens. The QMV Council component maintains national government input, while the EP provides direct parliamentary authorisation and oversight at the level where the fiscal decisions take effect, strengthening the authorisation chain for pooled fiscal sovereignty.
