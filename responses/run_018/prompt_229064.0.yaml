answer: |-
  Evelyn: You say ranking suffering is obscene, Malcolm, but silence isn't neutral. Choosing *not* to formally compare atrocities in our memorials or courts doesn't mean we avoid hierarchy – it just outsources it to unexamined bias, gut feeling, or sheer geopolitical clout. Isn't refusing to articulate criteria worse?

  Malcolm: That’s a false choice, Ev. The obscenity isn’t in *acknowledging* different horrors exist; it’s in pretending they’re reducible to a single scale, like comparing a symphony to a scream. We distinguish murder from genocide legally precisely *because* they’re different categories of wrong – quantifying their ‘evil units’ would be the category error.

  Evelyn: But legal distinctions *are* comparisons! We judge genocide worse than mass murder based on intent and scale. The charge of ‘obscenity’ proves too much – if comparing *any* suffering is verboten, how do we justify allocating finite resources? Or deciding which historical wounds need active redress versus passive remembrance?

  Malcolm: Resources or trials require prioritisation, yes, but that’s pragmatic triage based on *feasibility* or *ongoing harm*, not some abstract ranking of ‘which was objectively worse’. Turning it into a moral calculus – debating whether industrialised extermination ‘beats’ engineered famine – degrades the unique, monstrous specificity of each. It’s taking the piss.

  Evelyn: Isn’t the *real* obscenity *who* gets to do the comparing and for *whom*? When academics or courts, with testimony and evidence, distinguish systematic intent from tragic chaos, it’s analysis. When blokes down the pub rattle off atrocity league tables, it’s voyeurism. The problem isn’t comparison *per se*, it’s power and context.
