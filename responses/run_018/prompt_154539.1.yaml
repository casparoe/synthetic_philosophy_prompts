  Interesting wrinkle: the Platonism objection. If mathematical structures (including spacetime metrics) exist timelessly, does describing physical time as "unreal" create inconsistency? Here I think the first philosopher's distinction holds - Platonism concerns abstract entities, not their physical manifestations. Gödel can consistently say "this metric exists mathematically" while denying "its temporal features reflect fundamental reality."

