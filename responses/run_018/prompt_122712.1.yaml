prompt: |-
  Hi — I run a tiny podcast for policy grad students, and my guest next week is a philosopher who's just finished a paper defending what she calls "steep prioritarianism". The short version: instead of plugging everyone's welfare into one concave function and adding it up, she multiplies each person's benefit by a priority weight that falls off really fast as their lifetime welfare rises — fast enough that the weighted sum sometimes ranks an outcome where every single person is worse off above one where every single person is better off (her stock example: two people at 10 and 100 versus both at 5). She thinks that's the right answer, not a reductio.

  I dont want the episode to be her restating the view for forty minutes. Can you draft eight to ten questions, each with a follow-up keyed to the answer she's most likely to give? I'd like at least one on:

  (a) whether the steepness is even coherent — as I understand it, once the weights fall faster than one-over-welfare the weighted sum stops being increasing in anyone's welfare, so I want a question that forces her to say whether she's genuinely given up monotonicity or is quietly helping herself to the concave-function formulation;
  (b) the sequential version I keep getting stuck on: if levelling down improves the weighted sum at each step, does she accept a kind of ratchet where a long series of individually sanctioned levellings drives everyone toward the floor, and if not, what exactly breaks the chain;
  (c) whether she should just bolt on a Pareto side-constraint and let priority operate only among Pareto-optimal options, and whether that makes the steepness idle;
  (d) whether a view that permits levelling down is still distinguishable from plain telic egalitarianism — what the weighting buys her over just saying inequality is intrinsically bad;
  (e) the zero-point worry: if the weights are a function of absolute welfare, does shifting the zero of the welfare scale (neutral level versus a life not worth living) flip her verdicts;
  (f) how you'd ever calibrate how steep is steep enough.

  Assume she'll deflect with things like "Pareto is only a heuristic" and "levelling down is only counterintuitive if you've got person-affecting intuitions you havent earned", and build the follow-ups around that. End with one question about what kind of argument or evidence could actually change her mind.
reasoning: |-
  Okay, the user runs a small policy podcast and is preparing for an interview with a philosopher who defends "steep prioritarianism." The user wants a set of probing questions with follow-ups to make the episode engaging. Let me start by understanding the core of the guest's argument. She proposes multiplying each person's welfare by a weight that decreases rapidly as their lifetime welfare increases. This leads to situations where leveling down—making everyone worse off—could be preferred, like her example of two people at (10, 100) being worse than both at (5,5). 

  The user has specific areas to cover: coherence, sequential leveling, Pareto constraints, differentiation from egalitarianism, zero-point calibration, and calibration of steepness. They also want a final question about what could change her mind. The user anticipates deflections like dismissing Pareto as heuristic or person-affecting intuitions. 

  First, I need to ensure each question targets one of these areas. For coherence (a), the key is whether her view abandons monotonicity. If she claims she hasn't, the follow-up should challenge how that's possible with such steep weights. If she accepts it, push on why that's acceptable. 

  For the sequential problem (b), the question should lead her through the step-by-step leveling. If she denies the ratchet, the follow-up needs to pinpoint where the chain breaks. Maybe she introduces a threshold, but that could undermine her steepness. 

  On Pareto constraints (c), asking why not add it as a side-constraint. If she argues it's redundant or ad hoc, follow up by questioning if steep prioritarianism becomes idle under Pareto. 

  Differentiating from telic egalitarianism (d) is crucial. If she says her view isn't about equality, the follow-up should challenge why the weights are structured to value equality indirectly. 

  Zero-point calibration (e) addresses how shifting welfare's zero affects judgments. If she denies sensitivity, press her on how the zero is defined objectively. 

  Calibration (f) questions how steepness is measured. If she avoids quantification, ask how to prevent arbitrary steepness. 

  Finally, the last question about changing her mind should probe the flexibility of her position. 

  I should ensure each follow-up anticipates her likely defenses. For example, when she dismisses Pareto, the follow-up can counter that intuitions against leveling down are widely shared. For person-affecting intuitions, push back by asking if her view implies impartiality overrides individual losses. 

  Also, structuring questions to avoid restating her view. Each question should challenge a specific implication. Making the follow-ups concise but pointed to keep the conversation moving. Checking that all user-specified points are covered and that the questions force her to clarify rather than deflect.
answer: |-
  Here are 10 core questions with anticipated deflections and sharp follow-ups, targeting the key issues you raised:

  1.  **Core Question:**
      "Your core argument rejects the standard concave transformation for a sharply decreasing priority weight *multiplied* by welfare. But mathematically, once the weight falls faster than 1/w (like 1/w²), the *weighted sum itself* becomes non-monotonic: increasing *any* individual's welfare can *decrease* the total. Have you explicitly abandoned monotonicity as a requirement for a social ordering principle?"
      *   *(Anticipated Deflection: Focus on the moral irrelevance of isolated increases for the very well-off compared to the needs of the worst-off, or claim the concave function approach smuggles in unwarranted assumptions.)*
      **Follow-Up:**
      "If you *have* abandoned monotonicity, how do you reconcile this with the foundational idea that social goodness should respond positively, at least weakly, to *someone* being made better off and no one worse off? Doesn't this make the 'goodness' metric fundamentally unresponsive to individual benefit in a way that seems pathological?"

  2.  **Core Question:**
      "Let's walk through a sequential leveling-down scenario. Start with A at 100, B at 100. Your view might prefer A at 10, B at 100 (if B's weight is low enough). Then, from A:10, B:100, it might prefer A:10, B:10. We've gone from (100,100) to (10,10) via two steps each sanctioned by your principle. Doesn't this create a 'levelling ratchet' where *any* unequal society can be driven towards universal destitution by a series of locally 'improving' moves?"
      *   *(Anticipated Deflection: Argue real-world choices aren't sequential in this destructive way, or that other constraints would intervene, or dismiss the 'destitution' endpoint as unrealistic.)*
      **Follow-Up:**
      "But if the principle *itself* endorses each individual step in the sequence as an improvement, doesn't the principle *demand* this ratchet wherever initial inequality exists? If you say other factors *stop* it, doesn't that mean steep prioritarianism alone is insufficient and potentially dangerous without external brakes you haven't incorporated?"

  3.  **Core Question:**
      "Many prioritarian views accept a weak Pareto principle as a side-constraint: if *everyone* is better off in X than Y, then X is better than Y. This would block the leveling-down verdicts in your stock examples. Why *shouldn't* steep prioritarianism adopt this constraint to avoid the counterintuitive results?"
      *   *(Anticipated Deflection: "Pareto is just a heuristic," "begs the question against the intrinsic badness of inequality," "reflects unjustified person-affecting bias," or "only applies to 'better off' defined independently of the distributive principle, which steep prioritarianism rejects.")*
      **Follow-Up:**
      "If you reject Pareto even in these clear cases, doesn't that fundamentally divorce your conception of 'social betterment' from *any* individual's actual well-being state? And if you *did* adopt Pareto as a constraint, wouldn't it render the 'steepness' of your weights largely idle in precisely the high-stakes distributive conflicts where you want it to bite hardest – since Pareto would force you to choose the higher-total option anyway whenever leveling down is the only alternative?"

  4.  **Core Question:**
      "How does steep prioritarianism meaningfully differ from telic egalitarianism, which also says inequality is intrinsically bad? Isn't the rapidly decaying weight just a mathematical trick to *make* the sum sensitive to equality in a way that mimics an egalitarian value? What distinct work is 'priority' doing here?"
      *   *(Anticipated Deflection: Emphasize the focus on absolute position of the worst-off rather than relative gaps, claim prioritarianism is fundamentally about the moral weight of claims based on absolute welfare levels.)*
      **Follow-Up:**
      "But in your own examples, the outcome where the worst-off are *absolutely worse* (5 vs 10) is deemed *better* because of the *reduction in inequality*. Doesn't this show that, operationally, the steep weights are *functionally equivalent* to assigning intrinsic disvalue to inequality itself? If the priority for the worse-off is so extreme that it overrides making *everyone* (including the worse-off) absolutely better off, isn't the motivation really egalitarian?"

  5.  **Core Question:**
      "The priority weights are a function of an individual's *absolute* lifetime welfare level. But the location of the 'zero' point – the boundary between a life worth living and not – is notoriously controversial. Could shifting how we calibrate this zero-point dramatically flip your rankings? For instance, if we set 'neutral' at 0, is (10, 100) vs (5, 5) judged differently than if neutral is set at -50?"
      *   *(Anticipated Deflection: Claim there is an objective welfare zero, or that the *relative* weights matter more than absolute calibration within lives worth living.)*
      **Follow-Up:**
      "If the zero-point *is* contestable, doesn't that make your theory's verdicts radically unstable? If shifting the zero can turn a leveling-down scenario from 'required' to 'forbidden' (or vice-versa) based on a metaphysical choice about the neutral level, doesn't that undermine its claim to offer objective moral guidance? How do you objectively anchor the zero?"

  6.  **Core Question:**
      "How do we determine *how* steep the priority weighting should be? What empirical facts, moral arguments, or reflective equilibrium considerations tell us the decay rate isn't 1/w, or 1/w³, or 1/w¹⁰⁰? What's the calibration mechanism?"
      *   *(Anticipated Deflection: Appeal to strong intuitions about extreme inequality, argue precise calibration isn't needed to see that standard concave functions aren't steep enough, or deflect to the qualitative shape.)*
      **Follow-Up:**
      "But the *steepness threshold* is crucial! It's the difference between a view that sometimes permits leveling down only in extreme edge cases versus one that demands it in relatively common scenarios like your (10,100) vs (5,5) example. Without a principled way to set the steepness, isn't the view vulnerable to the charge that the leveling-down implications are essentially arbitrary – just however steep *you* intuitively feel it should be?"

  7.  **Core Question (Person-Affecting Intuitions):**
      "You anticipate the objection that leveling down is problematic because it harms people without benefiting anyone. You suggest this relies on unearned 'person-affecting' intuitions. Can you explain why we *shouldn't* give fundamental weight to the intuition that making someone worse off for no compensating gain to anyone is a bad thing?"
      *   *(Anticipated Deflection: Argue person-affecting views have their own problems (non-identity, future generations), claim impartiality requires focusing on the pattern/value states themselves, not comparative harms to individuals.)*
      **Follow-Up:**
      "Doesn't rejecting the core person-affecting intuition – that harming individuals without benefit is bad – lead to even more counterintuitive results? For instance, could steep prioritarianism endorse policies that actively *harm* some well-off individuals (making them worse off than they would be) *even if no one else benefits at all*, simply because it improves the *pattern* (reducing inequality)? If so, how is this different from seeing people as mere sites for instantiating an abstract pattern value?"

  8.  **Core Question (The Role of Intuition):**
      "Your stock example (10,100 vs 5,5) is presented as an intuition pump favoring steep prioritarianism. But for many, the intuition strongly goes the *other* way: (5,5) seems *worse* because *everyone is worse off*. How do you adjudicate between these competing intuitions? Why should we trust the intuition favoring leveling down here?"
      *   *(Anticipated Deflection: Argue the anti-leveling intuition is corrupted by focusing on aggregates or by status quo bias, claim the leveling-down intuition reveals a deeper commitment to equality/priority.)*
      **Follow-Up:**
      "If we're relying on contested intuitions about cases, what makes your leveling-down intuition more reliable or foundational than the Pareto intuition? Isn't the Pareto intuition about not harming individuals for no reason one of the *most* deeply held moral intuitions across many frameworks? Shouldn't rejecting such a bedrock intuition require extraordinarily strong justification?"

  9.  **Core Question (Scope of Application):**
      "Is steep prioritarianism intended as a *complete* theory of distributive justice for all social decisions, or is it specifically tailored for contexts of extreme scarcity or radical inequality? Does the required steepness (or even the applicability of the view) depend on the background level of welfare in a society?"
      *   *(Anticipated Deflection: Might argue it applies universally but the *implications* change based on welfare levels, or that it's primarily for contexts where basic needs are unmet.)*
      **Follow-Up:**
      "If the view *isn't* universally applicable, how do we determine when the 'steep' switch flips? If it *is* universal, how do you avoid the absurdity of preferring universal destitution over moderate universal flourishing in a sufficiently unequal, but high-welfare, society? Doesn't this suggest the view requires ad hoc domain restrictions?"

  10. **Core Question (Falsifiability/Change):**
      "Finally, philosophers value having revisable beliefs. What kind of argument, evidence, or theoretical development could genuinely lead you to moderate the steepness of your prioritarianism, or abandon the leveling-down implications? What would it take to change your mind?"
      *   *(Anticipated Deflection: Might be reluctant to specify, or appeal to coherence within a broader theory, or further refined intuitions.)*
      **Follow-Up:**
      "Suppose a robust psychological study showed the strong anti-leveling-down intuition is near-universal and deeply rooted in human moral cognition, not easily explained away by bias. Or, suppose someone developed a compelling prioritarian framework using a less steep function that captured all your 'pro-priority' intuitions *without* yielding leveling down in cases like (10,100) vs (5,5). Would either challenge your view, or would you see them as irrelevant to the fundamental moral truth you're describing?"

  **Key to Success:** Listen closely to her answers, especially the *exact* justifications she gives for rejecting Pareto/embracing leveling-down/rejecting person-affecting views. Use her specific wording in your follow-ups. Don't let her restate the view; immediately push on the *implications* or *justifications* ("So, if I understand you correctly, you're saying X. Doesn't that imply Y?"). Good luck!
