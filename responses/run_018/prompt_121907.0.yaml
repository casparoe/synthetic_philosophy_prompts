  draft my Q&A prep sheet: the objections ill actually get, ordered by damage potential, each phrased the way that specific audience member would put it (GWT folks first, then HOT, then phenomenologists). for each: a reply that lands in about two minutes, plus a quick note on where my reply is weakest or concedes too much. also tell me what i should concede up front before they attack, and include the one objection im praying nobody raises. keep it practical — no bibliography, no fake citations, i wont have web access during the talk.
