answer: |-
  Here's your damage-controlled Q&A prep sheet, ordered by threat level and audience-specific phrasing. Focus on empirical grounding and avoid theoretical rabbit holes.

  **Preemptive Concession (Open with this):**
  > "I concede that global workspace ignition is *necessary and sufficient for reportable access consciousness*. My claim is narrower: *non-reportable* phenomenal qualities (Block's 'phenomenal consciousness') arise *earlier* and *locally* via recurrent loops in sensory cortex (~180ms), in a format incompatible with global broadcasting. This loop isn't 'pre-conscious'—it *is* the neural correlate of unreportable phenomenal density."

  ---

  ### **Objection 1 (GWT Proponents - Highest Threat)**  
  *"Your 'phenomenal loop' is just Dehaene's 'pre-conscious ventral stream processing' (V1-V4-IT recurrence). We agree it's necessary! But it only becomes conscious when amplified by parietal/prefrontal feedback into workspace ignition at ~300ms. You're relabeling established pre-conscious processing."*  
  **Reply (1.5 min):**  
  "Critically, this loop *peaks within 180ms* (e.g., V1/V2 recurrence in masking studies), while ignition requires ~300ms. Crucially, masking can *disrupt ignition* while preserving the loop—subjects report 'seeing nothing' yet exhibit forced-choice behavior or neurosignatures of sensory detail (e.g., decoded V1 patterns). This suggests the loop generates *phenomenal content* that never integrates for reporting. Workspace theories conflate *consciousness* with *global accessibility*. The loop isn't a precursor—it's a parallel format."  
  ▶ **Weakness:** Concedes GWT explains reportability; relies on indirect evidence (decoding, forced-choice) that GWT can dismiss as "unconscious processing."

  ---

  ### **Objection 2 (GWT Proponents - High Threat)**  
  *"If this loop is truly conscious but unreportable, how is it functionally different from unconscious processing? Why posit 'phenomenal density' if it has no causal role in cognition? This sounds epiphenomenal."*  
  **Reply (1 min):**  
  "It *has* a causal role: it drives rapid, analogue behaviors (e.g., grasping adjustments to object size before you 'know' it). But its *richness* exceeds the symbolic tokens the workspace can broadcast (e.g., you can't report *every* hue in a gradient). This is why we get overflow: the loop sustains high-fidelity sensory states that guide local action, but only abstracted features (e.g., 'red circle') enter the workspace. It's not epiphenomenal—it's computationally constrained broadcasting."  
  ▶ **Weakness:** Risks conflating *conscious* overflow with unconscious dorsal stream processing (e.g., Milner & Goodale). Needs clear empirical demarcation.

  ---

  ### **Objection 3 (Higher-Order Theorist)**  
  *"Phenomenality without *any* higher-order representation is incoherent. How can a state be *phenomenally* conscious if the system lacks even implicit awareness *that* it's in that state? Your 'density' is just non-conscious representation."*  
  **Reply (1 min):**  
  "HOT explains *reflective* consciousness, not primitive phenomenality. Blindsight patients have V1 lesions disrupting your loop—they lack *all* visual phenomenality, even though prefrontal HOT systems are intact. Conversely, early visual recurrence (e.g., in migraine auras) generates irrepressible qualia *without* metacognition. The loop generates first-order phenomenal properties; HOT adds reportable *access* to them. Blindsight proves you can have HOT without phenomenality; auras prove you can have phenomenality without HOT."  
  ▶ **Weakness:** Assumes auras/early vision lack HOT involvement; HOT theorist may argue prefrontal feedback is faster than acknowledged.

  ---

  ### **Objection 4 (Phenomenologists)**  
  *"You reduce lived richness to a 'loop'! But phenomenology reveals consciousness as an integrated field, not fragmented sensory pixels. Your 'density' ignores temporal flow, intentionality, and embodiment—replacing experience with neural fireworks."*  
  **Reply (1 min):**  
  "I agree completely—this loop *isn't* the whole story. It only explains the *content* of sensory qualia (e.g., the redness of red), not structural features like temporality or selfhood. But crucially, it anchors those qualities empirically. The loop's analogue format explains why sensory qualia *feel* continuous and ineffable—it avoids the discretization of workspace symbols. This is a bridge: first-person structure *arises from* constraints of this format interacting with downstream processes."  
  ▶ **Weakness:** Concedes the model is incomplete; may appear to reduce phenomenology to "pixels."

  ---

  ### **Objection 5 (Phenomenologists)**  
  *"If the loop is localized and recurrent, why doesn't split-brain surgery create two conscious fields? Yet patients report unified consciousness. Your view predicts fragmentation we don't observe."*  
  **Reply (45 sec):**  
  "Splitting severs *cortical-cortical* connections, but each hemisphere retains *local* recurrence (e.g., V1-V4 loops). Crucially, *report* depends on intact workspace in the language-dominant hemisphere. The non-dominant hemisphere likely *has* unreportable phenomenal states (e.g., reacts emotionally to unseen images). We don't get 'two reportable subjects,' but we *do* get behavioral evidence of isolated phenomenal processing."  
  ▶ **Weakness:** Relies on contested interpretations of split-brain data; phenomenologists may reject behavioral evidence as irrelevant to unity.

  ---

  ### **The Nightmare Objection (Pray It’s Not Raised):**  
  *"If phenomenal density exists pre-access, why does TMS to prefrontal cortex (disrupting workspace ignition) abolish *all* reported consciousness? Shouldn't subjects still experience unreportable qualia? Yet they report 'nothing.' This falsifies your view."*  
  **Contingency Reply (If Forced):**  
  "TMS disrupts *both* ignition *and* feedback to sensory loops. Without top-down stabilization, the recurrent loop collapses before reaching its ~180ms peak. Masking studies disrupt ignition *without* disrupting the loop (using feedforward inhibition), which is why we see residual phenomenality there. TMS is a broader disruption."  
  ▶ **Desperation Level:** High. This is a major vulnerability. Requires assuming TMS effects are less specific than masking.

  ---

  **Key Tactics:**  
  1. **Anchor in Data:** Constantly reference masking, decoding, split-brain, and blindsight.  
  2. **Frame as Complementary:** "GWT explains access; I explain non-reportable phenomenality."  
  3. **Use Their Language:** "Ignition," "overflow," "higher-order representation," "lived experience."  
  4. **Concede Early:** You already agree GWT explains reportability; don’t fight that battle.  
  5. **Dodge Traps:** If asked "But how does *density* feel like anything?", pivot to: "For the same reason recurrent processing *in general* correlates with consciousness—but this specific loop explains its *inaccessibility*."  

  **Bring These Cues:** ✂️ (for split-brain), ⏱️ (for timing), 👁️ (for masking/blindsight). Good luck!
