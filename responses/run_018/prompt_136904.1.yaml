prompt: |-
  I facilitate a graduate seminar on theories of well-being—about 14 students, one 90-minute session. Design a structured in-class simulation, not a lecture or discussion, that makes the group run into the force of Nozick’s experience-machine objection from the inside rather than hearing it named afterward. The specific conceptual target is this: mental-state theories (hedonism, informed-desire satisfaction) have trouble distinguishing a preference that tracks real achievement from one that has been adaptively formed to value mere experience, and the experience-machine intuition draws its power from that ambiguity rather than from a simple “contact with reality” slogan.

  Set up a two-round resource-allocation game. In round one, each student receives ten “well-being points” to split between “experience modules” (guaranteed pleasant mental states, no external verification required) and “achievement tokens” (require peer-verified task completion, risk failure). Before round two, assign hidden roles via sealed cards: half the group receives an “adaptive-preference card” stating that achievement tokens are permanently unavailable to them due to a fabricated structural constraint, but they are not told that their preference shift in round two is being monitored; the other half receives a “genuine-preference card” with no constraint. Both groups then reallocate their ten points. The payoff is real but small: the final allocation determines which of two take-home essays they receive—one defending mental-state theories, one defending objective-list theories—plus a coffee voucher tied to the achievement-token count.

  The rules should be arranged so that, by round two, the adaptive-preference group tends to shift heavily toward experience modules without recognizing that their valuation has been shaped by the hidden constraint, while the genuine-preference group splits more evenly or retains achievement investment. Only after allocations are locked and recorded should roles be revealed, and the facilitator should then ask each group to defend their round-two split before knowing who held which card.

  The debrief must do four things. First, map the round-one/round-two shift onto the distinction between brute preference and informed desire, and onto the mental-state/objective-list boundary. Second, explain what will predictably go wrong the first time this is run—for example, that the adaptive-preference group may feel manipulated rather than philosophically enlightened, or that participants will try to reverse-engineer hidden roles during round two, or that the coffee-voucher incentive may crowd out reflective allocation—and say how to handle each failure without breaking the simulation’s internal logic. Third, say honestly which feature of Nozick’s original argument the simulation cannot reproduce, namely the first-person phenomenological difference between living inside a simulated world and tracking actual achievement, which the facilitator must supply verbally in the debrief rather than expecting it to emerge from the rules. Fourth, note what the activity specifically cannot show about hedonism, since the hidden-role mechanism is structurally closer to an objective-list or informed-desire framework than to a pure mental-state view.

  Write this as a runnable protocol: explicit rules and materials, a minute-by-minute timeline for the 90 minutes, the payoff scheme in detail, a debrief script outline, and the honest limitations note. If the hidden-role mechanism actually collapses the distinction I am asking you to stage—for instance, if it presupposes that adaptive preferences are always detectable, always illegitimate, or that mental-state theories can never accommodate them—say so plainly rather than designing around the problem. I want direct pushback if the premise is confused or the task as posed can’t be done well.
reasoning: |-
  Okay, I need to design a simulation for a graduate seminar on well-being theories that directly engages with Nozick's experience machine. The user wants students to confront the ambiguity between preferences tracking real achievement versus those shaped by adaptive constraints—without just lecturing about it. 

  Hmm, the core challenge is making the preference-shift feel organic while hiding the manipulation. The user’s proposed two-round resource game with hidden roles seems clever, but I should check for conceptual pitfalls. Is the adaptive-preference group’s shift really analogous to choosing the experience machine? Or does the card mechanic accidentally imply objective-list assumptions? 

  *Pauses to map the theoretical tensions* 
  The coffee voucher for achievement tokens might push students toward "objective" value, which could muddy the mental-state theory critique. Also, Nozick’s key point is about phenomenological loss, not just constrained choice. The simulation can’t replicate that inner feeling of disconnection—I’ll need to flag this hard in the debrief. 

  *Brainstorms procedural tweaks* 
  To reduce gaming the system, I’ll make the role cards sealed until after allocations. And for the payoff, I’ll decouple the essay assignment from points to avoid incentivizing strategic play. The voucher stays small so it doesn’t override philosophical reflection. 

  *Anticipates failures* 
  Biggest risk: adaptive-preference group feels cheated, not enlightened. Debrief must reframe their frustration as data—their anger proves the point about preferences resisting artificial constraints. Also, some might suspect hidden roles in round two. I’ll add a red herring about "random audits" to mask the real purpose. 

  *Structures timeline tightly* 
  90 minutes is tight. Allocations must be swift: 10 mins per round. Debrief needs 30 mins minimum to unpack everything, especially the limitations. I’ll script exact prompts for group defenses to steer discussion. 

  *Checks user’s non-negotiables* 
  User explicitly wants pushback if flawed. Well—the simulation does implicitly treat adaptive preferences as illegitimate, which mental-state theories might dispute. Can’t fix that without breaking the setup, so I’ll confess it upfront: "This assumes constrained preferences are deficient, which hedonism may deny." 

  *Final design* 
  Materials: Cards, tokens, allocation sheets. Payoff: Essays assigned by final split (not point totals!), minor voucher. Script will confront the phenomenological gap head-on: "Unlike Nozick’s machine, you knew reality existed outside the game—that’s why we must imagine..." 

  *Nods* Ready. This should make the abstraction painfully personal.
answer: |-
  Below is a runnable protocol for your simulation, designed to force an internal confrontation with the conceptual ambiguity in mental-state theories. It includes direct pushback where the mechanism risks distortion.

  ---

  ### **Simulation Title**: *The Preference Shift Experiment*  
  **Conceptual Target**: Exposing the tension between adaptive preferences and reality-tracking preferences in mental-state theories of well-being.  

  ---

  ### **Materials**  
  - **Cards**: 14 sealed envelopes (7 × **"Constraint: Achievement Locked"**, 7 × **"No Constraints"**).  
  - **Resource Sheets**: 28 allocation sheets (1 per student per round).  
  - **Tokens**:  
    - **"Experience Modules" (EM)**: Blue chips (or virtual points).  
    - **"Achievement Tokens" (AT)**: Red chips (or virtual points).  
  - **Timer**.  
  - **Two essay prompts** (distributed post-simulation).  
  - **Coffee vouchers** ($5 value, tied to AT count).  

  ---

  ### **Setup & Rules**  
  **Key Mechanics**:  
  - **Round 1**: All students split 10 points freely between EM (guaranteed pleasant states) and AT (require peer-verified tasks).  
  - **Hidden Roles**: After Round 1, distribute sealed cards. **Do not reveal roles until final debrief**.  
  - **Round 2**: Reallocate 10 points. "Constraint" group *cannot earn AT* (but are unaware their shift is monitored).  
  - **Achievement Verification**: For AT, students must complete a 30-sec task (e.g., solve a puzzle) witnessed by one peer. Failure = 0 AT.  

  **Payoff Structure**:  
  - **Essay Assignment**: Final allocation determines essay:  
    - >50% EM → Defend mental-state theories.  
    - >50% AT → Defend objective-list theories.  
  - **Coffee Voucher**: $5 × (Total AT in Round 2 ÷ 10).  

  ---

  ### **Timeline (90 Minutes Total)**  
  | **Time** | **Phase** | **Actions** |  
  |----------|-----------|------------|  
  | 0-5 min | **Intro** | Explain rules: *"Allocate points between guaranteed pleasant experiences (EM) and peer-verified achievements (AT). Payoffs affect your workload and rewards."* |  
  | 5-15 min | **Round 1** | Students allocate 10 points. Collect sheets. |  
  | 15-20 min | **Role Assign** | Distribute *sealed* cards. Stress: *"Do not open or discuss cards."* |  
  | 20-35 min | **Round 2** | Reallocate 10 points. "Constraint" group physically blocked from AT tasks (e.g., facilitator declines to give puzzles). |  
  | 35-40 min | **Lock Allocations** | Collect final sheets. Record EM/AT splits. |  
  | 40-50 min | **Reveal Roles** | Students open cards. Split into "Constraint" (Group A) and "No Constraints" (Group B). |  
  | 50-70 min | **Group Defense** | *Without knowing others’ roles*: Group A defends Round 2 choices, then Group B. **Prompt**: *"Justify your allocation as rational for well-being."* |  
  | 70-90 min | **Debrief** | Structured discussion (script below). Distribute essays/vouchers. |  

  ---

  ### **Predicted Failures & Mitigation**  
  1. **Manipulation Resentment**:  
     - **Risk**: "Constraint" group feels cheated, not philosophically challenged.  
     - **Mitigation**: In debrief, reframe: *"Your frustration mirrors the ethical outrage against systems that force adaptive preferences."*  

  2. **Reverse-Engineering Roles**:  
     - **Risk**: Students guess hidden constraints and game allocations.  
     - **Mitigation**: Add decoy complexity (e.g., *"Some may be audited for task compliance"*). Block AT tasks abruptly for "Constraint" group to prevent testing.  

  3. **Voucher Incentive Dominance**:  
     - **Risk**: Students maximize AT for coffee, ignoring reflection.  
     - **Mitigation**: Keep voucher value trivial ($5). Emphasize *"The essay assignment has greater workload impact."*  

  ---

  ### **Debrief Script Outline**  
  **Step 1: Map the Preference Shift**  
  - *"Group A: You shifted to EM after being blocked from AT. Does this feel like a rational adjustment (informed desire) or a surrender (adaptive preference)?"*  
  - *"Group B: You retained AT access. Did your allocation reflect a ‘truer’ preference?"*  
  - **Key Link**: Highlight how mental-state theories struggle to distinguish Group A’s *adaptive* shift from Group B’s *reality-tracking* preferences.  

  **Step 2: Connect to Nozick**  
  - *"The machine isn’t rejected because reality is ‘better’—it’s because we distrust preferences formed in ignorance of constraints. Group A’s shift reveals this ambiguity."*  

  **Step 3: Limitations of the Simulation**  
  - **Honest Gap**: *"This can’t replicate the* ***phenomenological loss*** *in Nozick’s machine. You knew reality existed outside the game. The machine’s horror is realizing your life lacked* any *tether to truth—a first-person shock we must imagine."*  
  - **Hedonism Shortfall**: *"Pure hedonism says Group A’s EM-focused allocation is rational. This simulation assumes adaptive preferences are defective—but mental-state theories* can *argue they’re legitimate. We’ve built an objective-list bias into the mechanic."*  

  **Step 4: Conceptual Pushback**  
  - *"Crucially, the hidden-role mechanic* ***presupposes adaptive preferences are detectable and illegitimate***. But hedonism might say: *‘If you feel satisfied, it* is *well-being, regardless of manipulation.’ This simulation can’t resolve that clash—it forces you to confront why that answer feels inadequate."*  

  ---

  ### **Why This Works (and Doesn’t)**  
  - **Strengths**:  
    - Forces "Constraint" group to *live* the adaptive shift, exposing the ambiguity in desire-based theories.  
    - Payoffs make stakes tangible but minor enough to avoid coercion.  
  - **Weaknesses (as per your request for pushback)**:  
    - The simulation **collapses the mental-state/objective-list boundary** by design: It *assumes* AT (reality-tracking) is objectively valuable, making adaptive preferences seem inherently deficient. A true hedonist could reject this.  
    - **Cannot show**: Why we *ought* to reject adaptive preferences if they yield positive mental states. The debrief must explicitly state: *"Nozick’s point is that we intuitively rebel against this—but the simulation doesn’t prove that rebellion is rational."*  

  ---

  ### **Post-Activity Notes for Facilitator**  
  - **Essay Prompts**:  
    - **Mental-State Defense**: *"Argue that Group A’s Round 2 allocation is just as rational for well-being as Group B’s."*  
    - **Objective-List Defense**: *"Why does the simulation show that well-being requires access to genuine achievement?"*  
  - **Voucher Calculation**: $5 × (Individual AT in Round 2 ÷ 10).  
  - **Critical Script Line**: *"This activity doesn’t refute hedonism—it makes you feel why many find it unsatisfying. That’s the experience machine’s power."*  

  This protocol leans into its biases to provoke discomfort with mental-state theories, then explicitly names those biases in the debrief. It fulfills your goal by making abstract preferences viscerally contestable, while admitting where it departs from pure philosophy.
