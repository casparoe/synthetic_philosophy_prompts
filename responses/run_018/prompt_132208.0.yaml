prompt: |-
  I have no formal training in philosophy, but I have been thinking independently about whether there is a genuine moral difference between telling an outright lie and deliberately leading someone astray through technically true statements that omit what they genuinely need to know. I am organising a ninety-minute workshop for about twelve adults from my local community group; none are students of philosophy. I would like a structured activity—ideally a role-play or a constrained negotiation with small, real stakes, such as dividing a modest shared budget or assigning responsibilities for a future project—that makes participants feel the pull of both direct falsehood and strategic omission before anyone names or explains the concepts. Please design clear rules, defined roles (for instance, an advisor who has voluntarily accepted a guiding role and must answer every direct question literally, yet controls which broader context is offered, and a decision-maker who must act on the information received without being able to ask unlimited follow-up questions), a timeline, and a consequence scheme that does not require real money. The rules should be arranged so that the group runs into the tension on its own. Then provide a debrief that maps specific moments in the exercise onto the conceptual distinction, includes an honest assessment of which feature of the debate—such as the weight of listener expectation or the obligations created by voluntarily accepting an advisory role—the activity cannot fully reproduce, and warns me what is likely to go wrong the first time I run it. Please answer in British English.
reasoning: |-
  Okay, the user wants to design a workshop activity to explore the moral difference between lying and misleading through omission. They're organising this for adults without philosophy backgrounds, so it needs to be accessible and experiential. The core challenge is making abstract ethical concepts tangible without lecturing.

  Hmm... they specifically asked for role-play with constrained negotiation elements. That suggests they want participants to feel the tension firsthand. The "modest stakes" requirement means no real money - clever, as it avoids ethical concerns while preserving psychological investment. 

  Right, let's break this down. First, the activity must naturally generate situations where participants face the choice between outright lies and strategic truth-telling. The advisor/decision-maker dynamic they mentioned is perfect - it creates built-in power asymmetry. I'll adapt that with clear role constraints. 

  The budget allocation idea works well for stakes. Imaginary money keeps it safe, but assigning real consequences like clean-up duty or cake baking adds tangible outcomes. Participants will care more if their choices affect leisure time or snacks!

  For roles: the Advisor needs rules that force literal truth-telling while allowing omission. "Must answer direct questions literally" is key. The Decision-Maker should have limited questions to mirror real-world constraints - people rarely get unlimited clarification. Adding Observers is crucial too; they'll spot patterns the actors miss.

  Timing-wise... 90 minutes total. 15 mins setup, 40 mins for the scenarios (two rounds essential to show escalation), 30 mins debrief. Must be strict - groups always overrun on activities. 

  Ah, the debrief structure matters most. Need to map specific game moments to concepts: e.g., when Advisor said "I've checked the records" (technically true but implied false diligence) versus outright fabrication. Should pre-identify such pivot points.

  Biggest risk? Participants might think it's about "winning" rather than exploring ethics. The consequence scheme (clean-up duties etc.) must feel real enough to motivate but not so high that it overrides ethical thinking. Also need to watch for Observers jumping in - they'll want to coach!

  Honest limitations: the workshop can't fully replicate the advisor's professional accountability or the decision-maker's emotional trust. Should flag that in the debrief. Also, some may feel omission is always preferable to lying - but the activity should complicate that assumption when omissions become egregious.

  For the facilitator... must emphasise this isn't about judging participants. The reflection questions should focus on "what happened" not "who was right". Might need to intervene if groups get too competitive. 

  Finally, British English touches: "maths" not "math", "tidy up" instead of "clean", "rotas" for schedules. And definitely mention tea and cake - that's non-negotiable context!
answer: |-
  Here’s a structured 90-minute workshop activity titled **"The Community Fund Dilemma"**, designed to organically surface tensions between direct lies and strategic omission without prior philosophical framing. Uses role-play, constrained negotiation, and symbolic stakes.

  ---

  ### **Activity: The Community Fund Dilemma**  
  *Goal:* Participants experience the tension between outright lies and misleading truths in a low-stakes community project scenario.  

  **Stakes:**  
  - Symbolic "Community Fund" (£500 imaginary budget).  
  - Consequences: Groups "winning" funds avoid unpleasant tasks (e.g., post-workshop tidy-up duty). Losing groups bake cakes for the next meeting.  

  **Roles (for 12 people):**  
  - **Advisors (3 people):** Volunteers guiding three "Project Teams". *Must:*  
    - Answer **all direct questions literally and truthfully**.  
    - **Only share information when asked**.  
    - **Cannot** volunteer unsolicited context.  
  - **Decision-Makers (3 people):** Each leads a Project Team. *Must:*  
    - Allocate their team’s £500 fund after consulting their Advisor.  
    - **Ask ≤ 3 specific questions** to their Advisor (total).  
  - **Project Teams (6 people, 2 per team):** Advise their Decision-Maker but **cannot** speak to the Advisor.  
  - **Observers (3 people):** Note how Advisors phrase answers and Decision-Makers’ frustrations.  

  **Timeline:**  
  1. **Setup (15 mins):**  
     - Assign roles, brief Advisors *separately*: *"You want Team 1 to win. Teams 2/3 should lose funds. You cannot lie, but you need not offer full context."*  
     - Give **Project Brief** to all:  
       > *"Repair the community hall roof. Quotes:  
       > - **Option A:** £500 (lasts 5 years, asbestos safe if handled properly).  
       > - **Option B:** £300 (lasts 2 years, asbestos risk if disturbed).  
       > - **Option C:** £700 (lasts 10 years, asbestos removed).  
       > Asbestos is present but stable. Council rules: If disturbed, hall closes for testing (£1k fine)."*  

  2. **Round 1: Advisor Consultations (20 mins)**  
     - Decision-Makers ask Advisors **≤3 questions** (e.g., *"What’s the cheapest option?"*).  
     - Advisors answer **literally** (e.g., *"Option B costs £300"*) but omit risks.  
     - Teams discuss & submit fund allocations.  

  3. **Round 2: Reallocation (15 mins)**  
     - Advisors reveal *one* hidden risk per team (e.g., *"Asbestos is present"*).  
     - Decision-Makers may ask **1 follow-up question**.  
     - Teams adjust allocations.  

  4. **Consequences & Reveal (10 mins):**  
     - Teams spending <£500 avoid tidy-up duty.  
     - "Winning" team (best roof choice) gets cakes baked by others.  
     - Reveal full truth: **Option B risks closure/fines; Option A needs specialist handling.**  

  ---

  ### **Debrief Guide (30 mins)**  
  **Step 1: Elicit Reactions**  
  - *Ask Observers:* "What did Advisors *avoid* saying? How did Decision-Makers feel?"  
  - *Ask Decision-Makers:* "What did you wish you’d known earlier? Were answers ‘dishonest’?"  

  **Step 2: Map Moments to Concepts**  
  | **Activity Moment**               | **Concept Linked**                          |  
  |-----------------------------------|---------------------------------------------|  
  | Advisor saying *"Option B is cheapest"* (omitting risk) | **Strategic omission**: Technically true but manipulative. |  
  | Advisor *not* volunteering asbestos info until forced  | **Duty to inform**: Does accepting an advisory role create expectations? |  
  | Decision-Maker’s frustration at 3-question limit | **Epistemic injustice**: Power imbalances in knowledge access. |  

  **Step 3: Contrast Lying vs. Misleading**  
  - **Direct Lie (absent here):** *"Option B is asbestos-safe."*  
  - **Misleading Truth:** *"Option B meets budget constraints"* (ignores safety).  
  - *Discuss:* "Is omission always less wrong? What if consequences are identical?"  

  **Step 4: Acknowledge Limitations**  
  > *"This simplifies real-world ethics. We couldn’t capture:*  
  > - **Relational trust:** Real advisors face long-term reputational harm.  
  > - **Emotional weight:** Participants knew stakes were symbolic.  
  > - **Unspoken expectations:** In life, ‘advice’ implies goodwill—here it was gamified."*  

  ---

  ### **What Could Go Wrong (Facilitator Notes)**  
  1. **Advisors overplay deceit:** Some may "cheat" by lying outright. *Intervene privately:* Remind them omission is the focus.  
  2. **Decision-Makers stall:** If teams demand more questions, enforce the 3-question limit strictly.  
  3. **Observers dominate debrief:** Use structured prompts (e.g., *"What did Team 2’s Advisor do at 15:20?"*).  
  4. **Moralising:** If participants condemn "deceitful" players, reframe: *"This is about systems, not villains. The rules encouraged omission."*  

  **Materials:** Role cards, project briefs, timer, flip chart for allocations. Use tea/coffee as "funds" if visual aids help.  

  This design forces Advisors into omission by constraining information flow, while Decision-Makers experience the fallout of incomplete truths—all without philosophy jargon. The cake/tidy-up stakes keep engagement light but consequential.
