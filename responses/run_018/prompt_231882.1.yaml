prompt: |-
  I keep tripping over the same puzzle and Im hoping it has a name — or if it doesn't, I want help carving it up properly. It goes like this. Suppose someone says a system can suffer if it runs the right kind of program. But any physical process can be described as running all sorts of programs, depending on how permissive you are about mapping its internal states onto symbols; a puddle, a wall, a bucket of water on a radiator could be "running" whatever you like under some description. So two people can look at one physical process and one says it's a mind and the other says it's just physics, and moral questions (may I turn it off? did I harm it?) end up depending on which description we agree to count. The usual fix is to say only "natural" or "causal" mappings count, but that seems to just push the question back a step. Does this problem have an established name, and how is it different from nearby things like the Chinese room or the idea that everything is conscious? What I really want is not a label but a clean account of what exactly the problem is, where its edges are, and what would count as solving it. Oh, and please keep it continuous prose, like you'd write an email — no headings, bullet points, bold, or tables.
