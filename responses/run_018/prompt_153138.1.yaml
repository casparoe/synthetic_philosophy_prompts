answer: |-
  Here is an analysis applying W.E.B. Du Bois's "art as propaganda" thesis to the visual and curatorial logic of the 1940 American Negro Exposition's Court of Dioramas and murals, focusing on Dawson and Scott:

  **Applying Du Bois's Framework: Propaganda as Racial Uplift & Truth**

  1.  **The Sequential Historical Narrative (Dawson's Dioramas):**
      *   **Propaganda Function:** This structure embodies Du Bois's call for art to serve racial truth. By tracing Black achievement from ancient Egypt through Reconstruction to WWI, Dawson directly counters the dominant narrative of Black absence or inferiority in history. It functions as *propaganda* by:
          *   **Asserting Historical Legitimacy:** Anchoring Black identity in ancient, revered civilizations (Egypt, Ethiopia) combats notions of racial "beginnings" in slavery.
          *   **Documenting Contribution & Resilience:** Highlighting figures like Crispus Attucks, inventors, soldiers, and Reconstruction leaders provides concrete evidence of Black agency, intellect, and patriotism – key tenets of uplift ideology demanding full citizenship.
          *   **Creating a Teleology of Progress:** The forward march implies inevitable Black advancement and rightful place in the American future, directly serving the political goal of equality.
      *   **Actors:** *Dawson (artist/curator)* consciously constructed this narrative. *Organizers/curators* sanctioned it as the central historical framework. *Viewing public* encountered a corrective, empowering counternarrative.

  2.  **Monumentalization of Labor & Military Service (Dawson's Dioramas & Scott's Murals):**
      *   **Propaganda Function:** This is core "uplift propaganda." Depicting Black labor (agricultural, industrial, artisanal) as foundational to American prosperity argues for economic rights and dignity. Glorifying military service (Revolution, Civil War, WWI) is direct propaganda for civic inclusion and patriotism – proving loyalty and demanding the rights fought for. Scott's murals often rendered these themes with heroic scale and idealized forms, making the *truth* of Black contribution undeniable and *beautiful*.
      *   **Actors:** *Dawson & Scott (artists)* emphasized these themes visually. *Curators* placed them prominently. *Viewing public* (especially Black viewers) saw their ancestors' and their own roles valorized.

  3.  **Immersive Dioramas vs. Conventional Gallery Display:**
      *   **Propaganda Function:** Choosing meticulously crafted 3D dioramas over static paintings or artifacts was a strategic curatorial choice maximizing propaganda efficacy:
          *   **Accessibility & Impact:** Dioramas were popular, museum-like, and easily understood, making complex historical truths vivid and memorable for a broad audience (Du Bois's "propaganda" must reach people).
          *   **Tangibility & "Reality Effect":** The 3D scenes aimed for realism, making history feel immediate, undeniable, and *less abstract* than paintings. This heightened the emotional and cognitive impact of the racial truths portrayed.
          *   **Beauty as Persuasion:** The craftsmanship, detail, and scenography constituted a form of *beauty* specifically deployed to make the propaganda more engaging and credible.
      *   **Actors:** *Curators* (including Dawson) chose this medium. *Dawson* executed it. *Viewing public* experienced history as an enveloping, persuasive spectacle.

  **Where Form Resists Reduction to Message (Du Bois's Blind Spots)**

  1.  **Scott's Muralism: Beyond Literal Narrative:**
      *   **Compositional Grandeur:** Scott's large-scale, classically influenced compositions (dynamic poses, strong diagonals, balanced masses) generate an inherent aesthetic power and sense of monumentality that transcends the specific historical or labor narrative. The *formal beauty* of the design commands attention in its own right.
      *   **Symbolic Abstraction & Allegory:** While depicting concrete subjects, Scott's style often incorporated symbolic elements (e.g., figures representing concepts like "Freedom" or "Progress," stylized landscapes, expressive light). This moves beyond direct propaganda into the realm of poetic evocation and universal human aspiration.
      *   **Emotive Resonance:** The skillful use of color, light, and dramatic gesture in the murals could evoke profound feelings of dignity, struggle, hope, or sorrow that resonate more broadly than the specific historical "message," appealing to a sense of shared humanity.

  2.  **Diorama Craftsmanship & Detail:**
      *   **Absorption in the Miniature:** The intricate detail of Dawson's dioramas (tiny tools, fabrics, facial expressions) could captivate viewers aesthetically, momentarily drawing focus away from the broader historical/political narrative towards appreciation of the meticulous artistry itself.
      *   **Theatricality & Atmosphere:** The carefully constructed lighting and staged scenes created dramatic moods and atmospheres that were affectively powerful but not solely reducible to a clear propagandistic "point."

  **Reversing the Analysis: Propaganda's Absorption of Aesthetics & Instability in Du Bois's Distinction**

  1.  **Propaganda Absorbing Aesthetic Form (Effectively):**
      *   The exposition demonstrates that propaganda *can* effectively absorb and utilize aesthetic form without necessarily losing efficacy. The *beauty* of Scott's murals (grandeur, skill) amplified the dignity of his subjects, making the "truth" of Black capability and history more compelling. The *immersive beauty* of the dioramas made the historical propaganda more engaging and memorable. Here, beauty is not a separate pursuit but a powerful *tool* enhancing the propaganda's reach and impact. The artists and curators successfully harnessed aesthetic appeal for political purpose.

  2.  **Revealing Instability in Du Bois's Distinction:**
      *   However, the exposition also reveals an instability in Du Bois's seemingly clean separation between "propaganda" beauty and "art for art's sake" beauty:
          *   **Ambiguity of Reception:** While organizers intended the beauty to serve propaganda, viewers might experience the formal qualities (Scott's composition, Dawson's detail) as intrinsically moving or beautiful *first*, potentially detaching them from the intended political message or appreciating them on a purely aesthetic level Du Bois might dismiss. The viewing public's experience isn't monolithic.
          *   **Artistic Expression Beyond Brief:** Scott's stylistic choices (influences from Mexican muralism, classical art) and Dawson's painstaking craft involved aesthetic decisions driven by artistic vision and skill that exceeded a purely instrumental propagandist function. The *artist* brings their own relationship to beauty and form, which may not be fully subsumed by the propagandistic intent.
          *   **Enduring Power of Form:** Elements like the sheer scale of Scott's work or the uncanny detail in Dawson's dioramas possess an aesthetic power that persists even when the specific historical context or propagandistic intent fades, suggesting a residue of "beauty" that resists complete instrumentalization. This indicates that aesthetic form has its own agency and effect, not always perfectly aligned with conscious propaganda.

  **Where Du Bois's Theory Remains Silent:**

  *   **The Role of Medium:** Du Bois's thesis doesn't explicitly address *how* the choice of medium itself (mural vs. diorama vs. painting) impacts the propaganda/aesthetics dynamic. The exposition highlights how the immersive, popular diorama format uniquely served its propagandistic goals through accessibility and spectacle in ways a conventional gallery might not.
  *   **Audience Heterogeneity:** He assumes a relatively unified reception aligned with the propagandist's intent. The exposition faced diverse audiences (Black communities seeking affirmation, white audiences needing education, skeptics), making reception complex and varied – the "beauty" might disarm some, while the "propaganda" might alienate others.
  *   **The Artist's Internal Tension:** While demanding art serve propaganda, Du Bois doesn't fully grapple with the potential internal conflict for the *artist* (like Scott or Dawson) between fulfilling a political mission and pursuing their own aesthetic vision or formal innovations. The murals and dioramas hint at this tension.
  *   **Affect Beyond Message:** The theory focuses on art conveying cognitive "truths" for political ends. It under-theorizes the powerful, non-discursive *affective* impact of beauty, scale, immersion, and craftsmanship – feelings of awe, pride, sorrow, or connection evoked by the exposition's visuals, which were crucial to its impact but not purely "messages."

  In conclusion, the Exposition powerfully enacted Du Bois's vision of art as propaganda for racial truth and uplift through its narrative structure, themes, and immersive medium. Yet, the formal achievements of Scott and Dawson also demonstrated that aesthetic power possesses a complexity and resonance that cannot be entirely reduced to instrumental propaganda, revealing an inherent instability in Du Bois's sharp distinction and highlighting aspects of artistic creation and reception his influential theory could not fully encompass.
