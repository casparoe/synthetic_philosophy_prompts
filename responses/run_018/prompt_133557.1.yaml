  I've been arguing with my roommate about Friedman's F-twist — you know, the idea that unrealistic assumtions in a scientific model don't actually hurt it as long as it predicts well. My study group kept using the standard economics example with perfect rationality, but I want to see the idea pushed somewhere weirder, like into evolutionairy psychology. Could you write a joke that applies this tension to a mate-selection model? Specifically, imagine a dialogue where one researcher defends a model that assumes people are omniscient about every potential partner's genetic fitness, just because it predicts actual dating outcomes decently. The punchline needs to turn on the actual logic of the F-twist — that predictive success can excuse unrealistic premises — not just be a generic "scientists are out of touch" gag. Someone who knows the debate should laugh; someone who doesn't should still understand what's being mocked.

  After the joke, please include a brief note on where you're taking liberties with Friedman's actual view or leaning on a contested interpretation — for instance, whether he really thinks realism never matters, or if that's a strawman people use. Also, say what kind of counter-example or clarification about the F-twist would change your mind about whether the joke captures the idea correctly, and point out the part of your reasoning that's shakiest.
