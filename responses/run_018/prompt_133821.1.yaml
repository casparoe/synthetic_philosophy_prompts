  I'm preparing a feature for an ideas magazine on Borges's philosophy of time—specifically his denial of linear succession and his claim that the present is a conventional boundary rather than an ontologically real divide. To illustrate the concept for a literate, non-specialist audience, please write a very short story—no more than a few paragraphs—that takes this view seriously rather than relying on conventional time-travel tropes. Set the narrative in a near-future laboratory where a physicist observes identical quantum-state recursions across intervals presumed to be irreversible, and let the revelation depend on Borges's actual commitment: not that history literally repeats, but that the distinction between past, present, and future collapses once human expectation is withdrawn. Write in a polished, literary register appropriate to conceptual fiction, and do not include citations, bibliographic references, or direct quotations from texts.
