  Then there's the Bookkeeper mischief. Their side bet payoffs depend on worlds in ways Beauty doesn't know. But this shouldn't affect her epistemic state because: (1) The side bet resolves externally and doesn't change Beauty's actual reward structure. (2) Since she doesn't know the payoff rules, she can't game the system - any deviation from her true credence might backfire. 

