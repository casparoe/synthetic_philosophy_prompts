answer: |-
  Promissory obligations bind primarily through the promisor's performative act establishing practical authority over their future self, generating a normative fact analogous to institutional facts constituted by collective acceptance; this self-authority requires sustained direct epistemic access to the original commitment for its binding force. The promise functions as a self-directed constitutive rule, creating an internal obligation for the promisor, not merely an external claim based on the promisee's reliance or expectation. Crucially, this self-binding authority is actively sustained only while the promisor retains the capacity for direct, internal recall of the commitment event – the lived memory of the promise-making act itself constitutes the ground of obligation. External digital archiving, therefore, dilutes this binding force by displacing the necessity for internal recall; reliance on an external record transforms the obligation into a delegated residue, governed by the archive's accessibility and interpretation rather than the original performative act. The promisor becomes accountable *to the record*, not to the inherent authority of their own past commitment, resulting in a fragmented, less genuine duty sustained by proxy rather than direct self-relation.
