answer: |-
  Right, I see what you're driving at with this weather committee. A clever bit of stage-setting, I must say! But I don't think it quite disposes of the peculiar tension in the *first-person, present-tense* case as I originally framed it.

  Your repeater chap isn't actually *asserting* that it is raining. Not in the full-blooded sense I have in mind. He’s merely *reporting* what others assert. He says, effectively, "They claim it is raining, though I myself have no view on the matter." That’s perfectly coherent because he isn’t committing himself to the truth of the proposition "It is raining" at all. He’s only committing himself to the truth of "They say it is raining" and "I don’t believe it is raining." There’s no clash there. The absurdity only bites when it’s *one and the same speaker*, in the *very same breath* as it were, who both *puts forward* "It is raining" as a fact – which, in ordinary circumstances, implies *he takes it to be so* – and then immediately *disavows* taking it to be so by saying "I don't believe it." It’s the practical act of asserting P while simultaneously denying that you hold P that creates this peculiar, jarring effect. It’s not about belief being a hidden picture, nor mere lip-movement; it’s about what asserting *means* in common life. When I assert P, I imply, quite ordinarily, that I accept P as true. To add "but I don't accept it" flatly contradicts that ordinary implication. Your committee separates the *source* of the assertion from the *relayer*, which sidesteps that specific implication entirely. It shows the problem is deeply bound up with the *unity* of the speaker in the act of assertion.
