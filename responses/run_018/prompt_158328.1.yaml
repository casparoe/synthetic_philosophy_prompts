answer: |-
  ### Reconstruction of the Argument
  Leibniz begins with the observation that "nothingness" (non-being) appears metaphysically simpler than "something" (being/existence) because it requires no constituents, properties, or differentiation. Nothingness is pure absence. However, he invokes the Principle of Sufficient Reason (PSR), which demands that every actual fact must have a sufficient ground or explanation. If nothingness were actual, we would still need a sufficient reason *why* nothingness obtains rather than something. But nothingness, by its very nature, contains no internal grounds or differentiating features that could explain its own actuality. It is "inexplicable" because it offers nothing to justify why it exists (as the state of affairs) instead of something. Since the PSR must be satisfied, nothingness cannot be the actual state of affairs. Therefore, something must exist—and specifically, an ordered world grounded in a necessary being (God) that provides the sufficient reason for existence itself. Existence isn't an arbitrary preference; it is necessitated by the demand for universal intelligibility under the PSR.

  ### The Principle of Sufficient Reason and Its Symmetry
  Leibniz applies the PSR *symmetrically* to both being and non-being: **any actual state of affairs**, whether it is "something exists" or "nothing exists," requires a sufficient reason. The asymmetry enters not in the *application* of the PSR, but in the *capacity* of being and non-being to satisfy it. Non-being ("nothing") is characterized by absolute simplicity and absence of differentiation. Precisely because it has no properties, no internal structure, and no distinctions, it **cannot contain or provide a sufficient reason** for its own actuality. It fails the PSR inherently. Being ("something"), however, *can* potentially contain reasons—especially if it includes a necessary being whose existence is self-explanatory (God). Thus, the asymmetry lies in the ontological poverty of nothingness: the PSR applies equally to both states, but only being *can* meet its demand. The "burden of proof" is identical for both, but nothingness collapses under it.

  ### The Programming Analogy Assessed
  The analogy between nothingness and an uninitialized variable (or null pointer) captures **part** of Leibniz's move but risks a significant category error. Like an uninitialized variable, Leibnizian nothingness is indeed an "undefined" state lacking positive determination. The PSR acts like a runtime check that forces initialization (existence) because null/nothing cannot satisfy the demand for a defined value (sufficient reason). However, the analogy obscures the core metaphysical point: Leibniz’s nothingness is **absolute non-being**, not an undefined *state within a system*. An uninitialized variable exists within an existing computational framework (memory, runtime), making it a *type of being* (an indeterminate entity) rather than true nothingness. Leibniz’s argument hinges on the impossibility of absolute absence ever satisfying the PSR due to its utter lack of explanatory resources. The programming analogy usefully illustrates the instability leading to initialization, but misrepresents nothingness by placing it within a container of pre-existing existence (the program), which Leibniz’s argument explicitly denies.
