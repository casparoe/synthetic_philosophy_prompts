  ### Decision Tree for Evaluating Model Assumptions: Philosopher of Science's Report  
  *Constructed via iterative refinement using test cases (a, b, c). Revisions noted in Section 2.*

  ---

  #### **1. Diagnostic Questions & Logical Space**  
  Five binary questions define a 32-combination grid. Positions are mapped to combinations below.  
  **Key distinctions:**  
  - **Assumption kind** (captured via Q1–Q2):  
    - *Deformation*: Distorts real factor (e.g., set friction to zero).  
    - *Substitution*: Replaces real mechanism (e.g., representative agent).  
    - *Invention*: Adds unreal element (e.g., infinite population).  
  - **Q3 (Make-it-true test)**: Applied *after* confirming assumption is load-bearing (Q4) and has a real counterpart (Q1–Q2), as it requires meaningful replacement.  
  - **Q5 (Direction of error)**: Signed error supports bounds/robustness claims.  
  - **Q6 (De-idealization ladder)**: Exists if literature shows convergence as idealization relaxes.  

  | Question                                                                 | Answer Space |  
  |--------------------------------------------------------------------------|--------------|  
  | **Q1:** Does the false assumption have a real-world counterpart?         | Yes / No     |  
  | **Q2:** If yes, is it a distortion (not a replacement) of that counterpart? | Yes / No     |  
  | **Q3:** If replaced with truth, does the central conclusion collapse?    | Yes / No     |  
  | **Q4:** Is the assumption load-bearing for the central conclusion?       | Yes / No     |  
  | **Q5:** Is the direction of error known (e.g., over/underestimate)?      | Yes / No     |  
  | **Q6:** Does a de-idealization ladder exist?                             | Yes / No     |  

  **Position grid** (Y=Yes, N=No, -- = Irrelevant/Inapplicable):  
  | Position            | Q1 | Q2 | Q3 | Q4 | Q5 | Q6 | Occupied? | Why Unoccupied? |  
  |---------------------|----|----|----|----|----|----|-----------|-----------------|  
  | Instrumentalist     | -- | -- | -- | -- | -- | -- | Y         | --              |  
  | Galilean            | Y  | Y  | N  | Y  | Y  | -- | Y         | --              |  
  | Minimalist          | Y  | Y  | -- | N  | -- | -- | Y         | --              |  
  | Minimalist (alt)    | N  | -- | -- | N  | -- | -- | Y         | --              |  
  | Fictionalist (real) | N  | -- | -- | Y  | -- | -- | Y         | --              |  
  | Fictionalist (gen)  | N  | -- | -- | Y  | -- | -- | Y         | --              |  
  | Robustness          | -- | -- | -- | -- | -- | Y  | Y         | --              |  
  | Convergentist       | Y  | Y  | N  | Y  | N  | Y  | Y         | --              |  
  | Accusatory          | Y  | -- | Y  | Y  | -- | -- | Y         | --              |  
  | (Unoccupied 1)      | Y  | Y  | N  | Y  | Y  | N  | N         | Unattractive: Known error direction + no ladder undermines Galilean claim. |  
  | (Unoccupied 2)      | N  | -- | Y  | Y  | -- | -- | N         | Incoherent: Can’t test replacement for inventions (no counterpart). |  
  | *Other combinations* |    |    |    |    |    |    | N         | Redundant or unstable. |  

  **Notes:**  
  - **Fictionalist** appears twice (real-system/general-target variants) but shares the same commitment.  
  - **Minimalist** appears twice (deformation/substitution; load-bearing/non-load-bearing) but shares the same commitment.  
  - **Tree cannot separate:** Galilean vs. Convergentist when Q6=Yes and Q5=No (rare; resolved by Q5 priority).  

  ---

  #### **2. Decision Tree**  
  *8 nodes, 8 leaves. Paths map to grid positions.*  
  ```mermaid
  graph TD
      A[Q1: Predictive focus? Paper judges model by prediction accuracy?] 
      -->|Yes| A1[Leaf 1: Instrumentalist]
      -->|No| B[Q2: Real-world target? Explains specific system e.g., 'US housing market'?]

      B -->|Yes| C[Q3: Distortion? Assumption distorts real feature e.g., sets cost to zero?]
      C -->|Yes| D[Q4: Load-bearing? Critical for conclusion?]
      D -->|No| D1[Leaf 2: Minimalist]
      D -->|Yes| E[Q5: Collapse if true? Replaced, conclusion fails?]
      E -->|Yes| E1[Leaf 3: Accusatory]
      E -->|No| F[Q6: Known error? e.g., always overestimates?]
      F -->|Yes| F1[Leaf 4: Galilean]
      F -->|No| F2[Leaf 5: Convergentist]

      C -->|No| G[Q7: Real counterpart? e.g., representative agent has real basis?]
      G -->|No| G1[Leaf 6: Fictionalist]
      G -->|Yes| E[Q5: Collapse if true?]

      B -->|No| H[Q8: Multiple models? Shared result across different assumptions?]
      H -->|Yes| H1[Leaf 7: Robustness]
      H -->|No| I[Q9: Invention? Adds unreal element e.g., infinite agents?]
      I -->|Yes| I1[Leaf 6: Fictionalist]
      I -->|No| I2[Leaf 2: Minimalist]
  ```

  **Leaves & Awkward Commitments:**  
  1. **Instrumentalist**: Truth of assumptions is irrelevant; only prediction matters.  
     → *Awkward: A wrong mechanism with good predictions is acceptable.*  
  2. **Minimalist**: Assumption is a placeholder; conclusion doesn’t depend on it.  
     → *Awkward: No claim about how reality works, only tractability.*  
  3. **Accusatory**: Conclusion relies on false assumption; likely artifactual.  
     → *Awkward: The paper’s result may vanish in reality.*  
  4. **Galilean**: Isolates a real mechanism by removing noise.  
     → *Awkward: Quantitative estimates may be unreliable; only qualitative claims supported.*  
  5. **Convergentist**: Current model is a step toward truth; de-idealize to improve.  
     → *Awkward: Admits the model is inadequate as-is.*  
  6. **Fictionalist**: Shows possibility; not intended to be realistic.  
     → *Awkward: No evidence the mechanism exists in reality.*  
  7. **Robustness**: Result is credible because it survives across incompatible models.  
     → *Awkward: No single model’s assumptions are defended.*  

  ---

  #### **3. Test Cases & Revisions**  
  **Case (a): Segregation model (Schelling-style)**  
  - **Path**:  
    Q1 (Predictive?) = No → Q2 (Real-world?) = Yes (residential segregation) → Q3 (Distortion?) = Yes (grid/neighbors deform real geography) → Q4 (Load-bearing?) = Yes (segregation requires rule) → Q5 (Collapse if true?) = No (segregation persists in richer models) → Q6 (Known error?) = No (bias direction unclear) → **Leaf 5: Convergentist**.  
  - **Verdict**: Correct. Students might expect Galilean, but error direction is unknown, and de-idealization (e.g., adding income) is needed.  

  **Case (b): Population genetics (Hardy-Weinberg)**  
  - **Path**:  
    Q1 = No → Q2 = No (general baseline, not specific system) → Q8 (Multiple models?) = No (unique result under ideal assumptions) → Q9 (Invention?) = Yes (infinite population) → **Leaf 6: Fictionalist**.  
  - **Verdict**: Correct. Model is a "credible world" baseline; not directly about reality.  

  **Case (c): Housing market policy model**  
  - **Path**:  
    Q1 = No (not prediction-focused) → Q2 = Yes (specific housing market) → Q3 = Yes (frictionless adjustment deforms reality) → Q4 = Yes (quantitative estimate requires it) → Q5 (Collapse if true?) = **Yes** (with frictions, supply-reduction magnitude changes; central *quantitative* claim collapses) → **Leaf 3: Accusatory**.  
  - **Revision & Why**: Initially landed on Galilean (if Q5=No for *qualitative* claim), but deflating verdict needed. Revised Q5 to specify: *"conclusion" = paper’s headline claim (here, the number)*. Students must interpret "collapse" strictly for policy-facing numbers.  

  ---

  #### **4. What the Tree Cannot Do**  
  - **Single assumption, multiple roles**: E.g., infinite population as both deformation (of large N) and invention (of continuity). Tree handles one role per run.  
  - **Target is another model’s idealization**: E.g., "rational agent" as output of evolutionary model. Tree’s Q2 (real-world target?) fails; assumes models target reality directly.  
  - **Policy recommendations with asymmetric costs**: E.g., underestimating vaccine efficacy risks lives. Tree ignores error-cost asymmetry; burden of proof not shifted.  
  - **Multi-assumption interactions**: Only one key assumption evaluated.  

  ---

  ### **Student-Facing Half-Page Tool**  
  **Decision Tree for Model Evaluation**  
  *Answer for the paper’s most questionable assumption. 20-min limit. PDF-friendly.*  

  1. **Predictive Focus?**  
     Does the paper judge the model by how well it predicts real data?  
     - **Yes → Instrumentalist**: The model is a tool. If predictions work, assumption truth doesn’t matter.  
     - **No → Go to 2**.  

  2. **Real-World Target?**  
     Is the model about a *specific* real system (e.g., "Chicago housing market")?  
     - **Yes → Go to 3**.  
     - **No → Go to 7**.  

  3. **Distortion?**  
     Does the assumption twist a real thing (e.g., set real costs to zero)?  
     - **Yes → Go to 4**.  
     - **No → Go to 6**.  

  4. **Load-Bearing?**  
     Is the assumption critical to the paper’s main finding?  
     - **Yes → Go to 5**.  
     - **No → Minimalist**: The assumption is harmless; conclusion doesn’t depend on it.  

  5. **Collapse If True?**  
     If replaced with a realistic version, does the main finding fall apart?  
     - **Yes → Accusatory**: The finding likely depends on the false assumption.  
     - **No → Go to 8**.  

  6. **Real Counterpart?**  
     Does the assumption have any basis in reality (e.g., "firms" stand for real firms)?  
     - **Yes → Go to 5**.  
     - **No → Fictionalist**: The model shows a possibility, not reality.  

  7. **Multiple Models?**  
     Does the paper/citations show the same result under different assumptions?  
     - **Yes → Robustness**: The shared result matters, not this model’s details.  
     - **No → Go to 9**.  

  8. **Known Error?**  
     Can you tell if the assumption biases results (e.g., always too high)?  
     - **Yes → Galilean**: The model isolates a real effect. *Use cautiously for numbers!*  
     - **No → Convergentist**: The model is a step toward truth; improve it by adding realism.  

  9. **Invention?**  
     Does the assumption add something unreal (e.g., infinitely many agents)?  
     - **Yes → Fictionalist** (as above).  
     - **No → Minimalist** (as above).  

  **Run it → Get leaf → Check the "Awkward Commitment" to pressure-test.**
