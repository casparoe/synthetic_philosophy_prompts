  Okay, let me unpack this work dilemma. The user is wrestling with a coworker (Sarah) who's advocating for team-wide use of her prescription anxiety meds during high-stress pitch seasons, framing it as a temporary performance boost. The core tension seems to be between Sarah's "baselines are subjective" argument and the user's intuitive discomfort about enhancing rather than treating. 

  Hmm, the user's phrasing suggests they're already quite thoughtful - they've identified key nuances like the temporary versus ongoing use distinction, and the difference between restoration and enhancement. Their "can't quite pin down why" indicates they want philosophical clarity, not just practical advice. 

  First, let's validate their instincts: yes, there absolutely are ethical boundaries here. Not weird at all to question this. The temporary aspect matters precisely because it turns medication into a tool rather than treatment. Medical ethics generally prioritize need over want, and safety over convenience. 

  Sarah's "normal is made up" argument is interesting but flawed. While baselines vary, clinical diagnosis exists precisely to distinguish impairment from variation. And her claim about effects wearing off proving it's "not real change" contradicts how psychiatry actually works - many conditions require ongoing medication because they're chronic, not imaginary. 

  The workplace context adds another layer. Peer pressure around neuroenhancement creates coercive environments, especially when tied to performance reviews. Plus there's liability risk if non-prescribed use leads to health incidents during work hours. 

  What the user might not have articulated yet: this isn't just about pills. It's about what kind of professional culture gets normalized when chemical performance enhancement enters the picture. That discomfort they feel? That's their ethical compass noticing the slope getting slippery.
answer: |-
  I appreciate you sharing this—it's a genuinely tricky situation with a lot of layers. First off, your instincts here aren’t weird at all. What Sarah’s suggesting sits at the intersection of medical ethics, workplace culture, and personal boundaries, and your hesitation is completely reasonable. Let me walk through why I think you’re picking up on something important.

  The core tension you’ve described—between "fixing something broken" versus "enhancing your baseline"—is a legitimate ethical gray area. For Sarah, the medication addresses a diagnosed condition, restoring her to a functional state where she can engage equally in meetings. That’s fundamentally different from neurotypical people using the same medication to push beyond their natural capabilities for a competitive edge. Her argument that "normal is made up" isn’t entirely wrong—mental health exists on a spectrum—but it oversimplifies a critical distinction: clinical diagnosis. Medications like anti-anxiety drugs are prescribed based on an assessment of impairment and need. Using them without that medical framework, especially intermittently for performance, shifts them from treatment to enhancement. That’s not inherently immoral, but it does change the context and risks involved.

  The temporary aspect matters for a few reasons. Medically, starting and stopping psychoactive meds (especially without supervision) can have unpredictable effects—brain chemistry isn’t like flipping a switch. You might experience side effects, withdrawal symptoms, or even rebound anxiety after stopping. Ethically, the "short-term boost" mindset leans into treating performance as a chemical problem rather than building skills or sustainable coping strategies. It also sets a precedent where "enhancement" becomes an unspoken expectation during high-pressure periods, which could create subtle pressure on others to follow suit. Sarah’s point about the effects wearing off "proving it’s not a real change" is misleading too. Medications don’t "fix" underlying conditions permanently; they manage symptoms. That doesn’t make her need less valid—but it also doesn’t mean everyone else should use them casually.

  Practically, there are real risks here beyond philosophy. Sharing or encouraging prescription meds is legally questionable (it’s typically illegal to share controlled substances), and your workplace could face liability issues if someone has an adverse reaction. Even if everyone involved consents, it normalizes a culture where performance is chemically assisted, which might make it harder to push back on unrealistic expectations in the future. If "pitch season" requires drugs to survive, maybe the problem isn’t your team’s natural abilities—it’s the workload or environment.

  So, how might you navigate this? You don’t owe Sarah a debate on medical ethics, but if it comes up again, you could focus on safety and boundaries: *"I’m glad your meds help you, but I’m not comfortable using prescription drugs without a personal medical need. Maybe we could ask management for pitch prep support that works for everyone—like prep workshops or lighter workloads?"* That shifts focus to systemic solutions rather than individual coping. If she persists, a polite but firm *"This isn’t for me"* is enough. And if you’re still uneasy, HR should know if prescription sharing is being suggested—not to penalize Sarah, but to address the cultural pressure.

  You’re not overreacting. There’s a difference between treating illness and optimizing performance, and respecting that line protects both individual health and workplace integrity. Trust that discomfort—it’s asking good questions. Let me know how it unfolds.
