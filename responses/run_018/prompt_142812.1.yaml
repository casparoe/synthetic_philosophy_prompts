  Hmm, this is clearly a politically charged scenario. The lawyer character is weaponizing a noble-sounding slogan to maintain colonial power structures. The user wants nuance, not activism—they're crafting a character, not seeking my personal opinion. Smart request.

  First, I should map the slogan's possible meanings systematically. The "belong to" part is deliberately ambiguous—it could imply legal ownership (factually false for Benin Bronzes), moral guardianship (debatable), or open access (irrelevant to ownership). The "all humanity" framing invokes universalism, which critics see as erasing specific victimized cultures. 

  For legal ownership: Institutions like the British Museum claim statutory restrictions prevent deaccessioning, but that's a procedural shield, not moral justification. Legally, they hold possession but lack clean title—the Bronzes were looted. This argument is weak but procedurally effective.

  Moral entitlement is the lawyer's stronger card—the "stewardship" narrative. But museum ethics have shifted: UNESCO 1970 is now the benchmark, and the Benin Dialogue Group's practical compromises (loans, partnerships) undermine the absolutist "humanity" claim. Still, some scholars like Appiah defend cosmopolitanism, though most restitution experts reject it as neo-colonial.

  Practical access arguments are neutral but irrelevant—digital access or loans don't require denying ownership. The lawyer might use this as a distraction.

