  On consensus: Restitution is now mainstream (France's Sarr-Savoy report, Germany/Nigeria deals), but UK law hasn't budged. The "universal museum" model is in retreat except in entrenched institutions. The character's stance is professionally outdated but legally convenient—perfect for a cynical lawyer.

