  ### Structured Activity: Cosmic Census Coordination Challenge
  I'll design a 90-minute experiential activity to induce the doomsday argument through observer-moment reasoning and reference-class uncertainty. The core tension pits individual birth-rank reasoning against group coordination, creating psychological friction that mirrors real doomsday argument debates.

  **Psychological Dynamics in Group Settings:**
  - **Initial egocentric bias**: Participants instinctively anchor to their own "default" reference class (e.g., biological human), underestimating how class shifts alter predictions.
  - **Rank revelation shock**: Seeing a low birth rank triggers an intuitive "I'm early = long future" heuristic, but high ranks induce discomfort.
  - **Information cascade risks**: Early speakers in coordination rounds sway the group toward extreme timelines, especially when classes conflict.
  - **Motivated class-shifting**: When partial data leaks, participants emotionally resist classes where their rank implies catastrophe (e.g., a "digital observer" with rank 999/1000 might deny their class assignment).
  - **Token-stake amplification**: Small rewards exacerbate loss aversion, making probabilistic trade-offs viscerally felt when resisting indifference principles.

  ---

  ### Activity Design: Rules, Materials, and Timeline  
  *Total: 75 minutes (activity) + 15 minutes (debrief)*

  **Materials:**
  - **Sealed envelopes** (14): Each contains:
    - **Cosmic census card** with hidden data:
      - *Reference class*: Randomly assigned proportions:  
        - 10 × Biological Humans (Earth)  
        - 3 × Digital Observers (post-human)  
        - 1 × Simulation Instance (archival run)  
      - *Birth rank*: Uniformly random within class. True class sizes (unknown to participants):  
        - Biological: 200 billion  
        - Digital: 1 trillion  
        - Simulation: 10^20  
      - *Unique ID*: For tracking bets (e.g., "B-73", "D-5", "S-8812").
  - **Prediction boards**: Three physical boards labeled:  
    - "Pessimistic" (total observers ≤ 500 billion)  
    - "Neutral" (500 billion – 5 trillion)  
    - "Optimistic" (≥5 trillion)  
  - **Tokens**: 30 poker chips per participant (worth $0.10 in coffee/prizes).

  **Rules Overview:**
  - Participants know classes exist but not which they’re in or class sizes.
  - Payoffs reward accurate aggregate predictions and calibrated personal bets.
  - Doomsday tension:  
    - Treating oneself as random from *all observers* pushes consensus to "Pessimistic" (small implied future).  
    - Treating oneself as random from a *subclass* (e.g., "I'm probably digital!") pushes to "Optimistic".

  ---

  ### Rounds (60 minutes)

  **Round 1: Baseline Coordination (15 min)**  
  - *Goal*: Group consensus on future observers without personal data.  
  - *Mechanics*:  
    - Envelopes remain sealed.  
    - Group discusses and votes on a shared prediction (Pessimistic/Neutral/Optimistic).  
    - **Stakes**: If correct, all get 5 tokens. If wrong, lose 2 tokens.  
  - *Induced dynamic*: Groups default to "Neutral" or "Optimistic" via prior cultural biases (e.g., "AI will make trillions of minds!").

  **Round 2: Rank-Based Betting (20 min)**  
  - *Goal*: Force personal birth-rank reasoning.  
  - *Mechanics*:  
    - Participants open envelopes to reveal *only birth rank* (e.g., "73") but not class.  
    - Each places 10 tokens on prediction boards based on where their rank implies total observers:  
      - Low rank (e.g., 1–100) → "Optimistic" (early = long future)  
      - High rank (e.g., >1 billion) → "Pessimistic" (late = doom soon)  
    - Bets are anonymous (use ID on token bags).  
    - **Stakes**: Tokens on correct board triple; wrong boards lose all.  
  - *Induced dynamic*: Low-rank participants bet "Optimistic", high-rank reluctantly bet "Pessimistic". Creates visible board imbalance toward "Pessimistic" (if ranks are random).

  **Round 3: Class Revelation & Adjustment (25 min)**  
  - *Goal*: Conflict between class-based indifference and group evidence.  
  - *Mechanics*:  
    - Participants open full envelope, learning class and seeing others’ classes.  
    - Facilitator leaks: "Biological Humans are 70% of this room."  
    - Groups re-coordinate on consensus prediction (boards reset).  
    - Each may rebet tokens, but must move ≥5 tokens.  
    - **Stakes**: Consensus payoff same as Round 1. Personal bets: Tokens on correct board quadruple.  
  - *Induced dynamic*:  
    - Biologicals (majority) resist doomsday by downplaying class size ("We're special!").  
    - Digital/Simulation players shift to "Optimistic" (large-class escape).  
    - Group consensus often fractures as biologicals veto "Pessimistic".

  ---

  ### Debrief (15 min)
  Map rounds to doomsday logic, highlighting inferential tensions:

  | **Round** | **Doomsday Argument Step** | **Where Resistance Occurs** | **Cost of Resistance** |
  |-----------|----------------------------|----------------------------|------------------------|
  | **1** | Prior without indexical info | Assuming default reference class (biological) | Group pays token penalty for over-optimism |
  | **2** | Indifference principle: Treat birth rank as random sample from total observers | High-rank players deny randomness ("I'm not *typical*!") | Personal token loss; forces acceptance of Copernican principle |
  | **3** | Reference-class shift with evidence | Biologicals reject class size implications ("Rooms aren't random samples!") | Suboptimal bets; group miscoordination on consensus |

  **Key Verbal Clarifications:**
  - **Approximation limitation**: The activity equates "birth rank" with "observer-moment," but real doomsday arguments use *temporal location* in observer-moments. Verbally emphasize: "Your ‘rank’ here proxies your position in a timeline of conscious experiences."
  - **Unreproducible element**: The game cannot simulate *causal futility* (e.g., betting can’t change the doom timeline). Note: "In reality, shifting reference classes doesn’t alter your temporal location—only your beliefs."

  **Predictable Failures & Fixes:**
  - **Failure**: Round 2 token bets cluster in "Neutral" due to risk aversion.  
    - *Fix*: Pre-round demo: "A rank of 500 billion in a random class implies median total of 1 trillion—bet Pessimistic!"  
  - **Failure**: Biologicals in Round 3 dominate consensus, ignoring minorities.  
    - *Fix*: Assign "veto chips"—each digital/simulation player can override one biological vote.  
  - **Failure**: Participants confuse ranks across classes (e.g., "Rank 100 is high for biologicals but low for digitals!").  
    - *Fix*: Use normalized rank cards (e.g., "Percentile: 0.003%") instead of raw numbers.

  **Why This Works**: The envelope reveal creates Bayesian shock ("I might be in the doomed class!"), token stakes make probabilistic trade-offs urgent, and the group setting mirrors real-world polarization over existential risks. By the debrief, participants will have *felt* the doomsday argument’s pull—and its fault lines—before naming it.
