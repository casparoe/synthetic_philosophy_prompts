  ### **Classroom Activity: Conditional Betting Challenge**  
  **Goal:** Experience the conflict between Ramsey pricing and probability laws for conditionals.  
  **Materials:** 1 six-sided die, poker chips (50 per team), index cards for prices, whiteboard.  
  **Teams:** Two teams of 9.  

  ---

  ### **Rules Summary**  
  1. **Setup (10 min):**  
     - Propositions:  
       - **A**: Die roll = 1 or 2.  
       - **C**: Die roll = 2 or 3.  
       - **Conditional bet**: "If A, then C" (pays 6 chips if true).  
     - **Ramsey pricing rule**: To price "if X, then Y", suppose X is true → set price as confidence in Y.  
     - Teams post initial price for "if A, then C" on index card (must use Ramsey: **3 chips**, since P(C|A) = 1/2).  

  2. **First Trade (10 min):**  
     - Teams swap bets: Each buys **one** bet from the other at their posted price (e.g., Team A pays Team B 3 chips for Team B’s bet).  

  3. **The Split (20 min):**  
     - **Opposing team picks a partition event B** (e.g., B = "roll is even"). Rules:  
       - B must have ≥1 outcome where A & B occur, and ≥1 where A & ¬B occur (house certifies).  
     - **Holding team computes split price**:  
       - Price under B: Apply Ramsey *assuming B is true* → P(C|A, B).  
       - Price under ¬B: Apply Ramsey *assuming ¬B is true* → P(C|A, ¬B).  
       - Split price = [P(B) × price under B] + [P(¬B) × price under ¬B] (use objective die P(B)).  
     - **House buys back original bet at split price** (e.g., if split price = 2 chips, team loses 1 chip).  
     - *Example splits*:  
       - B = C → split price = 1/3 (loss).  
       - B = even → split price = 1/2 (no loss).  

  4. **Revision & Second Round (15 min):**  
     - Teams may revise their posted price for "if A, then C".  
     - **Cost**: 1 chip fee to house per revision + must trade again (buy one bet at new price).  
     - Repeat **Split** (opposing team picks new B).  

  5. **Exit Auction (15 min):**  
     - Teams secretly choose an "exit" (which assumption to drop):  
       - **1**: Ramsey test for conditionals.  
       - **2**: Conditionals are ordinary bettable propositions.  
       - **3**: Ramsey test under supposition (for nested conditionals).  
       - **4**: Price coherence/total probability.  
     - **House offers nested bet**: "If A, then if B, then C" (pays 6 chips).  
     - Teams set prices *only if* their exit allows:  
       - Exit 1: Can price without Ramsey (e.g., truth-functional).  
       - Exit 2: Refuse all unconditional bets on conditionals.  
       - Exit 3: Refuse to apply Ramsey *under B* (no nested pricing).  
       - Exit 4: Refuse splits (ignore total probability).  
     - **Final trades**: Teams trade with house; opposing team tries to force arbitrage.  

  ---

  ### **Debrief (5 min)**  
  - **Roll die** → resolve any outstanding bets (if time).  
  - **Reveal**: "Lewis’s triviality" shows four assumptions clash:  
    - *(Point to whiteboard)* **Conflict today**: Ramsey pricing (A→C = 1/2) vs. total probability (split on C → 1/3).  
    - **Exits = escape hatches**:  
      1. Reject Ramsey (e.g., truth-functional pricing).  
      2. Conditionals aren’t ordinary propositions (can’t bet on them unconditionally).  
      3. Ramsey fails under supposition (can’t nest conditionals).  
      4. Reject probability laws (e.g., total probability).  
  - **Key insight**: All exits cost something (e.g., Exit 2 limits what you can bet on).  

  ---

  ### **Predictable Problems & Fixes**  
  - **Truth-functional teams**: Let them post 5 chips (P(¬A ∨ C) = 5/6). They avoid loss in splits (Exit 1), but debrief shows this abandons Ramsey.  
  - **Split confusion**: Pre-calculate examples (B = even vs. B = C) on whiteboard. Emphasize: Only splits with *A-sensitive* B (where P(C|A, B) ≠ P(C|A, ¬B)) bite.  
  - **Time crunch**: Skip die resolution; focus on arbitrage in splits.  
  - **What the game can’t show**: Generalization to *all* correlated pairs → assert Lewis’s proof: Assumptions force *all* A,C to be independent.  

  **Timeline**:  
  - 0–10 min: Setup + initial price/trade.  
  - 10–30 min: First split (loss/gain visible).  
  - 30–45 min: Revision + second split.  
  - 45–60 min: Exit auction + nested bets.  
  - 60–75 min: Debrief + Lewis reveal.  

  **Outcome**: Teams see Ramsey + coherence forces independence; exits have trade-offs.
