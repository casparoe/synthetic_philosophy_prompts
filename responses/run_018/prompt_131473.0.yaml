answer: |-
  Below is a decision tree taxonomy designed to reveal commitments in the **root case**: *A decision-maker must either destroy a unique, irreplaceable work of communal cultural heritage (e.g., a sacred ancestral tapestry) or allow a preventable human death (e.g., refusing to burn the tapestry to extract life-saving medicine woven into its fibers). Both losses are stipulated to resist translation into any shared scale of value (e.g., neither can be fully measured in utility, rights-violations, or symbolic weight).*

  **Instructions**: Start at the root case, then answer each branching question based *only* on your intuitions about the case. Proceed down the tree until you reach a leaf node (a terminal position).

  ---

  ### **Decision Tree: Taxonomy of Commitments on Tragic Choice**
  *(Settled vs. Contested issues summarized after the tree)*

  **1. First Branch: Nature of Incommensurability**  
  *Question: "In this specific case, is it impossible—even in principle—for there to be a fact about which option is better overall? Or is there a fact, but we lack the capacity to access it?"*  
  - **Branch A: Ontological Incommensurability**  
    *Commitment: No fact of comparative value exists; the options are genuinely incomparable in principle.*  
  - **Branch B: Epistemic Incommensurability**  
    *Commitment: A fact of comparative value exists but is permanently inaccessible to human agents.*

  **2. Second Branch: Moral Residue**  
  *Question: "After choosing the 'least bad' option, does the decision-maker retain ongoing obligations (e.g., reparations to the community, ritual mourning, lifelong guilt) that cannot be resolved by the choice itself?"*  
  - **Branch A1/A2: Residue Present**  
    *Commitment: The unchosen loss generates lingering normative demands.*  
  - **Branch B1/B2: No Residue**  
    *Commitment: The choice cleanly resolves all obligations; the matter is closed.*

  **3. Third Branch: Rational Regret**  
  *Question: "After choosing, is it rationally appropriate (not just psychologically understandable) for the agent to believe the unchosen option was genuinely better—without retracting the choice as justified?"*  
  - **Branch X: Regret Appropriate**  
    *Commitment: Affirming the choice while judging the unchosen option as better is coherent.*  
  - **Branch Y: Regret Incoherent**  
    *Commitment: Judging the unchosen option better undermines the choice; only psychological regret is possible.*  
  - **Branch Z: Regret Understandable but Irrational**  
    *Commitment: Regret is natural but reflects epistemic/emotional limitations, not reason.*

  ---

  ### **Leaf Nodes (Resulting Positions)**
  *Each leaf names the position (if standard), provides a one-sentence description, and flags its "awkward commitment."*

  #### **ONTOLOGICAL INCOMMENSURABILITY PATH**  
  - **A1 → Residue Present**  
    - **A1X: Regret Appropriate → Strong Value Pluralism (e.g., Berlin, Williams)**  
      *Description: Choices between incommensurable values lack rational determinacy, residue obligates repair, and regret affirms the lost value's reality.*  
      **Awkward Commitment**: Must defend that rational action is possible *without* a fact about the better choice.  
    - **A1Y: Regret Incoherent → Unnamed**  
      *Description: Residue binds the agent to the unchosen value, but regret is irrational since no "better" option existed.*  
      **Awkward Commitment**: Explains why residue imposes duties *without* the regret implying a mistaken choice.  
      **Gap Diagnosis**: Logically tense; rarely defended. Residue typically assumes the unchosen option had *some* normative pull, conflicting with regret's incoherence.  
    - **A1Z: Regret Understandable → Ethical Fictionalism (e.g., some post-Nietzscheans)**  
      *Description: Residue reflects the human need to ritualize loss, but regret is non-rational as values are incomparable.*  
      **Awkward Commitment**: Demands serious engagement with residue (e.g., reparations) while denying regret's rationality.  

  - **A2 → No Residue**  
    - **A2X: Regret Appropriate → Unnamed**  
      *Description: No residue is owed, yet rationally judging the unchosen option as better is coherent.*  
      **Awkward Commitment**: Denies obligations from the unchosen loss while endorsing regret for it.  
      **Gap Diagnosis**: Logically unstable; if regret is rational, the unchosen option likely had normative weight, contradicting "no residue."  
    - **A2Y: Regret Incoherent → Radical Choice Existentialism (e.g., Sartre)**  
      *Description: Without facts to guide choice, the agent's commitment creates value ex nihilo; residue and regret dissolve.*  
      **Awkward Commitment**: Makes the *act of choosing* the sole source of justification.  
    - **A2Z: Regret Understandable → Stoic Pluralism**  
      *Description: Residue is irrational, but regret is a natural error in confronting incommensurability.*  
      **Awkward Commitment**: Requires dismissing communal demands for repair as misguided.  

  #### **EPISTEMIC INCOMMENSURABILITY PATH**  
  - **B1 → Residue Present**  
    - **B1X: Regret Appropriate → Threshold Deontology (e.g., Ross)**  
      *Description: A hidden fact exists, residue acknowledges the violation of a pro tanto duty, and regret tracks objective loss.*  
      **Awkward Commitment**: Accepts unresolved moral conflicts despite a fact of the matter.  
    - **B1Y: Regret Incoherent → Unnamed**  
      *Description: Residue binds the agent, but regret is irrational since the chosen option was factually better.*  
      **Awkward Commitment**: Demands ongoing atonement for the *objectively correct* choice.  
      **Gap Diagnosis**: Practically unattractive; little scholarly support for imposing residue *without* regret.  
    - **B1Z: Regret Understandable → Pragmatic Absolutism**  
      *Description: Residue satisfies emotional/communal needs, but regret is subjective; the choice was factually optimal.*  
      **Awkward Commitment**: Justifies symbolic reparations despite believing no objective debt exists.  

  - **B2 → No Residue**  
    - **B2X: Regret Appropriate → Unnamed**  
      *Description: No residue is owed, yet the unchosen option was factually better.*  
      **Awkward Commitment**: Denies obligations even when conceding the choice was suboptimal.  
      **Gap Diagnosis**: Logically incoherent; if the unchosen option was better, residue *should* follow.  
    - **B2Y: Regret Incoherent → Pragmatic Comparativism (e.g., Hare, rule-utilitarians)**  
      *Description: A common metric exists but is inaccessible; the "best" choice dissolves all obligations, and regret confuses uncertainty with error.*  
      **Awkward Commitment**: Demands total psychological closure despite catastrophic loss.  
    - **B2Z: Regret Understandable → Resolute Monism (e.g., Kantian constructivists)**  
      *Description: The choice was objectively correct, residue is unjustified, but regret is natural human fallibility.*  
      **Awkward Commitment**: Attributes communal grief over cultural loss to cognitive failure.  

  ---

  ### **Settled vs. Contested Issues in Value Theory**  
  **Broadly Settled**:  
  1. **Hard choices exist**: All parties agree some decisions involve irreconcilable losses.  
  2. **Regret is psychologically ubiquitous**: No position denies regret's empirical reality.  
  3. **No "consensus" solution**: No approach eliminates all moral costs in tragic dilemmas.  

  **Genuinely Contested Among Specialists**:  
  1. **Ontological vs. Epistemic**: Whether incommensurability reflects reality or cognitive limits remains unresolved.  
  2. **Moral Residue**: Whether residue *requires* ontological pluralism is hotly debated. Monists (e.g., consequentialists) argue residue can arise from secondary principles (e.g., sympathy); pluralists call this ad hoc.  
  3. **Rational Regret**: Key dispute is whether regret can be rational *without* implying the choice was wrong. Proponents (e.g., Williams) see it as honoring conflicting values; opponents (e.g., Parfit) deem it inconsistent.  
  4. **Gaps in the Tree**: Most unoccupied nodes (e.g., A2X, B1Y) reflect *logical tensions* (e.g., affirming regret while denying residue) or *practical unattractiveness* (e.g., demanding residue for the "correct" choice). None are unexplored due to oversight.  

  This tree isolates commitments while bracketing labels—e.g., a "pluralist" denying residue (A2) diverges sharply from standard pluralism (A1X). It thus serves as a diagnostic tool for auditing implicit premises in debates about tragic choice.
