prompt: |-
  Please explain the conceptual tension that arises for a Humean best-systems account of natural law when it tries to accommodate anti-Humean modal intuitions—specifically, that laws support counterfactuals in a way accidental generalisations do not—without appealing to primitive governing relations. In your explanation, deploy a hypothetical analytical device I shall call the 'counterfactual resilience gradient' (CRG): for any candidate regularity, the CRG measures the proportion of nearby possible worlds—defined as worlds that preserve the actual categorical bases but permute particular instances—in which the regularity continues to hold. Analyse whether adopting the CRG as a selection criterion among competing best systems genuinely preserves Humean ontological austerity, or whether quantifying over worlds with different categorical bases implicitly introduces the modal primitives the Humean sought to avoid. Additionally, assess whether the CRG provides a genuinely distinct resolution to the problem of accidental generalisations, or whether it merely re-describes the anti-Humean distinction between lawful and accidental patterns in purely epistemic terms. Be precise in distinguishing the ontological status of the gradient itself from its heuristic role in system selection. Please conclude with a single self-contained sentence summarising your central conclusion, placed on its own line at the very end.
