prompt: |-
  A colleague summed up the common prior idea like this: 'The classic agreement result shows that if two rational agents share the same prior and keep updating on each other's views, they must eventually converge on exactly the same beliefs—even about ethics or politics. So persistent moral disagreement just proves someone is being irrational or hiding a different prior; deep disagreement is impossible among genuinely rational people.' How fair is hte summary? Please go sentence by sentence: what's technically correct about the theorem, what's a misapplication to normative domains, and where does it smuggle in assumptions about common knowledge that aren't actually in the result? Also, does this genuinely rule out the kind of 'reasonable disagreement' philosophers talk about, or is that a separate issue altogether? Write your answer in British English, please—no need for bibliographies, just the conceptual audit.
reasoning: |-
  Okay, the user has asked about the common prior assumption and the agreement theorem, specifically critiquing a colleague's summary. They want me to go sentence by sentence, pointing out what's technically correct, where it misapplies to normative domains, and where it smuggles in assumptions about common knowledge. They also want to know if this rules out reasonable disagreement. And they requested British English.

  First, I need to recall the agreement theorem properly. The key points are that it requires rational agents with a common prior, common knowledge of their posteriors, and that they update via Bayes' theorem. The theorem shows they must agree if all these conditions hold. But the colleague's summary seems to overgeneralize this.

  Looking at the first part: "The classic agreement result shows that if two rational agents share the same prior and keep updating on each other's views, they must eventually converge on exactly the same beliefs—even about ethics or politics." This is mostly correct technically, but the "even about ethics or politics" part is a misapplication. The theorem works for empirical beliefs where evidence can be shared, but ethics involves fundamental differences in values or interpretations, which the theorem doesn't cover. Also, "keep updating" simplifies the need for common knowledge of posteriors, which is stricter than just repeated updating.

  Next, "So persistent moral disagreement just proves someone is being irrational or hiding a different prior; deep disagreement is impossible among genuinely rational people." This is problematic. It assumes rationality only means Bayesian updating, but in ethics, rationality might include different values or axioms. Also, it ignores that common priors might not exist in normative domains, where priors could be shaped by inherently different perspectives. The phrase "hiding a different prior" suggests deception, but the theorem assumes honesty in sharing beliefs. Moreover, "deep disagreement is impossible" overstates the case—reasonable disagreement exists when people have different but rational starting points or frameworks.

  The user mentioned "reasonable disagreement" in philosophy. This refers to disagreements where both parties are rational yet hold different views due to foundational differences. The agreement theorem doesn't address this because it assumes a shared prior and common knowledge, which aren't present in such cases. So reasonable disagreement is a separate issue.

  I should also note where the summary smuggles in common knowledge. The theorem requires common knowledge of the posteriors at each step, meaning everyone knows, knows that others know, and so on. The colleague's "keep updating" implies a process but doesn't capture this depth. Real-life updating is often imperfect, lacking this infinite regress of knowledge.

  The user's deeper need might be understanding if moral disagreements imply irrationality. They might be grappling with debates in ethics or politics where people can't agree, and want to know if rationality forces convergence. The answer is no—rational people can disagree due to different priors or values, especially in normative areas. Highlighting the limitations of the theorem in applying to ethics is crucial here.

  Finally, wrapping it up by affirming that reasonable disagreement is still possible, as philosophers discuss, because the theorem's strict conditions aren't met in real-world normative disputes. This addresses their last query directly.
answer: |-
  Here's a conceptual audit of your colleague's summary, sentence by sentence, in British English, addressing the technicalities, misapplications, smuggled assumptions, and the issue of reasonable disagreement:

  1.  **"The classic agreement result shows that if two rational agents share the same prior and keep updating on each other's views, they must eventually converge on exactly the same beliefs..."**
      *   **Technically Correct:** This captures the core of Aumann's Agreement Theorem (and similar results). It accurately states that *if* rational agents (defined as perfect Bayesian updaters) share a common prior probability distribution over states of the world, and *if* they achieve common knowledge of their posterior beliefs (i.e., their current degrees of belief) about a specific event after updating on all available information (including each other's beliefs), then those posterior beliefs *must* be identical. The convergence is immediate once common knowledge of posteriors is achieved under the theorem's strict conditions.
      *   **Smuggled Assumption:** The key smuggled assumption here is **common knowledge of the posteriors**. The phrase "keep updating on each other's views" significantly understates and misrepresents this requirement. Common knowledge means not just that each knows the other's belief, but that each knows the other knows, each knows the other knows they know, and so on, ad infinitum. This is an incredibly demanding condition rarely (if ever) achieved in practice, far beyond simple iterative updating. The theorem specifies this *condition*, not a *process* guaranteed to reach it. "Eventually converge" implies a process leading to the result, but the theorem *assumes* the condition is met and derives *immediate* agreement.

  2.  **"...even about ethics or politics."**
      *   **Misapplication to Normative Domains:** This is a critical overextension and misapplication. The agreement theorem is a formal result within **Bayesian epistemology**, dealing with updating degrees of belief about **empirical or factual propositions** under uncertainty (e.g., "What is the probability this coin is fair?" or "What is the probability inflation will be 5% next year?"). It assumes beliefs are representable as probabilities over a shared state space. Ethics and politics, however, are fundamentally **normative domains**. They involve:
          *   **Value Judgements:** Beliefs about what *ought* to be, not just what *is* (e.g., "Taxation should be progressive"). These aren't easily reducible to probabilistic beliefs about states of the world.
          *   **Fundamental Axioms/Principles:** Disagreements often stem from different foundational moral axioms (e.g., utility maximisation vs. deontological rights), different weightings of values (e.g., liberty vs. equality), or different interpretations of concepts (e.g., "justice", "fairness"). These are prior commitments shaping *how* evidence is interpreted, not beliefs *within* a shared probabilistic framework.
          *   **Interpretive Frames:** Evidence in ethics/politics (e.g., historical events, social statistics) is interpreted through deeply held normative lenses. The theorem assumes agents agree on the *meaning* and *probabilistic implications* of evidence, which is precisely what's contested in normative disputes.
      *   **Conclusion:** Applying the agreement theorem directly to ethics or politics ignores the qualitative difference between empirical beliefs updated via Bayes and deeply held normative convictions shaped by values and principles. Convergence on normative beliefs is *not* guaranteed by the theorem's conditions because those beliefs often don't fit the theorem's framework.

  3.  **"So persistent moral disagreement just proves someone is being irrational or hiding a different prior;"**
      *   **Technically Correct (in a narrow sense):** *If* one insists on forcing moral beliefs into the Bayesian framework and *if* one assumes the common prior and common knowledge conditions *must* hold in principle, then yes, persistent disagreement *within that model* implies either irrationality (failure to update correctly) or differing priors.
      *   **Misapplication & Overreach:**
          *   **Different Prior vs. Different Framework:** The phrase "hiding a different prior" trivialises the issue in normative domains. The problem isn't usually agents dishonestly concealing a prior they secretly share; it's that they operate with fundamentally **different conceptual frameworks or value systems** from the outset. Their "priors" aren't just different probability distributions over the *same* set of possibilities; they may be structuring the possibilities and interpreting evidence in radically different ways that the Bayesian model doesn't capture. Calling this "hiding a different prior" is misleading.
          *   **"Irrationality" Defined Too Narrowly:** Labelling persistent moral disagreement as proof of "irrationality" relies on an overly narrow definition of rationality as strict Bayesian updating within a shared model. Many philosophers argue that rationality in ethics involves coherent reasoning *within* one's value framework, sensitivity to reasons, consistency, etc., *without* requiring convergence with others holding different reasonable frameworks. Calling divergence "irrational" in this broader sense is unjustified and question-begging.
          *   **Ignoring the Framework Problem:** It dismisses the possibility that rational, honest agents can start from fundamentally different, irreconcilable normative starting points that aren't mere differences in prior probability within a common state space.

  4.  **"...deep disagreement is impossible among genuinely rational people."**
      *   **Overreach Based on Misapplication:** This conclusion directly follows from the previous misapplications and smuggled assumptions.
          *   **Common Knowledge Unattainable:** Genuine deep disagreement often persists precisely *because* the common knowledge requirement is practically unattainable, especially on complex normative matters. Communication is imperfect, trust isn't absolute, and the infinite regress of knowledge is impossible to establish.
          *   **Common Prior Unlikely for Normative Beliefs:** There's no compelling reason to assume rational agents *must* share a common prior over normative propositions. Rationality doesn't dictate *which* fundamental values or principles one must hold, only how one reasons *from* them.
          *   **Reasonable Disagreement Exists:** This claim directly contradicts the well-established philosophical concept of **reasonable disagreement** (or "rational disagreement"). Philosophers (e.g., Rawls on the "burdens of judgement", Raz, Waldron) argue that on complex matters involving value judgements, interpretation of evidence, and weighting of considerations, equally rational, sincere, and well-informed individuals can reach different conclusions. This disagreement stems from the **complexity of the issues, differing reasonable weightings, varying life experiences shaping perspectives, and the underdetermination of conclusions by evidence** – factors outside the scope of the agreement theorem, which assumes a shared, unambiguous framework for evidence. The agreement theorem does not rule this out; it operates in a different, highly idealised domain.

  **Summary & The "Reasonable Disagreement" Issue:**

  *   **Fairness of Summary:** The summary is **largely unfair and misleading**, primarily due to its misapplication to ethics/politics and its underestimation of the common knowledge requirement. It correctly states the *mathematical result* in the first part but then grossly overextends its implications.
  *   **Technical Core:** The theorem shows that *under extremely strict conditions* (common prior, common knowledge of posteriors, Bayesian rationality), agents *must* agree on the probability of a specific event. This is a profound result about the logic of belief updating under those idealisations.
  *   **Normative Misapplication:** It is invalid to directly apply this to moral or political disagreement. These involve differences in fundamental values, interpretive frameworks, and conceptions of the good that the Bayesian model of shared priors and evidence simply doesn't capture. Disagreement here doesn't necessarily imply irrationality or dishonesty.
  *   **Smuggled Assumption:** The critical smuggled assumption is the **requirement for common knowledge of the posteriors**, misrepresented by the casual phrase "keep updating on each other's views." Real-world updating rarely satisfies this.
  *   **Reasonable Disagreement:** The agreement theorem **does not genuinely rule out reasonable disagreement** as discussed by philosophers. Reasonable disagreement arises precisely in situations where the theorem's conditions *fail* to hold – particularly the lack of a genuinely shared prior framework for normative questions and the practical impossibility of achieving common knowledge on complex matters. Reasonable disagreement is about **rational divergence under conditions of complexity and differing reasonable perspectives**, which is a *separate issue* from the logical force of Bayesian updating under the theorem's idealised, shared-world assumptions. The theorem is silent on whether differing fundamental priors/frameworks themselves can be rational.
