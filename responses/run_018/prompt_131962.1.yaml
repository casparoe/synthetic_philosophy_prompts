  Finally, disconfirming the model. Since communities can reinterpret contradictions, what would break the model? Maybe a case where all three conditions are met, but the narrative remains a charter. Or a community that acknowledges contradictions but doesn't shift the narrative's function. The follow-up should press on irreparable contradictions that force collapse despite efforts to reinterpret.

