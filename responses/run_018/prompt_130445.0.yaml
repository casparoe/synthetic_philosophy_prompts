answer: |-
  Good morning. It’s a privilege to open this workshop, ‘Democracy Beyond Translation’, here in our civic heart. We gather an unusual constellation: political philosophers accustomed to wrestling with principles in the abstract, alongside local councillors grappling daily with concrete decisions, faith-group representatives embodying deep traditions, and postgraduate students bridging both worlds. This mix isn’t accidental; it’s essential for our subject: the fraught, vital space where public reason meets religious conviction in our political life.

  Today, I speak to you wearing two hats, inextricably woven. I speak as an academic who has studied the demanding frameworks of public justification – the call, articulated powerfully by certain influential thinkers, for citizens to translate their deepest commitments, especially religious ones, into a language accessible to all on supposedly neutral, secular ground. It’s an ideal of clarity and shared footing.

  But I also speak as my father’s daughter. My father was not a theorist. He was a town planner. He never published a paper. He left behind, however, stacks of handwritten notes, observations from decades of navigating the messy reality of building communities. Among them, he sketched an idea he tentatively called ‘reciprocal opacity’. It’s an idea I confess I initially dismissed as too quiet, too resigned, perhaps insufficiently rigorous. Recent events, and the weight of his quiet insight, have compelled me to take it seriously.

  His proposition was this: Perhaps democratic respect between citizens holding radically different foundational commitments – secular and religious, but also across deep ideological divides – isn’t achieved, or *best* achieved, by insisting one side constantly translate themselves into the other’s tongue. Perhaps it lies, instead, in a mutual recognition: that some core premises, some bedrock reasons, will *remain* untranslated, partly opaque to the other. And crucially, that this very opacity isn’t a civic failure, a breakdown demanding repair through forced translation, but rather a form of *equality*.

  He saw it as acknowledging the inherent limits of our understanding across profound differences. It’s not about *ceasing* to communicate, but about recognizing that demanding full transparency of foundations as the *price* of participation can itself be an act of domination, asking one party to disrobe their deepest convictions in a language not their own. True equality, he suggested, might involve accepting that we don’t, and perhaps *cannot*, fully grasp the ground on which the other stands, yet we respect their right to stand there, and engage with the *consequences* of their stance in our shared world.

  This became painfully urgent for me just last month, watching a zoning dispute unfold right here in our borough. A secular environmental coalition, grounded in scientific imperatives and concepts of ecological sustainability, faced off against a religious housing trust, driven by a faith-based mandate to shelter the vulnerable as a sacred duty. Each group spoke passionately, clearly, and with deep conviction. And each grew increasingly frustrated, convinced the other was being wilfully obscure, irrational, or simply refusing to ‘speak properly’. The environmentalists heard only dogma; the trust heard only secular indifference to human need. The raw materials for compromise existed, yet the conversation stalled, hardened by the unspoken demand: *Translate yourself so I can finally understand you on my terms.*

  My father’s ‘reciprocal opacity’ offers a different starting point. It suggests: What if we began by acknowledging that the environmentalist’s deep-time planetary perspective might feel alien to the trust’s immediate, divinely commanded compassion? What if we acknowledged that the trust’s invocation of sacred duty might remain fundamentally opaque to the coalition’s scientific-materialist framework? And what if, instead of seeing this opacity as a wall, we saw it as a space? A space where neither is required to surrender their core language, but both are required to engage with the *shared consequences* of their actions – the need for sustainable housing, the protection of community character, the sheltering of people – without demanding the other fully justify their foundational *why* in alien terms? It asks: Can we respect the *person* and the *commitment* even when the *source* remains partly veiled? Can that veiling itself be a condition of equal standing, not a mark of inferior reason?

  This isn’t a call for silence, or mere tolerance from a distance. It’s a call for engagement precisely *amidst* the opacity. It shifts the democratic task: from demanding foundational translation before cooperation can begin, to seeking practical solutions *despite* and *within* the reality of our untranslated differences. It asks us to listen *through* the opacity, not *past* it.

  So, my challenge to us today – philosophers, councillors, faith leaders, students – is this: Let’s explore democracy beyond the imperative of translation. Let’s test my father’s quiet notion of ‘reciprocal opacity’. Can we hold the tension his idea embodies? Can we see the refusal to demand complete transparency not as a concession, but as a harder-won form of civic respect? Can we design institutions and practices that accommodate this mutual untranslatability without descending into fragmentation? The zoning dispute isn’t resolved; the deep disagreements haven’t magically vanished. But perhaps, by acknowledging the legitimacy of the opacity itself, we can find a path to decisions that respect the equal standing of all voices, even those whose deepest reasons remain, respectfully, beyond our full comprehension. Let that be our starting tension. Thank you.
