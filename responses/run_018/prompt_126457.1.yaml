prompt: |-
  I'm prepping for a podcast interview next week with a philopher who defends a modified self-indication principle — she weights observer-moments by what she calls "epistemic accessibility" rather than raw headcount, so richer conceptual architectures count for more in the SIA calculus. I want questions that go past her just restating Bostrom's presumptuous philosopher objection; I need to press whether her weighting actually solves the problem or just hides normative baggage about whose existence should matter. Could you draft eight or ten questions? At minimum I want one on the dormancy problem (suspended observers shouldn't count but her framework can't filter them without circularity), one on whether this collapses back into SSA once you restrict the referance class correctly, and one on what her view predicts for artificial minds with partial conceptual structures — plus, for each, a follow-up keyed to her likely reply. She's very prone to saying that's an indexing problem, not a metaphysical one, so please build that deflection in. No generic "how'd you get into philosophy" stuff; I want us deep in the weeds on anthropic reasoning.
