  What they might really need is to see this as a case study in how formal models translate (or fail to translate) to reality. Progress would involve either: (a) new theorems showing how bounded reasoning approximates common knowledge asymptotically, or (b) abandoning the quest for "why agreement fails" in favor of "what repair strategies work given different failure modes". 

