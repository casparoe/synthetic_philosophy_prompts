prompt: |-
  I'm designing a ninety-minute seminar for philosophy graduate students who understand basic social-choice theory but have not studied judgment aggregation. I want them to grasp the discursive dilemma not as a curiosity about majority voting, but as a structural problem that emerges specifically when an institution must issue a single collective decision together with a publicly intelligible reasoning chain. To carry the idea, I want to use one constructed case rather than the standard courtroom or hiring-committee scenario: a three-member municipal climate-adaptation board that must decide whether to approve a seawall project, where members vote separately on empirical premises (long-range flood-risk projections), normative premises (the moral weight of present costs versus future benefits), and meta-premises (which evidentiary standards are appropriate for climate models with high variance), and where the charter requires the board to publish a coherent justification that cites shared premises supporting the conclusion. Plan the explanatory arc. What concept must be secured first—specifically, why a published justification requirement makes this different from aggregating preferences or rankings—before the paradox can even be formulated? What must the example contain, and what must it deliberately lack, so that students do not reduce the problem to ordinary disagreement over outcomes or to strategic voting? Map the misconceptions in the order they will arise: for instance, that premise-based aggregation always eliminates the tension; that the paradox depends on an even number of voters; that delegating to a technical expert resolves the institutional problem; and that adding more premises makes the collective set more rather than less coherent. For each misconception, state the precise point in the sequence where it should be intercepted and how. Provide one check-for-understanding question that tests whether they see why the justification constraint makes the choice of aggregation rule non-arbitrary, not merely whether they can reproduce the formal structure of inconsistent triples. Finally, specify what should be explicitly left out at this level—such as formal impossibility results beyond the basic tension, probabilistic judgment aggregation, or weighted-premise extensions—and explain why omitting each protects the conceptual point rather than simplifying it away.
reasoning: |-
  We are designing a seminar to introduce judgment aggregation and the discursive dilemma to philosophy graduate students with basic social-choice background. The goal is to present the dilemma as a structural problem arising from the requirement of a coherent public justification, not just a curiosity about majority voting.

  Explanatory Arc:

  1. **Start with the Institutional Requirement**: The key concept to establish first is the requirement of a published coherent justification. This is what distinguishes the problem from preference aggregation. In preference aggregation, we are aggregating individual rankings to a collective ranking. Here, the institution must produce a collective set of judgments on interconnected propositions (premises and conclusion) and a coherent justification that ties them together. The requirement for coherence (logical consistency) in the published justification is the critical element.

     Why this first? Because without this requirement, we could aggregate independently on each proposition without worrying about the logical connections. But the requirement forces the collective set to be logically consistent and to entail the conclusion (if the conclusion is part of the set). This sets the stage for the paradox: even if we aggregate each proposition by majority, the resulting set might be inconsistent.

  2. **Present the Case**: The case is a three-member municipal climate-adaptation board deciding on a seawall project. They must vote on:
     - Empirical premise (P1): "The long-range flood-risk projections (under business-as-usual) show a high probability of catastrophic flooding within 50 years."
     - Normative premise (P2): "The moral weight of future benefits (preventing catastrophic flooding) outweighs the present costs of the seawall."
     - Meta-premise (P3): "The evidentiary standard appropriate for climate models with high variance is the preponderance of evidence (as opposed to beyond a reasonable doubt)."
     - Conclusion (C): "Approve the seawall project."

     The logical structure: C if and only if (P1 and P2 and P3). That is, the project is approved only if all three premises are accepted.

     The board must publish a coherent justification that cites the premises that support the conclusion.

  3. **Voting Profiles**: Present a profile that leads to the discursive dilemma.

     Example:

     | Voter | P1   | P2   | P3   | C    | Note (for us) |
     |-------|------|------|------|------|---------------|
     | A     | Yes  | Yes  | No   | No   | Since P3 is No, C must be No |
     | B     | Yes  | No   | Yes  | No   | Since P2 is No, C must be No |
     | C     | No   | Yes  | Yes  | No   | Since P1 is No, C must be No |
     | Majority | Yes  | Yes  | Yes  | ?    | But if we aggregate each proposition by majority, we get P1=Yes, P2=Yes, P3=Yes, which would require C=Yes. However, each individual voter voted No on C. |

     But note: in the above, each voter is consistent (they follow the logic: if any premise is false, they reject C). The majority on each premise is Yes, so if we aggregate premises by majority, we get all premises true, hence C must be approved. But if we aggregate the conclusion by majority, we get rejection (since all three voted No). This is the dilemma.

  4. **Clarify the Problem**: The board must publish a justification. If they use premise-based aggregation, they would say: "We approve because P1, P2, and P3 are all true." But this does not reflect the actual views of the members because each member actually rejects at least one premise and hence the conclusion. Alternatively, if they use conclusion-based aggregation, they would just say: "We reject the project" but without a shared reason. But the charter requires a coherent justification that cites the premises. Conclusion-based aggregation avoids inconsistency in the collective set of judgments but fails to provide a justification (it only gives the conclusion). Premise-based aggregation can lead to a justification that is inconsistent with the majority view on the conclusion (if taken separately) and also does not reflect any individual's full set of judgments.

  5. **Key Misconceptions and Interception**:

     a) **Misconception: Premise-based aggregation always eliminates the tension.**
        - When: After presenting the example, when discussing the two aggregation methods.
        - Interception: Show that premise-based aggregation in this case leads to a collective judgment set (P1=Y, P2=Y, P3=Y, C=Y) that is consistent, but note that every member actually voted against C. The published justification would be based on the premises, but it does not reflect the fact that no member individually held that set of judgments. Moreover, if the board were to vote on the conclusion separately, they would reject. The tension is between the two methods and the requirement to have a justification that is both coherent and representative (or at least, that reflects the collective reasoning). Also, note that the charter requires a justification that cites shared premises. But in this case, the premises are not shared by all. The justification requirement forces the board to take a stand on the reasons, and premise-based aggregation does produce a coherent set, but it may lack support in the individual judgments (and in this case, it contradicts the unanimous conclusion of the members).

     b) **Misconception: The paradox depends on an even number of voters.**
        - When: When students see that we have three voters and the majority is defined by two out of three, they might think that with an odd number we avoid ties and hence the paradox.
        - Interception: Point out that the paradox in our example occurs with three voters (an odd number). The problem is not about ties but about the logical connections between propositions. We can have a profile (as above) with an odd number that still leads to inconsistency.

     c) **Misconception: Delegating to a technical expert resolves the institutional problem.**
        - When: When discussing ways out of the dilemma, someone might suggest delegating the empirical or meta-premise to an expert.
        - Interception: Explain that the board is still required to produce a coherent collective justification. If they delegate P1 and P3 to an expert, then the board must still vote on P2 and C. But note that the expert might say P1 and P3 are true, and then the board might have a majority for P2 and hence for C, but what if the board members disagree with the expert? The published justification would have to incorporate the expert's judgment. But then the justification would not reflect the collective reasoning of the board. Moreover, the board might still have internal disagreement about the normative premise. The requirement for a coherent public justification remains. Also, note that the expert might only be delegated one premise, but the board must still take a stand on the other premises and the conclusion. The problem of aggregating the remaining judgments might still lead to inconsistency.

     d) **Misconception: Adding more premises makes the collective set more rather than less coherent.**
        - When: When considering ways to avoid the dilemma by breaking down the reasoning into more premises.
        - Interception: Explain that adding more premises can actually increase the chance of inconsistency. The more interconnected propositions we have, the more complex the logical constraints, and the more likely it is that majority voting on each proposition will violate one of the constraints. We can illustrate with a simple extension: suppose we add a fourth premise. It only takes one cycle of interconnected propositions to cause the problem. The dilemma is not resolved by having more premises; in fact, it can be exacerbated.

  6. **Check-for-Understanding Question**:
     - Question: "Suppose the board is considering two aggregation methods: one that aggregates the premises and then deduces the conclusion, and one that aggregates the conclusion directly. Why does the requirement to publish a coherent justification that cites shared premises make the choice between these methods non-arbitrary? What does each method sacrifice in terms of the justification requirement?"
     - Expected Answer: The premise-based method produces a justification (by citing the premises) but may result in a conclusion that no member supports (as in our example) and may not reflect the members' actual views on the conclusion. The conclusion-based method produces a conclusion without a shared justification (so it fails to provide the required reasoning). The justification requirement forces the board to take a stand on the premises, so the conclusion-based method is inadequate. But the premise-based method may produce a justification that is not supported by the members (because they don't all agree on the premises). The non-arbitrariness comes from the requirement that the justification must be coherent and must cite the premises. The board must choose an aggregation method that can produce such a justification, but both methods have drawbacks in terms of representing the collective view.

  7. **What to Leave Out**:
     - **Formal impossibility results beyond the basic tension**: We are focusing on the basic discursive dilemma as an illustration of the tension. Introducing deeper impossibility results (like the List-Pettit theorem) would be too much for a first encounter. The goal is to show the structural problem, not the full generality of the impossibility.
     - **Probabilistic judgment aggregation**: The students are not yet familiar with the basic framework. Introducing probabilities would complicate the example and shift the focus to degrees of belief, which is a different topic.
     - **Weighted-premise extensions**: The idea of giving different weights to premises might seem like a way out. But we want to emphasize the structural problem in the basic case. Weighting might be a topic for advanced study, but at this stage, it could distract from the core issue of logical consistency under majority voting.

     Why omit these? To keep the focus on the core conceptual point: the requirement for a coherent public justification creates a tension between aggregating premises and aggregating conclusions, and this tension is inherent in the logical structure of the decision. Adding these extensions would either overcomplicate or shift the focus.

  Plan:

  1. Introduction (10 minutes): 
     - Present the institutional setting: the climate-adaptation board and the requirement for a published coherent justification.
     - Emphasize that the board must not only decide but also explain its decision by citing shared premises.

  2. The Decision Problem (15 minutes):
     - Explain the propositions: P1, P2, P3, and C (with the logical connection: C iff P1 and P2 and P3).
     - Illustrate with individual judgments (using the table above) and show that each member is consistent.

  3. Aggregation Methods (15 minutes):
     - Premise-based: majority on each premise, then derive C.
     - Conclusion-based: majority on C, ignore the premises.
     - Show the outcome of each method for the example.

  4. The Dilemma (10 minutes):
     - Premise-based says: approve (C=Yes) because P1, P2, P3 are all approved by majority.
     - Conclusion-based says: reject (C=No) because all three members voted No on C.
     - But the requirement is to publish a justification that cites the premises. Conclusion-based fails to provide a justification. Premise-based provides a justification, but one that is inconsistent with the unanimous vote on the conclusion (and also not held by any member).

  5. Addressing Misconceptions (20 minutes):
     - Go through each misconception and intercept as above.

  6. Check for Understanding (10 minutes):
     - Pose the question and discuss.

  7. Conclusion and Outlook (10 minutes):
     - Summarize the core problem: the justification requirement forces the institution to aggregate judgments in a way that maintains logical consistency, but this is not always possible with simple majority voting on each proposition.
     - Mention that there are more advanced topics (like different aggregation rules, impossibility theorems, etc.) for those interested, but the point of this seminar was to understand the basic tension.

  Total: 90 minutes.

  Note: The timing is approximate and may be adjusted during delivery.
answer: |-
  ### Seminar Plan: Discursive Dilemma in Judgment Aggulation  
  **Core Objective:** Frame the discursive dilemma as a structural problem arising from the requirement for a *single, coherent public justification*—not just a quirk of majority voting.  

  ---

  ### **Explanatory Arc**  
  **Total Time:** 90 minutes  
  **Key Constraint:** Publish a coherent justification citing shared premises → forces collective *reasoning* (not just outcomes).  

  #### **Phase 1: Foundational Setup (20 min)**  
  **Concept to Secure First:** The **published justification requirement** distinguishes this from preference/ranking aggregation.  
  - **Why this first?**  
    - Preference aggregation (e.g., Arrow’s theorem) outputs a collective *ordering* (e.g., "A > B > C"). Judgment aggregation outputs a collective *set of beliefs* with logical constraints.  
    - The justification requirement forces the institution to:  
      - (a) Treat premises as **truth-apt propositions** (not preferences).  
      - (b) Ensure the justification is **logically coherent** (premises → conclusion).  
      - (c) **Publicly defend** the reasoning, creating accountability.  
    *Without this, aggregating premises independently is trivial.*  

  **Opening Example (Climate Board):**  
  - **Members:** Alice, Bob, Clara (deliberately diverse perspectives).  
  - **Propositions:**  
    - P1 (Empirical): "Flood risk is high (probability > 80%)."  
    - P2 (Normative): "Future benefits morally outweigh present costs."  
    - P3 (Meta): "Preponderance of evidence is the appropriate standard for high-variance models."  
    - C (Conclusion): "Approve seawall project."  
    **Logical Constraint:** C ↔ (P1 ∧ P2 ∧ P3) (*Approval requires all premises*).  
  - **Charter Rule:** Board must publish a justification citing *shared premises* for C.  

  **Check-for-Understanding (Early):**  
  > *"Why can’t the board just vote on C and issue a one-sentence decision? How does the justification requirement change what ‘counts’ as a good outcome?"*  
  **Target Insight:** The justification forces consistency between premises and C. A decision without coherent reasoning violates the charter—even if popular.  

  ---

  #### **Phase 2: Formulating the Dilemma (25 min)**  
  **Voting Profile (Designed for Paradox):**  
  | Member | P1   | P2   | P3   | C    | Reasoning |  
  |--------|------|------|------|------|-----------|  
  | Alice  | Yes  | Yes  | No   | No   | ¬P3 → ¬C |  
  | Bob    | Yes  | No   | Yes  | No   | ¬P2 → ¬C |  
  | Clara | No   | Yes  | Yes  | No   | ¬P1 → ¬C |  
  **Majority Vote:** P1=Yes, P2=Yes, P3=Yes → **C=Yes** (if derived from premises).  
  **Conclusion Vote:** C=No (unanimous!).  

  **The Dilemma:**  
  - **Premise-based aggregation:** Approves C (all premises true) → justification: *"Approved because P1, P2, P3 are true."*  
  - **Conclusion-based aggregation:** Rejects C → *no shared premises to justify*.  
  - **Conflict:** The premise-based justification is coherent but contradicts the collective view on C. The conclusion-based output has no justification. *Neither satisfies the charter.*  

  **Key Design of Example:**  
  - **Contains:**  
    - Premises spanning empirical/normative/meta domains → forces interdependence.  
    - Unanimous rejection of C → heightens tension with premise-based output.  
  - **Lacks:**  
    - Strategic voting (members vote sincerely).  
    - Disagreement on outcomes alone (all agree on C=No; conflict arises from *reasoning*).  

  ---

  #### **Phase 3: Intercepting Misconceptions (30 min)**  
  Present in this order, as they naturally arise:  

  1. **Misconception: Premise-based aggregation resolves the tension.**  
     - **When:** After introducing premise-based vs. conclusion-based methods.  
     - **Interception:** Show that premise-based aggregation produces a justification *no member endorses* (Alice rejects P3, Bob rejects P2, Clara rejects P1). *"Can the board publish ‘P1, P2, P3 are true’ if each member denies one premise?"* → Highlights the **lack of collective ownership** of the justification.  

  2. **Misconception: The paradox requires an even number of voters.**  
     - **When:** After revealing the paradox with 3 voters.  
     - **Interception:** Stress that the paradox stems from **logical constraints**, not ties. Use the profile above (odd voters, no ties) → *"Why does the paradox persist with 3 voters? What breaks?"* (Answer: Logical connection between P1/P2/P3/C).  

  3. **Misconception: Delegating to a technical expert solves the problem.**  
     - **When:** During discussion of "solutions."  
     - **Interception:** Suppose P1 (flood risk) is delegated to an expert. The board still votes on P2, P3, C. Show a profile where:  
       - Expert: P1=True.  
       - Board majority: P2=No, P3=Yes → C=False.  
       **Problem:** Justification must cite *shared premises* → but P1 (expert) and P2 (majority) conflict. *"How can the board coherently justify C without agreeing on P2 or P3?"* → Expertise doesn’t resolve normative/meta disagreements.  

  4. **Misconception: More premises enhance coherence.**  
     - **When:** When suggesting "fixes" like adding P4 (e.g., "Seawalls reduce risk by >50%").  
     - **Interception:** Add P4 and a constraint: C ↔ (P1 ∧ P2 ∧ P3 ∧ P4). Use a profile where majority approves all premises *except* one (e.g., P4=No). *"Does adding P4 make inconsistency more or less likely?"* → More premises increase logical constraints → **amplify risk of incoherence** under majority rule.  

  ---

  #### **Phase 4: Consolidation (15 min)**  
  **Check-for-Understanding (Critical Question):**  
  > *"The charter requires a justification citing shared premises. Why does this make the choice between premise-based and conclusion-based aggregation non-arbitrary? What does each method sacrifice?"*  
  **Target Answer:**  
  - Premise-based: Ensures justification but may override consensus on C (lacks *responsiveness*).  
  - Conclusion-based: Respects C-votes but cannot justify (lacks *reason-giving*).  
  - **Non-arbitrariness:** The justification constraint forces a trade-off no preference aggregation faces.  

  **What to Omit (and Why):**  
  - **Formal impossibility theorems** (e.g., List-Pettit). *Why:* The basic dilemma suffices to show the tension; deeper impossibility distracts from the institutional constraint.  
  - **Probabilistic judgment aggregation.** *Why:* Introduces degrees of belief, obscuring the yes/no coherence problem.  
  - **Weighted-premise approaches.** *Why:* Weighting premises (e.g., P1 > P2) sidesteps the core issue—justification requires *binary* acceptance/rejection of premises.  
  **Rationale:** Omissions protect the conceptual point—**coherent public justification**—by avoiding technicalities that "solve" the dilemma but violate the charter.  

  ---

  ### **Summary Flow**  
  1. **Setup (20 min):** Justification requirement as the game-changer.  
  2. **Dilemma (25 min):** Climate board case → paradox emerges.  
  3. **Misconceptions (30 min):** Intercept in order shown.  
  4. **Consolidation (15 min):** Non-arbitrariness of aggregation rules → final Q&A.  

  **Outcome:** Students grasp the dilemma as an institutional problem of **reason-giving under logical constraints**, not mere voting inconsistency.
