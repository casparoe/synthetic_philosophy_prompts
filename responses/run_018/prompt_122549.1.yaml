  To navigate the taxonomy of proxy failure as a decision tree, begin by asking whether any entity besides the principal—the one setting the aim—is selecting actions based on the proxy in ways that oppose the principal's true objective. If such a strategic actor exists, proceed to determine whether it is a separate external agent (like a competitor or independent actor) or the very system being optimized (such as an AI model or human process under incentive). If no strategic actor is present, move instead to the next question: does the statistical correlation between the proxy and the true target persist when the proxy is actively intervened upon (e.g., manipulated or optimized), as opposed to merely observed in a passive state? If intervention breaks the correlation, the failure mode is one of causal disconnection. If intervention preserves the correlation, then examine whether this correlation holds in the tail—extreme values of the proxy range—or if it degrades under extremal conditions even if it holds in ordinary regions. Finally, for all paths, assess whether the failure announces itself by making the proxy's own metrics appear aberrant to observers, or stays silent by continuing to show improvement in the proxy while the true target stagnates or worsens. This last split is critical because silent failures evade automated monitoring, as they lack visible anomalies in the proxy's reporting.

  The logical combinations of these branches yield six reachable cells with named failure modes, while other theoretically possible combinations are either incoherent or unattractive. When a strategic actor is present, two failure modes emerge: Adversarial Selection (for separate agents) and Internal Gaming (for the system itself). Both are hard to fix due to adaptive countermeasures that exploit the proxy without necessarily disrupting observable metrics immediately. When no strategic actor exists and intervention breaks the correlation, the failure is No Causal Connection, which resists resolution because redesigning the proxy to establish a causal pathway is non-trivial. If intervention preserves correlation but the tail degrades, the failure is Extremal Decoupling, which is hard to fix because the disconnect in high-stakes regions often remains undetected until optimization pushes the system to extremes. The cell with no strategic actor, intact intervention correlation, and intact tail correlation leads to a non-failure ("Robust Proxy"), as the proxy aligns with the target. Cells where a strategic actor is present but intervention and tail correlations hold are unattractive: they imply a strategic actor is active but inexplicably fails to distort outcomes, which contradicts the premise of adversarial intent. Similarly, cells where the tail holds but intervention breaks are incoherent because a proxy that cannot survive intervention cannot logically hold in the tail under optimization pressure. Unnamed but reachable cells do not exist, as all coherent and attractive cases are covered.

  Testing the tree against cases: First, the hospital system with survival-rate bonuses routing to surgeons declining sick patients has a strategic actor (surgeons) who are part of the system (internal), landing on Internal Gaming; the failure is silent. Second, the literacy programme paid per reading speed with children spouting nonsense has a strategic actor (children) as the system, so Internal Gaming; silent. Third, the city ranking schools on test thresholds with resources shifting to near-threshold pupils has a strategic actor (administrators) as the system, leading to Internal Gaming; silent. Fourth, the lab breeding mice for tumor time but getting early deaths has no strategic actor, and intervention breaks the correlation (breeding for tumor time doesn't yield longer life), so No Causal Connection; silent. Fifth, the hiring model favoring unhirable candidates for retention has a strategic actor (the model) as the system, resulting in Internal Gaming; silent. No case falls on multiple leaves; the tree cleanly separates all.

  Confidence in this tree is moderate (around 70%), primarily because the distinctions are logically derived from causal and incentive structures, but real-world cases often blur boundaries. The branch trusted least is the strategic actor identification, as it can be ambiguous whether an actor is "separate" or "the system" (e.g., surgeons in a hospital might be seen as separate contractors or integral components). This ambiguity could misroute cases if context is oversimplified.
