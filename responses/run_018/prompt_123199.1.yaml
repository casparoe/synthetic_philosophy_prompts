prompt: |-
  For my graduate seminar on normative decision theory, I want a rigorous specification of what any adequate theory must deliver if it is to handle rational choice under undefined expectation—taking the Pasadena paradox not as a curiosity but as the central stress-test, together with its iterated and coupled-payoff variants. Write the full desiderata: the phenomena the theory must explain, the distinctions it must preserve (for instance, between undefined expectation arising from heavy-tailed payoff structures versus that arising from discontinuous belief-updating rules, or between single-shot and sequential choice), and the consistency conditions with standard decision theory it must either retain or explicitly abandon. For each desideratum, provide the motivating case or theoretical consideration behind it; flag which are genuinely non-negotiable and which are camp-specific preferences (e.g., commitments to Bayesian updating, causal decision theory, or risk-weighting); and identify any subset of requirements that is jointly unsatisfiable given known no-go results or extensions of the Pasadena structure to iterated choice. In particular, address whether a theory can consistently maintain both that an agent ought never to select an action with undefined expectation when a safe alternative with defined expectation is available, and that rational preference respects a continuity condition across approximating sequences with defined expectations. Then introduce and accommodate a novel constraint: the theory must also cover a hypothetical Pasadena-with-reflection scenario in which the agent knows that her decision rule is being observed by a second-order predictor whose payoff structure is coupled to her choice, without allowing the analysis to collapse into either self-defeating behavior or an appeal to undefined meta-expectations. Keep the weight on the criteria and their interrelations; do not supply a full scorecard of existing approaches, though you may briefly indicate where truncation strategies, risk-weighted expectation, or abandonment of expectation-maximization stand relative to the list.
reasoning: |-
  We are constructing a set of desiderata for a normative decision theory that adequately handles rational choice under undefined expectation, with the Pasadena paradox and its variants as central stress-tests.

  The Pasadena paradox (Nover & Hájek, 2004) involves a game with a sequence of payoffs: for n=1,2,3,... the payoff is (-1)^{n+1} * (2^n)/n with probability 1/2^n. The expectation is the conditionally convergent series 1 - 1/2 + 1/3 - 1/4 + ... which can be rearranged to converge to any real number or diverge. Thus, the expectation is undefined.

  We will list desiderata in the following categories:
  A. Phenomena to explain (with motivating cases)
  B. Distinctions to preserve
  C. Consistency conditions with standard decision theory
  D. Non-negotiable vs camp-specific
  E. Joint unsatisfiability and known no-go results
  F. The continuity condition vs avoiding undefined expectation
  G. The novel constraint: Pasadena-with-reflection

  We then provide a systematic list.

  A. Phenomena to explain (motivating cases):

  1. Single-shot Pasadena: The theory must explain rational choice in a single instance of the Pasadena game when compared to a fixed alternative (e.g., a sure gain of $0 or a small positive amount). 
     - Motivating case: An agent is offered to play the Pasadena game once or take $0. What should she do?

  2. Iterated Pasadena: The theory must handle sequences of independent Pasadena games (with the same or different parameters) and explain how the rationality of playing one game relates to playing multiple.
     - Motivating case: An agent is offered to play the Pasadena game n times (for some fixed n) or take a fixed sum. How does the rational choice depend on n?

  3. Coupled-payoff variants: The theory must handle cases where the payoff of one choice depends on the outcome of another in a way that leads to undefined expectation in the compound structure.
     - Motivating case: Consider two games: 
          Game A: Pasadena game.
          Game B: A game that pays $1 if the outcome of Game A is even (in the sense of the index n) and -$1 if odd. 
       The expectation of the coupled choice (playing both) might be undefined in a different way.

  B. Distinctions to preserve:

  1. Distinction between heavy-tailed payoff structures and discontinuous belief-updating rules as sources of undefined expectation.
     - Heavy-tailed: When the payoff distribution has such heavy tails that the expectation integral/sum diverges (e.g., St. Petersburg, but note that Pasadena is conditionally convergent, not divergent in the usual sense). 
     - Discontinuous belief-updating: For example, in some cases of learning, the posterior expectation might become undefined due to a discontinuity in the updating rule (e.g., when a zero-probability event occurs and the update rule fails to define a posterior). 
     - Why preserve? Because the causes of undefined expectation are different and might call for different treatments.

  2. Distinction between single-shot and sequential choice:
     - In sequential choice, the agent might have the option to avoid future undefined expectations based on current outcomes. The theory should account for dynamic consistency and the value of future flexibility.

  C. Consistency conditions with standard decision theory:

  1. The theory should, when possible, retain the principle of maximizing expected utility (MEU) for cases with defined expectations.
     - Why? MEU is the cornerstone of normative decision theory under risk.

  2. The theory should be compatible with standard probability theory (Kolmogorov axioms) and utility theory (e.g., von Neumann-Morgenstern axioms) for defined cases.

  3. However, the theory must explicitly abandon the idea that every decision problem has a well-defined expected utility for every action. It must provide a rational criterion for choice even when expectations are undefined.

  D. Non-negotiable vs camp-specific:

  Non-negotiable (core for any adequate theory):
  1. The theory must deliver a verdict in any decision problem with undefined expectation that we might face (i.e., it must be complete in the sense of providing guidance).
  2. The verdict must be consistent across isomorphic representations of the same decision problem (principle of invariance).
  3. The theory must avoid blatant irrationality (e.g., taking a dominated action).

  Camp-specific (may vary by theoretical commitments):
  1. Bayesian updating: Some theories require updating by conditionalization. But in cases of undefined conditional expectation, this might be problematic. Thus, a theory might abandon strict conditionalization in such cases.
  2. Causal decision theory (CDT) vs Evidential decision theory (EDT): The theory might align with one or the other, but must handle undefined expectations within that framework.
  3. Risk-weighted expected utility: Some theories (e.g., Buchak) weight probabilities in a way that might avoid undefined expectations. This is a specific approach.

  E. Joint unsatisfiability and known no-go results:

  1. There is a known tension between two desiderata:
     - (D1) Never select an action with undefined expectation when a safe alternative with defined expectation is available (call this "Avoid Undefined").
     - (D2) Rational preference respects continuity: if a sequence of actions with defined expectations converges (in some appropriate topology) to an action with undefined expectation, then the preference should also converge.

     Example: Consider a sequence of truncated Pasadena games. In the n-th truncation, we set the payoff to 0 for all outcomes beyond n. The expectation of the truncated game is the partial sum of the alternating harmonic series up to n, which converges to log(2) as n->infty. If we require continuity, then the Pasadena game should be valued at log(2). But then we are assigning a defined expectation to the undefined case, which might conflict with Avoid Undefined.

     Known result: It has been shown (e.g., by Easwaran) that any theory that satisfies both continuity and Avoid Undefined in the context of the Pasadena game will have to assign a definite value to the game, which then violates the idea that the expectation is undefined. This seems jointly unsatisfiable.

  F. The continuity condition vs avoiding undefined expectation:

     We must choose one:
     Option 1: Abandon continuity and insist on Avoid Undefined. Then in the Pasadena game, the agent must reject the game if a safe alternative (with defined expectation) is available. But then the truncated versions (which are safe) would be acceptable and their value approaches log(2), but the full game is rejected. This breaks continuity.

     Option 2: Abandon Avoid Undefined and embrace continuity. Then we assign the Pasadena game the value log(2) (by the Abel sum, Cesaro mean, or by the limit of truncations). But then we are not really avoiding undefined expectations: we are defining them by a particular method.

     Option 3: A third way? Perhaps a theory that does not rely on expectation at all (e.g., using a different functional) and that might be defined even when the expectation is undefined. But note that the truncations then might not converge to the value assigned by that functional.

  G. The novel constraint: Pasadena-with-reflection

     Scenario: The agent knows that her decision rule is being observed by a second-order predictor (e.g., a Newcomb-style predictor or a sophisticated opponent) whose payoff structure is coupled to her choice. Specifically, the predictor will set the parameters of the Pasadena game (or decide whether to offer it) based on the agent's decision rule. We must avoid:

     - Self-defeating behavior: The agent's attempt to handle undefined expectation leads to a choice that the predictor exploits to give her the worst possible outcome.
     - Undefined meta-expectations: The predictor's behavior might depend on the agent's rule in a way that leads to undefined expectation at the meta-level.

     Example: Suppose the predictor will offer the Pasadena game only if the agent's decision rule would reject it when compared to a fixed alternative (say $0). If the agent's rule always rejects the Pasadena game, then the predictor offers it and the agent rejects it, getting $0. But if the agent had a rule that accepted it, the predictor would not offer it (so the agent gets $0 anyway). So the agent gets $0 regardless. But note: if the predictor offers the game only to agents who reject it, then an agent who accepts would not be offered the game? So the agent might want to commit to accepting. But then the predictor, knowing the agent accepts, might not offer the game? 

     We require the theory to provide a rational choice in such a scenario without collapsing into either:

     a) A self-defeating cycle: The agent's rule leads the predictor to force the agent into an outcome that is worse than if she had a different rule.
     b) An appeal to undefined meta-expectations: The predictor's behavior might be modeled as a function of the agent's rule, but the expectation of the agent's payoff might become undefined when we condition on the predictor's behavior.

     The theory must have a well-defined solution for the agent in such a scenario.

  Now, we compile the full list of desiderata:

  Desiderata for a Normative Decision Theory Handling Undefined Expectation:

  I. Scope: The theory must cover:
     1. Single-shot Pasadena and its variants (non-negotiable).
     2. Iterated independent Pasadena games (non-negotiable).
     3. Coupled-payoff variants (non-negotiable).
     4. The Pasadena-with-reflection scenario (non-negotiable).

  II. Explanatory Requirements: For each of the above, the theory must:
     1. Provide a clear rational verdict (non-negotiable).
     2. Explain the rationale for the verdict in terms of the agent's goals and constraints (non-negotiable).

  III. Distinctions to Preserve (non-negotiable):
     1. Between heavy-tailed and discontinuous-updating sources of undefined expectation.
     2. Between single-shot and sequential choice (and the role of dynamic consistency).

  IV. Consistency Conditions:
     1. Retain MEU for defined cases (non-negotiable, but note that some theories might extend MEU by redefining expectation).
     2. Retain standard probability and utility theory for defined cases (non-negotiable).
     3. Abandon the universality of defined expectation (non-negotiable).

  V. Constraints on Rational Choice:
     1. Avoid Undefined: If an action has undefined expectation and there is an alternative with defined expectation that is at least as good in every state (or in some stronger sense dominates), then the latter should be chosen. (This is non-negotiable for some, but we have seen it conflicts with continuity.)
     2. Continuity: If a sequence of actions (with defined expectations) converges appropriately to an action, then the preference relation should reflect this limit. (This is camp-specific: some theories, especially those using infinitesimals or non-Archimedean values, might abandon it.)

     Note: We have identified that (V.1) and (V.2) are jointly unsatisfiable for the Pasadena game. Thus, a theory must choose between them.

  VI. The Reflection Scenario Requirement (non-negotiable):
     The theory must resolve the Pasadena-with-reflection scenario without self-defeat and without undefined meta-expectations. In particular, it must:
     - Allow the agent to form a well-defined plan that the predictor cannot exploit to force a suboptimal outcome.
     - Avoid infinite regress in the decision rule.

  VII. Camp-Specific Commitments (to be explicitly stated by the theory):
     1. Position on Bayesian updating in the face of undefined conditional expectation.
     2. Alignment with CDT or EDT (or neither).
     3. Use of risk-weighting or other non-expectation functionals.

  Where existing approaches stand:

  - Truncation strategies: They approximate the undefined expectation by a defined one (e.g., truncating the Pasadena game at some n). They typically violate Avoid Undefined (by assigning a defined value) and might satisfy continuity. But they are arbitrary (choice of truncation) and might not generalize to reflection.

  - Risk-weighted expectation (e.g., Buchak): By transforming probabilities, they might avoid undefined expectations. However, they are designed for risk attitudes and may not naturally handle conditional convergence. Also, they might not preserve the distinctions we require (e.g., between heavy-tailed and discontinuity).

  - Abandoning expectation-maximization: Some theories replace expectation with another criterion (e.g., minimax, or rank-dependent utility). These might avoid undefined expectations, but they must be checked against the reflection scenario and the distinctions.

  Conclusion:

  The theory must navigate the tension between Avoid Undefined and Continuity by choosing one. Given the reflection scenario, it must also incorporate self-referential decision-making without circularity. This might require a novel approach that goes beyond existing methods.

  For the reflection scenario, one promising idea is to use a fixed-point in the agent's decision rule. For instance, the agent might choose a rule that is a fixed point with respect to the predictor's behavior. But note that in the example above, if the agent commits to accepting the Pasadena game, then the predictor does not offer it, so the agent gets $0. If the agent commits to rejecting, then the predictor offers it and the agent rejects it (again $0). So both fixed points yield $0. But then the agent is indifferent? However, note that the predictor's behavior is defined by the agent's rule. We might require the agent to choose a rule that is consistent with the predictor's response and that maximizes her payoff. In this case, both rules yield $0, so it is acceptable.

  But what if the predictor sets the game parameters? For example, the predictor might set the payoffs to be very favorable if the agent accepts and very unfavorable if she rejects? Then the fixed point might be more complex.

  The theory must be able to handle such strategic interactions.
answer: |-
  Below is a rigorous specification of desiderata for a normative decision theory designed to handle rational choice under undefined expectation, centered on the Pasadena paradox and its variants. The desiderata are categorized by **phenomena to explain**, **distinctions to preserve**, **consistency conditions**, and **novel constraints**, with explicit justifications, classifications of negotiability, and identification of tensions. Key no-go results and the novel "Pasadena-with-reflection" scenario are integrated throughout.

  ---

  ### **I. Phenomena the Theory Must Explain**
  **Non-negotiable core**: The theory must yield determinate prescriptions for all cases below.  
  1. **Single-shot Pasadena choice**  
     - **Case**: Agent faces the Pasadena game (payoff \(X\) with \(P(X = (-1)^{n+1} 2^n/n) = 2^{-n}\)) vs. a safe alternative (e.g., $0). Expectation \(E[X]\) is conditionally convergent (undefined).  
     - **Requirement**: Explain why an agent should accept/reject the game or be indifferent.  
     - **Motivation**: Tests whether undefined expectations imply incomparability or demand a novel evaluation criterion.  

  2. **Iterated independent Pasadena games**  
     - **Case**: Agent faces \(n\) i.i.d. Pasadena games vs. a fixed sum \(S\). As \(n \to \infty\), \(E[\sum X_i]\) diverges.  
     - **Requirement**: Explain how rational evaluation changes with \(n\) and whether \(S\) can be outweighed for large \(n\).  
     - **Motivation**: Exposes whether undefined expectations can be "resolved" via aggregation or require sequential reasoning.  

  3. **Coupled-payoff paradoxes**  
     - **Case**: Payoff \(Y\) of Game B depends on the outcome of Game A (e.g., \(Y = +1\) if \(X_A > 0\), \(-1\) otherwise). Compound expectation \(E[Y|X_A]\) may be undefined.  
     - **Requirement**: Prescribe choices when coupling creates undefined joint expectations.  
     - **Motivation**: Tests additivity, separability, and dynamic consistency in composite decisions.  

  4. **Sequential choice under undefined futures**  
     - **Case**: Agent chooses whether to enter a sequence of decisions where future actions may lead to undefined expectations (e.g., continue iff \(X_i > 0\)).  
     - **Requirement**: Handle dynamic consistency without assuming future expectations are definable.  
     - **Motivation**: Distinguishes global vs. local rationality and precludes "greedy" policies that ignore downstream pathology.  

  ---

  ### **II. Distinctions the Theory Must Preserve**  
  **Non-negotiable core**: These distinctions reflect ontologically distinct sources of undefinedness.  
  1. **Heavy-tailed vs. discontinuous-updating undefinedness**  
     - **Case 1 (Heavy-tailed)**: Pasadena (conditional convergence) or St. Petersburg (divergent expectation).  
     - **Case 2 (Discontinuous updating)**: Belief revision after zero-probability events (e.g., Jeffrey conditioning fails) leading to undefined posterior expectations.  
     - **Requirement**: Treat these as structurally distinct; e.g., heavy-tailed cases may permit regularization, while discontinuous updating may require belief revision fixes.  
     - **Motivation**: Heavy tails arise from payoff structures, discontinuities from epistemic dynamics—solutions should not conflate them.  

  2. **Single-shot vs. sequential choice**  
     - **Case**: In sequential Pasadena, an agent may avoid undefined expectations by conditioning future choices on observed outcomes.  
     - **Requirement**: Explain why sequentiality might mitigate (or exacerbate) undefinedness compared to single-shot choice.  
     - **Motivation**: Sequential rationality may "bound" pathology (e.g., via truncation), but must not imply that single-shot analogs are always irrational.  

  3. **Risk-bearing vs. structural undefinedness**  
     - **Case**: Undefinedness due to extreme risk (e.g., Cauchy-distributed payoffs) vs. conditional convergence (Pasadena).  
     - **Requirement**: Prescribe different attitudes toward these; e.g., risk-aversion may resolve heavy tails but not conditional convergence.  
     - **Motivation**: Normatively distinct: risk is agent-relative, structural undefinedness is objective.  

  ---

  ### **III. Consistency Conditions with Standard Decision Theory**  
  **Non-negotiable core**: Retain consistency where possible; explicitly abandon where necessary.  
  1. **Retain MEU for defined expectations**  
     - **Requirement**: Subordinate to standard expected utility (EU) theory when expectations exist.  
     - **Motivation**: Avoids gratuitous deviation from orthodoxy; e.g., Pasadena truncations should approximate EU.  

  2. **Abandon universalism of expectation**  
     - **Requirement**: Reject the axiom that all acts must have comparable/defined expectations.  
     - **Motivation**: Pasadena shows this is untenable; forces a non-expectation-based criterion (e.g., rank-dependent utility or acceptability indices).  

  3. **Dynamic consistency in sequential choice**  
     - **Requirement**: Ensure plans remain optimal when executed (no Dutch books).  
     - **Motivation**: Iterated Pasadena may tempt time-inconsistent truncation; theory must avoid this.  

  **Camp-specific relaxations**:  
  - **Bayesian updating**: *Optional*. If retained, must extend to undefined posteriors (e.g., via improper priors).  
  - **Causal vs. evidential decision theory**: *Optional*. Coupled-payoff cases may favor CDT to avoid self-referential traps.  
  - **Risk-weighted EU**: *Optional*. Buchak-style risk curves may resolve heavy tails but not conditional convergence.  

  ---

  ### **IV. Critical Tensions and No-Go Results**  
  **Conflict**: The following desiderata are jointly unsatisfiable for Pasadena-type cases:  
  - **Avoid Undefined (AU)**: Never choose an act with undefined expectation when a safe alternative with defined \(E[U] > -\infty\) exists.  
  - **Continuity (C)**: If acts \(A_n \to A\) (e.g., truncated Pasadena \(\to\) full Pasadena) and \(E[U(A_n)] \to L\), then \(A \sim L\).  

  **No-go proof sketch**:  
  1. Let \(A_n\) be Pasadena truncated at \(n\) terms. Then \(E[U(A_n)] \to \ln 2\) (by Riemann rearrangement).  
  2. By (C), \(A \sim \ln 2\) (so defined expectation).  
  3. By (AU), if safe \(S\) has \(E[U(S)] = \ln 2\), agent is indifferent between \(A\) and \(S\).  
  4. But \(A\) has no expectation—contradiction.  
  → **Consequence**: A theory must reject **either AU or C**.  
  - **Rejecting AU**: Regularize undefined expectations (e.g., via Cesàro summation). Violates strict dominance in pathological cases.  
  - **Rejecting C**: Judge Pasadena incomparable to \(\ln 2\). Breaks "natural" approximation intuitions.  

  **Camp implications**:  
  - **Pro-AU (e.g., strict dominance adherents)**: Forfeit continuity; Pasadena is rejected vs. any safe positive amount.  
  - **Pro-C (e.g., limit-based approaches)**: Assign \(A\) value \(\ln 2\); AU abandoned for conditionally convergent cases.  
  - **Neither (e.g., lexical priority theories)**: May impose ad hoc rules (e.g., "avoid non-absolutely convergent games").  

  ---

  ### **V. Novel Constraint: Pasadena-with-Reflection**  
  **Scenario**:  
  - Agent knows a **predictor** \(\Pi\) observes her decision rule \(D\).  
  - \(\Pi\) sets Pasadena game parameters (e.g., payoff signs) conditional on \(D\).  
  - Payoff structure is **coupled**: If \(D\) would reject Pasadena, \(\Pi\) makes payoffs favorable; if \(D\) accepts, payoffs become unfavorable.  

  **Requirements** (non-negotiable):  
  1. **Avoid self-defeat**: \(D\) must not incentivize \(\Pi\) to force dominated outcomes (e.g., no strategy where agent always gets \(-\infty\)).  
  2. **No undefined meta-expectations**: Evaluation of \(D\) must not require computing \(E[E[\cdot|\Pi]]\) (undefined if \(\Pi\) induces higher-order pathology).  
  3. **Robustness**: \(D\) should generalize across predictor epistemologies (e.g., perfect vs. noisy predictors).  

  **Solution sketch**:  
  - **Fixed-point decision rules**: Choose \(D\) such that it is optimal given \(\Pi\)'s response to \(D\).  
    - E.g., "Accept Pasadena iff \(\Pi\) assigns favorable payoffs" creates a fixed point where \(\Pi\) *does* favor acceptance.  
  - **Tool**: Game-theoretic equilibrium (e.g., Nash in meta-strategies) or causal intervention (à la CDT).  
  - **Avoids collapse**: By construction, \(\Pi\)'s coupling is handled within \(D\)'s domain, blocking regress.  

  ---

  ### **VI. Summary Desiderata Table**  
  | **Category** | **Desideratum** | **Non-negotiable?** | **Tensions/Notes** |
  |--------------|-----------------|---------------------|-------------------|  
  | **Phenomena** | Single-shot Pasadena | Yes | Tests basic comparability |  
  | | Iterated Pasadena | Yes | Challenges aggregation |  
  | | Coupled payoffs | Yes | Exposes separability failures |  
  | **Distinctions** | Heavy-tailed vs. discontinuous | Yes | Ontological divide |  
  | | Single-shot vs. sequential | Yes | Dynamic consistency |  
  | **Consistency** | Retain MEU when defined | Yes | Orthodoxy constraint |  
  | | Abandon universal expectation | Yes | Pasadena-compatibility |  
  | | Bayesian updating | Camp-specific | Fails for discontinuous cases |  
  | **Core Tensions** | Avoid Undefined (AU) | Camp-specific | Conflicts with Continuity |  
  | | Continuity (C) | Camp-specific | Conflicts with AU |  
  | **Reflection** | No self-defeat | Yes | Fixed-point solutions |  
  | | No meta-undefinedness | Yes | Game-theoretic avoidance |  

  ---

  ### **VII. Implications for Existing Approaches**  
  - **Truncation strategies**: Violate **AU** (implicitly assign \(\ln 2\)), fail **reflection** (predictor exploits truncation point).  
  - **Risk-weighted EU** (e.g., Buchak): May resolve heavy tails but not conditional convergence (**Phenomena 1–2**); silent on **reflection**.  
  - **Abandoning expectation**: Satisfies **AU** if paired with dominance (e.g., Levi's E-admissibility), but violates **C**; struggles with **coupled payoffs**.  
  - **Regularization** (e.g., principal value integrals): Satisfies **C** but violates **AU**; may handle **reflection** via fixed points.  

  **Conclusion**: A viable theory must explicitly choose between **AU** and **C**, then extend this choice to iterated/coupled cases and reflection scenarios without inconsistency. The Pasadena-with-reflection constraint necessitates game-theoretic or fixed-point machinery to block self-defeat, making it a critical stress-test for completeness.
