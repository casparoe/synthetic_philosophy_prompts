prompt: |-
  I am a third-year philosophy student taking a seminar on decision theory, and I have volunteered to lead one fifty-minute tutorial next week in which I teach the Death in Damascus problem to the rest of the group. My classmates know the basics of expected utility and have seen Newcomb's problem, but none of them have encountered cases where no option seems rationally choiceworthy.

  For context, here is the case as I plan to present it. Death tells a man in Damascus that they have an appointment tomorrow. Death, who has an unbroken track record of correct predictions, has already predicted where the man will be tomorrow and has arranged to be at that place. The man knows this. He can stay in Damascus or travel overnight to Aleppo, and that is all he can do. Whatever Death predicted, going to the predicted place is fatal. Since the prediction is already made, staying or fleeing changes nothing about where Death waits -- yet whichever he does, he will have overwhelming evidence, after the fact, that the other choice would have saved him, and before the fact he has a standing reason to distrust any plan he settles on, because settling on it is exactly the sort of thing Death predicted. I want the tutorial to end with the class understanding why this case puts pressure on the idea that rationality always selects an action, and how it differs from a mere paradox of prediction.

  Please give me a teaching plan, not an explanation of the case itself -- I understand the case; I need to know how to make them understand it. Structure your answer in exactly the following five sections, in this order:

  1. Sequencing (roughly 200 words). What must already be in place before the puzzle can even be posed to them -- for instance, how much of causal versus evidential reasoning they need, and whether Newcomb should be refreshed first or deliberately not mentioned. State what depends on what and why.

  2. The carrying example (roughly 200 words). Should I use the Death story itself, with its supernatural predictor, or strip it down to an abstract version with a human forecaster? Say what the chosen telling must contain and what it must lack, and what the atmospheric details of the original story help or hinder.

  3. The misconception map (roughly 250 words). The confusions I should expect, in the order I should expect them, and the exact point in my sequence where each should be headed off. I anticipate at least: the idea that Death is somehow cheating or that the setup is contradictory; the claim that the man should simply randomize; and the assumption that this is just Newcomb's problem again with one box.

  4. The check for understanding (roughly 100 words). One question I can pose in the final minutes whose answer would show the class has grasped what the case threatens, rather than merely remembered the story.

  5. Deliberate omissions (roughly 100 words). What I should consciously leave out at this level -- for example, technical treatments of ratifiability -- and how to say aloud that I am leaving it out.
reasoning: |-
  Okay, the user is a third-year philosophy student preparing to lead a tutorial on the Death in Damascus problem. They need a structured teaching plan to help classmates grasp why this case challenges the idea that rationality always selects an action. 

  First, considering their background: the class knows expected utility basics and Newcomb's problem, but hasn't encountered cases with no rational choice. The user specifically wants to avoid rehashing the case explanation and focus on teaching methodology. 

  Breaking down the required sections:
  For sequencing, they'll need to reactivate evidential reasoning without conflating it with Newcomb's problem. Important to distinguish causal vs evidential decision theory upfront since Death in Damascus breaks both. Should refresh evidential reasoning through Newcomb first, then explicitly contrast with CDT to set up the new puzzle. 

  About the carrying example: The original Death story's atmosphere helps but risks supernatural distractions. Will advise keeping Death for memorability but stripping it to essentials - no cheating Death, no loopholes. Must emphasize the prediction's perfection and the man's awareness. 

  The misconception map needs careful ordering: First address "Death is cheating" immediately after presenting the story. Then tackle randomization proposals when analyzing alternatives. Finally, differentiate from Newcomb during the CDT/EDT comparison. Each misconception should be preempted at specific points. 

  For the check question, something about why EU calculations fail here would test deep understanding. The answer should reference how both actions become self-defeating upon commitment. 

  Deliberate omissions should include ratifiability and mixed strategies, explicitly stating these are advanced topics. The focus should stay on why standard theories implode. 

  The user seems well-prepared but might underestimate how quickly classmates could conflate this with Newcomb. The plan should build deliberate contrasts early. Also, their request for "what to leave out" shows good teaching instincts - they're thinking about cognitive load. 

  Noticing they want exactly 5 sections in fixed order. Will maintain that structure strictly while keeping each section within word limits. The atmospheric details in part 2 are crucial - the supernatural element actually helps highlight the prediction paradox if handled right.
answer: |-
  Here is your teaching plan, structured as requested:

  **1. Sequencing (200 words)**  
  Begin by reactivating **evidential decision theory (EDT)** via a quick Newcomb's Problem recap (3 mins): *"Recall: in Newcomb, one-boxing is rational under EDT because taking one box *evidence* you get the million, even if causally ineffective. Today we see EDT pushed further."* Explicitly **contrast EDT with causal decision theory (CDT)** next (2 mins): *"CDT cares only about causal influence: in Newcomb, two-boxing is rational because your choice doesn’t *cause* the prediction."* This distinction is essential because Death in Damascus breaks *both* theories.  

  **Avoid deep Newcomb debate**; use it only to establish EDT’s core principle: actions as evidence. Then introduce Death in Damascus *without solution attempts*. Sequence:  
  1. Newcomb/EDT refresher → 2. CDT contrast → 3. Death setup → 4. Analysis paralysis reveal.  
  *Why:* If EDT isn’t salient, students misdiagnose this as a causal problem. CDT must be present to show *neither theory works*.

  **2. The carrying example (200 words)**  
  **Use the original Death story** but streamline it. Keep:  
  - **Death’s infallible prediction** (no probabilities; 100% accuracy).  
  - The man’s **knowledge of infallibility**.  
  - The **fatal consequence** of matching Death’s prediction.  
  Strip: Extended backstory (e.g., why Death is hunting him).  

  **Atmospheric details help**: The supernatural framing prevents "realistic workarounds" (e.g., "Death might lie") and emotionally sharpens the inescapable dilemma. Death’s inevitability mirrors the logical trap. **Crucial phrasing**: *"Wherever you go, you’ll realize too late that going the other way would have saved you. Deciding *now* to stay makes staying strong evidence Death predicted staying... but so does deciding to flee."*

  **3. Misconception Map (250 words)**  
  Anticipate and intercept in this order:  
  - **"Death is cheating/contradictory!"** (Post-setup): *Intercept immediately*: "Death isn’t reacting to your choice *now*; the prediction is fixed. The contradiction is in the reasoning, not the setup."  
  - **"He should randomize!"** (During analysis): *Delay until after showing EU failure*: "Randomizing avoids self-defeat, but EU maximization can’t prescribe it. If he *plans* to randomize, wouldn’t Death predict that? We’re seeking a deterministic rational action."  
  - **"This is just Newcomb!"** (After introducing CDT/EDT clash): *Explicitly contrast*: "In Newcomb, EDT and CDT disagree but each picks an action. Here, *both* EU calculations self-destruct. Staying has higher EU *if* you’re leaning toward fleeing, and vice versa. No stable choice maximizes EU."  

  **Key intervention points**: After stating the dilemma, pause to squash "Death is cheating." When walking through EU calculations (10 mins), show staying’s EU depends on the probability of fleeing (and vice versa), creating a loop. *Then* address randomization as a non-EU escape hatch.

  **4. Check for Understanding (100 words)**  
  **Question**: *"Why can’t we resolve this by saying ‘Just calculate the expected utility of each action and pick the highest’?"*  
  **Target insight**: A correct answer identifies that the EU of each action *depends on which action you intend to choose*, creating a feedback loop where neither action is stably optimal. Merely recounting the story or stating "both choices are bad" is insufficient. They must recognize the *structural collapse* of EU maximization.

  **5. Deliberate Omissions (100 words)**  
  **Omit**:  
  - **Ratifiability**: Don’t mention the term or formal definitions. Say: *"There are advanced concepts like ‘ratifiable decisions’ designed for cases like this, but today we focus on why standard theories break."*  
  - **Mixed strategies**: Acknowledge randomization but don’t explore game-theoretic solutions. Say: *"While flipping a coin ‘solves’ the practical dilemma, it doesn’t answer whether there’s a *rational deterministic choice*—which is our puzzle today."*  
  - **EDT/CDT hybrid theories**: Avoid. Emphasize: *"Our goal is to see the problem, not solve it. Even the foundations are unstable here."*  

  **Focus**: The impossibility of selecting a *deterministic*, EU-maximizing action under perfect prediction.
