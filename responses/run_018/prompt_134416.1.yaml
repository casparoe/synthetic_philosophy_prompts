answer: |-
  Here is the diagnostic taxonomy structured as a branching decision tree, designed for classroom use:

  **Root Question:** Does the intergenerational transmission of substantial economic advantage (as a social practice) constitute a structural impediment to fair equality of opportunity, or is it a permissible outcome of individual liberty?
  - **Branch A (Yes, structural impediment):** Proceed to Question 1.
  - **Branch B (No, permissible liberty outcome):** → **Leaf: Dynastic Libertarian**  
    *Awkward Commitment:* Accepts that near-feudal levels of intergenerational wealth concentration are compatible with a just society if accrued legally.

  ---

  **Branch A Path:**

  **Question 1:** Should the baseline for assessing equality of opportunity track individuals within a single generation (intragenerational) or family lines across multiple generations (intergenerational)?
  - **Branch A1 (Intergenerational):** Proceed to Question 2.
  - **Branch A2 (Intragenerational):** → **Leaf: Meritocratic Reset**  
    *Awkward Commitment:* Permits massive inheritance if society ensures *every* 20-year-old starts life with equal resources, regardless of grandparents' wealth transfers.

  ---

  **Branch A1 Path:**

  **Question 2:** Consider capital-lock inheritance (direct bequests) and status-lock inheritance (social networks/access) separately. Does *capital-lock transmission alone* violate fair equality of opportunity?
  - **Branch A1a (Yes):** Proceed to Question 3.
  - **Branch A1b (No):** → **Leaf: Democratic-Egalitarian**  
    *Awkward Commitment:* Allows unlimited financial inheritance so long as it doesn’t buy political office or legislative influence.

  ---

  **Branch A1a Path:**

  **Question 3:** Does *status-lock transmission alone* violate fair equality of opportunity?
  - **Branch A1a1 (Yes):** Proceed to Question 4.
  - **Branch A1a2 (No):** → **Leaf: Capital-Only Restrictionist**  
    *Awkward Commitment:* Tolerates elite private schools and nepotistic networks as "cultural practices" beyond state reach, even if they cement class barriers.

  ---

  **Branch A1a1 Path:**

  **Question 4:** Is the primary wrong of dynastic wealth that it violates moral arbitrariness (unfair advantage from birth circumstances) or distorts democratic equality (concentrating political power)?
  - **Branch A1a1a (Moral arbitrariness):** Proceed to Question 5.
  - **Branch A1a1b (Democratic distortion):** → **Leaf: Democratic-Egalitarian**  
    *Awkward Commitment:* Would permit dynastic wealth if politics were perfectly insulated from economic power (e.g., via strict campaign finance laws).

  ---

  **Branch A1a1a Path:**

  **Question 5:** In the case of the founder who liquidates a business, pays taxes, and endows a foundation offering exclusive opportunities to her network’s descendants: Is this arrangement objectionably dynastic?
  - **Branch A1a1a1 (Yes):** → **Leaf: Strict Abolitionist**  
    *Awkward Commitment:* Requires banning grandparents from funding selective private schools for grandchildren, viewing it as unjust advantage.
  - **Branch A1a1a2 (No):** → **Leaf: Meritocratic Reset**  
    *Awkward Commitment:* Allows dynastic foundations if they formally "open" opportunities to all, ignoring how social capital gates access.

  ---

  ### Unoccupied Leaf & Diagnosis
  - **Combination:** *Condemns capital-lock* (A1a: Yes) but *endorses status-lock* (A1a2: No) on *democratic-egalitarian grounds* (A1a1b).  
  - **Diagnosis:** **Incoherence gap.** Status-lock mechanisms (e.g., legacy admissions, exclusive networks) demonstrably concentrate political influence. Defending them while opposing capital-lock *specifically for distorting democracy* is self-contradictory. No major position holds this.

  ---

  ### Methodological Reflection
  1. **Evidence that would change classification:** Proof that *status-lock advantages are fully convertible into capital-lock advantages through market mechanisms* (e.g., networked internships guarantee higher lifetime earnings regardless of merit) would collapse the distinction between Capital-Only Restrictionist and Strict Abolitionist leaves. Capital-only views implicitly assume the mechanisms are separable.
     
  2. **Least secure separation:** The boundary between **Meritocratic Reset** and **Strict Abolitionist** is fragile. If empirical studies show that *any* non-state-controlled intergenerational transfer (e.g., parenting strategies, cultural capital) inevitably creates opportunity disparities exceeding a "reset" threshold, the Meritocratic Reset position becomes empirically untenable, forcing a collapse into Abolitionism.

  ---
  This tree isolates commitments through institutional judgments, ensuring students discover positions via case-based reasoning rather than doctrinal labels. The awkward commitments highlight trade-offs inherent in each view, prompting critical discussion.
