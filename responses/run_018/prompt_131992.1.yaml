  **Joint Statement on Epistemic Logic and Logical Omniscience**  
  *Co-signed by Dr. Elena Voss and Dr. Marcus Chen following a year of adversarial collaboration*  

  ### **1. Agreed Claims**  
  We jointly endorse the following propositions regarding epistemic logic, its applications, and modifications:  

  1. **Formal Behavior of Standard Epistemic Logic**:  
     a. Closure under known implication is inherent: If an agent knows \(P\) and knows \(P \rightarrow Q\), they know \(Q\).  
     b. Universal knowledge of tautologies holds: Agents know all logical truths (e.g., \(P \lor \neg P\)).  
     c. Modal frames fail to distinguish premises from conclusions: Standard possible-worlds semantics do not differentiate between explicitly known premises and derived conclusions, treating all knowledge as uniformly accessible.  

  2. **Normative vs. Descriptive Modeling Distinction**:  
     a. Epistemic logic primarily models *normative rational agents*, defining ideal belief closure under logical consequence as a criterion for rationality.  
     b. It does not model *descriptive cognitive agents*, which are constrained by finite resources, time, and computational limitations.  

  3. **Modifications Alter but Preserve Closure**:  
     a. Awareness-based logics (e.g., requiring explicit "awareness" of a proposition) weaken closure: Agents know \(Q\) only if aware of \(Q\) or the implication \(P \rightarrow Q\), but closure persists within the awareness set.  
     b. Impossible-worlds semantics (allowing logically inconsistent worlds) restrict closure: Agents need not know all tautologies, but closure holds in "possible" worlds where logical rules apply consistently.  

  ### **2. Disagreements**  
  The table below presents our unresolved disagreements, with wording acceptable to each camp:  

  | Issue | Dr. Voss’s Position (Normative) | Dr. Chen’s Position (Descriptive) |  
  |-------|----------------------------------|-----------------------------------|  
  | **Knowledge of derived conclusions** | An agent possessing all premises and logical rules but not executing a derivation *knows the conclusion*; failure to believe it is irrational. | An agent in this state *does not know the conclusion*; genuine knowledge requires explicit, resource-bounded derivation. |  
  | **Nature of closure** | Closure under logical consequence is a *normative constraint*: Rationality demands agents believe all consequences of their knowledge. | Closure is a *psychological impossibility* for finite agents; it misdescribes human cognition and should be excluded from descriptive models. |  

  ### **3. Cruxes and the Mathematician Case**  
  We identify three cruxes pivotal to our disagreement, tested against a shared case:  
  **Case**: A mathematician accepts Peano arithmetic axioms, understands primality, but has not computed whether \(2^{82,589,933} − 1\) is prime (a known Mersenne prime).  

  #### **Crux 1: Can a formalism tracking explicit vs. tacit competence reconcile our views?**  
  - **Voss**: Yes. A supplemented logic (e.g., adding "tacit knowledge" operators) can model dispositions without abandoning normative closure.  
  - **Chen**: No. Such formalisms still conflate competence with performance; explicit derivation must be fundamental.  
  - **Case Predictions**:  
    - *Voss*: The mathematician *knows* the primality (tacitly); her failure to derive it is *irrationality*.  
    - *Chen*: She *does not know*; her failure is a *cognitive limitation*.  

  #### **Crux 2: Is the dispute verbal—does "knowing that p" require occurrent derivation?**  
  - **Voss**: Partly verbal. "Knowing" requires only *dispositional accessibility* (ability to derive); occurrent derivation is unnecessary for normative knowledge.  
  - **Chen**: Substantive. "Knowing" requires *occurrent derivation*; dispositional states are potential, not actual, knowledge.  
  - **Case Predictions**:  
    - *Voss*: She *knows* via disposition; failure to activate it is *irrationality*.  
    - *Chen*: She *lacks knowledge*; failure is a *limitation*.  

  #### **Crux 3: Must epistemic logic be abandoned or supplemented?**  
  - **Voss**: Supplemented. Normative closure is indispensable; add resource-aware layers for descriptiveness.  
  - **Chen**: Abandoned as descriptively inadequate; rebuild derivability into the core.  
  - **Case Predictions**:  
    - *Voss*: She *knows* (normatively); supplement logic to explain her inaction.  
    - *Chen*: She *does not know*; logic must prioritize explicit derivations.  

  ### **Conclusion**  
  Our collaboration confirms that logical omniscience arises from a tension between normative ideals of belief and descriptive constraints on cognition. While we agree on formal properties and distinctions, we diverge on whether epistemic logic’s normative core should define "knowledge" or yield to psychological reality. Resolving this framing deepens—but does not dissolve—our disagreement on the nature of rationality and knowledge.  

  ---  
  *Signed,*  
  *Dr. Elena Voss*  
  *Dr. Marcus Chen*  
  *Date: 10 November 2023*
