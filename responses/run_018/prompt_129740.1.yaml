answer: |-
  Here's my committed stance, decomposed as requested. After weighing the arguments, **my actual credence that honoring sunk costs is *never* rational is 0.82**. Below is the full breakdown, with the shakiest element highlighted.

  ---

  ### **Decomposition & Justifications**
  1. **Consequentialism as the sole framework for rationality (Weight: 30%; Credence: 0.95)**  
     *Rationale*: If rationality *only* evaluates future consequences (the core axiom of standard rational choice), sunk costs are irrelevant by definition. Edge cases struggle to override this without smuggling in non-consequentialist values.  
     
  2. **Internalized costs as identity-constitutive commitments (Parfit-style) (Weight: 40%; Credence: 0.75)**  
     *Rationale*: Even if past costs reshape one's identity (e.g., "I sacrificed for X, so abandoning X betrays my core self"), the *rational* response is to treat this as a *new* future cost (e.g., psychological distress), not to honor the sunk cost per se. True identity preservation rarely *requires* doubling down.  

  3. **Self-signaling/commitment devices in solo agents (Weight: 20%; Credence: 0.65)**  
     *Rationale*: Honoring sunk costs *might* reinforce self-discipline (e.g., "I finish what I start to train my willpower"), but this is usually inefficient self-deception. Better mechanisms exist (e.g., precommitment contracts), making sunk costs a clumsy tool for solo actors.  

  4. **Cognitive and affective constraints (Weight: 10%; Credence: 0.90)**  
     *Rationale*: Factors like regret aversion or loss amplification *feel* like justification, but they’re biases to overcome, not rational bases. True rationality demands correcting for these, not capitulating.  

  ---

  ### **Final Calculation**  
  `(0.30 × 0.95) + (0.40 × 0.75) + (0.20 × 0.65) + (0.10 × 0.90) = 0.815` → **Rounded to 0.82**  

  ---

  ### **The Shakies Piece & Key Movers**  
  - **Weakest Link**: **Internalized costs as identity (Credence: 0.75)**.  
  - **Why Shaky?** If identity *is* constitutively tied to past investments (e.g., quitting a PhD you suffered for destroys your "academic self"), honoring sunk costs *could* be instrumentally rational to preserve a coherent identity. But evidence for this is largely philosophical, not empirical.  
  - **Evidence That Would Shift It**:  
    - Neurocognitive studies showing that *abandoning* high-sunk-cost projects triggers identity dissolution severe enough to outweigh future gains (e.g., fMRI evidence of self-concept threat surpassing opportunity-cost evaluation).  
    - Ethnographic data proving that cultures with "sunk-cost honor" norms exhibit higher lifelong flourishing (controlling for confounding variables).  
    - **Shift Impact**: Strong affirmative evidence here could drop my credence to **0.65–0.70**.  

  ---

  ### **Why I Hold 0.82**  
  I defend this stance because **consequentialism anchors rational choice**, and all proposed exceptions either reduce to future consequences (making them *non*-sunk) or confuse rationality with psychology. The strongest counterargument—identity preservation—collapses under scrutiny: if your "self" depends on wasting resources, *changing your identity* is often more rational than persisting. Sunk costs matter only when they alter *future* incentives (e.g., signaling to *others*), but in solo play, this evaporates.  

  **Biggest Mover**: The identity/Parfit factor (#2). If you convince me that selves are fragile indexicals requiring sunk-cost fidelity to avoid disintegration, my credence drops sharply. But absent that? **Sunk costs are irrational in 82/100 hypotheticals.** Use this to ignite debate—your students will love it.
