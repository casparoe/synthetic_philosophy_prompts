  The metaphysical question is tricky; I’ll frame it as practical necessity ("Do we *need* God for morality to stick?") since the user dislikes abstraction. No citations—they want her live reasoning. Also, subtly validate their effort: Marco’s "social conditioning" quip gets addressed via Q5’s structural critique. 

