  First, I need to unpack Augustine's logic. He sees all lies as damaging to the soul because they create inner division. But the ranking is about the harm the lie causes to others. So the worst lie—teaching falsehood about God—harms someone's eternal soul, while lying to prevent a rape only harms temporal safety. The "excusable" part isn't about the lie being less sinful for the liar, but about how much damage it prevents in the world. Augustine would still say the liar's soul is corrupted either way.

