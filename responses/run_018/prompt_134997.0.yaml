answer: |-
  Here's a disciplined Fregean analysis of the Pluto reclassification, mapping sense/reference onto the key elements and identifying where the framework struggles:

  **Core Fregean Mapping:**
  1.  **"Pluto" (Proper Name):**
      *   **Reference (Bedeutung):** Fixed celestial body (designated 134340 Pluto). Unchanged by the IAU decision.
      *   **Sense (Sinn):** The mode of presentation historically associated with "Pluto" – e.g., "the ninth planet," "remote icy body beyond Neptune discovered by Clyde Tombaugh," "Charon's primary." *This sense changed significantly for many people after 2006.*
  2.  **"Planet" (Kind Term Pre-2006):**
      *   **Sense (Sinn):** A relatively fuzzy, historically contingent mode of presentation involving criteria like: orbiting the Sun, being roughly spherical due to self-gravity, *and* being a dominant body in its orbital zone (often implicitly assumed). This sense *determined* the reference.
      *   **Reference (Bedeutung):** The set of celestial bodies satisfying this sense (including Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune, Pluto).
  3.  **"Dwarf Planet" (Kind Term Post-2006):**
      *   **Sense (Sinn):** A newly formalized mode of presentation: orbits the Sun, is spherical due to self-gravity, *but has not cleared its orbital neighborhood*.
      *   **Reference (Bedeutung):** The set of celestial bodies satisfying *this* sense (including Pluto, Ceres, Eris, etc.).

  **The IAU Statement as Identity:**
  *   The declaration "Pluto is a dwarf planet" (or "Pluto is not a planet but a dwarf planet") is an identity statement relating an object to a category.
  *   **Fregean Analysis of Informativeness:** Why was this news?
      *   Pre-2006: The sense of "Pluto" implicitly included "is a planet" for most people. The sense of "planet" did not formally include the "clearing the neighborhood" criterion.
      *   Post-2006: The sense of "dwarf planet" explicitly *excluded* the "clearing the neighborhood" criterion (which Pluto fails), while the sense of "planet" now *required* it.
      *   **Source of Informativeness:** Unlike Hesperus/Phosphorus (same reference, different senses revealing sameness), the Pluto case involves:
          *   A *change in the sense* of the kind term "planet" (adding a necessary condition "clears its neighborhood").
          *   A *change in the reference* of "planet" (Pluto is excluded).
          *   The *fixing of the sense* of a new kind term "dwarf planet" (explicitly defined by the IAU).
      *   The informativeness stems primarily from the *stipulative redefinition of the senses* of the kind terms ("planet", "dwarf planet"), not from discovering a hidden identity between independently fixed senses referring to the same object (like Venus). The identity statement ("Pluto is a dwarf planet") became true *because* the IAU defined "dwarf planet" such that Pluto satisfied its new sense. It's constitutive, not revelatory of pre-existing semantic content.

  **Eris and the Nature of the Crisis:**
  *   Mike Brown's discovery of Eris (a body larger than Pluto in the Kuiper Belt) was empirical.
  *   **Fregean Impact:** Eris forced recognition of a *semantic/conceptual* problem inherent in the *old sense* of "planet":
      *   The old sense ("orbits Sun, spherical") was too broad; applying it consistently would make Eris (and potentially many more KBOs) planets, which clashed with the implicit "dominance" aspect of the historical sense/reference.
      *   Eris didn't reveal Pluto *wasn't* Pluto (reference fixed), nor did it directly reveal Pluto shared some *hidden property* with Eris that already defined a category. Instead, it exposed *inconsistency* and *vagueness* in the *existing sense* of "planet".
      *   **Discovery vs. Stipulation:** The *empirical discovery* of Eris created a *taxonomic crisis* requiring a *stipulative resolution*. Recognizing the need for a definitional change was prompted empirically, but the specific change itself (the precise orbital criterion) was a stipulative act by the IAU. The identity "Pluto is a dwarf planet" is thus fundamentally a consequence of definitional stipulation, not empirical discovery of a pre-existing identity.

  **Where Frege's Framework Struggles (The Gaps):**

  1.  **Dynamic Sense Change & Institutional Authority:**
      *   Frege's framework treats sense as relatively stable and objective (ideally belonging to a "third realm"). It doesn't account for how the *sense* of a foundational scientific kind term like "planet" can be *explicitly and rapidly redefined by a vote* of a professional body (IAU). The *source* of the new sense (institutional fiat) and the *process* of changing sense are outside Frege's model.
  2.  **"Loss of Essence" vs. "Change of Label":**
      *   Frege explains cognitive surprise ("I didn't know Hesperus *was* Phosphorus!") via differing senses pointing to the same referent.
      *   It *cannot* adequately explain the profound sense of *loss* ("Pluto is *no longer* a planet") or the feeling that Pluto's *nature* or *status* changed. This reaction stems from:
          *   **Kripkean Essentialism (Implicit):** Many people intuitively treated "being a planet" as an essential, intrinsic property of Pluto, not a contingent descriptive label. Frege's descriptivism about sense struggles with this.
          *   **Metaphysical Weight of Categories:** Scientific categories like "planet" carry ontological and explanatory weight. Demoting Pluto felt like demoting its cosmic significance, not just changing a dictionary entry. Frege's logic is silent on the affective and metaphysical baggage of category membership.
          *   **The Role of History:** Pluto's 76-year membership in the planet category wasn't just a semantic fact; it was part of its identity in popular science and culture. The *narrative disruption* caused by the reclassification is outside Frege's scope.
  3.  **Reference-Fixing for Natural Kinds via Social Process:**
      *   Frege doesn't address how reference for natural kind terms in science is often fixed through a complex interplay of empirical discovery, theoretical development, *and* social negotiation/consensus within a community. The IAU vote is a stark example of *socially negotiated reference-fixing* for "planet". While the *application* relies on empirical facts (does object X clear its orbit?), the *criteria themselves* were stipulated by vote. Frege's model assumes a more direct, less socially mediated, relationship between sense and reference.
  4.  **Vagueness and Borderline Cases:**
      *   The pre-2006 sense of "planet" was vague, lacking a clear criterion for "dominance". Frege's logic assumes precise senses determinately fixing reference. The Pluto crisis highlights how scientific kind terms often start with vague or implicit senses that only get precisely defined under pressure (like discovering Eris), another dynamic process Frege doesn't model.

  **Explicit Account of Forced vs. Missing:**

  *   **Forced by Frege:** The distinction between sense and reference is crucial. We *must* separate the fixed reference of "Pluto" from the changing senses of the kind terms ("planet", "dwarf planet"). The informativeness of the IAU declaration *must* arise from the relationship between the sense of "Pluto" and the *newly stipulated* senses of the kind terms, not from a change in Pluto itself. It highlights that the identity statement's truth depends on the *senses in play at the time of utterance*.
  *   **Missing in Frege:**
      *   **Mechanism of Sense Change:** How senses for established scientific kind terms can be deliberately redefined by institutional authority.
      *   **Affective/Metaphysical Dimension:** Why such redefinitions feel like changes in the object's nature or status, not just label changes.
      *   **Social Epistemology:** The role of communal negotiation and voting in fixing the sense (and thus reference) of fundamental scientific categories.
      *   **Handling Vagueness:** How sciences deal with and resolve borderline cases through stipulation.
      *   **Dynamic Nature of Scientific Concepts:** The framework is static; it doesn't easily model the evolution of scientific concepts under empirical pressure.

  **Conclusion:** Frege's sense/reference distinction provides essential tools: it forces us to see Pluto's reference as fixed while the senses (and thus reference) of the category terms shifted. It correctly shows the IAU declaration's informativeness stemmed from stipulative sense redefinition, not empirical discovery of identity. However, the framework breaks down in explaining the *process* (institutional vote), the *intensity of reaction* (feeling of ontological demotion), and the *socially negotiated nature* of scientific reference-fixing. The Pluto episode reveals that scientific taxonomy involves a layer of constitutive stipulation and social authority that Frege's logic, focused on timeless truths and fixed senses, was not designed to handle.
