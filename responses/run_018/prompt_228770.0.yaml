  Honest assessment: Relativization might insulate the view from refutation since any counterexample could be dismissed as using the wrong framework. But this isn't necessarily a defect; it might be the cost of capturing the concept. The key is whether the framework choice can be justified non-arbitrarily, perhaps through empirical success or coherence.

