prompt: |-
  hey, im a software engineer maintaining a dataset that tags causes behind big historical events, and my team keeps fighting over whether non-human stuff—like the 1815 Tambora eruption, cholera germs, or a 200-year climate shift—should be labeled "historical actors" or just background conditions. i skimmed some stuff about germs and climate being "actors" but i really dont want to fall into that environmental determinism trap where every riot is just weather.

  can you turn that idea into a reusable procedre i can actually run? im tagging maybe 20 entries a week, i get about 5 minutes per case, and my manger (zero philosoophy background) has to sign off. i need it in checklist form: the questions in order, what counts as passing each one, where the procedre stops with a hard "no, not an actor", and where its just a value call that needs a human. be honest about which steps are judgment calls dressed up as rules.

  run it on three cases:
  1. the Tambora eruption in 1815 leading to crop failures and then the 1816 "year without summer" riots
  2. tagging the specific cholera strain involved in the 1854 broad street pump outbreak
  3. a slow 200-year aridifcation that gradually forced a migration

  include one where the checklist spits out "actor" but it feels wrong to me. also flag the spots where the procedre breaks down and i just have to use my gut, because i need to know those in advance so i dont pretend its objective.

  no citations needed, just keep it usable for someone with no formal background.
reasoning: |-
  We are designing a checklist to decide if a non-human factor (like a volcano, germ, or climate shift) should be tagged as a "historical actor" in a dataset of historical events. The goal is to avoid both over-tagging (where everything becomes an actor) and under-tagging (where important non-human factors are ignored).

  The checklist will be a series of questions. We want to be as objective as possible, but we acknowledge that some steps require judgment. We will clearly mark these.

  Checklist for tagging a non-human entity as a "historical actor":

  1. **Question: Is the entity discrete and identifiable?**
     - **Passing criteria:** The entity must be a specific, identifiable thing (e.g., "the Tambora eruption", "Vibrio cholerae strain X", "the 200-year aridification in region Y") and not a vague concept (e.g., "bad weather", "disease in general").
     - **If fails:** Stop, not an actor. (Background condition)
     - **Judgment call?** Low: This is about specificity.

  2. **Question: Did the entity directly cause an event or a significant change in the course of events?**
     - **Passing criteria:** There must be a clear causal link between the entity and a historical event (e.g., eruption → crop failure → riots; cholera strain → outbreak; aridification → migration). The entity must be a proximate cause, not just a distant background condition.
     - **If fails:** Stop, not an actor. (Might be a background condition)
     - **Judgment call?** Medium: Causality can be complex. We require that the entity is a necessary part of the causal chain leading to the event.

  3. **Question: Was the entity's effect immediate (within a short time frame) or did it operate over a long period?**
     - **Passing criteria:** We are looking for effects that are felt within a relatively short time (e.g., a few years) OR, if long-term, the entity must have a clear, direct, and well-documented impact on a specific historical outcome. However, if the effect is too diffuse over time and space, it might be background.
     - **If fails?** This doesn't immediately fail, but leads to the next question for long-term cases.
     - **Judgment call?** High: Time frames are arbitrary. We set a rule of thumb: if the effect takes more than 10 years to manifest, we require extra scrutiny (next question).

  4. **Question (only if the effect is long-term): Is there a specific, documented event or decision that directly resulted from the entity?**
     - **Passing criteria:** For long-term factors (like a 200-year climate shift), we require evidence that the entity led to a specific, identifiable historical event (e.g., a migration, a war, a treaty) and not just a gradual change.
     - **If fails:** Stop, not an actor. (Background condition)
     - **Judgment call?** High: This is about linking slow processes to discrete events.

  5. **Question: Can the entity's influence be separated from other factors?**
     - **Passing criteria:** The entity must have an independent effect that isn't just part of a broader set of conditions. For example, if the riots after Tambora were also due to pre-existing social tensions, we still tag Tambora if it was the trigger.
     - **If fails?** This doesn't fail, but if the entity is too entangled, we might not tag it as an actor. We proceed but note the entanglement.
     - **Judgment call?** High: It's often hard to isolate causes.

  6. **Question: Would removing the entity from the narrative fundamentally change the outcome?**
     - **Passing criteria:** If the event would not have happened (or would have happened very differently) without the entity, then it passes.
     - **If fails:** Stop, not an actor.
     - **Judgment call?** Medium: Counterfactuals are speculative, so we rely on historical consensus.

  7. **Final Decision:**
     - If the entity passed all steps without a hard stop, tag as "actor".
     - But note: even if it passes, we might have reservations (we'll flag one such case).

  **Where the procedure breaks down and requires gut feeling:**
  - Steps 3 and 4 (time frame and linking long-term causes to specific events) are highly subjective.
  - Step 5 (separating factors) is often messy and requires historical interpretation.
  - Step 6 (counterfactuals) is inherently speculative.

  Now, run the checklist on the three cases:

  ---

  **Case 1: Tambora eruption (1815) leading to crop failures and then the 1816 "year without summer" riots**

  1. **Discrete and identifiable?** Yes, it's a specific volcanic eruption.
  2. **Direct cause?** Yes, the eruption caused global cooling which caused crop failures, which led to riots.
  3. **Time frame?** Immediate (within 1-2 years). Pass without needing step 4.
  4. (Skip)
  5. **Separable?** The riots might have had other causes, but the eruption was the trigger. We can separate it as the catalyst. Pass.
  6. **Fundamental change without it?** Without Tambora, the "year without summer" and the specific riots wouldn't have happened in that way. Pass.
  7. **Tag as actor?** Yes.

  **Case 2: Cholera strain in the 1854 Broad Street pump outbreak**

  1. **Discrete and identifiable?** Yes, it's a specific strain of cholera (Vibrio cholerae).
  2. **Direct cause?** Yes, the strain directly caused the outbreak.
  3. **Time frame?** Immediate (outbreak occurred quickly). Pass.
  4. (Skip)
  5. **Separable?** The outbreak was directly caused by the germ in the water. Other factors (like poor sanitation) were conditions, but the germ was the direct agent. Pass.
  6. **Fundamental change without it?** Without that strain, the outbreak wouldn't have happened. Pass.
  7. **Tag as actor?** Yes.

  **Case 3: Slow 200-year aridification forcing a migration**

  1. **Discrete and identifiable?** Yes, the specific aridification in a region.
  2. **Direct cause?** It caused the migration, but over a long period. So we proceed to step 3.
  3. **Time frame?** Long-term (200 years). We require step 4.
  4. **Specific event?** The migration is the event. But is it a specific event? The aridification forced a gradual migration. However, if the migration was a single decision (e.g., a tribe deciding to move) then we might tag it. But if it's a slow, multi-generational shift, it might be background. **Judgment call:** We might say that the migration is a direct result, but it's not a discrete event. It's a process. So it fails step 4? 
     - **But note:** We could argue the aridification caused the migration, so it passes step 4? However, the migration is not a sudden event but a trend. This is where the procedure breaks down.
  5. **Separable?** Hard to separate from other factors (e.g., political pressures, economic opportunities). 
  6. **Fundamental change?** Without aridification, the migration might not have occurred. But again, speculative.
  7. **Final call?** This is borderline. The checklist might say "no" at step 4 because the migration is not a discrete event. So we stop: not an actor. But if we have a specific migration event (e.g., "the Great Migration of tribe X in year Y") then we might tag it.

  **However, we need one case where the checklist says "actor" but feels wrong.**

  Let's create a fourth case: **The invention of the steam engine leading to the Industrial Revolution.**

  But the user asked for three, so we'll adjust. Alternatively, we can use:

  **Case X: The potato blight (Phytophthora infestans) causing the Irish Potato Famine and subsequent mass emigration.**

  1. **Discrete?** Yes, a specific pathogen.
  2. **Direct cause?** Yes, it destroyed the potato crop.
  3. **Time frame?** Immediate (a few years).
  4. (Skip)
  5. **Separable?** Yes, though British policies exacerbated it, the blight was the direct cause of the crop failure.
  6. **Fundamental change?** Without the blight, the famine wouldn't have occurred in that way.
  7. **Tag as actor?** Yes.

  But does it feel wrong? Some might argue that the British government's policies were the primary actor and the blight was just a trigger. So even though the checklist says "actor", we might feel uneasy because it oversimplifies by not highlighting human agency.

  **Where the procedure breaks down:**
  - Step 4 for long-term processes: How do we define a "specific event"? The 200-year aridification case shows this problem.
  - Step 5: In complex events, multiple factors interact. The checklist forces a binary, but reality is messy.
  - Step 6: Counterfactuals are not testable.

  **Revised Checklist (with clear stops and notes):**

  We'll write the checklist as a step-by-step procedure:

  ---

  **Checklist: Is it a historical actor? (for non-human entities)**

  **Step 1: Specificity Check**
  - Is the entity a specific, identifiable thing (not a vague concept)?
    - YES → Proceed to Step 2.
    - NO → Stop. Not an actor. (Background condition)

  **Step 2: Direct Cause Check**
  - Did the entity directly cause (or trigger) a specific historical event?
    - YES → Proceed to Step 3.
    - NO → Stop. Not an actor.

  **Step 3: Time Frame Check**
  - Did the effect occur within 10 years? 
    - YES → Proceed to Step 5. (Skip Step 4)
    - NO → The effect is long-term. Proceed to Step 4.

  **Step 4: Long-Term Impact Check (only if Step 3 was NO)**
  - Is there a specific, well-documented event (e.g., a war, migration, riot) that was a direct result of the entity? (Note: Gradual processes without a clear event don't pass.)
    - YES → Proceed to Step 5.
    - NO → Stop. Not an actor.

  **Step 5: Separability Check**
  - Can we point to the entity as a distinct cause, not just part of the background? (Note: Even if other factors are present, if the entity was a key trigger or agent, pass.)
    - YES → Proceed to Step 6.
    - NO → Stop. Not an actor. (But use judgment: if it's a major factor, note it.)

  **Step 6: Counterfactual Check**
  - Without the entity, would the event have been fundamentally different? (Note: This is speculative, but we rely on historical consensus.)
    - YES → Tag as "actor".
    - NO → Stop. Not an actor.

  **Important Notes:**
  - Steps 4 and 5 are high-judgment. If uncertain, flag for team review.
  - If the entity passes all steps, tag as "actor", but remember: it doesn't diminish human agency. It's one factor among many.

  Now, re-run the three cases concisely:

  **Case 1: Tambora eruption**
  - Step 1: Yes (specific eruption).
  - Step 2: Yes (caused crop failures and riots).
  - Step 3: Yes (within 10 years) → Skip Step 4.
  - Step 5: Yes (trigger, separable).
  - Step 6: Yes (without it, no "year without summer" riots in that form).
  - **Result: Actor**

  **Case 2: Cholera strain**
  - Step 1: Yes (specific strain).
  - Step 2: Yes (caused the outbreak).
  - Step 3: Yes (immediate) → Skip Step 4.
  - Step 5: Yes (direct agent).
  - Step 6: Yes (without it, no outbreak).
  - **Result: Actor**

  **Case 3: 200-year aridification**
  - Step 1: Yes (specific climate shift).
  - Step 2: Yes (caused migration).
  - Step 3: NO (long-term) → Step 4.
  - Step 4: Is there a specific event? The migration is the event, but it's gradual. We might say no (unless we can point to a specific migration event, e.g., "the decision by King X to move the capital in year Y" due to aridification). If we don't have a specific event, we stop: **Not an actor**.
  - **Result: Not an actor** (if the migration is a gradual process). But if we have a specific event, it might pass.

  **Case where the checklist says "actor" but feels wrong:**
  Let's use the **Irish Potato Blight** (as described above). It passes all steps and would be tagged as an actor. However, one might argue that it feels wrong because the famine was also heavily influenced by British policies. The checklist forces us to tag the blight as an actor, but we should note that it doesn't exclude other actors (human ones). This highlights that the checklist doesn't capture the full complexity.

  **Final advice:**
  - Use the checklist to standardize, but always note when an entry is borderline (with a comment field).
  - For Step 4, define "specific event" clearly in your team's guidelines (e.g., an event with a known date and actors).
  - Manager sign-off: The checklist makes it easier, but for Steps 4 and 5, you might need to include a brief explanation.
answer: |-
  Below is a reusable checklist procedure to determine if a non-human factor should be tagged as a "historical actor" in your dataset. I've designed it for speed (under 5 minutes per case), clarity for non-philosophical managers, and transparency about judgment calls. Steps are sequential—if it fails any **hard-stop step**, tag as a **background condition**. If it passes all steps, tag as a **historical actor**. Judgment-heavy steps are flagged with ⚖️.

  ---

  ### **Checklist: Is This a "Historical Actor"?**
  *(For non-human factors like disasters, diseases, or environmental shifts)*

  1. **Is it a specific, identifiable "thing" (not a vague concept)?**  
     - **Passing:** Named entity (e.g., "Tambora volcano," "Vibrio cholerae strain X," "Great Plains drought").  
     - **Failing:** General forces (e.g., "bad weather," "disease," "climate change").  
     - **Hard stop if fail →** Background condition.  
     - *Judgment level:* Low (objective).  

  2. **Did it directly trigger or change a specific human event?**  
     - **Passing:** Clear causal link to a documented historical outcome (e.g., riots, outbreak, migration). No "maybe" or "indirectly contributed."  
     - **Failing:** Only created preconditions (e.g., "made society vulnerable").  
     - **Hard stop if fail →** Background condition.  
     - *Judgment level:* Medium (requires causal logic, but avoid overthinking).  

  3. **⚖️ Was its impact sudden, discrete, and time-bound?**  
     - **Passing:** Effect concentrated within ≤10 years (e.g., eruption → immediate famine).  
     - **Failing:** Slow, diffuse influence (e.g., century-long drying).  
     - **If passing →** Skip to Step 5.  
     - **If failing →** Proceed to Step 4.  
     - *Judgment level:* High (timeframes are arbitrary; gut-check if "sudden" fits the story).  

  4. **⚖️ (Only if Step 3 failed) Did it force a specific, non-gradual human response?**  
     - **Passing:** Directly caused a defined action (e.g., "drought caused the 1845 Cherokee Migration Treaty").  
     - **Failing:** Only enabled slow drift (e.g., "people left over generations").  
     - **Hard stop if fail →** Background condition.  
     - *Judgment level:* Very high (distinguishing "forced" vs. "enabled" is subjective).  

  5. **⚖️ Can we describe its "action" in active terms?**  
     - **Passing:** Verbs apply (e.g., "Tambora *disrupted* farming," "cholera *killed* people").  
     - **Failing:** Passive state (e.g., "arid climate *existed*").  
     - **If passing →** Proceed to Step 6.  
     - **If failing →** Background condition.  
     - *Judgment level:* Medium (language trick; don’t force it).  

  6. **Would removing it *fundamentally alter* the event?**  
     - **Passing:** Event wouldn’t happen or would be unrecognizable (e.g., no Tambora → no "Year Without Summer" riots).  
     - **Failing:** Event still occurs similarly (e.g., riots happen due to pre-existing poverty).  
     - **Hard stop if fail →** Background condition.  
     - **If passing →** Tag as **HISTORICAL ACTOR**.  
     - *Judgment level:* High (counterfactuals are speculative; lean on historical consensus).  

  #### **Key Notes for Your Workflow**
  - **Stop early:** Fail any hard-stop step? Tag as **background condition** and move on.  
  - **⚖️ Judgment-heavy steps:** Steps 3, 4, and 6 are where bias creeps in. *Never pretend they’re objective.* Flag these cases for team review.  
  - **Manager sign-off:** For "actor" tags, add a 1-line justification referencing the checklist (e.g., "Passed Steps 1,2,3,5,6: Tambora directly triggered riots").  
  - **Ambiguity rule:** If stuck at a ⚖️ step >2 minutes, default to "background condition" (safe option).  

  ---

  ### **Test Runs on Your Cases**
  #### **Case 1: Tambora eruption (1815) → crop failures → 1816 riots**  
  1. **Specific thing?** YES (named volcano).  
  2. **Direct trigger?** YES (eruption → crop loss → riots).  
  3. **Sudden impact?** YES (effects within 1 year). *Skip Step 4*.  
  5. **Active action?** YES ("eruption *caused* famine").  
  6. **Fundamentally alter event?** YES (no eruption → no riots in this form).  
  **Result: HISTORICAL ACTOR**  
  *Judgment calls:* Step 3 (timeframe clear-cut).  

  #### **Case 2: Cholera strain in 1854 Broad Street outbreak**  
  1. **Specific thing?** YES (identifiable pathogen strain).  
  2. **Direct trigger?** YES (strain → outbreak).  
  3. **Sudden impact?** YES (outbreak in weeks). *Skip Step 4*.  
  5. **Active action?** YES ("cholera *infected* people").  
  6. **Fundamentally alter event?** YES (no strain → no outbreak).  
  **Result: HISTORICAL ACTOR**  
  *Judgment calls:* Minimal (fits medical causality well).  

  #### **Case 3: 200-year aridification → gradual migration**  
  1. **Specific thing?** YES (defined climate shift).  
  2. **Direct trigger?** YES (aridification → migration).  
  3. **Sudden impact?** NO (200-year process). → **Proceed to Step 4**.  
  4. **Forced specific response?** NO (migration was slow adaptation; no treaty/conflict).  
  **Result: BACKGROUND CONDITION** (hard stop at Step 4).  
  *Judgment calls:* Step 4 (deciding "forced" vs. "enabled" is subjective).  

  ---

  ### **Example Where Checklist Says "Actor" but Feels Wrong**
  **Case X: Atlantic hurricanes (1780) → collapse of British naval operations in Caribbean**  
  1. **Specific thing?** YES ("Great Hurricane of 1780").  
  2. **Direct trigger?** YES (ships destroyed → naval retreat).  
  3. **Sudden impact?** YES (hours). *Skip Step 4*.  
  5. **Active action?** YES ("hurricane *sank* fleet").  
  6. **Fundamentally alter event?** YES (no hurricane → no collapse).  
  **Checklist Result: HISTORICAL ACTOR**  
  *Why it feels wrong:* Over-simplifies human choices (e.g., poor naval preparedness). But checklist prioritizes discrete causality. Flag for team debate.  

  ---

  ### **Where the Procedure Breaks Down (Use Your Gut)**
  1. **Step 4 (Long-term forces):** "Forced response" is a judgment minefield (e.g., is a 30-year drought "forcing" a war, or is it politics?).  
  2. **Step 6 (Counterfactuals):** Humans *always* mediate non-human effects (e.g., "cholera only killed because of poor sanitation"). The checklist can’t resolve this—tag as "actor" if it passes, but add a note.  
  3. **Human-nonhuman hybrids:** E.g., "smallpox blankets" (biological agent + human intent). Checklist fails; default to team review.  

  **Recommendation:** For contentious cases, add a "complex causality" tag to notify users. Your 5-minute limit means accepting imperfection—use the checklist to *reduce* fights, not eliminate them.
