  - The continuity scoring might be too abstract. Remedy: Use a visible grid with tokens to make it tangible.
  - Players might focus only on their current stage. Remedy: Remind them of the continuity bonus and the messages from previous stages.

  6. Honest Limitation (approx. 150 words)

  The activity necessarily fails to reproduce the non-existence of the aggregates themselves. In the game, the aggregates are reified as distinct entities with fixed goals, but in Buddhism, even the aggregates are empty (void of intrinsic nature). The game treats them as real streams, whereas ultimate truth sees them as dependently arisen and without essence. The facilitator must clarify that the aggregates are merely a heuristic and that the activity's structure is itself a conventional tool. Also, the game's scoring imposes an external framework, but in reality, there is no scoring system — the unsatisfactoriness (dukkha) of clinging to any aggregate is the point. The facilitator must emphasize that the game's mechanics are a scaffolding to be dismantled in understanding anattā.

