  5-15 min: Childhood (age 10) group deliberates and decides. They post their decision and mark the Continuity Board. Write a message to the next stage.

  15-25 min: Young Adult (25) group receives the message, deliberates, decides, posts, and writes a message.

  25-35 min: Midlife (40) group: same.

  35-45 min: Old Age (70) group: same.

