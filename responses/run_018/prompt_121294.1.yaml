answer: |-
  Below is a comprehensive exam package centered on your specified crux, integrating positional goods and the selection-vs-improvement analogy. The question forces engagement with the elasticity of the comparator set and collective-action problems, while sidestepping rehearsed disability debates.

  ---

  ### **1. Exam Question**  
  **Ethics of Procreative Beneficence (60 minutes, 1000 words, 30 marks)**  

  *Background:* You are a reproductive ethics advisor at a fertility clinic. A couple, Alex and Sam, have four blastocysts after IVF. The clinic’s polygenic scoring report ranks them as follows:  

  | Embryo | Height (Percentile) | Educational Attainment (EA) (Percentile) | Health Traits |  
  |--------|---------------------|------------------------------------------|--------------|  
  | A      | 94th                | 92nd                                     | Low risk     |  
  | B      | 44th                | 95th                                     | Low risk     |  
  | C      | 50th                | 40th                                     | Low risk     |  
  | D      | 88th                | 45th                                     | Moderate risk |  

  The couple can:  
  - Transfer one embryo now.  
  - Pay $15,000 for another stimulation cycle to generate 2–4 additional embryos.  
  - Delay transfer by 6 months to save for another cycle.  

  *Question:*  
  Alex and Sam endorse the principle of **procreative beneficence** (PB): "Select the child, of those you *could* have, expected to have the best life." Advise them on whether PB obligates them to:  
  (i) Select Embryo A or B now (justify your choice), **or**  
  (ii) Pursue another cycle.  

  In your analysis, **you must address**:  
  - **The comparator-set problem**: Does "could have" include *only* existing embryos, or *also* future possible children from another cycle? How does PB’s coherence depend on how this set is defined?  
  - **The positional-goods problem**: How might selecting for height or EA (where societal advantage depends on *relative* standing) undermine PB’s goal if all parents act similarly?  
  - **The improvement objection**: Sam argues: "We wouldn’t sell our house to fund elite schooling for an existing child. Why spend $15k for a *slightly* 'better' embryo?" Is this analogy defensible? Why/why not?  

  *Your response must take a clear stance*: Either defend PB’s applicability to this case (specifying its scope) or reject it as unworkable here. Avoid generic objections to PB.  

  ---

  ### **2. Model Answer (830 words)**  

  Alex and Sam cannot satisfy PB coherently. PB collapses when applied to elastic comparator sets and positional goods, making their embryo choice arbitrary and self-defeating. I advise selecting Embryo B now without another cycle, but *not* because PB demands it—rather, because PB fails as a guide here.  

  **I. The Comparator-Set Problem Undermines PB’s Authority**  
  PB requires selecting the best child from those "you could have." If "could have" means *only existing embryos*, PB is trivial: Embryo B has the highest EA (95th percentile) and low health risk, making it marginally "better" than A (whose height advantage is irrelevant; see §II). But this set is arbitrarily constrained. The couple *could* generate new embryos via another cycle. If PB includes *future possible children*, it becomes maximising and paralyzing: They should always do another cycle to improve odds of a "better" child, as traits like EA are polygenic and stochastic. Each cycle expands the option space, turning PB into an endless obligation. PB offers no non-arbitrary way to fix the set. If indexed to the current decision, PB ignores that earlier choices (e.g., starting IVF late) shaped this set. If expanded indefinitely, PB demands unreasonable sacrifices (e.g., infinite cycles). Thus, PB is either vacuously narrow or unworkably expansive—it cannot advise Alex and Sam meaningfully.  

  **II. Positional Goods Invert PB’s Logic**  
  PB assumes traits like EA or height boost well-being *absolutely*. Yet these are *positional*: Their value depends on distribution. If all parents select for 95th-percentile EA, the threshold for "advantage" rises, and no child gains a relative edge. Worse, a societal ratchet effect occurs: As selection escalates, parents must invest more (e.g., extra cycles) to achieve the *same* relative standing. For Alex and Sam, Embryo B’s 95th-percentile EA offers an edge *only if* others do not select similarly. Universal adherence to PB cancels out advantages, wasting resources. Height exemplifies this: Beyond health impacts, its benefits (e.g., higher income) derive from social ranking. Selecting taller embryos only shifts the distribution rightward, conferring no durable benefit. PB thus undercuts itself—it mandates actions that, if generalized, erase the welfare gains it sought. This is not a misreading of "best life" but a flaw in PB itself: It cannot address goods where individual and collective rationality diverge.  

  **III. The Improvement Analogy Fails Due to Identity Variance**  
  Sam’s objection—"We wouldn’t sell our house to improve an existing child’s prospects, so why spend $15k for a better embryo?"—falters on two grounds.  
  First, *improvement* (e.g., moving schools) alters an existing child’s environment, while *selection* chooses which child will exist. Sacrificing to improve an existing child is *supererogatory* (praiseworthy but not obligatory) because the child’s identity is fixed, and their claims on resources are bounded by parental autonomy. Selection, however, determines *who exists*. If PB holds, creating a "worse-off" child when a "better" one was possible harms that child—a claim that doesn’t apply to environmental improvements.  
  Second, *cost* matters asymmetrically. Spending $15k on an existing child might strain family resources, directly impacting their well-being. In selection, the $15k affects parental welfare pre-conception, but the selected child never bears the cost. However, PB’s maximizing logic (§I) could demand excessive spending (e.g., multiple cycles), indirectly harming future children via depleted resources. The analogy thus breaks: Selection’s identity-dependent obligations and pre-conception cost structure make it distinct from post-conception improvement.  

  **Conclusion: PB is Indeterminate Here**  
  PB fails Alex and Sam. Its comparator set is either implausibly narrow (only existing embryos) or oppressively expansive (include all possible cycles). Positional goods make its welfare metric self-defeating. The improvement analogy ignores identity and cost asymmetries. I recommend transferring Embryo B—not due to PB, but because moderate risks (Embryo D) should be avoided, and another cycle imposes financial/emotional burdens unjustified by PB’s incoherent demands. PB cannot resolve this decision; other values (autonomy, pragmatism) must fill the void.  

  ---

  ### **3. Marking Scheme (30 marks total)**  
  **A (25–30):** Defends/rejects PB *through* the crux; integrates all three problems; shows why the dilemma invalidates PB.  
  **B (18–24):** Addresses all three but superficially (e.g., names problems without linking them); or misses one layer.  
  **C (12–17):** Treats set as fixed; rehearses generic objections; ignores positional-goods ratchet; analogizes selection/improvement uncritically.  
  **D/F (0–11):** Misstates PB; focuses on disability/risk aversion; omits core components.  

  | **Component**                     | **Marks** | **A-grade moves**                                                                 | **Common Errors** |  
  |-----------------------------------|-----------|-----------------------------------------------------------------------------------|------------------|  
  | **Comparator-set problem**        | 10        | Shows PB’s collapse between fixed/elastic sets; notes arbitrariness of indexing.  | Assumes set is "naturally" fixed to embryos; ignores option-expanding choices (e.g., waiting). |  
  | **Positional-goods problem**      | 10        | Explains how universal adoption erases advantages; ties to PB’s self-defeat.      | Treats traits as absolute goods; misses collective-action issue. |  
  | **Improvement analogy**           | 6         | Identifies identity/cost asymmetries; rejects superficial parity.                 | Asserts analogy without scrutiny; conflates cost burdens. |  
  | **Structure/Clarity**             | 4         | Logical flow; avoids tangents; precise language.                                  | Unfocused; rehashes unrelated objections (e.g., eugenics). |  

  ---

  ### **Why This Works**  
  - **Forces engagement with the crux**: Students *must* confront set elasticity to score above a B. Positional goods prevent Savulescu-default responses.  
  - **Vignette design**: Embryo traits (height/EA) operationalize positional goods. Clinic options (delay/another cycle) make set elasticity concrete.  
  - **Kills stock objections**: No disability focus; analogies must be deconstructed; PB is attacked *internally* via its own logic.  
  - **Clear right/wrong**: Arguing PB gives clear advice (e.g., "just pick B") earns a C. A-graders show PB *fails* as a coherent principle here.  

  This question rewards students who see that PB’s "possible children" clause isn’t a footnote—it’s the trapdoor beneath the entire principle.
