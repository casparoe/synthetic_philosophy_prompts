  But for the thermodynamic accounting, we need to define the macrostates.

  Suppose at start, tape cell is in macrostate "state 0", low entropy.

  After use, it is in macrostate "state 1" or "state 0" with equal probability, but for a specific cycle, it is in "state 1", which is also low entropy.

  The difference is that the fresh cell is guaranteed to be in "state 0", while a used cell could be in either, but after writing, it is in a specific low-entropy state.

  However, to have a supply of cells all in "state 0", that requires preparation.

  When a cell is written, it changes to a different low-entropy state, but since the states are symmetric, no net change, but for the purpose of the demon, it needs cells in "state 0", so when it changes to "state 1", it is no longer useful for the demon unless reset.

  So the demon is consuming the "state 0" cells.

  Each consumption allows one cycle.

  The cost is to create a "state 0" cell from a random cell.

  In summary, Hana is correct, and Nils's paradox is resolved by recognizing the tape as a fuel.
