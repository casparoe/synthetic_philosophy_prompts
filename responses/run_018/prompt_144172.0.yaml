  I've been chewing over the statue and the clay problem since a rather messy disussion with frends in the pub last week, and I've ended up with a view that probably sounds a bit strange but I can't seem to drop it. I think the statue and the clay lump are literally one and the same object, but the reason we treat them differently isn't because there are two coincident things, and it isn't just a matter of how we describe the one thing either; rather, the persistence conditions we apply are indexed to different normative practices—art conservation behaviour versus geological classification behaviour—so the very same object carries different modal profiles depending on which practical framework we're operating in. It's one object with practice-relative identity conditions, if that makes sense, which means it can survive being squashed in one framework but not in another, without us needing to invent a second entity sitting in the same space. I'm taking a course on metaphyics and this seemed like a neat way out of the usual coincidence problem, but I want to know what would genuinely count against it, not just the standard two-things-in-one-place line that I think misses the point entirely. Which specific cases, formal results about persistence in organisms or clouds, or intuitions about destruction and repair would actually undermine this? I'd like you to rank the defeaters from fatal to merely awkward, say which ones a committed defender of this view would have to concede as damaging rather than dismiss, and be honest about whether I've qualified the position into unfalsifiability—if so, is that a real problem for a claim of this kind? Please also tell me what argument or observation would change your mind about your assessment and where your reasoning is most likely to go wrong. Write it all as continuous prose in an email or letter, with no headings, bullet points, bold text, or tables.
