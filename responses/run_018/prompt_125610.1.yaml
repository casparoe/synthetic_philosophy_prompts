answer: |-
  ### Dream Experience Taxonomy: A Sorting Hat for Sleep Mentations  
  *(Casual handout edition—typos may reflect sleep deprivation)*  

  ---

  **Branch 1: Does *any* phenomenal content occur during REM?**  
  *(Concrete case: "You wake up recalling intense emotions/images. Were they *felt/seen* during REM, or only fabricated on waking?")*  
  - **No** → **Hard Denial** (e.g., extreme eliminativism).  
    *Awkward commitment: Dismissing all dream reports as confabulation, ignoring neural parallels to waking perception.*  
  - **Maybe** → **Skeptical Agnosticism** (unnamed).  
    *Awkward commitment: Paralyzed by uncertainty; can’t engage debates about dream ethics or continuity.*  
  - **Yes** → **Branch 2**.  

  **Branch 2: Is lack of *concurrent reportability* a knock-down reason to deny it’s an experience?**  
  *(Concrete case: "If a dream isn’t reportable until waking, does that mean it wasn’t an experience *at all*?")*  
  - **Knock-down** → **Verificationist Denial** (Malcolm-inspired).  
    *Awkward commitment: Claiming eye-signal lucid dreams are "performance," not experience.*  
  - **Gap only** → **Branch 3**.  

  **Branch 3: Does the narrative unfold *in real-time* during REM?**  
  *(Concrete case: "You recall a 20-min dream. Was it playing second-by-second in REM, or compressed/loaded *only* when you woke?")*  
  - **Retrospective construction** → **Retrospective-Construction View** (Dennett-esque).  
    *Awkward commitment: Explaining why dreams *feel* lived-in-time if built during arousal.*  
  - **Real-time unfolding** → **Branch 4**.  

  **Branch 4: Does REM atonia + lack of working-memory encoding *degrade* the experience?**  
  *(Concrete case: "You dream of running but your body’s paralyzed and you won’t remember unless woken. Is it still 'full' running, or a fragment?")*  
  - **Matters (degraded)** → **Real-Time Fragment View** (e.g., "experience-like" proto-phenomenology).  
    *Awkward commitment: Defining "fragment" without smuggling in waking-experience criteria.*  
  - **Doesn’t matter (full)** → **Real-Time Full Experience View** (orthodox realism).  
    *Awkward commitment: Explaining why blocked motor feedback/memory doesn’t alter phenomenology.*  

  ---

  ### Unoccupied Combo & Ambiguities  
  - **🚫 Unoccupied Leaf: Real-Time + Intact Working-Memory/Motor Feedback**  
    *Why?* Incoherent for REM—physiology *prevents* this combo. Unexplored (and probably unattractive).  
  - **⚠️ Can’t Fully Distinguish:** Verificationists vs. Hard Deniers on *why* reports exist. Both call it illusion, but for diff reasons.  

  ---

  **Diagnostic Cheatsheet**  
  - **Hard Denial:** "Dream fear? You only *felt* it waking up."  
  - **Verificationist:** "No concurrent report? Not an experience, even with eye signals."  
  - **Retrospective:** "Your epic dream? Assembled on waking like a TikTok clip."  
  - **Real-Time Fragment:** "Dream-running feels 'off'—no body feedback, just a sketch."  
  - **Real-Time Full:** "Dream-running is identical to awake-running, glitches be damned."  

  Summary: The tree’s deepest split isolates dream-experience deniers from acceptors, then fractures acceptors over *when* (real-time vs. retrospective) and *how intact* (full vs. fragment) dreams unfold.
