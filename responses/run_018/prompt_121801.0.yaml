  We are to restate the Jain doctrine of anekāntavāda, specifically syādvāda and the saptabhaṅgī, using only the vocabulary of distributional semantics, contextual embeddings, entailment graphs, polysemy resolution, and dimensionality reduction.

  The core metaphysical claim: reality is irreducibly multi-faceted and no predicate applies unconditionally. We interpret this as a claim about semantic representations: the meaning of a predicate (as represented in a vector space or entailment graph) is context-dependent and never holds absolutely across all contexts.

  The saptabhaṅgī (seven modes) are:

  1. syād asti — in some respect it is (affirmation)
  2. syād nāsti — in some respect it is not (negation)
  3. syād asti nāsti — in some respect it is and is not (simultaneous affirmation and negation)
  4. syād avaktavyaḥ — in some respect it is inexpressible (inexpressibility)
  5. syād asti avaktavyaḥ — in some respect it is and is inexpressible
  6. syād nāsti avaktavyaḥ — in some respect it is not and is inexpressible
  7. syād asti nāsti avaktavyaḥ — in some respect it is, is not, and is inexpressible

  We must map each mode to an operation in an entailment or embedding space, specifying what is preserved and what must be distorted. We also note whether the mode has a direct analog or requires importing foreign ontological commitments.

  Then we provide a residue report, identifying:
  - What maps cleanly to how language models handle ambiguity, entailment failure, and context-dependence.
  - What requires distortion of either the doctrine or the semantic framework.
  - What has no expression in vector spaces and entailment graphs.

  Finally, we assess whether the untranslatable residue reveals a limitation of distributional semantics (e.g., missing normative or metaphysical dimension) or if the philosophical force of anekāntavāda depends on framing that doesn't survive formalization.

  Let's proceed step by step.

  **Restatement of the Doctrine in Semantic Terms:**

  Anekāntavāda (non-one-sidedness) claims that any entity's properties are contextually determined. In semantic terms: the truth of a predicate applied to an entity is not absolute but depends on the context of utterance. This context-dependence is irreducible and cannot be eliminated by further analysis without loss.

  Syādvāda (the theory of qualified predication) is the method of expressing this by qualifying every statement with "syāt" (in some respect). In our terms, every predication must be indexed to a context.

  The saptabhaṅgī are seven context-indexed assertion modes.

  **Mapping the Seven Modes:**

  We assume we have:
  - An entailment graph: nodes are predicates or propositions, edges are entailment relations (with possible weights or directions).
  - Embedding space: each word or phrase is a vector, and context is modeled by contextual embeddings (e.g., from a transformer model).

  We also assume operations such as:
  - Modality gates: functions that condition the representation on a context (e.g., context vectors modulating the base representation).
  - Partial entailment: a measure of how much a context supports an entailment (e.g., probability or similarity above a threshold).
  - Contradiction flag: a marker that two propositions are mutually exclusive in a given context.
  - Inexpressibility marker: a representation that the proposition cannot be assigned a truth value in the current context.

  Now for each mode:

  1. **syād asti** (in some respect it is):  
     Operation: In a specific context `c`, the predicate `P` holds for entity `e`.  
     Analog: Contextual embedding for `(e, P)` in context `c` yields a high similarity to the embedding of a prototypical true instance, or in an entailment graph, the context `c` activates an entailment edge from `e` to `P`.  
     Preserved: The context-dependence of truth.  
     Distortion: The Jain view may consider the context as a "respect" (a perspective or condition) which is more than just a linguistic context. We are reducing it to a vector or graph context.  
     Direct analog? Yes, as contextual truth.

  2. **syād nāsti** (in some respect it is not):  
     Operation: In context `c`, the predicate `P` does not hold for `e`.  
     Analog: Contextual embedding for `(e, P)` in `c` is dissimilar (or has high similarity to false instances), or the entailment graph in context `c` shows no entailment (or even contradiction) from `e` to `P`.  
     Preserved: Contextual falsehood.  
     Distortion: Same as above.  
     Direct analog? Yes.

  3. **syād asti nāsti** (in some respect it is and is not):  
     Operation: In context `c`, `P` both holds and does not hold for `e` — but note that this is not a contradiction in the same context? The Jain doctrine typically means that from two different perspectives within the same respect, it is and is not. However, in one and the same context, we cannot have both. So we must interpret "respect" as a more complex context that admits internal multiplicity.  
     Analog: We can model this as the context `c` being a compound of two sub-contexts `c1` and `c2`, such that in `c1` we have `asti` and in `c2` we have `nāsti`. Alternatively, we might use a representation that captures ambiguity: the embedding of `(e, P)` in `c` is in a region of the vector space that is between the true and false clusters, indicating ambiguity. In entailment graphs, we might have that `c` leads to both `P` and `not P` but with a contradiction flag.  
     Preserved: The idea of simultaneous co-presence of opposites in a complex context.  
     Distortion: In standard logic, this is a contradiction. Jainism avoids contradiction by relativizing to different aspects of the same respect. We are representing it as either ambiguity (which is not exactly the same) or as a compound of two contexts.  
     Direct analog? Partial: we can represent ambiguity, but not exactly the non-contradictory coexistence in one perspective. We have to import the idea that a context can have multiple facets without being split.

  4. **syād avaktavyaḥ** (in some respect it is inexpressible):  
     Operation: In context `c`, we cannot assert either `P` or `not P` for `e`.  
     Analog: The embedding of `(e, P)` in `c` is in a region of the vector space that is not close to either true or false (or has high entropy in prediction). In entailment graphs, the context `c` does not activate any entailment to `P` or to `not P`. We can set an inexpressibility marker.  
     Preserved: The failure of the semantic system to assign a truth value.  
     Distortion: Jainism might mean that the reality is beyond linguistic expression, whereas we are modeling it as a failure of the current representation.  
     Direct analog? Yes, as the absence of entailment and low confidence in prediction.

  5. **syād asti avaktavyaḥ** (in some respect it is and is inexpressible):  
     Operation: In context `c`, `P` holds for `e` in one aspect, but in another aspect (within the same respect) it is inexpressible.  
     Analog: We can model this as a context `c` that activates the predicate `P` for `e` in one feature subspace (or under one projection) but in another feature subspace, the representation is indeterminate. For example, after dimensionality reduction, one component supports `P` but another component is inexpressible. Alternatively, we can use a compound representation: `c` is split into two sub-contexts, one yielding `asti` and the other `avaktavyaḥ`.  
     Preserved: The co-occurrence of truth and inexpressibility in the same respect.  
     Distortion: We are again splitting the context. The Jain view might see this as a unified complex state.  
     Direct analog? Partial: requires composing the two operations.

  6. **syād nāsti avaktavyaḥ** (in some respect it is not and is inexpressible):  
     Operation: Similar to mode 5, but with `nāsti` and `avaktavyaḥ`.  
     Analog: As above, but with falsehood and inexpressibility.  
     Preserved and distortion: Same as mode 5.  
     Direct analog? Partial.

  7. **syād asti nāsti avaktavyaḥ** (in some respect it is, is not, and is inexpressible):  
     Operation: In context `c`, all three: `asti`, `nāsti`, and `avaktavyaḥ` apply in different aspects.  
     Analog: We can model this as the context `c` being split into three sub-contexts, each yielding one of the three. Alternatively, in the embedding space, we might have a high-dimensional point that, when projected onto three different axes, gives the three states.  
     Preserved: The complex multiplicity.  
     Distortion: We are fragmenting the context and not capturing the unity of the respect.  
     Direct analog? Partial: we can represent the composition, but not the holistic nature.

  **Residue Report:**

  - **Clean Mapping**:
    - Context-dependence of predication: This is directly modeled by contextual embeddings and entailment graphs that condition on context.
    - Partial truth and falsehood: We can model these via confidence scores, similarity measures, or partial entailment.
    - Inexpressibility: We can model as low confidence or absence of entailment.

  - **Requires Distortion**:
    - The idea of a single "respect" (or context) that simultaneously supports multiple, even seemingly contradictory, states without being split into sub-contexts. In our framework, we typically resolve this by either ambiguity (which doesn't capture the positive co-existence) or by breaking the context. This distorts the Jain view which sees these as non-contradictory aspects of the same reality.
    - The modes 3,5,6,7 require composing operations, but the Jain view presents them as irreducible complex states. Our composition might be seen as reducing them to simpler parts, which goes against the holistic nature of anekāntavāda.

  - **No Expression**:
    - The normative commitment of anekāntavāda: it is not just a description of language but a prescription for epistemic humility and non-violence in speech. This ethical dimension is absent in distributional semantics.
    - The metaphysical grounding: the Jain view is about the nature of reality, not just language. Our translation reduces it to a semantic phenomenon.
    - The idea that the seven modes are exhaustive and fundamental: in distributional semantics, we don't have a built-in seven-fold structure.

  **Conclusion:**

  The untranslatable residue includes the ethical imperative and the metaphysical claim that reality itself is multi-faceted. This reveals a limitation of distributional semantics: it is descriptive of language use but lacks normative and metaphysical dimensions. However, the formalization also shows that the philosophical force of anekāntavāda depends on a framing that does not survive the reduction to vector spaces and entailment graphs. Specifically, the doctrine's insistence on the non-contradictory unity of multiple aspects in one respect cannot be captured without either distorting it into context fragmentation or introducing a new representational device (like a multi-faceted vector that simultaneously holds multiple truth values). 

  Thus, while distributional semantics can model context-dependence, ambiguity, and partial truth, it cannot fully capture the Jain view without importing commitments that are foreign to its framework. This suggests that the philosophical force of anekāntavāda does depend on a framing that includes metaphysical and normative commitments that are not part of semantic representation per se.
answer: |-
  ### Restatement of Anekāntavāda in Semantic Vocabulary  
  Anekāntavāda asserts that reality is irreducibly multi-faceted, meaning no predicate applies unconditionally. In semantic terms, this maps to the claim that **lexical entailment relations are contextually unstable**: predicates exhibit **polysemy** and **context-dependent entailments** across different contextual embeddings. Truth values are never absolute but **probabilistic** or **partial**, conditioned on subspaces of the embedding space.  

  Syādvāda (qualified predication) is formalized as a **contextual modulation gate** applied to any assertion, where the gate activates only within specific **contextual subspaces**. The saptabhaṅgī (seven modes) are operations on **entailment vectors** or **graph nodes**, with truth values represented as **continuous scores** (e.g., entailment strength) rather than binaries.  

  ### Mapping the Saptabhaṅgī to Semantic Operations  
  1. **Syād asti** (in some respect it *is*):  
     - **Operation**: Partial entailment (e.g., `entail_score(e, P | c) > threshold`) in a contextual subspace `c`.  
     - **Preserved**: Contextual truth as high entailment strength.  
     - **Distortion**: Jain "respect" becomes a contextual vector subspace, losing ontological depth.  
     - **Analog**: Direct (e.g., BERT’s contextual entailment).  

  2. **Syād nāsti** (in some respect it *is not*):  
     - **Operation**: Entailment failure (e.g., `entail_score(e, P | c) < threshold` or high similarity to negation vectors).  
     - **Preserved**: Contextual falsehood as low entailment.  
     - **Distortion**: Reduces "non-being" to low vector similarity, ignoring metaphysical absence.  
     - **Analog**: Direct (e.g., contradiction detection in NLI tasks).  

  3. **Syād asti nāsti** (in some respect it *is and is not*):  
     - **Operation**: Ambiguity vector with high **entropy** (e.g., `[entail_score(e, P | c₁), entail_score(e, ¬P | c₂)]` where `c₁, c₂` are orthogonal subspaces).  
     - **Preserved**: Co-existing opposites as probabilistic ambiguity.  
     - **Distortion**: Jain simultaneity becomes context-switching; no unified "respect" in one vector.  
     - **Analog**: Partial (requires splitting context, unlike metaphysical unity).  

  4. **Syād avaktavyaḥ** (in some respect *inexpressible*):  
     - **Operation**: **Inexpressibility marker** (e.g., low `L2-norm` of the predicate vector in `c`, or high variance across embeddings).  
     - **Preserved**: Indeterminacy as undefined entailment.  
     - **Distortion**: Metaphysical ineffability becomes low model confidence.  
     - **Analog**: Direct (e.g., low prediction confidence in LMs).  

  5. **Syād asti avaktavyaḥ** (in some respect *is and inexpressible*):  
     - **Operation**: Conjunction of high entailment in subspace `c₁` and inexpressibility in `c₂` (e.g., `[high_entail(c₁), low_norm(c₂)]`).  
     - **Preserved**: Hybrid state as vector composition.  
     - **Distortion**: Jain unity fragmented into separable components.  
     - **Analog**: Partial (superposition without interdependence).  

  6. **Syād nāsti avaktavyaḥ** (in some respect *is not and inexpressible*):  
     - **Operation**: Conjunction of entailment failure in `c₁` and inexpressibility in `c₂` (e.g., `[low_entail(c₁), low_norm(c₂)]`).  
     - **Preserved**: Parallel to mode 5.  
     - **Distortion**: Same fragmentation.  
     - **Analog**: Partial.  

  7. **Syād asti nāsti avaktavyaḥ** (in some respect *is, is not, and inexpressible*):  
     - **Operation**: Triple conjunction via **attention-weighted sum** of modes 1, 2, and 4 across subspaces.  
     - **Preserved**: Multiplicity as vector arithmetic.  
     - **Distortion**: Reduces holistic reality to linear algebra.  
     - **Analog**: Partial (lacks intrinsic unity).  

  ### Residue Report  
  **Cleanly Mapped Elements**:  
  - **Context-dependence**: Contextual embeddings natively handle shifting entailments (e.g., "light" as *bright* vs. *not heavy*).  
  - **Partial truth**: Probabilistic entailment graphs model graded truth (e.g., "dog" entails "mammal" more strongly than "pet").  
  - **Inexpressibility**: Low-confidence predictions in ambiguous contexts (e.g., rare words or contradictory inputs) mirror *avaktavyaḥ*.  

  **Distorted Elements**:  
  - **Simultaneous opposites** (mode 3): Distributional semantics splits this into context fragments (e.g., "bank" as *river* vs. *finance*), losing the Jain unity of one "respect."  
  - **Compound modes** (5–7): Vector compositions are additive, not ontologically interdependent. Requires fragmenting the Jain "respect" into discrete subspaces.  
  - **Irreducibility**: Embedding spaces assume dimensions are reducible via **dimensionality reduction** (e.g., PCA), conflicting with Jain reality’s indivisible multiplicity.  

  **No Expression in Semantic Framework**:  
  - **Normative commitment**: Anekāntavāda’s ethical imperative (non-violence via epistemic humility) has no analog in entailment graphs.  
  - **Metaphysical unity**: The doctrine’s indivisible multi-faceted reality cannot be captured; vectors decompose into orthogonal components.  
  - **Exhaustive sevenfold schema**: No semantic basis for exactly seven modes; this is an arbitrary philosophical structure.  

  ### Conclusion: Untranslatable Residue and Limitations  
  The residue reveals **two limitations** of distributional semantics:  
  1. **Missing normative dimension**: The framework cannot encode anekāntavāda’s ethical prescription (e.g., "avoid dogmatism"), as vectors lack teleology.  
  2. **Metaphysical flattening**: By reducing "respects" to contextual subspaces, semantics strips the doctrine’s ontological depth (e.g., reality’s *inherent* indeterminacy vs. model uncertainty).  

  However, the philosophical force of anekāntavāda **depends on framing** that formalization dissolves:  
  - Its seven modes are a **didactic schema**, not a computational primitive. When mapped to vectors, they become arbitrary compositions of simpler operations.  
  - The doctrine’s resistance to "reduction" clashes with semantics’ reliance on **decomposition** (e.g., attention heads isolating features).  

  Thus, the untranslatable residue stems from anekāntavāda’s **extra-semantic commitments**—its metaphysical and ethical axioms—not a flaw in distributional semantics. The latter aptly models context-dependence but cannot inherit the doctrine’s normative weight or ontological holism without distortion.
