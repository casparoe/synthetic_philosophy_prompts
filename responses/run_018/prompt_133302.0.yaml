answer: |-
  The institutional pattern you describe indeed reveals a philosophically rich tension in how democratic states conceptualize memory's moral obligations. While no single coherent theory may fully underpin this split, the practice suggests an implicit hierarchy where remembrance becomes ethically compulsory primarily for events meeting specific criteria: scale (catastrophe affecting large populations), identifiable moral agents (clear perpetrators/victims), and perceived relevance to national identity or civic education. The mundane archive—individual medical histories, local court interactions, bureaucratic minutiae—lacks this symbolic resonance and thus falls outside the sphere of collective duty. This isn't necessarily a claim that diffuse suffering lacks moral weight *intrinsically*, but rather that the state recognizes an obligation only when memory serves explicit public purposes: forging shared historical consciousness, preventing recurrence of mass crimes, or performing rituals of national atonement.

  The distinction isn't purely public/private, though that framing plays a role. Municipal archives holding ordinary records are public in ownership yet treated as administratively ephemeral, whereas trauma museums are curated as sacred public spaces. The split thus depends more on a perceived *didactic utility* for citizenship: remembrance is mandated where it can narrate a streamlined moral lesson about societal failure or resilience. Records of bureaucratic complicity—unless tied directly to signature atrocities—often evade preservation precisely because they resist such narrative distillation. They reveal ambiguities, distributed responsibility, and systemic inertia that complicate the clear victim/perpetrator binaries memorial museums often rely upon. Thus, the practice likely assumes that not all memory serves democratic citizenship equally; some forgetting is operationally necessary, even benign, unless contravened by overwhelming historical or ethical significance.

  This arrangement *could* be reconciled with a view treating all memory as equally weighty but applying practical filters—resource constraints, consent norms, or the sheer intractability of preserving everything. But the pattern you note—active destruction of mundane archives alongside aggressive monumentalization—suggests more than pragmatic triage. It implies a qualitative judgment: that the ethical urgency of preserving a single person’s erased medical history is categorically different from preserving evidence of genocide. The former is seen as a private matter (hence digital erasure rights), the latter as a non-negotiable public duty. A strict "equal moral status" theory would find this inconsistency unjustifiable, demanding instead proportional investment in preserving everyday traces as potential sites of micro-historical harm or resilience.

  Regarding the ethics of memory-as-repair, the state seems to selectively borrow from conflicting philosophies. It embraces the reparative view for macro-traumas—believing ritualized remembrance fosters healing and vigilance—while simultaneously enacting a form of benign neglect toward mundane records that aligns with arguments against forced remembrance. Destroying routine archives avoids forcing society to confront the banality of systemic complicity embedded in daily bureaucracy, which some theorists argue can paralyze moral agency. The state thus implicitly positions some forgetting not as negligence, but as a release valve—a way to prevent memory from becoming psychologically or politically overwhelming.

  Adopting a theory granting uniform moral status to memory would necessitate profound shifts. Data-protection law’s "right to erasure" would require balancing against a new "right against irrecoverable loss," mandating anonymized preservation of datasets slated for deletion. School curricula would expand beyond atrocity-centric history to include critical engagement with archives of everyday life—hospital ledgers as texts on social inequality, court dockets as windows into structural injustice. Archivally, retention schedules would extend dramatically, demanding digitization of municipal records and redefining "historical significance" to encompass the diffuse patterns of ordinary existence. Government declassification would need independent oversight committees focused not just on geopolitical relevance but on preserving traces of administrative decision-making that illuminate systemic biases. The burden would be immense, suggesting why democracies default to hierarchical memory: it is ethically simpler and materially cheaper. Yet your question exposes how this very hierarchy risks entrenching a selective moral gaze, remembering the spectacular while forgetting the ordinary machinery that enables it.
