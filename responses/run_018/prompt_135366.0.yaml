  **Pedagogical Problem:** Participants discover that fully mapping the hidden payoff structure consumes the very cognitive resources that would have made that knowledge profitable, demonstrating satisficing with aspiration-level adaptation as ecologically rational.

  ---

  ### **Game Rules**  
  **Title:** *The Threshold Quest*  
  **Objective:** Maximize cumulative points over six rounds by selecting one of four niche options (A/B/C/D) per round.  

  1. **Cognitive Budget & Aspiration:**  
     - Each player starts with **8 tokens** (cognitive budget) and an **aspiration level of 7**.  
     - Tokens can be spent to reveal an option’s payoff **in the current round** (1 token = 1 option revealed).  
     - Players may **spend 3 tokens at any time** to open the *Correlation Envelope*, revealing a hidden rule: *"An option’s payoff in Round N is within ±1 point of its payoff in Round N-1."*  

  2. **Decision Process per Round:**  
     - Options are presented face-down. Players may:  
       - **Reveal an option’s payoff** by spending tokens (order of inspection is free).  
       - **Accept any revealed option** or **choose blindly** (no token cost).  
     - **Satisficing shortcut:** Players may pre-commit to accepting the **first option** meeting their aspiration level, stopping further search.  

  3. **Aspiration Adaptation Rule:**  
     - After any round where payoff **fails to meet aspiration**, mark a "failure."  
     - **Two consecutive failures:** Automatically lower aspiration by 1 and **refund 1 token**.  
     - Aspiration cannot drop below 3.  

  4. **Scoring & Incentives:**  
     - Points: Payoffs range from 1–12 (see *Hidden Payoff Structure*).  
     - **Leaderboard:** Cumulative points displayed publicly after each round.  
     - **Privilege:** Highest cumulative scorer designs the next workshop’s opening case.  

  ---

  ### **Hidden Payoff Structure**  
  - **Temporal Autocorrelation:** Each option’s payoff shifts by **±1 point** from the prior round (e.g., Round 1 Option A = 8 → Round 2 Option A = 7, 8, or 9).  
  - **Predetermined Payoffs** (facilitator’s master sheet):  
    - *Round 1:* A=8, B=7, C=6, D=5  
    - *Round 2:* A=7, B=8, C=5, D=6  
    - *Round 3:* A=6, B=9, C=4, D=7  
    - *Round 4:* A=5, B=10, C=3, D=8  
    - *Round 5:* A=4, B=11, C=2, D=9  
    - *Round 6:* A=3, B=12, C=1, D=10  
  - **Design Logic:**  
    - Early rounds have ≥1 option ≥7. Payoffs drift downward (A/C) or upward (B/D), forcing adaptation.  
    - Optimizers spending tokens to detect correlations drain resources by Round 4. Satisficers conserve tokens for critical later rounds.  

  ---

  ### **Materials**  
  - **Per Player:**  
    - 8 physical tokens (e.g., poker chips).  
    - Score sheet (columns: Round, Option Chosen, Payoff, Tokens Spent, Aspiration Level, Failures, Cumulative Points).  
  - **Shared:**  
    - Set of 4 niche cards per round (labeled A/B/C/D; payoffs written on back).  
    - Sealed *Correlation Envelope* (contains autocorrelation rule).  
    - Visible leaderboard (whiteboard with player IDs).  

  ---

  ### **Timeline (80 min total)**  
  - **0–5 min:** Distribute materials. Explain rules neutrally ("use tokens to reveal options," "adjust goals after two failures").  
  - **5–40 min:** **Rounds 1–6** (5 min/round):  
    - *Per round:* Display options → Players decide → Record choices → Update leaderboard.  
  - **40–45 min:** Final scores. Award privilege to winner.  
  - **45–80 min:** **Debrief** (see below).  

  ---

  ### **Debrief (35 min)**  
  **Map Game Moments to Concepts:**  
  1. **Aspiration Adjustment as Relief (not defeat):**  
     - *Example:* Players forced to lower aspiration after Round 3 (e.g., A=6, C=4 if aspiration=7) receive a token refund.  
     - *Link:* "Lowering your goal after persistent failure refunded a token—freeing capacity for future decisions. This mirrors how real-world satisficers treat adjustment as *strategic resource reallocation*, not weakness."  

  2. **Search-Cost Depletion:**  
     - *Example:* Players spending 3 tokens to open the correlation envelope (e.g., Round 2) and 1–2 tokens/round to track shifts (e.g., monitoring Option B’s rise) exhaust tokens by Round 4.  
     - *Link:* "The tokens spent to *map* correlations drained your ability to *act* on them. Satisficers who accepted ‘good enough’ (e.g., first option ≥7) preserved tokens for higher-yield later rounds (e.g., Round 5 D=9)."  

  3. **Ecological Rationality:**  
     - *Example:* Satisficers who lowered aspiration to 6 after Round 3 consistently met it in Rounds 4–6 (e.g., D=8, D=9, D=10) with minimal search.  
     - *Link:* "A simple rule (‘accept first ≥7, lower after two failures’) outperformed optimization because it *fit* the environment: noisy correlations made exhaustive search unprofitable."  

  **Predict Failure Modes & Handling:**  
  - **Token Hoarding:** Players avoid spending tokens, leading to blind choices and low scores.  
    - *Handling:* Ask hoarders: "Did conserving tokens early help you in later rounds? Why/why not?" Contrast with token-efficient satisficers.  
  - **Social Reluctance to Lower Aspiration:** Players resist adaptation to avoid "losing face" on the leaderboard.  
    - *Handling:* Normalize adjustment by noting refunds ("You gained a token—how did that change your later choices?").  
  - **Early Correlation Crack:** One group opens the envelope quickly and shares findings.  
    - *Handling:* Emphasize token costs ("Did knowing the rule give you enough tokens to profit from it?"). Redirect to long-term scores of satisficers.  

  **Honest Limitation Note:**  
  - "This simulation *cannot* replicate the slow social normalization of aspiration norms (e.g., peer pressure shaping goals over years) or true lack of meta-awareness (e.g., not realizing you’re satisficing). These require verbal discussion: in reality, ecological rationality often operates subconsciously amid social feedback loops."  

  ---  
  **Outcome:** Optimizers deplete tokens mapping correlations, scoring lower long-term. Satisficers experience aspiration adjustment as tactical relief, achieving higher scores with conserved resources—embodying ecological rationality without explicit instruction.
