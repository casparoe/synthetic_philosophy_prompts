  hey im putting together prompts for a dataset on philosophical/conceptual stuff and need one about von neumann's posthumous brain-computer comparision — the part where he talks about unrealiable neurons and probabilistic logic. i want a decision tree (or taxonomy) that actually sorts people by what they think, not by which label they like.

