  1) redundancy engineer — brain is basically digital computing that fixes noise through statistical voting and error-correction;
  2) probabilist — brain uses a non-boolean logic where noise is part of the computation itself;
  3) analog dynamist — the digital/logic framing is just a surface analogy, brain is fundamentally continuous/dynamical;
  4) anti-computationalist — the fact that parts are unreliable proves brains don't run algorithms at all;
  5) nothing special — unreliability is just a hardware limitation, conceptually boring.

