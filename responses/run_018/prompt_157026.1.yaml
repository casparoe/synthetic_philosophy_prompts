  2.1 User acknowledges that engagement in Product-defining activities (e.g., radionuclide dispersal, lithostratigraphic modification, biotic homogenization) constitutes *de facto* acceptance of these Terms, irrespective of formal ratification status per ICS Subcommission voting procedures (requiring 60% supermajority; Clause 9.7).  
  2.2 The IGB reserves the right to deem Product utilization commenced upon earliest detectable stratigraphic signal (User-generated), rendering formal ratification obsolete per Section 12 ("Retroactive Liability").  

