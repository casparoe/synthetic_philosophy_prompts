  5.1 All disputes regarding Product definition, start-date applicability, or damage assessment shall be resolved via ICS Subcommission on Quaternary Stratigraphy (SQS) plenary vote, requiring quorum (≥12 voting members) and adhering to procedural protocols (SQS Appendix IV: "Motion to Reject Ratification").  
