  6.1 Termination of Product license requires User to revert all systems to pre-Anthropocene boundary conditions (Holocene baseline: 11,700 BP–selected Tier start date), including atmospheric CO₂ (≤280 ppm), species distribution maps (pre-1610), and sedimentological integrity.  
