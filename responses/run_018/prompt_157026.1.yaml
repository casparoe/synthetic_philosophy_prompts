  **4. RETROACTIVE LIABILITY FOR STRATIGRAPHIC HARM**  
  4.1 User accepts unlimited liability for all Product-associated stratigraphic alterations ("Epochal Damages") occurring prior to, during, or after Term execution, including but not limited to:  
