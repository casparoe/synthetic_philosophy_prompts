  3.1 User must select one (1) licensed start-date option ("Temporal Tier"). Conflicting selections by User subgroups (e.g., "Legacy Holocene Subscribers" vs. "Anthropocene Licensees") constitute a breach:  
  &nbsp;&nbsp;&nbsp;&nbsp;*(a) Tier GSSP-1610 (Orbis Spike):* Covers biotic exchange vectors (e.g., *Zea mays* migration, invasive species). **Warning**: Invalidates pre-1610 carbon-emission liability claims by Legacy Subscribers.  
  &nbsp;&nbsp;&nbsp;&nbsp;*(b) Tier GSSP-c.1800 (Industrial):* Covers combustion-derived particulates, steam-engine lithostratigraphic disruptions. **Note**: Grandfathers pre-1800 agrarian deforestation under Holocene bylaws.  
  &nbsp;&nbsp;&nbsp;&nbsp;*(c) Tier GSSP-1952 (Great Acceleration):* Covers artificial radionuclides (e.g., ¹³⁷Cs), plastic polymers. **Caution**: Automatically assigns liability for all industrial activities preceding formal ratification.  
