prompt: |-
  Provide an example of a conceptual tension within Harsanyi's aggregation theorem that arises when agents operate with structurally different state-space representations rather than merely disagreeing about probabilities within a shared frame. Specifically, construct a case in which Agent A's von Neumann–Morgenstern utility is defined over outcomes that depend on a variable X that Agent A can observe and condition upon, while Agent B treats X as an unobservable background parameter and defines utility only over observable outcomes Y that are probabilistically linked to X but never directly revealed. The social planner seeks to apply Harsanyi's linear aggregation rule but lacks a canonical translation between these representations—there is no agreed-upon joint distribution over (X,Y) pairs because the agents partition the world differently. Explain why this epistemic framing divergence, rather than a simple difference in risk attitudes or beliefs, threatens the shared-domain assumption required for assigning consistent aggregation weights. Identify the specific point in Harsanyi's argument—whether in the construction of the social preference relation or in the derivation of the weight vector—where the absence of a common state-space renders the aggregation ambiguous, and discuss whether any principled resolution can be achieved without imposing an external, non-neutral ontology onto one of the agents.
reasoning: |-
  We are constructing an example where two agents have structurally different state-space representations. Specifically:

  Agent A:
    - Observes a variable X (which can take values in some set, say {x1, x2})
    - Defines outcomes over a variable that depends on X. For simplicity, let outcomes be monetary payoffs that are contingent on X. For example, an act for A might be: if X=x1, get $100; if X=x2, get $0.

  Agent B:
    - Does not observe X. Instead, B only observes a variable Y which is probabilistically linked to X. For instance, Y might be a noisy signal of X. 
    - Therefore, B defines outcomes only in terms of Y. An act for B might be: if Y=y1, get $100; if Y=y2, get $0.

  Moreover, the social planner does not have an agreed-upon joint distribution over (X,Y). The agents have different partitions of the state space.

  Example Setup:

  Let the underlying state space be Ω = {ω1, ω2, ω3, ω4}. The variable X is a function on Ω. Suppose:
    - X(ω1) = x1, X(ω2) = x1, X(ω3) = x2, X(ω4) = x2.

  Agent A observes X, so A partitions the state space into two events: E1 = {ω1, ω2} (where X=x1) and E2 = {ω3, ω4} (where X=x2).

  Agent B does not observe X but observes Y. Let Y be a function on Ω. Suppose:
    - Y(ω1) = y1, Y(ω2) = y2, Y(ω3) = y1, Y(ω4) = y2.

  So B partitions the state space into two events: F1 = {ω1, ω3} (where Y=y1) and F2 = {ω2, ω4} (where Y=y2).

  The social planner wants to aggregate the preferences of A and B using Harsanyi's linear aggregation rule. Harsanyi's theorem requires that both agents have von Neumann-Morgenstern (vNM) preferences defined over the same set of lotteries (i.e., over the same state space with the same set of outcomes and same resolution of uncertainty). However, in this case, the two agents condition on different variables and thus have different algebras of events.

  The key issue: The acts (gambles) that each agent considers are defined over different partitions. Therefore, the set of acts (or the domain of the utility functions) for A and B are not the same.

  Harsanyi's aggregation theorem requires that the social planner can represent each agent's preferences by a vNM utility function over the same set of lotteries. But here, the lotteries that A evaluates are over the events defined by X, while the lotteries that B evaluates are over the events defined by Y.

  Thus, the social planner faces a problem: How to define a common set of lotteries? 

  Suppose the social planner tries to use the full state space Ω. Then, we would need to assign probabilities to each state. However, the agents might not agree on the probabilities because they condition on different information. Moreover, even if we fix a probability distribution over Ω, the acts that each agent uses are defined on different coarsenings of Ω. 

  But the problem is deeper: The agents do not even recognize the same set of events as being relevant. For A, the relevant events are E1 and E2. For B, they are F1 and F2. The social planner has to define a common set of acts that both agents can evaluate. However, an act that is measurable with respect to A's partition may not be measurable with respect to B's partition, and vice versa.

  Example of an act:

  Define an act f that pays $100 on E1 (i.e., when X=x1) and $0 on E2. Agent A can evaluate this act. But for Agent B, this act is not measurable with respect to B's partition because, for example, in the event F1 (Y=y1) which contains ω1 and ω3, we have f(ω1)=100 (since ω1 is in E1) and f(ω3)=0 (since ω3 is in E2). So the act f is not constant on F1. Therefore, B cannot directly express a preference over f because B does not condition on X. Similarly, an act g that pays $100 on F1 and $0 on F2 is not measurable for A.

  Therefore, the domain of acts for A and B are different. Harsanyi's theorem requires a common domain.

  Where does Harsanyi's argument break down?

  Harsanyi's theorem has two main parts:

  1. The social preference must satisfy the vNM axioms (if the individual preferences do) and thus can be represented by a vNM utility function that is a linear combination of the individual vNM utilities.

  2. The weights in the linear combination are determined by the requirement of Pareto indifference: if every individual is indifferent between two lotteries, then so is society.

  The problem arises in the very first step: defining the set of lotteries over which the preferences are defined. The theorem assumes that all individuals and the social planner are evaluating the same set of lotteries. In our case, we don't have a common set of lotteries because the agents have different state spaces (or different partitions of the same state space).

  Even if we try to embed both agents' acts into a larger state space (like Ω), we face the issue that the acts are not directly comparable because they are defined on different sub-algebras. Without a common domain of acts, we cannot apply the Pareto condition to derive the weights.

  Moreover, even if we fix a common state space Ω and a common probability distribution P over Ω (which might be imposed by the social planner), then we can define the vNM utility for each agent as an expected utility. However, note that:

  - Agent A's utility for a lottery (act) f is: 
        U_A(f) = P(E1) * u_A(f(E1)) + P(E2) * u_A(f(E2))

  But wait, this is only if the lottery f is constant on E1 and on E2. For a general act that is defined on Ω, we would have to compute the expectation with respect to the whole state space. But Agent A's preferences are only defined over acts that are measurable with respect to {E1, E2}. Similarly, Agent B's preferences are only defined over acts measurable with respect to {F1, F2}. 

  So if the social planner considers an act that is measurable with respect to the full algebra (i.e., defined on each state), then both agents might not have well-defined preferences because they cannot condition on the fine states. They only condition on their own partitions.

  Alternatively, if the social planner restricts attention to acts that are measurable with respect to both partitions, then the only such acts are constant acts (because the join of the two partitions is the full discrete partition: each state is an atom). But then we are left with only constant acts, which is too small a domain to apply the vNM axioms (which require nontrivial gambles).

  Therefore, the absence of a common state-space (or more precisely, a common algebra of events) renders the aggregation ambiguous at the very foundation: we cannot even define a common domain of acts for which both agents have preferences.

  Can we achieve a principled resolution without imposing an external ontology?

  One approach might be to require that each agent expresses their preferences over acts defined on the other agent's partition. For example, we could ask Agent A to express preferences over acts defined on B's partition (i.e., acts that are measurable with respect to F1 and F2). But this requires Agent A to form beliefs about the relationship between X and Y. Similarly, we could ask Agent B to express preferences over acts defined on A's partition. However, this would require the social planner to specify a joint distribution over (X,Y) which is exactly what we don't have.

  Moreover, without an agreed joint distribution, the agents might not be able to form consistent preferences over the other's partition. And even if they do, it would be imposing an external framework (by forcing them to consider a different partition) which might not be neutral.

  Another approach is to use the full state space Ω and assign a probability distribution arbitrarily. But then we are imposing an external ontology (a specific joint distribution and a specific fine partition) that neither agent uses. This violates the requirement of non-imposition.

  Conclusion: 

  The conceptual tension arises because Harsanyi's theorem requires a common domain of acts. When agents have fundamentally different state-space representations, there is no natural common domain. The breakdown occurs at the very beginning: we cannot even define the set of lotteries over which both agents have well-defined preferences. Without that, the linear aggregation rule cannot be applied. 

  A principled resolution without imposing an external, non-neutral ontology seems difficult. Any attempt to force a common state space (either by choosing one agent's partition or by using a finer partition) would favor one agent's ontology over the other. Therefore, the aggregation problem in such cases remains fundamentally ambiguous.
answer: |-
  ### Conceptual Tension in Harsanyi's Aggregation Theorem: Divergent State-Space Representations

  **Example Setup:**  
  Consider two agents, A and B, and a social planner seeking to aggregate their preferences using Harsanyi's linear rule. The agents have **structurally different state-space representations**:  
  - **Agent A** observes a binary variable \(X \in \{x_1, x_2\}\). Their vNM utility \(u_A\) is defined over outcomes contingent on \(X\) (e.g., "receive \(M\) dollars if \(X = x_1\), else \(0\)").  
  - **Agent B** cannot observe \(X\) and treats it as an unobservable background parameter. B defines utility solely over outcomes linked to a noisy signal \(Y \in \{y_1, y_2\}\), where \(Y\) is probabilistically related to \(X\) (e.g., "receive \(M\) dollars if \(Y = y_1\), else \(0\)").  

  Suppose the true relationship between \(X\) and \(Y\) is:  
  - \(P(Y = y_1 | X = x_1) = 0.9\), \(P(Y = y_2 | X = x_1) = 0.1\)  
  - \(P(Y = y_1 | X = x_2) = 0.2\), \(P(Y = y_2 | X = x_2) = 0.8\).  

  Crucially, **no agreed-upon joint distribution** exists over \((X, Y)\). Agent A partitions states by \(X\), while B partitions by \(Y\), reflecting divergent epistemic frames:  
  - A’s state-space: \(\Omega_A = \{E_{x_1}, E_{x_2}\}\) (events defined by \(X\)).  
  - B’s state-space: \(\Omega_B = \{E_{y_1}, E_{y_2}\}\) (events defined by \(Y\)).  

  ---

  ### Why This Threatens Harsanyi's Shared-Domain Assumption  
  Harsanyi’s theorem requires:  
  1. **Shared state-space**: Agents must have vNM utilities defined over the **same set of lotteries** (i.e., identical outcome-state mappings).  
  2. **Common probability assessments** (or at least a common algebra of events).  

  Here, the tension arises from **framing divergence**, not mere differences in beliefs or risk attitudes:  
  - **Agent A** evaluates acts like \(f_A = (\$M \text{ if } x_1, \$0 \text{ if } x_2)\).  
  - **Agent B** evaluates acts like \(f_B = (\$M \text{ if } y_1, \$0 \text{ if } y_2)\).  

  These acts are **mutually incompatible** because:  
  - \(f_A\) is not measurable in \(\Omega_B\): The outcome depends on \(X\), which B cannot condition on.  
  - \(f_B\) is not measurable in \(\Omega_A\): \(Y\) is not a primitive in A’s ontology.  

  The social planner lacks a **canonical translation** between acts. For instance:  
  - To compare \(f_A\) and \(f_B\), the planner must map them to a joint space \((X, Y)\). But this requires imposing a joint distribution (e.g., \(P(X, Y)\)), which neither agent accepts as primitive.  

  ---

  ### Breakdown in Harsanyi's Argument  
  The aggregation fails at **two critical points**:  

  #### 1. **Construction of Social Preferences**  
     Harsanyi requires a social preference relation \(\succsim_{\text{soc}}\) over a common set \(\mathcal{L}\) of lotteries. \(\mathcal{L}\) is typically defined as all probability distributions over a **shared outcome-state space**.  
     - **Problem**: Here, \(\Omega_A\) and \(\Omega_B\) are disjoint partitions of the world. There is no \(\mathcal{L}\) both agents recognize:  
       - \(\mathcal{L}_A\): Lotteries over \(X\)-contingent outcomes.  
       - \(\mathcal{L}_B\): Lotteries over \(Y\)-contingent outcomes.  
     - Without a common \(\mathcal{L}\), \(\succsim_{\text{soc}}\) cannot be constructed.  

  #### 2. **Derivation of Aggregation Weights**  
     Harsanyi’s weights \(\lambda_i\) are derived from **Pareto indifference**:  
     \[
     \forall L, L' \in \mathcal{L}: \quad u_i(L) = u_i(L') \ \forall i \implies u_{\text{soc}}(L) = u_{\text{soc}}(L').
     \]  
     - **Problem**: Acts in \(\mathcal{L}_A\) and \(\mathcal{L}_B\) are incommensurable. For example:  
       - Let \(L_A \in \mathcal{L}_A\) pay \(M\) if \(x_1\).  
       - Let \(L_B \in \mathcal{L}_B\) pay \(M\) if \(y_1\).  
     - Pareto indifference cannot link \(L_A\) and \(L_B\) without a bridge rule (e.g., "\(L_A\) is equivalent to \(L_B\) when \(P(X,Y)\) is such that..."). But no such rule exists without imposing an external joint distribution.  

  ---

  ### Can a Principled Resolution Exist?  
  A resolution **without imposing a non-neutral ontology** is unlikely:  

  #### Why Neutrality Fails  
  - **Translation requires ontological imposition**: Mapping \(\Omega_A\) to \(\Omega_B\) (or vice versa) demands a joint distribution \(P(X,Y)\). Assigning \(P(X,Y)\):  
    - If based on A’s view, it assumes \(X\) is fundamental, overriding B’s framing.  
    - If based on B’s view, it ignores A’s ability to observe \(X\).  
    - If based on a "planner’s prior", it imposes an external ontology.  
  - **No unique weighting**: Weights \(\lambda_A, \lambda_B\) would depend on the chosen \(P(X,Y)\). For example:  
    - If \(P(X=x_1) = 0.5\), \(u_{\text{soc}}\) aggregates \(u_A\) and \(u_B\) with weights sensitive to this prior.  
    - If \(P(X=x_1) = 0.1\), weights change arbitrarily.  

  #### Alternatives and Their Limits  
  1. **Restrict to coarsest common partition**:  
     - Use states where \((X,Y)\) is measurable, but this forces both agents to adopt a new frame, violating neutrality.  
  2. **Revealed-preference over acts**:  
     - Have agents rank each other’s acts using their own beliefs. But A’s ranking of \(f_B\) requires A to assign \(P(Y|X)\), while B cannot rank \(f_A\) without \(P(X|Y)\)—begging the joint distribution.  
  3. **Generalized aggregation frameworks** (e.g., state-dependent utilities):  
     - Still require a common state-space to define utilities.  

  ---

  ### Conclusion  
  The tension arises from **epistemic framing divergence**: Agents partition the world into mutually irreducible states. This violates Harsanyi’s core assumption of a shared domain for lotteries. The theorem breaks at the **construction of social preferences** and the **application of Pareto indifference**, as both require acts to be defined over a common state-space. A resolution without imposing an external ontology is impossible because any bridge between frames **privileges one agent’s perspective** or **introduces arbitrariness** in the joint distribution. This highlights a deeper limitation in aggregating utilities under foundational disagreement about what constitutes a "state of the world."
