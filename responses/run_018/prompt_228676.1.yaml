     - The intervener's policy as a commitment device: clean.
     - The agent's strategy set: clean, but the requirement of a reliable signal forces constraints on the strategy set (or on the determinism of the environment) that are not part of standard game theory (where strategies are freely chosen and outcomes are determined by the strategy profile).

  7. **What is distorted?**
     - The notion of "could have done otherwise" in the context of a reliable signal: we had to assume that the agent's action is determined by the signal (or the intention that generates the signal) to get the Frankfurt result. This determinism is not typically part of the game-theoretic setup, where players can choose any strategy in their set. Here, we are effectively removing strategies that would lead to an outcome of B by making them impossible (because if the agent intends B, they are forced to A).

