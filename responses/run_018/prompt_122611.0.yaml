  First, I need to understand the core challenge: constructing a scenario that satisfies all these constraints simultaneously. The hardest parts seem to be:
  - Making the behavior empirically robust by situationist standards (cross-situational consistency, predictive validity)
  - Having the virtue denial stem from virtue-ethical conditions (right reasons, fine/good motivation) without behavioral traces
  - The counterfactual difference being in normatively significant but empirically unsampled situations

  Hmm... the user mentions "lookalike" mechanisms. I recall Aristotle's distinction between true virtue and "natural virtue" - that might be a useful framework. For conscientiousness, what if the driver is rule-fetishism rather than practical wisdom? 

  Let me sketch a hospital scenario:
  - A nurse shows impeccable procedural compliance across years of routine situations
  - Situationist sees robust conscientiousness trait
  - But her motivation is rigid rule-adherence, not patient welfare
  - This fails when rules conflict with patient needs (counterfactual)

  Wait, does this satisfy "no emergencies"? The counterfactual must be non-emergency but normatively critical. Maybe medication timing vs. patient comfort? 

  For collapse points:
  - If the rule-conflict situation occurred, both sides would deny the trait (situationist sees inconsistency, virtue ethicist sees wrong motive)
  - If she had practical wisdom, it would be true virtue

  User's robustness ambiguity is key here - frequency-weighted vs normatively-loaded robustness. That should be the structural feature.

  Strongest situationist counters:
  1. "Existence of traits vs what counts as virtue" - but this concedes the empirical ground
  2. "Normative robustness is question-begging" - need to argue virtue ethics defines virtues normatively by design
  3. "No epistemic access" - toughest one; must admit limitation but note virtue ethics isn't purely empirical

  Better make the nurse example concrete with specific behaviors and one clear counterfactual. Medication administration timing provides good tension between rules and care.
answer: |-
  Here is a case meeting all constraints, using Aristotle's *Nicomachean Ethics* conditions: virtue requires acting (1) for the sake of the fine (*to kalon*), (2) with stable disposition, (3) with appropriate affect, and (4) guided by practical wisdom (*phronesis*).

  **Scenario:**  
  Nurse A works on a geriatric ward. For five years, she meticulously adheres to medication schedules, documents all patient interactions, follows hygiene protocols exactly, and never shortcuts procedures. Supervisors rate her "highly conscientious"; colleagues note her reliability. Her behavior is consistent across shifts, patient types (dementia, mobility-limited, chronic illness), staffing levels, and personal stressors (e.g., fatigue). When asked why she follows protocols so strictly, she replies, "Rules exist for a reason. Deviating causes chaos." Situationists, applying their criteria (cross-situational consistency, high predictive validity, no single situational predictor), identify a robust trait of "conscientiousness."

  **1. Situationist Verdict:**  
  The situationist attributes conscientiousness. The nurse’s behavior meets the empirical bar: it predicts actions across sampled situations (ward duties, documentation, hygiene) over years, with no situational variable (e.g., workload, patient acuity) dominating. The self-reported motive ("rules exist for a reason") aligns with observed behavior. Absent behavioral variance or contradictory evidence, this satisfies the situationist standard for a robust trait.

  **2. Virtue-Ethical Verdict (Aristotelian):**  
  The nurse lacks *true* conscientiousness. She acts from *rule-fetishism* – a rigid disposition to follow procedures *because they are rules*, not for the sake of patient well-being (*to kalon*). This fails condition (1): she acts for the sake of order, not the fine. It also fails (4): lacking *phronesis*, she cannot discern when rules conflict with their purpose (e.g., pausing medication to comfort a distressed patient). Her affect is inappropriately rigid (violating condition 3), showing anxiety, not calm resolve, when routines are challenged. The disposition is a "near-miss" lookalike: externally identical to virtue in sampled situations but brittle under unobserved counterfactuals where rules and welfare conflict.

  **3. Structural Feature & Collapse:**  
  The case turns on **normative robustness vs. frequency-weighted robustness**.  
  - *Removing normative variation*: If sampled situations included rule-welfare conflicts (e.g., strict medication timing vs. patient comfort), the nurse’s behavior would diverge from true virtue (e.g., refusing to delay a pill for a weeping patient). The situationist would *deny* a robust trait (inconsistency emerges), collapsing into a standard situationist case.  
  - *Adding practical wisdom*: If the nurse flexibly adapted rules to patient needs while maintaining core diligence, she would possess true virtue. The lookalike collapses into virtue.  

  **4. Strongest Situationist Counter-Attacks & Replies:**  
  - **Counter 1: "Trait existence ≠ virtue status."**  
    *Retort*: This concedes the core argument: situationist methods cannot *distinguish* virtues from lookalikes, undermining their critique that virtue ethics posits empirically unsupported traits. If "conscientiousness" is merely rule-compliance, virtue ethics never claimed *that* trait was a virtue.  
  - **Counter 2: "Normative robustness is question-begging."**  
    *Retort*: Virtue ethics *defines* virtues normatively. To demand non-normative criteria ignores the theory’s structure. The case shows situationist methods cannot capture this normativity, making them inadequate for evaluating virtue-ethical claims.  
  - **Counter 3: "No epistemic access to mechanisms."**  
    *Worry most here*: This challenges the virtue ethicist’s ability to *know* the nurse lacks *phronesis* without behavioral evidence.  
    *One-paragraph reply*: Virtue ethics concedes empirical access is limited but argues *phronesis* manifests in counterfactual reasoning (e.g., the nurse’s inability to articulate *when* to bend rules). While self-reports and observed rigidity hint at the mechanism, the key difference remains the *dispositional readiness* to act rightly in normatively pivotal (but rare) situations. This is a metaphysical, not epistemic, distinction – but the situationist’s *own* standards cannot detect lookalikes, revealing their framework’s inadequacy for evaluating virtue.  

  **Derivation Check:**  
  - Situationist verdict derived from consistency/predictability in sampled situations.  
  - Virtue verdict derived from motive (*to kalon*), affect, and *phronesis* deficits implied by rigidity and rule-centric reasoning.  
  - No stipulation: The nurse’s self-report and anxiety during disruptions provide evidence for the wrong motive/affect without invoking unsampled counterfactuals.  

