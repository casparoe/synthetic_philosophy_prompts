answer: |-
  **Proportional hypocrisy correctly captures our intuitions about standing to blame.**

  The controversy centers on whether a blamer’s own fault negates their moral authority ("standing") entirely or merely diminishes it proportionally. The binary view insists that any shared fault, however minor or distant, entirely voids standing, rendering the hypocrite’s blame illegitimate regardless of the severity of the target’s wrong. This is intuitively flawed. Consider a reformed individual who committed petty theft decades ago blaming another for a violent armed robbery. While some unease might exist, it seems excessive to deny them *any* standing; their past minor fault doesn’t equate to the present major wrong, and their reform may lend perspective. The binary rule here feels artificially restrictive and paralyzing, implying that only the sinless can condemn sin – an impossible standard that would cripple moral discourse.

  Proportional hypocrisy, recognizing standing as gradational rather than absolute, aligns better with moral reasoning. It acknowledges that hypocrisy weakens authority but allows that the *degree* of weakening depends on the *severity* and *timing* of the blamer’s own comparable fault, crucially weighted by their awareness and culpability. A person actively committing the *same* serious fault lacks standing entirely; their immediate, conscious hypocrisy destroys credibility ("tu quoque"). Conversely, someone guilty of a *lesser* instance (e.g., occasional rudeness condemning sustained cruelty), especially if reformed and aware, retains significant standing. Their lesser fault doesn’t negate the validity of condemning a greater wrong; it merely tempers their perceived moral high ground. The blamer’s awareness is key: unacknowledged fault amplifies hypocrisy, while acknowledged fault and reform mitigate it, preserving some authority rooted in understanding the wrong’s nature.

  While the binary view’s simplicity offers clarity, it produces counterintuitive results, equating vastly different moral failings and ignoring context. Proportionality, though messier, reflects the nuanced reality of moral judgment: standing to blame is not obliterated by any fault but corroded in proportion to the blamer’s own culpable departure from the norm they invoke, factoring in the fault's gravity and their conscious relationship to it. Our moral practices confirm this; we intuitively grant more leeway to minor, acknowledged transgressors condemning major offenses, reserving complete dismissal for those actively and severely mirroring the condemned behavior. Therefore, proportional hypocrisy offers the superior conceptual framework.
