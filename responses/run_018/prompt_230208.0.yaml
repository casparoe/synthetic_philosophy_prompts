prompt: |-
  I'm writting this for a reading group on mental causation, mostly Kim's causal exclusion argument, Davidson's anomalous monism, and the more recent proportionality stuff, and I keep having the feeling that each position is built to satisfy a slightly different job description, so I can't compare them fairly. Before I read any further, I want the full spec.

  Write the desiderata: what any adequate theory of mental causation has to deliver. Include the cases it has to get right (a decision causing a bodily movement, one belief causing another, a standing trait explaining a whole pattern of action over time), the distinctions it can't collapse (especially the difference between a mental state's actually producing an effect and its merely being counterfactually relevant to it), and the constraints it can't contradict (causal closure of the physical, if you take the evidence that way; the datum that mental life isn't systematically epiphenomenal; whatever constraints on causation you want to import from the general metaphysics of causation). For each requirement, give the case or consideration that makes it a requirement. Then mark which requirements are non-negotiable and which are just camp preferences — things like the demand that causation be production rather than mere difference-making, or the assumption that the relata are events and not properties, which people seem to assume but rarely defend. And the part I want to see most: tell me whether some subset of the requirements is jointly unsatisfiable. If the setup basically forces a choice among mental distinctness, physical causal closure, and the causal efficacy of the mental, say so, and say which candidate gives up which. A short scorecard of epiphenomenalism, type identity, and non-reductive physicalism against the list is fine, but keep the weight on the critera. End with a line beginning 'Verdict:' naming the single requirement that does the most work eliminating candidate theories.
reasoning: |-
  Okay, the user is in a reading group on mental causation, specifically focusing on Kim's causal exclusion argument, Davidson's anomalous monism, and proportionality. They feel each theory serves a different purpose and wants a clear set of criteria to evaluate them fairly. 

  First, I need to understand their main request: they want a comprehensive list of desiderata for any theory of mental causation. This includes cases it must handle, distinctions to maintain, constraints to respect, and which of these are non-negotiable versus optional. They also want to know if some requirements conflict and which one is the biggest deal-breaker.

  The user seems frustrated by the lack of a common framework to compare theories. They're likely preparing for a discussion or paper and want to avoid misrepresenting positions. Their mention of "job descriptions" suggests they suspect theorists prioritize different goals, making direct comparisons unfair. 

  Breaking this down:
  - **Cases**: Bodily movement (decision→action), mental-to-mental causation (belief→belief), dispositional explanations (trait→pattern). These cover core intuitive examples.
  - **Distinctions**: Actual causation vs. counterfactual dependence is critical—they explicitly mention it. Theories must avoid conflating them.
  - **Constraints**: Causal closure (if accepted), no systematic mental epiphenomenalism, plus general causation metaphysics (production vs. difference-making, event vs. property relata). Need to flag which constraints are contested.
  - **Conflict check**: The exclusion problem (mental distinctness + closure → mental inefficacy) is the elephant in the room. Must highlight this trilemma.
  - **Scorecard**: Briefly map epiphenomenalism, identity theory, and non-reductive physicalism to the desiderata, but keep focus on criteria.
  - **Verdict**: Identify the most decisive requirement—likely causal closure, as it forces hard choices.

  Additional considerations:
  - User might be wrestling with proportionality's appeal but senses it dodges production. Should note that trade-off.
  - Their "camp preferences" point shows awareness of meta-philosophical biases. Worth clarifying where debates stem from deeper divides (e.g., Humean vs. anti-Humean causation).
  - Ending with "Verdict" gives them a punchy takeaway for discussion.

  Biggest challenge: Balancing depth with clarity. Must avoid jargon while capturing nuances (e.g., distinguishing token efficacy from type epiphenomenalism). The "non-negotiable" vs. "camp" split helps them navigate disagreements.
answer: |-
  Here's the full specification of desiderata for an adequate theory of mental causation, structured to help you compare competing frameworks. Requirements are categorized, grounded in cases/considerations, and tagged for negotiability. **Bold** marks non-negotiable constraints for physicalists; *italics* denote camp-specific preferences.

  ---

  ### **I. Core Cases Any Theory Must Capture**
  *(Non-negotiable for adequacy)*  
  1. **Decision → Bodily Movement**  
     - *Case*: Your decision to raise your arm causes your arm to rise.  
     - *Requirement*: Mental states (intentions, decisions) must cause physical effects.  
  2. **Mental → Mental Causation**  
     - *Case*: Believing "it will rain" and "I left my umbrella at home" causes you to feel anxiety.  
     - *Requirement*: Mental states must cause other mental states.  
  3. **Dispositional Explanation**  
     - *Case*: A person's chronic pessimism explains their pattern of avoiding opportunities.  
     - *Requirement*: Standing mental properties (traits, beliefs, desires) must explain *patterns* of thought/action over time.  

  ---

  ### **II. Critical Distinctions to Preserve**
  *(Collapsing these invalidates the theory)*  
  4. **Actual Causation vs. Counterfactual Dependence**  
     - *Case*: Your fear *causes* you to run (actual production), but if you *hadn't* been afraid, you *still* would have run due to a brain stimulator (counterfactual dependence ≠ causation).  
     - *Requirement*: A theory must distinguish mental states that *produce* effects from those merely correlated or counterfactually relevant.  
  5. **Mental Efficacy vs. Explanatory Relevance**  
     - *Case*: A brain state causes movement, but *only* the mental description (e.g., "pain") explains *why* the movement was adaptive.  
     - *Requirement*: Mental properties must be causally efficacious *in their own right*, not merely explanatory placeholders.  

  ---

  ### **III. Non-Negotiable Constraints**  
  *(Rejecting these contradicts empirical/scientific consensus)*  
  6. **⛔ Causal Closure of the Physical (CCP)**  
     - *Evidence*: Physics tracks causation via conserved quantities (energy/momentum); no empirical evidence of "non-physical pushes".  
     - *Requirement*: Every physical effect has a sufficient physical cause at some level of description. *Physicalists must accept this*.  
  7. **⛔ No Systematic Mental Epiphenomenalism**  
     - *Datum*: Mental states aren't "idle wheels" – we act *because* of beliefs/desires.  
     - *Requirement*: At least *some* mental states must be causally efficacious.  

  ---

  ### **IV. Camp-Specific Preferences**  
  *(Theoretical choices influencing framework design)*  
  8. *Causation as Production vs. Difference-Making*  
     - *Preference*: Must causation involve "oomph" (production) or just counterfactual dependence (difference-making)?  
     - *Dividing line*: Davidson (events) vs. Lewis (counterfactuals).  
  9. *Relata: Events vs. Properties*  
     - *Preference*: Do mental *properties* cause effects, or only events under mental descriptions?  
     - *Dividing line*: Kim (properties) vs. Davidson (events).  
  10. *Anomalism of the Mental*  
      - *Preference*: Must mental properties resist strict psychophysical laws?  
      - *Dividing line*: Davidson (yes) vs. identity theorists (no).  

  ---

  ### **V. The Inevitable Trilemma & Scorecard**  
  **The Exclusion Problem (Kim)**: CCP + Mental Distinctness (non-identity) + No Overdetermination → **Systematic Mental Epiphenomenalism**.  
  *Every theory surrenders one requirement*:  

  | **Theory**               | **Sacrifices**                         | **Holds**                                      | **Fails Desideratum**               |  
  |--------------------------|----------------------------------------|------------------------------------------------|-------------------------------------|  
  | **Epiphenomenalism**     | Mental efficacy (7)                   | CCP (6), Distinctness                          | 1, 2, 3, 5                          |  
  | **Type Identity Theory** | Mental distinctness (anomalism)       | CCP (6), Efficacy (7)                          | *May fail 3/5 if reduced carelessly* |  
  | **Non-Reductive Phys.**  | Strict no-overdetermination (implied) | CCP (6), Efficacy (7), Distinctness            | *Struggles with 4, 5 (exclusion)*   |  
  | **Davidsonian Monism**   | Property causation (9)                | Efficacy (7) *for events*, Anomalism, CCP (6) | *Fails 5 (property efficacy)*       |  
  | **Proportionality**      | Production (8)                        | Efficacy (7), CCP (6), Difference-making (8)   | *Fails 4 if causation ≠ production* |  

  ---

  **Verdict: Causal Closure of the Physical (CCP) does the most work eliminating candidates.** It forces non-identity theories into overdetermination or epiphenomenalism, demands identity theorists reduce mental properties, and is the bedrock constraint making mental causation seem problematic in the first place. Reject CCP (e.g., dualism), and the problem dissolves – but at the cost of contravening scientific orthodoxy.
