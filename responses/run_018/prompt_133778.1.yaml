answer: |-
  ## Final Examination: Hume's Political Economy  
  **HUME 495: Advanced Seminar in Enlightenment Political Thought**  
  **Take-Home Examination | Professor Alistair Thorne**  
  **Time Allowed: 72 Hours | Total Marks: 25**

  **Question:**  
  David Hume, in "Of Money" and "Of Interest," argues that an increase in the money supply stimulates industry *before* raising prices, creating a period of beneficial economic activity due to the gradual, uneven diffusion of new money. Critically evaluate the resilience of this gradualist mechanism in the following counterfactual scenario:  

  A closed, agrarian monarchy, previously operating on a limited specie base, suddenly issues a large volume of paper notes. These notes are declared legal tender and are convertible *not* into gold or silver, but into future claims against anticipated tax revenues (e.g., a note bearing "Redeemable for One Silver Crown Equivalent in Land Tax Due Next Harvest"). Analyze whether Hume’s sequence—where new money first boosts real output and employment, followed only later by price inflation—holds under this system. Specifically:  
  1.  Reconstruct Hume’s implicit assumptions regarding the velocity of money circulation underpinning his gradualist thesis.  
  2.  Determine if, and how, the state-issued tax-backed paper credit alters the dynamics of money diffusion, velocity, and the stimulus to "industry."  
  3.  Identify the precise point(s) in the transmission mechanism where nominal economic activity (prices) might diverge from real activity (output, employment) in this counterfactual, compared to Hume’s specie-based example.  
  4.  Assess whether such divergence, if it occurs, fundamentally undermines Hume’s broader anti-mercantilist argument that national wealth consists solely in "the labour and commodities" of a nation, not in accumulated money (whether specie or paper).  

  **Superior responses** will move beyond summarizing Hume’s argument. They will rigorously apply his *framework* of temporal lags and uneven diffusion to the novel instrument, isolate the role of velocity expectations, diagnose the divergence point between nominal and real effects, and explicitly connect this analysis to the vulnerability of his anti-mercantilist conclusion.  

  ---

  **Model Answer (Approx. 700 words):**  

  Hume's rejection of mercantilism hinges crucially on his analysis in "Of Money" and "Of Interest." He contends that augmenting the money supply (M), particularly in specie, does not instantly elevate prices (P). Instead, it first stimulates real output (Y) and employment through a complex, temporally extended process. New money enters specific sectors (e.g., coastal merchants receiving foreign gold), increasing demand for goods and labor locally before diffusion raises prices nationally. This "interval" stimulates industry, as producers respond to heightened nominal demand before input costs fully adjust. Only once the new money diffuses unevenly through the economy and spending increases *generally* do prices rise proportionally, restoring equilibrium without permanent real gains. Hume’s anti-mercantilist conclusion follows: money is merely a "counter" representing labor and commodities; accumulating it, absent increased production, is futile.

  This gradualist mechanism relies implicitly on assumptions about the *velocity of money* (V) – the rate at which a unit of money is spent. Hume assumes V remains relatively stable *during the diffusion period*. New money initially increases spending power for its first recipients without immediately altering their spending habits (V) or the expectations of those they trade with. The merchant with new gold spends it briskly on local goods and labor, stimulating real activity in that locale. The lag occurs because price increases elsewhere, and for inputs, happen *later*, as the money spreads and the *aggregate* increase in M becomes perceptible, eventually driving up P. Crucially, the *credibility* of the money as a stable store of value is unquestioned – it is specie, intrinsically valued.

  The counterfactual tax-backed paper system disrupts this mechanism at its foundation by introducing profound uncertainty about V and the money's future value. Unlike specie, the paper’s worth is contingent:  
  1.  **Velocity Uncertainty:** Recipients of the new paper (e.g., soldiers paid in notes, contractors supplying the crown) face immediate uncertainty. Can they readily spend it? Will others accept it at face value? The promise of future tax redemption depends on the state's solvency and the *specific* future tax yield ("Land Tax Due Next Harvest"). A poor harvest could devalue the note. This uncertainty likely depresses V. Holders may hoard notes awaiting redemption or spend them only reluctantly and selectively, perhaps demanding a discount (effectively devaluing the note immediately). This impedes the initial, vigorous spending surge Hume describes.  
  2.  **Diffusion & Stimulus:** The "diffusion" is no longer merely geographic/economic but also involves a credibility assessment. The stimulus depends less on *who* gets the money first and more on *how credible the promise is perceived to be*. If confidence is low, even initial recipients may not increase real spending. If confidence is high only in certain sectors (e.g., those confident in the state or the specific tax), stimulus becomes patchy and potentially disconnected from productive capacity. Nominal demand might rise where the paper is trusted, but real output may not follow if producers doubt the money's longevity or value when they need to buy inputs.  
  3.  **Divergence Point:** The critical divergence from Hume’s sequence occurs **immediately upon issuance**, at the **point of initial spending decisions**. In Hume’s model, the new money holder spends freely, stimulating real activity before price feedback loops activate. In the counterfactual, uncertainty about V and future value (P) causes hesitation. The holder must decide: is this note truly worth its face value *now*? This decision inherently incorporates expectations about *future* prices and redemption value. Nominal spending (using the note) and real activity (producing goods demanded by note-holders) become potentially decoupled *from the outset*. Increased nominal spending might occur without proportional real output growth if producers are wary, or real activity might stall due to a lack of credible medium. Price adjustments (discounts on goods bought with paper, or inflation where it’s accepted) could happen rapidly and unevenly, short-circuiting the "beneficial interval."  

  This divergence significantly impacts Hume’s anti-mercantilism. While the counterfactual doesn't *refute* Hume’s core point that wealth is labor and commodities, it exposes a vulnerability. If state-issued credit *can*, under conditions of high confidence, stimulate real activity without immediate inflation (by mobilizing idle resources more effectively than specie diffusion), it suggests that *well-managed* paper systems might create temporary real wealth *through* monetary expansion, seemingly contradicting Hume's dismissal of money's real effects. However, this potential hinges precariously on confidence – the perceived credibility of the state and its future revenue – a factor absent in Hume's specie assumption. The fragility of this confidence (susceptible to harvest failure, war, or mismanagement) and the likelihood of eventual inflation or devaluation if issuance exceeds real growth potential ultimately *support* Hume's underlying caution. It shows that while the *form* of money matters critically for the transmission mechanism, unsustainable expansion of *any* money, without increased production, ultimately validates his view: wealth cannot be conjured from paper alone. The real economy remains the foundation, but the path from monetary intervention to real effects becomes less predictable and more institutionally contingent than Hume's specie-based model allowed.

  ---

  **Marking Scheme (Total: 25 Marks)**  

  *   **1. Reconstruction of Hume’s Gradualist Argument (5 Marks):**  
      *   5: Precise, nuanced explanation of the sequence: money increase → localized spending surge → stimulation of real output/employment *before* general price rise due to uneven diffusion and lags. Explicit link to anti-mercantilism.  
      *   3-4: Sound summary but may lack emphasis on temporal sequence/lags or the localized stimulus mechanism. Link to anti-mercantilism present but implicit.  
      *   1-2: Superficial or inaccurate summary (e.g., implies instantaneous price rise, or money directly *is* wealth). Fails to capture the core "beneficial interval."  
      *   **Key Penalty:** -2/-3 for treating Hume as a strict metallist ignoring paper money entirely or conflating his view with modern instantaneous monetary neutrality. -1 for downplaying the *uneven diffusion* and localized effects.

  *   **2. Isolation of Hume’s Implicit Velocity Assumption (5 Marks):**  
      *   5: Clearly identifies the assumption that V remains relatively stable/unchanged *during the diffusion period* for the initial recipients, allowing spending to increase without immediate widespread price awareness/inflation expectations. Connects stability to the intrinsic credibility of specie.  
      *   3-4: Identifies velocity as important but may not explicitly state the assumption of *stability during the lag period* or may not link it tightly to the gradualist mechanism and specie credibility.  
      *   1-2: Vague or incorrect treatment of velocity (e.g., confuses it with quantity, assumes Hume explicitly discusses it, or misstates its role).  
      *   **Key Penalty:** -3 for ignoring velocity entirely. -2 for failing to specify *stability* during the diffusion phase as the critical implicit assumption. -1 for not linking stability to specie's intrinsic value.

  *   **3. Analysis of Paper-Credit Counterfactual (7 Marks):**  
      *   6-7: Sophisticated application of Hume’s framework. Clearly explains how tax-backing introduces uncertainty, impacting V (hoarding, discounting, hesitant spending). Analyzes how credibility replaces geography as a diffusion variable. Contrasts the decision-making of initial recipients vs. Hume's model.  
      *   4-5: Solid analysis but may lack depth on the *mechanism* of uncertainty affecting V or spending. May focus only on lack of convertibility without exploring velocity/credibility dynamics. Contrast with Hume present but not fully developed.  
      *   2-3: Superficial treatment. Merely states paper is different without applying Hume’s logic. May assert stimulus happens/doesn't happen without reasoning through diffusion and velocity.  
      *   0-1: Fails to engage meaningfully with the counterfactual or significantly misrepresents it.  
      *   **Key Penalty:** -3 for not addressing velocity uncertainty. -2 for ignoring credibility/perceived value. -1 for assuming the paper system works *exactly* like specie or *cannot* stimulate any industry.

  *   **4. Diagnosis of Divergence Point (5 Marks):**  
      *   5: Pinpoints the **initial spending decision** of the first recipients as the critical divergence point due to the need to assess the note's *current* value based on *future* expectations (redemption, inflation), inherently incorporating price concerns from the outset and potentially decoupling nominal spending from real stimulus. Explains *why* this differs from Hume (specie's intrinsic value allows immediate, confident spending).  
      *   4: Identifies the initial spending decision/recipient behavior as key but may lack clarity on *why* the valuation differs (e.g., focuses only on lack of convertibility, not the expectations component).  
      *   3: Identifies an earlier/later point (e.g., issuance itself or price rises) without sufficient justification linking it to the *mechanism* divergence.  
      *   1-2: Vague or incorrect identification (e.g., "when prices rise" without specifying *how* this timing differs).  
      *   **Key Penalty:** -3 for failing to identify a specific point or identifying a point that doesn't distinguish the counterfactual. -2 for not explaining *why* that point diverges from Hume's sequence.

  *   **5. Assessment of Impact on Anti-Mercantilism (3 Marks):**  
      *   3: Nuanced evaluation. Acknowledges the *potential* for credible paper systems to create temporary real wealth via stimulus *seems* to contradict Hume's dismissal of money's real effects, exposing a vulnerability. However, concludes that the fragility of confidence and the necessity of underlying real growth ultimately *uphold* Hume's core view that wealth is labor/commodities, not money.  
      *   2: Recognizes a tension but leans too heavily towards either "completely undermines" or "no impact at all." May miss the nuance of temporary effects vs. long-term validity.  
      *   1: Superficial or illogical connection (e.g., "paper proves money is wealth," or "no impact because Hume was right").  
      *   **Key Penalty:** -1 for asserting the counterfactual *completely* refutes Hume’s anti-mercantilism without acknowledging the role of confidence/fragility. -1 for claiming it has *no bearing* whatsoever.
