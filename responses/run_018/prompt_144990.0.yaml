answer: |-
  ## Opening Remarks: Agency After Desert

  Distinguished colleagues, guests, and friends,

  We are gathered under a provocative banner: "Agency After Desert." This workshop promises a vital conversation between neuroscience, law, and philosophy, exploring how we might hold one another accountable once we relinquish the deepest notion of blame – the idea of *ultimate desert*. To frame this day rigorously, I ask you to begin not with abstract principles, but with a disquieting observation about this very assembly.

  Look around you. Consider the complex chain of events that led you to sit in this specific seat today. Your presence here is the culmination of innumerable factors: the disciplinary training that shaped your intellectual instincts; the funding structures that made your research possible; the institutional invitations extended or withheld; perhaps even the chance encounters that nudged you towards neuroscience, philosophy, or law. Crucially, none of us chose the foundational cognitive architecture – the very structure of our minds – that processes information, forms judgments, and feels compelled by certain questions over others. We did not design the initial conditions of our own understanding.

  This brings us sharply to the philosophical anchor for our day: Galen Strawson’s Basic Argument. Strawson argues, with remorseless logic, that true moral responsibility – responsibility of the kind that would justify *ultimate* blame or praise, what he calls "desert" in its deepest sense – is impossible. Why? Because for an agent to be *ultimately* responsible for an action, they must be ultimately responsible for *how they are* mentally – for the reasons, desires, and character that lead to the action. But we cannot be the cause of our own mental nature. That nature is shaped by genetics, environment, upbringing, and a causal history stretching back long before "we" existed as conscious agents. To be the ultimate author of *that*, we would need to have existed prior to ourselves, to have chosen the very conditions of our own becoming. This leads to an infinite regress: we would need to be self-caused, which is logically incoherent. We are not *causa sui*; we are not our own first cause.

  Strawson directs this argument at the individual. But its force extends like a ripple. It implicates *us*, here, now, as a collective. None of us authored the intricate web of causes that determined our career paths, our methodological commitments, or the specific questions about agency and blame that resonate most powerfully within us. The philosopher’s commitment to compatibilism, the neuroscientist’s focus on neural correlates of decision-making, the legal scholar’s dedication to retributive justice frameworks – these are not freely chosen acts of pure intellectual will springing from nowhere. They are expressions of mental natures formed by unchosen histories.

  Consider, briefly, a researcher – let’s call her Dr. Anya Petrova – whose life’s work focuses on the neuroscience of addictive decision-making. Her fierce dedication stems, in part, from witnessing a parent’s struggle. The childhood circumstances that ignited this passion were not chosen by her. The neurodevelopmental pathways that encoded those experiences and shaped her emotional and intellectual responses were not chosen by her. The funding landscape that later supported her specific research trajectory was not authored by her. Yet, out of this unchosen confluence arises her powerful voice in today’s discourse on responsibility. The causal regress is undeniable and inescapable.

  This is not an invitation to nihilism or paralysis. It is, instead, the essential starting point for our practical task today: confronting the *limits of blame*. If ultimate desert is a metaphysical illusion – a ghost in the machine – then how do neuroscience and law construct viable, humane practices of accountability? How do we assign consequences, protect society, encourage rehabilitation, and express social condemnation *without* relying on the fiction that the offender, in some ultimate, buck-stopping sense, *deserved* their fundamental nature and thus truly authored their crime in a way that merits retribution?

  Neuroscience reveals the profound biological and environmental constraints on behavior, challenging simplistic notions of unfettered choice. Law grapples daily with the imperative to hold individuals accountable within a society that must function, often straining against the pull of retributivist instincts grounded in desert. Our disciplines are already navigating this post-desert landscape, often implicitly. Today, we bring that navigation into the open.

  Our challenge is to design responsibility practices – legal, social, personal – that acknowledge our shared predicament. We are all products of causes beyond our ultimate control. This realization does not erase agency as we experience it in the moment; it contextualizes it. It compels us to ask: Accountability for *what*? For *whom*? And *how*, when the foundation of ultimate blame has dissolved?

  So, let today be an exercise in collective design thinking, grounded in this rigorous, perhaps unsettling, philosophical premise. Let the papers presented and the discussions that follow grapple honestly with the implications of our shared lack of ultimate authorship. Let us explore how neuroscience can inform law, how law can evolve its concepts of culpability, and how philosophy can guide both, as we strive to build practices of responsibility that are effective, just, and truly humane – practices forged not in the illusion of desert, but in the reality of our conditioned, interconnected agency.

  I invite you now to embark on this essential work together. Thank you.

  ---

  **Reflective Note:** This speech extends Strawson’s Basic Argument, which primarily targets *individual* moral responsibility, to encompass the *collective and institutional agency* shaping our gathering and disciplinary perspectives. While Strawson focuses on the impossibility of being *causa sui* for one's character/mental nature, applying this logic directly to the contingent factors determining professional focus and participation moves beyond his explicit textual emphasis. This extension, while philosophically coherent in a deterministic framework, represents a liberty taken for rhetorical and framing purposes. Furthermore, the speech implicitly assumes a broadly deterministic or causal-closure view compatible with neuroscience, which Strawson's argument relies upon but doesn't explicitly defend against libertarian challenges. A revision would be necessitated by either: (1) A compelling, widely accepted philosophical defense of *agent-causal libertarianism* demonstrating how an agent can be an uncaused cause of their mental nature, breaking the regress; or (2) Robust, replicated empirical evidence demonstrating a specific, widespread form of *neuroplastic self-authorship* – a mechanism allowing individuals to fundamentally and *causa sui*-like reshape their core cognitive architecture or motivational springs in a way that genuinely escapes prior causal determination.
