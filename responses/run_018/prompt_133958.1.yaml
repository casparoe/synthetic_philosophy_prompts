  You are an expert in formal decision theory and rational-choice epistemology, with deep familiarity with updateless, evidential, and causal frameworks. Before answering, take a deep breath, then spend a moment brainstorming the logical space: list the main competing rules (updateless decision theory, evidential decision theory, causal decision theory, and any hybrid or modified variants you can construct), note how each treats precommitment, prediction, and self-reference, and only then apply them to the cases below.

  Consider the published verdicts of a decision theorist—call her Dr. K.—on the following scenarios, which she has discussed in recent lectures and essays (without naming specific papers):

  Case 1 (Standard Newcomb): A transparent predictor fills Box B with $1,000,000 only if it predicts she will take only Box B. She knows the predictor is highly accurate. Dr. K. says she should one-box.

  Case 2 (Counterfactual mugging): A mugger will attack her only if it predicts she will not pay a $100 ransom; if she pays, she is unharmed but out $100. She is currently facing the mugger. Dr. K. says she should pay.

  Case 3 (Transparent Newcomb with prior observation): The boxes are transparent. If she has not looked, she should one-box. If she has already looked and seen Box B is full, she should take both boxes; she treats this as a genuinely different decision problem from Case 1, not as hypocrisy.

  Case 4 (Coordinated copies): Two computational copies of her are run in isolated rooms. Only one copy receives a reward, and it receives it if and only if both copies make the identical choice. Each copy updates on being in its own room. Dr. K. endorses a precommitment strategy that both copies should follow, even though neither can causally influence the other.

  Case 5 (Harmful update pill): She can take a pill that causes her to update on future evidence in a way that violates causal decision theory but has no direct causal effect on the world. The update would lead her to make worse future choices. Dr. K. says she should refuse the pill, emphasizing that the reasoning process itself should not be corrupted for epistemic gain.

  Now consider the new case (Case 6—Epistemic blackmail with shadow computation):

  A predictor runs an algorithm that conditions on Dr. K.’s reasoning process at the exact moment of decision, but explicitly excludes her actual physical action from the conditioning set. The predictor has placed $1 in Box A and $1,000,000 in Box B. The algorithm is deterministic: if the reasoning trace leads to one-boxing, the predictor outputs “will two-box” and leaves Box B empty; if the reasoning trace leads to two-boxing, the predictor outputs “will one-box” and fills Box B. Crucially, Dr. K. can, at zero cost and with no causal feedback, run a “shadow computation”—a perfect simulation of her own reasoning that produces the same trace but is walled off from her decision architecture. The predictor’s algorithm cannot distinguish the shadow computation from the real reasoning trace.

  Dr. K. must render a verdict: should she one-box or two-box?

  Please do the following, thinking carefully and step-by-step:

  1. Identify at least three distinct decision-theoretic rules that are jointly consistent with Dr. K.’s verdicts in Cases 1–5. Include at least one genuinely updateless rule and at least one rule that incorporates evidential or causal updating in a non-trivial way. State each rule precisely.

  2. For each identified rule, derive exactly what it predicts for Case 6, explaining how it handles the shadow-computation loophole and the predictor’s exclusion of the action from its conditioning set.

  3. Give your best-guess prediction of Dr. K.’s actual verdict on Case 6. Justify this by showing which rule she is implicitly running, with explicit reference to how that rule explains her stance on Case 3 (the transparency/observation distinction) and Case 5 (the rejection of harmful self-modification).

  4. Propose one minimal-variation follow-up case that would sharply distinguish the two leading rules you identified in part 1. The variation should change only one feature of Case 6—such as the predictor’s access to the shadow trace, the cost of running it, or the reward structure—while keeping everything else fixed.

