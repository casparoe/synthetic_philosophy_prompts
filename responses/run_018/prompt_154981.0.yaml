    {
      "defeater": "Self-undermining: HOE assessment relies on intuitions it discredits, collapsing rationality.",
      "target": "akrasia",
      "severity": "fatal",
      "defender_concession": "no",
      "exposure_note": "Total: if HOE requires modal intuition to evaluate, akrasia undermines its own basis."
    },
    {
      "defeater": "Unfalsifiability: Qualifying the view to dodge counterexamples (e.g., 'well-tracked' intuitions in metaphysics) voids testability.",
      "target": "calibration",
      "severity": "fatal",
      "defender_concession": "no",
      "exposure_note": "High: defending with ad-hoc domain restrictions avoids disproof but sacrifices empirical grounding."
    },
    {
      "defeater": "Overgeneralization: Applying HOE-driven akrasia universally risks paralyzing skepticism (e.g., in logic/perception).",
      "target": "scope",
      "severity": "awkward",
      "defender_concession": "partial",
      "exposure_note": "Moderate: defenders may concede but argue metaphysics is uniquely defective, though boundary issues persist."
    },
    {
      "defeater": "Well-tracked domains exist: Some modal intuitions (e.g., logical necessities) resist calibration critiques.",
      "target": "calibration",
      "severity": "minor",
      "defender_concession": "partial",
      "exposure_note": "Low: concedes calibration isn't uniformly poor but doesn't refute akrasia for metaphysics specifically."
    }
  ]
  ```

  ### Which Should Move You?  
  - **Move decisively on fatal defeaters**: The self-undermining and unfalsifiability issues demand resolution. If HOE’s evaluation *itself* depends on modal intuition, your view cannot coherently prescribe akrasia. Similarly, if qualifications shield the theory from counterevidence, it ceases to be rational.  
  - **Awkward defeater is addressable**: Overgeneralization can be mitigated by scoping HOE’s applicability to metaphysics alone—but only if you clearly justify why metaphysics is uniquely untrustworthy.  
  - **Minor defeater is ignorable**: Well-calibrated domains don’t threaten your core, as quantum mechanics and peer disagreement still plausibly decimate *metaphysical* intuitions.  

  **Priority**: Fix self-undermining first—or your view rationally implodes.
