  The coupling between Alice and Bob introduces a coordination element. Without the coupling (if they were two isolated Pasadena games), then each would face a single Pasadena game. In that case, the issue is only the undefined expectation. But with coupling, the sign of the expectation (when truncated) depends on the other's action. Without the coupling, we would have:

