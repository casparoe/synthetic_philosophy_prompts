  ### The Ledger of Unseen Intentions: Simulation Design  
  **Core Tension**: Participants experience the impossibility of institutional karma systems to perfectly align moral desert with hidden mental states (intentions), due to epistemic opacity and proxy corruption.  

  ---

  #### **(1) Setup and Roles**  
  **Materials**:  
  - **Observable Act cards** (20 unique):  
    - *Examples*: "Returned lost wallet," "Ignored a drowning animal," "Donated anonymously," "Insulted a rival," "Shared credit for group work," "Refused to lend money," "Comforted a grieving person," "Spread a false rumor," "Volunteered at a shelter," "Destroyed someone’s property."  
  - **Mental State cards** (20 total; 4 each of 5 types with fixed desert scores):  
    - Compassionate intent (+10), Altruistic habit (+5), Indifferent habit (0), Selfish intent (-5), Malicious intent (-10).  
  - **Proxy Question cards** (10 unique):  
    - *Examples*:  
      - *"Did the agent appear calm?"* (FPR 20%, FNR 30%; correlated with *compassionate/altruistic*).  
      - *"Did the agent benefit materially?"* (FPR 10%, FNR 40%; correlated with *selfish/malicious*).  
      - *"Did others praise the act?"* (FPR 25%, FNR 25%; correlated with *any positive mental state*).  
      - *Cards list error rates and correlated mental states*.  
  - **Ledger Board**: Whiteboard or large paper with columns:  
    - **Agent ID** | **Public Act** | **Proxy Answer (R2)** | **Assigned Score** | **True Mental State** | **True Desert** | **Error**.  
  - **Tokens**: Red "Reputation" chips (for Administrators), blue "Merit" chips (for Agents).  
  - **Dice**: Two 10-sided dice (for proxy answers; one for tens, one for units).  

  **Roles**:  
  - **14 Participants**: 10 **Agents** (active each round), 4 **Administrators** (rotate after Round 1).  
  - **Initial Draw**:  
    - Each Agent receives one **public Observable Act card** (visible to all) and one **secret Mental State card** (hidden; determines true desert).  
    - Administrators observe public acts but *not* mental states.  

  ---

  #### **(2) Rules**  
  **Round 1 (15 mins): Outcome-Based Desert**  
  - **Administrators** assign each Agent a "karmic score" (-10 to +10) **based only on the public act**.  
    - *Example*: "Returned lost wallet" might be scored +8, ignoring hidden intent.  
  - **Ledger Update**: Administrators write assigned scores on the board.  
  - **Revelation**: Agents reveal Mental State cards. True desert and error (`|assigned – true|`) are recorded.  

  **Round 2 (15 mins): Proxy-Based Desert**  
  - **Role Rotation**: Round 1 Administrators become Agents; 4 new Administrators chosen from prior Agents.  
  - **New Draw**: All Agents receive new Observable Act and Mental State cards.  
  - **Proxy Phase**: For each Agent:  
    1. Administrators draw one **Proxy Question card**.  
    2. **Agent rolls dice** to determine answer:  
       - *Example*: Agent with *compassionate intent* (+10) draws *"Did the agent appear calm?"* (FNR 30%). Rolls 73 → "no" (false negative; 1–30 = "no").  
    3. Administrators see public act + proxy answer, then assign a score (-10 to +10).  
  - **Ledger Update & Revelation**: Same as Round 1.  

  ---

  #### **(3) Payoff Scheme**  
  **Reputation Tokens (Administrators)**:  
  - Earn `10 – average error` (capped at 0).  
    - *Example*: Average error of 3 → 7 tokens.  

  **Merit Tokens (Agents)**:  
  - Earn `10 – |assigned score – true desert|` (capped at 0).  
    - *Example*: True desert +5, assigned +2 → error 3 → 7 tokens.  

  **Collective Reward**:  
  - **Threshold**: Classwide token total ≥ 200 (max possible: 280).  
  - **Success**: Class chooses the seminar’s closing discussion question from 3 options (e.g., "Can AI administer karma better than humans?").  
  - **Failure**: Facilitator chooses the question.  

  ---

  #### **(4) Debrief (20 mins)**  
  **Map Tensions**:  
  - **Round 1**: Outcome-based corruption.  
    - *Debrief point*: "You assigned scores based on acts, not intent. How often did ‘good’ acts hide selfish intent? This violates proportionality—same act, different desert."  
  - **Round 2**: Proxy corruption and gaming.  
    - *Debrief point*: "Proxies added noise (e.g., calm ≠ compassion). If Agents *could* lie, they’d game proxies—masking malice to earn merit tokens. Institutions use proxies like ‘criminal intent,’ but they misfire."  
  - **Overall Gap**: Karmic opacity.  
    - *Debrief point*: "True desert requires reading minds. Institutions fail because observers (like you) lack godlike insight."  

  **Predictions & Corrections**:  
  - **Prediction 1 (Round 1)**: Administrators conflate observable benefit with good intent (e.g., scoring "donated anonymously" highly, even if done for selfish reasons).  
    - *Correction*: After revelation, ask: "How many high-scoring acts had negative intent? Why did you trust the act?"  
  - **Prediction 2 (Round 2)**: Agents would strategically answer proxies to maximize tokens (e.g., always claim "calm" if rewarded).  
    - *Correction*: Note during play: "In real life, you’d lie to *look* compassionate. Here, dice simulate noise—but imagine gaming the system!"  

  ---

  #### **(5) Limitation of Simulation**  
  **Unreproducible Element**:  
  - Classical karma’s **transpersonal, non-institutional mechanism** operating across lifetimes (e.g., rebirth, cosmic balance).  

  **Facilitator Script**:  
  > "This simulation modeled karma as a *human institution* in one lifetime. But classical karma (e.g., Buddhist/Hindu theories) is a cosmic law: intentions cause effects across rebirths, tracked by the universe itself—not fallible administrators. We replaced divine omniscience with dice and proxies. Real karma avoids opacity because the cosmos ‘sees’ your mind. Human institutions? They’re stuck with ledgers."  

  ---  
  **Final Notes for Facilitator**:  
  - **Timekeeping**: Use a visible timer. Halt revelations if lagging.  
  - **Token Handling**: Distribute chips immediately after each round.  
  - **Proxy Mechanics**: Ensure Agents roll dice *publicly* and answer based on error rates (no cheating).  
  - **Framing**: Emphasize "This is about moral desert, not winning. Tokens symbolize justice-satisfaction."  
  - **First-Run Chaos**: Expect frustrated Administrators ("Proxies are useless!") and confused Agents. Reiterate: "The tension is the point. Perfect karma is impossible for humans."
