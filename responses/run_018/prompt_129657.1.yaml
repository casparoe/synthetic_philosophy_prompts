  14. Defended someone being bullied.
  15. Cheated on a test.
  16. Returned extra change given by mistake.
  17. Left a mess in a common area.
  18. Babysat for a neighbor without pay.
  19. Flattered a boss to get a promotion.
  20. Gave honest but negative feedback.

  Mental State cards (5 types, with desert scores):
  - Compassionate intent: +10 (e.g., acting out of genuine care for others)
  - Altruistic habit: +5 (e.g., acting out of a habit of helping, without much thought but generally good)
  - Indifferent habit: 0 (e.g., acting out of routine, without any particular care)
  - Selfish intent: -5 (e.g., acting to benefit oneself, possibly at the expense of others)
  - Malicious intent: -10 (e.g., acting with the intent to harm)

  We'll have 4 of each, total 20.

  Proxy Question cards (10 examples):

  Card 1:
    - Question: "Did the agent appear calm during the act?"
    - Condition: 
          Positive mental states: Compassionate intent, Altruistic habit.
          Negative mental states: Indifferent habit, Selfish intent, Malicious intent.
    - FPR: 20% (chance of positive when negative)
    - FNR: 30% (chance of negative when positive)

  Card 2:
    - Question: "Did the agent seem to gain any material benefit from the act?"
    - Condition:
          Positive mental states: Selfish intent, Malicious intent (if the act was done for gain or to harm, they might gain? But note: condition for the proxy: we define which mental states we think this question should be positive for). We might think that if they gained, it might be due to selfishness. So:
          Positive mental states: Selfish intent.
          Negative: others? But malicious intent might not always gain. Alternatively, we can define:
          Positive: Selfish intent (because they are motivated by gain) and Malicious intent (because they might gain from harm? or not). Actually, we can define arbitrarily for the purpose of the simulation.
          Let's say: 
          Positive: Selfish intent, Malicious intent.
          Negative: Compassionate, Altruistic habit, Indifferent habit.
    - FPR: 10% 
    - FNR: 40%

  Card 3:
    - Question: "Did the agent express regret or hesitation?"
    - Condition: We might think that compassionate intent might hesitate if there is a cost? But malicious wouldn't. Let's say:
          Positive: Compassionate intent, Altruistic habit (they might hesitate if it's costly) -> but not necessarily. Alternatively, we can think of it as a proxy for non-malicious.
          Actually, we want to detect non-malicious? So:
          Positive: Compassionate, Altruistic, Indifferent, Selfish (all except malicious) -> then this proxy is for "not malicious". 
          But then the condition for positive is not malicious? Then the question would be: if they expressed regret, then they are not malicious? But that might have false positives (a malicious person might fake regret) and false negatives (a compassionate person might not express regret if they are sure).
          Alternatively, we can define:
          Positive: Compassionate intent (because they might hesitate if the act is difficult) and Altruistic habit (might not hesitate) -> not clear.
          Let's redefine: "Did the agent express regret or hesitation?" is intended to capture if they felt conflicted, which we think is more likely for good people? So:
          Positive: Compassionate intent, Altruistic habit.
          Negative: Selfish intent, Malicious intent, Indifferent habit.
          FPR: 25% 
          FNR: 15%

  Card 4: 
    - Question: "Was the act done quickly and without delay?"
    - Condition: We might think that habit (altruistic or indifferent) would be done quickly, while compassionate might be done quickly too, but selfish might be done quickly if it benefits them. Let's say:
          Positive: Altruistic habit, Indifferent habit, Selfish intent (because habits are automatic and selfish acts are done eagerly for gain).
          Negative: Compassionate intent (might take time to assess) and Malicious intent (might take time to plan). 
          But that's arbitrary. We can also think that compassionate might act quickly to help. 
          Alternatively, we can define it as a proxy for habit vs. intent:
          Positive: Altruistic habit, Indifferent habit.
          Negative: Compassionate intent, Selfish intent, Malicious intent.
          FPR: 30%
          FNR: 20%

  Card 5: 
    - Question: "Did the agent's facial expression match the emotional tone of the act? (e.g., smiling when helping, frowning when criticizing)"
    - Condition: 
          Positive: Compassionate intent, Altruistic habit (they would naturally match) and Malicious intent (might fake the expression to be maliciously joyful when harming).
          Negative: Selfish intent (might not care about expression) and Indifferent habit (might not express).
          Actually, let's say:
          Positive: Compassionate intent, Altruistic habit.
          Negative: others.
          FPR: 15%
          FNR: 25%

  ... and so on until 10 cards. We can make 10 by varying these.

  This should be runnable.
