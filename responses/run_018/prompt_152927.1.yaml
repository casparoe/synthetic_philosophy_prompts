answer: |-
  Your diagnosis is razor-sharp—the core impasse *isn't* about materialism vs. dualism or the basic science, but about **conflicting interpretations of what multiple realizability implies for scientific practice and metaphysics**. Here's the breakdown:

  ### The Real Conflict: Two Visions of Multiple Realizability
  1. **Substrate Independence (Functionalist Interpretation)**  
     Multiple realizability demonstrates that mental states are **abstract functional roles** separable from their physical implementation. Minds are "real patterns" (Dennett) that can be multiply embodied. Robots/aliens prove that neural wetware isn't essential—functional equivalence is what matters. *Goal: Preserve psychology's autonomy as a science of abstract causal profiles.*

  2. **Taxonomic Messiness (Reductivist Interpretation)**  
     Multiple realizability reveals that mental state categories (e.g., "pain") are **disjunctive heaps** at the physical level—too heterogeneous to support lawlike generalizations or mechanistic explanations. Robots/aliens are edge cases exposing the *explanatory uselessness* of functional kinds for neuroscience. *Goal: Ground explanation in unified physical mechanisms.*

  ### Why It's Not Merely Verbal
  - **"Realization" ambiguity** plays a role (e.g., is it causal structure or abstract computation?), but the deeper divide is **epistemic**:  
    - Functionalists prioritize *causal role invariance* across substrates (explanation via input/output/profile).  
    - Reductionists demand *mechanistic unity* for projectibility (explanation via physical structure).  
  - **Disjunctive Kinds**: The crux is whether such kinds can figure in genuine scientific laws. Reductionists argue disjunctions (e.g., "pain = neural pattern A OR silicon circuit B OR...") aren't projectible—they're placeholders for deeper physical kinds. Functionalists counter that disjunctions *are* projectible if they capture robust causal patterns (e.g., "learning" in rats/octopuses/AI).

  ### Hidden Battleground: Explanatory Autonomy vs. Metaphysical Grounding  
  - **Functionalists** answer: *"How do minds persist across physical variation?"* (Metaphysical question about universality).  
  - **Reductionists** answer: *"How do we explain cognition mechanistically?"* (Explanatory question about scientific practice).  
  They’re not directly opposing—they're solving *different problems* under the same banner. Functionalists protect high-level generalizations; reductionists seek physical tractability.

  ---

  ### What Progress Would Look Like
  The stalemate breaks only by addressing the **explanatory gap**, not metaphysics. Progress requires:

  1. **Formalizing "Projectibility" of Functional Kinds**  
     - A rigorous account of when disjunctive kinds support predictions (e.g., computational equivalence classes preserving causal topology).  
     - *Example*: Showing that neural/silicon realizations of a ResNet *must* share error profiles under perturbation, making "layer depth" projectible despite substrate.  

  2. **Clarifying Mechanistic Constraints**  
     - Demonstrating how functional descriptions *constrain* physical mechanisms (e.g., Marr's levels: computational task → algorithmic solution → hardware implementation).  
     - *Progress*: Prove that certain functional roles (e.g., recurrent feedback) *require* specific physical architectures (e.g., low-latency connectivity), reducing disjunction.  

  3. **Rejecting the Badly Posed Question**  
     - **Radical Option**: Declare "mental state" a folk category unfit for science. Replace it with context-specific ontologies (e.g., "attractor dynamics" for memory, "predictive coding" for perception).  
     - **Integrative Option**: Adopt a *pluralist* explanatory framework (Craver, Piccinini): Functional kinds are provisional tools for coarse-grained modeling, but must *anchor* to mechanisms for fine-grained explanation.  

  ### Path Forward
  - **Most feasible**: A **formal result** showing that some functional categories *reduce disjunction* under physical constraints (e.g., "Any system realizing belief-desire psychology *must* have modular feedback pathways").  
  - **Likely resolution**: Psychology retains autonomy for *descriptive/computational* explanations, while neuroscience handles *mechanistic/causal* ones—with explicit mapping principles bridging them.  

  **In short**: The debate persists because functionalists sell universality, reductionists demand specificity. Progress means forcing functional categories to earn their explanatory keep—or letting them die.
