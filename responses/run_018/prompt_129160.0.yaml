answer: |-
  You've pinpointed a crucial and often confusing distinction in distributive ethics. Let's untangle prioritarianism, egalitarianism, and the leveling-down objection as they apply to weighted-QALY protocols in triage.

  1.  **Your Core Confusion (Flipped):** You *are* mixing prioritarianism and egalitarianism regarding the leveling-down objection (LDO). **The LDO is primarily a devastating critique of *egalitarianism*, *not* prioritarianism.** You had it backwards initially.

  2.  **Egalitarianism (The Target of LDO):**
      *   **Core Idea:** Values equality *for its own sake*. An equal distribution of welfare (or resources) is intrinsically valuable, even if no one is better off and some might be worse off.
      *   **Leveling-Down Objection:** This is the fatal flaw. Imagine two scenarios:
          *   Scenario A: Healthy Person has 80 units of welfare, Sick Person has 20.
          *   Scenario B: Healthy Person has 40 units, Sick Person has 20.
      *   A *strict egalitarian* must see Scenario B as *better* (or at least not worse) than Scenario A *in one crucial respect*: it is *more equal*. No one is better off (the Sick Person is unchanged), and the Healthy Person is worse off. This "leveling down" to achieve equality seems perverse – it sacrifices overall welfare and harms someone *without benefiting anyone* purely for equality's sake. Egalitarians usually try to avoid this conclusion by incorporating other values (like priority), becoming *pluralist*.

  3.  **Prioritarianism (Designed to Avoid LDO):**
      *   **Core Idea:** Benefits (increases in welfare) matter more morally the worse off the recipient is. It cares about *absolute* welfare levels *and weights* increases differently based on baseline position. **Equality itself has no intrinsic value.** The focus is on *improving the lot of the worse-off*.
      *   **Response to LDO:** Prioritarians *reject* Scenario B above. Why? While it achieves equality, it does so by *harming* the Healthy Person without *benefiting* the Sick Person. Prioritarianism is only concerned with *increasing* welfare, especially for the worse-off. Harming the better-off to achieve equality, *without helping the worse-off*, provides *no moral gain* for a prioritarian. It violates the core commitment to *improving* absolute well-being, particularly of the disadvantaged. Scenario A is clearly preferred.

  4.  **Weighted-QALY Protocols & Philosophical Commitments:**
      *   These protocols explicitly assign a higher value (weight) to a QALY gain for a patient starting from a lower baseline health state (e.g., with a pre-existing disability).
      *   **This is quintessentially *prioritarian*.** Why?
          *   **Focus on Baseline:** It directly uses baseline welfare/health to determine the *moral weight* of a benefit.
          *   **Goal:** To direct resources where a given health gain (QALY) provides the *greatest moral benefit*, defined as benefiting those who are worse off. A QALY gain for someone already severely disabled is considered morally more valuable than the *same absolute QALY gain* for someone healthy.
          *   **Avoids LDO:** It doesn't seek to *reduce* the health of the well-off to match the disabled. It seeks to *increase* the health (or life prospects) of the disabled *more than it would increase the health of the well-off*, for the same absolute resource input. It aims to *improve* the absolute position of the worse-off, not just make everyone equal.

  5.  **Is it a Hybrid?**
      *   While the core weighting mechanism is prioritarian, real-world application often involves thresholds or sufficientarian elements. For example, protocols might only apply weights below a certain health threshold, reflecting the idea that there's a level of health below which needs are especially urgent ("sufficiency").
      *   However, the fundamental logic of giving *extra weight to benefits accruing to the worse-off based on their baseline* is the defining feature of prioritarianism. It doesn't presuppose egalitarianism's intrinsic valuation of equality.

  6.  **The Reductio You Mentioned:**
      *   Your scenario ("make everyone equally miserable") is indeed a *reductio ad absurdum* argument *against* strict egalitarianism, demonstrating its counterintuitive implication via the LDO. Prioritarians use this reductio to argue *for* their view, which avoids this pitfall.

  **Verdict: Weighted-QALY protocols prioritizing patients with pre-existing disabilities are fundamentally prioritarian, as they weight health gains based on baseline welfare without valuing equality intrinsically or endorsing leveling down.**
