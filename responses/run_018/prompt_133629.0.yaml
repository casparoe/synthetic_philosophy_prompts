answer: |-
  **Bottom-line design decision:** The simulation employs an explicit "Analogical-Reasoning License" card system to force conscious justification of ethnographic comparisons, preventing unexamined bias and highlighting how analogies amplify underdetermination.  

  ### Reasoning  
  - **Why explicit analogical licenses?** Unchecked analogies perpetuate confirmation bias in archaeology (e.g., projecting Polynesian rituals onto Neolithic Europe). Requiring teams to "spend" a limited license (3 per team) compels them to defend their analogies, exposing their fragility during deliberation.  
  - **Negative spaces as equal evidence:** Absences (e.g., expected tools not found) carry equal weight to artifacts. This mirrors real archaeology, where omissions can redefine interpretations (e.g., missing weapons implying ritual pacifism).  

  ### Ground Truth  
  **Hidden context:** A Bronze Age coastal settlement’s "Feast of Return" ritual.  
  - **Belief complex:** Ancestors return annually via the sea; consuming saltwater shellfish grants spiritual protection.  
  - **Institution:** A matrilineal council of elders oversees rituals; shellfish are taboo outside ceremonies.  
  **Material traces:** Circular shell middens, stone altars, fishing tools, and *absent* domestic pottery in ritual zones.  

  ### Simulation Rules  
  1. **Teams & Roles (7 per team):**  
     - *Pattern Analyst:* Maps spatial relationships (diagrams/artifact clusters).  
     - *Ethnographic Skeptic:* Challenges analogies; only they can counter license plays.  
     - *Institutional Advocate:* Synthesizes social structure from artifacts.  
     - *Negative-Space Interpreter:* Decodes omissions (e.g., "Why no hearths here?").  
     - *Belief Constructor:* Weaves artifacts into belief narratives.  
     - *Taphonomy Assessor:* Flags potential preservation biases (limited role; see *Limitations*).  
     - *Devil’s Advocate:* Stress-tests the team’s reconstruction.  

  2. **Trace Subsets (Partially Overlapping):**  
     - **Team 1:** Receives *shell midden diagrams*, *stone altars with wear patterns*, *fishing hooks*, and negative space: *"No domestic pottery in ritual zones."*  
     - **Team 2:** Receives *hearth remains*, *carved ancestor figurines*, *ochre pigments*, and negative space: *"No shellfish in domestic waste pits."*  
     - **Shared Traces:** *Animal bones* (seal, bird), *circular ritual space layout*.  
     - **Design for Underdetermination:**  
       - Team 1 reconstructs a *seafaring ancestor cult* (altars = offering sites; absent pottery = sacred prohibition).  
       - Team 2 reconstructs a *seasonal hunting ritual* (figurines = animal spirits; absent shellfish = resource scarcity).  
       Both are incompatible yet defensible: Shellfish absence is either *taboo* (Team 1) or *ecological* (Team 2).  

  3. **Phases & Timeline (90 min total):**  
     - **0–5 min:** Assign roles, distribute traces. Teams *cannot* view opponent’s artifacts.  
     - **5–35 min:** *Reconstruction Phase.* Teams build belief/institution narratives. Analogies require playing a license card (3 per team), defended to the skeptic.  
     - **35–55 min:** *Presentation Phase.* Each team presents (10 min). Opponents take notes but cannot interrupt.  
     - **55–75 min:** *Deliberation.* Teams cross-examine using shared traces. Full artifact sets revealed.  
     - **75–85 min:** *Voting.* Secret ballot: "Which reconstruction is more convincing?" (weight: 60%). Peer-ranked "argument quality" (1–5 scale; weight: 40%). "Publication credits" assigned: Winning team splits 70% of credits; losing team splits 30%. Credits determine individual rankings (e.g., "lead author" status).  
     - **85–90 min:** Reveal ground truth.  

  ### Materials  
  - **Artifact Cards:** Descriptions/diagrams printed on paper (e.g., "Figurine: carved whalebone, traces of ochre").  
  - **Negative-Space Cards:** Bolded absences (e.g., "NO hearths in ritual enclosure").  
  - **Diagrams:** Spatial maps of ritual circles (1 unique, 1 shared per team).  
  - **Analogical Licenses:** Three red cards per team; must be physically played to invoke comparisons (e.g., "Like Pacific Northwest potlatches...").  

  ### Debrief Mapping  
  - **Reconstruction Phase → Middle-Range Linking:** Teams connect traces to behaviors (e.g., shell middens = feasting). Shows ambiguity in linking arguments.  
  - **Analogical Licenses → Analogical Overreach:** Forces scrutiny of cross-cultural parallels (e.g., "Is this Inuit analogy relevant?").  
  - **Negative-Space Focus → Interpretation of Absence:** Debates on omissions (e.g., "Does no pottery imply ritual purity or poor preservation?").  
  - **Deliberation → Peer Review in Archaeology:** Reveals how consensus is negotiated, not discovered.  

  ### Predicted Failure & Correction  
  - **Failure:** Teams will seek the facilitator’s approval, converging on a "safe" interpretation (e.g., assuming rituals must involve burial).  
  - **Correction:** Start by stating, "There is no ‘correct’ answer—I will not validate theories." During reconstruction, interject: "Argue from *your* artifacts, not my intent."  

  ### Frank Limitation  
  **Unreproducible Element:** *Taphonomic distortion* (e.g., decay, soil erosion). Real archaeology uses stratigraphy to infer chronology and preservation biases. Here, participants must be told: "Assume artifacts are contemporaneous and well-preserved—in reality, decay could mask evidence."  

  ---  
  This simulation makes underdetermination visceral: Teams with overlapping traces build irreconcilable institutions, and licenses force analogies into the open. The payoff scheme incentivizes rigorous defense, while the ground truth reveal underscores that material traces rarely point to one story.
