prompt: |-
  I facilitate a graduate workshop in philosophy of science and material culture—fourteen participants, one ninety-minute session, all familiar with basic philosophy of archaeology but not specialists. Design a runnable classroom simulation that makes participants feel the force of archaeological underdetermination: specifically, that material traces radically underdetermine reconstructions of both belief and social institution, and that accumulating more artifacts can proliferate competing interpretations rather than converge on one. The simulation should work as follows. Divide the group into two teams of seven; give each team a different, partially overlapping subset of replicated material traces—physical descriptions, spatial diagrams, wear-pattern notes, and deliberately weighted “negative spaces” (expected artifacts that are absent)—drawn from a single hidden archaeological context. Each team must reconstruct both a specific belief complex and an institutional structure, then defend it in a structured deliberation. Include explicit roles within each team (pattern-analyst, ethnographic-analogy skeptic, institutional-reconstruction advocate, negative-space interpreter), rules that prevent either team from seeing the other’s full trace-set until after initial presentations, and a non-monetary payoff scheme (consensus votes weighted by argument quality, with “publication credit” stakes that determine a final collective ranking). Choose one specific hidden “ground truth” belief-institution pair for me to reveal only after presentations—do not leave this open—and design the trace subsets so that both reconstructions are materially defensible but incompatible. Include a timeline with exact phases, cheap reproducible materials (paper cards, printed diagrams), a debrief that maps each simulation phase onto a specific inference problem in archaeology (e.g., middle-range linking arguments, analogical overreach, the interpretation of absence), and an honest note on which feature of real archaeological inference—such as stratigraphic chronology or taphonomic distortion—the simulation necessarily cannot reproduce and must be supplied verbally. Take a committed position: choose whether to include an explicit “analogical-reasoning license” card mechanism that teams must play to invoke ethnographic comparison, or to leave analogical reasoning implicit and let it emerge as unexamined bias; defend your choice. Also be definite about whether negative spaces should carry equal evidential weight to present objects. Predict exactly what will go wrong the first run—particularly the tendency for teams to converge on the facilitator’s unstated expectations—and specify the correction without breaking the simulation’s integrity. Lead with your bottom-line design decision in the first sentence; then present the reasoning, rules, timeline, materials, debrief, predicted failure, and frank limitation. No preamble, no restatement of this prompt, and take definite positions throughout rather than surveying options.
reasoning: |-
  We are designing a simulation with the following core structure: 
   - Two teams of seven, each gets a different but partially overlapping set of material traces from a single hidden context.
   - Each team must reconstruct a belief complex and an institutional structure, then defend in a structured deliberation.
   - Explicit roles per team, rules for information sharing, non-monetary payoff scheme.
   - A specific hidden ground truth to be revealed after the presentations.

   Bottom-line design decision: The simulation will use an explicit "analogical-reasoning license" card mechanism to force teams to consciously justify their use of analogies, thereby making the role of analogy in underdetermination visible and debatable.

   Reasoning: Without an explicit mechanism, analogical reasoning tends to operate as an unexamined bias, which would undermine the pedagogical goal of exposing underdetermination. By requiring teams to play a card to invoke an analogy, we force them to articulate and defend their analogical links, making the inference process more transparent and open to critique.

   Ground Truth: The hidden context is a ritual site of a hypothetical prehistoric society (circa 2000 BCE) in which a group practiced a form of ancestor worship with a hereditary priesthood. The belief complex centers on the idea that ancestors mediate between the living and a sky god, and the institutional structure is a hierarchical priesthood with a chief priest, a ritual specialist, and lay participants. The ritual involves the breaking of pottery containing offerings (food, small objects) and the burial of the shards in a circular pattern around a central post (representing the axis mundi). The negative space includes the absence of metal objects (expected in contemporary sites) and the absence of human remains (which would be expected in a burial site but here the site is purely ritual).

   Materials:
   - Two sets of artifact cards (each set has about 10-12 cards, with 5 overlapping between sets). Each card describes an artifact with a physical description, spatial location (diagram reference), and wear patterns.
   - Diagrams: Two diagrams (one per team) showing the spatial layout of the artifacts. They will have some overlapping features (e.g., a central post hole) but each will have unique features. The diagrams will be printed on paper.
   - Negative Space Cards: Each team gets 2-3 cards describing expected but absent artifacts (e.g., "No metal objects found in any layer", "No human remains in the ritual pits", "No evidence of permanent habitation structures within 100m").
   - Roles per team (7 participants per team, so some roles might be doubled or adjusted):
      1. Pattern Analyst: Identifies spatial and formal patterns in the artifacts.
      2. Ethnographic-Analogy Skeptic: Challenges any use of analogies and demands internal consistency.
      3. Institutional-Reconstruction Advocate: Pushes for a coherent institutional story.
      4. Negative-Space Interpreter: Focuses on the meaning of absences.
      5. Belief System Constructor: Builds a narrative about beliefs.
      6. Chronology/Taphonomy Assessor: Considers time depth and preservation (though limited in simulation).
      7. Devil's Advocate: Challenges the team's own reconstruction to stress-test it.

   Rules:
   - Teams cannot see each other's full trace sets until after the initial presentations.
   - Each team has 30 minutes to reconstruct and 10 minutes to present (including showing their artifacts and diagrams).
   - During the reconstruction phase, if a team wants to use an ethnographic analogy (e.g., "like the Hopi kiva ceremonies"), they must play an "Analogical-Reasoning License" card (each team gets 3 such cards). They must state the analogy and justify why it is appropriate. The skeptic role must be allowed to challenge any analogy.
   - Negative spaces carry equal weight to present objects because in archaeological reasoning, the absence of expected evidence can be as significant as the presence. However, the interpretation of absence is highly contestable and that is part of the underdetermination.
   - After presentations, there is a 20-minute deliberation where each team can question the other and point out inconsistencies. Then, all participants vote (secret ballot) on which reconstruction they find more convincing, regardless of team. Votes are weighted by argument quality? Actually, we can have two metrics: (1) individual vote on which team's reconstruction was more convincing, and (2) each participant ranks the argument quality of both teams on a scale of 1-5. The publication credit is assigned as follows: the team with the most votes gets 60% of the "publication credit", the other 40%. Additionally, each participant's argument quality ranking is averaged per team, and the team with the higher average gets an extra 20% credit. This means the maximum credit for a team is 80% (if they win the vote and have higher argument quality) and minimum 20% (if they lose both). The credits are then used to rank the participants individually: within each team, participants are ranked by their peers (each participant ranks their own team members for contribution). The top-ranked in the winning team gets the highest publication credit, then so on. This is a bit complex, but we can simplify: the payoff is collective in that the team's overall credit is split by peer ranking, but the credit determines a final ranking of all 14 participants.

   Timeline (90 minutes total):
   1. Introduction and Team Formation (5 min): Explain the rules, assign teams and roles. Hand out materials.
   2. Team Reconstruction Phase (30 min): Each team works with their artifact set and diagrams to reconstruct belief and institution. Facilitator circulates to answer procedural questions but does not guide.
   3. Team Presentations (20 min): Each team gets 10 minutes to present their reconstruction (belief and institution) and show their key artifacts and diagrams. The other team cannot interrupt but can take notes.
   4. Deliberation and Challenge (20 min): Open floor for questions and challenges. Each team can ask the other team questions. The facilitator moderates.
   5. Voting and Credit Assignment (10 min): Secret ballot for which reconstruction is more convincing. Then, each participant rates the argument quality of both teams (scale 1-5). Also, each participant ranks their own team members by contribution (1 to 7, with 1 being highest). Facilitator collects and quickly computes.
   6. Reveal and Debrief (15 min): Reveal the ground truth. Then debrief.

   Predicted Failure: Teams will try to guess the facilitator's expectations and converge on what they think is the "right" answer. They might also be reluctant to use the analogical licenses because they feel uncertain, leading to under-utilization of analogies and thus less exposure of analogical underdetermination.

   Correction: At the start, emphasize that the goal is not to guess the ground truth but to build a defensible reconstruction from the evidence. Also, during the reconstruction phase, if a team is not using their analogical licenses, the facilitator can remind them that they have the cards and that using analogies is a valid strategy. However, do not push any particular interpretation.

   Frank Limitation: The simulation cannot reproduce the role of stratigraphic chronology and taphonomic processes (like decay, disturbance, etc.) that in real archaeology provide critical constraints. We must verbally explain that in reality, the context is built by layers and time, and that taphonomy can remove evidence, but in the simulation we are giving a static snapshot.

   Debrief Mapping:
   - Reconstruction Phase: Illustrates the underdetermination of theory by data. The same traces can support multiple reconstructions.
   - Use of Analogical License: Maps to analogical overreach in archaeology (e.g., using ethnographic parallels without critical examination). Also shows how analogies can be necessary but risky.
   - Negative Space Interpretation: Shows how absence can be interpreted in multiple ways (e.g., absence of metal might mean poverty, or ritual prohibition, or poor preservation? but in our case we rule out preservation by context).
   - Deliberation Phase: Reflects peer review in archaeology, where competing interpretations are challenged.
   - Ground Truth Reveal: Shows that even with a hidden reality, the evidence underdetermines the reconstruction.

   Materials Preparation:
   - Artifact Cards: 
     Team 1: 
       1. Central post hole (diagram shows it in center, with charring at base).
       2. Circular arrangement of 10 small pits (each pit contains fragments of pottery).
       3. Pottery shards (from 5 different vessels, each with soot on the inside).
       4. Animal bones (burned, mostly bird bones) in two of the pits.
       5. Stone pendant (with a hole, found near the central post).
       6. Absence Card: No metal objects (expected in contemporary sites in the region).
       7. Absence Card: No human remains.

     Team 2:
       1. Central post hole (same as Team 1).
       2. Circular arrangement of 10 small pits (same as Team 1, but their diagram shows only 8 because two are in the overlapping set and they get the same for those, but the other two pits are not shown in Team 1's diagram? Actually, let's have the diagrams partially overlapping: Team 1's diagram shows the entire circle but only 8 pits are labeled with artifacts, and Team 2's diagram shows 10 pits but two are in a different pattern? Instead, we can have both teams have the same central circle but with different peripheral features. Let me adjust.

     Revised: 
     Both teams have:
       - Central post hole (with charring).
       - 8 pits in a circle (each with pottery shards and some with burned animal bones).

     Team 1 additionally gets:
       - A stone pendant (near the post hole).
       - A flat stone slab (near one pit, with no wear patterns).
       - Absence: No metal.

     Team 2 additionally gets:
       - A small clay figurine (broken, found in one pit).
       - A set of 5 carved bone tokens (in one pit).
       - Absence: No human remains.

     Then, the overlapping artifacts are the central post hole and the 8 pits with pottery shards and animal bones (so both teams have these). The unique artifacts are the stone pendant and slab for Team 1, and the figurine and tokens for Team 2. The negative spaces are different: Team 1 has no metal, Team 2 has no human remains.

     The ground truth is that the site is for ancestor worship: the pottery was broken ritually (hence the shards), the animal bones are from offerings, the pendant is a symbol of the priesthood, the figurine represents an ancestor, and the tokens are for counting offerings. The absence of metal is because the ritual forbade metal (it was a sacred site), and the absence of human remains is because it was not a burial site.

     Each team might reconstruct:
     - Team 1 (with pendant and slab, and absence of metal): They might see a ritual site with a priest (who wore the pendant) and the slab as an altar. The absence of metal might lead them to think it was a pre-metal society or that metal was prohibited. They might reconstruct a shamanistic society without a formal institution.
     - Team 2 (with figurine and tokens): They might see a ritual involving counting (tokens) and a deity (figurine). The absence of human remains might lead them to think it was a temple, not a tomb. They might reconstruct a temple institution with priests and offerings.

     The key is that both are defensible and incompatible: one might have a hierarchical priesthood, the other a more egalitarian shamanistic group.

     However, we must design the evidence so that both can support the ground truth. But note: the ground truth has a hereditary priesthood. So Team 1 might miss the tokens and figurine and not see the institutional hierarchy? How do we ensure incompatibility? Let's adjust the unique artifacts to push interpretations:

     Team 1's pendant might be interpreted as a personal amulet (suggesting individual religious practitioners) while Team 2's tokens might suggest accounting (and thus a more bureaucratic institution). The ground truth is a hereditary priesthood, so both interpretations are possible but the Team 1 interpretation might lean towards a less institutionalized structure.

     Alternatively, let the ground truth be such that both interpretations are possible but not the whole story. The simulation is about underdetermination: the evidence doesn't uniquely determine the ground truth.

     We'll accept that both teams might reconstruct something that is part of the truth but also go beyond.

     This is the underdetermination at work.

     So, the ground truth is as above.

     Now, the roles per team (7 roles for 7 people) must be assigned. We can have:
     - Pattern Analyst: Looks at the spatial arrangement and artifact distributions.
     - Ethnographic-Analogy Skeptic: Challenges analogies (must be used when an analogy is played).
     - Institutional-Reconstruction Advocate: Pushes for a clear institutional structure.
     - Negative-Space Interpreter: Focuses on the meaning of the absences.
     - Belief System Constructor: Builds the belief narrative.
     - Chronology/Taphonomy Assessor: In the simulation, this role is limited because we don't have stratigraphy. They can note that the site appears to be a single event or multiple events? But we don't have data. They might question preservation? But the negative space cards say "no metal" and they know metal preserves well, so if they expect metal, its absence is meaningful. Similarly, bone is present so the absence of human remains is not due to taphonomy (so the negative space card for Team 2 can say: "No human remains, despite excellent bone preservation in the site").
     - Devil's Advocate: Challenges the team's own reconstruction.

     This should work.

     Let's write the exact negative space cards:
     Team 1 Negative Space Card: "No metal objects of any kind were found in the entire site. Note: contemporary sites in the region (within 50km) have yielded copper artifacts in domestic contexts, and the soil conditions are favorable for metal preservation."
     Team 2 Negative Space Card: "No human remains were found in the ritual pits or elsewhere at the site. Note: animal bones were well preserved, and the site is in an area with known contemporary burial mounds."

     This makes the absences carry weight.

     Now, the analogical-reasoning license: Each team has 3 cards. When they want to use an analogy, they play one and must state: "We use the analogy to [culture] because [reason]." The skeptic can then challenge: "But here is a disanalogy: [disanalogy]." The team must respond.

