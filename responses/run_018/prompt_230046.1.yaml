prompt: |-
  I've noticed something that keeps bugging me and I wonder if it has a name, and more importantly whether I'm drawing a distinction that actually holds up.

  On the one hand: there's some anomaly people have known about for ages. A new theory comes along, developed for completely seperate reasons, and it turns out to predict the anomaly just from its other assumptions. Everyone treats that old anomaly as a big point in the theory's favor. The example I keep thinking of is Mercury's orbit being a little off and then relativity coming along and supposedly predicting the offness, but I've seen the same shape in ordinary situations too.

  On the other hand: someone has a pile of facts already in front of them, and they build an explanation specifically so that it fits those facts. Everyone says that's cheap, like a story told after the game, and that the explanation "explaining" the facts shouldn't count for much because it was reverse-engineered.

  Here's what I can't get straight. In both cases the facts were known before the explanation showed up. So if the facts were already in hand, how can they boost a new theory at all? And if they can boost it in the first case, what principled difference makes the second case cheap? I can feel that the second case is different, but when I try to state the difference it slips away.

  Does the general puzzle—old, already-known facts appearing to support a new theory—have a name? And does the distinction between the two cases have a name? I'm not just after labels; I want to understand exactly where the line is, and whether it's as sharp as people act like it is.
reasoning: |-
  Okay, the user is grappling with a philosophical puzzle in scientific reasoning. They're noticing a tension: why do pre-existing facts sometimes lend credibility to new theories (like Mercury's orbit validating relativity) but other times seem like cheap "curve-fitting"? Their core confusion is about how known data can support a theory at all, and what distinguishes legitimate prediction from post-hoc rationalization.

  Hmm, this is actually a deep question about the epistemology of science. The user seems philosophically inclined - they're not just asking for definitions but want to understand the underlying principles. Their frustration about the distinction "slipping away" suggests they've already done some thinking but hit a conceptual wall. 

  First, let's unpack their examples. The Mercury/relativity case works because Einstein wasn't trying to solve that problem - his theory emerged from fundamental principles about space-time. Whereas in the second case, the theory is constructed solely to fit existing data. The key difference is independent genesis versus targeted construction.

  But wait - the user's right that both scenarios involve known facts. So why the different epistemic weight? Ah, it's about risk: relativity could've been falsified by Mercury's orbit if it didn't fit, whereas the reverse-engineered theory faces no such risk. The former is a bold test (even if unintentional), the latter is immunized against failure. 

  The user might be missing that scientific theories aren't judged on single data points but on their entire evidential relationship. Relativity's victory wasn't just Mercury - it also made novel predictions like light bending, which were later confirmed. That's the real clincher. Meanwhile reverse-engineered theories often fail when new data arrives.

  I should mention that this distinction isn't always sharp. Some theories start as explanations of known phenomena but then successfully predict new ones (like Mendeleev's periodic table). The boundary between "discovery" and "post-doc rationalization" can be fuzzy in practice. 

  The philosophical terms here are "novel prediction" vs. "accommodation", with the former carrying more weight. But the user seems to want more than labels - they want to grasp why the scientific community treats these differently. The answer lies in how science accumulates reliable knowledge: by testing against unknown futures rather than just organizing past observations.
answer: |-
  Your distinction is both real and philosophically significant—it's one of the cornerstones of scientific epistemology. Here's a breakdown of the concepts, the difference between your two cases, and why the distinction matters:

  ---

  ### **1. The Core Concepts & Names**
  - **The General Puzzle**: Known as the **Problem of Old Evidence** (particularly in Bayesian confirmation theory).  
    *Why it's puzzling*: If evidence E was already known before theory T was proposed, how can E confirm T? Intuitively, confirmation seems tied to *new* predictions. Philosophers like Clark Glymour and Colin Howson have debated this extensively.
    
  - **The Distinction You're Observing**:
    - **Case 1 (Mercury/Relativity)**: This is **prediction of known anomalies**. The theory *independently entails* pre-existing data without being designed to fit it.  
    - **Case 2 (Reverse-engineering)**: This is **accommodation** (or *post hoc explanation*). The theory is explicitly constructed to fit existing data.  
    - **Key Difference**: The *direction of inference* and *theoretical independence*.

  ---

  ### **2. Why the First Case is Strong (Prediction of Anomalies)**
  - **Independence from the Data**:  
    Einstein didn’t develop general relativity to fix Mercury's orbit. The math naturally produced Mercury’s perihelion precession as a consequence of spacetime curvature. The anomaly was a *byproduct* of deeper principles.  
    → *This shows the theory "locks onto" reality without being nudged*.
    
  - **Explanatory Unity**:  
    Relativity didn’t just "fix" Mercury—it revolutionized gravity, light, time, and space *as a cohesive whole*. The anomaly’s resolution was a *side effect* of a broader framework.  

  - **Risk of Failure**:  
    Had relativity *not* predicted Mercury’s orbit, it would have been a major strike against it. The theory *risked falsification* by pre-existing data it didn’t "cheat" to fit.  

  ---

  ### **3. Why the Second Case is Weak (Accommodation)**
  - **Targeted Construction**:  
    If you start with a set of facts and build a theory *only* to match them (e.g., "Planet Nibiru causes all orbital anomalies"), the theory is *ad hoc*—it lacks independent grounding.  
    → *It can explain anything because it was designed for that purpose*.  
    
  - **No Risk, No Reward**:  
    An accommodation faces no test—it’s immunized against failure because it was reverse-engineered. It doesn’t predict *new* phenomena; it retrofits old ones.  
    → *As Karl Popper argued, good science sticks its neck out; bad science ducks*.  

  - **Overfitting Danger**:  
    Like a complex polynomial curve-fitting noisy data, an accommodating theory often "overfits." It explains past data perfectly but fails with new evidence (e.g., epicycles in Ptolemaic astronomy).  

  ---

  ### **4. The Line Isn't Always Sharp (But It Matters)**
  - **Gray Areas**:  
    - Some theories *start* as accommodations but later make novel predictions (e.g., Darwin’s natural selection accommodated existing fossils but predicted transitional forms).  
    - Data can be "known but ignored" (e.g., if Mercury’s anomaly was considered unimportant pre-relativity, its resolution feels more like a prediction).  
  - **Why Scientists Care**:  
    The distinction isn’t pedantry—it’s about **testability** and **explanatory power**. A theory that predicts both old *and new* phenomena (like relativity predicting gravitational lensing) reveals deep truths. One built solely to fit existing data is a just-so story.  

  ---

  ### **5. Practical Takeaways**
  - **A Litmus Test for Good Explanations**:  
    Ask: *"Would this theory still make sense if we deleted the 'anomaly' from history?"*  
    - Relativity: Yes (it’s about spacetime curvature).  
    - Reverse-engineered theory: No (the anomaly *is* its reason to exist).  
  - **Predictive Power Trumps**:  
    As physicist John Wheeler quipped,  
    > *"No theory is respectable until it predicts something that wasn’t put into it."*  

  ---

  **In short**: Your intuition is correct—the difference lies in **theoretical independence** and **explanatory ambition**. The first case succeeds because the theory *organically* explains old anomalies while aiming at deeper truths; the second fails because it’s a tautological patch. The line is real, even if blurred at times, and it’s why science values predictions over post-dictions.
