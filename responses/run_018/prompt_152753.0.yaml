answer: |-
  (Setting down water glass, making eye contact across the room)

  Good morning. Let’s talk about why getting it right isn’t enough. Not for us. Not in education.

  Most of us here have been that teacher, or that administrator, who *knew* something was wrong. A policy. An approach. An evaluation. You felt it in your gut. And maybe, sometimes, you were even *right*. But… what happened when you had to explain *why*? When someone asked, "Based on what?" or "Walk me through that"? If the answer was just "I know it," or "It feels off," or worse, you couldn’t articulate it at all… we know how that ends. Sometimes, it ends badly. Trust me, I have the recent, unpleasant T-shirt. I was right. But I couldn’t *show* it. I couldn’t *earn* it. And that distinction? That’s the heart of why we’re here.

  True belief is a lucky guess. It’s stumbling onto the right street in the dark. Knowledge? Knowledge is having the map, the compass, *and* understanding the terrain. It’s knowing *how* you got there, why *this* street, and crucially, how to guide others, even when the fog rolls in.

  For our philosopher colleagues: Think less "justified true belief" and more *credit*. True belief might get you the right answer – hitting the target in the dark. Knowledge is hitting the target *because* of your skill, your understanding, your reliable connection to the truth. It’s an *achievement* you own. The educator with true belief stumbles onto a good lesson; the educator with knowledge *crafts* it, *adapts* it, and *explains* why it works. The administrator with true belief avoids a crisis by accident; the administrator with knowledge *foresees* it and *builds* structures to prevent it. True belief is fragile, vanishing when challenged. Knowledge is resilient; it can be examined, tested, and defended.

  For our administrators and practitioners: This isn’t abstract. It’s the difference between:

  1.  **Hiring:** Hiring a teacher because their resume looks good (a hopeful belief they'll be effective) vs. hiring them because you've seen them *demonstrate* how they diagnose student misconceptions, adapt their approach, and articulate *why* their methods work (knowledge in action).
  2.  **Policy:** Implementing a new program because it's trendy or another district did it (belief it might work) vs. implementing it because your team has examined *how* it addresses *your specific* students' needs, understands the underlying pedagogy, and can predict potential pitfalls (knowledge guiding action).
  3.  **Evaluation:** Rating a teacher "effective" because their test scores are okay this year (belief in success) vs. recognizing effectiveness because you see the *deliberate, traceable practices* they use to build understanding, support diverse learners, and reflect on their impact – practices they can *name* and *justify* (knowledge as demonstrable skill).
  4.  **Calling Out Problems:** Saying "This policy is harmful!" (True belief, easily dismissed) vs. saying "This policy is harmful *because* it creates inequity at point X, misunderstands research Y, and will lead to consequence Z – here’s the data, here’s the logic." (Knowledge that demands engagement).

  True belief in education is like building on sand. It might hold for a moment, but it won’t withstand pressure, it won’t guide you reliably tomorrow, and you can’t show anyone else how to build there. Knowledge is the foundation. It’s how we earn the right to be heard. It’s how we build systems that last. It’s how we turn that gut feeling into something that can’t be ignored – something that truly serves our students.

  That shift – from just *being* right, to *earning* it, *demonstrating* it, and *building* with it – that’s the hard, essential work of ethical education practice. That's what this workshop is about. Let's get started. (Nods, steps back)
