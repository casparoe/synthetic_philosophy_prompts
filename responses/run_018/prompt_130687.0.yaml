answer: |-
  Here is the restatement of the etiological vs. causal-role debate using your vocabulary of provenance-tracking and load-bearing status, followed by the residue report analyzing translation fidelity and gaps.

  ### Restatement of the Debate in Your Terms

  1.  **The Provenance-Tracking Argument (Etiological Function):**
      *   A module's true function in an engineered pathway is determined by its **provenance-tracking**: what it was selected *for* in its evolutionary or donor context. Its current activity is only its function if that activity aligns with the selective pressures that historically maintained it.
      *   **Example (Horizontally Transferred Module):** Consider a toxin-antitoxin module transferred into your pathway for plasmid maintenance. Its provenance-tracking reveals it was selected for post-segregational killing in its donor bacterium. Even if it now accidentally stabilizes an enzyme complex in *your* pathway (its load-bearing status), its *true function* remains plasmid maintenance – that's why it exists in its current form. Its current stabilizing effect is just a side-effect (a "causal role").
      *   **Example (Orphan Gene):** An orphan gene poses a challenge. Without provenance-tracking (no discernible ancestral history or selective pressure), it fundamentally *lacks a function* in the strictest sense. Its load-bearing status (e.g., catalyzing a key reaction) describes what it *does*, but not what it is *for*. Assigning it a "function" based solely on current contribution is an error; its causal role doesn't confer functional status without an evolutionary history of selection. Its role is merely an effect, potentially exploitable but not a function.
      *   **Core Assertion:** Load-bearing status describes *current causal contribution*, but provenance-tracking defines *functional identity*. Function is inherently historical and teleological (goal-oriented based on past selection).

  2.  **The Load-Bearing Status Argument (Causal-Role Function):**
      *   A module's function in an engineered pathway is determined solely by its **load-bearing status**: its current causal contribution to the pathway's stability, flux, and output. Provenance-tracking is irrelevant to its present function. What matters is what the module *does now* within the specific system context.
      *   **Example (Horizontally Transferred Module):** The toxin-antitoxin module was transferred. Its provenance-tracking (plasmid maintenance) is merely historical context. In *this* engineered pathway, if its primary load-bearing status is stabilizing an enzyme complex crucial for product yield, *that stabilization is its function*. Its historical role is an interesting fact but doesn't define its current functional role in this novel system. Defining function based on provenance would misrepresent its actual operational importance here.
      *   **Example (Orphan Gene):** An orphan gene's lack of provenance-tracking is irrelevant. Its function is defined entirely by its load-bearing status within the pathway. If it catalyzes an essential step (high load-bearing status for flux), then catalysis *is* its function. Its novelty doesn't preclude it from having a function; its function is simply defined by what it causally contributes now. The function emerges from its current role in the system.
      *   **Core Assertion:** Provenance-tracking provides interesting backstory or design inspiration, but load-bearing status defines *current functional role*. Function is a present system-dependent property, not a historical relic.

  ### Residue Report: Mapping the Philosophical Distinctions

  **I. Clean Mappings (Direct Translation):**

  1.  **Core Distinction (Historical Selection vs. Current Contribution):** This maps perfectly. The debate over whether function is fixed by evolutionary history (provenance-tracking) or current causal role (load-bearing status) is the heart of both the philosophical debate and your concepts. No distortion occurs here.
  2.  **The "Why" vs. "How":** The etiological focus on *why* the trait exists (provenance-tracking explaining selective origins) versus the causal-role focus on *how* the trait currently operates within the system (load-bearing status explaining mechanistic contribution) translates cleanly.
  3.  **Handling Novelty/Transfer:** The disagreement over horizontally transferred modules and orphan genes maps directly. The etiological/provenance view struggles to assign "true function" without history, seeing only effects. The causal-role/load-bearing view readily assigns function based on current integration and contribution.

  **II. Distortions Required (Concepts Stretched or Misaligned):**

  1.  **"Selection History" vs. "Provenance":** The etiological view *requires* that the trait was *selected for* the effect defining its function. Provenance-tracking, as you define it ("evolutionary origin and selective history"), *implies* this but could encompass a broader history (e.g., neutral origins, exaptation precursors). Purely forcing the etiological view onto provenance *might* subtly require assuming provenance always implies a specific selection event *for the relevant effect*, which your term allows but doesn't strictly demand. This risks smuggling in the "selected-for" criterion inherent to the philosophical view.
  2.  **"Systemic Context" vs. "Load-Bearing Status":** The causal-role view defines function relative to a *containing system* and its goals (e.g., organism survival, pathway output). Load-bearing status ("contribution to stability, flux, and output") perfectly captures the causal contribution *aspect* but implicitly assumes the system's goals (e.g., high flux, stability) are defined and agreed upon. The philosophical view explicitly makes function context-dependent on the system's capacities. While your term works seamlessly in an engineering context where goals are explicit (output!), mapping it *back* to biology might slightly obscure the need to define the relevant system and its goals (e.g., is the function relative to the cell, the pathway, or the engineered product?).

  **III. Untranslatable Residues (Gaps in Your Framework):**

  1.  **Normativity/Malfunction (Etiological):** The core etiological argument includes a strong normative element: a trait's function is what it *is supposed to do* (based on selection history), allowing us to say it can *malfunction* if it fails to do that, even if it does something else useful. Provenance-tracking provides the history but lacks this inherent "should." In your framework, an enzyme transferred from a donor where it was selected for Reaction A, now doing Reaction B in your pathway with high load-bearing status, is simply *doing something different now*. The etiological view insists Reaction A is its "true function," and doing Reaction B means it's malfunctioning *as that type of part*, even if beneficial. Your vocabulary lacks the normative "should" implied by selection history. **Assessment:** This normativity *is* missing from your framework, but its importance is debatable. In synthetic biology (your context), "malfunction" is usually defined relative to *design intent* or *desired output*, not evolutionary history. The philosophical distinction highlights a genuine conceptual difference, but its practical relevance to engineering may be low, making its absence understandable and potentially even beneficial for your focus.
  2.  **Context Sensitivity vs. Fixed Contribution (Causal-Role):** The causal-role view emphasizes that a trait can have multiple functions simultaneously in different contexts or at different levels (e.g., a protein might function in metabolism for the cell and in signaling for the organism). Load-bearing status ("contribution to...output") is inherently tied to the specific pathway context you define. While it *can* be applied at different levels, the term itself doesn't inherently highlight this potential multiplicity and context-dependence as sharply as the philosophical debate does. The philosophical view makes this relativity explicit. **Assessment:** Your concept *can* capture this (by defining the system context), but the term itself doesn't *emphasize* it as a core feature like the causal-role view does. The philosophical distinction highlights a valid point about relativity, but your framework isn't fundamentally incapable of handling it – it just requires explicit context definition when using "load-bearing status."
  3.  **The "Teleology" of Selection (Etiological):** The etiological view embeds a form of naturalized teleology: the trait exists *because* it performed F (its function), making F the reason for its presence. Provenance-tracking identifies the history, but doesn't inherently carry the strong backward-looking "reason-for-existence" teleological force that "selected-for" does in philosophy. The philosophical view sees the function F as the *cause* of the trait's existence/persistence. Provenance-tracking provides the historical data point, but the strong causal implication ("it exists *because of* F") is an interpretation layered on top. **Assessment:** This subtle teleological element is partially missing from your term. While the philosophical distinction attempts a rigorous naturalization of purpose, it remains a contested interpretation *of* selection history. Your framework's focus on describing the history (provenance) and current effect (load-bearing) without necessarily invoking this causal teleology might reflect a healthy pragmatism, avoiding a philosophically contentious claim.

  **Conclusion on Residues:** The core conflict translates cleanly. The main *substantive* element missing is the etiological normativity ("should"/malfunction), which is arguably less critical in an engineering context focused on current performance and design. The other gaps involve emphasis (context relativity) or contested philosophical interpretations (teleology of selection). Your framework successfully captures the operational heart of the debate – the tension between historical origin and current causal contribution – without getting entangled in philosophical nuances that may be less relevant to the practical assessment of engineered biological systems. The failures of translation primarily involve philosophical baggage (normativity, specific teleology) that your more pragmatic, descriptive concepts deliberately avoid, suggesting these distinctions, while intellectually interesting, might be less substantive *for your specific domain* than the initial philosophical framing implies. The most significant residue is the lack of normativity, which you seem to have intentionally sidestepped in favor of descriptive assessments.
