prompt: |-
  i'm putting together a syllabus on climate ethics but i'm tired of the same old carbon-tax-vs-cap-and-trade framing. i want you to write the desiderata for a theory of climate obligation that takes carbon pricing, direct regulation, and degrowth seriously not as interchangeable policy levers but as competing moral ontologies: one treats harm as fungible and compensable, one treats it as a hard boundary that can't be priced, and one treats growth itself as the underlying harm.

  give me the full spec. what cases must it get right -- e.g., a factory that can pay it's way out versus one that has to be shut, a community that needs to contract consumption versus one that needs to build green infrastructure, and a rich country that owes precise compensation versus one that owes a structural transformation? for each, say why it's a test case and not just an example. then list the distinctions it can't collapse: efficiency vs justice, aggregate reduction vs distributive burden, intergenerational vs intragenerational equity, and whatever else belongs there -- with the consideration behind each.

  also flag which results it can't contradict. i'm thinking of things like the empirical point that pricing alone misses non-market externalities, or that degrowth without redistribution tends to reproduce colonial patterns of extraction. but you should include whatever genuinely constrains the theory.

  crucially, tell me which desiderata are genuinely non-negotiable and which are just liberal economics in disguise. and is there a joint unsatisfiability problem hiding in the list? specifically, can you really hold that carbon harm is incommensurable with money AND that rich countries owe precise, quantifiable compensation for past emissions? if some subset of the requirements can't all be satisfied together, say so -- thats the part i care about most.

  briefly score the three main approaches -- market pricing, green-new-deal-style regulation, and post-growth / degrowth -- against the list, but keep it short. the criteria are the point, not the scorecard.

  oh, and don't ask me for a bibliography. i don't have one and a model without web access shouldn't need to fake citations.
reasoning: |-
  Okay, the user wants a comprehensive set of desiderata for a climate ethics theory that takes carbon pricing, direct regulation, and degrowth as competing moral ontologies. They're clearly frustrated with oversimplified policy debates and want a framework that exposes underlying ethical tensions. 

  First, I need to unpack their core request: They're rejecting policy-equivalence and demanding moral-philosophical rigor. The three approaches represent fundamentally different value systems: 
  - Pricing treats harm as fungible (neoclassical economics) 
  - Regulation treats harm as non-negotiable boundary (deontology/rights-based) 
  - Degrowth treats growth as pathological (critical theory/ecological ethics)

  The user's test cases are brilliantly chosen to stress-test these ontologies:
  - The factory case tests compensability of harm
  - The community case reveals assumptions about consumption vs production
  - The rich country case forces confrontation between reparations and transformation

  Hmm... the real challenge is their paradox question: Can you simultaneously claim carbon harm is incommensurable AND demand quantifiable compensation? That's the philosophical grenade they're throwing. I'll need to map this to the literature on incommensurability (Raz) vs. compensatory justice without collapsing into utilitarianism.

  Key constraints they mention are crucial - especially the empirical landmines:
  - Pricing fails on non-market externalities (e.g., indigenous knowledge loss)
  - Degrowth without redistribution replicates colonialism (Mies/Bennholdt-Thomsen)
  These aren't just footnotes; they're theory-killers if ignored.

  For the desiderata list, I'll structure it as:
  1. Foundational requirements (non-negotiables)
  2. Test cases with why they're acid tests
  3. Critical distinctions that must survive
  4. Non-contradiction constraints
  5. The paradox analysis

  The scoring of approaches will be ruthless but brief - e.g., pricing fails hard on incommensurability but aces efficiency; degrowth nails the growth critique but stumbles on compensation precision.

  Biggest insight: The compensation-incommensurability tension isn't resolvable at theoretical level - it requires a hybrid approach where quantifiable payments serve symbolic/institutional purposes without pretending to "settle" ecological debt. That's the syllabus gold right there.
answer: |-
  Here’s a rigorous set of desiderata for a climate ethics theory that treats carbon pricing, regulation, and degrowth as distinct moral ontologies, designed to expose tensions and test coherence. The focus is on philosophical robustness, not policy compatibility.

  ---

  ### **Core Desiderata for a Climate Obligation Theory**  
  *(Non-negotiable foundations)*  
  1. **Acknowledge Ontological Incompatibility**: Must not reduce the three approaches to "tools"; they embody irreconcilable premises about:  
     - *Harm* (fungible vs. sacred vs. systemic)  
     - *Value* (monetizable vs. categorical vs. anti-extractivist)  
     - *Agency* (individual rationality vs. collective authority vs. civilizational reorientation).  

  2. **Center Non-Compensability of Existential Harm**: Any theory must recognize that some climate impacts (e.g., species extinction, displacement of island nations) cannot be "priced" without moral bankruptcy.  

  3. **Reject False Equivalence Between Burdens**: Must not treat "sacrifice" symmetrically across actors (e.g., a rich household reducing luxuries ≠ a poor household losing heat).  

  ---

  ### **Crucial Test Cases & Why They’re Decisive**  
  *(Not illustrations, but theory-breakers)*  
  1. **The Factory Test**  
     - *Case*: Factory A can afford carbon fees; Factory B must be shut down to meet local health thresholds.  
     - *Why it tests ontology*: Pricing sees A and B as morally equivalent if fees paid; Regulation sees B’s operation as inherently violative; Degrowth asks why either should exist if not serving necessity.  
     - *Failure mode*: Treating shutdown as a "higher fee."  

  2. **The Community Test**  
     - *Case*: Community X (high-consuming) must contract materially; Community Y (energy-poor) must build solar infrastructure.  
     - *Why it tests ontology*: Pricing imposes uniform incentives; Regulation commands different actions; Degrowth demands X’s contraction *to enable* Y’s development within planetary boundaries.  
     - *Failure mode*: Prescribing "green growth" to both, ignoring historical responsibility.  

  3. **The Reparations Test**  
     - *Case*: Rich Country O owes compensation to Vulnerable Country P.  
     - *Why it tests ontology*: Pricing seeks precise monetary debt; Regulation demands O dismantle fossil infrastructure; Degrowth argues O’s economy must structurally downsize to "make space" for P.  
     - *Failure mode*: Reducing reparations to aid or carbon offsets.  

  ---

  ### **Distinctions the Theory Must Sustain**  
  *(Collapsing these invalidates the ontology)*  
  1. **Efficiency vs. Justice**  
     - *Consideration*: Cost-effectiveness ≠ fairness. Pricing optimizes efficiency; justice may require "inefficient" actions (e.g., preserving low-carbon indigenous lands).  

  2. **Aggregate Reduction vs. Distributive Burden**  
     - *Consideration*: Cutting 1GT of emissions via luxury taxes vs. fuel subsidies for the poor have identical aggregate outcomes but opposing moral implications.  

  3. **Intergenerational vs. Intragenerational Equity**  
     - *Consideration*: Sacrificing the poor today for future stability (e.g., austerity) vs. privileging present poor over future rich.  

  4. **Harm Prevention vs. Harm Compensation**  
     - *Consideration*: Stopping emissions ≠ repairing loss (e.g., sunken islands). Degrowth/regulation prioritize prevention; pricing emphasizes compensation.  

  5. **Growth as Means vs. Growth as Harm**  
     - *Consideration*: Is growth a neutral tool (redirectable to green ends) or inherently ecologically violent?  

  ---

  ### **Non-Contradiction Constraints**  
  *(Empirical & logical guardrails)*  
  - **Pricing’s Limits**: Cannot assume all externalities are monetizable (e.g., cultural loss from land destruction).  
  - **Regulation’s Blind Spot**: Must address who sets boundaries and how (e.g., technocratic imposition vs. democratic deliberation).  
  - **Degrowth’s Peril**: Cannot ignore that without radical redistribution, contraction replicates colonial hierarchies (e.g., "austerity for the South, simplicity for the North").  
  - **Historical Obligation Constraint**: Rich nations’ debt cannot be discharged by future-oriented policies alone.  

  ---

  ### **The Central Paradox: Incommensurability vs. Compensation**  
  - **The Conflict**: If climate harm is *incommensurable* with money (per regulation/degrowth), demanding *precise monetary compensation* (per pricing) is incoherent.  
  - **Resolution Strategies** (Partial):  
    - Treat compensation as *symbolic acknowledgment* (not equivalence).  
    - Separate *reparations* (for past commensurable damages) from *prevention* (governed by incommensurability).  
    - **Unsatisfiability**: A theory *cannot* simultaneously hold that (a) all ecological harm is strictly priceless and (b) exact monetary debts exist for historical emissions. *One must yield*.  

  ---

  ### **Brief Approach Scoring**  
  *(Against key criteria: ✪ = strong, ✓ = mixed, ✗ = weak)*  

  | Criterion                          | Pricing | Regulation | Degrowth |  
  |------------------------------------|---------|------------|----------|  
  | **Harm Fungibility**               | ✪       | ✗          | ✗        |  
  | **Non-Compensable Harms**          | ✗       | ✪          | ✪        |  
  | **Addresses Growth as Harm**       | ✗       | ✓          | ✪        |  
  | **Intragenerational Justice**      | ✗       | ✓          | ✪*       |  
  | **Historical Reparations Precision**| ✪       | ✓          | ✗        |  
  | **Avoids Technocratic Imposition** | ✓       | ✗          | ✪        |  

  _\* Degrowth scores high *if* paired with redistribution; otherwise ✗._  

  ---

  ### **Key Tensions & Non-Negotiables**  
  - **Non-Negotiables**:  
    - Rejecting harm commodification where it erases dignity/rights.  
    - Accounting for historical responsibility.  
    - Prioritizing vulnerable populations’ agency.  
  - **Liberal Economics in Disguise**:  
    - Assuming all values are transitive/tradable.  
    - Treating "efficiency" as a neutral benchmark.  
    - Ignoring lock-in effects of infrastructure.  
  - **Joint Unsatisfiability**: The triad of (1) incommensurability, (2) precise compensation, and (3) ontological purity *cannot* fully cohere. A viable theory must either:  
    - **Hybridize**: Adopt different ontologies for different harms (e.g., pricing for trivial emissions, regulation for health thresholds, degrowth for resource frontiers).  
    - **Prioritize**: Elevate one ontology as primary (e.g., degrowth’s anti-extractivism) and subordinate others.  
    - **Reframe Compensation**: Replace monetary payments with decolonization/ecological restoration.  

  **The syllabus hook**: This framework forces students to confront that climate policy debates are not about "what works" but *what world we are building* — and that moral clarity requires choosing which contradictions to live with.
