answer: |-
  ## Teleosemantics Specification: Core Desiderata & Test Cases

  This specification defines requirements for a viable teleosemantic theory of mental representation, grounded in biological function. It is organized around paradigmatic problems, stating desiderata with motivations, test cases, and their status.

  **Core Desiderata:**

  1.  **Content Determinacy & Distal Priority**
      *   **Motivation:** Teleosemantics must avoid the "disjunction problem" (e.g., fly *or* small-dark-moving-thing). It should explain why content is typically *distal* (fly, food) rather than *proximal* (retinal pattern) or *disjunctive* (fly-or-BB-pellet), linking function to what was *actually* fitness-relevant in evolutionary history.
      *   **Test Case (Frog Snapping):** The mechanism's function is snapping *at flies* (distal object), not snapping *at small-dark-moving-things* (proximal stimulus) or *at flies-or-seeds* (disjunction). Snapping at seeds/shadows is a *mistake*, not a correct representation of a disjunctive content.
      *   **Status:** **Non-negotiable requirement.** Indeterminate or purely proximal content fails to capture the explanatory link between representation and adaptive success.

  2.  **Robust Misrepresentation**
      *   **Motivation:** Representation requires the *possibility* of error. The theory must distinguish *accurate* representation from *inaccurate* representation, even when the inaccuracy is adaptive (e.g., cheap false alarms). Error is not equivalent to malfunction.
      *   **Test Case (Danger Detector):** When the detector fires due to wind rustling leaves (no predator), it *misrepresents* danger. This is an error *despite* the mechanism functioning *correctly* (as designed by selection) and the false alarm being adaptive (cheap). The content remains "predator present," not "predator-or-wind."
      *   **Status:** **Non-negotiable requirement.** Without robust misrepresentation, the theory collapses into a form of indicator semantics or fails to capture intentionality.

  3.  **Historical Individuation of Content**
      *   **Motivation:** Content must supervene on natural properties. Selection history is the key teleosemantic resource for *individuating* representational types beyond current causal dispositions, explaining why physically identical states can have different contents based on why they were selected.
      *   **Test Case (Heat Sensors):** Sensor A (lineage selected for finding shelter) represents "warm rock (shelter indicator)." Sensor B (lineage selected for finding prey) represents "warm body (prey indicator)." They have different contents *despite* identical present-day operations and overlapping triggers, due to distinct selection histories.
      *   **Status:** **Distinctive commitment of core teleosemantics.** While essential for naturalizing content via history, it raises challenges for derived content (see D4).

  4.  **Scope: Derived Content (Learned/Developmental)**
      *   **Motivation:** Representation is not limited to innate, evolutionarily-selected states. The theory should account for contents acquired within an organism's lifetime through learning or development, explaining how they derive from or are grounded in evolutionarily provided functions without being directly selected *themselves*.
      *   **Test Case (Learned Star Navigation):** The animal learns to use Star X for navigation. Neither the animal nor its specific neural state has an evolutionary history tracking Star X. The theory must explain how "Star X's position" becomes a genuine representational content, likely grounded in the function of a more general navigation system.
      *   **Status:** **Non-negotiable requirement.** Failure here renders teleosemantics empirically inadequate for cognition. *How* it satisfies this is contentious.

  5.  **Naturalization Scope & the Swampman Challenge**
      *   **Motivation:** A complete naturalization should clarify the necessity of evolutionary history. The theory must take a stance on whether a molecule-for-molecule duplicate (Swampman), lacking any ancestors or selection history, can possess genuine representational states identical to its evolved counterpart, given identical functional organization and behavior.
      *   **Test Case (Swampman):** Swampfrog snaps at flies just like Frog. Does it have the representation "fly"? If yes, then selection history isn't *necessary* for content, only functional organization. If no, then content depends essentially on historical etiology.
      *   **Status:** **Distinctive commitment of core teleosemantics.** Most core teleosemanticists argue Swampman *lacks* genuine content (a discovery), grounding content in history. Others see this as a *reductio* against requiring strict selection history.

  6.  **Expressive Power: Complex Contents**
      *   **Motivation:** Representation includes relational, negative, modal, and normative contents ("same individual," "predator absent," "can jump," "enough food," "permissible action"). The theory must provide resources to construct such contents from simpler biological functions, not just simple detection.
      *   **Test Case (Complex Predicates):** Explain how a mechanism could represent "predator absent in this location" (negative), "this is the same fruit I saw yesterday" (relational/identity), or "food quantity sufficient" (normative/comparative), based on the biological functions of the states involved and their downstream consumers.
      *   **Status:** **Non-negotiable requirement.** Limiting scope to simple detection fails to address the richness of cognition.

  7.  **Error vs. Malfunction Distinction**
      *   **Motivation:** The theory must sharply distinguish:
          *   *Misrepresentation*: Correctly functioning mechanism tokening a false content (e.g., frog snapping at BB pellet).
          *   *Malfunction*: Mechanism failing to operate as selected (e.g., neural misfire causing snapping at nothing).
          *   *Absence of Function/Change of Function*: A state lacking a representational function or having its function altered.
          *   *Non-representational Success*: Adaptive behavior driven by non-representational mechanisms (e.g., simple reflex).
      *   **Test Case:** Frog snaps at a BB pellet. If the visual system is working as selected, this is *misrepresentation* of a fly. If the snapping motor neuron fires randomly due to damage, that's *malfunction*. If a new mutation causes snapping at loud noises, that state may lack a *stable representational function*. If a primitive organism recoils from acid via direct chemotaxis, that's *non-representational success*.
      *   **Status:** **Non-negotiable requirement.** This distinction is fundamental to the concept of representation itself.

  **Tensions & Potential Inconsistencies:**

  *   **D1 (Determinacy) + D3 (Historical Individuation) + D4 (Derived Content) + D6 (Complex Contents):** Achieving fully determinate distal content via specific selection history (D1, D3) is difficult to reconcile with explaining rich, learned contents (D4, D6) that weren't directly selected for. How can the content of a newly learned star representation be both fully determinate *and* grounded solely in historical functions that weren't *about* that star? *This is a substantive challenge, not resolvable by stipulation.*
  *   **D3 (Historical Individuation) + D5 (Swampman):** Insisting on historical individuation (D3) forces the conclusion that Swampman lacks content (D5). This is seen by some as a strength (securing naturalization in history) and by others as a fatal flaw (denying content to a functionally identical system).

  **Approach Scorecard:**

  *   **Producer-Selection:** Content is what the producing mechanism (e.g., sense organ, neural detector) was selected to correlate with or detect.
      *   **Score:** Strong on **D1** (distal via detection function), **D3** (history individuates producers). Weak on **D2** (struggles with adaptive false alarms - if producer fires, it's "correct" by its own standard), **D4** (learning new *detectors* is hard), **D6** (struggles beyond detection). Mixed on **D7** (clear producer malfunction, but misrepresentation definition weak).

  *   **Consumer/Success-Based:** Content is the condition under which the *consumer* of the representation (e.g., motor system, inference mechanism) was selected to succeed *given* that representation.
      *   **Score:** Strong on **D2** (false alarm: consumer fails if no danger, even if producer fired "correctly"), **D6** (content defined by success condition of use, enabling complex contents), **D7** (clear error vs. malfunction distinction). Weak on **D3** (history of consumer use may not individuate producer causes finely), **D4** (learning new consumer uses is complex). Mixed on **D1** (distal priority often holds via consumer success).

  *   **Informational + Function:** Representation is a state carrying correlational information (e.g., covariance) *about* some condition, where this correlation has the biological function of carrying that information.
      *   **Score:** Strong on **D1** (distal via functional information), **D4** (can incorporate learned correlations with functions). Weak on **D2** (covariance broken = error, but struggles with *systematic* adaptive false alarms - information is gone), **D3** (individuation relies on current covariance + function, history secondary), **D5** (Swampman likely has content). Mixed on **D6**, **D7**.

  *   **Learning/Use-Based:** Allows the function (and thus content) of a representational state to be determined or modified by its learning history or current use within the cognitive system, grounded in but not limited to evolutionary functions.
      *   **Score:** Strong on **D4** (learning directly generates content), **D6** (flexible for complex contents). Weak on **D1** (determinacy challenge - how to fix distal content via individual learning?), **D3** (downplays historical individuation), **D5** (Swampman easily has content), **D2** (defining normativity for individual learning is hard). Mixed on **D7**.

  This specification outlines the core challenges teleosemantics must solve to provide a viable naturalistic theory of content. The scorecard highlights trade-offs; no approach currently satisfies all desiderata perfectly, particularly the tension between historical grounding and the flexibility of derived, complex content.
