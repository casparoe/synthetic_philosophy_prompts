answer: |-
  **Exam Question**  
  Consider the classical Intermediate Value Theorem (IVT), which states that if a continuous function \( f \) on \([a,b]\) satisfies \( f(a) < 0 < f(b) \), then there exists some \( c \in (a,b) \) such that \( f(c) = 0 \). Using the Brouwer-Heyting-Kolmogorov (BHK) interpretation of logical connectives, analyse the divergences between classical and intuitionistic mathematics regarding this theorem. Your essay should:  
  1. Explain what constitutes a *constructive existence proof* under the BHK interpretation, particularly for a claim of the form \( \exists x P(x) \).  
  2. Demonstrate why the standard classical proof of IVT (using repeated bisection and the Law of Excluded Middle) fails to provide such a constructive existence proof.  
  3. Outline how the *double-negation translation* of the IVT would be formulated intuitionistically and explain how it purportedly addresses the intuitionist’s objections.  
  4. Evaluate whether this translation genuinely resolves the intuitionist’s foundational concerns about existence or merely disguises them. Support your assessment with explicit reference to the epistemic commitments of intuitionism.  

  ---

  **Model Answer (Approx. 600 words)**  

  The core divergence between classical and intuitionistic mathematics regarding existence proofs centres on the BHK interpretation. For an existential claim \( \exists x P(x) \) to be intuitionistically true, BHK requires presenting a specific witness \( c \) and a constructive demonstration that \( P(c) \) holds. Merely demonstrating that the non-existence of such an \( x \) leads to contradiction is insufficient; one must produce the object satisfying the property. This contrasts sharply with classical mathematics, where non-constructive methods like the Law of Excluded Middle (LEM) can establish existence without locating the witness.  

  The standard classical proof of the IVT exemplifies this non-constructivity. It applies a repeated bisection method to the interval \([a,b]\). At each stage, it uses LEM to declare that the function is either negative or non-negative at the midpoint of the current interval, narrowing the search to a subinterval where the sign change persists. However, this process relies on an infinite sequence of applications of LEM. While this generates a Cauchy sequence converging to a point \( c \), it does not constructively identify \( c \); it merely assumes that such a limit point exists within the real numbers (itself a classically accepted completed infinity). Crucially, the proof provides no finite procedure to compute \( c \) or even an approximation satisfying \( f(c) = 0 \) to a specified arbitrary precision within a finite number of steps. Under BHK, the disjunction (negative or non-negative) used repeatedly at each bisection step lacks constructive justification for an arbitrary continuous function over an infinite domain, as no effective procedure is given to decide which disjunct holds at every midpoint. Thus, the proof fails to supply the required witness or construction algorithm.  

  The double-negation translation attempts to reconcile classical claims within intuitionistic logic. It maps a classical statement \( S \) to its double negation \( \neg \neg S \). The intuitionistic translation of the IVT’s existence claim becomes \( \neg \neg \exists c (f(c) = 0) \). Intuitionistically, this does *not* assert the existence of a root \( c \). Instead, it states that it is absurd to assert that no root exists. One could intuitionistically prove this translated version by assuming \( \neg \exists c (f(c) = 0) \) (i.e., \( f(x) \neq 0 \) for all \( x \)) and deriving a contradiction from the continuity of \( f \) and the conditions \( f(a) < 0 < f(b) \). This derivation might resemble parts of the classical proof but avoids directly asserting the existence of \( c \) via LEM at the critical steps. Proponents argue this shows the classical IVT isn't "false" intuitionistically but requires this weaker, non-existential formulation.  

  However, this translation does not genuinely resolve the intuitionist’s core worry; it circumvents it. The essential objection concerns the *epistemic* requirement for evidence: a proof of existence must yield access to the object. The double-negation translation \( \neg \neg \exists c (f(c) = 0) \) explicitly fails to provide this evidence. It demonstrates only that denying a root leads to contradiction, which aligns with the classical use of LEM but falls short of the BHK mandate to produce a witness. Intuitionists reject LEM primarily for infinite domains not due to a semantic belief in its falsehood, but because its unrestricted use permits assertions of existence devoid of computational or epistemic content – precisely the issue with the classical IVT proof. The double-negation translation preserves the syntactic structure of classical mathematics within intuitionistic logic but sacrifices the very meaning (existence as constructibility) that motivates intuitionism. Consequently, while the translation might show a formal consistency, it hides rather than solves the problem by replacing the unacceptable classical existence claim with a weaker statement that still does not fulfil the intuitionist's demand for constructive evidence of the root. The intuitionist seeks not merely the absence of a contradiction denying the root, but a positive method to find it. The translation offers the former where the latter is desired.  

  ---

  **Marking Scheme (Continuous Prose)**  

  An A-grade answer would comprehensively address all parts of the question with precision and philosophical insight. It would correctly define a constructive existence proof under BHK by explicitly stating that proving \( \exists x P(x) \) requires providing a specific witness \( c \) and a constructive proof of \( P(c) \), contrasting this sharply with classical proofs relying on contradiction or LEM. For the classical IVT proof, it must accurately identify the key non-constructive step as the infinite sequence of applications of LEM to the disjunction concerning the sign at midpoints during bisection, explaining clearly why this fails to yield an algorithm to compute the root \( c \) to arbitrary precision under the BHK clause for disjunction, which demands a finite decision procedure for which disjunct holds. The explanation of double-negation translation would correctly formulate the IVT existence claim as \( \neg \neg \exists c (f(c) = 0) \) and articulate that it is proven by showing a contradiction follows from assuming no root exists. Crucially, the evaluation must go beyond stating that no witness is provided; it must robustly argue that the translation fundamentally fails to meet the epistemic motivation of intuitionism by explicitly distinguishing that intuitionists reject LEM in infinite domains not because it is semantically false, but because its use allows proofs of existence that lack computational evidence. An A answer would emphasise that the translation replaces the classical existence claim with a weaker statement about the absurdity of non-existence, which still does not supply the constructive evidence (the witness or approximation method) required by BHK for genuine existence, thereby merely disguising the lack of constructive content without resolving the underlying demand for verification through construction.  

  A B-grade answer would demonstrate a sound understanding of the core concepts but lack the depth or precision required for an A. It would correctly describe constructive existence under BHK as needing a witness but might be vaguer on the necessity of a constructive proof of \( P(c) \) for that witness. It would identify the classical IVT proof’s use of LEM and bisection as non-constructive but might not precisely link the failure to the infinite sequence of disjunctions or fully articulate why BHK requires a decision procedure for each disjunct. The explanation of double-negation translation would likely state it uses \( \neg \neg \) but might be less precise on the exact formulation of the IVT claim or the nature of its proof. The evaluation would recognise that the translation doesn’t provide a witness but might not delve deeply enough into the philosophical distinction. It might state that intuitionists reject LEM because it can lead to non-constructive proofs but would likely conflate or underemphasise the epistemic motivation (requiring evidence for existence) versus a purely semantic rejection, and thus fail to convincingly argue why the absence of a constructive witness in the translated statement means it doesn't solve the core problem, instead presenting a more general dissatisfaction. While accurate in broad strokes, a B answer would miss the specific nuances regarding disjunction under BHK in the IVT proof, the precise epistemic rationale for rejecting LEM, and the sharp contrast between the meaning of existence in BHK versus the meaning of double-negated existence.
