  ## The Loop (Villanelle for a Sleepless Spender)

  **I know that coffee wins against more sleep.**  
  This logic stinks, but hey, it's how I go.  
  My brain feels fried, commitments run too deep.  
  That extra hour? Promises I can't keep.  
  The bitter cup's the fuel that makes me show.  
  **I know that coffee wins against more sleep.**  

  **But sleep's worth more than saving cash I keep.**  
  (That crumpled twenty starts to softly glow).  
  My brain feels fried, commitments run too deep.  

  **So cash feels king when coffee cravings creep.**  
  Why spend *again*? My wallet starts to know...  
  *I know that coffee wins against more sleep?*  

  Another latte? Logic takes a leap!  
  "Just this once more," the tired mantra flows.  
  My brain feels fried, commitments run too deep,  
  as dimes go missing, buried in the heap  
  of choices circling where the debt just grows.  
  **I know that coffee wins against more sleep...**  
  My brain feels fried, commitments run too deep.

  ---

  **Form Breakdown:**
  *   **Twisted Villanelle:** Uses three rotating refrains (Coffee > Sleep, Sleep > Cash, Cash > Coffee) instead of the usual two, mirroring the A>B, B>C, C>A money pump cycle.
  *   **Refrain Rotation:**
      *   Stanza 1: A (Coffee > Sleep), B (Sleep > Cash)
      *   Stanza 2: B (Sleep > Cash), C (Cash > Coffee)
      *   Stanza 3: C (Cash > Coffee), A (Coffee > Sleep)
      *   Stanza 4 (Quatrain): A, B, C, A (Full cycle back to start)
  *   **Rhyme Scheme:** Tight ABA, ABA, ABA, ABAA pattern reinforces the trapped feeling.
  *   **Tone:** Casual American English ("stinks," "hey," "crumpled twenty," "dimes," "logic takes a leap," "wallet groans").
  *   **The Loop:** The speaker justifies each switch (refrains) while the narrative reveals the draining cycle (losing dimes, growing debt) culminating in the exhausted realization of being back at the start ("I know that coffee wins...") with less money.
