prompt: |-
  State your actual credence — a specific number between 0 and 1 — that Bernard Williams's integrity objection, together with the deliberative scenario he describes in which a husband saving his wife reflects on her identity as his spouse and thereby introduces one thought too many, undermines impartialist moral theories generally rather than only act-utilitarianism, specifically because such theories necessarily require agents to treat their own ground projects as fungible with the projects of strangers, violating a necessary condition on moral agency. Decompose your reasoning into four sub-credences, each with an approximate probability and one line of justification: (a) that the objection rests on a substantive account of personal identity in which ground projects are partly constitutive of the self, rather than on a contingent psychological limitation; (b) that impartialist frameworks — including rule-consequentialist and contractualist variants — cannot accommodate non-fungible ground projects without collapsing into value pluralism; (c) that the husband-and-stranger case reveals a normative failure in the theory, not merely an affective or aesthetic mismatch between reasoning and attachment; and (d) that the objection applies with equal force to institutional decision procedures, not only to individual moral deliberation. Show how these terms combine into your overall figure, identify which sub-credence is doing the most work, and say what empirical finding about moral psychology or what revision to the concept of ground projects would shift your overall number most significantly.
