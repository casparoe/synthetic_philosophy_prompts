prompt: |-
  Right, I'm trying to sort out an adversarial collaboration for my reading group on Parfit's hitchhiker and whether rational irrationality actually holds up. We've got two camps who've been arguing past each other for ages. One side thinks you can genuinely bind your future self through present commitments — they're keen on the idea that rationality is partly about your overall behavioural dispositions, not just act-by-act optimisation. The other side reckons this collapses into either evidential reasoning or just wishful thinking about self-control, and that once you're actually in the car with the driver long gone, you'd definately defect.

  Could you draft the joint statement they should have produced? I want:

  - The claims both sides can actually sign onto (about the basic hitchhiker setup, about whether real-world precommitment devices exist, about what rationality requires)
  - The precise disagreements, each phrased so its own camp would accept the wording
  - The cruxes — I reckon one is whether a rational agent can maintain stable preferences across time when local incentives flip, and another is whether the correlation between committing and recieving the ride is causal or evidential
  - For each crux, a concrete case or argument both agree bears on it, with each side's prediction written down in advance

  There's also this variant I keep returning to: what if the driver can only detect your willingness to pay with about 80% accuracy? Both sides should say exactly what that does to their position, and whether it changes anything. And please be honest about whether part of the dispute is just verbal — are they using 'rational' or 'binding' in different ways?

  Keep it casual, like discussion notes. No need for citations or reading lists — just the substance. Use British spelling, please.
