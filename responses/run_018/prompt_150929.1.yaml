prompt: |-
  My study partner's been giving answers on rescue-duty cases all semester, and I want to predict her on a new one. Her verdicts so far:
  - shallow pond child: yes, you must wade in even if it ruins your expensive shoes.
  - sending $200 to save a distant life via malaria nets: yes, distance doesn't weaken the duty.
  - donating a kidney to save a stranger: not required, just supererogitory.
  - pushing the fat man to stop the trolley: forbidden.
  - remotely updating your car's firmware to swerve away from a pedestrian, which disables luxury features worth $3k and carries a 0.1% glitch risk: she said yes, you've got to do it.

  Now there's a decentralized crisis netwrok that asks people to run a small app scanning public social-media posts for suicide-risk signals and auto-alerting local responders. It costs about $6/mo in electricity, carries a minimal privicy risk, and you'd never know if your specific node made the difference. Should she say running it is required?

  If she wants to be consistent, what's the call, which case is the closest analog, and do her precedents actually underdetermine it? If so, lay out at least two rules that fit all her earlier answers, say what each predicts about the app, give your best guess with reasons, and name one further case that'd tell those rules apart. Please separate what's settled in this literature from what's genuinely contested, and don't present a contested view as the consensus.
reasoning: |-
  Okay, let me try to unpack this user's query. They're asking about their study partner's ethical judgments on various rescue scenarios and want to predict her stance on a new case involving a suicide-alert app. 

  First, I need to map the partner's existing verdicts:
  - Shallow pond: Yes (sacrifice shoes to save child)
  - Malaria nets: Yes (distant suffering still obligates)
  - Kidney donation: Not required (supererogatory)
  - Trolley push: Forbidden (no direct harm)
  - Car firmware: Yes (minor cost/risk to save life)

  The new case is a decentralized app with $6/month cost, minimal privacy risk, and uncertain impact. The key is consistency with past decisions. 

  Hmm... the malaria nets case seems closest - both involve financial cost for uncertain but probable life-saving at distance. But the app adds privacy concerns not present in other cases. 

  Wait - the car firmware case is actually more structurally similar: both involve technology interventions with small costs/risks to prevent harm. But the privacy element is new. 

  I recall the literature distinguishes between required sacrifices (like shoes or $200) versus supererogatory acts (kidney donation). The trolley case shows she rejects consequentialism when it requires direct harm. 

  For the app, two possible consistent rules emerge:
  Rule A (moderate cost threshold): Requires interventions costing <$X/month with low risk. Would say yes to app since $6<<$200.
  Rule B (certainty-adjusted): Requires only when personal causal link is clear. Might say no to app since impact is unknown.

  The car case suggests Rule A fits better - she accepted uncertain impact there. But privacy could be a wildcard. 

  To test these rules, I'd propose a case where both cost and impact uncertainty vary - like a $5/month charity subscription with either proven or unknown effectiveness. That would separate Rule A from Rule B.

  The academic consensus stops at "moderate costs required" being settled, while privacy's role remains hotly debated. Best guess is she'd say yes - but the privacy aspect makes it less certain than the malaria net case.
answer: |-
  Based on her precedents and the ethical literature, here's a breakdown of consistency, analogies, and predictions for the suicide-alert app case:

  **Closest Analog:**  
  The **malaria nets/distant life case ($200 donation)** is the strongest parallel due to:  
  - Low/moderate financial cost ($6/mo vs. $200)  
  - Uncertain personal causal impact (you won't know if you saved a life)  
  - Physical distance from the beneficiary  
  - Systemic rather than direct rescue mechanism  

  **Her Likely Verdict (Consistency Analysis):**  
  **Yes, running the app is required.**  
  - **Rule 1: Moderate Sacrifice Principle**  
    *"You must bear moderate costs/risks to save lives when personal involvement is clear, even with uncertain outcomes or distance."*  
    - Fits all cases: Ruined shoes ($ cost), $200 donation (moderate $), car firmware ($3k cost + 0.1% risk).  
    - Excludes kidney (extreme sacrifice) and pushing (direct harm).  
    - **Predicts APP: YES** – $6/mo and minimal privacy risk are moderate costs, analogous to $200 donation.  

  - **Rule 2: No Prohibited Harm + Low-Burden Rescue**  
    *"Required if: (a) no direct/intentional harm to others, and (b) costs are financially manageable and don't disrupt core life projects."*  
    - Fits all: Shallow pond/car firmware (no harm, manageable cost), $200 donation (same). Rejects kidney (high burden), pushing (direct harm).  
    - **Predicts APP: YES** – No direct harm, $6/mo is manageable, privacy risk minimal.  

  **Underdetermination?**  
  Her precedents **do not fully determine** the app verdict because:  
  1. **Privacy risk** is a new factor absent in prior cases.  
  2. **Passive vs. Active Rescue**: The app involves continuous background effort (like ongoing donations), whereas other cases were one-time decisions.  
  3. **Uncertainty of Impact**: While malaria nets share this, the app's *algorithmic mediation* adds complexity.  

  **Best Guess with Reasons:**  
  **She would say YES, it's required.**  
  - **Strongest reason:** The $6/mo cost is *less burdensome* than $200 donation or $3k car sacrifice she deemed obligatory.  
  - **Supporting precedent:** Car firmware case (0.1% risk accepted) shows tolerance for uncertainty/indirect causation.  
  - **Weak counter:** Privacy risk might give pause, but minimal risk aligns with her acceptance of minor glitch risk in the car case.  

  **Test Case to Distinguish Rules:**  
  **"Donating bone marrow (1-2 days pain, 0.1% serious risk) to save a stranger's life."**  
  - **Rule 1 (Moderate Sacrifice):** Likely **NOT REQUIRED** – Pain/medical risk exceeds "moderate" threshold (closer to kidney than $ cost).  
  - **Rule 2 (No Harm + Low Burden):** **REQUIRED** – No *direct harm* to others, burden is temporary and manageable for most.  
  *(Her actual kidney verdict suggests Rule 1 fits better, but this test clarifies.)*  

  ---

  **Literature Consensus vs. Contested Views**  
  | **Settled Consensus**                          | **Genuinely Contested**                          |  
  |-----------------------------------------------|--------------------------------------------------|  
  | **Moderate financial sacrifices are required** to save distant lives (e.g., Singer's shallow pond argument). | **Whether privacy infringements** count as a "cost" akin to financial loss or physical risk in rescue duties. |  
  | **Physical intrusions/direct harm** (e.g., pushing, forced organ removal) are generally *not* required. | **How to quantify "moderate" burden** – Is it income-relative? Does it include non-financial costs (e.g., anxiety, time)? |  
  | **Supererogation exists:** Some acts (e.g., kidney donation) are praiseworthy but not obligatory. | **Ongoing vs. one-off duties** – Do continuous, low-level burdens (like app costs) create stronger/weaker obligations? |  
  | **Proximity matters less** than capability/effectiveness in most consequentialist frameworks. | **Epistemic demands:** Must you *know* your action will succeed, or is statistical likelihood sufficient? |  

  **Key Contention in App Case:**  
  The literature **agrees** that small financial costs for life-saving are required, but **disagrees sharply** on whether:  
  - **Privacy compromises** constitute a morally relevant cost (deontologists vs. utilitarians).  
  - **Algorithmic mediation** (e.g., app errors, bias in scans) weakens personal responsibility.  

  Her precedents suggest she sides with the consensus on cost/risk but hasn't addressed privacy – making this a *borderline* case underdetermined by past answers. A "YES" aligns better with her pattern of accepting probabilistic, low-burden rescues.
