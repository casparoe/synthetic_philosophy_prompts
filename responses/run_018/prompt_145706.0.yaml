answer: |-
  ## Joint Statement on the Psychological Granularity of Moral Character  
  **Following Adversarial Collaboration Between Global-Trait Virtue Ethics Defenders and Proponents of the Situationist Critique**

  ### Preamble
  We, signatories representing scholarly commitments to global-trait virtue ethics ("Trait View") and the situationist critique ("Situationist View"), present this statement following rigorous adversarial collaboration. Our dispute is narrowly framed on the psychologically realistic granularity of moral character. We concur that the central question is not whether humans possess *any* stable moral dispositions, nor whether they are globally "good" or "bad," but whether such dispositions are best modeled as *cross-situational global traits* (e.g., a unitary disposition of Honesty manifesting predictably across diverse contexts) or as *locally indexed moral expertise* (e.g., distinct, contextually bounded skills in domains like resource fairness or stranger compassion). We agree this framing captures the core empirical and normative stakes regarding character realism. Below we outline points of agreement and specify residual disagreements with associated empirical tests.

  ---

  ### Part I: Agreed Claims
  Both parties endorse the following claims without reservation:

  1.  **Limitations of Self-Report:** Traditional self-report personality inventories measuring purported global moral traits (e.g., honesty scales) demonstrate poor predictive validity for specific, observable moral behaviors in concrete situations.
  2.  **Power of Situations:** Situational variables (e.g., time pressure, anonymity, perceived authority, ambient environmental cues) explain substantial variance in moral behavior that remains unaccounted for by scores on measures of purported global character traits.
  3.  **Distinction Between Prediction and Explanation:** Predictive failure of global trait measures in specific contexts does not automatically entail the explanatory irrelevance of dispositional factors in moral psychology. Conversely, the potential explanatory relevance of dispositions does not automatically guarantee predictive success for global trait measures across diverse situations.
  4.  **Coherence of Local Traits:** The concept of "local traits" or domain-specific moral skills (e.g., skill in navigating fairness dilemmas within close relationships, distinct from skill in showing compassion to strangers) is conceptually coherent and empirically distinguishable from the concept of a monolithic global character trait. Such local expertise can be operationally defined and measured.
  5.  **Descriptive-Normative Gap:** Purely descriptive findings from psychology (e.g., concerning behavioral consistency or inconsistency) cannot, without further mediation by accounts of moral development, habituation, or education, settle core normative questions within virtue ethics regarding how individuals *ought* to cultivate character or how communities *ought* to assign praise and blame.
  6.  **Commitment to Shared Protocol:** To generate mutually relevant data, both parties commit to the validity and relevance of a specific empirical protocol: Ambulatory Experience-Sampling Methodology (ESM) tracking participants' self-reported micro-decisions, perceived situational features, and emotional responses across three distinct moral domains (Resource Fairness, Stranger-Directed Compassion, Promise-Keeping). This will be paired with peer-nomination ratings of domain-specific moral reliability and independent behavioral coding of relevant actions within each domain, providing a multi-method dataset both sides agree bears directly on the dispute.

  ---

  ### Part II: Disagreements Table

  | Crux | Formulation Accepted by Virtue-Ethics Defenders (Trait View)                                                                                                                                 | Formulation Accepted by Situationists (Situationist View)                                                                                                                             | Agreed Case/Result Bearing on Crux                                                                                                | Predicted Outcome (Trait View)                                                                                            | Predicted Outcome (Situationist View)                                                                                                 |
  | :--- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------------ |
  | **A. Latent Structure of Moral Dispositions** | Peer-nomination consistency ("Reliable in moral matters") across the three domains (Fairness, Compassion, Promise-Keeping) will correlate more strongly with a single latent "global moral character" factor, indicating a stable underlying disposition manifesting across distinct moral contexts. | Peer-nomination consistency across domains will correlate more strongly with three largely independent domain-specific factors, indicating that moral reliability is context-bound expertise, not a unified global trait. | Factor analysis (CFA/SEM) of peer-nomination data across the three domains, alongside ESM behavioral consistency measures within domains. | Significant cross-domain loadings on a single dominant latent factor; weaker domain-specific factors. | Three distinct, moderately correlated domain-specific factors; poor fit for a single dominant global factor model. |
  | **B. Transfer of Moral Training** | Targeted training enhancing moral skill in one domain (e.g., structured exercises increasing compassionate responding to strangers) will produce measurable behavioral transfer to an untrained domain (e.g., increased fairness in anonymous resource allocation), due to the cultivation of a generalizable disposition or skill set. | Behavioral improvements from targeted training in one domain (e.g., stranger compassion) will remain largely confined to that domain or highly similar contexts, showing minimal transfer to untrained domains (e.g., fairness), due to the domain-specificity of moral skills. | Intervention study: Train Group 1 in Compassion, Group 2 in Fairness, Control Group. Pre/post ESM measures in *all three* domains for *all* groups. | Significant pre-post improvement in the *untrained* domain (Fairness for Compassion trainees, Compassion for Fairness trainees) for intervention groups vs. control. | Significant pre-post improvement *only* in the *trained* domain for intervention groups; no significant change in untrained domains vs. control. |
  | **C. Consistency of "Moral Experts"** | Individuals consistently rated by peers as having high moral expertise/excellence within specific domains will exhibit significantly lower cross-situational variability in domain-relevant behaviors (measured via ESM) compared to matched controls, demonstrating stable dispositions even amidst situational flux. | Individuals rated as "moral experts" in specific domains will exhibit cross-situational variability in domain-relevant behaviors comparable to controls; their perceived consistency arises primarily from self-selection into (or construction of) social environments that reliably cue domain-appropriate behavior, not inherent cross-situational stability. | Compare ESM-derived cross-situational variability (e.g., intra-individual SD) scores within their nominated domain for peer-nominated "experts" vs. carefully matched controls. | "Experts" show significantly lower variability scores within their nominated domain than matched controls. | "Experts" show variability scores within their nominated domain statistically indistinguishable from matched controls. |
  | **D. Normative Presuppositions** | Normative virtue ethics practices (e.g., educating for character, assigning praise/blame meaningfully, aspiring to integrated virtue) inherently presuppose and require the psychological reality of stable, cross-situational global traits. Without the potential for such traits, these practices lose coherence or become pragmatically incoherent. | Normative virtue ethics practices can be coherently preserved within a "local-virtue" framework. Praise, blame, education, and aspirations towards virtue can be domain-specific, targeting contextually reliable skills and habits without requiring unrealistic cross-domain consistency. A "fragmented" but locally robust character is sufficient. | Philosophical analysis informed by empirical findings (esp. from A-C) on the feasibility and descriptive accuracy of global vs. local trait models. | N/A (Normative Claim)                                                                                                    | N/A (Normative Claim)                                                                                                                 |
  | **D. Revision Condition** | If empirical results consistently demonstrate minimal cross-domain consistency (A), no transfer (B), and no exceptional stability in experts (C), the Trait View accepts that normative virtue ethics must be significantly revised or its presuppositions about psychological granularity abandoned. | If empirical results consistently demonstrate strong cross-domain consistency (A), significant transfer (B), and exceptional stability in experts (C), the Situationist View accepts that global traits provide a psychologically realistic basis sufficient to ground core normative virtue ethics practices as traditionally conceived. | N/A                                                                                                                               | Revision Trigger: Strong evidence for localism (A, B, C).                                                                 | Revision Trigger: Strong evidence for globalism (A, B, C).                                                                            |

