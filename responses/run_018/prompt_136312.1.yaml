  ## Grant Proposal: Reframing the Euthyphro Dilemma – Unmasking the Hidden Assumption and Proposing a Bifurcated Normative Model

  **Principal Investigator:** [Your Name]
  **Duration:** 6 Months
  **Field:** Conceptual Ethics / Metaethics
  **Keywords:** Euthyphro Dilemma, Divine Command Theory, Moral Grounding, Normative Authority, Conceptual Analysis

  **Abstract:** This project challenges the exhaustiveness of the canonical Euthyphro Dilemma by exposing a hidden assumption shared by Socrates and Euthyphro: that "being pious" (or "good") denotes a single, unitary property grounded in exactly one way. I argue this assumed property-monism obscures a potential third position. The research will develop and rigorously test a novel bifurcated model of normative properties: distinguishing a "directive" aspect (tracking objective reasons/value, grounding *what* ought to be done) from an "authoritative" aspect (constituted by relational features like divine command, grounding *bindingness*). This model aims to escape the arbitrariness plaguing Divine Command Theory (DCT) while avoiding strong moral realism about divine commands, offering a fresh conceptual framework for understanding divine authority and normativity.

  **1. The Problem: Beyond the Forced Choice?**
  The Euthyphro Dilemma (Plato's *Euthyphro*) is a cornerstone of metaethics, presenting piety/goodness as caught between two horns:
  *   **Horn 1 (Independence):** The pious is loved by the gods *because* it is pious. Piety exists independently of divine attitudes; the gods merely recognize it. This aligns with moral realism but risks making divine commands redundant or potentially fallible.
  *   **Horn 2 (Dependence - Divine Command Theory):** The pious is pious *because* the gods love it. Piety is constituted by divine will/command. This preserves divine sovereignty but faces the devastating "arbitrariness objection": if God commands cruelty, would it be good? Morality seems contingent and potentially capricious.

  The dilemma forces a stark choice: independent moral facts or divine command arbitrariness. However, both Socrates' framing and Euthyphro's responses implicitly rely on the **Hidden Assumption of Normative Property Monism (NPM)**: "being pious" is a singular property with a single, monolithic ground (either divine will *or* an independent standard).

  **2. Critique: Why Existing Approaches Obscure the Bifurcation**
  Standard interpretations and responses largely operate *within* the NPM framework:
  *   **Robust Realism:** Embraces Horn 1, grounding normativity entirely independently of divine will.
  *   **Sophisticated DCT:** Attempts to mitigate Horn 2's arbitrariness (e.g., by grounding God's nature in goodness or claiming God *couldn't* command cruelty), but often struggles to avoid collapsing back into Horn 1 or smuggling in independent standards, precisely because it tries to make divine will ground the *entire* normative property.
  *   **Constructivism/Expressivism:** Rejects the realist presuppositions of Horn 1 but struggles to account for the apparent objectivity and bindingness of divine commands without falling into relativism or failing to capture the *authority* specific to divine commands implied in the dilemma.
  *   **Natural Law:** Blurs the distinction, often grounding directives in nature/reason and authority in divine will, but rarely explicitly separates the conceptual components as distinct grounds within a single property.

  These approaches, debating *which* monistic ground is correct, fail to challenge the NPM assumption itself, leaving the potential for a bifurcated grounding unexplored within the Euthyphro context.

  **3. Proposed Solution: The Directive/Authority Bifurcation**
  I propose splitting the normative property (e.g., "being pious" or "being obligatory") into two conceptually distinct, yet interrelated, aspects, each with its own potential ground:
  *   **Directive Aspect (What):** This aspect captures *what makes an action count as the kind of thing that ought to be done*. It tracks objective values, reasons, or states of affairs that provide normative *reasons for action*, independent of any commanding will (divine or human). Ground: Potentially objective values, rational requirements, or fundamental goods (e.g., well-being, justice). *This aspect aligns with the intuition behind Horn 1.*
  *   **Authoritative Aspect (Bindingness):** This aspect captures *what makes the directive genuinely binding upon a specific agent*, imposing a *requirement* or *obligation*. It concerns the source of normative *force* or *legitimacy* for the agent. Ground: Potentially relational features like divine commands (understood as acts of will by a supremely authoritative being), social contracts, or institutional roles. *This aspect aligns with the intuition behind Horn 2's focus on divine will.*

  **The Third Position:** Divine commands could constitute the **Authoritative Aspect** – making the directives *binding* upon humans – without constituting the **Directive Aspect**. God commands kindness *because* kindness possesses the directive property (grounded independently in, e.g., its promotion of flourishing). The command adds binding obligation. This avoids:
      *   **Arbitrariness:** God cannot make cruelty good/directive; God's commands are constrained by the pre-existing directive structure (God commands kindness *because* it is independently directive). Cruelty lacks the directive property, so God couldn't command it *as good*.
      *   **Redundancy:** God's command is not redundant; it provides the essential authoritative force, transforming independent reasons into binding obligations *for us*.

  **4. Method: Conceptual Analysis and Model Testing**
  This solo, conceptual research project will employ:
  1.  **Precise Conceptual Articulation:** Rigorously defining the "Directive" and "Authoritative" aspects, distinguishing their roles in normative judgment and action-guidance. Clarifying their relationship (e.g., is authority parasitic on directive content?).
  2.  **Objection Response Testing:**
      *   *Arbitrariness Objection:* Demonstrate how separating the aspects dissolves the objection against DCT, as God's will is constrained by the independent directive ground.
      *   *"Many Gods" Problem/Euthyphro's Challenge:* Analyze whether conflicting divine commands undermine the model, or if it can explain authority conflicts while preserving a unified directive ground. Does it require a supreme authority?
      *   *Collapse Objections:* Argue why the aspects are genuinely distinct and why attempts to reduce one to the other fail (e.g., why authority isn't *just* another directive reason; why directives alone lack full obligatoriness).
  3.  **Analogical Construction:** Develop and critically assess analogies to illuminate the bifurcation, particularly:
      *   *Institutional Authority:* A judge's ruling (authoritative aspect) declares what the law (directive aspect, grounded independently in statutes/constitution) requires *here and now*, making it binding *for these parties*. The judge doesn't invent the law's content but authoritatively applies it.
      *   *Parental Commands:* A parent commands a child to eat vegetables (authoritative aspect) based on the independent directive aspect (nutrition/health). The parent doesn't make health good, but makes the health-based reason binding for the child.
  4.  **Dialogue with Key Positions:** Engage conceptually with relevant arguments from Divine Command Theory (e.g., Adams, Quinn), Moral Realism, and Natural Law to situate the bifurcation model.

  **5. Outcomes and Assessment Criteria**
  *   **Successful Result:** A clearly articulated, philosophically defensible conceptual model of bifurcated normative grounding applied successfully to the Euthyphro Dilemma. Key successes would be:
      *   Convincingly demonstrating the NPM assumption and its role in forcing the false dilemma.
      *   Providing robust definitions of the Directive and Authoritative aspects.
      *   Showing how the model avoids the core arbitrariness objection against DCT.
      *   Offering plausible responses to the "many gods" problem and collapse objections using the model.
      *   Developing illuminating analogies (especially institutional) that bolster the model's intuitive plausibility.
      *   Drafting 1-2 journal article manuscripts based on the research.
  *   **Failed Project:** Failure would be indicated by:
      *   Inability to coherently separate the directive and authoritative aspects without collapsing into monism (either realism or voluntarism).
      *   The model proving unable to convincingly escape the arbitrariness objection or handle the "many gods" problem.
      *   The analogies (especially institutional) failing to illuminate the distinction or revealing fatal disanalogies.
      *   The model offering no genuine advantage over existing sophisticated DCT or Natural Law positions.

  **6. Feasibility Assessment: Ambitious but Manageable**
  This project is ambitious, tackling a foundational dilemma with a novel conceptual framework. However, it is feasible for focused, six-month solo research:
  *   **Scope Control:** The focus is *conceptual development and testing*, not exhaustive historical scholarship or engagement with every metaethical theory. Primary textual focus remains Plato's *Euthyphro* and core metaethical arguments.
  *   **Methodology:** Relying on conceptual analysis and argument construction is well-suited to solo work.
  *   **Milestones:** Structured work plan with phases: (1) Literature/Assumption Critique (1.5 mo), (2) Model Definition & Core Arguments (2 mo), (3) Objection Responses & Analogies (1.5 mo), (4) Synthesis & Writing (1 mo).
  *   **Risk Mitigation:** The core risk is underestimating the complexity of defining distinct normative aspects. Mitigation involves iterative refinement, seeking feedback on draft sections early, and being prepared to narrow the focus (e.g., prioritizing arbitrariness over "many gods") if time presses. The success criteria allow for a defensible *framework* even if not a fully developed theory.

  **Conclusion:** By exposing the Hidden Assumption of Normative Property Monism inherent in the Euthyphro Dilemma, this research opens conceptual space for a novel bifurcated model of normativity. Distinguishing the Directive ("what ought") from the Authoritative ("what binds") aspects promises a third way that preserves divine authority over obligation while anchoring morality in objective value, avoiding the horns of arbitrariness and redundancy. This six-month project will rigorously develop, test, and refine this model, offering a significant reconceptualization of a perennial philosophical problem.

