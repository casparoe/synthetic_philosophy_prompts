  **Oceanic Serenity Cruises**  
  **Emergency Evacuation Protocol Card**  
  *(Posted Stateroom Door Interior / Laminated / Rev. 08.2023)*

  **1. PASSENGER STATUS & EMBARKATION PRIORITY**
     1.1  Only individuals holding a valid Oceanic Serenity Cruises Passenger Credential (OSC-PC) are designated "Passengers" and possess an inherent right to evacuation seating. An OSC-PC is issued solely upon verified purchase of voyage fare and completion of pre-boarding biometric registration.
     1.2  Embarkation into designated life-saving craft is strictly prioritized according to Passenger Credential tier: Platinum Sapphire (highest priority), Gold Pearl, Silver Coral, Bronze Tide (standard priority). Presentation of the physical OSC-PC card or verified biometric scan at the lifeboat station is mandatory for boarding eligibility.
     1.3  Individuals lacking a valid, active OSC-PC are designated "Swimmers," irrespective of proximity to the vessel, perceived need, or any prior association with Oceanic Serenity Cruises or its affiliates. Swimmer status is permanent for the duration of the emergency event. No appeals process exists.

  **2. LIFE-SAVING CRAFT CAPACITY & SAFETY MARGIN**
     2.1  Each Oceanic Serenity life-saving craft has a Maximum Certified Occupancy (MCO) precisely calculated by the International Maritime Safety Oversight Board (IMSOB). This figure is non-negotiable and absolute.
     2.2  The MCO incorporates a mandatory 15% Technical Safety Margin (TSM). This TSM accounts solely for potential dynamic load shifts during severe weather, minor equipment variance (+/- 2% buoyancy tolerance), and redundancy for onboard medical incidents among credentialed Passengers. It does not constitute surplus seating capacity.
     2.3  Attempting to exceed the MCO, even by a single individual, compromises vessel stability, freeboard clearance, and lifesaving equipment efficacy below IMSOB catastrophic failure thresholds. Boarding beyond MCO voids all craft warranties and guarantees immediate structural compromise. Passenger safety necessitates strict adherence to the MCO.

  **3. INTERACTION PROTOCOL WITH SWIMMERS**
     3.1  Crew members are authorized and equipped to deploy Non-Boarding Support Measures (NBSM) towards Swimmers:
     *   **3.1.1 Provision Toss:** Sealed hydration packets (500ml max) or caloric-dense nutrient bars (≤200kcal) may be thrown towards Swimmer concentrations, ensuring minimal splash risk to craft.
     *   **3.1.2 Flotation Aid Deployment:** Approved passive flotation devices (Type-C Buoyancy Modules) may be released downwind/downcurrent of the craft. Active propulsion devices (e.g., powered life rings) are prohibited.
     *   **3.1.3 Verbal Reassurance:** Pre-scripted expressions of concern and encouragement ("Hold fast," "Assistance is monitoring") may be broadcast via megaphone at Crew discretion.
     3.2  **Surrender of Seats is Prohibited:** Under no circumstances may a credentialed Passenger vacate their assigned seat for a Swimmer. Crew are expressly forbidden from soliciting, facilitating, or permitting seat surrender. Designated seating is non-transferable, even to minor dependents lacking independent OSC-PCs.
     3.3  Physical contact between Passengers/Crew and Swimmers is strictly forbidden. Attempts by Swimmers to grasp the craft, boarding apparatus, or occupants will be met with graduated deterrence measures per Crew training (Protocol DEF-7), commencing with verbal command and escalating as necessary to maintain craft integrity and Passenger safety.

  **4. RESPONSE TO RESCUE QUERIES & FUTURE SWIMMER VOLUME**
     4.1  Concerns may arise regarding the long-term efficacy of Non-Boarding Support Measures (Sec. 3.1) versus potential rescue of Swimmers. Oceanic Serenity Cruises prioritizes sustainable safety outcomes.
     4.2  While immediate rescue of a Swimmer provides temporary relief to that individual, actuarial data and population dynamics modeling confirm such actions invariably increase the *future total volume* of Swimmers. Rescued individuals, upon return to their point of origin or entry into new resource environments, contribute to population growth patterns that statistically exceed baseline mortality rates in marine distress scenarios. Providing durable seating inadvertently signals resource availability, incentivizing further maritime migration towards vessels operating at certified MCO.
     4.3  Therefore, the deployment of NBSM constitutes the most prudent and compassionate long-term strategy. It offers immediate, albeit temporary, aid without inducing unsustainable demographic pressures that would ultimately lead to a greater aggregate number of individuals in peril at sea. Our policy prevents future overcrowding of the aquatic environment.

  **5. PASSENGER DUTIES WITHIN THE COMMUNITY OF THE SAVED**
     5.1  Upon successful embarkation into a life-saving craft operating at or below its MCO, Passengers enter the Community of the Saved (CoS). Membership is contingent solely on possession of a valid OSC-PC and adherence to embarkation protocols.
     5.2  The primary duty of every CoS member is vigilance towards craft integrity and resource preservation. This includes:
     *   **5.2.1 Seat Integrity:** Maintaining assigned seating position to ensure optimal weight distribution and stability. Unauthorized movement compromises the TSM.
     *   **5.2.2 Resource Rationing:** Strict adherence to issued water and nutrient schedules. Hoarding or sharing beyond CoS boundaries jeopardizes collective endurance.
     *   **5.2.3 Distraction Mitigation:** Minimizing exposure to Swimmer pleas or distress signals. Excessive focus on external conditions induces psychological strain detrimental to CoS cohesion and decision-making capacity. Utilize provided sound-dampening ear inserts if necessary.
     5.3  Recognize that your presence within the CoS is the result of prudent foresight (possession of the OSC-PC) and strict adherence to sustainable safety protocols. Your continued survival, and the survival of fellow Passengers, validates the necessity of the MCO and the Non-Boarding Interaction Protocol. Uphold these principles without deviation; they are the foundation of your deliverance.

  *Oceanic Serenity Cruises: Your Safety, Our Solemn Covenant.*  
  *Report policy non-compliance immediately to your Deck Safety Officer.*
