prompt: |-
  I convene a quarterly arbitration panel for a research collective that operates at the intersection of forecasting, ethics, and cognitive science. We are repeatedly asked to resolve persistent disagreements between senior members whom we treat as epistemic peers—disagreements that rarely concern isolated propositions, but instead concern which generative model class ought to govern our predictions, and how to weight suffering against autonomy in long-horizon plans. I want a reusable decision procedure, grounded in the common prior assumption and its standard failure modes, but modified to require what I call hyperprior transparency: peers must make explicit not only their posteriors over propositions, but their priors over competing model classes (for example, linear versus non-linear dynamics, or consequentialist versus deontological framing functions).

  The deliverable should be a flowchart in words: a sequence of questions the panel can run in a thirty-minute session, with clear stopping rules. For each question, specify what counts as a sufficient answer, and flag precisely where the answer is a judgment call dressed up as procedure rather than a direct consequence of the principle. The procedure must distinguish three divergences: (i) shared model class with divergent posteriors that ought to converge once posteriors are common knowledge; (ii) divergent hyperpriors over model classes that do not dissolve with transparency; and (iii) normative framing disagreements that lie outside the scope of the common prior altogether. Where the procedure reaches a verdict of no convergence required, it should state whether the matter is referred back to the researchers, escalated to an external arbiter, or handed to a values committee—indicating in each case whether the panel chair signs off alone or the full board must agree.

  Apply the procedure to three cases.

  First, two epidemiologists disagree about the ten-year efficacy of a vaccination protocol; they share a statistical framework but assign different prior weights to publication-bias models versus genuine-effect models.

  Second, two philosophers disagree about whether deception is permissible in a field study on altruistic decision-making; they invoke different normative framing functions.

  Third, provide a case where the procedure yields an answer I will actively dislike: our funding committee must choose between a suffering-reduction programme and a capability-building programme, and the procedure classifies the disagreement as a resolvable model-class divergence—because both sides share a suffering-weighted utility framework but differ only on empirical hyperpriors about long-run feedback loops—thereby forcing a convergence recommendation that strips away the normative framing I had hoped to preserve.

  Finally, state explicitly what the procedure cannot do: which disagreements it will misclassify, where it will misfire if hyperpriors are misreported, and under what conditions the chair ought to override it despite its verdict.

  Please write in British English, and give a committed response. Make definite choices about which distinctions survive the translation into practice and which are dropped, defend those choices with reasons, and do not present them as one option among many. Do not include bibliographies, reading lists, or citations.
reasoning: |-
  Hmm, this is a fascinating and complex request. The user is convening an arbitration panel for a research collective operating at forecasting/ethics/cognitive science intersections. They need a reusable decision procedure with specific requirements around hyperprior transparency - making model class priors explicit, not just posteriors. 

  The core challenge is designing a practical 30-minute flowchart that distinguishes between three types of divergences: (1) shared models with posterior differences, (2) divergent hyperpriors over model classes, and (3) purely normative framing disagreements. The user wants clear stopping rules and wants me to explicitly flag where judgments are disguised as procedures.

  I notice several layers of sophistication here. First, the common prior assumption is central but acknowledged to fail. Second, the demand for hyperprior transparency suggests frustration with hidden model-class disagreements masquerading as factual disputes. Third, they want the procedure to prescribe institutional actions (refer back, escalate, etc.) with governance rules (chair vs full board).

  For the three test cases: The epidemiology case should clearly land in category (i). The philosophy case should trigger category (iii). The "disliked" funding case needs careful construction - I'll design it so the procedure forces convergence on empirical grounds despite normative framing, precisely to satisfy their request for an uncomfortable outcome.

  Key design choices I'm committing to:
  - Dropping exhaustive hyperprior decomposition (impractical in 30 mins) for focused model-class contrast
  - Treating "values committee" referral as distinct from external arbitration
  - Requiring full board approval only for normative escalations
  - Using revealed willingness to update as a practical proxy for peer status

  The limitations section must highlight: misclassification risks when hyperpriors are strategic rather than sincere, the inherent subjectivity in "sufficient reason" judgments, and override conditions like demonstrable bad faith.

  British English requirements mean I'll use "programme" not "program", "prioritise" not "prioritize", etc., while maintaining philosophical precision. No hedging - definite choices throughout.
answer: |-
  ### Arbitration Procedure for Epistemic-Normative Divergence  
  *Grounding: Common Prior Assumption with Hyperprior Transparency*  

  **Core Principle**: All panelists must explicitly state (a) posterior credences over disputed propositions, and (b) hyperpriors (i.e., prior weights) over competing generative model classes or normative framing functions.  

  ---

  ### DECISION FLOWCHART (30-MINUTE SESSION)  

  1. **QUESTION 0: Pre-arbitration Readiness**  
     - *Ask*: "Have both parties submitted: (i) posterior over disputed proposition P, (ii) hyperprior over model classes M₁, M₂, ..., Mn relevant to P?"  
     - *Sufficient Answer*: Written submission of numerical values or bounded intervals.  
     - *Stopping Rule*: If not submitted, adjourn. No verdict.  

  2. **QUESTION 1: Shared Model Class?**  
     - *Ask*: "Do both parties commit to identical generative model class M (e.g., Bayesian nets with shared structure, identical utility function) for evaluating P?"  
     - *Sufficient Answer*: Unambiguous "yes" or "no" with cited model specifications.  
     - *Judgment Call*: Panel chair determines if cited differences (e.g., "linear vs. logistic growth") are trivial parametrisation choices *within* a class or distinct classes.  
     - *Path*:  
       - **Yes** → Proceed to Q2.  
       - **No** → Proceed to Q3.  

  3. **QUESTION 2: Posteriors Converge Under Common Knowledge?**  
     - *Ask*: "Given shared M, if parties disclose priors/likelihoods and update iteratively, do posteriors converge?"  
     - *Sufficient Answer*: Simulation using submitted data (5 mins max).  
     - *Stopping Rule*:  
       - **Convergence** → Verdict: **Shared Model, Forced Consensus**. Parties must adopt consensus posterior. Chair signs off.  
       - **Divergence** → Verdict: **Procedural Error**. Refer to data audit committee. Full board approval required.  

  4. **QUESTION 3: Shared Normative Framework?**  
     - *Ask*: "Do hyperpriors address *empirical* model classes (e.g., neural nets vs. regression) or *normative* framing functions (e.g., utilitarian vs. deontological)?"  
     - *Sufficient Answer*: Parties classify their hyperpriors as empirical/normative.  
     - *Judgment Call*: Chair determines if a "framing function" (e.g., suffering-weighting algorithm) is empirical (measurable) or normative (axiological).  
     - *Path*:  
       - **Empirical** → Proceed to Q4.  
       - **Normative** → Verdict: **Irreducible Framing Divergence**. Escalate to values committee. Full board approval required.  

  5. **QUESTION 4: Hyperprior Transparency Resolves Disagreement?**  
     - *Ask*: "Does disclosing hyperpriors over empirical model classes collapse divergence? (e.g., Parties agree M₁ is 3x likelier than M₂ but disagree on P due to incomplete updating)."  
     - *Sufficient Answer*: Joint Bayesian update using pooled hyperpriors.  
     - *Stopping Rule*:  
       - **Convergence** → Verdict: **Hyperprior Alignment**. Parties adopt pooled posterior. Chair signs off.  
       - **Divergence** → Verdict: **Model-Class Rivalry**. Escalate to external arbiter (e.g., metaresearch institute). Chair signs off.  

  ---

  ### APPLICATION TO CASES  

  **Case 1: Epidemiologists’ Vaccine Efficacy Dispute**  
  - Q1: **No** (Different hyperpriors: "publication-bias model" vs. "genuine-effect model").  
  - Q3: **Empirical** (Models predict observable outcomes).  
  - Q4: **Convergence** (Transparency shows both weight "genuine-effect" at >0.7; divergence due to unshared subgroup data).  
  - **Verdict**: Hyperprior Alignment. Adopt pooled efficacy estimate.  

  **Case 2: Philosophers’ Deception Permissibility Dispute**  
  - Q1: **No** (Consequentialist vs. deontological framing functions).  
  - Q3: **Normative** (Framings prescribe actions, not predict outcomes).  
  - **Verdict**: Irreducible Framing Divergence. Escalate to values committee.  

  **Case 3: Funding Dispute (Suffering-Reduction vs. Capability-Building)**  
  - *Your Disliked Outcome*:  
    - Both parties use *suffering-weighted utilitarianism* but disagree on empirical model:  
      - Side A: Hyperprior 0.8 on "capability → suffering reduction" feedback loop.  
      - Side B: Hyperprior 0.8 on "capability → inequality → suffering" model.  
    - Q1: **No** (Divergent empirical models).  
    - Q3: **Empirical** (Dispute concerns causal dynamics, not utility framing).  
    - Q4: **Divergence** (No convergence after hyperprior disclosure).  
  - **Verdict**: Model-Class Rivalry. Escalate to external arbiter (e.g., causal inference specialists).  
  - *Why You Dislike It*: The procedure strips normative weight from "capability" by reclassifying it as an empirical dispute, overriding your intent to treat autonomy as intrinsically valuable.  

  ---

  ### EXPLICIT LIMITATIONS  
  1. **Misclassification Risks**:  
     - Will misfire if parties misrepresent hyperpriors strategically.  
     - Misclassifies "conceptually incommensurable" model classes (e.g., frequentist vs. Bayesian) as resolvable empirical divergences.  
  2. **Blind Spots**:  
     - Cannot detect when hyperpriors embed hidden normative biases (e.g., a "cognitive bias model" assuming irrational agents).  
     - Fails if disagreements stem from undefined model classes.  
  3. **Override Conditions**:  
     - Chair **must override** if:  
       - Evidence of bad-faith hyperprior reporting.  
       - Dispute involves existential risk (e.g., requires precautionary principle).  
       - External arbiter conflicts with collective’s ethical charter.  

  ---  
  **Final Note**: This procedure prioritises *actionable arbitration* over philosophical completeness. It collapses nuanced epistemology into binary checkpoints because 30-minute deadlines demand tractability, not truth. Its force lies in forcing commitments into the open—not in guaranteeing consensus.
