answer: |-
  Here's a reusable 20-minute screening procedure based on Hofstadter's "careenium" concept, designed as a practical checklist for architecture docs. The three core checks are operationalized for non-experts, with clear pass/fail thresholds and escalation points. I'll then apply it to your two examples.

  ---

  ### **Screening Procedure: Symbolic Causation Check**
  *(Run in sequence—stop and flag if any step fails)*

  #### **1. Direct Symbol-to-Substrate Intervention Check**  
  **Goal**: Verify if symbols *actively modify* low-level substrate (e.g., weights, activations, connections).  
  **What to check in docs**:  
  - Look for mechanisms where symbolic representations (e.g., tokens, rules, plans) directly trigger changes in the substrate's structure or dynamics.  
  - Key phrases: "top-down control," "feedback modulation," "symbol-guided optimization," "attention rerouting."  
  **Pass**: Symbols explicitly reconfigure substrate *parameters* (e.g., a planner output adjusts neural weights) or *dynamics* (e.g., tokens gate activation flow).  
  **Fail**: Symbols only *represent* substrate states (e.g., logits as readouts) or are passive inputs (e.g., embeddings processed bottom-up).  
  **Escalate to PI**: If mechanisms are described as "emergent," "implicit," or involve bidirectional coupling (symbols/substrate co-update in one step).

  #### **2. Substrate-Invariance Test**  
  **Goal**: Determine if substrate behavior *changes* when the symbol layer is disabled/ablated.  
  **What to check in docs**:  
  - Simulate "removing" the symbol layer (e.g., disable feedback loops, freeze planner outputs).  
  - Ask: Does the substrate still produce identical *core functionality*?  
  **Pass**: Substrate behavior degrades or shifts fundamentally without symbols (e.g., perception front-end fails when planner outputs are ignored).  
  **Fail**: Substrate operates identically (e.g., neural backend runs fine with static embeddings).  
  **Escalate to PI**: If ablation isn't feasible (e.g., symbols/substrate are co-dependent) or docs lack module isolation details.

  #### **3. Temporal Precedence Verification**  
  **Goal**: Confirm symbols *precede and drive* substrate changes.  
  **What to check in docs**:  
  - Map the execution timeline: Do symbols *generate first*, then propagate downward?  
  - Trace causal chains: Symbol update → Substrate reconfiguration → Output.  
  **Pass**: Clear order where symbols are computed *before* altering substrate (e.g., planner output at t=1 affects neural weights at t=2).  
  **Fail**: Symbols/substrate update concurrently (e.g., parallel attention layers) or symbols lag substrate changes.  
  **Escalate to PI**: If timing is ambiguous (e.g., "asynchronous" or "recurrent without clocks").

  ---

  ### **Hard Coupled-Feedback Cases**  
  **Flag during escalation if**:  
  - Symbols and substrate are co-dependent (e.g., mutual updates in one step).  
  - Architecture uses fused modules (e.g., "neural-symbolic integrators") without clear interfaces.  
  *Procedure cannot resolve these—requires dynamic analysis.*

  ---

  ### **What This Procedure *Cannot* Settle**  
  - **Emergent causation**: Symbols that *seem* causal but aren't architecturally enforced.  
  - **Scale-dependence**: Whether micro-dynamics invalidate macro-symbols.  
  - **"Folk psychology" debates**: If symbols map to human-like intentionality.  

  ---

  ### **Application to Examples**  

  #### **Example 1: Classic Symbolic Planner + Neural Perception Front-end**  
  - **Step 1 (Intervention)**: Planner outputs (symbols) explicitly set goals that reconfigure the neural front-end's attention. *Pass*.  
  - **Step 2 (Invariance)**: Removing planner causes front-end to process inputs indiscriminately (e.g., no object prioritization). *Pass*.  
  - **Step 3 (Precedence)**: Planner runs *before* perception cycle (symbols at t, substrate at t+1). *Pass*.  
  **Verdict**: **Real symbol causation**. Clear top-down control.  

  #### **Example 2: Reasoning LLM (Chain-of-Thought Tokens Loop)**  
  - **Step 1 (Intervention)**: CoT tokens are generated by the substrate (neural net) and fed back as inputs. No *architectural* mechanism for tokens to "shove" hidden states; they’re processed identically to other tokens. *Fail*.  
  - **Step 2 (Invariance)**: Ablating CoT tokens (removing feedback loop) alters input sequence but substrate dynamics (transformer ops) are unchanged. Substrate runs identically on other tokens. *Fail*.  
  - **Step 3 (Precedence)**: Tokens are generated *by* the substrate, then re-ingested—no temporal precedence. *Fail*.  
  **Verdict**: **Substrate-only (symms bubbling up)**. CoT is an emergent artifact of parallel tensor ops, not top-down causation.  

  *(You probably won’t like this—but the architecture shows no *bona fide* symbol intervention. CoT is a self-referential pattern, not a causal driver.)*  

  ---

  ### **Workflow Summary**  
  1. Spend **5 min** on Step 1 (skip if no symbol layer exists).  
  2. Spend **10 min** on Step 2 (critical for counterfactual).  
  3. Spend **5 min** on Step 3 (trace execution order).  
  **Output**:  
  - Pass all 3 → Symbol causation.  
  - Fail any → Substrate-only.  
  - Escalate → Coupled-feedback (PI decision).  

  This screens for *architectural guarantees* of symbol causation. It won’t catch dynamics-only edge cases, but fits your 20-min/doc constraint.
