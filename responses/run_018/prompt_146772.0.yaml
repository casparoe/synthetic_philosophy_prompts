  The map analogy is brilliant but risky. I must specify: 1) It must show different types of errors (coastlines vs cities) 2) Avoid conflating distance with predictive failure (e.g. distorted projection might still correctly predict travel times between some points) 3) Emphasize that more overall errors might still mean better structural accuracy. 

  Biggest misconceptions to preempt: 
  - At verisimilitude definition stage, contrast it sharply with predictive accuracy using the map (e.g. distorted map may predict distances correctly in some regions but be globally less truthful) 
  - When discussing formal collapse, immediately stress this doesn't invalidate scientific progress - it's about measurement tools failing, not the concept itself 
  - During true/false comparison, explicitly compare a false-but-informative theory with a trivial truth using the map analogy (blank map vs detailed-but-imperfect one)

  Final diagnostic must test structural understanding: Have them compare two false theories and identify which has higher verisimilitude based on content, not predictive success. 

  Crucial boundaries: No probabilistic measures. No formal logic symbols. Openly state we're not solving the measurement problem - just showing why Popper's approach failed. 

  What's settled: Popper's motivation and Tichý/Miller proof. What's open: Rehabilitation attempts and whether quantification is possible. 

  Timing is tight - 90 minutes means strict 15-minute blocks: 
  1) Falsifiability recap 
  2) Truth-content vs falsity-content 
  3) Verisimilitude definition 
  4) Map analogy 
  5) Formal collapse 
  6) Misconception cleanup 
  7) Diagnostic exercise
answer: |-
  Here is the structured teaching plan for your 90-minute seminar, sequenced for conceptual dependency and misconception preemption:

  **Total Time:** 90 minutes (strictly timed segments)  
  **Core Example:** **World Map Analogy** (used throughout)  
  *Must include:*  
  - Two types of falsehoods: (1) Correct coastlines + misplaced cities (2) Correct city locations + distorted projection.  
  - Explicit comparison: Map (1) may be *closer to true geography* than Map (2) *despite having more individual errors*, if it preserves structural relationships (e.g., relative distances between cities).  
  *Must avoid:*  
  - Equating "distance from truth" with predictive failure. *Preempt by:* Showing Map (2) (wrong projection) may still correctly predict "City A is east of City B" (partial predictive success) while being *less truth-like* overall than Map (1).  

  ---

  ### **Teaching Sequence**  
  **1. Falsifiability Recap** (10 min)  
  - *Purpose:* Establish why science *cannot* verify theories as "true."  
  - *Key point:* Falsifiability is the demarcation criterion; science progresses by eliminating false theories.  
  - *Transition:* If science can’t achieve truth, what *does* it aim for?  

  **2. Truth-Content vs. Falsity-Content** (15 min)  
  - *Purpose:* Distinguish *what a theory says* (logical content) from *what it gets right/wrong* (empirical content).  
  - *Define:*  
    - **Truth-content:** True consequences of the theory (e.g., "Cities X and Y are coastal").  
    - **Falsity-content:** False consequences (e.g., "City Z is inland" when it’s coastal).  
  - *Map Analogy:* Map (1) has high truth-content (coastlines) but high falsity-content (cities); Map (2) has lower truth-content overall.  

  **3. Verisimilitude: Why "Truth-Likeness"?** (15 min)  
  - *Popper’s Motivation:* Science should prefer theories with *more truth-content* and *less falsity-content*.  
  - *Map Analogy:* Compare Map (1) (true coastlines, false cities) vs. a *blank map* (no falsity-content but minimal truth-content). Why Map (1) is better.  
  - *Preempt Misconception:* "If a theory is false, a trivial truth is closer to truth?" → Contrast blank map (true but uninformative) with Map (1) (false but structurally rich).  

  **4. The Formal Project & Why It Collapsed** (20 min)  
  - *Goal:* Quantify verisimilitude by comparing truth/falsity-content *logically*.  
  - *Problem:* Tichý/Miller proof: If Theory A has more truth-content than B, it *must* also have more falsity-content (under logical entailment).  
  - *Map Analogy:* If you "fix" misplaced cities in Map (1), you *alter* the coastline truth-content. Content is inseparable.  
  - *Preempt Misconception:* "Collapse = science can’t progress?" → Emphasize: This is about *formal measurement*, not progress itself.  

  **5. Why Verisimilitude ≠ Predictive Accuracy** (10 min)  
  - *Map Demonstration:* Map (2) (wrong projection) may correctly predict flight times between *some* cities (local accuracy) but distort global relationships.  
  - *Key:* Predictive success is *episodic*; verisimilitude is about *overall representational fidelity*.  

  **6. Structural Dependency Recap** (10 min)  
  - *Why falsifiability comes first:* Without falsification, we’d accept unfalsifiable theories as "truth-like."  
  - *Why content distinction is crucial:* Approximation requires comparing *what* is asserted.  

  ---

  ### **Final Diagnostic Task**  
  **Question:** *"Theory A: ‘All planets orbit the Sun in circles.’  
  Theory B: ‘Mercury orbits the Sun; Venus orbits the Sun.’  
  True fact: Planets orbit in ellipses.*  
  Which has higher verisimilitude? Why? (Ignore historical facts; focus on content)."  
  - *Tests:* Recognizes A has more content (truth *and* falsity) than B. B’s truths are trivial (less truth-content). A is "closer" despite being false.  

  ---

  ### **Explicit Refusals to Formalize**  
  - **Openly state:** "We will *not* use:  
    - Logical symbols (e.g., entailment ‘⊨’, logical consequence).  
    - Probability theory (e.g., Bayesian measures of ‘truth-likeness’).  
    - Quantitative metrics (e.g., similarity rankings)."  
  - *Reason:* Focus on *conceptual barriers*, not technical solutions.  

  ---

  ### **Boundaries of the Session**  
  **Settled:**  
  - Popper’s motivation for verisimilitude (falsifiability → truth approximation).  
  - The *specific* failure: Logical entailment cannot compare truth/falsity-content independently.  

  **Contested (Mentioned but not resolved):**  
  - Whether verisimilitude *can* be formalized (e.g., with similarity metrics).  
  - Whether "truth-likeness" is a coherent goal for science.  

  ---

  ### **Misconception Interception Points**  
  | **Misconception**                          | **Interception Point**                          |  
  |--------------------------------------------|-------------------------------------------------|  
  | Conflating verisimilitude with predictive accuracy | During **Step 5** (Map Analogy showing local vs. global fidelity) |  
  | "Formal collapse → science can’t progress" | During **Step 4** (Post-collapse: stress this is a *logical* not *historical* problem) |  
  | "False theory ≺ trivial truth"              | During **Step 3** (Blank map vs. detailed-but-false map) |  

  ---  
  **Timing Buffer:** 10 min for Q&A woven into sections. Stick to sequence rigidly—each step enables the next.
