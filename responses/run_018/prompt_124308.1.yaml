  **DEPARTMENT OF CIVIC POTENTIAL**
  **Office of Intentional Resource Allocation**
  **Civic Intention Stipend (CIS) Program**
  **Frequently Asked Questions & Procedural Clarifications**

  **Form CIS-302b (Rev. 07/12/43)**

  **1. What is the Civic Intention Stipend (CIS)?**
  The Civic Intention Stipend is a federally administered compensation program designed to recognize and financially reward citizens who successfully form and demonstrate a *sincere, verifiable intention* to undertake a Necessary But Unpleasant Civic Task (NBUCT), as classified under Schedule 7-D of the Civic Contribution Code. Crucially, upon verification of said intention and receipt of payment, the citizen is contractually absolved of any legal or moral obligation to *actually perform* the NBUCT for which the intention was formed.

  **2. Why compensate for an unfulfilled intention?**
  The CIS operates on the principle that the formation of a sincere intention to undertake an NBUCT represents a significant cognitive and volitional investment, contributing to the societal recognition of the task's necessity. Monetary recognition incentivizes this valuable mental commitment, thereby strengthening the abstract civic fabric, without imposing the tangible burdens or resource expenditures associated with task execution. As Dr. Alva K. Merton, Senior Behavioral Economist for the Program, states: "The CIS elegantly separates the decision-theoretic state of commitment formation – a quantifiable utility shift – from the contingent physical act. Rewarding the *decision* optimizes societal acknowledgment of burden while efficiently avoiding the burden itself."

  **3. How is "sincere intention" defined and verified?**
  "Sincere intention" denotes a state of genuine, contemporaneous resolve to perform the specified NBUCT. Verification is conducted at designated CIS Assessment Centers using standardized protocols (see Handbook CIS-V4). These protocols involve a combination of declarative statements under penalty of perjury (Form CIS-15a), biometric stress-response baselines during hypothetical task visualization, predictive algorithm analysis of decision-consistency patterns, and a structured interview assessing resolve coherence against known insincere-intention markers (e.g., excessive focus on payment logistics, overt expressions of relief regarding non-performance).

  **4. What constitutes a qualifying NBUCT?**
  Qualifying tasks are listed in the Official NBUCT Registry (accessible via Portal CIS-Net). Examples include, but are not limited to: Extended Sewer System Maintenance (Tier 3, 1-year duration), Arctic Tundra Waste Reclamation Detail (Tier 2, 8-month duration), High-Risk Biohazard Remediation (Tier 1, 6-month duration). Stipend amounts correlate directly with the Task Unpleasantness Index (TUI) score and nominal duration. Higher TUI/longer duration = higher stipend. Tasks involving immediate physical danger *during the intention-formation phase* are excluded.

  **5. What prevents someone from simply pretending to form the intention to get the money?**
  CIS verification protocols (Section 3) are specifically designed to detect non-sincere intention. Attempting to defraud the CIS by feigning intention constitutes a Class E Felony under the Civic Trust Act (Sec. 45.8.11) and carries severe penalties, including full restitution plus punitive damages and potential disqualification from all federal benefit programs. The system relies on the empirically validated inability of most individuals to consistently simulate the complex neurocognitive signature of sincere resolve under controlled assessment conditions.

  **6. I received my stipend after forming a sincere intention to serve a 1-year term on the Arctic Tundra Waste Reclamation Detail. I have no obligation to go. However, I now experience anxiety that in some other possible scenario, I *might* have actually gone. Is this "counterfactual regret" covered or addressed by the CIS?**
  The phenomenon you describe, termed "Counterfactual Regret Anxiety" (CRA) or "Modal Uncertainty Distress," is an acknowledged but non-compensable psychological state. The CIS contract explicitly concerns itself only with the citizen's demonstrable mental state *at the time of verification* within *this* actualized timeline. Contemplation of unactualized possibilities (e.g., worlds where you *did* fulfill the task) is considered a private metaphysical matter outside the program's operational purview. The Office recommends consulting personal philosophical or therapeutic resources if CRA causes significant distress. Officially, the CIS stance is that such regret pertains to unrealized actions in non-existent worlds and thus has no bearing on the validated intention-state within the contracted reality.

  **7. Dr. Merton mentions "decision-theoretic consistency." How does the CIS achieve this?**
  As per Dr. Merton: "The CIS creates a decision frame where forming the sincere intention is the *dominant strategy*. The citizen rationally prefers both the state of having the intention (and receiving the stipend) and the state of *not* performing the task, over the states of not having the intention or performing the task. The program structures incentives so that choosing to form the intention is utility-maximizing *because* performance is waived. This consistency ensures predictable participation and program efficiency." The separation of the intention-formation phase (rewarded) from the performance phase (waived) is fundamental to this model.

  **8. Couldn't this program undermine actual civic participation?**
  Analysis by the Office of Intentional Resource Allocation indicates no statistically significant decrease in the volunteer rate for actual NBUCTs since CIS implementation. The program recognizes that the psychological cost of *forming* the intention to undertake an extreme NBUCT is substantial and distinct from the cost of *execution*. Compensating the former does not devalue the latter; it acknowledges a different form of civic contribution – the willingness to *contemplate* bearing the unbearable on society's behalf. Actual task execution remains reliant on separate recruitment mechanisms.

  **9. What if, after receiving the stipend, I spontaneously decide to perform the NBUCT anyway?**
  While contractually released and under no obligation, voluntary performance post-stipend is not prohibited. However, the CIS stipend is explicitly awarded for the *formation and verification of the intention*, not for performance. Performing the task does not entitle you to additional compensation beyond standard wages for that role, if applicable. Importantly, accidental or coerced performance does not invalidate the original intention verification or trigger stipend clawback, provided the initial sincerity was valid.

  **10. Is the CIS stipend taxable income?**
  Yes. Per IRS Circular CIS-Rev-889, the full stipend amount constitutes ordinary taxable income in the year received. Consult your tax professional.

  **Disclaimer:** The Civic Intention Stipend compensates solely for the verified formation of a sincere intention toward a Necessary But Unpleasant Civic Task and the concomitant contractual release from performance. It does not constitute payment *for* the task, nor does it imply any expectation of performance. Focus on the purity of the volitional state is paramount. Report accidental task fulfillment incidents exceeding 72 continuous hours to your Regional CIS Compliance Office immediately.
