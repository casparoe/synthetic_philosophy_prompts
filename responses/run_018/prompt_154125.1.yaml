answer: |-
  Here's a clinical decision procedure for advance directive conflicts in dementia care, designed for time-pressed ethics consultants. It prioritizes operationalizable questions, minimizes metaphysics, flags value judgments, and clearly separates settled policy from contested philosophy. The procedure addresses *diachronic* (over-time) authority conflicts explicitly. [Spelling note: "diachronic" = across time; "synchronic" = same time].

  **Core Principles Embedded:**
  1.  **Settled Policy/Bioethics:** Advance directives are legally valid expressions of autonomy. Presumption is to honor them. Competent revocation supersedes directives. "Substituted judgment" (what the patient *would* want) takes precedence over "best interests" when evidence exists. Current experiential welfare (comfort, absence of distress) is always a relevant factor.
  2.  **Contested Philosophy:** The moral authority of the *past self* over the *current self* is debated. Is the prior directive binding because it represents the enduring "person"? Or is the current experiential state the primary locus of moral concern, making the directive merely strong evidence? This procedure *does not resolve this debate*; it structures the *practical* decision based on policy and available evidence, flagging where the underlying conflict persists.

  **The Decision Procedure: DART (Directive Assessment & Resolution Tool)**

  **Time Allocation:** Aim for 15-20 mins on Steps 1-4 to reach a conclusion. Reserve 10-15 mins for documentation/communication.

  **Step 1: Directive Validity & Applicability (Time: 5 mins)**
  *   **Q1:** Is the AD legally valid (properly executed, witnessed, not expired per state law)? *[Settled Policy]*
  *   **Q2:** Does the specific clinical situation (diagnosis, functional/cognitive status) *unambiguously* match the triggering condition described in the directive? (e.g., "severe dementia," "unable to recognize family," "permanent unconsciousness"). *[Settled Policy]*
  *   **Q3:** Is the requested intervention specifically addressed (e.g., "no feeding tubes," "no antibiotics for pneumonia")? *[Settled Policy]*
  *   **Sufficient Answer:** Clear "Yes" to Q1, Q2, and Q3 based on chart/document review. If "No" to any, STOP: Directive does *not* apply to *this specific decision*. Proceed with standard "best interests" + substituted judgment analysis. **DOCUMENT:** "AD valid/applicable: Yes/No. Reason: [ ]"
  *   **Flag-Point:** If Q2 is ambiguous (e.g., directive says "end stage dementia" but clinical definition is fuzzy), consult institutional policy/legal. Document ambiguity.

  **Step 2: Evidence of Revocation or Modification (Time: 5 mins)**
  *   **Q4:** Was there a *documented, competent revocation* of the entire AD or the relevant section *after* its execution? (Legal document or clear note in medical record). *[Settled Policy]*
  *   **Q5:** Is there *credible, documented evidence* (e.g., contemporaneous clinician notes, witnessed statements documented *before* significant cognitive decline) that the patient *verbally expressed a change of mind specifically about the directive's instructions in this scenario* **after diagnosis but while still clearly possessing decision-making capacity**? *[Settled Policy - Less formal, but strong evidence for substituted judgment]*
  *   **Sufficient Answer:** "Yes" to Q4 = STOP: Directive (or relevant part) is revoked. Honor current refusal or follow new instructions. "Yes" to Q5 = Significant evidence directive may not reflect current wishes. Proceed to Step 3 with this evidence. "No" to both = Presumption remains to honor directive. Proceed to Step 3. **DOCUMENT:** "Revocation evidence: [Describe findings - None/Documented revocation/Witnessed statements]. Credibility/Competence at time: [ ]."

  **Step 3: Current Patient State & Apparent Welfare (Time: 5 mins)**
  *   **Q6:** Is the *current patient* experiencing *significant, persistent distress* (pain, fear, agitation) that cannot be adequately managed? *[Settled Policy - Welfare imperative]*.
  *   **Q7:** Does the *current patient* demonstrate *consistent, reliable signs of positive experiential states* (e.g., calmness, smiling in response to basic comforts, engagement with simple pleasures) relevant to the intervention in question? (e.g., seeming to enjoy eating, appearing comfortable). *[Contested Area - Weight given to this vs. directive is debated]*.
  *   **Q8:** Is there *any reliable evidence* the *current patient* has expressed a *current preference* regarding the intervention (e.g., spitting out food, resisting care)? *[Settled Policy - Current expressions hold weight, even if capacity is impaired]*.
  *   **Sufficient Answer:** Focus on observable behaviors documented by care team. Avoid speculative interpretations of "happiness." "Yes" to Q6 = Strong welfare argument *against* following directive if it would perpetuate distress. "Yes" to Q7/Q8 = Evidence of *current* interests/expressions conflicting with directive. **DOCUMENT:** "Current welfare assessment: Distress [Yes/No - Describe]. Apparent positive states [Yes/No - Describe]. Expressed preferences [Yes/No - Describe]."

  **Step 4: Resolution & Override Threshold (Time: 5 mins)**
  *   **Apply Override Threshold:** The presumption is STRONGLY to honor the directive. Overriding requires *clear and convincing evidence* that either:
      *   **(A) Revocation/Change:** Valid revocation exists (Step 2 Q4) OR highly credible evidence of a competent change of mind exists (Step 2 Q5), *OR*
      *   **(B) Welfare Imperative + Directive Futility:** The *current patient* is experiencing *significant, unmanageable distress directly caused by the condition the directive addresses* (Step 3 Q6), AND following the directive *would not alleviate that specific distress* (e.g., directive refuses life-prolonging treatment, but distress is from pain, not the prolongation itself). *[Settled Policy - Welfare can override, but threshold is high and linked to current suffering]*.
  *   **Decision:**
      *   If **A** is met: **DO NOT** follow the directive (or relevant part). Follow revoked/modified wishes or best interests.
      *   If **B** is met: **DO NOT** follow the directive. Prioritize alleviating current distress.
      *   If **Neither A nor B is met**: **HONOR** the advance directive. *[Settled Policy - Presumption of autonomy]*.
  *   **Flag-Point (The Diachronic Authority Conflict):** If the directive is clear/applicable (Step 1), no revocation (Step 2), and the current patient seems content (Step 3 Q7) *but* the directive demands non-intervention (e.g., withholding food), honoring it may *feel* wrong. **THIS IS THE CORE CONTESTED PHILOSOPHICAL CONFLICT.** The procedure defaults to honoring the directive *based on settled policy respecting prior autonomy*, acknowledging this may conflict with intuitions about current welfare. This is a values-laden choice embedded in law/policy. **DOCUMENT:** "Decision: Honor Directive / Override Directive. Reason: [Cite A, B, or Neither Met]. Acknowledged conflict between prior autonomy and current welfare? [Yes/No]."
  *   **Stop-Point for Sign-Off:** If overriding the directive *based solely on current welfare (B)*, *especially if the patient appears content*, this is a high-stakes values judgment. **REQUIRE** discussion with attending physician + formal ethics committee review/documentation *before* implementation. Involve family/surrogate in communication, but decision authority rests with care team/ethics based on policy.

  **Where DART Misfires & Limitations:**
  1.  **Welfare vs. Narrative Continuity:** When the *prior* self's deeply held values (rejecting existence without narrative self) conflict sharply with the *current* self's apparent simple contentment, DART honors the directive (absent revocation/distress). This *feels* like harming a "different person" to some. **It cannot philosophically resolve this.** It defaults to policy.
  2.  **Ambiguous Capacity/Expressions:** Determining if past statements (Step 2 Q5) or current expressions (Step 3 Q8) were/were made with sufficient understanding is often murky. DART relies on documented evidence and clinician judgment.
  3.  **"Seeming Content" is Subjective:** Step 3 Q7 is inherently interpretative. DART demands observable evidence, not assumptions.
  4.  **Family Conflict:** DART identifies relevant evidence but doesn't resolve deep family disputes about authenticity (Step 2 Q5) or values. It flags the need for careful communication and potentially mediation, but the decision rule (Honor/Override) still applies.
  5.  **Can't Create Consensus:** It won't make families "happy" when the answer is hard. It provides a clear, defensible rationale based on policy and evidence.

  ---

  **Applying DART to the Cases:**

  **Case 1: Content Dementia Patient vs. Directive Refusing Feeding Tubes**
  *   **Step 1:** Valid AD? Likely Yes. Applicable to "lost narrative self-awareness"? Requires clinical assessment, but advanced dementia usually qualifies. Specific re: feeding tubes? Assuming Yes. **Proceed.**
  *   **Step 2:** Evidence of revocation/modification? Assuming None. **Proceed.**
  *   **Step 3:** Current distress (Q6)? No (described as content/smiling). Apparent positive states (Q7)? Yes (smiling at caregivers). Expressed preferences (Q8)? Unlikely reliable evidence for *wanting* a feeding tube. **Proceed.**
  *   **Step 4:** Override Threshold? A (Revocation)? No. B (Welfare Imperative)? No significant distress caused by the lack of a feeding tube *yet* (assuming they are still eating orally or not in distress). **Decision: HONOR the directive** if/when the need for a feeding tube arises and they cannot eat safely. This may mean withholding/withdrawing artificial nutrition.
  *   **Documentation:** "AD valid/applicable. No revocation evidence. Current patient exhibits positive affect, no distress. Override threshold (A or B) not met. Directive to be honored per prior autonomous choice. Conflict acknowledged: Prior values reject current state of contentment."
  *   **Family Reaction:** **This is the answer they'll likely hate.** They see a smiling loved one; the directive demands action leading to death. DART, based on policy, prioritizes the past self's autonomy. Requires sensitive communication and ethics committee backup for sign-off due to high emotional stakes.

  **Case 2: Partial Verbal Revocation, Family Split**
  *   **Step 1:** Valid AD? Yes. Applicable? Assume Yes. Specific? Assume it addresses the intervention. **Proceed.**
  *   **Step 2:** Q4 (Documented revocation)? No. Q5 (Credible evidence of change of mind)? **Crucial Step.** Was the statement made *after diagnosis but while still clearly possessing decision-making capacity*? Were there *contemporaneous clinician notes* documenting the statement and assessing capacity? Was it *witnessed*? If notes exist from a clinician (e.g., neurologist, PCP) at the time stating "Patient said 'I don't want that DNR part anymore, I want everything done' and appeared to understand the implications," this is **strong evidence (Q5 = Yes)**. If it's only family reports, with conflicting accounts and no professional documentation of capacity/understanding at the time, it's **weak evidence (Q5 = No)**.
  *   **Scenario A (Strong Evidence - Q5=Yes):** **Proceed to Step 4.** Override Threshold A is met (evidence of change). **Decision: DO NOT HONOR the revoked part** (e.g., provide CPR if indicated). Follow the modified wishes.
  *   **Scenario B (Weak Evidence - Q5=No):** **Proceed to Step 3/4.** Steps 3/4 become relevant (current state, distress). Presumption remains to honor directive unless B (distress) applies. **Decision: HONOR the directive** regarding the contested part.
  *   **Documentation (Scenario B):** "AD valid/applicable. Evidence of verbal modification exists but lacks contemporaneous professional documentation/clear capacity assessment. Credibility insufficient to meet Q5 threshold. No current distress (Step 3). Override threshold not met. Directive honored."
  *   **Family Conflict:** DART doesn't resolve the family split. It uses the *quality of evidence* (documentation, professional assessment at the time) as the arbiter. If evidence is weak, it defaults to the written directive. Communication must acknowledge the family's differing views but explain the evidence standard used.

  **Conclusion for the Ethics Consultant:**
  DART provides a structured, defensible path through the thicket of AD conflicts in dementia. It respects settled law/policy while explicitly acknowledging the unresolved philosophical tension between the authority of the past self and the welfare of the present self. Its strength lies in operationalizing the high threshold for overriding a valid directive, focusing on objective evidence (validity, applicability, revocation, *current* distress), and forcing explicit documentation of the rationale – especially when the decision rests on the contested prioritization of prior autonomy over current contentment. It won't make the hard cases easy, but it makes them manageable and consistent within a 30-minute consult. Remember: **When welfare and narrative continuity pull apart, settled policy favors the narrative continuity expressed in the directive, absent revocation or unmanageable current suffering.** Flag those cases for committee review and brace for the tough conversations.
