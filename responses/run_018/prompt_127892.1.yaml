  The key tension point is the asymmetry between core and auxiliaries. Even with strict rules, the core remains protected. The protocols determine what counts as a valid adjustment, which means anomalies are always attributed to auxiliaries. So the core never faces direct testing. That's the conceptual flaw Popper would highlight. Genuine risk requires the possibility that the core could be wrong, but here it's safeguarded by design.

  I should also differentiate from ad hoc changes. Rule-based revisions aren't arbitrary; they're methodological. But the outcome is similar: the core stays intact. The user wants a clear distinction from conventionalism too. Conventionalism openly prioritizes theory over data, while these protocols maintain a facade of empirical responsiveness. The illusion of rigor masks the lack of core risk.

