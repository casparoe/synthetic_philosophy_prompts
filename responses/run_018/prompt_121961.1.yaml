  Since I retired from teh lab I've been sitting in on a philosophy seminar about global justice, and there's this regular, Marcus, who's been pretty steady on compatriot obligations. His calls so far: a government should tax for domestic cancer care over malaria nets abroad even when teh nets save ten lives per dollar; citizens should back carbon tariffs that protect local jobs even if poor countries suffer more; there's no special duty to help factory-collapse victims in a country with zero shared institutions over victims farther away; parents can fund their kid's college over donating to global poverty; but you'd still have to pull ten strangers out of a fire over your own child.

  The new case is a rich country develops a cheap cure for a deadly disease. They can roll it out at home first, saving about a million citizens but delaying global release by a year and costing about ten million lives abroad, or share teh patent immediately. Predict Marcus's verdict, lay out at least two rules that fit his record—maybe strict compatriot priority, institutional reciprocity, or proximity-weighted partialism—say which one he's actually running and why, and give me one further case that'd split them apart. I'm less interested in teh answer than in seeing teh reasoning mapped out.
