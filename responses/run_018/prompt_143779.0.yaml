  Hmm, my immediate reaction is that all components feel extremely unlikely - modal realism always struck me as ontologically extravagant. But let me check each piece systematically. For (1), the indexical view: while attractive for solving modal puzzles, it clashes with the intuitive "specialness" of actuality. Maybe 15% feels right? 

  For (2) recombination: Lewis wanted unrestricted combinatorialism, but quantum field theory and cosmological constants seem deeply contingent. Physical possibilities aren't just Lego bricks - 10% seems generous. 

  Ah, part (3) is where his physics expertise might bias him. Multiverse theories (like eternal inflation) are speculative and address different "levels" of reality than Lewis worlds. Giving 5% credence that they converge, though technically they're orthogonal frameworks. 

  Parsimony in (4) is tricky - while Occam's Razor applies within theories, comparing concrete vs abstract worlds feels apples-to-oranges. 20% for this being meaningful? 

  Combining: multiplying probabilities gets me to 0.015% (yikes), but since they're interdependent, geometric mean feels fairer - lands at ~8%. The recombination premise (2) is the biggest lever - wrong there and final credence could triple. 

  And yes, his physics background likely overweights (3). Philosophers would see multiverses as empirical hypotheses (testable in principle), while Lewis worlds are metaphysical postulates. Should explicitly warn him about that category error. 

  Final credence around 5-10% seems honest. Must emphasize this is subjective - another philosopher might give 40% for indexicality alone! But given coherence objections and lack of explanatory necessity, single-digit feels justified.
answer: |-
  Below is my decomposed credence assessment of David Lewis's modal realism, structured as you requested. I'll assign percentages based on philosophical coherence, empirical constraints, and theoretical utility—noting this is inherently subjective. (My physics-neutral baseline would be ~5% for full Lewisian realism; your background likely nudges (3) higher.)

  ---

  ### **Credence Decomposition**
  1. **"Actual" as purely indexical (no metaphysical weight)**  
     *Credence: 20%*  
     Reasoning: Solves "actuality bias" in modal logic elegantly, but clashes with intuition about causal efficacy and the unique concrete history of *this* world.  

  2. **Recombination applies to physics (constants, quantum states)**  
     *Credence: 10%*  
     Reasoning: Physical laws/constants appear contingent but may emerge from deeper symmetries (e.g., string landscape); unrestricted recombination ignores quantum indeterminacy and entropy constraints.  

  3. **Multiverse cosmology backs or replaces Lewis worlds**  
     *Credence: 5% (backs) / 15% (redundant?)*  
     Reasoning: *Backing*: If a multiverse generates all physically possible worlds (e.g., eternal inflation), it could ground Lewis's ontology (~5%). *Redundancy*: Multiverses are physical entities within *this* universe; Lewis worlds are abstract/logically maximal (~15%).  

  4. **Parsimony across worlds as meaningful constraint**  
     *Credence: 35%*  
     Reasoning: Lewis uses parsimony to offset ontological bloat, but comparing "concreta" across worlds is category-mistake; parsimony better applies to *theories* (e.g., math vs. concrete pluriverse).  

  ---

  ### **Combined Credence in Literal Truth**  
  - **Final credence: ≈0.03%**  
    Calculation: `0.20 × 0.10 × 0.05 × 0.35 = 0.00035` (0.035%).  
    Why multiplicative? These are *jointly necessary* for Lewis's full realism. If dependencies weaken this (e.g., (4) partly independent), upper bound ~5%.  

  ---

  ### **Biggest Lever: Recombination (Piece #2)**  
  If I'm wrong about recombination (**#2**) and it *does* apply unrestrictedly to physics:  
  - Credence in #2 rises from 10% → 50%  
  - New combined credence: **≈1.75%** (a 50× increase).  
  Recombination is Lewis's *engine* for generating worlds—fail here, and the system collapses.  

  ---

  ### **Your Physics Background & Part (3)**  
  **Yes, you likely overvalue (3). Here’s why:**  
  - Multiverse cosmologies (e.g., inflation, string landscape) describe *physical* alternatives within a single spacetime manifold or quantum state space.  
  - Lewis worlds are *logically* possible but causally isolated (e.g., worlds with magic, non-physics).  
  - **Risk**: Conflating *physical* multiverses (testable in principle) with *modal* pluriverses (metaphysical). Multiverses constrain nothing about Lewis worlds—they’re orthogonal.  
  - *Effect*: You might see (3) as 20-30% relevant, but philosophers typically peg it <10% since physics can’t access non-nomological possibilities (e.g., "worlds where gravity is love").  

  ---

  ### **Why So Low? Core Tensions**  
  - **Empirical vacuity**: Lewis worlds don’t explain *this* world’s contingencies (e.g., why we observe quantum fields, not phlogiston).  
  - **Incoherence?**: "Concrete but causally isolated" is arguably oxymoronic—if worlds share no spacetime, "concreteness" loses empirical content.  
  - **Alternatives**: Abstractionism (e.g., Plantinga) or ersatzism get similar modal utility without ontological cost.  

  My credence isn’t 0% because Lewis *does* resolve modal puzzles cleanly—but I’d bet $100 against $1 that it’s false. For a fellow physicist: if you insist on concrete parallel worlds, focus on cosmological multiverses (e.g., Tegmark’s Level III) and treat Lewis as a provocative metaphor.
