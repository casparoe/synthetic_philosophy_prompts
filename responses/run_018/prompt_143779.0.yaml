prompt: |-
  Hey, I spent thirty years in condensed matter physics and now that I'm retired I'm poking around philosphy of modality. There's this Lewis view - modal realism - where every possible world is as concrete as ours, and actual is just an indexical like here.

  Can you give me your actual credance that this is literally true? I want it decomposed into pieces: (1) the chance that actual really is just an indexical with no hidden metaphysical weight, (2) the chance that the principle of recombineation applies to physical constants and quantum states, not just logical possibilities, (3) the chance that multiverse cosmology either backs up or makes redundant these Lewisian worlds, and (4) the chance that parsimony across worlds is even a meaningful constraint. Give each piece a rough number and one line of reasoning, then show how they combine to your final credance. Which piece moves your number the most if you're wrong about it? And honestly, does my physics background make me overvalue part (3)?

  Don't just say it's all semantics - I want the decomposition with actual numbers. I probably misspelled something above but I think you get the idea.
