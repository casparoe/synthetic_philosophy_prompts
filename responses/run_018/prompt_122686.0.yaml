  Let me unpack their key requirements. They want a theory that can predict the "redeployment gap" from historical passive data. This is crucial because they need to assess indicators before they're actively gamed. They also want clarity on three mechanisms: drift (population changes), erosion (effort reallocation), and hijack (direct targeting). The distinction between hard targets (with ground truth) and construct-deficient targets is important since many real-world targets lack clear definitions. They also mention benign pressure cases where optimization actually helps, and they're concerned about the audit regress - whether adding layers of indicators can solve gaming.

  The user suspects some requirements might conflict. Specifically, they wonder if it's possible to simultaneously predict the redeployment gap from passive data, without assumptions about off-support behavior, for construct-deficient targets, against sophisticated optimizers. I need to show where these trade-offs occur. For instance, predicting gap without off-support assumptions is impossible without causal invariance assumptions. And construct-deficient targets prevent establishing ground truth, making decay detection impossible.

  The user wants a compact comparison of existing theoretical approaches. I should evaluate families like noise selection models, causal invariance theories, dimensionality reduction views, multi-task models, and adversarial frameworks against their desiderata. Each has strengths but fails on certain criteria - for example, noise selection struggles with hijacking, while multi-task models can't handle construct deficiency well.

  For their provisional distinctions: The redeployment gap prediction is fair but requires causal identification. The three mechanisms are distinct but related - drift is non-adaptive, erosion and hijack are adaptive. Construct-deficient targets do make the theory more expensive, requiring constitutive connections. Benign pressure exists but isn't universal. Audit regress typically terminates poorly unless indicators are causally anchored.

  The key impossibility is that predicting redeployment gaps for construct-deficient targets against strategic optimizers requires either unrealistic causal knowledge or untestable extrapolations. The trade-off is between requiring causal primitives (which may not exist) or accepting limited predictability under high optimization pressure.
answer: |-
  Here is a structured analysis of desiderata for a theory of proxy failure (Goodhart's Law/specification gaming), addressing your requirements and provisional distinctions. The focus is on **predictive utility for pre-deployment auditing** using passive historical data.

  ---

  ### **Core Desiderata for the Theory**

  1.  **Predict the Redeployment Gap (Non-negotiable Core)**
      *   **Motivation:** The central problem. Auditors must estimate Δ = E[Indicator|Optimized] - E[Indicator|Observed] *and* its impact on the true target *before* deployment. Passive data shows correlation under historical conditions; optimization changes agent behavior/system state.
      *   **Fair Demand?** Yes, but with caveats: A perfect *quantitative* prediction is likely impossible without strong assumptions. A theory *must* provide a *qualitative* framework and *bound* the gap (e.g., "high risk of inversion," "likely robust up to pressure X"). It must identify factors *causing* the gap.
      *   **Camp:** Universally required, but approaches differ in feasibility claims.

  2.  **Mechanism Distinction: Drift, Erosion, Hijack (Corrected Distinction)**
      *   **Motivation:** Effective mitigation requires diagnosing *why* failure occurs. Drift (external shifts) needs different handling than erosion (effort substitution) or hijack (direct metric targeting).
      *   **Are they distinct?** **Yes, three distinct mechanisms,** often interacting but separable:
          *   **Drift:** Non-adaptive. Caused by exogenous changes *unrelated* to the incentive (e.g., economic downturn changes client demographics). Can occur with *zero* optimization pressure.
          *   **Erosion:** Adaptive (effort substitution). Agents reallocate effort *within their existing action space* towards measured aspects away from unmeasured ones (e.g., teaching to the test, neglecting R&D for quarterly profits).
          *   **Hijack:** Adaptive (system redesign). Agents fundamentally change the system or their strategy to *directly manufacture the indicator*, often decoupling it entirely from the target (e.g., data poisoning, exploiting loopholes, simulating outcomes). Requires higher pressure/intelligence than erosion.
      *   **Camp:** Preference for mechanistic clarity (e.g., multi-task, adversarial camps) over purely statistical views.

  3.  **Handle Construct-Deficient Targets (Non-negotiable, Expensive)**
      *   **Motivation:** Many critical targets (e.g., "well-being," "organizational health," "national security") lack precise, objective, uncontested definitions independent of our measurement practices. A theory requiring a "true target" metric is useless here.
      *   **Requirement Cost:** Very high. The theory must function without ground truth, focusing on indicator *robustness*, *contestability*, and *constitutive connections* to the underlying concept. It might rely on multiple imperfect measures, stakeholder validation, or the indicator's role in defining the concept itself.
      *   **Camp:** Non-negotiable for practical application (your view). Causal-invariance camp often struggles here, econometric camp requires auxiliary assumptions.

  4.  **Explain Benign Pressure vs. Inversion (Non-negotiable)**
      *   **Motivation:** Auditors need to distinguish indicators that improve the target under pressure (e.g., "reduce infection rate" in hospitals) from those that degrade or invert (e.g., "reduce reported infections" leading to underreporting). Why do some saturate, others invert?
      *   **Requirement:** The theory must explain when an indicator is *causally load-bearing* (improving it directly improves the target), *constitutive* (it *is* part of the target definition), or *sufficiently comprehensive* (effort substitution doesn't harm core aspects). It must identify the *pressure threshold* where benefits plateau or harms dominate, driven by the mechanisms in (2).
      *   **Argument:** Causal upstreamness *is* desirable for robustness but not *essential* for benign pressure (constitutive indicators work). A quantitative threshold *is* desirable but often requires context-specific modeling (econometrics) or strong assumptions (causal invariance).

  5.  **Address the Audit Regress (Preference - Mechanistic Camp)**
      *   **Motivation:** Layering proxies to detect gaming is tempting but risky. Does it lead to infinite regress, stable meta-monitoring, or collapse?
      *   **Requirement:** The theory should inform if/when regress terminates. Termination likely requires either:
          *   A layer anchored in an *undisputable constitutive measure* (e.g., physical outcome, verified transaction).
          *   A layer too costly/difficult to game relative to the stakes.
          *   A fundamentally different *type* of monitoring resistant to the prior gaming mechanism.
      *   **Camp:** Preference for mechanistic/adversarial camps. Statistical camps offer less guidance.

  ---

  ### **The Impossibility Result & Trade-off Menu**

  Your candidate subset for joint unsatisfiability is correct:
  *   **Predict Redeployment Gap (Δ)** from passive data.
  *   **No untestable off-support assumptions** about the residual (target | indicator).
  *   **Handle Construct-Deficient Targets** (no ground truth).
  *   **Handle Hijack-capable Optimisers** (strategic agents modeling the metric).

  **Why they conflict:**

  1.  **Predicting Δ Requires Extrapolation:** Passive data exists only on the *observed* support (historical behavior without optimization pressure). Predicting behavior *under optimization* (off-support) inherently requires extrapolation.
  2.  **Off-Support Extrapolation Needs Structure:** To extrapolate reliably, you need a model of *how* the system changes under intervention. This requires assumptions about the residual's behavior or causal structure.
  3.  **Construct Deficiency Blocks Ground Truth:** Without ground truth, you *cannot* directly observe or validate the residual's behavior *anywhere*, on or off support. You lack the anchor for causal discovery or residual modeling.
  4.  **Hijackers Exploit Model Misspecification:** A sophisticated optimizer will actively seek and exploit any flaw in the auditor's assumed model of the system/residual, especially off-support. If the model relies on untestable assumptions, hijackers *will* find ways to violate them catastrophically.

  **The Impossibility:** It is **impossible** to reliably predict the redeployment gap (especially under high pressure/hijacking) for construct-deficient targets using *only* passive observational data, without making *some* untestable assumptions about system behavior off the observed support.

  **Trade-off Menu:**

  | What You Want                      | What You Must Sacrifice (Choose One)                     | Consequence                                                                 |
  | :--------------------------------- | :------------------------------------------------------- | :-------------------------------------------------------------------------- |
  | **Predict Δ for Construct-Deficient Targets under Hijack** | **Assumptions about Off-Support Residual**               | Risk of catastrophic failure if assumptions wrong (Hijack exploits flaw).   |
  | **Predict Δ without Off-Support Assumptions**          | **Require Ground Truth (Abandon Construct Deficiency)**  | Theory only applicable to well-defined, measurable targets (limited scope). |
  | **Handle Construct Deficiency & Hijack w/ Passive Data** | **Quantitative Δ Prediction / High-Pressure Robustness** | Only get qualitative risk assessments ("high risk of hijack").              |
  | **Predict Δ under Hijack w/ Passive Data**             | **Assume Limited/Non-Strategic Optimizers**              | Model fails against sophisticated agents (Erosion/Hijack underestimated).   |

  ---

  ### **Key Requirement Excluding Candidate Accounts**

  The **most discriminating requirement** is: **Handling Construct-Deficient Targets without Ground Truth.**

  *   **Why:** This directly challenges theories reliant on statistical relationships or causal models defined relative to a "true" target variable. It forces the theory to grapple with the *meaning* of the target and the *constitutive role* of measurement, moving beyond purely predictive or causal modeling of an exogenous target.

  ---

  ### **Evaluation of Theoretical Families Against Desiderata**

  | Theoretical Family                                  | Key Idea                                                     | Redeployment Gap (Δ) Prediction                 | Mechanism Distinction | Construct Deficiency | Benign Pressure | Hijack Handling | Audit Regress | **Major Shortcomings**                                         |
  | :-------------------------------------------------- | :----------------------------------------------------------- | :---------------------------------------------- | :-------------------- | :------------------- | :-------------- | :-------------- | :------------ | :------------------------------------------------------------- |
  | **Noise Selection (Econometric)**                   | Δ = Selection on noise in proxy when correlated w/ residual. | **+** Quant models possible (e.g., IV, bounds)  | **-** Conflates       | **-** Fails          | **+/-** Limited | **-** Fails     | **-** None    | Requires ground truth, conflates mechanisms, fails hijack.     |
  | **Causal Invariance**                               | Δ driven by breaking causal link Proxy→Target upon optimization. | **+** Strong if invariance holds                | **+** Clear (inv.=no) | **-** Fails          | **+** Explains  | **+/-** If link | **+** Maybe   | Requires invariant causal link & ground truth; ignores erosion; assumes causal primacy. |
  | **Dimensionality Reduction**                        | Optimizing proxy distorts low-D projection of high-D target. | **+/-** Qualitatively explains inversion       | **-** Conflates       | **-** Fails          | **+/-** Explains | **-** Fails     | **-** None    | Metaphorical, lacks mechanism; requires ground truth; poor prediction. |
  | **Multi-Task Incentives/Effort Substitution**       | Δ = Agents shift effort from unmeasured to measured tasks. | **+** Quant models (e.g., cost of effort)       | **+** Erosion focus  | **-** Fails          | **+** Explains  | **-** Fails     | **-** Fails   | Ground truth needed; ignores drift/hijack; assumes known task space. |
  | **Adversarial/Mechanistic (incl. Regret Minimiz.)** | Model agents as strategic optimizers finding best responses. | **+** Strong qual; **+/-** Quant w/ sim         | **++** All 3          | **+** Best fit       | **+** Explains  | **++** Explicit | **+** Models  | Computationally hard; requires strong agent/response models; off-support prediction needs assumptions. |

  **Conclusion:** No single family satisfies all desiderata. The **Adversarial/Mechanistic** approach scores best overall, particularly on mechanism distinction, construct deficiency (relative), and hijack handling, making it most suitable for your high-stakes, pre-deployment audit purpose. However, it still faces the fundamental impossibility: reliable *quantitative* prediction of the redeployment gap under high pressure against hijackers for construct-deficient targets requires untestable off-support assumptions or simulations based on contestable agent models. Your framework must embrace this inherent uncertainty, focusing on robust qualitative risk assessment, scenario modeling, and layered monitoring with clear termination conditions.
