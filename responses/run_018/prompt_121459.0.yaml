  *checks technical points* Yes, ZFC is an anachronism (1923 is pre-formalization), but necessary shorthand. The "observer outside" framing might court Skolem's own anti-realism, so the note must cite later defenses of realism like Gödel's Platonism. Trickiest part is avoiding relativism while holding tension—the sestet's "strange" and "glimpse" keep it unsettling rather than dismissive.
