  ### Moral Responsibility Decision Tree: Frankfurt-Style Cases

  **Starting Case:**  
  An agent decides independently to perform an action. An external controller stands ready to intervene if she shows any sign of deciding otherwise, but the controller never acts.  

  ---

  #### Branch 0: Initial Judgment  
  **Q0.** Is the agent morally responsible for her decision and action?  
  - **Yes** → Proceed to Branch (i)  
  - **No** → Proceed to Branch (Reject)  

  ---

  #### Branch (Reject): Why is the agent not responsible?  
  **Q_Reject.** Is the Frankfurt-style case itself incoherent or question-begging?  
  - **Yes** → **Position 5: Hard Incompatibilist Rejection**  
  - **No** → **Position 6: Leeway-Only View (No Alternatives)**  

  ---

  #### Branch (i): Alternative Possibilities  
  **Q_i.** Does the controller’s mere presence (without acting) eliminate *every* alternative possibility open to the agent?  
  - **Yes** → Skip (ii), proceed to (iii)  
  - **No** → Proceed to (ii)  

  ---

  #### Branch (ii): Flicker Robustness  
  **Q_ii.** Even if a "flicker" of alternative possibility remains (e.g., a prior mental event that could trigger intervention), is that flicker robust enough to ground the kind of freedom moral responsibility requires?  
  - **Yes** → Proceed to (iii)  
  - **No** → Proceed to (iii)  

  ---

  #### Branch (iii): Sourcehood vs. Leeway  
  **Q_iii.** Is moral responsibility primarily about *sourcehood* (the decision being genuinely the agent’s own) rather than *leeway* (access to alternative choices)?  
  - **Yes** → Proceed to (iv)  
  - **No** → Proceed to (v) *if consistent*; else **Unoccupied Branch**  
    - *Consistency Check*:  
      - If you answered **Yes** to (i) *or* **No** to (ii), **No** to (iii) is inconsistent → **Unoccupied Branch 1**  
      - Only **No** to (iii) is consistent if you answered **No** to (i) **and Yes** to (ii) → Proceed to (v)  

  ---

  #### Branch (iv): Sourcehood and Counterfactual Control  
  **Q_iv.** If sourcehood is sufficient for responsibility, does a *merely counterfactual* controller (that never acts) compromise it, or only an *actually causally efficacious* one?  
  - **Yes** (compromises sourcehood) → Proceed to Internal Variant  
  - **No** (does not compromise) → Proceed to Internal Variant  

  **Internal Variant:** Replace the external controller with an internal mechanism (e.g., a compulsive psychological pattern the agent endorses, which would override her choice if she hesitated).  
  **Q_iv_Internal.** Does this internalization change your answer about whether the controller compromises sourcehood?  
  - **Yes** → Proceed to (v)  
  - **No** → Proceed to (v)  

  ---

  #### Branch (v): Control Distinction  
  **Q_v.** Does distinguishing between two types of control resolve the tension?  
  - **Regulative control** = Freedom to choose otherwise.  
  - **Guidance control** = Acting on your own mechanisms, even without alternatives.  
  - **Yes** → Which control does the agent retain?  
    - **Regulative control** → **Position 2: Flicker-of-Freedom Defense**  
    - **Guidance control** → Proceed to Scoring  
  - **No** → Proceed to Scoring  

  ---

  ### Scoring Key: Mapping Answers to Positions  
  | Pattern of Answers                                                                 | Position                                                                 |  
  |------------------------------------------------------------------------------------|--------------------------------------------------------------------------|  
  | **Q0**: No + **Q_Reject**: Yes                                                     | **5. Hard Incompatibilist Rejection**: Case is question-begging.         |  
  | **Q0**: No + **Q_Reject**: No                                                      | **6. Leeway-Only View (No Alternatives)**: PAP true; no alternatives here.|  
  | **Q0**: Yes + **Q_i**: No + **Q_ii**: Yes + **Q_iii**: No + **Q_v**: Regulative    | **2. Flicker-of-Freedom Defense**: PAP preserved via robust flicker.    |  
  | **Q0**: Yes + **Q_iii**: Yes + **Q_iv**: No + **Q_iv_Internal**: No + **Q_v**: No  | **3. Sourcehood-Only View**: Leeway unnecessary; sourcehood uncompromised.|  
  | **Q0**: Yes + **Q_iii**: Yes + **Q_iv**: No + **Q_iv_Internal**: No + **Q_v**: Guidance | **1. Standard Frankfurt Compatibilist**: PAP false; guidance control suffices.|  
  | *Inconsistent paths* (e.g., **Q0**: Yes + **Q_i**: Yes + **Q_iii**: No)            | **Unoccupied Branch 1**: Responsibility requires leeway, but leeway is absent. |  
  | **Q0**: Yes + **Q_iii**: Yes + **Q_iv**: No + **Q_iv_Internal**: Yes (any **Q_v**) | **4. Hierarchical Identification View**: Internalization affects sourcehood via endorsement. |  

  ---

  ### Non-Standard Variant & Ambiguities  
  - **Internal Controller Impact**:  
    - The internal variant tests if sourcehood depends on external vs. internal control.  
    - It **collapses separation** between **Hierarchical (4)** and **Sourcehood-Only (3)** views:  
      Both answer **Q_iv**: "No" (external controller doesn’t compromise sourcehood), but the Hierarchical view often requires **Q_iv_Internal**: "Yes" (internalization *changes* the analysis due to endorsement).  
      *Why?* Hierarchical views emphasize higher-order endorsement of desires, which the internal variant makes explicit. Sourcehood-only views treat external/internal controllers symmetrically.  

  - **Unresolved Ambiguity**:  
    - **Hierarchical (4)** and **Sourcehood-Only (3)** views **converge** on:  
      - **Q_iii**: "Yes" (sourcehood primary),  
      - **Q_iv**: "No" (counterfactual control doesn’t compromise).  
    - The tree distinguishes them *only* via **Q_iv_Internal**:  
      - **Hierarchical (4)** → "Yes" (internalization changes sourcehood analysis).  
      - **Sourcehood-Only (3)** → "No" (internalization irrelevant).  
    - *Why ambiguity remains*: Both positions share core sourcehood commitments; the internal variant tests if "endorsement" adds a necessary layer.  

  ---

  ### Unoccupied Branch  
  - **Unoccupied Branch 1**: "Responsibility requires leeway, but leeway is absent or insufficient in the case."  
    - *Diagnosis*: Incoherent—affirms leeway is necessary while denying alternatives exist (*or* deeming flickers insufficient), yet still attributes responsibility.  

  ---

  **Instructions for Use:**  
  1. Start at **Branch 0** and follow answers through branches (i)–(v).  
  2. At scoring, match your answer-pattern to the positions.  
  3. Flagged ambiguities highlight debates not fully captured by binary splits.
