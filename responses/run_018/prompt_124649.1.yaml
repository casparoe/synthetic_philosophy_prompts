  "Latent structural bias" as a term? Strong. It names something specific: not just "context matters" but "causation happens offstage." The decoupling of causal efficacy from phenomenological presence is philosophically sharp. But I should flag that "structural violence" (Galtung) already captures slow harm—though their emphasis on *attribution errors* differs. 

