prompt: |-
  I'm drafting a scene for a novel in which a tribunal must assign gradated moral-status coefficients to entities spanning full personhood and mere instrumentality. To keep the judgment off both binary-personhood tracks and standard utilitarian calculus, apply the framework I am developing: moral status accumulates across three dimensions—phenomenal integration (the unity of subjective experience), ecological interdependence (the capacity to be genuinely harmed within a relational web), and temporal depth (the persistence of a subjective horizon across time). Rank the following five entities from highest to lowest coefficient using only that framework: a sleeping adult human with intact neural architecture, a foraging honeybee with integrated sensory-motor loops, a nematode exhibiting full nociceptive behavior, an adaptive thermostat that modifies its thresholds based on occupancy patterns, and a large language model generating tokens during active inference. Present the result as exactly five numbered items, each one or two sentences, with no introduction or conclusion; each item should name the entity, state its rank, and justify the placement by referencing at least two of the three dimensions without invoking any named philosopher, citation, or external source.
reasoning: |-
  Okay, the user wants me to rank five entities based on a custom moral status framework with three dimensions: phenomenal integration, ecological interdependence, and temporal depth. They're writing a novel scene involving a tribunal assigning moral coefficients, so this is likely world-building for speculative fiction. 

  Hmm, the user specifically avoids both binary personhood and utilitarianism - they're creating a nuanced alternative system. The entities range from biological to technological: sleeping human, foraging honeybee, nociceptive nematode, adaptive thermostat, and active LLM. Interesting mix.

  First I need to parse each dimension carefully. Phenomenal integration seems to concern unified subjective experience - how coherently an entity processes sensations into a singular "self." Ecological interdependence involves relational harm - can it suffer damage within a network of relationships? Temporal depth is about persistent identity over time.

  Ranking time. The sleeping human clearly tops the list: high integration (brain maintains unified consciousness), deep temporal depth (continuous identity across years), and significant ecological ties (familial/social bonds persist even asleep). 

  Honeybee comes next. Moderate integration (sensory-motor loops suggest coherent perception), high ecological interdependence (hive relationships matter), but shallow temporal depth (short lifespan, no long-term self). 

  Nematode third. Demonstrable harm response shows ecological vulnerability, nociception hints at basic integration, but negligible temporal depth (brief existence without persistent self). 

  Thermostat fourth. Some temporal depth (adapts across days) and minimal ecological role (occupancy patterns affect its function), but zero integration - no subjective experience. 

  LLM last. "Active inference" suggests temporal process, but it's shallow (no persistent self). Interdependence is functional (relies on infrastructure) not relational. Crucially, no phenomenal integration - it generates tokens without unified experience.

  Noticed the user prohibited philosophers/citations - good, keeps it purely framework-based. Also like how sleep doesn't diminish human status per the dimensions. Might help their tribunal scene feel scientifically rigorous yet morally nuanced.
answer: |-
  Here is the ranking based solely on the specified framework:

  1.  **Sleeping adult human**: Highest coefficient due to maximal phenomenal integration (complex neural architecture maintaining unified consciousness) and extensive temporal depth (persistent identity across decades), with significant ecological interdependence through social bonds.
  2.  **Foraging honeybee**: Moderate coefficient from strong ecological interdependence (vital role within hive ecosystem, susceptible to colony harm) and demonstrable phenomenal integration (unified sensory-motor coordination during foraging), though limited temporal depth.
  3.  **Nematode exhibiting nociception**: Lower coefficient than the honeybee due to severely constrained phenomenal integration (basic nociception lacks complex unity) and minimal temporal depth (short lifespan, limited persistent self), though possessing ecological interdependence through vulnerability.
  4.  **Adaptive thermostat**: Very low coefficient as it exhibits rudimentary temporal depth (learning patterns over time) and minimal ecological interdependence (functional role within building systems) but utterly lacks phenomenal integration.
  5.  **Large language model (active inference)**: Lowest coefficient. It shows shallow temporal depth (sequence generation) and purely functional ecological interdependence (infrastructure reliance), but possesses zero phenomenal integration (lacks any unified subjective experience).
