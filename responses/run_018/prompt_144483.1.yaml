answer: |-
  Here’s a 4-minute toast weaving Marisol’s core insight with warmth, clarity, and that crucial hospital analogy – designed to resonate with both theorists and family, while honoring her intellectual rigor:

  **(Raise glass, warm smile)**  
  "Friends, colleagues, Marisol’s wonderful family – we’re here to celebrate thirty years of Marisol Chen making us all *think harder*. As a philosopher of risk who shaped real-world policy, she didn’t just play with ideas; she showed us where the guardrails were missing on the very tools we trusted.  

  **(Lean in, conversational)**  
  Now, many here know Marisol’s work challenged a powerful idea: Expected Value. EV is elegant. It says, *‘Calculate the odds, weigh the stakes, pick the option with the highest average payoff.’* It’s the engine behind smart investments, lifesaving drugs, even your retirement plan! **(Nod to family)** And yes, it involves math, but Marisol wasn’t arguing about the arithmetic. Her brilliance was seeing something deeper, something structural.  

  **(Shift tone slightly – thoughtful, concerned)**  
  She saw that EV, applied rigidly *everywhere*, *all the time*, can quietly unravel the very systems it tries to optimize. It’s not about one reckless gamble. It’s about the slow cascade. Because if you evaluate *every single line item* solely by its immediate probability-times-payoff... well, some things start looking like ‘bad bets.’  

  **(Introduce analogy – vivid, concrete)**  
  **Picture a hospital.** Its backup generators are crucial. They sit idle 364 days a year. The probability they’re needed *today* is tiny. The immediate payoff? Zero. On a strict EV calculation, year after year, maintaining them looks inefficient – money down the drain. So, you cut the maintenance budget. Maybe you delay replacing aging parts. The EV math *still* looks good each time you make that cut. The immediate risk barely budges.  

  **(Build the cascade)**  
  But then, one stormy Tuesday, the power fails. Suddenly, that tiny probability hits 100%. And the payoff? Negative infinity – lives hang in the balance. The generators sputter... and fail. The EV calculations for *each individual cut* seemed sound. But collectively, they dismantled the very infrastructure designed for that rare, catastrophic moment. The system collapsed *from within*, precisely *because* it followed the math too faithfully, piece by piece.  

  **(Connect to Marisol’s work – admiration)**  
  **This was Marisol’s profound insight.** She showed us that Expected Value, brilliant as it is, lacks an *internal brake* against this kind of institutional erosion. It cannot, on its own, account for the interdependence of systems – how cutting the ‘low probability’ safeguards today makes the *truly catastrophic* failures not just possible, but inevitable tomorrow. It wasn't about rejecting math; it was about **seeing the mathematical blind spot.**  

  **(Emphasize courage & nuance)**  
  Defending this took courage. It’s easy to be misunderstood – as if she was saying *‘Ignore the numbers! Be reckless!’* But that’s the opposite of her point! Marisol never dismissed careful calculation. She demanded **richer calculation.** She fought for decision-making that understood *which* risks were systemic, which safeguards were foundational, even when their immediate EV looked poor. She argued for structures *outside* the EV frame – oversight, redundancy, ethical guardrails – precisely **because** she respected the power of the math enough to know its limits.  

  **(Legacy and warmth)**  
  So, Marisol, we toast you tonight not just for your intellect, but for your wisdom. For thirty years, you’ve been the architect insisting the blueprint needed an extra column: ‘Preserves the system that makes the saves possible.’ You showed us that true prudence isn’t just crunching today’s numbers, but **safeguarding tomorrow’s capacity to calculate at all.**  

  **(Raise glass higher)**  
  To Marisol Chen: a thinker who made the numbers wiser, the systems stronger, and public health far more resilient. Your legacy isn’t just in papers, but in the countless ‘backup generators’ – physical and institutional – you helped us keep running. May your retirement be filled with joy, adventure, and beautifully calculated risks... with all the necessary safeguards firmly in place! Cheers!"

  **Key elements addressed:**

  1.  **EV as Structural, Not Decorative:** The hospital analogy *shows* the cascade effect, making EV's systemic danger concrete and central.
  2.  **"Not Bad at Math":** Explicitly frames her critique as seeing a "mathematical blind spot" and demanding "richer calculation," praising her rigor.
  3.  **Concrete Analogy (Non-Pascal):** The hospital generator maintenance is relatable, shows the cascade clearly, and avoids theological debate.
  4.  **Distance/People Naivety Avoided:** The focus is on *systemic interdependence and erosion*, not emotional proximity or simple headcounts. The "infrastructure that makes the big saves possible" is the key concept.
  5.  **Balancing the Room:** Explains EV simply early on, uses vivid imagery for family, while the concepts ("systemic risk," "internal brake," "interdependence") satisfy the theorists. The praise for intellectual courage resonates with both.
  6.  **Tone:** Respectful, admiring, warm, and celebratory, ending on a personal note for Marisol.

  This structure allows you to honor the depth of Marisol's contribution while ensuring everyone in the room understands *why* it mattered and feels included in the celebration. Good luck next Thursday!
