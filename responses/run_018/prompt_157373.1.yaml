  Okay, the user is a longtime lurker on rationalist forums and has been diving into French Revolution historiography. They've noticed a pattern where historians attribute the "good" outcomes of the revolution (like constitutional breaks and abolishing feudalism) to structural forces, while the "bad" outcomes (like the Terror) are blamed on contingent factors or individual actions. They're asking if there's a name for this asymmetric causal bookkeeping and how it differs from motivated reasoning or fundamental attribution error. Also, they want a historical case that challenges this framing.

  First, I need to unpack their observation. They're pointing out a methodological inconsistency in historical analysis. When historians approve of an outcome, they frame it as inevitable due to deep structures. When they disapprove, they switch to contingency, emphasizing accidents or individual agency. This sounds like a blend of motivated reasoning and teleological thinking. 

  The user mentions motivated reasoning and fundamental attribution error. Motivated reasoning fits because historians might be defending their ideological stance. But fundamental attribution error is more about blaming individuals instead of situations. Here, it's more about shifting the explanatory framework based on normative judgments. So it's similar but applied to collective events.

  They want a term for this. There isn't a single established term, but concepts like "normative asymmetry in causal attribution" or "teleological slippage" come to mind. I should explain why existing terms don't fully capture it. For example, presentism involves judging the past by present standards, but this is specifically about causal attribution. 

  The user also asks for a historical case where structural forces caused both good and bad outcomes without contingent triggers. The Haitian Revolution comes to mind: structural oppression led to both liberation and extreme violence, with no clear separation. Another example is the Russian Revolution's Civil War period, where structural factors drove both land redistribution and Red Terror. The English Civil War's progression to regicide and dictatorship under Cromwell also fits. These cases show structural inevitability producing mixed outcomes, challenging the asymmetry.

  How does this address the user's deeper needs? They might be seeking validation of their observation and wanting to engage in more nuanced historical analysis. They could be looking for frameworks to avoid biased interpretations. By providing terms and counterexamples, I'm helping them articulate their insight and apply it critically. They might also be interested in historiographical debates, so explaining the professional self-awareness among historians adds context.

  I should also note that historians are often aware of this trap. Scholarship like Furet's or Soboul's critiques shows reflexivity. Highlighting this prevents the user from overgeneralizing. The key is that the asymmetry stems from unresolved tension between determinism and agency, amplified by moral judgments.

  In conclusion, the user's insight is sharp. They need a synthesis of existing concepts and examples that challenge the pattern. Emphasizing the Haitian Revolution as a strong case where structural factors encompass both liberation and violence can help them test their framework. Affirming their observation while providing academic context meets their unspoken need to deepen their historiographical critique.
answer: |-
  Your observation is razor-sharp and identifies a genuine, pervasive pattern in historical (and political) analysis – a form of **normative asymmetry in causal attribution**. While there isn't one universally accepted *single* term for this specific phenomenon, it sits at the intersection of several well-established concepts:

  1.  **Teleological Slippage / Normative Teleology:** This is the closest specific concept. Historians subtly (or not so subtly) allow their judgment of the *outcome's morality* to dictate their choice of *causal explanation*. Good outcomes are presented as the "natural," "inevitable," fruition of deep structures (making them seem justified or necessary). Bad outcomes are framed as avoidable "deviations" caused by contingent accidents or individual pathologies (making them seem regrettable aberrations rather than inherent products of the process). The "end" (the normative judgment) shapes the explanation of the "means."

  2.  **Motivated Reasoning (Applied to Historical Causation):** This is absolutely central. Historians (like all humans) are susceptible to interpreting evidence in ways that confirm their pre-existing beliefs or values. A historian who views the Revolution's core achievements as fundamentally progressive is motivated to see them as structurally determined (thus "solid" and justified). Conversely, they are motivated to distance those achievements from the Terror, attributing it to avoidable mistakes or bad actors. The reverse is true for historians hostile to the Revolution – they might see the Terror as the *true* structural outcome and the moderate phase as a fragile, contingent illusion.

  3.  **Fundamental Attribution Error (Scaled Up):** While typically applied to individuals blaming personality for behavior while ignoring context, your observation shows it scaled to macro-historical analysis. Attributing the Terror *primarily* to "Robespierre's paranoia" or "ideological fanaticism" commits a massive FAE by downplaying the overwhelming structural pressures – war, civil war, economic collapse, hyperinflation, genuine counter-revolutionary threats – that created the context where paranoia and fanaticism became dominant political strategies. It assigns blame to internal dispositions (of individuals or factions) while minimizing the power of the situation.

  4.  **Presentism (Subtle Form):** The historian's *current* values (e.g., liberal democracy good, state violence bad) are projected onto the past, influencing not just moral judgment, but the *causal framework* used to explain events. The "good/bad" split in causation directly mirrors the present-day normative split.

  **How it Differs/Relates to Class vs. Ideology Debate:**

  *   The class vs. ideology debate focuses on *what kind of deep force* was primary (economic/material vs. ideas/discourse).
  *   Your observation focuses on *how the choice of causal framework (structure vs. contingency/agency)* shifts **based on the normative valence of the *specific outcome*** within the same narrative. It's about the *selective application* of explanatory modes depending on whether the historian approves or disapproves of the result. A Marxist might use structure for both the rise of the bourgeoisie *and* the Terror (seeing the latter as a necessary defensive phase). A liberal historian might use structure for the abolition of feudalism but contingency for the Terror. The asymmetry lies in the *switching* based on normative judgment.

  **Cases that Challenge the Framing / Might Change Your Mind:**

  You need cases where the same deep structural forces *unambiguously* and *directly* produced outcomes containing **both** elements widely considered normatively "good" *and* "bad" **without** a clear contingent trigger separating them. The Haitian Revolution is arguably the strongest candidate:

  1.  **Structural Forces:** Brutal, entrenched racial slavery; extreme economic exploitation; rigid caste system; inspiration/enabling from the *structural* crisis of the French Revolution; geopolitical pressures.
  2.  **"Good" Outcome (Structural Inevitability):** The complete and permanent abolition of slavery. This wasn't a contingent gift; it was the *direct, necessary, and structurally inevitable goal* of the enslaved majority's uprising. No deep structural analysis can separate the revolution from abolition.
  3.  **"Bad" Outcome (Structural Inevitability):** Extreme, widespread violence – massacres of slaveholders and their families, internecine conflict between factions of the formerly enslaved, devastating warfare. This violence wasn't *just* due to a "contingent" leader like Dessalines's ruthlessness (though agency mattered). It was the *inevitable*, horrific product of the structural conditions:
      *   The absolute necessity of destroying the slaveholding class physically and psychologically to prevent re-enslavement.
      *   The depth of racial hatred and trauma forged by centuries of unimaginable brutality.
      *   The fragmentation and external threats forcing internal purges.
      *   The lack of established institutions for peaceful transition after the collapse of the slave system.
  4.  **Lack of Separable Contingency:** While specific events and leaders shaped the course, the fundamental dynamic – that overthrowing such a violently oppressive system structurally *required* and *produced* immense violence alongside liberation – is inescapable. You cannot credibly attribute abolition to deep structures while blaming the violence solely on contingent fanaticism or accidents. The violence was structurally inherent to the process of liberation *from that specific structure*.

  **Other Potential Cases:**

  *   **The Russian Revolution/Civil War:** Structural forces (WWI collapse, deep agrarian crisis, autocratic failure) led inevitably to the overthrow of the Tsar and the *attempt* at socialist transformation ("good" for some historians). These *same* structural forces (economic devastation, foreign intervention, breakdown of order, peasant uprisings) also inevitably led to the Red Terror, brutal grain requisitioning, and the rise of a repressive security state ("bad"). While Lenin's ideology/choices mattered, the scale and nature of the violence were structurally dictated by the context of collapse and civil war.
  *   **The English Civil War & Cromwell:** Structural tensions (monarchy vs. parliament, religion, finance) led to the Civil War and the eventual execution of Charles I ("good" for republicans). These *same* structural tensions (deep religious divisions, unresolved power struggles, economic strain) inevitably led to the authoritarian rule of the Major-Generals, repression in Ireland, and the collapse into military dictatorship ("bad"). The instability and violence weren't *just* due to Cromwell's personality; they were baked into the revolutionary process.

  **Conclusion:**

  You're not overfitting. You've identified **Normative Asymmetry in Causal Attribution** or **Teleological Slippage** as a core pattern in historiography, driven by motivated reasoning and a scaled-up version of the fundamental attribution error. It's a sophisticated form of presentism where moral judgment dictates explanatory framework.

  The Haitian Revolution is the most compelling case to challenge this asymmetry. It forces the recognition that the same deep structural forces of oppressive systems collapsing can simultaneously produce liberation *and* extreme violence as two sides of the same coin. There is no clean separation via contingent "accidents"; the violence is as structurally determined as the freedom it sought to achieve within that specific, horrifying context. Historians analyzing Haiti generally *cannot* maintain the asymmetry you observe in French Revolution historiography – the structural explanation encompasses both the triumph and the tragedy inextricably. If examining cases like this doesn't fully dissolve your skepticism, it should at least significantly complicate the pattern and demonstrate that structural forces *can* produce normatively complex outcomes without relying on contingent scapegoating for the "bad" parts.
