  I'm drafting a proposal for a one-semester philosophy-of-mind term paper, roughly six thousand words, and I need a half-formed idea turned into a precise, defensible research plan. The idea centers on Dennett's well-known argument about quining qualia, particularly the Chase-and-Sanborn coffee-taster intuition pump. In the standard literature the pump is read either as a decisive dissolution of the concept of qualia or as a failure to respect first-person authority. I suspect both readings miss a more specific structural question: whether the dialogue actually demonstrates that "qualia" is incoherent, or whether it merely reveals that first-person reports about qualitative experience serve several different pragmatic functions—phenomenal description, comparative discrimination, and normative evaluation of one's own perceptual development—that Dennett illegitimately collapses into a single category. If those functions can be separated, one might defend a deflated but coherent notion of qualitative change without committing to the mysterious, intrinsic, ineffable properties Dennett targets.

  Please turn this into a formal proposal containing the following elements. First, state the precise research question: does the Chase-and-Sanborn scenario establish incoherence in the concept of qualia, or does it only show that epistemic access to qualitative states is mediated by conceptual refinement in ways that make some changes genuinely undetectable? Second, explain why existing answers—both Dennett's eliminativist reading and the standard qualia-defending responses—leave this open, noting that both treat "the taste changed" and "my discrimination changed" as competing explanations of the same report rather than as reports of genuinely different kinds. Third, lay out the method: reconstruct the logical structure of the intuition pump; propose a taxonomy of qualitative reports divided into phenomenal, comparative, and normative types; and test, for each type, whether it can be explained away using only publicly available behavioral and conceptual criteria, without appealing to private qualitative properties. Then apply the taxonomy to a second, less-discussed case—gradual color-adaptation in expert textile dyers—to check whether the distinction generalizes or collapses. Fourth, specify what a positive result would look like (a stable middle position in which one report-type resists full reduction, yielding a minimal, non-mysterious notion of qualitative change) and what failure would look like (the taxonomy collapses back into Dennett's dismissal, leaving no coherent residue). Fifth, provide a realistic semester timeline—weeks 1–3 on reconstruction and taxonomy, weeks 4–7 on case analysis, weeks 8–11 on drafting and counter-arguments, week 12 for revision—plus an honest assessment of scope risks, such as the possibility that the dyer case introduces empirical issues about perceptual learning that exceed the intended conceptual analysis. Do not include a bibliography, reading list, or citation requests; I will supply all references myself.
