answer: |-
  ### Research Proposal: Pragmatic Functions and the Coherence of Qualitative Change in Dennett's Intuition Pump  

  **1. Research Question**  
  Does Dennett’s Chase-and-Sanborn coffee-taster thought experiment demonstrate the *incoherence* of qualia as a concept, or does it merely reveal that first-person reports of qualitative experience serve distinct pragmatic functions—phenomenal description, comparative discrimination, and normative self-evaluation—whose conflation creates a false dilemma? If the latter, can a deflationary notion of qualitative change survive Dennett’s critique without invoking mysterious, intrinsic properties?  

  **2. Critical Gap in Existing Literature**  
  Existing interpretations bifurcate into two problematic positions:  
  - **Dennett’s eliminativist reading**: Treats Mr. Chase’s dilemma (“the coffee changed” vs. “I changed”) as proof that qualia lack stable criteria for sameness/difference, rendering the concept incoherent.  
  - **Standard qualia-defense responses**: Argue Dennett disregards first-person authority but accept his framing of the reports as *competing explanations for the same datum* (e.g., Lycan’s reliability critique or Block’s phenomenal concept strategy).  
  Both approaches assume Chase’s statements are rival hypotheses about a single state. This overlooks the possibility that “the taste changed” (phenomenal report), “I discriminate tastes better” (comparative report), and “my palate improved” (normative report) track distinct aspects of experience. By collapsing these functions, Dennett manufactures incoherence, while defenders fail to challenge this conflation.  

  **3. Method and Structure**  
  **Phase 1: Logical Reconstruction and Taxonomy (Weeks 1–3)**  
    - Reconstruct the argumentative structure of the Chase-and-Sanborn pump, isolating Dennett’s premises for treating qualitative reports as reducible to behavioral/dispositional criteria.  
    - Propose a tripartite taxonomy of first-person qualitative reports:  
      - **Phenomenal**: Direct descriptions of “what it’s like” (e.g., “This tastes burnt”).  
      - **Comparative**: Discriminations between stimuli (e.g., “This tastes different from yesterday’s”).  
      - **Normative**: Evaluations of perceptual competence (e.g., “My taste sensitivity improved”).  
    - Test each type against Dennett’s criteria: Can each be explained *without* private qualia? For example:  
      - Normative reports may reduce to third-person learning histories;  
      - Comparative reports may rely on public behavioral benchmarks;  
      - Phenomenal reports may resist full reduction.  

  **Phase 2: Case Extension (Weeks 4–7)**  
    - Apply the taxonomy to **expert textile dyers undergoing gradual color-vision adaptation**. This case involves:  
      - Long-term perceptual refinement (normative),  
      - Fine-grained hue discrimination (comparative),  
      - Reports of color-appearance shifts (phenomenal).  
    - Assess whether the taxonomy holds or collapses when:  
      - (a) Changes are incremental (unlike Chase’s abrupt shift),  
      - (b) Expertise provides objective standards for discrimination.  

  **Phase 3: Coherence Test (Weeks 8–11)**  
    - If one report type (e.g., phenomenal) resists reduction, determine whether it supports a *minimal qualia* notion: relational, non-ineffable, and tied to conceptual development.  
    - Engage counterarguments: e.g., that Dennett’s “heterophenomenology” already accommodates pragmatic pluralism, or that normative reports presuppose unreduced phenomenality.  

  **4. Expected Outcomes**  
  - **Positive Result**: The taxonomy holds in both cases. Phenomenal reports (e.g., “Colors now *look* brighter”) evade Dennett’s reduction, supporting a coherent, deflationary account of qualitative change as *conceptually mediated but not illusory*. This carves a middle path: qualia exist as dynamic, response-dependent properties.  
  - **Negative Result**: All report types reduce to behavioral/conceptual criteria (e.g., phenomenal reports are inferred from comparative judgments), vindicating Dennett’s eliminativism. The taxonomy collapses, revealing “qualitative change” as a pragmatic label for discrimination shifts.  

  **5. Timeline and Risk Assessment**  
  - **Timeline**:  
    - Weeks 1–3: Reconstruction/taxonomy development.  
    - Weeks 4–7: Analysis of coffee-taster and dyer cases.  
    - Weeks 8–11: Drafting and counterargument resolution.  
    - Week 12: Revision.  
  - **Scope Risks**:  
    - **Empirical Overreach**: The dyer case risks importing perceptual psychology literature (e.g., neural adaptation) beyond conceptual goals. *Mitigation*: Restrict analysis to published first-person accounts from dyers (e.g., historic trade manuals) to avoid empirical entanglement.  
    - **Taxonomic Fragility**: If phenomenal reports inherently depend on comparative/normative contexts, the distinction may blur. *Mitigation*: Preemptively define boundaries using Austin/Sellars-style ordinary language criteria.  
    - **Dennettian Rebuttal**: Dennett may argue the taxonomy still presupposes “experience” as an explanandum. *Mitigation*: Ground phenomenal reports in Wittgensteinian “avowals” rather than inner objects.  

  ---  
  This structure delivers a falsifiable core argument while isolating the novel claim: Dennett’s "incoherence" stems from ignored pragmatic plurality, not qualia’s intrinsic defects. The dyer case tests robustness, and the timeline permits iterative refinement.
