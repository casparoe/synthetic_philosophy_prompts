   2. Introduce the corporate metaphor: Explain that just as we might ask if a big corporation can be guilty for its actions, we are here to examine if a nation can bear guilt for a war.
   3. Explain the complexity of the corporate metaphor in the context of Germany in WWI:
      - A corporation is made of many individuals (executives, employees, shareholders) and structures (departments, policies). Similarly, a nation includes leaders, citizens, institutions, and historical circumstances.
      - In a corporation, it's hard to pinpoint guilt: Is it the CEO? The board? The culture? The system? Likewise, for WWI, we must ask: Was it the Kaiser? The military? The diplomats? The political system? The societal pressures?
