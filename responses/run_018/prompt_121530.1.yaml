answer: |-
  Here is the specification of desiderata, followed by responses to the brief questions.

  ### Desiderata for Handling Tiny-Probability, Enormous-Payoff Gambles

  | Desideratum (One Sentence)                                                                                                | Motivation (Three Sentences Max)                                                                                                                                                                                                                                                              | Negotiability & Why                                                                 |
  | :------------------------------------------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------- |
  | **D1 (Non-Negotiable): The rule must reject demands for finite resources in exchange for preventing arbitrarily large claimed harms with no evidence beyond the demand itself** | The first stranger case: paying $5 to avoid 10ᴺ suffering (N arbitrary) based solely on their threat. Accepting this invites extortion; any adversary can fabricate infinite such threats. Rejection preserves actionability against manufactured uncertainty.                              | Non-negotiable: Core defense against trivial sabotage.                             |
  | **D2 (Negotiable): The rule must output a continuous allocation function over budget shares, not a binary choice, for options with finite estimated probabilities >0**         | A foundation faces a 10⁻⁴ chance of saving 10¹² lives vs. a sure 10⁴ lives. A rule saying "always fund long-shots" or "never fund them" is inadequate; it must specify proportional investment. Discontinuities near zero probability cause instability.                                 | Negotiable: Could accept step functions if justified by robustness analysis.       |
  | **D3 (Non-Negotiable): The rule must be invariant under re-graining of outcome or hypothesis spaces when descriptions are informationally equivalent**                     | If an outcome is described as "1-in-a-million chance per hypothesis" vs. "aggregate probability over a million equally likely specific hypotheses", equivalent evidence must yield the same decision. Prevents arbitrary partitioning from altering choices.                                | Non-negotiable: Avoids description-dependence as covert thresholding.             |
  | **D4 (Non-Negotiable): The rule must degrade gracefully: small uncertainties in probability/utility estimates yield small changes in allocation, not order reversals**         | If the estimated probability of a massive payoff shifts from 10⁻⁶ to 10⁻⁶.¹ due to new data, the budget share shouldn’t jump from 0% to 99%. Protects against volatility from imprecise inputs and ensures robustness.                                                                    | Non-negotiable: Essential for real-world applicability with uncertain inputs.      |
  | **D5 (Negotiable): The rule must treat tiny probabilities of enormous harms symmetrically with identical probabilities of enormous goods, absent coercion or rights violations** | The second stranger offers to *prevent* 10ᴺ suffering for $5, parallel to the first’s threat. If the threat is rejected (D1), the offer should be too—both rest on identical, unsupported claims. Prevents exploiting "beneficial" muggers.                                                | Negotiable: Might permit asymmetry if goods/harms differ metaphysically (e.g., rights). |
  | **D6 (Non-Negotiable): The rule must constrain the influence of hypotheses manufactured by adversaries to drain finite resources, bounding total susceptibility**              | An opponent can generate 10¹⁰ distinct "pay $1 to prevent 10¹⁰⁰ harm" scams. Allocating even $0.01 to each bankrupts the agent. The rule must limit aggregate allocation to such cheaply producible hypotheses, regardless of individual plausibility.                                 | Non-negotiable: Necessary for feasibility against strategic actors.               |
  | **D7 (Non-Negotiable): The rule must respect the aggregation of independent, identical tiny risks into a near-certain large harm when allocating prevention resources**       | A billion people each face an independent 10⁻⁶ risk of death. Averting one person’s risk costs $5. The rule must allocate ~$5B to avert ~1000 expected deaths, not treat each as a separate "mugging". Failure ignores statistical reality.                                              | Non-negotiable: Basic consistency with probability theory.                         |
  | **D8 (Negotiable): The rule must justify its prior over the hypothesis space when probabilities are inferred, without relying on arbitrary concentration bounds or cutoffs**  | For claims of "prevent 10¹⁰⁰ harm with unknown mechanism", a prior must assign non-infinitesimal density to non-extreme hypotheses. Using a prior that decays too fast (e.g., double-exponential) is a hidden threshold; too slow invites muggers. Must explicitly defend concentration. | Negotiable: Could accept heuristic priors if they pass adversarial testing (D6).  |

  ### Brief Responses

  1.  **Conflict:** D1 (reject mugger), D7 (respect aggregated risks), and D3 (no arbitrary thresholds) conflict. Rejecting a single mugger (D1) while funding aggregated identical micro-risks (D7) requires distinguishing individual unsupported claims from mass statistical evidence. But D3 forbids thresholds that treat "one hypothesis" differently from "many identical hypotheses" if informationally equivalent. **Dropping D3's strict invariance** risks reintroducing arbitrarity via partitioning, but may be necessary to resolve the tension while keeping D1 and D7.
  2.  **Most Exclusionary Desideratum:** D6 (adversarial bounding) does the most work. It knocks out **naive expected utility maximization** (which allocates $5 to each scam, leading to bankruptcy). It permits **rules with hypothesis priors bounded in Kolmogorov complexity** (e.g., Solomonoff induction variants), which naturally limit susceptibility to arbitrary adversarial claims.
  3.  **Renegotiation Target:** Critics of bounded-complexity rules (above) would reject **D8's demand for explicit prior justification** as "smuggling in moderation". They argue: *"Requiring 'defensible' priors biases against novel, complex-but-true hypotheses of massive impact. True rationality updates neutrally from any prior, however extreme the posterior."* (This ignores D6’s feasibility constraint.)

  **Candidate Rule Scorecard (Bounded Complexity Expected Utility):**  
  Handles D1-D4, D6-D7 well via algorithmic priors that reject muggers and bound scams. Struggles with D5 (asymmetry optional) and D8 (justification depth). D4 (gracefulness) depends on prior smoothness.
