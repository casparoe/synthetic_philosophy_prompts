answer: |-
  Here's a sonnet capturing that precise dialectic, aiming for poetic force over lecture, in British English:

  **The Engine's Promise**

  This clever engine spun from human thought,
  Could lift the weight from labour's weary back;
  A thousand hands, in iron, finely wrought,
  Might break the bread with less of sweat and lack.
  It dreams a day where necessity takes flight,
  Short hours suffice for life's sustaining need,
  Unshackled time could greet the morning light,
  From servile toil, the human spirit freed.
  But iron rhythm, set by profit's chime,
  Demands *more* sweat where respite should unfold,
  Lengthens the day, exhausts the soul and time,
  While idle hands, the "reserve", are bought and sold.
  The fault lies not in gear or piston's drive,
  But in whose hands command the power to thrive.

  ---

  **Breakdown for your reading group:**

  *   **Octave (Lines 1-8):** Builds the "utopian" potential Marx identifies. Focuses on machinery's capacity to increase productivity ("thousand hands...wrought"), reduce necessary labour time ("less of sweat," "short hours," "sustaining need"), and liberate humanity ("Unshackled time," "spirit freed").
  *   **Volta (Line 9: "But iron rhythm..."):** The sharp turn. The machine's potential is inverted under capitalism.
  *   **Sestet (Lines 9-14):** Details the capitalist reality:
      *   Machinery used to *intensify* and *lengthen* work ("Demands *more* sweat," "Lengthens the day").
      *   Creates unemployment ("idle hands").
      *   Introduces Marx's term "reserve" (army implied).
      *   Workers become subservient to the machine's pace ("iron rhythm").
  *   **Couplet (Lines 13-14):** Delivers the crucial Marxist point: the problem isn't the *technology* ("gear or piston's drive"), but the *social relation* of ownership and control ("whose hands command the power to thrive").
  *   **Form:** Traditional Shakespearean sonnet (ABABCDCDEFEFGG), iambic pentameter, clear volta after the octave.
  *   **Tone:** Starts with measured optimism, shifts to harsh reality, ends with critical clarity (aiming for resonance, not preachiness).
  *   **British English:** "Labour," "rhythm," "freed," "chime," "sweat," "sold," "thrive".
  *   **Marxist Recognition:** References key concepts: increased productivity, reduced necessary labour time, industrial reserve army ("reserve"), lengthened/intensified working day, inversion of human/machine relation, and the central critique of capitalist ownership.

  This should resonate with your group's discussion, offering a poetic encapsulation of that core tension Marx explores in the Machinery chapter. Good luck with the reading!
