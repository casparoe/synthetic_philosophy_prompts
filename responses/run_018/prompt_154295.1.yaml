  Most importantly, I need to acknowledge what the game can't capture: the years-long resentment, personal reputational stakes, and the role of institutional power in historical disputes. The tokens can't simulate Newton using the Royal Society to crush Leibniz.

  For materials, keeping it simple: colored markers for diagramming, letter-sized paper for theory boards, index cards for clues. Envelopes preset with shuffled cards save setup time.

  Execution risks: 
