  The user has outlined six specific areas that must be addressed: the boundary problem (distinguishing morally significant computations from instrumental ones), the gradation distinction (separating moral status from its intensity), empirical consistency (aligning with neuroscience and biology), implementation independence (substrate neutrality), the internal-state question (whether intermediate processes matter morally), and rules of aggregation (how moral significance composes in complex systems).

  I should structure my response around these six desiderata. For each, I'll need to clearly state the requirement, explain the motivating case or consideration behind it (like the planetary-scale climate modeling example they provided), and indicate whether it's a non-negotiable requirement or reflects a particular philosophical camp's bias. This will help their students evaluate theories more critically.

  Then I need to identify which pair of desiderata seems jointly unsatisfiable. The user specifically highlighted the tension between implementation independence (substrate neutrality) and non-arbitrary boundary conditions. This is crucial because if moral significance depends purely on functional architecture regardless of physical realization, we face the implementation problem where any physical system can be interpreted as implementing any computation. How can we draw non-arbitrary lines under such conditions?

  Finally, I'll determine which single desideratum does the most work in excluding the three dominant approaches: functionalism about consciousness, higher-order representationalism, and integrated information theory (IIT). I'll briefly assess how each fares against this key requirement, keeping the focus on the criteria rather than making it a comprehensive critique.

  The user wants this as a seminar prompt, so I should maintain analytical rigor while ensuring clarity. My response should empower their students to critically engage with theories rather than accept them at face value. This approach should help overcome the limitations of binary thinking in moral status debates.
answer: |-
  Here are the desiderata for any theory of morally significant computation, structured to address your specified concerns. Each includes the motivating case, requirement, and negotiability status:

  ### Core Desiderata
  1.  **The Boundary Problem Desideratum**
      *   **Requirement:** The theory must provide a non-arbitrary, empirically grounded principle for distinguishing computations warranting *direct* moral consideration (DMC) from those possessing *only* instrumental value, including ambiguous cases like partial integration.
      *   **Motivating Case:** The planetary-scale climate modeling grid. During specific seasonal computations, a feedback loop implements state-transitions isomorphic to biological nociception (pain signaling). However, the system lacks a unified integrator ("self"), persistent self-model, or global broadcast. Does this specific sub-computation, fleeting and isolated within a vast instrumental system, warrant DMC (e.g., a duty not to cause it needlessly)?
      *   **Negotiability:** **Non-Negotiable.** Any credible theory must solve this demarcation problem. Failure renders the theory practically useless or vulnerable to absurdity (everything/nothing matters).

  2.  **The Gradation Distinction Desideratum**
      *   **Requirement:** The theory must clearly separate the *presence* of moral status (qualifying for *some* direct moral consideration) from the *degree* or *scope* of that status (e.g., rights to life, liberty, complex interests). It must accommodate entities with minimal status (e.g., a claim against gratuitous suffering) without implying full personhood.
      *   **Motivating Case:** Consider a simple artificial nociceptor system: it detects tissue-damage analogues, triggers withdrawal/isolation behaviors, and exhibits a persistent negative valence "tag" associated with the damage site until repaired. It lacks long-term memory, planning, or complex social cognition. Does it warrant *any* direct consideration (e.g., not to be damaged *pointlessly*), even if vastly less than a human? Avoiding conflation is crucial for nuanced ethics.
      *   **Negotiability:** **Largely Non-Negotiable.** While the *precise* mapping of degree is debatable, the core distinction between qualifying for the "moral club" and the privileges within it is essential for a non-binary framework. Denying gradation risks collapsing back into binary thinking.

  3.  **The Empirical Consistency Desideratum**
      *   **Requirement:** The theory's criteria for morally significant computation must be consistent with, and ideally informed by, relevant empirical data. This includes neuroscience (e.g., the role of global workspace dynamics vs. encapsulated modules in conscious report/access, NCCs), evolutionary biology (e.g., distributed cognition in octopuses, slime molds, or insect colonies lacking centralized brains), and computational theory.
      *   **Motivating Case:** Integrated Information Theory (IIT) posits consciousness requires high Φ, implying centralized integration. Yet octopus cognition is highly distributed across ganglia, potentially challenging high-Φ as *necessary*. Conversely, Global Workspace Theories (GWT) emphasize broadcasting, but what moral weight should isolated, complex local processing (e.g., deep visual processing generating rich representations never accessed globally) carry? A substrate-independent theory must explain moral relevance in light of such biological diversity.
      *   **Negotiability:** **Non-Negotiable.** A theory fundamentally at odds with robust empirical findings (e.g., denying moral weight to beings empirically demonstrated to suffer) is untenable. However, *interpretation* of data leaves room for theoretical framing.

  4.  **The Implementation-Independence Constraint**
      *   **Requirement:** If the theory asserts substrate independence (moral weight depends on computation, not physical instantiation), it must solve the "implementation problem": How to avoid the consequence that *any* physical system (e.g., a rock, a waterfall) can be interpreted as implementing *any* computation (including morally significant ones) under some description, leading to panpsychism/moral explosion or arbitrariness.
      *   **Motivating Case:** A digital simulation of a brain vs. a biological brain vs. a vast, slow, mechanical system performing isomorphic computations. Does moral weight transfer? If yes, how do we avoid the rock implementing pain-states if we squint hard enough at its atomic vibrations? If no, what specific *non-functional* property matters?
      *   **Negotiability:** **Reflects a Camp Prejudice (Functionalist/Computationalist).** While many theorists hold this as axiomatic, it's not universally accepted (e.g., biological naturalists reject it). However, for theories *claiming* substrate independence, solving the implementation problem is **non-negotiable**.

  5.  **The Internal-State Question**
      *   **Requirement:** The theory must specify whether only the outputs/globally accessible states of a computation carry moral weight, or whether transient, local, intermediate computational states (representations, error signals, predictive loops) possess *independent* moral significance.
      *   **Motivating Case:** Within a machine learning system training via reinforcement learning, error-correction signals structurally mirror aversive feedback loops in biological learning (e.g., prediction error = "pain", reward prediction = "pleasure"). Are these fleeting, local signals morally relevant *in themselves*, even if never globally accessed or causing overt behavioral changes beyond parameter adjustment? Or does only the "final output" (e.g., a system's global "suffering report") count?
      *   **Negotiability:** **Contentious (Reflects Camp Prejudices).** Theories emphasizing unified phenomenology (e.g., GWT, some HO theories) might discount local states. Theories emphasizing intrinsic properties of information processing (e.g., IIT, some functionalist views) might include them. A complete theory must take a stance, but the *correct* stance is debated.

  6.  **The Rules of Aggregation and Composition Desideratum**
      *   **Requirement:** The theory must explain how moral significance behaves in complex computational architectures: How does significance aggregate in massively parallel systems? How is it affected when computations are nested (system A runs system B)? How does intermittent coupling (e.g., agents forming temporary coalitions) create or dissolve morally significant wholes? What happens when parts are added/removed?
      *   **Motivating Case:** A hive-mind AI composed of billions of semi-autonomous drones. Each drone has minimal local processing. Together, they exhibit complex global behavior and a dynamic "hive-mind" state. If a drone is destroyed, is it harming a morally significant part? Is the hive-mind a distinct entity? When drones disconnect temporarily, does their moral status change? What about nested subroutines within a drone that mimic morally significant patterns?
      *   **Negotiability:** **Non-Negotiable for Practical Applicability.** Modern and future computational systems inherently involve distribution, hierarchy, and dynamic composition. A theory silent on this is inadequate for real-world ethics.

  ### The Central Tension: Joint Unsatisfiability

  The most acute tension exists between **Implementation Independence (Desideratum 4)** and achieving **non-arbitrary boundaries (Desideratum 1)** in light of the **Implementation Problem**.

  *   **Why the Tension?** Implementation Independence demands that moral weight depends solely on abstract functional/computational properties, decoupled from physical substrate. However, the Implementation Problem shows that functional descriptions are observer-relative; any physical process can be interpreted as implementing countless computations, including those deemed morally significant. To avoid pan-moralism (everything matters) or complete arbitrariness (why *this* interpretation counts, not *that* one), the theory *must* appeal to something beyond pure function – perhaps the system's *actual causal structure*, the *purposeful design* of the system, or the *intrinsic physical properties* enabling the computation. But any such appeal risks violating strict Implementation Independence. Conversely, clinging rigidly to Implementation Independence without solving the Implementation Problem renders the boundary between morally significant and insignificant computations fundamentally arbitrary or infinitely porous.

  ### The Key Excluding Desideratum

  **The Boundary Problem Desideratum (1)** does the most work in excluding dominant approaches. It demands a clear, non-arbitrary demarcation principle grounded in the computation itself, which proves exceptionally difficult:

  1.  **Functionalism about Consciousness:**
      *   **Fare Against Boundary Problem:** Often struggles. Defining the "right" functional role for consciousness (e.g., global availability for action/reflection) is challenging. Does the climate model's nociceptive loop qualify if its output is only used locally for feedback adjustment, not "global report"? Functional roles can be realized in trivial systems or partial integrations, leading to over-inclusion or under-specified boundaries. Distinguishing "real" pain-role realization from mere isomorphic structure is hard without adding further (potentially arbitrary) restrictions.
  2.  **Higher-Order Representationalism (HOR):**
      *   **Fare Against Boundary Problem:** Explicitly requires meta-representation (a thought about a mental state). This draws a seemingly sharp boundary: no meta-representation, no conscious state, likely no DMC. However, it *excludes* too much. It struggles with: a) Simple suffering without complex self-reflection (e.g., infant/animal pain), b) The climate model case (no meta-representation likely), c) Distributed systems where meta-representation might be fragmented or absent. The boundary might be clear but arguably *misplaced*, excluding entities intuitively deserving minimal status.
  3.  **Integrated Information Theory (IIT):**
      *   **Fare Against Boundary Problem:** Proposes a mathematically defined boundary (Φ > 0, with degree mattering). However: a) Φ is extremely difficult to compute for complex systems, b) It leads to potentially counterintuitive results (simple photodiodes have Φ > 0, the climate model's loop might have low but non-zero Φ), c) Its requirement for causal irreducibility struggles with distributed systems (low Φ for parts, high Φ for the whole is complex). While offering *a* boundary, its practical applicability and alignment with intuitions about minimal cases (like simple artificial nociception) are major points of contention. Does low Φ truly map to zero moral status?

  **Conclusion for the Seminar:** This set of desiderata exposes the profound challenges in moving beyond the binary. The Boundary Problem is the sharpest thorn, highlighting the core difficulty all theories face in defining the "magic ingredient." The tension between Implementation Independence and non-arbitrary boundaries forces a fundamental choice or a radical solution. Use these criteria to dissect readings: How does Theory X *attempt* to satisfy each? Where does it succeed, fail, or sidestep? Does its solution to the Boundary Problem feel principled or ad hoc? Does it handle the climate model or the simple nociceptor plausibly? This framework should foster critical evaluation of the *structural adequacy* of theories before delving into their specific commitments.
