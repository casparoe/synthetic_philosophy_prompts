   Revised procedure with clear outputs:

   Correlated-Competence Jury Rule (CCJR) Checklist:

   Step 1: Independence Check
     Question: "Has there been significant prior public discussion or media coverage that likely created strong shared opinions or polarization?"
     - If YES (high correlation) -> Output: "use small panel" and stop.
     - If NO (low correlation) -> Go to Step 2.
