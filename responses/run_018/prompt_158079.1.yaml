  We are designing a decision procedure for choosing between a large random pool (like a citizens' assembly) and a small expert panel. The procedure is based on the Condorcet jury theorem but adapted for real-world factors: correlated votes (due to prior discussion, media, etc.), varying competence, stakes, and strategic voting.

   The procedure is a checklist with four steps. Each step has criteria to decide whether to use a large pool, a small panel, or if it's a judgment call (punt to human). We go in order and if we get a clear answer at any step, we stop. If we get to the end without a clear answer, we use a default (or punt).

   Step 1: Independence Check (Prior Discussion/Media Exposure)
     - We are checking for factors that would cause votes to be correlated (non-independent). High correlation reduces the benefit of having many voters.
     - Ask: "How much prior discussion or media exposure has there been? Has there been a dominant narrative or a lot of group deliberation already?"
       - High: If there has been extensive media coverage, public debate, or pre-assembly meetings that have formed a strong consensus or polarized views, then we suspect high correlation. (This reduces the effective independence of voters.)
       - Low: If the issue is new, not widely discussed, or if the assembly is the first major forum for discussion, then we can assume low correlation.

     Decision:
       - If high correlation (and especially if the issue is polarizing): this pushes us toward the small panel (because the large pool's votes are not independent, so we don't get the benefit of many independent opinions). Output: "use the small panel".
       - If low correlation: we move to the next step (or if we are unsure, we note it but move on).

     However, note: sometimes prior discussion might have been balanced and led to informed independence? But the problem is that it often creates herd behavior. So we are conservative: if there's been a lot, we lean to small panel.

   Step 2: Competence Spread (Without Testing)
     - We need a rough idea of the distribution of competence (i.e., the probability that a randomly selected voter will vote correctly). But note: the Condorcet theorem assumes competence >0.5 and independent. Here we care about the spread and average.
     - Ask: "How wide is the range of expertise on this issue? Are there a few experts and many laypeople, or is the topic something where everyone has roughly similar knowledge (like a local common issue)?"
       - Wide spread: The issue is highly technical (e.g., engineering details) and most citizens are not familiar with the details. There are a few experts. Then the average competence might be low (below 0.5) or highly variable. In this case, a large pool of laypeople might have an average competence below 0.5, which would make the majority vote worse than flipping a coin. But note: even if the average is above 0.5, if the spread is wide, the small panel of experts might be much better.
       - Narrow spread: The issue is one of common concern or values (like neighborhood aesthetics) where most people have similar levels of understanding and the average competence is above 0.5.

     Decision:
       - If the spread is wide and the average competence is likely below 0.5 (or we suspect it's low): then we want the small panel (experts). Output: "use the small panel".
       - If the spread is narrow and average competence is likely above 0.5: then we move to the next step (or if we are unsure, we note it and move on). But if we are confident the average is above 0.5 and the spread is narrow, then we might lean to large pool.

     However, note: without testing, this is a judgment call. We might ask: "Is this issue more about technical facts or about values and preferences?" 
       - Technical: competence spread is wide -> small panel.
       - Values: competence spread is narrow -> large pool.

   Step 3: Stakes of Being Wrong
     - Ask: "What are the consequences of a wrong decision? Are they high (e.g., safety risks, large financial loss) or low (e.g., reversible decision, minor impact)?"
       - High stakes: We want the highest probability of being correct. If we have a small panel of experts and we trust their competence is very high (say above 0.9 each) then even a small panel might be better than a large pool of less competent voters (especially if the large pool's average competence is only slightly above 0.5). Also, if the decision is irreversible and costly, we might prefer the experts.
       - Low stakes: We can tolerate a higher error rate and might prefer the democratic legitimacy of a large pool.

     Decision:
       - High stakes: push toward the small panel (if we have experts available) because we want the best chance of being right.
       - Low stakes: push toward the large pool (for inclusivity and legitimacy).

   Step 4: Strategic Voting
     - Ask: "Is there a significant risk of strategic voting? That is, will some voters vote not according to their true belief but to achieve a strategic outcome? (e.g., to block a rival faction, or because of external pressure)"
       - High risk: This is more likely in a large pool, especially if the issue is polarizing and there are organized groups. Strategic voting can distort the outcome. A small panel of experts might be less prone to this if they are selected for impartiality and are accountable for their expertise.
       - Low risk: Then we don't worry.

     Decision:
       - High risk of strategic voting: push toward the small panel (if we trust the panel to be non-strategic) or if we cannot trust either, then we might have to punt. But in general, we assume experts are less strategic because they have reputational concerns and are selected for objectivity. Output: "use the small panel".
       - Low risk: we move to the next step (but we are at the end).

   After Step 4, if we haven't decided:
     - If the issue is more about values (what the community wants) than facts, then we default to the large pool (for legitimacy).
     - If the issue is more about technical facts, then we default to the small panel.

   But note: if we are unsure at any step, we can punt to a human (especially when the step involves a values judgment or when there is a tie in the factors).

   Now, let's apply to the three cases:

   Case 1: Routing a bike lane through a residential neighborhood.
     Step 1: Prior discussion? Likely high - neighbors have talked, there might be NIMBYism, media coverage. -> use small panel? But wait, this is also about community values. Let's check the steps.
       Actually, we must consider: prior discussion might have been extensive and created polarization. So Step 1: high correlation -> output: use small panel? But let's see if we can get more.

     But let's go through all steps:
       Step 1: High correlation (prior discussion) -> push to small panel.
       Step 2: Competence spread: This is about local knowledge and values. The technical aspect (traffic engineering) exists but the main issue is about balancing interests and community preferences. So average competence might be high (everyone knows their street) and spread narrow? Or is it wide? Actually, the technical part might be beyond laypeople. But the values part is where they are competent. We could split the issue? But the procedure doesn't. Let's say: the spread is narrow on the values part (so we might lean to large pool) but the technical part is wide. However, the decision requires both. This is ambiguous. So we don't decide at step 2.

