answer: |-
  ### Practical Checklist: Correlated-Competence Jury Rule  
  *(For deciding between a large random pool vs. small expert panel)*  
  **Time to run:** 15 minutes  
  **Goal:** Account for real-world messiness (pre-discussion, competence gaps, stakes, strategy).  
  **Outputs:** "Small Panel," "Large Pool," or "Punt to Human" (when values or ambiguity dominate).  

  ---

  #### **Step 1: Check Independence Decay**  
  *(How much prior chatter/media has "pre-correlated" opinions?)*  
  - **Ask:** *"Has this topic been debated publicly (e.g., news, social media, community meetings) before the assembly?"*  
    - **High decay (use Small Panel):**  
      - If there’s been intense media coverage, organized campaigns, or polarizing discussions (e.g., "bike lane wars" in local papers).  
      - *Why:* Pre-baked opinions mean votes aren’t independent → large pools amplify herd bias, not wisdom.  
    - **Low decay (proceed to Step 2):**  
      - If the topic is fresh, niche, or lacks a dominant narrative (e.g., obscure zoning technicalities).  
    - **Punt to Human:**  
      - If opinions are split but unclear whether they’re organic or influenced (e.g., "some activists care, but most residents are unaware").  

  ---

  #### **Step 2: Guesstimate Competence Spread**  
  *(How wild is the gap between experts and laypeople?)*  
  - **Ask:** *"Could a random citizen grasp the core facts without training, or is deep expertise needed?"*  
    - **Wide spread (use Small Panel):**  
      - Technical/niche issues where errors are costly (e.g., engineering specs, legal risks).  
      - *Red flag:* Laypeople’s average competence is likely <50% (e.g., "water-main seismic safety").  
    - **Narrow spread (proceed to Step 3):**  
      - Values-driven or common-sense issues (e.g., "should the park have more benches?").  
    - **Punt to Human:**  
      - Mixed case (e.g., zoning changes: partly technical soil tests, partly "what’s best for the neighborhood").  

  ---

  #### **Step 3: Weigh Stakes of Being Wrong**  
  *(What’s the cost of a bad decision?)*  
  - **Ask:** *"If we screw this up, could it hurt people, waste big money, or spark lawsuits?"*  
    - **High stakes (use Small Panel):**  
      - Safety risks, major $$ loss, or irreversible damage (e.g., infrastructure failures, toxic cleanup).  
    - **Low stakes (proceed to Step 4):**  
      - Reversible, low-cost, or subjective calls (e.g., "public art design").  
    - **Punt to Human:**  
      - Stakes are high, but the "right" answer depends on values (e.g., "prison vs. rehab funding" involves ethics).  

  ---

  #### **Step 4: Gauge Strategic Voting Risk**  
  *(Will people vote tactically, not truthfully?)*  
  - **Ask:** *"Could factions manipulate outcomes, or experts dominate the room?"*  
    - **High risk (use Small Panel):**  
      - History of lobbying, partisan splits, or complex issues where experts might intimidate lay voters.  
    - **Low risk (use Large Pool):**  
      - No clear agendas, or topic encourages honest preferences (e.g., "community garden rules").  
    - **Punt to Human:**  
      - Unclear motives (e.g., "mayor’s pet project" vs. "genuine grassroots interest").  

  ---

  ### **Apply the Rule: Three Cases**  

  1. **Bike Lane Routing (Residential Area)**  
     - Step 1: **High decay** (NIMBY vs. cyclist fights in local FB groups) → *Small Panel*.  
     - *Why skip later steps?* Pre-correlation means large pools just echo noise.  

  2. **Zoning Change (Old Factory Site)**  
     - Step 1: Low decay (new issue) → Step 2: **Wide spread** (zoning law + environmental tech) → *Small Panel*.  
     - *Why?* Technical details (soil safety, traffic models) require expertise.  

  3. **Water-Main Contractor (Hidden Repairs)**  
     - Step 1: Low decay (public hasn’t debated contractors) → Step 2: **Wide spread** (engineering specs, seismic risks) → *Small Panel*.  
     - *Output against mayor:* Stakes (Step 3) are sky-high (floods, sinkholes), and lay voters can’t assess technical bids.  

  ---

  ### **What This Can’t Handle (Be Honest!)**  
  - **Negative correlation traps:** If experts are *more biased* than the public (e.g., contractors cozy with city staff), the rule assumes panels are objective.  
  - **Deliberation distortion:** The rule treats pre-talk as decay, but *good* dialogue might boost competence. No way to quantify.  
  - **Competence/bias entanglement:** If the smartest people are also the most stubborn (e.g., "arrogant engineers"), we ignore it.  
  - **Legitimacy trade-offs:** Sometimes "fairness" > "accuracy" (e.g., reparations policy). The rule prioritizes correctness.  

  ### **Where We’re Faking Precision**  
  - **Steps 1 & 4:** Judging "how much chatter" or "strategic risk" is 100% subjective. Staff must eyeball it.  
  - **Step 2:** "Competence spread" is a vibe check. We assume tech=experts, feelings=everyone — but reality’s messy.  
  - **The math veneer:** Condorcet’s theorem is haunted by real-world correlations. This checklist is a heuristic, not a proof.  

  **Bottom line:** Use this to dodge obvious disasters (like popular votes on reactor designs), but punt when values clash or staff smell fishy.
