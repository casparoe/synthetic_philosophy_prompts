prompt: |-
  You serve as an expert philosopher of language with specialist training in institutional design and collective coordination. Before drafting, briefly list the core Lewisian conditions for a genuine convention—coordination problem, arbitrary but stable equilibrium, common knowledge, and salience sustained by precedent—and identify which ones are genuinely present or genuinely threatened in the case below. Think carefully about how digital scale and asymmetric observational access affect common-knowledge dynamics.

  I sit on the Governance Committee for our university’s open collaborative research platform, where contributors edit shared living documents. Over three years an unwritten norm has emerged: if you revise another contributor’s section, you must leave a brief explanatory annotation visible to all. The norm is not enforced by software; it persists because experienced users model it and newcomers eventually learn through observation. Recently, a faction of senior contributors proposed formalizing the norm into a binding platform rule with automated flags, arguing that as our user base grows, newcomers no longer share the common observational history that made the precedent self-enforcing, so coordination is breaking down. Another faction argues that formalization would destroy the convention’s flexibility and turn a Lewis-style emergent equilibrium into a top-down regulation, undermining the very common-knowledge dynamics that sustain it.

  Draft the committee’s decision memo recommending either formalization with a specific sunset or review clause, or deliberate preservation of the emergent norm with a specific alternative mechanism, with reasons the opposing faction could recognize as addressing their best point rather than dismissing it. Lead with the bottom-line recommendation in the first sentence; then give the reasoning, with no preamble and no restating of the question. Do not include bibliographies, reading lists, or citations.
reasoning: |-
  Hmm, the user is asking me to draft a decision memo for a university governance committee regarding an annotation norm on their research platform. They want me to draw on Lewisian convention theory to analyze the situation before making a recommendation.

  Looking at this case through Lewisian lenses, I need to recall the core conditions for a convention: (1) there must be a coordination problem (people need to coordinate their editing behaviors), (2) there must be an arbitrary but stable equilibrium (the annotation norm serves this purpose), (3) there must be common knowledge of the convention (everyone knows about it, knows others know, and so on), and (4) salience must be sustained by precedent (the past success of the norm makes it prominent).

  In this digital context, the committee is divided. One faction wants to formalize the norm into a binding rule with automated flags because they believe common knowledge is breaking down as the user base grows - newcomers don't share the observational history. The other faction opposes formalization, arguing it would destroy the convention's flexibility and undermine the common-knowledge dynamics.

  The key issue here is how digital scale and asymmetric access affect common knowledge. With more users, observational learning becomes harder - newcomers might not see enough examples or might interpret them differently. Also, in digital spaces, not everyone sees the same things at the same time, which weakens the mutual awareness needed for common knowledge.

  I think both factions have valid points. The pro-formalization group correctly identifies the threat to common knowledge, while the anti-formalization group rightly values the norm's flexibility. A compromise is needed.

  For my recommendation, I'll propose preserving the emergent norm but adding specific mechanisms to strengthen common knowledge without formalization. Specifically, I suggest a "Norm Visibility Dashboard" that highlights recent annotations and their contexts, along with starter tooltips that explain the norm when users first edit others' sections. This addresses the scale problem by making precedents more visible and salient, which should help newcomers learn faster while keeping the convention bottom-up.

  I'll make sure the memo starts with a bottom-line recommendation in the first sentence, followed by reasoning that acknowledges the best points of both sides. I'll frame the visibility dashboard as addressing the pro-formalization faction's concern about eroding common knowledge, while the anti-formalization faction should appreciate that we're preserving the emergent nature of the convention. The memo will be concise and practical, avoiding academic citations as requested.
answer: |-
  **Bottom-line recommendation:** Preserve the emergent annotation norm while implementing a "Norm Visibility Dashboard" to actively reinforce common knowledge and precedent salience, with a six-month review to assess its effectiveness.

  **Reasoning:** Both factions identify genuine threats to Lewisian conditions. The pro-formalization faction correctly diagnoses that *common knowledge* is threatened as scale increases: asymmetric observational access means newcomers lack the shared history of precedent needed to reliably infer the convention, risking coordination failure. However, formalization as a binding rule fundamentally shifts the convention from an *arbitrary but stable equilibrium* sustained by mutual expectations into a top-down regulation. This risks undermining the very *common-knowledge dynamics* the other faction values, replacing flexible mutual responsiveness with compliance monitoring. The coordination problem remains inherently suited to a convention – multiple stable equilibria exist (e.g., annotation styles), but consistency is key.

  Our solution addresses the core threat (eroding common knowledge) without collapsing the convention into regulation. The Norm Visibility Dashboard will:
  1.  **Amplify Precedent & Salience:** By algorithmically surfacing recent, high-impact annotations and their contexts, it makes adherence *more observable*, compensating for reduced shared history. This directly bolsters the *salience* of the precedent for all users, especially newcomers.
  2.  **Reinforce Common Knowledge:** Making the *pattern* of adherence and its recognition highly visible helps sustain the recursive "I know that you know that I know..." structure essential for common knowledge, even with asymmetric individual observations. A simple starter tooltip on the first edit of another's section (explaining the *prevailing expectation*, not a rule) gently signals the norm without enforcement.
  3.  **Preserve Equilibrium Flexibility:** The norm itself remains emergent and adaptable. Users retain the ability to negotiate edge cases (e.g., minor typo fixes) based on context and mutual understanding, sustaining the convention's organic *arbitrariness* and resilience.

  The pro-formalization faction should recognize this directly targets their best point: the mechanism proactively combats the erosion of common knowledge and precedent salience due to scale, making coordination *more* reliable without resorting to rigid enforcement. The anti-formalization faction should recognize it sustains the convention's essential Lewisian character – a self-correcting equilibrium grounded in mutual expectation and precedent, not compliance. The six-month review assesses whether the dashboard sufficiently restores stable coordination; if not, targeted formalization of *only* the most critical, unambiguous aspect (e.g., mandatory notification *visibility*, not content approval) could be reconsidered.
