  ## NATIONAL BUERAU OF MEREOLOGICAL AFFAIRS (NBMA)
  **FREQUENTLY ASKED QUESTIONS: OBJECT COMPOSITION POLICIES**

  **Date:** 10/26/2023
  **Version:** 7.3.1a (Compliance Update: Revised Fusion Thresholds)
  **Disclaimer:** The NBMA regulates ontological boundaries pursuant to the Metaphysical Unity Act (MUA) of 1954. Failure to file appropriate composition declarations may result in fines, existential audits, or ontological reassignment. The NBMA assumes no liability for identity crises, tax reassessments, or accidental fusions resulting from policy application.

  **Q1: How does the NBMA determine when several things compose a single object?**
  A: The NBMA administers three primary composition frameworks, as mandated by the MUA. Applicability depends on the ontological zoning of the physical region in question (refer to NBMA Onto-Zoning Map, Sector 7C-12 for local designations).

  *   **Policy 1: Unrestricted Universalism (UU)**
      *   **Criteria:** Any plurality of objects, regardless of spatial proximity, causal connection, or functional relationship, composes a further object.
      *   **Administrative Note:** UU applies primarily to theoretical research zones and high-energy physics facilities. Under UU, the coffee mug (CM-001), the table (TBL-045), and the dust particle 3 light-years away (DST-Λ-7.8e12) compose the object designated CM-TBL-DST-Λ-7.8e12. Tax assessments may apply to novel aggregates; consult Form M-42A "Declaration of Arbitrary Sums."
      *   **Common Issue:** Entities may unintentionally compose vast, scattered objects (e.g., "The Continental Dust Collective"), leading to complex liability and taxation challenges. Mitigation requires filing a Dissolution Waiver (Form D-19) for non-preferred aggregates.

  *   **Policy 2: Compositional Nihilism (CN)**
      *   **Criteria:** Only fundamental particles (as defined by the Standard Particle Registry, Appendix Ψ) are genuine objects. No plurality of particles ever composes a further whole object.
      *   **Administrative Note:** CN applies to designated Minimalist Ontology Zones (e.g., certain academic philosophy departments, ultra-purified laboratories). Under CN, there is no "table," no "coffee mug," and no "pair of shoes" – only particle arrangements P-arr-TBL-045, P-arr-CM-001, and P-arr-SHOE-L/R. Property deeds and sales tax apply only to particle arrangements. "Assembly" is considered a terminological convenience, not an ontological event.
      *   **Common Issue:** Citizens experience ontological distress. Appeals based on "common sense" are inadmissible; file an Existential Reclassification Request (Form E-11) only if new particle data emerges.

  *   **Policy 3: Gradient Fusionism (GF) (NBMA Default Policy)**
      *   **Criteria:** Parts compose a whole only if they achieve a sufficient score on the Official Fusion Index (OFI), calculated via the formula:
          `OFI = (Proximity Coefficient * 0.6) + (Functional Integration Score * 0.4)`
          A score ≥ 7.5 on the 10-point NBMA Fusion Scale qualifies the plurality as a fused object. Proximity is measured in Planck-length-adjusted spatial vectors; Functional Integration assesses shared purpose via NBMA Form F-88 "Declared Role Synergy."
      *   **Administrative Note:** GF applies to residential, commercial, and most public ontological zones. Your shoes likely score OFI 8.2 (high proximity + shared function: foot protection), qualifying as a "Pair" (Object Class: Footwear System). Loose dust on a shelf likely scores OFI 2.1 (low proximity, no declared shared function), remaining non-composed particles. **Crucially:** The coffee mug (CM-001) resting on the table (TBL-045) *may or may not* fuse, depending on duration of contact, declared function, and surface adhesion (measured via Form ADH-2). Prolonged contact (>72 hrs) without declared separation intent (Form S-15) often triggers an OFI audit.
      *   **Common Issue:** Citizens must apply for "Fusion Certification" (Permit GF-P10) for objects near the 7.5 threshold (e.g., a "sock drawer system," a "keyring entity"). Failure to certify may invalidate warranties or insurance. A mug-table fusion exceeding OFI 7.5 creates a new taxable entity (e.g., "Brew Station TBL-CM-045-001"), potentially altering property classification and sales tax obligations. File Form H-7 "Hybrid Object Declaration" within 14 days of suspected fusion onset.

  **Q2: My shoes are separated by 1 meter. Do they still qualify as a "Pair" under Gradient Fusionism?**
  A: Likely not. Proximity Coefficient decreases sharply beyond 0.5 meters for Class 1 Attire. You may file Form GF-P10 "Fusion Certification" with supporting documentation (e.g., affidavit affirming shared purpose despite separation, photographic evidence of intended pairing). An OFI assessment fee applies. Without certification, they are distinct right/left shoe particle arrangements for tax and liability purposes.

  **Q3: I own a large, dusty attic. Under Unrestricted Universalism, is the dust one giant object?**
  A: Yes. The aggregate of all dust particles in your attic composes the entity "Attic Dust Aggregate [Your Address]." Under UU zoning, you may be liable for property tax on this entity and could theoretically be cited for its "disorderly state" under Nuisance Composition Regulations. Filing a D-19 Dissolution Waiver is strongly advised if UU applies to your property.

  **Q4: I left my coffee mug on the table for a month. Has it fused into a hybrid?**
  A: Potentially. Duration of contact is a proximity sub-factor under GF. You must:
  1.  Calculate the current OFI using the NBMA Fusion Calculator (v3.1) or hire a Licensed Mereological Assessor (LMA).
  2.  If OFI ≥ 7.5, file Form H-7 "Hybrid Object Declaration" within 14 days of reaching the threshold.
  3.  Consult the Tax Assessor regarding potential reclassification of your furniture ("Brew Station") and implications for resale value.
  4.  File Form S-15 "Intent to Maintain Separation" *before* reaching the 72-hour mark in the future to prevent automatic OFI escalation.

  **Q5: Does Compositional Nihilism mean my car isn't real? Can I avoid sales tax?**
  A: Correct. Under CN, there is no car-object, only the "P-arr-VEH-1234" particle arrangement. However, sales tax applies to the transfer of responsibility for the specific particle arrangement designated VEH-1234 on the Particle Arrangement Registry. The tax amount is identical; ontological denial does not confer fiscal advantage. Do not dismantle your particle arrangement; structural integrity regulations still apply to P-arrangements.

  **Need Further Assistance?** Contact the NBMA Helpline: 1-888-ONT-LOGR (1-888-668-5647). Allow 6-8 weeks for Fusion Permit processing. All forms available at www.nbma.gov/forms.

  ---

  **Commentary on Choices**

  1.  **Mapping Philosophies to Policies:**
      *   **Unrestricted Universalism (Policy 1):** Directly mapped. The absurdity arises from its logical consequence: *every* random collection of things forms an object. The "dust entity" and mug-table-dust example highlight the counterintuitive, administratively chaotic results (taxing scattered dust, defining arbitrary sums).
      *   **Compositional Nihilism (Policy 2):** Faithfully represented. Only fundamental particles exist. The satire comes from applying this rigorously: denying the existence of tables, mugs, shoes, and cars, while bureaucratically managing the "particle arrangements" that correspond to them, showing the practical dissonance and the nihilist denial of assembly.
      *   **Restricted Composition:** Embodied by the invented **Gradient Fusionism (Policy 3 - Default)**. This serves as the arbitrary bureaucratic "middle ground," requiring conditions (proximity + function) quantified on a sliding scale. It directly tackles the arbitrariness problem – why is 7.5 the magic number? Why 60/40 weighting? The required permits (GF-P10, H-7) and forms (F-88, S-15, ADH-2) satirize how bureaucracy creates complex rules to manage inherently vague boundaries.

  2.  **Why Gradient Fusionism Works as Satire:**
      *   **Quantifying the Vague:** It takes the intuitive but fuzzy ideas behind restricted composition (things need to be "stuck together" or "working as one") and reduces them to absurdly precise, bureaucratic metrics (Planck-length-adjusted vectors, weighted formulas, declared function forms). This highlights the inherent arbitrariness philosophers identify.
      *   **Administrative Burden:** The core joke is the sheer bureaucratic overhead created by the policy – applying for permits for shoe pairs or sock drawers, filing declarations to prevent mug-table fusion, conducting OFI audits. This satirizes how complex rules emerge to handle philosophical gray areas in a legal/practical context.
      *   **Real-World Absurdity:** The specific examples (shoe permits, dust taxes, hybrid brew stations) are directly generated by applying GF's logic consistently, mirroring the counterintuitive results of universalism and nihilism, but through the lens of red tape. The deadpan presentation of these as mundane administrative tasks amplifies the satire.
      *   **Hitting the Problems:** It directly addresses arbitrariness (the OFI threshold/weights), creates counterintuitive results (needing a permit for a sock drawer, a mug fusing to a table), and highlights the practical difficulty of defining "assembly" that nihilism avoids by denying it exists. The coffee mug scenario, recurring under all three policies, perfectly demonstrates how each framework yields different, often ridiculous, verdicts on the same mundane situation.
