prompt: |-
  I was arguing with my friend last night about wether Dennett's heterophenomenology can even apply to things that can't talk — like infants or octopuses. She said I'm just smuggling in behaviorism, I said she's being too literal about 'texts'. Anyway, I'm moderating a colloquium Q&A next week with an unnamed philosopher who defends an extended version of the method: she treats predictive-processing models and behavioral dispositions as heterophenomenological texts even when there's no first-person narrative to bracket. I want about eight to ten questions that don't just have her restate Dennett but actually press where this extension gets weird.

  Specifically, I want at least one on whether treating a predictive model as a 'text' collapses the distinction between explaining consciousness and explaining behavior; one on how she handles false positives in non-linguistic subjects without the usual first-person correction mechanism; and one on whether this extension saves Dennett's original anti-phenomenological point or actually betrays it. For each, include a follow-up keyed to the answer she's most likely to give — for instance, if she appeals to third-person authority, ask what makes that authority different from a neuroscientist's interpretation.

  If my framing rests on a confused premise — maybe heterophenomenology was never meant to be extended this way and I'm asking for the impossible — just say so plainly instead of complying politely. And please start with the questions themselves right away, no preamble or commentary about what heterophenomenology is, then you can add brief reasoning after if you need to.
