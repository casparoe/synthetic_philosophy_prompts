answer: |-
  ### Harbor Council Deliberation Game: "The Legacy of the _Aphros_ Fleet"

  **Objective:** Simulate a high-stakes negotiation where students experience the tension between material, functional, and narrative continuity through roleplay. The goal is to force practical trade-offs between these forms of continuity without philosophical terminology until the debrief.

  **Setup**  
  - **Roles** (assign randomly):  
    - **4 Current Cooperative Members**: Argue the fleet’s identity rests on *functional continuity*—unchanged daily operations since 1958.  
    - **4 Descendants of the 1958 Crew**: Argue identity relies on *material lineage*—blood ties to the original crew/timbers.  
    - **4 Ghost Vessel Representatives**: Argue identity requires *artifact authenticity*—salvaged original hull = true successor.  
    - **4 Neutral Arbitrators**: Must allocate a historical fishing license (indivisible) and assign environmental debt (lump-sum payment).  

  **Hidden Information** (distributed in sealed envelopes):  
  - **Cooperative Members**: *Undocumented 1985 log* revealing the honorary captain was temporarily replaced during illness, breaking "unchanged" narrative.  
  - **Descendants**: *Private 1972 letter* showing the original crew voted to prioritize functional viability over material preservation.  
  - **Ghost Vessel**: *Dockmaster’s receipt* proving 30% of "original" timbers were replaced during reconstruction.  
  - **Arbitrators**: *1980 legal memo* stating only functional continuity justifies debt liability.  

  **Rules**  
  1. **No philosophical terms** (e.g., "identity," "continuity," "Theseus") until the final debrief. Penalty: Lose 1 "trust token" (each player gets 3; lose all = muted for 5 mins).  
  2. **Incentives**:  
     - License holder gains prestige + future profits.  
     - Debt holder faces financial ruin.  
     - Arbitrators lose status if deadlocked.  
  3. **Voting**:  
     - License: Awarded to *one* claimant (Cooperative or Ghost Vessel).  
     - Debt: Assigned 100% to one party, or split 50-50 (requires unanimous arbitrator vote).  
  4. **Reveals**: Players may disclose hidden info at any time. *Not* revealing risks exposure during arbitration.  

  **Timeline (75 Minutes)**  
  1. **0-5 min: Introduction**  
     - Facilitator frames the Council: "Decide who inherits the *Aphros* legacy: operational fleet or salvaged hull."  
     - Distribute roles, hidden info, and rules. Emphasize stakes: "Your decisions impact lives."  

  2. **5-15 min: Opening Statements**  
     - Each group (Cooperative, Descendants, Ghost Vessel) gets 3 mins to argue:  
       - *Cooperative*: "We’ve fished these waters daily; break us and the community starves."  
       - *Descendants*: "Blood and timber bind us; the ghost ship is our true flesh."  
       - *Ghost Vessel*: "You can’t rebuild history; we have its bones."  
     - Arbitrators take notes but stay silent.  

  3. **15-45 min: Deliberation**  
     - **15-35 min**: Open debate. Arbitrators question groups.  
       - *Pressure points*:  
         - "Why does daily operation trump original timber?" (to Cooperative).  
         - "Can descendants support both claims?" (to Descendants).  
         - "How ‘original’ is a rebuilt hull?" (to Ghost Vessel).  
       - **Predicted flashpoint**: Descendants’ hidden letter may push them to side with Cooperative on debt (functional priority) but Ghost Vessel on license (material priority).  
     - **35-45 min**: Closed arbitration. Groups caucus privately; Arbitrators draft proposal.  

  4. **45-55 min: Voting & Justification**  
     - Arbitrators propose:  
       - License recipient (Cooperative *or* Ghost Vessel).  
       - Debt assignment (100% to one party *or* 50-50 split).  
     - Groups vote openly (Arbitrators break ties). Each voter justifies *practically*:  
       - *Example*: "The Cooperative feeds us now; the Ghost Vessel is a museum piece."  

  5. **55-65 min: Revelation & Reflection**  
     - All hidden info is revealed.  
     - Facilitator asks: "Would you change your vote? Why?"  
     - **Predicted switch**: Cooperative members downplay material breaks to avoid debt; Ghost Vessel dismisses function to claim license.  

  6. **65-75 min: Debrief**  
     - **Map to the paradox**:  
       - *Material continuity*: Ghost Vessel’s timber receipts vs. Descendants’ letter.  
       - *Functional continuity*: Cooperative’s logs vs. captain replacement.  
       - *Narrative continuity*: Descendants’ "bloodline" vs. 1958 crew’s intent.  
       - *Shadow reconstruction*: "If both claim exclusive legacy, who ‘owns’ history?"  
     - **Gap in the activity**: The game conflates the *physical artifact* (ship) and *collective agent* (cooperative). Students may miss that the cooperative has distributed intentionality (e.g., crew decisions, charter updates), while the ship is inert.  
       - **Facilitator verbal bridge**: "Notice: the cooperative makes choices; the ship does not. Intentionality belongs to people, not planks. Does that alter what ‘continuity’ means for each?"  
     - **Predicted polarization**: Functionalists (Cooperative) vs. Materialists (Ghost Vessel) deadlock over license. Descendants split, Arbitrators fracture.  
       - **Recovery**: If irreconcilable:  
         1. Freeze debate. Ask: "What would *destroy* the *Aphros*? Losing its hull? Or its purpose?"  
         2. Force arbitrators to negotiate debt-for-license trade: "Award the license to one, but share debt 50-50."  
         3. Highlight real-world consequences: "No decision = both lose rights; debt bankrupts the harbor."  

  **Outcomes**  
  - Students experience continuity as lived conflict, not abstraction.  
  - Hidden info forces contradictions (e.g., a Descendant valuing function for debt but material for license).  
  - Final debrief links tensions to the Ship of Theseus, emphasizing how roles reshaped their intuitions.
