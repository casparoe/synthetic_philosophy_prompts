prompt: |-
  I teach a mixed seminar of philosophy and econ majors, about 18 students, one 80-minute session, and I want to run the dollar auction live in class. But here's the catch: I don't want the standard party trick where everyone giggles at the sucker who paid $3.50 for a dollar and we all nod about how irrational people are. The thing I actually want them to wrestle with is a real disagreement about what the game shows. On one reading, escalation is a cognitive bug -- people can't ignore sunk costs, hate losing, get carried away. On the other reading, the trap is in the structure, not in the skull: at every single step, bidding again can be the locally rational move, and the disaster is produced by perfectly sane responses to perverse incentives. These diagnoses matter because the cures differ. If it's a bias, you teach people to cut their losses. If it's a trap, the lesson is to never sit down at the table in the first place, or to change the rules of the game.

  So design me the session with all of that built in. Specifically:

  1. The trap should spring on them before anyone names it. No lecture up front, don't say "dollar auction" or "sunk cost." Figure out how to set it up (maybe as one item in a series of normal auctions?) so they discover what they've walked into.

  2. Run the game at least twice with a rule change in between -- you could vary the stakes, switch from open outcry to sealed written bids, or toggle the rule that the runner-up also pays. The point of the variants is that afterwards students should be able to argue, from how their own behavior changed, which diagnosis it supports. Tell me which variations you think are most diagnostic and why.

  3. There should be real but small stakes so it stings a little. I can spend a few bucks of my own money, or use candy or participation points -- advise me on what works and what backfires.

  4. Game out the predictable failure modes: the one student who's read about this game and spoils it, a room that refuses to bid at all, two friends colluding to split the prize, the auction that ends in ten seconds. For each, tell me what to do in the moment and what it does to the debrief if it happens anyway.

  5. A debrief that maps concrete moments -- the first bid over half the prize, the point where losing the auction became worse than making the next bid -- onto the two diagnoses, and that pushes students to say which one fits what they actually felt. Also: where the literature genuinely disagrees about whether this game demonstrates irrationality or rational entrapment, flag that as contested. Don't let me present "it's the sunk cost fallacy" as settled science if it isn't.

  6. Finally, an honest note on what the activity can't reproduce about real escalation -- wars, strikes, lawsuit spirals, contracts you now can't afford to lose. No fixed prize, no announced end, face and careers on the line, and often no option to just not play. What does the facilitator have to supply by hand?

  Give me a timeline with rough minutes per phase, the exact rules as you'd read them aloud, and the debrief questions. And recieve my thanks in advance for not writing me a worksheet.
reasoning: |-
  Okay, let me tackle this professor's request. They want to run a dollar auction in class that goes beyond the usual "ha ha sucker" moment and instead forces students to grapple with whether escalation is caused by cognitive biases or structural traps. 

  First, I need to design the session so the trap springs unexpectedly. Maybe start with normal auctions to lull them into complacency? A candy bar auction first where they bid actual cash, then transition to the dollar auction without warning. That should make the escalation feel organic.

  The professor wants two rounds with rule changes. For diagnostic value, the key variation should be whether the runner-up pays. First round with both paying (standard trap), second round with only winner paying (control condition). The contrast will show if the structural penalty drives escalation. 

  Real stakes are crucial but tricky. Cash works best for sting, but participation points might avoid payment hassles. $1 prize with 25¢ minimum bids? Small enough for ethics, big enough to matter. 

  Now failure modes:
  - If a student spoils it, I'll acknowledge but reframe: "Even knowing the trap, can you avoid it?" 
  - If no one bids, start with candy to warm them up. 
  - Collusion: announce it voids the auction. 
  - Fast auction: run a second round with 5-second bid windows to force escalation.

  Debrief needs to connect specific moments to the two theories. That $0.75 bid where losing becomes worse than bidding again? Perfect pivot point. Must emphasize the academic debate - Shubik vs. Teger, rational vs irrational interpretations. 

  Finally, the limitations: real-world escalations have no fixed endpoint and higher stakes. I'll need to explicitly discuss how careers and face change the dynamics. 

  Timing breakdown:
  - 5 min setup with candy auction
  - 15 min first dollar auction (both pay)
  - 10 min second auction (only winner pays)
  - 45 min debrief 
  - 5 min limitations discussion

  Rules need crystal clarity: "Highest bidder wins prize, but second-highest also pays their bid without winning anything." Written instructions avoid confusion.

  Debrief questions should force the core dilemma: "When you bid past $0.50, was that a mistake or the least bad choice?" And "Which rule change affected behavior more - and what does that say about why we escalate?"
answer: |-
  Here’s a battle-tested session plan designed to force the "trap vs. bias" debate through lived experience. Total time: 80 minutes.

  **Core Stakes:** Use **cash** (your own). Start with small bills ($1–$5 max prize). Cash stings more than candy/points, makes escalation visceral, and avoids "it’s just candy" dismissal. *Budget tip:* Limit total payout to $10–$15 per session.

  **Failure Mode Mitigation (Pre-Game):**  
  - Start class with: "Today we experiment with decision-making. Phones away, no side conversations. What happens here stays *in* this room."  
  - If a student says "Is this the dollar auction?": **"Maybe! But let’s see how *this group* plays it today."** Neutralize their spoiler by making them a co-observer.  
  - Run **multiple parallel auctions** (3 groups of 6) to increase trap likelihood and prevent groupthink paralysis.  

  ---

  ### **TIMELINE & SCRIPT**  
  **Phase 1: The Bait (10 min)**  
  *Goal: Normalize bidding, mask the trap.*  
  - "We’ll do a few quick auctions for real cash. Each group gets its own prize. Rules: I am auctioning [hold up $1 bill] for **Group 1**, [another $1] for **Group 2**, [$5 bill] for **Group 3**. Minimum bid $0.25, bids must increase by at least $0.25. Winner pays their bid and gets the cash. *Only the winner pays.* Ready? Group 1 starts: Bid $0.25?"  
    *(Run 3 normal auctions fast. $5 group will escalate slightly—foreshadowing.)*  

  **Phase 2: Trap Springs (Round 1) (15 min)**  
  *Goal: Students discover the trap mid-game.*  
  - "Next auction: Prize is $2 [or $3]. **New rule:** The *two highest bidders* pay their bids. Only the highest gets the $2. If you bid, you might pay without winning. Minimum bid $0.25, increments $0.25. Group 1 starts: Bid $0.25?"  
    *(Read rules SLOWLY twice. Do NOT say "dollar auction" or "sunk cost.")*  
    - **Failure Mode Fixes:**  
      - **No one bids?** Nudge: "No bid? Okay, moving to Group 2..." (FOMO usually triggers bids).  
      - **Ends too fast?** Restart: "Same rules, new prize [$1] – but bids must be written and *secret*." (Secrecy fuels overbidding).  
      - **Collusion?** Void: "If two people coordinate, the auction restarts with a new prize."  

  **Phase 3: Rule Shift (Round 2) (10 min)**  
  *Goal: Test if structure or bias drives escalation.*  
  - "Last auction! Prize: $2. **Rule change:** Only the *winner* pays. Second-highest bidder pays nothing. Same bid rules."  
    *(Key: Removing the runner-up penalty *should* prevent deep escalation if the trap is structural.)*  

  **Phase 4: Debrief (45 min)**  
  *Goal: Anchor discussion in concrete bids and feelings.*  

  **Step 1: Reconstruct the Moment (15 min)**  
  - *Poll:* "In Round 1 (both pay), what was the highest bid for $2? Who was the runner-up?" (Write amounts on board).  
  - *Targeted Questions:*  
    - "When the bid hit $1.00 for a $2 prize, why did someone bid $1.25? What did losing *feel* like at that point?"  
    - "Runner-up: When you bid $0.75, and the leader bid $1.00, why did you bid again? What did you stand to lose if you quit?"  
    - "In Round 2 (only winner pays), why did bidding stop at $0.75? What changed?"  

  **Step 2: Trap vs. Bias Showdown (20 min)**  
  - *Frame the Debate:* "Two theories explain why people bid past $1 for $2:  
    **A. Cognitive Bug:** We hate losing, ignore sunk costs, get emotional.  
    **B. Structural Trap:** Each bid is rational—you’re avoiding a bigger loss (paying your bid and getting nothing)."  
  - *Push for Evidence:*  
    - "Whose behavior in Round 1 supports **A**? Who felt 'carried away' or 'stupid' afterward?"  
    - "Who supports **B**? Did bidding $1.25 *feel* rational in the moment to avoid losing $0.75?"  
    - "In Round 2, when only the winner paid, why did the trap vanish? What does that say about **A** vs. **B**?"  
    *(Highlight: Escalation collapsed in Round 2—evidence for **structural trap**. But emotion in Round 1 suggests **bias amplifies the trap**.)*  

  **Step 3: Contested Science & Real World (10 min)**  
  - *Flag Disagreement:* "Economists like Shubik (inventor) saw this as rational game theory. Psychologists like Teger call it irrational escalation. **It’s still debated.**"  
  - *Limitations:* "In real wars or lawsuits:  
    - The 'prize' isn’t fixed (winning a war might cost more than losing).  
    - You can’t always quit (reputations, careers on the line).  
    - There’s no clear end.  
    **The game isolates the trap—but real life adds fuel to the fire.**"  

  ---

  ### **WHY THIS WORKS**  
  - **The $5 "Normal" Auction** warms them up, making the runner-up penalty in Round 1 feel like a small twist.  
  - **Contrasting Round 2** is diagnostic: If removing the runner-up penalty stops escalation, it proves the trap is structural (not just bias).  
  - **Secret Bids (if needed)** increase overbidding by reducing shame—useful if groups are too cautious.  
  - **Cash stakes** make the sunk cost visceral. Students remember paying $1.75 for nothing.  

  **If Disaster Strikes:**  
  - **Group refuses to escalate?** Use their result! "Why did no one bid past $0.50? Did you foresee the trap?" Turns abstinence into data.  
  - **Auction ends at $0.25?** Contrast with escalated groups: "Why did Group 1 avoid the trap while Group 3 paid $4 for $2?"  

  **Final Note:** The game can’t replicate **inescapable commitments** (e.g., conscription) or **shifting stakes**. You’ll need to add these via discussion: "In a merger war, is the 'prize' fixed? Can CEOs really walk away?" This bridges the abstraction gap.  

  Hand out dollar bills (or IOUs) immediately post-auction. Let the winners/losers stare at their gains/losses during debrief. The crumpled cash in a loser’s hand is your best prop.
