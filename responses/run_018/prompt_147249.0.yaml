  Let me first unpack Williams's concepts. The integrity objection argues utilitarianism violates personal integrity by demanding we abandon our "ground projects" for greater good. The "one thought too many" scenario shows how excessive moral calculation can corrupt spontaneous virtuous actions. 

  Now for the translation: Personal commitments become regulated variables with set-points. Utilitarian demands are like exogenous control signals disrupting endogenous regulation. That hesitation before saving a partner? That's feedback latency causing instability. 

  But where does this analogy break down? The residue report needs careful attention. The normative claim "this project is mine" doesn't map cleanly to set-point defense - biology lacks moral ownership. And layered feedback systems can't fully capture why first-order attachment feels different from second-order reflection. 

