  For the substrate defender (Clara), her academic background means she'll fight from within Descartes' system. She should emphasize how even doubting presupposes duration - you can't doubt atomized instants. Her best move is asking how isolated "flash-selves" could possibly constitute the Meditator's continuous narrative.

  I should watch for balance: Aiden gets strong points about Descartes' questionable inferences, but Clara must have equally sharp replies about the incoherence of ownerless thoughts. The turning point could be when she forces him to explain how multiple thoughts relate without a minimal substrate - that's where his position gets shaky.

  Also crucial: the metaphysics must feel urgent. These aren't dry arguments - they're tied to why Aiden left academia (distrust of metaphysical glue) and why Clara stayed (belief in foundational structures). The whiskey and dive bar setting should seep into their speech patterns - shorter sentences when heated, tactile metaphors (circuits, engines, etc).

