  I should start with the bottom line upfront, as they requested. The key is that any realist account must explain how representations are causally efficacious, handle polysemantic neurons, and align with training data efficiency. Non-negotiable criteria include causal efficacy and explaining polysemanticity. Camp-specific preferences might be human-legibility.

  Now, considering the empirical phenomena: adversarial examples show sensitivity to perturbations, linear separability like in image classification, and superposition observed in sparse autoencoders. For conceptual distinctions, encoded vs. exploited is crucial because a feature might be present but not used, like in probe studies. Localist vs. distributed relates to how concepts are stored—single neurons vs. patterns.

  Consistency with training dynamics involves SGD finding certain features early, like in induction heads. Puzzles include why models work despite adversarial vulnerabilities, which any theory needs to address without hand-waving.

  The tension between modular locality and causal efficacy in deep networks like ResNets is important. Residual streams might force distributed representations, making strict modularity hard. That's a potential no-go area for some realist theories.

  For the scorecard, strong distributed realism handles superposition well but struggles with interpretability. Mechanistic interpretability focuses on causal roles but might miss distributed features. Instrumentalism avoids realism but can't explain generalization or adversarial issues.

  I need to ensure each desideratum has a concrete example. Like adversarial vulnerability motivated by Goodfellow's FGSM, linear separability by Csáji's work, superposition from Elhage's studies. This grounds the criteria in real research.

  Also, flagging non-negotiables: causal efficacy and polysemanticity are must-haves. Human-legibility is camp-specific. The joint unsatisfiability part is critical—locality vs. efficacy in ResNets creates tension.

