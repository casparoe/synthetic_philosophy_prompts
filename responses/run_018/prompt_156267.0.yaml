answer: |-
  **Bottom line:** Any credible theory of neural network representation must explain empirical phenomena like adversarial vulnerability and superposition while preserving key conceptual distinctions and consistency with training dynamics, with non-negotiables being causal efficacy and the capacity to represent polysemantic features.

  **Desiderata for a Theory of Representation in Neural Networks:**

  1.  **Explain Adversarial Vulnerability:** The theory must account for why imperceptible, non-semantic perturbations to inputs cause confident misclassifications.
      *   **Motivating Case:** Goodfellow et al.'s Fast Gradient Sign Method (FGSM) generating adversarial examples for ImageNet models. The vulnerability is pervasive and robust across architectures/tasks, demanding an explanation of how representations relate to input geometry and decision boundaries.

  2.  **Explain Linear Concept Encoding:** The theory must account for why semantically meaningful concepts (e.g., object categories, sentiment polarity, syntactic features) are often linearly separable in high-dimensional activation spaces.
      *   **Motivating Case:** Csáji et al.'s work showing linear separability of concepts in word embeddings and vision model layers; probing classifiers (e.g., linear probes on BERT activations for POS tagging) achieving high performance. This suggests structured, accessible concept representation.

  3.  **Explain Superposition/Polysemanticity:** The theory must account for why single neurons or low-rank directions often participate in representing multiple unrelated concepts ("features") simultaneously, with context determining which is active.
      *   **Motivating Case:** Elhage et al.'s identification of polysemantic neurons in toy models and real networks; Anthropic's work on sparse autoencoders decomposing activations into interpretable, often monosemantic features revealing superposition; Olah et al.'s "curve detectors" in vision models combining low-level features.

  4.  **Preserve "Encoded vs. Exploited" Distinction:** The theory must distinguish between a feature being *present* in the activation space (encoded) and it being *causally used* by the network for a specific task (exploited).
      *   **Motivating Case:** Probes detecting a feature (e.g., sentiment in an intermediate layer) with high accuracy, while ablation studies show removing that specific activation component has minimal impact on the *final* output ("detection without use"). Shows encoding is necessary but not sufficient for functional role.

  5.  **Preserve "Localist vs. Distributed" Spectrum:** The theory must accommodate a continuum from highly localized (single neuron ≈ concept) to highly distributed (concept = complex pattern across many neurons) representations, without dogmatically insisting on one extreme.
      *   **Motivating Case:** Existence of "grandmother cells" for specific concepts in some contexts (e.g., high-level vision neurons) vs. distributed representations for most abstract concepts (e.g., word meanings in LLMs). Superposition inherently pushes towards distributed representations.

  6.  **Consistency with Training Dynamics (e.g., SGD):** The theory must be compatible with how representations emerge and evolve during stochastic gradient descent, including phenomena like feature learning order and simplicity biases.
      *   **Motivating Case:** Olsson et al.'s work on "induction heads" forming predictably early in transformer training; evidence that SGD finds simple, generalizable features before memorizing noise; lottery ticket hypothesis suggesting sparse subnetworks encode core representations.

  7.  **Dissolve the "Adversarial Puzzle":** The theory must explain *why* networks achieving high generalization performance on natural data remain so vulnerable to adversarial attacks, rather than dismissing it as an artifact.
      *   **Motivating Case:** The persistent gap between robust and standard accuracy; the existence of "universal" adversarial perturbations. A theory must reconcile high performance on the true data distribution with fragility off-distribution.

  8.  **Dissolve the "Superposition Efficiency Puzzle":** The theory must explain why superposition (using fewer dimensions than features) is a common outcome of optimization under constraints (e.g., sparsity, bottleneck layers, L1 regularization) rather than an inexplicable anomaly.
      *   **Motivating Case:** Mathematical proofs and empirical demonstrations that overcomplete dictionaries (more features than dimensions) are necessary for efficient representation in resource-constrained systems, directly observed via sparse autoencoders in trained networks.

  **Non-Negotiables vs. Camp-Specific Preferences:**

  *   **Non-Negotiables (for Realist Accounts):**
      *   **Causal Efficacy:** The theory *must* explain how the identified representations are *causally involved* in producing the network's outputs (Desideratum 4 distinction is crucial). Instrumentalism avoids this.
      *   **Polysemanticity/Superposition:** Any theory *must* account for the empirical reality of superposition (Desideratum 3) – it's a fundamental consequence of efficient representation under constraints observed consistently.
      *   **Consistency with Training Dynamics:** The theory *must* be compatible with how representations *actually form* via SGD on data (Desideratum 6). A theory requiring implausible learning dynamics is untenable.
      *   **Dissolving Core Puzzles:** The theory *must* genuinely address Desiderata 7 (Adversarial Puzzle) and 8 (Superposition Efficiency Puzzle), providing mechanistic explanations, not just noting their existence.

  *   **Camp-Specific Preferences:**
      *   **Human-Legibility:** Strong Mechanistic Interpretability often *demands* human-understandable features (e.g., curve detectors). Distributed Realism may accept structurally coherent but opaque encodings. Instrumentalism rejects the need entirely.
      *   **Degree of Locality:** Mechanistic Interpretability often *prefers* more localist explanations where possible. Distributed Realism embraces fully distributed representations. This relates to Desideratum 5.
      *   **Scope of "Realism":** Strong Distributed Realism often posits rich, structured internal worlds. Mechanistic Interpretability focuses narrowly on causal roles *for the task*. Instrumentalism rejects internal realism.

  **Joint Unsatisfiability: Locality vs. Causal Efficacy in Deep Nets**

  A significant tension exists between demanding **strict modular locality** (each concept cleanly mapped to a small, discrete set of neurons/modules) and ensuring **complete causal efficacy** in very deep, highly interconnected architectures like ResNets or Transformers:

  1.  **The Problem:** In deep residual networks, information flows through additive skip connections, creating a "residual stream" where representations at any layer are a *superposition* of contributions from all previous layers. This inherently encourages distributed, context-dependent representations (polysemanticity/superposition - Desideratum 3).
  2.  **The Tension:** Insisting on strict modular locality (e.g., "this module solely does X") conflicts with the architecture's design, which blends features continuously. Ablating a supposedly local "module" might have minimal effect because its function is distributed or redundant (violating Desideratum 4's causal efficacy requirement if locality is enforced). Conversely, guaranteeing complete causal efficacy for complex outputs likely requires acknowledging the distributed nature of computation across the residual stream.
  3.  **Analogy to No-Go:** This creates a tension analogous to a no-go result for naive localist realism in deep nonlinear networks with residual connections. Architectures like ResNets *force* a degree of distributed representation and superposition for efficiency and trainability (Desiderata 3, 6, 8), making strict, human-legible modular locality difficult to achieve without sacrificing performance or contradicting the training dynamics and superposition evidence.

  **Brief Scorecard against Core Desiderata:**

  *   **Strong Distributed Realism:**
      *   **Strengths:** Excels at explaining superposition (3), linear separability (2), training efficiency (6, 8), and naturally embraces the distributed spectrum (5). Comfortable with opaque encodings.
      *   **Challenges:** Often struggles to provide human-legible causal mechanisms (4 - exploited), convincingly resolve the adversarial puzzle (7) mechanistically, or pinpoint *specific* causal pathways within the distribution.

  *   **Mechanistic Interpretability (Causal Roles):**
      *   **Strengths:** Explicitly focuses on causal efficacy (4), aims for human-legible features, seeks to dissolve puzzles mechanistically (7, 8), grounded in circuit-level analysis.
      *   **Challenges:** Can struggle to scale to explain highly distributed superposition (3) fully, potentially biases towards more localist interpretations (5), may find it hard to rigorously define "circuits" in very deep residual nets (see tension above).

  *   **Instrumentalism (Stochastic Pattern Matchers):**
      *   **Strengths:** Avoids internal commitment, focuses on input-output behavior; consistent with success on training distribution.
      *   **Challenges:** Fails the non-negotiables: Cannot explain causal efficacy (4), dismisses superposition (3) as irrelevant projection, struggles profoundly with the adversarial puzzle (7) and generalization beyond training data, incompatible with evidence of learned structure (2, 6, 8). Treats the network as a black box whose internal structure is irrelevant.
