  First, I need to identify if there's an existing term. Dennett's "intuition pump" comes to mind, but as the user said, it's a general label. Framing effects are related but don't quite fit because the user mentioned that the flip happens even when both versions are presented side by side. So maybe there isn't a specific term. 

  The user's deeper need might be to understand why these thought experiments fail in arguments and how to articulate that flaw. They might be looking for a way to critique such arguments effectively or to structure their own philosophical discussions better. 

  I should consider coining a term. Something that captures the idea of misleading surface features. "Intuition pollution" could work, emphasizing that irrelevant details contaminate the intuitive judgment. Another angle is focusing on the argument's reliance on incidental elements—"surface-detail dependency." Or "principle occlusion," where the actual principle is hidden by the specifics. 

  Also, the user wants exactly five points. I'll need to define the term, explain the mechanism, differentiate it from framing effects, provide examples, and suggest how it undermines the argument. Making sure each point is concise and addresses the core issue without overlap. 

  Checking if the proposed terms are distinct. "Intuition pollution" highlights contamination. "Surface-detail dependency" is more descriptive. "Principle occlusion" focuses on the principle being obscured. The examples should clarify: trolley vs. footbridge, teleporter destruction vs. non-destruction. 

  Ensuring that each point in the response is numbered, with no intro or conclusion. The goal is precision, so each sentence must be clear and directly address the query. Making sure the terms aren't already widely used to avoid confusion. Finally, verifying that the answer meets the user's request for five points exactly.
answer: |-
  Here are five numbered points addressing your query:

  1.  **Term: "Intuition Pollution"** - This describes when irrelevant or misleading surface details in a thought experiment contaminate the intuitive judgment it aims to elicit, undermining its ability to test the intended abstract principle.
  2.  **Mechanism: Incidental Salience Over Principle** - The persuasive force arises not from the core logical structure or principle, but from affectively potent or cognitively vivid incidental features (like physical proximity, method of harm, or narrative framing) that trigger heuristic responses.
  3.  **Distinction from Framing Effect** - Unlike standard framing effects (which rely on presenting the *same* information differently), this involves *changing incidental details* while purportedly holding the relevant moral or logical variables constant, yet still shifting intuition.
  4.  **Boundary Case: Trolley vs. Footbridge** - The switch from lever-pulling (distant, mechanical) to pushing (personal, physical contact) introduces details deemed irrelevant by utilitarians (only numbers matter), yet drastically alters intuitions, polluting the test of utilitarianism.
  5.  **Undermining Effect: Principle Occlusion** - This flaw allows opponents to redescribe the case, altering or removing the "polluting" details (e.g., a robotic pusher on the footbridge), thereby defusing the original intuitive pull without necessarily engaging the core principle, rendering the experiment inconclusive.
