prompt: |-
  So I just had a massive argument with my friend Tom that went until like 1am, and now I need help because I've stupidly agreed to present on this next week and he's going to be there.

  Background: I defended the Condorcet jury theorem as a genuine justification for majority rule -- roughly, that if voters are on average better than chance at picking the right option, a big enough majority vote is almost certain to get it right, and that's a real reason to value democracy and maybe to expand things like citizen assemblies. Tom's position was that the theorem is a mathematical toy that tells you basically nothing about actual politics, because voters aren't independent coin flips, they're all reading the same newspapers and making the same correlated mistakes, so you never get the magical convergence.

  Now I'm giving a 20-minute talk to our political theory research seminar defending my side, and Tom has told me exactly what he's going to ask me about in the Q&A, the smug git. The audience is: about ten political theorists (mostly sympathetic to deliberative democracy and instinctively hostile to anything that smells like reducing politics to statistics), one formal theorist who actually knows the probability theory and will pounce on any sloppiness about the independence assumption, and a couple of empirically-minded people who'll want to know what "voter competence" even means on a real policy question where there's arguably no fact of the matter about the right answer.

  Prepare me for the question period. I want:

  1. The objections in roughly the order they'll actually come up, phrased the way these people will phrase them -- the deliberative democrats won't talk about independence assumptions, they'll talk about manipulation and framing effects, so pitch it right.
  2. For each one: what I should concede straight away, what I should hold firm on, and a two-or-three sentence reply I can actually deliver out loud.
  3. Which objections have real force and would genuinely damage the thesis versus which are more rhetorical than substantive.
  4. The objection I'm quietly hoping nobody raises (I suspect it's about what happens to the theorem when average competence dips below 0.5, but tell me if there's a worse one).
  5. Whether conceding that Condorcet only justifies majoritarianism under idealised conditions actually loses me anything that matters, or whether I should just give that ground early.

  Also, one thing Tom said that I couldn't answer on the spot: he reckons that even if the theorem worked perfectly, it would justify epistocracy-by-lottery (weighing votes by competence) just as much as democracy, so it can't be a specifically democratic justification. I need a reply to that one especially.

  Please write the whole thing in British English, and keep it usable as an actual prep sheet I can glance at during questions, not an essay.
reasoning: |-
  Okay, the user is prepping for a seminar defense of the Condorcet Jury Theorem against objections, after a heated argument with Tom. They need practical Q&A strategies tailored to specific audience types. 

  First, let's unpack the stakes: They're facing three distinct critic groups—deliberative democrats (care about manipulation/framing), a formal theorist (will pack independence), and empiricists (question "competence" measurability). Plus Tom's epistocracy challenge. User wants tactical concessions vs. hold points, ordered by likely objection sequence. 

  Hmm, the real landmines: 
  - Independence assumption is the formal theorist's kill shot if mishandled. Must preempt by admitting it's idealized but arguing for *mitigated* correlation in diverse societies. 
  - Below-0.5 competence collapse is the nightmare scenario—better hope empiricists don't realize it implies *reverse* majority rule. Have a fallback about institutional fixes. 
  - Tom's epistocracy point is sneaky clever. Need to reframe CJT as uniquely democratic because it doesn't require competency *ranking* (vs. epistocracy's elitist preconditions).

  User's concession strategy is smart. They should surrender early that CJT requires ideal conditions—this disarms "unrealistic" criticisms without harming core argument. Key is pivoting to "but here's why it still matters practically..." 

  For replies: Must sound bite-sized but substantive. Example for deliberative critics: "Concede framing exists → Hold that diversity counters it → Reply: 'Media concentration worsens correlation, which is why we need *more* inclusive deliberation, not less.'" 

  British phrasing check: "Smug git" stays, "rubbish" over "nonsense", "bits of maths" not "math chunks". Sorted.
answer: |-
  Here’s your tactical Q&A prep sheet, formatted for quick glances mid-seminar. Keep it clipped to your notes.  

  ### **Core Thesis to Defend**  
  *"CJT shows majority rule’s *epistemic potential* under favourable conditions. It’s not a full justification for democracy, but a key plank—especially for designing institutions that harness dispersed knowledge."*  

  ---

  ### **Anticipated Objections & Replies**  
  *(Ordered by likely sequence)*  

  1. **Objection (Deliberative Democrat):**  
     *"This ignores how media framing, propaganda, and elite manipulation *create* voter biases. People aren’t independent; they’re sheep!"*  
     - **Concede:** "Absolutely—manipulation *is* pervasive, and correlated errors are a real threat."  
     - **Hold firm:** "CJT isn’t a description of reality but a *benchmark*. It shows why *breaking* correlation (via diverse media, citizen assemblies) is institutionally vital."  
     - **Reply (2 sentences):**  
       > "You’ve nailed why CJT *demands* deliberative safeguards. If we *don’t* foster diverse, independent thought, majority rule fails. CJT shows why democracy must actively combat manipulation—not abandon the vote."  

     *Rhetorical or substantive?* Mostly substantive. **Force:** Medium. They’ve a point on correlation, but CJT guides institutional fixes.  

  2. **Objection (Empiricist):**  
     *"What’s ‘competence’ when policies lack objective ‘right answers’? CJT assumes facts exist—but politics is values, not maths!"*  
     - **Concede:** "Policy debates often *do* lack single right answers. CJT works best on factual premises (e.g., ‘Will this policy cut emissions?’), not value trade-offs."  
     - **Hold firm:** "Many political questions *are* fact-dependent (e.g., economic forecasts, climate science). CJT strengthens democracy *where facts are contested but exist*."  
     - **Reply (2 sentences):**  
       > "Agreed—CJT can’t adjudicate values. But most real votes blend facts *and* values. If we design institutions to improve factual competence (e.g., expert testimony in assemblies), majority rule gets more legitimate *on the factual layer*."  

     *Rhetorical or substantive?* Substantive. **Force:** High if they corner you on value-laden issues. Retreat to "fact-adjacent" policies.  

  3. **Objection (Formal Theorist):**  
     *"Independence is mathematically essential to CJT. But in practice, social learning and shared information make errors *correlated*. Doesn’t this gut the theorem?"*  
     - **Concede:** "You’re spot on. Strict independence is unrealistic, and correlation *does* undermine CJT’s convergence guarantee."  
     - **Hold firm:** "The theorem still holds with *partial* independence. Diverse societies with fragmented media *mitigate* correlation—so CJT isn’t void, just probabilistic."  
     - **Reply (2 sentences):**  
       > "True, perfect independence is a fiction. But the key insight survives: *any* reduction in correlation (via decentralised information sources) pushes us closer to CJT’s ideal. It’s a reason to *engineer* independence, not discard majority rule."  

     *Rhetorical or substantive?* Crushingly substantive. **Force:** High. *Never* downplay this—concede and reframe.  

  4. **Tom’s Smug Epistocracy Bomb:**  
     *"If CJT values competence, why not weight votes by knowledge (e.g., tests)? That’d converge faster to truth!"*  
     - **Concede:** "Epistocracy *would* exploit CJT mathematically if we could *reliably* measure competence."  
     - **Hold firm:** "CJT’s democratic power is it *doesn’t require measuring individuals*. Majority rule aggregates *latent* competence without elitist gatekeeping or contested rankings."  
     - **Killer Reply (3 sentences):**  
       > "First, competence tests are manipulable and biased—undermining legitimacy. Second, CJT doesn’t need us to *know* who’s competent; democracy outsources that to aggregation. Third, epistocracy assumes an *aristocracy of knowledge*—but CJT shows democracy can be epistemically potent *without* that hierarchy. That’s uniquely democratic."  

     *Force:* High, but winnable. Hammer the "no measurement needed" point.  

  ---

  ### **The Nightmare Objection (Pray It’s Not Raised)**  
  **"When average competence dips below 0.5, CJT says majority rule is *worse* than random! Given low voter knowledge, aren’t we doomed?"**  
  - **Why it’s deadly:** It implies democracy *amplifies* error if voters are misinformed. Empiricists could cite studies showing "average competence" <0.5 on complex issues.  
  - **Reply (If Cornered):**  
    > "First, below-0.5 competence is disastrous for *any* decision rule—not just majorities. Second, CJT assumes a *binary* choice with a ‘correct’ answer, which is often oversimplified. Third—crucially—we can *raise* competence through education and deliberation. Abandoning democracy because voters are misinformed is a self-fulfilling prophecy."  

  ---

  ### **Strategic Concessions**  
  **Should you concede CJT requires ideal conditions? YES—and fast.**  
  - **Why it doesn’t hurt you:**  
    - CJT isn’t meant to describe reality; it’s a *conditional* argument: *"If* voters are somewhat competent and independent, *then* majority rule beats alternatives."  
    - This shifts debate to *"How do we get closer to those conditions?"* (e.g., via citizen assemblies, media reform)—which is your goal anyway.  
  - **Phrasing:**  
    > "CJT absolutely requires idealised conditions. But that’s its strength! It identifies *which* conditions make democracy epistemically powerful—so we can build institutions that achieve them."  

  ---

  ### **Summary Cheat Sheet**  
  | **Objection Source** | **Concede**               | **Hold Firm**                          | **Key Reply Trigger Words**          |  
  |----------------------|---------------------------|----------------------------------------|--------------------------------------|  
  | Deliberative Democrat| Manipulation happens      | CJT guides anti-manipulation design    | "Diversity breaks correlation"       |  
  | Empiricist           | No "right answer" for values | CJT applies to factual premises      | "Fact-adjacent judgments"            |  
  | Formal Theorist      | Independence is idealized | Partial independence still helps      | "Mitigate, not eliminate"            |  
  | Tom (Epistocracy)    | Weighting "works" in maths | Democracy avoids elitist measurement  | "No tests, no hierarchy"             |  
  | Nightmare (<0.5 comp)| Below 0.5 is catastrophic | Raise competence, don’t ditch democracy| "Self-fulfilling prophecy"           |  

  **Final Tip:** When Tom smirks, pivot to: *"Tom’s right that CJT isn’t magic. But it shows democracy’s unique potential: it turns *imperfect* voters into competent collectives—no philosopher-kings required. That’s not rubbish; it’s revolutionary."*  

  You’ve got this. Now go wipe that smirk off his face.
