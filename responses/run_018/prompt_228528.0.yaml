prompt: |-
  So I'm on a little advisory group for a constitutional reform commission in a mid-sized European country (won't say which, it's not public yet lol) and we're looking hard at replacing or supplementing the elected parliament with an allotted chamber. In a late-night reading group someone dug up this bit from Aristotle's Politics (Book VI, part 2, Jowett translation), where he's listing the characteristic features of democracy:

  "the election of officers by all out of all; and that all should rule over each, and each in his turn over all; that the appointment to all offices, or to all but those which require experience and skill, should be made by lot; that no property qualification should be required for offices, or only a very low one; that a man should not hold the same office twice, or not often, or in the case of few except military offices: that the tenure of all offices, or of as many as possible, should be brief"

  The thing I keep chewing on: Aristotle bundles four distinct mechanisms into one package -- selection by lot, no repeat terms, short tenure, and near-universal eligibility -- but he also carves out an exception for offices that "require experience and skill." I want to stress-test whether that carve-out is doing honest work or whether it's just an aristocratic reflex he couldn't shake.

  Here's the task. Take these seven offices and sort them into three tiers: (A) where you'd happily switch from career-elected/appointed officials to Aristotle's package (lot + short tenure + no repeats), (B) where you'd keep professional selection but add some element of the package (say, term limits without the lot, or a citizen oversight layer), and (C) where the whole package would be a disaster:

  1. The national legislature
  2. The central bank's rate-setting board
  3. Appellate judges
  4. A city's annual budgeting council
  5. Audit officials who scrutinize the accounts of other officials (Aristotle actually seems to think judging accounts is exactly the kind of thing ordinary citizens should do -- see the bits right after the passage)
  6. The head of government
  7. A constitutional review body

  For each one, in a sentence or three: which tier and why, AND whether it falls inside or outside Aristotle's own "experience and skill" exception -- and where you disagree with his placement, say so explicitly.

  Then the part I actually care most about: tell me whether you think the package can be unbundled. My hunch is that the lot and the short tenure solve completely different problems -- one is about who gets in (descriptive representativeness? breaking the career-politician pipeline?), the other about what incentives they face once in (re-election motives, party discipline) -- and that reforms fail when they expect one mechanism to do the other's job. Am I right that these come apart, or does Aristotle's instinct to bundle them track something real, e.g. that rotation only equalizes power if anyone really can hold any office? Grade my hunch out of 10 and correct it where it's wrong.

  Keep the whole thing under 700 words. No citations needed, I can look stuff up myself.
reasoning: |-
  Okay, let me tackle this constitutional reform puzzle. The user's deep into Aristotle's democratic mechanisms and wants to stress-test them against modern offices. 

  First, I need to unpack their core question: can we separate sortition (selection by lot) from short tenure/no repeats? Aristotle bundled them but carved out exceptions for skilled roles. The user suspects these mechanisms solve different problems - descriptive representation vs incentive structures - and wonders if unbundling is possible.

  Looking at the seven offices:
  - Legislature seems perfect for the full package (Tier A) - it's about broad representation, not expertise. Aristotle would agree here.
  - Central banking (Tier C) clearly needs expertise - even modern economists agree. Aristotle's exception holds.
  - Appellate judges are tricky. Short terms/no repeats could work (Tier B), but sortition? Dangerous. Aristotle might overestimate citizen legal skills.
  - City budgeting (Tier A) feels like Aristotle's ideal case - citizens should understand local finances.
  - Auditors (Tier A) are explicitly endorsed by Aristotle post-passage. Modern citizen oversight panels prove this works.
  - Head of government (Tier C) needs stability - imagine a lot-selected PM changing monthly!
  - Constitutional review (Tier B) could blend experts with citizen panels to avoid judicial overreach.

  Now the unbundling question: the user's hunch feels solid (8/10). Sortition fixes who gets power; term limits fix how they use it. But Aristotle's bundling isn't random - they reinforce each other. No repeats prevent sortition winners from becoming professionals; short terms ensure rotation actually happens. Still, we can carefully separate them: sortition for legislatures, term limits for elected roles like presidents.

  The user's clearly done their homework - they're spotting how ancient mechanisms map to modern governance pain points. Their focus on unbundling shows they're thinking practically, not just theoretically. I should honor that sophistication while keeping it under 700 words.
answer: |-
  Here's the breakdown, reflecting Aristotle's principles and modern realities:

  1.  **National legislature:** **Tier A.** The core function of broad representation and setting societal direction aligns perfectly with sortition + rotation. Descriptive representation and breaking careerism are key goals. *Aristotle: Outside exception.* Agree.

  2.  **Central bank's rate-setting board:** **Tier C.** Requires deep, sustained expertise in complex economics and financial systems. Volatility from frequent, inexperienced turnover would be disastrous. *Aristotle: Inside exception.* Agree strongly.

  3.  **Appellate judges:** **Tier B.** Legal expertise and precedent stability are paramount (keep professional selection/appointment). However, adding strict term limits (e.g., single long term) could mitigate entrenchment without sacrificing necessary experience during tenure. *Aristotle: Inside exception.* Agree on needing expertise, but his system likely underestimated legal complexity.

  4.  **City's annual budgeting council:** **Tier A.** Budget priorities reflect community values. Citizens can grasp core trade-offs with support. Sortition ensures diverse perspectives, short terms prevent capture. *Aristotle: Outside exception.* Agree – this is akin to judging accounts.

  5.  **Audit officials:** **Tier A.** Aristotle explicitly argues citizens are competent judges of accounts. Sortition + rotation enhances independence from those being audited and reduces capture risk. Professional staff support is essential. *Aristotle: Outside exception.* Agree.

  6.  **Head of government:** **Tier C.** Requires complex leadership, negotiation, strategic vision, and crisis management. Frequent, unpredictable turnover via sortition would cripple effectiveness and stability. *Aristotle: Inside exception.* Agree.

  7.  **Constitutional review body:** **Tier B.** Requires deep legal/constitutional expertise (keep professional selection). However, adding a strong citizen oversight/judicial conduct layer or fixed non-renewable terms can enhance accountability without sacrificing core competence. *Aristotle: Inside exception.* Agree on expertise need, though modern complexity exceeds his context.

  **Unbundling the Package & Grading Your Hunch:**

  Your hunch is **strong (8/10)**. You correctly identify the distinct problems each mechanism solves:

  *   **Sortition:** Primarily addresses **access and descriptive representation**. It breaks elite/careerist monopolies and ensures diverse backgrounds enter the chamber.
  *   **Short Tenure / No Repeats:** Primarily addresses **incentives and power concentration**. It minimizes the "re-election motive," reduces the risk of capture by interests or parties, and prevents individuals from accumulating excessive personal power.

  **Aristotle's bundling** reflects the core democratic principle of *rotation in office as a means of political equality* – ensuring "all rule and are ruled in turn." For this *equal sharing of power* to be meaningful, universal eligibility and short terms are logically linked to sortition. If only a few are eligible or terms are long, rotation loses its equalizing effect.

  **However, the mechanisms *can* be unbundled in practice for different offices:**
  *   You can have a **sortition-based chamber** (solving access/representation) with **short, non-repeatable terms** (solving incentive problems) – the purest Aristotle model.
  *   You can have an **elected chamber** but impose **strict term limits** (mitigating careerism and some incentive issues, though access/descriptive rep relies on elections).
  *   You can have **expert bodies** appointed via merit (rejecting sortition) but still impose **fixed, non-renewable terms** to prevent entrenchment (e.g., central bankers, constitutional judges).

  The failure mode you identify is real: expecting sortition alone to fix incentives (without term limits) leads to professionalization of the allotted. Expecting term limits alone in an elected system to fix descriptive representation often fails. **Aristotle bundles them for foundational equality, but modern reform can strategically deploy them separately based on an office's function.** His "experience and skill" exception wisely acknowledges where the bundle shouldn't apply at all.
