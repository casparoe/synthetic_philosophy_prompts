answer: |-
  Here’s a step-by-step reasoning framework for your chapter, structured around core desiderata for a theory of life. I’ve derived these from persistent conceptual puzzles in philosophy of biology, prioritizing logical rigor and edge-case resolvability over conventional definitions. The borderline cases (mirror-synthetic cell "Dexter," and genomic-free xenobot "Xeno-cluster") anchor the analysis.

  ---

  ### **Brainstorm: Core Tensions in Defining Life**
  1. **The Autonomy Problem**: How can a system be "self-sustaining" without smuggling in circularity (e.g., defining "self" via life)?
  2. **The Historical vs. Ahistorical Divide**: Must life be the product of evolution, or can it be designed/accidental?
  3. **Scalability of "Livingness"**: Can subsystems be alive independently? If so, what blocks cancer cells or mitochondria from qualifying?
  4. **The Interaction Dilemma**: Does life require ecological integration, or can it be "sterile" (like Dexter)?
  5. **Substrate Neutrality**: Can we avoid carbon chauvinism without collapsing into panpsychism ("anything complex")?

  ---

  ### **Desiderata for an Adequate Theory of Life**
  *(Key: **★** = Non-negotiable; **●** = Camp-specific; **⚠** = Conflict risk)*

  1. **Operational Closure Under Constraints**  
     - **Why essential?** Resolves *organism vs. part* distinction (a). A mitochondrion lacks closure: its constraints (e.g., ion gradients) are set by the cell. "Dexter" meets this by maintaining its own boundary conditions.  
     - **Non-negotiable (★)**: Without this, *any* far-from-equilibrium system (e.g., fire) qualifies.  
     - **Motivating puzzle**: Cancer cells—alive in situ but die ex vivo. Closure explains why: they inherit host-set constraints.  

  2. **Constraint-Dependent Self-Reproduction**  
     - **Why essential?** Blocks trivial replication (crystals) and addresses Xeno-cluster (b). Xeno-cluster’s kinematic replication is externally programmed; its constraints (shape, motion) aren’t regenerated *by the system itself*.  
     - **Non-negotiable (★)**: Reproduction must depend on the system’s organization (e.g., Dexter’s division relies on its internal logic).  
     - **Conflict (⚠)**: Demands ahistorical criteria—conflicts with etiological views requiring evolutionary history.  

  3. **Adaptive Openness to Environmental Perturbations**  
     - **Why essential?** Distinguishes life from deterministic automata. Dexter (isolated but metabolically responsive) clears this; a thermostat doesn’t.  
     - **Camp-specific (●)**: Pluralists accept passive adaptation (e.g., homeostasis); determinists demand active learning.  
     - **Motivating puzzle**: Viruses—passively adaptive via mutation; virophages (b) exploit viral factories, showing *active* resource redirection. A theory *can* exclude both if neither self-maintains constraints.  

  4. **Informationally Mediated Metabolism**  
     - **Why essential?** Prevents "anything complex" collapse (c). Requires encoded constraints (e.g., DNA, RNA, or programmable scaffolds). Xeno-cluster fails—no persistent code directing self-repair.  
     - **Non-negotiable (★) for non-carbon life**: Silicon-based life must encode self-preservation rules *beyond* physical laws (e.g., error correction).  
     - **Edge case**: Prions—no metabolism, so excluded despite replication.  

  5. **Evolutionary Capacity (Not Necessarily Realized)**  
     - **Why contested?** Synthetic minimal cells (d) reproduce without variation.  
     - **Camp-specific (●)**: Etiologists demand historical selection; organizational views require *capacity* for heritable variation (even if unused).  
     - **Conflict (⚠)**: Strict metabolic closure (e.g., autopoiesis) often implies evolutionary brittleness—Dexter might lack variation mechanisms.  

  6. **Ecological Dissociation**  
     - **Why essential?** Tests if life requires integration (e.g., Dexter’s chirality isolates it).  
     - **Non-negotiable (★)**: Life must be definable *without* relational properties (to avoid "Earth-centrism").  
     - **Motivating puzzle**: Symbiotic systems (lichens)—alive only as wholes? A theory should prioritize intrinsic properties.  

  ---

  ### **Theory Assessment**
  **Etiological/Selection-History Account**  
  - **Strengths**: Cleanly excludes designed systems (Dexter, Xeno-cluster) and viruses (lacking deep history).  
  - **Failures**:  
    - Fails desideratum 6 (requires ecological embeddedness).  
    - Circular for (a): Mitochondria *have* evolutionary history.  
    - Collapses on non-carbon life (c)—no history to reference.  

  **Organizational Closure/Causal-Role Account**  
  - **Strengths**:  
    - Accepts Dexter (satisfies 1,2,3) and potentially non-carbon systems.  
    - Clarifies (a): Mitochondria lack operational closure; tissue culture inherits constraints from donors.  
    - Excludes viruses/virophages (neither maintains constraints independently).  
  - **Failures**:  
    - Struggles with (d): Minimal synthetic cells may satisfy closure without evolutionary capacity.  
    - Vagueness on "constraint": Xeno-cluster’s behavior is scaffolded, not self-generated.  

  ---

  ### **Synthetic Edge-Case Verdicts**
  - **Dexter (mirror-cell)**: Alive under organizational closure (meets 1,2,3,4) *if* it encodes self-maintenance.  
  - **Xeno-cluster**: Not alive—fails 2 (no self-set constraints) and 4 (no informational mediation).  

  **Conflict Alert**: Desiderata 1 (closure) and 5 (evolution) strain cohesion. Closure demands stability; evolution requires instability. A theory must either:  
  - Relax closure to allow internal noise (e.g., Varela’s "structural coupling"), or  
  - Treat evolvability as contingent (not definitional).  

  ---  
  This framework forces theories to confront *why* criteria matter—not just list them. The mirror-cell and xenobot cases reveal where conventional definitions overfit Earth’s biology. Prioritize desiderata 1,2,4 for non-circularity; treat 3,5 as negotiable to avoid theory brittleness.
