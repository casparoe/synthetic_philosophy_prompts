  **Single Best Change:** Dropping (5) resolves Tensions 1 and 2 immediately and allows Tension 3 to be fixed by weakening (6). This is the **least costly** path:  
  - It preserves your signature positions (1, 2, 3, 4).  
  - The cost (weaker consistency) is localized to large-conjunction cases you already deem exceptional.  
