answer: |-
  Here’s a take on that chick-sexing case for your dataset, typos and all – typing fast like you asked, so excuse the rough edges:

  That whole japanese chick-sexing thing from the 1920s, where experts could flick their eyes over a day-old chick and instantly call male or female with crazy accuracy, yet couldn't explain *how* they did it, even to themselves, is pure gold for chewing on Ryle's knowing-how vs knowing-that. But let's not just restate Ryle dunking on intellectualists who think all knowledge boils down to knowing facts. The real bite comes when you ask: is this skill truly non-propositional, a pure know-*how* locked in the expert's perception and motor skills, or is it somehow built from a zillion microscopic, *tacit* propositional judgments – "this shade here," "that angle there" – that the expert never consciously strings together into a verbalizable rule? The experts insist they don't *use* propositions; they just *see* it. Their hands move faster than their language centers can follow. That screams non-propositional. Yet, you wonder, is the neural processing underneath somehow propositional-ish, even if fragmented and inaccessible? The theory gets fuzzy here – it doesn't force the skill to be *either* pure how *or* secretly built from that. It allows for a messy middle where perception and judgment fuse before language gets a look-in.

  Now, the killer twist: this skill didn't just live in brains. It lived *inside a specific institutional training pipeline*. Masters trained apprentices through years of supervised practice, correction, and immersion – not by teaching rules, but by shaping perception and reaction. When that pipeline collapsed in the US (cheaper tech, changing industry), the skill largely vanished. It wasn't just individuals forgetting; the *know-how* itself seemed to evaporate from the collective. This blows the doors off. If the knowing-how utterly depends on this social scaffolding – the masters, the feedback loops, the shared practice environment – to exist and persist, then is it really just an individual mental state? Ryle framed know-how as a *disposition* of the individual, but here, the disposition seems *constitutively dependent* on the social structure. The individual sexer is the *locus* of the skill in action, sure, the epistemic agent performing the judgment. But the *know-how agent* might be more like the *apprentice-master-institution complex*. The knowledge "exists" in the ongoing practice sustained by that complex.

  So, who are the epistemic agents? The individual sexer *exercises* the knowledge in the moment. But the *school* (or master-apprentice lineage) *sustains and transmits* it. The *industry* provides the context and demand that makes the practice viable. The knowledge itself is the reliable capacity to perform the sexing accurately. The evidence? Primarily the *success rate* in the real-world task, judged by the outcomes (e.g., correct sorting leading to efficient rearing). Crucially, the evidence *for the individual* is often the master's immediate "yes" or "no" during training – a social validation, not introspection or rule-checking. The theory (Ryle's distinction) is silent on this deep institutional dependency. It focuses on the individual's capacity versus their propositional articulation, not on the social ecology required for that capacity to emerge and survive.

  What does this show about the theory? It's less a simple confirmation or anomaly, and more like exposing a *blind spot*. Ryle brilliantly showed know-how isn't reducible to know-that. The chick-sexers confirm that brilliantly – their inability to articulate rules doesn't invalidate their skill. But the institutional collapse reveals something the distinction *never anticipated*: that some forms of knowing-how might not be robustly housed *within* the individual at all. They might be fragile, distributed, socially anchored phenomena. The know-how isn't *just* in the head and hands; it's in the *relationships and practices* that keep those heads and hands calibrated. So, the episode pushes the theory further, suggesting that for complex, perception-based skills transmitted tacitly, knowing-how might be fundamentally *ecological* – an individual capacity *scaffolded* and *sustained* by a specific social world, collapsing when that world does. That's the part the classic distinction didn't quite map.
