prompt: |-
  I got into this big debate with my coworker about whether a whole country can still be guilty for stuff that happened like eighty years ago, even when everyone who actually did it is dead. I read a little about this philosopher Jaspers—he was German, I think—and he said there isnt just one kind of guilt, theres criminal guilt, political guilt, moral guilt, and metaphysical guilt, and a nation can carry some of those across generations. I dont really know philosophy, I just think about weird stuff like this, but I work in commercial fishing management, so my head is full of legacy catch quotas, inherited permit debt, fleet consolidation liabilities, and regulatory cleanup obligations that stick to a boat long after the original owners are gone—like when a new company buys an old trawler that overfished in the 90s and now has to fund stock recovery.

  Can you restate Jaspers whole position on collective guilt—especially those four kinds and how they get passed down through generations—in the vocabulary I actually use: permits, inherited quotas, fleet debt, regulatory cleanup, and consolidation? Be honest in the translation, dont just force my words onto his ideas. Then give me the residue report: which parts map clean onto my fishing framework, which parts you have to distort to make them fit, and which parts have absolutely no counterpart in how we think about inherited obligations. I want to know whether the leftover pieces mean my vocabulary is missing something real, or if Jaspers was just being vague or confusing. After you do the translation and the residue report, please give me a brief structured summary in JSON with exactly these fields: "framework_used", "clean_mappings", "forced_distortions", "untranslatable_claims", "residue_interpretation", and "predicted_case_for_new_permit_owner".
