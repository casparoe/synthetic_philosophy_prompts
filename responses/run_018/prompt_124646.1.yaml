answer: |-
  Here's the translation of Jaspers' collective guilt framework into your fisheries management vocabulary, followed by a residue report and the requested JSON summary:

  **Jaspers' Four Guilt Types in Fishing Management Terms:**
  1.  **Criminal Guilt:** **Violation-Specific Permit Sanctions.** Like prosecuting an individual captain for illegal net use, this applies *only* to the specific person/organization who broke the law at the time. It dies with them. A new owner isn't jailed for the old captain's violations.
  2.  **Political Guilt:** **Legacy Quota Debt & Regulatory Cleanup Obligations.** This is the enforceable, inherited structural burden. When you buy a permit/business with a history, you inherit:
      *   **Negative Quota Balances (Debt):** Shortfalls from past overfishing that *must* be repaid via reduced future catches.
      *   **Cleanup Costs:** Mandatory contributions to stock recovery programs tied to the permit's history.
      *   **Consolidation Liabilities:** Constraints or costs linked to the permit's role in fleet overcapacity historically. This "debt" sticks to the *permit/business entity*, not the individual, enforced by the regulator (the "governing body").
  3.  **Moral Guilt:** **Violation of Industry Stewardship Code.** This is the personal failure of individuals *at the time* (owners, managers, captains) to uphold the unwritten ethical duty of sustainable fishing. Did they *knowingly* cheat the system, hide bycatch, lobby destructively? This is judged by peers and self. It dies with the individuals involved. A new owner might feel *shame* about the permit's history but didn't *personally* violate the code.
  4.  **Metaphysical Guilt:** **Collective Burden of Broken Trust.** This is the deep, intangible stain on the *entire industry's reputation* caused by historical mismanagement (even if legal then). It's the public's lost faith, the "fishing is destructive" narrative fueled by past events. Everyone *currently* in the industry bears some weight of restoring this trust, regardless of their personal or permit history. It's not a fine or quota, but a shared responsibility to rebuild legitimacy.

  **Residue Report:**

  1.  **Clean Mappings (Direct Equivalents):**
      *   **Political Guilt ↔ Legacy Quota Debt / Regulatory Cleanup / Consolidation Liabilities:** This is the strongest fit. The inherited, enforceable, systemic obligation tied to the *asset* (permit/business) is directly analogous. The regulator (state) imposes it, and it transcends individual owners.
      *   **Criminal Guilt ↔ Violation-Specific Permit Sanctions:** The focus on individual, punishable acts that *don't* transfer is clear in both frameworks.

  2.  **Forced Distortions (Concepts Stretched to Fit):**
      *   **Moral Guilt ↔ Violation of Industry Stewardship Code:** Jaspers' moral guilt is intensely *personal*. Distorting it to fit an "Industry Code" waters it down. Fisheries management is more focused on legal compliance and resource accounting than deep personal ethical reckonings among peers. The "judgment by peers/self" aspect is weaker and less formalized in fishing than in Jaspers' post-atrocity context.
      *   **Metaphysical Guilt ↔ Collective Burden of Broken Trust:** While the "stain" and "shared burden to repair" concept maps, Jaspers links it to a *universal human solidarity*. In fishing, the "solidarity" is more pragmatic (industry survival) than existential. The "burden" is also more about PR/legitimacy and less about a profound existential human failing.

  3.  **Untranslatable Claims (Jaspers' Concepts with No Fishing Counterpart):**
      *   **The Depth of Moral Guilt:** Jaspers' moral guilt involves profound personal anguish and responsibility before one's conscience and community for *allowing* or *failing to prevent* evil. Fisheries violations, even unethical ones, are generally seen as breaches of rules or stewardship, not existential failures of humanity. The *intensity and scope* of the moral reckoning Jaspers envisions has no equivalent.
      *   **Metaphysical Guilt as Existential Solidarity:** Jaspers' claim that *all humans* share a responsibility for evil done by others ("I am guilty because I am human and this happened") simply doesn't translate. In fisheries, the "burden of broken trust" falls only on *participants in that industry/system*, not all humans. It's sector-specific, not universal.
      *   **Intergenerational Transmission of Moral/Metaphysical Burden:** While political guilt (debt/cleanup) transfers legally to new permit holders, Jaspers suggests a more nebulous *ethical* burden passes to *future generations of the nation*. In fishing, the new owner takes on *contractual/regulatory* obligations tied to an asset, not an inherent *moral* burden just by being part of the same industry/nation. The "inheritance" is strictly economic/legal, not spiritual or identity-based.

  **Residue Interpretation:** The significant residue (especially untranslatable parts) shows **your vocabulary is robust for the *structural and legal* aspects of inherited obligations (Political Guilt), but lacks the depth for the *existential/ethical* dimensions Jaspers emphasizes.** Jaspers was grappling with the profound moral collapse of a society, demanding deep individual and collective soul-searching. Your fishing framework brilliantly captures the *mechanisms* of inherited, enforceable, systemic burdens (Political Guilt) and distinguishes individual culpability (Criminal Guilt). However, Jaspers' Moral and Metaphysical guilt require a vocabulary of deep personal conscience, universal human responsibility, and identity-based collective shame that simply isn't relevant or operational in the contractual, asset-based, and regulatory world of fisheries management. **The residue isn't vagueness in Jaspers, but a fundamental difference in context:** post-genocidal societal reckoning vs. managing an industrial resource with legacy issues. Your framework exposes the limits of Jaspers' concepts for purely structural inheritances.

