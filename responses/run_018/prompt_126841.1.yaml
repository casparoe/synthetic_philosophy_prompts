  Then point three introduces a twist: exponential growth with a fixed leak per round. They believe this shifts defection later due to changing opportunity costs. I need to verify if backward induction still applies here. If the pot grows faster but leaks, the trade-off between immediate defection and waiting changes. Each player might delay defection to capture more of the growing pot, but the leak adds decay. The key is whether the decay rate affects the subgame perfection. Actually, backward induction should still work step by step, recalculating payoffs at each node. So maybe their intuition holds, but they should test with specific numbers.

  Point four talks about needing a shared prior on rationality levels. That's valid because common knowledge isn't just about rationality but also mutual belief in others' rationality. Without that, backward induction breaks early. But point five suggests rejecting the common prior assumption dissolves the paradox, which seems contradictory. If there's no shared belief, players can't rely on others acting rationally, so cooperation might emerge. That's where the tension is—between needing a common prior for BI to work and rejecting it to explain cooperation.

