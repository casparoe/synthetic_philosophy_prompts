prompt: |-
  My roommate summarized Gould and Lewontin's spandrels critique for me like this: they argued that lots of traits aren't adaptations but spandrels—structural byproducts of other evolutionary changes, like the triangular spaces between arches. He said this means adaptationist explanations are usually just-so stories, since you can always cook up a function for any spandrel after seeing it. He also claimed that spandrels can never get co-opted for a new adaptive use, so when evolutionary psychologists say language is an adaptation they're automaticly wrong—language is probably just a spandrel of bigger brains. Something feels off about jumping from "some traits are spandrels" to "functional-looking traits are probably spandrels", and also about saying spandrels stay useless forever. Is this a fair summary? Which parts are accurate to what Gould and Lewontin actually argued, where are the subtle misrepresenations—especially the bit about co-option being impossible—and does his dismissal of evolutionary psychology actually follow even if we grant the spandrels point?
reasoning: |-
  Okay, let's tackle this user's query about Gould and Lewontin's spandrels critique. The user's roommate summarized it, but the user feels something's off. I need to break down the accurate parts and the misrepresentations.

  First, the roommate's summary has three main points: traits as spandrels, adaptationist explanations as just-so stories, and that spandrels can't be co-opted. The user questions the jump from "some traits are spandrels" to "functional-looking traits are probably spandrels" and the claim that spandrels stay useless forever. Also, the dismissal of evolutionary psychology based on language being a spandrel.

  I recall that Gould and Lewontin's 1979 paper criticized the adaptationist program. They argued against assuming every trait is an adaptation. Using the spandrel analogy, they pointed out that some features are byproducts. That part is correct. The paper did emphasize that adaptationists often create just-so stories without considering alternatives. So the roommate got that right.

  But where the roommate goes wrong is saying spandrels can't be co-opted. Actually, Gould and Lewontin specifically discussed exaptation—where a spandrel gains a function later. The example of language being a spandrel of brain size is something Gould suggested, but he allowed for co-option. The roommate's claim that spandrels stay useless is incorrect. 

  The user is right to question the leap from "some" to "probably" spandrels. Gould and Lewontin didn't say functional traits are mostly spandrels; they argued against assuming adaptation without testing. They advocated considering multiple hypotheses, like developmental constraints. The roommate overgeneralized here.

  Regarding evolutionary psychology, the user wonders if dismissing it is valid even if language is a spandrel. But Gould and Lewontin's critique was about methodology, not saying adaptations don't exist. They opposed assuming adaptation without evidence, not the field entirely. Plus, even if language started as a spandrel, it could be co-opted as an adaptation. Evolutionary psychologists often argue for language as an adaptation, but the spandrels critique urges caution, not outright dismissal.

  The user's deeper need seems to be understanding the nuances of the critique and avoiding oversimplification. They might be looking for a balanced view to discuss with their roommate or for academic purposes. They want clarity on how spandrels relate to exaptation and the validity of evolutionary psychology claims.
answer: |-
  That's an astute critique of your roommate's summary. While he captures some core elements, there are significant misrepresentations and oversimplifications, particularly regarding **co-option and its implications for evolutionary psychology**. Here's a breakdown:

  **Accurate Elements:**

  1.  **Critique of Adaptationism:** Gould and Lewontin strongly criticized the "adaptationist programme," which they saw as the dominant tendency in evolutionary biology to explain *every* trait, even minor or seemingly non-functional ones, as a direct product of natural selection for its current function.
  2.  **Spandrels as Analogy:** They used the architectural spandrel (the triangular space *necessarily* created when placing a dome on rounded arches) as an analogy for biological traits that are **non-adaptive byproducts of structural constraints or developmental processes**, not direct adaptations themselves. Their primary examples were things like the chin (likely a byproduct of jaw reduction), male nipples (resulting from a developmental plan shared with females), and possibly the large size of the human brain.
  3.  **Just-So Stories:** They argued that adaptationists often generate plausible-sounding functional explanations ("just-so stories") for traits *post hoc* without rigorously testing alternative hypotheses (like spandrels, developmental constraints, genetic drift, or phylogenetic inertia). They saw this as a methodological flaw.

  **Significant Misrepresentations & Oversimplifications:**

  1.  **"Spandrels can *never* get co-opted for a new adaptive use": This is completely false and directly contradicts Gould and Lewontin's argument.** This is the biggest error in your roommate's summary.
      *   **Gould and Lewontin's Actual Position:** They explicitly argued that spandrels (non-adaptive byproducts) are *prime candidates* for later co-option to serve a new function. Gould later coined the term **"exaptation"** (with Elisabeth Vrba) to describe this very process: a trait shaped by natural selection for one function *or* a non-adaptive spandrel is later co-opted for a new, beneficial function. **Co-option is central to the spandrels concept.**
      *   **Implication:** Your roommate's claim that language *can't* be an adaptation *because* it might be a spandrel is nonsensical under the actual framework. If language *started* as a spandrel (a byproduct of increased brain size selected for other reasons like general intelligence, social cognition, or tool use), it could absolutely have been subsequently co-opted and *shaped by natural selection* for its communicative functions. Evolutionary psychologists arguing language is an adaptation are typically referring to this *later shaping* for communication, not necessarily its absolute origin.
  2.  **Jumping from "Some Traits are Spandrels" to "Functional-Looking Traits are Probably Spandrels":** Gould and Lewontin never claimed functional-looking traits are *probably* spandrels. Their argument was:
      *   Adaptationists *assume* all traits are adaptations.
      *   This blinds them to *other possibilities*, including spandrels.
      *   Therefore, spandrels (and other alternatives) need to be *seriously considered and tested against*, not dismissed out of hand.
      *   They argued that *some* traits widely assumed to be adaptations *might be* spandrels (or explained by other non-adaptive factors). They were calling for methodological pluralism and caution against default adaptationism, not claiming spandrels are the dominant explanation for functional traits.
  3.  **"Spandrels Stay Useless Forever":** As explained above regarding co-option, this is directly contradicted by the core concept. Gould and Lewontin emphasized that spandrels are *initially* non-adaptive, but their *potential* for later exaptation is a key part of evolutionary innovation.

  **Regarding Evolutionary Psychology (EP) and Language:**

  1.  **The Spandrels Critique *Does* Apply:** Your roommate is correct that Gould (especially) was a vocal critic of some EP approaches. He felt they often fell into the adaptationist trap: assuming complex cognitive/behavioral traits *must* be direct, specific adaptations for Pleistocene problems, generating plausible just-so stories without adequately considering alternatives like spandrels (e.g., language as a byproduct of general brain evolution), developmental constraints, or cultural evolution.
  2.  **But the Dismissal Doesn't Automatically Follow:**
      *   **Exaptation:** Even if language *originated* as a spandrel, it could still have been extensively modified by natural selection for communication *after* its origin. EP arguments often focus on this *functional specialization*, which is compatible with an original spandrel status.
      *   **Methodology, Not Substance:** The valid part of the critique is methodological: EP needs to rigorously test adaptationist hypotheses against alternatives (including spandrels/exaptation, developmental constraints, cultural evolution) and avoid assuming adaptation is the *only* possible explanation. It doesn't *automatically* mean any specific EP claim (like language being an adaptation) is wrong.
      *   **Complexity:** Traits like language likely involve multiple evolutionary processes. Parts might be spandrels, parts might be ancient adaptations co-opted, parts might be direct adaptations shaped for communication. The critique urges EP to consider this complexity.

  **Conclusion:**

  Your instincts are spot on. Your roommate accurately summarized the core critique of adaptationism and the spandrel analogy itself. However, he made two critical errors:

  1.  **Major Misrepresentation:** He completely inverted Gould and Lewontin's view on co-option. They argued spandrels are *prime material* for later adaptive co-option (exaptation). His claim that spandrels "can never get co-opted" and therefore language *can't* be an adaptation is fundamentally wrong and contradicts the very point Gould and Lewontin were making.
  2.  **Overgeneralization:** He overstated the implication from "some traits are spandrels" to "functional-looking traits are probably spandrels." Gould and Lewontin advocated for *considering* spandrels as a viable alternative hypothesis, not assuming it's the most likely.

  **Regarding EP:** While the *methodological* critique of adaptationism applies strongly to some EP work (as Gould argued), your roommate's specific dismissal of language adaptation *based on the impossibility of spandrel co-option* is invalid. Language could be a spandrel *and* an adaptation through exaptation. The valid critique is that EP should not *assume* direct adaptation without testing against alternatives like exaptation.
