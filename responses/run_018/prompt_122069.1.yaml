answer: |-
  Here is a rigorous set of desiderata for a normative theory of Geometric Rationality (GR), addressing your specified pressure points. The criteria are framed as what the theory **must** deliver to be considered normatively adequate, not merely pragmatically useful.

  **Core Desiderata for an Adequate Theory of Geometric Rationality:**

  1.  **Ergodic Growth Recovery Without Exogenous Risk Aversion:**
      *   **Requirement:** Must recover the Kelly Criterion (maximize expected log-wealth) for repeated, independent, stationary bets *as a direct consequence of its core normative principle*, not by adding a separate risk-aversion parameter. The risk attitude must emerge intrinsically from the multi-period multiplicative growth perspective.
      *   **Motivation:** This is the foundational result of GR. Any theory claiming lineage must derive it naturally. Adding an exogenous risk parameter surrenders to Expected Utility Theory (EUT) and abandons the core geometric insight.
      *   **Non-Negotiable:** Yes (for a GR theory).
      *   **Hardness:** Requires a fundamental justification for *why* optimizing long-run growth via multiplicative dynamics is the *only* rational objective in this setting, excluding other growth metrics or time-averaging methods.

  2.  **Non-Collapsible Ontological Uncertainty:**
      *   **Requirement:** Must handle deep uncertainty over *which payoff structure or world-model is correct* (e.g., uncertainty over the true probability distribution, game rules, or existence of states) in a way that preserves the geometric perspective and does not reduce to standard Bayesian EUT with a concave utility function. The update mechanism and betting strategy must reflect the multiplicative nature of model uncertainty.
      *   **Motivation:** Real agents face uncertainty about the model itself (Knightian uncertainty, model misspecification). GR must offer distinct prescriptions from EUT here, as EUT conflates model uncertainty with outcome risk within a single utility function. GR should preserve the "betting to distinguish models" aspect crucial to its epistemology.
      *   **Non-Negotiable:** Yes.
      *   **Hardness:** Requires integrating Bayesian model averaging or similar with multiplicative growth optimization in a non-trivial way. Avoiding collapse means the geometric objective must fundamentally alter how model weights are used/updated compared to EUT, not just change the utility function applied within each model.

  3.  **Reflexive Bet Consistency (Endogenous Growth):**
      *   **Requirement:** Must provide rational betting prescriptions when the wager itself *causally influences the agent's future beliefs* (e.g., via information disclosure, costly measurement) or *alters the underlying outcome distribution* (e.g., prediction market impact, self-fulfilling prophecies, strategic opponents reacting to the bet). The geometric growth rate must be endogenous to the betting strategy.
      *   **Motivation:** Foundational for applications like prediction markets, strategic trading, self-modifying AI, and social epistemology. The classic Kelly result assumes an exogenous, fixed betting environment – a critical limitation. GR must extend coherently when this assumption fails.
      *   **Non-Negotiable:** Yes (for applicability to modern problems).
      *   **Hardness:** Requires solving complex fixed-point problems (choosing a bet `b*` such that the *resulting* growth rate `G(b*)` after the bet's reflexive effects is maximized). This fundamentally breaks the separation between belief and environment assumed in (1).

  4.  **Explained Systematic Deviation in High-Stakes One-Shot:**
      *   **Requirement:** Must normatively justify or consistently accommodate the empirically observed pattern that intelligent agents systematically deviate from log-optimal bets in high-stakes, non-repeated scenarios (e.g., Allais paradox choices) *without* dismissing the deviation as irrational noise *or* resorting to exogenous risk parameters grafted onto the core criterion.
      *   **Motivation:** A purely normative theory must either explain why the deviation is rational in that context or provide a framework where GR naturally transitions to a different norm under low-repetition, high-stakes conditions. Denying the data or patching with EUT-like risk aversion undermines GR's normative claim.
      *   **Non-Negotiable:** Conditionally Yes (The theory must *address* it normatively; simply observing deviation isn't enough. *How* it addresses it determines adequacy).
      *   **Hardness:** Reconciling long-run growth optimization with compelling intuitions for terminal wealth preservation in single-shot scenarios. Requires a fundamental link between the repetition structure of the decision problem and the appropriate normative criterion.

  5.  **Preserved Epistemic/Pragmatic Distinction:**
      *   **Requirement:** Must maintain a clear, non-reducible distinction between the goal of having accurate, calibrated beliefs (epistemic rationality) and the goal of optimizing outcomes via betting (pragmatic/instrumental rationality). It cannot reduce epistemic rationality *solely* to being optimally bettable according to the geometric growth criterion.
      *   **Motivation:** Beliefs serve purposes beyond betting (explanation, understanding, coordination). Collapsing epistemology into betting behavior risks instrumentalism and ignores the intrinsic value of knowledge. GR's strength is linking belief *to action*, not eliminating the distinction.
      *   **Non-Negotiable:** Yes.
      *   **Hardness:** GR intrinsically links belief and action via the Kelly stake (`f* = p - q`). Adequacy requires showing how calibrated beliefs are *necessary inputs* for optimal growth, but that the *goal* of calibration is distinct from the *goal* of growth. It must avoid defining "rational belief" *as* "belief that makes Kelly betting optimal."

  6.  **Principled Fractional Kelly:**
      *   **Requirement:** Must provide a *normative justification* for fractional Kelly betting (`f = k * f*_Kelly`, `0 < k < 1`) that emerges from the core geometric principle itself or from clearly articulated, rational auxiliary constraints (e.g., bounded resources, risk of ruin, model uncertainty), not as an arbitrary "risk aversion patch." It must explain why `k=1` is optimal only under specific conditions.
      *   **Motivation:** Fractional Kelly is ubiquitous in practice. An adequate theory must normatively ground its use, showing it as a rational adaptation of the core geometric principle to realistic constraints, not an admission of the theory's failure or a disguised switch to EUT.
      *   **Non-Negotiable:** Yes (for practical adequacy).
      *   **Hardness:** Requires rigorously deriving constraints like drawdown limits or ruin aversion *from* the geometric perspective or showing how model uncertainty (Desideratum 2) naturally leads to fractional betting as optimal *within* GR. Avoiding an ad-hoc `k` parameter.

  **Analysis of Joint Satisfiability & Tensions:**

  *   The core tension lies between **Reflexivity (3)** and the **Epistemic/Pragmatic Distinction (5)**, especially when combined with the requirement for **Ergodic Recovery (1)**.
  *   **Why (3) threatens (5):** Reflexivity blurs the line between belief and environment. If the act of betting *changes* the agent's beliefs (e.g., via information gain) or the world's probabilities (e.g., market impact), then the "epistemic state" is no longer independent of the "pragmatic action." The optimal `f*` depends on how betting affects future beliefs, and the belief update depends on the outcome influenced by the bet. This creates a feedback loop where belief formation is deeply entangled with the pragmatic goal of growth maximization, potentially collapsing the distinction.
  *   **Why (1) relies on (5):** The classic Kelly derivation assumes fixed, exogenous probabilities (`p`) independent of the bet size (`f`). This relies on a clean separation: epistemic rationality provides `p`, pragmatic rationality calculates `f*` based on `p` and the multiplicative goal. Reflexivity destroys this separation.
  *   **Can (3) be integrated while preserving (5)?** It's extraordinarily difficult. A theory might *assert* the distinction formally (e.g., define "pure belief" separately from "action's effect"), but the *prescriptions* for both belief update and betting under reflexivity will be co-determined by the overarching geometric growth goal, making the "pure epistemic" component instrumental to growth. This risks collapsing (5). Preserving (5) likely requires limiting GR's scope to non-reflexive environments or developing a highly nuanced meta-theory.

  **Brief Scoring Against Desiderata:**

  *   **Pure Kelly Criterion:**
      *   (1) Perfectly satisfies.
      *   (2) Fails (assumes known true model).
      *   (3) Fails catastrophically (assumes exogenous environment).
      *   (4) Fails (prescribes `f*` regardless of stakes/repetition).
      *   (5) Satisfies in simple settings, but the derivation links `f*` tightly to `p`.
      *   (6) Fails (only `k=1` is prescribed).

  *   **Fractional Kelly (`f = k*f*`):**
      *   (1) Satisfies only if `k=1`; otherwise violates the core derivation.
      *   (2) May partially address via reduced `k`, but lacks normative foundation.
      *   (3) Fails (no mechanism for reflexivity).
      *   (4) Addresses empirically by lowering stakes, but lacks normative justification *why* `k<1` is rational for one-shot.
      *   (5) Satisfies similarly to pure Kelly.
      *   (6) Fails (choice of `k` is typically ad-hoc or borrowed from EUT risk aversion).

  *   **Standard Bayesian EUT (with CRRA Utility `U(W) = W^(1-γ)/(1-γ)`):**
      *   (1) Fails (recovers Kelly only if `γ=1`, but `γ` is an *exogenous* risk aversion parameter, not derived from growth).
      *   (2) Satisfies technically via Bayesian updating and EU maximization, but collapses model uncertainty into the single EU calculation.
      *   (3) Can handle reflexivity in principle via extensive form games/equilibrium, but not from a geometric growth perspective.
      *   (4) Satisfies (can explain Allais via probability weighting or different `γ`).
      *   (5) Fails (often explicitly reduces epistemic rationality to calibration for optimal betting under the chosen utility function).
      *   (6) Satisfies trivially via choice of `γ`, but this is the *source* of the ad-hocness GR needs to avoid.

  **Verdict:** **Reflexivity (3) cannot be fully integrated with the required Epistemic/Pragmatic Distinction (5) while rigorously satisfying the assumptions underlying the classic Ergodic result (1).** A theory might achieve partial integration, but a fully consistent satisfaction of all three simultaneously under a pure geometric growth norm appears fundamentally problematic.
