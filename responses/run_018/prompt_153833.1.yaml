answer: |-
  Here's a breakdown comparing the tacit-consent argument and the normative-competence challenge regarding visitors' obligations to local conventions:

  **Core Arguments & Sources of Obligation:**

  1.  **Standard Tacit-Consent Argument:**
      *   **Premise:** By voluntarily entering and remaining within a community/state, visitors implicitly consent to abide by its prevailing social norms and conventions (like queuing, tipping, jaywalking laws).
      *   **Source of Obligation:** Consent (tacit/implicit). Obligation arises from the visitor's *choice* to be present, which is interpreted as agreement to the "social contract" or rules of the host community.
      *   **Nature of Obligation:** Primarily obedience/compliance. The visitor has a duty to follow the rules *as they are publicly understood and enforced*, regardless of personal understanding or agreement.
      *   **Justification:** Grounded in fairness (free-riding is unfair), reciprocity, respect for local autonomy, and social order/stability. It treats the convention as a rule to be followed.

  2.  **Normative-Competence Challenge:**
      *   **Premise:** Genuine consent or meaningful participation in a social practice requires understanding its *internal point*, values, and practical logic. A visitor lacking this competence cannot truly consent; their "compliance" is either robotic mimicry or risks misapplying the norm, potentially distorting the practice itself.
      *   **Source of Obligation:** Practical Understanding / Competence *leading to* Solidarity or Meaningful Participation. Obligation arises not from mere presence, but from the *capacity to engage with the practice authentically*. The primary initial duty is to *learn* and *understand*.
      *   **Nature of Obligation:** Primarily epistemic/developmental (acquire competence) *before* behavioral compliance. Compliance should ideally flow from understanding the practice's meaning and value within its context. The goal is meaningful participation, not just rule-following.
      *   **Justification:** Grounded in the nature of social practices (they are meaning-laden, not just rules), the value of authentic interaction, avoiding alienation or distortion, and respect for the practice *as a lived experience* rather than just a regulation. It treats the convention as a practice to be understood.

  **Key Differences:**

  | Feature           | Tacit-Consent Argument                     | Normative-Competence Challenge             |
  | :---------------- | :----------------------------------------- | :----------------------------------------- |
  | **Source of Obligation** | Tacit Consent (Choice to be present)      | Practical Understanding / Competence       |
  | **Primary Duty**  | Obedience / Compliance                     | Acquisition of Competence / Understanding  |
  | **Justification** | Fairness, Reciprocity, Order, Local Autonomy | Authentic Participation, Avoiding Distortion, Respect for Practice-as-Lived |
  | **View of Norms** | Rules to be followed                       | Meaningful practices to be understood      |
  | **Visitor's Role** | Rule-follower                              | Learner / Potential Participant            |

  **Handling Problematic Conventions:**

  1.  **Widely Violated Locally (e.g., Jaywalking where common, minor tax evasion):**
      *   **Tacit Consent:** Struggles significantly. If locals routinely ignore the rule, the claim that consent implies obligation to obey it weakens. Why bind the visitor to a rule the community itself disregards? The argument might collapse into requiring compliance only with *effectively enforced* rules, losing its normative force for mere conventions.
      *   **Normative-Competence:** Handles this better. Understanding *why* the norm exists *and why it's widely violated* is crucial. The obligation isn't blind obedience but understanding the practice's *actual* status – perhaps it's a largely obsolete rule, or violation is a tolerated sub-practice. Competence might reveal no strong obligation to comply *or* reveal the violation carries its own social meaning requiring understanding. The duty is to grasp the complex reality.
  2.  **Conventions with Heavy Symbolic Weight (e.g., Dress codes in sacred sites, specific greeting rituals, historical commemorations):**
      *   **Tacit Consent:** Can demand compliance but risks superficiality or offense. Following a dress code without understanding its sacred significance might technically comply but miss the point and potentially show disrespect through ignorance. It focuses on the external act, not the meaning.
      *   **Normative-Competence:** Excels here. The *whole point* is understanding the deep meaning and significance. Blind compliance is inadequate and potentially disrespectful or distortive. The obligation is *strongly* to acquire competence first to participate appropriately and respectfully. Compliance *without* competence is seen as hollow or even harmful.

  **Avoiding Moral Relativism:**

  *   **Tacit Consent:** Highly susceptible to collapsing into relativism. It essentially says "Follow the local rules *because* they are the local rules." This provides no critical resources to challenge deeply harmful or unjust local conventions (e.g., apartheid-era norms, caste discrimination norms). Obligation stems solely from location and presence.
  *   **Normative-Competence:** Offers *some* resistance but isn't immune.
      *   **Resistance:** By emphasizing *understanding*, it opens the door for critical evaluation. A visitor who truly understands a practice might recognize its internal contradictions or harmful consequences *even within the local context*. Competence doesn't *require* uncritical acceptance; it enables more informed judgment. It could be argued that respecting people requires understanding their practices *before* judging, but judgment isn't precluded.
      *   **Vulnerability:** It still grounds obligation primarily *within* the local context's meaning. While it avoids the "follow blindly" of relativism, its focus on internal understanding can make universal moral critiques harder to articulate from *outside* the practice's logic. It risks "meaning relativism" – if the practice's internal meaning justifies harm, competence might obligate acceptance of that justification.

  **Does Competence Undermine Consent Entirely?**

  **No, only situationally.** The competence challenge undermines the tacit-consent argument **specifically when the visitor genuinely lacks understanding of the practice**.

  *   **When Understanding is Present:** If a visitor, through effort or prior knowledge, *does* grasp the internal point and values of a convention, the competence challenge doesn't necessarily block consent-based obligations. Their compliance could then be seen as both competent *and* consensual (or at least informed).
  *   **Core Critique:** The competence challenge fundamentally argues that *mere presence is insufficient for genuine consent* regarding complex social practices. Tacit consent, it claims, is often a fiction when applied to norms requiring cultural understanding. Consent must be *informed* to be meaningful, and for social practices, this requires practical competence. Therefore, tacit consent fails *as a general justification* for obligating visitors to comply with conventions requiring nuanced understanding, because that understanding is typically absent upon arrival. It only "works" if competence is assumed or already present, which often isn't the case.

  **Conclusion:**

  The tacit-consent argument prioritizes stability, order, and a simple model of fairness based on presence, grounding obligation in a thin notion of consent. The normative-competence challenge prioritizes authenticity, meaningful participation, and respect for the internal life of social practices, grounding obligation in the need for understanding before meaningful compliance can occur.

  *   **Strengths:** Tacit consent is simple and clear for straightforward, well-enforced rules. Competence is far superior for complex, symbolic, or contested practices, demanding respect through understanding rather than just rule-following.
  *   **Weaknesses:** Tacit consent fails badly for widely violated or harmful norms and risks superficiality/relativism. Competence is more demanding, potentially impractical for every minor norm, and doesn't fully escape relativism's grip.
  *   **Relativism:** Neither framework offers a fully robust bulwark against moral relativism, though competence provides more tools for internal critique. Both ultimately derive significant normative force from the local context.
  *   **Competence vs. Consent:** The competence challenge doesn't destroy the *concept* of consent but powerfully argues that tacit consent based solely on presence is inadequate for generating meaningful obligations to comply with conventions requiring cultural understanding. It undermines tacit consent as a *general and sufficient* justification, particularly in cases of genuine visitor ignorance. Obligation arises from competent engagement, not just physical presence.
