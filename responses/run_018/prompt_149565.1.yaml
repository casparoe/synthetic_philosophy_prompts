  First, I need to ensure the three-phase structure creates the intended epistemic shift: Phase 1 should generate real choices that pattern the Allais paradox but framed socially; Phase 2 forces justification under constraints that expose the conflict; Phase 3 makes the axiom violation physically tangible. The social framing is crucial - by making outcomes collective ("group fund allocation"), we avoid individual loss aversion and highlight accountability narratives.

  For Phase 1's gamble pairs, I'm considering these parameters:
  - Pair A: Certain small gain vs probable larger gain with tiny ruin risk
  - Pair B: Probable moderate gain vs probable larger gain with identical ruin risk
  ...specifically calibrated so choosing certainty in A and risk-seeking in B violates independence. The "collective responsibility" language must make the $0 outcome feel like group failure rather than personal loss.

  In Phase 2, the vocabulary restriction is brilliant - forcing Defenders to either:
  a) Use EU language and condemn their own choice (exposing contradiction)
  b) Use narrative language and explicitly reject independence (with point penalties)
  The rationality bonus pool creates real-time tension: preserving independence gives bonus points but requires self-contradiction.

  Phase 3's physical card swap achieves two things:
  1) Makes the substitution paradox visible when preferences flip
  2) Scaffolds them to draft a "context-sensitive independence" axiom
  ...which must be formal, not intuitive. I'll provide a template to guide the mathematical phrasing without giving answers.

  Key facilitation challenges I anticipate:
  - Students will conflate narrative evaluation with simple risk aversion. The prompt must force distinction: "Is this about fearing losses, or about how the story changes meaning?"
  - The point system might feel artificial. Solution: Emphasize these represent "epistemic credibility" metrics.
  - Debrief must explicitly name what's absent: cardinal utility comparisons. We'll clarify this is about preference structure, not measurement.

  The final reveal - naming Allais only at the end - preserves the discovery aspect. All materials stay self-contained per request.
answer: |-
  Below is a self-contained classroom activity designed to meet your specifications. The structure forces students to confront the tension between formal rationality and narrative-driven choice through experiential learning.

  ---

  ### **Activity: The Coherence Dilemma**  
  **Time:** 75 minutes  
  **Participants:** 18 advanced students  
  **Materials:**  
  - Private choice sheets (Phase 1)  
  - Role cards (Defender/Auditor)  
  - "Gamble Cards" for physical swap (Phase 3)  
  - Scoreboard for points  

  ---

  ### **Phase 1: The Allocation Dilemma** (20 min)  
  **Setup:**  
  Students decide how to split a **100-point group fund** between two pairs of gambles. Frame outcomes as *collective accountability*:  
  > *"Your choices affect all seminar members. Points represent resources for a shared project."*  

  **Gamble Pairs:**  
  - **Pair A:**  
    - *Option A1:* **40 points guaranteed**  
    - *Option A2:* **90% chance of 50 points + 10% chance of 0 points**  
  - **Pair B:**  
    - *Option B1:* **10% chance of 40 points + 90% chance of 0 points**  
    - *Option B2:* **9% chance of 50 points + 91% chance of 0 points**  

  **Task:**  
  Each student *privately* allocates 50 points to Pair A (choose A1 or A2) and 50 points to Pair B (choose B1 or B2). Choices are locked without discussion.  

  > *Predictable Pattern:* Most will choose **A1** (certainty) and **B2** (risk-seeking), violating independence.  

  ---

  ### **Phase 2: The Defense Tribunal** (30 min)  
  **Roles:**  
  - Randomly assign 9 **Defenders** and 9 **Auditors**.  
  - Defenders justify their Phase 1 choices to an Auditor.  

  **Rules:**  
  1. **Language Constraints:**  
     - Defenders *must* use **one vocabulary only**:  
       - **Vocabulary 1 (EU):** "Expected points," "probability-weighted outcomes."  
       - **Vocabulary 2 (Scenario-Integrated):** "What we avoided," "the story of why we succeeded/failed," "accountability for paths not taken."  
  2. **EU Penalty:** If using Vocabulary 1, Defenders *must apply it consistently* to both pairs. Choosing A1 (certainty) then B2 (risk) *must* be condemned as incoherent.  
  3. **Coherence Points:**  
     - Auditors award **0–3 coherence points** based on logical consistency.  
  4. **Rationality Bonus:**  
     - Defenders gain **+5 bonus points** *only* if they preserve independence (e.g., condemn their A1+B2 choice as irrational). Using scenario-integrated language forfeits this bonus.  

  > **Key Tension:** Defenders feel the cost: *Save coherence with narratives (lose bonus) or uphold independence (condemn your choice).*  

  ---

  ### **Phase 3: Axiom Surgery** (20 min)  
  **Physical Swap:**  
  - Groups receive cards representing Pair A and Pair B.  
  - **Task:** Excise the "common consequence" (e.g., the 90% chance of 0 points in Pair B) and replace it with an *identical* alternative (e.g., "90% chance of winning 10 points").  
  - Observe if preferences flip (e.g., B1 now preferred over B2).  

  **Axiom Drafting:**  
  - Groups draft a **"context-sensitive independence"** axiom. Rules:  
    > *"Define a condition where substituting identical outcomes *preserves* preference *except* when the substitution alters the narrative context of accountability."*  
  - **Required Format:** Formal terms only (e.g., *"If X ≻ Y, then X ∪ Z ≻ Y ∪ Z unless Z modifies the counterfactual significance of X/Y's outcomes"*).  

  ---

  ### **Debrief** (5 min)  
  1. **Map the Phases:**  
     - *Phase 1:* Classic common-consequence violation (A1+B2), reframed as social accountability.  
     - *Phase 2:* Conflict between **ex-ante maximization** (EU’s "view from nowhere") and **ex-post accountability** (evaluating outcomes within avoided-alternative narratives).  
     - *Phase 3:* Independence isn’t "wrong"—but requires *contextual carve-outs* to avoid intransitivity.  

  2. **Name the Paradox:**  
     > *"You recreated the Allais Paradox. Violating independence isn’t a ‘bias’—it reveals how outcome meanings shift when embedded in stories of responsibility."*  

  3. **Explicit Limitations:**  
     - *"This activity couldn’t capture cardinal utility comparisons across risk contexts—a formal requirement for EU that we bypassed with points."*  
     - *"Scenario-integrated evaluation ≠ risk aversion. Ask: ‘Did you avoid A2 because you feared 0 points? Or because *failing when success was certain* tells a worse story?’"*  

  ---

  ### **Predictable Challenges & Mitigation**  
  - **Risk Aversion vs. Narrative Meaning:**  
    - *Facilitator Prompt:* "If Pair A2’s 10% failure rate feels worse than Pair B’s 91% failure rate, is it because the *certainty of A1* makes failure *blameworthy*, not just probable?"  
  - **Cardinal Utility Gap:**  
    - Clarify post-activity: EU requires measuring *how much* 50 points > 40 points under risk—a quantitative hole the exercise finessed.  

  ### **Outcome**  
  Students leave feeling the *structural pull* of narrative evaluation—not as irrationality, but as a competing logic of decision-making. The activity’s constraints force them to articulate why "rational" choice might demand violating axioms when outcomes are storied events.  

  ---  
  No citations, readings, or technical terms are used until the final reveal. The mechanics alone generate the insight.
