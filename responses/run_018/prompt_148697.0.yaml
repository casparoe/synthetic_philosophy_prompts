  ### **Relativity of "Now" - Classroom Game Design**  
  **Goal:** Viscerally experience the Rietdijk-Putnam argument through frame-dependent simultaneity, leading to the block universe conclusion.  

  ---

  ### **Materials (Prep with Index Cards)**  
  1. **Event Cards (30 total):**  
     - 6 events × 5 copies each. Label:  
       - E1: "Supernova in Andromeda"  
       - E2: "Earth Presidential Election"  
       - E3: "Mars Colony Vote"  
       - E4: "Asteroid Impact Alert"  
       - E5: "Proxima b Signal Received"  
       - E6: "Solar Flare Warning"  
  2. **Frame Decks (3 decks, 6 cards each):**  
     - Assign events based on **simultaneity in their frame** (see setup below).  
     - *Example:*  
       - Frame A (0.1c): E1, E2, E3, E4, E5, E6  
       - Frame B (0.4c): E2, E3, E4, E5, E6, E1  
       - Frame C (0.8c): E3, E4, E5, E6, E1, E2  
  3. **Velocity Cards (3 hidden):**  
     - A: "Your velocity: 0.1c → Present: E1,E2,E3,E4,E5,E6"  
     - B: "Your velocity: 0.4c → Present: E2,E3,E4,E5,E6,E1"  
     - C: "Your velocity: 0.8c → Present: E3,E4,E5,E6,E1,E2"  
  4. **Influence Tokens:** 15 beads/coins (5 per frame).  
  5. **Scoreboard:** Track points publicly.  

  ---

  ### **Setup: Event Simultaneity**  
  - **Pre-game:** Assign events to frames' "present" using a Minkowski diagram. For simplicity:  
    - Frame A (slow): Events simultaneous at t=0.  
    - Frame B (medium): Events simultaneous at t=0 in *their* frame (shifts E1 to past, E6 to future).  
    - Frame C (fast): Greater shift (E1/E2 past, E5/E6 future).  
  - **Key:** No event is present in all 3 frames. E.g., E1 is present in A and C but *not B*.  

  ---

  ### **Rules**  
  **Objective:** Maximize points by:  
  - Placing influence tokens on events in your "present."  
  - Trading to gain tokens, but *only if both frames agree the event is "now."*  

  #### **Core Mechanics**  
  1. **Trading Phase (Pair Negotiation):**  
     - Frames pair up (A-B, B-C, C-A).  
     - Frame X proposes: "I trade Influence for Event E#."  
     - Trade **only happens** if both agree E# is in their present (i.e., both have E# in their deck).  
     - If agreed, both place a token on E# and record the trade.  
     - *Limit:* 1 trade/pair/round.  

  2. **Scoring (Per Round):**  
     - **+1 pt/token** on an event in your present.  
     - **-2 pts/token** if event is *not* in your present (punishes cross-frame "non-local" coordination).  
     - **+3 pts** if your frame has tokens on *all* its present events (rewards internal consistency).  

  3. **Velocity Reveal (Round 3):**  
     - Players reveal hidden velocity cards.  
     - Events in their "present" **change** (e.g., Frame B loses E1, gains E7).  
     - Tokens on events no longer "present" **lose points** (retroactive invalidation).  

  ---

  ### **Timeline (90 Min)**  
  1. **Intro (5 min):**  
     - "You’re scientists in 3 spaceships. Each has a set of events happening *right now*. Trade to influence events, but only if you agree they’re simultaneous. Goal: Maximize points."  
     - **No theory lecture.** Hand out frame decks.  

  2. **Round 1: Discovery (15 min):**  
     - Frames trade in pairs (rotate: A↔B, B↔C, C↔A).  
     - *Predictable issue:* Frames assume shared reality. E.g., A and C try to trade E1 (both have it), but B rejects it.  

  3. **Round 2: Conflict (20 min):**  
     - Re-pair with new partners.  
     - *Contradiction emerges:*  
       - Frame A: "E1 is now!" (trades with C).  
       - Frame B: "E1 is past/future!" (refuses trade).  
     - Score penalties apply for invalid tokens.  

  4. **Round 3: Velocity Twist (15 min):**  
     - Reveal velocity cards. Present events shift.  
     - E.g., Frame B’s "now" loses E1 → Tokens on E1 lose points.  
     - Final trades with new simultaneity.  

  5. **Debrief (35 min):**  
     - **Q1:** "Why couldn’t you agree on what’s happening ‘now’?"  
       *(They’ll cite frame velocity → relativity of simultaneity)*  
     - **Q2:** "What does ‘E1 is real for A but not B’ imply about time?"  
       *(Guide: No universal present → events exist timelessly)*  
     - **Reveal Block Universe:**  
       - "In relativity, time is a dimension like space. Your ‘now’ is a slice of a 4D block. E1, E2, E3... all exist *always*."  
       - Map game events to spacetime diagram.  
     - **Q3:** "Why did cross-frame trades fail? What’s the ‘flow’ of time here?"  
       *(Key: No flow — the block is static. The game can’t simulate this; it requires theory.)*  

  ---

  ### **Predictable Issues & Fixes**  
  - **"Super-Observer" Attempt:**  
    - *Issue:* Frames nominate a "neutral" arbiter to define "real" events.  
    - *Fix:* "There is no universal frame. All motion is relative — you’re in deep space with no ‘God’s eye view.’"  

  - **Blame-Shifting:**  
    - *Issue:* "Frame B is wrong for not accepting E1!"  
    - *Fix:* "Is B’s measurement invalid? Check their velocity card later." (Velocity reveal forces humility.)  

  - **Score Exploits:**  
    - *Issue:* Frames avoid trading to dodge penalties.  
    - *Fix:* Award bonus points for completed trades (+1 pt/trade) to incentivize engagement.  

  ---

  ### **What the Game Can’t Simulate**  
  - **The Static Block Universe:**  
    - The game has sequential rounds, implying temporal flow. Emphasize in debrief: *"Relativity kills flow. The block has no ‘moving now’ — your experience of flow is emergent."*  

  - **Causal Structure:**  
    - The game simplifies spacelike separation (trades ≠ causality). Clarify: *"IRL, you can’t influence spacelike-separated events. Trading represented attempted coordination, not causation."*  

  ---

  ### **Why It Works**  
  - **Visceral Tension:** Players *feel* the frustration of incompatible "nows."  
  - **Velocity Twist:** Retroactive scoring mirrors how velocity changes simultaneity.  
  - **Debrief:** Emergent block universe — they argue themselves into it.  

  **Prep Time:** 30 min (label cards, test trades).  
  **Outcome:** A heated, personal grasp of "no shared now" → smoother block universe intro.
