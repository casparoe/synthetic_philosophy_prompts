     - Round 1 (20 minutes): Trading. Frames can pairwise meet. In a meeting, they can trade event cards if they have an event in common. When they trade, they exchange influence tokens on that event. Specifically, each frame gets a red token for the event they traded. They place it on the event card. This trade is recorded by a referee.
       - But note: they can trade the same event multiple times? Probably not, so once an event is traded between two frames, it cannot be traded again.
     - Round 2 (10 minutes): Reveal velocity. Each frame reveals their velocity card. If it's "fast", they return one event card and receive a new one according to the mapping above. For example, Frame A returns E2 and receives E4.
     - Round 3 (10 minutes): Trading again. Now with new event sets. They can trade again, but only on events that are present in both frames and haven't been traded before.

     Scoring:
     - For each event in your present set that you have not traded away, you get 1 point.
     - For each trade you made (red token) on an event that is still in your present set after the velocity reveal, you get 2 points. If the event is no longer in your present set, you lose 1 point (because the trade is now invalid).
     - Additionally, if you have an event that is only in your frame (not shared with any other frame in any trade), you get 1 bonus point.

     This scoring rewards frames that are consistent and punishes those who coordinated across frames that are now invalid.

     The contradiction: after the velocity reveal, some events are no longer present, so the reality of those events is frame-dependent and can change. This simulates the relativity of simultaneity.

     Debrief (20 minutes):

     - Start by asking: What happened? How did the velocity reveal change your reality?
     - Then: Was there a universally agreed set of events that are real?
     - Guide them to see that what is real (present) is frame-dependent.
     - Introduce the block universe view: all events exist timelessly, and the present is just a local property. There is no universal now.
     - The Rietdijk-Putnam argument: if you try to define a universal now, you run into contradictions because of the relativity of simultaneity.

     What will predictably go wrong:
     - They might try to create a "super-observer" to break the tie. For example, they might want to use the rest frame of the Earth or something. Handle it by saying: "In this simulation, there is no privileged frame. You are in deep space, and there is no absolute rest."

     What the game cannot reproduce:
     - The game cannot reproduce the idea that there is no flow of time at all. In the game, there is a sequence of rounds, which suggests a flow. The block universe view is that the entire spacetime is static. You have to explain that separately.

     This is a complex game to design on the fly. I hope this gives you a starting point.
