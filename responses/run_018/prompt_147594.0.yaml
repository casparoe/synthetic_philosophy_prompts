prompt: |-
  I've been prepping my grad seminar on just war theory and I keep tripping over the moral equality of combatants thing, probably becuase I read too much revisionist stuff over the summer and now I can't see Walzer's view clearly. Here's my confusion, which my students will probably share: if the thesis is that unjust combatants aren't more blameworthy for killing than just ones — that they share the same rights and liabilities — then doesn't that imply that a soldier fighting for an unjust cause actually acquires a kind of moral licence that cancels out the defender's ordinary right to resist? In ordinary self-defence, if someone unjustly attacks me, my right to stop them doesn't depend on them having some reciprocal right to hurt me back. But in war, if both sides are morally equal, it looks like the aggressor's permission to kill is on a par with the defender's permission to defend, which seems to erase the asymetry that makes defence justified in the first place. So is Walzer actually committed to saying that just combatants have less of a claim to defend themselves than they would in a non-war context? And if not, where exactly does the asymmetry live?

  I've also been wondering whether this whole framing assumes something like a contractualist reciprocity that only made sense when combatants faced each other with comparable vulnerability. In modern conflicts where one side relies heavily on autonomous systems and there's no mutual risk or recognition, could the equality thesis be a kind of historical artifact rather than a normative principle? I'd like my students to wrestle with whether the equality is descriptive of a particular battlefield reciprocity or genuinely normative, but I'm not sure I've got the distinction right myself. Could you help me sort out where the false move is in my reasoning, and whether there's a way to preserve the asymmetry of jus ad bellum without collapsing into the revisionist view that unjust soldiers are basically murderers? Please answer in British English, and don't worry about citing specific texts — I just want to think through the structure of the argument.
reasoning: |-
  Okay, the user is preparing a grad seminar on just war theory and is confused about the moral equality of combatants, particularly Michael Walzer's view. They've been reading revisionist literature, which complicates their understanding. Their main concern is whether Walzer's thesis implies that unjust combatants gain a moral license that cancels the defender's right to resist, erasing the asymmetry that justifies defense. They also question if the equality thesis relies on reciprocal vulnerability, which might be outdated in modern warfare with autonomous systems.

  First, I need to address their confusion about moral equality versus asymmetry. The user thinks that if both combatants have equal rights to kill, then the defender's right to resist is undermined. But Walzer's point is that combatants on both sides have an equal license to fight due to their role as soldiers, not because their cause is just. The asymmetry lies in jus ad bellum—only one side has a just cause. However, jus in bello applies equally, meaning soldiers on both sides can kill without being murderers, provided they follow the rules of war.

  The user also brings up the analogy to self-defense. In civilian life, an aggressor doesn't have the right to attack, so the defender's resistance is unopposed. But in war, the context changes because soldiers are seen as instruments of the state. Walzer separates the moral assessment of the war (jus ad bellum) from the conduct within it (jus in bello). This separation allows unjust soldiers to have combatant rights without justifying their cause. The defender's right to resist isn't diminished; it's that the unjust soldier isn't a criminal for participating, as long as they follow the rules.

  Regarding modern warfare and autonomous systems, the user questions if the equality thesis is based on mutual vulnerability. Walzer's principle is normative, tied to the role of soldiers, not contingent on reciprocity. However, the user can challenge this by discussing whether reciprocity is a hidden assumption. If one side uses drones without risk, does the equality still hold? This could highlight if the principle is descriptive or normative.

  The user's deeper needs might include wanting to present Walzer's view clearly despite revisionist critiques, preserving the asymmetry of just cause without demonizing unjust soldiers. They also want students to engage critically with the applicability of these principles today. I should clarify Walzer's separation thesis and emphasize that the defender's moral high ground in jus ad bellum isn't negated by jus in bello equality. Also, addressing the role of mutual risk in the historical context versus modern tech, encouraging students to evaluate if the principle needs adaptation.
answer: |-
  Right, let's untangle this knot – you've put your finger on precisely where Walzer's symmetrical *jus in bello* rubs most uncomfortably against the asymmetrical *jus ad bellum*. Your students are likely to feel the same friction. The key is understanding *where* Walzer locates the asymmetry and *what* the moral equality of combatants actually entails (and crucially, what it *doesn't*).

  Here's the structure, dissected in British English:

  1.  **The Core of Walzer's Symmetry (MEC):** Walzer's Moral Equality of Combatants (MEC) states that soldiers fighting *for* a just cause (*jus ad bellum*) and soldiers fighting *for* an unjust cause possess the *same* set of permissions and liabilities *during* combat (*jus in bello*). Specifically:
      *   Both possess a "liberty right" to kill enemy combatants.
      *   Both are legitimate targets for enemy combatants.
      *   Neither is, *simply by virtue of fighting for an unjust cause*, a criminal (like a murderer) for killing enemy soldiers *who are also combatants*.
      *   The judgement of *jus ad bellum* falls on the *state/political leadership*, not primarily on the individual soldier executing their orders.

  2.  **The Crucial Distinction: Combatant Status vs. Cause:** Walzer separates the *role* of the combatant from the *justice of the cause*. The MEC flows from the idea that soldiers, once recognised as combatants under the war convention (wearing uniforms, carrying arms openly, etc.), enter a specific moral and legal sphere. They become *functionaries* of their state, and their violent actions are governed by the special rules of war. This status *grants them the licence to kill other combatants* and *makes them liable to be killed*, **regardless of the underlying justice of their state's war**.

  3.  **Where the Asymmetry Lives (It Doesn't Vanish):** You're right to feel the asymmetry *must* persist somewhere. For Walzer, it lives firmly in the realm of **jus ad bellum** and the **overall moral judgment of the war**.
      *   **The Aggressor State/Political Leaders:** They bear the primary moral guilt for starting an unjust war. They violate international law and fundamental morality.
      *   **The Just Combatants' Cause:** Their violence is *instrumental* to a morally permissible end (defence against aggression, stopping mass atrocities). Their *war* is justified.
      *   **The Unjust Combatants' Cause:** Their violence is *instrumental* to an *immoral end*. Their *war* is unjustified.
      *   **The *Point* of Fighting:** The just combatants are fighting *for* the right (defence, stopping evil). The unjust combatants are fighting *against* the right (perpetuating aggression or injustice).

  4.  **Addressing Your Self-Defence Analogy (The False Move):** Here's where your reasoning trips up, and it's a common pitfall:
      *   **Civilian Self-Defence:** You're absolutely correct. The unjust aggressor has *no right* to attack you. Your right to defend yourself is paramount and unopposed by any equivalent right of the attacker. The aggressor is a *wrongdoer* whose actions forfeit their normal right not to be harmed in that specific defensive context.
      *   **Combatant Self-Defence (in Walzer's View):** Walzer argues this analogy breaks down because of the **special status of combatants**. When two uniformed soldiers face each other, *both* are acting within the role granted by the war convention. The unjust soldier is *not* seen as a mere private wrongdoer like a mugger. They are a *combatant*. Therefore:
          *   The just soldier defending themselves against the unjust soldier *is* exercising a right, but the unjust soldier, *by virtue of their combatant status*, also possesses a *limited, role-based licence* to fight. This licence doesn't make their *cause* just, nor does it make their killing *morally equivalent* in the grand scheme. It simply recognises that *within the specific context of armed conflict*, they are not criminals *for fighting as soldiers*.
          *   **The licence isn't reciprocal *morally* in the cause, but *operationally* in the role.** The unjust soldier's licence doesn't *morally justify* their killing (their cause is still wrong), but it *prevents their act of killing enemy soldiers from being classified as murder.* They are "licensed" by the conventions of war, even if their war is unjust. This licence is contingent on adherence to *jus in bello* rules.
      *   **Does this diminish the just combatant's right to defend?** Walzer would say *no*. The just combatant retains the full right to defend themselves, their comrades, and their cause. The difference is that *the enemy they face is not a criminal in the act of fighting*, but a fellow combatant operating under the same war convention. Their right to resist the *unjust war* and defend their *just cause* is undiminished; it's the *moral classification of the enemy soldier's act* that changes due to their combatant status.

  5.  **The Reciprocity & Vulnerability Point (A Damn Good Question):** You've hit on a powerful critique. Walzer's MEC *is* heavily influenced by a model of warfare based on mutual recognition and shared vulnerability between combatants ("a kind of equality of risk"). In his framework, the shared fate on the battlefield fosters a form of moral reciprocity underpinning the war convention.
      *   **Descriptive vs. Normative:** Walzer presents MEC as a **normative principle** derived from the nature of combatant status and the need for *jus in bello* rules to function independently of the fog of *jus ad bellum*. However, its historical *plausibility* and *psychological acceptance* undoubtedly rested on that descriptive reality of reciprocal risk and recognition between opposing soldiers.
      *   **Modern Warfare Challenge:** When one side employs autonomous drones, cyberattacks from bunkers thousands of miles away, or overwhelming technological superiority eliminating mutual risk, the *descriptive foundation* crumbles. Does this undermine the *normative* principle?
          *   **Walzerian Defence:** A strict Walzerian might argue the principle remains normative – combatant status, not vulnerability, grants the licence and liability. A drone operator is still a combatant performing a military function.
          *   **Critique:** Others (and revisionists pounce here) argue that without reciprocal risk and recognition, the very *moral logic* of MEC weakens. If the unjust aggressor faces no personal risk while inflicting violence, do they truly inhabit the same moral sphere? Does their "combatant status" retain the same normative weight? Your instinct is spot-on: this *does* make MEC look like a historical artifact in asymmetric conflicts. It forces the question: is combatant status defined *only* by function for one's state, or does it require some element of shared exposure?

  **Conclusion for Your Seminar:**

  *   **Walzer's Asymmetry:** Lives entirely in *jus ad bellum* and the overall moral judgment of the war/leadership. The *just cause* gives the just combatant's violence its ultimate moral grounding.
  *   **Walzer's Symmetry:** Lives in *jus in bello*. Combatant status grants both sides the *same operational licence to kill enemy combatants* and the *same liability to be killed*, irrespective of *jus ad bellum*. Unjust soldiers are not murderers *for fighting as soldiers* (assuming *jus in bello* adherence).
  *   **The "Licence":** It's not that the unjust soldier acquires a *moral justification* they lacked before. They acquire a *role-based permission* within the war convention that *shields their acts of killing enemy soldiers from being classified as ordinary murder*. This doesn't cancel the defender's right to resist; it redefines the nature of the attacker (as a fellow combatant, not a criminal).
  *   **The Revisionist Challenge:** Revisionists argue this separation is incoherent – how can it be permissible to kill someone (the just combatant) when they are doing nothing wrong? Walzer's answer is the combatant status itself creates a sphere where the *ordinary* moral rules are suspended *between combatants*.
  *   **The Reciprocity Question:** This is your key lever for critical discussion. Is MEC a timeless normative principle based purely on function, or was its historical force and plausibility contingent on mutual vulnerability and recognition? Does modern warfare expose a flaw in the principle itself, or just in its application?

  **To preserve asymmetry without calling unjust soldiers murderers,** you have to hold fast to Walzer's separation thesis: the moral taint of the unjust *war* falls on the leaders and the *cause*, while the individual soldier's acts of fighting *as a soldier* are governed by the distinct, symmetrical rules of *jus in bello*. The unjust soldier's "licence" is procedural (war convention) and role-based, not a deep moral vindication. The defender's right to resist is robust, but the enemy they face is categorised differently than a civilian aggressor. It's messy, but that's Walzer's structure. Good luck with the seminar – wrestling with this tension is exactly where the deepest learning happens!
