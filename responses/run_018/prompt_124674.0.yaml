prompt: |-
  ok so i'm putting together my view on consciousness for a seminar and want a consistency check before i embarrass myself. here's where i've landed: (1) there's no cartesian theater, experience doesn't come together in one spot. (2) dennett's multiple drafts idea is mostly right - parallel streams get edited, no canonical version of events. (3) but i still want to say there's a real line between conscious and unconscious mental states, not just a sliding scale of access or broadcasting. (4) the explanatory gap feels hard mostly because we smuggle in theater-model intuitions, so it's partly an artifact. (5) still, i think being in one particular draft-state genuinely has phenomenal character, it's not just information processing with a fancy label. (6) zombie arguments are wrongheaded because they assume you could have all the drafts running with none of them being "present" to anything, which presupposes the theater. (7) with blindsight, i think there's actually a fractured draft-awareness in the scotoma - not full consciousness, but not absolute zero either, more like a draft that lacks the usual integraion markers. do these hang together? the real tensions i see: does (3) conflict with (1)-(2) since drafts have no owner? is (4) compatible with (5) or does dissolving the gap dissolve the phenomenon? does (6) clash with (7) since both deny full consciousness in different ways? also check if there's an apparent conflict between (5) and (2) about draft-ownership that goes away once you think about it. rank the tensions by severity, say what'd have to give in each case, and tell me which single revision cleans up the most. don't worry about citations, i just want the audit.
