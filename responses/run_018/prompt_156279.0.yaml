  But I shouldn't ignore counterarguments. Ramsey loved formal systems and might admire the linguistic machinery. Still, his 1926 critique of empty tautologies suggests he'd distinguish sharply between syntactic brilliance and substantive reasoning. The practical anchoring test seems decisive.

