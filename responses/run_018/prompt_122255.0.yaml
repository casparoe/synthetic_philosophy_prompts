prompt: |-
  I am a novelist, and my most recent book has brought me an invitation I am not sure I should have accepted. There is a scene in which the narrator — cut off in a storm, coming to suspect that every belief she has about the world may have been planted in her — works her way to a version of the cogito and takes it to settle more than it does. Her reasoning runs roughly like this: she can be wrong about anything, but that very liability, the fact that her believing can misfire, is not something she can be wrong about; therefore she is, and is the single persisting someone she remembers being. Readers have written to me about that passage more than about anything else in the novel, and a sixth-form college has now asked me to spend fifty minutes with a group of eighteen-year-olds who have all read it. They have no philosophy teaching to speak of, no Latin, and one shared text: my book. I take that to be part of the problem rather than part of the solution, since I have come to think the passage is doing two quite different things at once, and only one of them belongs to Descartes.

  So I do not want an explanation of the cogito. I want a plan for teaching, in a single fifty-minute session, what the cogito actually establishes and — more to the point — how much less it establishes than my narrator supposes. Please give me: the order in which the pieces must arrive, and why each has to be in the room before the next can land; the one example or case you would build the session around, including a judgement about whether my narrator's version can carry that weight or will actively mislead, and what a case would need to have and to lack in order to carry it; the misconceptions this particular audience will bring — bearing in mind that they have already watched a first-person voice perform the move confidently and be rewarded for it — and the exact point in the sequence at which each should be headed off; one question I could put to the room at the end that would tell me whether they have the distinction rather than the atmosphere; and an explicit note on what I should decline to explain at this level and say plainly that I am declining, since I would far rather leave something honestly unnamed than gesture at it.

  Two constraints. First, I am a novelist and not a philosopher, and I will not be able to field any question about what Descartes's own text says: the plan has to work without appeal to any passage, and without my claiming an authority I do not have. Second, I do not want to spend the hour convicting my own character of a fallacy. If her reasoning fails, I would rather the room finds that out than is told it, and I would like to know where in the sequence that discovery could be arranged to happen on its own.

  Format: at most six numbered steps, each headed by the one sentence you would want the room able to repeat back to you at the end of it, followed by a single closing paragraph on what I should refuse to explain. The whole thing under 700 words.
reasoning: |-
  Hmm, the user is a novelist who's been invited to discuss a philosophical passage from their book with 18-year-old students. The passage involves a narrator who misapplies Descartes' cogito during a crisis. The students have no philosophy background, only the novel as reference.

  The core challenge is designing a 50-minute session that:
  - Shows what the cogito actually establishes
  - Reveals how much less it proves than the narrator claims
  - Avoids direct philosophical expertise
  - Doesn't embarrass the author about their character

  Key structural needs:
  Must flow logically with each step building on the last. Needs concrete examples to anchor abstractions. Must preempt misconceptions from the novel's portrayal. Should culminate in self-discovery of the narrator's error.

  For the central example: A vivid case study showing the gap between thinking and personal identity. The narrator's storm scene won't work as it carries emotional weight that overpowers logic. Better to use a neutral hypothetical like sudden amnesia.

  Critical misconceptions to address:
  That "I think" proves: (1) Memory is reliable (2) There's a continuous self (3) The self is substantial. These must be dismantled sequentially.

  The revelation point: Around step 4 when the amnesia case makes continuity feel doubtful. The character's error should emerge from the students' own realization.

  Final diagnostic question: Needs to test grasp of the is/does distinction without philosophical jargon. Something like "If a robot said 'I think', would that prove it was conscious?" would reveal if they confuse appearance with substance.

  What to refuse: Any metaphysical questions about consciousness or Descartes' broader philosophy. Explicitly bracket those as beyond scope.

  The six-step sequence should:
  1. Establish universal doubt
  2. Find the indubitable "thinking" core
  3. Separate thinking from content
  4. Challenge memory-based identity
  5. Distinguish existence from essence
  6. Contrast narrator's overreach

  Each step needs a memorable takeaway sentence for repetition. Total under 700 words with clear refusal boundaries.
answer: |-
  Here is a six-step teaching plan (697 words):

  1.  **"Doubt can challenge almost any specific belief I have, even my name or my memories."**  
      Begin with the *power* of doubt your narrator felt. Use a relatable example: Ask students to imagine waking up with amnesia after an accident – no name, no memories. Could they be wrong about *who* they are *right now*? Yes. This mirrors the narrator's starting point and isolates doubt's force against specific beliefs.

  2.  **"The fact that I am doubting, or thinking *anything at all*, is the one thing I cannot genuinely doubt while I'm doing it."**  
      Shift to the indubitable core. If they are imagining amnesia or doubting their past (Step 1), *that act of thinking itself* is happening. Ask: "Can you truly doubt that you are *right now* thinking about doubting?" Highlight the difference: Doubting *specific things* (Step 1) vs. the undeniable *activity* of doubting/thinking happening. This is the true "I think" moment – establishing only that *thinking is occurring*.

  3.  **"This thinking proves *that* something exists ('I am'), but not *what* that something is."**  
      Clarify the minimal conclusion. "I am" simply means "Thinking is happening, therefore *something* capable of thinking exists here/now." Avoid saying "I". Use neutral terms: "There is thinking going on, so *a thinker* exists *at this moment*." Contrast with the narrator's leap: She took "I think" to confirm *her specific, remembered self*. Step 3 shows the cogito only establishes bare, momentary existence *as a thinker*, not *who* or *what* that thinker is.

  4.  **"My sense of being a single, continuous person relies on memory, which the initial doubt showed could be faulty."**  
      Target the narrator's error (persisting self) using her own tool (doubt). Recall the amnesia example (Step 1): If memory can't be trusted, how can we *know* the "I" thinking now is the *same* "I" as yesterday? The cogito (Step 3) only guarantees a thinker *exists now*; it says nothing about that thinker existing 5 minutes ago or being the *same* thinker as before. **Here, the discovery happens:** Students see the narrator assumed memory's reliability for continuity *after* using doubt to undermine everything else. Her reasoning fails *on its own terms* by inconsistently shielding memory/persistence from the doubt she applied elsewhere. The case building this is the amnesia: A person *is* thinking now (cogito valid), but their *lack of memory* means they cannot confirm they are the *same* person they remember being (narrator's overreach exposed).

  5.  **"The 'I' revealed by the cogito is like the 'running' revealed when someone runs: it's an activity, not a description of *what* the runner is."**  
      Use the runner analogy: Seeing someone run proves *running is happening* and *a runner exists*, but tells you nothing about the runner's height, name, history, or even if it's a human, robot, or hallucination. Similarly, "I think" proves *thinking is happening* and *a thinker exists now*, but says nothing about the thinker's nature, history, substance, or persistence. This separates the *activity* (thinking/running) from the *entity* (thinker/runner). The narrator mistook the proof of the *activity* for proof of a *specific, enduring entity*.

  6.  **"Descartes' cogito secures existence only at the instant of thought, not the history, identity, or nature of the thinker."**  
      Consolidate the distinction. The cogito is a snapshot: "Thought happening now → Thinker existing now." It doesn't provide a continuous filmstrip (persisting self) or a blueprint (nature of the self). The narrator needed certainty about her *specific, continuous identity* amid radical doubt, but the cogito only gives the minimal certainty of *current existence as a thinking thing*. Her confidence was misplaced because she asked more of the cogito than it can deliver. The students, having seen the fragility of memory (Step 4) and the thinness of the "I" (Step 5), now grasp this gap.

  **Final Diagnostic Question:**  
  *"If someone lost all memory in an accident but could still think 'I am confused', would that thought prove they are the same person they were before the accident? Why/why not?"*  
  A "no" answer, correctly citing that the thought proves existence *now* but not connection to the past (relying on memory), shows they grasp the distinction. A "yes" suggests they conflate existence with identity.

  **What to Refuse to Explain (State Clearly):**  
  *"I need to be clear: We are focusing only on what this *one piece of reasoning* (the cogito) can and cannot do on its own, based on the doubt we started with. I won't be discussing Descartes' full philosophy, what consciousness *really* is, or whether the self is an illusion – those are deep questions needing more time and tools than we have today. Our goal is to see the boundaries of this specific argument."*
