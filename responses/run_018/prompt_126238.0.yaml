  The fatal flaws would be where Plutarch actively asserts translistorical virtues or where the pairing logic requires commensurability. For instance, if he explicitly says "study these lives to cultivate virtue X," that directly contradicts the anti-exemplary reading. Less damaging might be incidental moralizing - that could be dismissed as conventional rhetoric.

  I should also consider if the theory becomes unfalsifiable by reinterpreting all moral praise as cultural performance. That would be a problem - a good theory must have clear failure conditions. Maybe the test is whether Plutarch ever acknowledges cultural relativism himself, or if he treats virtue as objectively measurable.

  The user's meta-concern about insulated theories is spot on. If every counterexample can be explained away as "context-bound performance," the argument risks becoming circular. I'll need to identify evidence that would break that circle - perhaps Plutarch's cross-cultural judgments or his treatment of "universal" vices.

  Ranking the defeaters from fatal to awkward will require weighing how central each point is to Plutarch's project. Explicit translistorical claims in prologues? That's core. Contemporary virtue ethics frameworks applying across contexts? That's external and potentially anachronistic.

