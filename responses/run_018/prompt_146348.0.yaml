  The comparative literature scholar might ask about the literary function, and the user should explain how suppression of dissent serves the narrative arc. But the toughest objection is the one they hope nobody asks: that the cases are too different. Dunkirk is a strategic retreat, not a lost cause; Kosovo is about survival; only Confederacy and Masada are true defeats. The user might be misapplying their own category. I need to point this out plainly. Also, counterfactual loyalty might just be tragic heroism with a twist, so the user must define it clearly.

