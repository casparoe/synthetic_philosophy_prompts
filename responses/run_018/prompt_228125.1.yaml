answer: |-
  Your Pluto reclassification case study is an exceptional choice for exploring verbal disputes and metaontology, offering a richer, more contemporary, and sociologically complex example than the standard metaphysical puzzles. Here's a structured analysis:

  **I. Analyzing the Dispute Through the Lens of Verbal Disputes and Metaontology**

  1.  **Is it a Merely Verbal Dispute?**
      *   **Strong Evidence for Verbal Dispute:** Both camps agree on *all* empirical facts about Pluto (mass, composition, orbit, geology, presence of other Kuiper Belt Objects). The disagreement is solely about whether this agreed-upon set of properties warrants the label "planet." This perfectly fits the model of a verbal dispute (e.g., Carnap, Chalmers): disagreement arises from differing conceptual schemes or linguistic conventions (the definitions of "planet"), not disagreement about mind-independent worldly facts.
      *   **The "Idleness" Question:** Does this make it idle? Not necessarily. While the *core ontological question* ("Is Pluto *really* a planet?") dissolves into a question of semantic convention, the *choice* of convention has significant practical and scientific consequences:
          *   **Scientific Utility:** The dynamical definition (clearing orbit) aims for a category with distinct dynamical significance, potentially marking bodies that dominate their orbital environment and have undergone distinct evolutionary paths. The geophysical definition (gravitationally rounded) highlights intrinsic physical properties related to formation and internal processes. The choice affects how scientists categorize, study, and prioritize objects.
          *   **Pedagogical and Communicative Clarity:** Having a manageable number of "planets" (8 vs. 100+) has implications for education and public communication about the solar system's structure.
          *   **Resource Allocation:** Classification can subtly influence funding priorities and mission targets (e.g., "dwarf planet" missions vs. "planet" missions).
      *   **Conclusion:** The dispute *is* fundamentally verbal regarding the *meaning* of "planet," but the *choice* of which verbal convention to adopt is a substantive, non-idle question about conceptual organization within science, driven by pragmatic and theoretical goals.

  2.  **The Role of the Third Criterion: "Clearing the Neighborhood"**
      *   **Smuggling Status?:** Yes, the criterion "has cleared the neighborhood around its orbit" is inherently evaluative and contextual, not purely descriptive like mass or shape.
          *   **Vagueness:** As you note, Earth hasn't strictly "cleared" its orbit of asteroids (NEOs). The criterion relies on a fuzzy threshold of *dominance* – does the body gravitationally control the dynamics of other significant bodies in its vicinity? This injects an element of "importance" or "significance" based on relative mass and orbital parameters.
          *   **Context-Dependence:** "Clearing" depends on the specific orbital zone and the population within it. Pluto resides in the densely populated Kuiper Belt, making "clearing" much harder than for Mercury in a relatively empty inner zone.
          *   **Status Judgment:** Effectively, this criterion elevates bodies that are the *dominant* objects in their orbital zones to a privileged category ("planet"), implicitly demoting objects that are merely *members* of a population ("dwarf planets," small bodies). It defines "planet" partly by what it *is not* (not part of a swarm).
      *   **Why it Matters:** This highlights that the IAU definition isn't a simple "discovery" of a natural kind boundary but a *stipulation* designed to create a scientifically useful category reflecting dynamical *significance* within our specific solar system. It reveals the pragmatic motives behind the definitional choice.

  **II. How the Case Tests Metaontological Theories**

  1.  **The IAU Vote and Deflationary Metaontology:**
      *   **Support for Deflationism/Conventionalism:** The resolution via a vote by a professional body (IAU) strongly supports deflationary views (e.g., Carnap's linguistic frameworks, Hirsch's quantifier variance). The question "How many planets are there?" wasn't settled by discovering a new fact about Pluto; it was settled by adopting a new linguistic rule (the definition). Existence (as a planet) was literally *conferred* by convention. This exemplifies the Carnapian idea that ontological questions are internal to frameworks chosen for practical purposes.
      *   **The Challenge of Dissent:** However, the sustained dissent and the existence of a rival definition (Stern's geophysical) challenge a *strong* deflationary reading that might imply such conventions are easily settled or purely arbitrary. The dissent shows:
          *   **Multiple Viable Frameworks:** There isn't one obvious "best" convention. Different frameworks (dynamical vs. geophysical) serve different legitimate scientific interests.
          *   **Residual "Substantive" Feeling:** Many participants (scientists and public) felt the vote didn't settle the *real* issue, suggesting an intuition that there *is* a fact of the matter about planethood that transcends convention (leaning towards realism).
          *   **Conclusion:** The vote powerfully illustrates the conventionalist aspect of ontology in practice. Yet, the dissent reveals the pull of realist intuitions and the fact that the *choice* between competing conventions feels substantive because of the differing scientific values and utilities they embody.

  **III. The Core Metaontological Question: Is there a fact about the number of planets?**

  *   **Quantifier-Variantist (e.g., Eli Hirsch):** The variantist would emphatically say *no*. The question "How many planets are there?" only has an answer *relative to a chosen language or conceptual scheme*. Adopt the IAU definition? 8. Adopt Stern's definition? 100+. Both are equally valid ways of "carving up" the solar system discursively. There is no single, absolute, mind-independent count. The dispute is purely about which way of speaking is more useful, not about how the world *really* is independent of our concepts. The vote exemplifies how such questions are resolved conventionally.
  *   **Natural Kinds Realist (e.g., grounded in essential properties):** The realist would argue that there *should* be a fact of the matter. If "planet" picks out a genuine natural kind with essential properties (e.g., formation process, specific dynamical role, intrinsic physical state), then Pluto either is or isn't a member, regardless of definitions or votes. The *persistence* of the debate, despite empirical agreement, might suggest to the realist that neither definition perfectly captures the underlying natural kind (if it exists). They might argue that the geophysical definition captures an intrinsic property (roundness via self-gravity, indicating differentiation) relevant to geology, while the dynamical definition captures an extrinsic relational property relevant to astrophysics, and that neither is the single "essence" of planethood. The realist would likely see the vote as a pragmatic fudge, not a discovery of truth.
  *   **Which Fits Better?** The Pluto episode **fits quantifier variantism/conventionalism far better.** The key evidence is the **perfect agreement on empirical facts coupled with intractable disagreement on classification.** Realism struggles to explain this without positing that both sides are fundamentally mistaken about the *real* essence of a planet – yet neither definition seems obviously "wrong" in capturing *some* significant, objective features of solar system bodies. The resolution by vote is the quintessential conventionalist move. The dissent reinforces variantism by showing the availability and persistence of alternative, equally coherent frameworks. The episode showcases ontology as conceptual negotiation driven by pragmatic and theoretical goals within science, rather than the discovery of pre-existing, language-independent joints in nature.

  **Conclusion for Your Case Study:**

  The Pluto reclassification is a paradigmatic case of a non-idle verbal dispute in science, illuminated brilliantly by deflationary metaontology and quantifier variance. The disagreement stems entirely from competing definitions/conventions for "planet," not underlying empirical facts. The IAU definition, particularly the "clearing the neighborhood" criterion, reveals the pragmatic, evaluative, and contextual nature of the chosen convention, designed to create a scientifically useful category reflecting dynamical dominance. The resolution by vote strongly supports a conventionalist view of ontology, demonstrating how existence questions (like "Is Pluto a planet?") are settled by adopting linguistic rules. However, the persistent dissent underscores that the *choice* between competing conventions feels substantive because different classifications serve different legitimate scientific purposes (dynamical significance vs. intrinsic geophysical properties). Ultimately, the case powerfully argues against a strong realism about "planet" as a natural kind and instead supports the view that the answer to "How many planets are there?" depends fundamentally on the conceptual framework we choose to employ, with no single, framework-independent fact of the matter.
