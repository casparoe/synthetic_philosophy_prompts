prompt: |-
  hey i need a thought experiment for something ive been chewing on. i read somewhere that chase and sanborn think qualia are basically incoherent, like the whole idea of a "raw feel" doesn't actually hold together if you push it hard enough. i don't really get their argument but i want a scenario that puts it up against the usual view that qualia are real and private. can you build me a case in one paragraph, everyday setting, no zombies or brain-scan sci-fi, where a person remembers eating a lemon yesterday but now the memory carries the exact opposite taste-quality — sweet instead of sour — and they insist the memory is perfectly accurate, not mistaken? the trick should be that describing the "what its like" part of this memory forces some kind of contradiction if you take qualia seriously. then after the scenario walk through what a qualia realist says vs what the incoherence view says, and point out which feature of the case is doing all the work. also tell me how a realist would try to save their view by attacking the case. i keep thinking this reversed-memory taste thing is weirder than the usual color-inversion stories, so use that or something like it. oh and dont ask me for citations or reading lists — i can't look anything up right now and just want to think it through.
