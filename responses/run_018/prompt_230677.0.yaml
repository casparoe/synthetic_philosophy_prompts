  **Scoring Key**  
  Compare your answers to the patterns below. If you match multiple patterns, your view may be hybrid; if none, you may hold a less common position.  

  - **Hierarchical/Tarskian view:**  
    Answers: 1e, 2e, 3e, 4e, 5e, 6e, 7e, 8e  
    Why: Self-referential sentences (e.g., Liar, Truth-Teller) are not genuine propositions and must be excluded from the language.  

  - **Truth-value gap view:**  
    Answers: 1d, 2d, 3d, 4d, 5d, 6b, 7d, 8d  
    Why: Ungrounded sentences (e.g., Liar, Truth-Teller, Yablo S1) lack truth values. The contingent liar (Q6) is false due to its false empirical claim.  

  - **Dialetheist/paraconsistent view:**  
    Answers: 1c, 2a **or** 2b (either), 3c, 4c, 5c, 6b, 7c, 8c  
    Why: Paradoxical sentences (e.g., Liar, Curry, Yablo S1) are true and false; the truth-teller (Q2) is arbitrarily true or false (not paradoxical). The contingent liar (Q6) is simply false.  

  - **Revision-theoretic view:**  
    Answers: 1f, 2f, 3f, 4f, 5f, 6b, 7f, 8f  
    Why: Paradoxical sentences (e.g., Liar, Truth-Teller, Curry) never stabilize to one value under evaluation. The contingent liar (Q6) stabilizes to false.  

  **Diagnostic Notes**  
  - **Overlaps:**  
    - Q6 (contingent liar) is false (b) for all except Tarski (e), distinguishing Tarski from others.  
    - Q2 (truth-teller): Dialetheists accept either (a) or (b); others unify (d for gap, e for Tarski, f for revision).  
    - Q5 (revenge): Treated like the Liar (e for Tarski, d for gap, c for dialetheism, f for revision).  
  - **Unattested Combinations:**  
    - Assigning a stable truth value (a/b/c/d) to the Liar (Q1) *and* "no stable answer" (f) to it is inconsistent.  
    - Mixing "meaningless" (e) for some self-referential sentences (e.g., Q1) with truth values (a/b/c/d/f) for others (e.g., Q2) is rare; it may imply an unstable hierarchy.  
  - **Why Gaps?** No position assigns "both" (c) to non-paradoxical sentences (e.g., Q6) or "neither" (d) to clearly true/false sentences.  
  - **Why No Others?** Combinations like "neither for Liar but true for revenge" (1d + 5a) are incoherent (revenge reinforces the Liar’s problem).  
  - **Limitations:** The instrument cannot distinguish sub-variants (e.g., gap vs. supervaluationist gaps) or contextualist approaches.
