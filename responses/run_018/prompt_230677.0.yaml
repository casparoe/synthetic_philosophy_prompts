  5. Consider the sentence: "This sentence is not true." What is its truth status?

  6. Consider the sentence: "The number of planets is even and this sentence is false." (Assume that the actual number of planets in our solar system is 9, which is odd.) What is its truth status?

  7. Consider two sentences:

     A: "Sentence B is true."
     B: "Sentence A is false."

     What is the truth status of A?

  8. What is the truth status of B? (Referring to the same two sentences as in question 7.)

