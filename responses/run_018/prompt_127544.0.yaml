  Please explain the conceptual mechanics of the leveling-down objection and why it is standardly directed at telic egalitarianism rather than at prioritarianism. Then consider this twist: suppose the worst-off in a group cannot be improved at all, but the best-off can be made worse off without altering anyone else’s absolute position. Would a consistently prioritarian scheme—where benefits to lower well-being levels carry greater weight, but weights never turn negative—ever generate a reason to reduce the well-being of the best-off in that scenario? If one insists that it should, is that insistence best explained as a hidden egalitarian residue inside the priority function, or as a misreading of how diminishing marginal weights operate across a fixed distribution? Keep the analysis conceptual and avoid historical exegesis, bibliographies, or citations.
