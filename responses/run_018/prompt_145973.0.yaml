answer: |-
  1. Divide sixteen students into four groups of four, positioning them sequentially as supply chain layers: Group 1 (Raw Materials), Group 2 (Manufacturing), Group 3 (Logistics), Group 4 (Retail). Each group receives an identical written "Risk Warning" card detailing a potential product hazard (e.g., contamination risk) and ten tokens.
  2. Rules: Each group privately votes to either "escalate" the warning (sending it forward but losing one token) or "do nothing" (keeping all tokens). Hidden payoff: Individuals keep saved tokens, but if the warning dies at *any* single layer (i.e., any group chooses "do nothing"), *all* groups lose *all* tokens as a collective penalty.
  3. Crisis Staging: After simultaneous, secret choices are submitted, the facilitator announces a simulated disaster (e.g., consumer harm) because the warning wasn't escalated to the end. Reveal the chain's break point and enforce payoffs, showing every non-escalating group can argue their omission alone wasn't decisive since the chain broke earlier or later.
  4. Debrief: First, map each layer's choice to the distinction—their omission was a necessary condition within the causal field, yet selecting *which* omission "caused" harm contrasts with viewing omissions as mere explanatory placeholders from infinite possible non-actions. Then, hold a vote asking "Which single layer caused the harm?" and record the dispersed, contested results.
  5. Limitation: This simulation cannot replicate the metaphysical challenge of selecting the *relevant* omission from the infinite background of non-actions; the facilitator must explicitly state that the defined chain layers artificially constrain "the" omission. Predict first-run failure (chain break) due to rational token-saving; handle it by stressing this demonstrates the paradox of pinpointing blame in distributed omission.
