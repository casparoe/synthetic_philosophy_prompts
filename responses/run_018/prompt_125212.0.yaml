  ## Joint Statement on Ascription Universality & Epistemic Dominance  
  *Signed by Members of the Ascription-Universalist (AU) and Epistemic-Dominance Skeptic (EDS) Camps*

  **Preamble:**  
  We’ve argued hard about whether labeling things across domains (e.g., calling a star "alive" in myth and a cell "alive" in biology) is a harmless tool or a hidden power grab. We still disagree on key points, but we’ve nailed down shared ground and clarified where the fight really is. This ain’t relativism vs. objectivity redux. Here’s what we agree on, where we split, and the experiments-in-thought that might settle it.

  ### Agreed Claims:
  1.  **"Ascription Universality" Definition:** It means applying the *same descriptive predicate* (like "rational," "efficient," or "alive") across radically different domains (e.g., cultural practices, biological systems, physical processes) to enable comparison or modeling.
  2.  **"Epistemic Dominance" Definition:** This occurs when the norms, standards of evidence, or explanatory frameworks of one knowledge system are *imposed* or treated as inherently superior, actively marginalizing, rendering invisible, or forcing the translation of locally valid knowledge systems/practices.
  3.  **Rejection of Simple Relativism:** We both reject the idea that this debate is just moral/cultural relativism in disguise. The issue is *power/knowledge dynamics* inherent in cross-domain framing, not whether "truth" exists.
  4.  **Universality Claims Aren't Neutral:** Both sides agree that *in practice*, attempts at universal ascription are *never* politically or epistemically neutral. They always occur within contexts of existing power imbalances.
  5.  **"Scaffolding" is Real (but contested):** We agree that universals *can* function as temporary, pragmatic scaffolds for bridging understanding between domains. The disagreement is whether this is their *primary* or *only* function, and whether it *can* be separated from dominance.
  6.  **Local Knowledge Matters:** Both sides affirm the inherent value and validity of situated, local knowledge practices. The disagreement centers on whether universal frames *necessarily* harm them.

  ### Precise Disagreements (Phrased by Each Side):
  1.  **On the Core Tension:**
      *   **AU Wording:** "Universal ascriptions are primarily thin cognitive scaffolds enabling comparison and modeling across domains. While dominance *can* occur, it is not inherent to the act of universal ascription itself; careful practice can avoid smuggling in dominance."
      *   **EDS Wording:** "Every act of applying a universal frame inherently functions as an epistemic power move, constructing the local domain as the 'particular case' that must conform to or be explained within the universal frame, thereby rendering local epistemic structures invisible or subordinate."
  2.  **On Handling Exceptions:**
      *   **AU Wording:** "Robust universal frames can be revised or abandoned based on significant, persistent local exceptions that challenge the frame's core coherence or explanatory power across domains."
      *   **EDS Wording:** "Local exceptions are invariably absorbed into the universal frame as 'anomalies' or 'special cases' requiring explanation *within* the frame's logic, reinforcing the frame's dominance rather than overturning it."
  3.  **On Thin vs. Thick:**
      *   **AU Wording:** "A 'thin' universal ascription (shared vocabulary only, e.g., labeling systems as 'adaptive') is conceptually and practically possible without implying or requiring a 'thick' universal dominance (shared, imposed norms of evidence or explanation)."
      *   **EDS Wording:** "A 'thin' universal ascription is unstable and inevitably drags in 'thick' dominance; the shared vocabulary implicitly carries and imposes the normative epistemic commitments of its dominant domain of origin."

  ### Cruxes: Points Where Predictions Diverge
  1.  **Crux Name:** **The Exception Threshold Crux**  
      *   **Bearing Case:** Applying the universal predicate "obeys thermodynamic laws" to both a steam engine (dominant domain: physics) and a specific Indigenous land management practice understood primarily through kinship obligations and spiritual cycles (local domain). The local practice demonstrably achieves sustainable outcomes seemingly "inefficient" by standard thermodynamic efficiency metrics.  
      *   **Universalist Prediction:** If the local practice consistently demonstrates outcomes fundamentally incompatible with the *core predictive power* of thermodynamics-as-universally-applied (e.g., apparent perpetual motion / negentropy without external input), *and* this challenge is widely recognized *across domains*, it forces a revision of the universal frame itself (e.g., rethinking definitions of "system," "efficiency," or the frame's scope). The exception *can* break the frame.  
      *   **Skeptic Prediction:** The dominant physics frame will absorb the exception. Explanations will focus on "hidden variables" within the physics framework (e.g., unmeasured energy inputs from the environment), recast the kinship/spiritual aspects as "metaphorical" or "inefficient social overhead," or label the practice a fascinating "outlier" needing further study *within physics terms*. The frame bends but doesn't break; the local knowledge remains subordinate.

  2.  **Crux Name:** **The Thin-Without-Thick Crux**  
      *   **Bearing Case:** Developing a cross-cultural, cross-disciplinary vocabulary for "pain" using shared minimal descriptors (e.g., "aversive experience," "motivates avoidance," "associated with specific neural correlates observable via tech X"). The goal is *only* mutual identification/acknowledgment across medical, psychological, and diverse cultural frameworks (e.g., where pain might be integrated into spiritual growth). Norms for *explaining* or *treating* pain remain strictly local.  
      *   **Universalist Prediction:** This "thin" vocabulary *can* function stably as a scaffold for basic communication and coordination (e.g., in palliative care settings) *without* inevitably forcing the neurology-based norms of evidence to dominate explanations of pain within spiritual frameworks. The shared predicate remains purely descriptive.  
      *   **Skeptic Prediction:** The thin vocabulary is unstable. The mere act of using descriptors linked to "observable neural correlates" (from the dominant biomedical domain) implicitly elevates those correlates as the *real* evidence for pain's existence/validity. Spiritual frameworks explaining pain will gradually be pressured to "translate" their understanding into these neuro-terms to be taken seriously, or be marginalized as dealing with "something else." The thin predicate drags thick norms with it.

  ### Settled vs. Contested Notes
  *   **Settled:** The debate exists. Both positions represent serious, coherent philosophical stances held by scholars actively working on cross-cultural epistemology, philosophy of science, and power/knowledge. This isn't just "old universalism vs. relativism." The concepts of "ascription universality" and "epistemic dominance" as defined above are recognized tools of analysis. The *potential* for harm via dominance is uncontested.
  *   **Contested:** Whether epistemic dominance is *inherent* to universal ascription. Whether "thin" universality can *persist* without collapsing into "thick" dominance. Whether local exceptions genuinely hold the power to *overturn* universal frames or are always subsumed. These are live, unresolved disagreements at the heart of current work. There is *no consensus* on these points.

