  The moral psychologists' "situationist" challenge is tricky too—conceding Milgram is wise, but the reply must emphasize how organizational roles create *sustained* complicity beyond one-off experiments. The Holocaust historian's concern about "depoliticization" is politically charged; agreeing on ideology's importance while reframing bureaucracy as its enabler might disarm them. 

  *winces* The philosopher's objection cuts deepest—if the "scaffolded disposition" is just individualism repackaged, the whole synthesis collapses. The reply must distinguish scaffolding as *relational* and quote Weick to sound credible. 

