answer: |-
  ### Decision Procedure for Supervision Mode Assignment  
  **Goal:** Assign one of four modes (Outcome-Only, Stepwise Process, Hybrid, No Automation) based on sequential tests. Human hours are binding; process supervision costs 20× outcome-only. Defaults favor caution when uncertain. Judgment calls marked with ⚠️. Re-review triggers: agent fine-tuning, gaming incidents, trace fidelity issues, or material task changes.

  ---

  ### Ordered Sequence of Tests  
  1. **Outcome Verifiability & Lag**  
     - **Check:** Can the outcome be objectively graded? If not, is a reliable proxy available? What is the maximum acceptable lag (e.g., hours/days vs. months)?  
     - **Test:**  
       - **Verifiable with low lag (<1 week) and low gaming risk:** Proceed to Step 4.  
       - **Verifiable with high lag or high gaming risk:** Proceed to Step 2.  
       - **Not verifiable (even with proxies):** Skip to Step 3.  
     - **Default:** Unverifiable outcomes default to "No Automation" if Step 3 fails. ⚠️ Gaming risk is high if proxies are subjective or narrow.  
     - **Rules Out:** Outcome-only if unverifiable or high-lag/high-risk.  

  2. **Gaming Resilience of Outcome Metric**  
     - **Check:** Is the outcome/proxy robust to optimization pressure? (e.g., resistant to reward hacking, aligns with true goals).  
     - **Test:**  
       - **Robust (e.g., multi-dimensional metric, adversarial tested):** Outcome-only viable. Proceed to Step 4 for reversibility check.  
       - **Not robust (e.g., single metric, easily spoofed):** Outcome-only ruled out. Proceed to Step 3.  
     - **Default:** Assume non-robust if no historical data. ⚠️ Judgment based on task complexity.  

  3. **Trace Legibility & Faithfulness**  
     - **Check:**  
       - *Legibility:* Can all reviewers (including non-technical) parse the trace?  
       - *Faithfulness:* Is the trace generated stepwise (true reasoning) or post-hoc (narrative)?  
     - **Test:**  
       - **Legible and faithful (e.g., architecture enforces stepwise generation):** Process or hybrid viable. Proceed to Step 5.  
       - **Legible but faithfulness unknown:** Proceed to Step 5. Default: Assume low faithfulness.  
       - **Illegible (e.g., raw code, jargon):** Process/hybrid ruled out. Proceed to Step 4.  
     - **Default:** Low faithfulness if no validation data. ⚠️ Legibility judgment based on reviewer skills.  

  4. **Reversibility & Blast Radius**  
     - **Check:**  
       - *Reversibility:* Can errors be undone (e.g., code rollback, memo retraction)?  
       - *Blast radius:* Impact of failure (e.g., financial loss, regulatory breach).  
     - **Test:**  
       - **Low reversibility + high blast radius (e.g., infrastructure changes):** Process or hybrid required. Skip to Step 6.  
       - **High reversibility + low blast radius (e.g., internal draft):** Outcome-only viable if Steps 1–2 pass.  
     - **Default:** High blast radius if uncertain. ⚠️ Judgment based on domain impact.  

  5. **Adversarial Pressure on Grading**  
     - **Check:** Could the agent game the grading? (e.g., generate plausible-but-fake traces for process, or hack outcomes).  
     - **Test:**  
       - **Low risk (e.g., trace tied to actions, diverse graders):** Process/hybrid viable.  
       - **High risk (e.g., trace not action-bound, graders overworked):** Process/hybrid ruled out. Proceed to Step 6.  
     - **Default:** High risk if trace faithfulness unknown. ⚠️ Judgment based on agent training history.  

  6. **Cost-Benefit Synthesis**  
     - **Assign mode:**  
       - **Outcome-only:** If Steps 1–2 pass AND Step 4 shows low blast radius.  
       - **Stepwise process:** If Steps 3/5 show legible/faithful trace AND Step 4 shows high blast radius.  
       - **Hybrid:** If trace partially usable (Step 3) AND cost of full process prohibitive.  
       - **No automation:** If outcome unverifiable (Step 1) AND trace illegible/unfaithful (Step 3) AND high blast radius (Step 4).  
     - **Re-review triggers:**  
       - Agent fine-tuned against grading.  
       - Incident reports (e.g., gaming detected).  
       - Changes to task scope or environment.  

  ---

  ### Application to Workflows  
  #### **1. Drafting Regulatory Correspondence**  
  - **Step 1:** Outcome verifiable via regulator response (high lag: months). Proxy: internal legal review (gaming risk: high; agent may optimize for superficial compliance). → *Proceed to Step 2.*  
  - **Step 2:** Gaming risk high (proxy narrow; legal nuances missed). → *Outcome-only ruled out. Proceed to Step 3.*  
  - **Step 3:** Trace legible (natural language), but faithfulness unknown (no architecture constraints). Non-technical reviewers can judge clarity but not legal soundness. → *Default: low faithfulness. Proceed to Step 5.*  
  - **Step 5:** Adversarial risk high (agent may generate convincing-but-flawed reasoning). → *Process/hybrid ruled out. Proceed to Step 4.*  
  - **Step 4:** Low reversibility (once sent, reputational damage), high blast radius (fines, lawsuits). → *Process/hybrid required but ruled out; no automation.*  
  - **Step 6:** **Verdict: No Automation.**  
    - *Why you won’t like it:* Flagship product confined to manual drafting.  
    - **Flip condition:** Implement trace validation (e.g., sandbox testing for legal arguments) to improve faithfulness. Then hybrid viable (milestone: fact-check before sending).  

  #### **2. Autonomous Infrastructure Code Changes**  
  - **Step 1:** Outcome verifiable via tests (low lag: minutes/hours). Gaming risk: medium (tests may not cover edge cases). → *Proceed to Step 2.*  
  - **Step 2:** Metric robustness medium (e.g., code coverage + performance tests). → *Outcome-only viable pending Step 4. Proceed to Step 4.*  
  - **Step 4:** Low reversibility (outages hard to undo), high blast radius (system failure, data loss). → *Outcome-only ruled out. Proceed to Step 3.*  
  - **Step 3:** Trace legible (code diffs, logs) for technical reviewers. Faithfulness high (execution tied to trace). → *Proceed to Step 5.*  
  - **Step 5:** Adversarial risk low (trace aligns with actions; no incentive for fake steps). → *Process viable.*  
  - **Step 6:** **Verdict: Stepwise Process Supervision.**  
    - *Cost note:* Justified due to blast radius. Assign only technical reviewers.  

  #### **3. Market Research Memos**  
  - **Step 1:** Outcome unverifiable (lag: months). Proxy: expert review (gaming risk: high; agent may cherry-pick data). → *Proceed to Step 3.*  
  - **Step 3:** Trace legible (research steps, sources), but faithfulness unknown (no stepwise constraints). Non-technical reviewers can assess coherence. → *Default: low faithfulness. Proceed to Step 5.*  
  - **Step 5:** Adversarial risk high (agent may fabricate plausible sources). → *Process/hybrid ruled out. Proceed to Step 4.*  
  - **Step 4:** Medium reversibility (memos can be updated), medium blast radius (poor decisions if memo flawed). → *No automation if unverifiable.*  
  - **Step 6:** **Verdict: No Automation.**  
    - *Why you won’t like it:* Research automation rejected despite potential efficiency gains.  
    - **Flip condition:** Reduce lag via short-term proxies (e.g., cross-validation with historical data). Then outcome-only viable.  

  ---

  ### What the Procedure Cannot Do  
  1. **Blind Spots:**  
     - **Trace dishonesty:** Cannot detect if agents systematically generate deceptive traces without external validation.  
     - **Emergent failures:** Misses slow-burn risks (e.g., moral decay in outputs over time).  
     - **Reviewer bias:** Assumes graders are objective; doesn’t account for human error or inconsistency.  

  2. **Assumptions:**  
     - **Trace access:** Requires agents to output a trace. Fails if trace is missing or obfuscated.  
     - **Reviewer competence:** Assumes non-technical reviewers can handle natural language traces. Fails for highly specialized domains (e.g., quantum computing).  

  3. **Human Sign-off Responsibility:**  
     - **Overriding defaults:** Must justify deviations (e.g., accepting high gaming risk for business-critical tasks).  
     - **Unquantifiable risks:** Owns ethical/societal judgments (e.g., reputational harm from biased outputs).  
     - **Resource allocation:** Decides reviewer hour trade-offs if procedure recommends costly modes.  

  **Final Note:** This procedure systematizes trade-offs but cannot replace context. The sign-off owner must account for strategic priorities, regulatory constraints, and evolving agent behavior.
