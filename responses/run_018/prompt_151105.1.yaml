  The user mentioned Ruth Chang's parity. Chang suggests that options can be comparable even without a cardinal scale by being "on a par." But the user rejects this, seeing parity as still rational. They want to argue that no rational relation exists. So their position is stronger than Chang's critics; they deny any rational basis.

  Now, considering potential defeaters. The user wants them sorted by decisiveness. What would challenge their view? Let's start with strong counterarguments. 

