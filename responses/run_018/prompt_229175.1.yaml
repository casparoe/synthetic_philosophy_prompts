  ### **The Case: "The Loyalty Predictor"**  
  **Scenario**: A tech company, "PredictCorp", offers you a choice. They've developed a sophisticated AI that analyzes your public and private data (social media, purchase history, etc.) to predict your loyalty to their brand. The setup:  
  - **Box A (Opaque)**: May contain $1,000,000.  
  - **Box B (Transparent)**: Contains $1,000.  

  **How the predictor works**:  
  1. PredictCorp’s AI uses your data to predict whether you’ll choose **only Box A** (one-box) or **both boxes** (two-box).  
  2. If the AI predicts you’ll one-box, it funds Box A with $1,000,000.  
  3. If it predicts you’ll two-box, Box A is left empty.  
  4. **The twist**: The AI’s prediction is **finalized and locked in** when you physically *touch* either box. Until then, the prediction is "live" and can change based on real-time data (e.g., biometric sensors in the room monitoring hesitation, eye movements, or subtle cues). The funds are transferred electronically at the moment of touch.  

  **Key details**:  
  - PredictCorp’s AI is highly accurate (e.g., 95% success rate) but **fallible**—it’s comparable to a sharp human judge.  
  - You know the entire setup and that the prediction is only fixed upon your first physical interaction with a box.  
  - Payoffs are real money, scaled for impact: $1,000,000 is life-changing; $1,000 is meaningful but not trivial.  
  - No backward causation: The AI’s prediction is based on *current* data (like a live credit-score algorithm) and settles at choice-time.  

  ---

  ### **Step-by-Step Decision Theories**  
  **Causal Decision Theory (CDT) Verdict: ONE-BOX**  
  **Reasoning**:  
  1. CDT evaluates actions based on their *causal consequences*.  
  2. In this scenario, your choice **causally influences** the prediction outcome:  
     - If you reach for **only Box A**, your action *causes* the AI to finalize a "one-box" prediction, loading $1,000,000 into Box A. You get $1,000,000.  
     - If you reach for **both boxes**, your action *causes* the AI to finalize a "two-box" prediction, leaving Box A empty. You get $0 (Box A) + $1,000 (Box B) = $1,000.  
  3. Thus, one-boxing causes $999,000 more than two-boxing. CDT chooses one-boxing.  

  **Evidential Decision Theory (EDT) Verdict: ONE-BOX**  
  **Reasoning**:  
  1. EDT evaluates actions based on the *evidence* they provide.  
  2. One-boxing is strong evidence the AI predicted you’d one-box (since the AI is accurate), so Box A likely contains $1,000,000. You get $1,000,000.  
  3. Two-boxing is strong evidence the AI predicted you’d two-box, so Box A is likely empty. You get $1,000.  
  4. EDT prefers one-boxing, as it correlates with higher payoff.  

  **Agreement?**  
  - Both theories agree on **one-boxing**, but for **different reasons**:  
    - CDT cares about *causing* Box A to contain $1M by acting loyally.  
    - EDT cares about *signaling* that you’re the type of person the AI rewards.  

  ---

  ### **Why CDT One-Boxes Here (and What Breaks the Standard Move)**  
  **The flipped feature**: **The prediction is not fixed until choice-time**.  
  - In standard Newcomb, the boxes are sealed *before* your choice. CDT’s "take both boxes" logic relies on this:  
    - *"Box A is already full or empty—taking both gets you $1,000 more either way!"*  
  - Here, **your action physically triggers the prediction finalization**. Touching Box A alone *causes* the AI to set Box A to $1M. Touching both *causes* it to set Box A to $0.  
  - Thus, CDT’s standard move fails because **your choice isn’t just revealing a prediction—it’s causally determining it**.  

  **What if you strip out this feature?**  
  - If you remove the real-time finalization (e.g., the AI locks its prediction 1 hour before you choose), the scenario collapses into **vanilla Newcomb**:  
    - Box A is fixed before your choice → CDT two-boxes, EDT one-boxes.  
    - The causal independence is restored, and CDT’s "take both" logic applies.  

  ---

  ### **Is This Still a Newcomb Problem?**  
  **Yes, but with a twist**:  
  - It retains Newcomb’s core structure: A predictor uses your data to pre-set a box based on your anticipated choice, creating tension between dominance (take both) and dominance-defeating (one-box).  
  - However, the real-time element **morphs it into a "causal Newcomb" variant**: The predictor isn’t just forecasting—it’s responding to your *current* behavior. This makes CDT sensitive to the act of choosing.  

  ---

  ### **Best Response from a Committed Two-Boxer**  
  A CDT defender could argue:  
  *"This scenario isn’t a true test of Newcomb’s problem. In standard Newcomb, the predictor’s action is causally independent of your choice—that’s why two-boxing is rational. Here, you’ve added a **causal link** between the choice and the prediction, making one-boxing causally dominant. But this just shows CDT works as intended: it one-boxes when the action *causes* the payoff. In the original Newcomb, no such link exists, so two-boxing remains correct. Your case doesn’t challenge CDT; it changes the rules."*  

  **Why this is defensible**:  
  - The critic correctly notes that CDT’s verdict depends on *causal structure*. In vanilla Newcomb, CDT two-boxes because the past prediction is unchangeable. Here, the prediction is changeable, so CDT adapts. This doesn’t refute CDT—it confirms its core principle (act based on causal impacts).  

  ---

  **Handout-Ready Summary**  
  **Scenario**: "The Loyalty Predictor" (PredictCorp’s AI finalizes its prediction when you touch a box).  
  **CDT**: One-boxes—your choice *causes* Box A’s contents.  
  **EDT**: One-boxes—your choice *signals* Box A’s contents.  
  **Key Flip**: Prediction fixed at choice-time → CDT can’t treat Box A as independent.  
  **Vanilla Newcomb?**: Removing real-time prediction reverts to classic (CDT two-boxes).  
  **Is it Newcomb?**: Yes, but with causal dependence.  
  **Two-Boxer Response**: "You altered causality; CDT still wins on its own terms."  

  This case forces students to see CDT’s reliance on *causal independence*—when that vanishes, so does two-boxing.
