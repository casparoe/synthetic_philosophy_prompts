prompt: |-
  I'm constructing a research agenda for elder-care law reform centered on the authority of earlier selves through advance directives. Rather than treating directives as static contracts, I want to examine them through the lens of "diachronic autonomy" — normative authority that extends across periods of cognitive change rather than being fixed to a single moment of choice. Within this frame, three open problem-clusters stand out. Cluster A is the boundary problem: whether the loss of authority over one's later self is sharp or graded along a continuum of cognitive decline, and what metaphysical or normative criteria should fix any boundary. Cluster B is the conflict problem: when a later self with diminished capacity expresses stable, apparently authentic preferences that contradict the directive — for instance, contentment in states the earlier self explicitly feared — whether present autonomy, present well-being, or relational continuity should prevail, and whether the answer depends on resolving Cluster A first. Cluster C is the institutional translation problem: how legal systems can apply answers to A and B without requiring courts to make ad hoc judgments about personal identity or to weigh incommensurable values case by case.

  Assume you're advising a small interdisciplinary group — philosophers and legal scholars, not clinicians or neuroscientists — with roughly three years of funding. Which specific open questions within these clusters should they prioritize, and in what order? For each choice, defend the ranking by explaining: why it is upstream of practical reform or of other conceptual work; how tractable it is for philosophers and lawyers using conceptual and normative tools rather than empirical brain science; what kind of result or argument over the next few years would move it up or down the list; and which questions you'd explicitly deprioritize because resolving them wouldn't change much downstream for law or institutional design. I want a defended agenda with explicit trade-offs between importance and tractability, not a survey or a bibliography.

  Please conclude with exactly one line beginning: Verdict: [a one-sentence statement of your top priority and its core justification].
reasoning: |-
  Okay, the user is constructing a research agenda focused on elder-care law reform using the concept of "diachronic autonomy" in advance directives. They've identified three problem clusters: boundary issues (Cluster A), conflicts between earlier and later selves (Cluster B), and institutional implementation (Cluster C). I need to advise an interdisciplinary group of philosophers and legal scholars on prioritizing specific questions within these clusters over a three-year timeframe.

  The user wants a defended agenda with clear trade-offs between importance and tractability, not just a survey. They're looking for specific open questions to prioritize, with justifications about why certain questions are upstream, how tractable they are for this group, what could change their priority, and which questions to deprioritize. The response must end with a single "Verdict" line stating the top priority and its core justification.

  Let me break this down. For Cluster A (boundary problem), the key is determining when authority shifts from the earlier to later self. The metaphysics of personal identity might be too abstract - what matters more is developing functional legal criteria for capacity thresholds. This seems crucial because it underpins everything else. For Cluster B (conflict problem), we need to balance past directives against present well-being, especially when the later self seems content. But this likely depends on resolving Cluster A first. Cluster C (institutional translation) is important but probably downstream - we need conceptual clarity before designing systems.

  The group consists of philosophers and legal scholars, so empirical brain science is out. They should focus on normative and conceptual tools. Tractability matters - questions requiring metaphysical resolution might stall progress, while those amenable to legal frameworks are better targets. Upstream questions that unlock practical reforms should take priority.

  Looking at impact: resolving boundary criteria (A1) would directly affect how directives are applied, making it highly upstream. Conflict resolution (B) depends on A, so it comes next. Institutional mechanics (C) build on both. Some metaphysical debates might be interesting but won't change laws.

  For the three-year scope, I'll recommend starting with functional boundary criteria, then move to conflict resolution once boundaries are clearer, and finish with institutional design. Deprioritize pure metaphysics and identity questions that don't translate to legal tests. The verdict should emphasize establishing functional thresholds first since that's the foundation.

  The user clearly values practical impact over theoretical purity - they want reforms, not just papers. The agenda should reflect that by focusing on questions that will actually change how directives work in elder care law.
answer: |-
  Here’s a prioritized research agenda for your 3-year interdisciplinary project, balancing conceptual importance, tractability for philosophers/legal scholars, and downstream impact on law reform:

  **Top Priority: Cluster A1 (Functional Boundary Criteria)**  
  *Specific Question:* **What functional capacities (e.g., evaluative consistency, narrative coherence, minimally stable value-weighting) must be impaired to justify overriding an advance directive, and how can these be defined in legally operationalizable terms?**  
  - *Why Upstream:* Resolving this is foundational. Without a defensible, gradable boundary criterion, Clusters B and C collapse into arbitrariness. It directly shapes when a directive "binds" versus when present preferences might override it, impacting statutory definitions of "incapacity" and clinical/judicial assessments.  
  - *Tractability:* Philosophers can analyze autonomy/normative agency concepts; legal scholars can translate these into doctrinal tests (e.g., refining "decisional capacity" beyond mere understanding/communication). Avoids needing neuroscience by focusing on *expressions* of agency (preferences, reasoning) rather than neural substrates.  
  - *Moving Up/Down:* Progress depends on developing a consensus framework linking autonomy theory to legal thresholds. If agreement emerges on core capacities within 18 months, move to B. If irreconcilable disagreement arises, pivot to institutional workarounds (C).  
  - *Deprioritize:* Metaphysical debates about personal identity *as such* (e.g., "Is the dementia patient the same person?"). While philosophically rich, legal systems need functional proxies, not ontological resolutions. A focus on *agency thresholds* suffices for reform.

  **Second Priority: Cluster B1 (Conflict Resolution Framework)**  
  *Specific Question:* **Under what conditions (if any) should a presently expressed, stable preference of a cognitively impaired person override a contradictory advance directive, and what normative weight should be given to relational continuity (e.g., family input, past relational commitments) in this calculus?**  
  - *Why Upstream:* Essential for operationalizing diachronic autonomy. Answers dictate whether directives are "trumps" or starting points for negotiation. Affects legislative drafting (e.g., revocation standards) and clinical ethics protocols.  
  - *Tractability:* Builds directly on A1. Philosophers can weigh autonomy theories (hierarchical vs. narrative) vs. well-being/relational ethics; legal scholars can analyze precedent and draft balancing tests. Uses conceptual tools (value commensurability, authority of past selves) without requiring new empirical data.  
  - *Moving Up/Down:* Requires A1’s boundary criteria as input. If A1 establishes a clear "authority threshold," B1 focuses on conflicts *below* that threshold. A breakthrough normative argument (e.g., justifying "relational veto points") could elevate it.  
  - *Deprioritize:* Abstract debates about "authenticity" of later preferences. Focus instead on *stability* and *external coherence* (with past values/relationships) as legally assessable proxies.

  **Third Priority: Cluster C1 (Procedural Safeguards & Default Rules)**  
  *Specific Question:* **What procedural mechanisms (e.g., designated proxy veto gates, mandatory periodic reaffirmation, mediation protocols) or statutory default rules can best implement answers to A and B while minimizing courts’ need for ad hoc value-weighing or identity judgments?**  
  - *Why Upstream:* Translates theory into institutional reality. Good procedural design can make nuanced boundaries and conflict resolutions administrable, enabling scalable reform. Affects drafting of guardianship laws, proxy statutes, and AD forms.  
  - *Tractability:* Legal scholars excel at institutional design; philosophers ensure procedural fairness aligns with normative foundations. Focuses on rules, standards, and processes—core legal tools.  
  - *Moving Up/Down:* Depends on stable outputs from A and B. If A/B stall, focus C1 on "second-best" solutions (e.g., default rules favoring directives unless specific triggers occur). A breakthrough (e.g., a novel proxy model) could accelerate it.  
  - *Deprioritize:* Overly specific court procedure reform or electronic registry design. Focus on high-level procedural *principles* applicable across jurisdictions.

  **Explicitly Deprioritized Questions:**  
  1.  **Cluster A:** "Is personal identity preserved in dementia?" (Intractable metaphysics; legal systems use functional capacity, not identity).  
  2.  **Cluster B:** "Can we precisely measure well-being differences?" (Requires empirical social science; use reasoned judgment on extreme cases).  
  3.  **Cluster C:** "How can courts efficiently handle *all* AD disputes?" (Premature; first define *which* disputes need judicial input post-A/B).  

  **Trade-offs Justified:**  
  - **Importance over Completeness:** Prioritizing A1 and B1 addresses the core normative tensions in diachronic autonomy. Without progress here, institutional work (C) risks codifying unresolved contradictions.  
  - **Tractability over Ambition:** Avoiding neuroscience/metaphysics keeps the project feasible for philosophers/lawyers. Functional criteria (A1) are more actionable than perfect boundaries.  
  - **Sequencing:** A1 → B1 → C1 reflects logical dependency. You can't resolve conflicts (B) without boundaries (A), nor design institutions (C) without knowing what to implement.  

  **Verdict: Prioritize Cluster A1 (Functional Boundary Criteria) because establishing a normatively defensible and legally operationalizable threshold for when later-self preferences override prior directives is the indispensable foundation for coherent reform across all other problem clusters.**
