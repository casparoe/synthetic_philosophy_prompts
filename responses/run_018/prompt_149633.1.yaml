prompt: |-
  Hey, I'm running a workshop for sociology grad students — smart, but zero analytic phil background — and I want them to understand standing to blame and why hypocrisy undermines it. I'm framing it around a distinction I'm calling mirror vs structural hypocrisy: mirror is blaming you for the exact fault you have (like screaming at someone for being loud), structural is blaming you for X while I do Y, where X and Y share the same underlying moral form — say I call out a colleague for free-riding on shared lab protocols but I'm free-riding on departmental service commitments. I think they disqualify differently, and I want the session built around that.

  Don't explain it to me; plan how I'd teach it. What's the right dependency order — do they need to see standing as an entitlement rather than a reward for virtue before we even introduce hypocrisy, or after? What's the one carrying exmaple that has to contain both mirror and structural versions, and what must it have and lack? I want to avoid the tired 'adultery preacher' case since it's too obvious. What misconceptions will they bring — probably that hypocrisy is just being a bad messanger — and exactly where in the sequence should I head each off? Give me a quick check at the end to see if they grasp why structural hypocrisy is trickier than mirror. And tell me what I should flat-out refuse to explain at this level — I don't want to wander into whether blame is fundamentally a speech act or some deep Kantian machinery they won't follow.
reasoning: |-
  Okay, let me tackle this query step by step. The user is designing a workshop for sociology grad students about standing to blame and hypocrisy. They've introduced a distinction between "mirror" and "structural" hypocrisy and want teaching strategies without getting bogged down in philosophical technicalities. 

  First, I need to understand the core concepts. Mirror hypocrisy involves blaming someone for the exact fault you possess, while structural hypocrisy points to different faults sharing the same moral structure. The challenge is making this accessible to students with no philosophy background. 

  I recall the user wants to avoid the clichéd adultery preacher example. That means I need fresh, relatable cases. Academic settings could work well since the audience are grad students - maybe something around plagiarism or departmental responsibilities. 

  The dependency order matters. Should standing be introduced as an entitlement first? Yes, because if students think of it as a reward for virtue, they'll misunderstand how hypocrisy undermines it. The entitlement framing must come before discussing hypocrisy. 

  For misconceptions, sociology students might equate hypocrisy with "bad messenger" effects. I'll need to explicitly separate truth-value from speaker credibility early on. The "tu quoque" fallacy point should address this. 

  The carrying example needs to show both mirror and structural hypocrisy clearly. A lab scenario could work: mirror hypocrisy when someone violates the exact rule they enforce, structural when different rules share the same free-riding principle. It must lack complicating factors like power imbalances to keep focus on the core concept. 

  At the end, a quick check should reveal if they grasp why structural hypocrisy is trickier. Maybe ask them to identify which type is harder to counter and why. 

  What to avoid? Definitely no deep dives into blame as a speech act or Kantian ethics. The focus stays on standing as social license, not moral permission. 

  Workshop flow should be: 
  1) Define blame as social practice 
  2) Introduce standing as entitlement 
  3) Contrast entitlement vs virtue views 
  4) Present mirror hypocrisy 
  5) Transition to structural 
  6) Show how each undermines standing differently 
  7) Quick comprehension check 

  Key teaching moves: use academic examples, preempt "bad messenger" confusion, emphasize the moral structure comparison for structural hypocrisy. The goal is conceptual clarity, not philosophical exhaustiveness.
answer: |-
  Here’s a streamlined workshop plan targeting your goals, avoiding philosophical rabbit holes while ensuring sociological relevance:

  **Core Framework:**  
  Standing → *Why hypocrisy undermines it* → *Mirror vs. Structural distinction* → *Why structural is harder to rebut*

  ---

  ### **Workshop Sequence**  
  *(90 mins total)*  

  1. **Ground Blame in Social Practice (10 mins)**  
     - **Hook:** "When does calling someone out *backfire*? Not because they’re innocent, but because *you* seem unfit to blame?"  
     - **Define Blame Simply:** "Publicly holding someone to a shared norm, expecting change."  
     - **Key Move:** Frame standing as **social license to participate** in norm-enforcement — *not* about being morally perfect.  

  2. **Standing = Entitlement, Not Sainthood (15 mins)**  
     - **Activity:** Brainstorm examples where "flawed" people *can* legitimately blame (e.g., a recovering addict criticizing active addiction).  
     - **Crucial Point:** Standing is lost only when *your behavior directly undermines your authority on THIS norm*.  
     - **Preempt Misconception:** Pre-empt the "bad messenger" idea: "This isn’t about whether the *message* is true — it’s about whether *you’re positioned to deliver it*."  

  3. **Introduce Mirror Hypocrisy (20 mins)**  
     - **Carrying Example:** **Lab Safety Violations**  
       *Mirror Case:* You scream at a labmate for not wearing goggles... while *your own goggles dangle from your neck*.  
     - **Why It Disqualifies:** You’re *actively* violating the *exact same rule* you’re enforcing. Your blame is performative inconsistency → destroys standing instantly.  
     - **Sociology Hook:** "This is like Goffman’s ‘front stage/back stage’ collapse in norm maintenance."  

  4. **Pivot to Structural Hypocrisy (25 mins)**  
     - **Same Example, Structural Twist:**  
       You publicly shame a labmate for "free-riding" by skipping safety checks (X). Meanwhile, *you chronically skip departmental peer-review duties* (Y).  
     - **Reveal the Moral Form:** Both involve "shirking shared procedural duties that distribute labor fairly."  
     - **Key Contrast:**  
       - Mirror: *Identical* fault (safety negligence).  
       - Structural: *Different* faults sharing a **core principle** (free-riding on collective goods).  
     - **Why Trickier?** Requires arguing that X and Y are morally analogous → Opens debate about norm interpretation/weighting.  

  5. **Address Misconceptions & Depth Check (15 mins)**  
     - **Misconception Head-On:** After defining structural hypocrisy, ask: *"Isn’t this just ‘being a bad person’? Why does this *specific* flaw matter?"*  
       → Clarify: It’s not general "badness" — it’s that *your own actions display disregard for the underlying value* you’re invoking to blame others.  
     - **Quick Grasp Check:**  
       **"Scenario:** Alex calls out Taylor for hoarding conference opportunities (X) while Alex monopolizes grad student funding (Y). Both violate fairness?  
       *Q1: Is this mirror or structural? Why?*  
       *Q2: Could Alex defend their standing? How?*  
       → *Goal:* See if they spot structural form (both = resource monopolization) and that rebuttal requires denying the moral link (e.g., "funding isn’t scarce like conferences!").**  

  6. **Sociological Payoff (5 mins)**  
     - **Why This Matters:** Hypocrisy accusations are **power struggles over norm interpretation**. Structural hypocrisy is potent because it forces debates about *which norms are linked* — e.g., is free-riding in *this* context analogous to *that* one?  

  ---

  ### **What to FLATLY Refuse**  
  - **"Is blame a speech act?"** → *Say:* "We’re treating it as a social behavior, not analyzing its linguistic structure."  
  - **"What if norms are unjust?"** → *Say:* "We’re examining standing *within* a norm system, not validating the norms themselves."  
  - **Kant/Rawls/Scanlon:** → *Say:* "We’re focusing on social dynamics, not moral foundations."  

  ---

  ### **Why This Works for Your Audience**  
  - **Relatable Examples:** Academic/research settings mirror their lived experience.  
  - **Entitlement-First:** Avoids virtue ethics tangents by framing standing as *relational authority*.  
  - **Structural Focus:** Leverages their instinct for systemic analysis — hypocrisy as "pattern-matching" moral forms.  
  - **No Jargon:** Uses "moral form/principle" instead of "moral principle *P*" or "maxim."  

  **Final Tip:** Pre-write the Mirror/Structural definitions on a slide. Return to them constantly during Q&A to keep focus. Use the **lab example** consistently — its clarity outweighs minor imperfections.
