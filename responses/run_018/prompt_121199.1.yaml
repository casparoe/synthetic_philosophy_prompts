  ### Classroom Simulation: Moral Revolution in the Mercantile Republic  
  **Objective:** Experience the collapse of a moral norm ("binding challenge") through Bernard Williams' honor erosion lens and Kwame Appiah's status reward redirection.  

  #### **Setup (10 minutes)**  
  1. **Assign Roles (14 students):**  
     - **Challengers (4):** Issue binding challenges to defend/advance their kin-group's standing. Begin with 10 honor credits (H), 5 kinship tokens (K), 20 material coins (M).  
     - **Creditors (4):** Back challenges financially. Hold their kin-group’s M (start: 50 M). Can lend M, but only if the borrower has sufficient H (1 M loan = 1 H collateral).  
     - **Arbitrators (3):** Judge challenges. Start with 15 H. Earn 1 H per “honorable” ruling (pre-shock) but lose 2 H if overturned by peer arbitrators.  
     - **Chroniclers (3):** Record outcomes and assign/reduce H via public narratives (+/- 2 H per challenge). Start with 10 H.  

  2. **Explain Core Mechanics:**  
     - **Binding Challenge:** A challenger accuses another of breaching norms (e.g., "Trader A cheated Kin-B"). Stake H to initiate.  
       - *Accused* must match H stake or forfeit 2x H (shame penalty).  
       - Arbitrators vote (majority wins). Winner takes staked H.  
     - **Tripartite Ledger:**  
       - H (Honor): Non-fungible. Required for loans, marriage pacts, and political influence.  
       - K (Kinship): Tied to family reputation. Lose 1 K if kin-member defaults on a loan.  
       - M (Material): Used for trade. Cannot be converted to H/K.  
     - **Hidden Payoffs:** Participants receive secret objectives (e.g., "Maximize K at all costs") that may conflict with material gain.  

  3. **Distribute Materials:**  
     - Role cards with payoffs and starting resources.  
     - Ledger board (publicly tracks H/K/M).  
     - Scenario prompts (e.g., "Kin-A owes Kin-B 10 M; Kin-B demands repayment with interest").  

  ---  

  #### **Round 1: Pre-Shock (25 minutes: 10–35 min)**  
  - **Activity:**  
    - Challengers initiate 1–2 binding challenges (e.g., commercial disputes, honor violations).  
    - Creditors fund challenges (or refuse, risking K loss).  
    - Arbitrators justify rulings based on "republican virtue."  
    - Chroniclers publish 1–2 sentences amplifying/shaming outcomes (e.g., "Kin-C’s victory proves their integrity!").  
  - **Facilitator Notes:**  
    - Observe if students treat H as currency (correct by reminding: "Honor affects kinship ties—your sister’s marriage depends on your H!").  
    - Ensure hidden payoffs create tension (e.g., a creditor’s objective to "protect family K" may override funding a profitable challenge).  

  ---  

  #### **Exogenous Shock (35 min mark, silent)**  
  - **Action:** Redistribute *unannounced* status rewards:  
    - Chroniclers’ new payoff: Gain 2 M for narratives mocking "outdated" challenges.  
    - Arbitrators’ new payoff: Gain 2 M for fast (not "honorable") rulings.  
    - Creditors’ new payoff: Gain 3 H for denying loans to low-H kin.  
    - *Do not announce changes.* Hand out updated role cards during a "market report" intermission.  

  ---  

  #### **Round 2: Post-Shock (20 minutes: 35–55 min)**  
  - **Activity:**  
    - Challengers face refusals to fund/accept challenges (creditors/arbitrators chase new payoffs).  
    - Chroniclers publish satirical takes (e.g., "Why duel when wealth buys respect?"), eroding challenge legitimacy.  
    - Ledger updates show H devaluation (e.g., high-H kin denied loans).  
  - **Facilitator Notes:**  
    - If students miss the shame component (e.g., "Who cares about H?"), inject: "The crowd gasps as Elder Grey spurns your handshake—your K drops!").  
    - Track decisions: Rational arguments (appeals to fairness), material moves (profit-seeking), honor shifts (public shaming).  

  ---  

  #### **Resolution (15 minutes: 55–70 min)**  
  1. **Final Ledger Review:** Compare H/K/M changes. Identify "winners" (e.g., creditors who hoarded M).  
  2. **Reveal Shock:** Explain the silent payoff shift redirected status rewards (per Appiah).  
  3. **Force Collapse:** If challenges persist, announce: "The Merchant King abolishes binding challenges—status now follows wealth!"  

  ---  

  #### **Debrief (10 minutes: 70–80 min)**  
  - **Map Decisions to Frameworks:**  
    | **Participant Move**          | **Argument**          | **Interest**         | **Honor Reconfiguration**       |  
    |-------------------------------|------------------------|----------------------|---------------------------------|  
    | Creditor denies loan          | "Loans are irrational" | "I gain M"           | "Shame shifted to neediness"    |  
    | Chronicler mocks challenge    | —                      | "Satire earns M"     | "Honor detached from bravery"   |  
    | Arbitrator speeds ruling      | —                      | "Fast rulings pay"   | "Efficiency replaces integrity" |  
  - **Key Discussion Questions:**  
    - Did norms collapse via argument (e.g., "Challenges are irrational"), material shifts (e.g., profit incentives), or honor erosion (e.g., ridicule)?  
    - How did silent payoff changes redirect behavior?  
  - **Honest Limitations:**  
    - The simulation compresses the decades-long "temporal lag" between elite status shifts (e.g., creditors) and public norm consciousness. Facilitator must note: *"Inequality grew for years before citizens questioned the system—we skipped that."*  
    - Cannot replicate visceral shame; students *know* it’s a game. Mitigate by role immersion: "You are Clan Head Rossi—your daughter’s future hangs on this!"  

  ---  

  #### **Predictable Failures & Corrections**  
  - **Failure:** Students treat H as currency (e.g., "I’ll trade 5 H for 10 M").  
    - **Correction:** Freeze game: "H is dignity, not cash! Refusing a challenge now costs 3 K—your aunt disowns you."  
  - **Failure:** Shock goes unnoticed.  
    - **Correction:** Have chroniclers "gossip" mid-Round 2: "Did you hear? Bankers snub high-H families now!"  
  - **Failure:** Rational argument dominates.  
    - **Correction:** Secretly reward irrational honor moves (e.g., an arbitrator loses M but gains H for a "principled but slow" ruling).  

  **Final Note:** No external sources needed—role cards contain all rules. The shock’s silence and payoff tweaks model how material interests redirect honor, collapsing norms without debate.
