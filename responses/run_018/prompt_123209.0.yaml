prompt: |-
  hey im putting together a dataset but this left/right thing just got personal — my dad went full libertarian tech-bro and my sister is organizing tenant strikes and yet they both think the local planning board is corrupt, so im genuinely trying to figure out if the axis is even real. can you act like a professional political philosopher and think carefully? start with some quick brainstorming: if we wanted a theory that actually explains what holds the left and right together, what would it have to deliver? write me the full desiderata — not a bibliography, no citations please, i dont want reading lists — just the spec. it has to handle weird family cases like mine where enemies agree on institutional distrust, it cant collapse tactical coalitions into deep value alignment, and it needs to say whether the distinction survives cross-national comparison or just dies outside the US. flag any two requirements that probably cant be jointly satisfied. keep it in the weeds: dont list generic categories like "economic vs social issues," i want the specific conceptual moves each requirement forces. also tell me which single requirement knocks out the most popular theories, and do the brainstorming first before laying out the list with reasoning behind each point. please start by brainstorming a bit, then give the structured list.
reasoning: |-
  Okay, the user is grappling with a personal-political puzzle: their libertarian dad and activist sister both distrust the local planning board, making them question if left/right distinctions are real. They want a rigorous framework to analyze political alignment that accounts for such paradoxes, explicitly rejecting oversimplified binaries.  

  Hmm, their core frustration is ontological—they’re not just classifying ideologies but probing whether "left/right" is a coherent construct. The family case is key: it demands a theory that doesn’t conflate shared tactics (distrust) with shared values. They also want cross-national applicability, which immediately destabilizes US-centric models.  

  *Brainstorming friction points*:  
  - **Agreement ≠ Alignment**: The planning board example shows enemies converging tactically without value convergence. Any theory must disentangle this.  
  - **Coalitional Fluidity**: If "left/right" is rigid, how do temporary alliances (like populist moments) form? The spec must allow for tactical glue without erasing deeper divides.  
  - **Scale Dependency**: Distrust might be hyper-local (planning board) vs. systemic (capitalism). Theories ignoring granularity will fail.  
  - **Cultural Contingency**: In Germany, "libertarian" means something different than in Texas. Can the axis survive translation?  

  *Desiderata taking shape*:  
  1. **Non-Reductive Conflict Mapping**: Must show how opposing groups can share enemies (planning board) without sharing end goals.  
  2. **Tactical/Strategic Decoupling**: Explain why dad/sister cooperate tactically yet remain strategic foes.  
  3. **Nested Opposition**: Handle conflicts at different scales (local corruption vs. global inequality).  
  4. **Axis Stability Test**: Does "left/right" hold when ported to, say, Japan’s labor politics?  
  5. **Value vs. Method Distinction**: Dad’s deregulation vs. sister’s collectivism—same "anti-corruption" language, opposite solutions.  

  *Biggest theory-killer?* **Requirement 2 (tactical/strategic decoupling)**. Most popular models (e.g., horseshoe theory) collapse shared tactics into ideological similarity. Marxist/materialist frameworks also struggle—they’d see planning board conflict as *only* class struggle, missing libertarian anti-statism.  

  *Impossible pair?* **Simultaneously satisfying cross-national validity (4) and local tactical flexibility (2)**. If the axis is culturally fluid, can it explain why certain alliances (e.g., anti-elite coalitions) emerge everywhere? But rigid definitions break in translation. Trade-off inevitable.  

  Final note: User’s "weeds" demand means avoiding labels like "economic axis." Instead, frame conflicts as *modes of social power negotiation*—e.g., dad wants to *exit* the system, sister wants to *restructure* it. That’s the granular move.
answer: |-
  Here’s a professional brainstorming session followed by a structured desiderata list for a theory of left/right cohesion, designed to handle your family paradox and cross-cutting alliances. The goal is a framework that explains **how opposing factions share tactical ground without erasing foundational divides**.

  ---

  ### **Brainstorming Core Challenges**
  1. **The "Enemy of My Enemy" Trap**: Your dad (libertarian/tech-bro) and sister (tenant organizer) both attack the planning board but for inverted reasons:  
     - Dad sees it as *overreach* (state coercion limiting individual freedom/property rights).  
     - Sister sees it as *capture* (state enabling landlord/corporate power through biased rules).  
     → Theory must separate *shared antagonism* from *divergent diagnoses* without reducing to "populism."  

  2. **Tactical vs. Deep Alignment**: Their coalition is transactional (dismantling a specific institution) not ideological (what replaces it). Theory must distinguish:  
     - **Tactical glue**: Short-term goals (e.g., "this institution is corrupt").  
     - **Strategic irreconcilability**: Dad wants marketized solutions; sister wants collective ownership.  

  3. **Axis Survival Test**: In France, the "right" might defend state cultural policy (secularism) while the "left" attacks it as exclusionary—reversing U.S. libertarian/democrat dynamics. Theory must explain why the axis persists *structurally* despite policy flip-flops.  

  4. **Non-Collapse Requirement**: The theory can’t imply "all anti-institutionalists are secretly allies." It must preserve the fact that your dad/sister would oppose each other *fiercely* on the board’s replacement.  

  ---

  ### **Desiderata for a Cohesion Theory**  
  *(Ranked by conceptual urgency)*  

  1. **Conflict Scalability**  
     - **Why**: Must explain how local fights (planning board) nest within larger conflicts (state vs. market, hierarchy vs. equality).  
     - **Mechanism**: Map disagreements as fractal—e.g., opposing the board is a *micro-instance* of macro-ideological fights, but resolution paths diverge radically at higher scales.  
     - **Solves**: Your family’s agreement on the board without agreeing on society.  

  2. **Antagonism Source Differentiation**  
     - **Why**: To prevent conflating shared targets with shared values.  
     - **Mechanism**: Classify *why* an institution is distrusted:  
       - **Right-antagonism**: Distrust stems from perceived *constraint on agency* (e.g., regulations blocking innovation).  
       - **Left-antagonism**: Distrust stems from perceived *reinforcement of asymmetry* (e.g., regulations favoring capital).  
     - **Solves**: Dad/sister both shout "corruption!" but point to different moral failures.  

  3. **Teleology Block**  
     - **Why**: Tactical coalitions cannot imply shared end goals.  
     - **Mechanism**: Treat cooperation as *tool-convergence* (e.g., both use "anti-corruption" rhetoric) not *purpose-convergence*. Forces the theory to model how the same tool serves opposing terminal projects.  
     - **Solves**: Prevents misreading your family’s alliance as latent value alignment.  

  4. **Axis Substrate Invariance**  
     - **Why**: Must work cross-nationally without requiring identical policy divides.  
     - **Mechanism**: Define the axis as *meta-conflict over social power allocation*:  
       - **Right**: Tends to justify/restore *inherited or emergent hierarchies* (e.g., markets, tradition).  
       - **Left**: Tends to disrupt *inherited or emergent hierarchies* in favor of constructed equity.  
     - **Solves**: Explains why France’s "right" defends state secularism (hierarchy of citizenship) while U.S. right attacks "big gov" (hierarchy of markets).  

  5. **Negative Coalition Trap Flag**  
     - **Why**: To avoid framing alliances as ideological innovations (e.g., "anti-woke coalitions").  
     - **Mechanism**: Identify when cooperation is *negation-driven* (e.g., "smash the board") vs. *affirmation-driven* (e.g., "build participatory zoning"). Flags ephemeral alliances.  

  6. **Epistemic Grounding**  
     - **Why**: Dad/sister both claim "corruption," but their evidence criteria differ.  
     - **Mechanism**: Right often trusts *emergent orders* (e.g., markets, common law); Left often trusts *deliberative orders* (e.g., consensus, procedural justice). Shared distrust emerges when institutions fail *both* tests.  

  ---

  ### **Critical Tensions & Theory-Killers**  
  - **The Impossible Pair**: **#2 (Antagonism Source Differentiation)** and **#4 (Axis Substrate Invariance)** conflict under stress. If the right/left distrust sources are culturally fluid (#4), defining universal "sources" (#2) becomes circular. *Trade-off: Either accept fuzzy boundaries or sacrifice cross-national validity.*  
  - **Biggest Theory-Killer Requirement**: **#3 (Teleology Block)**. Most popular theories (e.g., populism narratives, horseshoe theory) fail by conflating tactical overlap with deep alignment. Libertarian-Marxist "anti-statism" coalitions get misread as ideological fusion, not temporary convenience.  

  ### **Why This Spec Works for Your Case**  
  Your dad and sister share a *negative target* (planning board) but their positive projects are inverted:  
  - Dad’s endgame: **Protect agential freedom** (hierarchy of individual competence).  
  - Sister’s endgame: **Dismantle coercive asymmetry** (hierarchy of capital over labor).  
  The axis holds not on policy but on **what hierarchy they defend or attack**. The planning board is a battleground precisely because *both* read it as hostile to their core project—for mirrored reasons. The distinction survives because their deepest commitments are antagonistic, even when their enemies align.  

  This meets your demand: No "economic vs. social" hand-waving—just power allocation conflicts scaling from zoning boards to constitutions.
