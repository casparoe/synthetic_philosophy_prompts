answer: |-
  ## Villanelle on the Mechanism of Moral Revolution

  At gray dawn, no one stands on the dueling ground.  
  The auction block stays cold, no sermon but the ledger's sound,  
  Where profit withered faster than the moral plea.  

  The challenge hangs unanswered, stark and bare,  
  The witnesses dispersed to different air –  
  **No sermon turned the tide.** The reason’s hard to see.  

  Was sugar’s price the force that broke the chain?  
  Did cotton’s glut absolve the ancient stain?  
  **Honor, the currency debased;** the duelist feels the lack.  

  The pistol case stays shut, the field reviled,  
  Where gentlemen once settled matters wild,  
  **No sermon turned the tide.** The ledger tracks the slack.  

  The great house crumbles, counting costly grace,  
  The overseer’s whip finds empty space,  
  **Honor, the currency debased;** the challenge met with scorn.  

  The silence thick where pistol cracks once flew,  
  No moral treatise told the proud "Adieu!" –  
  **No sermon turned the tide** by reason’s light new-born.  

  The balance sheet, not conscience, cleared the block;  
  The duel died when laughter met the talk –  
  **Honor, the currency debased.** The crowd had turned away.  

  Which lever moved the world? The scale, the word,  
  The vanished nod that made the act absurd?  
  **No sermon turned the tide. Honor, the currency debased.**  

  ---

  **Notes on Execution:**

  *   **Refrains:** "**No sermon turned the tide**" (Williams: skepticism re: moral argument) and "**Honor, the currency debased;**" (Appiah: withdrawal of social recognition) alternate through the stanzas and stand unreconciled in the final couplet.
  *   **Material Interest:** Explicitly woven through concrete imagery ("ledger's sound," "profit withered," "sugar's price," "cotton's glut," "ledger tracks the slack," "counting costly grace," "balance sheet") without being presented as the definitive answer.
  *   **Concrete Imagery:** Gray dawn dueling ground, cold auction block, ledger books, unanswered challenge, dispersed witnesses, shut pistol case, crumbling great house, empty space for the overseer, vanished crowd/laughter.
  *   **Explanatory Ambiguity:**
      *   *Dueling:* Ended by the *absence* on the field (Appiah's withdrawn recognition/honor), the unspoken scorn, the laughter, the vanished crowd – contrasted with the *lack* of effective sermons (Williams). Material interest is less prominent here ("ledger tracks the slack" hints at potential economic irrelevance).
      *   *Slavery:* Ended by the cold block linked to the ledger (material interest), the crumbling house counting cost (material interest), the empty space (Appiah's withdrawal of sanction/social norm collapse) – contrasted again with ineffective sermons or moral pleas.
  *   **Structural Standoff:** The two refrains represent fundamentally different mechanisms. They alternate, never interact directly within the tercets, and are finally forced together in the couplet without resolution or synthesis. The material interest lines weave between them, a persistent third thread that complicates but doesn't settle the dispute between the refrains. The final question ("Which lever moved the world?") explicitly leaves the cause open.
