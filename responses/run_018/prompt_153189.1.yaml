answer: |-
  ## The Scenario and Stakes (120 words)
  The prestigious Centennial University tenure committee faces a contentious case: Professor Aris Thorne, whose research and teaching are universally praised as exceptional, has a documented history of severe, non-academic misconduct causing significant harm to individuals outside the university. The committee's governing charter explicitly lists only "research excellence, teaching effectiveness, and collegiality" as valid criteria for tenure. **Dr. Lin** argues that Thorne's moral record provides *wrong-kind reasons* for denial – reasons that corrupt the evaluation by addressing the person, not the professional role, falling outside the institution's purpose. **Dr. Reyes** counters that "wrong kind" misapplies here; institutional reasons are defined by mandate, making it a question of *exceeding authority*, not reason-type metaphysics. This case strains the standard individual-attitude framing of wrong-kind reasons by forcing it onto collective, mandate-bound decision-making.

  ## The Dialogue (650 words)

  **Dr. Reyes:** Lin, I agree Thorne's actions are reprehensible. But the committee's task isn't to render a global moral judgment on Thorne *as a person*. Our mandate is narrow: assess research, teaching, collegiality *within* the university context for *tenure*. His external actions, however awful, are simply *outside the scope* defined by our institutional role. Calling them "wrong-kind reasons" imports a distinction developed for justifying *attitudes* like belief or admiration – where a reason can cause you to *have* the attitude without *justifying* it. Here, we're making a collective *decision* based on authorized criteria. The only "wrong kind" is reasons violating our mandate.

  **Dr. Lin:** Reyes, I think you concede too much by reducing this to mere mandate boundaries. Even *within* an institution, reasons operate at specific *levels*. Granting tenure affirms Thorne *as a scholar fulfilling this specific role*. His external acts reveal a profound moral character flaw. While not directly violating the charter's criteria, this character flaw is relevant *to the kind of affirmation tenure represents* – it turns the institutional act of granting tenure into an affirmation we shouldn't want to make, given what we know about him *as a person*. This isn't just 'outside mandate'; it's a reason addressing the *wrong level* – the moral subject, not the professional role-bearer – thereby corrupting the evaluative purpose of tenure itself.

  **Dr. Reyes:** Ah, but Lin, you invoke "the evaluative purpose of tenure itself" as if it's self-evident and separable from our mandate. Isn't that circular? Our mandate *defines* the purpose *for this committee*. You say tenure affirms the scholar *as fulfilling the role*, but the role is *defined* by the criteria: research, teaching, collegiality. If Thorne meets those, he fulfills the role *as defined*. Your claim that knowing his external acts makes tenure an affirmation "we shouldn't want to make" smuggles in an *external* moral standard – precisely the kind the charter excludes. Without an independent, objective account of "institutional purpose" beyond the mandate (which we lack), "wrong level" is just a rhetorical way of saying *your* preferred moral considerations aren't included in *our* mandate.

  **Dr. Lin:** You misunderstand. I'm not appealing to an external moral standard *for the decision*, but highlighting a *structural* flaw in using these reasons. Tenure, as an institutional act, has an internal normative structure tied to its function: securing academic freedom for those who advance scholarship and education *here*. Affirming someone like Thorne, knowing his character, doesn't just *feel* wrong; it actively *undermines* the *expressive meaning* and *social trust* inherent in the tenure act *itself*, even if he technically meets the listed criteria. These character-based reasons *target the wrong object* for *this type of institutional judgment*; they concern the agent's overall moral worth, not their fitness for the specific institutional role *as conceived*. Treating them as relevant changes the *nature* of the decision from a professional evaluation to a quasi-moral condemnation or absolution – which *is* outside our competence and purpose.

  **Dr. Reyes:** Now you shift to the *effects* of the decision – "expressive meaning" and "social trust." But these are *consequences* of acting *according to the mandate*, not a demonstration that the *reasons* themselves are of the "wrong kind" metaphysically. If the university community loses trust because we tenured Thorne while meeting the charter criteria, that highlights a potential flaw *in the charter itself*, not in our reasoning *within* the charter. For the *committee*, the only relevant reasons are those bearing on the mandated criteria. Collective agents like committees don't have "attitudes" like belief that require justification in the way individuals do; we have *authorized powers* and *procedures*. The "wrong-kind-reasons" problem arises for individuals precisely because attitudes have constitutive aims that reasons can fail to engage. Institutional decisions have constitutive *procedures* and *mandates*, not constitutive *aims* in the same sense. So, the problem dissolves into questions of mandate interpretation and potential charter reform, not reason-types.

  **Dr. Lin:** But Reyes, the mandate *presupposes* the institution's purpose. Procedures aren't normatively inert shells! Granting tenure *is* an expressive act constitutive of the academic community's values. If the mandate *requires* us to grant tenure to someone whose known character makes that act express *contempt* for the victims or *indifference* to severe harm, then the mandate itself forces us to perform an act that *internally* conflicts with the deeper purpose of fostering a scholarly community – even if we follow the letter. Saying "it's the charter's fault" doesn't resolve the committee's normative dilemma *now*. The character-based reasons *are* the wrong kind *for justifying this specific institutional act* (granting tenure) *as* a legitimate affirmation within the academic enterprise, precisely because they show that performing the act under these conditions perverts its inherent meaning, regardless of procedure. The mandate doesn't magically legitimize every reason it fails to exclude.

  ## The Unresolved Crux (180 words)
  The fundamental, unresolved disagreement is **substantive** and hinges on **competing conceptions of institutional agency and the source of normative constraints on institutional acts.**

  *   **Lin's View:** Institutional acts (like granting tenure) have inherent, purpose-derived normative structures ("internal aims") that transcend their formal mandates. Reasons failing to engage with the act's inherent purpose (e.g., affirming professional role-fitness) and instead targeting a different level (e.g., global moral character) are "wrong kind" – they corrupt the act itself, making it express something incompatible with its institutional function, even if procedurally compliant. Institutional purpose provides an independent normative standard.
  *   **Reyes' View:** Collective institutions derive their normative constraints solely from their constitutive mandates and procedures. They lack the "internal mental state" structure that makes "wrong-kind reasons" a coherent problem for individuals. What Lin calls "inherent purpose" is either reducible to the mandate or an external imposition. "Wrong level" is merely an assertion that a reason falls outside the mandate's scope; the only real constraint is formal authorization ("outside mandate," not "wrong kind").

  **Resolution requires:** Agreeing on the **metaphysics of institutional agency.** Does an institution's act have an inherent, purpose-derived normative structure that can conflict with its formal mandate, or is it normatively defined *only* by its mandate/procedures? This demands a deeper theory of how institutional purposes bind actions beyond explicit rules and whether "expressive meaning" is an inherent property of institutional acts or merely a contingent social perception. Without this, the debate remains stuck between Lin's appeal to institutional integrity and Reyes' appeal to institutional authority.
