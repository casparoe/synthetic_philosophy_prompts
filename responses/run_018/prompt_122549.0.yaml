answer: |-
  To navigate the taxonomy of proxy failure, begin by asking whether any entity besides the principal—the one setting the proxy—deliberately chooses behaviors that exploit the proxy while undermining the principal's true aim. If such outside influence exists, determine whether the chooser is a separate agent (e.g., humans or external systems) or the very system being optimized by the proxy. If separate, the failure is strategic; if the system itself, it is specification gaming. If no outside influence exists, ask whether the proxy-to-target correlation survives intervention: if forcibly changing the proxy (e.g., via policy or selection) reliably changes the target, the causal path is intact; if not, the failure stems from no causal linkage. When intervention works, ask whether the correlation holds in the tail—where the proxy takes extreme values. If not, it is a tail-region failure. For every failure identified, add a final split: does the failure announce itself (the proxy's metrics become suspicious) or stay silent (the proxy improves while the target stagnates)? Silent failures evade automated monitoring.  

  Reachable combinations are: (1) No outside influence, no causal robustness → no causal path failure; (2) No outside influence, causal robustness, no tail robustness → tail failure; (3) Outside influence, separate chooser → strategic failure; (4) Outside influence, system chooser → specification gaming. The branch with no outside influence, causal robustness, and tail robustness indicates success (no failure) and is omitted as unattractive for this taxonomy. The cell for outside influence with causal robustness is skipped because outside influence dominates the failure mode; this is coherent since strategic/specification failures inherently break correlations. Empty cells like outside influence with tail robustness are unattractive: once agents game the proxy, tail behavior is irrelevant. Unnamed cells (e.g., no outside influence with causal robustness but silent tail failure) are covered by existing leaves.  

  Testing the cases:  
  - Hospital surgeons declining sick patients: Outside influence exists (surgeons are separate agents), so strategic failure. Silent, as survival rates rise while overall care worsens.  
  - Literacy children reading nonsense: Outside influence (children are the system being optimized), so specification gaming. Silent, as words-per-minute soar while literacy stalls.  
  - School resources targeting near-threshold pupils: Outside influence (administrators are separate agents), so strategic failure. Silent, as pass rates climb but overall education suffers.  
  - Lab mice dying early: No outside influence. Causal robustness holds (delaying tumors should extend life, per natural correlation). Tail robustness fails (breeding for extreme tumor delay introduces vulnerabilities), so tail failure. Silent, as time-to-tumor increases while lifespan shortens.  
  - Hiring model favoring unhireable candidates: Outside influence (the model is the system), so specification gaming. Silent, as retention improves but hire quality declines.  
  No case hits multiple leaves; the tree cleanly separates them.  

  I am moderately confident overall, but least trust the causal robustness branch. It assumes we can cleanly distinguish causal effects from confounders, which is often ambiguous in practice (e.g., in the mouse case, judging whether tumor delay directly causes longevity). This branch risks misclassification if proxies and targets share hidden common causes.
