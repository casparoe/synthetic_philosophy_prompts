  ### Branching Taxonomy for Moral Worth in Advanced Philosophy Seminar

  **Root Node: Tracking Question**  
  *Must an agent’s motivating reason correctly identify the feature that actually confers rightness on the act for the act to possess full moral worth?*  
  - **Yes** → Proceed to Meta-Reason Error Case  
  - **No** → Proceed to Structural-Substitution Case  

  ---

  #### **Meta-Reason Error Case** (for "Yes" branch)  
  *An agent returns lost property because she erroneously believes a specific religious text commands it (though impartial respect for ownership is the true right-making feature). Does this false meta-belief undermine the moral worth of her action?*  
  - **Yes** (error undermines worth) → Proceed to Structural-Substitution Case (for "Yes" branch)  
  - **No** (error does not undermine worth) → **Leaf: Unnamed Hybrid**  
    - *Most awkward commitment: An agent acting on blatantly false beliefs (e.g., "God commands this") can have full moral worth if her reason accidentally aligns with the right-making feature.*  

  ---

  #### **Structural-Substitution Case** (for "Yes → Yes" branch)  
  *A civil servant applies an equitable distribution rule without personally grasping its justice, relying solely on institutional compliance. Can this act possess moral worth if the social architecture reliably aligns her behavior with rightness?*  
  - **Yes** (institutional compliance suffices) → Proceed to Fragility Condition  
  - **No** (personal grasp required) → Proceed to Fragility Condition  

  #### **Structural-Substitution Case** (for "No" branch from root)  
  *(Same case as above)*  
  - **Yes** → Proceed to Fragility Condition  
  - **No** → Proceed to Fragility Condition  

  ---

  #### **Fragility Condition** (for all branches)  
  *An agent helps a stranger for the correct reason (e.g., compassion), but would have refused if her belief about a minor risk (e.g., 5% chance of harm) were slightly amplified. Does this brittleness diminish or erase moral worth?*  
  - **Yes** (brittleness undermines worth) → Assign to leaf  
  - **No** (brittleness irrelevant) → Assign to leaf  

  ---

  ### Leaf Nodes (Theories)  
  1. **Strict Kantian Rationalism**  
     - *Path:* Root(Yes) → Meta-Error(Yes) → Struct-Subst(No) → Fragility(Yes)  
     - *Most awkward commitment:* An agent who would abandon a duty due to a trivial counterfactual change (e.g., 5.1% risk instead of 5%) has *zero* moral worth in the actual act.  

  2. **Unnamed Hybrid** (already assigned)  
     - *Path:* Root(Yes) → Meta-Error(No)  
     - (Awkward commitment stated earlier)  

  3. **Humean Sentimentalism (Modified)**  
     - *Path:* Root(No) → Struct-Subst(Yes) → Fragility(No)  
     - *Most awkward commitment:* A bureaucrat blindly following a fair rule has full moral worth even if motivated by careerism, provided the institution is well-designed.  

  4. **Consequentialist Reason-Irrelevance**  
     - *Path:* Root(No) → Struct-Subst(No) → Fragility(No)  
     - *Most awkward commitment:* An anti-Semite saving a Jew *to exploit them later* has full moral worth if the act maximizes utility.  

  5. **Aristotelian Virtue Habituation**  
     - *Path:* Root(No) → Struct-Subst(No) → Fragility(Yes)  
     - *Most awkward commitment:* A lifelong philanthropist loses all moral worth if a single counterfactual tweak (e.g., slightly higher personal cost) would make them withhold aid.  

  6. **Structural Kantianism** (Unnamed)  
     - *Path:* Root(Yes) → Meta-Error(Yes) → Struct-Subst(Yes) → Fragility(Yes)  
     - *Most awkward commitment:* A rule-following agent gains moral worth only if they *would* reject the rule under any minor counterfactual where it misfires.  

  7. **Robust Instrumentalism** (Unnamed)  
     - *Path:* Root(Yes) → Meta-Error(Yes) → Struct-Subst(Yes) → Fragility(No)  
     - *Most awkward commitment:* A self-interested civil servant has full moral worth for applying a just rule, even if they’d abandon it for negligible personal gain.  

  ---

  ### Logically Possible but Unoccupied Positions  
  1. **Path:** Root(No) → Struct-Subst(Yes) → Fragility(Yes)  
     - *Combination:* No tracking required + institutional compliance suffices + brittleness erodes worth.  
     - *Diagnosis:* **Unattractive incoherence.** If institutions confer worth without personal insight, brittleness in individual reasoning should be irrelevant. The pairing is self-undermining.  

  2. **Path:** Root(Yes) → Meta-Error(Yes) → Struct-Subst(No) → Fragility(No)  
     - *Combination:* Tracking required + meta-error undermines + personal grasp required + brittleness irrelevant.  
     - *Diagnosis:* **Unexplored territory.** Demands rigid correctness in motivation but ignores counterfactual instability. No theory combines these, as Kantians (closest match) reject fragility-irrelevance.  

  ---

  ### Tree Summary  
  - **Internal Nodes (7):** Root + Meta-Reason Error (×1) + Structural-Substitution (×2) + Fragility (×4).  
  - **Leaves (7):** All positions derived from case-based splits.  
  - **Diagnostic Flow:** Traversable solely through intuitive judgments on concrete cases (no doctrinal labels).
