answer: |-
  An intriguing and precisely delineated problem—one that cuts to the heart of constrained translation's paradoxes. While no *universally established* term exists for this **specific phenomenon** in mainstream translation theory, several adjacent concepts and potential coinages merit consideration. Below is a structural analysis:

  ### Close but Non-Equivalent Concepts
  1. **"Formalist Paradox"** (adjacent):  
     Describes contradictions arising from prioritising form over semantics. However, it lacks specificity for *logical inversion* and often implies translator choice rather than systemic linguistic constraint.

  2. **"Structural Reversal"** (Jakobsonian/Prague School):  
     Relates to shifts in functional sentence perspective (FSP) or communicative dynamism. Useful for syntactic reordering but insufficient for capturing *argumentative negation* via prosodic necessity.

  3. **"Hermeneutic Distortion"** (Steiner/Gadamer):  
     Focuses on interpretive bias, not the *mechanical inversion* caused by prosodic accommodation. Your case involves inadvertent reversal, not conscious reinterpretation.

  4. **"Constraint-Induced Transmutation"** (Oulipo-adjacent):  
     Acknowledges formal rules altering meaning, but is overly broad (e.g., includes lipograms).

  ### Proposed Terminology & Demarcation
  Given the gap, I propose **"prosodic pragmatics inversion"** or **"metrical counter-logic"** to isolate your phenomenon. To distinguish it clearly:

  #### Defining Criteria  
  | **Feature**               | **This Phenomenon**                                  | **Macro-Structural Distortion** | **Intentional Reinterpretation** |  
  |----------------------------|------------------------------------------------------|----------------------------------|-----------------------------------|  
  | **Formal Fidelity**        | Absolute (metre, rhyme, stanza preserved)            | Variable                         | Often sacrificed                  |  
  | **Local Lexical Accuracy** | Maintained (no "mistranslation")                     | Often compromised                | May be altered deliberately       |  
  | **Global Argument**        | Reversed (e.g., conditional → assertion)             | Distorted but not necessarily inverted | Reimagined ideologically          |  
  | **Cause**                  | Syntax-prosody conflict in target language           | Cultural/interpretive bias       | Translator’s agenda               |  
  | **Intentionality**         | Unintended (systemic constraint)                     | Unconscious or conscious         | Wholly deliberate                 |  

  ### Key Differentiae
  - **Vs. Mistranslation**: Here, no individual lexical/syntactic choice is erroneous; the reversal emerges *only* from cumulative formal constraints.  
  - **Vs. Adaptation**: The translator *intends* fidelity but is forced into reversal; adaptation consciously alters form/meaning.  
  - **Vs. Foreignisation**: No strategic emphasis on source-culture "otherness"—the inversion is an accident of linguistic incongruity.  

  ### Theoretical Anchoring
  This maps onto Roman Jakobson’s **"poetic function"** (where form dictates structure) intersecting with **pragmatic failure** in translation: the original’s illocutionary force (e.g., negation) is subverted by the L2’s syntactic-prosodic necessities. Venuti’s "resistancy" is insufficient, as the issue isn’t cultural hegemony but *morphosyntactic determinism*.

  ### Recommended Usage
  In your thesis, operationalise it as:  
  > **Prosodic-Argumentative Inversion (PAI)**: *A translational phenomenon wherein strict preservation of metrical, rhyming, or stanzaic structures in a target language necessitates syntactic reconfigurations that systematically reverse the logical argument of the source text, despite local lexical accuracy.*  

  ### Illustrative Refinement (Your Marot Example)
  - **Source**: "Si ce n’est toi, c’est donc ton frère" → *Negation precedes condition*.  
  - **English PA Inversion**: To maintain rhyme/metre → "If not you, it must be your brother" *asserts the condition while appearing to negate it*.  
  Here, Marot’s *denial* becomes an *hypothetical admission* due to English’s subordinating syntax.  

  ### Conclusion
  While PAI lacks a canonical term, it constitutes a distinct failure mode in constrained translation—a **covert betrayal of logic through hyper-fidelity to form**. Its diagnostic power lies in exposing how prosody can override pragmatics when linguistic systems clash. For theoretical rigour, embed it within discussions of **untranslatability** (Cassin) and **semantic prosody** (Sinclair), emphasising its *emergent, systemic* nature.  

  Would a tabulated comparison with related terms (e.g., compensation, calque) further aid your framework? I am at your disposal.
