prompt: |-
  My friend has an arguemnt about Goodhart and rationality that seems to show rational decision theory is impossible, and I cant find the crack. (1) Any normative theory of choice has to specify what counts as good reasoning, otherwise it's just "trust your gut." (2) Once you specify a criterion — expected utility, coherence, whatever — that criterion becomes a measurable proxy for rationality. (3) Goodhart's law says that once a proxy becomes a target, people (or training processes, or evolutionary selection) will adapt to maximize the proxy instead of the real thing. (4) So any explicit decision rule will eventually be satisfied by choices that score high on the rule but are actually terrible decisions — that's just specifcation gaming applied to reasoning itself. (5) Therefore any theory we can actually write down will eventually license irrational choices. (6) But if a theory licenses irrational choices, it's not a theory of rationality. (7) So there can't be a correct, specifiable theory of rational choice. He wants to keep (1) and (3) and is willing to ditch (6) if he has to, but that feels like giving up the point of the project. Which step is the weak link? Is there an equivocation between "optimizing a reward signal" and "following a decision rule"? Or is the argument basically right and rational choice theory really is self-undermining?
reasoning: |-
  Okay, let me try to unpack this user's problem. Their friend is arguing that rational decision theory is impossible because of Goodhart's Law. The key steps are that any normative theory needs a criterion (like expected utility), but then that criterion becomes a target people game, leading to irrational choices. So the theory ends up licensing irrationality and can't be a true theory of rationality.

  First, I need to understand where the argument might be flawed. Step 2 seems crucial—equating specifying a criterion with creating a measurable proxy. But not all criteria are easily measurable proxies. For example, coherence axioms in decision theory are structural, not a simple metric to maximize. So maybe there's a conflation here between different types of criteria.

  Then step 4 talks about specification gaming. But is applying Goodhart's Law to reasoning itself valid? Goodhart's Law typically applies to quantitative proxies, but rationality involves qualitative rules like avoiding contradictions or updating beliefs with evidence. Gaming these might not be as straightforward as tweaking a metric. For instance, Bayesian updating is a rule, but gaming it could lead to irrational beliefs, which the theory itself might account for by requiring calibration to reality.

  The user mentioned their friend is willing to ditch step 6, which claims that if a theory licenses irrational choices, it isn't rational. But that's a tough pill to swallow because it undermines the whole project. Maybe the solution is that a good theory minimizes such cases rather than eliminating them entirely. No theory is perfect, but some are robust enough to handle most scenarios.

  Also, the equivocation between optimizing a reward signal and following a decision rule is a potential weak point. Decision rules like maximizing utility aren't just about hitting a number; they involve constraints and principles that, when followed, lead to better outcomes. If someone games the system by satisfying the letter but not the spirit, the theory might already exclude such behavior through its axioms. For example, coherence requires consistent preferences, which might prevent obvious gaming.

  The user's deeper concern might be a fear that rationality is unattainable. They need reassurance that while perfection isn't possible, structured approaches like decision theory are still valuable. Their friend's argument might stem from misunderstanding how decision theories handle edge cases or conflating different types of proxies. Highlighting the distinction between quantifiable metrics and structural principles could address that.
answer: |-
  Your friend's argument is clever and touches on deep issues in decision theory, but it has a critical flaw. The weak link is **Step 2** ("Once you specify a criterion... it becomes a measurable proxy") combined with an **equivocation on "proxy"** and a **misapplication of Goodhart's Law** to *structural* coherence requirements.

  Here's the breakdown:

  1.  **The Problem with Step 2: Conflating "Criterion" with "Quantifiable Proxy"**
      *   Not all normative criteria are "measurable proxies" in the sense Goodhart's Law typically applies to. Goodhart's Law is most potent when:
          *   There's a single, easily measurable numerical score (e.g., GDP, test scores, clicks).
          *   There's a complex, hard-to-measure underlying goal (e.g., societal well-being, true understanding, meaningful engagement).
      *   Decision theories like **Expected Utility Theory (EU)** or **Coherence Criteria (e.g., avoiding Dutch Books)** are fundamentally **structural constraints on preferences and beliefs**, not simple numerical scores to maximize.
          *   **EU:** Requires preferences over acts to satisfy axioms (completeness, transitivity, independence, continuity) that *imply* the existence of a probability measure and a utility function such that one act is preferred to another *if and only if* its expected utility is higher. The "criterion" is *satisfying the axioms*, not "maximizing expected utility" as a raw score detached from the underlying preferences it's supposed to represent.
          *   **Coherence:** Requires that your beliefs (probabilities) and preferences (utilities) don't create situations where someone can construct a "Dutch Book" – a set of bets you would accept that guarantees you a loss no matter what happens. The criterion is *avoiding logical inconsistency and arbitrage*, not "minimizing Dutch Book vulnerability" as a score.

  2.  **The Equivocation on "Proxy" and "Target"**
      *   Goodhart's Law relies on a distinction between a *proxy measure* and the *true goal*. The argument implicitly treats *any* specified criterion (like coherence) as the *proxy*, and "true rationality" as the *goal*.
      *   **But what is "true rationality"?** For proponents of these decision theories, satisfying the axioms *is* the operational definition of rationality *for instrumental purposes* (making consistent choices that avoid predictable loss). The structural constraints *are the goal*, not a proxy for some other nebulous "real rationality." The theory *defines* rationality as satisfying those constraints.
      *   The argument smuggles in an undefined, inaccessible "true rationality" that the specified criterion is only a proxy *for*. This is question-begging. If satisfying the axioms is the definition, then choices satisfying them *are* rational *by definition* within that framework.

  3.  **Misapplication of Goodhart's Law: Gaming Structure vs. Gaming a Metric**
      *   Goodhart's Law excels at describing how systems optimize a *single, quantifiable metric* at the expense of the underlying goal *because* the metric is an imperfect representation.
      *   Gaming *structural coherence* is fundamentally different and often impossible without violating the very structure you're trying to "game":
          *   **Gaming EU:** You can't "game" satisfying the axioms without actually *having* coherent preferences and beliefs that justify them. If you artificially construct preferences *just* to satisfy the axioms superficially, you likely *violate* the spirit of the axioms (e.g., preferences aren't stable, beliefs aren't grounded in evidence). The axioms are designed to *prevent* inconsistencies that lead to bad outcomes. If your "gamed" choices lead to terrible real-world outcomes *despite satisfying the axioms*, it usually means your utility function or probability assignments are poorly calibrated to reality – a problem the theory acknowledges lies *outside* the scope of pure instrumental rationality (it requires good inputs).
          *   **Gaming Coherence:** You literally cannot "game" avoiding Dutch Books *while still being incoherent*. If your beliefs and desires are incoherent, a clever bookie *can* construct a Dutch Book against you. Satisfying coherence *means* you are immune. Any attempt to "fake" coherence would involve actually *becoming* coherent.

  4.  **Addressing the Core Concern (Specification Gaming Reasoning):**
      *   The valid kernel of the argument is that *any* formal system can have edge cases or be applied in contexts it wasn't designed for, potentially leading to poor outcomes *if the inputs (beliefs, utilities) are bad or the context is misapplied*.
      *   **This is not Goodhart's Law crippling the theory itself; it's a limitation of applying *any* formal model to the messy real world.** Rationality requires not just following rules, but also having accurate inputs (calibrated beliefs, well-considered values) and applying the rules appropriately to the situation.
      *   **The theory itself provides the tools to diagnose failure:** If following EU leads to terrible outcomes, the theory points you to examine your probability assessments or utility function. If you get Dutch Booked, the theory tells you your beliefs/preferences were incoherent.

  5.  **Re-evaluating Step 6 & 7:**
      *   Step 6 ("if a theory licenses irrational choices, it's not a theory of rationality") is too strong. No theory is perfect or applicable in all conceivable scenarios (especially unrealistic, adversarial ones designed to break it). A theory can be "correct" *as a normative standard for instrumental rationality within its domain* even if:
          *   Bad inputs lead to bad outputs.
          *   It has limitations in extreme or ill-defined situations.
          *   Malicious actors try to exploit its formal structure in unrealistic ways.
      *   The goal isn't a perfect, un-gameable oracle, but the *best available standard* for consistent, goal-directed action under uncertainty. Ditching Step 6 isn't "giving up," it's acknowledging that normative theories are *standards*, not infallible gods. They are tools that work remarkably well when used correctly with good inputs.

  **The Weak Links Summarized:**

  1.  **Step 2:** Incorrectly assumes all normative criteria (especially structural coherence axioms) are simple, quantifiable "proxies" vulnerable to Goodhart optimization in the same way GDP or test scores are.
  2.  **Equivocation:** Treats the specified criterion (e.g., coherence) as a *proxy* for an undefined "true rationality," rather than accepting it as the *operational definition* of rationality within the theory.
  3.  **Misapplication of Goodhart's Law:** Fails to recognize that gaming structural constraints like coherence or EU axioms often *requires* satisfying the underlying principle they embody or leads to violations detectable by the theory itself. Goodhart's Law is less potent against structural constraints than against simple numerical scores.

  **Conclusion:** The argument is **not** correct. Rational choice theory (e.g., Bayesian decision theory/EU) is not fundamentally self-undermining by Goodhart's Law. Its core strength lies in its structural constraints on consistency, which are resistant to the kind of simple metric-gaming Goodhart describes. While formal theories have limitations and require good inputs/context, they remain powerful and valuable normative standards for instrumental rationality. The crack is in the conflation of structural coherence requirements with simple optimizable metrics.
