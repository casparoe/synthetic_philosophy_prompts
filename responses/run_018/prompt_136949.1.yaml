prompt: |-
  ok so i was talking with my friends last night about why we genuinely enjoy sad art — not just tolerate it for culture points, but actively seek out the stuff that makes us cry. we ran through catharsis, hume's conversion idea, meta-emotional framing, but it all felt like naming mechanisms without saying what an actual explanation has to cover. so before i read more philosphy papers i want the full desiderata list.

  write the requirements any theory of tragic enjoyment must meet. for each one, give the motivating case: why it needs to separate enjoying-the-sadness from enjoying-despite-it, why tragedy can't be collapsed into comedy-with-extra-steps, and how it should treat stacked affect where craft-pleasure and content-grief run parallel without either reducing to the other. i especially want you to inject formal grief into the spec — the idea that a work can sadden us through pure structural moves like a decaying chord or a tracking shot that pulls away, with no fictional suffering behind it. does the theory have to account for that, or can it bracket formal grief as outside the paradox? flag any pair you think are jointly unsatisfiable, maybe something like requiring both that the sadness is genuinely negative and that it's the primary source of pleasure. then briefly score catharsis, hume-style conversion, and control/value views against your list, but keep it short — the list itself is the deliverable. don't ask for citations or a reading list; i want this to stand on its own without me looking anything up.

  please finish with a one-sentence summary of the core tension in your desiderata on the very last line, prefixed exactly as Summary:
