answer: |-
  Here is the complete desiderata list for a theory of tragic enjoyment, structured as requested:

  **Core Requirements & Motivating Cases:**  
  1. **Distinguish *Enjoying Sadness* from *Enjoying Relief/Resolution*:**  
     - *Why needed:* Must explain why we replay *specific sad moments* (e.g., the bleak ending of *Requiem for a Dream*) rather than just value the post-catharsis calm. If relief were the goal, we’d skip to the resolution.  

  2. **Preserve the Genuine Negativity of Sadness:**  
     - *Why needed:* The pain of watching Ophelia’s death or listening to Adagio for Strings must remain *recognizably sorrowful*—not diluted into something else. A theory can’t claim we “misinterpret” the emotion.  

  3. **Position Sadness as the *Primary Object* of Enjoyment:**  
     - *Why needed vs. comedy:* Unlike dark comedy (e.g., *Dr. Strangelove*), tragedy like *Dancer in the Dark* lacks redemptive irony; the sorrow *itself* is sought. Collapsing tragedy into comedy ignores the absence of cognitive relief.  

  4. **Account for *Formal Grief*:**  
     - *Why needed:* A theory must explain why a dissonant cello glissando (Ligeti), an empty landscape photograph (Sugimoto), or Tarkovsky’s protracted silence can evoke profound sadness *without narrative content*. Bracketing this reduces tragedy to storytelling.  

  5. **Resolve *Stacked Affect* Non-Reductively:**  
     - *Why needed:* Must explain how we simultaneously feel grief at Lear’s fate *and* aesthetic awe at Shakespeare’s language (e.g., “Howl, howl, howl!”) without reducing one to the other. Craft-pleasure ≠ compensation for pain.  

  6. **Exclude *Schadenfreude* or *Superiority*:**  
     - *Why needed:* Tragic enjoyment lacks the malice of laughing at misfortune (comedy) or feeling elevated by others’ falls (melodrama). We weep *with* Hector in *The Iliad*, not at him.  

  7. **Accommodate *Repeat Consumption*:**  
     - *Why needed:* Rewatching *Grave of the Fireflies* knowing the outcome defies “suspense” or “novelty” models. The sadness must retain its appeal upon re-engagement.  

  **Flagged Tensions:**  
  - **Requirement #2 (Genuine Negativity) vs. #3 (Primary Source of Pleasure):**  
    How can an experience be *intrinsically negative* yet *constitutively positive* in the context of art? This is the paradox’s core.  
  - **Requirement #4 (Formal Grief) vs. Catharsis Models:**  
    If sadness requires “purgation” of personal trauma, how can abstract forms evoke grief?  

  **Brief Theory Scoring:**  
  - **Catharsis (Aristotle):** Fails #1 (enjoys relief, not sadness) and #4 (no formal grief mechanism). Partial on #5 (craft as vehicle, not parallel).  
  - **Humean Conversion:** Fails #2 (sadness “converted” to pleasure isn’t negative) and #4 (no structural sadness). Strong on #3.  
  - **Control/Value Views (e.g., Aesthetic Rationalism):** Scores well on #5 (stacked affect as distinct layers) and #7 (repetition as valuing the emotion). Risks failing #2 if control neutralizes negativity.  

  **Summary:** The core tension is reconciling how a phenomenally negative emotional state (sadness) can be both authentically experienced and intrinsically sought as the primary locus of aesthetic pleasure.
