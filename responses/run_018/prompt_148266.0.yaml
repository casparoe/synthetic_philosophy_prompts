  The Tribunal will prepare interrogatory questions and later cross-examine the Council while constrained to argue from within the engineered bliss-baseline - they can't use concepts like "struggle" or "earned achievement." There should be a non-monetary stakes system using "legacy coherence points" with penalties for inconsistencies.

  I'll need to create a minute-by-minute timeline covering setup, Council deliberations, Tribunal preparation, cross-examination, and debrief. For the debrief, I should map activity moments to the contrast-collapse objection, predict what might go wrong the first time (like utilitarian reductionism or treating it as sci-fi), and acknowledge limitations - particularly how the activity can only approximate the first-person experience of suffering-free existence.

