prompt: |-
  Hey — I write a column on AI and ideas, and I'm working on a piece about the tool-AI vs. agent-AI fight: the way the same system gets described as a tool when something goes wrong and as an agent when there's a capability demo to run. I need a satirical insert, around 600 words, and I want it as a mock regulatory disclosure form — a nutrition label for agency, something like "Form T-1: Statement of Non-Agency" from an invented industry standards body, with numbered fields, checkboxes, and footnotes that quietly do the real argumentative work.

  The humor has to come from the actual structure of the dispute, not robot-gone-wrong gags: tool/agency being a continuum that paperwork forces into a binary; "human in the loop" degrading into rubber-stamping once the approval rate gets high enough; responsibility laundering through the user's original prompt, so that the more autonomous the system is, the more moral authorship a single sentence is asked to carry; "it has no goals of its own" becoming unfalsifiable once the goals are installed and everyone forgets who installed them; and the classification always landing wherever the liability is most convenient. Feel free to invent a metric or two for the form to grade systems on — some kind of instruction-attribution ratio, or an attribution window measured in minutes or in subtask depth — and I'd especially like a reductio clause where a deployment indistinguishable from hiring a competent contractor ends up classified so that the human operator is the instrument.

  Keep it deadpan, no winking at the reader, and write it in American English. Thanks!
