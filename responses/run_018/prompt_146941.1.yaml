  The user's subtle point about separability "without reducing to either" is key. A process-oriented view (inspired by Daoist/Buddhist thought) could help: form and color aren't separable entities but interdependent aspects that language artificially isolates. The white horse's horseness isn't denied—it's contextually foregrounded or backgrounded by our terms. This resolves Jordan's empty-category worry while honoring Maya's insight that naming isn't passive labeling.

