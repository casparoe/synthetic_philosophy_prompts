prompt: |-
  hey, in our phil-sci discussion group yesterday someone shut down my question about whether chemical explanations are redundant if chemistry is ontologically reducible to physics. They just said 'more is different' like that ended it. I want to come back with a disambiguation menu. What are teh precise claims that slogan could actually be expressing? I'm guessing there's a weak statistical version about macro patterns being computationally intractable, an epistemic version saying we need autonomous macro-sciences for practical reasons, an ontological version with genuinely new downward causal powers, and maybe a modal version where macro-laws have independent modal force even under supervenience. For each: is it a platitude, is it defensible, is it false, and does it actually justify dismissing my redundancy question? Also which version is the one people usually invoke as a conversation-stopper, and is there a hidden tension with physical causal closure if downward causation is in the mix? Lay it out as options with verdicts, not one 'correct' reading. I don't need citations or a reading list — just map the logic and flag any sloppy moves.
