answer: |-
  Here is the five-point summary in the requested format:

  1.  **The Question:** Precisely what conditions must an optimality model satisfy to test an adaptationist hypothesis (that a trait's current form was shaped by selection for a specific effect) rather than merely illustrate one, specifically requiring explicit specification of both the assumed accessible variant set (arrival) and whether the hypothesis concerns historical selection (etiological) or current functional necessity (dispositional/entrenchment).

  2.  **Why Existing Positions Leave It Open:** Both adaptationist and spandrels critiques focus debate solely on the frequency of adaptive *retention* via *etiological* selection, neglecting the distinct explanatory roles of developmental/mutational *arrival* constraints and *dispositional* functional entrenchment, while treating trait individuation as unproblematic.

  3.  **Method and Advantage Over Alternatives:** Analyzing case studies through the arrival/retention and etiological/dispositional axes provides specific, biologically applicable criteria for validating models, unlike inconclusive head-counts, purely theoretical conceptual analysis lacking operational guidance, or wholesale historicism incompatible with predictive modeling.

  4.  **Possible Conclusions and Failure Conditions:** Success demonstrates how the axes resolve apparent stalemates in specific cases and provide concrete requirements for model testing; failure occurs if the axes add no novel explanatory power or case studies fail to show the axes separating empirically.

  5.  **Cuts and Weakest Point:** Cut exhaustive literature surveys, detailed history of the debate, and comprehensive coverage of all constraint types; the weakest point is justifying the primacy of these specific axes over other potential factors influencing the adaptationist question.
