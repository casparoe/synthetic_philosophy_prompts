  hey — i'm a journalist who covers science and ideas, and next tuesday i'm intervewing dr. marek voss for a long feature. he just published a monograph arguing that sidgwick's involvement with the society for psychical research wasn't just a biographical footnote but actually shaped the evidential architecture of The Methods of Ethics. specifically, voss claims sidgwick practiced a kind of 'controlled credulity' toward telepathic reports — demanding reproducible conditions, peer testimony, strict controls — that he deliberately withheld from moral intuition, and that this asymmetry explains why sidgwick was so hesitant about utilitarianism despite treating it as self-evident.

  i want about 7 or 8 interview questions that stay deep in the weeds. don't ask him about his childhood or why philosophy matters. instead, press on the mechanism: how exactly does he think psychical research changed sidgwick's view of what counts as a 'clear intuition'? ask whether sidgwick's rigorous standards for paranormal evidence actually make his ethical intuitionism look like special pleading. include a follow-up for the likely deflection that sidgwick was just being empirically open-minded — push on whether that openness doesn't collapse into skepticism about ethics if applied consistently. also ask what happens to the three fundamental principles if we apply sidgwick's psychical-research evidential bar to them: do they survive? and ask if there's any archival trace of sidgwick himself drawing this parallel, or if voss is projecting a modern framework onto 19th-century work. please weave the follow-ups right into the questions so i can read them aloud naturally.

  write this casually — i made a couple typos on purpose, like 'intervewing' and 'recieve', but don't overdo it. and please tell me how confident you are in this framing, and flag the specific point you're least sure about.
