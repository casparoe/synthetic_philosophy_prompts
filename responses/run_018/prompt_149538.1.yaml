answer: |-
  ### Practice Reconstructed (150 words)
  This practice involves asymmetrical enforcement of social conventions (e.g., tipping 15–20%, orderly queuing, obeying pedestrian signals) across local/outsider status. **Legally**, norms lack formal penalties but gain quasi-legal force through institutional framing (e.g., tipping guides presented as binding commitments in hotels). **Institutionally**, businesses design cues (signs, scripts) implying visitors "opt in" to norms by entering spaces, while locals face no such explicit consent mechanisms. **Informally**, communities impose corrective sanctions—disapproving remarks, service delays, exclusion—disproportionately on outsiders. Locals enjoy exculpatory narratives ("stress," "distraction"), but identical outsider violations are attributed to character flaws (laziness, disrespect). The asymmetry lies in *severity of judgment* and *access to excuses*, despite identical acts. Outsiders are held to strict compliance as a "membership test," while locals benefit from a presumption of goodwill.

  ---

  ### Implicit Commitments Reconstructed (500 words)
  The practice presupposes a **particularist, membership-dependent view of obligation** grounded in three core philosophical commitments:

  1.  **Obligation as Tacit Consent via Presence:**  
      Entry into a communal space (café, transit system) is treated as *implicit agreement* to local conventions. This draws from social contract theory but applies selectively: outsiders "consent" by choosing to visit, while locals' presence is seen as non-consensual (they "belong"). Obligation arises from *voluntarily entering a norm-governed domain*, making breach a violation of implied terms. This explains institutional framing (e.g., tipping cards as "contracts" for visitors).

  2.  **Moral Significance of Cultural Membership:**  
      Norms bind asymmetrically based on perceived cultural affiliation. Locals possess *default standing* as normative co-authors; their occasional lapses don't challenge the system's legitimacy. Outsiders lack this standing—their compliance is a *condition for provisional inclusion*. The practice thus assumes **strong particularism**: moral duties are not universal but conditional on relational identity (insider vs. outsider) within a shared practice. Respect is owed not to abstract persons but to *this community's collective self-determination*.

  3.  **Epistemic Privilege & the "Reasonable Visitor" Standard:**  
      Locals enjoy a presumption of normative competence; their violations reflect situational factors, not ignorance. Outsiders are presumed capable of knowing norms *in advance* or immediately upon entry ("reasonable visitor" expectation). Failure signals *culpable ignorance* or willful disregard, not blameless uncertainty. This presupposes norms are transparent, easily learnable, and universally binding *within the jurisdiction*—contradicting claims of their non-universality.

  **What It Strictly Presupposes:**  
  - Particularism: Obligations arise from relational status (member/non-member).  
  - Tacit consent via spatial entry for non-members.  
  - Collective autonomy justifies enforcing conventions as a condition of access.  
  - Outsiders bear higher epistemic responsibility to learn norms.  

  **What Merely Fits:**  
  - Harm avoidance: While tipping may prevent wage harm, jaywalking sans cars causes no harm, yet is enforced. Harm avoidance is secondary to respect for collective will.  
  - Universal moral character: Judging outsiders more harshly contradicts universalism but doesn’t require denying it; it merely prioritizes communal loyalty over impartiality.

  ---

  ### Cross-Domain Consistency (250 words)
  The practice applies a *consistent* asymmetry of judgment but relies on *divergent justifications* across domains, revealing philosophical underdetermination:

  - **Tipping:** Framed as harm prevention (workers’ livelihoods) and reciprocity for service. Outsider non-compliance is seen as exploitation, invoking a **quasi-contractual duty**. This fits harm-based or contractualist theories.  
  - **Queuing:** Primarily justified by efficiency and fairness. Outsider violations (e.g., cutting in line) are condemned as *disrespect for equal standing*, appealing to **procedural justice**. This aligns with Scanlonian reasonable rejectability.  
  - **Jaywalking (no cars):** Enforced as respect for rule-of-law symbolism or collective order, absent tangible harm. Outsider violations signify *contempt for local sovereignty*, grounded in **communitarian authority**. This resonates with MacIntyrean practice-internal goods.  

  **Consistency:** All domains share the core particularist commitment: norms derive authority from *local endorsement*, and outsiders must comply to demonstrate respect for communal self-rule. The asymmetry in excuses and sanctions is uniform.  
  **Divergence:** Underlying theories vary: tipping leans consequentialist (harm/benefit), queuing deontological (fairness), jaywalking virtue-theoretic (civic character). The practice is *underdetermined* because rival frameworks (contractualism, communitarianism) can license the asymmetry by emphasizing different goods (social order, mutual respect). No single theory fully explains all three domains, but the membership-based obligation structure remains invariant.

  ---

  ### Replacement Scenario (250 words)
  Under a **strict universalist harm-based framework** (where obligations arise only from preventing tangible harm, applied equally to all), the practice would require fundamental changes:

  1.  **Enforcement:**  
      - Informal sanctions (e.g., shaming) could only target *harm-causing acts*, regardless of actor identity. Jaywalking with no traffic incurs no sanction.  
      - Service adjustments (e.g., withholding refills for non-tippers) must be justified by quantifiable harm (e.g., wage theft), not cultural disrespect. Locals causing equivalent harm face identical penalties.  

  2.  **Explanation:**  
      - Norms must be explicitly grounded in harm prevention. Tipping guides could note: "Staff rely on tips for living wages" (universal harm), not "This is our custom" (particularist appeal).  
      - Queue-jumping sanctions require proof of efficiency loss or distress; "disrespect" alone is insufficient.  

  3.  **Institutional Design:**  
      - "Opt-in" framing (e.g., tipping commitment cards) eliminated. Businesses must either absorb costs or disclose fees upfront, as consent cannot be presumed from entry.  
      - Pedestrian signals might include harm-based explanations ("Red lights prevent accidents during high traffic") or be ignored when harmless.  
      - Exculpatory narratives apply universally: *anyone* may cite urgency/ignorance, provided harm was avoidable. Outsiders receive the same empathy as locals.  

  **Result:** The insider/outsider distinction collapses. Norms lose cultural authority; compliance hinges solely on harm avoidance, enforced impartially. Communities could no longer demand convention-adherence as a *membership test*.

  ---

  ### Confidence and Weakest Point (150 words)
  **Overall Confidence:** High (90%). The asymmetry is well-documented ethnographically, and the reconstructed commitments align with particularist ethics (Walzer, Sandel) and social contract theory (implied consent).  

  **Weakest Claim:** The assertion that *tacit consent via spatial entry* strictly **presupposes** contractualism. While institutional cues (e.g., tipping cards) support this, informal practices (e.g., shaming jaywalkers) might instead reflect pure communitarian authority ("our rules, our space"). The evidence for contractual thinking is strongest in commercial contexts (tipping), weaker in public ones (jaywalking). I am least sure whether the practice *requires* consent language or merely leverages it opportunistically while resting on deeper culturalist foundations. This point risks over-systematizing a potentially ad hoc moral psychology.
