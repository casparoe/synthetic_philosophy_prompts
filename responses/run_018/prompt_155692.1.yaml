prompt: |-
  Your an expert on metaphysics and museum policy. Before you answer, do a quick brainstorm: jot down at least three rival accounts of what makes a material object stay the same thing over time—like form-matter, four-dimensionalism, or social-constitution stuff. Then think carefully.

  There's this niche conservation rule some museums use for "ephemeral sculptures" made of biodegradable material—wax, chocolate, whatever. The contract says display the original till it decays, then cast a replacement from the original mold, keeping thier same catalog entry and title. But the mold gets destroyed after the third replacement, so eventually there's zero physical continuity with the first piece except the paperwork. What theory of material constitution does that practice presuppose? Does it need the artwork to be a persisting form, a discontinuous four-dimensional object, or just an institutionally tracked entity? Reconstruct the implicit view, say whether the practice is locked into one theory or compatible with several, and tell me what a museum that believed in strict material continuity—same clay, same statue—would have to do differently. No bibliography needed, just the reasoning.
reasoning: |-
  Okay, the user is asking about a museum practice regarding ephemeral sculptures and the underlying theories of material constitution. Let me start by recalling the rival accounts of persistence. Form-matter theory says an object persists if it maintains the same form despite material changes. Four-dimensionalism views objects as spatiotemporal worms, where different temporal parts exist at different times. Social-constitution theory emphasizes that identity is socially constructed through institutional practices.

  The user describes a scenario where museums replace biodegradable sculptures using the original mold until it's destroyed. The catalog entry remains the same even with no physical continuity. I need to determine which theory this practice presupposes. The key points are the lack of physical material over time and reliance on institutional tracking via paperwork. 

  First, form-matter theory might not fit because after the mold is gone, the form can't be replicated exactly. The practice allows replacements even without the original mold after the third cast, so form isn't strictly maintained. Four-dimensionalism could work if each replacement is a temporal part of the same artwork. But the user mentions discontinuous parts, which fits perdurantism. However, the museum's practice doesn't necessarily commit to a metaphysical view but relies on institutional continuity.

  Social-constitution seems the strongest fit. The artwork's identity is tied to the catalog entry and institutional recognition, not physical matter. The continuous institutional identity through paperwork defines the artwork's persistence. The practice is compatible with multiple theories but leans heavily on social-constitution. 

  A museum insisting on strict material continuity would reject replacements entirely. They'd preserve the original material at all costs, maybe using climate control or display copies. If decay happens, they might retire the artwork rather than replace it. This contrasts sharply with the current practice. 

  I should also consider if the user has deeper needs. They might be interested in how institutions influence art perception or the philosophy of identity over time. Perhaps they're critiquing the authenticity of artworks in museums or exploring how practices reflect philosophical theories. Addressing these underlying interests could add depth to the response.
answer: |-
  Here's the reconstruction of the implicit theory and the analysis, following your instructions:

  **Rival Accounts of Persistence (Brainstorm):**
  1.  **Form-Matter (Hylomorphism):** An object persists as the same thing if it retains the same substantial *form* (its essential structure or organizing principle), even if its *matter* (the physical stuff) changes gradually (e.g., Ship of Theseus with replaced planks).
  2.  **Four-Dimensionalism (Perdurantism):** An object is a "spacetime worm." It persists by having different temporal *parts* at different times. The whole object is the sum of these parts (e.g., the statue is its Monday-part, Tuesday-part, etc.).
  3.  **Social Constitution:** An object's persistence is fundamentally tied to social practices, conventions, intentions, and institutional recognition. What makes it the "same thing" is a collective agreement or framework (e.g., a dollar bill is the same entity despite wear/tear because of its institutional role).

  **Analysis of the Museum Practice:**

  1.  **Implicit Theory of Constitution:** The practice **most strongly presupposes the Social Constitution theory**.
      *   **Why:** The artwork's identity is explicitly tied to the *institutional framework* – the catalog entry, title, and the contractual rules governing replacement. Physical continuity (matter) is explicitly expendable after the third generation. Formal continuity (the shape from the mold) is also expendable once the mold is gone. What remains constant and essential is the *institutional identity* tracked by the paperwork and the museum's continued recognition of the replacements *as* the original artwork under the same catalog number.

  2.  **Compatibility with Other Theories:**
      *   **Compatible (Loosely) with Four-Dimensionalism:** The practice *could* be interpreted as creating a discontinuous four-dimensional object. The original decaying piece is the first temporal part, each replacement is a subsequent temporal part, and the institutional act of casting from the mold (and later, presumably, fabricating based on documentation) "links" these parts into a single spacetime worm. The museum treats the series *as* a single persisting entity.
      *   **Incompatible with Strict Form-Matter:** A strict hylomorphist would argue that once the *original* substantial form (inherent in the first instance of matter) is lost through decay, and especially once the *means to perfectly replicate the form* (the original mold) is destroyed, the subsequent objects are distinct entities. They share the same *type* of form (the design), but not the *numerically identical* substantial form of the original artwork instance.
      *   **Marginally Compatible with Process-Based Form:** A *very* weak compatibility might exist if "form" is interpreted as the artistic concept or design *as maintained and enacted by the institution*. However, this stretches traditional hylomorphism towards social constitution.

  3.  **Practice Locked In?** The practice is **not strictly locked into only Social Constitution**, but it is **most naturally explained and justified by it**. It *can be described* using Four-Dimensionalism, but that description feels like fitting the practice to the theory rather than the theory motivating the practice. It is fundamentally **incompatible with a theory requiring strict material continuity** and **highly problematic for standard Form-Matter theories** that tie form to a specific material instance.

  4.  **What a "Strict Material Continuity" Museum Would Do Differently:** A museum adhering to a theory requiring the **persistence of the same physical matter** (the same clay, wax, chocolate molecules) would:
      *   **Reject Replacement Outright:** They would *never* allow a replacement cast from a mold to be called the "original" artwork once the original matter decays.
      *   **Prioritize Extreme Preservation:** They would invest massively in environmental controls (temperature, humidity, light, air quality) to *prevent decay indefinitely*.
      *   **Accept Mortality or Display Fragments:** If decay became inevitable despite efforts, they would either:
          *   Retire the artwork permanently when it became too degraded, treating it as "dead."
          *   Display the decaying remnants *as* the degraded original artifact, distinct from any replica.
      *   **Use Display Copies (Clearly Marked):** They might create replicas for display *to protect the original matter*, but these would be explicitly labeled as copies or surrogates, retaining a separate catalog entry and status from the decaying original stored/preserved elsewhere.
      *   **Value Decay as Part of the Work:** They might view the process of decay with the original material as an *integral part* of the artwork's intended lifespan and meaning, not something to be circumvented by replacement.

  **Conclusion:** The ephemeral sculpture replacement policy relies fundamentally on the artwork being an institutionally defined and tracked entity (Social Constitution). While it can be awkwardly mapped onto a Four-Dimensionalist view, it actively rejects the core requirements of Material Continuity theories and poses significant challenges to standard Form-Matter theories. A museum valuing strict material continuity would prioritize preserving the original physical substance above all else, accepting its eventual loss as the end of the artwork's existence as that specific object.
