prompt: |-
  So I've been reading some pop-philosphy stuff about Thomas Kuhn and his idea of paradigm shifts, especially this thing called incommensurability where people in different scientific eras supposedly can't even understand each other's theories because the words mean totally different things. I got into a long argument with my friend about whether Einstein and Newton were actually talking about the same 'gravity' or if Einstein just invented a new concept and called it the same name. We kept going back and forth and then I realized this same argument has been happening in philosphy of science for decades—people saying it's a language problem, others saying it's just that science gets better, others saying the old scientists were just wrong about the world.

  My own half-baked theory is that everyone is missing the real split: it's not about language or about being right or wrong, but about what an explanation is allowed to do to the phenomona it's explaining. Like, can a new theory say 'those old obseravtions weren't really about gravity at all' and still count as explaining gravity, or does it have to preserve every old observation and show how they still fit? I think that's what's actually dividing people, but I don't know if that's a real disagreement or just us using different words for the same intuition.

  Can you help me figure out what kind of disagreement this actually is? Are the sides answering different questions under the same name? Is there a hidden empirical claim about how scientists actually behaved, or is it purely about the rules of explanation? And if it's the latter, is there any kind of argument or case study that could actually break the stalemate, or are we stuck because people just have different gut feelings about what science owes to the past? I don't need a survey of every interpretation—just a diagnosis of why this hasn't moved, and whether my 'explanation-targets' idea captures anything real or if I'm just adding noise.
