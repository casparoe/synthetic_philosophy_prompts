  *Scratches head*... Their intuitions all orbit around two poles: epistemic responsibility and functional fit. The physician fails because her evidence doesn't match the stakes; the historian succeeds because her process was institutionally sound; the lawyer's utterance isn't even an "assertion" in the epistemic sense—it's a move in a game. 

  *Lightbulb moment*: What if we stop asking "What must S know/believe?" and start asking "Does this speech act fulfill its function in this context?" The AI case crystallizes it: the system doesn't "assert" like a human, but its output is governed by reliability standards calibrated to medical decision-making. 

