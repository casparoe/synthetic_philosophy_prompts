  - Historian: Passes—textbooks rely on vetted sources. 
  - Lawyer: Exempt—adversarial arguments aren't truth-claims. 
  - Engineer: Passes—counterfactuals need justification, not belief. 
  - Friend: Fails—deception violates conversational purpose. 
  - Mathematician: Passes—conjectures invite collaboration. 

  *Winces*: The one cost is reclassifying the lawyer's statement as non-assertive. But that feels right—swearing falsely in court would still violate the norm, while legal strategy operates differently. 

  *Sighs*: The user might resist collapsing "proper assertion" into "contextually functional representation." But if we take assertion’s core purpose to be information-sharing, every case fits: the physician corrupts it; the AI fulfills it via design. 

  *Final polish*: The principle must be crisp: **An utterance counts as a proper assertion iff it represents its content as true in a manner functionally appropriate to its context.** Now, does that handle the AI? Yes—the system's output functions as a probabilistic truth-claim calibrated for clinical contexts. No "belief" needed, just reliability. 

  *Nods*: Simpler than multiplying norms, and the sacrificed verdict (lawyer as improper assertion) was always the odd one out. Time to write.
answer: |-
  Your intuitions reveal a sophisticated grasp of assertion's context-sensitivity. I propose a **unified functional-normative principle** that accommodates all six verdicts without multiplying domain-specific norms:

  ### Principle of Contextual Representational Fitness (CRF)
  **An assertion is proper iff it represents its content as true in a manner functionally appropriate to its context, such that:**
  1. **The speaker's epistemic/justificatory stance matches the context's truth-aptness requirements**; and  
  2. **The utterance fulfills its constitutive function within the speech-act framework in which it operates.**

  This principle preserves your verdicts by distinguishing between *assertion's core function* (representing a truth claim) and *contextual standards* for discharging that function:

  | **Your Case** | **CRF Analysis** | **Your Verdict Preserved?** |
  |---------------|------------------|-----------------------------|
  | **Physician** | Mismatched stance: Clinical hope ≠ medical evidence required for high-stakes health claims. Function (informing treatment) corrupted. | ✓ Improper |
  | **Historian** | Stance matches textbook context: Reliance on vetted sources satisfies institutional truth-aptness. Function (disseminating scholarly consensus) fulfilled. | ✓ Permissible |
  | **Defense Attorney** | Not an assertion under CRF: Operates in non-truth-apt framework (adversarial advocacy). Function is persuasion, not truth-representation. | △ *Reclassified* (Not improper *as assertion*) |
  | **Engineer** | Stance matches context: Counterfactuals require justification, not belief/knowledge. Function (design improvement) served by simulations. | ✓ Acceptable |
  | **Friend (lying)** | Epistemic stance fraudulent (knows falsity). Corrupts assertion's core function of truth-representation, regardless of benign intent. | ✓ Improper |
  | **Mathematician** | Stance matches disciplinary norms: Conjectures represent plausibility, not knowledge. Function (opening inquiry) fulfilled. | ✓ Legitimate |

  The **one sacrificed verdict** is your treatment of the defense attorney's statement. CRF holds that adversarial claims like these *suspend assertion's truth-representation function entirely*—they are *strategic performances*, not genuine assertions. This avoids needing a "role-legitimacy" norm for assertions.

  ---

  ### Application to New Case: Automated Diagnostic System  
  **Output:** "This scan indicates malignancy" (99% accurate, no belief/understanding).  

  1. **Functional analysis**: The system is *designed* to represent probabilistic medical truths. Its utterances function identically to radiologists' assertions in clinical contexts.  
  2. **Contextual fit**:  
     - *Truth-aptness requirement*: Medical diagnostics demand reliability, not conscious belief. 99% accuracy exceeds human radiologist benchmarks.  
     - *Constitutive function*: To inform treatment decisions. This is fulfilled if the system is properly calibrated.  

  **CRF Verdict**: This is a **proper assertion** governed by a **reliability norm** specific to automated systems in epistemic contexts. The norm requires:  
  - Outputs to be statistically warranted given system design and training data  
  - Confidence levels to be transparently calibrated  
  - No "belief" is necessary—functional reliability substitutes for epistemic stance.  

  ---

  ### Why CRF Unifies Without Proliferation  
  - **Knowledge/Belief/Truth** are subsumed under *contextual truth-aptness*: What counts as "evidence" for a historian (secondary sources) differs from a physician (clinical trials), but both satisfy their context's representational standards.  
  - **Structural variations** (counterfactuals, conjectures) are covered by *functional fit*: Assertions are "tools" for specific tasks (planning, inquiry), not monolithic.  
  - **Severity gradations** (e.g., lie vs. white lie) arise from *functional harm*: Misrepresentation in a sworn affidavit corrupts legal truth-tracking more severely than social deception.  

  CRF explains why the defense attorney case felt different: It wasn't an assertion at all. For the others, a single principle—*contextually appropriate truth-representation*—applies without ad hoc norms.
