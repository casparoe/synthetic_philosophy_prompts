answer: |-
  ### **The Restoration Clinic: Workshop Design**  
  *(75 minutes, casual, experiential, no upfront lectures)*  

  ---

  #### **Roles & Setup**  
  - **Patients (4)**: Experience "blindness," then "restored sight."  
  - **Controls (2)**: Only do the visual task (no prior touch training).  
  - **Betters/Observers (2)**: Bet on outcomes, assist with sensory substitution.  

  **Materials Needed**:  
  - **Tactile Shapes**: 3D-printed cube, sphere, pyramid, cylinder (all same matte texture, ~8cm size).  
  - **Black Box**: Large cardboard box with armholes + thick curtain (light-proof). Inside: Shapes, gloves, sensory tools.  
  - **Gloves**: Thick gardening gloves (prevents tactile detail, e.g., "feel edges, not texture").  
  - **Sensory Substitution Kit**: Smartphone app (e.g., *Phyphox* tone generator) + ruler taped to phone. When ruler touches an edge, helper adjusts pitch:  
    - *Sharp edge* = high pitch (1500 Hz), *Curve* = low pitch (200 Hz), *Flat surface* = mid-tone (500 Hz). *(Keep it janky!)*  
  - **Visual Test Images**: 7 images on a laptop/screen:  
    - **4 Target Shapes** (shot ambiguously):  
      - Cube: Angled corner view (hides symmetry), metallic texture.  
      - Sphere: Lit from behind (looks flat), bumpy texture.  
      - Pyramid: Top-down view (resembles square), translucent material.  
      - Cylinder: Extreme close-up (no ends visible), striped pattern.  
    - **3 Distractors**: Cone, tetrahedron, disc (visually similar to targets).  
  - **Betting Tokens**: Poker chips or paper slips (20 tokens total; 10 per Bettor).  

  ---

  #### **Game Flow**  
  **0–10 min: Blind Phase (Patients only)**  
  - Patients enter the black box (or blindfolded if no box).  
    - **Group A (2 patients)**: Feel shapes *with gloves only*. Invent names (e.g., "Sharpy" for pyramid).  
    - **Group B (2 patients)**: Feel shapes *with gloves + sensory substitution*. One **Better** assists per Group B patient: Moves phone/ruler along shapes they touch, alters pitch based on edges/curves. *No visual hints.*  
  - *Rules*: No peeking. Names must be unique (write them down secretly).  

  **10–15 min: "The Cure"**  
  - Patients exit box. Remove gloves/blindfolds.  
  - Controls enter the room.  

  **15–35 min: Visual Test (All Patients & Controls)**  
  - Show all 7 images on screen.  
  - **Task**: Match each *self-invented name* to one image.  
    - E.g., If a patient named the sphere "Smooth Rock," they must pick which image is "Smooth Rock."  
  - **Order**:  
    1. Patients (Group A then B) go first.  
    2. Controls go next—they see the *same images* and are given a **random patient’s name list** (e.g., "Match ‘Spiky’ to an image").  
  - **Scoring**: 1 point per correct match (max 4). Distractors add noise—force guesses!  

  **35–45 min: Betting & Scoring**  
  - **Betters** wager tokens *before* scores are revealed:  
    - Bet 1: "Patients (combined) will outscore Controls (combined)?"  
    - Bet 2: "Group B (sensory sub) will outscore Group A (touch-only)?"  
  - **Payoff**: 2:1 odds. Win = double tokens. Lose = tokens confiscated. Loser buys snacks.  

  **45–75 min: Debrief & Discussion**  
  *(Start with participant reactions, then pivot to philosophy.)*  

  ---

  #### **Predictable Hiccups (Embrace Them!)**  
  - **Glove Peeking**: Tape gloves to sleeves. If it happens, joke: "Congrats, you’ve discovered neuroplasticity!"  
  - **Images Too Obvious**: Use extreme angles/textures. Test pre-workshop with a friend.  
  - **Sensory Audio Too Clear**: Make tones deliberately messy (e.g., helper "mishears" edges). *Chaos is the point!*  
  - **Controls Outperform Patients?**: Likely! Controls guess randomly; patients overthink angles.  

  ---

  #### **Debrief Guide: Mapping the Chaos to Molyneux**  
  **1. Share Scores** (5 min):  
  - Compare patient vs. control averages. Did Group B (sensory) beat Group A?  
  - **Likely Result**: Patients struggle (<50% accuracy). Controls score ~25% (random chance). Group B may do slightly better (audio bridges senses).  

  **2. Participant Reactions** (10 min):  
  - Ask:  
    - *Patients*: "Did sight match touch? What tricked you?"  
    - *Controls*: "How did you assign names without touch?"  
    - *Betters*: "Why did you bet the way you did?"  

  **3. Philosophy Tie-In** (15 min):  
  - **Empiricism (Locke)**: "You failed because senses are *separate*. We *learn* to link touch/sight via experience (e.g., months of seeing your hands). This game lacked that!"  
  - **Rationalism (Leibniz)**: "If our minds were pre-wired, Group B’s audio map should’ve helped more! Yet even with ‘cross-training,’ 10 minutes wasn’t enough."  
  - **Betting Mistakes**: Overconfidence in patients? That’s "intuition error"—we *assume* senses merge seamlessly. Reality: brains need time to rewire.  

  **4. Honest Limitations** (5 min):  
  - "This *isn’t* real blindness:  
    - You had prior sight memory (unlike congenital blindness).  
    - Neural plasticity takes months—not 10 minutes in a box.  
    - Real sensory subs (e.g., vOICe) require 100+ hours of training!"  

  ---

  #### **Why It Works**  
  - **No Lectures**: The game *is* the argument. Molyneux’s problem emerges from failure.  
  - **Sensory Twist**: Audio substitution forces debate—does "mapping" help or confuse?  
  - **Casual Vibe**: Betting = low stakes, high engagement. Snack penalty = fun motivation.  

  **Pro Tip**: End by asking, "If your partner’s sight returns—what would you *want* this game to predict?" (Spoiler: Science says touch-to-sight transfer is poor without rehab. Hope ≠ reality... but rehab works!)
