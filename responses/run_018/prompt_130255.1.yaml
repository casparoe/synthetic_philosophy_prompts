  We are designing a workshop game called "The Restoration Clinic" for a philosophy reading group. The goal is to explore Molyneux's problem through a hands-on (literally) experience. The setup involves 8 participants divided into three roles: 4 patients, 2 controls, and 2 betters/observers.

