answer: |-
  Your dilemma cuts to the bone of Buddhist ethics. Here’s the committed stand: **Buddhist karma is indeed a distributed, impersonal accounting system that enables consequentialist aggregation *because* of anattā, not despite it.** Upāya operates *within* this framework but transcends crude calculation. The apparent tension dissolves when you reject the need for a "bearer" and embrace the radical fluidity of causality itself.

  **Why Aggregation Survives Without a Self:**

  1.  **The Currency Isn't Suffering, It's Causation:** Karma isn't tallying "units of suffering/pleasure for subject X." It tracks *patterns of intentional action (cetana)* and their *propensity to condition future experience*. An unskillful act plants a seed (a specific causal potential) within the ever-evolving process of dependent origination (paṭiccasamuppāda). That seed ripens (vipāka) as suffering *when conditions support it*, manifesting within whatever momentary constellation of aggregates (skandhas) is present then. The "account" is attached to the causal stream, not an owner.
  2.  **Distributed Inheritance:** Imagine a river. No single water molecule is "the river," yet pollution upstream affects water downstream. Rebirth is the continuation of a causal stream. The aggregates of the new "life" are not *identical* to the old, but they are *causally contiguous*. The karmic seeds (pollution) carried by the old stream directly condition the arising and quality of the new stream's experience. The suffering arises *within* the new stream because of the old stream's actions. Aggregation happens *along the timeline of the causal continuum*.
  3.  **The "Unit" is the Causal Process:** You don't need a fixed "unit" like a soul to sum consequences. The process *is* the unit. Unskillful actions distort the entire causal flow, increasing the *probability and intensity* of dukkha (suffering/stress) arising within that flow, lifetime after lifetime, until the karma is exhausted or purified. Skillful actions smooth the flow, fostering conditions for ease and clarity. The "sum" is the *character* of the ongoing process – turbulent and painful vs. serene and conducive to awakening.
  4.  **Consequentialism, Rebooted:** This *is* consequentialist. Actions are judged solely by their fruits (phala/vipāka) – the quality of experience and further conditioning they produce within the causal continuum. The "greatest good" (reduction of dukkha) is assessed impersonally across the unfolding of the process. Good karma reduces net suffering *within the stream*; bad karma increases it. The absence of a self doesn't negate the reality of cause and effect operating on conscious experience over vast time.

  **Upāya: Skill Within the Flow (Not Outside Calculation):**

  Upāya isn't an escape from karmic causality or a rejection of consequences. It's the *highest application* of wisdom within this impersonal system:

  1.  **Contextual Intelligence, Not Calculus:** Upāya recognizes that the ripening of karma and the needs of beings are infinitely complex. A simple "maximize pleasure/minimize pain" algorithm is impossible and misses the point. True skillfulness arises from profound insight (prajñā) into emptiness (śūnyatā) and dependent origination. It sees the *specific* knots of suffering and the *specific* conditions needed to loosen them *here and now*, within the boundless web of causes.
  2.  **Compassion as the Driver:** The motivation isn't personal gain (even karmic merit), but boundless compassion (karuṇā) to alleviate suffering *wherever it manifests* within the causal matrix. An act motivated by pure compassion, even if it appears conventionally unskillful (e.g., a Bodhisattva breaking a precept to save lives), is ultimately kusala because its root intention aligns with the ultimate reduction of dukkha by fostering wisdom and liberation *in that specific context*. Its "fruit" includes the liberation of others.
  3.  **Dissolving the Aggregator, Not the Aggregation:** The master of upāya acts *from* the realization of anattā. They see no fixed self in themselves or others, only suffering patterns to be addressed. They don't *calculate* net utility for a non-existent self; they *respond* with perfect, spontaneous appropriateness to the needs of the present moment within the causal flow, knowing their action will have consequences woven into that flow. It's non-calculative because calculation implies a static model and a separate calculator – both illusions. Action flows from wisdom-compassion inseparably.

  **The Narrative Engine:**

  For your novel, embrace the **distributed ledger**. Characters inherit not memories or identity, but *karmic momentum* – tendencies, latent potentials, unresolved distortions – like eddies and currents in a river passed from one stretch to the next. Moral agency lies in the capacity to *intentionally alter that momentum* in the present moment. Consequences manifest as the *character of reality* the character encounters: inexplicable afflictions, uncanny opportunities, the weight of atmosphere, the ease of grace – all impersonal fruits of prior acts within the stream. Upāya is the rare character who acts not from personal desire or fear of karmic payback, but from a profound, selfless attunement to the needs of the unfolding web, altering the flow itself with surgical, compassionate precision. The tension isn't logic; it's the raw human experience of being held responsible by an uncaring universe for deeds you don't remember committing, yet whose weight shapes your very world. That's the power of impersonal aggregation.
