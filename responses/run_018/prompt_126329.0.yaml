answer: |-
  Right, let's unpick this clockmaker conundrum. She's got *procedural fluency* in spades: that pure, embodied knack for feeling the escapement through her fingers, sensing tensions and alignments without needing to think "gear A meshes with gear B at ratio X". It's in her hands, not her head as facts. That bit's classic knowing-*how*.

  The twist is when you swap brass for aluminium. Suddenly, the material's lighter, springier, maybe slippier. She adjusts her grip *instantly*, intuitively applying more or less pressure, changing her touch – *without* being able to say *why* or cite material science principles. This is **counterfactual robustness**: her skill isn't brittle; it adapts fluently to a materially novel situation she hasn't explicitly trained for, *without* conscious deduction or rule-following.

  So, does she have both? Almost certainly **yes**.

  1.  **Procedural Fluency:** Undeniably. The core skill of restoration by touch.
  2.  **Counterfactual Robustness:** Evidenced by the immediate, unreflective adaptation. Her embodied knowledge incorporates a *sensitivity* to material feedback (weight, friction, flex) that's baked into the skill itself. It's not *separate* knowledge-that; it's her *knowing-how* being inherently responsive to the physical world's affordances and resistances. Her fingers "understand" the aluminium's behaviour through felt interaction, not theoretical deduction.

  **Where the Distinction Holds (and Intellectualism Stumbles):**

  *   **Core Distinction:** **Embodied Skill vs. Adaptive Generativity.** Procedural fluency is the ingrained capacity to perform a specific task well. Counterfactual robustness shows that this capacity isn't just a fixed routine; it possesses a *generative* quality, allowing intelligent adaptation *within the domain* of the skill when novel physical parameters arise, precisely *because* it's grounded in sensory-motor feedback loops, not abstract propositions.
  *   **Intellectualist Handling:** The intellectualist (claiming knowing-how *is* knowing-that applied practically) would likely argue: *"Ah, but she *does* have unconscious propositional knowledge! Hidden rules about torque, friction coefficients, or material properties are guiding her adjustment. She just can't articulate them."*
      *   **The Problem:** This feels like a *post hoc* rationalisation, grafting theory onto practice. There's no evidence she *ever* learned such propositions, consciously or not. Her adaptation is *immediate* and *unreflective* – it bypasses reasoning entirely. It looks far more like her hands and proprioceptive system are dynamically coupled with the materials, adjusting based on real-time feedback (e.g., "this feels too light/slippery, need more purchase"), not retrieving and applying stored facts. The adaptation emerges from the *interaction*, not from a hidden databank of 'that'-knowledge.

  **Verdict:** The distinction holds up robustly – procedural fluency provides the foundation, counterfactual robustness demonstrates its embedded, world-responsive intelligence.

  **Leftover Puzzle:** How exactly does deeply embodied, sensorimotor knowing-*how* encode and generate such *specific* adaptive responses (like precise grip adjustment for aluminium) without any representational 'knowing-*that*' content mediating it? What's the mechanism for that non-propositional, yet highly context-sensitive, intelligence?

