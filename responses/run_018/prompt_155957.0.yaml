prompt: |-
  Hey — I'm putting together prompts for a grad seminar on political philosophy and I want one that digs into the weeds a bit, not just the usual textbook summary. Could you construct a thought experiment for me? I need a realistic, present-day-style scenario (no trolleys, no perfect predictors, no sci-fi) set in a single coastal province, max one paragraph, where starvation reaches famine levels even though aggregate food availability per capita is stable or ticks up slightly. The key is that the collapse has to come from an entitlement failure driven by a sepcific institutional choice — say, "priority export bonds" that legally lock grain in port warehouses combined with a sudden labor-market devaluation tied to a debt restructuring deal — rather than from drought, blight, or any natural shock. That way Sen's entitlement framework (the kind of thing he applies to Bengal, the Irish famine, and the Great Leap Forward) classifies it as a political crime, while a pure food-availability-decline account either denies there's a famine at all or misattributes it to natural causes.

  After the scenario, walk through what each framework actually says and why, then isolate the exact feature doing the philosophical work. Tell me what happens if we strip that feature away — e.g., if per-capita food availability genuinely plummets — and how a defender of the natural-disaster framing would attack the case (probably by arguing the policy was just a response to hidden scarcity). Make it suitable for students who get the basic entitlement idea but havent memorized every case study. Dont ask for bibliographies or citations; I want something a model could tackle cold. Please keep it casual, like youre explaining over coffee, and end with the isolating feature in this exact format:

  \answer{entitlement collapse despite rising per-capita availability driven by a politically chosen institutional lock}
reasoning: |-
  We are in the coastal province of Solara. The provincial government, facing pressure from international creditors, issues "priority export bonds" that mandate all grain in bonded warehouses must be shipped abroad to service sovereign debt. Simultaneously, a debt restructuring deal triggers massive public sector layoffs and a currency devaluation that halves the real wages of urban workers overnight. Despite stable per-capita grain production (and even a slight uptick in overall food availability due to a good fish catch), urban food markets collapse: laid-off workers can't afford grain, farmers can't access urban consumers because the grain is locked in export warehouses, and the government refuses to release the grain domestically because it would breach the bond terms. Starvation spreads in the cities while bonded silos overflow.

  Now, let's unpack the frameworks:

  - **Entitlement Approach (à la Sen)**: This is a classic entitlement failure. People starve not because food isn't available, but because their economic means to access it (jobs, wages, trade rights) have been destroyed by policy. The institutional choice (export bonds + austerity) actively severed the legal-economic pathways (entitlements) that let people convert labor/cash into food. It's a political crime: the famine is manufactured by deliberate policy sequencing.

  - **Food Availability Decline (FAD)**: A pure FAD account either (a) denies this is a famine (since aggregate food per capita hasn't fallen), or (b) misattributes it to "hidden scarcity" – e.g., arguing the export bond was a rational response to real (but unmeasured) shortages caused by the debt crisis. It might blame "natural" economic forces (like currency collapse) rather than the politically chosen lock on warehouses.

  **The Isolating Feature**: What makes this a clean case is that per-capita food availability is *stable or rising* while starvation spreads. If we strip that away – say, if a drought *also* cut grain output by 30% – the FAD defender jumps: "See? Natural scarcity caused both the policy *and* the famine!" That muddying is why Sen insists on cases where availability *isn't* falling. Here, the policy lock alone is the kill switch.

  \answer{entitlement collapse despite rising per-capita availability driven by a politically chosen institutional lock}
answer: |-
  Here's a thought experiment tailored for your seminar:

  **Scenario:** In the coastal province of Maris, the government faces a foreign debt crisis. To secure emergency loans, it agrees to two policies: (1) "Priority Export Bonds" that legally require all grain in port warehouses to be reserved for international buyers (to generate hard currency), and (2) a 40% public-sector wage cut to meet creditor demands. Grain production is normal, fish catches are up, and per-capita food availability actually increases 3%. But the wage cuts leave half the urban workforce unable to afford rice, while the export bonds block farmers from selling grain domestically—even as ships sit loaded in harbors. Starvation erupts in cities within weeks.  

  ### Framework Breakdown:  
  - **Entitlement Framework (Sen)**: This is a *political* famine. Starvation occurs because specific policies **destroyed entitlements**—the wage cuts devalued labor (eroding workers' ability to *command* food via income), and the export bonds severed farmers' *access* to local markets. Food exists, but institutional choices redistributed entitlements toward foreign creditors. Like Bengal ’43, it’s a collapse in *means to acquire food*, not supply.  
  - **Food Availability Decline (FAD) Framework**: FAD either denies this is a "real" famine (since aggregate food rose) or blames hidden scarcity. A defender here might argue: "The bonds were *necessary* because Maris was secretly low on foreign reserves—without exports, grain imports would’ve collapsed later!" This reframes policy as a *response* to scarcity, not its cause.  

  ### The Philosophical Keystone:  
  The core feature making this an entitlement case is **stable/rising per-capita food amid institutional collapse**. If we strip this away—say, a drought *also* cut grain by 30%—FAD defenders win. They’d argue scarcity "forced" the policies, blurring cause/effect. But here, with no natural shock, the famine *only* emerges from politically chosen entitlements.  

  \answer{entitlement collapse despite rising per-capita availability driven by a politically chosen institutional lock}  

  This should spark debate even if students haven’t memorized Sen’s cases—it’s self-contained, real-world adjacent, and forces a clash of frameworks. Happy to tweak!
