  The user wants a menu of interpretations for the slogan: trivial bias, descriptive anthropology, strong normative relativism, and others. For each, I should check if it's in the text, if it's defensible, and if it supports the friend's conclusion that cross-cultural criticism is off-limits. Also, I need to address the European comparison point.

  Starting with the bottom line: Montaigne's actual argument is critical ethnocentrism, not relativism. He uses the Tupinamba example to expose European hypocrisy, especially their worse violence. The friend's use fails because she misses this comparative critique, which undermines her relativistic reading.

  Now, breaking down the interpretations:

  1. Trivial Bias Version: Everyone is biased towards their own culture. This is in the text, defensible, but doesn't support the friend's conclusion. It's about awareness, not prohibiting criticism.

  2. Descriptive Anthropology Version: "Barbarism" is a culturally specific term. Present in the text, defensible, but not a moral claim. Doesn't forbid criticism.

  3. Strong Normative Relativism Version: Moral judgments are only valid within their culture. Not in the text. Montaigne criticizes Europeans from a universal standpoint, using reason. Indefensible as it leads to contradictions.

  4. Critical Ethnocentrism (The Actual Argument): Montaigne reverses the gaze to show Europeans as worse. Explicitly in the text. Defensible and powerful. The comparison to religious wars is key here—it shows Europeans are more barbaric by their own standards.

  5. Implicit Universalism: Montaigne assumes shared values like condemning cruelty. He condemns European torture as worse. This is in the text and defensible. Allows cross-cultural criticism based on universal principles.

  The European wars comparison is central. Montaigne points out that Tupinamba practices are ritualized and less cruel compared to European torture during religious conflicts. This undermines relativism because he uses a universal standard to judge both.

  The friend's conclusion fails because Montaigne isn't saying we can't criticize; he's criticizing Europeans using the Tupinamba as a mirror. His approach allows for measured criticism based on consistent principles. The user needs this breakdown to show their friend that context matters and relativism isn't supported.
answer: |-
  ### Bottom Line: Montaigne’s essay supports **Critical Ethnocentrism** (exposing European hypocrisy using comparative violence), not cultural relativism, and your friend’s use fails because she ignores his core comparison of Tupinamba practices to Europe’s *worse* atrocities—a move that presupposes universal moral grounds for criticism.

  Here’s the precise breakdown of interpretations of the slogan **“We call barbarism whatever isn’t our own practice”**, assessed for textual support, defensibility, and whether it prohibits cross-cultural criticism:

  ---

  ### 1. **Trivial Bias Version**  
     - **Claim**: Humans *tend* to label unfamiliar customs “barbaric” due to instinctive prejudice.  
     - **In the text?** Yes. Montaigne opens with this observation to frame European arrogance.  
     - **Defensible?** Yes. Cognitive bias is well-documented (e.g., in-group favoritism).  
     - **Allows criticism?** **Yes.** Recognizing bias doesn’t negate criticism—it demands *self*-scrutiny first. Your friend’s conclusion fails here: Montaigne uses this to question *Europeans*, not to silence critique of others.

  ### 2. **Descriptive Anthropology Version**  
     - **Claim**: “Barbarism” is a *descriptive* term reflecting cultural context, not an objective category.  
     - **In the text?** Yes. Montaigne notes Tupinamba practices (e.g., eating war captives) serve social functions (vengeance, honoring enemies) within their cosmology.  
     - **Defensible?** Yes. Moral language is often culturally embedded (e.g., “cannibalism” vs. “funerary ritual”).  
     - **Allows criticism?** **Yes.** Describing context ≠ endorsing it. Montaigne later judges *both* Tupinamba and European violence—implying criticism is possible with deeper understanding.

  ### 3. **Strong Normative Relativism Version**  
     - **Claim**: Morality is *entirely* culture-bound, so judging another society’s practices is incoherent/illegitimate.  
     - **In the text?** **No.** Montaigne never says Tupinamba rituals are *beyond judgment*—he compares them to European wars to show they’re *less* barbaric.  
     - **Defensible?** **No.** It collapses into self-contradiction (e.g., “All truth is relative” claims absolute truth). Montaigne’s own critique of Europe assumes shared moral standards.  
     - **Allows criticism?** Purports to forbid it—but your friend’s reliance on this is unsupported. Montaigne’s essay refutes it by *practicing* cross-cultural criticism.

  ### 4. **Critical Ethnocentrism (Montaigne’s Actual Argument)**  
     - **Claim**: Europeans weaponize “barbarism” to mask their *greater* moral failures. The slogan is a setup to reverse the accusation.  
     - **In the text?** **Explicitly.** Montaigne compares Tupinamba warfare (ritualistic, limited) to Europe’s Wars of Religion (mass torture, betrayal, greed): *“I think there is more barbarity in eating a man alive than in eating him dead.”*  
     - **Defensible?** **Yes.** It exposes hypocrisy without relativism: if Europeans condemn Tupinamba, their own cruelty must be judged *more harshly* by consistent standards.  
     - **Allows criticism?** **Yes—and requires it.** Montaigne condemns Europe *using universal terms* like “atrocity,” “treachery,” and “greed.” This breaks your friend’s reading: he’s not protecting Tupinamba from critique but using them to indict Europe.

  ### 5. **Implicit Universalism**  
     - **Claim**: Beneath cultural differences, shared human values exist—and Europe violates them worse.  
     - **In the text?** **Yes.** Montaigne assumes all societies value courage, loyalty, and condemn cruelty. Tupinamba “cannibalism” is framed as *more honorable* than European torture because it avoids “betrayal” and prolonging suffering.  
     - **Defensible?** **Yes.** Contingent universals (e.g., suffering=bad) underpin most cross-cultural dialogue.  
     - **Allows criticism?** **Yes.** Montaigne judges *both* cultures by standards like proportionality and cruelty—e.g., Tupinamba rituals are “less” barbaric *because* they cause less suffering.

  ---

  ### Why Your Friend’s Reading Fails:  
  - **She ignores the comparison**: Montaigne’s parallel between Tupinamba practices and Europe’s wars isn’t incidental—it’s the essay’s pivot. By showing Europeans commit *worse* acts under their *own* moral framework, he:  
    - Assumes universal norms (e.g., torture is worse than ritual killing).  
    - Makes cross-cultural criticism *essential* (Europe is culpable by its own standards).  
  - **Relativism is self-undermining**: If *all* criticism is invalid, Montaigne couldn’t condemn Europe—but he does so fiercely. His point is that criticism must be *consistent*, not absent.  
  - **The slogan’s function**: It’s rhetorical bait. Montaigne uses it to shock Europeans into realizing *their* “civilization” is the true barbarism—not to endorse moral equivalence.

  ### Conclusion:  
  Montaigne’s essay is a **dialectical trap** for Eurocentrism, not a relativist manifesto. Your friend’s use of the slogan ignores the text’s structure: it sets up Europeans to condemn themselves. Cross-cultural criticism isn’t off-limits—it’s *demanded*, but must be applied reflexively and even-handedly. His comparison to religious wars proves that “barbarism” isn’t relativized; it’s *redefined* by outcomes (suffering, betrayal) he treats as universally condemnable.
