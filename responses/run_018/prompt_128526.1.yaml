prompt: |-
  ok so me and my friend just had this exhausting two-hour argument about montaignes cannibals essay and she kept dropping that line everyone repeats — that we call barbarism whatever isnt our own practice — like it was some automatic win for full cultural relativism. she was using it to say we cant criticize the tupinamba ritual at all, but i think montaignes doing something way more targeted and maybe even the opposite. can you act like a professional philosopher of culture who has actually worked through the essay, think carefully and step by step, and first brainstorm the different precise things that slogan could actually claim? i want them laid out as a menu: the trivial bias version, the descriptive anthropology version, the strong normative relativism version, and whatever else hides in there. for each one say whether its actually in the text, whether its defensible, and whether it gets my friend to her conclusion that cross-cultural moral criticism is always off-limits. please also deal with the niche point that montaigne explicitly compares these practices to the far worse violence europeans were inflicting on each other during the wars of religion, because she completely ignored that comparison and i think it breaks some of the readings. lead with your bottom line in the very first sentence — like which reading is actually supported and why her use fails — then give the reasoning with no preamble and dont restate my question back at me. and since i dont have access to a library right now, dont give me a reading list or citations, just work with the ideas.
