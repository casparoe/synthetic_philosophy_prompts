    "disanalogies_that_matter": "1. **Modality-Neutrality vs. Modality-Specificity**: The analogy assumes the 'save file' (cubeness) is identical across modalities, but Locke/Berkeley argue touch and sight produce distinct ideas. Tactile cubeness includes pressure points and motor feedback; visual cubeness involves light, shadow, and perspective. If modalities shape content, recognition fails—supporting Molyneux's negative answer.\n\n2. **DRM as Epistemic Barrier**: The DRM lock implies data corruption during transfer, but Locke's 'entry point' is more radical—the idea *doesn't exist* in a transferable format. Tactile cubeness isn't 'locked' visual data; it's a separate construct. Without associative experience, no recognition occurs.\n\n3. **Rewiring as Confounding Factor**: The 'wrong driver' (repurposed visual cortex) isn't just flexibility—it may erase the original 'engine.' Blindness studies show the visual cortex becomes tactile/motor-oriented, so restoring sight leaves no intact visual processor. This empirically supports Molyneux: newly sighted patients fail shape recognition.",
    
    "disanalogies_that_dont_matter": "1. **Save File as Digital Artifact**: The 'save file' metaphor implies a static, discrete data chunk, while Lockean ideas are dynamic and relational. But this doesn't undermine the core analogy—both involve stored representations.\n\n2. **Graphics Engine Passivity**: The analogy treats engines as neutral renderers, but perception is active (e.g., Kant's synthesis). This is irrelevant to Molyneux, which concerns initial recognition, not ongoing perception.\n\n3. **DRM as Technical Hurdle**: The DRM's 'corruption' suggests data degradation, while Locke's entry point is about inaccessible formats. For the debate, both imply transfer failure without experience.",
    
