  Paradoxically, accepting radically non-human successors might weaken obligation: if "shared human future" includes unconscious AI, why care if it's conscious? But that dilutes Scheffler's emphasis on interpersonal recognition. Alternatively, it could strengthen obligation if we interpret "like us" as continuity of values, not biology. Tricky.  

