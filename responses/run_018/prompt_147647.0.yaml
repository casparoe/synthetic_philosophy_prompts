  I am writing for an upper-level university course on ethics and language. Write an essay on whether there is a moral difference between lying and misleading. Standard accounts hold that lying is worse because it involves direct false assertion, violating a speaker's duty of sincerity, whereas misleading allows false beliefs to arise through the listener's own inferences. To test whether this distinction holds under pressure, inject the following institutional scenario into your analysis: a university administrator answers direct questions about an impending budget crisis by presenting technically accurate but selectively framed enrollment and expenditure figures, knowing that students and faculty will infer program stability where none exists. The administrator asserts nothing false, yet engineers the informational context so that deception is structurally inevitable and maintains plausible deniability.

