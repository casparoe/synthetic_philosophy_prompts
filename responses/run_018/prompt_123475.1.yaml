  Now, expected payoff from choosing to continue at this node:

  - If device active: he continues.
     - State 1: (A, device at A): he continues -> then he goes to B and exits at B: payoff 4.
     - State 2: (B, device at A): he continues -> payoff 0.
     - State 3: (A, device at B): device not active, so he continues -> then he goes to B and at B: note, in state 3, the device is at B (active) but he is at A. So if he continues at A, he goes to B. At B, the device is active, so it forces him to continue, so he continues at B and misses home: payoff 0.

  - If device not active: he continues.
     - State 2: (B, device at A): device not active -> so he continues -> payoff 0.
     - State 3: (A, device at B): device not active -> he continues -> then as above, he goes to B and then at B the device is active, so he continues -> 0.

  So let's break down by state:

  State 1: (A, device at A): device active, so he continues -> payoff 4.
  State 2: (B, device at A): device not active, and he chooses continue -> payoff 0.
  State 3: (A, device at B): device not active, and he chooses continue -> then he continues at A, goes to B, and at B the device is active so he continues -> payoff 0.

  So expected payoff: (1/3)*4 + (1/3)*0 + (1/3)*0 = 4/3 ≈ 1.333.

  Therefore, choosing to exit yields 3, while choosing to continue yields 4/3. So he should choose to exit. But this is exactly the plan: he is supposed to exit. So there is no conflict: the ex post optimal action is to exit.

  Therefore, in the case with the device, at the ex post node, the driver strictly prefers to exit. And that is the ex ante plan. So no conflict.

  But what about without the device? We saw that at the mixed strategy q=5/8, the driver is indifferent. So also no conflict.

  So why is there a conflict in the standard framing? The standard paradox often highlights that if the driver plans to always continue, then at a node he would prefer to exit, and if he plans to always exit, then at a node he would prefer to continue. But the ex ante optimal mixed strategy is consistent.

  However, the problem asks to explain why the ex post optimal action conflicts with the ex ante optimal plan. In the pure strategies without device, there is a conflict. But the ex ante optimal is mixed. So perhaps we should note that if the driver is restricted to pure strategies, then there is a conflict, but the mixed strategy resolves it.

  But in the modified problem with the device, the driver is using a pure strategy (intend to exit) and there is no conflict.

  Now, for part (iv): evaluate whether this conflict (which we have seen is not present in the optimal strategies) genuinely undermines dynamic consistency.

  But the problem might be expecting the standard paradox. So we should present the conflict in the pure strategies.

  In the standard problem without device:
  - Ex ante, the driver compares:
     - Always exit: payoff 1.
     - Always continue: payoff 0.
     - Mixed: up to 1.5625.
     So the optimal is mixed.

  But if the driver is required to use a pure strategy, then:
     - If he chooses to always continue, then at a node he would calculate (as above, with q=0): 
          P(A)=1/(2-0)=1/2, P(B)=1/2.
          Exit: (5-0)/2 = 2.5
          Continue: 4*0/2 = 0.
          So he would prefer to exit. But the plan was to continue. Conflict.
     - If he chooses to always exit (q=1):
          P(A)=1/(2-1)=1, P(B)=0.
          Exit: 1
          Continue: 4*1/1=4
          So he would prefer to continue. Conflict.

  So in pure strategies, there is a conflict. But the driver can avoid the conflict by using the mixed strategy.

  Similarly, in the device case, we are using a pure strategy and there is no conflict.

  The device itself was purchased to get a higher payoff. Without device: max 1.5625. With device: 2.0. So it is rational to purchase the device.

  The conflict in the pure strategies without device does highlight a dynamic inconsistency: the driver's ex ante optimal pure strategy is not consistent with ex post optimization. This might be seen as undermining dynamic consistency. However, by using a mixed strategy, the driver can achieve consistency. Alternatively, by using the commitment device, the driver can use a pure strategy and achieve a higher payoff consistently.

  Therefore, the coherence argument for dynamic consistency is not undermined because there exists a strategy (mixed without device, or pure with device) that is both ex ante optimal and ex post consistent.

  Model Answer (approx. 700 words):

  The absent-minded driver problem presents a challenge to dynamic consistency in rational choice. This modified version, with an optional commitment device, allows us to explore these tensions.

  (i) Without the commitment device, the driver must choose a strategy that is identical at both intersections. The available strategies are pure (always exit or always continue) and mixed (exit with probability p). The payoffs are:
  - Always exit: exits at A, payoff 1.
  - Always continue: misses both, payoff 0.
  - Mixed strategy: exit with probability p. The expected payoff is: p * 1 + (1-p) * [p * 4 + (1-p)*0] = p + 4p(1-p) = 5p - 4p². Maximizing with respect to p yields p=5/8, giving payoff 5*(5/8) - 4*(25/64) = 25/16 = 1.5625.

  The driver may purchase a commitment device at cost 0.5 that enforces "continue" at one randomly chosen intersection. If purchased, the driver chooses an intended action (same at both nodes). The optimal intended action is to exit (q=1). The expected payoff before cost is: with probability 1/2 (device at A), he continues at A and then exits at B (payoff 4); with probability 1/2 (device at B), he exits at A (payoff 1). Thus, expected payoff 2.5, minus cost 0.5, yields 2.0. Any mixed intention is inferior (linear in q, maximized at q=1). Comparing without device (1.5625) and with (2.0), the driver should purchase the device and intend to exit.

  (ii) For ex post reasoning, we compute the optimal action at an intersection given beliefs. Without the device, at a node, the driver forms beliefs based on the strategy in use. If the strategy is exit with probability q, then P(this node is A) = 1/(2-q), P(B) = (1-q)/(2-q). The payoff from exiting is (5-4q)/(2-q), while continuing yields 4q/(2-q). These are equal at q=5/8.

  With the device and intended exit (q=1), we consider the beliefs. The driver may be in one of three equally likely visit-states: (A, device at A), (B, device at A), or (A, device at B). The expected payoff from choosing to exit is 3.0 (as computed from the states), while continuing yields 4/3. Thus, exit is preferred.

  (iii) The conflict between ex ante and ex post optimality arises in pure strategies without the device. If the ex ante plan is always continue (q=0), ex post the driver would prefer to exit (2.5>0). If the plan is always exit (q=1), ex post the driver would prefer to continue (4>1). However, at the optimal mixed strategy (q=5/8), the driver is ex post indifferent, so there is no conflict. With the device and q=1, the ex post optimal action is exit, matching the ex ante plan.

  (iv) The apparent conflict in pure strategies without the device does not fundamentally undermine dynamic consistency. The mixed strategy without device achieves both ex ante optimality and ex post consistency (indifference). The commitment device offers an alternative: it enables a pure strategy that is both ex ante optimal (yielding the highest payoff) and ex post consistent. The device is rationally purchased because it increases expected utility. Thus, the coherence argument for dynamic consistency is preserved: agents can achieve consistency through mixed strategies or commitment devices, and the tension in pure strategies is resolved by these mechanisms.

  Marking Scheme (30 points):

  Move 1: Correct computation of the ex ante expected utilities for both with and without the device. (8 points)
  - Typical failure: Incorrectly computing mixed strategy payoff (e.g., not accounting for the sequential structure) or miscomputing the device's effect (e.g., not considering the cost or the randomization).

  Move 2: Accurate derivation of the ex post belief structure and optimal action in both cases (with and without device). (8 points)
  - Typical failure: Failing to derive the belief probabilities (e.g., P(A) and P(B)) or miscalculating the payoffs in the device case (e.g., not considering the three states).

  Move 3: Identification of the dynamic-inconsistency tension in the pure strategies and its absence in the optimal mixed strategy and device strategy. (6 points)
  - Typical failure: Only discussing the mixed strategy without noting the pure strategy conflict, or claiming conflict exists at the optimal mixed strategy.

  Move 4: Assessment of the commitment device's rationality (cost vs. benefit) and its role in achieving consistency. (4 points)
  - Typical failure: Not comparing the payoffs with and without device, or not noting that the device enables a pure strategy that is consistent.

  Move 5: Reasoned verdict on the coherence challenge, explaining why the tension does not undermine dynamic consistency. (4 points)
  - Typical failure: Concluding that dynamic consistency is fundamentally challenged without noting the resolution via mixed strategies or commitment.

  Confidence in analysis:
  - Overall confidence: High. The payoff arithmetic is standard and double-checked.
  - Least sure about: Whether the hidden-commitment variant genuinely resolves the tension or merely displaces it onto the pre-departure choice. In this case, the pre-departure choice is straightforward (cost vs. benefit), and the ex post choice is consistent. However, one might argue that the pre-departure choice itself requires commitment, but there is no absent-mindedness at the pre-departure stage. Therefore, it seems resolved.
answer: |-
  ### Exam Question
  **Rational Choice Theory Seminar: Final Exam**  
  **Time Allotment:** 75 minutes  
  **Word Limit:** 800 words  

  **Scenario:**  
  A driver travels a highway with two consecutive exits. Taking Exit A leads to a detour with a payoff of 1. Taking Exit B leads directly home with a payoff of 4. Missing both exits yields a payoff of 0. The driver is absent-minded: upon reaching any intersection, he cannot discern whether it is Exit A or Exit B, nor recall if he has already passed an exit. Consequently, his strategy must be identical at both nodes—either "exit" or "continue" at both.  

  Before departing, the driver may purchase a hidden commitment device at a cost of 0.5. If purchased, this device randomly enforces "continue" at exactly one of the two intersections (each equally likely), and the driver cannot observe where it is deployed. If he declines the device, he applies a uniform rule (the same action) at both nodes.  

  **Your Task:**  
  (i) **Compute** the *ex ante* expected utility for all available strategies, both with and without the device.  
  (ii) **Derive** the belief-dependent reasoning that applies *ex post* at an intersection (with and without the device).  
  (iii) **Explain** why the *ex post* optimal action conflicts with the *ex ante* optimal plan in the absence of the device, but not when it is used.  
  (iv) **Evaluate** whether this conflict genuinely undermines the coherence argument for dynamic consistency, or if it can be resolved via plan-dependent preferences or the commitment mechanism.  

  ---

  ### Model Answer (Approx. 700 words)  
  #### (i) *Ex Ante* Expected Utility  
  *Without the commitment device*, the driver’s strategy space includes pure strategies (always exit/always continue) and mixed strategies (exit with probability \(p\) at both nodes).  
  - **Always exit**: Payoff = 1 (exits at A, never reaches B).  
  - **Always continue**: Payoff = 0 (misses both exits).  
  - **Mixed strategy** (exit prob. \(p\)):  
    - Exit at A: Payoff = 1 (prob. \(p\)).  
    - Continue at A (prob. \(1-p\)), then at B:  
      - Exit at B: Payoff = 4 (prob. \(p\)).  
      - Continue at B: Payoff = 0 (prob. \(1-p\)).  
    Expected payoff: \(p \cdot 1 + (1-p) \cdot [p \cdot 4 + (1-p) \cdot 0] = 5p - 4p^2\).  
    Maximizing w.r.t. \(p\): \(\frac{d}{dp}(5p - 4p^2) = 5 - 8p = 0 \Rightarrow p = 5/8\).  
    Payoff = \(5 \cdot (5/8) - 4 \cdot (5/8)^2 = 25/16 = 1.5625\).  

  *With the commitment device* (cost = 0.5), the driver chooses an intended action (same at both nodes). The device overrides one random node to "continue."  
  - **Intend "exit"** (optimal):  
    - Device at A (prob. 0.5): Continue at A, then exit at B → Payoff = 4.  
    - Device at B (prob. 0.5): Exit at A → Payoff = 1.  
    Expected payoff before cost: \((0.5 \cdot 4) + (0.5 \cdot 1) = 2.5\).  
    After cost: \(2.5 - 0.5 = 2.0\).  
  - **Intend "continue"**: Payoff = 0 (always miss exits), minus cost = \(-0.5\).  
  Mixed intentions are suboptimal (linear in exit probability, max at 1).  

  *Comparison*: Without device, max payoff = 1.5625; with device, 2.0. Thus, *ex ante* optimal is to purchase the device and intend "exit."  

  #### (ii) *Ex Post* Belief-Dependent Reasoning  
  *Without device*, at any intersection, beliefs depend on the strategy’s exit probability \(p\):  
  - Probability at A: \(P(A) = 1 / (2 - p)\) (since reaching A is certain; B requires continuing at A).  
  - Probability at B: \(P(B) = (1 - p) / (2 - p)\).  
  Payoff if exit: \(P(A) \cdot 1 + P(B) \cdot 4 = (5 - 4p) / (2 - p)\).  
  Payoff if continue: \(P(A) \cdot (\text{payoff at B}) + P(B) \cdot 0 = [1 / (2 - p)] \cdot 4p = 4p / (2 - p)\) (since continuing at A leads to B, where payoff is \(4p\)).  
  At optimal \(p = 5/8\), exit and continue yield equal payoff: \((5 - 4 \cdot 5/8) / (2 - 5/8) = 20/11 \approx 1.818\).  

  *With device and intended "exit"*: The driver forms beliefs over three equally likely visit-states (each prob. 1/3):  
  1. At A, device active (enforces continue): Go to B and exit → Payoff = 4.  
  2. At B, device inactive: Exit → Payoff = 4.  
  3. At A, device inactive: Exit → Payoff = 1.  
  - **Choosing "exit"**: Expected payoff = \((1/3)(4) + (1/3)(4) + (1/3)(1) = 3.0\).  
  - **Choosing "continue"**: Expected payoff = \((1/3)(4) + (1/3)(0) + (1/3)(0) = 4/3 \approx 1.333\) (lower).  
  Thus, "exit" is strictly optimal.  

  #### (iii) Conflict Between *Ex Ante* and *Ex Post* Optimality  
  Without the device, in *pure strategies*, conflict arises:  
  - *Ex ante* "always continue" (payoff 0) vs. *ex post*: At any node, \(p = 0 \Rightarrow P(A) = 0.5\), exit payoff = 2.5 > continue payoff = 0.  
  - *Ex ante* "always exit" (payoff 1) vs. *ex post*: \(p = 1 \Rightarrow P(A) = 1\), continue payoff = 4 > exit payoff = 1.  
  The *ex ante* optimal mixed strategy (\(p = 5/8\)) avoids conflict (indifference *ex post*).  

  With the device, no conflict: *Ex ante* optimal plan (intend "exit") matches *ex post* optimal action (payoff 3.0 > 1.333).  

  #### (iv) Coherence of Dynamic Consistency  
  The conflict in pure strategies without the device *appears* to challenge dynamic consistency: *Ex post* incentives deviate from the *ex ante* optimal plan. However, this does not undermine coherence. The mixed strategy (\(p = 5/8\)) achieves dynamic consistency (indifference reconciles plans and actions). The commitment device further resolves tension: It enables a *pure* strategy that is both *ex ante* optimal (payoff 2.0 > 1.5625) and *ex post* consistent.  

  The device’s rationality stems from its pre-departure cost-benefit calculus (net gain 0.4375). It acts as a belief-independent tool to align incentives, illustrating how commitment mechanisms can dissolve dynamic inconsistencies without invoking plan-dependent preferences. Thus, the paradox highlights instruments for consistency rather than refuting it.  

  ---

  ### Marking Scheme (Total 30 points)  
  1. **Strategy Space and Payoff Computation** (8 points)  
     - Full marks: Correct *ex ante* payoffs for pure/mixed strategies without device and intended actions with device.  
     - Typical failure: Miscomputing mixed strategy (e.g., ignoring sequential structure) or device payoff (e.g., omitting cost/randomization).  

  2. **Ex Post Belief Structure** (8 points)  
     - Full marks: Accurate beliefs (\(P(A)\), \(P(B)\)) without device and state probabilities with device.  
     - Typical failure: Assuming uniform location beliefs (e.g., \(P(A) = P(B) = 0.5\)) or mishandling device’s hidden enforcement.  

  3. **Dynamic-Inconsistency Tension** (6 points)  
     - Full marks: Contrasting conflict in pure strategies vs. resolution in mixed/device strategies.  
     - Typical failure: Claiming conflict exists at optimal mixed strategy or treating the paradox as a labeling issue.  

  4. **Commitment Device Rationality** (4 points)  
     - Full marks: Quantifying net gain (2.0 vs. 1.5625) and role in enabling consistency.  
     - Typical failure: Ignoring cost-benefit analysis or conflating device with preference shifts.  

  5. **Coherence Verdict** (4 points)  
     - Full marks: Arguing consistency is preserved via mixed strategies/commitment.  
     - Typical failure: Asserting dynamic consistency is universally undermined.  

  ---

  ### Confidence Statement  
  **Confidence Level:** High (95%).  
  - **Payoff Arithmetic:** Verified via multiple methods (algebraic optimization, scenario enumeration).  
  - **Coherence Argument:** Standard resolution (mixed strategies as consistent plans) aligns with literature.  
  - **Least Certain Point:** Whether the commitment device *resolves* the tension or merely *displaces* it to the pre-departure choice. Here, pre-departure choice is simple (known cost/benefit), but one could argue it introduces a new "tier" of inconsistency if the driver rethinks commitment *ex post*. However, the device’s hidden nature and lack of *ex post* revision opportunities mitigate this.
