  Round 3 removes the common enemy. Without it, internal differences resurface. The fracture should reveal hidden preference conflicts, especially if players have cross-cutting views. Points should shift to penalize factionalism and reward coordination, encouraging splintering.

  Roles: Bloc leaders negotiate and recruit; rank-and-file follow but have hidden incentives. Leaders might get more points, adding tension. Card distribution should ensure diversity—e.g., only a few have clear left/right alignment, most are mixed. This mirrors real-life ideological inconsistency.

