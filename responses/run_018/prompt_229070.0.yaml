answer: |-
  Here are structured interview questions designed to press the core assumptions and implications of your guest's "moral trade" view, following your specifications:

  **I. Pinning down the view (Opening Question - ~100 words)**
  "Your core analogy compares resolving moral disputes to economic trade. Using your donors example concretely: if the animal welfare donor 'values' sparing 100 chickens from factory farming more than preventing 1 malaria death, while the malaria donor 'values' preventing that death more than sparing those chickens, they trade concessions. How precisely do you determine *what each donor 'values more'* to enable this calculation? Is it purely subjective preference intensity revealed through negotiation? And crucially, how do you operationally define and measure the 'gain' each makes – what specific metric shows *each is objectively better off by their own standard* after the trade, beyond them just *saying* they are happier with the outcome?"

  **II. Pressure Questions (with Follow-ups - ~400 words)**

  1.  **Commensurability & Measurement:**
      *   **Question:** The framework relies on comparing how much *different people* value *fundamentally different things* (e.g., chicken suffering vs. human malaria deaths). Doesn't this quietly presuppose a universal scale of "value intensity" that allows us to say Alice valuing X a "9" is meaningfully comparable to Bob valuing Y an "8"? If no such common scale exists, what does "both end up with a world they rank higher" actually mean beyond subjective satisfaction? Isn't this satisfaction potentially disconnected from any objective moral improvement?
      *   *Likely Answer/Follow-up:* If he appeals to revealed preference (what people are willing to trade) as the measure: *"But doesn't revealed preference in bargaining just show strategic positioning and relative power, not true cardinal value intensity? Couldn't a deeply committed donor strategically understate their valuation to get a 'better deal,' making the resulting trade reflect power dynamics, not a genuine mutual 'gain' in moral terms?"*

  2.  **Duty vs. Prudence/Complicity:**
      *   **Question:** Many see certain moral positions (e.g., "animal torture is intrinsically wrong," "letting preventable children die is unconscionable") not as preferences to be traded, but as absolute duties. If I believe funding factory farms is *actively participating in evil*, isn't your framework asking me to *do some evil* (concede on factory farms) in exchange for the other side doing *less of what I see as evil* (funding more nets)? Doesn't this reduce morality to cost-benefit prudence and make me complicit in the wrong I concede?
      *   *Likely Answer/Follow-up:* If he argues this is the practical way to minimize harm overall or that "duties" are often overstated: *"But doesn't this response itself impose a *consequentialist* calculus ('less harm overall') onto the deontologist? Aren't you asking them to violate their core conviction *for the sake of consequences* – precisely the kind of trade-off their deontology rejects? How is this not demanding they abandon their fundamental moral framework?"*

  3.  **Abhorrent Values & Excluded Partners:**
      *   **Question:** Your donors example involves broadly sympathetic causes. How does this apply when one party's values are abhorrent to the other – say, a white supremacist who "values" ethnic segregation highly? Would your framework suggest finding concessions (e.g., less segregation in exchange for something they value less) to achieve a "mutually preferred" outcome? If not, where do you draw the line on who is a valid "trading partner," and doesn't drawing that line require appealing to a shared moral standard your theory claims we don't need?
      *   *Likely Answer/Follow-up:* If he says certain values are beyond the pale and excluded: *"Doesn't establishing criteria for exclusion – like 'causing profound, uncompensatable harm' or 'violating basic rights' – necessarily rely on substantive moral principles *external* to the trading framework itself? Doesn't this reveal that the framework isn't neutral but rests on prior, undeclared moral commitments about what counts as a legitimate value or tradable harm?"*

  4.  **Third-Party Costs:**
      *   **Question:** The donors strike a deal beneficial *to them* by their own lights: the animal donor gets more nets funded, the malaria donor gets more chickens spared. But the subjects of their actions – the chickens still subjected to *some* factory farming, or the malaria patients who *don't* get nets because funds went to chickens – never consented to this trade. Aren't these third parties bearing the costs of a compromise struck between two agents with different priorities? How does the framework account for the moral claims of those whose interests are being traded away without their input?
      *   *Likely Answer/Follow-up:* If he argues the third parties are still better off than in a stalemate or that donors represent their interests: *"But 'better off than stalemate' might still be deeply unjust *by the lights of the moral view concerned with them*. If the animal welfare donor trades away *some* chickens to get nets, hasn't she actively consented to *more* harm to chickens than her pure principles demand? How is she *not* sacrificing the intrinsic interests of the animals she represents for the sake of a deal with the malaria donor?"*

  **III. One question he will not expect (Closing Question - ~100 words)**
  "You focus on compromise *between* opposing groups. But doesn't this 'moral trade' logic also apply *within* a single moral movement? If faction A cares intensely about policy X and less about Y, while faction B cares intensely about Y and less about X, shouldn't they trade support internally? If not, why is internal purity valued over internal compromise? And if yes, doesn't this risk fragmenting movements into ever-smaller groups trading concessions, potentially diluting core principles and reducing overall effectiveness compared to unified, albeit less 'efficient,' advocacy?"

  **IV. What is actually contested (Short Note - ~100 words)**
  Among scholars engaging with "moral trade" or bargaining approaches to disagreement:
  *   **Live Disputes:** The *commensurability* of values across different moral frameworks (question 1) and the *complicity/compromise* objection regarding duties (question 2) are central, actively debated points. There is no consensus on whether the framework can adequately handle them.
  *   **Generally Regarded as Understood (but still critical):** The need for *exclusion criteria* for abhorrent values (question 3) is widely acknowledged as a necessary (though problematic) feature of the view, not a misunderstanding. The *third-party cost* issue (question 4) is typically understood as a genuine limitation or challenge the theory must address, rather than a misrepresentation.
