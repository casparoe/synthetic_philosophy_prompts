  For "Pinning down the view," I need an opening question that forces precision about gains. The donor example is perfect for this - asking how to measure "caring more" and what prevents endless haggling.

  For "Pressure questions," I'll address each required element with a main question and likely follow-up. For commensurability: how we compare different values across people and what "better off" means without a shared metric. For complicity: whether trading morally forbidden acts is permissible. For abhorrent values: where to draw the line on trade partners. For third parties: who bears costs when compromises are made.

  The unexpected question should come from an unanticipated angle - maybe about internal conflicts within movements rather than between them.

  For "What is actually contested," I'll note that commensurability debates are live in philosophy, complicity is actively disputed, exclusion criteria are problematic (but necessary), and third-party impacts are often acknowledged as limitations.

