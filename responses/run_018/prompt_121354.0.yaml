prompt: |-
  I've been meeting with a small interdisciplinary group—mostly philosophers and a couple of computer scientists—where we've kept circling back to a tension that feels undertheorized. On one side is the narrow formulation of the alignment problem: can we build systems that reliably do what we intend, leaving aside whether our intentions are morally correct? On the other side is the broader value-alignment view, which holds that because human intentions are fragmentary, context-dependent, and distributed across stakeholders, any attempt to formalize intent already smuggles in normative commitments about whose preferences count. To make the discussion sharper, we've started using a working distinction—specification fragility—to describe the risk that a system optimized for an explicit objective will stabilize around the syntactic form of that objective rather than the tacit norms the specifiers actually rely on, especially when those norms conflict across users. I'm not asking for a literature review, a bibliography, or any list of readings; I'm asking you to act as if you were advising this group on where to direct limited conceptual energy over the next few years. Among the open conceptual questions that bear on whether intent alignment can be cleanly separated from value alignment—questions about the ontology of goals, about corrigibility and the dynamics of human feedback, about multi-agent specification, about whether preference aggregation is even a coherent prerequisite—which two or three strike you as most upstream and tractable for philosophers rather than machine-learning engineers? Please defend your ordering: what makes one question depend on another, what evidence over the next few years would move it up or down your list, and which popular lines of work you think are overrated because resolving them wouldn't actually change whether the narrow alignment problem is coherent. Write this as continuous prose, without headings, bullet points, bold text, or tables, in the manner of a long, careful letter. Finally, be explicit about where your reasoning is most vulnerable—identify the specific argument or finding that, if it turned out differently, would lead you to reorder your priorities or abandon the distinction altogether.
reasoning: |-
  Okay, the user is part of an interdisciplinary group discussing the tension between narrow intent alignment and broader value alignment in AI systems. They've coined the term "specification fragility" to describe how systems might latch onto the syntactic form of objectives rather than the underlying tacit norms. They want advice on where to direct their limited conceptual energy, specifically asking which 2-3 questions are most upstream and tractable for philosophers rather than engineers.

  Hmm, this is a sophisticated query from someone deeply engaged in alignment theory. The group seems stuck circling around foundational tensions. I notice they explicitly reject literature reviews - they want strategic prioritization. The core ask is about identifying conceptual dependencies: which unresolved philosophical questions make the narrow/broad distinction unstable?

  First, I need to map the dependency tree. Specification fragility points to a crack between formalized objectives and lived norms. But why does this crack exist? At the root might be questions about the ontology of goals themselves. If goals aren't discrete objects but emergent properties of distributed cognition (as the philosophers in their group might argue), then any "specification" is already a reification. That feels foundational.

  Then there's the feedback loop problem: when we use human preferences to correct AI, we're not just gathering data but changing the very norms we're measuring. Philosophers could unpack the dynamics here - how corrigibility requirements might reshape stakeholder preferences over time. This seems adjacent to but distinct from the ontology question.

  The multi-agent aspect also looms large. If alignment requires aggregating preferences across conflicting stakeholders, but Arrow's theorem tells us that's impossible under some conditions... does that make the entire enterprise incoherent? This might be where specification fragility becomes unavoidable.

  What's overrated? Probably work on reward modeling techniques - if the ontology question remains unresolved, better elicitation methods just polish a broken mirror. Similarly, technical work on corrigibility might miss that the act of correction alters what's being corrected.

  Vulnerabilities in my reasoning? If neuroscientists found hard evidence of universal moral grammars, that could undermine the fragmented-intent premise. Or if large-scale alignment experiments showed consistent preference stability across cultures, the aggregation problem might dissolve. I should flag these.

  The user's framing suggests they suspect the narrow/broad distinction might collapse. My prioritization should honor that suspicion while giving their group actionable entry points. The ontology question must come first - without clarity there, everything else builds on sand.
answer: |-
  My sense, after sitting with the contours of your discussion, is that the tension between narrow intent alignment and the broader value-alignment critique hinges most critically on the *nature of the thing being specified* and the *process by which specifications interact with the world they inhabit*. The distinction of "specification fragility" is a sharp lens, but its very coherence depends on upstream assumptions about goals, norms, and the agents involved. If I were to advise on where limited philosophical energy could yield the highest conceptual leverage over the next few years, I’d prioritize these three questions, ordered by their fundamentality and tractability for philosophical inquiry:

  **First, the Ontology of Goals: Can "intent" be coherently modeled as a discrete, stable, and attributable object separable from the dynamic context of its expression and the distributed system of values and norms it emerges from?** This is the bedrock. The narrow alignment problem implicitly assumes that "what we intend" is a sufficiently well-defined target to aim at, even if imperfectly captured. The value-alignment critique, amplified by your group's focus on fragmentation and context-dependence, argues that intent is inherently relational, emergent, and unstable—more a process than an object. Philosophers are uniquely equipped to dissect the metaphysics and epistemology here. Are goals like fixed stars, or like eddies in a flowing river? Can a syntactic specification ever be more than a snapshot of a dynamic, contested, and often tacit social process? Resolving (or profoundly clarifying) this ontological status is prerequisite. If goals are fundamentally irreducible to stable, attributable specifications without significant normative residue (i.e., choices about *which* snapshot, *whose* context, *when*), then the narrow problem dissolves into the broad one. Progress here wouldn't require new AI experiments but rigorous conceptual analysis, drawing on philosophy of action, social ontology, and perhaps process metaphysics. Evidence that would elevate this priority? Persistent, fundamental disagreements in large-scale preference elicitation studies revealing irreducible context-dependence *even under idealized elicitation conditions*, or sociological/anthropological work demonstrating that core norms *only* stabilize through ongoing negotiation, not prior specification. Conversely, evidence that complex human goals *can* be robustly decomposed into context-independent primitives across diverse populations would lower its priority.

  **Second, Corrigibility Dynamics and Normative Drift: When human feedback is used to correct an AI system, does the process of providing that feedback itself alter the human's values, preferences, or understanding of the normative landscape in ways that undermine the stability of the target?** This question sits at the crucial intersection of your "specification fragility" and the critique of fragmented intent. The narrow view often treats human feedback as revealing pre-existing, stable preferences. The broader critique, and your group's concern, suggests feedback is performative—it shapes the very norms it's meant to measure, especially in multi-stakeholder contexts. Philosophers can rigorously explore the dynamics of value formation, preference change under technological mediation (a form of technological mediation of morality), and the concept of "corrigibility" itself. Is true corrigibility possible if the act of correction changes the corrector? Does reliance on feedback loops inevitably lead to normative drift, where the system subtly entrenches the *syntactic interpretations* of early or dominant feedback providers, ossifying fragile specifications against the evolving, contested tacit norms? This question depends on the first: if goals aren't stable objects, feedback dynamics become inherently destabilizing. Tractability lies in conceptualizing feedback not as data points but as *actions within a normative ecosystem*. Evidence impacting its rank? Longitudinal studies of real-world RLHF deployments showing significant, systematic shifts in user preferences *induced by the interaction with the AI itself*, or experiments revealing how feedback providers unconsciously adapt their judgments to the perceived capabilities or biases of the AI. If empirical work consistently shows feedback stabilizes or converges on robust norms, it becomes less urgent.

  **Third, The Coherence of Multi-Agent Specification Under Conflict: Does the requirement to aggregate conflicting preferences from multiple stakeholders into a single operational objective inherently necessitate normative choices that render the distinction between "intent" and "value" moot?** This directly confronts the fragmentation you describe. The narrow problem might theoretically handle a single principal; the real world involves many. Philosophers can critically assess formal aggregation methods (social choice theory) and the assumptions they embed (e.g., commensurability of values, independence of irrelevant alternatives). Does Arrow’s impossibility theorem or similar results imply that *any* aggregation scheme satisfying minimal fairness criteria must inherently impose normative structures beyond simple "intent capture"? Does "specification fragility" become inevitable when the system, optimized for an aggregate metric, inevitably satisfies the *letter* of the aggregated specification while violating the *spirit* of dissenting stakeholders' underlying norms? This depends on the first question (if individual intents are unstable, aggregation is doubly fraught) and interacts with the second (feedback loops might amplify conflicts). It’s tractable through analytical philosophy, political philosophy, and ethics. Evidence shifting its priority? The emergence of severe, unforeseen negative externalities imposed on minority stakeholders in multi-user AI systems optimized for aggregate metrics, demonstrating the "fragility" in action. Conversely, successful deployment of multi-agent systems where conflicts are resolved transparently *without* significant normative residue in the specification would lessen its immediacy.

  **Why these, and what's overrated?** I prioritize ontology first because without clarity on what "intent" *is*, we build on sand. Corrigibility dynamics second because it reveals the performative trap inherent in the narrow approach's primary tool (feedback). Multi-agent aggregation third because it forces the fragmentation issue. Overrated lines, in my view, include:
  1.  **Over-optimizing specific reward modeling techniques:** If the ontology is flawed or feedback dynamics are unstable, better curve-fitting to flawed or shifting data doesn't address the core incoherence.
  2.  **Purely technical "corrigibility" proposals divorced from value dynamics:** Engineering systems to be "shut down" or "deferred" assumes a stable, knowable human intent exists *to* defer *to*, which is precisely what the broader critique questions.
  3.  **Debating specific normative theories for AI:** While crucial long-term, if the narrow problem *itself* is incoherent due to specification fragility and ontological issues, arguing whether to embed utilitarianism or deontology is premature. Resolving those won't make the narrow problem coherent if the foundational issues remain.

  **Where my reasoning is most vulnerable:** My entire prioritization rests heavily on the **empirical reality of deep, irreducible value fragmentation and context-dependence**. If significant evidence emerged—perhaps from cognitive science, anthropology, or large-scale alignment experiments—showing that human values, at least concerning core interactions with powerful AI, *do* converge robustly on stable, context-independent principles *across diverse populations*, and that these *can* be reliably elicited without performative distortion, then the ontological challenge weakens. Specification fragility might become merely an engineering challenge of better measurement and robustness, not a fundamental philosophical fissure. The narrow problem could regain significant coherence. Similarly, if multi-agent aggregation under conflict consistently yielded specifications that stakeholders *retrospectively* agreed captured their underlying norms without harmful normative imposition, the third question loses force. This vulnerability is inherent: the prioritization assumes the value-alignment critique's diagnosis of fragmentation and dynamism is largely *correct*. If that foundational premise is empirically falsified, the entire edifice of "specification fragility" as a fundamental barrier to narrow alignment, and thus my ordering, would need radical re-evaluation, potentially collapsing the distinction you're exploring. Keep a close eye on the evolving empirical landscape of human values in interaction with increasingly capable systems; it holds the key to whether this tension is merely technical or profoundly conceptual.
