  me and my friend had this long argument last night about Strawson's reactive attitudes and whether the whole compatibilism/incompatibilism stall is just people talking past each other. specifcally we were fighing about whether the objective attitude is really non-reactive or just resentment with extra steps — like, can you suspend emotional engagement completely, or is objectivity here just a cooler form of blame? he says its a categorical shift in how you relate to someone, i say its affective distance inside the same reactive practice. is that verbal, about what reactive means, or a deeper split about whether moral responsibility needs emotional vulnerability? and is the decades-long deadlock because both sides are actualy answering different questions about freedom? i want a diagnosis using what Strawson actually says about participant vs objective stances, not a survey. what would move it — a sharper distinction, or are we just stuck with bedrock intuitions? dont send me papers, my laptop died and i cant check anything.
