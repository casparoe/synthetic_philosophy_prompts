answer: |-
  1.  Popper initially criticised Darwinism as "almost tautological" and unfalsifiable because "survival of the fittest" defined fitness solely by survival, making it seem circular; he later revised his view, accepting natural selection as a testable scientific theory.
  2.  His evolutionary epistemology applies selection logic *analogously* to the growth of knowledge, where hypotheses compete and unsuccessful ones are "selected against" through falsification; he argued this process for *ideas* isn't metaphysical.
  3.  While biological natural selection avoids tautology by defining fitness via *independent* criteria like reproductive success in specific environments, Popper maintained his epistemology's core logic isn't circular because falsification provides concrete empirical tests for ideas.
  4.  Concepts like niche construction (organisms altering their own selective pressures) challenge simplistic adaptationist views but don't inherently make natural selection tautological; they add complexity to how selection operates within dynamic systems.
  5.  Similarly, the Baldwin effect (learning influencing genetic evolution) complicates the selection picture but doesn't resolve the *philosophical* tension regarding tautology; it simply illustrates a more intricate interplay between behaviour, environment, and heredity within evolutionary theory.
