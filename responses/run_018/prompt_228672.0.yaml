  Perhaps the end of the Han Dynasty. Elite overproduction with scholar-gentry, Yellow Turban rebellions (immiseration), fiscal weakness. If she says yes, supports Rule B. If no, then maybe she sees it as different. But the user wants a case not in the original six. 

  The discriminating case should have elite overproduction but missing one of the others. For example, a situation with elite overproduction and immiseration but no state insolvency. Or elite overproduction and insolvency but no immiseration. 

  Example: The Gilded Age in the US. Elite competition (robber barons), some popular immiseration (labor struggles), but state solvent. If she doesn't count it, then Rule B (needs insolvency) is supported. If she does count it, then insolvency isn't necessary, supporting Rule A. 

  But she excluded the Great Depression despite immiseration because no elite surplus or insolvency. The Gilded Age has elite competition but no state insolvency. If she says no to Gilded Age, that aligns with needing insolvency (Rule B). If yes, then insolvency isn't required. 

  However, the American Civil War was considered disintegrative without the Union's insolvency. So perhaps insolvency is only required for the region collapsing. In the Civil War, the Confederacy had insolvency. So maybe the state insolvency criterion applies to the entity in question. 

  For China, the central state is solvent, but local governments have debt. If she considers local insolvency sufficient, then China might have that. But her past cases (like Rome) had central fiscal issues. 

