  The best case might be the 1848 Revolutions. Elite overproduction (educated bourgeoisie), popular immiseration (crop failures), but state insolvency varied by region. In France, the monarchy had fiscal issues, but other states like Prussia were more stable. If she considers 1848 as disintegrative for some states, then the presence of all three factors in those states supports Rule B. If she denies it, perhaps because no full collapse, then maybe only major collapses count. 

