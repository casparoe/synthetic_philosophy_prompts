    "diagnosis_type": "mixed",
    "hidden_empirical_or_formal_question": "Whether evolutionary psychology reveals a unitary selection mechanism for all core moral judgments or distinct pathways (e.g., cooperation-adaptation vs. disgust-avoidance) with different epistemic implications.",
    "progress_pathway": "Empirical demonstration of disunified moral cognition mechanisms, forcing domain-specific debunking; and conceptual separation of epistemic warrant and metaphysical redundancy challenges.",
    "permanent_impasse": false,
    "justification": "Empirical or conceptual disambiguation can shift positions.",
    "mechanism_distinction_matters": true
  }
  ```

  ### Key Justifications
  - **diagnosis_type**: "mixed" (substantive dispute over defeaters + verbal ambiguity + conflated projects).  
  - **hidden_question**: Present and empirical; central to whether debunking is global or local.  
  - **progress_pathway**: Empirical disunity is actionable; conceptual separation reduces talking-past.  
  - **permanent_impasse**: False. Empirical findings *could* force concessions (e.g., debunking purity norms but not harm norms).  
  - **mechanism_distinction_matters**: True. If disgust-based norms are evolutionarily distinct and contingent, they are harder for realists to defend via third-factors, while cooperation-based norms may retain reliability.
