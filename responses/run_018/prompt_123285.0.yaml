  Hmm, the user is convening a philosophy-of-ethics reading group that's stuck on evolutionary debunking arguments in metaethics. They've been going in circles for months on whether evolutionary psychology undermines moral realism. Everyone can recite the standard moves—genealogical premises, correlation worries, redundancy objections—but no one's budging. The user wants a fresh diagnosis of why this disagreement is so intractable, not just a literature review. They're asking whether it's a substantive dispute, a verbal disagreement, or different questions being conflated, and whether there's a hidden empirical issue about how moral cognition evolved.

  I need to dig into how realists and debunkers actually argue in this debate. Realists like Enoch or Wielenberg typically say that evolutionary origins don't matter unless they break the correlation with truth. They use "third-factor" explanations: for example, the fact that cooperation was adaptive might explain why we believe in cooperation, and it also makes cooperation morally good—so there's no severing of correlation. Debunkers like Street or Joyce counter that this is circular or question-begging because it assumes realism to defend it. They insist that if evolution shaped our beliefs for survival, not truth, that's an undercutting defeater regardless of correlation.

  The user mentions a specific twist: they wonder if the impasse stems from unspoken differences in what "justification" or "tracking" means. Realists seem to work with a externalist view where justification isn't undermined if the belief is reliably formed, even if the process wasn't truth-aimed. Debunkers lean internalist, demanding a non-question-begging reason to think evolution got it right. That sounds more verbal than substantive—they're talking past each other on epistemic standards.

  Also, there's the issue of conflation. The user points out that the debate might be mixing two projects: one about warrant (are beliefs justified given their origins?) and another about redundancy (does evolution make realism explanatorily idle?). Realists often focus on the former, debunkers on the latter. When a debunker says "evolution explains why we have these beliefs without needing moral facts," a realist hears it as an epistemic challenge and responds with third factors, but the debunker might be making a metaphysical point about parsimony. That's definitely different questions under one label.

  Then there's the empirical angle. The user speculates about whether evolutionary psychology actually shows a unified selection mechanism or distinct pathways like cooperation-selection vs. disgust-avoidance. I know the literature: theorists like Curry suggest "morality as cooperation" with separate adaptations, while others like Ruse treat it as a package deal. If disgust-based norms (e.g., purity taboos) are more contingent and culturally variable, they might be easier to debunk, whereas cooperation norms could be stable and truth-tracking. So yes, this hidden question could be pivotal—if debunkers assume uniformity but realists can exploit disunity, it might break the stalemate.

  For progress, the user asks what could move the needle. A key conceptual distinction is needed to separate the warrant and redundancy projects. On the empirical side, better evidence on moral cognition's modularity could force adjustments—e.g., if disgust norms are shown to be evolutionarily fragmented, debunkers might win on those but realists hold ground on harm norms. Still, the core impasse over epistemic defeat might be bedrock: realists and debunkers have deep intuitions about whether causal origins can undermine normativity, and that might be unshakeable without a paradigm shift.

  The impasse isn't permanent because empirical work or reframing could help, but the epistemic clash might persist. Finally, mechanism distinction matters—if disgust and cooperation pathways are separate, it changes the diagnosis by making debunking piecemeal rather than global.

