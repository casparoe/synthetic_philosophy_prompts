answer: |-
  Here’s a diagnosis grounded in the dialectic you describe, followed by the structured summary:

  ### Diagnosis
  The impasse arises from **three interlocking issues**, with the core being a **substantive disagreement over epistemic defeaters** that is amplified by **verbal ambiguities** and **conflated projects**, all while a **hidden empirical question** about moral cognition’s evolutionary disunity lurks beneath the surface.

  1.  **Substantive Dispute (Primary)**:  
      Realists (e.g., Enoch, Wielenberg) argue that evolutionary etiology only defeats justification if it *breaks* a reliable correlation with truth. Their "third-factor" (e.g., cooperation’s adaptive value *and* moral goodness) preserves correlation. Debunkers (e.g., Street, Joyce) counter that evolutionary pressures *guarantee* that moral beliefs are "off-track" relative to mind-independent truths because selection targets fitness, not truth. For them, the *type* of causal origin (fitness-based, not truth-tracking) is intrinsically defeating, regardless of third-factor attempts. **This is a deep clash about whether non-truth-aimed origins *in principle* undermine justification in domains where we lack independent access to truth-makers.** Realists demand proof of *broken correlation*; debunkers insist the *origin’s aim* suffices for defeat.

  2.  **Verbal Disagreement (Amplifier)**:  
      Key terms like "tracking" and "justification" are contested. Realists use "tracking" *externally*: if beliefs align with truth (however caused), they "track." Debunkers use it *internally*: tracking requires a causal or explanatory connection to truth-makers. Similarly, "justification" for realists is often reliabilist (process yields true beliefs), while debunkers lean toward internalist/evidentialist standards (need for non-question-begging reasons). When a debunker says "evolution severs tracking," the realist hears "breaks correlation," but the debunker means "lacks truth-aimed mechanism." **This ambiguity lets both sides "rebut" without engaging the other’s core concern.**

  3.  **Conflated Projects (Complicator)**:  
      The group is conflating two distinct questions:  
      - **Epistemic Project (Warrant)**: Are moral beliefs *justified* given their origins?  
      - **Metaphysical Project (Redundancy)**: Does evolutionary explanation *obviate the need* for moral realism?  
      Realists address the first (third-factors preserve warrant), while debunkers often shift to the second (e.g., Street’s "Darwinian Dilemma" argues that realism is explanatorily redundant). When debunkers say "evolution explains beliefs without moral facts," realists interpret it as an epistemic challenge and reply with third-factors. But the debunker may be making a metaphysical point about parsimony. **This conflation makes objections feel "stale" – each side answers a different question.**

  4.  **Hidden Empirical Question (Silent Arbiter)**:  
      The debate assumes moral cognition is a monolithic adaptation for "social cohesion." But if evolutionary psychology reveals **distinct pathways** (e.g., cooperation-selection for harm/fairness norms vs. disgust-avoidance for purity norms, or domain-specific vs. domain-general mechanisms), the debunking argument may apply unevenly. If harm-avoidance beliefs arise from cognitive mechanisms co-opted for general cooperation (plausibly truth-conducive), they resist debunking better than disgust-based taboos (highly contingent). **The current stalemate relies on an untested empirical premise: that all "core" moral judgments share a unitary, fitness-maximizing etiology.** If this is false, the debate needs fragmentation.

  ### Pathways to Progress
  - **Most Feasible**: **Empirical disambiguation** of moral cognition’s evolutionary architecture (e.g., via cognitive neuroscience or cross-cultural anthropology). Demonstrating distinct pathways (cooperation vs. disgust) would force both sides to modularize their arguments, conceding some domains to debunking (e.g., purity norms) while preserving others (e.g., fairness).  
  - **Conceptual Clarification**: Explicitly separating the **epistemic** (warrant) and **metaphysical** (redundancy) projects. Frame redundancy as a challenge to realism’s *explanatory necessity*, not directly to warrant.  
  - **Least Realistic**: Resolving the **bedrock intuition clash**. Realists won’t accept that non-truth-aimed origins *inherently* defeat justification without correlation-break evidence; debunkers won’t accept third-factors as non-question-begging. This is near-bedrock.

  **Impasse Permanence**: Not permanent, but resistant. Empirical disunity could shift the terrain, and conceptual separation could unlock stalled discussions. However, the core epistemic clash (must justification preclude non-truth-aimed origins?) may persist indefinitely absent a paradigm shift in metaepistemology.

  ---

  ### Structured Summary (JSON)

  ```json
