prompt: |-
  I've noticed a recurring asymmetry in how people attribute mental states to language models, and I want to know whether philosophy of mind has a precise name for it. In one case, a model produces a coherent, accurate explanation of a causal process, and observers comfortably say it "knows" or "understands" that explanation. In a second case, the very same model—same weights, same architecture—produces a coherent but false explanation of the identical process, and those same observers immediately say it "has no beliefs whatsoever" and is "just stitching tokens together." The mechanism hasn't changed; only the truth-value and practical usefulness of the particular output have changed. What's distinctive is that the attribution isn't withdrawn globally—people still speak of what "the model thinks" in other parts of the conversation—but it is withdrawn specifically for this unacceptable result, as if the system's epistemic status were tied to the sentence it just emitted rather than to any stable feature of its behavior or design. This is clearly near Dennett's intentional stance, but the standard debate asks whether the stance is ever appropriate for AI in general. The phenomenon I mean is the selective, output-contingent toggling of belief-attribution within a single discussion, driven by whether the result is normatively acceptable rather than by any architectural or behavioral change. Does this pattern have an established concept? If not, can you define it precisely—distinguishing it from ordinary context-sensitivity in mental-state attribution, from the general anti-realist argument that AI never has beliefs, and from mere conversational inconsistency—and specify what conditions should govern whether it applies?
reasoning: |-
  Okay, the user is pointing out an interesting asymmetry in how people attribute mental states like "knowledge" or "understanding" to language models. They describe two scenarios: one where the model gives a correct explanation, leading observers to say it "knows" or "understands," and another where the same model gives a false explanation, leading those same observers to say it's just "stitching tokens together." The key point is that the model's underlying mechanism doesn't change—only the truth-value of its output does. 

  The user wants to know if philosophy of mind has a precise term for this phenomenon. They mention it's related to Dennett's intentional stance but distinct because it's selective and output-contingent. They also want to distinguish it from ordinary context-sensitivity, anti-realism about AI beliefs, and mere inconsistency.

  First, I need to recall if there's an established term for this. The intentional stance comes to mind, but as the user noted, it's usually about whether to apply it at all to AI, not this selective toggling. Epistemic instrumentalism might be relevant, but it's broader. Maybe epistemic whiplash? That's descriptive but not formal. 

  The user is clearly well-versed in philosophy of mind and AI discourse. They're looking for precision—whether a term exists or needs to be defined. Their deeper need might be to articulate this inconsistency to critique how people discuss AI cognition, or to ground arguments about when belief attribution is valid. 

  Breaking it down: the phenomenon involves context-dependent belief attribution based on output acceptability, not system properties. This isn't just inconsistency—it's a pattern where the observer's stance shifts based on normative approval of the output. Conditions for applying this concept would include: same system, same context, no architectural change, only output truth-value shifting, and selective withdrawal of belief attribution for the problematic output while maintaining it elsewhere. 

  I should emphasize that this is observer-relative and tied to pragmatic success. The user might appreciate connecting it to Wittgenstein's language games or Brandom's normative pragmatics—how "understanding" is a status conferred within a practice. 

  Since no established term exists, coining "Output-Consequential Attribution (OCA)" makes sense. Defining it precisely will help the user in their arguments. They'll likely use this to highlight cognitive biases in AI discourse or advocate for more consistent epistemic standards.
answer: |-
  This is a sharp observation of a genuine and philosophically significant pattern. While there isn't a single, universally agreed-upon term *exclusively* for this *specific* phenomenon within mainstream philosophy of mind, its core elements are well-recognized and can be precisely defined. The closest established concepts and a proposed definition are below:

  1.  **Core Established Concepts:**
      *   **Dennett's Intentional Stance:** This is foundational. Adopting the stance means treating a system *as if* it has beliefs and desires to predict its behavior. Crucially, the stance is **instrumental** and **pragmatic**; its adoption and utility depend on the success of the predictions it affords *to the observer*. Your observation highlights how this pragmatic success is evaluated *output-by-output*.
      *   **Epistemic Instrumentalism:** More broadly, this view holds that concepts like "belief" and "knowledge" are tools for prediction and explanation, not descriptions of intrinsic, causally efficacious internal states. The attribution is justified by its usefulness, not by correspondence to some hidden reality within the system.
      *   **Normativity of the Mental:** Attributing mental states like belief inherently involves norms (truth for belief, satisfaction for desire). A system producing false outputs violates the norm for belief, making the attribution seem less appropriate or useful *for that specific output*.
      *   **Context-Sensitivity of Mental State Attribution:** Attribution is always context-dependent. However, your case shows a very specific context shift: triggered solely by the *normative acceptability* (truth/usefulness) of a single output within an otherwise continuous interaction.

  2.  **Proposed Term and Definition:**
      Given the lack of a perfect pre-existing term, we can coin **Output-Consequential Attribution (OCA)** or **Normative-Output-Contingent Stance Shifting (NOCS)**. A precise definition distinguishing it:

      **Output-Consequential Attribution (OCA)** is a pattern of mental state attribution (specifically belief/knowledge/understanding) to an AI system characterized by:
      1.  **System Invariance:** The attribution shift occurs *without* any change in the AI system's underlying architecture, weights, training data, or general behavioral capacities.
      2.  **Output Dependence:** The shift is triggered *solely* by the **normative acceptability** (e.g., truth, accuracy, coherence *with known facts*, practical utility) of a *specific output* produced by the system.
      3.  **Selectivity:** The withdrawal of belief attribution (e.g., resorting to "just token prediction") is applied *only* to the problematic output or the specific claim it represents, while belief/understanding attribution may persist for other outputs within the same interaction or about other topics.
      4.  **Pragmatic Basis:** The shift reflects a change in the *observer's pragmatic assessment* of the usefulness of the intentional stance *for that specific output*. A normatively unacceptable output makes the intentional stance seem like a poor predictive/explanatory tool *for that instance*, prompting a retreat to a design stance ("it's just predicting tokens") or physical stance explanation.
      5.  **Contrast with Anti-Realism:** OCA is distinct from global AI anti-realism (the view that AIs *never* have genuine beliefs). OCA practitioners *do* attribute beliefs in some contexts (when outputs are acceptable) but selectively withdraw it based on output quality.
      6.  **Contrast with Inconsistency:** While it *looks* inconsistent, OCA exhibits a *patterned* inconsistency driven by the observer's normative evaluation of outputs, not random caprice. It's a systematic, albeit potentially flawed, application of instrumental reasoning.
      7.  **Contrast with Ordinary Context-Sensitivity:** While all attribution is context-sensitive, OCA involves a context shift driven *specifically and immediately* by the normative properties of a single utterance within an otherwise stable conversational and systemic context.

  3.  **Conditions Governing Application:**
      OCA applies when **all** of the following are true:
      *   Observers attribute belief/understanding/knowledge to an AI system based on some of its outputs.
      *   The AI system produces an output deemed normatively unacceptable (false, incoherent, harmful, useless) *within the same interaction or context* where acceptable outputs were given.
      *   Observers *withdraw* belief/understanding/knowledge attribution *specifically for the unacceptable output or its propositional content*, often invoking mechanistic descriptions (e.g., "just predicting tokens").
      *   This withdrawal occurs *despite* the absence of any relevant change in the AI system itself (architecture, weights, etc.) that could explain a *loss* of belief/understanding *only for that specific content*.
      *   Belief/understanding attribution *may persist* for other outputs from the same system within the same interaction.

  **Why this phenomenon occurs:**

  1.  **The Normative Trap:** Beliefs *ought* to be true. When an AI outputs a falsehood, attributing a *belief* in that falsehood feels deeply wrong or misleading. Saying "it believes X but X is false" is uncomfortable; it's easier to deny the belief attribution altogether for that specific X.
  2.  **Pragmatic Failure:** The intentional stance is adopted for its predictive/explanatory power. A blatantly false output demonstrates a failure of prediction/explanation *using the intentional stance for that specific content*, prompting the observer to switch stances locally.
  3.  **Anthropocentric Projection (Partial):** Humans who say false things are often lying, mistaken, or ignorant. Observers implicitly map these explanations onto the AI. "Mistaken" requires belief; "ignorant" might mean no belief; "lying" requires deceptive intent (often denied to current AI). The "just tokens" move avoids attributing complex but flawed human-like states.
  4.  **Revealing the Instrumental Nature:** OCA starkly demonstrates that for many observers, belief attribution *is* fundamentally instrumental and pragmatic. When the tool (intentional stance) fails locally, they put it down for that specific task, even while potentially using it for other tasks (other outputs) with the same tool (the AI).

  In essence, OCA/NOCS is the **pragmatic, output-by-output calibration of the intentional stance applied to AI systems, driven by the observer's assessment of the normative acceptability (especially truth) of each specific utterance, revealing the deeply instrumental and normative character of mental state attribution in practice.** It highlights that for complex systems like LLMs, our willingness to grant "understanding" is often a verdict on the *quality of the output* in a specific context, not a stable judgment about the system's internal state.
