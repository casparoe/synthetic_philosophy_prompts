answer: |-
  What you're describing is a **perfect storm of rational adoption and institutional ossification** that doesn't fit neatly into a single existing concept. While adjacent to several ideas, the *specific configuration* — a methodological cascade amplified by institutional reinforcement that actively punishes deviation — deserves its own carve-out. Here's a precise dissection:

  ### The Core Concept: **Bureaucratized Epistemic Cascade (BEC)**
  *(Coined as per your request, emphasizing the institutional enforcement mechanism)*

  **Defining Boundaries:**
  1.  **Not *Just* an Information Cascade:**
      *   Standard cascades involve individuals abandoning private signals to follow predecessors' *observable choices* (e.g., "Everyone uses Tool X, so I will too"). Yours starts this way (high-profile journals signal credibility).
      *   **BEC Difference:** The cascade rapidly moves beyond *observational learning* into **institutional mandate**. Adoption becomes tied to survival (funding, publication) via explicit or implicit rules (grant requirements, reviewer expectations, "standard methods" in RFPs). The cost of *not* adopting shifts from potential error to concrete penalty.

  2.  **Not *Just* Path Dependence:**
      *   Path dependence explains *lock-in* due to switching costs, sunk investments, or network effects (e.g., QWERTY keyboard). Your case has this (training, established workflows).
      *   **BEC Difference:** Path dependence is often passive ("it's too hard to change"). BEC involves **active institutional maintenance and enforcement**. Funding agencies *codify* the method; reviewers *police* compliance; departments *train* exclusively in it. The "path" is paved, signposted, and patrolled.

  3.  **Not *Just* Groupthink:**
      *   Groupthink focuses on psychological pressure within a *cohesive group* suppressing dissent to maintain harmony.
      *   **BEC Difference:** The pressure in BEC is **structural and careerist**, not primarily psychological. A grad student might *know* a method is suboptimal but uses it because their advisor says "That's what reviewers want," or a PI uses it because "NSF expects it in the methods section." The punishment isn't social ostracism (as in groupthink), but **material consequences** (rejected grant, paper, or career stagnation).

  4.  **Not *Just* Institutional Isomorphism:**
      *   This (DiMaggio & Powell) explains why organizations become similar: coercive (regulation), mimetic (copying successful models), normative (professional standards). Your case has strong mimetic (copying big labs) and normative (training) elements.
      *   **BEC Difference:** Isomorphism is broad (e.g., all hospitals adopt similar structures). BEC is **specifically about *epistemic tools/methods*** and their **codification into bureaucratic requirements that create direct disincentives for methodological innovation or critical evaluation**. It's the *weaponization* of isomorphism for a specific technical practice.

  **Hallmarks of a Bureaucratized Epistemic Cascade (BEC):**
  1.  **Trigger:** Perceived success/credibility (e.g., adoption by high-status actors/publications).
  2.  **Cascade Initiation:** Widespread, often rational, adoption based on signals/social proof.
  3.  **Institutional Capture:** Key gatekeepers (funding agencies, journals, review panels) formalize the method as a *de facto* or *de jure* standard.
  4.  **Reinforcement & Punishment:** Use becomes tied to resource access (grants) and validation (publication). Deviation incurs tangible costs (rejection, extra justification burden).
  5.  **Erosion of Critical Evaluation:** Incentives shift from "Is this the best tool?" to "Does this satisfy the bureaucratic requirement?" Early adopters' assumed diligence becomes unquestioned dogma.
  6.  **Lock-in & Delayed Discovery of Flaws:** Entrenchment stifles exploration of alternatives. Flaws are only discovered much later, often serendipitously, because the system actively discouraged looking for them.
  7.  **Persistent Dysfunction:** Even after flaws are known, the bureaucratic inertia and high switching costs (retraining, rewriting standards, changing reviewer expectations) make reform difficult.

  **Why "Bureaucratized Epistemic Cascade" Fits Your Case:**
  *   **Epistemic:** It's fundamentally about knowledge production (methods for analysis).
  *   **Cascade:** It began with observational herding (copying high-profile labs/journals).
  *   **Bureaucratized:** The cascade was supercharged and locked in by its integration into the *bureaucratic machinery* of funding, publication, and training, which then actively punished non-compliance. The "field" didn't just settle on it; the *system* enforced it.

  This term carves out the specific space where rational individual choices, amplified by social proof, become codified by institutions into requirements that then actively suppress methodological pluralism and critical evaluation, leading to systemic vulnerability and persistent suboptimality. It perfectly encapsulates your coffee-shop revelation.
