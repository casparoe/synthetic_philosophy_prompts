answer: |-
  Below is a runnable 90-minute activity designed to meet your specifications. The activity uses three sequential rounds with clear rules, real stakes (chocolate coins or similar), and minimal front-loaded explanation. I'll provide exact instructions, payoff structures, recording procedures, and debriefing points. The activity is designed for 14 regular students, with 4 temporarily acting as "newcomers" in Round 3.

  **Logistics Summary:**
  - **Group Size:** 14 students total. For Rounds 1–2, all 14 participate. For Round 3, 10 are "insiders" (with shared history), and 4 are "newcomers" (rotated out during Rounds 1–2).
  - **Materials:** 
    - Movable chairs (arranged in a circle for discussion).
    - Whiteboard (for recording results).
    - Three types of colored cards (e.g., **Red**, **Blue**, and **Green**) — one set per student (each set has one of each color).
    - Prizes: Chocolate coins or tokens (e.g., 3 coins = high reward, 1 coin = low reward, 0 = no reward).
  - **Setup:** 
    - Before starting, give each student a set of three colored cards (Red, Blue, Green). 
    - Split the group: 4 students randomly selected as "temporary observers" for Rounds 1–2 (they will be newcomers in Round 3). They wait outside the room until Round 3.

  ---

  ### **Activity Rules and Instructions**  
  **Facilitator Note:** Begin with minimal context. Do not mention Lewis, conventions, or norms. Simply state: *"We’re playing a game about group decisions. Follow the rules for each round. Your goal is to earn points, which can be exchanged for prizes. No talking during rounds—only hold up a card when I say 'Choose.'"*

  #### **Round 1: Coordination Problem (Arbitrary Regularity)**  
  **Objective:** Experience symmetry-breaking with two equally good solutions.  
  **Instructions to Students:**  
  > "This is **Round 1**. You each have Red and Blue cards. When I say 'Choose,' hold up **ONE** card: **Red** or **Blue**.  
  > - **Payoff Rules:**  
  >   - If **at least 10 people** hold up the **same color**, everyone with that color gets **3 chocolate coins**.  
  >   - If **not** (e.g., split 8-6), **everyone gets 0 coins**.  
  > - You have 10 seconds to choose. Ready? **Choose!**"  

  **Facilitator Actions:**  
  1. After choices are revealed, count and record on the whiteboard:  
     ```  
     ROUND 1  
     Red: [Number]  
     Blue: [Number]  
     Outcome: [Coordination?] → Rewards: [e.g., "Red: 3 coins each"]  
     ```  
  2. Distribute rewards immediately (if coordination is achieved).  

  **Expected Dynamics:**  
  - Students face a pure coordination problem with two identical equilibria (Red or Blue). Salience (e.g., someone choosing early) or random chance will break symmetry. Most groups coordinate on one color arbitrarily.  

  ---

  #### **Round 2: Sticky Precedent (Objective Improvement Available)**  
  **Objective:** Feel the cost of abandoning an established solution when a better option emerges.  
  **Instructions to Students:**  
  > "This is **Round 2**. You now have **Red**, **Blue**, and **Green** cards. When I say 'Choose,' hold up **ONE** card.  
  > - **Payoff Rules:**  
  >   - If **at least 10 people** hold up **Red**, everyone with Red gets **1 chocolate coin**.  
  >   - If **at least 10 people** hold up **Blue**, everyone with Blue gets **1 chocolate coin**.  
  >   - If **at least 10 people** hold up **Green**, everyone with Green gets **3 chocolate coins**.  
  >   - If **no color** gets 10+ votes, **everyone gets 0 coins**.  
  > - You have 10 seconds. Ready? **Choose!**"  

  **Facilitator Actions:**  
  1. Record on the whiteboard:  
     ```  
     ROUND 2  
     Red: [Number] | Blue: [Number] | Green: [Number]  
     Outcome: [Coordination?] → Rewards: [e.g., "Red: 1 coin each"]  
     ```  
  2. Distribute rewards immediately.  

  **Expected Dynamics:**  
  - Groups usually stick with Round 1’s color (e.g., Red) despite Green offering triple rewards. Switching risks miscoordination (e.g., if some stay with Red while others switch to Green). Students experience the "cost" of deviating from precedent.  

  ---

  #### **Round 3: Newcomers (Bare Regularity to Norm)**  
  **Objective:** Observe how insiders enforce a regularity against newcomers.  
  **Setup:** Bring the 4 "temporary observers" (newcomers) into the room. Give them card sets. Rearrange chairs so insiders and newcomers are mixed.  
  **Instructions to Students:**  
  > "This is **Round 3**. We have **new players** joining. Rules are the same as Round 2: Hold up **ONE** card (Red, Blue, or Green).  
  > - **Payoff Rules (same as Round 2):**  
  >   - **Red/Blue:** 1 coin each if 10+ coordination.  
  >   - **Green:** 3 coins each if 10+ coordination.  
  >   - **No coordination:** 0 coins.  
  > - **New Rule:** After choices, we’ll have a **1-minute open discussion** before revealing results. Talk to each other!  
  > - You have 10 seconds to choose. Ready? **Choose!**"  

  **Facilitator Actions:**  
  1. After choices (but before revealing counts), start the 1-minute discussion. **Observe and note:**  
     - Insiders urging newcomers to choose the Round 1 color (e.g., "Pick Red!"), correcting deviations, or showing frustration.  
     - Newcomers asking questions or resisting.  
  2. After the discussion, reveal counts and record:  
     ```  
     ROUND 3  
     Red: [Number] | Blue: [Number] | Green: [Number]  
     Outcome: [Coordination?] → Rewards: [Specify]  
     ```  
  3. Distribute rewards.  

  **Expected Dynamics:**  
  - Insiders pressure newcomers to conform to the Round 1 regularity (e.g., Red) even though Green is objectively better. Newcomers may resist or comply. Group coordination often fails due to tension.  

  ---

  ### **Debrief: Mapping to Lewis’s Concepts**  
  **Facilitator Note:** Now introduce Lewis and terminology. Use whiteboard notes to connect game moments to theory.  

  #### **1. Round 1: Arbitrary Convention Emergence**  
  - **Group Discussion:** *"In Round 1, how did you decide? Why did [color] win?"*  
  - **Link to Lewis:**  
    > "You faced a recurring situation (coordination) with two equally good solutions (Red/Blue). The winning color was **arbitrary**—no inherent superiority. Yet, once a critical mass chose it, everyone **preferred to conform** because coordination meant rewards. This is Lewis’s **convention**:  
    > - A regularity (e.g., everyone choosing Red).  
    > - Everyone conforms because they expect others to conform.  
    > - An alternative (Blue) would have worked equally well."  
  - **Whiteboard Notes:**  
    ```  
    LEWIS'S CONVENTION:  
    1. Regularity (e.g., Red in Round 1).  
    2. Arbitrary: Blue was equally good.  
    3. Mutual preference: "I prefer Red if others do."  
    ```  

  #### **2. Round 2: Sticky Convention vs. Improvement**  
  - **Group Discussion:** *"In Round 2, Green offered more rewards. Why didn’t you switch? How much better would Green need to be to risk it?"*  
  - **Link to Lewis:**  
    > "Even with a better option (Green), the **precedent** of Round 1 created inertia. Switching risked miscoordination (losing all rewards). Lewis says conventions persist because the **cost of deviation** is high—even when alternatives are superior. Dislodging a convention requires not just improvement, but **confidence that others will switch too**."  
  - **Whiteboard Notes:**  
    ```  
    STICKINESS OF CONVENTIONS:  
    - Improvement (Green) ≠ automatic change.  
    - Precedent > Efficiency without certainty.  
    ```  

  #### **3. Round 3: Convention to Sanction-Backed Norm**  
  - **Group Discussion:** *"In Round 3, how did insiders treat newcomers? Did you feel newcomers *should* pick the old color? Why?"*  
  - **Link to Lewis:**  
    > "When newcomers lacked shared history, the regularity (e.g., Red) became something insiders felt **ought to be followed**. You **corrected, taught, or pressured** them—turning a convention into a **norm**. Lewis distinguishes:  
    > - **Convention:** Mutual expectation (e.g., "We do Red").  
    > - **Sanction-backed norm:** Enforcement (e.g., "You *must* do Red").  
    > This is how arbitrary regularities harden into social norms—through teaching/punishment of outsiders."  
  - **Whiteboard Notes:**  
    ```  
    CONVENTION vs. NORM:  
    - Convention: "We do Red because others do."  
    - Norm: "You must do Red—it’s wrong not to!"  
    ```  

  ---

  ### **Predictable Issues & Mitigation**  
  1. **Round 1 Coordination Failure:**  
     - **Issue:** Group splits (e.g., 7-7), so no one gets rewards.  
     - **Mitigation:** Re-run Round 1 with 5 seconds to choose (inducing snap decisions). Emphasize: *"This shows coordination isn’t guaranteed—it needs salience or precedent."*  

  2. **Round 2 Switching to Green:**  
     - **Issue:** Group coordinates on Green (if rewards are enticing).  
     - **Mitigation:** Highlight this in debrief: *"Some groups switch if they trust others will too. But in real life, trust is rarer due to larger groups/history."*  

  3. **Round 3 Newcomer Resistance:**  
     - **Issue:** Newcomers ignore insiders and choose Green.  
     - **Mitigation:** Use this! *"This mirrors real conflict—e.g., younger generations rejecting traditions. Norms require buy-in."*  

  4. **Artificiality of Game:**  
     - **Issue:** Students game the system (e.g., colluding).  
     - **Mitigation:** Enforce silence in Rounds 1–2. If needed, remind: *"This simulates unplanned real-world interactions."*  

  ---

  ### **What the Game Cannot Replicate**  
  **Facilitator Note:** After debrief, clarify limitations:  
  > "This game simplifies reality. Real conventions:  
  > - Emerge **historically** (over years, not minutes).  
  > - Involve **unplanned, decentralized** actions (not a facilitator).  
  > - Are embedded in **culture/identity** (not just rewards).  
  > - **Sanctions** (e.g., shaming) are subtler and more powerful.  
  >  
  > Lewis’s model is a starting point. Next, we’ll read how he explains this in depth."  

  **Transition:** Assign Lewis’s *Convention* (Ch. 1) for the next session, focusing on how the game illustrates his conditions.  

  ---
  This activity ensures students experience convention formation viscerally. The three rounds create a narrative arc (emergence → stickiness → enforcement), priming them for theoretical analysis. Total time: 20 mins setup/Rounds, 30 mins debrief, 10 mins buffer.
