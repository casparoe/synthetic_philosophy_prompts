  For the systemic layer, I'll have Blake pivot to sweatshop labor—something teens would realistically debate. The key is showing how benefiting from exploitation complicates blame. Avery's "no ethical consumption" counter is perfect because it pushes Blake to defend why systemic participation ≠ absolution. 

