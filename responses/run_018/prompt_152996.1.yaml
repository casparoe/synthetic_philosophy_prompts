answer: |-
  Your diagnosis is profoundly correct and captures the core philosophical impasse. The stalemate stems not from empirical disputes about timelines or measurable outcomes, but from **irreconcilable first-order premises about justice, reciprocity, and the moral significance of political membership**. Here’s a breakdown using the concepts you specified:

  ### Core Conflict: Membership as Moral Accident vs. Cooperative Achievement
  1. **Liberal Egalitarian Camp (Open Borders):**  
     - **Membership:** Morally arbitrary; a contingent fact of birth. National boundaries lack intrinsic moral weight.  
     - **Reciprocity:** *Universalist* – obligations arise from shared humanity or basic needs. Justice is owed to individuals regardless of affiliation.  
     - **Bounds of Justice:** Cosmopolitan. "Integration" is a *technical problem* (e.g., language training, anti-discrimination laws). Solidarity is engineered via institutions.  
     - **Justice Trigger:** Presence within territory → immediate claim to distributive rights.

  2. **Solidaristic Camp (Welfare-State Constraints):**  
     - **Membership:** A relational good built through shared history, culture, and mutual sacrifice. Creates *special obligations*.  
     - **Reciprocity:** *Associative* – obligations presuppose a pre-existing scheme of cooperation and trust. "Free-riding" destabilizes the system.  
     - **Bounds of Justice:** Bounded by political community. "Integration" means *social incorporation* into reciprocal relations, not just economic participation.  
     - **Justice Trigger:** Full inclusion as a recognized member → entitlement to redistribution.

  ### Nature of the Disagreement: **Substantive & Conceptual, Masquerading as Empirical**
  - **"Integration" as a Semantic Chameleon:**  
    For the first camp, it means **functional assimilation** (labor market participation, tax compliance).  
    For the second, it means **normative assimilation** (adopting shared civic identity, mutual recognition).  
    *Example:* A refugee working and paying taxes is "integrated" for Camp 1 but not for Camp 2 if perceived as lacking loyalty to the community’s norms.  

  - **Temporal Scales & Evidence Standards:**  
    Camp 1 views short-to-medium-term fiscal studies as irrelevant – justice is immediate.  
    Camp 2 demands intergenerational evidence of social cohesion – justice is conditional on stability.  
    *Result:* New data is dismissed by both: Camp 1 sees solidarity constraints as unjust exclusion; Camp 2 sees open borders as ignoring relational prerequisites.  

  - **Two Questions Under One Heading:**  
    - **Q1 (Moral):** Do individuals have a right to cross borders? (Camp 1: Yes, as a basic liberty)  
    - **Q2 (Institutional):** Can a specific scheme of distributive justice survive unbounded membership? (Camp 2: No, without prior solidarity)  
    *Conflation:* Camp 1 answers Q1 and assumes Q2 is solvable technically. Camp 2 answers Q2 and sees Q1 as subordinate to it.  

  ### Can the Debate Move? Three Proposals Evaluated
  1. **Distinguishing Resource vs. Solidarity Constraints:**  
     - *Potential:* Useful for clarifying that Camp 2’s concern isn’t just fiscal capacity but *willingness to redistribute*.  
     - *Limitation:* Camp 1 rejects "solidarity constraints" as morally illegitimate (e.g., "Why should nationality determine worth?"). Camp 2 sees solidarity as non-negotiable.  

  2. **Membership Goods as Non-Excludable but Rivalrous:**  
     - *Insight:* Formalizes the problem (e.g., trust, civic identity). More users dilute the good unless cohesion is maintained.  
     - *Impact:* Could force Camp 1 to acknowledge trade-offs but may entrench Camp 2’s position. Doesn’t resolve whether rivalrousness justifies exclusion.  

  3. **Reframed Empirical Question:**  
     - *Proposal:* Shift from "Do immigrants *currently* strain welfare?" to "Under what *institutional/cultural conditions* does high immigration correlate with *stable* solidarity?"  
     - *Challenge:* Camp 1 dismisses the premise (solidarity isn’t required); Camp 2 demands unrealistic evidence horizons.  

  ### Why Permanent Stalemate is Likely (But Not Inevitable)
  - **Moral Incommensurability:** The camps prioritize fundamentally irreconcilable values:  
    - *Camp 1:* Moral equality across borders (cosmopolitan justice).  
    - *Camp 2:* Preservation of associative obligations (communitarian stability).  
    No empirical finding can bridge this gap.  

  - **Immunization Strategies:**  
    Camp 1 interprets social-trust declines as proof of *exclusionary attitudes* (requiring more anti-bias efforts).  
    Camp 2 interprets the same data as proof of *overburdened solidarity* (requiring stricter borders).  

  ### The Only Path Forward: **Disaggregating the Questions**
  The debate *might* progress if both sides explicitly concede:
  - Camp 1 accepts that **stable redistribution requires bounded membership** (not necessarily national, but *some* bounded cooperative unit).  
  - Camp 2 accepts that **birthright membership is arbitrary** and must be justifiable to outsiders.  

  This could shift the focus to **designing institutions that satisfy both constraints**:  
  - **Tiered Membership:** Differentiated rights (e.g., residency → citizenship) with integration pathways.  
  - **Supranational Redistribution:** Unlinking welfare from the nation-state (e.g., global taxes).  
  - **Civic Integration Experiments:** Testing if specific policies (deliberative forums, shared service requirements) can accelerate reciprocal solidarity.  

  Absent this concession, the debate remains deadlocked by **competing meta-ethics**: one seeing justice as *unconditional*, the other as *relational*. Your hypothesis brilliantly identifies that the shared vocabulary obscures this foundational rift – and until it’s confronted directly, empirical studies will remain rhetorical ammunition, not resolution. The stalemate persists because both sides are answering different moral questions while speaking the same empirical language.
