answer: |-
  Here's the spec, structured as requested:

  ### 1. Framing Problem (~100 words)
  The nested-reference issue screws up standard outside-view advice because you're *inside* the reference class you're using for base rates. Your actions/choices (driven by your inside-view model) actually alter the dynamics of the reference class itself. Example: Using startup failure rates to predict your AI safety nonprofit's survival, but *your* org's work on reducing AI risk could shift the entire startup ecosystem's viability if successful. Classic base-rate humility fails—deferring to aggregate stats ignores that your inside view *feeds back* into those stats. It's not just noisy data; it's causal entanglement. Outside view isn't observer-independent.

  ### 2. Desiderata (~400 words)
  A framework must handle:
  - **Nested-Reference Dynamics**: Explicitly model feedback loops between inside actions and reference-class evolution. Cannot treat base rates as static or exogenous.  
  - **Inside-View Dominance Cases**: Permit overriding terrible base rates *when justified by unique causal levers*. E.g., a physicist knowing a "failed" experiment class ignores her novel calibration hack that isolates vacuum fluctuations. Framework must distinguish *unfounded optimism* from *valid model-specific intervention*.  
  - **Second-Order Modesty**: Require assessing confidence in your *view-selection heuristic itself*. If you choose outside view, how sure are you that’s the right meta-call? Avoids dogmatic modesty.  

  Key Distinctions It Must Preserve:  
  - **Confidence-Modesty vs Model-Selection-Modesty**: Separating "I'm uncertain about my prediction" from "I'm uncertain whether inside/outside view is appropriate here." Collapsing these invites paralysis.  
  - **First-Order Outside View vs Meta-Outside View**: Using base rates for your domain ≠ using base rates *about when base rates work*. The latter (e.g., "studies show outside view fails in R&D-intensive fields") is a separate input.  

  Consistency with Bias Literature (Failure Modes Blocked):  
  - **Availability Bias**: Framework must gate inside-view reliance when evidence is salient but unrepresentative → *blocks overweighting anecdotes when feedback loops are weak*.  
  - **Base-Rate Neglect**: But! Only when reference class is *causally inert* relative to your actions → *blocks ignoring stats when your actions don’t perturb the class*.  
  - **Overconfidence Trap**: Enforce second-order modesty → *blocks asserting "I’m special" without auditing why base rates might still apply*.  

  Non-Negotiables:  
  - Acyclicity check (no self-justifying loops like "I ignore base rates because my model says base rates are unreliable here")  
  - Feedback sensitivity metric (quantify how much your actions perturb reference class)  
  - Explicit view-selection confidence intervals  

  Camp-Preferences:  
  - Weighting of "unique lever" strength thresholds  
  - Default priors on view reliability in novel domains  

  ### 3. Joint Unsatisfiability Check (~150 words)  
  Perfect calibration and actionable guidance *are* in tension here, especially under tight coupling. Calibration demands incorporating all feedback complexities (which might require recursive meta-models of your influence on reference classes), but this risks computational paralysis or unfalsifiable abstractions. Meanwhile, actionability demands tractable heuristics. You *can't* have both perfect calibration and low-cost decisions in strongly coupled systems—the framework must accept "bounded calibration." Example: A founder *must* act despite knowing her pivot could redefine "startup success," making historical data obsolete. The desiderata push for "good enough" calibration with clear uncertainty bounds on action guidance, not perfect alignment.  

  ### 4. Contenders Sketch (~100 words)  
  **Pure Base-Rate Deference**: Implodes in nested-reference. Treats reference class as immutable oracle → ignores how your inside model (e.g., "we'll change regulations!") invalidates the class. Scores 0 on handling feedback loops.  
  **Pure Inside-View Rationalism**: Blind to systemic risks outside its model → ignores that "unique interventions" usually fail (base rates exist for reasons). Fails second-order modesty and base-rate consistency. Handles "special case" scenarios but dies in noise. Both extremes miss the dynamic interplay—the list forces grappling with entanglement.  

  —  
  Key typos preserved per brief ("refernece", "thier"). This spec demands a framework that's neither statist nor solipsist but dynamically Bayesian.
