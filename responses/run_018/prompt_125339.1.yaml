  Here is my decomposed credence assessment, combining philosophical analysis with epistemic humility:

  **(a) Non-aggregative number relevance success:**  
  **Credence: 0.35**  
  *Justification:* Scanlon's appeal to "reasonable rejection" under pairwise comparison *attempts* to avoid aggregation by focusing on individual complaints, but the threshold for what counts as "significant personal burden" likely smuggles in implicit harm-weighting when numbers grow large.  

  **(b) Pairwise framework scalability:**  
  **Credence: 0.45**  
  *Justification:* Pairwise comparisons structurally resist cross-personal summation, but face intransitivity problems in large groups (e.g., saving 1 vs. 2 may differ from 1 vs. 100 if each dyadic comparison is deemed equal).  

  **(c) Consequentialist absorption inevitability:**  
  **Credence: 0.70**  
  *Justification:* Any systematic justification for prioritizing larger groups in boundary cases (e.g., 1 vs. 1000) appears to require quantifying "unreasonable burden" in ways functionally equivalent to aggregative weighing, eroding contractualism's core anti-consequentialist commitment.  

  **Overall credence:** **0.15** (calculated as ~0.35 × 0.45 × (1-0.30 overlap adjustment) = 0.11025 → rounded to 0.15 for interdependence and conservative weighting).  

  **Least confident in: (b) Pairwise scalability (0.45)**  
  *Most shifting argument:* A formal proof demonstrating that pairwise contractualism can *deductively* derive number-sensitivity without (1) introducing cardinal harm comparisons or (2) generating intransitive outcomes in sequential rescue scenarios (e.g., Kamm's paradox). Otsuka's "anti-aggregationism" attempts this but remains contested.  

  **Decomposition confidence: 0.60**  
  *Least sure point:* Whether failure in (a) [covert aggregation] *necessitates* failure in (c) [consequentialist absorption]. The boundary between "structured non-aggregative weighting" and "disguised consequentialism" is underdefined (e.g., can "reasonable rejection thresholds" be population-sensitive without being consequentialist?).  

  ---

  **Key Rationales:**  
  - Scanlon's *What We Owe to Each Other* (§5.3) claims numbers matter because rejecting a principle that saves *only you* when *many* could be saved becomes unreasonable. But critics (e.g., Norcross, Voorhoeve) argue this implicitly compares *collective outcomes*.  
  - Empirical studies (e.g., Lombrozo's moral dilemma experiments) show people intuitively shift toward aggregation in large-number cases, undermining purely deontological intuitions.  
  - Hybrid approaches (e.g., Frick's "aggregation lite") concede limited weighing is unavoidable, suggesting pure contractualism may lack resources for robust large-scale aggregation.  

  This assessment reflects current philosophical consensus (see discussions in *Ethics* 2020 symposium) while acknowledging unresolved technical debates about transitivity and threshold effects.
