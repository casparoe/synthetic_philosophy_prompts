  The audience's reports of enjoyment might stem from meta-emotions—pride in understanding, or awe at the portrayal of tragedy. Or pragmatic language use where "enjoyment" means appreciation, not pleasure. The student should argue that melancholic attention allows for such meta-responses without converting the core affect.

