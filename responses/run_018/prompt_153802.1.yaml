answer: |-
  Here’s a structured teaching plan for your ninety-minute session, designed to build conceptual dependencies while targeting key misconceptions. British English conventions are followed throughout.

  ---

  **Teaching Plan: Unpacking Dennett’s "Intuition Pump"**  
  **Target Audience:** Rationalist-adjacent non-specialists  
  **Core Example:** **The Forgotten Password Scenario**  

  ### Dependency-Ordered Sequence (75 mins total)
  1. **Anchor in Familiar Territory: Thought Experiments (10 mins)**  
     *Why first?* Establish common ground. Contrast *thought experiments* (e.g., Einstein’s elevator) with *arguments*.  
     *Key point:* Thought experiments use hypotheticals to test principles; they often have "correct" solutions.  
     *Misconception intercepted:* Conflating all hypotheticals with rigorous proofs.  

  2. **Introduce the "Pump" Metaphor (15 mins)**  
     *Why now?* Must distinguish *persuasive narratives* from logical tests.  
     *Mechanism:* Frame pumps as "cognitive tools that *engineer* intuitions by controlling what you attend to".  
     *Analogy:* A literal pump moves fluid by creating pressure differentials; an intuition pump moves your judgment by creating *attention differentials*.  
     *Misconception intercepted:* Assuming persuasive force implies logical validity.  

  3. **Deploy the Core Example: Forgotten Password Scenario (25 mins)**  
     ```markdown
     **The Scenario:**  
     Alex forgets a password. An IT admin offers to "restore" access by gradually replacing Alex's brain cells (while they sleep) with synthetic neurons that perfectly mimic function. After each replacement session, Alex is asked: "Do you remember your password now?"  
     - Phase 1 (10% replaced): "Not yet, but I might recall!"  
     - Phase 2 (50% replaced): "I feel like it’s on the tip of my tongue..."  
     - Phase 3 (100% replaced): "Yes! It’s 'Phoenix7'!"  
     All reports are mediated by the admin, who records responses.  
     ```  
     *Why this example?*  
     - Embeds the **gradual replacement** of internal states (biological → synthetic) with **functional equivalence**.  
     - **External interpreter** (admin) controls all inputs/outputs, masking ontological shifts.  
     - **Epistemic/Metaphysical Slide:** The admin’s reports ("Alex feels...") blur:  
       - *Epistemic possibility:* "It’s conceivable Alex recalls it."  
       - *Metaphysical possibility:* "This is still Alex remembering."  
     *Crucial lack:* No clean resolution. Is the final entity "Alex"? Does "remembering" require original biology?  

  4. **Group Analysis: Reverse-Engineering the Pump (20 mins)**  
     *Guided questions:*  
     - "Where did you feel intuitive certainty (or doubt) *peak*? What prompted it?"  
     - "What did the admin’s role *stop you* from asking about?" (e.g., consciousness, identity over time)  
     - "Which details felt irrelevant but might be load-bearing?" (e.g., sleep, "tip of the tongue" phrasing)  
     *Misconceptions intercepted:*  
     - **Feeling convinced as evidence:** Intercept when participants say "Phase 3 *proves* it’s not real memory!" → Highlight emotional trajectory ≠ proof.  
     - **Hidden premise as solution-killer:** When someone notes "It assumes functionalism!" → Stress: *Revealing* the premise exposes the pump’s lever but doesn’t "solve" it—it shows *why* it felt persuasive.  

  5. **Meta-Debrief: The Machinery Exposed (5 mins)**  
     *Key insight:* Pumps persuade by *directing attention* (e.g., toward functional continuity, away from ontology), not by adding premises.  
     *Dennett’s razor:* "A mistake made by a good pump is like a mistake made by a good teacher—it’s how you learn the territory."  

  ---

  ### Check-for-Understanding (5 mins)  
  **Question:** *"If a participant said, 'The password scenario fails because it ignores quantum effects in neurons,' why might Dennett call this a misunderstanding of how pumps work?"*  
  **Target insight:** Correct answers will note that critiquing *technical accuracy* misses the point—the pump’s power lies in how it *structures attention* (e.g., on functional reports), not in empirical realism.  

  ---

  ### Explicit Omissions & Credibility Management  
  **Omit:**  
  - Formal modal semantics (epistemic/metaphysical modality treated intuitively).  
  - Dennett’s taxonomy of pump varieties (e.g., "threat pumps").  
  - Historical attributions (e.g., debates with Searle/Chalmers).  

  **Acknowledge:**  
  *"We’re bracketing technical philosophy to focus on the cognitive machinery. This is a *first-pass* at pumps—like learning gears before building a watch. For deeper dives, I’ll suggest resources post-session."*  

  ---

  **Why This Works**  
  The password scenario forces engagement with the epistemic/metaphysical slide through mundane stakes (no trolleys/minds), lacks resolution to prevent "solving," and makes the admin’s mediation central. By sequencing from known concepts to pump deconstruction, you scaffold the meta-cognitive shift needed to spot attention engineering.
