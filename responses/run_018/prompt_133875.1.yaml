  The argument is that in pain asymbolia, the "sensor" and "alarm tone" (sensory aspect) work fine, but the "threat evaluation" (affective component) fails, so the person feels the pain but doesn't find it unpleasant. This is used to support the idea that pain's badness isn't intrinsic but added on.

  But this analogy has several fractures. First, it implies that the affective component is a separate cognitive judgment layered onto a neutral sensation, rather than being woven into the experience itself. This treats the unpleasantness as optional commentary rather than fundamental to what pain feels like.

