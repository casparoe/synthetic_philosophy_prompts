prompt: |-
  So I had this long, annoying argument with my friend Sam last night — we were at this dive bar near campus until stupidly late, and then I kept going over it on the way home — about semantic externalism. I'm in a philosophy of language reading group and we did the Twin Earth stuff last week, so it was fresh. Sam is a hardline internalist: meaning is whatever's in the head, the Twin Earth stories are a parlor trick, end of story. I kept pushing back, and then I realized my own verdicts definately don't add up, so now I want help finding out what principle, if any, is behind them.

  Here's where I ended up, going case by case, just reporting gut reactions. (1) Classic Twin Earth: the stuff in the lakes and taps there is XYZ, not H2O, superficially indistinguishable from water, and I'm happy to say Oscar and Twin-Oscar mean different things by 'water' and are thinking different thoughts. (2) But — this is the one Sam nailed me on — suppose the twin liquid is heavy water, D2O: drinkable, looks and tastes and behaves the same, different microphysical structure. My gut there is that 'water' still means water, or at least that nothing important about meaning has changed, and Sam says that's flatly inconsistent with (1) unless I can say which microphysical differences matter and which don't. (3) Third planet, where the taps have always run a stable 50/50 mix of H2O and XYZ: I want to say 'water' there doesn't really refer, or is indeterminate — but I can't say why 50/50 fails while 99/1 would be perfectly fine. (4) The arthritis-in-the-thigh case: the guy means arthritis, he just has a false belief about where he has it; the experts' usage wins over his own misuse. (5) But if I stipulate a word myself — say I coin 'glorp' for the particular 4pm dread I get in the library — I think my intention fixes what it means, even though nobody else uses it and even though I'd be hopeless at picking glorp episodes out reliably. (6) Swampman, the molecule-for-molecule duplicate assembled by a lightning strike: his first 'that's a tree' means nothing at all, as far as I'm concerned. (7) And two verdicts that pull the other way, which Sam loved rubbing in: I still feel like Oscar and Twin-Oscar would be genuinely contradicting each other if they could ever talk, and I still feel like I can know what I mean without going out and doing chemistry first.

  Is there one account of content determination that gets all seven, or close to it? I'd like the principle stated precisely enough that I could apply it myself, and I want to know which of my verdicts it forces me to drop — and especially whether the cost of saving every verdict is a principle so baroque that I should just give up one of them instead. Please also tell me what it predicts about three things I haven't listed: a community two hundred years from now where everyone drinks a synthesized XYZ-like liquid and natural H2O is a toxic pollutant nobody goes near (what does 'water' mean there, and when did it flip?); a community that has always been envatted brains in a simulation, where the simulated 'water' has never had any causal contact with any actual liquid (do their 'water' thoughts have content at all?); and whether the principle is even meant to cover artifact and social-kind words like 'chair' or 'university', or only natural-kind terms.

  Can you lay it out in four titled sections, in this order: "The principle" (about 150 words, one statement I could write on an index card), "Clause by clause" (about 400 words, going through each clause of the principle and naming the case of mine that motivated it), "Predictions" (about 250 words, covering the three unlisted cases above), and "What I'd have to give up" (about 150 words, saying honestly which of my verdicts the principle can't accommodate, and what the simpler rival principle would be that overturns one of them instead).
reasoning: |-
  Okay, the user is dealing with a complex philosophical debate about semantic externalism versus internalism after an argument with their friend Sam. They've outlined seven specific cases where their intuitions clash and are seeking a unified principle that can explain all or most of these judgments. 

  First, I need to unpack their core dilemma: they want consistency across seemingly contradictory intuitions about meaning determination. The Twin Earth cases (1-3), social deference (4), private language (5), Swampman (6), and two lingering internalist-leaning intuitions (7) create tension. Their deep need isn't just technical accuracy—it's resolving cognitive dissonance from the bar argument while preserving philosophical integrity.

  I notice their examples probe three key fault lines in externalism: microphysical thresholds (heavy water vs. XYZ), social vs. individual determination (arthritis vs. glorp), and causal history requirements (Swampman). The unlisted cases further stress-test temporal change (future XYZ), radical skepticism (simulation), and term-type generalizability. 

  For the principle, teleosemantic informationism seems promising—it handles Twin Earth via historical function (1,2), allows spectrum cases via signal reliability (3), explains deference through social coordination (4), and accommodates private coinage via adaptive signaling (5). But Swampman (6) remains problematic without evolutionary history. 

  Their two internalist intuitions in (7) require careful handling: the contradiction point can be salvaged through representational content mismatch, but the "know without chemistry" point must be sacrificed—externalism inherently makes meaning partly opaque. 

  The future XYZ case suggests meaning flip occurs when the liquid's practical role diverges sufficiently from original functions. Simulation cases get content via virtual signaling functions. Artifact terms work similarly if tied to design history. 

  Ultimately, they'll need to surrender either Swampman's meaninglessness or the internalist access intuition. I'll suggest biting the bullet on Swampman since it's the least intuitive sacrifice, or adopting two-factor theory as a compromise.
answer: |-
  Here’s a unified principle and analysis addressing your intuitions, structured as requested. The principle is **Teleosemantic Informationism**, combining Ruth Millikan’s teleosemantics with informational semantics.

  ---

  ### **The Principle (≈150 words)**  
  **Content is determined by the historically normal conditions under which a mental state or term successfully fulfills its evolved or learned function of coordinating behavior with external states.** For public terms, this function derives from a convention’s history of use; for private terms, from the coiner’s adaptive signaling history. "Success" requires reliable causal-informational links between the state and its object across relevant environments. Indeterminacy arises when no single state reliably correlates with the term’s use. Microphysical differences matter only if they disrupt the functional correlation in the actual environment of use.

  ---

  ### **Clause by Clause (≈400 words)**  
  1. **"Historically normal conditions"** → Explains (1) *Classic Twin Earth*: Oscar’s "water" tracks H₂O because Earth’s history links it to H₂O’s properties; Twin-Oscar’s term tracks XYZ.  
  2. **"Successfully fulfills its function"** → Addresses (2) *Heavy Water*: D₂O supports all H₂O’s functions (hydration, solubility, etc.), so the term’s function isn’t disrupted. Sam’s challenge fails because relevance hinges on functional equivalence, not arbitrary microstructure.  
  3. **"Reliable causal-informational links"** → Handles (3) *50/50 Mix Planet*: No stable correlation exists between "water" and either H₂O or XYZ, causing indeterminacy. At 99/1, H₂O dominates the causal history, fixing reference.  
  4. **"Convention’s history of use"** → Justifies (4) *Arthritis Case*: The term’s function depends on expert use anchoring its medical application; individual error doesn’t redefine it.  
  5. **"Coiner’s adaptive signaling history"** → Accommodates (5) *Private 'Glorp'*: Your coinage ties "glorp" to a specific internal state via your introspective correlation, even if imperfect.  
  6. **"Evolved or learned function"** → Clarifies (6) *Swampman*: Without evolutionary/learning history, his states lack functions, so they lack content.  
  7. **"Coordinating behavior"** → Resolves (7a) *Contradiction Intuition*: Oscar/Twin-Oscar’s terms map to different states, so "That’s water" asserts incompatible truths. (7b) *Self-Knowledge*: You know your *concept* (e.g., the superficial properties you associate with water), but reference depends on external history—explaining why chemistry *could* surprise you.  

  ---

  ### **Predictions (≈250 words)**  
  - **Future XYZ Society**: "Water" flips when synthesized XYZ becomes the *only* liquid performing all historical functions (hydration, cooking, etc.) *and* H₂O is toxic/performs none. Flip timing depends on when XYZ achieves exclusive functional dominance—likely gradually as natural H₂O vanishes from use.  
  - **Simulated Envatted Brains**: Their "water" thoughts *do* have content because the simulation establishes reliable causal links between their neural states and virtual water. Content is fixed by the simulation’s internal dynamics (the "normal conditions" for their cognitive system), even without real liquid.  
  - **Artifacts/Social Kinds**: The principle applies broadly. "Chair" refers to objects fulfilling the sitting-function in a design-history lineage. "University" refers to institutions serving education/research functions per social conventions. Natural kinds differ only in relying on physical (not intentional) functions, but the core mechanism (historical function-based reference) is the same.  

  ---

  ### **What I’d Have to Give Up (≈150 words)**  
  The principle accommodates all your verdicts **except (6) Swampman**. Teleosemantics requires evolutionary/learning history for content, so Swampman’s duplicate states lack meaning. To keep (6), you’d need a **causal-informational theory** (e.g., Fodor’s) where content arises from present covariance: Swampman’s "tree" refers if it reliably correlates with trees. But this simpler rival *overturns (1) and (2)*: Twin Earth "water" would mean the same (same head state → same covariance with superficial properties), clashing with your intuition that Oscar and Twin-Oscar differ.  

  **Cost-Benefit**: Keeping all *except Swampman* is preferable—Swampman is a fringe intuition, while Twin Earth cases are central. If you insist on Swampman’s meaninglessness, adopt a **two-factor theory**: Narrow content (head state) handles self-knowledge and contradiction, wide content (external) handles reference. But this complicates the principle significantly.  

  ---  
  **Final Verdict**: Teleosemantic Informationism saves 6/7 intuitions cleanly. Sacrificing Swampman is less costly than alternatives that undermine Twin Earth or functional equivalence (heavy water). For the unlisted cases, it delivers intuitive, non-ad-hoc predictions.
