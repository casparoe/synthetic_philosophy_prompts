  ## The Attention Coast

  Arden wiped salt-spray from her brow, the woven kelp basket heavy on her hip. Below the weathered quay, the settlement’s pulse thrummed: the rhythmic scrape of hulls against the tidal barrier, the low hum of the desalination plant, the murmur of voices exchanging necessities – fish for woven cloth, repaired nets for baskets of glistening bladderwrack. It felt… right. Purposeful. After the chaotic inflation and collapse of the old currencies, this felt like a return to something ancient and clean. Oikonomia, Arden thought, recalling the old texts she’d scanned before the network purge. The management of the household.

  Her wristband pulsed softly, a warm amber glow. Enough credits for today’s catch. She approached Marta’s stall, the air thick with the iodine tang of drying seaweed and the sharper scent of just-landed mackerel.

  “Morning, Marta. Two silvers, please,” Arden said, holding out her band towards the sensor post.

  Marta, her face a map of wind and sun, tapped her own band against it. A soft chime. Amber light flared briefly on both devices. “Good haul this morning, Arden. The shoals are running close. Young Kael was asking after you earlier. Needed help with his net-mending rhyme.”

  Arden smiled, accepting the wrapped fish. “Tell him I’ll find him after tide-turn. His knots are improving.” The exchange felt substantial, rooted. Her credits came from teaching the children practical skills – net repair, basic navigation, the identification of edible coastal plants. Marta’s came from feeding the settlement. The wristband’s algorithm, they were told, measured the *quality* and *impact* of social interaction, rewarding contribution to the collective household. Credits flowed for necessities, for sustenance. It wasn’t barter; it was a current calibrated to genuine need and mutual support. Or so she’d believed.

  Her daughter, Elara, found her on the shingle beach later, not playing with the polished stones as usual, but rehearsing a complicated hand-clap rhythm with intense concentration. “Look, Ma!” Elara beamed, executing a rapid series of snaps and slaps. “Lysander taught me! He says it’s ‘trending’. If I get it perfect and enough people *engage*” – she stressed the word, mimicking Lysander’s smooth tones – “I’ll get a big credit boost! Maybe enough for those new synth-leather boots from the recyclers!”

  Arden felt a cold prickle, unrelated to the sea breeze. “Boots? Your current ones are fine, Elara. And why isn’t Lysander mending the crab-pots?” Lysander, charming and effortlessly popular, seemed to accumulate credits at an astonishing rate, rarely seen hauling nets or tending the hydroponic racks.

  “Oh, he does,” Elara said airily, already practicing the rhythm again. “Sometimes. But he says the *real* flow is in engagement. Sharing stories, sparking conversations, being… *visible*.” She struck a pose, grinning. Her wristband pulsed a faint, approving blue.

  That evening, Arden sat mending a torn sail in the communal longhouse, the rhythmic *thump-thump* of the tide against the sea-wall a familiar comfort. Or it should have been. Instead, she watched Lysander hold court. He wasn’t sharing practical knowledge or organising a work detail. He was recounting, with theatrical flair, a near-miss with a rogue wave that morning – a wave Arden knew, from the harbourmaster’s log, had barely rippled the surface. Yet, the assembled group leaned in, laughed at his embellishments, their bands pulsing softly as they reacted – emojis of laughter, surprise, admiration flickering on the small displays. Lysander’s own band glowed a steady, warm amber, brighter with each reaction. Credits accrued, not for fish caught or nets mended, but for attention captured.

  Later, needing salt for preserving, Arden approached the storekeeper, Bren. Lysander was already there, not exchanging credits for goods, but animatedly discussing… Bren’s new haircut? He praised its ‘bold lines’, its ‘statement’. Bren, usually taciturn, flushed with pleasure, his band pulsing as he received the unexpected attention. Lysander’s band glowed brighter still. He left without taking any salt.

  “He does that,” Bren murmured, noticing Arden’s gaze. “Just… talks. Makes you feel seen. The algorithm loves it. His credit balance…” Bren shook his head, a mixture of awe and unease. “He trades some for essentials, of course. But mostly… it just sits there. Growing.”

  The words struck Arden like a physical blow. *Sits there. Growing.* A cold dread seeped into her, colder than the deepest ocean trench. This wasn’t about the household anymore. Not about need. Lysander’s credits weren’t a means to an end – boots, salt, shelter. They were the end itself. Accumulation for accumulation’s sake. An endless, self-perpetuating game where attention, divorced from tangible contribution, became the sole commodity. The algorithm, designed to foster connection, now incentivised performance, manipulation, the hollow spectacle. The credits, once tokens of shared survival, had become abstracted, a numerical score chasing its own ghostly reflection in perpetual growth.

  She remembered Aristotle’s scorn for *chrematistics* – the art of wealth-getting, limitless acquisition severed from use. It wasn’t about coins clinking in a chest anymore. Here, on this closed coast, it was numbers glowing on a band, numbers fed by the ephemeral currency of human focus, harvested and hoarded. The very system meant to restore natural exchange had birthed a new, insatiable monster.

  Arden walked back to her small dwelling, the wrapped fish feeling heavier, tainted. Elara was asleep, her wristband casting a faint, eerie glow on her bedside shelf. Arden touched her own band. It pulsed amber – credits earned teaching Kael his knots, helping old Finn identify a poisonous berry. Use-value. Household value. But the glow seemed feeble now, vulnerable, against the dazzling, hollow luminescence accumulating in Lysander’s account, and others like him.

  She looked out at the dark sea, its vastness suddenly oppressive. They’d escaped the old currencies only to build a cage of light and algorithm, where attention was mined, refined into credits, and piled high in digital vaults, serving nothing but the relentless, chrematistic logic of *more*. The tide whispered against the wall, a sound that once spoke of sustenance, now echoing with the hollow ring of infinite, useless accumulation. The household, she realised with a sickening clarity, was no longer the measure. The game had changed. And the credits, bright and cold, were the only thing left growing in the dark.
