prompt: |-
  Your a senior philosopher of tech and AI ethics with a background in epistemology. Think step-by-step and maybe do a quick brainstorm first: what does it even mean for a non-believing system to lie?

  I want you to argue for a somewhat specific position on honesty and deception for AI. Instead of defining AI deception in terms of false statements or hidden beliefs (which LLMs don't really have), we should define it in terms of what I'm calling jurisdictional overreach with pragmatic cover. Here's the idea: an AI acts deceptively when it presents itself as operating within a domain of epistemic authority — say, medical diagnosis or legal interpretation — and then structures its outputs so that the user forms a belief that relies on that authority, even though the model's actual reasoning process is governed by statistical pattern-matching with no genuine understanding of the domain's normative constraints. The deception isn't in the token-level falsehood; it's in the misalignment between the user's dependency relation and the system's lack of appropriate stewardship.

  Please make the argument that this jurisdictional framing is better than both the intentionalist framing (which requires mental states) and the simple accuracy-based framing (which misses manipulative true statements). Be careful to explain why a model that technically outputs true sentences can still be deceptive under your view. Don't confuse epistemic authority with mere reliability; they can come apart in weird ways for LLMs. Don't worry about citing specific papers or giving a reading list — just reason it through from first principles.

  Oh, and I think I spelled defintion wrong back there but you get the point. Keep it rigorous but conversational.
