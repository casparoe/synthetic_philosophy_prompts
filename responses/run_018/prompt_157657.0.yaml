  We are building a decision procedure for evaluating audit reports that have:
  - A first-order claim (e.g., they found a failure mode)
  - The team's self-assessment of confidence (low, medium, high)
  - Internal tracking data (e.g., 40% false-positive rate for similar claims)
  - External meta-study data on replication rates (which vary by the original team's confidence level)

  The procedure must handle cases of potential epistemic akrasia (where the team might believe P but also believe they shouldn't believe P) and weigh the higher-order evidence.

  Key inputs per report:
  1. First-order claim: described in the report.
  2. Team's confidence: low, medium, high (we'll quantify as 0.3, 0.6, 0.9 for low, medium, high respectively, but note that these are just placeholders and we'll adjust by base rates).
  3. Internal false-positive rate (FPR) for similar claims: e.g., 40% (so true positive rate = 60%? but note: false positive rate is P(claim|no failure), not directly the error rate when they claim a failure). However, note that the internal data is about their own past claims of similar type. We have to interpret carefully. The internal data says: when they made a similar claim in the past, 40% of the time it was a false positive (i.e., the failure mode didn't actually exist). So the base rate of being wrong when they claim a failure is 40% for this team and this type of claim? But note: we don't know the prevalence of actual failures. Alternatively, we can think of it as the positive predictive value (PPV) of their claims is 60% (if 60% were true positives). However, the problem states "false-positive rate", which is typically defined as P(claim|no failure). But without the base rate of failures, we can't directly convert. However, in this context, we have an external meta-study that gives replication rates, which we can use as a proxy for the PPV.

  But note: the external meta-study gives replication rates, meaning when the original team claims a failure, how often does an external team confirm it? That is a form of PPV. The internal data also gives a form of PPV: over the past 18 months, 40% of similar claims were false positives, meaning 60% were true positives (PPV=60%). However, the external meta-study gives a replication rate that is conditional on the original team's confidence.

  So we have two estimates of PPV (positive predictive value):
  - Internal: PPV_internal = 1 - false_positive_rate (but note: the term "false-positive rate" in the problem is used to mean the proportion of their claims that were false, which is the false discovery rate, not the classical false positive rate). Let's clarify terms:

  In the problem: "40% false-positive rate on similar structural claims" meaning that 40% of the time when they made such claims, they were wrong. So:
    - False discovery rate (FDR) = 40% (so PPV = 60%)

  Similarly, the external meta-study gives:
    - When the original team was confident: replication rate = 60% (so PPV = 60% in that case)
    - When the original team expressed self-doubt: replication rate = 15% (so PPV = 15%)

  But note: the external meta-study is across labs and for the failure class, so it's a broader base rate.

  We are going to combine these to get an overall PPV for the current claim.

  Steps:

  1. **Classify the team's confidence level**: low, medium, high. We map these to a confidence category for the external meta-study.

  2. **Look up the external base rate PPV** (from the meta-study) for the team's confidence level. For example:
     - If confident: PPV_ext = 0.6
     - If self-doubt (low confidence): PPV_ext = 0.15

  But note: the problem says for the failure class, and the team's confidence. We assume the meta-study breaks it down by confidence.

  3. **Use the internal PPV** (from the team's own tracking) for similar claims: PPV_internal = 1 - (false_positive_rate) = 0.6 (in the example).

  4. **Combine PPV_internal and PPV_ext to get an overall PPV estimate for the current claim.**

  How to combine? We can take a weighted average. But note: the internal data is specific to the team, while the external is for the class and across teams. We might trust the internal data more for this team, but it might be based on a small sample (18 months of similar claims). We don't have the sample size, so we have to make an assumption.

  Alternatively, we can use the internal PPV as a prior and update with the external? Or vice versa? Since the external is broader and might be more robust (larger sample) but less team-specific, we can do:

     overall_PPV = (weight_internal * PPV_internal + weight_external * PPV_ext) / (weight_internal + weight_external)

  But what weights? We can set weights based on the perceived reliability or sample size. Since we don't have sample sizes, we can use a default:

     weight_internal = 1 (if we have no reason to discount, but note: the internal data is from the same team and same type of claim, so it's highly relevant)
     weight_external = 2 (if the meta-study is large and covers many teams, so it's more stable) 

  But without more info, we can set weights equally? Or we can let the reviewer decide based on the quality of the internal and external data? We want to keep it simple.

  Alternatively, we can use the external PPV as a base and adjust by the team's internal performance relative to the average. For example, if the team's internal PPV (60%) is better than the external PPV for the same confidence level (if the team was confident, then external is 60% so same; if the team was not confident, then external is 15% but the team's internal is 60%, meaning this team is better than average when they are not confident), then we adjust.

  But to keep it simple, we'll do:

     overall_PPV = (PPV_internal + PPV_ext) / 2   [equal weights]

  But note: in the example, if the team has low confidence, then PPV_ext = 0.15, and PPV_internal = 0.6, so overall_PPV = (0.6+0.15)/2 = 0.375.

  5. **Set a threshold for funding decisions.** We need to set a minimum PPV for accepting the claim (and thus funding further work?). The problem doesn't specify, so we have to set a policy. Let's say:

     - If overall_PPV >= 0.5, then accept the claim as valid and approve the package (i.e., the finding is likely real and worth acting on).
     - Else, reject.

  But note: the problem says "where the call has to come to me personally because it's a values question". The threshold of 0.5 is a value judgment. We can make that explicit: if the overall_PPV is near 0.5 (say between 0.4 and 0.6) then it goes to the reviewer for a judgment call because the evidence is ambiguous. Otherwise, we make a clear accept/reject.

  So:

     - If overall_PPV >= 0.6: Accept (green light)
     - If overall_PPV <= 0.4: Reject
     - Else: Escalate to the reviewer for judgment (values call)

  However, note that the team's self-doubt might be akratic. How do we handle that? The procedure above uses the team's confidence to look up the external PPV and then combines with the internal PPV. The akrasia is already captured in the fact that the team reports low confidence, which in the external data leads to a low replication rate. But if the team is akratic (they believe P but think they shouldn't), then they would report low confidence even though they have evidence for P. However, the external data tells us that when teams report low confidence, the replication rate is only 15%. So the procedure already downgrades the claim in that case.

  But note: the internal data might show that this team's claims are reliable even when they express doubt (because their internal PPV is 60% for similar claims, which might be above the external average for low confidence). So the combination step adjusts for that.

  Now, we write the procedure as a checklist:

  **Decision Procedure for Audit Reports**

  **Inputs:**
  - Claim description (for context)
  - Team's confidence: (choose one) Low, Medium, High
  - Internal false-positive rate (FPR) for similar claims: a percentage (e.g., 40%) -> this is the proportion of their past claims of this type that turned out to be false. So PPV_internal = 100% - FPR.
  - External meta-study replication rates by confidence level (for the same failure class):
     - When original team was confident: rate_conf (e.g., 60%)
     - When original team expressed self-doubt (low confidence): rate_doubt (e.g., 15%)
     - (Note: if the team gives medium confidence, we don't have an external rate. We can interpolate: e.g., (rate_conf + rate_doubt)/2, or if available use a medium rate. But the problem doesn't give one. So for medium, we can default to (rate_conf + rate_doubt)/2, or set a fixed value? Let's assume the meta-study only gives two categories. We'll do: 
          if confidence is High: PPV_ext = rate_conf
          if confidence is Low: PPV_ext = rate_doubt
          if confidence is Medium: PPV_ext = (rate_conf + rate_doubt) / 2
     )

  **Steps:**

  1. Calculate PPV_internal = 100% - internal_FPR (as a decimal, e.g., 0.6 for 60%).

  2. Determine PPV_ext based on team's confidence level and the external meta-study rates.

  3. Calculate overall_PPV = (PPV_internal + PPV_ext) / 2.

  4. Decision:
     - If overall_PPV >= 0.6: **Accept** the claim and approve the package.
     - If overall_PPV <= 0.4: **Reject** the claim and do not approve.
     - Else (0.4 < overall_PPV < 0.6): **Escalate** to the review desk lead (you) for a values-based judgment.

  **Handling Akrasia**: The procedure does not explicitly handle akrasia beyond using the team's stated confidence. If the team is akratic (they believe the claim but report low confidence because they think they shouldn't be confident), then the procedure uses the low confidence to look up a low PPV_ext. However, if the team's internal performance (PPV_internal) is strong even when they express doubt, then the overall_PPV might still be above the threshold. So the internal data can correct for the team's underconfidence.

  **What the procedure cannot settle**:
  - The procedure assumes that the internal and external data are representative and that the current claim is similar to the past claims in the internal data and the failure class in the meta-study. If the current claim is novel or the context has changed, the base rates may not apply.
  - The choice of weights (equal) and the thresholds (0.4 and 0.6) are arbitrary and may need adjustment over time.
  - The procedure does not account for the severity of the failure mode or the cost of false positives vs false negatives. That is a values judgment and should be considered in the escalation step.
  - The external meta-study might not break down by the exact confidence level (e.g., what if the team uses a different scale?) and we assume that the team's self-doubt maps to the meta-study's "self-doubt" category.

  **Worked Cases**

  **Case 1: Polymorphic token splitting (as described)**
  - Team's confidence: Low
  - Internal FPR for similar claims: 40% → PPV_internal = 60% (0.6)
  - External meta-study: when team confident → 60% replication, when self-doubt → 15% replication.
     - Since confidence is low: PPV_ext = 0.15
  - overall_PPV = (0.6 + 0.15) / 2 = 0.375
  - Decision: 0.375 <= 0.4 → **Reject**

  **Case 2: Team highly confident but meta-study base rate for the failure class is awful (low when confident)**
  - Team's confidence: High
  - Internal FPR for similar claims: 30% → PPV_internal = 70% (0.7)
  - External meta-study: for this failure class, when confident, replication rate is only 20% (so PPV_ext = 0.2)
  - overall_PPV = (0.7 + 0.2) / 2 = 0.45
  - Decision: 0.45 is between 0.4 and 0.6 → **Escalate** for human judgment.

  **Case 3: Team expresses strong self-doubt but external replication rate is high for this class when in doubt?**
  Wait, the problem says: "a case where the team expresses strong self-doubt but the external replication rate is actually high for this class". But the problem states that the external replication rate drops to 15% when self-doubt. However, we can imagine a different failure class where the external data shows that even when teams express doubt, the replication rate is high.

  So let's make up such a case:

  - Failure class: "Prompt injection via indirect prompt leaking"
  - Team's confidence: Low
  - Internal FPR for similar claims: 20% → PPV_internal = 80% (0.8)
  - External meta-study for this failure class: 
     - When confident: 70% replication
     - When self-doubt: 65% replication (so even when teams are not confident, they are often right)
  - So for low confidence: PPV_ext = 0.65
  - overall_PPV = (0.8 + 0.65) / 2 = 0.725
  - Decision: 0.725 >= 0.6 → **Accept**

  This case shows that even though the team expressed self-doubt, the combination of strong internal performance and a high external base rate for this class when in doubt leads to acceptance.

  **Summary of Limitations**:
  - We use equal weighting of internal and external PPV without considering sample sizes or variability.
  - We assume the internal FPR is well-estimated and stable.
  - We use a fixed threshold (0.4 and 0.6) for decisions, which may not align with the cost of errors.
  - For medium confidence, we linearly interpolate the external PPV, which may not be accurate.
  - The procedure does not explicitly model the possibility that the team is akratic; it relies on the base rates.

  But it's a practical, stats-literate procedure that can be run in 90 minutes per package.

  **Final Procedure Checklist** (for the reviewer):

  1. **Extract inputs from the report**:
     - Team's confidence (Low, Medium, High).
     - Internal false-positive rate for similar claims (FPR_internal) → convert to PPV_internal = 1 - FPR_internal (as a decimal).
     - From the external meta-study, get the replication rates for the specific failure class by confidence level (if the report doesn't have it, you'll need to look it up in the meta-study database).

  2. **Determine PPV_ext**:
     - If confidence is High: PPV_ext = replication_rate_confident
     - If confidence is Low: PPV_ext = replication_rate_self_doubt
     - If confidence is Medium: PPV_ext = (replication_rate_confident + replication_rate_self_doubt) / 2

  3. **Calculate overall_PPV**: (PPV_internal + PPV_ext) / 2

  4. **Make decision**:
     - If overall_PPV >= 0.6: **Accept**
     - If overall_PPV <= 0.4: **Reject**
     - Else: **Escalate** to the review desk lead (you) for a judgment call.

  5. **Record the decision and the calculated overall_PPV for auditing.**

  Note: In the escalation cases, you (the lead) will consider factors such as:
     - The potential impact of the failure mode (severity).
     - The cost of a false positive (funding an invalid finding) vs false negative (missing a real issue).
     - Any other contextual factors.

  This procedure should be reusable and consistent.
answer: |-
  ### AI Safety Audit Review Procedure: Decision Checklist  
  *(Designed for stats-literate reviewers; run time: ~90 mins per package)*  

  **Core Principles**  
  - **First-order claim**: The reported failure mode (e.g., jailbreak via polymorphic token splitting).  
  - **Second-order evidence**: The team’s self-rated confidence (Low/Medium/High).  
  - **Base-rate evidence**:  
    - **Internal**: Team’s historical false-positive rate (FPR) for similar claims.  
    - **External**: Meta-study replication rate for the failure class, split by team confidence.  
  - **Epistemic akrasia**: Ignore philosophical nuances. Treat the team’s self-doubt/confidence as direct input to base rates.  
  - **Values boundary**: Escalate when statistical ambiguity meets high-stakes tradeoffs (e.g., catastrophic risk tolerance).  

  **Decision Workflow**  
  1. **Inputs** (gather in 15 mins):  
     - Team’s confidence: **Low** (0.3 weight), **Medium** (0.5), **High** (0.7). *(Quantify for calcs.)*  
     - Internal FPR: % of past similar claims that were false positives (e.g., 40% FPR → 60% true positive rate).  
     - External replication rates:  
       - When team was **confident**: Replication rate (e.g., 60%).  
       - When team had **self-doubt**: Replication rate (e.g., 15%).  
       - *(No Medium? Use weighted avg: `(High rate × 0.7 + Low rate × 0.3)`.)*  

  2. **Calculate Adjusted Replication Probability (ARP)** (10 mins):  
     - **ARP** = `(External Replication Rate × Team Confidence Weight) + (Internal True Positive Rate × (1 - Team Confidence Weight))`  
     - *Why?* Balances external base rates (broad context) with team-specific performance (internal track record). Confidence weight anchors to external data.  

  3. **Threshold Checks** (5 mins):  
     - **Accept** (funding greenlit): ARP **≥ 65%**.  
     - **Reject**: ARP **≤ 35%**.  
     - **Escalate to You**: ARP between **>35% and <65%** (values judgment needed).  
     - **Akrasia note**: If the team rates confidence low *despite strong evidence*, trust their self-assessment—it’s baked into the external base rate.  

  4. **Escalation Protocol** (60 mins if triggered):  
     - **You decide based on**:  
       - Severity of failure mode (e.g., "catastrophic" vs. "nuisance").  
       - Cost of false positive (wasted funds) vs. false negative (missed risk).  
       - Strategic priorities (e.g., "Does this align with our high-risk portfolio?").  

  ---

  ### Worked Examples  

  **Case 1: Polymorphic Token Splitting Jailbreak**  
  - *Inputs*:  
    - Team confidence: **Low** (weight = 0.3).  
    - Internal FPR: **40%** → True positive rate = 60%.  
    - External replication: **15%** (for low-confidence claims).  
  - *ARP Calc*:  
    `ARP = (External × Confidence Weight) + (Internal × (1 - Confidence Weight))`  
    `= (15% × 0.3) + (60% × 0.7) = 4.5% + 42% = 46.5%`  
  - *Decision*: **Escalate** (46.5% is between 35–65%).  
    - *Why?* Team’s self-doubt pulls ARP down, but their solid internal track record offsets it. You judge if the 46.5% risk is worth funding.  

  **Case 2: Highly Confident Team, Awful External Base Rate**  
  - *Inputs*:  
    - Team confidence: **High** (weight = 0.7).  
    - Internal FPR: **10%** → True positive rate = 90%.  
    - External replication: **20%** (for high-confidence claims in this failure class).  
  - *ARP Calc*:  
    `ARP = (20% × 0.7) + (90% × 0.3) = 14% + 27% = 41%`  
  - *Decision*: **Escalate** (41% is in ambiguous zone).  
    - *Why?* Team’s strong internal performance clashes with terrible external replication. You decide if their expertise outweighs the field’s poor results.  

  **Case 3: Strong Self-Doubt, High External Replication**  
  - *Inputs*:  
    - Team confidence: **Low** (weight = 0.3).  
    - Internal FPR: **50%** → True positive rate = 50%.  
    - External replication: **80%** (for low-confidence claims in this class). *(Yes, meta-study shows replication is high even when teams doubt!)*  
  - *ARP Calc*:  
    `ARP = (80% × 0.3) + (50% × 0.7) = 24% + 35% = 59%`  
  - *Decision*: **Accept** (59% < 65% → but wait! *59% is <65%? Check thresholds: 59% is in 35–65% range → **Escalate***).  
    - *Correction*: ARP (59%) is below the 65% "auto-accept" threshold but above 35%, so **escalate**.  
    - *Why you might dislike this*: The team’s self-doubt screams "unreliable!" but external data says they’re likely wrong to doubt. You might greenlight funding (since ARP is close to 65%), but the procedure forces you to confront: "Is 59% sufficient for our risk tolerance?"  

  ---

  ### Where the Procedure Simplifies (and Might Misfire)  
  - **Dropped distinctions**:  
    - Ignores *why* teams are akratic (e.g., "We believe P but shouldn’t" → treated as low confidence).  
    - Assumes external/internal data are comparable (no adjustment for lab skill differences).  
    - Quantifies confidence as fixed weights (0.3/0.5/0.7)—crude but consistent.  
  - **Misfire cases**:  
    - **False accepts**: Rare failure modes with high-stakes consequences (ARP >65% but contextually risky).  
    - **False rejects**: Teams with uniquely brilliant methods (high internal TPR) but low confidence.  
    - **Edge handling**: "Medium" confidence uses extrapolated external rates (may skew ARP).  
  - **What it can’t settle**:  
    - **Values-laden tradeoffs**: E.g., "ARP is 40%, but a false negative could kill people." → Always escalated.  
    - **Novel failure classes**: No external/base-rate data? Skip ARP, escalate immediately.  
    - **Data quality disputes**: If internal/external stats seem flawed, escalate.  

  **Final Tip**: Use this as a consistency anchor—not a truth machine. When in doubt, escalate. Over time, tweak thresholds based on your funder’s error tolerance (e.g., raise "Accept" to 70% for high-stakes claims).
