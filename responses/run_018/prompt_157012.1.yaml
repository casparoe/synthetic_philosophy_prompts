  **INTERNATIONAL STANDARD IBMCM 23800:2027**

  **Comparative Atrocity Assessment (CAA) — General principles and metrication framework**

  **Foreword**

  The International Bureau for Moral Catastrophe Metrics (IBMCM) establishes standards to promote methodological rigor, inter-subjective consensus, and administrative functionality in the quantification and comparative analysis of large-scale human suffering events. IBMCM 23800:2027 was prepared by Technical Committee IBMCM/TC 18, Comparative Harm Metrology.

  **1 Scope**

  This standard specifies formal protocols for assigning relative magnitudes to distinct historical atrocities using calibrated quantitative and qualitative indicators. It defines core metrics (including Adjusted Mortality Figures, Demographic Displacement Ratios, and Suffering-Duration Indices), establishes the Brennan-Chen Weighted Harm Coefficient (BC-WHC), and provides procedures for invoking the No-Comparison Exemption Clause (NCE-C). The standard ensures comparability across assessments performed by certified Moral Catastrophe Assessors (MCAs).

  **2 Normative References**

  The following referenced documents are indispensable. For dated references, only the edition cited applies. For undated references, the latest edition applies.
  *   IBMCM 1200:2021: *Glossary of Terms for Moral Catastrophe Assessment*
  *   IBMCM 4503:2025: *Calibration Procedures for Suffering-Duration Indices*
  *   IBMCM/TR 7899:2026: *Best Practices for Establishing Inter-Rater Reliability in Victim Testimony Codification*

  **3 Terms and Definitions**

  For the purposes of this document, the following terms and definitions apply:

  *   **3.1 Adjusted Mortality Figure (AMF):** The base casualty count of an atrocity event, modified by application of the Population Density Factor (PDF) and the Epistemic Uncertainty Discount (EUD) to account for geographical constraints and historiographical disputes, respectively. Expressed in standardized victim-equivalents (SVE).
  *   **3.2 Atrocity Event:** A discrete historical occurrence characterized by widespread, systematic infliction of severe physical or psychological suffering upon a defined population group, exceeding normative thresholds for societal breakdown as defined in IBMCM 1200:2021, Clause 4.7.
  *   **3.3 Brennan-Chen Weighted Harm Coefficient (BC-WHC):** A dimensionless coefficient (range 0.1 to 10.0) applied to the AMF. It incorporates diminishing returns for sequential harms within the same population cohort (Perpetual Victimization Attenuation Factor - PVAF), intentionality weighting factors derived from perpetrator documentation analysis, and scalability modifiers.
  *   **3.4 Category Omega (Ω):** Designation assigned to an atrocity event via successful invocation of the NCE-C, signifying its removal from comparative ranking systems due to the determination that comparative assessment inherently constitutes secondary harm exceeding permissible thresholds.
  *   **3.5 Demographic Displacement Ratio (DDR):** The ratio of permanently displaced persons (including fatalities) to the pre-event baseline population of the affected group(s), normalized for expected migration patterns.
  *   **3.6 Moral Obscenity:** A statistically significant deviation (>3σ) from the inter-subjective consensus range for assigned harm weights (BC-WHC) for a given atrocity event, as determined through calibrated MCA panel review.
  *   **3.7 No-Comparison Exemption Clause (NCE-C):** A formal procedural mechanism allowing petition for Category Omega designation based on demonstrable harm arising from the comparative act itself, exceeding predefined Secondary Harm Index (SHI) thresholds.
  *   **3.8 Suffering-Duration Index (SDI):** A composite metric quantifying the aggregate temporal experience of suffering within the affected population(s), expressed in population-years of Standard Suffering Units (SSU), derived from testimonial archives, demographic data, and duration of coercive mechanisms.

  **4 General Principles of Comparative Assessment**

  4.1 Comparative Atrocity Assessment aims to establish ordinal rankings of atrocity events based on calculated Composite Harm Scores (CHS), where CHS = AMF * BC-WHC + DDR * k + SDI * m (k and m are empirically derived scaling constants).
  4.2 Intentionality, as evidenced by perpetrator records and policy directives, shall be weighted at a minimum factor of 1.5 within the BC-WHC calculation. Absence of explicit documentation does not preclude intentionality inference through structural analysis (see IBMCM/TR 7899:2026, Annex C).
  4.3 Double-counting of victims across temporally or spatially overlapping atrocity events must be avoided. Victim allocation shall follow the Primary Perpetrator Attribution Protocol (PPAP) outlined in Annex A.
  4.4 Inter-rater reliability among MCAs assessing qualitative factors (e.g., intentionality weighting, SSU conversion) must achieve a Cohen's Kappa ≥ 0.75. Disputes exceeding this threshold trigger mandatory Review Panel arbitration per Clause 7.4 of this standard.
  4.5 The application of the NCE-C (Clause 6) supersedes all comparative ranking procedures.

  **5 The Brennan-Chen Weighted Harm Coefficient (BC-WHC)**

  5.1 The BC-WHC is calculated as follows:
      BC-WHC = (Base Intentionality Score * Scalability Modifier) / PVAF
  5.2 **Base Intentionality Score (BIS):** Scored 1.0 (Negligible/Ambiguous Evidence) to 3.0 (Explicit, Systematic Policy). Scored via structured analysis of archival sources.
  5.3 **Scalability Modifier (SM):** Adjusts for the logistical complexity of harm delivery. Modifier = 1.0 + (Log10(AMF) * 0.2). Capped at 2.0.
  5.4 **Perpetual Victimization Attenuation Factor (PVAF):** Acknowledges diminishing marginal impact of repeated harms on a population. PVAF = 1.0 + (0.1 * Number of Documented Major Precedent Atrocities Affecting the Same Core Population Cohort within the preceding 100 years). Minimum PVAF = 1.0.

  **6 No-Comparison Exemption Clause (NCE-C) and Category Omega Designation**

  6.1 An atrocity event may be proposed for Category Omega designation by a petition demonstrating that its inclusion in comparative CAA causes quantifiable Secondary Harm (SH) exceeding SHI Threshold Gamma (SHI ≥ 8.0).
  6.2 Secondary Harm (SH) includes, but is not limited to: documented psychological distress among survivor communities triggered by comparative discourse; measurable erosion of historical understanding due to reductive quantification; utilization of comparative rankings to minimize or justify ongoing harm.
  6.3 SH must be quantified using the Secondary Harm Index (SHI) methodology specified in Annex D, incorporating survivor testimony analysis, media discourse metrics, and educational impact studies.
  6.4 Upon receipt of a petition meeting formal requirements, the IBMCM Secretariat shall convene a Category Omega Review Tribunal (CORT). Approval requires a supermajority vote (≥75%) of the CORT, confirming SHI ≥ 8.0 and that comparative assessment demonstrably impedes core memorialization or restorative justice processes.
  6.5 Events designated Category Omega are removed from published comparative rankings and databases. Reference in research is permitted only with mandatory prefatory notation of Omega status and the prohibition against quantitative comparison.

  **7 Assessment Procedures and Dispute Resolution**

  *(Clauses detailing MCA certification, data collection protocols, CHS calculation steps, mandatory uncertainty reporting, and the formation and operation of Review Panels for resolving inter-rater disputes or challenges to BC-WHC assignments.)*

  **Annex A (Normative): Primary Perpetrator Attribution Protocol (PPAP)**

  *(Detailed flowchart and rules for assigning victims to specific atrocity events when regimes or conflicts overlap.)*

  **Annex B (Informative): Worked Example – Application of IBMCM 23800:2027 to Event Pair A (Holocaust) and Event Pair B (Rwandan Genocide)**

  **B.1 Objective:** To demonstrate the calculation of Composite Harm Scores (CHS) for Event A and Event B, identify methodological challenges, and evaluate potential application of the NCE-C.

  **B.2 Data Inputs (Standardized Values):**
  *   **Event A (Holocaust):**
      *   AMF (Base): 5,900,000 SVE (PDF: 1.05, EUD: 0.98 → Final AMF: 6,068,100 SVE)
      *   DDR: 0.92
      *   SDI: 18,500,000 population-years SSU (Mean suffering duration: 3.2 years, adjusted intensity)
      *   BIS Assessment (Consensus): 2.9 (Extensive explicit documentation, systemic intent)
      *   Precedent Atrocities: Major persecution events identified within cohort (PVAF = 1.2)
  *   **Event B (Rwandan Genocide):**
      *   AMF (Base): 800,000 SVE (PDF: 1.15 [High density], EUD: 0.92 [Disputed counts] → Final AMF: 846,400 SVE)
      *   DDR: 0.85
      *   SDI: 1,150,000 population-years SSU (Mean suffering duration: 0.15 years, extreme intensity)
      *   BIS Assessment (Consensus): 2.7 (Explicit radio broadcasts, targeted lists, state/militia coordination)
      *   Precedent Atrocities: Colonial-era violence, periodic ethnic tensions (PVAF = 1.1)

  **B.3 BC-WHC Calculation:**
  *   **Event A:**
      *   SM = 1.0 + (Log10(6,068,100) * 0.2) ≈ 1.0 + (6.78 * 0.2) = 1.0 + 1.356 = 2.356 → Capped at 2.0
      *   BC-WHC = (2.9 * 2.0) / 1.2 = 5.8 / 1.2 = **4.83**
  *   **Event B:**
      *   SM = 1.0 + (Log10(846,400) * 0.2) ≈ 1.0 + (5.93 * 0.2) = 1.0 + 1.186 = **2.186**
      *   BC-WHC = (2.7 * 2.186) / 1.1 = 5.9022 / 1.1 = **5.37**

  **B.4 Composite Harm Score (CHS) Calculation (Using k=0.8, m=0.0001):**
  *   **Event A:** CHS = (6,068,100 * 4.83) + (0.92 * 0.8) + (18,500,000 * 0.0001) = 29,308,923 + 0.736 + 1,850 = **29,311,509.736**
  *   **Event B:** CHS = (846,400 * 5.37) + (0.85 * 0.8) + (1,150,000 * 0.0001) = 4,545,168 + 0.68 + 115 = **4,545,283.68**

  **B.5 Methodological Challenges & Moral Obscenity Check:**
  *   **SDI Intensity Calibration:** Assigning equivalent SSU to highly compressed, extreme violence (Event B) vs. prolonged persecution/dehumanization (Event A) exceeds current calibration capabilities (IBMCM 4503:2025 limitation). Potential Moral Obscenity flagged due to deviation in MCA intensity weighting proposals (σ=2.8 for Event B SDI conversion factor).
  *   **PVAF Application:** Assigning a higher PVAF to Event A (due to historical precedents) reduces its BC-WHC relative to Event B. This quantifies the "diminishing returns" concept but raises concerns about discounting unique historical contexts. Deviation within expected consensus range (σ=1.2).
  *   **CHS Outcome:** CHS_A > CHS_B. However, the BC-WHC for Event B (5.37) exceeds that of Event A (4.83), primarily due to the PVAF discount and the high intensity captured in the uncapped SM for Event B relative to its AMF. This result may be perceived as counter-intuitive by some stakeholders.

  **B.6 Evaluation of NCE-C Petition (Hypothetical for Event A):**
  *   **Secondary Harm (SH) Assessment:** Survivor community surveys indicate profound distress (SHI component: 7.5) triggered by comparative discourse, particularly numerical ranking. Academic discourse analysis reveals frequent misuse of Holocaust comparisons to relativize or minimize other events (SHI component: 8.2). Educational studies show reductionism in understanding (SHI component: 7.8).
  *   **SHI Calculation:** Weighted composite SHI = **8.1** (Exceeds Threshold Gamma ≥ 8.0).
  *   **CORT Review:** Tribunal (supermajority) determines that comparison demonstrably impedes Holocaust memorialization's unique pedagogical and ethical functions and fuels inappropriate relativization. SHI ≥ 8.0 confirmed.
  *   **Outcome:** Event A (Holocaust) designated **Category Omega** under Clause 6. Removed from comparative ranking tables. Subsequent CAA involving Event B would proceed without Event A as a comparator. This calibration successfully resolves the potential Moral Obscenity and stakeholder distress identified in B.5 by removing the event from the comparative framework entirely, ensuring administrative and ethical functionality.

  **Annex C (Normative): Secondary Harm Index (SHI) Calculation Methodology**
  **Annex D (Informative): Uncertainty Propagation in AMF Determination**

