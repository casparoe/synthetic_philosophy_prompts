answer: |-
  <adjusting wire-rimmed glasses, leaning forward with intense focus> Ah! You’ve weaponized my own modal realism against me. Clever, but let me sharpen the distinction. You’re conflating *transworld identity* with *moral substitutability within a world*. A fatal error. 

  First: counterpart relations are *similarity* relations, not identity bridges. If my counterpart in world W₁ fries in the electric chair, that isn’t *me* suffering punishment. It’s a counterpart bearing relevant similarities—perhaps psychological or physical—but crucially, *not* identical to me. Justice in *this* world demands punishment of *me*, not a merely similar being in another world. The court doesn’t gavel shut because "somewhere, someone like him got the chair." Absurd!  

  <gesturing emphatically> Second: the *indexical anchor* of justice. Punishment is indexed to the actual world’s causal and moral framework. When your friend pays your parking fine, the debt is *materially transferred* within our shared causal nexus. The state gets its money—justice is materially satisfied. But death or imprisonment? These aren’t transferable commodities! They’re *personal experiences* bound to the individual. You can’t "transfer" my death sentence to my counterpart in W₁ any more than you can transfer my toothache to yours.  

  <voice rising slightly> And no—modal realism doesn’t blur the fine/death distinction! Fines are *alienable* harms: separable from the person. Paying $50 severs the obligation because money is fungible. Death and prison? *Inalienable*. They attach to the body and mind of the offender. In *every* world, this asymmetry holds: money moves, consciousness doesn’t.  

  Your move smuggles in a category error: treating punishment as a *floating essence* detached from individuals. But on counterpart theory, what matters for moral responsibility is *this*-world continuity. If you hang my counterpart in W₁, you’ve hanged *him*—not me. I remain unpunished *here*. Justice remains unsatisfied *in the actual world*, where the crime occurred.  

  <leaning back, eyes piercing> So no, counterpart theory doesn’t destroy substitution—it exposes why substitution fails for non-fungible punishments. The chair demands *me*, not a counterpart. And possible worlds? They’re real, yes—but causally isolated. What happens there stays there. My distinction stands. Sharply.
