prompt: |-
  i'm working with a small transitional-justice group in a post-conflict region — we're trying to build something like South Africa's Truth and Reconciliation Commission or Argentina's commission on the disappeared, but on a local scale without any national mandate. we've been playing with an idea we call residual accountability: it's not amnesty, and it's not prosecution either, but a middle status where a person gives full testimony and then lives under specific civil restrictions (no holding office, mandatory community repair work) meant to show that the moral debt isn't erased, just transformed into something ongoing. I need a practical decision procedure that my team — none of us are lawyers — can actually run when someone applies for this status. please lay it out as ordered steps, with clear points where the answer has to be no and clear handoffs where it's a values call rather than a factual one. ground the logic in real transitional-justice thinking about amnesty tradeoffs, truth-commission goals, and maybe the community-level logic behind Rwanda's gacaca courts, but keep it usable for practitioners.

  run the procedure on two cases. first, a former militia organizer who can identify three burial sites but refuses to name the people who gave the orders, saying he isn't certain. second, an elderly guard who provides full names, expresses remorse, but splits the community — half want full forgiveness, half want prison. show where the procedure produces a result that will probably make us uncomfortable, and flag exactly which steps depend on value judgments we haven't settled yet. don't include any reading list or citations; i don't have web access to check them and i need to use this in a meeting tomorrow. also, i think i misspelled gacaca in my draft notes but please just work with the concept.
reasoning: |-
  We are designing a practical decision procedure for "residual accountability" in a local transitional justice context. The procedure must be actionable by non-lawyers and grounded in transitional justice principles. Key concepts to consider:
   1. Truth and Reconciliation Commissions (TRCs): Emphasize truth-telling, victim-centered approach, and restorative justice.
   2. Gacaca courts (Rwanda): Community-based justice, aimed at truth-telling, reconciliation, and community reintegration with some level of accountability.
   3. Residual accountability: A middle ground between amnesty and prosecution. It requires full testimony and imposes civil restrictions (e.g., no holding office, community service) to reflect ongoing moral debt.

   The procedure must include:
   - Ordered steps with clear "no" gates (where if conditions are not met, the application is rejected).
   - Handoff points for value judgments (where the team must make a decision based on community values, not just facts).

   Steps:

   1. **Initial Screening (Factual)**
      - Check if the applicant meets basic eligibility:
        a. The person must have been involved in the conflict in a way that caused harm to others.
        b. The harm must fall within the scope of the group's mandate (e.g., during the defined conflict period).
        c. The applicant must be voluntarily applying for the residual accountability process.
      - *No gate*: If any of these are not met, reject the application.

   2. **Full Testimony Requirement (Factual)**
      - The applicant must provide a complete account of their own actions and the context of those actions. This includes:
        a. Describing the events they participated in, including the nature of the harm caused.
        b. Identifying locations of graves, hidden weapons, or other material evidence (if known).
        c. Naming others involved (to the best of their knowledge and ability) including those who gave orders or were co-perpetrators. However, note: the applicant may have legitimate reasons for uncertainty (e.g., fear, genuine lack of knowledge). The requirement is to provide what they know, not what they don't.
      - *No gate*: If the applicant refuses to testify about their own actions or withholds known information (without a valid reason such as genuine uncertainty), reject the application.
      - *Value judgment handoff*: What constitutes a "valid reason" for not naming others? The team must decide on a case-by-case basis, considering factors like:
          - Is the applicant genuinely uncertain? (e.g., they only knew code names, or the person was masked)
          - Is there a credible threat to the applicant or their family?
          - How central is the information to establishing the truth? (e.g., naming a high-level commander vs. a low-level actor)

   3. **Corroboration and Verification (Factual)**
      - Cross-check the testimony with existing evidence (e.g., victim statements, documents, other witnesses).
      - *No gate*: If the testimony is found to be materially false or intentionally misleading, reject the application.

   4. **Assessment of Remorse and Intent (Value Judgment)**
      - This step is about the applicant's attitude and the perceived sincerity of their remorse. However, note that in many transitional justice processes (like gacaca), the primary goal is truth, not remorse. But since we are imposing ongoing civil restrictions, the community's perception of the applicant's contrition may matter for legitimacy.
      - *Value judgment handoff*: The team must decide:
          - Is the applicant showing genuine remorse? (This can be through words, actions, or both.)
          - How important is remorse for the residual accountability status? (This depends on the community's values: some may prioritize truth over remorse.)

   5. **Community Consultation (Value Judgment)**
      - Present the applicant's testimony and the verification results to the affected community (or representatives) for input. This step is crucial for legitimacy and reconciliation.
      - *Value judgment handoff*: The team must weigh community reactions. However, note that the community might be split. The decision should not be a simple majority vote but rather consider:
          - The intensity of feelings (e.g., strong opposition from victims directly affected vs. general community members).
          - The potential for the decision to foster or hinder reconciliation.
          - The principles of the residual accountability framework (it's not about satisfying everyone but about transforming moral debt).

   6. **Decision on Residual Accountability Status and Conditions (Value Judgment)**
      - If the application passes all previous steps, decide on the specific conditions:
          - Restrictions: e.g., prohibition from holding public office, mandatory community service, public acknowledgment of harm, etc.
          - Duration: Temporary or lifelong? (This should be set by the team's guidelines, but may be adjusted per case.)
      - *Value judgment handoff*: The team must set conditions that are proportional to the harm and the level of cooperation, and that reflect the principle of ongoing accountability.

   7. **Implementation and Monitoring (Procedural)**
      - Once granted, document the conditions and set up a monitoring mechanism.

   Now, run two cases:

   **Case 1: Former militia organizer**
     - Facts: Identifies three burial sites but refuses to name the people who gave orders, claiming uncertainty.
     - Step 1: Eligible (involved in conflict, within scope, voluntarily applying).
     - Step 2: He provided his own actions and burial sites, but did not name the commanders. Is "uncertainty" a valid reason?
          - *Value judgment handoff*: The team must decide if his uncertainty is credible. Factors:
              - How high-ranking was he? (If he was an organizer, he likely had contact with commanders.)
              - Did he provide any details about the chain of command? (Even without names, describing the structure might be acceptable if he genuinely doesn't recall names.)
              - Is there any evidence that he knows but is withholding? (e.g., other witnesses have named him as having direct contact)
          - If the team believes he is withholding known information without valid reason -> reject. If they accept his uncertainty, proceed.
          - *For the sake of example, let's say the team accepts his reason but notes that his cooperation is partial.*
     - Step 3: Corroborate burial sites. If verified, proceed.
     - Step 4: Remorse? (Not mentioned, so we assume he hasn't expressed it. The team must decide: is remorse required? If so, this might be a problem. But if truth is the priority, then proceed.)
          - *Value judgment handoff*: The team must decide the weight of remorse. Since the framework doesn't require amnesty-like forgiveness, perhaps residual accountability can still apply without remorse? (But note: ongoing restrictions might be harder to justify without some contrition.)
     - Step 5: Community consultation. The community may have mixed views. Some might be satisfied with the burial sites, others angry he didn't name commanders.
          - *Value judgment handoff*: The team must weigh the community input. Given that he provided valuable information (burial sites) but not full truth (on commanders), the team might decide to proceed but impose stricter conditions.
     - Step 6: Conditions: Since he didn't fully cooperate on commanders, perhaps longer community service and a public acknowledgment that he did not fully cooperate? Also, a lifelong ban on holding office.

   **Case 1 Outcome**: Residual accountability granted with conditions, but the community might be unhappy about the lack of commander names. The team must be comfortable with the fact that full truth was not achieved. This might be uncomfortable because it leaves a gap in accountability for higher-ups.

   **Case 2: Elderly guard**
     - Facts: Provides full names of all involved, expresses remorse, but splits the community (half want forgiveness, half want prison).
     - Step 1: Eligible.
     - Step 2: Full testimony (with names) -> passes.
     - Step 3: Corroboration: verify the names and events. If verified, proceed.
     - Step 4: Remorse expressed -> positive factor.
     - Step 5: Community consultation: split community. 
          - *Value judgment handoff*: This is the critical step. The team must decide how to handle the split. 
              - Considerations: 
                  - The guard has fully cooperated and shown remorse.
                  - Residual accountability is not about satisfying victims' desire for punishment (prison) but about transforming the debt.
                  - However, ignoring the victims who want prison might undermine the process.
          - The team might decide that residual accountability is appropriate because the framework is designed for this middle ground. The conditions must be meaningful to both sides.
     - Step 6: Conditions: The restrictions must be substantial enough to acknowledge the harm (e.g., significant community service, perhaps in a role that directly addresses the harm, and a ban on public office). But also, the process should include a public ceremony where the community's split is acknowledged and the guard commits to the ongoing accountability.

   **Case 2 Outcome**: Residual accountability granted. This might be uncomfortable because half the community wants prison, and the team is effectively overriding that. The value judgment here is that the residual accountability framework is a valid alternative to prosecution, and the team must hold that line.

   **Unsettled Value Judgments** (to discuss in meeting):
    - Step 2: What level of detail is required in naming others? What constitutes a valid reason for not naming?
    - Step 4: How critical is remorse? Can residual accountability be granted without it?
    - Step 5: How to weigh community input? Does a split community mean we should reject, or does the framework allow proceeding despite split?
    - Step 6: How to set proportional conditions? What factors matter most (severity of crime, level of cooperation, remorse)?

   The procedure in ordered steps:

   1. **Initial Screening** (Factual - must pass all):
      - Eligibility: Involved in conflict, within mandate, voluntary application.
      - *No*: If not, reject.

   2. **Full Testimony** (Factual with value judgment):
      - Applicant must provide full account of own actions, material evidence (e.g., burial sites), and names of others (to the extent of their knowledge and without withholding known information).
      - *No*: If they refuse to testify about their own actions or withhold known information without a valid reason.
      - *Value judgment*: What is a valid reason for not naming others? (e.g., genuine uncertainty, fear)

   3. **Corroboration** (Factual):
      - Verify the testimony against existing evidence.
      - *No*: If materially false, reject.

   4. **Remorse and Intent** (Value judgment):
      - Assess the applicant's remorse (if required) and the sincerity of their application.
      - *No*: Optionally, the team may decide that lack of remorse is a reason to reject. (This is a policy decision to be set by the group.)

   5. **Community Consultation** (Value judgment):
      - Gather community input (via meetings, representatives, or written statements).
      - *Value judgment*: How much weight to give community views? The team must decide if the community's opposition (even if partial) is a barrier.

   6. **Decision on Status and Conditions** (Value judgment):
      - If passed all, grant residual accountability with conditions (e.g., restrictions, community service).
      - Conditions must be proportional and reflect ongoing accountability.

   7. **Implementation** (Procedural):
      - Document, monitor, and enforce conditions.

   Note: Steps 4 and 5 can be interchanged if community consultation is done earlier, but it's presented here after verification to avoid presenting unverified claims to the community.
answer: |-
  Below is a practical, step-by-step decision procedure for your residual accountability process, designed for non-lawyer practitioners and grounded in transitional justice principles (e.g., TRC-style truth-seeking, gacaca's community focus, and the amnesty/accountability balance). It includes clear **NO gates** (factual rejections) and **value judgments** (handoffs requiring team decisions). 

  ### Core Principles Embedded
  1. **Truth over punishment**: Prioritizes full disclosure of facts (like TRCs).  
  2. **Community restoration**: Echoes gacaca’s emphasis on local healing through public truth and reparative acts.  
  3. **Moral debt transformation**: Rejects blanket amnesty by imposing ongoing civil consequences.  

  ---

  ### Decision Procedure: 7 Ordered Steps  
  **Key**:  
  🔴 = **NO gate** (mandatory rejection if criteria unmet)  
  🟡 = **Value judgment** (team deliberation required)  

  1. **Eligibility Screening** (Factual)  
     - Verify:  
       a. Applicant’s role in conflict (perpetrator/complicit actor).  
       b. Harm caused falls within the group’s defined scope (e.g., timeline, geographic area).  
       c. No prior accountability process for the same acts.  
     - 🔴 **NO if**: Role/harm outside scope OR double jeopardy risk.  

  2. **Testimony Completeness Assessment** (Factual)  
     - Require:  
       a. Full disclosure of **their own actions** (who, what, where, when).  
       b. Disclosure of **tangible consequences** (e.g., burial sites, victims’ names).  
       c. Disclosure of **others’ roles** **to the extent of their direct knowledge**.  
     - 🔴 **NO if**: They conceal their own acts OR verifiable facts they witnessed (e.g., "I saw Commander X order killings" but refuse to name X).  
     - 🟡 **Value judgment if**: They claim uncertainty about others’ roles (assess credibility: Is their uncertainty plausible? Could they reasonably know?).  

  3. **Truth Verification** (Factual)  
     - Cross-check testimony with:  
       a. Victim/family accounts.  
       b. Physical evidence (e.g., burial sites).  
       c. Other witnesses’ statements.  
     - 🔴 **NO if**: Material falsehoods found OR refusal to cooperate with verification.  

  4. **Remorse & Intent Evaluation** (🟡 **Value judgment**)  
     - Assess:  
       a. Sincerity of remorse (verbal/written statements, conduct).  
       b. Willingness to make reparations (e.g., community service).  
     - *Handoff logic*: Remorse isn’t mandatory for truth-focused processes (like TRCs), but it affects community reconciliation. Decide: **Is remorse necessary for legitimacy here?**  

  5. **Community Impact Consultation** (🟡 **Value judgment**)  
     - Gather input from:  
       a. Direct victims/survivors.  
       b. Broader community representatives.  
       c. Local leaders.  
     - 🟡 **Value judgment**: Weigh responses proportionally:  
       - Prioritize direct victims’ voices where feasible.  
       - Decide: **Does granting status risk severe community division or violence?**  

  6. **Conditions Assignment** (🟡 **Value judgment**)  
     - Tailor restrictions based on:  
       a. Severity of harm.  
       b. Level of cooperation (Step 2).  
       c. Community input (Step 5).  
     - *Examples*: 10-year office ban; weekly reparative labor; public apology.  
     - 🔴 **NO if**: Applicant refuses conditions.  

  7. **Final Approval & Monitoring Setup** (Procedural)  
     - Document agreement.  
     - Assign community monitors for compliance.  

  ---

  ### Case Applications  
  #### Case 1: Former Militia Organizer  
  - **Facts**: Identifies 3 burial sites; refuses to name commanders, citing uncertainty.  
  - **Procedure**:  
    1. **Eligibility**: Pass (militia role, harm in scope).  
    2. **Testimony Completeness**: 🟡 **Value judgment** (uncertainty claim).  
       - *Team deliberation*: Is his uncertainty credible? As an organizer, he likely knew commanders. If plausible (e.g., orders came anonymously), proceed. If not, 🔴 NO for concealing facts.  
       - *Assume team accepts uncertainty* → Proceed.  
    3. **Verification**: Burial sites confirmed → Pass.  
    4. **Remorse**: Not mentioned → 🟡 **Value judgment**. Team decides remorse *not* mandatory → Pass.  
    5. **Community Impact**: 🟡 **Value judgment**. Families of the buried may want names; others may value burial locations. Team weighs: Truth about sites aids closure; missing commanders frustrates justice. → Pass with note: *Community may resent unnamed commanders*.  
    6. **Conditions**: Stricter rules (e.g., 20-year office ban + 5 years of grave-maintenance labor).  
    7. **Approval**: Residual accountability **granted** with conditions.  
  - **Uncomfortable outcome**: Commanders go unpunished; community anger over unaddressed hierarchy.  

  #### Case 2: Elderly Guard  
  - **Facts**: Gives full names; expresses remorse; community split (50% forgiveness, 50% prison).  
  - **Procedure**:  
    1. **Eligibility**: Pass.  
    2. **Testimony Completeness**: Full disclosure → Pass.  
    3. **Verification**: Names/events confirmed → Pass.  
    4. **Remorse**: Sincere remorse → Pass.  
    5. **Community Impact**: 🟡 **Value judgment** (critical!).  
       - *Team deliberation*: Direct victims may be in "prison" faction. Decide: **Does overriding half the community undermine local healing?**  
       - *Assume team prioritizes truth/reparations over punishment* → Pass.  
    6. **Conditions**: Moderate restrictions (e.g., 5-year office ban + teaching non-violence to youth).  
    7. **Approval**: Residual accountability **granted**.  
  - **Uncomfortable outcome**: Half the community feels betrayed; potential loss of trust in the process.  

  ---

  ### Unresolved Value Judgments (Flagged for Your Meeting)  
  1. **Step 2 (Testimony)**: What constitutes "credible uncertainty" about others’ roles? (*e.g., Is militia organizer’s claim valid?*)  
  2. **Step 4 (Remorse)**: Is remorse required, or is truth sufficient? (*e.g., Guard’s remorse helped; militia organizer lacked it.*)  
  3. **Step 5 (Community)**: How much opposition vetoes an application? (*e.g., 50% wanting prison in Guard’s case.*)  
  4. **Step 6 (Conditions)**: What severity of restrictions "fits" the harm? (*e.g., Is grave labor for a militia organizer enough?*)  

  ### Practical Notes  
  - **Speed**: This fits a 1–2 day review per case.  
  - **Documentation**: Use simple templates for testimony records, verification logs, and community feedback.  
  - **Safety**: Anonymize sensitive testimony where needed to protect applicants/victims.  

  This procedure forces hard choices but centers on your goal: **transform moral debt into visible, ongoing responsibility**. Adapt the 🟡 steps to reflect your group’s core values.
