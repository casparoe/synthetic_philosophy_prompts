answer: |-
  ## Joint Statement: Quinean Ethics - Minimalist vs. Instrumentalist Perspectives

  **Agreed Claims re: Quine's Framework & Constraints for Ethics:**

  1.  **Naturalized Epistemology is Foundational:** Quine’s naturalized epistemology dissolves the analytic/synthetic distinction and rejects first philosophy. Science, broadly construed as our best effort to systematize sensory input, is continuous with common sense and provides the only framework for understanding the world, including human values. Ethics cannot appeal to transcendent sources or non-natural intuitions.
  2.  **No Special Moral Faculty:** Quine’s ontology, derived from our best scientific theories, contains no unique faculty for perceiving moral truths (e.g., no "moral sense," no non-natural property detectors). Moral judgments arise from biological predispositions, cultural conditioning, and linguistic practices within the web of belief.
  3.  **Ethics Must Accommodate Empirical Constraints & Holism:** A Quinean ethics must be:
      *   **Empirically Constrained:** Moral claims are responsive to empirical facts about human needs, social interaction, psychology, biology, and the consequences of actions, as these facts are woven into the holistic web of belief.
      *   **Holistic:** Moral claims are part of the interconnected web. They can be revised in light of recalcitrant experience, though their centrality may afford them significant stability (cf. Neurath's boat). Such revision involves pragmatic choices guided by the goals of prediction, control, and simplicity within the overall system.
      *   **Non-Reductive:** While grounded in natural facts, moral claims (e.g., "X is wrong") cannot be *reduced without remainder* to purely descriptive, non-evaluative scientific statements without losing their normative force or distinctive role in discourse and motivation.

  **Disagreements Table:**

  | Feature                     | Ontological Minimalist Position                                                                                                                                 | Pragmatic Instrumentalist Position                                                                                                                                                                                               |
  | :-------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Nature of Moral Values**  | Moral values are **emergent theoretical posits** akin to center-of-mass or fitness. They are genuine (though abstract) constituents of our best explanatory theory of human social behavior and cognition, justified by their role in systematizing observations and guiding action. | Moral values are fundamentally **instrumental calibration targets** akin to aiming for "98.6°F" on a thermometer. They are pragmatic constructs arising from biological imperatives and socio-linguistic practices, serving to coordinate behavior and maintain social cohesion, not denote mind-independent properties. |
  | **Grounding Normative Force** | Normative force stems from the **explanatory role** of values within the naturalized web. Recognizing "cruelty is wrong" as a theoretical posit within our best account of flourishing societies *just is* to recognize its normative pull for agents within that system (implicitly including ourselves). | Normative force arises **pragmatically and contextually** from the *adoption* of specific calibration targets by agents/communities seeking specific ends (survival, cooperation, reducing suffering). "Oughts" express commitments to these contingent targets, not discovery of intrinsic properties. |
  | **Location of Moral Revision** | While possible, revision of core moral commitments occurs **only under extreme empirical duress or profound theoretical upheaval**, akin to revising logic or core physics. Their centrality grants them significant immunity. | Revision of core moral commitments **can occur closer to the center** of the web than Minimalists allow, driven by sustained empirical pressure (e.g., persistent social dysfunction) combined with pragmatic reassessment of instrumental goals, not just peripheral sensory clashes. |

  **Cruxes & Agreed Test Cases:**

  1.  **Crux: Can Evolutionary Stability Ground Normative Force?**
      *   **Agreed Case:** The evolutionary stability of kin-selection altruism ("helping close relatives often enhances inclusive fitness").
      *   **Minimalist Prediction:** This stability *explains* the emergence and persistence of a sense of familial obligation. Recognizing this explanation within our scientific web *confers normative weight* on the obligation itself for humans; it's not merely descriptive. We *ought* (prima facie) to favor kin *because* this tendency is a stable, functional component of our evolved sociality.
      *   **Instrumentalist Prediction:** This stability *explains why* "help kin" emerged as a widespread calibration target. However, the *normativity* ("ought") arises *only* if an agent/community adopts survival or inclusive fitness maximization *as* their contingent goal. The stability itself is descriptive; the normativity is imposed by the chosen instrumental aim.

  2.  **Crux: Can Core Moral Revision Occur Without Peripheral Sensory Conflict?**
      *   **Agreed Case:** The historical shift towards viewing slavery as intrinsically wrong, driven primarily by moral arguments appealing to consistency (e.g., universal human dignity), empathy, and social consequences, rather than new sensory data about the physical suffering of enslaved people (which was already known).
      *   **Minimalist Prediction:** This shift involved **recalibrating peripheral implications** (specific practices) of the *unchanged* core posit "human dignity." The core concept remained stable; its application scope widened dramatically under socio-linguistic pressure. True core revision (e.g., abandoning "dignity" entirely) would require catastrophic empirical failure.
      *   **Instrumentalist Prediction:** This shift exemplifies **central pragmatic revision**. The instrumental target shifted from "social order via hierarchy" towards "social order via universal rights," driven by internal tensions (inconsistency) and evolving pragmatic goals (stability, productive potential of free labor). New sensory data wasn't the primary driver; it was a re-evaluation of core instrumental aims and their coherence.

  **On the Calibration-Target Analogy:** We agree this analogy **significantly clarifies the core dispute.** It starkly contrasts the Minimalist view of values as *explanatorily real theoretical components* (like center-of-mass) with the Instrumentalist view of values as *chosen standards for practical orientation* (like a temperature setting). This distinction directly maps onto the disagreements about the source of normativity and the nature of revision. The analogy is substantive, not merely verbal, precisely because it forces confrontation over whether moral terms primarily *refer* (even abstractly) or *prescribe*. We adopt it as central to articulating our divergence.
