  hey im giving a talk next week at our phil of econ / decision theory crossover seminar. audience is mostly behavioral economists who think hyperbolic discounting is descriptively accurate and not irrational, plus two formal epistemologists who know the standard ramsey-de finetti coherence arguments inside out but think applying them intertemporally is just prudence, not rationality proper. my position is a niche diachronic coherence argument: treat your future self as a seperate betting agent with its own credence function, then any present choice that violates expected-utility maximization lets that future agent construct a dutch book against you now. so intertemporal EU max is a coherence constraint across agents-in-one-body, not just a normative ideal.

  i need a prep sheet for the q&a. list the 6 or 7 objections theyll actually throw, ordered by how damaging they are, phrased exactly like a behavioral economist or one of those epistemologists would say it. for each: a reply i can deliver in about two minutes, plus a one-line note on where that reply is softest. also tell me what i should concede right at the start so they dont tune out. and definitely include the one objection im praying nobody brings up.

  write it casual - a typo or two is totally fine. at the end put the dreaded objection in \answer{...}.
