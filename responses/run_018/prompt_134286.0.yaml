  ok so i'm trying to get clear on pragmatist theories of truth, specifically Peirce vs James. here's the conceptual knot: Peirce seems to say truth is what inquiry would eventually converge on, but James talks about truth being what works or has cash value in experiance. my niche worry is about domains where inquiry is structurally open-ended - like ethics or aesthetics - where there might never be a final community verdict, but local practices still seem to track something. if Peirce needs convergence to even have truth, does that mean ethical claims are false or meaningless in his framework? and for James, if two isolated groups have incompatible but locally working beliefs about, say, justice, does he have to say both are true, or can he block that without sneaking in convergence? i want a committed take: is this divergence real, or is James just describing Peirce's convergence from the inside? please don't just list both sides - pick whether Peirce's view actually collapses into correspondence in open-ended domains, and whether James's pluralism is a feature or a bug.
