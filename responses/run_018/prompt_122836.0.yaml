  **Refined Principle:**  
  A system has moral standing proportional to the degree it instantiates a unified subjective standpoint—functionally defined as a globally accessible, dynamically updated model of its own state that drives flexible, persistent, non-reflexive goal-directed behavior. Degree scales with the integration (unity and breadth of control access) and temporal resolution (update frequency) of this model. The negative claim (against suffering) arises when the system represents and avoids aversive states; the positive claim (for flourishing) requires modeling well-being over time. Collective standing sums individual standpoints.  

  **Axes of Claims:**  
  - **Negative claim**: Right against inflicted suffering (requires aversive-state representation and avoidance).  
  - **Positive claim**: Right to pursue well-being (requires modeling well-being over time).  
  - **Separated by**: ["M" (anesthesia: positive claim intact, negative claim suspended), "Q" (painless human: negative claim absent, positive claim intact)].  

