prompt: |-
  I'm putting together a segment for my science-and-ideas newsletter and I've got an interveiw next week with a philosopher who's defending this really specific claim that qualia aren't just hard to explain but are literally an incoherent ontological posit — he's running a Quine-style audit on mental concepts but adding this niche twist he calls the "mirror-binding problem," where any attempt to refer to a quale already smuggles in the conceptual framework the quale was supposed to be pre-theoretically grounding. I was arguing about it with friends over coffee yesterday and half of them said it's just eliminativism with extra steps, but I think there's more going on. Before you draft the quetions, take a moment to think carefully and do a quick mental branstorm: map out the three biggest pressure points, especially how this view handles inverted-spectrum thought experiments and whether mirror-binding actually distinguishes qualia from theoretical entities like electrons. You are acting as a professional philosophy interviewer with a background in philosophy of mind; please answer in American English.

  I want exactly five items — numbered 1 through 5, each just a sentence or two, with no introduction and no conclusion. Keep them in the weeds: press him on whether mirror-binding applies just as hard to neurons or electrons, anticipate his standard reply about inverted spectra and include the immediate follow-up, ask what mental ontology survives if we apply his Quinean scrub consistently across the board, and make sure one question forces him to name what evidence could actually shift his view. Don't ask generic biographical fluff; stay sharp and specific.
reasoning: |-
  Okay, the user is preparing for an interview with a philosopher who claims qualia are incoherent, introducing "mirror-binding" as a key twist. They want sharp, specific questions targeting the argument's pressure points. 

  First, I need to unpack the core challenge: mirror-binding suggests that describing qualia already relies on concepts qualia were meant to ground, making them circular. The user’s friends dismissed it as repackaged eliminativism, but they suspect nuance—so my questions must probe that nuance ruthlessly.

  The user’s demands are hyper-specific: five numbered questions, no fluff, drilling into inverted spectra, comparisons to electrons, ontological fallout, and falsifiability. They’re clearly well-versed in philosophy of mind—no hand-holding needed. 

  Pressure point 1: Inverted spectra. If qualia are incoherent, how does mirror-binding handle the intuition that color experiences could swap without behavioral changes? Anticipating the reply that it’s a conceptual confusion, my follow-up must corner him: what positive account explains the persistent appeal of such thought experiments? 

  Pressure point 2: The electron analogy. If mirror-binding uniquely invalidates qualia but not scientific posits like electrons, I need to expose the asymmetry. His likely reply—that electrons are functionally defined—opens a vulnerability: don’t dispositionalist theories of mind already functionally define qualia? 

  Pressure point 3: Ontological triage. If we Quine-scrub all mental terms, what survives? "Belief" and "desire" often get reconstrued functionally, but he must clarify where he draws the line—and why some concepts get salvage operations while qualia get the axe. 

  Pressure point 4: Falsifiability. Philosophy claims should have stakes. If he concedes no evidence could shift his view, it risks being unfalsifiable wordplay. If he offers possible counterevidence, that’s a hook to test his framework’s elasticity. 

  Pressure point 5: The eliminativism charge. Half the user’s friends called this "eliminativism with extra steps." Does mirror-binding actually preserve any first-person perspective, or is it a covert route to Dennett’s stance? His answer here determines if the "niche twist" is substantive or decorative. 

  ... Time to compress this into five surgical strikes. User wants blood on the floor, not polite chatter.
answer: |-
  1. **Electron Analogy Pressure**: If mirror-binding invalidates qualia because referring to them presupposes the framework they're meant to ground, why doesn't this equally undermine theoretical entities like electrons—where reference also relies on a theory-laden framework—and how is the "functional role asymmetry" you posit not question-begging?  
  2. **Inverted Spectrum Reply & Follow-Up**: You likely dismiss inverted spectra as incoherent because the private "flip" can't be meaningfully described without mirror-binding circularity—but doesn't this ignore the *structural* relations between qualia (e.g., red1 > red2 in intensity) that persist across inversions and seem describable independent of private grounding?  
  3. **Ontological Triage**: If we apply your Quinean scrub consistently, which mental concepts *survive* as coherent (e.g., "belief" as dispositional state)? Specify one example and explain why it avoids mirror-binding, given that *any* mental term arguably implicates first-person access.  
  4. **Falsifiability Demand**: What conceivable evidence *could* force you to abandon mirror-binding—say, a mathematical proof that phenomenal concepts *are* primitives in a complete physics of cognition, or empirical data showing pre-linguistic infants exhibit qualia-consistent behavior unmappable to functional states?  
  5. **Eliminativism Charge**: When critics argue mirror-binding is just eliminativism repackaged (since it voids qualia as referents), what positive alternative *ontology of experience* do you offer that isn't reductively behavioral or computational—or is the outcome truly that "what it's like" is strictly ill-formed?
