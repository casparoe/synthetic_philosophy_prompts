  We are constructing a reusable evaluation procedure for manuscripts on Gödel's modal ontological argument and variants. The procedure has four passes, each with a specific question, required textual evidence, a pass/fail/judgment-call rule, and a point where our theoretical commitments might enter (JUDGMENT CALL). 

  First, we note the conceptual distinctions that must survive simplification:

  1. Intensional vs. extensional: We must track whether properties are treated as having the same extension in every world (stable) or as world-bound. The argument often relies on properties being positive in a way that is not world-relative, but if the author equivocates, that's a problem.

  2. Consistency of the set of positive properties: We require that the set is claimed consistent (i.e., that it is possible for all positive properties to be instantiated together). However, we do not require that the set is closed under negation or conjunction (unless the author does so, which might lead to modal collapse).

  3. Formal validity vs. metaphysical soundness: We check for validity in the specified modal frame, but we cannot vouch for the soundness of the premises (e.g., whether "positive" is correctly defined). The procedure flags when the frame is justified independently to avoid circularity.

  Distinctions we can drop for speed:

  - We don't need to re-derive modal logic axioms; we assume standard ones unless the author specifies otherwise.
  - We don't need to check every step of the derivation if the core steps (consistency, the move from possibility to necessity) are clearly stated.

  Now, the four-pass protocol:

  **Pass One: Frame Specification**
  - **Question:** What modal logic frame (S5, S4, B, KB, or a restricted accessibility relation) does the author use? Is the frame justified independently of the conclusion?
  - **Required Textual Evidence:** Explicit statement of the frame (e.g., "we work in S5") or clear use of axioms (e.g., symmetry, transitivity). Justification for the frame (if any) must be provided.
  - **Rule:** 
    - PASS if the frame is clearly specified and justified independently (e.g., by appeal to standard metaphysical interpretations of modality, or by independent argument).
    - FAIL if the frame is not specified, or if the justification is circular (e.g., "we use S5 because it validates the conclusion").
    - JUDGMENT CALL if the justification is weak but not circular (e.g., "it is standard in the literature" without further argument) — then we must decide if that is acceptable.

  **Pass Two: Intensional Stability Audit**
  - **Question:** For every property designated "positive", is its extension (the set of things that have it) stable across all worlds accessible in the frame?
  - **Required Textual Evidence:** Definitions or explicit statements about the properties. We look for places where the author ascribes a property in one world and then uses it in another, or where the property is defined as positive in a way that might be world-relative.
  - **Rule:**
    - PASS if the author consistently treats positive properties as having stable extensions (the same in every world) and there is no equivocation.
    - FAIL (INTENSIONAL EQUIVOCATION) if the author at one point treats a property as world-bound and at another as trans-world without explanation.
    - JUDGMENT CALL if the author defines positive properties as stable by fiat (e.g., "by definition, positive properties are necessary attributes") without independent motivation — then we must decide if that is acceptable.

  **Pass Three: Consistency and Collapse Containment**
  - **Question:** Does the author explicitly claim that the set of positive properties is consistent? Then, does the model avoid modal collapse? (i.e., are there contingent truths after introducing the necessary being?)
  - **Required Textual Evidence:** Explicit statement about the consistency of the set of positive properties. Also, we must check the consequences: if the argument implies that all truths are necessary, then we look for the cause (e.g., closure under conjunction and negation?).
  - **Rule:**
    - PASS if the consistency is explicitly claimed and the model avoids modal collapse (i.e., the author shows or states that there are contingent truths, or the argument does not imply otherwise). Also, if the author avoids closure under negation and conjunction in a way that prevents collapse, that helps.
    - FAIL if consistency is not claimed, or if modal collapse occurs and is not acknowledged (unless the author explicitly embraces it).
    - JUDGMENT CALL on the legitimacy of closure under negation or conjunction: if the author includes such closure and it leads to collapse, we must decide if that closure is acceptable. Also, if the author avoids closure but collapse still occurs by other means, we must judge whether the containment is adequate.

  **Pass Four: Existential Inference**
  - **Question:** How does the author move from "possibly, a being instantiates all positive properties" to "necessarily, such a being exists"? Specifically, where does this step depend on the frame's accessibility conditions and where on an unstated existence premise?
  - **Required Textual Evidence:** The step in the argument where possibility leads to necessity. We must see the logical justification (e.g., an appeal to the frame's properties) and any premises about existence (e.g., that necessary existence is a positive property).
  - **Rule:**
    - PASS if the step is valid in the specified frame (e.g., in S5, if the being is possible, then it is necessary) and the existence premise (if any) is explicitly stated and justified.
    - FAIL if the step is invalid in the frame, or if the existence premise is missing and required.
    - JUDGMENT CALL on the justification for the existence premise (e.g., if necessary existence is asserted to be positive without argument) — then we must decide if that is acceptable.

  Now, we apply the protocol to three hypothetical submissions:

  **Case A: Standard Gödel reconstruction in S5 with explicit definitions of "positive" and "God-like" and an explicit consistency claim.**

  - Pass One: 
    - Frame: S5. Justification? Typically, S5 is standard for metaphysical modality. 
    - Rule: PASS (if justified as standard) or JUDGMENT CALL (if no independent justification beyond standard). We'll say PASS because it's standard and the author doesn't need to justify S5 in every paper.
  - Pass Two: 
    - Positive properties are defined as stable (e.g., "a property is positive if it is necessarily so"). 
    - Rule: PASS (no equivocation).
  - Pass Three: 
    - Explicit consistency claim: yes. 
    - Modal collapse: The standard Gödel argument does imply modal collapse if the set of positive properties is closed under conjunction and negation? Actually, in the standard version, if we have closure under conjunction, then the one necessary being has all positive properties, and if negation of a positive is not positive, then we avoid collapse. However, there is a known objection that if we assume that for every property either it or its negation is positive, then collapse occurs. But the standard reconstruction usually does not do that. So, if the author avoids closure under negation, then collapse is avoided. 
    - Rule: PASS (if the author does not include closure under negation and explicitly avoids collapse) or JUDGMENT CALL (if the author doesn't address collapse). We'll assume the author avoids closure under negation: PASS.
  - Pass Four: 
    - The step from possibility to necessity: in S5, if it is possible that a God-like being exists, then it is necessary (because the being, by having all positive properties including necessary existence, exists necessarily). 
    - The existence premise: necessary existence is defined as a positive property. 
    - Rule: The step is valid in S5. The premise is explicitly stated. So PASS.

  Overall: PASS on all counts.

  **Case B: Variant that replaces "positive" with "essential" and adopts an S4 frame with accessibility restricted to "metaphysically nearby" worlds.**

  - Pass One:
    - Frame: S4 (reflexive and transitive) but with a restriction to "metaphysically nearby" worlds. Justification? The author must justify why we are restricted to nearby worlds and why S4 is appropriate. 
    - Rule: If the justification is independent (e.g., an argument that metaphysical accessibility is only reflexive and transitive and restricted to worlds that are "close" for some reason), then PASS. But if the justification is circular (e.g., to avoid the conclusion in all worlds), then FAIL. We'll assume the author gives a weak independent justification (e.g., "we consider only worlds that share the same essential properties as the actual world") but it's not fully developed. So JUDGMENT CALL (we might be skeptical).
  - Pass Two:
    - Properties are now "essential". The author must define what "essential" means. If essential properties are stable (the same in every world) then it's okay. But if they are defined relative to a world (e.g., an essential property in world w is one that an object must have in all worlds accessible from w), then the extension might change. We must check for equivocation. 
    - Rule: If the author uses essential properties in a way that requires stability across all worlds (even non-nearby) but the frame doesn't allow access to all worlds (only nearby), then there might be equivocation. For example, if in one step they consider an essential property in the actual world and then assume it holds in a non-nearby world without accessibility, that's a problem. We'll assume the author does not clearly define the stability, so we might see equivocation. So FAIL (INTENSIONAL EQUIVOCATION) because the author likely uses the property in a way that requires transitivity (to chain across worlds) but the restriction to nearby breaks that.
  - Pass Three:
    - Consistency: The author claims the set of essential properties is consistent? We'll assume yes. 
    - Modal collapse: In S4, without symmetry, we might avoid collapse? But the restriction to nearby worlds might complicate. However, the collapse containment: if the necessary being exists in all accessible worlds, but the accessibility is restricted to nearby, then there might be a world that is not nearby and where the being doesn't exist? But then the being isn't necessary in the full sense. Also, the existence of the being might not spread to all worlds. So collapse might be avoided. But we must check if the author addresses this. 
    - Rule: If the author doesn't address, then it might be a hidden issue. We'll say JUDGMENT CALL on whether the containment is adequate (because the frame is non-standard and might have unexpected consequences).
  - Pass Four:
    - The step from possible to necessary: In S4, if something is possible, then it is necessary in the sense that it holds in all accessible worlds from any world? Actually, in S4, we have that if something is possible, then it is necessarily possible, but we don't get that it is necessary. So the step from possibility to necessity fails in S4. 
    - The author must provide an alternative. If they don't, then the inference fails. 
    - Rule: FAIL because S4 does not validate ◊P → □P. The author would need an extra premise (like the being's necessary existence) but even then, the frame might not allow the conclusion in all worlds. 

  Overall: At least one FAIL (Pass Four) and possibly others. So overall rejection.

  **Case C: Formally ingenious submission that avoids modal collapse by adopting a highly restricted, non-standard accessibility relation, passes every formal check in Passes One through Four, but forces rejection because the restriction is ad hoc and unsupported.**

  - Pass One:
    - Frame: Non-standard, but specified. Justification? We assume the author provides a formal specification but no independent metaphysical argument. 
    - Rule: JUDGMENT CALL on the justification. We must decide if the restriction is ad hoc. (Our theoretical commitments: we believe that modal frames must be metaphysically justified, not just formal.)
  - Pass Two:
    - The author has stable positive properties. 
    - Rule: PASS.
  - Pass Three:
    - Consistency claimed and collapse avoided by the frame. 
    - Rule: PASS.
  - Pass Four:
    - The step from possibility to necessity is valid in the restricted frame. 
    - Rule: PASS.

  But then, in Pass One, we have a JUDGMENT CALL: we must decide if the frame is justified. Our commitment: without independent metaphysical argument, we reject ad hoc frames. Therefore, we record a failure at Pass One due to JUDGMENT CALL (we judge the justification insufficient).

  Overall: Rejection because of the JUDGMENT CALL in Pass One.

  **Limitations and Misfires Section**

  The procedure has the following limitations:

  1. **Cannot adjudicate positive attributes**: It cannot determine whether omniscience, omnipotence, or any specific attribute is genuinely positive. This depends on substantive philosophical views.

  2. **Theological neutrality**: It cannot resolve theological disputes about the nature of divinity (e.g., whether God must be personal, simple, etc.).

  3. **Formal validity vs. soundness**: It cannot distinguish formal validity from soundness when premises are undefined or circular. It only checks the internal coherence and the specified frame.

  4. **Scope restrictions**: It will misfire on manuscripts that:
     - Employ non-classical quantification (e.g., free logic, many-sorted).
     - Use paraconsistent property logics (which tolerate contradictions without explosion).
     - Employ undefined modal operators (e.g., if the modality is not alethic but, say, deontic).
     - Any system that falls outside classical modal logic with standard quantifiers.

  5. **Premise justification**: It does not evaluate whether the premises are true, only whether they are explicitly stated and the argument is formally valid in the frame.

  6. **Non-standard frames**: It can flag when a frame is not independently justified, but the decision on what counts as sufficient justification is a JUDGMENT CALL and may be subjective.

  Thus, the procedure is a tool for structural evaluation, not a substitute for philosophical engagement.
answer: |-
  ### Evaluation Procedure for Gödel-Style Modal Ontological Arguments

  #### Conceptual Anchors (Must Survive Simplification)
  - **Intensional vs. Extensional Property Ascription**:  
    Intensional properties (e.g., "being omnipotent") must retain consistent identity across worlds; extensional quantification (e.g., sets of entities per world) must not be conflated with property identity.
  - **Consistency of Property Set**:  
    Consistency (joint possible instantiation) must be distinguished from closure under logical operations (e.g., negation, conjunction). Closure risks modal collapse.
  - **Formal Validity vs. Metaphysical Soundness**:  
    Validity (truth preservation in the frame) must be separable from soundness (truth of premises). Frame choice must not presuppose the conclusion.

  #### Expedited Simplifications
  - Omit derivations of standard modal axioms (e.g., S5 reflexivity, symmetry, transitivity).
  - Assume classical quantification and bivalence unless explicitly contested.

  ---

  ### Four-Pass Decision Protocol

  **Pass One—Frame Specification**  
  - **Question**: What is the modal frame (S5, S4, B, KB, or custom accessibility relation), and is it justified independently?  
  - **Textual Evidence Required**:  
    - Explicit declaration of axioms (e.g., "uses S5").  
    - Justification for accessibility restrictions (e.g., "accessibility denotes metaphysical possibility").  
  - **Rule**:  
    - PASS: Frame specified and justified non-circularly (e.g., "S5 is standard for metaphysical modality").  
    - FAIL: Frame unspecified, or justification circular (e.g., "this frame validates God’s existence").  
    - **JUDGMENT CALL**: Justification appeals solely to "intuition" or "tradition" without argument.  

  **Pass Two—Intensional Stability Audit**  
  - **Question**: For each "positive" property, is its extension (set of instantiators) stable across all accessible worlds?  
  - **Textual Evidence Required**:  
    - Definitions of "positive" properties (e.g., "positive properties are those entailing no negation").  
    - Usage in proofs (e.g., "positive in \(w_0\) implies positive in all \(w_i\)").  
  - **Rule**:  
    - PASS: Extensions are uniformly stable (e.g., "positivity is world-invariant").  
    - FAIL (INTENSIONAL EQUIVOCATION): Property treated as world-bound in one step (e.g., evaluation) and trans-world in another (e.g., necessity proof).  
    - **JUDGMENT CALL**: Stability asserted by fiat without explanation (e.g., "by definition, positivity is necessary").  

  **Pass Three—Consistency and Collapse Containment**  
  - **Question**: (A) Is the set of positive properties explicitly consistent? (B) Does the model permit contingent truths post-inference?  
  - **Textual Evidence Required**:  
    - Claim of consistency (e.g., "no contradiction arises from all positive properties").  
    - Analysis of modal collapse (e.g., "all truths become necessary").  
  - **Rule**:  
    - PASS: Consistency claimed and collapse avoided (e.g., "contingent properties exist outside the set").  
    - FAIL: Consistency unstated or collapse unaddressed despite implication (e.g., closure under conjunction forces universal necessity).  
    - **JUDGMENT CALL**: Closure under negation/conjunction used but defended as "logically necessary".  

  **Pass Four—Existential Inference**  
  - **Question**: Where does the move from \(\Diamond \exists x G(x)\) to \(\Box \exists x G(x)\) (for God-like \(G\)) rely on frame axioms vs. unstated existence premises?  
  - **Textual Evidence Required**:  
    - Derivation steps (e.g., "necessary existence entails \(\Diamond \exists x G(x) \rightarrow \Box \exists x G(x)\)").  
    - Premises about existence (e.g., "necessary existence is positive").  
  - **Rule**:  
    - PASS: Step depends validly on frame axioms (e.g., S5 symmetry) and stated premises.  
    - FAIL: Step invalid in frame (e.g., requires S5 but uses S4) or depends on unstated premise (e.g., "existence is a predicate").  
    - **JUDGMENT CALL**: Existence premise justified only by "conceptual analysis".  

  ---

  ### Annotated Cases

  **Case A: Standard Gödel in S5**  
  - **Pass One**: PASS. Frame: S5. Justification: "S5 captures absolute metaphysical possibility".  
  - **Pass Two**: PASS. Positive properties defined as "necessarily desirable", extensions stable.  
  - **Pass Three**: PASS. Consistency: "Positive properties are mutually composable". Collapse avoided: No closure under negation.  
  - **Pass Four**: PASS. \(\Diamond \exists x G(x) \rightarrow \Box \exists x G(x)\) via S5 and necessary existence as positive.  
  - **Outcome**: ACCEPT.  

  **Case B: "Essential" Variant in S4 with Restricted Accessibility**  
  - **Pass One**: JUDGMENT CALL. Frame: S4 with "metaphysically nearby worlds". Justification: "Distant worlds irrelevant to actuality" – weak but non-circular.  
  - **Pass Two**: FAIL. "Essential" properties defined world-relatively (e.g., "essential in \(w_i\)") but used trans-world in necessity proof.  
  - **Pass Three**: JUDGMENT CALL. Consistency claimed. Collapse: Unaddressed; restricted accessibility may not contain distant contingent truths.  
  - **Pass Four**: FAIL. \(\Diamond \exists x G(x) \rightarrow \Box \exists x G(x)\) invalid in S4 (lacks symmetry).  
  - **Outcome**: REJECT (critical FAILs).  

  **Case C: Non-Standard Frame Avoiding Collapse**  
  - **Pass One**: JUDGMENT CALL. Frame: Custom accessibility (e.g., "only worlds sharing actual laws"). Justification: None beyond avoiding collapse.  
  - **Pass Two**: PASS. Positive properties stable by definition.  
  - **Pass Three**: PASS. Consistency explicit; collapse contained by frame restrictions.  
  - **Pass Four**: PASS. Existential inference valid in custom frame.  
  - **Outcome**: REJECT (JUDGMENT CALL in Pass One). Theoretical commitment: Accessibility relations require independent metaphysical grounding; "ad hoc" fails.  

  ---

  ### Limitations and Misfires  
  The procedure **cannot**:  
  1. **Adjudicate specific positive attributes**: E.g., whether "omniscience" is positive depends on theological/philosophical commitments.  
  2. **Resolve theological disputes**: E.g., conflicts over divine simplicity or personhood are out of scope.  
  3. **Distinguish formal validity from soundness**: Premises like "positivity" may be circular or undefined.  
  4. **Handle non-classical formalisms**: Fails for:  
     - Non-classical quantification (e.g., Meinongian objects).  
     - Paraconsistent property logics (e.g., tolerating inconsistent properties).  
     - Undefined modal operators (e.g., epistemic or deontic modalities).  
  5. **Evaluate premise truth**: Only checks internal coherence, not plausibility (e.g., "necessary existence is positive").  
  6. **Override JUDGMENT CALLs**: Reviewer’s metaphysical commitments (e.g., "S5 is sound") affect outcomes.
