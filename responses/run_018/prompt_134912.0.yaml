  Hmm, the colleague seems to be applying a consistent framework. Let me try to identify the common threads. For cases deemed path-dependent, there are self-reinforcing mechanisms like network effects (QWERTY), infrastructure lock-in (left-hand traffic), and sensitivity to initial conditions (Neanderthals). For the inevitable cases, strong functional pressures override contingencies - the metric system meets scientific standardization needs, double-entry bookkeeping solves essential trade problems.

  Now for the transformer case... The user mentions several factors: parallelizable attention was available, GPU clusters were expanding, and there was interest in sequence tasks. But the specific autoregressive approach wasn't the only option - its dominance was boosted by open-source releases and investment patterns rather than clear initial superiority. 

  The colleague would likely see this as path-dependent. Why? Because the lock-in mechanisms resemble QWERTY: once the ecosystem (tools, training, investments) formed around transformers, switching became hard despite other viable options. The functional pressure for better NLP existed, but didn't dictate this specific solution.

  The key rules seem to be: 1) Path dependence occurs when early contingencies create self-reinforcing lock-in, even with suboptimal outcomes. 2) Functional inevitability happens when core needs strongly constrain solutions, making alternatives converge. 

