answer: |-
  ### PhD Comprehensive Exam Question: Contractualism and the Limits of Justification  
  **Time Allowed:** 90 minutes  
  **Marks:** 25  
  **Instructions:**  
  *Critically evaluate whether Scanlon’s contractualist framework can coherently resolve conflicts involving parties with* structurally heterogeneous complaints *(e.g., one party facing bodily deprivation vs. another facing non-welfare-based dignity violation), without collapsing into utilitarianism or permitting universal veto power. Does this challenge reveal a fundamental flaw in contractualism’s account of moral wrongness?*  

  ---

  ### Model Answer Outline: 5 Essential Moves (Total 25 Marks)  
  **Core Insight:** Top answers must treat incommensurability as a *justification-structural* problem, not merely a practical aggregation issue.  

  1. **Diagnose the Heterogeneity Crux (5 marks)**  
     - **Move:** Distinguish *metric-comparable harms* (e.g., varying degrees of physical pain) from *structurally heterogeneous complaints* (e.g., kidney failure vs. symbolic degradation refusing welfare translation). Argue that the latter resist pairwise comparison because no common "currency" exists to weigh dignity against survival.  
     - **Mistake Costing Points:** *Conflating heterogeneous complaints with quantitatively different but homogeneous harms* (e.g., "both are bad, just differently").  

  2. **Interrogate Pairwise Justification Architecture (5 marks)**  
     - **Move:** Explain how Scanlon’s "reasonable rejection" relies on *dyadic comparisons*: Principle P is rejected if *any individual* has a complaint that no alternative principle reasonably addresses. Show that when complaints are incommensurable (e.g., A’s dignity-based rejection vs. B’s survival-based rejection of ~P), the framework lacks resources to adjudicate *between types* of complaints without smuggling in a metric.  
     - **Mistake:** *Assuming Scanlon’s framework implicitly allows cross-complaint weighing* without textual or logical basis.  

  3. **Map Collapse Risks (5 marks)**  
     - **Move:** Demonstrate two failure modes:  
       *(i) Utilitarian collapse:* If complaints are forcibly translated into a common scale (e.g., "dignity harm = X units of welfare"), contractualism becomes disguised aggregation.  
       *(ii) Veto gridlock:* If complaints remain incommensurable, *any* principle may be vetoed (e.g., dignity advocates reject survival-prioritizing principles; bodily-deprived reject dignity-prioritizing ones).  
     - **Mistake:** *Treating collapse risks as hypothetical rather than necessary outcomes of the justification structure*.  

  4. **Distinguish Structural vs. Practical Failure (5 marks)**  
     - **Move:** Contrast this with *standard aggregation objections* (e.g., saving many from minor headaches vs. one from death). There, complaints *are* commensurable (discomfort units), but aggregation is disallowed; here, complaints *lack comparability foundations*. Conclude that this is a *constitutive limit* of pairwise justification, not an epistemic gap.  
     - **Mistake:** *Suggesting better empirical data or "moral imagination" could resolve incommensurability*.  

  5. **Implications for Contractualist Wrongness (5 marks)**  
     - **Move:** Argue that if Scanlon cannot generate principles for heterogeneous conflicts without collapsing, *wrongness* (as "what no one could reasonably reject") is undefined in such cases. This reveals contractualism as *domain-limited*—unable to handle pluralistic value conflicts central to modern moral dilemmas.  
     - **Mistake:** *Deflecting to "all theories have limits" without analyzing how this undermines Scanlon’s universality claims*.  

  ---

  ### Marking Scheme  
  | **Component**                               | **Marks** | **Key Penalty Triggers**                                  |  
  |---------------------------------------------|-----------|-----------------------------------------------------------|  
  | Clear diagnosis of structural heterogeneity | 5         | Vague treatment of "different harms"; misses incommensurability |  
  | Pairwise justification breakdown            | 5         | Misrepresents Scanlon’s rejection mechanism              |  
  | Collapse risks (utilitarian/gridlock)       | 5         | Only addresses one risk; ignores incommensurability’s role |  
  | Structural vs. practical distinction        | 5         | Conflates with classic aggregation cases                 |  
  | Implications for wrongness & domain limits  | 5         | Speculative extensions without grounding in argument     |  

  **Threshold Note:** A passing answer (10 marks) must at least *identify* incommensurability and one collapse risk. To score 20+, all five moves must be present and logically interlinked.  

  ---

  ### Why This Works  
  - **Tests Conceptual Mastery:** Candidates must reconstruct Scanlon’s machinery to expose a fragility rarely detailed in primers.  
  - **Forces Original Reasoning:** The "bodily vs. dignity" scenario requires applying contractualist logic *without* stock aggregation responses.  
  - **Sharpens Meta-Ethical Insight:** The distinction between *practical weighing difficulties* and *structural justificatory incapacity* separates rote memorizers from genuine analysts.  
  - **Closed-Book Friendly:** No citations needed—only mastery of contractualism’s internal architecture.  

  *"A strong answer doesn’t just list objections; it dismantles the justificatory engine to see why it stalls on this terrain."*
