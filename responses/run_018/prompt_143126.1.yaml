answer: |-
  Here is the restatement of the philosophical debate using your specified vocabulary, followed by the translation of key claims and the residue report:

  **Restated Core Debate:**  
  Whether a replication achieving perfect *compositional fidelity* and visual equivalence to an original lacks value due to absent *documented provenance chains*, undetectable *material signatures* (despite surface mimicry), violations of *restoration ethics* (via deception), and the fundamental distinction between *replication* and *continuity of origin*.  

  ---

  ### Translation of Philosophical Claims into Material/Documentation Terms  
  1. **Claim: Value depends on authorship (e.g., the artist's hand).**  
     - *Translation:* Value requires *documented provenance chains* linking creation to a specific maker/workshop, and *detectable material signatures* consistent with that context.  
     - *Distortion:* Reduces "authorship" to verifiable documentation and contextual material evidence. Ignores intangible aspects of creative intent.  

  2. **Claim: Deception vitiates aesthetic worth.**  
     - *Translation:* Intentional falsification of *provenance chains* or masking of *material signatures* violates *restoration ethics* (transparency mandate), nullifying value regardless of *compositional fidelity*.  
     - *Distortion:* Stretches "restoration ethics" beyond conservation practice (which governs treatment, not creation) and conflates ethical violation with aesthetic diminishment.  

  3. **Claim: Originals possess irreproducible "presence" tied to causal history.**  
     - *Translation:* *Continuity of origin* confers unique status via *detectable material signatures* accumulated through time (e.g., aging patinas, micro-traces of historic use) and immutable *provenance chains*. A replication lacks this physical continuum.  
     - *Distortion:* Attempts to materialize "presence" as *signatures* and *continuity* but cannot capture metaphysical notions of aura or historical resonance.  

  ---

  ### Residue Report  
  **1. Clean Mappings to Material Genealogy/Provenance:**  
     - **Provenance chains** directly anchor debates about authorship and historical context.  
     - **Detectable material signatures** validate claims of origin and age (e.g., anachronistic pigments).  
     - **Replication vs. continuity of origin** cleanly separates modern copies from historically continuous objects.  
     - **Compositional fidelity** addresses technical skill but is secondary to documented history.  

  **2. Requires Semantic Stretching (Technical Terms Distorted):**  
     - **"Authenticity":** In conservation, it denotes *material and historical verifiability*. Stretched when used to imply intangible qualities ("aura") or justify value beyond verification.  
     - **"Restoration ethics":** Professionally governs conservation actions (e.g., reversibility). Distorted when applied to forgeries' creation (a legal/moral issue).  
     - **Aesthetic worth:** No conservation parameter measures this; debates linking material deception to aesthetic nullity overreach lab frameworks.  

  **3. No Counterpart in the Framework:**  
     - **The "Irreproducible Presence":** The claim that an original retains value *even if* perfectly replicated materially and visually has **no counterpart** in conservation science. The framework treats an object as a vessel of *documented history* and *tangible evidence*. Once *provenance chains* and *material signatures* are falsified or absent, the object is categorically distinct from the original—regardless of perceptual equivalence. The notion of a residual, non-material "essence" (e.g., Benjamin’s "aura") is **unintelligible** within this framework.  

  ---

  ### Conclusion: The Framework's Limit  
  The concept of an original possessing value *transcending perfect material replication* marks a **boundary of conservation science**. Your framework identifies value solely through *intact and transparent physical composition* (verified by spectroscopy) and *documented history* (provenance). Any claim that an original holds value *beyond* these parameters—e.g., metaphysical uniqueness tied to causal history—operates outside material genealogy. Conservation science can deconstruct forgery through material signatures and provenance gaps but cannot adjudicate debates about "presence" that reject physical evidence as sufficient. This residue is philosophical, not technical.
