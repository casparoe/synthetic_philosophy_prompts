prompt: |-
  im in my metaphysics seminar on Bradley's regress and the unity of the proposition. i also just finished a course on typed lambda calc and the curry-howard correspondence, so im wondering if you can restate the whole debate in that vocabulary: propositions as well-typed terms, relations as functions, and the unity problem as whether applying a relation to args produces a valid term without an extra constructor. cover the internal-relation view, the primitive-fact view, and Bradley's absolute-view. for each say what translates clean, what gets distorted, and what has no expression at all (especially the reality/appearance distinction). then tell me whether the leftover residue is a failure of the programming analogy or proof that Bradley was smuggling metaphysical assumptions. keep it to one paragraph max and dont bother with citations.
reasoning: |-
  We are translating the unity of the proposition debate into the language of typed lambda calculus and Curry-Howard.
   Propositions are well-typed terms (types as propositions, terms as proofs). Relations are functions (e.g., a binary relation is a function of type A → B → Prop). The unity problem: applying a relation R to arguments a and b should yield a unified proposition R a b (of type Prop), without needing an extra "unifier" (which would lead to an infinite regress).

   Internal-relation view (e.g., Russell early): Relations are incomplete and require arguments to form a unity. In lambda terms, R a b is a valid term of type Prop by function application. This translates cleanly: the application is primitive.

   Primitive-fact view (e.g., Russell later, Wittgenstein's atomic facts): The proposition is a basic, unanalyzable unit. In lambda calculus, we might represent this by having a base type for facts (e.g., Fact) and no internal structure. This distorts the internal structure of the proposition because we cannot break it down into function and arguments.

   Bradley's absolute view: Relations are unreal (appearance); only the Absolute is real. Applying a relation to arguments cannot yield a unified proposition without an extra unifier (leading to regress). The reality/appearance distinction has no direct expression: we cannot represent the Absolute in the system, and the regress is an infinite type (e.g., needing a term of type Unifier (R a b), then Unifier (Unifier (R a b)), etc.), which is not well-founded. The leftover residue (the regress and the reality/appearance gap) is due to Bradley smuggling metaphysical assumptions (e.g., that unity requires an additional entity) that the lambda calculus shows are unnecessary because function application is primitive.

   Conclusion: The regress in the lambda calculus view is avoided by taking application as primitive. Bradley's worry is an artifact of requiring an extra metaphysical glue, which the programming analogy (via Curry-Howard) does not need. Thus, the residue is proof that Bradley was smuggling assumptions.
answer: |-
  In typed lambda calculus via Curry-Howard, propositions are well-typed terms (e.g., a binary relation \( R \) as \( \lambda x. \lambda y. P : A \to B \to \ast \)), and unity is the valid term formed by application (\( R \, a \, b \)). The **internal-relation view** translates cleanly: application is primitive, avoiding regress by beta-reduction, with no extra "unifier" needed. The **primitive-fact view** (propositions as atomic types) distorts by denying internal structure, making relational logic inexpressible without ad-hoc base types. **Bradley's absolute view** has no expression: the reality/appearance distinction (relations as illusory fragments of an Absolute) cannot be captured, as lambda calculus lacks a "non-apparent" semantic layer, and the infinite regress (demanding a higher-order unifier function) manifests as non-termination or ill-founded types. The residue—Bradley's insistence on regress—exposes smuggled metaphysical assumptions (that unity *must* require external glue), not a failure of the programming analogy, which resolves unity via built-in application.
