prompt: |-
  Hey, I'm running a workshop for sociology grad students — smart, but zero analytic phil background — and I want them to understand standing to blame and why hypocrisy undermines it. I'm framing it around a distinction I'm calling mirror vs structural hypocrisy: mirror is blaming you for the exact fault you have (like screaming at someone for being loud), structural is blaming you for X while I do Y, where X and Y share the same underlying moral form — say I call out a colleague for free-riding on shared lab protocols but I'm free-riding on departmental service commitments. I think they disqualify differently, and I want the session built around that.

  Don't explain it to me; plan how I'd teach it. What's the right dependency order — do they need to see standing as an entitlement rather than a reward for virtue before we even introduce hypocrisy, or after? What's the one carrying exmaple that has to contain both mirror and structural versions, and what must it have and lack? I want to avoid the tired 'adultery preacher' case since it's too obvious. What misconceptions will they bring — probably that hypocrisy is just being a bad messanger — and exactly where in the sequence should I head each off? Give me a quick check at the end to see if they grasp why structural hypocrisy is trickier than mirror. And tell me what I should flat-out refuse to explain at this level — I don't want to wander into whether blame is fundamentally a speech act or some deep Kantian machinery they won't follow.
reasoning: |-
  Okay, the user is preparing a workshop for sociology grad students on the concepts of standing to blame and how hypocrisy undermines it. They've introduced a distinction between mirror and structural hypocrisy and want to focus on how each disqualifies standing differently. The students have no background in analytic philosophy, so the approach needs to be accessible yet precise.

  First, I need to consider the dependency order. The user is debating whether to introduce standing as an entitlement before hypocrisy or after. Starting with standing makes sense because it sets the foundation. Without understanding that standing is about the right to hold others accountable rather than being virtuous, the students might conflate it with moral authority. Using relatable examples like a negligent parent criticizing a child's homework could illustrate this distinction. The key is to establish that standing isn't earned through good behavior but is about the relationship and context.

  Next, introducing hypocrisy. Mirror hypocrisy is more straightforward—blaming someone for the exact fault you have. Structural is trickier because it involves different actions sharing a moral form. The user wants to avoid the cliché adultery preacher example. A workplace scenario might work better, like a project team member calling out missed deadlines while shirking other responsibilities. This example needs to clearly show both types without overlapping. For instance, mirror could be both missing deadlines, structural could be missing deadlines versus avoiding collaborative tasks, both under the umbrella of unreliability.

  Misconceptions are important to address. Students might think hypocrisy only makes someone a bad messenger but doesn't invalidate their point. This should be tackled early when discussing why hypocrisy undermines standing. Emphasize that the issue isn't the message but the blamer's position. Also, sociology students might overemphasize systemic factors, so clarifying that structural hypocrisy is about individual accountability within systems is crucial.

  For the quick check, a scenario where they identify both hypocrisies and explain why structural is harder to detect would test comprehension. Asking why it's not just "bad messenger" reinforces the standing concept.

  The user wants to avoid deep philosophical tangents. So, explicitly state that discussions on blame as a speech act or Kantian ethics are off-limits. Focus on practical implications and relational dynamics instead.

  Overall, the structure should flow from foundational concepts to specific types of hypocrisy, using relatable examples, addressing misconceptions at each step, and capping with an application exercise. Keeping it grounded in sociology contexts will help students grasp the nuances without getting lost in philosophy.
answer: |-
  Here’s a battle-tested workshop plan focusing on clarity, engagement, and avoiding philosophical rabbit holes, structured around your mirror/structural distinction:

  **Core Sequence & Dependencies:**

  1.  **Hook: The Blame Stalemate (15 mins)**
      *   **Activity:** Present a quick, relatable scenario where blame feels "off" but the facts aren't disputed. *Example:* A student chronically late to class berates a classmate for being 2 minutes late to a group meeting. *Ask:* "Is the late student *wrong* to be annoyed? Probably. But does the *chronically* late student *get* to be the one to call them out? Why/why not?"
      *   **Goal:** Elicit intuitions about legitimacy/entitlement to blame, separate from the accuracy of the criticism. Introduce the feeling of "You can't say that to *me*!"

  2.  **Foundations: Standing as Entitlement (Not Virtue) (20 mins)**
      *   **Key Move:** **Define "Standing to Blame" upfront as:** *The normative position or relationship that gives someone the legitimate authority or right to hold another person accountable for a specific moral failing in a specific context.* Emphasize: It's about **position/relationship**, not moral saintliness.
      *   **Analogy:** A judge needs the *position* (appointment, jurisdiction) to sentence you, not personal perfection. A parent generally has standing to correct their child on homework habits, even if they procrastinate on taxes.
      *   **Crucial Contrast:** Explicitly distinguish: "Standing is **NOT** a reward you earn for being morally perfect. It's about the **context** and your **relation** to the wrong and the wrongdoer." *Head off the "bad messenger" misconception here:* "It's not that their *message* is wrong (it might be right!), it's that *they* aren't in the right position to *deliver* this particular blame *to this person* right now."
      *   **Why First?** This is essential groundwork. If they think standing is earned by virtue, hypocrisy *automatically* destroys it. Your structural distinction requires understanding standing as relational/contextual first.

  3.  **Introducing the Hypocrisy Problem (10 mins)**
      *   **Pivot:** "So, what *can* undermine this position of standing? A major factor is **hypocrisy** – holding others to standards you flagrantly violate yourself. But not all hypocrisy is the same..."
      *   **Stakes:** Explain *why* hypocrisy matters: It signals unfairness, undermines trust in the blamer's commitment to the norm, exploits social power, and often involves disrespect ("Do as I say, not as I do").

  4.  **Introducing Mirror vs. Structural Hypocrisy (The Core Distinction) (20 mins)**
      *   **The Carrying Example: Workplace Responsibility Failures**
          *   **Scenario:** Alex and Bo are colleagues on a project team.
          *   **Mirror Hypocrisy:** Alex publicly berates Bo for missing a critical project deadline (calling them "irresponsible")... while Alex *themselves* missed the exact same deadline last month (and hasn't acknowledged it).
          *   **Structural Hypocrisy:** Alex publicly berates Bo for "undermining team cohesion" by not participating in shared brainstorming sessions (a form of collaborative free-riding)... while Alex *themselves* consistently avoids taking their turn doing the essential, time-consuming task of compiling the team's weekly progress reports (a form of procedural free-riding). *Underlying Moral Form:* Shirking shared responsibilities essential for the team's functioning.
      *   **Why This Example Works:**
          *   **Relatable:** Academia-adjacent context.
          *   **Clarity:** Mirror = *exact same* failing (late deadline). Structural = *different concrete actions* (not brainstorming vs. not compiling reports) sharing the *same underlying failing* (free-riding on essential team duties).
          *   **Lacks:** Overused tropes, extreme moralizing, obvious villainy. Focuses on common professional dynamics.
      *   **Guided Discussion:** "How is Alex's position to blame Bo undermined in each case? Does it feel different? Why?"

  5.  **Different Disqualification Mechanics (25 mins)**
      *   **Mirror Hypocrisy - The Direct Undercut:** "Alex *literally just did the thing* they're blaming Bo for. It directly contradicts their claim to be upholding the standard *in this specific domain*. Their standing collapses under the weight of immediate, undeniable inconsistency. Bo can rightly say: 'You did this *exact thing*!'"
      *   **Structural Hypocrisy - The Erosion of Moral Authority:** "Alex is blaming Bo for a *type* of failing (shirking *core team duties*) that Alex *themselves* is guilty of, just in a different *manifestation*. It reveals Alex doesn't genuinely respect the *underlying principle* (shared responsibility). This erodes their credibility to speak *as an enforcer of that principle*. Bo can say: 'You demand I contribute *here*, but you refuse to contribute *there* – you don't actually care about shared work!'" Emphasize it requires identifying the shared moral form.
      *   **Key Insight:** Mirror hypocrisy often destroys standing outright for *that specific act*. Structural hypocrisy undermines standing to blame for *faults falling under that shared moral principle* by exposing insincerity.

  6.  **Addressing Likely Misconceptions (Integrated & Explicit):**
      *   **"It's just bad messaging / harms credibility"**: Head this off explicitly in **Step 2 (Standing as Entitlement)** and revisit in **Step 5**. Hammer home: "The problem isn't that Bo won't *listen* (bad messenger), it's that Alex *lacks the right* to level *this specific criticism* given their own actions."
      *   **"But the hypocrite might still be *right*!"**: Acknowledge this quickly in Step 3 or 5: "Absolutely! The *truth* of the criticism is separate. But standing is about *who gets to deliver it effectively and legitimately*."
      *   **Sociology Lens Over-Application:** They might jump to *only* systemic explanations ("Alex is structurally pressured!"). Gently refocus: "We're analyzing the *interpersonal standing* dynamic *within* that system. Does Alex's *individual* free-riding, regardless of cause, position them badly to blame Bo's free-riding?"

  7.  **Quick Check: Structural vs. Mirror Nuance (10 mins)**
      *   **Activity:** Present a *new*, brief scenario involving, say, environmental commitments (e.g., blaming someone for driving an SUV while you fly constantly for leisure). *Ask:* "Is this mainly mirror or structural hypocrisy? *Why* is it potentially trickier to call out than someone blaming you for driving an SUV while they drive an identical SUV themselves?"
      *   **What You Want to Hear:** They identify the first as structural (different actions - driving gas guzzler vs. frequent flying - sharing the form "excessive personal carbon footprint"), the second as mirror. They should note structural is trickier because:
          1.  Requires identifying the shared moral failing (carbon footprint, not just driving).
          2.  The hypocrite can more easily deflect ("But flying is necessary! My miles are different!") than with mirror hypocrisy ("You did the *exact same thing*").
          3.  Demonstrates how structural hypocrisy can be concealed or rationalized.

  8.  **Wrap-up & Application (10 mins)**
      *   Reiterate the core: Standing is about position/relationship. Hypocrisy undermines it. Mirror = direct contradiction on the act. Structural = inconsistency on the underlying principle, eroding moral authority.
      *   **Sociology Connection Prompt:** "How might this framework help analyze dynamics of accountability within communities, organizations, or social movements? Where might 'standing' be contested beyond simple hypocrisy?" (Plant seeds for their work).

  **What to FLAT-OUT REFUSE to Explain (Politely):**

  *   **"Is blame fundamentally a speech act?"** "That's a deep philosophical debate about the nature of blame itself. For our practical purposes today, we're focusing on the *conditions under which someone is positioned to effectively and legitimately* engage in blaming behavior, however you define the act."
  *   **"But what about moral relativism / different standards?"** "We're assuming a shared normative context for the sake of analyzing hypocrisy's impact *within* that context. Debating the validity of the norm itself is a separate, huge question."
  *   **"Kantian Universalizability / Categorical Imperative"** "While philosophers connect hypocrisy to consistency, we don't need the full Kantian machinery. We're focusing on the practical, relational impact on standing in specific situations."
  *   **"Deep Meta-Ethics (e.g., error theory, expressivism)"** "Our discussion operates at the level of interpersonal normative practices common in social life. We're not digging into the ultimate foundations of morality today."
  *   **"Every possible exception or edge case"** "We're focusing on clear core cases to build the framework. Real life is messier, but this gives you tools to start analyzing."

  **Key Teaching Mantras for the Session:**

  *   **"Standing is about POSITION, not perfection."**
  *   **"Mirror: Same exact act. Structural: Same underlying wrong."**
  *   **"It's not that the message is wrong, it's that THIS messenger isn't entitled to deliver THIS blame HERE."**

  This structure builds from intuitions, establishes the crucial concept of standing as entitlement *first*, layers on the two types of hypocrisy using a strong carrying example, explicitly tackles misconceptions as they naturally arise, and provides a targeted check for the structural/mirror nuance – all while ruthlessly avoiding philosophical swamps. Good luck with the workshop!
